          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "S", maturity_rating: "PG", runtime_minutes: 50, downloadable: true, license_size_mb: 300 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "xa@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acctA: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "xb@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acctB: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acctA}", display_name: "PA", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acctA}"
              captures: { profA: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acctB}", device_label: "DB", platform: "TV", supports_hd: true }
              as: AccountOwner
              as_user_id: "${acctB}"
              captures: { devB: $.data.id }
          trigger:
            - call: "POST /stream-sessions"
              payload: { profile_id: "${profA}", device_id: "${devB}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${profA}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CROSS_ACCOUNT_REFERENCE"

      - name: device_busy_overlap_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEVICE_BUSY]"]
        excluded_because:
          difficulty_instance: device_single_occupancy_halfopen_span
          rationale: "ERR_DEVICE_BUSY is the asserted failure of the named §1.8 device-overlap instance."

      - name: curfew_blocked_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_CURFEW_BLOCKED]"]
        excluded_because:
          difficulty_instance: curfew_window_wraps_midnight
          rationale: "ERR_CURFEW_BLOCKED is the asserted failure of the named §1.8 curfew-wrap instance."

      - name: daily_limit_exceeded_corner
        claim_type: violation_to_error
        grounds: ["errors[ERR_DAILY_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: rating_safety_beats_daily_limit_temporal
          rationale: "ERR_DAILY_LIMIT_EXCEEDED is the lower-priority loser asserted in the named §1.8 priority-conflict instance; its standalone trigger is reachable by removing the over-rating condition."

  # =====================================================================
  # RBAC — role denials and ownership
  # =====================================================================
  - section: rbac
    instances:
      - name: profileuser_cannot_create_plan
        claim_type: role_denied
        grounds: ["roles", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A ProfileUser calling POST /subscription-plans (a PlatformAdmin-exclusive op) is denied with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["an existing profile to act as"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "rb@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
          trigger:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_FREE", monthly_fee_cents: 1, max_profiles: 1, concurrent_stream_cap: 1, max_registered_devices: 1, download_quota_per_profile: 0, ad_free: true, hd_offline_allowed: false }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: account_owner_cannot_suspend_other_account
        claim_type: ownership_denied
        grounds: ["roles", "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "An AccountOwner whose X-User-ID is account A cannot suspend account B; returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["two accounts A and B"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "oa@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acctA: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "ob@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acctB: $.data.id, vB: $.data.version }
          trigger:
            - call: "POST /accounts/${acctB}/suspend"
              payload: { expected_account_version: "${vB}" }
              as: AccountOwner
              as_user_id: "${acctA}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_auth_headers_unauthenticated
        claim_type: role_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request to a non-token endpoint (POST /profiles) with the X-User-Role header omitted returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["an account exists"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "ua@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              captures: { err: $.data.error_id }
          assert:
            - "with the X-User-Role/X-User-ID headers omitted, response status == 401 and data.error_id == ERR_UNAUTHENTICATED"

  # =====================================================================
  # Cross-cutting layers — OCC, scheduled actions, soft-deactivation, consistency
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_on_plan_change
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-change-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "A plan-change carrying a stale expected_account_version (the version observed before an earlier plan change advanced it) is rejected with ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["account observed at version v0, then its version advanced by a successful plan change"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_SUPPORTED", monthly_fee_cents: 500, max_profiles: 4, concurrent_stream_cap: 2, max_registered_devices: 4, download_quota_per_profile: 3, ad_free: false, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { plan_ad: $.data.id }
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_prem: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_ad}", owner_email: "occ@x.com", billing_anchor_day: 1, initial_credit_cents: 50000 }
              as: AccountOwner
              captures: { acct_id: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct_id}/plan-changes"
              payload: { to_plan_id: "${plan_prem}", expected_account_version: "${v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /accounts/${acct_id}/plan-changes"
              payload: { to_plan_id: "${plan_ad}", expected_account_version: "${v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_ACCOUNT_VERSION"

      - name: occ_fresh_version_on_invoice_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[invoice-stale-account]", "entities.Account.fields.version"]
        distinguishing_aspect: "Invoicing with the CURRENT expected_account_version succeeds (200), advances version to 2, and sets billing_status INVOICED — the positive counterpart of the stale-version rejection."
        test_recipe:
          setup: ["account freshly created at version 1, billing OPEN, wallet funded"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "occ2@x.com", billing_anchor_day: 1, initial_credit_cents: 5000 }
              as: AccountOwner
              captures: { acct_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/invoice"
              payload: { expected_account_version: "${v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { bs: $.data.billing_status, v1: $.data.version }
          assert:
            - "response status == 200"
            - "data.billing_status == INVOICED"
            - "data.version == 2"

      - name: download_license_expiry_sweep_on_clock_advance
        claim_type: scheduled_actions
        grounds: [state_machines.Download.READY_to_EXPIRED, entities.Download.fields.license_expires_at]
        distinguishing_aspect: "Advancing the clock past a READY download's license_expires_at with run_sweeps=true transitions it to EXPIRED."
        test_recipe:
          setup: ["a READY download whose license_expires_at lies in the near future"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "D", maturity_rating: "G", runtime_minutes: 40, downloadable: true, license_size_mb: 250 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-29T00:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "exp2@x.com", billing_anchor_day: 29 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "Tab", platform: "TABLET", supports_hd: false }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /downloads"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}", quality: "SD" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { dl_id: $.data.id }
            - call: "POST /downloads/${dl_id}/complete"
              as: ProfileUser
              as_user_id: "${prof_id}"
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-08-01T00:00:00Z", run_sweeps: true }
              as: PlatformAdmin
            - call: "GET /downloads/${dl_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { st: $.data.status }
          assert:
            - "Download.${dl_id}.status == EXPIRED"

      - name: archived_profile_excluded_and_name_reusable
        claim_type: soft_delete
        grounds: [state_machines.Profile.ACTIVE_to_ARCHIVED, entities.Profile.fields.status]
        distinguishing_aspect: "An ARCHIVED profile is excluded from GET /accounts/{id}/profiles?status=ACTIVE, and its display_name may be reused by a new profile (uniqueness is scoped to non-ARCHIVED)."
        test_recipe:
          setup: ["account with one profile that is then archived"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "arch@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "Gone", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /profiles/${prof_id}/archive"
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /accounts/${acct_id}/profiles?status=ACTIVE"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "Gone", kind: "TEEN" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { reuse_id: $.data.id }
          assert:
            - "the ACTIVE-filtered list total_count excludes the archived profile"
            - "the second create with display_name Gone succeeds (201) — uniqueness scoped to non-ARCHIVED"

  # =====================================================================
  # Consistency model — immediate
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_active_stream_count
        claim_type: immediate
        grounds: [entities.Account.fields.active_stream_count]
        distinguishing_aspect: "Starting a stream immediately reflects active_stream_count==1 in the same request's subsequent account read (immediate consistency, no lag)."
        test_recipe:
          setup: ["account+profile+device+title"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Now", maturity_rating: "PG", runtime_minutes: 50, downloadable: true, license_size_mb: 300 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-30T10:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "imm@x.com", billing_anchor_day: 30 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV", platform: "TV", supports_hd: true }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /stream-sessions"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${prof_id}"
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { asc: $.data.active_stream_count }
          assert:
            - "Account.${acct_id}.active_stream_count == 1 immediately after the start"
