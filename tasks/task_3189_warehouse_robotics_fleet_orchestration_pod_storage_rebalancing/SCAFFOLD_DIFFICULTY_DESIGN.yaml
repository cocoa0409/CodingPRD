      - name: order_cutoff_strict_inequality
        grounds:
          - state_machines.CustomerOrder.RECEIVED_to_CUTOFF_MISSED
          - entities.CustomerOrder.fields.cutoff_at
        distinguishing_aspect: |
          Boundary on the cutoff metric reached via POST
          /fleet/_clock/set_current_utc: an order whose cutoff_at EQUALS the
          current logical clock is NOT yet CUTOFF_MISSED; one tick past
          (strict >) flips it. Different metric (time, not count) and
          different endpoint from the queue-boundary instance.
        test_recipe:
          setup:
            - "Zone Z1. CustomerOrder O1 with cutoff_at 2026-09-01T10:00:00Z, status RECEIVED (no PickTasks)."
