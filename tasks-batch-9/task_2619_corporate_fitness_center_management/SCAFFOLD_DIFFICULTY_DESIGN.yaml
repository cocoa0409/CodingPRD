    instances:

      # ---------------------------------------------------------------- 1 / 2 --
      - name: room_buffered_closed_interval_rejects_touching_session
        resource_entity: FacilityRoom
        interval_semantics: "closed interval [start, end] expanded by ROOM_TURNOVER_BUFFER_MIN on the end side; touching endpoints conflict, a gap equal to the buffer clears"
        grounds:
          - validations[priority 22].ERR_ROOM_TIME_CONFLICT
          - errors.ERR_ROOM_TIME_CONFLICT
          - constants.ROOM_TURNOVER_BUFFER_MIN
          - endpoints[POST /program-sessions]
          - entities.ProgramSession.fields.scheduled_start_utc
        distinguishing_aspect: |
          Resource = FacilityRoom, semantics = BUFFERED CLOSED interval. The room
          holding a 12:00-12:55Z session is occupied through 13:10Z, so a session
          that starts exactly when the first one ends (12:55Z) is rejected and so is
          one starting at 13:05Z; only a start at 13:10Z — a gap exactly equal to
          ROOM_TURNOVER_BUFFER_MIN — is accepted. Interval arithmetic differs from
          the staff rule in two ways at once: it adds a buffer and it treats the raw
          endpoints as closed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ACTIVE COST_PLUS contract, READY AED, Studio A OPEN, one ACTIVE offering."
