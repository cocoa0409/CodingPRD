      - name: duplicate_scoped_keys_are_rejected_with_their_own_error_ids
        claim_type: error_triggerable
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_PERMIT_NUMBER]
          - errors[ERR_DUPLICATE_CELL_CODE]
          - errors[ERR_DUPLICATE_WELL_CODE]
          - errors[ERR_DUPLICATE_ESTIMATE_YEAR]
        distinguishing_aspect: "Four different uniqueness scopes in one instance: permit_number is global, cell_code is per landfill, well_code is per landfill ACROSS its cells (so two different cells collide), and estimate_year is per landfill. The well case is the one a naive per-cell unique index gets wrong."
        test_recipe:
          setup:
            - "Landfill LF (permit MSW-4417) with cells C-1 and C-2, a GasWell W-1 on C-1, and a 2026 closure estimate on file."
          setup_api_calls:
            - call: "POST /landfills"
