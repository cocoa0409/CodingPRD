            - "HTTP status of the trigger is 422"
            - "DeliveryRun.${run_id}.status == CREWED"
            - "DeliveryRun.${run_id}.load_cubic_feet == 55.0"
            - "GET /inventory-items with status=STAGED returns exactly 0 items"
            - "GET /inventory-items with status=RESERVED returns exactly 2 items"

      - name: corner_error_referral_expired_on_allocate_path
        claim_type: Violation to Error
        grounds: ["errors[ERR_REFERRAL_EXPIRED]", "validations[priority=17]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_bed_bug_check_beats_temporal_referral_expiry_on_allocate
          rationale: "That instance already stands the expired referral up on the allocate path; its assertion pins the safety error as the winner, and the expiry path itself is separately triggered by corner_expired_referral_blocks_voucher_issue."

      - name: corner_error_truck_window_conflict
        claim_type: Violation to Error
        grounds: ["errors[ERR_TRUCK_WINDOW_CONFLICT]", "validations[priority=18]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / truck_pickup_windows_half_open_adjacent_ok_overlap_rejected
          rationale: "Asserted as the second trigger call of the named difficulty instance, together with the adjacent-window success case."

      - name: corner_error_volunteer_window_conflict
        claim_type: Violation to Error
        grounds: ["errors[ERR_VOLUNTEER_WINDOW_CONFLICT]", "validations[priority=19]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / volunteer_rest_buffer_closed_interval_sixty_minutes_conflicts
          rationale: "Asserted as the first trigger call of the named difficulty instance, with the 61-minute clearance as its control."

      - name: corner_error_agency_quota_exhausted
        claim_type: Violation to Error
        grounds: ["errors[ERR_AGENCY_QUOTA_EXHAUSTED]", "validations[priority=28]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / referral_approval_gated_by_partner_agency_quota_state
          rationale: "That instance triggers the quota gate directly and asserts the error id plus the untouched quota_used."

      - name: corner_error_revision_limit_reached
        claim_type: Violation to Error
        grounds: ["errors[ERR_REVISION_LIMIT_REACHED]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / referral_submitted_returned_submitted_revision_cycle
          rationale: "The third resubmit in that cycle is exactly this error's trigger."

      - name: corner_error_client_bed_bug_block
        claim_type: Violation to Error
        grounds: ["errors[ERR_CLIENT_BED_BUG_BLOCK]", "validations[priority=13]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_bed_bug_check_beats_temporal_referral_expiry_on_allocate
          rationale: "That instance asserts the error id and the 422 status on the allocate path."

      - name: corner_error_truck_bed_bug_lockout
        claim_type: Violation to Error
        grounds: ["errors[ERR_TRUCK_BED_BUG_LOCKOUT]", "validations[priority=15]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / run_dispatch_gated_by_truck_bed_bug_lockout_state
          rationale: "That instance stands up the lockout stamp and asserts the dispatch refusal."

  # =========================================================================
  - section: rbac
    instances:

      - name: corner_case_manager_cannot_review_a_referral
