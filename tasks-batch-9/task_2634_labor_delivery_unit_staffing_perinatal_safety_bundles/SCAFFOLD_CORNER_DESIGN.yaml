            - call: POST /support-person-passes
              payload: { encounter_id: "${enc_id}", person_name: "Marcus Boyd", credential_type: "PARTNER", doula_certification_expires_at: "2027-01-01T00:00:00Z" }
              as: PatientAccessCoordinator
