              as: HotelManagerOps
              captures: { sy_call: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sy_deemed: $.data.deemed_approved_budget_count, sy_overdue: $.data.overdue_call_count }
            - call: "GET /hotel-management/budgets"
              payload: { agreement_id: "${sy_agr}", status: "DEEMED_APPROVED" }
              as: AssetManager
            - call: "GET /hotel-management/agreements/${sy_agr}/working-capital-calls"
              payload: { status: "OVERDUE" }
              as: AssetManager
            - call: "GET /hotel-management/budgets"
              payload: { agreement_id: "${sy_agr}", status: "SUBMITTED" }
              as: AssetManager
          assert:
            - "the clock response reports deemed_approved_budget_count == 1 and overdue_call_count == 1"
            - "the DEEMED_APPROVED read that follows immediately reports pagination.total_count == 1 holding ${sy_bud} — matching the counter exactly"
            - "the OVERDUE read reports pagination.total_count == 1 holding ${sy_call} with funded_amount_cents still 0"
            - "the SUBMITTED read reports pagination.total_count == 0 — the swept row left its old status in the same instant it entered the new one"
            - "re-issuing the same clock value returns all five counters at 0, so the sweep is idempotent with respect to already-swept rows"
