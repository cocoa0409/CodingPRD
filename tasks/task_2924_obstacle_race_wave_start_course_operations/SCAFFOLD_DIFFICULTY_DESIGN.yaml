  - rule_id: transitive_cascade
    instances:
      - name: vacating_the_only_marshal_cascades_staff_to_obstacle_to_course_to_wave
        grounds:
          - state_machines.StaffAssignment.CONFIRMED_to_VACATED
          - calculations.obstacle_effective_clearance_rate
          - calculations.course_readiness_posture
          - state_machines.Wave.SCHEDULED_to_HELD
          - calculations.course_bottleneck_capacity
        distinguishing_aspect: |
          A single VACATE on one StaffAssignment walks four links: StaffAssignment -> VACATED
          drives the parent Obstacle's staffing_state to UNSTAFFED, which drives the
          grandparent Course's readiness_posture OPEN -> RESTRICTED, which drives every
          SCHEDULED Wave on that course inside the 45-minute holdback window to HELD with
          hold_reason COURSE_RESTRICTED. The chain is a staffing cascade and it must leave the
          wave's orthogonal roster_status dimension at LOCKED and Course.status at PUBLISHED,
          while bottleneck_capacity_pph collapses to 0 because the UNSTAFFED station's
          effective_clearance_rate_per_min is 0.00.
        test_recipe:
          setup:
            - "One venue with an APPROVED permit; one PUBLISHED 3-obstacle course whose station 3 has marshals_required 1 satisfied by exactly one CONFIRMED marshal (STAFF-5)."
            - "2 water-safety on the water station and 1 medic, so the course readiness_posture is OPEN and bottleneck_capacity_pph is 450."
            - "Wave A1 at 2026-09-12T08:00:00Z capacity 112, roster LOCKED with one checked-in entry, release_status still SCHEDULED (never released)."
            - "The logical clock is moved to 2026-09-12T07:30:00Z, which is inside the 45-minute holdback window ahead of the wave's scheduled start."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
