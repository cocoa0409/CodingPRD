              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
              captures: { hr1: $.data.id }
          trigger:
            - call: "POST /behavioral-health/hearings/${hr1}/record-outcome"
              payload: { outcome: "CONTINUED", findings_note: "Continued at patient counsel's request." }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/hearings"
              payload: { petition_id: "${pet_cy}", advocate_clinician_id: "${c_adv}", scheduled_start_at: "2026-09-04T10:00:00Z", duration_minutes: 30 }
              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
              captures: { hr2: $.data.id }
            - call: "POST /behavioral-health/hearings/${hr2}/record-outcome"
              payload: { outcome: "CONTINUED", findings_note: "Second continuance, treating psychiatrist unavailable." }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/hearings"
