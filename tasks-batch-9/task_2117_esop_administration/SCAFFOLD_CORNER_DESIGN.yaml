            - "GET /participants?plan_id=${plan_a_id} still reports total_count 1"
            - "the same employee_number in plan B returns HTTP 201 with Participant.${pb_id}.employee_number == E-001"

      - name: patch_participant_updates_only_payroll_facts
        claim_type: creation
        grounds:
          - endpoints.PATCH /participants/{participant_id}
          - entities.Participant.fields.eligible_compensation_cents
        distinguishing_aspect: "PATCH with only eligible_compensation_cents rewrites that field and bumps Participant.version to 2 while leaving employee_number, hire_date, status and annual_hours untouched."
        test_recipe:
          setup: ["One OPEN plan with one ACTIVE participant at 10000000 cents of compensation and annual_hours 2000."]
          setup_api_calls:
