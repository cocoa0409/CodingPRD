          assert:
            - "${ptn_w} == 2 and ${ptn_m} == 2 (identical PT input)"
            - "${pp_w} == 6.00 and ${score_w} == 94.00"
            - "${pp_m} == 12.00 and ${score_m} == 88.00"
            - "${score_w} - ${score_m} == 6.00, attributable solely to the pt_unit branch"
            - "ProficiencyEnrollment.${enr_w_id}.status == UNSUCCESSFUL_PARTICIPATION and ProficiencyEnrollment.${enr_m_id}.status == UNSUCCESSFUL_PARTICIPATION"
