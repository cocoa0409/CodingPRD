  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: grant_revision_loop_third_return_auto_denies
        grounds:
          - state_machines.GrantRecommendation.COMPLIANCE_REVIEW_to_RETURNED
          - state_machines.GrantRecommendation.RETURNED_to_SUBMITTED
          - entities.GrantRecommendation.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on GrantRecommendation: COMPLIANCE_REVIEW -> RETURNED ->
          SUBMITTED -> COMPLIANCE_REVIEW loops; the third RETURNED cascades to
          DENIED (terminal). Non-linear cycle on the Grant entity.
        test_recipe:
          setup:
            - "Fund fg ACTIVE non-endowed cash 50000; grantee CLEARED; advisor a1 ACTIVE on fund; grant amount 1000.00 has been returned twice (revision_count == 2) and resubmitted to SUBMITTED then claimed"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Loop Fund", fund_type: "DONOR_ADVISED", endowed: false }
