              as: ClaimsAdjuster
              as_user_id: "adj-001"
          assert:
            - "the first invoice is 422 ERR_INVOICE_AMOUNT_MISMATCH — 150000 + 20000 + 20000 is 190000, not the billed 200000"
            - "the second invoice is 201 with data.status == \"SUBMITTED\", data.covered_allocated_usd == 0 and data.advanced_usd == 0 — nothing is allocated at creation"
            - "the third invoice is 409 ERR_DUPLICATE_INVOICE_REFERENCE — INV-7781 is already used on this claim, and the guard is scoped to the claim"
            - "the allocate against the unknown id is 404 ERR_DEFENSE_INVOICE_NOT_FOUND, not ERR_CLAIM_NOT_FOUND and not a 412"
            - "the real allocate is 200 with data.status == \"ADVANCED\", data.covered_allocated_usd == 200000.00, data.retention_applied_usd == 200000.00, data.advanced_usd == 0.00 and data.unfunded_excess_usd == 0.00 — the whole invoice is absorbed by the outstanding retention"
            - "the claim read shows status == \"DEFENSE_ADVANCING\", retention_remaining_usd == 50000.00 and advanced_defense_usd == 0.00; the policy still reads total_eroded_usd == 0.00 and aggregate_remaining_usd == 10000000.00, and every CoveragePart is still ACTIVE with its full limit"
            - "the repeat allocate, carrying the CURRENT claim version ${claim_v2}, is 409 ERR_INVALID_INVOICE_STATE — the invoice-state guard at priority 47 answers, which is only observable because the stale-version guard at priority 30 was satisfied"
