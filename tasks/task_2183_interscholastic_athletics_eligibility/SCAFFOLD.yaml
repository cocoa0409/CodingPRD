scenario: "desgin task harder than expert level.!!!!2183. Interscholastic Athletics Eligibility & Scheduling (state high school athletic association): eligibility verification (grades/residency/transfer/age), physical & consent form clearance, season calendar & contest scheduling with officials, transportation & release time coordination, participation fee & waiver, injury reporting & return-to-play clearance, playoff seeding & sanctioning rules, coach certification & background check"
domain_name: "interscholastic-athletics-eligibility"
api_prefix: "/athletics"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Contest joins two Schools (many-to-many over the School vertex set); PlayoffSeed is a
  # School x SportSeason junction; Student.previous_school_id points back into School, so the
  # school-to-school transfer relation is a self-referential edge through Student.

  state_machine_shape: parallel_dimensions
  # EligibilityCase carries two independent axes on one row (status x fee_status); Contest and
  # StaffCredential and InjuryReport each carry a cycle; SportSeason is compound (SEEDING_LOCKED
  # requires every child Contest terminal); School is posture-like (sanction_status gates children).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The Registrar who submits a Student's academic record is a different principal from the
  # EligibilityReviewer who rules on the case, and the MedicalOfficer who files an InjuryReport
  # is barred by X-User-ID from issuing that report's return-to-play clearance.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Member school display name."
      - name: classification
        type: enum
        source: input
        description: "Enrollment classification band used to match seasons."
        constraints: "one of C1A, C2A, C3A, C4A, C5A"
      - name: region_code
        type: string
        source: input
        description: "Association region code (e.g. R-NORTH)."
      - name: school_day_end_utc_hhmm
        type: string
        source: input
        default: "20:30"
        description: "UTC wall time at which the instructional day ends; drives release-minute arithmetic."
        constraints: "HH:MM, 24-hour, UTC"
      - name: bus_fleet_size
        type: integer
        source: input
        default: 4
        description: "Number of buses the school can have committed over any one instant."
        constraints: ">= 1"
      - name: max_release_minutes_per_request
        type: integer
        source: input
        default: 240
        description: "Per-request ceiling on instructional minutes a single trip may consume."
        constraints: ">= 0"
      - name: fee_cap_cents
        type: integer
        source: input
        default: 20000
        description: "Ceiling on total participation fees assessed to one student in a school_year."
        constraints: ">= 0"
      - name: venue_concurrent_capacity
        type: integer
        source: input
        default: 1
        description: "Number of home contests the school's venue can host over one instant."
        constraints: ">= 1"
      - name: sanction_status
        type: enum
        source: computed
        default: GOOD_STANDING
        description: "Sanction posture derived from forfeit_count; gates child operations."
        constraints: "one of GOOD_STANDING, PROBATION, SUSPENDED"
      - name: forfeit_count
        type: integer
        source: computed
        default: 0
        description: "Count of Contest rows where forfeiting_school_id equals this school's id."
      - name: release_minutes_used
        type: integer
        source: computed
        default: 0
        description: "Conserved ledger: sum of release_minutes over this school's TransportRequest rows with status IN {APPROVED, COMPLETED}."
      - name: fee_collected_cents
        type: integer
        source: computed
        default: 0
        description: "Conserved ledger: sum over this school's EligibilityCase rows of (fee_paid_cents - fee_refunded_cents)."
      - name: credential_gap_sports
        type: array
        source: computed
        default: []
        description: "Sports for which the school currently holds zero StaffCredential rows with role_title HEAD_COACH and status CLEARED."

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the member school the student currently attends."
      - name: previous_school_id
        type: string
        source: input
        default: null
        description: "FK -> School.id; prior member school when the student transferred, null otherwise."
      - name: full_name
        type: string
        source: input
        description: "Student display name."
      - name: birth_date
        type: string
        source: input
        description: "Date of birth, ISO 8601 date (YYYY-MM-DD); drives the age rung of the eligibility ladder."
      - name: grade_level
        type: integer
        source: input
        description: "Current grade."
        constraints: "9 <= grade_level <= 12"
      - name: residency_verified
        type: boolean
        source: input
        default: false
        description: "Whether the school has verified in-attendance-zone residency."
      - name: residency_verified_on
        type: string
        source: input
        default: null
        description: "ISO 8601 date on which residency was verified; null when residency_verified is false."
      - name: transfer_date
        type: string
        source: input
        default: null
        description: "ISO 8601 date the student enrolled at school_id after leaving previous_school_id; null for non-transfers."
      - name: hardship_waiver_granted
        type: boolean
        source: input
        default: false
        description: "Association-granted hardship waiver that clears the transfer sit-out rung."
      - name: free_reduced_lunch
        type: boolean
        source: input
        default: false
        description: "Free/reduced-lunch status; halves the participation fee line item."
      - name: gpa_prior_period
        type: number
        source: input
        default: null
        description: "Grade point average for the most recently COMPLETED grading period, 3 decimal places."
        constraints: "0.000 <= gpa_prior_period <= 4.000; accepted only on POST /athletics/students/{id}/academic-record, ignored in the POST /athletics/students body"
      - name: gpa_current_period
        type: number
        source: input
        default: null
        description: "Grade point average for the in-progress grading period, 3 decimal places."
        constraints: "0.000 <= gpa_current_period <= 4.000; accepted only on POST /athletics/students/{id}/academic-record, ignored in the POST /athletics/students body"
      - name: credits_prior_period
        type: integer
        source: input
        default: 0
        description: "Credit hours carried in the most recently completed grading period."
        constraints: ">= 0; accepted only on POST /athletics/students/{id}/academic-record"
      - name: credits_current_period
        type: integer
        source: input
        default: 0
        description: "Credit hours carried in the in-progress grading period."
        constraints: ">= 0; accepted only on POST /athletics/students/{id}/academic-record"
      - name: academic_record_submitted_by
        type: string
        source: system
        default: null
        description: "X-User-ID of the Registrar principal that last posted the academic record."
      - name: academic_record_submitted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the academic record was last posted."

  - name: StaffCredential
    parent: School
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the employing member school."
      - name: coach_name
        type: string
        source: input
        description: "Coach display name."
      - name: sport
        type: enum
        source: input
        description: "Sport the credential covers."
        constraints: "one of FOOTBALL, BASKETBALL, TRACK, SOCCER"
      - name: role_title
        type: enum
        source: input
        description: "Coaching role; only HEAD_COACH credentials close a credential_gap_sports entry."
        constraints: "one of HEAD_COACH, ASSISTANT_COACH"
      - name: certification_expires_on
        type: string
        source: input
        description: "ISO 8601 date on which the coaching certification lapses."
      - name: status
        type: enum
        source: system
        default: BACKGROUND_PENDING
        description: "Credential lifecycle state."
        constraints: "one of BACKGROUND_PENDING, CLEARED, DENIED, EXPIRED, REVOKED"
      - name: background_check_completed_on
        type: string
        source: system
        default: null
        description: "ISO 8601 date the background check was adjudicated."
      - name: background_check_reference
        type: string
        source: input
        default: null
        description: "Vendor reference string recorded with the background-check decision."

  - name: SportSeason
    parent: null
    common_fields: true
    fields:
      - name: sport
        type: enum
        source: input
        description: "Sport contested this season."
        constraints: "one of FOOTBALL, BASKETBALL, TRACK, SOCCER"
      - name: classification
        type: enum
        source: input
        description: "Classification band; only schools with the same classification may be scheduled."
        constraints: "one of C1A, C2A, C3A, C4A, C5A"
      - name: school_year
        type: string
        source: input
        description: "School year label, e.g. 2026-2027; scopes the participation-fee family cap."
      - name: sport_tier
        type: enum
        source: input
        description: "Fee/stipend tier for this sport."
        constraints: "one of TIER_A, TIER_B, TIER_C"
      - name: practice_start_date
        type: string
        source: input
        description: "ISO 8601 date on or after which the season may enter PRACTICE_OPEN."
      - name: first_contest_date
        type: string
        source: input
        description: "ISO 8601 date on or after which the season may enter REGULAR_SEASON; also the transfer sit-out reference date."
      - name: season_end_date
        type: string
        source: input
        description: "ISO 8601 date on or after which the season may enter COMPLETED; contests must start strictly before the following midnight UTC."
      - name: age_cutoff_date
        type: string
        source: input
        description: "ISO 8601 date at which a student's age is measured for the age rung."
      - name: residency_deadline
        type: string
        source: input
        description: "ISO 8601 date by which residency must have been verified."
      - name: grading_lock_date
        type: string
        source: input
        description: "ISO 8601 date at/after which the FINAL credit-weighted GPA variant replaces the PROVISIONAL variant."
      - name: contest_limit
        type: integer
        source: input
        description: "Maximum non-terminal-or-played contests a single school may hold in this season."
        constraints: ">= 1"
      - name: required_officials
        type: integer
        source: input
        default: 2
        description: "Number of ACCEPTED OfficialAssignment rows a contest needs to reach OFFICIALS_ASSIGNED."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "Season calendar state."
        constraints: "one of PLANNED, PRACTICE_OPEN, REGULAR_SEASON, SEEDING_LOCKED, PLAYOFFS, COMPLETED, ABANDONED"
      - name: scheduled_contest_count
        type: integer
        source: computed
        default: 0
        description: "Count of Contest rows created against this season."
      - name: seeded_school_count
        type: integer
        source: computed
        default: 0
        description: "Number of PlayoffSeed rows minted by the most recent seeding run."
      - name: unseeded_school_count
        type: integer
        source: computed
        default: 0
        description: "Number of School rows whose classification equals this season's classification and which hold zero contests in the frozen seeding snapshot; these schools receive no PlayoffSeed row."

  - name: EligibilityCase
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the athlete whose eligibility is adjudicated."
      - name: sport_season_id
        type: string
        source: input
        description: "FK -> SportSeason.id; the season the athlete seeks to participate in."
      - name: status
        type: enum
        source: system
        default: INTAKE
        description: "Eligibility axis of this row's two independent state dimensions."
        constraints: "one of INTAKE, UNDER_REVIEW, UNDER_APPEAL, PROVISIONAL_ELIGIBLE, ELIGIBLE, MEDICALLY_SUSPENDED, INELIGIBLE"
      - name: fee_status
        type: enum
        source: system
        default: ASSESSED
        description: "Fee axis of this row's two independent state dimensions; evolves without reference to status."
        constraints: "one of ASSESSED, PARTIALLY_PAID, PAID, WAIVER_REQUESTED, WAIVED, WAIVER_DENIED, REFUNDED"
      - name: ineligibility_reason
        type: enum
        source: computed
        default: null
        description: "Rung of the eligibility ladder that failed on the most recent evaluation; null when the ladder cleared."
        constraints: "one of AGE_LIMIT, RESIDENCY_UNVERIFIED, TRANSFER_SITOUT, DOCS_INCOMPLETE, ACADEMIC_GPA, or null"
      - name: gpa_variant_applied
        type: enum
        source: computed
        default: null
        description: "Which GPA variant the most recent evaluation used."
        constraints: "one of PROVISIONAL, FINAL, or null"
      - name: effective_gpa
        type: number
        source: computed
        default: null
        description: "GPA the academic rung compared against ACADEMIC_MIN_GPA, 3 decimal places."
      - name: fee_amount_cents
        type: integer
        source: computed
        description: "Participation fee assessed at case creation."
      - name: fee_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative cents received against this case."
      - name: fee_waived_cents
        type: integer
        source: computed
        default: 0
        description: "Cents removed by an approved waiver."
      - name: fee_refunded_cents
        type: integer
        source: computed
        default: 0
        description: "Cents returned by refunds."
      - name: fee_outstanding_cents
        type: integer
        source: computed
        description: "fee_amount_cents - fee_paid_cents - fee_waived_cents + fee_refunded_cents."
      - name: appeal_count
        type: integer
        source: computed
        default: 0
        description: "Number of times the case entered UNDER_APPEAL."
      - name: evaluation_count
        type: integer
        source: computed
        default: 0
        description: "Number of completed ladder evaluations on this case."
      - name: provisional_revoked_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant at which a school sanction cascade knocked this case out of PROVISIONAL_ELIGIBLE."
      - name: activated_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant at which the case reached ELIGIBLE."

  - name: ClearanceDocument
    parent: EligibilityCase
    common_fields: false
    fields:
      - name: eligibility_case_id
        type: string
        source: input
        description: "FK -> EligibilityCase.id; the case this clearance form belongs to."
      - name: doc_type
        type: enum
        source: input
        description: "Clearance form type; all three types must be VALID for the documents rung to clear."
        constraints: "one of PHYSICAL, PARENT_CONSENT, CONCUSSION_ACK"
      - name: issued_on
        type: string
        source: input
        description: "ISO 8601 date the form was signed."
      - name: expires_on
        type: string
        source: input
        description: "ISO 8601 date after which the form no longer clears."
      - name: signer_name
        type: string
        source: input
        description: "Physician or guardian who signed the form."
      - name: status
        type: enum
        source: computed
        description: "VALID when expires_on >= the logical clock's UTC date, else EXPIRED. Recomputed on every read."
        constraints: "one of VALID, EXPIRED"

  - name: Contest
    parent: SportSeason
    common_fields: true
    fields:
      - name: sport_season_id
        type: string
        source: input
        description: "FK -> SportSeason.id; the season this contest belongs to."
      - name: home_school_id
        type: string
        source: input
        description: "FK -> School.id; venue owner and release-time payer for the home side."
      - name: away_school_id
        type: string
        source: input
        description: "FK -> School.id; visiting school."
      - name: starts_at
        type: datetime
        source: input
        description: "Scheduled tip/kick instant, ISO 8601 UTC."
      - name: ends_at
        type: datetime
        source: input
        description: "Scheduled end instant, ISO 8601 UTC; must be strictly after starts_at."
      - name: travel_miles
        type: number
        source: input
        description: "One-way miles the assigned officials travel; drives the officials stipend."
        constraints: ">= 0"
      - name: is_playoff
        type: boolean
        source: input
        default: false
        description: "Whether this contest is a post-season bracket game."
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Contest lifecycle state."
        constraints: "one of SCHEDULED, OFFICIALS_ASSIGNED, CONFIRMED, PLAYED, FORFEITED"
      - name: accepted_official_count
        type: integer
        source: computed
        default: 0
        description: "Count of this contest's OfficialAssignment rows with status ACCEPTED."
      - name: home_score
        type: integer
        source: computed
        default: null
        description: "Home points; set by the result endpoint or by the forfeit scoreline."
      - name: away_score
        type: integer
        source: computed
        default: null
        description: "Away points; set by the result endpoint or by the forfeit scoreline."
      - name: forfeiting_school_id
        type: string
        source: computed
        default: null
        description: "FK -> School.id; the school charged with the forfeit, null unless status is FORFEITED."
      - name: hold_reason
        type: enum
        source: computed
        default: null
        description: "Why the contest was pushed back to SCHEDULED by a cascade."
        constraints: "one of COACH_CREDENTIAL_REVOKED, ADMIN_POSTPONE, or null"
      - name: result_recorded_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant at which a result or forfeit was recorded."

  - name: Official
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Official's display name."
      - name: certification_level
        type: enum
        source: input
        description: "Officiating certification level; sets the stipend base."
        constraints: "one of LEVEL_1, LEVEL_2, LEVEL_3"
      - name: home_region_code
        type: string
        source: input
        description: "Region the official is based in."
      - name: accepted_assignment_count
        type: integer
        source: computed
        default: 0
        description: "Count of this official's OfficialAssignment rows with status ACCEPTED."

  - name: OfficialAssignment
    parent: Contest
    common_fields: true
    fields:
      - name: contest_id
        type: string
        source: input
        description: "FK -> Contest.id; the contest being officiated."
      - name: official_id
        type: string
        source: input
        description: "FK -> Official.id; the official offered the game."
      - name: status
        type: enum
        source: system
        default: OFFERED
        description: "Assignment lifecycle state."
        constraints: "one of OFFERED, ACCEPTED, DECLINED, WITHDRAWN"
      - name: stipend_cents
        type: integer
        source: computed
        default: null
        description: "Travel stipend locked at acceptance."
      - name: responded_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the official's accept/decline."

  - name: TransportRequest
    parent: Contest
    common_fields: true
    fields:
      - name: contest_id
        type: string
        source: input
        description: "FK -> Contest.id; the contest the trip serves."
      - name: requesting_school_id
        type: string
        source: input
        description: "FK -> School.id; the school whose fleet and release minutes are consumed."
      - name: bus_count
        type: integer
        source: input
        default: 1
        description: "Buses this trip commits from the requesting school's fleet."
        constraints: ">= 1"
      - name: travel_minutes
        type: integer
        source: input
        description: "One-way travel time in minutes."
        constraints: ">= 0"
      - name: depart_at
        type: datetime
        source: computed
        description: "contest.starts_at minus (travel_minutes + PREGAME_BUFFER_MIN) minutes."
      - name: return_at
        type: datetime
        source: computed
        description: "contest.ends_at plus (travel_minutes + POSTGAME_BUFFER_MIN) minutes."
      - name: release_minutes
        type: integer
        source: computed
        description: "Instructional minutes lost, per calculation transport_release_window."
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Transport lifecycle state."
        constraints: "one of REQUESTED, APPROVED, CANCELLED, COMPLETED"
      - name: cancelled_reason
        type: enum
        source: computed
        default: null
        description: "Why the trip was cancelled."
        constraints: "one of SCHOOL_REQUEST, CONTEST_HOLD_CASCADE, or null"

  - name: InjuryReport
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the injured athlete."
      - name: contest_id
        type: string
        source: input
        default: null
        description: "FK -> Contest.id; the contest during which the injury occurred, null for practice injuries."
      - name: injury_type
        type: enum
        source: input
        description: "Injury classification; CONCUSSION forces the five-stage return-to-play protocol."
        constraints: "one of CONCUSSION, FRACTURE, SPRAIN, OTHER"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical-clock instant the report was filed."
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MedicalOfficer principal that filed the report."
      - name: status
        type: enum
        source: system
        default: REPORTED
        description: "Injury/return-to-play lifecycle state."
        constraints: "one of REPORTED, RTP_IN_PROGRESS, CLEARED, SEASON_ENDED"
      - name: rtp_stage
        type: integer
        source: computed
        default: 0
        description: "Current graduated return-to-play stage."
        constraints: "0 <= rtp_stage <= 5"
      - name: last_stage_advanced_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the most recent stage advance."
      - name: recurrence_count
        type: integer
        source: computed
        default: 0
        description: "Number of symptom recurrences that reset the protocol to stage 1."
      - name: cleared_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the MedicalOfficer principal that issued clearance."
      - name: cleared_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of clearance or season-ending disposition."

  - name: PlayoffSeed
    parent: SportSeason
    common_fields: false
    fields:
      - name: sport_season_id
        type: string
        source: input
        description: "FK -> SportSeason.id; the season whose bracket this row seeds."
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the seeded school."
      - name: wins
        type: integer
        source: computed
        description: "Wins inside the frozen contest snapshot."
      - name: losses
        type: integer
        source: computed
        description: "Losses inside the frozen contest snapshot, including forfeit losses."
      - name: forfeit_losses
        type: integer
        source: computed
        description: "Subset of losses charged as forfeits."
      - name: raw_win_pct
        type: number
        source: computed
        description: "wins / (wins + losses), 4 decimal places, frozen at snapshot step 3."
      - name: opponent_avg_win_pct
        type: number
        source: computed
        description: "Mean of distinct opponents' frozen raw_win_pct, 4 decimal places."
      - name: power_rating
        type: number
        source: computed
        description: "0.65 * raw_win_pct + 0.35 * opponent_avg_win_pct, 4 decimal places."
      - name: seed_number
        type: integer
        source: computed
        description: "1-based bracket position after the tie-break chain."
      - name: tiebreak_trace
        type: string
        source: computed
        description: "Which criterion resolved this row against the row immediately above it."
        constraints: "one of POWER_RATING, RAW_WIN_PCT, HEAD_TO_HEAD, FORFEIT_LOSSES, OPP_AVG_WIN_PCT, CREATED_AT"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: SportSeason
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABANDONED]
    note: "Compound: the REGULAR_SEASON -> SEEDING_LOCKED edge is gated on the aggregate state of every child Contest."
    transitions:
      - from: PLANNED
        to: PRACTICE_OPEN
        trigger: "POST /athletics/sport-seasons/{id}/advance with to_status=PRACTICE_OPEN"
        actor: AssociationAdmin
        preconditions:
          - "logical clock date >= SportSeason.practice_start_date"
        side_effects:
          - "SportSeason.status := PRACTICE_OPEN"
          - "increments SportSeason.version by 1"
      - from: PRACTICE_OPEN
        to: REGULAR_SEASON
        trigger: "POST /athletics/sport-seasons/{id}/advance with to_status=REGULAR_SEASON"
        actor: AssociationAdmin
        preconditions:
          - "logical clock date >= SportSeason.first_contest_date"
        side_effects:
          - "SportSeason.status := REGULAR_SEASON"
          - "increments SportSeason.version by 1"
      - from: REGULAR_SEASON
        to: SEEDING_LOCKED
        trigger: "POST /athletics/sport-seasons/{id}/seed"
        actor: AssociationAdmin
        preconditions:
          - "every Contest with this sport_season_id has status IN {PLAYED, FORFEITED}; otherwise ERR_SEASON_HAS_OPEN_CONTESTS"
          - "at least one Contest with this sport_season_id has status IN {PLAYED, FORFEITED}; otherwise ERR_SEEDING_EMPTY_SNAPSHOT"
        side_effects:
          - "runs calculation playoff_seed_assignment over the frozen contest snapshot"
          - "creates one PlayoffSeed row per school holding >= 1 contest in the snapshot"
          - "SportSeason.seeded_school_count := number of PlayoffSeed rows created"
          - "SportSeason.unseeded_school_count := number of School rows with classification equal to the season's classification that hold zero snapshot contests"
          - "SportSeason.status := SEEDING_LOCKED"
          - "increments SportSeason.version by 1"
      - from: SEEDING_LOCKED
        to: PLAYOFFS
        trigger: "POST /athletics/sport-seasons/{id}/advance with to_status=PLAYOFFS"
        actor: AssociationAdmin
        preconditions:
          - "SportSeason.seeded_school_count >= MIN_BRACKET_SCHOOLS (4); otherwise ERR_BRACKET_TOO_SMALL"
        side_effects:
          - "SportSeason.status := PLAYOFFS"
          - "increments SportSeason.version by 1"
      - from: PLAYOFFS
        to: COMPLETED
        trigger: "POST /athletics/sport-seasons/{id}/advance with to_status=COMPLETED"
        actor: AssociationAdmin
        preconditions:
          - "logical clock date >= SportSeason.season_end_date"
        side_effects:
          - "SportSeason.status := COMPLETED"
          - "increments SportSeason.version by 1"
      - from: REGULAR_SEASON
        to: ABANDONED
        trigger: "POST /athletics/sport-seasons/{id}/advance with to_status=ABANDONED"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "SportSeason.status := ABANDONED"
          - "increments SportSeason.version by 1"

  - entity: StaffCredential
    initial_state: BACKGROUND_PENDING
    terminal_states: [DENIED, REVOKED]
    note: "Cyclic: CLEARED -> EXPIRED -> CLEARED re-credentialing loop driven by the logical-clock checkpoint."
    transitions:
      - from: BACKGROUND_PENDING
        to: CLEARED
        trigger: "POST /athletics/staff-credentials/{id}/background-check with result=CLEARED"
        actor: AssociationAdmin
        preconditions:
          - "logical clock date < StaffCredential.certification_expires_on; otherwise ERR_CREDENTIAL_ALREADY_LAPSED"
        side_effects:
          - "StaffCredential.status := CLEARED"
          - "StaffCredential.background_check_completed_on := logical clock UTC date"
          - "when role_title is HEAD_COACH, removes StaffCredential.sport from School.credential_gap_sports"
          - "increments School.version by 1"
      - from: BACKGROUND_PENDING
        to: DENIED
        trigger: "POST /athletics/staff-credentials/{id}/background-check with result=DENIED"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "StaffCredential.status := DENIED"
          - "StaffCredential.background_check_completed_on := logical clock UTC date"
      - from: EXPIRED
        to: CLEARED
        trigger: "POST /athletics/staff-credentials/{id}/background-check with result=CLEARED and a renewed certification_expires_on"
        actor: AssociationAdmin
        preconditions:
          - "the request supplies renewed_certification_expires_on strictly after the logical clock UTC date; otherwise ERR_CREDENTIAL_ALREADY_LAPSED"
        side_effects:
          - "StaffCredential.certification_expires_on := renewed_certification_expires_on"
          - "StaffCredential.status := CLEARED"
          - "when role_title is HEAD_COACH, removes StaffCredential.sport from School.credential_gap_sports"
          - "increments School.version by 1"
      - from: CLEARED
        to: EXPIRED
        trigger: "system checkpoint inside POST /athletics/_clock/set_current_utc"
        actor: system
        preconditions:
          - "StaffCredential.certification_expires_on <= the new logical clock UTC date"
        side_effects:
          - "StaffCredential.status := EXPIRED"
          - "when role_title is HEAD_COACH and the school now holds zero CLEARED HEAD_COACH credentials for that sport, appends the sport to School.credential_gap_sports"
          - "increments School.version by 1"
      - from: CLEARED
        to: REVOKED
        trigger: "POST /athletics/staff-credentials/{id}/revoke"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "CASCADE-A LINK 1: StaffCredential.status := REVOKED; when role_title is HEAD_COACH and the school now holds zero CLEARED HEAD_COACH credentials for that sport, appends the sport to School.credential_gap_sports and increments School.version by 1"
          - "CASCADE-A LINK 2 (caused by link 1 only): because School.credential_gap_sports now contains that sport, every Contest whose sport_season_id names a season with that sport, whose home_school_id is this school, whose status IN {OFFICIALS_ASSIGNED, CONFIRMED} and whose starts_at > the logical clock reverts to status SCHEDULED with hold_reason := COACH_CREDENTIAL_REVOKED, accepted_official_count := 0, and every OfficialAssignment on it with status IN {OFFERED, ACCEPTED} moves to WITHDRAWN (decrementing Official.accepted_assignment_count for each ACCEPTED row)"
          - "CASCADE-A LINK 3 (caused by link 2 only): because those contests left {OFFICIALS_ASSIGNED, CONFIRMED}, every TransportRequest whose contest_id is one of them and whose status is APPROVED moves to CANCELLED with cancelled_reason := CONTEST_HOLD_CASCADE"
          - "CASCADE-A LINK 4 (caused by link 3 only): because those trips became CANCELLED, School.release_minutes_used of each trip's requesting_school_id is decremented by that trip's release_minutes, preserving invariant release_minutes_conservation"

  - entity: EligibilityCase
    initial_state: INTAKE
    terminal_states: []
    note: "Two independent dimensions live on one row. Dimension 1 is `status` (transitions below with dimension: status); dimension 2 is `fee_status` (dimension: fee_status). Neither dimension's transitions read the other's current value, except the single guarded edge PROVISIONAL_ELIGIBLE -> ELIGIBLE, which reads fee_status."
    transitions:
      - from: INTAKE
        to: PROVISIONAL_ELIGIBLE
        dimension: status
        trigger: "POST /athletics/eligibility-cases/{id}/evaluate"
        actor: EligibilityReviewer
        preconditions:
          - "SportSeason.status IN {PRACTICE_OPEN, REGULAR_SEASON}; otherwise ERR_SEASON_NOT_OPEN"
          - "Student.academic_record_submitted_at is not null; otherwise ERR_ACADEMIC_RECORD_MISSING"
          - "X-User-ID differs from Student.academic_record_submitted_by; otherwise ERR_SEGREGATION_OF_DUTIES"
          - "calculation eligibility_ladder_evaluation returns no failing rung"
        side_effects:
          - "EligibilityCase.status := PROVISIONAL_ELIGIBLE"
          - "EligibilityCase.ineligibility_reason := null"
          - "EligibilityCase.gpa_variant_applied and EligibilityCase.effective_gpa := outputs of calculation academic_gpa_evaluation"
          - "EligibilityCase.evaluation_count incremented by 1"
      - from: INTAKE
        to: INELIGIBLE
        dimension: status
        trigger: "POST /athletics/eligibility-cases/{id}/evaluate"
        actor: EligibilityReviewer
        preconditions:
          - "SportSeason.status IN {PRACTICE_OPEN, REGULAR_SEASON}; otherwise ERR_SEASON_NOT_OPEN"
          - "Student.academic_record_submitted_at is not null; otherwise ERR_ACADEMIC_RECORD_MISSING"
          - "X-User-ID differs from Student.academic_record_submitted_by; otherwise ERR_SEGREGATION_OF_DUTIES"
          - "calculation eligibility_ladder_evaluation returns a failing rung"
        side_effects:
          - "EligibilityCase.status := INELIGIBLE"
          - "EligibilityCase.ineligibility_reason := the first failing rung in the pinned ladder order"
          - "EligibilityCase.gpa_variant_applied and EligibilityCase.effective_gpa := outputs of calculation academic_gpa_evaluation (populated on every evaluation, including rungs that fail before ACADEMIC)"
          - "EligibilityCase.evaluation_count incremented by 1"
      - from: INELIGIBLE
        to: UNDER_APPEAL
        dimension: status
        trigger: "POST /athletics/eligibility-cases/{id}/appeal"
        actor: SchoolAthleticDirector
        preconditions:
          - "EligibilityCase.appeal_count < MAX_APPEALS (2); otherwise ERR_APPEAL_LIMIT_REACHED"
        side_effects:
          - "EligibilityCase.status := UNDER_APPEAL"
          - "EligibilityCase.appeal_count incremented by 1"
      - from: UNDER_APPEAL
        to: PROVISIONAL_ELIGIBLE
        dimension: status
        trigger: "POST /athletics/eligibility-cases/{id}/evaluate"
        actor: EligibilityReviewer
        preconditions:
          - "same preconditions as the INTAKE -> PROVISIONAL_ELIGIBLE edge"
        side_effects:
          - "identical to the INTAKE -> PROVISIONAL_ELIGIBLE edge; closes the appeal loop UNDER_APPEAL -> PROVISIONAL_ELIGIBLE"
      - from: UNDER_APPEAL
        to: INELIGIBLE
        dimension: status
        trigger: "POST /athletics/eligibility-cases/{id}/evaluate"
        actor: EligibilityReviewer
        preconditions:
          - "same preconditions as the INTAKE -> INELIGIBLE edge"
        side_effects:
          - "identical to the INTAKE -> INELIGIBLE edge; the case may appeal again while appeal_count < 2, forming the INELIGIBLE -> UNDER_APPEAL -> INELIGIBLE cycle"
      - from: UNDER_REVIEW
        to: PROVISIONAL_ELIGIBLE
        dimension: status
        trigger: "POST /athletics/eligibility-cases/{id}/evaluate"
        actor: EligibilityReviewer
        preconditions:
          - "same preconditions as the INTAKE -> PROVISIONAL_ELIGIBLE edge"
        side_effects:
          - "identical to the INTAKE -> PROVISIONAL_ELIGIBLE edge"
      - from: UNDER_REVIEW
        to: INELIGIBLE
        dimension: status
        trigger: "POST /athletics/eligibility-cases/{id}/evaluate"
        actor: EligibilityReviewer
        preconditions:
          - "same preconditions as the INTAKE -> INELIGIBLE edge"
        side_effects:
          - "identical to the INTAKE -> INELIGIBLE edge"
      - from: PROVISIONAL_ELIGIBLE
        to: ELIGIBLE
        dimension: status
        trigger: "POST /athletics/eligibility-cases/{id}/activate"
        actor: EligibilityReviewer
        preconditions:
          - "School of the case's Student has sanction_status != SUSPENDED; otherwise ERR_SCHOOL_SANCTIONED"
          - "that School holds >= 1 StaffCredential with sport = SportSeason.sport, role_title = HEAD_COACH, status = CLEARED and certification_expires_on > the logical clock UTC date; otherwise ERR_COACH_NOT_CREDENTIALED"
          - "EligibilityCase.fee_outstanding_cents == 0; otherwise ERR_FEE_OUTSTANDING"
        side_effects:
          - "EligibilityCase.status := ELIGIBLE"
          - "EligibilityCase.activated_at := logical clock instant"
      - from: ELIGIBLE
        to: MEDICALLY_SUSPENDED
        dimension: status
        trigger: "system side effect of POST /athletics/injury-reports"
        actor: system
        preconditions:
          - "the new InjuryReport's student_id matches this case's student_id and the case status is ELIGIBLE"
        side_effects:
          - "EligibilityCase.status := MEDICALLY_SUSPENDED"
      - from: MEDICALLY_SUSPENDED
        to: ELIGIBLE
        dimension: status
        trigger: "system side effect of POST /athletics/injury-reports/{id}/clear with disposition=RETURN_TO_PLAY"
        actor: system
        preconditions:
          - "no other InjuryReport for this student has status IN {REPORTED, RTP_IN_PROGRESS}"
        side_effects:
          - "EligibilityCase.status := ELIGIBLE"
      - from: PROVISIONAL_ELIGIBLE
        to: UNDER_REVIEW
        dimension: status
        trigger: "system side effect of the School sanction cascade fired by POST /athletics/contests/{id}/forfeit"
        actor: system
        preconditions:
          - "the case's Student.school_id names a School whose sanction_status just moved GOOD_STANDING -> PROBATION"
        side_effects:
          - "CASCADE-B LINK 3: EligibilityCase.status := UNDER_REVIEW and EligibilityCase.provisional_revoked_at := logical clock instant"
      - from: ASSESSED
        to: PARTIALLY_PAID
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-payments"
        actor: SchoolAthleticDirector
        preconditions:
          - "0 < amount_cents < EligibilityCase.fee_outstanding_cents"
        side_effects:
          - "EligibilityCase.fee_paid_cents incremented by amount_cents"
          - "EligibilityCase.fee_outstanding_cents recomputed"
          - "School.fee_collected_cents incremented by amount_cents"
      - from: ASSESSED
        to: PAID
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-payments"
        actor: SchoolAthleticDirector
        preconditions:
          - "amount_cents == EligibilityCase.fee_outstanding_cents; amount_cents > fee_outstanding_cents raises ERR_FEE_OVERPAYMENT"
        side_effects:
          - "EligibilityCase.fee_paid_cents incremented by amount_cents"
          - "EligibilityCase.fee_outstanding_cents := 0"
          - "School.fee_collected_cents incremented by amount_cents"
      - from: PARTIALLY_PAID
        to: PAID
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-payments"
        actor: SchoolAthleticDirector
        preconditions:
          - "amount_cents == EligibilityCase.fee_outstanding_cents"
        side_effects:
          - "EligibilityCase.fee_paid_cents incremented by amount_cents; fee_outstanding_cents := 0; School.fee_collected_cents incremented by amount_cents"
      - from: ASSESSED
        to: PAID
        dimension: fee_status
        trigger: "system initialization inside POST /athletics/eligibility-cases when calculation participation_fee_assessment yields 0"
        actor: system
        preconditions:
          - "fee_amount_cents == 0"
        side_effects:
          - "EligibilityCase.fee_status := PAID with fee_paid_cents 0 and fee_outstanding_cents 0"
      - from: ASSESSED
        to: WAIVER_REQUESTED
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-waiver-requests"
        actor: SchoolAthleticDirector
        preconditions:
          - "EligibilityCase.fee_outstanding_cents > 0 (always true from ASSESSED, since a zero-fee case is initialised straight to PAID)"
        side_effects:
          - "EligibilityCase.fee_status := WAIVER_REQUESTED"
      - from: PARTIALLY_PAID
        to: WAIVER_REQUESTED
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-waiver-requests"
        actor: SchoolAthleticDirector
        preconditions:
          - "EligibilityCase.fee_outstanding_cents > 0"
        side_effects:
          - "EligibilityCase.fee_status := WAIVER_REQUESTED"
      - from: WAIVER_REQUESTED
        to: WAIVED
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-waiver-decisions with decision=APPROVE"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "EligibilityCase.fee_waived_cents := EligibilityCase.fee_outstanding_cents at the moment of approval"
          - "EligibilityCase.fee_outstanding_cents := 0"
          - "EligibilityCase.fee_status := WAIVED"
      - from: WAIVER_REQUESTED
        to: WAIVER_DENIED
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-waiver-decisions with decision=DENY"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "EligibilityCase.fee_status := WAIVER_DENIED"
      - from: WAIVER_DENIED
        to: PAID
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-payments"
        actor: SchoolAthleticDirector
        preconditions:
          - "amount_cents == EligibilityCase.fee_outstanding_cents"
        side_effects:
          - "EligibilityCase.fee_paid_cents incremented by amount_cents; fee_outstanding_cents := 0; School.fee_collected_cents incremented by amount_cents"
      - from: PAID
        to: REFUNDED
        dimension: fee_status
        trigger: "POST /athletics/eligibility-cases/{id}/fee-refunds"
        actor: AssociationAdmin
        preconditions:
          - "EligibilityCase.fee_paid_cents - EligibilityCase.fee_refunded_cents > 0; otherwise ERR_NOTHING_TO_REFUND. A zero-fee case is initialised to PAID with fee_paid_cents 0, so it reaches this fiscal check and is rejected there rather than by the state gate."
        side_effects:
          - "EligibilityCase.fee_refunded_cents := EligibilityCase.fee_paid_cents"
          - "EligibilityCase.fee_outstanding_cents recomputed to fee_amount_cents - fee_paid_cents - fee_waived_cents + fee_refunded_cents"
          - "School.fee_collected_cents decremented by the refunded cents, restoring invariant fee_ledger_conservation"
          - "EligibilityCase.fee_status := REFUNDED"

  - entity: Contest
    initial_state: SCHEDULED
    terminal_states: [PLAYED, FORFEITED]
    note: "Cyclic: SCHEDULED -> OFFICIALS_ASSIGNED -> CONFIRMED -> SCHEDULED via postpone, and OFFICIALS_ASSIGNED -> SCHEDULED via a withdrawal that drops accepted_official_count below required_officials."
    transitions:
      - from: SCHEDULED
        to: OFFICIALS_ASSIGNED
        trigger: "system side effect of POST /athletics/official-assignments/{id}/respond with response=ACCEPT"
        actor: system
        preconditions:
          - "Contest.accepted_official_count reaches SportSeason.required_officials"
        side_effects:
          - "Contest.status := OFFICIALS_ASSIGNED"
          - "Contest.hold_reason := null"
      - from: OFFICIALS_ASSIGNED
        to: SCHEDULED
        trigger: "system side effect of the CASCADE-A withdrawal of an ACCEPTED OfficialAssignment"
        actor: system
        preconditions:
          - "Contest.accepted_official_count falls below SportSeason.required_officials"
        side_effects:
          - "Contest.status := SCHEDULED"
          - "Contest.hold_reason := COACH_CREDENTIAL_REVOKED"
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /athletics/contests/{id}/confirm"
        actor: SchoolAthleticDirector
        preconditions:
          - "SportSeason.status IN {REGULAR_SEASON, PLAYOFFS}; otherwise ERR_SEASON_NOT_OPEN"
          - "School(home_school_id).sanction_status != SUSPENDED; otherwise ERR_SCHOOL_SANCTIONED"
          - "Contest.accepted_official_count >= SportSeason.required_officials; otherwise ERR_OFFICIALS_INCOMPLETE"
        side_effects:
          - "Contest.status := CONFIRMED"
          - "Contest.hold_reason := null"
        note: "confirm is declared from SCHEDULED as well as OFFICIALS_ASSIGNED, so a SCHEDULED contest with too few accepted officials reaches the referential gate ERR_OFFICIALS_INCOMPLETE instead of being turned away by the generic state check"
      - from: OFFICIALS_ASSIGNED
        to: CONFIRMED
        trigger: "POST /athletics/contests/{id}/confirm"
        actor: SchoolAthleticDirector
        preconditions:
          - "SportSeason.status IN {REGULAR_SEASON, PLAYOFFS}; otherwise ERR_SEASON_NOT_OPEN"
          - "School(home_school_id).sanction_status != SUSPENDED; otherwise ERR_SCHOOL_SANCTIONED"
          - "Contest.accepted_official_count >= SportSeason.required_officials; otherwise ERR_OFFICIALS_INCOMPLETE"
        side_effects:
          - "Contest.status := CONFIRMED"
          - "Contest.hold_reason := null"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "POST /athletics/contests/{id}/postpone"
        actor: AssociationAdmin
        preconditions:
          - "new_starts_at is strictly after the logical clock instant; otherwise ERR_CONTEST_TIME_IN_PAST"
        side_effects:
          - "Contest.starts_at := new_starts_at and Contest.ends_at := new_ends_at"
          - "Contest.status := SCHEDULED, hold_reason := ADMIN_POSTPONE, accepted_official_count := 0"
          - "every OfficialAssignment on this contest with status IN {OFFERED, ACCEPTED} moves to WITHDRAWN and Official.accepted_assignment_count is decremented for each ACCEPTED row"
          - "every TransportRequest on this contest with status IN {REQUESTED, APPROVED} moves to CANCELLED with cancelled_reason CONTEST_HOLD_CASCADE, and for each formerly APPROVED trip School.release_minutes_used is decremented by that trip's release_minutes"
      - from: CONFIRMED
        to: PLAYED
        trigger: "POST /athletics/contests/{id}/result"
        actor: SchoolAthleticDirector
        preconditions:
          - "logical clock instant >= Contest.starts_at; otherwise ERR_RESULT_BEFORE_TIPOFF"
        side_effects:
          - "Contest.home_score, Contest.away_score := the posted scores; Contest.result_recorded_at := logical clock instant"
          - "Contest.status := PLAYED"
          - "every TransportRequest on this contest with status APPROVED moves to COMPLETED, leaving School.release_minutes_used unchanged"
      - from: CONFIRMED
        to: FORFEITED
        trigger: "POST /athletics/contests/{id}/forfeit"
        actor: AssociationAdmin
        preconditions:
          - "forfeiting_school_id equals Contest.home_school_id or Contest.away_school_id; otherwise ERR_SCHOOL_NOT_IN_CONTEST"
        side_effects:
          - "CASCADE-B LINK 1: Contest.status := FORFEITED, forfeiting_school_id recorded, the non-forfeiting side is credited FORFEIT_WIN_SCORE 1 and the forfeiting side 0, result_recorded_at := logical clock instant, and School(forfeiting).forfeit_count incremented by 1"
          - "CASCADE-B LINK 2 (caused by link 1 only): because forfeit_count reached SANCTION_PROBATION_THRESHOLD, School.sanction_status moves GOOD_STANDING -> PROBATION (and at SANCTION_SUSPENSION_THRESHOLD, PROBATION -> SUSPENDED)"
          - "CASCADE-B LINK 3 (caused by link 2 only): because the school entered PROBATION, every EligibilityCase whose Student.school_id is that school and whose status is PROVISIONAL_ELIGIBLE moves to UNDER_REVIEW with provisional_revoked_at stamped"
          - "every TransportRequest on this contest with status IN {REQUESTED, APPROVED} moves to CANCELLED with cancelled_reason CONTEST_HOLD_CASCADE, and for each formerly APPROVED trip School.release_minutes_used is decremented by that trip's release_minutes"
      - from: OFFICIALS_ASSIGNED
        to: FORFEITED
        trigger: "POST /athletics/contests/{id}/forfeit"
        actor: AssociationAdmin
        preconditions:
          - "forfeiting_school_id equals Contest.home_school_id or Contest.away_school_id"
        side_effects:
          - "identical to the CONFIRMED -> FORFEITED edge, including CASCADE-B links 1-3"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /athletics/contests/{id}/forfeit"
        actor: AssociationAdmin
        preconditions:
          - "forfeiting_school_id equals Contest.home_school_id or Contest.away_school_id"
        side_effects:
          - "identical to the CONFIRMED -> FORFEITED edge, including CASCADE-B links 1-3"

  - entity: OfficialAssignment
    initial_state: OFFERED
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /athletics/official-assignments/{id}/respond with response=ACCEPT"
        actor: Official
        preconditions:
          - "X-User-ID equals OfficialAssignment.official_id; otherwise ERR_NOT_RESOURCE_OWNER"
          - "Contest.status IN {SCHEDULED, OFFICIALS_ASSIGNED}; otherwise ERR_CONTEST_NOT_STAFFABLE"
        side_effects:
          - "OfficialAssignment.status := ACCEPTED, responded_at := logical clock instant"
          - "OfficialAssignment.stipend_cents := output of calculation officials_travel_stipend"
          - "Contest.accepted_official_count incremented by 1 and Official.accepted_assignment_count incremented by 1"
          - "when accepted_official_count reaches SportSeason.required_officials, Contest moves SCHEDULED -> OFFICIALS_ASSIGNED"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /athletics/official-assignments/{id}/respond with response=DECLINE"
        actor: Official
        preconditions:
          - "X-User-ID equals OfficialAssignment.official_id"
        side_effects:
          - "OfficialAssignment.status := DECLINED, responded_at := logical clock instant, stipend_cents stays null"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "system side effect of CASCADE-A link 2 or of POST /athletics/contests/{id}/postpone"
        actor: system
        preconditions: []
        side_effects:
          - "OfficialAssignment.status := WITHDRAWN, stipend_cents := null"
          - "Contest.accepted_official_count decremented by 1 and Official.accepted_assignment_count decremented by 1"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "system side effect of CASCADE-A link 2 or of POST /athletics/contests/{id}/postpone"
        actor: system
        preconditions: []
        side_effects:
          - "OfficialAssignment.status := WITHDRAWN"

  - entity: TransportRequest
    initial_state: REQUESTED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /athletics/transport-requests/{id}/approve"
        actor: AssociationAdmin
        preconditions:
          - "Contest.status IN {OFFICIALS_ASSIGNED, CONFIRMED}; otherwise ERR_CONTEST_NOT_SCHEDULED_FOR_TRANSPORT"
          - "the fleet overlap rule fleet_capacity_overlap admits this trip; otherwise ERR_FLEET_CAPACITY_EXCEEDED"
        side_effects:
          - "TransportRequest.status := APPROVED"
          - "School(requesting_school_id).release_minutes_used incremented by TransportRequest.release_minutes"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /athletics/transport-requests/{id}/cancel"
        actor: SchoolAthleticDirector
        preconditions:
          - "X-User-ID equals TransportRequest.requesting_school_id"
        side_effects:
          - "TransportRequest.status := CANCELLED, cancelled_reason := SCHOOL_REQUEST"
          - "School.release_minutes_used unchanged (the trip never contributed)"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /athletics/transport-requests/{id}/cancel"
        actor: SchoolAthleticDirector
        preconditions:
          - "X-User-ID equals TransportRequest.requesting_school_id"
        side_effects:
          - "TransportRequest.status := CANCELLED, cancelled_reason := SCHOOL_REQUEST"
          - "School(requesting_school_id).release_minutes_used decremented by TransportRequest.release_minutes, restoring invariant release_minutes_conservation"
      - from: APPROVED
        to: COMPLETED
        trigger: "system side effect of POST /athletics/contests/{id}/result"
        actor: system
        preconditions:
          - "the linked Contest moved CONFIRMED -> PLAYED"
        side_effects:
          - "TransportRequest.status := COMPLETED"
          - "School.release_minutes_used unchanged; COMPLETED trips remain inside the conserved sum"
      - from: APPROVED
        to: CANCELLED
        trigger: "system side effect of CASCADE-A link 3, of POST /athletics/contests/{id}/postpone, or of POST /athletics/contests/{id}/forfeit"
        actor: system
        preconditions: []
        side_effects:
          - "TransportRequest.status := CANCELLED, cancelled_reason := CONTEST_HOLD_CASCADE"
          - "School(requesting_school_id).release_minutes_used decremented by TransportRequest.release_minutes"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system side effect of POST /athletics/contests/{id}/postpone or of POST /athletics/contests/{id}/forfeit"
        actor: system
        preconditions: []
        side_effects:
          - "TransportRequest.status := CANCELLED, cancelled_reason := CONTEST_HOLD_CASCADE"

  - entity: InjuryReport
    initial_state: REPORTED
    terminal_states: [CLEARED, SEASON_ENDED]
    note: "Cyclic: the RTP_IN_PROGRESS self-loop advances stages 1..5, and a symptom recurrence on that same edge resets rtp_stage to 1."
    transitions:
      - from: REPORTED
        to: RTP_IN_PROGRESS
        trigger: "POST /athletics/injury-reports/{id}/advance-stage with symptom_recurrence=false"
        actor: MedicalOfficer
        preconditions:
          - "logical clock instant >= InjuryReport.reported_at + RTP_INITIAL_REST_HOURS; otherwise ERR_RTP_INTERVAL_NOT_ELAPSED"
        side_effects:
          - "InjuryReport.status := RTP_IN_PROGRESS, rtp_stage := 1, last_stage_advanced_at := logical clock instant"
      - from: RTP_IN_PROGRESS
        to: RTP_IN_PROGRESS
        trigger: "POST /athletics/injury-reports/{id}/advance-stage with symptom_recurrence=false"
        actor: MedicalOfficer
        preconditions:
          - "InjuryReport.rtp_stage < 5; otherwise ERR_RTP_STAGE_CEILING"
          - "logical clock instant >= InjuryReport.last_stage_advanced_at + RTP_STAGE_MIN_HOURS; otherwise ERR_RTP_INTERVAL_NOT_ELAPSED"
        side_effects:
          - "InjuryReport.rtp_stage incremented by 1, last_stage_advanced_at := logical clock instant"
      - from: RTP_IN_PROGRESS
        to: RTP_IN_PROGRESS
        trigger: "POST /athletics/injury-reports/{id}/advance-stage with symptom_recurrence=true"
        actor: MedicalOfficer
        preconditions: []
        side_effects:
          - "InjuryReport.rtp_stage := 1, recurrence_count incremented by 1, last_stage_advanced_at := logical clock instant"
      - from: RTP_IN_PROGRESS
        to: CLEARED
        trigger: "POST /athletics/injury-reports/{id}/clear with disposition=RETURN_TO_PLAY"
        actor: MedicalOfficer
        preconditions:
          - "X-User-ID differs from InjuryReport.reported_by_user_id; otherwise ERR_SEGREGATION_OF_DUTIES"
          - "InjuryReport.rtp_stage == 5; otherwise ERR_RTP_STAGE_INCOMPLETE"
          - "logical clock instant >= InjuryReport.reported_at + RTP_MIN_TOTAL_HOURS; otherwise ERR_RTP_INTERVAL_NOT_ELAPSED"
        side_effects:
          - "InjuryReport.status := CLEARED, cleared_by_user_id := X-User-ID, cleared_at := logical clock instant"
          - "every EligibilityCase of this student with status MEDICALLY_SUSPENDED returns to ELIGIBLE when no other InjuryReport for the student remains in {REPORTED, RTP_IN_PROGRESS}"
      - from: REPORTED
        to: SEASON_ENDED
        trigger: "POST /athletics/injury-reports/{id}/clear with disposition=SEASON_ENDED"
        actor: MedicalOfficer
        preconditions:
          - "X-User-ID differs from InjuryReport.reported_by_user_id"
        side_effects:
          - "InjuryReport.status := SEASON_ENDED, cleared_by_user_id := X-User-ID, cleared_at := logical clock instant"
          - "every EligibilityCase of this student with status MEDICALLY_SUSPENDED stays MEDICALLY_SUSPENDED"
      - from: RTP_IN_PROGRESS
        to: SEASON_ENDED
        trigger: "POST /athletics/injury-reports/{id}/clear with disposition=SEASON_ENDED"
        actor: MedicalOfficer
        preconditions:
          - "X-User-ID differs from InjuryReport.reported_by_user_id"
        side_effects:
          - "identical to the REPORTED -> SEASON_ENDED edge"

  - entity: School
    initial_state: GOOD_STANDING
    terminal_states: [SUSPENDED]
    note: "Sanction posture derived from forfeit_count; gates POST /athletics/contests/{id}/confirm and POST /athletics/eligibility-cases/{id}/activate for every child of the school."
    transitions:
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "system side effect of POST /athletics/contests/{id}/forfeit (CASCADE-B link 2)"
        actor: system
        preconditions:
          - "School.forfeit_count >= SANCTION_PROBATION_THRESHOLD (2) and < SANCTION_SUSPENSION_THRESHOLD (4)"
        side_effects:
          - "School.sanction_status := PROBATION"
          - "triggers CASCADE-B link 3 on the school's PROVISIONAL_ELIGIBLE cases"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system side effect of POST /athletics/contests/{id}/forfeit (CASCADE-B link 2)"
        actor: system
        preconditions:
          - "School.forfeit_count >= SANCTION_SUSPENSION_THRESHOLD (4)"
        side_effects:
          - "School.sanction_status := SUSPENDED"
          - "every subsequent POST /athletics/contests/{id}/confirm naming this school as home and every POST /athletics/eligibility-cases/{id}/activate for its students is rejected with ERR_SCHOOL_SANCTIONED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: contest-create-stale-season
    parent_entity: SportSeason
    write_endpoint: "POST /athletics/contests"
    occ_field: "expected_sport_season_version"
    description: |
      Scheduling a Contest against a SportSeason whose version has advanced since the
      client last read it is rejected. A season legitimately accepts many contests, so a
      second create observing the same season state would itself succeed under the product
      semantics; the stale-version check is the only deterministic way to reject a writer
      whose view of the calendar (scheduled_contest_count, season status) predates another
      accepted create.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

  - rule_id: official-offer-stale-contest
    parent_entity: Contest
    write_endpoint: "POST /athletics/contests/{id}/officials"
    occ_field: "expected_contest_version"
    description: |
      Offering an OfficialAssignment against a Contest whose version has advanced since the
      client last read it is rejected. A contest legitimately accepts several officials, so a
      second offer observing the same contest state would itself succeed; the stale-version
      check rejects a coordinator whose view of accepted_official_count and contest status
      predates another accepted offer or an acceptance.
    error_id: ERR_STALE_CONTEST_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: academic_gpa_evaluation
    trigger: "runs on every POST /athletics/eligibility-cases/{id}/evaluate, before the ladder's ACADEMIC rung; writes EligibilityCase.effective_gpa and EligibilityCase.gpa_variant_applied"
    algorithm: weighted_scoring
    formula: |
      # variant selection is pinned by the logical clock against the season's grading_lock_date
      if clock_now_utc_date < SportSeason.grading_lock_date:
          variant = "PROVISIONAL"
          effective_gpa = round_half_up(Student.gpa_prior_period, 3)
      else:
          variant = "FINAL"
          denom = Student.credits_prior_period + Student.credits_current_period
          if denom == 0:
              effective_gpa = 0.000
          else:
              numer = (Student.gpa_prior_period * Student.credits_prior_period)
                    + (Student.gpa_current_period * Student.credits_current_period)
              effective_gpa = round_half_up(numer / denom, 3)
      academic_rung_passes = (effective_gpa >= ACADEMIC_MIN_GPA)
    input_set: |
      Exactly the four academic fields on the case's Student, as last written by
      POST /athletics/students/{id}/academic-record. A Student whose
      academic_record_submitted_at is null cannot be evaluated at all
      (ERR_ACADEMIC_RECORD_MISSING), so the fields are never read while unset.
      gpa_current_period and credits_current_period are read ONLY by the FINAL variant;
      the PROVISIONAL variant ignores them even when populated.
    constants:
      ACADEMIC_MIN_GPA: 2.000
    precision: "effective_gpa carries 3 decimal places, round_half_up; the >= comparison against ACADEMIC_MIN_GPA uses the rounded value"
    variants:
      - name: PROVISIONAL
        when: "clock_now_utc_date < SportSeason.grading_lock_date"
        difference: "uses gpa_prior_period alone; the in-progress period's grades and credits are excluded entirely"
      - name: FINAL
        when: "clock_now_utc_date >= SportSeason.grading_lock_date"
        difference: "credit-weighted mean over both grading periods; a strong prior period can be dragged under ACADEMIC_MIN_GPA by a weaker, higher-credit current period, so the same Student row flips from eligible to ineligible with no data change"

  - name: eligibility_ladder_evaluation
    trigger: "runs on every POST /athletics/eligibility-cases/{id}/evaluate; writes EligibilityCase.ineligibility_reason and decides PROVISIONAL_ELIGIBLE vs INELIGIBLE"
    algorithm: constraint_propagation
    formula: |
      # STRICT PRECEDENCE. Rungs are evaluated in exactly this order and evaluation STOPS
      # at the first failure. The reported ineligibility_reason is that first failure only.
      # RUNG 1 - AGE
      age_on_cutoff = whole_years_between(Student.birth_date, SportSeason.age_cutoff_date)
      if age_on_cutoff >= AGE_LIMIT_YEARS: return "AGE_LIMIT"
      # RUNG 2 - RESIDENCY
      if (Student.residency_verified is false)
         or (Student.residency_verified_on is null)
         or (Student.residency_verified_on > SportSeason.residency_deadline):
          return "RESIDENCY_UNVERIFIED"
      # RUNG 3 - TRANSFER
      if Student.previous_school_id is not null:
          if Student.hardship_waiver_granted is false:
              sitout_days = whole_days_between(Student.transfer_date, SportSeason.first_contest_date)
              if sitout_days < TRANSFER_SITOUT_DAYS: return "TRANSFER_SITOUT"
      # RUNG 4 - DOCUMENTS
      for t in ["PHYSICAL", "PARENT_CONSENT", "CONCUSSION_ACK"]:
          docs_t = ClearanceDocument rows with eligibility_case_id == case.id and doc_type == t
          if none of docs_t has expires_on >= clock_now_utc_date: return "DOCS_INCOMPLETE"
      # RUNG 5 - ACADEMIC
      if academic_gpa_evaluation.effective_gpa < ACADEMIC_MIN_GPA: return "ACADEMIC_GPA"
      return null
    input_set: |
      One Student row, one SportSeason row, and the full ClearanceDocument set attached to
      this EligibilityCase (no status filter on documents - freshness is decided by
      expires_on against the logical clock, not by a stored flag). Contests, fees, coach
      credentials and injuries are NOT inputs to the ladder; the coach-credential and
      fee gates live on the separate activate edge.
    constants:
      AGE_LIMIT_YEARS: 19
      TRANSFER_SITOUT_DAYS: 365
      ACADEMIC_MIN_GPA: 2.000
      LADDER_ORDER: "AGE_LIMIT > RESIDENCY_UNVERIFIED > TRANSFER_SITOUT > DOCS_INCOMPLETE > ACADEMIC_GPA"
    precision: "whole_years_between truncates toward zero (a student born on the cutoff date's month/day is exactly N on that date); whole_days_between is a calendar-day difference over UTC dates, inclusive of the start date and exclusive of the end date"
    variants:
      - name: FIRST_FAILURE_ONLY
        when: "always"
        difference: "reports only the first failing rung; a case failing three rungs is indistinguishable in ineligibility_reason from a case failing only the highest of those three"

  - name: participation_fee_assessment
    trigger: "runs once inside POST /athletics/eligibility-cases; writes EligibilityCase.fee_amount_cents and the initial fee_status"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS PINNED: round each line item to whole cents as it is produced,
      # THEN apply the family cap. Summing first and rounding once at the end is WRONG
      # and produces a different fee_amount_cents.
      base_cents = SPORT_TIER_BASE_CENTS[SportSeason.sport_tier]
      prior_case_count = count of EligibilityCase rows where
                            student_id == this student
                        and sport_season_id names a season with the same school_year
                        and fee_status != REFUNDED
                        and the row was created before this one
      discount_pct = MULTI_SPORT_DISCOUNT_PCT[min(prior_case_count, 2)]
      line_cents = round_half_up(base_cents * (1 - discount_pct))          # ROUND #1
      if Student.free_reduced_lunch:
          line_cents = round_half_up(line_cents * (1 - FRL_REDUCTION_PCT)) # ROUND #2
      family_prior_total = sum of fee_amount_cents over exactly the rows counted in
                           prior_case_count
      headroom = School.fee_cap_cents - family_prior_total
      fee_amount_cents = max(0, min(line_cents, headroom))
      fee_outstanding_cents = fee_amount_cents
      fee_status = PAID if fee_amount_cents == 0 else ASSESSED
    input_set: |
      The student's earlier EligibilityCase rows in the SAME SportSeason.school_year whose
      fee_status is not REFUNDED, ordered by created_at ASC and counted strictly before the
      row being created. Cases in other school_years and REFUNDED cases are excluded from
      both prior_case_count and family_prior_total.
    constants:
      SPORT_TIER_BASE_CENTS: { TIER_A: 12345, TIER_B: 8975, TIER_C: 6499 }
      MULTI_SPORT_DISCOUNT_PCT: [0.00, 0.25, 0.40]
      FRL_REDUCTION_PCT: 0.50
    precision: "whole cents, round_half_up, applied per line item at ROUND #1 and ROUND #2 before the cap; the cap itself is exact integer arithmetic and is never rounded"
    variants:
      - name: PER_LINE_ROUNDING
        when: "always (the pinned order)"
        difference: "round_half_up(base*(1-d)) FIRST, then round_half_up(that*(1-frl)). TIER_A with one prior case and FRL: round_half_up(12345*0.75) = round_half_up(9258.75) = 9259, then round_half_up(9259*0.50) = round_half_up(4629.5) = 4630"
      - name: SUM_THEN_ROUND
        when: "never - documented only to name the rejected alternative"
        difference: "collapses both rounds into one, round_half_up(base*(1-d)*(1-frl)), then applies the cap. On the very same TIER_A / one-prior-case / FRL inputs it yields round_half_up(12345*0.75*0.50) = round_half_up(4629.375) = 4629, one cent BELOW the pinned order's 4630. Identical inputs, two defensible readings of the prose, different persisted fee_amount_cents - the implementation MUST use PER_LINE_ROUNDING"

  - name: power_rating
    trigger: "runs inside POST /athletics/sport-seasons/{id}/seed as steps 2-5 of playoff_seed_assignment; also exposed as the IN_SEASON reading written onto each PlayoffSeed row"
    algorithm: weighted_scoring
    formula: |
      # per school, over the frozen snapshot S
      wins   = count of S-contests this school won (higher score, or the awarded side of a forfeit)
      losses = count of S-contests this school lost (lower score, or forfeiting_school_id == school)
      forfeit_losses = count of S-contests with forfeiting_school_id == school
      raw_win_pct = 0.0000 if (wins + losses) == 0 else round_half_up(wins / (wins + losses), 4)
      # opponent set: distinct schools this school met in S, EXCLUDING schools whose
      # sanction_status is SUSPENDED at seeding time. Excluded opponents still count in
      # this school's own wins/losses.
      opps = distinct opponents in S with sanction_status != SUSPENDED
      opponent_avg_win_pct = 0.0000 if opps is empty
                             else round_half_up(mean(raw_win_pct of each o in opps), 4)
      IN_SEASON:      power_rating = round_half_up(raw_win_pct, 4)
      FINAL_SEEDING:  power_rating = round_half_up(
                          POWER_OWN_WEIGHT * raw_win_pct
                        + POWER_SOS_WEIGHT * opponent_avg_win_pct, 4)
    input_set: |
      Exactly the Contest rows of this sport_season_id whose status IS IN {PLAYED, FORFEITED},
      frozen at step 1 of playoff_seed_assignment. Contests in SCHEDULED, OFFICIALS_ASSIGNED
      or CONFIRMED are excluded, and the seeding edge cannot even be taken while any such
      contest exists. Opponent raw_win_pct values are read from the frozen step-3 table only.
    constants:
      POWER_OWN_WEIGHT: 0.65
      POWER_SOS_WEIGHT: 0.35
    precision: "4 decimal places, round_half_up, at raw_win_pct, at opponent_avg_win_pct, and again at power_rating"
    variants:
      - name: IN_SEASON
        when: "read while SportSeason.status is REGULAR_SEASON (the reading a school sees before the bracket is drawn)"
        difference: "strength of schedule is ignored entirely: power_rating equals raw_win_pct"
      - name: FINAL_SEEDING
        when: "written onto PlayoffSeed rows by POST /athletics/sport-seasons/{id}/seed"
        difference: "blends 65% own win pct with 35% opponent average, so two schools with identical 0.5000 raw records receive different power_ratings and can invert the IN_SEASON ordering"

  - name: playoff_seed_assignment
    trigger: "POST /athletics/sport-seasons/{id}/seed; writes every PlayoffSeed row and the season's seeded_school_count / unseeded_school_count"
    algorithm: topological
    formula: |
      # EVALUATION ORDER IS PINNED. The dependency looks circular - a school's power_rating
      # depends on its opponents' win percentages, which depend on the same snapshot - so the
      # order below fixes exactly which values feed which step. Later steps NEVER feed earlier ones.
      # STEP 1 freeze snapshot S = contests of this season with status IN {PLAYED, FORFEITED}
      # STEP 2 for each school with >= 1 contest in S: wins, losses, forfeit_losses over S
      # STEP 3 raw_win_pct for every such school; THIS TABLE IS FROZEN
      # STEP 4 opponent_avg_win_pct reading ONLY the frozen step-3 table
      #        (never a step-5 power_rating, never a value recomputed after any seed is set)
      # STEP 5 power_rating = 0.65*raw_win_pct + 0.35*opponent_avg_win_pct  (4 dp)
      # STEP 6 order descending by power_rating, then resolve ties with this chain,
      #        stopping at the first criterion that separates the pair:
      #          (a) higher raw_win_pct                              -> tiebreak_trace RAW_WIN_PCT
      #          (b) head-to-head: if the two met in S, the winner of their LATEST
      #              starts_at meeting ranks higher (for a FORFEITED meeting the awarded
      #              side is the winner); if they never met, (b) does not separate them
      #                                                               -> HEAD_TO_HEAD
      #          (c) fewer forfeit_losses                            -> FORFEIT_LOSSES
      #          (d) higher opponent_avg_win_pct                     -> OPP_AVG_WIN_PCT
      #          (e) earlier School.created_at                       -> CREATED_AT
      #        A pair separated at step 6's power_rating comparison itself records POWER_RATING.
      # STEP 7 seed_number = 1..N in the resulting order
      # STEP 8 SportSeason.status := SEEDING_LOCKED
    input_set: |
      Snapshot S only. Every School whose classification equals the season's classification is
      considered; one holding zero contests in S receives NO PlayoffSeed row and is counted in
      SportSeason.unseeded_school_count instead - the empty-collection edge of the seeding run.
      The top-ranked row records tiebreak_trace POWER_RATING by convention; every other row
      records the criterion that separated it from the row immediately above it.
    constants:
      TIEBREAK_CHAIN: "power_rating > raw_win_pct > head_to_head > forfeit_losses > opponent_avg_win_pct > School.created_at ASC"
      FORFEIT_WIN_SCORE: 1
      FORFEIT_LOSS_SCORE: 0
    precision: "all rating fields 4 decimal places round_half_up; comparisons in the tie-break chain use the rounded stored values, never unrounded intermediates"
    variants:
      - name: FROZEN_SOS
        when: "always (the pinned order)"
        difference: "opponent_avg_win_pct reads the step-3 table; recomputing opponents' win percentages after step 5 (the naive fixed-point reading) yields different power_ratings and a different bracket"

  - name: contest_load_check
    trigger: "runs inside POST /athletics/contests after every temporal check has passed, once for the home school and then once for the away school"
    algorithm: threshold
    formula: |
      for school in [home_school_id, away_school_id]:
          season_count = count of Contest rows with this sport_season_id where
                         home_school_id == school or away_school_id == school
          if season_count + 1 > SportSeason.contest_limit:
              raise ERR_SEASON_CONTEST_LIMIT
          # HALF-OPEN rolling window, symmetric about the new contest's start
          lo = new.starts_at - ROLLING_WINDOW_DAYS days
          hi = new.starts_at + ROLLING_WINDOW_DAYS days
          window_count = count of those same Contest rows whose starts_at satisfies
                         lo <= starts_at < hi
          if window_count >= MAX_CONTESTS_PER_WINDOW:
              raise ERR_CONTEST_WINDOW_DENSITY
    input_set: |
      Every Contest row of this sport_season_id naming the school on either side, in any
      status (Contest has no CANCELLED state; PLAYED and FORFEITED rows still consume both
      the season limit and the rolling window).
    constants:
      ROLLING_WINDOW_DAYS: 7
      MAX_CONTESTS_PER_WINDOW: 3
    precision: "the window is half-open on the upper bound: a contest starting exactly at new.starts_at + 7 days is OUTSIDE the window, one starting exactly at new.starts_at - 7 days is INSIDE it"
    variants:
      - name: SEASON_LIMIT
        when: "checked first, for each school in home-then-away order"
        difference: "uses strictly-greater-than on the projected count (season_count + 1 > contest_limit), so a school sitting exactly at contest_limit - 1 may still be scheduled"

  - name: officials_travel_stipend
    trigger: "runs on the OfficialAssignment OFFERED -> ACCEPTED transition; writes OfficialAssignment.stipend_cents"
    algorithm: tiered_pricing
    formula: |
      base            = CERT_BASE_CENTS[Official.certification_level]
      tier_mult       = TIER_MULTIPLIER[SportSeason.sport_tier]
      capped_miles    = min(Contest.travel_miles, MILEAGE_CAP_MILES)
      mileage_cents   = round_half_up(capped_miles * MILEAGE_RATE_CENTS)
      night_cents     = NIGHT_SURCHARGE_CENTS if utc_hour(Contest.starts_at) >= NIGHT_HOUR_UTC else 0
      playoff_cents   = max(PLAYOFF_FLOOR_CENTS, round_half_up(base * PLAYOFF_PCT))
                        if Contest.is_playoff else 0
      stipend_cents   = round_half_up(base * tier_mult) + mileage_cents + night_cents + playoff_cents
    input_set: "the single Official row, the single Contest row and its SportSeason; no aggregation over other assignments"
    constants:
      CERT_BASE_CENTS: { LEVEL_1: 4000, LEVEL_2: 6000, LEVEL_3: 8500 }
      TIER_MULTIPLIER: { TIER_A: 1.25, TIER_B: 1.00, TIER_C: 0.85 }
      MILEAGE_CAP_MILES: 120
      MILEAGE_RATE_CENTS: 62
      NIGHT_HOUR_UTC: 23
      NIGHT_SURCHARGE_CENTS: 1500
      PLAYOFF_PCT: 0.20
      PLAYOFF_FLOOR_CENTS: 2500
    precision: "each of the four addends is rounded to whole cents independently before summation; the multiplicative term round_half_up(base*tier_mult) is rounded BEFORE the mileage, night and playoff addends are added"
    variants:
      - name: REGULAR
        when: "Contest.is_playoff is false"
        difference: "playoff_cents is 0"
      - name: PLAYOFF
        when: "Contest.is_playoff is true"
        difference: "adds max(2500, round_half_up(base*0.20)); at the three declared bases the percentage term is 800 / 1200 / 1700 cents, all below PLAYOFF_FLOOR_CENTS, so every level takes the 2500 floor - the max() is what makes the branch non-linear rather than proportional"

  - name: rtp_stage_timeline
    trigger: "runs on POST /athletics/injury-reports/{id}/advance-stage and POST /athletics/injury-reports/{id}/clear"
    algorithm: threshold
    formula: |
      # stage 0 -> 1
      if InjuryReport.rtp_stage == 0:
          require clock_now >= InjuryReport.reported_at + RTP_INITIAL_REST_HOURS hours
      # stage n -> n+1 (1 <= n <= 4)
      else:
          require InjuryReport.rtp_stage < 5
          require clock_now >= InjuryReport.last_stage_advanced_at + RTP_STAGE_MIN_HOURS hours
      # clearance
      on clear with disposition RETURN_TO_PLAY:
          require InjuryReport.rtp_stage == 5
          require clock_now >= InjuryReport.reported_at + RTP_MIN_TOTAL_HOURS hours
          require X-User-ID != InjuryReport.reported_by_user_id
    input_set: "the single InjuryReport row and the logical clock; no other reports are consulted for the interval checks"
    constants:
      RTP_INITIAL_REST_HOURS: 48
      RTP_STAGE_MIN_HOURS: 24
      RTP_MIN_TOTAL_HOURS: 144
    precision: "each interval comparison is >= on the exact instant, so an advance at exactly reported_at + 48h or exactly last_stage_advanced_at + 24h is ADMITTED; one second earlier is rejected"
    variants:
      - name: RECURRENCE_RESET
        when: "advance-stage is called with symptom_recurrence true"
        difference: "no interval is required; rtp_stage snaps back to 1 and last_stage_advanced_at is re-stamped, so the 24-hour ladder restarts and the 144-hour total floor is still measured from the ORIGINAL reported_at"

  - name: transport_release_window
    trigger: "runs inside POST /athletics/transport-requests; writes depart_at, return_at and release_minutes"
    algorithm: interval_merge
    formula: |
      depart_at = Contest.starts_at - (travel_minutes + PREGAME_BUFFER_MIN) minutes
      return_at = Contest.ends_at   + (travel_minutes + POSTGAME_BUFFER_MIN) minutes
      school_day_end = the UTC instant on depart_at's UTC calendar date at
                       School(requesting_school_id).school_day_end_utc_hhmm
      release_minutes = max(0, whole_minutes_between(depart_at, school_day_end))
      if release_minutes > School.max_release_minutes_per_request:
          raise ERR_RELEASE_TIME_EXCEEDED
      if depart_at <= clock_now:
          raise ERR_TRANSPORT_DEPARTURE_IN_PAST
    input_set: "one Contest row, one School row and the request's travel_minutes / bus_count; no other trips are read here (fleet capacity is checked later, at approval)"
    constants:
      PREGAME_BUFFER_MIN: 75
      POSTGAME_BUFFER_MIN: 30
    precision: "whole_minutes_between truncates toward zero; a departure at or after school_day_end yields exactly 0 release_minutes rather than a negative value"
    variants:
      - name: AFTER_HOURS
        when: "depart_at >= school_day_end"
        difference: "release_minutes is exactly 0, so approving the trip leaves School.release_minutes_used unchanged and cancelling it must also leave it unchanged"

  - name: fleet_capacity_overlap
    trigger: "runs inside POST /athletics/transport-requests/{id}/approve, after the contest-state precondition"
    algorithm: aggregation
    formula: |
      # CLOSED intervals on both ends: two trips that merely touch DO collide.
      committed = TransportRequest rows with requesting_school_id == this school
                  and status IN {APPROVED, COMPLETED}
                  and NOT (other.return_at < this.depart_at or other.depart_at > this.return_at)
      if sum(bus_count over committed) + this.bus_count > School.bus_fleet_size:
          raise ERR_FLEET_CAPACITY_EXCEEDED
    input_set: "the requesting school's TransportRequest rows with status IN {APPROVED, COMPLETED}; REQUESTED and CANCELLED trips hold no buses"
    constants:
      FLEET_INTERVAL_SEMANTICS: "closed-closed [depart_at, return_at]; equality at either endpoint is a collision"
    precision: "aggregate capacity comparison uses strict greater-than, so a school may commit exactly bus_fleet_size buses over one instant"
    variants:
      - name: TOUCHING_IS_COLLISION
        when: "other.return_at == this.depart_at"
        difference: "counted as overlapping, unlike the officials rule whose half-open buffered intervals let a touching pair through"

  - name: official_double_booking_overlap
    trigger: "runs inside POST /athletics/contests/{id}/officials, before the assignment row is minted"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals, symmetrically expanded by a travel buffer on BOTH ends.
      def buffered(c):
          return [c.starts_at - OFFICIAL_TRAVEL_BUFFER_MIN minutes,
                  c.ends_at   + OFFICIAL_TRAVEL_BUFFER_MIN minutes)   # upper bound EXCLUSIVE
      held = OfficialAssignment rows with official_id == this official
             and status IN {OFFERED, ACCEPTED}
      for h in held:
          a = buffered(Contest of h); b = buffered(this contest)
          if a.lo < b.hi and b.lo < a.hi:      # positive-measure intersection only
              raise ERR_OFFICIAL_DOUBLE_BOOKED
    input_set: "OfficialAssignment rows for this official with status IN {OFFERED, ACCEPTED} across every season; DECLINED and WITHDRAWN rows free the interval"
    constants:
      OFFICIAL_TRAVEL_BUFFER_MIN: 90
      OFFICIAL_INTERVAL_SEMANTICS: "half-open [start-90m, end+90m); touching endpoints do NOT collide"
    precision: "strict less-than on both sides, so a second contest whose buffered window begins exactly when the first buffered window ends is ADMITTED"
    variants:
      - name: TOUCHING_IS_ADMITTED
        when: "buffered(a).hi == buffered(b).lo"
        difference: "admitted, unlike the closed-interval fleet rule where the same touching geometry collides"

  - name: venue_turnover_overlap
    trigger: "runs inside POST /athletics/contests as the second temporal check, immediately after the season-window check and before contest_load_check"
    algorithm: interval_merge
    formula: |
      # ASYMMETRIC buffer: extended FORWARD only, on the already-booked contest.
      booked = Contest rows with home_school_id == new.home_school_id
               and status IN {SCHEDULED, OFFICIALS_ASSIGNED, CONFIRMED, PLAYED, FORFEITED}
      overlapping = [b for b in booked
                     if new.starts_at < (b.ends_at + VENUE_TURNOVER_MIN minutes)
                     and b.starts_at < new.ends_at]
      if len(overlapping) + 1 > School.venue_concurrent_capacity:
          raise ERR_VENUE_TURNOVER_CONFLICT
    input_set: "home contests of the same School across every season and every status"
    constants:
      VENUE_TURNOVER_MIN: 60
      VENUE_INTERVAL_SEMANTICS: "half-open, buffer applied only to the trailing edge of the already-booked contest"
    precision: "the aggregate comparison is (overlap count + 1) > venue_concurrent_capacity, so a venue with capacity 2 admits a second concurrent contest and rejects the third"
    variants:
      - name: FORWARD_ONLY_BUFFER
        when: "always"
        difference: "a new contest ending exactly when a booked contest starts is admitted, but one starting inside the booked contest's 60-minute trailing turnover is rejected - a geometry neither the fleet rule nor the officials rule produces"

# =============================================================================
# 1.3.1 Conserved-Quantity Invariants (compensating-action contracts)
# =============================================================================
invariants:
  - name: release_minutes_conservation
    conserved_quantity: "instructional release minutes committed by a School"
    formula: |
      School.release_minutes_used
        == sum(TransportRequest.release_minutes
               for t in TransportRequest
               where t.requesting_school_id == School.id
                 and t.status IN {APPROVED, COMPLETED})
    forward_action: "POST /athletics/transport-requests/{id}/approve (REQUESTED -> APPROVED) adds release_minutes"
    compensating_action: "POST /athletics/transport-requests/{id}/cancel (APPROVED -> CANCELLED) subtracts the same release_minutes; CASCADE-A link 4 and the postpone/forfeit cascades subtract it too"
    must_hold: "after any approve/cancel pair on the same trip, School.release_minutes_used returns to its pre-approval value exactly; the APPROVED -> COMPLETED edge deliberately leaves the quantity unchanged because COMPLETED remains inside the sum"

  - name: fee_ledger_conservation
    conserved_quantity: "participation-fee cents held by a School"
    formula: |
      per case:   EligibilityCase.fee_outstanding_cents
                    == fee_amount_cents - fee_paid_cents - fee_waived_cents + fee_refunded_cents
      per school: School.fee_collected_cents
                    == sum(c.fee_paid_cents - c.fee_refunded_cents
                           for c in EligibilityCase
                           where Student(c.student_id).school_id == School.id)
    forward_action: "POST /athletics/eligibility-cases/{id}/fee-payments adds amount_cents to fee_paid_cents and to School.fee_collected_cents"
    compensating_action: "POST /athletics/eligibility-cases/{id}/fee-refunds sets fee_refunded_cents := fee_paid_cents and subtracts the refunded cents from School.fee_collected_cents"
    must_hold: "after a pay/refund pair School.fee_collected_cents returns to its pre-payment value and fee_outstanding_cents returns to fee_amount_cents - fee_waived_cents; a waiver never touches School.fee_collected_cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in section 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID matches the resource's owning entity: SchoolAthleticDirector and Registrar must equal the governing School.id (Contest.home_school_id for contest writes, TransportRequest.requesting_school_id for transport writes, Student.school_id for student and eligibility writes, StaffCredential.school_id for credential creation); Official must equal OfficialAssignment.official_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /athletics/students, POST /athletics/students/{id}/academic-record, POST /athletics/staff-credentials, POST /athletics/eligibility-cases, POST /athletics/eligibility-cases/{id}/clearance-documents, POST /athletics/eligibility-cases/{id}/appeal, POST /athletics/eligibility-cases/{id}/fee-payments, POST /athletics/eligibility-cases/{id}/fee-waiver-requests, POST /athletics/contests, POST /athletics/contests/{id}/confirm, POST /athletics/contests/{id}/result, POST /athletics/transport-requests, POST /athletics/transport-requests/{id}/cancel, POST /athletics/official-assignments/{id}/respond"

  - priority: 10
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_SEASON_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_CONTEST_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_TRANSPORT_REQUEST_NOT_FOUND | ERR_INJURY_REPORT_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"

  - priority: 12
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_SEASON_NOT_FOUND | ERR_CONTEST_NOT_FOUND | ERR_OFFICIAL_NOT_FOUND"
    http_status: 404
    applies_to: "POST /athletics/students, POST /athletics/staff-credentials, POST /athletics/eligibility-cases, POST /athletics/contests, POST /athletics/contests/{id}/officials, POST /athletics/transport-requests, POST /athletics/injury-reports"

  - priority: 20
    category: business_constraint
    check: "required body fields are present, enum values are members of the declared set, numbers respect their declared ranges, ISO 8601 fields parse, and ends_at is strictly after starts_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 22
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 30
    category: state
    check: "expected_sport_season_version equals the current SportSeason.version"
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412
    applies_to: "POST /athletics/contests"

  - priority: 31
    category: state
    check: "expected_contest_version equals the current Contest.version"
    error_id: ERR_STALE_CONTEST_VERSION
    http_status: 412
    applies_to: "POST /athletics/contests/{id}/officials"

  - priority: 40
    category: state
    check: "the target row's current state admits the requested transition (see section 1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints without a more specific state error"

  - priority: 40
    category: state
    check: "EligibilityCase.status is PROVISIONAL_ELIGIBLE"
    error_id: ERR_CASE_NOT_ACTIVATABLE
    http_status: 409
    applies_to: "POST /athletics/eligibility-cases/{id}/activate"

  - priority: 40
    category: state
    check: "EligibilityCase.appeal_count < 2"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /athletics/eligibility-cases/{id}/appeal"

  - priority: 40
    category: state
    check: "OfficialAssignment.status is OFFERED"
    error_id: ERR_ALREADY_RESPONDED
    http_status: 409
    applies_to: "POST /athletics/official-assignments/{id}/respond"

  - priority: 40
    category: state
    check: "InjuryReport.rtp_stage is strictly below 5 on an advance, and exactly 5 on a RETURN_TO_PLAY clearance"
    error_id: "ERR_RTP_STAGE_CEILING | ERR_RTP_STAGE_INCOMPLETE"
    http_status: 409
    applies_to: "POST /athletics/injury-reports/{id}/advance-stage, POST /athletics/injury-reports/{id}/clear"

  - priority: 40
    category: state
    check: "the credential's certification_expires_on (or the supplied renewed_certification_expires_on) is strictly after the logical clock UTC date"
    error_id: ERR_CREDENTIAL_ALREADY_LAPSED
    http_status: 409
    applies_to: "POST /athletics/staff-credentials/{id}/background-check"

  - priority: 41
    category: state
    check: "every Contest of the season has status IN {PLAYED, FORFEITED}"
    error_id: ERR_SEASON_HAS_OPEN_CONTESTS
    http_status: 409
    applies_to: "POST /athletics/sport-seasons/{id}/seed"

  - priority: 42
    category: state
    check: "the governing SportSeason is in a status that admits the operation: PRACTICE_OPEN or REGULAR_SEASON for eligibility evaluation, REGULAR_SEASON or PLAYOFFS for contest confirmation and officiating offers"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "POST /athletics/eligibility-cases/{id}/evaluate, POST /athletics/contests/{id}/confirm, POST /athletics/contests/{id}/officials"

  - priority: 43
    category: state
    check: "Contest.status IN {SCHEDULED, OFFICIALS_ASSIGNED} when an official responds, and IN {OFFICIALS_ASSIGNED, CONFIRMED} when a transport request is approved"
    error_id: "ERR_CONTEST_NOT_STAFFABLE | ERR_CONTEST_NOT_SCHEDULED_FOR_TRANSPORT"
    http_status: 409
    applies_to: "POST /athletics/official-assignments/{id}/respond, POST /athletics/transport-requests/{id}/approve"

  - priority: 50
    category: business_safety
    check: "the acting principal's X-User-ID differs from the principal recorded on the record being adjudicated: an EligibilityReviewer may not evaluate a case whose Student.academic_record_submitted_by equals their own id, and a MedicalOfficer may not clear an InjuryReport whose reported_by_user_id equals their own id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /athletics/eligibility-cases/{id}/evaluate, POST /athletics/injury-reports/{id}/clear"

  - priority: 51
    category: business_safety
    check: "the governing School.sanction_status is not SUSPENDED"
    error_id: ERR_SCHOOL_SANCTIONED
    http_status: 409
    applies_to: "POST /athletics/contests/{id}/confirm, POST /athletics/eligibility-cases/{id}/activate"

  - priority: 52
    category: business_safety
    check: "the student's School holds at least one StaffCredential with sport equal to the season's sport, role_title HEAD_COACH, status CLEARED and certification_expires_on strictly after the logical clock UTC date"
    error_id: ERR_COACH_NOT_CREDENTIALED
    http_status: 409
    applies_to: "POST /athletics/eligibility-cases/{id}/activate"

  - priority: 53
    category: business_safety
    check: "Student.academic_record_submitted_at is not null"
    error_id: ERR_ACADEMIC_RECORD_MISSING
    http_status: 409
    applies_to: "POST /athletics/eligibility-cases/{id}/evaluate"

  - priority: 54
    category: business_safety
    check: "no EligibilityCase of the injured student is left ELIGIBLE while an InjuryReport with status IN {REPORTED, RTP_IN_PROGRESS} exists; a fresh eligibility case for such a student cannot be activated"
    error_id: ERR_ATHLETE_MEDICALLY_SUSPENDED
    http_status: 409
    applies_to: "POST /athletics/eligibility-cases/{id}/activate"

  - priority: 55
    category: business_temporal
    check: "SportSeason.first_contest_date <= date(starts_at) <= SportSeason.season_end_date"
    error_id: ERR_CONTEST_OUTSIDE_SEASON_WINDOW
    http_status: 409
    applies_to: "POST /athletics/contests"

  - priority: 56
    category: business_temporal
    check: "calculation venue_turnover_overlap admits the new contest at the home school's venue"
    error_id: ERR_VENUE_TURNOVER_CONFLICT
    http_status: 409
    applies_to: "POST /athletics/contests"

  - priority: 57
    category: business_temporal
    check: "calculation official_double_booking_overlap admits the offer for this official"
    error_id: ERR_OFFICIAL_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /athletics/contests/{id}/officials"

  - priority: 58
    category: business_temporal
    check: "the return-to-play interval floors of calculation rtp_stage_timeline have elapsed on the logical clock"
    error_id: ERR_RTP_INTERVAL_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /athletics/injury-reports/{id}/advance-stage, POST /athletics/injury-reports/{id}/clear"

  - priority: 59
    category: business_temporal
    check: "computed depart_at is strictly after the logical clock; a posted result is not before starts_at; a postponed contest's new_starts_at is strictly after the logical clock"
    error_id: "ERR_TRANSPORT_DEPARTURE_IN_PAST | ERR_RESULT_BEFORE_TIPOFF | ERR_CONTEST_TIME_IN_PAST"
    http_status: 409
    applies_to: "POST /athletics/transport-requests, POST /athletics/contests/{id}/result, POST /athletics/contests/{id}/postpone"

  - priority: 60
    category: business_constraint
    check: "home_school_id differs from away_school_id and both schools' classification equals SportSeason.classification"
    error_id: "ERR_SAME_SCHOOL_CONTEST | ERR_CLASSIFICATION_MISMATCH"
    http_status: 409
    applies_to: "POST /athletics/contests"

  - priority: 61
    category: business_constraint
    check: "calculation contest_load_check admits the new contest for the home school and then for the away school"
    error_id: "ERR_SEASON_CONTEST_LIMIT | ERR_CONTEST_WINDOW_DENSITY"
    http_status: 409
    applies_to: "POST /athletics/contests"

  - priority: 62
    category: business_referential
    check: "Contest.accepted_official_count >= SportSeason.required_officials"
    error_id: ERR_OFFICIALS_INCOMPLETE
    http_status: 409
    applies_to: "POST /athletics/contests/{id}/confirm"

  - priority: 63
    category: business_referential
    check: "the seeding snapshot holds at least one contest, and the forfeiting_school_id names one of the contest's two schools"
    error_id: "ERR_SEEDING_EMPTY_SNAPSHOT | ERR_SCHOOL_NOT_IN_CONTEST"
    http_status: 409
    applies_to: "POST /athletics/sport-seasons/{id}/seed, POST /athletics/contests/{id}/forfeit"

  - priority: 64
    category: business_referential
    check: "no EligibilityCase already exists for this (student_id, sport_season_id) pair"
    error_id: ERR_DUPLICATE_ELIGIBILITY_CASE
    http_status: 409
    applies_to: "POST /athletics/eligibility-cases"

  - priority: 65
    category: business_constraint
    check: "SportSeason.seeded_school_count >= 4 before the bracket opens; calculation transport_release_window's release_minutes does not exceed School.max_release_minutes_per_request; calculation fleet_capacity_overlap admits the trip"
    error_id: "ERR_BRACKET_TOO_SMALL | ERR_RELEASE_TIME_EXCEEDED | ERR_FLEET_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /athletics/sport-seasons/{id}/advance, POST /athletics/transport-requests, POST /athletics/transport-requests/{id}/approve"

  - priority: 70
    category: business_fiscal
    check: "EligibilityCase.fee_outstanding_cents == 0"
    error_id: ERR_FEE_OUTSTANDING
    http_status: 409
    applies_to: "POST /athletics/eligibility-cases/{id}/activate"

  - priority: 71
    category: business_fiscal
    check: "0 < amount_cents <= EligibilityCase.fee_outstanding_cents"
    error_id: ERR_FEE_OVERPAYMENT
    http_status: 422
    applies_to: "POST /athletics/eligibility-cases/{id}/fee-payments"

  - priority: 72
    category: business_fiscal
    check: "fee_paid_cents minus fee_refunded_cents is strictly above 0"
    error_id: ERR_NOTHING_TO_REFUND
    http_status: 422
    applies_to: "POST /athletics/eligibility-cases/{id}/fee-refunds"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Schools -------------------------------------------------------------
  - method: POST
    path: "/athletics/schools"
    description: "Register a member school."
    roles: [AssociationAdmin]
    code: 201
    input: [name, classification, region_code, "school_day_end_utc_hhmm?", "bus_fleet_size?", "max_release_minutes_per_request?", "fee_cap_cents?", "venue_concurrent_capacity?"]
    output: School
    side_effects: ["sanction_status initialised to GOOD_STANDING; forfeit_count, release_minutes_used, fee_collected_cents initialised to 0; credential_gap_sports initialised to the empty list"]

  - method: GET
    path: "/athletics/schools/{id}"
    description: "Read one school including its sanction posture and its two conserved ledgers."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/athletics/schools/{id}/staff-credentials"
    description: "List the coaching credentials held by one school, newest first by created_at DESC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["sport?", "status?", "limit?", "offset?"]
    output: StaffCredential[]
    side_effects: []

  - method: GET
    path: "/athletics/schools/{id}/playoff-seeds"
    description: "List every bracket position this school has been assigned, across seasons, ordered by created_at ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["limit?", "offset?"]
    output: PlayoffSeed[]
    side_effects: []

  # ---- Students ------------------------------------------------------------
  - method: POST
    path: "/athletics/students"
    description: "Enrol a student athlete. Academic fields in this body are ignored; they are writable only through the academic-record endpoint."
    roles: [SchoolAthleticDirector]
    code: 201
    input: [school_id, full_name, birth_date, grade_level, "previous_school_id?", "residency_verified?", "residency_verified_on?", "transfer_date?", "hardship_waiver_granted?", "free_reduced_lunch?"]
    output: Student
    side_effects: ["gpa_prior_period, gpa_current_period, academic_record_submitted_by and academic_record_submitted_at initialised to null; credits fields initialised to 0"]

  - method: POST
    path: "/athletics/students/{id}/academic-record"
    description: "Registrar posts the student's grading-period record. Segregation of duties: the X-User-ID recorded here is barred from later evaluating this student's eligibility cases."
    roles: [Registrar]
    code: 200
    input: [gpa_prior_period, gpa_current_period, credits_prior_period, credits_current_period]
    output: Student
    side_effects: ["Student.academic_record_submitted_by := X-User-ID", "Student.academic_record_submitted_at := logical clock instant", "increments Student.version by 1"]

  - method: GET
    path: "/athletics/students/{id}"
    description: "Read one student athlete."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/athletics/students"
    description: "List students, filterable by current school and by the school they transferred out of, ordered by created_at ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["school_id?", "previous_school_id?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  # ---- Coach certification & background check -------------------------------
  - method: POST
    path: "/athletics/staff-credentials"
    description: "Submit a coaching credential for background screening."
    roles: [SchoolAthleticDirector]
    code: 201
    input: [school_id, coach_name, sport, role_title, certification_expires_on]
    output: StaffCredential
    side_effects: ["status initialised to BACKGROUND_PENDING", "when role_title is HEAD_COACH and the school holds no CLEARED HEAD_COACH credential for that sport, the sport is present in School.credential_gap_sports"]

  - method: POST
    path: "/athletics/staff-credentials/{id}/background-check"
    description: "Adjudicate the background check. From EXPIRED, supplying renewed_certification_expires_on re-credentials the coach and closes the credential gap."
    roles: [AssociationAdmin]
    code: 200
    input: [result, "background_check_reference?", "renewed_certification_expires_on?"]
    output: StaffCredential
    side_effects: ["StaffCredential.status := CLEARED or DENIED", "background_check_completed_on stamped", "on CLEARED with role_title HEAD_COACH, removes the sport from School.credential_gap_sports and increments School.version by 1"]

  - method: POST
    path: "/athletics/staff-credentials/{id}/revoke"
    description: "Revoke a cleared coaching credential. Fires CASCADE-A: credential gap, contest hold, transport cancellation, release-minute restitution."
    roles: [AssociationAdmin]
    code: 200
    input: ["revocation_note?"]
    output: StaffCredential
    side_effects: ["CASCADE-A links 1-4 as spelled out on the StaffCredential CLEARED -> REVOKED transition", "increments School.version by 1"]

  # ---- Season calendar -----------------------------------------------------
  - method: POST
    path: "/athletics/sport-seasons"
    description: "Open a season on the association calendar."
    roles: [AssociationAdmin]
    code: 201
    input: [sport, classification, school_year, sport_tier, practice_start_date, first_contest_date, season_end_date, age_cutoff_date, residency_deadline, grading_lock_date, contest_limit, "required_officials?"]
    output: SportSeason
    side_effects: ["status initialised to PLANNED; scheduled_contest_count, seeded_school_count, unseeded_school_count initialised to 0"]

  - method: POST
    path: "/athletics/sport-seasons/{id}/advance"
    description: "Move the season calendar to the next declared status."
    roles: [AssociationAdmin]
    code: 200
    input: [to_status]
    output: SportSeason
    side_effects: ["SportSeason.status := to_status", "increments SportSeason.version by 1"]

  - method: POST
    path: "/athletics/sport-seasons/{id}/seed"
    description: "Freeze the contest snapshot and draw the bracket per calculation playoff_seed_assignment."
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: SportSeason
    side_effects: ["creates one PlayoffSeed row per school holding at least one snapshot contest", "SportSeason.seeded_school_count and unseeded_school_count written", "SportSeason.status := SEEDING_LOCKED", "increments SportSeason.version by 1"]

  - method: GET
    path: "/athletics/sport-seasons/{id}"
    description: "Read one season, including its current version for optimistic concurrency on contest creation."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: []
    output: SportSeason
    side_effects: []

  - method: GET
    path: "/athletics/sport-seasons/{id}/playoff-seeds"
    description: "Read the drawn bracket, ordered by seed_number ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["limit?", "offset?"]
    output: PlayoffSeed[]
    side_effects: []

  # ---- Eligibility ---------------------------------------------------------
  - method: POST
    path: "/athletics/eligibility-cases"
    description: "Open an eligibility case and assess the participation fee."
    roles: [SchoolAthleticDirector]
    code: 201
    input: [student_id, sport_season_id]
    output: EligibilityCase
    side_effects: ["runs calculation participation_fee_assessment and writes fee_amount_cents and fee_outstanding_cents", "fee_status := PAID when fee_amount_cents is 0, else ASSESSED", "status initialised to INTAKE"]

  - method: POST
    path: "/athletics/eligibility-cases/{id}/clearance-documents"
    description: "File a physical, parental consent, or concussion acknowledgement form against the case."
    roles: [SchoolAthleticDirector, MedicalOfficer]
    code: 201
    input: [doc_type, issued_on, expires_on, signer_name]
    output: ClearanceDocument
    side_effects: ["ClearanceDocument.status computed as VALID or EXPIRED against the logical clock"]

  - method: POST
    path: "/athletics/eligibility-cases/{id}/evaluate"
    description: "Run the eligibility ladder and the GPA variant selector; sets PROVISIONAL_ELIGIBLE or INELIGIBLE."
    roles: [EligibilityReviewer]
    code: 200
    input: []
    output: EligibilityCase
    side_effects: ["writes ineligibility_reason, gpa_variant_applied and effective_gpa", "increments evaluation_count by 1"]

  - method: POST
    path: "/athletics/eligibility-cases/{id}/appeal"
    description: "School appeals an ineligibility ruling, returning the case to UNDER_APPEAL for re-evaluation."
    roles: [SchoolAthleticDirector]
    code: 200
    input: ["appeal_note?"]
    output: EligibilityCase
    side_effects: ["status := UNDER_APPEAL", "increments appeal_count by 1"]

  - method: POST
    path: "/athletics/eligibility-cases/{id}/activate"
    description: "Promote a provisionally eligible athlete to ELIGIBLE once sanction, coach-credential and fee gates all clear."
    roles: [EligibilityReviewer]
    code: 200
    input: []
    output: EligibilityCase
    side_effects: ["status := ELIGIBLE", "activated_at stamped"]

  - method: POST
    path: "/athletics/eligibility-cases/{id}/fee-payments"
    description: "Record a participation-fee payment against the case's fee dimension."
    roles: [SchoolAthleticDirector]
    code: 200
    input: [amount_cents]
    output: EligibilityCase
    side_effects: ["fee_paid_cents and fee_outstanding_cents updated", "fee_status := PARTIALLY_PAID or PAID", "School.fee_collected_cents incremented"]

  - method: POST
    path: "/athletics/eligibility-cases/{id}/fee-waiver-requests"
    description: "Request a hardship waiver of the outstanding participation fee."
    roles: [SchoolAthleticDirector]
    code: 200
    input: [waiver_reason]
    output: EligibilityCase
    side_effects: ["fee_status := WAIVER_REQUESTED"]

  - method: POST
    path: "/athletics/eligibility-cases/{id}/fee-waiver-decisions"
    description: "Association rules on a pending waiver request."
    roles: [AssociationAdmin]
    code: 200
    input: [decision, "decision_note?"]
    output: EligibilityCase
    side_effects: ["on APPROVE: fee_waived_cents := the outstanding balance, fee_outstanding_cents := 0, fee_status := WAIVED, School.fee_collected_cents unchanged", "on DENY: fee_status := WAIVER_DENIED"]

  - method: POST
    path: "/athletics/eligibility-cases/{id}/fee-refunds"
    description: "Refund everything collected on this case, the compensating action for fee-payments."
    roles: [AssociationAdmin]
    code: 200
    input: [refund_reason]
    output: EligibilityCase
    side_effects: ["fee_refunded_cents := fee_paid_cents", "fee_outstanding_cents recomputed", "School.fee_collected_cents decremented by the refunded cents", "fee_status := REFUNDED"]

  - method: GET
    path: "/athletics/eligibility-cases/{id}"
    description: "Read one eligibility case, both state dimensions and the whole fee ledger."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: []
    output: EligibilityCase
    side_effects: []

  - method: GET
    path: "/athletics/eligibility-cases"
    description: "List eligibility cases, filterable by athlete, season and eligibility status, ordered by created_at ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["student_id?", "sport_season_id?", "status?", "limit?", "offset?"]
    output: EligibilityCase[]
    side_effects: []

  - method: GET
    path: "/athletics/eligibility-cases/{id}/clearance-documents"
    description: "List the clearance forms on a case with their freshness recomputed against the logical clock, ordered by created_at ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["doc_type?", "limit?", "offset?"]
    output: ClearanceDocument[]
    side_effects: []

  # ---- Contests & officials ------------------------------------------------
  - method: POST
    path: "/athletics/contests"
    description: "Schedule a contest. Optimistic concurrency on the parent season's version."
    roles: [SchoolAthleticDirector, AssociationAdmin]
    code: 201
    input: [sport_season_id, home_school_id, away_school_id, starts_at, ends_at, travel_miles, "is_playoff?", expected_sport_season_version]
    output: Contest
    side_effects: ["status initialised to SCHEDULED", "increments SportSeason.scheduled_contest_count by 1", "increments SportSeason.version by 1"]

  - method: POST
    path: "/athletics/contests/{id}/officials"
    description: "Offer the game to an official. Optimistic concurrency on the parent contest's version."
    roles: [OfficialsCoordinator]
    code: 201
    input: [official_id, expected_contest_version]
    output: OfficialAssignment
    side_effects: ["creates an OfficialAssignment in OFFERED", "increments Contest.version by 1"]

  - method: POST
    path: "/athletics/official-assignments/{id}/respond"
    description: "Official accepts or declines the offer; acceptance locks the travel stipend and may promote the contest."
    roles: [Official]
    code: 200
    input: [response]
    output: OfficialAssignment
    side_effects: ["on ACCEPT: stipend_cents written from calculation officials_travel_stipend, Contest.accepted_official_count and Official.accepted_assignment_count incremented, and the contest promoted to OFFICIALS_ASSIGNED once the quorum is met"]

  - method: POST
    path: "/athletics/contests/{id}/confirm"
    description: "Home school confirms the game once officials are complete."
    roles: [SchoolAthleticDirector]
    code: 200
    input: []
    output: Contest
    side_effects: ["Contest.status := CONFIRMED", "hold_reason cleared"]

  - method: POST
    path: "/athletics/contests/{id}/postpone"
    description: "Association moves a confirmed contest to a new date, releasing officials and trips."
    roles: [AssociationAdmin]
    code: 200
    input: [new_starts_at, new_ends_at, "postpone_note?"]
    output: Contest
    side_effects: ["starts_at and ends_at rewritten", "status := SCHEDULED with hold_reason ADMIN_POSTPONE", "officials withdrawn and transport cancelled with release minutes restituted"]

  - method: POST
    path: "/athletics/contests/{id}/result"
    description: "Record the final score, closing the contest and completing its approved trips."
    roles: [SchoolAthleticDirector]
    code: 200
    input: [home_score, away_score]
    output: Contest
    side_effects: ["status := PLAYED", "result_recorded_at stamped", "APPROVED trips move to COMPLETED with School.release_minutes_used unchanged"]

  - method: POST
    path: "/athletics/contests/{id}/forfeit"
    description: "Charge a forfeit. Fires CASCADE-B: forfeit count, sanction posture, provisional-eligibility revocation."
    roles: [AssociationAdmin]
    code: 200
    input: [forfeiting_school_id, "forfeit_note?"]
    output: Contest
    side_effects: ["CASCADE-B links 1-3 as spelled out on the Contest -> FORFEITED transitions", "trips on this contest cancelled with release minutes restituted"]

  - method: GET
    path: "/athletics/contests/{id}"
    description: "Read one contest, including its current version for optimistic concurrency on officiating offers."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: []
    output: Contest
    side_effects: []

  - method: GET
    path: "/athletics/contests"
    description: "List contests, filterable by season, either side's school, forfeiting school and status, ordered by starts_at ASC then created_at ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["sport_season_id?", "home_school_id?", "away_school_id?", "forfeiting_school_id?", "status?", "limit?", "offset?"]
    output: Contest[]
    side_effects: []

  - method: POST
    path: "/athletics/officials"
    description: "Register a certified game official."
    roles: [AssociationAdmin]
    code: 201
    input: [full_name, certification_level, home_region_code]
    output: Official
    side_effects: ["accepted_assignment_count initialised to 0"]

  - method: GET
    path: "/athletics/official-assignments/{id}"
    description: "Read one officiating assignment and its locked stipend."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: []
    output: OfficialAssignment
    side_effects: []

  - method: GET
    path: "/athletics/official-assignments"
    description: "List officiating assignments, filterable by contest and by official, ordered by created_at ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["contest_id?", "official_id?", "status?", "limit?", "offset?"]
    output: OfficialAssignment[]
    side_effects: []

  # ---- Transportation & release time ---------------------------------------
  - method: POST
    path: "/athletics/transport-requests"
    description: "Request buses for a contest; computes depart_at, return_at and the instructional release minutes."
    roles: [SchoolAthleticDirector]
    code: 201
    input: [contest_id, requesting_school_id, travel_minutes, "bus_count?"]
    output: TransportRequest
    side_effects: ["runs calculation transport_release_window and writes depart_at, return_at, release_minutes", "status initialised to REQUESTED; School.release_minutes_used unchanged until approval"]

  - method: POST
    path: "/athletics/transport-requests/{id}/approve"
    description: "Commit buses to the trip after the fleet aggregate-capacity overlap check."
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: TransportRequest
    side_effects: ["status := APPROVED", "School.release_minutes_used incremented by release_minutes"]

  - method: POST
    path: "/athletics/transport-requests/{id}/cancel"
    description: "Compensating action for approval: releases the buses and returns the release minutes."
    roles: [SchoolAthleticDirector]
    code: 200
    input: ["cancel_note?"]
    output: TransportRequest
    side_effects: ["status := CANCELLED with cancelled_reason SCHOOL_REQUEST", "School.release_minutes_used decremented by release_minutes when the trip was APPROVED"]

  - method: GET
    path: "/athletics/transport-requests/{id}"
    description: "Read one transport request with its computed window and release minutes."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: []
    output: TransportRequest
    side_effects: []

  - method: GET
    path: "/athletics/transport-requests"
    description: "List transport requests, filterable by contest and by requesting school, ordered by depart_at ASC then created_at ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["contest_id?", "requesting_school_id?", "status?", "limit?", "offset?"]
    output: TransportRequest[]
    side_effects: []

  # ---- Injury & return to play ---------------------------------------------
  - method: POST
    path: "/athletics/injury-reports"
    description: "File an injury report; suspends every ELIGIBLE case of the athlete."
    roles: [MedicalOfficer]
    code: 201
    input: [student_id, injury_type, "contest_id?", "injury_note?"]
    output: InjuryReport
    side_effects: ["reported_at and reported_by_user_id stamped", "every EligibilityCase of this student with status ELIGIBLE moves to MEDICALLY_SUSPENDED"]

  - method: POST
    path: "/athletics/injury-reports/{id}/advance-stage"
    description: "Advance the graduated return-to-play protocol, or reset it on symptom recurrence."
    roles: [MedicalOfficer]
    code: 200
    input: ["symptom_recurrence?", "stage_note?"]
    output: InjuryReport
    side_effects: ["rtp_stage and last_stage_advanced_at updated; recurrence_count incremented when symptom_recurrence is true"]

  - method: POST
    path: "/athletics/injury-reports/{id}/clear"
    description: "Issue return-to-play clearance or close the athlete's season. Barred to the reporting officer by segregation of duties."
    roles: [MedicalOfficer]
    code: 200
    input: [disposition, "clearance_note?"]
    output: InjuryReport
    side_effects: ["status := CLEARED or SEASON_ENDED; cleared_by_user_id and cleared_at stamped", "on RETURN_TO_PLAY, MEDICALLY_SUSPENDED cases of this athlete return to ELIGIBLE"]

  - method: GET
    path: "/athletics/injury-reports/{id}"
    description: "Read one injury report and its protocol position."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: []
    output: InjuryReport
    side_effects: []

  - method: GET
    path: "/athletics/injury-reports"
    description: "List injury reports, filterable by athlete and by contest, ordered by reported_at ASC then created_at ASC."
    roles: [AssociationAdmin, SchoolAthleticDirector, Registrar, EligibilityReviewer, MedicalOfficer, OfficialsCoordinator, Official]
    code: 200
    input: ["student_id?", "contest_id?", "status?", "limit?", "offset?"]
    output: InjuryReport[]
    side_effects: []

  # ---- Logical clock (test-driving) ----------------------------------------
  - method: POST
    path: "/athletics/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every date/time rule in this scaffold reads that instant and never falls back to real wall-clock time. Setting the clock also runs the credential-expiry checkpoint."
    roles: [AssociationAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, expired_credential_count: integer, expired_document_count: integer }
    side_effects: ["every StaffCredential with status CLEARED and certification_expires_on <= the new UTC date moves to EXPIRED, possibly reopening School.credential_gap_sports and incrementing School.version by 1", "ClearanceDocument.status is recomputed on read against the new clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role names no role in section 1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed principal acts on a resource governed by a different School or Official id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the principal recorded on the record being adjudicated (Student.academic_record_submitted_by on evaluate, InjuryReport.reported_by_user_id on clear)"

  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "a school id in the path or body resolves to no School"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "a student id in the path or body resolves to no Student"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "a season id in the path or body resolves to no SportSeason"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "an eligibility case id in the path resolves to no EligibilityCase"
  - id: ERR_CONTEST_NOT_FOUND
    http: 404
    condition: "a contest id in the path or body resolves to no Contest"
  - id: ERR_OFFICIAL_NOT_FOUND
    http: 404
    condition: "official_id in the body resolves to no Official"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "an assignment id in the path resolves to no OfficialAssignment"
  - id: ERR_TRANSPORT_REQUEST_NOT_FOUND
    http: 404
    condition: "a transport request id in the path resolves to no TransportRequest"
  - id: ERR_INJURY_REPORT_NOT_FOUND
    http: 404
    condition: "an injury report id in the path resolves to no InjuryReport"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "a credential id in the path resolves to no StaffCredential"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is outside its declared set, a number is out of range, a timestamp does not parse, or ends_at is not strictly after starts_at"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset below 0"

  - id: ERR_STALE_SEASON_VERSION
    http: 412
    condition: "expected_sport_season_version does not equal the current SportSeason.version on POST /athletics/contests"
  - id: ERR_STALE_CONTEST_VERSION
    http: 412
    condition: "expected_contest_version does not equal the current Contest.version on POST /athletics/contests/{id}/officials"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's current state has no declared transition for the requested trigger"
  - id: ERR_CASE_NOT_ACTIVATABLE
    http: 409
    condition: "activate called on a case whose status is not PROVISIONAL_ELIGIBLE"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "appeal called on a case that has already appealed twice"
  - id: ERR_ALREADY_RESPONDED
    http: 409
    condition: "respond called on an assignment whose status is not OFFERED"
  - id: ERR_RTP_STAGE_CEILING
    http: 409
    condition: "advance-stage called without symptom_recurrence on a report already at rtp_stage 5"
  - id: ERR_RTP_STAGE_INCOMPLETE
    http: 409
    condition: "clear with disposition RETURN_TO_PLAY called before rtp_stage reaches 5"
  - id: ERR_CREDENTIAL_ALREADY_LAPSED
    http: 409
    condition: "background-check would clear a credential whose effective certification_expires_on is on or before the logical clock UTC date"
  - id: ERR_SEASON_HAS_OPEN_CONTESTS
    http: 409
    condition: "seed called while any Contest of the season is still in SCHEDULED, OFFICIALS_ASSIGNED or CONFIRMED"
  - id: ERR_SEASON_NOT_OPEN
    http: 409
    condition: "the governing SportSeason's status does not admit the operation"
  - id: ERR_CONTEST_NOT_STAFFABLE
    http: 409
    condition: "an official responds to an offer whose contest has left {SCHEDULED, OFFICIALS_ASSIGNED}"
  - id: ERR_CONTEST_NOT_SCHEDULED_FOR_TRANSPORT
    http: 409
    condition: "transport approval attempted while the contest is not in {OFFICIALS_ASSIGNED, CONFIRMED}"

  - id: ERR_SCHOOL_SANCTIONED
    http: 409
    condition: "the governing School.sanction_status is SUSPENDED"
  - id: ERR_COACH_NOT_CREDENTIALED
    http: 409
    condition: "the student's school holds no CLEARED, unexpired HEAD_COACH credential for the season's sport"
  - id: ERR_ACADEMIC_RECORD_MISSING
    http: 409
    condition: "evaluate called for a student whose academic_record_submitted_at is null"
  - id: ERR_ATHLETE_MEDICALLY_SUSPENDED
    http: 409
    condition: "activate called while the athlete holds an InjuryReport in {REPORTED, RTP_IN_PROGRESS}"

  - id: ERR_CONTEST_OUTSIDE_SEASON_WINDOW
    http: 409
    condition: "date(starts_at) falls before first_contest_date or after season_end_date"
  - id: ERR_VENUE_TURNOVER_CONFLICT
    http: 409
    condition: "the home venue's forward-buffered occupancy would exceed School.venue_concurrent_capacity"
  - id: ERR_OFFICIAL_DOUBLE_BOOKED
    http: 409
    condition: "the official's buffered half-open windows intersect with positive measure"
  - id: ERR_RTP_INTERVAL_NOT_ELAPSED
    http: 409
    condition: "a 48-hour initial rest, 24-hour inter-stage, or 144-hour total return-to-play floor has not elapsed on the logical clock"
  - id: ERR_TRANSPORT_DEPARTURE_IN_PAST
    http: 409
    condition: "the computed depart_at is at or before the logical clock"
  - id: ERR_RESULT_BEFORE_TIPOFF
    http: 409
    condition: "a result is posted before the contest's starts_at"
  - id: ERR_CONTEST_TIME_IN_PAST
    http: 409
    condition: "a postponement's new_starts_at is at or before the logical clock"

  - id: ERR_SAME_SCHOOL_CONTEST
    http: 409
    condition: "home_school_id equals away_school_id"
  - id: ERR_CLASSIFICATION_MISMATCH
    http: 409
    condition: "either school's classification differs from the season's classification"
  - id: ERR_SEASON_CONTEST_LIMIT
    http: 409
    condition: "the projected count for a school would exceed SportSeason.contest_limit"
  - id: ERR_CONTEST_WINDOW_DENSITY
    http: 409
    condition: "a school already holds MAX_CONTESTS_PER_WINDOW contests inside the half-open 7-day-either-side window"
  - id: ERR_BRACKET_TOO_SMALL
    http: 409
    condition: "advance to PLAYOFFS attempted with fewer than MIN_BRACKET_SCHOOLS (4) seeded schools"
  - id: ERR_RELEASE_TIME_EXCEEDED
    http: 409
    condition: "computed release_minutes exceeds School.max_release_minutes_per_request"
  - id: ERR_FLEET_CAPACITY_EXCEEDED
    http: 409
    condition: "committed bus_count over the closed overlap window plus this trip exceeds School.bus_fleet_size"

  - id: ERR_OFFICIALS_INCOMPLETE
    http: 409
    condition: "confirm attempted with accepted_official_count below SportSeason.required_officials"
  - id: ERR_SEEDING_EMPTY_SNAPSHOT
    http: 409
    condition: "seed attempted on a season whose PLAYED/FORFEITED snapshot is empty"
  - id: ERR_SCHOOL_NOT_IN_CONTEST
    http: 409
    condition: "forfeiting_school_id is neither the home nor the away school"
  - id: ERR_DUPLICATE_ELIGIBILITY_CASE
    http: 409
    condition: "an EligibilityCase already exists for this (student_id, sport_season_id) pair"

  - id: ERR_FEE_OUTSTANDING
    http: 409
    condition: "activate attempted while fee_outstanding_cents is above 0"
  - id: ERR_FEE_OVERPAYMENT
    http: 422
    condition: "amount_cents is not in (0, fee_outstanding_cents]"
  - id: ERR_NOTHING_TO_REFUND
    http: 422
    condition: "a refund is requested where fee_paid_cents minus fee_refunded_cents is zero"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssociationAdmin
    description: "State association operations staff: calendar, sanctions, seeding, background-check adjudication, waiver decisions, refunds, transport approval, forfeits, postponements, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/schools"
      - "POST /athletics/officials"
      - "POST /athletics/sport-seasons"
      - "POST /athletics/sport-seasons/{id}/advance"
      - "POST /athletics/sport-seasons/{id}/seed"
      - "POST /athletics/staff-credentials/{id}/background-check"
      - "POST /athletics/staff-credentials/{id}/revoke"
      - "POST /athletics/eligibility-cases/{id}/fee-waiver-decisions"
      - "POST /athletics/eligibility-cases/{id}/fee-refunds"
      - "POST /athletics/contests/{id}/postpone"
      - "POST /athletics/contests/{id}/forfeit"
      - "POST /athletics/transport-requests/{id}/approve"
      - "POST /athletics/_clock/set_current_utc"
    shared_operations:
      - "POST /athletics/contests (shared with SchoolAthleticDirector; the admin is not bound by the home-school ownership check)"
      - "all GET endpoints"

  - name: SchoolAthleticDirector
    description: "Athletic director acting for one member school; owns that school's students, credentials, eligibility filings, fee payments, contests and trips."
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /athletics/students"
      - "POST /athletics/staff-credentials"
      - "POST /athletics/eligibility-cases"
      - "POST /athletics/eligibility-cases/{id}/appeal"
      - "POST /athletics/eligibility-cases/{id}/fee-payments"
      - "POST /athletics/eligibility-cases/{id}/fee-waiver-requests"
      - "POST /athletics/contests/{id}/confirm"
      - "POST /athletics/contests/{id}/result"
      - "POST /athletics/transport-requests"
      - "POST /athletics/transport-requests/{id}/cancel"
    shared_operations:
      - "POST /athletics/contests (shared with AssociationAdmin; X-User-ID must equal home_school_id)"
      - "POST /athletics/eligibility-cases/{id}/clearance-documents (shared with MedicalOfficer)"
      - "all GET endpoints"

  - name: Registrar
    description: "School records officer. Posts grading-period academic records and nothing else; the segregation-of-duties rule bars this principal's id from ruling on the resulting eligibility cases."
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /athletics/students/{id}/academic-record"
    shared_operations:
      - "all GET endpoints"

  - name: EligibilityReviewer
    description: "Association eligibility officer. Runs the ladder and promotes cases to ELIGIBLE; may never post the academic record it rules on."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/eligibility-cases/{id}/evaluate"
      - "POST /athletics/eligibility-cases/{id}/activate"
    shared_operations:
      - "all GET endpoints"

  - name: MedicalOfficer
    description: "Licensed physician or athletic trainer. Files injury reports, runs the return-to-play protocol, and files physical/concussion forms; barred from clearing a report they themselves filed."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/injury-reports"
      - "POST /athletics/injury-reports/{id}/advance-stage"
      - "POST /athletics/injury-reports/{id}/clear"
    shared_operations:
      - "POST /athletics/eligibility-cases/{id}/clearance-documents (shared with SchoolAthleticDirector)"
      - "all GET endpoints"

  - name: OfficialsCoordinator
    description: "Association assignor who offers games to certified officials."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/contests/{id}/officials"
    shared_operations:
      - "all GET endpoints"

  - name: Official
    description: "Certified game official acting for themselves; accepts or declines offers."
    identity: "entity_backed:Official"
    exclusive_operations:
      - "POST /athletics/official-assignments/{id}/respond"
    shared_operations:
      - "all GET endpoints"
