          rationale: "Both variants and their delta are asserted there, and the defect-allocation instance covers the second dual-variant calculation."

  # ===========================================================================
  - section: consistency model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
