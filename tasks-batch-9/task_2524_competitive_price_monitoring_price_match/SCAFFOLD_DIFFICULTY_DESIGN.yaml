  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: invalid_state_outranks_confidence_threshold_on_match_confirm
        grounds:
          - validations.priority_40_ERR_INVALID_STATE
          - validations.priority_69_ERR_CONFIDENCE_BELOW_CONFIRM_THRESHOLD
          - state_machines.CompetitorProductLink.PROPOSED_to_REJECTED
        distinguishing_aspect: |
          Category pair state (40) vs business_constraint (69). The link is REJECTED
          (so CONFIRM is not a declared transition) AND its confidence_bp of 8485 is
          below the 8500 PROPOSED threshold, so both rules fire; the 409
          ERR_INVALID_STATE must win over the 422 ERR_CONFIDENCE_BELOW_CONFIRM_THRESHOLD.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST, ACTIVE product SKU-BLENDER-1, ACTIVE PRIMARY competitor C-ALPHA."
            - "ATTRIBUTE link with scores 100 / 60 / 79, so confidence_bp is 8485 and match_grade is CLOSE."
            - "The link is driven to REJECTED before the trigger."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-BLENDER-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 24999, unit_cost_cents: 15000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "ATTRIBUTE", identifier_score: 100, attribute_score: 60, image_score: 79 }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "REJECT", note: "wrong capacity variant" }
              as: PricingManager
              as_user_id: "manager-9"
          trigger:
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_CONFIDENCE_BELOW_CONFIRM_THRESHOLD even though 8485 < 8500 would trip priority 69"
            - "CompetitorProductLink.${l_id}.status is still REJECTED and confidence_bp is still 8485"
            - "Competitor.${c1_id}.confirmed_match_count == 0"

      - name: map_floor_outranks_match_discount_cap_on_claim_creation
        grounds:
          - validations.priority_50_ERR_MAP_FLOOR_VIOLATION
          - validations.priority_82_ERR_MATCH_DISCOUNT_CAP_EXCEEDED
          - calculations.price_match_honored_price
        distinguishing_aspect: |
          A different category pair on a different endpoint: business_safety (50) vs
          business_fiscal (82) on POST /pricing/claims. A claimed price of 5000 is below
          the 9000 map_floor AND yields discount 3999 above the 3250 cap, so both fire
          and the MAP violation must win; a second claim at 9900 clears MAP and returns
          the cap error, proving priority 82 was live all along.
