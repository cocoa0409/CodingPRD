  - section: rbac
    instances:
      - name: corner_rbac_missing_user_id_outranks_unknown_role_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MISSING_AUTH_HEADERS
          - validations.priority_1_before_priority_2
        distinguishing_aspect: "Both auth defects are present at once - an empty X-User-ID and a role name outside the eight declared roles - and the header-presence check at priority 1 must win over the unknown-role check at priority 2, even though both return 401."
        test_recipe:
          setup:
            - "One bakery exists; the request carries X-User-Role: BakeryManager and an empty X-User-ID."
          setup_api_calls:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Auth Order Bakery", allergen_program: "STANDARD", credit_limit_cents: 10000000, min_drop_cents: 1000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /bakery-distribution/customers/${cust_id}"
              payload: {}
              as: BakeryManager
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 401 and ${err} == ERR_MISSING_AUTH_HEADERS"
            - "${err} is not ERR_UNKNOWN_ROLE (priority 1 precedes priority 2)"
            - "Sending the same unknown role with a non-empty X-User-ID instead returns 401 ERR_UNKNOWN_ROLE"

      - name: corner_rbac_unknown_role_outranks_role_not_permitted_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNKNOWN_ROLE
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "An undeclared role hitting an endpoint it could never be listed on returns 401 ERR_UNKNOWN_ROLE, not the 403 ERR_ROLE_NOT_PERMITTED that a real-but-unauthorised role would receive on the identical call."
        test_recipe:
          setup:
            - "Empty database; the target endpoint is the PricingController-only SKU creation surface."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa_1"
          trigger:
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-RBAC-30", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 180, list_price_cents_per_lb: 30 }
              as: MillSupervisor
              as_user_id: "ms_1"
              captures: { err: $.data.error_id }
          assert:
