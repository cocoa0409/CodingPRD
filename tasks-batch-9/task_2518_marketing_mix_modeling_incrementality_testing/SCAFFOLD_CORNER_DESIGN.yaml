              as_user_id: "de-1"
          assert:
            - "Call 1 returns 422 with data.error_id == ERR_PERIOD_NOT_ALIGNED - 2026-08-31 is the EXCLUSIVE window end and therefore not a valid period start, even though it is exactly 28 days after the start."
            - "Call 2 returns 422 with data.error_id == ERR_PERIOD_NOT_ALIGNED - 2026-08-05 lies inside the range but is not a multiple of 7 days after 2026-08-03."
            - "Call 3 returns 422 with data.error_id == ERR_PERIOD_NOT_ALIGNED - 2026-07-27 is before window_start_date."
            - "Call 4 returns 201: 2026-08-24 is the last valid grid date, which proves the three refusals are about placement and not about the endpoint being broken."
            - "Call 5 returns 409 with data.error_id == ERR_DATA_WINDOW_OVERLAP - for conflict detection W1 occupies the CLOSED interval through 2026-08-31, so a WEEKLY window starting on that same date conflicts."
            - "Call 6 returns 201 with granularity DAILY over the identical dates - granularity is part of the conflict key, so the DAILY window may overlap W1 freely."
            - "GET /mmm/sales-observations?data_window_id=${w1} returns total_count == 0 and GET /mmm/data-windows?market_id=${mkt} returns total_count == 2 (W1 and the DAILY window only)."
      - name: scoped_duplicate_natural_keys_rejected
        claim_type: violation_to_error
        grounds:
