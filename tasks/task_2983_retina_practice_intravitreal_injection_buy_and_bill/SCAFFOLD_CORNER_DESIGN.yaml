      - name: corner_documentation_gates_reject_dose_prep_and_wastage_errors_in_priority_order
        claim_type: priority_ordering
        grounds:
          - validations.priority_9
          - validations.priority_28
          - validations.priority_29
          - validations.priority_30
          - errors[ERR_DOSE_EXCEEDS_VIAL_FILL]
          - errors[ERR_PREP_ATTESTATION_REQUIRED]
          - errors[ERR_ATTESTED_WASTAGE_MISMATCH]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The documentation gates are ordered: a 0.3 ml dose exceeds vial_fill_ml (422) and so does a zero dose (the range is 0 < dose <= 0.27), an unconfirmed prep is 422, and on attestation the priority-9 segregation-of-duties check outranks the priority-30 wastage comparison — the injecting clinician attesting the WRONG volume is still rejected as ERR_SEGREGATION_OF_DUTIES, not as ERR_ATTESTED_WASTAGE_MISMATCH."
        test_recipe:
          setup:
            - "the corner prologue with DRAFT encounter ENC-NP holding a reserved vial"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
