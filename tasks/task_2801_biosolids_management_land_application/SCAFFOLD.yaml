  - method: POST
    path: /alternative-outlets/{outletId}/set-status
    description: "Move an outlet between ACCEPTING, SUSPENDED and CLOSED. Suspending or closing an outlet leaves already COMMITTED orders alone; only new commits are blocked."
    roles: [ComplianceOfficer]
