        payload:
          full_name: Imm M
          date_of_birth: '1985-05-05'
          relationship: SELF
          external_member_ref: IM-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      - call: POST /care/providers
        payload:
          name: Imm Clinic
          specialty: GENERAL
          network_status: IN_NETWORK
        as: PlatformAdmin
        captures:
          prov_id: $.data.id
      - call: POST /care/claims
        payload:
          member_id: ${m_id}
          provider_id: ${prov_id}
          service_date: '2026-08-01'
          billed_amount_cents: 100000
          allowed_amount_cents: 100000
          lines:
          - line_code: A
            billed_cents: 100000
            schedule_rate: 0.7
            error_flag: UPCODING
        as: PlanAdministrator
        captures:
          claim_id: $.data.id
      trigger:
      - call: POST /care/claims/${claim_id}/adjudicate
        payload: {}
        as: PlanAdministrator
