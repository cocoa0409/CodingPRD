  # --- TakedownNotice --------------------------------------------------------
  - method: POST
    path: "/dmca/notices"
    description: "Intake a takedown notice with its statutory elements and claimed URLs"
    roles: [RightsHolderRep, TakedownAgent]
    code: 201
    input: [rights_holder_id, submission_channel, claimed_urls, "ingestion_batch_id?", "signature_present?", "work_identification?", "material_identification?", "contact_email?", "good_faith_statement?", "accuracy_statement?", "authority_statement?", "sworn_under_penalty?"]
    output: TakedownNotice
    side_effects: ["status starts at RECEIVED", "moves a referenced IngestionBatch from ACCEPTED to PROCESSING and increments its notices_created"]

  - method: GET
    path: "/dmca/notices/{id}"
    description: "Read one takedown notice with its score and variant"
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator, RightsHolderRep]
    code: 200
    input: []
    output: TakedownNotice
    side_effects: []

  - method: GET
    path: "/dmca/notices"
    description: "List takedown notices, oldest first"
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator, RightsHolderRep]
    code: 200
    input: ["rights_holder_id?", "ingestion_batch_id?", "status?", "limit?", "offset?"]
    output: TakedownNotice[]
    side_effects: []

  - method: POST
    path: "/dmca/notices/{id}/validate"
    description: "Validate the statutory elements, rejecting deficient notices"
    roles: [TakedownAgent]
    code: 200
    input: []
    output: TakedownNotice
    side_effects:
      - "runs notice_statutory_completeness and writes completeness_score, compliance_variant, validated_at"
      - "on the rejection branch writes rejection_reason, increments RightsHolder.rejected_count and recomputes rights_holder_abuse_score"
      - "an abuse_score at or above AUTO_OPEN_FLOOR opens one MisrepresentationCase with opened_by_user_id null when an eligible claim exists"

  - method: POST
    path: "/dmca/notices/{id}/process"
    description: "Expeditiously disable access to the claimed material and notify the subscriber"
    roles: [TakedownAgent]
    code: 200
    input: []
    output: TakedownNotice
    side_effects:
      - "creates one NoticeClaim per resolved URL in claimed_urls order, each DISABLED, evaluating claim_dispute_interval_overlap and reference_match_confidence"
      - "disables each ContentItem, sets dispute_status UNDER_NOTICE and increments Account.notified_count"
      - "decrements Account.available_content_count per disabled item"
      - "accrues one StrikeRecord per claim, recomputes account_strike_points, may move standing to LIMITED and may open a TerminationCase"
      - "sets matched_claim_count, unmatched_url_count, processed_at and increments RightsHolder.notices_processed"

  - method: POST
    path: "/dmca/notices/{id}/withdraw"
    description: "Withdraw a notice, compensating every side effect it produced"
    roles: [RightsHolderRep]
    code: 200
    input: []
    output: TakedownNotice
    side_effects:
      - "moves every non-terminal child NoticeClaim to WITHDRAWN"
      - "restores each affected ContentItem unless PURGED and increments Account.available_content_count back"
      - "voids each claim's StrikeRecord and recomputes account_strike_points, possibly returning standing to ACTIVE"
      - "increments RightsHolder.withdrawn_count and recomputes rights_holder_abuse_score"

  # --- NoticeClaim -----------------------------------------------------------
  - method: GET
    path: "/dmca/claims/{id}"
    description: "Read one notice claim"
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator, RightsHolderRep, Subscriber]
    code: 200
    input: []
    output: NoticeClaim
    side_effects: []

  - method: GET
    path: "/dmca/claims"
    description: "List notice claims, oldest first; the only discovery channel for cascade-created claims"
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator, RightsHolderRep, Subscriber]
    code: 200
    input: ["notice_id?", "content_item_id?", "rights_holder_id?", "reference_file_id?", "status?", "limit?", "offset?"]
    output: NoticeClaim[]
    side_effects: []

  - method: GET
    path: "/dmca/claims/{id}/strikes"
    description: "List the strike records produced by one claim"
    roles: [ComplianceOfficer, TakedownAgent, Subscriber]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StrikeRecord[]
    side_effects: []

  - method: POST
    path: "/dmca/claims/{id}/uphold"
    description: "Uphold a claim once the counter-notice window closed without a valid counter-notice, or finalise a RESTORATION_SCHEDULED claim whose counter-notice is BLOCKED_BY_SUIT"
    roles: [TakedownAgent]
    code: 200
    input: []
    output: NoticeClaim
    side_effects:
      - "status becomes UPHELD and the ContentItem dispute_status becomes RESOLVED while access stays DISABLED"
      - "accrues a second StrikeRecord with reason CLAIM_UPHELD and recomputes account_strike_points, but ONLY on the DISABLED -> UPHELD path"
      - "on the RESTORATION_SCHEDULED -> UPHELD path (the governing counter-notice is BLOCKED_BY_SUIT) no second strike accrues and restoration_due_at is cleared"
      - "auto-closes the notice when every sibling claim is terminal"

  - method: POST
    path: "/dmca/claims/{id}/restore"
    description: "Restore access once the restoration window opened and no suit was filed"
    roles: [TakedownAgent]
    code: 200
    input: []
    output: NoticeClaim
    side_effects:
      - "status becomes RESTORED, the ContentItem becomes RESTORED and dispute_status RESOLVED"
      - "increments Account.available_content_count and voids this claim's StrikeRecord"
      - "moves the governing CounterNotice to RESTORED and auto-closes the notice when every sibling claim is terminal"

  # --- CounterNotice ---------------------------------------------------------
  - method: POST
    path: "/dmca/counter-notices"
    description: "Receive a subscriber counter-notice against a disabled claim; supersedes an earlier non-terminal one"
    roles: [Subscriber]
    code: 201
    input: [claim_id, expected_claim_version, subscriber_name, "contact_email?", "material_identification?", "signature_present?", "good_faith_mistake_statement?", "consent_to_jurisdiction?", "consent_to_service_of_process?"]
    output: CounterNotice
    side_effects:
      - "increments NoticeClaim.version by 1"
      - "sets superseded_by_counter_notice_id on an earlier RECEIVED or VALIDATED counter-notice of the same claim and returns that claim to DISABLED"
      - "copies account_id from the claim's ContentItem owner"

  - method: GET
    path: "/dmca/counter-notices/{id}"
    description: "Read one counter-notice with its restoration window"
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator, RightsHolderRep, Subscriber]
    code: 200
    input: []
    output: CounterNotice
    side_effects: []

  - method: GET
    path: "/dmca/counter-notices"
    description: "List counter-notices, oldest first"
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator, RightsHolderRep, Subscriber]
    code: 200
    input: ["claim_id?", "account_id?", "superseded_by_counter_notice_id?", "status?", "limit?", "offset?"]
    output: CounterNotice[]
    side_effects: []

  - method: POST
    path: "/dmca/counter-notices/{id}/validate"
    description: "Validate the counter-notice statutory elements including the non-waivable consents"
    roles: [TakedownAgent]
    code: 200
    input: []
    output: CounterNotice
    side_effects:
      - "runs counter_notice_statutory_completeness and writes completeness_score"
      - "on success moves the claim DISABLED -> COUNTER_NOTICED and the ContentItem dispute_status to COUNTER_NOTICED"
      - "on failure writes rejection_reason and leaves access disabled"

  - method: POST
    path: "/dmca/counter-notices/{id}/forward"
    description: "Forward the counter-notice to the complainant and open the restoration window"
    roles: [TakedownAgent]
    code: 200
    input: []
    output: CounterNotice
    side_effects:
      - "sets forwarded_at and runs restoration_window to set restoration_earliest_at and restoration_deadline_at"
      - "moves the claim to RESTORATION_SCHEDULED with restoration_due_at and the ContentItem dispute_status to RESTORATION_PENDING"

  - method: POST
    path: "/dmca/counter-notices/{id}/record-suit-notice"
    description: "Record the complainant's notice of court action, blocking restoration"
    roles: [TakedownAgent]
    code: 200
    input: []
    output: CounterNotice
    side_effects:
      - "sets suit_notice_at and status BLOCKED_BY_SUIT"
      - "moves the claim to UPHELD, clears restoration_due_at and keeps access DISABLED"
      - "sets the ContentItem dispute_status to RESOLVED"

