          fulfillment_choice: VENDING_MACHINE
        as: Customer
        as_user_id: ${vm_cust}
        captures:
          vm_ord3: $.data.id
      - call: POST /vehicle-hub/orders/${vm_ord1}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${vm_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${vm_ord2}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${vm_cust}
      - call: POST /vehicle-hub/orders/${vm_ord3}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${vm_cust}
      - call: POST /vehicle-hub/orders/${vm_ord1}/structure
