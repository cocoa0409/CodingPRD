      - name: credential_verify_guarded_by_application_state
        grounds:
          - state_machines.CredentialVerification.PENDING_to_VERIFIED
          - state_machines.AdjunctApplication.UNDER_REVIEW_to_REJECTED
        distinguishing_aspect: |
          Entity pair CredentialVerification -> AdjunctApplication (a different
          pair from instance 1's Contract -> AdjunctFaculty): a PENDING
          credential cannot be verified once its parent application has left
          UNDER_REVIEW (here: REJECTED), even though the credential row itself
          is still PENDING — the valid-transition set depends on the parent's
          state.
        test_recipe:
          setup:
            - "Application REJECTED while one of its credentials is still PENDING"
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
