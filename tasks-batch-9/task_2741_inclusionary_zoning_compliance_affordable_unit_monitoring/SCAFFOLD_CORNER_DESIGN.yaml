      - name: posture_clauses_are_evaluated_in_order_so_enforcement_outranks_deficiency
        claim_type: correct_result
        grounds:
          - calculations.project_compliance_posture
          - calculations.project_obligation_equivalents
        distinguishing_aspect: |
          The posture clauses are ordered and the first match wins, which matters because a
          project can satisfy two clauses at once. A 27-unit R-4 project owes 40500 bps and
          delivers four whole units for 40000 bps, so it is permanently DEFICIENT; escalating a
          monitoring finding on one of those units then makes the enforcement clause match too,
          and the reported posture becomes UNDER_ENFORCEMENT rather than DEFICIENT. Re-curing the
          same review walks the posture back to DEFICIENT, proving the recomputation is a
          one-pass function of the stored aggregates and not a latching flag.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-4, 27 units, approval 2026-01-15) screened SUBJECT: 4 required units, fractional_obligation_bps 500, total_obligation_bps 40500; ONSITE elected and agreement recorded."
            - "Four RENTAL 2-bedroom units EN-101 through EN-104 at 5000 bps, delivering 40000 bps of the 40500 owed, and no in-lieu fee assessed."
            - "Household H1 (size 3, income 6000000) certified into EN-101 at rent 140000, which moves the project to MONITORING and sets max_allowed_rent_cents 143872."
            - "Clock advanced to 2027-03-01T00:00:00Z and a 2027 MonitoringReview on EN-101 reporting rent 165000 is issued by hco-1, giving cure_deadline 2027-03-31."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
