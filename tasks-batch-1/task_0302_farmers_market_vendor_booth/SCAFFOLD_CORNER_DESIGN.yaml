# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Farmers Market & Vendor Booth Management — Expert band (breadth probe)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Standard market policy (reuse): season_fee=50000, daily_fee=4000,
# commission_bps=700, voucher_face_value=200, season 2026-06-01..2026-09-30.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_market_returns_201_with_zeroed_ledgers
        claim_type: Creation
        grounds: [entities.Market, endpoints]
        distinguishing_aspect: "POST /markets with all required fields returns 201 and Market with booth_count=0, total_commission_accrued_cents=0, total_fees_collected_cents=0, voucher_liability_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Market.${mkt}.booth_count == 0"
            - "Market.${mkt}.total_fees_collected_cents == 0"
            - "Market.${mkt}.voucher_liability_cents == 0"
            - "Market.${mkt}.version == 1"

      - name: get_market_returns_stored_data
        claim_type: Retrieval
        grounds: [entities.Market, endpoints]
        distinguishing_aspect: "GET /markets/{id} returns the stored market with the same name and policy fields supplied at creation."
        test_recipe:
          setup: ["One market created."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
          trigger:
            - call: "GET /markets/${mkt}"
              payload: {}
              as: MarketAdmin
          assert:
            - "HTTP status == 200"
            - "response.data.name == Green Sq"
            - "response.data.commission_bps == 700"

      - name: list_booths_paginated_with_total_count
        claim_type: Listing
        grounds: [entities.Booth, endpoints]
        distinguishing_aspect: "GET /markets/{id}/booths returns a paginated array with total_count and has_more in meta; limit defaults to 10."
        test_recipe:
          setup: ["Market with 2 booths."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "A-1", grid_row: 0, grid_col: 1, size_class: "SINGLE", allowed_categories: [] }
              as: MarketAdmin
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "A-2", grid_row: 0, grid_col: 2, size_class: "DOUBLE", allowed_categories: [] }
              as: MarketAdmin
          trigger:
            - call: "GET /booths"
              payload: {}
              as: MarketAdmin
          assert:
            - "HTTP status == 200"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"

      - name: get_market_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Market"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /markets/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /markets/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MarketAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_market_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Market"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /markets omitting commission_bps returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: assignment_type_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.BoothAssignment.fields.assignment_type"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /booth-assignments with assignment_type='WEEKLY' (illegal enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Market with one booth and one ACTIVE vendor APPROVED for CRAFTS."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "A-1", grid_row: 0, grid_col: 1, size_class: "SINGLE", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id, booth_v: $.data.version }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${ven}", assignment_type: "WEEKLY", expected_booth_version: "${booth_v}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: season_window_dates_reversed_returns_validation_bounds
        claim_type: Type Constraints
        grounds:
          - "entities.Market.fields.season_end_date"
          - "errors[ERR_VALIDATION_BOUNDS]"
        distinguishing_aspect: "POST /markets with season_end_date < season_start_date returns ERR_VALIDATION_BOUNDS (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /markets"
              payload: { name: "Bad", season_start_date: "2026-09-30", season_end_date: "2026-06-01", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_VALIDATION_BOUNDS"

      - name: commission_bps_out_of_range_returns_validation_bounds
        claim_type: Type Constraints
        grounds:
          - "entities.Market.fields.commission_bps"
          - "errors[ERR_VALIDATION_BOUNDS]"
        distinguishing_aspect: "POST /markets with commission_bps=10001 (>10000) returns ERR_VALIDATION_BOUNDS (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /markets"
              payload: { name: "Bad", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 10001, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_VALIDATION_BOUNDS"

      - name: permit_expiry_not_after_issue_returns_validation_bounds
        claim_type: Type Constraints
        grounds:
          - "entities.Permit.fields.expiry_date"
          - "errors[ERR_VALIDATION_BOUNDS]"
        distinguishing_aspect: "POST /permits with expiry_date <= issue_date returns ERR_VALIDATION_BOUNDS (422)."
        test_recipe:
          setup: ["Market and one vendor."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { vendor_id: "${ven}", permit_type: "HEALTH", permit_number: "H-1", issue_date: "2026-05-10", expiry_date: "2026-05-10" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_VALIDATION_BOUNDS"

      - name: requires_health_permit_computed_from_category
        claim_type: Computed Fields
        grounds: [entities.Application.fields.requires_health_permit]
        distinguishing_aspect: "Creating a DAIRY application yields requires_health_permit==true; a CRAFTS application yields false — server-computed from product_category, input ignored."
        test_recipe:
          setup: ["Market and one vendor."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "DAIRY" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Application.${app}.requires_health_permit == true"

      - name: vendor_id_and_status_system_assigned
        claim_type: System Fields
        grounds: [entities.Vendor.fields.status]
        distinguishing_aspect: "POST /vendors returns server-minted id and status=PROSPECT regardless of any client-supplied status; created_at present, version==1."
        test_recipe:
          setup: ["One market."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
          trigger:
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Vendor.${ven}.status == PROSPECT"
            - "Vendor.${ven}.version == 1"

      - name: duplicate_booth_label_returns_duplicate
        claim_type: Type Constraints
        grounds:
          - "entities.Booth.fields.label"
          - "validations[priority=13]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Creating a second Booth with a label already used in the market returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Market with a booth labeled A-1."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "A-1", grid_row: 0, grid_col: 1, size_class: "SINGLE", allowed_categories: [] }
              as: MarketAdmin
          trigger:
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "A-1", grid_row: 0, grid_col: 2, size_class: "DOUBLE", allowed_categories: [] }
              as: MarketAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DUPLICATE"

      - name: child_vendor_requires_existing_market_parent
        claim_type: Parent Relationships
        grounds:
          - "entities.Vendor.fields.market_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /vendors with market_id pointing to a non-existent market returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { market_id: "00000000-0000-0000-0000-000000000000", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_initial_state_is_submitted
        claim_type: Initial State
        grounds: [state_machines.Application]
        distinguishing_aspect: "A newly created Application has status==SUBMITTED (initial_state)."
        test_recipe:
          setup: ["Market and vendor."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
          assert:
            - "Application.${app}.status == SUBMITTED"

      - name: approve_from_submitted_without_review_is_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Application.UNDER_REVIEW_to_APPROVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling approve on a SUBMITTED (not UNDER_REVIEW) application returns ERR_INVALID_STATE (409); status stays SUBMITTED."
        test_recipe:
          setup: ["Market, vendor, a SUBMITTED application (no start-review called)."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "x" }
              as: MarketAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Application.${app}.status == SUBMITTED"

      - name: approved_application_is_terminal_no_reject
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Application"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Rejecting an APPROVED (terminal) application returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Market, vendor, an APPROVED CRAFTS application."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
          trigger:
            - call: "POST /applications/${app}/reject"
              payload: { review_note: "no" }
              as: MarketAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: approve_bubbles_vendor_to_active
        claim_type: Side Effect Execution
        grounds: [state_machines.Application.UNDER_REVIEW_to_APPROVED, entities.Vendor.fields.status]
        distinguishing_aspect: "Approving a vendor's first application bubbles the owning Vendor PROSPECT->ACTIVE (side effect on parent)."
        test_recipe:
          setup: ["Market, PROSPECT vendor, an UNDER_REVIEW CRAFTS application."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
          trigger:
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
          assert:
            - "Application.${app}.status == APPROVED"
            - "Vendor.${ven}.status == ACTIVE"

      - name: arrive_on_scheduled_day_is_outside_window
        claim_type: guarded transitions
        grounds:
          - "state_machines.CheckIn.EXPECTED_to_PRESENT"
          - "validations[priority=7]"
          - "errors[ERR_OUTSIDE_WINDOW]"
        distinguishing_aspect: "Arriving on a CheckIn whose MarketDay is still SCHEDULED (not OPEN) returns ERR_OUTSIDE_WINDOW (409); CheckIn stays EXPECTED."
        test_recipe:
          setup: ["Market, ACTIVE vendor, RESERVED DAILY assignment on a SCHEDULED (un-opened) day, an EXPECTED check-in."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "S-1", grid_row: 0, grid_col: 1, size_class: "SINGLE", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${ven}", assignment_type: "DAILY", market_day_id: "${day}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { asg: $.data.id }
            - call: "POST /check-ins"
              payload: { market_id: "${mkt}", booth_assignment_id: "${asg}", market_day_id: "${day}" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { ci: $.data.id }
          trigger:
            - call: "POST /check-ins/${ci}/arrive"
              payload: {}
              as: Vendor
              as_user_id: "${ven}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_OUTSIDE_WINDOW"
            - "CheckIn.${ci}.status == EXPECTED"

      - name: day_close_sweeps_expected_checkin_to_no_show
        claim_type: Side Effect Execution
        grounds: [state_machines.MarketDay.OPEN_to_CLOSED, state_machines.CheckIn.EXPECTED_to_NO_SHOW, entities.Vendor.fields.no_show_strikes]
        distinguishing_aspect: "Closing an OPEN day flips an EXPECTED CheckIn to NO_SHOW (cascade) and bumps the owning Vendor.no_show_strikes to 1."
        test_recipe:
          setup: ["Market, ACTIVE vendor, RESERVED DAILY assignment on an OPEN day, an EXPECTED check-in that never arrives."]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "S-1", grid_row: 0, grid_col: 1, size_class: "SINGLE", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${ven}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${ven}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/start-review"
              payload: {}
              as: MarketAdmin
