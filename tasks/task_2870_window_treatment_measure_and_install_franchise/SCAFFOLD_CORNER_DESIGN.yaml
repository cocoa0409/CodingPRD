          assert:
            - "the captured ${kit_status} == AVAILABLE and SampleKit.${k1}.open_loan_count == 0 with loan_count == 0"
            - "the captured ${lead_status} == ROUTED, NOT NEW: the create request runs calculations.territory_lead_routing exactly once, so the declared initial state NEW is never observable through the API - and Lead.${l1}.territory_id == ${t1} with routed_at stamped"
            - "the captured ${consult_status} == SCHEDULED and Consultation.${c1}.measured_opening_count == 0"
            - "the captured ${measure_status} == MEASURED with install_outcome == PENDING and credited == false"
            - "Designer.${d1}.status == ACTIVE and Territory.${t1}.status == ACTIVE, both stamped by their own creates"

      - name: closing_a_consultation_twice_is_refused_by_its_own_status_gate
        claim_type: Idempotency
        grounds:
          - validations.priority_20_ERR_CONSULTATION_NOT_SCHEDULED
          - state_machines.Consultation.SCHEDULED_to_COMPLETED
          - state_machines.Lead.ROUTED_to_CONSULT_COMPLETE
        distinguishing_aspect: "Close-out is not idempotent and is not silently absorbed: the second /complete on the same appointment fails 409 with ERR_CONSULTATION_NOT_SCHEDULED, and the lead is NOT re-transitioned - it stays CONSULT_COMPLETE with the territory's open-lead count unchanged."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one ROUTED lead and one SCHEDULED consultation."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
