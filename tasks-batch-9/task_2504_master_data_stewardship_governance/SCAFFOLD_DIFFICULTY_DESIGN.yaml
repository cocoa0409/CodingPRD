            - "QualityFinding on quality_rule_id ${qr1_id} has severity_weight 20.00 and gap_pct 80.00"
            - "QualityFinding on quality_rule_id ${qr2_id} has severity_weight 8.00 and gap_pct 70.00"
            - "QualityFinding on quality_rule_id ${qr4_id} has severity_weight 1.00 and gap_pct 49.00"
            - "${dom_weight} == 29.00"
            - "${dom_posture} == RESTRICTED"

      - name: posture_multiplier_pinned_once_per_scorecard_run
        grounds:
          - calculations.domain_posture_recompute
          - entities.QualityFinding.fields.severity_weight
          - entities.ScorecardRun.fields.posture_multiplier_applied
          - entities.Domain.fields.open_finding_weight
        distinguishing_aspect: |
          A run entered at posture RESTRICTED must weight ALL three findings it creates with
          the single multiplier 1.25 pinned from posture_before, giving 25.00 / 3.75 / 1.25
          and open_finding_weight 50.00; re-deriving the posture between findings would push
          the cumulative weight past 40.00 after the first CRITICAL finding and apply 1.50 to
          the remaining two, yielding 4.50 / 1.50 and a total of 51.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER with ERP CERTIFIED and ACTIVE AUTHORITATIVE; Olivia (PRINCIPAL) DATA_OWNER, Sam (SENIOR) DATA_STEWARD."
            - "Four ACTIVE rules each 25 pts @ 90.00: QR1 CRITICAL, QR2 CRITICAL, QR3 MEDIUM, QR4 LOW (budget exactly 100)."
