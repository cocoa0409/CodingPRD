  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: priority_conflict_state_vs_fiscal_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_reconfirm
          rationale: "Dual-failure priority pair asserted in the named §1.8 instance."

      - name: priority_conflict_safety_vs_temporal_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: safety_beats_temporal_on_batch
          rationale: "Dual-failure priority pair asserted in the named §1.8 instance."

      - name: missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID fails 401 ERR_UNAUTHENTICATED before any other check, even on a plain GET."
        test_recipe:
          setup: ["one plant exists"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "GET /v1/plants/${p_id}", payload: {}, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "With auth headers stripped: error_id == ERR_UNAUTHENTICATED, http 401"

      - name: slump_out_of_tolerance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SLUMP_OUT_OF_TOLERANCE]"]
        distinguishing_aspect: "Order slump 6.0 vs mix slump 4.0 exceeds the +/-1.0 in tolerance; slump 5.0 (exactly +1.0) is accepted."
        test_recipe:
          setup: ["plant + ACTIVE mix + customer"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 6.0 }, as: Customer, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 5.0 }, as: Customer, as_user_id: "${c_id}", captures: { ok_id: "$.data.id" } }
          assert:
            - "slump 6.0: error_id == ERR_SLUMP_OUT_OF_TOLERANCE (422)"
            - "slump 5.0 (boundary +1.0): accepted, Order.${ok_id} created PLACED"

      - name: pour_window_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ORDER_WINDOW_INVALID]"]
        distinguishing_aspect: "pour_window_end == pour_window_start (not strictly after) fails ERR_ORDER_WINDOW_INVALID."
        test_recipe:
          setup: ["plant + mix + customer"]
          setup_api_calls:
