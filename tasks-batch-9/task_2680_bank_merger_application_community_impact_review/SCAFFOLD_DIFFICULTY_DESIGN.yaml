      - name: closure_notice_buffer_touching_conversion_window_rejected
        interval_semantics: "closed [start, end] on both resources, plus a 15-day buffer on each side of the closure window"
        resource: Branch versus SystemsConversionPlan
        grounds:
          - calculations.closure_blackout
          - validations[priority 20].ERR_CONVERSION_BLACKOUT_CONFLICT
          - state_machines.Branch.OPEN_to_DESIGNATED_FOR_CLOSURE
        distinguishing_aspect: |
          A different resource pair and the opposite interval convention: both windows are CLOSED and the
          closure window is buffered by CONVERSION_BUFFER_DAYS on each side, so merely touching is already
          a conflict. Notice 2027-06-30 gives notice_lead_days 92 - comfortably past the 90-day minimum -
          yet its buffered start 2027-06-15 coincides with the conversion window's last day and is
          rejected, while notice 2027-07-01 gives a smaller lead of 91 and is accepted because its buffered
          start 2027-06-16 clears the window by one day. A shorter lead succeeding where a longer one fails
          isolates the buffered-touch rule from the lead-time rule.
