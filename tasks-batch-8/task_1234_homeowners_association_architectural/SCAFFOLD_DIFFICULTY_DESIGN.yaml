            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "C-7", address: "7 Cycle Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: ADDITION, guideline_section: "SEC-9.0", description: "sunroom addition", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "plans", uri: "s3://c/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "siding", uri: "s3://c/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
            - { call: "POST /arc/applications/${app}/decide", payload: { conditions: ["weekly site cleanup"] }, as: Manager }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: Manager }
            - { call: "GET /arc/applications/${app}/permits", as: Manager, captures: { permit: "$.data[0].id" } }
            - { call: "POST /arc/permits/${permit}/request-inspection", as: Homeowner, as_user_id: "${owner_a}", captures: { insp: $.data.id } }
            - { call: "POST /arc/inspections/${insp}/record", payload: { result: FAIL, result_notes: "setback short by 2ft" }, as: Inspector, captures: { fail_status: $.data.status } }
            - { call: "GET /arc/inspections/${insp}/violations", as: Manager, captures: { vio: "$.data[0].id" } }
          trigger:
