          assert:
            - "ASM-T1 torque_status == \"PASS\" at measured_torque_nm 22.0 == 20.0 * 1.10, the inclusive upper edge."
            - "ASM-T1 insulation_status == \"PASS\" at measured_ir_megaohm 1.00 == ir_min_megaohm, equality passing."
            - "ASM-T1 certification_status == \"CERTIFIED\" once both axes read PASS."
            - "ASM-T2 torque_status == \"PASS\" at measured_torque_nm 19.0 == 20.0 * 0.95, the inclusive lower edge."
            - "ASM-T2 certification_status == \"PENDING\" - its insulation axis is still PENDING, so the pair does not certify on torque alone."
            - "Both assemblies report rework_count == 0."

      - name: role_gate_precedes_payload_gate_which_precedes_actor_lookup
        claim_type: Priority Ordering
        grounds:
          - validations[priority 2 ERR_ROLE_NOT_PERMITTED]
          - validations[priority 3 ERR_VALIDATION]
          - validations[priority 4 ERR_ACTING_WORKER_NOT_FOUND]
        distinguishing_aspect: "The top of the §1.4 ladder is exercised with a single request that violates three rules at once: a forbidden role, a malformed body and an unknown X-User-ID. Only ERR_ROLE_NOT_PERMITTED may surface, and once the role is legal the malformed body must beat the unknown actor - an implementation that resolves the acting worker first would answer 404."
        test_recipe:
          setup:
            - "One plant and one PRODUCTION worker; no design exists yet."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
          trigger:
            - call: POST /cell-designs
              as: QualityInspector
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              payload: { code: "CD-BAD", chemistry: NICKEL_IRON, plate_type: TUBULAR, cells_per_battery: 0, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, list_price_cents: 500000 }
              captures: { err_role: "$.data.error_id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              payload: { code: "CD-BAD", chemistry: NICKEL_IRON, plate_type: TUBULAR, cells_per_battery: 0, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, list_price_cents: 500000 }
              captures: { err_payload: "$.data.error_id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { err_actor: "$.data.error_id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${sup_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
          assert:
            - "Call 1 answers 403 with error_id \"ERR_ROLE_NOT_PERMITTED\" - priority 2 fires even though the body is malformed (priority 3) and the actor is unknown (priority 4)."
            - "Call 2, with the correct role but the same malformed body and unknown actor, answers 422 with error_id \"ERR_VALIDATION\" - NOT 404 ERR_ACTING_WORKER_NOT_FOUND."
            - "Call 3, with a well-formed body and the same unknown actor, answers 404 with error_id \"ERR_ACTING_WORKER_NOT_FOUND\" - proving call 2's 422 was ordering and not an inability to detect the missing worker."
            - "Call 4 answers 201: a PRODUCTION worker may act as DesignEngineer for authorship, because only the APPROVE action demands job_class ENGINEER."
            - "GET /cell-designs answers exactly one row - none of the three rejected calls persisted anything."

      - name: lot_state_gate_outranks_the_emission_budget_gate
        claim_type: Priority Ordering
        grounds:
          - validations[ERR_LOT_STATE_INVALID]
          - validations[ERR_EMISSION_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lot_state_beats_emission_budget_on_run_scheduling
          rationale: "The §1.8 instance constructs the doubly-violating request (a lot outside FORMATION plus a reservation over the permit) and pins the answer to ERR_LOT_STATE_INVALID, which is exactly the Priority Ordering claim. A second copy here would be the same request with the same expectation."

      - name: env_hold_gate_outranks_the_bay_window_gate
        claim_type: Priority Ordering
        grounds:
          - validations[ERR_LOT_ENV_HELD]
          - validations[ERR_BAY_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / env_hold_beats_bay_window_conflict_on_run_scheduling
          rationale: "The §1.8 instance already schedules into an occupied bay window with a HELD lot and pins ERR_LOT_ENV_HELD, covering the precedence of the environmental gate over the temporal capacity gate."

      - name: chamber_capacity_violation_is_detected_on_overlapping_windows
        claim_type: Violation → Error
        grounds:
          - validations[ERR_CHAMBER_CAPACITY_EXCEEDED]
          - errors[ERR_CHAMBER_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / test_chamber_aggregate_draw_over_half_open_windows
          rationale: "The §1.8 instance drives the aggregate-draw rule across nested, adjacent and exactly-on-cap windows, so the violating case and its inclusive boundary are both already pinned. The adjacent-window behaviour this section depends on is asserted implicitly by the yield instance's three back-to-back tests."

  # ===================================================================
  # SECTION 5 - ENDPOINTS (guide section 5)
  #   Standard CRUD, Action endpoint, Cross-reference link, Computed read
  #   and Conditional action. The "Bulk action" row of the guide's table is
  #   not applicable: §1.5 declares no bulk or batch endpoint - every write
  #   addresses exactly one resource - so that row is skipped.
  # ===================================================================
  - section: endpoints
    instances:

      - name: charger_catalogue_supports_read_list_filter_page_and_patch
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /chargers]
          - endpoints[GET /chargers]
          - endpoints[GET /chargers/{id}]
          - endpoints[PATCH /chargers/{id}]
          - api_conventions.list_envelope
        distinguishing_aspect: "The whole CRUD surface of one entity in a single chain, including the two list contracts that are easy to get wrong: ordering is created_at ASC then id ASC (not model_code), and limit/offset paging reports total_count over the FILTERED set with has_more computed from offset + limit."
        test_recipe:
          setup:
            - "Three chargers created in a deliberately non-alphabetical order: CH-Z (FERRO), CH-A (HF_MODULAR), CH-M (LITHIUM_CCCV)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /chargers
              as: FleetEngineer
              payload: { model_code: "CH-Z", chemistry_compatibility: LEAD_ACID, output_voltage_v: 24.0, output_amps: 50.0, charge_profile: FERRO, price_cents: 300000 }
              captures: { ch_z_id: "$.data.id" }
            - call: POST /chargers
              as: FleetEngineer
              payload: { model_code: "CH-A", chemistry_compatibility: LEAD_ACID, output_voltage_v: 24.0, output_amps: 60.0, charge_profile: HF_MODULAR, price_cents: 250000 }
              captures: { ch_a_id: "$.data.id" }
            - call: POST /chargers
              as: FleetEngineer
              payload: { model_code: "CH-M", chemistry_compatibility: LITHIUM_LFP, output_voltage_v: 25.6, output_amps: 100.0, charge_profile: LITHIUM_CCCV, price_cents: 450000 }
              captures: { ch_m_id: "$.data.id" }
          trigger:
            - call: GET /chargers/${ch_a_id}
              as: FleetEngineer
            - call: GET /chargers
              as: PlantAdmin
              payload: { charge_profile: FERRO }
            - call: GET /chargers
              as: PlantAdmin
              payload: { limit: 2, offset: 0 }
            - call: GET /chargers
              as: PlantAdmin
              payload: { limit: 2, offset: 2 }
            - call: PATCH /chargers/${ch_z_id}
              as: FleetEngineer
              payload: { charger_status: DISCONTINUED, price_cents: 275000 }
            - call: GET /chargers
              as: WarrantyAdministrator
              payload: { charger_status: AVAILABLE }
          assert:
            - "GET /chargers/${ch_a_id} answers model_code \"CH-A\", output_amps 60.0 and charger_status \"AVAILABLE\" (the create default)."
            - "The unfiltered listing order is CH-Z, CH-A, CH-M - created_at ASC, NOT model_code alphabetical."
            - "charge_profile=FERRO answers total_count == 1 and a single row CH-Z - CH-A is HF_MODULAR and CH-M is LITHIUM_CCCV."
            - "limit=2&offset=0 answers 2 rows with total_count == 3 and has_more == true; limit=2&offset=2 answers 1 row with total_count == 3 and has_more == false."
            - "The PATCH answers charger_status \"DISCONTINUED\", price_cents 275000 and a version incremented by exactly 1, leaving output_amps and charge_profile untouched."
            - "charger_status=AVAILABLE afterwards answers total_count == 2 (CH-A and CH-M) - total_count reflects the filtered set, not the 3-row table."
            - "Every response carries meta.api_request_id and meta.api_request_timestamp, and the list responses carry limit, offset, total_count and has_more."

      - name: sizing_decision_is_an_action_endpoint_that_freezes_the_recorded_selection
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /fleet-sizing-requests/{id}/decision]
          - state_machines.FleetSizingRequest.request_state.MATCHED_to_ACCEPTED
          - errors[ERR_SIZING_REQUEST_STATE_INVALID]
        distinguishing_aspect: "The decision endpoint is a pure state action: it takes only an action plus a note, returns the whole request, and explicitly never recomputes the selection - so discontinuing the selected charger and repricing it after the ACCEPT leaves selected_charger_id and fleet_capital_cents exactly as recorded."
        test_recipe:
          setup:
            - "One APPROVED 24.0 V LEAD_ACID design, one AVAILABLE 24.0 V charger, and one MATCHED sizing request produced from them."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
            - call: POST /chargers
              as: FleetEngineer
              payload: { model_code: "CH-B60", chemistry_compatibility: LEAD_ACID, output_voltage_v: 24.0, output_amps: 60.0, charge_profile: HF_MODULAR, price_cents: 250000 }
              captures: { charger_id: "$.data.id" }
            - call: POST /fleet-sizing-requests
              as: FleetEngineer
              payload: { plant_id: "${plant_id}", application_name: "Aisle Pickers", forklift_class: CLASS_II, forklift_count: 4, shift_energy_kwh_per_shift: 8.00, shifts_per_day: 1, ambient_temp_c: 25.0, required_voltage_v: 24.0, compartment_max_kg: 1000.0, charge_window_hours: 9.00, chemistry_preference: ANY }
              captures: { sizing_id: "$.data.id" }
          trigger:
            - call: POST /fleet-sizing-requests/${sizing_id}/decision
              as: FleetEngineer
              payload: { action: ACCEPT, decision_note: "quote accepted by the customer" }
            - call: PATCH /chargers/${charger_id}
              as: FleetEngineer
              payload: { charger_status: DISCONTINUED, price_cents: 999000 }
            - call: GET /fleet-sizing-requests/${sizing_id}
              as: FleetEngineer
            - call: POST /fleet-sizing-requests/${sizing_id}/decision
              as: FleetEngineer
              payload: { action: WITHDRAW, decision_note: "too late" }
              captures: { err_id: "$.data.error_id" }
          assert:
            - "The ACCEPT answers 200 with request_state \"ACCEPTED\" and returns the full FleetSizingRequest, not a bare acknowledgement."
            - "After the charger is discontinued and repriced to 999000, the request still answers selected_charger_id == \"${charger_id}\", selected_charge_hours == 7.13 and fleet_capital_cents == 2500000 - the decision froze the recorded selection."
            - "The second decision answers 409 with error_id \"ERR_SIZING_REQUEST_STATE_INVALID\" - ACCEPTED is not MATCHED, so the action is not re-appliable."
            - "request_state is still \"ACCEPTED\" after the refused WITHDRAW."

      - name: fleet_analysis_is_a_computed_read_over_accepted_requests_only
        claim_type: Computed read
        grounds:
          - endpoints[GET /plants/{id}/fleet-analysis]
          - calculations.motive_power_sizing
          - state_machines.FleetSizingRequest.request_state
        distinguishing_aspect: "The aggregate is scoped twice over: by plant and by request_state == ACCEPTED, so a MATCHED request that has not been decided and a WITHDRAWN request both contribute nothing, and the totals are sums of the per-request stored values rather than a re-run of the selector."
        test_recipe:
          setup:
            - "One plant, one APPROVED 24.0 V design, one charger and three identical sizing requests; the first is ACCEPTED, the second WITHDRAWN, the third left MATCHED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
            - call: POST /chargers
              as: FleetEngineer
              payload: { model_code: "CH-B60", chemistry_compatibility: LEAD_ACID, output_voltage_v: 24.0, output_amps: 60.0, charge_profile: HF_MODULAR, price_cents: 250000 }
              captures: { charger_id: "$.data.id" }
            - call: POST /fleet-sizing-requests
              as: FleetEngineer
              payload: { plant_id: "${plant_id}", application_name: "Aisle Pickers A", forklift_class: CLASS_II, forklift_count: 4, shift_energy_kwh_per_shift: 8.00, shifts_per_day: 1, ambient_temp_c: 25.0, required_voltage_v: 24.0, compartment_max_kg: 1000.0, charge_window_hours: 9.00, chemistry_preference: ANY }
              captures: { sizing_acc_id: "$.data.id" }
            - call: POST /fleet-sizing-requests
              as: FleetEngineer
              payload: { plant_id: "${plant_id}", application_name: "Aisle Pickers B", forklift_class: CLASS_II, forklift_count: 4, shift_energy_kwh_per_shift: 8.00, shifts_per_day: 1, ambient_temp_c: 25.0, required_voltage_v: 24.0, compartment_max_kg: 1000.0, charge_window_hours: 9.00, chemistry_preference: ANY }
              captures: { sizing_wd_id: "$.data.id" }
            - call: POST /fleet-sizing-requests
              as: FleetEngineer
              payload: { plant_id: "${plant_id}", application_name: "Aisle Pickers C", forklift_class: CLASS_II, forklift_count: 4, shift_energy_kwh_per_shift: 8.00, shifts_per_day: 1, ambient_temp_c: 25.0, required_voltage_v: 24.0, compartment_max_kg: 1000.0, charge_window_hours: 9.00, chemistry_preference: ANY }
              captures: { sizing_matched_id: "$.data.id" }
          trigger:
            - call: POST /fleet-sizing-requests/${sizing_acc_id}/decision
              as: FleetEngineer
              payload: { action: ACCEPT }
            - call: POST /fleet-sizing-requests/${sizing_wd_id}/decision
              as: FleetEngineer
              payload: { action: WITHDRAW }
            - call: GET /plants/${plant_id}/fleet-analysis
              as: FleetEngineer
            - call: GET /fleet-sizing-requests
              as: FleetEngineer
              payload: { plant_id: "${plant_id}", request_state: MATCHED }
          assert:
            - "fleet-analysis answers accepted_request_count == 1 - the WITHDRAWN and the still-MATCHED requests are both excluded."
            - "fleet-analysis answers recommended_battery_count == 4, recommended_charger_count == 2 and fleet_capital_cents == 2500000, i.e. exactly the ACCEPTED request's stored values and not 3x them."
            - "fleet-analysis lines has length 1 and its single line names sizing request ${sizing_acc_id}."
            - "The filtered listing answers total_count == 1 and its only row is ${sizing_matched_id}."
            - "The computed read is idempotent: calling it twice answers byte-identical bodies apart from meta.api_request_id and meta.api_request_timestamp."

      - name: capacity_test_links_an_assembly_and_a_chamber_and_rejects_a_cross_plant_pair
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /capacity-tests]
          - validations[ERR_PLANT_SCOPE_MISMATCH]
          - endpoints[GET /capacity-tests].input
        distinguishing_aspect: "CapacityTest is the join between an assembly (whose plant is reached only transitively through its lot) and a chamber (whose plant is direct), so the coherence rule has to compare assembly.lot.plant_id with chamber.plant_id - a chamber from a second site is refused even though both foreign keys resolve."
        test_recipe:
          setup:
            - "Plant RIV with lot LOT-X in LOT_TESTING (its first sampling plan drawn), CERTIFIED assembly ASM-X1 and chamber TC-RIV; plant EAST with chamber TC-EAST."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_a_id: "$.data.id" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Eastside Battery Works", site_code: "PLT-EAST", licensed_chemistries: [LEAD_ACID], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 30.00, offpeak_tariff_cents_per_kwh: 18.00, lead_initial_inventory_kg: 5000.000 }
              captures: { plant_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_a_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_a_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_a_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_a_id}", full_name: "Dana Quality", job_class: QUALITY, hire_date: "2020-01-01T00:00:00Z" }
              captures: { qa_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
            - call: POST /test-chambers
              as: PlantAdmin
              payload: { plant_id: "${plant_a_id}", chamber_code: "TC-RIV", power_cap_kw: 10.00 }
              captures: { chamber_a_id: "$.data.id" }
            - call: POST /test-chambers
              as: PlantAdmin
              payload: { plant_id: "${plant_b_id}", chamber_code: "TC-EAST", power_cap_kw: 10.00 }
              captures: { chamber_b_id: "$.data.id" }
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_a_id}", cell_design_id: "${design_id}", lot_code: "LOT-X", quantity: 12 }
              captures: { lot_id: "$.data.id" }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: PLATE_PRODUCTION }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: FORMATION }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: ASSEMBLY }
            - call: POST /battery-assemblies
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { lot_id: "${lot_id}", serial_number: "ASM-X1", module_count: 6, case_type: STEEL_TRAY, torque_spec_nm: 20.0, ir_min_megaohm: 1.00 }
              captures: { asm_id: "$.data.id" }
            - call: POST /battery-assemblies/${asm_id}/verifications
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { verification_type: TORQUE, measured_torque_nm: 20.0, connection_count: 12 }
            - call: POST /battery-assemblies/${asm_id}/verifications
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { verification_type: INSULATION_RESISTANCE, measured_ir_megaohm: 2.50, test_voltage_v: 500 }
            - call: GET /production-lots/${lot_id}
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { lot_v: "$.data.version" }
            - call: POST /production-lots/${lot_id}/sampling-plans
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { expected_lot_version: "${lot_v}", plan_reason: "acceptance plan so tests may be scheduled" }
          trigger:
            - call: POST /capacity-tests
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { assembly_id: "${asm_id}", chamber_id: "${chamber_b_id}", test_type: CAPACITY, scheduled_start_at: "2026-09-03T08:00:00Z", scheduled_end_at: "2026-09-03T10:00:00Z", draw_kw: 3.00 }
              captures: { err_scope: "$.data.error_id" }
            - call: POST /capacity-tests
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { assembly_id: "${asm_id}", chamber_id: "${chamber_a_id}", test_type: CAPACITY, scheduled_start_at: "2026-09-03T08:00:00Z", scheduled_end_at: "2026-09-03T10:00:00Z", draw_kw: 3.00 }
              captures: { test_id: "$.data.id" }
            - call: GET /capacity-tests
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { chamber_id: "${chamber_b_id}" }
            - call: GET /capacity-tests
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { assembly_id: "${asm_id}" }
          assert:
            - "The cross-plant pair answers 409 with error_id \"ERR_PLANT_SCOPE_MISMATCH\" - NOT ERR_TEST_CHAMBER_NOT_FOUND, because TC-EAST does exist."
            - "The same-plant pair answers 201 and echoes both foreign keys: assembly_id == \"${asm_id}\" and chamber_id == \"${chamber_a_id}\"."
            - "The new test answers test_state \"SCHEDULED\" with measured_capacity_ah, cycles_completed, result and yield_pct all null."
            - "Filtering by chamber_id=${chamber_b_id} answers total_count == 0 - the refused call left no row behind."
            - "Filtering by assembly_id=${asm_id} answers total_count == 1 and its single row is ${test_id}, so the link is navigable from both sides."

      - name: lot_disposition_admits_quarantine_and_retest_but_refuses_release_until_sampling_is_complete
        claim_type: Conditional action
        grounds:
          - endpoints[POST /production-lots/{id}/disposition]
