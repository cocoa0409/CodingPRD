              captures: { err: $.data.error_id }
            - call: "POST /cash-vault/count-sessions"
              payload: { sealed_bag_id: "${bag2_id}", counting_machine_id: "${mach_id}", window_start: "2026-08-03T10:15:00Z", window_end: "2026-08-03T11:00:00Z", expected_sealed_bag_version: "${bag2_v}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { sess2_id: $.data.id, sess2_start: $.data.window_start }
          assert:
            - "${err} == ERR_MACHINE_WINDOW_CONFLICT"
            - "HTTP status of the first trigger response == 409"
            - "${sess2_start} == 2026-08-03T10:15:00.000Z"
            - "CountSession.${sess2_id}.status == SCHEDULED"
            - "CountSession.${sess1_id}.status == SCHEDULED"

      - name: vault_pickup_window_closed_interval_aggregate_capacity
        grounds:
          - validations[priority=62]
          - errors[ERR_PICKUP_CAPACITY_EXCEEDED]
          - entities.Vault.fields.pickup_concurrency_limit
          - entities.CoinOrder.fields.pickup_window_start
          - entities.CoinOrder.fields.pickup_window_end
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: the Vault treats pickup
          windows as CLOSED intervals under an aggregate capacity of 2 rather than as half-open
          exclusive occupancy. A third window starting exactly at 12:00:00Z is rejected because
          that shared endpoint instant is already covered by two live orders, while the same
          window shifted one second later to 12:00:01Z is accepted.
        test_recipe:
          setup:
            - "Vault CV-16 OPEN with pickup_concurrency_limit 2; CustomerAccount ACC-1701 ACTIVE."
            - "Two REQUESTED CoinOrders on CV-16: one covering 2026-08-05T10:00:00Z to 2026-08-05T12:00:00Z and one covering 2026-08-05T11:00:00Z to 2026-08-05T13:00:00Z."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-16", name: "Pickup Capacity Vault", pickup_concurrency_limit: 2 }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { vault_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-1701", customer_name: "Pickup Pizzeria", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { acct_id: $.data.id }
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", lines: [ { denomination: "QUARTER", boxes_requested: 1 } ] }
              as: CustomerAccountHolder
              as_user_id: "${acct_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", pickup_window_start: "2026-08-05T11:00:00Z", pickup_window_end: "2026-08-05T13:00:00Z", lines: [ { denomination: "DIME", boxes_requested: 1 } ] }
              as: CustomerAccountHolder
              as_user_id: "${acct_id}"
              captures: { o2_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", pickup_window_start: "2026-08-05T12:00:00Z", pickup_window_end: "2026-08-05T14:00:00Z", lines: [ { denomination: "NICKEL", boxes_requested: 1 } ] }
              as: CustomerAccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", pickup_window_start: "2026-08-05T12:00:01Z", pickup_window_end: "2026-08-05T14:00:00Z", lines: [ { denomination: "NICKEL", boxes_requested: 1 } ] }
              as: CustomerAccountHolder
              as_user_id: "${acct_id}"
              captures: { o4_id: $.data.id, o4_start: $.data.pickup_window_start }
          assert:
            - "${err} == ERR_PICKUP_CAPACITY_EXCEEDED"
            - "HTTP status of the first trigger response == 409"
            - "${o4_start} == 2026-08-05T12:00:01.000Z"
            - "CoinOrder.${o4_id}.status == REQUESTED"
            - "CoinOrder.${o1_id}.status == REQUESTED"
            - "CoinOrder.${o2_id}.status == REQUESTED"
            - "GET /cash-vault/coin-orders?vault_id=${vault_id} returns total_count 3"

  - rule_id: compensating_invariant
    instances:
      - name: coin_release_then_return_conserves_vault_coin_face_value
        grounds:
          - state_machines.CoinOrder.APPROVED_PARTIAL_to_RELEASED
          - state_machines.CoinOrder.RELEASED_to_RETURNED
          - calculations.coin_order_allocation
          - entities.Vault.fields.coin_face_value_on_hand_cents
          - entities.VaultInventory.fields.on_hand_boxes
          - entities.VaultInventory.fields.reserved_boxes
        distinguishing_aspect: |
          Conserved quantity: physical coin face value held by the vault, pinned as
          SUM over VaultInventory of on_hand_boxes * BOX_FACE_VALUE_CENTS[denomination].
          Release moves it from 615000 down to 360000 and the compensating return restores
          it to exactly 615000 with every per-denomination on_hand_boxes and reserved_boxes
          back at its pre-approval value; zero drift is permitted.
        test_recipe:
          setup:
            - "Vault CV-17 OPEN with inventory PENNY 6 boxes, DIME 4 boxes, QUARTER 10 boxes, all reserved_boxes 0, so coin_face_value_on_hand_cents is 615000."
            - "CustomerAccount ACC-1801 ACTIVE with ledger_balance_cents 0."
            - "CoinOrder requesting PENNY 2, DIME 6, QUARTER 3 approved with allow_partial true, allocating 2 / 4 / 3 boxes for fill_ratio_pct 81.82 and charge_cents 255000; approved by u-mgr-1."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-17", name: "Conservation Vault", pickup_concurrency_limit: 2 }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { vault_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-1801", customer_name: "Conservation Cafe", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { acct_id: $.data.id }
            - call: "POST /cash-vault/vaults/${vault_id}/inventory-adjustments"
              payload: { denomination: "PENNY", delta_boxes: 6 }
              as: VaultManager
              as_user_id: "u-mgr-1"
            - call: "POST /cash-vault/vaults/${vault_id}/inventory-adjustments"
              payload: { denomination: "DIME", delta_boxes: 4 }
              as: VaultManager
              as_user_id: "u-mgr-1"
            - call: "POST /cash-vault/vaults/${vault_id}/inventory-adjustments"
              payload: { denomination: "QUARTER", delta_boxes: 10 }
              as: VaultManager
              as_user_id: "u-mgr-1"
            - call: "GET /cash-vault/vaults/${vault_id}"
              payload: {}
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { face_before: $.data.coin_face_value_on_hand_cents }
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", lines: [ { denomination: "PENNY", boxes_requested: 2 }, { denomination: "DIME", boxes_requested: 6 }, { denomination: "QUARTER", boxes_requested: 3 } ] }
              as: CustomerAccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /cash-vault/coin-orders/${order_id}/approve"
              payload: { allow_partial: true }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { ord_status: $.data.status, ord_fill: $.data.fill_ratio_pct, ord_charge: $.data.charge_cents }
            - call: "GET /cash-vault/vaults/${vault_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { vault_v: $.data.version }
          trigger:
            - call: "POST /cash-vault/coin-orders/${order_id}/release"
              payload: { expected_vault_version: "${vault_v}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "GET /cash-vault/vaults/${vault_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { face_after_release: $.data.coin_face_value_on_hand_cents }
            - call: "POST /cash-vault/coin-orders/${order_id}/return"
              payload: { return_reason: "Customer pickup cancelled; boxes returned unopened." }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "GET /cash-vault/vaults/${vault_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { face_after_return: $.data.coin_face_value_on_hand_cents }
          assert:
            - "${face_before} == 615000"
            - "${ord_status} == APPROVED_PARTIAL"
            - "${ord_fill} == 81.82"
            - "${ord_charge} == 255000"
            - "${face_after_release} == 360000"
            - "${face_after_return} == 615000"
            - "VaultInventory for (${vault_id}, PENNY).on_hand_boxes == 6 and reserved_boxes == 0"
            - "VaultInventory for (${vault_id}, DIME).on_hand_boxes == 4 and reserved_boxes == 0"
            - "VaultInventory for (${vault_id}, QUARTER).on_hand_boxes == 10 and reserved_boxes == 0"
            - "CoinOrder.${order_id}.status == RETURNED"
            - "CustomerAccount.${acct_id}.ledger_balance_cents == 0"

      - name: provisional_credit_then_reversal_conserves_customer_available_funds
        grounds:
          - state_machines.DepositTicket.VERIFIED_to_PROVISIONAL_CREDITED
          - state_machines.DepositTicket.PROVISIONAL_CREDITED_to_VERIFIED
          - calculations.deposit_credit_amount
          - entities.CustomerAccount.fields.available_balance_cents
          - entities.CustomerAccount.fields.provisional_credit_cents
          - entities.CustomerAccount.fields.ledger_balance_cents
        distinguishing_aspect: |
          A different conserved quantity from the coin-face-value instance: customer available
          funds, pinned as available_balance_cents == ledger_balance_cents + provisional_credit_cents.
          Extending 98000 of provisional credit and then reversing it must return
          available_balance_cents to its pre-credit 0 with provisional_credit_cents back at 0,
          ledger_balance_cents never having moved, and the identity holding at both observations.
        test_recipe:
          setup:
            - "Vault CV-18 OPEN; CustomerAccount ACC-1901 tier STANDARD, ACTIVE, all balances 0."
            - "Ticket MAN-1901 with one bag S-1901 declared 100000, VAULT_RECEIVED, ticket VERIFIED then PROVISIONAL_CREDITED at 98000 so the account reads ledger 0 / provisional 98000 / available 98000."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-18", name: "Reversal Vault" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { vault_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-1901", customer_name: "Reversal Restaurant", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { acct_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", courier_manifest_number: "MAN-1901", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { ticket_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${ticket_id}", seal_number: "S-1901", bag_type: "CURRENCY", declared_amount_cents: 100000, declared_note_count: 100, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { bag_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${bag_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-1901" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${bag_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-18-DOCK", observed_seal_number: "S-1901" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/deposit-tickets/${ticket_id}/verify"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/deposit-tickets/${ticket_id}/provisional-credit"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { prov_amt: $.data.provisional_credit_cents }
            - call: "GET /cash-vault/customer-accounts/${acct_id}"
              payload: {}
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { avail_mid: $.data.available_balance_cents, prov_mid: $.data.provisional_credit_cents, ledger_mid: $.data.ledger_balance_cents }
          trigger:
            - call: "POST /cash-vault/deposit-tickets/${ticket_id}/reverse-provisional-credit"
              payload: { reason: "Manifest mismatch found before counting; credit withdrawn." }
              as: VaultManager
              as_user_id: "u-mgr-1"
          assert:
            - "${prov_amt} == 98000"
            - "${avail_mid} == 98000"
            - "${prov_mid} == 98000"
            - "${ledger_mid} == 0"
            - "DepositTicket.${ticket_id}.status == VERIFIED"
            - "DepositTicket.${ticket_id}.provisional_credit_cents == 0"
            - "CustomerAccount.${acct_id}.provisional_credit_cents == 0"
            - "CustomerAccount.${acct_id}.ledger_balance_cents == 0"
            - "CustomerAccount.${acct_id}.available_balance_cents == 0"
