            - "RedemptionRequest.${req2}.status == PENDING  # unchanged"
            - "EquityCertificate.${cert12}.status == ACTIVE  # no disbursement occurred"

      - name: business_safety_vs_business_referential_on_estate_probate
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_COMPLIANCE_GATE]
          - errors[ERR_REFERENTIAL]
        distinguishing_aspect: |
          Priority conflict between `business_safety` (priority 7, ERR_COMPLIANCE_GATE)
          and `business_referential` (priority 9, ERR_REFERENTIAL): an
          estate_claims/record_probate call where the claim window has NOT yet
          elapsed (compliance gate fails) AND probate_completed_at references a
          non-existent executor chain (referential fails) MUST yield
          ERR_COMPLIANCE_GATE, because safety runs before referential.
        test_recipe:
          setup:
            - "District DIST-J, Member M13 (ACTIVE producer)"
            - "Member M14 (ESTATE class, would-be executor)"
            - "M13 marked DECEASED 30 days ago; EstateClaim EC2 in FILED"
