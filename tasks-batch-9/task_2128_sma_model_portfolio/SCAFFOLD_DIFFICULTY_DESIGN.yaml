            - "Account.${a1}.cash_cents == 3000000 after the harvest execution"
            - "The first block create, at clock 2026-08-01 inside the closed window, returns HTTP 422 with error_id ERR_WASH_SALE_WINDOW_CONFLICT"
            - "The second block create, at clock 2026-09-01 one day past wash_window_end, returns HTTP 201"
