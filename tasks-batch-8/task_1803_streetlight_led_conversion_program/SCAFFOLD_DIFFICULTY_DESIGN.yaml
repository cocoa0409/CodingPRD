      - call: POST /streetlights/poles/${p2}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-03'
          window_end_date: '2026-08-04'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${p1}
          sequence_number: 1
          difficulty_class: STANDARD
        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${p2}
          sequence_number: 2
          difficulty_class: STANDARD
        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo1: $.data.0.id
          wo2: $.data.1.id
      - call: POST /streetlights/work-orders/${wo1}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 3000
          shielding: SEMI_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/conversion-routes/${route}/suspend
