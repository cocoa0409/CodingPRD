# =============================================================================
# Neighborhood Pet-Sitting Cooperative — Seed Tables (v1)
# Expert-difficulty scaffold: ledger reconciliation + posture/access gating
# =============================================================================

scenario: |
  Neighborhood Pet-Sitting Cooperative (neighborhood pet-sitting co-op): member
  vetting & mutual reference requirement, credit/hour exchange ledger for
  reciprocal sitting, request posting & claim by available members, pet profile
  (routine/medical/emergency vet) documentation, key/access handoff & entry
  logging, incident/emergency protocol & liability agreement, dispute mediation
  & member removal, seasonal demand imbalance (holidays)

domain_name: neighborhood-pet-sitting-cooperative
api_prefix: /coop

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Full legal name of applicant" }
      - { name: email, type: string, source: input, description: "Unique email; case-insensitive uniqueness" }
      - { name: address_block, type: string, source: input, description: "Neighborhood block identifier (e.g., 'MAPLE-100'); required for residency check" }
      - { name: phone, type: string, source: input, description: "SMS-capable phone for emergency contact" }
      - { name: vetting_status, type: enum, source: system, description: "APPLIED | REFERENCES_PENDING | VETTED | SUSPENDED | REMOVED" }
      - { name: mediator_flag, type: boolean, source: input, default: false, description: "If true, member may be assigned as dispute mediator" }
      - { name: credit_balance_hours, type: number, source: computed, description: "Running hours balance; positive = owed sittings, negative = owes sittings; 2-decimal precision, round_half_up" }
      - { name: provisional_credit_hours, type: number, source: computed, description: "In-flight credit from CONFIRMED/IN_PROGRESS assignments not yet settled" }
      - { name: reliability_score, type: integer, source: computed, description: "0-100; starts 50; +2 per completed sit, -15 per confirmed incident at-fault, -8 per unjustified cancellation within 24h of start" }
      - { name: suspension_reason, type: string, source: system, description: "Null unless vetting_status == SUSPENDED" }
      - { name: removal_reason, type: string, source: system, description: "Null unless vetting_status == REMOVED" }
      - { name: accepted_liability_at, type: datetime, source: system, description: "Timestamp when member accepted the cooperative liability agreement; required before VETTED transition" }
      - { name: co_op_joined_at, type: datetime, source: system, description: "Timestamp member transitioned to VETTED" }

  - name: MemberReference
    parent: Member
    common_fields: true
    fields:
      - { name: subject_member_id, type: string, source: system, description: "FK -> Member.id; the applicant being vetted" }
      - { name: referee_member_id, type: string, source: input, description: "FK -> Member.id; an existing VETTED member vouching; must differ from subject_member_id (mutual reference requirement)" }
      - { name: relationship_years, type: integer, source: input, description: "Years referee has known subject; must be >= 1" }
      - { name: attestation_text, type: string, source: input, description: "Free-form attestation; min 20 chars" }
      - { name: reciprocal_reference_id, type: string, source: system, description: "FK -> MemberReference.id; the paired reference where subject vouches for referee; set by system once reciprocity confirmed" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of ACCEPTED/REJECTED transition" }

  - name: PetProfile
    parent: Member
    common_fields: true
    fields:
      - { name: owner_member_id, type: string, source: system, description: "FK -> Member.id; pet owner" }
      - { name: pet_name, type: string, source: input, description: "Pet's name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | BIRD | RABBIT | OTHER" }
      - { name: routine_notes, type: string, source: input, description: "Feeding / walking routine" }
      - { name: medical_notes, type: string, source: input, description: "Medications, conditions, allergies" }
      - { name: emergency_vet_name, type: string, source: input, description: "Emergency veterinarian clinic name" }
      - { name: emergency_vet_phone, type: string, source: input, description: "Emergency vet phone (E.164)" }
      - { name: emergency_vet_address, type: string, source: input, description: "Emergency vet address" }
      - { name: liability_waiver_accepted, type: boolean, source: input, description: "Owner must explicitly accept the pet-care liability waiver before any request can be posted for this pet" }
      - { name: active, type: boolean, source: system, description: "Soft-delete; false hides pet from new requests but preserves history" }

  - name: HolidayWindow
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Holiday label (e.g., 'Thanksgiving 2026')" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive UTC start" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive UTC end" }
      - { name: demand_multiplier, type: number, source: input, description: "Credit multiplier applied to sits whose [start,end) intersects this window; range 1.0-3.0" }
      - { name: enabled, type: boolean, source: input, default: true, description: "Soft enable/disable" }

  - name: SittingRequest
    parent: Member
    common_fields: true
    fields:
      - { name: owner_member_id, type: string, source: system, description: "FK -> Member.id; requester" }
      - { name: pet_profile_id, type: string, source: input, description: "FK -> PetProfile.id; pet being sat" }
      - { name: start_at, type: datetime, source: input, description: "UTC start; must be > server now" }
      - { name: end_at, type: datetime, source: input, description: "UTC end; must be > start_at; duration in hours must be in [1, 72]" }
      - { name: instructions, type: string, source: input, description: "Visit-specific instructions" }
      - { name: credit_hours_offered, type: number, source: computed, description: "Computed at posting: duration_hours * demand_multiplier_at_post; locked at posting (does NOT recompute if HolidayWindow later changes)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLAIMED | ASSIGNED | IN_PROGRESS | COMPLETED | CANCELLED | EXPIRED" }
      - { name: cancelled_reason, type: string, source: system, description: "Set when status becomes CANCELLED" }
      - { name: expires_at, type: datetime, source: computed, description: "start_at - 4 hours; if no claim by then, system auto-expires" }

  - name: SittingClaim
    parent: SittingRequest
    common_fields: true
    fields:
      - { name: sitting_request_id, type: string, source: system, description: "FK -> SittingRequest.id" }
      - { name: claimer_member_id, type: string, source: system, description: "FK -> Member.id; sitter claiming" }
      - { name: message, type: string, source: input, description: "Claim pitch" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: decided_at, type: datetime, source: system, description: "Set on ACCEPTED/REJECTED" }

  - name: SittingAssignment
    parent: SittingRequest
    common_fields: true
    fields:
      - { name: sitting_request_id, type: string, source: system, description: "FK -> SittingRequest.id" }
      - { name: owner_member_id, type: string, source: system, description: "FK -> Member.id (denormalized from request)" }
      - { name: sitter_member_id, type: string, source: system, description: "FK -> Member.id (from accepted claim)" }
      - { name: scheduled_start_at, type: datetime, source: system, description: "Copied from request" }
      - { name: scheduled_end_at, type: datetime, source: system, description: "Copied from request" }
      - { name: actual_start_at, type: datetime, source: system, description: "Set by first EntryLog CHECK_IN" }
      - { name: actual_end_at, type: datetime, source: system, description: "Set by sitter checkout" }
      - { name: credit_hours_settled, type: number, source: computed, description: "Final hours credited to sitter at settlement; provisional vs final settlement variant differs (see calculations)" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | IN_PROGRESS | COMPLETED_PENDING_REVIEW | SETTLED | CANCELLED_BY_OWNER | CANCELLED_BY_SITTER | DISPUTED" }

  - name: AccessHandoff
    parent: SittingAssignment
    common_fields: true
    fields:
      - { name: sitting_assignment_id, type: string, source: system, description: "FK -> SittingAssignment.id" }
      - { name: handoff_method, type: enum, source: input, description: "IN_PERSON | LOCKBOX | CONCIERGE | SMART_LOCK" }
      - { name: access_code_ciphertext, type: string, source: input, description: "Encrypted access code; revealed to sitter only after assignment CONFIRMED and within 2h of scheduled_start_at" }
      - { name: handed_off_at, type: datetime, source: system, description: "Timestamp of handoff confirmation" }
      - { name: returned_at, type: datetime, source: system, description: "Timestamp keys/access returned" }
      - { name: status, type: enum, source: system, description: "PENDING | HANDED_OFF | RETURNED | LOST" }

  - name: EntryLog
    parent: SittingAssignment
    common_fields: false
    fields:
      - { name: sitting_assignment_id, type: string, source: system, description: "FK -> SittingAssignment.id" }
      - { name: actor_member_id, type: string, source: system, description: "FK -> Member.id; who performed the entry" }
      - { name: event_type, type: enum, source: input, description: "CHECK_IN | CHECK_OUT | INCIDENT_NOTE | PET_FED | MEDICATION_GIVEN | VET_VISIT" }
      - { name: occurred_at, type: datetime, source: input, description: "UTC timestamp of event; must be within [scheduled_start_at - 30m, scheduled_end_at + 4h]" }
      - { name: notes, type: string, source: input, description: "Optional notes; required when event_type is INCIDENT_NOTE or MEDICATION_GIVEN" }

  - name: Incident
    parent: SittingAssignment
    common_fields: true
    fields:
      - { name: sitting_assignment_id, type: string, source: system, description: "FK -> SittingAssignment.id" }
      - { name: reporter_member_id, type: string, source: system, description: "FK -> Member.id; who filed" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | EMERGENCY" }
      - { name: description, type: string, source: input, description: "Free text; min 30 chars" }
      - { name: vet_involved, type: boolean, source: input, description: "Whether emergency vet was contacted" }
      - { name: at_fault_member_id, type: string, source: system, description: "FK -> Member.id; set by admin determination; null until determination" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | RESOLVED_AT_FAULT | RESOLVED_NO_FAULT | DISMISSED" }

  - name: Dispute
    parent: Member
    common_fields: true
    fields:
      - { name: initiator_member_id, type: string, source: system, description: "FK -> Member.id; who opened the dispute" }
      - { name: respondent_member_id, type: string, source: input, description: "FK -> Member.id; other party" }
      - { name: sitting_assignment_id, type: string, source: input, description: "FK -> SittingAssignment.id; optional context; required if dispute_type == SITTING_QUALITY" }
      - { name: dispute_type, type: enum, source: input, description: "SITTING_QUALITY | CREDIT_BALANCE | ACCESS_DAMAGE | BEHAVIOR" }
      - { name: statement, type: string, source: input, description: "Initiator's statement; min 40 chars" }
      - { name: mediator_member_id, type: string, source: system, description: "FK -> Member.id; assigned mediator (mediator_flag == true); must differ from both parties" }
      - { name: status, type: enum, source: system, description: "FILED | MEDIATION | RESOLVED_UPHELD | RESOLVED_DISMISSED | ESCALATED_REMOVAL" }
      - { name: resolution_notes, type: string, source: system, description: "Mediator's resolution notes" }

  - name: CreditLedgerEntry
    parent: Member
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: entry_type, type: enum, source: system, description: "SIT_EARNED | SIT_SPENT | CANCELLATION_PENALTY | INCIDENT_PENALTY | MEDIATION_ADJUSTMENT | JOINING_GRANT" }
      - { name: delta_hours, type: number, source: system, description: "Signed change to credit_balance_hours; 2-decimal" }
      - { name: sitting_assignment_id, type: string, source: system, description: "FK -> SittingAssignment.id; null for non-assignment entries" }
      - { name: dispute_id, type: string, source: system, description: "FK -> Dispute.id; null unless entry_type == MEDIATION_ADJUSTMENT" }
      - { name: memo, type: string, source: system, description: "Human-readable explanation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    field: vetting_status
    initial_state: APPLIED
    terminal_states: [REMOVED]
    transitions:
      - from: APPLIED
        to: REFERENCES_PENDING
        trigger: "POST /coop/members/{memberId}/submit-references"
        actor: CoopAdmin
        preconditions:
          - "Member must be in APPLIED (ERR_INVALID_STATE)"
          - "At least 2 MemberReference rows for subject_member_id exist with status == PENDING (ERR_INSUFFICIENT_REFERENCES)"
        side_effects:
          - "Transitions references phase"
      - from: REFERENCES_PENDING
        to: VETTED
        trigger: "POST /coop/members/{memberId}/finalize-vetting"
        actor: CoopAdmin
        preconditions:
          - "Member must be in REFERENCES_PENDING (ERR_INVALID_STATE)"
          - "At least 2 MemberReference rows with status == ACCEPTED for subject_member_id (ERR_INSUFFICIENT_REFERENCES)"
          - "For each ACCEPTED reference R, the reciprocal reference (subject vouching for R.referee_member_id) MUST also be ACCEPTED; mutual requirement (ERR_RECIPROCITY_NOT_MET)"
          - "accepted_liability_at must be non-null (ERR_LIABILITY_NOT_ACCEPTED)"
        side_effects:
          - "co_op_joined_at := now"
          - "credit_balance_hours := JOINING_GRANT_HOURS (10.0)"
          - "Appends CreditLedgerEntry(JOINING_GRANT, +10.0)"
      - from: VETTED
        to: SUSPENDED
        trigger: "POST /coop/members/{memberId}/suspend"
        actor: CoopAdmin
        preconditions:
          - "Member must be VETTED (ERR_INVALID_STATE)"
          - "suspension_reason must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "All OPEN SittingRequests where owner_member_id == member.id → CANCELLED with reason='OWNER_SUSPENDED'"
          - "All PENDING SittingClaims where claimer_member_id == member.id → WITHDRAWN"
          - "All CONFIRMED SittingAssignments where sitter_member_id == member.id or owner_member_id == member.id → CANCELLED_BY_OWNER or CANCELLED_BY_SITTER per role; provisional_credit_hours reversed"
      - from: SUSPENDED
        to: VETTED
        trigger: "POST /coop/members/{memberId}/reinstate"
        actor: CoopAdmin
        preconditions:
          - "Member must be SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "suspension_reason := null"
      - from: [VETTED, SUSPENDED]
        to: REMOVED
        trigger: "POST /coop/members/{memberId}/remove"
        actor: CoopAdmin
        preconditions:
          - "Member must be VETTED or SUSPENDED (ERR_INVALID_STATE)"
          - "Either (a) member is respondent on a Dispute in ESCALATED_REMOVAL, OR (b) member has >= 2 RESOLVED_AT_FAULT incidents within trailing 12 months (ERR_REMOVAL_CRITERIA_NOT_MET)"
        side_effects:
          - "removal_reason := input"
          - "credit_balance_hours := 0; provisional_credit_hours := 0"
          - "Appends CreditLedgerEntry(MEDIATION_ADJUSTMENT, -credit_balance_hours_before) if non-zero"
          - "All PetProfiles where owner_member_id == member.id → active := false"
          - "All non-terminal SittingRequests → CANCELLED"
          - "All non-terminal SittingAssignments → CANCELLED_* with provisional reversal"
          - "Cannot be reinstated (terminal)"

  - entity: MemberReference
    field: status
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /coop/member-references/{referenceId}/accept"
        actor: CoopAdmin
        preconditions:
          - "Status must be PENDING (ERR_INVALID_STATE)"
          - "referee_member_id must be VETTED (ERR_REFEREE_NOT_VETTED)"
          - "referee_member_id != subject_member_id (ERR_SELF_REFERENCE)"
        side_effects:
          - "decided_at := now"
          - "If the reverse MemberReference (subject=referee_member_id AND referee=subject_member_id) is ACCEPTED, set both rows' reciprocal_reference_id to link them"
      - from: PENDING
        to: REJECTED
        trigger: "POST /coop/member-references/{referenceId}/reject"
        actor: CoopAdmin
        preconditions:
          - "Status must be PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "decided_at := now"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /coop/member-references/{referenceId}/withdraw"
        actor: Member
        preconditions:
          - "Status must be PENDING (ERR_INVALID_STATE)"
          - "Caller must be the referee (claimer identity check: X-User-ID == referee_member_id, ERR_FORBIDDEN)"
        side_effects: []

  - entity: SittingRequest
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: OPEN
        to: CLAIMED
        trigger: "system (when first SittingClaim transitions to ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Other PENDING claims on this request → REJECTED"
      - from: CLAIMED
        to: ASSIGNED
        trigger: "system (immediately after SittingAssignment row is created)"
        actor: system
        preconditions: []
        side_effects:
          - "SittingAssignment(status=CONFIRMED) row persisted"
          - "sitter's provisional_credit_hours += credit_hours_offered"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "system (on first EntryLog CHECK_IN for the assignment)"
        actor: system
        preconditions:
          - "AccessHandoff.status must be HANDED_OFF (ERR_ACCESS_NOT_HANDED_OFF)"
        side_effects:
          - "assignment.actual_start_at := entry_log.occurred_at"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (on sitter checkout EntryLog CHECK_OUT OR admin force-complete)"
        actor: system
        preconditions:
          - "At least one CHECK_IN entry exists (ERR_NO_CHECKIN)"
        side_effects:
          - "assignment.actual_end_at := occurred_at"
          - "assignment.status := COMPLETED_PENDING_REVIEW (paired machine)"
          - "Settlement calculation runs (see sitting_credit_settlement)"
      - from: [OPEN, CLAIMED]
        to: CANCELLED
        trigger: "POST /coop/sitting-requests/{requestId}/cancel"
        actor: Member
        preconditions:
          - "Caller must be owner (ERR_FORBIDDEN)"
          - "Status in {OPEN, CLAIMED} (ERR_INVALID_STATE)"
        side_effects:
          - "All PENDING claims → REJECTED"
          - "Any ACCEPTED claim → REJECTED; SittingAssignment → CANCELLED_BY_OWNER; provisional reversed"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /coop/sitting-requests/{requestId}/cancel"
        actor: Member
        preconditions:
          - "Caller must be owner or sitter (ERR_FORBIDDEN)"
          - "If within 24h of scheduled_start_at and caller is sitter: cancellation penalty applies"
        side_effects:
          - "SittingAssignment → CANCELLED_BY_OWNER or CANCELLED_BY_SITTER"
          - "provisional_credit_hours reversed"
          - "If late-sitter-cancel: sitter.reliability_score -= 8; CreditLedgerEntry(CANCELLATION_PENALTY, -credit_hours_offered * LATE_CANCEL_PENALTY_FRACTION) on sitter"
      - from: OPEN
        to: EXPIRED
        trigger: "system (at expires_at if no ACCEPTED claim exists)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SittingClaim
    field: status
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /coop/sitting-requests/{requestId}/claims/{claimId}/accept"
        actor: Member
        preconditions:
          - "Caller is request owner (ERR_FORBIDDEN)"
          - "Request status == OPEN (ERR_INVALID_STATE)"
          - "Claim status == PENDING (ERR_INVALID_STATE)"
          - "Claimant (claimer_member_id) vetting_status == VETTED (ERR_MEMBER_NOT_VETTED)"
          - "Claimant's reliability_score >= 30 (ERR_RELIABILITY_TOO_LOW)"
          - "Claimant has no overlapping SittingAssignment (CONFIRMED or IN_PROGRESS) with [start_at,end_at) (ERR_SITTER_OVERLAP)"
          - "OCC: payload.expected_sitting_request_version matches request.version (ERR_STALE_VERSION)"
        side_effects:
          - "claim.status := ACCEPTED; decided_at := now"
          - "SittingRequest.status := CLAIMED → ASSIGNED"
          - "SittingAssignment row created (status=CONFIRMED)"
          - "AccessHandoff row created (status=PENDING)"
          - "sitter.provisional_credit_hours += request.credit_hours_offered"
          - "request.version += 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /coop/sitting-requests/{requestId}/claims/{claimId}/reject"
        actor: Member
        preconditions:
          - "Caller is request owner (ERR_FORBIDDEN)"
          - "Claim status == PENDING (ERR_INVALID_STATE)"
        side_effects: ["decided_at := now"]
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /coop/sitting-requests/{requestId}/claims/{claimId}/withdraw"
        actor: Member
        preconditions:
          - "Caller is claimer (ERR_FORBIDDEN)"
          - "Claim status == PENDING (ERR_INVALID_STATE)"
        side_effects: []

  - entity: SittingAssignment
    field: status
    initial_state: CONFIRMED
    terminal_states: [SETTLED, CANCELLED_BY_OWNER, CANCELLED_BY_SITTER]
    transitions:
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "system (first EntryLog CHECK_IN)"
        actor: system
        preconditions:
          - "AccessHandoff.status == HANDED_OFF (ERR_ACCESS_NOT_HANDED_OFF)"
        side_effects:
          - "actual_start_at := entry.occurred_at"
      - from: IN_PROGRESS
        to: COMPLETED_PENDING_REVIEW
        trigger: "POST /coop/sitting-assignments/{assignmentId}/checkout"
        actor: Member
        preconditions:
          - "Caller is sitter (ERR_FORBIDDEN)"
          - "Status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "At least one CHECK_IN EntryLog exists (ERR_NO_CHECKIN)"
        side_effects:
          - "actual_end_at := now"
          - "SittingRequest.status := COMPLETED"
          - "Appends EntryLog(CHECK_OUT)"
      - from: COMPLETED_PENDING_REVIEW
        to: SETTLED
        trigger: "POST /coop/sitting-assignments/{assignmentId}/settle"
        actor: CoopAdmin
        preconditions:
          - "Status == COMPLETED_PENDING_REVIEW (ERR_INVALID_STATE)"
          - "No FILED or UNDER_REVIEW Incident on this assignment (ERR_UNRESOLVED_INCIDENT)"
        side_effects:
          - "credit_hours_settled computed via sitting_credit_settlement (final variant)"
          - "sitter.credit_balance_hours += credit_hours_settled; CreditLedgerEntry(SIT_EARNED, +credit_hours_settled) on sitter"
          - "owner.credit_balance_hours -= credit_hours_settled; CreditLedgerEntry(SIT_SPENT, -credit_hours_settled) on owner"
          - "sitter.provisional_credit_hours -= request.credit_hours_offered"
          - "sitter.reliability_score += 2 (capped at 100)"
      - from: CONFIRMED
        to: CANCELLED_BY_OWNER
        trigger: "POST /coop/sitting-requests/{requestId}/cancel (by owner) or member suspension/removal cascade"
        actor: Member
        preconditions: []
        side_effects:
          - "provisional_credit_hours reversed on sitter"
      - from: CONFIRMED
        to: CANCELLED_BY_SITTER
        trigger: "POST /coop/sitting-requests/{requestId}/cancel (by sitter)"
        actor: Member
        preconditions: []
        side_effects:
          - "provisional_credit_hours reversed"
          - "If within 24h of scheduled_start_at: late-cancel penalty (see sitting_requests cancel)"
      - from: COMPLETED_PENDING_REVIEW
        to: DISPUTED
        trigger: "POST /coop/disputes (with sitting_assignment_id == this.id)"
        actor: Member
        preconditions:
          - "Caller is owner or sitter (ERR_FORBIDDEN)"
        side_effects:
          - "Settlement blocked until dispute resolves"
      - from: DISPUTED
        to: SETTLED
        trigger: "system (dispute resolved without credit adjustment OR admin force-settle)"
        actor: system
        preconditions:
          - "Linked Dispute.status ∈ {RESOLVED_UPHELD, RESOLVED_DISMISSED}"
        side_effects:
          - "Same settlement cascade as COMPLETED_PENDING_REVIEW → SETTLED"

  - entity: AccessHandoff
    field: status
    initial_state: PENDING
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: PENDING
        to: HANDED_OFF
        trigger: "POST /coop/access-handoffs/{handoffId}/confirm-handoff"
        actor: Member
        preconditions:
          - "Caller is owner (ERR_FORBIDDEN)"
          - "Status == PENDING (ERR_INVALID_STATE)"
          - "now >= scheduled_start_at - 2h (ERR_HANDOFF_TOO_EARLY)"
        side_effects:
          - "handed_off_at := now"
      - from: HANDED_OFF
        to: RETURNED
        trigger: "POST /coop/access-handoffs/{handoffId}/confirm-return"
        actor: Member
        preconditions:
          - "Caller is owner (ERR_FORBIDDEN)"
          - "Status == HANDED_OFF (ERR_INVALID_STATE)"
          - "SittingAssignment.status ∈ {COMPLETED_PENDING_REVIEW, SETTLED, CANCELLED_BY_OWNER, CANCELLED_BY_SITTER} (ERR_INVALID_STATE)"
        side_effects:
          - "returned_at := now"
      - from: HANDED_OFF
        to: LOST
        trigger: "POST /coop/access-handoffs/{handoffId}/report-lost"
        actor: Member
        preconditions:
          - "Caller is owner or sitter (ERR_FORBIDDEN)"
          - "Status == HANDED_OFF (ERR_INVALID_STATE)"
        side_effects:
          - "Auto-files Incident(severity=MAJOR, description='Access credentials lost')"
          - "Sitter.reliability_score -= 10"

  - entity: Incident
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_AT_FAULT, RESOLVED_NO_FAULT, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /coop/incidents/{incidentId}/begin-review"
        actor: CoopAdmin
        preconditions:
          - "Status == FILED (ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED_AT_FAULT
        trigger: "POST /coop/incidents/{incidentId}/resolve"
        actor: CoopAdmin
        preconditions:
          - "Status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Payload outcome == AT_FAULT; at_fault_member_id required (ERR_INVALID_REQUEST)"
        side_effects:
          - "at_fault_member.reliability_score -= 15"
          - "CreditLedgerEntry(INCIDENT_PENALTY, -credit_hours_settled * INCIDENT_PENALTY_FRACTION) on at-fault member if assignment SETTLED"
          - "If at-fault member now has >= 2 RESOLVED_AT_FAULT incidents in trailing 12 months: eligibility for /remove met"
      - from: UNDER_REVIEW
        to: RESOLVED_NO_FAULT
        trigger: "POST /coop/incidents/{incidentId}/resolve"
        actor: CoopAdmin
        preconditions:
          - "Status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Payload outcome == NO_FAULT"
        side_effects: []
      - from: [FILED, UNDER_REVIEW]
        to: DISMISSED
        trigger: "POST /coop/incidents/{incidentId}/dismiss"
        actor: CoopAdmin
        preconditions:
          - "Status ∈ {FILED, UNDER_REVIEW} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Dispute
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_DISMISSED, ESCALATED_REMOVAL]
    transitions:
      - from: FILED
        to: MEDIATION
        trigger: "POST /coop/disputes/{disputeId}/assign-mediator"
        actor: CoopAdmin
        preconditions:
          - "Status == FILED (ERR_INVALID_STATE)"
          - "mediator_member_id must reference VETTED member with mediator_flag == true (ERR_MEDIATOR_INVALID)"
          - "mediator_member_id != initiator_member_id AND != respondent_member_id (ERR_MEDIATOR_CONFLICT)"
        side_effects: []
      - from: MEDIATION
        to: RESOLVED_UPHELD
        trigger: "POST /coop/disputes/{disputeId}/resolve"
        actor: Member
        preconditions:
          - "Status == MEDIATION (ERR_INVALID_STATE)"
          - "Caller is assigned mediator (X-User-ID == mediator_member_id, ERR_FORBIDDEN)"
          - "Payload outcome == UPHELD; resolution_notes required (ERR_INVALID_REQUEST)"
        side_effects:
          - "If dispute_type == CREDIT_BALANCE and payload.credit_adjustment_hours != 0: CreditLedgerEntry(MEDIATION_ADJUSTMENT, +adj) on initiator and (-adj) on respondent"
          - "If sitting_assignment_id present and assignment.status == DISPUTED: assignment → SETTLED"
      - from: MEDIATION
        to: RESOLVED_DISMISSED
        trigger: "POST /coop/disputes/{disputeId}/resolve"
        actor: Member
        preconditions:
          - "Status == MEDIATION (ERR_INVALID_STATE)"
          - "Caller is mediator (ERR_FORBIDDEN)"
          - "Payload outcome == DISMISSED"
        side_effects:
          - "If sitting_assignment_id present and assignment.status == DISPUTED: assignment → SETTLED"
      - from: MEDIATION
        to: ESCALATED_REMOVAL
        trigger: "POST /coop/disputes/{disputeId}/escalate"
        actor: Member
        preconditions:
          - "Status == MEDIATION (ERR_INVALID_STATE)"
          - "Caller is mediator (ERR_FORBIDDEN)"
          - "dispute_type ∈ {ACCESS_DAMAGE, BEHAVIOR} (ERR_INVALID_REQUEST)"
        side_effects:
          - "Respondent becomes eligible for /remove (admin can invoke)"
          - "Respondent.reliability_score -= 25"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-accept-stale-request
    parent_entity: SittingRequest
    write_endpoint: "POST /coop/sitting-requests/{requestId}/claims/{claimId}/accept"
    occ_field: "expected_sitting_request_version"
    description: |
      Accepting a claim against a SittingRequest whose version has advanced
      since the owner last observed it is rejected. This captures the case
      where another writer has just accepted a different claim (which
      legitimately transitions the request to CLAIMED and creates an
      assignment), or the request has been cancelled, leaving the current
      writer's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_hours_offered
    trigger: "sitting request posting (POST /coop/sitting-requests)"
    algorithm: tiered_pricing
    formula: |
      duration_hours = (end_at - start_at) / 3600.0   # fractional hours allowed
      # Find ALL enabled HolidayWindows whose [window_start, window_end) intersects
      # the request's [start_at, end_at). If multiple intersect, apply only the
      # HIGHEST multiplier (no compounding).
      applicable = { w.demand_multiplier : w ∈ HolidayWindow
                     where w.enabled == true
                     and w.window_start < end_at
                     and w.window_end > start_at }
      if applicable is empty:
        multiplier = 1.0
      else:
        multiplier = max(applicable)
      credit_hours_offered = round_half_up(duration_hours * multiplier, 2)
    input_set: "All enabled HolidayWindow rows; the request's [start_at, end_at) interval"
    constants:
      MIN_DURATION_HOURS: 1
      MAX_DURATION_HOURS: 72
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: sitting_credit_settlement
    trigger: "POST /coop/sitting-assignments/{assignmentId}/settle"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL variant (computed at claim acceptance; stored as
      # sitter.provisional_credit_hours):
      #   provisional = request.credit_hours_offered
      #
      # FINAL variant (computed at settle; what actually posts to ledger):
      #   Let scheduled_hours = (scheduled_end_at - scheduled_start_at)/3600
      #   Let actual_hours    = (actual_end_at    - actual_start_at)/3600
      #   Let demand_mult     = multiplier locked at request posting
      #   early_departure_hours = max(0, scheduled_hours - actual_hours)
      #   early_fraction = early_departure_hours / scheduled_hours
      #   if early_fraction > EARLY_DEPARTURE_THRESHOLD (0.25):
      #     base = actual_hours * demand_mult * EARLY_DEPARTURE_CREDIT_RATE (0.5)
      #   else:
      #     base = request.credit_hours_offered   # full credit, no re-proration
      #   credit_hours_settled = round_half_up(base, 2)
      #
      # The two variants DIVERGE whenever actual departs early by >25% of
      # scheduled duration; provisional is the optimistic posting, final is
      # the realized settlement.
      pass
    input_set: "SittingAssignment.actual_start_at, actual_end_at, scheduled_start_at, scheduled_end_at; SittingRequest.credit_hours_offered"
    constants:
      EARLY_DEPARTURE_THRESHOLD: 0.25
      EARLY_DEPARTURE_CREDIT_RATE: 0.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "At claim acceptance (SittingClaim ACCEPTED); stored on sitter.provisional_credit_hours"
        difference: "Uses request.credit_hours_offered unchanged; no proration"
      - name: final
        when: "At settle (SittingAssignment SETTLED); stored as credit_hours_settled and posted to ledger"
        difference: "Applies early-departure proration rule; result may be < provisional"

  - name: reliability_score_recompute
    trigger: "assignment settle, late cancellation, incident resolution, dispute escalation, access-lost report"
    algorithm: aggregation
    formula: |
      # Score is updated EVENT-WISE, not recomputed:
      #   +2 per assignment SETTLED (sitter)
      #   -8 per sitter late-cancel (within 24h of scheduled_start_at)
      #   -15 per incident RESOLVED_AT_FAULT where member is at_fault
      #   -10 per AccessHandoff LOST where member is sitter
      #   -25 per dispute ESCALATED_REMOVAL where member is respondent
      # Clamp to [0, 100]. Initial value at member creation: 50.
      pass
    input_set: "Individual event"
    constants:
      SCORE_INIT: 50
      SCORE_SETTLE_BONUS: 2
      SCORE_LATE_CANCEL: -8
      SCORE_INCIDENT_AT_FAULT: -15
      SCORE_ACCESS_LOST: -10
      SCORE_DISPUTE_ESCALATED: -25
      SCORE_MIN: 0
      SCORE_MAX: 100
      CLAIM_MIN_SCORE: 30
    precision: "integer"
    variants: []

  - name: member_credit_balance
    trigger: "any CreditLedgerEntry append"
    algorithm: chronological
    formula: |
      # Balance is derived by replaying CreditLedgerEntry rows in
      # (created_at ASC, entry_id ASC) order — never id.
      #   credit_balance_hours = Σ delta_hours
      # Updated inline on every append; read via Member.credit_balance_hours.
      pass
    input_set: "All CreditLedgerEntry rows where member_id == member.id, ordered by created_at ASC then entry_id ASC"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: sitter_overlap_check
    trigger: "claim acceptance"
    algorithm: interval_merge
    formula: |
      # Half-open interval overlap: [start_at, end_at).
      # Two intervals [a1,b1) and [a2,b2) overlap iff a1 < b2 AND a2 < b1.
      # Adjacent intervals (a2 == b1 or b2 == a1) do NOT overlap.
      # Sitter cannot have another SittingAssignment with status ∈
      # {CONFIRMED, IN_PROGRESS} whose [scheduled_start_at, scheduled_end_at)
      # overlaps the candidate request's [start_at, end_at).
      pass
    input_set: "All SittingAssignments where sitter_member_id == claimant and status ∈ {CONFIRMED, IN_PROGRESS}"
    constants: {}
    precision: "datetime (UTC, second precision)"
    variants: []

  - name: late_cancel_penalty
    trigger: "sitter-initiated cancel within 24h of scheduled_start_at"
    algorithm: threshold
    formula: |
      # hours_until_start = (scheduled_start_at - now)/3600
      # if hours_until_start < LATE_CANCEL_WINDOW_HOURS (24):
      #   penalty_hours = round_half_up(request.credit_hours_offered * LATE_CANCEL_PENALTY_FRACTION, 2)
      #   sitter.credit_balance_hours -= penalty_hours
      #   CreditLedgerEntry(CANCELLATION_PENALTY, -penalty_hours)
      #   sitter.reliability_score -= 8
      # Boundary: exactly 24.0 hours before is NOT late (>= 24 means outside window).
      pass
    input_set: "SittingAssignment and SittingRequest; current time"
    constants:
      LATE_CANCEL_WINDOW_HOURS: 24
      LATE_CANCEL_PENALTY_FRACTION: 0.25
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: incident_penalty
    trigger: "incident RESOLVED_AT_FAULT"
    algorithm: threshold
    formula: |
      # penalty = round_half_up(assignment.credit_hours_settled * INCIDENT_PENALTY_FRACTION, 2)
      # Applied only if the assignment is already SETTLED; otherwise the
      # settlement itself is the penalty context (no separate ledger entry).
      # At-fault member's reliability_score -= 15 (clamp at 0).
      pass
    input_set: "Incident, SittingAssignment (must be SETTLED for ledger penalty)"
    constants:
      INCIDENT_PENALTY_FRACTION: 0.5
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: removal_eligibility_check
    trigger: "POST /coop/members/{memberId}/remove"
    algorithm: aggregation
    formula: |
      # eligible := (member is respondent on any Dispute in ESCALATED_REMOVAL)
      #          OR (count of Incident rows where at_fault_member_id == member.id
      #              AND status == RESOLVED_AT_FAULT
      #              AND incident.decided_at >= now - 365 days) >= 2
      # Boundary: incident at exactly (now - 365d) counts (>= inclusive).
      pass
    input_set: "Disputes where respondent_member_id == member.id; Incidents where at_fault_member_id == member.id"
    constants:
      AT_FAULT_WINDOW_DAYS: 365
      AT_FAULT_THRESHOLD: 2
    precision: "integer count"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path parameters must resolve to existing resources, validated left-to-right (memberId, requestId, claimId, assignmentId, handoffId, incidentId, disputeId, referenceId, petProfileId, holidayWindowId)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "OCC: expected_*_version (when present in payload) must match the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coop/sitting-requests/{requestId}/claims/{claimId}/accept"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Identity/ownership: caller must be the resource owner or authorized party (e.g., request owner, claimer, sitter, mediator, referee)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "ownership-scoped endpoints"

  - priority: 7
    category: business_safety
    check: "Member vetting: claimant / mediator / referee must be VETTED"
    error_id: ERR_MEMBER_NOT_VETTED
    http_status: 409
    applies_to: "claim acceptance, mediator assignment, reference acceptance"

  - priority: 8
    category: business_safety
    check: "Reliability floor: claimant's reliability_score must be >= 30 to claim"
    error_id: ERR_RELIABILITY_TOO_LOW
    http_status: 409
    applies_to: "POST /coop/sitting-requests/{requestId}/claims"

  - priority: 9
    category: business_referential
    check: "Reference integrity: referee != subject, referee is VETTED, reciprocal reference exists and ACCEPTED before member can be VETTED"
    error_id: ERR_RECIPROCITY_NOT_MET
    http_status: 409
    applies_to: "POST /coop/members/{memberId}/finalize-vetting"

  - priority: 10
    category: business_temporal
    check: "Sitter overlap: no overlapping CONFIRMED/IN_PROGRESS assignment (half-open interval)"
    error_id: ERR_SITTER_OVERLAP
    http_status: 409
    applies_to: "POST /coop/sitting-requests/{requestId}/claims/{claimId}/accept"

  - priority: 11
    category: business_temporal
    check: "Handoff timing: handoff cannot be confirmed earlier than scheduled_start_at - 2h"
    error_id: ERR_HANDOFF_TOO_EARLY
    http_status: 409
    applies_to: "POST /coop/access-handoffs/{handoffId}/confirm-handoff"

  - priority: 12
    category: business_temporal
    check: "Handoff required: assignment cannot move to IN_PROGRESS without HANDED_OFF handoff"
    error_id: ERR_ACCESS_NOT_HANDED_OFF
    http_status: 409
    applies_to: "EntryLog CHECK_IN ingestion"

  - priority: 13
    category: business_temporal
    check: "EntryLog occurred_at within [scheduled_start_at - 30m, scheduled_end_at + 4h]"
    error_id: ERR_ENTRY_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /coop/sitting-assignments/{assignmentId}/entry-logs"

  - priority: 14
    category: business_fiscal
    check: "Owner must have sufficient credit_balance_hours to cover the request's credit_hours_offered (posting time check): balance - offered >= -MAX_OVERDRAFT_HOURS (5.0)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /coop/sitting-requests"

  - priority: 15
    category: business_constraint
    check: "Pet profile must be active and liability waiver accepted"
    error_id: ERR_PET_PROFILE_INVALID
    http_status: 409
    applies_to: "POST /coop/sitting-requests"

  - priority: 16
    category: business_constraint
    check: "Self-dealing prohibited: claimer != owner; mediator != initiator and != respondent; referee != subject"
    error_id: ERR_SELF_REFERENCE
    http_status: 422
    applies_to: "claim creation, mediator assignment, reference creation"

  - priority: 17
    category: business_constraint
    check: "Request duration must be in [1, 72] hours; start_at must be in future"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /coop/sitting-requests"

  - priority: 18
    category: business_constraint
    check: "Settlement blocked while FILED or UNDER_REVIEW incident exists on the assignment"
    error_id: ERR_UNRESOLVED_INCIDENT
    http_status: 409
    applies_to: "POST /coop/sitting-assignments/{assignmentId}/settle"

  - priority: 19
    category: business_constraint
    check: "Removal eligibility: respondent on ESCALATED_REMOVAL dispute, OR >= 2 RESOLVED_AT_FAULT incidents in trailing 365 days"
    error_id: ERR_REMOVAL_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /coop/members/{memberId}/remove"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/coop/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock. Used by tests to drive time-dependent rules."
    roles: [CoopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Advances logical clock; triggers time-based cascades (request expiry)"]

  # --- Members ---
  - method: POST
    path: "/coop/members"
    description: "Apply for co-op membership"
    roles: [Anonymous]
    code: 201
    input: [display_name, email, address_block, phone, "mediator_flag?"]
    output: Member
    side_effects: ["vetting_status=APPLIED, reliability_score=50, credit_balance_hours=0, provisional_credit_hours=0"]

  - method: GET
    path: "/coop/members"
    description: "List members"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "vetting_status?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/coop/members/{memberId}"
    description: "Get member by id"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/coop/members/{memberId}/accept-liability"
    description: "Member accepts the co-op liability agreement"
    roles: [Member]
    code: 200
    input: []
    output: Member
    side_effects: ["accepted_liability_at := now"]

  - method: POST
    path: "/coop/members/{memberId}/submit-references"
    description: "Admin moves APPLIED member to REFERENCES_PENDING after references collected"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["vetting_status := REFERENCES_PENDING"]

  - method: POST
    path: "/coop/members/{memberId}/finalize-vetting"
    description: "Admin vets a member after reciprocity check passes"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects:
      - "vetting_status := VETTED; co_op_joined_at := now"
      - "credit_balance_hours := 10.0; CreditLedgerEntry(JOINING_GRANT, +10.0)"

  - method: POST
    path: "/coop/members/{memberId}/suspend"
    description: "Admin suspends a member (cascade-cancels active requests/claims/assignments)"
    roles: [CoopAdmin]
    code: 200
    input: [suspension_reason]
    output: Member
    side_effects:
      - "vetting_status := SUSPENDED"
      - "All OPEN SittingRequests where owner=member → CANCELLED"
      - "All PENDING SittingClaims where claimer=member → WITHDRAWN"
      - "All non-terminal SittingAssignments → CANCELLED_* with provisional reversal"

  - method: POST
    path: "/coop/members/{memberId}/reinstate"
    description: "Admin reinstates a suspended member"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["vetting_status := VETTED; suspension_reason := null"]

  - method: POST
    path: "/coop/members/{memberId}/remove"
    description: "Admin permanently removes a member (eligibility-checked)"
    roles: [CoopAdmin]
    code: 200
    input: [removal_reason]
    output: Member
    side_effects:
      - "vetting_status := REMOVED; terminal"
      - "credit_balance_hours := 0; provisional := 0"
      - "All PetProfiles where owner=member → active=false"
      - "All non-terminal requests/claims/assignments → cancelled"

  # --- Member References ---
  - method: POST
    path: "/coop/members/{memberId}/references"
    description: "Subject member adds a referee (or admin on their behalf)"
    roles: [CoopAdmin, Member]
    code: 201
    input: [referee_member_id, relationship_years, attestation_text]
    output: MemberReference
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/coop/members/{memberId}/references"
    description: "List references where subject_member_id == memberId"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "MemberReference[]"
    side_effects: []

  - method: GET
    path: "/coop/member-references/{referenceId}"
    description: "Get a reference by id"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: MemberReference
    side_effects: []

  - method: POST
    path: "/coop/member-references/{referenceId}/accept"
    description: "Admin accepts a reference"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: MemberReference
    side_effects: ["status := ACCEPTED; decided_at := now; reciprocal_reference_id linked if reverse pair is also ACCEPTED"]

  - method: POST
    path: "/coop/member-references/{referenceId}/reject"
    description: "Admin rejects a reference"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: MemberReference
    side_effects: ["status := REJECTED; decided_at := now"]

  - method: POST
    path: "/coop/member-references/{referenceId}/withdraw"
    description: "Referee withdraws their own reference"
    roles: [Member]
    code: 200
    input: []
    output: MemberReference
    side_effects: ["status := WITHDRAWN"]

  # --- Pet Profiles ---
  - method: POST
    path: "/coop/members/{memberId}/pet-profiles"
    description: "Create a pet profile"
    roles: [Member]
    code: 201
    input: [pet_name, species, routine_notes, medical_notes, emergency_vet_name, emergency_vet_phone, emergency_vet_address, liability_waiver_accepted]
    output: PetProfile
    side_effects: ["owner_member_id := X-User-ID; active := true"]

  - method: GET
    path: "/coop/members/{memberId}/pet-profiles"
    description: "List member's pet profiles"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: "PetProfile[]"
    side_effects: []

  - method: GET
    path: "/coop/pet-profiles/{petProfileId}"
    description: "Get a pet profile"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: PetProfile
    side_effects: []

  - method: POST
    path: "/coop/pet-profiles/{petProfileId}/deactivate"
    description: "Soft-delete a pet profile"
    roles: [Member]
    code: 200
    input: []
    output: PetProfile
    side_effects: ["active := false; ownership enforced"]

  # --- Holiday Windows ---
  - method: POST
    path: "/coop/holiday-windows"
    description: "Admin creates a holiday demand window"
    roles: [CoopAdmin]
    code: 201
    input: [name, window_start, window_end, demand_multiplier, "enabled?"]
    output: HolidayWindow
    side_effects: []

  - method: GET
    path: "/coop/holiday-windows"
    description: "List holiday windows"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "enabled?"]
    output: "HolidayWindow[]"
    side_effects: []

  - method: GET
    path: "/coop/holiday-windows/{windowId}"
    description: "Get a holiday window"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: HolidayWindow
    side_effects: []

  - method: POST
    path: "/coop/holiday-windows/{windowId}/disable"
    description: "Disable a holiday window (does not retroactively change locked credit_hours_offered)"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: HolidayWindow
    side_effects: ["enabled := false"]

  # --- Sitting Requests ---
  - method: POST
    path: "/coop/sitting-requests"
    description: "Owner posts a sitting request"
    roles: [Member]
    code: 201
    input: [pet_profile_id, start_at, end_at, instructions]
    output: SittingRequest
    side_effects:
      - "owner_member_id := X-User-ID"
      - "credit_hours_offered computed (locked at posting)"
      - "status := OPEN; expires_at := start_at - 4h"

  - method: GET
    path: "/coop/sitting-requests"
    description: "List sitting requests"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "status?", "owner_member_id?"]
    output: "SittingRequest[]"
    side_effects: []

  - method: GET
    path: "/coop/sitting-requests/{requestId}"
    description: "Get a sitting request"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: SittingRequest
    side_effects: []

  - method: POST
    path: "/coop/sitting-requests/{requestId}/cancel"
    description: "Owner or sitter cancels a request/assignment"
    roles: [Member]
    code: 200
    input: [cancelled_reason]
    output: SittingRequest
    side_effects:
      - "status := CANCELLED"
      - "Linked claims → REJECTED; assignment → CANCELLED_BY_*"
      - "Late-cancel penalties if sitter-initiated within 24h"

  # --- Claims ---
  - method: POST
    path: "/coop/sitting-requests/{requestId}/claims"
    description: "Vetted member claims an OPEN request"
    roles: [Member]
    code: 201
    input: [message]
    output: SittingClaim
    side_effects: ["claimer_member_id := X-User-ID; status=PENDING"]

  - method: GET
    path: "/coop/sitting-requests/{requestId}/claims"
    description: "List claims for a request"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SittingClaim[]"
    side_effects: []

  - method: GET
    path: "/coop/sitting-claims/{claimId}"
    description: "Get a claim by id"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: SittingClaim
    side_effects: []

  - method: POST
    path: "/coop/sitting-requests/{requestId}/claims/{claimId}/accept"
    description: "Owner accepts a claim (OCC-guarded)"
    roles: [Member]
    code: 200
    input: [expected_sitting_request_version]
    output: SittingClaim
    side_effects:
      - "claim.status := ACCEPTED; decided_at := now"
      - "request.status := ASSIGNED; request.version += 1"
      - "Other PENDING claims on this request → REJECTED"
      - "SittingAssignment created (CONFIRMED); AccessHandoff created (PENDING)"
      - "sitter.provisional_credit_hours += request.credit_hours_offered"

  - method: POST
    path: "/coop/sitting-requests/{requestId}/claims/{claimId}/reject"
    description: "Owner rejects a claim"
    roles: [Member]
    code: 200
    input: []
    output: SittingClaim
    side_effects: ["status := REJECTED; decided_at := now"]

  - method: POST
    path: "/coop/sitting-requests/{requestId}/claims/{claimId}/withdraw"
    description: "Claimer withdraws own claim"
    roles: [Member]
    code: 200
    input: []
    output: SittingClaim
    side_effects: ["status := WITHDRAWN"]

  # --- Assignments ---
  - method: GET
    path: "/coop/sitting-assignments/{assignmentId}"
    description: "Get an assignment"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: SittingAssignment
    side_effects: []

  - method: GET
    path: "/coop/sitting-requests/{requestId}/assignment"
    description: "Get the assignment for a request (0 or 1 element array)"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: "SittingAssignment[]"
    side_effects: []

  - method: POST
    path: "/coop/sitting-assignments/{assignmentId}/checkout"
    description: "Sitter checks out (final EntryLog CHECK_OUT)"
    roles: [Member]
    code: 200
    input: []
    output: SittingAssignment
    side_effects:
      - "actual_end_at := now; status := COMPLETED_PENDING_REVIEW"
      - "request.status := COMPLETED"
      - "Appends EntryLog(CHECK_OUT)"

  - method: POST
    path: "/coop/sitting-assignments/{assignmentId}/settle"
    description: "Admin settles a completed assignment (posts ledger entries)"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: SittingAssignment
    side_effects:
      - "credit_hours_settled computed (final variant)"
      - "sitter.credit_balance_hours += settled; CreditLedgerEntry(SIT_EARNED)"
      - "owner.credit_balance_hours -= settled; CreditLedgerEntry(SIT_SPENT)"
      - "sitter.provisional_credit_hours -= request.credit_hours_offered"
      - "sitter.reliability_score += 2 (cap 100)"

  # --- Access Handoffs ---
  - method: GET
    path: "/coop/sitting-assignments/{assignmentId}/access-handoff"
    description: "Get the handoff for an assignment (0 or 1 element array)"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: "AccessHandoff[]"
    side_effects: []

  - method: POST
    path: "/coop/access-handoffs/{handoffId}/confirm-handoff"
    description: "Owner confirms keys handed to sitter"
    roles: [Member]
    code: 200
    input: []
    output: AccessHandoff
    side_effects: ["status := HANDED_OFF; handed_off_at := now"]

  - method: POST
    path: "/coop/access-handoffs/{handoffId}/confirm-return"
    description: "Owner confirms keys returned"
    roles: [Member]
    code: 200
    input: []
    output: AccessHandoff
    side_effects: ["status := RETURNED; returned_at := now"]

  - method: POST
    path: "/coop/access-handoffs/{handoffId}/report-lost"
    description: "Owner or sitter reports access lost"
    roles: [Member]
    code: 200
    input: []
    output: AccessHandoff
    side_effects:
      - "status := LOST"
      - "Auto-files Incident(severity=MAJOR, description='Access credentials lost')"
      - "sitter.reliability_score -= 10"

  - method: PUT
    path: "/coop/access-handoffs/{handoffId}"
    description: "Owner sets access code / handoff method (only while PENDING)"
    roles: [Member]
    code: 200
    input: [handoff_method, access_code_ciphertext]
    output: AccessHandoff
    side_effects: []

  # --- Entry Logs ---
  - method: POST
    path: "/coop/sitting-assignments/{assignmentId}/entry-logs"
    description: "Append an entry log (CHECK_IN/CHECK_OUT/feeding/medication/vet)"
    roles: [Member]
    code: 201
    input: [event_type, occurred_at, "notes?"]
    output: EntryLog
    side_effects:
      - "actor_member_id := X-User-ID"
      - "If event_type == CHECK_IN and assignment.status == CONFIRMED: assignment → IN_PROGRESS; request → IN_PROGRESS"
      - "Validates occurred_at within window"

  - method: GET
    path: "/coop/sitting-assignments/{assignmentId}/entry-logs"
    description: "List entry logs for an assignment"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "event_type?"]
    output: "EntryLog[]"
    side_effects: []

  # --- Incidents ---
  - method: POST
    path: "/coop/sitting-assignments/{assignmentId}/incidents"
    description: "File an incident on an assignment"
    roles: [Member]
    code: 201
    input: [severity, description, vet_involved]
    output: Incident
    side_effects: ["reporter_member_id := X-User-ID; status=FILED"]

  - method: GET
    path: "/coop/sitting-assignments/{assignmentId}/incidents"
    description: "List incidents on an assignment"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Incident[]"
    side_effects: []

  - method: GET
    path: "/coop/incidents/{incidentId}"
    description: "Get an incident"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/coop/incidents/{incidentId}/begin-review"
    description: "Admin begins review"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: ["status := UNDER_REVIEW"]

  - method: POST
    path: "/coop/incidents/{incidentId}/resolve"
    description: "Admin resolves incident (AT_FAULT or NO_FAULT)"
    roles: [CoopAdmin]
    code: 200
    input: [outcome, "at_fault_member_id?"]
    output: Incident
    side_effects:
      - "status := RESOLVED_AT_FAULT or RESOLVED_NO_FAULT"
      - "If AT_FAULT: at_fault member reliability_score -= 15; ledger penalty if assignment SETTLED"

  - method: POST
    path: "/coop/incidents/{incidentId}/dismiss"
    description: "Admin dismisses an incident"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: ["status := DISMISSED"]

  # --- Disputes ---
  - method: POST
    path: "/coop/disputes"
    description: "Open a dispute"
    roles: [Member]
    code: 201
    input: [respondent_member_id, dispute_type, statement, "sitting_assignment_id?"]
    output: Dispute
    side_effects:
      - "initiator_member_id := X-User-ID; status=FILED"
      - "If sitting_assignment_id present and assignment.status == COMPLETED_PENDING_REVIEW: assignment → DISPUTED"

  - method: GET
    path: "/coop/disputes"
    description: "List disputes"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "status?", "initiator_member_id?", "respondent_member_id?"]
    output: "Dispute[]"
    side_effects: []

  - method: GET
    path: "/coop/disputes/{disputeId}"
    description: "Get a dispute"
    roles: [CoopAdmin, Member]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: POST
    path: "/coop/disputes/{disputeId}/assign-mediator"
    description: "Admin assigns a mediator"
    roles: [CoopAdmin]
    code: 200
    input: [mediator_member_id]
    output: Dispute
    side_effects: ["status := MEDIATION"]

  - method: POST
    path: "/coop/disputes/{disputeId}/resolve"
    description: "Mediator resolves dispute"
    roles: [Member]
    code: 200
    input: [outcome, resolution_notes, "credit_adjustment_hours?"]
    output: Dispute
    side_effects:
      - "status := RESOLVED_UPHELD or RESOLVED_DISMISSED"
      - "If CREDIT_BALANCE and credit_adjustment_hours != 0: ledger adjustments on both parties"
      - "If sitting_assignment_id present: assignment DISPUTED → SETTLED"

  - method: POST
    path: "/coop/disputes/{disputeId}/escalate"
    description: "Mediator escalates to removal track"
    roles: [Member]
    code: 200
    input: [resolution_notes]
    output: Dispute
    side_effects:
      - "status := ESCALATED_REMOVAL"
      - "respondent.reliability_score -= 25"
      - "respondent becomes eligible for /remove"

  # --- Credit Ledger ---
  - method: GET
    path: "/coop/members/{memberId}/credit-ledger"
    description: "List credit ledger entries for a member"
    roles: [CoopAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "entry_type?"]
    output: "CreditLedgerEntry[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role lacks permission for endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller is not the resource owner / claimer / sitter / mediator / referee required by the operation" }

  # --- Existence / state ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in the required state for the transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match parent entity's current version" }

  # --- Vetting / references ---
  - { id: ERR_INSUFFICIENT_REFERENCES, http: 409, condition: "Fewer than 2 PENDING (for submit-references) or ACCEPTED (for finalize-vetting) references" }
  - { id: ERR_RECIPROCITY_NOT_MET, http: 409, condition: "Mutual reference requirement not satisfied: each ACCEPTED reference needs its reverse pair ACCEPTED" }
  - { id: ERR_REFEREE_NOT_VETTED, http: 409, condition: "referee_member_id does not reference a VETTED member" }
  - { id: ERR_SELF_REFERENCE, http: 422, condition: "Self-dealing: referee==subject, claimer==owner, or mediator==initiator/respondent" }
  - { id: ERR_LIABILITY_NOT_ACCEPTED, http: 409, condition: "Member has not accepted the co-op liability agreement" }
  - { id: ERR_MEMBER_NOT_VETTED, http: 409, condition: "Operation requires vetting_status == VETTED" }
  - { id: ERR_MEDIATOR_INVALID, http: 409, condition: "mediator_member_id not VETTED or mediator_flag != true" }
  - { id: ERR_MEDIATOR_CONFLICT, http: 409, condition: "Mediator is initiator or respondent" }

  # --- Request / claim / assignment ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Field validation: missing required field, out-of-range value, malformed input" }
  - { id: ERR_PET_PROFILE_INVALID, http: 409, condition: "Pet profile inactive, or liability_waiver_accepted != true, or pet not owned by caller" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "Posting would push owner's credit_balance_hours below -MAX_OVERDRAFT_HOURS (-5.0)" }
  - { id: ERR_RELIABILITY_TOO_LOW, http: 409, condition: "Claimant's reliability_score < 30" }
  - { id: ERR_SITTER_OVERLAP, http: 409, condition: "Claimant has overlapping CONFIRMED/IN_PROGRESS assignment (half-open interval)" }
  - { id: ERR_ACCESS_NOT_HANDED_OFF, http: 409, condition: "CHECK_IN attempted before AccessHandoff HANDED_OFF" }
  - { id: ERR_HANDOFF_TOO_EARLY, http: 409, condition: "confirm-handoff before scheduled_start_at - 2h" }
  - { id: ERR_ENTRY_OUT_OF_WINDOW, http: 422, condition: "EntryLog occurred_at outside [scheduled_start_at - 30m, scheduled_end_at + 4h]" }
  - { id: ERR_NO_CHECKIN, http: 409, condition: "Checkout attempted without prior CHECK_IN" }
  - { id: ERR_UNRESOLVED_INCIDENT, http: 409, condition: "Settlement blocked by FILED/UNDER_REVIEW incident" }

  # --- Dispute / removal ---
  - { id: ERR_REMOVAL_CRITERIA_NOT_MET, http: 409, condition: "Member does not meet removal eligibility (no ESCALATED_REMOVAL dispute and < 2 RESOLVED_AT_FAULT incidents in 365d)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated applicant; can only submit a membership application"
    identity: opaque
    exclusive_operations:
      - "POST /coop/members — apply for membership"
    shared_operations: []

  - name: CoopAdmin
    description: "Co-op administrator; vets members, settles assignments, manages incidents/disputes/holiday windows"
    identity: opaque
    exclusive_operations:
      - "POST /coop/_clock/set_current_utc"
      - "POST /coop/members/{id}/submit-references"
      - "POST /coop/members/{id}/finalize-vetting"
      - "POST /coop/members/{id}/suspend"
      - "POST /coop/members/{id}/reinstate"
      - "POST /coop/members/{id}/remove"
      - "POST /coop/member-references/{id}/accept"
      - "POST /coop/member-references/{id}/reject"
      - "POST /coop/holiday-windows"
      - "POST /coop/holiday-windows/{id}/disable"
      - "POST /coop/sitting-assignments/{id}/settle"
      - "POST /coop/incidents/{id}/begin-review"
      - "POST /coop/incidents/{id}/resolve"
      - "POST /coop/incidents/{id}/dismiss"
      - "POST /coop/disputes/{id}/assign-mediator"
    shared_operations:
      - "GET /coop/members, /coop/members/{id}"
      - "POST /coop/members/{id}/references"
      - "GET /coop/members/{id}/references, /coop/member-references/{id}"
      - "GET /coop/members/{id}/pet-profiles, /coop/pet-profiles/{id}"
      - "GET /coop/holiday-windows, /coop/holiday-windows/{id}"
      - "GET /coop/sitting-requests, /coop/sitting-requests/{id}"
      - "GET /coop/sitting-requests/{id}/claims, /coop/sitting-claims/{id}"
      - "GET /coop/sitting-requests/{id}/assignment, /coop/sitting-assignments/{id}"
      - "GET /coop/sitting-assignments/{id}/access-handoff"
      - "GET /coop/sitting-assignments/{id}/entry-logs"
      - "GET /coop/sitting-assignments/{id}/incidents, /coop/incidents/{id}"
      - "GET /coop/disputes, /coop/disputes/{id}"
      - "GET /coop/members/{id}/credit-ledger"

  - name: Member
    description: "Vetted co-op member (or applicant, for accept-liability / reference-withdraw flows)"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /coop/members/{id}/accept-liability"
      - "POST /coop/member-references/{id}/withdraw"
      - "POST /coop/members/{id}/pet-profiles"
      - "POST /coop/pet-profiles/{id}/deactivate"
      - "POST /coop/sitting-requests"
      - "POST /coop/sitting-requests/{id}/cancel"
      - "POST /coop/sitting-requests/{id}/claims"
      - "POST /coop/sitting-requests/{id}/claims/{cid}/accept"
      - "POST /coop/sitting-requests/{id}/claims/{cid}/reject"
      - "POST /coop/sitting-requests/{id}/claims/{cid}/withdraw"
      - "POST /coop/sitting-assignments/{id}/checkout"
      - "POST /coop/sitting-assignments/{id}/entry-logs"
      - "POST /coop/sitting-assignments/{id}/incidents"
      - "POST /coop/access-handoffs/{id}/confirm-handoff"
      - "POST /coop/access-handoffs/{id}/confirm-return"
      - "POST /coop/access-handoffs/{id}/report-lost"
      - "PUT /coop/access-handoffs/{id}"
      - "POST /coop/disputes"
      - "POST /coop/disputes/{id}/resolve"
      - "POST /coop/disputes/{id}/escalate"
    shared_operations:
      - "GET /coop/members, /coop/members/{id}"
      - "POST /coop/members/{id}/references"
      - "GET /coop/members/{id}/references, /coop/member-references/{id}"
      - "GET /coop/members/{id}/pet-profiles, /coop/pet-profiles/{id}"
      - "GET /coop/holiday-windows, /coop/holiday-windows/{id}"
      - "GET /coop/sitting-requests, /coop/sitting-requests/{id}"
      - "GET /coop/sitting-requests/{id}/claims, /coop/sitting-claims/{id}"
      - "GET /coop/sitting-requests/{id}/assignment, /coop/sitting-assignments/{id}"
      - "GET /coop/sitting-assignments/{id}/access-handoff"
      - "GET /coop/sitting-assignments/{id}/entry-logs"
      - "GET /coop/sitting-assignments/{id}/incidents, /coop/incidents/{id}"
      - "GET /coop/disputes, /coop/disputes/{id}"
      - "GET /coop/members/{id}/credit-ledger"
