  - name: both_price_variants_produce_their_declared_totals_and_delta
    claim_type: dual_variant_calculation
    grounds:
    - calculations.order_total_assembly.variants
    - entities.Order.fields.price_variant_applied
    excluded_because:
      difficulty_instance: dual_variant_calc / order_price_provisional_vs_final_variant_divergence
      rationale: That instance drives one order through PROVISIONAL and FINAL with different install hours and a punch-list credit, asserting both totals and the delta on the switch — the full dual-variant
        claim for this layer.
  - name: a_deep_cascade_is_ordering_sensitive_across_entity_families
    claim_type: cascading_side_effects
    grounds:
    - state_machines.FirmwareRelease.ACTIVE_to_WITHDRAWN
    - state_machines.FirmwareCertification.CERTIFIED_to_REVOKED
    - calculations.asset_support_window
    - state_machines.PMProgram.ACTIVE_to_NEEDS_REVISION
    excluded_because:
      difficulty_instance: transitive_cascade / firmware_withdraw_cascade_six_levels
      rationale: That instance walks a single withdraw through six ordered levels across four entity families and asserts each hop, which is the ordering-sensitivity claim for this layer.
