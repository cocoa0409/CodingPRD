            - "ServiceAddress.${addr_d_id}.zone_state == IN_ZONE"
            - "Order.${ord_d2_id}.fee_tier == MID"
            - "Order.${ord_d2_id}.base_delivery_fee_cents == 549"
            - "Order.${ord_d2_id}.fee_waiver_pct == 50"
            - "Order.${ord_d2_id}.delivery_fee_cents == 275"
            - "Order.${ord_d2_id}.delivery_fee_cents != 200"
            - "Order.${ord_d2_id}.delivery_fee_cents != 350"
