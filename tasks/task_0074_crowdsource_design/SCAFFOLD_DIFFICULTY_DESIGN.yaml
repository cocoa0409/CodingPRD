scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: prize_withholding_resident_vs_non_resident
        grounds:
          - calculations.prize_withholding
          - entities.Designer.fields.tax_residency
          - entities.PrizePayment.fields.withholding_cents
          - entities.PrizePayment.fields.net_amount_cents
          - state_machines.Project.IN_FINAL_to_AWARDED
        distinguishing_aspect: |
          Operates on the PrizePayment fiscal domain. Same gross_amount_cents = 1_000_000
          yields withholding_cents = 200_000 when Designer.tax_residency=RESIDENT (flat 20%)
          but withholding_cents = 260_000 when NON_RESIDENT (tiered 20%/30% at 400_000 cents).
        test_recipe:
          setup:
            - "Seed two Designers D1 (tax_residency=RESIDENT) and D2 (tax_residency=NON_RESIDENT) both qualified for category LOGO."
            - "Seed two Projects P1 and P2 with identical brief, opens_at=2026-06-01T00:00:00Z, submission_deadline=2026-06-10T00:00:00Z, final_decision_deadline=2026-06-30T00:00:00Z, prize_pool_cents=1_000_000, single MAIN PrizeTier rank=1 gross_amount_cents=1_000_000."
            - "Run both projects through review and award D1 in P1 (RESIDENT) and D2 in P2 (NON_RESIDENT)."
          trigger:
            - "POST /projects/{P1}/award assigning the MAIN tier to D1's submission."
            - "POST /projects/{P2}/award assigning the MAIN tier to D2's submission."
          assert:
            - "PrizePayment created for P1's tier has gross_amount_cents == 1000000."
            - "PrizePayment created for P1's tier has withholding_cents == 200000."
            - "PrizePayment created for P1's tier has net_amount_cents == 800000."
            - "PrizePayment created for P2's tier has gross_amount_cents == 1000000."
            - "PrizePayment created for P2's tier has withholding_cents == 260000."
            - "PrizePayment created for P2's tier has net_amount_cents == 740000."
      - name: submission_originality_preliminary_vs_final
        grounds:
          - calculations.submission_originality_score
          - entities.Submission.fields.originality_score
          - entities.Submission.fields.originality_variant
          - state_machines.Submission.DRAFT_to_SCREENING
          - state_machines.Submission.ADVANCING_FINAL_to_WINNER
        distinguishing_aspect: |
          Operates on the Submission anti-plagiarism domain (distinct from prize_withholding's
          PrizePayment domain). Same asset_urls and public_sim=0.20 yield originality_score=80.00
          under PRELIMINARY_SCAN, but under FINAL_CROSSCHECK with peer_sim=0.50 yield
          originality_score=59.00 because peer_sim factors in via PEER_WEIGHT=0.70.
        test_recipe:
          setup:
            - "Seed Project P with three Designers; each submits a Submission whose mocked public_sim is 0.20."
            - "Two of the three submissions have mocked peer_sim=0.50 against each other."
          trigger:
            - "Drive POST /_clock/advance past submission_deadline to push all submissions DRAFT->SCREENING; preliminary scan completes (variant=PRELIMINARY_SCAN)."
            - "Run through the stages, advance both to FINAL, POST /projects/{P}/award assigning them MAIN and CONSOLATION tiers."
          assert:
            - "After SCREENING, each Submission.originality_score == 80.00 and originality_variant == 'PRELIMINARY_SCAN'."
            - "After AWARDED, winner Submission.originality_score == 59.00 and originality_variant == 'FINAL_CROSSCHECK'."
            - "Submission.originality_score on the final-rescored winner is strictly less than its prior PRELIMINARY_SCAN value."

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: aggregate_score_outlier_trim_with_client_weighting
        grounds:
          - calculations.submission_aggregate_score
          - entities.ReviewStage.fields.reviewer_quorum
          - entities.ReviewStage.fields.rubric
          - entities.Project.fields.client_participates_final
        distinguishing_aspect: |
          MODE (a): ≥3 inputs with non-linear interaction. The formula reads three entity-state
          inputs (assignment count n, stage_kind, client_participates_final) and selects
          structurally different branches: simple mean / trimmed mean / client-weighted blend.
          Branch boundary at n==5 (OUTLIER_TRIM_THRESHOLD) and at stage_kind==FINAL with
          client_participates_final=true must be pinned independently.
        test_recipe:
          setup:
            - "Seed Project P1 with client_participates_final=true and Project P2 with client_participates_final=false; both have rubric {a:50,b:50}; reviewer_quorum=3."
            - "Each project has Submission S in ADVANCING_FINAL; create 5 SUBMITTED reviewer ReviewAssignments with aggregated_score = [50, 70, 80, 90, 100]; on P1 add 1 Client ReviewAssignment with aggregated_score = 70."
          trigger:
            - "POST /review-stages/{P1.FINAL}/start-aggregation and POST /review-stages/{P2.FINAL}/start-aggregation."
          assert:
            - "P2.Submission.aggregate_score_by_stage['FINAL'] == 80.00 (computed: n=5 triggers trim; sorted [50,70,80,90,100], trimmed [70,80,90], mean=(70+80+90)/3=80.00)."
            - "P1.Submission.aggregate_score_by_stage['FINAL'] == 77.00 (computed: n=6 triggers trim on combined including client; sorted [50,70,70,80,90,100], trimmed [70,70,80,90]; remove client from trimmed -> reviewer subset [70,80,90] mean=80.00; client_score=70; weighted = 0.30*70 + 0.70*80.00 = 21.00 + 56.00 = 77.00)."
            - "77.00 != 80.00, confirming the client-weighting branch produces a strictly different aggregate from the standard trimmed-mean branch on the same reviewer scores."
      - name: assignment_score_rounding_order_pin
        grounds:
          - calculations.assignment_aggregated_score
          - entities.ReviewAssignment.fields.criterion_scores
          - entities.ReviewAssignment.fields.aggregated_score
          - entities.ReviewStage.fields.rubric
        distinguishing_aspect: |
          MODE (b): rounding-order pin. The formula sums full-precision per-criterion products
          and rounds ONCE at the end (round_half_up to 2 dp). With rubric {a:33, b:33, c:34}
          and integer scores {a:1, b:1, c:1}, the full-precision sum is 1*0.33 + 1*0.33 +
          1*0.34 = 1.00; with rubric {a:33.33, b:33.33, c:33.34} and scores {a:1, b:1, c:1},
          the full-precision sum is 0.3333 + 0.3333 + 0.3334 = 1.0000 -> 1.00, whereas if an
          implementation pre-rounded each per-criterion product to 2 dp first (0.33 + 0.33 +
          0.33 = 0.99) it would produce 0.99 — a different value for the same inputs. The
          scaffold pins round-once-at-end and asserts the divergent literal.
        test_recipe:
          setup:
            - "Seed rubric R = {creativity: 33.33, execution: 33.33, brief_fit: 33.34} (weights sum exactly to 100)."
            - "Create a single PENDING ReviewAssignment A on Submission S in PRELIMINARY stage; reviewer qualified, no conflict."
          trigger:
            - "POST /review-assignments/{A.id}/submit-scores with criterion_scores = {creativity: 1, execution: 1, brief_fit: 1}."
          assert:
            - "A.aggregated_score == 1.00 (computed: 1*(33.33/100) + 1*(33.33/100) + 1*(33.34/100) = 0.3333 + 0.3333 + 0.3334 = 1.0000, round_half_up to 2 dp = 1.00)."
            - "The alternative per-criterion-pre-round order would yield 0.99 (0.33 + 0.33 + 0.33), which differs from 1.00 — confirming the rounding-order pin is observable."

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: review_assignment_dispute_cycle
        grounds:
          - state_machines.ReviewAssignment.SUBMITTED_to_DISPUTED
          - state_machines.ReviewAssignment.DISPUTED_to_SUBMITTED
          - state_machines.ReviewAssignment.DISPUTED_to_VOIDED
        distinguishing_aspect: |
          Cyclic shape on the ReviewAssignment entity: a SUBMITTED assignment can be moved to
          DISPUTED by a SCORING_FAIRNESS dispute and then back to SUBMITTED when the dispute is
          REJECTED. The cycle is on ReviewAssignment, an entity different from PrizePayment
          (which carries the FAILED->SCHEDULED retry cycle).
        test_recipe:
          setup:
            - "Seed a stage in OPEN with a SUBMITTED ReviewAssignment A."
          trigger:
            - "POST /disputes with type=SCORING_FAIRNESS, subject_ref=A.id (cascade A SUBMITTED->DISPUTED)."
            - "POST /disputes/{id}/resolve outcome=REJECTED (cascade A DISPUTED->SUBMITTED)."
          assert:
            - "Before /disputes, A.status == 'SUBMITTED'."
            - "After /disputes filing, A.status == 'DISPUTED'."
            - "After /disputes/resolve outcome=REJECTED, A.status == 'SUBMITTED' (cycle closed)."
      - name: prize_payment_retry_cycle
        grounds:
          - state_machines.PrizePayment.PAYING_to_FAILED
          - state_machines.PrizePayment.FAILED_to_SCHEDULED
          - state_machines.PrizePayment.SCHEDULED_to_PAYING
        distinguishing_aspect: |
          Cyclic shape on the PrizePayment entity (different entity from ReviewAssignment):
          SCHEDULED -> PAYING -> FAILED -> SCHEDULED forms a closed loop traversable arbitrarily
          many times via /prize-payments/{id}/retry. ReviewAssignment cycle is dispute-driven;
          PrizePayment cycle is failure-retry driven — structurally distinct triggers.
        test_recipe:
          setup:
            - "Seed an AWARDED project with one PrizePayment PP in SCHEDULED."
            - "Linked CopyrightTransfer in REGISTERED."
          trigger:
            - "POST /prize-payments/{PP}/dispatch (SCHEDULED->PAYING)."
            - "POST /_events/emit event_type=PAYMENT_FAILED (PAYING->FAILED)."
            - "POST /prize-payments/{PP}/retry (FAILED->SCHEDULED)."
          assert:
            - "Status traversal observed exactly: 'SCHEDULED' -> 'PAYING' -> 'FAILED' -> 'SCHEDULED'."

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: award_to_copyright_to_payment_chain
        grounds:
          - state_machines.Project.IN_FINAL_to_AWARDED
          - state_machines.Submission.ADVANCING_FINAL_to_WINNER
          - state_machines.CopyrightTransfer
          - state_machines.PrizePayment
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger POST /projects/{id}/award:
          (A) Project status IN_FINAL->AWARDED → (B) Submission ADVANCING_FINAL->WINNER + auto-DRAFT
          a CopyrightTransfer → (C) auto-create a PrizePayment in SCHEDULED with
          gross/withholding/net pinned by prize_withholding. Each link is caused by the
          previous, not the original trigger: the PrizePayment is created because the
          CopyrightTransfer was drafted for the Submission that just became WINNER, not because
          /award directly creates payments.
        test_recipe:
          setup:
            - "Run a project through to IN_FINAL with one ADVANCING_FINAL Submission S, one MAIN PrizeTier, FINAL stage in AGGREGATING."
            - "Seed Designer of S with tax_residency=RESIDENT."
          trigger:
            - "POST /projects/{P}/award assigning the MAIN tier to S."
          assert:
            - "Project.status == 'AWARDED'."
            - "Submission.status == 'WINNER' (caused by award)."
            - "A CopyrightTransfer row exists with submission_id==S.id, status=='DRAFTED' (caused by Submission becoming WINNER)."
            - "A PrizePayment row exists with prize_tier_id matching the MAIN tier, status=='SCHEDULED', gross_amount_cents == PrizeTier.gross_amount_cents, and withholding_cents pinned (caused by the CopyrightTransfer existing for this Submission)."
      - name: dispute_uphold_to_copyright_void_to_payment_reverse_chain
        grounds:
          - state_machines.Dispute.MEDIATING_STAGE1_to_RESOLVED_UPHELD
          - state_machines.CopyrightTransfer.REGISTERED_to_VOIDED
          - state_machines.PrizePayment.PAID_to_REVERSED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger POST /disputes/{id}/resolve outcome=UPHELD
          (type=COPYRIGHT): (A) Dispute -> RESOLVED_UPHELD → (B) Linked CopyrightTransfer
          transitions to VOIDED (caused by the dispute outcome) → (C) Linked PrizePayment
          transitions PAID->REVERSED (caused by the CopyrightTransfer being voided, not by the
          dispute resolve directly). Originates from a dispute trigger, not the award trigger
          of the previous instance.
        test_recipe:
          setup:
            - "Drive the system to: Project AWARDED with one MAIN PrizeTier and Submission S as WINNER; CopyrightTransfer CT progressed all the way to REGISTERED via /issue-for-signing, sequential /sign calls, /register, and /_events/emit COPYRIGHT_REGISTERED."
            - "Drive PrizePayment PP to PAID via /prize-payments/{PP}/dispatch then /_events/emit PAYMENT_COMPLETED."
            - "File Dispute D with type=COPYRIGHT, subject_ref_kind=COPYRIGHT_TRANSFER, subject_ref_id=CT.id; POST /disputes/{D}/start-mediation."
          trigger:
            - "POST /disputes/{D}/resolve outcome=UPHELD."
          assert:
            - "Dispute.status == 'RESOLVED_UPHELD'."
            - "CopyrightTransfer.status == 'VOIDED' (caused by the upheld dispute)."
            - "PrizePayment.status == 'REVERSED' (caused by the CopyrightTransfer void cascade — depth 3 from the original /resolve trigger)."

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_modify_window_closed
        grounds:
          - validations[priority=5]
          - validations[priority=9]
        distinguishing_aspect: |
          Category pair: state (priority 5) vs business_temporal (priority 9). When a Submission
          is no longer in DRAFT (because preliminary screening completed and it advanced to
          ACCEPTED) AND now() is past modify_window_closes_at, a PATCH /submissions/{id} must
          return ERR_INVALID_STATE (priority 5 wins) rather than ERR_MODIFY_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Seed Submission S in status=ACCEPTED with modify_window_closes_at in the past."
          trigger:
            - "PATCH /submissions/{S.id} body { title: 'new' } as the owning Designer."
          assert:
            - "Response status_code == 409."
            - "Response error_id == 'ERR_INVALID_STATE' (NOT 'ERR_MODIFY_WINDOW_CLOSED')."
      - name: reviewer_conflict_beats_reviewer_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=14]
        distinguishing_aspect: |
          Category pair: business_safety (priority 7) vs business_constraint (priority 14). When
          POST /review-assignments is called with a reviewer who both (a) is in conflict_designer_ids
          with the Submission's designer AND (b) has already hit max_concurrent_assignments,
          the response MUST be ERR_REVIEWER_CONFLICT_OF_INTEREST — safety wins over capacity.
          This is a different error-category pair than the state-vs-temporal pair above.
        test_recipe:
          setup:
            - "Seed Designer Dx and Reviewer R with conflict_designer_ids=[Dx.id], max_concurrent_assignments=1, and 1 PENDING assignment elsewhere."
            - "Seed Submission S authored by Dx in PRELIMINARY stage."
          trigger:
            - "POST /review-assignments body { review_stage_id, submission_id: S.id, reviewer_id: R.reviewer_id } as PlatformOps."
          assert:
            - "Response status_code == 422."
            - "Response error_id == 'ERR_REVIEWER_CONFLICT_OF_INTEREST' (NOT 'ERR_REVIEWER_CAPACITY_EXCEEDED')."

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: passing_threshold_at_exact_boundary
        grounds:
          - state_machines.Submission.ACCEPTED_to_ADVANCING_SEMIFINAL
          - state_machines.Submission.ACCEPTED_to_ELIMINATED
          - entities.ReviewStage.fields.passing_threshold
        distinguishing_aspect: |
          Numeric threshold boundary on Submission.aggregate_score_by_stage[PRELIMINARY] versus
          ReviewStage.passing_threshold using `>=`. A Submission whose aggregated score equals
          the threshold exactly MUST advance, not be eliminated. Reachable via POST
          /review-stages/{id}/publish.
        test_recipe:
          setup:
            - "Seed PRELIMINARY stage with passing_threshold = 75.00."
            - "Seed Submission S with exactly 3 SUBMITTED ReviewAssignments whose aggregated_scores yield mean = 75.00 (e.g., 70, 75, 80)."
          trigger:
            - "POST /review-stages/{PRELIMINARY.id}/start-aggregation."
            - "POST /review-stages/{PRELIMINARY.id}/publish."
          assert:
            - "Submission.aggregate_score_by_stage['PRELIMINARY'] == 75.00."
            - "Submission.status == 'ADVANCING_SEMIFINAL' (because 75.00 >= 75.00)."
            - "If the same scenario is rerun with mean=74.99, the Submission ends in 'ELIMINATED'."
      - name: empty_advancing_list_after_publish
        grounds:
          - state_machines.ReviewStage.AGGREGATING_to_PUBLISHED
          - entities.ReviewStage.fields.advancing_submission_ids
          - entities.Submission.fields.aggregate_score_by_stage
        distinguishing_aspect: |
          Empty-set boundary on a different metric and reached via a different endpoint than the
          numeric-threshold case above. When ALL in-stage Submissions score below
          passing_threshold, ReviewStage.advancing_submission_ids must be the empty array []
          (not null, not omitted), and every Submission must transition to ELIMINATED.
        test_recipe:
          setup:
            - "Seed PRELIMINARY stage with passing_threshold = 95.00 and 2 in-stage Submissions whose aggregated scores compute to 60.00 and 70.00."
          trigger:
            - "POST /review-stages/{PRELIMINARY.id}/start-aggregation; POST /review-stages/{PRELIMINARY.id}/publish."
          assert:
            - "ReviewStage.advancing_submission_ids == []."
            - "Both Submissions transition to 'ELIMINATED'."
            - "ReviewStage.status == 'PUBLISHED'."

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: prize_payment_dispatch_requires_copyright_registered
        grounds:
          - state_machines.PrizePayment.SCHEDULED_to_PAYING
          - validations[priority=19]
          - state_machines.CopyrightTransfer.REGISTERING_to_REGISTERED
        distinguishing_aspect: |
          Entity pair: PrizePayment depends on CopyrightTransfer state. PrizePayment.SCHEDULED
          ->PAYING is gated on the linked CopyrightTransfer.status == REGISTERED. Attempting
          dispatch with any earlier CopyrightTransfer state returns ERR_COPYRIGHT_NOT_REGISTERED.
        test_recipe:
          setup:
            - "AWARDED project with PrizePayment PP in SCHEDULED and linked CopyrightTransfer in ALL_SIGNED (not yet REGISTERED)."
          trigger:
            - "POST /prize-payments/{PP.id}/dispatch."
          assert:
            - "Response status_code == 422."
            - "Response error_id == 'ERR_COPYRIGHT_NOT_REGISTERED'."
            - "When CopyrightTransfer is moved to REGISTERED via /register + /_events/emit COPYRIGHT_REGISTERED and dispatch is retried, PrizePayment.status == 'PAYING'."
      - name: project_award_requires_no_disputed_assignment
        grounds:
          - state_machines.Project.IN_FINAL_to_AWARDED
          - state_machines.ReviewAssignment.SUBMITTED_to_DISPUTED
          - concurrency_rules[dispute_pending]
          - errors.ERR_DISPUTE_PENDING
        distinguishing_aspect: |
          Different entity pair: Project depends on ReviewAssignment state. Project.IN_FINAL
          ->AWARDED is rejected if any ReviewAssignment in the FINAL stage is currently in
          DISPUTED. This pair is Project↔ReviewAssignment, structurally distinct from the
          PrizePayment↔CopyrightTransfer pair above.
        test_recipe:
          setup:
            - "Project in IN_FINAL, FINAL stage in AGGREGATING."
            - "One ReviewAssignment in FINAL stage transitioned to DISPUTED via an active SCORING_FAIRNESS Dispute."
          trigger:
            - "POST /projects/{P.id}/award."
          assert:
            - "Response status_code == 409."
            - "Response error_id == 'ERR_DISPUTE_PENDING'."
            - "Project.status remains 'IN_FINAL'."

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stage_intervals_half_open_no_overlap
        grounds:
          - validations[priority=12]
          - entities.ReviewStage.fields.starts_at
          - entities.ReviewStage.fields.ends_at
          - errors.ERR_STAGE_OVERLAP
        distinguishing_aspect: |
          Interval semantics: half-open [starts_at, ends_at) on ReviewStage resource. Adjacency
          is permitted (PRELIMINARY.ends_at == SEMIFINAL.starts_at is legal because the first is
          exclusive at the boundary), but any positive overlap is rejected. Resource = ReviewStage.
        test_recipe:
          setup:
            - "Seed Project P in DRAFT."
          trigger:
            - "POST /projects/{P}/review-stages stage_kind=PRELIMINARY starts_at=T1, ends_at=T2."
            - "POST /projects/{P}/review-stages stage_kind=SEMIFINAL starts_at=T2, ends_at=T3 (adjacency)."
            - "Then attempt POST /projects/{P}/review-stages stage_kind=FINAL starts_at=T2-1h, ends_at=T3+1h (positive overlap with SEMIFINAL)."
          assert:
            - "First two POSTs return 201."
            - "Third POST returns status_code == 422 and error_id == 'ERR_STAGE_OVERLAP'."
      - name: project_min_gap_intervals_aggregate
        grounds:
          - validations[priority=11]
          - entities.Project.fields.opens_at
          - entities.Project.fields.submission_deadline
          - entities.Project.fields.final_decision_deadline
          - errors.ERR_TIMELINE_TOO_TIGHT
        distinguishing_aspect: |
          Different interval semantics: minimum-gap (aggregate-capacity-like) constraints on
          Project intervals — submission_deadline >= opens_at + 72h AND final_decision_deadline
          >= submission_deadline + 168h. Resource = Project (not ReviewStage). Interval-overlap
          adjacency is irrelevant here; what's enforced is a minimum SEPARATION (≥ a fixed
          duration) between two endpoints on the same resource.
        test_recipe:
          setup:
            - "Authenticated Client."
          trigger:
            - "POST /projects body with opens_at=2026-06-01T00:00:00Z, submission_deadline=2026-06-03T00:00:00Z (only 48h gap), final_decision_deadline=2026-06-15T00:00:00Z."
          assert:
            - "Response status_code == 422 and error_id == 'ERR_TIMELINE_TOO_TIGHT'."
            - "When submission_deadline is shifted to 2026-06-04T00:00:00Z (72h gap exactly) the same POST returns 201."

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: prize_pool_conservation_through_void_and_reverse
        grounds:
          - state_machines.CopyrightTransfer.REGISTERED_to_VOIDED
          - state_machines.PrizePayment.PAID_to_REVERSED
          - calculations.prize_withholding
          - entities.Project.fields.prize_pool_cents
        distinguishing_aspect: |
          Conserved quantity: aggregate cents committed from the platform to designers, expressed
          as INVARIANT_A = sum(PrizePayment.net_amount_cents WHERE status=='PAID') for a project.
          After a forward award + payment, and then a compensating CopyrightTransfer.VOIDED
          cascade reversing the payment, INVARIANT_A must return to 0 (the same value it had
          before /award). Pinned formula: sum over PrizePayment rows in PAID status.
        test_recipe:
          setup:
            - "Record INVARIANT_A_before = sum(PrizePayment.net_amount_cents WHERE project_id==P, status=='PAID') == 0 prior to /award."
            - "Run /award + /sign + /register + /dispatch + /_events/emit PAYMENT_COMPLETED so a PrizePayment for P reaches PAID."
            - "File an UPHELD COPYRIGHT dispute against the CopyrightTransfer."
          trigger:
            - "POST /disputes/{D}/resolve outcome=UPHELD."
          assert:
            - "Immediately after PAYMENT_COMPLETED, INVARIANT_A == PrizePayment.net_amount_cents > 0."
            - "After dispute resolution cascades CopyrightTransfer->VOIDED and PrizePayment->REVERSED, sum(PrizePayment.net_amount_cents WHERE status=='PAID') == 0 == INVARIANT_A_before (compensating-action conservation)."
      - name: trust_score_conservation_through_screen_reject_and_dispute_reject
        grounds:
          - state_machines.Submission.SCREENING_to_SCREEN_REJECTED
          - state_machines.Dispute.MEDIATING_STAGE1_to_RESOLVED_UPHELD
          - entities.Designer.fields.trust_score
          - calculations.submission_originality_score
        distinguishing_aspect: |
          Different conserved quantity (Designer.trust_score, in [0,100], not cents):
          INVARIANT_B = Designer.trust_score before vs after. A forward
          SCREENING->SCREEN_REJECTED applies penalty TRUST_PENALTY_ON_REJECT; if the designer
          files a PLAGIARISM dispute (mistakenly flagged) and the platform resolves UPHELD in
          the designer's favor, the screening must be undone and Designer.trust_score restored
          to its pre-screen value. Pinned formula: trust_score equality before forward and
          after compensation.
        test_recipe:
          setup:
            - "Seed Designer D with trust_score=100.00; project P with one Submission S that triggers SCREEN_REJECTED on preliminary scan."
          trigger:
            - "Drive Submission S DRAFT->SCREENING->SCREEN_REJECTED; record Designer.trust_score after the penalty."
            - "Designer files Dispute Dx type=PLAGIARISM subject_ref=S."
            - "POST /disputes/{Dx}/resolve outcome=UPHELD."
          assert:
            - "Designer.trust_score after SCREEN_REJECTED < 100.00 (penalty applied)."
