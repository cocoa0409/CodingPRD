              captures: { single_id: "$.data.id", single_tax: "$.data.tax_total_cents", single_basis: "$.data.srp_basis_cents", single_total: "$.data.total_due_cents" }
          assert:
            - "split_basis == 2000 and single_basis == 2000 (identical srp basis)"
            - "split_tax == 166 (each line rounds rhu(1000 * 825 / 10000) = 83, then the lines sum)"
            - "single_tax == 165 (one basis of 2000 rounds once: rhu(165.0) = 165)"
            - "split_tax - single_tax == 1"
