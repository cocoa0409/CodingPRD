  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_activation_gated_by_governing_grant_posture
        grounds:
          - state_machines.Enrollment.SUSPENDED_to_ACTIVE
          - state_machines.Grant.OPEN_to_FROZEN
          - validations[priority=4]
          - errors[ERR_GRANT_FROZEN]
