# =============================================================================
# Scaffold: Surety Bond Underwriting (task_0427)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  427. Surety Bond Underwriting: bond type (bid/performance/payment,
  license/permit, fidelity), principal credit & indemnity agreement, penal sum
  & premium rate, single/aggregate program limit, bond issuance &
  power-of-attorney, claim investigation & loss, renewal/rider, reinsurance
  treaty cession

domain_name: surety-bond-underwriting
api_prefix: /surety

# -----------------------------------------------------------------------------
# §0 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation     # underwriting submission -> referral -> approval, with indemnity quorum
  secondary_archetype: quota_allocation          # single/aggregate program limits compete for finite treaty + program capacity
  complexity_layers:
    - dual_variant_calculation                   # premium quoted (annual) vs earned-on-cancel (pro-rata vs short-rate); loss reserve case vs IBNR
    - cascading_side_effects                      # claim -> bond -> program exposure -> treaty cession chains
    - rate_threshold_triggers                     # facultative-referral threshold on penal sum; aggregate-limit breakpoints; credit-tier rate selection
    - optimistic_concurrency                      # CREATE-with-supersede of a Bond's renewal against a stale Bond version

  entity_topology: flat                          # peer entities linked by FK fields in bodies; no nested ownership URLs
  state_machine_shape: branching                 # underwriting fork (APPROVE/DECLINE/REFER), claim fork (PAY/DENY); renewal re-opens a new cycle
  relationship_patterns:
    - one_to_many                                 # Principal -> BondApplication, Bond -> Claim/Rider/Cession
    - many_to_many                                # Bond <-> ReinsuranceTreaty via Cession junction
    - cross_aggregate                             # Claim mutates Program exposure and Treaty ceded balances
  role_model: segregation_of_duties              # underwriter cannot also approve referrals above their authority; claims examiner is distinct from underwriter
  consistency_model: immediate                   # all cascades atomic within a single request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SuretyProgram
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Program / line-of-business name" }
      - { name: single_limit_cents, type: integer, source: input, description: "Maximum penal sum (in cents) any single Bond bound under this program may carry" }
      - { name: aggregate_limit_cents, type: integer, source: input, description: "Maximum total NET retained penal sum (in cents) across all ACTIVE bonds bound to this program" }
      - { name: referral_threshold_cents, type: integer, source: input, description: "Penal sum (in cents) at or above which a BondApplication must be REFERRED before approval" }
      - { name: loss_alert_threshold_cents, type: integer, source: input, description: "Cumulative incurred-loss (in cents) across this program's bonds at or above which the program auto-SUSPENDS; independent of aggregate_limit_cents" }
      - { name: aggregate_committed_cents, type: integer, source: computed, default: 0, description: "Sum of net_retained_cents over all ACTIVE Bonds whose program_id is this program" }
      - { name: aggregate_available_cents, type: integer, source: computed, description: "aggregate_limit_cents - aggregate_committed_cents" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SUSPENDED — SUSPENDED programs reject new bind/approve operations", constraints: "OPEN, SUSPENDED" }

  - name: Principal
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Principal business legal name" }
      - { name: credit_score, type: integer, source: input, description: "Underwriting credit score 300-850" }
      - { name: working_capital_cents, type: integer, source: input, description: "Reported working capital in cents (may be negative)" }
      - { name: credit_tier, type: enum, source: computed, description: "PREFERRED | STANDARD | SUBSTANDARD — derived from credit_score and working_capital_cents", constraints: "PREFERRED, STANDARD, SUBSTANDARD" }
      - { name: indemnity_on_file, type: boolean, source: computed, default: false, description: "True iff at least one EXECUTED IndemnityAgreement references this principal" }

  - name: IndemnityAgreement
    parent: null
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id; the indemnifying principal" }
      - { name: indemnitor_count, type: integer, source: input, description: "Number of personal/corporate indemnitors signing the GIA" }
      - { name: required_signature_count, type: integer, source: input, description: "Number of signatures that must be collected for the GIA to execute" }
      - { name: collected_signature_count, type: integer, source: computed, default: 0, description: "Signatures collected so far via the add-signature endpoint" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> EXECUTED | VOIDED", constraints: "PENDING, EXECUTED, VOIDED" }

  - name: BondApplication
    parent: null
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id; applicant" }
      - { name: program_id, type: string, source: input, description: "FK -> SuretyProgram.id; the program the bond would bind to" }
      - { name: bond_type, type: enum, source: input, description: "BID | PERFORMANCE | PAYMENT | LICENSE_PERMIT | FIDELITY", constraints: "BID, PERFORMANCE, PAYMENT, LICENSE_PERMIT, FIDELITY" }
      - { name: requested_penal_sum_cents, type: integer, source: input, description: "Requested penal sum (bond limit) in cents" }
      - { name: term_months, type: integer, source: input, description: "Bond term length in months (used for short-rate / pro-rata math)" }
      - { name: quoted_premium_rate_bps, type: integer, source: computed, description: "Premium rate in basis points selected from credit_tier x bond_type at submit" }
      - { name: quoted_premium_cents, type: integer, source: computed, description: "Annual premium in cents = round_half_up(requested_penal_sum_cents * quoted_premium_rate_bps / 10000)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> {APPROVED | DECLINED | REFERRED}; REFERRED -> {APPROVED | DECLINED}; APPROVED -> BOUND", constraints: "DRAFT, SUBMITTED, REFERRED, APPROVED, DECLINED, BOUND" }
      - { name: decline_reason, type: enum, source: input, required: false, description: "OBLIGEE_INELIGIBLE | CREDIT | CAPACITY | OTHER — set on decline", constraints: "OBLIGEE_INELIGIBLE, CREDIT, CAPACITY, OTHER" }

  - name: Bond
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> BondApplication.id; the application this bond was bound from" }
      - { name: principal_id, type: string, source: system, description: "FK -> Principal.id; copied from the application" }
      - { name: program_id, type: string, source: system, description: "FK -> SuretyProgram.id; copied from the application" }
      - { name: superseded_by_bond_id, type: string, source: system, required: false, description: "FK -> Bond.id; on renewal, the new Bond that replaced this one" }
      - { name: bond_type, type: enum, source: system, description: "Copied from the application", constraints: "BID, PERFORMANCE, PAYMENT, LICENSE_PERMIT, FIDELITY" }
      - { name: penal_sum_cents, type: integer, source: system, description: "Penal sum (bond limit) bound, copied from application.requested_penal_sum_cents" }
      - { name: term_months, type: integer, source: system, description: "Bond term copied from application" }
      - { name: power_of_attorney_number, type: string, source: system, description: "Server-minted POA serial stamped at issuance; null until issuance" }
      - { name: premium_rate_bps, type: integer, source: system, description: "Premium rate copied from application.quoted_premium_rate_bps" }
      - { name: written_premium_cents, type: integer, source: system, description: "Annual written premium copied from application.quoted_premium_cents" }
      - { name: earned_premium_cents, type: integer, source: computed, default: 0, description: "Premium earned to date; set on cancellation per pro-rata or short-rate variant" }
      - { name: ceded_penal_sum_cents, type: integer, source: computed, default: 0, description: "Sum of ceded_penal_sum_cents over ACTIVE Cessions whose bond_id is this bond" }
      - { name: net_retained_cents, type: integer, source: computed, description: "penal_sum_cents - ceded_penal_sum_cents; the program-charged exposure" }
      - { name: incurred_loss_cents, type: integer, source: computed, default: 0, description: "Sum of paid_loss_cents over SETTLED Claims plus reserve_cents over OPEN/INVESTIGATING Claims on this bond" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED -> ACTIVE -> {RENEWED | CANCELLED | EXPIRED}; CLAIMED is a flag-state reachable from ACTIVE", constraints: "ISSUED, ACTIVE, RENEWED, CANCELLED, EXPIRED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: bond_id, type: string, source: input, description: "FK -> Bond.id; the bond the claim is filed against" }
      - { name: claimant_name, type: string, source: input, description: "Obligee / claimant filing the claim" }
      - { name: demand_cents, type: integer, source: input, description: "Amount demanded by the claimant in cents" }
      - { name: reserve_cents, type: integer, source: input, description: "Case loss reserve in cents set at filing; updated on investigation" }
      - { name: paid_loss_cents, type: integer, source: input, required: false, description: "Loss actually paid in cents; set on settle" }
      - { name: salvage_cents, type: integer, source: input, required: false, default: 0, description: "Recovery from indemnitors/collateral applied at settle" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED -> INVESTIGATING -> {PAID | DENIED}; PAID/DENIED terminal", constraints: "FILED, INVESTIGATING, PAID, DENIED" }

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - { name: bond_id, type: string, source: input, description: "FK -> Bond.id; the bond being endorsed" }
      - { name: rider_type, type: enum, source: input, description: "INCREASE | DECREASE | NAME_CHANGE — the kind of endorsement", constraints: "INCREASE, DECREASE, NAME_CHANGE" }
      - { name: penal_sum_delta_cents, type: integer, source: input, required: false, default: 0, description: "Signed change to the bond penal sum (positive for INCREASE, negative for DECREASE, 0 for NAME_CHANGE)" }
      - { name: additional_premium_cents, type: integer, source: computed, default: 0, description: "Pro-rated additional premium charged for an INCREASE rider; 0 otherwise" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> {APPLIED | REJECTED}; terminal at APPLIED/REJECTED", constraints: "DRAFT, APPLIED, REJECTED" }

  - name: ReinsuranceTreaty
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Treaty name" }
      - { name: cession_pct_bps, type: integer, source: input, description: "Quota-share cession percentage in basis points (e.g. 3000 = 30%) applied to each ceded bond's penal sum" }
      - { name: treaty_capacity_cents, type: integer, source: input, description: "Maximum total ceded penal sum (in cents) the treaty will accept across ACTIVE cessions" }
      - { name: ceded_committed_cents, type: integer, source: computed, default: 0, description: "Sum of ceded_penal_sum_cents over ACTIVE Cessions whose treaty_id is this treaty" }
      - { name: ceded_available_cents, type: integer, source: computed, description: "treaty_capacity_cents - ceded_committed_cents" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED — CLOSED treaties reject new cessions", constraints: "OPEN, CLOSED" }

  - name: Cession
    parent: null
    common_fields: true
    fields:
      - { name: bond_id, type: string, source: input, description: "FK -> Bond.id; the bond whose penal sum is partly ceded" }
      - { name: treaty_id, type: string, source: input, description: "FK -> ReinsuranceTreaty.id; the treaty accepting the cession" }
      - { name: ceded_penal_sum_cents, type: integer, source: computed, description: "round_half_up(bond.penal_sum_cents * treaty.cession_pct_bps / 10000) computed at creation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> RECAPTURED; RECAPTURED terminal", constraints: "ACTIVE, RECAPTURED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SuretyProgram
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /surety/programs/{id}/suspend OR system (cumulative incurred loss >= loss_alert_threshold_cents)"
        actor: SeniorUnderwriter
        preconditions:
          - "program.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "status -> SUSPENDED; subsequent submit/approve/bind on this program are rejected (ERR_PROGRAM_SUSPENDED)"
        note: "Also entered automatically as the terminal hop of the claim-settle-PAY cascade when program incurred loss reaches the loss-alert threshold."

  - entity: ReinsuranceTreaty
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /surety/treaties/{id}/close"
        actor: SeniorUnderwriter
        preconditions:
          - "treaty.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "status -> CLOSED; new cessions to this treaty are rejected (ERR_TREATY_CLOSED). Existing ACTIVE cessions are unaffected."

  - entity: IndemnityAgreement
    initial_state: PENDING
    terminal_states: [EXECUTED, VOIDED]
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /surety/indemnity-agreements/{id}/sign"
        actor: Underwriter
        preconditions:
          - "agreement.status == PENDING (ERR_INVALID_STATE)"
          - "collected_signature_count + 1 < required_signature_count (otherwise the executing transition below applies)"
        side_effects:
          - "collected_signature_count increases by 1"
        note: "Self-loop while more than one signature still remains; does not change status."
      - from: PENDING
        to: EXECUTED
        trigger: "POST /surety/indemnity-agreements/{id}/sign"
        actor: Underwriter
        preconditions:
          - "agreement.status == PENDING (ERR_INVALID_STATE)"
          - "collected_signature_count + 1 == required_signature_count (otherwise self-loop above applies)"
        side_effects:
          - "collected_signature_count increases by 1 reaching required_signature_count"
          - "status -> EXECUTED"
          - "Principal.indemnity_on_file recomputed to true (cross-entity)"
        note: "The signature that reaches required_signature_count executes the GIA."
      - from: PENDING
        to: VOIDED
        trigger: "POST /surety/indemnity-agreements/{id}/void"
        actor: Underwriter
        preconditions:
          - "agreement.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOIDED"

  - entity: BondApplication
    initial_state: DRAFT
    terminal_states: [DECLINED, BOUND]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /surety/applications/{id}/submit"
        actor: Underwriter
        preconditions:
          - "application.status == DRAFT (ERR_INVALID_STATE)"
          - "Principal.indemnity_on_file == true for application.principal_id (ERR_INDEMNITY_REQUIRED) [cross-entity: Principal]"
          - "SuretyProgram.status == OPEN for application.program_id (ERR_PROGRAM_SUSPENDED) [cross-entity: SuretyProgram]"
        side_effects:
          - "quoted_premium_rate_bps computed via premium_rating (credit_tier x bond_type)"
          - "quoted_premium_cents computed via premium_rating"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /surety/applications/{id}/approve"
        actor: Underwriter
        preconditions:
          - "application.status == SUBMITTED (ERR_INVALID_STATE)"
          - "requested_penal_sum_cents < SuretyProgram.referral_threshold_cents (else must be REFERRED first: ERR_REFERRAL_REQUIRED)"
          - "requested_penal_sum_cents <= SuretyProgram.single_limit_cents (ERR_SINGLE_LIMIT_EXCEEDED)"
        side_effects:
          - "status -> APPROVED"
      - from: SUBMITTED
        to: REFERRED
        trigger: "POST /surety/applications/{id}/refer"
        actor: Underwriter
        preconditions:
          - "application.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REFERRED"
        note: "Referral hands authority to a Senior underwriter; large penal sums require this path."
      - from: REFERRED
        to: APPROVED
        trigger: "POST /surety/applications/{id}/approve"
        actor: SeniorUnderwriter
        preconditions:
          - "application.status == REFERRED (ERR_INVALID_STATE)"
          - "requested_penal_sum_cents <= SuretyProgram.single_limit_cents (ERR_SINGLE_LIMIT_EXCEEDED)"
        side_effects:
          - "status -> APPROVED"
        note: "Only SeniorUnderwriter may approve a REFERRED application (segregation of duties)."
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /surety/applications/{id}/decline"
        actor: Underwriter
        preconditions:
          - "application.status in {SUBMITTED, REFERRED} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DECLINED"
          - "decline_reason recorded from request body"
      - from: REFERRED
        to: DECLINED
        trigger: "POST /surety/applications/{id}/decline"
        actor: SeniorUnderwriter
        preconditions:
          - "application.status in {SUBMITTED, REFERRED} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DECLINED"
          - "decline_reason recorded from request body"
      - from: APPROVED
        to: BOUND
        trigger: "POST /surety/bonds (binds the approved application)"
        actor: Underwriter
        preconditions:
          - "application.status == APPROVED (ERR_INVALID_STATE)"
          - "SuretyProgram.status == OPEN (ERR_PROGRAM_SUSPENDED) [cross-entity: SuretyProgram]"
          - "requested_penal_sum_cents <= SuretyProgram.aggregate_available_cents (ERR_AGGREGATE_LIMIT_EXCEEDED) [cross-entity: SuretyProgram]"
        side_effects:
          - "status -> BOUND"
          - "A new Bond is created in ISSUED state copying penal_sum/rate/premium (cross-entity: Bond)"
          - "SuretyProgram.aggregate_committed_cents increases by the new Bond.net_retained_cents (= penal_sum at issuance, 0 ceded) (cross-entity: SuretyProgram)"

  - entity: Bond
    initial_state: ISSUED
    terminal_states: [RENEWED, CANCELLED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /surety/bonds/{id}/issue (stamp power-of-attorney)"
        actor: Underwriter
        preconditions:
          - "bond.status == ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "power_of_attorney_number minted and stamped on the bond"
          - "status -> ACTIVE"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /surety/bonds/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "bond.status == ACTIVE (ERR_INVALID_STATE)"
          - "no Claim on this bond is in {FILED, INVESTIGATING} (ERR_OPEN_CLAIM_EXISTS) [cross-entity: Claim]"
        side_effects:
          - "earned_premium_cents computed via premium_earning (pro-rata or short-rate variant from cancel_mode)"
          - "All ACTIVE Cessions on this bond -> RECAPTURED; each treaty.ceded_committed_cents decremented (cascade, cross-entity: Cession then ReinsuranceTreaty)"
          - "SuretyProgram.aggregate_committed_cents decremented by this bond's net_retained_cents BEFORE recapture (cross-entity: SuretyProgram)"
          - "status -> CANCELLED"
        note: "Cancel decrements program exposure by net_retained measured before cessions are recaptured."
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /surety/bonds/{id}/renew (CREATE-with-supersede; requires expected_bond_version)"
        actor: Underwriter
        preconditions:
          - "bond.status == ACTIVE (ERR_INVALID_STATE)"
          - "expected_bond_version == bond.version (ERR_STALE_VERSION, 412) [OCC]"
          - "SuretyProgram.aggregate_available_cents >= bond.penal_sum_cents (ERR_AGGREGATE_LIMIT_EXCEEDED) [cross-entity: SuretyProgram]"
        side_effects:
          - "A new successor Bond is created in ISSUED state copying penal_sum/rate/term (cross-entity: Bond)"
          - "this bond.superseded_by_bond_id set to the successor; status -> RENEWED"
          - "SuretyProgram.aggregate_committed_cents: the predecessor's net_retained_cents is released and the successor's penal_sum_cents is committed (cross-entity: SuretyProgram)"
        note: "Renewal supersedes the prior bond; aggregate exposure shifts predecessor->successor net of any prior cessions."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /surety/bonds/{id}/expire"
        actor: Underwriter
        preconditions:
          - "bond.status == ACTIVE (ERR_INVALID_STATE)"
          - "no Claim on this bond is in {FILED, INVESTIGATING} (ERR_OPEN_CLAIM_EXISTS) [cross-entity: Claim]"
        side_effects:
          - "earned_premium_cents set equal to written_premium_cents (fully earned at natural expiry)"
          - "All ACTIVE Cessions on this bond -> RECAPTURED; each treaty.ceded_committed_cents decremented (cascade)"
          - "SuretyProgram.aggregate_committed_cents decremented by this bond's net_retained_cents (before recapture)"
          - "status -> EXPIRED"

  - entity: Claim
    initial_state: FILED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FILED
        to: INVESTIGATING
        trigger: "POST /surety/claims/{id}/investigate"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == FILED (ERR_INVALID_STATE)"
          - "Bond.status == ACTIVE for claim.bond_id (ERR_INVALID_STATE) [cross-entity: Bond]"
        side_effects:
          - "reserve_cents updated from request body"
          - "Bond.incurred_loss_cents recomputed (cross-entity: Bond)"
      - from: INVESTIGATING
        to: PAID
        trigger: "POST /surety/claims/{id}/settle (outcome=PAY)"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == INVESTIGATING (ERR_INVALID_STATE)"
          - "paid_loss_cents present and paid_loss_cents <= Bond.penal_sum_cents (ERR_LOSS_EXCEEDS_PENAL_SUM) [cross-entity: Bond]"
        side_effects:
          - "paid_loss_cents and salvage_cents recorded; status -> PAID"
          - "Bond.incurred_loss_cents recomputed: reserve removed, net paid loss (paid_loss_cents - salvage_cents) added (cross-entity: Bond)"
          - "Program cumulative incurred loss recomputed (sum of incurred_loss_cents over the program's bonds); if it is >= SuretyProgram.loss_alert_threshold_cents the SuretyProgram.status -> SUSPENDED (cascade: Bond -> SuretyProgram)"
      - from: INVESTIGATING
        to: DENIED
        trigger: "POST /surety/claims/{id}/settle (outcome=DENY)"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == INVESTIGATING (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DENIED"
          - "Bond.incurred_loss_cents recomputed: this claim's reserve removed, nothing added (cross-entity: Bond)"

  - entity: Rider
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /surety/riders/{id}/apply"
        actor: Underwriter
        preconditions:
          - "rider.status == DRAFT (ERR_INVALID_STATE)"
          - "Bond.status == ACTIVE for rider.bond_id (ERR_INVALID_STATE) [cross-entity: Bond]"
          - "no Claim on the bond is in {FILED, INVESTIGATING} (ERR_OPEN_CLAIM_EXISTS) [cross-entity: Claim]"
          - "For INCREASE: bond.penal_sum_cents + penal_sum_delta_cents <= SuretyProgram.single_limit_cents (ERR_SINGLE_LIMIT_EXCEEDED) [cross-entity: SuretyProgram]"
          - "For INCREASE: penal_sum_delta_cents <= SuretyProgram.aggregate_available_cents (ERR_AGGREGATE_LIMIT_EXCEEDED) [cross-entity: SuretyProgram]"
        side_effects:
          - "additional_premium_cents computed via rider_premium for INCREASE riders (pro-rata over remaining term)"
          - "Bond.penal_sum_cents adjusted by penal_sum_delta_cents; net_retained_cents recomputed (cross-entity: Bond)"
          - "SuretyProgram.aggregate_committed_cents adjusted by the change in Bond.net_retained_cents (cross-entity: SuretyProgram)"
          - "status -> APPLIED"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /surety/riders/{id}/reject"
        actor: Underwriter
        preconditions:
          - "rider.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED"

  - entity: Cession
    initial_state: ACTIVE
    terminal_states: [RECAPTURED]
    transitions:
      - from: ACTIVE
        to: RECAPTURED
        trigger: "POST /surety/cessions/{id}/recapture"
        actor: Underwriter
        preconditions:
          - "cession.status == ACTIVE (ERR_INVALID_STATE)"
          - "Bond.status == ACTIVE for cession.bond_id (ERR_INVALID_STATE) [cross-entity: Bond]"
        side_effects:
          - "ReinsuranceTreaty.ceded_committed_cents decremented by cession.ceded_penal_sum_cents (cross-entity: ReinsuranceTreaty)"
          - "Bond.ceded_penal_sum_cents recomputed; Bond.net_retained_cents increases (cross-entity: Bond)"
          - "SuretyProgram.aggregate_committed_cents increased by the rise in Bond.net_retained_cents (cross-entity: SuretyProgram)"
          - "status -> RECAPTURED"
        note: "Recapture is the compensating action for a cession: it returns retained exposure to the program and frees treaty capacity, conserving total penal sum."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: bond-renew-stale-version
    parent_entity: Bond
    write_endpoint: "POST /surety/bonds/{id}/renew"
    occ_field: "expected_bond_version"
    description: |
      Renewing a Bond whose version has advanced since the client last observed
      it is rejected. A renewal legitimately supersedes the prior bond (sets
      superseded_by_bond_id and creates a successor); a client whose view of the
      bond is stale — because an intervening rider application or cession
      recapture already bumped the bond's version — must re-read before renewing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_tier_derivation
    trigger: "Principal creation and update"
    algorithm: threshold
    formula: |
      if credit_score >= 720 and working_capital_cents >= 0: credit_tier = PREFERRED
      elif credit_score >= 620 and working_capital_cents >= 0: credit_tier = STANDARD
      else: credit_tier = SUBSTANDARD
    input_set: "The Principal's own credit_score and working_capital_cents."
    constants:
      PREFERRED_MIN_SCORE: 720
      STANDARD_MIN_SCORE: 620
    precision: "integer comparison; boundaries are inclusive (>=)"

  - name: premium_rating
    trigger: "BondApplication SUBMITTED transition (POST /surety/applications/{id}/submit)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs (credit_tier, bond_type, requested_penal_sum_cents)
      # with non-linear interaction (table lookup + conditional surcharge + min/max clamp).
      base_rate_bps = RATE_TABLE[credit_tier][bond_type]
      # large-risk surcharge: penal sums at or above HALF the program single limit add a flat surcharge
      surcharge_bps = LARGE_RISK_SURCHARGE_BPS if requested_penal_sum_cents * 2 >= program.single_limit_cents else 0
      quoted_premium_rate_bps = min(MAX_RATE_BPS, base_rate_bps + surcharge_bps)
      quoted_premium_cents = round_half_up(requested_penal_sum_cents * quoted_premium_rate_bps / 10000)
    input_set: "Principal.credit_tier, BondApplication.bond_type, requested_penal_sum_cents, SuretyProgram.single_limit_cents."
    constants:
      RATE_TABLE: |
        PREFERRED:   { BID: 100, PERFORMANCE: 150, PAYMENT: 150, LICENSE_PERMIT: 80,  FIDELITY: 120 }
        STANDARD:    { BID: 150, PERFORMANCE: 225, PAYMENT: 225, LICENSE_PERMIT: 120, FIDELITY: 180 }
        SUBSTANDARD: { BID: 250, PERFORMANCE: 375, PAYMENT: 375, LICENSE_PERMIT: 200, FIDELITY: 300 }
      LARGE_RISK_SURCHARGE_BPS: 50
      MAX_RATE_BPS: 400
    precision: "2-step: select rate (integer bps), then round_half_up the cents product. Rate clamped at MAX_RATE_BPS."

  - name: premium_earning
    trigger: "Bond cancellation (POST /surety/bonds/{id}/cancel); variant chosen by cancel_mode"
    algorithm: aggregation
    formula: |
      # DUAL VARIANT on the Bond domain: same written_premium, two earned-premium algorithms.
      elapsed_months = clamp(0, term_months, months_between(bond.created_at, current_utc))
      remaining_months = term_months - elapsed_months
      PRO_RATA:   earned = round_half_up(written_premium_cents * elapsed_months / term_months)
      SHORT_RATE: earned = round_half_up(
                    written_premium_cents * elapsed_months / term_months
                    + written_premium_cents * remaining_months / term_months * SHORT_RATE_PENALTY_PCT)
      earned_premium_cents = PRO_RATA earned  (if cancel_mode == PRO_RATA)
                           = SHORT_RATE earned (if cancel_mode == SHORT_RATE)
    input_set: "Bond.written_premium_cents, Bond.term_months, elapsed months from created_at to logical clock."
    constants:
      SHORT_RATE_PENALTY_PCT: 0.10
    precision: "2 decimal -> integer cents, round_half_up applied once to the final per-variant sum (sum-then-round, NOT round-per-term)."
    variants:
      - name: pro_rata
        when: "cancel_mode == PRO_RATA (voluntary, no penalty)"
        difference: "Earned = written * elapsed/term. Unearned fully returned."
      - name: short_rate
        when: "cancel_mode == SHORT_RATE (principal-requested early cancel; penalty retained)"
        difference: "Adds SHORT_RATE_PENALTY_PCT of the unearned portion on top of pro-rata earned; less premium returned."

  - name: incurred_loss
    trigger: "Claim transitions (investigate, settle PAY, settle DENY); recomputed on the bond"
    algorithm: aggregation
    formula: |
      # DUAL VARIANT on the Claim/Bond domain, distinct from premium_earning's variants:
      # case-reserve view vs paid view of the SAME claim set produce different incurred totals.
      incurred_loss_cents = sum over claims c on this bond of:
        if c.status in {FILED, INVESTIGATING}: c.reserve_cents          # case-reserve component
        elif c.status == PAID: max(0, c.paid_loss_cents - c.salvage_cents)  # paid-net-of-salvage component
        else (DENIED): 0
    input_set: "All Claims whose bond_id is this bond, partitioned by status; DENIED contribute 0."
    constants: {}
    precision: "integer cents; floor at 0 per claim (salvage cannot drive a claim's contribution negative)."
    variants:
      - name: case_reserve
        when: "claim still FILED/INVESTIGATING"
        difference: "Contribution = reserve_cents (an estimate)."
      - name: paid_actual
        when: "claim PAID"
        difference: "Contribution = max(0, paid_loss_cents - salvage_cents) (the realized number), replacing the reserve estimate."

  - name: rider_premium
    trigger: "Rider apply for INCREASE riders (POST /surety/riders/{id}/apply)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): nested rounding where order is pinned.
      # Round the per-month additional premium FIRST, then multiply by remaining months
      # (round-per-unit-then-sum), NOT (sum-then-round). This order is binding.
      elapsed_months = clamp(0, term_months, months_between(bond.created_at, current_utc))
      remaining_months = bond.term_months - elapsed_months
      monthly_premium_cents = round_half_up(penal_sum_delta_cents * bond.premium_rate_bps / 10000 / 12)
      additional_premium_cents = monthly_premium_cents * remaining_months
    input_set: "Rider.penal_sum_delta_cents (INCREASE > 0), Bond.premium_rate_bps, Bond.term_months, elapsed months."
    constants: {}
    precision: "round_half_up the per-MONTH figure first, THEN multiply by remaining_months (round-then-multiply). DECREASE/NAME_CHANGE -> 0."

  - name: cession_amount
    trigger: "Cession creation (POST /surety/cessions)"
    algorithm: aggregation
    formula: |
      ceded_penal_sum_cents = round_half_up(bond.penal_sum_cents * treaty.cession_pct_bps / 10000)
    input_set: "Bond.penal_sum_cents at cession time, ReinsuranceTreaty.cession_pct_bps."
    constants: {}
    precision: "round_half_up to integer cents."

  - name: program_aggregate_exposure
    trigger: "Bond bind/renew/cancel/expire, Rider apply, Cession create/recapture"
    algorithm: aggregation
    formula: |
      aggregate_committed_cents = sum of net_retained_cents over all Bonds b
        where b.program_id == program.id AND b.status in {ISSUED, ACTIVE}
      aggregate_available_cents = aggregate_limit_cents - aggregate_committed_cents
      net_retained_cents (per bond) = penal_sum_cents - ceded_penal_sum_cents
      ceded_penal_sum_cents (per bond) = sum of ceded_penal_sum_cents over ACTIVE Cessions on the bond
    input_set: "Bonds in {ISSUED, ACTIVE}; RENEWED/CANCELLED/EXPIRED bonds excluded. Cessions in ACTIVE only."
    constants: {}
    precision: "integer cents; maintained incrementally on each triggering transition and reconciled to the sum above."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum values valid; integers within declared ranges (e.g. credit_score 300-850)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_bond_version equals the bond's current version on renew"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /surety/bonds/{id}/renew"

  - priority: 7
    category: business_referential
    check: "Indemnity must be on file (an EXECUTED IndemnityAgreement for the principal) before an application may be SUBMITTED"
    error_id: ERR_INDEMNITY_REQUIRED
    http_status: 409
    applies_to: "POST /surety/applications/{id}/submit"

  - priority: 8
    category: business_safety
    check: "A bond with an open Claim (FILED/INVESTIGATING) cannot be cancelled, expired, riden, or its cession recaptured"
    error_id: ERR_OPEN_CLAIM_EXISTS
    http_status: 409
    applies_to: "cancel, expire, rider apply"

  - priority: 9
    category: business_safety
    check: "A REFERRED-threshold application (requested_penal_sum_cents >= referral_threshold_cents) cannot be approved directly; must be referred first"
    error_id: ERR_REFERRAL_REQUIRED
    http_status: 409
    applies_to: "POST /surety/applications/{id}/approve (from SUBMITTED)"

  - priority: 10
    category: business_constraint
    check: "Paid loss on settle cannot exceed the bond penal sum"
    error_id: ERR_LOSS_EXCEEDS_PENAL_SUM
    http_status: 409
    applies_to: "POST /surety/claims/{id}/settle"

  - priority: 11
    category: business_fiscal
    check: "Single-limit: a bond's penal sum (incl. INCREASE rider) must not exceed program single_limit_cents"
    error_id: ERR_SINGLE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "approve, bind, rider apply"

  - priority: 12
    category: business_fiscal
    check: "Aggregate-limit: program aggregate_available_cents must cover the committed net retained for bind/renew/increase"
    error_id: ERR_AGGREGATE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "bind, renew, rider apply (INCREASE)"

  - priority: 13
    category: business_fiscal
    check: "Treaty capacity: a cession's ceded amount must not exceed treaty ceded_available_cents"
    error_id: ERR_TREATY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /surety/cessions"

  - priority: 14
    category: business_constraint
    check: "Cannot bind/approve under a SUSPENDED program, nor cede to a CLOSED treaty"
    error_id: ERR_PROGRAM_SUSPENDED
    http_status: 409
    applies_to: "submit, approve, bind"

  - priority: 15
    category: business_constraint
    check: "Cession to a CLOSED treaty is rejected"
    error_id: ERR_TREATY_CLOSED
    http_status: 409
    applies_to: "POST /surety/cessions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- SuretyProgram ----
  - method: POST
    path: "/surety/programs"
    description: "Create a surety program with single/aggregate/referral limits and loss-alert threshold"
    roles: [SeniorUnderwriter]
    code: 201
    input: [name, single_limit_cents, aggregate_limit_cents, referral_threshold_cents, loss_alert_threshold_cents]
    output: SuretyProgram
    side_effects: ["status=OPEN; aggregate_committed_cents=0"]

  - method: GET
    path: "/surety/programs/{id}"
    description: "Get a program with live aggregate exposure"
    roles: [Underwriter, SeniorUnderwriter, ClaimsExaminer]
    code: 200
    input: []
    output: SuretyProgram
    side_effects: []

  - method: GET
    path: "/surety/programs"
    description: "List programs (paginated)"
    roles: [Underwriter, SeniorUnderwriter, ClaimsExaminer]
    code: 200
    input: ["limit?", "offset?"]
    output: SuretyProgram[]
    side_effects: []

  - method: POST
    path: "/surety/programs/{id}/suspend"
    description: "Suspend a program (admin/senior action)"
    roles: [SeniorUnderwriter]
    code: 200
    input: []
    output: SuretyProgram
    side_effects: ["status -> SUSPENDED"]

  # ---- Principal ----
  - method: POST
    path: "/surety/principals"
    description: "Create a principal; credit_tier derived"
    roles: [Underwriter, SeniorUnderwriter]
    code: 201
    input: [legal_name, credit_score, working_capital_cents]
    output: Principal
    side_effects: ["credit_tier computed; indemnity_on_file=false"]

  - method: GET
    path: "/surety/principals/{id}"
    description: "Get a principal"
    roles: [Underwriter, SeniorUnderwriter, ClaimsExaminer]
    code: 200
    input: []
    output: Principal
    side_effects: []

  # ---- IndemnityAgreement ----
  - method: POST
    path: "/surety/indemnity-agreements"
    description: "Create a general indemnity agreement (GIA) for a principal"
    roles: [Underwriter, SeniorUnderwriter]
    code: 201
    input: [principal_id, indemnitor_count, required_signature_count]
    output: IndemnityAgreement
    side_effects: ["status=PENDING; collected_signature_count=0"]

  - method: GET
    path: "/surety/indemnity-agreements/{id}"
    description: "Get a GIA"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: IndemnityAgreement
    side_effects: []

  - method: GET
    path: "/surety/indemnity-agreements"
    description: "List GIAs, filterable by principal_id"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: ["principal_id?", "limit?", "offset?"]
    output: IndemnityAgreement[]
    side_effects: []

  - method: POST
    path: "/surety/indemnity-agreements/{id}/sign"
    description: "Add one signature; executes the GIA when the last required signature is collected"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: IndemnityAgreement
    side_effects: ["collected_signature_count += 1; -> EXECUTED at threshold; Principal.indemnity_on_file recomputed"]

  - method: POST
    path: "/surety/indemnity-agreements/{id}/void"
    description: "Void a pending GIA"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: IndemnityAgreement
    side_effects: ["status -> VOIDED"]

  # ---- BondApplication ----
  - method: POST
    path: "/surety/applications"
    description: "Create a bond application in DRAFT"
    roles: [Underwriter, SeniorUnderwriter]
    code: 201
    input: [principal_id, program_id, bond_type, requested_penal_sum_cents, term_months]
    output: BondApplication
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/surety/applications/{id}"
    description: "Get an application incl. quoted premium"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: BondApplication
    side_effects: []

  - method: GET
    path: "/surety/applications"
    description: "List applications, filterable by principal_id and program_id"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: ["principal_id?", "program_id?", "limit?", "offset?"]
    output: BondApplication[]
    side_effects: []

  - method: POST
    path: "/surety/applications/{id}/submit"
    description: "Submit a DRAFT application; computes premium quote"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: BondApplication
    side_effects: ["status -> SUBMITTED; quoted_premium_rate_bps, quoted_premium_cents computed"]

  - method: POST
    path: "/surety/applications/{id}/approve"
    description: "Approve a SUBMITTED (Underwriter) or REFERRED (SeniorUnderwriter) application"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: BondApplication
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/surety/applications/{id}/refer"
    description: "Refer a SUBMITTED application to senior authority"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: BondApplication
    side_effects: ["status -> REFERRED"]

  - method: POST
    path: "/surety/applications/{id}/decline"
    description: "Decline a SUBMITTED/REFERRED application"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: [decline_reason]
    output: BondApplication
    side_effects: ["status -> DECLINED; decline_reason recorded"]

  # ---- Bond ----
  - method: POST
    path: "/surety/bonds"
    description: "Bind an APPROVED application into a Bond (ISSUED)"
    roles: [Underwriter, SeniorUnderwriter]
    code: 201
    input: [application_id]
    output: Bond
    side_effects: ["application -> BOUND; Bond created ISSUED; program aggregate_committed_cents increases by penal sum"]

  - method: GET
    path: "/surety/bonds/{id}"
    description: "Get a bond incl. exposure and loss fields"
    roles: [Underwriter, SeniorUnderwriter, ClaimsExaminer]
    code: 200
    input: []
    output: Bond
    side_effects: []

  - method: GET
    path: "/surety/bonds"
    description: "List bonds, filterable by application_id, principal_id, program_id, and superseded_by_bond_id"
    roles: [Underwriter, SeniorUnderwriter, ClaimsExaminer]
    code: 200
    input: ["application_id?", "principal_id?", "program_id?", "superseded_by_bond_id?", "limit?", "offset?"]
    output: Bond[]
    side_effects: []

  - method: POST
    path: "/surety/bonds/{id}/issue"
    description: "Issue a bond: mint power-of-attorney and activate"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: Bond
    side_effects: ["power_of_attorney_number minted; status -> ACTIVE"]

  - method: POST
    path: "/surety/bonds/{id}/cancel"
    description: "Cancel an ACTIVE bond; compute earned premium per cancel_mode; recapture cessions"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: [cancel_mode]
    output: Bond
    side_effects: ["earned_premium computed; cessions recaptured; program exposure released; status -> CANCELLED"]

  - method: POST
    path: "/surety/bonds/{id}/renew"
    description: "Renew an ACTIVE bond (CREATE-with-supersede); OCC on expected_bond_version"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: [expected_bond_version]
    output: Bond
    side_effects: ["successor Bond created ISSUED; this bond -> RENEWED; superseded_by_bond_id set; program exposure shifts predecessor->successor; bond.version increments by 1"]

  - method: POST
    path: "/surety/bonds/{id}/expire"
    description: "Expire an ACTIVE bond at end of term"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: Bond
    side_effects: ["earned_premium = written_premium; cessions recaptured; program exposure released; status -> EXPIRED"]

  # ---- Claim ----
  - method: POST
    path: "/surety/claims"
    description: "File a claim against a bond"
    roles: [ClaimsExaminer]
    code: 201
    input: [bond_id, claimant_name, demand_cents, reserve_cents]
    output: Claim
    side_effects: ["status=FILED; Bond.incurred_loss_cents recomputed"]

  - method: GET
    path: "/surety/claims/{id}"
    description: "Get a claim"
    roles: [Underwriter, SeniorUnderwriter, ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/surety/claims"
    description: "List claims, filterable by bond_id"
    roles: [Underwriter, SeniorUnderwriter, ClaimsExaminer]
    code: 200
    input: ["bond_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/surety/claims/{id}/investigate"
    description: "Move a FILED claim to INVESTIGATING; update reserve"
    roles: [ClaimsExaminer]
    code: 200
    input: [reserve_cents]
    output: Claim
    side_effects: ["status -> INVESTIGATING; Bond.incurred_loss_cents recomputed"]

  - method: POST
    path: "/surety/claims/{id}/settle"
    description: "Settle a claim PAY or DENY"
    roles: [ClaimsExaminer]
    code: 200
    input: [outcome, "paid_loss_cents?", "salvage_cents?"]
    output: Claim
    side_effects: ["status -> PAID or DENIED; Bond.incurred_loss_cents recomputed; program may SUSPEND on aggregate loss breach"]

  # ---- Rider ----
  - method: POST
    path: "/surety/riders"
    description: "Create a rider (endorsement) on a bond in DRAFT"
    roles: [Underwriter, SeniorUnderwriter]
    code: 201
    input: [bond_id, rider_type, "penal_sum_delta_cents?"]
    output: Rider
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/surety/riders/{id}"
    description: "Get a rider"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: GET
    path: "/surety/riders"
    description: "List riders, filterable by bond_id"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: ["bond_id?", "limit?", "offset?"]
    output: Rider[]
    side_effects: []

  - method: POST
    path: "/surety/riders/{id}/apply"
    description: "Apply a DRAFT rider; adjusts bond penal sum and program exposure"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: Rider
    side_effects: ["additional_premium computed (INCREASE); bond penal sum adjusted; program exposure adjusted; status -> APPLIED"]

  - method: POST
    path: "/surety/riders/{id}/reject"
    description: "Reject a DRAFT rider"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: Rider
    side_effects: ["status -> REJECTED"]

  # ---- ReinsuranceTreaty ----
  - method: POST
    path: "/surety/treaties"
    description: "Create a reinsurance treaty (quota share)"
    roles: [SeniorUnderwriter]
    code: 201
    input: [name, cession_pct_bps, treaty_capacity_cents]
    output: ReinsuranceTreaty
    side_effects: ["status=OPEN; ceded_committed_cents=0"]

  - method: GET
    path: "/surety/treaties/{id}"
    description: "Get a treaty incl. live ceded balances"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: ReinsuranceTreaty
    side_effects: []

  - method: GET
    path: "/surety/treaties"
    description: "List treaties (paginated)"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: ["limit?", "offset?"]
    output: ReinsuranceTreaty[]
    side_effects: []

  - method: POST
    path: "/surety/treaties/{id}/close"
    description: "Close a treaty to new cessions"
    roles: [SeniorUnderwriter]
    code: 200
    input: []
    output: ReinsuranceTreaty
    side_effects: ["status -> CLOSED"]

  # ---- Cession ----
  - method: POST
    path: "/surety/cessions"
    description: "Cede part of a bond's penal sum to a treaty"
    roles: [Underwriter, SeniorUnderwriter]
    code: 201
    input: [bond_id, treaty_id]
    output: Cession
    side_effects: ["ceded amount computed; treaty ceded_committed increases; bond net_retained decreases; program exposure decreases; status=ACTIVE"]

  - method: GET
    path: "/surety/cessions/{id}"
    description: "Get a cession"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: Cession
    side_effects: []

  - method: GET
    path: "/surety/cessions"
    description: "List cessions, filterable by bond_id and treaty_id"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: ["bond_id?", "treaty_id?", "limit?", "offset?"]
    output: Cession[]
    side_effects: []

  - method: POST
    path: "/surety/cessions/{id}/recapture"
    description: "Recapture an ACTIVE cession (compensating action)"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: Cession
    side_effects: ["treaty ceded_committed decreases; bond net_retained increases; program exposure increases; status -> RECAPTURED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/surety/_clock/set_current_utc"
    description: "Set the server logical clock to an ISO-8601 UTC instant. Server default before any call is 2026-01-01T00:00:00Z (does NOT fall back to wall-clock). Governs months_between used by premium_earning and rider_premium."
    roles: [SeniorUnderwriter]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN,                http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "A referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST,          http: 422, condition: "Missing/invalid body field, bad enum, or out-of-range integer (e.g. credit_score outside 300-850)" }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION,            http: 412, condition: "expected_bond_version does not match the bond's current version on renew" }
  - { id: ERR_INDEMNITY_REQUIRED,       http: 409, condition: "No EXECUTED indemnity agreement on file for the principal at submit" }
  - { id: ERR_REFERRAL_REQUIRED,        http: 409, condition: "requested_penal_sum_cents >= referral_threshold_cents but approve attempted from SUBMITTED" }
  - { id: ERR_SINGLE_LIMIT_EXCEEDED,    http: 409, condition: "Bond penal sum (incl. INCREASE rider) exceeds program single_limit_cents" }
  - { id: ERR_AGGREGATE_LIMIT_EXCEEDED, http: 409, condition: "Program aggregate_available_cents cannot cover the committed net retained" }
  - { id: ERR_TREATY_CAPACITY_EXCEEDED, http: 409, condition: "Cession ceded amount exceeds treaty ceded_available_cents" }
  - { id: ERR_TREATY_CLOSED,            http: 409, condition: "Cession attempted to a CLOSED treaty" }
  - { id: ERR_PROGRAM_SUSPENDED,        http: 409, condition: "Submit/approve/bind attempted under a SUSPENDED program" }
  - { id: ERR_OPEN_CLAIM_EXISTS,        http: 409, condition: "Bond has a FILED/INVESTIGATING claim blocking cancel/expire/rider/recapture" }
  - { id: ERR_LOSS_EXCEEDS_PENAL_SUM,   http: 409, condition: "paid_loss_cents on settle exceeds the bond penal sum" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Underwriter
    description: "Front-line underwriter: principals, GIAs, applications (submit/approve below threshold/refer/decline), binding, issuance, riders, cessions, bond lifecycle"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /surety/principals"
      - "POST /surety/indemnity-agreements (+ sign, void)"
      - "POST /surety/applications (+ submit, refer, decline)"
      - "POST /surety/applications/{id}/approve — ONLY from SUBMITTED below referral threshold"
      - "POST /surety/bonds (bind) + issue/cancel/renew/expire"
      - "POST /surety/riders (+ apply, reject)"
      - "POST /surety/cessions (+ recapture)"

  - name: SeniorUnderwriter
    description: "Senior authority: everything an Underwriter can do PLUS approving REFERRED applications, creating/suspending programs, creating/closing treaties (segregation of duties: the senior tier owns referral approvals and program/treaty configuration)"
    identity: opaque
    exclusive_operations:
      - "POST /surety/programs (+ suspend)"
      - "POST /surety/treaties (+ close)"
      - "POST /surety/applications/{id}/approve — from REFERRED (referral approval is senior-only)"
    shared_operations:
      - "All Underwriter shared_operations"

  - name: ClaimsExaminer
    description: "Claims handling: files, investigates, and settles claims (cannot underwrite, bind, or approve — segregation between underwriting and claims)"
    identity: opaque
    exclusive_operations:
      - "POST /surety/claims (+ investigate, settle)"
    shared_operations:
      - "GET /surety/bonds/{id}, GET /surety/programs/{id}, GET /surety/claims (read access for claim context)"
