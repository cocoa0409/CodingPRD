              captures: { lot: $.data.id }
          assert:
            - "InventoryLot.${lot}.unit_cost_cents == 7434 (default clock 2026-08-01T00:00:00Z falls inside the window)"
            - "no wall-clock dependence: result identical regardless of real run time"

      - name: add_line_to_non_draft_order_rejected
        claim_type: conditional_action
