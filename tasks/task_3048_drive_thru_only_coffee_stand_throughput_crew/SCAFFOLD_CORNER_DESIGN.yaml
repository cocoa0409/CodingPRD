            - call: "POST /shifts"
              payload: { stand_id: "${stand_id}", starts_at: "2026-08-31T07:00:00Z", ends_at: "2026-08-31T09:00:00Z", is_peak: false }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { ok_shift: $.data.id }
          assert:
