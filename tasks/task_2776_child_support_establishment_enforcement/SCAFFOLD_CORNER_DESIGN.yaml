              as: CaseWorker
              captures: { ordb: "$.data.id" }
            - call: "POST /child-support/orders/${ordb}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { b_status: "$.data.status" }
            - call: "POST /child-support/cases/${caset}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "WI", effective_date: "2026-07-01" }
              as: CaseWorker
              captures: { ordc: "$.data.id" }
            - call: "POST /child-support/orders/${ordc}/guideline-calculation"
