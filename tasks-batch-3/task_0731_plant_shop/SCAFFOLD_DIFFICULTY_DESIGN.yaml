              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /delivery-drivers"
              payload: { name: "Hank" }
              as: Manager
              captures: { driver_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "SeedPlant", light_tag: "MEDIUM", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 45000, warranty_days: 30 }
              as: Manager
              captures: { seed_plant_id: "$.data.id" }
            - call: "POST /plants/${seed_plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${seed_plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { seed_order_id: "$.data.id" }
            - call: "POST /orders/${seed_order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${seed_order_id}/dispatch"
              payload: { driver_id: "${driver_id}", window_start_at: "2026-04-01T09:00:00Z", window_end_at: "2026-04-01T11:00:00Z" }
              as: ShopStaff
              captures: { seed_delivery_id: "$.data.id" }
            - call: "POST /deliveries/${seed_delivery_id}/deliver"
              payload: {}
              as: DeliveryDriver
              as_user_id: "${driver_id}"
            # Customer.lifetime_points_earned is now 450.
            - call: "POST /plants"
              payload: { name: "TargetPlant", light_tag: "LOW", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 5000, warranty_days: 30 }
              as: Manager
              captures: { target_plant_id: "$.data.id" }
            - call: "POST /plants/${target_plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-26T00:00:00Z" }
              as: ShopStaff
              captures: { target_stock_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${target_plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { target_order_id: "$.data.id" }
            - call: "POST /orders/${target_order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${target_order_id}/dispatch"
              payload: { driver_id: "${driver_id}", window_start_at: "2026-04-02T09:00:00Z", window_end_at: "2026-04-02T11:00:00Z" }
              as: ShopStaff
              captures: { target_delivery_id: "$.data.id" }
          trigger:
            - call: "POST /deliveries/${target_delivery_id}/deliver"
              payload: {}
              as: DeliveryDriver
              as_user_id: "${driver_id}"
          assert:
            # Depth 1: DeliveryAssignment.status = DELIVERED (captured post-trigger via GET)
            # Depth 2: Order.fulfillment_status = DELIVERED
            # Depth 3: Customer.lifetime_points_earned = 450 + 50 (target order provisional at BRONZE, final also BRONZE since tier flip is post-cascade for own order) = 500 → SILVER
            # (StockUnit sale_status flip also at depth 3)
            - "Order.${target_order_id}.fulfillment_status == DELIVERED"
            - "Order.${target_order_id}.points_finalized == 50"
            - "StockUnit.${target_stock_id}.sale_status == SOLD"
            - "Customer.${cust_id}.lifetime_points_earned == 500"
            - "Customer.${cust_id}.loyalty_tier == SILVER"

      - name: warranty_approve_cascade_depth_2_orderline_stock_customer_wallet
