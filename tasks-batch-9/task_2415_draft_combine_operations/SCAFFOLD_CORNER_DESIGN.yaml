      - name: trade_chart_and_surplus_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.pick_trade_value_balance.variants
        distinguishing_aspect: "The same trade must produce chart_balance_points and surplus_balance_points with opposite signs, and only the chart variant gates acceptance."
        excluded_because:
          difficulty_instance: trade_chart_variant_and_market_surplus_variant_carry_opposite_signs
          rationale: "The §1.8 depth instance already pins both variants for one trade and asserts the opposite signs plus the acceptance decision; repeating it here would be the same request with the same literals."
      - name: compensatory_banded_and_raw_snap_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.compensatory_pick_award_score.variants
        distinguishing_aspect: "A snap_pct strictly inside a band must make claim_score and advisory_snap_adjusted_score differ while only the banded score decides qualifies."
        excluded_because:
          difficulty_instance: compensatory_banded_snap_score_and_raw_snap_advisory_diverge
          rationale: "Covered in depth by the §1.8 instance, which submits the same claim shape and asserts both variants; the breadth pass keeps only the distinct VERIFY-freeze claim above."
      - name: compensatory_qualify_threshold_at_the_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.compensatory_pick_award_score.constants.COMP_QUALIFY_SCORE_MIN
          - validations.priority_29
        distinguishing_aspect: "claim_score exactly equal to COMP_QUALIFY_SCORE_MIN must qualify, and one cent of APY less must not."
        excluded_because:
          difficulty_instance: compensatory_claim_score_exactly_at_qualify_minimum_qualifies
          rationale: "The §1.8 instance tests both sides of the 250.00 boundary with pinned literals (250.00 qualifying and 249.90 not), which is the whole threshold-boundary row."
      - name: selection_clock_expiry_at_the_deadline_instant
        claim_type: threshold_boundary
        grounds:
          - calculations.selection_clock_deadline.precision
          - state_machines.DraftPick.ON_CLOCK_to_PASSED
        distinguishing_aspect: "Expiry is inclusive of deadline_at: one millisecond before is a no-op advance, at the instant the pick passes with pass_reason EXPIRED."
        excluded_because:
          difficulty_instance: selection_clock_expires_at_the_deadline_instant_not_one_millisecond_before
          rationale: "The §1.8 instance drives the clock to 18:09:59.999Z and then to 18:10:00.000Z in one recipe and asserts the cascade start instant, so the boundary is already pinned."
      - name: trade_tolerance_ratio_at_the_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.pick_trade_value_balance.constants.TRADE_TOLERANCE_RATIO
          - validations.priority_37
        distinguishing_aspect: "An imbalance_ratio of exactly 0.1500 must be accepted because the gate is inclusive."
        excluded_because:
          difficulty_instance: trade_imbalance_ratio_exactly_at_tolerance_is_accepted
          rationale: "The §1.8 instance builds the seven-round fixture whose ratio lands exactly on 0.1500 and asserts acceptance plus both post-trade capital ledgers."
      - name: udfa_pool_tier_keyed_on_the_base_pool
        claim_type: waterfall_allocation_ordering
        grounds:
          - calculations.udfa_pool_allocation
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: "The credit-rate tier must be selected from base_pool before the lapsed-pick credit is added, otherwise the tier and the pool total change."
        excluded_because:
          difficulty_instance: udfa_pool_credit_rate_tier_keyed_on_base_pool_not_post_credit_total
          rationale: "The §1.8 instance already contrasts the pinned answer (167049207) with the reversed-order answer (145655755) on the same fixture."
      - name: lottery_order_is_deterministic_and_non_linear
        claim_type: chronological_ordering
        grounds:
          - calculations.draft_order_ranking
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "Seeding, contiguous combination ranges, duplicate-draw skipping and the playoff tail must combine into one deterministic order with no id-based tie-break."
        excluded_because:
          difficulty_instance: lottery_order_nonlinear_seed_tiebreak_duplicate_skip_and_playoff_tail
          rationale: "The §1.8 instance runs the six-club fixture with a duplicate draw value and asserts every draft_order_index, which subsumes the breadth-level ordering claim."
