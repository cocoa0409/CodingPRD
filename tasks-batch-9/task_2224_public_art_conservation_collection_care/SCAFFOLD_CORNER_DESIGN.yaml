            - "the third trigger returns 201 with status == SCHEDULED, sla_deadline_at == null and sla_breached == false (no graffiti_reported_at was supplied)"
            - "the fourth trigger returns 409 with error_id == ERR_VISIT_WINDOW_NOT_OPEN while the clock still reads 2026-08-01 and the visit stays SCHEDULED"
