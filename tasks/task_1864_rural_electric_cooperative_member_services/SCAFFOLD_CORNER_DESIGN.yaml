              captures: { ret_id: $.data.id }
            - call: "POST /coop/capital-credit-retirements/${ret_id}/board-approve"
              payload: {}
              as: BoardDirector
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { coop_v3: $.data.version }
            - call: "POST /coop/capital-credit-retirements/${ret_id}/execute"
              payload: { expected_cooperative_version: "${coop_v3}" }
              as: MemberServicesRep
            - call: "GET /coop/members/${m_a}"
              payload: {}
              as: MemberServicesRep
              captures: { bal_a: $.data.capital_credit_balance_cents }
            - call: "GET /coop/members/${m_b}"
              payload: {}
              as: MemberServicesRep
              captures: { bal_b: $.data.capital_credit_balance_cents }
          assert:
            - "bal_a == 0 (oldest vintage 2024 paid in full: 10000)"
            - "bal_b == 25000 (2025 vintage paid partial 5000 of 30000)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: sod_allocation_approve_by_proposer_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_SOD_VIOLATION]"
        distinguishing_aspect: "Segregation of duties: the BoardDirector who also proposed (same X-User-ID) cannot approve; but roles differ — the SoD check compares the rep's proposer id to the approver's id."
        test_recipe:
          setup: ["Cooperative pool=10000; DRAFT allocation proposed by MemberServicesRep with X-User-ID 'rep-1'"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/cooperatives/${coop_id}/post-margin"
              payload: { fiscal_year: 2025, margin_cents: 10000 }
              as: MemberServicesRep
              as_user_id: "rep-1"
            - call: "POST /coop/capital-credit-allocations"
              payload: { cooperative_id: "${coop_id}", fiscal_year: 2025, method: "FLAT_PER_MEMBER" }
              as: MemberServicesRep
              as_user_id: "rep-1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SOD_VIOLATION (approver X-User-ID matches proposer)"

      - name: retirement_method_not_allowed_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.CapitalCreditRetirement"
          - "errors[ERR_RETIREMENT_METHOD_NOT_ALLOWED]"
        distinguishing_aspect: "board-approve rejects a method not listed in Cooperative.retirement_methods_allowed."
        test_recipe:
          setup: ["Cooperative allows only FIFO_OLDEST; a PRO_RATA_PERCENTAGE retirement proposed"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/capital-credit-retirements"
              payload: { cooperative_id: "${coop_id}", method: "PRO_RATA_PERCENTAGE", total_retire_cents: 1000, pro_rata_pct: 0.5 }
              as: MemberServicesRep
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /coop/capital-credit-retirements/${ret_id}/board-approve"
              payload: {}
              as: BoardDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETIREMENT_METHOD_NOT_ALLOWED"

      - name: ballot_district_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BALLOT_DISTRICT_MISMATCH]"
        distinguishing_aspect: "Non-proxy ballot cast for a district other than the member's district_id fails with ERR_BALLOT_DISTRICT_MISMATCH."
        test_recipe:
          setup: ["Election VOTING_OPEN within window; ACTIVE member with district_id=1"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/board-elections"
              payload: { cooperative_id: "${coop_id}", year: 2026, seats: [1, 2], voting_opens_at: "2026-08-01T00:00:00Z", voting_closes_at: "2026-08-15T00:00:00Z" }
              as: BoardSecretary
              captures: { el_id: $.data.id }
            - call: "POST /coop/board-elections/${el_id}/open-nominations"
              payload: {}
              as: BoardSecretary
            - call: "POST /coop/board-elections/${el_id}/close-nominations"
              payload: { candidate_names: ["Cand A", "Cand B"] }
              as: BoardSecretary
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: BoardSecretary
              captures: { coop_v: $.data.version }
            - call: "POST /coop/board-elections/${el_id}/open-voting"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: BoardSecretary
          trigger:
            - call: "POST /coop/ballots"
              payload: { election_id: "${el_id}", district: 2, candidate_name: "Cand B", is_proxy: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BALLOT_DISTRICT_MISMATCH"

      - name: ballot_from_suspended_member_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BALLOT_MEMBER_INACTIVE]"
        distinguishing_aspect: "Ballot cast by a SUSPENDED member fails with ERR_BALLOT_MEMBER_INACTIVE."
        test_recipe:
          setup: ["Election VOTING_OPEN; member SUSPENDED"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/members/${m_id}/suspend"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/board-elections"
              payload: { cooperative_id: "${coop_id}", year: 2026, seats: [1], voting_opens_at: "2026-08-01T00:00:00Z", voting_closes_at: "2026-08-15T00:00:00Z" }
              as: BoardSecretary
              captures: { el_id: $.data.id }
            - call: "POST /coop/board-elections/${el_id}/open-nominations"
              payload: {}
              as: BoardSecretary
            - call: "POST /coop/board-elections/${el_id}/close-nominations"
              payload: { candidate_names: ["Cand A"] }
              as: BoardSecretary
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: BoardSecretary
              captures: { coop_v: $.data.version }
            - call: "POST /coop/board-elections/${el_id}/open-voting"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: BoardSecretary
          trigger:
            - call: "POST /coop/ballots"
              payload: { election_id: "${el_id}", district: 1, candidate_name: "Cand A", is_proxy: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BALLOT_MEMBER_INACTIVE"

      - name: payout_cash_after_deadline_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PAYOUT_STALE]"
          - "state_machines.CapitalCreditPayout"
        distinguishing_aspect: "Cashing a payout at or after claim_deadline fails with ERR_PAYOUT_STALE."
        test_recipe:
          setup: ["Issued payout with claim_deadline = issued_at + 3 years; logical clock advanced past it"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST", "PRO_RATA_PERCENTAGE"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
