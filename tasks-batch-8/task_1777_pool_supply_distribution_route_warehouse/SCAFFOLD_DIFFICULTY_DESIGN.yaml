# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Pool Supply Distribution & Route Warehouse. 9 rules × 2 instances = 18.
# All numeric asserts are literals pre-computed from §1.3 formulas.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: SalesOrder freight
  # vs WarrantyClaim labor credit)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: freight_order_level_vs_per_line_trap
        grounds:
          - calculations.freight_charge
          - entities.SalesOrder.fields.freight_charge_cents
        distinguishing_aspect: |
          Entity domain = SalesOrder freight. Two-50000c-minimum semantics are
          order-level: a 2-line ROUTE_DELIVERY order whose lines are each below
          50000 but whose subtotal is 60000 pays freight 0, whereas the
          per-line trap variant would charge base+shortfall. Pins the order-level
          variant and rejects the trap.
        test_recipe:
          setup:
            - "Branch B hazmat-certified, peak 04-01..09-30, clock 2026-06-01"
            - "Account A (DEALER, PRO, willcall_authorized)"
            - "Product P1 EQUIPMENT base 30000c; Product P2 PARTS base 30000c"
            - "Lots with ample stock for P1 and P2 at branch B"
            - "DRAFT ROUTE_DELIVERY order with lines P1×1 and P2×1, route_date 2026-06-10"
          setup_api_calls:
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-100", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "PUMP-1HP", product_family: "EQUIPMENT", base_price_cents: 30000 }
              as: BranchManager
              captures: { p1_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "SEAL-KIT", product_family: "PARTS", base_price_cents: 30000 }
              as: BranchManager
              captures: { p2_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${p1_id}", lot_code: "L-P1", qty_on_hand: 10 }
              as: WarehouseLead
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${p2_id}", lot_code: "L-P2", qty_on_hand: 10 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "ROUTE_DELIVERY", route_date: "2026-06-10", lines: [ { product_id: "${p1_id}", qty: 1 }, { product_id: "${p2_id}", qty: 1 } ] }
              as: RouteDispatcher
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: RouteDispatcher
          assert:
            - "SalesOrder.${ord_id}.order_subtotal_cents == 60000"
            - "SalesOrder.${ord_id}.freight_charge_cents == 0"
            - "SalesOrder.${ord_id}.invoiced_cents == 60000"
            - "freight is NOT 2×(base+shortfall): order-level free-minimum semantics win over per-line"

      - name: warranty_provisional_vs_final_credit
        grounds:
          - calculations.warranty_labor_credit
          - entities.WarrantyClaim.fields.provisional_credit_cents
          - entities.WarrantyClaim.fields.final_credit_cents
        distinguishing_aspect: |
          Entity domain = WarrantyClaim credit. Same claim produces a flat
          2-hour provisional credit at SUBMIT (30000c at 15000c/hr) and an
          actual-hours capped final credit at RESOLVE (4.5h → 67500c); the two
          variants differ and the payable delta is +37500c.
        test_recipe:
          setup:
            - "Account A (SERVICE_CO); Product EQUIPMENT base 500000c"
            - "ServiceCenter SC ACTIVE, brands ['AquaFlow'], region SW, labor_rate 15000c/hr"
            - "Claim submitted with brand AquaFlow"
          setup_api_calls:
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "SVC-200", account_type: "SERVICE_CO" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "PUMP-VS", product_family: "EQUIPMENT", base_price_cents: 500000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/service-centers"
              payload: { center_name: "SW Pump Works", region_code: "SW", authorized_brands: ["AquaFlow"], labor_rate_cents: 15000 }
              as: BranchManager
              captures: { sc_id: $.data.id }
            - call: "POST /pool-supply/warranty-claims"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", serial_number: "SN-9001", brand: "AquaFlow", purchase_date: "2026-03-15", failure_description: "impeller seized" }
              as: BranchManager
              captures: { claim_id: $.data.id }
            - call: "POST /pool-supply/warranty-claims/${claim_id}/start-review"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/warranty-claims/${claim_id}/approve"
              payload: {}
              as: BranchManager
          trigger:
            - call: "POST /pool-supply/warranty-claims/${claim_id}/resolve"
              payload: { actual_labor_hours: 4.5 }
              as: BranchManager
          assert:
            - "WarrantyClaim.${claim_id}.provisional_credit_cents == 30000"
            - "WarrantyClaim.${claim_id}.final_credit_cents == 67500"
            - "payable delta == 67500 - 30000 == 37500 (provisional ≠ final for identical claim)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) non-linear ≥3 inputs;
  # mode (b) nested rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pricing_tier_x_seasonal_x_qty_mode_a
        grounds:
          - calculations.order_pricing
          - entities.OrderLine.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (a): unit price is a non-linear interaction of base_price ×
          tier_factor(PREMIER 0.10) × seasonal_factor(early-buy 20%) with the
          commitment-present conditional branch; correct result requires all
          three multiplicative terms plus the branch on commitment_id.
        test_recipe:
          setup:
            - "Branch B; clock 2026-01-10 inside program order window 2026-01-01..2026-02-15"
            - "Program SP OPEN: discount 20%, pool_cap 10000"
            - "Account A pushed to PREMIER tier via a prior 5000000c invoiced order (ratchet)"
            - "Commitment CMT for (SP, A) 500 units, status COMMITTED"
            - "Product P CHEMICAL NONE base 10000c, ample lot"
            - "DRAFT WILL_CALL order referencing commitment_id, line P×3"
          setup_api_calls:
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-300", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "TAB-3IN", product_family: "CHEMICAL", base_price_cents: 10000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 50000 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-01-10T14:00:00Z", lines: [ { product_id: "${prod_id}", qty: 500 } ] }
              as: CounterRep
              captures: { ord_seed: $.data.id }
            - call: "POST /pool-supply/orders/${ord_seed}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${ord_seed}/invoice"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/seasonal-programs"
              payload: { branch_id: "${br_id}", program_name: "2026 Early-Buy", order_window_start: "2026-01-01T00:00:00Z", order_window_end: "2026-02-15T00:00:00Z", ship_window_start: "2026-03-01T00:00:00Z", ship_window_end: "2026-05-31T00:00:00Z", early_buy_discount_pct: 20, pool_cap_units: 10000 }
              as: BranchManager
              captures: { sp_id: $.data.id, sp_v: $.data.version }
            - call: "POST /pool-supply/seasonal-programs/${sp_id}/open"
              payload: {}
              as: BranchManager
              captures: { sp_v2: $.data.version }
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${acct_id}", committed_units: 500, expected_program_version: "${sp_v2}" }
              as: BranchManager
              captures: { cmt_id: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-01-10T15:00:00Z", commitment_id: "${cmt_id}", lines: [ { product_id: "${prod_id}", qty: 3 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v_now: $.data.version }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v_now}" }
              as: CounterRep
          assert:
            - "GET /pool-supply/orders/${ord_id}/lines → line[0].unit_price_cents == 7200  (10000 × 0.90 × 0.80)"
            - "line[0].extended_price_cents == 21600"
            - "SalesOrder.${ord_id}.order_subtotal_cents == 21600"
            - "SalesOrder.${ord_id}.freight_charge_cents == 0  (WILL_CALL)"
            - "SalesOrder.${ord_id}.tier_at_confirm == PREMIER"

      - name: pricing_per_line_round_then_sum_mode_b
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per-line-first. Line = base 1051c,
          PREMIER 10% + early-buy 5% → unit_unrounded 898.605c, qty 2 →
          extended = round_half_up(1797.21) = 1797; the trap 'round unit first
          then multiply' yields 899×2 = 1798. One cent discriminates the order
          of rounding.
        test_recipe:
          setup:
            - "Branch B; clock 2026-01-10; program SP OPEN discount 5%, pool 10000"
            - "Account A at PREMIER (seeded via invoiced order)"
            - "Commitment CMT (SP, A) 100 units"
            - "Product P CHEMICAL NONE base 1051c, ample lot"
            - "DRAFT WILL_CALL order commitment-referencing, line P×2"
          setup_api_calls:
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "TUC-03", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-301", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "CL-SHOCK", product_family: "CHEMICAL", base_price_cents: 1051 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "HEATER-XL", product_family: "EQUIPMENT", base_price_cents: 5000000 }
              as: BranchManager
              captures: { seed_prod: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 1000 }
              as: WarehouseLead
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${seed_prod}", lot_code: "L2", qty_on_hand: 5 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-01-10T14:00:00Z", lines: [ { product_id: "${seed_prod}", qty: 1 } ] }
              as: CounterRep
              captures: { ord_seed: $.data.id }
            - call: "POST /pool-supply/orders/${ord_seed}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${ord_seed}/invoice"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/seasonal-programs"
              payload: { branch_id: "${br_id}", program_name: "Chem Early-Buy 5", order_window_start: "2026-01-01T00:00:00Z", order_window_end: "2026-02-15T00:00:00Z", ship_window_start: "2026-03-01T00:00:00Z", ship_window_end: "2026-05-31T00:00:00Z", early_buy_discount_pct: 5, pool_cap_units: 10000 }
              as: BranchManager
              captures: { sp_id: $.data.id }
            - call: "POST /pool-supply/seasonal-programs/${sp_id}/open"
              payload: {}
              as: BranchManager
              captures: { sp_v2: $.data.version }
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${acct_id}", committed_units: 100, expected_program_version: "${sp_v2}" }
              as: BranchManager
              captures: { cmt_id: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-01-10T16:00:00Z", commitment_id: "${cmt_id}", lines: [ { product_id: "${prod_id}", qty: 2 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v_now: $.data.version }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v_now}" }
              as: CounterRep
          assert:
            - "GET /pool-supply/orders/${ord_id}/lines → line[0].extended_price_cents == 1797"
            - "line[0].unit_price_cents == 899  (derived from rounded line, NOT pre-rounded unit 898.605)"
            - "SalesOrder.${ord_id}.order_subtotal_cents == 1797"
            - "subtotal is NOT 1798 (the round-unit-first trap value)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (parallel dims on SalesOrder; cycle on
  # WarrantyClaim UNDER_REVIEW ↔ MORE_INFO)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_fulfillment_x_payment
        grounds:
          - state_machines.SalesOrder
          - entities.SalesOrder.fields.fulfillment_status
          - entities.SalesOrder.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity: an order can be
          fulfillment=CONFIRMED while payment is still UNINVOICED, and
          PICKED_LOADED is reachable while UNINVOICED; completion requires
          PAID. The two axes evolve independently until the guarded join.
        test_recipe:
          setup:
            - "Branch, account, PARTS product with ample lot; DRAFT WILL_CALL order confirmed"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-400", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "BASKET-STD", product_family: "PARTS", base_price_cents: 2500 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 20 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 2 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${ord_id}/mark-loaded"
              payload: {}
              as: WarehouseLead
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/complete"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
            - call: "POST /pool-supply/orders/${ord_id}/invoice"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/orders/${ord_id}/pay"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/orders/${ord_id}/complete"
              payload: {}
              as: CounterRep
          assert:
            - "complete while payment_status == UNINVOICED fails: ${err} == ERR_ORDER_UNPAID"
            - "fulfillment_status stayed PICKED_LOADED and payment_status stayed UNINVOICED (dimensions independent)"
            - "After invoice → pay → complete: fulfillment COMPLETED with payment PAID (guarded join)"

      - name: warranty_more_info_cycle_loop
        grounds:
          - state_machines.WarrantyClaim
        distinguishing_aspect: |
          Cyclic machine: UNDER_REVIEW → MORE_INFO → UNDER_REVIEW may loop up
          to 3 times; the 4th start-review after 3 cycles must fail with
          ERR_CLAIM_INFO_CYCLE_EXHAUSTED — a loop-count-guarded cycle, not a
          linear pipeline.
        test_recipe:
          setup:
            - "Account, EQUIPMENT product, ACTIVE center carrying brand; claim submitted + under review"
          setup_api_calls:
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "SVC-401", account_type: "SERVICE_CO" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "PUMP-2HP", product_family: "EQUIPMENT", base_price_cents: 80000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/service-centers"
              payload: { center_name: "Desert Pump", region_code: "SW", authorized_brands: ["AquaFlow"], labor_rate_cents: 12000 }
              as: BranchManager
            - call: "POST /pool-supply/warranty-claims"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", serial_number: "SN-777", brand: "AquaFlow", purchase_date: "2026-02-01", failure_description: "leak at seal" }
              as: BranchManager
              captures: { claim_id: $.data.id }
            - call: "POST /pool-supply/warranty-claims/${claim_id}/start-review"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/warranty-claims/${claim_id}/request-info"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/warranty-claims/${claim_id}/supply-info"
              payload: { info_note: "photo 1" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /pool-supply/warranty-claims/${claim_id}/request-info"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/warranty-claims/${claim_id}/supply-info"
              payload: { info_note: "photo 2" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /pool-supply/warranty-claims/${claim_id}/request-info"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/warranty-claims/${claim_id}/supply-info"
              payload: { info_note: "photo 3" }
              as: Account
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /pool-supply/warranty-claims/${claim_id}/request-info"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/warranty-claims/${claim_id}/supply-info"
              payload: { info_note: "photo 4" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "4th supply-info rejected: ${err} == ERR_CLAIM_INFO_CYCLE_EXHAUSTED"
            - "Claim remains MORE_INFO with info_cycles == 3 (loop count enforced)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth≥3 from confirm; depth≥2 from
  # close-season)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirm_short_backorder_freezes_branch
        grounds:
          - state_machines.SalesOrder.DRAFT_to_CONFIRMED
          - state_machines.BackorderRequest
          - calculations.branch_posture
        distinguishing_aspect: |
          Depth-3 cascade: order CONFIRM → OrderLine shortage creates
          BackorderRequest(OPEN) → open units reach shortage_freeze_threshold →
          Branch.posture flips NORMAL→FROZEN; the ORIGINAL trigger (confirm)
          does not touch Branch.posture directly — the backorder mutation does.
        test_recipe:
          setup:
            - "Branch B; Product CHEMICAL with shortage_freeze_threshold = 10, low_stock_floor 0"
            - "Lot with only 3 units; DRAFT WILL_CALL order qty 13 → 10 units short"
            - "Branch posture NORMAL before confirm"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-500", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "ACID-4X1", product_family: "CHEMICAL", hazmat_class: "CORROSIVE_8", base_price_cents: 4000, shortage_freeze_threshold: 10 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 3 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 13 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
          assert:
            - "GET /pool-supply/orders/${ord_id}/lines → line[0].allocated_qty == 3, backordered_qty == 10"
            - "GET /pool-supply/backorder-requests?branch_id → 1 OPEN backorder qty_open == 10, priority_rank == 3 (PRO)"
            - "GET /pool-supply/branches/${br_id} → posture == FROZEN (cascaded through the backorder hop, not directly)"
            - "A SECOND order confirm after this fails with ERR_BRANCH_FROZEN (posture gates child ops)"

      - name: close_season_cascade_commitments_settle
        grounds:
          - state_machines.Branch.OPEN_to_CLOSED_SEASON
          - state_machines.SeasonalProgram.OPEN_to_CLOSED
          - state_machines.SeasonalCommitment
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: branch close-season →
          program OPEN→CLOSED → each COMMITTED commitment settles FULFILLED
          (fully consumed) or DEFAULTED (short); the commitment mutation is
          caused by the program transition, not by the branch action directly.
        test_recipe:
          setup:
            - "Branch B; program SP OPEN pool 10000; clock inside order window"
            - "Commitment C1 (acct1) 100 units fully consumed by an order driven CONFIRMED→INVOICED→PICKED_LOADED→PAID→COMPLETED (no lingering CONFIRMED/PICKED_LOADED orders to block close-season)"
            - "Commitment C2 (acct2) 100 units untouched"
            - "No OPEN/ALLOCATED backorders"
          setup_api_calls:
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-501", account_type: "DEALER" }
              as: BranchManager
              captures: { a1: $.data.id }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-502", account_type: "DEALER" }
              as: BranchManager
              captures: { a2: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "TAB-1IN", product_family: "CHEMICAL", base_price_cents: 1000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 10000 }
              as: WarehouseLead
            - call: "POST /pool-supply/seasonal-programs"
              payload: { branch_id: "${br_id}", program_name: "EB-2026", order_window_start: "2026-01-01T00:00:00Z", order_window_end: "2026-02-15T00:00:00Z", ship_window_start: "2026-03-01T00:00:00Z", ship_window_end: "2026-05-31T00:00:00Z", early_buy_discount_pct: 10, pool_cap_units: 10000 }
              as: BranchManager
              captures: { sp_id: $.data.id }
            - call: "POST /pool-supply/seasonal-programs/${sp_id}/open"
              payload: {}
              as: BranchManager
              captures: { sp_v: $.data.version }
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${a1}", committed_units: 100, expected_program_version: "${sp_v}" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "GET /pool-supply/seasonal-programs/${sp_id}"
              as: BranchManager
              captures: { sp_v2: $.data.version }
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${a2}", committed_units: 100, expected_program_version: "${sp_v2}" }
              as: BranchManager
              captures: { c2: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${a1}", channel: "WILL_CALL", requested_pickup_slot: "2026-01-10T15:00:00Z", commitment_id: "${c1}", lines: [ { product_id: "${prod_id}", qty: 100 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v_now: $.data.version }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v_now}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${ord_id}/invoice"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/orders/${ord_id}/mark-loaded"
              payload: {}
              as: WarehouseLead
            - call: "POST /pool-supply/orders/${ord_id}/pay"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/orders/${ord_id}/complete"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /pool-supply/branches/${br_id}/close-season"
              payload: {}
              as: BranchManager
          assert:
            - "Branch.${br_id}.status == CLOSED_SEASON"
            - "SeasonalProgram.${sp_id}.status == CLOSED"
            - "SeasonalCommitment.${c1}.status == FULFILLED (consumed_units == committed_units == 100)"
            - "SeasonalCommitment.${c2}.status == DEFAULTED (consumed 0 < 100)"
            - "Branch.seasonal_pool_units == 0 (both commitments left the COMMITTED pool)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state vs business_safety;
  # business_temporal vs business_fiscal)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_posture_confirm_cancelled_on_frozen_branch
        grounds:
          - validations[priority=5]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair state × business_constraint: a confirm on a CANCELLED
          order whose branch is also FROZEN must fail with the state
          error ERR_ORDER_NOT_DRAFT (priority 5), not ERR_BRANCH_FROZEN
          (priority 11) — the state check wins even though the posture gate
          would also fail.
        test_recipe:
          setup:
            - "Branch B hazmat-certified; product CORROSIVE_8 with shortage_freeze_threshold 1; lot with 0 units"
            - "Order ord1 confirmed (5 short → backorder ≥ threshold → FROZEN) then CANCELLED (backorder cancelled → posture back to NORMAL)"
            - "Order ord2 confirmed (5 short again → branch FROZEN once more)"
            - "ord1 is now CANCELLED (state violation) while branch is FROZEN (posture violation)"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-600", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "ACID-8", product_family: "CHEMICAL", hazmat_class: "CORROSIVE_8", base_price_cents: 4000, shortage_freeze_threshold: 1 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 0 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 5 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${ord_id}/cancel"
              payload: {}
              as: BranchManager
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v2: $.data.version }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T14:00:00Z", lines: [ { product_id: "${prod_id}", qty: 5 } ] }
              as: CounterRep
              captures: { ord2: $.data.id }
            - call: "POST /pool-supply/orders/${ord2}/confirm"
              payload: { expected_branch_version: "${br_v2}" }
              as: CounterRep
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v2}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORDER_NOT_DRAFT (state priority 5 wins over the now-FROZEN branch posture check at priority 11 and over OCC recheck)"
            - "Branch posture is FROZEN (threshold 1 met by ord2's backorder) yet the reported error is the state error, proving ordering"

      - name: temporal_vs_fiscal_commitment_window_vs_pool_cap
        grounds:
          - validations[priority=9]
          - validations[priority=14]
        distinguishing_aspect: |
          Category pair business_temporal × business_fiscal: a commitment
          created one second AFTER order_window_end on a program whose pool is
          already full must fail ERR_COMMITMENT_WINDOW_CLOSED (priority 9), not
          ERR_PROGRAM_POOL_EXHAUSTED (priority 14).
        test_recipe:
          setup:
            - "Branch; program OPEN window ends 2026-02-15T00:00:00Z, pool_cap 100"
            - "Existing commitment of 100 units fills the pool exactly"
            - "Clock set to 2026-02-15T00:00:01Z (window closed)"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-601", account_type: "DEALER" }
              as: BranchManager
              captures: { a1: $.data.id }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-602", account_type: "DEALER" }
              as: BranchManager
              captures: { a2: $.data.id }
            - call: "POST /pool-supply/seasonal-programs"
              payload: { branch_id: "${br_id}", program_name: "EB", order_window_start: "2026-01-01T00:00:00Z", order_window_end: "2026-02-15T00:00:00Z", ship_window_start: "2026-03-01T00:00:00Z", ship_window_end: "2026-05-31T00:00:00Z", early_buy_discount_pct: 10, pool_cap_units: 100 }
              as: BranchManager
              captures: { sp_id: $.data.id }
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/seasonal-programs/${sp_id}/open"
              payload: {}
              as: BranchManager
              captures: { sp_v: $.data.version }
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${a1}", committed_units: 100, expected_program_version: "${sp_v}" }
              as: BranchManager
            - call: "GET /pool-supply/seasonal-programs/${sp_id}"
              as: BranchManager
              captures: { sp_v2: $.data.version }
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:01Z" }
              as: BranchManager
          trigger:
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${a2}", committed_units: 10, expected_program_version: "${sp_v2}" }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMMITMENT_WINDOW_CLOSED"
            - "Pool is also exhausted (100/100 used) yet the temporal error wins — priority 9 beats priority 14"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (tier threshold >= on account_tier;
  # zero-qty / empty-collection edge on waterfall sweep)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: tier_threshold_exact_boundary_is_elite
        grounds:
          - calculations.account_tier_recompute
        distinguishing_aspect: |
          Metric = ytd_volume_cents threshold: an invoice that lands the
          account EXACTLY on 2000000c is ELITE (>=), while 1999999c stays PRO.
          Reachable via POST /orders/{id}/invoice.
        test_recipe:
          setup:
            - "Branch, account DLR; product base 1999999c (order 1) and product base 1c... simpler: two orders 1999999 and 1"
            - "Order1 confirmed+invoiced at subtotal 1999999 → still PRO"
            - "Order2 of 1c invoiced → cumulative 2000000 exactly → ELITE"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-700", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "HEATER-A", product_family: "EQUIPMENT", base_price_cents: 1999999 }
              as: BranchManager
              captures: { p1: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "SCREW-1", product_family: "PARTS", base_price_cents: 1 }
              as: BranchManager
              captures: { p2: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${p1}", lot_code: "L1", qty_on_hand: 5 }
              as: WarehouseLead
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${p2}", lot_code: "L2", qty_on_hand: 100 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${p1}", qty: 1 } ] }
              as: CounterRep
              captures: { o1: $.data.id }
            - call: "POST /pool-supply/orders/${o1}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${o1}/invoice"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T14:00:00Z", lines: [ { product_id: "${p2}", qty: 1 } ] }
              as: CounterRep
              captures: { o2: $.data.id }
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v2: $.data.version }
            - call: "POST /pool-supply/orders/${o2}/confirm"
              payload: { expected_branch_version: "${br_v2}" }
              as: CounterRep
          trigger:
            - call: "POST /pool-supply/orders/${o2}/invoice"
              payload: {}
              as: BranchManager
          assert:
            - "After order1 invoice (1999999): Account.tier == PRO"
            - "After order2 invoice (cumulative exactly 2000000): Account.tier == ELITE (>= boundary inclusive)"
            - "Account.ytd_volume_cents == 2000000"

      - name: waterfall_zero_available_empty_grant
        grounds:
          - calculations.backorder_waterfall_allocation
          - errors[ERR_LOT_EMPTY]
        distinguishing_aspect: |
          Metric = qty_available zero-quantity edge (a different metric than
          cents): manual allocate against a lot whose qty_available == 0 is
          rejected with ERR_LOT_EMPTY rather than granting 0 units, and a
          replenish sweep that adds exactly enough for the first-ranked
          backorder leaves the second at qty_open unchanged. Reachable via
          POST /backorder-requests/{id}/allocate.
        test_recipe:
          setup:
            - "Branch; product shortage_freeze_threshold high (1000); lot L with 0 on hand"
            - "Order A qty 5 confirmed → full short → backorder BO_A OPEN rank 3"
            - "Manual allocate BO_A against empty L → ERR_LOT_EMPTY"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-701", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "FILTER-CART", product_family: "PARTS", base_price_cents: 4500, shortage_freeze_threshold: 1000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L-EMPTY", qty_on_hand: 0 }
              as: WarehouseLead
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 5 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "GET /pool-supply/backorder-requests"
              payload: {}
              as: WarehouseLead
              captures: { bo_id: "$.data[0].id" }
          trigger:
            - call: "POST /pool-supply/backorder-requests/${bo_id}/allocate"
              payload: { lot_id: "${lot_id}", expected_stock_lot_version: "${lot_v}" }
              as: WarehouseLead
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LOT_EMPTY"
            - "BackorderRequest.${bo_id}.qty_open == 5 unchanged; status stays OPEN"
            - "StockLot.${lot_id}.qty_available == 0 and lot.version unchanged"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Order→Branch posture gate;
  # WarrantyClaim→ServiceCenter suspension gate — different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_gated_by_branch_posture
        grounds:
          - state_machines.SalesOrder.DRAFT_to_CONFIRMED
          - entities.Branch.fields.posture
        distinguishing_aspect: |
          Entity pair SalesOrder→Branch: a DRAFT order on a FROZEN branch
          cannot CONFIRM (ERR_BRANCH_FROZEN), while CONSTRAINED posture still
          allows confirm — the gate depends on the PARENT entity's derived
          state, not the order's own fields.
        test_recipe:
          setup:
            - "Branch; product A shortage_freeze_threshold 5; lot with 0 units"
            - "Order1 qty 5 confirm → 5 backordered → branch FROZEN"
            - "Order2 (different in-stock product B) DRAFT, confirm attempted while FROZEN"
            - "Then replenish product A lot to clear the backorder via sweep → posture NORMAL → order2 confirm succeeds"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-800", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "CHLOR-G", product_family: "CHEMICAL", base_price_cents: 3000, shortage_freeze_threshold: 5 }
              as: BranchManager
              captures: { pa: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "NET-STD", product_family: "PARTS", base_price_cents: 1500 }
              as: BranchManager
              captures: { pb: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${pa}", lot_code: "LA", qty_on_hand: 0 }
              as: WarehouseLead
              captures: { lot_a: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${pb}", lot_code: "LB", qty_on_hand: 50 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${pa}", qty: 5 } ] }
              as: CounterRep
              captures: { o1: $.data.id }
            - call: "POST /pool-supply/orders/${o1}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T14:00:00Z", lines: [ { product_id: "${pb}", qty: 1 } ] }
              as: CounterRep
              captures: { o2: $.data.id }
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v2: $.data.version }
            - call: "POST /pool-supply/orders/${o2}/confirm"
              payload: { expected_branch_version: "${br_v2}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /pool-supply/stock-lots/${lot_a}/replenish"
              payload: { add_qty: 5 }
              as: WarehouseLead
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v3: $.data.version, posture_now: $.data.posture }
            - call: "POST /pool-supply/orders/${o2}/confirm"
              payload: { expected_branch_version: "${br_v3}" }
              as: CounterRep
          assert:
            - "First confirm of o2 failed: ${err} == ERR_BRANCH_FROZEN"
            - "Replenish sweep auto-allocated the OPEN backorder (BO CLOSED), posture recomputed to NORMAL: ${posture_now} == NORMAL"
            - "Second confirm of o2 succeeds; fulfillment_status == CONFIRMED"

      - name: claim_approve_gated_by_center_status
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - entities.WarrantyClaim.fields.assigned_center_id
        distinguishing_aspect: |
          Entity pair WarrantyClaim→ServiceCenter: approving a claim whose
          assigned center has been SUSPENDED since assignment fails with
          ERR_CENTER_SUSPENDED — a cross-entity state guard on a different
          pair than SalesOrder→Branch.
        test_recipe:
          setup:
            - "Account, EQUIPMENT product, center ACTIVE at submit; claim moved to UNDER_REVIEW"
            - "Center then SUSPENDED via PATCH"
          setup_api_calls:
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "SVC-801", account_type: "SERVICE_CO" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "PUMP-3HP", product_family: "EQUIPMENT", base_price_cents: 120000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/service-centers"
              payload: { center_name: "Cactus Repair", region_code: "SW", authorized_brands: ["AquaFlow"], labor_rate_cents: 11000 }
              as: BranchManager
              captures: { sc_id: $.data.id }
            - call: "POST /pool-supply/warranty-claims"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", serial_number: "SN-555", brand: "AquaFlow", purchase_date: "2026-01-20", failure_description: "motor hum" }
              as: BranchManager
              captures: { claim_id: $.data.id }
            - call: "POST /pool-supply/warranty-claims/${claim_id}/start-review"
              payload: {}
              as: BranchManager
            - call: "PATCH /pool-supply/service-centers/${sc_id}"
              payload: { status: "SUSPENDED" }
              as: BranchManager
          trigger:
            - call: "POST /pool-supply/warranty-claims/${claim_id}/approve"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CENTER_SUSPENDED"
            - "WarrantyClaim.${claim_id}.status stays UNDER_REVIEW"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (commitment window inclusive-boundary
  # semantics on SeasonalProgram; route_date window on Branch peak season —
  # different interval semantics: closed datetime window vs seasonal MM-DD
  # window with day-granularity)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: commitment_window_inclusive_end_boundary
        grounds:
          - validations[priority=9]
          - entities.SeasonalProgram.fields.order_window_end
        distinguishing_aspect: |
          Interval semantics = closed datetime window: a commitment created
          exactly AT order_window_end (2026-02-15T00:00:00Z) is accepted
          (inclusive), while one second later is rejected — pinning the
          inclusive-end convention of the commitment resource's window.
        test_recipe:
          setup:
            - "Branch; program OPEN with order_window_end 2026-02-15T00:00:00Z, pool 1000"
            - "Clock set exactly to 2026-02-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-900", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/seasonal-programs"
              payload: { branch_id: "${br_id}", program_name: "EB", order_window_start: "2026-01-01T00:00:00Z", order_window_end: "2026-02-15T00:00:00Z", ship_window_start: "2026-03-01T00:00:00Z", ship_window_end: "2026-05-31T00:00:00Z", early_buy_discount_pct: 10, pool_cap_units: 1000 }
              as: BranchManager
              captures: { sp_id: $.data.id }
            - call: "POST /pool-supply/seasonal-programs/${sp_id}/open"
              payload: {}
              as: BranchManager
              captures: { sp_v: $.data.version }
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${acct_id}", committed_units: 50, expected_program_version: "${sp_v}" }
              as: BranchManager
              captures: { cmt_id: $.data.id }
          assert:
            - "Commitment ${cmt_id} created at the exact window end — inclusive end accepted"
            - "SeasonalCommitment.${cmt_id}.status == COMMITTED"

      - name: route_date_season_window_day_boundary
        grounds:
          - validations[priority=8]
          - entities.Branch.fields.peak_season_end
        distinguishing_aspect: |
          Interval semantics = MM-DD seasonal day-granularity window (different
          from the datetime commitment window): a hazmat ROUTE_DELIVERY with
          route_date == 2026-09-30 (peak_season_end 09-30) is accepted, but
          2026-10-01 is rejected ERR_ROUTE_DATE_OUTSIDE_WINDOW — day-precision
          seasonal arithmetic vs datetime-precision window arithmetic.
        test_recipe:
          setup:
            - "Branch hazmat-certified, peak 04-01..09-30; clock 2026-09-01"
            - "Account with hazmat license expiry 2027-01-01"
            - "Hazmat product, ample lot; two DRAFT ROUTE orders: route_date 2026-09-30 and 2026-10-01"
          setup_api_calls:
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-901", account_type: "DEALER", hazmat_delivery_license_expiry: "2027-01-01" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "ACID-M", product_family: "CHEMICAL", hazmat_class: "CORROSIVE_8", base_price_cents: 4000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 100 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "ROUTE_DELIVERY", route_date: "2026-09-30", lines: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: RouteDispatcher
              captures: { o_ok: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "ROUTE_DELIVERY", route_date: "2026-10-01", lines: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: RouteDispatcher
              captures: { o_bad: $.data.id }
          trigger:
            - call: "POST /pool-supply/orders/${o_ok}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: RouteDispatcher
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v2: $.data.version }
            - call: "POST /pool-supply/orders/${o_bad}/confirm"
              payload: { expected_branch_version: "${br_v2}" }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Order ${o_ok} (route_date == peak end 09-30) confirms: fulfillment CONFIRMED (end day inclusive)"
            - "Order ${o_bad} (route_date 10-01) fails: ${err} == ERR_ROUTE_DATE_OUTSIDE_WINDOW"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (conserved lot units across confirm/cancel;
  # conserved commitment pool units across supersede)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: lot_units_conserved_across_confirm_cancel
        grounds:
          - state_machines.SalesOrder.CONFIRMED_to_CANCELLED
          - entities.StockLot.fields.qty_available
        distinguishing_aspect: |
          Conserved quantity = lot available units: confirm(qty 8) then cancel
          must restore qty_available EXACTLY to its pre-confirm value
          (reservation created then fully released), i.e. available_after ==
          available_before; any drift violates the invariant.
        test_recipe:
          setup:
            - "Branch, account, PARTS product; lot 50 units"
            - "Order WILL_CALL qty 8"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-1000", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "VAC-HEAD", product_family: "PARTS", base_price_cents: 6000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 50 }
              as: WarehouseLead
              captures: { lot_id: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 8 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "GET /pool-supply/stock-lots/${lot_id}"
              as: WarehouseLead
              captures: { avail_mid: $.data.qty_available }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/cancel"
              payload: {}
              as: BranchManager
            - call: "GET /pool-supply/stock-lots/${lot_id}"
              as: WarehouseLead
              captures: { avail_end: $.data.qty_available }
          assert:
            - "After confirm: ${avail_mid} == 42 (50 - 8 reserved)"
            - "After cancel: ${avail_end} == 50 — invariant qty_available restored exactly (no reservation drift)"
            - "qty_reserved_willcall returns to 0"

      - name: program_pool_conserved_across_supersede
        grounds:
          - state_machines.SeasonalCommitment.COMMITTED_to_SUPERSEDED
          - entities.Branch.fields.seasonal_pool_units
        distinguishing_aspect: |
          Conserved quantity = program committed-units pool headroom: a
          supersede that replaces 100 committed units with 150 must leave
          Branch.seasonal_pool_units and pool consumption reflecting exactly
          150 (not 100+150), i.e. pool_used_after == pool_used_before - 100 +
          150; the SUPERSEDED commitment no longer counts.
        test_recipe:
          setup:
            - "Branch; program OPEN pool_cap 1000, clock inside window"
            - "Commitment C1 100 units for account A (COMMITTED)"
          setup_api_calls:
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-1001", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/seasonal-programs"
              payload: { branch_id: "${br_id}", program_name: "EB", order_window_start: "2026-01-01T00:00:00Z", order_window_end: "2026-02-15T00:00:00Z", ship_window_start: "2026-03-01T00:00:00Z", ship_window_end: "2026-05-31T00:00:00Z", early_buy_discount_pct: 10, pool_cap_units: 1000 }
              as: BranchManager
              captures: { sp_id: $.data.id }
            - call: "POST /pool-supply/seasonal-programs/${sp_id}/open"
              payload: {}
              as: BranchManager
              captures: { sp_v: $.data.version }
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${acct_id}", committed_units: 100, expected_program_version: "${sp_v}" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "GET /pool-supply/seasonal-programs/${sp_id}"
              as: BranchManager
              captures: { sp_v2: $.data.version }
          trigger:
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${acct_id}", committed_units: 150, expected_program_version: "${sp_v2}" }
              as: BranchManager
              captures: { c2: $.data.id }
          assert:
            - "SeasonalCommitment.${c1}.status == SUPERSEDED"
            - "SeasonalCommitment.${c2}.status == COMMITTED and committed_units == 150"
            - "Branch.seasonal_pool_units == 150 (NOT 250) — supersede conserves pool accounting"
