            - "WorkOrder.${w1}.process_status == COATED and compliance_status == SCREENED after the refusal, and GlassLot.${g1} still reads reserved 3 / consumed 0 / available 17"
            - "the licence decision returns HTTP 200 with ExportClassification.${x1}.classification_status == LICENSE_APPROVED, license_number BIS-2540-001 and decided_by_user_id eco-002"
            - "WorkOrder.${w1}.compliance_status == CLEARED immediately after the decision, with process_status still COATED (the cascade touched only the compliance dimension)"
            - "the second release-to-assembly returns HTTP 200 with process_status RELEASED_TO_ASSEMBLY"
            - "GlassLot.${g1} then reads reserved_blank_count 0, consumed_blank_count 2, scrapped_blank_count 0 and available_blank_count 18, so the spare blank came back"
            - "20 == 18 + 0 + 2 + 0, so the blank_conservation_ledger invariant still holds"

