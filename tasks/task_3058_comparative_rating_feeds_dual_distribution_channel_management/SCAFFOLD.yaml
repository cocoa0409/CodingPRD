      - { name: earned_commission_cents, type: integer, source: computed, default: null, description: "Pro-rata earned commission retained by the original agent at AOR transfer" }
      - { name: transferred_commission_cents, type: integer, source: computed, default: null, description: "Unearned commission moved to the receiving agent at AOR transfer" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CarrierProduct
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /products/{id}/activate"
        actor: RatingManager
        preconditions:
          - "coverage_rates must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "increments CarrierProduct.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /products/{id}/withdraw"
        actor: RatingManager
        preconditions:
          - "No Quote referencing this product is in QUOTED, REFERRED_TO_AGENT or AGENT_QUOTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments CarrierProduct.version by 1"

  - entity: ComparativeRater
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Raters carry no lifecycle status; their `version` is the OCC anchor for rate-feed-publication creation (see §1.2.1)."

  - entity: RateFeedPublication
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RECALLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rate-feed-publications/{id}/publish"
        actor: RatingManager
        preconditions:
          - "Product referenced by product_id must be ACTIVE (ERR_PRODUCT_NOT_ACTIVE)"
          - "No other PUBLISHED publication may remain for the same (rater_id, product_id) after this publish: the prior PUBLISHED one is superseded by this transition"
        side_effects:
          - "published_at = logical clock now"
          - "CASCADE hop 1: the previously PUBLISHED RateFeedPublication for the same (rater_id, product_id), if any, transitions PUBLISHED -> SUPERSEDED and its version increments"
          - "CASCADE hop 2: every Quote with rate_feed_publication_id == that superseded publication and status IN {QUOTED, AGENT_QUOTED} has rate_stale set to true and its version increments"
          - "increments RateFeedPublication.version by 1"
      - from: DRAFT
        to: RECALLED
        trigger: "POST /rate-feed-publications/{id}/recall"
        actor: RatingManager
        preconditions: []
        side_effects:
          - "increments RateFeedPublication.version by 1"
      - from: PUBLISHED
        to: RECALLED
        trigger: "POST /rate-feed-publications/{id}/recall"
        actor: RatingManager
        preconditions: []
        side_effects:
          - "every Quote with rate_feed_publication_id == this publication and status IN {QUOTED, AGENT_QUOTED} has rate_stale set to true"
          - "increments RateFeedPublication.version by 1"

  - entity: Agent
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: APPOINTED
        trigger: "POST /agents/{id}/appoint"
        actor: UnderwritingReviewer
        preconditions:
          - "Agent has at least one AgentAppointment with status ACTIVE (ERR_AGENT_NOT_APPOINTED_IN_STATE)"
        side_effects:
          - "increments Agent.version by 1"
      - from: APPOINTED
        to: SUSPENDED
        trigger: "POST /agents/{id}/suspend OR POST /portfolio-reviews/{id}/take-action with action=SUSPEND"
        actor: UnderwritingReviewer
        preconditions: []
        side_effects:
          - "increments Agent.version by 1"
      - from: SUSPENDED
        to: APPOINTED
        trigger: "POST /agents/{id}/reinstate"
        actor: UnderwritingReviewer
        preconditions:
          - "Agent has at least one AgentAppointment with status ACTIVE (ERR_AGENT_NOT_APPOINTED_IN_STATE)"
        side_effects:
          - "increments Agent.version by 1"
      - from: APPOINTED
        to: TERMINATED
        trigger: "POST /agents/{id}/terminate OR POST /portfolio-reviews/{id}/take-action with action=TERMINATE"
        actor: UnderwritingReviewer
        preconditions:
          - "No BundlePlacement with agent_id == this agent is in PLACED status (ERR_AGENT_HAS_ACTIVE_PLACEMENTS)"
        side_effects:
          - "terminated_reason recorded"
          - "CASCADE hop 1 (agent -> appointments): every AgentAppointment of this agent in ACTIVE status transitions ACTIVE -> TERMINATED with terminated_reason='AGENT_TERMINATED'"
          - "CASCADE hop 2 (appointments -> schedules): every CommissionSchedule of this agent in ACTIVE status whose line_of_business is no longer covered by any remaining ACTIVE appointment transitions ACTIVE -> VOIDED"
          - "CASCADE hop 3 (schedules -> statements): every CommissionStatement of this agent in DRAFT status transitions DRAFT -> STALE (must be regenerated against surviving schedules)"
          - "increments Agent.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /agents/{id}/terminate OR POST /portfolio-reviews/{id}/take-action with action=TERMINATE"
        actor: UnderwritingReviewer
        preconditions:
          - "No BundlePlacement with agent_id == this agent is in PLACED status (ERR_AGENT_HAS_ACTIVE_PLACEMENTS)"
        side_effects:
          - "same cascade as APPOINTED -> TERMINATED"
          - "increments Agent.version by 1"

  - entity: AgentAppointment
    initial_state: ACTIVE
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /appointments/{id}/terminate OR cascade from Agent termination"
        actor: UnderwritingReviewer | system
        preconditions: []
        side_effects:
          - "terminated_reason recorded when terminated directly"
          - "increments AgentAppointment.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (derived on read: when effective_end is not null and effective_end <= logical clock now, the appointment reads as EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "EXPIRED is evaluated lazily on read; advancing the logical clock past effective_end flips observed status without a write."

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [BOUND, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /quotes/{id}/submit"
        actor: Consumer | Agent
        preconditions:
          - "Product must be ACTIVE (ERR_PRODUCT_NOT_ACTIVE)"
          - "Product channel_availability must include quote.channel (ERR_CHANNEL_NOT_AVAILABLE)"
          - "If channel == AGENT: quote.agent_id must reference an APPOINTED, non-TERMINATED Agent (ERR_AGENT_TERMINATED)"
          - "If channel == AGENT: that agent must hold an ACTIVE appointment for (product.state_code, product.line_of_business) (ERR_AGENT_NOT_APPOINTED_IN_STATE)"
          - "If channel == AGENT: a RateFeedPublication for (some rater, product_id) must be PUBLISHED with effective_start <= now < effective_end; the earliest-published such publication is pinned to rate_feed_publication_id (ERR_FEED_NOT_PUBLISHED). Tie-break when several rater feeds qualify: lowest published_at, then publication created_at ASC"
          - "If channel == DIRECT and product.direct_channel_max_premium_cents is not null: computed premium must be <= the cap (ERR_PREMIUM_CAP_EXCEEDED)"
        side_effects:
          - "quoted_premium_cents computed per calculations.channel_quote_premium"
          - "quoted_at = logical clock now; expires_at = quoted_at + 30 days; rate_stale = false"
          - "increments Quote.version by 1"
      - from: QUOTED
        to: DRAFT
        trigger: "POST /quotes/{id}/re-rate"
        actor: Consumer | Agent
        preconditions: []
        side_effects:
          - "quoted_premium_cents = null; quoted_at = null; expires_at = null; rate_stale = false; rate_feed_publication_id = null"
          - "increments Quote.version by 1"
      - from: AGENT_QUOTED
        to: REFERRED_TO_AGENT
        trigger: "POST /quotes/{id}/re-rate (agent-side re-rate preserves the referral)"
        actor: Agent
        preconditions: []
        side_effects:
          - "quoted_premium_cents = null; quoted_at = null; expires_at = null; rate_stale = false; rate_feed_publication_id = null; agent_id and referral_snapshot preserved"
          - "increments Quote.version by 1"
      - from: QUOTED
        to: REFERRED_TO_AGENT
        trigger: "POST /quotes/{id}/refer-to-agent"
        actor: Consumer
        preconditions:
          - "quote.channel == DIRECT (ERR_INVALID_STATE_TRANSITION)"
          - "agent_id in payload must reference an APPOINTED Agent (ERR_AGENT_TERMINATED)"
          - "that Agent must hold an ACTIVE appointment for (product.state_code, product.line_of_business) (ERR_AGENT_NOT_APPOINTED_IN_STATE)"
        side_effects:
          - "agent_id set; channel flips to AGENT"
          - "referral_snapshot = { coverages: <current coverages>, quoted_premium_cents: <DIRECT premium> } (quote data reuse payload)"
          - "increments Quote.version by 1"
      - from: REFERRED_TO_AGENT
        to: AGENT_QUOTED
        trigger: "POST /quotes/{id}/agent-quote"
        actor: Agent
        preconditions:
          - "Acting Agent must be the quote's agent_id (ERR_OWNERSHIP_MISMATCH)"
          - "Agent must still be APPOINTED (ERR_AGENT_TERMINATED) and hold an ACTIVE appointment for (product.state_code, product.line_of_business) (ERR_AGENT_NOT_APPOINTED_IN_STATE)"
          - "A PUBLISHED RateFeedPublication covering now must exist for the product (ERR_FEED_NOT_PUBLISHED); pinned per the same selector as submit"
          - "If payload coverages provided and differ from referral_snapshot.coverages, the new coverages are adopted; if omitted, referral_snapshot.coverages are reused verbatim (data reuse)"
        side_effects:
          - "quoted_premium_cents recomputed with AGENT channel factors"
          - "quoted_at = now; expires_at = quoted_at + 30 days; rate_stale = false"
          - "increments Quote.version by 1"
      - from: QUOTED
        to: BOUND
        trigger: "POST /quotes/{id}/bind (consumer-side direct bind)"
        actor: Consumer
        preconditions:
          - "Acting Consumer must be the quote's consumer_id (ERR_OWNERSHIP_MISMATCH)"
          - "quote.channel == DIRECT (ERR_INVALID_STATE_TRANSITION)"
          - "logical clock now < expires_at (ERR_QUOTE_EXPIRED)"
          - "rate_stale == false (ERR_RATE_STALE)"
        side_effects:
          - "Policy created: IN_FORCE, inception_at = now, term_days = 365, written_premium_cents = quoted_premium_cents minus DIRECT telematics up-front discount (15%) when telematics_opt_in"
          - "If telematics_opt_in: TelematicsEnrollment created ENROLLED with upfront_discount_cents = 15% of quoted_premium_cents (round_half_up)"
          - "increments Quote.version by 1"
      - from: AGENT_QUOTED
        to: BOUND
        trigger: "POST /quotes/{id}/bind (agent-side bind)"
        actor: Agent
        preconditions:
          - "Acting Agent must be the quote's agent_id (ERR_OWNERSHIP_MISMATCH)"
          - "logical clock now < expires_at (ERR_QUOTE_EXPIRED)"
          - "rate_stale == false (ERR_RATE_STALE)"
          - "Agent still APPOINTED with ACTIVE appointment for (product.state_code, product.line_of_business) (ERR_AGENT_TERMINATED / ERR_AGENT_NOT_APPOINTED_IN_STATE)"
        side_effects:
          - "Policy created: IN_FORCE, inception_at = now, written_premium_cents = quoted_premium_cents (AGENT channel realizes telematics discount only at scoring, never up-front)"
          - "If telematics_opt_in: TelematicsEnrollment created ENROLLED with upfront_discount_cents = 0"
          - "increments Quote.version by 1"
      - from: QUOTED
        to: WITHDRAWN
        trigger: "POST /quotes/{id}/withdraw"
        actor: Consumer | Agent
        preconditions: []
        side_effects:
          - "increments Quote.version by 1"
      - from: REFERRED_TO_AGENT
        to: WITHDRAWN
        trigger: "POST /quotes/{id}/withdraw"
        actor: Consumer | Agent
        preconditions: []
        side_effects:
          - "increments Quote.version by 1"
      - from: AGENT_QUOTED
        to: WITHDRAWN
        trigger: "POST /quotes/{id}/withdraw"
        actor: Consumer | Agent
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: EXPIRED
        trigger: "system (derived on read / at bind attempt: when logical clock now >= expires_at the quote is EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "EXPIRED is evaluated lazily; a bind attempted with now >= expires_at fails with ERR_QUOTE_EXPIRED and the quote thereafter reads EXPIRED. REFERRED_TO_AGENT and AGENT_QUOTED expire the same way."

  - entity: Policy
    initial_state: IN_FORCE
    terminal_states: [CANCELLED]
    transitions:
      - from: IN_FORCE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Consumer | Agent | CarrierAdmin
        preconditions:
          - "For Consumer actor: consumer must own the policy (ERR_OWNERSHIP_MISMATCH); for Agent actor: agent must be policy.agent_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "cancelled_at = logical clock now"
          - "earned_premium_cents and unearned_premium_cents recomputed per calculations.earned_premium_proration"
          - "If a TelematicsEnrollment exists in ENROLLED or PARTICIPATING: forced to OPTED_OUT; any DIRECT up-front discount is NOT retro-clawed on the policy (it is inside written premium); adjustment_cents stays null"
          - "increments Policy.version by 1"

  - entity: Claim
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: CLOSED
        trigger: "POST /claims/{id}/close"
        actor: CarrierAdmin
        preconditions: []
        side_effects:
          - "incurred_amount_cents remains on the claim and continues to count toward loss-ratio windows"
          - "increments Claim.version by 1"

  - entity: TelematicsEnrollment
    initial_state: ENROLLED
    terminal_states: [SCORED, OPTED_OUT]
    transitions:
      - from: ENROLLED
        to: PARTICIPATING
        trigger: "POST /telematics-enrollments/{id}/activate-device"
        actor: Consumer | Agent
        preconditions:
          - "Policy must be IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
        side_effects:
          - "increments TelematicsEnrollment.version by 1"
      - from: PARTICIPATING
        to: SCORED
        trigger: "POST /telematics-enrollments/{id}/score"
        actor: System
        preconditions:
          - "Policy must be IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
          - "driving_score in [0, 100] (ERR_INVALID_REQUEST)"
        side_effects:
          - "driving_score recorded; discount_pct_applied per calculations.telematics_discount_realization"
          - "adjustment_cents computed per channel variant and recorded; Policy.updated_at refreshed"
          - "increments TelematicsEnrollment.version by 1"
      - from: ENROLLED
        to: OPTED_OUT
        trigger: "POST /telematics-enrollments/{id}/opt-out OR policy cancellation"
        actor: Consumer | Agent | system
        preconditions: []
        side_effects:
          - "For DIRECT channel with upfront_discount_cents > 0 and explicit opt-out (not policy-cancel): adjustment_cents = +upfront_discount_cents (debit restoring premium)"
          - "increments TelematicsEnrollment.version by 1"
      - from: PARTICIPATING
        to: OPTED_OUT
        trigger: "POST /telematics-enrollments/{id}/opt-out OR policy cancellation"
        actor: Consumer | Agent | system
        preconditions: []
        side_effects:
          - "same opt-out debit rule as ENROLLED -> OPTED_OUT"
          - "increments TelematicsEnrollment.version by 1"

  - entity: CommissionStatement
    initial_state: DRAFT
    terminal_states: [CLAWED_BACK, STALE]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /commission-statements/{id}/finalize"
        actor: CarrierAdmin
        preconditions: []
        side_effects:
          - "line_items, written_premium_cents, commission_cents, net_payable_cents locked"
          - "increments CommissionStatement.version by 1"
      - from: FINALIZED
        to: PAID
        trigger: "POST /commission-statements/{id}/pay"
        actor: CarrierAdmin
        preconditions:
          - "net_payable_cents > 0 (ERR_NOTHING_TO_PAY)"
        side_effects:
          - "increments CommissionStatement.version by 1"
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /commission-statements/{id}/claw-back"
        actor: CarrierAdmin
        preconditions:
          - "policy_id in payload must appear in line_items (ERR_INVALID_REQUEST)"
          - "the referenced Policy must be CANCELLED (ERR_POLICY_NOT_IN_FORCE)"
          - "the policy must not already have clawback_cents > 0 (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "clawback_cents = per_policy_commission_cents - round_half_up(per_policy_commission_cents * days_in_force / term_days); recorded on both Policy and statement"
          - "net_payable_cents recomputed = commission_cents - clawback_cents"
          - "increments CommissionStatement.version by 1"
      - from: DRAFT
        to: STALE
        trigger: "system (cascade hop 3 of Agent termination)"
        actor: system
        preconditions: []
        side_effects:
          - "increments CommissionStatement.version by 1"

  - entity: ContingentBonusPool
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /contingent-bonus-pools/{id}/settle"
        actor: CarrierAdmin
        preconditions: []
        side_effects:
          - "One BonusPayout created per Agent that holds a contingent_bonus_eligible ACTIVE CommissionSchedule and has earned_premium_trailing_cents > 0"
          - "undistributed_cents = pool_total_cents - sum(payout_cents)"
          - "increments ContingentBonusPool.version by 1"

  - entity: PortfolioReview
    initial_state: OPEN
    terminal_states: [ACTION_TAKEN]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /portfolio-reviews/{id}/issue-findings"
        actor: UnderwritingReviewer
        preconditions: []
        side_effects:
          - "increments PortfolioReview.version by 1"
      - from: FINDINGS_ISSUED
        to: ACTION_TAKEN
        trigger: "POST /portfolio-reviews/{id}/take-action"
        actor: UnderwritingReviewer
        preconditions:
          - "actioning reviewer's X-User-ID must differ from opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If action == TERMINATE: Agent termination preconditions apply (no PLACED BundlePlacements -> ERR_AGENT_HAS_ACTIVE_PLACEMENTS)"
        side_effects:
          - "actioned_by_user_id recorded"
          - "If action == SUSPEND and Agent is APPOINTED: Agent APPOINTED -> SUSPENDED"
          - "If action == TERMINATE: Agent -> TERMINATED with full cascade (see Agent state machine)"
          - "If action == CONTINUE: no Agent state change"
          - "increments PortfolioReview.version by 1"

  - entity: BundlePlacement
    initial_state: QUOTED
    terminal_states: [AOR_TRANSFERRED, DECLINED]
    transitions:
      - from: QUOTED
        to: PLACED
        trigger: "POST /bundle-placements/{id}/place"
        actor: Agent
        preconditions:
          - "Acting Agent must be the placement's agent_id (ERR_OWNERSHIP_MISMATCH)"
          - "Policy must be IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
        side_effects:
          - "increments BundlePlacement.version by 1"
      - from: PLACED
        to: AOR_TRANSFERRED
        trigger: "POST /bundle-placements/{id}/transfer-aor"
        actor: CarrierAdmin
        preconditions:
          - "new_agent_id must reference an APPOINTED Agent != current agent_id (ERR_AOR_NOT_ALLOWED)"
          - "new agent must hold an ACTIVE appointment for the policy product's (state_code, line_of_business) (ERR_AGENT_NOT_APPOINTED_IN_STATE)"
        side_effects:
          - "earned/transferred commission computed per calculations.aor_commission_transfer"
          - "agent_id := new_agent_id; transferred_to_agent_id := new_agent_id"
          - "increments BundlePlacement.version by 1"
      - from: QUOTED
        to: DECLINED
        trigger: "POST /bundle-placements/{id}/decline"
        actor: Agent | CarrierAdmin
        preconditions: []
        side_effects:
          - "increments BundlePlacement.version by 1"
      - from: PLACED
        to: DECLINED
        trigger: "POST /bundle-placements/{id}/decline"
        actor: CarrierAdmin
        preconditions: []
        side_effects:
          - "Unearned commission remains with the current agent of record; no transfer computed"
          - "increments BundlePlacement.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true create-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: commission-schedule-create-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /agents/{id}/commission-schedules"
    occ_field: expected_agent_version
    description: |
      Creating a CommissionSchedule for an Agent whose version has advanced
      since the client last observed it is rejected. A successful creation
      supersedes the prior ACTIVE schedule for the same (agent, line_of_business),
      so a client working from a stale view of the agent's schedule set would
      supersede the wrong baseline; the stale expected_agent_version surfaces
      this before any supersede occurs.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rate-feed-publication-create-stale-rater
    parent_entity: ComparativeRater
    write_endpoint: "POST /raters/{id}/rate-feed-publications"
    occ_field: expected_rater_version
    description: |
      Creating a RateFeedPublication against a ComparativeRater whose version
      has advanced since the client last observed it is rejected. Publication
      windows are validated against the rater's full publication set (overlap
      and 24-hour gap rules); a client that computed its window from a stale
      publication set would validate against the wrong baseline, so the stale
      expected_rater_version is refused up front.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: channel_quote_premium
    trigger: "POST /quotes/{id}/submit and POST /quotes/{id}/agent-quote"
    algorithm: tiered_pricing
    formula: |
      channel_factor =
        if quote.channel == DIRECT: 1 - product.direct_discount_pct
        if quote.channel == AGENT:  1 + product.agent_load_pct
                                      - (product.bundle_credit_pct if quote.bundled_home_intended else 0)
      for each coverage in quote.coverages:
        base = product.coverage_rates[coverage.coverage_code][coverage.tier]
        line_cents = round_half_up(base * channel_factor)     # PINNED: per-line rounding FIRST
      premium_cents = sum(line_cents)                          # then sum the rounded lines
      premium_cents = max(premium_cents, product.min_premium_cents)  # floor applied AFTER the sum
      return premium_cents
    input_set: "quote.coverages; CarrierProduct rate table and channel factors"
    constants:
      DIRECT_TELEMATICS_UPFRONT_PCT: 0.15
    precision: "integer cents; per-line round_half_up BEFORE summing — the reverse order (sum raw, then round) is a rejected interpretation and yields different cents"
    variants: []

  - name: telematics_discount_realization
    trigger: "Policy creation (bind) for the up-front leg; POST /telematics-enrollments/{id}/score for the scoring leg; POST /telematics-enrollments/{id}/opt-out for the reversal leg"
    algorithm: threshold
    formula: |
      score_table(score):
        score >= 90            -> 0.20
        70 <= score <= 89      -> 0.10
        score <  70            -> 0.00
      At SCORED, both channels converge on the same FINAL premium:
        final_premium = round_half_up(quoted_premium_cents * (1 - score_table(driving_score)))
      but the path (and the observable intermediate numbers) differ by variant.
    input_set: "TelematicsEnrollment joined to its Policy and Quote"
    constants:
      DIRECT_UPFRONT_PCT: 0.15
      TIER_HIGH_MIN_SCORE: 90
      TIER_MID_MIN_SCORE: 70
    precision: "integer cents, round_half_up; score boundaries are >= (score == 90 earns 0.20, score == 89 earns 0.10)"
    variants:
      - name: direct_upfront
        when: "Policy.channel == DIRECT"
        difference: "15% participation discount is taken AT BIND: written_premium_cents = quoted_premium_cents - round_half_up(quoted_premium_cents * 0.15) and enrollment.upfront_discount_cents equals that discount. At SCORED: adjustment_cents = final_premium - written_premium_cents (negative = credit). Explicit opt-out before scoring: adjustment_cents = +upfront_discount_cents (debit)."
      - name: agent_at_scoring
        when: "Policy.channel == AGENT"
        difference: "No discount at bind: written_premium_cents = quoted_premium_cents and upfront_discount_cents = 0. At SCORED: adjustment_cents = final_premium - written_premium_cents (the whole discount realizes as a retroactive credit). Opt-out before scoring: adjustment_cents = 0."

  - name: commission_earned
    trigger: "POST /agents/{id}/commission-statements (statement generation)"
    algorithm: tiered_pricing
    formula: |
      eligible_policies = Policies with agent_id == agent, bound (Quote BOUND -> Policy created)
        with policy created_at in [period_start, period_end), ordered by Policy.created_at ASC
        (tie-break: Policy.created_at ASC — never id)
      tier_cursor = 0   # cumulative written premium across the statement period, per agent
      for each policy in order:
        remaining = policy.written_premium_cents
        policy_commission = 0
        for each tier in schedule.tiers (ascending up_to_cents, null = unbounded):
          tier_capacity = tier.up_to_cents - tier_cursor if tier.up_to_cents is not null else remaining
          slice = min(remaining, max(tier_capacity, 0))
          policy_commission += slice * tier.rate_pct
          tier_cursor += slice
          remaining -= slice
          if remaining == 0: break
        policy.per_policy_commission_cents = round_half_up(policy_commission)   # PINNED: round PER POLICY
      statement.commission_cents = sum(policy.per_policy_commission_cents)      # then sum the rounded values
      # The schedule used per policy: the agent's ACTIVE CommissionSchedule for the
      # policy product's line_of_business whose [effective_start, effective_end)
      # covers the policy's created_at. A policy with no covering schedule is
      # excluded from the statement entirely (not zero-rated).
    input_set: "Policies of the agent bound within [period_start, period_end); agent's ACTIVE CommissionSchedules"
    constants: {}
    precision: "integer cents; round_half_up PER POLICY then sum — aggregate-then-round is a rejected interpretation and yields different cents"
    variants: []

  - name: earned_premium_proration
    trigger: "POST /policies/{id}/cancel; also used inside trailing_loss_ratio and contingent_bonus_settlement"
    algorithm: chronological
    formula: |
      days_in_force = full days in [inception_at, cancelled_at)   # logical-clock calendar days
      earned_premium_cents  = round_half_up(written_premium_cents * days_in_force / term_days)
      unearned_premium_cents = written_premium_cents - earned_premium_cents
      While IN_FORCE (not cancelled): earned_premium_cents = written_premium_cents, unearned = 0.
      For trailing windows: earned_in_window(policy, window_start, window_end) =
        round_half_up(written_premium_cents * days_in([max(inception, window_start), min(window_end, cancelled_at or window_end))) / term_days)
    input_set: "the Policy; logical clock"
    constants:
      TERM_DAYS: 365
    precision: "integer cents, round_half_up; day counts use half-open [start, end) intervals"
    variants: []

  - name: trailing_loss_ratio
    trigger: "POST /agents/{id}/portfolio-reviews (computed at open); POST /contingent-bonus-pools/{id}/settle"
    algorithm: aggregation
    formula: |
      window = [as_of - 365 days, as_of]            # BOTH bounds inclusive
      earned = sum over the agent's Policies with inception_at in window of earned_in_window(policy, window_start, as_of)
      incurred = sum of incurred_amount_cents over Claims of those policies with reported_at in window
        (Claims count in BOTH REPORTED and CLOSED status)
      if earned == 0: trailing_loss_ratio = 0.0000  # empty-book rule
      else: trailing_loss_ratio = round(incurred / earned, 4)   # round_half_up at 4 decimals
    input_set: "Agent's Policies (any status) and their Claims; logical clock provides as_of"
    constants:
      WINDOW_DAYS: 365
    precision: "4 decimal places, round_half_up; BOTH window bounds inclusive"
    variants: []

  - name: contingent_bonus_settlement
    trigger: "POST /contingent-bonus-pools/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      # PINNED evaluation order (the dependency is circular-looking; this order resolves it):
      # STEP 1: eligibility gates FIRST, computed EXCLUDING any bonus accrual:
      #   gate_loss:   trailing_loss_ratio(agent, as_of = settle time) < pool.loss_ratio_threshold   (STRICT <)
      #   gate_growth: growth(agent) >= pool.growth_threshold_pct, where
      #     growth = (earned_trailing_12m - earned_prior_12m) / earned_prior_12m
      #     and earned_prior_12m == 0  =>  growth is DEFINED as 1.0 (first-year agents pass)
      # STEP 2: eligible pool of agents = those passing BOTH gates with earned_trailing_12m > 0
      # STEP 3: payout_i = floor(pool_total_cents * earned_i / total_eligible_earned)
      # STEP 4: undistributed_cents = pool_total_cents - sum(payout_i)  # remainder is RETAINED, never redistributed
    input_set: "Agents with an ACTIVE contingent_bonus_eligible CommissionSchedule at settle time; their Policies and Claims"
    constants: {}
    precision: "integer cents; payouts floor-rounded; loss ratios at 4 decimals"
    variants: []

  - name: aor_commission_transfer
    trigger: "POST /bundle-placements/{id}/transfer-aor"
    algorithm: waterfall_allocation
    formula: |
      days_in_force = full days in [policy.inception_at, transfer time)
      earned_commission_cents      = round_half_up(total_commission_cents * days_in_force / policy.term_days)
      transferred_commission_cents = total_commission_cents - earned_commission_cents
      # INVARIANT: earned (retained by original agent) + transferred (received by new
      # agent) == total_commission_cents exactly; nothing is created or lost.
    input_set: "the BundlePlacement and its Policy; logical clock"
    constants: {}
    precision: "integer cents, round_half_up on the earned leg; the transferred leg is the exact complement"
    variants: []

  - name: leakage_rate_by_channel
    trigger: "GET /leakage-reports/quote-to-bind"
    algorithm: aggregation
    formula: |
      window = [period_start, period_end)            # half-open
      cohort(channel) = Quotes with that channel whose quoted_at falls in window
        (Quote must have reached QUOTED or AGENT_QUOTED at least once: quoted_at not null)
      leaked(channel) = cohort members that did NOT reach BOUND with a bind time < period_end
        (i.e. status EXPIRED, WITHDRAWN, or still QUOTED/REFERRED_TO_AGENT/AGENT_QUOTED)
      Variant COUNT:
        leakage = count(leaked) / count(cohort);  empty cohort -> 0.0000
      Variant PREMIUM_WEIGHTED:
        leakage = sum(leaked.quoted_premium_cents) / sum(cohort.quoted_premium_cents)
        using each quote's LATEST quoted_premium_cents;  zero total premium -> 0.0000
      Both variants: round_half_up at 4 decimals.
    input_set: "Quotes; logical clock is irrelevant (window bounds are explicit inputs)"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: count_basis
        when: "request basis == COUNT"
        difference: "unweighted quote counts"
      - name: premium_weighted_basis
        when: "request basis == PREMIUM_WEIGHTED"
        difference: "weighted by quoted_premium_cents; the two bases yield different leakage for the same funnel whenever leaked quotes are not premium-average"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — a request failing several
# checks returns the error of the LOWEST priority number)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership: for entity-backed roles, X-User-ID must equal the owning FK on the target resource (Agent role -> agent_id; Consumer role -> consumer_id; ComparativeRater role -> rater_id). Applies to all non-GET endpoints acting on an owned resource and to GETs of owned records"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "endpoints acting on Quote, Policy, CommissionStatement, TelematicsEnrollment, BundlePlacement, BonusPayout, RateFeedPublication when called by entity-backed roles"

  - priority: 4
    category: existence
    check: "Request body shape: required fields present, types valid, enum members valid, datetimes parseable; unknown fields are IGNORED (not rejected)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: existence
    check: "Path-segment ids and body FK references must resolve to existing resources (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 6
    category: state
    check: "Target resource must be in a state from which the transition is defined; also lazy-state errors: quote expiry (ERR_QUOTE_EXPIRED), stale rate pin (ERR_RATE_STALE), product ACTIVE (ERR_PRODUCT_NOT_ACTIVE), published feed (ERR_FEED_NOT_PUBLISHED), policy IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints; the named domain variants apply per endpoint"

  - priority: 7
    category: business_safety
    check: "Compliance: agent must be APPOINTED (not TERMINATED -> ERR_AGENT_TERMINATED) and must hold an ACTIVE appointment for the product's (state_code, line_of_business) (ERR_AGENT_NOT_APPOINTED_IN_STATE); portfolio-review actioner must differ from opener (ERR_SEGREGATION_OF_DUTIES); one OPEN review per agent (ERR_REVIEW_ALREADY_OPEN)"
    error_id: ERR_AGENT_NOT_APPOINTED_IN_STATE
    http_status: 409
    applies_to: "agent-channel submit/agent-quote/bind, refer-to-agent, appointment-sensitive actions, portfolio review actions"

  - priority: 8
    category: business_temporal
    check: "Interval rules: appointment half-open overlap (ERR_APPOINTMENT_WINDOW_OVERLAP); feed strict overlap (ERR_FEED_WINDOW_OVERLAP) then 24h gap (ERR_FEED_WINDOW_GAP_VIOLATION); statement period overlap with FINALIZED/PAID/CLAWED_BACK statements (ERR_STATEMENT_PERIOD_OVERLAP)"
    error_id: ERR_APPOINTMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "appointment creation, rate-feed-publication creation, statement creation"

  - priority: 9
    category: business_referential
    check: "Cross-entity consistency: product channel availability (ERR_CHANNEL_NOT_AVAILABLE); only ACTIVE products may be published to raters (ERR_PRODUCT_NOT_PUBLISHABLE — note: this fires when the product is in DRAFT/WITHDRAWN at publication-CREATE time); bundle placements only on bundle_eligible products (ERR_BUNDLE_NOT_ELIGIBLE); agent-channel quote creation must carry agent_id (ERR_AGENT_MISMATCH); duplicate rater_code (ERR_DUPLICATE_RATER_CODE); duplicate consumer email (ERR_DUPLICATE_CONSUMER_EMAIL); AOR target must differ from current agent (ERR_AOR_NOT_ALLOWED); second enrollment per policy (ERR_TELEMATICS_ALREADY_ENROLLED)"
    error_id: ERR_CHANNEL_NOT_AVAILABLE
    http_status: 409
    applies_to: "creation endpoints with cross-entity references"

  - priority: 10
    category: business_fiscal
    check: "Money rules, checked last: DIRECT premium cap (ERR_PREMIUM_CAP_EXCEEDED); paying a zero-net statement (ERR_NOTHING_TO_PAY); claw-back that would drive statement net_payable_cents below zero (ERR_NEGATIVE_COMMISSION); terminating an agent holding PLACED bundle placements (ERR_AGENT_HAS_ACTIVE_PLACEMENTS)"
    error_id: ERR_PREMIUM_CAP_EXCEEDED
    http_status: 409
    applies_to: "quote submit, statement pay/claw-back, agent termination"

# =============================================================================
# §1.5 API Endpoint Table
# (path parameters are uniformly named {id}; list GETs accept limit?/offset?
#  plus the filters shown; all reads share the broad read role set)
# =============================================================================
endpoints:
  # --- logical clock (test-driving; outside the public business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; the server NEVER falls back to wall-clock time)."
    roles: [CarrierAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; lazy expirations (Quote EXPIRED, AgentAppointment EXPIRED) become observable on subsequent reads"]

  # --- CarrierProduct ---
  - method: POST
    path: "/products"
    description: "Create a CarrierProduct in DRAFT"
    roles: [RatingManager]
    code: 201
    input: [product_code, line_of_business, state_code, channel_availability, coverage_rates, min_premium_cents, "direct_discount_pct?", "agent_load_pct?", "bundle_credit_pct?", "direct_channel_max_premium_cents?", "bundle_eligible?"]
    output: CarrierProduct
    side_effects: ["status=DRAFT, version=1"]

  - method: GET
    path: "/products"
    description: "List CarrierProducts"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["channel_availability?", "status?", "state_code?", "limit?", "offset?"]
    output: "CarrierProduct[]"
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Get a CarrierProduct"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: CarrierProduct
    side_effects: []

  - method: POST
    path: "/products/{id}/activate"
    description: "Activate a DRAFT product"
    roles: [RatingManager]
    code: 200
    input: []
    output: CarrierProduct
    side_effects: ["status DRAFT -> ACTIVE; increments CarrierProduct.version by 1"]

  - method: POST
    path: "/products/{id}/withdraw"
    description: "Withdraw an ACTIVE product"
    roles: [RatingManager]
    code: 200
    input: []
    output: CarrierProduct
    side_effects: ["status ACTIVE -> WITHDRAWN; increments CarrierProduct.version by 1"]

  - method: GET
    path: "/products/{id}/rate-feed-publications"
    description: "List RateFeedPublications for a product (reverse reach for RateFeedPublication.product_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RateFeedPublication[]"
    side_effects: []

  # --- ComparativeRater ---
  - method: POST
    path: "/raters"
    description: "Register a ComparativeRater"
    roles: [RatingManager]
    code: 201
    input: [rater_code, display_name, feed_format_version, accepted_line_of_business]
    output: ComparativeRater
    side_effects: ["version=1; ERR_DUPLICATE_RATER_CODE if rater_code already registered"]

  - method: GET
    path: "/raters"
    description: "List ComparativeRaters"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "ComparativeRater[]"
    side_effects: []

  - method: GET
    path: "/raters/{id}"
    description: "Get a ComparativeRater"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: ComparativeRater
    side_effects: []

  # --- RateFeedPublication ---
  - method: POST
    path: "/raters/{id}/rate-feed-publications"
    description: "Create a DRAFT rate feed publication for a rater (OCC-guarded on the rater's version; window rules validated against the rater's full publication set)"
    roles: [RatingManager]
    code: 201
    input: [product_id, effective_start, effective_end, rate_table_payload, expected_rater_version]
    output: RateFeedPublication
    side_effects:
      - "status=DRAFT"
      - "increments ComparativeRater.version by 1"
      - "temporal validation: strict overlap -> ERR_FEED_WINDOW_OVERLAP; <24h gap -> ERR_FEED_WINDOW_GAP_VIOLATION (against sibling publications of the same (rater_id, product_id) in DRAFT or PUBLISHED)"
      - "referential validation: product must be ACTIVE (ERR_PRODUCT_NOT_PUBLISHABLE)"
      - "OCC: expected_rater_version must equal ComparativeRater.version (ERR_STALE_VERSION, 412)"

  - method: GET
    path: "/raters/{id}/rate-feed-publications"
    description: "List RateFeedPublications for a rater (reverse reach for RateFeedPublication.rater_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RateFeedPublication[]"
    side_effects: []

  - method: GET
    path: "/rate-feed-publications/{id}"
    description: "Get a RateFeedPublication"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: RateFeedPublication
    side_effects: []

  - method: POST
    path: "/rate-feed-publications/{id}/publish"
    description: "Publish a DRAFT publication; supersedes the prior PUBLISHED one for the same (rater, product) and flags dependent quotes stale"
    roles: [RatingManager]
    code: 200
    input: []
    output: RateFeedPublication
    side_effects: ["DRAFT -> PUBLISHED; cascade per §1.2 (supersede prior, set rate_stale on dependent quotes)"]

  - method: POST
    path: "/rate-feed-publications/{id}/recall"
    description: "Recall a DRAFT or PUBLISHED publication"
    roles: [RatingManager]
    code: 200
    input: []
    output: RateFeedPublication
    side_effects: ["-> RECALLED; dependent quotes flagged rate_stale when it was PUBLISHED"]

  # --- Agent ---
