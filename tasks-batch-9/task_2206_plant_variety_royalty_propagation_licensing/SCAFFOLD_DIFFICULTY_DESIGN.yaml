  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: trial_site_aggregate_plot_capacity_over_half_open_windows_with_adjacency_allowed
        grounds:
          - validations[priority=35]
          - errors.ERR_TRIAL_SITE_CAPACITY_EXCEEDED
          - entities.TrialSite.fields.plot_capacity
          - entities.TrialSite.fields.occupied_plot_count
          - entities.VarietyTrial.fields.plant_date
          - entities.VarietyTrial.fields.harvest_date
          - endpoints[POST /variety-trials/{trial_id}/plant]
        distinguishing_aspect: |
          Resource entity: TrialSite. Interval semantics: HALF-OPEN
          [plant_date, harvest_date) with an AGGREGATE capacity - many trials may
          share the site as long as the sum of plot_count over the overlapping
          {PLANNED, PLANTED} set stays within plot_capacity - and ADJACENCY IS
          NOT OVERLAP, so a trial whose plant_date equals another's harvest_date
          is admitted at full size.
        test_recipe:
          setup:
            - "One Variety."
            - "One TrialSite in region PNW with plot_capacity 50."
            - "Trial T1 at that site with plot_count 30 and window [2026-08-05, 2026-09-20), planted at 2026-08-05 while it is the only trial on the site."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Ridgeway Damson", species: "Prunus insititia", breeder_code: "RD", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_name: "Ridgeway Station", region_code: "PNW", plot_capacity: 50 }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { s_id: $.data.id }
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s_id}", plot_count: 30, plant_date: "2026-08-05T00:00:00Z", harvest_date: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { t1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${t1_id}/plant"
              payload: {}
              as: TrialCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s_id}", plot_count: 30, plant_date: "2026-09-01T00:00:00Z", harvest_date: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { t2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${t2_id}/plant"
              payload: {}
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s_id}", plot_count: 30, plant_date: "2026-09-20T00:00:00Z", harvest_date: "2026-11-01T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { t3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${t3_id}/plant"
              payload: {}
              as: TrialCoordinator
              as_user_id: "coord-1"
          assert:
            - "After the setup: VarietyTrial.${t1_id}.status == PLANTED and TrialSite.${s_id}.occupied_plot_count == 30 of a 50 capacity"
            - "Creating T2 succeeds with status PLANNED - the capacity rule is enforced at plant time, not at create time"
            - "Planting T2 returns 409 with data.error_id == ERR_TRIAL_SITE_CAPACITY_EXCEEDED: T1's [2026-08-05, 2026-09-20) genuinely overlaps T2's [2026-09-01, 2026-09-20) and 30 + 30 == 60 exceeds 50"
            - "After that rejection VarietyTrial.${t2_id}.status is still PLANNED and TrialSite.${s_id}.occupied_plot_count == 30"
            - "Planting T3 SUCCEEDS: its window [2026-09-20, 2026-11-01) is merely ADJACENT to T1's, which ends exclusively at 2026-09-20, and it is disjoint from T2's PLANNED window, so the overlapping sum is 30 of 50"
            - "VarietyTrial.${t3_id}.status == PLANTED"
            - "Variety.${v_id}.lifecycle_state == IN_TRIAL"

      - name: exclusive_sublicense_singleton_occupancy_with_thirty_day_buffer_on_closed_intervals
        grounds:
          - validations[priority=33]
          - errors.ERR_EXCLUSIVITY_CONFLICT
          - entities.SublicenseGrant.fields.exclusivity
          - entities.SublicenseGrant.fields.effective_date
          - entities.SublicenseGrant.fields.expiry_date
          - endpoints[POST /sublicense-grants/{grant_id}/activate]
        distinguishing_aspect: |
          A different resource entity (SublicenseGrant occupancy of a
          (variety_id, territory_code) pair) with different interval semantics:
          CLOSED [effective_date, expiry_date] intervals, SINGLETON occupancy
          rather than an aggregate ceiling, and a EXCLUSIVITY_BUFFER_DAYS 30
