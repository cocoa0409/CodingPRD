            - "the returned row's id equals ${customer_id}"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_default_reads_the_fixed_startup_instant_before_any_set
        claim_type: Conditional Action
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - entities.CreditApplication.fields.expires_at
        distinguishing_aspect: "With no clock call issued at all, expires_at is stamped from the fixed startup default 2026-09-01T00:00:00Z rather than from real wall-clock time, making every window rule run-time independent."
        test_recipe:
          setup:
            - "Fresh process; the logical clock has never been set."
          setup_api_calls:
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t1
            - *c_reg_tx
          trigger:
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 250000, requested_purchase_amount_cents: 250000, down_payment_cents: 50000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
          assert:
            - "CreditApplication.${application_id}.created_at == 2026-09-01T00:00:00.000Z"
            - "CreditApplication.${application_id}.expires_at == created_at + DECISION_VALIDITY_HOURS, derived from the default instant and not from today"
            - "CreditApplication.${application_id}.decision_status == PENDING"

      - name: activate_store_side_effect_is_observable_on_read
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/stores/{id}/activate
          - state_machines.Store.OPEN_to_ACTIVE
        distinguishing_aspect: "The activation action's declared side effect is visible on the subsequent read and the store's version advances by exactly one, while a second activation from ACTIVE is refused as an invalid state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One OPEN store."
          setup_api_calls:
            - *c_clock
            - *c_store
          trigger:
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the first activation returns 200 with Store.${store_id}.store_status == ACTIVE"
            - "Store.${store_id}.version == 2 after one activation"
            - "the second activation returns 409 with error_id == ERR_INVALID_STATE"
            - "Store.${store_id}.version is still 2"

      - name: trade_up_preview_reports_derived_figures_without_mutating_state
        claim_type: Computed read
        grounds:
          - endpoints.GET_/purchases/{id}/trade-up-preview
          - calculations.trade_up_credit_basis
          - calculations.balance_due_after_trade_up
        distinguishing_aspect: "The preview is a pure computed read: it reports the 382515 credit, the 900036 floor and the 517485 balance due for a 900100 ticket while leaving the purchase PENDING with an unchanged version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Origin purchase at 450018 completed, new purchase at 900100 naming it, no trade-up credit stamped yet."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - &c_origin_purchase
              call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450018, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { origin_purchase_id: $.data.id }
            - call: "POST /purchases/${origin_purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 900100, origin_purchase_id: "${origin_purchase_id}" }
              as: SalesAssociate
              captures: { new_purchase_id: $.data.id, new_purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 900100, down_payment_cents: 90010 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
          trigger:
            - call: "GET /purchases/${new_purchase_id}/trade-up-preview"
              payload: {}
              as: SalesAssociate
              captures: { preview_credit: $.data.trade_up_credit_cents, preview_floor: $.data.trade_up_floor_cents, preview_due: $.data.balance_due_cents }
          assert:
            - "preview_credit == 382515, since no bonus credit was stamped on the origin"
            - "preview_floor == 900036"
            - "preview_due == 900100 - 382515 == 517485"
            - "Purchase.${new_purchase_id}.purchase_status is still PENDING and version is still ${new_purchase_v}, so the read mutated nothing"

      - name: expire_due_sweep_is_idempotent_on_a_second_run
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/credit-applications/expire-due
          - state_machines.CreditApplication.PENDING_to_EXPIRED
        distinguishing_aspect: "The sweep reports one expired application on its first run and zero on its second, because EXPIRED is terminal and its precondition excludes already-expired rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PENDING application created, then the clock advanced past its validity window."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t1
            - *c_reg_tx
            - *c_app_t1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ChainAdmin
            - call: "POST /credit-applications/expire-due"
              payload: {}
              as: CreditAnalyst
              captures: { expired_count: $.data.expired_count }
            - call: "POST /credit-applications/expire-due"
              payload: {}
              as: CreditAnalyst
              captures: { expired_again: $.data.expired_count }
          assert:
            - "the first sweep reports expired_count == 1"
            - "CreditApplication.${application_id}.decision_status == EXPIRED"
            - "the second sweep reports expired_again == 0, so the bulk action is idempotent"
            - "Customer.${customer_id}.account_status is still NO_FILE"

      - name: inspection_visit_creation_returns_the_declared_envelope_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/inspection-visits
          - response_envelope.success
        distinguishing_aspect: "POST /inspection-visits returns 201 with the full visit row including the defaulted inspection_status and the server-stamped claimed_at only when the result is CLAIMED, and the scheduled visit reads back with SCHEDULED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE with one registration whose reminder window is open."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - *c_registration
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-20T00:00:00Z" }
              as: ChainAdmin
            - call: "POST /inspection-reminders/run"
              payload: {}
              as: StoreManager
            - call: "GET /service-plan-registrations/${registration_id}"
              payload: {}
              as: StoreManager
              captures: { registration_v: $.data.version }
          trigger:
            - call: "POST /inspection-visits"
              payload: { registration_id: "${registration_id}", store_id: "${store_id}", visit_at: "2027-02-25T00:00:00Z", result: "SCHEDULED", expected_registration_version: "${registration_v}" }
              as: StoreManager
              captures: { visit_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "InspectionVisit.${visit_id}.inspection_status == SCHEDULED"
            - "InspectionVisit.${visit_id}.claimed_at is null and result == SCHEDULED"
            - "InspectionVisit.${visit_id}.visit_at == 2027-02-25T00:00:00.000Z"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

  # ===========================================================================
  - section: errors
    instances:

      - name: credit_limit_exceeded_is_raised_on_decision_over_the_tier_ceiling
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
          - validations[priority=20]
        distinguishing_aspect: "A decision requesting more than the tier's standalone ceiling returns ERR_CREDIT_LIMIT_EXCEEDED at 422 and leaves the application PENDING, while the same application one cent inside the ceiling is approved."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. TX TIER_1 row at base_limit_cents 400000; two applications, one asking 400001 and one asking 400000."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t1
            - *c_reg_tx
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 400001, requested_purchase_amount_cents: 300000, down_payment_cents: 60000 }
              as: SalesAssociate
              captures: { over_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 400000, requested_purchase_amount_cents: 300000, down_payment_cents: 60000 }
              as: SalesAssociate
              captures: { at_id: $.data.id }
          trigger:
            - call: "POST /credit-applications/${over_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
              captures: { error_id: $.data.error_id }
            - call: "POST /credit-applications/${at_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
          assert:
            - "the over-ceiling decision returns 422 with error_id == ERR_CREDIT_LIMIT_EXCEEDED"
            - "CreditApplication.${over_id}.decision_status is still PENDING"
            - "the at-ceiling decision succeeds with approved_limit_cents == 400000, so the ceiling is inclusive"
            - "CreditApplication.${at_id}.decision_status == APPROVED"

      - name: regulation_terms_violation_is_raised_when_state_terms_are_unregistered
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REGULATION_TERMS_VIOLATION
          - validations[priority=6]
        distinguishing_aspect: "Registering a lifetime plan in a state with no ServicePlanRegulation row is refused with ERR_REGULATION_TERMS_VIOLATION rather than silently voided, while the same registration in a registered state succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store in state ZZ with no regulation row; a second store in TX with one."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "ZZ", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_zz_id: $.data.id }
            - call: "POST /stores/${store_zz_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "0210", name: "Summerlin", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/activate"
              payload: {}
              as: ChainAdmin
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_tx_id}", base_price_cents: 400000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id }
            - call: "POST /purchases/${purchase_id}/complete"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /service-plan-registrations"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", diamond_id: "${diamond_id}", store_id: "${store_zz_id}", bundle_id: "${bundle_id}", plan_term_months: 24 }
              as: StoreManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the ZZ registration returns 422 with error_id == ERR_REGULATION_TERMS_VIOLATION at priority 6"
            - "GET /service-plan-registrations?store_id=${store_zz_id} returns 0 rows"
            - "the same registration against the TX store would succeed because a regulation row exists"
            - "Store.${store_zz_id}.open_inspection_count == 0"

      - name: plan_term_exceeding_the_state_maximum_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PLAN_TERM_EXCEEDS_REGULATION
          - validations[priority=7]
          - entities.ServicePlanRegulation.fields.max_plan_term_months
        distinguishing_aspect: "A 61-month term against a 60-month state maximum is refused with ERR_PLAN_TERM_EXCEEDS_REGULATION, while 60 is admitted, making the maximum an inclusive ceiling."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. TX store with a 60-month regulation row and a completed purchase."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - &c_registration_long
              call: "POST /service-plan-registrations"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", diamond_id: "${diamond_id}", store_id: "${store_id}", bundle_id: "${bundle_id}", plan_term_months: 60 }
              as: StoreManager
              captures: { registration_id: $.data.id }
          trigger:
            - call: "POST /service-plan-registrations"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", diamond_id: "${diamond_id}", store_id: "${store_id}", bundle_id: "${bundle_id}", plan_term_months: 61 }
              as: StoreManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the 61-month registration returns 422 with error_id == ERR_PLAN_TERM_EXCEEDS_REGULATION"
            - "the 60-month registration stands at coverage_status PENDING_INSPECTION"
            - "ServicePlanRegistration.${registration_id}.plan_term_months == 60"
            - "GET /service-plan-registrations?purchase_id=${purchase_id} returns exactly 1 row"

      - name: insufficient_payoff_below_the_settlement_amount_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSUFFICIENT_PAYOFF
          - validations[priority=23]
        distinguishing_aspect: "A payoff one cent below the 489930 settlement amount is refused with ERR_INSUFFICIENT_PAYOFF while the exact amount succeeds, so the settlement threshold is inclusive."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Purchase at 450000 financed by a PROMO_12_6M plan, clock advanced to 2026-12-30 so the settlement amount is 489930."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450000, down_payment_cents: 45000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-30T00:00:00Z" }
              as: ChainAdmin
            - call: "GET /promotional-plans/${plan_id}"
              payload: {}
              as: CustomerService
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /promotional-plans/${plan_id}/payoff"
              payload: { amount_cents: 489929, expected_plan_version: "${plan_v}" }
              as: CustomerService
              captures: { error_id: $.data.error_id }
          assert:
            - "the short payoff returns 422 with error_id == ERR_INSUFFICIENT_PAYOFF"
            - "PromotionalPlan.${plan_id}.plan_status is still ACCRUING and total_paid_cents == 0"
            - "GET /promotional-plans/${plan_id}/payoff-ledger-entries returns 0 rows"
            - "the settlement amount at this instant is 489930, so one cent below is refused"

      - name: trade_up_floor_not_met_is_rejected_one_cent_under_two_times_origin
        claim_type: violation_to_error
        grounds:
          - errors.ERR_TRADE_UP_FLOOR_NOT_MET
          - validations[priority=24]
          - entities.Purchase.fields.trade_up_floor_cents
        distinguishing_aspect: "A 900035 ticket against a 450018 origin misses the 900036 floor by one cent and is refused, while 900036 is admitted, which is the floor's exact boundary."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Origin purchase at 450018 completed, a new purchase at 900035, and an approved application covering it."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450018, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { origin_purchase_id: $.data.id }
            - call: "POST /purchases/${origin_purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 900035, origin_purchase_id: "${origin_purchase_id}" }
              as: SalesAssociate
              captures: { short_purchase_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 900035, down_payment_cents: 90004 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
          trigger:
            - call: "POST /purchases/${short_purchase_id}/complete"
              payload: {}
              as: SalesAssociate
              captures: { error_id: $.data.error_id }
          assert:
            - "the completion returns 422 with error_id == ERR_TRADE_UP_FLOOR_NOT_MET"
            - "Purchase.${short_purchase_id}.trade_up_floor_cents == 900036"
            - "Purchase.${short_purchase_id}.purchase_status is still PENDING"
            - "Purchase.${origin_purchase_id}.purchase_status is still COMPLETED, not TRADE_UP_APPLIED"

      - name: store_credit_capacity_exceeded_is_raised_when_the_liability_will_not_fit
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STORE_CREDIT_CAPACITY_EXCEEDED
          - validations[priority=21]
          - entities.Store.fields.available_credit_capacity_cents
        distinguishing_aspect: "A store whose remaining capacity is below the repair's computed 35000 liability refuses intake with ERR_STORE_CREDIT_CAPACITY_EXCEEDED, and the refusal happens before any Repair row is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store with credit_capacity_cents 40000 and an existing open repair absorbing 10000 of it, leaving 30000 available."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 20000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - *c_activate
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - *c_registration
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-09-10T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "OTHER", declared_parts_cents: 15000, declared_labor_cents: 0 }
              as: StoreManager
              captures: { first_repair_id: $.data.id, first_absorbed: $.data.store_absorbed_cents }
          trigger:
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "SETTING", declared_parts_cents: 40000, declared_labor_cents: 15000, declared_loss_liability_cents: 5000 }
              as: StoreManager
              captures: { error_id: $.data.error_id }
          assert:
            - "Repair.${first_repair_id}.store_absorbed_cents == 1050, computed as max(0, 15000-1050) + 1050 with labor 0"
            - "Store.${store_id}.available_credit_capacity_cents == 20000 - 1050 == 18950 before the second intake"
            - "the second intake returns 422 with error_id == ERR_STORE_CREDIT_CAPACITY_EXCEEDED because its 35000 liability will not fit in 18950"
            - "GET /repairs?store_id=${store_id} returns exactly 1 row"

      - name: vendor_missing_is_raised_when_the_routing_table_target_is_absent
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VENDOR_MISSING
          - calculations.vendor_routing_and_turnaround
          - state_machines.Repair.INTAKE_to_ROUTED
        distinguishing_aspect: "Routing a setting-class repair when no JEWELCRAFT shop is registered returns ERR_VENDOR_MISSING and leaves the repair at INTAKE with a null vendor_shop_code and no promised delivery."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE with a live repair and no bench shop registered at all."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - *c_registration
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-09-10T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "SETTING", declared_parts_cents: 40000, declared_labor_cents: 15000, declared_loss_liability_cents: 5000 }
              as: StoreManager
              captures: { repair_id: $.data.id }
          trigger:
            - call: "POST /repairs/${repair_id}/route"
              payload: {}
              as: StoreManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the routing returns 422 with error_id == ERR_VENDOR_MISSING"
            - "Repair.${repair_id}.repair_status is still INTAKE"
            - "Repair.${repair_id}.vendor_shop_code is null"
            - "Diamond.${diamond_id}.custody_status is still IN_CASE"

      - name: claim_already_used_blocks_a_second_insurance_replacement_advice
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CLAIM_ALREADY_USED
          - state_machines.Appraisal.ISSUED_to_CIRCULATED
          - entities.ServicePlanRegistration.fields.replacement_claims_used
        distinguishing_aspect: "A second insurance advice on the same registration is refused with ERR_CLAIM_ALREADY_USED once replacement_claims_used is 1, while the first advice succeeds and records the claim."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A completed repair carrying one replacement appraisal and its registration at claim count 1."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_shop_malca
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - *c_registration
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-09-10T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "STONE_LOSS", declared_parts_cents: 40000, declared_labor_cents: 15000, declared_loss_liability_cents: 5000 }
              as: StoreManager
              captures: { repair_id: $.data.id }
            - call: "POST /repairs/${repair_id}/route"
              payload: {}
              as: StoreManager
            - call: "POST /repairs/${repair_id}/arrive-vendor"
              payload: {}
              as: StoreManager
            - call: "POST /repairs/${repair_id}/submit-qc"
              payload: {}
              as: StoreManager
            - call: "POST /repairs/${repair_id}/declare-loss"
              payload: {}
              as: StoreManager
            - call: "GET /repairs/${repair_id}/appraisals"
              payload: {}
              as: StoreManager
              captures: { appraisal_one_id: "$.data[0].id" }
            - call: "POST /appraisals/${appraisal_one_id}/advise-insurer"
              payload: { insurance_schedule_ref: "SCH-2026-0001" }
              as: CustomerService
          trigger:
            - call: "POST /appraisals/${appraisal_one_id}/advise-insurer"
              payload: { insurance_schedule_ref: "SCH-2026-0002" }
              as: CustomerService
              captures: { error_id: $.data.error_id }
          assert:
            - "the first advice succeeds and ServicePlanRegistration.${registration_id}.replacement_claims_used == 1"
            - "the second advice returns 409 with error_id == ERR_CLAIM_ALREADY_USED"
            - "ServicePlanRegistration.${registration_id}.replacement_claims_used is still 1"
            - "Appraisal.${appraisal_one_id}.appraisal_status remains CIRCULATED with insurance_schedule_ref SCH-2026-0001"

  # ===========================================================================
  - section: rbac
    instances:

      - name: store_manager_cannot_record_a_credit_decision
        claim_type: RBAC denial
        grounds:
          - roles.CreditAnalyst.exclusive_operations
          - errors.ERR_UNAUTHORIZED
          - validations[priority=2]
        distinguishing_aspect: "POST /credit-applications/{id}/decision is a CreditAnalyst exclusive, so a StoreManager calling it is refused with ERR_UNAUTHORIZED at 403 even though the application is perfectly decidable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer on file, TX TIER_1 row, one PENDING application."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t1
            - *c_reg_tx
            - *c_app_t1
          trigger:
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: StoreManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "CreditApplication.${application_id}.decision_status is still PENDING"
            - "Customer.${customer_id}.account_status is still NO_FILE"

      - name: store_manager_exclusive_intake_succeeds_and_sales_associate_shared_create_succeeds
        claim_type: RBAC permission
        grounds:
          - roles.StoreManager.exclusive_operations
          - roles.SalesAssociate.shared_operations
          - endpoints.POST_/repairs
        distinguishing_aspect: "Repair intake is declared shared between StoreManager and SalesAssociate, so both roles are admitted, while the routing step is StoreManager-exclusive and refuses the associate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A live registration and a registered JEWELCRAFT shop."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_shop_jewelcraft
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - *c_registration
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-09-10T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
          trigger:
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "SETTING", declared_parts_cents: 40000, declared_labor_cents: 15000, declared_loss_liability_cents: 5000 }
              as: SalesAssociate
              captures: { repair_id: $.data.id }
            - call: "POST /repairs/${repair_id}/route"
              payload: {}
              as: SalesAssociate
              captures: { error_id: $.data.error_id }
          assert:
            - "the associate's intake succeeds with 201 and Repair.${repair_id}.repair_status == INTAKE"
            - "the associate's routing attempt returns 403 with error_id == ERR_UNAUTHORIZED"
            - "Repair.${repair_id}.vendor_shop_code is still null"
            - "Repair.${repair_id}.repair_status is still INTAKE, so the routing is StoreManager-exclusive"

      - name: chain_admin_exclusive_configuration_is_refused_to_other_roles
        claim_type: RBAC denial
        grounds:
          - roles.ChainAdmin.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Registry configuration is ChainAdmin-exclusive, so a CreditAnalyst posting a registry row is refused while the admin's identical payload succeeds, and the failure leaves no row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /credit-limit-registry-state"
              payload: { registry_key: "NV", credit_tier: "TIER_2", base_limit_cents: 600000, min_down_payment_pct: 0.15, registry_type: "STATE", min_ticket_cents: 200000 }
              as: CreditAnalyst
              captures: { error_id: $.data.error_id }
            - call: "POST /credit-limit-registry-state"
              payload: { registry_key: "NV", credit_tier: "TIER_2", base_limit_cents: 600000, min_down_payment_pct: 0.15, registry_type: "STATE", min_ticket_cents: 200000 }
              as: ChainAdmin
          assert:
            - "the analyst's attempt returns 403 with error_id == ERR_UNAUTHORIZED"
            - "the admin's attempt returns 201"
            - "GET /credit-limit-registry-state?registry_key=NV returns exactly 1 row"
            - "that row's credit_tier == TIER_2 and base_limit_cents == 600000"

      - name: missing_role_header_is_unauthenticated_not_unauthorized
        claim_type: RBAC denial
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "An absent or unknown X-User-Role is answered with ERR_UNAUTHENTICATED at 401, which outranks the authorization check at priority 2, so the response never becomes a 403."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One store on file."
          setup_api_calls:
            - *c_clock
            - *c_store
          trigger:
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: NotARole
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_UNAUTHORIZED"
            - "Store.${store_id}.store_status is still OPEN"
            - "Store.${store_id}.version == 1"

      - name: customer_role_may_read_own_statements_only
        claim_type: RBAC permission
        grounds:
          - roles.Customer.shared_operations
          - roles.Customer.identity
        distinguishing_aspect: "The Customer role is entity_backed, so reading another customer's statements is refused while the owner's read succeeds, proving the identity binding is enforced rather than decorative."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A statement generated for one customer and a second customer on file."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - call: "POST /customers"
              payload: { full_name: "Ivan Petrov", email: "ivan.petrov@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { other_customer_id: $.data.id }
            - call: "POST /billing-statements"
              payload: { customer_id: "${customer_id}", statement_period: "2026-09", lines: [{ amount_cents: 250000, billable_pct: 1.0, line_status: "BILLABLE" }] }
              as: CustomerService
              captures: { statement_id: $.data.id }
          trigger:
            - call: "GET /billing-statements/${statement_id}"
              payload: {}
              as: Customer
              as_user_id: "${other_customer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the non-owner read returns 403 with error_id == ERR_NOT_RESOURCE_OWNER"
            - "the owner's read with as_user_id ${customer_id} returns 200"
            - "BillingStatement.${statement_id}.statement_status == OPEN"
            - "BillingStatement.${statement_id}.statement_balance_cents == 255000"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: purchase_create_rejects_a_stale_expected_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-competing-promo]
          - errors.ERR_STALE_VERSION
          - validations[priority=5]
        distinguishing_aspect: "The OCC guard on Purchase.version is the only mechanism that separates two legitimate financing writes: the client that carries the version observed before the intervening write is refused with ERR_STALE_VERSION at 412 while the holder of the current version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Purchase at 450000 created; its version is then advanced by an intervening trade-up credit stamp so the first observed version goes stale."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, stale_v: $.data.version }
            - call: "POST /purchases/${purchase_id}/trade-up-credit"
              payload: { additional_credit_cents: 10050 }
              as: CustomerService
              captures: { current_v: $.data.version }
          trigger:
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${stale_v}" }
              as: SalesAssociate
              captures: { error_id: $.data.error_id }
          assert:
            - "the stale create returns 412 with error_id == ERR_STALE_VERSION"
            - "the currently-held version is ${current_v}, one past the stale ${stale_v}"
            - "GET /promotional-plans?purchase_id=${purchase_id} returns 0 rows, so the stale write created nothing"
            - "Purchase.${purchase_id}.version is still ${current_v}"

      - name: version_increments_once_per_mutation_including_cascaded_writes
        claim_type: optimistic_concurrency
        grounds:
          - entities.Purchase.fields.version
          - state_machines.Purchase.FINANCED_to_COMPLETED
          - endpoints.POST_/purchases/{id}/complete
        distinguishing_aspect: "The parent's version advances once for its own mutation and once more for the trade-up cascade written onto the origin purchase, so the origin's version observes both hops rather than only its own."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Origin purchase completed at version 2, new purchase at 900100 naming it, approved application in place."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450018, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { origin_purchase_id: $.data.id }
            - call: "POST /purchases/${origin_purchase_id}/complete"
              payload: {}
              as: SalesAssociate
              captures: { origin_v_after_first: $.data.version }
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 900100, origin_purchase_id: "${origin_purchase_id}" }
              as: SalesAssociate
              captures: { new_purchase_id: $.data.id, new_purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 900100, down_payment_cents: 90010 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
          trigger:
            - call: "POST /purchases/${new_purchase_id}/complete"
              payload: {}
              as: SalesAssociate
          assert:
            - "Purchase.${origin_purchase_id}.version == ${origin_v_after_first}, proving the earlier completion bumped it exactly once"
            - "Purchase.${new_purchase_id}.version is one past ${new_purchase_v} after completion"
            - "Purchase.${origin_purchase_id}.purchase_status == TRADE_UP_APPLIED"
            - "Purchase.${new_purchase_id}.purchase_status == COMPLETED"

      - name: simultaneous_order_of_appearance_of_inspection_visits_is_pinned_by_created_at
        claim_type: optimistic_concurrency
        grounds:
          - entities.InspectionVisit.fields.visit_at
          - concurrency_rules[visit-create-competing-slot]
          - calculations.inspection_reminder_scheduling
        distinguishing_aspect: "The visit log's ordering is pinned by created_at rather than by any identifier, so two visits logged for the same registration are ordered deterministically and the later one is the one that closes the cycle."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A registration whose reminder window is open."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - *c_registration
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-20T00:00:00Z" }
              as: ChainAdmin
            - call: "POST /inspection-reminders/run"
              payload: {}
              as: StoreManager
            - call: "GET /service-plan-registrations/${registration_id}"
              payload: {}
              as: StoreManager
              captures: { reg_v: $.data.version }
          trigger:
            - call: "POST /inspection-visits"
              payload: { registration_id: "${registration_id}", store_id: "${store_id}", visit_at: "2027-02-22T00:00:00Z", result: "CLAIMED", expected_registration_version: "${reg_v}" }
              as: StoreManager
              captures: { visit_one_id: $.data.id }
          assert:
            - "InspectionVisit.${visit_one_id}.inspection_status == CLAIMED"
            - "InspectionVisit.${visit_one_id}.claimed_at is non-null and equals the logical clock instant"
            - "GET /inspection-visits?registration_id=${registration_id} returns rows ordered by created_at ascending, with the reminder-spawned SCHEDULED row first"
            - "no ordering claim is made from any identifier"

      - name: derived_customer_balance_reconciles_after_each_plan_write
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Customer.fields.outstanding_balance_cents
          - entities.PromotionalPlan.fields.final_settlement_amount_cents
          - calculations.payoff_ledger_projection
        distinguishing_aspect: "Customer.outstanding_balance_cents is derived and must track the plan: it reads 489930 once the accrual reaches 39930, drops by the exact payoff amount on PAID, and never holds a stale value across the write."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Purchase at 450000 financed by a PROMO_12_6M plan, clock advanced to 2026-12-30."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450000, down_payment_cents: 45000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "GET /promotional-plans/${plan_id}"
              payload: {}
              as: CustomerService
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /promotional-plans/${plan_id}/payoff"
              payload: { amount_cents: 112500, expected_plan_version: "${plan_v2}" }
              as: CustomerService
              captures: { error_id: $.data.error_id }
          assert:
            - "the 112500 installment-sized payment is refused with 422 ERR_INSUFFICIENT_PAYOFF, so the derived balance is not silently forgiving"
            - "Customer.${customer_id}.outstanding_balance_cents is unchanged by the refused write"
            - "PromotionalPlan.${plan_id}.final_settlement_amount_cents still equals 450000 plus the accrual at the current instant"
            - "Customer.${customer_id}.standalone_credit_limit_cents == 1000000, so revolving_utilization_bps is derived from the same pair of fields"

      - name: scheduled_capitalization_takes_effect_only_after_the_window_elapses
        claim_type: scheduled_actions
        grounds:
          - state_machines.PromotionalPlan.ACCRUING_to_CAPITALIZED
          - endpoints.POST_/plans/capitalize-due
          - entities.PromotionalPlan.fields.simplicity_expires_at
        distinguishing_aspect: "The capitalization sweep is a deferred action: run before the simplicity instant it capitalizes nothing, and run one instant after it capitalizes the plan and folds the deferred interest into principal."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Purchase at 450000 financed by a PROMO_12_6M plan."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450000, down_payment_cents: 45000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-31T00:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /plans/capitalize-due"
              payload: {}
              as: CreditAnalyst
              captures: { before_count: $.data.capitalized_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: ChainAdmin
            - call: "POST /plans/capitalize-due"
              payload: {}
              as: CreditAnalyst
              captures: { after_count: $.data.capitalized_count }
          assert:
            - "the pre-window sweep reports before_count == 0 and leaves PromotionalPlan.${plan_id}.plan_status == ACCRUING"
            - "the post-window sweep reports after_count == 1"
            - "PromotionalPlan.${plan_id}.plan_status == CAPITALIZED and deferred_interest_accrued_cents == 0"
            - "PromotionalPlan.${plan_id}.merchant_deferral_fee_cents == 0, so capitalization cancels the merchant deferral credit"
            - "PromotionalPlan.${plan_id}.principal_cents is now 450000 + 121788 == 571788, the accrual at the sweep instant"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_every_completion_side_effect_is_visible_in_one_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/purchases/{id}/complete
        distinguishing_aspect: "Under the immediate consistency model every hop of the completion cascade is visible in the very next read with no lag: the new diamond's owner, the store's inspection population and the customer's lifetime total all reflect the write in one request."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer OPEN with an approved application, stone registered, purchase at 900100 ready to complete."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 900100, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 900100, down_payment_cents: 90010 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
          trigger:
            - call: "POST /purchases/${purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "GET /diamonds/${diamond_id}"
              payload: {}
              as: SalesAssociate
          assert:
            - "the completion returns 200 with Purchase.${purchase_id}.purchase_status == COMPLETED"
            - "the immediate read shows Diamond.${diamond_id}.owner_customer_id == ${customer_id} and custody_status IN_CASE"
            - "Customer.${customer_id}.lifetime_purchase_cents == 900100 with no observable lag"
            - "Store.${store_id}.open_inspection_count == 0, since this purchase carried no bundle and opened no registration"
            - "Purchase.${purchase_id}.completed_at equals the logical clock instant"
