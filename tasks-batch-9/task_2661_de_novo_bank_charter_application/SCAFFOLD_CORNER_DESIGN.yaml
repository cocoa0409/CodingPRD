      - name: calc_baseline_scenario_is_governed_by_the_static_variant
        claim_type: variant_selection
        grounds:
          - calculations.stress_leverage_path
          - entities.StressScenario.fields.governing_variant
          - entities.BusinessPlan.fields.worst_governing_min_leverage_ratio_bps
        distinguishing_aspect: >
          Variant SELECTION, not divergence: for scenario_code BASELINE the governing variant is
          STATIC_BALANCE_SHEET, so governing_min_leverage_ratio_bps takes the static 1500 even though
          the dynamic run of the same row computes a much lower 1006 - and the plan's worst governing
          figure inherits 1500.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING."
            - "One DRAFT BusinessPlan with opening_tier1_capital_cents 4,000,000,000, assets 25/34/43 bn,"
            - "loans 15/21/28 bn and net income -250,000,000 / +120,000,000 / +460,000,000."
            - "No stress scenarios yet."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "GET /de-novo/organizing-groups/${g_id}"
              payload: {}
              as: CharterCounsel
              captures: { g_v: $.data.version }
            - call: "POST /de-novo/business-plans"
              payload: { group_id: "${g_id}", expected_group_version: "${g_v}", opening_tier1_capital_cents: 4000000000, projected_assets_y1_cents: 25000000000, projected_assets_y2_cents: 34000000000, projected_assets_y3_cents: 43000000000, projected_loans_y1_cents: 15000000000, projected_loans_y2_cents: 21000000000, projected_loans_y3_cents: 28000000000, projected_deposits_y1_cents: 21000000000, projected_deposits_y2_cents: 29000000000, projected_deposits_y3_cents: 37000000000, projected_net_income_y1_cents: -250000000, projected_net_income_y2_cents: 120000000, projected_net_income_y3_cents: 460000000, projected_branch_count: 3 }
              as: CharterCounsel
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /de-novo/business-plans/${p_id}/stress-scenarios"
              payload: { scenario_code: "BASELINE", credit_loss_rate_bps: 0, nim_compression_bps: 0, expense_overrun_cents: 0 }
              as: CharterCounsel
              captures: { sc_base_id: $.data.id }
          assert:
            - "the call returns 201"
            - "StressScenario.${sc_base_id}.static_min_leverage_ratio_bps == 1500"
            - "StressScenario.${sc_base_id}.static_breach_year_index == 0"
            - "StressScenario.${sc_base_id}.dynamic_min_leverage_ratio_bps == 1006"
            - "StressScenario.${sc_base_id}.dynamic_breach_year_index == 0"
            - "StressScenario.${sc_base_id}.governing_variant == STATIC_BALANCE_SHEET"
            - "StressScenario.${sc_base_id}.governing_min_leverage_ratio_bps == 1500"
            - "StressScenario.${sc_base_id}.governing_breach_year_index == 0"
            - "BusinessPlan.${p_id}.stress_scenario_count == 1"
            - "BusinessPlan.${p_id}.breach_scenario_count == 0"
            - "BusinessPlan.${p_id}.worst_governing_min_leverage_ratio_bps == 1500"
      - name: calc_composite_score_rounding_precision
        claim_type: precision
        grounds:
          - calculations.management_composite_score
          - calculations.organizer_qualification_subscore
        excluded_because:
          difficulty_instance: combinatorial_formula / management_composite_rounding_order_pinned_per_organizer
          rationale: "That instance pins the round-then-average order and contrasts 71.80 against the 71.68 the forbidden order produces, which is the precision claim in full."
      - name: calc_exam_interval_merge_boundary
        claim_type: interval_merge
        grounds:
          - calculations.exam_buffer_occupation
          - validations[priority=69]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / readiness_exam_buffer_tail_blocks_non_overlapping_window
          rationale: "That instance asserts the buffer-extended half-open interval against both a colliding and a clear window, and the exactly-at-buffer_end case is asserted by boundary_precision_check / exam_window_starting_exactly_at_buffer_end_is_allowed."
      - name: calc_escrow_waterfall_bucket_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.escrow_release_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / escrow_reimbursement_cap_keyed_on_gross_not_net
          rationale: "That instance walks bucket 1 (the capped reimbursement) and bucket 2 (the net release) on both sides of the cap, which covers the waterfall ordering claim."
      - name: calc_stress_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.stress_leverage_path
          - entities.StressScenario.fields.governing_min_leverage_ratio_bps
        excluded_because:
          difficulty_instance: dual_variant_calc / stress_path_static_vs_dynamic_divergence_on_severely_adverse
          rationale: "That instance asserts both variants on one row and the 610 bps delta between them, which is the divergence claim in full."
