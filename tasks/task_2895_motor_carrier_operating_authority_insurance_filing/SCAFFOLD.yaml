scenario: |
  2895. Motor Carrier Operating Authority & Insurance Filing (motor carrier compliance office): authority application by transportation type with process agent designation across all states, insurance filing requirements at required minimum limits with cargo and bond filings for brokers, activation waiting period, vetting and revocation for lapsed insurance, unified registration and biennial update obligations, name change, reinstatement and successor-in-interest applications, hazardous and passenger authority additional requirements, new entrant safety audit within the first eighteen months, authority suspension consequences on customer contracts and shipments in transit

domain_name: motor-carrier-operating-authority
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions

  entity_topology: flat
  # Peer entities linked by explicit foreign keys carried in request bodies.
  # Only three action-scoped nesting segments exist (designations, contracts,
  # shipments, fee-payments under their owner); every entity is addressable
  # from its own flat collection root.

  state_machine_shape: parallel
  # OperatingAuthority carries two independent state dimensions that evolve
  # separately (authority_status x insurance_status). AuthorityApplication is
  # additionally cyclic (SUBMITTED -> RETURNED_FOR_CORRECTION -> SUBMITTED) and
  # branching (SUBMITTED -> {RETURNED_FOR_CORRECTION, PUBLISHED, DENIED} with
  # divergent side-effect sets per branch). CustomerContract and Shipment are
  # cyclic (suspend/resume, embargo/release).

  relationship_patterns:
    - one_to_many        # Carrier -> AuthorityApplication, OperatingAuthority, SafetyAudit, FeeLedgerEntry
    - many_to_many       # OperatingAuthority <-> ProcessAgent via ProcessAgentDesignation (per state_code)
    - self_referential   # InsuranceFiling.supersedes_filing_id -> InsuranceFiling.id
    - cross_aggregate    # AuthorityApplication.predecessor_authority_id -> OperatingAuthority.id

  role_model: segregation_of_duties
  # Opaque operator ids are drawn from ONE shared compliance-office staff
  # directory, so the same X-User-ID may legitimately hold both VettingAnalyst
  # and ComplianceOfficer roles. The office therefore forbids the staff member
  # who published an application from activating the authority it produced.

  consistency_model: immediate

  difficulty_level: expert

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the motor carrier
        constraints: "1..200 chars, non-blank"
      - name: dba_name
        type: string
        source: input
        description: doing-business-as name
        default: null
        constraints: "null or 1..200 chars"
      - name: domicile_state
        type: enum
        source: input
        description: two-letter code of the carrier's principal place of business
        constraints: "one of AL,AK,AZ,AR,CA,CO,CT,DE,DC,FL,GA,HI,ID,IL,IN,IA,KS,KY,LA,ME,MD,MA,MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM,NY,NC,ND,OH,OK,OR,PA,RI,SC,SD,TN,TX,UT,VT,VA,WA,WV,WI,WY"
      - name: usdot_number
        type: string
        source: system
        description: server-minted USDOT number, unique per Carrier
        constraints: "format 'USDOT-<7 digits>', assigned in creation order"
      - name: unified_registration_status
        type: enum
        source: computed
        description: unified registration state; flips to REGISTERED the first time any OperatingAuthority of this Carrier reaches authority_status ACTIVE
        default: NOT_REGISTERED
        constraints: "NOT_REGISTERED | REGISTERED"
      - name: entrant_status
        type: enum
        source: computed
        description: NEW_ENTRANT until a SafetyAudit for this Carrier reaches PASSED, then PERMANENT
        default: NEW_ENTRANT
        constraints: "NEW_ENTRANT | PERMANENT"
      - name: self_reported_vehicle_count
        type: integer
        source: input
        description: power units self-reported on the unified registration form
        constraints: ">= 1"
      - name: self_reported_driver_count
        type: integer
        source: input
        description: drivers self-reported on the unified registration form
        constraints: ">= 1"
      - name: self_reported_oos_rate_pct
        type: number
        source: input
        description: self-reported roadside out-of-service percentage
        constraints: "0.0 .. 100.0, at most 2 decimals"
      - name: audited_oos_rate_pct
        type: number
        source: computed
        description: out-of-service percentage measured by the most recent SafetyAudit whose status is PASSED or FAILED
        default: null
        constraints: "null until a SafetyAudit result is recorded"
      - name: compliance_risk_score
        type: number
        source: computed
        description: output of calculations.carrier_compliance_risk_score for the variant named in compliance_risk_variant
        default: null
        constraints: "0.00 .. 100.00, 2 decimals"
      - name: compliance_risk_variant
        type: enum
        source: computed
        description: which variant produced compliance_risk_score
        default: NONE
        constraints: "NONE | SELF_REPORTED | AUDITED"
      - name: fee_balance_cents
        type: integer
        source: computed
        description: filing fees currently owed to the office; equals the signed sum of this Carrier's FeeLedgerEntry.amount_cents
        default: 0
        constraints: "may be negative when payments exceed assessments"
      - name: fees_assessed_total_cents
        type: integer
        source: computed
        description: lifetime sum of FILING_FEE_DEBIT entries for this Carrier
        default: 0
        constraints: ">= 0"
      - name: fees_reversed_total_cents
        type: integer
        source: computed
        description: lifetime sum of the absolute value of FILING_FEE_REVERSAL_CREDIT entries for this Carrier
        default: 0
        constraints: ">= 0"
      - name: fees_paid_total_cents
        type: integer
        source: computed
        description: lifetime sum of the absolute value of FEE_PAYMENT_CREDIT entries for this Carrier
        default: 0
        constraints: ">= 0"
      - name: biennial_update_due_at
        type: datetime
        source: computed
        description: next MCS-150 biennial update deadline; set to created_at + 730 days at creation, and reset to the update instant + 730 days on each POST /carriers/{id}/biennial-update
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: last_biennial_update_at
        type: datetime
        source: computed
        description: instant of the most recent accepted biennial update
        default: null
      - name: biennial_delinquent
        type: boolean
        source: computed
        description: set true by POST /compliance-sweeps when current_utc > biennial_update_due_at; cleared by an accepted biennial update
        default: false
      - name: active_authority_count
        type: integer
        source: computed
        description: count of OperatingAuthority rows for this Carrier whose authority_status == ACTIVE
        default: 0

  - name: AuthorityApplication
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the applicant carrier"
      - name: application_kind
        type: enum
        source: input
        description: which application track this filing follows
        constraints: "NEW | NAME_CHANGE | REINSTATEMENT | SUCCESSOR_IN_INTEREST"
      - name: transportation_type
        type: enum
        source: input
        description: class of operating authority requested
        constraints: "FOR_HIRE_PROPERTY | HOUSEHOLD_GOODS | PASSENGER | PROPERTY_BROKER | FREIGHT_FORWARDER"
      - name: predecessor_authority_id
        type: string
        source: input
        description: "FK -> OperatingAuthority.id; required (non-null) for application_kind NAME_CHANGE, REINSTATEMENT and SUCCESSOR_IN_INTEREST; MUST be null for NEW"
        default: null
      - name: requested_operating_states
        type: array
        source: input
        description: two-letter codes of every state in which the applicant will operate
        constraints: "1..51 distinct valid state codes"
      - name: hazmat_endorsement_requested
        type: boolean
        source: input
        description: whether hazardous-materials transport authority is requested
        default: false
      - name: hazmat_bulk_capable
        type: boolean
        source: input
        description: whether the applicant will move hazardous materials in bulk (cargo tank / hopper)
        default: false
      - name: passenger_seating_capacity
        type: integer
        source: input
        description: designed seating capacity including the driver; required (non-null) when transportation_type == PASSENGER, MUST be null otherwise
        default: null
        constraints: ">= 1 when present"
      - name: proposed_legal_name
        type: string
        source: input
        description: new legal name requested; required (non-null) when application_kind == NAME_CHANGE, MUST be null otherwise
        default: null
      - name: status
        type: enum
        source: computed
        description: application lifecycle state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED_FOR_CORRECTION | PUBLISHED | GRANTED | DENIED"
      - name: submission_count
        type: integer
        source: computed
        description: number of times POST /authority-applications/{id}/submit has succeeded on this application
        default: 0
      - name: filing_fee_cents
        type: integer
        source: computed
        description: output of calculations.filing_fee_assessment, recomputed on create and frozen at the first successful submit
        default: 0
      - name: filing_fee_breakdown
        type: object
        source: computed
        description: "the four pinned line items of calculations.filing_fee_assessment: { line_docket_cents, line_states_cents, line_type_cents, line_hazmat_cents }"
        default: null
      - name: required_bipd_limit_cents
        type: integer
        source: computed
        description: output field required_bipd_limit_cents of calculations.required_insurance_minimums
        default: 0
      - name: required_cargo_limit_cents
        type: integer
        source: computed
        description: output field required_cargo_limit_cents of calculations.required_insurance_minimums
        default: 0
      - name: required_bond_limit_cents
        type: integer
        source: computed
        description: output field required_bond_limit_cents of calculations.required_insurance_minimums
        default: 0
      - name: vetting_findings
        type: string
        source: computed
        description: findings text supplied by the VettingAnalyst on the most recent vetting review
        default: null
      - name: vetted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the VettingAnalyst who performed the most recent vetting review of any disposition
        default: null
      - name: published_at
        type: datetime
        source: computed
        description: logical-clock instant at which the PUBLISH disposition was recorded
        default: null
      - name: published_by_user_id
        type: string
        source: computed
        description: X-User-ID of the VettingAnalyst who recorded the PUBLISH disposition; compared against the activating ComplianceOfficer for segregation of duties
        default: null
      - name: denied_reason
        type: string
        source: computed
        description: findings text captured when the DENY disposition was recorded
        default: null

  - name: OperatingAuthority
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier holding this authority"
      - name: application_id
        type: string
        source: input
        description: "FK -> AuthorityApplication.id; the application whose PUBLISH disposition created this authority"
      - name: docket_number
        type: string
        source: system
        description: server-minted docket identifier, unique per OperatingAuthority
        constraints: "format 'MC-<6 digits>', assigned in creation order"
      - name: transportation_type
        type: enum
        source: computed
        description: copied verbatim from the creating AuthorityApplication.transportation_type
        constraints: "FOR_HIRE_PROPERTY | HOUSEHOLD_GOODS | PASSENGER | PROPERTY_BROKER | FREIGHT_FORWARDER"
      - name: authority_status
        type: enum
        source: computed
        description: first of two independent state dimensions; governs whether the authority may be used
        default: PENDING
        constraints: "PENDING | ACTIVE | SUSPENDED | REVOKED | RESCINDED"
      - name: insurance_status
        type: enum
        source: computed
        description: second of two independent state dimensions; recomputed from this authority's InsuranceFiling rows and evolves independently of authority_status
        default: NOT_FILED
        constraints: "NOT_FILED | PARTIAL | FILED | LAPSED"
      - name: required_bipd_limit_cents
        type: integer
        source: computed
        description: copied from the creating AuthorityApplication.required_bipd_limit_cents at PUBLISH and never recomputed afterwards
        default: 0
      - name: required_cargo_limit_cents
        type: integer
        source: computed
        description: copied from the creating AuthorityApplication.required_cargo_limit_cents at PUBLISH
        default: 0
      - name: required_bond_limit_cents
        type: integer
        source: computed
        description: copied from the creating AuthorityApplication.required_bond_limit_cents at PUBLISH
        default: 0
      - name: required_jurisdictions
        type: array
        source: computed
        description: distinct union of the creating application's requested_operating_states and the Carrier.domicile_state, sorted ascending by state code
      - name: designated_state_count
        type: integer
        source: computed
        description: output field designated_state_count of calculations.designation_coverage_status
        default: 0
      - name: designation_coverage_complete
        type: boolean
        source: computed
        description: output field designation_coverage_complete of calculations.designation_coverage_status
        default: false
      - name: publication_at
        type: datetime
        source: computed
        description: logical-clock instant of the PUBLISH disposition that created this authority
      - name: activation_eligible_at
        type: datetime
        source: computed
        description: output of calculations.activation_eligibility_window; publication_at + ACTIVATION_WAITING_PERIOD_DAYS
      - name: activated_at
        type: datetime
        source: computed
        description: logical-clock instant at which authority_status first became ACTIVE
        default: null
      - name: suspended_at
        type: datetime
        source: computed
        description: logical-clock instant of the current suspension; cleared to null when authority_status returns to ACTIVE
        default: null
      - name: suspension_reason
        type: enum
        source: computed
        description: why the authority is currently suspended
        default: NONE
        constraints: "NONE | INSURANCE_LAPSE | DESIGNATION_GAP | SAFETY_AUDIT_FAILURE | AUDIT_WINDOW_MISSED"
      - name: revoked_at
        type: datetime
        source: computed
        description: logical-clock instant at which authority_status became REVOKED
        default: null
      - name: rescinded_at
        type: datetime
        source: computed
        description: logical-clock instant at which authority_status became RESCINDED because a SUCCESSOR_IN_INTEREST authority for this docket was activated
        default: null
      - name: hazmat_endorsed
        type: boolean
        source: computed
        description: copied from the creating AuthorityApplication.hazmat_endorsement_requested
        default: false
      - name: hazmat_bulk_capable
        type: boolean
        source: computed
        description: copied from the creating AuthorityApplication.hazmat_bulk_capable
        default: false
      - name: passenger_seating_capacity
        type: integer
        source: computed
        description: copied from the creating AuthorityApplication.passenger_seating_capacity
        default: null
      - name: active_contract_count
        type: integer
        source: computed
        description: count of CustomerContract rows for this authority whose status == ACTIVE
        default: 0
      - name: suspended_contract_count
        type: integer
        source: computed
        description: count of CustomerContract rows for this authority whose status == SUSPENDED_BY_AUTHORITY
        default: 0
      - name: new_entrant_audit_deadline_at
        type: datetime
        source: computed
        description: output of calculations.new_entrant_audit_window; activated_at + NEW_ENTRANT_AUDIT_WINDOW_MONTHS
        default: null
      - name: new_entrant_audit_status
        type: enum
        source: computed
        description: new-entrant safety audit posture for this authority
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | PENDING | PASSED | FAILED | MISSED"

  - name: ProcessAgent
    parent: null
    common_fields: false
    fields:
      - name: company_name
        type: string
        source: input
        description: legal name of the blanket process-agent company
        constraints: "1..200 chars, non-blank"
      - name: coverage_states
        type: array
        source: input
        description: two-letter codes of every state in which this agent may accept service of process
        constraints: "1..51 distinct valid state codes"
      - name: blanket_agent
        type: boolean
        source: input
        description: whether the agent is a blanket-agent organization; when true the agent is treated as covering all 51 jurisdictions regardless of coverage_states
        default: false

  - name: ProcessAgentDesignation
    parent: null
    common_fields: true
    fields:
      - name: authority_id
        type: string
        source: input
        description: "FK -> OperatingAuthority.id; the authority whose service of process is designated"
      - name: process_agent_id
        type: string
        source: input
        description: "FK -> ProcessAgent.id; the designated agent"
      - name: state_code
        type: enum
        source: input
        description: the single state this designation covers
        constraints: "one valid two-letter state code, and MUST appear in the designated ProcessAgent.coverage_states"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive start of the designation's occupation interval on the (authority_id, state_code) slot
      - name: effective_to
        type: datetime
        source: input
        description: inclusive end of the occupation interval; null means open-ended
        default: null
      - name: status
        type: enum
        source: computed
        description: designation lifecycle state
        default: ACTIVE
        constraints: "ACTIVE | REVOKED"
      - name: revoked_at
        type: datetime
        source: computed
        description: logical-clock instant at which the designation was revoked
        default: null

  - name: Insurer
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: legal name of the insurance or surety company
        constraints: "1..200 chars, non-blank"
      - name: naic_code
        type: string
        source: input
        description: NAIC company code, unique per Insurer
        constraints: "exactly 5 digits"
      - name: authorized_states
        type: array
        source: input
        description: two-letter codes of every state in which this insurer may write filings
        constraints: "1..51 distinct valid state codes"

  - name: InsuranceFiling
    parent: null
    common_fields: true
    fields:
      - name: authority_id
        type: string
        source: input
        description: "FK -> OperatingAuthority.id; the authority this filing covers"
      - name: insurer_id
        type: string
        source: input
        description: "FK -> Insurer.id; the filing insurer or surety"
      - name: supersedes_filing_id
        type: string
        source: computed
        description: "FK -> InsuranceFiling.id; the prior ACTIVE filing on the same (authority_id, filing_type) slot that this filing pushed to CANCELLED, or null when the slot was empty"
        default: null
      - name: filing_type
        type: enum
        source: input
        description: which statutory filing this row represents
        constraints: "BIPD | CARGO | SURETY_BOND | TRUST_FUND"
      - name: coverage_limit_cents
        type: integer
        source: input
        description: single-occurrence limit or bond amount in cents
        constraints: ">= 1"
      - name: policy_number
        type: string
        source: input
        description: insurer's policy or bond number
        constraints: "1..64 chars, non-blank, unique per insurer_id"
      - name: effective_at
        type: datetime
        source: input
        description: inclusive start of the filing's half-open coverage interval on the (authority_id, filing_type) slot
      - name: cancellation_effective_at
        type: datetime
        source: computed
        description: exclusive end of the half-open coverage interval; null means open-ended
        default: null
      - name: status
        type: enum
        source: computed
        description: filing lifecycle state
        default: ACTIVE
        constraints: "ACTIVE | CANCELLED"
      - name: meets_required_minimum
        type: boolean
        source: computed
        description: whether coverage_limit_cents is greater than or equal to the authority's required limit for this filing_type
        default: false

  - name: RevocationProceeding
    parent: null
    common_fields: true
    fields:
      - name: authority_id
        type: string
        source: input
        description: "FK -> OperatingAuthority.id; the authority under proceeding"
      - name: reason
        type: enum
        source: computed
        description: the compliance defect that opened the proceeding
        constraints: "INSURANCE_LAPSE | SAFETY_AUDIT_FAILURE | AUDIT_WINDOW_MISSED"
      - name: status
        type: enum
        source: computed
        description: proceeding lifecycle state
        default: NOTICE_ISSUED
        constraints: "NOTICE_ISSUED | CURED | REVOKED"
      - name: notice_issued_at
        type: datetime
        source: computed
        description: logical-clock instant at which the notice was issued
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: notice_issued_at + CURE_PERIOD_DAYS; POST /compliance-sweeps revokes the authority once current_utc is strictly greater than this instant
      - name: cured_at
        type: datetime
        source: computed
        description: logical-clock instant at which the proceeding was cured
        default: null
      - name: revoked_at
        type: datetime
        source: computed
        description: logical-clock instant at which the proceeding ended in revocation
        default: null
      - name: replacement_policy_number
        type: string
        source: computed
        description: policy_number of the ACTIVE InsuranceFiling accepted as the cure, or null when the proceeding was cured by a non-insurance remedy
        default: null

  - name: SafetyAudit
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the new entrant under audit"
      - name: audit_window_opens_at
        type: datetime
        source: computed
        description: equals the activated_at of the OperatingAuthority whose activation created this audit
      - name: audit_deadline_at
        type: datetime
        source: computed
        description: output of calculations.new_entrant_audit_window; audit_window_opens_at + NEW_ENTRANT_AUDIT_WINDOW_MONTHS
      - name: status
        type: enum
        source: computed
        description: audit lifecycle state
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED | MISSED"
      - name: result_recorded_at
        type: datetime
        source: computed
        description: logical-clock instant at which the audit result was recorded
        default: null
      - name: audited_oos_rate_pct
        type: number
        source: input
        description: out-of-service percentage measured during the audit
        default: null
        constraints: "0.0 .. 100.0 when present"
      - name: audited_driver_violation_count
        type: integer
        source: input
        description: driver-factor violations found during the audit
        default: null
        constraints: ">= 0 when present"
      - name: audited_vehicle_defect_count
        type: integer
        source: input
        description: vehicle-factor defects found during the audit
        default: null
        constraints: ">= 0 when present"
      - name: acute_violation_count
        type: integer
        source: input
        description: acute or critical regulatory violations found during the audit
        default: null
        constraints: ">= 0 when present"
      - name: audit_score
        type: number
        source: computed
        description: the AUDITED variant output of calculations.carrier_compliance_risk_score evaluated on this audit's measured factors
        default: null
        constraints: "0.00 .. 100.00, 2 decimals"

  - name: CustomerContract
    parent: null
    common_fields: true
    fields:
      - name: authority_id
        type: string
        source: input
        description: "FK -> OperatingAuthority.id; the authority the shipper contracted against"
      - name: shipper_name
        type: string
        source: input
        description: name of the contracting shipper
        constraints: "1..200 chars, non-blank"
      - name: commodity_class
        type: enum
        source: input
        description: commodity class the contract covers
        constraints: "GENERAL_FREIGHT | HOUSEHOLD_GOODS | HAZMAT_BULK | HAZMAT_NONBULK | PASSENGERS"
      - name: monthly_committed_revenue_cents
        type: integer
        source: input
        description: monthly revenue commitment used by calculations.contract_disruption_liability
        constraints: ">= 1"
      - name: term_start_at
        type: datetime
        source: input
        description: inclusive start of the contract term
      - name: term_end_at
        type: datetime
        source: input
        description: exclusive end of the contract term
        constraints: "MUST be strictly after term_start_at"
      - name: status
        type: enum
        source: computed
        description: contract lifecycle state
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED_BY_AUTHORITY | TERMINATED"
      - name: suspended_at
        type: datetime
        source: computed
        description: logical-clock instant at which the contract was suspended by an authority suspension
        default: null
      - name: resumed_at
        type: datetime
        source: computed
        description: logical-clock instant at which the contract was resumed by an authority restoration
        default: null
      - name: terminated_at
        type: datetime
        source: computed
        description: logical-clock instant at which the contract was terminated by an authority revocation
        default: null
      - name: embargoed_shipment_count
        type: integer
        source: computed
        description: number of Shipment rows on this contract that the most recent authority suspension moved to EMBARGOED
        default: 0
      - name: disruption_liability_cents
        type: integer
        source: computed
        description: output of calculations.contract_disruption_liability for the variant named in disruption_liability_variant
        default: 0
      - name: disruption_liability_variant
        type: enum
        source: computed
        description: which variant produced disruption_liability_cents
        default: NONE
        constraints: "NONE | SUSPENSION_ESTIMATE | SETTLED_ACTUAL"

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> CustomerContract.id; the contract the shipment moves under"
      - name: origin_state
        type: enum
        source: input
        description: two-letter code of the origin state
        constraints: "one valid two-letter state code"
      - name: destination_state
        type: enum
        source: input
        description: two-letter code of the destination state
        constraints: "one valid two-letter state code"
      - name: tender_at
        type: datetime
        source: input
        description: instant the shipper tendered the load
      - name: expected_delivery_at
        type: datetime
        source: input
        description: instant delivery is expected
        constraints: "MUST be strictly after tender_at"
      - name: declared_value_cents
        type: integer
        source: input
        description: declared cargo value in cents
        constraints: ">= 1"
      - name: hazmat
        type: boolean
        source: input
        description: whether the load contains hazardous materials
        default: false
      - name: status
        type: enum
        source: computed
        description: shipment lifecycle state
        default: TENDERED
        constraints: "TENDERED | IN_TRANSIT | EMBARGOED | DELIVERED | DIVERTED"
      - name: pre_embargo_status
        type: enum
        source: computed
        description: the status the shipment held immediately before it was embargoed; used to restore it exactly on embargo release
        default: NONE
        constraints: "NONE | TENDERED | IN_TRANSIT"
      - name: embargoed_at
        type: datetime
        source: computed
        description: logical-clock instant at which the shipment was embargoed
        default: null
      - name: embargo_released_at
        type: datetime
        source: computed
        description: logical-clock instant at which the embargo was released
        default: null
      - name: embargo_days_accrued
        type: integer
        source: computed
        description: ceil((embargo_released_at - embargoed_at) / 1 day) accumulated across every embargo this shipment has served
        default: 0
      - name: delivered_at
        type: datetime
        source: computed
        description: logical-clock instant of delivery
        default: null
      - name: diverted_at
        type: datetime
        source: computed
        description: logical-clock instant at which the shipment was diverted because its contract was terminated
        default: null

  - name: FeeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier whose fee balance this entry moves"
      - name: entry_type
        type: enum
        source: system
        description: which fee movement this entry records
        constraints: "FILING_FEE_DEBIT | FILING_FEE_REVERSAL_CREDIT | FEE_PAYMENT_CREDIT"
      - name: amount_cents
        type: integer
        source: system
        description: signed amount; positive for FILING_FEE_DEBIT, negative for FILING_FEE_REVERSAL_CREDIT and FEE_PAYMENT_CREDIT
        constraints: "non-zero"
      - name: docket_ref
        type: string
        source: system
        description: the AuthorityApplication.id this entry was raised against, or null for a bare payment
        default: null
      - name: memo
        type: string
        source: system
        description: human-readable reason for the entry

# ============================================================================
# 1.2 State Machine Table
#
# Named side-effect macros referenced below (each spelled out in full at its
# first use, and re-referenced by name afterwards):
#
#   SUSPEND(authority, reason)  -- three-hop transitive cascade
#     hop 1: authority.authority_status := SUSPENDED; authority.suspended_at :=
#            current_utc; authority.suspension_reason := reason.
#     hop 2: BECAUSE the authority became SUSPENDED, every CustomerContract with
#            contract.authority_id == authority.id AND contract.status == ACTIVE
#            (processed in created_at ASC order) becomes SUSPENDED_BY_AUTHORITY,
#            contract.suspended_at := current_utc, contract.resumed_at := null,
#            contract.disruption_liability_cents := the SUSPENSION_ESTIMATE
#            variant of calculations.contract_disruption_liability, and
#            contract.disruption_liability_variant := SUSPENSION_ESTIMATE.
#            Contracts already TERMINATED or already SUSPENDED_BY_AUTHORITY are
#            untouched (conditional cascade).
#     hop 3: BECAUSE each of those contracts became SUSPENDED_BY_AUTHORITY, every
#            Shipment with shipment.contract_id == that contract.id AND
#            shipment.status IN {TENDERED, IN_TRANSIT} (processed in created_at
#            ASC order) records pre_embargo_status := its current status, becomes
#            EMBARGOED and sets embargoed_at := current_utc; the contract's
#            embargoed_shipment_count := the number of shipments moved by this
#            hop. Shipments already DELIVERED, DIVERTED or EMBARGOED are untouched.
#     ledger: authority.active_contract_count -= n_moved;
#             authority.suspended_contract_count += n_moved, where n_moved is the
#             hop-2 count.
#
#   RESTORE(authority)  -- compensating three-hop cascade, exact inverse of SUSPEND
#     hop 1: authority.authority_status := ACTIVE; authority.suspension_reason :=
#            NONE; authority.suspended_at := null.
#     hop 2: BECAUSE the authority became ACTIVE, every CustomerContract with
#            contract.authority_id == authority.id AND contract.status ==
#            SUSPENDED_BY_AUTHORITY (created_at ASC) becomes ACTIVE,
#            contract.resumed_at := current_utc,
#            contract.disruption_liability_cents := the SETTLED_ACTUAL variant of
#            calculations.contract_disruption_liability, and
#            contract.disruption_liability_variant := SETTLED_ACTUAL.
#     hop 3: BECAUSE each of those contracts became ACTIVE, every Shipment with
#            shipment.contract_id == that contract.id AND shipment.status ==
#            EMBARGOED (created_at ASC) returns to shipment.pre_embargo_status,
#            sets embargo_released_at := current_utc, adds
#            ceil((current_utc - embargoed_at) / 1 day) to embargo_days_accrued,
#            and resets pre_embargo_status := NONE.
#     ledger: authority.suspended_contract_count -= n_moved;
#             authority.active_contract_count += n_moved.
#
#   TERMINATE(authority)  -- revocation cascade
#     hop 1: authority.authority_status := REVOKED; authority.revoked_at :=
#            current_utc.
#     hop 2: BECAUSE the authority became REVOKED, every CustomerContract with
#            contract.authority_id == authority.id AND contract.status IN
#            {ACTIVE, SUSPENDED_BY_AUTHORITY} (created_at ASC) becomes
#            TERMINATED and sets terminated_at := current_utc.
#     hop 3: BECAUSE each of those contracts became TERMINATED, every Shipment
#            with shipment.contract_id == that contract.id AND shipment.status IN
#            {TENDERED, IN_TRANSIT, EMBARGOED} (created_at ASC) becomes DIVERTED
#            and sets diverted_at := current_utc.
#     ledger: authority.active_contract_count := 0;
#             authority.suspended_contract_count := 0.
# ============================================================================
state_machines:
  - entity: AuthorityApplication
    state_field: status
    shape: "cyclic + branching fork (SUBMITTED -> {RETURNED_FOR_CORRECTION, PUBLISHED, DENIED}); RETURNED_FOR_CORRECTION -> SUBMITTED closes the loop"
    initial_state: DRAFT
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /authority-applications/{id}/submit"
        actor: CarrierRep
        preconditions:
          - "application.status == DRAFT"
          - "X-User-ID == application.carrier_id"
          - "Carrier.biennial_delinquent == false"
          - "for application_kind NAME_CHANGE: predecessor_authority_id is non-null and that OperatingAuthority.authority_status == ACTIVE and its carrier_id == application.carrier_id"
          - "for application_kind REINSTATEMENT: predecessor_authority_id is non-null and that OperatingAuthority.authority_status == REVOKED and its carrier_id == application.carrier_id"
          - "for application_kind SUCCESSOR_IN_INTEREST: predecessor_authority_id is non-null, that OperatingAuthority.authority_status IN {ACTIVE, SUSPENDED}, and its carrier_id != application.carrier_id"
          - "for application_kind NEW: predecessor_authority_id is null"
        side_effects:
          - "application.submission_count += 1"
          - "when submission_count becomes 1: application.filing_fee_cents is frozen at the value produced by calculations.filing_fee_assessment, and a FeeLedgerEntry(entry_type=FILING_FEE_DEBIT, amount_cents=+filing_fee_cents, docket_ref=application.id) is appended"
          - "when submission_count becomes 1: Carrier.fees_assessed_total_cents += filing_fee_cents and Carrier.fee_balance_cents += filing_fee_cents"
          - "when submission_count is 2 or more (re-submission after a return): NO FeeLedgerEntry is appended and no Carrier fee field changes"
        note: "the fee is assessed exactly once per application, no matter how many correction loops it makes"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /authority-applications/{id}/vetting-review with disposition=RETURN"
        actor: VettingAnalyst
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.vetting_findings := request findings"
          - "application.vetted_by_user_id := X-User-ID"
          - "NO fee reversal: the FILING_FEE_DEBIT stays on the ledger and Carrier.fee_balance_cents is unchanged"
      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /authority-applications/{id}/submit"
        actor: CarrierRep
        preconditions:
          - "application.status == RETURNED_FOR_CORRECTION"
          - "X-User-ID == application.carrier_id"
          - "Carrier.biennial_delinquent == false"
        side_effects:
          - "application.submission_count += 1"
          - "no FeeLedgerEntry is appended (submission_count is already 1 or more)"
        note: "this is the cycle edge: an application may loop SUBMITTED -> RETURNED_FOR_CORRECTION -> SUBMITTED without bound"
      - from: SUBMITTED
        to: PUBLISHED
        trigger: "POST /authority-applications/{id}/vetting-review with disposition=PUBLISH"
        actor: VettingAnalyst
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.published_at := current_utc; application.published_by_user_id := X-User-ID; application.vetted_by_user_id := X-User-ID; application.vetting_findings := request findings"
          - "a new OperatingAuthority is created with authority_status=PENDING, insurance_status=NOT_FILED, carrier_id=application.carrier_id, application_id=application.id, transportation_type / hazmat_endorsed / hazmat_bulk_capable / passenger_seating_capacity / required_bipd_limit_cents / required_cargo_limit_cents / required_bond_limit_cents copied from the application, required_jurisdictions = distinct(requested_operating_states + Carrier.domicile_state) sorted ascending, publication_at = current_utc, and activation_eligible_at = the output of calculations.activation_eligibility_window"
          - "the created OperatingAuthority is NOT returned by this endpoint; it is discoverable only through GET /operating-authorities?application_id=<application.id>"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /authority-applications/{id}/vetting-review with disposition=DENY"
        actor: VettingAnalyst
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.denied_reason := request findings; application.vetted_by_user_id := X-User-ID; application.vetting_findings := request findings"
          - "a FeeLedgerEntry(entry_type=FILING_FEE_REVERSAL_CREDIT, amount_cents=-application.filing_fee_cents, docket_ref=application.id) is appended"
          - "Carrier.fees_reversed_total_cents += application.filing_fee_cents and Carrier.fee_balance_cents -= application.filing_fee_cents"
          - "no OperatingAuthority is created"
        note: "DENY is the compensating action for submit; see calculations.filing_fee_conservation_invariant"
      - from: PUBLISHED
        to: GRANTED
        trigger: "POST /operating-authorities/{id}/activate (system side effect of the authority's activation)"
        actor: system
        preconditions:
          - "the authority created by this application reached authority_status == ACTIVE"
        side_effects:
          - "application.status := GRANTED"

  - entity: OperatingAuthority
    state_field: authority_status
    shape: "parallel dimension 1 of 2 — evolves independently of insurance_status; includes the SUSPENDED <-> ACTIVE cycle"
    initial_state: PENDING
    terminal_states: [REVOKED, RESCINDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /operating-authorities/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "authority.authority_status == PENDING"
          - "current_utc >= authority.activation_eligible_at"
          - "authority.designation_coverage_complete == true"
          - "when authority.required_bipd_limit_cents > 0: an InsuranceFiling exists with authority_id == authority.id, filing_type == BIPD, status == ACTIVE and a coverage interval containing current_utc"
          - "that BIPD filing's coverage_limit_cents >= authority.required_bipd_limit_cents"
          - "when authority.required_cargo_limit_cents > 0: an equivalent ACTIVE CARGO filing exists whose coverage_limit_cents >= authority.required_cargo_limit_cents"
          - "when authority.required_bond_limit_cents > 0: an ACTIVE filing with filing_type IN {SURETY_BOND, TRUST_FUND} exists whose coverage_limit_cents >= authority.required_bond_limit_cents"
          - "X-User-ID != AuthorityApplication.published_by_user_id of authority.application_id"
          - "Carrier.fee_balance_cents == 0"
        side_effects:
          - "authority.authority_status := ACTIVE; authority.activated_at := current_utc; authority.insurance_status := FILED"
          - "AuthorityApplication(authority.application_id).status := GRANTED"
          - "Carrier.unified_registration_status := REGISTERED; Carrier.active_authority_count += 1"
          - "Carrier.compliance_risk_score := the SELF_REPORTED variant of calculations.carrier_compliance_risk_score; Carrier.compliance_risk_variant := SELF_REPORTED"
          - "when Carrier.entrant_status == NEW_ENTRANT: authority.new_entrant_audit_status := PENDING; authority.new_entrant_audit_deadline_at := output of calculations.new_entrant_audit_window; and a SafetyAudit is created with carrier_id = authority.carrier_id, status = SCHEDULED, audit_window_opens_at = current_utc and audit_deadline_at = the same window output. The SafetyAudit is NOT returned by this endpoint; it is discoverable only through GET /carriers/{id}/safety-audits"
          - "when Carrier.entrant_status == PERMANENT: authority.new_entrant_audit_status stays NOT_REQUIRED, new_entrant_audit_deadline_at stays null, and no SafetyAudit is created"
          - "when AuthorityApplication(authority.application_id).application_kind == SUCCESSOR_IN_INTEREST: the predecessor OperatingAuthority named by that application's predecessor_authority_id has authority_status := RESCINDED and rescinded_at := current_utc, and TERMINATE's hop 2 and hop 3 run against the predecessor (its contracts TERMINATED, their non-DELIVERED shipments DIVERTED)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /insurance-filings/{id}/cancel, POST /process-agent-designations/{id}/revoke, POST /safety-audits/{id}/record-result with a FAILED outcome, or POST /compliance-sweeps step 1 (system)"
        actor: system
        preconditions:
          - "authority.authority_status == ACTIVE"
        side_effects:
          - "SUSPEND(authority, reason) runs in full — see the macro at the top of 1.2: hop 1 suspends the authority, hop 2 suspends its ACTIVE CustomerContracts, hop 3 embargoes those contracts' TENDERED/IN_TRANSIT Shipments"
          - "Carrier.active_authority_count -= 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /revocation-proceedings/{id}/cure, or POST /operating-authorities/{id}/process-agent-designations when the new designations complete coverage (system)"
        actor: system
        preconditions:
          - "authority.authority_status == SUSPENDED"
          - "authority.designation_coverage_complete == true, evaluated after this trigger's own writes have landed"
          - "authority.insurance_status == FILED, evaluated after this trigger's own writes have landed"
          - "no RevocationProceeding with authority_id == authority.id remains in status NOTICE_ISSUED once this trigger's own writes have landed (the cure path closes the one it targets; the designation-repair path requires that none was ever opened, which is exactly the DESIGNATION_GAP suspension raised by POST /process-agent-designations/{id}/revoke)"
        side_effects:
          - "RESTORE(authority) runs in full — hop 1 reactivates the authority, hop 2 resumes its SUSPENDED_BY_AUTHORITY contracts and settles each one's disruption liability under the SETTLED_ACTUAL variant, hop 3 releases each contract's EMBARGOED shipments back to pre_embargo_status"
          - "Carrier.active_authority_count += 1"
        note: "this is the cycle edge ACTIVE -> SUSPENDED -> ACTIVE on authority_status"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /compliance-sweeps step 3 (system), when a RevocationProceeding's cure_deadline_at has passed"
        actor: system
        preconditions:
          - "a RevocationProceeding exists with authority_id == authority.id and status == NOTICE_ISSUED"
          - "current_utc > that proceeding's cure_deadline_at (strictly greater)"
        side_effects:
          - "that RevocationProceeding.status := REVOKED and its revoked_at := current_utc"
          - "TERMINATE(authority) runs in full — hop 1 revokes the authority, hop 2 terminates its non-TERMINATED contracts, hop 3 diverts those contracts' non-DELIVERED shipments"
          - "Carrier.active_authority_count is left unchanged (it was already decremented at suspension)"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /operating-authorities/{id}/activate on a successor authority (system)"
        actor: system
        preconditions:
          - "an AuthorityApplication with application_kind == SUCCESSOR_IN_INTEREST and predecessor_authority_id == authority.id reached status GRANTED"
        side_effects:
          - "authority.authority_status := RESCINDED; authority.rescinded_at := current_utc"
          - "TERMINATE hop 2 and hop 3 run against this authority: its ACTIVE and SUSPENDED_BY_AUTHORITY contracts become TERMINATED, and their TENDERED/IN_TRANSIT/EMBARGOED shipments become DIVERTED"
          - "Carrier.active_authority_count -= 1"
      - from: SUSPENDED
        to: RESCINDED
        trigger: "POST /operating-authorities/{id}/activate on a successor authority (system)"
        actor: system
        preconditions:
          - "an AuthorityApplication with application_kind == SUCCESSOR_IN_INTEREST and predecessor_authority_id == authority.id reached status GRANTED"
        side_effects:
          - "authority.authority_status := RESCINDED; authority.rescinded_at := current_utc"
          - "TERMINATE hop 2 and hop 3 run against this authority"

  - entity: OperatingAuthority
    state_field: insurance_status
    shape: "parallel dimension 2 of 2 — recomputed from this authority's InsuranceFiling rows on every filing create and cancel, independently of authority_status"
    initial_state: NOT_FILED
    terminal_states: []
    transitions:
      - from: NOT_FILED
        to: PARTIAL
        trigger: "POST /insurance-filings (system recompute)"
        actor: system
        preconditions:
          - "at least one, but not all, of the authority's required filing slots is covered by an ACTIVE filing whose coverage interval contains current_utc and whose coverage_limit_cents meets that slot's required minimum"
        side_effects:
          - "authority.insurance_status := PARTIAL"
        note: "required slots are: BIPD when required_bipd_limit_cents > 0, CARGO when required_cargo_limit_cents > 0, and {SURETY_BOND or TRUST_FUND} when required_bond_limit_cents > 0"
      - from: PARTIAL
        to: FILED
        trigger: "POST /insurance-filings (system recompute)"
        actor: system
        preconditions:
          - "every required filing slot is covered by an ACTIVE filing meeting its required minimum"
        side_effects:
          - "authority.insurance_status := FILED"
      - from: NOT_FILED
        to: FILED
        trigger: "POST /insurance-filings (system recompute)"
        actor: system
        preconditions:
          - "the authority has exactly one required filing slot and the new filing covers it at or above the required minimum"
        side_effects:
          - "authority.insurance_status := FILED"
      - from: FILED
        to: LAPSED
        trigger: "POST /insurance-filings/{id}/cancel (system recompute)"
        actor: system
        preconditions:
          - "after the cancellation, at least one required filing slot has no ACTIVE filing whose coverage interval contains current_utc"
        side_effects:
          - "authority.insurance_status := LAPSED"
          - "BECAUSE insurance_status became LAPSED, a RevocationProceeding is created with authority_id = authority.id, reason = INSURANCE_LAPSE, status = NOTICE_ISSUED, notice_issued_at = current_utc and cure_deadline_at = current_utc + CURE_PERIOD_DAYS"
          - "BECAUSE that RevocationProceeding was created, if authority.authority_status == ACTIVE then SUSPEND(authority, INSURANCE_LAPSE) runs, which itself suspends the authority's contracts and embargoes their in-transit shipments"
        note: "this is transitive cascade chain 2: cancel -> LAPSED -> proceeding opened -> authority suspended -> contracts suspended -> shipments embargoed"
      - from: LAPSED
        to: FILED
        trigger: "POST /insurance-filings (system recompute)"
        actor: system
        preconditions:
          - "every required filing slot is again covered by an ACTIVE filing meeting its required minimum with a coverage interval containing current_utc"
        side_effects:
          - "authority.insurance_status := FILED"
        note: "this closes the FILED -> LAPSED -> FILED cycle on the insurance dimension"

  - entity: ProcessAgentDesignation
    state_field: status
    shape: linear
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /process-agent-designations/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "designation.status == ACTIVE"
        side_effects:
          - "designation.status := REVOKED; designation.revoked_at := current_utc"
          - "BECAUSE the designation was revoked, calculations.designation_coverage_status is re-evaluated for designation.authority_id, so authority.designated_state_count drops and authority.designation_coverage_complete becomes false"
          - "BECAUSE designation_coverage_complete became false, if authority.authority_status == ACTIVE then SUSPEND(authority, DESIGNATION_GAP) runs, which suspends the authority's ACTIVE contracts, which in turn embargoes those contracts' TENDERED/IN_TRANSIT shipments"
          - "no RevocationProceeding is opened for a designation gap: the defect is self-curable by filing a replacement designation"
        note: "this is transitive cascade chain 1: revoke -> coverage incomplete -> authority suspended -> contracts suspended -> shipments embargoed"

  - entity: InsuranceFiling
    state_field: status
    shape: linear
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /insurance-filings/{id}/cancel"
        actor: InsuranceFiler
        preconditions:
          - "filing.status == ACTIVE"
          - "X-User-ID == filing.insurer_id"
          - "the authority named by filing.authority_id has authority_status NOT IN {REVOKED, RESCINDED}"
          - "request cancellation_effective_at >= filing.effective_at"
        side_effects:
          - "filing.status := CANCELLED; filing.cancellation_effective_at := request cancellation_effective_at"
          - "BECAUSE the filing left the ACTIVE set, authority.insurance_status is recomputed; see the OperatingAuthority insurance_status machine for the FILED -> LAPSED edge and everything it cascades"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /insurance-filings (system supersede of the prior occupant of the same (authority_id, filing_type) slot)"
        actor: system
        preconditions:
          - "the prior filing's status == ACTIVE"
          - "the new filing's effective_at is strictly after the prior filing's effective_at"
        side_effects:
          - "prior filing.status := CANCELLED; prior filing.cancellation_effective_at := the new filing's effective_at"
          - "new filing.supersedes_filing_id := prior filing.id"
          - "authority.insurance_status is recomputed; because the new filing covers current_utc from effective_at onward, a same-limit supersede leaves insurance_status unchanged"
        note: "the supersede path is why POST /insurance-filings is guarded by OCC on OperatingAuthority.version — see 1.2.1"

  - entity: RevocationProceeding
    state_field: status
    shape: "branching (NOTICE_ISSUED -> {CURED, REVOKED}) with divergent side-effect sets per branch"
    initial_state: NOTICE_ISSUED
    terminal_states: [CURED, REVOKED]
    transitions:
      - from: NOTICE_ISSUED
        to: CURED
        trigger: "POST /revocation-proceedings/{id}/cure"
        actor: InsuranceFiler | CarrierRep
        preconditions:
          - "proceeding.status == NOTICE_ISSUED"
          - "current_utc <= proceeding.cure_deadline_at"
          - "an InsuranceFiling exists with authority_id == proceeding.authority_id, policy_number == request replacement_policy_number, status == ACTIVE, and a coverage interval containing current_utc"
          - "that filing's coverage_limit_cents >= the authority's required limit for that filing's filing_type"
        side_effects:
          - "proceeding.status := CURED; proceeding.cured_at := current_utc; proceeding.replacement_policy_number := request replacement_policy_number"
          - "BECAUSE the proceeding was cured, authority.insurance_status is recomputed to FILED"
          - "BECAUSE insurance_status became FILED and no NOTICE_ISSUED proceeding remains, if authority.authority_status == SUSPENDED and authority.designation_coverage_complete == true then RESTORE(authority) runs, which resumes the authority's SUSPENDED_BY_AUTHORITY contracts (settling each one's liability under the SETTLED_ACTUAL variant), which in turn releases each contract's EMBARGOED shipments back to pre_embargo_status"
      - from: NOTICE_ISSUED
        to: REVOKED
        trigger: "POST /compliance-sweeps step 3 (system)"
        actor: system
        preconditions:
          - "proceeding.status == NOTICE_ISSUED"
          - "current_utc > proceeding.cure_deadline_at (strictly greater; exactly at the deadline the proceeding survives)"
        side_effects:
          - "proceeding.status := REVOKED; proceeding.revoked_at := current_utc"
          - "TERMINATE(authority) runs against proceeding.authority_id"

  - entity: SafetyAudit
    state_field: status
    shape: "branching (SCHEDULED -> {PASSED, FAILED, MISSED}) with divergent side-effect sets per branch"
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, MISSED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /safety-audits/{id}/record-result, when calculations.safety_audit_outcome yields PASSED"
        actor: ComplianceOfficer
        preconditions:
          - "audit.status == SCHEDULED"
          - "current_utc >= audit.audit_window_opens_at"
          - "current_utc <= audit.audit_deadline_at"
        side_effects:
          - "audit.status := PASSED; audit.result_recorded_at := current_utc; audit.audit_score := the AUDITED variant output of calculations.carrier_compliance_risk_score"
          - "Carrier.entrant_status := PERMANENT; Carrier.audited_oos_rate_pct := request audited_oos_rate_pct; Carrier.compliance_risk_score := audit.audit_score; Carrier.compliance_risk_variant := AUDITED"
          - "every OperatingAuthority with carrier_id == audit.carrier_id and new_entrant_audit_status == PENDING (created_at ASC) has new_entrant_audit_status := PASSED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /safety-audits/{id}/record-result, when calculations.safety_audit_outcome yields FAILED"
        actor: ComplianceOfficer
        preconditions:
          - "audit.status == SCHEDULED"
          - "current_utc >= audit.audit_window_opens_at"
          - "current_utc <= audit.audit_deadline_at"
        side_effects:
          - "audit.status := FAILED; audit.result_recorded_at := current_utc; audit.audit_score := the AUDITED variant output of calculations.carrier_compliance_risk_score"
          - "Carrier.entrant_status stays NEW_ENTRANT; Carrier.audited_oos_rate_pct := request audited_oos_rate_pct; Carrier.compliance_risk_score := audit.audit_score; Carrier.compliance_risk_variant := AUDITED"
          - "every OperatingAuthority with carrier_id == audit.carrier_id and new_entrant_audit_status == PENDING (created_at ASC) has new_entrant_audit_status := FAILED"
          - "for each of those authorities whose authority_status == ACTIVE (created_at ASC): a RevocationProceeding is created with reason = SAFETY_AUDIT_FAILURE, status = NOTICE_ISSUED, notice_issued_at = current_utc, cure_deadline_at = current_utc + CURE_PERIOD_DAYS, and SUSPEND(authority, SAFETY_AUDIT_FAILURE) runs"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /compliance-sweeps step 1 (system)"
        actor: system
        preconditions:
          - "audit.status == SCHEDULED"
          - "current_utc > audit.audit_deadline_at (strictly greater)"
        side_effects:
          - "audit.status := MISSED"
          - "every OperatingAuthority with carrier_id == audit.carrier_id and new_entrant_audit_status == PENDING (created_at ASC) has new_entrant_audit_status := MISSED"
          - "for each of those authorities whose authority_status == ACTIVE: a RevocationProceeding is created with reason = AUDIT_WINDOW_MISSED, status = NOTICE_ISSUED, notice_issued_at = current_utc, cure_deadline_at = current_utc + CURE_PERIOD_DAYS, and SUSPEND(authority, AUDIT_WINDOW_MISSED) runs"

  - entity: CustomerContract
    state_field: status
    shape: "cyclic (ACTIVE -> SUSPENDED_BY_AUTHORITY -> ACTIVE) with a terminal exit"
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED_BY_AUTHORITY
        trigger: "SUSPEND hop 2 (system), reached from any authority suspension trigger"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
          - "the authority named by contract.authority_id transitioned ACTIVE -> SUSPENDED in this request"
        side_effects:
          - "contract.status := SUSPENDED_BY_AUTHORITY; contract.suspended_at := current_utc; contract.resumed_at := null"
          - "contract.disruption_liability_cents := SUSPENSION_ESTIMATE variant of calculations.contract_disruption_liability; contract.disruption_liability_variant := SUSPENSION_ESTIMATE"
          - "SUSPEND hop 3 embargoes this contract's TENDERED and IN_TRANSIT shipments and sets contract.embargoed_shipment_count"
      - from: SUSPENDED_BY_AUTHORITY
        to: ACTIVE
        trigger: "RESTORE hop 2 (system), reached from any authority restoration"
        actor: system
        preconditions:
          - "contract.status == SUSPENDED_BY_AUTHORITY"
          - "the authority named by contract.authority_id transitioned SUSPENDED -> ACTIVE in this request"
        side_effects:
          - "contract.status := ACTIVE; contract.resumed_at := current_utc"
          - "contract.disruption_liability_cents := SETTLED_ACTUAL variant of calculations.contract_disruption_liability; contract.disruption_liability_variant := SETTLED_ACTUAL"
          - "RESTORE hop 3 releases this contract's EMBARGOED shipments"
        note: "cycle edge; the two visits to ACTIVE differ in disruption_liability_variant"
      - from: ACTIVE
        to: TERMINATED
        trigger: "TERMINATE hop 2 (system), from authority revocation or rescission"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "contract.status := TERMINATED; contract.terminated_at := current_utc"
          - "TERMINATE hop 3 diverts this contract's TENDERED, IN_TRANSIT and EMBARGOED shipments"
      - from: SUSPENDED_BY_AUTHORITY
        to: TERMINATED
        trigger: "TERMINATE hop 2 (system), from authority revocation or rescission"
        actor: system
        preconditions:
          - "contract.status == SUSPENDED_BY_AUTHORITY"
        side_effects:
          - "contract.status := TERMINATED; contract.terminated_at := current_utc"
          - "TERMINATE hop 3 diverts this contract's remaining EMBARGOED shipments"

  - entity: Shipment
    state_field: status
    shape: "cyclic (IN_TRANSIT -> EMBARGOED -> IN_TRANSIT, and TENDERED -> EMBARGOED -> TENDERED) with two terminal exits"
    initial_state: TENDERED
    terminal_states: [DELIVERED, DIVERTED]
    transitions:
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/depart"
        actor: CarrierRep
        preconditions:
          - "shipment.status == TENDERED"
          - "X-User-ID == the Carrier.id owning the shipment's contract's authority"
          - "the CustomerContract named by shipment.contract_id has status == ACTIVE"
          - "the OperatingAuthority behind that contract has authority_status == ACTIVE"
        side_effects:
          - "shipment.status := IN_TRANSIT"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: CarrierRep
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "X-User-ID == the Carrier.id owning the shipment's contract's authority"
        side_effects:
          - "shipment.status := DELIVERED; shipment.delivered_at := current_utc"
        note: "DELIVERED is terminal, so a later authority suspension can no longer embargo this shipment (conditional cascade)"
      - from: TENDERED
        to: EMBARGOED
        trigger: "SUSPEND hop 3 (system)"
        actor: system
        preconditions:
          - "shipment.status == TENDERED"
          - "the contract named by shipment.contract_id transitioned ACTIVE -> SUSPENDED_BY_AUTHORITY in this request"
        side_effects:
          - "shipment.pre_embargo_status := TENDERED; shipment.status := EMBARGOED; shipment.embargoed_at := current_utc"
      - from: IN_TRANSIT
        to: EMBARGOED
        trigger: "SUSPEND hop 3 (system)"
        actor: system
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "the contract named by shipment.contract_id transitioned ACTIVE -> SUSPENDED_BY_AUTHORITY in this request"
        side_effects:
          - "shipment.pre_embargo_status := IN_TRANSIT; shipment.status := EMBARGOED; shipment.embargoed_at := current_utc"
      - from: EMBARGOED
        to: IN_TRANSIT
        trigger: "RESTORE hop 3 (system)"
        actor: system
        preconditions:
          - "shipment.status == EMBARGOED"
          - "shipment.pre_embargo_status == IN_TRANSIT"
          - "the contract named by shipment.contract_id transitioned SUSPENDED_BY_AUTHORITY -> ACTIVE in this request"
        side_effects:
          - "shipment.status := IN_TRANSIT; shipment.embargo_released_at := current_utc; shipment.embargo_days_accrued += ceil((current_utc - shipment.embargoed_at) / 1 day); shipment.pre_embargo_status := NONE"
      - from: EMBARGOED
        to: TENDERED
        trigger: "RESTORE hop 3 (system)"
        actor: system
        preconditions:
          - "shipment.status == EMBARGOED"
          - "shipment.pre_embargo_status == TENDERED"
          - "the contract named by shipment.contract_id transitioned SUSPENDED_BY_AUTHORITY -> ACTIVE in this request"
        side_effects:
          - "shipment.status := TENDERED; shipment.embargo_released_at := current_utc; shipment.embargo_days_accrued += ceil((current_utc - shipment.embargoed_at) / 1 day); shipment.pre_embargo_status := NONE"
      - from: TENDERED
        to: DIVERTED
        trigger: "TERMINATE hop 3 (system)"
        actor: system
        preconditions:
          - "shipment.status == TENDERED"
          - "the contract named by shipment.contract_id became TERMINATED in this request"
        side_effects:
          - "shipment.status := DIVERTED; shipment.diverted_at := current_utc"
      - from: IN_TRANSIT
        to: DIVERTED
        trigger: "TERMINATE hop 3 (system)"
        actor: system
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "the contract named by shipment.contract_id became TERMINATED in this request"
        side_effects:
          - "shipment.status := DIVERTED; shipment.diverted_at := current_utc"
      - from: EMBARGOED
        to: DIVERTED
        trigger: "TERMINATE hop 3 (system)"
        actor: system
        preconditions:
          - "shipment.status == EMBARGOED"
          - "the contract named by shipment.contract_id became TERMINATED in this request"
        side_effects:
          - "shipment.status := DIVERTED; shipment.diverted_at := current_utc; shipment.embargo_released_at := current_utc; shipment.embargo_days_accrued += ceil((current_utc - shipment.embargoed_at) / 1 day)"

# ============================================================================
# 1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: filing-create-stale-authority
    parent_entity: OperatingAuthority
    write_endpoint: "POST /insurance-filings"
    occ_field: "expected_authority_version"
    description: |
      Filing insurance against an OperatingAuthority whose version has advanced
      since the InsuranceFiler last read it is rejected with a stale-version
      error. This is the CREATE-with-supersede case: a new filing on an
      (authority_id, filing_type) slot legitimately cancels the prior ACTIVE
      occupant of that slot and rewrites its cancellation_effective_at, so a
      filer working from a stale view of the authority would silently supersede
      coverage it never saw and would recompute insurance_status from a limit
      set that has since changed.
    error_id: ERR_STALE_AUTHORITY_VERSION
    http_status: 412

  - rule_id: contract-create-stale-authority
    parent_entity: OperatingAuthority
    write_endpoint: "POST /operating-authorities/{id}/customer-contracts"
    occ_field: "expected_authority_version"
    description: |
      Creating a CustomerContract against an OperatingAuthority whose version has
      advanced since the CarrierRep last read it is rejected with a stale-version
      error. Contracts carry no uniqueness key, so a second create against the
      same authority would otherwise succeed on its own merits; the OCC check is
      what forces the writer to have observed the authority's current posture
      (authority_status, insurance_status, designation_coverage_complete,
      active_contract_count) before committing a shipper to it.
    error_id: ERR_STALE_AUTHORITY_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
#
# Global determinism rules for this scaffold:
#   * Every ordered walk (cascade order, sweep order, aggregation order) sorts by
#     the entity's `created_at` ASC. The random UUID `id` NEVER participates in
#     any selector, ranking, tie-break, allocation order or replay order.
#   * `current_utc` is the logical clock (POST /_clock/set_current_utc), which
#     reads exactly 2026-08-01T00:00:00.000Z until it is first set.
#   * Money is integer cents. Every rounding step is ROUND_HALF_UP.
# ============================================================================
calculations:
  - name: required_insurance_minimums
    trigger: "on POST /authority-applications (initial computation) and again on each POST /authority-applications/{id}/submit before the fee is frozen; the resulting three limits are copied onto the OperatingAuthority at PUBLISH and never recomputed afterwards"
    algorithm: threshold
    formula: |
      # Mode (a) combinatorial: four inputs interacting through nested max() and
      # branch selection, plus an additive threshold uplift keyed on a fifth.
      if transportation_type == 'PASSENGER':
          base = BIPD_PASSENGER_SMALL_CENTS if passenger_seating_capacity <= PASSENGER_SEAT_BREAK
                 else BIPD_PASSENGER_LARGE_CENTS
      elif transportation_type == 'PROPERTY_BROKER':
          base = 0
      else:   # FOR_HIRE_PROPERTY, HOUSEHOLD_GOODS, FREIGHT_FORWARDER
          base = BIPD_PROPERTY_BASE_CENTS

      if hazmat_endorsement_requested:
          haz = BIPD_HAZMAT_BULK_CENTS if hazmat_bulk_capable else BIPD_HAZMAT_NONBULK_CENTS
          base = max(base, haz)

      # Multi-jurisdiction uplift: additive, and applied ONLY when base > 0.
      # The comparison is >= (a 25-state applicant IS uplifted).
      if base > 0 and len(requested_operating_states) >= MULTISTATE_UPLIFT_THRESHOLD:
          base = base + MULTISTATE_UPLIFT_CENTS

      required_bipd_limit_cents  = base
      required_cargo_limit_cents = (CARGO_HOUSEHOLD_GOODS_CENTS
                                    if transportation_type == 'HOUSEHOLD_GOODS' else 0)
      required_bond_limit_cents  = (BROKER_BOND_CENTS
                                    if transportation_type in {'PROPERTY_BROKER', 'FREIGHT_FORWARDER'}
                                    else 0)
    input_set: "the AuthorityApplication's own input fields only; no other entity is consulted"
    constants:
      BIPD_PROPERTY_BASE_CENTS: 75000000
      BIPD_PASSENGER_SMALL_CENTS: 150000000
      BIPD_PASSENGER_LARGE_CENTS: 500000000
      BIPD_HAZMAT_NONBULK_CENTS: 100000000
      BIPD_HAZMAT_BULK_CENTS: 500000000
      CARGO_HOUSEHOLD_GOODS_CENTS: 1000000
      BROKER_BOND_CENTS: 7500000
      PASSENGER_SEAT_BREAK: 15
      MULTISTATE_UPLIFT_THRESHOLD: 25
      MULTISTATE_UPLIFT_CENTS: 25000000
    precision: "integer cents, no rounding required (all constants are whole cents)"

  - name: filing_fee_assessment
    trigger: "on POST /authority-applications (preview into filing_fee_cents and filing_fee_breakdown) and frozen at the first successful POST /authority-applications/{id}/submit, which appends the FILING_FEE_DEBIT for exactly this amount"
    algorithm: tiered_pricing
    formula: |
      # Mode (b) combinatorial: nested rounding whose ORDER changes the cents.
      # PINNED ORDER: apply the admin surcharge PER LINE ITEM, ROUND_HALF_UP each
      # line to whole cents, THEN sum the four rounded lines. Summing the four
      # un-rounded lines and rounding once at the end is WRONG and produces a
      # different total (e.g. REINSTATEMENT / FOR_HIRE_PROPERTY / 4 states /
      # hazmat = 92287 per-line vs 92286 sum-then-round).
      m = KIND_MULTIPLIER[application_kind]
      f = 1 + ADMIN_SURCHARGE_PCT

      line_docket_cents = round_half_up(DOCKET_BASE_CENTS * m * f)
      line_states_cents = round_half_up(PER_STATE_SURCHARGE_CENTS
                                       * len(requested_operating_states) * f)
      line_type_cents   = round_half_up(TYPE_FEE_CENTS[transportation_type] * m * f)
      line_hazmat_cents = (round_half_up(HAZMAT_ENDORSEMENT_FEE_CENTS * f)
                           if hazmat_endorsement_requested else 0)

      filing_fee_cents = (line_docket_cents + line_states_cents
                          + line_type_cents + line_hazmat_cents)
      filing_fee_breakdown = { line_docket_cents, line_states_cents,
                               line_type_cents, line_hazmat_cents }
    input_set: "the AuthorityApplication's application_kind, transportation_type, requested_operating_states and hazmat_endorsement_requested; note that the per-state line is NOT multiplied by KIND_MULTIPLIER while the docket and type lines ARE"
    constants:
      DOCKET_BASE_CENTS: 30000
      PER_STATE_SURCHARGE_CENTS: 137
      HAZMAT_ENDORSEMENT_FEE_CENTS: 10500
      ADMIN_SURCHARGE_PCT: 0.0725
      TYPE_FEE_CENTS:
        FOR_HIRE_PROPERTY: 30000
        HOUSEHOLD_GOODS: 45000
        PASSENGER: 45000
        PROPERTY_BROKER: 30000
        FREIGHT_FORWARDER: 30000
      KIND_MULTIPLIER:
        NEW: 1.0
        NAME_CHANGE: 0.5
        REINSTATEMENT: 1.25
        SUCCESSOR_IN_INTEREST: 0.75
    precision: "whole cents per line, ROUND_HALF_UP, rounded BEFORE summation"

  - name: carrier_compliance_risk_score
    trigger: "the SELF_REPORTED variant runs on POST /operating-authorities/{id}/activate; the AUDITED variant runs on POST /safety-audits/{id}/record-result and writes both SafetyAudit.audit_score and Carrier.compliance_risk_score"
    algorithm: weighted_scoring
    formula: |
      # Shared shape; the two variants differ in how the three components are
      # derived, so the SAME carrier scores differently under each.
      raw   = W_OOS * oos_component + W_DRIVER * driver_component + W_VEHICLE * vehicle_component + penalty
      score = round_half_up(min(SCORE_CEILING, max(SCORE_FLOOR, raw)), 2)
    input_set: "one Carrier row plus, for the AUDITED variant, the four measured factors supplied on the record-result request"
    constants:
      W_OOS: 0.45
      W_DRIVER: 0.30
      W_VEHICLE: 0.25
      FLEET_NORMALIZER: 10
      ACUTE_VIOLATION_PENALTY: 12.0
      SCORE_FLOOR: 0.0
      SCORE_CEILING: 100.0
    precision: "2 decimal places, ROUND_HALF_UP, applied once to the clamped raw score"
    variants:
      - name: SELF_REPORTED
        when: "at POST /operating-authorities/{id}/activate, before any SafetyAudit result exists"
        difference: |
          oos_component     = min(100.0, Carrier.self_reported_oos_rate_pct * 2.0)
          driver_component  = min(100.0, (Carrier.self_reported_driver_count
                                          / max(1, Carrier.self_reported_vehicle_count)) * 20.0)
          vehicle_component = min(100.0, (Carrier.self_reported_vehicle_count
                                          / FLEET_NORMALIZER) * 10.0)
          penalty           = 0.0
      - name: AUDITED
        when: "at POST /safety-audits/{id}/record-result, from the measured audit factors"
        difference: |
          oos_component     = min(100.0, audited_oos_rate_pct * 2.0)
          driver_component  = min(100.0, audited_driver_violation_count * 5.0)
          vehicle_component = min(100.0, audited_vehicle_defect_count * 4.0)
          penalty           = ACUTE_VIOLATION_PENALTY * acute_violation_count
          The driver and vehicle components are scaled from violation COUNTS, not
          from fleet ratios, so a carrier whose audited out-of-service rate equals
          its self-reported rate still lands on a different score.

  - name: safety_audit_outcome
    trigger: "on POST /safety-audits/{id}/record-result, immediately after the AUDITED variant of carrier_compliance_risk_score produces audit_score"
    algorithm: threshold
    formula: |
      # Boundary is >=, so an audit_score of exactly 40.00 FAILS.
      outcome = 'FAILED' if (audit_score >= AUDIT_FAILURE_SCORE_THRESHOLD
                             or acute_violation_count >= 1) else 'PASSED'
    input_set: "the audit_score just computed for this SafetyAudit plus the request's acute_violation_count"
    constants:
      AUDIT_FAILURE_SCORE_THRESHOLD: 40.0
    precision: "comparison on the already-rounded 2-decimal audit_score"

  - name: designation_coverage_status
    trigger: "recomputed on POST /operating-authorities/{id}/process-agent-designations and on POST /process-agent-designations/{id}/revoke; writes OperatingAuthority.designated_state_count and OperatingAuthority.designation_coverage_complete"
    algorithm: aggregation
    formula: |
      required = set(authority.required_jurisdictions)      # distinct, non-empty by construction
      covered  = { d.state_code
                   for d in ProcessAgentDesignation
                   if d.authority_id == authority.id
                   and d.status == 'ACTIVE'
                   and d.effective_from <= current_utc
                   and (d.effective_to is None or d.effective_to >= current_utc) }
      designated_state_count        = len(covered & required)
      designation_coverage_complete = (len(required - covered) == 0)
    input_set: |
      (a) source entity ProcessAgentDesignation with the explicit status filter
      status == 'ACTIVE' (REVOKED rows are excluded);
      (b) window: the designation's CLOSED interval [effective_from, effective_to]
      must contain current_utc, with effective_to == null meaning open-ended;
      (c) the result is a set cardinality, so it is order-insensitive and needs no
      tie-break; the ordered walk that writes it iterates designations created_at ASC.
    constants: {}
    precision: "integer count; designation_coverage_complete is the boolean (designated_state_count == len(required_jurisdictions))"

  - name: activation_eligibility_window
    trigger: "activation_eligible_at is stamped on the OperatingAuthority at PUBLISH; the eligibility comparison runs on POST /operating-authorities/{id}/activate"
    algorithm: threshold
    formula: |
      activation_eligible_at = publication_at + ACTIVATION_WAITING_PERIOD_DAYS days
      # Boundary is >=, so activation at exactly activation_eligible_at SUCCEEDS
      # and one millisecond earlier fails with ERR_WAITING_PERIOD_NOT_ELAPSED.
      eligible = (current_utc >= activation_eligible_at)
    input_set: "the single OperatingAuthority row plus current_utc"
    constants:
      ACTIVATION_WAITING_PERIOD_DAYS: 21
    precision: "exact UTC instant arithmetic, millisecond resolution"

  - name: new_entrant_audit_window
    trigger: "new_entrant_audit_deadline_at and SafetyAudit.audit_deadline_at are stamped at POST /operating-authorities/{id}/activate; the expiry comparison runs in POST /compliance-sweeps step 1"
    algorithm: threshold
    formula: |
      audit_deadline_at = activated_at + NEW_ENTRANT_AUDIT_WINDOW_MONTHS calendar
                          months, preserving the day-of-month; when the target
                          month has fewer days, clamp to that month's last day,
                          keeping the time-of-day unchanged.
      # Boundary is strictly >, so a sweep run at exactly audit_deadline_at leaves
      # the audit SCHEDULED; the next millisecond marks it MISSED.
      missed = (current_utc > audit_deadline_at)
    input_set: "SafetyAudit rows with status == 'SCHEDULED' only; PASSED, FAILED and MISSED rows are excluded from the sweep"
    constants:
      NEW_ENTRANT_AUDIT_WINDOW_MONTHS: 18
    precision: "exact UTC instant arithmetic, millisecond resolution"

  - name: insurance_coverage_interval_conflict
    trigger: "on POST /insurance-filings, before the row is created"
    algorithm: interval_merge
    formula: |
      # Interval semantics A: HALF-OPEN [effective_at, cancellation_effective_at),
      # so ADJACENCY IS ALLOWED — a new filing starting exactly at an existing
      # filing's cancellation_effective_at does NOT collide. There is no buffer.
      slot = { f for f in InsuranceFiling
               if f.authority_id == new.authority_id
               and f.filing_type == new.filing_type
               and f.status == 'ACTIVE' }
      for f in slot ordered by created_at ASC:
          f_end = f.cancellation_effective_at or +infinity
          overlaps = (new.effective_at < f_end)          # half-open, positive measure
          if overlaps:
              if new.effective_at > f.effective_at:
                  SUPERSEDE: f.status := 'CANCELLED';
                             f.cancellation_effective_at := new.effective_at;
                             new.supersedes_filing_id := f.id
              else:
                  REJECT with ERR_FILING_INTERVAL_OVERLAP
      # A back-dated or same-instant filing is therefore rejected, while a
      # forward-dated one truncates and supersedes the incumbent.
    input_set: "InsuranceFiling rows on the same (authority_id, filing_type) slot with status == 'ACTIVE'; CANCELLED rows are ignored. Ordered created_at ASC; at most one ACTIVE row can occupy a slot at a time, so no tie-break is reachable."
    constants: {}
    precision: "exact UTC instant comparison; equality of instants counts as NON-overlapping at the closing end and as overlapping at the opening end"

  - name: designation_interval_conflict
    trigger: "on POST /operating-authorities/{id}/process-agent-designations, evaluated once per requested state_code before any row is created"
    algorithm: interval_merge
    formula: |
      # Interval semantics B: CLOSED [effective_from, effective_to] EXPANDED by a
      # mandatory transition buffer on both ends, so ADJACENCY IS FORBIDDEN and
      # even a one-day gap collides. There is no supersede path — the request is
      # rejected outright.
      buffer = DESIGNATION_TRANSITION_BUFFER_DAYS days
      slot = { d for d in ProcessAgentDesignation
               if d.authority_id == new.authority_id
               and d.state_code == new.state_code
               and d.status == 'ACTIVE' }
      for d in slot ordered by created_at ASC:
          d_lo = d.effective_from - buffer
          d_hi = (d.effective_to + buffer) if d.effective_to is not None else +infinity
          n_lo = new.effective_from
          n_hi = new.effective_to if new.effective_to is not None else +infinity
          if n_lo <= d_hi and n_hi >= d_lo:            # closed-interval intersection
              REJECT with ERR_DESIGNATION_INTERVAL_CONFLICT
    input_set: "ProcessAgentDesignation rows on the same (authority_id, state_code) slot with status == 'ACTIVE'; REVOKED rows are ignored, which is how a gap is legitimately re-filled"
    constants:
      DESIGNATION_TRANSITION_BUFFER_DAYS: 1
    precision: "exact UTC instant comparison on closed, buffer-expanded intervals"

  - name: contract_disruption_liability
    trigger: "the SUSPENSION_ESTIMATE variant runs in SUSPEND hop 2; the SETTLED_ACTUAL variant runs in RESTORE hop 2"
    algorithm: forward_looking
    formula: |
      daily_cents = monthly_committed_revenue_cents / DAILY_DIVISOR   # exact rational
    input_set: "the single CustomerContract row plus its embargoed_shipment_count and the two clock instants suspended_at / resumed_at"
    constants:
      DAILY_DIVISOR: 30
      EMBARGO_PENALTY_PCT: 0.15
      GOODWILL_TIER_CENTS: 5000000
      GOODWILL_WAIVER_PCT: 0.10
    precision: "whole cents, ROUND_HALF_UP at each pinned step"
    variants:
      - name: SUSPENSION_ESTIMATE
        when: "written when the contract enters SUSPENDED_BY_AUTHORITY (SUSPEND hop 2)"
        difference: |
          # forward_looking: projects the WHOLE remaining term as disrupted.
          remaining_days = ceil((term_end_at - suspended_at) / 1 day)
          disruption_liability_cents = round_half_up(daily_cents * remaining_days
                                                    * EMBARGO_PENALTY_PCT)
          No shipment penalty and no goodwill waiver participate in this variant.
      - name: SETTLED_ACTUAL
        when: "written when the contract returns to ACTIVE (RESTORE hop 2)"
        difference: |
          # chronological: charges only the elapsed embargo, then applies a waiver
          # tier. Mode (c) combinatorial: the waiver percentage is keyed on the
          # PRE-WAIVER subtotal, not on the final figure, so the evaluation order
          # below is PINNED and the value is well defined.
          step 1: elapsed_days = ceil((resumed_at - suspended_at) / 1 day)
          step 2: base_cents = round_half_up(daily_cents * elapsed_days * EMBARGO_PENALTY_PCT)
          step 3: shipment_penalty_cents = round_half_up(daily_cents
                                                        * embargoed_shipment_count
                                                        * EMBARGO_PENALTY_PCT)
          step 4: pre_waiver_subtotal_cents = base_cents + shipment_penalty_cents
          step 5: goodwill_waiver_pct = (GOODWILL_WAIVER_PCT
                                         if pre_waiver_subtotal_cents >= GOODWILL_TIER_CENTS
                                         else 0.0)
          step 6: disruption_liability_cents = pre_waiver_subtotal_cents
                                    - round_half_up(pre_waiver_subtotal_cents
                                                    * goodwill_waiver_pct)
          The tier comparison at step 5 is >=, so a pre-waiver subtotal of exactly
          5000000 cents IS waived.

  - name: filing_fee_conservation_invariant
    trigger: "asserted after every FeeLedgerEntry append (submit, vetting-review DENY, fee-payment)"
    algorithm: aggregation
    formula: |
      # Conserved quantity 1: MONEY.
      # Identity that must hold at all times:
      Carrier.fee_balance_cents == sum(e.amount_cents for e in FeeLedgerEntry
                                       if e.carrier_id == Carrier.id)
      Carrier.fee_balance_cents == Carrier.fees_assessed_total_cents
                                  - Carrier.fees_reversed_total_cents
                                  - Carrier.fees_paid_total_cents
      # Round-trip requirement: the forward action (submit, which appends
      # +filing_fee_cents) paired with its compensating action (vetting-review
      # DENY, which appends -filing_fee_cents) MUST leave both
      # Carrier.fee_balance_cents and the difference
      # (fees_assessed_total_cents - fees_reversed_total_cents) at exactly the
      # values they held before the submit. A RETURN disposition is NOT a
      # compensating action and MUST leave the debit standing.
    input_set: "all FeeLedgerEntry rows for one Carrier, no status filter (the ledger is append-only and has no status), ordered created_at ASC for replay; the sum is order-insensitive so no tie-break applies"
    constants: {}
    precision: "exact integer cents; zero drift permitted"

  - name: contract_population_conservation_invariant
    trigger: "asserted after SUSPEND, RESTORE and TERMINATE complete"
    algorithm: aggregation
    formula: |
      # Conserved quantity 2: ENTITY POPULATION CARDINALITY (not money).
      # Identity that must hold at all times:
      authority.active_contract_count + authority.suspended_contract_count
        == count(c for c in CustomerContract
                 if c.authority_id == authority.id and c.status != 'TERMINATED')
      # Round-trip requirement: the forward action (any authority suspension,
      # which runs SUSPEND) paired with its compensating action (any authority
      # restoration, which runs RESTORE) MUST leave active_contract_count at its
      # pre-suspension value with suspended_contract_count back at 0, and MUST
      # leave every Shipment on those contracts in exactly the status it held
      # before the embargo (that is what Shipment.pre_embargo_status exists for).
      # No shipment may be lost to, or gained by, the round trip:
      count(s for s in Shipment if s.contract_id == c.id and s.status == 'EMBARGOED') == 0
    input_set: "CustomerContract rows for one OperatingAuthority with the explicit filter status != 'TERMINATED', and their Shipment children; ordered created_at ASC for the cascade walk"
    constants: {}
    precision: "exact integer counts; zero drift permitted"

  - name: compliance_sweep_epoch
    trigger: "on POST /compliance-sweeps"
    algorithm: chronological
    formula: |
      # Ops-run checkpoint. The three steps run in exactly this order, and within
      # each step rows are processed created_at ASC. Nothing is processed twice
      # inside one sweep: a proceeding opened by step 1 is NOT eligible for
      # step 3 in the same sweep, because step 3 only considers proceedings whose
      # notice_issued_at is strictly before this sweep's current_utc.
      step 1 (audit windows): for each SafetyAudit with status == 'SCHEDULED' and
              current_utc > audit_deadline_at, run the SCHEDULED -> MISSED
              transition (which may open a proceeding and SUSPEND authorities).
              audits_missed_count += 1 per audit.
      step 2 (biennial updates): for each Carrier with
              current_utc > biennial_update_due_at and biennial_delinquent == false,
              set biennial_delinquent := true.
              carriers_flagged_delinquent_count += 1 per carrier.
      step 3 (cure deadlines): for each RevocationProceeding with
              status == 'NOTICE_ISSUED', notice_issued_at < current_utc, and
              current_utc > cure_deadline_at, run NOTICE_ISSUED -> REVOKED
              (which runs TERMINATE on its authority).
              authorities_revoked_count += 1 per proceeding;
              contracts_terminated_count += the number of contracts TERMINATE
              moved in hop 2.
      swept_at = current_utc
    input_set: "the explicit per-step status filters above; every walk is created_at ASC, so the sweep is fully deterministic and idempotent when re-run at the same current_utc"
    constants:
      CURE_PERIOD_DAYS: 30
    precision: "integer counts; exact UTC instant comparisons"

# ============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
#
# Domain priority doctrine for a motor-carrier compliance office: identity and
# existence first, then the OCC guard (a stale writer must never be told about
# business state it may be reasoning about from a stale read), then target-state
# preconditions, then SAFETY / regulatory checks (hazmat and passenger authority,
# segregation of duties), then temporal conflicts, then referential coverage,
# then constraint satisfaction (insurance and registration adequacy), and money
# last. Two deliberately reachable conflicts are documented in §1.8 Rule 5.
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request; an empty-string header counts as absent"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the role in X-User-Role is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "the Carrier named by a {id} path segment on /carriers/... exists"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /carriers/{id}, GET /carriers/{id}/safety-audits, GET /carriers/{id}/fee-ledger-entries, POST /carriers/{id}/biennial-update, POST /carriers/{id}/fee-payments"

  - priority: 3
    category: existence
    check: "the AuthorityApplication named by a {id} path segment exists"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /authority-applications/{id}, POST /authority-applications/{id}/submit, POST /authority-applications/{id}/vetting-review"

  - priority: 3
    category: existence
    check: "the OperatingAuthority named by a {id} path segment exists"
    error_id: ERR_AUTHORITY_NOT_FOUND
    http_status: 404
    applies_to: "GET /operating-authorities/{id}, GET /operating-authorities/{id}/revocation-proceedings, GET /operating-authorities/{id}/customer-contracts, POST /operating-authorities/{id}/process-agent-designations, POST /operating-authorities/{id}/activate, POST /operating-authorities/{id}/customer-contracts"

  - priority: 3
    category: existence
    check: "the InsuranceFiling named by a {id} path segment exists"
    error_id: ERR_FILING_NOT_FOUND
    http_status: 404
    applies_to: "GET /insurance-filings/{id}, POST /insurance-filings/{id}/cancel"

  - priority: 3
    category: existence
    check: "any other path-addressed resource (ProcessAgentDesignation, RevocationProceeding, SafetyAudit, CustomerContract, Shipment) exists; path segments are resolved strictly left to right, so the leftmost missing resource determines the error"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /process-agent-designations/{id}, POST /process-agent-designations/{id}/revoke, POST /revocation-proceedings/{id}/cure, POST /safety-audits/{id}/record-result, GET /customer-contracts/{id}, POST /customer-contracts/{id}/shipments, GET /shipments/{id}, POST /shipments/{id}/depart, POST /shipments/{id}/deliver"

  - priority: 4
    category: auth
    check: "when X-User-Role is CarrierRep, X-User-ID equals the Carrier.id that owns the target resource, following authority_id -> carrier_id and contract_id -> authority_id -> carrier_id as needed"
    error_id: ERR_NOT_CARRIER_OWNER
    http_status: 403
    applies_to: "POST /carriers/{id}/biennial-update, POST /carriers/{id}/fee-payments, POST /authority-applications, POST /authority-applications/{id}/submit, POST /operating-authorities/{id}/process-agent-designations, POST /process-agent-designations/{id}/revoke, POST /operating-authorities/{id}/customer-contracts, POST /customer-contracts/{id}/shipments, POST /shipments/{id}/depart, POST /shipments/{id}/deliver"

  - priority: 5
    category: auth
    check: "when X-User-Role is InsuranceFiler, X-User-ID equals the Insurer.id named by the request's insurer_id (on create) or by the target InsuranceFiling.insurer_id (on cancel)"
    error_id: ERR_INSURER_NOT_FILING_PARTY
    http_status: 403
    applies_to: "POST /insurance-filings, POST /insurance-filings/{id}/cancel"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request BODY resolves to an existing row: carrier_id, predecessor_authority_id, authority_id, insurer_id, process_agent_id"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /authority-applications, POST /insurance-filings, POST /operating-authorities/{id}/process-agent-designations"

  - priority: 7
    category: existence
    check: "the request body is structurally valid: all required fields present, enums within their declared value sets, integers non-negative where declared, ISO-8601 instants parseable, state codes drawn from the 51 valid USPS codes, requested_operating_states non-empty and free of duplicates, term_start_at strictly before term_end_at, effective_to (when supplied) not before effective_from"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 8
    category: state
    check: "the supplied expected_authority_version equals the current OperatingAuthority.version (see §1.2.1); this guard runs before any business-state check so a stale writer learns nothing about state it may be misjudging"
    error_id: ERR_STALE_AUTHORITY_VERSION
    http_status: 412
    applies_to: "POST /insurance-filings, POST /operating-authorities/{id}/customer-contracts"

  - priority: 9
    category: state
    check: "the AuthorityApplication is in a status that admits the requested trigger: submit requires DRAFT or RETURNED_FOR_CORRECTION; vetting-review requires SUBMITTED"
    error_id: ERR_APPLICATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /authority-applications/{id}/submit, POST /authority-applications/{id}/vetting-review"

  - priority: 10
    category: state
    check: "the OperatingAuthority is in a status that admits the requested trigger: activate requires PENDING; contract create requires PENDING or ACTIVE (never SUSPENDED, REVOKED or RESCINDED); designation create/revoke requires PENDING or ACTIVE, plus the single repair exception that a designation CREATE is also admitted when authority_status == SUSPENDED and suspension_reason == DESIGNATION_GAP (that is the only way to close the gap that caused the suspension); designation create/revoke is never admitted on REVOKED or RESCINDED, nor on an authority SUSPENDED for any other reason"
    error_id: ERR_AUTHORITY_INVALID_STATE
    http_status: 409
    applies_to: "POST /operating-authorities/{id}/activate, POST /operating-authorities/{id}/process-agent-designations, POST /process-agent-designations/{id}/revoke, POST /operating-authorities/{id}/customer-contracts"

  - priority: 11
    category: state
    check: "the target InsuranceFiling is still ACTIVE; a filing already CANCELLED (by cancel or by supersede) cannot be cancelled again"
    error_id: ERR_FILING_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /insurance-filings/{id}/cancel"

  - priority: 12
    category: state
    check: "the RevocationProceeding is still NOTICE_ISSUED; a CURED or REVOKED proceeding is terminal"
    error_id: ERR_PROCEEDING_NOT_OPEN
    http_status: 409
    applies_to: "POST /revocation-proceedings/{id}/cure"

  - priority: 13
    category: state
    check: "the SafetyAudit is still SCHEDULED; a result cannot be recorded against a PASSED, FAILED or MISSED audit"
    error_id: ERR_AUDIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /safety-audits/{id}/record-result"

  - priority: 14
    category: state
    check: "the CustomerContract is ACTIVE; a contract SUSPENDED_BY_AUTHORITY or TERMINATED cannot accept new shipments"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /customer-contracts/{id}/shipments"

  - priority: 15
    category: state
    check: "the Shipment is in a status that admits the requested trigger: depart requires TENDERED; deliver requires IN_TRANSIT (an EMBARGOED shipment admits neither)"
    error_id: ERR_SHIPMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /shipments/{id}/depart, POST /shipments/{id}/deliver"

  - priority: 16
    category: business_safety
    check: "a shipment whose commodity requires hazardous-materials authority may only be tendered under an authority carrying that endorsement: contract.commodity_class == 'HAZMAT_BULK' requires authority.hazmat_endorsed and authority.hazmat_bulk_capable; commodity_class == 'HAZMAT_NONBULK' or shipment.hazmat == true requires authority.hazmat_endorsed"
    error_id: ERR_HAZMAT_AUTHORITY_REQUIRED
    http_status: 422
    applies_to: "POST /customer-contracts/{id}/shipments"

  - priority: 17
    category: business_safety
    check: "a contract whose commodity_class is PASSENGERS may only be written against an authority whose transportation_type is PASSENGER with a recorded passenger_seating_capacity of at least 1; conversely a PASSENGER authority may not carry freight commodity classes"
    error_id: ERR_PASSENGER_AUTHORITY_REQUIRED
    http_status: 422
    applies_to: "POST /operating-authorities/{id}/customer-contracts"

  - priority: 18
    category: business_safety
    check: "segregation of duties: the ComplianceOfficer X-User-ID activating an authority must differ from the AuthorityApplication.published_by_user_id that published it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /operating-authorities/{id}/activate"

  - priority: 19
    category: business_temporal
    check: "current_utc >= authority.activation_eligible_at (publication_at plus the 21-day waiting period); the comparison is inclusive at the boundary"
    error_id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /operating-authorities/{id}/activate"

  - priority: 20
    category: business_temporal
    check: "per insurance_coverage_interval_conflict: a new filing on an occupied (authority_id, filing_type) slot is rejected when its effective_at is not strictly after the incumbent ACTIVE filing's effective_at; adjacency at the incumbent's cancellation_effective_at is permitted"
    error_id: ERR_FILING_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /insurance-filings"

  - priority: 21
    category: business_temporal
    check: "per designation_interval_conflict: a requested state_code whose closed interval, expanded by the 1-day transition buffer on both ends, intersects an existing ACTIVE designation for the same (authority_id, state_code) is rejected; the whole request is rejected without creating any of its rows"
    error_id: ERR_DESIGNATION_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /operating-authorities/{id}/process-agent-designations"

  - priority: 22
    category: business_referential
    check: "every requested state_code appears in the designated ProcessAgent.coverage_states, unless that agent has blanket_agent == true, in which case all 51 codes are covered"
    error_id: ERR_PROCESS_AGENT_STATE_NOT_COVERED
    http_status: 422
    applies_to: "POST /operating-authorities/{id}/process-agent-designations"

  - priority: 23
    category: business_referential
    check: "the filing Insurer is authorized in the authority's domicile state: the owning Carrier.domicile_state appears in Insurer.authorized_states"
    error_id: ERR_INSURER_NOT_AUTHORIZED_IN_STATE
    http_status: 422
    applies_to: "POST /insurance-filings"

  - priority: 24
    category: business_referential
    check: "both the shipment's origin_state and destination_state are covered by an ACTIVE ProcessAgentDesignation on the owning authority whose interval contains current_utc"
    error_id: ERR_PROCESS_AGENT_NOT_DESIGNATED
    http_status: 422
    applies_to: "POST /customer-contracts/{id}/shipments"

  - priority: 25
    category: business_referential
    check: "application_kind REINSTATEMENT, NAME_CHANGE and SUCCESSOR_IN_INTEREST require a predecessor_authority_id naming a compatible predecessor, exactly as declared in the AuthorityApplication DRAFT -> SUBMITTED preconditions: NAME_CHANGE requires the predecessor's carrier_id == application.carrier_id and authority_status == ACTIVE; REINSTATEMENT requires carrier_id == application.carrier_id and authority_status == REVOKED; SUCCESSOR_IN_INTEREST requires carrier_id != application.carrier_id and authority_status IN {ACTIVE, SUSPENDED}. application_kind NEW must omit predecessor_authority_id entirely"
    error_id: ERR_PREDECESSOR_INVALID
    http_status: 422
    applies_to: "POST /authority-applications, POST /authority-applications/{id}/submit"

  - priority: 26
    category: business_constraint
    check: "authority.designation_coverage_complete is true — an ACTIVE ProcessAgentDesignation covers every one of the authority's required_jurisdictions at current_utc"
    error_id: ERR_PROCESS_AGENT_COVERAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /operating-authorities/{id}/activate"

  - priority: 27
    category: business_constraint
    check: "an ACTIVE InsuranceFiling exists for every filing_type the authority requires: BIPD whenever required_bipd_limit_cents > 0, CARGO whenever required_cargo_limit_cents > 0"
    error_id: ERR_INSURANCE_NOT_ON_FILE
    http_status: 422
    applies_to: "POST /operating-authorities/{id}/activate"

  - priority: 28
    category: business_constraint
    check: "each required ACTIVE filing's coverage_limit_cents is at least the matching required minimum on the authority; on filing creation the same check sets InsuranceFiling.meets_required_minimum and rejects a filing that would be booked below the minimum for its type"
    error_id: ERR_INSURANCE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /insurance-filings, POST /operating-authorities/{id}/activate, POST /revocation-proceedings/{id}/cure"

  - priority: 29
    category: business_constraint
    check: "a broker or freight-forwarder authority (required_bond_limit_cents > 0) additionally requires an ACTIVE SURETY_BOND or TRUST_FUND filing at or above required_bond_limit_cents"
    error_id: ERR_BOND_FILING_REQUIRED
    http_status: 422
    applies_to: "POST /operating-authorities/{id}/activate"

  - priority: 30
    category: business_constraint
    check: "the owning Carrier is current on its unified-registration obligations: Carrier.biennial_delinquent == false on activation, application submission and contract creation; contract creation additionally requires Carrier.unified_registration_status == 'REGISTERED' (unified registration is minted BY the first activation, so it is never demanded of the activation itself)"
    error_id: ERR_BIENNIAL_UPDATE_DELINQUENT
    http_status: 422
    applies_to: "POST /authority-applications/{id}/submit, POST /operating-authorities/{id}/activate, POST /operating-authorities/{id}/customer-contracts"

  - priority: 31
    category: business_fiscal
    check: "money last: the owning Carrier.fee_balance_cents is zero or negative (nothing outstanding) before an authority may be activated"
    error_id: ERR_FILING_FEE_OUTSTANDING
    http_status: 402
    applies_to: "POST /operating-authorities/{id}/activate"

# ============================================================================
# 1.5 API Endpoint Table  (21 writes + 16 reads = 37 endpoints)
#
# api_prefix is empty, so every path below is absolute.
# Read endpoints are deliberately open to all five roles and are NOT
# ownership-scoped; only writes carry the ownership checks of §1.4 rows 4 and 5.
# Every list endpoint accepts limit? and offset? and returns the §1.0 envelope's
# pagination block (total_count / has_more), ordered created_at ASC.
# ============================================================================
endpoints:
  # ---- Registry: carriers, agents, insurers --------------------------------
  - method: POST
    path: "/carriers"
    description: "Register a motor carrier with the compliance office. Mints a USDOT number and opens the 730-day biennial-update window."
    roles: [RegistryAdmin]
    code: 201
    input: [legal_name, "dba_name?", domicile_state, self_reported_vehicle_count, self_reported_driver_count, self_reported_oos_rate_pct]
    output: Carrier
    side_effects:
      - "usdot_number minted as a zero-padded 8-digit string, unique across carriers"
      - "biennial_update_due_at := created_at + 730 days"
      - "entrant_status := NEW_ENTRANT; unified_registration_status := NOT_REGISTERED; compliance_risk_variant := NONE; all four fee counters := 0"

  - method: GET
    path: "/carriers/{id}"
    description: "Read one carrier, including its derived fee counters, compliance risk score and biennial-update state."
    roles: [CarrierRep, InsuranceFiler, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/carriers/{id}/safety-audits"
    description: "List the new-entrant safety audits scheduled for this carrier. This is the ONLY discovery channel for a SafetyAudit, which is created as a side effect of activation and never returned by a write response."
    roles: [CarrierRep, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SafetyAudit[]
    side_effects: []

  - method: GET
    path: "/carriers/{id}/fee-ledger-entries"
    description: "List this carrier's append-only fee ledger, created_at ASC. Summing amount_cents must reproduce Carrier.fee_balance_cents exactly."
    roles: [CarrierRep, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: FeeLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/carriers/{id}/biennial-update"
    description: "File the biennial (MCS-150) update. Refreshes the self-reported fleet figures, clears delinquency and pushes the next deadline out 730 days."
    roles: [CarrierRep]
    code: 200
    input: [self_reported_vehicle_count, self_reported_driver_count, self_reported_oos_rate_pct]
    output: Carrier
    side_effects:
      - "self_reported_vehicle_count, self_reported_driver_count and self_reported_oos_rate_pct := the submitted values"
      - "last_biennial_update_at := current_utc; biennial_update_due_at := current_utc + 730 days; biennial_delinquent := false"

  - method: POST
    path: "/carriers/{id}/fee-payments"
    description: "Record a payment against the carrier's outstanding filing fees. Appends a FEE_PAYMENT_CREDIT ledger entry."
    roles: [CarrierRep, RegistryAdmin]
    code: 201
    input: [amount_cents, "memo?"]
    output: Carrier
    side_effects:
      - "a FeeLedgerEntry is appended with entry_type = FEE_PAYMENT_CREDIT and amount_cents = -amount_cents"
      - "Carrier.fees_paid_total_cents += amount_cents; Carrier.fee_balance_cents -= amount_cents"
      - "calculations.filing_fee_conservation_invariant re-asserted"

  - method: POST
    path: "/process-agents"
    description: "Register a process-agent organization that can accept service of process on a carrier's behalf."
    roles: [RegistryAdmin]
    code: 201
    input: [company_name, coverage_states, "blanket_agent?"]
    output: ProcessAgent
    side_effects:
      - "ProcessAgent is immutable (common_fields: false): no version field, no update endpoint"

  - method: POST
    path: "/insurers"
    description: "Register an insurance company authorized to submit filings, with the states in which it is admitted."
    roles: [RegistryAdmin]
    code: 201
    input: [company_name, naic_code, authorized_states]
    output: Insurer
    side_effects: []

  # ---- Authority applications ---------------------------------------------
  - method: POST
    path: "/authority-applications"
    description: "Open a draft authority application for one transportation type. Previews the filing fee and the three required insurance minimums; nothing is charged yet."
    roles: [CarrierRep]
    code: 201
    input: [carrier_id, application_kind, transportation_type, "predecessor_authority_id?", requested_operating_states, "hazmat_endorsement_requested?", "hazmat_bulk_capable?", "passenger_seating_capacity?", "proposed_legal_name?"]
    output: AuthorityApplication
    side_effects:
      - "status := DRAFT; submission_count := 0"
      - "filing_fee_cents and filing_fee_breakdown := output of calculations.filing_fee_assessment (preview only, no ledger entry)"
      - "required_bipd_limit_cents, required_cargo_limit_cents and required_bond_limit_cents := output of calculations.required_insurance_minimums"

  - method: GET
    path: "/authority-applications/{id}"
    description: "Read one authority application with its frozen fee breakdown, required minimums and vetting findings."
    roles: [CarrierRep, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: []
    output: AuthorityApplication
    side_effects: []

  - method: GET
    path: "/authority-applications"
    description: "List authority applications, filterable by owning carrier, by the predecessor authority they reference, and by status."
    roles: [CarrierRep, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["carrier_id?", "predecessor_authority_id?", "application_kind?", "status?", "limit?", "offset?"]
    output: AuthorityApplication[]
    side_effects: []

  - method: POST
    path: "/authority-applications/{id}/submit"
    description: "Submit a DRAFT or RETURNED_FOR_CORRECTION application for vetting. The first submission freezes and charges the filing fee; re-submissions after a correction do not charge again."
    roles: [CarrierRep]
    code: 200
    input: []
    output: AuthorityApplication
    side_effects:
      - "status := SUBMITTED; submission_count += 1"
      - "on the first submission only (submission_count becomes 1): filing_fee_cents and the three required limits are recomputed and FROZEN, a FeeLedgerEntry with entry_type = FILING_FEE_DEBIT and amount_cents = +filing_fee_cents is appended, and Carrier.fees_assessed_total_cents and Carrier.fee_balance_cents both increase by that amount"
      - "on any later submission: no recomputation, no ledger entry"

  - method: POST
    path: "/authority-applications/{id}/vetting-review"
    description: "Record the vetting analyst's disposition on a SUBMITTED application. RETURN sends it back for correction, PUBLISH creates the PENDING OperatingAuthority and starts the 21-day waiting period, DENY closes it and reverses the filing fee."
    roles: [VettingAnalyst]
    code: 200
    input: [disposition, findings, "denied_reason?"]
    output: AuthorityApplication
    side_effects:
      - "vetting_findings := findings; vetted_by_user_id := X-User-ID"
      - "disposition = RETURN: status := RETURNED_FOR_CORRECTION; the FILING_FEE_DEBIT stands (a return is NOT a compensating action)"
      - "disposition = PUBLISH: status := PUBLISHED; published_at := current_utc; published_by_user_id := X-User-ID; an OperatingAuthority is created with carrier_id, application_id, a minted docket_number, authority_status = PENDING, insurance_status = NOT_FILED, required_jurisdictions = the application's requested_operating_states, the three required limits copied from the application, hazmat_endorsed = hazmat_endorsement_requested, hazmat_bulk_capable, passenger_seating_capacity, publication_at = current_utc, and activation_eligible_at = output of calculations.activation_eligibility_window. The OperatingAuthority is NOT returned here; it is discoverable through GET /operating-authorities?application_id=..."
      - "disposition = DENY: status := DENIED; denied_reason := denied_reason; a FeeLedgerEntry with entry_type = FILING_FEE_REVERSAL_CREDIT and amount_cents = -filing_fee_cents is appended; Carrier.fees_reversed_total_cents += filing_fee_cents; Carrier.fee_balance_cents -= filing_fee_cents; calculations.filing_fee_conservation_invariant re-asserted"

  # ---- Operating authorities, designations, filings ------------------------
  - method: GET
    path: "/operating-authorities/{id}"
    description: "Read one operating authority, including both state dimensions, the coverage counters, the contract counters and the current version (required for every OCC-guarded write)."
    roles: [CarrierRep, InsuranceFiler, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: []
    output: OperatingAuthority
    side_effects: []

  - method: GET
    path: "/operating-authorities"
    description: "List operating authorities, filterable by owning carrier, by originating application, and by either state dimension. This is how a test discovers the authority created by a PUBLISH disposition."
    roles: [CarrierRep, InsuranceFiler, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["carrier_id?", "application_id?", "authority_status?", "insurance_status?", "limit?", "offset?"]
    output: OperatingAuthority[]
    side_effects: []

  - method: GET
    path: "/operating-authorities/{id}/revocation-proceedings"
    description: "List the revocation proceedings opened against this authority, created_at ASC. This is the ONLY discovery channel for a RevocationProceeding, which is created as a cascade side effect and never returned by a write response."
    roles: [CarrierRep, InsuranceFiler, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RevocationProceeding[]
    side_effects: []

  - method: POST
    path: "/operating-authorities/{id}/process-agent-designations"
    description: "Designate one process agent for a set of states in a single request. Either every requested state_code is accepted or the whole request is rejected; there is no partial success."
    roles: [CarrierRep]
    code: 201
    input: [process_agent_id, state_codes, effective_from, "effective_to?"]
    output: ProcessAgentDesignation[]
    side_effects:
      - "one ProcessAgentDesignation row per requested state_code, status = ACTIVE, created in the request's state_codes order; the response array is in that same order"
      - "all-or-nothing: if any state_code fails validation (coverage, interval conflict), NO row is created"
      - "OperatingAuthority.designated_state_count and designation_coverage_complete := output of calculations.designation_coverage_status; OperatingAuthority.version += 1"
      - "when the authority is SUSPENDED with suspension_reason = DESIGNATION_GAP and the new designations make designation_coverage_complete true, RESTORE(authority) runs (hops 1-3) and suspension_reason := NONE"

  - method: GET
    path: "/process-agent-designations/{id}"
    description: "Read one process-agent designation with its effective interval and status."
    roles: [CarrierRep, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: []
    output: ProcessAgentDesignation
    side_effects: []

  - method: GET
    path: "/process-agent-designations"
    description: "List process-agent designations, filterable by authority, by agent and by state."
    roles: [CarrierRep, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["authority_id?", "process_agent_id?", "state_code?", "status?", "limit?", "offset?"]
    output: ProcessAgentDesignation[]
    side_effects: []

  - method: POST
    path: "/process-agent-designations/{id}/revoke"
    description: "Revoke one state's process-agent designation. If this opens a gap in the authority's required jurisdictions, the authority is suspended and the suspension cascades to its contracts and their in-transit shipments."
    roles: [CarrierRep]
    code: 200
    input: []
    output: ProcessAgentDesignation
    side_effects:
      - "designation.status := REVOKED; revoked_at := current_utc"
      - "OperatingAuthority.designated_state_count and designation_coverage_complete := output of calculations.designation_coverage_status; OperatingAuthority.version += 1"
      - "when the authority is ACTIVE and designation_coverage_complete becomes false: SUSPEND(authority, DESIGNATION_GAP) runs (hop 1 authority, hop 2 contracts, hop 3 shipments). No RevocationProceeding is opened for a designation gap"

  - method: POST
    path: "/insurance-filings"
    description: "File proof of insurance (BIPD, cargo, surety bond or trust fund) for an authority. OCC-guarded on the authority's version: a forward-dated filing supersedes the incumbent on the same (authority_id, filing_type) slot; a back-dated or same-instant one is rejected."
    roles: [InsuranceFiler]
    code: 201
    input: [authority_id, insurer_id, filing_type, coverage_limit_cents, policy_number, effective_at, expected_authority_version]
    output: InsuranceFiling
    side_effects:
      - "meets_required_minimum := coverage_limit_cents >= the authority's required limit for this filing_type"
      - "per calculations.insurance_coverage_interval_conflict, any ACTIVE filing on the same (authority_id, filing_type) slot is CANCELLED with cancellation_effective_at := the new filing's effective_at, and the new row's supersedes_filing_id names it"
      - "OperatingAuthority.insurance_status recomputed across the required filing types (NOT_FILED / PARTIAL / FILED); OperatingAuthority.version += 1"
      - "cancellation_effective_at := null; status := ACTIVE"

  - method: GET
    path: "/insurance-filings/{id}"
    description: "Read one insurance filing, including the filing it superseded and whether it meets the required minimum."
    roles: [CarrierRep, InsuranceFiler, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: []
    output: InsuranceFiling
    side_effects: []

  - method: GET
    path: "/insurance-filings"
    description: "List insurance filings, filterable by authority, by insurer, by the filing they superseded, by type and by status."
    roles: [CarrierRep, InsuranceFiler, VettingAnalyst, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["authority_id?", "insurer_id?", "supersedes_filing_id?", "filing_type?", "status?", "limit?", "offset?"]
    output: InsuranceFiling[]
    side_effects: []

  - method: POST
    path: "/insurance-filings/{id}/cancel"
    description: "Cancel an active insurance filing. If this drops a required coverage, the authority's insurance lapses, a revocation proceeding opens with a 30-day cure deadline, and the authority is suspended with the full cascade onto contracts and shipments."
    roles: [InsuranceFiler]
    code: 200
    input: [cancellation_effective_at]
    output: InsuranceFiling
    side_effects:
      - "filing.status := CANCELLED; filing.cancellation_effective_at := the submitted instant"
      - "OperatingAuthority.insurance_status recomputed; when a required coverage is no longer satisfied it becomes LAPSED and OperatingAuthority.version += 1"
      - "when insurance_status becomes LAPSED and the authority is ACTIVE: a RevocationProceeding is created with reason = INSURANCE_LAPSE, status = NOTICE_ISSUED, notice_issued_at = current_utc and cure_deadline_at = current_utc + 30 days (discoverable only via GET /operating-authorities/{id}/revocation-proceedings), then SUSPEND(authority, INSURANCE_LAPSE) runs (hops 1-3)"

  - method: POST
    path: "/operating-authorities/{id}/activate"
    description: "Activate a PENDING authority once the 21-day waiting period has elapsed, agent coverage is complete, all required insurance is on file at the required minimums, registration is current and fees are settled. The activating officer must not be the officer who published the application."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OperatingAuthority
    side_effects:
      - "authority_status := ACTIVE; activated_at := current_utc; the originating AuthorityApplication moves PUBLISHED -> GRANTED"
      - "Carrier.unified_registration_status := REGISTERED; Carrier.active_authority_count += 1"
      - "Carrier.compliance_risk_score := the SELF_REPORTED variant of calculations.carrier_compliance_risk_score; Carrier.compliance_risk_variant := SELF_REPORTED"
      - "when Carrier.entrant_status == NEW_ENTRANT: new_entrant_audit_status := PENDING, new_entrant_audit_deadline_at := output of calculations.new_entrant_audit_window, and a SCHEDULED SafetyAudit is created for the carrier with the same deadline"
      - "when the originating application_kind == SUCCESSOR_IN_INTEREST: the predecessor authority is RESCINDED and TERMINATE's hops 2-3 run against it"
      - "OperatingAuthority.version += 1"

  - method: POST
    path: "/revocation-proceedings/{id}/cure"
    description: "Cure an open revocation proceeding by pointing at the replacement policy already on file. Restores the authority and reverses the entire suspension cascade with no drift."
    roles: [ComplianceOfficer]
    code: 200
    input: [replacement_policy_number]
    output: RevocationProceeding
    side_effects:
      - "the named policy_number must belong to an ACTIVE InsuranceFiling on this authority that meets the required minimum for its type, otherwise ERR_INSURANCE_BELOW_MINIMUM"
      - "proceeding.status := CURED; cured_at := current_utc; replacement_policy_number := the submitted value"
      - "RESTORE(authority) runs (hop 1 authority -> ACTIVE with suspension_reason := NONE, hop 2 contracts -> ACTIVE with the SETTLED_ACTUAL variant of calculations.contract_disruption_liability, hop 3 embargoed shipments -> pre_embargo_status with embargo_days_accrued increased)"
      - "calculations.contract_population_conservation_invariant re-asserted; OperatingAuthority.version += 1"

  - method: POST
    path: "/safety-audits/{id}/record-result"
    description: "Record the new-entrant safety audit's measured factors. Scores the carrier under the AUDITED variant and either passes the carrier to PERMANENT entrant status or fails it into a revocation proceeding and full suspension cascade."
    roles: [ComplianceOfficer]
    code: 200
    input: [audited_oos_rate_pct, audited_driver_violation_count, audited_vehicle_defect_count, acute_violation_count]
    output: SafetyAudit
    side_effects:
      - "audit.audit_score := the AUDITED variant of calculations.carrier_compliance_risk_score; result_recorded_at := current_utc"
      - "Carrier.audited_oos_rate_pct := audited_oos_rate_pct; Carrier.compliance_risk_score := the same score; Carrier.compliance_risk_variant := AUDITED"
      - "audit.status := output of calculations.safety_audit_outcome (PASSED or FAILED)"
      - "PASSED: Carrier.entrant_status := PERMANENT; every OperatingAuthority of this carrier with new_entrant_audit_status = PENDING moves to PASSED"
      - "FAILED: every such authority moves to new_entrant_audit_status = FAILED; for each ACTIVE authority of this carrier, created_at ASC, a RevocationProceeding is created with reason = SAFETY_AUDIT_FAILURE, status = NOTICE_ISSUED, cure_deadline_at = current_utc + 30 days, and SUSPEND(authority, SAFETY_AUDIT_FAILURE) runs (hops 1-3)"

  # ---- Customer contracts and shipments ------------------------------------
  - method: POST
    path: "/operating-authorities/{id}/customer-contracts"
    description: "Write a customer contract against an ACTIVE authority. OCC-guarded on the authority's version, because the authority's ability to carry the commodity may have changed since the carrier last read it."
    roles: [CarrierRep]
    code: 201
    input: [shipper_name, commodity_class, monthly_committed_revenue_cents, term_start_at, term_end_at, expected_authority_version]
    output: CustomerContract
    side_effects:
      - "status := ACTIVE; embargoed_shipment_count := 0; disruption_liability_cents := 0; disruption_liability_variant := NONE"
      - "OperatingAuthority.active_contract_count += 1; OperatingAuthority.version += 1"
      - "calculations.contract_population_conservation_invariant re-asserted"

  - method: GET
    path: "/operating-authorities/{id}/customer-contracts"
    description: "List the customer contracts written against this authority, created_at ASC — the same order in which the suspension and restoration cascades walk them."
    roles: [CarrierRep, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CustomerContract[]
    side_effects: []

  - method: GET
    path: "/customer-contracts/{id}"
    description: "Read one customer contract with its current disruption liability and which variant produced it."
    roles: [CarrierRep, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: []
    output: CustomerContract
    side_effects: []

  - method: POST
    path: "/customer-contracts/{id}/shipments"
    description: "Tender a shipment under an ACTIVE contract. Hazmat commodities require the matching endorsement, and both endpoints of the movement must sit in states covered by an active process-agent designation."
    roles: [CarrierRep]
    code: 201
    input: [origin_state, destination_state, tender_at, expected_delivery_at, declared_value_cents, "hazmat?"]
    output: Shipment
    side_effects:
      - "status := TENDERED; pre_embargo_status := NONE; embargo_days_accrued := 0"

  - method: GET
    path: "/shipments/{id}"
    description: "Read one shipment, including the status it held before an embargo and the embargo days it has accrued."
    roles: [CarrierRep, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/shipments"
    description: "List shipments, filterable by contract and status."
    roles: [CarrierRep, ComplianceOfficer, RegistryAdmin]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/shipments/{id}/depart"
    description: "Mark a tendered shipment as in transit."
    roles: [CarrierRep]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "status := IN_TRANSIT"

  - method: POST
    path: "/shipments/{id}/deliver"
    description: "Mark an in-transit shipment delivered. An embargoed shipment cannot be delivered until the authority is restored."
    roles: [CarrierRep]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "status := DELIVERED; delivered_at := current_utc"

  # ---- Operational sweep and logical clock ---------------------------------
  - method: POST
    path: "/compliance-sweeps"
    description: "Run the compliance office's periodic sweep at the current logical time. Executes exactly three ordered steps per calculations.compliance_sweep_epoch: missed safety-audit windows, delinquent biennial updates, then expired cure deadlines. Returns the counts it produced."
    roles: [ComplianceOfficer, RegistryAdmin]
    code: 200
    input: []
    output:
      swept_at: "the current_utc at which the sweep ran, ISO 8601 UTC with three fractional digits"
      audits_missed_count: "SafetyAudit rows moved SCHEDULED -> MISSED in step 1"
      carriers_flagged_delinquent_count: "Carrier rows whose biennial_delinquent flipped to true in step 2"
      authorities_revoked_count: "RevocationProceeding rows moved NOTICE_ISSUED -> REVOKED in step 3"
      contracts_terminated_count: "CustomerContract rows moved to TERMINATED by the TERMINATE cascades of step 3"
    side_effects:
      - "step 1 may open RevocationProceeding rows with reason = AUDIT_WINDOW_MISSED and run SUSPEND(authority, AUDIT_WINDOW_MISSED)"
      - "step 3 runs TERMINATE(authority) for each expired proceeding, which terminates contracts and diverts their non-delivered shipments"
      - "the sweep is idempotent at a fixed current_utc: re-running it at the same instant produces all-zero counts"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock, which every deadline, waiting period, interval and sweep comparison reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00.000Z (the fixed startup default) and MUST NOT fall back to real wall-clock time. The clock may be moved forward or backward to any instant."
    roles: [RegistryAdmin, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: "the logical clock after the set, ISO 8601 UTC with three fractional digits"
    side_effects:
      - "no entity is mutated and no sweep runs; only subsequent requests observe the new instant"

# ============================================================================
# 1.6 Error Code Catalog  (34 codes, every one triggerable from §1.5)
# ============================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or present but empty-string"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_CARRIER_OWNER
    http: 403
    condition: "a CarrierRep acts on a resource whose owning Carrier.id differs from X-User-ID"
  - id: ERR_INSURER_NOT_FILING_PARTY
    http: 403
    condition: "an InsuranceFiler creates or cancels a filing whose insurer_id differs from X-User-ID"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, negative amount, unparseable instant, invalid or duplicated state code, empty requested_operating_states, term_start_at not before term_end_at, or effective_to before effective_from"

  # --- existence ---
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "no Carrier with the given id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no AuthorityApplication with the given id"
  - id: ERR_AUTHORITY_NOT_FOUND
    http: 404
    condition: "no OperatingAuthority with the given id"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "no InsuranceFiling with the given id"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "any other referenced resource is missing — a body foreign key (insurer_id, process_agent_id, predecessor_authority_id) or a path-addressed ProcessAgentDesignation, RevocationProceeding, SafetyAudit, CustomerContract or Shipment"

  # --- optimistic concurrency ---
  - id: ERR_STALE_AUTHORITY_VERSION
    http: 412
    condition: "expected_authority_version does not equal the OperatingAuthority's current version (see §1.2.1)"

  # --- state preconditions ---
  - id: ERR_APPLICATION_INVALID_STATE
    http: 409
    condition: "submit on an application that is not DRAFT or RETURNED_FOR_CORRECTION, or vetting-review on an application that is not SUBMITTED"
  - id: ERR_AUTHORITY_INVALID_STATE
    http: 409
    condition: "activate on an authority that is not PENDING; a contract write on an authority that is not PENDING or ACTIVE; a designation write on an authority that is REVOKED or RESCINDED, or SUSPENDED for a reason other than DESIGNATION_GAP; or a designation REVOKE on any SUSPENDED authority"
  - id: ERR_FILING_NOT_ACTIVE
    http: 409
    condition: "cancel on an InsuranceFiling that is already CANCELLED"
  - id: ERR_PROCEEDING_NOT_OPEN
    http: 409
    condition: "cure on a RevocationProceeding that is already CURED or REVOKED"
  - id: ERR_AUDIT_INVALID_STATE
    http: 409
    condition: "record-result on a SafetyAudit that is already PASSED, FAILED or MISSED"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "tendering a shipment under a contract that is SUSPENDED_BY_AUTHORITY or TERMINATED"
  - id: ERR_SHIPMENT_INVALID_STATE
    http: 409
    condition: "depart on a shipment that is not TENDERED, or deliver on a shipment that is not IN_TRANSIT (an EMBARGOED shipment admits neither)"

  # --- safety / regulatory ---
  - id: ERR_HAZMAT_AUTHORITY_REQUIRED
    http: 422
    condition: "a hazmat shipment or hazmat commodity class is tendered under an authority lacking hazmat_endorsed, or a bulk hazmat commodity under an authority lacking hazmat_bulk_capable"
  - id: ERR_PASSENGER_AUTHORITY_REQUIRED
    http: 422
    condition: "a PASSENGERS contract is written against a non-PASSENGER authority (or one with no passenger_seating_capacity), or a freight commodity class against a PASSENGER authority"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the ComplianceOfficer activating an authority is the same user who published its application"

  # --- temporal ---
  - id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http: 422
    condition: "activate before current_utc reaches activation_eligible_at (publication_at + 21 days)"
  - id: ERR_FILING_INTERVAL_OVERLAP
    http: 409
    condition: "a new filing's effective_at is not strictly after the incumbent ACTIVE filing's effective_at on the same (authority_id, filing_type) slot"
  - id: ERR_DESIGNATION_INTERVAL_CONFLICT
    http: 409
    condition: "a requested designation interval, expanded by the 1-day transition buffer, intersects an existing ACTIVE designation for the same (authority_id, state_code)"

  # --- referential coverage ---
  - id: ERR_PROCESS_AGENT_STATE_NOT_COVERED
    http: 422
    condition: "a requested state_code is outside the designated non-blanket agent's coverage_states"
  - id: ERR_INSURER_NOT_AUTHORIZED_IN_STATE
    http: 422
    condition: "the filing insurer's authorized_states does not include the owning carrier's domicile_state"
  - id: ERR_PROCESS_AGENT_NOT_DESIGNATED
    http: 422
    condition: "a shipment's origin_state or destination_state has no ACTIVE process-agent designation covering current_utc on the owning authority"
  - id: ERR_PREDECESSOR_INVALID
    http: 422
    condition: "predecessor_authority_id is missing, present on a NEW application, owned by the wrong carrier for the application_kind, or in the wrong authority_status for the application_kind"

  # --- constraint satisfaction ---
  - id: ERR_PROCESS_AGENT_COVERAGE_INCOMPLETE
    http: 422
    condition: "activate while at least one required jurisdiction lacks an ACTIVE process-agent designation"
  - id: ERR_INSURANCE_NOT_ON_FILE
    http: 422
    condition: "activate while a required filing_type (BIPD, or CARGO for household goods) has no ACTIVE filing"
  - id: ERR_INSURANCE_BELOW_MINIMUM
    http: 422
    condition: "a filing is submitted below, or an activation or cure relies on a filing below, the required minimum limit for its type"
  - id: ERR_BOND_FILING_REQUIRED
    http: 422
    condition: "activate a broker or freight-forwarder authority with no ACTIVE SURETY_BOND or TRUST_FUND filing at or above required_bond_limit_cents"
  - id: ERR_BIENNIAL_UPDATE_DELINQUENT
    http: 422
    condition: "the owning carrier is flagged biennial_delinquent, or (for contract creation) is not yet unified-registered"

  # --- fiscal ---
  - id: ERR_FILING_FEE_OUTSTANDING
    http: 402
    condition: "activate while the owning Carrier.fee_balance_cents is greater than zero"

# ============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
#
# The compliance office separates the analyst who publishes an application from
# the officer who activates the resulting authority (§1.4 priority 18), and it
# separates the regulated parties (CarrierRep, InsuranceFiler) from the
# regulators entirely. Every role may read; only the listed writes are granted.
# ============================================================================
roles:
  - name: CarrierRep
    description: "Acts for one motor carrier: files applications, designates process agents, writes customer contracts and moves shipments."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /carriers/{id}/biennial-update"
      - "POST /authority-applications"
      - "POST /authority-applications/{id}/submit"
      - "POST /operating-authorities/{id}/process-agent-designations"
      - "POST /process-agent-designations/{id}/revoke"
      - "POST /operating-authorities/{id}/customer-contracts"
      - "POST /customer-contracts/{id}/shipments"
      - "POST /shipments/{id}/depart"
      - "POST /shipments/{id}/deliver"
    shared_operations:
      - "POST /carriers/{id}/fee-payments (shared with RegistryAdmin)"
      - "all GET endpoints"

  - name: InsuranceFiler
    description: "Acts for one insurance company: submits and cancels proof-of-insurance filings on behalf of carriers it insures."
    identity: "entity_backed:Insurer"
    exclusive_operations:
      - "POST /insurance-filings"
      - "POST /insurance-filings/{id}/cancel"
    shared_operations:
      - "GET /carriers/{id}, GET /operating-authorities/{id}, GET /operating-authorities, GET /operating-authorities/{id}/revocation-proceedings, GET /authority-applications/{id}, GET /authority-applications, GET /insurance-filings/{id}, GET /insurance-filings, GET /process-agent-designations/{id}, GET /process-agent-designations"

  - name: VettingAnalyst
    description: "Vets submitted applications and records the disposition that returns, publishes or denies them. Cannot activate what it published."
    identity: "opaque"
    exclusive_operations:
      - "POST /authority-applications/{id}/vetting-review"
    shared_operations:
      - "GET /carriers/{id}, GET /carriers/{id}/safety-audits, GET /authority-applications/{id}, GET /authority-applications, GET /operating-authorities/{id}, GET /operating-authorities, GET /process-agent-designations/{id}, GET /process-agent-designations, GET /insurance-filings/{id}, GET /insurance-filings"

  - name: ComplianceOfficer
    description: "Grants, restores and audits authority: activates published authorities, records safety-audit results, cures revocation proceedings and runs the periodic sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /operating-authorities/{id}/activate"
      - "POST /safety-audits/{id}/record-result"
      - "POST /revocation-proceedings/{id}/cure"
    shared_operations:
      - "POST /compliance-sweeps (shared with RegistryAdmin)"
      - "POST /_clock/set_current_utc (shared with RegistryAdmin)"
      - "all GET endpoints"

  - name: RegistryAdmin
    description: "Maintains the registry itself: enrolls carriers, process agents and insurers, records fee payments and runs the sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers"
      - "POST /process-agents"
      - "POST /insurers"
    shared_operations:
      - "POST /carriers/{id}/fee-payments (shared with CarrierRep)"
      - "POST /compliance-sweeps (shared with ComplianceOfficer)"
      - "POST /_clock/set_current_utc (shared with ComplianceOfficer)"
      - "all GET endpoints"
