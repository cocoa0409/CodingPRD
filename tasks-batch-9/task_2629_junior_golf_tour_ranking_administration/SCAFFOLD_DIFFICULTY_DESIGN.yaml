            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t1_id}/close-entries", payload: {}, as: TourAdmin, captures: { ec: $.data.entry_count } }
          trigger:
            - { call: "POST /tournaments/${t1_id}/set-field", payload: {}, as: TourAdmin, captures: { st: $.data.status, acc: $.data.accepted_count, wl: $.data.waitlist_count, open: $.data.open_slot_count, fq: $.data.field_quality_factor } }
          assert:
