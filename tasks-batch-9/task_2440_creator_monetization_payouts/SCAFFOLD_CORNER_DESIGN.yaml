# =============================================================================
# 1.9 Scaffold Corner Design — breadth coverage index for task_2440
# Sections are the nine sections of references/claim-extraction-guide.md;
# claim_type values are that guide's per-section table rows.
# Every instance name is unique across the union with SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: creator_create_returns_201_with_full_field_envelope
        claim_type: creation
        grounds:
          - "endpoints[POST /monetization/creators]"
          - entities.Creator.fields.display_name
          - entities.Creator.fields.country_code
        distinguishing_aspect: "POST /monetization/creators with every required input returns 201 and a data object carrying id, version 1, eligibility_status PENDING_REVIEW and payout_state ACCRUING."
        test_recipe:
          setup: ["Empty database; logical clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /monetization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Creator.${cr}.display_name == 'Ada Ads'"
            - "Creator.${cr}.country_code == 'US'"
            - "Creator.${cr}.follower_count == 50000"
            - "Creator.${cr}.watch_time_minutes_365d == 300000"
            - "Creator.${cr}.eligibility_status == 'PENDING_REVIEW'"
            - "Creator.${cr}.payout_state == 'ACCRUING'"
            - "Creator.${cr}.version == 1"
            - "response.meta.api_request_id is a non-blank string and response.response_type == 'object'"

      - name: creator_create_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Creator.fields.payout_threshold_cents
          - entities.Creator.fields.payout_method
          - "endpoints[POST /monetization/creators]"
        distinguishing_aspect: "Omitting the two optional inputs payout_threshold_cents and payout_method yields exactly 10000 and BANK_TRANSFER, not null and not a server-chosen alternative."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /monetization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /monetization/creators"
              payload: { display_name: "Default Dana", country_code: "GB", follower_count: 0, watch_time_minutes_365d: 0 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
          assert:
            - "Creator.${cr}.payout_threshold_cents == 10000"
            - "Creator.${cr}.payout_method == 'BANK_TRANSFER'"
            - "Creator.${cr}.active_strike_count == 0"
            - "Creator.${cr}.consecutive_payment_failures == 0"
            - "Creator.${cr}.fund_credit_balance_cents == 0"
            - "Creator.${cr}.outstanding_clawback_cents == 0"
            - "Creator.${cr}.last_evaluation_failed_criteria == []"

      - name: revenue_product_computes_suitability_sensitive_from_product_type
        claim_type: computed_fields
        grounds:
          - entities.RevenueProduct.fields.suitability_sensitive
          - "endpoints[POST /monetization/revenue-products]"
        distinguishing_aspect: "suitability_sensitive is computed as (product_type == ADVERTISING) and is not an input: an ADVERTISING product reports true while a TIPS product created in the same test reports false."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Fan Tips", creator_share_bps: 8000, platform_fee_bps: 2000 }
              as: PlatformAdmin
              captures: { tip_prod: "$.data.id" }
          trigger:
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "ADVERTISING", name: "Pre-roll Ads", creator_share_bps: 5000, platform_fee_bps: 5000 }
              as: PlatformAdmin
              captures: { ad_prod: "$.data.id" }
          assert:
            - "RevenueProduct.${ad_prod}.suitability_sensitive == true"
            - "RevenueProduct.${tip_prod}.suitability_sensitive == false"
            - "RevenueProduct.${ad_prod}.status == 'ACTIVE'"
            - "RevenueProduct.${ad_prod}.retired_at == null"

      - name: revenue_product_defaults_min_payable_and_terms_version
        claim_type: defaults
        grounds:
          - entities.RevenueProduct.fields.min_payable_cents
          - entities.RevenueProduct.fields.terms_version
        distinguishing_aspect: "Omitting min_payable_cents and terms_version yields 0 and 1 respectively, so a first-version product accrues every positive share."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /monetization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "COMMERCE", name: "Merch Store", creator_share_bps: 6000, platform_fee_bps: 4000 }
              as: PlatformAdmin
              captures: { prod: "$.data.id" }
          assert:
            - "RevenueProduct.${prod}.min_payable_cents == 0"
            - "RevenueProduct.${prod}.terms_version == 1"

      - name: investigation_create_defaults_hold_payouts_true
        claim_type: defaults
        grounds:
          - entities.Investigation.fields.hold_payouts
          - "endpoints[POST /monetization/investigations]"
        distinguishing_aspect: "Omitting hold_payouts defaults it to true, so the investigation encumbers the balance and Creator.payout_state becomes HOLD without the caller asking for it."
        test_recipe:
          setup: ["One creator with no balance; no investigation yet."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Holdy Hal", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
          trigger:
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${cr}", scope: "Suspected reused third-party footage", violation_window_start: "2026-08-01T00:00:00Z", violation_window_end: "2026-08-10T00:00:00Z" }
              as: PolicyReviewer
              as_user_id: "pr_open_1"
              captures: { inv: "$.data.id" }
          assert:
            - "Investigation.${inv}.hold_payouts == true"
            - "Investigation.${inv}.state == 'OPEN'"
            - "Investigation.${inv}.hold_amount_cents == 0"
            - "Investigation.${inv}.opened_by_user_id == 'pr_open_1'"
            - "Creator.${cr}.payout_state == 'HOLD'"

      - name: creator_fund_create_defaults_min_watch_and_max_allocation
        claim_type: defaults
        grounds:
          - entities.CreatorFund.fields.min_watch_time_minutes
          - entities.CreatorFund.fields.max_allocation_cents
          - entities.CreatorFund.fields.unallocated_remainder_cents
        distinguishing_aspect: "Omitting min_watch_time_minutes and max_allocation_cents yields 0 and 2000000, and a DRAFT fund reports unallocated_remainder_cents equal to its whole pool."
        test_recipe:
          setup: ["One OPEN EarningsPeriod exists."]
          setup_api_calls:
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { per: "$.data.id" }
          trigger:
            - call: "POST /monetization/creator-funds"
              payload: { name: "August Boost", period_id: "${per}", total_pool_cents: 100000, methodology: "PRO_RATA_WATCH_TIME" }
              as: PlatformAdmin
              captures: { fd: "$.data.id" }
          assert:
            - "CreatorFund.${fd}.min_watch_time_minutes == 0"
            - "CreatorFund.${fd}.max_allocation_cents == 2000000"
            - "CreatorFund.${fd}.status == 'DRAFT'"
            - "CreatorFund.${fd}.allocated_cents == 0"
            - "CreatorFund.${fd}.unallocated_remainder_cents == 100000"
            - "CreatorFund.${fd}.recipient_count == 0"
            - "CreatorFund.${fd}.allocation_run_count == 0"

      - name: get_creator_returns_stored_row_with_zero_derived_balances
        claim_type: retrieval
        grounds:
          - "endpoints[GET /monetization/creators/{creator_id}]"
          - calculations.creator_balance_projection
        distinguishing_aspect: "GET /monetization/creators/{creator_id} echoes the stored inputs and reports all four projected money fields as 0 for a creator with no ledger, no investigation and no statement."
        test_recipe:
          setup: ["One freshly registered creator, nothing else."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
          trigger:
            - call: "GET /monetization/creators/${cr}"
              payload: {}
              as: Auditor
          assert:
            - "HTTP status == 200"
            - "data.id == '${cr}'"
            - "data.ledger_balance_cents == 0"
            - "data.held_cents == 0"
            - "data.statement_payable_cents == 0"
            - "data.available_balance_cents == 0"

      - name: list_creators_pagination_envelope_and_status_filter
        claim_type: listing
        grounds:
          - "endpoints[GET /monetization/creators]"
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /monetization/creators with limit 2 returns exactly 2 of the 3 rows with total_count 3 and has_more true, and the eligibility_status filter narrows the same collection to the single ELIGIBLE row."
        test_recipe:
          setup: ["Three creators; exactly one has been evaluated to ELIGIBLE, the other two remain PENDING_REVIEW."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Creator One", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr1: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Creator Two", country_code: "GB", follower_count: 20, watch_time_minutes_365d: 20 }
              as: PlatformAdmin
              captures: { cr2: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Creator Three", country_code: "DE", follower_count: 30, watch_time_minutes_365d: 30 }
              as: PlatformAdmin
              captures: { cr3: "$.data.id" }
            - call: "POST /monetization/creators/${cr1}/evaluate"
              payload: {}
              as: FinanceOperator
          trigger:
            - call: "GET /monetization/creators"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /monetization/creators"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PlatformAdmin
          assert:
            - "first call: len(data) == 2 and total_count == 3 and has_more == true"
            - "second call: len(data) == 1 and total_count == 1 and has_more == false"
            - "second call: data[0].id == '${cr1}' and data[0].eligibility_status == 'ELIGIBLE'"

      - name: list_revenue_events_filtered_by_status_and_creator
        claim_type: listing
        grounds:
          - "endpoints[GET /monetization/revenue-events]"
          - entities.RevenueEvent.fields.status
        distinguishing_aspect: "GET /monetization/revenue-events?status=BELOW_MINIMUM returns only the sub-minimum event and excludes the ACCRUED one, proving the status filter is applied and not ignored."
        test_recipe:
          setup: ["One ELIGIBLE creator, one OPEN period, one SUBSCRIPTIONS product with min_payable_cents 250, one event whose share is 250 (ACCRUED) and one whose share is 249 (BELOW_MINIMUM)."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
            - call: "POST /monetization/creators/${cr}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { per: "$.data.id" }
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "SUBSCRIPTIONS", name: "Memberships", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 250 }
              as: PlatformAdmin
              captures: { prod: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr}", product_id: "${prod}", gross_amount_cents: 500, occurred_at: "2026-08-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev_ok: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr}", product_id: "${prod}", gross_amount_cents: 498, occurred_at: "2026-08-06T00:00:00Z" }
              as: FinanceOperator
              captures: { ev_low: "$.data.id" }
          trigger:
            - call: "GET /monetization/revenue-events"
              payload: { creator_id: "${cr}", status: "BELOW_MINIMUM" }
              as: FinanceOperator
          assert:
            - "len(data) == 1 and total_count == 1"
            - "data[0].id == '${ev_low}'"
            - "data[0].creator_share_cents == 0"
            - "RevenueEvent.${ev_ok}.status == 'ACCRUED' and RevenueEvent.${ev_ok}.creator_share_cents == 250"

      - name: get_creator_unknown_id_returns_creator_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_CREATOR_NOT_FOUND]"
          - "validations[priority=10]"
        distinguishing_aspect: "A syntactically valid but unknown creator_id in the path yields 404 ERR_CREATOR_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup: ["One real creator exists so the collection is non-empty."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
          trigger:
            - call: "GET /monetization/creators/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: FinanceOperator
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_CREATOR_NOT_FOUND'"

