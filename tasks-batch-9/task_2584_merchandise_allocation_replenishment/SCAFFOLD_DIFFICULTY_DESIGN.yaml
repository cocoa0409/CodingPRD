# =============================================================================
# §1.8 Scaffold Difficulty Design — Merchandise Allocation & Replenishment (2584)
# 9 rule_id blocks, 24 instances. Every numeric literal in every `assert:` was
# computed by executing the §1.3 formula with its declared constants.
# Logical clock default: 2026-08-01T00:00:00Z (never overridden unless a call
# to POST /_clock/set_current_utc appears in the chain).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: store_need_forward_looking_vs_historical_sell_through
        grounds:
          - calculations.store_need_units
          - calculations.receipt_proration
          - entities.AllocationLine.fields.need_units
          - entities.AllocationRun.fields.need_basis
          - entities.StorePosition.fields.on_order_units
        distinguishing_aspect: |
          The same four StorePositions and the same 60-unit receipt yield store 0101 a need of 26
          under FORWARD_LOOKING and 33 under HISTORICAL_SELL_THROUGH, because the forward variant
          rounds weekly demand to an integer before multiplying by COVER_WEEKS and counts
          on_order_units in the pipeline, while the historical variant rounds once after the cover
          multiply and ignores on_order_units entirely.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with four stores 0101(A,13000,URBAN) 0102(B,10000,URBAN) 0103(C,12500,SUBURBAN) 0104(D,11000,SUBURBAN)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 20 / pmin 8, 0104 capacity 20 / pmin 6"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500, core_size_min_share_bp 1500; SKU-1001 is SEASONAL so its resolved model is DEMAND_DRIVEN"
            - "Positions: 0101 on_hand 6 + on_order 4, forecast 9, trailing 30; 0102 on_hand 20, forecast 5, trailing 16; 0103 on_hand 2, forecast 3, trailing 6; 0104 on_hand 0, forecast 2, trailing 5"
            - "A 60-unit receipt is STAGED; no promotional event exists, so every store's lift is the 10000 default"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "C", grade_index_bp: 12500, cluster_code: "SUBURBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0104", grade: "D", grade_index_bp: 11000, cluster_code: "SUBURBAN", freight_flat_usd: 55.00, historical_sell_through_bp: 3100 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s4_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s3_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 1, facings_per_fixture: 4, units_per_facing: 5, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s4_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 1, facings_per_fixture: 4, units_per_facing: 5, presentation_min_units: 6 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }], core_size_min_share_bp: 1500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 6, size_on_hand: [{ size_code: "S", units: 0 }, { size_code: "M", units: 4 }, { size_code: "L", units: 2 }, { size_code: "XL", units: 0 }], on_order_units: 4, min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 20, size_on_hand: [{ size_code: "S", units: 5 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 2 }], on_order_units: 0, min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s3_id}", item_id: "${item_id}", on_hand_units: 2, size_on_hand: [{ size_code: "S", units: 0 }, { size_code: "M", units: 1 }, { size_code: "L", units: 1 }, { size_code: "XL", units: 0 }], on_order_units: 0, min_units: 8, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 6 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p3_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s4_id}", item_id: "${item_id}", on_hand_units: 0, size_on_hand: [], on_order_units: 0, min_units: 6, max_units: 20, weekly_forecast_units: 2, trailing_4wk_sales_units: 5 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p4_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-9001", units_received: 60, size_received: [{ size_code: "S", units: 12 }, { size_code: "M", units: 21 }, { size_code: "L", units: 18 }, { size_code: "XL", units: 9 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
          trigger:
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run_fwd_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run_fwd_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { fwd_units: $.data.units_proposed, fwd_rem: $.data.unallocated_remainder_units }
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run_fwd_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { line_fwd_s1: "$.data[0].id" }
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
              captures: { rcpt_v2: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "HISTORICAL_SELL_THROUGH", expected_receipt_version: "${rcpt_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run_hst_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run_hst_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { hst_units: $.data.units_proposed, hst_rem: $.data.unallocated_remainder_units }
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run_hst_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { line_hst_s1: "$.data[0].id" }
          assert:
            - "AllocationLine.${line_fwd_s1}.need_units == 26"
            - "AllocationLine.${line_fwd_s1}.units_proposed == 26"
            - "AllocationLine.${line_fwd_s1}.size_breakdown == [{S:5},{M:10},{L:8},{XL:3}]"
            - "AllocationRun.${run_fwd_id}.units_proposed == 44 and unallocated_remainder_units == 16 and eligible_store_count == 3"
            - "AllocationLine.${line_hst_s1}.need_units == 33"
            - "AllocationLine.${line_hst_s1}.units_proposed == 33"
            - "AllocationLine.${line_hst_s1}.size_breakdown == [{S:7},{M:12},{L:10},{XL:4}]"
            - "AllocationRun.${run_hst_id}.units_proposed == 45 and unallocated_remainder_units == 15 and eligible_store_count == 3"
            - "The two variants diverge on the same data: 26 != 33 for store 0101, 10 (FORWARD_LOOKING) != 6 (HISTORICAL_SELL_THROUGH) for store 0103, 8 != 6 for store 0104"
            - "AllocationRun.${run_fwd_id}.status == CANCELLED (superseded by the second run) and AllocationLine.${line_fwd_s1}.fulfillment_status == RECALLED, yet its units_proposed remains 26 for audit"

      - name: cluster_scorecard_simple_average_vs_unit_weighted
        grounds:
          - calculations.cluster_scorecard
          - entities.PerformanceSnapshot.fields.in_stock_pct_bp
          - entities.PerformanceSnapshot.fields.sell_through_pct_bp
          - entities.PerformanceSnapshot.fields.allocation_accuracy_bp
          - entities.AllocationProgram.fields.scorecard_basis
        distinguishing_aspect: |
          On the URBAN cluster's two positions the SIMPLE_AVERAGE basis reports in_stock 7500 and
          sell_through 6389 while UNIT_WEIGHTED reports 7000 and 6388, because the first floors each
          store's ratio and then averages the ratios, and the second sums numerators and denominators
          and divides once — a different entity domain (performance measurement on
          PerformanceSnapshot) from the allocation-need variance of the first instance.
        test_recipe:
          setup:
            - "Same program, stores, plans, curve, SKU and four positions as store_need_forward_looking_vs_historical_sell_through"
            - "URBAN holds exactly two positions: 0101 (available 6, min 12, trailing 30) and 0102 (available 20, min 8, trailing 16)"
            - "A 40-unit receipt has been spread FORWARD_LOOKING and COMMITTED, giving store 0101 24 units and store 0102 none"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "C", grade_index_bp: 12500, cluster_code: "SUBURBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0104", grade: "D", grade_index_bp: 11000, cluster_code: "SUBURBAN", freight_flat_usd: 55.00, historical_sell_through_bp: 3100 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s4_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s3_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 1, facings_per_fixture: 4, units_per_facing: 5, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s4_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 1, facings_per_fixture: 4, units_per_facing: 5, presentation_min_units: 6 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }], core_size_min_share_bp: 1500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 6, size_on_hand: [{ size_code: "S", units: 0 }, { size_code: "M", units: 4 }, { size_code: "L", units: 2 }, { size_code: "XL", units: 0 }], on_order_units: 4, min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 20, size_on_hand: [{ size_code: "S", units: 5 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 2 }], on_order_units: 0, min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s3_id}", item_id: "${item_id}", on_hand_units: 2, size_on_hand: [{ size_code: "S", units: 0 }, { size_code: "M", units: 1 }, { size_code: "L", units: 1 }, { size_code: "XL", units: 0 }], on_order_units: 0, min_units: 8, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 6 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p3_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s4_id}", item_id: "${item_id}", on_hand_units: 0, size_on_hand: [], on_order_units: 0, min_units: 6, max_units: 20, weekly_forecast_units: 2, trailing_4wk_sales_units: 5 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p4_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-9002", units_received: 40, size_received: [{ size_code: "S", units: 8 }, { size_code: "M", units: 14 }, { size_code: "L", units: 12 }, { size_code: "XL", units: 6 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/allocation-runs/${run_id}/commit"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /allocation/performance-snapshots"
              payload: { program_id: "${prog_id}", cluster_code: "URBAN", basis: "SIMPLE_AVERAGE" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
              captures: { snap_simple: $.data.id }
            - call: "POST /allocation/performance-snapshots"
              payload: { program_id: "${prog_id}", cluster_code: "URBAN", basis: "UNIT_WEIGHTED" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
              captures: { snap_weighted: $.data.id }
            - call: "POST /allocation/performance-snapshots"
              payload: { program_id: "${prog_id}", cluster_code: "URBAN" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
              captures: { snap_default: $.data.id }
          assert:
            - "PerformanceSnapshot.${snap_simple}.in_stock_pct_bp == 7500"
            - "PerformanceSnapshot.${snap_simple}.sell_through_pct_bp == 6389"
            - "PerformanceSnapshot.${snap_weighted}.in_stock_pct_bp == 7000"
            - "PerformanceSnapshot.${snap_weighted}.sell_through_pct_bp == 6388"
            - "PerformanceSnapshot.${snap_simple}.allocation_accuracy_bp == 5218 and PerformanceSnapshot.${snap_weighted}.allocation_accuracy_bp == 5218 (basis-independent)"
            - "PerformanceSnapshot.${snap_default}.basis == UNIT_WEIGHTED and in_stock_pct_bp == 7000 (program.scorecard_basis default applied when basis omitted)"
            - "PerformanceSnapshot.${snap_simple}.store_count == 2 and included_position_count == 2 (stores 0103 and 0104 are SUBURBAN and excluded)"
            - "AllocationLine for store 0101 has units_allocated == 24 and the line for store 0102 does not exist, so allocated-vs-sold deviation is |24-30| + |0-16| == 22"
  - rule_id: combinatorial_formula
    instances:
      - name: proration_nested_min_max_with_lift_and_capacity_cap
        grounds:
          - calculations.receipt_proration
          - calculations.store_need_units
          - calculations.promo_lift_factor_bp
          - entities.AllocationLine.fields.capacity_capped_units
          - entities.AllocationRun.fields.unallocated_remainder_units
        distinguishing_aspect: |
          A single propose composes four conditional layers whose order is observable: the promo
          selector picks 11000 for store 0101 (STORE scope) over the larger 12500 CLUSTER lift, need is
          max(0, target - pipeline), the share is min(FLOOR(pool*need/total), need), then min(that,
          fixture headroom), and finally the remainder loop refuses to give a single unit away because
          every store already sits at min(need, headroom) - leaving 10 units stranded on a 60-unit
          receipt whose network need is 52.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with four stores 0101(A,13000,URBAN) 0102(B,10000,URBAN) 0103(C,12500,SUBURBAN) 0104(D,11000,SUBURBAN)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 20 / pmin 8, 0104 capacity 20 / pmin 6"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500, core_size_min_share_bp 1500; SKU-1001 is SEASONAL so its resolved model is DEMAND_DRIVEN"
            - "Positions: 0101 on_hand 6 + on_order 4, forecast 9, trailing 30; 0102 on_hand 20, forecast 5, trailing 16; 0103 on_hand 2, forecast 3, trailing 6; 0104 on_hand 0, forecast 2, trailing 5"
            - "Store 0104's shelf plan is deliberately tiny: 1 fixture x 2 facings x 3 units = capacity 6, presentation minimum 4"
            - "Two ACTIVE promotional events cover the logical clock 2026-08-01: BTS-STORE-0101 (STORE scope on 0101, lift 11000) and BTS-URBAN (CLUSTER scope on URBAN, lift 12500)"
            - "A 60-unit receipt (S 12 / M 21 / L 18 / XL 9) is STAGED and a DEMAND_DRIVEN / FORWARD_LOOKING run is DRAFT"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
