            - "the compliance-1 call returns HTTP 200 with status == FILED and filed_at == \"2026-01-08T14:00:00.000Z\""
            - "due_at is \"2026-01-12T23:59:59.999Z\" and shares == 250"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_participant_version_rejects_trading_plan_adoption
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[trading-plan-adopt-stale-participant]
          - validations[priority=45]
          - errors[ERR_STALE_PARTICIPANT_VERSION]
          - endpoints[POST /trading-plans]
        distinguishing_aspect: |
          The §1.2.1 rule trading-plan-adopt-stale-participant: replaying the version the
          client read before the first adoption yields ERR_STALE_PARTICIPANT_VERSION (412), and
          re-reading the participant and resending version 2 succeeds and supersedes the
          EFFECTIVE plan - so the guard is a version check, not a duplicate-suppression rule.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan; NON_INSIDER participant at version 1 (cooling-off 0 days)."
            - "One TradingPlan adopted with expected_participant_version 1 - leaving the participant at version 2 - and activated to EFFECTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan India Three", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Olive Occ", employee_number: "E-C-530", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1994-09-09" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /trading-plans"
              payload: { participant_id: "${p_id}", plan_document_ref: "10b5-1/2026/030", first_scheduled_trade_date: "2026-03-02", total_shares: 800, expected_participant_version: "${p_v}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { tp1_id: $.data.id }
            - call: "POST /trading-plans/${tp1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /trading-plans"
              payload: { participant_id: "${p_id}", plan_document_ref: "10b5-1/2026/031", first_scheduled_trade_date: "2026-04-01", total_shares: 700, expected_participant_version: "${p_v}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { err_stale: $.data.error_id }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { p_v2: $.data.version }
            - call: "POST /trading-plans"
              payload: { participant_id: "${p_id}", plan_document_ref: "10b5-1/2026/031", first_scheduled_trade_date: "2026-04-01", total_shares: 700, expected_participant_version: "${p_v2}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { tp2_id: $.data.id }
          assert:
            - "the stale retry returns HTTP 412 with error_id ERR_STALE_PARTICIPANT_VERSION"
            - "after the refusal only one TradingPlan row exists, TradingPlan.${tp1_id}.status == EFFECTIVE, and Participant.${p_id}.version is still 2"
            - "the re-read reports version 2, i.e. exactly one increment for the successful adoption"
            - "the retry with version 2 returns HTTP 201 with status PENDING_COOLING_OFF, cooling_off_days == 0 and superseded_plan_id == \"${tp1_id}\""
            - "TradingPlan.${tp1_id}.status becomes EXPIRED and Participant.${p_id}.version becomes 3"

      - name: occ_stale_plan_version_rejects_share_reserve_adjustment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reserve-adjustment-stale-plan]
          - validations[priority=45]
          - errors[ERR_STALE_PLAN_VERSION]
          - endpoints[POST /equity-plans/{id}/share-reserve-adjustments]
          - calculations.share_reserve_ledger
        distinguishing_aspect: |
          The §1.2.1 rule reserve-adjustment-stale-plan: two adjustments sized against the same
          read of version 1 cannot both land - the first bumps the plan to version 2 and the
          second is refused with ERR_STALE_PLAN_VERSION (412) even though the adjustment itself
          would be legitimate, and resending it with version 2 succeeds and reaches version 3.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; one ACTIVE plan at version 1 with 1000000 authorized shares and nothing committed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Juliet Three", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id, pl_v: $.data.version }
          trigger:
            - call: "POST /equity-plans/${plan_id}/share-reserve-adjustments"
              payload: { delta_shares: 5000, expected_plan_version: "${pl_v}", adjustment_reason: "shareholder amendment" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans/${plan_id}/share-reserve-adjustments"
              payload: { delta_shares: -1000, expected_plan_version: "${pl_v}", adjustment_reason: "clerical correction" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_stale: $.data.error_id }
            - call: "GET /equity-plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { pl_v2: $.data.version }
            - call: "POST /equity-plans/${plan_id}/share-reserve-adjustments"
              payload: { delta_shares: -1000, expected_plan_version: "${pl_v2}", adjustment_reason: "clerical correction" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "the first adjustment returns HTTP 200 with total_authorized_shares == 1005000, available_reserve_shares == 1005000 and version == 2"
            - "the second adjustment returns HTTP 412 with error_id ERR_STALE_PLAN_VERSION"
            - "after the refusal total_authorized_shares is still 1005000 and version is still 2 (the refused write increments nothing)"
            - "the re-read reports version 2 and the retry returns HTTP 200 with total_authorized_shares == 1004000, available_reserve_shares == 1004000 and version == 3"
            - "shares_committed_cumulative and shares_returned_cumulative stay 0 throughout, so the ledger identity 1004000 + 0 - 0 == 1004000 holds"

      - name: termination_fanout_voids_preclearance_and_terminates_trading_plan
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /participants/{id}/terminate]
          - state_machines.PreclearanceRequest.APPROVED_to_VOID
          - state_machines.TradingPlan.EFFECTIVE_to_TERMINATED
          - calculations.post_termination_exercise_period
        distinguishing_aspect: |
          The independent fan-out runs even when nothing vests: terminating a participant with
          no grants at all still voids the APPROVED preclearance request, terminates the
          EFFECTIVE trading plan and writes ptep_expiry_date 2026-05-11 (90 days after a
          VOLUNTARY termination on 2026-02-10), while the window's
          approved_shares_cumulative is left untouched.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan; OPEN window over [2026-01-05T00:00:00Z, 2026-03-31T00:00:00Z); NON_INSIDER participant with no grants."
            - "The participant holds an APPROVED preclearance request for 300 shares and an EFFECTIVE TradingPlan (cooling-off 0 days)."
            - "The clock is advanced to 2026-02-10T09:00:00Z before the termination."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Kilo Three", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Fan Out", employee_number: "E-C-540", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1995-10-10" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w_id: $.data.id }
            - call: "POST /trading-windows/${w_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /trading-plans"
              payload: { participant_id: "${p_id}", plan_document_ref: "10b5-1/2026/040", first_scheduled_trade_date: "2026-03-02", total_shares: 600, expected_participant_version: "${p_v}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { tp_id: $.data.id }
            - call: "POST /trading-plans/${tp_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /preclearance-requests"
              payload: { participant_id: "${p_id}", window_id: "${w_id}", transaction_type: "OPEN_MARKET_SALE", requested_shares: 300, intended_trade_date: "2026-02-16" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /preclearance-requests/${pr_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /participants/${p_id}/terminate"
              payload: { termination_date: "2026-02-10", termination_reason: "VOLUNTARY" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "HTTP status is 200 with employment_status == TERMINATED and ptep_expiry_date == \"2026-05-11\""
            - "PreclearanceRequest.${pr_id}.status == VOID even though it had already been APPROVED"
            - "TradingPlan.${tp_id}.status == TERMINATED (from EFFECTIVE) with modification_count still 0"
            - "TradingWindow.${w_id}.approved_shares_cumulative is still 300; the fan-out does not recompute the window reservation"
            - "EquityPlan.shares_committed_cumulative == 0 and shares_returned_cumulative == 0 because the participant held no grants"
            - "Participant.${p_id}.version == 3 (one increment for the adoption, one for the termination)"

      - name: cascading_side_effects_four_hop_termination_chain
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /participants/{id}/terminate]
          - calculations.termination_vesting_resolution
          - calculations.share_reserve_ledger
        excluded_because:
          difficulty_instance: cascade_depth / termination_forfeiture_cascade_depth_four
          rationale: "The named 1.8 instance already walks the full four-hop chain end to end - tranche resolution, per-grant reweighting, plan ledger and net burn-rate update, then the grant-level FORFEITED / PARTIALLY_FORFEITED roll-up - with every intermediate value pinned, which is strictly stronger than any shallower cascade probe."

      - name: dual_variant_burn_rate_gross_versus_net
        claim_type: dual_variant_calculation
        grounds:
          - calculations.burn_rate_variants
          - entities.EquityPlan.fields.gross_burn_rate_bps
          - entities.EquityPlan.fields.net_burn_rate_bps
        excluded_because:
          difficulty_instance: dual_variant_calc / burn_rate_gross_vs_net_divergence
          rationale: "The named 1.8 instance drives both variants from the same fiscal-year accumulators through a forfeiture that returns shares, asserting the exact divergence between gross_burn_rate_bps and net_burn_rate_bps and that the gate reads only the gross variant."

      - name: rate_threshold_trigger_at_the_burn_rate_limit
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.burn_rate_variants
          - validations[priority=75]
          - errors[ERR_BURN_RATE_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / burn_rate_exactly_at_limit_allowed
          rationale: "The named 1.8 instance tests the cumulative threshold at its exact boundary (approval landing precisely on burn_rate_limit_bps is allowed, headroom_shares 0, and the next single share is refused), which is the boundary claim this layer asks for; the annual-rollover reset of the same accumulators is covered by evergreen_topup_capped_at_evergreen_cap_shares in the calculations section."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_derived_fields_visible_in_same_response
        claim_type: immediate
        grounds:
