              captures: { small_status: $.data.status }
          assert:
            - "${p1_err} == \"ERR_MAGNITUDE_BELOW_DECLARATION_FLOOR\" with HTTP 422 - 4.9 is below DECLARATION_MIN_MAGNITUDE 5.0 and the magnitude check runs before the treaty check"
            - "${p2_err} == \"ERR_NO_REINSURANCE_PROGRAM\" with HTTP 409 - treaty_year 2026 has no ACTIVE layer yet"
            - "${lay_status} == \"ACTIVE\" and the second declare of the same event returns HTTP 200 with ${p3_status} == \"DECLARED\""
