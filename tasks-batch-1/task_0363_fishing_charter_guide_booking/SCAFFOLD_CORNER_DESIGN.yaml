            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Rb2 Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "Y1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Rb2boat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap Y2", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Rb2 Cust", email: "rb2@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2029-01-10T12:00:00Z", return_at: "2029-01-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v2: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
          trigger:
            - call: "POST /charters/${ch_id}/weather-hold"
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_user_context_rejected
        claim_type: Unauthorized Operation
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_USER_CONTEXT]"
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_MISSING_USER_CONTEXT (400) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /marinas"
              payload: { name: "NoAuth Marina", slot_count: 2 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_MISSING_USER_CONTEXT"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[booking-create-stale-charter]"
          - entities.Charter.fields.version
          - 'endpoints.POST /bookings'
        distinguishing_aspect: "POST /bookings with expected_charter_version matching the current Charter.version succeeds (201) and bumps Charter.version by 1."
        test_recipe:
          setup: ["Charter DRAFT version 1."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Occ2 Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Occ2boat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Occ2 Cust", email: "occ2@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2029-02-10T12:00:00Z", return_at: "2029-02-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { new_v: $.data.version }
          assert:
            - "Booking.${bk_id}.status == RESERVED"
            - "Charter.${ch_id}.version == 2"

      - name: occ_stale_version_on_booking_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[booking-create-stale-charter]"
          - "errors[ERR_STALE_CHARTER_VERSION]"
          - 'endpoints.POST /bookings'
        distinguishing_aspect: "After one booking advances Charter.version to 2, a second POST /bookings still carrying expected_charter_version 1 (the original) is rejected ERR_STALE_CHARTER_VERSION (412)."
        test_recipe:
          setup: ["Charter DRAFT; first booking created (version advanced); second create reuses the stale original version."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Stale Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Staleboat", length_ft: 30, passenger_capacity: 8 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Stale Cust1", email: "stale1@x.com" }
              as: Customer
              captures: { cust1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Stale Cust2", email: "stale2@x.com" }
              as: Customer
              captures: { cust2_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2029-03-10T12:00:00Z", return_at: "2029-03-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 8 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust1_id}", party_size: 1, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust1_id}"
          trigger:
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust2_id}", party_size: 1, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_CHARTER_VERSION"

      - name: occ_stale_version_on_slot_reservation_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[slot-reserve-stale-charter]"
          - "errors[ERR_STALE_CHARTER_VERSION]"
          - 'endpoints.POST /slot-reservations'
        distinguishing_aspect: "After a booking advances Charter.version, a POST /slot-reservations carrying the stale original version is rejected ERR_STALE_CHARTER_VERSION (412)."
        test_recipe:
          setup: ["Charter DRAFT; a booking advances its version; then a slot reservation reuses the stale version."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "SlotStale Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "Z1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "SlotStaleboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "SS Cust", email: "ss@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2029-04-10T12:00:00Z", return_at: "2029-04-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 1, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_CHARTER_VERSION"

      - name: dual_variant_refund_divergence_stub
        claim_type: dual_variant_calculation
        grounds:
          - calculations.cancellation_refund_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_weather_waiver_vs_lead_time_tier
          rationale: "The weather-waiver vs lead-time refund divergence is the asserted outcome of the named §1.8 instance."

      - name: transitive_cascade_charter_cancel_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Charter.transitions.DRAFT_SCHEDULED_WEATHER_HOLD_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / charter_cancel_to_booking_cancel_to_addon_void
          rationale: "The depth-3 cancel cascade is exercised end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_seat_count_visible_in_same_flow
        claim_type: immediate
        grounds:
          - entities.Charter.fields.seats_booked
          - 'endpoints.POST /bookings'
          - "'endpoints.GET /charters/{charterId}'"
        distinguishing_aspect: "After POST /bookings party 2, an immediate GET /charters/{id} reflects seats_booked == 2 with no lag (immediate consistency)."
        test_recipe:
          setup: ["Charter DRAFT seats_total 6."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Imm Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Immboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Imm Cust", email: "imm@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2029-05-10T12:00:00Z", return_at: "2029-05-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { seats: $.data.seats_booked }
          assert:
            - "Charter.${ch_id}.seats_booked == 2"
