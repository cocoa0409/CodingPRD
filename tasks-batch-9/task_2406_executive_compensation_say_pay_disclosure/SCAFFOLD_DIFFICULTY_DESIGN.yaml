      - name: peer_group_referential_gate_outranks_benchmark_cap_at_program_approval
        grounds:
          - validations.priority_25_ERR_PEER_GROUP_NOT_APPROVED
          - validations.priority_46_ERR_TDC_EXCEEDS_BENCHMARK_CAP
          - calculations.target_total_direct_comp
          - calculations.benchmark_target_tdc
        distinguishing_aspect: |
          Both rules are attached to the very same endpoint (program approval) and both are business-tier, but the
          `business_referential` cross-entity gate at priority 25 fires before the `business_fiscal` cap at
          priority 46. The fixture is engineered so the cap breach is large and unambiguous (18,000,000.00 against
          a 13,500,000.00 cap), which makes it tempting to report the fiscal error first; the peer group being
