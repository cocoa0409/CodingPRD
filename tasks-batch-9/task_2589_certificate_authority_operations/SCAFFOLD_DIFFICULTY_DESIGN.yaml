              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/misissuance-incidents"
              payload: { title: "first incident, disclosed exactly on the deadline", category: "PROCEDURAL", scope_profile_id: "${prof_id}", scope_issued_from: "2026-07-01T00:00:00Z", scope_issued_to: "2026-07-31T00:00:00Z", subscriber_id: "${sub_id}" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { inc1_id: $.data.id }
            - call: "POST /ca/misissuance-incidents"
              payload: { title: "second incident, disclosed one second late", category: "PROCEDURAL", scope_profile_id: "${prof_id}", scope_issued_from: "2026-07-01T00:00:00Z", scope_issued_to: "2026-07-31T00:00:00Z", subscriber_id: "${sub_id}" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { inc2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/misissuance-incidents/${inc1_id}/disclose"
              payload: { root_program: "APPLE", body: "disclosed at the deadline instant" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:01Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/misissuance-incidents/${inc2_id}/disclose"
              payload: { root_program: "APPLE", body: "disclosed one second after the deadline" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
          assert:
            - "at clock == disclosure_due_at exactly: MisissuanceIncident.${inc1_id}.disclosure_breached == false AND MisissuanceIncident.${inc2_id}.disclosure_breached == false (sweep 3 uses a strict >)"
            - "i1's INCIDENT_DISCLOSURE communication has within_deadline == true (the flag uses an inclusive <=)"
            - "after the clock moves to due + 1 s: MisissuanceIncident.${inc2_id}.disclosure_breached == true while ${inc1_id} stays false because it was already DISCLOSED"
            - "i2's INCIDENT_DISCLOSURE communication has within_deadline == false"
            - "both incidents are in state DISCLOSED and both communications carry incident_id set, audit_id null, sent_by_user_id 'u_aud_1'"
            - "GET /ca/misissuance-incidents?disclosure_breached=true returns exactly one row, ${inc2_id}"
  - rule_id: cross_entity_state_dependency
