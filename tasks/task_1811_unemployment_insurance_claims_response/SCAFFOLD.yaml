# =============================================================================
# Task 1811 — Unemployment Insurance Claims Response (employer)
# Seed tables: entities, state machines, calculations, validations,
# endpoints, errors, RBAC. Difficulty: HARDER-THAN-EXPERT (saturated).
# =============================================================================

scenario: |
  1811. Unemployment Insurance Claims Response (employer): claim notice intake
  & separation reason coding, response deadline tracking by state,
  documentation assembly (warnings/policy/final incident), hearing scheduling
  & witness preparation, determination appeal decision & deadlines, charge
  statement audit & erroneous charge protest, experience rating impact
  modeling, third-party administrator oversight

domain_name: ui-claims-response
api_prefix: /ui

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: EmployerAccount
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: fein, type: string, source: input, description: "Federal EIN; unique per account", constraints: "9-digit string; globally unique" }
      - { name: merit_rating_method, type: enum, source: input, description: "RESERVE_RATIO | BENEFIT_RATIO — state's experience-rating formula family", constraints: "enum {RESERVE_RATIO, BENEFIT_RATIO}" }
      - { name: reserve_balance_cents, type: integer, source: computed, default: 0, description: "Cumulative contributions minus cumulative benefits charged (reserve-ratio states)" }
      - { name: taxable_payroll_cents, type: integer, source: input, description: "Trailing taxable payroll base used in rating denominators" }
      - { name: current_tax_rate_bps, type: integer, source: computed, default: 270, description: "Current UI tax rate in basis points, recomputed by experience_rating_projection" }
      - { name: protest_credits_cents, type: integer, source: computed, default: 0, description: "Cumulative credits won from sustained charge protests" }
      - { name: compliance_posture, type: enum, source: computed, default: CLEAR, description: "CLEAR | WATCH | SANCTIONED — aggregate posture derived from late responses and denied protests", constraints: "enum {CLEAR, WATCH, SANCTIONED}" }
      - { name: late_response_strikes, type: integer, source: computed, default: 0, description: "Count of claims whose response missed the state deadline; posture threshold input" }

  - name: TpaEngagement
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> EmployerAccount.id; the represented employer" }
      - { name: tpa_name, type: string, source: input, description: "Third-party administrator firm name" }
      - { name: authority_scope, type: enum, source: input, description: "RESPONSE_ONLY | RESPONSE_AND_HEARING | FULL — what the TPA may file", constraints: "enum {RESPONSE_ONLY, RESPONSE_AND_HEARING, FULL}" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of engagement window" }
      - { name: effective_to, type: datetime, source: input, description: "Inclusive end of engagement window" }
      - { name: oversight_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE → SUSPENDED → REINSTATED | TERMINATED", constraints: "enum {ACTIVE, SUSPENDED, REINSTATED, TERMINATED}" }
      - { name: breach_count, type: integer, source: computed, default: 0, description: "Number of oversight breaches (late filings, scope violations) attributed to this TPA" }

  - name: StateRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code; unique", constraints: "2-letter USPS code; unique" }
      - { name: response_window_days, type: integer, source: input, description: "Number of days employer has to respond to a claim notice" }
      - { name: window_basis, type: enum, source: input, description: "CALENDAR | BUSINESS — how response_window_days is counted", constraints: "enum {CALENDAR, BUSINESS}" }
      - { name: appeal_window_days, type: integer, source: input, description: "Days from determination mailing date to file an appeal" }
      - { name: protest_window_days, type: integer, source: input, description: "Days from charge statement issue date to protest a charge line" }
      - { name: weekend_shift, type: enum, source: input, description: "NEXT_BUSINESS_DAY | NONE — deadline landing on Sat/Sun/holiday shifts forward or stands", constraints: "enum {NEXT_BUSINESS_DAY, NONE}" }

  - name: ClaimantSeparation
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> EmployerAccount.id; separating employer" }
      - { name: claimant_name, type: string, source: input, description: "Claimant full name" }
      - { name: ssn_last4, type: string, source: input, description: "Last four of SSN", constraints: "4-digit string" }
      - { name: last_day_worked, type: datetime, source: input, description: "Final date of employment" }
      - { name: separation_reason, type: enum, source: input, description: "VOLUNTARY_QUIT | DISCHARGE_MISCONDUCT | DISCHARGE_NON_MISCONDUCT | LAYOFF | LEAVE_OF_ABSENCE", constraints: "enum {VOLUNTARY_QUIT, DISCHARGE_MISCONDUCT, DISCHARGE_NON_MISCONDUCT, LAYOFF, LEAVE_OF_ABSENCE}" }
      - { name: reason_coding_confidence, type: enum, source: system, default: UNREVIEWED, description: "UNREVIEWED | CONFIRMED | DISPUTED — internal QA on reason coding", constraints: "enum {UNREVIEWED, CONFIRMED, DISPUTED}" }

  - name: UiClaim
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> EmployerAccount.id; employer charged" }
      - { name: separation_id, type: string, source: input, description: "FK -> ClaimantSeparation.id; the separation the claim references" }
      - { name: state_code, type: string, source: input, description: "Code reference -> StateRule.state_code; adjudicating state (looked up by code, not id)" }
      - { name: state_claim_number, type: string, source: input, description: "State-issued claim identifier; unique per state", constraints: "unique within (state_code)" }
      - { name: notice_received_at, type: datetime, source: input, description: "Timestamp employer received the claim notice" }
      - { name: response_due_at, type: datetime, source: computed, description: "Computed by response_deadline_computation from StateRule + notice_received_at" }
      - { name: benefit_year_begin, type: datetime, source: input, description: "Claim benefit-year begin date; charge allocation window anchor" }
      - { name: weekly_benefit_amount_cents, type: integer, source: input, description: "State-computed weekly benefit amount" }
      - { name: max_benefit_cents, type: integer, source: input, description: "Maximum total benefits payable on this claim" }
      - { name: charged_amount_cents, type: integer, source: computed, default: 0, description: "Sum of sustained ChargeLineItem amounts for this claim" }
      - { name: status, type: enum, source: system, default: NOTICE_RECEIVED, description: "NOTICE_RECEIVED | RESPONSE_IN_PROGRESS | RESPONSE_SUBMITTED | LATE_RESPONSE | UNDER_ADJUDICATION | DETERMINED | HEARING_PENDING | CLOSED | WITHDRAWN", constraints: "enum set per claim state machine" }
      - { name: response_channel, type: enum, source: system, description: "SELF | TPA — who filed the response; null until submitted", constraints: "enum {SELF, TPA} or null" }
      - { name: adjudication_posture, type: enum, source: computed, default: STANDARD, description: "STANDARD | EXPEDITED — derived from deadline proximity; EXPEDITED when response_due_at - now <= 2 days and status in {NOTICE_RECEIVED, RESPONSE_IN_PROGRESS}", constraints: "enum {STANDARD, EXPEDITED}" }

  - name: ClaimResponse
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> UiClaim.id; the claim being answered" }
      - { name: filed_by_tpa_id, type: string, source: input, description: "FK -> TpaEngagement.id or null; TPA that filed on employer's behalf" }
      - { name: response_type, type: enum, source: input, description: "PROTEST | NO_PROTEST | INFORMATION_ONLY", constraints: "enum {PROTEST, NO_PROTEST, INFORMATION_ONLY}" }
      - { name: separation_reason_code, type: enum, source: input, description: "Employer-asserted reason code; must equal or narrow the ClaimantSeparation.separation_reason", constraints: "enum same as ClaimantSeparation.separation_reason" }
      - { name: narrative, type: string, source: input, description: "Free-text statement of facts" }
      - { name: filed_at, type: datetime, source: system, description: "Timestamp response was submitted; drives late/on-time determination" }
      - { name: timeliness, type: enum, source: computed, description: "ON_TIME | LATE — filed_at <= claim.response_due_at", constraints: "enum {ON_TIME, LATE}" }
      - { name: completeness_score, type: integer, source: computed, description: "0–100 score from documentation_assembly_score; gates state's 'adequate response' flag" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED_INSUFFICIENT | SUPERSEDED", constraints: "enum set per response state machine" }
      - { name: amendment_of, type: string, source: input, description: "FK -> ClaimResponse.id or null; self-reference — this response amends an earlier one" }

  - name: EvidenceDocument
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> UiClaim.id; claim the evidence supports" }
      - { name: response_id, type: string, source: input, description: "FK -> ClaimResponse.id or null; attached at response assembly time" }
      - { name: doc_category, type: enum, source: input, description: "WRITTEN_WARNING | SIGNED_POLICY | FINAL_INCIDENT_REPORT | ATTENDANCE_RECORD | PERFORMANCE_REVIEW | RESIGNATION_LETTER | OTHER", constraints: "enum set" }
      - { name: doc_date, type: datetime, source: input, description: "Date the underlying document was created in the real world" }
      - { name: authenticated, type: boolean, source: input, description: "Whether the document carries signature/attestation" }
      - { name: weight_points, type: integer, source: computed, description: "Evidentiary weight from documentation_assembly_score" }

  - name: Determination
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> UiClaim.id; adjudicated claim" }
      - { name: outcome, type: enum, source: input, description: "ALLOWED | DENIED | ALLOWED_NO_CHARGE — allowed but employer's account not charged", constraints: "enum {ALLOWED, DENIED, ALLOWED_NO_CHARGE}" }
      - { name: mailed_at, type: datetime, source: input, description: "Date determination was mailed; appeal window anchor" }
      - { name: appeal_due_at, type: datetime, source: computed, description: "date(mailed_at) + StateRule.appeal_window_days calendar days, weekend_shift applied, pinned to 17:00:00Z (same END_OF_DAY convention as response_deadline_computation)" }
      - { name: disqualification_weeks, type: integer, source: input, default: 0, description: "Weeks of disqualification imposed when ALLOWED with penalty" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | APPEALED_BY_EMPLOYER | APPEALED_BY_CLAIMANT | FINAL | REVERSED", constraints: "enum set" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: determination_id, type: string, source: input, description: "FK -> Determination.id; determination under appeal" }
      - { name: appellant, type: enum, source: input, description: "EMPLOYER | CLAIMANT", constraints: "enum {EMPLOYER, CLAIMANT}" }
      - { name: filed_at, type: datetime, source: system, description: "Filing timestamp; must be <= determination.appeal_due_at" }
      - { name: timeliness, type: enum, source: computed, description: "ON_TIME | LATE", constraints: "enum {ON_TIME, LATE}" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds text" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Appeal round; increments on remand-reappeal cycles" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | DOCKETED | HEARD | DECIDED_AFFIRMED | DECIDED_REVERSED | REMANDED | WITHDRAWN | DISMISSED_UNTIMELY", constraints: "enum set" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: appeal_id, type: string, source: input, description: "FK -> Appeal.id; the appeal being heard" }
      - { name: claim_id, type: string, source: input, description: "FK -> UiClaim.id; denormalized for scheduling queries" }
      - { name: scheduled_start, type: datetime, source: input, description: "Hearing start timestamp" }
      - { name: scheduled_end, type: datetime, source: input, description: "Hearing end timestamp; must be after scheduled_start" }
      - { name: referee_id, type: string, source: input, description: "Hearing officer / referee identifier" }
      - { name: location, type: string, source: input, description: "Venue or telephonic docket line" }
      - { name: continuance_count, type: integer, source: computed, default: 0, description: "Times rescheduled; each continuance re-runs overlap checks" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PREP_IN_PROGRESS | READY | HELD | CONTINUED | CLOSED", constraints: "enum set" }

  - name: Witness
    parent: null
    common_fields: true
    fields:
      - { name: hearing_id, type: string, source: input, description: "FK -> Hearing.id; hearing the witness attends" }
      - { name: full_name, type: string, source: input, description: "Witness name" }
      - { name: witness_role, type: enum, source: input, description: "DIRECT_SUPERVISOR | HR_CUSTODIAN | POLICY_AUTHOR | CLAIMANT | OTHER", constraints: "enum set" }
      - { name: availability_start, type: datetime, source: input, description: "Witness availability window start" }
      - { name: availability_end, type: datetime, source: input, description: "Witness availability window end" }
      - { name: prep_status, type: enum, source: system, default: UNPREPARED, description: "UNPREPARED | BRIEFED | EXHIBITS_REVIEWED | READY", constraints: "enum {UNPREPARED, BRIEFED, EXHIBITS_REVIEWED, READY}" }

  - name: ChargeStatement
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> EmployerAccount.id; charged employer" }
      - { name: state_code, type: string, source: input, description: "Code reference -> StateRule.state_code; issuing state (looked up by code, not id)" }
      - { name: quarter, type: string, source: input, description: "Statement quarter, e.g. 2026Q2", constraints: "format YYYYQ[1-4]" }
      - { name: issued_at, type: datetime, source: input, description: "Statement issue date; protest window anchor" }
      - { name: protest_due_at, type: datetime, source: computed, description: "date(issued_at) + StateRule.protest_window_days calendar days, weekend_shift applied, pinned to 17:00:00Z" }
      - { name: total_charged_cents, type: integer, source: computed, default: 0, description: "Sum of PENDING/SUSTAINED line amounts" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | UNDER_AUDIT | AUDIT_COMPLETE | RECONCILED", constraints: "enum set" }

  - name: ChargeLineItem
    parent: null
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> ChargeStatement.id; parent statement" }
      - { name: claim_id, type: string, source: input, description: "FK -> UiClaim.id; claim whose benefits produced this charge" }
      - { name: amount_cents, type: integer, source: input, description: "Charged amount" }
      - { name: benefit_weeks, type: integer, source: input, description: "Weeks of benefits this line covers" }
      - { name: erroneous_reason, type: enum, source: input, description: "NONE | CLAIMANT_NOT_SEPARATED | WRONG_EMPLOYER | ALREADY_PROTESTED | EXCEEDS_MAX_BENEFIT | DUPLICATE_LINE", constraints: "enum set; default NONE" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | PROTESTED | SUSTAINED | REVERSED | WAIVED", constraints: "enum set" }

  - name: ChargeProtest
    parent: null
    common_fields: true
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> ChargeLineItem.id; the charge being protested" }
      - { name: statement_id, type: string, source: input, description: "FK -> ChargeStatement.id; denormalized" }
      - { name: filed_at, type: datetime, source: system, description: "Protest filing timestamp; must be <= statement.protest_due_at" }
      - { name: timeliness, type: enum, source: computed, description: "ON_TIME | LATE", constraints: "enum {ON_TIME, LATE}" }
      - { name: protest_basis, type: enum, source: input, description: "Same enum domain as ChargeLineItem.erroneous_reason excluding NONE", constraints: "enum {CLAIMANT_NOT_SEPARATED, WRONG_EMPLOYER, ALREADY_PROTESTED, EXCEEDS_MAX_BENEFIT, DUPLICATE_LINE}" }
      - { name: evidence_strength, type: integer, source: computed, description: "Score 0–100 from protest_evidence_score; SUSTAINED requires >= 60" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | SUSTAINED | DENIED | WITHDRAWN | DISMISSED_UNTIMELY", constraints: "enum set" }

  - name: ExperienceRatingModel
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> EmployerAccount.id; modeled employer" }
      - { name: model_year, type: integer, source: input, description: "Rating year being projected" }
      - { name: variant, type: enum, source: input, description: "RESERVE_RATIO | BENEFIT_RATIO — must match employer.merit_rating_method for OFFICIAL models; the other variant is computed for what-if comparison", constraints: "enum {RESERVE_RATIO, BENEFIT_RATIO}" }
      - { name: kind, type: enum, source: input, description: "OFFICIAL | WHAT_IF", constraints: "enum {OFFICIAL, WHAT_IF}" }
      - { name: projected_rate_bps, type: integer, source: computed, description: "Output of experience_rating_projection" }
      - { name: projected_liability_cents, type: integer, source: computed, description: "projected_rate_bps * taxable_payroll_cents / 10000" }
      - { name: input_snapshot_hash, type: string, source: computed, description: "Hash of charged inputs at computation time; recompute invalidates" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | SUPERSEDED", constraints: "enum set" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: UiClaim
    initial_state: NOTICE_RECEIVED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: NOTICE_RECEIVED
        to: RESPONSE_IN_PROGRESS
        trigger: "POST /ui/claims/{id}/responses (creates DRAFT response)"
        actor: ClaimsAnalyst | TpaAgent
        preconditions:
          - "Claim status IN {NOTICE_RECEIVED, RESPONSE_IN_PROGRESS, RESPONSE_SUBMITTED} (ERR_CLAIM_NOT_RESPONSIVE); drafting an amendment (amendment_of set) is additionally permitted from RESPONSE_SUBMITTED"
          - "If actor is TpaAgent: an ACTIVE TpaEngagement covers this employer and authority_scope in {RESPONSE_ONLY, RESPONSE_AND_HEARING, FULL} (ERR_TPA_SCOPE_VIOLATION)"
        side_effects:
          - "ClaimResponse created in DRAFT"
          - "Recompute claim.adjudication_posture (EXPEDITED if response_due_at - now <= 2 days)"
          - "increments UiClaim.version by 1"
        note: "From RESPONSE_IN_PROGRESS or RESPONSE_SUBMITTED the endpoint creates the DRAFT/amendment row and bumps the claim version but does NOT change claim.status."

      - from: RESPONSE_IN_PROGRESS
        to: RESPONSE_SUBMITTED
        trigger: "POST /ui/claims/{id}/responses/{rid}/submit"
        actor: ClaimsAnalyst | TpaAgent
        preconditions:
          - "Response status == DRAFT (ERR_RESPONSE_NOT_DRAFT)"
          - "completeness_score >= 40 (ERR_RESPONSE_INCOMPLETE)"
          - "If TPA-filed: engagement ACTIVE at filed_at (ERR_TPA_NOT_ACTIVE)"
        side_effects:
          - "response.filed_at = now; timeliness computed (ON_TIME if filed_at <= claim.response_due_at else LATE)"
          - "claim.response_channel = TPA if response.filed_by_tpa_id set else SELF"
          - "If timeliness == LATE: claim -> LATE_RESPONSE instead of RESPONSE_SUBMITTED (branch)"
          - "If TPA-filed and LATE: TpaEngagement.breach_count += 1; if breach_count >= 3 the engagement auto-SUSPENDS (see TpaEngagement machine)"
          - "If LATE: EmployerAccount.late_response_strikes += 1; compliance_posture recomputed (>=2 strikes -> WATCH, >=4 -> SANCTIONED)"

      - from: RESPONSE_IN_PROGRESS
        to: LATE_RESPONSE
        trigger: "POST /ui/claims/{id}/responses/{rid}/submit (branch when filed_at > response_due_at)"
        actor: ClaimsAnalyst | TpaAgent
        preconditions:
          - "Response status == DRAFT"
        side_effects:
          - "EmployerAccount.late_response_strikes += 1; posture recompute"
          - "TPA breach attribution if TPA-filed"

      - from: RESPONSE_SUBMITTED
        to: UNDER_ADJUDICATION
        trigger: "system (state agency acknowledges receipt)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LATE_RESPONSE
        to: UNDER_ADJUDICATION
        trigger: "system (state agency acknowledges receipt)"
        actor: system
        preconditions: []
        side_effects:
          - "Late response flagged on the adjudication record; employer loses 'timely protest' presumption on reason coding (ClaimantSeparation.reason_coding_confidence -> DISPUTED if it was CONFIRMED)"

      - from: UNDER_ADJUDICATION
        to: DETERMINED
        trigger: "POST /ui/claims/{id}/determinations (agency decision recorded)"
        actor: AgencyLiaison
        preconditions:
          - "Claim status == UNDER_ADJUDICATION (ERR_CLAIM_NOT_UNDER_ADJUDICATION)"
        side_effects:
          - "Determination created with status ISSUED; appeal_due_at computed from StateRule"
          - "If outcome == ALLOWED: claim becomes chargeable; subsequent charge line postings debit claim.charged_amount_cents and employer.reserve_balance_cents (see line-items endpoint side effects)"
          - "If outcome == DENIED and ClaimantSeparation.reason_coding_confidence == DISPUTED: confidence -> CONFIRMED (employer vindicated)"

      - from: DETERMINED
        to: HEARING_PENDING
        trigger: "POST /ui/determinations/{id}/appeals (either party files)"
        actor: ClaimsAnalyst | AgencyLiaison
        preconditions:
          - "Determination status == ISSUED (ERR_DETERMINATION_NOT_APPEALABLE)"
          - "filed_at <= determination.appeal_due_at else Appeal.status = DISMISSED_UNTIMELY and claim stays DETERMINED (boundary: filed_at == appeal_due_at is ON_TIME)"
        side_effects:
          - "Appeal created FILED; determination.status -> APPEALED_BY_EMPLOYER or APPEALED_BY_CLAIMANT"

      - from: HEARING_PENDING
        to: DETERMINED
        trigger: "POST /ui/appeals/{id}/withdraw"
        actor: ClaimsAnalyst
        preconditions:
          - "Appeal status in {FILED, DOCKETED} (ERR_APPEAL_NOT_WITHDRAWABLE)"
        side_effects:
          - "Appeal -> WITHDRAWN; determination -> FINAL; claim returns to DETERMINED (cycle exit)"
          - "Any SCHEDULED Hearing for this appeal -> CLOSED; Witness rows remain for audit but prep_status frozen"

      - from: HEARING_PENDING
        to: DETERMINED
        trigger: "POST /ui/appeals/{id}/decide (decision AFFIRMED keeps claim DETERMINED)"
        actor: AgencyLiaison
        preconditions:
          - "Appeal status == HEARD (ERR_APPEAL_NOT_HEARD)"
        side_effects:
          - "Appeal -> DECIDED_AFFIRMED; determination -> FINAL"

      - from: HEARING_PENDING
        to: UNDER_ADJUDICATION
        trigger: "POST /ui/appeals/{id}/decide (decision REMANDED reopens adjudication — cycle)"
        actor: AgencyLiaison
        preconditions:
          - "Appeal status == HEARD"
        side_effects:
          - "Appeal -> REMANDED; determination -> REVERSED; a fresh Determination may be issued; Appeal.round_number + 1 on re-appeal"

      - from: DETERMINED
        to: CLOSED
        trigger: "POST /ui/claims/{id}/close"
        actor: ClaimsAnalyst
        preconditions:
          - "Claim status == DETERMINED (ERR_CLAIM_NOT_CLOSABLE)"
          - "Determination status == FINAL (ERR_DETERMINATION_NOT_FINAL)"
          - "No Appeal in {FILED, DOCKETED, HEARD} (ERR_APPEAL_IN_FLIGHT)"
        side_effects:
          - "Claim -> CLOSED; EmployerAccount.compliance_posture recomputed"

      - from: NOTICE_RECEIVED
        to: WITHDRAWN
        trigger: "POST /ui/claims/{id}/withdraw"
        actor: AgencyLiaison
        preconditions:
          - "Claim status in {NOTICE_RECEIVED, RESPONSE_IN_PROGRESS} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects:
          - "DRAFT ClaimResponse rows -> SUPERSEDED"

      - from: RESPONSE_IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /ui/claims/{id}/withdraw"
        actor: AgencyLiaison
        preconditions:
          - "Claim status in {NOTICE_RECEIVED, RESPONSE_IN_PROGRESS}"
        side_effects:
          - "DRAFT ClaimResponse rows -> SUPERSEDED"

  - entity: ClaimResponse
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED_INSUFFICIENT, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ui/claims/{id}/responses/{rid}/submit"
        actor: ClaimsAnalyst | TpaAgent
        preconditions:
          - "completeness_score >= 40 (ERR_RESPONSE_INCOMPLETE)"
        side_effects:
          - "filed_at, timeliness computed; claim state advanced per UiClaim machine"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /ui/claims/{id}/responses/{rid}/accept"
        actor: AgencyLiaison
        preconditions:
          - "Response status == SUBMITTED (ERR_RESPONSE_NOT_SUBMITTED)"
        side_effects:
          - "All other SUBMITTED/DRAFT responses for the same claim -> SUPERSEDED"

      - from: SUBMITTED
        to: REJECTED_INSUFFICIENT
        trigger: "POST /ui/claims/{id}/responses/{rid}/reject"
        actor: AgencyLiaison
        preconditions:
          - "Response status == SUBMITTED"
        side_effects:
          - "ClaimantSeparation.reason_coding_confidence -> DISPUTED (rejection challenges employer coding)"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (newer response accepted, claim withdrawn, or amendment filed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (amendment accepted: a ClaimResponse with amendment_of == this.id reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appeal
    initial_state: FILED
    terminal_states: [DECIDED_AFFIRMED, DECIDED_REVERSED, WITHDRAWN, DISMISSED_UNTIMELY]
    transitions:
      - from: FILED
        to: DOCKETED
        trigger: "POST /ui/appeals/{id}/hearings (first hearing scheduled)"
        actor: ClaimsAnalyst
        preconditions:
          - "Appeal status == FILED (ERR_APPEAL_NOT_DOCKETABLE)"
        side_effects:
          - "Hearing created SCHEDULED"

      - from: FILED
        to: DISMISSED_UNTIMELY
        trigger: "system (filed_at > determination.appeal_due_at detected at filing)"
        actor: system
        preconditions: []
        side_effects:
          - "Determination -> FINAL; claim remains DETERMINED"

      - from: DOCKETED
        to: HEARD
        trigger: "POST /ui/hearings/{id}/hold"
        actor: AgencyLiaison
        preconditions:
          - "Hearing status == READY (ERR_HEARING_NOT_READY) — every Witness must have prep_status == READY"
        side_effects:
          - "Hearing -> HELD; Appeal -> HEARD"

      - from: HEARD
        to: DECIDED_AFFIRMED
        trigger: "POST /ui/appeals/{id}/decide"
        actor: AgencyLiaison
        preconditions:
          - "decision == AFFIRM"
        side_effects:
          - "Determination -> FINAL"

      - from: HEARD
        to: DECIDED_REVERSED
        trigger: "POST /ui/appeals/{id}/decide"
        actor: AgencyLiaison
        preconditions:
          - "decision == REVERSE"
        side_effects:
          - "Determination -> REVERSED"
          - "If determination.outcome was ALLOWED: every ChargeLineItem with claim_id == determination.claim_id and status IN {PENDING, SUSTAINED} auto-transitions to REVERSED; each such reversal runs the ChargeLineItem REVERSED side effects (statement total decrement, claim charged decrement)"
          - "EmployerAccount.reserve_balance_cents += sum of amounts auto-reversed in the previous step (compensation restoring the pre-charge ledger)"
          - "ExperienceRatingModel rows for the employer -> SUPERSEDED (input invalidation)"

      - from: HEARD
        to: REMANDED
        trigger: "POST /ui/appeals/{id}/decide"
        actor: AgencyLiaison
        preconditions:
          - "decision == REMAND"
        side_effects:
          - "Determination -> REVERSED; claim -> UNDER_ADJUDICATION (cycle: a new Determination restarts the loop with round_number + 1)"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /ui/appeals/{id}/withdraw"
        actor: ClaimsAnalyst
        preconditions:
          - "Appeal status in {FILED, DOCKETED}"
        side_effects:
          - "Determination -> FINAL; scheduled Hearing -> CLOSED"

      - from: DOCKETED
        to: WITHDRAWN
        trigger: "POST /ui/appeals/{id}/withdraw"
        actor: ClaimsAnalyst
        preconditions:
          - "Appeal status in {FILED, DOCKETED}"
        side_effects:
          - "Determination -> FINAL; scheduled Hearing -> CLOSED"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CLOSED]
    transitions:
      - from: SCHEDULED
        to: PREP_IN_PROGRESS
        trigger: "POST /ui/hearings/{id}/witnesses (first witness added)"
        actor: ClaimsAnalyst
        preconditions:
          - "Witness availability window must contain the hearing interval: availability_start <= scheduled_start AND availability_end >= scheduled_end (ERR_WITNESS_UNAVAILABLE)"
          - "Referee has no overlapping HELD/SCHEDULED hearing whose interval [start - 30min buffer, end + 30min buffer] intersects this one (ERR_REFEREE_DOUBLE_BOOKED)"
        side_effects: []

      - from: PREP_IN_PROGRESS
        to: READY
        trigger: "system (automatic when all Witness rows reach prep_status == READY and at least one witness exists)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /ui/hearings/{id}/continue"
        actor: ClaimsAnalyst
        preconditions:
          - "continuance_count < 3 (ERR_CONTINUANCE_LIMIT)"
          - "New interval passes referee buffer-overlap and witness-availability checks"
        side_effects:
          - "continuance_count += 1; scheduled_start/end replaced; status returns to SCHEDULED (cycle: CONTINUED -> SCHEDULED re-entry)"

      - from: CONTINUED
        to: SCHEDULED
        trigger: "system (immediate re-entry after continuance applied)"
        actor: system
        preconditions: []
        side_effects: []

      - from: READY
        to: HELD
        trigger: "POST /ui/hearings/{id}/hold"
        actor: AgencyLiaison
        preconditions:
          - "Hearing status == READY"
        side_effects:
          - "Appeal -> HEARD"

      - from: SCHEDULED
        to: CLOSED
        trigger: "system (appeal withdrawn or decided without hearing)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PREP_IN_PROGRESS
        to: CLOSED
        trigger: "system (appeal withdrawn or decided without hearing)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ChargeStatement
    initial_state: ISSUED
    terminal_states: [RECONCILED]
    transitions:
      - from: ISSUED
        to: UNDER_AUDIT
        trigger: "POST /ui/charge-statements/{id}/audit (open audit)"
        actor: ChargeAuditor
        preconditions:
          - "Statement status == ISSUED (ERR_STATEMENT_NOT_AUDITABLE)"
        side_effects:
          - "charge_audit_variance recomputed over line items"

      - from: UNDER_AUDIT
        to: AUDIT_COMPLETE
        trigger: "POST /ui/charge-statements/{id}/audit/complete"
        actor: ChargeAuditor
        preconditions:
          - "Every ChargeLineItem status in {PENDING, SUSTAINED, REVERSED, WAIVED} — i.e., none still PROTESTED (ERR_PROTESTS_IN_FLIGHT)"
        side_effects:
          - "Audit findings snapshot; erroneous totals aggregated"

      - from: AUDIT_COMPLETE
        to: RECONCILED
        trigger: "POST /ui/charge-statements/{id}/reconcile"
        actor: ChargeAuditor
        preconditions:
          - "Statement status == AUDIT_COMPLETE (ERR_STATEMENT_NOT_RECONCILABLE)"
          - "No ChargeProtest in {FILED, UNDER_REVIEW} for any line of this statement (ERR_PROTESTS_IN_FLIGHT)"
        side_effects:
          - "EmployerAccount.protest_credits_cents += sum(REVERSED line amounts) (audit-trail credit counter)"
          - "EmployerAccount.reserve_balance_cents was already credited at each line's REVERSED transition; reconcile performs NO additional reserve movement (double-credit forbidden)"
          - "ExperienceRatingModel rows for the employer and current model_year -> SUPERSEDED (derived-input invalidation) and recomputed on next read"

  - entity: ChargeLineItem
    initial_state: PENDING
    terminal_states: [SUSTAINED, REVERSED, WAIVED]
    transitions:
      - from: PENDING
        to: PROTESTED
        trigger: "POST /ui/charge-line-items/{id}/protests"
        actor: ChargeAuditor
        preconditions:
          - "Line status == PENDING (ERR_LINE_NOT_PROTESTABLE)"
          - "filed_at <= statement.protest_due_at else protest DISMISSED_UNTIMELY (boundary: == is ON_TIME)"
          - "protest_basis != ALREADY_PROTESTED unless a prior protest on this line was DENIED (ERR_LINE_ALREADY_PROTESTED)"
        side_effects:
          - "ChargeProtest created FILED; evidence_strength computed"
          - "Parent statement: if ISSUED -> UNDER_AUDIT automatically (bubble-up)"

      - from: PROTESTED
        to: SUSTAINED
        trigger: "system (protest DENIED)"
        actor: system
        preconditions: []
        side_effects:
          - "EmployerAccount.compliance_posture recomputed: denied protests count 0.5 strike toward SANCTIONED"

      - from: PROTESTED
        to: REVERSED
        trigger: "system (protest SUSTAINED)"
        actor: system
        preconditions: []
        side_effects:
          - "Statement.total_charged_cents -= line.amount_cents"
          - "Claim.charged_amount_cents -= line.amount_cents (cross-entity ledger sync)"
          - "EmployerAccount.reserve_balance_cents += line.amount_cents (credit at reversal time; reconcile must not re-credit)"

      - from: PENDING
        to: REVERSED
        trigger: "system (determination DECIDED_REVERSED auto-reversal of the claim's charges)"
        actor: system
        preconditions: []
        side_effects:
          - "Statement.total_charged_cents -= line.amount_cents"
          - "Claim.charged_amount_cents -= line.amount_cents"
          - "EmployerAccount.reserve_balance_cents += line.amount_cents"

      - from: SUSTAINED
        to: REVERSED
        trigger: "system (determination DECIDED_REVERSED auto-reversal of the claim's charges)"
        actor: system
        preconditions: []
        side_effects:
          - "Statement.total_charged_cents -= line.amount_cents"
          - "Claim.charged_amount_cents -= line.amount_cents"
          - "EmployerAccount.reserve_balance_cents += line.amount_cents"

      - from: PENDING
        to: WAIVED
        trigger: "POST /ui/charge-line-items/{id}/waive"
        actor: AgencyLiaison
        preconditions:
          - "Line status == PENDING (ERR_LINE_NOT_WAIVABLE)"
        side_effects:
          - "Statement.total_charged_cents -= line.amount_cents"
          - "Claim.charged_amount_cents -= line.amount_cents"
          - "EmployerAccount.reserve_balance_cents += line.amount_cents"
          - "No protest_credits_cents accrual (waive is agency goodwill, not an employer protest win)"

  - entity: ChargeProtest
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED, WITHDRAWN, DISMISSED_UNTIMELY]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /ui/charge-protests/{id}/review"
        actor: AgencyLiaison
        preconditions:
          - "Protest status == FILED (ERR_PROTEST_NOT_REVIEWABLE)"
        side_effects: []

      - from: FILED
        to: DISMISSED_UNTIMELY
        trigger: "system (timeliness == LATE at filing)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: SUSTAINED
        trigger: "POST /ui/charge-protests/{id}/sustain"
        actor: AgencyLiaison
        preconditions:
          - "Protest status == UNDER_REVIEW"
          - "evidence_strength >= 60 (ERR_PROTEST_EVIDENCE_WEAK)"
        side_effects:
          - "ChargeLineItem -> REVERSED; cascade per ChargeLineItem machine"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /ui/charge-protests/{id}/deny"
        actor: AgencyLiaison
        preconditions:
          - "Protest status == UNDER_REVIEW"
        side_effects:
          - "ChargeLineItem -> SUSTAINED"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /ui/charge-protests/{id}/withdraw"
        actor: ChargeAuditor
        preconditions:
          - "Protest status in {FILED, UNDER_REVIEW}"
        side_effects:
          - "ChargeLineItem -> PENDING (compensating action restores pre-protest ledger posture)"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /ui/charge-protests/{id}/withdraw"
        actor: ChargeAuditor
        preconditions:
          - "Protest status in {FILED, UNDER_REVIEW}"
        side_effects:
          - "ChargeLineItem -> PENDING"

  - entity: TpaEngagement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (breach_count reaches 3) or POST /ui/tpa-engagements/{id}/suspend"
        actor: system | TpaManager
        preconditions:
          - "Engagement status in {ACTIVE, REINSTATED}"
        side_effects:
          - "While SUSPENDED: all TpaAgent filings for this engagement rejected (ERR_TPA_NOT_ACTIVE)"

      - from: SUSPENDED
        to: REINSTATED
        trigger: "POST /ui/tpa-engagements/{id}/reinstate"
        actor: TpaManager
        preconditions:
          - "Engagement status == SUSPENDED (ERR_TPA_NOT_SUSPENDED)"
          - "A remediation note >= 20 chars is supplied (ERR_REMEDIATION_NOTE_SHORT)"
        side_effects:
          - "breach_count reset to 1 (not 0 — prior history retained)"

      - from: REINSTATED
        to: SUSPENDED
        trigger: "system (breach_count reaches 3 again)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ui/tpa-engagements/{id}/terminate"
        actor: TpaManager
        preconditions:
          - "No UiClaim in {RESPONSE_IN_PROGRESS} has response_channel == TPA bound to this engagement (ERR_TPA_HAS_OPEN_WORK)"
        side_effects: []

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /ui/tpa-engagements/{id}/terminate"
        actor: TpaManager
        preconditions:
          - "No UiClaim in {RESPONSE_IN_PROGRESS} bound to this engagement"
        side_effects: []

  - entity: ExperienceRatingModel
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /ui/experience-rating-models/{id}/finalize"
        actor: RatingAnalyst
        preconditions:
          - "Model status == DRAFT (ERR_MODEL_NOT_DRAFT)"
          - "For kind == OFFICIAL: model.variant == employer.merit_rating_method (ERR_MODEL_VARIANT_MISMATCH)"
          - "input_snapshot_hash matches current inputs (ERR_MODEL_INPUT_STALE)"
        side_effects:
          - "Any prior FINALIZED OFFICIAL model for same employer+model_year -> SUPERSEDED (create-with-supersede; guarded by OCC)"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (source charge or payroll input changed before finalize)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a later OFFICIAL model finalized, or charge reconciliation mutates inputs)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClaimantSeparation
    initial_state: UNREVIEWED
    terminal_states: [CONFIRMED, DISPUTED]
    note: "reason_coding_confidence is the state axis; cyclic CONFIRMED <-> DISPUTED loops are allowed as evidence accumulates"
    transitions:
      - from: UNREVIEWED
        to: CONFIRMED
        trigger: "POST /ui/separations/{id}/coding/confirm"
        actor: ClaimsAnalyst
        preconditions:
          - "At least one EvidenceDocument in category {WRITTEN_WARNING, SIGNED_POLICY, FINAL_INCIDENT_REPORT} attached to any claim referencing this separation when reason is DISCHARGE_MISCONDUCT (ERR_CODING_EVIDENCE_MISSING)"
        side_effects: []

      - from: UNREVIEWED
        to: DISPUTED
        trigger: "system (response REJECTED_INSUFFICIENT or late-response presumption loss)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: DISPUTED
        trigger: "system (late response or rejection challenges coding)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: CONFIRMED
        trigger: "system (determination DENIED vindicates employer) or POST /ui/separations/{id}/coding/confirm"
        actor: system | ClaimsAnalyst
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: model-finalize-stale-employer
    parent_entity: EmployerAccount
    write_endpoint: "POST /ui/employers/{id}/experience-rating-models/{mid}/finalize"
    occ_field: "expected_employer_version"
    description: |
      Finalizing an OFFICIAL ExperienceRatingModel supersedes the prior
      FINALIZED model for the same employer+year. If the employer's version
      has advanced since the client observed it (another writer finalized a
      model, or a charge reconciliation bumped reserve_balance_cents), the
      request is rejected as stale rather than silently superseding on old
      inputs.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: response-submit-stale-claim
    parent_entity: UiClaim
    write_endpoint: "POST /ui/claims/{id}/responses/{rid}/submit"
    occ_field: "expected_claim_version"
    description: |
      Submitting a response against a claim whose version advanced since the
      drafter loaded it (e.g., a co-analyst attached new evidence which
      changed completeness_score, or an amendment superseded the draft) is
      rejected; the drafter must re-read the claim before filing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: protest-file-stale-statement
    parent_entity: ChargeStatement
    write_endpoint: "POST /ui/charge-line-items/{id}/protests"
    occ_field: "expected_statement_version"
    description: |
      Filing a protest against a line on a statement whose version advanced
      since the auditor loaded it (a sibling protest REVERSED a line, which
      recomputed total_charged_cents) is rejected so protest decisions are
      always made against the current statement totals.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: response_deadline_computation
    trigger: "UiClaim creation (notice intake)"
    algorithm: chronological
    formula: |
      base = claim.notice_received_at (date part only, in the state's timezone assumed UTC)
      if state.window_basis == CALENDAR:
          due_date = base + state.response_window_days days
      else:  # BUSINESS
          due_date = base; remaining = state.response_window_days
          while remaining > 0:
              due_date += 1 day
              if due_date.weekday() in {Mon..Fri} and due_date not in FEDERAL_HOLIDAYS:
                  remaining -= 1
      # weekend_shift post-processing (applies to BOTH bases):
      if state.weekend_shift == NEXT_BUSINESS_DAY:
          while due_date.weekday() in {Sat, Sun} or due_date in FEDERAL_HOLIDAYS:
              due_date += 1 day
      claim.response_due_at = due_date at 17:00:00Z
    input_set: "The claim's state_code resolved against StateRule; FEDERAL_HOLIDAYS fixed list in constants"
    constants:
      FEDERAL_HOLIDAYS: ["2026-01-01", "2026-01-19", "2026-02-16", "2026-05-25", "2026-06-19", "2026-07-03", "2026-09-07", "2026-10-12", "2026-11-11", "2026-11-26", "2026-12-25"]
      END_OF_DAY: "17:00:00Z"
    precision: "date granularity; time pinned to 17:00:00Z"
    variants:
      - name: calendar_basis
        when: "state.window_basis == CALENDAR"
        difference: "Every day counts; only weekend_shift post-processing can move the date"
      - name: business_basis
        when: "state.window_basis == BUSINESS"
        difference: "Weekends and holidays never decrement the counter, so identical inputs yield a later due date than calendar_basis"

  - name: documentation_assembly_score
    trigger: "EvidenceDocument create/delete on a claim; ClaimResponse submit re-check"
    algorithm: weighted_scoring
    formula: |
      # Per-category weights; a category contributes ONCE (best document in it).
      category_best[cat] = max over evidence e in the claim with e.doc_category == cat
                           of (BASE[cat] + (10 if e.authenticated else 0)
                               - (5 if e.doc_date > claim.notice_received_at else 0))  # post-hoc docs discounted
      raw = sum of category_best over categories present
      completeness_score = min(100, raw)
      weight_points (per document) = its own contribution value (BASE + auth bonus - posthoc penalty)
    input_set: "EvidenceDocument rows with claim_id == claim.id and status not soft-deleted; categories from constants"
    constants:
      BASE_WRITTEN_WARNING: 25
      BASE_SIGNED_POLICY: 20
      BASE_FINAL_INCIDENT_REPORT: 30
      BASE_ATTENDANCE_RECORD: 15
      BASE_PERFORMANCE_REVIEW: 10
      BASE_RESIGNATION_LETTER: 25
      BASE_OTHER: 5
      SUBMIT_THRESHOLD: 40
    precision: "integer points, no rounding"
    variants: []

  - name: experience_rating_projection
    trigger: "ExperienceRatingModel create; charge reconciliation; payroll input update"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED (circular-looking terms resolved in this order):
      #   1) benefit_charges = sum of ChargeLineItem.amount_cents where line.claim.employer_id == employer.id
      #      AND line.status IN {PENDING, SUSTAINED}  (REVERSED and WAIVED excluded)
      #   2) ratio = per-variant formula below
      #   3) tier lookup on ratio -> base_rate_bps from RATE_TABLE (first row where ratio <= row.max_ratio)
      #   4) surcharge: if employer.compliance_posture == SANCTIONED: base_rate_bps += SANCTION_SURCHARGE_BPS
      #      elif WATCH: base_rate_bps += WATCH_SURCHARGE_BPS
      #   5) projected_rate_bps = min(RATE_CAP_BPS, base_rate_bps)
      #   6) projected_liability_cents = floor(projected_rate_bps * employer.taxable_payroll_cents / 10000)
      # RESERVE_RATIO variant: ratio = (employer.reserve_balance_cents) / employer.taxable_payroll_cents
      #   (higher reserve -> lower ratio -> lower rate; reserve_balance already net of benefit_charges,
      #    so benefit_charges enters via the reserve ledger, NOT again here — double-count forbidden)
      # BENEFIT_RATIO variant: ratio = benefit_charges / employer.taxable_payroll_cents
      #   (higher charges -> higher ratio -> higher rate; direction REVERSED vs reserve variant)
      # ROUNDING ORDER (pinned): compute ratio as exact rational; tier lookup on unrounded ratio;
      #   liability computed from integer projected_rate_bps then floored — never round ratio first.
    input_set: "ChargeLineItem joined to UiClaim on claim_id, filtered to employer; employer reserve/payroll/posture snapshot"
    constants:
      RATE_TABLE: [
        { max_ratio: -0.05, rate_bps: 60 },
        { max_ratio: 0.00, rate_bps: 120 },
        { max_ratio: 0.02, rate_bps: 180 },
        { max_ratio: 0.04, rate_bps: 270 },
        { max_ratio: 0.06, rate_bps: 360 },
        { max_ratio: 0.08, rate_bps: 450 },
        { max_ratio: 1.00, rate_bps: 540 } ]
      WATCH_SURCHARGE_BPS: 20
      SANCTION_SURCHARGE_BPS: 50
      RATE_CAP_BPS: 540
    precision: "ratio unrounded for tiering; rate integer bps; liability integer cents via floor"
    variants:
      - name: reserve_ratio_variant
        when: "employer.merit_rating_method == RESERVE_RATIO (OFFICIAL models); also computable as WHAT_IF"
        difference: "ratio derived from reserve_balance_cents; rate moves DOWN as balance grows"
      - name: benefit_ratio_variant
        when: "employer.merit_rating_method == BENEFIT_RATIO (OFFICIAL); also computable as WHAT_IF"
        difference: "ratio derived from current-window benefit_charges; rate moves UP as charges grow — identical inputs yield a different rate than the reserve variant"

  - name: charge_audit_variance
    trigger: "ChargeStatement audit open/complete; line status changes"
    algorithm: aggregation
    formula: |
      audited_total = sum(amount_cents) over lines with status IN {PENDING, SUSTAINED}
      erroneous_total = sum(amount_cents) over lines with erroneous_reason != NONE
      protested_total = sum(amount_cents) over lines with status == PROTESTED
      reversed_total = sum(amount_cents) over lines with status == REVERSED
      variance_cents = erroneous_total - reversed_total   # unrecovered erroneous exposure
      statement.total_charged_cents = audited_total       # ledger sync (excludes REVERSED/WAIVED)
    input_set: "All ChargeLineItem with statement_id == statement.id, any status"
    precision: "integer cents"
    variants: []

  - name: protest_evidence_score
    trigger: "ChargeProtest creation"
    algorithm: weighted_scoring
    formula: |
      # EVALUATION ORDER PINNED: basis -> determination -> response timeliness -> coding confidence -> clamp.
      score = BASIS_WEIGHT[protest_basis]
      if claim has any Determination with outcome == DENIED: score += 20  # agency already sided with employer
      latest_response = the ClaimResponse of the claim with the latest filed_at
          among rows with status IN {SUBMITTED, ACCEPTED, REJECTED_INSUFFICIENT}
          (tie-break on equal filed_at: the row with the later created_at wins);
          if none exists, no timeliness term applies
      if latest_response exists and latest_response.timeliness == LATE: score -= 25
      if separation.reason_coding_confidence == CONFIRMED: score += 10
      if separation.reason_coding_confidence == DISPUTED: score -= 10
      evidence_strength = clamp(score, 0, 100)
    input_set: "The protested line's claim, its latest submitted ClaimResponse (any adjudication outcome), its ClaimantSeparation, its Determinations"
    constants:
      BASIS_WEIGHT: { CLAIMANT_NOT_SEPARATED: 50, WRONG_EMPLOYER: 70, ALREADY_PROTESTED: 30, EXCEEDS_MAX_BENEFIT: 60, DUPLICATE_LINE: 65 }
      SUSTAIN_THRESHOLD: 60
    precision: "integer 0..100"
    variants: []

  - name: deadline_boundary_check
    trigger: "ClaimResponse submit; Appeal file; ChargeProtest file"
    algorithm: threshold
    formula: |
      timeliness = ON_TIME if filed_at <= due_at else LATE
      # Boundary is INCLUSIVE: filed_at exactly equal to due_at is ON_TIME.
      # due_at values: claim.response_due_at / determination.appeal_due_at / statement.protest_due_at
    input_set: "Single filing timestamp vs its computed deadline"
    precision: "second granularity on timestamps"
    variants: []

  - name: posture_recompute
    trigger: "late_response_strikes change; protest DENIED; claim close"
    algorithm: threshold
    formula: |
      effective_strikes = employer.late_response_strikes + 0.5 * denied_protest_count
      # denied_protest_count = ChargeProtest rows (status == DENIED) on statements of this employer
      if effective_strikes >= 4: posture = SANCTIONED
      elif effective_strikes >= 2: posture = WATCH
      else: posture = CLEAR
      # Boundary INCLUSIVE: exactly 2.0 -> WATCH; exactly 4.0 -> SANCTIONED.
    input_set: "EmployerAccount + its ChargeProtest history"
    precision: "half-strike granularity"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 2.5
    category: existence
    check: "Request body well-formed: required fields present, types match, enum values in domain (schema validation after auth, before path existence)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Body FK references resolve and belong to the path-scoped parent (e.g., response.claim_id == path claimId; separation.employer_id == claim.employer_id)"
    error_id: ERR_CROSS_PARENT_REFERENCE
    http_status: 422
    applies_to: "nested creates and filings"

  - priority: 5
    category: state
    check: "Target entity in a state that permits this transition (per §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_temporal
    check: "Filing windows honored: response/appeal/protest filed_at <= computed due_at else LATE branch or dismissal; hearing scheduled_start < scheduled_end"
    error_id: ERR_WINDOW_VIOLATION
    http_status: 422
    applies_to: "filings and hearing scheduling"

  - priority: 7
    category: business_temporal
    check: "Resource temporal overlap: referee buffer-overlap (ERR_REFEREE_DOUBLE_BOOKED) and witness availability containment (ERR_WITNESS_UNAVAILABLE)"
    error_id: ERR_TEMPORAL_OVERLAP
    http_status: 409
    applies_to: "POST /ui/appeals/{id}/hearings, POST /ui/hearings/{id}/witnesses, POST /ui/hearings/{id}/continue"

  - priority: 7.5
    category: business_temporal
    check: "TPA engagement window exclusivity: no second engagement for the same employer whose [effective_from, effective_to] closed interval intersects an existing non-TERMINATED engagement's interval (endpoints touching exactly at a boundary timestamp DO intersect — closed-closed semantics)"
    error_id: ERR_TPA_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ui/tpa-engagements"

  - priority: 8
    category: business_safety
    check: "TPA authority: engagement ACTIVE, in window, scope covers the operation; segregation of duties: the same X-User-ID that drafted a response cannot accept/reject it"
    error_id: ERR_AUTHORITY_VIOLATION
    http_status: 403
    applies_to: "TPA filings; response adjudication endpoints"

  - priority: 9
    category: business_constraint
    check: "Evidence sufficiency gates: completeness_score >= 40 on submit; misconduct coding evidence present; continuance_count < 3; evidence_strength >= 60 on sustain"
    error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    applies_to: "submit, coding confirm, continue, sustain"

  - priority: 10
    category: business_constraint
    check: "Uniqueness: state_claim_number unique within state; one OPEN (non-terminal) ChargeProtest per line unless prior DENIED; one FINALIZED OFFICIAL model per employer+year"
    error_id: ERR_DUPLICATE_ACTIVE_RECORD
    http_status: 409
    applies_to: "claim intake, protest filing, model finalize"

  - priority: 11
    category: business_fiscal
    check: "Aggregate fiscal caps: sum of charge lines for a claim <= claim.max_benefit_cents -> ERR_MAX_BENEFIT_EXCEEDED; line.amount_cents >= 0 and other fiscal domain violations -> ERR_FISCAL_CAP_EXCEEDED"
    error_id: ERR_MAX_BENEFIT_EXCEEDED
    http_status: 422
    applies_to: "charge line posting"

  - priority: 12
    category: state
    check: "OCC expected_*_version matches current parent version (checked last so business errors surface first)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints declared in §1.2.1"

