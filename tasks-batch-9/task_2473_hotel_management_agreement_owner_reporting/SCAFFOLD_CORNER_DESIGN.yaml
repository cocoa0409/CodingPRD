          assert:
            - "the manager's CONTEST returns HTTP 403 with error.error_id == ERR_ACTION_ROLE_MISMATCH, not ERR_UNAUTHORIZED — the role is listed on the endpoint but not on that action"
            - "the owner's CONTEST returns HTTP 200 with disclosure_status == CONTESTED and the CENTRALIZED_SERVICES accrual in DISPUTED_HELD"
            - "the owner's ADJUST also returns HTTP 403 ERR_ACTION_ROLE_MISMATCH — restating the allocation is the manager's action"
            - "the manager's REAFFIRM returns HTTP 200 with disclosure_status back to DISCLOSED, allocated_amount_cents still 300000 and the accrual back in ACCRUED"

      - name: asset_manager_cannot_approve_an_owner_rep_level_variance
        claim_type: standard_crud
        grounds:
          - validations[priority=31]
          - errors[ERR_APPROVAL_AUTHORITY_INSUFFICIENT]
          - calculations.variance_approval_routing
        distinguishing_aspect: "Approval authority is a per-row ceiling, not an endpoint role list: AssetManager is listed on the decision endpoint yet is refused with ERR_APPROVAL_AUTHORITY_INSUFFICIENT on an OWNER_REP-level variance that OwnerRep then approves."
        test_recipe:
          setup:
            - "One ACTIVE agreement with an APPROVED FY2026 budget whose budgeted_operating_expenses_cents is 200000000."
            - "One PENDING variance request of 60000000 on OPERATING, which routes to OWNER_REP because 0.300000 exceeds 0.15 and 60000000 exceeds 25000000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Authority Hotel", owner_entity_name: "Authority Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
