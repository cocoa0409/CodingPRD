      - name: booking_advances_its_two_dimensions_independently
        claim_type: parallel_state_shape
        grounds:
          - state_machines.Booking.fulfillment_status
          - state_machines.Booking.financial_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_fulfillment_and_financial_dimensions_advance_independently
          rationale: "The parallel-dimension shape is exercised end to end by the named §1.8 instance, which walks both dimensions through five writes and asserts every intermediate pair."

      - name: publishing_is_guarded_on_the_owning_operator_being_approved
        claim_type: guarded_transition
        grounds:
          - state_machines.Excursion.catalog_status.PENDING_REVIEW_to_PUBLISHED
          - validations[28].ERR_OPERATOR_NOT_APPROVED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / excursion_publish_is_gated_on_the_owning_operator_reaching_approved
          rationale: "The guard on PUBLISH and both sides of the gate are covered by the named §1.8 instance."

      - name: operator_suspension_cascades_down_to_catalog_departures_and_bookings
        claim_type: cascade_down_side_effect
        grounds:
          - state_machines.TourOperator.vetting_status.APPROVED_to_SUSPENDED
          - state_machines.Excursion.catalog_status.PUBLISHED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_audit_score_drop_suspends_operator_withdraws_catalog_cancels_departure_and_refunds_booking
          rationale: "The four-hop suspension cascade is asserted hop by hop by the named §1.8 instance."

      - name: cancellation_forks_into_a_weather_and_an_operational_side_effect_set
        claim_type: branching_side_effect
        grounds:
          - state_machines.ExcursionDeparture.status.SELLING_to_CANCELLED_OPERATIONAL
          - calculations.guest_refund_settlement
        excluded_because:
          difficulty_instance: non_linear_state_machine / departure_cancellation_forks_weather_versus_operational_side_effect_sets
          rationale: "The fork and the goodwill, strike and penalty differences between the two causes are covered by the named §1.8 instance."

