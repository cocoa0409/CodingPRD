            - "ProductionWeld.${w4_id}.required_volumetric_pct == 0 and volumetric_method == null and required_surface_method == PT"
            - "W-001 carries rt_extent_declared SPOT on its governing SHELL sheet, which alone sizes 25 percent; design_code DIV2 is what raises it to 100"
            - "W-002 is the only joint whose volumetric_method is UT, and it is UT solely because thickness_in 2.5000 >= 2.000 while joint_type is BUTT"
            - "ProductionWeld.${w4_id}.required_surface_method == PT rather than MT because part_a HD-02 traces to heat H-9902 with material_class AUSTENITIC"
            - "Every one of the four rows has fab_status == PLANNED, nde_status == NOT_PLANNED and pwht_status == NOT_REQUIRED"

      - name: combinatorial_data_package_completeness_per_section_rounding_order
        grounds:
          - calculations.data_package_completeness
          - entities.DataReport.fields.section_scores
          - entities.DataReport.fields.completeness_score
          - entities.DataReport.fields.missing_items
          - entities.VesselJob.fields.required_components
          - validations[priority=55]
          - concurrency_rules[design-calc-revision-stale-job]
        distinguishing_aspect: |
          A weighted six-section score where two sections land on the same one-third fraction, so the
          pinned rounding order is observable: rounding each section to two decimals FIRST and then
          summing yields 86.66, whereas summing the unrounded weight x fraction products and rounding
          once at the end yields 86.67 — a different arithmetic domain from the NDE decision matrix,
