# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3388_low_income_student_college_match_partner_placement
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Canonical Cycle A window literals (same as §1.8):
#   app     [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z]
#   ranking [2026-10-15T00:00:00Z, 2026-10-31T23:59:59Z]
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: student_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds: [entities.Student, endpoints.POST_/students]
        distinguishing_aspect: "A self-registered student comes back 201 with student_stage PROSPECT, version 1, and system-minted id / created_at / updated_at — stage is never client-supplied."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default; empty database."]
          setup_api_calls:
            - &clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - &mkstu
              call: "POST /students"
              payload: { email: "s1@x.com", full_name: "Stu One", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu: $.data.id, stu_stage: $.data.student_stage, stu_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Student.${stu}.student_stage == PROSPECT and version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: application_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Application, endpoints.POST_/applications, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting household_income_cents (a required input with no default) is a 400 ERR_INVALID_REQUEST before any state or business check runs."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN phase; one registered student."]
          setup_api_calls:
            - *clock0
            - &mkcycle
              call: "POST /cycles"
              payload: { name: "Cycle A", app_opens_at: "2026-09-01T00:00:00Z", app_closes_at: "2026-09-30T23:59:59Z", ranking_opens_at: "2026-10-15T00:00:00Z", ranking_closes_at: "2026-10-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - &adv
              call: "POST /cycles/${cyc}/advance"
              as: ProgramAdmin
            - *adv
            - *mkstu
          trigger:
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST"
            - "no Application row is created for the student"

      - name: application_create_defaults_assets_to_zero
        claim_type: Defaults
        grounds: [entities.Application.fields.self_reported_assets_cents]
        distinguishing_aspect: "Omitting self_reported_assets_cents stores the declared default 0, not null."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN phase; one registered student."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
          trigger:
            - &mkapp
              call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id, assets: $.data.self_reported_assets_cents, draft_status: $.data.status, ref: $.data.referral_id }
          assert:
            - "Application.${app}.self_reported_assets_cents == 0"
            - "Application.${app}.status == DRAFT (initial state) and referral_id is null"

      - name: application_create_with_computed_field_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Application.fields.academic_index, calculations.academic_index]
        distinguishing_aspect: "A client-supplied academic_index is ignored on create: it stays null until submit, when the server computes min(2000, 390*2 + floor(1450/4)) == 1142."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN phase; one registered student with a DRAFT application carrying a forged academic_index in the create payload."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450, academic_index: 9999 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id, ai0: $.data.academic_index }
          trigger:
            - &submit
              call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
              captures: { ai1: $.data.academic_index, tier1: $.data.need_tier }
          assert:
            - "at create the forged value was ignored: ai0 is null"
            - "after submit: academic_index == 1142 (780 + 362) and need_tier == STANDARD (6500000 > 3250000)"

      - name: college_create_with_invalid_aid_policy_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.PartnerCollege.fields.aid_policy, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "aid_policy is a closed enum; FREE_RIDE is not a member and is rejected 400 before the college is stored."
        test_recipe:
          setup: ["Logical clock set; empty database."]
          setup_api_calls:
            - *clock0
          trigger:
            - call: "POST /colleges"
              payload: { name: "Bad Policy U", aid_policy: "FREE_RIDE", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST"

      - name: application_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["endpoints.GET_/applications/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed UUID that names no application returns 404 ERR_NOT_FOUND, not an empty object."
        test_recipe:
          setup: ["Logical clock set; empty database."]
          setup_api_calls:
            - *clock0
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id ERR_NOT_FOUND"

      - name: colleges_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: [endpoints.GET_/colleges, response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "With three colleges, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the whole set, not the page."
        test_recipe:
          setup: ["Three partner colleges registered."]
          setup_api_calls:
            - *clock0
            - &mkcol_nl
              call: "POST /colleges"
              payload: { name: "NoLoan U", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { col: $.data.id }
            - call: "POST /colleges"
              payload: { name: "MinLoan U", aid_policy: "MINIMAL_LOAN", min_academic_index: 0, match_slots: 2, coa_cents: 7000000 }
              as: ProgramAdmin
            - call: "POST /colleges"
              payload: { name: "Third U", aid_policy: "NO_LOAN", min_academic_index: 100, match_slots: 3, coa_cents: 6000000 }
              as: ProgramAdmin
          trigger:
            - call: "GET /colleges"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /colleges"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
              captures: { last_count: $.data }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 (offset 2): exactly 1 row, total_count == 3, has_more == false"

      - name: ranking_entry_carries_no_version_or_updated_at
        claim_type: Immutability
        grounds: [entities.RankingEntry]
        distinguishing_aspect: "RankingEntry declares common_fields false: rows expose id and created_at but no version or updated_at keys; list_seq is the only submission marker."
        test_recipe:
          setup: ["Cycle A in RANKING phase with the clock inside the window; one FINALIST application."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - &review_fin
              call: "POST /applications/${app}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { app_v: $.data.version }
            - *adv
            - &clock_rank
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: ProgramAdmin
            - &rank1
              call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
          trigger:
            - call: "GET /applications/${app}/rankings"
              as: Student
              as_user_id: "${stu}"
              captures: { e_col: "$.data[0].college_id", e_seq: "$.data[0].list_seq", e_rank: "$.data[0].rank_position" }
          assert:
            - "the row has college_id == ${col}, rank_position == 1, list_seq == 1, and non-null id and created_at"
            - "the row has no version and no updated_at key (common_fields false)"

      - name: referral_polymorphic_referrer_sets_exactly_one_fk
        claim_type: Creation
        grounds: [entities.Referral, complexity_profile.relationship_patterns]
        distinguishing_aspect: "The polymorphic referrer: a counselor-created referral has counselor_id set and partner_id null; a partner-created one has partner_id set and counselor_id null — never both."
        test_recipe:
          setup: ["Cycle A in RECRUITMENT phase; one counselor, one community partner, one student."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - &mkcns
              call: "POST /counselors"
              payload: { full_name: "C One", school_name: "East High", state_code: "TX" }
              as: ProgramAdmin
              captures: { cns: $.data.id }
            - &mkprt
              call: "POST /community-partners"
              payload: { org_name: "Bridge Org", state_code: "TX", contact_email: "b@x.com" }
              as: ProgramAdmin
              captures: { prt: $.data.id }
            - *mkstu
          trigger:
            - call: "POST /referrals"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", note: "counselor nomination" }
              as: Counselor
              as_user_id: "${cns}"
              captures: { r1_c: $.data.counselor_id, r1_p: $.data.partner_id, r1_s: $.data.status }
            - call: "POST /referrals"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", note: "partner nomination" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { r2_c: $.data.counselor_id, r2_p: $.data.partner_id }
          assert:
            - "counselor referral: counselor_id == ${cns} and partner_id is null, status == NOMINATED"
            - "partner referral: partner_id == ${prt} and counselor_id is null"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: withdraw_matched_application_returns_match_binding
        claim_type: precondition_enforcement
        grounds: [state_machines.Application, "errors[ERR_MATCH_BINDING]"]
        distinguishing_aspect: "The match is binding: withdraw from MATCHED is rejected with ERR_MATCH_BINDING (not the generic ERR_INVALID_STATE used for other states), and the application stays MATCHED."
        test_recipe:
          setup: ["Cycle A with match run complete; one student MATCHED at the NO_LOAN college."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - &clock_nov
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - *adv
            - &runmatch
              call: "POST /cycles/${cyc}/run-match"
              as: ProgramAdmin
          trigger:
            - call: "POST /applications/${app}/withdraw"
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
            - call: "GET /applications/${app}"
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "withdraw from MATCHED fails with error_id ERR_MATCH_BINDING (409)"
            - "Application.${app}.status remains MATCHED"

      - name: submit_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Application.DRAFT_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "The submit transition exists only from DRAFT; a second identical submit is rejected ERR_INVALID_STATE and submitted_at does not move."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN; one student with a DRAFT application."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
          trigger:
            - call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
              captures: { t1: $.data.submitted_at }
            - call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "first submit succeeds (status UNDER_REVIEW); second fails with ERR_INVALID_STATE (409)"
            - "submitted_at from the first submit is unchanged after the failed second attempt"

      - name: review_already_decided_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.UNDER_REVIEW_to_FINALIST, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FINALIST is not in the review transition's from-set; reviewing an already-decided application fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cycle A in REVIEW phase; one application already decided FINALIST."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
          trigger:
            - call: "POST /applications/${app}/review"
              payload: { decision: "NOT_FINALIST" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_INVALID_STATE"
            - "Application.${app}.status remains FINALIST"

      - name: decide_verification_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IncomeVerification, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VERIFIED is terminal for an IncomeVerification; a second decide on the same record fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cycle A in REVIEW phase; one UNDER_REVIEW application; a counselor-submitted PENDING verification (verified income 6200000 vs reported 6500000 -> within 10%)."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *mkcns
            - *mkprt
            - &mkiv
              call: "POST /income-verifications"
              payload: { application_id: "${app}", verified_income_cents: 6200000, verified_assets_cents: 500000, verified_household_size: 4 }
              as: Counselor
              as_user_id: "${cns}"
              captures: { iv: $.data.id }
          trigger:
            - &decide_verify
              call: "POST /income-verifications/${iv}/decide"
              payload: { decision: "VERIFY" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { out1: $.data.outcome }
            - call: "POST /income-verifications/${iv}/decide"
              payload: { decision: "WAIVE" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { err: $.data.error_id }
          assert:
            - "first decide succeeds with outcome VERIFIED (300000 <= 650000 = 10% of reported)"
            - "second decide fails with ERR_INVALID_STATE (409); the record stays VERIFIED"

      - name: release_released_match_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Match.BINDING_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RELEASED is terminal; a second release fails ERR_INVALID_STATE and the compensation cascade does not fire twice (slots stay at 0)."
        test_recipe:
          setup: ["Cycle A with match run complete; the single match already RELEASED once (slot returned)."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - &getmatch
              call: "GET /matches"
              payload: { application_id: "${app}" }
              as: ProgramAdmin
              captures: { m_id: "$.data[0].id" }
            - call: "POST /matches/${m_id}/release"
              payload: { reason: "first release" }
              as: ProgramAdmin
          trigger:
            - call: "POST /matches/${m_id}/release"
              payload: { reason: "second release" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /colleges/${col}"
              as: ProgramAdmin
              captures: { slots: $.data.slots_committed }
          assert:
            - "second release fails with ERR_INVALID_STATE (409)"
            - "PartnerCollege.${col}.slots_committed is still 0 (no double compensation)"

      - name: advance_to_match_run_blocked_while_reviews_pending
        claim_type: precondition_enforcement
        grounds: [state_machines.MatchCycle.RANKING_to_MATCH_RUN, "errors[ERR_CYCLE_BLOCKED]"]
        distinguishing_aspect: "The RANKING -> MATCH_RUN advance requires zero UNDER_REVIEW applications in the cycle; with one pending review the advance fails ERR_CYCLE_BLOCKED even though the clock is past ranking_closes_at."
        test_recipe:
          setup: ["Cycle A in RANKING phase; one application still UNDER_REVIEW; logical clock 2026-11-05 past the ranking window."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *adv
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /cycles/${cyc}/advance"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the advance fails with ERR_CYCLE_BLOCKED (409)"
            - "MatchCycle.${cyc}.phase remains RANKING"

      - name: advance_to_regular_decision_before_run_returns_cycle_blocked
        claim_type: precondition_enforcement
        grounds: [state_machines.MatchCycle.MATCH_RUN_to_REGULAR_DECISION, "errors[ERR_CYCLE_BLOCKED]"]
        distinguishing_aspect: "MATCH_RUN -> REGULAR_DECISION requires match_run_completed; advancing without running the match fails ERR_CYCLE_BLOCKED."
        test_recipe:
          setup: ["Cycle A in MATCH_RUN phase (one FINALIST and no rankings, so the advance succeeded); run-match not yet executed."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_nov
            - *adv
          trigger:
            - call: "POST /cycles/${cyc}/advance"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the advance fails with ERR_CYCLE_BLOCKED (409) and phase remains MATCH_RUN"

      - name: referral_converts_on_submit
        claim_type: side_effect_execution
        grounds: [state_machines.Referral.NOMINATED_to_CONVERTED, state_machines.Application.DRAFT_to_UNDER_REVIEW]
        distinguishing_aspect: "Submitting an application that cites a referral flips exactly that referral NOMINATED -> CONVERTED; other NOMINATED referrals of the same student are untouched."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN; counselor referral R1 and partner referral R2 both NOMINATED for the same student; the student's DRAFT application cites R1."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *mkcns
            - *mkprt
            - *mkstu
            - call: "POST /referrals"
              payload: { student_id: "${stu}", cycle_id: "${cyc}" }
              as: Counselor
              as_user_id: "${cns}"
              captures: { ref1: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu}", cycle_id: "${cyc}" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { ref2: $.data.id }
            - *adv
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", referral_id: "${ref1}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
          trigger:
            - *submit
            - call: "GET /referrals/${ref1}"
              as: ProgramAdmin
              captures: { r1_status: $.data.status }
            - call: "GET /referrals/${ref2}"
              as: ProgramAdmin
              captures: { r2_status: $.data.status }
          assert:
            - "Referral.${ref1}.status == CONVERTED after the citing application submits"
            - "Referral.${ref2}.status == NOMINATED (uncited referral untouched)"

      - name: referral_expires_when_application_window_closes
        claim_type: side_effect_execution
        grounds: [state_machines.Referral.NOMINATED_to_EXPIRED, state_machines.MatchCycle.APPLICATION_OPEN_to_REVIEW]
        distinguishing_aspect: "Advancing APPLICATION_OPEN -> REVIEW sweeps still-NOMINATED referrals to EXPIRED — a system transition with no direct endpoint."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN; one NOMINATED referral never cited by any application."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *mkcns
            - *mkstu
            - call: "POST /referrals"
              payload: { student_id: "${stu}", cycle_id: "${cyc}" }
              as: Counselor
              as_user_id: "${cns}"
              captures: { ref1: $.data.id }
            - *adv
          trigger:
            - *adv
            - call: "GET /referrals/${ref1}"
              as: ProgramAdmin
              captures: { r_status: $.data.status }
          assert:
            - "after the cycle advances APPLICATION_OPEN -> REVIEW, Referral.${ref1}.status == EXPIRED"

      - name: match_run_creates_binding_match_and_provisional_package
        claim_type: side_effect_execution
        grounds: [state_machines.Application.RANKING_LOCKED_to_MATCHED]
        excluded_because:
          difficulty_instance: run_match_four_hop_cascade
          rationale: "Asserted hop-by-hop (Match BINDING, AidPackage PROVISIONAL, slots_committed, student_stage) in the named §1.8 cascade instance."

      - name: release_voids_aid_package_and_returns_slot
        claim_type: side_effect_execution
        grounds: [state_machines.Match.BINDING_to_RELEASED]
        excluded_because:
          difficulty_instance: match_release_compensation_cascade
          rationale: "The VOID transition and slot return are the hop-2 asserts of the named §1.8 cascade instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: household_cap_scales_with_household_size
        claim_type: constants_applied
        grounds: [calculations.household_income_cap]
        distinguishing_aspect: "cap_cents(2) == 6500000 + (2-4)*400000 == 5700000: a size-2 household at 5700000 is eligible while 5700001 is rejected — the PER_MEMBER_ADJUST_CENTS constant moves the boundary."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN; two registered students, each household_size 2."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 5700000, household_size: 2, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - call: "POST /students"
              payload: { email: "s2@x.com", full_name: "Stu Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 5700001, household_size: 2, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
          trigger:
            - *submit
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
              captures: { err: $.data.error_id }
          assert:
            - "student A (income == cap 5700000): submit succeeds, status UNDER_REVIEW"
            - "student B (income 5700001): ERR_INCOME_INELIGIBLE (422)"

      - name: academic_prep_waiver_vs_standard_path
        claim_type: correct_result
        grounds: [calculations.academic_eligibility, calculations.prep_alum_flag]
        distinguishing_aspect: "The conditional branch of academic_eligibility: a prep alum passes with gpa 335 and NO test score (waiver path, >= 330), while a non-alum with gpa 335 and test 1300 fails (standard path needs gpa >= 350)."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN; student A with a COMPLETED prep program; student B with none. Both apply with gpa_scaled 335."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - call: "POST /prep-programs"
              payload: { student_id: "${stu}", program_type: "SCHOLAR", cohort_label: "sch-2026", starts_on: "2026-03-01T00:00:00Z", ends_on: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prep: $.data.id }
            - call: "POST /prep-programs/${prep}/close"
              payload: { outcome: "COMPLETED" }
              as: ProgramAdmin
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 335 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - call: "POST /students"
              payload: { email: "s2@x.com", full_name: "Stu Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 335, test_score: 1300 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
          trigger:
            - call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
              captures: { stA: $.data.status, pa: $.data.prep_alum, aiA: $.data.academic_index }
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
              captures: { err: $.data.error_id }
          assert:
            - "prep alum: submit succeeds (status UNDER_REVIEW), prep_alum == true, academic_index == 670 (335*2 + 0 for the waived null test)"
            - "non-alum at the same gpa: ERR_ACADEMIC_INELIGIBLE (422)"

      - name: efc_exact_cent_rounding
        claim_type: precision
        grounds: [calculations.expected_family_contribution, calculations.aid_package_composition]
        distinguishing_aspect: "income 4800005 size 4 leaves exactly 5 cents of countable income; efc == round_half_up(5 * 0.20) == 1 — exact integer-cent rounding, no float drift."
        test_recipe:
          setup: ["Cycle A through match run; NO_LOAN college coa 8000000; student income 4800005 size 4; matched, package PROVISIONAL."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 4800005, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *getmatch
            - &getpkg
              call: "GET /aid-packages"
              payload: { match_id: "${m_id}" }
              as: ProgramAdmin
              captures: { pkg: "$.data[0].id" }
          trigger:
            - call: "GET /aid-packages/${pkg}"
              as: ProgramAdmin
              captures: { efc: $.data.efc_cents, need: $.data.need_cents, work: $.data.work_study_cents, grant: $.data.grant_cents }
          assert:
            - "efc_cents == 1"
            - "need_cents == 7999999, work_study_cents == 300000 (cap binds), grant_cents == 7699999"
            - "7699999 + 300000 + 0 + 1 == 8000000 == coa_cents"

      - name: discrepancy_exactly_ten_percent_is_verified
        claim_type: correct_result
        grounds: [calculations.discrepancy_assessment, entities.Application.fields.verification_flag]
        distinguishing_aspect: "The discrepancy rule is strictly-greater: a diff of exactly 10% of reported (650000 on 6500000) decides VERIFIED; one cent more (7150001 vs 6500000) decides DISCREPANCY."
        test_recipe:
          setup: ["Cycle A in REVIEW phase; two UNDER_REVIEW applications both reporting income 6500000; a counselor and an unrelated partner; one PENDING verification per application."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
            - call: "POST /students"
              payload: { email: "s2@x.com", full_name: "Stu Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
            - *adv
            - *mkcns
            - *mkprt
            - call: "POST /income-verifications"
              payload: { application_id: "${app}", verified_income_cents: 7150000, verified_assets_cents: 0, verified_household_size: 4 }
              as: Counselor
              as_user_id: "${cns}"
              captures: { iv1: $.data.id }
            - call: "POST /income-verifications"
              payload: { application_id: "${app2}", verified_income_cents: 7150001, verified_assets_cents: 0, verified_household_size: 4 }
              as: Counselor
              as_user_id: "${cns}"
              captures: { iv2: $.data.id }
          trigger:
            - call: "POST /income-verifications/${iv1}/decide"
              payload: { decision: "VERIFY" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { out1: $.data.outcome }
            - call: "POST /income-verifications/${iv2}/decide"
              payload: { decision: "VERIFY" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { out2: $.data.outcome }
            - call: "GET /applications/${app}"
              as: ProgramAdmin
              captures: { flag1: $.data.verification_flag }
          assert:
            - "exactly 10% over: IncomeVerification.${iv1}.outcome == VERIFIED and Application.${app}.verification_flag == VERIFIED"
            - "one cent past 10%: IncomeVerification.${iv2}.outcome == DISCREPANCY"

      - name: run_match_skips_withdrawn_application
        claim_type: input_set_filtering
        grounds: [calculations.binding_match_assignment, state_machines.Application]
        distinguishing_aspect: "The candidate set is applications in RANKING_LOCKED only: a student who withdraws from RANKING_SUBMITTED before the lock is never locked, never processed, and produces matched_count 0 / unmatched_count 0 (not an unmatched)."
        test_recipe:
          setup: ["Cycle A; one finalist with an accepted ranking list who then withdraws; clock past ranking_closes_at."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - call: "POST /applications/${app}/withdraw"
              as: Student
              as_user_id: "${stu}"
              captures: { w_status: $.data.status }
            - *clock_nov
            - *adv
          trigger:
            - call: "POST /cycles/${cyc}/run-match"
              as: ProgramAdmin
              captures: { mc: $.data.matched_count, uc: $.data.unmatched_count }
            - call: "GET /matches"
              payload: { cycle_id: "${cyc}" }
              as: ProgramAdmin
          assert:
            - "withdraw from RANKING_SUBMITTED succeeded (w_status == WITHDRAWN)"
            - "run-match reports matched_count == 0 and unmatched_count == 0"
            - "GET /matches for the cycle returns an empty array"

      - name: need_tier_half_cap_boundary
        claim_type: constants_applied
        grounds: [calculations.need_tier]
        distinguishing_aspect: "half_cap for size 4 is 3250000: income at exactly 3250000 yields need_tier HIGH, at 3250001 STANDARD — the NEED_HIGH_FRACTION constant and its <= comparison."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN; two students at incomes 3250000 and 3250001, size 4."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 3250000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - call: "POST /students"
              payload: { email: "s2@x.com", full_name: "Stu Two", state_code: "TX", source: "SELF" }
              as: Anonymous
              captures: { stu2: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 3250001, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
          trigger:
            - call: "POST /applications/${app}/submit"
              as: Student
              as_user_id: "${stu}"
              captures: { tier1: $.data.need_tier }
            - call: "POST /applications/${app2}/submit"
              as: Student
              as_user_id: "${stu2}"
              captures: { tier2: $.data.need_tier }
          assert:
            - "income 3250000 == half the cap: need_tier == HIGH"
            - "income 3250001: need_tier == STANDARD"

      - name: finalize_with_waived_verification_keeps_provisional_variant
        claim_type: variant_selection
        grounds: [calculations.expected_family_contribution, state_machines.AidPackage.PROVISIONAL_to_FINALIZED]
        distinguishing_aspect: "Variant selection on finalize: a WAIVED verification opens the finalize gate but retains the PROVISIONAL variant and its amounts (efc 340000), unlike the VERIFIED path in §1.8."
        test_recipe:
          setup: ["Cycle A with match run complete; one matched student (income 6500000 size 4) with a PROVISIONAL package; a counselor-submitted PENDING verification."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkcns
            - *mkprt
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
            - *getmatch
            - *getpkg
            - *mkiv
          trigger:
            - call: "POST /income-verifications/${iv}/decide"
              payload: { decision: "WAIVE" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { out: $.data.outcome }
            - call: "POST /aid-packages/${pkg}/finalize"
              as: CollegeOfficer
              as_user_id: "${col}"
              captures: { f_status: $.data.status, f_var: $.data.aid_variant, f_efc: $.data.efc_cents, f_grant: $.data.grant_cents }
          assert:
            - "the WAIVE decision records outcome == WAIVED"
            - "finalize then succeeds with status FINALIZED but aid_variant == PROVISIONAL, efc_cents == 340000, grant_cents == 7360000"

      - name: regular_pool_ordering_priority_score
        claim_type: correct_result
        grounds: [calculations.match_priority_score]
        excluded_because:
          difficulty_instance: priority_score_need_aware_branch_flips_regular_pool_order
          rationale: "The ordering including its conditional branch is asserted by the named §1.8 instance."

      - name: outcome_summary_reports_both_rate_variants
        claim_type: correct_result
        grounds: [calculations.persistence_rates]
        excluded_because:
          difficulty_instance: persistence_on_track_vs_cohort150
          rationale: "Both variants and their numerators/denominators are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: rankings_after_window_returns_window_closed
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_WINDOW_CLOSED]"]
        distinguishing_aspect: "A FINALIST (state check passes) submitting rankings with the clock past ranking_closes_at is stopped purely by the temporal rule: ERR_WINDOW_CLOSED."
        test_recipe:
          setup: ["Cycle A in RANKING phase; one FINALIST application; clock at 2026-11-05T00:00:00Z, past the ranking window; one ACTIVE college."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_WINDOW_CLOSED (temporal rule, reached only because the state check passed)"

      - name: review_during_application_open_returns_wrong_cycle_phase
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_WRONG_CYCLE_PHASE]"]
        distinguishing_aspect: "review is bound to phase REVIEW: calling it while the cycle is APPLICATION_OPEN fails ERR_WRONG_CYCLE_PHASE even though the application is UNDER_REVIEW."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN; one UNDER_REVIEW application."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
          trigger:
            - call: "POST /applications/${app}/review"
              payload: { decision: "FINALIST" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_WRONG_CYCLE_PHASE"

      - name: duplicate_application_returns_duplicate_error
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_APPLICATION]"]
        distinguishing_aspect: "One non-WITHDRAWN application per (student, cycle): a second create with no referral cited fails ERR_DUPLICATE_APPLICATION."
        test_recipe:
          setup: ["Cycle A in APPLICATION_OPEN; one student with an UNDER_REVIEW application."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkstu
            - *mkapp
            - *submit
          trigger:
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_DUPLICATE_APPLICATION"

      - name: non_contiguous_or_duplicate_rankings_return_rank_order_invalid
        claim_type: violation_to_error
        grounds: [calculations.ranking_list_shape, "errors[ERR_RANK_ORDER_INVALID]"]
        distinguishing_aspect: "Two shape violations share one error: positions [1,3] (gap) and positions [1,2] naming the same college twice both fail ERR_RANK_ORDER_INVALID."
        test_recipe:
          setup: ["Cycle A in RANKING phase, clock inside the window; two ACTIVE colleges; one FINALIST application at version ${app_v}."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - call: "POST /colleges"
              payload: { name: "Second U", aid_policy: "NO_LOAN", min_academic_index: 0, match_slots: 1, coa_cents: 8000000 }
              as: ProgramAdmin
              captures: { col2: $.data.id }
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
          trigger:
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }, { college_id: "${col2}", rank_position: 3 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { err1: $.data.error_id }
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }, { college_id: "${col}", rank_position: 2 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { err2: $.data.error_id }
          assert:
            - "gap in positions: ERR_RANK_ORDER_INVALID (422)"
            - "same college twice: ERR_RANK_ORDER_INVALID (422)"
            - "both failures left the application FINALIST with no accepted list (version unchanged, still ${app_v})"

      - name: unknown_college_in_rankings_returns_unknown_college
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_UNKNOWN_COLLEGE]"]
        distinguishing_aspect: "A ranking entry naming a nonexistent college id fails referential validation with ERR_UNKNOWN_COLLEGE (422)."
        test_recipe:
          setup: ["Cycle A in RANKING phase, clock inside the window; one FINALIST application."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
          trigger:
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "00000000-0000-4000-8000-000000000000", rank_position: 1 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 with error_id ERR_UNKNOWN_COLLEGE"

      - name: suspended_college_in_new_ranking_list_returns_college_inactive
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_COLLEGE_INACTIVE]"]
        distinguishing_aspect: "At submission time every ranked college must be ACTIVE: a college SUSPENDED before the submission fails ERR_COLLEGE_INACTIVE (distinct from the match-run skip in §1.8)."
        test_recipe:
          setup: ["Cycle A in RANKING phase, clock inside the window; one FINALIST application; the college already SUSPENDED."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - call: "POST /colleges/${col}/suspend"
              as: ProgramAdmin
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
          trigger:
            - call: "POST /applications/${app}/rankings"
              payload: { entries: [{ college_id: "${col}", rank_position: 1 }], expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_COLLEGE_INACTIVE"

      - name: second_run_match_returns_match_already_run
        claim_type: violation_to_error
        grounds: [state_machines.MatchCycle, "errors[ERR_MATCH_ALREADY_RUN]"]
        distinguishing_aspect: "run-match is once-per-cycle: a second call after match_run_completed is true fails ERR_MATCH_ALREADY_RUN."
        test_recipe:
          setup: ["Cycle A in MATCH_RUN phase with the match already executed (one matched student)."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *adv
            - *mkcol_nl
            - *mkstu
            - *mkapp
            - *submit
            - *adv
            - *review_fin
            - *adv
            - *clock_rank
            - *rank1
            - *clock_nov
            - *adv
            - *runmatch
          trigger:
            - call: "POST /cycles/${cyc}/run-match"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the second run fails with ERR_MATCH_ALREADY_RUN (409) and no additional Match rows are created"

      - name: referring_partner_cannot_decide_that_applications_verification
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the community partner whose referral the application cites cannot decide that application's verification (403), while an unrelated partner can."
        test_recipe:
          setup: ["Cycle A in REVIEW phase; student referred by partner P1 (referral CONVERTED at submit); counselor-submitted PENDING verification; second partner P2 also registered."]
          setup_api_calls:
            - *clock0
            - *mkcycle
            - *adv
            - *mkcns
            - *mkprt
            - call: "POST /community-partners"
              payload: { org_name: "Second Org", state_code: "TX", contact_email: "s@x.com" }
              as: ProgramAdmin
              captures: { prt2: $.data.id }
            - *mkstu
            - call: "POST /referrals"
              payload: { student_id: "${stu}", cycle_id: "${cyc}" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { ref1: $.data.id }
            - *adv
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", referral_id: "${ref1}", household_income_cents: 6500000, household_size: 4, gpa_scaled: 390, test_score: 1450 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - *submit
            - *adv
            - *mkiv
          trigger:
            - call: "POST /income-verifications/${iv}/decide"
              payload: { decision: "VERIFY" }
              as: PartnerStaff
              as_user_id: "${prt}"
              captures: { err: $.data.error_id }
            - call: "POST /income-verifications/${iv}/decide"
              payload: { decision: "VERIFY" }
              as: PartnerStaff
              as_user_id: "${prt2}"
              captures: { out2: $.data.outcome }
          assert:
            - "decide by the referring partner P1 fails with ERR_SEGREGATION_OF_DUTIES (403) and the record stays PENDING"
            - "decide by unrelated partner P2 succeeds with outcome VERIFIED"

      - name: register_duplicate_email_returns_email_taken
        claim_type: violation_to_error
