# =============================================================================
# Family Court / Divorce Case Management — Seed Tables (Expert difficulty)
# =============================================================================
# Scenario verbatim below. Difficulty calibrated to EXPERT per §0.4:
#   12 entities, 30 endpoints, 28 errors, 4 calculation rules (4 variant pairs),
#   6 state machines (cyclic mediation, cyclic parenting-plan revision,
#   branching court-order), segregation_of_duties RBAC.
# =============================================================================

scenario: |
  Family Court / Divorce Case: petition and answer, Financial Disclosure,
  Custody/Parenting Plan, Child Support/Spousal Support state guidelines,
  mediation, Temporary Order, Final Judgment

domain_name: family-court-divorce
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency      # OCC on Case.version for order/judgment issuance
    - dual_variant_calculation    # temporary (declared income) vs final (verified income)
    - cascading_side_effects      # mediation agreement & final judgment cascade 3+ entities
    - derived_field_reconciliation # Case ledger fields reconcile against support orders

  entity_topology: flat
  # Peer entities linked by foreign keys; collections live flat under /api,
  # children carry case_id / party_id FK fields in body (no nested URL paths).

  state_machine_shape: cyclic
  # MediationSession loops IN_SESSION->PARTIAL_AGREEMENT->IN_SESSION (rounds);
  # ParentingPlan loops PROPOSED->DISPUTED->REVISED->DISPUTED (revision rounds);
  # CourtOrder branches DRAFT->{TEMPORARY issuance, FINAL judgment}.

  relationship_patterns:
    - one_to_many       # Case has many Party, Child, Pleading, SupportOrder, ...
    - cross_aggregate   # SupportOrder references ParentingPlan & FinancialDisclosure
    - self_referential  # CourtOrder.supersedes_order_id -> CourtOrder.id

  role_model: segregation_of_duties
  # The judicial officer who mediated a Case (Case.mediator_user_id) MUST NOT
  # enter that Case's Final Judgment (Case.judge_user_id != mediator_user_id).
  # Petitioner vs Respondent are non-overlapping resource owners (peer).

  consistency_model: immediate
  # All cascades and derived-field recomputes complete within the triggering
  # request; the response reflects post-cascade state.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: GuidelineSchedule
    parent: null
    common_fields: false   # configuration, immutable: id + created_at only
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code the guideline applies to", constraints: "uppercase, 2 chars; unique among schedules" }
      - { name: basic_obligation_tiers, type: array, source: input, description: "Ordered child-support tiers: array of {min_combined_monthly_cents, max_combined_monthly_cents, base_cents_one_child, marginal_pct_per_extra_child}; tiers are contiguous and ascending by min_combined_monthly_cents" }
      - { name: spousal_payor_pct, type: number, source: input, description: "Spousal-support payor share, e.g. 0.40 (40% of payor net)", default: 0.40, constraints: "0 < x < 1" }
      - { name: spousal_payee_offset_pct, type: number, source: input, description: "Spousal-support payee offset share, e.g. 0.50 (50% of payee net)", default: 0.50, constraints: "0 < x < 1" }
      - { name: shared_custody_threshold_pct, type: number, source: input, description: "Parenting-time fraction at or above which the shared-custody child-support offset applies (>=)", default: 0.40, constraints: "0 < x < 1" }
      - { name: long_marriage_months, type: integer, source: input, description: "Marriage duration (months) at or above which spousal support term is INDEFINITE (>=)", default: 120, constraints: ">= 0" }

  # ---------------------------------------------------------------------------
  - name: Case
    parent: null
    common_fields: true    # id, created_at, updated_at, version
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; selects the GuidelineSchedule used for support math", constraints: "must match an existing GuidelineSchedule.state_code" }
      - { name: caption, type: string, source: input, description: "Case caption / title, e.g. 'In re Marriage of Smith'" }
      - { name: marriage_months, type: integer, source: input, description: "Duration of the marriage in months at filing; drives spousal-support term", constraints: ">= 0" }
      - { name: filing_fee_cents, type: integer, source: input, description: "Filing fee assessed at case creation", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "FILED -> AWAITING_RESPONSE -> {DEFAULT_PENDING | CONTESTED} -> DISCOVERY -> MEDIATION -> AWAITING_JUDGMENT -> JUDGMENT_ENTERED; DISMISSED is terminal-from-any-pre-judgment", constraints: "enum {FILED, AWAITING_RESPONSE, DEFAULT_PENDING, CONTESTED, DISCOVERY, MEDIATION, AWAITING_JUDGMENT, JUDGMENT_ENTERED, DISMISSED}" }
      - { name: mediator_user_id, type: string, source: system, description: "X-User-ID of the Mediator assigned when the case entered MEDIATION; null before then" }
      - { name: judge_user_id, type: string, source: system, description: "X-User-ID of the Judge who entered the Final Judgment; null before then" }
      - { name: active_support_total_cents, type: integer, source: computed, description: "Conserved ledger: SUM(SupportOrder.monthly_amount_cents for SupportOrder.case_id == this.id AND SupportOrder.status == ACTIVE). Recomputed on every SupportOrder status change." }
      - { name: net_fees_collected_cents, type: integer, source: computed, description: "Conserved ledger: filing_fee_cents while status != DISMISSED, else 0 (fee refunded on dismissal)" }
      - { name: petitioner_disclosure_verified, type: boolean, source: computed, description: "True iff the petitioner Party has a FinancialDisclosure in VERIFIED status" }
      - { name: respondent_disclosure_verified, type: boolean, source: computed, description: "True iff the respondent Party has a FinancialDisclosure in VERIFIED status" }

  # ---------------------------------------------------------------------------
  - name: Party
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this party belongs to" }
      - { name: role, type: enum, source: input, description: "PETITIONER | RESPONDENT", constraints: "exactly one PETITIONER and at most one RESPONDENT per case" }
      - { name: user_id, type: string, source: input, description: "Operator X-User-ID this party is bound to; the Petitioner/Respondent role acts as this party only when X-User-ID equals this value" }
      - { name: full_name, type: string, source: input, description: "Party legal name" }
      - { name: gross_monthly_income_cents, type: integer, source: input, description: "Declared gross monthly income at filing (used by the TEMPORARY support variant)", constraints: ">= 0" }

  # ---------------------------------------------------------------------------
  - name: Child
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this child is a subject of" }
      - { name: full_name, type: string, source: input, description: "Child legal name" }
      - { name: birth_year, type: integer, source: input, description: "Child birth year (informational)", constraints: ">= 1900" }

  # ---------------------------------------------------------------------------
  - name: Pleading
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this pleading is filed in" }
      - { name: pleading_type, type: enum, source: input, description: "PETITION | ANSWER", constraints: "exactly one PETITION per case; ANSWER only after the PETITION is SERVED" }
      - { name: filed_by_party_id, type: string, source: input, description: "FK -> Party.id; the party who filed this pleading" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SERVED -> (PETITION only) ANSWERED; ANSWER goes DRAFT -> SERVED only", constraints: "enum {DRAFT, SERVED, ANSWERED}" }
      - { name: served_at, type: datetime, source: system, description: "When the pleading was served on the opposing party; set on SERVED transition" }

  # ---------------------------------------------------------------------------
  - name: FinancialDisclosure
    parent: Party
    common_fields: true
    fields:
      - { name: party_id, type: string, source: input, description: "FK -> Party.id; the party making this disclosure" }
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; denormalized for case-scoped queries" }
      - { name: gross_monthly_income_cents, type: integer, source: input, description: "Verified gross monthly income (used by the FINAL support variant)", constraints: ">= 0" }
      - { name: tax_withholding_cents, type: integer, source: input, description: "Monthly income tax + payroll withholding deduction", constraints: ">= 0" }
      - { name: mandatory_retirement_cents, type: integer, source: input, description: "Monthly mandatory retirement contribution deduction", constraints: ">= 0" }
      - { name: health_insurance_cents, type: integer, source: input, description: "Monthly health-insurance premium deduction", constraints: ">= 0" }
      - { name: net_monthly_income_cents, type: integer, source: computed, description: "Net disposable income per net_disposable_income calc; computed on SUBMITTED transition" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> {VERIFIED | RETURNED}; RETURNED -> SUBMITTED (resubmit loop)", constraints: "enum {DRAFT, SUBMITTED, VERIFIED, RETURNED}" }

  # ---------------------------------------------------------------------------
  - name: ParentingPlan
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this parenting plan governs (one plan per case)" }
      - { name: proposed_by_party_id, type: string, source: input, description: "FK -> Party.id; party who proposed the current plan version" }
      - { name: petitioner_overnights, type: integer, source: input, description: "Annual overnights allocated to the PETITIONER", constraints: "0 <= x <= 365" }
      - { name: respondent_overnights, type: integer, source: input, description: "Annual overnights allocated to the RESPONDENT", constraints: "petitioner_overnights + respondent_overnights == 365 (conserved)" }
      - { name: petitioner_time_pct, type: number, source: computed, description: "petitioner_overnights / 365 per parenting_time_percentage calc (4-decimal)" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> {DISPUTED | AGREED}; DISPUTED -> REVISED -> {DISPUTED | AGREED} (revision loop); AGREED -> ADOPTED", constraints: "enum {PROPOSED, DISPUTED, REVISED, AGREED, ADOPTED}" }

  # ---------------------------------------------------------------------------
  - name: MediationSession
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case under mediation" }
      - { name: mediator_user_id, type: string, source: input, description: "Operator X-User-ID of the mediator running the session; must equal Case.mediator_user_id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end (ISO 8601 UTC); must be after scheduled_start" }
      - { name: round_no, type: integer, source: computed, description: "1 + count of prior FULL/PARTIAL/IMPASSE sessions on this case; assigned on creation" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_SESSION -> {PARTIAL_AGREEMENT | FULL_AGREEMENT | IMPASSE}; PARTIAL_AGREEMENT is non-terminal (another round may be scheduled)", constraints: "enum {SCHEDULED, IN_SESSION, PARTIAL_AGREEMENT, FULL_AGREEMENT, IMPASSE}" }

  # ---------------------------------------------------------------------------
  - name: SupportOrder
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this support obligation belongs to" }
      - { name: support_type, type: enum, source: input, description: "CHILD | SPOUSAL", constraints: "enum {CHILD, SPOUSAL}" }
      - { name: payor_party_id, type: string, source: input, description: "FK -> Party.id; the obligor party" }
      - { name: payee_party_id, type: string, source: input, description: "FK -> Party.id; the recipient party" }
      - { name: variant, type: enum, source: input, description: "TEMPORARY (uses declared Party.gross_monthly_income_cents) | FINAL (uses VERIFIED FinancialDisclosure)", constraints: "enum {TEMPORARY, FINAL}" }
      - { name: monthly_amount_cents, type: integer, source: computed, description: "Computed obligation per child_support_guideline or spousal_support_guideline at creation; never client-supplied", constraints: ">= 0" }
      - { name: support_term_months, type: integer, source: computed, description: "SPOUSAL only: term in months (0 sentinel means INDEFINITE); CHILD orders set 0 (until emancipation, out of scope)" }
      - { name: status, type: enum, source: system, description: "CALCULATED -> ACTIVE -> {VACATED}; ACTIVE orders count toward Case.active_support_total_cents", constraints: "enum {CALCULATED, ACTIVE, VACATED}" }

  # ---------------------------------------------------------------------------
  - name: CourtOrder
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this order is entered in" }
      - { name: order_kind, type: enum, source: input, description: "TEMPORARY | FINAL_JUDGMENT", constraints: "enum {TEMPORARY, FINAL_JUDGMENT}" }
      - { name: support_order_ids, type: array, source: input, description: "Array of FK -> SupportOrder.id activated/governed by this order; each must be in CALCULATED status and belong to the same case" }
      - { name: parenting_plan_id, type: string, source: input, description: "FK -> ParentingPlan.id governed by this order (required for FINAL_JUDGMENT)" }
      - { name: supersedes_order_id, type: string, source: input, description: "FK -> CourtOrder.id; self-referential — a FINAL_JUDGMENT supersedes a prior TEMPORARY order (null for TEMPORARY)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ENTERED -> {SUPERSEDED}; only TEMPORARY orders may become SUPERSEDED", constraints: "enum {DRAFT, ENTERED, SUPERSEDED}" }
      - { name: entered_at, type: datetime, source: system, description: "When the order was entered; set on ENTERED transition" }

  # ---------------------------------------------------------------------------
  - name: Hearing
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this hearing is set for" }
      - { name: courtroom_code, type: string, source: input, description: "Courtroom resource identifier; hearings in the same courtroom may not overlap" }
      - { name: scheduled_start, type: datetime, source: input, description: "Hearing start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Hearing end (ISO 8601 UTC); must be after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> {HELD | CANCELLED}", constraints: "enum {SCHEDULED, HELD, CANCELLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Case
    initial_state: FILED
    terminal_states: [JUDGMENT_ENTERED, DISMISSED]
    transitions:
      - from: FILED
        to: AWAITING_RESPONSE
        trigger: "POST /api/pleadings/{id}/serve on the case's PETITION"
        actor: Clerk
        preconditions:
          - "Case has exactly one PETITION pleading and it is being SERVED in this request"
        side_effects:
          - "Case.status -> AWAITING_RESPONSE"
          - "increments Case.version by 1"

      - from: AWAITING_RESPONSE
        to: CONTESTED
        trigger: "POST /api/pleadings (ANSWER) then POST /api/pleadings/{id}/serve"
        actor: Clerk
        preconditions:
          - "An ANSWER pleading exists filed by the RESPONDENT party and is being SERVED"
        side_effects:
          - "Case.status -> CONTESTED"
          - "increments Case.version by 1"

      - from: AWAITING_RESPONSE
        to: DEFAULT_PENDING
        trigger: "POST /api/cases/{id}/default"
        actor: Clerk
        preconditions:
          - "No ANSWER pleading exists for the case (respondent failed to answer)"
        side_effects:
          - "Case.status -> DEFAULT_PENDING"
          - "increments Case.version by 1"

      - from: CONTESTED
        to: DISCOVERY
        trigger: "POST /api/cases/{id}/advance with to_status=DISCOVERY"
        actor: Clerk
        preconditions:
          - "Both PETITIONER and RESPONDENT parties exist (cross-entity: Pleading/Party state)"
        side_effects:
          - "Case.status -> DISCOVERY"
          - "increments Case.version by 1"

      - from: DISCOVERY
        to: MEDIATION
        trigger: "POST /api/cases/{id}/assign-mediator"
        actor: Clerk
        preconditions:
          - "Both parties' FinancialDisclosure are in SUBMITTED or VERIFIED (cross-entity: FinancialDisclosure state)"
          - "mediator_user_id in body is not equal to any user_id that will later enter judgment is NOT checked here (SoD is enforced at judgment entry)"
        side_effects:
          - "Case.mediator_user_id := body.mediator_user_id"
          - "Case.status -> MEDIATION"
          - "increments Case.version by 1"

      - from: MEDIATION
        to: AWAITING_JUDGMENT
        trigger: "system, on MediationSession FULL_AGREEMENT (cascade link 3)"
        actor: system
        preconditions:
          - "A MediationSession on this case reached FULL_AGREEMENT"
          - "ParentingPlan for the case is ADOPTED"
        side_effects:
          - "Case.status -> AWAITING_JUDGMENT"
          - "increments Case.version by 1"

      - from: DEFAULT_PENDING
        to: AWAITING_JUDGMENT
        trigger: "POST /api/cases/{id}/advance with to_status=AWAITING_JUDGMENT"
        actor: Clerk
        preconditions:
          - "Petitioner FinancialDisclosure is VERIFIED (default judgment proceeds on petitioner's proof)"
        side_effects:
          - "Case.status -> AWAITING_JUDGMENT"
          - "increments Case.version by 1"

      - from: AWAITING_JUDGMENT
        to: JUDGMENT_ENTERED
        trigger: "POST /api/court-orders/{id}/enter on a FINAL_JUDGMENT order"
        actor: Judge
        preconditions:
          - "Both parties' FinancialDisclosure are VERIFIED (Case.petitioner_disclosure_verified AND Case.respondent_disclosure_verified), OR case is on the DEFAULT path with petitioner verified"
          - "Acting Judge X-User-ID != Case.mediator_user_id (segregation of duties)"
          - "expected_case_version matches Case.version (OCC)"
        side_effects:
          - "Case.judge_user_id := acting X-User-ID"
          - "Case.status -> JUDGMENT_ENTERED"
          - "increments Case.version by 1"

      - from: AWAITING_RESPONSE
        to: DISMISSED
        trigger: "POST /api/cases/{id}/dismiss"
        actor: Clerk
        preconditions:
          - "Case is in any pre-judgment status {FILED, AWAITING_RESPONSE, DEFAULT_PENDING, CONTESTED, DISCOVERY, MEDIATION, AWAITING_JUDGMENT}"
        side_effects:
          - "Case.status -> DISMISSED"
          - "Case.net_fees_collected_cents -> 0 (filing fee refunded — compensating action)"
          - "All non-VACATED SupportOrder on the case -> VACATED (compensation), Case.active_support_total_cents recomputed to 0"
          - "increments Case.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Pleading
    initial_state: DRAFT
    terminal_states: [ANSWERED]
    transitions:
      - from: DRAFT
        to: SERVED
        trigger: "POST /api/pleadings/{id}/serve"
        actor: Clerk
        preconditions:
          - "For an ANSWER: the case's PETITION must already be SERVED (ERR_PETITION_NOT_SERVED)"
        side_effects:
          - "Pleading.served_at := request timestamp"
          - "If PETITION: drives Case FILED -> AWAITING_RESPONSE"
          - "If ANSWER: drives Case AWAITING_RESPONSE -> CONTESTED"

      - from: SERVED
        to: ANSWERED
        trigger: "system, when a RESPONDENT ANSWER for the same case is SERVED"
        actor: system
        note: "Only the PETITION transitions to ANSWERED; the ANSWER itself remains SERVED (terminal for it)"
        preconditions:
          - "Pleading is the case PETITION and an ANSWER has just been SERVED"
        side_effects:
          - "Petition.status -> ANSWERED"

  # ---------------------------------------------------------------------------
  - entity: FinancialDisclosure
    initial_state: DRAFT
    terminal_states: []   # VERIFIED is reopenable only via RETURNED of a new disclosure; see note
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/financial-disclosures/{id}/submit"
        actor: Petitioner|Respondent
        preconditions:
          - "Acting party owns this disclosure (X-User-ID == Party.user_id of party_id)"
          - "gross_monthly_income_cents >= tax_withholding_cents + mandatory_retirement_cents + health_insurance_cents (ERR_NEGATIVE_NET_INCOME)"
        side_effects:
          - "FinancialDisclosure.net_monthly_income_cents := net_disposable_income(this)"
          - "FinancialDisclosure.status -> SUBMITTED"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/financial-disclosures/{id}/verify"
        actor: Clerk
        preconditions:
          - "Case.status in {DISCOVERY, MEDIATION, DEFAULT_PENDING, AWAITING_JUDGMENT}"
        side_effects:
          - "FinancialDisclosure.status -> VERIFIED"
          - "Recompute owning Case.petitioner_disclosure_verified / respondent_disclosure_verified"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/financial-disclosures/{id}/return"
        actor: Clerk
        preconditions: []
        side_effects:
          - "FinancialDisclosure.status -> RETURNED"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/financial-disclosures/{id}/submit"
        actor: Petitioner|Respondent
        preconditions:
          - "Acting party owns this disclosure"
          - "gross_monthly_income_cents >= sum of declared deductions (ERR_NEGATIVE_NET_INCOME)"
        side_effects:
          - "FinancialDisclosure.net_monthly_income_cents := net_disposable_income(this) (re-derived)"
          - "FinancialDisclosure.status -> SUBMITTED"

  # ---------------------------------------------------------------------------
  - entity: ParentingPlan
    initial_state: PROPOSED
    terminal_states: [ADOPTED]
    transitions:
      - from: PROPOSED
        to: DISPUTED
        trigger: "POST /api/parenting-plans/{id}/dispute"
        actor: Petitioner|Respondent
        preconditions:
          - "Acting party is the case party who did NOT propose the current version (proposed_by_party_id != acting party) (ERR_NOT_DISPUTING_PARTY)"
        side_effects:
          - "ParentingPlan.status -> DISPUTED"

      - from: DISPUTED
        to: REVISED
        trigger: "POST /api/parenting-plans/{id}/revise"
        actor: Petitioner|Respondent
        preconditions:
          - "petitioner_overnights + respondent_overnights == 365 in the revision body (ERR_OVERNIGHTS_NOT_365)"
        side_effects:
          - "ParentingPlan.petitioner_overnights / respondent_overnights := revision body values"
          - "ParentingPlan.proposed_by_party_id := acting party"
          - "Recompute ParentingPlan.petitioner_time_pct"
          - "ParentingPlan.status -> REVISED"

      - from: REVISED
        to: DISPUTED
        trigger: "POST /api/parenting-plans/{id}/dispute"
        actor: Petitioner|Respondent
        note: "Revision loop — the other party may dispute the revised version again (cyclic)"
        preconditions:
          - "Acting party is the case party who did NOT propose the current version (ERR_NOT_DISPUTING_PARTY)"
        side_effects:
          - "ParentingPlan.status -> DISPUTED"

      - from: PROPOSED
        to: AGREED
        trigger: "POST /api/parenting-plans/{id}/agree"
        actor: Petitioner|Respondent
        preconditions:
          - "Acting party is the case party who did NOT propose the current version (ERR_NOT_DISPUTING_PARTY)"
        side_effects:
          - "ParentingPlan.status -> AGREED"

      - from: REVISED
        to: AGREED
        trigger: "POST /api/parenting-plans/{id}/agree"
        actor: Petitioner|Respondent
        preconditions:
          - "Acting party is the case party who did NOT propose the current version (ERR_NOT_DISPUTING_PARTY)"
        side_effects:
          - "ParentingPlan.status -> AGREED"

      - from: AGREED
        to: ADOPTED
        trigger: "system, on MediationSession FULL_AGREEMENT (cascade link 2)"
        actor: system
        preconditions:
          - "Plan is AGREED"
        side_effects:
          - "ParentingPlan.status -> ADOPTED"
          - "Triggers recomputation of FINAL CHILD SupportOrder amounts referencing this plan (cascade link 3 -> SupportOrder)"

  # ---------------------------------------------------------------------------
  - entity: MediationSession
    initial_state: SCHEDULED
    terminal_states: [FULL_AGREEMENT, IMPASSE]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /api/mediation-sessions/{id}/start"
        actor: Mediator
        preconditions:
          - "Acting Mediator X-User-ID == Case.mediator_user_id"
          - "Case.status == MEDIATION"
        side_effects:
          - "MediationSession.status -> IN_SESSION"

      - from: IN_SESSION
        to: PARTIAL_AGREEMENT
        trigger: "POST /api/mediation-sessions/{id}/conclude with outcome=PARTIAL_AGREEMENT"
        actor: Mediator
        note: "Non-terminal — another round may be scheduled (cyclic)"
        preconditions: []
        side_effects:
          - "MediationSession.status -> PARTIAL_AGREEMENT"

      - from: IN_SESSION
        to: FULL_AGREEMENT
        trigger: "POST /api/mediation-sessions/{id}/conclude with outcome=FULL_AGREEMENT"
        actor: Mediator
        preconditions:
          - "ParentingPlan for the case is in AGREED status (ERR_PLAN_NOT_AGREED)"
        side_effects:
          - "MediationSession.status -> FULL_AGREEMENT"
          - "Cascade link 2: ParentingPlan AGREED -> ADOPTED"
          - "Cascade link 3: ParentingPlan ADOPTED recomputes FINAL CHILD SupportOrder amounts"
          - "Cascade link 4: Case MEDIATION -> AWAITING_JUDGMENT"

      - from: IN_SESSION
        to: IMPASSE
        trigger: "POST /api/mediation-sessions/{id}/conclude with outcome=IMPASSE"
        actor: Mediator
        preconditions: []
        side_effects:
          - "MediationSession.status -> IMPASSE"

      - from: PARTIAL_AGREEMENT
        to: IN_SESSION
        trigger: "POST /api/mediation-sessions/{id}/start (next round, same session row reopened)"
        actor: Mediator
        note: "Cyclic — reopening a partially-agreed session for a further round"
        preconditions:
          - "Acting Mediator X-User-ID == Case.mediator_user_id"
        side_effects:
          - "MediationSession.status -> IN_SESSION"

  # ---------------------------------------------------------------------------
  - entity: CourtOrder
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ENTERED
        trigger: "POST /api/court-orders/{id}/enter"
        actor: Judge
        preconditions:
          - "For TEMPORARY: Case.status in {DISCOVERY, MEDIATION, DEFAULT_PENDING}"
          - "For FINAL_JUDGMENT: Case.status == AWAITING_JUDGMENT AND disclosures verified per Case machine AND acting Judge != Case.mediator_user_id (SoD)"
          - "expected_case_version matches Case.version (OCC) on FINAL_JUDGMENT"
          - "All referenced SupportOrder are in CALCULATED status (ERR_SUPPORT_ORDER_NOT_CALCULATED)"
        side_effects:
          - "CourtOrder.entered_at := request timestamp"
          - "CourtOrder.status -> ENTERED"
          - "All referenced SupportOrder -> ACTIVE; Case.active_support_total_cents recomputed (ledger sync)"
          - "If FINAL_JUDGMENT and supersedes_order_id set: cascade link A -> that TEMPORARY CourtOrder -> SUPERSEDED"
          - "If FINAL_JUDGMENT: drives Case AWAITING_JUDGMENT -> JUDGMENT_ENTERED; increments Case.version by 1"

      - from: ENTERED
        to: SUPERSEDED
        trigger: "system, when a FINAL_JUDGMENT that supersedes this TEMPORARY order is ENTERED (cascade link A)"
        actor: system
        preconditions:
          - "This order is order_kind == TEMPORARY"
        side_effects:
          - "CourtOrder.status -> SUPERSEDED"
          - "Cascade link B: every SupportOrder referenced by this superseded order that is NOT also referenced by the entering FINAL_JUDGMENT -> VACATED; Case.active_support_total_cents recomputed (compensation, ledger conserved)"

  # ---------------------------------------------------------------------------
  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /api/hearings/{id}/hold"
        actor: Judge
        preconditions:
          - "Hearing.scheduled_start <= request timestamp is NOT enforced (clock-free); only status check applies"
        side_effects:
          - "Hearing.status -> HELD"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/hearings/{id}/cancel"
        actor: Clerk
        preconditions: []
        side_effects:
          - "Hearing.status -> CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: final-judgment-stale-case
    parent_entity: Case
    write_endpoint: "POST /api/court-orders/{id}/enter"
    occ_field: "expected_case_version"
    description: |
      Entering a FINAL_JUDGMENT against a Case whose version has advanced since
      the client last observed it is rejected on a stale version. This captures
      the case where another writer has already entered a FINAL_JUDGMENT (which
      legitimately advances the case to JUDGMENT_ENTERED and bumps its version),
      so the current writer's view of the case is stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_disposable_income
    trigger: "FinancialDisclosure DRAFT->SUBMITTED and RETURNED->SUBMITTED transitions"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): rounding/aggregation order is PINNED.
      # All inputs are already integer cents (no sub-cent rounding within a line),
      # so the pinned order is: SUM the three deduction lines first, THEN subtract
      # from gross, THEN floor at 0. There is exactly one deterministic result.
      deductions = tax_withholding_cents
                 + mandatory_retirement_cents
                 + health_insurance_cents          # summed in this field order
      net = gross_monthly_income_cents - deductions
      net_monthly_income_cents = max(0, net)       # floor at 0 cents
    input_set: "the single FinancialDisclosure being submitted (no cross-entity aggregation)"
    constants: {}
    precision: "integer cents; no fractional rounding (inputs are whole cents)"
    variants:
      - name: submitted_value
        when: "on each SUBMITTED transition"
        difference: "re-derived from the disclosure's current field values; a RETURNED->SUBMITTED resubmit with edited deductions yields a new net"

  - name: parenting_time_percentage
    trigger: "ParentingPlan creation and each REVISED transition"
    algorithm: threshold
    formula: |
      # Combinatorial mode (c): circular-looking dependency, evaluation order PINNED.
      # petitioner_time_pct is computed FIRST from overnights; child support's
      # shared-custody offset (see child_support_guideline) then READS this pinned
      # value. Support never feeds back into the percentage, so the order is acyclic
      # once pinned: (1) compute time_pct, (2) compute support using time_pct.
      petitioner_time_pct = round(petitioner_overnights / 365, 4)   # 4 decimals, half_up
    input_set: "the ParentingPlan's petitioner_overnights / respondent_overnights (must sum to 365)"
    constants: { TOTAL_OVERNIGHTS: 365 }
    precision: "4 decimal places, round_half_up"
    variants:
      - name: petitioner_perspective
        when: "always"
        difference: "respondent fraction is the complement 1 - petitioner_time_pct; the shared-custody threshold is tested against whichever parent is the support PAYEE (the higher-overnight parent receives, lower-overnight parent pays)"

  - name: child_support_guideline
    trigger: "SupportOrder creation where support_type=CHILD; FINAL variant also recomputed on ParentingPlan ADOPTED (cascade link 3)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs (combined net income, child_count,
      # payor parenting-time fraction) with non-linear tier selection + branch.
      child_count = count(Child where case_id == order.case_id)
      if child_count == 0:
        monthly_amount_cents = 0           # empty-set boundary (Rule 6)
        return
      # 1) Combined monthly net income depends on the VARIANT (Rule 1 domain: Child):
      #    TEMPORARY -> sum of both parties' declared Party.gross_monthly_income_cents
      #    FINAL     -> sum of both parties' VERIFIED FinancialDisclosure.net_monthly_income_cents
      combined = payor_income + payee_income       # per variant, see variants[]
      # 2) Select the GuidelineSchedule tier by `combined` (Case.state_code):
      #    pick the tier where min_combined_monthly_cents <= combined <= max_combined_monthly_cents
      #    (tiers contiguous; boundary inclusive on BOTH ends — ties resolved to the LOWER tier
      #     i.e. a value equal to a tier's max belongs to that tier, not the next one).
      base = tier.base_cents_one_child
      if child_count > 1:
        base = round( base * (1 + tier.marginal_pct_per_extra_child * (child_count - 1)), 0 )  # half_up
      # 3) Prorate by the PAYOR's income share of combined:
      payor_share = payor_income / combined        # payor is the lower-overnight parent
      obligation = round( base * payor_share, 0 )   # half_up to whole cents
      # 4) Shared-custody offset (reads parenting_time_percentage, Rule 6 boundary >=):
      payor_time_pct = (payor is petitioner) ? plan.petitioner_time_pct : (1 - plan.petitioner_time_pct)
      if payor_time_pct >= schedule.shared_custody_threshold_pct:   # >= , NOT >
        obligation = round( obligation * (1 - payor_time_pct), 0 )  # offset reduces obligation
      monthly_amount_cents = max(0, obligation)
    input_set: "both parties on the case + all Child rows for the case + the matching GuidelineSchedule tier + the case ParentingPlan time fraction"
    constants: {}
    precision: "whole cents, round_half_up at each pinned step (base scale-up, proration, offset)"
    variants:
      - name: TEMPORARY
        when: "SupportOrder.variant == TEMPORARY (created during DISCOVERY/DEFAULT, before disclosures verified)"
        difference: "income inputs are the parties' DECLARED Party.gross_monthly_income_cents; parenting-time offset uses the plan's current overnights (often the proposed, un-adopted split)"
      - name: FINAL
        when: "SupportOrder.variant == FINAL (created/recomputed for the Final Judgment)"
        difference: "income inputs are the parties' VERIFIED FinancialDisclosure.net_monthly_income_cents (net, not gross); offset uses the ADOPTED plan's time fraction — same formula, materially different result"

  - name: spousal_support_guideline
    trigger: "SupportOrder creation where support_type=SPOUSAL"
    algorithm: threshold
    formula: |
      # Dual-variant on a DIFFERENT entity domain than child support (Rule 1:
      # spouse/marriage, not child). >=3 inputs would overlap mode (a); this is a
      # threshold formula keyed on marriage duration (Rule 6 boundary, different metric).
      gross_obligation = round( schedule.spousal_payor_pct * payor_income
                              - schedule.spousal_payee_offset_pct * payee_income, 0 )  # half_up
      monthly_amount_cents = max(0, gross_obligation)   # never negative
      # Term depends on marriage duration crossing long_marriage_months (>=):
      if case.marriage_months >= schedule.long_marriage_months:   # >= , NOT >
        support_term_months = 0          # 0 sentinel == INDEFINITE term
      else:
        support_term_months = floor(case.marriage_months / 2)     # half the marriage length
    input_set: "the two parties' incomes (per variant) + Case.marriage_months + the GuidelineSchedule"
    constants: {}
    precision: "whole cents, round_half_up; term in whole months (floor)"
    variants:
      - name: TEMPORARY
        when: "SupportOrder.variant == TEMPORARY"
        difference: "payor_income / payee_income are DECLARED gross Party.gross_monthly_income_cents"
      - name: FINAL
        when: "SupportOrder.variant == FINAL"
        difference: "payor_income / payee_income are VERIFIED FinancialDisclosure.net_monthly_income_cents — net figures shrink the spousal obligation versus the temporary gross-based figure"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed roles must match the owning party's user_id where ownership applies"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: existence
    check: "Every path id and FK in the body resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: business_constraint
    check: "Request body conforms to schema: required fields present, enums valid, numeric ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity references are in the required state for this operation. Specific referential errors fire here: ANSWER serve requires PETITION SERVED (ERR_PETITION_NOT_SERVED); MediationSession FULL_AGREEMENT requires the ParentingPlan AGREED (ERR_PLAN_NOT_AGREED); CourtOrder ENTER requires every referenced SupportOrder in CALCULATED status (ERR_SUPPORT_ORDER_NOT_CALCULATED) and, for FINAL_JUDGMENT, disclosures VERIFIED (ERR_DISCLOSURES_NOT_VERIFIED). NOTE: drafting a CourtOrder (POST /api/court-orders) only checks that referenced ids EXIST and belong to the same case; the CALCULATED-status requirement is enforced at ENTER time."
    error_id: ERR_REFERENCED_STATE_INVALID
    http_status: 409
    applies_to: "POST /api/pleadings/{id}/serve, POST /api/court-orders/{id}/enter, POST /api/mediation-sessions/{id}/conclude"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the Judge entering a FINAL_JUDGMENT must not be the case's mediator (X-User-ID != Case.mediator_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/court-orders/{id}/enter (FINAL_JUDGMENT)"

  - priority: 8
    category: business_temporal
    check: "A new MediationSession must not overlap an existing non-terminal session of the SAME mediator, where adjacency (gap == 0) is itself a conflict — a mandatory clearance buffer means [start,end] are treated as CLOSED intervals (touching endpoints collide)"
    error_id: ERR_MEDIATOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /api/mediation-sessions"

  - priority: 9
    category: business_temporal
    check: "A new Hearing must not overlap an existing SCHEDULED Hearing in the same courtroom_code; intervals are HALF-OPEN [start,end) so back-to-back hearings (one's end == next's start) are allowed"
    error_id: ERR_COURTROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /api/hearings"

  - priority: 10
    category: business_constraint
    check: "ParentingPlan overnights must satisfy petitioner_overnights + respondent_overnights == 365 (conserved quantity)"
    error_id: ERR_OVERNIGHTS_NOT_365
    http_status: 422
    applies_to: "POST /api/parenting-plans, POST /api/parenting-plans/{id}/revise"

  - priority: 11
    category: business_fiscal
    check: "FinancialDisclosure gross_monthly_income_cents must be >= sum of declared deductions (net cannot be negative)"
    error_id: ERR_NEGATIVE_NET_INCOME
    http_status: 422
    applies_to: "POST /api/financial-disclosures/{id}/submit"

  - priority: 4.1
    category: business_referential
    check: "Case-create requires a GuidelineSchedule whose state_code matches the requested case state_code; absent -> ERR_GUIDELINE_NOT_FOUND"
    error_id: ERR_GUIDELINE_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/cases"

  - priority: 4.2
    category: business_constraint
    check: "Mutations on a Case in a terminal status (JUDGMENT_ENTERED or DISMISSED), and creation of child resources under such a case, are rejected"
    error_id: ERR_CASE_TERMINAL
    http_status: 409
    applies_to: "POST /api/parties, POST /api/children, POST /api/pleadings, POST /api/financial-disclosures, POST /api/parenting-plans, POST /api/support-orders, POST /api/court-orders, POST /api/mediation-sessions, POST /api/hearings, POST /api/cases/{id}/advance, POST /api/cases/{id}/default, POST /api/cases/{id}/dismiss, POST /api/cases/{id}/assign-mediator"

  - priority: 4.3
    category: business_constraint
    check: "At most one PETITION pleading per case (ERR_DUPLICATE_PETITION); at most one Party per role per case (ERR_DUPLICATE_PARTY_ROLE); at most one ParentingPlan per case (ERR_DUPLICATE_PLAN)"
    error_id: ERR_DUPLICATE_PETITION
    http_status: 409
    applies_to: "POST /api/pleadings, POST /api/parties, POST /api/parenting-plans"

  - priority: 4.4
    category: business_constraint
    check: "Adding a second Party with a role (PETITIONER/RESPONDENT) already present on the case -> ERR_DUPLICATE_PARTY_ROLE; adding a second ParentingPlan -> ERR_DUPLICATE_PLAN"
    error_id: ERR_DUPLICATE_PARTY_ROLE
    http_status: 409
    applies_to: "POST /api/parties, POST /api/parenting-plans"

  - priority: 4.5
    category: business_constraint
    check: "A second ParentingPlan on a case is rejected"
    error_id: ERR_DUPLICATE_PLAN
    http_status: 409
    applies_to: "POST /api/parenting-plans"

  - priority: 4.6
    category: business_constraint
    check: "Request body schema for support/court order: support_type math must match the requested support_type (e.g. CHILD math only for CHILD orders) -> ERR_SUPPORT_TYPE_MISMATCH"
    error_id: ERR_SUPPORT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /api/support-orders"

  - priority: 5.1
    category: business_referential
    check: "Defaulting a case requires NO ANSWER pleading exists (ERR_ANSWER_EXISTS); a SPOUSAL/CHILD order naming a payee/payor requires the RESPONDENT party to exist (ERR_NO_RESPONDENT)"
    error_id: ERR_ANSWER_EXISTS
    http_status: 409
    applies_to: "POST /api/cases/{id}/default"

  - priority: 5.2
    category: business_referential
    check: "Creating a support order requires both PETITIONER and RESPONDENT parties on the case; missing respondent -> ERR_NO_RESPONDENT"
    error_id: ERR_NO_RESPONDENT
    http_status: 409
    applies_to: "POST /api/support-orders"

  - priority: 5.3
    category: business_referential
    check: "Mediation FULL_AGREEMENT->Case AWAITING_JUDGMENT requires the ParentingPlan ADOPTED; an attempt to reach AWAITING_JUDGMENT via mediation without an ADOPTED plan is blocked"
    error_id: ERR_PLAN_NOT_ADOPTED
    http_status: 409
    applies_to: "POST /api/mediation-sessions/{id}/conclude"

  - priority: 6.1
    category: business_referential
    check: "Creating a FINAL SupportOrder requires the relevant party's FinancialDisclosure to be VERIFIED; otherwise ERR_INCOME_NOT_AVAILABLE"
    error_id: ERR_INCOME_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /api/support-orders"

  - priority: 6.2
    category: auth
    check: "A party may only dispute/agree/revise a ParentingPlan version it did NOT propose (proposed_by_party_id != acting party); otherwise ERR_NOT_DISPUTING_PARTY"
    error_id: ERR_NOT_DISPUTING_PARTY
    http_status: 403
    applies_to: "POST /api/parenting-plans/{id}/dispute, POST /api/parenting-plans/{id}/agree, POST /api/parenting-plans/{id}/revise"

  - priority: 3.1
    category: business_constraint
    check: "List endpoints: limit must be in [1,100] and offset >= 0; otherwise ERR_PAGINATION_INVALID"
    error_id: ERR_PAGINATION_INVALID
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 12
    category: business_constraint
    check: "Optimistic concurrency: expected_case_version must equal Case.version on FINAL_JUDGMENT entry"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /api/court-orders/{id}/enter (FINAL_JUDGMENT)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Case -----
  - method: POST
    path: "/api/cases"
    description: "Open a new divorce case (status FILED)"
    roles: [Clerk]
    code: 201
    input: [state_code, caption, marriage_months, filing_fee_cents]
    output: Case
    side_effects: ["status=FILED, version=1, net_fees_collected_cents=filing_fee_cents, active_support_total_cents=0"]

  - method: GET
    path: "/api/cases/{id}"
    description: "Fetch a case incl. computed ledger + disclosure flags"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/api/cases"
    description: "List cases (paginated; filter by state_code/status)"
    roles: [Clerk, Judge]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/api/cases/{id}/default"
    description: "Move an unanswered case to DEFAULT_PENDING"
    roles: [Clerk]
    code: 200
    input: []
    output: Case
    side_effects: ["AWAITING_RESPONSE->DEFAULT_PENDING; version+1"]

  - method: POST
    path: "/api/cases/{id}/advance"
    description: "Clerk-driven status advance (CONTESTED->DISCOVERY, DEFAULT_PENDING->AWAITING_JUDGMENT)"
    roles: [Clerk]
    code: 200
    input: [to_status]
    output: Case
    side_effects: ["status per Case machine; version+1"]

  - method: POST
    path: "/api/cases/{id}/assign-mediator"
    description: "Assign a mediator and move DISCOVERY->MEDIATION"
    roles: [Clerk]
    code: 200
    input: [mediator_user_id]
    output: Case
    side_effects: ["mediator_user_id set; DISCOVERY->MEDIATION; version+1"]

  - method: POST
    path: "/api/cases/{id}/dismiss"
    description: "Dismiss a pre-judgment case (refunds fee, vacates support orders)"
    roles: [Clerk]
    code: 200
    input: []
    output: Case
    side_effects: ["status->DISMISSED; net_fees_collected_cents->0; all SupportOrder->VACATED; active_support_total_cents->0; version+1"]

  # ----- Party -----
  - method: POST
    path: "/api/parties"
    description: "Add a party (PETITIONER or RESPONDENT) to a case"
    roles: [Clerk]
    code: 201
    input: [case_id, role, user_id, full_name, gross_monthly_income_cents]
    output: Party
    side_effects: []

  - method: GET
    path: "/api/parties/{id}"
    description: "Fetch a party"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: Party
    side_effects: []

  - method: GET
    path: "/api/parties"
    description: "List parties (filter by case_id) — FK reverse-reachability for Party.case_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: Party[]
    side_effects: []

  # ----- Child -----
  - method: POST
    path: "/api/children"
    description: "Add a subject child to a case"
    roles: [Clerk]
    code: 201
    input: [case_id, full_name, birth_year]
    output: Child
    side_effects: []

  - method: GET
    path: "/api/children/{id}"
    description: "Fetch a child"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: Child
    side_effects: []

  - method: GET
    path: "/api/children"
    description: "List children (filter by case_id) — FK reverse-reachability for Child.case_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: Child[]
    side_effects: []

  # ----- Pleading -----
  - method: POST
    path: "/api/pleadings"
    description: "File a PETITION or ANSWER (status DRAFT)"
    roles: [Clerk, Petitioner, Respondent]
    code: 201
    input: [case_id, pleading_type, filed_by_party_id]
    output: Pleading
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/pleadings/{id}"
    description: "Fetch a pleading"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: Pleading
    side_effects: []

  - method: GET
    path: "/api/pleadings"
    description: "List pleadings (filter by case_id and/or filed_by_party_id) — FK reverse-reachability for Pleading.case_id and Pleading.filed_by_party_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["case_id?", "filed_by_party_id?", "limit?", "offset?"]
    output: Pleading[]
    side_effects: []

  - method: POST
    path: "/api/pleadings/{id}/serve"
    description: "Serve a pleading (DRAFT->SERVED); drives Case status"
    roles: [Clerk]
    code: 200
    input: []
    output: Pleading
    side_effects: ["served_at set; PETITION serve: Case FILED->AWAITING_RESPONSE; ANSWER serve: Case AWAITING_RESPONSE->CONTESTED and PETITION->ANSWERED; version+1 on the case"]

  # ----- FinancialDisclosure -----
  - method: POST
    path: "/api/financial-disclosures"
    description: "Create a financial disclosure for a party (status DRAFT)"
    roles: [Clerk, Petitioner, Respondent]
    code: 201
    input: [party_id, case_id, gross_monthly_income_cents, tax_withholding_cents, mandatory_retirement_cents, health_insurance_cents]
    output: FinancialDisclosure
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/financial-disclosures/{id}"
    description: "Fetch a financial disclosure"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: FinancialDisclosure
    side_effects: []

  - method: GET
    path: "/api/financial-disclosures"
    description: "List disclosures (filter by party_id and/or case_id) — FK reverse-reachability for FinancialDisclosure.party_id and .case_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["party_id?", "case_id?", "limit?", "offset?"]
    output: FinancialDisclosure[]
    side_effects: []

  - method: POST
    path: "/api/financial-disclosures/{id}/submit"
    description: "Submit/resubmit a disclosure (DRAFT|RETURNED -> SUBMITTED); computes net income"
    roles: [Petitioner, Respondent]
    code: 200
    input: []
    output: FinancialDisclosure
    side_effects: ["net_monthly_income_cents computed; status->SUBMITTED"]

  - method: POST
    path: "/api/financial-disclosures/{id}/verify"
    description: "Verify a submitted disclosure (SUBMITTED->VERIFIED)"
    roles: [Clerk]
    code: 200
    input: []
    output: FinancialDisclosure
    side_effects: ["status->VERIFIED; recompute Case disclosure flags"]

  - method: POST
    path: "/api/financial-disclosures/{id}/return"
    description: "Return a submitted disclosure for correction (SUBMITTED->RETURNED)"
    roles: [Clerk]
    code: 200
    input: []
    output: FinancialDisclosure
    side_effects: ["status->RETURNED"]

  # ----- ParentingPlan -----
  - method: POST
    path: "/api/parenting-plans"
    description: "Propose a parenting plan for a case (status PROPOSED)"
    roles: [Petitioner, Respondent]
    code: 201
    input: [case_id, proposed_by_party_id, petitioner_overnights, respondent_overnights]
    output: ParentingPlan
    side_effects: ["status=PROPOSED; petitioner_time_pct computed"]

  - method: GET
    path: "/api/parenting-plans/{id}"
    description: "Fetch a parenting plan"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: ParentingPlan
    side_effects: []

  - method: GET
    path: "/api/parenting-plans"
    description: "List parenting plans (filter by case_id and/or proposed_by_party_id) — FK reverse-reachability for ParentingPlan.case_id and .proposed_by_party_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["case_id?", "proposed_by_party_id?", "limit?", "offset?"]
    output: ParentingPlan[]
    side_effects: []

  - method: POST
    path: "/api/parenting-plans/{id}/dispute"
    description: "Dispute the current plan version (PROPOSED|REVISED -> DISPUTED)"
    roles: [Petitioner, Respondent]
    code: 200
    input: []
    output: ParentingPlan
    side_effects: ["status->DISPUTED"]

  - method: POST
    path: "/api/parenting-plans/{id}/revise"
    description: "Revise overnights (DISPUTED->REVISED)"
    roles: [Petitioner, Respondent]
    code: 200
    input: [petitioner_overnights, respondent_overnights]
    output: ParentingPlan
    side_effects: ["overnights updated; proposed_by_party_id := actor; time_pct recomputed; status->REVISED"]

  - method: POST
    path: "/api/parenting-plans/{id}/agree"
    description: "Agree to the current plan version (PROPOSED|REVISED -> AGREED)"
    roles: [Petitioner, Respondent]
    code: 200
    input: []
    output: ParentingPlan
    side_effects: ["status->AGREED"]

  # ----- MediationSession -----
  - method: POST
    path: "/api/mediation-sessions"
    description: "Schedule a mediation session (status SCHEDULED); rejects mediator double-booking (closed intervals)"
    roles: [Clerk, Mediator]
    code: 201
    input: [case_id, mediator_user_id, scheduled_start, scheduled_end]
    output: MediationSession
    side_effects: ["status=SCHEDULED; round_no assigned"]

  - method: GET
    path: "/api/mediation-sessions/{id}"
    description: "Fetch a mediation session"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: MediationSession
    side_effects: []

  - method: GET
    path: "/api/mediation-sessions"
    description: "List mediation sessions (filter by case_id) — FK reverse-reachability for MediationSession.case_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: MediationSession[]
    side_effects: []

  - method: POST
    path: "/api/mediation-sessions/{id}/start"
    description: "Start/reopen a session (SCHEDULED|PARTIAL_AGREEMENT -> IN_SESSION)"
    roles: [Mediator]
    code: 200
    input: []
    output: MediationSession
    side_effects: ["status->IN_SESSION"]

  - method: POST
    path: "/api/mediation-sessions/{id}/conclude"
    description: "Conclude a session with an outcome; FULL_AGREEMENT triggers the 3-hop cascade"
    roles: [Mediator]
    code: 200
    input: [outcome]
    output: MediationSession
    side_effects: ["IN_SESSION->{PARTIAL_AGREEMENT|FULL_AGREEMENT|IMPASSE}; FULL_AGREEMENT: ParentingPlan AGREED->ADOPTED, FINAL CHILD SupportOrder recomputed, Case MEDIATION->AWAITING_JUDGMENT (version+1)"]

  # ----- SupportOrder -----
  - method: POST
    path: "/api/support-orders"
    description: "Create a support order; amount computed server-side (never client-supplied), status CALCULATED"
    roles: [Clerk]
    code: 201
    input: [case_id, support_type, payor_party_id, payee_party_id, variant]
    output: SupportOrder
    side_effects: ["monthly_amount_cents + support_term_months computed per guideline; status=CALCULATED"]

  - method: GET
    path: "/api/support-orders/{id}"
    description: "Fetch a support order"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: SupportOrder
    side_effects: []

  - method: GET
    path: "/api/support-orders"
    description: "List support orders (filter by case_id, payor_party_id, payee_party_id) — FK reverse-reachability for SupportOrder.case_id/.payor_party_id/.payee_party_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["case_id?", "payor_party_id?", "payee_party_id?", "limit?", "offset?"]
    output: SupportOrder[]
    side_effects: []

  # ----- CourtOrder -----
  - method: POST
    path: "/api/court-orders"
    description: "Draft a TEMPORARY order or FINAL_JUDGMENT (status DRAFT)"
    roles: [Clerk, Judge]
    code: 201
    input: [case_id, order_kind, support_order_ids, "parenting_plan_id?", "supersedes_order_id?"]
    output: CourtOrder
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/court-orders/{id}"
    description: "Fetch a court order"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: CourtOrder
    side_effects: []

  - method: GET
    path: "/api/court-orders"
    description: "List court orders (filter by case_id and/or supersedes_order_id) — FK reverse-reachability for CourtOrder.case_id, .parenting_plan_id, .supersedes_order_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["case_id?", "parenting_plan_id?", "supersedes_order_id?", "limit?", "offset?"]
    output: CourtOrder[]
    side_effects: []

  - method: POST
    path: "/api/court-orders/{id}/enter"
    description: "Enter an order (DRAFT->ENTERED); FINAL_JUDGMENT supersedes the temporary order and enters judgment"
    roles: [Judge]
    code: 200
    input: ["expected_case_version?"]
    output: CourtOrder
    side_effects: ["entered_at set; referenced SupportOrder->ACTIVE; Case.active_support_total_cents recomputed; FINAL_JUDGMENT: supersede TEMPORARY (->SUPERSEDED, its non-shared SupportOrder->VACATED), Case->JUDGMENT_ENTERED, judge_user_id set, version+1"]

  # ----- Hearing -----
  - method: POST
    path: "/api/hearings"
    description: "Schedule a hearing (status SCHEDULED); rejects courtroom overlap (half-open intervals)"
    roles: [Clerk]
    code: 201
    input: [case_id, courtroom_code, scheduled_start, scheduled_end]
    output: Hearing
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/api/hearings/{id}"
    description: "Fetch a hearing"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: GET
    path: "/api/hearings"
    description: "List hearings (filter by case_id) — FK reverse-reachability for Hearing.case_id"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []

  - method: POST
    path: "/api/hearings/{id}/hold"
    description: "Mark a hearing held (SCHEDULED->HELD)"
    roles: [Judge]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status->HELD"]

  - method: POST
    path: "/api/hearings/{id}/cancel"
    description: "Cancel a hearing (SCHEDULED->CANCELLED)"
    roles: [Clerk]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status->CANCELLED"]

  # ----- GuidelineSchedule (configuration) -----
  - method: POST
    path: "/api/guideline-schedules"
    description: "Register a state's support guideline schedule (immutable config)"
    roles: [Clerk]
    code: 201
    input: ["state_code", "basic_obligation_tiers", "spousal_payor_pct?", "spousal_payee_offset_pct?", "shared_custody_threshold_pct?", "long_marriage_months?"]
    output: GuidelineSchedule
    side_effects: []

  - method: GET
    path: "/api/guideline-schedules/{id}"
    description: "Fetch a guideline schedule"
    roles: [Clerk, Judge, Mediator, Petitioner, Respondent]
    code: 200
    input: []
    output: GuidelineSchedule
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation, or entity_backed role does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK body field references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a state from which the requested transition is defined" }
  - { id: ERR_REFERENCED_STATE_INVALID, http: 409, condition: "A cross-entity reference is in the wrong state for this operation (generic referential-state failure)" }
  - { id: ERR_PETITION_NOT_SERVED, http: 409, condition: "Cannot serve an ANSWER before the case PETITION is SERVED" }
  - { id: ERR_DISCLOSURES_NOT_VERIFIED, http: 409, condition: "FINAL_JUDGMENT requires both parties' FinancialDisclosure VERIFIED (or petitioner verified on the default path)" }
  - { id: ERR_SUPPORT_ORDER_NOT_CALCULATED, http: 409, condition: "A CourtOrder references a SupportOrder that is not in CALCULATED status" }
  - { id: ERR_PLAN_NOT_AGREED, http: 409, condition: "MediationSession cannot conclude FULL_AGREEMENT unless the case ParentingPlan is AGREED" }
  - { id: ERR_PLAN_NOT_ADOPTED, http: 409, condition: "Case cannot reach AWAITING_JUDGMENT via mediation unless the ParentingPlan is ADOPTED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Judge entering FINAL_JUDGMENT is the same operator who mediated the case" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match current Case.version on FINAL_JUDGMENT entry" }
  - { id: ERR_MEDIATOR_DOUBLE_BOOKED, http: 409, condition: "New mediation session collides with an existing non-terminal session of the same mediator (closed-interval/adjacent conflict)" }
  - { id: ERR_COURTROOM_DOUBLE_BOOKED, http: 409, condition: "New hearing overlaps an existing SCHEDULED hearing in the same courtroom (half-open intervals)" }
  - { id: ERR_OVERNIGHTS_NOT_365, http: 422, condition: "petitioner_overnights + respondent_overnights != 365" }
  - { id: ERR_NEGATIVE_NET_INCOME, http: 422, condition: "Disclosure deductions exceed gross income (net would be negative)" }
  - { id: ERR_DUPLICATE_PETITION, http: 409, condition: "A PETITION already exists for the case" }
  - { id: ERR_DUPLICATE_PARTY_ROLE, http: 409, condition: "A party with the same role (PETITIONER/RESPONDENT) already exists on the case" }
  - { id: ERR_DUPLICATE_PLAN, http: 409, condition: "A ParentingPlan already exists for the case" }
  - { id: ERR_NO_RESPONDENT, http: 409, condition: "Operation requires a RESPONDENT party that does not exist on the case" }
  - { id: ERR_ANSWER_EXISTS, http: 409, condition: "Cannot default a case for which an ANSWER pleading exists" }
  - { id: ERR_GUIDELINE_NOT_FOUND, http: 404, condition: "No GuidelineSchedule exists for the case's state_code" }
  - { id: ERR_INCOME_NOT_AVAILABLE, http: 409, condition: "FINAL support requested but a party's FinancialDisclosure is not VERIFIED" }
  - { id: ERR_NOT_DISPUTING_PARTY, http: 403, condition: "Acting party may not dispute/agree/revise a version it proposed (must be the other party)" }
  - { id: ERR_SUPPORT_TYPE_MISMATCH, http: 422, condition: "Support computation invoked for the wrong support_type (e.g., child math for SPOUSAL)" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit/offset out of allowed range" }
  - { id: ERR_CASE_TERMINAL, http: 409, condition: "Mutation attempted on a case in a terminal status (JUDGMENT_ENTERED or DISMISSED)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Clerk
    description: "Court clerk: dockets filings, serves pleadings, drives administrative case status, verifies disclosures, schedules hearings, registers guideline schedules, drafts orders, creates support computations."
    identity: opaque
    exclusive_operations:
      - "POST /api/cases — open a case"
      - "POST /api/cases/{id}/default — move to DEFAULT_PENDING"
      - "POST /api/cases/{id}/advance — administrative status advance"
      - "POST /api/cases/{id}/assign-mediator — assign mediator, enter MEDIATION"
      - "POST /api/cases/{id}/dismiss — dismiss case"
      - "POST /api/parties — add a party"
      - "POST /api/children — add a child"
      - "POST /api/pleadings/{id}/serve — serve a pleading"
      - "POST /api/financial-disclosures/{id}/verify — verify a disclosure"
      - "POST /api/financial-disclosures/{id}/return — return a disclosure"
      - "POST /api/support-orders — create a support computation"
      - "POST /api/hearings — schedule a hearing"
      - "POST /api/hearings/{id}/cancel — cancel a hearing"
      - "POST /api/guideline-schedules — register guideline schedule"
    shared_operations:
      - "POST /api/pleadings — file pleading (with Petitioner/Respondent)"
      - "POST /api/financial-disclosures — create disclosure (with Petitioner/Respondent)"
      - "POST /api/mediation-sessions — schedule mediation session (with Mediator)"
      - "POST /api/court-orders — draft an order (with Judge)"
      - "GET endpoints — shared read access"

  - name: Judge
    description: "Judicial officer who enters orders and judgments and presides over hearings. May not have mediated the same case (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /api/court-orders/{id}/enter — enter an order / final judgment"
      - "POST /api/hearings/{id}/hold — mark a hearing held"
    shared_operations:
      - "POST /api/court-orders — draft an order (with Clerk)"
      - "GET endpoints — shared read access"

  - name: Mediator
    description: "Neutral mediator running settlement sessions. Bound to a case via Case.mediator_user_id. Cannot enter judgments (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /api/mediation-sessions/{id}/start — start/reopen a session"
      - "POST /api/mediation-sessions/{id}/conclude — conclude a session"
    shared_operations:
      - "POST /api/mediation-sessions — schedule a session (with Clerk)"
      - "GET endpoints — shared read access"

  - name: Petitioner
    description: "The spouse who filed the case. Acts only on resources bound to its own Party (X-User-ID == Party.user_id, Party.role == PETITIONER)."
    identity: entity_backed:Party
    exclusive_operations: []
    shared_operations:
      - "POST /api/pleadings — file own pleading (with Clerk/Respondent)"
      - "POST /api/financial-disclosures — create own disclosure"
      - "POST /api/financial-disclosures/{id}/submit — submit own disclosure"
      - "POST /api/parenting-plans — propose a plan"
      - "POST /api/parenting-plans/{id}/dispute — dispute the other party's version"
      - "POST /api/parenting-plans/{id}/revise — revise a disputed plan"
      - "POST /api/parenting-plans/{id}/agree — agree to the other party's version"
      - "GET endpoints — shared read access"

  - name: Respondent
    description: "The non-filing spouse. Acts only on resources bound to its own Party (X-User-ID == Party.user_id, Party.role == RESPONDENT)."
    identity: entity_backed:Party
    exclusive_operations: []
    shared_operations:
      - "POST /api/pleadings — file own pleading (with Clerk/Petitioner)"
      - "POST /api/financial-disclosures — create own disclosure"
      - "POST /api/financial-disclosures/{id}/submit — submit own disclosure"
      - "POST /api/parenting-plans — propose a plan"
      - "POST /api/parenting-plans/{id}/dispute — dispute the other party's version"
      - "POST /api/parenting-plans/{id}/revise — revise a disputed plan"
      - "POST /api/parenting-plans/{id}/agree — agree to the other party's version"
      - "GET endpoints — shared read access"
