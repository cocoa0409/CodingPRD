# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1860: Insurance Producer Licensing & Appointment Management
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Logical clock default: 2026-08-01T00:00:00Z. Role shorthand:
#   LC = LicensingCoordinator, CO = ComplianceOfficer, FO = FinanceOps,
#   CA = CarrierAdmin (full role names used in `as:` per §1.7).
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: producer_creation_required_fields_and_defaults
        claim_type: creation
        grounds: [entities.Producer]
        distinguishing_aspect: "POST /api/producers with only required fields returns 201 with system defaults: status ACTIVE, ytd_issued_premium_cents 0, commission_held_cents 0, agency_id null, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3001", full_name: "Default Check", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id, st: $.data.status, ytd: $.data.ytd_issued_premium_cents, held: $.data.commission_held_cents, ag: $.data.agency_id, v: $.data.version }
          assert:
            - "st == ACTIVE and v == 1"
            - "ytd == 0 and held == 0 and ag == null"
            - "Producer.${p}.created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: producer_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Producer.fields.npn, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field npn yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/producers"
              payload: { full_name: "No Npn", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: producer_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Producer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/producers/00000000-0000-4000-8000-000000000000"
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: license_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.License.fields.lines_of_authority, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A lines_of_authority member outside the declared enum yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["producer exists"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3002", full_name: "Enum Check", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
          trigger:
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["VOID_MAGIC"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: producer_list_pagination_and_filter
        claim_type: listing
        grounds: [entities.Producer, response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more per the fixed envelope; status filter narrows the result set."
        test_recipe:
          setup: ["three ACTIVE producers exist"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3003", full_name: "P1", resident_state_code: "CA" }
              as: LicensingCoordinator
            - call: "POST /api/producers"
              payload: { npn: "NPN-3004", full_name: "P2", resident_state_code: "CA" }
              as: LicensingCoordinator
            - call: "POST /api/producers"
              payload: { npn: "NPN-3005", full_name: "P3", resident_state_code: "CA" }
              as: LicensingCoordinator
          trigger:
            - call: "GET /api/producers"
              payload: { status: "ACTIVE", limit: 2, offset: 0 }
              as: LicensingCoordinator
            - call: "GET /api/producers"
              payload: { status: "ACTIVE", limit: 2, offset: 2 }
              as: LicensingCoordinator
          assert:
            - "First page: 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: 1 item, total_count == 3, has_more == false, offset == 2"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: ce_credit_accept_recomputes_license_counters
        claim_type: side_effect_execution
        grounds: [state_machines.CECredit.REPORTED_to_ACCEPTED, entities.License.fields.ce_completed_hours]
        distinguishing_aspect: "Accepting a REPORTED credit immediately recomputes the parent license's CE counters and bumps License.version (initial state REPORTED verified on creation)."
        test_recipe:
          setup: ["producer with CA RESIDENT LIFE license (defaults 24/3), version 1"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3006", full_name: "CE Counter", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/ce-credits"
              payload: { license_id: "${lic}", provider_name: "CEU", course_title: "Gen 10", category: "GENERAL", credit_hours: 10, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { cr: $.data.id, cr_st: $.data.status }
          trigger:
            - call: "POST /api/ce-credits/${cr}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
              captures: { cr_st2: $.data.status, cr_rev: $.data.reviewed_by_user_id }
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { lic_hours: $.data.ce_completed_hours, lic_eth: $.data.ce_ethics_completed_hours, lic_v: $.data.version }
          assert:
            - "cr_st == REPORTED at creation (initial state)"
            - "cr_st2 == ACCEPTED"
            - "lic_hours == 10 and lic_eth == 0 (GENERAL credit moves only the total under SPILLOVER display rules)"
            - "lic_v == 2 (side effect increments License.version)"

      - name: ce_credit_double_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CECredit, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reviewing an already-ACCEPTED credit (terminal) fails with ERR_INVALID_STATE; counters do not change."
        test_recipe:
          setup: ["producer with license; one credit already ACCEPTED (10 GENERAL)"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3007", full_name: "Double Review", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/ce-credits"
              payload: { license_id: "${lic}", provider_name: "CEU", course_title: "Gen 10", category: "GENERAL", credit_hours: 10, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { cr: $.data.id }
            - call: "POST /api/ce-credits/${cr}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
          trigger:
            - call: "POST /api/ce-credits/${cr}/review"
              payload: { decision: "REJECT" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /api/ce-credits/${cr}"
              as: LicensingCoordinator
              captures: { cr_st: $.data.status }
          assert:
            - "err == ERR_INVALID_STATE"
            - "cr_st == ACCEPTED (terminal state unchanged)"

      - name: inquiry_close_before_response_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RegulatoryInquiry, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSE from OPEN (no response submitted) is not a declared transition and fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["producer; OPEN inquiry against him"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3008", full_name: "Early Close", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/inquiries"
              payload: { producer_id: "${p}", state_code: "TX", reference_number: "INQ-3008" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { inq: $.data.id }
          trigger:
            - call: "POST /api/inquiries/${inq}/close"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "RegulatoryInquiry.${inq}.status == OPEN"

      - name: license_reinstate_from_revoked_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.License, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal: reinstate on a REVOKED license fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["producer with CA license REVOKED via confirmed REVOCATION action"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3009", full_name: "Revoked", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p}", state_code: "CA", action_type: "REVOCATION", effective_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra: $.data.id }
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
          trigger:
            - call: "POST /api/licenses/${lic}/reinstate"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "License.${lic}.status == REVOKED"

      - name: rescind_termination_requires_license_active_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Appointment.TERMINATION_PENDING_to_ACTIVE, "validations[priority=9]"]
        distinguishing_aspect: "Guarded transition: rescinding a termination while the subject license is SUSPENDED fails with ERR_LICENSE_NOT_ACTIVE; after license reinstate the same rescind succeeds."
        test_recipe:
          setup: ["producer with CA license + ACTIVE appointment; confirmed SUSPENSION action has cascaded license -> SUSPENDED and appointment -> TERMINATION_PENDING (LICENSE_INACTIVE)"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3010", full_name: "Rescind Guard", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/appointments"
              payload: { producer_id: "${p}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p}", state_code: "CA", action_type: "SUSPENSION", effective_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra: $.data.id }
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
          trigger:
            - call: "POST /api/appointments/${appt}/rescind-termination"
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/licenses/${lic}/reinstate"
              as: ComplianceOfficer
            - call: "POST /api/appointments/${appt}/rescind-termination"
              as: LicensingCoordinator
              captures: { st: $.data.status }
          assert:
            - "err == ERR_LICENSE_NOT_ACTIVE while the license is SUSPENDED"
            - "After reinstate: st == ACTIVE"

      - name: producer_reinstate_blocked_while_inquiry_overdue_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Producer.SUSPENDED_to_ACTIVE, "validations[priority=22]"]
        distinguishing_aspect: "Guarded transition: reinstate fails with ERR_OVERDUE_INQUIRY_EXISTS while an inquiry is OVERDUE; a late response (OVERDUE -> RESPONSE_SUBMITTED) clears the block and reinstate succeeds."
        test_recipe:
          setup: ["producer SUSPENDED via inquiry-overdue cascade (inquiry received 2026-08-01, clock swept to 2026-09-01)"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3011", full_name: "Reinstate Guard", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/inquiries"
              payload: { producer_id: "${p}", state_code: "TX", reference_number: "INQ-3011" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { inq: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "POST /api/producers/${p}/reinstate"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "GET /api/inquiries/${inq}"
              as: ComplianceOfficer
              captures: { inq_v: $.data.version, inq_st: $.data.status }
            - call: "POST /api/inquiries/${inq}/response"
              payload: { response_text: "late response", expected_inquiry_version: "${inq_v}" }
              as: ComplianceOfficer
              captures: { inq_st2: $.data.status }
            - call: "POST /api/producers/${p}/reinstate"
              as: ComplianceOfficer
              captures: { p_st: $.data.status }
          assert:
            - "err == ERR_OVERDUE_INQUIRY_EXISTS and inq_st == OVERDUE"
            - "Late response allowed from OVERDUE: inq_st2 == RESPONSE_SUBMITTED"
            - "p_st == ACTIVE after the block clears"

      - name: commission_pay_from_held_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.CommissionEntry.PAYABLE_to_PAID, "errors[ERR_COMMISSION_NOT_PAYABLE]"]
        distinguishing_aspect: "Pay on a HELD entry fails with the domain error ERR_COMMISSION_NOT_PAYABLE (not generic ERR_INVALID_STATE)."
        test_recipe:
          setup: ["producer with CA license (no appointment); application submitted -> entry HELD with APPOINTMENT_PENDING"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3012", full_name: "Held Pay", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "HP", premium_cents: 1000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e: "$.data[0].id", e_st: "$.data[0].status" }
          trigger:
            - call: "POST /api/commission-entries/${e}/pay"
              as: FinanceOps
              captures: { err: $.data.error_id }
          assert:
            - "e_st == HELD before the trigger"
            - "err == ERR_COMMISSION_NOT_PAYABLE (http 409)"

      - name: inquiry_response_close_happy_path
        claim_type: valid_transition
        grounds: [state_machines.RegulatoryInquiry.OPEN_to_RESPONSE_SUBMITTED, state_machines.RegulatoryInquiry.RESPONSE_SUBMITTED_to_CLOSED]
        distinguishing_aspect: "OPEN -> RESPONSE_SUBMITTED -> CLOSED happy path stamps responded_at from the logical clock and computes response_due_at = received_at + 30 days."
        test_recipe:
          setup: ["producer; OPEN inquiry received at default clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3013", full_name: "Happy Path", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/inquiries"
              payload: { producer_id: "${p}", state_code: "TX", reference_number: "INQ-3013" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { inq: $.data.id, inq_v: $.data.version, due: $.data.response_due_at, recv: $.data.received_at }
          trigger:
            - call: "POST /api/inquiries/${inq}/response"
              payload: { response_text: "acknowledged", expected_inquiry_version: "${inq_v}" }
              as: ComplianceOfficer
              captures: { st1: $.data.status, responded: $.data.responded_at }
            - call: "POST /api/inquiries/${inq}/close"
              as: ComplianceOfficer
              captures: { st2: $.data.status }
          assert:
            - "recv == 2026-08-01T00:00:00Z and due == 2026-08-31T00:00:00Z"
            - "st1 == RESPONSE_SUBMITTED and responded == 2026-08-01T00:00:00Z"
            - "st2 == CLOSED"

      - name: decline_forfeits_commission_entry
        claim_type: side_effect_execution
        grounds: [state_machines.PolicyApplication.SUBMITTED_to_DECLINED, state_machines.CommissionEntry]
        distinguishing_aspect: "Declining a SUBMITTED application forfeits its commission entry regardless of the entry's prior bucket."
        test_recipe:
          setup: ["producer with license + ACTIVE appointment; one SUBMITTED application with PAYABLE entry"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3014", full_name: "Declined", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "D", premium_cents: 1000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
          trigger:
            - call: "POST /api/applications/${app}/decide"
              payload: { decision: "DECLINE" }
              as: LicensingCoordinator
              captures: { app_st: $.data.status }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e_st: "$.data[0].status" }
          assert:
            - "app_st == DECLINED"
            - "e_st == FORFEITED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: ce_input_set_excludes_reported_and_out_of_period
        claim_type: input_set_filtering
        grounds: [calculations.ce_compliance_determination]
        distinguishing_aspect: "Only ACCEPTED credits with completed_on inside [ce_period_start, ce_period_end] count: a REPORTED credit and an ACCEPTED out-of-period credit are both excluded, so renewal fails despite 29 raw hours."
        test_recipe:
          setup:
            - "producer with CA RESIDENT LIFE license (24/3), period [2026-01-01, 2028-01-01]"
            - "credits: 20 GENERAL ACCEPTED in-period; 4 GENERAL ACCEPTED but completed 2025-12-15 (before period); 5 ETHICS left REPORTED"
            - "clock at 2027-12-01 (inside renewal window)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3015", full_name: "Input Set", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic: $.data.id }
            - call: "POST /api/ce-credits"
              payload: { license_id: "${lic}", provider_name: "CEU", course_title: "In", category: "GENERAL", credit_hours: 20, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { c_in: $.data.id }
            - call: "POST /api/ce-credits/${c_in}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
            - call: "POST /api/ce-credits"
              payload: { license_id: "${lic}", provider_name: "CEU", course_title: "Early", category: "GENERAL", credit_hours: 4, completed_on: "2025-12-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { c_early: $.data.id }
            - call: "POST /api/ce-credits/${c_early}/review"
              payload: { decision: "ACCEPT" }
              as: LicensingCoordinator
            - call: "POST /api/ce-credits"
              payload: { license_id: "${lic}", provider_name: "CEU", course_title: "Pending", category: "ETHICS", credit_hours: 5, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/licenses/${lic}"
              as: LicensingCoordinator
              captures: { lic_v: $.data.version, tot: $.data.ce_completed_hours, eth: $.data.ce_ethics_completed_hours }
          trigger:
            - call: "POST /api/licenses/${lic}/renew"
              payload: { expected_license_version: "${lic_v}" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "tot == 20 and eth == 0 (out-of-period and REPORTED credits excluded)"
            - "err == ERR_CE_INCOMPLETE"

      - name: commission_loa_rate_selection_and_floor
        claim_type: correct_result
        grounds: [calculations.commission_amount_cents]
        distinguishing_aspect: "LOA base-rate selection is honored (LIFE 0.10 vs CASUALTY 0.12) and the single terminal floor truncates sub-cent remainders: floor(999*0.10)=99 and floor(999*0.12)=119."
        test_recipe:
          setup: ["producer with CA license [LIFE, CASUALTY] and ACTIVE appointment covering both; two applications of premium 999 each, one per LOA"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3016", full_name: "Rate Check", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE", "CASUALTY"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p}", state_code: "CA", lines_of_authority: ["LIFE", "CASUALTY"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "L", premium_cents: 999 }
              as: LicensingCoordinator
              captures: { app_l: $.data.id }
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "CASUALTY", applicant_name: "C", premium_cents: 999 }
              as: LicensingCoordinator
              captures: { app_c: $.data.id }
          trigger:
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app_l}" }
              as: LicensingCoordinator
              captures: { amt_l: "$.data[0].amount_cents" }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app_c}" }
              as: LicensingCoordinator
              captures: { amt_c: "$.data[0].amount_cents" }
          assert:
            - "amt_l == 99 (floor(999 * 0.10))"
            - "amt_c == 119 (floor(999 * 0.12))"

      - name: ytd_calendar_year_window_excludes_prior_year
        claim_type: input_set_filtering
        grounds: [calculations.producer_ytd_issued_premium]
        distinguishing_aspect: "The YTD window is the logical clock's calendar year [Jan 1, next Jan 1): crossing into 2027 drops the 2026 ISSUED premium from the aggregate."
        test_recipe:
          setup: ["producer with license + ACTIVE appointment; one application ISSUED at 2026-08-01 with premium 5000000"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3017", full_name: "Year Window", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "LIFE", applicant_name: "Y", premium_cents: 5000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id }
            - call: "POST /api/applications/${app}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app}/issue"
              as: LicensingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/producers/${p}"
              as: LicensingCoordinator
              captures: { ytd_2026: $.data.ytd_issued_premium_cents }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/producers/${p}"
              as: LicensingCoordinator
              captures: { ytd_2027: $.data.ytd_issued_premium_cents }
          assert:
            - "ytd_2026 == 5000000 (2026 issue inside the 2026 window)"
            - "ytd_2027 == 0 (window [2027-01-01, 2028-01-01) excludes the 2026 issue)"

      - name: commission_tier_threshold_inclusive_at_exact_1m
        claim_type: constants_applied
        grounds: [calculations.commission_amount_cents]
        distinguishing_aspect: "Volume tier boundary is inclusive: ytd exactly 100000000 cents selects multiplier 1.10 (>= TIER2_THRESHOLD_CENTS), giving floor(10000000 * 0.12 * 1.10) = 1320000."
        test_recipe:
          setup: ["producer with CA PROPERTY license + ACTIVE appointment; app0 (premium 100000000) already ISSUED -> ytd exactly 100000000"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3018", full_name: "Tier Edge", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["PROPERTY"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${p}", state_code: "CA", lines_of_authority: ["PROPERTY"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt: $.data.id }
            - call: "POST /api/appointments/${appt}/file"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "Big", premium_cents: 100000000 }
              as: LicensingCoordinator
              captures: { app0: $.data.id }
            - call: "POST /api/applications/${app0}/decide"
              payload: { decision: "APPROVE" }
              as: LicensingCoordinator
            - call: "POST /api/applications/${app0}/issue"
              as: LicensingCoordinator
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "CA", line_of_authority: "PROPERTY", applicant_name: "Next", premium_cents: 10000000 }
              as: LicensingCoordinator
              captures: { app1: $.data.id }
          trigger:
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app1}" }
              as: LicensingCoordinator
              captures: { amt1: "$.data[0].amount_cents" }
          assert:
            - "amt1 == 1320000 (provisional at submission already sees ytd == 100000000 >= threshold -> 1.10)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: license_subject_conflict_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_LICENSE_SUBJECT_CONFLICT]"]
        distinguishing_aspect: "Setting both producer_id and agency_id on a license yields 422 ERR_LICENSE_SUBJECT_CONFLICT."
        test_recipe:
          setup: ["an agency and a producer exist"]
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Subj Agency", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { ag: $.data.id }
            - call: "POST /api/producers"
              payload: { npn: "NPN-3019", full_name: "Subj Producer", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
          trigger:
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", agency_id: "${ag}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LICENSE_SUBJECT_CONFLICT (http 422)"

      - name: duplicate_license_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_LICENSE]"]
        distinguishing_aspect: "A second non-terminal license for the same (subject, state) fails; after the first is REVOKED (terminal) a fresh license succeeds."
        test_recipe:
          setup: ["producer with an ACTIVE CA license; then that license REVOKED via confirmed action"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3020", full_name: "Dup License", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic1: $.data.id }
          trigger:
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-02-01T00:00:00Z", expiration_date: "2028-02-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/regulatory-actions"
              payload: { producer_id: "${p}", state_code: "CA", action_type: "REVOCATION", effective_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ra: $.data.id }
            - call: "POST /api/regulatory-actions/${ra}/confirm"
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-02-01T00:00:00Z", expiration_date: "2028-02-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { lic2: $.data.id, lic2_st: $.data.status }
          assert:
            - "err == ERR_DUPLICATE_LICENSE while ${lic1} is non-terminal"
            - "After revocation: creation succeeds, lic2_st == ACTIVE"

      - name: appointment_already_active_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_APPOINTMENT_ALREADY_ACTIVE]"]
        distinguishing_aspect: "A second non-terminal appointment for the same (subject, state) fails even while the first is only REQUESTED."
        test_recipe:
          setup: ["producer with a REQUESTED CA appointment"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3021", full_name: "Dup Appt", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/appointments"
              payload: { producer_id: "${p}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /api/appointments"
              payload: { producer_id: "${p}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-09-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_APPOINTMENT_ALREADY_ACTIVE"

      - name: for_cause_filing_30d_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_TERMINATION_FILING_OVERDUE]"]
        distinguishing_aspect: "FOR_CAUSE termination filing is timely at exactly terminate+30 days (inclusive) and overdue one second later."
        test_recipe:
          setup: ["two producers A and B, each with CA license + ACTIVE appointment; both appointments terminated FOR_CAUSE at 2026-08-01T00:00:00Z (deadline 2026-08-31T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3022", full_name: "Cause A", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { pa: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${pa}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${pa}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { aa: $.data.id }
            - call: "POST /api/appointments/${aa}/file"
              as: LicensingCoordinator
            - call: "POST /api/appointments/${aa}/terminate"
              payload: { termination_reason: "FOR_CAUSE" }
              as: LicensingCoordinator
            - call: "POST /api/producers"
              payload: { npn: "NPN-3023", full_name: "Cause B", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { pb: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${pb}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
            - call: "POST /api/appointments"
              payload: { producer_id: "${pb}", state_code: "CA", lines_of_authority: ["LIFE"], effective_date: "2026-01-15T00:00:00Z" }
              as: LicensingCoordinator
              captures: { ab: $.data.id }
            - call: "POST /api/appointments/${ab}/file"
              as: LicensingCoordinator
            - call: "POST /api/appointments/${ab}/terminate"
              payload: { termination_reason: "FOR_CAUSE" }
              as: LicensingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "POST /api/appointments/${aa}/file-termination"
              as: LicensingCoordinator
              captures: { a_st: $.data.status, a_td: $.data.termination_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: CarrierAdmin
            - call: "POST /api/appointments/${ab}/file-termination"
              as: LicensingCoordinator
              captures: { b_err: $.data.error_id }
          assert:
            - "At exactly +30 days: a_st == TERMINATED and a_td == 2026-08-31T00:00:00Z"
            - "One second later: b_err == ERR_TERMINATION_FILING_OVERDUE and Appointment.${ab}.status == TERMINATION_PENDING"

      - name: ce_credit_on_agency_license_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_CE_NOT_APPLICABLE]"]
        distinguishing_aspect: "CE credits attach only to producer-held licenses; an agency-held license yields ERR_CE_NOT_APPLICABLE."
        test_recipe:
          setup: ["agency with an agency-held CA license"]
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "CE Agency", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { ag: $.data.id }
            - call: "POST /api/licenses"
              payload: { agency_id: "${ag}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z", ce_required_hours: 0, ce_ethics_required_hours: 0 }
              as: LicensingCoordinator
              captures: { aglic: $.data.id }
          trigger:
            - call: "POST /api/ce-credits"
              payload: { license_id: "${aglic}", provider_name: "CEU", course_title: "X", category: "GENERAL", credit_hours: 5, completed_on: "2026-06-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CE_NOT_APPLICABLE (http 409)"

      - name: release_unlicensed_hold_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_HOLD_NOT_RELEASABLE]"]
        distinguishing_aspect: "An UNLICENSED_AT_SALE hold can never be released — release yields ERR_HOLD_NOT_RELEASABLE even by ComplianceOfficer."
        test_recipe:
          setup: ["producer with NO license submits an application -> entry HELD with UNLICENSED_AT_SALE"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3024", full_name: "Unlicensed", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "TX", line_of_authority: "LIFE", applicant_name: "U", premium_cents: 1000000 }
              as: LicensingCoordinator
              captures: { app: $.data.id, snap: $.data.eligibility_snapshot }
            - call: "GET /api/commission-entries"
              payload: { application_id: "${app}" }
              as: LicensingCoordinator
              captures: { e: "$.data[0].id", e_st: "$.data[0].status", e_hr: "$.data[0].hold_reason" }
          trigger:
            - call: "POST /api/commission-entries/${e}/release"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "snap == LICENSE_GAP and e_st == HELD and e_hr == UNLICENSED_AT_SALE"
            - "err == ERR_HOLD_NOT_RELEASABLE"
            - "CommissionEntry.${e}.status == HELD after rejection"

      - name: premium_below_minimum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_PREMIUM_BELOW_MINIMUM]"]
        distinguishing_aspect: "A healthy producer submitting premium_cents 499 (< 500) fails with ERR_PREMIUM_BELOW_MINIMUM; 500 exactly passes."
        test_recipe:
          setup: ["ACTIVE producer, no license needed for the fiscal check"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3025", full_name: "Min Premium", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
          trigger:
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "TX", line_of_authority: "LIFE", applicant_name: "Low", premium_cents: 499 }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/applications"
              payload: { producer_id: "${p}", state_code: "TX", line_of_authority: "LIFE", applicant_name: "Edge", premium_cents: 500 }
              as: LicensingCoordinator
              captures: { app: $.data.id, app_st: $.data.status }
          assert:
            - "err == ERR_PREMIUM_BELOW_MINIMUM (http 422) at 499"
            - "app_st == SUBMITTED at exactly 500 (boundary inclusive)"

      - name: renewal_window_closed_on_both_legs_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", calculations.renewal_window, "errors[ERR_RENEWAL_WINDOW_CLOSED]"]
        distinguishing_aspect: "Renewal is rejected before the window opens (ACTIVE leg: clock < expiration-90d) and after grace closes (EXPIRED leg: clock > expiration+30d)."
        test_recipe:
          setup:
            - "producer with CA license expiring 2028-01-01 (window opens 2027-10-03; clock 2026-08-01 is too early)"
            - "same producer's NV license issued 2025-01-01, expired 2026-07-01; clock swept to 2026-08-02 (past grace close 2026-07-31)"
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3026", full_name: "Window Check", resident_state_code: "CA" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "CA", license_class: "RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2026-01-01T00:00:00Z", expiration_date: "2028-01-01T00:00:00Z", ce_required_hours: 0, ce_ethics_required_hours: 0 }
              as: LicensingCoordinator
              captures: { lic_ca: $.data.id, v_ca: $.data.version }
            - call: "POST /api/licenses"
              payload: { producer_id: "${p}", state_code: "NV", license_class: "NON_RESIDENT", lines_of_authority: ["LIFE"], issue_date: "2025-01-01T00:00:00Z", expiration_date: "2026-07-01T00:00:00Z", ce_required_hours: 0, ce_ethics_required_hours: 0 }
              as: LicensingCoordinator
              captures: { lic_nv: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: CarrierAdmin
            - call: "GET /api/licenses/${lic_nv}"
              as: LicensingCoordinator
              captures: { v_nv: $.data.version, nv_st: $.data.status }
          trigger:
            - call: "POST /api/licenses/${lic_ca}/renew"
              payload: { expected_license_version: "${v_ca}" }
              as: LicensingCoordinator
              captures: { err_early: $.data.error_id }
            - call: "POST /api/licenses/${lic_nv}/renew"
              payload: { expected_license_version: "${v_nv}" }
              as: LicensingCoordinator
              captures: { err_late: $.data.error_id }
          assert:
            - "err_early == ERR_RENEWAL_WINDOW_CLOSED (clock 2026-08-02 < window open 2027-10-03)"
            - "nv_st == EXPIRED and err_late == ERR_RENEWAL_WINDOW_CLOSED (clock past grace close 2026-07-31)"

      - name: duplicate_npn_rejected
        claim_type: violation_to_error
        grounds: [entities.Producer.fields.npn, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "npn is unique: a second producer with the same npn yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one producer with npn NPN-3027"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3027", full_name: "First", resident_state_code: "CA" }
              as: LicensingCoordinator
          trigger:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3027", full_name: "Second", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: eligibility_precedence_suspended_beats_license_gap
        claim_type: computed_read
        grounds: [calculations.producer_eligibility_posture, "endpoints[GET /api/producers/{producerId}/eligibility]"]
        distinguishing_aspect: "The computed read applies the fixed derivation precedence: a SUSPENDED producer with no license reports PRODUCER_SUSPENDED, not LICENSE_GAP."
        test_recipe:
          setup: ["producer (no license) SUSPENDED via inquiry-overdue cascade"]
          setup_api_calls:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3028", full_name: "Precedence", resident_state_code: "TX" }
              as: LicensingCoordinator
              captures: { p: $.data.id }
            - call: "POST /api/inquiries"
              payload: { producer_id: "${p}", state_code: "TX", reference_number: "INQ-3028" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "GET /api/producers/${p}/eligibility"
              payload: { state_code: "TX", line_of_authority: "LIFE" }
              as: LicensingCoordinator
              captures: { elig: $.data.eligibility_status, lic_ref: $.data.license_id, appt_ref: $.data.appointment_id, via: $.data.via_agency }
          assert:
            - "elig == PRODUCER_SUSPENDED (precedence over LICENSE_GAP, which also holds)"
            - "lic_ref == null and appt_ref == null and via == false"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: error_triggerable
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A call without X-User-ID / X-User-Role headers yields 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/producers"
              payload: { npn: "NPN-3029", full_name: "No Auth", resident_state_code: "CA" }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (http 401)"

      - name: error_ce_incomplete_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CE_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / ce_spillover_vs_strict_variant_divergence"
          rationale: "ERR_CE_INCOMPLETE is asserted as the failure path of the named §1.8 instance (and again in calculations/ce_input_set_excludes_reported_and_out_of_period)."

      - name: error_license_not_active_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_LICENSE_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / application_approve_requires_license_active"
          rationale: "Asserted as the failure path of the named §1.8 instance (and in state_machines/rescind_termination_requires_license_active_rejected)."

      - name: error_appointment_not_active_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPOINTMENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / commission_release_requires_appointment_active"
          rationale: "Asserted as the first release attempt of the named §1.8 instance."

      - name: error_interval_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPOINTMENT_INTERVAL_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / appointment_refile_adjacency_half_open"
          rationale: "Asserted as the overlap leg of the named §1.8 instance."

      - name: error_probation_spacing_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROBATION_SPACING]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / probation_spacing_buffer_365_days"
          rationale: "Asserted as the 364-day leg of the named §1.8 instance."

      - name: error_producer_suspended_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRODUCER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / suspended_producer_beats_premium_minimum"
          rationale: "Asserted as the winning error of the named §1.8 instance."

      - name: error_jit_window_trigger
