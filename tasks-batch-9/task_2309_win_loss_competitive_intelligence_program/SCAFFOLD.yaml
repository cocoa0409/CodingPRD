  - method: POST
    path: /battlecards/{battlecard_id}/claims
    description: "Adds a claim with its interview-response evidence set; substantiation and risk are computed here (calculations.claim_substantiation_score)."
    roles: [ResearchAnalyst]
    input: [claim_text, claim_type, evidence_response_ids]
    output: BattlecardClaim
    success: 201
    side_effects:
      - "substantiation_score, substantiation_level and risk_class computed; legal_status = PENDING"
      - "the card's risk_index_pre and risk_index_final are recomputed"
      - "increments Battlecard.version"

  - method: GET
    path: /battlecards/{battlecard_id}/claims
    description: "Reverse lookup for BattlecardClaim.battlecard_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["legal_status?", "risk_class?", "limit?", "offset?"]
    output: "BattlecardClaim[]"
    success: 200
    side_effects: []
    notes: "Ordering: created_at ASC."

  - method: POST
    path: /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision
    description: "Legal review of one claim; the three decisions fork into divergent side-effect sets and can auto-transition the card."
    roles: [LegalReviewer]
    input: [decision, "conditions_note?"]
    output: BattlecardClaim
    success: 200
    side_effects:
      - "APPROVE: approved_claim_count += 1; when no claim is left PENDING and none is REJECTED, the card LEGAL_REVIEW -> APPROVED"
      - "CONDITIONAL: conditions_note stored, conditional_claim_count += 1, and risk_index_final picks up CONDITIONAL_SURCHARGE"
      - "REJECT: rejected_claim_count += 1, the claim leaves the risk input set, the card LEGAL_REVIEW -> DRAFT, and a PUBLISHED card with no approved claim left -> WITHDRAWN with its assignments EXPIRED (claim_rejection_withdrawal_cascade)"
      - "risk_index_pre and risk_index_final recomputed; increments BattlecardClaim.version and Battlecard.version"
    notes: "`decision` is one of APPROVE, CONDITIONAL, REJECT."

  - method: POST
    path: /battlecards/{battlecard_id}/submit-legal
    description: "DRAFT -> LEGAL_REVIEW; requires every claim to be at least ANECDOTAL and the owning program to be ACTIVE."
    roles: [ResearchAnalyst]
    input: []
    output: Battlecard
    success: 200
    side_effects:
      - "non-REJECTED claims reset to PENDING; risk indices recomputed"
      - "increments Battlecard.version"

  - method: POST
    path: /battlecards/{battlecard_id}/publish
    description: "APPROVED -> PUBLISHED; re-verifies risk_index_final against PUBLISH_RISK_CEILING."
    roles: [EnablementManager]
    input: []
    output: Battlecard
    success: 200
    side_effects:
      - "published_at = logical clock; Competitor.published_battlecard_count += 1; adoption_rate recomputed"
      - "increments Battlecard.version and Competitor.version"

  - method: POST
    path: /battlecards/{battlecard_id}/reopen
    description: "PUBLISHED -> DRAFT (competitive-claim response protocol); expires outstanding enablement assignments."
    roles: [ResearchAnalyst]
    input: ["reopen_reason?"]
    output: Battlecard
    success: 200
    side_effects:
      - "reopen_count += 1; Competitor.published_battlecard_count -= 1"
      - "every ASSIGNED assignment on the card -> EXPIRED; assigned_count, trained_count and adoption_rate recomputed"
      - "increments Battlecard.version and Competitor.version"

  - method: GET
    path: /battlecards/{battlecard_id}/enablement-assignments
    description: "Reverse lookup for EnablementAssignment.battlecard_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["status?", "limit?", "offset?"]
    output: "EnablementAssignment[]"
    success: 200
    side_effects: []
    notes: "Ordering: due_at ASC, then created_at ASC."

  # --- EnablementAssignment ------------------------------------------------
  - method: POST
    path: /enablement-assignments
    description: "Distributes a published battlecard to one sales rep with a training due date."
    roles: [EnablementManager]
    input: [battlecard_id, sales_rep_user_ref, due_at]
    output: EnablementAssignment
    success: 201
    side_effects:
      - "status = ASSIGNED; assigned_at = logical clock; attempt_count = 0"
      - "Battlecard.assigned_count += 1; adoption_rate recomputed; increments Battlecard.version"

  - method: GET
    path: /enablement-assignments/{assignment_id}
    description: "Reads one enablement assignment with its quiz history."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: EnablementAssignment
    success: 200
    side_effects: []

  - method: POST
    path: /enablement-assignments/{assignment_id}/complete
    description: "Records a training quiz attempt; the score threshold forks the assignment into TRAINED or FAILED."
    roles: [SalesRep]
    input: [quiz_score]
    output: EnablementAssignment
    success: 200
    side_effects:
      - "attempt_count += 1; quiz_score stored"
      - "score >= QUIZ_PASS_SCORE: status -> TRAINED, completed_at = logical clock, Battlecard.trained_count += 1"
      - "score < QUIZ_PASS_SCORE: status -> FAILED, completed_at stays null, trained_count unchanged"
      - "Battlecard.adoption_rate recomputed; increments Battlecard.version"

  # --- ProductGap ----------------------------------------------------------
  - method: POST
    path: /product-gaps
    description: "Routes a PRODUCT_GAP interview response into the roadmap pipeline; derives the competitor by traversing response -> interview -> deal."
    roles: [ProductManager]
    input: [program_id, source_response_id, gap_summary, "additional_response_ids?"]
    output: ProductGap
    success: 201
    side_effects:
      - "derived_competitor_id resolved from the source response's deal; linked_deal_count and affected_acr_usd aggregated over the evidence set"
      - "impact_score and roadmap_priority_band computed; status = NEW"
    notes: "source_response_id must reference an InterviewResponse whose question_key == PRODUCT_GAP."

  - method: GET
    path: /product-gaps/{gap_id}
    description: "Reads one product gap with its impact score and priority band."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: ProductGap
    success: 200
    side_effects: []

  - method: GET
    path: /product-gaps
    description: "Filtered list; reverse lookup for ProductGap.program_id, ProductGap.source_response_id and ProductGap.derived_competitor_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["program_id?", "source_response_id?", "derived_competitor_id?", "status?", "roadmap_priority_band?", "limit?", "offset?"]
    output: "ProductGap[]"
    success: 200
    side_effects: []
    notes: "Ordering: impact_score DESC, then created_at ASC."

  - method: POST
    path: /product-gaps/{gap_id}/triage
    description: "Product-management triage; re-scores the gap immediately before applying the ACCEPT / NEEDS_EVIDENCE / DECLINE branch."
    roles: [ProductManager]
    input: [decision, "additional_response_ids?"]
    output: ProductGap
    success: 200
    side_effects:
      - "when additional_response_ids is supplied, the evidence set grows and linked_deal_count, affected_acr_usd, impact_score and roadmap_priority_band are recomputed BEFORE the band gate is evaluated"
      - "ACCEPT: status -> ACCEPTED (refused when the re-scored band is P3); NEEDS_EVIDENCE: NEW -> TRIAGED; DECLINE: status -> DECLINED"
      - "increments ProductGap.version"

  - method: POST
    path: /product-gaps/{gap_id}/promote
    description: "ACCEPTED -> PROMOTED with a roadmap epic reference; gated on the priority band and on battlecard adoption."
    roles: [ProductManager]
    input: [roadmap_epic_ref]
    output: ProductGap
    success: 200
    side_effects:
      - "roadmap_epic_ref stored; increments ProductGap.version"

  # --- Flat filtered-list reads (FK reverse-reachability companions to the
  #     nested sub-resource reads above; same rows, addressed by foreign key) --
  - method: GET
    path: /competitors
    description: "Filtered list of competitors; reverse lookup for Competitor.program_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["program_id?", "tier?", "status?", "limit?", "offset?"]
    output: "Competitor[]"
    success: 200
    side_effects: []
    notes: "Ordering: name ASC."

  - method: GET
    path: /analysts
    description: "Filtered list of analysts; reverse lookup for Analyst.program_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["program_id?", "status?", "employment_type?", "limit?", "offset?"]
    output: "Analyst[]"
    success: 200
    side_effects: []
    notes: "Ordering: full_name ASC."

  - method: GET
    path: /buyer-contacts
    description: "Filtered list of buyer contacts; reverse lookup for BuyerContact.deal_id and the cross-deal person view the cooling-off rule depends on."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["deal_id?", "email?", "consent_status?", "incentive_eligibility?", "limit?", "offset?"]
    output: "BuyerContact[]"
    success: 200
    side_effects: []
    notes: "The `email` filter matches case-insensitively, which is how one buyer person is observed across several deals."

  - method: GET
    path: /sampling-frames
    description: "Filtered list of sampling frames; reverse lookup for SamplingFrame.program_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["program_id?", "status?", "selection_basis?", "limit?", "offset?"]
    output: "SamplingFrame[]"
    success: 200
    side_effects: []
    notes: "Ordering: window_start ASC, then created_at ASC."

  - method: GET
    path: /interview-responses/{response_id}
    description: "Reads one recorded interview response (immutable evidence row)."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: InterviewResponse
    success: 200
    side_effects: []

  - method: GET
    path: /interview-responses
    description: "Filtered list of interview responses; reverse lookup for InterviewResponse.interview_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["interview_id?", "question_key?", "limit?", "offset?"]
    output: "InterviewResponse[]"
    success: 200
    side_effects: []
    notes: "Ordering: recorded_at ASC. This is the pool a ProductGap or BattlecardClaim cites."

  - method: GET
    path: /battlecard-claims/{claim_id}
    description: "Reads one battlecard claim with its substantiation score, level, risk class and legal status."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: BattlecardClaim
    success: 200
    side_effects: []

  - method: GET
    path: /battlecard-claims
    description: "Filtered list of claims; reverse lookup for BattlecardClaim.battlecard_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["battlecard_id?", "legal_status?", "risk_class?", "substantiation_level?", "limit?", "offset?"]
    output: "BattlecardClaim[]"
    success: 200
    side_effects: []
    notes: "Ordering: created_at ASC."

  - method: GET
    path: /enablement-assignments
    description: "Filtered list of enablement assignments; reverse lookup for EnablementAssignment.battlecard_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["battlecard_id?", "sales_rep_user_ref?", "status?", "limit?", "offset?"]
    output: "EnablementAssignment[]"
    success: 200
    side_effects: []
    notes: "Ordering: due_at ASC, then created_at ASC."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth (validations 1-4) ---
  - { id: ERR_MISSING_AUTH_HEADERS, http_status: 401, condition: "X-Role or X-User-ID header absent", applies_to: [all] }
  - { id: ERR_UNKNOWN_ROLE, http_status: 401, condition: "X-Role is not one of the six declared roles", applies_to: [all] }
  - { id: ERR_ROLE_NOT_PERMITTED, http_status: 403, condition: "X-Role is not in the endpoint's roles list", applies_to: [all] }
  - { id: ERR_ANALYST_IDENTITY_INVALID, http_status: 403, condition: "X-Role == ResearchAnalyst but X-User-ID is not an ACTIVE Analyst id", applies_to: ["POST /interviews", "POST /interviews/{interview_id}/complete", "POST /loss-attributions", "POST /loss-attributions/{attribution_id}/ratify", "POST /battlecards", "POST /battlecards/{battlecard_id}/claims", "POST /battlecards/{battlecard_id}/submit-legal", "POST /sampling-frames/{frame_id}/draw"] }

  # --- existence (validations 5-6) ---
  - { id: ERR_PROGRAM_NOT_FOUND, http_status: 404, condition: "program_id does not resolve", applies_to: ["GET /programs/{program_id}", "POST /programs/{program_id}/activate", "POST /programs/{program_id}/begin-closing", "POST /programs/{program_id}/close", "PUT /programs/{program_id}/incentive-budget", "PUT /programs/{program_id}/interview-guide", "GET /programs/{program_id}/competitors", "GET /programs/{program_id}/analysts", "GET /programs/{program_id}/sampling-frames", "GET /programs/{program_id}/loss-trends", "POST /programs/{program_id}/enablement-sweep", "POST /competitors", "POST /deals", "POST /analysts", "POST /sampling-frames", "POST /loss-reasons", "POST /product-gaps"] }
  - { id: ERR_COMPETITOR_NOT_FOUND, http_status: 404, condition: "competitor_id does not resolve", applies_to: ["GET /competitors/{competitor_id}", "POST /competitors/{competitor_id}/archive", "POST /deals", "PATCH /deals/{deal_id}", "POST /battlecards"] }
  - { id: ERR_DEAL_NOT_FOUND, http_status: 404, condition: "deal_id does not resolve", applies_to: ["GET /deals/{deal_id}", "PATCH /deals/{deal_id}", "POST /deals/{deal_id}/decline-selection", "POST /deals/{deal_id}/buyer-contacts", "GET /deals/{deal_id}/buyer-contacts", "POST /deals/{deal_id}/buyer-contacts/{contact_id}/consent", "POST /interviews", "POST /loss-attributions", "POST /sampling-frames/{frame_id}/draw"] }
  - { id: ERR_ANALYST_NOT_FOUND, http_status: 404, condition: "analyst_id does not resolve", applies_to: ["GET /analysts/{analyst_id}", "POST /analysts/{analyst_id}/deactivate", "POST /interviews"] }
  - { id: ERR_BUYER_CONTACT_NOT_FOUND, http_status: 404, condition: "contact_id / buyer_contact_id does not resolve, or the contact's deal_id differs from the deal_id in the path", applies_to: ["GET /buyer-contacts/{contact_id}", "POST /deals/{deal_id}/buyer-contacts/{contact_id}/consent", "POST /interviews"] }
  - { id: ERR_SAMPLING_FRAME_NOT_FOUND, http_status: 404, condition: "frame_id does not resolve", applies_to: ["GET /sampling-frames/{frame_id}", "POST /sampling-frames/{frame_id}/seal", "POST /sampling-frames/{frame_id}/draw", "POST /sampling-frames/{frame_id}/close"] }
  - { id: ERR_INTERVIEW_NOT_FOUND, http_status: 404, condition: "interview_id does not resolve", applies_to: ["GET /interviews/{interview_id}", "POST /interviews/{interview_id}/complete", "POST /interviews/{interview_id}/no-show", "POST /interviews/{interview_id}/reschedule", "POST /interviews/{interview_id}/cancel", "POST /interviews/{interview_id}/responses", "GET /interviews/{interview_id}/responses"] }
  - { id: ERR_INTERVIEW_RESPONSE_NOT_FOUND, http_status: 404, condition: "source_response_id or a member of additional_response_ids / evidence_response_ids does not resolve", applies_to: ["GET /interview-responses/{response_id}", "POST /product-gaps", "POST /product-gaps/{gap_id}/triage", "POST /battlecards/{battlecard_id}/claims"] }
  - { id: ERR_LOSS_REASON_NOT_FOUND, http_status: 404, condition: "reason_id, parent_reason_id, primary_reason_id or secondary_reason_id does not resolve", applies_to: ["GET /loss-reasons/{reason_id}", "PATCH /loss-reasons/{reason_id}", "POST /loss-reasons/{reason_id}/deprecate", "POST /loss-reasons", "POST /loss-attributions"] }
  - { id: ERR_LOSS_ATTRIBUTION_NOT_FOUND, http_status: 404, condition: "attribution_id does not resolve", applies_to: ["GET /loss-attributions/{attribution_id}", "POST /loss-attributions/{attribution_id}/ratify"] }
  - { id: ERR_BATTLECARD_NOT_FOUND, http_status: 404, condition: "battlecard_id does not resolve", applies_to: ["GET /battlecards/{battlecard_id}", "POST /battlecards/{battlecard_id}/claims", "GET /battlecards/{battlecard_id}/claims", "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision", "POST /battlecards/{battlecard_id}/submit-legal", "POST /battlecards/{battlecard_id}/publish", "POST /battlecards/{battlecard_id}/reopen", "GET /battlecards/{battlecard_id}/enablement-assignments", "POST /enablement-assignments"] }
  - { id: ERR_BATTLECARD_CLAIM_NOT_FOUND, http_status: 404, condition: "claim_id does not resolve, or the claim's battlecard_id differs from the battlecard_id in the path", applies_to: ["GET /battlecard-claims/{claim_id}", "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision"] }
  - { id: ERR_PRODUCT_GAP_NOT_FOUND, http_status: 404, condition: "gap_id does not resolve", applies_to: ["GET /product-gaps/{gap_id}", "POST /product-gaps/{gap_id}/triage", "POST /product-gaps/{gap_id}/promote"] }
  - { id: ERR_ENABLEMENT_ASSIGNMENT_NOT_FOUND, http_status: 404, condition: "assignment_id does not resolve", applies_to: ["GET /enablement-assignments/{assignment_id}", "POST /enablement-assignments/{assignment_id}/complete"] }

  # --- structural and range (validations 7-9) ---
  - { id: ERR_INVALID_REQUEST, http_status: 400, condition: "missing required field, wrong JSON type, undeclared enum member, malformed datetime, empty required array, or pagination limit/offset outside [1,100] / [0,inf)", applies_to: [all] }
  - { id: ERR_VALUE_OUT_OF_RANGE, http_status: 422, condition: "a well-typed numeric value falls outside its declared domain (see validations priority 8)", applies_to: ["POST /programs", "PUT /programs/{program_id}/incentive-budget", "POST /deals", "PATCH /deals/{deal_id}", "POST /sampling-frames", "POST /interviews/{interview_id}/responses", "POST /loss-attributions", "POST /enablement-assignments/{assignment_id}/complete"] }
  - { id: ERR_INVALID_TIME_WINDOW, http_status: 422, condition: "an interval's start is not strictly before its end (zero-length intervals included)", applies_to: ["POST /sampling-frames", "GET /programs/{program_id}/loss-trends", "POST /interviews", "POST /interviews/{interview_id}/reschedule", "POST /interviews/{interview_id}/complete", "POST /enablement-assignments"] }

  # --- referential and uniqueness (validations 10-11) ---
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http_status: 409, condition: "a referenced row exists but belongs to a different Program than the operation's scope", applies_to: ["POST /interviews", "POST /loss-attributions", "POST /battlecards/{battlecard_id}/claims", "POST /sampling-frames/{frame_id}/draw", "POST /product-gaps", "POST /enablement-assignments"] }
  - { id: ERR_DUPLICATE_RESOURCE_KEY, http_status: 409, condition: "a scoped uniqueness key already exists (competitor name, crm_deal_ref, buyer email, loss-reason code, assignment rep, or a second live attribution on one deal)", applies_to: ["POST /competitors", "POST /deals", "POST /deals/{deal_id}/buyer-contacts", "POST /loss-reasons", "POST /loss-attributions", "POST /enablement-assignments"] }

  # --- optimistic concurrency (validation 12, §1.2.1) ---
  - { id: ERR_STALE_DEAL_VERSION, http_status: 412, condition: "expected_deal_version != Deal.version", applies_to: ["POST /loss-attributions"] }
  - { id: ERR_STALE_PROGRAM_VERSION, http_status: 412, condition: "expected_program_version != Program.version", applies_to: ["PUT /programs/{program_id}/incentive-budget"] }

  # --- state preconditions (validation 13) ---
  - { id: ERR_PROGRAM_STATE_INVALID, http_status: 409, condition: "the program is not in a state from which the requested transition is declared (includes CLOSED terminal lockdown)", applies_to: ["POST /programs/{program_id}/activate", "POST /programs/{program_id}/begin-closing", "POST /programs/{program_id}/close", "PUT /programs/{program_id}/incentive-budget", "PUT /programs/{program_id}/interview-guide", "POST /sampling-frames/{frame_id}/seal", "POST /battlecards/{battlecard_id}/submit-legal", "POST /product-gaps/{gap_id}/promote"] }
  - { id: ERR_DEAL_STATE_INVALID, http_status: 409, condition: "the deal's research_status or attribution_status forbids the operation (includes DECLINED and SYNTHESIZED lockdown)", applies_to: ["PATCH /deals/{deal_id}", "POST /deals/{deal_id}/decline-selection", "POST /interviews", "POST /loss-attributions"] }
  - { id: ERR_FRAME_STATE_INVALID, http_status: 409, condition: "the sampling frame is not in the required state (draw needs SEALED; seal needs DRAFT; CLOSED is terminal)", applies_to: ["POST /sampling-frames/{frame_id}/seal", "POST /sampling-frames/{frame_id}/draw", "POST /sampling-frames/{frame_id}/close", "POST /interviews"] }
  - { id: ERR_INTERVIEW_STATE_INVALID, http_status: 409, condition: "the interview is not in the required state (complete/no-show/cancel need SCHEDULED; reschedule needs NO_SHOW; COMPLETED and CANCELLED are terminal)", applies_to: ["POST /interviews/{interview_id}/complete", "POST /interviews/{interview_id}/no-show", "POST /interviews/{interview_id}/reschedule", "POST /interviews/{interview_id}/cancel", "POST /interviews/{interview_id}/responses"] }
  - { id: ERR_ATTRIBUTION_STATE_INVALID, http_status: 409, condition: "ratify called on an attribution that is not PROVISIONAL (RATIFIED or SUPERSEDED)", applies_to: ["POST /loss-attributions/{attribution_id}/ratify"] }
  - { id: ERR_BATTLECARD_STATE_INVALID, http_status: 409, condition: "the battlecard is not in the required state (submit-legal needs DRAFT; publish needs APPROVED; reopen needs PUBLISHED; WITHDRAWN is terminal)", applies_to: ["POST /battlecards/{battlecard_id}/claims", "POST /battlecards/{battlecard_id}/submit-legal", "POST /battlecards/{battlecard_id}/publish", "POST /battlecards/{battlecard_id}/reopen", "POST /enablement-assignments"] }
  - { id: ERR_CLAIM_STATE_INVALID, http_status: 409, condition: "a legal decision is applied to a claim whose current legal_status does not permit it (REJECTED is terminal; CONDITIONAL accepts only APPROVE)", applies_to: ["POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision"] }
  - { id: ERR_PRODUCT_GAP_STATE_INVALID, http_status: 409, condition: "the gap is not in the required state (promote needs ACCEPTED; DECLINED and PROMOTED are terminal; NEEDS_EVIDENCE needs NEW)", applies_to: ["POST /product-gaps/{gap_id}/triage", "POST /product-gaps/{gap_id}/promote"] }
  - { id: ERR_ASSIGNMENT_STATE_INVALID, http_status: 409, condition: "complete called on an assignment that is TRAINED or EXPIRED", applies_to: ["POST /enablement-assignments/{assignment_id}/complete"] }

  # --- derived-state gate (validation 14) ---
  - { id: ERR_PROGRAM_POSTURE_FROZEN, http_status: 409, condition: "Program.posture == FROZEN (utilization >= 1.00 or program CLOSED) on a write that consumes incentive budget or extends research", applies_to: ["POST /sampling-frames/{frame_id}/draw", "POST /interviews", "POST /interviews/{interview_id}/reschedule", "POST /battlecards/{battlecard_id}/publish", "POST /enablement-assignments"] }

  # --- identity and independence (validations 15-18) ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, condition: "the acting X-User-ID is barred from this step because it performed a conflicting earlier step (authored the attribution, interviewed the deal, authored the battlecard, or is not the assignment's own rep)", applies_to: ["POST /loss-attributions/{attribution_id}/ratify", "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision", "POST /enablement-assignments/{assignment_id}/complete"] }
  - { id: ERR_INDEPENDENCE_VIOLATION, http_status: 422, condition: "program.independence_mode == STRICT and the analyst is a sales-org member or is the deal's own sales owner", applies_to: ["POST /interviews", "POST /interviews/{interview_id}/reschedule"] }
  - { id: ERR_ANALYST_NOT_CERTIFIED, http_status: 422, condition: "logical clock >= analyst.certified_until", applies_to: ["POST /interviews", "POST /interviews/{interview_id}/reschedule", "POST /interviews/{interview_id}/complete"] }
  - { id: ERR_CONSENT_NOT_GRANTED, http_status: 422, condition: "buyer_contact.consent_status != GRANTED", applies_to: ["POST /interviews", "POST /interviews/{interview_id}/reschedule"] }

  # --- temporal and capacity (validations 19-24) ---
  - { id: ERR_CONTACT_COOLING_OFF_ACTIVE, http_status: 409, condition: "the buyer person (matched by lower(email) across all deals) has a COMPLETED or SCHEDULED interview inside the closed 90-day window preceding the requested start", applies_to: ["POST /interviews", "POST /interviews/{interview_id}/reschedule"] }
  - { id: ERR_ANALYST_SLOT_CONFLICT, http_status: 409, condition: "the requested interval, extended by the 15-minute debrief buffer, overlaps another SCHEDULED interview of the same analyst", applies_to: ["POST /interviews", "POST /interviews/{interview_id}/reschedule"] }
  - { id: ERR_DEAL_OUTSIDE_FRAME_WINDOW, http_status: 422, condition: "the pinned deal's close_date is outside the frame's half-open [window_start, window_end)", applies_to: ["POST /sampling-frames/{frame_id}/draw"] }
  - { id: ERR_ANALYST_CAPACITY_EXCEEDED, http_status: 409, condition: "analyst.open_interview_count >= program.max_open_interviews_per_analyst", applies_to: ["POST /interviews", "POST /interviews/{interview_id}/reschedule"] }
  - { id: ERR_STRATUM_QUOTA_EXHAUSTED, http_status: 409, condition: "open_<stratum>_slots < requested_count", applies_to: ["POST /sampling-frames/{frame_id}/draw"] }
  - { id: ERR_NO_ELIGIBLE_DEALS, http_status: 422, condition: "quota slots remain but the eligibility-filtered candidate pool for the stratum is empty", applies_to: ["POST /sampling-frames/{frame_id}/draw"] }

  # --- synthesis and taxonomy (validations 25-30) ---
  - { id: ERR_GUIDE_COVERAGE_INCOMPLETE, http_status: 422, condition: "the interview's recorded question_key set does not cover required_question_keys_pinned", applies_to: ["POST /interviews/{interview_id}/complete"] }
  - { id: ERR_REASON_NOT_LEAF, http_status: 422, condition: "a cited LossReason has is_leaf == false", applies_to: ["POST /loss-attributions"] }
  - { id: ERR_REASON_DEPRECATED, http_status: 422, condition: "a cited LossReason has status == DEPRECATED", applies_to: ["POST /loss-attributions"] }
  - { id: ERR_TAXONOMY_DEPTH_EXCEEDED, http_status: 422, condition: "parent.depth + 1 > 3", applies_to: ["POST /loss-reasons", "PATCH /loss-reasons/{reason_id}"] }
  - { id: ERR_TAXONOMY_CYCLE, http_status: 409, condition: "the proposed parent is the node itself or one of its descendants", applies_to: ["POST /loss-reasons", "PATCH /loss-reasons/{reason_id}"] }
  - { id: ERR_WEIGHT_SPLIT_INVALID, http_status: 422, condition: "the primary/secondary weight split does not conserve 1.00, or the same reason is cited twice", applies_to: ["POST /loss-attributions"] }

  # --- battlecard and enablement (validations 31-38) ---
  - { id: ERR_CLAIM_UNSUBSTANTIATED, http_status: 422, condition: "a claim on the card has substantiation_level == UNSUBSTANTIATED (substantiation_score < 0.90)", applies_to: ["POST /battlecards/{battlecard_id}/submit-legal"] }
  - { id: ERR_RISK_CEILING_EXCEEDED, http_status: 422, condition: "battlecard.risk_index_final > 2.20 at publish time", applies_to: ["POST /battlecards/{battlecard_id}/publish"] }
  - { id: ERR_INCENTIVE_BUDGET_EXCEEDED, http_status: 402, condition: "committed + paid + the new provisional incentive would exceed program.incentive_budget_usd", applies_to: ["POST /interviews", "POST /interviews/{interview_id}/reschedule"] }
  - { id: ERR_ADOPTION_BELOW_THRESHOLD, http_status: 409, condition: "the derived competitor's most recently published battlecard has adoption_rate < 0.60", applies_to: ["POST /product-gaps/{gap_id}/promote"] }
  - { id: ERR_ASSIGNMENT_PAST_DUE, http_status: 409, condition: "logical clock > assignment.due_at", applies_to: ["POST /enablement-assignments/{assignment_id}/complete"] }
  - { id: ERR_RESCHEDULE_LIMIT_REACHED, http_status: 409, condition: "interview.reschedule_count >= 2", applies_to: ["POST /interviews/{interview_id}/reschedule"] }
  - { id: ERR_RESPONSE_NOT_PRODUCT_GAP, http_status: 422, condition: "the source response's question_key != PRODUCT_GAP", applies_to: ["POST /product-gaps"] }
  - { id: ERR_EVIDENCE_SET_INVALID, http_status: 422, condition: "the evidence array is empty after deduplication or cites a response from outside the battlecard's program", applies_to: ["POST /battlecards/{battlecard_id}/claims"] }

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:

  - name: ProgramAdmin
    description: "Owns the program envelope: lifecycle, incentive budget, interview guide, competitor registry, deal import and the loss-reason taxonomy."
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{program_id}/activate"
      - "POST /programs/{program_id}/begin-closing"
      - "POST /programs/{program_id}/close"
      - "PUT /programs/{program_id}/incentive-budget"
      - "PUT /programs/{program_id}/interview-guide"
      - "POST /competitors"
      - "POST /competitors/{competitor_id}/archive"
      - "POST /deals"
      - "PATCH /deals/{deal_id}"
      - "POST /analysts"
      - "POST /analysts/{analyst_id}/deactivate"
      - "POST /loss-reasons"
      - "PATCH /loss-reasons/{reason_id}"
      - "POST /loss-reasons/{reason_id}/deprecate"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: ResearchAnalyst
    description: "Conducts the research: sampling frames and draws, buyer contacts and consent, interview scheduling and completion, response capture, loss attribution authoring and ratification, battlecard authoring."
    identity: "entity_backed:Analyst"
    exclusive_operations:
      - "POST /sampling-frames"
      - "POST /sampling-frames/{frame_id}/seal"
      - "POST /sampling-frames/{frame_id}/draw"
      - "POST /sampling-frames/{frame_id}/close"
      - "POST /deals/{deal_id}/decline-selection"
      - "POST /deals/{deal_id}/buyer-contacts"
      - "POST /deals/{deal_id}/buyer-contacts/{contact_id}/consent"
      - "POST /interviews"
      - "POST /interviews/{interview_id}/complete"
      - "POST /interviews/{interview_id}/no-show"
      - "POST /interviews/{interview_id}/reschedule"
      - "POST /interviews/{interview_id}/cancel"
      - "POST /interviews/{interview_id}/responses"
      - "POST /loss-attributions"
      - "POST /loss-attributions/{attribution_id}/ratify"
      - "POST /battlecards"
      - "POST /battlecards/{battlecard_id}/claims"
      - "POST /battlecards/{battlecard_id}/submit-legal"
      - "POST /battlecards/{battlecard_id}/reopen"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
    notes: "The only entity_backed role: X-User-ID must be an Analyst.id with status ACTIVE (validations priority 4). Segregation of duties is enforced within the role: the analyst who authored an attribution, or who conducted a COMPLETED interview on the deal, cannot ratify it (validations priority 15)."

  - name: LegalReviewer
    description: "Substantiation and claim-risk authority; the only role that can decide a battlecard claim."
    identity: opaque
    exclusive_operations:
      - "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
    notes: "Cannot author claims or submit cards for review, so approval never collapses into self-approval."

  - name: EnablementManager
    description: "Distributes approved battlecards to the field and runs the adoption sweep."
    identity: opaque
    exclusive_operations:
      - "POST /battlecards/{battlecard_id}/publish"
      - "POST /enablement-assignments"
      - "POST /programs/{program_id}/enablement-sweep"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
    notes: "Publishes but cannot author or legally clear a card; reopening a published card belongs to ResearchAnalyst."

  - name: ProductManager
    description: "Owns the roadmap side of the pipeline: product-gap intake, triage and promotion."
    identity: opaque
    exclusive_operations:
      - "POST /product-gaps"
      - "POST /product-gaps/{gap_id}/triage"
      - "POST /product-gaps/{gap_id}/promote"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: SalesRep
    description: "Consumer of enablement content; records its own training attempts."
    identity: opaque
    exclusive_operations:
      - "POST /enablement-assignments/{assignment_id}/complete"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
    notes: "X-User-ID must equal the assignment's sales_rep_user_ref; a rep completing another rep's assignment gets ERR_SEGREGATION_OF_DUTIES (validations priority 15). SalesRep is deliberately excluded from every research and authoring endpoint, which is what makes analyst independence from the sales team enforceable."
