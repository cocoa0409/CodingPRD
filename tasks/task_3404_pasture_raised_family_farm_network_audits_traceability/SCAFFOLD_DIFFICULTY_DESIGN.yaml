scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: farmer_payment_provisional_vs_final_commodity_base
        grounds:
          - calculations.farmer_payment
          - state_machines.SettlementRun.CALCULATED_to_FINALIZED
        distinguishing_aspect: |
          Fiscal variant duality on SettlementRun: identical packed-dozen data is paid at the
          contract commodity base (provisional, 12000 cents) versus the published actual base
          (final, 12750 cents) — two valid bases, two different totals, on the payment domain.
        test_recipe:
          setup:
            - "ACTIVE farm F (declared 140 birds, effective capacity 150) with CERTIFIED certification and an ACTIVE contract (base 150, premium 90 cents/dozen)"
            - "one lot of 120 dozens graded A (score 90), 50 dozens packed into cartons at 2026-09-08T10:00:00Z (inside settlement week starting 2026-09-07)"
            - "settlement run for week 2026-09-07 exists in CALCULATED with provisional lines"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Prairie Sun Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r_id: $.data.id }
            - call: "POST /farm-network/routes/${r_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 4 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/routes/${r_id}/stops/1/collect"
              payload: { collected_cases: 4, laid_start_date: "2026-09-06", laid_end_date: "2026-09-07" }
              as: PlantOperator
              captures: { lot_id: $.data.id }
            - call: "POST /farm-network/lots/${lot_id}/grade"
              payload: { quality_score: 90 }
              as: QualityManager
            - call: "POST /farm-network/lots/${lot_id}/cartons"
              payload: { carton_count: 50, pack_size: "LARGE" }
              as: PlantOperator
            - call: "POST /farm-network/settlement-runs"
              payload: { week_start: "2026-09-07" }
              as: NetworkManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /farm-network/settlement-runs/${s_id}/finalize"
              payload: { actual_commodity_base_cents_per_dozen: 165 }
              as: NetworkManager
          assert:
            - "SettlementRun.${s_id}.provisional_total_cents == 12000  (50 dozens A x 240c x 1.00, contract base 150)"
            - "SettlementRun.${s_id}.final_total_cents == 12750  (same 50 dozens A x 255c x 1.00, actual base 165)"
            - "SettlementRun.${s_id}.status == FINALIZED"
            - "provisional and final diverge by exactly 750 cents for identical packed data"

      - name: forecast_optimistic_vs_conservative_weather_hedge
        grounds:
          - calculations.production_forecast
          - entities.ProductionForecast.fields.optimistic_dozens
          - entities.ProductionForecast.fields.conservative_dozens
        distinguishing_aspect: |
          Planning variant duality on ProductionForecast (a different entity domain than
          SettlementRun payments): identical inputs (2000 birds, SPRING, MODERATE) yield
          optimistic_dozens 908 under P50 factors but conservative_dozens 841 under P90
          weather-hedged factors.
        test_recipe:
          setup:
            - "ACTIVE farm F with declared_bird_count 2000 (effective capacity exactly 2000), CERTIFIED, ACTIVE contract"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Big Sky Layers", region: "MO", pasture_sqft: 216000, barn_sqft: 2400, nest_box_count: 400, declared_bird_count: 2000 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
          trigger:
            - call: "POST /farm-network/farms/${f_id}/forecasts"
              payload: { week_start: "2026-09-07", season: "SPRING", weather_severity: "MODERATE" }
              as: NetworkManager
              captures: { fc_id: $.data.id }
          assert:
            - "ProductionForecast.${fc_id}.optimistic_dozens == 908  (floor(2000 x 0.82 x 0.95 x 7 / 12))"
            - "ProductionForecast.${fc_id}.conservative_dozens == 841  (floor(2000 x 0.82 x 0.88 x 7 / 12))"
            - "optimistic_dozens != conservative_dozens for identical inputs"

  - rule_id: combinatorial_formula
    instances:
      - name: forecast_tiered_factor_interaction
        grounds:
          - calculations.production_forecast
          - calculations.commitment_cap
        distinguishing_aspect: |
          Mode (a) combinatorial: the forecast multiplies three tiered lookups (season lay-rate
          x variant weather table x severity column), so the optimistic/conservative ratio is not
          constant across severity levels (908/841 at MODERATE on the sibling instance vs
          469/400 at SEVERE here). Commitment cap derives as floor(conservative x 0.9) = 360 and
          is honored at exact equality.
        test_recipe:
          setup:
            - "ACTIVE farm F with declared_bird_count 1500 (effective capacity exactly 1500), CERTIFIED, ACTIVE contract covering 2026-12-07"
            - "retailer R exists"
            - "WINTER/SEVERE forecast for week 2026-12-07 created"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Frost Hollow Farm", region: "MN", pasture_sqft: 162000, barn_sqft: 1800, nest_box_count: 300, declared_bird_count: 1500 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/retailers"
              payload: { name: "Heartland Grocers", banner: "Heartland", terms_net_days: 60 }
              as: PlatformAdmin
              captures: { r_tailer_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/forecasts"
              payload: { week_start: "2026-12-07", season: "WINTER", weather_severity: "SEVERE" }
              as: NetworkManager
              captures: { fc_id: $.data.id }
          trigger:
            - call: "POST /farm-network/commitments"
              payload: { retailer_id: "${r_tailer_id}", farm_id: "${f_id}", week_start: "2026-12-07", committed_dozens: 360 }
              as: NetworkManager
              captures: { c_id: $.data.id }
          assert:
            - "ProductionForecast.${fc_id}.optimistic_dozens == 469  (floor(1500 x 0.61 x 0.88 x 7 / 12) = floor(469.7))"
            - "ProductionForecast.${fc_id}.conservative_dozens == 400  (floor(1500 x 0.61 x 0.75 x 7 / 12) = floor(400.3125))"
            - "commitment cap == floor(400 x 0.9) == 360 and SupplyCommitment.${c_id} committed_dozens == 360 was accepted at exact equality (201)"

      - name: payment_per_grade_subline_rounding_order
        grounds:
          - calculations.farmer_payment
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-grade-subline round_half_up THEN sum.
          On 3 AA + 10 A + 17 B dozens at rate 255c the pinned order yields 7077 cents, while
          sum-then-round yields 7076 — the one-cent delta is observable only because the order
          is pinned (a different combinatorial mode than the tiered-lookup forecast instance).
        test_recipe:
          setup:
            - "ACTIVE farm F (140 birds) with contract base 150 + premium 90"
            - "lot L1 (30 dozens, grade AA via score 96) with 3 cartons packed at 2026-09-08"
            - "lot L2 (30 dozens, grade B via score 75) with 17 cartons packed at 2026-09-09"
            - "lot L3 (30 dozens, grade A via score 90) with 10 cartons packed at 2026-09-10"
            - "settlement run for week 2026-09-07 in CALCULATED"
