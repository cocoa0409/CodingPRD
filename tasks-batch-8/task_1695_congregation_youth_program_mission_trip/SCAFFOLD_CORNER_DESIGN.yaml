            - { call: "POST /youth-ministry/registrations/${reg}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
          trigger:
            - { call: "POST /youth-ministry/registrations/${reg}/payments", payload: {amount_cents: 90000, method: "CASH"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "GET /youth-ministry/registrations/${reg}", as: ProgramDirector, captures: {due: $.data.amount_due_cents, cov: $.data.covered_cents, st: $.data.payment_status} }
          assert:
            - "cov == 90000 and due == 0 (floor at zero) and st == PAID_IN_FULL"

      - name: corner_calc_dual_variant_cost_share
        claim_type: variant_divergence
        grounds:
          - calculations.provisional_cost_share
          - calculations.final_cost_share
        excluded_because:
          difficulty_instance: cost_share_provisional_vs_final_at_lock
          rationale: "Variant divergence and lock-time switch asserted there with literal values 203010 -> 230100."

      - name: corner_calc_remainder_waterfall_precision
        claim_type: precision
        grounds:
          - calculations.final_cost_share
        excluded_because:
          difficulty_instance: final_cost_share_round_then_sum_waterfall
          rationale: "Nested rounding order and the -1 cent remainder asserted there."

      - name: corner_calc_channel_fees_and_gross_net
        claim_type: constants_applied
        grounds:
          - calculations.donation_fee
          - calculations.fundraising_positions
        excluded_because:
          difficulty_instance: fundraising_gross_progress_vs_net_credit
          rationale: "CARD_ONLINE 320 fee, CHECK 25, CASH 0 and the gross/net totals asserted there."

      - name: corner_calc_need_score_formula
        claim_type: correct_result
        grounds:
          - calculations.need_score
        excluded_because:
          difficulty_instance: need_score_weighted_caps_and_state_filtered_siblings
          rationale: "Component caps, sibling state filter, and conditional fundraising branch asserted with literals 90 and 30."

      - name: corner_calc_award_min_chain
        claim_type: correct_result
        grounds:
          - calculations.scholarship_award
        excluded_because:
          difficulty_instance: scholarship_award_min_chain_evaluation_order
          rationale: "Evaluation order and the 76129 award literal asserted there; fund-exhaustion boundary in scholarship_fund_exact_exhaustion_boundary."

      - name: corner_calc_late_fee_thresholds
        claim_type: correct_result
        grounds:
          - calculations.late_fee_assessment
        excluded_because:
          difficulty_instance: payment_deadline_inclusive_timestamp_boundary
          rationale: "Flat-vs-percentage max and the strict-> sweep boundary asserted there (4000-cent fee literal)."

  - section: validations
    instances:
      - name: missing_or_invalid_user_context_headers
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role, or with an undeclared role name, fail at priority 1 with 400 before any other check — even on a nonexistent resource."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /youth-ministry/programs/11111111-1111-4111-8111-111111111111", captures: {e1: $.data.error_id} }
            - { call: "GET /youth-ministry/programs/11111111-1111-4111-8111-111111111111", as: SuperAdmin, captures: {e2: $.data.error_id} }
          assert:
            - "e1 == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (headers absent; 400)"
            - "e2 == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (undeclared role name; 400, and it beats the 404 existence check)"
        # NOTE: the first trigger call intentionally omits as:/as_user_id: — the unit-test generator MUST send it without auth headers; the second uses an undeclared role.

      - name: invalid_enum_and_date_range_and_unknown_field
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_INVALID_ENUM]
          - errors[ERR_INVALID_DATE_RANGE]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Shape validation catches a bogus enum (insurance_tier GLOBAL), an inverted date pair (end_date < start_date), and missing required fields (amount_cents omitted) — each 400 before any state check."
        test_recipe:
          setup: ["program + Trip Alpha REGISTRATION_OPEN + participant"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "P"}, as: ProgramDirector, captures: {trip: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "P", last_name: "O", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "GLOBAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {e_enum: $.data.error_id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "Bad", destination_name: "A", destination_type: "IN_STATE", start_date: "2027-06-25", end_date: "2027-06-15", capacity_youth: 10, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {e_dates: $.data.error_id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL"}, as: Guardian, as_user_id: "guardian-1", captures: {e_missing: $.data.error_id} }
          assert:
            - "e_enum == ERR_INVALID_ENUM (400)"
            - "e_dates == ERR_INVALID_DATE_RANGE (400)"
            - "e_missing == ERR_INVALID_REQUEST (fundraising_goal_cents omitted; 400)"

      - name: role_forbidden_precedes_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: "A Treasurer cancelling a NONEXISTENT trip gets ERR_ROLE_FORBIDDEN (403), not ERR_TRIP_NOT_FOUND — authorization (priority 3) is evaluated before existence (priority 4)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /youth-ministry/trips/11111111-1111-4111-8111-111111111111/cancel", payload: {}, as: Treasurer, captures: {err: $.data.error_id} }
          assert:
            - "err == ERR_ROLE_FORBIDDEN with http 403 — proves role evaluation precedes path-existence resolution"

      - name: registration_window_closed_temporal_gate
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_REGISTRATION_WINDOW_CLOSED]
        distinguishing_aspect: "A registration created when the logical clock is strictly past registration_close_at fails with ERR_REGISTRATION_WINDOW_CLOSED even though the trip is REGISTRATION_OPEN."
        test_recipe:
          setup: ["Trip Alpha REGISTRATION_OPEN (window 2026-08-01..2026-12-01); participant exists; clock advanced to 2026-12-02"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "P"}, as: ProgramDirector, captures: {trip: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "P", last_name: "O", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/_clock/set-current-utc", payload: {to_iso8601: "2026-12-02T00:00:00Z"}, as: ProgramDirector }
          trigger:
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {err: $.data.error_id} }
          assert:
            - "err == ERR_REGISTRATION_WINDOW_CLOSED (422); no registration row created"

      - name: medical_release_requires_notes_and_form_type_uniqueness
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_REQUIRED_FORMS_INCOMPLETE]
          - errors[ERR_DUPLICATE_CONSENT_FORM_TYPE]
          - errors[ERR_CONSENT_FORM_STATE_FORBIDS_ACTION]
        distinguishing_aspect: "Conditional validation: MEDICAL_RELEASE without medical_notes fails while PARENTAL_CONSENT without notes passes; a second SUBMITTED form of the same type is a uniqueness violation; resubmit on a SUBMITTED (not REJECTED) form is a state error."
        test_recipe:
          setup: ["Trip Alpha REGISTRATION_OPEN; reg1 DRAFT"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "P"}, as: ProgramDirector, captures: {trip: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "P", last_name: "O", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {e_notes: $.data.error_id} }
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cf: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G2", signed_at: "2026-08-02T11:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {e_dup: $.data.error_id} }
            - { call: "POST /youth-ministry/consent-forms/${cf}/resubmit", payload: {signed_by_name: "G3", signed_at: "2026-08-03T09:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {e_resub: $.data.error_id} }
          assert:
            - "e_notes == ERR_REQUIRED_FORMS_INCOMPLETE (422) — conditional on form_type == MEDICAL_RELEASE"
            - "cf created (201): PARENTAL_CONSENT needs no medical_notes"
            - "e_dup == ERR_DUPLICATE_CONSENT_FORM_TYPE (409): one form per type in {SUBMITTED, VERIFIED}"
            - "e_resub == ERR_CONSENT_FORM_STATE_FORBIDS_ACTION (409): resubmit requires REJECTED"

      - name: scholarship_application_gates
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_ACTIVE_APPLICATION]
          - errors[ERR_REGISTRATION_STATE_FORBIDS_ACTION]
          - errors[ERR_AWARD_WOULD_BE_ZERO]
        distinguishing_aspect: "Three independent gates: application on a merely-SUBMITTED registration (state), a second application while one is UNDER_REVIEW (uniqueness), and approve computing a zero award for an UNDISCLOSED-income household (fiscal 422)."
        test_recipe:
          setup: ["Trip Alpha REGISTRATION_OPEN; reg1 SUBMITTED (forms verified); reg2 APPROVED with app UNDER_REVIEW; reg3 APPROVED whose participant is UNDISCLOSED household_size 2 no siblings no fundraising (need 0)"]
