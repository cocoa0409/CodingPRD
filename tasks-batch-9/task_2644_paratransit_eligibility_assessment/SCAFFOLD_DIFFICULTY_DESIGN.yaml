# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7; every literal in `assert:` was
# computed by executing the referenced calculations[].formula against the pinned setup.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: application_pending_days_statutory_vs_net_agency
        grounds:
          - calculations.application_pending_days
          - entities.Application.fields.days_pending_statutory
          - entities.Application.fields.days_pending_net_agency
          - entities.Application.fields.verification_excluded_days
          - entities.Application.fields.determination_due_date
          - entities.ProfessionalVerification.fields.wait_days
        distinguishing_aspect: |
          This instance's dual variant lives on the Application entity domain (elapsed statutory
          processing time): the same completeness_established_at and the same logical clock yield
          days_pending_statutory == 21 and days_pending_net_agency == 16, a delta of exactly the
          5 verification_excluded_days, and only the statutory variant may gate presumptive eligibility.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Applicant, one NEW Application submitted at 2026-08-01T00:00:00Z so completeness_established_at == 2026-08-01T00:00:00Z"
            - "one ProfessionalVerification requested at 2026-08-01T00:00:00Z and received (ACCEPTED) at 2026-08-06T00:00:00Z, giving wait_days == 5 and Application.verification_excluded_days == 5"
            - "no applicant-caused delay, so Application.applicant_delay_days == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Rosa Vance", date_of_birth: "1958-04-12", residence_zone: "IN_SERVICE_AREA", mobility_aid: "WALKER" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 120, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false }, claimed_conditions: ["limited stamina"] }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. A Lin", provider_type: "PHYSICIAN", provider_license_number: "MD-44821" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["limited stamina"], attests_permanent: true }
              as: IntakeClerk
              captures: { wait: $.data.wait_days }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: IntakeClerk
              captures: { d_stat: $.data.days_pending_statutory, d_net: $.data.days_pending_net_agency }
          assert:
            - "ProfessionalVerification.${ver_id}.wait_days == 5"
            - "Application.${appn_id}.verification_excluded_days == 5"
            - "Application.${appn_id}.applicant_delay_days == 0"
            - "Application.${appn_id}.days_pending_statutory == 21"
            - "Application.${appn_id}.days_pending_net_agency == 16"
            - "Application.${appn_id}.days_pending_statutory - Application.${appn_id}.days_pending_net_agency == 5"
            - "Application.${appn_id}.determination_due_date == \"2026-08-22\""
            - "Application.${appn_id}.completeness_established_at == \"2026-08-01T00:00:00.000Z\""

      - name: conduct_points_event_basis_vs_report_basis
        grounds:
          - calculations.no_show_points_balance
          - entities.Applicant.fields.no_show_points_event_basis
          - entities.Applicant.fields.no_show_points_report_basis
          - entities.TripEvent.fields.trip_date
          - entities.TripEvent.fields.recorded_at
          - entities.Applicant.fields.no_show_ratio_pct
        distinguishing_aspect: |
          This instance's dual variant lives on the Applicant entity domain (conduct scoring), not on
          Application elapsed time: identical TripEvent rows produce no_show_points_event_basis == 1 and
          no_show_points_report_basis == 3, because a NO_SHOW dated 2026-05-02 sits before the event-basis
          window start 2026-05-04 while its recorded_at 2026-08-01 sits inside the report-basis window.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, so the 90-day conduct window is the inclusive range 2026-05-04 .. 2026-08-01"
            - "one Applicant with no prior trip events and no suspension proceedings"
            - "one unexcused NO_SHOW dated 2026-05-02 (two days before the event-basis window start) ingested at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Dell Okafor", date_of_birth: "1962-11-30", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-05-02", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { te_early_id: $.data.id }
          trigger:
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-06-15", event_type: "LATE_CANCEL" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { te_late_id: $.data.id }
          assert:
            - "TripEvent.${te_early_id}.points_assessed == 2"
            - "TripEvent.${te_late_id}.points_assessed == 1"
            - "Applicant.${rider_id}.no_show_points_event_basis == 1"
            - "Applicant.${rider_id}.no_show_points_report_basis == 3"
            - "Applicant.${rider_id}.no_show_points_report_basis - Applicant.${rider_id}.no_show_points_event_basis == 2"
            - "Applicant.${rider_id}.chargeable_miss_count_90d == 1"
            - "Applicant.${rider_id}.scheduled_trip_count_90d == 1"
            - "Applicant.${rider_id}.no_show_ratio_pct == 100.0"
            - "GET /applicants/${rider_id}/suspension-proceedings returns total_count == 0 (points 1 < 6 and misses 1 < 3, so no AUTO_THRESHOLD proposal)"

  - rule_id: combinatorial_formula
    instances:
      - name: recommended_category_nested_min_max_branch_order_mode_a
        grounds:
          - calculations.recommended_eligibility_category
          - entities.FunctionalAssessment.fields.board_alight_score
          - entities.FunctionalAssessment.fields.wayfinding_score
          - entities.FunctionalAssessment.fields.distance_meters_walked
          - entities.FunctionalAssessment.fields.heat_sensitivity_flag
          - entities.Application.fields.attests_permanent
          - entities.FunctionalAssessment.fields.recommended_category
          - state_machines.FunctionalAssessment.NOT_STARTED_to_SCORED
          - state_machines.FunctionalAssessment.SCORED_to_SCORED
        distinguishing_aspect: |
          Mode (a): five inputs (two scores, one distance, one boolean flag, plus another entity's
          attests_permanent) interact non-linearly through nested min()/max() and a pinned branch order,
          so b=0/w=4/d=900/h=false yields UNCONDITIONAL (min-score branch 2) and NOT the INELIGIBLE that
          a distance-ceiling-first evaluation would produce; re-scoring b=3/w=3/d=350 then yields
          CONDITIONAL from the distance-floor branch on the same endpoint.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T09:30:00Z"
            - "one Applicant, one NEW Application whose ProfessionalVerification was RECEIVED with attests_permanent == true, so Application.attests_permanent == true"
            - "one FunctionalAssessment with attendance_status == ATTENDED and scoring_status == NOT_STARTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Ivo Marchetti", date_of_birth: "1949-02-08", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: true, max_walk_distance_meters: 900, uses_mobility_aid_outdoors: false, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. B Osei", provider_type: "PHYSICIAN", provider_license_number: "MD-90112" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["chronic dyspnea"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "${slot_id}", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { asmt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /assessments/${asmt_id}/attendance"
              payload: { attendance_status: "ATTENDED" }
              as: Evaluator
              as_user_id: "eval-1"
          trigger:
            - call: "POST /assessments/${asmt_id}/scores"
              payload: { board_alight_score: 0, wayfinding_score: 4, distance_meters_walked: 900, heat_sensitivity_flag: false, evaluator_notes: "cannot mount steps; navigates well; walked 900 m on level ground" }
              as: Evaluator
              as_user_id: "eval-1"
              captures: { cat_1: $.data.recommended_category }
            - call: "POST /assessments/${asmt_id}/scores"
              payload: { board_alight_score: 3, wayfinding_score: 3, distance_meters_walked: 350, heat_sensitivity_flag: false, evaluator_notes: "re-scored after supervisor review" }
              as: Evaluator
              as_user_id: "eval-1"
              captures: { cat_2: $.data.recommended_category }
          assert:
            - "after the first scores call FunctionalAssessment.${asmt_id}.recommended_category == \"UNCONDITIONAL\" (branch 2: min(0, 4) == 0 <= 1 fires before the d >= 800 ceiling branch)"
            - "after the first scores call FunctionalAssessment.${asmt_id}.recommended_category != \"INELIGIBLE\""
            - "after the first scores call FunctionalAssessment.${asmt_id}.recommended_term_days == 1825"
            - "after the second scores call FunctionalAssessment.${asmt_id}.recommended_category == \"CONDITIONAL\" (branch 3: d 350 < 400 and max(3, 3) == 3 >= 3)"
            - "after the second scores call FunctionalAssessment.${asmt_id}.recommended_term_days == 1095"
            - "FunctionalAssessment.${asmt_id}.scoring_status == \"SCORED\" and attendance_status == \"ATTENDED\" after both calls"
            - "FunctionalAssessment.${asmt_id}.scored_by_user_id == \"eval-1\""

      - name: no_show_ratio_pooled_then_rounded_once_mode_b
        grounds:
          - calculations.no_show_ratio_pct
          - entities.Applicant.fields.no_show_ratio_pct
          - entities.Applicant.fields.chargeable_miss_count_90d
          - entities.Applicant.fields.scheduled_trip_count_90d
          - validations[priority=48]
        distinguishing_aspect: |
          Mode (b): the scaffold pins pool-the-whole-window then divide once then round once, so three
          events spread over two calendar months give no_show_ratio_pct == 33.3; the rejected
          round-per-month-then-average order would give 25.0 on the identical rows, and the test asserts
          33.3 and explicitly asserts the value is not 25.0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, so the conduct window is the inclusive range 2026-05-04 .. 2026-08-01"
            - "one Applicant with two May trip events inside the window: one unexcused NO_SHOW dated 2026-05-20 and one COMPLETED dated 2026-05-25"
            - "no suspension proceeding exists (points 2 < 6)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Marta Quijano", date_of_birth: "1971-07-19", residence_zone: "IN_SERVICE_AREA", mobility_aid: "MANUAL_WHEELCHAIR" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-05-20", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-05-25", event_type: "COMPLETED" }
              as: ConductOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-10", event_type: "COMPLETED" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { te_july_id: $.data.id }
          assert:
            - "Applicant.${rider_id}.scheduled_trip_count_90d == 3"
            - "Applicant.${rider_id}.chargeable_miss_count_90d == 1"
            - "Applicant.${rider_id}.no_show_ratio_pct == 33.3"
            - "Applicant.${rider_id}.no_show_ratio_pct != 25.0 (the per-month-average order: May 50.0, July 0.0, mean 25.0)"
            - "Applicant.${rider_id}.no_show_points_event_basis == 2"
            - "TripEvent.${te_july_id}.points_assessed == 0"
            - "GET /applicants/${rider_id}/suspension-proceedings returns total_count == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_return_incomplete_resubmit_cycle_resets_statutory_clock
        grounds:
          - state_machines.Application.SUBMITTED_to_RETURNED_INCOMPLETE
          - state_machines.Application.RETURNED_INCOMPLETE_to_SUBMITTED
          - entities.Application.fields.resubmission_count
          - entities.Application.fields.completeness_established_at
          - entities.Application.fields.missing_items
          - calculations.application_pending_days
        distinguishing_aspect: |
          Non-linearity on the Application entity is a true cycle: SUBMITTED -> RETURNED_INCOMPLETE ->
          SUBMITTED re-enters a state already visited, and the second visit is observably different from
          the first because completeness_established_at is RESET to 2026-08-15T00:00:00.000Z rather than
          resumed, so days_pending_statutory reads 7 (not 21) at clock 2026-08-22.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Applicant and one NEW Application submitted at 2026-08-01T00:00:00Z (first visit to SUBMITTED)"
            - "the clerk returns the packet as incomplete, so completeness_established_at is null and missing_items == [\"proof of residence\"]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Nadia Brant", date_of_birth: "1954-06-03", residence_zone: "IN_SERVICE_AREA", mobility_aid: "WALKER" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 150, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/return-incomplete"
              payload: { missing_items: ["proof of residence"] }
              as: IntakeClerk
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applications/${appn_id}/submit"
              payload: { functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 150, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { cycle_status: $.data.status, cycle_count: $.data.resubmission_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: IntakeClerk
              captures: { d_stat_after_cycle: $.data.days_pending_statutory }
          assert:
            - "after return-incomplete Application.${appn_id}.status == \"RETURNED_INCOMPLETE\" and completeness_established_at == null and determination_due_date == null"
            - "after the second submit Application.${appn_id}.status == \"SUBMITTED\""
            - "Application.${appn_id}.resubmission_count == 1"
            - "Application.${appn_id}.missing_items == []"
            - "Application.${appn_id}.completeness_established_at == \"2026-08-15T00:00:00.000Z\""
            - "Application.${appn_id}.determination_due_date == \"2026-09-05\""
            - "at clock 2026-08-22T00:00:00Z Application.${appn_id}.days_pending_statutory == 7"
            - "at clock 2026-08-22T00:00:00Z Application.${appn_id}.days_pending_statutory != 21 (the pre-return elapsed days are discarded, not resumed)"

      - name: assessment_attendance_and_scoring_dimensions_evolve_independently
        grounds:
          - state_machines.FunctionalAssessment.SCHEDULED_to_ATTENDED
          - state_machines.FunctionalAssessment.NOT_STARTED_to_SCORED
          - state_machines.FunctionalAssessment.SCORED_to_SCORED
          - state_machines.FunctionalAssessment.SCORED_to_SIGNED_OFF
          - state_machines.Application.ASSESSMENT_SCHEDULED_to_ASSESSMENT_COMPLETE
          - entities.FunctionalAssessment.fields.attendance_status
          - entities.FunctionalAssessment.fields.scoring_status
        distinguishing_aspect: |
          Non-linearity on the FunctionalAssessment entity is two parallel state dimensions on one row:
          scoring_status advances NOT_STARTED -> SCORED -> SCORED -> SIGNED_OFF across three writes while
          attendance_status stays ATTENDED and attendance_recorded_at stays 2026-08-05T09:30:00.000Z, and
          only the scoring dimension's terminal step bubbles the Application to ASSESSMENT_COMPLETE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T09:30:00Z"
            - "one Applicant, one NEW Application with a RECEIVED verification (attests_permanent true), so the packet is ASSESSMENT_REQUIRED then ASSESSMENT_SCHEDULED"
            - "one FunctionalAssessment with attendance_status == ATTENDED (recorded at 2026-08-05T09:30:00Z) and scoring_status == NOT_STARTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Teo Halvorsen", date_of_birth: "1966-09-21", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 300, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. C Ngo", provider_type: "OCCUPATIONAL_THERAPIST", provider_license_number: "OT-3391" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["balance deficit"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "${slot_id}", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { asmt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /assessments/${asmt_id}/attendance"
              payload: { attendance_status: "ATTENDED" }
              as: Evaluator
              as_user_id: "eval-1"
              captures: { att_stamp: $.data.attendance_recorded_at }
          trigger:
            - call: "POST /assessments/${asmt_id}/scores"
              payload: { board_alight_score: 2, wayfinding_score: 3, distance_meters_walked: 250, heat_sensitivity_flag: true }
              as: Evaluator
              as_user_id: "eval-1"
            - call: "POST /assessments/${asmt_id}/scores"
              payload: { board_alight_score: 2, wayfinding_score: 2, distance_meters_walked: 250, heat_sensitivity_flag: true, evaluator_notes: "wayfinding re-observed" }
              as: Evaluator
              as_user_id: "eval-1"
            - call: "POST /assessments/${asmt_id}/sign-off"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { final_scoring: $.data.scoring_status, final_attendance: $.data.attendance_status }
          assert:
            - "after the first scores call FunctionalAssessment.${asmt_id}.scoring_status == \"SCORED\" and attendance_status == \"ATTENDED\""
            - "after the first scores call FunctionalAssessment.${asmt_id}.recommended_category == \"CONDITIONAL\" (d 250 < 400, max(2, 3) == 3 >= 3)"
            - "after the second scores call FunctionalAssessment.${asmt_id}.scoring_status == \"SCORED\" (self-loop) and recommended_category == \"UNCONDITIONAL\" (branch 4: 2 + 2 == 4 <= 4)"
            - "after sign-off FunctionalAssessment.${asmt_id}.scoring_status == \"SIGNED_OFF\""
