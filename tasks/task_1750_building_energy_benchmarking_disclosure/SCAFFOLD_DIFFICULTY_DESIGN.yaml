# =============================================================================
# Task 1750: Scaffold Difficulty Design (Test Targeting Index, SKILL.md §1.8)
# 9 difficulty rules x >=2 instances, every instance grounded in SCAFFOLD.yaml
# §1.1-§1.7 and replayable from empty-DB via the declared §1.5 endpoints.
# All money in cents; all datetimes ISO8601 UTC; logical clock default is
# 2026-08-01T00:00:00Z (before the 2027-06-01 deadline used in fixtures).
# Standard cycle fixture constants used below (unless overridden):
#   threshold 25000 sqft; covered types [OFFICE, MULTIFAMILY, RETAIL, HOTEL];
#   late rate 5000 cents/day, cap 60 days; NON_COMPLIANCE 500000;
#   completeness min 90; correction tolerance 5; YoY threshold 25;
#   weather_adjustment_factor 0.9; OFFICE standard {median 80, slope 2,
#   baseline_default 100, reduction 10%/yr, tolerance 5%, rate 5 c/sqft,
#   cap 1000000}.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: weather_normalized_score_diverges_from_as_reported
        grounds:
          - calculations.energy_score_labeling
          - entities.BenchmarkReport.fields.score_as_reported
          - entities.BenchmarkReport.fields.score_weather_normalized
        distinguishing_aspect: |
          Dual variant on the BenchmarkReport domain: identical aggregates yield
          score_as_reported 46 (from raw site_eui 81.89) and
          score_weather_normalized 63 (from normalized EUI 73.70 under cycle
          factor 0.9), and label_grade D follows ONLY the as-reported variant.
        test_recipe:
          setup:
            - "Owner o1; verifier v1; cycle c27 (2027, deadline 2027-06-01T00:00:00Z, standard constants) OPEN"
            - "Building b1: 50000 sqft OFFICE; units 20000/15000/5000 (common area 10000)"
            - "Consents GRANTED for units u1,u2 covering 2027-01-01..2027-12-31 -> completeness 90.00"
            - "One ELECTRICITY account; one usage record of 1200000 kWh covering the whole 2027 year (per-record 1200000*3.412 = 4094400 kBtu exactly)"
            - "Report rep1 created, submitted on time (default clock 2026-08-01), verified by v1"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner A", contact_email: "oa@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/verifiers", payload: { name: "Verifier A", license_number: "LIC-A" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "1 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u2: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u2}" }
            - { call: "POST /v1/buildings/${b1}/utility-accounts", payload: { account_number: "E-1", commodity: "ELECTRICITY" }, as: BuildingOwner, as_user_id: "${o1}", captures: { acc1: $.data.id } }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", consumption_value: 1200000 }, as: UtilityAgent }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id } }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports/${rep1}/verification-records", payload: { verifier_id: "${v1}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { vr1: $.data.id } }
          trigger:
            - { call: "POST /v1/verification-records/${vr1}/sign-off", payload: {}, as: DataVerifier, as_user_id: "${v1}" }
            - call: "GET /v1/benchmark-reports/${rep1}"
              as: ComplianceOfficer
              captures: { r_status: $.data.status, r_agg: $.data.aggregated_kbtu, r_eui: $.data.site_eui, r_score: $.data.score_as_reported, r_score_wn: $.data.score_weather_normalized, r_label: $.data.label_grade }
          assert:
            - "BenchmarkReport.${rep1}.status == VERIFIED"
            - "BenchmarkReport.${rep1}.aggregated_kbtu == 4094400  (1200000 kWh * 3.412, exact)"
            - "BenchmarkReport.${rep1}.site_eui == 81.89  (4094400/50000 = 81.888, round_half_up 2dp)"
            - "BenchmarkReport.${rep1}.score_as_reported == 46  (50 + (80-81.89)*2 = 46.22 -> 46)"
            - "BenchmarkReport.${rep1}.score_weather_normalized == 63  (normalized_eui = 81.89*0.9 = 73.70; 50 + (80-73.70)*2 = 62.6 -> 63)"
            - "BenchmarkReport.${rep1}.label_grade == D  (46 in [25,50); label follows ONLY the as-reported variant)"

      - name: late_fine_provisional_vs_final_recompute
        grounds:
          - calculations.late_submission_fine
          - entities.FineAssessment.fields.provisional_amount_cents
          - entities.FineAssessment.fields.final_amount_cents
        distinguishing_aspect: |
          Dual variant on the FineAssessment domain (different entity domain from
          the score variants): the provisional variant measures deadline ->
          submission (2 days -> 10000) and is frozen; the final variant at notice
          measures deadline -> verification (5 days -> 25000) for identical
          underlying data.
        test_recipe:
          setup:
            - "Owner o2; verifier v2; cycle c27 OPEN (standard constants)"
            - "Building b2 50000 sqft OFFICE; units 20000/15000/5000; consents for u4,u5 cover 2027 (completeness 90.00); NO usage records needed"
            - "Report rep2 DRAFT; clock set to 2027-06-03T12:00:00Z (2.5 days past deadline)"
            - "rep2 submitted late -> FineAssessment f2 ASSESSED, days_late 2, provisional 2*5000 = 10000"
            - "Verifier assigned; clock advanced to 2027-06-06T00:00:00Z; sign-off -> VERIFIED (verified_at 2027-06-06)"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner B", contact_email: "ob@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o2: $.data.id } }
            - { call: "POST /v1/verifiers", payload: { name: "Verifier B", license_number: "LIC-B" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { v2: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "2 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o2}", captures: { b2: $.data.id } }
            - { call: "POST /v1/buildings/${b2}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o2}", captures: { u4: $.data.id } }
            - { call: "POST /v1/buildings/${b2}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o2}", captures: { u5: $.data.id } }
            - { call: "POST /v1/buildings/${b2}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o2}" }
            - { call: "POST /v1/tenant-units/${u4}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o2}", captures: { cg4: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg4}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u4}" }
            - { call: "POST /v1/tenant-units/${u5}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o2}", captures: { cg5: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg5}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u5}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b2}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o2}", captures: { rep2: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-06-03T12:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/benchmark-reports/${rep2}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o2}" }
            - { call: "GET /v1/fine-assessments", payload: { building_id: "${b2}" }, as: ComplianceOfficer, captures: { f2: "$.data[0].id", f2_prov: "$.data[0].provisional_amount_cents" } }
            - { call: "POST /v1/benchmark-reports/${rep2}/verification-records", payload: { verifier_id: "${v2}" }, as: BuildingOwner, as_user_id: "${o2}", captures: { vr2: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-06-06T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/verification-records/${vr2}/sign-off", payload: {}, as: DataVerifier, as_user_id: "${v2}" }
          trigger:
            - { call: "POST /v1/fine-assessments/${f2}/notice", payload: {}, as: ComplianceOfficer, as_user_id: "officer-2", captures: { f2_final: $.data.final_amount_cents, f2_status: $.data.status } }
          assert:
            - "FineAssessment.${f2}.provisional_amount_cents == 10000  (frozen: 2 days to submission * 5000)"
            - "FineAssessment.${f2}.final_amount_cents == 25000  (recomputed: 5 days to verification * 5000)"
            - "FineAssessment.${f2}.status == NOTICED"
            - "provisional != final for identical stored inputs; variants measure different end events (submission vs verification)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: score_banding_multi_input_clamp
        grounds:
          - calculations.energy_score_labeling
          - entities.ReportingCycle.fields.performance_standards
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — score needs
          site_eui, median_eui, score_slope, plus a completeness conditional
          branch and a nested clamp; here raw = 50 + (80 - 0.27)*2 = 159.46
          would exceed the band, so the clamp pins score_as_reported to exactly
          100 and label to A.
        test_recipe:
          setup:
            - "Owner, verifier, cycle c27 OPEN (standard constants)"
            - "Building 50000 sqft OFFICE; units 20000/15000/5000; consents for u1,u2 (completeness 90.00)"
            - "One ELECTRICITY account; one usage record of 4000 kWh covering 2027 -> aggregated 13648 kBtu; site_eui 0.27"
            - "Report submitted on time and verified"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner C", contact_email: "oc@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/verifiers", payload: { name: "Verifier C", license_number: "LIC-C" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "3 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u2: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u2}" }
            - { call: "POST /v1/buildings/${b1}/utility-accounts", payload: { account_number: "E-1", commodity: "ELECTRICITY" }, as: BuildingOwner, as_user_id: "${o1}", captures: { acc1: $.data.id } }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", consumption_value: 4000 }, as: UtilityAgent }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id } }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports/${rep1}/verification-records", payload: { verifier_id: "${v1}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { vr1: $.data.id } }
          trigger:
            - { call: "POST /v1/verification-records/${vr1}/sign-off", payload: {}, as: DataVerifier, as_user_id: "${v1}" }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { r_score: $.data.score_as_reported, r_label: $.data.label_grade, r_eui: $.data.site_eui } }
          assert:
            - "BenchmarkReport.${rep1}.site_eui == 0.27  (13648/50000 = 0.27296 -> 0.27)"
            - "BenchmarkReport.${rep1}.score_as_reported == 100  (raw 50 + (80-0.27)*2 = 209.46 -> round 209 -> clamped to 100)"
            - "BenchmarkReport.${rep1}.label_grade == A  (score >= 90)"

      - name: per_record_kbtu_rounding_then_sum
        grounds:
          - calculations.whole_building_kbtu_aggregation
          - entities.UsageRecord.fields.kbtu
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins convert-and-round
          PER RECORD, then sum. Three 10.5 kWh records yield 36+36+36 = 108
          kBtu; the forbidden sum-then-round order would yield
          round(31.5*3.412) = 107 kBtu.
        test_recipe:
          setup:
            - "Owner; cycle c27 OPEN (standard constants); building 50000 sqft OFFICE (no consents needed — DRAFT creation computes aggregates regardless of completeness)"
            - "One ELECTRICITY account; three usage records of 10.5 kWh each in Jan/Feb/Mar 2027 (non-overlapping half-open periods)"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner D", contact_email: "od@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "4 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/utility-accounts", payload: { account_number: "E-1", commodity: "ELECTRICITY" }, as: BuildingOwner, as_user_id: "${o1}", captures: { acc1: $.data.id } }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2027-02-01T00:00:00Z", consumption_value: 10.5 }, as: UtilityAgent }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-02-01T00:00:00Z", period_end: "2027-03-01T00:00:00Z", consumption_value: 10.5 }, as: UtilityAgent }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-03-01T00:00:00Z", period_end: "2027-04-01T00:00:00Z", consumption_value: 10.5 }, as: UtilityAgent }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id } }
          trigger:
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { r_agg: $.data.aggregated_kbtu } }
            - { call: "GET /v1/usage-records", payload: { utility_account_id: "${acc1}" }, as: ComplianceOfficer, captures: { ur_k0: "$.data[0].kbtu", ur_k1: "$.data[1].kbtu", ur_k2: "$.data[2].kbtu" } }
          assert:
            - "each UsageRecord.kbtu == 36  (10.5 * 3.412 = 35.826 -> round_half_up -> 36 per record)"
            - "BenchmarkReport.${rep1}.aggregated_kbtu == 108  (36+36+36; sum-then-round would give 107 and is the rejected order)"

      - name: trajectory_baseline_evaluation_order
        grounds:
          - calculations.trajectory_target_eui
          - entities.BenchmarkReport.fields.target_eui
        distinguishing_aspect: |
          Mode (c): circular-looking dependency broken by the pinned evaluation
          order — bA's 2028 target uses its OWN earliest prior-cycle VERIFIED
          report (baseline 100.00 from 2027, years_elapsed 1) -> 90.00, while
          bB with no prior report uses the cycle default baseline 120 with
          years_elapsed pinned to 1 -> 108.00; neither may read the current
          report being scored.
        test_recipe:
          setup:
            - "Owner; verifier v1; cycle c27 (2027, OFFICE baseline_eui_default 100, reduction 10) OPEN; cycle c28 (2028, OFFICE baseline_eui_default 120, reduction 10, deadline 2028-06-01T00:00:00Z) OPEN"
            - "bA: 40000 sqft OFFICE; units 20000/10000 (common 8000); consents covering 2027 AND 2028 for both units (completeness 95.00 each year)"
            - "bA 2027: one NATURAL_GAS record 40000 therms -> 4000000 kBtu, eui 100.00; report submitted (clock 2027-05-15) and verified"
            - "bA 2028: one NATURAL_GAS record 40000 therms (YoY delta 0 -> no anomaly); report submitted (clock 2028-05-15)"
            - "bB: 30000 sqft OFFICE; units 20000/10000 (common 0); consents covering 2028 (completeness 100.00); NO usage records; 2028 report submitted (clock 2028-05-15)"
          setup_api_calls:
