# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 22 instances across the nine Difficulty Rules of SKILL.md §0.5.
# All fixture datetimes are >= the logical-clock boot default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: seigniorage_budgeted_vs_realized_on_fulfillment
        grounds:
          - calculations.budgeted_unit_seigniorage
          - calculations.realized_unit_blank_cost
          - entities.FederalReserveOrder.fields.budgeted_seigniorage_cents
          - entities.FederalReserveOrder.fields.realized_seigniorage_cents
        distinguishing_aspect: |
          Circulating-production domain: the SAME fulfilled order carries budgeted seigniorage
          (denomination budget cost snapshot, 19.00c/unit) and realized seigniorage (delivered-lot
          weighted unit cost 5.11c/blank), and the two variants differ by exactly 111000 cents.
        test_recipe:
          setup:
            - "QUARTER denomination: face 25c, budget blank 4.0c, striking 2.0c, 176000 blanks/tonne"
            - "Fed order FY2026 for 100000 QUARTERs; one hedged lot of 10t COPPER locked at 900000c/t delivered (1760000 blanks, realized cost 9000000c)"
            - "one run of 100000 pieces struck and completed with good_pieces 100000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 100000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 10, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 900000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots/${lot_id}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T16:00:00Z", planned_quantity: 100000 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /mint/production-runs/${run_id}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run_id}/inspect"
              payload: { outcome: "PASS", good_pieces: 100000 }
              as: QualityInspector
          trigger:
            - call: "GET /mint/federal-reserve-orders/${fo_id}"
              as: FedLiaison
            - call: "GET /mint/reports/seigniorage"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER" }
              as: FinanceOfficer
          assert:
            - "FederalReserveOrder.${fo_id}.status == FULFILLED"
            - "FederalReserveOrder.${fo_id}.budgeted_seigniorage_cents == 1900000.0 (100000 x (25 - 4.0 - 2.0))"
            - "FederalReserveOrder.${fo_id}.realized_seigniorage_cents == 1789000.0 (realized unit blank cost round_half_up(9000000/1760000, 2) = 5.11; unit margin 25 - 5.11 - 2.0 = 17.89; x 100000)"
            - "seigniorage report row for QUARTER: budgeted_seigniorage_cents == 1900000.0 and realized_seigniorage_cents == 1789000.0; the two variants differ by 111000.0 cents"

      - name: metal_exposure_mark_to_market_vs_budget_variance
        grounds:
          - calculations.metal_cost_exposure
          - entities.MetalProcurementLot.fields.order_spot_cents_per_tonne
          - entities.MetalProcurementLot.fields.budget_price_cents_per_tonne
        distinguishing_aspect: |
          Metal-procurement domain (different entity domain from the seigniorage instance): the same
          unhedged 20t lot yields exposure 2000000c under mark_to_market (vs order-time spot 800000)
          but 3000000c under budget_variance (vs budget price 750000), and the hedged 10t lot in the
          same commodity contributes 0 to both variants.
        test_recipe:
          setup:
            - "QUARTER denomination exists; COPPER spot 800000c/t at lot creation, 900000c/t at report time"
            - "lot HEDGED: 10t locked 820000 (excluded from both variants); lot UNHEDGED: 20t, budget 750000, no lock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 10, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 820000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 20, budget_price_cents_per_tonne: 750000, vault: "FORT_KNOX", planned_delivery_date: "2026-09-06" }
              as: ProcurementOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z", spot_prices: { COPPER: 900000 } }
              as: PlatformAdmin
          trigger:
            - call: "GET /mint/reports/metal-exposure"
              payload: { variant: "mark_to_market", commodity: "COPPER" }
              as: FinanceOfficer
            - call: "GET /mint/reports/metal-exposure"
              payload: { variant: "budget_variance", commodity: "COPPER" }
              as: FinanceOfficer
          assert:
            - "mark_to_market row for COPPER: exposure_cents == 2000000 (20t x (900000 - 800000); hedged 10t lot excluded)"
            - "budget_variance row for COPPER: exposure_cents == 3000000 (20t x (900000 - 750000))"
            - "the two variants differ by 1000000 cents for identical lot data"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (3 instances, modes a, b, c)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: bullion_price_tier_plus_bracket_composition
        grounds:
          - calculations.bullion_settlement_price
          - entities.BullionAllocation.fields.total_price_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: settlement premium combines AP tier bps
          AND a quantity-bracket bps on total ounces; T2 x 50oz gives 650bps -> 13312500c while
          T1 x 500oz gives 300bps -> 128750000c (bracket flips to 0 at exactly 500oz).
        test_recipe:
          setup:
            - "GOLD spot 250000c/oz; bullion issue with unit_weight_oz 1.0 and pool 1000; AP tier T2 and AP tier T1 both APPROVED"
            - "offer of 50 units to the T2 purchaser (issue version advanced to 2); offer of 500 units to the T1 purchaser (issue version 3)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "American Gold Eagle 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 1000, offer_window_hours: 48 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer Tier Two", tier: "T2" }
              as: PlatformAdmin
              captures: { ap_t2: $.data.id }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer Tier One", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_t1: $.data.id }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_t2}", quantity_units: 50, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { alloc_t2: $.data.id }
            - call: "GET /mint/bullion-issues/${issue_id}"
              as: ProgramManager
              captures: { issue_v2: $.data.version }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_t1}", quantity_units: 500, expected_bullion_issue_version: "${issue_v2}" }
              as: ProgramManager
              captures: { alloc_t1: $.data.id }
          trigger:
            - call: "POST /mint/allocations/${alloc_t2}/confirm"
              as: BullionDealer
              as_user_id: "${ap_t2}"
            - call: "POST /mint/allocations/${alloc_t1}/confirm"
              as: BullionDealer
              as_user_id: "${ap_t1}"
          assert:
            - "BullionAllocation.${alloc_t2}.total_price_cents == 13312500 (50oz x 250000 x (1 + (450+200)/10000))"
            - "BullionAllocation.${alloc_t1}.total_price_cents == 128750000 (500oz x 250000 x (1 + (300+0)/10000); bracket >= 500oz adds 0bps)"
            - "BullionIssue.${issue_id}.remaining_pool_units == 450"

      - name: subscription_invoice_per_unit_rounding_before_multiplication
        grounds:
          - calculations.subscription_invoice_amount
          - entities.SubscriptionInvoice.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: the 10% subscriber discount is rounded half-up per
          unit BEFORE multiplying by units_per_cycle. price 9995c -> unit_net 8996c (8995.5 rounds up),
          invoice 8996 x 2 + 495 == 18487c; the rejected round-after-multiply order would give 18486c.
        test_recipe:
          setup:
            - "subscription-eligible product SUB-SERIES-1 at price 9995c is ON_SALE"
            - "collector enrolled with units_per_cycle 2, MONTHLY; next_billing_date initialized to the clock date so billing is immediately due"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "SUB-SERIES-1", product_family: "SUBFAM", product_type: "SUBSCRIPTION_SERIES", price_cents: 9995, mintage_limit: 10000, household_order_limit: 1000, release_datetime: "2026-08-15T00:00:00Z", subscription_eligible: true }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Collector One", email: "c1@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/subscriptions"
              payload: { product_id: "${p_id}", units_per_cycle: 2, frequency: "MONTHLY" }
              as: Collector
              as_user_id: "${c1}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /mint/subscriptions/${sub_id}/billing-cycle"
              payload: { expected_subscription_version: "${sub_v}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "SubscriptionInvoice.${inv_id}.amount_cents == 18487 (round_half_up(9995 x 0.90) = 8996 per unit; 8996 x 2 = 17992; + 495 shipping for <= 3 units)"
            - "SubscriptionInvoice.${inv_id}.status == PENDING and period_index == 1"
            - "Subscription.${sub_id}.next_billing_date == 2026-10-01 and cycles_billed == 1"

      - name: program_net_proceeds_pinned_evaluation_order
        grounds:
          - calculations.program_net_proceeds
          - entities.CommemorativeProgram.fields.net_proceeds_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking definition with pinned evaluation order: admin fee is 5% of
          (gross - direct_costs), NOT 5% of gross. gross 2000000, direct 1200000 -> base 800000,
          fee 40000, net 760000; fee-on-gross would wrongly give net 700000.
        test_recipe:
          setup:
            - "commemorative program (direct_costs 1200000c, surcharge 1000c/unit, cap 350000c) approved and ON_SALE in its statutory window"
            - "one product CX-1 (price 5000c, mintage 400) under the program; one collector household buys all 400 units and pays 2000000c"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/commemorative-programs"
              payload: { name: "Harbor Centennial", statute_reference: "PL 119-10", max_mintage_legal: 1000, surcharge_cents_per_unit: 1000, beneficiary_name: "Harbor Foundation", beneficiary_cap_cents: 350000, direct_costs_cents: 1200000, sales_window_start: "2026-09-15T00:00:00Z", sales_window_end: "2026-12-31T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /mint/commemorative-programs/${prog_id}/decide-design"
              payload: { decision: "APPROVED" }
              as: MintDirector
            - call: "POST /mint/products"
              payload: { product_code: "CX-1", program_id: "${prog_id}", product_family: "CXF", product_type: "COMMEMORATIVE", price_cents: 5000, mintage_limit: 400, household_order_limit: 500, release_datetime: "2026-09-16T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Buyer One", email: "b1@example.com", household_id: "HH-N" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 400 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o_id: $.data.id }
            - call: "POST /mint/orders/${o_id}/pay"
              payload: { amount_cents: 2000000 }
              as: Collector
              as_user_id: "${c1}"
          trigger:
            - call: "GET /mint/commemorative-programs/${prog_id}"
              as: FinanceOfficer
          assert:
            - "CommemorativeProgram.${prog_id}.gross_receipts_cents == 2000000"
            - "CommemorativeProgram.${prog_id}.net_proceeds_cents == 760000 (base 800000; admin fee round_half_up(800000 x 0.05) = 40000; net 760000)"
            - "CommemorativeProgram.${prog_id}.surcharge_accrued_cents == 400000 (400 paid units x 1000c; NOT net of admin fee)"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: production_run_rework_cycle_consumes_fresh_blanks
        grounds:
          - state_machines.ProductionRun.INSPECTION_to_REWORK
          - state_machines.ProductionRun.REWORK_to_STRIKING
        distinguishing_aspect: |
          Cycle on ProductionRun: STRIKING -> INSPECTION -> REWORK -> STRIKING -> INSPECTION ->
          COMPLETED; the rework loop scraps the first reservation (100000 pieces) and consumes a
          FRESH 100000-blank reservation on restart, so produced 99500 + scrapped 100500 == 200000
          pieces drawn against 1760000 delivered.
        test_recipe:
          setup:
            - "QUARTER denomination with 1760000 blanks delivered; FY2026 order for 100000; one run of 100000 on DENVER/P7"
            - "run started, inspection FAIL -> REWORK (rework_count 1, all 100000 reserved pieces scrapped)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 100000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 10, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 900000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots/${lot_id}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P7", planned_start: "2026-10-06T08:00:00Z", planned_end: "2026-10-06T12:00:00Z", planned_quantity: 100000 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /mint/production-runs/${run_id}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run_id}/inspect"
              payload: { outcome: "FAIL" }
              as: QualityInspector
          trigger:
            - call: "POST /mint/production-runs/${run_id}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run_id}/inspect"
              payload: { outcome: "PASS", good_pieces: 99500 }
              as: QualityInspector
          assert:
            - "ProductionRun.${run_id}.status == COMPLETED after the REWORK -> STRIKING -> INSPECTION -> COMPLETED loop"
            - "ProductionRun.${run_id}.rework_count == 1"
            - "ProductionRun.${run_id}.produced_pieces == 99500 and scrapped_pieces == 100500 (100000 from the failed strike + 500 from the passed strike)"
            - "seigniorage report row for QUARTER: blanks_on_hand_pieces == 1560000 (1760000 delivered - 200000 drawn across both strikes)"

      - name: order_payment_and_allocation_dimensions_evolve_independently
        grounds:
          - state_machines.NumismaticOrder
          - entities.NumismaticOrder.fields.payment_status
          - entities.NumismaticOrder.fields.allocation_status
        distinguishing_aspect: |
          Two independent state dimensions on ONE entity (different entity from the run cycle):
          a WAITLISTED order is UNPAID and cannot pay (ERR_ORDER_NOT_PAYABLE) while its allocation
          dimension stays WAITLISTED; after the blocker order is cancelled the same order promotes to
          ALLOCATED while payment_status remains UNPAID, proving the dimensions evolve independently.
        test_recipe:
          setup:
            - "product DIMS-1 (price 2000c, mintage 10, household limit 10) ON_SALE"
            - "collector c1 (household HH-A) holds order o1 qty 2 ALLOCATED; collector c2 (household HH-B) holds order o2 qty 9 WAITLISTED (2 + 9 > 10)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "DIMS-1", product_family: "DFAM", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 10, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Collector A", email: "ca@example.com", household_id: "HH-A" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "Collector B", email: "cb@example.com", household_id: "HH-B" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 2 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o1: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 9 }
              as: Collector
              as_user_id: "${c2}"
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /mint/orders/${o2}/pay"
              payload: { amount_cents: 18000 }
              as: Collector
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
            - call: "POST /mint/orders/${o1}/pay"
              payload: { amount_cents: 4000 }
              as: Collector
              as_user_id: "${c1}"
            - call: "POST /mint/orders/${o1}/cancel"
              as: Collector
              as_user_id: "${c1}"
            - call: "GET /mint/orders/${o2}"
              as: ProgramManager
          assert:
            - "first trigger call: err == ERR_ORDER_NOT_PAYABLE (WAITLISTED orders are not payable) and o2.payment_status stays UNPAID"
            - "after o1 pays: o1.payment_status == PAID and o1.status == COMPLETED (ALLOCATED + PAID)"
            - "after o1 cancels: o1.payment_status == REFUNDED and o1.allocation_status == RELEASED and o1.status == CANCELLED"
            - "o2 promoted by the released units: o2.allocation_status == ALLOCATED while o2.payment_status == UNPAID and o2.status == ACTIVE"

      - name: subscription_dunning_cycle_recovers_to_active
        grounds:
          - state_machines.Subscription.ACTIVE_to_DUNNING
          - state_machines.Subscription.DUNNING_to_ACTIVE
          - state_machines.SubscriptionInvoice.FAILED_to_PAID
        distinguishing_aspect: |
          Cycle on Subscription (different entity from ProductionRun and NumismaticOrder):
          ACTIVE -> DUNNING -> ACTIVE driven by invoice retry; the failed invoice itself cycles
          FAILED -> PAID with attempts monotonically increasing (1 then 2).
        test_recipe:
          setup:
            - "subscription-eligible product ON_SALE; collector subscription (units 2, MONTHLY) ACTIVE with an immediately-due billing date"
            - "first billing cycle produced invoice amount 18487c"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "SUB-SERIES-1", product_family: "SUBFAM", product_type: "SUBSCRIPTION_SERIES", price_cents: 9995, mintage_limit: 10000, household_order_limit: 1000, release_datetime: "2026-08-15T00:00:00Z", subscription_eligible: true }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Collector One", email: "c1@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/subscriptions"
              payload: { product_id: "${p_id}", units_per_cycle: 2, frequency: "MONTHLY" }
              as: Collector
              as_user_id: "${c1}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /mint/subscriptions/${sub_id}/billing-cycle"
              payload: { expected_subscription_version: "${sub_v}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /mint/subscription-invoices/${inv_id}/pay"
              payload: { outcome: "FAILED" }
              as: Collector
              as_user_id: "${c1}"
            - call: "POST /mint/subscription-invoices/${inv_id}/pay"
              payload: { outcome: "SUCCEEDED" }
              as: Collector
              as_user_id: "${c1}"
          assert:
            - "after the failed attempt: SubscriptionInvoice.${inv_id}.status == FAILED and attempts == 1 and Subscription.${sub_id}.status == DUNNING"
            - "after the successful retry: SubscriptionInvoice.${inv_id}.status == PAID and attempts == 2"
            - "Subscription.${sub_id}.status == ACTIVE again (DUNNING -> ACTIVE cycle closed)"

  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth >= 3 and >= 2)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: run_completion_bubbles_fulfillment_and_seigniorage
        grounds:
          - state_machines.ProductionRun.INSPECTION_to_COMPLETED
          - state_machines.FederalReserveOrder.FULFILLING_to_FULFILLED
          - calculations.realized_unit_blank_cost
        distinguishing_aspect: |
          Depth-3 chain triggered by the inspect call (different trigger from the order-cancel chain):
          run COMPLETED -> order.quantity_fulfilled_pieces += produced -> order auto-flips to
          FULFILLED at equality -> order.realized_seigniorage_cents finalized from null to 1789000.
        test_recipe:
          setup:
            - "QUARTER denomination; hedged 10t lot delivered (realized unit blank cost 5.11c); FY2026 order for 100000 pieces"
            - "two runs on different press lines: run1 60000 pieces, run2 40000 pieces; run1 already COMPLETED (order FULFILLING, fulfilled 60000, realized still null)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 100000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 10, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 900000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots/${lot_id}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 60000 }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P2", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 40000 }
              as: ProductionPlanner
              captures: { run2: $.data.id }
            - call: "POST /mint/production-runs/${run1}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run1}/inspect"
              payload: { outcome: "PASS", good_pieces: 60000 }
              as: QualityInspector
          trigger:
            - call: "POST /mint/production-runs/${run2}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run2}/inspect"
              payload: { outcome: "PASS", good_pieces: 40000 }
              as: QualityInspector
            - call: "GET /mint/federal-reserve-orders/${fo_id}"
              as: FedLiaison
          assert:
            - "after run1 completed (pre-trigger state): order.quantity_fulfilled_pieces == 60000 and status == FULFILLING and realized_seigniorage_cents == null"
            - "after run2 completes: order.quantity_fulfilled_pieces == 100000"
            - "order.status == FULFILLED (auto-transition at fulfilled >= ordered)"
            - "order.realized_seigniorage_cents == 1789000.0 finalized exactly at the FULFILLED hop"

      - name: order_cancel_releases_units_and_promotes_waitlist
        grounds:
          - state_machines.NumismaticOrder
          - calculations.waitlist_promotion
          - state_machines.NumismaticProduct.SOLD_OUT_to_ON_SALE
          - state_machines.NumismaticProduct.ON_SALE_to_SOLD_OUT
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (order cancel, not run inspect): cancel of the
          3-unit order -> product releases 3 units and flips SOLD_OUT -> ON_SALE -> earliest
          waitlisted order (qty 2) promotes and mutates product again -> next waitlisted order
          (qty 1) promotes and product flips back to SOLD_OUT at allocated == mintage_limit.
        test_recipe:
          setup:
            - "product PROMO-1 (price 3000c, mintage 3, household limit 10) ON_SALE"
            - "order A (collector c1, household HH-A) qty 3 ALLOCATED (product SOLD_OUT); order B (c2, HH-B) qty 2 WAITLISTED; order C (c3, HH-C) qty 1 WAITLISTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "PROMO-1", product_family: "PF1", product_type: "PROOF_SET", price_cents: 3000, mintage_limit: 3, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "A", email: "a@example.com", household_id: "HH-A" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "B", email: "b@example.com", household_id: "HH-B" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "C", email: "c@example.com", household_id: "HH-C" }
              as: Anonymous
              captures: { c3: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 3 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o_a: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 2 }
              as: Collector
              as_user_id: "${c2}"
              captures: { o_b: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c3}"
              captures: { o_c: $.data.id }
          trigger:
            - call: "POST /mint/orders/${o_a}/cancel"
              as: Collector
              as_user_id: "${c1}"
          assert:
            - "NumismaticOrder.${o_a}.allocation_status == RELEASED and status == CANCELLED (payment_status stays UNPAID, no refund owed)"
            - "NumismaticOrder.${o_b}.allocation_status == ALLOCATED (earliest waitlisted, fits the 3 released units)"
            - "NumismaticOrder.${o_c}.allocation_status == ALLOCATED (fits the 1 unit remaining after B's promotion)"
            - "NumismaticProduct.${p_id}.allocated_units == 3 and status == SOLD_OUT again after the promotion chain"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (3 instances, different category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: run_start_state_error_beats_blanks_fiscal_error
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.ProductionRun.PLANNED_to_STRIKING
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the run's linked order is CANCELLED
          (state violation, priority 5) AND the denomination holds zero blanks
          (fiscal/capacity violation, priority 10) — the state error ERR_RUN_NOT_STARTABLE wins.
        test_recipe:
          setup:
            - "QUARTER denomination exists with blank_stock_pieces == 0 (no lot delivered)"
            - "Fed order for 50000 QUARTERs submitted then cancelled; a run for 50000 is created afterwards against the CANCELLED order (creation requires only order existence)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 50000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/federal-reserve-orders/${fo_id}/cancel"
              as: FedLiaison
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P3", planned_start: "2026-10-07T08:00:00Z", planned_end: "2026-10-07T12:00:00Z", planned_quantity: 50000 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /mint/production-runs/${run_id}/start"
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RUN_NOT_STARTABLE (state, priority 5), NOT ERR_BLANKS_INSUFFICIENT (business_fiscal, priority 10), even though blank_stock_pieces == 0 would also fail"

      - name: product_unknown_program_beats_release_gap_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - calculations.release_family_gap
        distinguishing_aspect: |
          Error-category pair (business_referential, business_temporal): the create carries an
          unknown program_id (referential, priority 6) AND a release 1 hour after an existing
          same-family product (temporal gap violation, priority 8) — ERR_UNKNOWN_PROGRAM wins.
        test_recipe:
          setup:
            - "product GAP-1 in family GAPF with release_datetime 2026-10-01T14:00:00Z exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "GAP-1", product_family: "GAPF", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /mint/products"
              payload: { product_code: "GAP-2", program_id: "00000000-0000-0000-0000-000000000000", product_family: "GAPF", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 50, household_order_limit: 10, release_datetime: "2026-10-01T15:00:00Z" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNKNOWN_PROGRAM (business_referential, priority 6), NOT ERR_RELEASE_GAP_VIOLATION (business_temporal, priority 8), even though the 1-hour gap would also fail"

      - name: allocation_ap_status_error_beats_pool_fiscal_error
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.BullionAllocation
        distinguishing_aspect: |
          Error-category pair (business_referential, business_fiscal): the authorized purchaser is
          SUSPENDED (referential gate, priority 6) AND the offered quantity exceeds the remaining
          pool (fiscal, priority 10) — ERR_AP_NOT_APPROVED wins.
        test_recipe:
          setup:
            - "GOLD spot established; bullion issue with total_pool_units 10; authorized purchaser created APPROVED then SUSPENDED by the MintDirector"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 10, offer_window_hours: 48 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Suspended Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/authorized-purchasers/${ap_id}/set-status"
              payload: { to_status: "SUSPENDED" }
              as: MintDirector
          trigger:
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 50, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AP_NOT_APPROVED (business_referential, priority 6), NOT ERR_POOL_INSUFFICIENT (business_fiscal, priority 10), even though 50 > remaining_pool_units 10 would also fail"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (3 instances, different metrics/endpoints)
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: household_limit_exact_equality_accepted
        grounds:
          - calculations.household_order_limit_check
          - validations[priority=10]
        distinguishing_aspect: |
          Metric: household aggregate units on POST /mint/orders. Limit 2 with two collectors sharing
          one household: 1 + 1 == 2 is accepted (<= boundary), the third unit fails — equality at the
          limit is the acceptance boundary, not the rejection boundary.
        test_recipe:
          setup:
            - "product HL-1 (mintage 100, household_order_limit 2) ON_SALE; collectors c1 and c2 share household_id HH-SHARED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "HL-1", product_family: "HLF", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 2, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Shared One", email: "s1@example.com", household_id: "HH-SHARED" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "Shared Two", email: "s2@example.com", household_id: "HH-SHARED" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c2}"
              captures: { o2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "second order accepted: NumismaticOrder.${o2}.allocation_status == ALLOCATED (household total reaches exactly 2 == limit)"
            - "third order rejected: err == ERR_HOUSEHOLD_LIMIT_EXCEEDED (2 + 1 > 2)"
            - "household aggregation spans BOTH collectors sharing household_id (c1's unit counts against c2's limit)"

      - name: bullion_pool_exact_equality_accepted
        grounds:
          - entities.BullionIssue.fields.remaining_pool_units
          - validations[priority=10]
        distinguishing_aspect: |
          Metric: bullion pool units on POST /mint/bullion-issues/{id}/allocations (different metric
          and endpoint from the household limit). Offering exactly the remaining 100 units succeeds;
          one more unit fails ERR_POOL_INSUFFICIENT.
        test_recipe:
          setup:
            - "GOLD spot established; issue pool 100; AP tier T1 APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 100, offer_window_hours: 48 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 100, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { alloc_id: $.data.id }
            - call: "GET /mint/bullion-issues/${issue_id}"
              as: ProgramManager
              captures: { issue_v2: $.data.version }
          trigger:
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 1, expected_bullion_issue_version: "${issue_v2}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "BullionAllocation.${alloc_id}.status == OFFERED (offer of exactly 100 == remaining pool accepted)"
            - "BullionIssue.${issue_id}.remaining_pool_units == 0 after the first offer"
            - "err == ERR_POOL_INSUFFICIENT for the 1-unit follow-up offer"

      - name: vault_capacity_exact_fifty_tonnes_accepted
        grounds:
          - validations[priority=9]
          - state_machines.MetalProcurementLot.ORDERED_to_DELIVERED
        distinguishing_aspect: |
          Metric: same-day vault tonnage on POST /mint/metal-procurement-lots/{id}/receive (different
          metric and endpoint from household units and pool units). 30t + 20t == 50t exactly is
          accepted; a further 1t delivery the same day fails.
        test_recipe:
          setup:
            - "clock at 2026-09-10 with COPPER spot; QUARTER denomination; three ORDERED lots all bound for WEST_POINT: 30t, 20t, 1t"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 30, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 800000, vault: "WEST_POINT", planned_delivery_date: "2026-09-10" }
              as: ProcurementOfficer
              captures: { lot1: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 20, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 800000, vault: "WEST_POINT", planned_delivery_date: "2026-09-10" }
              as: ProcurementOfficer
              captures: { lot2: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 1, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 800000, vault: "WEST_POINT", planned_delivery_date: "2026-09-10" }
              as: ProcurementOfficer
              captures: { lot3: $.data.id }
          trigger:
            - call: "POST /mint/metal-procurement-lots/${lot1}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/metal-procurement-lots/${lot2}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/metal-procurement-lots/${lot3}/receive"
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "lot1 and lot2 reach DELIVERED (30 + 20 == 50 == VAULT_DAILY_CAPACITY_TONNES is accepted)"
            - "err == ERR_VAULT_CAPACITY_EXCEEDED for the 1t lot (51 > 50)"

  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_start_blocked_when_fed_order_cancelled
        grounds:
          - state_machines.ProductionRun.PLANNED_to_STRIKING
          - entities.ProductionRun.fields.fed_order_id
        distinguishing_aspect: |
          Pair ProductionRun x FederalReserveOrder: with blanks fully stocked (no other failure
          present), a run whose linked order is CANCELLED cannot start — ERR_RUN_NOT_STARTABLE
          isolates the cross-entity state gate.
        test_recipe:
          setup:
            - "QUARTER denomination; 10t lot delivered (blanks 1760000, more than sufficient)"
            - "order for 50000 cancelled while SUBMITTED; run for 50000 created afterwards against the CANCELLED order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 10, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 900000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots/${lot_id}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 50000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/federal-reserve-orders/${fo_id}/cancel"
              as: FedLiaison
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P3", planned_start: "2026-10-07T08:00:00Z", planned_end: "2026-10-07T12:00:00Z", planned_quantity: 50000 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /mint/production-runs/${run_id}/start"
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RUN_NOT_STARTABLE with blank_stock_pieces 1760000 >= 50000 (only the order-state gate fails)"
            - "ProductionRun.${run_id}.status remains PLANNED"

      - name: product_held_scheduled_until_program_on_sale
        grounds:
          - state_machines.NumismaticProduct.SCHEDULED_to_ON_SALE
          - entities.NumismaticProduct.fields.program_id
        distinguishing_aspect: |
          Pair NumismaticProduct x CommemorativeProgram: the product's release_datetime has passed
          but its program is only APPROVED_FOR_SALE (statutory window not yet open), so the clock
          sweep does NOT flip the product to ON_SALE and orders are rejected — the product's
          transition depends on the program's state.
        test_recipe:
          setup:
            - "program approved for sale with sales window starting 2026-09-15; product CX-GATE under it with release_datetime 2026-09-10T00:00:00Z"
            - "clock advanced to 2026-09-12 (past release, before window start)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/commemorative-programs"
              payload: { name: "Gated Program", statute_reference: "PL 119-11", max_mintage_legal: 5000, surcharge_cents_per_unit: 500, beneficiary_name: "Gate Foundation", beneficiary_cap_cents: 100000, direct_costs_cents: 1000, sales_window_start: "2026-09-15T00:00:00Z", sales_window_end: "2026-12-31T00:00:00Z" }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /mint/commemorative-programs/${prog_id}/decide-design"
              payload: { decision: "APPROVED" }
              as: MintDirector
            - call: "POST /mint/products"
              payload: { product_code: "CX-GATE", program_id: "${prog_id}", product_family: "PGATE", product_type: "COMMEMORATIVE", price_cents: 3000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-09-10T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Gate Buyer", email: "gate@example.com", household_id: "HH-G" }
              as: Anonymous
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /mint/products/${p_id}"
              as: ProgramManager
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "NumismaticProduct.${p_id}.status == SCHEDULED after the clock sweep (program not yet ON_SALE blocks the release flip)"
            - "err == ERR_PRODUCT_NOT_ORDERABLE"

      - name: allocation_offer_blocked_when_ap_terminated
        grounds:
          - state_machines.BullionAllocation
          - state_machines.AuthorizedPurchaser.APPROVED_to_TERMINATED
          - validations[priority=6]
        distinguishing_aspect: |
          Pair BullionAllocation x AuthorizedPurchaser (different pair from the run/order and
          product/program instances): an offer naming a TERMINATED purchaser fails with
          ERR_AP_NOT_APPROVED even though the pool has ample units.
        test_recipe:
          setup:
            - "GOLD spot; issue pool 1000; purchaser created APPROVED then TERMINATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 1000, offer_window_hours: 48 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Doomed Dealer", tier: "T3" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/authorized-purchasers/${ap_id}/set-status"
              payload: { to_status: "TERMINATED" }
              as: MintDirector
          trigger:
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 5, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AP_NOT_APPROVED"
            - "BullionIssue.${issue_id}.remaining_pool_units == 1000 (no units held by the rejected offer)"

  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (3 instances, different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: press_window_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.press_window_overlap
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the (facility, press_line) resource —
          back-to-back runs (one ends 12:00, next starts 12:00) do NOT collide, but a run straddling
          11:00-13:00 does; the same straddling window on a different press line is fine.
        test_recipe:
          setup:
            - "QUARTER denomination and a Fed order exist; no blanks needed (run creation does not reserve)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 500000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 100000 }
              as: ProductionPlanner
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P1", planned_start: "2026-10-05T12:00:00Z", planned_end: "2026-10-05T14:00:00Z", planned_quantity: 50000 }
              as: ProductionPlanner
              captures: { run2: $.data.id }
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P1", planned_start: "2026-10-05T11:00:00Z", planned_end: "2026-10-05T13:00:00Z", planned_quantity: 50000 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P2", planned_start: "2026-10-05T11:00:00Z", planned_end: "2026-10-05T13:00:00Z", planned_quantity: 50000 }
              as: ProductionPlanner
              captures: { run4: $.data.id }
          assert:
            - "ProductionRun.${run2}.status == PLANNED (adjacent start == prior end is NOT an overlap under half-open semantics)"
            - "err == ERR_PRESS_WINDOW_OVERLAP for the 11:00-13:00 straddle on P1"
            - "ProductionRun.${run4}.status == PLANNED (same window on a different press line does not collide)"

      - name: release_family_minimum_gap_boundary
        grounds:
          - calculations.release_family_gap
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics: minimum-gap rule (NOT overlap) — two non-withdrawn products in the same
          family must be >= 24h apart; 20h apart is rejected, exactly 24h apart is accepted.
          Different geometric treatment from the press-window half-open overlap.
        test_recipe:
          setup:
            - "no products yet; family RGF"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "RG-1", product_family: "RGF", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z" }
              as: ProgramManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /mint/products"
              payload: { product_code: "RG-2", product_family: "RGF", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-02T10:00:00Z" }
              as: ProgramManager
              captures: { err: $.data.error_id }
            - call: "POST /mint/products"
              payload: { product_code: "RG-3", product_family: "RGF", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-02T14:00:00Z" }
              as: ProgramManager
              captures: { p3: $.data.id }
          assert:
            - "err == ERR_RELEASE_GAP_VIOLATION (20h gap < 24h)"
            - "NumismaticProduct.${p3}.status == SCHEDULED (exactly 24h gap satisfies >= boundary)"

      - name: vault_daily_aggregate_capacity_across_lots
        grounds:
          - validations[priority=9]
          - state_machines.MetalProcurementLot.ORDERED_to_DELIVERED
        distinguishing_aspect: |
          Interval semantics: aggregate daily capacity (NOT pairwise overlap, NOT gap) — deliveries
          to the same vault on the same UTC date sum against a 50t budget; 30t + 30t fails at 60,
          and the same 30t delivery succeeds after the clock rolls to the next day.
        test_recipe:
          setup:
            - "clock at 2026-09-10 with COPPER spot; QUARTER denomination; two ORDERED 30t lots bound for FORT_KNOX"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 30, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 800000, vault: "FORT_KNOX", planned_delivery_date: "2026-09-10" }
              as: ProcurementOfficer
              captures: { lot1: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 30, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 800000, vault: "FORT_KNOX", planned_delivery_date: "2026-09-11" }
              as: ProcurementOfficer
              captures: { lot2: $.data.id }
            - call: "POST /mint/metal-procurement-lots/${lot1}/receive"
              as: ProcurementOfficer
          trigger:
            - call: "POST /mint/metal-procurement-lots/${lot2}/receive"
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/metal-procurement-lots/${lot2}/receive"
              as: ProcurementOfficer
          assert:
            - "err == ERR_VAULT_CAPACITY_EXCEEDED (30 + 30 = 60 > 50 on 2026-09-10)"
            - "after the clock rolls to 2026-09-11 the same receive succeeds: MetalProcurementLot.${lot2}.status == DELIVERED (aggregate resets per UTC date)"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant (3 instances, different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: blank_pieces_conserved_across_reserve_strike_scrap
        grounds:
          - calculations.blank_stock_reconciliation
          - entities.Denomination.fields.blank_stock_pieces
        distinguishing_aspect: |
          Conserved quantity: blank pieces per denomination. Across reserve -> partial-scrap on PASS
          -> total-scrap on FAIL (the compensating actions of starting/inspecting), the identity
          stock + reserved + produced + scrapped == delivered holds exactly:
          1560000 + 0 + 98000 + 102000 == 1760000.
        test_recipe:
          setup:
            - "QUARTER denomination; 10t lot delivered (1760000 blanks); Fed order for 300000 pieces"
            - "run1 100000 pieces: started then PASS with good_pieces 98000; run2 100000 pieces: started then FAIL"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 300000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 10, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 900000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots/${lot_id}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 100000 }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "PHILADELPHIA", press_line: "P2", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 100000 }
              as: ProductionPlanner
              captures: { run2: $.data.id }
            - call: "POST /mint/production-runs/${run1}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run1}/inspect"
              payload: { outcome: "PASS", good_pieces: 98000 }
              as: QualityInspector
            - call: "POST /mint/production-runs/${run2}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run2}/inspect"
              payload: { outcome: "FAIL" }
              as: QualityInspector
          trigger:
            - call: "GET /mint/reports/seigniorage"
              payload: { denomination_code: "QUARTER" }
              as: FinanceOfficer
          assert:
            - "report row QUARTER: blanks_delivered_pieces == 1760000"
            - "report row QUARTER: blanks_on_hand_pieces == 1560000 and blanks_reserved_pieces == 0 and blanks_produced_pieces == 98000 and blanks_scrapped_pieces == 102000"
            - "conservation: 1560000 + 0 + 98000 + 102000 == 1760000 (no blank created or destroyed by the reserve/inspect/fail cycle)"

      - name: bullion_pool_conserved_across_offer_settle_expire
        grounds:
          - entities.BullionIssue.fields.remaining_pool_units
          - state_machines.BullionAllocation.OFFERED_to_EXPIRED
          - state_machines.BullionAllocation.CONFIRMED_to_SETTLED
        distinguishing_aspect: |
          Conserved quantity: bullion pool units (different quantity from blank pieces). Offer +
          settle + expiry are compensating paths through the pool: after a 50-unit offer settles and
          a 100-unit offer expires, remaining == 950 and 950 + 50 (settled) == 1000 total exactly.
        test_recipe:
          setup:
            - "clock 2026-09-10T00:00:00Z with GOLD spot 250000; issue pool 1000, offer_window_hours 48; T1 purchaser APPROVED"
            - "offer1 of 50 units (issue version 2); offer2 of 100 units (issue version 3); offer1 confirmed then settled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 1000, offer_window_hours: 48 }
              as: ProgramManager
              as_user_id: "pm-9"
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 50, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              as_user_id: "pm-9"
              captures: { alloc1: $.data.id }
            - call: "GET /mint/bullion-issues/${issue_id}"
              as: ProgramManager
              captures: { issue_v2: $.data.version }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 100, expected_bullion_issue_version: "${issue_v2}" }
              as: ProgramManager
              as_user_id: "pm-9"
              captures: { alloc2: $.data.id }
            - call: "POST /mint/allocations/${alloc1}/confirm"
              as: BullionDealer
              as_user_id: "${ap_id}"
            - call: "POST /mint/allocations/${alloc1}/settle"
              as: FinanceOfficer
              as_user_id: "fin-9"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mint/bullion-issues/${issue_id}"
              as: ProgramManager
            - call: "GET /mint/allocations/${alloc2}"
              as: ProgramManager
          assert:
            - "BullionAllocation.${alloc2}.status == EXPIRED (offer made 2026-09-10T00:00:00Z + 48h window expires exactly 2026-09-12T00:00:00Z)"
            - "BullionIssue.${issue_id}.remaining_pool_units == 950 (100 units restored on expiry; 50 settled units stay out of the pool)"
            - "conservation: remaining 950 + SETTLED 50 == total_pool_units 1000"

      - name: product_mintage_units_conserved_across_cancel_promote
        grounds:
          - calculations.release_queue_allocation
          - calculations.waitlist_promotion
          - entities.NumismaticProduct.fields.allocated_units
        distinguishing_aspect: |
          Conserved quantity: sellable product units (different from blanks and bullion). Across the
          forward action (order allocation) and its compensating action (cancel), plus the promotion
          that re-consumes released units, allocated_units + remaining_units == mintage_limit at
          every step: 2+3, then 5+0, then 3+2 after cancel, then 5+0 after promotion.
        test_recipe:
          setup:
            - "product CONS-1 (mintage 5, household limit 99) ON_SALE; three collectors in distinct households"
            - "o1 qty 2 ALLOCATED; o2 qty 3 ALLOCATED (product SOLD_OUT); o3 qty 2 WAITLISTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "CONS-1", product_family: "CONSF", product_type: "PROOF_SET", price_cents: 3000, mintage_limit: 5, household_order_limit: 99, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "K1", email: "k1@example.com", household_id: "HH-K1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "K2", email: "k2@example.com", household_id: "HH-K2" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "K3", email: "k3@example.com", household_id: "HH-K3" }
              as: Anonymous
              captures: { c3: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 2 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o1: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 3 }
              as: Collector
              as_user_id: "${c2}"
              captures: { o2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 2 }
              as: Collector
              as_user_id: "${c3}"
              captures: { o3: $.data.id }
          trigger:
            - call: "POST /mint/orders/${o1}/cancel"
              as: Collector
              as_user_id: "${c1}"
            - call: "GET /mint/products/${p_id}"
              as: ProgramManager
          assert:
            - "pre-cancel: allocated_units == 5 and remaining_units == 0 and status == SOLD_OUT (5 + 0 == 5)"
            - "NumismaticOrder.${o3}.allocation_status == WAITLISTED before the cancel"
            - "post-cancel: NumismaticOrder.${o3}.allocation_status == ALLOCATED (2 released units fit its quantity 2)"
            - "post-cancel: allocated_units == 5 and remaining_units == 0 and status == SOLD_OUT (3 + 2 held transiently, then 5 + 0; allocated + remaining == 5 at every step)"
