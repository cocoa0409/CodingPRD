            - "ServiceVisit.${v1}.work_status == SCHEDULED"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Both instances gate a write on the state of an entity the request body does
  # not name, and both then clear the gate WITHOUT touching the blocked request.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cleaning_cycle_blocked_while_the_accounts_glycol_loop_sits_in_the_alarm_band
        grounds:
          - validations.priority_37_ERR_GLYCOL_ALARM_BLOCK
          - calculations.glycol_health_score
          - calculations.chemical_cycle_dosing
          - entities.GlycolLoop.fields.status
          - entities.CoolerReading.fields.source
          - endpoints.POST_cleaning_cycles
        distinguishing_aspect: |
          POST /cleaning-cycles names a visit, a line, a lot and a chemistry -
          never a glycol loop - yet it is rejected because the ACCOUNT's loop
          reads ALARM. The dependency is doubly indirect: the loop's status is
          not stored by any writer, it is a projection of health_score over the
          newest READING_WINDOW readings. Three 45.0 readings drive
          temp_penalty to 56.00 and the score to 44.00 (ALARM); three later
          38.0 readings DISPLACE the bad ones out of the window, restoring
          100.00 (NORMAL), and the byte-identical cycle body then posts a PASS.
          The blocking readings are VENUE_MANUAL and the clearing ones
          TECH_MANUAL, proving both sources weigh the same.
