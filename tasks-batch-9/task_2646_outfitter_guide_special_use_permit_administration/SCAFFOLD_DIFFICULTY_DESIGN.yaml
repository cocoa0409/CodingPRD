              as: PermitSpecialist
              captures: { appl_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${appl_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${ol_id}"
            - call: "POST /osup/permit-applications/${appl_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${appl_id}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2031-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { pl_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
