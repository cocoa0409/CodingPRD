          assert: ["err == ERR_FORBIDDEN", "HTTP 403", "Claim remains APPROVED"]

      - name: sod_qa_self_certify_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=12]
          - errors[ERR_SOD_QA_SELF_CERTIFY]
        distinguishing_aspect: "The QA_AUTHORITY-certified lead mechanic cannot certify their own work order: cert gate passes (m1 holds QA_AUTHORITY) and the SoD rule fires ERR_SOD_QA_SELF_CERTIFY."
        test_recipe:
          setup: ["PENDING_QA WO whose lead m1 ALSO holds QA_AUTHORITY"]
