              as: ReferralCoordinator
              captures: { ep_2: $.data.id }
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: PracticeAdmin
              captures: { oc0: $.data.open_episode_count, np0: $.data.navigation_priority }
          trigger:
            - call: "POST /screening-episodes/${ep_2}/close"
