            - *b_ann1c
            - *b_ann1p
            - *b_tr1
            - *b_rv1
          trigger:
            - call: "POST /water/transfer-requests/${tr1_id}/decide"
              payload: { decision: "APPROVE" }
              as: RegionalDirector
              captures: { pend_err: $.data.error_id }
            - call: "POST /water/impact-reviews/${rv1_id}/resolve"
