          - state_machines.AuctionProceeding.SCHEDULED_to_REDEEMED
        distinguishing_aspect: |
          Error-category pair = state (priority 5, ERR_INVALID_STATE) vs business_fiscal (priority 11,
          ERR_BALANCE_NOT_CLEARED). On a SOLD (terminal) proceeding with a non-zero balance, both checks
          would fail; the higher-priority STATE check wins -> ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Auction already SOLD (terminal); lease AUCTIONED. A redeem attempt would also fail the balance check, but state precedence applies."
          setup_api_calls:
            - call: "POST /facilities"
