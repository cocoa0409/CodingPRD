          assert:
            - "Calls 1, 3 and 4 all return HTTP 201: the junction accepts two teams on one neighborhood AND one team on two neighborhoods"
            - "Each created row reports weeks_in_window == 3 (W37, W38, W39 - the window is half-open) and status == 'RESERVED' with line_chargeback_cents == 0"
            - "Call 6 returns HTTP 409 with error id ERR_TEAM_ALLOCATION_MISMATCH because Team.${t_z}.policy_cycle_id is cycle B while Neighborhood.${n1}.policy_cycle_id is cycle A - the version in the payload was current, so the band-40 OCC check passed first"
            - "GET /seat-allocations?neighborhood_id=${n1} returns total_count 2 (${a1}, ${a2}); GET /seat-allocations?team_id=${t_a} returns total_count 2 (${a1}, ${a3})"
            - "Neighborhood.${n1}.committed_seats == 0 and peak_committed_seats == 0 throughout: RESERVED allocations contribute nothing to load"

