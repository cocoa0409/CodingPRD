      - name: occ_stale_version_on_reinstatement_create
        claim_type: conditional_action
        grounds: ["concurrency_rules[policy-reinstate-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: client reads policy.version V, another writer mutates the policy (version V+1), then the client creates a ReinstatementRequest with expected_policy_version V -> ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["ACTIVE MI profile; policy cancelled EFFECTIVE 2026-08-20; client captured version before an appeal filing bumps it"]
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "MI", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_mi: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_mi}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Mi Insured", mailing_address: "1 Mi St", email: "mi@x.com" }
              as: Underwriter
              captures: { ph_mi: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_mi}", state_profile_id: "${prof_mi}", policy_number: "P-MI-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 10000 }
              as: Underwriter
              captures: { pol_mi: $.data.id, pol_mi_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
