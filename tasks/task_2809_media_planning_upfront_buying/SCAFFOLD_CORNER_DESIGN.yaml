  - section: cross_cutting_complexity_layers
    instances:
      - name: a_counter_carrying_the_superseded_negotiation_version_is_rejected
        claim_type: Stale Version Rejected
        grounds:
          - "concurrency_rules.negotiation-counter-stale"
          - "validations[priority 7]"
          - "endpoints[POST /upfront/negotiations/{negotiationId}/counter]"
          - "errors.ERR_STALE_NEGOTIATION_VERSION"
        distinguishing_aspect: |
          The negotiation has moved twice since the seller read version 1 (its own counter, then the
          agency revision), and the terms on the table are now the agency's 2100 CPM. A counter carrying
          expected_negotiation_version 1 is a valid state transition from AGENCY_OFFER and is inside the
          round cap, so only the OCC check can stop it: 412 ERR_STALE_NEGOTIATION_VERSION, with the
          negotiation completely untouched. An implementation that ignores the field, or that treats the
          mismatch as 409, fails.
        test_recipe:
          setup:
            - "a negotiation cycled to round 3: opened, countered, then revised by the agency"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
