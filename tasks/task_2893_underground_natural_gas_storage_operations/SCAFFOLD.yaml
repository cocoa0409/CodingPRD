segregation_of_duties_rules:
  - rule: "The IntegrityEngineer X-User-ID recorded on MechanicalIntegrityTest.recorded_by_user_id (which becomes the opener of the cascaded RemediationProgram) MUST NOT be the X-User-ID that calls POST /remediation-programs/{id}/complete -> ERR_SOD_REMEDIATION_SELF_VERIFICATION (403)."
  - rule: "The ComplianceOfficer X-User-ID stored on RegulatoryReport.prepared_by_user_id MUST NOT be the X-User-ID that calls POST /regulatory-reports/{id}/submit -> ERR_SOD_REMEDIATION_SELF_VERIFICATION (403)."
  - rule: "Shipper-facing reads are narrowed by ownership: a Shipper reading another shipper's StorageContract, Nomination, GasMovementTicket or ImbalanceLedgerEntry by id receives ERR_CONTRACT_NOT_OWNED (403), and list endpoints return only rows whose owning contract.shipper_id equals X-User-ID."
