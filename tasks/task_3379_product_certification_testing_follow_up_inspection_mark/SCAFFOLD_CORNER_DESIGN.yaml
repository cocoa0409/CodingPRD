        distinguishing_aspect: "Every failure uses the fixed error envelope: response_type 'error', data.error_id + data.message, and meta.api_request_id / api_request_timestamp."
        test_recipe:
          setup: ["Clock at 2026-09-01."]
          setup_api_calls:
