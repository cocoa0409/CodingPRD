            - "the same body with a forming machine created on ${fa} returns 201 with reserved_melt_tons == 600.00"

  - section: state_machines
    instances:
      - name: campaign_activate_from_planned_computes_nominal_projection
        claim_type: valid_transition
        grounds:
          - state_machines.Campaign.PLANNED_to_ACTIVE
          - calculations.refractory_wear
          - entities.Campaign.fields.projected_refractory_units_nominal
        distinguishing_aspect: |
          Activating a PLANNED campaign moves it to ACTIVE and stamps
          projected_refractory_units_nominal 3000.00 = 300.00 tpd x 10 days x COLOR_WEAR_FACTOR[FLINT] 1.0,
          using the nominal variant with no stress multiplier.
        test_recipe:
          setup:
            - "Furnace FUR-S1 (design_pull_tpd 300.00, refractory_life_total_units 100000.00, current_color FLINT)"
            - "Campaign CMP-S1 PLANNED, target_pull_tpd 300.00, window 2026-08-01T00:00:00Z to 2026-08-11T00:00:00Z"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-S1", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-S1", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
          assert:
            - "HTTP 200"
            - "Campaign.${cmp}.status == ACTIVE"
            - "Campaign.${cmp}.projected_refractory_units_nominal == 3000.00"
            - "Campaign.${cmp}.melt_tons_charged == 0.00 and packed_tons == 0.00 and unaccounted_loss_tons == 0.00"
            - "Campaign.${cmp}.version == 2"
            - "Furnace.${f}.posture == OPERATING and refractory_remaining_pct == 100.00"
            - "Furnace.${f}.campaign_count == 1"

      - name: campaign_second_activate_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Campaign.PLANNED_to_ACTIVE
          - validations.priority_8
          - errors.ERR_CAMPAIGN_STATE_INVALID
        distinguishing_aspect: |
          Replaying activate on an already ACTIVE campaign is not idempotent-silent: it returns 409
          ERR_CAMPAIGN_STATE_INVALID and leaves version at 2, proving the side effects did not run twice.
        test_recipe:
          setup:
            - "Furnace FUR-S2 and Campaign CMP-S2 already ACTIVE (version 2)"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-S2", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-S2", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
          assert:
            - "HTTP 409 and data.error_id == ERR_CAMPAIGN_STATE_INVALID"
            - "Campaign.${cmp}.status == ACTIVE"
            - "Campaign.${cmp}.version == 2"
            - "Campaign.${cmp}.projected_refractory_units_nominal == 3000.00 (not recomputed or doubled)"

      - name: campaign_close_directly_from_active_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Campaign.REBUILD_SCHEDULED_to_CLOSED
          - validations.priority_8
          - errors.ERR_CAMPAIGN_STATE_INVALID
        distinguishing_aspect: |
          CLOSED is reachable only from REBUILD_SCHEDULED, so close on an ACTIVE campaign returns 409 and
          none of the close side effects fire - the furnace refractory counters are untouched.
        test_recipe:
          setup:
            - "Furnace FUR-S3 and Campaign CMP-S3 ACTIVE"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-S3", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-S3", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /glass-plant/campaigns/${cmp}/close"
              payload: {}
              as: PlantManager
          assert:
            - "HTTP 409 and data.error_id == ERR_CAMPAIGN_STATE_INVALID"
            - "Campaign.${cmp}.status == ACTIVE and version == 2"
            - "Campaign.${cmp}.rebuild_window_start_at is null"
            - "Furnace.${f}.refractory_consumed_units == 0.00 and refractory_remaining_pct == 100.00 and posture == OPERATING"

      - name: campaign_activate_blocked_by_sibling_active_campaign
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Campaign.PLANNED_to_ACTIVE
          - validations.priority_19
          - errors.ERR_FURNACE_CAMPAIGN_CONFLICT
        distinguishing_aspect: |
          A furnace may carry only one campaign in ACTIVE or WIND_DOWN: activating the second PLANNED
          campaign on the same furnace returns 409 ERR_FURNACE_CAMPAIGN_CONFLICT and leaves it PLANNED at
          version 1 with projected_refractory_units_nominal still 0.00.
        test_recipe:
          setup:
            - "Furnace FUR-S4 with two PLANNED campaigns CMP-S4A (window 2026-08-01 to 2026-08-11) and CMP-S4B (window 2026-08-12 to 2026-08-22)"
            - "CMP-S4A already activated"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-S4", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-S4A", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmpa: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-S4B", target_pull_tpd: 300.00, window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-22T00:00:00Z" }
              as: PlantManager
              captures: { cmpb: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmpa}/activate"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /glass-plant/campaigns/${cmpb}/activate"
              payload: {}
              as: PlantManager
          assert:
            - "HTTP 409 and data.error_id == ERR_FURNACE_CAMPAIGN_CONFLICT"
            - "Campaign.${cmpb}.status == PLANNED and version == 1 and projected_refractory_units_nominal == 0.00"
            - "Campaign.${cmpa}.status == ACTIVE"
            - "Furnace.${f}.campaign_count == 2"

      - name: mold_set_initial_state_is_available
        claim_type: initial_state
        grounds:
          - state_machines.MoldSet.initial_state
          - entities.MoldSet.fields.status
          - entities.MoldSet.fields.mount_count
        distinguishing_aspect: |
          A freshly created mold set starts in AVAILABLE with mount_count 0 and a null forming_machine_id,
          even when its bottle design is still DRAFT.
        test_recipe:
          setup:
            - "Customer CUST-S5 and DRAFT design BD-S5 exist"
          setup_api_calls:
            - call: "POST /glass-plant/customers"
              payload: { name: "Alpha Filling", account_code: "CUST-S5", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-S5", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-S5", cavity_count: 8, mold_family: "NNPB", owner: "PLANT", condition_score: 95 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
          assert:
            - "HTTP 201"
            - "MoldSet.${ms}.status == AVAILABLE"
            - "MoldSet.${ms}.mount_count == 0"
            - "MoldSet.${ms}.forming_machine_id is null"
            - "MoldSet.${ms}.condition_score == 95 and version == 1"
            - "BottleDesign.${d}.status == DRAFT (mold set creation does not advance the design)"

      - name: mold_set_scrapped_state_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MoldSet.IN_REPAIR_to_SCRAPPED
          - validations.priority_11
          - errors.ERR_MOLD_SET_STATE_INVALID
        distinguishing_aspect: |
          return-from-repair with condition_score 30 (below the 40 threshold) routes to SCRAPPED, and every
          later transition trigger - send-to-repair, return-from-repair, unmount - returns 409 with the
          version frozen at 3.
        test_recipe:
          setup:
            - "MoldSet MS-S6 sent to repair and returned with condition_score 30, so it is SCRAPPED"
          setup_api_calls:
            - call: "POST /glass-plant/customers"
              payload: { name: "Alpha Filling", account_code: "CUST-S6", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-S6", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-S6", cavity_count: 8, mold_family: "NNPB", owner: "PLANT", condition_score: 60 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
            - call: "POST /glass-plant/mold-sets/${ms}/send-to-repair"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/mold-sets/${ms}/return-from-repair"
              payload: { condition_score: 30 }
              as: MoldEngineer
          trigger:
            - call: "POST /glass-plant/mold-sets/${ms}/send-to-repair"
              payload: {}
              as: MoldEngineer
          assert:
            - "HTTP 409 and data.error_id == ERR_MOLD_SET_STATE_INVALID"
            - "MoldSet.${ms}.status == SCRAPPED and condition_score == 30 and version == 3"
            - "POST /glass-plant/mold-sets/${ms}/return-from-repair with condition_score 90 also returns 409 ERR_MOLD_SET_STATE_INVALID"
            - "POST /glass-plant/mold-sets/${ms}/unmount also returns 409 ERR_MOLD_SET_STATE_INVALID"
            - "MoldSet.${ms}.condition_score is still 30 after all three rejected calls"

      - name: color_change_complete_before_window_end_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ColorChange.SCHEDULED_to_COMPLETED
          - validations.priority_38
          - errors.ERR_WINDOW_NOT_ELAPSED
          - entities.Furnace.fields.current_color
        distinguishing_aspect: |
          A colour change may only complete once the logical clock has reached window_end_at: at
          2026-08-01T00:00:00Z the completion of a window ending 2026-08-03T00:00:00Z returns 409 and the
          furnace stays FLINT; after the clock is set to the window end it returns 200 and the furnace turns AMBER.
        test_recipe:
          setup:
