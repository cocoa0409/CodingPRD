# =============================================================================
# Task 1804 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_vs_final_pricing_divergence
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.provisional_total_cents
          - entities.WorkOrder.fields.final_total_cents
        distinguishing_aspect: |
          Repair-domain dual variant: identical teardown findings priced at quote
          creation (provisional: estimated hours + shop default material costs, no
          scrap line) versus at close (final: actual hours + consumed material cost
          + scrap line) produce different totals — 95896 vs 116254 cents.
        test_recipe:
          setup:
            - "Shop with default config; seal kit SK-80-NBR (18500c); customer with credit_limit 10000000; cylinder bore 80 CLASS_3000; technician with CYLINDER_REPAIR; bay; EXPEDITE WO promised 30h; teardown: rod 500mm, 1 honing pass, est 2.5h; rod stock 1000mm @42c/mm; quote approved; repair executed; certified; closed with actual 3.5h"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin, captures: { shop_id: "$.data.id" } }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme Hydraulics", email: "ops@acme.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-001", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/test-bays", payload: { name: "BAY-1" }, as: ShopAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leaking rod seal" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: true, rod_cut_length_mm: 500, tube_needed: false, honing_passes: 1, estimated_labor_hours: 2.5, findings_notes: "rod scored" }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/inventory-items", payload: { material: "CHROME_ROD", diameter_mm: 45, length_mm: 1000, cost_per_mm_cents: 42 }, as: ShopAdmin, captures: { rod_item_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id", quote_prov: "$.data.provisional_total_cents" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/quotes/${quote_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-repair", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "GET /fluid-power/stock-reservations?work_order_id=${wo_id}", payload: {}, as: ServiceAdvisor, captures: { res_id: "$.data[0].id" } }
            - { call: "POST /fluid-power/stock-reservations/${res_id}/consume", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/cleanliness-checks", payload: { c4_count: 200000, c6_count: 60000, c14_count: 8000 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/complete-assembly", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/pressure-tests", payload: { work_order_id: "${wo_id}", test_bay_id: "${bay_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: QualityInspector, captures: { pt_id: "$.data.id" } }
            - { call: "POST /fluid-power/pressure-tests/${pt_id}/record-result", payload: { measured_hold_psi: 4500, duration_min: 10, leakage_drops: 0, passed: true }, as: QualityInspector }
            - { call: "POST /fluid-power/certificates", payload: { work_order_id: "${wo_id}" }, as: QualityInspector, as_user_id: "insp-9", captures: { cert_id: "$.data.id" } }
          trigger:
            - { call: "POST /fluid-power/work-orders/${wo_id}/close", payload: { actual_labor_hours: 3.5 }, as: ServiceAdvisor, captures: { wo_final: "$.data.final_total_cents", wo_invoice: "$.data.invoice_total_cents" } }
          assert:
            - "Quote.${quote_id}.provisional_total_cents == 95896  # 18500 + 22500 + 4000 + round(2.5*14500*1.35)=48938 + round(0.04*48937.5)=1958"
            - "WorkOrder.${wo_id}.final_total_cents == 116254  # 18500 + 22500 + 4000 + round(3.5*14500*1.35)=68513 + round(2740.5)=2741"
            - "Quote.provisional_total_cents != WorkOrder.final_total_cents"
            - "WorkOrder.${wo_id}.status == CLOSED"

      - name: exchange_core_credit_provisional_vs_final
        grounds:
          - calculations.exchange_core_credit
          - entities.ExchangeUnit.fields.provisional_credit_cents
          - entities.ExchangeUnit.fields.final_credit_cents
        distinguishing_aspect: |
          Exchange-domain dual variant (different entity domain than quote pricing):
          provisional credit at fulfill assumes GOOD+COMPLETE core (40000c), final
          credit after inspection of the same deal applies WORN factor (24000c).
        test_recipe:
          setup:
            - "Shop, kit, customer, cylinder bore 80, technician, EXPEDITE WO promised 30h; teardown est 1.0h no rod/tube; quote SENT; matching exchange unit price 250000 in pool"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Beta Farms", email: "b@farms.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-101", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "drift under load" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: false, tube_needed: false, honing_passes: 0, estimated_labor_hours: 1.0 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/exchange-units", payload: { bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", unit_price_cents: 250000 }, as: ShopAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/select-exchange", payload: { exchange_unit_id: "${unit_id}" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /fluid-power/exchange-units/${unit_id}/fulfill", payload: {}, as: ServiceAdvisor, captures: { prov_credit: "$.data.provisional_credit_cents" } }
            - { call: "POST /fluid-power/exchange-units/${unit_id}/receive-core", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/exchange-units/${unit_id}/evaluate-core", payload: { condition: "WORN", completeness: "COMPLETE" }, as: QualityInspector, captures: { final_credit: "$.data.final_credit_cents" } }
          assert:
            - "ExchangeUnit.${unit_id}.provisional_credit_cents == 40000  # min(75000 cap, 40000*1.0*1.0)"
            - "ExchangeUnit.${unit_id}.final_credit_cents == 24000  # 40000*0.6*1.0"
            - "ExchangeUnit.provisional_credit_cents != ExchangeUnit.final_credit_cents"
            - "ExchangeUnit.${unit_id}.status == SETTLED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quote_per_line_rounding_then_sum
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.line_items
        distinguishing_aspect: |
          Mode (b) nested rounding: two raw lines land on fractional .5 cents
          (labor 48937.5, supplies 1957.5). Pinned order round-per-line-then-sum
          yields 95896; the alternative sum-then-round yields 95895 — one cent apart.
        test_recipe:
          setup:
            - "Shop defaults; kit 18500; customer; cylinder; technician; EXPEDITE WO promised 30h; teardown rod 500mm honing 1 est 2.5h"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-201", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: true, rod_cut_length_mm: 500, tube_needed: false, honing_passes: 1, estimated_labor_hours: 2.5 }, as: Technician, as_user_id: "${tech1_id}" }
          trigger:
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
          assert:
            - "Quote.${quote_id}.provisional_total_cents == 95896  # per-line round_half_up: 18500+22500+4000+48938+1958"
            - "Quote.${quote_id}.line_items LABOR amount_cents == 48938  # round_half_up(48937.5)"
            - "Quote.${quote_id}.line_items SUPPLIES amount_cents == 1958  # round_half_up(0.04*48937.5)=round_half_up(1957.5)"

      - name: invoice_evaluation_order_gold_boundary
        grounds:
          - calculations.invoice_total_settlement
          - entities.WorkOrder.fields.invoice_total_cents
          - entities.Customer.fields.ytd_spend_cents
        distinguishing_aspect: |
          Mode (c) evaluation-order dependency: loyalty tier is keyed on
          (pre-invoice ytd + PRE-discount subtotal) while the env fee is computed on
          the POST-discount subtotal. At tier_test exactly 500000 (boundary inclusive)
          GOLD applies: invoice 106722; computing the fee on the pre-discount subtotal
          (2325+11625=... i.e. 116254-11625+2325=106954) or the tier post-discount
          (SILVER) both yield different totals.
        test_recipe:
          setup:
            - "Customer opening_ytd_spend 383746 so ytd+final_subtotal == 500000 exactly; full certified repair path with final_total 116254"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Gold Co", email: "g@g.com", credit_limit_cents: 10000000, opening_ytd_spend_cents: 383746 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-301", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/test-bays", payload: { name: "BAY-1" }, as: ShopAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: true, rod_cut_length_mm: 500, tube_needed: false, honing_passes: 1, estimated_labor_hours: 2.5 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/inventory-items", payload: { material: "CHROME_ROD", diameter_mm: 45, length_mm: 1000, cost_per_mm_cents: 42 }, as: ShopAdmin }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/quotes/${quote_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-repair", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "GET /fluid-power/stock-reservations?work_order_id=${wo_id}", payload: {}, as: ServiceAdvisor, captures: { res_id: "$.data[0].id" } }
            - { call: "POST /fluid-power/stock-reservations/${res_id}/consume", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/cleanliness-checks", payload: { c4_count: 200000, c6_count: 60000, c14_count: 8000 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/complete-assembly", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/pressure-tests", payload: { work_order_id: "${wo_id}", test_bay_id: "${bay_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: QualityInspector, captures: { pt_id: "$.data.id" } }
            - { call: "POST /fluid-power/pressure-tests/${pt_id}/record-result", payload: { measured_hold_psi: 4500, duration_min: 10, leakage_drops: 0, passed: true }, as: QualityInspector }
            - { call: "POST /fluid-power/certificates", payload: { work_order_id: "${wo_id}" }, as: QualityInspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /fluid-power/work-orders/${wo_id}/close", payload: { actual_labor_hours: 3.5 }, as: ServiceAdvisor }
          assert:
            - "WorkOrder.${wo_id}.final_total_cents == 116254"
            - "WorkOrder.${wo_id}.invoice_total_cents == 106722  # GOLD 10%: discount round(11625.4)=11625; discounted 104629; env round(2092.58)=2093; 104629+2093"
            - "Customer.${cust_id}.ytd_spend_cents == 490468  # 383746 + 106722"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_rework_cycle_test_fail_loops_to_in_repair
        grounds:
          - state_machines.WorkOrder.TEST_PENDING_to_IN_REPAIR
          - state_machines.PressureTest.SCHEDULED_to_FAILED
        distinguishing_aspect: |
          WorkOrder machine is cyclic: TEST_PENDING -> IN_REPAIR on test failure,
          then IN_REPAIR -> ASSEMBLED -> TEST_PENDING again; the failure also resets
          cleanliness_passed, forcing a fresh cleanliness check on the second pass.
        test_recipe:
          setup:
            - "Approved repair work order in TEST_PENDING with a booked pressure test; reservation consumed; cleanliness previously passed"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-401", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/test-bays", payload: { name: "BAY-1" }, as: ShopAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: true, rod_cut_length_mm: 500, tube_needed: false, honing_passes: 1, estimated_labor_hours: 2.5 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/inventory-items", payload: { material: "CHROME_ROD", diameter_mm: 45, length_mm: 1000, cost_per_mm_cents: 42 }, as: ShopAdmin }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/quotes/${quote_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-repair", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "GET /fluid-power/stock-reservations?work_order_id=${wo_id}", payload: {}, as: ServiceAdvisor, captures: { res_id: "$.data[0].id" } }
            - { call: "POST /fluid-power/stock-reservations/${res_id}/consume", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/cleanliness-checks", payload: { c4_count: 200000, c6_count: 60000, c14_count: 8000 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/complete-assembly", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/pressure-tests", payload: { work_order_id: "${wo_id}", test_bay_id: "${bay_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: QualityInspector, captures: { pt1_id: "$.data.id" } }
          trigger:
            - { call: "POST /fluid-power/pressure-tests/${pt1_id}/record-result", payload: { measured_hold_psi: 4300, duration_min: 10, leakage_drops: 2, passed: false }, as: QualityInspector }
            - { call: "POST /fluid-power/work-orders/${wo_id}/cleanliness-checks", payload: { c4_count: 200000, c6_count: 60000, c14_count: 8000 }, as: Technician, as_user_id: "${tech1_id}", captures: { wo_clean: "$.data.cleanliness_passed" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/complete-assembly", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
