  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_student_version_rejects_action_plan_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[action-plan-create-stale-student]
          - validations[priority=14]
          - errors[ERR_STALE_STUDENT_VERSION]
          - entities.Student.fields.version
        distinguishing_aspect: "A PATCH on the Student between the read and the create advances Student.version, so the create still carrying the earlier version is refused with 412 ERR_STALE_STUDENT_VERSION; re-reading the version and resubmitting the identical body succeeds with 201."
        test_recipe:
          setup:
            - "School JETTY70 with one RN and one ENROLLED student whose version is captured at creation."
            - "A PATCH updating the student's immunization_status then bumps Student.version, making the captured value stale."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Jetty Elementary", building_code: "JTY70", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Jae Kwon", grade_level: 4, date_of_birth: "2016-04-14T00:00:00Z", allergy_severity: "MILD", chronic_condition_codes: ["ASTHMA"], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id, stu_v_stale: $.data.version }
            - call: "PATCH /health-office/students/${stu_id}"
              payload: { immunization_status: "PROVISIONAL" }
              as: DistrictHealthAdmin
              captures: { stu_v_after_patch: $.data.version }
          trigger:
            - call: "POST /health-office/action-plans"
              payload: { student_id: "${stu_id}", condition_code: "ASTHMA", severity_score: 3, requires_stock_epinephrine: false, self_carry_requested: false, effective_from: "2026-08-01T00:00:00Z", expected_student_version: "${stu_v_stale}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
            - call: "GET /health-office/students/${stu_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { stu_v_fresh: $.data.version }
            - call: "POST /health-office/action-plans"
              payload: { student_id: "${stu_id}", condition_code: "ASTHMA", severity_score: 3, requires_stock_epinephrine: false, self_carry_requested: false, effective_from: "2026-08-01T00:00:00Z", expected_student_version: "${stu_v_fresh}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { plan_id: $.data.id }
          assert:
            - "Stale attempt: HTTP status == 412"
            - "Stale attempt: data.error_id == ERR_STALE_STUDENT_VERSION"
            - "Stale attempt: GET /health-office/action-plans?student_id=${stu_id} returns total_count == 0"
            - "Stale attempt: Student.${stu_id}.version == ${stu_v_after_patch} (the refused create does not bump it)"
            - "Fresh attempt: HTTP status == 201 and ActionPlan.${plan_id}.status == DRAFT"
            - "Fresh attempt: Student.${stu_id}.version == ${stu_v_fresh} + 1"

