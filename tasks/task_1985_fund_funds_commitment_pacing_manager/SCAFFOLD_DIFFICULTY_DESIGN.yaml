      - name: liquidity_forecast_base_vs_stress_variant
        grounds:
          - calculations.capital_call_forecast
          - entities.FoFProgram.fields.unrestricted_cash
          - endpoints: "GET /fof/programs/{programId}/liquidity-forecast"
        distinguishing_aspect: |
          Liquidity-forecast entity domain (distinct from the NAV domain of
          nav_rollup): with identical underlying data, the base variant counts
          PENDING distributions as inflows and scales expected calls by 1.00,
          while the stress variant excludes PENDING distributions and scales
          expected calls by 1.15, yielding strictly lower forecast_net_cash.
        test_recipe:
          setup:
            - "Program opened, cash 20,000,000, buffer 1,000,000, posture NORMAL"
            - "EXECUTED commitment C1 of 10,000,000 (BUYOUT, vintage 2026), unfunded 10,000,000"
            - "One PENDING distribution of 500,000 with received_at in the current quarter"
            - "Clock at 2026-08-01 (Q3 2026); no ISSUED calls, no ACCEPTED bids"
