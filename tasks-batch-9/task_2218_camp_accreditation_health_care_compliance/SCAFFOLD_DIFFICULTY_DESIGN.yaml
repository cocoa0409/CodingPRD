  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: deficiency_plan_revision_cycle_returns_to_open_then_escalates_on_third_rejection
        grounds:
          - state_machines.Deficiency.OPEN_to_PLAN_SUBMITTED
          - state_machines.Deficiency.PLAN_SUBMITTED_to_OPEN
          - state_machines.Deficiency.PLAN_SUBMITTED_to_ESCALATED
          - entities.Deficiency.fields.plan_revision_count
          - state_machines.AccreditationCycle.IN_CORRECTION_to_TERMINATED
          - validations.ERR_PLAN_REVISION_LIMIT
          - calculations.camp_compliance_posture
        distinguishing_aspect: |
          A true cycle in the Deficiency graph: OPEN -> PLAN_SUBMITTED -> OPEN is
          traversed twice, so the entity re-enters a state it already left while a
          monotonic counter survives the loop. The third traversal takes the SAME
          trigger with the SAME payload shape to a DIFFERENT target - ESCALATED
          instead of OPEN - purely because plan_revision_count reached 3, and that
          escalation reaches out of the loop to terminate the parent cycle.
        test_recipe:
          setup:
            - "Standards edition ACA-2026-G is PUBLISHED with SU.1 SUPERVISION mandatory scoring_weight 1 and OM.9 OPERATIONS non-mandatory scoring_weight 1, both universal."
            - "Grove Day Camp is a DAY / YOUTH_ONLY camp in OH with no program elements and health_staffing_level FIRST_AIDER_ONLY."
            - "The visit scores SU.1 MET and OM.9 NOT_MET at logical clock 2026-09-02T09:00:00Z, producing exactly one SCORED deficiency with base_points 2, batch base total 2, tier 0, penalty_points 2 and correction_due_date 2026-12-01."
            - "The office decision yields final_mandatory_pct 100.00 with final_weighted_pct 50.00, so the level is ACCREDITED_WITH_CORRECTION and the cycle sits at IN_CORRECTION with one open deficiency."
            - "The logical clock stays at 2026-09-02T09:00:00Z for the whole revision loop, well inside the correction window."
