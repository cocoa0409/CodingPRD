              captures: { aid: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { cu: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/premium-payments"
              payload: { amount_cents: 1332 }
              as: Policyholder
              as_user_id: "${gid}"
            - call: "POST /carriers/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units/${cu}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${gid}"
            - call: "POST /carriers/${cid}/policies/${pid}/claims"
              payload: { coverage_unit_id: "${cu}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${gid}"
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /carriers/${cid}/policies/${pid}/claims/${cl}/assign-adjuster"
              payload: { adjuster_id: "${aid}" }
              as: ClaimsApprover
              captures: { st: $.data.claim_state, adj: $.data.adjuster_id }
          assert:
            - "response.claim_state == INSPECTION_SCHEDULED   (visible immediately)"
            - "response.adjuster_id == ${aid}"
