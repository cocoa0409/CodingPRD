# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: taxpayer_create_applies_defaults
        claim_type: creation
        grounds: [entities.Taxpayer]
        distinguishing_aspect: "POST /taxpayers with only required fields returns 201 with system defaults prior_year_refund_cents 0, pin_delivery_channel POSTAL_MAIL, status ACTIVE, ip_pin_enrollment NOT_ENROLLED, version 1."
        test_recipe:
          setup: ["Clock at default 2026-09-01T00:00:00Z (no clock call needed)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000110", full_name: "De Fault", date_of_birth: "1990-01-01" }, as: SystemAdmin, captures: { tp: $.data.id, prior: $.data.prior_year_refund_cents, chan: $.data.pin_delivery_channel, st: $.data.status, enr: $.data.ip_pin_enrollment, ver: $.data.version } }
          assert:
            - "captured prior == 0 and chan == POSTAL_MAIL"
            - "captured st == ACTIVE and enr == NOT_ENROLLED"
            - "captured ver == 1"
      - name: taxpayer_create_missing_required_tin
        claim_type: required_fields
        grounds: [entities.Taxpayer.fields.tin, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field tin is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /identity-protection/taxpayers", payload: { full_name: "No Tin", date_of_birth: "1990-01-01" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
      - name: taxpayer_duplicate_tin_rejected
        claim_type: type_constraints
        grounds: [entities.Taxpayer.fields.tin, "errors[ERR_DUPLICATE_TIN]"]
        distinguishing_aspect: "A second taxpayer with an already-registered tin is rejected with ERR_DUPLICATE_TIN (409)."
        test_recipe:
          setup: ["Taxpayer with tin 100000111 exists"]
          setup_api_calls:
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000111", full_name: "First Tin", date_of_birth: "1990-01-01" }, as: SystemAdmin }
          trigger:
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000111", full_name: "Second Tin", date_of_birth: "1991-02-02" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_DUPLICATE_TIN"
      - name: taxpayer_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TAXPAYER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown taxpayer id returns ERR_TAXPAYER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /identity-protection/taxpayers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_TAXPAYER_NOT_FOUND"
      - name: return_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.TaxReturn.fields.filing_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "filing_status outside {SINGLE, MARRIED_JOINT, HEAD_OF_HOUSEHOLD} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Config MV-ENUM ACTIVE; taxpayer exists"]
          setup_api_calls:
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-ENUM", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000112", full_name: "Enum Test", date_of_birth: "1990-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "MARRIED", claimed_refund_cents: 1000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
      - name: return_create_computed_risk_score_input_ignored
        claim_type: computed_fields
        grounds: [entities.TaxReturn.fields.risk_score]
        distinguishing_aspect: "A client-supplied risk_score in the filing payload is ignored; the stored value is the computed 0."
        test_recipe:
          setup: ["Config MV-CI ACTIVE (all weights 0, gray 1, hold 50); taxpayer exists"]
          setup_api_calls:
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-CI", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000113", full_name: "Computed Ig", date_of_birth: "1990-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 5000, bank_product: "NONE", risk_score: 99 }, as: Taxpayer, as_user_id: "${tp}", captures: { score: $.data.risk_score } }
          assert:
            - "captured score == 0 (client-supplied 99 ignored; value computed server-side)"
      - name: verification_document_immutable_no_version
        claim_type: immutability
        grounds: [entities.VerificationDocument]
        distinguishing_aspect: "VerificationDocument is common_fields:false: its create response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Held return with an OPENED ONLINE case in DOCS_REQUESTED (config MV-DOC: w_bank_product 60, gray 25, hold 50)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-DOC", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000114", full_name: "Doc Test", date_of_birth: "1990-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 60000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-doc" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tp}", return_id: "${rtn}", channel: "ONLINE" }, as: VerificationAgent, captures: { case: $.data.id } }
            - { call: "POST /identity-protection/verification-cases/${case}/request-documents", payload: {}, as: VerificationAgent }
          trigger:
            - { call: "POST /identity-protection/verification-cases/${case}/documents", payload: { doc_type: "PHOTO_ID" }, as: Taxpayer, as_user_id: "${tp}", captures: { doc: $.data.id } }
          assert:
            - "document response carries id, case_id, doc_type, received_at"
            - "document response carries no version and no updated_at (common_fields: false)"
      - name: return_list_pagination_limit_one
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, endpoints]
        distinguishing_aspect: "GET /tax-returns?limit=1 returns exactly 1 row with has_more true and total_count 2 when two returns exist."
        test_recipe:
          setup: ["Config MV-PG ACTIVE; two taxpayers each file a passing return"]
          setup_api_calls:
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-PG", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000115", full_name: "Page One", date_of_birth: "1990-01-01" }, as: SystemAdmin, captures: { tp1: $.data.id } }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000116", full_name: "Page Two", date_of_birth: "1991-02-02" }, as: SystemAdmin, captures: { tp2: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp1}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 1000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp1}" }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp2}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 2000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp2}" }
          trigger:
            - { call: "GET /identity-protection/tax-returns", payload: { limit: 1 }, as: FraudAnalyst, captures: { page: $.data } }
          assert:
            - "response data has exactly 1 row"
            - "meta/pagination fields show total_count == 2 and has_more == true"

  - section: state_machines
    instances:
      - name: confirm_fraud_on_released_return_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TaxReturn, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "confirm-fraud on a REFUND_RELEASED (terminal) return is rejected with ERR_ALREADY_TERMINAL; no side effects fire."
        test_recipe:
          setup:
            - "Clock 2027-05-01; config MV-TL ACTIVE (pass-through); taxpayer (prior 20000) files 20000-cent NONE return -> FILTER_PASSED -> scheduled -> released (interest 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-TL", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000120", full_name: "Term Lock", date_of_birth: "1980-01-01", prior_year_refund_cents: 20000 }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 20000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/tax-returns/${rtn}/release-refund", payload: {}, as: FraudAnalyst, captures: { disb: $.data.id } }
            - { call: "POST /identity-protection/refund-disbursements/${disb}/release", payload: { expected_amount_cents: 20000 }, as: SystemAdmin }
          trigger:
            - { call: "POST /identity-protection/tax-returns/${rtn}/confirm-fraud", payload: {}, as: FraudAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_ALREADY_TERMINAL"
            - "TaxReturn.${rtn}.status remains REFUND_RELEASED"
      - name: verify_case_from_opened_rejected
        claim_type: invalid_transition
        grounds: [state_machines.IdentityVerificationCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST verify on an OPENED case (documents never requested) is rejected with ERR_INVALID_STATE — verify only runs from DOCS_SUBMITTED."
        test_recipe:
          setup: ["Clock 2027-02-01; config MV-IV (w_bank_product 60, gray 25, hold 50) ACTIVE; held return; ONLINE case opened (status OPENED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-IV", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000121", full_name: "Inv Trans", date_of_birth: "1980-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 60000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-iv" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tp}", return_id: "${rtn}", channel: "ONLINE" }, as: VerificationAgent, captures: { case: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /identity-protection/verification-cases/${case}/verify", payload: {}, as: VerificationAgent, captures: { err: $.data.error_id } }
          assert:
            - "captured st0 == OPENED (initial state)"
            - "captured err == ERR_INVALID_STATE"
      - name: hold_mark_false_positive_releases_return
        claim_type: side_effect_execution
        grounds: [state_machines.FilterHold.OPEN_to_RESOLVED_FALSE_POSITIVE, state_machines.TaxReturn.FILTER_HELD_to_FILTER_PASSED]
        distinguishing_aspect: "mark-false-positive moves the hold OPEN -> RESOLVED_FALSE_POSITIVE and the return FILTER_HELD -> FILTER_PASSED in one call — the false-positive-burden bookkeeping path for legitimate filers."
        test_recipe:
          setup: ["Clock 2027-02-01; config MV-FP (w_bank_product 60, gray 25, hold 50) ACTIVE; taxpayer's REFUND_TRANSFER return FILTER_HELD with an OPEN hold"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-FP", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000122", full_name: "False Positive", date_of_birth: "1980-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 45000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-fp" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "GET /identity-protection/tax-returns/${rtn}/filter-holds", payload: {}, as: FraudAnalyst, captures: { hold: "$.data[0].id" } }
          trigger:
            - { call: "POST /identity-protection/filter-holds/${hold}/mark-false-positive", payload: {}, as: FraudAnalyst, captures: { hSt: $.data.status } }
            - { call: "GET /identity-protection/tax-returns/${rtn}", payload: {}, as: FraudAnalyst, captures: { rSt: $.data.status } }
          assert:
            - "captured hSt == RESOLVED_FALSE_POSITIVE"
            - "captured rSt == FILTER_PASSED"
      - name: conflict_clock_sweep_default_first_filer
        claim_type: valid_transition
        grounds: [state_machines.DependentConflict.OPEN_to_RESOLVED, calculations.dependent_conflict_adjustment]
        distinguishing_aspect: "A conflict with no evidence from either side is auto-resolved by the clock sweep past evidence_window_ends_at: FIRST_FILER wins by default with resolved_reason DEFAULT_NO_EVIDENCE, and the second filer's 150000-cent claim is floored to 0 (delta capped by claimed amount, adjustment -150000)."
        test_recipe:
          setup:
            - "Clock 2027-02-01; config MV-SW (pass-through, w_dependent_conflict 0) ACTIVE"
            - "A files 300000-cent return claiming dependent 900000012; B files 150000-cent return claiming the same dependent -> conflict OPEN (window ends 2027-03-03T00:00:00Z)"
            - "No evidence submitted; clock advanced to 2027-03-04"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-SW", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000123", full_name: "Sweep A", date_of_birth: "1980-01-01" }, as: SystemAdmin, captures: { tpA: $.data.id } }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000124", full_name: "Sweep B", date_of_birth: "1981-02-02" }, as: SystemAdmin, captures: { tpB: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpA}", tax_year: 2026, filing_status: "HEAD_OF_HOUSEHOLD", claimed_refund_cents: 300000, bank_product: "NONE", dependents: [{ dependent_tin: "900000012", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpA}", captures: { rtnA: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpB}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 150000, bank_product: "NONE", dependents: [{ dependent_tin: "900000012", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpB}", captures: { rtnB: $.data.id } }
            - { call: "GET /identity-protection/dependent-conflicts", payload: { dependent_tin: "900000012" }, as: FraudAnalyst, captures: { conf: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-04T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /identity-protection/dependent-conflicts/${conf}", payload: {}, as: FraudAnalyst, captures: { cSt: $.data.status, cRes: $.data.resolution, cWhy: $.data.resolved_reason } }
            - { call: "GET /identity-protection/tax-returns/${rtnB}", payload: {}, as: FraudAnalyst, captures: { claimedB: $.data.claimed_refund_cents, adjB: $.data.adjustment_cents } }
            - { call: "GET /identity-protection/tax-returns/${rtnA}/dependent-claims", payload: {}, as: FraudAnalyst, captures: { claimASt: "$.data[0].status" } }
          assert:
            - "captured cSt == RESOLVED and cRes == FIRST_FILER and cWhy == DEFAULT_NO_EVIDENCE"
            - "captured claimedB == 0 and adjB == -150000 (delta capped at the claimed amount, floor 0)"
            - "captured claimASt == SUSTAINED"
      - name: opt_out_revokes_active_pins
        claim_type: side_effect_execution
        grounds: [state_machines.Taxpayer.ENROLLED_to_OPTED_OUT, state_machines.ProtectionPin.ACTIVE_to_REVOKED]
        distinguishing_aspect: "Opting out flips enrollment ENROLLED -> OPTED_OUT and revokes every ACTIVE pin; a second opt-out is rejected with ERR_NOT_ENROLLED."
        test_recipe:
          setup: ["Clock 2027-01-25; taxpayer ENROLLED for 2026 with one ACTIVE pin"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-25T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000125", full_name: "Opt Out", date_of_birth: "1980-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/taxpayers/${tp}/ip-pin-opt-in", payload: { tax_year: 2026 }, as: Taxpayer, as_user_id: "${tp}" }
          trigger:
            - { call: "POST /identity-protection/taxpayers/${tp}/ip-pin-opt-out", payload: {}, as: Taxpayer, as_user_id: "${tp}", captures: { enr: $.data.ip_pin_enrollment } }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { pinSt: "$.data[0].status" } }
            - { call: "POST /identity-protection/taxpayers/${tp}/ip-pin-opt-out", payload: {}, as: Taxpayer, as_user_id: "${tp}", captures: { err: $.data.error_id } }
          assert:
            - "captured enr == OPTED_OUT"
            - "captured pinSt == REVOKED"
            - "captured err == ERR_NOT_ENROLLED on the repeat opt-out"
      - name: confirm_fraud_cancels_scheduled_disbursement
        claim_type: compensation
        grounds: [state_machines.TaxReturn.REFUND_SCHEDULED_to_FRAUD_CONFIRMED, state_machines.RefundDisbursement.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "confirm-fraud on a REFUND_SCHEDULED return compensates the pending disbursement (SCHEDULED -> CANCELLED) — no funds move and the return lands in FRAUD_CONFIRMED."
        test_recipe:
          setup: ["Clock 2027-05-01; config MV-CC ACTIVE; taxpayer (prior 40000) files 40000-cent NONE return -> FILTER_PASSED -> refund scheduled"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-CC", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000126", full_name: "Cancel Comp", date_of_birth: "1980-01-01", prior_year_refund_cents: 40000 }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 40000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/tax-returns/${rtn}/release-refund", payload: {}, as: FraudAnalyst, captures: { disb: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/tax-returns/${rtn}/confirm-fraud", payload: {}, as: FraudAnalyst, captures: { rSt: $.data.status } }
            - { call: "GET /identity-protection/tax-returns/${rtn}/refund-disbursements", payload: {}, as: FraudAnalyst, captures: { dSt: "$.data[0].status" } }
          assert:
            - "captured rSt == FRAUD_CONFIRMED"
