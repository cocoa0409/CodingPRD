# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is not authorized for this endpoint per RBAC"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource id does not exist or is not scoped under its declared parent"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Payload shape invalid — missing required field, bad enum, non-ISO8601 datetime, non-positive integer where positive required"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version mismatch on a concurrency-guarded endpoint"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state that does not permit the requested transition"

  - id: ERR_CHASSIS_UNROADABLE
    http: 409
    condition: "Chassis roadability_status != ROADABLE on a reserve / out-gate / maintenance-exit attempt"

  - id: ERR_RAIL_CUTOFF_MISSED
    http: 409
    condition: "OUT GateTransaction completion attempted at or after train.rail_cutoff_at"

  - id: ERR_OUTSIDE_APPOINTMENT_WINDOW
    http: 409
    condition: "Check-in attempted outside [window_start_utc, window_end_utc] inclusive"

  - id: ERR_CONGESTED_WINDOW_CAP
    http: 409
    condition: "New appointment window exceeds 3600 seconds while terminal.posture == CONGESTED"

  - id: ERR_MEMBERSHIP_NOT_ACTIVE
    http: 409
    condition: "Carrier does not have an ACTIVE ChassisMembership on the chassis pool (OUT booking/check-in)"

  - id: ERR_TERMINAL_CLOSED
    http: 409
    condition: "Terminal posture is CLOSED; ground or IN-transaction complete blocked"

  - id: ERR_NO_YARD_SLOT_AVAILABLE
    http: 409
    condition: "yard_slot_selector found no eligible YardSlot (status IN EMPTY, RESERVED with tier_max >= 1)"

  - id: ERR_TRAIN_NOT_ARRIVED
    http: 409
    condition: "Container ground attempted while planned_train_id's train.status != ARRIVED"

  - id: ERR_OVERPAY
    http: 409
    condition: "Ledger apply_cents exceeds remaining balance (amount_cents - applied_cents)"

  - id: ERR_OPEN_DAMAGE_EXISTS
    http: 409
    condition: "Container void or chassis retire blocked because an OPEN DamageInspection references the resource"

  - id: ERR_TRANSACTION_IN_FLIGHT
    http: 409
    condition: "Appointment cancel blocked because a PENDING or COMPLETED GateTransaction exists for it"

  - id: ERR_NO_CHECKED_IN_APPOINTMENT
    http: 409
    condition: "Chassis reserve attempted without a CHECKED_IN OUT GateAppointment"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TerminalManager
    description: "Top-level terminal operator; manages terminals, voids, waivers, run_ops, retirements"
    identity: opaque
    exclusive_operations:
      - "POST /terminals — create terminal"
      - "POST /carriers — create carrier"
      - "POST /terminals/{tid}/containers/{cid}/void — void container"
      - "POST /terminals/{tid}/damage/{did}/waive — waive damage"
      - "POST /terminals/{tid}/ledger/{lid}/waive — waive ledger entry"
      - "POST /terminals/{tid}/pools/{pid}/chassis/{cid}/retire — retire chassis"
      - "POST /terminals/{tid}/run_ops — operations checkpoint"
    shared_operations:
      - "GET endpoints across terminals, pools, chassis, slots, trains, containers, appointments, transactions, damage, ledger, carriers"

  - name: PoolAdministrator
    description: "Chassis-pool administrator; manages pools, chassis, memberships"
    identity: opaque
    exclusive_operations:
      - "POST /terminals/{tid}/pools — create pool"
      - "POST /terminals/{tid}/pools/{pid}/chassis — add chassis"
      - "POST /terminals/{tid}/pools/{pid}/memberships — enroll carrier"
      - "POST /terminals/{tid}/pools/{pid}/memberships/{mid}/suspend — suspend membership"
      - "POST /terminals/{tid}/pools/{pid}/memberships/{mid}/reactivate — reactivate membership"
      - "POST /terminals/{tid}/pools/{pid}/memberships/{mid}/terminate — terminate membership"
    shared_operations:
      - "GET on pools, chassis, memberships, carriers"

  - name: YardPlanner
    description: "Yard planner; manages slots, grounds containers"
    identity: opaque
    exclusive_operations:
      - "POST /terminals/{tid}/slots — create slot"
      - "POST /terminals/{tid}/slots/{sid}/block — block slot"
      - "POST /terminals/{tid}/slots/{sid}/unblock — unblock slot"
      - "POST /terminals/{tid}/slots/{sid}/reserve — reserve slot"
      - "POST /terminals/{tid}/slots/{sid}/unreserve — unreserve slot"
      - "POST /terminals/{tid}/containers/{cid}/ground — ground container"
    shared_operations:
      - "GET on slots, containers, trains"

  - name: RailCoordinator
    description: "Rail operations coordinator; manages trains, registers inbound containers"
    identity: opaque
    exclusive_operations:
      - "POST /terminals/{tid}/trains — schedule train"
      - "POST /terminals/{tid}/trains/{trid}/mark_arrived — mark arrived"
      - "POST /terminals/{tid}/trains/{trid}/begin_loading — begin loading"
      - "POST /terminals/{tid}/trains/{trid}/mark_departed — mark departed"
      - "POST /terminals/{tid}/trains/{trid}/cancel — cancel train"
      - "POST /terminals/{tid}/containers — register inbound container"
    shared_operations:
      - "GET on trains, containers"

  - name: GateSupervisor
    description: "Gate supervisor; books appointments, reserves chassis"
    identity: opaque
    exclusive_operations:
      - "POST /terminals/{tid}/appointments — book appointment"
      - "POST /terminals/{tid}/pools/{pid}/chassis/{cid}/reserve — reserve chassis"
    shared_operations:
      - "POST /terminals/{tid}/appointments/{aid}/cancel — cancel appointment"
      - "GET on appointments, chassis, containers, slots"

  - name: GateClerk
    description: "Gate clerk; checks in drivers, opens/completes/rejects transactions, reports damage"
    identity: opaque
    exclusive_operations:
      - "POST /terminals/{tid}/appointments/{aid}/check_in — check in driver"
      - "POST /terminals/{tid}/transactions — open transaction"
      - "POST /terminals/{tid}/transactions/{txid}/complete — complete transaction"
      - "POST /terminals/{tid}/transactions/{txid}/reject — reject transaction"
    shared_operations:
      - "POST /terminals/{tid}/appointments/{aid}/cancel — cancel appointment"
      - "POST /terminals/{tid}/damage — open damage inspection (shared with MaintenancePlanner)"
      - "GET on appointments, transactions, containers, chassis"

  - name: MaintenancePlanner
    description: "Maintenance planner; manages chassis maintenance, damage repair scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /terminals/{tid}/pools/{pid}/chassis/{cid}/enter_maintenance — enter maintenance"
      - "POST /terminals/{tid}/pools/{pid}/chassis/{cid}/exit_maintenance — exit maintenance"
      - "POST /terminals/{tid}/damage/{did}/schedule_repair — schedule repair"
      - "POST /terminals/{tid}/damage/{did}/mark_repaired — mark repaired"
    shared_operations:
      - "POST /terminals/{tid}/damage — open damage inspection (shared with GateClerk)"
      - "GET on chassis, damage, pools"

  - name: BillingClerk
    description: "Billing clerk; applies payments, loads flip-fee credits"
    identity: opaque
    exclusive_operations:
      - "POST /terminals/{tid}/ledger/{lid}/apply — apply payment"
      - "POST /terminals/{tid}/pools/{pid}/memberships/{mid}/load_flip_credit — load flip-fee credit"
    shared_operations:
      - "GET on ledger, memberships, appointments, transactions, carriers"
