  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: on_time_inclusive_at_exactly_grace_days
        grounds:
          - calculations.payment_on_time_status
          - entities.RentPayment.fields.on_time
          - endpoints["POST /api/rent-payments"]
        distinguishing_aspect: |
          Numeric day-threshold boundary on POST /api/rent-payments: paid_date exactly due_date + GRACE_DAYS (5)
          days is on_time == true (inclusive <=). due 2026-04-05, paid 2026-04-10 -> on_time true.
        test_recipe:
          setup:
            - "A lease exists (verification irrelevant for recording); record a payment paid exactly 5 days after due."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
