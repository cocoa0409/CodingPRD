            - "Call 1 stamped no hold — the posture did not change, so SupportSurfaceOrder.${o1_id}.requires_director_override == false, posture_hold_applied_at == null and version == 1"
            - "Call 2 (2nd HAPI) crosses the RESTRICTED floor: Unit.${u1_id}.open_hapi_rca_count == 2 and survey_posture == RESTRICTED"
            - "Call 2's hop 5 stamped the pre-existing REQUESTED order: SupportSurfaceOrder.${o1_id}.requires_director_override == true, posture_hold_applied_at == 2026-08-01T00:00:00Z and version == 2"
            - "Call 3 returns HTTP 201 — order creation is still permitted at RESTRICTED, but SupportSurfaceOrder.${o2_id}.requires_director_override == true at creation time, with authorized_cost_cents == 32400 and version == 1"
            - "Call 4 (3rd HAPI) is the no-change step: Unit.${u1_id}.open_hapi_rca_count == 3 with survey_posture still RESTRICTED, and because the posture did not CHANGE, hop 5 did not re-fire — SupportSurfaceOrder.${o2_id}.version is still 1 and SupportSurfaceOrder.${o1_id}.version is still 2"
            - "Call 5 (4th HAPI) crosses the FROZEN floor: Unit.${u1_id}.open_hapi_rca_count == 4 and survey_posture == FROZEN"
            - "Call 5's hop 5 re-fired on every still-REQUESTED order: SupportSurfaceOrder.${o1_id}.version == 3 and SupportSurfaceOrder.${o2_id}.version == 2, both with requires_director_override == true and posture_hold_applied_at == 2026-08-01T00:00:00Z"
            - "Call 6 returns HTTP 409 with data.error_id == ERR_UNIT_POSTURE_RESTRICTED — at FROZEN the order may not even be created, and GET /support-surface-orders?unit_id=${u1_id} still returns total_count == 2"
            - "Unit.${u1_id}.version == 5 (1 at creation, +1 per HAPI posture hop; the three order operations never touched it) and PressureInjuryCase.${k2_id}, ${k3_id}, ${k4_id} are all RCA_REQUIRED"
            - "The rental ledger stayed untouched throughout: Unit.${u1_id}.rental_encumbered_cents == 0 and rental_available_cents == 500000, because nothing was approved"

