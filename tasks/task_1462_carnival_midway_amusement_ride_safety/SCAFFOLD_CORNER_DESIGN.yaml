scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: ride_create_missing_ride_class_returns_400
        claim_type: required_fields
        grounds:
          - 'entities.Ride.fields.ride_class'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "Omitting a required input field (ride_class) yields ERR_INVALID_REQUEST with http 400 and creates nothing."
        test_recipe:
          setup: ["Fair in SETUP with a SUPERVISOR staff member"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway E1", operator_company_name: "ShowCo", location: "Lot 30", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup E1", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
          trigger:
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "NoClass", manufacturer: "MFG", model: "X", serial_number: "SN-E1", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"
            - "GET /midway/rides?fair_id=${fair_id} returns an empty list (nothing persisted)"

      - name: inspector_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - 'entities.Inspector.fields.max_daily_inspections'
          - 'entities.Inspector.fields.active'
        distinguishing_aspect: "Omitting max_daily_inspections applies the declared default 3; active defaults to true."
        test_recipe:
          setup: ["empty database; logical clock pinned at the startup default"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
          trigger:
            - { call: "POST /midway/inspectors", payload: { full_name: "Default Insp", license_number: "LIC-DF-1" }, as: StateProgramAdmin, captures: { cap: "$.data.max_daily_inspections", act: "$.data.active", iid: "$.data.id" } }
          assert:
            - "Inspector.${iid}.max_daily_inspections == 3"
            - "Inspector.${iid}.active == true"

      - name: fair_create_with_computed_field_rejected
        claim_type: computed_fields
        grounds:
          - 'entities.Fair.fields.status'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "Supplying a system/computed field (status) in a create body is rejected with ERR_INVALID_REQUEST rather than silently honored."
        test_recipe:
          setup: ["empty database; logical clock pinned at the startup default"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
          trigger:
            - { call: "POST /midway/fairs", payload: { name: "Hack Fair", operator_company_name: "ShowCo", location: "Lot X", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 100, status: "PERMITTED" }, as: StateProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: system_fields_server_minted_against_default_clock
        claim_type: system_fields
        grounds:
          - 'entities.Fair'
          - 'endpoints[POST /midway/_clock/set_current_utc]'
        distinguishing_aspect: "Before any clock-set call the logical clock is exactly 2026-08-01T00:00:00Z, so the first fair's created_at == 2026-08-01T00:00:00.000Z, version == 1, and status == SETUP."
        test_recipe:
          setup: ["empty database; logical clock explicitly pinned to the startup default"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
          trigger:
            - { call: "POST /midway/fairs", payload: { name: "Clock Fair", operator_company_name: "ShowCo", location: "Lot C", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 100 }, as: StateProgramAdmin, captures: { fid: "$.data.id", cat: "$.data.created_at", ver: "$.data.version", st: "$.data.status" } }
          assert:
            - "created_at == '2026-08-01T00:00:00.000Z' (fixed startup default, never wall-clock)"
            - "version == 1 and status == SETUP and id is a bare UUID"

      - name: ride_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - 'errors[ERR_NOT_FOUND]'
          - 'endpoints[GET /midway/rides/{id}]'
        distinguishing_aspect: "A well-formed but unknown ride id returns ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty database; logical clock pinned at the startup default"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
          trigger:
            - { call: "GET /midway/rides/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: StateProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: list_pagination_defaults_and_envelope
        claim_type: listing
        grounds:
          - 'response_envelope'
          - 'endpoints[GET /midway/fairs]'
        distinguishing_aspect: "GET list honors limit/offset and reports total_count/has_more; the default limit is 10 and the success envelope carries meta.api_request_id plus response_type 'array'."
        test_recipe:
          setup: ["two fairs exist"]
          setup_api_calls:
            - { call: "POST /midway/fairs", payload: { name: "Fair One", operator_company_name: "ShowCo", location: "Lot A", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 100 }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Fair Two", operator_company_name: "ShowCo", location: "Lot B", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 100 }, as: StateProgramAdmin }
          trigger:
            - { call: "GET /midway/fairs?limit=1&offset=0", as: StateProgramAdmin }
          assert:
            - "response_type == 'array' and meta.api_request_id is present"
            - "total_count == 2, has_more == true, data length == 1, limit == 1, offset == 0"

      - name: weather_observation_is_append_only_without_version
        claim_type: immutability
        grounds:
          - 'entities.WeatherObservation'
          - 'endpoints[POST /midway/weather-observations]'
        distinguishing_aspect: "WeatherObservation declares common_fields: false — its response exposes id and created_at but no version/updated_at, and no update/delete endpoint exists in §1.5."
        test_recipe:
          setup: ["Permitted fair with one licensed ride; day 2026-08-03 in CHECKLIST_PHASE"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway E7", operator_company_name: "ShowCo", location: "Lot 31", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup E7", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew E7", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp E7a", license_number: "LIC-E7-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp E7b", license_number: "LIC-E7-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-E7-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_insp}" }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v: "$.data.version" } }
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v}" }, as: StateInspector, as_user_id: "${insp2_id}" }
            - { call: "POST /midway/operating-days", payload: { fair_id: "${fair_id}", date: "2026-08-03", max_attendance: 100 }, as: FairManager, as_user_id: "${sup_id}", captures: { day_id: "$.data.id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/operating-days/${day_id}/begin-checklists", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /midway/weather-observations", payload: { operating_day_id: "${day_id}", wind_speed_mph: 12 }, as: FairManager, as_user_id: "${sup_id}", captures: { oid: "$.data.id" } }
          assert:
            - "response contains id, created_at, operating_day_id, wind_speed_mph — and no 'version' or 'updated_at' key"
            - "no sweep fires: Ride.${ride_id}.daily_status == CLOSED (12 < 30 and rides were never opened)"
  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: appointment_cancel_after_completion_rejected
        claim_type: invalid_transition
        grounds:
          - 'state_machines.InspectionAppointment'
          - 'errors[ERR_APPOINTMENT_INVALID_STATE]'
        distinguishing_aspect: "COMPLETED_PASS is terminal for scheduling purposes: cancel on a completed appointment returns ERR_APPOINTMENT_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["Permit-requested fair with one verified ride; FAIR_WIDE appointment on 2026-08-02 completed PASS"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway SM1", operator_company_name: "ShowCo", location: "Lot 32", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup SM1", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew SM1", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp SM1", license_number: "LIC-SM1-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-SM1-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_insp}" }
          trigger:
            - { call: "POST /midway/inspection-appointments/${appt_id}/cancel", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_APPOINTMENT_INVALID_STATE with http 409"
            - "InspectionAppointment.${appt_id}.status == COMPLETED_PASS (unchanged)"

      - name: fair_full_lifecycle_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - 'state_machines.Fair.TEARDOWN_to_ARCHIVED'
          - 'state_machines.Ride.setup_status=SETUP_VERIFIED_to_setup_status=DISMANTLED'
          - 'errors[ERR_RIDES_NOT_DISMANTLED]'
          - 'errors[ERR_FAIR_INVALID_STATE]'
        distinguishing_aspect: "Archive is refused while any ride is undismantled (ERR_RIDES_NOT_DISMANTLED); after a TEARDOWN-shift-covered dismantle the archive succeeds; an ARCHIVED fair rejects request-permit with ERR_FAIR_INVALID_STATE."
        test_recipe:
          setup: ["Permitted fair with one licensed ride; no operating days ever opened; clock advanced past closing_date to 2026-08-06"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway SM2", operator_company_name: "ShowCo", location: "Lot 33", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup SM2", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew SM2", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp SM2a", license_number: "LIC-SM2-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp SM2b", license_number: "LIC-SM2-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-SM2-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_insp}" }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v: "$.data.version" } }
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v}" }, as: StateInspector, as_user_id: "${insp2_id}" }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T08:00:00Z" }, as: StateProgramAdmin }
            - { call: "GET /midway/staff/${crew_id}", as: FairManager, as_user_id: "${sup_id}", captures: { crew_v2: "$.data.version" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-06", start_hour: 6, end_hour: 12, shift_role: "TEARDOWN", expected_staff_version: "${crew_v2}" }, as: FairManager, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /midway/fairs/${fair_id}/begin-teardown", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/fairs/${fair_id}/archive", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { err_pre: "$.data.error_id" } }
            - { call: "POST /midway/rides/${ride_id}/dismantle", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/archive", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { err_post: "$.data.error_id" } }
          assert:
            - "begin-teardown succeeds (no OperatingDay in an active posture; 2026-08-06 > closing 2026-08-05)"
            - "first archive -> err_pre == ERR_RIDES_NOT_DISMANTLED (ride still SETUP_VERIFIED)"
            - "dismantle succeeds (covering TEARDOWN shift on 2026-08-06) and sets setup_status == DISMANTLED, license_status == REVOKED"
            - "second archive -> Fair.status == ARCHIVED"
            - "request-permit on the ARCHIVED fair -> err_post == ERR_FAIR_INVALID_STATE with http 409"

      - name: ride_initial_state_defaults
        claim_type: initial_state
        grounds:
          - 'state_machines.Ride'
          - 'entities.Ride.fields.cycles_since_inspection'
        distinguishing_aspect: "A newly registered ride starts INSTALLED / PENDING / CLOSED on its three parallel dimensions with both counters at 0."
        test_recipe:
          setup: ["Fair in SETUP with a SUPERVISOR"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway SM3", operator_company_name: "ShowCo", location: "Lot 34", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup SM3", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
          trigger:
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-SM3-1", ride_class: "EXTREME", capacity_per_cycle: 2, min_rider_height_in: 52, max_rider_height_in: 84, wind_limit_mph: 20, cycle_inspection_interval: 2, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { rid: "$.data.id" } }
          assert:
            - "setup_status == INSTALLED, license_status == PENDING, daily_status == CLOSED"
            - "cycles_since_inspection == 0 and minor_incidents_today == 0 and version == 1"

      - name: checklist_double_submit_rejected
        claim_type: idempotency
        grounds:
          - 'state_machines.DailyChecklist.DRAFT_to_SUBMITTED'
          - 'errors[ERR_CHECKLIST_INVALID_STATE]'
        distinguishing_aspect: "Repeating the submit trigger once the checklist is SUBMITTED fails with ERR_CHECKLIST_INVALID_STATE — the transition is not idempotent."
        test_recipe:
          setup: ["Permitted fair; licensed ride; day 2026-08-03 in CHECKLIST_PHASE; checklist created and submitted once"]
          setup_api_calls:
