          assert:
            - "the off-panel vote returns HTTP 409 with data.error_id == ERR_NOT_A_PANELIST"
            - "the reporter's vote returns HTTP 409 with data.error_id == ERR_PANEL_CONFLICT_OF_INTEREST, NOT ERR_NOT_A_PANELIST - priority 26 outranks priority 35 and the reporter is off-panel too"
            - "RESPONSIBLE with no severity_recommendation returns HTTP 409 with data.error_id == ERR_SEVERITY_RECOMMENDATION_REQUIRED"
            - "ABSTAIN with severity_recommendation 5 returns HTTP 409 with data.error_id == ERR_SEVERITY_RECOMMENDATION_NOT_ALLOWED"
            - "GET /integrity/panel-votes?session_id=${session_id} returns total_count 3 after the three accepted votes - none of the four refusals persisted a row"
