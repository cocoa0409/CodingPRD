          - entities.Membership.fields.makeup_credit_balance
        distinguishing_aspect: >
          Depth-3 chain from POST /sessions/{id}/cancel: (1) enrollment -> EXCUSED AttendanceRecord,
          (2) EXCUSED record -> minted MakeupCredit, (3) MakeupCredit -> Membership.makeup_credit_balance += 1.
          Each link is caused by the previous link, not by the cancel directly.
