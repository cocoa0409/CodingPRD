  # ---------------------------------------------------------------------------
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: member_stay_confirmable_only_while_host_onboarding_approved
        grounds:
          - state_machines.StayRequest.REQUESTED_to_CONFIRMED
          - state_machines.HostBusiness.APPROVED_to_SUSPENDED
          - validations[priority=5]
          - entities.HostBusiness.fields.onboarding_status
        distinguishing_aspect: |
          StayRequest -> HostBusiness gate: the REQUESTED -> CONFIRMED edge is
          admitted on a host whose onboarding_status is APPROVED and refused with
          ERR_HOST_NOT_ACCEPTING_STAYS once that host moves to SUSPENDED, so the
          same request row is confirmable and then not, purely on the host's state.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-06-01T00:00:00Z"
            - "TX/FARM host approved with one 40-foot site labelled G1"
            - "One ACTIVE CLASSIC member with a self-contained 30-foot CLASS_C vehicle"
            - "One stay request on 2026-06-10 for 2 nights left REQUESTED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Gate Farm", category: "FARM", address_line1: "15 Gate Rd", state_code: "TX", self_contained_required: false }
