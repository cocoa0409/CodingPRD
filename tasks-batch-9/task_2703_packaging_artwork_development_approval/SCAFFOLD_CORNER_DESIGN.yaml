            - call: "GET /element-checks"
              payload: {artwork_version_id: "${v1_id}", result: "FAIL"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { stale_check: "$.data[0].id" }
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: {verification_note: "Second verification run, unchanged artwork."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
