        distinguishing_aspect: "status=WITHDRAWN filter returns only withdrawn bids (1 of 2), and the filtered-out PLACED bid never appears."
        test_recipe:
          setup: ["package UNDER_LEVELING; one bid WITHDRAWN, one PLACED"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-P3", project_number: "P3", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
