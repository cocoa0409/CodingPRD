            - "surface 1, in the response body — $.data.schedule_status == 'DEFAULTED', $.data.result_status == 'VERIFIED', $.data.verified_at == '2026-08-15T21:00:00Z', $.data.defaulting_side == 'HOME', $.data.default_kind == 'NO_SHOW', $.data.away_lines_won == 3, $.data.away_sets_won == 6, $.data.away_games_won == 36, $.data.home_lines_won == 0, $.data.home_games_won == 0 and $.data.winner_team_id == '${tmb_id}'"
            - "surface 2, first read — GET /tennis/strikes with match_id=${m1_id} returns $.data.total_count == 1 with kind NO_SHOW_DEFAULT, weight 1, player_id ${pa1_id} and status ACTIVE"
            - "surface 3, first read — GET /tennis/players/${pa1_id} returns $.data.strike_count == 1 and $.data.status == 'ACTIVE', because 1 < strike_limit 3"
            - "surface 4, first read — GET /tennis/teams/${tmb_id} returns matches_won 1, lines_won 3, sets_won 6, games_won 36 and standings_points 6; GET /tennis/teams/${tma_id} returns matches_lost 1, lines_won 0, games_lost 36 and standings_points 0"
            - "surface 5, first read — GET /tennis/leagues/${lg_id}/standings returns ${tmb_id} first with 6 points, and the PROVISIONAL basis returns the same rows because a defaulted match is already VERIFIED"
            - "the invariants hold on that first observation: matches_won + matches_lost == 2, lines 3 == 3, sets 6 == 6, games 36 == 36 and points summed == 3 * 1 + 3 == 6"
            - "GET /tennis/roster-spots with team_id=${tma_id} returns both spots still ACTIVE with verified_match_count 0, since a defaulted match credits no line to a named player"
            - "every one of those reads returns the same body when repeated, and a second default call on the same match returns 409 rather than duplicating the strike"
