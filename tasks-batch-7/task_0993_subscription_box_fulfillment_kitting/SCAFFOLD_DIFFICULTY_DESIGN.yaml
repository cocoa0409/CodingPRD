            - call: "POST /box-plans/${bd1_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${bd1_pl_v}" }
              as: ClientOps
              as_user_id: "${bd1_cl}"
              captures: { bd1_rv: $.data.id }
            - call: "PUT /kit-revisions/${bd1_rv}/bom-lines"
              payload: { lines: [{ component_id: "${bd1_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${bd1_cl}"
            - { call: "POST /kit-revisions/${bd1_rv}/approve", as: ClientOps, as_user_id: "${bd1_cl}" }
            - { call: "POST /box-plans/${bd1_pl}/activate", as: ClientOps, as_user_id: "${bd1_cl}" }
            - call: "POST /box-plans/${bd1_pl}/import-batches"
              payload: { rows: [{ email: "bd1a@x.test", zone: 2 }, { email: "bd1b@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${bd1_cl}"
              captures: { bd1_ib: $.data.id }
            - { call: "POST /import-batches/${bd1_ib}/commit", as: ClientOps, as_user_id: "${bd1_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${bd1_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { bd1_rn: $.data.id }
          trigger:
            - call: "POST /assembly-runs/${bd1_rn}/lock"
              as: WarehouseOps
              captures: { bd1_status: $.data.status, bd1_planned: $.data.planned_box_count, bd1_est: $.data.estimate_cents }
            - call: "GET /clients/${bd1_cl}"
              as: BillingAdmin
