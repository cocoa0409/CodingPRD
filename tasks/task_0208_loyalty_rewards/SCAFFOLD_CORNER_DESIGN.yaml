        grounds: ["errors[ERR_LOT_EXPIRED]", "validations[priority=16]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / member_available_vs_projected_balance_diverge
          rationale: "Past-expiry-lot handling (available vs projected) is exercised by that §1.8 instance; the internal burn guard reuses the same expiry predicate."

  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_define_tier_returns_403
        claim_type: role_denied
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Member calling POST /programs/{id}/tiers (a ProgramAdmin-exclusive op) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["ACTIVE program; member M acting as Member role."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "GOLD", qualify_threshold: 5000, earn_multiplier: 1.5, transfer_ratio: 0.8, rank: 2 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: member_cannot_redeem_for_another_member_returns_403
        claim_type: ownership_denied
        grounds: [roles, "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Member A (entity_backed) calling POST /redemptions with member_id = Member B -> ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["ACTIVE program; reward R; members A and B; A acts on B's ledger."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/rewards"
              payload: { program_id: "${prog_id}", name: "R", point_cost: 100, tier_discount_pct: 0.0, stock: 5 }
              as: ProgramAdmin
              captures: { reward_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "a@x.com", full_name: "A", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "b@x.com", full_name: "B", birth_month_day: "04-20" }
              as: ProgramAdmin
              captures: { b_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${b_id}", eligible_amount_cents: 100000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /redemptions"
              payload: { member_id: "${b_id}", lines: [ { reward_id: "${reward_id}", quantity: 1 } ] }
              as: Member
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_auth_headers_returns_401
        claim_type: role_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A protected call (POST /programs/{id}/tiers) with the Anonymous (no auth) role -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Program exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: partner_operator_settle_own_transfer_succeeds
        claim_type: role_allowed
        grounds: [roles, state_machines.PartnerTransfer.SUBMITTED_to_SETTLED]
        distinguishing_aspect: "PartnerOperator (entity_backed:PartnerAccount) settling a SUBMITTED transfer on their own partner -> 200, status SETTLED."
        test_recipe:
          setup: ["ACTIVE program; partner P; member M with 500 points submits a transfer of 500; PartnerOperator acts as P."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/partners"
              payload: { program_id: "${prog_id}", name: "Air", transfer_block_size: 100, min_transfer_points: 100 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 50000 }
              as: ProgramAdmin
            - call: "GET /members/${m_id}"
              payload: {}
              as: ProgramAdmin
              captures: { m_v: $.data.version }
            - call: "POST /partner-transfers"
              payload: { member_id: "${m_id}", partner_account_id: "${partner_id}", loyalty_points: 500, expected_member_version: "${m_v}" }
              as: ProgramAdmin
              captures: { xfer_id: $.data.id }
          trigger:
            - call: "POST /partner-transfers/${xfer_id}/settle"
              payload: {}
              as: PartnerOperator
