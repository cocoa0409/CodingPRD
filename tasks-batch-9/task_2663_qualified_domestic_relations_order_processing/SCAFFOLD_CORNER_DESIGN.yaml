              payload: {}
              as: PlanAdministrator
              captures: { e_closed_void: $.data.error_id }
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-8"
              captures: { e_draft_terminal: $.data.error_id }
            - call: "POST /segregation-holds/${hold_id}/release"
              payload: {}
              as: PlanAdministrator
              captures: { e_hold_terminal: $.data.error_id }
          assert:
            - "${ap_status0} == \"ESTABLISHED\" and ${ap_bal0} == 400000 — the payee account is born ESTABLISHED with the converted principal (hold 400000 plus 0 earnings, because no snapshot exists on or after 2026-09-15)."
            - "${dist_status} == \"ISSUED\", ${wh} == 80000, ${fee} == 5000, ${net} == 315000, ${code} == \"CODE_2\" — a zero-basis 400000 CASH payment withholds 20% of the whole gross, lands in the mid fee tier on net_before_fee 320000, and the payee born 1975-05-05 is under 59.5 at 2026-09-15."
            - "${ap_status1} == \"CLOSED\", ${ap_bal1} == 0 and ${ap_v1} == 2 — the exhausting distribution closed the account in the SAME request that created the distribution (immediate consistency), and the version moved exactly once."
            - "${e_closed_dist} == \"ERR_AP_ACCOUNT_CLOSED\" with HTTP 409 — a 1-cent request on a CLOSED account reports the terminal-state error, not ERR_INSUFFICIENT_DISTRIBUTABLE_BALANCE, because priority 40 precedes priority 70."
            - "${e_closed_void} == \"ERR_AP_ACCOUNT_CLOSED\" with HTTP 409 — the distribution is still ISSUED and still inside tax_year 2026, so the ONLY ground for refusal is the account's terminal state; the exhausting payment is therefore permanently irreversible."
            - "${e_draft_terminal} == \"ERR_DRAFT_ORDER_NOT_UNDER_REVIEW\" and ${e_hold_terminal} == \"ERR_HOLD_NOT_HELD\", both HTTP 409 — QUALIFIED and CONVERTED are terminal too, so the whole fixture is frozen."
            - "GET /distributions/${dist_id} still reports status \"ISSUED\" and GET /tax-reports with alternate_payee_account_id=${ap_id} still returns exactly 1 row with correction_of_tax_report_id null — the refused void appended no corrective line."
            - "GET /alternate-payee-accounts/${ap_id} still reports version ${ap_v1} after all four refusals."

      - name: repeated_triggers_are_refused_or_are_true_no_ops
        claim_type: idempotency
        grounds:
          - state_machines[AttorneyAuthorization].transitions[ACTIVE->REVOKED].preconditions
          - errors.ERR_AUTHORIZATION_NOT_ACTIVE
          - endpoints[POST /_ops/run-segregation-sweep]
          - calculations.hold_window_and_deadlines
        distinguishing_aspect: |
          Two opposite idempotency contracts coexist. A repeated single-entity trigger is an ERROR — the
          second revoke of the same authorization returns ERR_AUTHORIZATION_NOT_ACTIVE rather than
          silently succeeding, and revoked_at must not be restamped. A repeated SWEEP, by contrast, is a
          successful NO-OP — the second run returns 200 with all five id arrays empty because nothing is
          left in an eligible state, and it must not re-deny, re-append communications or re-increment any
          version. Re-running the sweep is the standard way an operator retries after a timeout, so
          double-counting here corrupts the whole account.
        test_recipe:
          setup:
            - "A PUBLISHED plan, one participant with an assignable PRE_TAX_DEFERRAL source of 1000000, one case with an attorney authorization and a received 4000 bps draft at clock 2026-09-01 (hold expires 2028-03-02T00:00:00Z)."
