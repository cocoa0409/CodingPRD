            - "the response error_id is ERR_LOAN_DELINQUENT, NOT ERR_UPGRADE_THRESHOLD_NOT_MET"
            - "before the trigger: InstallmentLoan.${loan}.delinquency_state == GRACE and days_past_due == 10"
            - "before the trigger: InstallmentLoan.${loan}.paid_installment_count == 10 and outstanding_late_fee_cents == 0"
            - "no UpgradeRequest row exists for loan ${loan} (GET /upgrade-requests?loan_id=${loan} returns total_count == 0)"
            - "DeviceModel.${m_a}.reserved_slot_count == 0 (the rejected request reserved nothing)"
            - "InstallmentLoan.${loan}.upgrade_hold_flag == false and version is unchanged at ${loan_v}"

      - name: segregation_of_duties_beats_down_payment_insufficient_on_origination
        grounds:
          - validations.priority_70_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_101_ERR_DOWN_PAYMENT_INSUFFICIENT
          - validations.priority_102_ERR_CREDIT_LIMIT_EXCEEDED
          - calculations.credit_decision
          - rbac.RetailAssociate
        distinguishing_aspect: |
          Category pair (business_safety, business_fiscal), a different pair from the
          state-versus-fiscal conflict above, and the two errors even differ in HTTP status:
          priority 70 ERR_SEGREGATION_OF_DUTIES (403) versus priority 101
          ERR_DOWN_PAYMENT_INSUFFICIENT (422). The same physical person u-dual-role-1 files the
          SUBPRIME decision as a CreditUnderwriter and then tries to originate the loan as a
          RetailAssociate with a down payment of 9899 against a required 9900 — so the request
          simultaneously violates 70, 101 and 102 (80001 > 80000). The safety rule must win
          with 403, and the control call by u-assoc-1 with the same 9899 must then surface
          101, not 102. An implementation that groups all money checks ahead of the actor
          checks, or that returns 422 for a duties conflict, fails.
        test_recipe:
          setup:
            - "One customer with no loans; Handset B published (retail 89900), so requested_principal_cents is 89900."
            - "The application is decided SUBPRIME by X-User-ID u-dual-role-1, giving CONDITIONAL_APPROVED with credit_limit_cents 80000, conditional_down_payment_required_cents 9900 and approved_principal_cents 80000."
