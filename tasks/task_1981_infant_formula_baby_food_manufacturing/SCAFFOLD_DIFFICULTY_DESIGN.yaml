              captures: { err_result: $.data.error_id }
          assert:
            - "error_id == ERR_SUPPLIER_NOT_QUALIFIED (supplier is PENDING_AUDIT, not QUALIFIED)"
            - "HTTP status == 422"

  # =========================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: process_validation_expiry_blocks_production_start
        grounds:
          - state_machines.ProcessValidation.PASSED_to_EXPIRED
          - validations[priority=10]
          - state_machines.ProductionBatch.PLANNED_to_IN_PRODUCTION
        distinguishing_aspect: |
          Interval semantics: ProcessValidation has a validity window [completed_at, valid_until].
          Production start requires a PASSED validation whose valid_until > current_timestamp.
          If the validation has expired (system auto-transition PASSED->EXPIRED), the
          production start is rejected. This is a point-in-window check (not overlap),
          testing whether the current timestamp falls inside the validity interval.
        test_recipe:
          setup:
            - "An ACTIVE Formula exists with all prerequisites met."
            - "A ProcessValidation was PASSED but with validity that has now expired."
            - "Clock starts at 2026-08-01, then advances past the validation's valid_until."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-6-12M"
                nutrient_specs:
                  - nutrient_code: "IRON"
                    unit: "mg"
                    min_per_100kcal: 1.00
                    max_per_100kcal: 2.00
                    target_per_100kcal: 1.50
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
