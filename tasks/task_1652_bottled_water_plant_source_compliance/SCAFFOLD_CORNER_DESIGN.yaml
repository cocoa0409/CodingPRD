          trigger:
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-06T09:30:00Z", scheduled_end: "2026-08-06T10:30:00Z" }, as: SanitationLead, captures: { err: $.data.error_id } }
          assert:
