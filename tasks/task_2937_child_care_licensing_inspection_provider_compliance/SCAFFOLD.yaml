# =============================================================================
# PRD Benchmark Scaffold — Child Care Licensing Inspection & Provider Compliance
# Generated per skills/prd-bench-scaffold-generator/SKILL.md §1.0–§1.7
# =============================================================================
scenario: |
  2937. Child Care Licensing Inspection & Provider Compliance (state child care
  licensing agency): application, background check clearance for staff and
  household members, and initial inspection, ratio, group size and supervision
  requirement verification by age group, health and safety checklist inspection
  with violation classification by severity, complaint intake, investigation
  timelines and substantiation determinations, corrective action plans,
  probation, suspension and revocation ladder, provider capacity changes, site
  moves and license amendments, public inspection report posting and consumer
  education, serious injury and fatality reporting protocols

domain_name: child-care-licensing-compliance
api_prefix: /licensing

# --- §1.0 Response Envelope (FIXED — verbatim) -------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# --- §0.1–§0.3 Complexity Profile -------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Fourteen peer entities linked by explicit foreign-key body fields. No entity
    is nested inside another's URL path; every collection sits at depth 1 under
    the /licensing prefix and children are discovered through filtered list
    endpoints (e.g. GET /licensing/violations?inspection_id=...). Provider is the
    hub but is NOT a URL parent.

  state_machine_shape: cyclic
  state_machine_shape_note: |
    Three distinct non-linear shapes coexist. (1) Provider carries two
    independent state dimensions on one row — application_status and
    license_status — that advance on separate triggers, and license_status is
    cyclic (FULL -> PROBATION -> FULL, PROBATION -> SUSPENDED -> PROBATION).
    (2) CorrectiveActionPlan is cyclic (SUBMITTED -> REJECTED -> SUBMITTED,
    bounded by CAP_MAX_REVIEW_CYCLES). (3) BackgroundCheck branches
    (SUBMITTED -> {CLEARED, DISQUALIFIED}) and loops through the waiver path
    (DISQUALIFIED -> WAIVER_PENDING -> {WAIVED, DISQUALIFIED}). Inspection adds
    a revert edge (PENDING_REVIEW -> IN_PROGRESS).

  relationship_patterns:
    - one_to_many
    - self_referential      # Violation.repeat_of_violation_id -> Violation.id
    - cross_aggregate       # Complaint -> Inspection -> Violation -> Provider counters

  role_model: segregation_of_duties
  role_model_note: |
    Eight roles. Two hard segregation rules are enforced against X-User-ID:
    (a) an Inspector who finalized any Inspection of a Provider within
    SEGREGATION_LOOKBACK_MONTHS may not be assigned as that Provider's complaint
    investigator; (b) the LicensingSupervisor operator id that approved a
    CorrectiveActionPlan may not issue an EnforcementAction whose
    source_inspection_id is that CAP's inspection_id.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      A child care operator applying for or holding a license. Hub entity: every
      other business entity except Inspector and ChecklistItem references it.
      Carries two independent state dimensions (application_status and
      license_status) plus five derived compliance counters.
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal business name of the operator.
        constraints: "1..200 chars, non-blank"
      - name: county_code
        type: string
        source: input
        description: Licensing county of jurisdiction.
        constraints: "must match ^CTY-[0-9]{2}$"
      - name: site_address
        type: string
        source: input
        description: Street address of the care site currently on the license record.
        constraints: "1..300 chars, non-blank"
      - name: program_type
        type: enum
        source: input
        description: Facility class; fixes capacity_ceiling.
        constraints: "one of {CENTER, GROUP_HOME, FAMILY_HOME}"
      - name: requested_capacity
        type: integer
        source: input
        description: Total child capacity requested on the application.
        constraints: ">= 1 and <= capacity_ceiling for the chosen program_type"
      - name: capacity_ceiling
        type: integer
        source: computed
        description: |
          Statutory maximum for program_type, from PROGRAM_CAPACITY_CEILING:
          CENTER=120, GROUP_HOME=40, FAMILY_HOME=12. Set at creation, recomputed
          only when an APPROVED SITE_MOVE amendment changes program class (it
          never does in this scaffold, so it is effectively immutable).
      - name: licensed_capacity
        type: integer
        source: computed
        default: 0
        description: |
          Currently usable capacity. 0 until license_decision ISSUE. On ISSUE it
          is set to the sum of AgeGroupRoster.approved_group_size over the
          provider's rosters. Zeroed (moved into suspended_capacity) when a
          SUSPENSION EnforcementAction is effectuated.
      - name: suspended_capacity
        type: integer
        source: computed
        default: 0
        description: |
          Capacity held in escrow while a SUSPENSION is EFFECTIVE. The pair
          (licensed_capacity, suspended_capacity) is the conserved capacity-slot
          quantity of §1.3 capacity_slot_conservation.
      - name: application_status
        type: enum
        source: system
        default: DRAFT
        description: Application dimension of the Provider state machine.
        constraints: "one of {DRAFT, SUBMITTED, CHECKS_CLEARED, INITIAL_INSPECTION_PASSED, LICENSED, DENIED}"
      - name: license_status
        type: enum
        source: system
        default: NONE
        description: License dimension of the Provider state machine; advances independently of application_status.
        constraints: "one of {NONE, PROVISIONAL, FULL, PROBATION, SUSPENDED, REVOKED}"
      - name: license_number
        type: string
        source: computed
        default: null
        description: |
          Minted on license_decision ISSUE as
          "LIC-" + county_code[4:] + "-" + zero_pad(seq, 4), where seq is
          1 + count(Provider WHERE county_code = this.county_code AND
          licensed_at IS NOT NULL) evaluated before this provider is stamped.
          Null before issuance.
      - name: licensed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which license_decision ISSUE succeeded.
      - name: provisional_started_at
        type: datetime
        source: system
        default: null
        description: Instant license_status became PROVISIONAL; baseline for PROVISIONAL_PERIOD_MONTHS.
      - name: open_violation_points
        type: number
        source: computed
        default: 0
        description: |
          Sum of Violation.assessed_points over violations whose inspection
          belongs to this provider, inspection.status = FINALIZED, and
          violation.status IN {CITED, CORRECTION_PENDING, UNCORRECTED}. All-time
          window, no tie-break needed (pure sum). Recomputed on every violation
          create/disposition and on inspection finalize/void.
      - name: resolved_violation_points
        type: number
        source: computed
        default: 0
        description: |
          Same source set and window as open_violation_points but with
          violation.status = VERIFIED_CORRECTED only.
      - name: lifetime_violation_points
        type: number
        source: computed
        default: 0
        description: |
          Same source set and window but with violation.status != VACATED.
          Invariant: lifetime_violation_points == open_violation_points +
          resolved_violation_points (see §1.3 violation_point_conservation).
      - name: critical_open_count
        type: integer
        source: computed
        default: 0
        description: |
          Count of violations in the open_violation_points source set whose
          severity = CRITICAL.
      - name: critical_violation_count_24mo
        type: integer
        source: computed
        default: 0
        description: |
          Count of violations with severity = CRITICAL, status != VACATED, whose
          inspection.status = FINALIZED and inspection.finalized_at >
          now - RISK_LOOKBACK_MONTHS (24 months), boundary exclusive on the lower
          edge.
      - name: substantiated_complaint_count_24mo
        type: integer
        source: computed
        default: 0
        description: |
          Count of this provider's Complaints with determination = SUBSTANTIATED
          and determined_at > now - RISK_LOOKBACK_MONTHS (lower edge exclusive).
      - name: inconclusive_complaint_count_24mo
        type: integer
        source: computed
        default: 0
        description: |
          Count of this provider's Complaints with determination = INCONCLUSIVE
          and determined_at > now - RISK_LOOKBACK_MONTHS (lower edge exclusive).
      - name: risk_score
        type: number
        source: computed
        default: 0
        description: |
          Persisted ENFORCEMENT_REVIEW variant of §1.3 provider_risk_assessment,
          2 decimal places. The INTAKE_SCREENING variant is never persisted; it is
          only returned by GET /licensing/providers/{provider_id}/risk-assessment.
      - name: risk_tier
        type: enum
        source: computed
        default: LOW
        description: Band of the persisted ENFORCEMENT_REVIEW risk_score.
        constraints: "one of {LOW, MODERATE, HIGH, SEVERE}"
      - name: current_ladder_step
        type: integer
        source: computed
        default: 0
        description: |
          max(EnforcementAction.ladder_step) over this provider's actions with
          status IN {ISSUED, EFFECTIVE, UPHELD}; 0 when that set is empty.
        constraints: "0..4"
      - name: probation_cycle_count
        type: integer
        source: computed
        default: 0
        description: Number of times license_status has entered PROBATION.
      - name: clearance_complete
        type: boolean
        source: computed
        default: false
        description: |
          True when the provider has >= 1 StaffMember with member_type = DIRECTOR
          and every StaffMember of the provider has clearance_status = CLEARED.
      - name: decision_reason
        type: string
        source: input
        default: null
        description: Free-text reason recorded on the license decision (ISSUE or DENY).

  - name: Inspector
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      Agency field staff. Identity entity behind both the LicensingInspector and
      ComplaintInvestigator roles, and the scheduling resource whose visit
      windows must not overlap.
    fields:
      - name: full_name
        type: string
        source: input
        description: Inspector name.
        constraints: "1..120 chars, non-blank"
      - name: county_code
        type: string
        source: input
        description: Home county assignment.
        constraints: "must match ^CTY-[0-9]{2}$"
      - name: certified_age_groups
        type: array
        source: input
        description: |
          Age groups this inspector is certified to observe. An inspection whose
          age_groups_observed is not a subset of this set is rejected at
          submit-for-review.
        constraints: "non-empty array of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}, no duplicates"
      - name: max_daily_visits
        type: integer
        source: input
        default: 3
        description: Maximum inspections this inspector may hold on one UTC calendar date.
        constraints: "1..8"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: ACTIVE inspectors may be scheduled; ON_LEAVE inspectors may not.
        constraints: "one of {ACTIVE, ON_LEAVE}"
      - name: scheduled_visit_count
        type: integer
        source: computed
        default: 0
        description: |
          Count of this inspector's Inspections with status IN {SCHEDULED,
          IN_PROGRESS, PENDING_REVIEW}.

  - name: ChecklistItem
    parent: null
    common_fields: false
    entity_kind: configuration
    description: |
      Immutable health-and-safety checklist row. No update or delete endpoint and
      no version field; a citation references it and inherits its severity unless
      the inspector supplies severity_override.
    fields:
      - name: code
        type: string
        source: input
        description: Regulation code, unique across the catalog.
        constraints: "must match ^[A-Z]{2}-[0-9]{3}$; unique"
      - name: title
        type: string
        source: input
        description: Short human label for the requirement.
        constraints: "1..160 chars, non-blank"
      - name: category
        type: enum
        source: input
        description: Checklist section the item belongs to.
        constraints: "one of {SUPERVISION, SANITATION, NUTRITION, FIRE_SAFETY, MEDICATION, BACKGROUND_CHECK, RATIO, FACILITY, RECORDS}"
      - name: default_severity
        type: enum
        source: input
        description: Severity applied to a citation of this item when no override is supplied.
        constraints: "one of {CRITICAL, SERIOUS, MODERATE, MINOR}"
      - name: age_groups_applicable
        type: array
        source: input
        description: Age groups the requirement governs.
        constraints: "non-empty array of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}, no duplicates"
      - name: infant_sensitive
        type: boolean
        source: input
        default: false
        description: |
          Marks items whose breach is aggravated when the citation concerns the
          INFANT age group (see §1.3 violation_point_assessment).

  - name: StaffMember
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      A staff member, volunteer, or household member subject to background check
      clearance. Household members of FAMILY_HOME and GROUP_HOME providers are
      cleared on the same rules as paid staff.
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider this person is attached to. Immutable after creation."
      - name: full_name
        type: string
        source: input
        description: Person's legal name.
        constraints: "1..120 chars, non-blank"
      - name: member_type
        type: enum
        source: input
        description: Category of the person; DIRECTOR is required for clearance_complete.
        constraints: "one of {DIRECTOR, LEAD_TEACHER, ASSISTANT, VOLUNTEER, HOUSEHOLD_MEMBER}"
      - name: role_title
        type: string
        source: input
        default: null
        description: Optional job title.
      - name: date_of_birth
        type: string
        source: input
        description: Birth date, used only for record completeness.
        constraints: "ISO date YYYY-MM-DD"
      - name: qualified_age_groups
        type: array
        source: input
        description: |
          Age groups this person may supervise as a roster lead. Empty array is
          allowed for HOUSEHOLD_MEMBER.
        constraints: "array of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}, no duplicates"
      - name: clearance_status
        type: enum
        source: computed
        default: PENDING
        description: |
          Derived from this person's BackgroundChecks:
          BARRED   if any check has status = DISQUALIFIED;
          WAIVER_PENDING if no check is DISQUALIFIED and any check has status = WAIVER_PENDING;
          CLEARED  if the set of check_types whose status IN {CLEARED, WAIVED}
                   AND (expires_at IS NULL OR expires_at > now) covers
                   REQUIRED_CHECK_TYPES, and no check of this person is
                   DISQUALIFIED or WAIVER_PENDING;
          PENDING  otherwise.
        constraints: "one of {PENDING, CLEARED, BARRED, WAIVER_PENDING}"
      - name: supervision_eligible
        type: boolean
        source: computed
        default: false
        description: |
          True when clearance_status = CLEARED AND member_type IN {DIRECTOR,
          LEAD_TEACHER, ASSISTANT}. VOLUNTEER and HOUSEHOLD_MEMBER are never
          supervision-eligible.
      - name: barred_offense_tier
        type: enum
        source: computed
        default: NONE
        description: |
          Highest disqualifying tier across this person's DISQUALIFIED checks,
          ranked TIER_1_PERMANENT > TIER_2_FIVE_YEAR > TIER_3_WAIVABLE > NONE.
        constraints: "one of {NONE, TIER_1_PERMANENT, TIER_2_FIVE_YEAR, TIER_3_WAIVABLE}"

  - name: BackgroundCheck
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      One clearance check of one type for one StaffMember. Branches on result and
      loops through the waiver path for waivable tiers.
    fields:
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the person being checked. Immutable after creation."
      - name: check_type
        type: enum
        source: input
        description: |
          Registry queried. REQUIRED_CHECK_TYPES = {FBI_FINGERPRINT,
          CHILD_ABUSE_REGISTRY}; the other two are optional supplements.
        constraints: "one of {FBI_FINGERPRINT, CHILD_ABUSE_REGISTRY, STATE_CRIMINAL, SEX_OFFENDER_REGISTRY}"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Check lifecycle state.
        constraints: "one of {SUBMITTED, CLEARED, DISQUALIFIED, WAIVER_PENDING, WAIVED}"
      - name: disqualifying_offense_tier
        type: enum
        source: system
        default: NONE
        description: |
          Tier reported by the registry. TIER_1_PERMANENT is never waivable;
          TIER_2_FIVE_YEAR and TIER_3_WAIVABLE may enter the waiver path.
        constraints: "one of {NONE, TIER_1_PERMANENT, TIER_2_FIVE_YEAR, TIER_3_WAIVABLE}"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of creation.
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: Instant the registry result was recorded (CLEARED or DISQUALIFIED).
      - name: expires_at
        type: datetime
        source: computed
        default: null
        description: |
          decided_at + CLEARANCE_VALIDITY_MONTHS (60) months when status IN
          {CLEARED, WAIVED}; null otherwise. A check whose expires_at <= now no
          longer counts toward REQUIRED_CHECK_TYPES coverage in the
          clearance_status derivation.
      - name: waiver_requested_at
        type: datetime
        source: system
        default: null
        description: Instant the provider requested a waiver of a disqualification.
      - name: waiver_rationale
        type: string
        source: input
        default: null
        description: Provider's written justification supplied with the waiver request.
      - name: waiver_decided_at
        type: datetime
        source: system
        default: null
        description: Instant the supervisor granted or refused the waiver.

  - name: AgeGroupRoster
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      One age-group classroom/group at a provider. Holds the enrollment and staff
      counts that ratio, group-size and supervision verification act on, and its
      approved_group_size is the unit that sums to Provider.licensed_capacity.
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; owning provider. Immutable after creation."
      - name: age_group
        type: enum
        source: input
        description: |
          Age band; fixes the staff ratio and maximum group size. Unique per
          provider: (provider_id, age_group) may appear at most once.
        constraints: "one of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}; unique with provider_id"
      - name: requested_group_size
        type: integer
        source: input
        description: Group size the provider asks for.
        constraints: ">= 1 and <= AGE_GROUP_MAX_SIZE[age_group]"
      - name: approved_group_size
        type: integer
        source: computed
        default: 0
        description: |
          0 until the provider's license_decision ISSUE, at which point it is set
          to requested_group_size for every roster. Later changed only by an
          APPROVED CAPACITY_INCREASE / CAPACITY_DECREASE / AGE_GROUP_ADD
          amendment.
      - name: enrolled_count
        type: integer
        source: input
        default: 0
        description: Children currently enrolled in this group.
        constraints: ">= 0"
      - name: staff_assigned_count
        type: integer
        source: input
        default: 0
        description: Supervision-eligible staff assigned to this group.
        constraints: ">= 0"
      - name: lead_staff_member_id
        type: string
        source: input
        default: null
        description: "FK -> StaffMember.id; the designated group lead. Nulled by cascade when that person stops being supervision_eligible."
      - name: required_staff_count
        type: integer
        source: computed
        default: 0
        description: |
          ceil(enrolled_count / AGE_GROUP_RATIO[age_group]) when enrolled_count > 0,
          else exactly 0.
      - name: ratio_compliant
        type: boolean
        source: computed
        default: true
        description: "staff_assigned_count >= required_staff_count (>=, not >)."
      - name: group_size_compliant
        type: boolean
        source: computed
        default: true
        description: |
          enrolled_count <= approved_group_size AND approved_group_size <=
          AGE_GROUP_MAX_SIZE[age_group]. When approved_group_size is still 0 the
          check degenerates to enrolled_count == 0.
      - name: supervision_compliant
        type: boolean
        source: computed
        default: true
        description: |
          True when enrolled_count == 0, or when lead_staff_member_id is non-null
          AND that StaffMember has supervision_eligible = true AND age_group is in
          that StaffMember.qualified_age_groups.
      - name: last_verified_at
        type: datetime
        source: system
        default: null
        description: Instant of the most recent verify-ratio call on this roster.

  - name: Inspection
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      One scheduled on-site visit. Occupies a half-open visit window on its
      Inspector and a buffered closed window on its Provider. Its version is the
      OCC anchor for CorrectiveActionPlan creation.
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; site being inspected. Immutable after creation."
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; assigned field inspector. Immutable after creation."
      - name: complaint_id
        type: string
        source: input
        default: null
        description: "FK -> Complaint.id; set only for inspection_type = COMPLAINT, linking the visit to the allegation being investigated."
      - name: inspection_type
        type: enum
        source: input
        description: Purpose of the visit; drives which preconditions apply.
        constraints: "one of {INITIAL, ANNUAL, COMPLAINT, FOLLOW_UP, AMENDMENT_PRE_MOVE}"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Inspection lifecycle state.
        constraints: "one of {SCHEDULED, IN_PROGRESS, PENDING_REVIEW, FINALIZED, VOIDED}"
      - name: scheduled_for
        type: datetime
        source: input
        description: Start instant of the on-site visit window; must be strictly after the logical clock at creation.
      - name: duration_minutes
        type: integer
        source: input
        default: 120
        description: Length of the visit window.
        constraints: "30..480"
      - name: visit_window_end
        type: datetime
        source: computed
        description: scheduled_for + duration_minutes. The occupied window is half-open [scheduled_for, visit_window_end).
      - name: started_at
        type: datetime
        source: system
        default: null
        description: Instant the inspector started the visit.
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: Instant the inspector submitted findings for supervisor review.
      - name: finalized_at
        type: datetime
        source: system
        default: null
        description: Instant the supervisor finalized the report; baseline for correction due dates and the CAP submission window.
      - name: target_age_groups
        type: array
        source: input
        description: |
          Age groups the visit is scheduled to cover, supplied at creation. Must
          be a non-empty subset of the assigned Inspector.certified_age_groups
          (else ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP).
        constraints: "array of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}, non-empty, no duplicates"
      - name: age_groups_observed
        type: array
        source: input
        default: null
        description: |
          Age groups actually observed, supplied at submit-for-review. Must be a
          non-empty subset of the assigned Inspector.certified_age_groups.
        constraints: "array of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}, no duplicates"
      - name: outcome
        type: enum
        source: input
        default: null
        description: |
          Inspector's verdict, supplied at submit-for-review. Must be FAIL when at
          least one CRITICAL violation is cited on this inspection, and must be
          PASS when no violation at all is cited.
        constraints: "one of {PASS, CONDITIONAL_PASS, FAIL}"
      - name: preliminary_compliance_score
        type: number
        source: computed
        default: null
        description: |
          PRELIMINARY variant of §1.3 inspection_compliance_score, frozen at
          finalize and never recomputed afterwards.
      - name: final_compliance_score
        type: number
        source: computed
        default: null
        description: |
          FINAL variant of §1.3 inspection_compliance_score. Set at finalize
          (where it initially equals the PRELIMINARY value because every violation
          is still non-corrected) and recomputed on every subsequent violation
          disposition and on CAP completion.
      - name: raw_deduction_points
        type: number
        source: computed
        default: null
        description: Sum of per-violation rounded deductions behind final_compliance_score.
      - name: violation_count
        type: integer
        source: computed
        default: 0
        description: Count of this inspection's Violations with status != VACATED.
      - name: cap_required
        type: boolean
        source: computed
        default: false
        description: True at finalize when violation_count > 0.
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: Number of times this inspection has gone PENDING_REVIEW -> IN_PROGRESS.

  - name: Violation
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      One citation of one ChecklistItem on one Inspection, classified by severity
      and scored in points. Self-references the prior citation it repeats.
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the visit on which this was cited. Immutable after creation."
      - name: checklist_item_id
        type: string
        source: input
        description: "FK -> ChecklistItem.id; the requirement breached. Immutable after creation."
      - name: repeat_of_violation_id
        type: string
        source: input
        default: null
        description: "FK -> Violation.id; the earlier citation this one repeats. Must reference a violation of the same checklist_item_id, on a different inspection of the same provider, whose inspection.finalized_at is within REPEAT_LOOKBACK_MONTHS."
      - name: primary_age_group
        type: enum
        source: input
        description: |
          Age group the citation concerns; selects AGE_GROUP_EXPOSURE_WEIGHT in
          the compliance-score deduction and gates infant aggravation.
        constraints: "one of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}; must be in the ChecklistItem.age_groups_applicable"
      - name: severity_override
        type: enum
        source: input
        default: null
        description: |
          Inspector's escalation/de-escalation of the checklist default. When
          supplied it becomes severity.
        constraints: "one of {CRITICAL, SERIOUS, MODERATE, MINOR}"
      - name: severity
        type: enum
        source: computed
        description: severity_override when supplied, else ChecklistItem.default_severity. Frozen at creation.
        constraints: "one of {CRITICAL, SERIOUS, MODERATE, MINOR}"
      - name: repeat_chain_depth
        type: integer
        source: computed
        default: 0
        description: |
          0 when repeat_of_violation_id is null; 1 when the referenced violation
          has repeat_chain_depth = 0; 2 when the referenced violation has
          repeat_chain_depth >= 1 (saturates at 2).
        constraints: "0..2"
      - name: infant_exposure
        type: boolean
        source: computed
        default: false
        description: ChecklistItem.infant_sensitive == true AND primary_age_group == INFANT.
      - name: assessed_points
        type: number
        source: computed
        description: Output of §1.3 violation_point_assessment, frozen at creation.
      - name: status
        type: enum
        source: system
        default: CITED
        description: Correction lifecycle of the citation.
        constraints: "one of {CITED, CORRECTION_PENDING, VERIFIED_CORRECTED, UNCORRECTED, VACATED}"
      - name: correction_due_date
        type: datetime
        source: computed
        default: null
        description: |
          Set when the inspection is finalized:
          inspection.finalized_at + CORRECTION_DAYS[severity] days, halved
          (floor) when Provider.license_status = PROBATION at that moment and
          forced to 1 day when it is SUSPENDED.
      - name: narrative
        type: string
        source: input
        description: Inspector's written finding.
        constraints: "1..2000 chars, non-blank"
      - name: corrected_at
        type: datetime
        source: system
        default: null
        description: Instant the correction was verified.
      - name: vacated_reason
        type: string
        source: input
        default: null
        description: Supervisor's justification recorded when the citation is vacated.
      - name: auto_generated
        type: boolean
        source: computed
        default: false
        description: |
          True when this citation was created by a cascade (substantiated
          complaint determination, or a late serious-incident report) rather than
          by a direct POST /licensing/violations call.

  - name: Complaint
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      An allegation against a provider, intaken by the agency, screened, assigned,
      investigated and determined against a priority-driven statutory clock.
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; provider complained about. Immutable after creation."
      - name: assigned_investigator_id
        type: string
        source: input
        default: null
        description: "FK -> Inspector.id; investigator assigned by the supervisor, subject to the segregation-of-duties rule."
      - name: intake_channel
        type: enum
        source: input
        description: |
          How the allegation reached the agency. AGENCY_INCIDENT is reserved for
          Complaints auto-created by the serious-incident review cascade and may
          not be supplied by a client.
        constraints: "one of {PHONE, WEB, MAIL, WALK_IN, MANDATED_REPORTER, AGENCY_INCIDENT}"
      - name: allegation_category
        type: enum
        source: input
        description: Subject of the allegation; drives priority and the auto-citation checklist code.
        constraints: "one of {ABUSE, SUPERVISION, RATIO, BACKGROUND, FACILITY, NUTRITION, RECORDS}"
      - name: alleged_serious_harm
        type: boolean
        source: input
        default: false
        description: Reporter asserts a child suffered serious harm; escalates priority.
      - name: affected_age_group
        type: enum
        source: input
        description: Age group the allegation concerns; becomes primary_age_group of any auto-citation.
        constraints: "one of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}"
      - name: complainant_name
        type: string
        source: input
        default: null
        description: Reporter identity; a redaction target for public posting.
      - name: anonymous
        type: boolean
        source: input
        default: false
        description: Reporter requested anonymity; forces redaction before any public posting.
      - name: narrative
        type: string
        source: input
        description: Intake narrative.
        constraints: "1..2000 chars, non-blank"
      - name: priority
        type: enum
        source: computed
        description: Output of §1.3 complaint_priority_and_deadline, frozen at intake.
        constraints: "one of {P1, P2, P3}"
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: Complaint lifecycle state.
        constraints: "one of {RECEIVED, SCREENED_IN, SCREENED_OUT, UNDER_INVESTIGATION, DETERMINED, CLOSED}"
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant of intake; baseline for investigation_due_at.
      - name: screened_at
        type: datetime
        source: system
        default: null
        description: Instant of the screening decision.
      - name: investigation_due_at
        type: datetime
        source: computed
        description: received_at + DETERMINATION_DAYS[priority] days, frozen at intake.
      - name: determination
        type: enum
        source: input
        default: null
        description: Investigator's finding, supplied at determination.
        constraints: "one of {SUBSTANTIATED, UNSUBSTANTIATED, INCONCLUSIVE}"
      - name: determined_at
        type: datetime
        source: system
        default: null
        description: Instant the determination was recorded.
      - name: timeliness_flag
        type: enum
        source: computed
        default: null
        description: ON_TIME when determined_at <= investigation_due_at (inclusive), else LATE.
        constraints: "one of {ON_TIME, LATE}"
      - name: closure_note
        type: string
        source: input
        default: null
        description: Supervisor's closing note.

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      Provider's remediation plan for the violations of one finalized inspection.
      Cyclic review loop bounded by CAP_MAX_REVIEW_CYCLES. Created against an
      OCC-checked Inspection.version.
    fields:
      - name: provider_id
        type: string
        source: computed
        description: "FK -> Provider.id; copied from the referenced inspection at creation."
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the finalized inspection being remediated. Immutable after creation."
      - name: violation_ids
        type: array
        source: input
        description: |
          Ids of the violations this plan addresses. Must be non-empty and every
          element must be a violation whose inspection_id equals this plan's
          inspection_id and whose status != VACATED.
        constraints: "non-empty array of Violation ids, no duplicates"
      - name: narrative
        type: string
        source: input
        description: Plan text.
        constraints: "1..2000 chars, non-blank"
      - name: proposed_completion_date
        type: string
        source: input
        description: Date the provider proposes to finish remediation.
        constraints: "ISO date YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Plan review lifecycle state.
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, COMPLETED, FAILED, SUPERSEDED}"
      - name: review_cycle_count
        type: integer
        source: system
        default: 1
        description: Incremented on every resubmit; capped by CAP_MAX_REVIEW_CYCLES (3).
      - name: submitted_at
        type: datetime
        source: system
        description: Instant of the most recent submission or resubmission.
      - name: reviewed_at
        type: datetime
        source: system
        default: null
        description: Instant of the most recent supervisor review decision.
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: Instant the plan was approved.
      - name: completed_at
        type: datetime
        source: system
        default: null
        description: Instant the plan was marked COMPLETED or FAILED.
      - name: due_at
        type: datetime
        source: computed
        description: Output of §1.3 corrective_action_due_date, frozen at creation.
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: |
          Opaque LicensingSupervisor operator id (X-User-ID) that approved the
          plan. Compared against the issuing operator by the segregation rule; it
          is never required to equal any entity id.
      - name: review_note
        type: string
        source: input
        default: null
        description: Supervisor's review comment.
      - name: expected_inspection_version
        type: integer
        source: input
        description: |
          OCC guard: the Inspection.version the client last observed. Rejected with
          ERR_STALE_INSPECTION_VERSION when it no longer matches.

  - name: EnforcementAction
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      One rung of the progressive enforcement ladder (WARNING -> PROBATION ->
      SUSPENSION -> REVOCATION), with an appeal branch whose VACATED outcome is
      the compensating action that restores held capacity.
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the sanctioned provider. Immutable after creation."
      - name: source_inspection_id
        type: string
        source: input
        default: null
        description: "FK -> Inspection.id; the finalized inspection that supplies the evidentiary basis, when the action arises from an inspection."
      - name: requested_action_type
        type: enum
        source: input
        default: null
        description: |
          Supervisor's requested rung. When omitted the ladder-computed rung is
          used. A request above the ladder-computed rung is rejected.
        constraints: "one of {WARNING, PROBATION, SUSPENSION, REVOCATION}"
      - name: action_type
        type: enum
        source: computed
        description: Rung actually recorded; output of §1.3 enforcement_ladder_step.
        constraints: "one of {WARNING, PROBATION, SUSPENSION, REVOCATION}"
      - name: ladder_step
        type: integer
        source: computed
        description: "LADDER_STEP: WARNING=1, PROBATION=2, SUSPENSION=3, REVOCATION=4."
        constraints: "1..4"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: Enforcement lifecycle state.
        constraints: "one of {PROPOSED, ISSUED, EFFECTIVE, APPEALED, UPHELD, VACATED, WITHDRAWN}"
      - name: basis_points
        type: number
        source: computed
        description: Snapshot of Provider.open_violation_points at the moment of proposal.
      - name: fine_amount_cents
        type: integer
        source: computed
        description: Output of §1.3 enforcement_fine_amount, frozen at proposal.
      - name: proposed_at
        type: datetime
        source: system
        description: Instant of proposal.
      - name: issued_at
        type: datetime
        source: system
        default: null
        description: Instant the action was formally issued to the provider.
      - name: effective_at
        type: datetime
        source: system
        default: null
        description: Instant the action took effect on the license.
      - name: appeal_deadline_at
        type: datetime
        source: computed
        default: null
        description: issued_at + APPEAL_WINDOW_DAYS (15) days, set at issue.
      - name: appealed_at
        type: datetime
        source: system
        default: null
        description: Instant the provider appealed.
      - name: appeal_note
        type: string
        source: input
        default: null
        description: Provider's written grounds submitted with the appeal.
        constraints: "1..2000 chars, non-blank when supplied"
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: Instant the action reached UPHELD, VACATED or WITHDRAWN.
      - name: appeal_decision
        type: enum
        source: input
        default: null
        description: Supervisor's appeal ruling.
        constraints: "one of {UPHELD, VACATED}"
      - name: issued_by_user_id
        type: string
        source: system
        default: null
        description: |
          Opaque LicensingSupervisor operator id (X-User-ID) that issued the
          action; compared against CorrectiveActionPlan.reviewed_by_user_id by the
          segregation rule. Never required to equal any entity id.
      - name: capacity_held_slots
        type: integer
        source: computed
        default: 0
        description: |
          Slots moved out of Provider.licensed_capacity when a SUSPENSION was
          effectuated; returned by the VACATED appeal decision.
      - name: rationale
        type: string
        source: input
        default: null
        description: Supervisor's written basis for the action.

  - name: LicenseAmendment
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      A request to change the license record — capacity up or down, site move,
      new age group, or director change. Created against an OCC-checked
      Provider.version because a newer request of the same type legitimately
      supersedes the earlier one.
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the license being amended. Immutable after creation."
      - name: pre_move_inspection_id
        type: string
        source: input
        default: null
        description: "FK -> Inspection.id; the finalized AMENDMENT_PRE_MOVE inspection attached as evidence for amendments that require one."
      - name: new_director_staff_member_id
        type: string
        source: input
        default: null
        description: "FK -> StaffMember.id; the incoming director for amendment_type = DIRECTOR_CHANGE."
      - name: amendment_type
        type: enum
        source: input
        description: Kind of change requested; decides whether a pre-move inspection is required.
        constraints: "one of {CAPACITY_INCREASE, CAPACITY_DECREASE, SITE_MOVE, AGE_GROUP_ADD, DIRECTOR_CHANGE}"
      - name: requested_capacity
        type: integer
        source: input
        default: null
        description: New total capacity; required for CAPACITY_INCREASE and CAPACITY_DECREASE.
        constraints: ">= 1 when supplied"
      - name: new_site_address
        type: string
        source: input
        default: null
        description: Destination address; required for SITE_MOVE.
      - name: new_age_group
        type: enum
        source: input
        default: null
        description: Age group to add; required for AGE_GROUP_ADD.
        constraints: "one of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}"
      - name: new_group_size
        type: integer
        source: input
        default: null
        description: Group size for the age group being added; required for AGE_GROUP_ADD.
        constraints: ">= 1 when supplied"
      - name: requires_inspection
        type: boolean
        source: computed
        description: |
          True when amendment_type IN {SITE_MOVE, CAPACITY_INCREASE,
          AGE_GROUP_ADD}; false for CAPACITY_DECREASE and DIRECTOR_CHANGE.
      - name: status
        type: enum
        source: system
        description: |
          Amendment lifecycle state. Initial state is PRE_INSPECTION_REQUIRED when
          requires_inspection is true, otherwise SUBMITTED.
        constraints: "one of {SUBMITTED, PRE_INSPECTION_REQUIRED, APPROVED, DENIED, WITHDRAWN, SUPERSEDED}"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of creation.
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: Instant of the approve/deny decision.
      - name: decision_rationale
        type: string
        source: input
        default: null
        description: Supervisor's written basis for the decision.
      - name: effective_capacity_delta
        type: integer
        source: computed
        default: 0
        description: |
          requested_capacity - Provider.licensed_capacity for CAPACITY_INCREASE /
          CAPACITY_DECREASE, evaluated at approval; new_group_size for
          AGE_GROUP_ADD; 0 for SITE_MOVE and DIRECTOR_CHANGE.
      - name: expected_provider_version
        type: integer
        source: input
        description: |
          OCC guard: the Provider.version the client last observed. Rejected with
          ERR_STALE_PROVIDER_VERSION when it no longer matches.

  - name: SeriousIncidentReport
    parent: null
    common_fields: true
    entity_kind: event
    description: |
      A mandatory report of a serious injury, fatality, missing child, medication
      error, or communicable disease event. Late filing is itself a citable
      records violation.
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the reporting provider. Immutable after creation."
      - name: generated_complaint_id
        type: string
        source: computed
        default: null
        description: "FK -> Complaint.id; the Complaint auto-opened when the agency reviews the report with disposition OPEN_INVESTIGATION."
      - name: incident_type
        type: enum
        source: input
        description: Category of the event; fixes the reporting window.
        constraints: "one of {FATALITY, MISSING_CHILD, SERIOUS_INJURY, MEDICATION_ERROR, COMMUNICABLE_DISEASE}"
      - name: occurred_at
        type: datetime
        source: input
        description: Instant the event happened; must not be after the logical clock.
      - name: reported_at
        type: datetime
        source: system
        description: Logical-clock instant of report creation.
      - name: affected_child_age_group
        type: enum
        source: input
        description: Age group of the affected child; becomes primary_age_group of any late-report citation.
        constraints: "one of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE}"
      - name: narrative
        type: string
        source: input
        description: Provider's account of the event.
        constraints: "1..2000 chars, non-blank"
      - name: reporting_deadline_at
        type: datetime
        source: computed
        description: occurred_at + INCIDENT_REPORT_WINDOW_HOURS[incident_type] hours, frozen at creation.
      - name: reporting_timeliness
        type: enum
        source: computed
        description: TIMELY when reported_at <= reporting_deadline_at (inclusive), else LATE_REPORT.
        constraints: "one of {TIMELY, LATE_REPORT}"
      - name: late_report_violation_created
        type: boolean
        source: computed
        default: false
        description: |
          True when the LATE_REPORT cascade actually created a citation, i.e. when
          reporting_timeliness = LATE_REPORT AND the provider had at least one
          FINALIZED Inspection to attach it to. False when the report was TIMELY
          or when the candidate inspection set was empty.
      - name: status
        type: enum
        source: system
        default: REPORTED
        description: Agency handling state.
        constraints: "one of {REPORTED, UNDER_REVIEW, INVESTIGATION_OPENED, CLOSED}"
      - name: reviewed_at
        type: datetime
        source: system
        default: null
        description: Instant of the agency review disposition.
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: Instant the report was closed.
      - name: agency_note
        type: string
        source: input
        default: null
        description: Agency reviewer's note.

  - name: PublicReportPosting
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      The consumer-facing publication of one finalized inspection report, with a
      redaction gate, a display score that is suppressed under active suspension
      or revocation, and a retention expiry.
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the finalized inspection being published. Immutable after creation."
      - name: provider_id
        type: string
        source: computed
        description: "FK -> Provider.id; copied from the referenced inspection at creation."
      - name: posting_status
        type: enum
        source: system
        default: PENDING_REDACTION
        description: Publication lifecycle state.
        constraints: "one of {PENDING_REDACTION, POSTED, CORRECTED, WITHDRAWN}"
      - name: redaction_complete
        type: boolean
        source: input
        default: false
        description: |
          Reviewer's attestation that complainant-identifying content has been
          removed. Required to be true before posting when the inspection is
          linked to a Complaint that is anonymous or names a complainant.
      - name: consumer_summary
        type: string
        source: input
        description: Plain-language summary shown to families.
        constraints: "1..1000 chars, non-blank"
      - name: display_score
        type: number
        source: computed
        default: null
        description: Output of §1.3 public_display_score, recomputed at every post/revise.
      - name: enforcement_banner
        type: enum
        source: computed
        default: NONE
        description: Consumer-education banner derived from the provider's effective enforcement actions.
        constraints: "one of {NONE, WARNING, PROBATION, SUSPENSION, REVOCATION} (the keys of POSTING_BANNER_BY_STEP / POSTING_BANNER_PENALTY in §1.3 public_display_score)"
      - name: posted_at
        type: datetime
        source: system
        default: null
        description: Instant of first publication.
      - name: expires_at
        type: datetime
        source: computed
        default: null
        description: posted_at + POSTING_RETENTION_MONTHS (36) months; null before posting.
      - name: corrected_at
        type: datetime
        source: system
        default: null
        description: Instant of the most recent CORRECT revision.
      - name: withdrawn_at
        type: datetime
        source: system
        default: null
        description: Instant the posting was withdrawn from the public register.
      - name: revision_note
        type: string
        source: input
        default: null
        description: Agency's written reason for the most recent revision.
        constraints: "1..1000 chars, non-blank when a revision is recorded"
      - name: correction_count
        type: integer
        source: system
        default: 0
        description: Number of CORRECT revisions applied after publication.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Provider carries TWO independent state dimensions on one row. Each dimension
  # is a separate machine below; they advance on different triggers and neither
  # blocks the other's edges except where a precondition says so explicitly.
  # ---------------------------------------------------------------------------
  - entity: Provider
    state_field: application_status
    initial_state: DRAFT
    terminal_states: [LICENSED, DENIED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensing/providers/{provider_id}/submit-application"
        actor: Applicant
        preconditions:
          - "application_status == DRAFT (else ERR_INVALID_APPLICATION_STATE)"
          - "X-User-ID == provider.id (else ERR_OWNERSHIP_VIOLATION)"
          - "count(StaffMember WHERE provider_id = provider.id AND member_type = DIRECTOR) >= 1 (else ERR_CLEARANCE_INCOMPLETE)"
          - "count(AgeGroupRoster WHERE provider_id = provider.id) >= 1 (else ERR_CAPACITY_SLOT_IMBALANCE)"
          - "sum(AgeGroupRoster.requested_group_size WHERE provider_id = provider.id) == provider.requested_capacity (else ERR_CAPACITY_SLOT_IMBALANCE)"
          - "provider.requested_capacity <= provider.capacity_ceiling (else ERR_CAPACITY_CEILING_EXCEEDED)"
        side_effects:
          - "application_status = SUBMITTED"
          - "increments Provider.version by 1; refreshes Provider.updated_at"
      - from: SUBMITTED
        to: CHECKS_CLEARED
        trigger: "POST /licensing/providers/{provider_id}/clear-checks"
        actor: LicensingSupervisor
        preconditions:
          - "application_status == SUBMITTED (else ERR_INVALID_APPLICATION_STATE)"
          - "provider.clearance_complete == true (else ERR_CLEARANCE_INCOMPLETE)"
        side_effects:
          - "application_status = CHECKS_CLEARED"
          - "increments Provider.version by 1"
      - from: CHECKS_CLEARED
        to: SUBMITTED
        trigger: "system: BackgroundCheck result cascade (link 4 of §1.3 clearance_revocation_cascade) when Provider.clearance_complete flips true -> false"
        actor: system
        preconditions:
          - "application_status == CHECKS_CLEARED"
          - "provider.clearance_complete evaluates to false after the StaffMember recomputation of link 2"
        side_effects:
          - "application_status = SUBMITTED (revert edge — this is the cyclic edge of this dimension)"
          - "every Inspection WHERE provider_id = provider.id AND inspection_type = INITIAL AND status IN {SCHEDULED, IN_PROGRESS} transitions to VOIDED"
          - "increments Provider.version by 1"
        note: |
          Conditional cascade: FOLLOW_UP / ANNUAL / COMPLAINT / AMENDMENT_PRE_MOVE
          inspections are NOT voided, and INITIAL inspections already in
          PENDING_REVIEW or FINALIZED are NOT voided.
      - from: CHECKS_CLEARED
        to: INITIAL_INSPECTION_PASSED
        trigger: "system: POST /licensing/inspections/{inspection_id}/finalize where inspection_type = INITIAL"
        actor: system
        preconditions:
          - "application_status == CHECKS_CLEARED"
          - "inspection.inspection_type == INITIAL AND inspection.outcome IN {PASS, CONDITIONAL_PASS}"
        side_effects:
          - "application_status = INITIAL_INSPECTION_PASSED"
          - "increments Provider.version by 1"
        note: "When inspection.outcome == FAIL the application_status stays CHECKS_CLEARED and the inspection still finalizes."
      - from: INITIAL_INSPECTION_PASSED
        to: LICENSED
        trigger: "POST /licensing/providers/{provider_id}/license-decision with decision = ISSUE"
        actor: LicensingSupervisor
        preconditions:
          - "application_status == INITIAL_INSPECTION_PASSED (else ERR_INVALID_APPLICATION_STATE)"
          - "provider.clearance_complete == true (else ERR_CLEARANCE_INCOMPLETE)"
          - "provider.critical_open_count == 0 (else ERR_UNRESOLVED_CRITICAL_VIOLATION)"
        side_effects:
          - "application_status = LICENSED"
          - "license_status = PROVISIONAL (see the license_status machine)"
          - "license_number minted per §1.1 Provider.license_number"
          - "licensed_at = now; provisional_started_at = now"
          - "for every AgeGroupRoster of the provider: approved_group_size = requested_group_size; group_size_compliant recomputed"
          - "licensed_capacity = sum(AgeGroupRoster.approved_group_size); suspended_capacity = 0"
          - "increments Provider.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /licensing/providers/{provider_id}/license-decision with decision = DENY"
        actor: LicensingSupervisor
        preconditions:
          - "application_status IN {SUBMITTED, CHECKS_CLEARED} (else ERR_INVALID_APPLICATION_STATE)"
        side_effects:
          - "application_status = DENIED; decision_reason stored"
          - "every Inspection WHERE provider_id = provider.id AND status IN {SCHEDULED, IN_PROGRESS, PENDING_REVIEW} transitions to VOIDED"
          - "increments Provider.version by 1"
      - from: CHECKS_CLEARED
        to: DENIED
        trigger: "POST /licensing/providers/{provider_id}/license-decision with decision = DENY"
        actor: LicensingSupervisor
        preconditions:
          - "application_status IN {SUBMITTED, CHECKS_CLEARED} (else ERR_INVALID_APPLICATION_STATE)"
        side_effects:
          - "application_status = DENIED; decision_reason stored"
          - "every Inspection WHERE provider_id = provider.id AND status IN {SCHEDULED, IN_PROGRESS, PENDING_REVIEW} transitions to VOIDED"
          - "increments Provider.version by 1"

  - entity: Provider
    state_field: license_status
    initial_state: NONE
    terminal_states: [REVOKED]
    shape: cyclic
    transitions:
      - from: NONE
        to: PROVISIONAL
        trigger: "POST /licensing/providers/{provider_id}/license-decision with decision = ISSUE"
        actor: LicensingSupervisor
        preconditions:
          - "license_status == NONE"
          - "application_status == INITIAL_INSPECTION_PASSED (else ERR_INVALID_APPLICATION_STATE)"
        side_effects:
          - "license_status = PROVISIONAL; provisional_started_at = now"
          - "see the application_status machine for the full ISSUE side-effect set"
      - from: PROVISIONAL
        to: FULL
        trigger: "POST /licensing/providers/{provider_id}/promote-to-full"
        actor: LicensingSupervisor
        preconditions:
          - "license_status == PROVISIONAL (else ERR_INVALID_LICENSE_STATE)"
          - "now >= provisional_started_at + PROVISIONAL_PERIOD_MONTHS (6 months, inclusive lower edge) (else ERR_PROVISIONAL_PERIOD_NOT_ELAPSED)"
          - "exists Inspection WHERE provider_id = provider.id AND inspection_type = ANNUAL AND status = FINALIZED AND outcome IN {PASS, CONDITIONAL_PASS} AND finalized_at >= provisional_started_at (else ERR_INVALID_LICENSE_STATE)"
          - "provider.critical_open_count == 0 (else ERR_UNRESOLVED_CRITICAL_VIOLATION)"
        side_effects:
          - "license_status = FULL"
          - "increments Provider.version by 1"
      - from: PROVISIONAL
        to: PROBATION
        trigger: "system: POST /licensing/enforcement-actions/{action_id}/effectuate where action_type = PROBATION"
        actor: system
        preconditions:
          - "license_status IN {PROVISIONAL, FULL} (else ERR_INVALID_LICENSE_STATE)"
        side_effects:
          - "license_status = PROBATION; probation_cycle_count += 1"
          - "increments Provider.version by 1"
      - from: FULL
        to: PROBATION
        trigger: "system: POST /licensing/enforcement-actions/{action_id}/effectuate where action_type = PROBATION"
        actor: system
        preconditions:
          - "license_status IN {PROVISIONAL, FULL} (else ERR_INVALID_LICENSE_STATE)"
        side_effects:
          - "license_status = PROBATION; probation_cycle_count += 1"
          - "increments Provider.version by 1"
      - from: PROBATION
        to: FULL
        trigger: "POST /licensing/providers/{provider_id}/restore-full"
        actor: LicensingSupervisor
        preconditions:
          - "license_status == PROBATION (else ERR_INVALID_LICENSE_STATE)"
          - "every CorrectiveActionPlan WHERE provider_id = provider.id has status IN {COMPLETED, SUPERSEDED} (else ERR_INVALID_CAP_STATE)"
          - "provider.open_violation_points < WARNING_THRESHOLD (15, strict <) (else ERR_OUTSTANDING_VIOLATION_POINTS)"
          - "provider.critical_open_count == 0 (else ERR_UNRESOLVED_CRITICAL_VIOLATION)"
        side_effects:
          - "license_status = FULL (this closes the FULL -> PROBATION -> FULL cycle)"
          - "increments Provider.version by 1"
        note: "restore-full is rejected from SUSPENDED; a suspended license returns to PROBATION only through the VACATED appeal decision."
      - from: FULL
        to: SUSPENDED
        trigger: "system: POST /licensing/enforcement-actions/{action_id}/effectuate where action_type = SUSPENSION"
        actor: system
        preconditions:
          - "license_status IN {FULL, PROBATION} (else ERR_INVALID_LICENSE_STATE)"
        side_effects:
          - "license_status = SUSPENDED"
          - "action.capacity_held_slots = provider.licensed_capacity"
          - "provider.suspended_capacity = provider.licensed_capacity; provider.licensed_capacity = 0"
          - "increments Provider.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: POST /licensing/enforcement-actions/{action_id}/effectuate where action_type = SUSPENSION"
        actor: system
        preconditions:
          - "license_status IN {FULL, PROBATION} (else ERR_INVALID_LICENSE_STATE)"
        side_effects:
          - "license_status = SUSPENDED"
          - "action.capacity_held_slots = provider.licensed_capacity"
          - "provider.suspended_capacity = provider.licensed_capacity; provider.licensed_capacity = 0"
          - "increments Provider.version by 1"
      - from: SUSPENDED
        to: PROBATION
        trigger: "system: POST /licensing/enforcement-actions/{action_id}/appeal-decision with appeal_decision = VACATED on a SUSPENSION action"
        actor: system
        preconditions:
          - "license_status == SUSPENDED"
          - "action.action_type == SUSPENSION AND action.status == APPEALED"
        side_effects:
          - "license_status = PROBATION (reinstatement lands on PROBATION, never directly on FULL)"
          - "provider.licensed_capacity = provider.suspended_capacity; provider.suspended_capacity = 0"
          - "action.capacity_held_slots = 0"
          - "increments Provider.version by 1"
        note: "This is the compensating edge of the FULL/PROBATION -> SUSPENDED transition; §1.3 capacity_slot_conservation pins the invariant it must preserve."
      - from: PROBATION
        to: REVOKED
        trigger: "system: POST /licensing/enforcement-actions/{action_id}/effectuate where action_type = REVOCATION"
        actor: system
        preconditions:
          - "license_status IN {PROBATION, SUSPENDED} (else ERR_INVALID_LICENSE_STATE)"
        side_effects:
          - "license_status = REVOKED"
          - "provider.suspended_capacity += provider.licensed_capacity; provider.licensed_capacity = 0"
          - "every EnforcementAction WHERE provider_id = provider.id AND status = PROPOSED transitions to WITHDRAWN"
          - "every PublicReportPosting WHERE provider_id = provider.id AND posting_status IN {POSTED, CORRECTED} has display_score and enforcement_banner recomputed (banner becomes REVOCATION, display_score is floored at 0.00)"
          - "increments Provider.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system: POST /licensing/enforcement-actions/{action_id}/effectuate where action_type = REVOCATION"
        actor: system
        preconditions:
          - "license_status IN {PROBATION, SUSPENDED} (else ERR_INVALID_LICENSE_STATE)"
        side_effects:
          - "license_status = REVOKED"
          - "provider.suspended_capacity += provider.licensed_capacity; provider.licensed_capacity = 0"
          - "every EnforcementAction WHERE provider_id = provider.id AND status = PROPOSED transitions to WITHDRAWN"
          - "every PublicReportPosting WHERE provider_id = provider.id AND posting_status IN {POSTED, CORRECTED} has display_score and enforcement_banner recomputed"
          - "increments Provider.version by 1"

  - entity: BackgroundCheck
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [CLEARED, WAIVED]
    shape: branching_with_waiver_cycle
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /licensing/background-checks/{background_check_id}/result with result = CLEARED"
        actor: BackgroundCheckUnit
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_CHECK_STATE)"
          - "disqualifying_offense_tier supplied in the payload must equal NONE when result = CLEARED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = CLEARED; decided_at = now; expires_at = now + CLEARANCE_VALIDITY_MONTHS (60 months)"
          - "StaffMember.clearance_status / supervision_eligible / barred_offense_tier recomputed"
          - "Provider.clearance_complete recomputed"
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "POST /licensing/background-checks/{background_check_id}/result with result = DISQUALIFIED"
        actor: BackgroundCheckUnit
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_CHECK_STATE)"
          - "disqualifying_offense_tier IN {TIER_1_PERMANENT, TIER_2_FIVE_YEAR, TIER_3_WAIVABLE} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = DISQUALIFIED; decided_at = now; expires_at stays null"
          - "CASCADE link 2: StaffMember.clearance_status = BARRED, supervision_eligible = false, barred_offense_tier = max tier over the person's DISQUALIFIED checks"
          - "CASCADE link 3: because that StaffMember is no longer supervision_eligible, every AgeGroupRoster WHERE lead_staff_member_id = staff_member.id has lead_staff_member_id set to null, staff_assigned_count decremented by 1 with a floor of 0, and required_staff_count / ratio_compliant / supervision_compliant recomputed"
          - "CASCADE link 4: because Provider.clearance_complete flipped to false, Provider.application_status reverts CHECKS_CLEARED -> SUBMITTED and every INITIAL Inspection of the provider in status SCHEDULED or IN_PROGRESS transitions to VOIDED"
        note: "This is transitive cascade B of §0.5 rule_4; each link is caused by the preceding link, not by the original request."
      - from: DISQUALIFIED
        to: WAIVER_PENDING
        trigger: "POST /licensing/background-checks/{background_check_id}/waiver"
        actor: Applicant
        preconditions:
          - "status == DISQUALIFIED (else ERR_INVALID_CHECK_STATE)"
          - "X-User-ID == StaffMember.provider_id of this check's staff member (else ERR_OWNERSHIP_VIOLATION)"
          - "disqualifying_offense_tier != TIER_1_PERMANENT (else ERR_PERMANENT_BAR_NOT_WAIVABLE)"
        side_effects:
          - "status = WAIVER_PENDING; waiver_requested_at = now; waiver_rationale stored"
          - "StaffMember.clearance_status = WAIVER_PENDING; supervision_eligible stays false"
          - "Provider.clearance_complete recomputed (stays false)"
      - from: WAIVER_PENDING
        to: WAIVED
        trigger: "POST /licensing/background-checks/{background_check_id}/waiver-decision with decision = GRANT"
        actor: LicensingSupervisor
        preconditions:
          - "status == WAIVER_PENDING (else ERR_INVALID_CHECK_STATE)"
        side_effects:
          - "status = WAIVED; waiver_decided_at = now; expires_at = now + CLEARANCE_VALIDITY_MONTHS"
          - "StaffMember.clearance_status / supervision_eligible / barred_offense_tier recomputed (barred_offense_tier returns to NONE when no DISQUALIFIED check remains)"
          - "Provider.clearance_complete recomputed"
      - from: WAIVER_PENDING
        to: DISQUALIFIED
        trigger: "POST /licensing/background-checks/{background_check_id}/waiver-decision with decision = REFUSE"
        actor: LicensingSupervisor
        preconditions:
          - "status == WAIVER_PENDING (else ERR_INVALID_CHECK_STATE)"
        side_effects:
          - "status = DISQUALIFIED (this closes the DISQUALIFIED -> WAIVER_PENDING -> DISQUALIFIED loop); waiver_decided_at = now"
          - "StaffMember.clearance_status = BARRED; supervision_eligible = false"

  - entity: Inspection
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, VOIDED]
    shape: branching_with_revert
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /licensing/inspections/{inspection_id}/start"
        actor: LicensingInspector
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_INSPECTION_STATE)"
          - "X-User-ID == inspection.inspector_id (else ERR_OWNERSHIP_VIOLATION)"
          - "Inspector.status == ACTIVE (else ERR_INSPECTOR_ON_LEAVE)"
        side_effects:
          - "status = IN_PROGRESS; started_at = now"
          - "increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: PENDING_REVIEW
        trigger: "POST /licensing/inspections/{inspection_id}/submit-for-review"
        actor: LicensingInspector
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_INSPECTION_STATE)"
          - "X-User-ID == inspection.inspector_id (else ERR_OWNERSHIP_VIOLATION)"
          - "age_groups_observed is non-empty and is a subset of Inspector.certified_age_groups (else ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP)"
          - "outcome == FAIL when at least one Violation of this inspection has severity = CRITICAL and status != VACATED; outcome == PASS when this inspection has zero Violations with status != VACATED (else ERR_OUTCOME_SEVERITY_MISMATCH)"
        side_effects:
          - "status = PENDING_REVIEW; submitted_at = now; outcome and age_groups_observed stored"
          - "increments Inspection.version by 1"
      - from: PENDING_REVIEW
        to: IN_PROGRESS
        trigger: "POST /licensing/inspections/{inspection_id}/reopen"
        actor: LicensingSupervisor
        preconditions:
          - "status == PENDING_REVIEW (else ERR_INVALID_INSPECTION_STATE)"
          - "reopen_count < INSPECTION_MAX_REOPENS (2, strict <) (else ERR_INVALID_INSPECTION_STATE)"
        side_effects:
          - "status = IN_PROGRESS (revert edge); reopen_count += 1"
          - "outcome = null; age_groups_observed = null; submitted_at = null"
          - "increments Inspection.version by 1"
      - from: PENDING_REVIEW
        to: FINALIZED
        trigger: "POST /licensing/inspections/{inspection_id}/finalize"
        actor: LicensingSupervisor
        preconditions:
          - "status == PENDING_REVIEW (else ERR_INVALID_INSPECTION_STATE)"
          - "when inspection_type == INITIAL: Provider.clearance_complete == true (else ERR_CLEARANCE_INCOMPLETE) — this is the Inspection <-> BackgroundCheck cross-entity dependency"
        side_effects:
          - "status = FINALIZED; finalized_at = now"
          - "every Violation of this inspection with status = CITED transitions to CORRECTION_PENDING and gets correction_due_date per §1.3 correction_due_date"
          - "violation_count recomputed; cap_required = (violation_count > 0)"
          - "preliminary_compliance_score = §1.3 inspection_compliance_score variant PRELIMINARY (frozen forever)"
          - "final_compliance_score and raw_deduction_points = §1.3 inspection_compliance_score variant FINAL"
          - "Provider.open_violation_points / resolved_violation_points / lifetime_violation_points / critical_open_count / critical_violation_count_24mo recomputed"
          - "Provider.risk_score / risk_tier recomputed with variant ENFORCEMENT_REVIEW"
          - "when inspection_type == INITIAL and outcome IN {PASS, CONDITIONAL_PASS}: Provider.application_status CHECKS_CLEARED -> INITIAL_INSPECTION_PASSED"
          - "increments Inspection.version by 1; increments Provider.version by 1"
        note: "Finalize never auto-creates an EnforcementAction; enforcement is always proposed explicitly, or by the substantiated-complaint cascade."
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /licensing/inspections/{inspection_id}/void, or system via the clearance-revert cascade / application DENY cascade"
        actor: LicensingSupervisor
        preconditions:
          - "status IN {SCHEDULED, IN_PROGRESS, PENDING_REVIEW} (else ERR_INVALID_INSPECTION_STATE)"
        side_effects:
          - "status = VOIDED"
          - "every Violation of this inspection with status IN {CITED, CORRECTION_PENDING} transitions to VACATED with vacated_reason 'inspection voided'"
          - "Inspector.scheduled_visit_count recomputed; the inspector's and provider's visit windows are released"
          - "Provider violation-point counters recomputed"
          - "increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "POST /licensing/inspections/{inspection_id}/void, or system via the clearance-revert cascade / application DENY cascade"
        actor: LicensingSupervisor
        preconditions:
          - "status IN {SCHEDULED, IN_PROGRESS, PENDING_REVIEW} (else ERR_INVALID_INSPECTION_STATE)"
        side_effects:
          - "status = VOIDED"
          - "every Violation of this inspection with status IN {CITED, CORRECTION_PENDING} transitions to VACATED with vacated_reason 'inspection voided'"
          - "Inspector.scheduled_visit_count recomputed"
          - "Provider violation-point counters recomputed"
          - "increments Inspection.version by 1"
      - from: PENDING_REVIEW
        to: VOIDED
        trigger: "POST /licensing/inspections/{inspection_id}/void"
        actor: LicensingSupervisor
        preconditions:
          - "status IN {SCHEDULED, IN_PROGRESS, PENDING_REVIEW} (else ERR_INVALID_INSPECTION_STATE)"
        side_effects:
          - "status = VOIDED"
          - "every Violation of this inspection with status IN {CITED, CORRECTION_PENDING} transitions to VACATED"
          - "Inspector.scheduled_visit_count recomputed"
          - "Provider violation-point counters recomputed"
          - "increments Inspection.version by 1"
        note: "A FINALIZED inspection can never be voided; the report is a public record once finalized."

  - entity: Violation
    state_field: status
    initial_state: CITED
    terminal_states: [VERIFIED_CORRECTED, VACATED]
    shape: branching_with_late_correction
    transitions:
      - from: CITED
        to: CORRECTION_PENDING
        trigger: "system: POST /licensing/inspections/{inspection_id}/finalize"
        actor: system
        preconditions:
          - "status == CITED"
          - "the owning inspection transitions PENDING_REVIEW -> FINALIZED"
        side_effects:
          - "status = CORRECTION_PENDING; correction_due_date computed per §1.3 correction_due_date"
          - "Provider.open_violation_points unchanged in value (CITED and CORRECTION_PENDING are both in the open set)"
      - from: CORRECTION_PENDING
        to: VERIFIED_CORRECTED
        trigger: "POST /licensing/violations/{violation_id}/disposition with disposition = VERIFIED_CORRECTED"
        actor: LicensingInspector
        preconditions:
          - "status IN {CORRECTION_PENDING, UNCORRECTED} (else ERR_INVALID_VIOLATION_STATE)"
        side_effects:
          - "status = VERIFIED_CORRECTED; corrected_at = now"
          - "Provider.open_violation_points -= assessed_points; Provider.resolved_violation_points += assessed_points; lifetime_violation_points unchanged"
          - "Provider.critical_open_count recomputed; risk_score / risk_tier recomputed (ENFORCEMENT_REVIEW)"
          - "Inspection.final_compliance_score and raw_deduction_points recomputed; preliminary_compliance_score untouched"
          - "increments Violation.version by 1; increments Provider.version by 1"
      - from: CORRECTION_PENDING
        to: UNCORRECTED
        trigger: "POST /licensing/violations/{violation_id}/disposition with disposition = UNCORRECTED"
        actor: LicensingInspector
        preconditions:
          - "status == CORRECTION_PENDING (else ERR_INVALID_VIOLATION_STATE)"
        side_effects:
          - "status = UNCORRECTED (stays inside the open set, so open_violation_points is unchanged)"
          - "Inspection.final_compliance_score recomputed — the UNCORRECTED status factor is 1.250, so the score DROPS"
          - "Provider.risk_score / risk_tier recomputed"
          - "increments Violation.version by 1"
      - from: UNCORRECTED
        to: VERIFIED_CORRECTED
        trigger: "POST /licensing/violations/{violation_id}/disposition with disposition = VERIFIED_CORRECTED"
        actor: LicensingInspector
        preconditions:
          - "status IN {CORRECTION_PENDING, UNCORRECTED} (else ERR_INVALID_VIOLATION_STATE)"
        side_effects:
          - "status = VERIFIED_CORRECTED; corrected_at = now (late correction is accepted)"
          - "Provider.open_violation_points -= assessed_points; resolved_violation_points += assessed_points"
          - "Inspection.final_compliance_score recomputed"
      - from: CITED
        to: VACATED
        trigger: "POST /licensing/violations/{violation_id}/disposition with disposition = VACATED"
        actor: LicensingSupervisor
        preconditions:
          - "status IN {CITED, CORRECTION_PENDING, UNCORRECTED} (else ERR_INVALID_VIOLATION_STATE)"
          - "X-User-Role == LicensingSupervisor (a LicensingInspector calling with disposition = VACATED is rejected with ERR_UNAUTHORIZED)"
          - "vacated_reason is non-blank (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = VACATED; vacated_reason stored"
          - "Provider.open_violation_points -= assessed_points; lifetime_violation_points -= assessed_points; resolved_violation_points unchanged (VERIFIED_CORRECTED is terminal and cannot be vacated)"
          - "Inspection.violation_count -= 1; final_compliance_score recomputed with status factor 0.000 for this citation"
          - "Provider.critical_open_count / critical_violation_count_24mo / risk_score / risk_tier recomputed"
        note: "This is the compensating action of a citation; §1.3 violation_point_conservation pins the invariant."
      - from: CORRECTION_PENDING
        to: VACATED
        trigger: "POST /licensing/violations/{violation_id}/disposition with disposition = VACATED"
        actor: LicensingSupervisor
        preconditions:
          - "status IN {CITED, CORRECTION_PENDING, UNCORRECTED} (else ERR_INVALID_VIOLATION_STATE)"
          - "vacated_reason is non-blank (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = VACATED; all Provider counters and Inspection.final_compliance_score recomputed as above"
      - from: UNCORRECTED
        to: VACATED
        trigger: "POST /licensing/violations/{violation_id}/disposition with disposition = VACATED"
        actor: LicensingSupervisor
        preconditions:
          - "status IN {CITED, CORRECTION_PENDING, UNCORRECTED} (else ERR_INVALID_VIOLATION_STATE)"
          - "vacated_reason is non-blank (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = VACATED; all Provider counters and Inspection.final_compliance_score recomputed as above"

  - entity: Complaint
    state_field: status
    initial_state: RECEIVED
    terminal_states: [SCREENED_OUT, CLOSED]
    shape: branching
    transitions:
      - from: RECEIVED
        to: SCREENED_IN
        trigger: "POST /licensing/complaints/{complaint_id}/screen with decision = SCREEN_IN"
        actor: ComplaintIntakeSpecialist
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_COMPLAINT_STATE)"
        side_effects:
          - "status = SCREENED_IN; screened_at = now"
      - from: RECEIVED
        to: SCREENED_OUT
        trigger: "POST /licensing/complaints/{complaint_id}/screen with decision = SCREEN_OUT"
        actor: ComplaintIntakeSpecialist
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_COMPLAINT_STATE)"
          - "priority != P1 (a P1 allegation can never be screened out) (else ERR_P1_CANNOT_BE_SCREENED_OUT)"
        side_effects:
          - "status = SCREENED_OUT; screened_at = now; timeliness_flag stays null"
      - from: SCREENED_IN
        to: UNDER_INVESTIGATION
        trigger: "POST /licensing/complaints/{complaint_id}/assign-investigator"
        actor: LicensingSupervisor
        preconditions:
          - "status == SCREENED_IN (else ERR_INVALID_COMPLAINT_STATE)"
          - "the referenced Inspector exists (else ERR_INSPECTOR_NOT_FOUND)"
          - "Inspector.status == ACTIVE (else ERR_INSPECTOR_ON_LEAVE)"
          - "SEGREGATION: no Inspection exists WHERE provider_id = complaint.provider_id AND inspector_id = the requested investigator AND status = FINALIZED AND finalized_at > now - SEGREGATION_LOOKBACK_MONTHS (12 months, lower edge exclusive) (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = UNDER_INVESTIGATION; assigned_investigator_id set"
      - from: UNDER_INVESTIGATION
        to: DETERMINED
        trigger: "POST /licensing/complaints/{complaint_id}/determination"
        actor: ComplaintInvestigator
        preconditions:
          - "status == UNDER_INVESTIGATION (else ERR_INVALID_COMPLAINT_STATE)"
          - "X-User-ID == complaint.assigned_investigator_id (else ERR_OWNERSHIP_VIOLATION)"
          - "when determination = SUBSTANTIATED: exists Inspection WHERE complaint_id = complaint.id AND status = FINALIZED (else ERR_COMPLAINT_INSPECTION_REQUIRED)"
          - "when determination = SUBSTANTIATED: a ChecklistItem exists whose code == COMPLAINT_CATEGORY_CHECKLIST_CODE[allegation_category] (else ERR_CHECKLIST_ITEM_NOT_FOUND)"
        side_effects:
          - "CASCADE link 1: status = DETERMINED; determination stored; determined_at = now; timeliness_flag = ON_TIME when determined_at <= investigation_due_at else LATE"
          - "CASCADE link 2 (only when determination = SUBSTANTIATED): because the determination is substantiated, one Violation is auto-cited (auto_generated = true, status CORRECTION_PENDING because the target inspection is already FINALIZED) on the target inspection selected as: candidate set = Inspection WHERE complaint_id = complaint.id AND status = FINALIZED; rank by finalized_at DESC; tie-break created_at ASC; empty-set fallback is impossible because it is a precondition. checklist_item = the item whose code == COMPLAINT_CATEGORY_CHECKLIST_CODE[allegation_category]; primary_age_group = complaint.affected_age_group; severity = that item's default_severity; repeat_of_violation_id = null; assessed_points per §1.3 violation_point_assessment; correction_due_date per §1.3 correction_due_date"
          - "CASCADE link 3: because that Violation now exists, Provider.open_violation_points / lifetime_violation_points / critical_open_count / critical_violation_count_24mo / substantiated_complaint_count_24mo are recomputed, Provider.risk_score / risk_tier are recomputed (ENFORCEMENT_REVIEW), and the target Inspection.final_compliance_score / raw_deduction_points / violation_count are recomputed"
          - "CASCADE link 4: because Provider.open_violation_points now satisfies open_violation_points >= PROBATION_THRESHOLD (30) while Provider.current_ladder_step < 2, one EnforcementAction is auto-created in status PROPOSED with source_inspection_id = the target inspection, action_type / ladder_step from §1.3 enforcement_ladder_step, basis_points = the recomputed Provider.open_violation_points, and fine_amount_cents from §1.3 enforcement_fine_amount"
          - "increments Provider.version by 1; increments the target Inspection.version by 1"
        note: |
          This is transitive cascade A of §0.5 rule_4 (depth 4). Link 4 fires only
          when the threshold test passes; at open_violation_points < 30 or
          current_ladder_step >= 2 the chain stops after link 3 and no
          EnforcementAction is created.
      - from: DETERMINED
        to: CLOSED
        trigger: "POST /licensing/complaints/{complaint_id}/close"
        actor: LicensingSupervisor
        preconditions:
          - "status == DETERMINED (else ERR_INVALID_COMPLAINT_STATE)"
        side_effects:
          - "status = CLOSED; closure_note stored"
          - "any PublicReportPosting of this provider that was blocked by this open investigation becomes postable"

  - entity: CorrectiveActionPlan
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, FAILED, SUPERSEDED]
    shape: cyclic
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /licensing/corrective-action-plans/{cap_id}/review with decision = APPROVE"
        actor: LicensingSupervisor
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_CAP_STATE)"
          - "the referenced Inspection.status == FINALIZED (else ERR_INVALID_INSPECTION_STATE) — CAP <-> Inspection cross-entity dependency"
        side_effects:
          - "status = APPROVED; reviewed_at = now; approved_at = now; reviewed_by_user_id = X-User-ID; review_note stored"
          - "every Violation listed in violation_ids whose status == CITED transitions to CORRECTION_PENDING"
          - "increments CorrectiveActionPlan.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /licensing/corrective-action-plans/{cap_id}/review with decision = REJECT"
        actor: LicensingSupervisor
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_CAP_STATE)"
          - "review_note is non-blank when decision = REJECT (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = REJECTED; reviewed_at = now; reviewed_by_user_id = X-User-ID"
          - "increments CorrectiveActionPlan.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /licensing/corrective-action-plans/{cap_id}/resubmit"
        actor: Applicant
        preconditions:
          - "status == REJECTED (else ERR_INVALID_CAP_STATE)"
          - "X-User-ID == cap.provider_id (else ERR_OWNERSHIP_VIOLATION)"
          - "review_cycle_count < CAP_MAX_REVIEW_CYCLES (3, strict <) (else ERR_CAP_REVIEW_CYCLE_EXHAUSTED)"
        side_effects:
          - "status = SUBMITTED (this closes the SUBMITTED -> REJECTED -> SUBMITTED cycle); review_cycle_count += 1"
          - "submitted_at = now; narrative / proposed_completion_date / violation_ids replaced"
          - "due_at recomputed per §1.3 corrective_action_due_date"
          - "increments CorrectiveActionPlan.version by 1"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /licensing/corrective-action-plans/{cap_id}/complete with result = COMPLETED"
        actor: LicensingSupervisor
        preconditions:
          - "status == APPROVED (else ERR_INVALID_CAP_STATE)"
          - "every Violation listed in violation_ids has status IN {VERIFIED_CORRECTED, VACATED} (else ERR_INVALID_VIOLATION_STATE)"
        side_effects:
          - "status = COMPLETED; completed_at = now"
          - "Inspection.final_compliance_score / raw_deduction_points recomputed"
          - "Provider.risk_score / risk_tier recomputed"
      - from: APPROVED
        to: FAILED
        trigger: "POST /licensing/corrective-action-plans/{cap_id}/complete with result = FAILED"
        actor: LicensingSupervisor
        preconditions:
          - "status == APPROVED (else ERR_INVALID_CAP_STATE)"
          - "now > cap.due_at (strict >) (else ERR_CAP_WINDOW_CLOSED)"
        side_effects:
          - "status = FAILED; completed_at = now"
          - "every Violation listed in violation_ids with status = CORRECTION_PENDING transitions to UNCORRECTED"
          - "Inspection.final_compliance_score recomputed (UNCORRECTED factor 1.250 lowers it)"
          - "Provider.risk_score / risk_tier recomputed"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer CorrectiveActionPlan is created for the same inspection_id"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, REJECTED}"
          - "the new plan passed the OCC check on Inspection.version"
        side_effects:
          - "status = SUPERSEDED"
          - "increments CorrectiveActionPlan.version by 1"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system: a newer CorrectiveActionPlan is created for the same inspection_id"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, REJECTED}"
        side_effects:
          - "status = SUPERSEDED"
          - "increments CorrectiveActionPlan.version by 1"

  - entity: EnforcementAction
    state_field: status
    initial_state: PROPOSED
    terminal_states: [UPHELD, VACATED, WITHDRAWN]
    shape: branching
    transitions:
      - from: PROPOSED
        to: ISSUED
        trigger: "POST /licensing/enforcement-actions/{action_id}/issue"
        actor: LicensingSupervisor
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_ENFORCEMENT_STATE)"
          - "SEGREGATION: no CorrectiveActionPlan exists WHERE inspection_id == action.source_inspection_id AND reviewed_by_user_id == X-User-ID AND status IN {APPROVED, COMPLETED, FAILED} (the supervisor who approved the CAP for that inspection may not issue enforcement on it) (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = ISSUED; issued_at = now; issued_by_user_id = X-User-ID"
          - "appeal_deadline_at = issued_at + APPEAL_WINDOW_DAYS (15) days"
      - from: ISSUED
        to: EFFECTIVE
        trigger: "POST /licensing/enforcement-actions/{action_id}/effectuate"
        actor: AgencyAdmin
        preconditions:
          - "status == ISSUED (else ERR_INVALID_ENFORCEMENT_STATE)"
          - "when action_type = WARNING: Provider.license_status IN {PROVISIONAL, FULL, PROBATION} (else ERR_INVALID_LICENSE_STATE)"
          - "when action_type = PROBATION: Provider.license_status IN {PROVISIONAL, FULL} (else ERR_INVALID_LICENSE_STATE)"
          - "when action_type = SUSPENSION: Provider.license_status IN {FULL, PROBATION} (else ERR_INVALID_LICENSE_STATE)"
          - "when action_type = REVOCATION: Provider.license_status IN {PROBATION, SUSPENDED} (else ERR_INVALID_LICENSE_STATE)"
        side_effects:
          - "status = EFFECTIVE; effective_at = now"
          - "WARNING: Provider.current_ladder_step = max(current_ladder_step, 1); license_status unchanged"
          - "PROBATION: Provider.license_status = PROBATION; current_ladder_step = max(current_ladder_step, 2); probation_cycle_count += 1"
          - "SUSPENSION: Provider.license_status = SUSPENDED; current_ladder_step = max(current_ladder_step, 3); capacity_held_slots = Provider.licensed_capacity; Provider.suspended_capacity += capacity_held_slots; Provider.licensed_capacity = 0 (conserves licensed_capacity + suspended_capacity — compensating invariant 2 of §0.5 rule_9)"
          - "REVOCATION: Provider.license_status = REVOKED; current_ladder_step = 4; capacity_held_slots = Provider.licensed_capacity + Provider.suspended_capacity; Provider.licensed_capacity = 0; Provider.suspended_capacity = 0; every LicenseAmendment of this provider in status IN {SUBMITTED, PRE_INSPECTION_REQUIRED} transitions to WITHDRAWN; every other EnforcementAction of this provider in status = PROPOSED transitions to WITHDRAWN; every Inspection of this provider in status IN {SCHEDULED, IN_PROGRESS} transitions to VOIDED"
          - "Provider.risk_score / risk_tier recomputed (ENFORCEMENT_REVIEW variant); increments Provider.version by 1"
      - from: EFFECTIVE
        to: APPEALED
        trigger: "POST /licensing/enforcement-actions/{action_id}/appeal"
        actor: Applicant
        preconditions:
          - "status == EFFECTIVE (else ERR_INVALID_ENFORCEMENT_STATE)"
          - "X-User-ID == action.provider_id (else ERR_OWNERSHIP_VIOLATION)"
          - "now <= action.appeal_deadline_at (inclusive upper edge — filing exactly at the deadline instant is accepted) (else ERR_APPEAL_DEADLINE_PASSED)"
        side_effects:
          - "status = APPEALED; appealed_at = now; appeal_note stored"
          - "the provider's license_status and capacity fields are NOT changed by filing an appeal"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /licensing/enforcement-actions/{action_id}/appeal-decision with appeal_decision = UPHELD"
        actor: AgencyAdmin
        preconditions:
          - "status == APPEALED (else ERR_INVALID_ENFORCEMENT_STATE)"
          - "X-User-ID != action.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = UPHELD; resolved_at = now"
          - "no provider field changes: the action's effects stand"
      - from: APPEALED
        to: VACATED
        trigger: "POST /licensing/enforcement-actions/{action_id}/appeal-decision with appeal_decision = VACATED"
        actor: AgencyAdmin
        preconditions:
          - "status == APPEALED (else ERR_INVALID_ENFORCEMENT_STATE)"
          - "X-User-ID != action.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = VACATED; resolved_at = now"
          - "COMPENSATION for SUSPENSION: Provider.licensed_capacity += capacity_held_slots; Provider.suspended_capacity -= capacity_held_slots; capacity_held_slots = 0; Provider.license_status = PROBATION (never restored directly to FULL); current_ladder_step = 2 — licensed_capacity + suspended_capacity is identical to its pre-effectuate value (compensating invariant 2 of §0.5 rule_9)"
          - "COMPENSATION for REVOCATION: Provider.licensed_capacity += capacity_held_slots; capacity_held_slots = 0; Provider.license_status = PROBATION; current_ladder_step = 2 (previously WITHDRAWN amendments / inspections are NOT resurrected)"
          - "COMPENSATION for PROBATION: Provider.license_status = FULL; current_ladder_step = 1; probation_cycle_count is NOT decremented (it is a lifetime counter)"
          - "COMPENSATION for WARNING: current_ladder_step = 0"
          - "Provider.risk_score / risk_tier recomputed; increments Provider.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system: a REVOCATION EnforcementAction for the same provider became EFFECTIVE"
        actor: system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "status = WITHDRAWN; resolved_at = now"

  - entity: LicenseAmendment
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN, SUPERSEDED]
    shape: branching
    initial_state_note: |
      POST /licensing/license-amendments computes requires_inspection deterministically
      from amendment_type: SITE_MOVE and AGE_GROUP_ADD => true, CAPACITY_CHANGE with
      effective_capacity_delta > 0 => true, CAPACITY_CHANGE with effective_capacity_delta
      <= 0 => false, DIRECTOR_CHANGE => false. When requires_inspection is true the
      record is created directly in PRE_INSPECTION_REQUIRED; otherwise in SUBMITTED.
      Both are therefore producible creation states.
    transitions:
      - from: PRE_INSPECTION_REQUIRED
        to: SUBMITTED
        trigger: "POST /licensing/license-amendments/{amendment_id}/attach-inspection"
        actor: LicensingSupervisor
        preconditions:
          - "status == PRE_INSPECTION_REQUIRED (else ERR_INVALID_AMENDMENT_STATE)"
          - "the referenced Inspection exists (else ERR_INSPECTION_NOT_FOUND)"
          - "that Inspection.provider_id == amendment.provider_id (else ERR_VIOLATION_INSPECTION_MISMATCH)"
          - "that Inspection.status == FINALIZED (else ERR_INVALID_INSPECTION_STATE)"
          - "that Inspection.inspection_type == AMENDMENT_PRE_MOVE (else ERR_INVALID_INSPECTION_TYPE)"
        side_effects:
          - "pre_move_inspection_id set; status = SUBMITTED"
          - "increments LicenseAmendment.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /licensing/license-amendments/{amendment_id}/decide with decision = APPROVE"
        actor: AgencyAdmin
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_AMENDMENT_STATE)"
          - "no EnforcementAction of this provider is in status = EFFECTIVE with action_type IN {SUSPENSION, REVOCATION} (else ERR_ACTIVE_ENFORCEMENT_BLOCKS_AMENDMENT) — cross-entity state dependency"
          - "when amendment_type = CAPACITY_CHANGE: Provider.licensed_capacity + effective_capacity_delta <= PROGRAM_CAPACITY_CEILING[Provider.program_type] (inclusive) (else ERR_CAPACITY_CEILING_EXCEEDED)"
          - "when amendment_type = CAPACITY_CHANGE and effective_capacity_delta > 0: Provider.critical_open_count == 0 (else ERR_UNRESOLVED_CRITICAL_VIOLATION)"
        side_effects:
          - "status = APPROVED; decided_at = now"
          - "CAPACITY_CHANGE: Provider.licensed_capacity += effective_capacity_delta; Provider.capacity_ceiling unchanged"
          - "SITE_MOVE: Provider.site_address replaced by new_site_address"
          - "DIRECTOR_CHANGE: Provider.director_staff_member_id = new_director_staff_member_id"
          - "AGE_GROUP_ADD: a new AgeGroupRoster is created for new_age_group with requested_group_size = new_group_size, approved_group_size = new_group_size, enrolled_count 0, staff_assigned_count 0, lead_staff_member_id null"
          - "increments Provider.version by 1; increments LicenseAmendment.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /licensing/license-amendments/{amendment_id}/decide with decision = DENY"
        actor: AgencyAdmin
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_AMENDMENT_STATE)"
          - "decision_rationale is non-blank (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = DENIED; decided_at = now; decision_rationale stored; no provider field changes"
          - "increments LicenseAmendment.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /licensing/license-amendments/{amendment_id}/withdraw, or system when a REVOCATION became EFFECTIVE for this provider"
        actor: Applicant
        preconditions:
          - "status IN {SUBMITTED, PRE_INSPECTION_REQUIRED} (else ERR_INVALID_AMENDMENT_STATE)"
          - "for the Applicant-triggered form: X-User-ID == amendment.provider_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "status = WITHDRAWN; decided_at = now"
          - "increments LicenseAmendment.version by 1"
      - from: PRE_INSPECTION_REQUIRED
        to: WITHDRAWN
        trigger: "POST /licensing/license-amendments/{amendment_id}/withdraw, or system when a REVOCATION became EFFECTIVE for this provider"
        actor: Applicant
        preconditions:
          - "status IN {SUBMITTED, PRE_INSPECTION_REQUIRED} (else ERR_INVALID_AMENDMENT_STATE)"
        side_effects:
          - "status = WITHDRAWN; decided_at = now"
          - "increments LicenseAmendment.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer LicenseAmendment of the same amendment_type is created for the same provider_id"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, PRE_INSPECTION_REQUIRED}"
          - "the newer amendment passed the OCC check on Provider.version"
        side_effects:
          - "status = SUPERSEDED; decided_at = now"
          - "increments LicenseAmendment.version by 1"
      - from: PRE_INSPECTION_REQUIRED
        to: SUPERSEDED
        trigger: "system: a newer LicenseAmendment of the same amendment_type is created for the same provider_id"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, PRE_INSPECTION_REQUIRED}"
        side_effects:
          - "status = SUPERSEDED; decided_at = now"
          - "increments LicenseAmendment.version by 1"

  - entity: SeriousIncidentReport
    state_field: status
    initial_state: REPORTED
    terminal_states: [CLOSED]
    shape: branching
    initial_state_note: |
      POST /licensing/serious-incident-reports creates the record in REPORTED and
      computes reporting_deadline_at = occurred_at + INCIDENT_REPORT_WINDOW_HOURS[incident_type]
      hours, reporting_timeliness = TIMELY when reported_at <= reporting_deadline_at
      (inclusive upper edge) else LATE_REPORT. When reporting_timeliness == LATE_REPORT the create
      additionally attempts a conditional cascade: candidate set = Inspection WHERE
      provider_id = report.provider_id AND status = FINALIZED, ranked finalized_at DESC,
      tie-break created_at ASC; if that set is non-empty a Violation is auto-cited on the
      top-ranked inspection (auto_generated = true, status CORRECTION_PENDING,
      checklist_item = the item whose code == "RE-601", severity_override = CRITICAL,
      primary_age_group = report.affected_child_age_group) and late_report_violation_created is
      set true; if the set is empty no Violation is created and
      late_report_violation_created stays false.
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /licensing/serious-incident-reports/{report_id}/review with disposition = MONITOR"
        actor: LicensingSupervisor
        preconditions:
          - "status == REPORTED (else ERR_INVALID_INCIDENT_STATE)"
          - "incident_type NOT IN {FATALITY, MISSING_CHILD} (a fatality or missing-child report must open an investigation and can never be merely monitored) (else ERR_INCIDENT_REQUIRES_INVESTIGATION)"
        side_effects:
          - "status = UNDER_REVIEW; reviewed_at = now; agency_note stored; generated_complaint_id stays null"
      - from: REPORTED
        to: INVESTIGATION_OPENED
        trigger: "POST /licensing/serious-incident-reports/{report_id}/review with disposition = OPEN_INVESTIGATION"
        actor: LicensingSupervisor
        preconditions:
          - "status == REPORTED (else ERR_INVALID_INCIDENT_STATE)"
        side_effects:
          - "status = INVESTIGATION_OPENED; reviewed_at = now"
          - "one Complaint is auto-created for report.provider_id in status SCREENED_IN (intake screening is implicit for agency-initiated investigations) with intake_channel = AGENCY_INCIDENT, allegation_category = ABUSE when incident_type IN {FATALITY, SERIOUS_INJURY, MISSING_CHILD} else RECORDS, affected_age_group = report.affected_child_age_group, narrative copied from report.narrative, alleged_serious_harm = true, anonymous = false, complainant_name = null, priority = P1, received_at = now, investigation_due_at = now + DETERMINATION_DAYS[P1] (30) days"
          - "generated_complaint_id = the new complaint's id"
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /licensing/serious-incident-reports/{report_id}/close"
        actor: LicensingSupervisor
        preconditions:
          - "status IN {UNDER_REVIEW, INVESTIGATION_OPENED} (else ERR_INVALID_INCIDENT_STATE)"
        side_effects:
          - "status = CLOSED; closed_at = now"
      - from: INVESTIGATION_OPENED
        to: CLOSED
        trigger: "POST /licensing/serious-incident-reports/{report_id}/close"
        actor: LicensingSupervisor
        preconditions:
          - "status IN {UNDER_REVIEW, INVESTIGATION_OPENED} (else ERR_INVALID_INCIDENT_STATE)"
          - "generated_complaint_id IS NULL OR that Complaint.status IN {CLOSED, SCREENED_OUT} (else ERR_INVALID_COMPLAINT_STATE) — cross-entity state dependency"
        side_effects:
          - "status = CLOSED; closed_at = now"

  - entity: PublicReportPosting
    state_field: posting_status
    initial_state: PENDING_REDACTION
    terminal_states: [WITHDRAWN]
    shape: cyclic
    transitions:
      - from: PENDING_REDACTION
        to: POSTED
        trigger: "POST /licensing/public-report-postings/{posting_id}/post"
        actor: AgencyAdmin
        preconditions:
          - "status == PENDING_REDACTION (else ERR_INVALID_POSTING_STATE)"
          - "redaction_complete == true (else ERR_REDACTION_INCOMPLETE)"
          - "the referenced Inspection.status == FINALIZED (else ERR_INVALID_INSPECTION_STATE)"
          - "no Complaint of posting.provider_id is in status = UNDER_INVESTIGATION (else ERR_POSTING_BLOCKED_OPEN_INVESTIGATION) — cross-entity state dependency"
        side_effects:
          - "status = POSTED; posted_at = now; expires_at = posted_at + POSTING_RETENTION_MONTHS (36) months"
          - "display_score computed per §1.3 public_display_score; enforcement_banner computed from the provider's ladder state"
      - from: POSTED
        to: CORRECTED
        trigger: "POST /licensing/public-report-postings/{posting_id}/revise with action = CORRECT"
        actor: AgencyAdmin
        preconditions:
          - "status IN {POSTED, CORRECTED} (else ERR_INVALID_POSTING_STATE)"
          - "correction_count < POSTING_MAX_CORRECTIONS (2, strict <) (else ERR_POSTING_CORRECTION_LIMIT)"
          - "revision_note is non-blank (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = CORRECTED; correction_count += 1; corrected_at = now"
          - "display_score and enforcement_banner recomputed from the inspection's and provider's current values"
      - from: CORRECTED
        to: CORRECTED
        trigger: "POST /licensing/public-report-postings/{posting_id}/revise with action = CORRECT (self-loop: a corrected posting may be corrected again)"
        actor: AgencyAdmin
        preconditions:
          - "status IN {POSTED, CORRECTED} (else ERR_INVALID_POSTING_STATE)"
          - "correction_count < POSTING_MAX_CORRECTIONS (2, strict <) (else ERR_POSTING_CORRECTION_LIMIT)"
        side_effects:
          - "correction_count += 1; corrected_at = now; display_score and enforcement_banner recomputed"
        note: |
          This self-loop is the cyclic element of this machine and is bounded by
          POSTING_MAX_CORRECTIONS: the second CORRECT succeeds (correction_count 1 -> 2)
          and the third is refused with ERR_POSTING_CORRECTION_LIMIT.
      - from: POSTED
        to: WITHDRAWN
        trigger: "POST /licensing/public-report-postings/{posting_id}/revise with action = WITHDRAW"
        actor: AgencyAdmin
        preconditions:
          - "status IN {POSTED, CORRECTED} (else ERR_INVALID_POSTING_STATE)"
          - "revision_note is non-blank (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = WITHDRAWN; withdrawn_at = now; display_score = null; the posting is excluded from the public listing"
      - from: CORRECTED
        to: WITHDRAWN
        trigger: "POST /licensing/public-report-postings/{posting_id}/revise with action = WITHDRAW"
        actor: AgencyAdmin
        preconditions:
          - "status IN {POSTED, CORRECTED} (else ERR_INVALID_POSTING_STATE)"
        side_effects:
          - "status = WITHDRAWN; withdrawn_at = now; display_score = null"

# =========================================================================
# §1.2.1 Concurrency Rules (OCC-only)
# =========================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /licensing/license-amendments"
    occ_field: "expected_provider_version"
    description: |
      Creating a LicenseAmendment against a Provider whose version has advanced
      since the client last read it is rejected. A second sequential create of
      the same amendment_type would itself legitimately succeed — it SUPERSEDEs
      the still-open earlier amendment of that type — so the only way to tell an
      informed writer from an uninformed one is the version the request carries.
      A request whose expected_provider_version does not equal the provider's
      current version is refused before any supersede takes place.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412

  - rule_id: cap-submit-stale-inspection
    parent_entity: Inspection
    write_endpoint: "POST /licensing/corrective-action-plans"
    occ_field: "expected_inspection_version"
    description: |
      Submitting a CorrectiveActionPlan against an Inspection whose version has
      advanced since the client last read it is rejected. A second sequential
      submission for the same inspection_id would itself legitimately succeed —
      the newer plan SUPERSEDEs the open earlier plan for that inspection — so
      the carried expected_inspection_version is what distinguishes a writer who
      has seen the current violation set and score from one who has not.
    error_id: ERR_STALE_INSPECTION_VERSION
    http_status: 412

# =========================================================================
# §1.3 Calculation Rules
# =========================================================================
calculations:
  - name: violation_point_assessment
    trigger: |
      Whenever a Violation row is created — by POST /licensing/violations, by the
      substantiated-complaint cascade, or by the late-incident-report cascade.
      assessed_points is frozen at creation and is never recomputed afterwards.
    algorithm: weighted_scoring
    formula: |
      effective_severity = severity_override IF severity_override IS NOT NULL
                           ELSE checklist_item.default_severity

      infant_exposure = (primary_age_group == "INFANT")
                        OR (checklist_item.infant_sensitive == true
                            AND "INFANT" IN inspection.age_groups_observed)

      repeat_chain_depth = 0                                        IF repeat_of_violation_id IS NULL
                           ELSE min(2, parent_violation.repeat_chain_depth + 1)

      base   = SEVERITY_BASE_POINTS[effective_severity]
      step1  = base + (INFANT_AGGRAVATION_PCT * base IF infant_exposure ELSE 0)
      step2  = step1 * REPEAT_MULTIPLIER[repeat_chain_depth]
      assessed_points = min(round_half_up(step2, 0), MAX_POINTS_PER_VIOLATION)

      # Step order is normative: aggravate first, then multiply for repetition,
      # then round to a whole point, then cap. Rounding before the repeat
      # multiplier, or capping before the multiplier, produces different results.
      # Worked literals (all pinned):
      #   CRITICAL, infant, depth 0 -> 15 -> 22.5 -> 22.5 -> 23
      #   CRITICAL, no infant, depth 0 -> 15
      #   SERIOUS,  infant, depth 0 -> 8 -> 12 -> 12 -> 12
      #   MODERATE, no infant, depth 1 -> 4 -> 4 -> 8 -> 8
      #   MINOR,    infant, depth 0 -> 1 -> 1.5 -> 1.5 -> 2   (round_half_up, not 1)
      #   CRITICAL, infant, depth 1 -> 15 -> 22.5 -> 45 -> min(45,30) = 30 (capped)
    input_set: |
      A single Violation row plus its ChecklistItem and its parent Inspection.
      repeat_chain_depth reads exactly one ancestor (the row named by
      repeat_of_violation_id), which must belong to the same provider, name the
      same checklist_item_id, and have been cited within REPEAT_LOOKBACK_MONTHS
      of the new citation instant (else ERR_REPEAT_REFERENCE_INVALID).
    constants:
      SEVERITY_BASE_POINTS: { CRITICAL: 15, SERIOUS: 8, MODERATE: 4, MINOR: 1 }
      INFANT_AGGRAVATION_PCT: 0.5
      REPEAT_MULTIPLIER: { 0: 1.0, 1: 2.0, 2: 3.0 }
      MAX_POINTS_PER_VIOLATION: 30
      REPEAT_LOOKBACK_MONTHS: 24
    precision: "assessed_points is an integer; the single rounding is round_half_up to 0 decimal places applied to step2 before the cap"

  - name: inspection_compliance_score
    trigger: |
      Computed at POST /licensing/inspections/{inspection_id}/finalize (both
      variants stored), recomputed for the FINAL variant on every
      POST /licensing/violations/{violation_id}/disposition, on CAP complete,
      and on the substantiated-complaint cascade. Both variants are computable
      on demand via GET /licensing/inspections/{inspection_id}/compliance-score.
    algorithm: aggregation
    formula: |
      FOR EACH violation V in input_set (order does not matter — every line is
      rounded before it is summed):
        line_deduction[V] = round_half_up(
              V.assessed_points
            * AGE_GROUP_EXPOSURE_WEIGHT[V.primary_age_group]
            * status_factor(V),
            2)

      raw_deduction_points = round_half_up(SUM(line_deduction), 2)
      compliance_score     = round_half_up(max(0, 100 - raw_deduction_points), 2)

      # Rounding mode is normative: round EACH line to 2dp, THEN sum. Summing the
      # unrounded products and rounding once at the end yields a different answer
      # (see the pinned literals below).
    input_set: |
      Violations whose inspection_id == the target inspection, filtered per
      variant (see variants). The provider's other inspections never contribute.
    constants:
      AGE_GROUP_EXPOSURE_WEIGHT: { INFANT: 1.335, TODDLER: 1.150, PRESCHOOL: 1.000, SCHOOL_AGE: 0.875 }
      STATUS_FACTOR: { CITED: 1.000, CORRECTION_PENDING: 1.000, VERIFIED_CORRECTED: 0.400, UNCORRECTED: 1.250, VACATED: 0.000 }
      SCORE_CEILING: 100
    precision: "2 decimal places, round_half_up, applied per line and then once to the sum and once to the final score"
    variants:
      - name: PRELIMINARY
        when: |
          The as-cited view. Stored in Inspection.preliminary_compliance_score at
          finalize (frozen there) and recomputed live by
          GET .../compliance-score?variant=PRELIMINARY.
        difference: |
          input_set excludes Violations with status == VACATED, and
          status_factor(V) is forced to 1.000 for every included violation
          regardless of its actual status. It answers "how bad was the site on
          the day of the visit".
      - name: FINAL
        when: |
          The post-correction view. Stored in Inspection.final_compliance_score
          and recomputed on every disposition, CAP completion, and cascade-cited
          violation. Recomputed live by GET .../compliance-score?variant=FINAL.
        difference: |
          input_set includes every Violation of the inspection (VACATED rows
          included, contributing 0.000 through STATUS_FACTOR), and
          status_factor(V) = STATUS_FACTOR[V.status]. Corrections shrink the
          deduction (0.400) while an uncorrected violation grows it (1.250), so
          FINAL can be either above or below PRELIMINARY.
    worked_literals: |
      Fixture: one INITIAL inspection with age_groups_observed
      [INFANT, TODDLER, PRESCHOOL] and five violations cited in this order —
        V0 FA-401 MODERATE / PRESCHOOL / depth 0             -> assessed_points  4
        V1 SU-101 CRITICAL / INFANT    / depth 0             -> assessed_points 23
        V2 SU-101 CRITICAL / INFANT    / depth 0             -> assessed_points 23
        V3 RA-201 SERIOUS  / TODDLER   / depth 0             -> assessed_points  8
        V4 FA-401 MODERATE / PRESCHOOL / depth 1 (repeat V0) -> assessed_points  8

      (a) At finalize every violation is CORRECTION_PENDING (factor 1.000):
          lines 4*1.000=4.00, 23*1.335=30.705->30.71, 30.71,
                8*1.150=9.20, 8*1.000=8.00
          raw = 82.62   PRELIMINARY = FINAL = 17.38
          (summing the unrounded products first gives 82.61 -> 17.39, WRONG)

      (b) After V1 -> VERIFIED_CORRECTED, V2 -> UNCORRECTED, V3 -> VACATED,
          V0 and V4 left CORRECTION_PENDING:
          FINAL lines:  4*1.000*1.000 =  4.00
                       23*1.335*0.400 = 12.282   -> 12.28
                       23*1.335*1.250 = 38.38125 -> 38.38
                        8*1.150*0.000 =  0.00
                        8*1.000*1.000 =  8.00
          FINAL raw = 62.66  ->  FINAL score = 37.34
          PRELIMINARY recomputed live (V3 excluded, all factors 1.000):
                       4.00 + 30.71 + 30.71 + 8.00 = 73.42 -> score 26.58
          Inspection.preliminary_compliance_score stays frozen at 17.38.
          Same stored data, two variants: 37.34 vs 26.58.

  - name: provider_risk_assessment
    trigger: |
      Recomputed on every event that changes a provider's violation points,
      complaint determinations, or license/ladder state: violation citation,
      violation disposition, complaint determination, CAP completion,
      enforcement effectuation, and appeal decision. Readable on demand via
      GET /licensing/providers/{provider_id}/risk-assessment?variant=...
    algorithm: weighted_scoring
    formula: |
      points_component        = W_POINTS * min(Provider.open_violation_points, POINTS_CAP)
      substantiated_component = W_SUBSTANTIATED * Provider.substantiated_complaint_count_24mo
      inconclusive_component  = W_INCONCLUSIVE[variant] * Provider.inconclusive_complaint_count_24mo
      critical_component      = CRITICAL_FLOOR_BONUS   IF Provider.critical_violation_count_24mo >= 1 ELSE 0
      probation_component     = PROBATION_STATE_BONUS  IF Provider.license_status IN {PROBATION, SUSPENDED} ELSE 0

      risk_score = round_half_up(min(RISK_CEILING,
                        points_component + substantiated_component
                      + inconclusive_component + critical_component
                      + probation_component), 2)

      risk_tier  = "LOW"      IF risk_score < 20
                   "MODERATE" IF 20 <= risk_score < 45
                   "HIGH"     IF 45 <= risk_score < 70
                   "SEVERE"   IF risk_score >= 70
    input_set: |
      The provider's own counters only. The 24-month counters count Violations
      cited (created_at > now - RISK_LOOKBACK_MONTHS, lower edge exclusive) and
      Complaints determined in that window; SCREENED_OUT complaints and VACATED
      violations never count.
    constants:
      W_POINTS: 1.0
      POINTS_CAP: 60
      W_SUBSTANTIATED: 8
      W_INCONCLUSIVE: { INTAKE_SCREENING: 0, ENFORCEMENT_REVIEW: 4 }
      CRITICAL_FLOOR_BONUS: 10
      PROBATION_STATE_BONUS: 15
      RISK_CEILING: 100
      RISK_LOOKBACK_MONTHS: 24
      RISK_TIER_MODERATE_FLOOR: 20
      RISK_TIER_HIGH_FLOOR: 45
      RISK_TIER_SEVERE_FLOOR: 70
    precision: "2 decimal places, round_half_up; risk_tier bands use inclusive lower edges and exclusive upper edges"
    variants:
      - name: INTAKE_SCREENING
        when: |
          The variant used when a Complaint is screened and when a public-facing
          risk tier is displayed. Requested with variant=INTAKE_SCREENING.
        difference: |
          W_INCONCLUSIVE = 0 — unproven allegations are given no weight at all,
          because intake screening must not let unsubstantiated reports raise a
          provider's public risk profile.
      - name: ENFORCEMENT_REVIEW
        when: |
          The variant used whenever the ladder is evaluated and whenever
          Provider.risk_score / risk_tier are persisted. Requested with
          variant=ENFORCEMENT_REVIEW.
        difference: |
          W_INCONCLUSIVE = 4 — a pattern of inconclusive allegations is a
          legitimate enforcement signal, so each inconclusive determination in
          the 24-month window adds 4 points.
    worked_literals: |
      Fixture: open_violation_points = 10, substantiated_complaint_count_24mo = 1,
      inconclusive_complaint_count_24mo = 1, critical_violation_count_24mo = 0,
      license_status NOT IN {PROBATION, SUSPENDED} (NONE and FULL alike give
      probation_component = 0).
        INTAKE_SCREENING  : 10 + 8 + 0*1 + 0 + 0 = 18.00 -> tier LOW
        ENFORCEMENT_REVIEW: 10 + 8 + 4*1 + 0 + 0 = 22.00 -> tier MODERATE
      The same stored data therefore yields both a different score and a
      different tier depending on the variant.

  - name: enforcement_ladder_step
    trigger: "POST /licensing/enforcement-actions (proposal) and again at effectuate, to validate the requested action_type against the provider's accumulated points."
    algorithm: threshold
    formula: |
      p = Provider.open_violation_points   (read at the instant of the proposal)

      recommended_action_type =
          "REVOCATION" IF p >= REVOCATION_THRESHOLD
          "SUSPENSION" IF p >= SUSPENSION_THRESHOLD
          "PROBATION"  IF p >= PROBATION_THRESHOLD
          "WARNING"    IF p >= WARNING_THRESHOLD
          NONE         otherwise   -> reject with ERR_NO_ENFORCEMENT_BASIS

      ladder_step = LADDER_STEP[requested_action_type]

      # The agency may under-enforce but never over-enforce:
      IF LADDER_STEP[requested_action_type] > LADDER_STEP[recommended_action_type]
         -> reject with ERR_LADDER_STEP_SKIP
      basis_points = p   (frozen on the EnforcementAction row)
    input_set: "Provider.open_violation_points, which per the conservation invariant equals the sum of assessed_points over the provider's Violations in status IN {CITED, CORRECTION_PENDING, UNCORRECTED}."
    constants:
      WARNING_THRESHOLD: 15
      PROBATION_THRESHOLD: 30
      SUSPENSION_THRESHOLD: 45
      REVOCATION_THRESHOLD: 60
      LADDER_STEP: { WARNING: 1, PROBATION: 2, SUSPENSION: 3, REVOCATION: 4 }
    precision: "integer points; every threshold comparison is >= (inclusive lower edge)"
    worked_literals: |
      open_violation_points = 30 (two CRITICAL violations at 15 each):
        recommended = PROBATION -> requesting PROBATION is accepted (201).
      open_violation_points = 29 (15 + 8 + 4 + 1 + 1):
        recommended = WARNING   -> requesting PROBATION is rejected with
        ERR_LADDER_STEP_SKIP (409); requesting WARNING is accepted.
      open_violation_points = 14: recommended = NONE -> any proposal is rejected
        with ERR_NO_ENFORCEMENT_BASIS (409).

  - name: enforcement_fine_amount
    trigger: "POST /licensing/enforcement-actions, immediately after enforcement_ladder_step fixes basis_points. fine_amount_cents is frozen on the row and is not recomputed at issue or effectuate."
    algorithm: tiered_pricing
    formula: |
      gross = FINE_BASE_CENTS[action_type] + PER_POINT_CENTS * basis_points

      tier  = "T1" IF gross < FINE_TIER_T2_FLOOR
              "T2" IF FINE_TIER_T2_FLOOR <= gross < FINE_TIER_T3_FLOOR
              "T3" IF gross >= FINE_TIER_T3_FLOOR

      surcharge_cents   = round_half_up(gross * SURCHARGE_PCT[tier], 0)
      net_before_credit = gross + surcharge_cents
      credit_cents      = round_half_up(net_before_credit * CREDIT_PCT[tier], 0)
      fine_amount_cents = net_before_credit - credit_cents

      # NORMATIVE: `tier` is derived ONCE, from `gross`, and the SAME tier drives
      # both SURCHARGE_PCT and CREDIT_PCT. Re-deriving the tier from
      # net_before_credit (which the surcharge may have pushed across a floor)
      # is wrong.
    input_set: "One EnforcementAction row: its action_type and its frozen basis_points."
    constants:
      FINE_BASE_CENTS: { WARNING: 0, PROBATION: 50000, SUSPENSION: 150000, REVOCATION: 500000 }
      PER_POINT_CENTS: 2500
      FINE_TIER_T2_FLOOR: 100000
      FINE_TIER_T3_FLOOR: 300000
      SURCHARGE_PCT: { T1: 0.00, T2: 0.10, T3: 0.20 }
      CREDIT_PCT: { T1: 0.00, T2: 0.05, T3: 0.15 }
    precision: "integer cents; each of surcharge_cents and credit_cents is rounded round_half_up to 0 decimals independently"
    worked_literals: |
      action_type = SUSPENSION, basis_points = 50:
        gross             = 150000 + 2500*50 = 275000
        tier              = T2            (100000 <= 275000 < 300000)
        surcharge_cents   = 27500
        net_before_credit = 302500
        credit_cents      = round_half_up(302500 * 0.05) = 15125
        fine_amount_cents = 287375
      A wrong implementation that re-tiers on net_before_credit (302500 >= 300000
      -> T3 -> 15% credit = 45375) returns 257125.
      action_type = WARNING, basis_points = 15:
        gross = 0 + 37500 = 37500 -> tier T1 -> surcharge 0 -> credit 0
        fine_amount_cents = 37500

  - name: ratio_group_size_supervision_verification
    trigger: |
      POST /licensing/age-group-rosters (initial derivation),
      PATCH /licensing/age-group-rosters/{roster_id} (enrolment or staffing change),
      POST /licensing/age-group-rosters/{roster_id}/verify-ratio (explicit
      verification that also enforces the three compliance flags), and as a
      cascade effect whenever a lead's clearance is revoked.
    algorithm: constraint_propagation
    formula: |
      required_staff_count = ceil(enrolled_count / AGE_GROUP_RATIO[age_group])

      ratio_compliant      = staff_assigned_count >= required_staff_count

      effective_group_cap  = min(approved_group_size, AGE_GROUP_MAX_SIZE[age_group])
      group_size_compliant = enrolled_count <= effective_group_cap

      supervision_compliant =
            lead_staff_member_id IS NOT NULL
        AND lead.clearance_status == "CLEARED"
        AND lead.supervision_eligible == true
        AND lead.member_type IN {DIRECTOR, LEAD_TEACHER}
        AND age_group IN lead.qualified_age_groups

      # Propagation: a change to any one of enrolled_count, staff_assigned_count,
      # approved_group_size, or the lead's clearance re-derives all three flags on
      # this roster, then re-derives Provider.licensed_capacity consistency
      # (sum of approved_group_size across the provider's rosters must remain
      # <= Provider.licensed_capacity), then re-derives nothing further — the
      # propagation reaches a fixed point in exactly two hops and cannot loop.
    input_set: "One AgeGroupRoster plus the StaffMember named by lead_staff_member_id. Rosters of other providers and other age groups are never read."
    constants:
      AGE_GROUP_RATIO: { INFANT: 4, TODDLER: 6, PRESCHOOL: 10, SCHOOL_AGE: 15 }
      AGE_GROUP_MAX_SIZE: { INFANT: 8, TODDLER: 12, PRESCHOOL: 20, SCHOOL_AGE: 30 }
    precision: "integer counts; ceil is used for required_staff_count so a single extra child adds a whole staff member"
    worked_literals: |
      INFANT roster, approved_group_size 8:
        enrolled_count 0  -> ceil(0/4) = 0 -> ratio_compliant is TRUE with
          staff_assigned_count 0 (the empty-room boundary: zero children require
          zero staff, and verify-ratio returns 200).
        enrolled_count 1  -> ceil(1/4) = 1 -> with staff_assigned_count 0,
          verify-ratio is rejected with ERR_RATIO_NONCOMPLIANT (409).
        enrolled_count 4, staff 1 -> ceil(4/4) = 1 -> compliant.
        enrolled_count 5, staff 1 -> ceil(5/4) = 2 -> ERR_RATIO_NONCOMPLIANT.
        enrolled_count 9, approved_group_size 8 -> group_size_compliant false ->
          ERR_GROUP_SIZE_EXCEEDED (409); note enrolled 9 also exceeds
          AGE_GROUP_MAX_SIZE[INFANT] = 8, so a roster may not raise
          approved_group_size above 8 for infants at all.

  - name: complaint_priority_and_deadline
    trigger: "POST /licensing/complaints, and again nowhere — priority and investigation_due_at are frozen at intake."
    algorithm: lookup_matrix
    formula: |
      age_band = "INFANT_TODDLER" IF affected_age_group IN {INFANT, TODDLER}
                 ELSE "OLDER"

      base_priority = COMPLAINT_PRIORITY_MATRIX[allegation_category][age_band]

      # Conditional escalation on the provider's standing at intake:
      priority = escalate(base_priority) IF Provider.license_status IN {PROBATION, SUSPENDED}
                 ELSE base_priority
      where escalate: P3 -> P2, P2 -> P1, P1 -> P1

      investigation_due_at = received_at + DETERMINATION_DAYS[priority] days
      # received_at is the logical clock at intake.
    input_set: "The submitted allegation_category and affected_age_group, plus the target Provider's license_status at intake."
    constants:
      COMPLAINT_PRIORITY_MATRIX:
        ABUSE:       { INFANT_TODDLER: P1, OLDER: P1 }
        SUPERVISION: { INFANT_TODDLER: P1, OLDER: P2 }
        RATIO:       { INFANT_TODDLER: P2, OLDER: P3 }
        BACKGROUND:  { INFANT_TODDLER: P2, OLDER: P2 }
        FACILITY:    { INFANT_TODDLER: P2, OLDER: P3 }
        NUTRITION:   { INFANT_TODDLER: P2, OLDER: P3 }
        RECORDS:     { INFANT_TODDLER: P3, OLDER: P3 }
      DETERMINATION_DAYS: { P1: 30, P2: 45, P3: 60 }
    precision: "whole days added to an instant, preserving the time-of-day component exactly"
    worked_literals: |
      Clock 2026-08-10T00:00:00Z throughout.
        SUPERVISION + PRESCHOOL, provider FULL       -> P2, due 2026-09-24T00:00:00Z
        SUPERVISION + INFANT,    provider FULL       -> P1, due 2026-09-09T00:00:00Z
        SUPERVISION + PRESCHOOL, provider PROBATION  -> P1, due 2026-09-09T00:00:00Z
        RECORDS     + SCHOOL_AGE, provider FULL      -> P3, due 2026-10-09T00:00:00Z
        RECORDS     + SCHOOL_AGE, provider PROBATION -> P2, due 2026-09-24T00:00:00Z
        ABUSE       + PRESCHOOL, provider PROBATION  -> P1 (escalation is a no-op
        at P1), due 2026-09-09T00:00:00Z

  - name: incident_reporting_deadline
    trigger: "POST /licensing/serious-incident-reports."
    algorithm: threshold
    formula: |
      reported_at           = the logical clock at submission
      reporting_deadline_at = occurred_at + INCIDENT_REPORT_WINDOW_HOURS[incident_type] hours
      reporting_timeliness  = "TIMELY" IF reported_at <= reporting_deadline_at
                              ELSE "LATE_REPORT"
      # Upper edge INCLUSIVE: reporting at exactly the deadline instant is TIMELY.
      # occurred_at > reported_at is rejected with ERR_INCIDENT_OCCURRED_IN_FUTURE.
    input_set: "One submitted report: its incident_type and occurred_at, against the logical clock."
    constants:
      INCIDENT_REPORT_WINDOW_HOURS:
        FATALITY: 2
        MISSING_CHILD: 2
        SERIOUS_INJURY: 24
        MEDICATION_ERROR: 24
        COMMUNICABLE_DISEASE: 72
    precision: "whole hours; comparison is on the exact instant with second resolution"
    worked_literals: |
      occurred_at 2026-08-05T00:00:00Z, incident_type SERIOUS_INJURY (24h):
        reporting_deadline_at = 2026-08-06T00:00:00Z
        clock 2026-08-06T00:00:00Z -> TIMELY (boundary, inclusive)
        clock 2026-08-06T00:00:01Z -> LATE_REPORT
      occurred_at 2026-08-05T10:00:00Z, incident_type FATALITY (2h):
        reporting_deadline_at = 2026-08-05T12:00:00Z
        clock 2026-08-05T12:00:01Z -> LATE_REPORT

  - name: correction_due_date
    trigger: "Whenever a Violation row is created, immediately after violation_point_assessment."
    algorithm: chronological
    formula: |
      cited_at            = the logical clock at citation
      correction_due_date = cited_at + CORRECTION_DAYS[effective_severity] days
      # Severity, not points, drives the deadline: a repeat MODERATE violation
      # assessed at 8 points still gets 30 days, while a first CRITICAL assessed
      # at 15 points gets 3.
    input_set: "One Violation row and its effective_severity."
    constants:
      CORRECTION_DAYS: { CRITICAL: 3, SERIOUS: 10, MODERATE: 30, MINOR: 45 }
    precision: "whole days added to the citation instant"
    worked_literals: |
      cited_at 2026-08-10T09:00:00Z:
        CRITICAL -> 2026-08-13T09:00:00Z
        SERIOUS  -> 2026-08-20T09:00:00Z
        MODERATE -> 2026-09-09T09:00:00Z
        MINOR    -> 2026-09-24T09:00:00Z

  - name: corrective_action_due_date
    trigger: "POST /licensing/corrective-action-plans and POST /licensing/corrective-action-plans/{cap_id}/resubmit."
    algorithm: chronological
    formula: |
      submission_window_end = inspection.finalized_at + CAP_SUBMISSION_WINDOW_DAYS days
      IF now > submission_window_end -> reject with ERR_CAP_WINDOW_CLOSED
      # Upper edge INCLUSIVE: submitting at exactly submission_window_end is accepted.

      due_at = now + min( CORRECTION_DAYS[v.effective_severity]
                          FOR v IN the plan's violation_ids ) days
      # The STRICTEST member deadline governs the whole plan, so adding a MINOR
      # violation to a plan that already contains a CRITICAL one cannot extend it.
      # violation_ids must be non-empty and every member must belong to
      # inspection_id (else ERR_VIOLATION_INSPECTION_MISMATCH).
    input_set: "The plan's violation_ids and their effective severities, plus the parent Inspection's finalized_at."
    constants:
      CAP_SUBMISSION_WINDOW_DAYS: 10
      CORRECTION_DAYS: { CRITICAL: 3, SERIOUS: 10, MODERATE: 30, MINOR: 45 }
      CAP_MAX_REVIEW_CYCLES: 3
    precision: "whole days added to the submission instant"
    worked_literals: |
      inspection.finalized_at 2026-08-10T09:00:00Z ->
        submission_window_end 2026-08-20T09:00:00Z.
        Submitting at clock 2026-08-20T09:00:00Z is accepted; at
        2026-08-20T09:00:01Z it is rejected with ERR_CAP_WINDOW_CLOSED.
      Plan submitted at 2026-08-12T09:00:00Z over {CRITICAL, MODERATE, MINOR}:
        min(CORRECTION_DAYS) = 3 -> due_at 2026-08-15T09:00:00Z.
      Plan submitted at the same instant over {MODERATE, MINOR}:
        min = 30 -> due_at 2026-09-11T09:00:00Z.

  - name: provider_clearance_completeness
    trigger: |
      Recomputed whenever a BackgroundCheck result, waiver decision, or
      StaffMember creation changes the provider's clearance picture, and read as
      a precondition by POST /licensing/providers/{provider_id}/clear-checks and
      by POST /licensing/inspections/{inspection_id}/finalize.
    algorithm: aggregation
    formula: |
      FOR EACH StaffMember s of the provider (all of them — this domain has no
      separation state, so every attached person counts):
        covered_types(s) = { c.check_type FOR c IN s.background_checks
                             WHERE c.status IN {CLEARED, WAIVED}
                               AND (c.expires_at IS NULL OR c.expires_at > now) }
        s_ok = (REQUIRED_CHECK_TYPES SUBSET OF covered_types(s))
               AND s.clearance_status == "CLEARED"

      has_director = EXISTS s WHERE s.member_type == "DIRECTOR"

      Provider.clearance_complete = has_director AND (s_ok is true FOR EVERY s)
    input_set: "Every StaffMember of the provider and every BackgroundCheck of those staff members. An expired clearance (expires_at <= now) stops counting, so a provider can lose clearance_complete purely by the clock advancing."
    constants:
      REQUIRED_CHECK_TYPES: [FBI_FINGERPRINT, CHILD_ABUSE_REGISTRY]
      CLEARANCE_VALIDITY_MONTHS: 60
    precision: "boolean; the expiry comparison uses a strict > so a check expiring exactly at now no longer counts"
    worked_literals: |
      One DIRECTOR with FBI_FINGERPRINT CLEARED and CHILD_ABUSE_REGISTRY CLEARED,
      both decided at 2026-08-01T00:00:00Z -> expires_at 2031-08-01T00:00:00Z ->
      clearance_complete = true.
      Adding a second StaffMember (ASSISTANT) with no checks flips
      clearance_complete to false, even though the director is fully cleared.
      Setting the clock to 2031-08-01T00:00:00Z (expires_at == now, strict >
      fails) flips it back to false.

  - name: inspector_schedule_conflict_window
    trigger: "POST /licensing/inspections, before any other business check on the requested window."
    algorithm: interval_merge
    formula: |
      new.visit_window_end = new.scheduled_for + new.duration_minutes minutes

      active_set = Inspection WHERE status IN {SCHEDULED, IN_PROGRESS}
                   (VOIDED, PENDING_REVIEW and FINALIZED inspections release
                    their windows and never conflict)

      # (1) INSPECTOR occupancy — HALF-OPEN interval [start, end):
      inspector_window(I) = [ I.scheduled_for, I.visit_window_end )
      conflict_inspector  = EXISTS J IN active_set
                              WHERE J.inspector_id == new.inspector_id
                                AND inspector_window(J) INTERSECTS inspector_window(new)
                            -> ERR_INSPECTOR_DOUBLE_BOOKED
      # Back-to-back visits therefore DO fit: a visit ending at 11:00 and one
      # starting at 11:00 do not intersect.

      # (2) PROVIDER occupancy — CLOSED interval, buffered on BOTH sides:
      provider_window(I) = [ I.scheduled_for - PROVIDER_VISIT_BUFFER_MINUTES,
                             I.visit_window_end + PROVIDER_VISIT_BUFFER_MINUTES ]
      conflict_provider  = EXISTS J IN active_set
                             WHERE J.provider_id == new.provider_id
                               AND provider_window(J) INTERSECTS provider_window(new)
                           -> ERR_PROVIDER_VISIT_BUFFER_CONFLICT
      # Because both edges are INCLUSIVE, two buffered windows that merely touch
      # at a single instant DO conflict.

      # (3) INSPECTOR daily load — calendar-day count, unrelated to intervals:
      same_day_count = COUNT(J IN active_set
                             WHERE J.inspector_id == new.inspector_id
                               AND date_utc(J.scheduled_for) == date_utc(new.scheduled_for))
      IF same_day_count >= inspector.max_daily_visits
         -> ERR_INSPECTOR_DAILY_LIMIT_REACHED
    input_set: "All Inspections in status SCHEDULED or IN_PROGRESS that share the requested inspector_id or the requested provider_id."
    constants:
      PROVIDER_VISIT_BUFFER_MINUTES: 60
    precision: "instants at second resolution; interval edge semantics are normative and differ between the two resources (half-open for the inspector, closed for the provider)"
    worked_literals: |
      Existing SCHEDULED inspection E: inspector X, provider A,
      scheduled_for 2026-08-05T09:00:00Z, duration 120 -> window_end 11:00:00Z.
        inspector_window(E) = [09:00, 11:00)
        provider_window(E)  = [08:00, 12:00]

      (a) New: inspector X, provider B, 2026-08-05T11:00:00Z, 120 min.
          [11:00, 13:00) does NOT intersect [09:00, 11:00) -> accepted (201).
      (b) New: inspector X, provider B, 2026-08-05T10:59:59Z, 120 min.
          intersects -> ERR_INSPECTOR_DOUBLE_BOOKED (409).
      (c) New: inspector Y, provider A, 2026-08-05T13:00:00Z, 120 min.
          provider_window(new) = [12:00, 16:00]; [08:00,12:00] and [12:00,16:00]
          share the instant 12:00 and both edges are inclusive ->
          ERR_PROVIDER_VISIT_BUFFER_CONFLICT (409).
      (d) New: inspector Y, provider A, 2026-08-05T13:00:01Z, 120 min.
          provider_window(new) = [12:00:01, 16:00:01] -> no shared instant ->
          accepted (201).
      Cases (a) and (c) use the same 2-hour gap arithmetic and diverge only
      because the two resources use different edge semantics.

  - name: public_display_score
    trigger: "POST /licensing/public-report-postings/{posting_id}/post and every POST .../revise with action = CORRECT."
    algorithm: weighted_scoring
    formula: |
      banner = POSTING_BANNER_BY_STEP[Provider.current_ladder_step]

      display_score = round_half_up(
            max(0, inspection.final_compliance_score
                   - POSTING_BANNER_PENALTY[banner]), 2)

      enforcement_banner = banner
      # The posting reads the provider's ladder state at POST/CORRECT time, not at
      # inspection time, so correcting a posting after an enforcement action
      # became effective lowers the displayed score without touching the
      # inspection's own final_compliance_score.
    input_set: "One PublicReportPosting, its Inspection's current final_compliance_score, and its Provider's current_ladder_step."
    constants:
      POSTING_BANNER_BY_STEP: { 0: NONE, 1: WARNING, 2: PROBATION, 3: SUSPENSION, 4: REVOCATION }
      POSTING_BANNER_PENALTY: { NONE: 0.00, WARNING: 2.00, PROBATION: 5.00, SUSPENSION: 10.00, REVOCATION: 20.00 }
      POSTING_RETENTION_MONTHS: 36
      POSTING_MAX_CORRECTIONS: 2
    precision: "2 decimal places, round_half_up, floored at 0"
    worked_literals: |
      final_compliance_score 37.34, current_ladder_step 0 -> banner NONE ->
        display_score 37.34.
      Same inspection after a PROBATION action became effective
      (current_ladder_step 2) and the posting is CORRECTed -> banner PROBATION ->
        display_score 32.34.
      final_compliance_score 8.00 with current_ladder_step 4 -> 8.00 - 20.00 =
        -12.00 -> floored -> display_score 0.00.

  - name: violation_point_conservation
    trigger: "Enforced after every Violation creation and every violation disposition, and re-asserted after CAP completion and after the substantiated-complaint cascade."
    algorithm: aggregation
    formula: |
      open_violation_points     = SUM(v.assessed_points) OVER the provider's Violations
                                  WHERE v.status IN {CITED, CORRECTION_PENDING, UNCORRECTED}
      resolved_violation_points = SUM(v.assessed_points) OVER the provider's Violations
                                  WHERE v.status == VERIFIED_CORRECTED
      lifetime_violation_points = open_violation_points + resolved_violation_points

      INVARIANT (must hold after every mutation):
        lifetime_violation_points == open_violation_points + resolved_violation_points
      and VACATED violations contribute to NONE of the three sums.

      Per-transition bookkeeping:
        cite                       : open += a ; lifetime += a
        -> VERIFIED_CORRECTED      : open -= a ; resolved += a ; lifetime unchanged
        -> UNCORRECTED             : no change (still open)
        -> VACATED (from CITED /
           CORRECTION_PENDING /
           UNCORRECTED)            : open -= a ; lifetime -= a ; resolved unchanged
      A cite followed by a vacate therefore restores all three counters to their
      exact pre-cite values — the compensation leaves no residue.
    input_set: "All Violations reachable from the provider through their parent Inspection, excluding inspections in status VOIDED (a voided inspection's violations are discarded and contribute nothing)."
    constants:
      COUNTED_OPEN_STATUSES: [CITED, CORRECTION_PENDING, UNCORRECTED]
      COUNTED_RESOLVED_STATUSES: [VERIFIED_CORRECTED]
      COUNTED_NOWHERE_STATUSES: [VACATED]
    precision: "integer points; the three provider counters are maintained incrementally but must always agree with a full recomputation"
    worked_literals: |
      Start (0, 0, 0). Cite CRITICAL/PRESCHOOL (15) -> (15, 0, 15).
      Cite SERIOUS/TODDLER (8) -> (23, 0, 23).
      Disposition the CRITICAL to VERIFIED_CORRECTED -> (8, 15, 23).
      Disposition the SERIOUS to VACATED -> (0, 15, 15).
      Invariant holds at every step: 15 == 0 + 15.

  - name: capacity_slot_conservation
    trigger: "Enforced at enforcement effectuate (SUSPENSION / REVOCATION), at appeal-decision VACATED, and at every capacity-changing LicenseAmendment approval."
    algorithm: aggregation
    formula: |
      total_authorized_slots = Provider.licensed_capacity + Provider.suspended_capacity

      INVARIANT: total_authorized_slots is changed ONLY by an APPROVED
      CAPACITY_CHANGE LicenseAmendment (by exactly effective_capacity_delta) and
      by the REVOCATION effectuate (which zeroes it deliberately and permanently).
      Every SUSPENSION effectuate and every appeal-decision VACATED merely MOVES
      slots between the two fields:
        SUSPENSION effectuate : held = licensed_capacity
                                suspended_capacity += held ; licensed_capacity = 0
                                action.capacity_held_slots = held
        appeal VACATED        : licensed_capacity += action.capacity_held_slots
                                suspended_capacity -= action.capacity_held_slots
                                action.capacity_held_slots = 0
      Any operation that would leave suspended_capacity < 0, or leave
      licensed_capacity + suspended_capacity different from its pre-operation
      value on a SUSPENSION or appeal path, is rejected with
      ERR_CAPACITY_SLOT_IMBALANCE.
      Ceiling check (applies only to amendments):
        licensed_capacity + suspended_capacity + effective_capacity_delta
          <= PROGRAM_CAPACITY_CEILING[Provider.program_type]   (inclusive)
        else ERR_CAPACITY_CEILING_EXCEEDED.
    input_set: "One Provider's two capacity fields plus the capacity_held_slots of the EnforcementAction being effectuated or appealed."
    constants:
      PROGRAM_CAPACITY_CEILING: { CENTER: 120, GROUP_HOME: 40, FAMILY_HOME: 12 }
    precision: "integer slots; no rounding is involved"
    worked_literals: |
      CENTER provider, licensed_capacity 60, suspended_capacity 0
      (total_authorized_slots 60).
        SUSPENSION effectuate -> licensed 0, suspended 60, held 60; total 60.
        appeal filed          -> licensed 0, suspended 60; total 60 (unchanged).
        appeal VACATED        -> licensed 60, suspended 0, held 0; total 60,
                                 license_status PROBATION (never FULL).
      A CAPACITY_CHANGE amendment with effective_capacity_delta +61 on the same
      provider is rejected: 60 + 0 + 61 = 121 > 120 ->
      ERR_CAPACITY_CEILING_EXCEEDED; +60 is accepted (120 <= 120).

# =========================================================================
# §1.4 Validation Rules (evaluated in ascending priority; the first violated
#      rule determines the response, and no later rule is evaluated)
# =========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-blank (a header sent as an empty string, or omitted entirely, both fail here)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /licensing/providers"

  - priority: 2
    category: auth
    check: "X-User-Role header is present and names one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the declared X-User-Role is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "for entity-backed roles the X-User-ID resolves: Applicant -> an existing Provider.id; LicensingInspector and ComplaintInvestigator -> an existing Inspector.id"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints whose roles include Applicant, LicensingInspector, or ComplaintInvestigator, EXCEPT POST /licensing/providers (where the Applicant identity does not yet exist)"

  - priority: 6
    category: existence
    check: "the request body contains no unknown keys and every non-optional input field is present and of the declared type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 7
    category: existence
    check: "every enum-typed input value is a member of that field's declared constraint set"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 10
    category: existence
    check: "every templated path segment resolves to an existing row, validated left-to-right, returning that entity's own NOT_FOUND error (ERR_PROVIDER_NOT_FOUND, ERR_INSPECTOR_NOT_FOUND, ERR_STAFF_MEMBER_NOT_FOUND, ERR_BACKGROUND_CHECK_NOT_FOUND, ERR_ROSTER_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_VIOLATION_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_CAP_NOT_FOUND, ERR_ENFORCEMENT_ACTION_NOT_FOUND, ERR_AMENDMENT_NOT_FOUND, ERR_INCIDENT_REPORT_NOT_FOUND, ERR_POSTING_NOT_FOUND, ERR_CHECKLIST_ITEM_NOT_FOUND)"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a templated path segment"

  - priority: 12
    category: existence
    check: "every FK supplied in the request body resolves to an existing row, validated in the order the fields are declared in §1.5 input:, returning the referenced entity's NOT_FOUND error"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "all POST and PATCH endpoints that accept an FK field"

  - priority: 15
    category: auth
    check: "an Applicant's X-User-ID equals the provider_id that owns the target resource (directly for Provider paths, transitively through provider_id for StaffMember, BackgroundCheck, AgeGroupRoster, CorrectiveActionPlan, EnforcementAction and LicenseAmendment paths); a ComplaintInvestigator's X-User-ID equals the target Complaint.assigned_investigator_id; a LicensingInspector's X-User-ID equals the target Inspection.inspector_id"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "all mutating endpoints whose roles include Applicant, LicensingInspector, or ComplaintInvestigator"

  - priority: 18
    category: auth
    check: |
      Segregation of duties, both directions:
      (a) POST /licensing/complaints/{complaint_id}/assign-investigator — the
          proposed investigator must NOT have finalized any Inspection of that
          complaint's provider within SEGREGATION_LOOKBACK_MONTHS (12, lower edge
          exclusive);
      (b) POST /licensing/enforcement-actions/{action_id}/issue — the issuing
          X-User-ID must NOT be the reviewed_by_user_id of any
          CorrectiveActionPlan whose inspection_id equals the action's
          source_inspection_id and whose status IN {APPROVED, COMPLETED, FAILED};
      (c) POST /licensing/enforcement-actions/{action_id}/appeal-decision — the
          deciding X-User-ID must NOT equal the action's issued_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /licensing/complaints/{complaint_id}/assign-investigator, POST /licensing/enforcement-actions/{action_id}/issue, POST /licensing/enforcement-actions/{action_id}/appeal-decision"

  - priority: 20
    category: state
    check: "expected_provider_version equals the target Provider's current version (concurrency_rules[amendment-create-stale-provider])"
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
    applies_to: "POST /licensing/license-amendments"

  - priority: 21
    category: state
    check: "expected_inspection_version equals the target Inspection's current version (concurrency_rules[cap-submit-stale-inspection])"
    error_id: ERR_STALE_INSPECTION_VERSION
    http_status: 412
    applies_to: "POST /licensing/corrective-action-plans"

  - priority: 40
    category: state
    check: "Provider.application_status is in the transition's declared from-set"
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "POST /licensing/providers/{provider_id}/submit-application, POST /licensing/providers/{provider_id}/clear-checks, POST /licensing/providers/{provider_id}/license-decision"

  - priority: 41
    category: state
    check: "Provider.license_status is in the transition's declared from-set"
    error_id: ERR_INVALID_LICENSE_STATE
    http_status: 409
    applies_to: "POST /licensing/providers/{provider_id}/promote-to-full, POST /licensing/providers/{provider_id}/restore-full, POST /licensing/enforcement-actions/{action_id}/effectuate"

  - priority: 42
    category: state
    check: "the target Inspection is in the state the operation requires (SCHEDULED for start, IN_PROGRESS for submit-for-review, PENDING_REVIEW for reopen and finalize, FINALIZED for CAP submission / amendment attachment / posting creation, SCHEDULED or IN_PROGRESS for void)"
    error_id: ERR_INVALID_INSPECTION_STATE
    http_status: 409
    applies_to: "POST /licensing/inspections/{inspection_id}/start, .../submit-for-review, .../reopen, .../finalize, .../void, POST /licensing/violations, POST /licensing/corrective-action-plans, POST /licensing/public-report-postings, POST /licensing/license-amendments/{amendment_id}/attach-inspection"

  - priority: 43
    category: state
    check: "the target Violation is in a dispositionable state (CITED or CORRECTION_PENDING for VERIFIED_CORRECTED / UNCORRECTED; CITED, CORRECTION_PENDING or UNCORRECTED for VACATED), and every violation named in a CAP completion is already VERIFIED_CORRECTED or VACATED"
    error_id: ERR_INVALID_VIOLATION_STATE
    http_status: 409
    applies_to: "POST /licensing/violations/{violation_id}/disposition, POST /licensing/corrective-action-plans/{cap_id}/complete"

  - priority: 44
    category: state
    check: "the target Complaint is in the state the operation requires (RECEIVED for screen, SCREENED_IN for assign-investigator, UNDER_INVESTIGATION for determination, DETERMINED for close), and an incident report's generated Complaint is CLOSED or SCREENED_OUT before the report may close"
    error_id: ERR_INVALID_COMPLAINT_STATE
    http_status: 409
    applies_to: "POST /licensing/complaints/{complaint_id}/screen, .../assign-investigator, .../determination, .../close, POST /licensing/serious-incident-reports/{report_id}/close"

  - priority: 45
    category: state
    check: "the target CorrectiveActionPlan is in the state the operation requires (SUBMITTED for review, REJECTED for resubmit, APPROVED for complete)"
    error_id: ERR_INVALID_CAP_STATE
    http_status: 409
    applies_to: "POST /licensing/corrective-action-plans/{cap_id}/review, .../resubmit, .../complete"

  - priority: 46
    category: state
    check: "the target EnforcementAction is in the state the operation requires (PROPOSED for issue, ISSUED for effectuate, EFFECTIVE for appeal, APPEALED for appeal-decision)"
    error_id: ERR_INVALID_ENFORCEMENT_STATE
    http_status: 409
    applies_to: "POST /licensing/enforcement-actions/{action_id}/issue, .../effectuate, .../appeal, .../appeal-decision"

  - priority: 47
    category: state
    check: "the target LicenseAmendment is in the state the operation requires (PRE_INSPECTION_REQUIRED for attach-inspection, SUBMITTED for decide, SUBMITTED or PRE_INSPECTION_REQUIRED for withdraw)"
    error_id: ERR_INVALID_AMENDMENT_STATE
    http_status: 409
    applies_to: "POST /licensing/license-amendments/{amendment_id}/attach-inspection, .../decide, .../withdraw"

  - priority: 48
    category: state
    check: "the target SeriousIncidentReport is in the state the operation requires (REPORTED for review, UNDER_REVIEW or INVESTIGATION_OPENED for close)"
    error_id: ERR_INVALID_INCIDENT_STATE
    http_status: 409
    applies_to: "POST /licensing/serious-incident-reports/{report_id}/review, .../close"

  - priority: 49
    category: state
    check: "the target PublicReportPosting is in the state the operation requires (PENDING_REDACTION for post, POSTED or CORRECTED for revise)"
    error_id: ERR_INVALID_POSTING_STATE
    http_status: 409
    applies_to: "POST /licensing/public-report-postings/{posting_id}/post, .../revise"

  - priority: 50
    category: state
    check: "the target BackgroundCheck is in the state the operation requires (SUBMITTED for result, DISQUALIFIED for waiver, WAIVER_PENDING for waiver-decision)"
    error_id: ERR_INVALID_CHECK_STATE
    http_status: 409
    applies_to: "POST /licensing/background-checks/{check_id}/result, .../waiver, .../waiver-decision"

  - priority: 51
    category: state
    check: "the inspection referenced by an operation has the inspection_type the operation requires (AMENDMENT_PRE_MOVE for amendment attachment; COMPLAINT for the substantiated-determination cascade target)"
    error_id: ERR_INVALID_INSPECTION_TYPE
    http_status: 409
    applies_to: "POST /licensing/license-amendments/{amendment_id}/attach-inspection"

  # ---- Business group (a): safety / compliance / regulatory ----------------
  - priority: 55
    category: business_safety
    check: "Provider.clearance_complete == true (every attached StaffMember covers REQUIRED_CHECK_TYPES with unexpired CLEARED/WAIVED checks, and a DIRECTOR exists)"
    error_id: ERR_CLEARANCE_INCOMPLETE
    http_status: 409
    applies_to: "POST /licensing/providers/{provider_id}/clear-checks, POST /licensing/inspections/{inspection_id}/finalize, POST /licensing/providers/{provider_id}/license-decision"

  - priority: 56
    category: business_safety
    check: "the BackgroundCheck's disqualifying_offense_tier != TIER_1_PERMANENT — a permanent bar can never enter the waiver path"
    error_id: ERR_PERMANENT_BAR_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /licensing/background-checks/{check_id}/waiver"

  - priority: 57
    category: business_safety
    check: "a roster's lead_staff_member_id names a StaffMember whose clearance_status == CLEARED, supervision_eligible == true, member_type IN {DIRECTOR, LEAD_TEACHER}, and whose qualified_age_groups contains the roster's age_group"
    error_id: ERR_SUPERVISION_INELIGIBLE_LEAD
    http_status: 409
    applies_to: "POST /licensing/age-group-rosters, PATCH /licensing/age-group-rosters/{roster_id}, POST /licensing/age-group-rosters/{roster_id}/verify-ratio"

  - priority: 58
    category: business_safety
    check: "Provider.critical_open_count == 0 — no CRITICAL violation may still be CITED, CORRECTION_PENDING or UNCORRECTED"
    error_id: ERR_UNRESOLVED_CRITICAL_VIOLATION
    http_status: 409
    applies_to: "POST /licensing/providers/{provider_id}/promote-to-full, POST /licensing/providers/{provider_id}/restore-full, POST /licensing/license-amendments/{amendment_id}/decide (capacity increases only)"

  - priority: 59
    category: business_safety
    check: "staff_assigned_count >= ceil(enrolled_count / AGE_GROUP_RATIO[age_group])"
    error_id: ERR_RATIO_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /licensing/age-group-rosters/{roster_id}/verify-ratio, PATCH /licensing/age-group-rosters/{roster_id}"

  - priority: 60
    category: business_safety
    check: "enrolled_count <= min(approved_group_size, AGE_GROUP_MAX_SIZE[age_group]), and requested_group_size <= AGE_GROUP_MAX_SIZE[age_group] at creation"
    error_id: ERR_GROUP_SIZE_EXCEEDED
    http_status: 409
    applies_to: "POST /licensing/age-group-rosters, PATCH /licensing/age-group-rosters/{roster_id}, POST /licensing/age-group-rosters/{roster_id}/verify-ratio"

  - priority: 61
    category: business_safety
    check: "a Complaint whose computed priority is P1 may not be screened out"
    error_id: ERR_P1_CANNOT_BE_SCREENED_OUT
    http_status: 409
    applies_to: "POST /licensing/complaints/{complaint_id}/screen"

  - priority: 62
    category: business_safety
    check: "a SeriousIncidentReport whose incident_type IN {FATALITY, MISSING_CHILD} may not be dispositioned MONITOR"
    error_id: ERR_INCIDENT_REQUIRES_INVESTIGATION
    http_status: 409
    applies_to: "POST /licensing/serious-incident-reports/{report_id}/review"

  - priority: 63
    category: business_safety
    check: "no Complaint of the posting's provider is in status UNDER_INVESTIGATION at the moment of posting"
    error_id: ERR_POSTING_BLOCKED_OPEN_INVESTIGATION
    http_status: 409
    applies_to: "POST /licensing/public-report-postings/{posting_id}/post"

  - priority: 64
    category: business_safety
    check: "redaction_complete == true before a report is made public"
    error_id: ERR_REDACTION_INCOMPLETE
    http_status: 409
    applies_to: "POST /licensing/public-report-postings/{posting_id}/post"

  # ---- Business group (b1): temporal constraints ---------------------------
  - priority: 66
    category: business_temporal
    check: "the requested half-open window [scheduled_for, visit_window_end) does not intersect any SCHEDULED or IN_PROGRESS inspection window of the same inspector"
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /licensing/inspections"

  - priority: 67
    category: business_temporal
    check: "the requested closed buffered window [scheduled_for - 60m, visit_window_end + 60m] does not intersect the same buffered window of any SCHEDULED or IN_PROGRESS inspection of the same provider"
    error_id: ERR_PROVIDER_VISIT_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /licensing/inspections"

  - priority: 68
    category: business_temporal
    check: "scheduled_for is strictly after the logical clock"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /licensing/inspections"

  - priority: 69
    category: business_temporal
    check: "occurred_at is not after the logical clock"
    error_id: ERR_INCIDENT_OCCURRED_IN_FUTURE
    http_status: 422
    applies_to: "POST /licensing/serious-incident-reports"

  - priority: 70
    category: business_temporal
    check: "the logical clock is at or before appeal_deadline_at (issued_at + 15 days, inclusive)"
    error_id: ERR_APPEAL_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /licensing/enforcement-actions/{action_id}/appeal"

  - priority: 71
    category: business_temporal
    check: "the logical clock is at or before inspection.finalized_at + CAP_SUBMISSION_WINDOW_DAYS (10, inclusive) when submitting or resubmitting a plan, and strictly after cap.due_at when recording a FAILED completion"
    error_id: ERR_CAP_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /licensing/corrective-action-plans, POST /licensing/corrective-action-plans/{cap_id}/resubmit, POST /licensing/corrective-action-plans/{cap_id}/complete"

  - priority: 72
    category: business_temporal
    check: "the logical clock is at or after licensed_at + PROVISIONAL_PERIOD_MONTHS (6)"
    error_id: ERR_PROVISIONAL_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /licensing/providers/{provider_id}/promote-to-full"

  # ---- Business group (b2): non-temporal constraint satisfaction -----------
  - priority: 73
    category: business_constraint
    check: "repeat_of_violation_id, when supplied, names a Violation of the SAME provider with the SAME checklist_item_id whose created_at is within REPEAT_LOOKBACK_MONTHS (24, lower edge exclusive) of now and which is not itself VACATED"
    error_id: ERR_REPEAT_REFERENCE_INVALID
    http_status: 422
    applies_to: "POST /licensing/violations"

  - priority: 74
    category: business_constraint
    check: "target_age_groups (at scheduling) and age_groups_observed (at submit-for-review) are non-empty subsets of the assigned Inspector.certified_age_groups"
    error_id: ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP
    http_status: 409
    applies_to: "POST /licensing/inspections, POST /licensing/inspections/{inspection_id}/submit-for-review"

  - priority: 75
    category: business_constraint
    check: "the assigned Inspector.status == ACTIVE"
    error_id: ERR_INSPECTOR_ON_LEAVE
    http_status: 409
    applies_to: "POST /licensing/inspections, POST /licensing/complaints/{complaint_id}/assign-investigator"

  - priority: 76
    category: business_constraint
    check: "the inspector's count of SCHEDULED or IN_PROGRESS inspections on the same UTC calendar date is strictly below Inspector.max_daily_visits"
    error_id: ERR_INSPECTOR_DAILY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /licensing/inspections"

  - priority: 77
    category: business_constraint
    check: "review_cycle_count < CAP_MAX_REVIEW_CYCLES (3)"
    error_id: ERR_CAP_REVIEW_CYCLE_EXHAUSTED
    http_status: 409
    applies_to: "POST /licensing/corrective-action-plans/{cap_id}/resubmit"

  - priority: 78
    category: business_constraint
    check: "correction_count < POSTING_MAX_CORRECTIONS (2)"
    error_id: ERR_POSTING_CORRECTION_LIMIT
    http_status: 409
    applies_to: "POST /licensing/public-report-postings/{posting_id}/revise"

  - priority: 79
    category: business_constraint
    check: "no other BackgroundCheck of the same staff_member_id and check_type exists in status IN {SUBMITTED, CLEARED, WAIVER_PENDING, WAIVED}"
    error_id: ERR_DUPLICATE_CHECK_TYPE
    http_status: 409
    applies_to: "POST /licensing/background-checks"

  - priority: 80
    category: business_constraint
    check: "the submitted outcome agrees with the cited violations: outcome must be FAIL when at least one non-VACATED CRITICAL violation is cited on the inspection, and must be PASS when no non-VACATED violation is cited at all"
    error_id: ERR_OUTCOME_SEVERITY_MISMATCH
    http_status: 409
    applies_to: "POST /licensing/inspections/{inspection_id}/submit-for-review"

  - priority: 81
    category: business_constraint
    check: "LADDER_STEP[requested action_type] <= LADDER_STEP[recommended action_type derived from Provider.open_violation_points]"
    error_id: ERR_LADDER_STEP_SKIP
    http_status: 409
    applies_to: "POST /licensing/enforcement-actions"

  - priority: 82
    category: business_constraint
    check: "Provider.open_violation_points >= WARNING_THRESHOLD (15) — below that there is no statutory basis for any enforcement action"
    error_id: ERR_NO_ENFORCEMENT_BASIS
    http_status: 409
    applies_to: "POST /licensing/enforcement-actions"

  - priority: 83
    category: business_constraint
    check: "no EnforcementAction of the provider is EFFECTIVE with action_type IN {SUSPENSION, REVOCATION}"
    error_id: ERR_ACTIVE_ENFORCEMENT_BLOCKS_AMENDMENT
    http_status: 409
    applies_to: "POST /licensing/license-amendments/{amendment_id}/decide"

  - priority: 84
    category: business_constraint
    check: "Provider.open_violation_points == 0 for promote-to-full, and Provider.open_violation_points < WARNING_THRESHOLD (15, strict <) for restore-full"
    error_id: ERR_OUTSTANDING_VIOLATION_POINTS
    http_status: 409
    applies_to: "POST /licensing/providers/{provider_id}/promote-to-full, POST /licensing/providers/{provider_id}/restore-full"

  # ---- Business group (b3): referential agreement between entities ---------
  - priority: 86
    category: business_referential
    check: "every violation_id in a CorrectiveActionPlan belongs to that plan's inspection_id, and a Violation's checklist_item_id / inspection_id pair is internally consistent (the violation's inspection belongs to the same provider as the plan)"
    error_id: ERR_VIOLATION_INSPECTION_MISMATCH
    http_status: 422
    applies_to: "POST /licensing/corrective-action-plans, POST /licensing/corrective-action-plans/{cap_id}/resubmit, POST /licensing/license-amendments/{amendment_id}/attach-inspection"

  - priority: 87
    category: business_referential
    check: "when determination = SUBSTANTIATED, a FINALIZED Inspection whose complaint_id equals the complaint exists to carry the auto-cited violation"
    error_id: ERR_COMPLAINT_INSPECTION_REQUIRED
    http_status: 409
    applies_to: "POST /licensing/complaints/{complaint_id}/determination"

  - priority: 88
    category: business_referential
    check: "an Inspection with inspection_type = COMPLAINT supplies a complaint_id whose provider_id matches the inspection's provider_id, and an inspection of any other type supplies no complaint_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /licensing/inspections"

  # ---- Business group (c): capacity / fiscal, evaluated last ---------------
  - priority: 90
    category: business_fiscal
    check: "licensed_capacity + suspended_capacity + effective_capacity_delta <= PROGRAM_CAPACITY_CEILING[program_type] (inclusive)"
    error_id: ERR_CAPACITY_CEILING_EXCEEDED
    http_status: 409
    applies_to: "POST /licensing/providers, POST /licensing/license-amendments/{amendment_id}/decide"

  - priority: 91
    category: business_fiscal
    check: "no operation may leave suspended_capacity negative or change licensed_capacity + suspended_capacity on a suspension or appeal path"
    error_id: ERR_CAPACITY_SLOT_IMBALANCE
    http_status: 409
    applies_to: "POST /licensing/enforcement-actions/{action_id}/effectuate, POST /licensing/enforcement-actions/{action_id}/appeal-decision"

  - priority: 92
    category: business_fiscal
    check: "the sum of approved_group_size across the provider's AgeGroupRosters does not exceed Provider.licensed_capacity (before licensure, requested_capacity)"
    error_id: ERR_ROSTER_CAPACITY_MISMATCH
    http_status: 409
    applies_to: "POST /licensing/age-group-rosters, PATCH /licensing/age-group-rosters/{roster_id}, POST /licensing/providers/{provider_id}/submit-application"

# =========================================================================
# §1.5 API Endpoint Table
#
# All query-string parameters are declared as OPTIONAL inputs (`name?`) with
# their default stated in the description, so a call that omits them is still
# a well-formed request.
# =========================================================================
endpoints:
  # ---- Test-driving surface -----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock to an explicit UTC instant. Every
      deadline, expiry, window and timeliness rule in this domain reads this
      clock and never the host wall clock. The server starts with the logical
      clock at exactly 2026-08-01T00:00:00Z; before any call to this endpoint
      the clock reads that default and MUST NOT fall back to real wall-clock
      time. The clock may be moved forward or backward freely.
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "the logical clock now reads to_iso8601 for every subsequent request"
      - "no stored entity is mutated and no derived field is recomputed by this call alone"

  # ---- Configuration: checklist items (immutable) --------------------------
  - method: POST
    path: "/licensing/checklist-items"
    description: "Registers one health-and-safety checklist item. ChecklistItem is immutable configuration: there is no update endpoint and no version field."
    roles: [AgencyAdmin]
    code: 201
    input: ["code", "title", "category", "default_severity", "age_groups_applicable", "infant_sensitive?"]
    output: ChecklistItem
    side_effects:
      - "code must be unique across all checklist items (else ERR_INVALID_REQUEST)"
      - "infant_sensitive defaults to false when omitted"

  - method: GET
    path: "/licensing/checklist-items"
    description: "Lists checklist items. Unpaginated filters default to unset (all items)."
    roles: [AgencyAdmin, LicensingInspector, LicensingSupervisor, ComplaintInvestigator, PublicPortalReader]
    code: 200
    input: ["code?", "category?", "default_severity?", "limit?", "offset?"]
    output: ChecklistItem[]
    side_effects: []

  - method: GET
    path: "/licensing/checklist-items/{checklist_item_id}"
    description: "Retrieves one checklist item."
    roles: [AgencyAdmin, LicensingInspector, LicensingSupervisor, ComplaintInvestigator, PublicPortalReader]
    code: 200
    input: []
    output: ChecklistItem
    side_effects: []

  # ---- Configuration: inspectors ------------------------------------------
  - method: POST
    path: "/licensing/inspectors"
    description: "Registers a field inspector with the age groups they are certified to inspect and their daily visit ceiling."
    roles: [AgencyAdmin]
    code: 201
    input: ["full_name", "county_code", "certified_age_groups", "max_daily_visits?"]
    output: Inspector
    side_effects:
      - "status starts at ACTIVE; scheduled_visit_count starts at 0; max_daily_visits defaults to 3"

  - method: GET
    path: "/licensing/inspectors"
    description: "Lists inspectors."
    roles: [AgencyAdmin, LicensingSupervisor]
    code: 200
    input: ["county_code?", "status?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []

  - method: GET
    path: "/licensing/inspectors/{inspector_id}"
    description: "Retrieves one inspector."
    roles: [AgencyAdmin, LicensingSupervisor, LicensingInspector, ComplaintInvestigator]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  - method: POST
    path: "/licensing/inspectors/{inspector_id}/leave-status"
    description: "Moves an inspector between ACTIVE and ON_LEAVE. This is the only producer of the ON_LEAVE state."
    roles: [AgencyAdmin]
    code: 200
    input: [status]
    output: Inspector
    side_effects:
      - "status set to the supplied value (ACTIVE or ON_LEAVE)"
      - "already-SCHEDULED inspections are NOT voided; only new scheduling and new investigator assignment are blocked while ON_LEAVE"
      - "increments Inspector.version by 1"

  # ---- Providers -----------------------------------------------------------
  - method: POST
    path: "/licensing/providers"
    description: |
      Creates a provider application in application_status DRAFT and
      license_status NONE. This is the only endpoint that does not require an
      X-User-ID header, because the Applicant identity IS the Provider row this
      call creates; every later Applicant call must send X-User-ID equal to the
      returned id.
    roles: [Applicant, AgencyAdmin]
    code: 201
    input: [legal_name, county_code, site_address, program_type, requested_capacity]
    output: Provider
    side_effects:
      - "capacity_ceiling = PROGRAM_CAPACITY_CEILING[program_type]"
      - "requested_capacity must be >= 1 and <= capacity_ceiling (else ERR_CAPACITY_CEILING_EXCEEDED)"
      - "all violation-point, complaint, risk and ladder counters start at 0; risk_tier starts at LOW; clearance_complete starts false"

  - method: GET
    path: "/licensing/providers"
    description: "Lists providers. This is the consumer-education search surface for PublicPortalReader."
    roles: [AgencyAdmin, LicensingSupervisor, ComplaintIntakeSpecialist, PublicPortalReader]
    code: 200
    input: ["county_code?", "program_type?", "license_status?", "application_status?", "risk_tier?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  - method: GET
    path: "/licensing/providers/{provider_id}"
    description: "Retrieves one provider with all its derived counters."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector, ComplaintIntakeSpecialist, ComplaintInvestigator, PublicPortalReader]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/licensing/providers/{provider_id}/submit-application"
    description: "Applicant submits the application: DRAFT -> SUBMITTED."
    roles: [Applicant]
    code: 200
    input: []
    output: Provider
    side_effects:
      - "application_status DRAFT -> SUBMITTED"
      - "requires at least one DIRECTOR StaffMember and at least one AgeGroupRoster whose requested_group_size values sum exactly to requested_capacity"
      - "increments Provider.version by 1"

  - method: POST
    path: "/licensing/providers/{provider_id}/clear-checks"
    description: "Supervisor records that background clearance is complete: SUBMITTED -> CHECKS_CLEARED."
    roles: [LicensingSupervisor]
    code: 200
    input: []
    output: Provider
    side_effects:
      - "recomputes clearance_complete per §1.3 provider_clearance_completeness and requires it to be true"
      - "application_status SUBMITTED -> CHECKS_CLEARED"
      - "increments Provider.version by 1"

  - method: POST
    path: "/licensing/providers/{provider_id}/license-decision"
    description: "Supervisor issues or denies the licence."
    roles: [LicensingSupervisor]
    code: 200
    input: ["decision", "decision_reason?"]
    output: Provider
    side_effects:
      - "decision = ISSUE: application_status INITIAL_INSPECTION_PASSED -> LICENSED; license_status NONE -> PROVISIONAL; license_number minted; licensed_at and provisional_started_at set; every roster's approved_group_size = requested_group_size; licensed_capacity = sum of approved_group_size"
      - "decision = DENY: application_status {SUBMITTED, CHECKS_CLEARED} -> DENIED; decision_reason stored; every non-terminal Inspection of the provider is VOIDED"
      - "increments Provider.version by 1"

  - method: POST
    path: "/licensing/providers/{provider_id}/promote-to-full"
    description: "Promotes a provisional licence to full after the provisional period and a passing annual inspection."
    roles: [LicensingSupervisor]
    code: 200
    input: []
    output: Provider
    side_effects:
      - "license_status PROVISIONAL -> FULL"
      - "requires the provisional period elapsed, a FINALIZED passing ANNUAL inspection since provisional_started_at, critical_open_count == 0 and open_violation_points == 0"
      - "increments Provider.version by 1"

  - method: POST
    path: "/licensing/providers/{provider_id}/restore-full"
    description: "Restores a probationary licence to full standing once every plan is completed and the point balance is below the warning threshold."
    roles: [LicensingSupervisor]
    code: 200
    input: []
    output: Provider
    side_effects:
      - "license_status PROBATION -> FULL; current_ladder_step reset to 0"
      - "rejected from SUSPENDED (a suspended licence returns to PROBATION only via a VACATED appeal)"
      - "increments Provider.version by 1"

  - method: GET
    path: "/licensing/providers/{provider_id}/risk-assessment"
    description: "Computed read: evaluates §1.3 provider_risk_assessment live. `variant` selects INTAKE_SCREENING or ENFORCEMENT_REVIEW and defaults to ENFORCEMENT_REVIEW when omitted."
    roles: [AgencyAdmin, LicensingSupervisor, ComplaintIntakeSpecialist]
    code: 200
    input: ["variant?"]
    output: { variant: string, risk_score: number, risk_tier: string, open_violation_points: integer, substantiated_complaint_count_24mo: integer, inconclusive_complaint_count_24mo: integer, critical_violation_count_24mo: integer }
    side_effects: []

  # ---- Staff members and background checks ---------------------------------
  - method: POST
    path: "/licensing/staff-members"
    description: "Attaches a staff member, volunteer or household member to a provider."
    roles: [Applicant, AgencyAdmin]
    code: 201
    input: ["provider_id", "full_name", "member_type", "date_of_birth", "qualified_age_groups", "role_title?"]
    output: StaffMember
    side_effects:
      - "clearance_status starts PENDING; supervision_eligible starts false; barred_offense_tier starts NONE"
      - "Provider.clearance_complete recomputed (adding an uncleared person can flip it to false)"
      - "increments Provider.version by 1"

  - method: GET
    path: "/licensing/staff-members"
    description: "Lists staff members, filterable by their provider (reverse-reachability for StaffMember.provider_id)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector, BackgroundCheckUnit]
    code: 200
    input: ["provider_id?", "member_type?", "clearance_status?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  - method: GET
    path: "/licensing/staff-members/{staff_member_id}"
    description: "Retrieves one staff member with derived clearance fields."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector, BackgroundCheckUnit]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: POST
    path: "/licensing/background-checks"
    description: "Opens one background check of one type for one person, in status SUBMITTED."
    roles: [BackgroundCheckUnit, Applicant, AgencyAdmin]
    code: 201
    input: [staff_member_id, check_type]
    output: BackgroundCheck
    side_effects:
      - "rejected when a live check of the same type already exists for that person (ERR_DUPLICATE_CHECK_TYPE)"
      - "submitted_at = the logical clock"

  - method: GET
    path: "/licensing/background-checks"
    description: "Lists background checks, filterable by staff member (reverse-reachability for BackgroundCheck.staff_member_id)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, BackgroundCheckUnit]
    code: 200
    input: ["staff_member_id?", "check_type?", "status?", "limit?", "offset?"]
    output: BackgroundCheck[]
    side_effects: []

  - method: GET
    path: "/licensing/background-checks/{background_check_id}"
    description: "Retrieves one background check."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, BackgroundCheckUnit]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  - method: POST
    path: "/licensing/background-checks/{background_check_id}/result"
    description: "Records the registry result. A DISQUALIFIED result starts transitive cascade B."
    roles: [BackgroundCheckUnit]
    code: 200
    input: ["result", "disqualifying_offense_tier?"]
    output: BackgroundCheck
    side_effects:
      - "result = CLEARED: status SUBMITTED -> CLEARED; decided_at = now; expires_at = now + 60 months; disqualifying_offense_tier must be NONE or omitted"
      - "result = DISQUALIFIED: status SUBMITTED -> DISQUALIFIED; disqualifying_offense_tier is required and must be a TIER_* value"
      - "cascade link 2: StaffMember.clearance_status / supervision_eligible / barred_offense_tier recomputed"
      - "cascade link 3: rosters led by that person lose their lead and have ratio / supervision flags recomputed"
      - "cascade link 4: Provider.clearance_complete recomputed; on a true -> false flip the application reverts CHECKS_CLEARED -> SUBMITTED and INITIAL inspections in SCHEDULED / IN_PROGRESS are VOIDED"
      - "increments Provider.version by 1"

  - method: POST
    path: "/licensing/background-checks/{background_check_id}/waiver"
    description: "Provider requests a waiver of a disqualification. TIER_1_PERMANENT can never enter this path."
    roles: [Applicant]
    code: 200
    input: [waiver_rationale]
    output: BackgroundCheck
    side_effects:
      - "status DISQUALIFIED -> WAIVER_PENDING; waiver_requested_at = now"
      - "StaffMember.clearance_status = WAIVER_PENDING"

  - method: POST
    path: "/licensing/background-checks/{background_check_id}/waiver-decision"
    description: "Supervisor grants or refuses the waiver, closing the DISQUALIFIED -> WAIVER_PENDING -> DISQUALIFIED loop."
    roles: [LicensingSupervisor]
    code: 200
    input: [decision]
    output: BackgroundCheck
    side_effects:
      - "decision = GRANT: status -> WAIVED; expires_at = now + 60 months; StaffMember clearance fields recomputed; Provider.clearance_complete recomputed"
      - "decision = REFUSE: status -> DISQUALIFIED; StaffMember.clearance_status = BARRED"
      - "waiver_decided_at = now"

  # ---- Age-group rosters ---------------------------------------------------
  - method: POST
    path: "/licensing/age-group-rosters"
    description: "Declares one age-group room with its requested group size, enrolment and staffing."
    roles: [Applicant, AgencyAdmin]
    code: 201
    input: ["provider_id", "age_group", "requested_group_size", "enrolled_count?", "staff_assigned_count?", "lead_staff_member_id?"]
    output: AgeGroupRoster
    side_effects:
      - "approved_group_size stays 0 until licensure, when it is set to requested_group_size"
      - "required_staff_count / ratio_compliant / group_size_compliant / supervision_compliant derived per §1.3 ratio_group_size_supervision_verification"
      - "one roster per (provider_id, age_group) pair (else ERR_INVALID_REQUEST)"

  - method: GET
    path: "/licensing/age-group-rosters"
    description: "Lists rosters, filterable by provider and by lead (reverse-reachability for both roster FKs)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector]
    code: 200
    input: ["provider_id?", "lead_staff_member_id?", "age_group?", "limit?", "offset?"]
    output: AgeGroupRoster[]
    side_effects: []

  - method: GET
    path: "/licensing/age-group-rosters/{roster_id}"
    description: "Retrieves one roster with its three compliance flags."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector]
    code: 200
    input: []
    output: AgeGroupRoster
    side_effects: []

  - method: PATCH
    path: "/licensing/age-group-rosters/{roster_id}"
    description: "Updates enrolment, staffing or the room lead. Any of the three flags may flip as a result."
    roles: [Applicant, AgencyAdmin]
    code: 200
    input: ["enrolled_count?", "staff_assigned_count?", "lead_staff_member_id?"]
    output: AgeGroupRoster
    side_effects:
      - "all three compliance flags and required_staff_count re-derived (constraint propagation reaches a fixed point in two hops)"
      - "increments AgeGroupRoster.version by 1"

  - method: POST
    path: "/licensing/age-group-rosters/{roster_id}/verify-ratio"
    description: "Conditional action: verifies the room against ratio, group-size and supervision rules and rejects the verification when any of them fails."
    roles: [LicensingInspector, LicensingSupervisor]
    code: 200
    input: []
    output: AgeGroupRoster
    side_effects:
      - "recomputes required_staff_count and the three flags, then requires all three to be true"
      - "last_verified_at = now on success"
      - "increments AgeGroupRoster.version by 1"

  # ---- Inspections ---------------------------------------------------------
  - method: POST
    path: "/licensing/inspections"
    description: "Schedules a visit. Occupies a half-open window on the inspector and a 60-minute-buffered closed window on the provider."
    roles: [LicensingSupervisor, AgencyAdmin]
    code: 201
    input: ["provider_id", "inspector_id", "inspection_type", "scheduled_for", "target_age_groups", "duration_minutes?", "complaint_id?"]
    output: Inspection
    side_effects:
      - "visit_window_end = scheduled_for + duration_minutes"
      - "temporal checks run before certification checks: ERR_INSPECTOR_DOUBLE_BOOKED (priority 66) and ERR_PROVIDER_VISIT_BUFFER_CONFLICT (67) precede ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP (74)"
      - "Inspector.scheduled_visit_count += 1"
      - "complaint_id is required exactly when inspection_type = COMPLAINT and forbidden otherwise"

  - method: GET
    path: "/licensing/inspections"
    description: "Lists inspections, filterable by provider, inspector and complaint (reverse-reachability for all three Inspection FKs)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector, ComplaintInvestigator, PublicPortalReader]
    code: 200
    input: ["provider_id?", "inspector_id?", "complaint_id?", "status?", "inspection_type?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: GET
    path: "/licensing/inspections/{inspection_id}"
    description: "Retrieves one inspection with both compliance scores."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector, ComplaintInvestigator, PublicPortalReader]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/licensing/inspections/{inspection_id}/start"
    description: "Assigned inspector begins the visit: SCHEDULED -> IN_PROGRESS."
    roles: [LicensingInspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "started_at = now; increments Inspection.version by 1"

  - method: POST
    path: "/licensing/inspections/{inspection_id}/submit-for-review"
    description: "Inspector submits findings: IN_PROGRESS -> PENDING_REVIEW. The outcome must agree with the cited violations."
    roles: [LicensingInspector]
    code: 200
    input: [outcome, age_groups_observed]
    output: Inspection
    side_effects:
      - "age_groups_observed must be a non-empty subset of the inspector's certified_age_groups"
      - "outcome must be FAIL when a non-VACATED CRITICAL violation exists and PASS when no non-VACATED violation exists"
      - "submitted_at = now; increments Inspection.version by 1"

  - method: POST
    path: "/licensing/inspections/{inspection_id}/reopen"
    description: "Supervisor sends the report back to the inspector: PENDING_REVIEW -> IN_PROGRESS. Bounded by INSPECTION_MAX_REOPENS = 2."
    roles: [LicensingSupervisor]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "reopen_count += 1; outcome, age_groups_observed and submitted_at cleared to null"
      - "increments Inspection.version by 1"

  - method: POST
    path: "/licensing/inspections/{inspection_id}/finalize"
    description: "Supervisor finalizes: PENDING_REVIEW -> FINALIZED. Freezes the PRELIMINARY score and opens the correction and CAP-submission windows."
    roles: [LicensingSupervisor]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "finalized_at = now; every CITED violation -> CORRECTION_PENDING with its correction_due_date"
      - "preliminary_compliance_score frozen; final_compliance_score and raw_deduction_points set; violation_count and cap_required derived"
      - "Provider point counters, critical counts and risk score/tier recomputed"
      - "for inspection_type = INITIAL with a passing outcome: application_status CHECKS_CLEARED -> INITIAL_INSPECTION_PASSED"
      - "requires Provider.clearance_complete for INITIAL inspections (cross-entity dependency on BackgroundCheck / StaffMember)"
      - "increments Inspection.version by 1; increments Provider.version by 1"

  - method: POST
    path: "/licensing/inspections/{inspection_id}/void"
    description: "Supervisor voids a non-finalized visit, releasing both occupancy windows and vacating its open citations."
    roles: [LicensingSupervisor]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "status -> VOIDED; open citations -> VACATED; Provider counters recomputed"
      - "Inspector.scheduled_visit_count recomputed; the windows no longer conflict with new scheduling"
      - "increments Inspection.version by 1"

  - method: GET
    path: "/licensing/inspections/{inspection_id}/compliance-score"
    description: "Computed read: evaluates §1.3 inspection_compliance_score live. `variant` selects PRELIMINARY or FINAL and defaults to FINAL when omitted."
    roles: [AgencyAdmin, LicensingSupervisor, LicensingInspector]
    code: 200
    input: ["variant?"]
    output: { variant: string, compliance_score: number, raw_deduction: number, violation_count: integer }
    side_effects: []

  # ---- Violations ----------------------------------------------------------
  - method: POST
    path: "/licensing/violations"
    description: "Cites one checklist violation on an in-progress inspection. assessed_points and correction_due_date are frozen here."
    roles: [LicensingInspector]
    code: 201
    input: ["inspection_id", "checklist_item_id", "primary_age_group", "narrative", "severity_override?", "repeat_of_violation_id?"]
    output: Violation
    side_effects:
      - "severity = severity_override when supplied else the checklist item's default_severity"
      - "repeat_chain_depth = 0, or min(2, parent.repeat_chain_depth + 1) when repeat_of_violation_id is supplied and valid"
      - "infant_exposure and assessed_points derived per §1.3 violation_point_assessment"
      - "Provider.open_violation_points and lifetime_violation_points += assessed_points; critical counters and risk recomputed"
      - "Inspection.violation_count and scores recomputed; increments Inspection.version by 1; increments Provider.version by 1"

  - method: GET
    path: "/licensing/violations"
    description: "Lists violations, filterable by inspection, checklist item and repeat ancestor (reverse-reachability for all three Violation FKs, including the self-reference)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector, ComplaintInvestigator, PublicPortalReader]
    code: 200
    input: ["inspection_id?", "checklist_item_id?", "repeat_of_violation_id?", "status?", "severity?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: GET
    path: "/licensing/violations/{violation_id}"
    description: "Retrieves one violation with its frozen point assessment."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, LicensingInspector, ComplaintInvestigator, PublicPortalReader]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/licensing/violations/{violation_id}/disposition"
    description: "Records correction, non-correction, or vacation. VACATED is supervisor-only and is the compensating action of a citation."
    roles: [LicensingInspector, LicensingSupervisor]
    code: 200
    input: ["disposition", "vacated_reason?"]
    output: Violation
    side_effects:
      - "VERIFIED_CORRECTED: open_violation_points -= assessed_points, resolved_violation_points += assessed_points, lifetime unchanged"
      - "UNCORRECTED: point counters unchanged; the FINAL score drops because the status factor becomes 1.250"
      - "VACATED: open_violation_points -= assessed_points and lifetime_violation_points -= assessed_points, restoring the pre-citation totals; requires role LicensingSupervisor and a non-blank vacated_reason"
      - "Inspection.final_compliance_score / raw_deduction_points recomputed; preliminary_compliance_score never changes"
      - "increments Violation.version by 1; increments Provider.version by 1"

  # ---- Complaints ----------------------------------------------------------
  - method: POST
    path: "/licensing/complaints"
    description: "Intake of an allegation. priority and investigation_due_at are computed here per §1.3 complaint_priority_and_deadline and frozen."
    roles: [ComplaintIntakeSpecialist, AgencyAdmin]
    code: 201
    input: ["provider_id", "intake_channel", "allegation_category", "affected_age_group", "narrative", "alleged_serious_harm?", "complainant_name?", "anonymous?"]
    output: Complaint
    side_effects:
      - "received_at = now; status = RECEIVED"
      - "priority from the category x age-band matrix, escalated one level when the provider is on PROBATION or SUSPENDED"
      - "investigation_due_at = received_at + DETERMINATION_DAYS[priority]"
      - "anonymous = true requires complainant_name to be omitted or null (else ERR_INVALID_REQUEST); intake_channel = AGENCY_INCIDENT may not be supplied by a client (else ERR_INVALID_ENUM_VALUE)"

  - method: GET
    path: "/licensing/complaints"
    description: "Lists complaints, filterable by provider and assigned investigator (reverse-reachability for both Complaint FKs)."
    roles: [AgencyAdmin, LicensingSupervisor, ComplaintIntakeSpecialist, ComplaintInvestigator]
    code: 200
    input: ["provider_id?", "assigned_investigator_id?", "status?", "priority?", "determination?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: GET
    path: "/licensing/complaints/{complaint_id}"
    description: "Retrieves one complaint with its deadline and timeliness flag."
    roles: [AgencyAdmin, LicensingSupervisor, ComplaintIntakeSpecialist, ComplaintInvestigator]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/licensing/complaints/{complaint_id}/screen"
    description: "Intake screening decision. A P1 allegation can never be screened out."
    roles: [ComplaintIntakeSpecialist]
    code: 200
    input: [decision]
    output: Complaint
    side_effects:
      - "decision = SCREEN_IN: RECEIVED -> SCREENED_IN; screened_at = now"
      - "decision = SCREEN_OUT: RECEIVED -> SCREENED_OUT (terminal); rejected with ERR_P1_CANNOT_BE_SCREENED_OUT when priority = P1"

  - method: POST
    path: "/licensing/complaints/{complaint_id}/assign-investigator"
    description: "Supervisor assigns an investigator. Segregation of duties blocks an inspector who recently finalized an inspection of the same provider."
    roles: [LicensingSupervisor]
    code: 200
    input: [investigator_id]
    output: Complaint
    side_effects:
      - "SCREENED_IN -> UNDER_INVESTIGATION; assigned_investigator_id set"
      - "rejected with ERR_SEGREGATION_OF_DUTIES when that inspector finalized any inspection of this provider within 12 months"
      - "rejected with ERR_INSPECTOR_ON_LEAVE when the inspector is ON_LEAVE"

  - method: POST
    path: "/licensing/complaints/{complaint_id}/determination"
    description: "Assigned investigator records the determination. A SUBSTANTIATED determination starts transitive cascade A."
    roles: [ComplaintInvestigator]
    code: 200
    input: [determination]
    output: Complaint
    side_effects:
      - "cascade link 1: UNDER_INVESTIGATION -> DETERMINED; determined_at = now; timeliness_flag = ON_TIME or LATE against investigation_due_at"
      - "cascade link 2 (SUBSTANTIATED only): one auto_generated Violation is cited on the complaint's most recently finalized COMPLAINT inspection, using COMPLAINT_CATEGORY_CHECKLIST_CODE[allegation_category]"
      - "cascade link 3: Provider point/complaint counters, risk score and tier recomputed; the target Inspection's FINAL score recomputed"
      - "cascade link 4: when open_violation_points now reaches PROBATION_THRESHOLD and current_ladder_step < 2, one EnforcementAction is auto-created in PROPOSED with its basis_points and fine_amount_cents"
      - "increments Provider.version by 1; increments the target Inspection.version by 1"

  - method: POST
    path: "/licensing/complaints/{complaint_id}/close"
    description: "Supervisor closes a determined complaint, unblocking any public posting held by the open investigation."
    roles: [LicensingSupervisor]
    code: 200
    input: [closure_note]
    output: Complaint
    side_effects:
      - "DETERMINED -> CLOSED; closure_note stored"

  # ---- Corrective action plans ---------------------------------------------
  - method: POST
    path: "/licensing/corrective-action-plans"
    description: "Provider submits a plan against a finalized inspection. Guarded by OCC on Inspection.version (concurrency_rules[cap-submit-stale-inspection]); a newer plan SUPERSEDEs the open earlier plan for the same inspection."
    roles: [Applicant]
    code: 201
    input: [inspection_id, violation_ids, narrative, proposed_completion_date, expected_inspection_version]
    output: CorrectiveActionPlan
    side_effects:
      - "expected_inspection_version must equal the inspection's current version (else ERR_STALE_INSPECTION_VERSION, 412)"
      - "provider_id copied from the inspection; submitted_at = now; review_cycle_count = 1; status = SUBMITTED"
      - "due_at = now + min(CORRECTION_DAYS over the plan's violations) days"
      - "any earlier CorrectiveActionPlan for the same inspection_id in status SUBMITTED or REJECTED transitions to SUPERSEDED"
      - "increments Inspection.version by 1"

  - method: GET
    path: "/licensing/corrective-action-plans"
    description: "Lists plans, filterable by provider and inspection (reverse-reachability for both CAP FKs)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor]
    code: 200
    input: ["provider_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: CorrectiveActionPlan[]
    side_effects: []

  - method: GET
    path: "/licensing/corrective-action-plans/{cap_id}"
    description: "Retrieves one corrective action plan."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []

  - method: POST
    path: "/licensing/corrective-action-plans/{cap_id}/review"
    description: "Supervisor approves or rejects a submitted plan. The approving X-User-ID is recorded and later blocks that supervisor from issuing enforcement on the same inspection."
    roles: [LicensingSupervisor]
    code: 200
    input: ["decision", "review_note?"]
    output: CorrectiveActionPlan
    side_effects:
      - "decision = APPROVE: SUBMITTED -> APPROVED; approved_at = now; reviewed_by_user_id = X-User-ID; the plan's CITED violations move to CORRECTION_PENDING"
      - "decision = REJECT: SUBMITTED -> REJECTED; a non-blank review_note is required"
      - "reviewed_at = now; increments CorrectiveActionPlan.version by 1"

  - method: POST
    path: "/licensing/corrective-action-plans/{cap_id}/resubmit"
    description: "Provider resubmits a rejected plan, closing the SUBMITTED -> REJECTED -> SUBMITTED cycle. Bounded by CAP_MAX_REVIEW_CYCLES = 3."
    roles: [Applicant]
    code: 200
    input: [violation_ids, narrative, proposed_completion_date]
    output: CorrectiveActionPlan
    side_effects:
      - "REJECTED -> SUBMITTED; review_cycle_count += 1; rejected with ERR_CAP_REVIEW_CYCLE_EXHAUSTED once it reaches 3"
      - "due_at recomputed from the new violation set; submitted_at = now"
      - "increments CorrectiveActionPlan.version by 1"

  - method: POST
    path: "/licensing/corrective-action-plans/{cap_id}/complete"
    description: "Supervisor records the outcome of an approved plan."
    roles: [LicensingSupervisor]
    code: 200
    input: [result]
    output: CorrectiveActionPlan
    side_effects:
      - "result = COMPLETED: requires every listed violation to be VERIFIED_CORRECTED or VACATED; APPROVED -> COMPLETED"
      - "result = FAILED: requires the logical clock to be strictly past due_at; APPROVED -> FAILED; every still-CORRECTION_PENDING listed violation becomes UNCORRECTED and the inspection's FINAL score drops"
      - "completed_at = now; Inspection scores and Provider risk recomputed"

  # ---- Enforcement actions -------------------------------------------------
  - method: POST
    path: "/licensing/enforcement-actions"
    description: "Proposes an enforcement action. The requested step may not exceed the step the provider's accumulated points justify."
    roles: [LicensingSupervisor]
    code: 201
    input: ["provider_id", "requested_action_type", "source_inspection_id?", "rationale?"]
    output: EnforcementAction
    side_effects:
      - "basis_points frozen at Provider.open_violation_points; action_type = requested_action_type; ladder_step = LADDER_STEP[action_type]"
      - "rejected with ERR_NO_ENFORCEMENT_BASIS below 15 points and with ERR_LADDER_STEP_SKIP when the requested step exceeds the recommended one"
      - "fine_amount_cents computed per §1.3 enforcement_fine_amount and frozen"
      - "status = PROPOSED; proposed_at = now"

  - method: GET
    path: "/licensing/enforcement-actions"
    description: "Lists enforcement actions, filterable by provider and source inspection (reverse-reachability for both EnforcementAction FKs)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, PublicPortalReader]
    code: 200
    input: ["provider_id?", "source_inspection_id?", "status?", "action_type?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []

  - method: GET
    path: "/licensing/enforcement-actions/{action_id}"
    description: "Retrieves one enforcement action with its frozen fine and appeal deadline."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, PublicPortalReader]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  - method: POST
    path: "/licensing/enforcement-actions/{action_id}/issue"
    description: "Supervisor issues the proposed action. Blocked for the supervisor who approved the corrective action plan for the same inspection."
    roles: [LicensingSupervisor]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "PROPOSED -> ISSUED; issued_at = now; issued_by_user_id = X-User-ID"
      - "appeal_deadline_at = issued_at + 15 days"
      - "rejected with ERR_SEGREGATION_OF_DUTIES when this X-User-ID reviewed the CAP for source_inspection_id"

  - method: POST
    path: "/licensing/enforcement-actions/{action_id}/effectuate"
    description: "Agency admin puts the action into effect, moving the licence down the ladder and, for suspension and revocation, moving capacity slots."
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "ISSUED -> EFFECTIVE; effective_at = now"
      - "WARNING: current_ladder_step = max(step, 1); PROBATION: license_status = PROBATION, probation_cycle_count += 1"
      - "SUSPENSION: license_status = SUSPENDED; capacity_held_slots = licensed_capacity; slots move to suspended_capacity (total preserved)"
      - "REVOCATION: license_status = REVOKED; all slots zeroed; open amendments and other PROPOSED actions WITHDRAWN; non-terminal inspections VOIDED"
      - "Provider risk recomputed; increments Provider.version by 1"

  - method: POST
    path: "/licensing/enforcement-actions/{action_id}/appeal"
    description: "Provider appeals an effective action within the 15-day window (inclusive of the deadline instant)."
    roles: [Applicant]
    code: 200
    input: [appeal_note]
    output: EnforcementAction
    side_effects:
      - "EFFECTIVE -> APPEALED; appealed_at = now; appeal_note stored"
      - "no licence or capacity field changes: filing an appeal does not stay the action"
      - "rejected with ERR_APPEAL_DEADLINE_PASSED strictly after appeal_deadline_at"

  - method: POST
    path: "/licensing/enforcement-actions/{action_id}/appeal-decision"
    description: "Agency admin upholds or vacates the appealed action. VACATED runs the full compensation, restoring capacity slots exactly."
    roles: [AgencyAdmin]
    code: 200
    input: [appeal_decision]
    output: EnforcementAction
    side_effects:
      - "APPEALED -> UPHELD: nothing else changes"
      - "APPEALED -> VACATED: capacity_held_slots returned to licensed_capacity, suspended_capacity reduced by the same amount, licence reinstated to PROBATION (never FULL), current_ladder_step lowered"
      - "rejected with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals issued_by_user_id"
      - "resolved_at = now; Provider risk recomputed; increments Provider.version by 1"

  # ---- Licence amendments --------------------------------------------------
  - method: POST
    path: "/licensing/license-amendments"
    description: "Provider requests a capacity change, site move, director change or age-group addition. Guarded by OCC on Provider.version (concurrency_rules[amendment-create-stale-provider]); a newer amendment of the same type SUPERSEDEs the open earlier one."
    roles: [Applicant]
    code: 201
    input: ["provider_id", "amendment_type", "expected_provider_version", "requested_capacity?", "new_site_address?", "new_age_group?", "new_group_size?", "new_director_staff_member_id?"]
    output: LicenseAmendment
    side_effects:
      - "expected_provider_version must equal the provider's current version (else ERR_STALE_PROVIDER_VERSION, 412)"
      - "requires_inspection derived from amendment_type; status starts PRE_INSPECTION_REQUIRED when true else SUBMITTED"
      - "effective_capacity_delta = requested_capacity - Provider.licensed_capacity for CAPACITY_CHANGE, new_group_size for AGE_GROUP_ADD, 0 otherwise"
      - "any earlier LicenseAmendment of the same provider and amendment_type in status SUBMITTED or PRE_INSPECTION_REQUIRED transitions to SUPERSEDED"
      - "submitted_at = now; increments Provider.version by 1"

  - method: GET
    path: "/licensing/license-amendments"
    description: "Lists amendments, filterable by provider, pre-move inspection and proposed director (reverse-reachability for all three LicenseAmendment FKs)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor]
    code: 200
    input: ["provider_id?", "pre_move_inspection_id?", "new_director_staff_member_id?", "status?", "amendment_type?", "limit?", "offset?"]
    output: LicenseAmendment[]
    side_effects: []

  - method: GET
    path: "/licensing/license-amendments/{amendment_id}"
    description: "Retrieves one licence amendment."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor]
    code: 200
    input: []
    output: LicenseAmendment
    side_effects: []

  - method: POST
    path: "/licensing/license-amendments/{amendment_id}/attach-inspection"
    description: "Cross-reference link: attaches the finalized AMENDMENT_PRE_MOVE inspection that the amendment required, moving it to SUBMITTED."
    roles: [LicensingSupervisor]
    code: 200
    input: [pre_move_inspection_id]
    output: LicenseAmendment
    side_effects:
      - "PRE_INSPECTION_REQUIRED -> SUBMITTED"
      - "the inspection must exist, belong to the same provider, be FINALIZED, and have inspection_type = AMENDMENT_PRE_MOVE"
      - "increments LicenseAmendment.version by 1"

  - method: POST
    path: "/licensing/license-amendments/{amendment_id}/decide"
    description: "Agency admin approves or denies the amendment. Approval is blocked while a suspension or revocation is effective, and capacity increases are blocked by unresolved critical violations and by the programme ceiling."
    roles: [AgencyAdmin]
    code: 200
    input: ["decision", "decision_rationale?"]
    output: LicenseAmendment
    side_effects:
      - "decision = APPROVE: SUBMITTED -> APPROVED; the amendment's effect is applied to the Provider (capacity, address, director, or a new roster)"
      - "decision = DENY: SUBMITTED -> DENIED with a required non-blank decision_rationale; no provider field changes"
      - "safety check ERR_UNRESOLVED_CRITICAL_VIOLATION (priority 58) is evaluated before the fiscal check ERR_CAPACITY_CEILING_EXCEEDED (priority 90)"
      - "decided_at = now; increments Provider.version by 1; increments LicenseAmendment.version by 1"

  - method: POST
    path: "/licensing/license-amendments/{amendment_id}/withdraw"
    description: "Provider withdraws an open amendment."
    roles: [Applicant]
    code: 200
    input: []
    output: LicenseAmendment
    side_effects:
      - "SUBMITTED or PRE_INSPECTION_REQUIRED -> WITHDRAWN; decided_at = now"
      - "increments LicenseAmendment.version by 1"

  # ---- Serious incident reports --------------------------------------------
  - method: POST
    path: "/licensing/serious-incident-reports"
    description: "Provider (or the agency on its behalf) reports a serious injury, fatality, missing child, medication error or communicable-disease event. Timeliness is judged against a type-specific window."
    roles: [Applicant, AgencyAdmin]
    code: 201
    input: [provider_id, incident_type, occurred_at, affected_child_age_group, narrative]
    output: SeriousIncidentReport
    side_effects:
      - "reported_at = now; reporting_deadline_at = occurred_at + INCIDENT_REPORT_WINDOW_HOURS[incident_type]; reporting_timeliness TIMELY when reported_at <= deadline else LATE_REPORT"
      - "occurred_at strictly after the clock is rejected with ERR_INCIDENT_OCCURRED_IN_FUTURE"
      - "conditional cascade when LATE_REPORT: if the provider has at least one FINALIZED inspection, an auto_generated CRITICAL Violation on checklist code RE-601 is cited on the most recently finalized one and late_report_violation_created = true; with no finalized inspection nothing is cited and the flag stays false"
      - "status = REPORTED"

  - method: GET
    path: "/licensing/serious-incident-reports"
    description: "Lists incident reports, filterable by provider and by the complaint the review generated (reverse-reachability for both SeriousIncidentReport FKs)."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, ComplaintIntakeSpecialist]
    code: 200
    input: ["provider_id?", "generated_complaint_id?", "status?", "incident_type?", "reporting_timeliness?", "limit?", "offset?"]
    output: SeriousIncidentReport[]
    side_effects: []

  - method: GET
    path: "/licensing/serious-incident-reports/{report_id}"
    description: "Retrieves one incident report with its deadline and timeliness."
    roles: [AgencyAdmin, Applicant, LicensingSupervisor, ComplaintIntakeSpecialist]
    code: 200
    input: []
    output: SeriousIncidentReport
    side_effects: []

  - method: POST
    path: "/licensing/serious-incident-reports/{report_id}/review"
    description: "Supervisor dispositions the report. FATALITY and MISSING_CHILD may never be merely monitored."
    roles: [LicensingSupervisor]
    code: 200
    input: ["disposition", "agency_note?"]
    output: SeriousIncidentReport
    side_effects:
      - "disposition = MONITOR: REPORTED -> UNDER_REVIEW; rejected with ERR_INCIDENT_REQUIRES_INVESTIGATION for FATALITY or MISSING_CHILD"
      - "disposition = OPEN_INVESTIGATION: REPORTED -> INVESTIGATION_OPENED and one P1 Complaint is auto-created in SCREENED_IN with intake_channel AGENCY_INCIDENT; generated_complaint_id is set"
      - "reviewed_at = now"

  - method: POST
    path: "/licensing/serious-incident-reports/{report_id}/close"
    description: "Supervisor closes the report. A report that opened an investigation cannot close until that complaint is closed or screened out."
    roles: [LicensingSupervisor]
    code: 200
    input: ["agency_note?"]
    output: SeriousIncidentReport
    side_effects:
      - "UNDER_REVIEW or INVESTIGATION_OPENED -> CLOSED; closed_at = now"
      - "cross-entity precondition on the generated Complaint's status"

  # ---- Public report postings ----------------------------------------------
  - method: POST
    path: "/licensing/public-report-postings"
    description: "Prepares a consumer-facing posting of a finalized inspection report, starting in PENDING_REDACTION."
    roles: [AgencyAdmin]
    code: 201
    input: ["inspection_id", "consumer_summary", "redaction_complete?"]
    output: PublicReportPosting
    side_effects:
      - "provider_id copied from the inspection; posting_status = PENDING_REDACTION; correction_count = 0"
      - "the inspection must be FINALIZED (else ERR_INVALID_INSPECTION_STATE)"
      - "one posting per inspection_id (else ERR_INVALID_REQUEST)"

  - method: GET
    path: "/licensing/public-report-postings"
    description: "Lists postings, filterable by provider and inspection (reverse-reachability for both PublicReportPosting FKs). This is the public inspection register."
    roles: [AgencyAdmin, LicensingSupervisor, Applicant, PublicPortalReader]
    code: 200
    input: ["provider_id?", "inspection_id?", "posting_status?", "limit?", "offset?"]
    output: PublicReportPosting[]
    side_effects: []

  - method: GET
    path: "/licensing/public-report-postings/{posting_id}"
    description: "Retrieves one posting with its display score and enforcement banner."
    roles: [AgencyAdmin, LicensingSupervisor, Applicant, PublicPortalReader]
    code: 200
    input: []
    output: PublicReportPosting
    side_effects: []

  - method: POST
    path: "/licensing/public-report-postings/{posting_id}/post"
    description: "Publishes the posting. Blocked while any complaint against the provider is under investigation, and blocked until redaction is complete."
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: PublicReportPosting
    side_effects:
      - "PENDING_REDACTION -> POSTED; posted_at = now; expires_at = posted_at + 36 months"
      - "display_score and enforcement_banner computed per §1.3 public_display_score from the provider's ladder state at this instant"
      - "rejected with ERR_REDACTION_INCOMPLETE and with ERR_POSTING_BLOCKED_OPEN_INVESTIGATION"

  - method: POST
    path: "/licensing/public-report-postings/{posting_id}/revise"
    description: "Corrects or withdraws a published posting. CORRECT is a bounded self-loop (POSTING_MAX_CORRECTIONS = 2); WITHDRAW is terminal."
    roles: [AgencyAdmin]
    code: 200
    input: [action, revision_note]
    output: PublicReportPosting
    side_effects:
      - "action = CORRECT: posting_status becomes CORRECTED; correction_count += 1; corrected_at = now; display_score and enforcement_banner recomputed from current values; rejected with ERR_POSTING_CORRECTION_LIMIT once correction_count reaches 2"
      - "action = WITHDRAW: posting_status -> WITHDRAWN; withdrawn_at = now; display_score cleared to null and the posting leaves the public register"
      - "revision_note must be non-blank; increments PublicReportPosting.version by 1"

# =========================================================================
# §1.6 Error Code Catalog
# =========================================================================
errors:
  # ---- Authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID missing or blank on any endpoint other than POST /licensing/providers, X-User-Role missing or not one of the eight declared roles, or an entity-backed role whose X-User-ID does not resolve to a row of its backing entity."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The declared X-User-Role is not listed in the target endpoint's roles — including a LicensingInspector attempting a VACATED disposition, which only a LicensingSupervisor may record."
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "An entity-backed actor targets a resource it does not own: an Applicant whose X-User-ID is not the resource's provider_id, a LicensingInspector who is not the inspection's inspector_id, or a ComplaintInvestigator who is not the complaint's assigned_investigator_id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting identity is barred from this step because it performed an incompatible earlier step: assigning an inspector who finalized an inspection of the same provider within 12 months, issuing enforcement on an inspection whose corrective action plan the same supervisor reviewed, or deciding an appeal on an action the same admin issued."

  # ---- Request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Unknown body key, missing required field, wrong scalar type, blank string where non-blank is required (vacated_reason, review_note on REJECT, decision_rationale on DENY, revision_note), duplicate checklist code, duplicate (provider_id, age_group) roster, duplicate posting for one inspection, anonymous complaint carrying a complainant_name, complaint_id supplied for a non-COMPLAINT inspection or omitted for a COMPLAINT one, or a disqualifying_offense_tier inconsistent with the submitted result."
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "An enum-typed input value is outside its declared constraint set, including a client attempting intake_channel = AGENCY_INCIDENT."

  # ---- Existence ----------------------------------------------------------
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "No Provider matches the supplied provider_id in the path or body."
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "No Inspector matches the supplied inspector_id or investigator_id."
  - id: ERR_CHECKLIST_ITEM_NOT_FOUND
    http: 404
    condition: "No ChecklistItem matches the supplied checklist_item_id, or the code the substantiated-complaint / late-incident cascade needs is not registered."
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "No StaffMember matches the supplied staff_member_id, lead_staff_member_id or new_director_staff_member_id."
  - id: ERR_BACKGROUND_CHECK_NOT_FOUND
    http: 404
    condition: "No BackgroundCheck matches the supplied background_check_id."
  - id: ERR_ROSTER_NOT_FOUND
    http: 404
    condition: "No AgeGroupRoster matches the supplied roster_id."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No Inspection matches the supplied inspection_id, source_inspection_id or pre_move_inspection_id."
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "No Violation matches the supplied violation_id, a member of violation_ids, or repeat_of_violation_id."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No Complaint matches the supplied complaint_id."
  - id: ERR_CAP_NOT_FOUND
    http: 404
    condition: "No CorrectiveActionPlan matches the supplied cap_id."
  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http: 404
    condition: "No EnforcementAction matches the supplied action_id."
  - id: ERR_AMENDMENT_NOT_FOUND
    http: 404
    condition: "No LicenseAmendment matches the supplied amendment_id."
  - id: ERR_INCIDENT_REPORT_NOT_FOUND
    http: 404
    condition: "No SeriousIncidentReport matches the supplied report_id."
  - id: ERR_POSTING_NOT_FOUND
    http: 404
    condition: "No PublicReportPosting matches the supplied posting_id."

  # ---- Optimistic concurrency --------------------------------------------
  - id: ERR_STALE_PROVIDER_VERSION
    http: 412
    condition: "expected_provider_version on POST /licensing/license-amendments does not equal the Provider's current version (concurrency_rules[amendment-create-stale-provider])."
  - id: ERR_STALE_INSPECTION_VERSION
    http: 412
    condition: "expected_inspection_version on POST /licensing/corrective-action-plans does not equal the Inspection's current version (concurrency_rules[cap-submit-stale-inspection])."

  # ---- State preconditions ------------------------------------------------
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "Provider.application_status is not in the requested transition's from-set."
  - id: ERR_INVALID_LICENSE_STATE
    http: 409
    condition: "Provider.license_status is not in the requested transition's from-set, including promoting a non-provisional licence, restoring a suspended one, or effectuating a ladder step the current licence state cannot receive."
  - id: ERR_INVALID_INSPECTION_STATE
    http: 409
    condition: "The Inspection is not in the state the operation requires, including reopening past INSPECTION_MAX_REOPENS and voiding an already-FINALIZED inspection."
  - id: ERR_INVALID_INSPECTION_TYPE
    http: 409
    condition: "The referenced inspection's inspection_type is wrong for the operation — attaching a non-AMENDMENT_PRE_MOVE inspection to an amendment."
  - id: ERR_INVALID_VIOLATION_STATE
    http: 409
    condition: "The Violation is not dispositionable in the requested direction, or a plan is being completed while a listed violation is still open."
  - id: ERR_INVALID_COMPLAINT_STATE
    http: 409
    condition: "The Complaint is not in the state the operation requires, or an incident report is being closed while its generated complaint is still live."
  - id: ERR_INVALID_CAP_STATE
    http: 409
    condition: "The CorrectiveActionPlan is not in the state the operation requires, or restore-full is attempted while a plan of the provider is neither COMPLETED nor SUPERSEDED."
  - id: ERR_INVALID_ENFORCEMENT_STATE
    http: 409
    condition: "The EnforcementAction is not in the state the operation requires."
  - id: ERR_INVALID_AMENDMENT_STATE
    http: 409
    condition: "The LicenseAmendment is not in the state the operation requires."
  - id: ERR_INVALID_INCIDENT_STATE
    http: 409
    condition: "The SeriousIncidentReport is not in the state the operation requires."
  - id: ERR_INVALID_POSTING_STATE
    http: 409
    condition: "The PublicReportPosting is not in the state the operation requires — posting an already-posted report, or revising one still pending redaction or already withdrawn."
  - id: ERR_INVALID_CHECK_STATE
    http: 409
    condition: "The BackgroundCheck is not in the state the operation requires."

  # ---- Business: safety / compliance --------------------------------------
  - id: ERR_CLEARANCE_INCOMPLETE
    http: 409
    condition: "Provider.clearance_complete is false — some attached person lacks an unexpired CLEARED or WAIVED check of both REQUIRED_CHECK_TYPES, or the provider has no DIRECTOR."
  - id: ERR_PERMANENT_BAR_NOT_WAIVABLE
    http: 409
    condition: "A waiver is requested for a check whose disqualifying_offense_tier is TIER_1_PERMANENT."
  - id: ERR_SUPERVISION_INELIGIBLE_LEAD
    http: 409
    condition: "A roster's lead is not CLEARED, is not supervision_eligible, is not a DIRECTOR or LEAD_TEACHER, or is not qualified for that roster's age group."
  - id: ERR_UNRESOLVED_CRITICAL_VIOLATION
    http: 409
    condition: "Provider.critical_open_count > 0 when licensing, promoting, restoring, or approving a capacity increase."
  - id: ERR_RATIO_NONCOMPLIANT
    http: 409
    condition: "staff_assigned_count is below ceil(enrolled_count / AGE_GROUP_RATIO[age_group])."
  - id: ERR_GROUP_SIZE_EXCEEDED
    http: 409
    condition: "enrolled_count exceeds min(approved_group_size, AGE_GROUP_MAX_SIZE[age_group]), or requested_group_size exceeds AGE_GROUP_MAX_SIZE[age_group]."
  - id: ERR_P1_CANNOT_BE_SCREENED_OUT
    http: 409
    condition: "A complaint whose computed priority is P1 is being screened out."
  - id: ERR_INCIDENT_REQUIRES_INVESTIGATION
    http: 409
    condition: "A FATALITY or MISSING_CHILD report is dispositioned MONITOR."
  - id: ERR_POSTING_BLOCKED_OPEN_INVESTIGATION
    http: 409
    condition: "A posting is being published while a Complaint against the same provider is UNDER_INVESTIGATION."
  - id: ERR_REDACTION_INCOMPLETE
    http: 409
    condition: "A posting is being published with redaction_complete false."

  # ---- Business: temporal -------------------------------------------------
  - id: ERR_INSPECTOR_DOUBLE_BOOKED
    http: 409
    condition: "The requested half-open visit window intersects another SCHEDULED or IN_PROGRESS window of the same inspector. Back-to-back windows sharing only the boundary instant do NOT trigger this."
  - id: ERR_PROVIDER_VISIT_BUFFER_CONFLICT
    http: 409
    condition: "The requested 60-minute-buffered closed window intersects the same buffered window of another SCHEDULED or IN_PROGRESS visit to the same provider. Buffered windows that touch at a single instant DO trigger this."
  - id: ERR_SCHEDULE_IN_PAST
    http: 422
    condition: "scheduled_for is at or before the logical clock."
  - id: ERR_INCIDENT_OCCURRED_IN_FUTURE
    http: 422
    condition: "occurred_at is strictly after the logical clock."
  - id: ERR_APPEAL_DEADLINE_PASSED
    http: 409
    condition: "The appeal is filed strictly after appeal_deadline_at. Filing exactly at the deadline instant succeeds."
  - id: ERR_CAP_WINDOW_CLOSED
    http: 409
    condition: "A plan is submitted or resubmitted strictly after inspection.finalized_at + 10 days, or a FAILED completion is recorded at or before cap.due_at."
  - id: ERR_PROVISIONAL_PERIOD_NOT_ELAPSED
    http: 409
    condition: "promote-to-full is called before provisional_started_at + 6 months."

  # ---- Business: constraints ----------------------------------------------
  - id: ERR_REPEAT_REFERENCE_INVALID
    http: 422
    condition: "repeat_of_violation_id names a violation of a different provider, a different checklist item, one outside the 24-month lookback, or one that is itself VACATED."
  - id: ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP
    http: 409
    condition: "target_age_groups or age_groups_observed is empty or is not a subset of the assigned Inspector.certified_age_groups."
  - id: ERR_INSPECTOR_ON_LEAVE
    http: 409
    condition: "The inspector being scheduled, starting a visit, or being assigned as investigator has status ON_LEAVE."
  - id: ERR_INSPECTOR_DAILY_LIMIT_REACHED
    http: 409
    condition: "The inspector already has max_daily_visits SCHEDULED or IN_PROGRESS visits on the requested UTC calendar date."
  - id: ERR_CAP_REVIEW_CYCLE_EXHAUSTED
    http: 409
    condition: "A rejected plan is resubmitted when review_cycle_count already equals CAP_MAX_REVIEW_CYCLES (3)."
  - id: ERR_POSTING_CORRECTION_LIMIT
    http: 409
    condition: "A CORRECT revision is requested when correction_count already equals POSTING_MAX_CORRECTIONS (2)."
  - id: ERR_DUPLICATE_CHECK_TYPE
    http: 409
    condition: "A live check of the same check_type already exists for that staff member."
  - id: ERR_OUTCOME_SEVERITY_MISMATCH
    http: 409
    condition: "The submitted outcome contradicts the cited violations: not FAIL despite a non-VACATED CRITICAL citation, or not PASS despite zero non-VACATED citations."
  - id: ERR_LADDER_STEP_SKIP
    http: 409
    condition: "The requested action_type sits higher on the ladder than the step Provider.open_violation_points justifies."
  - id: ERR_NO_ENFORCEMENT_BASIS
    http: 409
    condition: "Provider.open_violation_points is below WARNING_THRESHOLD (15), so no enforcement action can be proposed at all."
  - id: ERR_ACTIVE_ENFORCEMENT_BLOCKS_AMENDMENT
    http: 409
    condition: "An amendment is being approved while a SUSPENSION or REVOCATION action of the same provider is EFFECTIVE."
  - id: ERR_OUTSTANDING_VIOLATION_POINTS
    http: 409
    condition: "promote-to-full is called with open_violation_points > 0, or restore-full with open_violation_points at or above WARNING_THRESHOLD."

  # ---- Business: referential ---------------------------------------------
  - id: ERR_VIOLATION_INSPECTION_MISMATCH
    http: 422
    condition: "A violation named in a plan does not belong to that plan's inspection, or an attached inspection belongs to a different provider than the amendment."
  - id: ERR_COMPLAINT_INSPECTION_REQUIRED
    http: 409
    condition: "A SUBSTANTIATED determination is recorded with no FINALIZED Inspection linked to that complaint to carry the auto-cited violation."

  # ---- Business: capacity / fiscal ---------------------------------------
  - id: ERR_CAPACITY_CEILING_EXCEEDED
    http: 409
    condition: "requested_capacity at creation, or licensed_capacity + suspended_capacity + effective_capacity_delta at amendment approval, exceeds PROGRAM_CAPACITY_CEILING[program_type]. Landing exactly on the ceiling is allowed."
  - id: ERR_CAPACITY_SLOT_IMBALANCE
    http: 409
    condition: "An operation would leave suspended_capacity negative, change licensed_capacity + suspended_capacity on a suspension or appeal path, or (at submit-application) the provider has no roster or its roster group sizes do not sum exactly to requested_capacity."
  - id: ERR_ROSTER_CAPACITY_MISMATCH
    http: 409
    condition: "The sum of approved_group_size across the provider's rosters would exceed licensed_capacity (or, before licensure, requested_capacity)."

# =========================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =========================================================================
roles:
  - name: AgencyAdmin
    description: "State agency administrator. Owns configuration (checklist items, inspectors), enforcement effectuation and appeal adjudication, licence amendment decisions, the public register, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /licensing/checklist-items"
      - "POST /licensing/inspectors"
      - "POST /licensing/inspectors/{inspector_id}/leave-status"
      - "POST /licensing/enforcement-actions/{action_id}/effectuate"
      - "POST /licensing/enforcement-actions/{action_id}/appeal-decision"
      - "POST /licensing/license-amendments/{amendment_id}/decide"
      - "POST /licensing/public-report-postings"
      - "POST /licensing/public-report-postings/{posting_id}/post"
      - "POST /licensing/public-report-postings/{posting_id}/revise"
    shared_operations:
      - "POST /licensing/providers"
      - "POST /licensing/staff-members"
      - "POST /licensing/background-checks"
      - "POST /licensing/age-group-rosters"
      - "PATCH /licensing/age-group-rosters/{roster_id}"
      - "POST /licensing/inspections"
      - "POST /licensing/complaints"
      - "POST /licensing/serious-incident-reports"
      - "all GET reads"

  - name: Applicant
    description: "The provider applicant / licensee acting on its own record. Its X-User-ID is the Provider row's id, which is why POST /licensing/providers is the one endpoint that sends no X-User-ID."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /licensing/providers/{provider_id}/submit-application"
      - "POST /licensing/background-checks/{background_check_id}/waiver"
      - "POST /licensing/corrective-action-plans"
      - "POST /licensing/corrective-action-plans/{cap_id}/resubmit"
      - "POST /licensing/enforcement-actions/{action_id}/appeal"
      - "POST /licensing/license-amendments"
      - "POST /licensing/license-amendments/{amendment_id}/withdraw"
    shared_operations:
      - "POST /licensing/providers"
      - "POST /licensing/staff-members"
      - "POST /licensing/background-checks"
      - "POST /licensing/age-group-rosters"
      - "PATCH /licensing/age-group-rosters/{roster_id}"
      - "POST /licensing/serious-incident-reports"
      - "GET reads scoped to its own provider record and children"

  - name: LicensingInspector
    description: "Field inspector who conducts visits, verifies rooms, cites violations and verifies corrections. Its X-User-ID is an Inspector row's id and must match the inspection's inspector_id."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /licensing/inspections/{inspection_id}/start"
      - "POST /licensing/inspections/{inspection_id}/submit-for-review"
      - "POST /licensing/violations"
    shared_operations:
      - "POST /licensing/age-group-rosters/{roster_id}/verify-ratio"
      - "POST /licensing/violations/{violation_id}/disposition (VERIFIED_CORRECTED and UNCORRECTED only — a VACATED disposition is refused with ERR_UNAUTHORIZED)"
      - "GET reads on providers, inspections, violations, rosters, checklist items"

  - name: ComplaintIntakeSpecialist
    description: "Intake officer who receives allegations and makes the screen-in / screen-out decision. Never investigates and never determines."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/complaints/{complaint_id}/screen"
    shared_operations:
      - "POST /licensing/complaints"
      - "GET /licensing/providers"
      - "GET /licensing/providers/{provider_id}/risk-assessment"
      - "GET /licensing/complaints and GET /licensing/complaints/{complaint_id}"
      - "GET /licensing/serious-incident-reports"

  - name: ComplaintInvestigator
    description: "Investigator assigned to a screened-in complaint who records the substantiation determination. Its X-User-ID is an Inspector row's id and must equal the complaint's assigned_investigator_id."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /licensing/complaints/{complaint_id}/determination"
    shared_operations:
      - "GET reads on providers, complaints, inspections, violations and checklist items"

  - name: LicensingSupervisor
    description: "Regional supervisor who clears checks, decides licences, schedules and finalizes inspections, reviews corrective action plans, assigns investigators, closes complaints, dispositions incident reports and proposes and issues enforcement."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/providers/{provider_id}/clear-checks"
      - "POST /licensing/providers/{provider_id}/license-decision"
      - "POST /licensing/providers/{provider_id}/promote-to-full"
      - "POST /licensing/providers/{provider_id}/restore-full"
      - "POST /licensing/background-checks/{background_check_id}/waiver-decision"
      - "POST /licensing/inspections/{inspection_id}/reopen"
      - "POST /licensing/inspections/{inspection_id}/finalize"
      - "POST /licensing/inspections/{inspection_id}/void"
      - "POST /licensing/complaints/{complaint_id}/assign-investigator"
      - "POST /licensing/complaints/{complaint_id}/close"
      - "POST /licensing/corrective-action-plans/{cap_id}/review"
      - "POST /licensing/corrective-action-plans/{cap_id}/complete"
      - "POST /licensing/enforcement-actions"
      - "POST /licensing/enforcement-actions/{action_id}/issue"
      - "POST /licensing/license-amendments/{amendment_id}/attach-inspection"
      - "POST /licensing/serious-incident-reports/{report_id}/review"
      - "POST /licensing/serious-incident-reports/{report_id}/close"
    shared_operations:
      - "POST /licensing/inspections"
      - "POST /licensing/age-group-rosters/{roster_id}/verify-ratio"
      - "POST /licensing/violations/{violation_id}/disposition (the only role permitted to record VACATED)"
      - "all GET reads"

  - name: BackgroundCheckUnit
    description: "Central clearance unit that opens checks and records registry results. Cannot grant waivers — that is the supervisor's call."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/background-checks/{background_check_id}/result"
    shared_operations:
      - "POST /licensing/background-checks"
      - "GET /licensing/staff-members and GET /licensing/staff-members/{staff_member_id}"
      - "GET /licensing/background-checks and GET /licensing/background-checks/{background_check_id}"

  - name: PublicPortalReader
    description: "Unprivileged consumer-education reader. Read-only access to the public register, provider directory, finalized inspection reports, violations and enforcement history. Never mutates anything."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /licensing/providers and GET /licensing/providers/{provider_id}"
      - "GET /licensing/inspections and GET /licensing/inspections/{inspection_id}"
      - "GET /licensing/violations and GET /licensing/violations/{violation_id}"
      - "GET /licensing/enforcement-actions and GET /licensing/enforcement-actions/{action_id}"
      - "GET /licensing/public-report-postings and GET /licensing/public-report-postings/{posting_id}"
      - "GET /licensing/checklist-items and GET /licensing/checklist-items/{checklist_item_id}"

segregation_of_duties_rules:
  - id: sod-investigator-not-recent-inspector
    constraint: |
      The Inspector assigned as a Complaint's investigator must NOT have
      finalized any Inspection of that complaint's provider within
      SEGREGATION_LOOKBACK_MONTHS (12, lower edge exclusive).
    enforced_at: "POST /licensing/complaints/{complaint_id}/assign-investigator"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - id: sod-cap-reviewer-not-enforcer
    constraint: |
      The LicensingSupervisor X-User-ID that reviewed (APPROVE or REJECT leading
      to APPROVED) the CorrectiveActionPlan for an inspection must NOT be the
      X-User-ID that issues an EnforcementAction whose source_inspection_id is
      that same inspection.
    enforced_at: "POST /licensing/enforcement-actions/{action_id}/issue"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - id: sod-issuer-not-appeal-decider
    constraint: |
      The AgencyAdmin X-User-ID recorded in EnforcementAction.issued_by_user_id
      must NOT be the X-User-ID that decides the appeal on that action.
    enforced_at: "POST /licensing/enforcement-actions/{action_id}/appeal-decision"
    error_id: ERR_SEGREGATION_OF_DUTIES

global_constants:
  SEGREGATION_LOOKBACK_MONTHS: 12
  INSPECTION_MAX_REOPENS: 2
  CAP_MAX_REVIEW_CYCLES: 3
  CAP_SUBMISSION_WINDOW_DAYS: 10
  POSTING_MAX_CORRECTIONS: 2
  POSTING_RETENTION_MONTHS: 36
  CLEARANCE_VALIDITY_MONTHS: 60
  PROVISIONAL_PERIOD_MONTHS: 6
  RISK_LOOKBACK_MONTHS: 24
  REPEAT_LOOKBACK_MONTHS: 24
  APPEAL_WINDOW_DAYS: 15
  PROVIDER_VISIT_BUFFER_MINUTES: 60
  DEFAULT_LOGICAL_CLOCK: "2026-08-01T00:00:00Z"
  REQUIRED_CHECK_TYPES: [FBI_FINGERPRINT, CHILD_ABUSE_REGISTRY]
  COMPLAINT_CATEGORY_CHECKLIST_CODE:
    ABUSE: "SU-101"
    SUPERVISION: "SU-101"
    RATIO: "RA-201"
    BACKGROUND: "BG-301"
    FACILITY: "FA-401"
    NUTRITION: "NU-501"
    RECORDS: "RE-601"
  LATE_INCIDENT_CHECKLIST_CODE: "RE-601"
