              captures: { line_id: "$.data.id" }
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { export_order_id: "${order_id}", lc_number: "LC-CORNER-7401", issuing_bank_swift: "KOEXKRSE", amount_usd: 25000.00, tolerance_pct: 10.00, availability: "SIGHT", usance_days: 0, expiry_date: "2026-12-31T00:00:00Z", latest_shipment_date: "2026-09-20T00:00:00Z", presentation_period_days: 21, required_document_types: ["COMMERCIAL_INVOICE", "PACKING_LIST"] }
              captures: { lc_id: "$.data.id", lc_v: "$.data.version" }
            - call: "GET /export-orders/${order_id}"
              as: ExportOpsCoordinator
