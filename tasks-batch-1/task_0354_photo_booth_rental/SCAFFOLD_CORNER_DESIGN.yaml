  - section: cross_cutting_complexity_layers
    instances:
      - name: confirm_stale_booth_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-booth-claim]", "validations[priority=40]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Confirming with a stale expected_booth_version (the booth's version was bumped by PATCHes after the client read it) returns ERR_STALE_VERSION (412); booking stays DRAFT."
        test_recipe:
          setup:
            - "Premium package; booth read at version 1; the operator PATCHes the booth MAINTENANCE then AVAILABLE (version now 3), but confirm still carries the version 1 captured at booth creation."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v_stale: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 300.00 }
              as: FinanceClerk
            - call: "PATCH /booths/${booth_id}"
              payload: { status: "MAINTENANCE" }
              as: OperationsManager
            - call: "PATCH /booths/${booth_id}"
              payload: { status: "AVAILABLE" }
              as: OperationsManager
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v_stale}" }
