            - "a decide with decision APPROVED on the same claim returns HTTP 200 with status == APPROVED and refund_amount_cents == 3090"
            - "a review attempt with recommendation PARTIAL and recommended_gallons 150.00 on a fresh claim of 100.00 allowable gallons returns HTTP 400 with ERR_INVALID_REQUEST, the review-time guard being the schema rule rather than 410"

      - name: abatement_after_a_partial_payment_returns_abatement_amount_invalid
        claim_type: triggerability
        grounds:
          - errors[ERR_ABATEMENT_AMOUNT_INVALID]
