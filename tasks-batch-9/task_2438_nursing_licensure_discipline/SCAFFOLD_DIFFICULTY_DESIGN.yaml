# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2438 — Nursing Licensure & Discipline
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every grounds entry resolves
# into SCAFFOLD.yaml §1.1–§1.6; every setup_api_calls chain is executable from an
# empty database using only §1.5 endpoints. The logical clock starts at its fixed
# default 2026-08-01T00:00:00Z, so chains that need no time travel issue no
# clock call at all.
#
# Recurring literals used across instances (all pinned, never computed at test time):
#   board OH  : compact_member true, ce_hours_required 30.00, ce_carry_over_cap_hours 5.00,
#               practice_hours_required 960, renewal_period_months 24,
#               renewal_base_fee_cents 12000, max_concurrent_custodian_holds 2,
#               monitoring_clearance_gap_days 90, revocation_vote_threshold_bp 6667,
#               majority_vote_threshold_bp 5001
#   RN license: issued_on 2026-08-01T00:00:00Z, expires_on 2028-08-01T00:00:00Z
#   renewal   : period_start_on 2026-08-01T00:00:00Z, period_end_on 2028-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: ce_provisional_and_audited_variants_diverge_by_eighteen_hours
        grounds:
          - calculations.ce_hour_credit_total
          - entities.RenewalApplication.fields.ce_credit_hours_provisional
          - entities.RenewalApplication.fields.ce_credit_hours_audited
          - entities.CeRecord.fields.provider_accredited
          - state_machines.RenewalApplication.SUBMITTED_to_CE_DEFICIENT
        distinguishing_aspect: |
          The same three CeRecord rows yield 38.00 h under variant provisional_self_reported
          and 20.00 h under variant audited_verified, because the audited variant alone drops
          the unaccredited record and the record whose completion_date falls outside the
          half-open accounting window; the 18.00 h delta flips the renewal from passing the
          submit gate to CE_DEFICIENT.
        test_recipe:
          setup:
            - "Board OH is compact and carries the default ce_hours_required 30.00."
            - "Nurse Dana Reed holds RN license issued 2026-08-01 expiring 2028-08-01, so the renewal window is [2026-08-01, 2028-08-01)."
            - "The logical clock sits at 2028-07-01, one month before expiry, so late_days is 0 and the fee is exactly 12000 cents."
            - "Three CE records are attached and all three are marked VERIFIED: 1200 accredited minutes inside the window, 600 unaccredited minutes inside the window, and 480 accredited SELF_STUDY minutes dated 2026-07-15, before period_start_on."
            - "The renewal is paid and SUBMITTED with ce_credit_hours_provisional 38.00."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { lic_v: $.data.version }
            - call: "POST /renewal-applications"
              payload: { license_id: "${lic_id}", expected_license_version: "${lic_v}", attested_practice_hours: 1800 }
              as: LicensureAnalyst
              captures: { ren_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-100", provider_accredited: true, category: "LIVE_CONTACT", minutes: 1200, completion_date: "2027-03-15T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_ok_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "UNACC-200", provider_accredited: false, category: "LIVE_CONTACT", minutes: 600, completion_date: "2027-04-20T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_unacc_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-300", provider_accredited: true, category: "SELF_STUDY", minutes: 480, completion_date: "2026-07-15T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_stale_id: $.data.id }
            - call: "POST /ce-records/${ce_ok_id}/verification"
              payload: { verification_status: "VERIFIED" }
              as: LicensureAnalyst
            - call: "POST /ce-records/${ce_unacc_id}/verification"
              payload: { verification_status: "VERIFIED" }
              as: LicensureAnalyst
            - call: "POST /ce-records/${ce_stale_id}/verification"
              payload: { verification_status: "VERIFIED" }
              as: LicensureAnalyst
            - call: "POST /renewal-applications/${ren_id}/payment"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /renewal-applications/${ren_id}/submit"
              payload: {}
              as: LicensureAnalyst
          trigger:
            - call: "POST /renewal-applications/${ren_id}/ce-verification"
              payload: {}
              as: LicensureAnalyst
          assert:
            - "CeRecord.${ce_ok_id}.credit_hours == 20.00"
            - "CeRecord.${ce_unacc_id}.credit_hours == 10.00"
            - "CeRecord.${ce_stale_id}.credit_hours == 8.00"
            - "RenewalApplication.${ren_id}.ce_credit_hours_provisional == 38.00"
            - "RenewalApplication.${ren_id}.ce_credit_hours_audited == 20.00"
            - "RenewalApplication.${ren_id}.ce_credit_hours_provisional - RenewalApplication.${ren_id}.ce_credit_hours_audited == 18.00"
            - "RenewalApplication.${ren_id}.renewal_status == CE_DEFICIENT"
            - "RenewalApplication.${ren_id}.fee_applied_cents == 12000 and RenewalApplication.${ren_id}.late_days == 0"

      - name: privilege_variant_flips_multistate_to_single_state
        grounds:
          - calculations.multistate_privilege_determination
          - entities.Nurse.fields.residency_evidence
          - entities.License.fields.multistate_privilege_status
          - entities.License.fields.privilege_variant
          - entities.License.fields.privilege_basis_state
        distinguishing_aspect: |
          One unchanged Nurse row resolves to primary state OH under variant RESIDENCY_DECLARED
          and to MI under variant RESIDENCY_EVIDENCED, because DRIVER_LICENSE (priority 3)
          outranks TAX_RETURN (priority 2); the same License therefore reads MULTISTATE after
          the first determination and SINGLE_STATE after the second, with privilege_basis_state
          moving from OH to MI. This is a different entity domain than the CE instance:
          compact privilege on License, not credit hours on RenewalApplication.
        test_recipe:
          setup:
            - "Board OH is a compact member."
            - "Nurse Kai Moreno declares OH as primary state of residence but files two residency evidence entries: a MI driver licence effective 2026-05-01 at array index 0 and an OH tax return effective 2026-06-01 at array index 1."
            - "The nurse holds a single ACTIVE, CLEAR RN license issued by the OH board; no sibling license exists."
            - "The logical clock stays at its 2026-08-01 default, so both evidence entries are eligible candidates."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-02", program_name: "Scioto BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 9100, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Kai Moreno", birth_year: 1990, ssn_last4: "7712", declared_primary_state: "OH", residency_evidence: [{ evidence_type: "DRIVER_LICENSE", state_code: "MI", effective_date: "2026-05-01T00:00:00Z" }, { evidence_type: "TAX_RETURN", state_code: "OH", effective_date: "2026-06-01T00:00:00Z" }] }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /licenses/${lic_id}/privilege-determination"
              payload: { variant: "RESIDENCY_DECLARED" }
              as: LicensureAnalyst
              captures: { declared_status: $.data.multistate_privilege_status, declared_basis: $.data.privilege_basis_state }
            - call: "POST /licenses/${lic_id}/privilege-determination"
              payload: { variant: "RESIDENCY_EVIDENCED" }
              as: LicensureAnalyst
              captures: { evidenced_status: $.data.multistate_privilege_status, evidenced_basis: $.data.privilege_basis_state }
          assert:
            - "${declared_status} == MULTISTATE and ${declared_basis} == OH"
            - "${evidenced_status} == SINGLE_STATE and ${evidenced_basis} == MI"
            - "License.${lic_id}.privilege_variant == RESIDENCY_EVIDENCED after the second call"
            - "License.${lic_id}.multistate_privilege_status == SINGLE_STATE after the second call"
            - "Nurse.${nurse_id}.declared_primary_state is still OH — no nurse field was mutated by either determination"
            - "Nurse.${nurse_id}.residency_evidence is unchanged, still DRIVER_LICENSE/MI at index 0 and TAX_RETURN/OH at index 1"
            - "License.${lic_id}.license_status == ACTIVE and License.${lic_id}.encumbrance_status == CLEAR throughout — only the privilege triple moved"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: ce_quarter_hour_rounding_order_decides_thirty_hour_boundary
        grounds:
          - calculations.ce_hour_credit_total
          - entities.CeRecord.fields.credit_hours
          - state_machines.RenewalApplication.SUBMITTED_to_CE_VERIFIED
        distinguishing_aspect: |
          Rounding order is the whole test: three 100-minute records quantised per record give
          1.75 h each for 5.25 h, while summing the minutes first (300 min = 5.00 h) gives 5.00 h.
          Added to a 1485-minute record worth exactly 24.75 h, the pinned per-record order totals
          exactly 30.00 h and the renewal passes; the summed-first order totals 29.75 h and the
          renewal would land in CE_DEFICIENT. Same operand set, two orders, different outcome.
        test_recipe:
          setup:
            - "Board OH carries the default ce_hours_required 30.00."
            - "The nurse holds an ACTIVE RN license issued 2026-08-01 expiring 2028-08-01; the clock is moved to 2028-07-01 so the accounting window is [2026-08-01, 2028-08-01) and late_days is 0."
            - "Four CE records are attached, all accredited, all VERIFIED, all completed 2027-05-10 inside the window: one of 1485 minutes and three of 100 minutes each."
            - "The renewal is paid (12000 cents) and SUBMITTED."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-ADN-07", program_name: "Miami Valley ADN", degree_level: "ADN", nclex_first_time_pass_rate_bp: 8400, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Priya Anand", birth_year: 1985, ssn_last4: "3301", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { lic_v: $.data.version }
            - call: "POST /renewal-applications"
              payload: { license_id: "${lic_id}", expected_license_version: "${lic_v}", attested_practice_hours: 2000 }
              as: LicensureAnalyst
              captures: { ren_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-BULK", provider_accredited: true, category: "LIVE_CONTACT", minutes: 1485, completion_date: "2027-05-10T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_bulk_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-S1", provider_accredited: true, category: "LIVE_CONTACT", minutes: 100, completion_date: "2027-05-10T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_s1_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-S2", provider_accredited: true, category: "LIVE_CONTACT", minutes: 100, completion_date: "2027-05-10T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_s2_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-S3", provider_accredited: true, category: "LIVE_CONTACT", minutes: 100, completion_date: "2027-05-10T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_s3_id: $.data.id }
            - call: "POST /ce-records/${ce_bulk_id}/verification"
              payload: { verification_status: "VERIFIED" }
              as: LicensureAnalyst
            - call: "POST /ce-records/${ce_s1_id}/verification"
              payload: { verification_status: "VERIFIED" }
              as: LicensureAnalyst
            - call: "POST /ce-records/${ce_s2_id}/verification"
              payload: { verification_status: "VERIFIED" }
              as: LicensureAnalyst
            - call: "POST /ce-records/${ce_s3_id}/verification"
              payload: { verification_status: "VERIFIED" }
              as: LicensureAnalyst
            - call: "POST /renewal-applications/${ren_id}/payment"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /renewal-applications/${ren_id}/submit"
              payload: {}
              as: LicensureAnalyst
          trigger:
            - call: "POST /renewal-applications/${ren_id}/ce-verification"
              payload: {}
              as: LicensureAnalyst
          assert:
            - "CeRecord.${ce_bulk_id}.credit_hours == 24.75"
            - "CeRecord.${ce_s1_id}.credit_hours == 1.75 and CeRecord.${ce_s2_id}.credit_hours == 1.75 and CeRecord.${ce_s3_id}.credit_hours == 1.75"
            - "RenewalApplication.${ren_id}.ce_credit_hours_audited == 30.00"
            - "RenewalApplication.${ren_id}.ce_credit_hours_audited != 29.75 — the summed-minutes-first order is wrong"
            - "RenewalApplication.${ren_id}.renewal_status == CE_VERIFIED"

      - name: panel_tally_walks_tier_ladder_from_revocation_downward
        grounds:
          - calculations.panel_vote_tally
          - calculations.sanction_severity_floor
          - entities.DisciplinaryProceeding.fields.votes
          - entities.DisciplinaryProceeding.fields.adopted_sanction_tier
          - state_machines.DisciplinaryProceeding.HEARING_CONVENED_to_DELIBERATION
        distinguishing_aspect: |
          The threshold that applies depends on the tier adopted and the tier adoptable depends
          on the threshold, so the evaluation order is pinned: walk i from 6 down to 1 and adopt
          the first tier clearing its own threshold. With five seated members voting 3 REVOCATION,
          1 SUSPENSION and 1 REPRIMAND, i=6 fails (3 * 10000 = 30000 < 6667 * 5 = 33335) and i=5
          passes (4 * 10000 = 40000 >= 5001 * 5 = 25005), so SUSPENSION is adopted even though
          REVOCATION held the plurality. Any other traversal order returns a different tier.
        test_recipe:
          setup:
            - "Board OH keeps revocation_vote_threshold_bp 6667 and majority_vote_threshold_bp 5001."
            - "A FRAUD complaint from an EMPLOYER against the nurse's RN license has been triaged, investigated, had its single EMPLOYER_PERSONNEL records demand produced, and been referred for hearing."
            - "Board member bm-presiding opened the proceeding on 2026-08-01 with hearing_date 2026-09-15 and seated bm-1 through bm-5; no monitoring agreement exists, so recused_member_user_ids is empty and seated_count is 5."
            - "The hearing is CONVENED, freezing sanction_floor_tier at FINE (base index 3 for FRAUD, aggravation 0, mitigation 3 for a clean ATD history plus a fully produced evidence set, net -3, ceil(-1.5) = -1, index 2)."
            - "Five ballots are cast: bm-1, bm-2 and bm-3 for REVOCATION, bm-4 for SUSPENSION, bm-5 for REPRIMAND."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-11", program_name: "Cuyahoga BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8700, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Marta Villalobos", birth_year: 1979, ssn_last4: "9040", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /complaints"
              payload: { license_id: "${lic_id}", complainant_type: "EMPLOYER", violation_category: "FRAUD", incident_date: "2026-07-10T00:00:00Z", allegation_codes: ["FRD-BILL"], employer_custodian_codes: ["MERCY-GEN"] }
              as: Investigator
              as_user_id: "inv-1"
              captures: { comp_id: $.data.id }
            - call: "POST /complaints/${comp_id}/triage"
              payload: { jurisdiction_finding: "JURISDICTION_CONFIRMED" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /complaints/${comp_id}/investigation"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /complaints/${comp_id}/evidence-requests"
              payload: { record_class: "EMPLOYER_PERSONNEL", custodian_code: "MERCY-GEN", hold_start_at: "2026-08-05T00:00:00Z", hold_end_at: "2026-09-05T00:00:00Z" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { ev_id: $.data.id }
            - call: "POST /evidence-requests/${ev_id}/production"
              payload: { page_count: 42 }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /complaints/${comp_id}/evidence-completion"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /complaints/${comp_id}/disposition"
              payload: { disposition: "REFER_TO_PROCEEDING" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "GET /complaints/${comp_id}"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
              captures: { comp_v: $.data.version }
            - call: "POST /disciplinary-proceedings"
              payload: { complaint_id: "${comp_id}", expected_complaint_version: "${comp_v}", seated_member_user_ids: ["bm-1", "bm-2", "bm-3", "bm-4", "bm-5"], hearing_date: "2026-09-15T00:00:00Z", notice_period_days: 30 }
              as: BoardMember
              as_user_id: "bm-presiding"
              captures: { proc_id: $.data.id }
            - call: "POST /disciplinary-proceedings/${proc_id}/hearing-events"
              payload: { event_type: "CONVENE" }
              as: BoardMember
              as_user_id: "bm-presiding"
            - call: "POST /disciplinary-proceedings/${proc_id}/votes"
              payload: { proposed_sanction_tier: "REVOCATION" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /disciplinary-proceedings/${proc_id}/votes"
              payload: { proposed_sanction_tier: "REVOCATION" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /disciplinary-proceedings/${proc_id}/votes"
              payload: { proposed_sanction_tier: "REVOCATION" }
              as: BoardMember
