  # ==========================================================================
  - section: calculations
    instances:

      - name: dry_operating_weight_and_index_with_a_forward_of_reference_crew
        claim_type: correct_result
        grounds:
          - calculations.calculate_dry_operating_weight
          - entities.Flight.fields.crew_arm_m
          - entities.Aircraft.fields.basic_index
        distinguishing_aspect: |
          A crew station aft of the reference arm produces a positive index
          delta, the opposite sign from the fixture used elsewhere: 980 kg at
          18.400 m gives round2(980 * (18.400 - 17.000) / 1000) = 1.37, so
          DOI = 66.56 + 1.37 = 67.93 and DOW = 42380. The lighter crew also
          moves the binding structural limit's value to 20350.00 while keeping
          MZFW as the limiting factor.
        test_recipe:
          setup:
            - "AC1, R1 with the [15,30) band, STD-2026, clock 2026-08-15T06:00:00Z; the flight carries a 980 kg crew at arm 18.400 m and the standard fuel figures."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
          trigger:
            - call: "POST /flights"
              payload: { flight_number: "LX1608", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 980, crew_arm_m: 18.400, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id }
          assert:
            - "HTTP 201"
            - "Flight.${f1}.dry_operating_weight_kg == 42380.00"
            - "Flight.${f1}.dry_operating_index == 67.93"
            - "Flight.${f1}.performance_limited_takeoff_weight_kg == 73810.00"
            - "Flight.${f1}.allowed_payload_kg == 20350.00"
            - "Flight.${f1}.limiting_factor == \"MZFW\""

      - name: performance_band_selection_at_the_lower_inclusive_edge
        claim_type: threshold
        grounds:
          - calculations.calculate_performance_limited_takeoff_weight
          - entities.PerformanceBand.fields.temp_lo_c
        excluded_because:
          difficulty_instance: combinatorial_formula / performance_limited_weight_nonlinear_penalty_stack
          rationale: "That §1.8 instance pins the lower-inclusive / upper-exclusive band edge together with the whole penalty stack (altitude, temperature excess above temp_lo_c, capped wind credit, contamination factor and the floor-to-10 step) at 29.9 C versus 30.0 C."

      - name: wind_credit_is_capped_by_the_declared_maximum
        claim_type: constants_applied
        grounds:
          - calculations.calculate_performance_limited_takeoff_weight
          - calculations.calculate_allowed_payload
        distinguishing_aspect: |
          The wind credit is round2(min(900, max(0, headwind) * 90)). At 10 kt
          the raw credit is exactly 900 and at 12 kt it would be 1080, so both
          flights must report the same PLTOW 74170 — the cap, not the linear
          term, is what fixes the answer. Both remain MZFW-limited at
          20180.00, proving the cap does not leak into the payload waterfall.
        test_recipe:
          setup:
            - "AC1, R1 with the [15,30) band, STD-2026, clock 2026-08-15T06:00:00Z; two flights on the same airframe and runway, spaced so neither the occupancy interval nor the slot window collides: 10:00-12:30 at 10 kt and 13:20-15:00 at 12 kt, both 22 C DRY."
