scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: delivery_fee_provisional_vs_final_diverge_on_route_binding
        grounds:
          - calculations.delivery_fee
          - entities.Order.fields.delivery_fee_cents
          - state_machines.Order.CONFIRMED_to_SCHEDULED
        distinguishing_aspect: |
          Entity domain = Order pricing. The provisional variant (pre-schedule,
          picks route by longest-prefix + smallest-capacity + smallest route_code
          tie-break) and the final variant (post-schedule, uses the bound
          DeliveryWindow's route regardless of prefix ranking) MUST produce
          different delivery_fee_cents when the provisional pick differs from
          the actually-bound route's zone classification.
        test_recipe:
          setup:
            - "Customer CU1 exists, ACTIVE, STANDARD loyalty"
            - "Product P1: CORD / OAK / KILN_DRIED, base_price_cents=40000, moisture_ceiling_pct=20.0, available_qty=10"
            - "Route R_A: route_code=A1, service_postal_prefixes=['01234'], capacity=10.0 (zone A, fee 4500)"
            - "Route R_C: route_code=C1, service_postal_prefixes=['0'], capacity=10.0 (zone C, fee 9500)"
            - "Logical clock 2026-08-01T00:00:00Z (outside winter peak)"
            - "Window W_C on R_C, service_date 2026-08-10, hours 8-12, capacity 10.0, status OPEN"
            - "Order O1 for CU1 with delivery_postal_code='01234', requested_delivery_date='2026-08-10', one line of P1 quantity 1.0 — provisional fee pick = R_A (longest prefix 5) => 4500"
            - "O1 submitted; Invoice paid => CONFIRMED"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu One", email: "cu1@x.com", phone: "1", street_address: "1 Main", postal_code: "01234" }
              as: CustomerService
              captures: { cu1_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P1", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p1_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "A1", depot_name: "North", service_postal_prefixes: ["01234"], capacity_cord_equivalent: 10.0 }
              as: RoutePlanner
              captures: { r_a_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "C1", depot_name: "Far", service_postal_prefixes: ["0"], capacity_cord_equivalent: 10.0 }
              as: RoutePlanner
              captures: { r_c_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r_c_id}", service_date: "2026-08-10", start_hour: 8, end_hour: 12, capacity_cord_equivalent: 10.0 }
              as: RoutePlanner
              captures: { w_c_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu1_id}", delivery_street_address: "1 Main", delivery_postal_code: "01234", requested_delivery_date: "2026-08-10", lines: [{ product_id: "${p1_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o1_id: $.data.id, o1_fee_provisional: $.data.delivery_fee_cents, o1_v: $.data.version }
            - call: "POST /api/v1/orders/${o1_id}/submit"
              payload: {}
              as: CustomerService
            - call: "GET /api/v1/orders/${o1_id}"
              payload: {}
              as: CustomerService
              captures: { o1_inv_v: $.data.version }
            - call: "GET /api/v1/invoices"
              payload: { order_id: "${o1_id}" }
              as: CustomerService
              captures: { inv1_id: "$.data[0].id" }
            - call: "POST /api/v1/orders/${o1_id}/payments"
              payload: { event_kind: "AUTHORIZE", amount_cents: 54000, external_ref: "auth-1" }
              as: CustomerService
            - call: "POST /api/v1/orders/${o1_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 54000, external_ref: "cap-1" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o1_id}"
              payload: {}
              as: RoutePlanner
              captures: { o1_v_pre_sched: $.data.version }
          trigger:
            - call: "POST /api/v1/orders/${o1_id}/schedule"
              payload: { delivery_window_id: "${w_c_id}", expected_order_version: "${o1_v_pre_sched}" }
              as: RoutePlanner
              captures: { o1_fee_final: $.data.delivery_fee_cents }
          assert:
            - "Order.${o1_id}.delivery_fee_cents provisional == 4500 (route A1, prefix len 5 wins)"
            - "After binding to W_C on route C1, Order.${o1_id}.delivery_fee_cents == 9500 (final variant uses bound route's zone)"
            - "Order.${o1_id}.delivery_fee_cents final != provisional (divergence = 5000)"

      - name: clawback_provisional_vs_final_on_post_cancellation_delivery
        grounds:
          - calculations.subscription_early_termination_clawback
          - entities.Subscription.fields.status
          - state_machines.Subscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Entity domain = Subscription clawback (different from Order pricing).
          Provisional variant sums subscription_discount_cents over only the
          orders DELIVERED at cancellation time. Final variant runs an audit
          reconciliation pass that ALSO includes orders which flipped to
          DELIVERED within 7 logical days after cancellation, producing a
          different (larger) clawback total — posted as ADJUST_CREDIT.
        test_recipe:
          setup:
            - "Customer CU2 ACTIVE, STANDARD"
            - "Product P_KILN: CORD/OAK/KILN_DRIED, base_price_cents=40000, moisture_ceiling 20.0, available 50"
            - "Subscription S2: HEARTH_PLUS (discount_pct=0.08), season_year=2026, commitment 4.0, prepaid 0, activated before Nov 1"
            - "Route R: code R1, prefixes ['0'], capacity 50.0"
            - "Window W1: date 2026-12-20, hours 8-18, capacity 50.0, OPEN"
            - "Order O_A delivered (line qty 5.0) on 2026-12-20 — subscription_discount_cents on this order = 8% of post-volume-discount base"
            - "Order O_B (line qty 1.0) is SCHEDULED at time of cancellation, delivered 3 logical days later"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Two", email: "cu2@x.com", phone: "2", street_address: "2 Elm", postal_code: "02111" }
              as: CustomerService
              captures: { cu2_id: $.data.id, cu2_v0: $.data.version }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu2_id}", tier: "HEARTH_PLUS", season_year: 2026, commitment_cord_equivalent: 4.0, prepaid_cents: 0, discount_pct: 0.08, expected_customer_version: "${cu2_v0}" }
              as: CustomerService
              captures: { s2_id: $.data.id }
            - call: "POST /api/v1/subscriptions/${s2_id}/activate"
              payload: {}
              as: OperationsManager
            - call: "POST /api/v1/products"
              payload: { sku: "P_KILN", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 50 }
              as: OperationsManager
              captures: { pk_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R1", depot_name: "Central", service_postal_prefixes: ["0"], capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { r1_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r1_id}", service_date: "2026-12-20", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w1_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu2_id}", delivery_street_address: "2 Elm", delivery_postal_code: "02111", requested_delivery_date: "2026-12-20", subscription_id: "${s2_id}", lines: [{ product_id: "${pk_id}", quantity: 5.0 }] }
              as: CustomerService
              captures: { oa_id: $.data.id }
            - call: "POST /api/v1/orders/${oa_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${oa_id}/payments"
              payload: { event_kind: "AUTHORIZE", amount_cents: 219560, external_ref: "auth-a" }
              as: CustomerService
            - call: "POST /api/v1/orders/${oa_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 219560, external_ref: "cap-a" }
              as: CustomerService
            - call: "GET /api/v1/orders/${oa_id}"
              payload: {}
              as: RoutePlanner
              captures: { oa_v: $.data.version }
            - call: "POST /api/v1/orders/${oa_id}/schedule"
              payload: { delivery_window_id: "${w1_id}", expected_order_version: "${oa_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-20T10:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-windows/${w1_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/orders/${oa_id}/dispatch"
              payload: {}
              as: Driver
            - call: "GET /api/v1/orders/${oa_id}/lines"
              payload: {}
              as: Driver
              captures: { oa_line_id: "$.data[0].id" }
            - call: "POST /api/v1/order-lines/${oa_line_id}/moisture-readings"
              payload: { moisture_pct: 18.5 }
              as: Driver
            - call: "POST /api/v1/orders/${oa_id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu2_id}", delivery_street_address: "2 Elm", delivery_postal_code: "02111", requested_delivery_date: "2026-12-22", subscription_id: "${s2_id}", lines: [{ product_id: "${pk_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { ob_id: $.data.id }
            - call: "POST /api/v1/orders/${ob_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${ob_id}/payments"
              payload: { event_kind: "AUTHORIZE", amount_cents: 43540, external_ref: "auth-b" }
              as: CustomerService
            - call: "POST /api/v1/orders/${ob_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 43540, external_ref: "cap-b" }
              as: CustomerService
            - call: "GET /api/v1/orders/${ob_id}"
              payload: {}
              as: RoutePlanner
              captures: { ob_v: $.data.version }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r1_id}", service_date: "2026-12-22", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w2_id: $.data.id }
            - call: "POST /api/v1/orders/${ob_id}/schedule"
              payload: { delivery_window_id: "${w2_id}", expected_order_version: "${ob_v}" }
              as: RoutePlanner
          trigger:
            - call: "POST /api/v1/subscriptions/${s2_id}/cancel"
              payload: { reason: "cust request" }
              as: CustomerService
              captures: { s2_after_cancel: $.data }
          assert:
            - "Provisional clawback at cancellation == subscription_discount of O_A only (O_B was SCHEDULED, not DELIVERED, contributes 0)"
            - "After O_B is subsequently delivered on 2026-12-22 (within 7 logical days), final clawback recomputes to include O_B's subscription_discount"
            - "Customer.${cu2_id}.credit_balance_cents reflects provisional clawback immediately; a follow-up ADJUST_CREDIT PaymentEvent is posted for the final-minus-provisional delta"

  # ==========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: volume_tier_marginal_straddle_across_boundary
        grounds:
          - calculations.volume_tiered_discount
          - entities.OrderLine.fields.volume_tier_applied
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction. The
          tier selection depends on order-level cumulative cord_equivalent
          (input 1), the current line's quantity (input 2), and the line's
          unit price driven by seasoned_grade (input 3). A line whose cumulative
          range straddles the 2.0 boundary is split marginally: portion below
          boundary at 0% discount, portion at-or-above at 4% discount. Round
          ONCE per line after summing portions — not per portion.
        test_recipe:
          setup:
            - "Customer CU3 STANDARD"
            - "Product P_CORD: CORD/MAPLE/SEMI_SEASONED, base_price_cents=30000, moisture_ceiling 25.0, available 50"
            - "Order O3 with single line quantity 3.0 (3.0 cord-equivalent; straddles 2.0 boundary: 2.0 at T0 rate, 1.0 at T1 rate)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Three", email: "cu3@x.com", phone: "3", street_address: "3 Oak", postal_code: "10001" }
              as: CustomerService
              captures: { cu3_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P_CORD", product_kind: "CORD", species: "MAPLE", seasoned_grade: "SEMI_SEASONED", base_price_cents: 30000, moisture_ceiling_pct: 25.0, available_qty: 50 }
              as: OperationsManager
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu3_id}", delivery_street_address: "3 Oak", delivery_postal_code: "10001", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${pc_id}", quantity: 3.0 }] }
              as: CustomerService
              captures: { o3_id: $.data.id, o3_subtotal: $.data.subtotal_cents, o3_vol_disc: $.data.volume_discount_cents }
          assert:
            - "Order.${o3_id}.subtotal_cents == 90000 (3.0 × 30000 × 1.00 grade mult)"
            - "Line volume_tier_applied == T1 (line reaches T1 cumulatively, marginal split: 2.0 CE at 0%, 1.0 CE at 4%)"
            - "Line extended_price_cents == round_half_up(2.0*30000*1.00 + 1.0*30000*0.96) == 60000 + 28800 == 88800"
            - "Order.${o3_id}.volume_discount_cents == 1200 (== 90000 - 88800)"

      - name: stacking_fee_circular_evaluation_order_pinned
        grounds:
          - calculations.stacking_fee
          - calculations.order_total
          - entities.Order.fields.stacking_fee_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. stacking_fee depends on
          Order.total_cord_equivalent (which depends on lines), and
          order_total depends on stacking_fee. Scaffold pins the order:
          cord_equivalent → grade multiplier → volume tier → subscription →
          loyalty → seasonal → stacking_fee → delivery_fee → order_total.
          A different evaluation order would produce a different total.
        test_recipe:
          setup:
            - "Customer CU4 GOLD (lifetime 12.0), subscription ESTATE (12% disc, stacking included)"
            - "Product P: CORD/OAK/KILN_DRIED base 40000, moisture 20, qty 50"
            - "Order O4 with stacking_addon=true, subscription attached, requested_delivery_date 2026-12-20 (inside winter peak)"
            - "Quantity 9.0 → total_ce = 9.0 (T3 volume tier, GOLD waives seasonal, ESTATE subscription waives stacking)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Four", email: "cu4@x.com", phone: "4", street_address: "4 Birch", postal_code: "20002" }
              as: CustomerService
              captures: { cu4_id: $.data.id, cu4_v0: $.data.version }
            - call: "POST /api/v1/customers/${cu4_id}/wallet-adjustments"
              payload: { amount_cents: 0, reason: "noop" }
              as: OperationsManager
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu4_id}", tier: "ESTATE", season_year: 2026, commitment_cord_equivalent: 8.0, prepaid_cents: 0, discount_pct: 0.12, expected_customer_version: "${cu4_v0}" }
              as: CustomerService
              captures: { s4_id: $.data.id }
            - call: "POST /api/v1/subscriptions/${s4_id}/activate"
              payload: {}
              as: OperationsManager
            - call: "POST /api/v1/products"
              payload: { sku: "P4", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 50 }
              as: OperationsManager
              captures: { p4_id: $.data.id }
            # Drive CU4 to GOLD via 12.0 CE delivered (two orders of 6.0 CE each delivered outside winter peak)
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R4", depot_name: "Central", service_postal_prefixes: ["2"], capacity_cord_equivalent: 100.0 }
              as: RoutePlanner
              captures: { r4_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r4_id}", service_date: "2026-10-20", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 100.0 }
              as: RoutePlanner
              captures: { w4a_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu4_id}", delivery_street_address: "4 Birch", delivery_postal_code: "20002", requested_delivery_date: "2026-10-20", lines: [{ product_id: "${p4_id}", quantity: 6.0 }] }
              as: CustomerService
              captures: { o4a_id: $.data.id }
            - call: "POST /api/v1/orders/${o4a_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o4a_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 248520, external_ref: "cap-4a" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o4a_id}"
              payload: {}
              as: RoutePlanner
              captures: { o4a_v: $.data.version }
            - call: "POST /api/v1/orders/${o4a_id}/schedule"
              payload: { delivery_window_id: "${w4a_id}", expected_order_version: "${o4a_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T10:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-windows/${w4a_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/orders/${o4a_id}/dispatch"
              payload: {}
              as: Driver
            - call: "GET /api/v1/orders/${o4a_id}/lines"
              payload: {}
              as: Driver
              captures: { o4a_line: "$.data[0].id" }
            - call: "POST /api/v1/order-lines/${o4a_line}/moisture-readings"
              payload: { moisture_pct: 18.0 }
              as: Driver
            - call: "POST /api/v1/orders/${o4a_id}/deliver"
              payload: {}
              as: Driver
            # Second order to push lifetime CE over GOLD threshold of 10.0
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r4_id}", service_date: "2026-10-25", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 100.0 }
              as: RoutePlanner
              captures: { w4b_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu4_id}", delivery_street_address: "4 Birch", delivery_postal_code: "20002", requested_delivery_date: "2026-10-25", lines: [{ product_id: "${p4_id}", quantity: 6.0 }] }
              as: CustomerService
              captures: { o4b_id: $.data.id }
            - call: "POST /api/v1/orders/${o4b_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o4b_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 248520, external_ref: "cap-4b" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o4b_id}"
              payload: {}
              as: RoutePlanner
              captures: { o4b_v: $.data.version }
            - call: "POST /api/v1/orders/${o4b_id}/schedule"
              payload: { delivery_window_id: "${w4b_id}", expected_order_version: "${o4b_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-25T10:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-windows/${w4b_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/orders/${o4b_id}/dispatch"
              payload: {}
              as: Driver
            - call: "GET /api/v1/orders/${o4b_id}/lines"
              payload: {}
              as: Driver
              captures: { o4b_line: "$.data[0].id" }
            - call: "POST /api/v1/order-lines/${o4b_line}/moisture-readings"
              payload: { moisture_pct: 18.0 }
              as: Driver
            - call: "POST /api/v1/orders/${o4b_id}/deliver"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu4_id}", delivery_street_address: "4 Birch", delivery_postal_code: "20002", requested_delivery_date: "2026-12-20", subscription_id: "${s4_id}", stacking_addon: true, lines: [{ product_id: "${p4_id}", quantity: 9.0 }] }
              as: CustomerService
              captures: { o4_id: $.data.id, o4_total: $.data.total_cents, o4_stacking: $.data.stacking_fee_cents, o4_seasonal: $.data.seasonal_surcharge_cents }
          assert:
            - "CU4.loyalty_tier == GOLD after 12.0 lifetime CE delivered"
            - "O4.subtotal_cents == 9.0 × 40000 × 1.35 == 486000"
            - "O4.volume_discount: 9.0 CE crosses T3 (>=8.0) — marginal split: 2.0@0% + 2.0@4% + 4.0@7% + 1.0@11% on 40000×1.35=54000 unit"
            - "O4.volume_discount_cents == 2*54000*0.00 + 2*54000*0.04 + 4*54000*0.07 + 1*54000*0.11 (applied marginally) == 0 + 4320 + 15120 + 5940 == 25380"
            - "O4.subscription_discount_cents == round_half_up((486000-25380)*0.12) == round_half_up(55274.4) == 55274"
            - "O4.loyalty_discount_cents == round_half_up((486000-25380-55274)*0.04) == round_half_up(16213.84) == 16214"
            - "O4.seasonal_surcharge_cents == 0 (GOLD waives surcharge even inside winter peak)"
            - "O4.stacking_fee_cents == 0 (ESTATE subscription includes stacking, even though stacking_addon=true)"
            - "O4.delivery_fee_cents == 6500 + 1500 + 1500 == 9500 (zone B '20002' prefix len 5 actually zone A — pinned test: depot prefixes ['2'], len 1 -> zone C 9500 + bulk 1500 (total_ce>4) + bulk 1500 (total_ce>8) == 12500)"
            - "O4.total_cents == 486000 - 25380 - 55274 - 16214 + 0 + 0 + 12500 == 401632"

  # ==========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_axes_payment_and_fulfillment_independent
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent parallel state dimensions
          (payment_status × fulfillment_status) on the same row. A PAYMENT_FAILED
          → UNPAID reset on the payment axis does not disturb the fulfillment
          axis remaining PENDING_PAYMENT; conversely a cancel on the fulfillment
          axis (DRAFT → CANCELLED) leaves payment_status at UNPAID.
        test_recipe:
          setup:
            - "Customer CU5 ACTIVE; Product P5 (CORD/OAK/KILN_DRIED 40000, moisture 20, qty 10)"
            - "Order O5 created and submitted -> fulfillment=PENDING_PAYMENT, payment=UNPAID"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Five", email: "cu5@x.com", phone: "5", street_address: "5 Pine", postal_code: "30003" }
              as: CustomerService
              captures: { cu5_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P5", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p5_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu5_id}", delivery_street_address: "5 Pine", delivery_postal_code: "30003", requested_delivery_date: "2026-08-10", lines: [{ product_id: "${p5_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o5_id: $.data.id }
            - call: "POST /api/v1/orders/${o5_id}/submit"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /api/v1/orders/${o5_id}/payments"
              payload: { event_kind: "AUTHORIZE", amount_cents: 54000, external_ref: "decline-1" }
              as: CustomerService
              captures: { ev_decline: $.data }
            # simulate processor declining — the payment-axis moves to PAYMENT_FAILED
            # (Test asserts fulfillment is UNTOUCHED by the payment-axis transition)
          assert:
            - "After declined AUTHORIZE, Order.${o5_id}.payment_status == PAYMENT_FAILED"
            - "Order.${o5_id}.fulfillment_status remains PENDING_PAYMENT (unchanged by payment-axis mutation)"
            - "Reset failure via payments reset-failure: payment_status back to UNPAID, fulfillment still PENDING_PAYMENT"

      - name: subscription_cyclic_seasonal_with_terminal_branching
        grounds:
          - state_machines.Subscription
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Subscription exhibits a non-linear shape with FOUR distinct terminal
          branches from ACTIVE (FULFILLED via delivery, SHORTFALL via season
          sweep, EXPIRED via sweep defensive branch, CANCELLED via actor) —
          not a linear pipeline. The branch taken depends on cumulative
          delivered_cord_equivalent vs commitment at two distinct trigger types
          (delivery-side bubble-up vs clock-driven sweep).
        test_recipe:
          setup:
            - "Customer CU6 ACTIVE; Subscription S6a HEARTH (commitment 2.0) season 2026"
            - "Subscription S6b HEARTH (commitment 2.0) season 2026 on different customer CU7"
            - "Product P6 (CORD/OAK/KILN_DRIED 40000, qty 100)"
            - "Route R6 prefixes ['4'] cap 100; window W6 date 2027-01-15 cap 100"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Six", email: "cu6@x.com", phone: "6", street_address: "6 Ash", postal_code: "40006" }
              as: CustomerService
              captures: { cu6_id: $.data.id, cu6_v0: $.data.version }
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Seven", email: "cu7@x.com", phone: "7", street_address: "7 Ash", postal_code: "40007" }
              as: CustomerService
              captures: { cu7_id: $.data.id, cu7_v0: $.data.version }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu6_id}", tier: "HEARTH", season_year: 2026, commitment_cord_equivalent: 2.0, prepaid_cents: 0, discount_pct: 0.05, expected_customer_version: "${cu6_v0}" }
              as: CustomerService
              captures: { s6a_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu7_id}", tier: "HEARTH", season_year: 2026, commitment_cord_equivalent: 2.0, prepaid_cents: 0, discount_pct: 0.05, expected_customer_version: "${cu7_v0}" }
              as: CustomerService
              captures: { s6b_id: $.data.id }
            - call: "POST /api/v1/subscriptions/${s6a_id}/activate"
              payload: {}
              as: OperationsManager
            - call: "POST /api/v1/subscriptions/${s6b_id}/activate"
              payload: {}
              as: OperationsManager
            - call: "POST /api/v1/products"
              payload: { sku: "P6", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 100 }
              as: OperationsManager
              captures: { p6_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R6", depot_name: "East", service_postal_prefixes: ["4"], capacity_cord_equivalent: 100.0 }
              as: RoutePlanner
              captures: { r6_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r6_id}", service_date: "2027-01-15", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 100.0 }
              as: RoutePlanner
              captures: { w6_id: $.data.id }
            # CU6 delivers 2.5 CE inside window — FULFILLED
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu6_id}", delivery_street_address: "6 Ash", delivery_postal_code: "40006", requested_delivery_date: "2027-01-15", subscription_id: "${s6a_id}", lines: [{ product_id: "${p6_id}", quantity: 2.5 }] }
              as: CustomerService
              captures: { o6_id: $.data.id }
            - call: "POST /api/v1/orders/${o6_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o6_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 126825, external_ref: "cap-6" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o6_id}"
              payload: {}
              as: RoutePlanner
              captures: { o6_v: $.data.version }
            - call: "POST /api/v1/orders/${o6_id}/schedule"
              payload: { delivery_window_id: "${w6_id}", expected_order_version: "${o6_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T10:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-windows/${w6_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/orders/${o6_id}/dispatch"
              payload: {}
              as: Driver
            - call: "GET /api/v1/orders/${o6_id}/lines"
              payload: {}
              as: Driver
              captures: { o6_line: "$.data[0].id" }
            - call: "POST /api/v1/order-lines/${o6_line}/moisture-readings"
              payload: { moisture_pct: 18.0 }
              as: Driver
            - call: "POST /api/v1/orders/${o6_id}/deliver"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/_sweep/season_end"
              payload: { season_year: 2026 }
              as: OperationsManager
          assert:
            - "Subscription.${s6a_id}.status == FULFILLED (delivered 2.5 >= commitment 2.0; transitioned by delivery bubble-up, NOT sweep)"
            - "Subscription.${s6b_id}.status == SHORTFALL (delivered 0 < commitment 2.0 at sweep)"
            - "S6b shortfall invoice posted: shortfall_penalty = (2.0-0) * (KILN_DRIED CORD reference price) * 0.20"

  # ==========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_cascade_order_subscription_customer_loyalty
        grounds:
          - state_machines.Order.OUT_FOR_DELIVERY_to_DELIVERED
          - state_machines.Subscription.ACTIVE_to_FULFILLED
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          Depth-3 cascade triggered by Driver POST /deliver. Link 1: Order
          OUT_FOR_DELIVERY → DELIVERED increments Subscription.delivered_cord_equivalent.
          Link 2: that mutation crosses commitment_cord_equivalent, which itself
          triggers Subscription ACTIVE → FULFILLED. Link 3: the same delivery
          also mutates Customer.lifetime_cord_equivalent_delivered, which
          recomputes Customer.loyalty_tier. Each link is CAUSED by the prior
          link, not by the original deliver call.
        test_recipe:
          setup:
            - "Customer CU8 lifetime_ce=9.5 (just below GOLD threshold of 10.0)"
            - "Subscription S8 ESTATE (commitment 8.0) ACTIVE, delivered_ce=7.5 (just below commitment)"
            - "Order O8 with total_ce=1.0 OUT_FOR_DELIVERY in a LOCKED window, moisture readings all pass"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Eight", email: "cu8@x.com", phone: "8", street_address: "8 Fir", postal_code: "50008" }
              as: CustomerService
              captures: { cu8_id: $.data.id, cu8_v0: $.data.version }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu8_id}", tier: "ESTATE", season_year: 2026, commitment_cord_equivalent: 8.0, prepaid_cents: 0, discount_pct: 0.12, expected_customer_version: "${cu8_v0}" }
              as: CustomerService
              captures: { s8_id: $.data.id }
            - call: "POST /api/v1/subscriptions/${s8_id}/activate"
              payload: {}
              as: OperationsManager
            - call: "POST /api/v1/products"
              payload: { sku: "P8", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 200 }
              as: OperationsManager
              captures: { p8_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R8", depot_name: "West", service_postal_prefixes: ["5"], capacity_cord_equivalent: 200.0 }
              as: RoutePlanner
              captures: { r8_id: $.data.id }
            # Deliver one order of 7.5 CE to set up subscription.delivered_ce=7.5 and lifetime=7.5
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r8_id}", service_date: "2026-11-15", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 200.0 }
              as: RoutePlanner
              captures: { w8a_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu8_id}", delivery_street_address: "8 Fir", delivery_postal_code: "50008", requested_delivery_date: "2026-11-15", subscription_id: "${s8_id}", lines: [{ product_id: "${p8_id}", quantity: 7.5 }] }
              as: CustomerService
              captures: { o8a_id: $.data.id }
            - call: "POST /api/v1/orders/${o8a_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o8a_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 360360, external_ref: "cap-8a" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o8a_id}"
              payload: {}
              as: RoutePlanner
              captures: { o8a_v: $.data.version }
            - call: "POST /api/v1/orders/${o8a_id}/schedule"
              payload: { delivery_window_id: "${w8a_id}", expected_order_version: "${o8a_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T10:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-windows/${w8a_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/orders/${o8a_id}/dispatch"
              payload: {}
              as: Driver
            - call: "GET /api/v1/orders/${o8a_id}/lines"
              payload: {}
              as: Driver
              captures: { o8a_line: "$.data[0].id" }
            - call: "POST /api/v1/order-lines/${o8a_line}/moisture-readings"
              payload: { moisture_pct: 18.0 }
              as: Driver
            - call: "POST /api/v1/orders/${o8a_id}/deliver"
              payload: {}
              as: Driver
            # Deliver second order of 2.0 CE to push lifetime_ce to 9.5 and subscription.delivered_ce to 9.5... wait,
            # we need subscription at 7.5 just before the trigger delivery of 1.0. Adjust: deliver 7.5 first, then 1.0 hits FULFILLED at 8.5
            # Also need lifetime just below GOLD — use 8.5 for this customer? No, threshold is 10.0. Use a separate top-up.
            # Simpler: skip the 9.5 setup and use the SAME trigger delivery to test BOTH cascades via a 2.5 CE order.
            # Rewriting: cancel this and instead start subscription at 7.5 delivered (via o8a above); lifetime at 7.5.
            # Then trigger delivery of 2.5 CE → subscription 7.5+2.5=10.0 >= 8.0 → FULFILLED; lifetime 7.5+2.5=10.0 >= 10.0 → GOLD.
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r8_id}", service_date: "2026-12-10", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 200.0 }
              as: RoutePlanner
              captures: { w8b_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu8_id}", delivery_street_address: "8 Fir", delivery_postal_code: "50008", requested_delivery_date: "2026-12-10", subscription_id: "${s8_id}", lines: [{ product_id: "${p8_id}", quantity: 2.5 }] }
              as: CustomerService
              captures: { o8b_id: $.data.id }
            - call: "POST /api/v1/orders/${o8b_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o8b_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 122122, external_ref: "cap-8b" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o8b_id}"
              payload: {}
              as: RoutePlanner
              captures: { o8b_v: $.data.version }
            - call: "POST /api/v1/orders/${o8b_id}/schedule"
              payload: { delivery_window_id: "${w8b_id}", expected_order_version: "${o8b_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T10:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-windows/${w8b_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/orders/${o8b_id}/dispatch"
              payload: {}
              as: Driver
            - call: "GET /api/v1/orders/${o8b_id}/lines"
              payload: {}
              as: Driver
              captures: { o8b_line: "$.data[0].id" }
            - call: "POST /api/v1/order-lines/${o8b_line}/moisture-readings"
              payload: { moisture_pct: 18.0 }
              as: Driver
          trigger:
            - call: "POST /api/v1/orders/${o8b_id}/deliver"
              payload: {}
              as: Driver
          assert:
            - "Link1: Order.${o8b_id}.fulfillment_status == DELIVERED"
            - "Link2: Subscription.${s8_id}.delivered_cord_equivalent == 10.0 AND Subscription.${s8_id}.status == FULFILLED (bubble-up from delivery)"
            - "Link3: Customer.${cu8_id}.lifetime_cord_equivalent_delivered == 10.0 AND Customer.${cu8_id}.loyalty_tier == GOLD (recomputed from lifetime_ce)"
            - "Product.${p8_id}.reserved_qty decreased by 2.5 (reservation released on delivery)"

      - name: window_lock_cascade_window_order_delivery_eligibility
        grounds:
          - state_machines.DeliveryWindow.OPEN_to_LOCKED
          - state_machines.Order.SCHEDULED_to_OUT_FOR_DELIVERY
        distinguishing_aspect: |
          Depth-2 cascade triggered by RoutePlanner POST /delivery-windows/{id}/lock.
          Link 1: Window OPEN → LOCKED changes window state. Link 2: that mutation
          is a PRECONDITION for the Order SCHEDULED → OUT_FOR_DELIVERY transition —
          dispatch calls referencing this window now succeed where they previously
          failed. The dispatch's own mutation is enabled by the lock cascade.
        test_recipe:
          setup:
            - "Customer CU9 ACTIVE; Product P9; Route R9 prefixes ['6'] cap 50"
            - "Window W9 date 2026-08-20 hours 8-12 cap 50 OPEN"
            - "Order O9 CONFIRMED, PAID, scheduled into W9"
            - "Clock at 2026-08-20T09:00:00Z (within window hours)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Nine", email: "cu9@x.com", phone: "9", street_address: "9 Cedar", postal_code: "60009" }
              as: CustomerService
              captures: { cu9_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P9", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 50 }
              as: OperationsManager
              captures: { p9_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R9", depot_name: "North", service_postal_prefixes: ["6"], capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { r9_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r9_id}", service_date: "2026-08-20", start_hour: 8, end_hour: 12, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w9_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu9_id}", delivery_street_address: "9 Cedar", delivery_postal_code: "60009", requested_delivery_date: "2026-08-20", lines: [{ product_id: "${p9_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o9_id: $.data.id }
            - call: "POST /api/v1/orders/${o9_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o9_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 53500, external_ref: "cap-9" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o9_id}"
              payload: {}
              as: RoutePlanner
              captures: { o9_v: $.data.version }
            - call: "POST /api/v1/orders/${o9_id}/schedule"
              payload: { delivery_window_id: "${w9_id}", expected_order_version: "${o9_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/orders/${o9_id}/dispatch"
              payload: {}
              as: Driver
              captures: { dispatch_attempt_err: $.data.error_id }
            - call: "POST /api/v1/delivery-windows/${w9_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/orders/${o9_id}/dispatch"
              payload: {}
              as: Driver
          assert:
            - "First dispatch attempt (window still OPEN) rejected with ERR_INVALID_STATE (window not LOCKED)"
            - "After lock cascade (Link1: W9 OPEN→LOCKED), second dispatch (Link2: enabled by lock) succeeds"
            - "Order.${o9_id}.fulfillment_status == OUT_FOR_DELIVERY"

  # ==========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_schedule_call
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WINDOW_CLOSED_FOR_SCHEDULING]
        distinguishing_aspect: |
          Error-category pair = state (priority 5) vs business_temporal (priority 13).
          A schedule call where the Order is in PENDING_PAYMENT (state violation)
          AND the target window is in the past (temporal violation) MUST return
          ERR_INVALID_STATE — the priority-5 state error wins over priority-13.
        test_recipe:
          setup:
            - "Customer CU10, Product P10, Route R10 prefixes ['7']"
            - "Window W10 date 2026-07-01 (in the past relative to clock 2026-08-01)"
            - "Order O10 created but NOT submitted (still DRAFT — fails state check for scheduling)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Ten", email: "cu10@x.com", phone: "10", street_address: "10 Larch", postal_code: "70010" }
              as: CustomerService
              captures: { cu10_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P10", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p10_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R10", depot_name: "South", service_postal_prefixes: ["7"], capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { r10_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r10_id}", service_date: "2026-07-01", start_hour: 8, end_hour: 12, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w10_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu10_id}", delivery_street_address: "10 Larch", delivery_postal_code: "70010", requested_delivery_date: "2026-07-01", lines: [{ product_id: "${p10_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o10_id: $.data.id, o10_v: $.data.version }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/orders/${o10_id}/schedule"
              payload: { delivery_window_id: "${w10_id}", expected_order_version: "${o10_v}" }
              as: RoutePlanner
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_INVALID_STATE (priority 5 state violation beats priority 13 temporal)"

