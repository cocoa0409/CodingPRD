            - { call: "POST /api/harvest-logs/${log_id}/transition", payload: { to_state: "DRAFT" }, as: Volunteer, as_user_id: "${v1_id}", captures: { st_draft: $.data.status, draft_reason: $.data.rejection_reason } }
