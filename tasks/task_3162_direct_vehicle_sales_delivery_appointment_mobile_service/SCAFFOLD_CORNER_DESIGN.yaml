      - name: finance_decision_is_scoped_to_the_decision_step_only
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority=18]
          - errors[ERR_BUYER_NOT_VERIFIED]
          - entities.FinancingApplication.fields.status
        distinguishing_aspect: "The lending guard reads the applicant's verification flag: a decision taken before identity verification returns 403 with ERR_BUYER_NOT_VERIFIED, and the same call after verification returns 200 with a computed band and payment."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a TX regime ENACTED, a center, a configuration and a verified buyer; order placed, paid and locked; a 72-month application with 0 down."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
          trigger:
            - call: "POST /v1/orders/${ord_id}/financing-applications"
              payload: { term_months: 72, down_payment_cents: 0, include_trade_in_credit: false }
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/financing-applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: FinancePartner
              captures: { app_state: $.data.status, app_band: $.data.credit_band }
          assert:
            - "the decision returns 200 with status CONDITIONALLY_APPROVED and credit_band NEAR_PRIME"
            - "FinancingApplication.${app_id}.amount_financed_cents == 4919000 (provisional total 4919000 for this plain configuration, minus a 0 down payment)"
            - "FinancingApplication.${app_id}.apr_bps == 890 (NEAR_PRIME with term_months 72)"
            - "FinancingApplication.${app_id}.monthly_payment_cents == 88424"
            - "a second application on the same order with down_payment_cents 1200000 reports amount_financed_cents 3719000 and a lower monthly_payment_cents than the first, confirming the guard tracks the financed principal"

      - name: conditional_validation_refuses_an_expired_offer_at_accept_time
        claim_type: Temporal Validation
        grounds:
          - errors[ERR_APPRAISAL_OFFER_EXPIRED]
          - state_machines.TradeInAppraisal.OFFERED_to_ACCEPTED
          - entities.TradeInAppraisal.fields.offer_valid_until
        distinguishing_aspect: "An offer that was valid when published stops being acceptable once the clock passes offer_valid_until, so the same accept call returns 409 with ERR_APPRAISAL_OFFER_EXPIRED and no ledger entry is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a placed, paid order with an appraisal offered and valid until 2026-09-05T00:00:00Z; the clock is then advanced to 2026-09-06T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - call: "POST /v1/orders/${ord_id}/trade-in-appraisals"
