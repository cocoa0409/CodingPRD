              as: FilmOfficeCoordinator
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app1_id}", street_segment_id: "${seg1_id}", closure_start_at: "2026-06-01T08:00:00Z", closure_end_at: "2026-06-01T12:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc1_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc2_id}", title: "A2", synopsis: "x", shoot_start_at: "2026-06-01T06:00:00Z", shoot_end_at: "2026-06-01T20:00:00Z", crew_size: 5, requires_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc2_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /applications/${app2_id}/location-details"
              payload: { address: "2 Main", geo_zone: "Z7", activity_type: "FILMING", requested_start_at: "2026-06-01T06:00:00Z", requested_end_at: "2026-06-01T20:00:00Z", uses_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc2_id}"
