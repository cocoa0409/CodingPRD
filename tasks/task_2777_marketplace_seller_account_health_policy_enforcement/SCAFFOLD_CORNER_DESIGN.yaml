              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
          trigger:
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v3}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a3: $.data.id, a3_points: $.data.severity_points_applied, a3_rung: $.data.ladder_rung_computed }
          assert:
            - "${a1_points} == 2.00, ${a2_points} == 4.50, ${a2_exempt} == true"
            - "HTTP 201"
            - "${a3_points} == 2.50   # 2.00 x (1.00 + 0.25 x 1 prior LISTING_ACCURACY action); decay does not shrink the repeat count"
            - "${a3_rung} == LISTING_REMOVAL   # post_balance 8.00 >= LADDER_RESTRICT_POINTS 4.00"
            - "Seller.${s_id}.severity_points_balance == 8.00   # 1.00 (decayed) + 4.50 (exempt, undecayed) + 2.50 (new)"
            - "the wrong reading that decays the IP action too would yield 5.75"
            - "the wrong reading that skips decay entirely would yield 9.00"
            - "EnforcementAction.${a1}.severity_points_applied == 2.00   # the stored points never change; only their weight in the balance does"
            - "Seller.${s_id}.enforcement_state == RESTRICTED and Seller.${s_id}.disbursement_state == RESERVE_HELD"

      - name: calc_decay_tier_three_zeroes_an_action_at_365_days
        claim_type: constants_applied
        grounds:
          - "calculations.severity_points_balance.constants.DECAY_TIER2_DAYS"
          - "calculations.severity_points_balance.constants.DECAY_TIER3_FACTOR"
          - "calculations.severity_points_applied.formula (prior_same_category)"
        distinguishing_aspect: |
          Step decay, third tier: an action exactly DECAY_TIER2_DAYS = 365 days old contributes
          0.00 because the comparison is `age_days < 365`, so 365 falls through to
          DECAY_TIER3_FACTOR. The balance after the new 3.00-point action is therefore exactly
          3.00 — the half-weight reading gives 4.00 (and would wrongly compute the rung as
          LISTING_REMOVAL and the posture as RESTRICTED), the no-decay reading gives 5.00.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00.000Z."
            - "PolicyRule LA-AGE-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false) and PolicyRule SP-AGE-1 (SHIPPING_PERFORMANCE, base 3.00, ACCOUNT, requires_poa false)."
            - "a1 under LA-AGE-1 issued at 2026-01-01: severity 2.00, balance 2.00, seller WATCHLIST."
            - "Clock then moves to 2027-01-01T00:00:00.000Z: a1 is exactly 365 days old."
            - "A second violation under SP-AGE-1 is carried to SUBSTANTIATED to force the recompute."
