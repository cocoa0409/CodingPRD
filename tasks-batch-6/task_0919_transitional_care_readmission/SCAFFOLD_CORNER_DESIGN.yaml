        excluded_because:
          difficulty_instance: cross_entity_state_dependency / visit_confirmation_blocked_by_open_blocking_barrier
          rationale: "Asserted as the first confirm rejection there."
      - name: error_schedule_conflict_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SCHEDULE_CONFLICT]"
        excluded_because:
