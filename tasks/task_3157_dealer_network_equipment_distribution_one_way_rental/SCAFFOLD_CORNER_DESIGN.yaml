scaffold_corner_design:

  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_location_returns_201_with_defaults
        claim_type: creation
        grounds:
          - "entities.Location"
          - "endpoints[POST /rental-network/locations]"
        distinguishing_aspect: "POST with all required fields returns 201; status defaults to OPEN; id/created_at/updated_at/version present with version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-C1", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc: $.data.id }
          assert:
            - "HTTP 201"
            - "Location.${loc}.status == OPEN"
            - "Location.${loc}.version == 1"
            - "Location.${loc}.id matches UUID format"

      - name: create_dealer_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Dealer"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input field dealer_code yields ERR_INVALID_REQUEST 400, not a server error."
        test_recipe:
          setup: ["one location exists"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-C2", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /rental-network/dealers"
              payload: { name: "No Code Dealer", location_id: "${loc}" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP 400"

      - name: duplicate_natural_key_returns_duplicate_resource
        claim_type: type_constraints
        grounds:
          - "entities.Location.fields.location_code"
          - "errors[ERR_DUPLICATE_RESOURCE]"
        distinguishing_aspect: "Second location with the same location_code collides on the unique natural key -> ERR_DUPLICATE_RESOURCE 409."
        test_recipe:
          setup: ["one location PHX-C3 exists"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-C3", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
          trigger:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-C3", city: "Phoenix", geo_zone: "SOUTH", storage_capacity: 5 }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_RESOURCE"
            - "HTTP 409"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds:
          - "entities.EquipmentUnit.fields.equipment_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "equipment_type 'TRUCK_99FT' is outside the declared enum -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["one location + dealer"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-C4", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C4", name: "Dealer C4", location_id: "${loc}" }
              as: NetworkAdmin
              captures: { dlr: $.data.id }
          trigger:
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-C4", equipment_type: "TRUCK_99FT", dealer_id: "${dlr}" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP 400"

      - name: get_nonexistent_entity_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints[GET /rental-network/dealers/{id}]"
        distinguishing_aspect: "GET with a well-formed UUID that was never created -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rental-network/dealers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP 404"

      - name: list_pagination_envelope_defaults
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /rental-network/dealers]"
        distinguishing_aspect: "List endpoint honors pagination envelope: default limit 10, total_count reflects all rows, has_more true when more pages exist."
        test_recipe:
          setup: ["12 dealers created across one location"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-C6", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-01", name: "Dealer 1", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-02", name: "Dealer 2", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-03", name: "Dealer 3", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-04", name: "Dealer 4", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-05", name: "Dealer 5", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-06", name: "Dealer 6", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-07", name: "Dealer 7", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-08", name: "Dealer 8", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-09", name: "Dealer 9", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-10", name: "Dealer 10", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-11", name: "Dealer 11", location_id: "${loc}" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C6-12", name: "Dealer 12", location_id: "${loc}" }
              as: NetworkAdmin
          trigger:
            - call: "GET /rental-network/dealers"
              payload: {}
              as: NetworkAdmin
          assert:
            - "response meta contains api_request_id and api_request_timestamp"
            - "data page contains exactly 10 dealers (default limit)"
            - "total_count == 12"
            - "has_more == true"
            - "second page with offset=10 returns 2 dealers and has_more == false"

      - name: reservation_event_immutable_no_version_field
        claim_type: immutability
        grounds:
          - "entities.ReservationEvent"
        distinguishing_aspect: "ReservationEvent has common_fields: false — no version/updated_at; rows are append-only and reachable only via the events sub-resource."
        test_recipe:
          setup: ["a reservation with at least one event (created via reservation create)"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-C8", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-C8", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C8", name: "Dealer C8", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dlr: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "cc8@x.com", full_name: "Cust C8", vehicle_profile_id: "${veh}" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust}", origin_dealer_id: "${dlr}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-11T10:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { rsv: $.data.id }
          trigger:
            - call: "GET /rental-network/reservations/${rsv}/events"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "exactly one event with event_type == CREATED"
            - "event rows expose id and created_at but no version field"

      - name: computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.CrossSellOrder.fields.total_cents"
        distinguishing_aspect: "Client-supplied total_cents on order creation is ignored; server computes 1674 + 0 - 0 = 1674 for 3 BOX_SMALL + 1 LOCK without storage."
        test_recipe:
          setup: ["location + dealer exist"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-C9", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-C9", name: "Dealer C9", location_id: "${loc}" }
              as: NetworkAdmin
              captures: { dlr: $.data.id }
          trigger:
            - call: "POST /rental-network/cross-sell-orders"
              payload: { dealer_id: "${dlr}", line_items: [ { sku: "BOX_SMALL", qty: 3 }, { sku: "LOCK", qty: 1 } ] }
              as: DealerAgent
              as_user_id: "${dlr}"
              captures: { ord: $.data.id }
          assert:
            - "CrossSellOrder.${ord}.total_cents == 1674"
            - "CrossSellOrder.${ord}.bundle_discount_cents == 0 (no storage_months)"
            - "CrossSellOrder.${ord}.storage_charge_cents == 0"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: reservation_initial_state_is_quoted
        claim_type: initial_state
        grounds:
          - "state_machines.Reservation"
        distinguishing_aspect: "Newly created reservation starts in QUOTED with tow_check_result NOT_REQUIRED."
        test_recipe:
          setup: ["standard location/dealer/rate/customer fixture"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-S1", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-S1", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-S1", name: "Dealer S1", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dlr: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "cs1@x.com", full_name: "Cust S1", vehicle_profile_id: "${veh}" }
              as: Customer
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust}", origin_dealer_id: "${dlr}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-11T10:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { rsv: $.data.id }
          assert:
            - "Reservation.${rsv}.status == QUOTED"
            - "Reservation.${rsv}.tow_check_result == NOT_REQUIRED"
            - "Reservation.${rsv}.season == OFF_PEAK"
            - "Reservation.${rsv}.rental_days == 1"

      - name: terminal_state_lockdown_cancelled_reservation_rejects_confirm
        claim_type: invalid_transition
        grounds:
          - "state_machines.Reservation"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CANCELLED is terminal: any further transition attempt (confirm) on a cancelled reservation -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["reservation created and cancelled"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-S2", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-S2", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-S2", name: "Dealer S2", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dlr: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "cs2@x.com", full_name: "Cust S2", vehicle_profile_id: "${veh}" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust}", origin_dealer_id: "${dlr}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-11T10:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { rsv: $.data.id, rsv_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /rental-network/reservations/${rsv}/confirm"
              payload: { expected_reservation_version: "${rsv_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP 409"
            - "Reservation.${rsv}.status == CANCELLED"

      - name: lane_rate_activation_supersedes_conflict
        claim_type: valid_transition
        grounds:
          - "state_machines.LaneRate.DRAFT_to_ACTIVE"
        distinguishing_aspect: "Activating a second DRAFT rate with the same lane key moves the incumbent ACTIVE row to SUPERSEDED; only one ACTIVE row per lane key."
        test_recipe:
          setup: ["two DRAFT rates for the same lane key"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-S3", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-S3", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 1000, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "PEAK", base_rate_cents: 7000, reposition_surcharge_cents: 1000, commission_rate: 0.12 }
              as: PricingManager
              captures: { rate_2: $.data.id }
          trigger:
            - call: "POST /rental-network/lane-rates/${rate_2}/activate"
              payload: {}
              as: PricingManager
          assert:
            - "LaneRate.${rate_2}.status == ACTIVE"
            - "LaneRate.${rate_1}.status == SUPERSEDED"

      - name: double_cancel_is_idempotency_violation
        claim_type: idempotency
        grounds:
          - "state_machines.Reservation.CONFIRMED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling an already-cancelled reservation fails with ERR_INVALID_STATE; no side effects fire twice (no double hold release)."
        test_recipe:
          setup: ["confirmed reservation then cancelled once"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-S4", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-S4", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-S4", name: "Dealer S4", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dlr: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-S4", equipment_type: "TRUCK_10FT", dealer_id: "${dlr}" }
              as: NetworkAdmin
              captures: { unit: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "cs4@x.com", full_name: "Cust S4", vehicle_profile_id: "${veh}" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /rental-network/customers/${cust}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dlr}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust}", origin_dealer_id: "${dlr}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-11T10:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { rsv: $.data.id, rsv_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv}/confirm"
              payload: { expected_reservation_version: "${rsv_v}" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /rental-network/reservations/${rsv}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /rental-network/reservations/${rsv}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "EquipmentUnit.${unit}.status == AVAILABLE (single release, not double)"

      - name: unit_maintenance_cycle_guarded_by_owner_dealer
        claim_type: guarded_transitions
        grounds:
          - "state_machines.EquipmentUnit.AVAILABLE_to_MAINTENANCE"
        distinguishing_aspect: "Only the DealerAgent of the unit's current_dealer may move it to MAINTENANCE; an agent of another dealer is rejected."
        test_recipe:
          setup: ["unit at dealer D1; second dealer D2 exists"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-S5", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-S5A", name: "Dealer S5A", location_id: "${loc}" }
              as: NetworkAdmin
              captures: { d1: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-S5B", name: "Dealer S5B", location_id: "${loc}" }
              as: NetworkAdmin
              captures: { d2: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-S5", equipment_type: "TRUCK_10FT", dealer_id: "${d1}" }
              as: NetworkAdmin
              captures: { unit: $.data.id }
          trigger:
            - call: "POST /rental-network/equipment-units/${unit}/status"
