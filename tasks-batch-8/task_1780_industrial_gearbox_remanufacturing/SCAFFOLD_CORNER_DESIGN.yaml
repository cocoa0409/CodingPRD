  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_revise_scope_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[scope-revision-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "revise-scope carrying a stale expected_order_version (observed before a prior successful revision) returns 412 ERR_STALE_VERSION; deterministic with two strictly sequential requests."
        test_recipe:
          setup: ["Order in SCOPE_APPROVAL (decision set A); version observed; first revise succeeds (version bumps); second revise with the stale version must fail"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "OCC Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-OCC", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 4.0, material_cents: 12000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "GET /reman/orders/${order_id}"
              payload: {}
              as: RemanEngineer
              captures: { v_obs: $.data.version }
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 0 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/revise-scope"
              payload: { expected_order_version: "${v_obs}" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REUSE_AS_IS", labor_hours: 1.0, material_cents: 0 }
              as: RemanEngineer
          trigger:
            - call: "POST /reman/orders/${order_id}/revise-scope"
              payload: { expected_order_version: "${v_obs}" }
              as: RemanEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "http status == 412"
            - "RemanOrder.${order_id}.approved_scope_cents == 17000 (the first revision's REGRIND 2.0h/0 result; stale revision did not apply)"

      - name: occ_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[loaner-return-stale-assignment]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Return with the correct expected_assignment_version succeeds and bumps version by 1; a return carrying a version made stale by an intervening extend is rejected 412 while the assignment is still CHECKED_OUT (state precondition valid — OCC is the failing check)."
        test_recipe:
          setup: ["Assignment CHECKED_OUT at clock 2026-08-02; version observed via GET; then extend bumps the version, making the observed version stale"]
          setup_api_calls:
            - call: "POST /reman/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ServiceManager
            - call: "POST /reman/customers"
              payload: { legal_name: "OCC2 Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-OC2", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000 }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/loaner-units"
              payload: { serial_number: "LN-OCC", model: "HZ-450" }
              as: ServiceManager
              captures: { loaner_id: $.data.id }
            - call: "POST /reman/loaner-units/${loaner_id}/assignments"
              payload: { reman_order_id: "${order_id}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: IntakeCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /reman/loaner-assignments/${asg_id}/checkout"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /reman/loaner-assignments/${asg_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { asg_v: $.data.version }
          trigger:
            - call: "POST /reman/loaner-assignments/${asg_id}/extend"
              payload: { new_end_date: "2026-08-12" }
              as: IntakeCoordinator
            - call: "POST /reman/loaner-assignments/${asg_id}/return"
              payload: { expected_assignment_version: "${asg_v}" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /reman/loaner-assignments/${asg_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { asg_v2: $.data.version }
            - call: "POST /reman/loaner-assignments/${asg_id}/return"
              payload: { expected_assignment_version: "${asg_v2}" }
              as: IntakeCoordinator
          assert:
            - "Stale return: error_id == ERR_STALE_VERSION and http status == 412 (assignment still CHECKED_OUT, so the state precondition passes and OCC is the failing check)"
            - "LoanerAssignment.${asg_id}.version == ${asg_v} + 1 after the extend (mutation bumped it exactly once)"
            - "Retry with the fresh version ${asg_v2} succeeds: LoanerAssignment.${asg_id}.status == RETURNED"
            - "LoanerUnit.${loaner_id}.status == AVAILABLE after the successful return"

      - name: derived_field_customer_outstanding_reconciles_on_cancel
        claim_type: derived_field_reconciliation
        grounds: ["calculations.customer_credit_hold", "state_machines.RemanOrder"]
        distinguishing_aspect: "outstanding_approved_cents is a derived aggregate: immediately after a 22000-cents scope approval, a fresh GET of the customer shows exactly 22000 with credit_hold false — recomputed from the order set, not a stale cache."
        test_recipe:
          setup: ["Customer limit 90000000; order scope 22000 approved"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Derived Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-DV", model: "HZ-200", rated_torque_nm: 5000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /reman/customers/${cust_id}"
              payload: {}
              as: ServiceManager
          assert:
            - "Customer.${cust_id}.outstanding_approved_cents == 22000"
            - "Customer.${cust_id}.credit_hold == false"
            - "RemanOrder.${order_id}.status == APPROVED"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cascade_visible_immediately_in_same_request_chain
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "state_machines.RemanOrder.RUN_IN_to_READY_TO_SHIP"]
        distinguishing_aspect: "Immediate consistency: the record-run-in PASS response reflects order side effects at once — a subsequent GET shows status READY_TO_SHIP and final_invoice_cents populated with no delay or reconciliation window."
        test_recipe:
          setup: ["Order in RUN_IN; one shipment 1500kg/4h DELIVERED... actually shipment delivery timing is irrelevant to invoice; BOOKED suffices for the invoice math (non-cancelled). Use BOOKED shipment 1500kg/4h (158000)."]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Imm Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-IM", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 500000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 3, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "GEAR_2", condition: "CUT_ONLY", severity: 4, notes: "pitting" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 4.0, material_cents: 12000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "GEAR_2", action: "CUT_NEW", labor_hours: 6.5, material_cents: 450000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.12, radial_clearance_mm: 0.03, axial_clearance_mm: 0.04 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 1500, rigging_bay_date: "2026-08-17", rigging_bay_hours: 4 }
              as: IntakeCoordinator
          trigger:
            - call: "POST /reman/orders/${order_id}/run-in-tests"
              payload: { duration_minutes: 120, max_temp_c: 88.0, vibration_mm_s: 3.1, oil_particle_count: 2400 }
              as: QualityInspector
