# =============================================================================
# SCAFFOLD — Patent Trial Proceedings & Post-Grant Review Administration
# USPTO Patent Trial and Appeal Board (PTAB) style post-grant review docket.
# §1.0–§1.7 only. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  Patent Trial Proceedings & Post-Grant Review Administration (United States
  Patent and Trademark Office): petition filing challenging issued patent
  claims with grounds limited to specified statutory bases, institution
  decision within a statutory window applying threshold likelihood standards
  and discretionary denial factors, parallel district court litigation timing
  considerations affecting institution decisions, trial schedule with patent
  owner response, petitioner reply, expert declarations and limited discovery,
  claim construction standards and amendment practice during the proceeding,
  oral hearing and final written decision within a statutory deadline with
  extension provisions, estoppel effects binding the petitioner in other
  forums, appeal to the federal appellate court and remand handling

domain_name: patent-trial-proceedings
api_prefix: /ptab

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - scheduled_actions          # statutory windows + FWD deadline driven by logical clock
    - optimistic_concurrency     # OCC on Patent.version (petition filing) and LitigationMatter.version (docket updates)
    - cascading_side_effects     # FWD -> proceeding -> patent -> litigation stay; remand -> proceeding -> patent -> estoppel unwind
    - derived_field_reconciliation # petition.fintiv_score refreshed when parallel litigation docket changes
  entity_topology: flat          # peer entities joined by FK references; sub-resource reads only where 1:N history lives
  state_machine_shape: cyclic    # Proceeding remand loop (DECIDED -> REMANDED -> DECIDED); OralHearing continuance loop; LitigationMatter ACTIVE<->STAYED
  relationship_patterns:
    - one_to_many                # Patent -> Petitions, Proceeding -> Briefs/DiscoveryRequests/AmendmentMotions/Appeals
    - cross_aggregate            # Petition.patent_id -> Patent; LitigationMatter.defendant_party_id -> Party; OralHearing.hearing_room_id -> HearingRoom
  role_model: peer_roles         # Petitioner vs PatentOwner own disjoint write surfaces; BoardPanel adjudicates; AppealsCourt reviews
  consistency_model: immediate   # every mutation + cascade is atomic within the request; computed fields visible in the same response

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Party
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the party (company or individual)" }
      - { name: party_type, type: enum, source: input, description: "PETITIONER | PATENT_OWNER — which side of a trial the party may act on" }
      - { name: counsel_firm, type: string, source: input, required: false, default: null, description: "Optional lead counsel firm name" }

  - name: Patent
    parent: null
    common_fields: true
    fields:
      - { name: patent_number, type: string, source: input, description: "Issued patent number; unique across the docket" }
      - { name: title, type: string, source: input, description: "Patent title" }
      - { name: issue_date, type: datetime, source: input, description: "Date the patent issued (ISO 8601 UTC)" }
      - { name: owner_id, type: string, source: input, description: "FK -> Party.id; the patent owner. Must reference a Party with party_type == PATENT_OWNER" }
      - { name: total_claims, type: integer, source: input, constraints: ">= 1", description: "Number of issued claims. Grows by the number of granted substitute claims" }
      - { name: status, type: enum, source: system, description: "ISSUED | IN_REVIEW | PARTIALLY_CANCELLED | FULLY_CANCELLED | CONFIRMED | AMENDED — derived lifecycle of the patent across proceedings" }
      - { name: claims_alive, type: integer, source: computed, description: "= total_claims - claims_cancelled_count. INVARIANT: claims_alive + claims_cancelled_count == total_claims at all times" }
      - { name: claims_cancelled_count, type: integer, source: computed, default: 0, description: "Claims cancelled by amendment grants (originals swapped out) plus UNPATENTABLE outcomes in final written decisions" }
      - { name: claims_amended_count, type: integer, source: computed, default: 0, description: "Number of substitute claims granted via amendment motions" }

  - name: LitigationMatter
    parent: null
    common_fields: true
    fields:
      - { name: patent_id, type: string, source: system, description: "FK -> Patent.id; taken from the creation path" }
      - { name: defendant_party_id, type: string, source: input, description: "FK -> Party.id; accused infringer in the parallel district-court case" }
      - { name: court_name, type: string, source: input, description: "District court name (e.g. W.D. Tex.)" }
      - { name: docket_number, type: string, source: input, description: "Court docket number" }
      - { name: complaint_served_date, type: datetime, source: input, description: "Date the complaint was served on the defendant; drives the 35 USC 315(b)-style one-year petition time bar" }
      - { name: trial_date, type: datetime, source: input, required: false, default: null, description: "Scheduled district-court trial date; null when unset. Drives the Fintiv proximity factor" }
      - { name: status, type: enum, source: system, description: "ACTIVE | STAYED | SETTLED | TRIAL_COMPLETED | DISMISSED" }
      - { name: stay_reason, type: enum, source: system, default: null, description: "MANUAL_STAY | INSTITUTION_STAY | PATENT_CANCELLED; null unless status == STAYED" }
      - { name: estoppel_claims, type: array, source: computed, default: [], description: "Claim numbers the defendant is estopped from challenging in this matter after a final written decision; cleared on remand" }

  - name: Petition
    parent: null
    common_fields: true
    fields:
      - { name: patent_id, type: string, source: input, description: "FK -> Patent.id; the challenged patent" }
      - { name: petitioner_id, type: string, source: input, description: "FK -> Party.id; must reference a Party with party_type == PETITIONER and equal X-User-ID" }
      - { name: review_type, type: enum, source: input, description: "IPR | PGR — selects the statutory ground set and the institution threshold" }
      - { name: challenged_claims, type: array, source: input, description: "Non-empty array of unique claim numbers, each in 1..patent.total_claims" }
      - { name: grounds, type: array, source: input, description: "Non-empty array of {claim_number, basis}; basis in ANTICIPATION_102 | OBVIOUSNESS_103 | PUBLIC_USE | ON_SALE | OTHER_STATUTORY; every claim_number must be in challenged_claims" }
      - { name: prior_art, type: array, source: input, description: "Non-empty array of {reference_type, citation}; reference_type in PATENT | PRINTED_PUBLICATION | PRODUCT | TESTIMONY" }
      - { name: real_party_in_interest, type: string, source: input, description: "Real party in interest disclosure; non-empty" }
      - { name: fee_paid_cents, type: integer, source: input, description: "Filing fee tendered, in cents; must be >= required fee computed from challenged claim count" }
      - { name: filing_date, type: datetime, source: system, description: "Logical-clock timestamp at creation; the petition receipt date for the statutory time bar" }
      - { name: accorded_date, type: datetime, source: system, default: null, description: "Timestamp when a filing date was accorded; starts the 93-day institution window" }
      - { name: status, type: enum, source: system, description: "FILED | NOTICE_ACCORDED | INSTITUTED | DENIED" }
      - { name: fintiv_score, type: integer, source: computed, description: "Discretionary-denial score, provisional variant computed at filing; refreshed whenever a LitigationMatter for the same patent is patched while the petition is in FILED or NOTICE_ACCORDED" }
      - { name: merits_max_score, type: integer, source: system, default: null, description: "Highest per-ground panel score recorded at the institution decision" }
      - { name: advisory_aggregate_score, type: integer, source: system, default: null, description: "Advisory weighted-aggregate merits score recorded at the institution decision (non-operative variant)" }

  - name: InstitutionDecision
    parent: null
    common_fields: false   # immutable event record: id + created_at only
    fields:
      - { name: petition_id, type: string, source: system, description: "FK -> Petition.id; exactly one decision per petition" }
      - { name: outcome, type: enum, source: system, description: "INSTITUTED | DENIED_MERITS | DENIED_DISCRETIONARY" }
      - { name: merits_max_score, type: integer, source: system, description: "max over per_ground_scores supplied by the panel" }
      - { name: threshold_used, type: integer, source: system, description: "40 for IPR (reasonable likelihood), 51 for PGR (more likely than not)" }
      - { name: advisory_aggregate_score, type: integer, source: system, description: "round_half_up(0.7*max + 0.3*mean) over per_ground_scores; advisory only" }
      - { name: fintiv_score, type: integer, source: system, description: "Decision-time Fintiv score computed from live litigation matters at decision time" }
      - { name: lead_judge_user_id, type: string, source: system, description: "BoardPanel X-User-ID designated panel lead; stored user id (not a foreign key)" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decision" }

  - name: Proceeding
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: system, description: "FK -> Petition.id; 1:1 with the petition it institutes" }
      - { name: patent_id, type: string, source: system, description: "FK -> Patent.id; copied from the petition" }
      - { name: lead_judge_user_id, type: string, source: system, description: "Panel lead user id; stored user id (not a foreign key)" }
      - { name: instituted_claims, type: array, source: system, description: "= petition.challenged_claims (institution is all-claims, per SAS-style all-or-nothing rule)" }
      - { name: phase, type: enum, source: system, description: "INSTITUTED | REPLY_WINDOW | SUR_REPLY_WINDOW | HEARING_PHASE | DECISION_PHASE | DECIDED | REMANDED | CLOSED" }
      - { name: institution_date, type: datetime, source: system, description: "Timestamp of the institution decision" }
      - { name: cycle_anchor_date, type: datetime, source: system, description: "Deadline anchor for the current briefing cycle: institution_date for cycle 0; the remand timestamp for later cycles" }
      - { name: fwd_due_date, type: datetime, source: computed, description: "Statutory final-written-decision deadline = institution_date + 365 days (operative fixed-days variant); +183 days if an extension has been granted" }
      - { name: advisory_anniversary_date, type: datetime, source: computed, description: "Advisory variant = institution_date + 12 calendar months (+6 calendar months if extended); diverges from fwd_due_date across leap-day spans" }
      - { name: extension_used, type: boolean, source: system, default: false, description: "True once the single good-cause extension has been granted" }
      - { name: estoppel_applied, type: boolean, source: system, default: false, description: "True once a final written decision has attached estoppel to the petitioner" }
      - { name: amendment_slots_available, type: integer, source: computed, default: 1, description: "Amendment motions of right remaining in the current briefing cycle. INVARIANT per (proceeding, cycle): amendment_slots_available + count(motions of this cycle with status in {FILED, GRANTED, DENIED}) == 1" }
      - { name: briefing_cycle, type: integer, source: system, default: 0, description: "0 for the original trial; incremented on each remand" }
      - { name: total_overage_fee_cents, type: integer, source: computed, default: 0, description: "Sum of per-brief overage fees (each rounded per brief BEFORE summing)" }

  - name: Brief
    parent: null
    common_fields: true
    fields:
      - { name: proceeding_id, type: string, source: system, description: "FK -> Proceeding.id; taken from the creation path" }
      - { name: brief_type, type: enum, source: input, description: "PO_RESPONSE | PETITIONER_REPLY | PO_SUR_REPLY" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the filer; stored user id (not a foreign key). PO_* briefs require the patent owner; PETITIONER_REPLY requires the petitioner" }
      - { name: page_count, type: integer, source: input, constraints: ">= 1", description: "Body page count; fee-free up to the brief-type limit, overage billed up to the hard cap" }
      - { name: overage_fee_cents, type: integer, source: computed, description: "round_half_up(max(0, page_count - page_limit) * 316.25); limits: PO_RESPONSE 90, PETITIONER_REPLY 45, PO_SUR_REPLY 20" }
      - { name: cycle, type: integer, source: system, description: "proceeding.briefing_cycle at filing time; one brief of each type per cycle" }

  - name: ExpertDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: brief_id, type: string, source: system, description: "FK -> Brief.id; taken from the creation path" }
      - { name: declarant_name, type: string, source: input, description: "Expert witness name" }
      - { name: page_count, type: integer, source: input, constraints: ">= 1", description: "Declaration page count" }
      - { name: contains_new_evidence, type: boolean, source: input, description: "True if the declaration introduces evidence not of record; forbidden on PETITIONER_REPLY briefs" }

  - name: DiscoveryRequest
    parent: null
    common_fields: true
    fields:
      - { name: proceeding_id, type: string, source: system, description: "FK -> Proceeding.id; taken from the creation path" }
      - { name: requester_user_id, type: string, source: system, description: "X-User-ID of the requesting party; stored user id (not a foreign key)" }
      - { name: discovery_type, type: enum, source: input, description: "ROUTINE | ADDITIONAL. ROUTINE is auto-granted; ADDITIONAL requires an interest-of-justice ruling" }
      - { name: factor_scores, type: array, source: input, required: false, default: null, description: "Exactly 5 integers each 0..2 (Garmin-style factors); required for ADDITIONAL, ignored for ROUTINE" }
      - { name: garmin_score, type: integer, source: computed, default: null, description: "Interest-of-justice score for ADDITIONAL requests: min(sum,4) if any factor == 0 else sum, then +1 when filed in REPLY_WINDOW, capped at 10" }
      - { name: status, type: enum, source: system, description: "PENDING | GRANTED | DENIED. ROUTINE requests are created directly in GRANTED" }

  - name: AmendmentMotion
    parent: null
    common_fields: true
    fields:
      - { name: proceeding_id, type: string, source: system, description: "FK -> Proceeding.id; taken from the creation path" }
      - { name: cycle, type: integer, source: system, description: "proceeding.briefing_cycle at filing time" }
      - { name: substitute_claims, type: array, source: input, description: "Non-empty array of {original_claim_number, substitute_text}; each original_claim_number must be in proceeding.instituted_claims; count <= count(instituted_claims)" }
      - { name: status, type: enum, source: system, description: "FILED | GRANTED | DENIED | WITHDRAWN" }
      - { name: construction_standard, type: enum, source: system, default: PHILLIPS, description: "Claim construction standard applied to substitutes; fixed to PHILLIPS (same as district court)" }

  - name: OralHearing
    parent: null
    common_fields: true
    fields:
      - { name: proceeding_id, type: string, source: system, description: "FK -> Proceeding.id; taken from the creation path" }
      - { name: hearing_room_id, type: string, source: system, default: null, description: "FK -> HearingRoom.id; null while REQUESTED; set by the scheduling PATCH; cleared back to null on continuance" }
      - { name: start_at, type: datetime, source: system, default: null, description: "Hearing start (ISO 8601 UTC); null while REQUESTED" }
      - { name: end_at, type: datetime, source: system, default: null, description: "Hearing end; must be strictly after start_at" }
      - { name: argument_minutes, type: integer, source: input, default: 60, description: "Total argument minutes split between sides" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | HELD | WAIVED" }

  - name: HearingRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name; unique across the board facility" }
      - { name: capacity, type: integer, source: input, constraints: ">= 1", description: "Seating capacity" }

  - name: FinalWrittenDecision
    parent: null
    common_fields: false   # immutable event record: id + created_at only
    fields:
      - { name: proceeding_id, type: string, source: system, description: "FK -> Proceeding.id; one decision per briefing cycle" }
      - { name: cycle, type: integer, source: system, description: "proceeding.briefing_cycle at issuance; a second decision in the same cycle is rejected" }
      - { name: outcomes, type: array, source: input, description: "Array of {claim_number, outcome}; outcome in UNPATENTABLE | NOT_UNPATENTABLE | AMENDED_SUBSTITUTED; must cover every instituted claim exactly once; claims with a granted substitute must be AMENDED_SUBSTITUTED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: claims_cancelled_count, type: integer, source: computed, description: "Count of UNPATENTABLE outcomes in this decision" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: proceeding_id, type: string, source: system, description: "FK -> Proceeding.id; taken from the creation path" }
      - { name: appellant_user_id, type: string, source: system, description: "X-User-ID of the appellant (a party to the proceeding); stored user id (not a foreign key)" }
      - { name: status, type: enum, source: system, description: "FILED | AFFIRMED | VACATED_AND_REMANDED | DISMISSED" }
      - { name: remand_instructions, type: enum, source: input, required: false, default: null, description: "REOPEN_RECORD | RECONSIDER; required iff the appellate outcome is VACATED_AND_REMANDED, otherwise must be absent" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Patent
    initial_state: ISSUED
    terminal_states: [FULLY_CANCELLED]
    transitions:
      - from: ISSUED
        to: IN_REVIEW
        trigger: "system (cascade when a petition against this patent is INSTITUTED)"
        actor: system
        preconditions:
          - "An institution decision with outcome INSTITUTED is created for a petition naming this patent"
        side_effects:
          - "increments Patent.version by 1"

      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "system (cascade when a further petition against this patent is INSTITUTED while an earlier proceeding is still open)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Patent.version by 1"
        note: "Self-loop: multiple petitions against the same patent may be instituted; the patent simply stays IN_REVIEW"

      - from: PARTIALLY_CANCELLED
        to: IN_REVIEW
        trigger: "system (cascade when a new petition against this patent is INSTITUTED after a prior decision)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Patent.version by 1"

      - from: AMENDED
        to: IN_REVIEW
        trigger: "system (cascade when a new petition against this patent is INSTITUTED after a prior decision)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Patent.version by 1"

      - from: CONFIRMED
        to: IN_REVIEW
        trigger: "system (cascade when a new petition against this patent is INSTITUTED after a prior decision)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Patent.version by 1"

      - from: IN_REVIEW
        to: FULLY_CANCELLED
        trigger: "system (cascade when a final written decision issues on a proceeding for this patent)"
        actor: system
        preconditions:
          - "After applying the decision outcomes, claims_alive == 0"
        side_effects:
          - "CASCADE LINK 3: every LitigationMatter with patent_id == this patent and status == ACTIVE transitions to STAYED with stay_reason = PATENT_CANCELLED (LitigationMatter matters already STAYED keep their current stay_reason)"

      - from: IN_REVIEW
        to: PARTIALLY_CANCELLED
        trigger: "system (cascade on final written decision)"
        actor: system
        preconditions:
          - "claims_alive > 0 AND claims_amended_count == 0 AND claims_cancelled_count > 0"
        side_effects: []

      - from: IN_REVIEW
        to: AMENDED
        trigger: "system (cascade on final written decision)"
        actor: system
        preconditions:
          - "claims_alive > 0 AND claims_amended_count > 0"
        side_effects: []

      - from: IN_REVIEW
        to: CONFIRMED
        trigger: "system (cascade on final written decision)"
        actor: system
        preconditions:
          - "claims_cancelled_count == 0 AND claims_amended_count == 0 after the decision"
        side_effects: []

      - from: PARTIALLY_CANCELLED
        to: IN_REVIEW
        trigger: "system (cascade when an appeal of the latest decision ends VACATED_AND_REMANDED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE LINK 3 (remand unwind): every LitigationMatter with patent_id == this patent has estoppel_claims cleared to []"

      - from: AMENDED
        to: IN_REVIEW
        trigger: "system (cascade on VACATED_AND_REMANDED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE LINK 3 (remand unwind): every LitigationMatter with patent_id == this patent has estoppel_claims cleared to []"

      - from: CONFIRMED
        to: IN_REVIEW
        trigger: "system (cascade on VACATED_AND_REMANDED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE LINK 3 (remand unwind): every LitigationMatter with patent_id == this patent has estoppel_claims cleared to []"

  - entity: LitigationMatter
    initial_state: ACTIVE
    terminal_states: [SETTLED, TRIAL_COMPLETED, DISMISSED]
    transitions:
      - from: ACTIVE
        to: STAYED
        trigger: "PATCH /ptab/litigation-matters/{matterId} with status=STAYED, or system cascade on institution / full cancellation"
        actor: PlatformAdmin | system
        preconditions:
          - "For the manual PATCH: expected_litigation_matter_version matches (ERR_STALE_MATTER_VERSION)"
        side_effects:
          - "stay_reason = MANUAL_STAY when set by PATCH; INSTITUTION_STAY when set by the institution cascade; PATENT_CANCELLED when set by the full-cancellation cascade"
          - "Refresh fintiv_score (provisional variant) on every Petition with patent_id == this patent and status in {FILED, NOTICE_ACCORDED}"
          - "increments LitigationMatter.version by 1 (manual PATCH)"

      - from: STAYED
        to: ACTIVE
        trigger: "PATCH /ptab/litigation-matters/{matterId} with status=ACTIVE (stay lifted)"
        actor: PlatformAdmin
        preconditions:
          - "expected_litigation_matter_version matches (ERR_STALE_MATTER_VERSION)"
        side_effects:
          - "stay_reason = null"
          - "Refresh fintiv_score on pending petitions for this patent"
          - "increments LitigationMatter.version by 1"

      - from: ACTIVE
        to: SETTLED
        trigger: "PATCH /ptab/litigation-matters/{matterId} with status=SETTLED"
        actor: PlatformAdmin
        preconditions:
          - "expected_litigation_matter_version matches (ERR_STALE_MATTER_VERSION)"
        side_effects:
          - "Refresh fintiv_score on pending petitions for this patent"
          - "increments LitigationMatter.version by 1"

      - from: STAYED
        to: SETTLED
        trigger: "PATCH /ptab/litigation-matters/{matterId} with status=SETTLED"
        actor: PlatformAdmin
        preconditions:
          - "expected_litigation_matter_version matches (ERR_STALE_MATTER_VERSION)"
        side_effects:
          - "Refresh fintiv_score on pending petitions for this patent"
          - "increments LitigationMatter.version by 1"

      - from: ACTIVE
        to: TRIAL_COMPLETED
        trigger: "PATCH /ptab/litigation-matters/{matterId} with status=TRIAL_COMPLETED"
        actor: PlatformAdmin
        preconditions:
          - "expected_litigation_matter_version matches (ERR_STALE_MATTER_VERSION)"
        side_effects:
          - "Refresh fintiv_score on pending petitions for this patent"
          - "increments LitigationMatter.version by 1"

      - from: ACTIVE
        to: DISMISSED
        trigger: "PATCH /ptab/litigation-matters/{matterId} with status=DISMISSED"
        actor: PlatformAdmin
        preconditions:
          - "expected_litigation_matter_version matches (ERR_STALE_MATTER_VERSION)"
        side_effects:
          - "Refresh fintiv_score on pending petitions for this patent"
          - "increments LitigationMatter.version by 1"

  - entity: Petition
    initial_state: FILED
    terminal_states: [INSTITUTED, DENIED]
    transitions:
      - from: FILED
        to: NOTICE_ACCORDED
        trigger: "POST /ptab/petitions/{petitionId}/accord-filing-date"
        actor: BoardPanel
        preconditions:
          - "Petition must be in FILED (ERR_PETITION_WRONG_STATE)"
          - "For review_type == IPR: every grounds[].basis in {ANTICIPATION_102, OBVIOUSNESS_103} (ERR_GROUND_NOT_PERMITTED)"
          - "For review_type == IPR: every prior_art[].reference_type in {PATENT, PRINTED_PUBLICATION} (ERR_PRIOR_ART_TYPE_NOT_PERMITTED)"
        side_effects:
          - "accorded_date = current logical time"
          - "fintiv_score refreshed (decision-relevant matters re-read)"

      - from: NOTICE_ACCORDED
        to: INSTITUTED
        trigger: "POST /ptab/petitions/{petitionId}/decide-institution when merits_max_score >= threshold_used AND fintiv_score < 70"
        actor: BoardPanel
        preconditions:
          - "Petition must be in NOTICE_ACCORDED (ERR_PETITION_WRONG_STATE)"
          - "now <= accorded_date + 93 days (ERR_INSTITUTION_WINDOW_LAPSED)"
          - "Computed outcome is INSTITUTED (see calculations.merits_likelihood_evaluation and fintiv_discretionary_score)"
          - "Panel capacity: count of Proceedings with lead_judge_user_id == payload lead_judge_user_id and phase in {INSTITUTED, REPLY_WINDOW, SUR_REPLY_WINDOW, HEARING_PHASE, DECISION_PHASE, REMANDED} must be < 2 (ERR_PANEL_CAPACITY_EXCEEDED)"
        side_effects:
          - "Create InstitutionDecision (outcome INSTITUTED; merits_max_score, advisory_aggregate_score, fintiv_score, threshold_used recorded)"
          - "petition.merits_max_score and petition.advisory_aggregate_score recorded"
          - "CASCADE LINK 1: create Proceeding (phase INSTITUTED, instituted_claims = petition.challenged_claims, institution_date = now, cycle_anchor_date = now, fwd_due_date = now + 365 days, advisory_anniversary_date = now + 12 calendar months, amendment_slots_available = 1, briefing_cycle = 0, lead_judge_user_id = payload value)"
          - "CASCADE LINK 2: Patent (petition.patent_id) transitions ISSUED -> IN_REVIEW (see Patent machine)"
          - "CASCADE LINK 3: every LitigationMatter with patent_id == this patent and status == ACTIVE transitions to STAYED with stay_reason = INSTITUTION_STAY"

      - from: NOTICE_ACCORDED
        to: DENIED
        trigger: "POST /ptab/petitions/{petitionId}/decide-institution when merits threshold not met (DENIED_MERITS) or Fintiv discretion applies (DENIED_DISCRETIONARY)"
        actor: BoardPanel
        preconditions:
          - "Petition must be in NOTICE_ACCORDED (ERR_PETITION_WRONG_STATE)"
          - "now <= accorded_date + 93 days (ERR_INSTITUTION_WINDOW_LAPSED)"
        side_effects:
          - "Create InstitutionDecision (outcome DENIED_MERITS or DENIED_DISCRETIONARY; all scores recorded)"
          - "petition.merits_max_score and petition.advisory_aggregate_score recorded"

  - entity: Proceeding
    initial_state: INSTITUTED
    terminal_states: [CLOSED]
    transitions:
      - from: INSTITUTED
        to: REPLY_WINDOW
        trigger: "POST /ptab/proceedings/{proceedingId}/briefs with brief_type=PO_RESPONSE (accepted)"
        actor: PatentOwner
        preconditions:
          - "phase must be INSTITUTED or REMANDED (ERR_INVALID_PHASE)"
          - "Caller X-User-ID must equal the patent owner's Party id (ERR_NOT_RESOURCE_OWNER)"
          - "now <= cycle_anchor_date + 90 days (ERR_BRIEF_WINDOW_CLOSED)"
          - "No other Brief with brief_type == PO_RESPONSE in the same cycle (ERR_BRIEF_SEQUENCE_VIOLATION)"
          - "page_count <= 110 hard cap (ERR_PAGE_LIMIT_EXCEEDED)"
        side_effects:
          - "overage_fee_cents computed; proceeding.total_overage_fee_cents += overage_fee_cents"

      - from: REPLY_WINDOW
        to: SUR_REPLY_WINDOW
        trigger: "POST /ptab/proceedings/{proceedingId}/briefs with brief_type=PETITIONER_REPLY (accepted)"
        actor: Petitioner
        preconditions:
          - "phase must be REPLY_WINDOW (ERR_INVALID_PHASE)"
          - "Caller X-User-ID must equal the petition's petitioner_id (ERR_NOT_RESOURCE_OWNER)"
          - "now <= cycle_anchor_date + 132 days (ERR_BRIEF_WINDOW_CLOSED)"
          - "No other Brief with brief_type == PETITIONER_REPLY in the same cycle (ERR_BRIEF_SEQUENCE_VIOLATION)"
          - "page_count <= 65 hard cap (ERR_PAGE_LIMIT_EXCEEDED)"
        side_effects:
          - "overage_fee_cents computed; proceeding.total_overage_fee_cents += overage_fee_cents"

      - from: SUR_REPLY_WINDOW
        to: SUR_REPLY_WINDOW
        trigger: "POST /ptab/proceedings/{proceedingId}/briefs with brief_type=PO_SUR_REPLY (accepted)"
        actor: PatentOwner
        preconditions:
          - "phase must be SUR_REPLY_WINDOW (ERR_INVALID_PHASE)"
          - "Caller X-User-ID must equal the patent owner's Party id (ERR_NOT_RESOURCE_OWNER)"
          - "now <= cycle_anchor_date + 146 days (ERR_BRIEF_WINDOW_CLOSED)"
          - "No other Brief with brief_type == PO_SUR_REPLY in the same cycle (ERR_BRIEF_SEQUENCE_VIOLATION)"
          - "page_count <= 40 hard cap (ERR_PAGE_LIMIT_EXCEEDED)"
        side_effects:
          - "overage_fee_cents computed; proceeding.total_overage_fee_cents += overage_fee_cents"
          - "phase is unchanged (the sur-reply closes the briefing record but the phase advances only when a hearing is scheduled)"
        note: "Self-loop: the one-brief-per-type-per-cycle rule is reachable here because the sur-reply does not advance the phase"

      - from: SUR_REPLY_WINDOW
        to: HEARING_PHASE
        trigger: "PATCH /ptab/oral-hearings/{hearingId} (scheduling the hearing closes the briefing record)"
        actor: BoardPanel
        preconditions:
          - "The target OralHearing is REQUESTED and belongs to this proceeding"
          - "phase must be REPLY_WINDOW or SUR_REPLY_WINDOW (ERR_INVALID_PHASE)"
        side_effects:
          - "OralHearing transitions REQUESTED -> SCHEDULED (see OralHearing machine)"

      - from: REPLY_WINDOW
        to: HEARING_PHASE
        trigger: "PATCH /ptab/oral-hearings/{hearingId} (hearing scheduled before any sur-reply is filed)"
        actor: BoardPanel
        preconditions:
          - "The target OralHearing is REQUESTED and belongs to this proceeding"
          - "phase must be REPLY_WINDOW or SUR_REPLY_WINDOW (ERR_INVALID_PHASE)"
        side_effects:
          - "OralHearing transitions REQUESTED -> SCHEDULED"

      - from: HEARING_PHASE
        to: DECISION_PHASE
        trigger: "POST /ptab/oral-hearings/{hearingId}/resolve with outcome HELD or WAIVED"
        actor: BoardPanel | Petitioner | PatentOwner
        preconditions:
          - "OralHearing must be SCHEDULED (ERR_INVALID_STATE)"
          - "outcome HELD requires BoardPanel; WAIVED requires a party to the proceeding (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "OralHearing -> HELD or WAIVED"

      - from: DECISION_PHASE
        to: DECIDED
        trigger: "POST /ptab/proceedings/{proceedingId}/final-decisions (accepted)"
        actor: BoardPanel
        preconditions:
          - "CHECKED FIRST: No existing FinalWrittenDecision with cycle == briefing_cycle (ERR_DECISION_ALREADY_ISSUED)"
          - "phase must be DECISION_PHASE (ERR_INVALID_PHASE)"
          - "now <= fwd_due_date (ERR_FWD_DEADLINE_PASSED)"
          - "outcomes covers every instituted claim exactly once, and every claim with a GRANTED substitute is AMENDED_SUBSTITUTED (ERR_OUTCOME_SET_INVALID)"
        side_effects:
          - "Create FinalWrittenDecision (issued_at = now, claims_cancelled_count = count of UNPATENTABLE outcomes)"
          - "estoppel_applied = true on the proceeding"
          - "CASCADE LINK 2: Patent claim counters recomputed (each UNPATENTABLE outcome: claims_cancelled_count += 1; claims_alive = total_claims - claims_cancelled_count) and Patent status derived per Patent machine precedence (claims_alive == 0 -> FULLY_CANCELLED; elif claims_amended_count > 0 -> AMENDED; elif claims_cancelled_count > 0 -> PARTIALLY_CANCELLED; else CONFIRMED)"
          - "CASCADE LINK 2 (estoppel): every LitigationMatter with patent_id == proceeding.patent_id AND defendant_party_id == petition.petitioner_id receives estoppel_claims = petition.challenged_claims"
          - "CASCADE LINK 3: if the patent became FULLY_CANCELLED, ACTIVE litigation matters for the patent auto-STAY with stay_reason = PATENT_CANCELLED (see Patent machine)"

      - from: DECIDED
        to: REMANDED
        trigger: "POST /ptab/appeals/{appealId}/decide with outcome VACATED_AND_REMANDED"
        actor: AppealsCourt
        preconditions:
          - "An Appeal for this proceeding is FILED (ERR_INVALID_STATE)"
          - "remand_instructions present (ERR_VALIDATION)"
        side_effects:
          - "briefing_cycle += 1"
          - "cycle_anchor_date = now (remand re-anchors the briefing windows)"
          - "amendment_slots_available += 1 (fresh motion of right for the new cycle)"
          - "estoppel_applied = false (vacated decision voids the estoppel)"
          - "CASCADE LINK 2: Patent status transitions back to IN_REVIEW (see Patent machine)"
          - "CASCADE LINK 3: litigation matters for the patent have estoppel_claims cleared to [] (see Patent machine remand transitions)"

      - from: REMANDED
        to: REPLY_WINDOW
        trigger: "POST /ptab/proceedings/{proceedingId}/briefs with brief_type=PO_RESPONSE (accepted) in the new cycle"
        actor: PatentOwner
        preconditions:
          - "phase must be INSTITUTED or REMANDED (ERR_INVALID_PHASE)"
          - "Caller is the patent owner (ERR_NOT_RESOURCE_OWNER)"
          - "now <= cycle_anchor_date + 90 days (ERR_BRIEF_WINDOW_CLOSED)"
          - "No PO_RESPONSE brief yet in the current cycle (ERR_BRIEF_SEQUENCE_VIOLATION)"
        side_effects:
          - "Same brief side effects as the INSTITUTED -> REPLY_WINDOW transition"

      - from: DECIDED
        to: CLOSED
        trigger: "POST /ptab/appeals/{appealId}/decide with outcome AFFIRMED or DISMISSED"
        actor: AppealsCourt
        preconditions:
          - "An Appeal for this proceeding is FILED (ERR_INVALID_STATE)"
        side_effects:
          - "No further mutations are possible on the proceeding (terminal)"

  - entity: DiscoveryRequest
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /ptab/discovery-requests/{requestId}/rule when garmin_score >= 6, or system auto-grant at creation for ROUTINE requests"
        actor: BoardPanel | system
        preconditions:
          - "For the panel ruling: status must be PENDING and discovery_type == ADDITIONAL (ERR_INVALID_STATE)"
        side_effects: []

      - from: PENDING
        to: DENIED
        trigger: "POST /ptab/discovery-requests/{requestId}/rule when garmin_score < 6"
        actor: BoardPanel
        preconditions:
          - "status must be PENDING and discovery_type == ADDITIONAL (ERR_INVALID_STATE)"
        side_effects: []

  - entity: AmendmentMotion
    initial_state: FILED
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: GRANTED
        trigger: "POST /ptab/amendment-motions/{motionId}/resolve with outcome=GRANTED"
        actor: BoardPanel
        preconditions:
          - "Motion must be FILED (ERR_INVALID_STATE)"
          - "Parent proceeding phase must not be DECIDED or CLOSED (ERR_INVALID_PHASE)"
        side_effects:
          - "For each substitute claim: Patent.total_claims += 1, Patent.claims_cancelled_count += 1 (the original is cancelled), Patent.claims_amended_count += 1; claims_alive (= total - cancelled) is therefore UNCHANGED by the swap"
          - "increments Patent.version by 1"

      - from: FILED
        to: DENIED
        trigger: "POST /ptab/amendment-motions/{motionId}/resolve with outcome=DENIED"
        actor: BoardPanel
        preconditions:
          - "Motion must be FILED (ERR_INVALID_STATE)"
        side_effects:
          - "The amendment slot stays consumed (a denied motion of right is spent)"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /ptab/amendment-motions/{motionId}/resolve with outcome=WITHDRAWN"
        actor: PatentOwner
        preconditions:
          - "Motion must be FILED (ERR_INVALID_STATE)"
          - "Caller X-User-ID must equal the patent owner's Party id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "proceeding.amendment_slots_available += 1 (compensating return of the slot)"

  - entity: OralHearing
    initial_state: REQUESTED
    terminal_states: [HELD, WAIVED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "PATCH /ptab/oral-hearings/{hearingId} with hearing_room_id, start_at, end_at"
        actor: BoardPanel
        preconditions:
          - "Hearing must be REQUESTED (ERR_INVALID_STATE)"
          - "end_at > start_at (ERR_INVALID_INTERVAL)"
          - "start_at <= proceeding.fwd_due_date (ERR_HEARING_PAST_FWD_DATE)"
          - "Room conflict: no other OralHearing in the same hearing_room with status == SCHEDULED whose buffered interval intersects (see calculations.hearing_room_conflict)"
          - "proceeding.phase in {REPLY_WINDOW, SUR_REPLY_WINDOW, HEARING_PHASE} (ERR_INVALID_PHASE)"
        side_effects:
          - "proceeding.phase -> HEARING_PHASE (if not already)"

      - from: SCHEDULED
        to: HELD
        trigger: "POST /ptab/oral-hearings/{hearingId}/resolve with outcome=HELD"
        actor: BoardPanel
        preconditions:
          - "Hearing must be SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "proceeding.phase -> DECISION_PHASE"

      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /ptab/oral-hearings/{hearingId}/resolve with outcome=WAIVED"
        actor: Petitioner | PatentOwner
        preconditions:
          - "Hearing must be SCHEDULED (ERR_INVALID_STATE)"
          - "Caller must be a party to the proceeding (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "proceeding.phase -> DECISION_PHASE"

      - from: SCHEDULED
        to: REQUESTED
        trigger: "POST /ptab/oral-hearings/{hearingId}/resolve with outcome=CONTINUED (continuance granted)"
        actor: BoardPanel
        preconditions:
          - "Hearing must be SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "hearing_room_id = null, start_at = null, end_at = null (booking released; the room slot is freed)"
          - "proceeding.phase remains HEARING_PHASE (or SUR_REPLY_WINDOW/REPLY_WINDOW if it never advanced; phase is unchanged)"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [AFFIRMED, VACATED_AND_REMANDED, DISMISSED]
    transitions:
      - from: FILED
        to: AFFIRMED
        trigger: "POST /ptab/appeals/{appealId}/decide with outcome=AFFIRMED"
        actor: AppealsCourt
        preconditions:
          - "Appeal must be FILED (ERR_INVALID_STATE)"
          - "remand_instructions must be absent (ERR_VALIDATION)"
        side_effects:
          - "proceeding.phase DECIDED -> CLOSED"

      - from: FILED
        to: DISMISSED
        trigger: "POST /ptab/appeals/{appealId}/decide with outcome=DISMISSED"
        actor: AppealsCourt
        preconditions:
          - "Appeal must be FILED (ERR_INVALID_STATE)"
          - "remand_instructions must be absent (ERR_VALIDATION)"
        side_effects:
          - "proceeding.phase DECIDED -> CLOSED"

      - from: FILED
        to: VACATED_AND_REMANDED
        trigger: "POST /ptab/appeals/{appealId}/decide with outcome=VACATED_AND_REMANDED"
        actor: AppealsCourt
        preconditions:
          - "Appeal must be FILED (ERR_INVALID_STATE)"
          - "remand_instructions present and in {REOPEN_RECORD, RECONSIDER} (ERR_VALIDATION)"
        side_effects:
          - "proceeding.phase DECIDED -> REMANDED (see Proceeding machine for the full remand cascade)"

# =============================================================================
# Concurrency Rules (OCC on parent version only — see §1.2.1 filter)
# =============================================================================
concurrency_rules:
  - rule_id: petition-create-stale-patent
    parent_entity: Patent
    write_endpoint: "POST /ptab/petitions"
    occ_field: "expected_patent_version"
    description: |
      Filing a petition against a Patent whose version has advanced since the
      client last read it is rejected: a prior petition filing (which itself
      increments Patent.version) or a decision cascade has changed the docket
      the client based its filing on, so the client's view of the patent is
      stale. Stated in OCC terms: expected_patent_version must equal the
      patent's current version.
    error_id: ERR_STALE_PATENT_VERSION
    http_status: 412

  - rule_id: litigation-matter-patch-stale
    parent_entity: LitigationMatter
    write_endpoint: "PATCH /ptab/litigation-matters/{matterId}"
    occ_field: "expected_litigation_matter_version"
    description: |
      Patching a LitigationMatter (trial date or status) whose version has
      advanced since the client last read it is rejected: another docket
      update or an institution/full-cancellation cascade has legitimately
      changed the matter, and re-applying a stale view would silently drop
      that change. Stated in OCC terms: expected_litigation_matter_version
      must equal the matter's current version.
    error_id: ERR_STALE_MATTER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: merits_likelihood_evaluation
    trigger: "POST /ptab/petitions/{petitionId}/decide-institution"
    algorithm: threshold
    formula: |
      inputs: per_ground_scores = array of {claim_number, basis, score} from the
      request payload (panel-scored, each score an integer 0..100).
      merits_max_score = max(score) over per_ground_scores.
      threshold_used = 40 when petition.review_type == IPR
                       (reasonable-likelihood standard),
                       51 when petition.review_type == PGR
                       (more-likely-than-not standard).
      merits_met = (merits_max_score >= threshold_used)   # boundary: 40 institutes an IPR, 39 does not
      advisory_aggregate_score = round_half_up(0.7 * merits_max_score
                                               + 0.3 * mean(all scores))   # NON-OPERATIVE variant
      The OPERATIVE rule is per_ground_max: institution requires only the
      single best ground to meet the threshold.
    input_set: "per_ground_scores supplied in the decision payload; every score must reference a claim in petition.challenged_claims"
    constants:
      IPR_THRESHOLD: 40
      PGR_THRESHOLD: 51
      AGGREGATE_MAX_WEIGHT: 0.7
      AGGREGATE_MEAN_WEIGHT: 0.3
    precision: "integer scores; advisory aggregate rounded round_half_up to integer"
    variants:
      - name: per_ground_max
        when: "operative institution rule (statutory: at least one challenged claim likely unpatentable)"
        difference: "uses max(per_ground_scores) >= threshold"
      - name: aggregate_weighted
        when: "advisory panel-screening metric reported on the decision record only"
        difference: "round_half_up(0.7*max + 0.3*mean); for scores [80,40,20] per_ground_max yields 80 while aggregate_weighted yields 70 — same inputs, different value, and aggregate_weighted NEVER decides institution"

  - name: fintiv_discretionary_score
    trigger: "Petition creation (provisional variant); PATCH /ptab/litigation-matters/{matterId} (refresh provisional on pending petitions); POST /ptab/petitions/{petitionId}/decide-institution (decision-time variant)"
    algorithm: forward_looking
    formula: |
      Consider only LitigationMatter rows with patent_id == petition.patent_id
      AND defendant_party_id == petition.petitioner_id
      AND status in {ACTIVE, STAYED}                         # input set filter
      If no such matter exists: score = 0.
      Otherwise, per matter, then take the MAX over matters:
        base        = 20                                     # a parallel case exists
        proximity   = 40 if matter.trial_date is not null
                       AND matter.trial_date <= projected_fwd_date
                      else 0
        investment  = 20 if (petition.filing_date - matter.complaint_served_date).days > 180
                      else 0
        stay        = -20 if matter.status == STAYED else 0
        matter_score = clamp(base + proximity + investment + stay, 0, 100)
      projected_fwd_date = now + 365 days                    # PINNED evaluation order (circular-looking
                                                             # dependency): the Fintiv proximity factor is
                                                             # ALWAYS computed against the BASE statutory
                                                             # deadline (decision date + 365 days). Any
                                                             # extension of a proceeding's fwd_due_date is
                                                             # decided only AFTER institution and NEVER
                                                             # retroactively widens the comparison date.
      discretionary_denial applies iff score >= 70 AND merits_met
    input_set: "LitigationMatter rows for the same patent naming the petitioner as defendant, in status ACTIVE or STAYED; SETTLED/TRIAL_COMPLETED/DISMISSED matters are excluded"
    constants:
      FINTIV_BASE: 20
      FINTIV_PROXIMITY: 40
      FINTIV_INVESTMENT: 20
      FINTIV_STAY_CREDIT: -20
      FINTIV_DENIAL_THRESHOLD: 70
      INVESTMENT_DAYS: 180
      PROJECTED_FWD_DAYS: 365
    precision: "integer points"
    variants:
      - name: provisional
        when: "computed at petition filing and stored on petition.fintiv_score; refreshed on litigation patches while the petition is pending"
        difference: "trial_date is read as-is; a matter with trial_date == null contributes proximity 0"
      - name: decision_time
        when: "recomputed inside decide-institution from live matter rows at decision time"
        difference: "identical formula but evaluated against the matter state at decision time; a petition filed when trial_date was null (provisional 40) can face decision_time score 80 after the court sets trial_date — same petition data, different score, different outcome"

  - name: fwd_deadline_computation
    trigger: "Proceeding creation (institution cascade); extension grant"
    algorithm: threshold
    formula: |
      OPERATIVE variant (fixed_days):
        fwd_due_date = institution_date + 365 days
        on extension grant: fwd_due_date += 183 days (once only)
      ADVISORY variant (anniversary):
        advisory_anniversary_date = institution_date + 12 calendar months
        on extension grant: advisory_anniversary_date += 6 calendar months
      The two variants diverge whenever the span contains a February 29:
      institution 2027-03-10 -> fwd_due_date 2028-03-09 (fixed days) vs
      advisory_anniversary_date 2028-03-10 (anniversary). The operative
      deadline is ALWAYS the fixed-days value.
    input_set: "the proceeding being created or extended"
    constants:
      FWD_BASE_DAYS: 365
      FWD_EXTENSION_DAYS: 183
    precision: "datetime, day granularity"
    variants:
      - name: fixed_days
        when: "operative statutory deadline used by every deadline check"
        difference: "institution_date + 365 days (+183 with extension)"
      - name: anniversary
        when: "advisory schedule-order display only; never gates any transition"
        difference: "institution_date + 12 calendar months (+6 calendar months with extension); differs from fixed_days across leap-day spans"

  - name: brief_window_deadlines
    trigger: "POST /ptab/proceedings/{proceedingId}/briefs"
    algorithm: threshold
    formula: |
      PO_RESPONSE window closes at     cycle_anchor_date + 90 days
      PETITIONER_REPLY window closes at cycle_anchor_date + 132 days
      PO_SUR_REPLY window closes at     cycle_anchor_date + 146 days
      A brief accepted after its window -> ERR_BRIEF_WINDOW_CLOSED.
      cycle_anchor_date = institution_date for cycle 0; remand timestamp for
      later cycles (remand re-anchors all three windows).
    constants:
      PO_RESPONSE_DAYS: 90
      PETITIONER_REPLY_DAYS: 132
      PO_SUR_REPLY_DAYS: 146
    precision: "datetime, day granularity"

  - name: garmin_interest_score
    trigger: "DiscoveryRequest creation with discovery_type == ADDITIONAL; consumed by POST /ptab/discovery-requests/{requestId}/rule"
    algorithm: threshold
    formula: |
      factors = factor_scores (exactly 5 integers, each 0..2)
      raw = sum(factors)
      if min(factors) == 0: total = min(raw, 4)      # any empty factor caps the score in the denial band
      else:                 total = raw
      if proceeding.phase == REPLY_WINDOW at creation: total += 1   # reply-phase diligence bonus
      garmin_score = min(total, 10)
      ruling: score >= 6 -> GRANTED, else DENIED (applied deterministically by the rule endpoint)
    input_set: "the ADDITIONAL discovery request's five factor scores and the proceeding phase at creation"
    constants:
      GARMIN_GRANT_THRESHOLD: 6
      GARMIN_EMPTY_FACTOR_CAP: 4
      GARMIN_REPLY_BONUS: 1
      GARMIN_MAX: 10
    precision: "integer points"

  - name: brief_overage_fee
    trigger: "Brief creation (accepted)"
    algorithm: tiered_pricing
    formula: |
      page_limit: PO_RESPONSE 90, PETITIONER_REPLY 45, PO_SUR_REPLY 20
      hard_cap:   PO_RESPONSE 110, PETITIONER_REPLY 65, PO_SUR_REPLY 40
      if page_count > hard_cap: reject ERR_PAGE_LIMIT_EXCEEDED
      overage_pages = max(0, page_count - page_limit)
      overage_fee_cents = round_half_up(overage_pages * 316.25)   # per-brief rounding
      proceeding.total_overage_fee_cents = SUM of per-brief overage_fee_cents
      PINNED ROUNDING ORDER: round each brief's fee to whole cents FIRST,
      then sum. Summing raw products and rounding once would give a
      different total (two briefs with 1 overage page each: per-brief
      316 + 316 = 632; sum-first round_half_up(632.5) = 633).
    constants:
      OVERAGE_RATE_CENTS_PER_PAGE: 316.25
      PO_RESPONSE_LIMIT: 90
      PETITIONER_REPLY_LIMIT: 45
      PO_SUR_REPLY_LIMIT: 20
      PO_RESPONSE_CAP: 110
      PETITIONER_REPLY_CAP: 65
      PO_SUR_REPLY_CAP: 40
    precision: "round_half_up to whole cents per brief, then integer sum"

  - name: petition_required_fee
    trigger: "POST /ptab/petitions"
    algorithm: tiered_pricing
    formula: |
      required_fee_cents = 1_900_000 + max(0, len(challenged_claims) - 20) * 15_000
      fee_paid_cents < required_fee_cents -> ERR_FEE_INSUFFICIENT (402)
    constants:
      BASE_FEE_CENTS: 1900000
      INCLUDED_CLAIMS: 20
      EXCESS_CLAIM_FEE_CENTS: 15000
    precision: "integer cents"

  - name: petition_time_bar
    trigger: "POST /ptab/petitions"
    algorithm: threshold
    formula: |
      barred iff EXISTS LitigationMatter with patent_id == petition.patent_id
        AND defendant_party_id == petition.petitioner_id
        AND (filing_date - complaint_served_date).days > 365      # strictly greater
      Boundary: exactly 365 days elapsed is NOT barred; 366 is barred.
      Matter status does not lift the bar (a served complaint bars even if
      the matter is later DISMISSED or SETTLED).
    constants:
      TIME_BAR_DAYS: 365
    precision: "whole days, datetime difference floored to days"

  - name: institution_window
    trigger: "POST /ptab/petitions/{petitionId}/decide-institution"
    algorithm: threshold
    formula: |
      decision must satisfy now <= accorded_date + 93 days
      Boundary: exactly at accorded_date + 93 days is timely; +94 days lapses.
    constants:
      INSTITUTION_WINDOW_DAYS: 93
    precision: "datetime, day granularity"

  - name: hearing_room_conflict
    trigger: "PATCH /ptab/oral-hearings/{hearingId} (scheduling)"
    algorithm: interval_merge
    formula: |
      The booking interval is half-open [start_at, end_at).
      Every OTHER OralHearing in the same hearing_room with status == SCHEDULED
      occupies its interval EXTENDED by a trailing 30-minute turnover buffer:
      occupied = [other.start_at, other.end_at + 30 min).
      Conflict iff start_at < occupied.end AND end_at > occupied.start.
      Boundary: a new hearing starting exactly at other.end_at + 30 min is
      accepted; one starting 1 minute earlier conflicts. A new hearing ending
      exactly at other.start_at is accepted (half-open adjacency).
    constants:
      TURNOVER_BUFFER_MINUTES: 30
    precision: "datetime, minute granularity"

  - name: panel_capacity
    trigger: "POST /ptab/petitions/{petitionId}/decide-institution when the computed outcome would be INSTITUTED"
    algorithm: aggregation
    formula: |
      active_load(judge) = count of Proceedings with
        lead_judge_user_id == judge AND
        phase in {INSTITUTED, REPLY_WINDOW, SUR_REPLY_WINDOW, HEARING_PHASE,
                  DECISION_PHASE, REMANDED}                      # DECIDED and CLOSED release the slot
      institution is rejected iff active_load(payload.lead_judge_user_id) >= 2
      (ERR_PANEL_CAPACITY_EXCEEDED). Boundary: exactly 1 active proceeding ->
      assignment allowed; exactly 2 -> rejected.
    constants:
      PANEL_LEAD_CAPACITY: 2
    precision: "integer count"

  - name: estoppel_scope
    trigger: "Final written decision issuance; appeal VACATED_AND_REMANDED (unwind)"
    algorithm: aggregation
    formula: |
      On decision issuance (phase DECISION_PHASE -> DECIDED):
        estoppel_claim_set = petition.challenged_claims   # all-claims institution (SAS-style):
                                                          # every challenged claim, instituted or not
        for each LitigationMatter with patent_id == proceeding.patent_id
            AND defendant_party_id == petition.petitioner_id:
          matter.estoppel_claims = estoppel_claim_set     # any status, including terminal
        proceeding.estoppel_applied = true
      On VACATED_AND_REMANDED:
        the same matter set has estoppel_claims cleared to []
        proceeding.estoppel_applied = false
    input_set: "LitigationMatter rows keyed by (patent_id, defendant_party_id) against the proceeding's petition"
    precision: "exact claim-number sets"

  - name: claims_reconciliation
    trigger: "AmendmentMotion GRANTED; FinalWrittenDecision issuance"
    algorithm: aggregation
    formula: |
      On amendment grant (per substitute claim):
        total_claims += 1; claims_cancelled_count += 1; claims_amended_count += 1
        claims_alive = total_claims - claims_cancelled_count  (unchanged by the swap)
      On final written decision (per outcome):
        UNPATENTABLE        -> claims_cancelled_count += 1
        AMENDED_SUBSTITUTED -> no counter change (the original was already
                               cancelled at grant time; double counting forbidden)
        NOT_UNPATENTABLE    -> no counter change
      CONSERVED QUANTITY (invariant INV-CLAIMS):
        claims_alive + claims_cancelled_count == total_claims
        holds after every grant and every decision.
      Status precedence after a decision:
        claims_alive == 0          -> FULLY_CANCELLED
        elif claims_amended_count > 0 -> AMENDED
        elif claims_cancelled_count > 0 -> PARTIALLY_CANCELLED
        else                       -> CONFIRMED
    input_set: "the proceeding's instituted claims, granted substitutes, and decision outcomes"
    precision: "integer counts"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.5 roles (including per-outcome role splits: only BoardPanel may resolve a hearing HELD or CONTINUED, only a party may WAIVE; only BoardPanel may resolve a motion GRANTED or DENIED, only the patent owner may WITHDRAW)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (patent -> petition/proceeding/brief/matter/motion/hearing/appeal/room); then body FK references exist (patent_id, petitioner_id, defendant_party_id, owner_id)"
    error_id: "ERR_PATENT_NOT_FOUND / ERR_PARTY_NOT_FOUND / ERR_MATTER_NOT_FOUND / ERR_PETITION_NOT_FOUND / ERR_PROCEEDING_NOT_FOUND / ERR_BRIEF_NOT_FOUND / ERR_REQUEST_NOT_FOUND / ERR_MOTION_NOT_FOUND / ERR_HEARING_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: auth
    check: "Ownership: POST /ptab/petitions requires petitioner_id == X-User-ID; brief filings require the caller to be the proceeding's petitioner (PETITIONER_REPLY) or the patent's owner (PO_RESPONSE, PO_SUR_REPLY); expert declarations require caller == brief.author_user_id; amendment motions and withdrawals require the patent owner; hearing requests/waivers, extension requests, and appeals require a party to the proceeding (petitioner or owner)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "party-scoped write endpoints"

  - priority: 5
    category: business_constraint
    check: "Request schema: required fields present; enums in range; challenged_claims non-empty unique and within 1..total_claims; grounds non-empty and every ground.claim_number in challenged_claims; prior_art non-empty; factor_scores exactly 5 integers 0..2 for ADDITIONAL discovery; remand_instructions present iff outcome == VACATED_AND_REMANDED and absent otherwise; justification >= 20 chars for extension requests; party_type of petitioner_id == PETITIONER and owner_id references a PATENT_OWNER party"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_patent_version == patent.version on POST /ptab/petitions; expected_litigation_matter_version == matter.version on PATCH /ptab/litigation-matters/{matterId}"
    error_id: "ERR_STALE_PATENT_VERSION / ERR_STALE_MATTER_VERSION"
    http_status: 412
    applies_to: "POST /ptab/petitions; PATCH /ptab/litigation-matters/{matterId}"

  - priority: 7
    category: state
    check: "State-machine preconditions: petition FILED for accord, NOTICE_ACCORDED for decide; proceeding phase gates for briefs/motions/hearings/decisions/extension; matter not terminal for PATCH; request PENDING for ruling; motion FILED for resolve; hearing REQUESTED for scheduling and SCHEDULED for resolve; appeal FILED for decide; proceeding DECIDED for appeal creation; no FILED appeal already pending; no REQUESTED/SCHEDULED hearing already pending; no decision already issued this cycle; extension not already used; target patent not FULLY_CANCELLED when filing a new petition"
    error_id: "ERR_PETITION_WRONG_STATE / ERR_INVALID_PHASE / ERR_INVALID_STATE / ERR_PROCEEDING_NOT_DECIDED / ERR_DECISION_ALREADY_ISSUED / ERR_APPEAL_ALREADY_PENDING / ERR_HEARING_ALREADY_PENDING / ERR_EXTENSION_ALREADY_USED"
    http_status: 409
    applies_to: "stateful write endpoints"

  - priority: 8
    category: business_temporal
    check: "Statutory clocks: petition time bar (filing within 365 days of complaint service, strictly-more-than-365 barred); institution decision within accorded_date + 93 days; briefs within their window (anchor + 90/132/146 days); final decision by fwd_due_date; hearing start_at <= fwd_due_date"
    error_id: "ERR_PETITION_TIME_BARRED / ERR_INSTITUTION_WINDOW_LAPSED / ERR_BRIEF_WINDOW_CLOSED / ERR_FWD_DEADLINE_PASSED / ERR_HEARING_PAST_FWD_DATE"
    http_status: 422
    applies_to: "POST /ptab/petitions; POST .../accord-filing-date (n/a); POST .../decide-institution; POST .../briefs; POST .../final-decisions; PATCH /ptab/oral-hearings/{hearingId}"

  - priority: 9
    category: business_constraint
    check: "Domain constraints: IPR grounds limited to {ANTICIPATION_102, OBVIOUSNESS_103} and prior art to {PATENT, PRINTED_PUBLICATION} (checked at accord); brief page hard caps; one brief of each type per cycle; no new evidence on PETITIONER_REPLY declarations; amendment slot available; substitute claims reference instituted claims and count <= instituted claim count; hearing room buffered-interval conflict; panel lead capacity < 2; decision outcome set covers instituted claims exactly once with AMENDED_SUBSTITUTED for granted substitutes"
    error_id: "ERR_GROUND_NOT_PERMITTED / ERR_PRIOR_ART_TYPE_NOT_PERMITTED / ERR_PAGE_LIMIT_EXCEEDED / ERR_BRIEF_SEQUENCE_VIOLATION / ERR_NEW_EVIDENCE_IN_REPLY / ERR_AMENDMENT_QUOTA_EXCEEDED / ERR_AMENDMENT_VOLUME_EXCEEDED / ERR_SUBSTITUTE_CLAIM_MISMATCH / ERR_HEARING_ROOM_CONFLICT (409) / ERR_PANEL_CAPACITY_EXCEEDED (409) / ERR_INVALID_INTERVAL / ERR_OUTCOME_SET_INVALID"
    http_status: 422
    applies_to: "domain write endpoints"

  - priority: 10
    category: business_fiscal
    check: "Filing fee: fee_paid_cents >= petition_required_fee (base 1,900,000 cents covering 20 claims + 15,000 cents per additional challenged claim)"
    error_id: ERR_FEE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /ptab/petitions"

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving platform endpoint (unprefixed, declared per §1.5 ladder) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every statutory deadline and timestamp in the system. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock set; all subsequent deadline checks and system timestamps use it"]

  # --- Parties ---
  - method: POST
    path: "/ptab/parties"
    description: "Register a party (petitioner-side or patent-owner-side)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, party_type, "counsel_firm?"]
    output: Party
    side_effects: []

  # --- Patents ---
  - method: POST
    path: "/ptab/patents"
    description: "Register an issued patent on the docket"
    roles: [PlatformAdmin]
    code: 201
    input: [patent_number, title, issue_date, owner_id, total_claims]
    output: Patent
    side_effects: ["status = ISSUED; claims_alive = total_claims; claims_cancelled_count = 0; claims_amended_count = 0"]

  - method: GET
    path: "/ptab/patents"
    description: "List patents with optional filters"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: ["owner_id?", "status?", "limit?", "offset?"]
    output: "Patent[]"
    side_effects: []

  - method: GET
    path: "/ptab/patents/{patentId}"
    description: "Get a patent"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: Patent
    side_effects: []

  # --- Litigation matters (parallel district-court cases) ---
  - method: POST
    path: "/ptab/patents/{patentId}/litigation-matters"
    description: "Docket a parallel district-court litigation matter for a patent"
    roles: [PlatformAdmin]
    code: 201
    input: [defendant_party_id, court_name, docket_number, complaint_served_date, "trial_date?"]
    output: LitigationMatter
    side_effects: ["status = ACTIVE; stay_reason = null; estoppel_claims = []"]

  - method: GET
    path: "/ptab/litigation-matters"
    description: "List litigation matters with optional filters"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: ["patent_id?", "defendant_party_id?", "status?", "limit?", "offset?"]
    output: "LitigationMatter[]"
    side_effects: []

  - method: GET
    path: "/ptab/litigation-matters/{matterId}"
    description: "Get a litigation matter"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: LitigationMatter
    side_effects: []

  - method: PATCH
    path: "/ptab/litigation-matters/{matterId}"
    description: "Update a matter's trial_date and/or status (stay, lift stay, settle, dismiss, mark trial completed). OCC-guarded."
    roles: [PlatformAdmin]
    code: 200
    input: ["trial_date?", "status?", expected_litigation_matter_version]
    output: LitigationMatter
    side_effects:
      - "increments LitigationMatter.version by 1"
      - "status transitions per LitigationMatter machine; stay_reason set/cleared accordingly"
      - "refresh fintiv_score (provisional variant) on every Petition with patent_id == this patent and status in {FILED, NOTICE_ACCORDED}"

  # --- Petitions ---
  - method: POST
    path: "/ptab/petitions"
    description: "File a petition for post-grant review (IPR or PGR) challenging claims of an issued patent. OCC-guarded against the patent."
    roles: [Petitioner]
    code: 201
    input: [patent_id, petitioner_id, review_type, challenged_claims, grounds, prior_art, real_party_in_interest, fee_paid_cents, expected_patent_version]
    output: Petition
    side_effects:
      - "increments Patent.version by 1"
      - "status = FILED; filing_date = current logical time"
      - "fintiv_score computed (provisional variant)"

  - method: GET
    path: "/ptab/petitions"
    description: "List petitions with optional filters"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: ["patent_id?", "petitioner_id?", "status?", "limit?", "offset?"]
    output: "Petition[]"
    side_effects: []

  - method: GET
    path: "/ptab/petitions/{petitionId}"
    description: "Get a petition"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: Petition
    side_effects: []

  - method: POST
    path: "/ptab/petitions/{petitionId}/accord-filing-date"
    description: "Board formal review: accord a filing date (checks statutory ground set and prior-art type limits for IPR)"
    roles: [BoardPanel]
    code: 200
    input: []
    output: Petition
    side_effects: ["status FILED -> NOTICE_ACCORDED; accorded_date = now; fintiv_score refreshed"]

  - method: POST
    path: "/ptab/petitions/{petitionId}/decide-institution"
    description: "Board institution decision: applies the merits threshold, the Fintiv discretionary screen, the 93-day statutory window, and panel capacity; on INSTITUTED creates the Proceeding and fires the institution cascade"
    roles: [BoardPanel]
    code: 201
    input: [per_ground_scores, lead_judge_user_id]
    output: { decision_id: string, outcome: string, merits_max_score: integer, advisory_aggregate_score: integer, threshold_used: integer, fintiv_score: integer, proceeding_id: string }
    side_effects:
      - "create InstitutionDecision; petition.status -> INSTITUTED or DENIED; petition.merits_max_score and advisory_aggregate_score recorded"
      - "on INSTITUTED: create Proceeding (phase INSTITUTED, deadlines computed), Patent -> IN_REVIEW, ACTIVE litigation matters for the patent -> STAYED (INSTITUTION_STAY)"

  - method: GET
    path: "/ptab/petitions/{id}/institution-decision"
    description: "Get the institution decision for a petition (array of 0 or 1)"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: "InstitutionDecision[]"
    side_effects: []

  # --- Proceedings ---
  - method: GET
    path: "/ptab/proceedings"
    description: "List proceedings with optional filters"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: ["patent_id?", "petition_id?", "lead_judge_user_id?", "phase?", "limit?", "offset?"]
    output: "Proceeding[]"
    side_effects: []

  - method: GET
    path: "/ptab/proceedings/{proceedingId}"
    description: "Get a proceeding"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: Proceeding
    side_effects: []

  - method: POST
    path: "/ptab/proceedings/{proceedingId}/briefs"
    description: "File a brief (patent owner response, petitioner reply, or patent owner sur-reply) within the current briefing window"
    roles: [Petitioner, PatentOwner]
    code: 201
    input: [brief_type, page_count]
    output: Brief
    side_effects:
      - "phase advances per Proceeding machine (PO_RESPONSE -> REPLY_WINDOW; PETITIONER_REPLY -> SUR_REPLY_WINDOW)"
      - "overage_fee_cents computed (round per brief); proceeding.total_overage_fee_cents += overage_fee_cents"

  - method: GET
    path: "/ptab/proceedings/{id}/briefs"
    description: "List briefs filed in a proceeding"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: "Brief[]"
    side_effects: []

  - method: GET
    path: "/ptab/briefs/{briefId}"
    description: "Get a brief"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: Brief
    side_effects: []

  - method: POST
    path: "/ptab/briefs/{briefId}/expert-declarations"
    description: "Attach an expert declaration to a brief"
    roles: [Petitioner, PatentOwner]
    code: 201
    input: [declarant_name, page_count, contains_new_evidence]
    output: ExpertDeclaration
    side_effects: []

  - method: GET
    path: "/ptab/briefs/{id}/expert-declarations"
    description: "List expert declarations attached to a brief"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: "ExpertDeclaration[]"
    side_effects: []

  # --- Discovery ---
  - method: POST
    path: "/ptab/proceedings/{proceedingId}/discovery-requests"
    description: "Request discovery. ROUTINE requests are auto-GRANTED; ADDITIONAL requests compute garmin_score and await a panel ruling"
    roles: [Petitioner, PatentOwner]
    code: 201
    input: [discovery_type, "factor_scores?"]
    output: DiscoveryRequest
    side_effects: ["ROUTINE -> status GRANTED immediately; ADDITIONAL -> status PENDING, garmin_score computed"]

  - method: GET
    path: "/ptab/proceedings/{id}/discovery-requests"
    description: "List discovery requests in a proceeding"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: "DiscoveryRequest[]"
    side_effects: []

  - method: POST
    path: "/ptab/discovery-requests/{requestId}/rule"
    description: "Panel ruling on an ADDITIONAL discovery request; outcome is deterministic from garmin_score (>= 6 grants)"
    roles: [BoardPanel]
    code: 200
    input: []
    output: DiscoveryRequest
    side_effects: ["status PENDING -> GRANTED when garmin_score >= 6, else -> DENIED"]

  # --- Amendment practice ---
  - method: POST
    path: "/ptab/proceedings/{proceedingId}/amendment-motions"
    description: "Patent owner files a motion to amend with substitute claims (one motion of right per briefing cycle)"
    roles: [PatentOwner]
    code: 201
    input: [substitute_claims]
    output: AmendmentMotion
    side_effects:
      - "status = FILED; cycle = proceeding.briefing_cycle; construction_standard = PHILLIPS"
      - "proceeding.amendment_slots_available -= 1"

  - method: GET
    path: "/ptab/proceedings/{id}/amendment-motions"
    description: "List amendment motions in a proceeding"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: "AmendmentMotion[]"
    side_effects: []

  - method: POST
    path: "/ptab/amendment-motions/{motionId}/resolve"
    description: "Resolve an amendment motion: BoardPanel grants or denies (applying the PHILLIPS construction standard); the patent owner withdraws (slot returned)"
    roles: [BoardPanel, PatentOwner]
    code: 200
    input: [outcome, "rationale?"]
    output: AmendmentMotion
    side_effects:
      - "GRANTED: per substitute claim, Patent.total_claims += 1, claims_cancelled_count += 1, claims_amended_count += 1 (claims_alive unchanged); increments Patent.version"
      - "WITHDRAWN: proceeding.amendment_slots_available += 1"
      - "DENIED: slot stays consumed"

  # --- Statutory extension ---
  - method: POST
    path: "/ptab/proceedings/{proceedingId}/extension-requests"
    description: "Request the single good-cause extension of the final-written-decision deadline (+183 days)"
    roles: [Petitioner, PatentOwner]
    code: 200
    input: [justification]
    output: Proceeding
    side_effects: ["fwd_due_date += 183 days; advisory_anniversary_date += 6 calendar months; extension_used = true; increments Proceeding.version by 1"]

  # --- Oral hearing ---
  - method: POST
    path: "/ptab/proceedings/{proceedingId}/oral-hearings"
    description: "A party requests oral argument; creates the hearing in REQUESTED. Proceeding phase must be in {INSTITUTED, REPLY_WINDOW, SUR_REPLY_WINDOW, HEARING_PHASE, REMANDED} (ERR_INVALID_PHASE) and no hearing in REQUESTED or SCHEDULED may already exist for the proceeding (ERR_HEARING_ALREADY_PENDING)"
    roles: [Petitioner, PatentOwner]
    code: 201
    input: ["argument_minutes?"]
    output: OralHearing
    side_effects: ["status = REQUESTED; hearing_room_id/start_at/end_at = null"]

  - method: GET
    path: "/ptab/oral-hearings"
    description: "List oral hearings with optional filters"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: ["proceeding_id?", "hearing_room_id?", "status?", "limit?", "offset?"]
    output: "OralHearing[]"
    side_effects: []

  - method: GET
    path: "/ptab/oral-hearings/{hearingId}"
    description: "Get an oral hearing"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: OralHearing
    side_effects: []

  - method: PATCH
    path: "/ptab/oral-hearings/{hearingId}"
    description: "Panel schedules (or re-schedules after continuance) a REQUESTED hearing into a room and time; closes the briefing record"
    roles: [BoardPanel]
    code: 200
    input: [hearing_room_id, start_at, end_at]
    output: OralHearing
    side_effects: ["status REQUESTED -> SCHEDULED; proceeding.phase -> HEARING_PHASE if not already"]

  - method: POST
    path: "/ptab/oral-hearings/{hearingId}/resolve"
    description: "Resolve a scheduled hearing: HELD (panel), WAIVED (a party), or CONTINUED (panel; releases the booking and returns the hearing to REQUESTED)"
    roles: [BoardPanel, Petitioner, PatentOwner]
    code: 200
    input: [outcome]
    output: OralHearing
    side_effects: ["HELD/WAIVED -> proceeding.phase = DECISION_PHASE; CONTINUED -> hearing_room_id/start_at/end_at = null, status = REQUESTED"]

  # --- Final written decision ---
  - method: POST
    path: "/ptab/proceedings/{proceedingId}/final-decisions"
    description: "Issue the final written decision for the current briefing cycle; attaches estoppel and reconciles the patent claim ledger"
    roles: [BoardPanel]
    code: 201
    input: [outcomes]
    output: FinalWrittenDecision
    side_effects:
      - "proceeding.phase DECISION_PHASE -> DECIDED; estoppel_applied = true"
      - "estoppel cascade: matters (patent_id, defendant == petitioner) receive estoppel_claims = challenged_claims"
      - "claims_reconciliation on the patent; status precedence FULLY_CANCELLED > AMENDED > PARTIALLY_CANCELLED > CONFIRMED"
      - "if FULLY_CANCELLED: ACTIVE litigation matters auto-STAY with stay_reason = PATENT_CANCELLED"

  - method: GET
    path: "/ptab/proceedings/{id}/final-decisions"
    description: "List final written decisions of a proceeding (one per briefing cycle)"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: "FinalWrittenDecision[]"
    side_effects: []

  # --- Appeal ---
  - method: POST
    path: "/ptab/proceedings/{proceedingId}/appeals"
    description: "A party appeals the final written decision to the federal appellate court"
    roles: [Petitioner, PatentOwner]
    code: 201
    input: []
    output: Appeal
    side_effects: ["status = FILED; appellant_user_id = X-User-ID"]

  - method: GET
    path: "/ptab/proceedings/{id}/appeals"
    description: "List appeals of a proceeding"
    roles: [PlatformAdmin, BoardPanel, Petitioner, PatentOwner, AppealsCourt]
    code: 200
    input: []
    output: "Appeal[]"
    side_effects: []

  - method: POST
    path: "/ptab/appeals/{appealId}/decide"
    description: "Appellate disposition: AFFIRMED or DISMISSED closes the proceeding; VACATED_AND_REMANDED reopens it (remand cascade, new briefing cycle)"
    roles: [AppealsCourt]
    code: 200
    input: [outcome, "remand_instructions?"]
    output: Appeal
    side_effects: ["AFFIRMED/DISMISSED -> proceeding CLOSED; VACATED_AND_REMANDED -> proceeding REMANDED, briefing_cycle += 1, amendment_slots_available += 1, estoppel unwound, patent -> IN_REVIEW"]

  # --- Hearing rooms ---
  - method: POST
    path: "/ptab/hearing-rooms"
    description: "Register a hearing room at the board facility"
    roles: [PlatformAdmin]
    code: 201
    input: [name, capacity]
    output: HearingRoom
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & authorization ---
  - { id: ERR_MISSING_AUTH_HEADERS, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role may not call this endpoint, or may not request this outcome (e.g. a party resolving a hearing HELD, or the panel withdrawing a motion)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Caller is not the owning party for the resource: petitioner_id != X-User-ID on filing; reply filed by someone other than the proceeding's petitioner; PO brief / amendment motion / withdrawal by someone other than the patent owner; declaration attached by someone other than the brief's author; hearing/extension/appeal by a non-party" }

  # --- Existence (404) ---
  - { id: ERR_PARTY_NOT_FOUND, http: 404, condition: "Referenced party id does not exist (body reference: owner_id, petitioner_id, defendant_party_id)" }
  - { id: ERR_PATENT_NOT_FOUND, http: 404, condition: "Patent id in path or body does not exist" }
  - { id: ERR_MATTER_NOT_FOUND, http: 404, condition: "Litigation matter id in path does not exist" }
  - { id: ERR_PETITION_NOT_FOUND, http: 404, condition: "Petition id in path does not exist" }
  - { id: ERR_PROCEEDING_NOT_FOUND, http: 404, condition: "Proceeding id in path does not exist" }
  - { id: ERR_BRIEF_NOT_FOUND, http: 404, condition: "Brief id in path does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "Discovery request id in path does not exist" }
  - { id: ERR_MOTION_NOT_FOUND, http: 404, condition: "Amendment motion id in path does not exist" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "Oral hearing id in path does not exist" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "Hearing room id in request body does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Appeal id in path does not exist" }

  # --- Request schema (400) ---
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, wrong type, enum out of range, empty/duplicate challenged_claims, claim number out of 1..total_claims, ground claim not among challenged_claims, empty prior_art, factor_scores not exactly 5 integers 0..2 for ADDITIONAL discovery, remand_instructions present/absent contrary to outcome, justification shorter than 20 characters, party_type mismatch on a referenced party" }

  # --- Optimistic concurrency (412) ---
  - { id: ERR_STALE_PATENT_VERSION, http: 412, condition: "expected_patent_version does not match the patent's current version on POST /ptab/petitions" }
  - { id: ERR_STALE_MATTER_VERSION, http: 412, condition: "expected_litigation_matter_version does not match the matter's current version on PATCH /ptab/litigation-matters/{matterId}" }

  # --- State preconditions (409) ---
  - { id: ERR_PETITION_WRONG_STATE, http: 409, condition: "Petition not in FILED for accord-filing-date, or not in NOTICE_ACCORDED for decide-institution" }
  - { id: ERR_INVALID_PHASE, http: 409, condition: "Proceeding phase does not admit the operation (brief type vs phase window, motion filing outside INST/REPLY/REMAND phases, decision outside DECISION_PHASE, scheduling outside briefing phases, extension after DECIDED/CLOSED, resolve motion on DECIDED/CLOSED proceeding)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity-level state precondition failed: matter terminal for PATCH, discovery request not PENDING for ruling, motion not FILED for resolve, hearing not REQUESTED for scheduling or not SCHEDULED for resolve, appeal not FILED for decide" }
  - { id: ERR_PROCEEDING_NOT_DECIDED, http: 409, condition: "Appeal creation requires the proceeding to be DECIDED" }
  - { id: ERR_DECISION_ALREADY_ISSUED, http: 409, condition: "A final written decision already exists for the current briefing cycle" }
  - { id: ERR_APPEAL_ALREADY_PENDING, http: 409, condition: "An appeal in FILED status already exists for the proceeding" }
  - { id: ERR_HEARING_ALREADY_PENDING, http: 409, condition: "An oral hearing in REQUESTED or SCHEDULED status already exists for the proceeding" }
  - { id: ERR_EXTENSION_ALREADY_USED, http: 409, condition: "The single good-cause extension has already been granted for this proceeding" }
  - { id: ERR_HEARING_ROOM_CONFLICT, http: 409, condition: "Requested room interval intersects another SCHEDULED hearing's buffered interval [start, end + 30 min) in the same room" }
  - { id: ERR_PANEL_CAPACITY_EXCEEDED, http: 409, condition: "Panel lead already leads 2 proceedings in active phases; a third institution under that lead is rejected" }

  # --- Business temporal (422) ---
  - { id: ERR_PETITION_TIME_BARRED, http: 422, condition: "A litigation matter naming the petitioner as defendant served its complaint strictly more than 365 days before filing (exactly 365 days is not barred)" }
  - { id: ERR_INSTITUTION_WINDOW_LAPSED, http: 422, condition: "decide-institution called after accorded_date + 93 days" }
  - { id: ERR_BRIEF_WINDOW_CLOSED, http: 422, condition: "Brief filed after its window closed (cycle_anchor_date + 90 / +132 / +146 days for PO_RESPONSE / PETITIONER_REPLY / PO_SUR_REPLY)" }
  - { id: ERR_FWD_DEADLINE_PASSED, http: 422, condition: "Final written decision attempted after fwd_due_date (extension must be granted first)" }
  - { id: ERR_HEARING_PAST_FWD_DATE, http: 422, condition: "Hearing start_at is after the proceeding's fwd_due_date" }

  # --- Business constraint (422) ---
  - { id: ERR_GROUND_NOT_PERMITTED, http: 422, condition: "IPR petition asserts a basis outside {ANTICIPATION_102, OBVIOUSNESS_103} (checked at accord-filing-date)" }
  - { id: ERR_PRIOR_ART_TYPE_NOT_PERMITTED, http: 422, condition: "IPR petition relies on prior art whose reference_type is not PATENT or PRINTED_PUBLICATION (checked at accord-filing-date)" }
  - { id: ERR_PAGE_LIMIT_EXCEEDED, http: 422, condition: "Brief page_count exceeds the hard cap for its type (110 / 65 / 40)" }
  - { id: ERR_BRIEF_SEQUENCE_VIOLATION, http: 422, condition: "A brief of this type already exists in the current briefing cycle" }
  - { id: ERR_NEW_EVIDENCE_IN_REPLY, http: 422, condition: "Expert declaration with contains_new_evidence=true attached to a PETITIONER_REPLY brief" }
  - { id: ERR_AMENDMENT_QUOTA_EXCEEDED, http: 422, condition: "No amendment slot available in the current briefing cycle (amendment_slots_available == 0)" }
  - { id: ERR_AMENDMENT_VOLUME_EXCEEDED, http: 422, condition: "substitute_claims count exceeds the number of instituted claims (reasonable-number presumption)" }
  - { id: ERR_SUBSTITUTE_CLAIM_MISMATCH, http: 422, condition: "A substitute claim's original_claim_number is not among the proceeding's instituted_claims (every substitute must respond to an instituted ground)" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "end_at is not strictly after start_at" }
  - { id: ERR_OUTCOME_SET_INVALID, http: 422, condition: "Decision outcomes do not cover every instituted claim exactly once, contain a claim outside the instituted set, duplicate a claim, or fail to mark a claim with a granted substitute as AMENDED_SUBSTITUTED" }

  # --- Business fiscal (402) ---
  - { id: ERR_FEE_INSUFFICIENT, http: 402, condition: "fee_paid_cents below the required filing fee (1,900,000 cents covering 20 claims + 15,000 cents per additional challenged claim)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Docketing administrator: registers parties, patents, hearing rooms and litigation dockets; operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /ptab/parties"
      - "POST /ptab/patents"
      - "POST /ptab/patents/{patentId}/litigation-matters"
      - "PATCH /ptab/litigation-matters/{matterId}"
      - "POST /ptab/hearing-rooms"
    shared_operations:
      - "All GET endpoints"

  - name: BoardPanel
    description: "Administrative patent judge panel: accords filing dates, decides institution, rules on discovery and amendments, schedules and holds hearings, issues final written decisions"
    identity: opaque
    exclusive_operations:
      - "POST /ptab/petitions/{petitionId}/accord-filing-date"
      - "POST /ptab/petitions/{petitionId}/decide-institution"
      - "POST /ptab/discovery-requests/{requestId}/rule"
      - "PATCH /ptab/oral-hearings/{hearingId}"
      - "POST /ptab/proceedings/{proceedingId}/final-decisions"
    shared_operations:
      - "POST /ptab/amendment-motions/{motionId}/resolve (outcomes GRANTED | DENIED only)"
      - "POST /ptab/oral-hearings/{hearingId}/resolve (outcomes HELD | CONTINUED only)"
      - "All GET endpoints"

  - name: Petitioner
    description: "Counsel for the petitioner; X-User-ID is the petitioner Party id"
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /ptab/petitions"
    shared_operations:
      - "POST /ptab/proceedings/{proceedingId}/briefs (brief_type PETITIONER_REPLY only, and only as the proceeding's petitioner)"
      - "POST /ptab/briefs/{briefId}/expert-declarations (only on own briefs)"
      - "POST /ptab/proceedings/{proceedingId}/discovery-requests"
      - "POST /ptab/proceedings/{proceedingId}/oral-hearings"
      - "POST /ptab/oral-hearings/{hearingId}/resolve (outcome WAIVED only)"
      - "POST /ptab/proceedings/{proceedingId}/extension-requests"
      - "POST /ptab/proceedings/{proceedingId}/appeals"
      - "All GET endpoints"

  - name: PatentOwner
    description: "Counsel for the patent owner; X-User-ID is the owner Party id referenced by Patent.owner_id"
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /ptab/proceedings/{proceedingId}/amendment-motions"
    shared_operations:
      - "POST /ptab/proceedings/{proceedingId}/briefs (brief_type PO_RESPONSE | PO_SUR_REPLY only, and only as the patent's owner)"
      - "POST /ptab/briefs/{briefId}/expert-declarations (only on own briefs)"
      - "POST /ptab/proceedings/{proceedingId}/discovery-requests"
      - "POST /ptab/proceedings/{proceedingId}/oral-hearings"
      - "POST /ptab/oral-hearings/{hearingId}/resolve (outcome WAIVED only)"
      - "POST /ptab/proceedings/{proceedingId}/extension-requests"
      - "POST /ptab/proceedings/{proceedingId}/appeals"
      - "POST /ptab/amendment-motions/{motionId}/resolve (outcome WITHDRAWN only, as the patent's owner)"
      - "All GET endpoints"

  - name: AppealsCourt
    description: "Federal appellate court clerk entering dispositions on appeals"
    identity: opaque
    exclusive_operations:
      - "POST /ptab/appeals/{appealId}/decide"
    shared_operations:
      - "All GET endpoints"
