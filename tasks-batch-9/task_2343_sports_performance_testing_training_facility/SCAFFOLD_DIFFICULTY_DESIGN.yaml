              as: FrontDesk
              captures: { enr_u2_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { athlete_id: "${ath_u3_id}", group_session_id: "${gs_q_id}" }
              as: FrontDesk
              captures: { enr_u3_id: $.data.id }
          assert:
            - "GroupSession.${gs_p_id}.athlete_units == 1.0"
            - "GroupSession.${gs_p_id}.required_coach_count == 2"
            - "GroupSession.${gs_p_id}.staffing_status == STAFFED"
            - "GroupSession.${gs_q_id}.athlete_units == 4.5"
            - "GroupSession.${gs_q_id}.required_coach_count == 2"
            - "GroupSession.${gs_q_id}.staffing_status == STAFFED"
            - "GroupSession.${gs_p_id}.required_coach_count == GroupSession.${gs_q_id}.required_coach_count, yet GroupSession.${gs_p_id}.station_count == 6 while GroupSession.${gs_q_id}.station_count == 3"
            - "Enrollment.${enr_u3_id}.status == RESERVED"
            - "Enrollment.${enr_u3_id}.funding_source == DROP_IN"
            - "Enrollment.${enr_u3_id}.charge_cents == 6000"
            - "Enrollment.${enr_x_id}.charge_cents == 4500"

      - name: no_show_statement_rounds_each_line_before_summing_to_2476_not_2475
