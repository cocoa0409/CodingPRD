              as: "millplanner"
              as_user_id: "planner-1"
          assert:
            - "both calls return HTTP 401 with response.data.error_id == 'ERR_UNKNOWN_ROLE'"
            - "neither response carries a data object"
            - "GET /suppliers/${supplier_id} as Supplier with X-User-ID ${supplier_id} returns HTTP 200 with response.data.name == 'Delta Fiber Recovery'"

