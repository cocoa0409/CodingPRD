        grounds: [state_machines.Auction.CLOSED_to_SETTLED, calculations.auction_settlement_waterfall]
        distinguishing_aspect: "Immediate consistency: the settle RESPONSE itself carries status SETTLED and the final_* fields (no re-read, no lag); a follow-up GET shows identical values."
        test_recipe:
          setup: ["ACTIVE org; intake i1 created 2026-05-01 appraised 100000, UNCLAIMED 2026-06-01; auction a1 [06-05, 06-10] OPENed; o1 bid 30000; closed 2026-06-10 exactly at ends_at"]
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "IMM200", primary_color: "Blue", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 100000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/open", payload: {}, as: Registrar, captures: { v2: $.data.version } }
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 30000, expected_auction_version: "${v2}" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/close", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/settle", payload: {}, as: Registrar, captures: { a_status: $.data.status, a_payout: $.data.final_partner_payout_cents } }
            - { call: "GET /registry/auctions/${a1_id}", as: Registrar, captures: { a_payout2: $.data.final_partner_payout_cents } }
          assert:
            - "Settle response itself: status == SETTLED (observed ${a_status}), final_partner_payout_cents == 22275 (observed ${a_payout}) — storage min(35*150=5250, cap 9000)==5250, commission round(0.10*24750)==2475, payout 30000-5250-2475==22275"
            - "Follow-up GET agrees: final_partner_payout_cents == 22275 (observed ${a_payout2})"

