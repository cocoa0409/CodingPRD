              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-S1", market_id: "${mkt}", property_address: "1 Soon St", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-02T11:00:00Z" }
              as: ClientAgent
