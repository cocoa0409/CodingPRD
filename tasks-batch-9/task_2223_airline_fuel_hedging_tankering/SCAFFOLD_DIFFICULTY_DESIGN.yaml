              payload: { hedge_instrument_id: "${live_id}", collateral_type: "CASH", expected_counterparty_version: "${cp_v2}" }
              as: RiskPolicyAdmin
              captures: { live_posting_id: $.data.id }
            - call: "POST /fuel/hedge-instruments/${dead_id}/terminate"
              payload: { termination_reason: "Unwound before any collateral moved." }
              as: TreasuryRiskManager
          trigger:
            - call: "POST /fuel/collateral-postings/${dead_posting_id}/post"
              payload: { amount_usd: 10000.00 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/collateral-postings/${live_posting_id}/post"
              payload: { amount_usd: 10000.00 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/collateral-postings/${live_posting_id}/post"
              payload: { amount_usd: 90000.00 }
              as: RiskPolicyAdmin
          assert:
            - "before the trigger: CollateralPosting.${dead_posting_id}.status == REQUIRED with required_amount_usd 90000.00, and HedgeInstrument.${dead_id}.trade_status == TERMINATED"
            - "the first post returns 409 with error_id ERR_INSTRUMENT_INVALID_TRADE_STATE, and NOT 422 ERR_COLLATERAL_SHORTFALL, even though 10000.00 is far below the 90000.00 required"
            - "CollateralPosting.${dead_posting_id}.status == REQUIRED and posted_amount_usd == 0 after the rejection"
            - "the second post returns 422 with error_id ERR_COLLATERAL_SHORTFALL, proving the amount check is live when the parent trade is EXECUTED"
            - "the third post returns 200: CollateralPosting.${live_posting_id}.status == POSTED with posted_amount_usd == 90000.00"
            - "Counterparty.${cp_a_id}.posted_collateral_usd == 90000.00, utilized_credit_usd == 90000.00, utilization_pct == 9.00, open_margin_call_count == 1"
            - "HedgeProgram.${prog_id}.hedged_gallons == 1500000 and coverage_pct_delta == 13.64"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: forecast_half_open_month_interval_allows_touching_periods
        grounds:
          - validations[priority=11]
          - entities.ConsumptionForecast.fields.period_start_month
          - entities.ConsumptionForecast.fields.period_end_month
          - errors.ERR_FORECAST_PERIOD_OVERLAP
        distinguishing_aspect: |
          Forecast periods are half-open on [period_start_month, period_end_month), so a
          second NARROWBODY / DOMESTIC_SHORT forecast starting 2027-03 clashes with the
          published 2027-01 to 2027-04 row, while one starting exactly at 2027-04 touches
          without intersecting and publishes cleanly; a 2027-03 start on a different
          route_group also publishes, showing the exclusion key is fleet_type AND
          route_group and the check runs at publish, not at create.
        test_recipe:
          setup:
            - "One PUBLISHED NARROWBODY / DOMESTIC_SHORT forecast for 2027-01 to 2027-04."
            - "Three DRAFT forecasts: NARROWBODY / DOMESTIC_SHORT 2027-03 to 2027-06, NARROWBODY / DOMESTIC_SHORT 2027-04 to 2027-07, and NARROWBODY / DOMESTIC_LONG 2027-03 to 2027-06."
          setup_api_calls:
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { base_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${base_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-03", period_end_month: "2027-06", forecast_gallons: 2000000 }
              as: FuelAnalyst
              captures: { clash_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "FALL", period_start_month: "2027-04", period_end_month: "2027-07", forecast_gallons: 2000000 }
              as: FuelAnalyst
              captures: { touch_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_LONG", season: "SUMMER", period_start_month: "2027-03", period_end_month: "2027-06", forecast_gallons: 2000000 }
              as: FuelAnalyst
              captures: { other_route_id: $.data.id }
          trigger:
            - call: "POST /fuel/consumption-forecasts/${clash_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts/${touch_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts/${other_route_id}/publish"
              payload: {}
              as: FuelAnalyst
          assert:
            - "the clash publish returns 409 with error_id ERR_FORECAST_PERIOD_OVERLAP because [2027-03, 2027-06) intersects [2027-01, 2027-04)"
            - "ConsumptionForecast.${clash_id}.status == DRAFT and published_at is null after the rejection: its creation was accepted, only publication is gated"
            - "the touching publish returns 200 because period_end_month 2027-04 of the base row equals period_start_month 2027-04 of the new row and half-open intervals do not intersect at the shared endpoint"
            - "ConsumptionForecast.${touch_id}.status == PUBLISHED"
            - "the DOMESTIC_LONG publish returns 200: the exclusion key is fleet_type AND route_group together"
            - "ConsumptionForecast.${other_route_id}.status == PUBLISHED"

      - name: supply_contract_closed_interval_with_changeover_buffer
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - entities.SupplyContract.fields.term_start_date
          - errors.ERR_CONTRACT_TERM_OVERLAP
          - errors.ERR_CONTRACT_BUFFER_VIOLATION
        distinguishing_aspect: |
          Contract terms are CLOSED intervals separated by a 7-day changeover buffer, the
          opposite convention to forecasts: a term starting 2027-04-06 is 6 clear days
          after the 2027-03-31 end and fails the buffer, 2027-04-07 is exactly 7 days and
          passes, and a term starting 2027-06-30 - the very last day of the sitting
          contract - intersects it, so sharing a single endpoint is an overlap here while
          it is legal for forecasts.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-10T00:00:00Z."
            - "Station ORD holding exactly one SupplyContract, ORD-Q1, term 2027-01-01 to 2027-03-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-Q1", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-03-31", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-BUFFER6", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.5000, differential_usd_per_gal: 0.0300, term_start_date: "2027-04-06", term_end_date: "2027-04-06", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-Q2", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.5000, differential_usd_per_gal: 0.0300, term_start_date: "2027-04-07", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-TOUCH", index_basis: "PLATTS_NWE", index_price_usd_per_gal: 2.6000, differential_usd_per_gal: 0.0400, term_start_date: "2027-06-30", term_end_date: "2027-07-31", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-Q3", index_basis: "PLATTS_NWE", index_price_usd_per_gal: 2.6000, differential_usd_per_gal: 0.0400, term_start_date: "2027-07-07", term_end_date: "2027-09-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
              captures: { c3_id: $.data.id }
          assert:
            - "the ORD-BUFFER6 attempt returns 409 with error_id ERR_CONTRACT_BUFFER_VIOLATION: 2027-04-06 minus 2027-03-31 is 6 clear days, one short of CHANGEOVER_BUFFER_DAYS 7"
            - "the ORD-Q2 attempt returns 201: 2027-04-07 minus 2027-03-31 is exactly 7 days, and the buffer is inclusive at 7"
            - "the ORD-TOUCH attempt returns 409 with error_id ERR_CONTRACT_TERM_OVERLAP, and NOT ERR_CONTRACT_BUFFER_VIOLATION, because 2027-06-30 is inside the closed term of ORD-Q2"
            - "the ORD-Q3 attempt returns 201: 2027-07-07 minus 2027-06-30 is exactly 7 days"
            - "GET /fuel/stations/${ord_id}/supply-contracts returns exactly 3 rows"
            - "SupplyContract.${c1_id}.status == ACTIVE, SupplyContract.${c2_id}.status == SCHEDULED and SupplyContract.${c3_id}.status == SCHEDULED at the 2027-02-10 clock"
            - "SupplyContract.${c2_id}.all_in_price_usd_per_gal == 2.5750 and SupplyContract.${c3_id}.all_in_price_usd_per_gal == 2.6850"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: collateral_return_conserves_posted_ledger_without_touching_credit
        grounds:
          - state_machines.CollateralPosting.POSTED_to_RETURNED_manual
          - entities.Counterparty.fields.posted_collateral_usd
          - entities.Counterparty.fields.utilized_credit_usd
          - entities.CollateralPosting.fields.posted_amount_usd
        distinguishing_aspect: |
          Over-posting 250000.00 against a 180000.00 requirement and then returning it
          restores Counterparty.posted_collateral_usd and
          HedgeInstrument.collateral_posted_usd to their pre-posting 0.00 exactly, while
          utilized_credit_usd stays at 180000.00 throughout - collateral and credit are
          separate ledgers, and only one of them is compensated. The posting row keeps
          posted_amount_usd 250000.00 for audit instead of being zeroed.
        test_recipe:
          setup:
            - "One ACTIVE HedgeProgram, consumption_basis_gallons 11000000, with one EXECUTED 3000000-gallon SWAP whose margin_requirement_usd is 180000.00."
            - "Counterparty credit_limit_usd 1000000.00, posted_collateral_usd 0.00, utilized_credit_usd 180000.00."
            - "One CollateralPosting in REQUIRED with required_amount_usd 180000.00."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CI1", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRA", legal_name: "Dealer A Bank NA", credit_rating: "A", credit_limit_usd: 1000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CI1", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 28.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v1: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 3000000, maturity_month: "2027-03", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v1}" }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "GET /fuel/counterparties/${cp_a_id}"
              payload: {}
              as: RiskPolicyAdmin
              captures: { cp_v1: $.data.version }
            - call: "POST /fuel/counterparties/${cp_a_id}/collateral-postings"
              payload: { hedge_instrument_id: "${inst_id}", collateral_type: "CASH", expected_counterparty_version: "${cp_v1}" }
              as: RiskPolicyAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /fuel/collateral-postings/${p1_id}/post"
              payload: { amount_usd: 250000.00 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/collateral-postings/${p1_id}/return"
              payload: { return_reason: "Excess margin recalled; requirement unchanged." }
              as: RiskPolicyAdmin
          assert:
            - "before the post: Counterparty.${cp_a_id}.posted_collateral_usd == 0.00, utilized_credit_usd == 180000.00, open_margin_call_count == 1; HedgeInstrument.${inst_id}.collateral_posted_usd == 0.00"
            - "after the post: CollateralPosting.${p1_id}.status == POSTED, posted_amount_usd == 250000.00, Counterparty.${cp_a_id}.posted_collateral_usd == 250000.00, open_margin_call_count == 0, HedgeInstrument.${inst_id}.collateral_posted_usd == 250000.00"
            - "the return is permitted because margin_requirement_usd 180000.00 is below collateral_posted_usd 250000.00 even though the trade is still EXECUTED"
            - "after the return: Counterparty.${cp_a_id}.posted_collateral_usd == 0.00 and HedgeInstrument.${inst_id}.collateral_posted_usd == 0.00, exactly the pre-posting values"
            - "CollateralPosting.${p1_id}.status == RETURNED with posted_amount_usd still 250000.00 and required_amount_usd still 180000.00"
            - "Counterparty.${cp_a_id}.utilized_credit_usd == 180000.00 and utilization_pct == 18.00 at every step: the credit ledger is not compensated by a collateral return"
            - "Counterparty.${cp_a_id}.open_margin_call_count == 0 after the return: returning does not re-open the call"

      - name: terminate_restores_coverage_and_credit_to_pre_execution_values
        grounds:
          - state_machines.HedgeInstrument.trade_status_EXECUTED_to_TERMINATED
          - entities.HedgeProgram.fields.hedged_gallons
          - entities.HedgeProgram.fields.coverage_pct_delta
          - entities.Counterparty.fields.utilized_credit_usd
          - validations[priority=27]
        distinguishing_aspect: |
          Execution moves four ledgers (hedged_gallons 3000000, delta_adjusted_gallons
          3000000.00, coverage_pct_delta 27.27, utilized_credit_usd 180000.00) and
          termination returns every one of them to its exact pre-execution value while the
          instrument row keeps notional_gallons 3000000 and delta_adjusted_gallons
          3000000.00 for audit; the independent witness is that closing the program, which
          was blocked by ERR_PROGRAM_HAS_OPEN_INSTRUMENTS before, now succeeds.
        test_recipe:
          setup:
            - "One ACTIVE HedgeProgram, consumption_basis_gallons 11000000, with one PROPOSED 3000000-gallon SWAP."
            - "Counterparty credit_limit_usd 1000000.00 with all ledgers at zero."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CI2", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRA", legal_name: "Dealer A Bank NA", credit_rating: "A", credit_limit_usd: 1000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CI2", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 28.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v1: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 3000000, maturity_month: "2027-03", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v1}" }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
          trigger:
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-programs/${prog_id}/close"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-instruments/${inst_id}/terminate"
              payload: { termination_reason: "Hedge unwound at the desk's request." }
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-programs/${prog_id}/close"
              payload: {}
              as: TreasuryRiskManager
          assert:
            - "pre-execution snapshot: HedgeProgram.${prog_id}.hedged_gallons == 0, delta_adjusted_gallons == 0.00, coverage_pct_notional == 0.00, coverage_pct_delta == 0.00, open_instrument_count == 1; Counterparty.${cp_a_id}.utilized_credit_usd == 0.00, utilization_pct == 0.00, credit_posture == NORMAL"
            - "after execute: hedged_gallons == 3000000, delta_adjusted_gallons == 3000000.00, coverage_pct_notional == 27.27, coverage_pct_delta == 27.27, planned_coverage_pct_delta == 27.27; utilized_credit_usd == 180000.00, utilization_pct == 18.00"
            - "the first close returns 409 with error_id ERR_PROGRAM_HAS_OPEN_INSTRUMENTS"
            - "after terminate: hedged_gallons == 0, delta_adjusted_gallons == 0.00, coverage_pct_notional == 0.00, coverage_pct_delta == 0.00, planned_coverage_pct_delta == 0.00, open_instrument_count == 0"
            - "after terminate: Counterparty.${cp_a_id}.utilized_credit_usd == 0.00, utilization_pct == 0.00, credit_posture == NORMAL, posted_collateral_usd == 0.00"
            - "HedgeInstrument.${inst_id}.trade_status == TERMINATED, margin_requirement_usd == 0, but notional_gallons == 3000000 and delta_adjusted_gallons == 3000000.00 are retained"
            - "the second close returns 200 and HedgeProgram.${prog_id}.status == CLOSED"

      - name: station_gallon_ledger_trued_up_at_reconciliation
        grounds:
          - state_machines.TankeringDirective.APPROVED_to_EXECUTED
          - state_machines.TankeringDirective.EXECUTED_to_RECONCILED
          - entities.Station.fields.inventory_gallons
          - entities.FlightLeg.fields.actual_uplift_gallons
        distinguishing_aspect: |
          Execution debits the origin station by the REQUESTED 3000 gallons and
          reconciliation posts a compensating +400 true-up so the ledger ends at
          497400 - exactly opening stock minus the ACTUAL 2600 gallons lifted - rather
          than at the requested figure; with avg_daily_liftings_gallons 10000 the true-up
          is visible in days_cover, which moves 50.00 -> 49.70 -> 49.74.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-10T00:00:00Z."
            - "Station ORD with avg_daily_liftings_gallons 10000, into_plane_fee 0.0450, one ACTIVE contract at 2.4000 + 0.0250 and 500000 gallons of opening stock."
            - "Station DFW with into_plane_fee 0.0800 and one ACTIVE contract at 2.9000 + 0.1200."
            - "One NARROWBODY FlightLeg ORD-DFW with uplift_cap_gallons 10600.00 and an APPROVED directive for 3000 gallons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CI3", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 10000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { dfw_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${dfw_id}/supply-contracts"
              payload: { contract_ref: "DFW-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.9000, differential_usd_per_gal: 0.1200, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 500000, reason: "Opening physical stock" }
              as: FuelOpsController
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "UA600", departure_date: "2027-02-19", origin_station_id: "${ord_id}", destination_station_id: "${dfw_id}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 14500, tank_capacity_gallons: 26000, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 128000, max_landing_weight_lbs: 200000 }
              as: FuelOpsController
              captures: { leg_id: $.data.id, leg_v: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_id}/tankering-directives"
              payload: { requested_uplift_gallons: 3000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { dir_id: $.data.id }
            - call: "POST /fuel/tankering-directives/${dir_id}/approve"
              payload: {}
              as: FuelOpsController
          trigger:
            - call: "POST /fuel/tankering-directives/${dir_id}/execute"
              payload: {}
              as: FuelOpsController
            - call: "POST /fuel/tankering-directives/${dir_id}/reconcile"
              payload: { actual_uplift_gallons: 2600, actual_block_minutes: 210 }
              as: FuelOpsController
          assert:
            - "before the trigger: Station.${ord_id}.inventory_gallons == 500000, effective_inventory_gallons == 500000, days_cover == 50.00, supply_posture == NORMAL"
            - "after execute: Station.${ord_id}.inventory_gallons == 497000 and days_cover == 49.70 (debited at the REQUESTED 3000)"
            - "after reconcile: Station.${ord_id}.inventory_gallons == 497400 and days_cover == 49.74 (a +400 compensating true-up, not a second debit)"
            - "500000 - Station.${ord_id}.inventory_gallons == 2600, exactly FlightLeg.${leg_id}.actual_uplift_gallons"
            - "FlightLeg.${leg_id}.actual_uplift_gallons == 2600 and FlightLeg.${leg_id}.actual_block_minutes == 210"
            - "TankeringDirective.${dir_id}.status == RECONCILED and requested_uplift_gallons is still 3000"
            - "Station.${ord_id}.supply_posture == NORMAL at every step, so the true-up is observable only in inventory_gallons and days_cover"
