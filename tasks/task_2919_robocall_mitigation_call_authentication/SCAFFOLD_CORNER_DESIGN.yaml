      - name: risk_index_rounding_stage_is_observable
        claim_type: precision
        grounds:
          - calculations.customer_traffic_risk_index
        excluded_because:
          difficulty_instance: risk_index_rounds_per_window_before_recency_weighting
          rationale: "The §1.8 instance pins the exact rounding contract (2-decimal round_half_up per window, then 4-decimal round_half_up over the stored subscores) by asserting 0.7380 against the 0.7390 that carrying raw ratios to the end would produce."

      - name: recency_weights_are_renormalized_not_truncated
        claim_type: weighted_scoring
        grounds:
          - calculations.customer_traffic_risk_index
        excluded_because:
          difficulty_instance: observation_closed_window_touching_endpoint_collides
          rationale: "The two-window renormalization case is already asserted there: with only [0.50, 0.30] in play the index is 0.2000 rather than the 0.1600 that a non-renormalized sum would give, which is the weighted_scoring corner for this calculation."

      - name: same_period_two_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.mitigation_effectiveness_score
        excluded_because:
          difficulty_instance: effectiveness_provisional_vs_certified_on_same_period
          rationale: "That §1.8 instance is exactly this claim: byte-identical stored data scored 0.8000 under PROVISIONAL and 0.5000 under CERTIFIED, with all three components asserted on both reports."

      - name: variant_is_selected_by_the_generation_request
        claim_type: variant_selection
        grounds:
          - entities.EffectivenessReport.fields.variant
        excluded_because:
          difficulty_instance: effectiveness_provisional_vs_certified_on_same_period
          rationale: "The same instance generates one report per variant through the `variant` input on POST /rmd/effectiveness-reports and asserts that each report carries the variant it was asked for, so selection-in-context is covered."

      - name: outstanding_forfeiture_is_a_full_recompute
        claim_type: aggregation
        grounds:
          - calculations.provider_outstanding_forfeiture
        excluded_because:
          difficulty_instance: outstanding_forfeiture_conserved_across_dismissal_and_payment
          rationale: "Add, reversal (DISMISSED) and settlement (PAID) are all exercised there against the same provider, with the running total asserted after every status change — the aggregation claim in full."

