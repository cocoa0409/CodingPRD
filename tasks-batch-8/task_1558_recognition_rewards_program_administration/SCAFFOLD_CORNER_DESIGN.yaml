      - name: vendor_suspended_blocks_submit
        claim_type: precondition_enforcement
        grounds: ["validations[priority=11]", "errors[ERR_VENDOR_SUSPENDED]", state_machines.FulfillmentVendor.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "After HRAdmin suspends the vendor, submitting a still-PENDING order of that vendor is rejected ERR_VENDOR_SUSPENDED; reactivate makes the same submit succeed."
        test_recipe:
          setup: ["funded employee; one PENDING_SUBMISSION order on vendor V"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
