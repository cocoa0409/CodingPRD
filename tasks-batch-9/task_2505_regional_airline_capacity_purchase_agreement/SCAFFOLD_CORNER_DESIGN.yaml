              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l2}/complete"
              payload: { actual_block_hours: 1.000, actual_arrival_utc: "2026-09-03T09:05:00Z", enplaned_bags: 100, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l3}/complete"
