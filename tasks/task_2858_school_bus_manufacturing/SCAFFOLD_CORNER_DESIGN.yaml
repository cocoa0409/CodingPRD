          assert:
            - "PlantScheduler on POST /bus-models, QualityInspector on POST /production-lines, DealerAgent on POST /test-bays and SalesEngineer on POST /dealers each fail 403 ERR_ROLE_NOT_PERMITTED"
            - "ComplianceOfficer on POST /solicitations with an EMPTY payload still fails 403 ERR_ROLE_NOT_PERMITTED — priority 2 precedes priority 3, so the missing required fields are never reported"
            - "no row is created by any denied call: the closing GET-visible state contains exactly the one BusModel created by the permitted ComplianceOfficer call"
            - "the shared read GET /bus-models succeeds for DealerAgent, so the denials are about the write verbs, not about the entity"

      - name: same_user_cannot_submit_and_award_the_same_bid
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=41]
          - validations[priority=23]
          - validations[priority=24]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_SOLICITATION_NOT_CLOSED]
          - errors[ERR_BID_STATE_INVALID]
          - complexity_profile.role_model
        distinguishing_aspect: |
          Segregation of duties is keyed on X-User-ID, not on role: user dual-01 legitimately holds both the
          SalesEngineer and ContractsAdmin roles, and every individual call it makes is role-permitted — yet
          awarding the bid it submitted itself is refused. The check also sits BELOW the solicitation-state
          gate (23) in the ladder, so the same self-award attempted while the solicitation is still OPEN
          reports ERR_SOLICITATION_NOT_CLOSED instead, and it does not reserve the bid: a different
          ContractsAdmin awards it immediately afterwards.
        test_recipe:
          setup:
            - "TX 1-unit solicitation SOL-TX-123; the bid is created and submitted by dual-01 acting as SalesEngineer"
            - "Clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
