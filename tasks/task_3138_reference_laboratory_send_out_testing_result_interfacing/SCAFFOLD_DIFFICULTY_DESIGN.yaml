  - rule_id: boundary_precision_check
    instances:

      # -----------------------------------------------------------------------
      - name: reflex_stability_bound_is_strict_while_stability_bound_is_inclusive
        grounds:
          - validations.priority_10_business_safety
          - validations.priority_11_business_safety
          - calculations.specimen_remaining_stability
          - entities.TestCatalogEntry.fields.reflex_min_remaining_hours
          - entities.TestCatalogEntry.fields.stability_hours_ambient
        distinguishing_aspect: |
          Two different numeric bounds sit on the same subject: the accessioning bound is
          inclusive, so 12.0 remaining hours against a 12-hour window accessions, while the
