            - "Predetermination.${pred_id}.submitted_fee_cents == 90000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: item_schedule_requires_predetermination_approved
        grounds:
          - state_machines.TreatmentPlanItem.PLANNED_to_SCHEDULED
          - entities.TreatmentPlanItem.fields.requires_predetermination
          - entities.Predetermination.fields.status
          - errors[ERR_PREDETERMINATION_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair TreatmentPlanItem -> Predetermination: an item with
          requires_predetermination=true cannot transition PLANNED->SCHEDULED
          unless its linked Predetermination.status == APPROVED; a PENDING
          predetermination blocks scheduling with ERR_PREDETERMINATION_NOT_APPROVED.
        test_recipe:
          setup:
            - "ACCEPTED plan; item requires_predetermination=true; its predetermination is still PENDING."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Cross1", date_of_birth: "1988-05-05" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Cross1", provider_type: "DENTIST", npi: "1000000013" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-10" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2740", category: "MAJOR", fee_cents: 90000, phase_number: 1, tooth_number: 8, requires_predetermination: true }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /predeterminations"
              payload: { treatment_plan_item_id: "${item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { pred_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-11-01T09:00:00Z", end_at: "2026-11-01T10:00:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_PREDETERMINATION_NOT_APPROVED"
            - "TreatmentPlanItem.${item_id}.status == PLANNED (unchanged)"

      - name: appointment_checkin_requires_patient_active
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
          - entities.Patient.fields.status
          - errors[ERR_PATIENT_INACTIVE]
        distinguishing_aspect: |
          A DIFFERENT entity pair Appointment -> Patient: a SCHEDULED appointment
          cannot transition to CHECKED_IN when Patient.status == INACTIVE; the
          check-in is rejected with ERR_PATIENT_INACTIVE.
        test_recipe:
          setup:
            - "A SCHEDULED free-standing appointment whose patient is then deactivated."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Cross2", date_of_birth: "1989-06-06" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Cross2", provider_type: "DENTIST", npi: "1000000014" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-11" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-12-01T09:00:00Z", end_at: "2026-12-01T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /patients/${p_id}/deactivate"
              payload: {}
              as: FrontDesk
              captures: { pstat: $.data.status }
          trigger:
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_PATIENT_INACTIVE"
            - "Appointment.${appt_id}.status == SCHEDULED (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: operatory_overlap_uses_turnover_buffer
        grounds:
          - validations[priority=8]
          - entities.Operatory.fields.turnover_buffer_minutes
          - errors[ERR_OPERATORY_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Operatory interval semantics INCLUDE the room's turnover_buffer_minutes:
          appt A [09:00,10:00) occupies the room through [09:00,10:15) with a 15-min
          buffer, so a B starting 10:10 (inside the buffer) is rejected — the buffer
          widens the occupancy interval, unlike the provider rule.
        test_recipe:
          setup:
            - "Operatory with turnover_buffer_minutes=15; appt A 09:00-10:00 booked."
            - "Appt B in the SAME room starting 10:10 (within the 15-min buffer)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat T1", date_of_birth: "1990-07-07" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr T1a", provider_type: "DENTIST", npi: "1000000015" }
              as: FrontDesk
              captures: { prov_a: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr T1b", provider_type: "DENTIST", npi: "1000000016" }
              as: FrontDesk
              captures: { prov_b: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-12", turnover_buffer_minutes: 15 }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_a}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2027-01-04T09:00:00Z", end_at: "2027-01-04T10:00:00Z" }
              as: FrontDesk
              captures: { appt_a: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_b}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2027-01-04T10:10:00Z", end_at: "2027-01-04T11:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_OPERATORY_DOUBLE_BOOKED (10:10 falls inside [10:00,10:15) buffer)"

      - name: provider_overlap_no_buffer_adjacent_ok
        grounds:
          - validations[priority=8]
          - entities.Appointment.fields.provider_id
          - errors[ERR_OPERATORY_DOUBLE_BOOKED]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource axis (provider, no
          buffer, half-open [start,end)): the same provider booked [09:00,10:00) in
          one room and [09:59,10:30) in another collides (no buffer but true time
          overlap), proving the provider rule uses raw half-open overlap with zero
          turnover, distinct from the buffered operatory rule.
        test_recipe:
          setup:
            - "Provider P booked [09:00,10:00) in OP-A; a second appt for the SAME provider [09:59,10:30) in OP-B."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat T2", date_of_birth: "1991-08-08" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr T2", provider_type: "DENTIST", npi: "1000000017" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-13A", turnover_buffer_minutes: 0 }
              as: FrontDesk
              captures: { op_a: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-13B", turnover_buffer_minutes: 0 }
              as: FrontDesk
              captures: { op_b: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_a}", appointment_type: "OPERATIVE", start_at: "2027-02-01T09:00:00Z", end_at: "2027-02-01T10:00:00Z" }
              as: FrontDesk
              captures: { appt_a: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_b}", appointment_type: "OPERATIVE", start_at: "2027-02-01T09:59:00Z", end_at: "2027-02-01T10:30:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_OPERATORY_DOUBLE_BOOKED (provider double-booked; raw [09:59,10:00) overlap, no buffer involved)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_void_restores_annual_benefit_used_accumulator
        grounds:
          - state_machines.Claim.adjudication=PAID_to_adjudication=VOID
          - entities.PatientCoverage.fields.annual_benefit_used_cents
          - calculations.annual_benefit_accumulator
        distinguishing_aspect: |
          Conserved quantity = coverage.annual_benefit_used_cents. Forward action
          (adjudicate PAID) debits +100000; compensating action (void) credits
          -100000, leaving annual_benefit_used back at 0 and annual_max_reached
          back to false — net drift zero on this conserved benefit pool.
        test_recipe:
          setup:
            - "A BASIC claim fee=130000 adjudicated to carrier_paid=100000 (== annual_max), then voided."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Void", date_of_birth: "1985-09-09" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Void", provider_type: "DENTIST", npi: "1000000018" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-14" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2396", category: "BASIC", fee_cents: 130000, phase_number: 1, tooth_number: 12 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2027-03-01T09:00:00Z", end_at: "2027-03-01T10:00:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/attachments"
              payload: { attachment_type: "XRAY", document_ref: "ref://x6" }
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { paid: $.data.carrier_paid_cents }
          trigger:
            - call: "POST /claims/${claim_id}/void"
              payload: {}
              as: BillingSpecialist
              captures: { adj_after: $.data.adjudication_status }
          assert:
            - "Claim.${claim_id}.adjudication_status == VOID"
            - "PatientCoverage.${cov_id}.annual_benefit_used_cents == 0 (restored from 100000)"
            - "PatientCoverage.${cov_id}.annual_max_reached == false (flipped back)"

      - name: payment_plan_reverse_installment_restores_remaining_balance
        grounds:
          - state_machines.PaymentPlan.PAID_OFF_to_ACTIVE
          - entities.PaymentPlan.fields.amount_posted_cents
          - entities.PaymentPlan.fields.remaining_balance_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = PaymentPlan financed total
          (remaining_balance + amount_posted == principal). Posting an installment
          (+) then reversing it (-) returns remaining_balance to its prior value and
          flips PAID_OFF back to ACTIVE, with the financed total conserved at 62500.
        test_recipe:
          setup:
            - "Claim adjudicated to patient_responsibility 62500; financed over 7 installments."
            - "A lump 62500 posted (=> PAID_OFF), then a 62500 reversal posted."
          setup_api_calls:
