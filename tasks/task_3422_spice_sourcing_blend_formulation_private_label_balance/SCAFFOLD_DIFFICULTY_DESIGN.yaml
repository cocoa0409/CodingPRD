            - { call: "POST /spice/lots/${a1}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${a1}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${a1}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${a1}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${a2}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
