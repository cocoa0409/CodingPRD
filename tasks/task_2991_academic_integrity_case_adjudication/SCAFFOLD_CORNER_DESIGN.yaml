      - name: case_dimensions_advance_independently_corner_stub
        claim_type: parallel
        grounds:
          - state_machines.Case[dimension=adjudication]
          - state_machines.Case[dimension=notation]
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_parallel_dimensions_advance_independently_of_each_other
          rationale: "The parallel-shape claim (both dimensions of the same Case row move on their own triggers and the combined state is correct) is the whole subject of the named §1.8 instance."

      - name: report_returned_for_info_cycle_corner_stub
        claim_type: cyclic
        grounds:
          - state_machines.IntegrityReport.SUBMITTED_to_RETURNED_FOR_INFO
