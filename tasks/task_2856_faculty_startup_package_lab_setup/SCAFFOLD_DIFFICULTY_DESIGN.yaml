              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${dept15_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { fac15_id: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${fac15_id}", package_kind: "INITIAL", dean_unit_id: "${dean15_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 12000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { pkg15_id: $.data.id }
            - call: "POST /startup-packages/${pkg15_id}/tranches"
              payload: { category: "RENOVATION", fiscal_year: 2027, amount_cents: 12000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { tr15_ren: $.data.id }
            - call: "POST /startup-packages/${pkg15_id}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
            - call: "POST /startup-packages/${pkg15_id}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${dept15_id}"
            - call: "POST /startup-packages/${pkg15_id}/approve"
              payload: {}
              as: Dean
              as_user_id: "${col15_id}"
            - call: "POST /faculty/${fac15_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /startup-packages/${pkg15_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "133", net_sq_ft: 1050, space_class: "WET", power_kw_capacity: 140.00, chilled_water_available: true, fume_hood_count: 2, floor_load_psf: 300 }
              as: FacilitiesManager
              captures: { space15_id: $.data.id }
            - call: "POST /renovation-projects"
              payload: { package_id: "${pkg15_id}", space_id: "${space15_id}", scope_tier: "MODERATE", estimate_cents: 12000000 }
              as: FacilitiesManager
              captures: { proj15_id: $.data.id }
            - call: "POST /renovation-projects/${proj15_id}/phases"
              payload: { sequence_no: 1, name: "Demolition", planned_start: "2026-08-10T00:00:00Z", planned_end: "2026-09-30T00:00:00Z", budget_cents: 6000000 }
              as: FacilitiesManager
              captures: { ph15_1: $.data.id }
          trigger:
            - call: "POST /renovation-projects/${proj15_id}/phases"
              payload: { sequence_no: 2, name: "Casework install", planned_start: "2026-09-30T00:00:00Z", planned_end: "2026-10-20T00:00:00Z", budget_cents: 6000000 }
              as: FacilitiesManager
