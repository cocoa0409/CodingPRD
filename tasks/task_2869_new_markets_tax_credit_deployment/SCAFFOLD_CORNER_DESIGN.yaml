        excluded_because:
          difficulty_instance: cross_entity_state_dependency / unwind_opening_gated_on_the_qei_compliance_year_counter_reaching_seven
          rationale: "That instance already exercises the open-exercise-settle action chain end to end, including the precondition refusal at year six and the pricing snapshot taken when the window opens."

  # ===========================================================================
  # Error-catalog coverage sweep. Every id in §1.6 must be triggerable; the
  # instances above and in SCAFFOLD_DIFFICULTY_DESIGN.yaml already trigger 39 of
  # the 45. The remaining six are the per-entity path 404s that no other recipe
  # happens to hit, and they are swept here in one instance. The four
  # authorisation errors (ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED,
  # ERR_NOT_RESOURCE_OWNER, ERR_SEGREGATION_OF_DUTIES) are covered in the rbac
  # section below.
  # ===========================================================================
  - section: errors
    instances:
      - name: every_path_entity_has_its_own_distinct_not_found_code
        claim_type: triggerability_coverage
        grounds:
          - errors[ERR_CDE_NOT_FOUND]
          - errors[ERR_INVESTMENT_FUND_NOT_FOUND]
          - errors[ERR_QLICI_NOT_FOUND]
          - errors[ERR_REINVESTMENT_OBLIGATION_NOT_FOUND]
          - errors[ERR_CBA_NOT_FOUND]
          - errors[ERR_UNWIND_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "Each entity type owns a DISTINCT 404 code rather than a shared generic one, and the code is chosen from the path segment, not from which rows happen to exist. All six are returned against a populated database where the same UUID is unknown to every collection."
        test_recipe:
          setup:
            - "A populated database: one CDE, one ACTIVE award, one tract, one CERTIFIED QALICB, one benefits agreement, one closed fund, one QEI and one QLICI all exist, so no collection is empty."
