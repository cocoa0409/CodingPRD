            - "LoanerSet.${ls_fh_a_id}.status == REJECTED_LATE, late_minutes_current_basis == 2000, assessed_late_fee_cents == 105000 and fee_status == ASSESSED"
            - "Vendor.${v_fholv_id}.late_fee_balance_cents == 105000, at or above FEE_HOLD_THRESHOLD_CENTS"
            - "HTTP status is 402 and ${fee_hold_err} == ERR_VENDOR_FEE_HOLD"
            - "LoanerSet.${ls_fh_b_id}.status is still DELIVERED_ON_TIME, never RELEASED_TO_OR"
            - "SurgicalCase.${case_15171_id}.implant_readiness_status == NOT_APPLICABLE (non-implant case)"

  - section: rbac
    instances:

      - name: or_coordinator_denied_the_vendor_scorecard_returns_403
        claim_type: denial
        grounds:
          - roles.ORCoordinator
          - endpoints[GET /vendor-access/vendors/{id}/scorecard]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "ORCoordinator can read every operational endpoint but is absent from the scorecard's role list, so the same GET that a ComplianceAdmin answers with 200 returns 403 ERR_UNAUTHORIZED for the coordinator."
        test_recipe:
          setup:
            - "Vendor RBSV is registered; no other state is needed."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Rbac Scorecard Devices", vendor_code: "RBSV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_rbsv_id: $.data.id }
          trigger:
            - call: "GET /vendor-access/vendors/${v_rbsv_id}/scorecard"
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { scorecard_denial_err: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${scorecard_denial_err} == ERR_UNAUTHORIZED"
            - "the identical GET as ComplianceAdmin user_compliance_1 returns 200 with provisional_compliance_score 100 and scorecard_tier TIER_PLATINUM"
            - "GET /vendor-access/vendors/${v_rbsv_id} as ORCoordinator still returns 200 — only the scorecard projection is out of reach"

      - name: credential_decision_is_exclusive_to_the_credentialing_officer
        claim_type: exclusive_operations
        grounds:
          - roles.CredentialingOfficer.exclusive_operations
          - endpoints[POST /vendor-access/credentials/{id}/decide]
        distinguishing_aspect: "Verification is the credentialing office's exclusive act: the VendorAdmin that filed the attestation is refused 403 on the decide call it may not make, while the CredentialingOfficer's identical call verifies the row."
        test_recipe:
          setup:
            - "Vendor EXCV filed one PENDING_VERIFICATION IMMUNIZATION_INFLUENZA credential for its rep Elias."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Exclusive Devices", vendor_code: "EXCV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_excv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_excv_id}", full_name: "Elias Exclusive", email: "elias@excv.example" }
              as: VendorAdmin
              as_user_id: "${v_excv_id}"
              captures: { rep_elias_id: $.data.id }
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_elias_id}", credential_type: "IMMUNIZATION_INFLUENZA", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "FLU-EX-01" }
              as: VendorAdmin
              as_user_id: "${v_excv_id}"
              captures: { cred_elias_flu_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/credentials/${cred_elias_flu_id}/decide"
              payload: { decision: "VERIFY" }
              as: VendorAdmin
              as_user_id: "${v_excv_id}"
              captures: { exclusive_err: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${exclusive_err} == ERR_UNAUTHORIZED"
            - "Credential.${cred_elias_flu_id}.status is still PENDING_VERIFICATION with verified_by_user_id null"
            - "the identical call as CredentialingOfficer user_credentialing_1 returns 200 and moves the credential to VERIFIED"

      - name: compliance_sweep_denied_to_the_credentialing_officer_returns_403
        claim_type: denial
        grounds:
          - roles.ComplianceAdmin.exclusive_operations
          - endpoints[POST /vendor-access/compliance-sweeps]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The sweep is the single most powerful mutation in the system and only ComplianceAdmin may run it: a CredentialingOfficer's attempt is refused 403 and, critically, no ComplianceSweep row and no epoch advance occur."
        test_recipe:
          setup:
            - "Vendor SWPV exists with last_sweep_epoch 0; nothing else is required."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Sweep Denial Devices", vendor_code: "SWPV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_swpv_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/compliance-sweeps"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { sweep_denial_err: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${sweep_denial_err} == ERR_UNAUTHORIZED"
            - "GET /vendor-access/compliance-sweeps as ComplianceAdmin user_compliance_1 returns total_count == 0"
            - "Vendor.${v_swpv_id}.last_sweep_epoch is still 0 and authorizations_used_epoch is still 0"

      - name: rep_registration_is_shared_by_vendor_admin_and_credentialing_officer
        claim_type: shared_operations
        grounds:
          - roles.VendorAdmin.shared_operations
          - roles.CredentialingOfficer.shared_operations
          - endpoints[POST /vendor-access/vendor-reps]
        distinguishing_aspect: "Both roles reach the same endpoint with the same effect — two reps of the same vendor are created by two different roles, and each row is identical in shape (posture INCOMPLETE, access_status PENDING) regardless of which role wrote it."
        test_recipe:
          setup:
            - "Vendor SHRV is registered."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Shared Devices", vendor_code: "SHRV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_shrv_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_shrv_id}", full_name: "Sam Shared", email: "sam@shrv.example" }
              as: VendorAdmin
              as_user_id: "${v_shrv_id}"
              captures: { rep_sam_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_shrv_id}", full_name: "Sara Shared", email: "sara@shrv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_sara_id: $.data.id }
          assert:
            - "both calls return 201"
            - "VendorRep.${rep_sam_id} and VendorRep.${rep_sara_id} both have credential_posture INCOMPLETE, access_status PENDING, open_authorization_count 0 and revoked_at_utc null"
            - "GET /vendor-access/vendor-reps?vendor_id=${v_shrv_id} returns total_count == 2"

      - name: value_analysis_decision_by_the_endorsing_user_returns_403
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_23
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The rule compares X-User-ID, not role: a person wearing the ValueAnalysisApprover hat who is the same user_sponsor_1 that endorsed the request is refused 403, while a different approver decides the identical request successfully."
        test_recipe:
          setup:
            - "Facility SD-63 and vendor SODV exist; one request has been submitted and ENDORSED by ClinicalSponsor user_sponsor_1."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Segregation Hospital", code: "SD-63", spd_turnaround_hours: 4, spd_bay_count: 2 }
