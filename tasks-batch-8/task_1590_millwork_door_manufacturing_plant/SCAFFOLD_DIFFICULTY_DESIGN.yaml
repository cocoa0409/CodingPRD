            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-BC", supported_species: ["MAPLE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 8, end_hour: 10 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "K-2", capacity: 2 }, as: PlantManager, captures: { booth_id: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 10, cure_end_hour: 16 }, as: ProductionLead, captures: { b1: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 12, cure_end_hour: 18 }, as: ProductionLead, captures: { b2: $.data.id } }
          trigger:
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 14, cure_end_hour: 20 }, as: ProductionLead, captures: { err: $.data.error_id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 18, cure_end_hour: 22 }, as: ProductionLead, captures: { b4: $.data.id } }
          assert:
            - "FinishingBatch.${b1}.status == MIXED and FinishingBatch.${b2}.status == MIXED (second overlapping batch allowed: count 2 == capacity boundary)"
            - "captured ${err} == ERR_BOOTH_CAPACITY_EXCEEDED (third overlapping batch exceeds capacity 2)"
            - "FinishingBatch.${b4}.status == MIXED (adjacent window [18,22) overlaps only B2's boundary-exclusive end -> allowed)"

  # ==================================================================
  # Rule 9 — compensating_invariant (label serial accounting; trip leaf commitment)
  # ==================================================================
  - rule_id: compensating_invariant
    instances:
      - name: label_serial_accounting_conservation
        grounds:
          - calculations.label_serial_accounting
          - entities.FireLabelRoll.fields.serials_available
        distinguishing_aspect: |
          Conserved quantity = serial accounting identity: issued + applied +
          spoiled + available == serial_capacity after every step of an
          issue-then-void pair. Void does NOT restore availability (spoiled
          serials are destroyed) — the invariant, not availability, is what is
          conserved. Different conserved quantity than trip leaves below.
        test_recipe:
          setup:
            - "Rated MIN_20 order; opening V1 leaf_count=1 FINISHED via passed batch; UL_20MIN roll capacity 2."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Cons Proj", site_address: "2 Audit St", contract_code: "C-9101" }, as: PlantManager, captures: { proj_id: $.data.id } }
