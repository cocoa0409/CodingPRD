  - rule_id: transitive_cascade
    instances:
      - name: plan_change_activation_cascade
        grounds:
          - state_machines.PlanChangeRequest.COMMUNICATED_to_EFFECTIVE
          - state_machines.CompPlan.ACTIVE_to_SUPERSEDED
          - state_machines.PhysicianAgreement.EFFECTIVE_to_AMENDMENT_REQUIRED
          - state_machines.CompStatement.DRAFT_to_VOIDED
        distinguishing_aspect: |
          Depth-3 cascade originating from PCR activation: pcr.activate -> P1 ACTIVE->SUPERSEDED
          (hop 1) -> A1 EFFECTIVE->AMENDMENT_REQUIRED (hop 2, caused by hop 1) -> A1's DRAFT
          statement S1 -> VOIDED (hop 3, caused by hop 2). Companion cascade originates from a
          different trigger (dispute resolution).
        test_recipe:
          setup:
