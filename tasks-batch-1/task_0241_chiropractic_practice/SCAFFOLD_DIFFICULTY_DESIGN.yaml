            - call: "POST /patients/${pt_id}/appointments/${a3}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${a3}/complete"
              payload: {}
              as: Provider
