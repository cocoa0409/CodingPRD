  - rule_id: priority_pair_validation_conflict
    instances:
      - name: case_state_beats_device_fallback_safety_on_start_bypass
        grounds:
          - validations[priority=30]
          - validations[priority=44]
          - errors.ERR_CASE_NOT_SETUP_VERIFIED
          - errors.ERR_DEVICE_FALLBACK_REQUIRED
          - entities.BypassCase.fields.readiness_flag
          - state_machines.PerfusionDevice.RESERVED_to_NEEDS_SERVICE
        distinguishing_aspect: |
          The conflicting pair is state (priority 30) versus business_safety (priority 44) on
          POST /bypass-cases/{id}/start-bypass. A backup-side critical alarm raises readiness_flag
          while leaving bypass_status == SETUP_VERIFIED, so priority 44 answers alone; a subsequent
          primary-side critical alarm additionally reverts the case to STAFFED, and now that both
          rows are violated the answer flips to ERR_CASE_NOT_SETUP_VERIFIED — the state category
          wins and masks the safety row.
        test_recipe:
          setup:
            - "Shared fixture driven to bypass_status SETUP_VERIFIED with billing_status PROVISIONAL_ACCRUED, primary device d1 and backup device d2 both RESERVED, readiness_flag NONE."
