            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 100, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-12T08:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /truck-washes", payload: { truck_code: "T-1", washed_at: "2026-07-12T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { wash1: $.data.id } }
          trigger:
            - { call: "POST /market-loads/${load1}/dispatch", payload: { truck_wash_id: "${wash1}" }, as: TransportCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /truck-washes/${wash1}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /market-loads/${load1}/dispatch", payload: { truck_wash_id: "${wash1}" }, as: TransportCoordinator, captures: { load_status: $.data.load_status } }
          assert:
            - "Dispatch with RECORDED wash -> 409 ERR_WASH_NOT_VERIFIED (${err1}); load stays SCHEDULED"
            - "After verify: dispatch succeeds, load_status == DISPATCHED (${load_status}), truck_wash_id == ${wash1}"
            - "TruckWash.wash_status == VERIFIED with verified_by == adm_1"

  # ---------------------------------------------------------------- rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: barn_occupancy_half_open_adjacency
        grounds:
          - calculations.occupancy_overlap_check
          - errors[ERR_OCCUPANCY_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open exclusion on the Barn resource: [start, target)
          intervals that merely touch (new.placement_date == existing.target_market_date)
          do NOT collide, while a one-day-earlier start does. Date granularity, no buffers.
        test_recipe:
          setup:
            - "Contract A ACTIVE; barn B1; group GA [2026-03-02, 2026-07-13) SCHEDULED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v1: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v1}" }, as: FieldTech, captures: { group_a: $.data.id } }
            - { call: "GET /barns/${barn_id}", payload: {}, as: IntegratorAdmin, captures: { barn_v2: $.data.version } }
          trigger:
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-07-13", target_market_date: "2026-08-24", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v2}" }, as: FieldTech, captures: { group_b: $.data.id } }
            - { call: "GET /barns/${barn_id}", payload: {}, as: IntegratorAdmin, captures: { barn_v3: $.data.version } }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-07-12", target_market_date: "2026-08-24", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v3}" }, as: FieldTech, captures: { err1: $.data.error_id } }
          assert:
            - "Adjacent placement (2026-07-13 == GA.target_market_date) succeeds: GB created SCHEDULED (${group_b} non-null)"
            - "One day earlier (2026-07-12 < 2026-07-13) -> 409 ERR_OCCUPANCY_OVERLAP (${err1})"
            - "Half-open semantics: touching is legal, overlapping by one day is not"

      - name: slot_aggregate_capacity_vs_barn_interval_exclusion
        grounds:
          - calculations.slot_reserved_head
          - calculations.occupancy_overlap_check
        distinguishing_aspect: |
          Interval semantics = aggregate capacity on PackerSlot (a DIFFERENT resource):
          two loads sharing the exact same slot date/shift ACCUMULATE head_count (200+200=400
          <= 500 both accepted), whereas on a barn the same-calendar collision is excluded.
          Same-clock sharing allowed under additive semantics, forbidden under exclusion.
        test_recipe:
          setup:
            - "Contract A ACTIVE; group G1 (1000 head) PLACED on barn B1; slot 2026-07-13 AM cap 500 window 240-320"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v1: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v1}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version } }
          trigger:
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 200, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "GET /packer-slots/${slot1}", payload: {}, as: FieldTech, captures: { slot_v2: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 200, expected_slot_version: "${slot_v2}" }, as: FieldTech, captures: { load2: $.data.id } }
            - { call: "GET /packer-slots/${slot1}", payload: {}, as: FieldTech, captures: { reserved: $.data.reserved_head, slot_state: $.data.slot_status } }
            - { call: "GET /barns/${barn_id}", payload: {}, as: IntegratorAdmin, captures: { barn_v2: $.data.version } }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-15", target_market_date: "2026-06-15", head_placed: 100, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v2}" }, as: FieldTech, captures: { err1: $.data.error_id } }
          assert:
            - "Aggregate semantics: two 200-head loads on the SAME slot succeed; reserved_head == 400 (${reserved}), slot_status OPEN (400 < 500) (${slot_state})"
            - "Exclusion semantics: a group overlapping G1's barn calendar -> 409 ERR_OCCUPANCY_OVERLAP (${err1})"
            - "Same calendar instant, two resources, opposite overlap treatment"

  # ---------------------------------------------------------------- rule 9
  - rule_id: compensating_invariant
    instances:
      - name: slot_reserved_head_schedule_cancel_conserved
        grounds:
          - calculations.slot_reserved_head
          - state_machines.MarketLoad
        distinguishing_aspect: |
          Conserved quantity = PackerSlot.reserved_head. Forward action (book 170) debits
          the pool (0 -> 170); its compensating action (cancel) MUST restore it exactly
          (170 -> 0). INVARIANT: reserved_head == sum(head_count over loads in
          SCHEDULED|DISPATCHED|DELIVERED|REJECTED_AT_PLANT) at every observable point.
        test_recipe:
          setup:
            - "Contract A ACTIVE; group 300 head PLACED 2026-04-15 (target 2026-10-06); slot 2026-08-20 cap 340 window 240-320 (projected weight 284.95 in window)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v1: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-04-15", target_market_date: "2026-10-06", head_placed: 300, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v1}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-08-20", shift: "AM", capacity_head: 340, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version, reserved0: $.data.reserved_head } }
          trigger:
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 170, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "GET /packer-slots/${slot1}", payload: {}, as: FieldTech, captures: { reserved_mid: $.data.reserved_head } }
            - { call: "POST /market-loads/${load1}/cancel", payload: {}, as: FieldTech }
            - { call: "GET /packer-slots/${slot1}", payload: {}, as: FieldTech, captures: { reserved_end: $.data.reserved_head, slot_state: $.data.slot_status } }
          assert:
            - "Baseline: reserved_head == 0 at slot creation (${reserved0})"
            - "Forward: after booking, reserved_head == 170 (${reserved_mid})"
            - "Compensating: after cancel, reserved_head == 0 (${reserved_end}) and slot_status == OPEN (${slot_state})"
            - "Load ${load1}.load_status == CANCELLED and excluded from the reserved set"

      - name: manure_budget_record_void_conserved
        grounds:
          - calculations.nutrient_budget_drawdown
          - state_machines.ManureApplication
        distinguishing_aspect: |
          Conserved quantities = ManurePlan nutrient/lagoon pools (lbs N, lbs P, gallons).
          Record (debit 2000 N / 1500 P / 50000 gal) then void MUST restore all three to
          baseline exactly. INVARIANT: lagoon_available_gal == lagoon_start_gal - sum(gallons
          over RECORDED|CONFIRMED); same shape for n_applied_lbs / p_applied_lbs.
        test_recipe:
          setup:
            - "Site ACTIVE; ManurePlan 2026 APPROVED (lagoon capacity 2000000, start 1000000; N budget 50000, P budget 40000)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /manure-plans", payload: { site_id: "${site_id}", plan_year: 2026, lagoon_capacity_gal: 2000000, lagoon_start_gal: 1000000, n_budget_lbs: 50000, p_budget_lbs: 40000 }, as: EnvironmentalManager, captures: { plan: $.data.id } }
            - { call: "POST /manure-plans/${plan}/submit", payload: {}, as: EnvironmentalManager }
            - { call: "POST /manure-plans/${plan}/approve", payload: {}, as: IntegratorAdmin }
            - { call: "GET /manure-plans/${plan}", payload: {}, as: EnvironmentalManager, captures: { lag0: $.data.lagoon_available_gal, n0: $.data.n_applied_lbs, p0: $.data.p_applied_lbs } }
          trigger:
            - { call: "POST /manure-applications", payload: { plan_id: "${plan}", field_code: "F-1", applied_at: "2026-07-15T10:00:00Z", gallons: 50000, n_lbs: 2000, p_lbs: 1500 }, as: EnvironmentalManager, captures: { app1: $.data.id } }
            - { call: "GET /manure-plans/${plan}", payload: {}, as: EnvironmentalManager, captures: { lag1: $.data.lagoon_available_gal, n1: $.data.n_applied_lbs, p1: $.data.p_applied_lbs } }
            - { call: "POST /manure-applications/${app1}/void", payload: {}, as: EnvironmentalManager }
            - { call: "GET /manure-plans/${plan}", payload: {}, as: EnvironmentalManager, captures: { lag2: $.data.lagoon_available_gal, n2: $.data.n_applied_lbs, p2: $.data.p_applied_lbs } }
          assert:
            - "Baseline: lagoon_available_gal == 1000000, n_applied_lbs == 0, p_applied_lbs == 0 (${lag0}/${n0}/${p0})"
            - "After record: lagoon_available_gal == 950000, n_applied_lbs == 2000, p_applied_lbs == 1500 (${lag1}/${n1}/${p1})"
            - "After void: lagoon_available_gal == 1000000, n_applied_lbs == 0, p_applied_lbs == 0 (${lag2}/${n2}/${p2}) — exact restoration"
            - "ManureApplication.${app1}.application_status == VOIDED and excluded from all sums"
