# §1.9 Scaffold Corner Design (breadth probe)
# Domain: ota-model-rate-parity (task 2581). Taxonomy walked from
# references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every instance grounds only in SCAFFOLD.yaml; §1.8-covered corners are emitted as
# excluded_because stubs naming the covering difficulty instance.
# YAML anchors share the canonical bootstrap chain; each alias expands to a byte-identical
# call so every instance stays independently executable from an empty database.
scaffold_corner_design:

  - section: entities
    instances:
      - name: supplier_create_returns_every_declared_field_with_system_defaults
        claim_type: creation
        grounds:
          - entities.Supplier
          - endpoints[POST /suppliers]
          - entities.Supplier.fields.visibility_status
        distinguishing_aspect: "POST /suppliers with all required fields returns 201 and every §1.1 Supplier field, with visibility_status PENDING_CERT, certification_level NONE, current_model NONE, parity_strikes 0 and version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Market EU-PAR exists; no supplier exists yet."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - &c_market
              call: "POST /markets"
              payload: { market_code: "EU-PAR", name: "Paris", paid_slot_capacity: 3, price_display_mode: "TOTAL_UPFRONT", ranking_disclosure_required: true }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { mkt: $.data.id }
          trigger:
            - call: "POST /suppliers"
              payload: { legal_name: "Hotel Lutetia SA", supplier_type: "HOTEL", home_market_id: "${mkt}", contact_email: "ops@lutetia.example", conversion_index: 50 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { sup_new: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries data with a non-null id"
            - "Supplier.${sup_new}.legal_name == 'Hotel Lutetia SA', supplier_type == HOTEL, home_market_id == ${mkt}, contact_email == 'ops@lutetia.example', conversion_index == 50"
            - "Supplier.${sup_new}.visibility_status == PENDING_CERT, certification_level == NONE, content_score == 0, connectivity_score == 0, current_model == NONE, parity_strikes == 0, suspension_reason == null"
            - "Supplier.${sup_new}.version == 1 and created_at == updated_at"

      - name: market_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /markets/{id}]
          - entities.Market.fields.market_code
        distinguishing_aspect: "GET /markets/{id} returns the same market_code, paid_slot_capacity, price_display_mode and status that POST /markets stored, with no re-derivation."
        test_recipe:
          setup:
            - "Market EU-PAR with paid_slot_capacity 3, price_display_mode TOTAL_UPFRONT, ranking_disclosure_required true."
          setup_api_calls:
            - *c_clock
            - *c_market
          trigger:
            - call: "GET /markets/${mkt}"
              payload: {}
              as: ParityAnalyst
              as_user_id: "pa-2"
          assert:
            - "HTTP 200 with Market.${mkt}.market_code == 'EU-PAR', name == 'Paris', paid_slot_capacity == 3"
            - "Market.${mkt}.price_display_mode == TOTAL_UPFRONT, ranking_disclosure_required == true, status == ACTIVE"

      - name: offers_list_filters_by_rate_plan_and_honours_limit_and_offset
        claim_type: listing
        grounds:
          - endpoints[GET /offers]
          - response_envelope
          - entities.Offer.fields.travel_date
        distinguishing_aspect: "GET /offers?rate_plan_id=&limit=1&offset=1 returns exactly the second of the two offers on that plan and reports total_count 2 with has_more false at offset 1."
        test_recipe:
          setup:
            - "A CERTIFIED hotel supplier on an ACTIVE AGENCY agreement with one ACTIVE rate plan."
            - "Two offers on that plan: 2026-09-20 and 2026-09-21, both net 24000; the 2026-09-20 offer is created first."
          setup_api_calls:
            - *c_clock
            - *c_market
            - &c_sup
              call: "POST /suppliers"
              payload: { legal_name: "Hotel Lutetia SA", supplier_type: "HOTEL", home_market_id: "${mkt}", contact_email: "ops@lutetia.example", conversion_index: 50 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { sup: $.data.id }
            - &c_cert_sub
              call: "POST /suppliers/${sup}/certifications"
              payload: { content_score_claimed: 90, connectivity_protocol: "JSON_V2", sample_payload_ref: "s3://cert/lutetia.json" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { cert: $.data.id }
            - &c_cert_rev
              call: "POST /certifications/${cert}/start-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &c_cert_dec
              call: "POST /certifications/${cert}/decide"
              payload: { decision: "CERTIFY", content_score: 88, connectivity_score: 91 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &c_ma
              call: "POST /suppliers/${sup}/model-agreements"
              payload: { model: "AGENCY", effective_from: "2026-08-01", effective_to: "2026-12-31", base_commission_pct: 0.15, chargeback_liability_pct_marketplace: 0.60, fraud_liability_cap_cents: 50000, settlement_terms_days: 30 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ma: $.data.id }
            - &c_ma_act
              call: "POST /model-agreements/${ma}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &c_rp
              call: "POST /suppliers/${sup}/rate-plans"
              payload: { market_id: "${mkt}", name: "Flex BAR", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.01, parity_monitored: true }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { rp: $.data.id, rp_v: $.data.version }
            - &c_off
              call: "POST /rate-plans/${rp}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_v}" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { off: $.data.id }
            - call: "GET /rate-plans/${rp}"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { rp_v2: $.data.version }
            - call: "POST /rate-plans/${rp}/offers"
              payload: { travel_date: "2026-09-21", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_v2}" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { off2: $.data.id }
          trigger:
            - call: "GET /offers"
              payload: { rate_plan_id: "${rp}", limit: 1, offset: 1 }
              as: CommercialManager
              as_user_id: "cm-2"
          assert:
            - "HTTP 200 with exactly one element in data, whose id == ${off2}"
            - "the envelope reports total_count == 2, limit == 1, offset == 1 and has_more == false"
            - "the same call with offset 0 returns id ${off} and has_more == true"

      - name: rate_plan_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RATE_PLAN_NOT_FOUND]
          - validations[priority=4]
          - endpoints[GET /rate-plans/{id}]
        distinguishing_aspect: "GET /rate-plans with an id that resolves to no row returns HTTP 404 ERR_RATE_PLAN_NOT_FOUND, not an empty 200 envelope."
        test_recipe:
          setup:
            - "Market EU-PAR exists; no rate plan has ever been created."
          setup_api_calls:
            - *c_clock
            - *c_market
          trigger:
            - call: "GET /rate-plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_nf} == ERR_RATE_PLAN_NOT_FOUND"
            - "the envelope's data.error_id is ERR_RATE_PLAN_NOT_FOUND and no rate plan is created as a side effect"

      - name: offer_create_missing_required_net_rate_is_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
          - endpoints[POST /rate-plans/{id}/offers]
        distinguishing_aspect: "Omitting net_rate_cents - an `input:` field with no declared default - returns HTTP 400 ERR_INVALID_REQUEST before any state check, and RatePlan.version is not bumped."
        test_recipe:
          setup:
            - "A CERTIFIED hotel supplier with an ACTIVE AGENCY agreement and an ACTIVE rate plan at version 1."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
          trigger:
            - call: "POST /rate-plans/${rp}/offers"
              payload: { travel_date: "2026-09-20", allotment_total: 3, expected_rate_plan_version: "${rp_v}" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 400 and ${err_req} == ERR_INVALID_REQUEST"
            - "no Offer row exists for rate_plan_id ${rp}: GET /offers?rate_plan_id=${rp} returns total_count 0"
            - "RatePlan.${rp}.version is still 1, so the rejected write bumped nothing"

      - name: optional_inputs_apply_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Market.fields.ranking_disclosure_required
          - entities.Supplier.fields.conversion_index
          - entities.RatePlan.fields.parity_monitored
        distinguishing_aspect: "Omitting ranking_disclosure_required, conversion_index and parity_monitored yields true, 50 and true respectively - the §1.1 declared defaults - not null and not false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; an empty database."
            - "A supplier certified through the standard chain so a rate plan can be created."
          setup_api_calls:
            - *c_clock
            - call: "POST /markets"
              payload: { market_code: "EU-NCE", name: "Nice", paid_slot_capacity: 2, price_display_mode: "TOTAL_UPFRONT" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { mkt_def: $.data.id }
            - call: "POST /suppliers"
              payload: { legal_name: "Hotel Negresco SA", supplier_type: "HOTEL", home_market_id: "${mkt_def}", contact_email: "ops@negresco.example" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { sup_def: $.data.id }
            - call: "POST /suppliers/${sup_def}/certifications"
              payload: { content_score_claimed: 85, connectivity_protocol: "JSON_V2", sample_payload_ref: "s3://cert/negresco.json" }
              as: SupplierUser
              as_user_id: "${sup_def}"
              captures: { cert_def: $.data.id }
            - call: "POST /certifications/${cert_def}/start-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /certifications/${cert_def}/decide"
              payload: { decision: "CERTIFY", content_score: 85, connectivity_score: 80 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /suppliers/${sup_def}/rate-plans"
              payload: { market_id: "${mkt_def}", name: "Non-monitored corporate", currency: "EUR", cancellation_policy_code: "STRICT", free_cancel_cutoff_hours: 72, tax_fee_pct: 0.02 }
              as: SupplierUser
              as_user_id: "${sup_def}"
              captures: { rp_def: $.data.id }
          assert:
            - "Market.${mkt_def}.ranking_disclosure_required == true even though the field was omitted"
            - "Supplier.${sup_def}.conversion_index == 50 even though the field was omitted"
            - "RatePlan.${rp_def}.parity_monitored == true even though the field was omitted, and status == ACTIVE"

      - name: offer_money_fields_are_computed_from_the_agreement_not_supplied
        claim_type: computed_fields
        grounds:
          - calculations.offer_sell_price
          - entities.Offer.fields.display_total_cents
          - entities.Offer.fields.pricing_model
          - entities.Offer.fields.applied_rate_pct
        distinguishing_aspect: "For an AGENCY agreement at 0.15 commission on a 0.01-tax plan, net 24000 yields gross 24000, margin 3600, taxes 240, display 24240 and payable 20400, with pricing_model AGENCY and applied_override_id null - all stamped by the server from the agreement, none of them client inputs."
        test_recipe:
          setup:
            - "A CERTIFIED hotel supplier with an ACTIVE AGENCY agreement 2026-08-01..2026-12-31 at base_commission_pct 0.15."
            - "An ACTIVE FLEX rate plan with tax_fee_pct 0.01 and no CommissionOverride rows anywhere."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
          trigger:
            - call: "POST /rate-plans/${rp}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_v}" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { off_c: $.data.id }
          assert:
            - "Offer.${off_c}.pricing_model == AGENCY and applied_rate_pct == 0.15 and applied_override_id == null"
            - "Offer.${off_c}.gross_cents == 24000, marketplace_margin_cents == 3600, taxes_fees_cents == 240, display_total_cents == 24240, supplier_payable_cents == 20400"
            - "display_total_cents 24240 == supplier_payable_cents 20400 + marketplace_margin_cents 3600 + taxes_fees_cents 240"
            - "Offer.${off_c}.allotment_remaining == 3, allotment_held == 0, allotment_sold == 0 and status == PENDING"

      - name: market_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Market.fields.status
          - endpoints[POST /markets]
        distinguishing_aspect: "id, created_at, updated_at, version and the system-sourced status are generated by the server: supplying id and status in the body leaves the created market at a server-minted id with status ACTIVE and version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; no market exists."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /markets"
              payload: { market_code: "EU-LYS", name: "Lyon", paid_slot_capacity: 1, price_display_mode: "EXCL_TAXES", id: "11111111-1111-1111-1111-111111111111", status: "CLOSED", version: 99 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { mkt_ign: $.data.id }
          assert:
            - "${mkt_ign} != '11111111-1111-1111-1111-111111111111'"
            - "Market.${mkt_ign}.status == ACTIVE and version == 1, so the supplied status CLOSED and version 99 were ignored"
            - "Market.${mkt_ign}.created_at and updated_at are server-stamped and equal at creation"

      - name: rate_plan_create_with_undeclared_enum_and_out_of_range_pct_rejected
        claim_type: type_constraints
        grounds:
          - entities.RatePlan.fields.cancellation_policy_code
          - entities.RatePlan.fields.tax_fee_pct
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "cancellation_policy_code SUPER_FLEX is not one of FLEX|MODERATE|STRICT|NON_REF and tax_fee_pct 0.90 is outside the declared 0..0.5 range; either alone returns HTTP 400 ERR_INVALID_REQUEST and creates no RatePlan."
        test_recipe:
          setup:
            - "A CERTIFIED hotel supplier with an ACTIVE AGENCY agreement and no rate plan yet."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
          trigger:
            - call: "POST /suppliers/${sup}/rate-plans"
              payload: { market_id: "${mkt}", name: "Bad enum", currency: "EUR", cancellation_policy_code: "SUPER_FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.01, parity_monitored: true }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /suppliers/${sup}/rate-plans"
              payload: { market_id: "${mkt}", name: "Bad tax", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.90, parity_monitored: true }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { err_pct: $.data.error_id }
          assert:
            - "the first call is HTTP 400 with ${err_enum} == ERR_INVALID_REQUEST"
            - "the second call is HTTP 400 with ${err_pct} == ERR_INVALID_REQUEST"
            - "GET /rate-plans?supplier_id=${sup} reports total_count == 0"

      - name: direct_rate_observation_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.DirectRateObservation
          - entities.DirectRateObservation.fields.breach_bps
          - calculations.parity_breach_bps
        distinguishing_aspect: "DirectRateObservation is declared common_fields false: the created row exposes no version field, §1.5 declares no update or delete endpoint for it, and its computed breach_bps 100 with severity MINOR is frozen at write time."
        test_recipe:
          setup:
            - "A CERTIFIED hotel supplier with an ACTIVE AGENCY agreement and a parity_monitored FLEX plan."
            - "A LIVE offer for 2026-09-20 whose display_total_cents is 24240."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - &c_off_pub
              call: "POST /offers/${off}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup}"
          trigger:
            - call: "POST /rate-plans/${rp}/parity-observations"
              payload: { travel_date: "2026-09-20", channel: "SUPPLIER_WEB", observed_at: "2026-08-06T09:00:00Z", direct_total_cents: 24000 }
              as: ParityAnalyst
              as_user_id: "pa-2"
              captures: { obs_i: $.data.id, case_i: $.data.parity_case_id }
          assert:
            - "the created observation exposes no version field, consistent with common_fields false"
            - "DirectRateObservation.${obs_i}.breach_bps == 100, severity == MINOR, compared_offer_id == ${off}, observed_by_user_id == pa-2"
            - "${case_i} is non-null: a ParityCase was opened because the plan is parity_monitored and severity != NONE"
            - "§1.5 declares only GET /parity-observations/{id} and GET /parity-observations for this entity - no update, no delete"

      - name: rate_plan_create_under_unknown_supplier_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.RatePlan.fields.supplier_id
          - validations[priority=4]
          - errors[ERR_SUPPLIER_NOT_FOUND]
        distinguishing_aspect: "RatePlan declares parent Supplier, so a nested create under an id that resolves to no supplier returns HTTP 404 ERR_SUPPLIER_NOT_FOUND before any body validation runs."
        test_recipe:
          setup:
            - "Market EU-PAR exists; no supplier has ever been created."
          setup_api_calls:
            - *c_clock
            - *c_market
          trigger:
            - call: "POST /suppliers/22222222-2222-2222-2222-222222222222/rate-plans"
              payload: { market_id: "${mkt}", name: "Orphan plan", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.01, parity_monitored: true }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { err_par: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_par} == ERR_SUPPLIER_NOT_FOUND"
            - "GET /rate-plans reports total_count == 0"

      - name: package_component_junction_links_offers_from_two_suppliers
        claim_type: graph
        grounds:
          - entities.PackageComponent
          - entities.PackageComponent.fields.offer_id
          - entities.Package.fields.component_count
          - endpoints[GET /package-components]
        distinguishing_aspect: "PackageComponent is the many-to-many junction of the graph topology: one Package holds one HOTEL offer of Hotel Lutetia and one AIR offer of Aero Bleu, component_count becomes 2, and the junction is reachable from either side (GET /package-components?package_id= and ?offer_id=)."
        test_recipe:
          setup:
            - "Hotel Lutetia CERTIFIED on an ACTIVE AGENCY agreement with a LIVE 2026-09-20 offer (display 24240)."
            - "Aero Bleu CERTIFIED on an ACTIVE MERCHANT agreement with a LIVE 2026-09-20 offer (display 143106)."
            - "An opaque package for market EU-PAR on 2026-09-20 in DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - &c_sup_a
              call: "POST /suppliers"
              payload: { legal_name: "Aero Bleu SA", supplier_type: "AIR", home_market_id: "${mkt}", contact_email: "dist@aerobleu.example", conversion_index: 45 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { sup_a: $.data.id }
            - &c_cert_a_sub
              call: "POST /suppliers/${sup_a}/certifications"
              payload: { content_score_claimed: 82, connectivity_protocol: "GDS_EDIFACT", sample_payload_ref: "s3://cert/aerobleu.xml" }
              as: SupplierUser
              as_user_id: "${sup_a}"
              captures: { cert_a: $.data.id }
            - &c_cert_a_rev
              call: "POST /certifications/${cert_a}/start-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &c_cert_a_dec
              call: "POST /certifications/${cert_a}/decide"
              payload: { decision: "CERTIFY", content_score: 80, connectivity_score: 95 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &c_ma_a
              call: "POST /suppliers/${sup_a}/model-agreements"
              payload: { model: "MERCHANT", effective_from: "2026-08-01", effective_to: "2026-12-31", base_markup_pct: 0.12, chargeback_liability_pct_marketplace: 0.35, fraud_liability_cap_cents: 120000, settlement_terms_days: 21 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ma_a: $.data.id }
            - &c_ma_a_act
              call: "POST /model-agreements/${ma_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &c_rp_a
              call: "POST /suppliers/${sup_a}/rate-plans"
              payload: { market_id: "${mkt}", name: "Air Semi-Flex", currency: "EUR", cancellation_policy_code: "MODERATE", free_cancel_cutoff_hours: 72, tax_fee_pct: 0.05, parity_monitored: false }
              as: SupplierUser
              as_user_id: "${sup_a}"
              captures: { rp_a: $.data.id, rp_a_v: $.data.version }
            - &c_off_a
              call: "POST /rate-plans/${rp_a}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 119936, allotment_total: 4, expected_rate_plan_version: "${rp_a_v}" }
              as: SupplierUser
              as_user_id: "${sup_a}"
              captures: { off_a: $.data.id }
            - &c_off_a_pub
              call: "POST /offers/${off_a}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_a}"
            - &c_pkg
              call: "POST /packages"
              payload: { market_id: "${mkt}", travel_date: "2026-09-20", name: "Paris Opaque Weekend", opaque: true }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { pkg: $.data.id }
