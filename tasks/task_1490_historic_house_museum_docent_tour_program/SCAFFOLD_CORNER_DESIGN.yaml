            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /docents", payload: { full_name: "Pat Guide", email: "pat@x.org" }, as: DocentCoordinator, captures: { d2: $.data.id } }
