# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Fertility / IVF Clinic — Expert tier
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves to §1.1–§1.7.
# Every setup_api_calls/trigger call resolves to a §1.5 endpoint; every ${var}
# traces to an earlier captures: binding. Numeric asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cycle_estimate_vs_settlement_diverge_same_inputs
        grounds:
          - calculations.cycle_cost_estimate
          - calculations.cycle_cost_settlement
          - entities.TreatmentCycle.fields.estimated_patient_owed_cents
          - entities.TreatmentCycle.fields.final_patient_owed_cents
          - state_machines.TreatmentCycle.UNBILLED_to_ESTIMATED
          - state_machines.TreatmentCycle.ESTIMATED_to_SETTLED
        distinguishing_aspect: |
          On the cycle-cost domain, the forward-looking estimate (SCHEDULED+ADMINISTERED meds,
          1 storage-year per PENDING/STORED specimen) yields estimated_patient_owed_cents == 259000
          while the chronological settlement (only ADMINISTERED meds, actual storage_years_accrued)
          yields final_patient_owed_cents == 190000 for the SAME cycle — a 69000-cent divergence.
        test_recipe:
          setup:
            - "Clinic with a package: base 500000, coverage 0.8, stim_med_covered true, cryo_storage_covered false, annual_cryo_storage 60000, lifetime cap 1000000."
            - "Patient on that package; cycle started through STIM; consents for CYCLE_START present."
            - "Two meds: Gonal-F day0-4 (line 150000), Menopur day0-2 (line 45000). Two specimens PENDING."
            - "estimate runs while both meds SCHEDULED and 2 specimens PENDING -> estimated_patient_owed_cents 259000."
            - "Then: Gonal-F ADMINISTERED, Menopur CANCELLED, specimen1 STORED + 1 storage-year accrued, specimen2 stays PENDING; cycle taken to FRESH_TRANSFER, outcome recorded, COMPLETED; settle."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Fertile Grounds", room_concurrency_limit: 2 }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/packages"
              payload: { name: "Single IVF", base_price_cents: 500000, coverage_pct: 0.8, stim_med_covered: true, cryo_storage_covered: false, annual_cryo_storage_cents: 60000, lifetime_coverage_cap_cents: 1000000 }
              as: ClinicAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Ada P", date_of_birth: "1990-01-01T00:00:00.000Z", insurance_package_id: "${pkg_id}" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL", "TRANSFER"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/tanks"
              payload: { label: "Tank-A", capacity_slots: 5 }
              as: Embryologist
              captures: { tank_id: $.data.id, tank_v: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "Gonal-F", start_day_offset: 0, end_day_offset: 4, daily_dose_units: 300, unit_price_cents: 100 }
              as: Nurse
              captures: { medA_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "Menopur", start_day_offset: 0, end_day_offset: 2, daily_dose_units: 75, unit_price_cents: 200 }
              as: Nurse
              captures: { medB_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp1_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp2_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/billing/estimate"
              payload: {}
              as: BillingSpecialist
              captures: { est_owed: $.data.estimated_patient_owed_cents }
            - call: "POST /clinics/${clinic_id}/medications/${medA_id}/administer"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/medications/${medB_id}/cancel"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp1_id}/store"
              payload: { expected_tank_version: "${tank_v}" }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp1_id}/accrue-storage-year"
              payload: {}
              as: BillingSpecialist
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 10 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 8 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/transfer"
              payload: {}
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/outcome-reports"
              payload: { treatment_cycle_id: "${cyc_id}", pregnancy_test_result: "POSITIVE", clinical_pregnancy: true }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/complete"
              payload: {}
              as: Nurse
            - call: "GET /clinics/${clinic_id}/cycles/${cyc_id}"
              payload: {}
              as: BillingSpecialist
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/billing/settle"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: BillingSpecialist
              captures: { final_owed: $.data.final_patient_owed_cents }
          assert:
            - "TreatmentCycle.${cyc_id}.estimated_patient_owed_cents == 259000"
            - "TreatmentCycle.${cyc_id}.final_patient_owed_cents == 190000"
            - "TreatmentCycle.${cyc_id}.estimated_patient_owed_cents != TreatmentCycle.${cyc_id}.final_patient_owed_cents"

      - name: tank_committed_vs_projected_free_slots_diverge
        grounds:
          - calculations.tank_free_slots
          - entities.CryoTank.fields.committed_free_slots
          - entities.CryoTank.fields.projected_free_slots
          - entities.CryoSpecimen.fields.status
        distinguishing_aspect: |
          On the CryoTank capacity domain (distinct from the cycle-cost domain), the same tank with
          capacity 5, one STORED and two PENDING specimens reads committed_free_slots == 4 (STORED-only,
          chronological) but projected_free_slots == 2 (PENDING+STORED, forward-looking) — a 2-slot divergence.
        test_recipe:
          setup:
            - "Clinic, tank capacity 5. A cycle in FERTILIZATION (so stores are allowed)."
            - "Three specimens created PENDING; exactly one STORED (consumes one slot); the other two stay PENDING."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Cryo Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Bea Q", date_of_birth: "1988-05-05T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/tanks"
              payload: { label: "Tank-X", capacity_slots: 5 }
              as: Embryologist
              captures: { tank_id: $.data.id, tank_v: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 6 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 3 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp1_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp1_id}/store"
              payload: { expected_tank_version: "${tank_v}" }
              as: Embryologist
          trigger:
            - call: "GET /clinics/${clinic_id}/tanks/${tank_id}"
              payload: {}
              as: Embryologist
              captures: { committed: $.data.committed_free_slots, projected: $.data.projected_free_slots }
          assert:
            - "CryoTank.${tank_id}.reserved_slots == 1"
            - "CryoTank.${tank_id}.committed_free_slots == 4"
            - "CryoTank.${tank_id}.projected_free_slots == 2"
            - "CryoTank.${tank_id}.committed_free_slots != CryoTank.${tank_id}.projected_free_slots"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_multi_input_nested_min_and_conditional_branches
        grounds:
          - calculations.cycle_cost_settlement
          - entities.InsurancePackage.fields.coverage_pct
          - entities.InsurancePackage.fields.lifetime_coverage_cap_cents
          - entities.InsurancePackage.fields.stim_med_covered
          - entities.InsurancePackage.fields.cryo_storage_covered
        distinguishing_aspect: |
          Mode (a): the settlement formula has >=3 interacting inputs (base, stim_med_gross,
          cryo_gross, coverage_pct, lifetime cap, prior insurer paid) with a nested min() for the
          lifetime cap and conditional branches on stim_med_covered/cryo_storage_covered; with prior
          insurer-paid 980000 and cap 1000000 the cap binds: insurer_raw 520000 -> insurer_paid 20000,
          final_patient_owed 630000.
        test_recipe:
          setup:
            - "Package: base 500000, coverage 0.8, stim_med_covered true, cryo_storage_covered false, cap 1000000."
            - "A PRIOR cycle on this package already SETTLED with insurer_paid 980000 (so headroom = 20000)."
            - "A SECOND cycle: only one med ADMINISTERED (line 150000), no covered cryo, COMPLETED; settle -> cap binds."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Cap Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/packages"
              payload: { name: "Capped IVF", base_price_cents: 500000, coverage_pct: 0.8, stim_med_covered: true, cryo_storage_covered: false, annual_cryo_storage_cents: 60000, lifetime_coverage_cap_cents: 1000000 }
              as: ClinicAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Cy R", date_of_birth: "1991-02-02T00:00:00.000Z", insurance_package_id: "${pkg_id}" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL", "TRANSFER"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            # ----- PRIOR cycle: drive insurer_paid to 980000 -----
            # covered = base 500000 + stim X ; insurer = 0.8*covered = 980000 => covered = 1225000 => stim 725000
            # one med ADMINISTERED with line 725000 (day0-4, dose 290, price 500 -> 5*290*500=725000)
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { prior_cyc: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${prior_cyc}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${prior_cyc}", drug_name: "Gonal-F", start_day_offset: 0, end_day_offset: 4, daily_dose_units: 290, unit_price_cents: 500 }
              as: Nurse
              captures: { prior_med: $.data.id }
            - call: "POST /clinics/${clinic_id}/medications/${prior_med}/administer"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${prior_cyc}/billing/estimate"
              payload: {}
              as: BillingSpecialist
            - call: "POST /clinics/${clinic_id}/cycles/${prior_cyc}/retrieve"
              payload: { oocytes_retrieved: 8 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${prior_cyc}/fertilize"
              payload: { embryos_fertilized: 4 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cycles/${prior_cyc}/transfer"
              payload: {}
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/outcome-reports"
              payload: { treatment_cycle_id: "${prior_cyc}", pregnancy_test_result: "NEGATIVE" }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${prior_cyc}/complete"
              payload: {}
              as: Nurse
            - call: "GET /clinics/${clinic_id}/cycles/${prior_cyc}"
              payload: {}
              as: BillingSpecialist
              captures: { prior_v: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles/${prior_cyc}/billing/settle"
              payload: { expected_cycle_version: "${prior_v}" }
              as: BillingSpecialist
              captures: { prior_insurer: $.data.insurer_paid_cents }
            # ----- SECOND cycle: one med line 150000 ADMINISTERED, no cryo -----
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "Gonal-F", start_day_offset: 0, end_day_offset: 4, daily_dose_units: 300, unit_price_cents: 100 }
              as: Nurse
              captures: { med_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/medications/${med_id}/administer"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/billing/estimate"
              payload: {}
              as: BillingSpecialist
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 9 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 5 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/transfer"
              payload: {}
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/outcome-reports"
              payload: { treatment_cycle_id: "${cyc_id}", pregnancy_test_result: "POSITIVE", live_birth: true }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/complete"
              payload: {}
              as: Nurse
            - call: "GET /clinics/${clinic_id}/cycles/${cyc_id}"
              payload: {}
              as: BillingSpecialist
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/billing/settle"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: BillingSpecialist
              captures: { insurer: $.data.insurer_paid_cents, patient: $.data.final_patient_owed_cents }
          assert:
            - "TreatmentCycle.${prior_cyc}.insurer_paid_cents == 980000"
            - "TreatmentCycle.${cyc_id}.gross_charge_cents == 650000"
            - "TreatmentCycle.${cyc_id}.insurer_paid_cents == 20000"
            - "TreatmentCycle.${cyc_id}.final_patient_owed_cents == 630000"

      - name: insurer_coverage_sum_then_round_not_per_line
        grounds:
          - calculations.cycle_cost_estimate
          - entities.InsurancePackage.fields.coverage_pct
          - entities.MedicationOrder.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b): nested-rounding order is pinned to SUM-then-round on covered_gross. With two
          covered med lines of 100001 each and coverage 0.5, SUM-then-round gives insurer 100001
          (round(200002*0.5)); per-line rounding would give 100002 (round(50000.5)*2). The estimate
          must produce patient_owed using SUM-then-round, distinguishing it from the per-line mode.
        test_recipe:
          setup:
            - "Package: base 0, coverage 0.5, stim_med_covered true, cryo_storage_covered false, cap 100000000."
            - "Cycle in STIM with two SCHEDULED meds each with line_total 100001 (day0, dose 1, price 100001)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Round Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/packages"
              payload: { name: "HalfCover", base_price_cents: 0, coverage_pct: 0.5, stim_med_covered: true, cryo_storage_covered: false, annual_cryo_storage_cents: 0, lifetime_coverage_cap_cents: 100000000 }
              as: ClinicAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Dee S", date_of_birth: "1992-03-03T00:00:00.000Z", insurance_package_id: "${pkg_id}" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "DrugOne", start_day_offset: 0, end_day_offset: 0, daily_dose_units: 1, unit_price_cents: 100001 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "DrugTwo", start_day_offset: 0, end_day_offset: 0, daily_dose_units: 1, unit_price_cents: 100001 }
              as: Nurse
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/billing/estimate"
              payload: {}
              as: BillingSpecialist
              captures: { est: $.data.estimated_patient_owed_cents }
          assert:
            - "TreatmentCycle.${cyc_id}.estimated_patient_owed_cents == 100001"
            - "TreatmentCycle.${cyc_id}.estimated_patient_owed_cents != 100000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cycle_fork_fertilization_to_transfer_or_freeze
        grounds:
          - state_machines.TreatmentCycle.FERTILIZATION_to_FRESH_TRANSFER
          - state_machines.TreatmentCycle.FERTILIZATION_to_FREEZE_ALL
          - entities.TreatmentCycle.fields.protocol_status
        distinguishing_aspect: |
          On TreatmentCycle, FERTILIZATION forks to two divergent branches (FRESH_TRANSFER vs FREEZE_ALL)
          with different side-effect sets — branching fork-join shape, not a linear pipeline.
        test_recipe:
          setup:
            - "Two cycles each driven to FERTILIZATION with embryos_fertilized >= 1."
            - "Cycle A takes the transfer branch; cycle B takes the freeze branch."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Fork Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Eve T", date_of_birth: "1990-04-04T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL", "TRANSFER"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cycA: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cycA}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cycA}/retrieve"
              payload: { oocytes_retrieved: 10 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cycA}/fertilize"
              payload: { embryos_fertilized: 6 }
