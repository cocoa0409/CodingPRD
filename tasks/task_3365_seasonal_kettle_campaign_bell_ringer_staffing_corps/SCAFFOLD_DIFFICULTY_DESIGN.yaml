  - rule_id: compensating_invariant
    instances:
      - name: digital_giving_reverse_conserves_campaign_raised_cents
        grounds:
          - calculations.campaign_total_raised
          - state_machines.DigitalGiving.ATTRIBUTED_to_REVERSED
          - state_machines.DigitalGiving.RECEIVED_to_ATTRIBUTED
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          The conserved quantity is money: with one gift already attributed at 25000, attributing a
          second gift of 10000 and then reversing it must leave Campaign.total_raised_cents exactly
          at its pre-attribution value of 25000, pinned as the explicit invariant
          total_after_reverse == total_before_second_attribution over attributed_cents fields.
