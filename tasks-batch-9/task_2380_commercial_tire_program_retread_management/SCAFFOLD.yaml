scenario: "2380. Commercial Tire Program & Retread Management (commercial tire dealer): fleet tire policy with position-specific tread and casing specifications, tire inventory and mounted-wheel program with tire pressure and tread depth surveys, casing collection, inspection and retread candidacy with casing credit accounting, retread production scheduling and warranty on retreaded product, road service dispatch with response time commitments and emergency pricing, cost-per-mile tracking by tire brand, position and vehicle type, national account pricing agreements and cross-location billing, scrap tire disposal compliance and manifest documentation"
domain_name: commercial-tire-program-retread-management
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat peer topology: every entity is a top-level collection linked by explicit
    foreign keys (no nested ownership in URL paths beyond one sub-resource hop for
    reverse-reachability reads). The core coupling is a single conserved money
    quantity — the casing credit ledger — that four independent workflows
    (inspection, retread production, scrap destruction, cross-location billing)
    all debit and credit, plus a second conserved quantity (retread line booked
    minutes) that scheduling and cancellation must leave without drift.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: ServiceLocation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dealer service location display name" }
      - { name: location_code, type: string, source: input, description: "Short dealer code, unique across all locations", constraints: "unique; 3-16 chars" }
      - { name: state_code, type: string, source: input, description: "US state code governing scrap tire rules", constraints: "2 uppercase letters" }
      - { name: road_service_response_minutes_committed, type: integer, source: input, description: "Baseline committed road service response time in minutes for calls dispatched from this location", constraints: ">= 15 and <= 480" }
      - { name: scrap_permit_number, type: string, source: input, description: "State scrap tire hauler/transfer permit number held by this location" }
      - { name: scrap_permit_expires_on, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) on which the scrap permit lapses; inclusive last valid day" }
      - { name: is_retread_plant, type: boolean, source: input, description: "True when this location hosts retread production lines", default: false }
      - { name: casings_in_holding_count, type: integer, source: computed, description: "Count of Casing rows whose collected_at_location_id equals this location and whose status IN {COLLECTED, INSPECTED, REJECTED, RETREAD_QUEUED, IN_RETREAD}", default: 0 }

  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fleet customer name" }
      - { name: account_type, type: enum, source: input, description: "Commercial relationship type", constraints: "SINGLE_LOCATION | NATIONAL_ACCOUNT" }
      - { name: home_location_id, type: string, source: input, description: "FK -> ServiceLocation.id; the location that owns the fleet relationship" }
      - { name: billing_mode, type: enum, source: input, description: "DIRECT bills each location separately; CROSS_LOCATION rolls every location's work into one CrossLocationInvoice", constraints: "DIRECT | CROSS_LOCATION" }
      - { name: status, type: enum, source: input, description: "Account standing; SUSPENDED blocks new road service calls and new retread jobs", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: casing_credit_balance_cents, type: integer, source: computed, description: "Derived ledger balance = SUM(CasingCreditEntry.amount_cents) over all entries with this fleet_account_id (see calculations.casing_credit_balance); never negative", default: 0 }
      - { name: status_reason, type: string, source: input, description: "Free-text reason recorded by the last status change", default: null }

  - name: NationalAgreement
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; the fleet this pricing agreement covers" }
      - { name: agreement_code, type: string, source: input, description: "National account agreement code", constraints: "unique across all agreements" }
      - { name: effective_from, type: string, source: input, description: "ISO 8601 date; first day the agreement prices work (CLOSED interval start, inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO 8601 date; last day the agreement prices work (CLOSED interval end, inclusive)" }
      - { name: tier_discount_pct, type: number, source: input, description: "Per-line discount fraction applied to each RoadServiceCall.invoice_total_cents during invoice rollup", constraints: ">= 0 and <= 0.50; at most 3 decimals" }
      - { name: casing_credit_rate_cents, type: integer, source: input, description: "Negotiated base casing credit in cents used by calculations.casing_credit_accrual instead of DEFAULT_CASING_CREDIT_CENTS", constraints: ">= 0 and <= 100000" }
      - { name: emergency_response_minutes, type: integer, source: input, description: "Contractual response commitment in minutes for EMERGENCY priority calls", constraints: ">= 15 and <= 480" }
      - { name: emergency_labor_rate_cents_per_hour, type: integer, source: input, description: "Labor rate in cents per hour billed on EMERGENCY priority calls under this agreement", constraints: ">= 0 and <= 100000" }
      - { name: status, type: enum, source: system, description: "Lifecycle state (see state_machines.NationalAgreement)", default: DRAFT, constraints: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp when the agreement was activated", default: null }
      - { name: terminated_reason, type: string, source: input, description: "Reason captured on termination", default: null }

  - name: TirePolicy
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; owner of this position-specific policy" }
      - { name: position, type: enum, source: input, description: "Wheel position this policy governs; unique per (fleet_account_id, position)", constraints: "STEER | DRIVE | TRAILER" }
      - { name: target_pressure_psi, type: number, source: input, description: "Cold inflation target used by calculations.survey_finding", constraints: "> 0 and <= 150" }
      - { name: pressure_tolerance_pct, type: number, source: input, description: "Allowed absolute deviation fraction from target_pressure_psi before a PRESSURE_DEVIATION finding; comparison is >=", constraints: "> 0 and <= 0.50" }
      - { name: min_tread_depth_32nds, type: integer, source: input, description: "Legal/DOT minimum tread depth in 32nds; below this the tire is out of service", constraints: ">= 2 and < pull_point_32nds" }
      - { name: pull_point_32nds, type: integer, source: input, description: "Fleet pull point in 32nds; tread <= this value flags the tire for pull", constraints: "> min_tread_depth_32nds and <= 20" }
      - { name: max_retread_count, type: integer, source: input, description: "Maximum number of prior retreads a casing may carry and still be scheduled for another retread at this position", constraints: ">= 0 and <= 5" }
      - { name: approved_brands, type: array, source: input, description: "Explicit list of casing/tire brand strings approved for this position", constraints: "non-empty array of strings" }
      - { name: new_tire_tread_depth_32nds, type: integer, source: input, description: "Nominal as-new tread depth in 32nds for this position; used as the mount-time baseline default", constraints: "> pull_point_32nds and <= 32" }
      - { name: casing_spec_code, type: string, source: input, description: "Required casing specification code for this position", default: "ANY" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; owning fleet" }
      - { name: unit_number, type: string, source: input, description: "Fleet unit number; unique per (fleet_account_id, unit_number)" }
      - { name: vehicle_type, type: enum, source: input, description: "Vehicle class used as a cost-per-mile grouping dimension", constraints: "TRACTOR | TRAILER | STRAIGHT_TRUCK" }
      - { name: current_odometer_miles, type: integer, source: input, description: "Latest recorded odometer in miles; monotonically non-decreasing", constraints: ">= 0" }
      - { name: last_odometer_reading_at, type: datetime, source: system, description: "Logical-clock-independent reading_at of the latest accepted odometer post", default: null }
      - { name: status, type: enum, source: system, description: "OUT_OF_SERVICE while a RoadServiceCall for this vehicle has dispatch_status IN {OPEN, DISPATCHED, ON_SITE}", default: IN_SERVICE, constraints: "IN_SERVICE | OUT_OF_SERVICE" }

  - name: Casing
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; fleet that owns the casing" }
      - { name: casing_serial, type: string, source: input, description: "Casing serial number", constraints: "unique across all casings" }
      - { name: brand, type: string, source: input, description: "Casing brand string, matched against TirePolicy.approved_brands" }
      - { name: casing_spec_code, type: string, source: input, description: "Casing specification code, matched against TirePolicy.casing_spec_code" }
      - { name: intended_position, type: enum, source: input, description: "Position class this casing is spec'd for; the sole key (with fleet_account_id) used to resolve the governing TirePolicy for grading, retread candidacy and credit", constraints: "STEER | DRIVE | TRAILER" }
      - { name: retread_count, type: integer, source: input, description: "Number of completed retreads already on this casing; incremented by RetreadJob completion", default: 0, constraints: ">= 0 and <= 5" }
      - { name: scrap_weight_lbs, type: integer, source: input, description: "Weight in pounds used for scrap manifest capacity and manifest weight totals", constraints: ">= 1 and <= 500" }
      - { name: status, type: enum, source: system, description: "Lifecycle state (see state_machines.Casing)", default: ON_WHEEL, constraints: "ON_WHEEL | COLLECTED | INSPECTED | REJECTED | RETREAD_QUEUED | IN_RETREAD | RETREADED | SCRAPPED" }
      - { name: inspection_grade, type: enum, source: system, description: "Grade recorded by the most recent inspection; reset to null on retread completion", default: null, constraints: "A | B | C | REJECT" }
      - { name: inspected_by_user_id, type: string, source: system, description: "X-User-ID of the CasingInspector who recorded the current inspection_grade; consumed by the scrap manifest segregation-of-duties check", default: null }
      - { name: collected_at_location_id, type: string, source: system, description: "FK -> ServiceLocation.id; location holding the collected casing", default: null }
      - { name: scrap_manifest_id, type: string, source: system, description: "FK -> ScrapManifest.id; manifest this casing is listed on, null when unlisted", default: null }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Signed net of all CasingCreditEntry rows for this casing with entry_type IN {ACCRUAL, REVERSAL, ADJUSTMENT, EXPIRY}; the credit this casing currently contributes to its fleet's balance", default: 0 }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded when the casing was rejected", default: null }

  - name: TireAsset
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; owning fleet" }
      - { name: casing_id, type: string, source: input, description: "FK -> Casing.id; the carcass this mounted-wheel asset is built on" }
      - { name: brand, type: string, source: input, description: "Tread/tire brand string, matched against TirePolicy.approved_brands at mount" }
      - { name: cost_basis_cents, type: integer, source: input, description: "Acquisition or retread cost in cents; numerator input to calculations.cost_per_mile", constraints: ">= 0" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; set at mount, retained after pull", default: null }
      - { name: position, type: enum, source: system, description: "Wheel position assigned at mount", default: null, constraints: "STEER | DRIVE | TRAILER" }
      - { name: status, type: enum, source: system, description: "Lifecycle state (see state_machines.TireAsset)", default: IN_INVENTORY, constraints: "IN_INVENTORY | MOUNTED | PULL_FLAGGED | PULLED | SCRAPPED" }
      - { name: mounted_at, type: datetime, source: system, description: "Timestamp supplied at mount", default: null }
      - { name: odometer_at_mount, type: integer, source: system, description: "Vehicle odometer in miles at mount; denominator baseline for cost-per-mile", default: null }
      - { name: tread_depth_at_mount_32nds, type: integer, source: system, description: "Tread depth in 32nds at mount; wear baseline for cost-per-mile", default: null }
      - { name: current_tread_depth_32nds, type: integer, source: computed, description: "tread_depth_32nds of the latest TireSurvey for this asset (max surveyed_at, tie-break created_at ASC last), else tread_depth_at_mount_32nds", default: null }
      - { name: accumulated_miles, type: integer, source: computed, description: "max(0, latest TireSurvey.odometer_miles - odometer_at_mount); 0 when no survey exists", default: 0 }
      - { name: replaced_tire_asset_id, type: string, source: system, description: "FK -> TireAsset.id; when this asset was created as a road service replacement, the asset it replaced", default: null }
      - { name: pull_reason, type: string, source: input, description: "Reason recorded at pull", default: null }

  - name: TireSurvey
    parent: null
    common_fields: false
    fields:
      - { name: tire_asset_id, type: string, source: input, description: "FK -> TireAsset.id; surveyed asset" }
      - { name: surveyed_at, type: datetime, source: input, description: "ISO 8601 UTC instant the survey was taken" }
      - { name: pressure_psi, type: number, source: input, description: "Measured cold inflation pressure", constraints: ">= 0 and <= 200" }
      - { name: tread_depth_32nds, type: integer, source: input, description: "Measured tread depth in 32nds", constraints: ">= 0 and <= 32" }
      - { name: odometer_miles, type: integer, source: input, description: "Vehicle odometer reading in miles at survey time", constraints: ">= 0" }
      - { name: surveyed_by_user_id, type: string, source: system, description: "X-User-ID of the TireTechnician who submitted the survey" }
      - { name: pressure_deviation_pct, type: number, source: computed, description: "round_half_up(abs(pressure_psi - policy.target_pressure_psi) / policy.target_pressure_psi, 4)" }
      - { name: finding_code, type: enum, source: computed, description: "First-match finding from calculations.survey_finding", constraints: "COMPLIANT | PRESSURE_DEVIATION | TREAD_AT_PULL_POINT | TREAD_BELOW_MIN" }
      - { name: pull_recommended, type: boolean, source: computed, description: "True when finding_code IN {TREAD_AT_PULL_POINT, TREAD_BELOW_MIN}" }

  - name: CasingCreditEntry
    parent: null
    common_fields: false
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; ledger owner" }
      - { name: casing_id, type: string, source: input, description: "FK -> Casing.id; casing the entry is attributed to, null for invoice-level entries", default: null }
      - { name: entry_type, type: enum, source: system, description: "ACCRUAL at inspection; REVERSAL undoes a prior amount; ADJUSTMENT posts the production-verified delta; APPLICATION consumes credit on an invoice; EXPIRY writes off credit on scrap destruction", constraints: "ACCRUAL | REVERSAL | ADJUSTMENT | APPLICATION | EXPIRY" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; positive increases the fleet balance, negative decreases it" }
      - { name: source_entity_type, type: enum, source: system, description: "Polymorphic source discriminator; resolves source_entity_id against the named collection", constraints: "CASING | RETREAD_JOB | SCRAP_MANIFEST | CROSS_LOCATION_INVOICE" }
      - { name: source_entity_id, type: string, source: system, description: "Id of the row named by source_entity_type (casings / retread-jobs / scrap-manifests / cross-location-invoices collection); NOT a single-target foreign key" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant the entry was posted; ledger replay order is posted_at ASC, tie-break created_at ASC" }
      - { name: memo, type: string, source: system, description: "Machine-generated description of the posting" }

  - name: RetreadLine
    parent: null
    common_fields: true
    fields:
      - { name: service_location_id, type: string, source: input, description: "FK -> ServiceLocation.id; plant hosting the line" }
      - { name: line_code, type: string, source: input, description: "Line code, unique per service_location_id" }
      - { name: cure_cooldown_minutes, type: integer, source: input, description: "Mandatory cooldown appended to every scheduled job's occupied interval before the line can take the next job", default: 30, constraints: ">= 0 and <= 240" }
      - { name: status, type: enum, source: system, description: "AVAILABLE lines accept jobs; DOWN lines reject scheduling and starting", default: AVAILABLE, constraints: "AVAILABLE | DOWN" }
      - { name: booked_minutes, type: integer, source: computed, description: "SUM over RetreadJob rows on this line with status IN {SCHEDULED, IN_PRODUCTION} of ((scheduled_end_at - scheduled_start_at) in whole minutes + cure_cooldown_minutes); conserved quantity for schedule/cancel compensation", default: 0 }

  - name: RetreadJob
    parent: null
    common_fields: true
    fields:
      - { name: casing_id, type: string, source: input, description: "FK -> Casing.id; casing being retreaded" }
      - { name: retread_line_id, type: string, source: input, description: "FK -> RetreadLine.id; production line holding the slot" }
      - { name: tread_design_code, type: string, source: input, description: "Tread design applied in production" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Slot start (half-open interval start, inclusive)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Slot end (half-open interval end, exclusive)" }
      - { name: slot_minutes, type: integer, source: computed, description: "(scheduled_end_at - scheduled_start_at) in whole minutes" }
      - { name: status, type: enum, source: system, description: "Lifecycle state (see state_machines.RetreadJob)", default: SCHEDULED, constraints: "SCHEDULED | IN_PRODUCTION | COMPLETED | FAILED_CURE | CANCELLED" }
      - { name: grade_at_scheduling, type: enum, source: system, description: "Casing.inspection_grade snapshotted when the job was created; drives warranty months and the production-verified credit", constraints: "A | B | C" }
      - { name: retread_count_at_scheduling, type: integer, source: system, description: "Casing.retread_count snapshotted when the job was created; pins the decay factor for both credit variants" }
      - { name: warranty_months, type: integer, source: computed, description: "Tiered warranty term from calculations.retread_warranty; set at completion", default: null }
      - { name: warranty_expires_on, type: string, source: computed, description: "ISO 8601 date = calendar-month add of warranty_months to the UTC date of completed_at, day clamped to the last day of the target month", default: null }
      - { name: produced_tire_asset_id, type: string, source: system, description: "FK -> TireAsset.id; asset minted by completion", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Completion instant supplied by the scheduler", default: null }
      - { name: failure_reason, type: enum, source: system, description: "Reason recorded by fail-cure; drives which branch of side effects runs", default: null, constraints: "CURE_DEFECT | LINE_FAULT | CASING_FAILURE" }
      - { name: reschedule_count, type: integer, source: computed, description: "Number of times this job has been rescheduled out of FAILED_CURE", default: 0 }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: service_location_id, type: string, source: input, description: "FK -> ServiceLocation.id; home location; a technician may only be dispatched from this location" }
      - { name: name, type: string, source: input, description: "Technician display name" }
      - { name: certification_level, type: enum, source: input, description: "Certification tier; ranked TIA_CERTIFIED(3) > LEVEL_2(2) > LEVEL_1(1) by the dispatch selector", constraints: "LEVEL_1 | LEVEL_2 | TIA_CERTIFIED" }
      - { name: status, type: enum, source: system, description: "AVAILABLE technicians are dispatchable; ON_CALL while assigned to a live call; OFF_DUTY set administratively", default: AVAILABLE, constraints: "AVAILABLE | ON_CALL | OFF_DUTY" }
      - { name: completed_call_count, type: integer, source: computed, description: "Count of RoadServiceCall rows with this technician_id and dispatch_status == COMPLETED; second sort key of the dispatch selector", default: 0 }

  - name: RoadServiceCall
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; billed fleet" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; disabled unit" }
      - { name: service_location_id, type: string, source: input, description: "FK -> ServiceLocation.id; dispatching location; supplies the baseline response commitment" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; assigned at dispatch, either explicitly or by calculations.technician_dispatch_selector", default: null }
      - { name: priority, type: enum, source: input, description: "NORMAL or EMERGENCY; drives both response commitment and emergency pricing", constraints: "NORMAL | EMERGENCY" }
      - { name: complaint, type: string, source: input, description: "Reported failure description" }
      - { name: reported_at, type: datetime, source: input, description: "Instant the fleet reported the breakdown; response clock start" }
      - { name: dispatched_at, type: datetime, source: system, description: "Instant the technician was dispatched; its UTC hour decides the after-hours multiplier", default: null }
      - { name: arrived_at, type: datetime, source: system, description: "Instant the technician reached the unit; response clock stop", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Instant the call was completed", default: null }
      - { name: dispatch_miles, type: integer, source: system, description: "Round-trip service miles recorded at dispatch", default: null, constraints: ">= 0 and <= 2000" }
      - { name: labor_hours, type: number, source: system, description: "Billable labor hours recorded at completion", default: null, constraints: ">= 0 and <= 24; multiples of 0.25" }
      - { name: dispatch_status, type: enum, source: system, description: "Operational dimension (see state_machines.RoadServiceCall, dispatch dimension)", default: OPEN, constraints: "OPEN | DISPATCHED | ON_SITE | COMPLETED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "Billing dimension, evolves independently of dispatch_status (see state_machines.RoadServiceCall, billing dimension)", default: UNBILLED, constraints: "UNBILLED | NON_BILLABLE | INVOICED | BILLED_TO_NATIONAL | SETTLED" }
      - { name: committed_response_minutes, type: integer, source: computed, description: "Response commitment resolved at arrival by calculations.road_service_response_and_pricing", default: null }
      - { name: actual_response_minutes, type: integer, source: computed, description: "floor((arrived_at - reported_at) seconds / 60)", default: null }
      - { name: sla_met, type: boolean, source: computed, description: "actual_response_minutes <= committed_response_minutes (equality counts as met)", default: null }
      - { name: gross_cents, type: integer, source: computed, description: "Pre-credit billed amount from calculations.road_service_response_and_pricing", default: null }
      - { name: sla_credit_cents, type: integer, source: computed, description: "SLA miss credit deducted from gross_cents", default: 0 }
      - { name: invoice_total_cents, type: integer, source: computed, description: "gross_cents - sla_credit_cents; the per-line amount consumed by cross-location invoice rollup", default: null }
      - { name: cancel_reason, type: string, source: input, description: "Reason recorded at cancellation", default: null }
      - { name: cross_location_invoice_id, type: string, source: system, description: "FK -> CrossLocationInvoice.id; invoice that currently claims this call as a line, null when unbilled or released", default: null }

  - name: ScrapManifest
    parent: null
    common_fields: true
    fields:
      - { name: service_location_id, type: string, source: input, description: "FK -> ServiceLocation.id; location generating the scrap load; supplies the permit checked at signing" }
      - { name: hauler_permit_number, type: string, source: input, description: "Permit number of the scrap tire hauler" }
      - { name: hauler_capacity_lbs, type: integer, source: input, description: "Gross weight the assigned hauler load may carry; adding a casing that pushes total_weight_lbs strictly above this value is rejected", constraints: ">= 1 and <= 40000" }
      - { name: manifest_number, type: string, source: system, description: "Server-minted manifest document number" }
      - { name: status, type: enum, source: system, description: "Lifecycle state (see state_machines.ScrapManifest)", default: DRAFT, constraints: "DRAFT | SIGNED | TRANSPORTED | CERTIFIED_DESTROYED | VOIDED" }
      - { name: tire_count, type: integer, source: computed, description: "COUNT(Casing WHERE scrap_manifest_id == this id)", default: 0 }
      - { name: total_weight_lbs, type: integer, source: computed, description: "SUM(Casing.scrap_weight_lbs WHERE scrap_manifest_id == this id)", default: 0 }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who signed; must differ from every listed casing's inspected_by_user_id", default: null }
      - { name: signed_at, type: datetime, source: system, description: "Signature instant", default: null }
      - { name: transported_at, type: datetime, source: system, description: "Hauler pickup instant", default: null }
      - { name: hauler_vehicle_id, type: string, source: system, description: "Hauler truck identifier recorded at pickup (free-text, not a Vehicle reference)", default: null }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who certified destruction; must differ from signed_by_user_id", default: null }
      - { name: certified_at, type: datetime, source: system, description: "Destruction certification instant", default: null }
      - { name: destruction_facility_code, type: string, source: system, description: "Processor facility code recorded at certification", default: null }
      - { name: void_reason, type: string, source: input, description: "Reason recorded when the manifest was voided", default: null }

  - name: CrossLocationInvoice
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; billed fleet" }
      - { name: national_agreement_id, type: string, source: system, description: "FK -> NationalAgreement.id; agreement resolved at creation that priced this invoice" }
      - { name: billing_period_start, type: string, source: input, description: "ISO 8601 date; first day of the billing period (inclusive)" }
      - { name: billing_period_end, type: string, source: input, description: "ISO 8601 date; last day of the billing period (inclusive)" }
      - { name: status, type: enum, source: system, description: "Lifecycle state (see state_machines.CrossLocationInvoice)", default: OPEN, constraints: "OPEN | SUBMITTED | PAID | DISPUTED" }
      - { name: line_count, type: integer, source: computed, description: "COUNT(RoadServiceCall WHERE cross_location_invoice_id == this id)", default: 0 }
      - { name: subtotal_cents, type: integer, source: computed, description: "SUM(RoadServiceCall.invoice_total_cents) over claimed lines", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "SUM of per-line rounded discounts (rounding order pinned in calculations.cross_location_invoice_rollup)", default: 0 }
      - { name: net_before_credit_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents", default: 0 }
      - { name: credit_applied_cents, type: integer, source: computed, description: "min(FleetAccount.casing_credit_balance_cents, floor(CREDIT_CAP_PCT * net_before_credit_cents)) evaluated at creation; reset to 0 on dispute", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "net_before_credit_cents - credit_applied_cents", default: 0 }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount recorded at settlement", default: null }
      - { name: dispute_reason, type: string, source: input, description: "Reason recorded at dispute", default: null }

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  # ---- Casing: CYCLIC (ON_WHEEL -> COLLECTED -> INSPECTED -> RETREAD_QUEUED
  #      -> IN_RETREAD -> RETREADED -> ON_WHEEL) plus an INSPECTED self-loop
  #      (re-grade supersede) and a REJECTED branch.
  - entity: Casing
    initial_state: ON_WHEEL
    terminal_states: [SCRAPPED]
    transitions:
      - from: ON_WHEEL
        to: COLLECTED
        trigger: "POST /casings/{casing_id}/collect"
        actor: TireTechnician
        preconditions:
          - "Casing.status == ON_WHEEL"
          - "every TireAsset with casing_id == Casing.id has status IN {IN_INVENTORY, PULLED, SCRAPPED} (vacuously true when no TireAsset references the casing)"
          - "collected_at_location_id resolves to an existing ServiceLocation"
        side_effects:
          - "sets Casing.collected_at_location_id and Casing.status = COLLECTED"
          - "recomputes ServiceLocation.casings_in_holding_count for collected_at_location_id"
          - "increments Casing.version by 1"

      - from: ON_WHEEL
        to: COLLECTED
        trigger: "system: cascade hop 2 of POST /road-service-calls/{call_id}/complete when replaced_tire_asset_id is supplied"
        actor: system
        preconditions:
          - "the replaced TireAsset was just transitioned MOUNTED|PULL_FLAGGED -> PULLED by hop 1 of the same request"
          - "Casing.status == ON_WHEEL"
        side_effects:
          - "sets Casing.collected_at_location_id = RoadServiceCall.service_location_id and Casing.status = COLLECTED"
          - "recomputes ServiceLocation.casings_in_holding_count for that location (cascade hop 3)"
          - "increments Casing.version by 1"
        note: "Automatic collection: the road service technician takes the failed casing back to the dispatching location."

      - from: COLLECTED
        to: INSPECTED
        trigger: "POST /casings/{casing_id}/inspect with grade IN {A, B, C}"
        actor: CasingInspector
        preconditions:
          - "Casing.status == COLLECTED"
          - "payload expected_casing_version == Casing.version"
          - "a TirePolicy exists for (Casing.fleet_account_id, Casing.intended_position)"
        side_effects:
          - "sets Casing.inspection_grade = grade and Casing.inspected_by_user_id = X-User-ID"
          - "posts CasingCreditEntry {entry_type: ACCRUAL, amount_cents: calculations.casing_credit_accrual variant GRADE_PROVISIONAL, source_entity_type: CASING, source_entity_id: Casing.id}"
          - "recomputes Casing.provisional_credit_cents"
          - "recomputes FleetAccount.casing_credit_balance_cents and increments FleetAccount.version by 1"
          - "increments Casing.version by 1"

      - from: INSPECTED
        to: INSPECTED
        trigger: "POST /casings/{casing_id}/inspect with grade IN {A, B, C} (re-grade supersedes the prior inspection)"
        actor: CasingInspector
        preconditions:
          - "Casing.status == INSPECTED"
          - "payload expected_casing_version == Casing.version"
          - "no RetreadJob with casing_id == Casing.id has status IN {SCHEDULED, IN_PRODUCTION}"
        side_effects:
          - "posts CasingCreditEntry {entry_type: REVERSAL, amount_cents: -1 * Casing.provisional_credit_cents as read before this request, source_entity_type: CASING, source_entity_id: Casing.id}"
          - "posts CasingCreditEntry {entry_type: ACCRUAL, amount_cents: calculations.casing_credit_accrual variant GRADE_PROVISIONAL under the new grade}"
          - "overwrites Casing.inspection_grade and Casing.inspected_by_user_id"
          - "recomputes Casing.provisional_credit_cents, FleetAccount.casing_credit_balance_cents (increments FleetAccount.version by 1)"
          - "increments Casing.version by 1"
        note: "Self-loop: this is the CREATE-with-supersede write guarded by OCC in §1.2.1 (casing-inspect-supersede)."

      - from: COLLECTED
        to: REJECTED
        trigger: "POST /casings/{casing_id}/inspect with grade == REJECT"
        actor: CasingInspector
        preconditions:
          - "Casing.status == COLLECTED"
          - "payload expected_casing_version == Casing.version"
        side_effects:
          - "sets Casing.inspection_grade = REJECT, Casing.inspected_by_user_id = X-User-ID, Casing.status = REJECTED"
          - "posts NO CasingCreditEntry (a casing that never graded retreadable never accrues credit)"
          - "increments Casing.version by 1"

      - from: INSPECTED
        to: REJECTED
        trigger: "POST /casings/{casing_id}/reject"
        actor: CasingInspector
        preconditions:
          - "Casing.status == INSPECTED"
          - "no RetreadJob with casing_id == Casing.id has status IN {SCHEDULED, IN_PRODUCTION}"
        side_effects:
          - "sets Casing.status = REJECTED and Casing.rejection_reason = reason"
          - "posts NO ledger entry; the accrued credit stays on the fleet balance until scrap destruction is certified (see the ScrapManifest CERTIFIED_DESTROYED cascade)"
          - "increments Casing.version by 1"

      - from: INSPECTED
        to: RETREAD_QUEUED
        trigger: "system: POST /retread-jobs"
        actor: system
        preconditions: ["Casing.status == INSPECTED", "Casing.inspection_grade IN {A, B, C}"]
        side_effects: ["sets Casing.status = RETREAD_QUEUED", "increments Casing.version by 1"]

      - from: RETREAD_QUEUED
        to: INSPECTED
        trigger: "system: POST /retread-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["Casing.status == RETREAD_QUEUED"]
        side_effects: ["sets Casing.status = INSPECTED (grade and accrued credit are untouched)", "increments Casing.version by 1"]

      - from: RETREAD_QUEUED
        to: IN_RETREAD
        trigger: "system: POST /retread-jobs/{job_id}/start"
        actor: system
        preconditions: ["Casing.status == RETREAD_QUEUED"]
        side_effects: ["sets Casing.status = IN_RETREAD", "increments Casing.version by 1"]

      - from: IN_RETREAD
        to: RETREADED
        trigger: "system: cascade hop 2 of POST /retread-jobs/{job_id}/complete"
        actor: system
        preconditions: ["Casing.status == IN_RETREAD"]
        side_effects:
          - "sets Casing.status = RETREADED, increments Casing.retread_count by 1, sets Casing.inspection_grade = null"
          - "because retread_count changed, posts CasingCreditEntry {entry_type: ADJUSTMENT, amount_cents: verified - provisional per calculations.casing_credit_accrual} (cascade hop 3)"
          - "increments Casing.version by 1"

      - from: IN_RETREAD
        to: INSPECTED
        trigger: "POST /retread-jobs/{job_id}/fail-cure with failure_reason IN {CURE_DEFECT, LINE_FAULT}"
        actor: system
        preconditions: ["Casing.status == IN_RETREAD"]
        side_effects: ["sets Casing.status = INSPECTED (grade and accrued credit retained, casing is re-schedulable)", "increments Casing.version by 1"]

      - from: IN_RETREAD
        to: REJECTED
        trigger: "POST /retread-jobs/{job_id}/fail-cure with failure_reason == CASING_FAILURE"
        actor: system
        preconditions: ["Casing.status == IN_RETREAD"]
        side_effects:
          - "sets Casing.status = REJECTED and Casing.rejection_reason = 'CASING_FAILURE_IN_PRODUCTION'"
          - "posts NO ledger entry (credit is written off only at certified destruction)"
          - "increments Casing.version by 1"
        note: "Divergent branch: the same fail-cure trigger yields a different target state and a different side-effect set depending on failure_reason."

      - from: RETREADED
        to: ON_WHEEL
        trigger: "system: POST /tire-assets/{tire_asset_id}/mount where TireAsset.casing_id == Casing.id"
        actor: system
        preconditions: ["Casing.status == RETREADED"]
        side_effects:
          - "sets Casing.status = ON_WHEEL"
          - "recomputes ServiceLocation.casings_in_holding_count for Casing.collected_at_location_id, then clears Casing.collected_at_location_id"
          - "increments Casing.version by 1"
        note: "Closes the retread cycle: the casing is available for collection and another retread round."

      - from: REJECTED
        to: SCRAPPED
        trigger: "system: cascade hop 2 of POST /scrap-manifests/{manifest_id}/certify-destruction"
        actor: system
        preconditions: ["Casing.status == REJECTED", "Casing.scrap_manifest_id == the certified manifest id"]
        side_effects:
          - "sets Casing.status = SCRAPPED"
          - "because the casing reached SCRAPPED while Casing.provisional_credit_cents != 0, posts CasingCreditEntry {entry_type: EXPIRY, amount_cents: -1 * Casing.provisional_credit_cents, source_entity_type: SCRAP_MANIFEST, source_entity_id: manifest id} (cascade hop 3)"
          - "every TireAsset with casing_id == Casing.id and status == PULLED transitions to SCRAPPED"
          - "increments Casing.version by 1"

  # ---- RetreadJob: BRANCHING with a FAILED_CURE -> SCHEDULED cycle.
  - entity: RetreadJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "POST /retread-jobs/{job_id}/start"
        actor: PlantScheduler
        preconditions:
          - "RetreadJob.status == SCHEDULED"
          - "RetreadLine.status == AVAILABLE for RetreadJob.retread_line_id"
          - "payload started_at >= RetreadJob.scheduled_start_at"
        side_effects:
          - "sets RetreadJob.status = IN_PRODUCTION"
          - "cascades Casing RETREAD_QUEUED -> IN_RETREAD"
          - "RetreadLine.booked_minutes is unchanged (IN_PRODUCTION jobs remain in the booked set)"

      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /retread-jobs/{job_id}/complete"
        actor: PlantScheduler
        preconditions:
          - "RetreadJob.status == IN_PRODUCTION"
          - "payload completed_at >= RetreadJob.scheduled_start_at"
        side_effects:
          - "hop 1: sets RetreadJob.status = COMPLETED, completed_at, warranty_months and warranty_expires_on per calculations.retread_warranty; mints a TireAsset {fleet_account_id: Casing.fleet_account_id, casing_id: Casing.id, brand: Casing.brand, cost_basis_cents: payload cost_basis_cents, status: IN_INVENTORY} and stores its id in produced_tire_asset_id"
          - "hop 2: because the job completed, Casing IN_RETREAD -> RETREADED with retread_count += 1 and inspection_grade = null"
          - "hop 3: because Casing.retread_count changed, posts CasingCreditEntry {entry_type: ADJUSTMENT, amount_cents: calculations.casing_credit_accrual(PRODUCTION_VERIFIED) - calculations.casing_credit_accrual(GRADE_PROVISIONAL)} and recomputes Casing.provisional_credit_cents"
          - "hop 4: because a ledger entry was posted, recomputes FleetAccount.casing_credit_balance_cents and increments FleetAccount.version by 1"
          - "hop 5: because the fleet balance changed, every CrossLocationInvoice with this fleet_account_id and status == OPEN recomputes credit_applied_cents and total_cents (subtotal_cents, discount_cents and net_before_credit_cents are unchanged) and increments its version by 1"
          - "removes the job's slot from RetreadLine.booked_minutes (recomputed per its definition)"

      - from: IN_PRODUCTION
        to: FAILED_CURE
        trigger: "POST /retread-jobs/{job_id}/fail-cure"
        actor: PlantScheduler
        preconditions: ["RetreadJob.status == IN_PRODUCTION"]
        side_effects:
          - "sets RetreadJob.status = FAILED_CURE and failure_reason"
          - "removes the job's slot from RetreadLine.booked_minutes (recomputed per its definition)"
          - "failure_reason == CURE_DEFECT: cascades Casing IN_RETREAD -> INSPECTED; RetreadLine.status unchanged"
          - "failure_reason == LINE_FAULT: cascades Casing IN_RETREAD -> INSPECTED AND sets RetreadLine.status = DOWN"
          - "failure_reason == CASING_FAILURE: cascades Casing IN_RETREAD -> REJECTED; RetreadLine.status unchanged"
        note: "Fork with divergent side-effect sets per failure_reason; FAILED_CURE is non-terminal."

      - from: FAILED_CURE
        to: SCHEDULED
        trigger: "POST /retread-jobs/{job_id}/reschedule"
        actor: PlantScheduler
        preconditions:
          - "RetreadJob.status == FAILED_CURE"
          - "Casing.status == INSPECTED (a CASING_FAILURE job cannot be rescheduled because its casing is REJECTED)"
          - "the target RetreadLine.status == AVAILABLE"
          - "the new [scheduled_start_at, scheduled_end_at) slot passes calculations.retread_slot_feasibility on the target line"
        side_effects:
          - "sets RetreadJob.status = SCHEDULED, new slot fields, retread_line_id when supplied, increments reschedule_count by 1"
          - "cascades Casing INSPECTED -> RETREAD_QUEUED"
          - "adds the new slot to RetreadLine.booked_minutes (recomputed per its definition)"
        note: "Cycle edge: SCHEDULED -> IN_PRODUCTION -> FAILED_CURE -> SCHEDULED."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /retread-jobs/{job_id}/cancel"
        actor: PlantScheduler
        preconditions: ["RetreadJob.status == SCHEDULED"]
        side_effects:
          - "sets RetreadJob.status = CANCELLED"
          - "cascades Casing RETREAD_QUEUED -> INSPECTED"
          - "removes the job's slot from RetreadLine.booked_minutes, restoring it to its pre-scheduling value with zero drift"

      - from: FAILED_CURE
        to: CANCELLED
        trigger: "POST /retread-jobs/{job_id}/cancel"
        actor: PlantScheduler
        preconditions: ["RetreadJob.status == FAILED_CURE"]
        side_effects:
          - "sets RetreadJob.status = CANCELLED"
          - "Casing stays in its current state (INSPECTED or REJECTED); RetreadLine.booked_minutes is already free of this job's slot"

  # ---- RoadServiceCall: PARALLEL state dimensions.
  #      dispatch_status and billing_status advance independently on the same row.
  - entity: RoadServiceCall
    initial_state: "dispatch_status = OPEN; billing_status = UNBILLED"
    terminal_states: ["dispatch_status IN {COMPLETED, CANCELLED}", "billing_status IN {NON_BILLABLE, SETTLED}"]
    transitions:
      - from: "dispatch_status = OPEN"
        to: "dispatch_status = DISPATCHED"
        trigger: "POST /road-service-calls/{call_id}/dispatch"
        actor: DispatchCoordinator
        preconditions:
          - "dispatch_status == OPEN"
          - "payload dispatched_at >= RoadServiceCall.reported_at"
          - "when technician_id is supplied: that Technician.service_location_id == RoadServiceCall.service_location_id AND Technician.status == AVAILABLE"
          - "when technician_id is omitted: calculations.technician_dispatch_selector yields a non-empty candidate pool"
        side_effects:
          - "sets technician_id (explicit or selected), dispatched_at, dispatch_miles, dispatch_status = DISPATCHED"
          - "sets that Technician.status = ON_CALL"
          - "billing_status is untouched"

      - from: "dispatch_status = DISPATCHED"
        to: "dispatch_status = ON_SITE"
        trigger: "POST /road-service-calls/{call_id}/arrive"
        actor: TireTechnician
        preconditions:
          - "dispatch_status == DISPATCHED"
          - "X-User-ID == RoadServiceCall.technician_id"
          - "payload arrived_at >= RoadServiceCall.dispatched_at"
        side_effects:
          - "sets arrived_at, dispatch_status = ON_SITE"
          - "computes committed_response_minutes, actual_response_minutes and sla_met per calculations.road_service_response_and_pricing"

      - from: "dispatch_status = ON_SITE"
        to: "dispatch_status = COMPLETED"
        trigger: "POST /road-service-calls/{call_id}/complete"
        actor: TireTechnician
        preconditions:
          - "dispatch_status == ON_SITE"
          - "X-User-ID == RoadServiceCall.technician_id"
          - "payload closed_at >= RoadServiceCall.arrived_at"
          - "when replaced_tire_asset_id is supplied: that TireAsset.status IN {MOUNTED, PULL_FLAGGED} and its vehicle_id == RoadServiceCall.vehicle_id"
        side_effects:
          - "sets closed_at, labor_hours, dispatch_status = COMPLETED; computes gross_cents, sla_credit_cents and invoice_total_cents per calculations.road_service_response_and_pricing"
          - "sets Technician.status = AVAILABLE and recomputes Technician.completed_call_count"
          - "sets Vehicle.status = IN_SERVICE"
          - "hop 1 (only when replaced_tire_asset_id is supplied): the replaced TireAsset MOUNTED|PULL_FLAGGED -> PULLED; when replacement_casing_id is supplied a new TireAsset is minted and mounted on the same vehicle_id and position with odometer_at_mount = Vehicle.current_odometer_miles and tread_depth_at_mount_32nds = TirePolicy.new_tire_tread_depth_32nds, carrying replaced_tire_asset_id"
          - "hop 2: because the replaced asset became PULLED, its Casing ON_WHEEL -> COLLECTED at RoadServiceCall.service_location_id"
          - "hop 3: because that casing entered the holding set, ServiceLocation.casings_in_holding_count is recomputed for that location"
          - "billing_status stays UNBILLED — becoming COMPLETED makes the call eligible for invoice rollup but does not itself change the billing dimension"

      - from: "dispatch_status IN {OPEN, DISPATCHED}"
        to: "dispatch_status = CANCELLED"
        trigger: "POST /road-service-calls/{call_id}/cancel"
        actor: DispatchCoordinator
        preconditions: ["dispatch_status IN {OPEN, DISPATCHED}"]
        side_effects:
          - "sets dispatch_status = CANCELLED and cancel_reason"
          - "when a technician was assigned, sets that Technician.status = AVAILABLE"
          - "sets Vehicle.status = IN_SERVICE"
          - "sets billing_status = NON_BILLABLE (the only cross-dimension coupling in this machine)"

      - from: "billing_status = UNBILLED"
        to: "billing_status = INVOICED"
        trigger: "system: POST /cross-location-invoices claims this call as a line"
        actor: system
        preconditions: ["billing_status == UNBILLED", "dispatch_status == COMPLETED", "UTC date of closed_at within [billing_period_start, billing_period_end] inclusive"]
        side_effects: ["sets billing_status = INVOICED and cross_location_invoice_id"]

      - from: "billing_status = INVOICED"
        to: "billing_status = BILLED_TO_NATIONAL"
        trigger: "system: POST /cross-location-invoices/{invoice_id}/submit"
        actor: system
        preconditions: ["billing_status == INVOICED"]
        side_effects: ["sets billing_status = BILLED_TO_NATIONAL"]

      - from: "billing_status = BILLED_TO_NATIONAL"
        to: "billing_status = SETTLED"
        trigger: "system: POST /cross-location-invoices/{invoice_id}/settle"
        actor: system
        preconditions: ["billing_status == BILLED_TO_NATIONAL"]
        side_effects: ["sets billing_status = SETTLED"]

      - from: "billing_status = BILLED_TO_NATIONAL"
        to: "billing_status = UNBILLED"
        trigger: "system: POST /cross-location-invoices/{invoice_id}/dispute"
        actor: system
        preconditions: ["billing_status == BILLED_TO_NATIONAL"]
        side_effects: ["sets billing_status = UNBILLED and clears cross_location_invoice_id, releasing the line for re-invoicing"]
        note: "Compensating revert on the billing dimension; dispatch_status remains COMPLETED."

  # ---- ScrapManifest: linear-with-void, compliance gated.
  - entity: ScrapManifest
    initial_state: DRAFT
    terminal_states: [CERTIFIED_DESTROYED, VOIDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /scrap-manifests/{manifest_id}/sign"
        actor: ComplianceOfficer
        preconditions:
          - "ScrapManifest.status == DRAFT"
          - "ServiceLocation.scrap_permit_expires_on >= the UTC date of the logical clock"
          - "X-User-ID != Casing.inspected_by_user_id for every Casing with scrap_manifest_id == this manifest"
          - "ScrapManifest.tire_count >= 1"
          - "every Casing with scrap_manifest_id == this manifest has status == REJECTED"
        side_effects: ["sets status = SIGNED, signed_by_user_id = X-User-ID, signed_at", "increments ScrapManifest.version by 1"]

      - from: SIGNED
        to: TRANSPORTED
        trigger: "POST /scrap-manifests/{manifest_id}/transport"
        actor: ComplianceOfficer
        preconditions: ["ScrapManifest.status == SIGNED", "payload transported_at >= ScrapManifest.signed_at"]
        side_effects: ["sets status = TRANSPORTED, transported_at, hauler_vehicle_id"]

      - from: TRANSPORTED
        to: CERTIFIED_DESTROYED
        trigger: "POST /scrap-manifests/{manifest_id}/certify-destruction"
        actor: ComplianceOfficer
        preconditions:
          - "ScrapManifest.status == TRANSPORTED"
          - "X-User-ID != ScrapManifest.signed_by_user_id"
          - "payload certified_at >= ScrapManifest.transported_at"
        side_effects:
          - "hop 1: sets status = CERTIFIED_DESTROYED, certified_by_user_id, certified_at, destruction_facility_code"
          - "hop 2: because the manifest was certified, every listed Casing REJECTED -> SCRAPPED (and every TireAsset on those casings with status == PULLED -> SCRAPPED)"
          - "hop 3: because each casing reached SCRAPPED carrying provisional_credit_cents != 0, a CasingCreditEntry EXPIRY of -provisional_credit_cents is posted per casing"
          - "hop 4: because ledger entries were posted, FleetAccount.casing_credit_balance_cents is recomputed (FleetAccount.version incremented) and ServiceLocation.casings_in_holding_count is recomputed for each affected location"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /scrap-manifests/{manifest_id}/void"
        actor: ComplianceOfficer
        preconditions: ["ScrapManifest.status == DRAFT"]
        side_effects: ["sets status = VOIDED, void_reason", "clears Casing.scrap_manifest_id for every listed casing (statuses unchanged)", "recomputes tire_count and total_weight_lbs to 0"]

      - from: SIGNED
        to: VOIDED
        trigger: "POST /scrap-manifests/{manifest_id}/void"
        actor: ComplianceOfficer
        preconditions: ["ScrapManifest.status == SIGNED"]
        side_effects: ["sets status = VOIDED, void_reason", "clears Casing.scrap_manifest_id for every listed casing", "clears signed_by_user_id and signed_at", "recomputes tire_count and total_weight_lbs to 0"]

  # ---- NationalAgreement: temporal window lifecycle with a system expiry.
  - entity: NationalAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /national-agreements/{agreement_id}/activate"
        actor: DealerAdmin
        preconditions:
          - "NationalAgreement.status == DRAFT"
          - "effective_to >= effective_from"
          - "the CLOSED interval [effective_from, effective_to] does not intersect the CLOSED interval of any other NationalAgreement with the same fleet_account_id and status == ACTIVE (see calculations.agreement_window_overlap)"
        side_effects: ["sets status = ACTIVE and activated_at = logical clock", "increments NationalAgreement.version by 1"]

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /national-agreements/{agreement_id}/terminate"
        actor: DealerAdmin
        preconditions:
          - "NationalAgreement.status == ACTIVE"
          - "no CrossLocationInvoice with national_agreement_id == this id has status IN {OPEN, SUBMITTED}"
        side_effects: ["sets status = TERMINATED and terminated_reason", "when the fleet has no other ACTIVE agreement, sets FleetAccount.billing_mode = DIRECT and increments FleetAccount.version by 1"]

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock past effective_to"
        actor: system
        preconditions: ["NationalAgreement.status == ACTIVE", "UTC date of the new clock value > effective_to"]
        side_effects: ["sets status = EXPIRED", "returns the affected ids in the clock endpoint's expired_agreement_ids", "leaves every CrossLocationInvoice untouched"]

  # ---- CrossLocationInvoice: ledger-coupled billing lifecycle with compensation.
  - entity: CrossLocationInvoice
    initial_state: OPEN
    terminal_states: [PAID, DISPUTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /cross-location-invoices/{invoice_id}/submit"
        actor: BillingClerk
        preconditions:
          - "CrossLocationInvoice.status == OPEN"
          - "the referenced NationalAgreement.status == ACTIVE"
          - "CrossLocationInvoice.total_cents > 0"
        side_effects:
          - "sets status = SUBMITTED"
          - "posts CasingCreditEntry {entry_type: APPLICATION, amount_cents: -1 * credit_applied_cents, casing_id: null, source_entity_type: CROSS_LOCATION_INVOICE, source_entity_id: invoice id} when credit_applied_cents > 0"
          - "recomputes FleetAccount.casing_credit_balance_cents and increments FleetAccount.version by 1"
          - "cascades every claimed RoadServiceCall billing_status INVOICED -> BILLED_TO_NATIONAL"

      - from: SUBMITTED
        to: PAID
        trigger: "POST /cross-location-invoices/{invoice_id}/settle"
        actor: BillingClerk
        preconditions: ["CrossLocationInvoice.status == SUBMITTED", "payload paid_amount_cents == CrossLocationInvoice.total_cents"]
        side_effects: ["sets status = PAID and paid_amount_cents", "cascades every claimed RoadServiceCall billing_status BILLED_TO_NATIONAL -> SETTLED"]

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /cross-location-invoices/{invoice_id}/dispute"
        actor: FleetManager | BillingClerk
        preconditions: ["CrossLocationInvoice.status == SUBMITTED"]
        side_effects:
          - "sets status = DISPUTED and dispute_reason"
          - "posts CasingCreditEntry {entry_type: REVERSAL, amount_cents: +1 * credit_applied_cents, source_entity_type: CROSS_LOCATION_INVOICE, source_entity_id: invoice id} when credit_applied_cents > 0, then sets credit_applied_cents = 0 and total_cents = net_before_credit_cents"
          - "recomputes FleetAccount.casing_credit_balance_cents and increments FleetAccount.version by 1"
          - "cascades every claimed RoadServiceCall billing_status BILLED_TO_NATIONAL -> UNBILLED and clears its cross_location_invoice_id"
        note: "Compensating action for submit: the named conserved quantity SUM(CasingCreditEntry.amount_cents) returns to its pre-submit value with zero drift."

  # ---- TireAsset: branching with a PULL_FLAGGED revert.
  - entity: TireAsset
    initial_state: IN_INVENTORY
    terminal_states: [SCRAPPED]
    transitions:
      - from: IN_INVENTORY
        to: MOUNTED
        trigger: "POST /tire-assets/{tire_asset_id}/mount"
        actor: TireTechnician
        preconditions:
          - "TireAsset.status == IN_INVENTORY"
          - "the Vehicle.fleet_account_id == TireAsset.fleet_account_id"
          - "a TirePolicy exists for (TireAsset.fleet_account_id, payload position)"
          - "TireAsset.brand IN that TirePolicy.approved_brands"
          - "payload tread_depth_at_mount_32nds > that TirePolicy.min_tread_depth_32nds"
          - "no other TireAsset with the same vehicle_id and position has status IN {MOUNTED, PULL_FLAGGED}"
        side_effects:
          - "sets vehicle_id, position, mounted_at, odometer_at_mount, tread_depth_at_mount_32nds, status = MOUNTED"
          - "cascades Casing RETREADED -> ON_WHEEL when the casing is in RETREADED"

      - from: MOUNTED
        to: PULL_FLAGGED
        trigger: "system: POST /tire-assets/{tire_asset_id}/surveys where the survey's pull_recommended == true"
        actor: system
        preconditions: ["TireAsset.status == MOUNTED"]
        side_effects: ["sets status = PULL_FLAGGED"]

      - from: PULL_FLAGGED
        to: MOUNTED
        trigger: "system: POST /tire-assets/{tire_asset_id}/surveys where the survey's finding_code == COMPLIANT"
        actor: system
        preconditions: ["TireAsset.status == PULL_FLAGGED"]
        side_effects: ["sets status = MOUNTED"]
        note: "Revert edge: a later compliant survey clears the pull flag; a PRESSURE_DEVIATION survey does NOT clear it."

      - from: "MOUNTED | PULL_FLAGGED"
        to: PULLED
        trigger: "POST /tire-assets/{tire_asset_id}/pull"
        actor: TireTechnician
        preconditions: ["TireAsset.status IN {MOUNTED, PULL_FLAGGED}"]
        side_effects: ["sets status = PULLED, pull_reason; vehicle_id and position are retained for cost-per-mile grouping"]

      - from: "MOUNTED | PULL_FLAGGED"
        to: PULLED
        trigger: "system: hop 1 of POST /road-service-calls/{call_id}/complete with replaced_tire_asset_id"
        actor: system
        preconditions: ["TireAsset.status IN {MOUNTED, PULL_FLAGGED}", "TireAsset.vehicle_id == RoadServiceCall.vehicle_id"]
        side_effects: ["sets status = PULLED, pull_reason = 'ROAD_SERVICE_REPLACEMENT'", "triggers the Casing ON_WHEEL -> COLLECTED cascade (hop 2)"]

      - from: PULLED
        to: SCRAPPED
        trigger: "system: hop 2 of POST /scrap-manifests/{manifest_id}/certify-destruction"
        actor: system
        preconditions: ["TireAsset.status == PULLED", "the asset's Casing transitioned REJECTED -> SCRAPPED in the same request"]
        side_effects: ["sets status = SCRAPPED"]

  # ---- FleetAccount: administrative standing toggle.
  - entity: FleetAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleet-accounts/{fleet_account_id}/status with status == SUSPENDED"
        actor: DealerAdmin
        preconditions: ["FleetAccount.status == ACTIVE"]
        side_effects: ["sets status = SUSPENDED and status_reason", "increments FleetAccount.version by 1", "existing calls and jobs are untouched; new RoadServiceCall and RetreadJob creation is blocked"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fleet-accounts/{fleet_account_id}/status with status == ACTIVE"
        actor: DealerAdmin
        preconditions: ["FleetAccount.status == SUSPENDED"]
        side_effects: ["sets status = ACTIVE and status_reason", "increments FleetAccount.version by 1"]

  # ---- RetreadLine: availability toggle.
  - entity: RetreadLine
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: DOWN
        trigger: "POST /retread-lines/{line_id}/status with status == DOWN, or system on fail-cure with failure_reason == LINE_FAULT"
        actor: DealerAdmin | system
        preconditions: ["RetreadLine.status == AVAILABLE"]
        side_effects: ["sets status = DOWN", "already-scheduled jobs keep their slots and RetreadLine.booked_minutes is unchanged"]
      - from: DOWN
        to: AVAILABLE
        trigger: "POST /retread-lines/{line_id}/status with status == AVAILABLE"
        actor: DealerAdmin
        preconditions: ["RetreadLine.status == DOWN"]
        side_effects: ["sets status = AVAILABLE"]

  # ---- Technician: duty roster toggle plus dispatch coupling.
  - entity: Technician
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_CALL
        trigger: "system: POST /road-service-calls/{call_id}/dispatch"
        actor: system
        preconditions: ["Technician.status == AVAILABLE"]
        side_effects: ["sets status = ON_CALL"]
      - from: ON_CALL
        to: AVAILABLE
        trigger: "system: POST /road-service-calls/{call_id}/complete or /cancel"
        actor: system
        preconditions: ["Technician.status == ON_CALL"]
        side_effects: ["sets status = AVAILABLE", "on complete only, recomputes completed_call_count"]
      - from: "AVAILABLE | ON_CALL"
        to: OFF_DUTY
        trigger: "POST /technicians/{technician_id}/status with status == OFF_DUTY"
        actor: DealerAdmin
        preconditions: ["Technician.status IN {AVAILABLE, ON_CALL}"]
        side_effects: ["sets status = OFF_DUTY", "an OFF_DUTY technician is excluded from the dispatch selector candidate pool"]
      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "POST /technicians/{technician_id}/status with status == AVAILABLE"
        actor: DealerAdmin
        preconditions: ["Technician.status == OFF_DUTY"]
        side_effects: ["sets status = AVAILABLE"]

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version only)
# =====================================================================
concurrency_rules:
  - rule_id: casing-inspect-supersede
    parent_entity: Casing
    write_endpoint: "POST /casings/{casing_id}/inspect"
    occ_field: "expected_casing_version"
    description: |
      Recording an inspection grade against a Casing whose version has advanced
      since the client last observed it is rejected. The product deliberately
      allows a later inspection to supersede an earlier one on the same casing
      (INSPECTED -> INSPECTED, reversing the prior accrual and posting a new
      one), so a second grading from a stale view would otherwise succeed and
      silently reverse an amount the client never saw. The stale-version check
      turns that into a deterministic 412.
    error_id: ERR_STALE_CASING_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-fleet
    parent_entity: FleetAccount
    write_endpoint: "POST /cross-location-invoices"
    occ_field: "expected_fleet_account_version"
    description: |
      Creating a CrossLocationInvoice against a FleetAccount whose version has
      advanced since the client last observed it is rejected. Invoice creation
      snapshots FleetAccount.casing_credit_balance_cents into
      credit_applied_cents, and that balance is mutated by inspection accruals,
      production-verified adjustments, scrap expiries and other invoices — a
      creation carrying a stale fleet version would capture a credit figure the
      client never observed. The stale-version check makes that a 412.
    error_id: ERR_STALE_FLEET_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: casing_credit_accrual
    trigger: "POST /casings/{casing_id}/inspect (variant GRADE_PROVISIONAL); cascade hop 3 of POST /retread-jobs/{job_id}/complete (variant PRODUCTION_VERIFIED)"
    algorithm: weighted_scoring
    formula: |
      # base rate selection
      agreement = the NationalAgreement with fleet_account_id == Casing.fleet_account_id,
                  status == ACTIVE, and effective_from <= clock_date <= effective_to
                  (at most one can exist: agreement_window_overlap forbids two)
      base_cents = agreement.casing_credit_rate_cents if such an agreement exists
                   else DEFAULT_CASING_CREDIT_CENTS

      grade_factor = GRADE_FACTOR_A if grade == "A"
                     else GRADE_FACTOR_B if grade == "B"
                     else GRADE_FACTOR_C if grade == "C"
                     else 0            # grade "REJECT" accrues nothing at all

      # retread fatigue decay, floored
      decay_factor = max(MIN_CREDIT_FACTOR, 1 - RETREAD_DECAY_PCT * rc)
      raw = base_cents * grade_factor * decay_factor

      variant GRADE_PROVISIONAL:     rc = Casing.retread_count as read at inspection
                                     credit_cents = round_half_up(raw, 0)
      variant PRODUCTION_VERIFIED:   rc = RetreadJob.retread_count_at_scheduling
                                     grade = RetreadJob.grade_at_scheduling
                                     credit_cents = round_half_up(raw * (1 + PRODUCTION_VERIFIED_UPLIFT_PCT), 0)

      # The ADJUSTMENT posted at retread completion is the DELTA, never the gross:
      adjustment_cents = PRODUCTION_VERIFIED credit_cents - GRADE_PROVISIONAL credit_cents
    input_set: |
      Exactly one Casing row. The PRODUCTION_VERIFIED variant deliberately reuses the
      grade and retread_count SNAPSHOTTED on the RetreadJob at scheduling time
      (grade_at_scheduling, retread_count_at_scheduling), NOT the casing's live values —
      by completion time retread_count has already been incremented and inspection_grade
      has been cleared, so reading live values would change the decay factor and make the
      delta non-reproducible.
    constants:
      DEFAULT_CASING_CREDIT_CENTS: 12000
      GRADE_FACTOR_A: 1.00
      GRADE_FACTOR_B: 0.70
      GRADE_FACTOR_C: 0.40
      RETREAD_DECAY_PCT: 0.15
      MIN_CREDIT_FACTOR: 0.25
      PRODUCTION_VERIFIED_UPLIFT_PCT: 0.10
    precision: "cents, integer, round_half_up applied once to the final product (never per factor)"
    variants:
      - name: GRADE_PROVISIONAL
        when: "at inspection, when only the visual/shearography grade is known"
        difference: "no uplift; posted as an ACCRUAL entry the moment the grade is recorded"
      - name: PRODUCTION_VERIFIED
        when: "after the casing survives the retread cure and a tire is produced from it"
        difference: "the same raw product is multiplied by (1 + PRODUCTION_VERIFIED_UPLIFT_PCT); only the DELTA versus the provisional figure is posted, as an ADJUSTMENT entry"

  - name: cost_per_mile
    trigger: "GET /fleet-accounts/{fleet_account_id}/cost-per-mile"
    algorithm: forward_looking
    formula: |
      candidate assets = TireAsset rows with fleet_account_id == F,
                         status IN {MOUNTED, PULL_FLAGGED, PULLED}
                         (IN_INVENTORY and SCRAPPED are excluded),
                         filtered further by the optional brand / position / vehicle_type
                         query parameters when supplied.

      for each candidate asset:
        latest_survey    = TireSurvey with tire_asset_id == asset.id, max surveyed_at,
                           tie-break created_at ASC taking the LAST row
        miles_run        = max(0, latest_survey.odometer_miles - asset.odometer_at_mount)
                           (0 when the asset has no survey)
        tread_consumed   = asset.tread_depth_at_mount_32nds - latest_survey.tread_depth_32nds
        policy           = TirePolicy for (F, asset.position)
        usable_32nds     = asset.tread_depth_at_mount_32nds - policy.pull_point_32nds

      EXCLUSION (applies to BOTH variants, numerator and denominator alike):
        an asset with miles_run == 0 OR tread_consumed <= 0 is excluded and counted in
        excluded_asset_count.

      groups = included assets keyed by (brand, position, vehicle_type of the linked Vehicle),
               emitted sorted by brand ASC, then position ASC, then vehicle_type ASC.

      variant HISTORICAL_ACTUAL per group:
        cpm_cents = round_half_up( SUM(asset.cost_basis_cents) / SUM(miles_run), 4 )

      variant FORWARD_PROJECTED per group:
        wear_rate_per_mile   = tread_consumed / miles_run              # exact rational, not rounded
        projected_life_miles = floor(usable_32nds / wear_rate_per_mile)
        cpm_cents = round_half_up( SUM(asset.cost_basis_cents) / SUM(projected_life_miles), 4 )

      ROUNDING ORDER IS PINNED: the division is performed ONCE per group on the summed
      numerator and summed denominator; per-asset cost-per-mile figures are never
      rounded and never averaged.
      A group with zero included assets is omitted entirely; when no group survives,
      group_count == 0 and groups == [].
    input_set: "TireAsset rows of one fleet with status IN {MOUNTED, PULL_FLAGGED, PULLED}, each joined to its latest TireSurvey, its Vehicle and the TirePolicy for its position"
    constants: {}
    precision: "cents per mile, 4 decimal places, round_half_up, applied once per group"
    variants:
      - name: HISTORICAL_ACTUAL
        when: "query parameter variant == HISTORICAL_ACTUAL"
        difference: "denominator is miles actually run to date; a nearly-new tire looks expensive"
      - name: FORWARD_PROJECTED
        when: "query parameter variant == FORWARD_PROJECTED"
        difference: "denominator is projected total life to the policy pull point derived from the observed wear rate; the same asset set yields a materially lower figure"

  - name: survey_finding
    trigger: "POST /tire-assets/{tire_asset_id}/surveys"
    algorithm: threshold
    formula: |
      policy = TirePolicy for (TireAsset.fleet_account_id, TireAsset.position)
      pressure_deviation_pct = round_half_up(
          abs(pressure_psi - policy.target_pressure_psi) / policy.target_pressure_psi, 4)

      finding_code, FIRST match wins, evaluated strictly top to bottom:
        1. "TREAD_BELOW_MIN"     if tread_depth_32nds <  policy.min_tread_depth_32nds
        2. "TREAD_AT_PULL_POINT" if tread_depth_32nds <= policy.pull_point_32nds
        3. "PRESSURE_DEVIATION"  if pressure_deviation_pct >= policy.pressure_tolerance_pct
        4. "COMPLIANT"

      pull_recommended = finding_code IN {"TREAD_BELOW_MIN", "TREAD_AT_PULL_POINT"}
    input_set: "one TireSurvey payload plus the TirePolicy for the asset's fleet and position"
    constants: {}
    precision: "pressure_deviation_pct to 4 decimal places, round_half_up, rounded BEFORE the >= comparison"
    variants: []

  - name: road_service_response_and_pricing
    trigger: "POST /road-service-calls/{call_id}/arrive (response metrics); POST /road-service-calls/{call_id}/complete (pricing)"
    algorithm: tiered_pricing
    formula: |
      agreement = the NationalAgreement with fleet_account_id == RoadServiceCall.fleet_account_id,
                  status == ACTIVE, effective_from <= UTC date of reported_at <= effective_to

      # ---- STEP 1 (at arrive): response commitment
      base_minutes = ServiceLocation.road_service_response_minutes_committed
      if priority == "EMERGENCY" and agreement exists:
          committed_response_minutes = min(base_minutes, agreement.emergency_response_minutes)
      elif priority == "EMERGENCY":
          committed_response_minutes = base_minutes
      else:
          committed_response_minutes = base_minutes + NORMAL_PRIORITY_GRACE_MINUTES
      actual_response_minutes = floor((arrived_at - reported_at) in seconds / 60)
      sla_met = actual_response_minutes <= committed_response_minutes   # equality counts as MET

      # ---- STEP 2 (at complete): pricing, evaluated in exactly this order
      labor_rate = agreement.emergency_labor_rate_cents_per_hour
                   if (priority == "EMERGENCY" and agreement exists)
                   else LABOR_RATE_CENTS_PER_HOUR
      labor_cents   = round_half_up(labor_rate * labor_hours, 0)
      mileage_cents = MILEAGE_CENTS_PER_MILE * dispatch_miles
      after_hours   = (UTC hour of dispatched_at) < 6 or (UTC hour of dispatched_at) >= 18
      multiplier    = max( EMERGENCY_MULTIPLIER  if priority == "EMERGENCY" else 1.00,
                           AFTER_HOURS_MULTIPLIER if after_hours          else 1.00 )
      surcharge_cents = min( MAX_EMERGENCY_SURCHARGE_CENTS,
                             round_half_up((multiplier - 1.00)
                                * (BASE_SERVICE_CALL_CENTS + labor_cents + mileage_cents), 0) )
      gross_cents      = BASE_SERVICE_CALL_CENTS + labor_cents + mileage_cents + surcharge_cents
      sla_credit_cents = round_half_up(SLA_MISS_CREDIT_PCT * gross_cents, 0) if sla_met == false else 0
      invoice_total_cents = gross_cents - sla_credit_cents
    input_set: "one RoadServiceCall joined to its ServiceLocation and, when one covers reported_at, the fleet's ACTIVE NationalAgreement. The multipliers do NOT stack: max() picks one."
    constants:
      BASE_SERVICE_CALL_CENTS: 9500
      LABOR_RATE_CENTS_PER_HOUR: 11000
      MILEAGE_CENTS_PER_MILE: 285
      EMERGENCY_MULTIPLIER: 1.75
      AFTER_HOURS_MULTIPLIER: 1.35
      MAX_EMERGENCY_SURCHARGE_CENTS: 40000
      SLA_MISS_CREDIT_PCT: 0.20
      NORMAL_PRIORITY_GRACE_MINUTES: 60
    precision: "integer cents; round_half_up applied separately to labor_cents, surcharge_cents and sla_credit_cents in the order shown"
    variants: []

  - name: cross_location_invoice_rollup
    trigger: "POST /cross-location-invoices; recomputed by the OPEN-invoice refresh in cascade hop 5 of POST /retread-jobs/{job_id}/complete"
    algorithm: waterfall_allocation
    formula: |
      agreement = the NationalAgreement with fleet_account_id == F, status == ACTIVE and
                  effective_from <= billing_period_start <= effective_to
      lines = RoadServiceCall rows with fleet_account_id == F,
              dispatch_status == "COMPLETED", billing_status == "UNBILLED",
              and UTC date of closed_at within [billing_period_start, billing_period_end]
              (BOTH ends inclusive),
              ordered closed_at ASC, tie-break created_at ASC

      # ---- STEP 1: per-line rounding (ROUNDING ORDER IS PINNED)
      for each line:
        line_discount_cents = round_half_up(line.invoice_total_cents * agreement.tier_discount_pct, 0)

      # ---- STEP 2: aggregate
      subtotal_cents          = SUM(line.invoice_total_cents)
      discount_cents          = SUM(line_discount_cents)      # sum of ALREADY-ROUNDED per-line values
      net_before_credit_cents = subtotal_cents - discount_cents

      # WRONG (forbidden): discount_cents = round_half_up(subtotal_cents * tier_discount_pct, 0)
      # The two differ by a cent whenever the per-line remainders round up but the
      # aggregate remainder does not.

      # ---- STEP 3: credit cap (EVALUATION ORDER IS PINNED to break the apparent circularity)
      #      The cap is a fraction of net_before_credit_cents, NOT of total_cents —
      #      total_cents depends on the credit, so keying the cap on it would be circular.
      credit_cap_cents     = floor(CREDIT_CAP_PCT * net_before_credit_cents)
      credit_applied_cents = min(FleetAccount.casing_credit_balance_cents, credit_cap_cents)

      # ---- STEP 4
      total_cents = net_before_credit_cents - credit_applied_cents
    input_set: |
      RoadServiceCall rows of one fleet with dispatch_status == COMPLETED and
      billing_status == UNBILLED whose closed_at date falls inside the closed billing
      period. CANCELLED calls (billing_status NON_BILLABLE) and calls already claimed by
      another invoice (INVOICED / BILLED_TO_NATIONAL / SETTLED) are excluded. An empty
      line set is rejected with ERR_NO_BILLABLE_LINES rather than producing a zero invoice.
    constants:
      CREDIT_CAP_PCT: 0.25
    precision: "integer cents; round_half_up per line in STEP 1, floor on the credit cap in STEP 3"
    variants: []

  - name: casing_credit_balance
    trigger: "every CasingCreditEntry insert (inspection, re-grade, retread completion, invoice submit, invoice dispute, scrap destruction)"
    algorithm: aggregation
    formula: |
      FleetAccount.casing_credit_balance_cents =
          SUM(CasingCreditEntry.amount_cents
              WHERE fleet_account_id == F)                 # every entry_type, no status filter
      Casing.provisional_credit_cents =
          SUM(CasingCreditEntry.amount_cents
              WHERE casing_id == C AND entry_type IN {ACCRUAL, REVERSAL, ADJUSTMENT, EXPIRY})
          # APPLICATION entries carry casing_id == null and never attach to a casing

      Replay order is posted_at ASC, tie-break created_at ASC. The order does not change
      the sum but pins the audit sequence returned by the ledger read endpoints.

      INVARIANT (checked before persisting any entry):
        the resulting FleetAccount.casing_credit_balance_cents MUST be >= 0;
        an operation that would drive it below zero is rejected with
        ERR_CREDIT_BALANCE_NEGATIVE and posts no entry at all.
    input_set: "all CasingCreditEntry rows of one fleet, unfiltered by type or age"
    constants: {}
    precision: "integer cents, exact, no rounding"
    variants: []

  - name: retread_slot_feasibility
    trigger: "POST /retread-jobs; POST /retread-jobs/{job_id}/reschedule"
    algorithm: interval_merge
    formula: |
      line = RetreadLine referenced by the request
      occupying jobs = RetreadJob rows with retread_line_id == line.id and
                       status IN {SCHEDULED, IN_PRODUCTION}, excluding the job being
                       rescheduled itself

      # existing jobs occupy their slot PLUS the mandatory cure cooldown:
      occupied(job)  = [ job.scheduled_start_at,
                         job.scheduled_end_at + line.cure_cooldown_minutes )   # half-open
      # the candidate occupies only its own slot (its cooldown lands after it):
      candidate      = [ new.scheduled_start_at, new.scheduled_end_at )        # half-open

      conflict  <=>  candidate.start < occupied.end AND occupied.start < candidate.end
      # Consequence: a candidate starting EXACTLY at occupied.end (i.e. at
      # existing.scheduled_end_at + cure_cooldown_minutes) is ACCEPTED; one minute
      # earlier is REJECTED with ERR_RETREAD_SLOT_CONFLICT.

      slot_minutes = (scheduled_end_at - scheduled_start_at) in whole minutes
      valid slot  <=>  slot_minutes is a whole number, MIN_JOB_MINUTES <= slot_minutes
                       <= MAX_JOB_MINUTES  (else ERR_INVALID_SLOT_DURATION)

      RetreadLine.booked_minutes = SUM over occupying jobs of
                                   (slot_minutes + line.cure_cooldown_minutes)
    input_set: "RetreadJob rows on one line with status IN {SCHEDULED, IN_PRODUCTION}; COMPLETED, FAILED_CURE and CANCELLED jobs release their slot and leave the booked set"
    constants:
      MIN_JOB_MINUTES: 60
      MAX_JOB_MINUTES: 480
    precision: "whole minutes; sub-minute slot boundaries are rejected"
    variants: []

  - name: agreement_window_overlap
    trigger: "POST /national-agreements/{agreement_id}/activate"
    algorithm: interval_merge
    formula: |
      existing = NationalAgreement rows with the same fleet_account_id, status == ACTIVE,
                 excluding the agreement being activated

      # CLOSED (inclusive-inclusive) DATE intervals — deliberately different geometry
      # from retread_slot_feasibility's half-open timestamp intervals:
      conflict  <=>  new.effective_from <= existing.effective_to
                     AND existing.effective_from <= new.effective_to

      # Consequence: two windows that merely TOUCH at a single day
      # (new.effective_from == existing.effective_to) DO conflict. To abut without
      # conflict, the new window must start at least one calendar day after
      # existing.effective_to.
    input_set: "NationalAgreement rows of one fleet with status == ACTIVE; DRAFT, EXPIRED and TERMINATED agreements never block activation"
    constants: {}
    precision: "calendar-day granularity, no time component"
    variants: []

  - name: retread_warranty
    trigger: "POST /retread-jobs/{job_id}/complete"
    algorithm: tiered_pricing
    formula: |
      base_months = WARRANTY_MONTHS_GRADE_A if RetreadJob.grade_at_scheduling == "A"
                    else WARRANTY_MONTHS_GRADE_B if == "B"
                    else WARRANTY_MONTHS_GRADE_C
      warranty_months = max(MIN_WARRANTY_MONTHS,
                            base_months - RETREAD_COUNT_PENALTY_MONTHS
                                          * RetreadJob.retread_count_at_scheduling)
      warranty_expires_on = calendar-month add of warranty_months to the UTC DATE of
                            completed_at; when the target month has fewer days, the day
                            is clamped to the last day of that month
    input_set: "one RetreadJob's snapshotted grade and retread count; the casing's live values are deliberately not used"
    constants:
      WARRANTY_MONTHS_GRADE_A: 36
      WARRANTY_MONTHS_GRADE_B: 24
      WARRANTY_MONTHS_GRADE_C: 12
      RETREAD_COUNT_PENALTY_MONTHS: 6
      MIN_WARRANTY_MONTHS: 6
    precision: "whole months; ISO 8601 date output"
    variants: []

  - name: scrap_manifest_totals
    trigger: "POST /scrap-manifests/{manifest_id}/lines; POST /scrap-manifests/{manifest_id}/void; POST /scrap-manifests/{manifest_id}/sign (gate only)"
    algorithm: aggregation
    formula: |
      tire_count       = COUNT(Casing WHERE scrap_manifest_id == M)
      total_weight_lbs = SUM(Casing.scrap_weight_lbs WHERE scrap_manifest_id == M)

      capacity gate on POST /scrap-manifests/{manifest_id}/lines:
        reject with ERR_MANIFEST_CAPACITY_EXCEEDED when
            total_weight_lbs + candidate_casing.scrap_weight_lbs > ScrapManifest.hauler_capacity_lbs
        # strictly greater: a load landing EXACTLY on hauler_capacity_lbs is ACCEPTED

      empty gate on POST /scrap-manifests/{manifest_id}/sign:
        reject with ERR_MANIFEST_EMPTY when tire_count == 0
    input_set: "Casing rows whose scrap_manifest_id equals the manifest, in any status; void clears the linkage so both aggregates fall to 0"
    constants: {}
    precision: "integer counts and pounds, exact"
    variants: []

  - name: technician_dispatch_selector
    trigger: "POST /road-service-calls/{call_id}/dispatch when technician_id is omitted"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter — explicit predicate, no fuzzy adjectives
      candidates = Technician rows WHERE
          service_location_id == RoadServiceCall.service_location_id
          AND status == "AVAILABLE"
          AND ( RoadServiceCall.priority != "EMERGENCY"
                OR certification_level == "TIA_CERTIFIED" )

      # (b) ranking expression, all keys over entity fields
      certification_rank = 3 if certification_level == "TIA_CERTIFIED"
                           else 2 if == "LEVEL_2"
                           else 1
      sort by certification_rank DESC, then completed_call_count ASC

      # (c) tie-break
      then created_at ASC (earliest-created technician wins)

      # (d) empty candidate set
      reject the dispatch with ERR_NO_TECHNICIAN_AVAILABLE (409); the call stays OPEN
    input_set: "Technician rows of the dispatching location only; technicians at other locations are never considered, even when idle"
    constants:
      CERT_RANK_TIA_CERTIFIED: 3
      CERT_RANK_LEVEL_2: 2
      CERT_RANK_LEVEL_1: 1
    precision: "n/a (selection, not arithmetic)"
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the URL path resolves to an existing row, validated left to right"
    error_id: "ERR_SERVICE_LOCATION_NOT_FOUND | ERR_FLEET_ACCOUNT_NOT_FOUND | ERR_NATIONAL_AGREEMENT_NOT_FOUND | ERR_TIRE_POLICY_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_CASING_NOT_FOUND | ERR_TIRE_ASSET_NOT_FOUND | ERR_TIRE_SURVEY_NOT_FOUND | ERR_CREDIT_ENTRY_NOT_FOUND | ERR_RETREAD_LINE_NOT_FOUND | ERR_RETREAD_JOB_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_ROAD_SERVICE_CALL_NOT_FOUND | ERR_SCRAP_MANIFEST_NOT_FOUND | ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: auth
    check: "FleetManager acts only on resources whose fleet_account_id == X-User-ID"
    error_id: ERR_FLEET_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints available to FleetManager"

  - priority: 5
    category: auth
    check: "TireTechnician arriving at or completing a RoadServiceCall must be the assigned technician (X-User-ID == RoadServiceCall.technician_id)"
    error_id: ERR_TECHNICIAN_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /road-service-calls/{call_id}/arrive, POST /road-service-calls/{call_id}/complete"

  - priority: 6
    category: business_constraint
    check: "request body/query shape: required fields present, enum members valid, numbers within declared constraints, labor_hours a multiple of 0.25, dates ISO 8601, limit within 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_SERVICE_LOCATION_NOT_FOUND | ERR_FLEET_ACCOUNT_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_CASING_NOT_FOUND | ERR_TIRE_ASSET_NOT_FOUND | ERR_RETREAD_LINE_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK body fields"

  - priority: 8
    category: business_constraint
    check: "uniqueness: ServiceLocation.location_code globally; NationalAgreement.agreement_code globally; Casing.casing_serial globally; (fleet_account_id, position) on TirePolicy; (fleet_account_id, unit_number) on Vehicle; (service_location_id, line_code) on RetreadLine"
    error_id: "ERR_DUPLICATE_LOCATION_CODE | ERR_DUPLICATE_AGREEMENT_CODE | ERR_DUPLICATE_CASING_SERIAL | ERR_DUPLICATE_TIRE_POLICY | ERR_DUPLICATE_VEHICLE_UNIT | ERR_DUPLICATE_LINE_CODE"
    http_status: 409
    applies_to: "POST /service-locations, POST /national-agreements, POST /casings, POST /fleet-accounts/{fleet_account_id}/tire-policies, POST /fleet-accounts/{fleet_account_id}/vehicles, POST /service-locations/{location_id}/retread-lines"

  - priority: 9
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_CASING_INVALID_STATE | ERR_TIRE_ASSET_INVALID_STATE | ERR_RETREAD_JOB_INVALID_STATE | ERR_CALL_INVALID_STATE | ERR_MANIFEST_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_INVOICE_INVALID_STATE | ERR_FLEET_INVALID_STATE | ERR_LINE_INVALID_STATE | ERR_TECHNICIAN_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 10
    category: state
    check: "optimistic concurrency: the supplied expected_<parent>_version equals the parent row's current version (§1.2.1)"
    error_id: "ERR_STALE_CASING_VERSION | ERR_STALE_FLEET_VERSION"
    http_status: 412
    applies_to: "POST /casings/{casing_id}/inspect, POST /cross-location-invoices"

  - priority: 11
    category: business_safety
    check: "the signing location's scrap_permit_expires_on is on or after the logical clock's UTC date"
    error_id: ERR_SCRAP_PERMIT_EXPIRED
    http_status: 422
    applies_to: "POST /scrap-manifests/{manifest_id}/sign"

  - priority: 12
    category: business_safety
    check: "segregation of duties: the signing ComplianceOfficer's X-User-ID differs from the inspected_by_user_id of every Casing listed on the manifest"
    error_id: ERR_SOD_INSPECTOR_CANNOT_SIGN
    http_status: 422
    applies_to: "POST /scrap-manifests/{manifest_id}/sign"

  - priority: 13
    category: business_safety
    check: "segregation of duties: the certifying ComplianceOfficer's X-User-ID differs from ScrapManifest.signed_by_user_id"
    error_id: ERR_SOD_SIGNER_CANNOT_CERTIFY
    http_status: 422
    applies_to: "POST /scrap-manifests/{manifest_id}/certify-destruction"

  - priority: 14
    category: business_safety
    check: "tread_depth_at_mount_32nds must be strictly greater than the governing TirePolicy.min_tread_depth_32nds"
    error_id: ERR_TREAD_BELOW_POLICY_MINIMUM
    http_status: 422
    applies_to: "POST /tire-assets/{tire_asset_id}/mount"

  - priority: 15
    category: business_safety
    check: "Casing.retread_count must be strictly less than the max_retread_count of the TirePolicy for (Casing.fleet_account_id, Casing.intended_position)"
    error_id: ERR_MAX_RETREAD_COUNT_REACHED
    http_status: 422
    applies_to: "POST /retread-jobs"

  - priority: 16
    category: business_referential
    check: "every Casing listed on the manifest has status == REJECTED"
    error_id: ERR_CASING_NOT_SCRAP_ELIGIBLE
    http_status: 422
    applies_to: "POST /scrap-manifests/{manifest_id}/sign, POST /scrap-manifests/{manifest_id}/lines"

  - priority: 17
    category: business_referential
    check: "ScrapManifest.tire_count >= 1 at signing"
    error_id: ERR_MANIFEST_EMPTY
    http_status: 422
    applies_to: "POST /scrap-manifests/{manifest_id}/sign"

  - priority: 18
    category: business_referential
    check: "the Casing is not already listed on another ScrapManifest (scrap_manifest_id is null)"
    error_id: ERR_CASING_ALREADY_ON_MANIFEST
    http_status: 409
    applies_to: "POST /scrap-manifests/{manifest_id}/lines"

  - priority: 19
    category: business_referential
    check: "a TirePolicy exists for the (fleet_account_id, position) pair the operation needs"
    error_id: ERR_TIRE_POLICY_MISSING
    http_status: 422
    applies_to: "POST /tire-assets/{tire_asset_id}/mount, POST /tire-assets/{tire_asset_id}/surveys, POST /casings/{casing_id}/inspect, POST /retread-jobs"

  - priority: 20
    category: business_referential
    check: "the TireAsset.brand appears in the governing TirePolicy.approved_brands, and the Casing.casing_spec_code matches TirePolicy.casing_spec_code unless the policy's value is the wildcard 'ANY' (brand is checked first)"
    error_id: "ERR_BRAND_NOT_APPROVED | ERR_CASING_SPEC_MISMATCH"
    http_status: 422
    applies_to: "POST /tire-assets/{tire_asset_id}/mount"

  - priority: 21
    category: business_referential
    check: "cross-aggregate ownership: the Casing, Vehicle and TireAsset named in one request all carry the same fleet_account_id"
    error_id: ERR_FLEET_MISMATCH
    http_status: 422
    applies_to: "POST /tire-assets, POST /tire-assets/{tire_asset_id}/mount, POST /road-service-calls, POST /road-service-calls/{call_id}/complete"

  - priority: 22
    category: business_referential
    check: "the assigned Technician's service_location_id equals the RoadServiceCall.service_location_id"
    error_id: ERR_TECHNICIAN_LOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /road-service-calls/{call_id}/dispatch"

  - priority: 23
    category: business_temporal
    check: "activating an agreement whose CLOSED window intersects another ACTIVE agreement window for the same fleet (touching endpoints count as intersecting)"
    error_id: ERR_AGREEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /national-agreements/{agreement_id}/activate"

  - priority: 24
    category: business_temporal
    check: "the requested half-open retread slot, compared against each existing slot extended by the line's cure_cooldown_minutes, must not intersect"
    error_id: ERR_RETREAD_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /retread-jobs, POST /retread-jobs/{job_id}/reschedule"

  - priority: 25
    category: business_temporal
    check: "slot_minutes is a whole number within [MIN_JOB_MINUTES, MAX_JOB_MINUTES] and scheduled_end_at > scheduled_start_at"
    error_id: ERR_INVALID_SLOT_DURATION
    http_status: 422
    applies_to: "POST /retread-jobs, POST /retread-jobs/{job_id}/reschedule"

  - priority: 26
    category: business_temporal
    check: "started_at >= RetreadJob.scheduled_start_at"
    error_id: ERR_JOB_START_TOO_EARLY
    http_status: 422
    applies_to: "POST /retread-jobs/{job_id}/start"

  - priority: 27
    category: business_temporal
    check: "monotone call timeline: dispatched_at >= reported_at, arrived_at >= dispatched_at, closed_at >= arrived_at; manifest timeline: transported_at >= signed_at, certified_at >= transported_at; job timeline: completed_at >= scheduled_start_at"
    error_id: ERR_INVALID_TIMELINE
    http_status: 422
    applies_to: "POST /road-service-calls/{call_id}/dispatch, POST /road-service-calls/{call_id}/arrive, POST /road-service-calls/{call_id}/complete, POST /scrap-manifests/{manifest_id}/transport, POST /scrap-manifests/{manifest_id}/certify-destruction, POST /retread-jobs/{job_id}/complete"

  - priority: 28
    category: business_temporal
    check: "billing_period_end >= billing_period_start and the period spans at most 92 days inclusive"
    error_id: ERR_INVALID_BILLING_PERIOD
    http_status: 422
    applies_to: "POST /cross-location-invoices"

  - priority: 29
    category: business_temporal
    check: "odometer readings never regress: odometer_miles >= Vehicle.current_odometer_miles for odometer posts, and >= max(TireAsset.odometer_at_mount, latest TireSurvey.odometer_miles) for surveys"
    error_id: ERR_ODOMETER_REGRESSION
    http_status: 422
    applies_to: "POST /vehicles/{vehicle_id}/odometer, POST /tire-assets/{tire_asset_id}/surveys"

  - priority: 30
    category: business_constraint
    check: "no other TireAsset with the same vehicle_id and position has status IN {MOUNTED, PULL_FLAGGED}"
    error_id: ERR_POSITION_OCCUPIED
    http_status: 409
    applies_to: "POST /tire-assets/{tire_asset_id}/mount"

  - priority: 31
    category: business_constraint
    check: "the FleetAccount referenced by a new RoadServiceCall or RetreadJob has status == ACTIVE"
    error_id: ERR_FLEET_SUSPENDED
    http_status: 409
    applies_to: "POST /road-service-calls, POST /retread-jobs"

  - priority: 32
    category: business_constraint
    check: "the RetreadLine referenced by a scheduling, rescheduling or start request has status == AVAILABLE"
    error_id: ERR_LINE_DOWN
    http_status: 409
    applies_to: "POST /retread-jobs, POST /retread-jobs/{job_id}/reschedule, POST /retread-jobs/{job_id}/start"

  - priority: 33
    category: business_constraint
    check: "total_weight_lbs + candidate casing weight must not exceed ScrapManifest.hauler_capacity_lbs (strictly greater is rejected; landing exactly on the capacity is allowed)"
    error_id: ERR_MANIFEST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /scrap-manifests/{manifest_id}/lines"

  - priority: 34
    category: business_constraint
    check: "an explicitly named Technician must have status == AVAILABLE"
    error_id: ERR_TECHNICIAN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /road-service-calls/{call_id}/dispatch"

  - priority: 35
    category: business_constraint
    check: "when technician_id is omitted, calculations.technician_dispatch_selector must yield at least one candidate"
    error_id: ERR_NO_TECHNICIAN_AVAILABLE
    http_status: 409
    applies_to: "POST /road-service-calls/{call_id}/dispatch"

  - priority: 36
    category: business_fiscal
    check: "an ACTIVE NationalAgreement covering the anchor date exists for the fleet (billing_period_start for invoices)"
    error_id: ERR_NO_ACTIVE_AGREEMENT
    http_status: 422
    applies_to: "POST /cross-location-invoices"

  - priority: 37
    category: business_fiscal
    check: "the resolved line set for the billing period is non-empty"
    error_id: ERR_NO_BILLABLE_LINES
    http_status: 422
    applies_to: "POST /cross-location-invoices"

  - priority: 38
    category: business_fiscal
    check: "the referenced NationalAgreement.status == ACTIVE at submit time and CrossLocationInvoice.total_cents > 0"
    error_id: ERR_INVOICE_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /cross-location-invoices/{invoice_id}/submit"

  - priority: 39
    category: business_fiscal
    check: "paid_amount_cents equals CrossLocationInvoice.total_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /cross-location-invoices/{invoice_id}/settle"

  - priority: 40
    category: business_fiscal
    check: "no ledger posting may drive FleetAccount.casing_credit_balance_cents below zero"
    error_id: ERR_CREDIT_BALANCE_NEGATIVE
    http_status: 409
    applies_to: "POST /cross-location-invoices/{invoice_id}/submit, POST /casings/{casing_id}/inspect, POST /scrap-manifests/{manifest_id}/certify-destruction"

  - priority: 41
    category: business_fiscal
    check: "an ACTIVE agreement cannot be terminated while a CrossLocationInvoice referencing it has status IN {OPEN, SUBMITTED}"
    error_id: ERR_AGREEMENT_HAS_OPEN_INVOICE
    http_status: 409
    applies_to: "POST /national-agreements/{agreement_id}/terminate"

# =====================================================================
# §1.5 API Endpoint Table
#
# Topology: FLAT with references (entity_topology: flat). Every entity has a
# top-level collection; child creation uses nested POSTs where the parent is
# the natural owner, while every FK is reverse-reachable through the flat
# filtered list of the child collection.
# =====================================================================
endpoints:

  # ---------------- test-driving surface ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock to an arbitrary instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Advancing the clock past a NationalAgreement.effective_to expires that agreement as a system transition and returns the affected ids."
    roles: [DealerAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, expired_agreement_ids: string[] }"
    side_effects:
      - "sets the logical clock used by permit-expiry checks, ledger posted_at and agreement window resolution"
      - "every NationalAgreement with status == ACTIVE and effective_to < the new UTC date transitions to EXPIRED"

  # ---------------- ServiceLocation ----------------
  - method: POST
    path: "/service-locations"
    description: "Registers a dealer service location, including its baseline road service response commitment and its state scrap tire permit."
    roles: [DealerAdmin]
    code: 201
    input: [name, location_code, state_code, road_service_response_minutes_committed, scrap_permit_number, scrap_permit_expires_on, "is_retread_plant?"]
    output: ServiceLocation
    side_effects: ["casings_in_holding_count initialised to 0"]

  - method: PATCH
    path: "/service-locations/{location_id}"
    description: "Updates a location's response commitment, permit details or retread-plant flag."
    roles: [DealerAdmin]
    code: 200
    input: ["road_service_response_minutes_committed?", "scrap_permit_number?", "scrap_permit_expires_on?", "is_retread_plant?"]
    output: ServiceLocation
    side_effects: ["increments ServiceLocation.version by 1", "later road service calls resolve the new commitment; already-arrived calls keep their computed committed_response_minutes"]

  - method: GET
    path: "/service-locations/{location_id}"
    description: "Reads one service location including its computed casings_in_holding_count."
    roles: [DealerAdmin, ComplianceOfficer, PlantScheduler, DispatchCoordinator]
    code: 200
    input: []
    output: ServiceLocation
    side_effects: []

  - method: GET
    path: "/service-locations"
    description: "Lists service locations, optionally filtered by state or retread-plant capability."
    roles: [DealerAdmin, ComplianceOfficer, PlantScheduler, DispatchCoordinator]
    code: 200
    input: ["state_code?", "is_retread_plant?", "limit?", "offset?"]
    output: ServiceLocation[]
    side_effects: []

  # ---------------- FleetAccount ----------------
  - method: POST
    path: "/fleet-accounts"
    description: "Creates a fleet customer account owned by a home service location."
    roles: [DealerAdmin]
    code: 201
    input: [name, account_type, home_location_id, billing_mode]
    output: FleetAccount
    side_effects: ["status defaults to ACTIVE", "casing_credit_balance_cents initialised to 0"]

  - method: GET
    path: "/fleet-accounts/{fleet_account_id}"
    description: "Reads one fleet account including its derived casing credit balance and its OCC version."
    roles: [DealerAdmin, FleetManager, BillingClerk, CasingInspector]
    code: 200
    input: []
    output: FleetAccount
    side_effects: []

  - method: GET
    path: "/fleet-accounts"
    description: "Lists fleet accounts; the home_location_id filter is the reverse-reachability path from a ServiceLocation to the fleets it owns."
    roles: [DealerAdmin, BillingClerk]
    code: 200
    input: ["home_location_id?", "status?", "billing_mode?", "account_type?", "limit?", "offset?"]
    output: FleetAccount[]
    side_effects: []

  - method: POST
    path: "/fleet-accounts/{fleet_account_id}/status"
    description: "Suspends or reinstates a fleet account. A SUSPENDED account blocks new road service calls and new retread jobs but leaves work already in flight untouched."
    roles: [DealerAdmin]
    code: 200
    input: [status, status_reason]
    output: FleetAccount
    side_effects: ["drives the FleetAccount state machine ACTIVE <-> SUSPENDED", "increments FleetAccount.version by 1"]

  - method: GET
    path: "/fleet-accounts/{fleet_account_id}/cost-per-mile"
    description: "Computed read: cost-per-mile grouped by (brand, position, vehicle_type) per calculations.cost_per_mile. `variant` selects HISTORICAL_ACTUAL or FORWARD_PROJECTED; the optional brand / position / vehicle_type parameters narrow the candidate asset set before grouping."
    roles: [DealerAdmin, FleetManager]
    code: 200
    input: [variant, "brand?", "position?", "vehicle_type?"]
    output: "{ variant: string, group_count: integer, excluded_asset_count: integer, groups: object[] }"
    side_effects: ["read-only; never mutates TireAsset or TireSurvey"]

  # ---------------- NationalAgreement ----------------
  - method: POST
    path: "/national-agreements"
    description: "Drafts a national account pricing agreement for a fleet, carrying the negotiated tier discount, casing credit rate and emergency response/labour terms."
    roles: [DealerAdmin]
    code: 201
    input: [fleet_account_id, agreement_code, effective_from, effective_to, tier_discount_pct, casing_credit_rate_cents, emergency_response_minutes, emergency_labor_rate_cents_per_hour]
    output: NationalAgreement
    side_effects: ["status defaults to DRAFT; a DRAFT agreement prices nothing and blocks no window"]

  - method: POST
    path: "/national-agreements/{agreement_id}/activate"
    description: "Activates a DRAFT agreement after checking its CLOSED date window against every other ACTIVE agreement of the same fleet."
    roles: [DealerAdmin]
    code: 200
    input: []
    output: NationalAgreement
    side_effects: ["runs calculations.agreement_window_overlap", "sets status = ACTIVE and activated_at = logical clock", "increments NationalAgreement.version by 1"]

  - method: POST
    path: "/national-agreements/{agreement_id}/terminate"
    description: "Terminates an ACTIVE agreement. Blocked while any invoice priced by it is still OPEN or SUBMITTED."
    roles: [DealerAdmin]
    code: 200
    input: [terminated_reason]
    output: NationalAgreement
    side_effects: ["sets status = TERMINATED", "when the fleet retains no other ACTIVE agreement, sets FleetAccount.billing_mode = DIRECT and increments FleetAccount.version by 1"]

  - method: GET
    path: "/national-agreements/{agreement_id}"
    description: "Reads one national agreement."
    roles: [DealerAdmin, BillingClerk, FleetManager]
    code: 200
    input: []
    output: NationalAgreement
    side_effects: []

  - method: GET
    path: "/national-agreements"
    description: "Lists agreements; fleet_account_id is the reverse-reachability path from a FleetAccount to its agreements."
