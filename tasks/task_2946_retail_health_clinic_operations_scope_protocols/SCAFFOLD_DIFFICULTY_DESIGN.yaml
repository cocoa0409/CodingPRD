      - name: assignment_cancel_restores_physician_supervision_count
        grounds:
          - calculations.physician_supervision_load
          - state_machines.StaffingAssignment.ACTIVE_to_CANCELLED
          - entities.Physician.fields.current_supervised_count
          - entities.Clinician.fields.active_assignment_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — a supervision HEADCOUNT rather than money: Dr Rain's
          current_supervised_count runs 0 → 1 → 0 across create and cancel, and because the count
          is over DISTINCT clinicians, adding a second assignment for the same clinician leaves it
          at 1 while active_assignment_count reaches 2 — cancelling one of the two must decrement
          the per-clinician counter without disturbing the headcount.
        test_recipe:
          setup:
            - "CA StateRule with max_supervised_clinicians_per_physician 3 exists; one CA clinic."
            - "Dr Rain (max_supervised_clinicians 3) supervises a single CA-licensed clinician R1."
            - "current_supervised_count is read as 0 before any assignment exists."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 18", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { clinic_s2_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Rain", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { phys_r_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP R One", credential: "NP", license_state_code: "CA", home_clinic_id: "${clinic_s2_id}", supervising_physician_id: "${phys_r_id}" }
              as: ClinicAdmin
              captures: { clin_r1_id: $.data.id }
            - call: "GET /physicians/${phys_r_id}"
              payload: {}
              as: ClinicAdmin
              captures: { load_zero: $.data.current_supervised_count }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_s2_id}", clinician_id: "${clin_r1_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T12:00:00Z", pinned_supervising_physician_id: "${phys_r_id}" }
              as: ClinicAdmin
              captures: { asg_r_morning_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_s2_id}", clinician_id: "${clin_r1_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T12:00:00Z", ends_at: "2026-08-01T20:00:00Z", pinned_supervising_physician_id: "${phys_r_id}" }
              as: ClinicAdmin
              captures: { asg_r_evening_id: $.data.id }
            - call: "GET /physicians/${phys_r_id}"
              payload: {}
              as: ClinicAdmin
              captures: { load_peak: $.data.current_supervised_count }
            - call: "GET /clinicians/${clin_r1_id}"
              payload: {}
              as: ClinicAdmin
              captures: { asg_peak: $.data.active_assignment_count }
          trigger:
            - call: "POST /staffing-assignments/${asg_r_evening_id}/cancel"
              payload: { cancel_reason: "Shift dropped" }
              as: ClinicAdmin
            - call: "POST /staffing-assignments/${asg_r_morning_id}/cancel"
              payload: { cancel_reason: "Site closed early" }
              as: ClinicAdmin
          assert:
            - "${load_zero} == 0"
            - "${load_peak} == 1   # two assignments, one DISTINCT clinician"
            - "${asg_peak} == 2"
            - "StaffingAssignment.${asg_r_evening_id}.status == CANCELLED"
            - "StaffingAssignment.${asg_r_morning_id}.status == CANCELLED"
            - "Clinician.${clin_r1_id}.active_assignment_count == 0   # per-assignment counter fully unwound"
            - "Physician.${phys_r_id}.current_supervised_count == 0   # headcount exactly restored to its pre-assignment value"
            - "Clinic.${clinic_s2_id}.on_duty_clinician_count == 0"
            - "Clinic.${clinic_s2_id}.open_status == CLOSED"
