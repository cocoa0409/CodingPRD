          - entities.InjectableLot.fields.expiration_date
          - validations[priority=18]
        distinguishing_aspect: |
          InjectableLot expiry uses an INCLUSIVE-at-start boundary: a lot is
          expired when clock >= expiration_date. With clock set to exactly
          2026-06-01T00:00:00Z and the only product lot expiring at exactly
          2026-06-01T00:00:00Z, FEFO finds no eligible units and booking fails
          ERR_INSUFFICIENT_LOT_UNITS.
