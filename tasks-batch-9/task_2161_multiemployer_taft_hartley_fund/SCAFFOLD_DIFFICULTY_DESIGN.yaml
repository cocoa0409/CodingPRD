              as: ContributingEmployer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-audits/${aud_id}/findings"
              payload: { findings: [ { participant_id: "${p1_id}", work_period: "2026-04", unreported_hours: 80.00 } ] }
              as: PayrollAuditor
              as_user_id: "auditor-001"
            - call: "POST /payroll-audits/${aud_id}/respond"
              payload: { response: "DISPUTE" }
              as: ContributingEmployer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-audits/${aud_id}/findings"
              payload: { findings: [ { participant_id: "${p1_id}", work_period: "2026-04", unreported_hours: 60.00 } ] }
