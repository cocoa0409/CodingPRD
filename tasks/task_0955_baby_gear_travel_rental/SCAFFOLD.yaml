# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership check failed" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced customer id does not exist" }
  - { id: ERR_CATALOG_ITEM_NOT_FOUND, http: 404, condition: "Referenced catalog item id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Referenced inventory unit id does not exist" }
  - { id: ERR_PARTNER_NOT_FOUND, http: 404, condition: "Referenced hotel partner id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Referenced insurance plan id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Referenced reservation id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "Referenced reservation line id does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Referenced route id does not exist" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "Referenced route stop id does not exist" }
  - { id: ERR_EXTENSION_NOT_FOUND, http: 404, condition: "Referenced extension request id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced damage claim id does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Referenced recall notice id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Referenced cleaning ticket id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum member, non-unique email/serial/code, or non-positive rate/deposit" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end_date <= start_date; extension target not after current end_date; stop window outside route_date or start >= end" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine precondition violated (wrong from-state, terminal lockdown, route not dispatched, stops not all terminal, recall close with QUARANTINED units, claim on non-RETURNED line, ticket creation when unit not AWAITING_CLEANING/QUARANTINED or OPEN ticket exists)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_reservation_version does not match reservation.version on amend-dates / extension create" }
  - { id: ERR_RECALL_BLOCKED, http: 409, condition: "Confirm blocked: a line's catalog item has an ACTIVE MANDATORY recall" }
  - { id: ERR_UNIT_QUARANTINED, http: 409, condition: "Reallocate found only quarantined candidates for the line's catalog item" }
  - { id: ERR_UNIT_UNAVAILABLE, http: 409, condition: "Unit's committed interval (incl. cleaning buffer) overlaps the requested window" }
  - { id: ERR_EXTENSION_WINDOW_CONFLICT, http: 409, condition: "Extension window overlaps another reservation's committed interval on an allocated unit" }
  - { id: ERR_STOP_WINDOW_CONFLICT, http: 409, condition: "Stop time window overlaps another stop's window on the same route (half-open)" }
  - { id: ERR_ZONE_MISMATCH, http: 422, condition: "reservation.zone_code != partner.zone_code, or stop reservation zone != route zone" }
  - { id: ERR_PARTNER_SUSPENDED, http: 409, condition: "Reservation references a SUSPENDED hotel partner" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 403, condition: "Confirm attempted by a SUSPENDED customer" }
  - { id: ERR_CATALOG_ITEM_DELISTED, http: 409, condition: "Confirm references a DELISTED catalog item" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 422, condition: "Adding stop would push planned_weight_kg above vehicle_capacity_kg (exact fit allowed)" }
  - { id: ERR_DUPLICATE_STOP, http: 409, condition: "Same reservation + stop_type already has a SCHEDULED/COMPLETED stop on a PLANNED/DISPATCHED route" }
  - { id: ERR_DEEP_CLEAN_REQUIRED, http: 409, condition: "STANDARD ticket creation rejected because cleans_since_deep >= deep_clean_every_cycles (DEEP due)" }
  - { id: ERR_NO_ELIGIBLE_UNIT, http: 409, condition: "No unit satisfies the allocation eligibility filter for a line at confirm/reallocate" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim approve/deny attempted by the same user id that filed the claim" }
  - { id: ERR_INVALID_PLAN_RATE, http: 422, condition: "Insurance plan rate_value out of range for its pricing_model" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor; may only register as a customer"
    identity: opaque
    exclusive_operations: ["POST /customers"]
    shared_operations: []
  - name: Customer
    description: "Traveler renting baby gear; owns their reservations"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /reservations", "POST /reservations/{id}/confirm", "POST /reservations/{id}/amend-dates", "POST /reservations/{id}/extensions", "POST /damage-claims/{id}/dispute"]
    shared_operations: ["GET catalog items / availability / insurance plans", "GET own reservations / lines / deposit transactions / extensions / claims", "POST /reservations/{id}/cancel (own)"]
  - name: HotelPartner
    description: "Hotel/resort partner; read-only view of its own guests' reservations"
    identity: "entity_backed:HotelPartner"
    exclusive_operations: []
    shared_operations: ["GET /reservations filtered to hotel_partner_id == X-User-ID", "GET catalog items / availability / insurance plans"]
  - name: Inspector
    description: "Cleaning and damage inspector (opaque operator id); cannot approve claims"
    identity: opaque
    exclusive_operations: ["POST /cleaning-tickets/{id}/pass", "POST /cleaning-tickets/{id}/fail"]
    shared_operations: ["POST /cleaning-tickets", "POST /damage-claims", "GET units / tickets / recalls / routes / stops / lines / claims / catalog items"]
  - name: OperationsAdmin
    description: "Platform operator with hierarchical superset; segregated from approving claims it filed"
    identity: opaque
    exclusive_operations: ["catalog/unit/partner/plan/route/recall management", "POST /reservations/{id}/settle", "POST /extensions/{id}/approve|deny", "POST /damage-claims/{id}/approve|deny|reopen", "POST /customers/{id}/suspend|reinstate", "POST /_clock/set_current_utc"]
    shared_operations: ["POST /cleaning-tickets", "POST /damage-claims", "POST /reservations/{id}/cancel", "all GET endpoints"]
