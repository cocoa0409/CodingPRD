# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Real Estate Development Entitlement & Impact Fees
# =============================================================================
# Breadth probe: every testable claim from §1.1–§1.7 NOT already covered by
# §1.8. Sections and claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_fee_schedule_success_and_defaults
        claim_type: creation
        grounds: ["entities.FeeSchedule", "endpoints[POST /entitlement/fee-schedules]"]
        distinguishing_aspect: "POST with all 12 required rate/label/date fields → 201; status defaults to DRAFT; id/created_at/version server-stamped."
        test_recipe:
          setup: ["empty DB; PlatformAdmin role"]
          setup_api_calls:
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "S1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id, fs_status: $.data.status, fs_version: $.data.version }
          trigger:
            - call: "GET /entitlement/fee-schedules/${fs_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "FeeSchedule.status == DRAFT (initial state)"
            - "FeeSchedule.version == 1 (server-stamped)"
            - "id is a UUID with no type prefix"

      - name: create_fee_schedule_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.FeeSchedule.fields.rate_sewer_res", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required rate_sewer_res → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "Bad", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing rate_sewer_res)"
            - "HTTP 400"

      - name: project_affordable_units_exceeding_dwelling_units_rejected
        claim_type: type_constraints
        grounds: ["entities.EntitlementProject.fields.affordable_units", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "affordable_units > dwelling_units violates the declared constraint 0 <= affordable_units <= dwelling_units → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["applicant exists"]
          setup_api_calls:
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "BadCo", contact_email: "b@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /entitlement/projects"
              payload: { project_name: "Bad", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 10, affordable_units: 20, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (affordable_units 20 > dwelling_units 10)"

      - name: get_nonexistent_project_returns_not_found
        claim_type: not_found
        grounds: ["entities.EntitlementProject", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /entitlement/projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP 404"

      - name: list_applications_pagination_envelope
        claim_type: listing
        grounds: ["entities.EntitlementApplication", "response_envelope"]
        distinguishing_aspect: "GET list returns response_type array with limit/offset/total_count/has_more pagination fields; defaults limit=10."
        test_recipe:
          setup: ["empty DB (zero applications)"]
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /entitlement/applications"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'array'"
            - "pagination fields limit, offset, total_count, has_more present; total_count == 0 on empty DB"

      - name: review_comment_revises_comment_id_self_reference
        claim_type: parent_relationships
        grounds: ["entities.ReviewComment.fields.revises_comment_id", "errors[ERR_REVISION_MISMATCH]"]
        distinguishing_aspect: "Self-referential FK: a comment whose revises_comment_id targets a comment on a DIFFERENT application → ERR_REVISION_MISMATCH."
        test_recipe:
          setup: ["two applications UNDER_REVIEW, each with one comment; try to revise app1's comment from app2"]
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "TwoApp", contact_email: "t@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "P1", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { proj1: $.data.id, proj1_v: $.data.version }
            - call: "POST /entitlement/projects"
              payload: { project_name: "P2", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { proj2: $.data.id, proj2_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${proj1}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${proj1_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app1: $.data.id }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${proj2}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${proj2_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app2: $.data.id }
            - call: "POST /entitlement/applications/${app1}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/applications/${app2}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev", disciplines: ["TRANSPORTATION"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /entitlement/applications/${app1}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app2}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app1}/review-comments"
              payload: { reviewer_id: "${rev_id}", discipline: "TRANSPORTATION", comment_text: "app1 comment", severity: "INFO" }
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { comment1: $.data.id }
          trigger:
            - call: "POST /entitlement/applications/${app2}/review-comments"
              payload: { reviewer_id: "${rev_id}", discipline: "TRANSPORTATION", comment_text: "cross-app revise", severity: "INFO", revises_comment_id: "${comment1}" }
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REVISION_MISMATCH (revises_comment_id points to a comment on a different application)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.EntitlementApplication", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-submitting an already-SUBMITTED application (not DRAFT) → ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["application already SUBMITTED"]
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "ReSub", contact_email: "rs@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "RS", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (submit from SUBMITTED, not DRAFT)"
            - "no second provisional assessment created"

      - name: terminal_approved_application_rejects_withdraw
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.EntitlementApplication", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "APPROVED is terminal; withdraw from APPROVED → ERR_ALREADY_TERMINAL (or ERR_INVALID_STATE); no transitions out."
        test_recipe:
          setup: ["application APPROVED"]
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "TermCo", contact_email: "te@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Term", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev", disciplines: ["PLANNING"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /entitlement/decision-authorities"
              payload: { full_name: "Council", body: "CITY_COUNCIL" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/advance-to-decision"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { app_v: $.data.version }
            - call: "POST /entitlement/applications/${app_id}/decisions"
              payload: { decision: "APPROVE", decided_by: "${auth_id}", expected_application_version: "${app_v}" }
              as: DecisionAuthority
              as_user_id: "${auth_id}"
          trigger:
            - call: "POST /entitlement/applications/${app_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id in {ERR_ALREADY_TERMINAL, ERR_INVALID_STATE} (APPROVED is terminal)"
            - "HTTP 409"

      - name: permit_issue_sequence_violation_building_before_grading
        claim_type: precondition_enforcement
        grounds: ["state_machines.PermitSequence.REQUESTED_to_ISSUED", "errors[ERR_SEQUENCE_VIOLATION]"]
        distinguishing_aspect: "BUILDING (rank 2) cannot be ISSUED while GRADING (rank 1) is not yet ISSUED → ERR_SEQUENCE_VIOLATION."
        test_recipe:
          setup: ["application APPROVED, decision FINAL (no appeal filed, window lapsed), fees PAID, no pending PERMIT_ISSUANCE conditions; GRADING requested but NOT issued; BUILDING requested"]
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "SeqCo", contact_email: "sq@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Seq", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev", disciplines: ["PLANNING"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /entitlement/decision-authorities"
              payload: { full_name: "Council", body: "CITY_COUNCIL" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/advance-to-decision"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { app_v: $.data.version }
            - call: "POST /entitlement/applications/${app_id}/decisions"
              payload: { decision: "APPROVE", decided_by: "${auth_id}", expected_application_version: "${app_v}" }
              as: DecisionAuthority
              as_user_id: "${auth_id}"
            - call: "GET /entitlement/applications/${app_id}/assessments"
              payload: { variant: "FINAL" }
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { final_assessment: "$.data[0].id", final_net: "$.data[0].net_total" }
            - call: "POST /entitlement/assessments/${final_assessment}/payments"
              payload: { amount: 58000.00, paid_at: "2026-08-05T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/applications/${app_id}/permit-sequences"
              payload: { permit_type: "GRADING" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { seq_grading: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/permit-sequences"
              payload: { permit_type: "BUILDING" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { seq_building: $.data.id }
          trigger:
            - call: "POST /entitlement/permit-sequences/${seq_building}/issue"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEQUENCE_VIOLATION (BUILDING rank 2 issued before GRADING rank 1)"
            - "PermitSequence.${seq_building} not ISSUED"

      - name: condition_satisfied_side_effect_stamps_satisfied_at
        claim_type: side_effect_execution
        grounds: ["state_machines.ConditionOfApproval.PENDING_to_SATISFIED", "entities.ConditionOfApproval.fields.satisfied_at"]
        distinguishing_aspect: "Satisfying a condition stamps satisfied_at with the current logical clock and transitions to SATISFIED."
