              as: visitor
              as_user_id: "${v_id}"
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /v1/camp-reservations"
              payload: { campsite_id: "${site_id}", account_id: "${v_id}", check_in: "2026-06-10", check_out: "2026-06-12", party_size: 2 }
