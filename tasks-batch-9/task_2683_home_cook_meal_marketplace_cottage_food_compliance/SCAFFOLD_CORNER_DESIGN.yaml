          - validations[priority=11]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: >
          REJECTED is terminal on the onboarding dimension only. Nothing may leave it - not ACTIVATE,
          not a second REJECT, not a fresh document submission - yet the parallel standing dimension
          of the very same row is untouched and still accepts CLEAR -> SUSPENDED. Terminal lockdown
          here is per dimension, not per row.
        test_recipe:
          setup:
            - "StatePolicy CA exists; logical clock at 2026-08-01T00:00:00Z."
