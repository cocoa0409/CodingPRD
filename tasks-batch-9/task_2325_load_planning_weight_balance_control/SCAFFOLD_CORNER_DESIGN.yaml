              as: LoadController
              captures: { f1: $.data.id }
            - call: "POST /cargo-items"
              payload: { flight_id: "${f1}", awb_number: "724-16000001", item_kind: "GENERAL", weight_kg: 400, length_m: 1.2, is_dangerous_goods: false }
