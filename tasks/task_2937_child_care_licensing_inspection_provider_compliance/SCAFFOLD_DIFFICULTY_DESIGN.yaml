# =========================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2937_child_care_licensing_inspection_provider_compliance
#
# Every instance grounds ONLY in elements declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file leaves the declared behaviour identical.
# Default logical clock is 2026-08-01T00:00:00Z; every recipe that depends
# on the clock sets it explicitly.
# =========================================================================
scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_inspection_compliance_preliminary_vs_final
        grounds:
          - calculations.inspection_compliance_score
          - entities.Inspection.fields.preliminary_compliance_score
          - entities.Inspection.fields.final_compliance_score
          - entities.Inspection.fields.raw_deduction_points
          - state_machines.Violation.CORRECTION_PENDING_to_VERIFIED_CORRECTED
          - state_machines.Violation.CORRECTION_PENDING_to_UNCORRECTED
          - state_machines.Violation.CORRECTION_PENDING_to_VACATED
          - state_machines.Inspection.PENDING_REVIEW_to_FINALIZED
        distinguishing_aspect: |
          This dual variant lives on the Inspection entity and scores site
          compliance: PRELIMINARY forces STATUS_FACTOR to 1.000 and drops
          VACATED rows, FINAL applies the real STATUS_FACTOR and keeps
          VACATED rows at 0.000, so over the identical five stored
          Violations the two variants return 26.58 and 37.34.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z for the whole recipe."
            - "Three ChecklistItems: SU-101 CRITICAL infant_sensitive, RA-201 SERIOUS, FA-401 MODERATE."
            - "One Inspector certified for all four age groups."
            - "One CENTER provider, requested_capacity 60, four rosters summing to 60, one cleared DIRECTOR, application_status CHECKS_CLEARED."
            - "One INITIAL Inspection, age_groups_observed [INFANT, TODDLER, PRESCHOOL], carrying five violations: FA-401/PRESCHOOL depth 0 (4 pts), SU-101/INFANT (23), SU-101/INFANT (23), RA-201/TODDLER (8), FA-401/PRESCHOOL repeat of the first (8)."
            - "Inspection FINALIZED with outcome FAIL, so all five violations sit in CORRECTION_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio met", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "FA-401", title: "Indoor play area free of hazards", category: "FACILITY", default_severity: "MODERATE", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_fa: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 60 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Director", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], role_title: "Center Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { sm_dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc_fbi}/result"
              payload: { result: "CLEARED", disqualifying_offense_tier: "NONE" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc_car: $.data.id }
            - call: "POST /licensing/background-checks/${bc_car}/result"
              payload: { result: "CLEARED", disqualifying_offense_tier: "NONE" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "INFANT", requested_group_size: 8, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { r_inf: $.data.id }
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "TODDLER", requested_group_size: 12, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "PRESCHOOL", requested_group_size: 20, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "SCHOOL_AGE", requested_group_size: 20, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/providers/${prov}/submit-application"
              payload: {}
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/providers/${prov}/clear-checks"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "INITIAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["INFANT", "TODDLER", "PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_fa}", primary_age_group: "PRESCHOOL", narrative: "Gate latch to the preschool yard broken." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v0: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su}", primary_age_group: "INFANT", narrative: "Infant room unattended for four minutes." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v1: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su}", primary_age_group: "INFANT", narrative: "Second infant room unattended during nap transition." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v2: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_ra}", primary_age_group: "TODDLER", narrative: "Toddler room at one adult to eight children." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v3: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_fa}", primary_age_group: "PRESCHOOL", narrative: "Same gate latch still broken at re-walk.", repeat_of_violation_id: "${v0}" }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v4: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "FAIL", age_groups_observed: ["INFANT", "TODDLER", "PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
          trigger:
            - call: "POST /licensing/violations/${v1}/disposition"
              payload: { disposition: "VERIFIED_CORRECTED" }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations/${v2}/disposition"
              payload: { disposition: "UNCORRECTED" }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations/${v3}/disposition"
              payload: { disposition: "VACATED", vacated_reason: "Sign-in sheets show the room was compliant; citation withdrawn." }
              as: LicensingSupervisor
            - call: "GET /licensing/inspections/${insp_id}/compliance-score"
              payload: { variant: "PRELIMINARY" }
              as: LicensingSupervisor
              captures: { prelim_live: $.data.compliance_score }
            - call: "GET /licensing/inspections/${insp_id}/compliance-score"
              payload: { variant: "FINAL" }
              as: LicensingSupervisor
              captures: { final_live: $.data.compliance_score, final_raw: $.data.raw_deduction }
          assert:
            - "Violation.${v0}.assessed_points == 4"
            - "Violation.${v1}.assessed_points == 23"
            - "Violation.${v2}.assessed_points == 23"
            - "Violation.${v3}.assessed_points == 8"
            - "Violation.${v4}.assessed_points == 8 and Violation.${v4}.repeat_chain_depth == 1"
            - "immediately after finalize: Inspection.${insp_id}.raw_deduction_points == 82.62 and preliminary_compliance_score == 17.38 and final_compliance_score == 17.38"
            - "82.62 is round-per-line-then-sum; a sum-then-round implementation returns 82.61 and score 17.39, which is wrong"
            - "after the three dispositions: ${final_live} == 37.34 and ${final_raw} == 62.66"
            - "after the three dispositions: ${prelim_live} == 26.58"
            - "${final_live} - ${prelim_live} == 10.76"
            - "Inspection.${insp_id}.preliminary_compliance_score is still 17.38 (frozen at finalize, never recomputed)"
            - "Inspection.${insp_id}.final_compliance_score == 37.34"
            - "Inspection.${insp_id}.violation_count == 4 (the VACATED row is removed from the count)"

      - name: dual_variant_provider_risk_intake_vs_enforcement
        grounds:
          - calculations.provider_risk_assessment
          - entities.Provider.fields.risk_score
          - entities.Provider.fields.risk_tier
          - entities.Provider.fields.substantiated_complaint_count_24mo
          - entities.Provider.fields.inconclusive_complaint_count_24mo
          - state_machines.Complaint.UNDER_INVESTIGATION_to_DETERMINED
        distinguishing_aspect: |
          This dual variant lives on the Provider entity and scores regulatory
          risk, not compliance: W_INCONCLUSIVE is 0 for INTAKE_SCREENING and 4
          for ENFORCEMENT_REVIEW, so the same provider counters return
          18.00/LOW and 22.00/MODERATE — the variants disagree on the tier
          band, not merely on the number.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z for the whole recipe."
            - "Three ChecklistItems: RA-201 SERIOUS, NU-501 MINOR, RE-601 MINOR (RE-601 is the RECORDS auto-citation target)."
            - "Two Inspectors: Ada conducts the visit, Ben investigates (Ada is barred from investigating this provider by the 12-month segregation rule)."
            - "One CENTER provider, license_status NONE, so probation_component is 0 for both variants."
            - "One FINALIZED COMPLAINT inspection carrying RA-201/PRESCHOOL (8 pts) and NU-501/PRESCHOOL (1 pt)."
            - "Complaint C1 RECORDS/PRESCHOOL determined SUBSTANTIATED, whose cascade auto-cites RE-601/PRESCHOOL for 1 further point, bringing open_violation_points to exactly 10."
            - "Complaint C2 RECORDS/PRESCHOOL determined INCONCLUSIVE, so inconclusive_complaint_count_24mo is exactly 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio met", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "NU-501", title: "Menu posted and followed", category: "NUTRITION", default_severity: "MINOR", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_nu: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "RE-601", title: "Child and staff records complete", category: "RECORDS", default_severity: "MINOR", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_re: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ben Investigator", county_code: "CTY-01", certified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_b: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Cedar Lane Center", county_code: "CTY-01", site_address: "40 Cedar Ln", program_type: "CENTER", requested_capacity: 60 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "WEB", allegation_category: "RECORDS", affected_age_group: "PRESCHOOL", narrative: "Immunisation records missing for several preschoolers.", alleged_serious_harm: false, anonymous: false, complainant_name: "R. Parent" }
              as: ComplaintIntakeSpecialist
              captures: { cmp1: $.data.id }
            - call: "POST /licensing/complaints/${cmp1}/screen"
              payload: { decision: "SCREEN_IN" }
              as: ComplaintIntakeSpecialist
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120, complaint_id: "${cmp1}" }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "Preschool room at one adult to fourteen children." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_ra: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_nu}", primary_age_group: "PRESCHOOL", narrative: "Weekly menu not posted." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_nu: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "CONDITIONAL_PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/complaints/${cmp1}/assign-investigator"
              payload: { investigator_id: "${insp_b}" }
              as: LicensingSupervisor
            - call: "POST /licensing/complaints/${cmp1}/determination"
              payload: { determination: "SUBSTANTIATED" }
              as: ComplaintInvestigator
              as_user_id: "${insp_b}"
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "MAIL", allegation_category: "RECORDS", affected_age_group: "PRESCHOOL", narrative: "Anonymous letter alleging incomplete attendance logs.", alleged_serious_harm: false, anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { cmp2: $.data.id }
            - call: "POST /licensing/complaints/${cmp2}/screen"
              payload: { decision: "SCREEN_IN" }
              as: ComplaintIntakeSpecialist
            - call: "POST /licensing/complaints/${cmp2}/assign-investigator"
              payload: { investigator_id: "${insp_b}" }
              as: LicensingSupervisor
            - call: "POST /licensing/complaints/${cmp2}/determination"
              payload: { determination: "INCONCLUSIVE" }
              as: ComplaintInvestigator
              as_user_id: "${insp_b}"
          trigger:
            - call: "GET /licensing/providers/${prov}/risk-assessment"
              payload: { variant: "INTAKE_SCREENING" }
              as: ComplaintIntakeSpecialist
              captures: { intake_score: $.data.risk_score, intake_tier: $.data.risk_tier }
            - call: "GET /licensing/providers/${prov}/risk-assessment"
              payload: { variant: "ENFORCEMENT_REVIEW" }
              as: LicensingSupervisor
              captures: { enf_score: $.data.risk_score, enf_tier: $.data.risk_tier }
          assert:
            - "Provider.${prov}.open_violation_points == 10 (8 + 1 cited + 1 auto-cited by the substantiated-complaint cascade)"
            - "Provider.${prov}.substantiated_complaint_count_24mo == 1"
            - "Provider.${prov}.inconclusive_complaint_count_24mo == 1"
            - "Provider.${prov}.critical_violation_count_24mo == 0"
            - "${intake_score} == 18.00 and ${intake_tier} == \"LOW\""
            - "${enf_score} == 22.00 and ${enf_tier} == \"MODERATE\""
            - "${enf_score} - ${intake_score} == 4.00 (exactly W_INCONCLUSIVE[ENFORCEMENT_REVIEW] * 1)"
            - "Provider.${prov}.risk_score == 22.00 and Provider.${prov}.risk_tier == \"MODERATE\" (the persisted fields always use ENFORCEMENT_REVIEW)"
            - "no EnforcementAction exists for ${prov}: open_violation_points 10 is below PROBATION_THRESHOLD 30, so cascade link 4 did not fire"

  # =======================================================================
  # Rule 2 — combinatorial formulas across different modes
  #   instance 1 = mode (a) non-linear multi-input interaction
  #   instance 2 = mode (b) nested rounding where order matters
  #   instance 3 = mode (c) circular-looking dependency with pinned order
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_mode_a_violation_points_nested_branch_and_cap
        grounds:
          - calculations.violation_point_assessment
          - entities.Violation.fields.assessed_points
          - entities.Violation.fields.infant_exposure
          - entities.Violation.fields.repeat_chain_depth
          - entities.Violation.fields.severity_override
          - entities.ChecklistItem.fields.infant_sensitive
        distinguishing_aspect: |
          Mode (a): assessed_points combines five inputs (override-or-default
          severity, a two-disjunct infant_exposure branch, a depth-keyed
          multiplier lookup, one round_half_up, and a min cap) so that the
          normative order aggravate -> multiply -> round -> cap is the only
          order producing 30 for CRITICAL/INFANT at depth 1 (rounding or
          capping earlier yields 23 or 45).
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Four ChecklistItems: SU-101 CRITICAL infant_sensitive true, SU-102 CRITICAL infant_sensitive false, FA-401 MODERATE infant_sensitive false, NU-501 MINOR infant_sensitive false."
            - "One Inspector certified for all four age groups; one CENTER provider; one Complaint so a COMPLAINT inspection can be opened."
            - "One IN_PROGRESS COMPLAINT inspection with target_age_groups [INFANT, TODDLER, PRESCHOOL]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su101: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-102", title: "Written supervision plan on file", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_su102: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "FA-401", title: "Indoor play area free of hazards", category: "FACILITY", default_severity: "MODERATE", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_fa: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "NU-501", title: "Menu posted and followed", category: "NUTRITION", default_severity: "MINOR", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_nu: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Maple Court Center", county_code: "CTY-01", site_address: "3 Maple Ct", program_type: "CENTER", requested_capacity: 60 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "SUPERVISION", affected_age_group: "INFANT", narrative: "Caller reports infants left alone in the nap room.", alleged_serious_harm: true, anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { cmp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["INFANT", "TODDLER", "PRESCHOOL"], duration_minutes: 120, complaint_id: "${cmp}" }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
          trigger:
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su101}", primary_age_group: "INFANT", narrative: "Infant room unattended." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { w1: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su102}", primary_age_group: "PRESCHOOL", narrative: "No written supervision plan for the preschool room." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { w2: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_nu}", primary_age_group: "INFANT", narrative: "Bottle log not maintained in the infant room." }
