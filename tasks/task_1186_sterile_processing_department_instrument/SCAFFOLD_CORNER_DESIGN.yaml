# =============================================================================
# §1.9 Scaffold Corner Design — SPD benchmark (Coverage Index for
# Non-Difficulty Tests). Breadth probe over every testable claim of
# §1.1–§1.7 not already covered by §1.8. All chains assume empty DB and the
# logical clock default 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: template_create_persists_fields_and_system_columns
        claim_type: creation
        grounds:
          - "entities.TrayTemplate"
        distinguishing_aspect: "A well-formed create returns 201 with all input fields echoed, a server-minted bare UUID id, created_at == 2026-05-01T00:00:00Z (logical clock default) and version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { t: "$.data.id", tv: "$.data.version" } }
            - { call: "GET /spd/tray-templates/${t}", as: Any }
          assert:
            - "tv == 1 and the id is a bare UUID (no type prefix)"
            - "GET echoes code GEN-01, packaging_type WRAPPED, and the same instrument_requirements"
            - "created_at == 2026-05-01T00:00:00Z (logical clock default, not wall clock)"

      - name: tray_create_initial_state_and_defaults
        claim_type: defaults
        grounds:
          - "entities.Tray"
          - "state_machines.Tray"
        distinguishing_aspect: "New trays start AWAITING_DECONTAMINATION with cycles_completed 0, sterility_expires_at null, current_load_id null."
        test_recipe:
          setup: ["template and technician exist"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
          trigger:
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "N1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { st: "$.data.status", cyc: "$.data.cycles_completed" } }
          assert:
            - "st == AWAITING_DECONTAMINATION and cyc == 0"
            - "sterility_expires_at is null and current_load_id is null in the response"

      - name: tray_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET on a well-formed but unknown tray id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /spd/trays/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_NOT_FOUND (http 404)"]

      - name: tray_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting the required label field is rejected at priority 4 before any state or business logic."
        test_recipe:
          setup: ["template and technician exist"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
          trigger:
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_INVALID_REQUEST (http 400); no tray is created"]

      - name: instrument_create_duplicate_serial_rejected
        claim_type: type_constraints
        grounds:
          - "errors[ERR_DUPLICATE_SERIAL_NUMBER]"
          - "validations[priority=9]"
        distinguishing_aspect: "serial_number uniqueness is enforced across the whole instrument inventory."
        test_recipe:
          setup: ["one instrument with serial SN-D1 registered"]
          setup_api_calls:
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-D1", max_cycles: 50, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-D1", max_cycles: 40, replacement_cost_cents: 90000, criticality: "CRITICAL" }, as: FacilityAdmin, captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_DUPLICATE_SERIAL_NUMBER (http 409)"]

      - name: template_create_invalid_packaging_enum_rejected
        claim_type: type_constraints
        grounds:
          - "errors[ERR_INVALID_ENUM_VALUE]"
          - "entities.TrayTemplate.fields.packaging_type"
        distinguishing_aspect: "packaging_type outside {WRAPPED, RIGID_CONTAINER} is rejected with ERR_INVALID_ENUM_VALUE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "FOAM", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_INVALID_ENUM_VALUE (http 400)"]

      - name: tray_create_with_unknown_template_rejected
        claim_type: parent_relationships
        grounds:
          - "entities.Tray.fields.template_id"
          - "validations[priority=4]"
        distinguishing_aspect: "Flat-topology FK integrity: a body FK (template_id) that resolves to nothing is rejected with ERR_INVALID_REQUEST (400) — 404 is reserved for path ids."
        test_recipe:
          setup: ["technician exists"]
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
          trigger:
            - { call: "POST /spd/trays", payload: { template_id: "00000000-0000-0000-0000-000000000000", label: "X1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_INVALID_REQUEST (http 400)"]

      - name: technician_create_defaults_active_with_full_scores
        claim_type: defaults
        grounds:
          - "entities.Technician"
        distinguishing_aspect: "A new technician starts ACTIVE with both competency scores at 100."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 1, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { st: "$.data.status", cs: "$.data.competency_score", csl: "$.data.competency_score_lifetime" } }
          assert: ["st == ACTIVE", "cs == 100 and csl == 100"]

      - name: assembly_verification_is_immutable_record
        claim_type: immutability
        grounds:
          - "entities.AssemblyVerification"
        distinguishing_aspect: "common_fields: false — the record carries id and created_at only; no update/delete endpoint exists and the response contains no version field."
        test_recipe:
          setup: ["template, technician, tray v1 in IN_ASSEMBLY"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "V1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { v1: "$.data.id" } }
            - { call: "POST /spd/trays/${v1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${v1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${v1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
          trigger:
            - { call: "POST /spd/trays/${v1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 1 }] }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { av: "$.data.id", avr: "$.data.result" } }
            - { call: "GET /spd/assembly-verifications/${av}", as: Any }
          assert:
            - "avr == FAIL with mismatch_count == 1"
            - "GET returns the same record with technician_id == ${tech_a}; the response object has no version key (immutable audit record)"

      - name: tray_list_pagination_and_status_filter
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "limit/offset/total_count/has_more follow the envelope defaults and compose with the status filter."
        test_recipe:
          setup: ["template, technician, 3 trays all AWAITING_DECONTAMINATION"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "L1" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "L2" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "L3" }, as: SpdTechnician, as_user_id: "${tech_a}" }
          trigger:
            - { call: "GET /spd/trays?template_id=${tpl}&limit=2", as: Any }
            - { call: "GET /spd/trays?template_id=${tpl}&limit=2&offset=2", as: Any }
            - { call: "GET /spd/trays?status=STERILE", as: Any }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 row, total_count == 3, has_more == false"
            - "status=STERILE filter: 0 rows, total_count == 0"

  - section: state_machines
    instances:
      - name: tray_invalid_from_transitions_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Tray"
          - "errors[ERR_TRAY_NOT_IN_DECONTAMINATION]"
          - "errors[ERR_TRAY_NOT_DECONTAMINATED]"
          - "errors[ERR_TRAY_NOT_IN_ASSEMBLY]"
          - "errors[ERR_TRAY_NOT_QUARANTINED]"
        distinguishing_aspect: "From AWAITING_DECONTAMINATION, every off-machine action is rejected with its specific error and leaves the tray untouched."
        test_recipe:
          setup: ["template, technician, fresh tray ta (AWAITING_DECONTAMINATION)"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TA" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { ta: "$.data.id" } }
          trigger:
            - { call: "POST /spd/trays/${ta}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /spd/trays/${ta}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}", captures: { e2: "$.data.error_id" } }
            - { call: "POST /spd/trays/${ta}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { e3: "$.data.error_id" } }
            - { call: "POST /spd/trays/${ta}/discard", as: SpdSupervisor, as_user_id: "${tech_s}", captures: { e4: "$.data.error_id" } }
            - { call: "GET /spd/trays/${ta}", as: Any }
          assert:
            - "e1 == ERR_TRAY_NOT_IN_DECONTAMINATION, e2 == ERR_TRAY_NOT_DECONTAMINATED, e3 == ERR_TRAY_NOT_IN_ASSEMBLY, e4 == ERR_TRAY_NOT_QUARANTINED"
            - "Tray.${ta}.status == AWAITING_DECONTAMINATION (no rejected call mutated state)"

      - name: load_wrong_state_actions_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.SterilizationLoad"
          - "errors[ERR_LOAD_NOT_RUNNING]"
          - "errors[ERR_LOAD_NOT_RELEASABLE]"
        distinguishing_aspect: "A LOADING load rejects complete (ERR_LOAD_NOT_RUNNING) and release (ERR_LOAD_NOT_RELEASABLE); a released-then-recalled (terminal) load also rejects abort (ERR_LOAD_NOT_LOADING)."
        test_recipe:
          setup: ["template, technicians A and S, sterilizer, load LS in LOADING (no trays needed for these rejections)"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SG", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sg: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { ls: "$.data.id" } }
          trigger:
            - { call: "POST /spd/sterilization-loads/${ls}/complete", as: SpdTechnician, as_user_id: "${tech_a}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /spd/sterilization-loads/${ls}/release", as: SpdSupervisor, as_user_id: "${tech_s}", captures: { e2: "$.data.error_id" } }
            - { call: "GET /spd/sterilization-loads/${ls}", as: Any }
          assert:
            - "e1 == ERR_LOAD_NOT_RUNNING and e2 == ERR_LOAD_NOT_RELEASABLE"
            - "Load.${ls}.status == LOADING afterwards"

      - name: load_start_empty_and_capacity_boundary
        claim_type: precondition_enforcement
        grounds:
          - "errors[ERR_LOAD_EMPTY]"
          - "errors[ERR_LOAD_CAPACITY_EXCEEDED]"
          - "entities.Sterilizer.fields.chamber_capacity"
        distinguishing_aspect: "Start requires tray_count >= 1 (ERR_LOAD_EMPTY); adding the (capacity+1)-th tray fails (ERR_LOAD_CAPACITY_EXCEEDED) while exactly capacity succeeds — boundary at chamber_capacity == 1."
        test_recipe:
          setup: ["template, technician, sterilizer SC with chamber_capacity 1; trays c1, c2 both ASSEMBLED; load LC in LOADING on SC"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SC", method: "STEAM_GRAVITY", chamber_capacity: 1, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sc: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "C1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { c1: "$.data.id" } }
            - { call: "POST /spd/trays/${c1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${c1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${c1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${c1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "C2" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { c2: "$.data.id" } }
            - { call: "POST /spd/trays/${c2}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${c2}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${c2}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${c2}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sc}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lc: "$.data.id" } }
          trigger:
            - { call: "POST /spd/sterilization-loads/${lc}/start", as: SpdTechnician, as_user_id: "${tech_a}", captures: { e0: "$.data.error_id" } }
            - { call: "POST /spd/sterilization-loads/${lc}/trays", payload: { tray_id: "${c1}" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tc: "$.data.tray_count" } }
            - { call: "POST /spd/sterilization-loads/${lc}/trays", payload: { tray_id: "${c2}" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /spd/sterilization-loads/${lc}/start", as: SpdTechnician, as_user_id: "${tech_a}", captures: { lst: "$.data.status" } }
          assert:
            - "e0 == ERR_LOAD_EMPTY (start with tray_count 0)"
            - "First add succeeds: tc == 1 (== chamber_capacity is allowed)"
            - "e1 == ERR_LOAD_CAPACITY_EXCEEDED (tray_count 1 == capacity 1, second tray rejected)"
            - "Retry start with one tray: lst == RUNNING"

      - name: load_start_before_planned_start_rejected
        claim_type: precondition_enforcement
        grounds:
          - "errors[ERR_LOAD_PLANNED_START_NOT_REACHED]"
          - "entities.SterilizationLoad.fields.planned_start_at"
        distinguishing_aspect: "now (2026-05-01T00:00:00Z) < planned_start_at (2026-05-02T00:00:00Z) blocks start; after the clock reaches the planned instant the same call succeeds (now >= planned_start_at)."
        test_recipe:
          setup: ["template, technician, sterilizer, tray ASSEMBLED, load LP planned 2026-05-02T00:00:00Z with the tray added"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SG", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sg: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "P1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { p1: "$.data.id" } }
            - { call: "POST /spd/trays/${p1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${p1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-02T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lp: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lp}/trays", payload: { tray_id: "${p1}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
          trigger:
            - { call: "POST /spd/sterilization-loads/${lp}/start", as: SpdTechnician, as_user_id: "${tech_a}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/sterilization-loads/${lp}/start", as: SpdTechnician, as_user_id: "${tech_a}", captures: { st: "$.data.status" } }
          assert:
