            - call: "GET /bookings/${bk_id}/revenue-entries"
              payload: {}
              as: RevenueAccountant
              as_user_id: "ra-001"
          assert:
            - "the first two responses are HTTP 403 with error_id \"ERR_ROLE_NOT_PERMITTED\""
            - "the RevenueAccountant read is HTTP 200 with total_count == 1"
            - "that row is entry_type \"SALE\", category \"BAGGAGE\", gross_cents 3500, tax_cents 140, net_cents 3360 and tax_treatment \"TAXABLE_SERVICE\""
            - "GET /bookings/${bk_id} (allowed for the partner) reports ancillary_gross_cents 3500 and recognized_ancillary_net_cents 3360, so the partner still sees its own totals - only the ledger rows are walled off"

      - name: the_analyst_who_designed_a_family_may_not_review_it
        claim_type: segregation_of_duties
        grounds:
          - roles[PricingApprover].description
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 7]
          - entities.FareFamily.fields.design_owner_user_id
        distinguishing_aspect: "The check compares X-User-ID against design_owner_user_id, not the role: the very same PricingApprover endpoint is refused for user ma-001 and accepted for pa-001, and the refusal leaves the family in IN_REVIEW with reviewer_user_id still null."
        test_recipe:
          setup:
            - "family ECO_SOD was created by ma-001 with one INCLUDED BAG_CHECKED_1 attribute and submitted, so it is IN_REVIEW with design_owner_user_id \"ma-001\""
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_SOD", name: "Economy Segregation", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_id: $.data.id }
            - call: "POST /fare-families/${f_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          trigger:
            - call: "POST /fare-families/${f_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "self approval attempt" }
              as: PricingApprover
              as_user_id: "ma-001"
              captures: { err: $.data.error_id }
            - call: "POST /fare-families/${f_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "independent approval" }
              as: PricingApprover
              as_user_id: "pa-001"
          assert:
            - "the first trigger is HTTP 403 with error_id \"ERR_SEGREGATION_OF_DUTIES\""
            - "immediately after the refusal the family is still IN_REVIEW with reviewer_user_id null and version 3"
            - "the second trigger is HTTP 200 with status \"PUBLISHED\", reviewer_user_id \"pa-001\" and version 4"
            - "design_owner_user_id is still \"ma-001\": the approval does not rewrite ownership"

      - name: channel_partner_list_reads_are_filtered_while_single_row_reads_are_refused
        claim_type: peer_roles
        grounds:
          - roles[ChannelPartner].shared_operations
          - errors[ERR_CHANNEL_SCOPE_VIOLATION]
          - validations[priority 6]
        distinguishing_aspect: "Two shapes of scoping in one probe: the collection read silently filters to the caller's own channel (200 with total_count 1), while the by-id read of a peer's booking is an outright 403 - and an internal role sees both rows."
        test_recipe:
          setup:
            - "channels OTA_ONE and OTA_TWO both exist; DRAFT family ECO_BARE and PRESALE flight AC572 are shared"
            - "booking MINE01 belongs to OTA_ONE and booking THEIR1 belongs to OTA_TWO"
          setup_api_calls:
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bare_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "OTA_ONE", channel_type: "OTA", commission_bp: 900, markup_bp: 500, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_one_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "OTA_TWO", channel_type: "OTA", commission_bp: 700, markup_bp: 300, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_two_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC572", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "MINE01", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_one_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_one_id}"
              captures: { bk_mine_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "THEIR1", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_two_id}", passenger_name: "Grace Hopper" }
              as: ChannelPartner
              as_user_id: "${ch_two_id}"
              captures: { bk_their_id: $.data.id }
          trigger:
            - call: "GET /bookings"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_one_id}"
            - call: "GET /bookings/${bk_their_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_one_id}"
              captures: { err_scope: $.data.error_id }
            - call: "GET /bookings"
              payload: {}
              as: RevenueAccountant
              as_user_id: "ra-001"
          assert:
            - "the first read is HTTP 200 with total_count == 1 and the only row is ${bk_mine_id} (record_locator \"MINE01\")"
            - "the second read is HTTP 403 with error_id \"ERR_CHANNEL_SCOPE_VIOLATION\" - a peer's booking is refused, not filtered"
            - "the third read is HTTP 200 with total_count == 2: an internal role is not channel-scoped"
            - "a cancel of ${bk_their_id} as ${ch_one_id} is refused with the same ERR_CHANNEL_SCOPE_VIOLATION and leaves that booking HELD"

  - section: cross_cutting_complexity_layers
    instances:
      - name: offer_accept_with_a_stale_expected_booking_version_returns_412
