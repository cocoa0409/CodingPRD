          assert:
            - "trigger response error_id == ERR_FORBIDDEN (403)"

      - name: missing_role_header_unauthenticated
        claim_type: authentication_required
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Request without X-User-Role header -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /parcels"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_UNAUTHENTICATED (401)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_parcel_version_on_approve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[approve-plan-stale-parcel]
          - errors[ERR_STALE_PARCEL_VERSION]
          - endpoints.POST /crop-plans/{id}/approve
        distinguishing_aspect: "After plan A approve bumps Parcel.version 1->2, approving plan B with the stale expected_parcel_version=1 -> ERR_STALE_PARCEL_VERSION (412)."
        test_recipe:
          setup: ["Two DRAFT plans on the same AVAILABLE parcel (version 1); plan A approved (parcel -> version 2)."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "OCC", acreage: 200, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv1: $.data.version }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 80, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { plA: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "SOY", season_year: 2026, planned_acres: 80, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { plB: $.data.id }
            - call: "POST /crop-plans/${plA}/approve"
              payload: { expected_parcel_version: "${pv1}" }
              as: FarmManager
          trigger:
            - call: "POST /crop-plans/${plB}/approve"
              payload: { expected_parcel_version: "${pv1}" }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_PARCEL_VERSION (412)"

      - name: occ_fresh_parcel_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[approve-plan-stale-parcel]
          - endpoints.POST /crop-plans/{id}/approve
          - entities.Parcel.fields.version
        distinguishing_aspect: "Approving plan B with the up-to-date parcel version (re-read after plan A approve) succeeds; parcel.version increments to 3."
        test_recipe:
          setup: ["Two DRAFT plans on the same parcel; plan A approved (parcel version 1->2); parcel re-read."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "OCC2", acreage: 200, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv1: $.data.version }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 80, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { plA: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "SOY", season_year: 2026, planned_acres: 80, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { plB: $.data.id }
            - call: "POST /crop-plans/${plA}/approve"
              payload: { expected_parcel_version: "${pv1}" }
              as: FarmManager
            - call: "GET /parcels/${pid}"
              payload: {}
              as: FarmManager
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /crop-plans/${plB}/approve"
              payload: { expected_parcel_version: "${pv2}" }
              as: FarmManager
              captures: { st: $.data.status }
            - call: "GET /parcels/${pid}"
              payload: {}
              as: FarmManager
              captures: { pv3: $.data.version }
          assert:
            - "CropPlan.${plB}.status == APPROVED"
            - "Parcel.${pid}.version == 3"
            - "Parcel.${pid}.active_crop_plan_count == 2"

      - name: derived_total_logged_hours_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.EquipmentAsset.fields.total_logged_hours
          - endpoints.POST /equipment-usages
        distinguishing_aspect: "After two usages (5h + 3h) on one asset, EquipmentAsset.total_logged_hours == 8.00."
        test_recipe:
          setup: ["An ACTIVE asset and a GROWING plan; two equipment usages booked."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "DLH", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 40, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /equipment-assets"
              payload: { name: "Tractor X", kind: "TRACTOR", hourly_cost: 50 }
              as: FarmManager
              captures: { eq: $.data.id }
            - call: "POST /equipment-usages"
              payload: { equipment_asset_id: "${eq}", crop_plan_id: "${pl}", window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T13:00:00Z" }
              as: Agronomist
            - call: "POST /equipment-usages"
              payload: { equipment_asset_id: "${eq}", crop_plan_id: "${pl}", window_start: "2026-06-16T08:00:00Z", window_end: "2026-06-16T11:00:00Z" }
              as: Agronomist
          trigger:
            - call: "GET /equipment-assets/${eq}"
              payload: {}
              as: FarmManager
              captures: { tlh: $.data.total_logged_hours }
          assert:
            - "EquipmentAsset.${eq}.total_logged_hours == 8.00"

      - name: cascade_confirm_restricted_already_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ApplicationRecord.LOGGED_to_CONFIRMED
        excluded_because:
          difficulty_instance: transitive_cascade / confirm_restricted_app_cascade_depth3_parcel_restrict_then_block
          rationale: "N-level cascade end-to-end is verified by the named §1.8 instance."

