  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_draft_statement_with_drift_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - state_machines.ProrationStatement.REVIEWED_to_APPROVED
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: approving a statement that is still
          DRAFT (state violation) AND whose TAX line is stale after the tax
          projection was superseded (fiscal drift) must return
          ERR_STATEMENT_NOT_REVIEWED, never ERR_STATEMENT_DRIFT.
        test_recipe:
          setup:
            - "Acquisition fully diligence-complete (unit VERIFIED); price-anchored projection approved (tax 2000000); DRAFT_CLOSING statement generated (TAX line 1391781) but never submitted for review"
            - "Second projection (INCOME_APPROACH, tax 3000000) then approved, superseding the first — the stored TAX line no longer matches live recomputation (2087671), so the drift check would fail IF it were reached"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Priority One", address: "21 Cherry St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
