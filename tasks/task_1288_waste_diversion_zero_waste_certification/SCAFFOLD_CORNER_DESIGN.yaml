              payload: {}
              as: SustainabilityManager
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "PG-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "PG-T2" }
              as: VendorUser
              as_user_id: "${vendor_id}"
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "PG-T3" }
