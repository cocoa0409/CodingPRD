            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car5_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-26T00:00:00Z", odometer_miles: 7000, load_status: "LOADED" }
