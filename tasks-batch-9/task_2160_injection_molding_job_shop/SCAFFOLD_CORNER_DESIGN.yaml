      - name: ppap_submit_while_mold_is_not_sampling_returns_mold_not_ppap_approved
        claim_type: Violation to Error
        grounds: ["errors[ERR_MOLD_NOT_PPAP_APPROVED]", "validations[priority=11]", "state_machines.PPAPSubmission.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "A PPAP package can be drafted at any time but only filed while its Mold is SAMPLING; with the quote never accepted the mold is still NEW and submit returns 409 ERR_MOLD_NOT_PPAP_APPROVED."
        test_recipe:
