# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task: task_3495_federal_aid_highway_project_authorization_reimbursement
# 9 rules x 2 instances = 18 instances. Every recipe drives empty-DB to the
# target state using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_determined_federal_share_on_interstate_project
        grounds:
          - calculations.federal_share_determination
          - entities.Project.fields.provisional_federal_share_pct
          - entities.Project.fields.determined_federal_share_pct
        distinguishing_aspect: "Entity domain Project: identical inputs (NHPP, interstate, land 0.02) yield provisional_federal_share_pct 0.80 under the statutory_base variant but determined_federal_share_pct 0.90 under the adjusted_full variant — the variant is selected by lifecycle context, not by data."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. NHPP program registered. STIP for CA (land 0.02, FFY 2027) approved with one interstate ROAD_RESURFACING project costing 10,000,000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "National Highway Performance Program", eligible_activity_codes: ["ROAD_RESURFACING", "BRIDGE_REPLACEMENT"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "CA", state_federal_land_pct: 0.02, start_federal_fiscal_year: 2027, description: "CA STIP 2027" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "Public Citizen", comment_text: "Please fix I-5." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "I-5", description: "Resurface I-5", activity_code: "ROAD_RESURFACING", is_interstate_system: true, dbe_goal_pct: 0.10, total_estimated_cost_cents: 10000000 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id, prov_share: $.data.provisional_federal_share_pct, prov_est: $.data.provisional_federal_estimate_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
          trigger:
            - call: "POST /federal-aid/projects/${p_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
              captures: { det_share: $.data.determined_federal_share_pct }
          assert:
            - "Project.${p_id}.provisional_federal_share_pct == 0.80 (statutory_base: program base only)"
            - "Project.${p_id}.provisional_federal_estimate_cents == 8000000"
            - "Project.${p_id}.determined_federal_share_pct == 0.90 (adjusted_full: min(0.90, 0.80 + 0.10); land adjustment skipped because 0.02 <= 0.05)"
            - "the two share variants differ for identical project and program data"

      - name: chronological_vs_forward_looking_availability
        grounds:
          - calculations.apportionment_availability
          - calculations.fiscal_constraint_check
          - entities.Apportionment.fields.available_cents
        distinguishing_aspect: "Entity domain Apportionment: on identical rows the chronological_committed variant still shows 50,000 cents available in the FFY-2027 cell (authorization gate) while the forward_looking_programmed variant rejects STIP approval with ERR_FISCAL_CONSTRAINT_VIOLATED because programmed estimates (1,100,000) exceed 4-year capacity (750,000)."
        test_recipe:
          setup:
            - "STBG program; CA apportionments 2027-2030 of 300000/300000/200000/200000. STIP approved with project A (estimate 300,000); A determined ELIGIBLE (share 0.80), cleared, and authorized for 250,000 at clock 2026-10-15 (FFY 2027 cell). A second project B (estimate 800,000) is then created, reopening the STIP for amendment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "STBG", name: "Surface Transportation Block Grant", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "CA", federal_fiscal_year: 2027, apportioned_cents: 300000 }
              as: FHWADivisionAdmin
              captures: { ap_2027: $.data.id }
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "CA", federal_fiscal_year: 2028, apportioned_cents: 300000 }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "CA", federal_fiscal_year: 2029, apportioned_cents: 200000 }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "CA", federal_fiscal_year: 2030, apportioned_cents: 200000 }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/stips"
              payload: { state_code: "CA", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "CA STBG STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "Citizen", comment_text: "Comment one." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "US-101", description: "Project A", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 375000 }
              as: StateDOTPlanner
              captures: { pa_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/projects/${pa_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${pa_id}", kind: "ENVIRONMENTAL", nepa_class: "CE" }
              as: StateDOTEngineer
              captures: { pa_env: $.data.id }
            - call: "POST /federal-aid/clearances/${pa_env}/decide"
              payload: { decision: "CLEARED" }
              as: FHWAReviewer
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${pa_id}", kind: "RIGHT_OF_WAY" }
              as: StateDOTEngineer
              captures: { pa_row: $.data.id }
            - call: "POST /federal-aid/clearances/${pa_row}/decide"
              payload: { decision: "CLEARED", row_cert_level: "LEVEL_1_FULL" }
              as: FHWAReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/authorizations"
              payload: { project_id: "${pa_id}", agreement_number: "FA-A-001", initial_obligated_cents: 250000 }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "SR-1", description: "Project B amendment", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 1000000 }
              as: StateDOTPlanner
              captures: { pb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "Citizen", comment_text: "Amendment comment." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
          trigger:
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
              captures: { err: $.data.error_id }
            - call: "GET /federal-aid/apportionments/${ap_2027}"
              payload: {}
              as: FHWAReviewer
              captures: { avail_2027: $.data.available_cents }
          assert:
            - "the re-approval fails with ERR_FISCAL_CONSTRAINT_VIOLATED: forward_looking programmed 1,100,000 > capacity 750,000"
            - "Apportionment.${ap_2027}.available_cents == 50000 — the chronological_committed variant still shows room in the current-FFY cell on identical data"
            - "Project.${pa_id} remains AUTHORIZED and Project.${pb_id} remains NOMINATED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: safety_override_beats_land_sliding_scale
        grounds:
          - calculations.federal_share_determination
          - constants.SAFETY_FULL_SHARE_ACTIVITIES
          - constants.FEDERAL_LAND_SHARE_CAP
        distinguishing_aspect: "Mode (a) multi-input branch interaction: with base 0.90 (HSIP), land 0.40, and activity in the safety set, the safety override yields 1.00 and discards the land adjustment entirely, while the sibling project (BRIDGE_REPLACEMENT, same program and land) yields exactly 0.92 = 0.90 + (0.95 - 0.90) * 0.40."
        test_recipe:
          setup:
            - "HSIP program eligible for signage and bridge work; CA STIP with land 0.40 approved holding two projects: S (SIGNAGE_LIGHTING) and G (BRIDGE_REPLACEMENT), both non-interstate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "HSIP", name: "Highway Safety Improvement Program", eligible_activity_codes: ["SIGNAGE_LIGHTING", "BRIDGE_REPLACEMENT"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "CA", state_federal_land_pct: 0.40, start_federal_fiscal_year: 2027, description: "CA HSIP STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "Citizen", comment_text: "Safety first." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "SR-9", description: "Signal and signage upgrade", activity_code: "SIGNAGE_LIGHTING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 200000 }
              as: StateDOTPlanner
              captures: { ps_id: $.data.id }
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "SR-9", description: "Bridge rail replacement", activity_code: "BRIDGE_REPLACEMENT", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 500000 }
              as: StateDOTPlanner
              captures: { pg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
          trigger:
            - call: "POST /federal-aid/projects/${ps_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
              captures: { share_s: $.data.determined_federal_share_pct }
            - call: "POST /federal-aid/projects/${pg_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
              captures: { share_g: $.data.determined_federal_share_pct }
          assert:
            - "Project.${ps_id}.determined_federal_share_pct == 1.00 (safety override)"
            - "Project.${pg_id}.determined_federal_share_pct == 0.92 (0.90 + (0.95 - 0.90) * 0.40, under the 0.95 cap)"
            - "the safety branch wins over the land branch: applying land to S would have produced 0.92, not 1.00"

      - name: voucher_per_line_rounding_then_sum
        grounds:
          - calculations.voucher_reimbursement
          - entities.Voucher.fields.federal_reimbursable_cents
        distinguishing_aspect: "Mode (b) nested rounding: with share 0.90 and lines [105, 105] the pinned per-line-then-sum order yields round(94.5)+round(94.5) = 95+95 = 190 cents, while the forbidden sum-then-round order would yield round(210*0.90) = 189."
        test_recipe:
          setup:
            - "HSIP project (land 0.02, ROAD_RESURFACING, non-interstate) determined at share 0.90, authorized for 1,000 cents, awarded and UNDER_CONSTRUCTION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "HSIP", name: "HSIP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "CA", federal_fiscal_year: 2027, apportioned_cents: 100000 }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/stips"
