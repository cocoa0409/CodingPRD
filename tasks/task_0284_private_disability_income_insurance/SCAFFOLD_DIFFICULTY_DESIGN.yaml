        grounds:
          - state_machines.Claim.transitions.APPROVED_to_BENEFIT_EXHAUSTED
          - entities.Policy.fields.benefit_months_consumed
          - entities.ClaimLedger.fields.total_gross_paid_cents
          - calculations.claim_ledger_totals
        distinguishing_aspect: |
          Depth-3 chain from accrual: POST benefit-period mutates BenefitPeriod (ACCRUED) ->
          that accrual mutates Policy.benefit_months_consumed and ClaimLedger totals ->
          consumed reaching benefit_period_months mutates Claim.status to BENEFIT_EXHAUSTED.
          Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Insurer at month 5; ACTIVE ANY_OCC TOTAL policy, monthly_benefit_cents 500000, benefit_period_months 2, elimination 90d (elim_sat=3), no COLA."
            - "Approved TOTAL claim (next_proof_due_month 6); one BenefitPeriod already accrued at coverage_month 3 (consumed 1.0)."
