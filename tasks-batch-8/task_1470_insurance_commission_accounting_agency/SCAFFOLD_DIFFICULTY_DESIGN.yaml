# =============================================================================
# Task 1470 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × 2 instances. Every test_recipe replays against SCAFFOLD.yaml §1.5.
# All money figures are whole cents computed from §1.3 formulas (round_half_up).
# Logical clock default 2026-08-01T00:00:00Z; fixtures anchor on 2026-08-01.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: advance_limited_vs_annualized_booking
        grounds:
          - calculations.expected_commission
          - entities.CommissionEntry.fields.variant
          - entities.CommissionEntry.fields.annualized_full_amount_cents
        distinguishing_aspect: |
          Entity domain: commission booking on Policy/CommissionEntry. Identical
          premium (12000000) and rate (5500 bps) bind at different booked amounts
          purely from the schedule variant: advance_months=12 books 6600000
          (ANNUALIZED_FULL) while advance_months=6 books 3300000 (ADVANCE_LIMITED),
          and both entries carry annualized_full_amount_cents == 6600000.
        test_recipe:
          setup:
            - "Producer W tier GOLD; carrier; products PA and PB; schedule on PA (GOLD, 5500bps, override 0, advance_months 12, from 2026-01-01); schedule on PB (same but advance_months 6)"
            - "Policy A on PA and Policy B on PB, each premium_annual_cents=12000000, effective 2026-08-01, DIRECT_BILL, disclosures DELIVERED"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer A", license_number: "LIC-A1", tier: "GOLD", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier One", carrier_code: "C1" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PA", name: "Product A", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { pa_id: "$.data.id", pa_v: "$.data.version" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PB", name: "Product B", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { pb_id: "$.data.id", pb_v: "$.data.version" }
            - call: "POST /agency/products/${pa_id}/commission-schedules"
              payload: { tier: "GOLD", commission_rate_bps: 5500, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${pa_v}" }
              as: AgencyAdmin
            - call: "POST /agency/products/${pb_id}/commission-schedules"
              payload: { tier: "GOLD", commission_rate_bps: 5500, override_rate_bps: 0, advance_months: 6, effective_from: "2026-01-01", expected_product_version: "${pb_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-A1", product_id: "${pa_id}", producer_id: "${w_id}", insured_name: "Insured A", billing_type: "DIRECT_BILL", premium_annual_cents: 12000000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_a: "$.data.id" }
            - call: "POST /agency/policies"
              payload: { policy_number: "P-B1", product_id: "${pb_id}", producer_id: "${w_id}", insured_name: "Insured B", billing_type: "DIRECT_BILL", premium_annual_cents: 12000000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_b: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_a}" }
              as: AgencyAdmin
              captures: { disc_a: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${disc_a}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_b}" }
              as: AgencyAdmin
              captures: { disc_b: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${disc_b}/deliver"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies/${pol_a}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_b}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_a}", entry_type: "BASE" }
              as: AgencyAdmin
              captures: { ea_amt: "$.data[0].amount_cents", ea_var: "$.data[0].variant", ea_full: "$.data[0].annualized_full_amount_cents" }
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_b}", entry_type: "BASE" }
              as: AgencyAdmin
              captures: { eb_amt: "$.data[0].amount_cents", eb_var: "$.data[0].variant", eb_full: "$.data[0].annualized_full_amount_cents" }
          assert:
            - "Policy A BASE entry: amount_cents == 6600000 AND variant == ANNUALIZED_FULL AND annualized_full_amount_cents == 6600000"
            - "Policy B BASE entry: amount_cents == 3300000 AND variant == ADVANCE_LIMITED AND annualized_full_amount_cents == 6600000"
            - "Same premium and rate, different booked amount: 6600000 != 3300000"

      - name: cash_vs_accrual_1099_basis
        grounds:
          - calculations.producer_compensation_1099
          - entities.TaxForm1099.fields.cash_basis_total_cents
          - entities.TaxForm1099.fields.accrual_basis_total_cents
        distinguishing_aspect: |
          Entity domain: producer tax reporting (Producer/TaxForm1099), disjoint
          from the commission-booking domain of the sibling instance. For the same
          producer-year, CASH_BASIS counts only PAID payouts (90000) while
          ACCRUAL_BASIS counts statement-matched entries (150000 - 10000 variance
          adjustment = 140000); the variants diverge by 50000.
        test_recipe:
          setup:
            - "Producer with tax_form_on_file=true; carrier; product; schedule STANDARD 5000bps advance 12 from 2026-01-01"
            - "DIRECT_BILL policy P-T1 premium 3000000 effective 2026-08-01, disclosure DELIVERED, bound (BASE entry 150000 EXPECTED)"
            - "Payout 90000 created and marked PAID in 2026 (clock at default 2026-08-01)"
            - "Carrier statement 2026-08-01..2026-08-31 reports 140000 for P-T1; reconciliation flags VARIANCE; variance resolved accepting 140000 (VARIANCE_ADJUSTMENT -10000 MATCHED; Chargeback 10000 PENDING)"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer T", license_number: "LIC-T1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id", w_v: "$.data.version" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier T", carrier_code: "CT" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PT", name: "Product T", line_of_business: "ANNUITY" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-T1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured T", billing_type: "DIRECT_BILL", premium_annual_cents: 3000000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { disc_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${disc_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/producers/${w_id}/payouts"
              payload: { amount_cents: 90000, expected_producer_version: "${w_v}" }
              as: AgencyAdmin
              captures: { po_id: "$.data.id" }
            - call: "POST /agency/payouts/${po_id}/mark-paid"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [ { line_ref: "P-T1", reported_amount_cents: 140000 } ] }
              as: AgencyAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /agency/carrier-statements/${st_id}/start-reconciliation"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_id}", entry_type: "BASE" }
              as: AgencyAdmin
              captures: { entry_id: "$.data[0].id" }
            - call: "POST /agency/commission-entries/${entry_id}/resolve-variance"
              payload: { accept_amount_cents: 140000 }
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/tax-forms/generate"
              payload: { tax_year: 2026 }
              as: AgencyAdmin
              captures: { gen_count: "$.data.generated_count" }
            - call: "GET /agency/tax-forms"
              payload: { producer_id: "${w_id}", tax_year: 2026 }
              as: AgencyAdmin
              captures: { form_cash: "$.data[0].cash_basis_total_cents", form_accrual: "$.data[0].accrual_basis_total_cents" }
          assert:
            - "generated_count == 1 (cash basis 90000 >= 60000)"
            - "TaxForm1099.cash_basis_total_cents == 90000"
            - "TaxForm1099.accrual_basis_total_cents == 140000"
            - "cash_basis_total_cents != accrual_basis_total_cents (90000 vs 140000) on identical producer-year data"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (modes (a) and (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: override_cap_binding
        grounds:
          - calculations.override_commission
          - entities.CommissionEntry.fields.entry_type
        distinguishing_aspect: |
          Mode (a): a formula with >= 3 inputs and non-linear interaction. The
          override amount is min(round(12000000 * 1500bps) = 1800000, round(BASE
          6600000 * 2500bps) = 1650000) = 1650000 — the nested min() cap binds —
          and the recipient is selected conditionally on ancestor status
          (nearest ACTIVE upline), so premium, override rate, base commission and
          hierarchy state interact non-linearly.
        test_recipe:
          setup:
            - "Upline U (ACTIVE) and writer W (tier GOLD, upline U); carrier; product; GOLD schedule 5500bps, override 1500bps, advance 12"
            - "DIRECT_BILL policy premium 12000000 effective 2026-08-01 written by W, disclosure DELIVERED"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Upline U", license_number: "LIC-U1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { u_id: "$.data.id" }
            - call: "POST /agency/producers"
              payload: { name: "Writer W", license_number: "LIC-W1", tier: "GOLD", upline_producer_id: "${u_id}", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier O", carrier_code: "CO" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PO", name: "Product O", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "GOLD", commission_rate_bps: 5500, override_rate_bps: 1500, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-O1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured O", billing_type: "DIRECT_BILL", premium_annual_cents: 12000000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { disc_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${disc_id}/deliver"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_id}", entry_type: "OVERRIDE" }
              as: AgencyAdmin
              captures: { ov_amt: "$.data[0].amount_cents", ov_recipient: "$.data[0].producer_id" }
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_id}", entry_type: "BASE" }
              as: AgencyAdmin
              captures: { base_amt: "$.data[0].amount_cents" }
          assert:
            - "BASE entry amount_cents == 6600000"
            - "OVERRIDE entry amount_cents == 1650000 (min(1800000 raw, 1650000 cap) — cap binds, not the raw 1800000)"
            - "OVERRIDE entry producer_id == upline U's id"

      - name: per_entry_rounding_then_sum
        grounds:
          - calculations.statement_reconciliation
          - entities.CarrierStatement.fields.expected_matched_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Each BASE entry is
          round_half_up at creation: 99995 * 5000bps = 49997.5 -> 49998 per entry;
          reconciliation sums the per-entry rounded values (49998 + 49998 =
          99996). The alternative order (sum unrounded products 99995.0 then
          round) yields 99995 — the pinned per-entry-then-sum order is the only
          correct one.
        test_recipe:
          setup:
            - "Producer; carrier; product; STANDARD schedule 5000bps advance 12; two DIRECT_BILL policies P-R1 and P-R2 each premium 99995 effective 2026-08-01, disclosures DELIVERED, both bound"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer R", license_number: "LIC-R1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier R", carrier_code: "CR" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PR", name: "Product R", line_of_business: "HEALTH" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-R1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured R1", billing_type: "DIRECT_BILL", premium_annual_cents: 99995, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol1: "$.data.id" }
            - call: "POST /agency/policies"
              payload: { policy_number: "P-R2", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured R2", billing_type: "DIRECT_BILL", premium_annual_cents: 99995, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol2: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol1}" }
              as: AgencyAdmin
              captures: { d1: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d1}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol2}" }
              as: AgencyAdmin
              captures: { d2: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d2}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol1}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol2}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [ { line_ref: "P-R1", reported_amount_cents: 49998 }, { line_ref: "P-R2", reported_amount_cents: 49998 } ] }
              as: AgencyAdmin
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "POST /agency/carrier-statements/${st_id}/start-reconciliation"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/carrier-statements/${st_id}"
              payload: {}
              as: AgencyAdmin
              captures: { exp_total: "$.data.expected_matched_total_cents", rep_total: "$.data.matched_total_cents" }
          assert:
            - "Each BASE entry amount_cents == 49998 (round_half_up of 49997.5 per entry)"
            - "CarrierStatement.expected_matched_total_cents == 99996 (per-entry-round-then-sum; NOT 99995 from sum-then-round)"
            - "CarrierStatement.matched_total_cents == 99996 and variance_total_cents == 0"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (cycle on different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: policy_grace_cure_cycle
        grounds:
          - state_machines.Policy.ACTIVE_to_GRACE
          - state_machines.Policy.GRACE_to_ACTIVE
          - calculations.delinquency_evaluation
        distinguishing_aspect: |
          Policy has a live cycle ACTIVE -> GRACE -> ACTIVE driven by the clock
          sweep (invoice delinquency) and the cure payment; a purely linear
          pipeline could never return the policy to ACTIVE after GRACE.
        test_recipe:
          setup:
            - "Producer; carrier; product; STANDARD schedule 5000bps advance 12; AGENCY_BILL policy premium 2400000 effective 2026-08-01, disclosure DELIVERED, bound (invoice due 2026-08-31, OPEN)"
            - "Clock advanced to 2026-09-05: invoice -> DELINQUENT, policy -> GRACE"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer G", license_number: "LIC-G1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier G", carrier_code: "CG" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PG", name: "Product G", line_of_business: "PROPERTY_CASUALTY" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-G1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured G", billing_type: "AGENCY_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AgencyAdmin
            - call: "GET /agency/policies/${pol_id}"
              payload: {}
              as: AgencyAdmin
              captures: { grace_status: "$.data.status" }
            - call: "GET /agency/policies/${pol_id}/invoices"
              payload: {}
              as: AgencyAdmin
              captures: { inv_id: "$.data[0].id", inv_status: "$.data[0].status" }
          trigger:
            - call: "POST /agency/premium-invoices/${inv_id}/payments"
              payload: { amount_cents: 2400000 }
              as: AgencyAdmin
            - call: "GET /agency/policies/${pol_id}"
              payload: {}
              as: AgencyAdmin
              captures: { final_status: "$.data.status" }
          assert:
            - "After clock set: Policy.status == GRACE and PremiumInvoice.status == DELINQUENT (entered the cycle)"
            - "After full cure payment: PremiumInvoice.status == PAID and paid_total_cents == 2400000"
            - "Policy.status == ACTIVE again (cycle GRACE -> ACTIVE completed)"
            - "Carrier.trust_balance_cents == 2400000"

      - name: statement_dispute_resume_cycle
        grounds:
          - state_machines.CarrierStatement.RECONCILING_to_DISPUTED
          - state_machines.CarrierStatement.DISPUTED_to_RECONCILING
        distinguishing_aspect: |
          CarrierStatement (a different entity than Policy) loops
          RECONCILING -> DISPUTED -> RECONCILING an unbounded number of times;
          the cycle is the rework loop of statement reconciliation, not a
          payment-cure loop.
        test_recipe:
          setup:
            - "Carrier; a statement (2026-08-01..2026-08-31, empty lines) imported and moved to RECONCILING"
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier D", carrier_code: "CD" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [] }
              as: AgencyAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /agency/carrier-statements/${st_id}/start-reconciliation"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/carrier-statements/${st_id}/dispute"
              payload: {}
              as: AgencyAdmin
              captures: { s1: "$.data.status" }
            - call: "POST /agency/carrier-statements/${st_id}/resume"
              payload: {}
              as: AgencyAdmin
              captures: { s2: "$.data.status" }
            - call: "POST /agency/carrier-statements/${st_id}/dispute"
              payload: {}
              as: AgencyAdmin
              captures: { s3: "$.data.status" }
          assert:
            - "dispute from RECONCILING -> status DISPUTED"
            - "resume -> status RECONCILING (cycle closed)"
            - "second dispute -> status DISPUTED again (cycle repeatable)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: voluntary_cancel_suspends_producer
        grounds:
          - state_machines.Policy.ACTIVE_to_CANCELLED_VOLUNTARY
          - state_machines.CommissionEntry.EXPECTED_to_CHARGED_BACK
          - calculations.producer_balance_recompute
          - state_machines.Producer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain originating from POST /agency/policies/{id}/cancel:
          Policy -> CANCELLED_VOLUNTARY (link 1) causes entry CHARGED_BACK +
          EARNED_ADJUSTMENT + Chargeback PENDING creation (link 2), whose
          chargeback creation causes the producer's pending total to cross
          500000 and flip Producer -> SUSPENDED (link 3). Each link is caused by
          the previous mutation, not by the cancel call directly.
        test_recipe:
          setup:
            - "Producer (no upline); carrier; product; STANDARD schedule 5500bps override 0 advance 12; DIRECT_BILL policy premium 12000000 effective 2026-08-01, disclosure DELIVERED, bound (BASE entry 6600000 EXPECTED)"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer C", license_number: "LIC-C1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier C", carrier_code: "CC" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PC", name: "Product C", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5500, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-C1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured C", billing_type: "DIRECT_BILL", premium_annual_cents: 12000000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies/${pol_id}/cancel"
              payload: { cancel_effective_date: "2027-02-01" }
              as: AgencyAdmin
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
            - call: "GET /agency/chargebacks"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { cb_amt: "$.data[0].amount_cents", cb_status: "$.data[0].status" }
            - call: "GET /agency/producers/${w_id}"
              payload: {}
              as: AgencyAdmin
              captures: { w_status: "$.data.status", w_balance: "$.data.commission_balance_cents" }
          assert:
            - "Policy.status == CANCELLED_VOLUNTARY and cancel_effective_date == 2027-02-01"
            - "Original BASE entry status == CHARGED_BACK (link 2)"
            - "EARNED_ADJUSTMENT entry exists with amount_cents == 3300000 (6 of 12 months earned)"
            - "Chargeback: status == PENDING, amount_cents == 3300000, reason == CANCELLATION_UNEARNED"
            - "Producer.status == SUSPENDED (link 3: pending 3300000 > 500000) and commission_balance_cents == 3300000"

      - name: variance_resolution_chargeback_suspends
        grounds:
          - state_machines.CommissionEntry.VARIANCE_to_MATCHED
          - state_machines.Producer.ACTIVE_to_SUSPENDED
          - calculations.producer_balance_recompute
        distinguishing_aspect: |
          Depth-3 chain originating from a different trigger —
          POST /agency/commission-entries/{id}/resolve-variance: entry
          VARIANCE -> MATCHED (link 1) creates a negative VARIANCE_ADJUSTMENT
          (link 2) which creates a 600000 PENDING chargeback (link 3a) that
          crosses the 500000 threshold and suspends the producer (link 3b).
        test_recipe:
          setup:
            - "Producer; carrier; product; STANDARD schedule 5000bps advance 12; DIRECT_BILL policy P-V1 premium 12000000 effective 2026-08-01, disclosure DELIVERED, bound (BASE entry 6000000 EXPECTED)"
            - "Statement 2026-08-01..2026-08-31 reports 5400000 for P-V1; reconciliation flags VARIANCE (|5400000-6000000| = 600000 > 100)"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer V", license_number: "LIC-V1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier V", carrier_code: "CV" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PV", name: "Product V", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-V1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured V", billing_type: "DIRECT_BILL", premium_annual_cents: 12000000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [ { line_ref: "P-V1", reported_amount_cents: 5400000 } ] }
              as: AgencyAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /agency/carrier-statements/${st_id}/start-reconciliation"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_id}", entry_type: "BASE" }
              as: AgencyAdmin
              captures: { entry_id: "$.data[0].id" }
          trigger:
            - call: "POST /agency/commission-entries/${entry_id}/resolve-variance"
              payload: { accept_amount_cents: 5400000 }
              as: AgencyAdmin
            - call: "GET /agency/commission-entries"
              payload: { policy_id: "${pol_id}", entry_type: "VARIANCE_ADJUSTMENT" }
              as: AgencyAdmin
              captures: { adj_amt: "$.data[0].amount_cents" }
            - call: "GET /agency/chargebacks"
              payload: { producer_id: "${w_id}" }
              as: AgencyAdmin
              captures: { cb_amt: "$.data[0].amount_cents", cb_reason: "$.data[0].reason" }
            - call: "GET /agency/producers/${w_id}"
              payload: {}
              as: AgencyAdmin
              captures: { w_status: "$.data.status", w_balance: "$.data.commission_balance_cents" }
          assert:
            - "Original entry status == MATCHED with amount_cents still 6000000 (entries immutable)"
            - "VARIANCE_ADJUSTMENT entry amount_cents == -600000 (link 2)"
            - "Chargeback PENDING amount_cents == 600000 with reason OVERPAYMENT_VARIANCE (link 3a)"
            - "Producer.status == SUSPENDED (link 3b) and commission_balance_cents == 5400000"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: recovery_on_recovered_chargeback_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.Chargeback.PENDING_to_RECOVERED
        distinguishing_aspect: |
          Category pair (state, business_fiscal): the recovery violates both
          priority-4 state (chargeback already RECOVERED, terminal) and
          priority-9 fiscal (700000 > outstanding 0). Priority 4 wins:
          ERR_INVALID_STATE, never ERR_RECOVERY_EXCEEDS_OUTSTANDING.
        test_recipe:
          setup:
            - "Producer; carrier; product; STANDARD schedule 5000bps advance 12; DIRECT_BILL policy premium 2400000 bound; cancelled effective 2027-02-01 -> Chargeback 600000 PENDING; fully recovered 600000 -> RECOVERED"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer S", license_number: "LIC-S1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier S", carrier_code: "CS" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PS", name: "Product S", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-S1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured S", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/cancel"
              payload: { cancel_effective_date: "2027-02-01" }
              as: AgencyAdmin
            - call: "GET /agency/chargebacks"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { cb_id: "$.data[0].id" }
            - call: "POST /agency/chargebacks/${cb_id}/recoveries"
              payload: { amount_cents: 600000 }
              as: AgencyAdmin
              captures: { cb_status: "$.data.status" }
          trigger:
            - call: "POST /agency/chargebacks/${cb_id}/recoveries"
              payload: { amount_cents: 700000 }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "First recovery left the chargeback RECOVERED (recovered 600000 == amount 600000)"
            - "Second recovery of 700000 returns error_id == ERR_INVALID_STATE with http 409 (state beats business_fiscal ERR_RECOVERY_EXCEEDS_OUTSTANDING)"

      - name: payout_tax_hold_beats_balance
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - endpoints."POST /agency/producers/{producerId}/payouts"
        distinguishing_aspect: |
          Category pair (business_safety, business_fiscal): the payout violates
          both priority-5 safety (tax_form_on_file == false) and priority-9
          fiscal (99999999 > balance 1200000). Priority 5 wins:
          ERR_PRODUCER_TAX_HOLD, never ERR_PAYOUT_EXCEEDS_BALANCE — a different
          category pair than the sibling instance's (state, business_fiscal).
        test_recipe:
          setup:
            - "Producer with tax_form_on_file omitted (defaults false); carrier; product; STANDARD schedule 5000bps advance 12; DIRECT_BILL policy premium 2400000 bound (balance 1200000)"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer H", license_number: "LIC-H1" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id", w_v: "$.data.version" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier H", carrier_code: "CH" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PH", name: "Product H", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-H1", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured H", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/producers/${w_id}/payouts"
              payload: { amount_cents: 99999999, expected_producer_version: "${w_v}" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PRODUCER_TAX_HOLD (business_safety, priority 5) with http 409"
            - "NOT ERR_PAYOUT_EXCEEDS_BALANCE even though 99999999 > commission_balance_cents 1200000"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: form_1099_threshold_exact_60000
        grounds:
          - calculations.producer_compensation_1099
          - validations[priority=1]
        distinguishing_aspect: |
          Numeric threshold metric: cash-basis year total >= 60000 generates a
          form. Producer A paid exactly 60000 gets a DRAFT form; producer B paid
          59999 does not. Exercised via POST /agency/tax-forms/generate.
        test_recipe:
          setup:
            - "Producers A and B, both tax_form_on_file=true; carrier; product; STANDARD schedule 5000bps advance 12"
            - "Each binds a DIRECT_BILL policy premium 2400000 (BASE entry 1200000 each); A receives payout 60000 PAID, B receives payout 59999 PAID (all at clock default, tax year 2026)"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer 9A", license_number: "LIC-9A", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { a_id: "$.data.id", a_v: "$.data.version" }
            - call: "POST /agency/producers"
              payload: { name: "Writer 9B", license_number: "LIC-9B", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { b_id: "$.data.id", b_v: "$.data.version" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier 9", carrier_code: "C9" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "P9", name: "Product 9", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-9A", product_id: "${p_id}", producer_id: "${a_id}", insured_name: "Insured 9A", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_a: "$.data.id" }
            - call: "POST /agency/policies"
              payload: { policy_number: "P-9B", product_id: "${p_id}", producer_id: "${b_id}", insured_name: "Insured 9B", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_b: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_a}" }
              as: AgencyAdmin
              captures: { da: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${da}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_b}" }
              as: AgencyAdmin
              captures: { db: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${db}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_a}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_b}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/producers/${a_id}/payouts"
              payload: { amount_cents: 60000, expected_producer_version: "${a_v}" }
              as: AgencyAdmin
              captures: { poa: "$.data.id" }
            - call: "POST /agency/payouts/${poa}/mark-paid"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/producers/${b_id}/payouts"
              payload: { amount_cents: 59999, expected_producer_version: "${b_v}" }
              as: AgencyAdmin
              captures: { pob: "$.data.id" }
            - call: "POST /agency/payouts/${pob}/mark-paid"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/tax-forms/generate"
              payload: { tax_year: 2026 }
              as: AgencyAdmin
              captures: { gen_count: "$.data.generated_count" }
            - call: "GET /agency/tax-forms"
              payload: { producer_id: "${b_id}", tax_year: 2026 }
              as: AgencyAdmin
            - call: "GET /agency/tax-forms"
              payload: { producer_id: "${a_id}", tax_year: 2026 }
              as: AgencyAdmin
              captures: { a_cash: "$.data[0].cash_basis_total_cents" }
          assert:
            - "generated_count == 1 (exactly one producer crosses the threshold)"
            - "Producer A form cash_basis_total_cents == 60000 (>= 60000 generates)"
            - "Producer B form list is empty (59999 < 60000 does NOT generate; total_count == 0)"

      - name: statement_close_zero_unresolved_boundary
        grounds:
          - state_machines.CarrierStatement.RECONCILING_to_RECONCILED
          - errors[ERR_UNMATCHED_STATEMENT_LINES]
        distinguishing_aspect: |
          Empty-collection count metric on a different endpoint: close requires
          the unresolved-line count to be exactly 0. With 1 ORPHAN line it fails
          with ERR_UNMATCHED_STATEMENT_LINES; after waiving that single line the
          count hits 0 and the same close succeeds.
        test_recipe:
          setup:
            - "Producer; carrier; product; STANDARD schedule 5000bps advance 12; DIRECT_BILL policy P-Z1 premium 2400000 bound (entry 1200000)"
            - "Statement 2026-08-01..2026-08-31 with lines [{P-Z1, 1200000}, {GHOST-1, 5000}]; reconciliation: line 1 MATCHED, line 2 ORPHAN"
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Writer Z", license_number: "LIC-Z1", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier Z", carrier_code: "CZ" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
