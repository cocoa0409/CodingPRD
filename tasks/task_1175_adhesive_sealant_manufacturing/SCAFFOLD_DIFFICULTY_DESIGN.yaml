            - "dedupe: after R2 submit (on_hand 40, still < 100) the same filtered list still has total_count == 1 (no second draft while one is open)"
            - "ConsignmentStock after R2 submit: qty_consumed == 260 AND qty_on_hand == 40"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — (state vs business_fiscal) and
  # (business_safety vs business_temporal). Different category pairs.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resume_dual_failure_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.ConsignmentAgreement.SUSPENDED_to_ACTIVE
          - errors[ERR_AGREEMENT_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: resume on a DRAFT agreement
          violates the state precondition AND would breach the distributor's
          credit limit (700000 + 400000 > 1000000). The state error wins
          (priority 5 < 10), so the response is 409 ERR_AGREEMENT_INVALID_STATE,
          never 402.
        test_recipe:
          setup:
            - "Distributor with credit_limit 1000000; agreement A1 (700000) ACTIVE; agreement A2 (400000) still DRAFT"
          setup_api_calls:
            - call: "POST /api/distributors"
              payload: { name: "Dist CF", credit_limit_cents: 1000000, contact_email: "c@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/formulations"
              payload: { code: "EPX-CF-1", name: "Epx CF", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/consignment-agreements"
              payload: { distributor_id: "${dist_id}", formulation_id: "${form_id}", unit_price_cents: 1000, max_consigned_value_cents: 700000, reorder_threshold_units: 10, reorder_qty_units: 50 }
              as: CommercialManager
              captures: { ag1: $.data.id }
            - call: "POST /api/consignment-agreements/${ag1}/activate"
              payload: {}
              as: CommercialManager
            - call: "POST /api/consignment-agreements"
              payload: { distributor_id: "${dist_id}", formulation_id: "${form_id}", unit_price_cents: 1000, max_consigned_value_cents: 400000, reorder_threshold_units: 10, reorder_qty_units: 50 }
              as: CommercialManager
              captures: { ag2: $.data.id }
          trigger:
            - call: "POST /api/consignment-agreements/${ag2}/resume"
              payload: {}
              as: CommercialManager
          assert:
            - "trigger returns http 409 with error_id == ERR_AGREEMENT_INVALID_STATE (state, priority 5)"
            - "the error is NOT ERR_CREDIT_LIMIT_EXCEEDED (402) even though 700000 + 400000 = 1100000 > 1000000 also holds"
            - "ConsignmentAgreement.${ag2}.status == DRAFT (unchanged)"

      - name: confirm_dual_failure_safety_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Shipment.PLANNED_to_CONFIRMED
          - errors[ERR_HAZMAT_MODE_FORBIDDEN]
          - errors[ERR_MIN_SHELF_LIFE_VIOLATION]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal (different pair
          than the state-vs-fiscal instance): one shipment line is BOTH
          hazmat-forbidden for AIR (PG_II drum of 200000 ml) AND short-dated
          (89 < 90 remaining days at ship_date). The safety error wins
          (priority 6 < 7): 422 ERR_HAZMAT_MODE_FORBIDDEN.
        test_recipe:
          setup:
            - "Released DRUM lot of a PG_II formulation (solvent 30, flash 20), manufactured 2026-05-01, expiry 2026-11-01, min remaining 90 days; one AIR shipment with ship_date 2026-08-04 (89 days remaining) is PLANNED with that line"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "SLV-ST-1", name: "Slv ST", chemistry_family: "ACRYLIC", moisture_sensitive: false, solvent_content_pct: 30.0, flash_point_c: 20.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-ST-1", capacity_liters: 1000 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 500000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "DRUM", unit_volume_ml: 200000, planned_units: 2, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - call: "POST /api/cure-tests/${t1}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/production-lots/${lot_id}/release"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/distributors"
              payload: { name: "Dist ST", credit_limit_cents: 1000000, contact_email: "s@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { shipment_kind: "SALE", distributor_id: "${dist_id}", transport_mode: "AIR", ship_date: "2026-08-04" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /api/shipments/${ship_id}/lines"
              payload: { lot_id: "${lot_id}", units: 1 }
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_id}/plan"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /api/shipments/${ship_id}/confirm"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "trigger returns http 422 with error_id == ERR_HAZMAT_MODE_FORBIDDEN (safety, priority 6)"
            - "the error is NOT ERR_MIN_SHELF_LIFE_VIOLATION even though remaining_days == 89 < 90 also holds"
            - "Shipment.${ship_id}.status == PLANNED (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — elapsed-minutes pot-life boundary on run
