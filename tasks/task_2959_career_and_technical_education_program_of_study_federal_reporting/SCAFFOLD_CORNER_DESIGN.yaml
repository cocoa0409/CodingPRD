      - name: the_higher_priority_rule_wins_a_dual_failure_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=39]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pos_not_approved_state_rule_beats_grant_funds_exceeded_fiscal_rule
          rationale: "That instance stages a request that violates both rules at once and shows only the priority-10 error, then repairs the state rule to reveal the priority-39 error underneath."

      - name: a_safety_rule_outranks_a_fiscal_rule_on_the_same_request
        claim_type: priority_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=39]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_safety_rule_beats_grant_funds_exceeded_fiscal_rule
          rationale: "That instance uses the same over-capacity line certified by its own requester, so both rules fire and the safety rule must be the one reported."

