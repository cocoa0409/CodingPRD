  # =========================================================================
  # RULE 6 - boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: showing_of_interest_exactly_thirty_percent
        grounds:
          - calculations.showing_of_interest_ratio.boundaries
          - constants.SHOWING_OF_INTEREST_THRESHOLD_PCT
          - state_machines.Petition.SOI_VERIFIED_to_SOI_VERIFIED
        boundary_kind: inclusive_threshold_and_two_decimal_rounding
        distinguishing_aspect: |
          The 30% statutory showing is tested at the exact equality point on the AS_RULED base of 90:
          27 valid cards is 30.00 and must be SUFFICIENT (the comparison is >=), while 26 valid cards
          is 28.888... which must round HALF_UP to 28.89 and fail. One card decides the case.
        test_recipe:
          setup:
            - "petition SCOPE_ANALYSIS with PROD 60 and MAINT 30 both ruled INCLUDED, so the denominator is the AS_RULED base of 90"
            - "no classification left PENDING, so the AS_PETITIONED variant is not selected"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330061", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: LaborRelationsDirector
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_maint_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Core production group" }
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_maint_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Integrated with production" }
              as: BoardAgent
          trigger:
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: { submitted_card_count: 33, duplicate_card_count: 3, undated_card_count: 1, stale_card_count: 1, nonunit_card_count: 1 }
              as: BoardAgent
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: { submitted_card_count: 32, duplicate_card_count: 3, undated_card_count: 1, stale_card_count: 1, nonunit_card_count: 1 }
              as: BoardAgent
          assert:
            - "after the first call: Petition.${pet_id}.valid_card_count == 27"
            - "after the first call: Petition.${pet_id}.showing_of_interest_pct == 30.00 exactly (27 * 100 / 90)"
            - "after the first call: Petition.${pet_id}.showing_headcount_basis == AS_RULED and showing_verdict == SUFFICIENT"
            - "after the first call: Petition.${pet_id}.case_status == SOI_VERIFIED"
            - "after the second call: Petition.${pet_id}.valid_card_count == 26 and showing_of_interest_pct == 28.89 (26 * 100 / 90 = 28.888... ROUND_HALF_UP)"
            - "after the second call: Petition.${pet_id}.showing_verdict == INSUFFICIENT and case_status == DISMISSED"
            - "NOT 28.88 (truncation) and NOT 29.00 (rounding to whole percent)"

      - name: coi_per_term_rounding_versus_sum_then_round
        grounds:
          - calculations.community_of_interest_score.precision
          - calculations.core_wage_snapshot.precision
          - constants.TRADITIONAL_CONTESTED_BAND
        boundary_kind: per_term_rounding_order
        distinguishing_aspect: |
          A rounding-ORDER boundary rather than a threshold boundary: each weighted term is rounded
          HALF_UP to 2 decimals before the sum, which yields 50.68 for the QC classification. Summing
          the unrounded terms and rounding once yields 50.66, and recomputing the frozen core wage
          from the ruled unit instead of reading the snapshot yields 50.08. All three land in the same
          recommendation band, so only the number itself catches the error.
        test_recipe:
          setup:
            - "petition SCOPE_ANALYSIS with PROD 60 @ 2400 and MAINT 30 @ 3200 (both positions INCLUDE) and QC 12 @ 2900 (employer EXCLUDE, union INCLUDE)"
            - "the first score call on PROD freezes core_avg_hourly_wage_cents at 2667"
            - "QC factors: supervision 41, skills 55, functional integration 61, interchange 21, work conditions 71, supervisory_authority_count 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T10:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330062", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: LaborRelationsDirector
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "QC", title: "Quality Inspector", headcount: 12, avg_hourly_wage_cents: 2900, shift_code: "B", work_location: "PLANT_1_LAB", supervisory_authority_count: 0, employer_position: "EXCLUDE", union_position: "INCLUDE", supervision_overlap: 41, skills_overlap: 55, functional_integration: 61, interchange_rate: 21, work_conditions_overlap: 71 }
              as: LaborRelationsDirector
              captures: { cls_qc_id: $.data.id }
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Core production group" }
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_maint_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_maint_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Integrated with production" }
              as: BoardAgent
          trigger:
            - call: "POST /labor-relations/classifications/${cls_qc_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
          assert:
            - "Petition.${pet_id}.core_avg_hourly_wage_cents == 2667 and core_wage_locked_at == 2026-08-04T10:00:00Z"
            - "Classification.${cls_qc_id}.wage_proximity == 91.26 (|2900 - 2667| / 2667 = 8.7364% -> gap 8.74)"
            - "Classification.${cls_qc_id}.coi_score == 50.68 (13.33 + 12.38 + 10.68 + 2.63 + 7.10 + 4.56)"
            - "NOT 50.66 (summing unrounded terms and rounding once)"
            - "NOT 50.08 (recomputing the core wage as 2400 from the ruled unit instead of reading the frozen snapshot)"
            - "Classification.${cls_qc_id}.coi_recommendation == CONTESTED_COMMUNITY (50.68 is at or above TRADITIONAL_CONTESTED_BAND 45 and below TRADITIONAL_SHARED_BAND 65)"
            - "Classification.${cls_prod_id}.coi_score == 88.20 and Classification.${cls_maint_id}.coi_score == 79.28 (both scored against the same frozen 2667)"

      - name: risk_score_escalation_threshold_seventy
        grounds:
          - calculations.campaign_risk_score.boundaries
          - constants.RISK_ESCALATION_THRESHOLD
          - validations[priority=15]
        boundary_kind: inclusive_threshold_on_integer_score
        distinguishing_aspect: |
          An integer threshold with an inclusive comparison, on a different calculation from the SOI
          boundary: 70 exactly demands escalation_ack and 69 does not. The 69 case is built from a
          different channel and a different term mix (including the "first unsupported claim is free"
          offset), so an implementation cannot pass by hard-coding either total.
        test_recipe:
          setup:
            - "petition SCOPE_ANALYSIS with one TRAINED presenter and no ElectionRound (so no per-se blackout can interfere)"
            - "message HI: SMALL_GROUP_MEETING, CLASSIFICATION scope, 2 threat statements, interrogation, surveillance reference -> 20 + 30 + 12 + 8 = 70"
            - "message LO: CAPTIVE_AUDIENCE_MEETING, CLASSIFICATION scope, 1 threat statement, interrogation, 3 unsupported of 4 material claims -> 30 + 15 + 12 + 12 = 69"
