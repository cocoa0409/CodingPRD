            - call: "GET /recycling/facilities/${fac_id}/capacity-projection"
              payload: { horizon_days: 20 }
              as: PlantOperator
              captures: { baseline_after: "$.data.baseline_kg_per_day", projected_after: "$.data.projected_input_kg", dday_after: "$.data.first_deficit_day", ddate_after: "$.data.first_deficit_date", dkg_after: "$.data.deficit_kg" }
          assert:
            - "${baseline_before} == 100.000 and ${projected_before} == 2084.000"
            - "${man3_status} == REJECTED, ${i3_cust} == QUARANTINED and ${i3_hold} == MANIFEST_REJECTED"
            - "${baseline_after} == 66.667 == round_half_up(2000.0 / 30, 3) - only the two non-quarantined intakes remain in the input set"
            - "${projected_after} == 1389.340 - sum over d=1..20 of round_half_up(66.667 * (1 + 0.004*d), 3)"
            - "${dday_after} == null and ${ddate_after} == null because the largest projected day, 72.000 at d == 20, never exceeds the 105.0 mech ceiling"
            - "${dkg_after} == 0.0 when there is no deficit day"

