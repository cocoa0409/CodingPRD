        grounds: ["validations[priority=18]", "errors[ERR_UNRESOLVED_MAKE_GOODS]"]
        distinguishing_aspect: "LOCK is refused while a PROPOSED make-good exists on a report whose period overlaps the reconciliation period; after REJECT the same LOCK succeeds."
        test_recipe:
          setup: ["LIVE line item with snapshot 1000/10; IVT-breach report [2026-08-01, 2026-08-07] with PROPOSED make-good; reconciliation [2026-08-01, 2026-08-10) RECONCILED by bm-1"]
