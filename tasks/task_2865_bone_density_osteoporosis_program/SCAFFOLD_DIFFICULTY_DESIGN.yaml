              as: ProgramAdmin
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-2301", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
