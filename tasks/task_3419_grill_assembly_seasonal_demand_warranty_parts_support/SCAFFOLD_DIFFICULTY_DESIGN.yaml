  - rule_id: resource_temporal_overlap
    instances:
      - name: in_home_jobs_require_travel_buffer
        grounds:
          - state_machines.AssemblyJob.REQUESTED_to_SCHEDULED
          - errors[ERR_ASSEMBLER_BUFFER_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = BUFFER-PADDED overlap on the Assembler resource:
          a new IN_HOME job's window is padded by +/- TRAVEL_BUFFER_MINUTES
          (45) before the half-open overlap test, so a job starting 30 minutes
          after the previous one ends still conflicts, while 45 minutes exactly
          passes. RETAIL_ASSEMBLY jobs would not be padded — the padding is
          conditional on the new job's type.
