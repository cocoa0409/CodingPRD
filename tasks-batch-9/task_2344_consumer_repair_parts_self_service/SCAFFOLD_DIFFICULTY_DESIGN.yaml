              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2024-03-01T00:00:00Z", effective_until: "2025-01-01T00:00:00Z", self_service_eligible: true, install_minutes: 25 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { compat1: $.data.id }
          trigger:
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2024-12-01T00:00:00Z", self_service_eligible: true, install_minutes: 25 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2025-01-01T00:00:00Z", self_service_eligible: true, install_minutes: 25 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { compat3: $.data.id }
          assert:
            - "${err} == ERR_COMPATIBILITY_WINDOW_OVERLAP"
            - "the overlapping attempt returns HTTP 409"
            - "${compat3} is created with HTTP 201 because [2025-01-01, open) only abuts [2024-03-01, 2025-01-01)"
            - "PartModelCompatibility.${compat1}.effective_until == 2025-01-01T00:00:00Z (untouched)"
            - "GET /repair-program/part-catalog-items/${part_id}/part-compatibilities returns exactly 2 rows"

  - rule_id: compensating_invariant
    instances:
      - name: order_cancellation_restores_the_core_liability_ledger_identity
        grounds:
          - calculations.core_liability_conservation
          - state_machines.PartsOrder.CONFIRMED_to_CANCELLED
          - errors[ERR_CORE_LEDGER_INVARIANT]
        distinguishing_aspect: |
          The conserved quantity is committed core money on a PartCatalogItem
          (outstanding + settled + forfeited == committed): cancelling a CONFIRMED order must
          remove the 5000-cent face value from BOTH committed and outstanding, leaving all four
          aggregates at 0 rather than parking it in forfeited.
        test_recipe:
          setup:
            - "Region profile US-CA exists; ProductModel CRX-9700 is TIER_A_SELF_SERVICE with a PUBLISHED DISASSEMBLY_GUIDE carrying 2 safety warnings."
            - "PUBLISHED UNRESTRICTED COMPONENT part SKU-CORE-MOD lists at 8000 cents with core_return_required true and core_credit_cents 2500."
            - "A consumer order holds 2 units of that part, has been acknowledged and CONFIRMED, so core_return_status is PENDING_CORE, core_credit_provisional_cents is 5000, and the part shows committed 5000 / outstanding 5000 / settled 0 / forfeited 0."
