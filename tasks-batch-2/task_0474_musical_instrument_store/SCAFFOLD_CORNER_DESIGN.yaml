        distinguishing_aspect: "Buyout with amount_cents != payoff_quote_cents (paying 100000 when quote is 110000) -> ERR_PAYOFF_MISMATCH (422); agreement stays ACTIVE."
        test_recipe:
          setup: ["RENT_TO_OWN agreement A on unit U, 3 months paid (payoff 110000), ACTIVE."]
