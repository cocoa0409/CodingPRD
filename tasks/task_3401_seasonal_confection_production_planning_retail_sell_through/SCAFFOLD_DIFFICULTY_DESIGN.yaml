          assert:
            - "the first start returns 409 and err_start == ERR_INVALID_STATE (program OPEN_FOR_COMMITMENTS is not in {LOCKED, IN_PRODUCTION})"
            - "ProductionRun.${run_id}.status remains SCHEDULED after the rejection"
            - "after advancing the program to LOCKED, the identical start returns 200 and status == IN_PROGRESS"

      - name: heat_claim_requires_shipment_delivered
        grounds:
          - state_machines.HeatClaim
          - state_machines.Shipment.PLANNED_to_DELIVERED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "HeatClaim -> Shipment pair: filing against a PLANNED shipment fails ERR_INVALID_STATE; after deliver, the identical claim body succeeds and lands in UNDER_REVIEW via the automatic FILED -> UNDER_REVIEW hop."
        test_recipe:
          setup:
            - "Program in SHIPPING; GOLD commitment 10 ALLOCATED; one 5-unit PLANNED shipment."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_retailer_gold
            - *k_wh
            - *k_prod_seas
            - *k_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 10, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - *k_submit_gold
            - *k_confirm_gold
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 10, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - *k_clock_0215
            - *k_g2
            - *k_adv_lock
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - *k_clock_0306
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 10, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - *k_g4
            - *k_adv_inprod
            - *k_clock_0715
            - *k_g5
            - *k_adv_ship
            - call: "POST /confection/shipments"
              payload: { commitment_id: "${c_gold}", warehouse_id: "${wh_id}", units: 5, ship_on: "2027-08-02T00:00:00Z", temp_controlled: true }
              as: LogisticsCoordinator
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /confection/heat-claims"
              payload: { shipment_id: "${sh_id}", claimed_units: 2, reason: "BLOOM", evidence_note: "whitened surface on arrival" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { err_claim: $.data.error_id }
            - *k_clock_0720
            - call: "POST /confection/shipments/${sh_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /confection/heat-claims"
              payload: { shipment_id: "${sh_id}", claimed_units: 2, reason: "BLOOM", evidence_note: "whitened surface on arrival" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { cl_id: $.data.id }
          assert:
            - "the first claim create returns 409 and err_claim == ERR_INVALID_STATE (shipment PLANNED)"
            - "after deliver, the identical payload returns 201 and HeatClaim.${cl_id}.status == UNDER_REVIEW (FILED auto-advanced in the same request)"
            - "Shipment.${sh_id}.status == DELIVERED and delivered_on == 2027-08-02T00:00:00Z (the logical clock at deliver time)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_changeover_requires_exact_eight_hour_gap_on_kind_switch
        grounds:
          - calculations.production_line_conflict_check
          - endpoints.POST_/confection/production-runs
          - errors.ERR_CHANGEOVER_VIOLATION
        distinguishing_aspect: "Buffered-interval semantics on the line resource: a kind switch EVERYDAY->SEASONAL needs prior_end + 8h, and gap == exactly 8h passes (inclusive) while gap == 1 second fails with ERR_CHANGEOVER_VIOLATION."
        test_recipe:
          setup:
            - "Program OPEN; LINE-1 holds run A (EVERYDAY, 2027-03-01T08:00 -> 2027-03-05T08:00) and run B (SEASONAL, 2027-03-05T16:00 -> 2027-03-06T08:00) — B accepted at exactly the 8h buffer."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_prod_seas
            - &k_prod_every
              call: "POST /confection/products"
              payload: { program_id: null, sku_code: "EV-BAR-0125", kind: "EVERYDAY", molded_shape: "standard-bar", brand_protected: false, requires_temp_control: false, units_per_case: 48 }
              as: PlatformAdmin
              captures: { prod_ev: $.data.id }
            - call: "POST /confection/production-runs"
              payload: { program_id: null, product_id: "${prod_ev}", line_code: "LINE-1", planned_units: 500, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-05T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_a: $.data.id }
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-1", planned_units: 300, scheduled_start_on: "2027-03-05T16:00:00Z", scheduled_end_on: "2027-03-06T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_b: $.data.id }
          trigger:
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-1", planned_units: 200, scheduled_start_on: "2027-03-05T08:00:01Z", scheduled_end_on: "2027-03-05T14:00:00Z" }
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "run B returned 201: gap 2027-03-05T08:00 -> 16:00 is exactly CHANGEOVER_HOURS 8 and the buffer is inclusive-satisfied"
            - "run C returns 422 and error_id == ERR_CHANGEOVER_VIOLATION (gap of 1 second after A's end on a kind switch)"
            - "error_id != ERR_LINE_SCHEDULE_OVERLAP — C's interval intersects neither A nor B; the changeover rule is what fires"
            - "GET /confection/production-runs?line_code=LINE-1 returns exactly 2 rows (A and B); C was not persisted"

      - name: warehouse_capacity_rejects_completion_that_would_overflow
        grounds:
          - calculations.warehouse_load_and_posture
          - endpoints.POST_/confection/production-runs/{id}/complete
          - errors.ERR_WAREHOUSE_FULL
        distinguishing_aspect: "Aggregate-capacity semantics on the warehouse resource (not interval adjacency): in_use 950 + incoming 100 = 1050 > 1000 rejects with ERR_WAREHOUSE_FULL even though posture is still only CONGESTED — the arithmetic guard, not the posture label, decides."
        test_recipe:
          setup:
            - "W1 capacity 1000 holding 950 units (CONGESTED); one IN_PROGRESS EVERYDAY run of 100 units targeting W1."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_wh
            - *k_prod_seas
            - *k_prod_every
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 950, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-05T08:00:00Z" }
              as: ProductionPlanner
              captures: { run1_id: $.data.id }
            - *k_clock_0215
            - *k_g2
            - *k_adv_lock
            - call: "POST /confection/production-runs/${run1_id}/start"
              payload: {}
              as: ProductionPlanner
            - *k_clock_0306
            - call: "POST /confection/production-runs/${run1_id}/complete"
              payload: { produced_units: 950, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - call: "POST /confection/production-runs"
              payload: { program_id: null, product_id: "${prod_ev}", line_code: "LINE-B", planned_units: 100, scheduled_start_on: "2027-03-10T08:00:00Z", scheduled_end_on: "2027-03-11T08:00:00Z" }
              as: ProductionPlanner
              captures: { run2_id: $.data.id }
            - call: "POST /confection/production-runs/${run2_id}/start"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /confection/production-runs/${run2_id}/complete"
              payload: { produced_units: 100, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_WAREHOUSE_FULL (950 + 100 = 1050 > 1000)"
            - "Warehouse.${wh_id}.in_use_units stays 950 and posture stays CONGESTED (no partial lot is created)"
            - "ProductionRun.${run2_id}.status remains IN_PROGRESS (the failed complete leaves no residue)"
            - "run2 is EVERYDAY, so the CONGESTED-seasonal gate does not apply — only the aggregate arithmetic rejects it"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: shipment_create_then_pull_cancel_restores_lot_units_unchanged
        grounds:
          - state_machines.Shipment.PLANNED_to_CANCELLED
          - state_machines.SeasonalProgram.ON_SHELF_to_DISPOSITION
          - entities.InventoryLot.fields.units_on_hand
        distinguishing_aspect: "Conserved physical-unit quantity: on_hand + delivered + disposed == produced must hold across the create-then-cancel pair — with 20 DELIVERED and 30 PLANNED-then-CANCELLED, the lot ends at 80 and 80 + 20 + 0 == 100."
        test_recipe:
          setup:
            - "Program ON_SHELF; GOLD commitment 60 ALLOCATED; lot of 100 at W1 drawn by shipment1 (20 units, DELIVERED) and shipment2 (30 units, still PLANNED); clock at pull_on."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_retailer_gold
            - *k_wh
            - *k_prod_seas
            - *k_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 60, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - *k_submit_gold
            - *k_confirm_gold
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 100, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-05T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - *k_clock_0215
            - *k_g2
            - *k_adv_lock
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - *k_clock_0306
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 100, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - *k_g4
            - *k_adv_inprod
            - *k_clock_0715
            - *k_g5
            - *k_adv_ship
            - call: "POST /confection/shipments"
              payload: { commitment_id: "${c_gold}", warehouse_id: "${wh_id}", units: 20, ship_on: "2027-08-02T00:00:00Z", temp_controlled: true }
              as: LogisticsCoordinator
              captures: { sh1_id: $.data.id }
            - *k_clock_0720
            - call: "POST /confection/shipments/${sh1_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /confection/shipments"
              payload: { commitment_id: "${c_gold}", warehouse_id: "${wh_id}", units: 30, ship_on: "2027-08-03T00:00:00Z", temp_controlled: true }
              as: LogisticsCoordinator
              captures: { sh2_id: $.data.id }
            - call: "GET /confection/inventory-lots"
              payload: { production_run_id: "${run_id}" }
              as: PlatformAdmin
              captures: { lot_id: "$.data[0].id" }
            - *k_clock_0920
            - *k_g6
            - *k_adv_onshelf
            - *k_clock_1115
            - *k_g7
          trigger:
            - call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "DISPOSITION", expected_program_version: "${pv7}" }
              as: PlatformAdmin
          assert:
            - "before the advance: lot.units_on_hand == 50 (100 - 20 delivered - 30 planned)"
            - "after the advance: InventoryLot.${lot_id}.units_on_hand == 80 (the CANCELLED 30 restore; the DELIVERED 20 do not)"
            - "conservation holds: units_on_hand 80 + DELIVERED 20 + disposed 0 == produced_units_total 100"
            - "Shipment.${sh1_id}.status == DELIVERED (untouched) and Shipment.${sh2_id}.status == CANCELLED"
            - "SeasonalProgram.${prog_id}.shipped_units_total == 20 (only the DELIVERED leg remains in the shipped set)"

      - name: run_create_then_cancel_leaves_line_scheduled_hours_unchanged
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_CANCELLED
          - calculations.production_line_conflict_check
          - endpoints.POST_/confection/production-runs/{id}/cancel
        distinguishing_aspect: "Conserved schedule-time quantity on a line: creating a 24h run then cancelling it returns LINE-9's non-CANCELLED scheduled total to exactly its 96h baseline, and the cancelled run drops out of overlap checks (a replacement run reuses its slot)."
        test_recipe:
          setup:
            - "Program OPEN; LINE-9 holds exactly one run R1 (EVERYDAY, 2027-03-01T08:00 -> 2027-03-05T08:00 = 96h)."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_prod_every
            - call: "POST /confection/production-runs"
              payload: { program_id: null, product_id: "${prod_ev}", line_code: "LINE-9", planned_units: 500, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-05T08:00:00Z" }
              as: ProductionPlanner
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /confection/production-runs"
              payload: { program_id: null, product_id: "${prod_ev}", line_code: "LINE-9", planned_units: 100, scheduled_start_on: "2027-03-10T08:00:00Z", scheduled_end_on: "2027-03-11T08:00:00Z" }
              as: ProductionPlanner
              captures: { run2_id: $.data.id }
            - call: "POST /confection/production-runs/${run2_id}/cancel"
              payload: {}
              as: ProductionPlanner
            - call: "POST /confection/production-runs"
              payload: { program_id: null, product_id: "${prod_ev}", line_code: "LINE-9", planned_units: 50, scheduled_start_on: "2027-03-10T08:00:00Z", scheduled_end_on: "2027-03-10T12:00:00Z" }
              as: ProductionPlanner
              captures: { run3_id: $.data.id }
          assert:
            - "before R2: GET /confection/production-runs?line_code=LINE-9 has exactly 1 non-CANCELLED row totalling 96 scheduled hours"
            - "after R2 create: the same list totals 96 + 24 == 120 hours over 2 rows"
            - "after R2 cancel: the non-CANCELLED total returns to exactly 96 hours — the create+cancel pair conserves scheduled line-hours"
            - "R3 reusing R2's cancelled slot returns 201 (CANCELLED runs are excluded from overlap and changeover checks)"
            - "ProductionRun.${run2_id}.status == CANCELLED and ProductionRun.${run1_id}.status == SCHEDULED"
