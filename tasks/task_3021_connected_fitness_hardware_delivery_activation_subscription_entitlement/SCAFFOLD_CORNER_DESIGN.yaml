              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { ce1: $.data.id }
            - call: "POST /fitness/memberships/${m_id}/household-users"
              payload: { display_name: "Bea Quillon", email: "bea@x.com", role: "MEMBER" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { u_bea: $.data.id, tok_bea: $.data.verification_token }
            - call: "POST /fitness/household-users/${u_bea}/verify"
              payload: { verification_token: "${tok_bea}" }
              as: Anonymous
            - call: "POST /fitness/class-enrollments"
              payload: { class_session_id: "${s_id}", device_id: "${d_id}", enroller_user_id: "${u_bea}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { ce2: $.data.id }
            - call: "POST /fitness/class-enrollments"
              payload: { class_session_id: "${s_id}", device_id: "${d_id}", enroller_user_id: "${u_ada}" }
