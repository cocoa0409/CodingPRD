  - section: cross_cutting_complexity_layers
    instances:
      - name: fee_schedule_publish_rejects_a_stale_expected_pro_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.fee-schedule-publish-stale-pro
          - validations.priority_12.check
          - errors.ERR_STALE_PRO_VERSION
        distinguishing_aspect: "The Pro version consumed by the first publish makes the second publish's expected_pro_version stale, so it returns 412 ERR_STALE_PRO_VERSION; re-reading the Pro and resending the same publish succeeds, and the failed attempt never advanced Pro.version."
        test_recipe:
          setup:
            - "One CA program, one PRO and two fee schedules on disjoint closed windows."
          setup_api_calls:
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "ENTITY_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 1000000, small_producer_tonnage_threshold_kg: 1.000, exempt_product_categories: [], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              captures: { sp_c_id: $.data.id }
            - call: "POST /epr/pros"
              payload: { name: "Concurrency Stewardship", contact_email: "ops@occ.example" }
              as: ProgramRegulator
              captures: { pro_c_id: $.data.id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_c_id}", state_program_id: "${sp_c_id}", effective_from: "2026-01-01", effective_to: "2026-06-30", membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 9 }] }
              as: ProAdministrator
