              as: Reseller
              as_user_id: "${rs_id}"
            - call: "POST /reseller-agreements/${ag_id}/activate"
              payload: {}
              as: BrandChannelManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "MARKETPLACE", marketplace_name: "BigMarket", seller_display_name: "Echo Retail", listing_url: "https://bigmarket.example/echo/monitor-1", listed_price_cents: 8000, observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", matched_reseller_id: "${rs_id}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs_id: $.data.id }
            - call: "POST /price-observations/${obs_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { v_id: $.data.violation_id, cited_pol: $.data.cited_policy_id }
            - call: "POST /pricing-policies/${pol_id}/withdraw"
              payload: { withdrawn_reason: "Policy pulled pending antitrust re-review." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { pol_status: $.data.status }
            - call: "GET /resellers/${rs_id}"
              payload: {}
              as: BrandChannelManager
              captures: { rs_v: $.data.version }
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v_id}", delivery_channel: "EMAIL", contains_pricing_discussion: true, expected_reseller_version: "${rs_v}" }
              as: BrandChannelManager
              as_user_id: "channel-mgr-1"
