# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task: task_3048_drive_thru_only_coffee_stand_throughput_crew
#
# Two instances per Difficulty Rule (three for combinatorial_formula to cover
# modes a, b and c). Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and
# carries a structured, replayable test_recipe.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: throughput_provisional_projection_diverges_from_final_served_count
        grounds:
          - calculations.throughput_attainment
          - entities.ThroughputWindow.fields.provisional_projected_cars
          - entities.ThroughputWindow.fields.served_count
          - state_machines.ThroughputWindow.OPEN_to_CLOSED_BREACH
        distinguishing_aspect: |
          Same window, same underlying orders: the provisional (forward-looking)
          variant counts in-flight queue and projects 2 cars (== target, "on
          track"), while the final (chronological) variant counts only in-window
          handoffs and lands served_count 1 — a CLOSED_BREACH. Entity domain:
          Order throughput on ThroughputWindow (distinct from the crew-staffing
          domain of the sibling instance).
        test_recipe:
          setup:
            - "Stand OPEN with recipe distributed; throughput window 07:00-08:00 target 2."
            - "One window order fully served (handoff_at inside window); a second window order left MERGED and unpaid."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - &c_region
              call: "POST /regions"
              payload: { name: "Northwest", code: "NW" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - &c_stand
              call: "POST /stands"
              payload: { region_id: "${region_id}", name: "Stand 42", min_ingress_gap_seconds: 45, lane_configs: [{ lane_code: "A", max_stack_cars: 6 }, { lane_code: "B", max_stack_cars: 6 }] }
              as: PlatformAdmin
              captures: { stand_id: $.data.id }
            - &c_approve
              call: "POST /stands/${stand_id}/approve"
              payload: {}
              as: PlatformAdmin
            - &c_op
              call: "POST /crew-members"
              payload: { full_name: "Op One", home_stand_id: "${stand_id}", hired_on: "2024-01-01", food_handler_cert_expires_on: "2027-12-31" }
              as: PlatformAdmin
              captures: { op_id: $.data.id }
            - &c_taker
              call: "POST /crew-members"
              payload: { full_name: "Taker Tim", home_stand_id: "${stand_id}", hired_on: "2025-06-01", food_handler_cert_expires_on: "2027-12-31" }
              as: PlatformAdmin
              captures: { taker_id: $.data.id }
            - &c_lead
              call: "POST /crew-members"
              payload: { full_name: "Lead Lena", home_stand_id: "${stand_id}", hired_on: "2025-06-01", food_handler_cert_expires_on: "2027-12-31" }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - &c_agr
              call: "POST /operator-agreements"
              payload: { stand_id: "${stand_id}", crew_member_id: "${op_id}", revenue_share_pct: 0.30 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { agr_id: $.data.id }
            - &c_agr_ok
              call: "POST /operator-agreements/${agr_id}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - &c_agr_act
              call: "POST /operator-agreements/${agr_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - &c_open
              call: "POST /stands/${stand_id}/open"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - &c_recipe
              call: "POST /recipes"
              payload: { name: "Carmelizer", channel: "CORE", base_price_cents: 450, base_build_seconds: 60, temperature_class: "ICED", modifiers: [{ name: "EXTRA_SHOT", price_cents: 50, build_seconds_adder: 10 }] }
              as: PlatformAdmin
              captures: { recipe_id: $.data.id }
            - &c_dist
              call: "POST /recipe-distributions"
              payload: { recipe_id: "${recipe_id}", stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { dist_id: $.data.id }
            - &c_dist_act
              call: "POST /recipe-distributions/${dist_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - &c_window
              call: "POST /throughput-windows"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T08:00:00Z", target_cars: 2 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { window_id: $.data.id }
            # Order 1: fully served inside the window
            - &c_stand_v
              call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v: $.data.version }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order1_id: $.data.id }
            - call: "GET /order-items"
              payload: { order_id: "${order1_id}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { item1_id: "$.data[0].id" }
            - call: "POST /order-items/${item1_id}/start-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /order-items/${item1_id}/complete-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /orders/${order1_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { pay1_id: $.data.id }
            - call: "POST /orders/${order1_id}/call-to-window"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay1_id}/capture"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:05:00Z" }
              as: PlatformAdmin
            - call: "POST /orders/${order1_id}/handoff"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            # Order 2: created, left MERGED + UNPAID (in-flight at close)
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v2: $.data.version }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v2}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order2_id: $.data.id }
            - call: "GET /throughput-windows/${window_id}"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { projected: $.data.provisional_projected_cars }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /throughput-windows/${window_id}/close"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { close_status: $.data.status, served: $.data.served_count }
          assert:
            - "provisional read before close: ThroughputWindow.${window_id}.provisional_projected_cars == 2 (1 served + 1 in-flight)"
            - "final variant: ThroughputWindow.${window_id}.served_count == 1"
            - "ThroughputWindow.${window_id}.status == CLOSED_BREACH (1 < target 2)"
            - "Stand.${stand_id}.consecutive_breach_windows == 1"
            - "provisional projection 2 != final served_count 1 for identical order data"

      - name: staffing_deficit_provisional_plan_diverges_from_reconciled_actuals
        grounds:
          - calculations.staffing_deficit_score
          - entities.Shift.fields.provisional_deficit_score
          - entities.Shift.fields.reconciled_deficit_score
          - state_machines.Shift.DRAFT_to_PUBLISHED
          - state_machines.Shift.IN_PROGRESS_to_RECONCILED
        distinguishing_aspect: |
          Same shift plan: the provisional (forward-looking) variant scores 0
          over planned assignments, while the reconciled (chronological)
          variant — after one NO_SHOW — scores 15 over actual check-ins. Entity
          domain: crew staffing on Shift (distinct from order throughput).
        test_recipe:
          setup:
            - "Stand OPEN with ACTIVE agreement; non-peak shift 07:00-09:00 with two assignments (LEAD + BAR)."
            - "Shift published (provisional score), started; only the LEAD checks in; reconciled after end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_lead
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - call: "POST /shifts"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", is_peak: false }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { crew_member_id: "${lead_id}", role: "LEAD", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", expected_shift_version: "${shift_v}" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { asg_lead: $.data.id }
            - call: "GET /shifts/${shift_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_v2: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { crew_member_id: "${taker_id}", role: "BAR", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", expected_shift_version: "${shift_v2}" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { asg_bar: $.data.id }
            - call: "POST /shifts/${shift_id}/publish"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { prov_score: $.data.provisional_deficit_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/start"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "POST /shift-assignments/${asg_lead}/check-in"
              payload: {}
              as: CrewMember
              as_user_id: "${lead_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /shifts/${shift_id}/reconcile"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { rec_score: $.data.reconciled_deficit_score }
          assert:
            - "provisional variant: Shift.${shift_id}.provisional_deficit_score == 0 (2 planned == 2 required, LEAD covered)"
            - "reconciled variant: Shift.${shift_id}.reconciled_deficit_score == 15 (max(0, 2-1)*10 + 0 lead present + 1 no-show * 5)"
            - "ShiftAssignment.${asg_bar}.status == NO_SHOW after reconcile"
            - "ShiftAssignment.${asg_lead}.status == CHECKED_IN"
            - "identical plan data yields 0 (provisional) vs 15 (reconciled)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: order_total_rounds_discount_per_line_then_sums
        grounds:
          - calculations.order_total_cents
          - entities.OrderItem.fields.line_discount_cents
          - entities.Order.fields.discount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two 333-cent lines at GOLD 10% — the pinned
          order rounds each line's discount (round_half_up(33.3) = 33 each) then
          sums, giving discount 66 / total 600; the rejected aggregate variant
          (round after summing) would give 67 / 599.
        test_recipe:
          setup:
            - "Stand OPEN; CORE recipe priced 333 cents; loyalty account adjusted to GOLD (500 points)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - call: "POST /recipes"
              payload: { name: "Penny Split", channel: "CORE", base_price_cents: 333, base_build_seconds: 30, temperature_class: "HOT" }
              as: PlatformAdmin
              captures: { recipe_id: $.data.id }
            - call: "POST /recipe-distributions"
              payload: { recipe_id: "${recipe_id}", stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /recipe-distributions/${dist_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Goldie", home_stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /loyalty-accounts/${acct_id}/points-adjustments"
              payload: { delta_points: 500, reason: "goodwill" }
              as: PlatformAdmin
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", loyalty_account_id: "${acct_id}", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }, { recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.subtotal_cents == 666"
            - "Order.${order_id}.discount_cents == 66 (33 per line, per-line round_half_up of 33.3)"
            - "Order.${order_id}.total_cents == 600 (aggregate-then-round variant would give 599)"

      - name: royalty_statement_pins_gross_then_brand_fund_then_net_then_tiered_rate
        grounds:
          - calculations.royalty_statement
          - endpoints.GET_/stands/{standId}/royalty-statement
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the royalty tier is keyed on
          GROSS while the rate applies to NET, and NET subtracts a brand fund
          that itself derives from GROSS. The pinned evaluation order
          (gross → brand_fund → net → tier → royalty) makes the value
          well-defined: gross 1000000 → brand_fund 20000 → net 980000 →
          rate 0.05 (inclusive TIER1_MIN boundary) → royalty 49000.
        test_recipe:
          setup:
            - "Stand OPEN; one window order of a 1000000-cent recipe fully captured in September 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_lead
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - call: "POST /recipes"
              payload: { name: "Catering Keg", channel: "CORE", base_price_cents: 1000000, base_build_seconds: 200, temperature_class: "HOT" }
              as: PlatformAdmin
              captures: { recipe_id: $.data.id }
            - call: "POST /recipe-distributions"
              payload: { recipe_id: "${recipe_id}", stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /recipe-distributions/${dist_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v: $.data.version }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /orders/${order_id}/call-to-window"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay_id}/capture"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
          trigger:
            - call: "GET /stands/${stand_id}/royalty-statement"
              payload: { month: "2026-09" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { gross: $.data.gross_cents, royalty: $.data.royalty_cents }
          assert:
            - "royalty_statement.gross_cents == 1000000"
            - "royalty_statement.brand_fund_cents == 20000 (round_half_up(1000000 * 0.02))"
            - "royalty_statement.net_cents == 980000"
            - "royalty_statement.royalty_rate == 0.05 (gross >= TIER1_MIN 1000000, inclusive)"
            - "royalty_statement.royalty_cents == 49000 (round_half_up(980000 * 0.05))"

      - name: build_time_combines_recipe_modifier_class_and_staffing_multiplier
        grounds:
          - calculations.build_time_seconds
          - entities.OrderItem.fields.build_time_seconds
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: base + modifier adders +
          conditional BLENDED +15, scaled by a step multiplier on checked-in
          BAR crew, capped at 240. With default staffing (2 → ×1.0) a BLENDED
          90s + 10s modifier builds in 115; with one BAR checked in (→ ×1.3)
          the identical drink builds in round_half_up(149.5) = 150.
        test_recipe:
          setup:
            - "Stand OPEN; BLENDED recipe (base 90s) with a +10s modifier; first order placed with no IN_PROGRESS shift; then a shift with a single checked-in BAR crew member is in progress for the second order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_lead
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - call: "POST /recipes"
              payload: { name: "Frost", channel: "CORE", base_price_cents: 500, base_build_seconds: 90, temperature_class: "BLENDED", modifiers: [{ name: "WHIP", price_cents: 25, build_seconds_adder: 10 }] }
              as: PlatformAdmin
              captures: { recipe_id: $.data.id }
            - call: "POST /recipe-distributions"
              payload: { recipe_id: "${recipe_id}", stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /recipe-distributions/${dist_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            # Order 1: no IN_PROGRESS shift → crew_on_bar defaults to 2 → ×1.0
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v: $.data.version }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: ["WHIP"] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order1_id: $.data.id }
            - call: "GET /order-items"
              payload: { order_id: "${order1_id}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { item1_build: "$.data[0].build_time_seconds" }
            # Shift with exactly one checked-in BAR crew → ×1.3
            - call: "POST /shifts"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", is_peak: false }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { crew_member_id: "${lead_id}", role: "BAR", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", expected_shift_version: "${shift_v}" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { asg_bar: $.data.id }
            - call: "POST /shifts/${shift_id}/publish"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/start"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "POST /shift-assignments/${asg_bar}/check-in"
              payload: {}
              as: CrewMember
              as_user_id: "${lead_id}"
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v2: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "B", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: ["WHIP"] }], expected_stand_version: "${stand_v2}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order2_id: $.data.id }
            - call: "GET /order-items"
              payload: { order_id: "${order2_id}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { item2_build: "$.data[0].build_time_seconds" }
          assert:
            - "order 1 item build_time_seconds == 115 ((90 + 10 + 15 BLENDED) * 1.0, default staffing)"
            - "order 2 item build_time_seconds == 150 (round_half_up(115 * 1.3) with one checked-in BAR)"
            - "identical recipe+modifiers yields different build times purely from the staffing multiplier branch"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: order_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Order
          - entities.Order.fields.queue_status
          - entities.Order.fields.payment_status
          - entities.Order.fields.build_status
        distinguishing_aspect: |
          Order carries three parallel state dimensions on one row: build can
          reach READY while payment is still UNPAID and queue is MERGED; a
          later abandon flips queue to ABANDONED and payment to VOIDED while
          build stays READY — no single linear pipeline can express this.
        test_recipe:
          setup:
            - "Stand OPEN with CORE recipe; one window order whose single item has been built to READY while payment remains UNPAID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_lead
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - *c_recipe
            - *c_dist
            - *c_dist_act
            - *c_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
            - call: "GET /order-items"
              payload: { order_id: "${order_id}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { item_id: "$.data[0].id" }
            - call: "POST /order-items/${item_id}/start-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /order-items/${item_id}/complete-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { mid_queue: $.data.queue_status, mid_pay: $.data.payment_status, mid_build: $.data.build_status }
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
          trigger:
            - call: "POST /orders/${order_id}/abandon"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
              captures: { end_queue: $.data.queue_status, end_pay: $.data.payment_status }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
              captures: { end_build: $.data.build_status }
          assert:
            - "mid-flight: queue_status == MERGED, payment_status == UNPAID, build_status == READY (dimensions independent)"
            - "after abandon: queue_status == ABANDONED and payment_status == VOIDED"
            - "build_status remains READY — abandonment does not rewrite the build dimension"

      - name: recipe_distribution_cycles_between_activated_and_suspended
        grounds:
          - state_machines.RecipeDistribution
          - state_machines.RecipeDistribution.ACTIVATED_to_SUSPENDED
          - state_machines.RecipeDistribution.SUSPENDED_to_ACTIVATED
        distinguishing_aspect: |
          Cyclic machine on RecipeDistribution (ACTIVATED ⇄ SUSPENDED, twice
          around the loop): while SUSPENDED, orders with the recipe are
          rejected with ERR_DISTRIBUTION_NOT_ACTIVE; after re-activation they
          succeed again — a different entity from the Order parallel machine.
        test_recipe:
          setup:
            - "Stand OPEN; CORE recipe distributed and activated; distribution then suspended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
