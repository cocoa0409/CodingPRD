              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo1_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d2_id}", order_type: "MADE_TO_ORDER", quantity: 20, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o2_id: $.data.id }
            - call: "POST /customer-orders/${o2_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "POST /work-orders"
              payload: { order_id: "${o2_id}", design_id: "${d2_id}", unit_count: 20, expected_design_version: "${d2_v}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo2_id: $.data.id }
            - call: "POST /rotor-builds"
              payload: { work_order_id: "${wo1_id}" }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { rb1_id: $.data.id }
            - call: "POST /rotor-builds"
              payload: { work_order_id: "${wo2_id}" }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { rb2_id: $.data.id }
          trigger:
            - call: "POST /rotor-builds/${rb1_id}/form-cage"
              payload: { cage_method: "BRAZED_BAR", braze_alloy: "AgCu-56", bar_count: 34 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { e_wrong_fork: $.data.error_id }
            - call: "POST /rotor-builds/${rb1_id}/form-cage"
              payload: { cage_method: "DIE_CAST", die_preheat_c: 250.0 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { e_missing_melt: $.data.error_id }
            - call: "POST /rotor-builds/${rb1_id}/form-cage"
              payload: { cage_method: "DIE_CAST", melt_temp_c: 700.0, die_preheat_c: 250.0, braze_alloy: "AgCu-56" }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { e_foreign_field: $.data.error_id }
            - call: "POST /rotor-builds/${rb2_id}/form-cage"
              payload: { cage_method: "DIE_CAST", melt_temp_c: 700.0, die_preheat_c: 250.0 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { e_copper_diecast: $.data.error_id }
            - call: "POST /rotor-builds/${rb2_id}/form-cage"
              payload: { cage_method: "BRAZED_BAR", braze_alloy: "AgCu-56", bar_count: 38 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { e_bar_count: $.data.error_id }
            - call: "POST /rotor-builds/${rb1_id}/form-cage"
              payload: { cage_method: "DIE_CAST", melt_temp_c: 700.0, die_preheat_c: 250.0 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { rb1_ratio: $.data.cage_conductivity_ratio }
            - call: "POST /rotor-builds/${rb2_id}/form-cage"
              payload: { cage_method: "BRAZED_BAR", braze_alloy: "AgCu-56", bar_count: 40 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { rb2_ratio: $.data.cage_conductivity_ratio }
          assert:
            - "${e_wrong_fork} == ERR_ROTOR_CONSTRUCTION_MISMATCH with HTTP 409"
            - "${e_missing_melt} == ERR_ROTOR_CONSTRUCTION_MISMATCH with HTTP 409 (melt_temp_c absent on the DIE_CAST fork)"
            - "${e_foreign_field} == ERR_ROTOR_CONSTRUCTION_MISMATCH with HTTP 409 (braze_alloy forbidden on the DIE_CAST fork)"
            - "${e_copper_diecast} == ERR_ROTOR_CONSTRUCTION_MISMATCH with HTTP 409 — NOT ERR_ROTOR_BAR_COUNT_MISMATCH, because priority 44 is only evaluated on the BRAZED_BAR fork"
            - "${e_bar_count} == ERR_ROTOR_BAR_COUNT_MISMATCH with HTTP 409 (38 against the design's 40)"
            - "RotorBuild.${rb1_id}.status == PLANNED and RotorBuild.${rb2_id}.status == PLANNED after the five rejections, with cage_conductivity_ratio == null on both"
            - "trigger 6 returns HTTP 200: RotorBuild.${rb1_id}.status == CAST_POURED, melt_temp_c == 700.0, die_preheat_c == 250.0, braze_alloy == null, bar_count == null, ${rb1_ratio} == 0.62, slip_penalty_pct == 1.8, rotor_process_cost_cents == 18000"
            - "trigger 7 returns HTTP 200: RotorBuild.${rb2_id}.status == BARS_BRAZED, braze_alloy == AgCu-56, bar_count == 40, melt_temp_c == null, die_preheat_c == null, ${rb2_ratio} == 1.00, slip_penalty_pct == 0.6, rotor_process_cost_cents == 47500"

      - name: assembly_checks_shaft_fit_before_lubrication_fill_and_accepts_both_inclusive_edges
        claim_type: priority_ordering
        grounds:
          - validations[priority=65]
          - validations[priority=66]
          - validations[priority=67]
          - calculations.rotor_balance_limit
          - calculations.assembly_shaft_fit
          - state_machines.WorkOrder.transitions.RELEASED_to_SUBASSEMBLIES_DONE
          - state_machines.WorkOrder.transitions.SUBASSEMBLIES_DONE_to_ASSEMBLED
          - errors[ERR_UNBALANCE_EXCEEDS_GRADE_LIMIT]
          - errors[ERR_SHAFT_FIT_OUT_OF_TOLERANCE]
          - errors[ERR_LUBRICATION_FILL_OUT_OF_RANGE]
        distinguishing_aspect: |
          One work order driven to assembly. A residual unbalance one tenth of a gram-millimetre
          above the G2.5 permissible 296.0 is refused and 296.0 exactly is accepted; then a body
          that violates BOTH the shaft-fit band and the grease band must return the shaft error,
          proving priority 66 outranks 67 rather than reporting whichever check the implementation
          happens to run first; then both inclusive upper edges (+18 um, 60.00 %) are accepted in
          the same call.
        test_recipe:
          setup:
            - "Work order WO1 on design D1 (shaft 38.000 mm, class k6, GREASE_REGREASABLE) with an ACCEPTED StatorBuild and a MACHINED RotorBuild of mass 18.6 kg."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", tier: "GOLD", jurisdiction: "EU", stocking_program_enrolled: true, committed_annual_units: 500, stock_buffer_units: 10 }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { dist_id: $.data.id }
            - call: "POST /curing-ovens"
              payload: { oven_code: "OVEN-A", max_temp_c: 180.0, cooldown_buffer_minutes: 45 }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { oven_a_id: $.data.id }
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o1_id: $.data.id }
            - call: "POST /customer-orders/${o1_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "POST /work-orders"
              payload: { order_id: "${o1_id}", design_id: "${d1_id}", unit_count: 12, expected_design_version: "${d1_v}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo1_id: $.data.id }
            - call: "POST /stator-builds"
              payload: { work_order_id: "${wo1_id}", insulation_system: "CLASS_F_POLYESTERIMIDE", slot_fill_pct: 82.00 }
