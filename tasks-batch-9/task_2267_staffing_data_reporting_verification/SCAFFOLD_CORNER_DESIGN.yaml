            - "no call returns ERR_INVALID_REQUEST, since a well-formed unknown id is a lookup failure and not a shape failure"

      - name: authentication_and_identity_header_probes_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNKNOWN_ROLE]
          - errors[ERR_IDENTITY_NOT_FOUND]
          - validations[priority 1 ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The three header failures are distinct and ordered: a missing role header, a role name outside the catalog, and a syntactically fine X-User-ID that resolves to no Worker."
        test_recipe:
          setup:
