# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2180 — Logging Contractor & Log Trucking Operations
#
# Shared literals used across the chains below:
#   PlatformAdmin  X-User-ID = "admin-1"
#   OperationsManager X-User-ID = "ops-1"
#   SafetyOfficer  X-User-ID = "safety-1"
#   SettlementAccountant compiler = "acct-1", approver = "acct-2"
#   HaulContractor X-User-ID = the carrier id, MillScaler X-User-ID = the mill id
#   Logical clock startup default = 2026-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: provisional_dispatch_pay_versus_final_certified_pay_on_one_load
        grounds:
          - calculations.load_haul_pay
          - calculations.ticket_net_tons
          - entities.Load.fields.provisional_haul_pay_cents
          - entities.Load.fields.final_haul_pay_cents
          - state_machines.Load.AT_MILL_to_DELIVERED
        distinguishing_aspect: |
          This dual variant lives in the Load / haul-economics domain: the same route
          and the same physical truckload yield provisional_haul_pay_cents == 32590 at
          dispatch and final_haul_pay_cents == 35578 at certification, because the
          provisional variant reads the woods estimate with zero wait while the final
          variant reads the scaled post-defect tonnage plus five chargeable demurrage
          minutes.
        test_recipe:
          setup:
            - "Mill A open for receiving; MillContract A for DOUGLAS_FIR/SAWLOG_1 with quota_tons 500 covering 2026-07-01..2026-09-30"
            - "Carrier Ridgeline Hauling with all three coverages ACTIVE (compliance_score 100) and one SIX_AXLE truck, tare 31000 lbs, permit STANDARD"
            - "Tract Section 14 NE (ALL_SEASON) ACTIVE with an APPROVED plan and one WORKING crew assignment"
            - "HaulRoute A: tract -> Mill A, 52 miles, legal gross 98000 lbs, STANDARD permit, no frost window"
            - "One load of 26.50 estimated tons dispatched, departed, arrived at 2026-08-03T15:10:00Z and scaled at 90000 lbs gross with a 0.04 defect deduction, certified at 2026-08-03T16:00:00Z"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
            - call: "POST /mill-contracts"
              payload: { mill_id: "${mill_a_id}", species: "DOUGLAS_FIR", grade: "SAWLOG_1", quota_tons: 500, base_rate_cents_per_ton: 4200, period_start: "2026-07-01", period_end: "2026-09-30", overrun_tolerance_pct: 0.05 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mc_a_id: $.data.id }
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/trucks"
              payload: { unit_number: "T-18", axle_config: "SIX_AXLE", tare_weight_lbs: 31000, permit_class: "STANDARD" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Alpha", crew_type: "MECHANIZED_GROUND", equipment_pieces: 4, daily_rate_cents: 480000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_id: $.data.id, tract_v: $.data.version }
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 600, plan_horizon_weeks: 8, expected_tract_version: "${tract_v}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /production-plans/${plan_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /tracts/${tract_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", move_in_miles: 40, window_start: "2026-08-01", window_end: "2026-10-15" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { ca_id: $.data.id }
            - call: "POST /haul-routes"
              payload: { tract_id: "${tract_id}", mill_id: "${mill_a_id}", distance_miles: 52, legal_gross_weight_lbs: 98000, permit_class_required: "STANDARD", status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { route_a_id: $.data.id }
            - call: "POST /tracts/${tract_id}/mobilize"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /tracts/${tract_id}/activate"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /loads"
              payload: { tract_id: "${tract_id}", mill_contract_id: "${mc_a_id}", haul_route_id: "${route_a_id}", truck_id: "${truck_id}", declared_species: "DOUGLAS_FIR", declared_grade: "SAWLOG_1", estimated_net_tons: 26.50, scheduled_depart_at: "2026-08-03T08:00:00Z", scheduled_arrive_at: "2026-08-03T10:00:00Z" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { l1_id: $.data.id, l1_prov: $.data.provisional_haul_pay_cents }
            - call: "POST /loads/${l1_id}/depart"
              payload: {}
              as: HaulContractor
              as_user_id: "${hc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T15:10:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /loads/${l1_id}/arrive"
              payload: {}
              as: HaulContractor
              as_user_id: "${hc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /loads/${l1_id}/delivery-tickets"
              payload: { gross_weight_lbs: 90000, defect_deduction_pct: 0.04, scaled_species: "DOUGLAS_FIR", scaled_grade: "SAWLOG_1" }
              as: MillScaler
              as_user_id: "${mill_a_id}"
              captures: { t1_id: $.data.id, t1_tons: $.data.net_tons }
          trigger:
            - call: "POST /delivery-tickets/${t1_id}/certify"
              payload: {}
              as: MillScaler
              as_user_id: "${mill_a_id}"
          assert:
            - "DeliveryTicket.${t1_id}.net_weight_lbs == 59000"
            - "DeliveryTicket.${t1_id}.defect_deducted_lbs == 2360"
            - "DeliveryTicket.${t1_id}.payable_lbs == 56640"
            - "DeliveryTicket.${t1_id}.net_tons == 28.32"
            - "Load.${l1_id}.provisional_haul_pay_cents == 32590"
            - "Load.${l1_id}.rate_cents_per_ton_mile == 22"
            - "Load.${l1_id}.wait_minutes == 50"
            - "Load.${l1_id}.line_haul_cents == 32398"
            - "Load.${l1_id}.fuel_surcharge_cents == 2430"
            - "Load.${l1_id}.demurrage_cents == 750"
            - "Load.${l1_id}.incentive_cents == 0"
            - "Load.${l1_id}.regrade_adjustment_cents == 0"
            - "Load.${l1_id}.final_haul_pay_cents == 35578"
            - "Load.${l1_id}.final_haul_pay_cents != Load.${l1_id}.provisional_haul_pay_cents"

      - name: rolling_180_day_versus_period_to_date_compliance_score_on_one_carrier
        grounds:
          - calculations.contractor_compliance_score
          - entities.HaulContractor.fields.compliance_score
          - entities.SettlementStatement.fields.compliance_score_at_compile
          - entities.SettlementStatement.fields.holdback_pct
          - entities.SafetyFinding.fields.occurred_on
        distinguishing_aspect: |
          This dual variant lives in the HaulContractor / risk-scoring domain, not the
          Load money domain: the identical two-finding history scores 90 under the
          rolling_180_day window (the 2026-01-20 finding falls before 2026-02-02) and
          70 under the period_to_date window 2026-01-01..2026-08-31 that swallows both
          findings, so the settlement holdback tier is 0.05 while dispatch eligibility
          still reads 90.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z startup default"
            - "Carrier Ridgeline Hauling with all three coverages ACTIVE"
            - "Two MINOR safety findings: 20 points on 2026-01-20 and 10 points on 2026-07-15"
            - "No loads at all, so the compiled statement carries an empty lines array"
          setup_api_calls:
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/safety-findings"
              payload: { severity: "MINOR", points: 20, occurred_on: "2026-01-20", note: "unsecured wrapper" }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /haul-contractors/${hc_id}/safety-findings"
              payload: { severity: "MINOR", points: 10, occurred_on: "2026-07-15", note: "log bunk wear" }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "GET /haul-contractors/${hc_id}"
              payload: {}
              as: SettlementAccountant
              as_user_id: "acct-1"
              captures: { hc_v: $.data.version, hc_rolling_score: $.data.compliance_score }
          trigger:
            - call: "POST /settlement-statements"
              payload: { haul_contractor_id: "${hc_id}", period_start: "2026-01-01", period_end: "2026-08-31", expected_haul_contractor_version: "${hc_v}" }
              as: SettlementAccountant
              as_user_id: "acct-1"
              captures: { s1_id: $.data.id }
          assert:
            - "HaulContractor.${hc_id}.compliance_score == 90"
            - "HaulContractor.${hc_id}.compliance_status == COMPLIANT"
            - "SettlementStatement.${s1_id}.compliance_score_at_compile == 70"
            - "SettlementStatement.${s1_id}.holdback_pct == 0.05"
            - "SettlementStatement.${s1_id}.compliance_score_at_compile != HaulContractor.${hc_id}.compliance_score"
            - "SettlementStatement.${s1_id}.gross_pay_cents == 0"
            - "len(SettlementStatement.${s1_id}.lines) == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: move_in_cost_tiered_waterfall_with_cap_and_floor_both_binding
        grounds:
          - calculations.move_in_cost
          - entities.CrewAssignment.fields.move_in_cost_cents
          - entities.CrewAssignment.fields.lowboy_trips
          - entities.Tract.fields.move_in_cost_cents
          - entities.Crew.fields.equipment_pieces
        distinguishing_aspect: |
          Mode (a) instance: one formula with five interacting inputs - equipment_pieces
          through a ceiling, move_in_miles through a three-band marginal waterfall, access_class
          through a multiplier, crew_type through a flat surcharge, and finally a nested
          min(max(...)). One assignment lands above the cap (subtotal 1368500 clipped to
          1250000) and the other below the floor (subtotal 21600 lifted to 185000), so both
          arms of the nested min/max bind in the same test.
        test_recipe:
          setup:
            - "No mill, carrier or route is needed: move-in pricing reads only Crew, Tract and the request body"
            - "Crew Cable Bravo: CABLE_YARDING with 11 equipment pieces"
            - "Crew Hand Delta: HAND_FALLING with 3 equipment pieces"
            - "Tract Ridge 9 has access_class FROZEN_ONLY; Tract Flat 2 has access_class ALL_SEASON"
            - "Logical clock left at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls:
            - call: "POST /crews"
              payload: { name: "Cable Bravo", crew_type: "CABLE_YARDING", equipment_pieces: 11, daily_rate_cents: 910000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { crew_cbl_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Hand Delta", crew_type: "HAND_FALLING", equipment_pieces: 3, daily_rate_cents: 260000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { crew_hnd_id: $.data.id }
            - call: "POST /tracts"
              payload: { name: "Ridge 9", legal_description: "T1N R7W Sec 9 SW1/4", gross_acres: 80, planned_volume_tons: 2600, access_class: "FROZEN_ONLY" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_fz_id: $.data.id }
            - call: "POST /tracts"
              payload: { name: "Flat 2", legal_description: "T1N R7W Sec 2 NE1/4", gross_acres: 45, planned_volume_tons: 900, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_as_id: $.data.id }
          trigger:
            - call: "POST /tracts/${tract_fz_id}/crew-assignments"
              payload: { crew_id: "${crew_cbl_id}", move_in_miles: 200, window_start: "2026-08-01", window_end: "2026-10-01" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { ca_cap_id: $.data.id }
            - call: "POST /tracts/${tract_as_id}/crew-assignments"
              payload: { crew_id: "${crew_hnd_id}", move_in_miles: 12, window_start: "2026-08-01", window_end: "2026-10-01" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { ca_floor_id: $.data.id }
          assert:
            - "CrewAssignment.${ca_cap_id}.lowboy_trips == 6"
            - "CrewAssignment.${ca_cap_id}.move_in_cost_cents == 1250000"
            - "CrewAssignment.${ca_floor_id}.lowboy_trips == 2"
            - "CrewAssignment.${ca_floor_id}.move_in_cost_cents == 185000"
            - "Tract.${tract_fz_id}.move_in_cost_cents == 1250000"
            - "Tract.${tract_as_id}.move_in_cost_cents == 185000"

      - name: fuel_surcharge_rounded_per_load_before_the_statement_sums_it
        grounds:
          - calculations.settlement_statement_rollup
          - calculations.load_haul_pay
          - entities.Load.fields.fuel_surcharge_cents
          - entities.SettlementStatement.fields.gross_pay_cents
          - entities.SettlementStatement.fields.lines
        distinguishing_aspect: |
          Mode (b) instance: rounding ORDER decides the total. Rounding 7.5% on each load
          first (2430 and 1719) and summing yields gross_pay_cents 60211; summing line-haul
          first (32398 + 22914 = 55312) and taking 7.5% of the aggregate yields 4148 and a
          gross of 60210. The scaffold pins per-load rounding, so 60211 is right and 60210 is
          the wrong-order answer.
        test_recipe:
          setup:
            - "Mill A, MillContract A (DOUGLAS_FIR/SAWLOG_1, quota 500 tons), compliant carrier, SIX_AXLE truck with tare 31000, ACTIVE tract, 52-mile route"
            - "Load 1: 26.50 estimated tons, arrived 2026-08-03T15:10:00Z, certified 2026-08-03T16:00:00Z at 90000 lbs gross with a 0.04 defect deduction -> 28.32 net tons and 50 wait minutes"
            - "Load 2: 20.00 estimated tons, certified with zero wait at 71060 lbs gross and a 0.00 defect deduction -> 20.03 net tons"
            - "Carrier compliance_score is 100, so holdback_pct is 0.00 and no deduction can mask the one-cent rounding difference"
