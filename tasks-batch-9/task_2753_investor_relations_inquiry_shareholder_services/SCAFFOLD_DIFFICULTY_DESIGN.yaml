              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an_id: "$.data.id" }
          trigger:
            - call: "POST /contacts/${an_id}/servicing"
              payload: { action: "GRANT_MODEL_ACCESS" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "POST /contacts/${an_id}/servicing"
              payload: { action: "SET_THREAT_LEVEL", threat_level: "CRITICAL" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "POST /contacts/${an_id}/servicing"
              payload: { action: "REVOKE_MODEL_ACCESS" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "POST /contacts/${an_id}/servicing"
              payload: { action: "GRANT_MODEL_ACCESS" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
          assert:
            - "after trigger step 1: Contact.${an_id}.model_access_status == GRANTED and Contact.${an_id}.threat_level == NONE"
            - "after trigger step 2: Contact.${an_id}.threat_level == CRITICAL and Contact.${an_id}.model_access_status == GRANTED (dimension A untouched)"
            - "after trigger step 2: Company.${co_id}.disclosure_posture == OPEN because the contact's activist_flag is false"
            - "after trigger step 3: Contact.${an_id}.model_access_status == REVOKED and Contact.${an_id}.threat_level == CRITICAL (dimension B untouched)"
            - "after trigger step 4: Contact.${an_id}.model_access_status == GRANTED while threat_level is still CRITICAL — the A dimension completed a GRANTED -> REVOKED -> GRANTED cycle"
            - "Contact.${an_id}.version == 5 after the four servicing calls"

  - rule_id: transitive_cascade
    instances:
      - name: disclosure_withdrawal_cascades_to_draft_inquiry_and_company
        grounds:
          - state_machines.Disclosure.PUBLISHED_to_WITHDRAWN
          - state_machines.ResponseDraft.APPROVED_to_BLOCKED
          - state_machines.InquiryTicket.AWAITING_APPROVAL_to_DRAFTING
          - calculations.company_open_inquiry_count
          - calculations.company_disclosure_posture
          - endpoints[POST /disclosures/{id}/withdraw]
        distinguishing_aspect: |
          Depth-4 chain from a single withdraw call: the Disclosure moves to WITHDRAWN (link 1), which
          moves the citing APPROVED ResponseDraft to BLOCKED (link 2), which moves that draft's
          InquiryTicket from AWAITING_APPROVAL back to DRAFTING with a fresh sla_due_at (link 3),
          which makes that inquiry's Company recompute open_inquiry_count and posture_recomputed_at
          (link 4) — each link caused by the previous one, not by the withdraw call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z, advanced to 2026-08-11T09:00:00Z immediately before the withdraw."
            - "Issuer WDR with one INSTITUTIONAL_HOLDER contact."
            - "A PUBLISHED GUIDANCE_UPDATE disclosure for EPS / FY2026 (version 2 after publication)."
            - "One GUIDANCE inquiry routed to IR_DESK with sla_due_at 2026-08-13T09:00:00.000Z, and a ResponseDraft in disclosure_class GUIDANCE_REPEAT citing that disclosure, already APPROVED (inquiry AWAITING_APPROVAL, pinned_disclosure_version 2)."
