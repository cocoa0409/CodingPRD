      - name: studio_resource_turnaround_exclusion_zone_blocks_adjacent_booking
        grounds:
          - validations[priority=29]
          - errors[ERR_RESOURCE_OVERBOOKED]
          - entities.StudioResource.fields.turnaround_minutes
          - entities.StudioResource.fields.capacity_slots
          - entities.StudioResource.fields.open_reservation_count
          - calculations.reservation_deposit_hold
        distinguishing_aspect: |
          A different contended resource (StudioResource) with strictly stronger
          interval semantics: on top of the half-open overlap test there is a
          turnaround exclusion zone [end_at, end_at + turnaround_minutes) counted
          against an aggregate capacity_slots budget. An adjacent booking that
          Channel airtime would have accepted is refused here, and only a start at
          the exact end of the exclusion zone is admitted.
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC and competency_codes [STUDIO_FLOOR, EDIT_SUITE], 0 suspension points."
            - "StudioResource CAM-01 has base_deposit_cents 5000, replacement_value_cents 90000, capacity_slots 1, turnaround_minutes 30 and requires STUDIO_FLOOR."
