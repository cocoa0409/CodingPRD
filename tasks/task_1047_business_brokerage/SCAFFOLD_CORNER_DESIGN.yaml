              as_user_id: "${broker_id}"
              captures: { cim_id: $.data.id }
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/ndas"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /brokerage/deals"
              payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/qualify"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_v: $.data.version }
            - call: "POST /brokerage/deals/${deal_id}/lois"
              payload: { offer_price_cents: 110000000, earnest_deposit_cents: 4000000, earnout_amount_cents: 0, earnout_periods: 1, financing_contingency: true, expected_deal_version: "${deal_v}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { loi_1_id: $.data.id }
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/lois"
              payload: { offer_price_cents: 115000000, earnest_deposit_cents: 5000000, earnout_amount_cents: 0, earnout_periods: 1, financing_contingency: true, expected_deal_version: "${deal_v}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

