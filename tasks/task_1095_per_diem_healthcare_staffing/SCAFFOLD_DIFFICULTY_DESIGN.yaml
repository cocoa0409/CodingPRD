        distinguishing_aspect: |
          A DIFFERENT entity pair from the Assignment/Clinician instance: ShiftClaim -> Credential.
          The clinician is ACTIVE with a perfectly valid, unexpired licence row, but that
          Credential is still in PENDING_VERIFICATION, so the claim is refused with
