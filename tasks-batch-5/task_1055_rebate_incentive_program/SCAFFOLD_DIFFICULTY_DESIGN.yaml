scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_rebate_diverges_by_tier_on_claim
        grounds:
          - "calculations.claim_rebate_amount"
          - "entities.Claim.fields.provisional_rebate_cents"
          - "entities.Claim.fields.final_rebate_cents"
          - "state_machines.Claim.DRAFT_to_SUBMITTED"
          - "state_machines.Claim.UNDER_REVIEW_to_APPROVED"
        distinguishing_aspect: |
          This dual variant lives in the COST domain on a Claim: the provisional variant includes
          all receipts (55 units -> DEALER_TIER_3_PCT 0.12 -> 10193 cents) while the final variant
          includes only validated receipts (30 units -> DEALER_TIER_2_PCT 0.08 -> 4798 cents), so the
          final amount is not a proportional shrink of the provisional one.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program with budget_total_cents 100000000."
            - "PUBLISHED DEALER Offer, sku_scope TOOLS, window 2026-06-01 to 2026-09-01, max_rebate_cents_per_claim 500000."
            - "ACTIVE DEALER Claimant holding one claim with two receipts; only the first receipt is validated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Spring Tools Rebate", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Tools Dealer Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000, dealer_tier_enabled: true }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Northgate Tools LLC", email: "ap@northgate.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-DV-1", purchase_date: "2026-06-15T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 30, unit_price_cents: 1999 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-DV-2", purchase_date: "2026-06-16T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-B", quantity: 25, unit_price_cents: 999 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { prov_amount: $.data.provisional_rebate_cents }
            - call: "POST /api/claims/${claim_id}/review"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/receipts/${r1_id}/validate"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
          trigger:
            - call: "POST /api/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
              captures: { final_amount: $.data.final_rebate_cents }
          assert:
            - "Claim.${claim_id}.provisional_rebate_cents == 10193"
            - "Claim.${claim_id}.final_rebate_cents == 4798"
            - "Claim.${claim_id}.total_units == 30"
            - "Claim.${claim_id}.adjudication_status == APPROVED"
            - "Receipt.${r2_id}.validated == false"

      - name: fraud_score_substantiated_vs_cleared_diverges_on_claimant
        grounds:
          - "calculations.claimant_fraud_score"
          - "entities.Claimant.fields.fraud_score"
          - "entities.FraudCase.fields.final_score"
          - "state_machines.FraudCase.UNDER_INVESTIGATION_to_SUBSTANTIATED"
          - "state_machines.FraudCase.UNDER_INVESTIGATION_to_CLEARED"
        distinguishing_aspect: |
          This dual variant lives in the RISK domain on a Claimant, not the cost domain on a Claim:
          two claimants with identical counters (denied_claim_count 1 -> heuristic 15) end at
          final_score 23 on the SUBSTANTIATED branch (round_half_up(15 * 1.5) = 23) and 0 on the
          CLEARED branch (max(0, 15 - 30)).
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program and PUBLISHED DEALER Offer."
            - "Two ACTIVE DEALER Claimants, each with exactly one DENIED claim, hence denied_claim_count 1 and heuristic score 15."
            - "One analyst-opened FraudCase per claimant, each moved to UNDER_INVESTIGATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Risk Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Risk Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Alpha Dealer", email: "a@alpha.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_a: $.data.id }
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Beta Dealer", email: "b@beta.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_b: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_a}" }
              as: Dealer
              as_user_id: "${clmt_a}"
              captures: { claim_a: $.data.id }
            - call: "POST /api/claims/${claim_a}/receipts"
              payload: { serial_number: "SN-A-1", purchase_date: "2026-06-15T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 2, unit_price_cents: 1000 } ] }
              as: Dealer
              as_user_id: "${clmt_a}"
            - call: "POST /api/claims/${claim_a}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_a}"
            - call: "POST /api/claims/${claim_a}/review"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/claims/${claim_a}/deny"
              payload: { reason_code: "ILLEGIBLE_RECEIPT" }
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_b}" }
              as: Dealer
              as_user_id: "${clmt_b}"
              captures: { claim_b: $.data.id }
            - call: "POST /api/claims/${claim_b}/receipts"
              payload: { serial_number: "SN-B-1", purchase_date: "2026-06-15T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 2, unit_price_cents: 1000 } ] }
              as: Dealer
              as_user_id: "${clmt_b}"
            - call: "POST /api/claims/${claim_b}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_b}"
            - call: "POST /api/claims/${claim_b}/review"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/claims/${claim_b}/deny"
              payload: { reason_code: "ILLEGIBLE_RECEIPT" }
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/fraud-cases"
              payload: { claimant_id: "${clmt_a}", opened_reason: "MANUAL_AUDIT" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
              captures: { case_a: $.data.id, case_a_open_score: $.data.heuristic_score_at_open }
            - call: "POST /api/fraud-cases"
              payload: { claimant_id: "${clmt_b}", opened_reason: "MANUAL_AUDIT" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
              captures: { case_b: $.data.id }
            - call: "POST /api/fraud-cases/${case_a}/transition"
              payload: { to_status: "UNDER_INVESTIGATION" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
            - call: "POST /api/fraud-cases/${case_b}/transition"
              payload: { to_status: "UNDER_INVESTIGATION" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
          trigger:
            - call: "POST /api/fraud-cases/${case_a}/transition"
              payload: { to_status: "SUBSTANTIATED" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
            - call: "POST /api/fraud-cases/${case_b}/transition"
              payload: { to_status: "CLEARED" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
          assert:
            - "FraudCase.${case_a}.heuristic_score_at_open == 15"
            - "FraudCase.${case_b}.heuristic_score_at_open == 15"
            - "FraudCase.${case_a}.final_score == 23"
            - "FraudCase.${case_b}.final_score == 0"
            - "Claimant.${clmt_a}.fraud_score == 23"
            - "Claimant.${clmt_b}.fraud_score == 0"
            - "Claimant.${clmt_a}.status == BLOCKED"
            - "Claimant.${clmt_b}.status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_order_pinned_on_rebate
        grounds:
          - "calculations.claim_rebate_amount"
          - "entities.Receipt.fields.lines"
          - "state_machines.Claim.UNDER_REVIEW_to_APPROVED"
        distinguishing_aspect: |
          Mode (b) - nested rounding where order changes the cents. Three lines of 1 x 1050 cents at
          DEALER_TIER_1_PCT 0.05 each round 52.5 up to 53, summing to 159; summing first
          (3150 * 0.05 = 157.5) and rounding once yields 158. The scaffold pins round-per-line-then-sum,
          so 159 is the only correct answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program, PUBLISHED DEALER Offer with dealer_tier_enabled true."
            - "A DEALER claim carrying one validated receipt with three identical 1 x 1050-cent lines (3 units, tier 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Rounding Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Rounding Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Rounding Dealer", email: "r@round.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-RND-1", purchase_date: "2026-06-20T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 1, unit_price_cents: 1050 }, { sku: "TOOLS-B", quantity: 1, unit_price_cents: 1050 }, { sku: "TOOLS-C", quantity: 1, unit_price_cents: 1050 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
            - call: "POST /api/claims/${claim_id}/review"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/receipts/${r1_id}/validate"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
          trigger:
            - call: "POST /api/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
              captures: { final_amount: $.data.final_rebate_cents }
          assert:
            - "Claim.${claim_id}.provisional_rebate_cents == 159"
            - "Claim.${claim_id}.final_rebate_cents == 159"
            - "Receipt.${r1_id}.gross_amount_cents == 3150"
            - "Receipt.${r1_id}.line_count == 3"

      - name: payout_method_selected_from_gross_then_fee_applied
        grounds:
          - "calculations.payout_net_amount"
          - "entities.Payout.fields.method"
          - "entities.Payout.fields.fee_cents"
          - "entities.Payout.fields.net_cents"
          - "concurrency_rules[payout-create-stale-claim]"
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency with a pinned evaluation order. gross 2500 selects
          VIRTUAL_CARD because gross >= CARD_METHOD_MIN_CENTS 2500, the CARD_FEE_CENTS 50 then drops
          net to 2450, and the method is NOT re-selected even though 2450 is below the card threshold.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program, PUBLISHED CONSUMER Offer."
            - "An APPROVED CONSUMER claim whose final_rebate_cents is exactly 2500 (20000 cents of goods at 0.10 plus the 500-cent consumer bonus)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Consumer Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Consumer Offer", channel: "CONSUMER", sku_scope: "APPLIANCE", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "CONSUMER", legal_name: "Dana Consumer", email: "dana@home.example", mailing_state: "NY" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Consumer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-CON-1", purchase_date: "2026-06-20T00:00:00Z", retailer_name: "MegaMart", lines: [ { sku: "APPLIANCE-X", quantity: 4, unit_price_cents: 5000 } ] }
              as: Consumer
              as_user_id: "${clmt_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${clmt_id}"
            - call: "POST /api/claims/${claim_id}/review"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/receipts/${r1_id}/validate"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
              captures: { claim_ver: $.data.version }
          trigger:
            - call: "POST /api/claims/${claim_id}/payouts"
              payload: { expected_claim_version: "${claim_ver}" }
              as: FinanceOfficer
              as_user_id: "u-fin-1"
              captures: { payout_id: $.data.id }
          assert:
            - "Claim.${claim_id}.final_rebate_cents == 2500"
            - "Payout.${payout_id}.method == VIRTUAL_CARD"
            - "Payout.${payout_id}.gross_cents == 2500"
            - "Payout.${payout_id}.fee_cents == 50"
            - "Payout.${payout_id}.net_cents == 2450"
            - "Payout.${payout_id}.status == PENDING"
            - "Claim.${claim_id}.payment_status == SCHEDULED"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_adjudication_and_payment_dimensions_evolve_independently
        grounds:
          - "state_machines.Claim.UNDER_REVIEW_to_APPROVED"
          - "state_machines.Claim.NONE_to_SCHEDULED"
          - "state_machines.Claim.SCHEDULED_to_PAID"
          - "state_machines.Claim.PAID_to_NONE"
          - "entities.Claim.fields.payment_status"
        distinguishing_aspect: |
          Parallel state dimensions on the Claim entity: adjudication_status stays pinned at APPROVED
          across three payment_status transitions (NONE -> SCHEDULED -> PAID -> NONE), proving the two
          axes on the same row advance without gating each other.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program with budget_total_cents 1000000, PUBLISHED DEALER Offer."
            - "An APPROVED DEALER claim with final_rebate_cents 1600, approved by operator u-proc-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Parallel Program", budget_total_cents: 1000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Parallel Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Parallel Dealer", email: "p@par.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-PAR-1", purchase_date: "2026-06-20T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 10, unit_price_cents: 2000 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
            - call: "POST /api/claims/${claim_id}/review"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/receipts/${r1_id}/validate"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
              captures: { claim_ver: $.data.version }
          trigger:
            - call: "POST /api/claims/${claim_id}/payouts"
              payload: { expected_claim_version: "${claim_ver}", method: "CHECK" }
              as: FinanceOfficer
              as_user_id: "u-fin-1"
              captures: { payout_id: $.data.id }
            - call: "POST /api/payouts/${payout_id}/release"
              payload: { check_number: "CHK-0001" }
              as: FinanceOfficer
              as_user_id: "u-fin-1"
            - call: "POST /api/payouts/${payout_id}/void"
              payload: { void_reason: "ADDRESS_RETURNED" }
              as: FinanceOfficer
              as_user_id: "u-fin-1"
          assert:
            - "Claim.${claim_id}.final_rebate_cents == 1600"
            - "Payout.${payout_id}.net_cents == 1450"
            - "Payout.${payout_id}.status == VOIDED"
            - "Claim.${claim_id}.payment_status == NONE"
            - "Claim.${claim_id}.adjudication_status == APPROVED"
            - "Program.${prog_id}.committed_cents == 1600"
            - "Program.${prog_id}.paid_cents == 0"

      - name: fraud_case_investigation_pending_info_cycle_repeats
        grounds:
          - "state_machines.FraudCase.UNDER_INVESTIGATION_to_PENDING_INFO"
          - "state_machines.FraudCase.PENDING_INFO_to_UNDER_INVESTIGATION"
          - "entities.FraudCase.fields.info_request_count"
        distinguishing_aspect: |
          A cycle on a different entity than the parallel-dimension instance: FraudCase revisits
          UNDER_INVESTIGATION twice via PENDING_INFO, so info_request_count reaches 2 while the case
          still terminates in CLEARED.
        test_recipe:
          setup:
            - "Logical clock at the 2026-07-01T00:00:00Z startup default."
            - "One ACTIVE DEALER Claimant with no claims, hence heuristic score 0."
            - "One analyst-opened FraudCase in OPEN."
          setup_api_calls:
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Cycle Dealer", email: "c@cyc.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/fraud-cases"
              payload: { claimant_id: "${clmt_id}", opened_reason: "TIP_LINE" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /api/fraud-cases/${case_id}/transition"
              payload: { to_status: "UNDER_INVESTIGATION" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
            - call: "POST /api/fraud-cases/${case_id}/transition"
              payload: { to_status: "PENDING_INFO", note: "await invoices" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
            - call: "POST /api/fraud-cases/${case_id}/transition"
              payload: { to_status: "UNDER_INVESTIGATION" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
            - call: "POST /api/fraud-cases/${case_id}/transition"
              payload: { to_status: "PENDING_INFO", note: "await bank letter" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
            - call: "POST /api/fraud-cases/${case_id}/transition"
              payload: { to_status: "UNDER_INVESTIGATION" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
            - call: "POST /api/fraud-cases/${case_id}/transition"
              payload: { to_status: "CLEARED" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
          assert:
            - "FraudCase.${case_id}.status == CLEARED"
            - "FraudCase.${case_id}.info_request_count == 2"
            - "FraudCase.${case_id}.heuristic_score_at_open == 0"
            - "FraudCase.${case_id}.final_score == 0"
            - "Claimant.${clmt_id}.status == ACTIVE"

  - rule_id: transitive_cascade
    instances:
      - name: approve_commits_budget_locks_program_suspends_offers_voids_draft_claims
        grounds:
          - "state_machines.Claim.UNDER_REVIEW_to_APPROVED"
          - "state_machines.Program.ACTIVE_to_BUDGET_LOCKED"
          - "state_machines.Offer.PUBLISHED_to_SUSPENDED"
          - "state_machines.Claim.DRAFT_to_VOIDED"
          - "calculations.program_budget_position"
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /api/claims/{id}/approve: the COMMIT ledger entry raises
          committed_cents (hop 1), which drives utilization_pct to 1.0000 and locks the Program
          (hop 2), which suspends both PUBLISHED offers (hop 3), which voids the DRAFT claim sitting
          on the second offer (hop 4). Each hop is caused by the previous hop, not by the approve.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program with budget_total_cents exactly 100000."
            - "Two PUBLISHED DEALER offers on that program with different sku_scope values (TOOLS and PAINT)."
            - "One DEALER claim on the TOOLS offer sitting in UNDER_REVIEW with a validated 5 x 400000-cent receipt (5 units, tier 1, final rebate 100000)."
            - "One untouched DRAFT claim on the PAINT offer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
