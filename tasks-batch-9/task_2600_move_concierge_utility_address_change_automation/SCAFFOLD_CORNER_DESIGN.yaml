      - name: occ_consent_creation_rejects_a_stale_resident_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[consent-create-stale-resident]"
          - "errors[ERR_STALE_RESIDENT_VERSION]"
          - "endpoints[POST /residents/{id}/consent-records]"
        distinguishing_aspect: |
          The consent rule's own guard, exercised where the intervening write is a different kind of
          resident write (a marketing preference change) than the one being retried: the stale
          version is a value the client legitimately read, the retry with the refetched version
          succeeds unchanged, and the refused attempt must leave no ConsentRecord row behind at all.
        test_recipe:
          setup:
            - "One resident, read at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "PATCH /residents/${res_id}/marketing-preferences"
              payload: { marketing_opt_out: true }
              as: ComplianceOfficer
              captures: { res_v2: $.data.version }
          trigger:
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "WEB_PORTAL", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
              as: MoveOpsAgent
              captures: { e_stale: $.data.error_id }
            - call: "GET /consent-records"
              payload: { resident_id: "${res_id}", limit: 10, offset: 0 }
              as: ComplianceOfficer
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "WEB_PORTAL", consent_text_version: "v3", expected_resident_version: "${res_v2}" }
              as: MoveOpsAgent
              captures: { cs_id: $.data.id }
            - call: "GET /residents/${res_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "${res_v2} == 2, so the preference write advanced the resident past the version the consent client is holding"
            - "trigger call 1 returns HTTP 412 with ${e_stale} == ERR_STALE_RESIDENT_VERSION"
            - "trigger call 2 reports total_count == 0: the refused create wrote nothing"
            - "trigger call 3 returns HTTP 201 with data.state == GRANTED for a body differing only in expected_resident_version"
            - "trigger call 4 shows version == 3, so the accepted consent create advanced the parent exactly once"

