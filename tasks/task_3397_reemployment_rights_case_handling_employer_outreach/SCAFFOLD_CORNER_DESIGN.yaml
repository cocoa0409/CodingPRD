          - endpoints.GET_/reemployment/employers/{id}/statements-of-support
          - endpoints.GET_/reemployment/cases/{id}/rounds
        distinguishing_aspect: "Each reverse-reachability GET returns exactly the children of the addressed parent: member A's periods exclude member B's, and the employer's statement list excludes other employers'."
        test_recipe:
