- rule_id: transitive_cascade
  instances:
  - name: cascade_site_expiry_to_stale_authorization_to_stepdown
    grounds:
    - state_machines.TreatmentEpisode.clinical_status.IN_TREATMENT_to_IN_TREATMENT
    - state_machines.Accreditation.GRANTED_to_EXPIRED
    - state_machines.LevelOfCareAuthorization.APPROVED_to_EXHAUSTED
    - state_machines.TreatmentEpisode.care_level_status.STEPPED_DOWN_to_STEP_DOWN_PENDING
    - calculations.facility_ops_batch
    distinguishing_aspect: 'A single facility-ops epoch propagates across three entities through causally
      chained hops rather than one fan-out: hop 1 writes Facility.compliance_risk_points (45) and facility_posture
      (RESTRICTED), hop 2 — caused by that posture and the expired ACCREDITATION_BODY, not by the run
      itself — forcibly rewrites the episode''s TreatmentPlan status to PENDING_COSIGN and cancels its
      SCHEDULED sessions, and hop 3 — caused by that plan demotion and the episode''s remaining authorized
      days — demotes the authorization to STEP_DOWN_REQUIRED and pushes care_level_status to STEP_DOWN_PENDING.'
    test_recipe:
      setup:
      - Logical clock advances 2026-09-01 → 2026-09-15. The facility's ACCREDITATION_BODY expires at 2026-09-15T00:00:00Z.
      - The episode was admitted 2026-09-02 at ASAM_3_5 with an APPROVED 14-day authorization; after the
        2026-09-08 epoch days_used is 6 and days_remaining is 8.
      - Two scheduled sessions lie in the future of the 2026-09-15 epoch and the treatment plan is ACTIVE.
