              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id, v0: $.data.version }
            - call: "POST /api/cases/${case_id}/no-contact-directives"
              payload: { party_side: "MUTUAL", restrictions: ["IN_PERSON", "ELECTRONIC"], effective_from: "2026-08-01T00:00:00Z", expected_case_version: "${v0}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { dir_id: $.data.id }
            - call: "POST /api/no-contact-directives/${dir_id}/violations"
              payload: { reported_by_side: "COMPLAINANT", occurred_at: "2026-08-03T15:00:00Z", description: "Approached in library" }
              as: Party
              as_user_id: "${comp_id}"
              captures: { vio1_id: $.data.id }
            - call: "POST /api/no-contact-directives/${dir_id}/violations"
              payload: { reported_by_side: "COMPLAINANT", occurred_at: "2026-08-05T15:00:00Z", description: "Text message sent" }
              as: Party
              as_user_id: "${comp_id}"
              captures: { vio2_id: $.data.id }
          trigger:
            - { call: "POST /api/directive-violations/${vio1_id}/substantiate", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { score_mid: $.data.exposure_score, elig_mid: $.data.interim_suspension_eligible } }
            - { call: "POST /api/directive-violations/${vio2_id}/substantiate", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { score_end: $.data.exposure_score, elig_end: $.data.interim_suspension_eligible } }
            - { call: "GET /api/no-contact-directives/${dir_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { dir_count: $.data.substantiated_violation_count } }
          assert:
            - "NoContactDirective.${dir_id}.substantiated_violation_count == 2 (counter incremented once per substantiation - the middle link)"
            - "after first substantiation: Case.exposure_score == 60 (40 + 10 active-directive + 10*1) and interim_suspension_eligible == false"
            - "after second substantiation: Case.exposure_score == 70 and interim_suspension_eligible == true (>= 70 inclusive threshold crossed by the cascade, not by a direct case write)"

