scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: applicant_creation_initial_state_and_system_fields
        claim_type: creation
        grounds: [entities.Applicant, state_machines.Applicant]
        distinguishing_aspect: "POST /api/applicants returns 201 with application_status == SUBMITTED (initial state), version == 1, server-minted id, created_at == logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty database; logical clock at startup default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/applicants", payload: { full_name: "Init Ivy", email: "init.i@x.com", placement_track: MOBILITY, household_income_cents: 7000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id, a_status: $.data.application_status, a_v: $.data.version } }
          assert:
            - "response 201; Applicant.${a_id}.application_status == SUBMITTED"
            - "Applicant.${a_id}.version == 1"
            - "Applicant.${a_id}.created_at == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"
            - "reviewed_by_user_id is null and approved_by_user_id is null"

      - name: applicant_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Applicant.fields.email, "validations[priority=1]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field email is rejected with ERR_VALIDATION (400) before any auth/existence processing beyond request shape."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/applicants"
              payload: { full_name: "No Email", placement_track: MOBILITY, household_income_cents: 7000000, region: NW }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION; http status == 400"

      - name: applicant_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/applicants/00000000-0000-0000-0000-000000000000"
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; http status == 404"

      - name: milestone_record_is_immutable_event
        claim_type: immutability
        grounds: [entities.TrainingMilestone]
        distinguishing_aspect: "TrainingMilestone has common_fields false: its GET response carries id and created_at but no version and no updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "Dog in IN_ADVANCED_TRAINING with certified primary trainer T"
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Imm", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "Immy", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-01-01", region: NW, donor_name: "Donor Imm" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser Imm", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /api/raiser-placements/${pl_id}/complete", payload: { primary_trainer_id: "${t_id}" }, as: TrainingDirector }
          trigger:
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 77 }, as: Trainer, as_user_id: "${t_id}", captures: { m_id: $.data.id } }
            - { call: "GET /api/milestones/${m_id}", as: TrainingDirector }
          assert:
            - "milestone response contains id and created_at"
            - "milestone response contains NO version key and NO updated_at key"
            - "§1.5 declares no PUT/PATCH/DELETE for milestones (append-only event)"

      - name: dog_bred_lineage_validation
        claim_type: type_constraints
        grounds: [entities.Dog.fields.sire_id, entities.Dog.fields.dam_id, "validations[priority=16]", "errors[ERR_DONOR_LINEAGE_INVALID]"]
        distinguishing_aspect: "BRED dogs require existing MALE sire and FEMALE dam (distinct); DONATED dogs forbid sire/dam and require donor_name — three lineage violation shapes, one acceptance."
        test_recipe:
          setup:
            - "Two parent dogs registered: sire (MALE, DONATED), dam (FEMALE, DONATED)"
          setup_api_calls:
            - { call: "POST /api/dogs", payload: { name: "Sire", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2022-01-01", region: NW, donor_name: "Donor S" }, as: ProgramAdmin, captures: { sire_id: $.data.id } }
            - { call: "POST /api/dogs", payload: { name: "Dam", origin: DONATED, breed: "Labrador", sex: FEMALE, born_on: "2022-02-01", region: NW, donor_name: "Donor D" }, as: ProgramAdmin, captures: { dam_id: $.data.id } }
          trigger:
            - { call: "POST /api/dogs", payload: { name: "Pup", origin: BRED, breed: "Labrador", sex: FEMALE, born_on: "2026-06-01", region: NW, sire_id: "${sire_id}", dam_id: "${dam_id}" }, as: ProgramAdmin, captures: { pup_id: $.data.id } }
            - call: "POST /api/dogs"
              payload: { name: "NoDam", origin: BRED, breed: "Labrador", sex: MALE, born_on: "2026-06-01", region: NW, sire_id: "${sire_id}" }
              as: ProgramAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /api/dogs"
              payload: { name: "BadDonor", origin: DONATED, breed: "Poodle", sex: MALE, born_on: "2026-06-01", region: NW, sire_id: "${sire_id}", donor_name: "Donor X" }
              as: ProgramAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "BRED with valid sire+dam: 201, Dog.${pup_id}.status == REGISTERED"
            - "BRED without dam_id: error_id == ERR_DONOR_LINEAGE_INVALID (422)"
            - "DONATED with sire_id present: error_id == ERR_DONOR_LINEAGE_INVALID (422)"

      - name: applicant_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, entities.Applicant]
        distinguishing_aspect: "Default pagination (limit 10, offset 0) applies when no params given; total_count and has_more reflect the full filtered set across pages."
        test_recipe:
          setup: ["12 applicants created"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "P01", email: "p01@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P02", email: "p02@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P03", email: "p03@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P04", email: "p04@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P05", email: "p05@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P06", email: "p06@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P07", email: "p07@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P08", email: "p08@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P09", email: "p09@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P10", email: "p10@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P11", email: "p11@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "P12", email: "p12@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /api/applicants", as: IntakeCoordinator }
            - { call: "GET /api/applicants?limit=10&offset=10", as: IntakeCoordinator }
          assert:
            - "page 1: 10 items, total_count == 12, has_more == true"
            - "page 2 (offset 10): 2 items, total_count == 12, has_more == false"

      - name: applicant_list_status_filter
        claim_type: listing
        grounds: [entities.Applicant.fields.application_status]
        distinguishing_aspect: "Filter application_status=DENIED returns exactly the denied subset (filter semantics verified independent of pagination)."
        test_recipe:
          setup: ["two applicants; the first is denied after review"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Deny Me", email: "deny.m@x.com", placement_track: PTSD, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { a1_id: $.data.id } }
            - { call: "POST /api/applicants", payload: { full_name: "Keep Me", email: "keep.m@x.com", placement_track: PTSD, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { a2_id: $.data.id } }
            - { call: "POST /api/applicants/${a1_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a1_id}/deny", payload: { denial_reason: "not eligible" }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /api/applicants?application_status=DENIED", as: IntakeCoordinator }
          assert:
            - "response total_count == 1 and the single item is Applicant.${a1_id} with application_status == DENIED and denial_reason 'not eligible'"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: denied_applicant_terminal_lockdown
        claim_type: invalid_transition
        grounds: [state_machines.Applicant, "validations[priority=8]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "From terminal DENIED, every lifecycle action (begin-review shown; deny again) is rejected with ERR_ALREADY_TERMINAL and no side effects fire."
        test_recipe:
          setup: ["applicant DENIED"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Term Ted", email: "term.t@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/deny", payload: { denial_reason: "x" }, as: IntakeCoordinator }
          trigger:
            - call: "POST /api/applicants/${a_id}/begin-review"
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL; http 409"
            - "Applicant.${a_id}.application_status still DENIED"

      - name: approve_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Applicant.IN_REVIEW_to_WAITLISTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve requires IN_REVIEW; from SUBMITTED it fails with ERR_INVALID_STATE even when a FINALIZED_ACCEPTED assessment exists (state checked before referral logic)."
        test_recipe:
          setup: ["applicant SUBMITTED with accepted assessment attached (assessment create allowed pre-review)"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Skip Sam", email: "skip.s@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [RETRIEVE_ITEMS], task_urgency_tier: STANDARD, home_environment_score: 5 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
          trigger:
            - call: "POST /api/applicants/${a_id}/approve"
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; no WaitlistEntry created (GET /api/applicants/${a_id}/waitlist-entries returns empty list)"

      - name: screening_double_submit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.HealthScreening, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Submitting an already-CLEARED screening (terminal) yields ERR_ALREADY_TERMINAL; the dog's CLEARED status and score are unchanged."
        test_recipe:
          setup: ["dog with a CLEARED screening (score 84)"]
          setup_api_calls:
            - { call: "POST /api/dogs", payload: { name: "DoubleSub", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-01-01", region: NW, donor_name: "Donor DS" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
          trigger:
            - call: "POST /api/screenings/${sc_id}/submit"
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"
            - "HealthScreening.${sc_id}.status still CLEARED; Dog.${d_id}.status still CLEARED"

      - name: class_complete_blocked_by_open_enrollment
        claim_type: precondition_enforcement
        grounds: [state_machines.TeamTrainingClass.GRADUATION_REVIEW_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Class complete requires every enrollment terminal; an ENROLLED enrollment blocks with ERR_INVALID_STATE."
        test_recipe:
          setup: ["class GRADUATION_REVIEW with one ENROLLED enrollment (no PAT, no graduation)"]
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Comp", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "Comp", origin: DONATED, breed: "Labrador", sex: FEMALE, born_on: "2024-01-01", region: NW, donor_name: "Donor CP" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser CP", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /api/raiser-placements/${pl_id}/complete", payload: { primary_trainer_id: "${t_id}" }, as: TrainingDirector }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 95 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: OPEN_DOORS, score: 90 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: PUBLIC_MANNERS, score: 88 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 85 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: SOCIALIZATION, score: 82 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 84 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/applicants", payload: { full_name: "Comp Applicant", email: "comp.a@x.com", placement_track: MOBILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [RETRIEVE_ITEMS], task_urgency_tier: STANDARD, home_environment_score: 6 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor CQ", amount_cents: 1350000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c_id: $.data.id } }
            - { call: "POST /api/contributions/${c_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { d_v: $.data.version } }
            - { call: "POST /api/dogs/${d_id}/match-proposals", payload: { waitlist_entry_id: "${entry_id}", expected_dog_version: "${d_v}" }, as: IntakeCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /api/matches/${m_id}/accept", as: IntakeCoordinator }
            - { call: "POST /api/classes", payload: { name: "Comp Class", lead_trainer_id: "${t_id}", starts_on: "2026-09-01", ends_on: "2026-10-15", capacity: 2, total_sessions: 20 }, as: TrainingDirector, captures: { cl_id: $.data.id } }
            - { call: "POST /api/classes/${cl_id}/open-enrollment", as: TrainingDirector }
            - { call: "GET /api/classes/${cl_id}", as: TrainingDirector, captures: { cl_v: $.data.version } }
            - { call: "POST /api/classes/${cl_id}/enrollments", payload: { match_id: "${m_id}", expected_class_version: "${cl_v}" }, as: TrainingDirector, captures: { enr_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/classes/${cl_id}/start", as: TrainingDirector }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-16T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/classes/${cl_id}/begin-graduation-review", as: TrainingDirector }
          trigger:
            - call: "POST /api/classes/${cl_id}/complete"
              as: TrainingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (enrollment still ENROLLED)"
            - "TeamTrainingClass.${cl_id}.status remains GRADUATION_REVIEW"

      - name: raiser_hiatus_with_active_dog_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PuppyRaiser.APPROVED_to_ON_HIATUS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Hiatus requires current_dog_count == 0; an ACTIVE raiser fostering a dog gets ERR_INVALID_STATE."
        test_recipe:
          setup: ["raiser ACTIVE with one ACTIVE placement"]
          setup_api_calls:
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser Busy", region: NW, foster_capacity: 2, experience_score: 60 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "Busy", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-01-01", region: NW, donor_name: "Donor B" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector }
          trigger:
            - call: "POST /api/puppy-raisers/${r_id}/hiatus"
              as: PuppyRaiser
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (current_dog_count == 1)"
            - "PuppyRaiser.${r_id}.status remains ACTIVE"

      - name: support_request_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.SupportRequest]
        distinguishing_aspect: "Cyclic support machine: OPEN -> TRIAGED -> IN_PROGRESS -> RESOLVED -> REOPENED -> IN_PROGRESS -> RESOLVED -> CLOSED; resolved_at is set on each resolve and cleared on reopen."
        test_recipe:
          setup: ["graduated partnership with applicant A; certified trainer T"]
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Eval Sup", pat_certified: true }, as: ProgramAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /api/trainers/${e_id}/certify", as: ProgramAdmin }
