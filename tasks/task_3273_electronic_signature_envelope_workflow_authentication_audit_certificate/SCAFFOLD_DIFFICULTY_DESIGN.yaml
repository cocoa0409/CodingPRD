  - rule_id: transitive_cascade
    instances:
      - name: decline_recipient_cascades_to_envelope_to_peers_to_sessions
        grounds:
          - state_machines.Envelope.DELIVERED_to_DECLINED
          - state_machines.Recipient.SIGNING_to_DECLINED
          - state_machines.SigningSession.OPEN_to_DECLINED
          - entities.Envelope.fields.decline_reason
          - entities.Recipient.fields.status
        distinguishing_aspect: |
          The decline cascade is depth 4 and each hop is caused by the previous one: the acting
          Recipient becomes DECLINED (hop 1), that alone drives the owning Envelope to DECLINED
          (hop 2), that envelope transition alone drives the other in-flight Recipients to VOIDED
          (hop 3), and those recipient mutations alone drive their open SigningSessions to
          DECLINED (hop 4) — no hop is a direct effect of the original request.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one PARALLEL envelope with a SIGNER that declines and a second SIGNER peer, both at routing_order 1"
            - "each recipient has an OPEN signing session and a filled SIGNATURE field"
            - "the envelope has been sent so both recipients are SENT and auth_status AUTHENTICATED"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Standard Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Decline cascade envelope", routing_mode: "PARALLEL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Cascade.pdf", page_count: 6 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "decliner@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { decliner_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "peer@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { peer_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${decliner_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Decliner" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${peer_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 2, value: "Peer" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/recipients/${decliner_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${decliner_id}"
              captures: { decliner_sess: $.data.id }
            - call: "POST /esign/recipients/${peer_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${peer_id}"
              captures: { peer_sess: $.data.id }
          trigger:
            - call: "POST /esign/recipients/${decliner_id}/decline"
              payload: { decline_reason: "Terms unacceptable" }
              as: Recipient
              as_user_id: "${decliner_id}"
              captures: { env_v: $.data.version }
          assert:
            - "Recipient.${decliner_id}.status == \"DECLINED\"  (hop 1)"
            - "Envelope.${env_id}.status == \"DECLINED\"  (hop 2, caused by hop 1)"
            - "Envelope.${env_id}.decline_reason == \"Terms unacceptable\""
            - "Recipient.${peer_id}.status == \"VOIDED\"  (hop 3, caused by the envelope transition alone)"
            - "SigningSession.${peer_sess} status == \"DECLINED\"  (hop 4, caused by the peer recipient mutation alone)"
      - name: sign_releases_next_routing_group_and_recomputes_peer_scores
        grounds:
          - state_machines.Recipient.SIGNING_to_SIGNED
          - state_machines.Envelope.CREATED_to_SENT
          - calculations.authentication_risk_score
          - entities.Recipient.fields.auth_status
        distinguishing_aspect: |
          The sign cascade is depth 3 and each hop is caused by the previous one: the acting
          Recipient becomes SIGNED (hop 1), that alone releases the next routing_order group so
          those Recipients move WAITING -> SENT and their auth_status -> PENDING (hop 2), and
          that auth_status change alone forces a recompute of the provisional risk score for the
          released recipients (hop 3).
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one SEQUENTIAL envelope with a KBA SIGNER at routing_order 1 and an ID_DOCUMENT SIGNER at routing_order 2"
            - "the routing_order-1 recipient holds a filled SIGNATURE field and has an OPEN session with consent"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Standard Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Routing release envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Routing.pdf", page_count: 9 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "first@example.com", routing_order: 1, auth_level: "KBA", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { first_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "second@example.com", routing_order: 2, auth_level: "ID_DOCUMENT", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { second_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${first_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "First" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${second_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 2, value: "Second" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/recipients/${first_id}/authenticate"
              payload: { method: "KBA", kba_answers_correct: true }
              as: Recipient
              as_user_id: "${first_id}"
            - call: "POST /esign/recipients/${first_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${first_id}"
            - call: "GET /esign/recipients/${second_id}"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { second_status_before: $.data.status, second_auth_before: $.data.auth_status }
          trigger:
            - call: "POST /esign/recipients/${first_id}/sign"
              payload: {}
              as: Recipient
              as_user_id: "${first_id}"
          assert:
            - "Recipient.${first_id}.status == \"SIGNED\"  (hop 1)"
            - "Recipient.${second_id}.status == \"SENT\"  (hop 2, released only because hop 1 completed)"
            - "Recipient.${second_id}.auth_status == \"PENDING\"  (hop 2)"
            - "Recipient.${second_id}.auth_risk_score == 80  (hop 3 recompute triggered by the hop-2 auth_status change: ID_DOCUMENT base 80)"
            - "the routing_order-2 recipient was WAITING before the trigger, proving hop 2 is caused by hop 1"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: send_voided_and_held_envelope_returns_409_state_error
        grounds:
          - validations[priority=11]
          - validations[priority=12]
