  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_batch_delivery_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[batch-delivery-stale-tank]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second batch delivery carrying the pre-first-delivery version (stale) is rejected with ERR_STALE_VERSION (412); the first delivery bumped BaitTank.version."
        test_recipe:
          setup: ["Clock 2026-07-01. Tank cap 1000; first batch of 50 delivered (version advances)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /bait-tanks"
              payload: { name: "OCC Tank", species: "MINNOW", capacity_units: 1000, mortality_rate_bps_per_day: 0 }
              as: ShopManager
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /bait-tanks/${tank_id}/batches"
              payload: { initial_count: 50, delivered_at: "2026-07-01T00:00:00Z", expected_bait_tank_version: "${tank_v0}" }
              as: ShopManager
              captures: { tank_v1: $.data.version }
          trigger:
            - call: "POST /bait-tanks/${tank_id}/batches"
              payload: { initial_count: 50, delivered_at: "2026-07-01T00:00:00Z", expected_bait_tank_version: "${tank_v0}" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "tank_v1 == tank_v0 + 1  # first delivery advanced the version"
            - "err == ERR_STALE_VERSION  # second delivery carried the stale version"

      - name: occ_batch_delivery_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[batch-delivery-stale-tank]", entities.BaitTank.fields.version]
        distinguishing_aspect: "A second delivery carrying the current (post-first-delivery) version succeeds and advances version again; available_count sums both batches."
        test_recipe:
          setup: ["Clock 2026-07-01. Tank cap 1000; first batch of 50 delivered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /bait-tanks"
              payload: { name: "OCC Tank 2", species: "MINNOW", capacity_units: 1000, mortality_rate_bps_per_day: 0 }
              as: ShopManager
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /bait-tanks/${tank_id}/batches"
              payload: { initial_count: 50, delivered_at: "2026-07-01T00:00:00Z", expected_bait_tank_version: "${tank_v0}" }
              as: ShopManager
              captures: { tank_v1: $.data.version }
          trigger:
            - call: "POST /bait-tanks/${tank_id}/batches"
              payload: { initial_count: 30, delivered_at: "2026-07-01T00:00:00Z", expected_bait_tank_version: "${tank_v1}" }
              as: ShopManager
              captures: { tank_v2: $.data.version, avail: $.data.available_count }
          assert:
            - "tank_v2 == tank_v1 + 1"
            - "avail (available_count) == 80  # 50 + 30, no decay"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: consistency_immediate_sale_totals_visible
        claim_type: immediate
        grounds: [calculations.sale_totals, entities.Sale.fields.total_cents]
        distinguishing_aspect: "Sale totals are recomputed synchronously: the add-line response immediately reflects the new subtotal/tax/total in the same request."
        test_recipe:
          setup: ["Customer; product 1000 stock 10; OPEN sale."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Imm Cust", email: "im@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "IM-1", name: "Bobber", category: "TERMINAL_TACKLE", unit_price_cents: 1000, stock_qty: 10 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}" }
              as: ShopClerk
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 2 }
              as: ShopClerk
              captures: { sub: $.data.subtotal_cents, tot: $.data.total_cents }
          assert:
            - "sub (subtotal_cents) == 2000  # visible immediately in the same response"
            - "tot (total_cents) == 2160  # 2000 + round(2000*0.08)=160"

