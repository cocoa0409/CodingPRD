# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 breadth probe for
# task_2700_board_recruitment_director_onboarding
#
# Taxonomy: references/claim-extraction-guide.md. `section:` values are the guide's nine
# sections; `claim_type:` values are that guide's per-section table rows.
# Every instance is reachable from an empty DB using only endpoints declared in SCAFFOLD.yaml §1.5.
# The logical clock default is 2026-08-01T00:00:00Z, so instances that need another instant
# call POST /governance/_clock/set_current_utc explicitly.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub
# naming the covering §1.8 instance and no test_recipe.

scaffold_corner_design:
  - section: entities
    instances:
      - name: policy_creation_returns_every_declared_field_in_the_success_envelope
        claim_type: creation
        grounds:
          - entities.GovernancePolicy
          - endpoints.POST_/governance/policies
          - response_envelope.success
        distinguishing_aspect: |
          A POST carrying only the two required inputs returns 201 with response_type "object", a meta
          block holding api_request_id and api_request_timestamp, and a data block that contains every
          field declared for GovernancePolicy including the common id/created_at/updated_at/version.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries response_type == \"object\" with meta.api_request_id and meta.api_request_timestamp present"
            - "data.cycle_year == 2026 and data.effective_from == \"2026-01-01T00:00:00Z\""
            - "data.status == \"ACTIVE\" and data.version == 1"
            - "data.id, data.created_at and data.updated_at are all present and non-null"
            - "GET /governance/policies/${policy_id} returns the same id and the same field values"

      - name: policy_optional_knobs_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.GovernancePolicy.fields.authorized_seats
          - entities.GovernancePolicy.fields.independence_min_pct
          - entities.GovernancePolicy.fields.independence_standard
          - entities.GovernancePolicy.fields.quorum_size
          - entities.GovernancePolicy.fields.approval_threshold_pct
          - entities.GovernancePolicy.fields.readiness_min_score
        distinguishing_aspect: |
          Omitting all 24 optional threshold inputs must yield exactly the declared defaults, not zeros and
          not nulls: authorized_seats 9, independence_min_pct 66.67, independence_standard BRIGHT_LINE,
          quorum_size 3, approval_threshold_pct 66.67, readiness_min_score 60.00, ownership_multiple 5.0.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          assert:
            - "authorized_seats == 9, independence_min_pct == 66.67, independence_standard == \"BRIGHT_LINE\""
            - "bright_line_payment_floor_cents == 100000000, bright_line_revenue_pct == 2.0, bright_line_lookback_years == 3, enhanced_lookback_years == 5"
            - "max_public_boards_default == 4, max_public_boards_sitting_ceo == 2, interlock_max_shared_boards == 2"
            - "mandatory_retirement_age == 75, max_tenure_years == 15, min_completed_interviews == 3"
            - "quorum_size == 3, approval_threshold_pct == 66.67, readiness_min_score == 60.00"
            - "annual_cash_retainer_cents == 12000000, committee_member_fee_cents == 1500000, committee_chair_premium_cents == 2500000, equity_grant_value_cents == 20000000"
            - "ownership_multiple == 5.0, ownership_grace_years == 5, education_hours_required == 8.0"

      - name: director_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/governance/directors/{director_id}
          - entities.Director
        distinguishing_aspect: |
          GET /governance/directors/{director_id} returns the row exactly as stored, including the initial
          dimension values service_status ONBOARDING, compliance_status COMPLIANT and onboarding_status
          NOT_STARTED, and version 1 because no write has touched it since creation.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and one Director created with the four required inputs only."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Read Back", email: "readback@issuer.example", birth_date: "1970-05-05", appointed_on: "2026-07-01" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
          trigger:
            - call: "GET /governance/directors/${dir_id}"
              payload: {}
              as: GovernanceStaff
          assert:
            - "HTTP 200 with data.id == ${dir_id} and response_type == \"object\""
            - "data.full_name == \"Read Back\", data.email == \"readback@issuer.example\", data.birth_date == \"1970-05-05\", data.appointed_on == \"2026-07-01\""
            - "data.service_status == \"ONBOARDING\", data.compliance_status == \"COMPLIANT\", data.onboarding_status == \"NOT_STARTED\", data.onboarding_completion_pct == 0.00"
            - "data.is_management == false, data.is_sitting_ceo_elsewhere == false, data.is_independent == false, data.shares_held == 0"
            - "data.version == 1"

      - name: committee_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/governance/committees
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three committees stored, limit=2&offset=0 returns 2 rows with total_count 3 and has_more
          true, while offset=2 returns the last row with has_more false; the declared default limit of 10
          returns all three when no pagination params are supplied.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and three committees: AUDIT, COMPENSATION and RISK."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "AUDIT", name: "Audit Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_a_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "COMPENSATION", name: "Compensation Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_c_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "RISK", name: "Risk Oversight Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_r_id: $.data.id }
          trigger:
            - call: "GET /governance/committees"
              payload: { limit: 2, offset: 0 }
              as: GovernanceStaff
            - call: "GET /governance/committees"
              payload: { limit: 2, offset: 2 }
              as: GovernanceStaff
            - call: "GET /governance/committees"
              payload: {}
              as: GovernanceStaff
          assert:
            - "The first call returns response_type == \"array\" with exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "The second call returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "The third call returns 3 rows with limit == 10 (the declared default) and has_more == false"
            - "Every returned committee has filled_seats == 0 and status == \"UNDER_STRENGTH\" (no ACTIVE assignment and no chair)"

      - name: unknown_candidate_id_returns_candidate_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CANDIDATE_NOT_FOUND]
          - validations.priority_20
          - endpoints.GET_/governance/candidates/{candidate_id}
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on the candidate read path returns HTTP 404 with
          error_id ERR_CANDIDATE_NOT_FOUND and response_type "error", never an empty 200 body.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and no Candidate rows at all."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          trigger:
            - call: "GET /governance/candidates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GovernanceStaff
              captures: { not_found_error_id: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_CANDIDATE_NOT_FOUND\""
            - "data.message is a non-empty string"
            - "GET /governance/candidates returns 0 rows with total_count == 0"

      - name: director_create_missing_birth_date_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_10
          - endpoints.POST_/governance/directors
        distinguishing_aspect: |
          birth_date is declared source input with no default, so omitting it returns HTTP 400
          ERR_INVALID_REQUEST and no Director row is created - the endpoint may not substitute a null.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /governance/directors"
              payload: { full_name: "No Birthday", email: "nobirthday@issuer.example", appointed_on: "2026-07-01" }
              as: CorporateSecretary
              captures: { missing_field_error_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /governance/directors returns 0 rows with total_count == 0"

      - name: director_age_and_tenure_are_computed_from_the_logical_clock
        claim_type: computed_fields
        grounds:
          - entities.Director.fields.age_years
          - entities.Director.fields.tenure_years
          - entities.Director.fields.external_public_board_count
          - endpoints.POST_/governance/_clock/set_current_utc
        distinguishing_aspect: |
          age_years and tenure_years are computed from birth_date and appointed_on against the logical
          clock, not stored inputs: with birth_date 1975-01-01 and appointed_on 2021-01-01 the values are
          51 and 5 at the 2026-08-01 default clock, and both must be re-derived to 52 and 6 after the clock
          moves to 2027-02-01.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and one Director with birth_date 1975-01-01, appointed_on 2021-01-01, no outside boards."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Clara Clock", email: "clara@issuer.example", birth_date: "1975-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
          trigger:
            - call: "GET /governance/directors/${dir_id}"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "GET /governance/directors/${dir_id}"
              payload: {}
              as: GovernanceStaff
          assert:
            - "At the default clock: age_years == 51, tenure_years == 5, external_public_board_count == 0, education_hours_cycle == 0.0"
            - "The clock call returns HTTP 200 with current_utc == \"2027-02-01T00:00:00Z\" and recomputed_director_count == 1"
            - "After the clock move: age_years == 52 and tenure_years == 6"
            - "birth_date and appointed_on are unchanged by the clock move"

      - name: slate_system_fields_are_server_generated_and_not_client_settable
        claim_type: system_fields
        grounds:
          - entities.NominationSlate.fields.status
          - entities.NominationSlate.fields.nominee_count
          - entities.NominationSlate.fields.revision_count
          - endpoints.POST_/governance/slates
        distinguishing_aspect: |
          The slate create endpoint declares only cycle_year, seat_count and the optional fee budget as
          inputs, so every other field is system- or computed-sourced: status DRAFT, nominee_count 0,
          revision_count 0, all four tallies 0, quorum_met false, version 1, filed_at null.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id }
          assert:
            - "HTTP 201 with data.status == \"DRAFT\", data.version == 1, data.revision_count == 0"
            - "data.nominee_count == 0, data.independent_nominee_count == 0, data.independent_nominee_pct == 0.00, data.independence_shortfall == false"
            - "data.committed_search_fee_cents == 0, data.contested == false, data.universal_proxy_applicable == false"
            - "data.votes_for == 0, data.votes_against == 0, data.votes_abstain == 0, data.votes_recused == 0, data.approval_pct == 0.00, data.quorum_met == false"
            - "data.filed_at is null and data.election_recorded_at is null"
            - "data.id, data.created_at and data.updated_at are server-generated and non-null"

      - name: skill_rating_above_the_declared_maximum_returns_value_out_of_range
        claim_type: type_constraints
        grounds:
          - errors[ERR_VALUE_OUT_OF_RANGE]
          - validations.priority_12
          - entities.DirectorSkillRating.fields.self_rating
        distinguishing_aspect: |
          self_rating is constrained to 1..5, so 6 returns HTTP 400 ERR_VALUE_OUT_OF_RANGE while the
          boundary value 5 is accepted - the range check must be inclusive at both ends.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one SEATED director and one SkillCategory."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Rita Rater", email: "rita.rater@issuer.example", birth_date: "1970-01-01", appointed_on: "2022-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER_RISK", name: "Cybersecurity Risk Oversight", strategic_weight: 0.8, required_min_directors: 2, risk_oversight: true, criticality: "CORE" }
              as: GovernanceStaff
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /governance/directors/${dir_id}/skill-ratings"
              payload: { skill_category_id: "${cat_id}", self_rating: 6 }
              as: GovernanceStaff
              captures: { range_error_id: $.data.error_id }
            - call: "POST /governance/directors/${dir_id}/skill-ratings"
              payload: { skill_category_id: "${cat_id}", self_rating: 5 }
              as: GovernanceStaff
              captures: { rating_id: $.data.id }
          assert:
            - "The first call returns HTTP 400 with data.error_id == \"ERR_VALUE_OUT_OF_RANGE\""
            - "GET /governance/skill-ratings?director_id=${dir_id} returns exactly 1 row after both calls"
            - "The second call returns HTTP 201 with self_rating == 5, validation_status == \"UNVALIDATED\", validated_rating null, effective_rating == 5"

      - name: candidate_unknown_source_channel_returns_invalid_enum_value
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_ENUM_VALUE]
          - validations.priority_11
          - entities.Candidate.fields.source_channel
        distinguishing_aspect: |
          source_channel accepts only the four declared members, so "HEADHUNTER" returns HTTP 400
          ERR_INVALID_ENUM_VALUE and is distinguished from the missing-field error at priority 10.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /governance/candidates"
              payload: { full_name: "Enum Breaker", email: "enum@cand.example", birth_date: "1974-01-01", source_channel: "HEADHUNTER" }
              as: GovernanceStaff
              captures: { enum_error_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_ENUM_VALUE\""
            - "GET /governance/candidates returns 0 rows with total_count == 0"

      - name: skill_category_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.SkillCategory
          - entities.ExternalCompany
          - endpoints.GET_/governance/skill-categories
        distinguishing_aspect: |
          SkillCategory and ExternalCompany are declared common_fields false, so their rows carry no
          version field, §1.5 declares no PATCH/PUT/DELETE for either, and a repeat POST on the same code
          is rejected as a duplicate rather than silently updating the stored row.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and one SkillCategory with code CYBER_RISK and strategic_weight 0.8."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER_RISK", name: "Cybersecurity Risk Oversight", strategic_weight: 0.8, required_min_directors: 2, risk_oversight: true, criticality: "CORE" }
              as: GovernanceStaff
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER_RISK", name: "Cyber Risk Rewritten", strategic_weight: 0.1, required_min_directors: 1, risk_oversight: false, criticality: "EMERGING" }
              as: GovernanceStaff
              captures: { dup_error_id: $.data.error_id }
          assert:
            - "The creation response for ${cat_id} carries no version field"
            - "The trigger returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_RESOURCE\""
            - "GET /governance/skill-categories returns exactly 1 row whose strategic_weight is still 0.8, name still \"Cybersecurity Risk Oversight\", risk_oversight still true"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for /governance/skill-categories or /governance/external-companies"

      - name: onboarding_item_under_an_unknown_director_returns_director_not_found
        claim_type: parent_relationships
        grounds:
          - entities.OnboardingItem.parent_Director
          - errors[ERR_DIRECTOR_NOT_FOUND]
          - validations.priority_20
        distinguishing_aspect: |
          OnboardingItem declares Director as its parent and takes director_id from the path, so an unknown
          parent id returns 404 ERR_DIRECTOR_NOT_FOUND before any body validation, and no orphan row is
          created even when the payload itself is perfectly valid.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and one real Director, so the store is non-empty."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Real Director", email: "real@issuer.example", birth_date: "1970-01-01", appointed_on: "2026-07-01" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
          trigger:
            - call: "POST /governance/directors/00000000-0000-4000-8000-000000000001/onboarding-items"
              payload: { module_code: "BUSINESS_ORIENTATION_101", category: "BUSINESS_ORIENTATION", is_required: true, credit_hours: 2.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { parent_error_id: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_DIRECTOR_NOT_FOUND\""
            - "GET /governance/directors/${dir_id}/onboarding-items returns 0 rows"
            - "Director.${dir_id}.onboarding_status is still \"NOT_STARTED\" and onboarding_completion_pct == 0.00"

      - name: external_directorship_with_both_subjects_returns_subject_invalid
        claim_type: type_constraints
        grounds:
          - errors[ERR_DIRECTORSHIP_SUBJECT_INVALID]
          - validations.priority_14
          - entities.ExternalDirectorship.fields.director_id
          - entities.ExternalDirectorship.fields.candidate_id
        distinguishing_aspect: |
          The junction row that gives this scaffold its graph topology must name exactly one subject:
          supplying both director_id and candidate_id, or neither, returns HTTP 400
          ERR_DIRECTORSHIP_SUBJECT_INVALID, and the same payload with a single subject succeeds.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one SEATED director, one candidate and one public ExternalCompany."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Both Subjects", email: "both@issuer.example", birth_date: "1970-01-01", appointed_on: "2022-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Cand Subject", email: "candsub@cand.example", birth_date: "1974-01-01", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Cedar Ridge Capital" }
              as: GovernanceStaff
              captures: { cand_id: $.data.id }
            - call: "POST /governance/external-companies"
              payload: { name: "Northwind Industries", ticker: "NWI", is_public: true, is_competitor: false, gross_revenue_cents: 500000000000 }
              as: GovernanceStaff
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /governance/external-directorships"
              payload: { external_company_id: "${co_id}", start_on: "2023-01-01", director_id: "${dir_id}", candidate_id: "${cand_id}", seat_role: "DIRECTOR" }
              as: GovernanceStaff
              captures: { both_error_id: $.data.error_id }
            - call: "POST /governance/external-directorships"
              payload: { external_company_id: "${co_id}", start_on: "2023-01-01", seat_role: "DIRECTOR" }
              as: GovernanceStaff
              captures: { neither_error_id: $.data.error_id }
            - call: "POST /governance/external-directorships"
              payload: { external_company_id: "${co_id}", start_on: "2023-01-01", director_id: "${dir_id}", seat_role: "DIRECTOR" }
              as: GovernanceStaff
              captures: { ed_id: $.data.id }
          assert:
            - "The first call returns HTTP 400 with data.error_id == \"ERR_DIRECTORSHIP_SUBJECT_INVALID\""
            - "The second call returns HTTP 400 with data.error_id == \"ERR_DIRECTORSHIP_SUBJECT_INVALID\""
            - "The third call returns HTTP 201 with status == \"ACTIVE\", director_id == ${dir_id} and candidate_id null"
            - "GET /governance/external-directorships?external_company_id=${co_id} returns exactly 1 row"
            - "Director.${dir_id}.external_public_board_count == 1 and compliance_status == \"COMPLIANT\" (1 + 1 <= 4)"

  - section: state_machines
    instances:
      - name: interview_complete_moves_scheduled_to_completed
        claim_type: valid_transition
        grounds:
          - state_machines.InterviewSession.SCHEDULED_to_COMPLETED
