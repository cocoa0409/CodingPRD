      - name: the_silica_charge_is_computed_from_the_already_rounded_volume_not_the_raw_product
        claim_type: precision
        grounds:
          - calculations.case_environmental_envelope.precision
          - entities.ArtifactCase.fields.case_volume_m3
          - entities.ArtifactCase.fields.silica_gel_kg
        distinguishing_aspect: |
          The formula defines case_volume_m3 on one line and then MULTIPLIES THAT
          ROUNDED VALUE on the next, so the two roundings are chained rather than
          independent. The first case is engineered so the chain matters: the raw
          product is 0.20496 m3, which rounds half-up to 0.2050 at four decimals,
          and 0.2050 * 2.0 * 3.5 == 1.435 exactly - a half-up tie that must land on
          1.44 - whereas carrying the unrounded 0.20496 through gives 1.43472 and
          therefore 1.43. Exactly one cent of silica gel separates a correct chained
          implementation from a single-pass one. The second case is a true four
          decimal tie: 82.3 * 50.0 * 30.0 / 1000000.0 == 0.12345 exactly, which is
          0.1235 under half-up but 0.1234 under banker's rounding or truncation.
        test_recipe:
          setup:
            - "project in DESIGN_DEV with a zone; no artifacts are needed because the geometry fields are computed on the case row alone"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
