      - name: customer_reading_other_customers_rma_forbidden
        claim_type: violation_to_error
        grounds: [roles, "validations[priority=3]", "errors[ERR_NOT_OWNER]"]
        distinguishing_aspect: "Ownership scoping: Customer B reading Customer A's RMA gets ERR_NOT_OWNER (403) — the resource exists but is invisible to non-owners."
