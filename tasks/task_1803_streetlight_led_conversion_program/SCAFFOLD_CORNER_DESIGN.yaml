      - call: POST /streetlights/compliance-exceptions/${x1}/approve
        payload: {}
        as: ComplianceOfficer
        captures:
          e2: $.data.error_id
      - call: POST /streetlights/compliance-exceptions/${x2}/approve
        payload: {}
