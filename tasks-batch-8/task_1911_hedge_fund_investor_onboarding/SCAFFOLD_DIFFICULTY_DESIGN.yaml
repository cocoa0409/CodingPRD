            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", share_class_id: "${class_id}", commitment_amount_cents: 200000, funding_deadline_utc: "2026-08-31T00:00:00Z" }
              as: FundAdmin
              captures: { sub1: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions/${sub1}/submit"
              payload: {}
