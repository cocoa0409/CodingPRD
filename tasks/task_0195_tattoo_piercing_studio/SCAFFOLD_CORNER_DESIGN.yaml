              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "response HTTP status == 403"

      - name: artist_cannot_complete_others_appointment_peer_isolation
        claim_type: peer_roles isolation
        grounds: [roles, endpoints, state_machines.Appointment.CONFIRMED_to_COMPLETED]
        distinguishing_aspect: "An Artist (entity_backed) whose X-User-ID is NOT the appointment's artist_id cannot complete it — peer ownership isolation returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Two artists; a CONFIRMED appointment owned by artist1; artist2 attempts to complete it."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
