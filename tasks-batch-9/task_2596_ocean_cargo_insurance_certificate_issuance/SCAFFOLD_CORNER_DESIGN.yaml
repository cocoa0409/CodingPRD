      - name: voyage_sailing_exactly_at_policy_expiry_is_outside_cover
        claim_type: temporal_validation
        grounds:
          - validations.priority_15
          - errors.ERR_OUTSIDE_POLICY_PERIOD
          - entities.Certificate.fields.attachment_at
        distinguishing_aspect: |
          The policy period is half-open [inception_at, expiry_at) and the check
          is on the ATTACHMENT instant, not on the discharge date: a voyage
          sailing exactly at expiry_at 2026-09-01T00:00:00Z is refused with 422
          while one sailing 2026-08-31 is issued even though its transit (and its
          storage window) runs well past expiry. A voyage sailing one day before
          inception is refused on the same rule, and the rejection happens at
          issue time — creation of the DRAFT row is allowed.
        test_recipe:
          setup:
            - "OP-EXPSOON: inception 2026-01-01, expiry 2026-09-01"
            - "three DRAFT certificates sailing 2026-09-01, 2025-12-31 and 2026-08-31"
