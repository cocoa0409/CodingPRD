              captures: { k1_v_now: $.data.version }
          trigger:
            - call: "POST /registry-cases/${k1}/abstractions"
              payload: { expected_case_version: "${k1_v_now}", iss_abstracted: 21, gcs_arrival: 10, mechanism_code: "MVC", ed_departure_at: "2026-05-01T11:00:00Z" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_CASE_NOT_ABSTRACTABLE"
            - "data.error_id != ERR_ABSTRACTION_WINDOW_CLOSED even though the 60 day window is also breached"
            - "RegistryCase.${k1}.abstraction_status is still VALIDATED and its version is unchanged from ${k1_v_now}"
            - "GET /registry-cases/${k1}/abstractions still returns exactly one AbstractionRecord"
      - name: open_action_safety_error_precedes_segregation_of_duties
        grounds:
          - validations[priority=55]
          - validations[priority=64]
          - errors[ERR_OPEN_ACTIONS_BLOCK_LOOP_CLOSURE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The closing user is also the sole corrective action's owner AND that action is still OPEN, so
          the business_safety rule at priority 55 and the business_constraint rule at priority 64 both
          fire; the response must be ERR_OPEN_ACTIONS_BLOCK_LOOP_CLOSURE — a different category pair and
          a different entity family from the state/temporal pair above.
        test_recipe:
          setup:
            - "one trauma center with a MANUAL TRANSFER_DELAY PIEvent moved to ACTION_PLANNED"
            - "the event's only CorrectiveAction is owned by u_director_1 and is still completion_status OPEN"
            - "u_director_1 is the TraumaMedicalDirector who will attempt the loop closure"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
