        claim_type: standard_crud
        grounds: ["endpoints[GET /mill/order-lines]", "endpoints[GET /mill/material-allocations]", "endpoints[GET /mill/material-lots]", "endpoints[GET /mill/cut-plans]", "endpoints[GET /mill/cell-bookings]", "endpoints[GET /mill/supply-requisitions]", "endpoints[GET /mill/showroom-samples]", "endpoints[GET /mill/compliance-certificates]", "endpoints[GET /mill/shipments]"]
        distinguishing_aspect: "Every FK has a filtered-list reverse lookup: lines by order_id/model_id/fabric_spec_id, lots by fabric_spec_id/order_line_id/parent_lot_id, allocations by lot_id/order_line_id, and per-parent lists for cut plans, bookings, requisitions, samples, certificates, shipments."
        test_recipe:
          setup: ["Confirmed order ORD-FK with one ALLOCATED line (lot 30.0); one DOMESTIC requisition; one DRAFT cut plan; one BOOKED CUT booking; one sample; one certificate; one shipment"]
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 100000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 30.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 30.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 30.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-FK", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/supply-requisitions"
              payload: { order_line_id: "${line_id}", component_code: "FRAME", quantity: 1, source_type: "DOMESTIC" }
              as: ProductionPlanner
              captures: { req_id: $.data.id }
            - call: "GET /mill/order-lines/${line_id}"
              as: ProductionPlanner
              captures: { ln_v: $.data.version }
            - call: "POST /mill/order-lines/${line_id}/cut-plans"
              payload: { expected_order_line_version: "${ln_v}" }
              as: ProductionPlanner
              captures: { cp_id: $.data.id }
            - call: "POST /mill/cells"
              payload: { cell_code: "C-CUT", cell_type: "CUTTING", capacity_slots: 1, certifications: [] }
              as: ProductionPlanner
              captures: { c_cut: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cut}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T09:00:00Z" }
              as: ProductionPlanner
              captures: { booking_id: $.data.id }
            - call: "POST /mill/showroom-samples"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", unit_serial: "U-FK", sample_value_cents: 10000, due_back_days: 30 }
              as: SalesRep
              captures: { sample_id: $.data.id }
            - call: "POST /mill/compliance-certificates"
              payload: { order_id: "${order_id}", standard: "TB117_2013", label_lot_number: "LBL-8", label_count: 1 }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /mill/shipments"
              payload: { order_id: "${order_id}", carrier_name: "Averitt", weight_lb: 100.0, length_in: 40.0, width_in: 30.0, height_in: 30.0, declared_value_cents: 0, piece_count: 1 }
              as: ShippingCoordinator
              captures: { ship_id: $.data.id }
          trigger:
            - call: "GET /mill/order-lines?order_id=${order_id}"
              as: ProductionPlanner
            - call: "GET /mill/material-lots?fabric_spec_id=${spec_id}"
              as: ProductionPlanner
            - call: "GET /mill/material-allocations?lot_id=${lot_id}"
              as: ProductionPlanner
            - call: "GET /mill/material-allocations?order_line_id=${line_id}"
              as: ProductionPlanner
            - call: "GET /mill/cut-plans?order_line_id=${line_id}"
              as: ProductionPlanner
            - call: "GET /mill/cell-bookings?cell_id=${c_cut}"
              as: ProductionPlanner
            - call: "GET /mill/supply-requisitions?order_line_id=${line_id}"
              as: ProductionPlanner
            - call: "GET /mill/showroom-samples?dealer_id=${dealer_id}"
              as: SalesRep
            - call: "GET /mill/compliance-certificates?order_id=${order_id}"
              as: ComplianceOfficer
            - call: "GET /mill/shipments?order_id=${order_id}"
              as: ShippingCoordinator
            - call: "GET /mill/customer-orders?dealer_id=${dealer_id}"
              as: SalesRep
          assert:
            - "Each filtered list returns exactly the one child created above (total_count == 1 per filter): line ${line_id}, lot ${lot_id}, allocation on the lot and on the line, plan ${cp_id}, booking ${booking_id}, requisition ${req_id}, sample ${sample_id}, certificate ${cert_id}, shipment ${ship_id}, order ${order_id}"
            - "GET /mill/material-lots?parent_lot_id=${lot_id} returns total_count == 0 (no splits performed)"

      - name: lot_split_conservation_and_parent_link
        claim_type: computed_read
        grounds: ["entities.MaterialLot.fields.parent_lot_id", "entities.MaterialLot.fields.usable_yards"]
        distinguishing_aspect: "Split is self-referential and conservative: splitting 6.5 yards off an AVAILABLE 20.0-yard lot creates a child with parent_lot_id set and usable 6.5 while the parent drops to 13.5 (13.5 + 6.5 == 20.0); splitting more than available fails."
        test_recipe:
          setup: ["PLANT lot AVAILABLE usable 20.0 (received 20.0, inspected PASS)"]
          setup_api_calls:
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 20.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 20.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 20.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
          trigger:
            - call: "POST /mill/material-lots/${lot_id}/split"
              payload: { yards_to_move: 6.5 }
              as: MaterialReceiver
              captures: { child_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/split"
              payload: { yards_to_move: 14.0 }
              as: MaterialReceiver
              captures: { err: $.data.error_id }
          assert:
            - "Child lot ${child_id}: status AVAILABLE, usable_yards == 6.5, parent_lot_id == ${lot_id}, ownership == PLANT"
            - "Parent lot ${lot_id}: usable_yards == 13.5 (conservation: 13.5 + 6.5 == 20.0)"
            - "Second split of 14.0 > 13.5 available: 422 ERR_INSUFFICIENT_YARDAGE"
            - "GET /mill/material-lots?parent_lot_id=${lot_id} returns exactly the child (total_count == 1)"

