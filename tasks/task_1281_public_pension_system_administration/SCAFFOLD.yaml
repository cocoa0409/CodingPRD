# =============================================================================
# SCAFFOLD — task_1281_public_pension_system_administration
# Public Pension System Administration (state/municipal)
# =============================================================================

scenario: |
  Public Pension System Administration (state/municipal): member enrollment & service credit accrual, service purchase (military/prior service) calculation & payment plan, contribution reporting from employers & reconciliation, retirement benefit calculation with final average salary & option elections, disability retirement application & medical review, cost-of-living adjustment application, return-to-work earnings limits & suspension, beneficiary/survivor benefit processing

domain_name: public-pension-administration
api_prefix: "/"

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PensionFund
    parent: null
    common_fields: true
    fields:
      - { name: fund_name, type: string, source: input, description: "Display name of the pension fund" }
      - { name: cola_rate_pct, type: number, source: input, description: "Annual COLA rate as decimal fraction (e.g. 0.025 = 2.5%)" }
      - { name: earnings_limit_annual_cents, type: integer, source: input, description: "Return-to-work calendar-year earnings limit in cents; suspension triggers only when YTD earnings strictly exceed this" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employer display name" }
      - { name: employer_code, type: string, source: input, description: "Unique employer reporting code", constraints: "unique across employers" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; employing unit at enrollment" }
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: hire_date, type: string, source: input, description: "ISO date YYYY-MM-DD; pension system entry date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE | RETIRED | SUSPENDED_RTW | DECEASED", default: ACTIVE }
      - { name: total_service_years, type: number, source: computed, description: "= round(sum(service_months over ACCEPTED ContributionLines)/12 + sum(years_purchased over COMPLETED ServicePurchases), 2)" }
      - { name: current_annual_salary_cents, type: integer, source: computed, description: "period_salary_cents of the ACCEPTED ContributionLine with the highest fiscal_year; ties broken by latest line created_at; null when no ACCEPTED line" }
      - { name: deceased_at, type: string, source: input, description: "ISO date of death, set via PATCH; null while living", default: null }

  - name: ContributionReport
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; reporting employer" }
      - { name: period_start, type: string, source: input, description: "ISO date; half-open interval [period_start, period_end)" }
      - { name: period_end, type: string, source: input, description: "ISO date; exclusive end; adjacency (next start == prior end) is allowed" }
      - { name: declared_total_cents, type: integer, source: input, description: "Employer-declared contribution total for the period" }
      - { name: accepted_total_cents, type: integer, source: computed, description: "sum(contribution_amount_cents) over lines with status ACCEPTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VARIANCE | RECONCILED", default: DRAFT }

  - name: ContributionLine
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> ContributionReport.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: fiscal_year, type: integer, source: input, description: "Calendar fiscal year this line credits; must fall inside the report period [period_start, period_end)" }
      - { name: period_salary_cents, type: integer, source: input, description: "Member salary for this fiscal year as reported by employer" }
      - { name: contribution_amount_cents, type: integer, source: input, description: "Contribution remitted for this member-year (expected 8% of salary; mismatch is a review decision, not a hard error)" }
      - { name: service_months, type: integer, source: input, description: "Months of service credit earned (1-12)", default: 12 }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED", default: PENDING }
      - { name: review_note, type: string, source: input, description: "Analyst note recorded at review", default: null }

  - name: ServicePurchase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: purchase_type, type: enum, source: input, description: "MILITARY | PRIOR_SERVICE" }
      - { name: service_period_start, type: string, source: input, description: "ISO date; CLOSED interval start of the period being purchased" }
      - { name: service_period_end, type: string, source: input, description: "ISO date; CLOSED interval end; any shared day with an already-credited fiscal year is an overlap" }
      - { name: years_purchased, type: number, source: input, description: "Years of service credit being purchased (2dp)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | QUOTED | PLAN_ACTIVE | COMPLETED | CANCELLED | EXPIRED", default: REQUESTED }
      - { name: flat_cost_cents, type: integer, source: computed, description: "FLAT variant cost (see service_purchase_cost); null until QUOTED" }
      - { name: actuarial_cost_cents, type: integer, source: computed, description: "ACTUARIAL variant cost; null until QUOTED" }
      - { name: cost_variant, type: enum, source: computed, description: "FLAT | ACTUARIAL — selected at quote per eligibility window" }
      - { name: quoted_cost_cents, type: integer, source: computed, description: "Selected cost (= flat_cost_cents or actuarial_cost_cents per cost_variant)" }
      - { name: quote_expires_at, type: string, source: computed, description: "ISO datetime = quoted_at + 90 days" }
      - { name: installment_count, type: integer, source: input, description: "Number of monthly installments chosen at accept (1-60)" }
      - { name: balance_due_cents, type: integer, source: computed, description: "quoted_cost_cents - sum(amount over APPLIED payments); 0 when COMPLETED or CANCELLED" }
      - { name: refunded_total_cents, type: integer, source: computed, description: "sum(amount over REFUNDED payments)", default: 0 }

  - name: PurchasePayment
    parent: null
    common_fields: true
    fields:
      - { name: purchase_id, type: string, source: system, description: "FK -> ServicePurchase.id" }
      - { name: sequence_number, type: integer, source: system, description: "1-based installment index" }
      - { name: amount_cents, type: integer, source: computed, description: "Installment amount per installment_schedule rounding rule" }
      - { name: due_date, type: string, source: computed, description: "ISO date; first of month, sequence_number months after accept month" }
      - { name: status, type: enum, source: system, description: "PENDING | APPLIED | REFUNDED", default: PENDING }
      - { name: applied_at, type: string, source: system, description: "ISO datetime when payment applied; null until APPLIED", default: null }

  - name: RetirementApplication
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: option_election, type: enum, source: input, description: "SINGLE_LIFE | JOINT_50 | JOINT_100" }
      - { name: beneficiary_name, type: string, source: input, description: "Required when option_election is JOINT_50 or JOINT_100", default: null }
      - { name: beneficiary_date_of_birth, type: string, source: input, description: "ISO date; required for JOINT options", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | RETURNED_FOR_CORRECTION | APPROVED | CANCELLED", default: DRAFT }
      - { name: provisional_monthly_cents, type: integer, source: computed, description: "Provisional estimate at submit (includes PENDING lines); null until SUBMITTED" }
      - { name: final_monthly_cents, type: integer, source: computed, description: "Final calculation at approve (ACCEPTED/RECONCILED data only); null until APPROVED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the analyst who last moved the application to UNDER_REVIEW; used for segregation-of-duties at approve" }

  - name: DisabilityApplication
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: disability_type, type: enum, source: input, description: "DUTY | NON_DUTY" }
      - { name: description, type: string, source: input, description: "Free-text description of the disability claim", default: null }
      - { name: status, type: enum, source: system, description: "UNDER_MEDICAL_REVIEW | APPROVED | DENIED", default: UNDER_MEDICAL_REVIEW }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured from the create request" }
      - { name: last_reviewer_user_id, type: string, source: system, description: "X-User-ID of the MedicalReviewer who rendered the most recent decision" }
      - { name: appeal_count, type: integer, source: system, description: "Number of appeals filed", default: 0 }
      - { name: decided_at, type: string, source: system, description: "ISO datetime of most recent decision; null until first decision", default: null }

  - name: Benefit
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: benefit_kind, type: enum, source: system, description: "SERVICE | DISABILITY" }
      - { name: monthly_amount_cents, type: integer, source: computed, description: "Current monthly benefit; updated by COLA runs" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }
      - { name: effective_date, type: string, source: system, description: "ISO date; first day of the month containing the approval date (logical clock)" }
      - { name: cola_applied_count, type: integer, source: system, description: "Number of COLA applications", default: 0 }
      - { name: rtw_calendar_year, type: integer, source: computed, description: "Calendar year of the current rtw_ytd accumulation bucket" }
      - { name: rtw_ytd_earnings_cents, type: integer, source: computed, description: "Return-to-work earnings accumulated for rtw_calendar_year", default: 0 }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; designating member" }
      - { name: full_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: relationship, type: string, source: input, description: "Relationship to member (free text)" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date" }
      - { name: status, type: enum, source: system, description: "DESIGNATED | REVOKED | CLAIM_FILED | PAYABLE | DENIED", default: DESIGNATED }
      - { name: claim_filed_at, type: string, source: system, description: "ISO datetime when survivor claim filed; null until CLAIM_FILED", default: null }
      - { name: survivor_monthly_cents, type: integer, source: computed, description: "Survivor benefit per survivor_benefit calc; null until PAYABLE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /members/{id} with status=INACTIVE"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /members/{id} with status=ACTIVE"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "system — on RetirementApplication APPROVED or DisabilityApplication APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "Any RetirementApplication of this member still in DRAFT, SUBMITTED, UNDER_REVIEW, or RETURNED_FOR_CORRECTION (other than the one just approved) -> CANCELLED"
      - from: RETIRED
        to: SUSPENDED_RTW
        trigger: "system — benefit rtw_ytd_earnings_cents strictly exceeds fund earnings_limit_annual_cents"
        actor: system
        preconditions: []
        side_effects:
          - "Linked Benefit (member_id = this member, benefit_kind in {SERVICE, DISABILITY}) status -> SUSPENDED"
      - from: SUSPENDED_RTW
        to: RETIRED
        trigger: "POST /benefits/{id}/reinstate on the linked benefit"
        actor: MemberServicesAnalyst
        preconditions:
          - "Linked benefit transitions SUSPENDED -> ACTIVE in the same request"
        side_effects: []
      - from: ACTIVE
        to: DECEASED
        trigger: "PATCH /members/{id} with deceased_at set"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects:
          - "Death cascade (shared): any Benefit of this member in ACTIVE or SUSPENDED -> TERMINATED; any ServicePurchase of this member in PLAN_ACTIVE or QUOTED or REQUESTED -> CANCELLED"
          - "Each purchase cancellation itself cascades: its APPLIED PurchasePayments -> REFUNDED and purchase.refunded_total_cents = prior sum of APPLIED amounts, balance_due_cents -> 0"
      - from: INACTIVE
        to: DECEASED
        trigger: "PATCH /members/{id} with deceased_at set"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects:
          - "Death cascade (shared) as above"
      - from: RETIRED
        to: DECEASED
        trigger: "PATCH /members/{id} with deceased_at set"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects:
          - "Death cascade (shared) as above"
      - from: SUSPENDED_RTW
        to: DECEASED
        trigger: "PATCH /members/{id} with deceased_at set"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects:
          - "Death cascade (shared) as above"

  - entity: ContributionReport
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /contribution-reports/{id}/submit"
        actor: EmployerClerk
        preconditions:
          - "At least one ContributionLine exists under the report (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /contribution-reports/{id}/finalize"
        actor: MemberServicesAnalyst
        preconditions:
          - "No line in PENDING (ERR_LINES_PENDING)"
          - "No line in REJECTED and accepted_total_cents == declared_total_cents; if any line is REJECTED the transition target is VARIANCE instead; if no line is REJECTED but accepted_total_cents != declared_total_cents -> ERR_RECONCILIATION_VARIANCE"
        side_effects: []
      - from: SUBMITTED
        to: VARIANCE
        trigger: "POST /contribution-reports/{id}/finalize"
        actor: MemberServicesAnalyst
        preconditions:
          - "No line in PENDING (ERR_LINES_PENDING)"
          - "At least one line in REJECTED"
        side_effects: []
      - from: VARIANCE
        to: RECONCILED
        trigger: "system — bubble-up on ContributionLine re-review (REJECTED -> ACCEPTED)"
        actor: system
        preconditions:
          - "After the review, no line remains in PENDING or REJECTED AND accepted_total_cents == declared_total_cents"
        side_effects: []

  - entity: ContributionLine
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /contribution-reports/{id}/lines/{lineId}/review with decision=ACCEPT"
        actor: MemberServicesAnalyst
        preconditions:
          - "Parent report status in {SUBMITTED, VARIANCE}"
        side_effects:
          - "report.accepted_total_cents recomputed (adds this line's contribution_amount_cents)"
          - "member.total_service_years recomputed (adds service_months/12)"
          - "member.current_annual_salary_cents recomputed"
          - "If report was VARIANCE and now fully accepted with accepted_total_cents == declared_total_cents: report -> RECONCILED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /contribution-reports/{id}/lines/{lineId}/review with decision=REJECT"
        actor: MemberServicesAnalyst
        preconditions:
          - "Parent report status in {SUBMITTED, VARIANCE}"
        side_effects:
          - "report.accepted_total_cents recomputed (line excluded)"
      - from: REJECTED
        to: ACCEPTED
        trigger: "POST /contribution-reports/{id}/lines/{lineId}/review with decision=ACCEPT"
        actor: MemberServicesAnalyst
        preconditions:
          - "Parent report status == VARIANCE"
        side_effects:
          - "report.accepted_total_cents recomputed (adds this line)"
          - "member.total_service_years recomputed (adds service_months/12)"
          - "member.current_annual_salary_cents recomputed"
          - "If no PENDING/REJECTED lines remain and accepted_total_cents == declared_total_cents: report -> RECONCILED"

  - entity: ServicePurchase
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /service-purchases/{id}/quote"
        actor: MemberServicesAnalyst
        preconditions:
          - "member.current_annual_salary_cents is not null (at least one ACCEPTED contribution line) — ERR_INVALID_STATE otherwise"
        side_effects:
          - "service_purchase_cost calculation runs: flat_cost_cents, actuarial_cost_cents, cost_variant, quoted_cost_cents, quote_expires_at set"
      - from: QUOTED
        to: PLAN_ACTIVE
        trigger: "POST /service-purchases/{id}/accept"
        actor: Member
        preconditions:
          - "Logical clock now <= quote_expires_at (ERR_QUOTE_EXPIRED; on this failure the purchase itself transitions QUOTED -> EXPIRED)"
          - "installment_count between 1 and 60 (ERR_INVALID_REQUEST)"
        side_effects:
          - "installment_schedule calculation runs: PurchasePayment rows 1..N created (PENDING)"
          - "balance_due_cents = quoted_cost_cents"
      - from: PLAN_ACTIVE
        to: COMPLETED
        trigger: "system — balance_due_cents reaches 0 after a payment application"
        actor: system
        preconditions: []
        side_effects:
          - "member.total_service_years += years_purchased (service credit posted)"
      - from: QUOTED
        to: EXPIRED
        trigger: "POST /service-purchases/{id}/accept attempted after quote_expires_at (lazy expiry)"
        actor: system
        preconditions: []
        side_effects:
          - "Request fails with ERR_QUOTE_EXPIRED; status set EXPIRED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /service-purchases/{id}/cancel, or system (member death cascade, member retirement approval)"
        actor: "Member | MemberServicesAnalyst | system"
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /service-purchases/{id}/cancel, or system (death/retirement cascade)"
        actor: "Member | MemberServicesAnalyst | system"
        preconditions: []
        side_effects: []
      - from: PLAN_ACTIVE
        to: CANCELLED
        trigger: "POST /service-purchases/{id}/cancel, or system (death/retirement cascade)"
        actor: "Member | MemberServicesAnalyst | system"
        preconditions: []
        side_effects:
          - "All APPLIED PurchasePayments -> REFUNDED; refunded_total_cents = sum of those amounts"
          - "balance_due_cents -> 0"

  - entity: PurchasePayment
    initial_state: PENDING
    terminal_states: [APPLIED, REFUNDED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /service-purchases/{id}/payments with payment_id"
        actor: "Member | MemberServicesAnalyst"
        preconditions:
          - "Parent purchase status == PLAN_ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "expected_purchase_version matches purchase.version (ERR_STALE_VERSION)"
        side_effects:
          - "applied_at set to logical clock; purchase.balance_due_cents -= amount_cents"
          - "purchase.version increments by 1"
          - "If balance_due_cents == 0: purchase -> COMPLETED and member.total_service_years += years_purchased"
      - from: APPLIED
        to: REFUNDED
        trigger: "system — parent purchase CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "purchase.refunded_total_cents += amount_cents"

  - entity: RetirementApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /retirement-applications/{id}/submit"
        actor: "Member | MemberServicesAnalyst"
        preconditions:
          - "member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
          - "member.total_service_years >= 5 (ERR_NOT_VESTED)"
          - "Member age at logical-clock date >= 60 (ERR_MEMBER_UNDER_RETIREMENT_AGE)"
        side_effects:
          - "benefit_estimate PROVISIONAL variant runs; provisional_monthly_cents stored"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /retirement-applications/{id}/review with outcome=REVIEW_OK"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects:
          - "reviewed_by_user_id = request X-User-ID"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /retirement-applications/{id}/review with outcome=RETURN"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects: []
      - from: RETURNED_FOR_CORRECTION
        to: UNDER_REVIEW
        trigger: "POST /retirement-applications/{id}/review with outcome=REVIEW_OK"
        actor: MemberServicesAnalyst
        preconditions: []
        side_effects:
          - "reviewed_by_user_id = request X-User-ID (review cycle may repeat without bound)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /retirement-applications/{id}/approve"
        actor: BenefitApprover
        preconditions:
          - "expected_application_version matches application.version (ERR_STALE_VERSION)"
          - "member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
          - "No ServicePurchase of this member in PLAN_ACTIVE (ERR_OUTSTANDING_BALANCE)"
          - "Approver X-User-ID != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "benefit_estimate FINAL variant runs; final_monthly_cents stored"
          - "Benefit created: benefit_kind=SERVICE, monthly_amount_cents=final_monthly_cents, status=ACTIVE, effective_date = first of approval month"
          - "member.status -> RETIRED"
          - "Member's other non-terminal RetirementApplications -> CANCELLED"
          - "Member's ServicePurchases in REQUESTED/QUOTED/PLAN_ACTIVE -> CANCELLED (with payment refund cascade on PLAN_ACTIVE)"
          - "application.version increments by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /retirement-applications/{id}/cancel, or system (member became RETIRED via another path)"
        actor: "Member | MemberServicesAnalyst | system"
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /retirement-applications/{id}/cancel, or system"
        actor: "Member | MemberServicesAnalyst | system"
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /retirement-applications/{id}/cancel, or system"
        actor: "Member | MemberServicesAnalyst | system"
        preconditions: []
        side_effects: []
      - from: RETURNED_FOR_CORRECTION
        to: CANCELLED
        trigger: "POST /retirement-applications/{id}/cancel, or system"
        actor: "Member | MemberServicesAnalyst | system"
        preconditions: []
        side_effects: []

  - entity: DisabilityApplication
    initial_state: UNDER_MEDICAL_REVIEW
    terminal_states: [APPROVED]
    transitions:
      - from: UNDER_MEDICAL_REVIEW
        to: APPROVED
        trigger: "POST /disability-applications/{id}/decision with outcome=APPROVE"
        actor: MedicalReviewer
        preconditions:
          - "member.status in {ACTIVE, INACTIVE} (ERR_MEMBER_NOT_ACTIVE)"
          - "If disability_type == NON_DUTY: member.total_service_years >= 5 (ERR_NOT_VESTED); DUTY has no vesting requirement"
          - "If appeal_count > 0: reviewer X-User-ID != last_reviewer_user_id (ERR_SEGREGATION_OF_DUTIES — fresh-eyes rule)"
        side_effects:
          - "disability_benefit calculation runs on FINAL input set"
          - "Benefit created: benefit_kind=DISABILITY, monthly_amount_cents per calculation, status=ACTIVE, effective_date = first of decision month"
          - "member.status -> RETIRED"
          - "Member's non-terminal RetirementApplications -> CANCELLED; ServicePurchases in REQUESTED/QUOTED/PLAN_ACTIVE -> CANCELLED (refund cascade)"
          - "decided_at and last_reviewer_user_id set"
      - from: UNDER_MEDICAL_REVIEW
        to: DENIED
        trigger: "POST /disability-applications/{id}/decision with outcome=DENY"
        actor: MedicalReviewer
        preconditions:
          - "If appeal_count > 0: reviewer X-User-ID != last_reviewer_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at and last_reviewer_user_id set"
      - from: DENIED
        to: UNDER_MEDICAL_REVIEW
        trigger: "POST /disability-applications/{id}/appeal"
        actor: "Member | MemberServicesAnalyst"
        preconditions:
          - "Logical clock now <= decided_at + 60 days (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects:
          - "appeal_count += 1 (review cycle reopens; a different MedicalReviewer must decide)"

  - entity: Benefit
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — POST /benefits/{id}/earnings-reports pushes rtw_ytd_earnings_cents strictly above fund earnings_limit_annual_cents"
        actor: system
        preconditions: []
        side_effects:
          - "member.status RETIRED -> SUSPENDED_RTW"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /benefits/{id}/reinstate"
        actor: MemberServicesAnalyst
        preconditions:
          - "benefit.status == SUSPENDED (ERR_INVALID_STATE otherwise)"
          - "rtw_ytd_earnings_cents for the current calendar year <= earnings_limit_annual_cents (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "member.status SUSPENDED_RTW -> RETIRED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system — member death cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system — member death cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Beneficiary
    initial_state: DESIGNATED
    terminal_states: [REVOKED, PAYABLE, DENIED]
    transitions:
      - from: DESIGNATED
        to: REVOKED
        trigger: "POST /beneficiaries/{id}/revoke"
        actor: Member
        preconditions:
          - "member.status != DECEASED (ERR_MEMBER_DECEASED — designations freeze at death)"
        side_effects: []
      - from: DESIGNATED
        to: CLAIM_FILED
        trigger: "POST /beneficiaries/{id}/file-claim"
        actor: SurvivorClaimant
        preconditions:
          - "The member's Benefit (member_id = beneficiary.member_id) has status == TERMINATED (ERR_BENEFIT_NOT_TERMINATED)"
          - "That benefit's option context entitles survivors: the originating application option_election != SINGLE_LIFE (ERR_NO_SURVIVOR_ENTITLEMENT)"
          - "Logical clock now <= member.deceased_at + 365 days (ERR_CLAIM_DEADLINE_PASSED)"
          - "claimant X-User-ID == beneficiary.id (ERR_FORBIDDEN otherwise)"
        side_effects:
          - "claim_filed_at set"
      - from: CLAIM_FILED
        to: PAYABLE
        trigger: "POST /beneficiaries/{id}/approve with outcome=APPROVE"
        actor: BenefitApprover
        preconditions:
          - "status == CLAIM_FILED (ERR_INVALID_STATE; a REVOKED designation never reaches this endpoint)"
        side_effects:
          - "survivor_benefit calculation runs; survivor_monthly_cents set"
      - from: CLAIM_FILED
        to: DENIED
        trigger: "POST /beneficiaries/{id}/approve with outcome=DENY"
        actor: BenefitApprover
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: retirement-approve-stale-application
    parent_entity: RetirementApplication
    write_endpoint: "POST /retirement-applications/{id}/approve"
    occ_field: expected_application_version
    description: |
      Approving a RetirementApplication whose version has advanced since the
      approver last observed it (e.g. a review cycle or a cascade bumped the
      version) is rejected as a stale write; the approver must re-read the
      application and re-issue the approval against the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: purchase-payment-stale-plan
    parent_entity: ServicePurchase
    write_endpoint: "POST /service-purchases/{id}/payments"
    occ_field: expected_purchase_version
    description: |
      Applying a payment against a ServicePurchase whose version has advanced
      since the payer last read it (e.g. a prior payment just bumped the
      version) is rejected as a stale write; the payer must re-read the
      purchase to confirm the balance before paying the next installment.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: fund-config-stale-write
    parent_entity: PensionFund
    write_endpoint: "PATCH /pension-funds/{id}"
    occ_field: expected_fund_version
    description: |
      Updating fund configuration (COLA rate, earnings limit) against a fund
      version the client has not observed is rejected as a stale write; the
      client must re-read the fund before re-issuing the configuration change.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: member_service_accrual
    trigger: "ContributionLine review to ACCEPTED (from PENDING or REJECTED); ContributionLine review to REJECTED; ServicePurchase reaches COMPLETED"
    algorithm: aggregation
    formula: |
      member.total_service_years =
        round( sum(l.service_months for l in ContributionLine
                   where l.member_id == member.id and l.status == ACCEPTED) / 12
             + sum(p.years_purchased for p in ServicePurchase
                   where p.member_id == member.id and p.status == COMPLETED), 2 )
      member.current_annual_salary_cents =
        period_salary_cents of the ACCEPTED ContributionLine with the highest
        fiscal_year; tie-break: latest line.created_at; null if none.
      Full recompute on every triggering event (not incremental).
    input_set: "ContributionLines with status == ACCEPTED only (PENDING and REJECTED excluded); ServicePurchases with status == COMPLETED only"
    precision: "2 decimal places for years, round_half_up; salary in integer cents"
    constants:
      MONTHS_PER_YEAR: 12

  - name: final_average_salary
    trigger: "invoked by benefit_estimate (both variants) and disability_benefit"
    algorithm: aggregation
    formula: |
      Let YS = the set of fiscal years having at least one included line,
      ranked by fiscal_year DESC; take the top 3 years.
      fas_annual_cents = round_half_up(
        sum(period_salary_cents of included lines in those 3 years)
        / count(distinct fiscal years taken) )
      If fewer than 3 included years exist, divide by the number that exist.
    input_set: "FINAL variant: ContributionLines with status == ACCEPTED only. PROVISIONAL variant: lines with status in {ACCEPTED, PENDING} (REJECTED excluded)"
    precision: "integer cents, round_half_up"
    constants:
      FAS_YEARS: 3

  - name: benefit_estimate
    trigger: "GET /members/{id}/benefit-estimate (explicit variant), RetirementApplication SUBMITTED (PROVISIONAL), RetirementApplication APPROVED (FINAL)"
    algorithm: aggregation
    formula: |
      service = total_service_years computed per member_service_accrual over
        the variant's input set (FINAL: ACCEPTED only; PROVISIONAL additionally
        counts PENDING lines' service_months).
      multiplier = 0.025 if service >= 25
                   else 0.022 if service >= 20
                   else 0.020 if service >= 10
                   else 0.017
      base_monthly = fas_annual_cents * multiplier * service / 12   (no intermediate rounding)
      age_diff = completed years between member.date_of_birth and beneficiary_date_of_birth
      option_factor = SINGLE_LIFE: 1.00
                      JOINT_50:  0.95 if age_diff <= 10 else 0.90
                      JOINT_100: 0.90 if age_diff <= 10 else 0.82
      monthly_cents = round_half_up(base_monthly * option_factor)   (single final rounding)
    input_set: "ContributionLines per variant filter (see final_average_salary); service years per variant filter"
    precision: "integer cents, round_half_up, single final rounding only"
    constants:
      TIER_25_MULT: 0.025
      TIER_20_MULT: 0.022
      TIER_10_MULT: 0.020
      BASE_MULT: 0.017
    variants:
      - name: PROVISIONAL
        when: "GET benefit-estimate with variant=PROVISIONAL; RetirementApplication submit"
        difference: "Includes PENDING contribution lines (salary and service months), projecting not-yet-reconciled service into FAS and service totals"
      - name: FINAL
        when: "GET benefit-estimate with variant=FINAL (default); RetirementApplication approve"
        difference: "Only ACCEPTED contribution lines count; identical data with an unreviewed PENDING line yields a lower FAS/service than PROVISIONAL"

  - name: service_purchase_cost
    trigger: "POST /service-purchases/{id}/quote"
    algorithm: tiered_pricing
    formula: |
      Both variants are always computed and stored; cost_variant selects quoted_cost_cents.
      FLAT:     flat_cost_cents = round_half_up(0.10 * current_annual_salary_cents * years_purchased)
      ACTUARIAL: years_to_60 = 60 - member age in completed years at quote date
                 age_factor = 0.35 if years_to_60 >= 10
                              else 0.28 if years_to_60 >= 5
                              else 0.22
                 actuarial_cost_cents = round_half_up(current_annual_salary_cents * years_purchased * age_factor)
      cost_variant = FLAT if hire_date + 5 years >= quote date (within 5 years of hire) else ACTUARIAL
      quoted_cost_cents = flat_cost_cents if cost_variant == FLAT else actuarial_cost_cents
      quote_expires_at = quote datetime + 90 days
    input_set: "Member hire_date, date_of_birth, current_annual_salary_cents; logical clock"
    precision: "integer cents, round_half_up"
    constants:
      FLAT_RATE_PCT: 0.10
      FLAT_WINDOW_YEARS: 5
      RETIREMENT_AGE: 60
      AGE_FACTOR_HI: 0.35
      AGE_FACTOR_MID: 0.28
      AGE_FACTOR_LO: 0.22
      QUOTE_TTL_DAYS: 90
    variants:
      - name: FLAT
        when: "Purchase quoted within 5 years of member hire_date"
        difference: "Flat 10% of current annual salary per year purchased; ignores age"
      - name: ACTUARIAL
        when: "Purchase quoted after the 5-year window"
        difference: "Salary * years * age-distance factor (0.35/0.28/0.22); for identical salary and years the two variants differ"

  - name: installment_schedule
    trigger: "POST /service-purchases/{id}/accept"
    algorithm: waterfall_allocation
    formula: |
      per = round_half_up(quoted_cost_cents / installment_count)
      payment[i].amount_cents = per                          for i = 1 .. installment_count-1
      payment[N].amount_cents = quoted_cost_cents - per * (installment_count - 1)
      # PINNED rounding order: round each of the first N-1 installments first;
      # the remainder (which may be larger than per) lands on the final payment.
      # The alternative order (sum-then-round) is NOT used.
      payment[i].due_date = first day of (accept month + i months)
      payment[i].status = PENDING
    input_set: "ServicePurchase.quoted_cost_cents, installment_count, logical clock"
    precision: "integer cents, round_half_up per installment; remainder on last"
    constants: {}

  - name: cola_application
    trigger: "POST /pension-funds/{id}/cola-runs"
    algorithm: threshold
    formula: |
      For each Benefit with status == ACTIVE (SUSPENDED and TERMINATED are excluded):
        months_active = whole calendar months between benefit.effective_date and the
                        logical-clock date (e.g. 2025-08-01 -> 2026-08-01 = 12)
        if months_active >= 12:
          monthly_amount_cents = round_half_up(monthly_amount_cents * (1 + fund.cola_rate_pct))
          cola_applied_count += 1
          result.applied_count += 1
        else:
          result.skipped_count += 1
      Boundary: months_active == 12 exactly IS eligible (>=).
    input_set: "Benefits with status == ACTIVE; PensionFund.cola_rate_pct; logical clock"
    precision: "integer cents, round_half_up"
    constants:
      COLA_MIN_MONTHS_ACTIVE: 12

  - name: rtw_earnings_accumulation
    trigger: "POST /benefits/{id}/earnings-reports"
    algorithm: threshold
    formula: |
      if benefit.rtw_calendar_year != request.calendar_year:
        benefit.rtw_calendar_year = request.calendar_year
        benefit.rtw_ytd_earnings_cents = 0          # annual reset at first report of a new year
      benefit.rtw_ytd_earnings_cents += request.amount_cents
      if benefit.rtw_ytd_earnings_cents > fund.earnings_limit_annual_cents:
        benefit.status = SUSPENDED; member.status: RETIRED -> SUSPENDED_RTW
      Boundary: ytd == earnings_limit_annual_cents exactly does NOT suspend (strict >).
    input_set: "Benefit (ACTIVE only), PensionFund.earnings_limit_annual_cents"
    precision: "integer cents"
    constants: {}

  - name: reconciliation_variance
    trigger: "ContributionLine review (either decision); POST /contribution-reports/{id}/finalize"
    algorithm: aggregation
    formula: |
      report.accepted_total_cents = sum(l.contribution_amount_cents for l in lines where status == ACCEPTED)
      variance_cents = report.declared_total_cents - report.accepted_total_cents
      finalize outcome:
        any line PENDING            -> ERR_LINES_PENDING (no status change)
        any line REJECTED           -> report.status = VARIANCE
        else variance_cents != 0    -> ERR_RECONCILIATION_VARIANCE (no status change)
        else                        -> report.status = RECONCILED
      Conserved quantity: at all times after submit,
        sum(ACCEPTED amounts) + sum(REJECTED amounts) + sum(PENDING amounts) == sum of all line amounts,
        and finalize requires accepted_total_cents == declared_total_cents.
    input_set: "All ContributionLines of the report (all statuses)"
    precision: "integer cents"
    constants: {}

  - name: disability_benefit
    trigger: "POST /disability-applications/{id}/decision with outcome=APPROVE"
    algorithm: aggregation
    formula: |
      fas = final_average_salary over the FINAL input set (ACCEPTED lines only)
      monthly_cents = round_half_up(fas * 0.60 / 12)
    input_set: "ContributionLines with status == ACCEPTED only"
    precision: "integer cents, round_half_up"
    constants:
      DISABILITY_FAS_PCT: 0.60

  - name: survivor_benefit
    trigger: "POST /beneficiaries/{id}/approve with outcome=APPROVE"
    algorithm: aggregation
    formula: |
      Let B = the member's TERMINATED Benefit; let opt = option_election of the
      RetirementApplication that created B (JOINT_50 or JOINT_100; SINGLE_LIFE is
      rejected earlier at file-claim).
      survivor_pct = 0.50 if opt == JOINT_50 else 1.00
      survivor_monthly_cents = round_half_up(B.monthly_amount_cents * survivor_pct)
      (monthly_amount_cents is the COLA-adjusted current amount at termination)
    input_set: "The member's TERMINATED Benefit and its originating RetirementApplication"
    precision: "integer cents, round_half_up"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role must be a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except none (all require auth)"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles; entity-backed ownership: EmployerClerk X-User-ID must equal the employer id of the report path, Member X-User-ID must equal the owning member id, SurvivorClaimant X-User-ID must equal the beneficiary id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 2.5
    category: auth
    check: "Segregation of duties: retirement approver != application reviewed_by_user_id; disability appeal decision reviewer != last_reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /retirement-applications/{id}/approve; POST /disability-applications/{id}/decision"
  - priority: 3
    category: existence
    check: "Every path id exists, validated left-to-right; FK references in body must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 3.5
    category: state
    check: "OCC: expected_<parent>_version in body equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /retirement-applications/{id}/approve; POST /service-purchases/{id}/payments; PATCH /pension-funds/{id}"
  - priority: 4
    category: state
    check: "Target resource is in a valid from-state for the requested transition (generic invalid-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 4.1
    category: state
    check: "Member lifecycle gates: submit/approve require member ACTIVE; operations on a DECEASED member's account (new purchases, new applications, revocations) are blocked"
    error_id: "ERR_MEMBER_NOT_ACTIVE | ERR_MEMBER_DECEASED"
    http_status: 409
    applies_to: "member-gated endpoints"
  - priority: 4.2
    category: state
    check: "Resource-specific status gates: purchase PLAN_ACTIVE for payments; benefit non-TERMINATED for earnings-reports; benefit TERMINATED for file-claim; report SUBMITTED/VARIANCE for line review"
    error_id: "ERR_PLAN_NOT_ACTIVE | ERR_BENEFIT_NOT_ACTIVE | ERR_BENEFIT_NOT_TERMINATED | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "payments, earnings-reports, reinstate, file-claim, review, finalize, submit"
  - priority: 5
    category: business_safety
    check: "A member may have at most one non-terminal RetirementApplication and at most one non-terminal DisabilityApplication"
    error_id: ERR_ACTIVE_APPLICATION_EXISTS
    http_status: 409
    applies_to: "POST /members/{id}/retirement-applications; POST /members/{id}/disability-applications"
  - priority: 6
    category: business_referential
    check: "Survivor claim requires a non-revoked designation and a survivor-entitling option election; JOINT options require beneficiary_name + beneficiary_date_of_birth at creation"
    error_id: "ERR_DESIGNATION_REVOKED | ERR_NO_SURVIVOR_ENTITLEMENT | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /beneficiaries/{id}/file-claim; POST /members/{id}/retirement-applications"
  - priority: 7
    category: business_temporal
    check: "Clock-relative windows: quote accept before quote_expires_at; appeal within 60 days of decided_at; claim within 365 days of member.deceased_at"
    error_id: "ERR_QUOTE_EXPIRED | ERR_APPEAL_WINDOW_CLOSED | ERR_CLAIM_DEADLINE_PASSED"
    http_status: 422
    applies_to: "accept, appeal, file-claim"
  - priority: 8
    category: business_constraint
    check: "Interval and uniqueness constraints: report periods of one employer are half-open and must not overlap (adjacency allowed); purchase service period (closed) must not share any day with an already-credited fiscal year of the same member; at most one line per member per fiscal_year per report; line fiscal_year inside report period; installment_count in 1..60"
    error_id: "ERR_REPORT_PERIOD_OVERLAP | ERR_PURCHASE_PERIOD_OVERLAP | ERR_DUPLICATE_LINE_PERIOD | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "report create, purchase create, line create, purchase accept"
  - priority: 9
    category: business_fiscal
    check: "Eligibility and money gates: vesting (>= 5.0 service years), retirement age >= 60, no PLAN_ACTIVE purchase at approve, finalize reconciliation rules"
    error_id: "ERR_NOT_VESTED | ERR_MEMBER_UNDER_RETIREMENT_AGE | ERR_OUTSTANDING_BALANCE | ERR_LINES_PENDING | ERR_RECONCILIATION_VARIANCE"
    http_status: 422
    applies_to: "submit, approve, disability decision, finalize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (default time 2026-08-01T00:00:00Z before any set) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads that fixed instant and never falls back to wall-clock time."
    roles: [FundAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All subsequent time-dependent rules evaluate against the new logical time"]

  # --- PensionFund ---
  - method: POST
    path: "/pension-funds"
    description: "Create a pension fund configuration"
    roles: [FundAdmin]
    code: 201
    input: [fund_name, cola_rate_pct, earnings_limit_annual_cents]
    output: PensionFund
    side_effects: []

  - method: GET
    path: "/pension-funds/{id}"
    description: "Get a pension fund"
    roles: [FundAdmin, MemberServicesAnalyst, BenefitApprover, MedicalReviewer, EmployerClerk, Member, SurvivorClaimant]
    code: 200
    input: []
    output: PensionFund
    side_effects: []

  - method: PATCH
    path: "/pension-funds/{id}"
    description: "Update fund configuration (OCC-guarded)"
    roles: [FundAdmin]
    code: 200
    input: [expected_fund_version, "cola_rate_pct?", "earnings_limit_annual_cents?"]
    output: PensionFund
    side_effects: ["increments PensionFund.version by 1"]

  - method: POST
    path: "/pension-funds/{id}/cola-runs"
    description: "Apply COLA to all eligible ACTIVE benefits (see cola_application)"
    roles: [FundAdmin]
    code: 200
    input: []
    output: { applied_count: integer, skipped_count: integer }
    side_effects: ["cola_application runs over all ACTIVE benefits; each updated benefit's version increments by 1"]

  # --- Employer ---
  - method: POST
    path: "/employers"
    description: "Register an employer reporting unit"
    roles: [FundAdmin]
    code: 201
    input: [name, employer_code]
    output: Employer
    side_effects: []

  - method: GET
    path: "/employers/{id}"
    description: "Get an employer"
    roles: [FundAdmin, MemberServicesAnalyst, EmployerClerk]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: GET
    path: "/employers/{id}/members"
    description: "List members employed by this employer"
    roles: [FundAdmin, MemberServicesAnalyst, EmployerClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/employers/{id}/contribution-reports"
    description: "List contribution reports of this employer"
    roles: [FundAdmin, MemberServicesAnalyst, EmployerClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ContributionReport[]
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/members"
    description: "Enroll a member"
    roles: [MemberServicesAnalyst]
    code: 201
    input: [employer_id, full_name, date_of_birth, hire_date]
    output: Member
    side_effects: ["status=ACTIVE, total_service_years=0, current_annual_salary_cents=null"]

  - method: GET
    path: "/members/{id}"
    description: "Get a member"
    roles: [FundAdmin, MemberServicesAnalyst, BenefitApprover, MedicalReviewer, EmployerClerk, Member, SurvivorClaimant]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: PATCH
    path: "/members/{id}"
    description: "Member lifecycle updates: status ACTIVE<->INACTIVE; deceased_at records death (fires death cascade)"
    roles: [MemberServicesAnalyst]
    code: 200
    input: ["status?", "deceased_at?"]
    output: Member
    side_effects: ["Death cascade when deceased_at set (benefit TERMINATED, purchases CANCELLED with refunds)"]

  - method: GET
    path: "/members/{id}/benefit-estimate"
    description: "Computed read of the benefit estimate; variant=PROVISIONAL|FINAL (default FINAL)"
    roles: [Member, MemberServicesAnalyst, BenefitApprover]
    code: 200
    input: ["variant?"]
    output: { fas_cents: integer, service_years: number, multiplier: number, monthly_single_life_cents: integer, variant: string }
    side_effects: []

  - method: GET
    path: "/members/{id}/contribution-lines"
    description: "List contribution lines of a member"
    roles: [FundAdmin, MemberServicesAnalyst, EmployerClerk, Member]
    code: 200
    input: ["fiscal_year?", "limit?", "offset?"]
    output: ContributionLine[]
    side_effects: []

  - method: GET
    path: "/members/{id}/service-purchases"
    description: "List service purchases of a member"
    roles: [FundAdmin, MemberServicesAnalyst, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: ServicePurchase[]
    side_effects: []

  - method: GET
    path: "/members/{id}/retirement-applications"
    description: "List retirement applications of a member"
    roles: [FundAdmin, MemberServicesAnalyst, BenefitApprover, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: RetirementApplication[]
    side_effects: []

  - method: GET
    path: "/members/{id}/disability-applications"
    description: "List disability applications of a member"
    roles: [FundAdmin, MemberServicesAnalyst, MedicalReviewer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: DisabilityApplication[]
    side_effects: []

  - method: GET
    path: "/members/{id}/benefits"
    description: "List benefits of a member"
    roles: [FundAdmin, MemberServicesAnalyst, BenefitApprover, Member, SurvivorClaimant]
    code: 200
    input: ["limit?", "offset?"]
    output: Benefit[]
    side_effects: []

  - method: GET
    path: "/members/{id}/beneficiaries"
    description: "List beneficiary designations of a member"
    roles: [FundAdmin, MemberServicesAnalyst, BenefitApprover, Member, SurvivorClaimant]
    code: 200
    input: ["limit?", "offset?"]
    output: Beneficiary[]
    side_effects: []

  # --- Contribution reporting & reconciliation ---
  - method: POST
    path: "/employers/{id}/contribution-reports"
    description: "Create a contribution report for an employer (period half-open, no overlap with the employer's other reports)"
    roles: [EmployerClerk]
    code: 201
    input: [period_start, period_end, declared_total_cents]
    output: ContributionReport
    side_effects: ["status=DRAFT, accepted_total_cents=0"]

  - method: GET
    path: "/contribution-reports/{id}"
    description: "Get a contribution report"
    roles: [FundAdmin, MemberServicesAnalyst, EmployerClerk]
    code: 200
    input: []
    output: ContributionReport
    side_effects: []

  - method: POST
    path: "/contribution-reports/{id}/lines"
    description: "Add a contribution line to a DRAFT report"
    roles: [EmployerClerk]
    code: 201
    input: [member_id, fiscal_year, period_salary_cents, contribution_amount_cents, "service_months?"]
    output: ContributionLine
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/contribution-reports/{id}/lines"
    description: "List lines of a report"
    roles: [FundAdmin, MemberServicesAnalyst, EmployerClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ContributionLine[]
    side_effects: []

  - method: POST
    path: "/contribution-reports/{id}/submit"
    description: "Submit a report for review"
    roles: [EmployerClerk]
    code: 200
    input: []
    output: ContributionReport
    side_effects: ["status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/contribution-reports/{id}/lines/{lineId}/review"
    description: "Analyst accepts or rejects a line (decision=ACCEPT|REJECT); re-review of REJECTED lines allowed while report is in VARIANCE"
    roles: [MemberServicesAnalyst]
    code: 200
    input: [decision, "review_note?"]
    output: ContributionLine
    side_effects: ["reconciliation_variance recompute; member service/salary recompute on ACCEPT; VARIANCE bubble-up to RECONCILED when complete"]

  - method: POST
    path: "/contribution-reports/{id}/finalize"
    description: "Close review: SUBMITTED -> RECONCILED or VARIANCE per reconciliation_variance"
    roles: [MemberServicesAnalyst]
    code: 200
    input: []
    output: ContributionReport
    side_effects: ["report status per reconciliation_variance"]

  # --- Service purchase ---
  - method: POST
    path: "/members/{id}/service-purchases"
    description: "Request a service purchase (military/prior service)"
    roles: [Member, MemberServicesAnalyst]
    code: 201
    input: [purchase_type, service_period_start, service_period_end, years_purchased]
    output: ServicePurchase
    side_effects: ["status=REQUESTED; closed-interval overlap check against credited fiscal years (ERR_PURCHASE_PERIOD_OVERLAP)"]

  - method: GET
    path: "/service-purchases/{id}"
    description: "Get a service purchase"
    roles: [FundAdmin, MemberServicesAnalyst, Member]
    code: 200
    input: []
    output: ServicePurchase
    side_effects: []

  - method: POST
    path: "/service-purchases/{id}/quote"
    description: "Compute and pin the purchase cost quote (both variants stored; selection per eligibility window)"
    roles: [MemberServicesAnalyst]
    code: 200
    input: []
    output: ServicePurchase
    side_effects: ["service_purchase_cost runs; status REQUESTED -> QUOTED"]

  - method: POST
    path: "/service-purchases/{id}/accept"
    description: "Member accepts quote and opens an installment plan"
    roles: [Member, MemberServicesAnalyst]
    code: 200
    input: [installment_count]
    output: ServicePurchase
    side_effects: ["installment_schedule runs; PurchasePayment rows created; status QUOTED -> PLAN_ACTIVE (or -> EXPIRED with ERR_QUOTE_EXPIRED when past expiry)"]

  - method: POST
    path: "/service-purchases/{id}/payments"
    description: "Apply a specific PENDING installment payment (OCC-guarded on purchase version)"
    roles: [Member, MemberServicesAnalyst]
    code: 200
    input: [payment_id, expected_purchase_version]
    output: ServicePurchase
    side_effects: ["payment PENDING -> APPLIED; balance_due_cents recomputed; increments ServicePurchase.version by 1; completion cascade when balance reaches 0"]

  - method: POST
    path: "/service-purchases/{id}/cancel"
    description: "Cancel a non-terminal purchase; APPLIED payments are refunded"
    roles: [Member, MemberServicesAnalyst]
    code: 200
    input: []
    output: ServicePurchase
    side_effects: ["status -> CANCELLED; APPLIED payments -> REFUNDED; refunded_total_cents set; balance_due_cents -> 0"]

  - method: GET
    path: "/service-purchases/{id}/payments"
    description: "List installment payments of a purchase"
    roles: [FundAdmin, MemberServicesAnalyst, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: PurchasePayment[]
    side_effects: []

  # --- Retirement application ---
  - method: POST
    path: "/members/{id}/retirement-applications"
    description: "Create a retirement application (DRAFT) with option election"
    roles: [Member, MemberServicesAnalyst]
    code: 201
    input: [option_election, "beneficiary_name?", "beneficiary_date_of_birth?"]
    output: RetirementApplication
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/retirement-applications/{id}"
    description: "Get a retirement application"
    roles: [FundAdmin, MemberServicesAnalyst, BenefitApprover, Member]
    code: 200
    input: []
    output: RetirementApplication
    side_effects: []

  - method: POST
    path: "/retirement-applications/{id}/submit"
    description: "Submit application; computes provisional estimate"
    roles: [Member, MemberServicesAnalyst]
    code: 200
    input: []
    output: RetirementApplication
    side_effects: ["benefit_estimate PROVISIONAL runs; status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/retirement-applications/{id}/review"
    description: "Analyst review: outcome=REVIEW_OK -> UNDER_REVIEW; outcome=RETURN -> RETURNED_FOR_CORRECTION (cycle allowed)"
    roles: [MemberServicesAnalyst]
    code: 200
    input: [outcome, "review_note?"]
    output: RetirementApplication
    side_effects: ["reviewed_by_user_id recorded on REVIEW_OK"]

  - method: POST
    path: "/retirement-applications/{id}/approve"
    description: "Final approval (BenefitApprover, OCC-guarded, segregated from reviewer)"
    roles: [BenefitApprover]
    code: 200
    input: [expected_application_version]
    output: RetirementApplication
    side_effects: ["benefit_estimate FINAL runs; Benefit created ACTIVE; member -> RETIRED; sibling applications CANCELLED; open purchases CANCELLED with refunds; increments RetirementApplication.version by 1"]

  - method: POST
    path: "/retirement-applications/{id}/cancel"
    description: "Cancel a non-terminal retirement application"
    roles: [Member, MemberServicesAnalyst]
    code: 200
    input: []
    output: RetirementApplication
    side_effects: ["status -> CANCELLED"]

  # --- Disability application ---
  - method: POST
    path: "/members/{id}/disability-applications"
    description: "File a disability retirement application (enters UNDER_MEDICAL_REVIEW immediately)"
    roles: [Member, MemberServicesAnalyst]
    code: 201
    input: [disability_type, "description?"]
    output: DisabilityApplication
    side_effects: ["status=UNDER_MEDICAL_REVIEW; submitted_by_user_id captured from X-User-ID"]

  - method: GET
    path: "/disability-applications/{id}"
    description: "Get a disability application"
    roles: [FundAdmin, MemberServicesAnalyst, MedicalReviewer, BenefitApprover, Member]
    code: 200
    input: []
    output: DisabilityApplication
    side_effects: []

  - method: POST
    path: "/disability-applications/{id}/decision"
    description: "Medical review decision (outcome=APPROVE|DENY); appeals require a different reviewer (fresh-eyes)"
    roles: [MedicalReviewer]
    code: 200
    input: [outcome, "review_note?"]
    output: DisabilityApplication
    side_effects: ["on APPROVE: disability_benefit runs, Benefit created, member -> RETIRED, open applications/purchases cancelled with refunds"]

  - method: POST
    path: "/disability-applications/{id}/appeal"
    description: "Appeal a DENIED decision within 60 days; reopens medical review"
    roles: [Member, MemberServicesAnalyst]
    code: 200
    input: []
    output: DisabilityApplication
    side_effects: ["status DENIED -> UNDER_MEDICAL_REVIEW; appeal_count += 1"]

  # --- Benefit ---
  - method: GET
    path: "/benefits/{id}"
    description: "Get a benefit"
    roles: [FundAdmin, MemberServicesAnalyst, BenefitApprover, Member, SurvivorClaimant]
    code: 200
    input: []
    output: Benefit
    side_effects: []

  - method: POST
    path: "/benefits/{id}/earnings-reports"
    description: "Report return-to-work earnings for a calendar year (allowed on ACTIVE or SUSPENDED benefits); suspends an ACTIVE benefit when YTD strictly exceeds the fund limit; first report of a new calendar year resets the YTD bucket"
    roles: [Member, MemberServicesAnalyst]
    code: 200
    input: [calendar_year, amount_cents]
    output: Benefit
    side_effects: ["rtw_earnings_accumulation runs; may suspend benefit and move member to SUSPENDED_RTW"]

  - method: POST
    path: "/benefits/{id}/reinstate"
    description: "Reinstate a SUSPENDED benefit (current-year YTD must be within the limit)"
    roles: [MemberServicesAnalyst]
    code: 200
    input: []
    output: Benefit
    side_effects: ["benefit SUSPENDED -> ACTIVE; member SUSPENDED_RTW -> RETIRED"]

  # --- Beneficiary / survivor processing ---
  - method: POST
    path: "/members/{id}/beneficiaries"
    description: "Designate a beneficiary"
    roles: [Member, MemberServicesAnalyst]
    code: 201
    input: [full_name, relationship, date_of_birth]
    output: Beneficiary
    side_effects: ["status=DESIGNATED"]

  - method: POST
    path: "/beneficiaries/{id}/revoke"
    description: "Revoke a designation (not after member death)"
    roles: [Member, MemberServicesAnalyst]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["status DESIGNATED -> REVOKED"]

  - method: POST
    path: "/beneficiaries/{id}/file-claim"
    description: "File a survivor claim (claimant acts as the Beneficiary entity)"
    roles: [SurvivorClaimant, MemberServicesAnalyst]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["status DESIGNATED -> CLAIM_FILED; claim_filed_at set"]

  - method: POST
    path: "/beneficiaries/{id}/approve"
    description: "Approve or deny a survivor claim (outcome=APPROVE|DENY)"
    roles: [BenefitApprover]
    code: 200
    input: [outcome, "denial_reason?"]
    output: Beneficiary
    side_effects: ["on APPROVE: survivor_benefit runs; survivor_monthly_cents set; status CLAIM_FILED -> PAYABLE"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership check fails (clerk vs employer, member vs own records, claimant vs beneficiary)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Retirement approver equals reviewed_by_user_id, or disability appeal reviewer equals last_reviewer_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum value, fiscal_year outside report period, installment_count out of 1..60, JOINT option missing beneficiary fields, submit of empty report" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid from-state for the requested transition (e.g. approve a DRAFT/CANCELLED application, reinstate an ACTIVE benefit, re-cancel, pay a non-PENDING payment, review line on DRAFT report, finalize a DRAFT/RECONCILED report)" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member lifecycle gate failed: submit/approve/disability decision requires ACTIVE (or ACTIVE/INACTIVE for disability)" }
  - { id: ERR_MEMBER_DECEASED, http: 409, condition: "Operation blocked because member is DECEASED (new purchases, new applications, designation revocation)" }
  - { id: ERR_ACTIVE_APPLICATION_EXISTS, http: 409, condition: "Member already has a non-terminal application of the same type" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Accept attempted after quote_expires_at; purchase transitions QUOTED -> EXPIRED" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Payment attempted on a purchase not in PLAN_ACTIVE" }
  - { id: ERR_BENEFIT_NOT_ACTIVE, http: 409, condition: "Earnings report attempted on a TERMINATED benefit (ACTIVE and SUSPENDED benefits accept earnings reports — a suspended retiree may still be working)" }
  - { id: ERR_BENEFIT_NOT_TERMINATED, http: 409, condition: "Survivor claim filed while the member's benefit is not TERMINATED" }
  - { id: ERR_NOT_VESTED, http: 422, condition: "total_service_years < 5.0 where vesting is required (retirement submit, NON_DUTY disability approval)" }
  - { id: ERR_MEMBER_UNDER_RETIREMENT_AGE, http: 422, condition: "Member age at submit is under 60 completed years" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 422, condition: "Retirement approval while a ServicePurchase of the member is PLAN_ACTIVE" }
  - { id: ERR_LINES_PENDING, http: 422, condition: "Finalize attempted with PENDING lines remaining" }
  - { id: ERR_RECONCILIATION_VARIANCE, http: 422, condition: "Finalize with no REJECTED lines but accepted_total_cents != declared_total_cents (unexplained variance)" }
  - { id: ERR_DUPLICATE_LINE_PERIOD, http: 409, condition: "A line for the same member and fiscal_year already exists in the report" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report period (half-open) overlaps another report of the same employer; adjacency (start == prior end) is allowed" }
  - { id: ERR_PURCHASE_PERIOD_OVERLAP, http: 409, condition: "Purchase service period (closed interval) shares at least one day with a fiscal year already credited (ACCEPTED line) for the member" }
  - { id: ERR_DESIGNATION_REVOKED, http: 422, condition: "Survivor claim filed on a REVOKED designation" }
  - { id: ERR_NO_SURVIVOR_ENTITLEMENT, http: 422, condition: "Survivor claim where the originating retirement option was SINGLE_LIFE" }
  - { id: ERR_CLAIM_DEADLINE_PASSED, http: 422, condition: "Claim filed more than 365 days after member.deceased_at" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal filed more than 60 days after decided_at" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FundAdmin
    description: "Pension fund administrator: fund configuration, COLA runs, employer registration, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /pension-funds, PATCH /pension-funds/{id}, POST /pension-funds/{id}/cola-runs"
      - "POST /employers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: MemberServicesAnalyst
    description: "Fund caseworker: enrollment, contribution line review and finalize, purchase quotes, application intake/review, benefit reinstatement"
    identity: opaque
    exclusive_operations:
      - "POST /members, PATCH /members/{id}"
      - "POST /contribution-reports/{id}/lines/{lineId}/review, POST /contribution-reports/{id}/finalize"
      - "POST /service-purchases/{id}/quote"
      - "POST /retirement-applications/{id}/review"
      - "POST /benefits/{id}/reinstate"
    shared_operations:
      - "Member-facing creates (purchases, applications, beneficiaries, payments, earnings-reports, cancels, appeals) which the analyst may file on a member's behalf"
      - "All GET endpoints"

  - name: BenefitApprover
    description: "Approving authority for retirement approvals and survivor claims; must not be the caseworker who reviewed the case"
    identity: opaque
    exclusive_operations:
      - "POST /retirement-applications/{id}/approve"
      - "POST /beneficiaries/{id}/approve"
    shared_operations:
      - "All GET endpoints"

  - name: MedicalReviewer
    description: "Independent medical reviewer for disability cases; appeal decisions require a different reviewer than the prior decision"
    identity: opaque
    exclusive_operations:
      - "POST /disability-applications/{id}/decision"
    shared_operations:
      - "All GET endpoints"

  - name: EmployerClerk
    description: "Employer reporting clerk; X-User-ID equals the Employer id and may only touch that employer's reports"
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /employers/{id}/contribution-reports"
      - "POST /contribution-reports/{id}/lines"
      - "POST /contribution-reports/{id}/submit"
    shared_operations:
      - "GET endpoints for own employer, its reports, lines, and members"

  - name: Member
    description: "Pension member; X-User-ID equals the Member id; may act only on own records"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{id}/service-purchases, /retirement-applications, /disability-applications, /beneficiaries (self-service creation)"
      - "POST /service-purchases/{id}/accept, /payments, /cancel (own purchases)"
      - "POST /retirement-applications/{id}/submit, /cancel (own applications)"
      - "POST /disability-applications/{id}/appeal (own applications)"
      - "POST /benefits/{id}/earnings-reports (own benefit)"
      - "POST /beneficiaries/{id}/revoke (own designations)"
    shared_operations:
      - "GET endpoints for own records"

  - name: SurvivorClaimant
    description: "Designated beneficiary filing a survivor claim; X-User-ID equals the Beneficiary id"
    identity: "entity_backed:Beneficiary"
    exclusive_operations:
      - "POST /beneficiaries/{id}/file-claim (own designation)"
    shared_operations:
      - "GET /members/{id}/beneficiaries, GET /members/{id}/benefits, GET /benefits/{id}"
