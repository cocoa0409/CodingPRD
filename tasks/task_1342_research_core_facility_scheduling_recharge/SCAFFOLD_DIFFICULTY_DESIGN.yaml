            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /training-records/${t1}/revoke", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
          trigger:
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { err: $.data.error_id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t2: $.data.id } }
            - { call: "POST /training-records/${t2}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { st: $.data.status, est: $.data.estimated_charge_cents } }
          assert:
            - "First approve after revocation: error_id == ERR_TRAINING_REQUIRED with HTTP 422; booking stays REQUESTED"
            - "The REVOKED record does not block creating a replacement record (uniqueness covers only non-REVOKED records)"
            - "Second approve with fresh CERTIFIED record: status == APPROVED, estimated_charge_cents == 18000"

      - name: usage_log_gated_by_booking_completion
        grounds:
          - state_machines.UsageLog.DRAFT_to_SUBMITTED
          - state_machines.Booking.IN_PROGRESS_to_COMPLETED
          - validations[priority=39]
        distinguishing_aspect: |
          Pair UsageLog -> Booking: creating a usage log against an APPROVED
          (not yet completed) booking fails with ERR_BOOKING_NOT_COMPLETED; the
          same call succeeds once the booking is COMPLETED.
        test_recipe:
          setup:
            - "Canonical stack; b1 APPROVED 2026-09-01 09:00-10:30 (never checked in); later checked in and completed"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
          trigger:
            - { call: "POST /usage-logs", payload: { booking_id: "${b1}", actual_start_at: "2026-09-01T09:00:00Z", actual_end_at: "2026-09-01T10:30:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:30:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs", payload: { booking_id: "${b1}", actual_start_at: "2026-09-01T09:00:00Z", actual_end_at: "2026-09-01T10:30:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { ul1: $.data.id, st: $.data.status } }
          assert:
            - "While APPROVED: error_id == ERR_BOOKING_NOT_COMPLETED with HTTP 422"
            - "After COMPLETED: creation succeeds with status == DRAFT and logged_by == staff-1"
            - "UsageLog.${ul1} denormalizes instrument_id == ${i1} and user_id == ${u1} from the booking"

      - name: rate_activation_gated_by_fiscal_year_state
        grounds:
          - state_machines.RateSet.APPROVED_to_EFFECTIVE
          - state_machines.FiscalYearPeriod.OPEN_to_CLOSED
          - validations[priority=8]
        distinguishing_aspect: |
          Pair RateSet -> FiscalYearPeriod: an APPROVED rate set whose
          effective_from already passed still activates only while its fiscal
          year is OPEN; after the FY close the identical activate call fails
          with ERR_FY_CLOSED.
        test_recipe:
          setup:
            - "Instrument i1; FY2027 period; rs27 for 2027 (effective_from 2026-07-01T00:00:00Z, already in the past) submitted and APPROVED while FY2027 is OPEN; FY2027 then CLOSED (no batches, no entries -> surplus 0)"
          setup_api_calls:
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2027 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { fy27: $.data.id } }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2027, effective_from: "2026-07-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12500, external_rate_cents_per_hour: 19000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs27: $.data.id } }
            - { call: "POST /rate-sets/${rs27}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs27}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { st_pre: $.data.status } }
            - { call: "POST /fiscal-years/${fy27}/close", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /rate-sets/${rs27}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
          assert:
            - "Before the close the set reached APPROVED (status == APPROVED while FY OPEN)"
            - "After the close: activate yields error_id == ERR_FY_CLOSED with HTTP 409; the set remains APPROVED"
            - "effective_from in the past does not rescue activation once the fiscal year is CLOSED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (3 instances, different interval
  # semantics on different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: booking_overlap_buffered_half_open
        grounds:
          - validations[priority=16]
          - entities.Instrument.fields.booking_buffer_minutes
        distinguishing_aspect: |
          Resource = instrument booking calendar; semantics = half-open
          [start, end + buffer): a follow-up booking starting at 10:30 collides
          with a 09:00-10:30 APPROVED booking (buffered end 11:00), while one
          starting exactly AT 11:00 is allowed (adjacency at the buffered edge
          is not an intersection).
        test_recipe:
          setup:
            - "Canonical stack; b1 by u1 APPROVED 2026-09-01 09:00-10:30 (occupies [09:00, 11:00) with the 30-min buffer); u2 EXTERNAL with CERTIFIED training on i1"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /users", payload: { full_name: "Eve Ext", email: "eve@acme.com", affiliation: "EXTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u2: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /training-records", payload: { user_id: "${u2}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t2: $.data.id } }
            - { call: "POST /training-records/${t2}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
          trigger:
            - { call: "POST /bookings", payload: { user_id: "${u2}", instrument_id: "${i1}", start_at: "2026-09-01T10:30:00Z", end_at: "2026-09-01T12:00:00Z", priority: "STANDARD" }, as: ExternalClient, as_user_id: "${u2}", captures: { err: $.data.error_id } }
            - { call: "POST /bookings", payload: { user_id: "${u2}", instrument_id: "${i1}", start_at: "2026-09-01T11:00:00Z", end_at: "2026-09-01T12:00:00Z", priority: "STANDARD" }, as: ExternalClient, as_user_id: "${u2}", captures: { b3: $.data.id, st3: $.data.status } }
          assert:
            - "10:30 start: error_id == ERR_BOOKING_OVERLAP with HTTP 409 (10:30 < buffered end 11:00)"
            - "11:00 start: succeeds, status == REQUESTED (adjacency at the buffered edge is allowed)"
            - "Booking.${b1} remains APPROVED and untouched"

      - name: downtime_closed_interval_touch_conflicts
        grounds:
          - validations[priority=17]
          - entities.DowntimeEvent.fields.end_at
        distinguishing_aspect: |
          Resource = instrument downtime calendar; semantics = CLOSED interval
          with NO buffer: a booking ending exactly at the downtime's start
          (10:30-11:00 vs downtime 11:00-13:00) CONFLICTS — the touching
          endpoint collides, in deliberate contrast to booking-vs-booking
          adjacency which is allowed. A booking ending one minute earlier
          (10:59) is accepted.
        test_recipe:
          setup:
            - "Canonical stack; CONFIRMED downtime on i1 for 2026-09-01T11:00:00Z-13:00:00Z (UNSCHEDULED_FAILURE, future window -> instrument stays AVAILABLE)"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /downtime-events", payload: { instrument_id: "${i1}", kind: "UNSCHEDULED_FAILURE", start_at: "2026-09-01T11:00:00Z", end_at: "2026-09-01T13:00:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { dt1: $.data.id } }
            - { call: "POST /downtime-events/${dt1}/confirm", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "GET /instruments/${i1}", payload: {}, as: FacilityAdmin, as_user_id: "admin-1", captures: { i_status: $.data.status } }
          trigger:
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T10:30:00Z", end_at: "2026-09-01T11:00:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { err: $.data.error_id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T10:59:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b2: $.data.id, st2: $.data.status } }
          assert:
            - "Instrument stays AVAILABLE after confirming a FUTURE-window downtime (i_status == AVAILABLE)"
            - "Booking ending exactly at 11:00:00Z: error_id == ERR_DOWNTIME_CONFLICT with HTTP 409 (closed-interval touch collides)"
            - "Booking ending at 10:59:00Z: succeeds, status == REQUESTED"

      - name: contract_coverage_date_adjacency
        grounds:
          - validations[priority=18]
          - state_machines.MaintenanceContract
        distinguishing_aspect: |
          Resource = maintenance-contract coverage on one instrument; semantics
          = inclusive DATE windows: 2026-06-01..2027-05-31 overlaps the existing
          2026-01-01..2026-12-31 contract, but 2027-01-01..2027-12-31 is exactly
          adjacent (day after the inclusive end) and is allowed — date
          granularity, no instant-level touch rule.
        test_recipe:
          setup:
            - "Instrument i1 with contract c1 covering 2026-01-01..2026-12-31 at 50000 cents/yr"
          setup_api_calls:
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /maintenance-contracts", payload: { instrument_id: "${i1}", vendor: "Bruker Service", sla_response_hours: 24, coverage_start: "2026-01-01", coverage_end: "2026-12-31", annual_cost_cents: 50000 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /maintenance-contracts", payload: { instrument_id: "${i1}", vendor: "OtherVendor", sla_response_hours: 48, coverage_start: "2026-06-01", coverage_end: "2027-05-31", annual_cost_cents: 30000 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
            - { call: "POST /maintenance-contracts", payload: { instrument_id: "${i1}", vendor: "OtherVendor", sla_response_hours: 48, coverage_start: "2027-01-01", coverage_end: "2027-12-31", annual_cost_cents: 30000 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { c3: $.data.id, st3: $.data.status } }
          assert:
            - "Overlapping window: error_id == ERR_CONTRACT_OVERLAP with HTTP 409"
            - "Adjacent window starting the day after the inclusive end: succeeds, status == ACTIVE"
            - "GET /maintenance-contracts?instrument_id=${i1} returns exactly 2 contracts"

  # ===========================================================================
  # Rule 9 — compensating_invariant (3 instances, different conserved
  # quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_budget_bill_writeoff_conservation
        grounds:
          - calculations.grant_budget_available
          - state_machines.RechargeEntry.DISPUTED_to_WRITTEN_OFF
        distinguishing_aspect: |
          Conserved quantity = grant budget cents: billing (+15000 used) paired
          with the write-off (-15000 credit) leaves budget_used_cents and
          budget_available_cents exactly as before the pair; the invariant
          budget_used == Σ net over {PENDING,BILLED,PAID,DISPUTED} holds at
          every step.
        test_recipe:
          setup:
            - "Canonical stack; b1 completed with 74 actual min -> e1 (net 15000) PENDING in batch 2026-09; batch finalized (e1 BILLED); batch 2026-10 OPEN; e1 disputed by the owner"
