          setup:
            - "Leased OA ACTIVE over 68,300 sf, term 2027-01-01..2036-12-31; 2027 tax statement actual 460 recorded"
            - "Alteration A1: estimated 6,000,000, work 2035-09-01..2035-12-05, approved AMORTIZED (window 2036-01..2036-12 = exactly 12 months), completed 2035-12-10 -> monthly 519,160 starting 2036-01"
            - "Alteration A2: estimated 3,000,000, work 2036-03-01..2036-04-30, approved LUMP_SUM (lump_charge_status PENDING)"
            - "Bills generated for 2036-01 through 2036-06 (six amortization payments applied to A1)"
