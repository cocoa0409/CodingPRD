scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, retrieval, defaults, not-found, validation
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_created_with_defaults
        claim_type: creation_defaults
        grounds: [entities.Customer.fields.outstanding_balance_cents, entities.Customer.fields.status]
        distinguishing_aspect: "New customer gets outstanding_balance_cents=0 and status=ACTIVE without client input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /lofts/customers"
              payload: { full_name: "New Cust", email: "n@x.com", credit_limit_cents: 100000 }
              as: LoftManager
              captures: { cid: $.data.id }
          assert:
            - "Customer.${cid}.outstanding_balance_cents == 0"
            - "Customer.${cid}.status == ACTIVE"
            - "Customer.${cid}.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: not_found
        grounds: [errors.ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent customer UUID returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /lofts/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LoftManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RESOURCE_NOT_FOUND"
            - "http_status == 404"

      - name: create_customer_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Customer.fields.credit_limit_cents, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field credit_limit_cents → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /lofts/customers"
              payload: { full_name: "No Limit" }
              as: LoftManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: boat_created_with_mast_status_default_stepped
        claim_type: creation_defaults
        grounds: [entities.Boat.fields.mast_status, entities.Boat.fields.status]
        distinguishing_aspect: "Boat registration defaults mast_status=STEPPED and status=ACTIVE."
        test_recipe:
          setup: ["C19 exists"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C19", email: "c19@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c19_id: $.data.id }
          trigger:
            - call: "POST /lofts/customers/${c19_id}/boats"
              payload: { boat_name: "B19", hull_length_m: 9.5, racing_class: "PHRF", standing_rigging_install_date: "2024-06-01T00:00:00Z" }
              as: LoftManager
              captures: { b19_id: $.data.id }
          assert:
            - "Boat.${b19_id}.mast_status == STEPPED"
            - "Boat.${b19_id}.status == ACTIVE"
            - "Boat.${b19_id}.running_rigging_hours_accumulated == 0 (default)"

      - name: boat_invalid_racing_class_enum_rejected
        claim_type: type_constraint
        grounds: [entities.Boat.fields.racing_class, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "racing_class value outside {NONE,J70,J105,TP52,ORC,PHRF} → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["C20 exists"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C20", email: "c20@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c20_id: $.data.id }
          trigger:
            - call: "POST /lofts/customers/${c20_id}/boats"
              payload: { boat_name: "B20", hull_length_m: 9.5, racing_class: "AMERICA_CUP", standing_rigging_install_date: "2024-06-01T00:00:00Z" }
              as: LoftManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: measurement_sheet_list_supports_pagination
        claim_type: listing
        grounds: [response_envelope.pagination_fields, entities.MeasurementSheet]
        distinguishing_aspect: "GET list honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["C21/B21 with two DRAFT measurement sheets"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C21", email: "c21@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c21_id: $.data.id }
            - call: "POST /lofts/customers/${c21_id}/boats"
              payload: { boat_name: "B21", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b21_id: $.data.id }
            - call: "POST /lofts/boats/${b21_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
            - call: "POST /lofts/boats/${b21_id}/measurement-sheets"
              payload: { i_height_m: 11.0, j_base_m: 3.5, p_main_m: 13.0, e_main_m: 4.5 }
              as: Measurer
          trigger:
            - call: "GET /lofts/boats/${b21_id}/measurement-sheets"
              payload: { limit: 1, offset: 0 }
              as: Measurer
          assert:
            - "response.data length == 1"
            - "response.meta.pagination.total_count == 2"
            - "response.meta.pagination.has_more == true"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial state
  # ===========================================================================
  - section: state_machines
    instances:
      - name: storage_contract_invalid_skip_enrolled_to_stored
        claim_type: invalid_transition
        grounds: [state_machines.StorageContract, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "Skipping RECEIVED/WASHED and calling rack-store on an ENROLLED contract is rejected."
        test_recipe:
          setup: ["C22/B22 with StorageContract ENROLLED"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C22", email: "c22@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c22_id: $.data.id }
            - call: "POST /lofts/customers/${c22_id}/boats"
              payload: { boat_name: "B22", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b22_id: $.data.id }
            - call: "POST /lofts/boats/${b22_id}/storage-contracts"
              payload: { season_code: "WINTER_2026", wash_item_codes: [] }
              as: LoftManager
              captures: { sc22_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b22_id}/storage-contracts/${sc22_id}/rack-store"
              payload: {}
              as: LoftManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "StorageContract.${sc22_id}.contract_status == ENROLLED"

      - name: work_order_terminal_cancelled_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LoftWorkOrder, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "After CANCELLED, lock-design (and every other action) on the same order is rejected."
        test_recipe:
          setup: ["WO23 CANCELLED"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C23", email: "c23@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c23_id: $.data.id }
            - call: "POST /lofts/customers/${c23_id}/boats"
              payload: { boat_name: "B23", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b23_id: $.data.id }
            - call: "POST /lofts/work-orders"
              payload: { customer_id: "${c23_id}", boat_id: "${b23_id}", order_kind: "RIGGING_SERVICE" }
              as: LoftManager
              captures: { wo23_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo23_id}/cancel"
              payload: {}
              as: LoftManager
          trigger:
            - call: "POST /lofts/work-orders/${wo23_id}/lock-design"
              payload: {}
              as: LoftManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: measurement_sheet_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.MeasurementSheet]
        distinguishing_aspect: "Newly created MeasurementSheet starts in DRAFT with frozen_at null."
        test_recipe:
          setup: ["C24/B24 exist"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C24", email: "c24@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c24_id: $.data.id }
            - call: "POST /lofts/customers/${c24_id}/boats"
              payload: { boat_name: "B24", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b24_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b24_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
              captures: { ms24_id: $.data.id }
          assert:
            - "MeasurementSheet.${ms24_id}.sheet_status == DRAFT"
            - "MeasurementSheet.${ms24_id}.frozen_at == null"

      - name: freeze_sheet_supersedes_prior_frozen_and_revokes_certificate
        claim_type: side_effect_execution
        grounds: [state_machines.MeasurementSheet.FROZEN_to_SUPERSEDED, state_machines.ClassCertificate.ACTIVE_to_REVOKED]
        distinguishing_aspect: "Freezing a newer sheet supersedes the prior FROZEN sheet AND revokes its ACTIVE ClassCertificate (cross-entity side effect)."
        test_recipe:
          setup: ["C25/B25 (racing_class J70); MS25a FROZEN with ACTIVE ClassCertificate CC25; MS25b DRAFT"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C25", email: "c25@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c25_id: $.data.id }
            - call: "POST /lofts/customers/${c25_id}/boats"
              payload: { boat_name: "B25", hull_length_m: 6.5, racing_class: "J70", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b25_id: $.data.id }
            - call: "POST /lofts/boats/${b25_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
              captures: { ms25a_id: $.data.id }
            - call: "POST /lofts/boats/${b25_id}/measurement-sheets/${ms25a_id}/freeze"
              payload: {}
              as: Measurer
            - call: "POST /lofts/boats/${b25_id}/class-certificates"
              payload: { measurement_sheet_id: "${ms25a_id}", racing_class: "J70" }
              as: Measurer
              captures: { cc25_id: $.data.id }
            - call: "POST /lofts/boats/${b25_id}/measurement-sheets"
              payload: { i_height_m: 10.5, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
              captures: { ms25b_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b25_id}/measurement-sheets/${ms25b_id}/freeze"
              payload: {}
              as: Measurer
          assert:
            - "MeasurementSheet.${ms25a_id}.sheet_status == SUPERSEDED"
            - "MeasurementSheet.${ms25b_id}.sheet_status == FROZEN"
            - "ClassCertificate.${cc25_id}.cert_status == REVOKED"

  # ===========================================================================
  # Section: calculations — precision, constants, input-set filtering
  # ===========================================================================
  - section: calculations
    instances:
      - name: sail_area_computed_on_freeze
        claim_type: correct_result
        grounds: [calculations.sail_area, entities.MeasurementSheet.fields.measured_area_sqm]
        distinguishing_aspect: "measured_area_sqm = 0.5*I*J + 0.5*P*E computed at freeze; client-supplied value ignored."
        test_recipe:
          setup: ["C26/B26; MS26 DRAFT with i=10,j=3,p=12,e=4"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C26", email: "c26@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c26_id: $.data.id }
            - call: "POST /lofts/customers/${c26_id}/boats"
              payload: { boat_name: "B26", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b26_id: $.data.id }
            - call: "POST /lofts/boats/${b26_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
              captures: { ms26_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b26_id}/measurement-sheets/${ms26_id}/freeze"
              payload: {}
              as: Measurer
          assert:
            - "MeasurementSheet.${ms26_id}.measured_area_sqm == 39.00 (0.5*10*3 + 0.5*12*4 = 15 + 24)"

      - name: storage_fee_empty_wash_list_returns_base_only
        claim_type: correct_result
        grounds: [calculations.storage_fee]
        distinguishing_aspect: "Empty wash_item_codes (zero-count edge) yields quoted_storage_fee_cents == season base with no item fees."
        test_recipe:
          setup: ["C27/B27 hull 8.0m (UNDER_10M tier = 180000); SC27 with wash_item_codes []"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C27", email: "c27@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c27_id: $.data.id }
            - call: "POST /lofts/customers/${c27_id}/boats"
              payload: { boat_name: "B27", hull_length_m: 8.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b27_id: $.data.id }
            - call: "POST /lofts/boats/${b27_id}/storage-contracts"
              payload: { season_code: "WINTER_2026", wash_item_codes: [] }
              as: LoftManager
              captures: { sc27_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b27_id}/storage-contracts/${sc27_id}/receive"
              payload: {}
              as: LoftManager
          assert:
            - "StorageContract.${sc27_id}.quoted_storage_fee_cents == 180000 (base only, empty options)"

      - name: final_invoice_excludes_qc_failed_and_cancelled_jobs
        claim_type: input_set_filtering
        grounds: [calculations.final_invoice]
        distinguishing_aspect: "Chronological final invoice sums only QC_PASSED jobs — QC_FAILED/CANCELLED jobs contribute zero."
        test_recipe:
          setup: ["WO28 locked; PJ28a QC_PASSED (61.50 sqm RACE); PJ28b QC_FAILED then rescheduled and left SCHEDULED (excluded)"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C28", email: "c28@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c28_id: $.data.id }
            - call: "POST /lofts/customers/${c28_id}/boats"
              payload: { boat_name: "B28", hull_length_m: 11.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b28_id: $.data.id }
            - call: "POST /lofts/boats/${b28_id}/measurement-sheets"
              payload: { i_height_m: 12.0, j_base_m: 4.0, p_main_m: 15.0, e_main_m: 5.0 }
              as: Measurer
              captures: { ms28_id: $.data.id }
            - call: "POST /lofts/boats/${b28_id}/measurement-sheets/${ms28_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b28_id}"
              payload: {}
              as: Sailmaker
              captures: { b28_v: $.data.version }
            - call: "POST /lofts/boats/${b28_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms28_id}", cloth_tier: "RACE", reinforcement_level: 1, option_codes: [], expected_boat_version: "${b28_v}" }
              as: Sailmaker
              captures: { d28_id: $.data.id }
            - call: "POST /lofts/boats/${b28_id}/sail-designs/${d28_id}/submit"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/boats/${b28_id}/sail-designs/${d28_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c28_id}"
            - call: "POST /lofts/cloth-ledger"
              payload: { bolt_code: "RACE-BOLT-28", cloth_tier: "RACE", total_sqm: 500.0, price_per_sqm_cents: 9500 }
              as: LoftManager
            - call: "POST /lofts/work-orders"
              payload: { customer_id: "${c28_id}", boat_id: "${b28_id}", order_kind: "NEW_SAIL", sail_design_id: "${d28_id}" }
              as: LoftManager
              captures: { wo28_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo28_id}/lock-design"
              payload: {}
              as: LoftManager
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs"
              payload: { bay_code: "BAY_A", scheduled_start_date: "2026-11-01", scheduled_end_date: "2026-11-03" }
              as: Sailmaker
              captures: { pj28a_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs/${pj28a_id}/start-cutting"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs/${pj28a_id}/advance"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs/${pj28a_id}/advance"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs/${pj28a_id}/qc-pass"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs"
              payload: { bay_code: "BAY_B", scheduled_start_date: "2026-11-10", scheduled_end_date: "2026-11-12" }
              as: Sailmaker
              captures: { pj28b_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs/${pj28b_id}/start-cutting"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs/${pj28b_id}/advance"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs/${pj28b_id}/advance"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo28_id}/production-jobs/${pj28b_id}/qc-fail"
              payload: { qc_notes: "panel mismatch" }
              as: Sailmaker
          trigger:
            - call: "POST /lofts/work-orders/${wo28_id}/confirm-delivery"
              payload: { fitted_option_codes: [] }
              as: Customer
              as_user_id: "${c28_id}"
          assert:
            - "LoftWorkOrder.${wo28_id}.invoiced_total_cents == 584250 (only PJ28a 61.50 sqm * 9500; QC_FAILED PJ28b excluded)"

  # ===========================================================================
  # Section: validations — violation → error, satisfaction → pass, priority
  # ===========================================================================
  - section: validations
    instances:
      - name: measurement_freeze_rejects_non_positive_dimension
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", errors.ERR_INVALID_MEASUREMENT]
        distinguishing_aspect: "Freezing a sheet with e_main_m == 0 → ERR_INVALID_MEASUREMENT (422)."
        test_recipe:
          setup: ["C29/B29; MS29 DRAFT with e_main_m = 0"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C29", email: "c29@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c29_id: $.data.id }
            - call: "POST /lofts/customers/${c29_id}/boats"
              payload: { boat_name: "B29", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b29_id: $.data.id }
            - call: "POST /lofts/boats/${b29_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 0.0 }
              as: Measurer
              captures: { ms29_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b29_id}/measurement-sheets/${ms29_id}/freeze"
              payload: {}
              as: Measurer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_MEASUREMENT"
            - "MeasurementSheet.${ms29_id}.sheet_status == DRAFT"

      - name: design_submit_requires_frozen_sheet
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", errors.ERR_MEASUREMENT_NOT_FROZEN]
        distinguishing_aspect: "Submitting a design whose MeasurementSheet is still DRAFT → ERR_MEASUREMENT_NOT_FROZEN (409)."
        test_recipe:
          setup: ["C30/B30; MS30 left in DRAFT; D30 references MS30"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C30", email: "c30@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c30_id: $.data.id }
            - call: "POST /lofts/customers/${c30_id}/boats"
              payload: { boat_name: "B30", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b30_id: $.data.id }
            - call: "POST /lofts/boats/${b30_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
              captures: { ms30_id: $.data.id }
            - call: "GET /lofts/boats/${b30_id}"
              payload: {}
              as: Sailmaker
              captures: { b30_v: $.data.version }
            - call: "POST /lofts/boats/${b30_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms30_id}", cloth_tier: "CRUISE", reinforcement_level: 1, option_codes: [], expected_boat_version: "${b30_v}" }
              as: Sailmaker
              captures: { d30_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b30_id}/sail-designs/${d30_id}/submit"
              payload: {}
              as: Sailmaker
