            - "error_id == ERR_NO_PREFERRED_PORTFOLIO (422); plan remains OPEN_FOR_COMMENT"

      - name: cancel_commitment_with_discharged_condition_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors[ERR_CONDITION_ALREADY_DISCHARGED]
        distinguishing_aspect: "Cancelling an ISSUED commitment whose listed condition is already DISCHARGED (by another awarded commitment) fails ERR_CONDITION_ALREADY_DISCHARGED (409) — the cancel precondition reads the condition's current state, not the commitment's."
        test_recipe:
