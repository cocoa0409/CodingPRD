              as: StudioAdmin
              captures: { rec_id: $.data.id, rec_v0: $.data.version }
            - call: "POST /recitals/${rec_id}/open-sales"
              payload: {}
              as: StudioAdmin
              captures: { rec_v1: $.data.version }
            - call: "POST /families"
              payload: { email: "fs1@x.com", family_name: "S1Fam" }
