  # ===========================================================================
  # §1.9.2 ERRORS — every distinct HTTP status the catalogue uses (401, 403,
  # 404, 409, 412, 422) and every declared category (auth/authorization,
  # existence, schema/range/uniqueness, resource state, product-safety /
  # process compliance, constraint/temporal, capacity/quota/money, optimistic
  # concurrency). Codes whose condition is subtle are preferred over codes that
  # are one obvious rejected field, and each instance groups codes that share a
  # precedence question so the §1.4 ladder itself is under test.
  # ===========================================================================
  - section: errors
    instances:
      - name: err_auth_ladder_role_not_permitted_precedes_identity_and_role_code_checks
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_ROLE
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_IDENTITY_NOT_FOUND
          - errors.ERR_ROLE_IDENTITY_MISMATCH
          - validations.priority_2
          - validations.priority_3
          - validations.priority_4
          - validations.priority_5
        distinguishing_aspect: |
          The four auth codes are separated by what exactly is wrong with the
          same pair of headers: an unknown role string is 401 ERR_INVALID_ROLE,
          a known role outside the endpoint's roles list is 403
          ERR_ROLE_NOT_PERMITTED even when the user id does not exist at all
          (priority 3 before priority 4), a non-existent Technician id on a
          permitted role is 401 ERR_IDENTITY_NOT_FOUND, and an existing
          Technician whose role_code names a different shop-floor role is 403
          ERR_ROLE_IDENTITY_MISMATCH rather than 404.
        test_recipe:
          setup:
            - "Four ACTIVE Technicians with distinct role_codes, as in the discovery instance; no other data is needed because every call fails before any business rule is reached."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
          trigger:
            - call: "GET /technicians"
              payload: {}
              as: "MOLDING_OPERATOR"
              as_user_id: "${t_op}"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-9", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: MoldingOperator
              as_user_id: "tech-cd-does-not-exist"
            - call: "GET /technicians"
              payload: {}
              as: MoldingOperator
              as_user_id: "tech-cd-does-not-exist"
            - call: "GET /technicians"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_qc}"
            - call: "GET /technicians"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
          assert:
            - "the X-User-Role 'MOLDING_OPERATOR' call returns status 401 with data.error_id 'ERR_INVALID_ROLE' — the role header carries role NAMES, not Technician.role_code values"
            - "the POST /molds call returns status 403 with data.error_id 'ERR_ROLE_NOT_PERMITTED', not 'ERR_IDENTITY_NOT_FOUND', although the same user id does not exist"
            - "no Mold row named MLD-CD-9 exists after that refusal"
            - "the third call returns status 401 with data.error_id 'ERR_IDENTITY_NOT_FOUND', not 404"
            - "the fourth call returns status 403 with data.error_id 'ERR_ROLE_IDENTITY_MISMATCH' because Technician.${t_qc}.role_code is QUALITY_INSPECTOR"
            - "the fifth call returns status 200 with response_type 'array', proving the same id succeeds under the role its role_code names"

      - name: err_technician_state_suspension_outranks_the_certification_check
        claim_type: violation_to_error
        grounds:
          - errors.ERR_TECHNICIAN_SUSPENDED
          - errors.ERR_TECHNICIAN_NOT_CERTIFIED
          - validations.priority_30
          - validations.priority_31
        distinguishing_aspect: |
          Both 403s are raised on one hull in one pass: an ACTIVE assembly tech
          without FIXTURE_ASSEMBLY gets ERR_TECHNICIAN_NOT_CERTIFIED, a
          SUSPENDED but fully certified assembly tech on the same outfit call
          gets ERR_TECHNICIAN_SUSPENDED (priority 30 before 31), and an
          inspector holding WALL_GAUGE but not IMPACT_RIG is refused because the
          inspect operation requires BOTH certifications.
        test_recipe:
          setup:
            - "Base plant of the discovery instance run to DEMOLDED, so hull 1 is untrimmed."
            - "T-CD-ASM-2 (ASSEMBLY_TECH, FIXTURE_ASSEMBLY) then SUSPENDED; T-CD-ASM-3 (ASSEMBLY_TECH, no certifications); T-CD-QCI-2 (QUALITY_INSPECTOR, WALL_GAUGE only)."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - call: "POST /technicians"
              payload: { employee_code: "T-CD-ASM-2", full_name: "Ada Bunk", role_code: "ASSEMBLY_TECH", certifications: ["FIXTURE_ASSEMBLY"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_asm2: $.data.id }
            - call: "POST /technicians/${t_asm2}/suspend"
              payload: { suspend_reason: "expired safety card" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /technicians"
              payload: { employee_code: "T-CD-ASM-3", full_name: "Bo Rivet", role_code: "ASSEMBLY_TECH", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_asm3: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-CD-QCI-2", full_name: "Cy Caliper", role_code: "QUALITY_INSPECTOR", certifications: ["WALL_GAUGE"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_qc2: $.data.id }
          trigger:
            - call: "POST /finished-units/${fu1}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm2}"
            - call: "POST /finished-units/${fu1}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu1}/outfit"
              payload: { hardware_kit_serial: "HK-CD-0021" }
              as: AssemblyTechnician
              as_user_id: "${t_asm3}"
            - call: "POST /finished-units/${fu1}/outfit"
              payload: { hardware_kit_serial: "HK-CD-0021" }
              as: AssemblyTechnician
              as_user_id: "${t_asm2}"
            - call: "POST /finished-units/${fu1}/outfit"
              payload: { hardware_kit_serial: "HK-CD-0021" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu1}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc2}"
            - call: "POST /finished-units/${fu1}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
          assert:
            - "the first trim returns status 403 with data.error_id 'ERR_TECHNICIAN_SUSPENDED' and FinishedUnit.${fu1}.build_status is still 'DEMOLDED'"
            - "the second trim returns status 200 with build_status 'TRIMMED' and trim_waste_kg 0.400"
            - "the outfit by T-CD-ASM-3 returns status 403 with data.error_id 'ERR_TECHNICIAN_NOT_CERTIFIED'"
            - "the outfit by the SUSPENDED but certified T-CD-ASM-2 returns status 403 with data.error_id 'ERR_TECHNICIAN_SUSPENDED', not 'ERR_TECHNICIAN_NOT_CERTIFIED'"
            - "FinishedUnit.${fu1}.build_status is still 'TRIMMED' and outfitted_by_technician_id is null after both refusals"
            - "the outfit by T-CD-ASM-1 returns status 200 with build_status 'OUTFITTED' and outfitted_by_technician_id == ${t_asm}"
            - "the inspect by T-CD-QCI-2 returns status 403 with data.error_id 'ERR_TECHNICIAN_NOT_CERTIFIED' because inspect requires both WALL_GAUGE and IMPACT_RIG"
            - "the inspect by T-CD-QCI-1 returns status 200 with inspection_verdict 'PASS' and inspected_by_technician_id == ${t_qc}"

      - name: err_404_entity_specific_code_versus_the_generic_fallback_and_its_precedence
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RESOURCE_NOT_FOUND
          - errors.ERR_MOLD_NOT_FOUND
          - errors.ERR_PRODUCT_MODEL_NOT_FOUND
          - validations.priority_10
          - validations.priority_11
        distinguishing_aspect: |
          WarrantyClaim and ShipmentLine are the only two path-addressable
          entities with NO entity-specific 404 code, so an unresolvable id on
          those paths must fall back to ERR_RESOURCE_NOT_FOUND while the very
          same shape of request on /molds/{mold_id} must answer
          ERR_MOLD_NOT_FOUND — and existence (priority 11) is settled before any
          range check (priority 22) on the same body.
        test_recipe:
          setup:
            - "One ProductModel PM-CD-KM. Nothing else is needed: every call names an id that was never minted."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
          trigger:
            - call: "GET /warranty-claims/clm-cd-never-minted"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /shipment-lines/sl-cd-never-minted"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /molds/mld-cd-never-minted"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /shipments/shp-cd-never-minted"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-404", product_model_id: "pm-cd-never-minted", size_class: "MID", cavity_count: 9, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the warranty-claim read returns status 404 with data.error_id 'ERR_RESOURCE_NOT_FOUND' — the catalogue declares no ERR_WARRANTY_CLAIM_NOT_FOUND"
            - "the shipment-line read returns status 404 with data.error_id 'ERR_RESOURCE_NOT_FOUND' — the catalogue declares no ERR_SHIPMENT_LINE_NOT_FOUND"
            - "the mould read returns status 404 with data.error_id 'ERR_MOLD_NOT_FOUND'"
            - "the shipment read returns status 404 with data.error_id 'ERR_SHIPMENT_NOT_FOUND'"
            - "the POST /molds call returns status 404 with data.error_id 'ERR_PRODUCT_MODEL_NOT_FOUND', not 422 ERR_INVALID_QUANTITY, although cavity_count 9 is outside 1..4"
            - "no Mold row exists after the refusal: GET /molds returns total_count 0"
            - "every one of the five error bodies carries response_type 'error' with data.error_id and data.message and no top-level error key"

      - name: err_422_schema_ladder_missing_field_then_enum_then_numeric_bound
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VALIDATION
          - errors.ERR_INVALID_ENUM_VALUE
          - errors.ERR_INVALID_QUANTITY
          - validations.priority_20
          - validations.priority_21
          - validations.priority_22
          - validations.priority_23
        distinguishing_aspect: |
          The three schema codes are ordered on ONE payload that breaks several
          rules at once: with size_class absent the answer is ERR_VALIDATION,
          with size_class present but not a declared enum member it is
          ERR_INVALID_ENUM_VALUE, and only with both fixed does cavity_count 5
          surface ERR_INVALID_QUANTITY — and priority 22 also governs list
          pagination, so limit=101 is 422 while limit=100 is accepted.
        test_recipe:
          setup:
            - "One ProductModel PM-CD-KM, so every rejection below is a schema rejection and not a missing foreign key."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
          trigger:
            - call: "GET /product-models?limit=101"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=0"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=10&offset=-1"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-422", product_model_id: "${pm}", cavity_count: 5, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-422", product_model_id: "${pm}", size_class: "GIGANTIC", cavity_count: 5, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-422", product_model_id: "${pm}", size_class: "MID", cavity_count: 5, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01 09:00:00" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=100"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "limit=101 returns status 422 with data.error_id 'ERR_INVALID_QUANTITY'"
            - "limit=0 returns status 422 with data.error_id 'ERR_INVALID_QUANTITY' — the declared range is 1..100, so 0 is not a synonym for 'no limit'"
            - "offset=-1 returns status 422 with data.error_id 'ERR_INVALID_QUANTITY'"
            - "the mould create without size_class returns status 422 with data.error_id 'ERR_VALIDATION'"
            - "the mould create with size_class 'GIGANTIC' returns status 422 with data.error_id 'ERR_INVALID_ENUM_VALUE', not 'ERR_INVALID_QUANTITY'"
            - "the mould create with size_class 'MID' and cavity_count 5 returns status 422 with data.error_id 'ERR_INVALID_QUANTITY'"
            - "GET /molds returns total_count 0 — none of the three refused creates wrote a row, so MLD-CD-422 is still free"
            - "the clock call with '2026-08-01 09:00:00' returns status 422 with data.error_id 'ERR_VALIDATION' and GET /_clock/current_utc still reports '2026-08-01T00:00:00Z'"
            - "limit=100 returns status 200 with limit 100, offset 0, total_count 1 and has_more false"

      - name: err_409_duplicate_code_family_including_a_repeat_inside_one_zones_array
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DUPLICATE_CODE
          - validations.priority_26
          - validations.priority_22
        distinguishing_aspect: |
          Uniqueness is asserted in its two declared shapes — a second row
          reusing a global business code, and a zone_code repeated WITHIN one
          warehouse's zones array, which is a single-request duplicate with no
          existing row to compare against — and the 409 is shown to sit BELOW
          the 422 range check, so a create that is both duplicated and
          out-of-range answers ERR_INVALID_QUANTITY.
        test_recipe:
          setup:
            - "ProductModel PM-CD-KM, Technician T-CD-RES-1 and Warehouse WH-CD already exist."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_tres
            - *cd2_wh
          trigger:
            - call: "POST /product-models"
