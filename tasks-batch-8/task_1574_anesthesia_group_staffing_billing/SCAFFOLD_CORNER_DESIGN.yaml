  # ===========================================================================
  # Section: errors (Table 6 claims) — every catalog error is triggerable.
  # Errors already exercised as the failure path of a §1.8 instance are stubs;
  # every other error has a live instance in entities/state_machines/
  # calculations/validations/rbac sections of this file.
