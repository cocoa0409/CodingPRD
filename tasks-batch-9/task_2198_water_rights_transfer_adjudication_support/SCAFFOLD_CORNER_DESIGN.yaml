            - "The identical publish call now returns HTTP 200 with status PROTEST_PERIOD and protest_deadline 2026-03-31T00:00:00Z (logical clock + 30 days at revision_round 0)."

      - name: err_standing_sanction_and_volume_budget_pair
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLAIMANT_NOT_IN_GOOD_STANDING]
          - errors[ERR_TRANSFERABLE_VOLUME_EXCEEDED]
          - validations[priority=24]
          - validations[priority=45]
        distinguishing_aspect: >-
          Both fiscal-gate errors on submit, and the fact that the standing sanction
          (priority 24) pre-empts the volume budget (priority 45) when a single call
          violates both at once.
        excluded_because:
          difficulty_instance: standing_sanction_beats_volume_budget
          rationale: >-
            That §1.8 instance is built on exactly this pair: it drives one request
            that is both over-budget and filed by a DELINQUENT claimant, asserts
            ERR_CLAIMANT_NOT_IN_GOOD_STANDING, then clears the delinquency and
            re-issues the same request to expose ERR_TRANSFERABLE_VOLUME_EXCEEDED.
            Both error ids get a positive assertion there.

      - name: err_lease_window_conflict_and_insufficient_credit_pair
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LEASE_WINDOW_CONFLICT]
          - errors[ERR_INSUFFICIENT_BANK_CREDIT]
          - validations[priority=41]
          - validations[priority=46]
        distinguishing_aspect: >-
          The constraint-before-fiscal ordering on lease creation: an overlapping
          delivery window is reported even when the account also lacks the credit to
          fund the lease.
        excluded_because:
          difficulty_instance: lease_window_conflict_beats_insufficient_credit
          rationale: >-
            The §1.8 instance issues a single doubly-invalid lease request, asserts
            ERR_LEASE_WINDOW_CONFLICT, then moves the window clear of the buffer so
            the same request surfaces ERR_INSUFFICIENT_BANK_CREDIT. Repeating either
            leg here would only duplicate it.

      - name: err_protest_window_closed_and_duplicate_protest_pair
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROTEST_WINDOW_CLOSED]
          - errors[ERR_DUPLICATE_PROTEST]
          - validations[priority=32]
          - validations[priority=39]
        distinguishing_aspect: >-
          The temporal gate on protest filing and the one-protest-per-(application,
          protestant) uniqueness key, including which one wins when a late filing is
          also a repeat filing.
        excluded_because:
          difficulty_instance: protest_deadline_beats_duplicate_protest
          rationale: >-
            The §1.8 instance already files at the deadline instant (accepted), one
            second later (ERR_PROTEST_WINDOW_CLOSED) and a second time from the same
            protestant inside the window (ERR_DUPLICATE_PROTEST), so both ids are
            positively asserted with the ordering pinned.

      - name: err_insufficient_use_history_on_a_thin_qualifying_set
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSUFFICIENT_USE_HISTORY]
          - validations[priority=28]
          - calculations.hcu_transferable_volume
        distinguishing_aspect: >-
          The minimum-qualifying-year gate on HCU certification, and the fact that
          inadmissible records (self-reported, out-of-period) do not count toward it.
        excluded_because:
          difficulty_instance: hcu_qualifying_set_and_haircut_boundaries
          rationale: >-
            The §1.8 instance walks the qualifying set from just-short (asserting
            ERR_INSUFFICIENT_USE_HISTORY) to exactly-at the threshold, which is a
            strictly stronger test of the same error than a standalone trigger.

      - name: err_docket_phase_invalid_and_window_still_open_pair
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DOCKET_PHASE_INVALID]
          - errors[ERR_WINDOW_STILL_OPEN]
          - validations[priority=19]
          - validations[priority=34]
        distinguishing_aspect: >-
          The two docket-phase gates: examining a claim while the docket is still
          OPEN_FOR_CLAIMS, and advancing the docket before the filing deadline has
          passed.
        excluded_because:
          difficulty_instance: claim_examination_gated_by_docket_phase
          rationale: >-
            The §1.8 instance asserts ERR_DOCKET_PHASE_INVALID on the premature
            examine, ERR_WINDOW_STILL_OPEN on the premature advance, and then the
            same two calls succeeding once the clock passes the deadline.

      - name: err_pod_capacity_exceeded_at_the_rate_ceiling
        claim_type: violation_to_error
        grounds:
          - errors[ERR_POD_CAPACITY_EXCEEDED]
          - validations[priority=42]
          - validations[priority=43]
          - calculations.pod_concurrent_rate_load
        distinguishing_aspect: >-
          The aggregate instantaneous-rate ceiling at a headgate, at the exact
          equality boundary and one thousandth of a cfs beyond it.
        excluded_because:
          difficulty_instance: pod_rate_equality_accepted_one_thousandth_rejected
          rationale: >-
            The §1.8 boundary instance accepts the sum that exactly equals
            max_rate_cfs and rejects the same sum plus 0.001 with
            ERR_POD_CAPACITY_EXCEEDED; pod_half_open_adjacency_and_aggregate
            additionally proves the overlap set that feeds the sum.

      - name: err_account_posture_blocked_on_lease_activation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACCOUNT_POSTURE_BLOCKED]
          - validations[priority=22]
          - calculations.bank_posture
        distinguishing_aspect: >-
          A RESTRICTED or FROZEN funding account blocks starting delivery on an
          otherwise perfectly valid RESERVED lease.
        excluded_because:
          difficulty_instance: lease_activation_blocked_by_account_posture
          rationale: >-
            That §1.8 instance drives the account through all three postures and
            asserts ERR_ACCOUNT_POSTURE_BLOCKED on the two blocking ones plus the
            200 on OPEN, which subsumes any single-shot trigger here.

      - name: err_violation_unresolved_blocks_reinstatement
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VIOLATION_UNRESOLVED]
          - validations[priority=31]
          - state_machines.ApprovalCondition
        distinguishing_aspect: >-
          A right suspended by the condition-violation cascade cannot be reinstated
          while any ApprovalCondition on any of its applications is still VIOLATED.
        excluded_because:
          difficulty_instance: condition_violation_suspension_cascade
          rationale: >-
            The §1.8 cascade instance asserts ERR_VIOLATION_UNRESOLVED on the
            premature reinstate and then the successful reinstate after the condition
            is cured VIOLATED -> SATISFIED, so both sides of the gate are covered.

      - name: err_forfeiture_not_eligible_below_the_five_year_threshold
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORFEITURE_NOT_ELIGIBLE]
          - validations[priority=30]
          - calculations.forfeiture_risk_score
        distinguishing_aspect: >-
          Declaring forfeiture at four consecutive non-use years is rejected while
          five is accepted, with the run computed inside the look-back window.
        excluded_because:
          difficulty_instance: forfeiture_five_year_boundary
          rationale: >-
            The §1.8 boundary instance asserts ERR_FORFEITURE_NOT_ELIGIBLE at four
            consecutive non-use years and the 200 at five, on the same fixture, which
            is the same error under a strictly tighter test.

      - name: err_unauthenticated_header_family_precedes_every_other_check
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: >-
          Three different header defects collapse to the same 401 — no X-User-Role, no
          X-User-ID, and a syntactically fine but undeclared role ('Auditor') — and all
          three are reported ahead of an obviously bad body and a non-existent path id,
          so authentication genuinely runs at priority 1 rather than as a side effect
          of authorization.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; one claimant exists; no other fixture is needed because none of these calls should reach the resource layer."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
          trigger:
            - {call: "GET /water-rights", captures: {err_no_headers: "$.data.error_id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-900", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: Auditor, captures: {err_unknown_role: "$.data.error_id"}}
            - {call: "POST /water-rights", payload: {right_number: "WR-2198-901"}, as: Auditor, captures: {err_role_before_body: "$.data.error_id"}}
            - {call: "GET /water-rights/00000000-0000-0000-0000-0000000000ff", as: Auditor, captures: {err_role_before_path: "$.data.error_id"}}
          assert:
            - "No headers at all: HTTP 401 with error_id ERR_UNAUTHENTICATED."
            - "X-User-Role: Auditor (a role that is not one of the five declared in the role model), with a valid X-User-ID: HTTP 401 ERR_UNAUTHENTICATED — an unknown role is an authentication failure at priority 1, not a 403 at priority 2."
            - "The same undeclared role with a body missing every required field: still HTTP 401 ERR_UNAUTHENTICATED, never ERR_INVALID_REQUEST (priority 6)."
            - "The same undeclared role against a non-existent water_right id: still HTTP 401 ERR_UNAUTHENTICATED, never ERR_WATER_RIGHT_NOT_FOUND (priority 3)."
            - "No row is created or mutated by any of the four calls."

  - section: rbac
    instances:
      - name: rbac_exclusive_operation_matrix_five_roles_five_owners
        claim_type: exclusive_operations
        grounds:
          - roles[WaterRightsAnalyst].exclusive_operations
          - roles[HearingOfficer].exclusive_operations
          - roles[DecisionAuthority].exclusive_operations
          - roles[BasinAdjudicator].exclusive_operations
          - roles[Claimant].exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: >-
          One exclusive operation per role, each attempted by a role that is otherwise
          powerful in the same workflow: the analyst who prepared the file cannot decide
          it, the hearing officer who resolved the protest cannot decide it either, the
          decision authority cannot run the study it relies on, and the basin
          adjudicator — the broadest role in the service — is refused BOTH the protest
          fork and the disposition, proving the model is peer-role rather than
          hierarchical.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's right certified at 195.00 AF with a published 100.00 AF application and one FILED protest from claimant B; docket SNK-ADJ-10 open."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /claimants", payload: {legal_name: "Bell Cattle Trust", contact_email: "b@bell.example", entity_type: INDIVIDUAL}, as: WaterRightsAnalyst, captures: {cl_b: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_b}", claimed_injury_af: 5.00, basis: INJURY_TO_SENIOR_RIGHT}, as: Claimant, as_user_id: "${cl_b}", captures: {pr: "$.data.id"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-10", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
          trigger:
            - {call: "POST /transfer-applications/${app}/decide", payload: {disposition: DENY, decision_note: "Analyst attempting a disposition."}, as: WaterRightsAnalyst, captures: {e1: "$.data.error_id"}}
            - {call: "POST /transfer-applications/${app}/decide", payload: {disposition: DENY, decision_note: "Hearing officer attempting a disposition."}, as: HearingOfficer, captures: {e2: "$.data.error_id"}}
            - {call: "POST /transfer-applications/${app}/decide", payload: {disposition: DENY, decision_note: "Adjudicator attempting a disposition."}, as: BasinAdjudicator, captures: {e3: "$.data.error_id"}}
            - {call: "POST /protests/${pr}/route", payload: {track: NEGOTIATION}, as: BasinAdjudicator, captures: {e4: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: BasinAdjudicator, captures: {e5: "$.data.error_id"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-11", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: WaterRightsAnalyst, captures: {e6: "$.data.error_id"}}
            - {call: "POST /adjudication-claims/${dk}/examine", payload: {examiner_recommended_af: 10.00, examination_note: "Wrong role."}, as: HearingOfficer, captures: {e7: "$.data.error_id"}}
            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_b}", claimed_injury_af: 5.00, basis: INJURY_TO_SENIOR_RIGHT}, as: WaterRightsAnalyst, captures: {e8: "$.data.error_id"}}
          assert:
            - "Every one of the eight calls returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED."
            - "decide is refused to WaterRightsAnalyst, HearingOfficer and BasinAdjudicator alike — only DecisionAuthority holds it."
            - "route is refused to BasinAdjudicator (HearingOfficer-exclusive) and POST /water-rights/{id}/hcu-studies is refused to BasinAdjudicator (WaterRightsAnalyst-exclusive), so the adjudicator is emphatically not a superuser."
            - "POST /decree-dockets and POST /adjudication-claims/{id}/examine are refused to non-adjudicator roles even though the analyst may create every other kind of row."
            - "POST /protests is refused to WaterRightsAnalyst: staff cannot file a protest on a claimant's behalf, which is the only Claimant-exclusive operation."
            - "The 403 is returned before any body or path resolution: the examine call names a docket id where a claim id belongs and still returns ERR_ROLE_NOT_PERMITTED rather than a 404 (priority 2 precedes priority 3)."
            - "No entity's version moves and the protest stays FILED throughout."

      - name: rbac_shared_operations_three_writers_on_one_evidence_ledger_and_five_readers
        claim_type: shared_operations
        grounds:
          - roles[Claimant].shared_operations
          - roles[WaterRightsAnalyst].shared_operations
          - roles[BasinAdjudicator].shared_operations
        distinguishing_aspect: >-
          The beneficial-use evidence ledger is deliberately writable by three roles —
          the holder itself, technical staff and the adjudicator — and the resulting
          rows are indistinguishable to the forfeiture and HCU calculations, while all
          five roles can read the derived assessment. A shared operation must not be
          silently narrowed to staff.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A holds WR-2198-001 (no records yet)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
          trigger:
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: Claimant, as_user_id: "${cl_a}", captures: {b1: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst, captures: {b2: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: BasinAdjudicator, captures: {b3: "$.data.id"}}
            - {call: "GET /water-rights/${wr}/forfeiture-assessment", as: Claimant, as_user_id: "${cl_a}", captures: {score_claimant: "$.data.forfeiture_risk_score"}}
            - {call: "GET /water-rights/${wr}/forfeiture-assessment", as: HearingOfficer, captures: {score_ho: "$.data.forfeiture_risk_score"}}
            - {call: "GET /water-rights/${wr}/forfeiture-assessment", as: DecisionAuthority, captures: {score_da: "$.data.forfeiture_risk_score"}}
            - {call: "GET /water-rights/${wr}/forfeiture-assessment", as: BasinAdjudicator, captures: {score_ba: "$.data.forfeiture_risk_score"}}
            - {call: "GET /water-rights/${wr}/forfeiture-assessment", as: WaterRightsAnalyst, captures: {score_an: "$.data.forfeiture_risk_score"}}
          assert:
            - "All three writes return HTTP 201; the three rows differ only in use_year, and none records the writing role."
            - "The right now activates cleanly (three METER records satisfy the verified-evidence gate) regardless of which role supplied each row."
            - "All five reads return HTTP 200 with an identical body — the same forfeiture_risk_score, forfeiture_risk_band and nonuse_year_count — so the assessment endpoint is unscoped for reads."
            - "ERR_ROLE_NOT_PERMITTED must NOT appear on any of these eight calls."

      - name: rbac_claimant_ownership_scoping_across_four_resource_families
        claim_type: peer_roles
        grounds:
          - validations[priority=5]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles[Claimant].description
        distinguishing_aspect: >-
          One rule, four different ownership derivations, all refused to the same
          stranger: the right's claimant_id (evidence and application writes), the
          account's claimant_id (deposits), the protest's protestant_claimant_id
          (filing) and the claimed right's claimant_id (adjudication claims). The
          ownership refusal also pre-empts stronger objections — filing a protest
          naming the applicant as protestant returns 403 rather than the
          self-protest 422 — which pins priority 5 above priorities 38 and 44.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A holds a certified right, a DRAFT application and a bank account; claimant B holds nothing."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /claimants", payload: {legal_name: "Bell Cattle Trust", contact_email: "b@bell.example", entity_type: INDIVIDUAL}, as: WaterRightsAnalyst, captures: {cl_b: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /water-bank-accounts", payload: {claimant_id: "${cl_a}", basin_code: "SNK"}, as: WaterRightsAnalyst, captures: {acc: "$.data.id"}}
            - {call: "GET /water-bank-accounts/${acc}", as: WaterRightsAnalyst, captures: {acc_v: "$.data.version"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-12", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
          trigger:
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2022, reported_diversion_af: 10.000, irrigated_acres: 5.00, verification_source: AFFIDAVIT}, as: Claimant, as_user_id: "${cl_b}", captures: {e_evidence: "$.data.error_id"}}
            - {call: "POST /transfer-applications/${app}/withdraw", payload: {withdrawal_reason: "Stranger attempting to withdraw."}, as: Claimant, as_user_id: "${cl_b}", captures: {e_app: "$.data.error_id"}}
            - {call: "POST /water-bank-accounts/${acc}/deposits", payload: {water_right_id: "${wr}", deposit_af: 10.00, expected_water_bank_account_version: "${acc_v}"}, as: Claimant, as_user_id: "${cl_b}", captures: {e_deposit: "$.data.error_id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: Claimant, as_user_id: "${cl_b}", captures: {e_claim: "$.data.error_id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: Claimant, as_user_id: "${cl_a}", captures: {cm_ok: "$.data.id"}}
