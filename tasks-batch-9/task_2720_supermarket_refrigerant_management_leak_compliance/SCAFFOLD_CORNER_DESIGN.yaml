      - name: penalty_exposure_hits_the_statutory_cap_and_sets_capped_flag
        claim_type: constants_applied
        grounds:
          - calculations.inspection_penalty_exposure.constants.PENALTY_STATUTORY_CAP_USD
          - entities.Inspection.fields.capped
          - entities.Inspection.fields.penalty_exposure_usd
        distinguishing_aspect: "One MAJOR citation of 60 violation days on a COMPLIANT store computes 4500.00 * 60 * 1.00 = 270000.00, which the statutory cap truncates to exactly 250000.00 with capped true - the cap is a hard min() applied after summation, and the store total inherits the capped figure, not the raw one."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store with no systems (compliance_status COMPLIANT, multiplier 1.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "Inspector Vale", citations: [ { citation_code: "608-VENT", severity: "MAJOR", violation_days: 60 } ] }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { insp_id: $.data.id, insp_penalty: $.data.penalty_exposure_usd, insp_capped: $.data.capped }
          assert:
            - "HTTP 201"
            - "Inspection.${insp_id}.penalty_exposure_usd == 250000.00 and capped == true"
            - "Inspection.${insp_id}.chronic_multiplier_applied == 1.00 and status == OPEN"
            - "Store.${store_id}.penalty_exposure_total_usd == 250000.00 and compliance_status == COMPLIANT"

      - name: late_filing_walks_all_three_surcharge_brackets
        claim_type: tiered_pricing_boundaries
        grounds:
          - calculations.late_filing_assessment
          - calculations.late_filing_assessment.constants.SURCHARGE_BRACKETS
          - entities.RegulatoryReport.fields.days_late
        distinguishing_aspect: "Three identical periods filed on three stores at three instants land in the three brackets: days_late 0 gives 0.00 across all money fields, days_late 10 gives base 1650.00 in the 0.10 band (total 1815.00), days_late 40 gives base 6600.00 in the 0.18 band (total 7788.00). Separate stores are used so no period-overlap rule interferes."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, three stores with no systems; one DRAFT ANNUAL_LEAK_RATE report each for 2026-01-01..2026-06-30, all due 2026-08-29."
            - "Report A submitted at the clock 2026-08-29, report B at 2026-09-08, report C at 2026-10-08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { storea_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Southgate Market", store_code: "SG-002", state_code: "CA", region: "WEST" }
