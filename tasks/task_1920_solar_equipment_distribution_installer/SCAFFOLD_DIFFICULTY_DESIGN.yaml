  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥ 2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tariff_window_overlap_rejected_half_open
        grounds:
          - calculations.landed_cost_per_unit
          - errors.ERR_TARIFF_WINDOW_OVERLAP
        distinguishing_aspect: |
          Resource = TariffRate keyed on hts_code. Interval semantics =
          HALF-OPEN [effective_from, effective_to). Adjacent rates where one's
          effective_to equals the next's effective_from do NOT overlap. Overlap
          detection: reject when a new rate's window intersects an existing
          ACTIVE rate for the same hts_code under half-open semantics.
        test_recipe:
          setup:
            - "Existing TariffRate R1 for HTS 8541.43, effective [2026-07-01, 2026-08-15)"
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-08-15T00:00:00Z" }
              as: DistributionAdmin
              captures: { r1: $.data.id }
          trigger:
            # Overlapping: starts before R1.effective_to
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 2000, effective_from: "2026-08-10T00:00:00Z" }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "R1 window [2026-07-01, 2026-08-15); new rate window [2026-08-10, ∞)"
            - "Intersect [2026-08-10, 2026-08-15) is non-empty under half-open semantics"
            - "error_id == ERR_TARIFF_WINDOW_OVERLAP"
            - "HTTP status == 409"

      - name: compatibility_rule_window_boundary_half_open_at_lock_time
        grounds:
          - calculations.compatibility_check
          - state_machines.CompatibilityRule
        distinguishing_aspect: |
          Resource = CompatibilityRule keyed on (module,inverter) pair. Interval
          semantics = EFFECTIVE-WINDOW HALF-OPEN [effective_from, effective_to)
          but the comparison is against the DESIGN-LOCK TIMESTAMP (not another
          window). Distinct from TariffRate: here we test that a rule whose
          effective_to equals the lock-time does NOT match (expired at the
          boundary). Different interval semantics (point-in-window vs
          window-window overlap).
        test_recipe:
          setup:
            - "CompatibilityRule effective [2026-07-01, 2026-08-10)"
            - "Advance clock to exactly 2026-08-10T00:00:00Z (the boundary)"
            - "Attempt to lock a design referencing this module+inverter pair"
            - "At t == effective_to, the rule no longer applies (half-open)"
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "M", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "I", product_kind: "INVERTER", manufacturer_name: "I", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 3, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8504.40", duty_rate_bp: 500, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/compatibility-rules"
              payload: { module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", max_modules_per_inverter: 20, min_modules_per_inverter: 5, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/installers"
              payload: { legal_name: "P", license_number: "L", credit_limit_cents: 100000000, progress_payment_pct_bp: 10000, payment_terms_days: 30 }
              as: ChannelManager
              captures: { inst_id: $.data.id }
            - call: "POST /solar-dist/installers/${inst_id}/activate"
              payload: {}
              as: ChannelManager
            - call: "POST /solar-dist/installers/${inst_id}/projects"
              payload: { project_name: "P1", site_postal_code: "94110", module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", module_qty: 5, inverter_qty: 1 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistributionAdmin
          trigger:
            - call: "POST /solar-dist/projects/${proj_id}/lock-design"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Rule effective_to == lock_time (2026-08-10T00:00:00Z)"
            - "Half-open semantics: at t == effective_to, rule no longer applies"
            - "No other ACTIVE rule covers the pair → design lock fails"
            - "error_id == ERR_NO_COMPATIBILITY_RULE"
            - "HTTP status == 422"

