              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ctA_id: $.data.id }
            - call: "POST /valet/contractors/${ctA_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ctA_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ctA_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors"
              payload: { legal_name: "Bea Ryu", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 18 }
              as: ValetOpsManager
              captures: { ctB_id: $.data.id }
            - call: "POST /valet/contractors/${ctB_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ctB_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
