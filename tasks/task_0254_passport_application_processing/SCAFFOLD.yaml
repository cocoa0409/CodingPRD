scenario: |
  254. Passport Application Processing: application type (new/renewal/minor), document
  verification, routine vs expedite, fee + execution fee, photo validation, status tracking,
  name change, urgent-travel appointment

domain_name: passport-application-processing
api_prefix: /applications

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - temporal_windowing   # appointment/slot overlap on two resources, different interval semantics

  entity_topology: flat
  # Peer entities linked by FK references (Applicant, Application, SupportingDocument,
  # Photo, FeeAssessment, Appointment, AdjudicationDecision, AcceptanceFacility,
  # UrgentTravelCounter, ApplicationStatusEvent). No nested ownership URL chains.

  state_machine_shape: branching
  # Application lifecycle forks by application_type (NEW/RENEWAL/MINOR) into divergent
  # side-effect sets, has a review/reject revert loop (cyclic), and carries a parallel
  # name-change sub-status dimension independent of the main status.

  relationship_patterns:
    - one_to_many          # Application has many SupportingDocument, ApplicationStatusEvent
    - cross_aggregate      # FeeAssessment references Application; Appointment references facility/counter
    - polymorphic          # Appointment.resource_kind selects AcceptanceFacility | UrgentTravelCounter

  role_model: segregation_of_duties
  # An AcceptanceAgent who executes/verifies an application's documents cannot also be the
  # Adjudicator who approves it. Applicant is entity-backed and owns own application.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_legal_name
        type: string
        source: input
        description: Current legal name on the application.
        constraints: non-empty, max 120 chars
      - name: date_of_birth
        type: string
        source: input
        description: ISO date (YYYY-MM-DD). Drives minor classification and base-fee age band.
        constraints: valid past date
      - name: email
        type: string
        source: input
        description: Contact email; unique identity handle for the Applicant role.
        constraints: unique across Applicants, lowercase-normalized
      - name: is_minor
        type: boolean
        source: computed
        description: |
          True when (clock_current_utc date) minus date_of_birth is strictly less than
          16 years (the applicant has NOT yet reached the 16th birthday). Recomputed when
          referenced; pinned at Application creation onto Application.applicant_is_minor.
      - name: verification_risk_score
        type: number
        source: computed
        description: |
          FINAL-variant weighted risk score (see calculations.verification_risk_score),
          recomputed and stored whenever a SupportingDocument or Photo on any of this
          applicant's Applications changes verification_status. 2 decimals.
      - name: guardian_applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the parent/guardian Applicant for a minor applicant. null for adults.
        default: null
      - name: total_fees_paid_cents
        type: integer
        source: computed
        description: |
          Conserved ledger: sum of FeeAssessment.amount_paid_cents over this applicant's
          Applications. Forward charges add; refund compensations subtract. Invariant pinned
          in calculations.fee_ledger_conservation.
        default: 0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the primary applicant (the minor child for MINOR type).
      - name: application_type
        type: enum
        source: input
        description: Application path selector.
        constraints: one of {NEW, RENEWAL, MINOR}
      - name: product_type
        type: enum
        source: input
        description: Requested travel document product.
        constraints: one of {BOOK, CARD, BOOK_AND_CARD}
      - name: service_level
        type: enum
        source: input
        description: Routine vs expedite processing tier.
        default: ROUTINE
        constraints: one of {ROUTINE, EXPEDITE}
      - name: applicant_is_minor
        type: boolean
        source: computed
        description: Snapshot of Applicant.is_minor pinned at creation; drives base-fee age band and execution requirement.
      - name: requires_execution
        type: boolean
        source: computed
        description: |
          True for application_type in {NEW, MINOR}; true for RENEWAL only when name_change_requested
          is true and the name-change is NOT mail-eligible. False for plain RENEWAL. Drives the $35 execution fee.
      - name: name_change_requested
        type: boolean
        source: input
        description: Whether the applicant requests a legal name change on this application.
        default: false
      - name: prior_name
        type: string
        source: input
        description: Former legal name when name_change_requested; null otherwise.
        default: null
      - name: name_change_status
        type: enum
        source: computed
        description: |
          Parallel sub-status dimension, independent of `status`. Lifecycle in state_machines (Application.name_change_status).
        default: NONE
        constraints: one of {NONE, PENDING_EVIDENCE, EVIDENCE_VERIFIED, APPROVED, DENIED}
      - name: status
        type: enum
        source: computed
        description: Main lifecycle status (see state_machines.Application).
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, IN_VERIFICATION, REVIEW_HOLD, ADJUDICATING, APPROVED, ISSUED, REJECTED, WITHDRAWN}
      - name: urgent_travel
        type: boolean
        source: computed
        description: True once an UrgentTravelCounter Appointment is confirmed for this application; adds the urgent surcharge.
        default: false
      - name: submitted_at
        type: string
        source: system
        description: ISO 8601 UTC timestamp stamped at DRAFT->SUBMITTED; null while DRAFT.
        default: null
      - name: verification_completed_at
        type: string
        source: system
        description: ISO 8601 UTC stamped when the last required SupportingDocument reaches ACCEPTED (IN_VERIFICATION->ADJUDICATING leg); null otherwise.
        default: null
      - name: target_completion_date
        type: string
        source: computed
        description: |
          FORWARD-LOOKING SLA date (see calculations.processing_sla_target). ISO date. Recomputed
          at submission and whenever service_level changes; the chronological variant is exposed
          separately on the summary endpoint.
        default: null
      - name: assigned_acceptance_agent_id
        type: string
        source: input
        description: FK -> AcceptanceAgent.id; the agent who executed/verified docs. Locks SoD against adjudication.
        default: null
      - name: adjudicator_id
        type: string
        source: input
        description: FK -> Adjudicator.id; the adjudicator who decided. Must differ from assigned_acceptance_agent_id's person.
        default: null

  - name: AcceptanceAgent
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Acceptance agent display name.
      - name: badge_number
        type: string
        source: input
        description: Operator badge; unique.
        constraints: unique across AcceptanceAgents
      - name: facility_id
        type: string
        source: input
        description: FK -> AcceptanceFacility.id; the facility this agent staffs.

  - name: Adjudicator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Adjudicator display name.
      - name: passport_office_code
        type: string
        source: input
        description: Office code; unique.
        constraints: unique across Adjudicators

  - name: SupportingDocument
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application this document supports.
      - name: doc_category
        type: enum
        source: input
        description: Verification factor this document satisfies.
        constraints: one of {IDENTITY, CITIZENSHIP, GUARDIAN_CONSENT, NAME_CHANGE_EVIDENCE}
      - name: doc_kind
        type: string
        source: input
        description: Specific document kind (e.g., DRIVERS_LICENSE, BIRTH_CERTIFICATE, MARRIAGE_CERTIFICATE).
      - name: declared_quality
        type: integer
        source: input
        description: Self-declared legibility/quality score 0-100, used by the risk score when ACCEPTED.
        default: 100
        constraints: 0..100
      - name: verification_status
        type: enum
        source: computed
        description: Document verification lifecycle (see state_machines.SupportingDocument).
        default: PENDING
        constraints: one of {PENDING, ACCEPTED, REJECTED}
      - name: reviewed_by_agent_id
        type: string
        source: input
        description: FK -> AcceptanceAgent.id; agent who verified this document. null while PENDING.
        default: null

  - name: Photo
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application this photo belongs to.
      - name: width_px
        type: integer
        source: input
        description: Photo width in pixels.
        constraints: "> 0"
      - name: height_px
        type: integer
        source: input
        description: Photo height in pixels.
        constraints: "> 0"
      - name: head_height_fraction
        type: number
        source: input
        description: Fraction of image height occupied by the head (chin to crown).
        constraints: 0 < x < 1
      - name: background_is_white
        type: boolean
        source: input
        description: Whether the background passes the plain-white check.
      - name: validation_result
        type: enum
        source: computed
        description: Auto photo-validation outcome (see calculations.photo_validation).
        default: PENDING
        constraints: one of {PENDING, PASS, FAIL}
      - name: failure_reasons
        type: array
        source: computed
        description: List of failed-rule codes when validation_result is FAIL; empty on PASS.
        default: []

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application being charged.
      - name: base_fee_cents
        type: integer
        source: computed
        description: Product+age base fee (see calculations.fee_assessment).
      - name: execution_fee_cents
        type: integer
        source: computed
        description: $35.00 execution fee when Application.requires_execution; else 0.
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: $60.00 when service_level EXPEDITE; else 0.
      - name: urgent_surcharge_cents
        type: integer
        source: computed
        description: $60.00 when Application.urgent_travel; else 0.
      - name: one_day_delivery_cents
        type: integer
        source: computed
        description: $21.36 when one_day_delivery requested; else 0.
      - name: one_day_delivery
        type: boolean
        source: input
        description: Whether 1-day return delivery is purchased.
        default: false
      - name: total_due_cents
        type: integer
        source: computed
        description: Sum of all fee components (see calculations.fee_assessment); single round at the end.
      - name: amount_paid_cents
        type: integer
        source: computed
        description: |
          Conserved ledger field. Equals total_due_cents once PAID; reduced to 0 on refund
          compensation. Feeds Applicant.total_fees_paid_cents.
        default: 0
      - name: payment_status
        type: enum
        source: computed
        description: Fee payment lifecycle (see state_machines.FeeAssessment).
        default: UNPAID
        constraints: one of {UNPAID, PAID, REFUNDED}

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application this appointment serves.
      - name: resource_kind
        type: enum
        source: input
        description: Which scheduling resource this appointment occupies.
        constraints: one of {ACCEPTANCE_FACILITY, URGENT_TRAVEL_COUNTER}
      - name: facility_id
        type: string
        source: input
        description: FK -> AcceptanceFacility.id; set when resource_kind is ACCEPTANCE_FACILITY, else null.
        default: null
      - name: counter_id
        type: string
        source: input
        description: FK -> UrgentTravelCounter.id; set when resource_kind is URGENT_TRAVEL_COUNTER, else null.
        default: null
      - name: start_utc
        type: string
        source: input
        description: ISO 8601 UTC appointment start.
      - name: end_utc
        type: string
        source: input
        description: ISO 8601 UTC appointment end; must be strictly after start_utc.
      - name: status
        type: enum
        source: computed
        description: Appointment lifecycle (see state_machines.Appointment).
        default: BOOKED
        constraints: one of {BOOKED, COMPLETED, CANCELLED}

  - name: AcceptanceFacility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Facility display name.
      - name: state_code
        type: string
        source: input
        description: Two-letter state code.
        constraints: length 2, uppercase

  - name: UrgentTravelCounter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Urgent-travel counter display name.
      - name: cleanup_buffer_minutes
        type: integer
        source: input
        description: Post-appointment buffer minutes that extend each booking's exclusion window.
        default: 15
        constraints: ">= 0"

  - name: AdjudicationDecision
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the adjudicated application.
      - name: adjudicator_id
        type: string
        source: input
        description: FK -> Adjudicator.id; deciding adjudicator.
      - name: decision
        type: enum
        source: input
        description: Adjudication outcome.
        constraints: one of {APPROVE, REJECT, RETURN_FOR_REVIEW}
      - name: reason_code
        type: string
        source: input
        description: Short machine code for the decision rationale.
        default: null

  - name: ApplicationStatusEvent
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application whose status changed.
      - name: from_status
        type: string
        source: system
        description: Status before the transition; null for the creation event.
        default: null
      - name: to_status
        type: string
        source: system
        description: Status after the transition.
      - name: actor_role
        type: string
        source: system
        description: Role that triggered the transition.
      - name: occurred_at
        type: string
        source: system
        description: ISO 8601 UTC timestamp of the transition (equals system clock at the time).

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [ISSUED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application.status == DRAFT"
          - "At least one Photo exists for the application with validation_result == PASS"
          - "For application_type MINOR: a SupportingDocument with doc_category GUARDIAN_CONSENT exists (any verification_status)"
          - "If name_change_requested: a SupportingDocument with doc_category NAME_CHANGE_EVIDENCE exists"
        side_effects:
          - "Stamp submitted_at = current clock"
          - "Recompute Application.target_completion_date via processing_sla_target FORWARD-LOOKING (from submitted_at)"
          - "Create FeeAssessment via calculations.fee_assessment (payment_status UNPAID)"
          - "Append ApplicationStatusEvent(from=DRAFT,to=SUBMITTED)"
          - "Recompute Applicant.verification_risk_score (PROVISIONAL inputs); increments Application.version by 1"
      - from: SUBMITTED
        to: IN_VERIFICATION
        trigger: "POST /applications/{id}/begin-verification"
        actor: AcceptanceAgent
        preconditions:
          - "Application.status == SUBMITTED"
          - "FeeAssessment for the application has payment_status == PAID"
          - "Application.assigned_acceptance_agent_id is set to the acting agent (pinned on this call)"
        side_effects:
          - "Set assigned_acceptance_agent_id = acting agent"
          - "Append ApplicationStatusEvent(from=SUBMITTED,to=IN_VERIFICATION)"
          - "increments Application.version by 1"
      - from: IN_VERIFICATION
        to: ADJUDICATING
        trigger: "system: last required SupportingDocument transitions PENDING->ACCEPTED"
        actor: system
        preconditions:
          - "Application.status == IN_VERIFICATION"
          - "Every required SupportingDocument for the application has verification_status == ACCEPTED (required set depends on application_type)"
          - "Application name_change_status is NONE or APPROVED"
        side_effects:
          - "Stamp verification_completed_at = current clock"
          - "Recompute Applicant.verification_risk_score (FINAL inputs)"
          - "Append ApplicationStatusEvent(from=IN_VERIFICATION,to=ADJUDICATING)"
          - "increments Application.version by 1"
        note: "Auto-transition fired as the cascade tail of accepting the last required document."
      - from: IN_VERIFICATION
        to: REVIEW_HOLD
        trigger: "system: Applicant.verification_risk_score recompute yields score > 50"
        actor: system
        preconditions:
          - "Application.status == IN_VERIFICATION"
          - "Applicant.verification_risk_score (FINAL) > 50"
        side_effects:
          - "Append ApplicationStatusEvent(from=IN_VERIFICATION,to=REVIEW_HOLD)"
          - "increments Application.version by 1"
        note: "Risk threshold gate. Strict > 50; exactly 50.00 does NOT hold."
      - from: REVIEW_HOLD
        to: IN_VERIFICATION
        trigger: "POST /applications/{id}/clear-hold"
        actor: Adjudicator
        preconditions:
          - "Application.status == REVIEW_HOLD"
        side_effects:
          - "Append ApplicationStatusEvent(from=REVIEW_HOLD,to=IN_VERIFICATION)"
          - "increments Application.version by 1"
        note: "Revert leg of the review loop."
      - from: ADJUDICATING
        to: APPROVED
        trigger: "POST /applications/{id}/adjudicate (decision=APPROVE)"
        actor: Adjudicator
        preconditions:
          - "Application.status == ADJUDICATING"
          - "Acting adjudicator's id differs from the AcceptanceAgent who verified (SoD): adjudicator's underlying person != assigned_acceptance_agent_id's person"
          - "FeeAssessment.payment_status == PAID"
        side_effects:
          - "Create AdjudicationDecision(decision=APPROVE)"
          - "Set adjudicator_id"
          - "Append ApplicationStatusEvent(from=ADJUDICATING,to=APPROVED)"
          - "increments Application.version by 1"
      - from: ADJUDICATING
        to: REVIEW_HOLD
        trigger: "POST /applications/{id}/adjudicate (decision=RETURN_FOR_REVIEW)"
        actor: Adjudicator
        preconditions:
          - "Application.status == ADJUDICATING"
        side_effects:
          - "Create AdjudicationDecision(decision=RETURN_FOR_REVIEW)"
          - "Append ApplicationStatusEvent(from=ADJUDICATING,to=REVIEW_HOLD)"
          - "increments Application.version by 1"
        note: "Cyclic revert; returns the application to the hold queue."
      - from: ADJUDICATING
        to: REJECTED
        trigger: "POST /applications/{id}/adjudicate (decision=REJECT)"
        actor: Adjudicator
        preconditions:
          - "Application.status == ADJUDICATING"
          - "Acting adjudicator's person != assigned_acceptance_agent_id's person (SoD)"
        side_effects:
          - "Create AdjudicationDecision(decision=REJECT)"
          - "COMPENSATION: refund FeeAssessment (payment_status PAID->REFUNDED, amount_paid_cents->0); decrement Applicant.total_fees_paid_cents by the refunded amount"
          - "Cancel any BOOKED Appointment for the application (status->CANCELLED)"
          - "Append ApplicationStatusEvent(from=ADJUDICATING,to=REJECTED)"
          - "increments Application.version by 1"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /applications/{id}/issue"
        actor: Adjudicator
        preconditions:
          - "Application.status == APPROVED"
        side_effects:
          - "Mark any BOOKED Appointment for the application COMPLETED"
          - "Append ApplicationStatusEvent(from=APPROVED,to=ISSUED)"
          - "increments Application.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status in {DRAFT, SUBMITTED, IN_VERIFICATION, REVIEW_HOLD}"
        side_effects:
          - "COMPENSATION: if FeeAssessment.payment_status == PAID, refund it (->REFUNDED, amount_paid_cents->0) and decrement Applicant.total_fees_paid_cents"
          - "Cancel any BOOKED Appointment (status->CANCELLED)"
          - "Append ApplicationStatusEvent(to=WITHDRAWN)"
          - "increments Application.version by 1"
        note: "from also valid from SUBMITTED, IN_VERIFICATION, REVIEW_HOLD (single transition row, multi-source)."

  - entity: Application.name_change_status
    initial_state: NONE
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: NONE
        to: PENDING_EVIDENCE
        trigger: "system: Application created with name_change_requested == true"
        actor: system
        preconditions:
          - "Application.name_change_requested == true"
        side_effects:
          - "Set name_change_status = PENDING_EVIDENCE"
        note: "Parallel dimension; independent of main status which is still DRAFT."
      - from: PENDING_EVIDENCE
        to: EVIDENCE_VERIFIED
        trigger: "system: a SupportingDocument with doc_category NAME_CHANGE_EVIDENCE transitions PENDING->ACCEPTED"
        actor: system
        preconditions:
          - "Application.name_change_status == PENDING_EVIDENCE"
        side_effects:
          - "Set name_change_status = EVIDENCE_VERIFIED"
      - from: EVIDENCE_VERIFIED
        to: APPROVED
        trigger: "POST /applications/{id}/name-change/decide (decision=APPROVE)"
        actor: Adjudicator
        preconditions:
          - "Application.name_change_status == EVIDENCE_VERIFIED"
        side_effects:
          - "Set name_change_status = APPROVED"
          - "Set Applicant.full_legal_name = Application.full_legal_name pending? (record applied); increments Application.version by 1"
      - from: EVIDENCE_VERIFIED
        to: DENIED
        trigger: "POST /applications/{id}/name-change/decide (decision=DENY)"
        actor: Adjudicator
        preconditions:
          - "Application.name_change_status == EVIDENCE_VERIFIED"
        side_effects:
          - "Set name_change_status = DENIED; increments Application.version by 1"

  - entity: SupportingDocument
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /documents/{id}/verify (outcome=ACCEPT)"
        actor: AcceptanceAgent
        preconditions:
          - "SupportingDocument.verification_status == PENDING"
          - "parent Application.status == IN_VERIFICATION"
          - "acting agent == Application.assigned_acceptance_agent_id"
        side_effects:
          - "Set reviewed_by_agent_id = acting agent"
          - "Recompute Applicant.verification_risk_score (FINAL)"
          - "CASCADE: if this is doc_category NAME_CHANGE_EVIDENCE, advance Application.name_change_status PENDING_EVIDENCE->EVIDENCE_VERIFIED"
          - "CASCADE: if this was the last required document, fire Application IN_VERIFICATION->ADJUDICATING (or ->REVIEW_HOLD if FINAL risk > 50)"
          - "increments parent Application.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /documents/{id}/verify (outcome=REJECT)"
        actor: AcceptanceAgent
        preconditions:
          - "SupportingDocument.verification_status == PENDING"
          - "parent Application.status == IN_VERIFICATION"
          - "acting agent == Application.assigned_acceptance_agent_id"
        side_effects:
          - "Set reviewed_by_agent_id = acting agent"
          - "Recompute Applicant.verification_risk_score (FINAL)"
          - "increments parent Application.version by 1"

  - entity: FeeAssessment
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /fee-assessments/{id}/pay"
        actor: Applicant
        preconditions:
          - "FeeAssessment.payment_status == UNPAID"
          - "amount_tendered_cents == total_due_cents"
        side_effects:
          - "Set amount_paid_cents = total_due_cents"
          - "Increment Applicant.total_fees_paid_cents by total_due_cents"
          - "increments FeeAssessment.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "system: Application REJECTED or WITHDRAWN (compensation)"
        actor: system
        preconditions:
          - "FeeAssessment.payment_status == PAID"
        side_effects:
          - "Decrement Applicant.total_fees_paid_cents by amount_paid_cents"
          - "Set amount_paid_cents = 0"
          - "increments FeeAssessment.version by 1"
        note: "Compensating action; conserves Applicant.total_fees_paid_cents to net forward charges."

  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "system: Application ISSUED, or POST /appointments/{id}/complete by AcceptanceAgent"
        actor: system
        preconditions:
          - "Appointment.status == BOOKED"
        side_effects:
          - "increments Appointment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel, or system on Application REJECTED/WITHDRAWN"
        actor: Applicant
        preconditions:
          - "Appointment.status == BOOKED"
        side_effects:
          - "If resource_kind == URGENT_TRAVEL_COUNTER and no other BOOKED urgent appointment remains for the application: set Application.urgent_travel = false and re-derive FeeAssessment if still UNPAID"
          - "increments Appointment.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-book-stale-application
    parent_entity: Application
    write_endpoint: "POST /appointments"
    occ_field: "expected_application_version"
    description: |
      Booking an Appointment against an Application whose version has advanced since the
      client last observed it is rejected on a stale version. This captures the case where
      another writer has just booked the single permitted URGENT_TRAVEL_COUNTER appointment
      (which legitimately flips Application.urgent_travel true and re-derives the fee),
      leaving the current writer's view of the application stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: feeassessment-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/submit"
    occ_field: "expected_application_version"
    description: |
      Submitting an Application (which creates its FeeAssessment) against a version that has
      advanced since the client last read it is rejected on a stale version. The version may
      have advanced because a name-change cascade or a photo re-validation mutated the
      application after the client's last read, so the snapshot the client is submitting from
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fee_assessment
    trigger: "Application DRAFT->SUBMITTED (FeeAssessment created); re-derived if urgent_travel flips while UNPAID"
    algorithm: aggregation
    formula: |
      # all amounts in integer cents; single round at the very end
      is_minor   = Application.applicant_is_minor
      book_cents = 10000 if is_minor else 13000       # $100 / $130
      card_cents =  1500 if is_minor else  3000       # $15  / $30
      if product_type == "BOOK":
          base = book_cents
      elif product_type == "CARD":
          base = card_cents
      elif product_type == "BOOK_AND_CARD":
          base = book_cents + card_cents - 1000        # $10 bundle discount
      execution = 3500 if Application.requires_execution else 0
      expedite  = 6000 if service_level == "EXPEDITE" else 0
      urgent    = 6000 if Application.urgent_travel else 0
      delivery  = 2136 if one_day_delivery else 0      # $21.36
      total_due_cents = base + execution + expedite + urgent + delivery
    input_set: "Single Application; reads its own product_type, applicant_is_minor, requires_execution, service_level, urgent_travel, and FeeAssessment.one_day_delivery"
    constants:
      BOOK_ADULT_CENTS: 13000
      BOOK_MINOR_CENTS: 10000
      CARD_ADULT_CENTS: 3000
      CARD_MINOR_CENTS: 1500
      BUNDLE_DISCOUNT_CENTS: 1000
      EXECUTION_FEE_CENTS: 3500
      EXPEDITE_FEE_CENTS: 6000
      URGENT_SURCHARGE_CENTS: 6000
      ONE_DAY_DELIVERY_CENTS: 2136
    precision: "integer cents; no fractional cents possible; total is exact sum"
    variants:
      - name: bundle_with_minor_age_band
        when: "product_type == BOOK_AND_CARD and applicant_is_minor"
        difference: "base = 10000 + 1500 - 1000 = 10500 (vs adult 13000+3000-1000=15000); the bundle discount and minor age band interact multiplicatively across two products"

  - name: verification_risk_score
    trigger: "On Application submit (PROVISIONAL); on every SupportingDocument/Photo verification_status change (FINAL); stored on Applicant.verification_risk_score"
    algorithm: weighted_scoring
    formula: |
      # quality per factor in 0..100; weighted quality then risk = 100 - quality
      W_IDENTITY = 0.40; W_CITIZENSHIP = 0.35; W_PHOTO = 0.25
      def factor_quality(category):
          # FINAL variant: the highest declared_quality among ACCEPTED docs of this category, else 0
          # PROVISIONAL variant: 0 for any category whose docs are all still PENDING (worst case)
          docs = SupportingDocuments(application, doc_category=category)
          accepted = [d.declared_quality for d in docs if d.verification_status == "ACCEPTED"]
          return max(accepted) if accepted else 0
      photo_quality = 100 if any Photo for application has validation_result == "PASS" else 0
      quality = W_IDENTITY*factor_quality(IDENTITY) + W_CITIZENSHIP*factor_quality(CITIZENSHIP) + W_PHOTO*photo_quality
      risk = round_half_up(100 - quality, 2)
    input_set: "All SupportingDocuments and Photos of every Application owned by the Applicant; only ACCEPTED docs contribute in FINAL"
    constants:
      W_IDENTITY: 0.40
      W_CITIZENSHIP: 0.35
      W_PHOTO: 0.25
      REVIEW_HOLD_THRESHOLD: 50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_at_submission
        when: "Application transitions DRAFT->SUBMITTED, before any document is verified"
        difference: "PENDING docs contribute quality 0 (worst case); a docs-all-pending applicant with a PASS photo scores 75.00 — distinct from FINAL where ACCEPTED identity+citizenship drive it to 0.00"
      - name: final_at_verification
        when: "A SupportingDocument or Photo verification_status changes"
        difference: "only ACCEPTED docs contribute their declared_quality; result drives the > 50 REVIEW_HOLD gate"

  - name: processing_sla_target
    trigger: "Application submit (FORWARD-LOOKING -> stored on target_completion_date); GET summary recomputes CHRONOLOGICAL"
    algorithm: forward_looking
    formula: |
      ROUTINE_DAYS = 42; EXPEDITE_DAYS = 21
      days = EXPEDITE_DAYS if service_level == "EXPEDITE" else ROUTINE_DAYS
      # FORWARD-LOOKING: effective_start = date(submitted_at)
      # CHRONOLOGICAL  : effective_start = date(verification_completed_at) (null until verification done)
      target_date = effective_start_date + days   # calendar days, returns ISO date
    input_set: "Single Application; reads service_level, submitted_at, verification_completed_at"
    constants:
      ROUTINE_DAYS: 42
      EXPEDITE_DAYS: 21
    precision: "calendar-day arithmetic; date-only result"
    variants:
      - name: forward_looking_from_submission
        when: "computed at submission and stored on target_completion_date"
        difference: "assumes verification clears instantly; effective_start = submitted_at date"
      - name: chronological_from_verification
        when: "computed on the summary endpoint after verification_completed_at is set"
        difference: "effective_start = verification_completed_at date; for a 7-day verification delay the two targets differ by exactly 7 days"

  - name: photo_validation
    trigger: "POST /applications/{id}/photos and POST /photos/{id}/revalidate"
    algorithm: threshold
    formula: |
      reasons = []
      ratio = width_px / height_px
      if not (600 <= width_px and 600 <= height_px): reasons.append("DIMENSION_TOO_SMALL")
      if not (0.98 <= ratio <= 1.02): reasons.append("NOT_SQUARE")
      if not (0.50 <= head_height_fraction <= 0.69): reasons.append("HEAD_OUT_OF_RANGE")
      if not background_is_white: reasons.append("BACKGROUND_NOT_WHITE")
      validation_result = "PASS" if len(reasons) == 0 else "FAIL"
      failure_reasons = reasons
    input_set: "Single Photo's width_px, height_px, head_height_fraction, background_is_white"
    constants:
      MIN_DIMENSION_PX: 600
      RATIO_MIN: 0.98
      RATIO_MAX: 1.02
      HEAD_FRACTION_MIN: 0.50
      HEAD_FRACTION_MAX: 0.69
    precision: "exact inclusive boundaries (>= / <=)"
    variants:
      - name: head_fraction_upper_boundary
        when: "head_height_fraction exactly 0.69 vs 0.70"
        difference: "0.69 PASS (inclusive), 0.70 FAIL (HEAD_OUT_OF_RANGE) — boundary precision"

  - name: fee_ledger_conservation
    trigger: "Invariant audited after any pay/refund compensation"
    algorithm: aggregation
    formula: |
      # Conserved quantity: a refund must exactly reverse the matching charge.
      # For any Applicant, after a forward PAY followed by its compensating REFUND:
      Applicant.total_fees_paid_cents == sum(
          fa.amount_paid_cents for fa in FeeAssessments(applicant)
          where fa.payment_status == "PAID"
      )
      # amount_paid_cents is total_due_cents when PAID and 0 when REFUNDED, so a PAY+REFUND
      # pair on the same FeeAssessment leaves total_fees_paid_cents exactly where it began.
    input_set: "All FeeAssessments whose application.applicant_id == applicant; PAID-only contribute"
    constants: {}
    precision: "integer cents; exact"
    variants:
      - name: reject_refund_neutrality
        when: "Application ADJUDICATING->REJECTED after fee PAID"
        difference: "the refund decrement equals the original increment; net contribution to total_fees_paid_cents is 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /applicants and POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: existence
    check: "FK body fields reference existing resources (applicant_id, application_id, facility_id, counter_id, adjudicator_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "create/booking endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2 from:)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "Terminal resources (ISSUED/REJECTED/WITHDRAWN applications; REFUNDED fee; COMPLETED/CANCELLED appointment) reject further transitions"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "transition endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: the Adjudicator deciding an application must not be the same person as its assigned_acceptance_agent_id; an AcceptanceAgent cannot verify a document on an application they did not begin-verification on"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /applications/{id}/adjudicate, POST /documents/{id}/verify"
  - priority: 8
    category: business_constraint
    check: "Photo validation: submit requires at least one PASS photo; a FAIL photo cannot satisfy the submit precondition"
    error_id: ERR_PHOTO_INVALID
    http_status: 422
    applies_to: "POST /applications/{id}/submit"
  - priority: 9
    category: business_constraint
    check: "MINOR application requires a GUARDIAN_CONSENT document and a non-null guardian_applicant_id on the applicant before submit"
    error_id: ERR_GUARDIAN_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /applications/{id}/submit"
  - priority: 10
    category: business_constraint
    check: "Name-change application requires a NAME_CHANGE_EVIDENCE document before submit; name-change decision requires name_change_status == EVIDENCE_VERIFIED"
    error_id: ERR_NAME_CHANGE_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /applications/{id}/submit, POST /applications/{id}/name-change/decide"
  - priority: 11
    category: business_temporal
    check: "AcceptanceFacility appointment slot must not overlap an existing BOOKED facility appointment (half-open [start,end); adjacency end==start allowed)"
    error_id: ERR_FACILITY_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /appointments (resource_kind ACCEPTANCE_FACILITY)"
  - priority: 12
    category: business_temporal
    check: "UrgentTravelCounter appointment must not fall within an existing BOOKED counter appointment's buffer-extended window [start, end + cleanup_buffer_minutes); start == end+buffer allowed"
    error_id: ERR_COUNTER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /appointments (resource_kind URGENT_TRAVEL_COUNTER)"
  - priority: 13
    category: business_constraint
    check: "Appointment end_utc must be strictly after start_utc"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /appointments"
  - priority: 14
    category: business_constraint
    check: "An application may hold at most one BOOKED URGENT_TRAVEL_COUNTER appointment at a time"
    error_id: ERR_DUPLICATE_URGENT_APPOINTMENT
    http_status: 409
    applies_to: "POST /appointments (resource_kind URGENT_TRAVEL_COUNTER)"
  - priority: 15
    category: business_fiscal
    check: "Fee payment amount_tendered_cents must equal FeeAssessment.total_due_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /fee-assessments/{id}/pay"
  - priority: 16
    category: business_fiscal
    check: "begin-verification requires the FeeAssessment to be PAID"
    error_id: ERR_FEE_UNPAID
    http_status: 409
    applies_to: "POST /applications/{id}/begin-verification"
  - priority: 17
    category: business_constraint
    check: "Optimistic-concurrency: expected_application_version must equal the Application's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/submit, POST /appointments"
  - priority: 18
    category: business_constraint
    check: "Request body field types and enum membership are valid; required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /applicants
    description: Register an applicant (adult or minor).
    roles: [Applicant, Adjudicator]
    code: 201
    input: [full_legal_name, date_of_birth, email, "guardian_applicant_id?"]
    output: Applicant
    side_effects: ["Compute is_minor against current clock"]
  - method: GET
    path: /applicants/{id}
    description: Read an applicant including verification_risk_score and total_fees_paid_cents.
    roles: [Applicant, Adjudicator, AcceptanceAgent]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: /applicants
    description: List applicants; filter by guardian_applicant_id to find a guardian's minors.
    roles: [Adjudicator, AcceptanceAgent]
    code: 200
    input: ["guardian_applicant_id?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  - method: POST
    path: /applications
    description: Create a DRAFT application.
    roles: [Applicant]
    code: 201
    input: [applicant_id, application_type, product_type, "service_level?", "name_change_requested?", "prior_name?"]
    output: Application
    side_effects:
      - "Pin applicant_is_minor and requires_execution"
      - "If name_change_requested: set name_change_status = PENDING_EVIDENCE"
  - method: GET
    path: /applications/{id}
    description: Read an application.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: /applications
    description: List applications; filter by applicant_id, status.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: ["applicant_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: /applications/{id}/summary
    description: Computed read — both SLA variants, current fee, verification progress.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: []
    output: "{ forward_looking_target_date: string, chronological_target_date: string, total_due_cents: integer, required_docs_total: integer, required_docs_accepted: integer }"
    side_effects: ["Recompute CHRONOLOGICAL SLA variant"]
  - method: POST
    path: /applications/{id}/submit
    description: DRAFT->SUBMITTED; creates FeeAssessment.
    roles: [Applicant]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects:
      - "Stamp submitted_at; compute FORWARD-LOOKING target_completion_date"
      - "Create FeeAssessment (UNPAID)"
      - "Recompute Applicant.verification_risk_score (PROVISIONAL)"
      - "Append ApplicationStatusEvent"
      - "increments Application.version by 1"
  - method: POST
    path: /applications/{id}/begin-verification
    description: SUBMITTED->IN_VERIFICATION; pins acting agent.
    roles: [AcceptanceAgent]
    code: 200
    input: []
    output: Application
    side_effects: ["Set assigned_acceptance_agent_id", "Append ApplicationStatusEvent", "increments Application.version by 1"]
  - method: POST
    path: /applications/{id}/clear-hold
    description: REVIEW_HOLD->IN_VERIFICATION revert.
    roles: [Adjudicator]
    code: 200
    input: []
    output: Application
    side_effects: ["Append ApplicationStatusEvent", "increments Application.version by 1"]
  - method: POST
    path: /applications/{id}/adjudicate
    description: ADJUDICATING -> APPROVED|REJECTED|REVIEW_HOLD.
    roles: [Adjudicator]
    code: 200
    input: [decision, "reason_code?"]
    output: Application
    side_effects:
      - "Create AdjudicationDecision"
      - "On REJECT: refund fee (compensation) and decrement Applicant.total_fees_paid_cents; cancel BOOKED appointments"
      - "Append ApplicationStatusEvent"
      - "increments Application.version by 1"
  - method: POST
    path: /applications/{id}/issue
    description: APPROVED->ISSUED.
    roles: [Adjudicator]
    code: 200
    input: []
    output: Application
    side_effects: ["Mark BOOKED appointment COMPLETED", "Append ApplicationStatusEvent", "increments Application.version by 1"]
  - method: POST
    path: /applications/{id}/withdraw
    description: Withdraw from DRAFT/SUBMITTED/IN_VERIFICATION/REVIEW_HOLD.
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "If fee PAID: refund (compensation) and decrement Applicant.total_fees_paid_cents"
      - "Cancel BOOKED appointments"
      - "Append ApplicationStatusEvent"
      - "increments Application.version by 1"
  - method: POST
    path: /applications/{id}/name-change/decide
    description: name_change_status EVIDENCE_VERIFIED -> APPROVED|DENIED.
    roles: [Adjudicator]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["On APPROVE: apply Applicant.full_legal_name", "increments Application.version by 1"]
  - method: GET
    path: /applications/{id}/status-events
    description: Reverse-reachability for ApplicationStatusEvent; ordered by occurred_at.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: ["limit?", "offset?"]
    output: ApplicationStatusEvent[]
    side_effects: []

  - method: POST
    path: /applications/{id}/documents
    description: Attach a supporting document (PENDING).
    roles: [Applicant]
    code: 201
    input: [doc_category, doc_kind, "declared_quality?"]
    output: SupportingDocument
    side_effects: []
  - method: GET
    path: /applications/{id}/documents
    description: Reverse-reachability for SupportingDocument by application.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: ["limit?", "offset?"]
    output: SupportingDocument[]
    side_effects: []
  - method: GET
    path: /documents/{id}
    description: Read a supporting document.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: []
    output: SupportingDocument
    side_effects: []
  - method: POST
    path: /documents/{id}/verify
    description: PENDING -> ACCEPTED|REJECTED by the assigned agent.
    roles: [AcceptanceAgent]
    code: 200
    input: [outcome]
    output: SupportingDocument
    side_effects:
      - "Recompute Applicant.verification_risk_score (FINAL)"
      - "CASCADE name_change_status if NAME_CHANGE_EVIDENCE accepted"
      - "CASCADE Application IN_VERIFICATION->ADJUDICATING or ->REVIEW_HOLD on last required accept"
      - "increments parent Application.version by 1"

  - method: POST
    path: /applications/{id}/photos
    description: Attach a photo; runs photo_validation immediately.
    roles: [Applicant]
    code: 201
    input: [width_px, height_px, head_height_fraction, background_is_white]
    output: Photo
    side_effects: ["Compute validation_result and failure_reasons"]
  - method: GET
    path: /applications/{id}/photos
    description: Reverse-reachability for Photo by application.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: ["limit?", "offset?"]
    output: Photo[]
    side_effects: []
  - method: POST
    path: /photos/{id}/revalidate
    description: Re-run photo_validation (e.g., after operator override of inputs).
    roles: [Applicant, AcceptanceAgent]
    code: 200
    input: ["width_px?", "height_px?", "head_height_fraction?", "background_is_white?"]
    output: Photo
    side_effects: ["Recompute validation_result and failure_reasons"]

  - method: GET
    path: /fee-assessments/{id}
    description: Read a fee assessment.
    roles: [Applicant, Adjudicator]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []
  - method: GET
    path: /fee-assessments
    description: Reverse-reachability for FeeAssessment by application.
    roles: [Applicant, Adjudicator, AcceptanceAgent]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []
  - method: POST
    path: /fee-assessments/{id}/pay
    description: UNPAID->PAID; exact amount required.
    roles: [Applicant]
    code: 200
    input: [amount_tendered_cents]
    output: FeeAssessment
    side_effects: ["Set amount_paid_cents; increment Applicant.total_fees_paid_cents", "increments FeeAssessment.version by 1"]

  - method: POST
    path: /acceptance-facilities
    description: Create an acceptance facility.
    roles: [Adjudicator]
    code: 201
    input: [name, state_code]
    output: AcceptanceFacility
    side_effects: []
  - method: GET
    path: /acceptance-facilities/{id}
    description: Read a facility.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: []
    output: AcceptanceFacility
    side_effects: []
  - method: POST
    path: /urgent-travel-counters
