          assert:
            - "p1_status == DEVIATED and p1_dev == MINOR (580.0 >= 600.0 - 20 inclusive; 30 <= 30 inclusive)"
            - "p2_status == DEVIATED and p2_dev == MAJOR (shortfall 31 > 30 even at full pressure)"
            - "p3_status == DEVIATED and p3_dev == MAJOR (579.9 < 580.0 misses the MINOR floor even with zero shortfall)"

      - name: brix_concentration_branch_standalone
        claim_type: correct_result
        grounds:
          - calculations.brix_adjustment
          - entities.Batch.fields.added_concentrate_liters
        distinguishing_aspect: |
          Concentration branch on its own: 2000 L at 11.5 vs target 12.0 with
          concentrate 65.0 -> addition = round(2000 * 0.5 / 53, 1) = 18.9 L of
          concentrate (divisor concentrate_brix - target_brix), water untouched.
        test_recipe:
          setup:
            - "Customer; DRAFT formula (target 12.0, tol 0.3, conc 65.0); tank cap 5000; batch 2000 L QA_FAILED at measured 11.5"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "ConcCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "CN-1", name: "Conc Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-CN", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 11.5 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { b_status: $.data.status } }
            - { call: "GET /v1/batches/${batch_id}", payload: {}, as: Any, captures: { b_conc: $.data.added_concentrate_liters, b_water: $.data.added_water_liters, b_qty: $.data.quantity_liters, b_count: $.data.adjustment_count } }
          assert:
            - "b_conc == 18.9 (round_half_up(2000 * 0.5 / (65.0 - 12.0), 1))"
            - "b_water == 0 (concentration branch never adds water)"
            - "b_qty == 2018.9 (mass balance) and b_count == 1 and b_status == BLENDING"

      - name: adjustment_rejected_when_tank_would_overflow
        claim_type: boundary_edge
        grounds:
          - calculations.brix_adjustment
          - errors[ERR_ADJUSTMENT_EXCEEDS_TANK_CAPACITY]
        distinguishing_aspect: |
          The capacity gate runs BEFORE applying: a computed 133.3 L addition on
          a 2000 L batch in a 2100 L tank is rejected atomically — no partial
          addition, counters untouched, batch stays QA_FAILED.
        test_recipe:
          setup:
            - "Customer; DRAFT formula (target 12.0, tol 0.3, conc 65.0); tank cap 2100; batch 2000 L QA_FAILED at measured 12.8"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "OverCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "OV-1", name: "Over Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-OV2", capacity_liters: 2100 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.8 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err: $.data.error_id } }
            - { call: "GET /v1/batches/${batch_id}", payload: {}, as: Any, captures: { b_qty: $.data.quantity_liters, b_count: $.data.adjustment_count, b_water: $.data.added_water_liters, b_status: $.data.status } }
          assert:
            - "err == ERR_ADJUSTMENT_EXCEEDS_TANK_CAPACITY, HTTP 422 (2000 + 133.3 > 2100)"
            - "b_qty == 2000 and b_water == 0 and b_count == 0 (atomic rejection, no partial addition)"
            - "b_status == QA_FAILED (unchanged)"

      - name: apply_adjustment_rejected_when_brix_in_band
        claim_type: violation_to_error
        grounds:
          - calculations.brix_adjustment
          - errors[ERR_NOTHING_TO_ADJUST]
        distinguishing_aspect: |
          A FAIL verdict is allowed on an in-tolerance reading (FAIL has no
          brix precondition), but apply-adjustment then refuses with
          ERR_NOTHING_TO_ADJUST because |12.2 - 12.0| <= 0.3 — the adjustment
          verb, not the verdict, owns the band check.
        test_recipe:
          setup:
            - "Customer; DRAFT formula; tank cap 5000; batch 2000 L recorded at 12.2 (inside band) with a FAIL verdict"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "NoAdjCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "NA-1", name: "NoAdj Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-NA", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.2 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err: $.data.error_id } }
            - { call: "GET /v1/batches/${batch_id}", payload: {}, as: Any, captures: { b_count: $.data.adjustment_count, b_status: $.data.status } }
          assert:
            - "err == ERR_NOTHING_TO_ADJUST, HTTP 409 (|12.2 - 12.0| = 0.2 <= 0.3, inclusive band)"
            - "b_count == 0 and b_status == QA_FAILED"

      - name: qa_pass_brix_band_inclusive_edges
        claim_type: boundary_edge
        grounds:
          - state_machines.Batch.AWAITING_QA_to_QA_PASSED
          - errors[ERR_BRIX_OUT_OF_TOLERANCE]
        distinguishing_aspect: |
          The QA PASS band is inclusive: measured 12.3 (exactly target + tol)
          passes; 12.31 fails with ERR_BRIX_OUT_OF_TOLERANCE and the batch
          remains AWAITING_QA, free to receive a FAIL verdict afterwards.
        test_recipe:
          setup:
            - "Customer; DRAFT formula (target 12.0, tol 0.3); tanks T-BE1/T-BE2 with batches BA (recorded 12.3) and BB (recorded 12.31), both AWAITING_QA"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "BandCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "BE-1", name: "Band Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
