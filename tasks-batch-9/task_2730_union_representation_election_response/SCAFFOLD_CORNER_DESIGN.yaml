      - name: the_petition_read_exposes_every_derived_aggregate_at_once
        claim_type: Computed read
        grounds:
          - endpoints.GET_petitions_id
          - endpoints.GET_petitions
          - calculations.core_wage_snapshot
          - calculations.showing_of_interest_ratio
          - invariants
        distinguishing_aspect: |
          One read must reconcile four independent derived layers computed by four different endpoints: the
          headcount buckets (90 + 12 + 0 == 102), the frozen core wage (2667, excluding the disputed QC
          group at 2900), the AS_RULED showing ratio (30 of 90 == 33.33 SUFFICIENT, where the AS_PETITIONED
          denominator 102 would have given 29.41 and dismissed the case) and the zero-valued case counters.
          The list endpoint must return the same row under a case_status filter with a correct envelope.
        test_recipe:
          setup:
            - "petition 07-RC-340404 with PROD 60 and MAINT 30 ruled INCLUDED and QC 12 ruled EXCLUDED"
            - "30 valid authorization cards after four kinds of strikes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
              as: LaborRelationsDirector
