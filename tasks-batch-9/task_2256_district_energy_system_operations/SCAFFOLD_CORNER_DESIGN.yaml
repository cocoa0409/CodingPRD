            - "the first plan creation returns 412 with ${e_stale_loop} == ERR_STALE_LOOP_VERSION"
            - "GET /district-energy/dispatch-plans?loop_id=${loop_k_id} has total_count == 0 after the refusal"
            - "${loop_k_v_fresh} == 2 and ${loop_k_reserved_1} == 1000.0, the activation having bumped both"
            - "the retry with the refreshed version returns 201 with ${plan_k_v1} == 1"
            - "${plan_k_v2} == 2 and ${plan_k_alloc} == 756.00, one version increment per write"
            - "NetworkLoop.${loop_k_id}.version == 2 still, because plan creation reads the loop without writing it"

      - name: an_agreement_version_read_before_activation_or_issue_is_stale_for_invoice_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[invoice-create-stale-agreement]
          - validations[priority 7 ERR_STALE_AGREEMENT_VERSION]
          - endpoints[POST /district-energy/invoices]
        distinguishing_aspect: "Invoice creation reads billed_demand_ratchet_kw and balance_due off the agreement, and both activation and a prior issue rewrite them, so the same stale-version identifier appears twice on the same agreement for two different reasons; the priority 7 check also outranks the period-overlap and meter-data rules, so the second refusal happens before the July period is ever examined."
        test_recipe:
          setup:
            - "Agreement CG1 (RESIDENTIAL_MULTIFAMILY, reserved 120.0) on LOOP-G with RS-R, created but not yet activated when its version is first read."
            - "MP-G1 commissioned with ACTUAL reads 10.000 at 55.0 on 2026-06-01 and 14.000 at 60.0 on 2026-06-28."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-G", name: "Greenfield Loop G", service_mode: "HEATING", design_supply_temp_c: 88.0, max_pressure_kpa: 1300.0, rated_capacity_kw: 10000.0 }
