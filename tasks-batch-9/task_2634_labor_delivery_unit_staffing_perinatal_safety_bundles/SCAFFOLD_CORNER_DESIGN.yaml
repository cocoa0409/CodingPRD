      - name: encounter_coverage_summary_read_agrees_with_the_stored_assignment_and_shift_ledger
        claim_type: Computed read
        grounds:
          - endpoints[GET /labor-encounters/{encounterId}/coverage-summary]
          - calculations.encounter_required_coverage_units
          - calculations.care_assignment_unit_debit
          - calculations.support_person_occupancy
          - calculations.unit_posture_derivation
          - entities.CareAssignment.fields.acuity_units_consumed
          - entities.ShiftAssignment.fields.assigned_acuity_load_units
        distinguishing_aspect: |
          coverage-summary is a pure projection: it must decompose three different calculations for the
          SAME instant and agree with the rows they wrote. Three independent things can drift here.
          (1) acuity_tier_reason must name the highest-firing clause of step 1, and for a 39-week
          singleton vertex primipara in LATENT the honest answer is BASELINE — an implementation that
          reports PHASE_FLOOR because a phase multiplier was applied confuses step 1 with step 3.
          (2) required_coverage_units and the assignment's acuity_units_consumed must both reflect the
          ANTEPARTUM -> LATENT re-price (0.5 -> 1.0 on each side); a summary computed from creation-time
          values reports 0.5 while the ledger holds 1.0. (3) support_person_allowance is NOT
          BASE_SUPPORT_BY_PHASE[LATENT] == 2 here: the unit has never validated a readiness drill, so
          cesarean_readiness_state is NOT_READY, posture is INDUCTION_FROZEN, and calc
          support_person_occupancy clamps the allowance to 1 — a posture-blind implementation answers 2.
        test_recipe:
          setup: |
            One unit, two LDR beds (LDR-01 occupied, LDR-02 available so the posture is not DIVERT), one
            BEDSIDE nurse with an ADVANCED cert on an ACTIVE 05:00-15:00 shift (capacity_units_effective
            4.0), and one encounter walked ANTEPARTUM -> LATENT under a single RATIO_SHARED assignment.
            No fetal assessment, no bundle, no support pass, no validated drill.
