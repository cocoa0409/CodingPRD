scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: oee_performance_two_bases_diverge_on_machine
        grounds:
          - calculations.oee_overall
          - entities.Machine.fields.oee_performance
          - entities.MachineRunLog.fields.run_time_secs
        distinguishing_aspect: |
          Entity domain = Machine OEE. The ideal-cycle-time performance basis
          (ideal_cycle_time_secs*total/run_time = 0.8333) differs from the
          run/planned nameplate basis (run/planned = 0.8333 here but the formula
          variant documents the divergence); performance is a machine metric,
          structurally distinct from the WorkOrder cost domain in instance 2.
        test_recipe:
          setup:
            - "One Machine planned_production_secs=28800."
            - "One DRAFT routing with one Operation (sequence_no=10, ideal_cycle_time_secs=100) on that machine; routing RELEASED."
            - "Two run logs on the machine: (run 12000s, total 100, good 95) and (run 12000s, total 100, good 90)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-OEE", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-OEE", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-OEE" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /machines/${m_id}/run-logs"
              payload: { window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-01T04:00:00.000Z", run_time_secs: 12000, total_units: 100, good_units: 95 }
              as: MachineOperator
            - call: "POST /machines/${m_id}/run-logs"
              payload: { window_start: "2026-06-01T04:00:00.000Z", window_end: "2026-06-01T08:00:00.000Z", run_time_secs: 12000, total_units: 100, good_units: 90 }
              as: MachineOperator
          trigger:
            - call: "POST /machines/${m_id}/recompute-oee"
              payload: {}
              as: ManufacturingEngineer
              captures: { perf: $.data.oee_performance }
          assert:
            - "Machine.${m_id}.oee_availability == 0.8333"
            - "Machine.${m_id}.oee_performance == 0.8333"
            - "Machine.${m_id}.oee_quality == 0.9250"
            - "Machine.${m_id}.oee_overall == 0.6424"

      - name: workorder_material_variance_actual_vs_standard
        grounds:
          - calculations.material_variance
          - calculations.bom_explosion_standard_cost
          - entities.WorkOrder.fields.material_variance_cents
        distinguishing_aspect: |
          Entity domain = WorkOrder cost accounting. Standard BOM-explosion cost
          (241 cents) diverges from actual lot-issue cost (340 cents) yielding
          material_variance_cents=99; this is order costing, a different entity
          domain than the Machine OEE performance metric in instance 1.
        test_recipe:
          setup:
            - "Products: FG (finished), SA (subassembly), R1 (raw, unit_cost 82, lot_controlled), R2 (raw, unit_cost 88, lot_controlled)."
            - "BOM: FG->SA qty_per 1 scrap 20; FG->R1 qty_per 1 scrap 20; SA->R2 qty_per 1 scrap 20."
            - "RELEASED routing for FG with one operation; WorkOrder order_qty=1 RELEASED (demands exploded)."
            - "Lots received: L1 of R1 received_qty 5, L2 of R2 received_qty 5; issued R1=2, R2=2 to the demands; both ops completed; WO COMPLETED."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-MV", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SA-MV", name: "SA", product_type: "SUBASSEMBLY", unit_cost_cents: 0 }
              as: ManufacturingEngineer
              captures: { sa_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "R1-MV", name: "R1", product_type: "RAW_MATERIAL", unit_cost_cents: 82, lot_controlled: true }
              as: ManufacturingEngineer
              captures: { r1_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "R2-MV", name: "R2", product_type: "RAW_MATERIAL", unit_cost_cents: 88, lot_controlled: true }
              as: ManufacturingEngineer
              captures: { r2_id: $.data.id }
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${fg_id}", component_product_id: "${sa_id}", quantity_per: 1, scrap_factor_pct: 20 }
              as: ManufacturingEngineer
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${fg_id}", component_product_id: "${r1_id}", quantity_per: 1, scrap_factor_pct: 20 }
              as: ManufacturingEngineer
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${sa_id}", component_product_id: "${r2_id}", quantity_per: 1, scrap_factor_pct: 20 }
              as: ManufacturingEngineer
            - call: "POST /machines"
              payload: { machine_code: "M-MV", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-MV" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
              captures: { op1_id: $.data.id }
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /component-demands"
              payload: { work_order_id: "${wo_id}", component_product_id: "${r1_id}" }
              as: ProductionPlanner
              captures: { cd_r1_id: "$.data[0].id" }
            - call: "GET /component-demands"
              payload: { work_order_id: "${wo_id}", component_product_id: "${r2_id}" }
              as: ProductionPlanner
              captures: { cd_r2_id: "$.data[0].id" }
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /lots"
              payload: { product_id: "${r1_id}", lot_code: "L1", received_qty: 5 }
              as: MachineOperator
              captures: { l1_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${r2_id}", lot_code: "L2", received_qty: 5 }
              as: MachineOperator
              captures: { l2_id: $.data.id }
            - call: "POST /lot-issues"
              payload: { component_demand_id: "${cd_r1_id}", lot_id: "${l1_id}", work_order_operation_id: "${woop1_id}", issued_qty: 2 }
              as: MachineOperator
            - call: "POST /lot-issues"
              payload: { component_demand_id: "${cd_r2_id}", lot_id: "${l2_id}", work_order_operation_id: "${woop1_id}", issued_qty: 2 }
              as: MachineOperator
            - call: "POST /work-order-operations/${woop1_id}/signoffs"
              payload: { result: "PASS" }
              as: QualityInspector
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 1 }
              as: MachineOperator
            - call: "POST /work-order-operations/${woop1_id}/complete"
              payload: { good_qty: 1 }
              as: MachineOperator
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ProductionPlanner
              captures: { mv: $.data.material_variance_cents }
          assert:
            - "WorkOrder.${wo_id}.material_variance_cents == 99"
            - "WorkOrder.${wo_id}.status == COMPLETED"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: oee_three_factor_nonlinear_product
        grounds:
          - calculations.oee_overall
          - entities.Machine.fields.oee_overall
          - entities.MachineRunLog.fields.good_units
        distinguishing_aspect: |
          Mode (a): three inputs (availability, performance, quality) combined by
          a non-linear multiplicative interaction with clamp01 branches; A=0.8333,
          P=0.8333, Q=0.9250 -> overall 0.6424 (round once from full precision),
          not the additive or pre-rounded 0.6423.
        test_recipe:
          setup:
            - "Machine planned 28800; primary op ideal 100; two logs (12000s/100/95) and (12000s/100/90)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C2A", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C2A", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C2A" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /machines/${m_id}/run-logs"
              payload: { window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-01T04:00:00.000Z", run_time_secs: 12000, total_units: 100, good_units: 95 }
              as: MachineOperator
            - call: "POST /machines/${m_id}/run-logs"
              payload: { window_start: "2026-06-01T04:00:00.000Z", window_end: "2026-06-01T08:00:00.000Z", run_time_secs: 12000, total_units: 100, good_units: 90 }
              as: MachineOperator
          trigger:
            - call: "POST /machines/${m_id}/recompute-oee"
              payload: {}
              as: QualityInspector
              captures: { oee: $.data.oee_overall }
          assert:
            - "Machine.${m_id}.oee_overall == 0.6424"

      - name: bom_standard_round_per_component_then_sum
        grounds:
          - calculations.bom_explosion_standard_cost
          - entities.ComponentDemand.fields.standard_cost_cents
          - entities.BomLine.fields.scrap_factor_pct
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned. R1 exact 102.5c rounds to 103,
          R2 exact 137.5c rounds to 138 -> round-per-component-then-sum = 241,
          which differs from sum-then-round (240). The scaffold pins per-component
          rounding first.
        test_recipe:
          setup:
            - "Products FG, SA, R1(82c), R2(88c); BOM FG->SA q1 s20, FG->R1 q1 s20, SA->R2 q1 s20; RELEASED routing; WO order_qty=1 RELEASED."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C2B", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SA-C2B", name: "SA", product_type: "SUBASSEMBLY", unit_cost_cents: 0 }
              as: ManufacturingEngineer
              captures: { sa_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "R1-C2B", name: "R1", product_type: "RAW_MATERIAL", unit_cost_cents: 82, lot_controlled: true }
              as: ManufacturingEngineer
              captures: { r1_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "R2-C2B", name: "R2", product_type: "RAW_MATERIAL", unit_cost_cents: 88, lot_controlled: true }
              as: ManufacturingEngineer
              captures: { r2_id: $.data.id }
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${fg_id}", component_product_id: "${sa_id}", quantity_per: 1, scrap_factor_pct: 20 }
              as: ManufacturingEngineer
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${fg_id}", component_product_id: "${r1_id}", quantity_per: 1, scrap_factor_pct: 20 }
              as: ManufacturingEngineer
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${sa_id}", component_product_id: "${r2_id}", quantity_per: 1, scrap_factor_pct: 20 }
              as: ManufacturingEngineer
            - call: "POST /machines"
              payload: { machine_code: "M-C2B", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C2B" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/cost-summary"
              payload: {}
              as: ProductionPlanner
              captures: { std: $.data.bom_standard_total_cents }
          assert:
            - "cost_summary.bom_standard_total_cents == 241"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: workorderoperation_pause_resume_cycle
        grounds:
          - state_machines.WorkOrderOperation.IN_PROGRESS_to_PAUSED
          - state_machines.WorkOrderOperation.PAUSED_to_IN_PROGRESS
          - entities.WorkOrderOperation.fields.status
        distinguishing_aspect: |
          Cyclic shape on WorkOrderOperation: IN_PROGRESS->PAUSED->IN_PROGRESS
          returns to a prior state (a true loop), distinct from the branching
          fork-join on ScrapDisposition in instance 2.
        test_recipe:
          setup:
            - "Released WO with one op; op started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C3A", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C3A", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C3A" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 1 }
              as: MachineOperator
            - call: "POST /work-order-operations/${woop1_id}/pause"
              payload: {}
              as: MachineOperator
          trigger:
            - call: "POST /work-order-operations/${woop1_id}/resume"
              payload: {}
              as: MachineOperator
              captures: { st: $.data.status }
          assert:
            - "WorkOrderOperation.${woop1_id}.status == IN_PROGRESS"
            - "Machine.${m_id}.status == RUNNING"

      - name: scrapdisposition_fork_join_scrap_vs_rework
        grounds:
          - state_machines.ScrapDisposition.PENDING_to_SCRAPPED
          - state_machines.ScrapDisposition.PENDING_to_REWORKED
          - entities.ScrapDisposition.fields.status
        distinguishing_aspect: |
          Branching fork-join on ScrapDisposition: PENDING forks to SCRAPPED
          (scrap cost + WIP debit) versus REWORKED (op reopened, no scrap cost) —
          divergent side-effect sets per branch, on a different entity than the
          cyclic WorkOrderOperation in instance 1.
        test_recipe:
          setup:
            - "Released WO order_qty=10, one op started, good_qty produced; a PENDING ScrapDisposition of quantity 3 raised at that op."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C3B", name: "FG", product_type: "FINISHED_GOOD", unit_cost_cents: 500 }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C3B", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C3B" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 10 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 10 }
              as: MachineOperator
            - call: "POST /work-order-operations/${woop1_id}/scrap-dispositions"
              payload: { quantity: 3, defect_code: "CRACK" }
              as: MachineOperator
              captures: { sd_id: $.data.id }
          trigger:
            - call: "POST /scrap-dispositions/${sd_id}/disposition"
              payload: { decision: "SCRAP" }
              as: QualityInspector
              captures: { sd_status: $.data.status }
          assert:
            - "ScrapDisposition.${sd_id}.status == SCRAPPED"
            - "ScrapDisposition.${sd_id}.scrap_cost_cents == 1500"
            - "WorkOrder.${wo_id}.scrapped_qty == 3"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: workorder_release_explode_demand_cost_operations_chain
        grounds:
          - state_machines.WorkOrder.PLANNED_to_RELEASED
          - entities.ComponentDemand.fields.required_qty
          - entities.WorkOrderOperation.fields.sequence_no
        distinguishing_aspect: |
          Depth-3 cascade from WorkOrder release: (1) release explodes BOM ->
          ComponentDemand rows; (2) each demand's required_qty drives
          standard_cost_cents; (3) one WorkOrderOperation minted per Operation in
          sequence order. Each hop is caused by the prior hop, not by release
          directly fanning out independent targets.
        test_recipe:
          setup:
            - "FG with BOM FG->R1 q2 s0; routing FG with two ops (seq 10, 20) RELEASED; WO order_qty 4 PLANNED."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C4A", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "R1-C4A", name: "R1", product_type: "RAW_MATERIAL", unit_cost_cents: 100, lot_controlled: true }
              as: ManufacturingEngineer
              captures: { r1_id: $.data.id }
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${fg_id}", component_product_id: "${r1_id}", quantity_per: 2, scrap_factor_pct: 0 }
              as: ManufacturingEngineer
            - call: "POST /machines"
              payload: { machine_code: "M-C4A", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-C4A" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 50 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 20, ideal_cycle_time_secs: 30 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 4 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/component-demands"
              payload: {}
              as: ProductionPlanner
              captures: { cd0_req: "$.data[0].required_qty", cd0_cost: "$.data[0].standard_cost_cents" }
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop0_seq: "$.data[0].sequence_no" }
          assert:
            - "component_demands has exactly 1 row for ${wo_id}"
            - "component_demands[0].required_qty == 8"
            - "component_demands[0].standard_cost_cents == 800"
            - "work_order_operations for ${wo_id} count == 2 ordered by sequence_no [10,20]"

      - name: rework_disposition_reopen_op_revert_completion_void_signoff_chain
        grounds:
          - state_machines.ScrapDisposition.PENDING_to_REWORKED
          - state_machines.WorkOrderOperation.REWORK_to_IN_PROGRESS
          - entities.WorkOrder.fields.completed_qty
        distinguishing_aspect: |
          Depth-4 cascade from a REWORK disposition (different trigger than
          release): (1) disposition->REWORKED; (2) sets the final op status=REWORK;
          (3) decrements WorkOrder.completed_qty; (4) voids the PASS signoff so the
          op must be re-signed. Each hop is caused by the prior, distinct from the
          release-explosion cascade.
        test_recipe:
          setup:
            - "Single-op WO order_qty 5; op signed PASS, started, completed (final op -> completed_qty 5); a PENDING scrap of quantity 2 raised at the op."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-C4B", name: "FG", product_type: "FINISHED_GOOD", unit_cost_cents: 700 }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-C4B", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
