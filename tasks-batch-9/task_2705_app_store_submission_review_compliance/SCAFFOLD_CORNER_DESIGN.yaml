      - name: board_review_then_overturn_restores_the_failed_mapping_and_approves_the_build
        claim_type: Compensation
        grounds:
          - state_machines.AppealRequest.transitions.BOARD_REVIEW_to_OVERTURNED.side_effects
          - state_machines.Submission.transitions.APPEAL_PENDING_to_APPROVED
          - calculations.standing_score
        distinguishing_aspect: "A full overturn reverses the rejection cascade rather than re-running it: the reason takes appeal_disposition OVERTURNED, the mapping climbs FAILED -> IN_PROGRESS (index 25.00, so posture stays RESTRICTED), overturn_ratio is 1.00 and standing returns to 100.00 because the 12-point penalty leaves scope and the 3-point appeal credit is clamped away."
        test_recipe:
          setup:
            - "Build 100 is APPEAL_PENDING with one SUBMITTED appeal citing the single CONTESTED CRITICAL reason; standing is 88.00 and the index is 0.00."
          setup_api_calls: *CH_APPEAL
          trigger:
            - call: "POST /appeal-requests/${appeal_id}/board-review"
              payload: {}
              as: PlatformAppealBoard
              as_user_id: "board-07"
            - call: "POST /appeal-requests/${appeal_id}/decide"
              payload: { outcome: "OVERTURNED", rationale: "The observed identifier is covered by the existing DEVICE_ID disclosure." }
              as: PlatformAppealBoard
              as_user_id: "board-07"
          assert:
            - "the first call returns 200 with data.state == BOARD_REVIEW and data.board_started_at == 2026-08-01T00:00:00Z"
            - "the second call returns 200 with data.state == OVERTURNED and data.overturn_ratio == 1.00"
            - "data.overturned_rejection_reason_ids == [\"${rr_id}\"]"
            - "Submission.${sub_id}.state == APPROVED"
            - "RejectionReason.${rr_id}.appeal_disposition == OVERTURNED"
            - "FeatureMapping.${map_id}.self_review_status == IN_PROGRESS"
            - "AppRecord.${app_id}.feature_compliance_index == 25.00"
            - "AppRecord.${app_id}.compliance_posture == RESTRICTED"
            - "GET /publisher-accounts/${acct_id}/standing returns standing_score_rolling_365 == 100.00, penalty_event_count == 0 and credit_total == 3"

      - name: deciding_an_appeal_as_the_original_reviewer_returns_segregation_of_duties_violation
        claim_type: Segregation of duties
        grounds:
          - state_machines.AppealRequest.transitions.BOARD_REVIEW_to_UPHELD.preconditions
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
        distinguishing_aspect: "The board member holding the correct PlatformAppealBoard role is still refused with 409 ERR_SEGREGATION_OF_DUTIES_VIOLATION when X-User-ID equals Submission.reviewed_by_user_id (rev-01), proving the check is identity-based and not role-based."
        test_recipe:
          setup:
            - "Build 100 was rejected by reviewer rev-01 and its appeal is in BOARD_REVIEW."
          setup_api_calls: *CH_APPEAL
          trigger:
            - call: "POST /appeal-requests/${appeal_id}/board-review"
              payload: {}
              as: PlatformAppealBoard
              as_user_id: "board-07"
            - call: "POST /appeal-requests/${appeal_id}/decide"
              payload: { outcome: "UPHELD", rationale: "Attempted by the reviewer who issued the rejection." }
              as: PlatformAppealBoard
              as_user_id: "rev-01"
          assert:
            - "the second call returns 409 with error.error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "AppealRequest.${appeal_id}.state == BOARD_REVIEW"
            - "Submission.${sub_id}.state == APPEAL_PENDING"
            - "RejectionReason.${rr_id}.appeal_disposition is null"

      - name: upholding_the_appeal_drives_the_build_to_rejected_final_and_keeps_the_penalty
        claim_type: Valid Transition
        grounds:
          - state_machines.AppealRequest.transitions.BOARD_REVIEW_to_UPHELD.side_effects
          - state_machines.Submission.transitions.APPEAL_PENDING_to_REJECTED_FINAL
        distinguishing_aspect: "UPHELD is the only appeal branch that produces overturn_ratio 0.00 with an empty overturned_rejection_reason_ids, strands the build in terminal REJECTED_FINAL and leaves standing at 88.00 with the strike still counted."
        test_recipe:
          setup:
            - "Build 100's appeal is in BOARD_REVIEW; standing is 88.00 with rejection_strike_count 1."
          setup_api_calls: *CH_APPEAL
          trigger:
            - call: "POST /appeal-requests/${appeal_id}/board-review"
              payload: {}
              as: PlatformAppealBoard
              as_user_id: "board-07"
            - call: "POST /appeal-requests/${appeal_id}/decide"
              payload: { outcome: "UPHELD", rationale: "The disclosure genuinely omits the observed purpose." }
              as: PlatformAppealBoard
              as_user_id: "board-07"
          assert:
            - "the second call returns 200 with data.state == UPHELD and data.overturn_ratio == 0.00"
            - "data.overturned_rejection_reason_ids == []"
            - "Submission.${sub_id}.state == REJECTED_FINAL"
            - "RejectionReason.${rr_id}.appeal_disposition == UPHELD"
            - "GET /publisher-accounts/${acct_id}/standing returns standing_score_rolling_365 == 88.00 and rejection_strike_count == 1"

      - name: partially_overturning_with_the_whole_cited_set_returns_validation
            
        claim_type: Type Constraints
        grounds:
          - state_machines.AppealRequest.transitions.BOARD_REVIEW_to_PARTIALLY_OVERTURNED.preconditions
          - errors.ERR_VALIDATION
        distinguishing_aspect: "PARTIALLY_OVERTURNED demands a non-empty STRICT subset: naming the one and only cited reason is not a strict subset, so the call is 422 ERR_VALIDATION rather than being silently promoted to a full overturn."
        test_recipe:
          setup:
            - "Build 100's appeal is in BOARD_REVIEW citing exactly one rejection reason."
          setup_api_calls: *CH_APPEAL
          trigger:
            - call: "POST /appeal-requests/${appeal_id}/board-review"
              payload: {}
              as: PlatformAppealBoard
              as_user_id: "board-07"
            - call: "POST /appeal-requests/${appeal_id}/decide"
              payload: { outcome: "PARTIALLY_OVERTURNED", rationale: "Attempting to overturn the entire cited set.", overturned_rejection_reason_ids: ["${rr_id}"] }
              as: PlatformAppealBoard
              as_user_id: "board-07"
          assert:
            - "the second call returns 422 with error.error_id == ERR_VALIDATION"
            - "AppealRequest.${appeal_id}.state == BOARD_REVIEW"
            - "AppealRequest.${appeal_id}.overturn_ratio is null"
            - "Submission.${sub_id}.state == APPEAL_PENDING"

      - name: withdrawing_an_appeal_returns_the_build_to_rejected_without_refreshing_rejected_at
        claim_type: Compensation
        grounds:
          - state_machines.AppealRequest.transitions.SUBMITTED_to_WITHDRAWN.side_effects
          - entities.Submission.fields.rejected_at
        distinguishing_aspect: "Withdrawal deliberately does not reopen the clock: the build returns to REJECTED with rejected_at still 2026-08-01T00:00:00Z, so a re-file at 2026-08-15T00:00:01Z is still out of window."
        test_recipe:
