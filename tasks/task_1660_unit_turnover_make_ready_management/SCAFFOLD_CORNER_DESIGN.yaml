              payload: { name: "Nope Villas", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (http 403)"

  # ---------------------------------------------- cross-cutting complexity
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[scope-item-approval-stale-turn]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC per §1.2.1: after a successful approve bumps Turn.version, a second approve replaying the previously observed version is rejected 412 ERR_STALE_VERSION — two strictly sequential requests, no wall-clock dependence."
        test_recipe:
          setup:
            - "Turn SCOPED, approved_budget 100000; item A (15000 → 1500bp, PM tier) and item B (12000 → 1200bp while A still pending, PM tier) both PENDING_APPROVAL"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 100000 }
              as: TurnCoordinator
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "PAINT", description: "A", estimated_cost_cents: 15000 }
              as: TurnCoordinator
              captures: { ia: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "CLEAN", description: "B", estimated_cost_cents: 12000 }
              as: TurnCoordinator
              captures: { ib: $.data.id }
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: PropertyManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /make-ready/scope-items/${ia}/approve"
              payload: { expected_turn_version: "${tv}" }
              as: PropertyManager
            - call: "POST /make-ready/scope-items/${ib}/approve"
              payload: { expected_turn_version: "${tv}" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "first approve succeeds: ScopeItem.${ia}.status == PLANNED and Turn.version advanced to ${tv} + 1"
            - "second approve with the stale version fails: error_id == ERR_STALE_VERSION (http 412)"
            - "ScopeItem.${ib}.status remains PENDING_APPROVAL; Turn.${t}.approved_budget_cents == 115000"

      - name: approved_budget_reconciles_on_approval
        claim_type: derived_field_reconciliation
        grounds: [entities.Turn.fields.approved_budget_cents, state_machines.ScopeItem.PENDING_APPROVAL_to_PLANNED]
        distinguishing_aspect: "Derived-field reconciliation under the immediate consistency model: approving a pending item raises approved_budget_cents by exactly the item estimate and the new value is visible on the very next GET (115000)."
        test_recipe:
          setup: ["Turn SCOPED, approved_budget 100000; item A (15000, PM tier) PENDING_APPROVAL"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 100000 }
              as: TurnCoordinator
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "PAINT", description: "A", estimated_cost_cents: 15000 }
              as: TurnCoordinator
              captures: { ia: $.data.id }
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: PropertyManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /make-ready/scope-items/${ia}/approve"
              payload: { expected_turn_version: "${tv}" }
              as: PropertyManager
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: PropertyManager
          assert:
            - "Turn.${t}.approved_budget_cents == 115000 (100000 + 15000)"
            - "Turn.${t}.estimated_cost_cents == 115000 (item now PLANNED and counted)"
            - "Turn.${t}.version == ${tv} + 1"

      - name: cascade_chains_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Turn.IN_PROGRESS_to_REWORK]
        excluded_because:
          difficulty_instance: inspection_fail_rework_commitment_cascade
          rationale: "Depth-4 cascade asserted end-to-end there; depth-2 completion cascade in assignment_complete_item_turn_rollup_cascade."

      - name: threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.scope_creep_tier]
        excluded_because:
          difficulty_instance: scope_creep_variance_exact_threshold_boundary
          rationale: "pm-threshold boundary asserted there; rm-threshold boundary asserted in rm_tier_boundary_and_authority_enforcement (this file)."

  # ----------------------------------------------------- consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_covered
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: estimated_cost_add_void_conservation
          rationale: "Every mutation there is verified by an immediately following GET (12000 after add, 7000 after void); approved_budget_reconciles_on_approval (this file) does the same for approval writes."
