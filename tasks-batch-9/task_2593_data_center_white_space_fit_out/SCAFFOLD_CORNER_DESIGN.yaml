      - name: change_control_scheduling_and_release_acceptance_are_disjoint_surfaces
        claim_type: shared_operations
        grounds:
          - "roles[ChangeManager].exclusive_operations = [POST /mops/{mop_id}/schedule]; shared_operations include POST /mops/{mop_id}/approvals"
          - "roles[OperationsManager].exclusive_operations = [POST /release-packets/{packet_id}/accept, POST /release-packets/{packet_id}/reject]; shared_operations include POST /mops/{mop_id}/approvals"
          - "§1.7 note: ChangeManager and OperationsManager are peer approvers with disjoint exclusive surfaces (scheduling vs release acceptance)"
        distinguishing_aspect: "The two change-control roles SHARE the approvals endpoint but nothing else: scheduling is ChangeManager-only (an OperationsManager approval does not carry scheduling rights) and release acceptance/rejection is OperationsManager-only. A single-approval MEDIUM MOP therefore reaches APPROVED from either peer, yet only one of them can put it in the calendar, and the CommissioningAgent who drives commissioning may not vote at all."
        test_recipe:
          setup: "Hall CX84 in PLANNING with PDU-A1 carrying BW-A1 and BW-A2. Two MEDIUM-risk MOPs are submitted: mop_1 on BW-A1 authored by u-elec-1 and mop_2 on BW-A2 authored by u-mech-1."
          setup_api_calls:
            - name: set_clock
              call: "POST /_clock/set_current_utc"
              as: FacilityPlanner
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - name: create_hall
