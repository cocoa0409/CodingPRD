      - name: project_structural_fork_join
        grounds:
          - state_machines.Project.PERMIT_APPROVED_to_STRUCTURAL_IN_PROGRESS
          - "state_machines.Project.status.PERMIT_IN_PROGRESS_to_PERMIT_APPROVED"
          - state_machines.Project.STRUCTURAL_IN_PROGRESS_to_READY_FOR_INSTALL
