              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { other_id: $.data.id }
            - call: "POST /rmn/advertisers/${other_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/advertisers/${other_id}/kyc-decision"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
          trigger:
