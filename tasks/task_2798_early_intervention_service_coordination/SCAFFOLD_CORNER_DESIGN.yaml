          assert:
            - "Trigger 1: HTTP 200 with visit_status \"CANCELLED_PROVIDER\", billing_status \"CANCELLED_NO_CHARGE\" and actual_units == 0; the line is still IN_DELIVERY with makeup_owed_units == 3 (3 is not > 4)"
            - "Trigger 2: makeup_owed_units == 6 and the line status becomes \"AT_RISK\"; Referral.${ref_id}.service_gap_flag == true"
            - "Trigger 3: response.data.status == \"AT_RISK\", makeup_owed_units == 6, units_delivered == 2"
            - "Trigger 4: HTTP 201 with response.data.makeup_for_visit_id == \"${v2_id}\" and scheduled_units == 3 (inside the 30-day window ending 2026-04-24)"
            - "Trigger 6: HTTP 200 with response.data.visit_status == \"DELIVERED\" and actual_units == 3"
            - "Trigger 7: response.data.status == \"IN_DELIVERY\", makeup_owed_units == 3 and units_delivered == 5; Referral.${ref_id}.service_gap_flag == false"
            - "ProviderAuthorization.${auth_id}.units_consumed == 5 and units_remaining == 19 — cancelled visits consume nothing"

  # ===========================================================================
  # SECTION 4 — validations (§1.4)
  # ===========================================================================
  - section: validations
    instances:

      - name: child_age_eligibility_is_strict_at_the_third_birthday
        claim_type: violation_to_error
        grounds:
          - validations[priority 29 -> ERR_CHILD_AGE_INELIGIBLE]
          - entities.Child.fields.third_birthday_date
          - endpoints[POST /ei/referrals]
        distinguishing_aspect: |
          The comparison is strict: a referral received exactly on the child's third birthday is
          ineligible (third_birthday_date must be strictly after referral_received_date), while a
          child whose third birthday is one day later is accepted. An implementation using >= would
          admit the first case.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-03-02T09:00:00Z."
            - "Child TURNS_TODAY with date_of_birth 2023-03-02 (third birthday 2026-03-02) and child TURNS_TOMORROW with date_of_birth 2023-03-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/children"
              payload: { first_name: "Theo", last_name: "Amari", date_of_birth: "2023-03-02", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { today_child: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Rina", last_name: "Amari", date_of_birth: "2023-03-03", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { tomorrow_child: $.data.id }
          trigger:
            - call: "POST /ei/referrals"
              payload: { child_id: "${today_child}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Late referral received on the child's third birthday." }
              as: IntakeSpecialist
            - call: "POST /ei/referrals"
              payload: { child_id: "${tomorrow_child}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Referral received one day before the third birthday." }
              as: IntakeSpecialist
          assert:
            - "Trigger 1: HTTP 422 with response.data.error_id == \"ERR_CHILD_AGE_INELIGIBLE\" and no Referral row created for ${today_child}"
            - "Child.${today_child}.third_birthday_date == \"2026-03-02\" and active_referral_count == 0"
            - "Trigger 2: HTTP 201 with response.data.status == \"INTAKE\" and statutory_deadline_date == \"2026-04-16\""
            - "Child.${tomorrow_child}.third_birthday_date == \"2026-03-03\" and active_referral_count == 1"

      - name: duplicate_open_referral_is_rejected_per_child_not_per_county
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 30 -> ERR_DUPLICATE_REFERRAL]
          - entities.Child.fields.active_referral_count
          - endpoints[POST /ei/referrals]
        distinguishing_aspect: |
          The uniqueness scope is the child, not the county or the referral source: a second open
          referral for the same child is refused with 409 while an identical referral for a sibling in
          the same county from the same source succeeds, proving the check is not a global or
          per-county constraint.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-03-02T09:00:00Z; two siblings registered in CNT_A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child1_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ivor", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child2_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child1_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref1_id: $.data.id }
          trigger:
            - call: "POST /ei/referrals"
              payload: { child_id: "${child1_id}", primary_referral_source: "PARENT", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Parent calls the intake line about the same concern." }
              as: IntakeSpecialist
            - call: "POST /ei/referrals"
              payload: { child_id: "${child2_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Twin sibling with the same presenting concern." }
              as: IntakeSpecialist
          assert:
            - "Trigger 1: HTTP 409 with response.data.error_id == \"ERR_DUPLICATE_REFERRAL\""
            - "Trigger 2: HTTP 201 with response.data.status == \"INTAKE\""
            - "Child.${child1_id}.active_referral_count == 1 (unchanged by the refusal) and Child.${child2_id}.active_referral_count == 1"
            - "GET /ei/referrals?child_id=${child1_id} returns total_count == 1 with the single row ${ref1_id}"

      - name: five_domain_rule_applies_only_to_initial_evaluations
        claim_type: conditional_validation
        grounds:
          - validations[priority 34 -> ERR_EVALUATION_DOMAINS_INCOMPLETE]
          - entities.Assessment.fields.domains_assessed
          - endpoints[POST /ei/assessments]
        distinguishing_aspect: |
          The completeness rule is conditioned on assessment_type: an INITIAL_EVALUATION listing four
          of the five domains is refused, a FAMILY_ASSESSMENT with domains_assessed omitted entirely
          is accepted, and the same INITIAL_EVALUATION with all five domains is accepted. A rule
          applied unconditionally would reject the family assessment as well.
        test_recipe:
          setup:
            - "One EVALUATION_PENDING referral with a coordinator assigned, clock 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL"] }
              as: Evaluator
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-12", setting_code: "HOME" }
              as: Evaluator
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
          assert:
            - "Trigger 1: HTTP 422 with response.data.error_id == \"ERR_EVALUATION_DOMAINS_INCOMPLETE\""
            - "Trigger 2: HTTP 201 with response.data.status == \"SCHEDULED\" and domains_assessed == null"
            - "Trigger 3: HTTP 201 with response.data.domains_assessed containing all five domains"
            - "GET /ei/assessments?referral_id=${ref_id} returns total_count == 2 — the refused call created nothing"

      - name: event_dates_must_not_lead_the_clock_and_pairs_must_stay_ordered
        claim_type: priority_ordering
        grounds:
          - validations[priority 50 -> ERR_DATE_IN_FUTURE]
          - validations[priority 51 -> ERR_INVALID_DATE_RANGE]
          - endpoints[POST /ei/referrals]
          - endpoints[POST /ei/assessments/{assessmentId}/complete]
        distinguishing_aspect: |
          Two temporal families are separated: a referral_received_date one day past the logical clock
          is ERR_DATE_IN_FUTURE (priority 50), while a completion_date that is in the past but before
          its referral's received date is ERR_INVALID_DATE_RANGE (priority 51). A completion date that
          is both in the future and out of order returns the lower-numbered 50, not 51.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-03-20T09:00:00Z with a referral received 2026-03-02 and one SCHEDULED INITIAL_EVALUATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Wren", last_name: "Okafor", date_of_birth: "2024-05-05", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child2_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ei/referrals"
              payload: { child_id: "${child2_id}", primary_referral_source: "HOSPITAL", referral_received_date: "2026-03-21", county_code: "CNT_A", presenting_concern: "NICU follow-up referral dated tomorrow." }
