            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: PlantManager, captures: { c2: $.data.current_utc } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlantManager, captures: { err_reg: $.data.error_id } }
          assert:
            - "err_past == ERR_DELIVERY_DATE_IN_PAST (default clock date is no earlier than 2026-08-01)"
            - "ok_today == PLACED (default clock date is no later than 2026-08-01 — together pinning 2026-08-01T00:00:00Z)"
            - "c1 == 2026-08-05T00:00:00Z and c2 == 2026-08-05T00:00:00Z (equality set allowed, clock never falls back to wall time)"
