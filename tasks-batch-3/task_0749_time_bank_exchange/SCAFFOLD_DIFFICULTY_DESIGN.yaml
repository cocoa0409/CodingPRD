            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T13:30:00Z" }
              as: PlatformAdmin
            - call: "POST /assignments/${a3}/check-in"
              payload: {}
              as: Member
              as_user_id: "${v3}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T14:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T17:30:00Z" }
              as: PlatformAdmin
            - call: "GET /group-projects/${gp}"
              payload: {}
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { proj_state: $.data.aggregate_state }
          assert:
            - "3 shifts COMPLETED / 5 total = 0.60 exactly"
            - "0.60 >= project.minimum_completed_ratio(0.60) => transition to COMPLETED (not CANCELLED)"
            - "GroupProject.${gp}.aggregate_state == COMPLETED"

  # =====================================================================
  # RULE 7 — cross_entity_state_dependency (>= 2, different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: exchange_settle_blocked_by_open_dispute
        grounds:
          - state_machines.Exchange.DELIVERED_to_SETTLED
          - state_machines.Dispute.OPEN_to_RESOLVED_UPHELD
        distinguishing_aspect: |
          Exchange DELIVERED->SETTLED requires no OPEN Dispute row references
          this exchange — Exchange's valid transition depends on the STATE of
          a linked Dispute (a different entity). Different entity pair from
          Rule 7 instance #2 (Exchange<-SkillOffer trust_tier).
        test_recipe:
          setup:
            - "Exchange e1 status=DISPUTED; Dispute d1 status=OPEN references e1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "ced-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "ced-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "GARDENING", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "GARDENING", needed_minutes: 60, earliest_start_utc: "2026-03-02T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-02T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /exchanges/${e1}/mark-delivered"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /disputes"
              payload: { exchange_id: "${e1}", raised_by_member_id: "${m1}", reason_code: "INCOMPLETE_SERVICE", claimed_delta_minutes: 15 }
              as: Member
              as_user_id: "${m1}"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /exchanges/${e1}/settle"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Exchange.${e1}.status remains DISPUTED (settle rejected because Dispute.${d1}.status == OPEN)"

      - name: exchange_create_blocked_by_offer_required_trust_tier
        grounds:
          - state_machines.Exchange.SCHEDULED
          - validations[priority=12]
          - entities.SkillOffer.fields.required_trust_tier
          - calculations.trust_tier
        distinguishing_aspect: |
          Exchange creation (SCHEDULED initial) requires requester.trust_tier
          >= offer.required_trust_tier — Exchange's ability to be created
          depends on the STATE of a different entity (SkillOffer's
          required_trust_tier attribute AND Member's derived trust_tier).
          Different entity pair (Exchange<-SkillOffer + Exchange<-Member's
          trust_tier) from Rule 7 instance #1 (Exchange<-Dispute).
        test_recipe:
          setup:
            - "Requester M1 has trust_tier=UNVERIFIED and 240-min seed balance."
            - "Offer o1 (provider M2) has required_trust_tier=TRUSTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "tt-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "tt-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "TUTORING_MATH", title: "M", minutes_per_session: 60, required_trust_tier: "TRUSTED" }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "TUTORING_MATH", needed_minutes: 60, earliest_start_utc: "2026-03-02T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-02T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_TRUST_TIER_TOO_LOW"
            - "SkillRequest.${r1}.status remains OPEN (no exchange created)"

  # =====================================================================
  # RULE 8 — resource_temporal_overlap (>= 2, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_assignment_overlap_touching_endpoints_ok
        grounds:
          - validations[priority=9]
          - errors[ERR_SHIFT_TIME_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics: two ShiftAssignments for the same
          member whose intervals touch exactly at the boundary (a1 ends
          09:30:00Z, a2 starts 09:30:00Z) are ALLOWED — no ERR_SHIFT_TIME_CONFLICT.
          A truly overlapping second assignment (a3 starts at 09:15:00Z while
          a1 [09:00-09:30) still runs) IS rejected. Different resource
          (ShiftAssignment) and different interval geometry (no buffer,
          adjacency allowed) from Rule 8 instance #2 (Exchange with 30-min
          buffer both sides).
        test_recipe:
          setup:
            - "Volunteer V exists. Organizer O has one project gp1 published, with two shifts sh1 [09:00-09:30) and sh2 [09:30-10:00) — touching at 09:30:00Z."
            - "V has one CONFIRMED assignment a1 on sh1 already."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "ov1-o@x.com", display_name: "O", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { o: $.data.id }
            - call: "POST /members"
              payload: { email: "ov1-v@x.com", display_name: "V", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { v: $.data.id }
            - call: "POST /group-projects"
              payload: { organizer_member_id: "${o}", title: "OV1", window_start_utc: "2026-03-05T09:00:00Z", window_end_utc: "2026-03-05T17:00:00Z" }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { gp: $.data.id }
            - call: "POST /group-projects/${gp}/shifts"
              payload: { role_label: "P", shift_start_utc: "2026-03-05T09:00:00Z", duration_minutes: 30, capacity: 2 }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { sh1: $.data.id }
            - call: "POST /group-projects/${gp}/shifts"
              payload: { role_label: "P", shift_start_utc: "2026-03-05T09:30:00Z", duration_minutes: 30, capacity: 2 }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { sh2: $.data.id }
            - call: "POST /group-projects/${gp}/publish"
              payload: {}
              as: ProjectOrganizer
              as_user_id: "${o}"
            - call: "POST /shifts/${sh1}/assignments"
              payload: { member_id: "${v}" }
              as: Member
              as_user_id: "${v}"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /shifts/${sh2}/assignments"
              payload: { member_id: "${v}" }
              as: Member
              as_user_id: "${v}"
              captures: { a2: $.data.id, a2_status: $.data.status }
          assert:
            - "HTTP status == 201"
            - "ShiftAssignment.${a2}.status == CONFIRMED"
            - "Touching endpoints allowed — no ERR_SHIFT_TIME_CONFLICT."

      - name: exchange_overlap_with_30min_buffer_rejects
        grounds:
          - validations[priority=10]
          - errors[ERR_EXCHANGE_TIME_CONFLICT]
        distinguishing_aspect: |
          Buffered interval semantics: an Exchange's interval is [start,
          start+committed_minutes) PLUS a 30-minute travel buffer on both
          sides. Two exchanges scheduled 25 minutes apart (e1 ends 10:00,
          e2 starts 10:25) are REJECTED because buffered intervals overlap
          — different interval geometry (buffer, no adjacency allowed
          within 30 min) from Rule 8 instance #1 (ShiftAssignment, no
          buffer). Different resource (Exchange vs ShiftAssignment).
        test_recipe:
          setup:
            - "Member M1 (requester) has 240-min balance. Provider M2 has one offer o1 (minutes_per_session=60)."
            - "M1 already has one SCHEDULED exchange e1 with [scheduled_start=2026-03-05T09:00:00Z, +60 min => ends 10:00) provider M2, requester M1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "ov2-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "ov2-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "GARDENING", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "GARDENING", needed_minutes: 60, earliest_start_utc: "2026-03-05T09:00:00Z", latest_start_utc: "2026-03-05T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-05T09:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "GARDENING", needed_minutes: 60, earliest_start_utc: "2026-03-05T10:00:00Z", latest_start_utc: "2026-03-05T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r2}", scheduled_start_utc: "2026-03-05T10:25:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_EXCHANGE_TIME_CONFLICT"
            - "Buffered interval [09:00-10:00) + 30-min post-buffer extends to 10:30; e2 attempted start 10:25 < 10:30 -> conflict."

  # =====================================================================
  # RULE 9 — compensating_invariant (>= 2, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: exchange_cancel_conserves_ledger_sum
        grounds:
          - state_machines.Exchange.SCHEDULED_to_CANCELLED
          - calculations.chronological_balance
          - entities.Member.fields.chronological_balance_minutes
        distinguishing_aspect: |
          Conserved quantity: sum over all members of chronological_balance_minutes.
          Creating a SCHEDULED Exchange posts no ledger entries (only reserves
          forward_looking). Cancelling that Exchange before start posts NO
          compensating ledger entries either. Invariant:
          sum(Member.chronological_balance_minutes over all members) is
          IDENTICAL before create and after cancel — zero drift.
        test_recipe:
          setup:
            - "Two members M1 (seed 240), M2 (seed 240). Total system chronological_balance_minutes = 480 BEFORE the create-then-cancel round-trip."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "ci1-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "ci1-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m2}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "GARDENING", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "GARDENING", needed_minutes: 60, earliest_start_utc: "2026-03-05T10:00:00Z", latest_start_utc: "2026-03-05T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-05T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /exchanges/${e1}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { e_final: $.data.status }
            - call: "GET /members/${m1}"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { m1_chrono: $.data.chronological_balance_minutes, m1_fwd: $.data.forward_looking_balance_minutes }
            - call: "GET /members/${m2}"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { m2_chrono: $.data.chronological_balance_minutes, m2_fwd: $.data.forward_looking_balance_minutes }
          assert:
            - "Exchange.${e1}.status == CANCELLED"
            - "Member.${m1}.chronological_balance_minutes == 240 (unchanged from seed)"
            - "Member.${m2}.chronological_balance_minutes == 240 (unchanged from seed)"
            - "sum(Member.chronological_balance_minutes) == 480 (identical to pre-create total; zero drift)"
            - "Member.${m1}.forward_looking_balance_minutes == 240 (pending debit released)"

      - name: assignment_cancel_conserves_no_show_strikes
        grounds:
          - state_machines.ShiftAssignment.CONFIRMED_to_CANCELLED
          - calculations.no_show_strikes
        distinguishing_aspect: |
          Different conserved quantity: sum over all members of no_show_strikes.
          Creating a ShiftAssignment (CONFIRMED) does NOT add a strike; cancelling
          it before shift start does NOT add a strike either (in contrast, letting
          it expire without check-in would). Invariant:
          sum(Member.no_show_strikes) unchanged across the CREATE + CANCEL round-trip.
        test_recipe:
          setup:
            - "Two volunteers V1 (0 prior strikes) V2 (2 prior strikes from earlier NO_SHOWs)."
            - "V2 has one CONFIRMED assignment a1 on shift sh1 (starts 2026-03-05, 09:00Z)."
            - "Clock at 2026-03-04T09:00:00Z — a1 is future (safe to cancel)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "ci2-o@x.com", display_name: "O", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { o: $.data.id }
            - call: "POST /members"
              payload: { email: "ci2-v1@x.com", display_name: "V1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { v1: $.data.id }
            - call: "POST /members"
              payload: { email: "ci2-v2@x.com", display_name: "V2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { v2: $.data.id }
            - call: "POST /group-projects"
              payload: { organizer_member_id: "${o}", title: "CI2", window_start_utc: "2026-03-02T09:00:00Z", window_end_utc: "2026-03-06T17:00:00Z" }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { gp: $.data.id }
            - call: "POST /group-projects/${gp}/shifts"
              payload: { role_label: "P", shift_start_utc: "2026-03-02T09:00:00Z", duration_minutes: 60, capacity: 1 }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { sh_prior1: $.data.id }
            - call: "POST /group-projects/${gp}/shifts"
              payload: { role_label: "P", shift_start_utc: "2026-03-03T09:00:00Z", duration_minutes: 60, capacity: 1 }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { sh_prior2: $.data.id }
            - call: "POST /group-projects/${gp}/shifts"
              payload: { role_label: "P", shift_start_utc: "2026-03-05T09:00:00Z", duration_minutes: 60, capacity: 1 }
              as: ProjectOrganizer
              as_user_id: "${o}"
              captures: { sh1: $.data.id }
            - call: "POST /group-projects/${gp}/publish"
              payload: {}
              as: ProjectOrganizer
              as_user_id: "${o}"
            - call: "POST /shifts/${sh_prior1}/assignments"
              payload: { member_id: "${v2}" }
              as: Member
              as_user_id: "${v2}"
            - call: "POST /shifts/${sh_prior2}/assignments"
              payload: { member_id: "${v2}" }
              as: Member
              as_user_id: "${v2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${sh1}/assignments"
              payload: { member_id: "${v2}" }
              as: Member
              as_user_id: "${v2}"
              captures: { a1: $.data.id }
            - call: "GET /members/${v2}"
              payload: {}
              as: Member
              as_user_id: "${v2}"
              captures: { v2_strikes_before: $.data.no_show_strikes }
          trigger:
            - call: "DELETE /shifts/${sh1}/assignments/${a1}"
              payload: {}
              as: Member
              as_user_id: "${v2}"
              captures: { a1_final: $.data.status }
            - call: "GET /members/${v2}"
              payload: {}
              as: Member
              as_user_id: "${v2}"
              captures: { v2_strikes_after: $.data.no_show_strikes }
            - call: "GET /members/${v1}"
              payload: {}
              as: Member
              as_user_id: "${v1}"
              captures: { v1_strikes_after: $.data.no_show_strikes }
          assert:
            - "ShiftAssignment.${a1}.status == CANCELLED"
            - "Member.${v2}.no_show_strikes == 2 (unchanged)"
            - "Member.${v1}.no_show_strikes == 0 (unchanged)"
            - "sum(Member.no_show_strikes) unchanged across the create-then-cancel round-trip — zero drift on this different conserved quantity."
