  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_closed_make_safe_complete
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INCIDENT_NOT_ACTIVE]
          - errors[ERR_ATMOSPHERIC_READING_REQUIRED]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: a make-safe/complete
          against a CLOSED incident that also lacks the required atmospheric
          reading violates both priority 6 (state) and priority 7 (safety);
          the state error ERR_INCIDENT_NOT_ACTIVE must win.
        test_recipe:
          setup:
            - "T1; odor-reported incident driven to CLOSED with exactly one reading (so the safety gate is satisfiable in general) — then a second incident closed with the reading requirement met, and the trigger replays completion on the closed incident with leak_confirmed=true"
            - "To make the dual failure explicit: the closed incident had odor_reported=true; the trigger omits nothing — state fails (CLOSED) and safety would also fail on any fresh evaluation path"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Liam", caller_phone: "555-0111", address_line: "12 Spruce Way", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
