# =============================================================================
# Task 1973: Behavioral Intervention Team & Care Referral (campus CARE team)
# PRD-benchmark scaffold — seed tables (sections 1.0-1.7)
# =============================================================================

scenario: |
  1973. Behavioral Intervention Team & Care Referral (campus CARE team): concern report
  intake from faculty/peers, risk rubric & case triage, information sharing across
  offices under privacy rules, intervention plan & assigned case manager, mandated
  assessment & leave-of-absence decision, re-entry evaluation & conditions, follow-up
  cadence & case closure, aggregate trend reporting

domain_name: behavioral-intervention-team
api_prefix: /bit

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FKs; no nested URL paths
  state_machine_shape: cyclic      # escalation re-triage loop + re-entry denial loop
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "Campus student number; unique per student" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: enrollment_status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | LEAVE_OF_ABSENCE | WITHDRAWN. Set to LEAVE_OF_ABSENCE / back to ENROLLED only by leave/re-entry cascades; SystemAdmin may PATCH ENROLLED <-> WITHDRAWN", constraints: "enum: ENROLLED, LEAVE_OF_ABSENCE, WITHDRAWN" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: office, type: enum, source: input, description: "Home office; drives privacy-scope checks and disclosure targeting", constraints: "enum: FACULTY_AFFAIRS, RESIDENCE_LIFE, COUNSELING_CENTER, DEAN_OF_STUDENTS, BIT_OFFICE, CAMPUS_SAFETY, PRIVACY_OFFICE" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the staff account is active" }

  - name: ConcernReport
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; subject of the concern" }
      - { name: reporter_id, type: string, source: system, description: "FK -> StaffMember.id; set from X-User-ID at submission" }
      - { name: category, type: enum, source: input, description: "Primary concern category; also feeds trend distribution", constraints: "enum: ACADEMIC_DISTRESS, BEHAVIORAL_THREAT, SELF_HARM_RISK, SUBSTANCE_CONCERN, WELLBEING_GENERAL" }
      - { name: narrative, type: string, source: input, description: "Free-text description of observed behavior" }
      - { name: observed_at, type: datetime, source: input, description: "When the concerning behavior was observed (ISO 8601 UTC)" }
      - { name: related_report_id, type: string, source: input, default: null, description: "FK -> ConcernReport.id; optional self-reference to a prior report for the SAME student" }
      - { name: care_case_id, type: string, source: system, default: null, description: "FK -> CareCase.id; set when the report is ACCEPTED" }
      - { name: review_rationale, type: string, source: system, default: null, description: "Rationale recorded on close-no-action" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> ACCEPTED | CLOSED_NO_ACTION", constraints: "enum: SUBMITTED, UNDER_REVIEW, ACCEPTED, CLOSED_NO_ACTION" }

  - name: CareCase
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; copied from the opening report" }
      - { name: opened_from_report_id, type: string, source: system, description: "FK -> ConcernReport.id; the report whose acceptance created this case" }
      - { name: assigned_case_manager_id, type: string, source: system, description: "FK -> StaffMember.id; assigned at accept, changeable via assign-manager" }
      - { name: status, type: enum, source: system, description: "INTAKE -> TRIAGED -> PLAN_DRAFTING -> PLAN_ACTIVE -> MANDATED_ASSESSMENT -> LEAVE_DECISION -> ON_LEAVE -> REENTRY_REVIEW -> (PLAN_ACTIVE | ON_LEAVE); PLAN_ACTIVE -> TRIAGED (escalation loop); PLAN_ACTIVE -> CLOSED", constraints: "enum: INTAKE, TRIAGED, PLAN_DRAFTING, PLAN_ACTIVE, MANDATED_ASSESSMENT, LEAVE_DECISION, ON_LEAVE, REENTRY_REVIEW, CLOSED" }
      - { name: current_risk_score, type: number, source: computed, default: null, description: "Score from the latest RiskScoring (0.0-100.0, 1 decimal, round_half_up); null before first scoring" }
      - { name: current_risk_tier, type: enum, source: computed, default: null, description: "LOW | MODERATE | HIGH | IMMINENT derived from current_risk_score with IMMINENT ratchet; null before first scoring", constraints: "enum: LOW, MODERATE, HIGH, IMMINENT (nullable)" }
      - { name: consecutive_stable_checkins, type: integer, source: computed, default: 0, description: "Count of consecutive COMPLETED check-ins with outcome STABLE; reset to 0 on ESCALATED outcome, MISSED sweep, re-entry approval" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Set when the case transitions to CLOSED; null while open" }

  - name: RiskScoring
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> CareCase.id; case being scored" }
      - { name: scored_by, type: string, source: system, description: "FK -> StaffMember.id; set from X-User-ID (must be BITChair)" }
      - { name: mode, type: enum, source: input, description: "INITIAL (first scoring for the case) | REASSESSMENT (requires a prior scoring)", constraints: "enum: INITIAL, REASSESSMENT" }
      - { name: harm_to_self, type: integer, source: input, description: "Rubric dimension 0-25 inclusive" }
      - { name: harm_to_others, type: integer, source: input, description: "Rubric dimension 0-25 inclusive" }
      - { name: academic_disruption, type: integer, source: input, description: "Rubric dimension 0-25 inclusive" }
      - { name: substance_involvement, type: integer, source: input, description: "Rubric dimension 0-25 inclusive" }
      - { name: rationale, type: string, source: input, description: "Free-text justification for the scores" }
      - { name: score, type: number, source: computed, description: "Computed per triage_risk_score; 1 decimal round_half_up" }
      - { name: tier, type: enum, source: computed, description: "LOW | MODERATE | HIGH | IMMINENT per triage_risk_score thresholds + ratchet", constraints: "enum: LOW, MODERATE, HIGH, IMMINENT" }

  - name: InterventionPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> CareCase.id" }
      - { name: drafted_by, type: string, source: system, description: "FK -> StaffMember.id; set from X-User-ID (CaseManager)" }
      - { name: supersedes_plan_id, type: string, source: system, default: null, description: "FK -> InterventionPlan.id; set when this plan's approval supersedes a prior ACTIVE plan" }
      - { name: objectives, type: array, source: input, description: "Non-empty list of objective strings" }
      - { name: success_criteria, type: string, source: input, description: "Measurable closure criteria text" }
      - { name: reentry_conditions, type: array, source: system, default: [], description: "Conditions copied from the approving ReentryEvaluation when a SUSPENDED plan is reactivated" }
      - { name: revision_note, type: string, source: system, default: null, description: "Note recorded by BITChair on return-for-revision" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PENDING_APPROVAL -> ACTIVE; PENDING_APPROVAL -> DRAFT (revision loop); ACTIVE -> SUPERSEDED | SUSPENDED; SUSPENDED -> ACTIVE", constraints: "enum: DRAFT, PENDING_APPROVAL, ACTIVE, SUPERSEDED, SUSPENDED" }

  - name: MandatedAssessment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> CareCase.id" }
      - { name: ordered_by, type: string, source: system, description: "FK -> StaffMember.id; set from X-User-ID (BITChair)" }
      - { name: evaluator_id, type: string, source: input, description: "FK -> StaffMember.id; the CounselingEvaluator assigned to record the outcome" }
      - { name: due_at, type: datetime, source: input, description: "Completion deadline; must be > now and <= now + 14 days at order time" }
      - { name: rationale, type: string, source: input, description: "Why the assessment is mandated" }
      - { name: outcome, type: enum, source: system, default: null, description: "CLEARED | NOT_CLEARED; set by record-outcome", constraints: "enum: CLEARED, NOT_CLEARED (nullable)" }
      - { name: findings_summary, type: string, source: system, default: null, description: "Evaluator's summary recorded with the outcome" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Timestamp of record-outcome" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | EXPIRED (EXPIRED by clock sweep when now > due_at)", constraints: "enum: SCHEDULED, COMPLETED, EXPIRED" }

  - name: LeaveDecision
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> CareCase.id; created by the LEAVE_DECISION cascade" }
      - { name: requested_by, type: string, source: system, description: "FK -> StaffMember.id; the BITChair who ordered the triggering MandatedAssessment" }
      - { name: decided_by, type: string, source: system, default: null, description: "FK -> StaffMember.id; DeanOfStudents who decided (null while PENDING)" }
      - { name: decision, type: enum, source: system, default: null, description: "GRANT_LEAVE | DENY_LEAVE (null while PENDING)", constraints: "enum: GRANT_LEAVE, DENY_LEAVE (nullable)" }
      - { name: rationale, type: string, source: system, default: null, description: "Decider's rationale" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Decision timestamp" }
      - { name: status, type: enum, source: system, description: "PENDING -> GRANTED | DENIED", constraints: "enum: PENDING, GRANTED, DENIED" }

  - name: ReentryEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> CareCase.id" }
      - { name: leave_decision_id, type: string, source: system, description: "FK -> LeaveDecision.id; the GRANTED leave decision the student is returning from" }
      - { name: petitioned_by, type: string, source: system, description: "FK -> StaffMember.id; CaseManager filing the petition (from X-User-ID)" }
      - { name: petition_summary, type: string, source: input, description: "Summary of readiness evidence" }
      - { name: decided_by, type: string, source: system, default: null, description: "FK -> StaffMember.id; DeanOfStudents decider; MUST differ from the LeaveDecision.decided_by (segregation)" }
      - { name: outcome, type: enum, source: system, default: null, description: "APPROVED_WITH_CONDITIONS | DENIED (null while PENDING)", constraints: "enum: APPROVED_WITH_CONDITIONS, DENIED (nullable)" }
      - { name: conditions, type: array, source: input, default: null, description: "Re-entry conditions; REQUIRED non-empty when outcome == APPROVED_WITH_CONDITIONS" }
      - { name: rationale, type: string, source: system, default: null, description: "Decider rationale" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Decision timestamp" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED | DENIED", constraints: "enum: PENDING, APPROVED, DENIED" }

  - name: FollowUpCheckin
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> CareCase.id" }
      - { name: due_at, type: datetime, source: system, description: "Scheduled due timestamp per followup_cadence_schedule" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Set on completion" }
      - { name: outcome, type: enum, source: system, default: null, description: "STABLE | ESCALATED recorded by case manager; MISSED is system-set by the sweep (never a completion outcome)", constraints: "enum: STABLE, ESCALATED (nullable; input on complete)" }
      - { name: note, type: string, source: system, default: null, description: "Case manager note on completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | MISSED | CANCELLED. MISSED when now > due_at + 1 day; CANCELLED when cadence is suspended (leave decision pending, case leaves PLAN_ACTIVE, case closes)", constraints: "enum: SCHEDULED, COMPLETED, MISSED, CANCELLED" }

  - name: DisclosureGrant
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> CareCase.id" }
      - { name: requested_by, type: string, source: system, default: null, description: "FK -> StaffMember.id; null when system auto-created on IMMINENT crossing" }
      - { name: approved_by, type: string, source: system, default: null, description: "FK -> StaffMember.id; PrivacyOfficer approver; null while REQUESTED or when system auto-approved" }
      - { name: to_office, type: enum, source: input, description: "Target office receiving disclosure", constraints: "enum: FACULTY_AFFAIRS, RESIDENCE_LIFE, COUNSELING_CENTER, DEAN_OF_STUDENTS, BIT_OFFICE, CAMPUS_SAFETY, PRIVACY_OFFICE" }
      - { name: scope, type: enum, source: input, description: "SUMMARY_ONLY | SAFETY_MINIMUM -> redacted read; FULL_RECORD -> unredacted read", constraints: "enum: SUMMARY_ONLY, FULL_RECORD, SAFETY_MINIMUM" }
      - { name: effective_from, type: datetime, source: input, description: "Start of disclosure window (half-open, inclusive)" }
      - { name: expires_at, type: datetime, source: input, description: "End of disclosure window (half-open, EXCLUSIVE); must be > effective_from" }
      - { name: purpose, type: string, source: input, description: "Need-to-know justification" }
      - { name: auto_approved, type: boolean, source: computed, default: false, description: "True when created APPROVED by the IMMINENT-tier safety exception" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED | DENIED; APPROVED -> REVOKED | EXPIRED (EXPIRED by sweep when now >= expires_at)", constraints: "enum: REQUESTED, APPROVED, DENIED, REVOKED, EXPIRED" }

  - name: TrendReport
    parent: null
    common_fields: true
    fields:
      - { name: term_code, type: string, source: input, description: "Academic term label, e.g. 2026-FALL" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive window end (ISO 8601 UTC); must be > window_start" }
      - { name: variant, type: enum, source: input, description: "Inclusion rule: ENTRY_COHORT (created_at in window) | ACTIVE_IN_WINDOW (overlapping lifetime)", constraints: "enum: ENTRY_COHORT, ACTIVE_IN_WINDOW" }
      - { name: total_cases, type: integer, source: computed, description: "Cases in the variant input set" }
      - { name: closed_in_window, type: integer, source: computed, description: "Input-set cases with closed_at inside [window_start, window_end]" }
      - { name: closure_rate_pct, type: number, source: computed, description: "round_half_up(100 * closed_in_window / total_cases, 1); 0.0 when total_cases == 0" }
      - { name: avg_days_to_close, type: number, source: computed, description: "Mean days created_at -> closed_at over closed-in-window cases, round_half_up 1 decimal; 0.0 when none" }
      - { name: category_distribution, type: object, source: computed, description: "Map of ConcernReport.category -> percentage share of the input set (by opening report), per trend_category_distribution rounding order" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConcernReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, CLOSED_NO_ACTION]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /bit/concern-reports/{id}/start-review"
        actor: BITChair
        preconditions:
          - "report.status == SUBMITTED (else ERR_REPORT_NOT_UNDER_REVIEW... see note)"
        side_effects: []
        note: "start-review from any non-SUBMITTED state -> ERR_INVALID_STATE on the report (ERR_REPORT_NOT_UNDER_REVIEW family; see errors)"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /bit/concern-reports/{id}/accept"
        actor: BITChair
        preconditions:
          - "report.status == UNDER_REVIEW (ERR_REPORT_NOT_UNDER_REVIEW)"
          - "case_manager_id references an existing StaffMember (ERR_NOT_FOUND)"
        side_effects:
          - "If the student already has a CareCase with status != CLOSED: report.care_case_id = that case's id (link; case state unchanged, case.version unchanged)"
          - "Else create CareCase(status=INTAKE, student_id=report.student_id, opened_from_report_id=report.id, assigned_case_manager_id=case_manager_id) and set report.care_case_id to it"
      - from: UNDER_REVIEW
        to: CLOSED_NO_ACTION
        trigger: "POST /bit/concern-reports/{id}/close-no-action"
        actor: BITChair
        preconditions:
          - "report.status == UNDER_REVIEW (ERR_REPORT_NOT_UNDER_REVIEW)"
        side_effects:
          - "report.review_rationale = input rationale"

  - entity: CareCase
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /bit/risk-scorings (first scoring, mode=INITIAL)"
        actor: BITChair
        preconditions:
          - "case.status == INTAKE (ERR_CASE_NOT_TRIAGEABLE)"
          - "no prior RiskScoring exists for the case when mode == INITIAL (ERR_SCORING_MODE_INVALID)"
        side_effects:
          - "compute triage_risk_score -> case.current_risk_score / current_risk_tier"
          - "if computed tier == IMMINENT: auto-create APPROVED SAFETY_MINIMUM DisclosureGrants to COUNSELING_CENTER and CAMPUS_SAFETY (expires_at = now + 72h, auto_approved=true)"
      - from: TRIAGED
        to: TRIAGED
        trigger: "POST /bit/risk-scorings (mode=REASSESSMENT)"
        actor: BITChair
        preconditions:
          - "case.status == TRIAGED (ERR_CASE_NOT_TRIAGEABLE)"
          - "a prior RiskScoring exists when mode == REASSESSMENT (ERR_SCORING_MODE_INVALID)"
        side_effects:
          - "recompute triage_risk_score (REASSESSMENT variant uses previous score) -> case.current_risk_score / current_risk_tier"
          - "if tier crosses INTO IMMINENT (previous tier != IMMINENT): auto-grant cascade as above; no new grants if previous tier was already IMMINENT"
        note: "self-loop re-scoring while TRIAGED"
      - from: TRIAGED
        to: PLAN_DRAFTING
        trigger: "POST /bit/intervention-plans"
        actor: CaseManager
        preconditions:
          - "case.status IN {TRIAGED, PLAN_ACTIVE} (ERR_CASE_NOT_TRIAGEABLE for INTAKE; ERR_CASE_NOT_PLAN_ACTIVE family otherwise)"
          - "expected_case_version == case.version (ERR_STALE_CASE_VERSION)"
          - "no InterventionPlan with status IN {DRAFT, PENDING_APPROVAL} exists for the case (ERR_OPEN_PLAN_EXISTS)"
        side_effects:
          - "create InterventionPlan(status=DRAFT, drafted_by=X-User-ID)"
          - "case.status TRIAGED -> PLAN_DRAFTING (case stays PLAN_ACTIVE when drafted as a revision); case.version += 1"
      - from: PLAN_DRAFTING
        to: PLAN_ACTIVE
        trigger: "POST /bit/intervention-plans/{id}/approve"
        actor: BITChair
        preconditions:
          - "plan.status == PENDING_APPROVAL (ERR_PLAN_NOT_PENDING_APPROVAL)"
          - "case.status IN {PLAN_DRAFTING, PLAN_ACTIVE} (ERR_CASE_STATE_BLOCKS_PLAN_APPROVAL)"
          - "X-User-ID != plan.drafted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "plan -> ACTIVE; if another plan for the case is ACTIVE: that plan -> SUPERSEDED and this plan.supersedes_plan_id = its id"
          - "case PLAN_DRAFTING -> PLAN_ACTIVE (no-op when already PLAN_ACTIVE)"
          - "cancel any SCHEDULED FollowUpCheckins, then create one FollowUpCheckin(due_at = now + cadence_days(case.current_risk_tier))"
      - from: PLAN_ACTIVE
        to: TRIAGED
        trigger: "POST /bit/follow-up-checkins/{id}/complete with outcome=ESCALATED"
        actor: CaseManager
        preconditions:
          - "checkin.status == SCHEDULED (ERR_CHECKIN_NOT_SCHEDULED)"
          - "case.status == PLAN_ACTIVE (ERR_CASE_NOT_PLAN_ACTIVE)"
          - "X-User-ID == case.assigned_case_manager_id (ERR_NOT_ASSIGNED_CASE_MANAGER)"
        side_effects:
          - "checkin -> COMPLETED (completed_at=now); NO successor check-in is created"
          - "ACTIVE InterventionPlan for the case -> SUPERSEDED"
          - "case.consecutive_stable_checkins = 0; case -> TRIAGED (re-triage required before a new plan)"
      - from: PLAN_ACTIVE
        to: MANDATED_ASSESSMENT
        trigger: "POST /bit/mandated-assessments"
        actor: BITChair
        preconditions:
          - "case.status == PLAN_ACTIVE (ERR_CASE_NOT_PLAN_ACTIVE)"
          - "no MandatedAssessment with status == SCHEDULED occupies the case slot (closed interval [ordered_at=now, due_at]) (ERR_ASSESSMENT_ALREADY_PENDING)"
          - "due_at > now AND due_at <= now + 14 days (ERR_ASSESSMENT_DUE_WINDOW_VIOLATION)"
          - "evaluator_id != ordered_by (ERR_EVALUATOR_SAME_AS_ORDERER)"
        side_effects:
          - "create MandatedAssessment(status=SCHEDULED, ordered_by=X-User-ID)"
          - "case -> MANDATED_ASSESSMENT; case.version += 1; SCHEDULED check-ins keep running"
      - from: MANDATED_ASSESSMENT
        to: PLAN_ACTIVE
        trigger: "POST /bit/mandated-assessments/{id}/record-outcome with outcome=CLEARED"
        actor: CounselingEvaluator
        preconditions:
          - "assessment.status == SCHEDULED (ERR_ASSESSMENT_NOT_SCHEDULED)"
          - "case.status == MANDATED_ASSESSMENT (ERR_CASE_NOT_MANDATED_ASSESSMENT)"
          - "X-User-ID == assessment.evaluator_id AND X-User-ID != assessment.ordered_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "assessment -> COMPLETED (outcome=CLEARED, completed_at=now)"
          - "case -> PLAN_ACTIVE; case.version += 1"
      - from: MANDATED_ASSESSMENT
        to: LEAVE_DECISION
        trigger: "POST /bit/mandated-assessments/{id}/record-outcome with outcome=NOT_CLEARED"
        actor: CounselingEvaluator
        preconditions:
          - "same as CLEARED path"
        side_effects:
          - "LINK 1: assessment -> COMPLETED (outcome=NOT_CLEARED, completed_at=now)"
          - "LINK 2 (caused by link 1): case -> LEAVE_DECISION; case.version += 1"
          - "LINK 3 (caused by link 2): create LeaveDecision(status=PENDING, case_id=case.id, requested_by=assessment.ordered_by)"
          - "LINK 4 (caused by link 3): the PENDING LeaveDecision suspends follow-up cadence — every SCHEDULED FollowUpCheckin for the case -> CANCELLED"
      - from: MANDATED_ASSESSMENT
        to: LEAVE_DECISION
        trigger: "system (clock sweep: now > assessment.due_at while assessment.status == SCHEDULED)"
        actor: system
        preconditions:
          - "assessment.status == SCHEDULED AND now > due_at"
        side_effects:
          - "LINK 1: assessment -> EXPIRED"
          - "LINK 2 (caused by link 1): case -> LEAVE_DECISION; case.version += 1"
          - "LINK 3 (caused by link 2): create LeaveDecision(status=PENDING, requested_by=assessment.ordered_by)"
          - "LINK 4 (caused by link 3): all SCHEDULED FollowUpCheckins for the case -> CANCELLED"
      - from: LEAVE_DECISION
        to: ON_LEAVE
        trigger: "POST /bit/leave-decisions/{id}/decide with decision=GRANT_LEAVE"
        actor: DeanOfStudents
        preconditions:
          - "leave_decision.status == PENDING (ERR_DECISION_NOT_PENDING)"
          - "X-User-ID != leave_decision.requested_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "leave_decision -> GRANTED (decided_by, decided_at set)"
          - "case -> ON_LEAVE; case.version += 1"
          - "Student.enrollment_status -> LEAVE_OF_ABSENCE"
          - "ACTIVE InterventionPlan for the case -> SUSPENDED"
      - from: LEAVE_DECISION
        to: PLAN_ACTIVE
        trigger: "POST /bit/leave-decisions/{id}/decide with decision=DENY_LEAVE"
        actor: DeanOfStudents
        preconditions:
          - "leave_decision.status == PENDING (ERR_DECISION_NOT_PENDING)"
          - "X-User-ID != leave_decision.requested_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "leave_decision -> DENIED"
          - "case -> PLAN_ACTIVE; case.version += 1"
          - "create FollowUpCheckin(due_at = now + cadence_days(case.current_risk_tier))"
      - from: ON_LEAVE
        to: REENTRY_REVIEW
        trigger: "POST /bit/reentry-evaluations"
        actor: CaseManager
        preconditions:
          - "case.status == ON_LEAVE (ERR_CASE_NOT_ON_LEAVE)"
          - "expected_case_version == case.version (ERR_STALE_CASE_VERSION)"
          - "no ReentryEvaluation with status == PENDING exists for the case (ERR_REENTRY_ALREADY_PENDING)"
        side_effects:
          - "create ReentryEvaluation(status=PENDING, petitioned_by=X-User-ID, leave_decision_id = the GRANTED LeaveDecision under which the student is on leave)"
          - "case -> REENTRY_REVIEW; case.version += 1"
      - from: REENTRY_REVIEW
        to: PLAN_ACTIVE
        trigger: "POST /bit/reentry-evaluations/{id}/decide with outcome=APPROVED_WITH_CONDITIONS"
        actor: DeanOfStudents
        preconditions:
          - "evaluation.status == PENDING (ERR_DECISION_NOT_PENDING)"
          - "X-User-ID != evaluation.leave_decision.decided_by (ERR_SEGREGATION_OF_DUTIES)"
          - "conditions non-empty (ERR_CONDITIONS_REQUIRED)"
        side_effects:
          - "evaluation -> APPROVED (decided_by, decided_at, conditions recorded)"
          - "case -> PLAN_ACTIVE; case.consecutive_stable_checkins = 0; case.version += 1"
          - "Student.enrollment_status -> ENROLLED"
          - "SUSPENDED InterventionPlan -> ACTIVE with reentry_conditions = evaluation.conditions"
          - "create FollowUpCheckin(due_at = now + 7 days) — fixed post-re-entry cadence"
      - from: REENTRY_REVIEW
        to: ON_LEAVE
        trigger: "POST /bit/reentry-evaluations/{id}/decide with outcome=DENIED"
        actor: DeanOfStudents
        preconditions:
          - "evaluation.status == PENDING (ERR_DECISION_NOT_PENDING)"
          - "X-User-ID != evaluation.leave_decision.decided_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "evaluation -> DENIED; case -> ON_LEAVE (re-entry denial loop); case.version += 1"
      - from: PLAN_ACTIVE
        to: CLOSED
        trigger: "POST /bit/care-cases/{id}/close"
        actor: BITChair
        preconditions:
          - "case.status == PLAN_ACTIVE (ERR_CASE_NOT_PLAN_ACTIVE)"
          - "case.consecutive_stable_checkins >= 3 AND case.current_risk_tier == LOW AND no MandatedAssessment SCHEDULED AND no LeaveDecision PENDING AND no ReentryEvaluation PENDING (else ERR_CASE_NOT_CLOSABLE)"
        side_effects:
          - "case -> CLOSED; closed_at = now; case.version += 1"
          - "all SCHEDULED FollowUpCheckins for the case -> CANCELLED"

  - entity: InterventionPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /bit/intervention-plans/{id}/submit"
        actor: CaseManager
        preconditions:
          - "plan.status == DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "X-User-ID == plan.drafted_by (ERR_FORBIDDEN)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /bit/intervention-plans/{id}/return"
        actor: BITChair
        preconditions:
          - "plan.status == PENDING_APPROVAL (ERR_PLAN_NOT_PENDING_APPROVAL)"
        side_effects:
          - "plan.revision_note = input revision_note"
        note: "revision loop DRAFT -> PENDING_APPROVAL -> DRAFT"
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /bit/intervention-plans/{id}/approve"
        actor: BITChair
        preconditions:
          - "see CareCase PLAN_DRAFTING->PLAN_ACTIVE transition"
        side_effects:
          - "prior ACTIVE plan (if any) -> SUPERSEDED; this plan.supersedes_plan_id = prior plan id"
          - "cadence reset: SCHEDULED check-ins CANCELLED, one fresh check-in scheduled"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another plan approved for the case, or a check-in completes with outcome=ESCALATED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (leave decision GRANT_LEAVE on the case)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (re-entry evaluation APPROVED_WITH_CONDITIONS)"
        actor: system
        preconditions: []
        side_effects:
          - "reentry_conditions = evaluation.conditions"

  - entity: MandatedAssessment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /bit/mandated-assessments/{id}/record-outcome"
        actor: CounselingEvaluator
        preconditions:
          - "see CareCase MANDATED_ASSESSMENT transitions"
        side_effects:
          - "outcome CLEARED -> case PLAN_ACTIVE; outcome NOT_CLEARED -> LEAVE_DECISION cascade (see CareCase machine)"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (clock sweep when now > due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "LEAVE_DECISION cascade identical to NOT_CLEARED path"

  - entity: LeaveDecision
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /bit/leave-decisions/{id}/decide decision=GRANT_LEAVE"
        actor: DeanOfStudents
        preconditions: ["see CareCase LEAVE_DECISION->ON_LEAVE"]
        side_effects: ["student -> LEAVE_OF_ABSENCE; ACTIVE plan -> SUSPENDED; case -> ON_LEAVE"]
      - from: PENDING
        to: DENIED
        trigger: "POST /bit/leave-decisions/{id}/decide decision=DENY_LEAVE"
        actor: DeanOfStudents
        preconditions: ["see CareCase LEAVE_DECISION->PLAN_ACTIVE"]
        side_effects: ["case -> PLAN_ACTIVE; fresh check-in scheduled"]

  - entity: ReentryEvaluation
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /bit/reentry-evaluations/{id}/decide outcome=APPROVED_WITH_CONDITIONS"
        actor: DeanOfStudents
        preconditions: ["see CareCase REENTRY_REVIEW->PLAN_ACTIVE"]
        side_effects: ["student -> ENROLLED; SUSPENDED plan -> ACTIVE with conditions; case -> PLAN_ACTIVE"]
      - from: PENDING
        to: DENIED
        trigger: "POST /bit/reentry-evaluations/{id}/decide outcome=DENIED"
        actor: DeanOfStudents
        preconditions: ["see CareCase REENTRY_REVIEW->ON_LEAVE"]
        side_effects: ["case -> ON_LEAVE"]

  - entity: FollowUpCheckin
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /bit/follow-up-checkins/{id}/complete (may be completed at or before due_at)"
        actor: CaseManager
        preconditions:
          - "checkin.status == SCHEDULED (ERR_CHECKIN_NOT_SCHEDULED)"
          - "case.status == PLAN_ACTIVE (ERR_CASE_NOT_PLAN_ACTIVE)"
          - "X-User-ID == case.assigned_case_manager_id (ERR_NOT_ASSIGNED_CASE_MANAGER)"
        side_effects:
          - "outcome=STABLE: case.consecutive_stable_checkins += 1; create successor FollowUpCheckin(due_at = now + cadence_days(case.current_risk_tier))"
          - "outcome=ESCALATED: case.consecutive_stable_checkins = 0; NO successor; ACTIVE plan -> SUPERSEDED; case -> TRIAGED"
      - from: SCHEDULED
        to: MISSED
        trigger: "system (clock sweep when now > due_at + 1 day)"
        actor: system
        preconditions: []
        side_effects:
          - "case.consecutive_stable_checkins = 0"
          - "create successor FollowUpCheckin(due_at = missed check-in's due_at + cadence_days(case.current_risk_tier))"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (LeaveDecision PENDING created for the case, plan approval cadence reset, or case closure)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DisclosureGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /bit/disclosure-grants/{id}/approve"
        actor: PrivacyOfficer
        preconditions:
          - "grant.status == REQUESTED (ERR_GRANT_NOT_REQUESTED)"
        side_effects:
          - "grant.approved_by = X-User-ID"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /bit/disclosure-grants/{id}/deny"
        actor: PrivacyOfficer
        preconditions:
          - "grant.status == REQUESTED (ERR_GRANT_NOT_REQUESTED)"
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /bit/disclosure-grants/{id}/revoke"
        actor: PrivacyOfficer
        preconditions:
          - "grant.status == APPROVED (ERR_GRANT_NOT_APPROVED)"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep when now >= expires_at)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-case
    parent_entity: CareCase
    write_endpoint: "POST /bit/intervention-plans"
    occ_field: expected_case_version
    description: |
      Creating an InterventionPlan against a CareCase whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a plan draft (which advances the case to
      PLAN_DRAFTING or supersedes the client's view) and the current writer's
      view of the case is therefore stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: reentry-petition-stale-case
    parent_entity: CareCase
    write_endpoint: "POST /bit/reentry-evaluations"
    occ_field: expected_case_version
    description: |
      Filing a re-entry petition against a CareCase whose version has advanced
      since the client last observed it is rejected. A second petition built on
      an older observed version would otherwise supersede state it never saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: triage_risk_score
    trigger: "POST /bit/risk-scorings (case INTAKE with INITIAL, or TRIAGED with REASSESSMENT)"
    algorithm: weighted_scoring
    formula: |
      weights: SELF=0.35 (harm_to_self), OTHERS=0.35 (harm_to_others),
               ACADEMIC=0.15 (academic_disruption), SUBSTANCE=0.15 (substance_involvement)
      base = 4 * (0.35*harm_to_self + 0.35*harm_to_others
                  + 0.15*academic_disruption + 0.15*substance_involvement)   # 0..100
      INITIAL:       score = round_half_up(base, 1)
      REASSESSMENT:  score = round_half_up(0.6*base + 0.4*previous_scoring.score, 1)
      tier thresholds (>= semantics):
        score >= 80  -> IMMINENT
        score >= 60  -> HIGH
        score >= 30  -> MODERATE
        else         -> LOW
      ratchet: if case.current_risk_tier == IMMINENT before this scoring
               AND the threshold-derived tier < HIGH, the new tier is floored at HIGH.
    input_set: "the four rubric dimension integers (0..25) of this scoring plus, for REASSESSMENT, the immediately preceding RiskScoring for the same case"
    constants:
      W_SELF: 0.35
      W_OTHERS: 0.35
      W_ACADEMIC: 0.15
      W_SUBSTANCE: 0.15
      SCALE: 4
      REASSESS_NEW_WEIGHT: 0.6
      REASSESS_PREV_WEIGHT: 0.4
      TIER_IMMINENT: 80
      TIER_HIGH: 60
      TIER_MODERATE: 30
    precision: "1 decimal place, round_half_up"
    variants:
      - name: INITIAL
        when: "first scoring for the case"
        difference: "pure weighted formula; ignores any history"
      - name: REASSESSMENT
        when: "subsequent scoring while case is TRIAGED"
        difference: "blends 0.6*base + 0.4*previous score, so identical dimension inputs yield a different score than INITIAL whenever previous score != base"

  - name: followup_cadence_schedule
    trigger: "plan approval, DENY_LEAVE decision, STABLE check-in completion, MISSED sweep, re-entry approval"
    algorithm: threshold
    formula: |
      cadence_days(tier): IMMINENT -> 2, HIGH -> 7, MODERATE -> 14, LOW -> 30
      standard scheduling: next due_at = scheduling_now + cadence_days(case.current_risk_tier)
      MISSED sweep successor: due_at = missed.due_at + cadence_days(case.current_risk_tier)
      post-re-entry: first check-in after APPROVED_WITH_CONDITIONS is fixed at now + 7 days
      MISSED detection: check-in SCHEDULED AND now > due_at + GRACE_DAYS -> MISSED
    input_set: "FollowUpCheckins of the case with status == SCHEDULED"
    constants:
      CADENCE_IMMINENT_DAYS: 2
      CADENCE_HIGH_DAYS: 7
      CADENCE_MODERATE_DAYS: 14
      CADENCE_LOW_DAYS: 30
      GRACE_DAYS: 1
      REENTRY_FIRST_CHECKIN_DAYS: 7
    precision: "whole-day granularity on timestamps (due_at = base + N days exactly)"

  - name: consecutive_stable_tracking
    trigger: "check-in completion, MISSED sweep, re-entry approval"
    algorithm: aggregation
    formula: |
      on STABLE completion:  case.consecutive_stable_checkins += 1
      on ESCALATED completion, MISSED sweep, or re-entry APPROVED: case.consecutive_stable_checkins = 0
    input_set: "the completed/missed FollowUpCheckin and its CareCase"
    precision: "integer"

  - name: closure_eligibility
    trigger: "POST /bit/care-cases/{id}/close"
    algorithm: threshold
    formula: |
      closable IFF case.status == PLAN_ACTIVE
                 AND case.consecutive_stable_checkins >= 3        # exactly 3 qualifies
                 AND case.current_risk_tier == LOW
                 AND count(MandatedAssessment[case, SCHEDULED]) == 0
                 AND count(LeaveDecision[case, PENDING]) == 0
                 AND count(ReentryEvaluation[case, PENDING]) == 0
    input_set: "the case plus its assessments, leave decisions, re-entry evaluations"
    constants:
      MIN_CONSECUTIVE_STABLE: 3
    precision: "integer counts; >= comparison"

  - name: trend_report_metrics
    trigger: "POST /bit/trend-reports"
    algorithm: aggregation
    formula: |
      input_set by variant (closed interval on both ends):
        ENTRY_COHORT:      CareCase.created_at IN [window_start, window_end]
        ACTIVE_IN_WINDOW:  CareCase.created_at <= window_end
                           AND (CareCase.closed_at IS NULL OR CareCase.closed_at >= window_start)
      total_cases = count(input_set)
      closed_in_window = count(input_set where closed_at IN [window_start, window_end])
      closure_rate_pct = round_half_up(100 * closed_in_window / total_cases, 1); 0.0 if total_cases == 0
      avg_days_to_close = round_half_up(mean over closed-in-window cases of
                          (closed_at - created_at) in whole days, 1); 0.0 if closed_in_window == 0
    input_set: "all CareCases, filtered per variant; category taken from the case's opened_from_report_id -> ConcernReport.category"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: ENTRY_COHORT
        when: "cohort analysis of cases opened in the term"
        difference: "includes only cases created inside the window"
      - name: ACTIVE_IN_WINDOW
        when: "service-load analysis of everything live during the term"
        difference: "also includes cases created before the window that were still open into it — identical data yields larger totals and different rates"

  - name: trend_category_distribution
    trigger: "POST /bit/trend-reports (as part of trend_report_metrics)"
    algorithm: aggregation
    formula: |
      For each category in enum order [ACADEMIC_DISTRESS, BEHAVIORAL_THREAT,
      SELF_HARM_RISK, SUBSTANCE_CONCERN, WELLBEING_GENERAL]:
        count_c = input-set cases whose opening report has category c
      Rounding order is PINNED: for the first four categories in enum order,
        share_c = round_half_up(100 * count_c / total_cases, 1)
      The LAST category (WELLBEING_GENERAL) receives the residual:
        share_last = round_half_up(100 - sum(shares of first four), 1)
      If total_cases == 0: every share is 0.0.
      (Rounding each category independently would not guarantee a 100.0 total;
      residual-to-last is the pinned order and changes the last bucket's value
      versus a naive per-category rounding.)
    input_set: "same input set as trend_report_metrics"
    precision: "1 decimal place, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role; for entity_backed roles X-User-ID must reference an existing StaffMember"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist (left-to-right); then body FK targets exist (student_id, case_id, case_manager_id, evaluator_id, related_report_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: concurrency
    check: "expected_case_version == CareCase.version when the endpoint declares the field"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /bit/intervention-plans, POST /bit/reentry-evaluations"
  - priority: 5
    category: state
    check: "State-machine preconditions of the target transition (report UNDER_REVIEW; case INTAKE/TRIAGED for scoring; plan DRAFT/PENDING; assessment SCHEDULED; decision PENDING; checkin SCHEDULED; case PLAN_ACTIVE/ON_LEAVE/PLAN_DRAFTING as applicable)"
    error_id: "ERR_REPORT_NOT_UNDER_REVIEW | ERR_CASE_NOT_TRIAGEABLE | ERR_PLAN_NOT_DRAFT | ERR_PLAN_NOT_PENDING_APPROVAL | ERR_CASE_STATE_BLOCKS_PLAN_APPROVAL | ERR_CASE_NOT_PLAN_ACTIVE | ERR_CASE_NOT_MANDATED_ASSESSMENT | ERR_CASE_NOT_ON_LEAVE | ERR_ASSESSMENT_NOT_SCHEDULED | ERR_DECISION_NOT_PENDING | ERR_CHECKIN_NOT_SCHEDULED | ERR_GRANT_NOT_REQUESTED | ERR_GRANT_NOT_APPROVED"
    http_status: 409
    applies_to: all action endpoints
  - priority: 6
    category: business_safety
    check: "Privacy scope: GET /bit/care-cases/{id} — full for BITChair/PrivacyOfficer/DeanOfStudents; CaseManager only if assigned; CounselingEvaluator only if evaluator on a SCHEDULED/COMPLETED assessment for the case; otherwise an APPROVED unexpired DisclosureGrant for the caller's office is required (FULL_RECORD -> full view, SUMMARY_ONLY/SAFETY_MINIMUM -> redacted view, missing/expired -> error)"
    error_id: ERR_PRIVACY_SCOPE_INSUFFICIENT
    http_status: 403
    applies_to: "GET /bit/care-cases/{id}"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: plan approver != drafted_by; outcome recorder == evaluator_id and != ordered_by; leave decider != requested_by; re-entry decider != original leave decider. Also ownership: submitter/completer must be the responsible case manager (ERR_NOT_ASSIGNED_CASE_MANAGER); Reporter reads only own reports (ERR_FORBIDDEN)"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_NOT_ASSIGNED_CASE_MANAGER | ERR_FORBIDDEN"
    http_status: 403
    applies_to: "approve / record-outcome / decide / submit / complete / GET report endpoints"
  - priority: 8
    category: business_safety
    check: "Student enrollment gate: new concern reports only for students with enrollment_status != WITHDRAWN"
    error_id: ERR_STUDENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bit/concern-reports"
  - priority: 9
    category: business_constraint
    check: "Field constraints: rubric dimensions integers 0..25 (ERR_RUBRIC_SCORE_OUT_OF_RANGE); scoring mode consistent with history (ERR_SCORING_MODE_INVALID); objectives non-empty and enums valid (ERR_VALIDATION); evaluator != orderer (ERR_EVALUATOR_SAME_AS_ORDERER); grant expires_at > effective_from (ERR_DISCLOSURE_WINDOW_INVALID); trend window_end > window_start (ERR_TREND_WINDOW_INVALID); re-entry conditions non-empty on approval (ERR_CONDITIONS_REQUIRED); closure eligibility aggregate (ERR_CASE_NOT_CLOSABLE); no open DRAFT/PENDING plan (ERR_OPEN_PLAN_EXISTS); no PENDING re-entry evaluation (ERR_REENTRY_ALREADY_PENDING)"
    error_id: "ERR_RUBRIC_SCORE_OUT_OF_RANGE | ERR_SCORING_MODE_INVALID | ERR_VALIDATION | ERR_EVALUATOR_SAME_AS_ORDERER | ERR_DISCLOSURE_WINDOW_INVALID | ERR_TREND_WINDOW_INVALID | ERR_CONDITIONS_REQUIRED (all 400) | ERR_CASE_NOT_CLOSABLE | ERR_OPEN_PLAN_EXISTS | ERR_REENTRY_ALREADY_PENDING (all 409)"
    http_status: "400 | 409"
    applies_to: create/action endpoints as listed
  - priority: 10
    category: business_temporal
    check: "Temporal windows: assessment due_at in (now, now+14d] (ERR_ASSESSMENT_DUE_WINDOW_VIOLATION); assessment slot closed-interval occupation [ordered_at, due_at] (ERR_ASSESSMENT_ALREADY_PENDING); disclosure half-open overlap on same (case_id, to_office) among APPROVED/REQUESTED grants (ERR_DISCLOSURE_WINDOW_OVERLAP)"
    error_id: "ERR_ASSESSMENT_DUE_WINDOW_VIOLATION (422) | ERR_ASSESSMENT_ALREADY_PENDING | ERR_DISCLOSURE_WINDOW_OVERLAP (both 409)"
    http_status: "422 | 409"
    applies_to: "POST /bit/mandated-assessments, POST /bit/disclosure-grants"
  - priority: 11
    category: business_referential
    check: "Cross-reference integrity: related_report_id must reference a report for the SAME student_id"
    error_id: ERR_RELATED_REPORT_STUDENT_MISMATCH
    http_status: 422
    applies_to: "POST /bit/concern-reports"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Students ---
  - { method: POST, path: "/bit/students", description: "Register a student record", roles: [SystemAdmin], code: 201, input: [external_ref, full_name], output: Student, side_effects: ["enrollment_status = ENROLLED"] }
  - { method: GET, path: "/bit/students/{id}", description: "Get a student", roles: [Reporter, CaseManager, BITChair, CounselingEvaluator, DeanOfStudents, PrivacyOfficer, SystemAdmin], code: 200, input: [], output: Student, side_effects: [] }
  - { method: PATCH, path: "/bit/students/{id}", description: "Administrative enrollment correction; only ENROLLED <-> WITHDRAWN may be set manually (LEAVE_OF_ABSENCE is owned by the leave/re-entry cascades)", roles: [SystemAdmin], code: 200, input: ["enrollment_status?"], output: Student, side_effects: ["student.version += 1"] }

  # --- Staff ---
  - { method: POST, path: "/bit/staff", description: "Register a staff member (backing entity for all staff roles)", roles: [SystemAdmin], code: 201, input: [full_name, office], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/bit/staff/{id}", description: "Get a staff member", roles: [Reporter, CaseManager, BITChair, CounselingEvaluator, DeanOfStudents, PrivacyOfficer, SystemAdmin], code: 200, input: [], output: StaffMember, side_effects: [] }

  # --- Concern reports ---
  - { method: POST, path: "/bit/concern-reports", description: "Submit a concern report about a student", roles: [Reporter], code: 201, input: [student_id, category, narrative, observed_at, "related_report_id?"], output: ConcernReport, side_effects: ["status = SUBMITTED; reporter_id = X-User-ID"] }
  - { method: GET, path: "/bit/concern-reports/{id}", description: "Get a report; Reporter may read only own reports", roles: [Reporter, BITChair, CaseManager, PrivacyOfficer], code: 200, input: [], output: ConcernReport, side_effects: [] }
  - { method: GET, path: "/bit/concern-reports", description: "List/filter concern reports", roles: [BITChair, CaseManager, PrivacyOfficer, DeanOfStudents], code: 200, input: ["student_id?", "reporter_id?", "related_report_id?", "care_case_id?", "status?", "limit?", "offset?"], output: "ConcernReport[]", side_effects: [] }
  - { method: POST, path: "/bit/concern-reports/{id}/start-review", description: "Move report SUBMITTED -> UNDER_REVIEW", roles: [BITChair], code: 200, input: [], output: ConcernReport, side_effects: ["report.version += 1"] }
  - { method: POST, path: "/bit/concern-reports/{id}/accept", description: "Accept report: link to the student's existing non-CLOSED CareCase or create a new INTAKE case", roles: [BITChair], code: 200, input: [case_manager_id], output: ConcernReport, side_effects: ["report -> ACCEPTED; report.care_case_id set; may create CareCase"] }
  - { method: POST, path: "/bit/concern-reports/{id}/close-no-action", description: "Close report without opening a case", roles: [BITChair], code: 200, input: [rationale], output: ConcernReport, side_effects: ["report -> CLOSED_NO_ACTION; review_rationale set"] }

  # --- Care cases ---
  - { method: GET, path: "/bit/care-cases/{id}", description: "Privacy-gated case read (validation priority 6); redacted view contains only id, student_id, status, current_risk_tier, current_risk_score", roles: [Reporter, CaseManager, BITChair, CounselingEvaluator, DeanOfStudents, PrivacyOfficer], code: 200, input: [], output: CareCase, side_effects: [] }
  - { method: GET, path: "/bit/care-cases", description: "List/filter care cases", roles: [CaseManager, BITChair, CounselingEvaluator, DeanOfStudents, PrivacyOfficer], code: 200, input: ["student_id?", "assigned_case_manager_id?", "opened_from_report_id?", "status?", "limit?", "offset?"], output: "CareCase[]", side_effects: [] }
  - { method: POST, path: "/bit/care-cases/{id}/assign-manager", description: "Assign or reassign the case manager", roles: [BITChair], code: 200, input: [case_manager_id], output: CareCase, side_effects: ["case.assigned_case_manager_id updated; case.version += 1"] }
  - { method: POST, path: "/bit/care-cases/{id}/close", description: "Close a case that satisfies closure_eligibility", roles: [BITChair], code: 200, input: [], output: CareCase, side_effects: ["case -> CLOSED; closed_at set; SCHEDULED check-ins CANCELLED; case.version += 1"] }

  # --- Risk scorings ---
  - { method: POST, path: "/bit/risk-scorings", description: "Record a rubric scoring for a case (INITIAL on INTAKE, REASSESSMENT on TRIAGED)", roles: [BITChair], code: 201, input: [case_id, mode, harm_to_self, harm_to_others, academic_disruption, substance_involvement, rationale], output: RiskScoring, side_effects: ["compute triage_risk_score; update case.current_risk_score/tier; INTAKE->TRIAGED on first scoring; IMMINENT-crossing auto-grant cascade; case.version += 1"] }
  - { method: GET, path: "/bit/risk-scorings/{id}", description: "Get a scoring", roles: [BITChair, CaseManager, DeanOfStudents, PrivacyOfficer], code: 200, input: [], output: RiskScoring, side_effects: [] }
  - { method: GET, path: "/bit/risk-scorings", description: "List/filter scorings", roles: [BITChair, CaseManager, DeanOfStudents, PrivacyOfficer], code: 200, input: ["case_id?", "scored_by?", "limit?", "offset?"], output: "RiskScoring[]", side_effects: [] }

  # --- Intervention plans ---
  - { method: POST, path: "/bit/intervention-plans", description: "Draft an intervention plan (OCC-guarded on the case)", roles: [CaseManager], code: 201, input: [case_id, expected_case_version, objectives, success_criteria], output: InterventionPlan, side_effects: ["plan DRAFT; case TRIAGED->PLAN_DRAFTING or stays PLAN_ACTIVE; increments CareCase.version by 1"] }
  - { method: GET, path: "/bit/intervention-plans/{id}", description: "Get a plan", roles: [CaseManager, BITChair, DeanOfStudents, PrivacyOfficer], code: 200, input: [], output: InterventionPlan, side_effects: [] }
  - { method: GET, path: "/bit/intervention-plans", description: "List/filter plans", roles: [CaseManager, BITChair, DeanOfStudents, PrivacyOfficer], code: 200, input: ["case_id?", "drafted_by?", "supersedes_plan_id?", "status?", "limit?", "offset?"], output: "InterventionPlan[]", side_effects: [] }
  - { method: POST, path: "/bit/intervention-plans/{id}/submit", description: "Submit draft for approval (drafter only)", roles: [CaseManager], code: 200, input: [], output: InterventionPlan, side_effects: ["plan DRAFT -> PENDING_APPROVAL"] }
  - { method: POST, path: "/bit/intervention-plans/{id}/approve", description: "Approve a submitted plan (approver must differ from drafter)", roles: [BITChair], code: 200, input: [], output: InterventionPlan, side_effects: ["plan -> ACTIVE; prior ACTIVE -> SUPERSEDED; case -> PLAN_ACTIVE; cadence reset: SCHEDULED check-ins CANCELLED then one fresh check-in scheduled; case.version += 1"] }
  - { method: POST, path: "/bit/intervention-plans/{id}/return", description: "Return a submitted plan for revision", roles: [BITChair], code: 200, input: [revision_note], output: InterventionPlan, side_effects: ["plan PENDING_APPROVAL -> DRAFT; revision_note recorded"] }

  # --- Mandated assessments ---
  - { method: POST, path: "/bit/mandated-assessments", description: "Order a mandated assessment (case must be PLAN_ACTIVE)", roles: [BITChair], code: 201, input: [case_id, evaluator_id, due_at, rationale], output: MandatedAssessment, side_effects: ["assessment SCHEDULED; case -> MANDATED_ASSESSMENT; case.version += 1"] }
  - { method: GET, path: "/bit/mandated-assessments/{id}", description: "Get an assessment", roles: [BITChair, CounselingEvaluator, DeanOfStudents, CaseManager], code: 200, input: [], output: MandatedAssessment, side_effects: [] }
  - { method: GET, path: "/bit/mandated-assessments", description: "List/filter assessments", roles: [BITChair, CounselingEvaluator, DeanOfStudents, CaseManager], code: 200, input: ["case_id?", "ordered_by?", "evaluator_id?", "status?", "limit?", "offset?"], output: "MandatedAssessment[]", side_effects: [] }
  - { method: POST, path: "/bit/mandated-assessments/{id}/record-outcome", description: "Evaluator records CLEARED / NOT_CLEARED (must be assigned evaluator and not the orderer)", roles: [CounselingEvaluator], code: 200, input: [outcome, findings_summary], output: MandatedAssessment, side_effects: ["assessment -> COMPLETED; CLEARED -> case PLAN_ACTIVE; NOT_CLEARED -> LEAVE_DECISION cascade"] }

  # --- Leave decisions ---
  - { method: GET, path: "/bit/leave-decisions/{id}", description: "Get a leave decision", roles: [BITChair, DeanOfStudents, CaseManager, PrivacyOfficer], code: 200, input: [], output: LeaveDecision, side_effects: [] }
  - { method: GET, path: "/bit/leave-decisions", description: "List/filter leave decisions", roles: [BITChair, DeanOfStudents, CaseManager, PrivacyOfficer], code: 200, input: ["case_id?", "requested_by?", "decided_by?", "status?", "limit?", "offset?"], output: "LeaveDecision[]", side_effects: [] }
  - { method: POST, path: "/bit/leave-decisions/{id}/decide", description: "Dean decides GRANT_LEAVE / DENY_LEAVE (decider must differ from requester)", roles: [DeanOfStudents], code: 200, input: [decision, rationale], output: LeaveDecision, side_effects: ["GRANT_LEAVE -> case ON_LEAVE, student LEAVE_OF_ABSENCE, plan SUSPENDED; DENY_LEAVE -> case PLAN_ACTIVE + fresh check-in"] }

  # --- Re-entry evaluations ---
  - { method: POST, path: "/bit/reentry-evaluations", description: "Petition re-entry for an ON_LEAVE case (OCC-guarded)", roles: [CaseManager], code: 201, input: [case_id, expected_case_version, petition_summary], output: ReentryEvaluation, side_effects: ["evaluation PENDING with leave_decision_id = active GRANTED decision; case -> REENTRY_REVIEW; increments CareCase.version by 1"] }
  - { method: GET, path: "/bit/reentry-evaluations/{id}", description: "Get a re-entry evaluation", roles: [BITChair, DeanOfStudents, CaseManager, PrivacyOfficer], code: 200, input: [], output: ReentryEvaluation, side_effects: [] }
  - { method: GET, path: "/bit/reentry-evaluations", description: "List/filter re-entry evaluations", roles: [BITChair, DeanOfStudents, CaseManager, PrivacyOfficer], code: 200, input: ["case_id?", "petitioned_by?", "decided_by?", "leave_decision_id?", "status?", "limit?", "offset?"], output: "ReentryEvaluation[]", side_effects: [] }
  - { method: POST, path: "/bit/reentry-evaluations/{id}/decide", description: "Dean decides re-entry (decider must differ from the original leave decider)", roles: [DeanOfStudents], code: 200, input: [outcome, "conditions?", rationale], output: ReentryEvaluation, side_effects: ["APPROVED_WITH_CONDITIONS -> student ENROLLED, plan re-ACTIVE with reentry_conditions, case PLAN_ACTIVE, check-in due now+7d; DENIED -> case ON_LEAVE"] }

  # --- Follow-up check-ins ---
  - { method: GET, path: "/bit/follow-up-checkins/{id}", description: "Get a check-in", roles: [CaseManager, BITChair, DeanOfStudents, PrivacyOfficer], code: 200, input: [], output: FollowUpCheckin, side_effects: [] }
  - { method: GET, path: "/bit/follow-up-checkins", description: "List/filter check-ins", roles: [CaseManager, BITChair, DeanOfStudents, PrivacyOfficer], code: 200, input: ["case_id?", "status?", "limit?", "offset?"], output: "FollowUpCheckin[]", side_effects: [] }
  - { method: POST, path: "/bit/follow-up-checkins/{id}/complete", description: "Assigned case manager completes a SCHEDULED check-in (early completion allowed)", roles: [CaseManager], code: 200, input: [outcome, note], output: FollowUpCheckin, side_effects: ["STABLE -> consecutive+1 and successor scheduled; ESCALATED -> case TRIAGED, plan SUPERSEDED, no successor"] }

  # --- Disclosure grants ---
  - { method: POST, path: "/bit/disclosure-grants", description: "Request cross-office disclosure for a case (half-open window, no overlap per case+office)", roles: [CaseManager], code: 201, input: [case_id, to_office, scope, effective_from, expires_at, purpose], output: DisclosureGrant, side_effects: ["grant REQUESTED"] }
  - { method: GET, path: "/bit/disclosure-grants/{id}", description: "Get a grant", roles: [CaseManager, BITChair, PrivacyOfficer, DeanOfStudents, CounselingEvaluator], code: 200, input: [], output: DisclosureGrant, side_effects: [] }
  - { method: GET, path: "/bit/disclosure-grants", description: "List/filter grants", roles: [CaseManager, BITChair, PrivacyOfficer, DeanOfStudents, CounselingEvaluator], code: 200, input: ["case_id?", "requested_by?", "approved_by?", "to_office?", "status?", "limit?", "offset?"], output: "DisclosureGrant[]", side_effects: [] }
  - { method: POST, path: "/bit/disclosure-grants/{id}/approve", description: "PrivacyOfficer approves a requested grant", roles: [PrivacyOfficer], code: 200, input: [], output: DisclosureGrant, side_effects: ["grant -> APPROVED; approved_by set"] }
  - { method: POST, path: "/bit/disclosure-grants/{id}/deny", description: "PrivacyOfficer denies a requested grant", roles: [PrivacyOfficer], code: 200, input: [rationale], output: DisclosureGrant, side_effects: ["grant -> DENIED"] }
  - { method: POST, path: "/bit/disclosure-grants/{id}/revoke", description: "PrivacyOfficer revokes an approved grant", roles: [PrivacyOfficer], code: 200, input: [], output: DisclosureGrant, side_effects: ["grant -> REVOKED"] }

  # --- Trend reports ---
  - { method: POST, path: "/bit/trend-reports", description: "Generate an aggregate trend report for a term window (computed immediately)", roles: [SystemAdmin], code: 201, input: [term_code, window_start, window_end, variant], output: TrendReport, side_effects: ["compute trend_report_metrics + trend_category_distribution"] }
  - { method: GET, path: "/bit/trend-reports/{id}", description: "Get a trend report", roles: [Reporter, CaseManager, BITChair, CounselingEvaluator, DeanOfStudents, PrivacyOfficer, SystemAdmin], code: 200, input: [], output: TrendReport, side_effects: [] }

  # --- Test-driving clock ---
  - method: POST
    path: "/bit/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601 UTC). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Advancing the clock sweeps: SCHEDULED assessments with now > due_at -> EXPIRED (with LEAVE_DECISION cascade); SCHEDULED check-ins with now > due_at + 1 day -> MISSED (successor scheduled); APPROVED grants with now >= expires_at -> EXPIRED"
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["clock advances; expiry sweeps applied"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/invalid, or entity-backed role id does not resolve to a StaffMember" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for endpoint, or ownership rule violated (Reporter reading another's report, CaseManager submitting another's draft)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK target does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, malformed value, invalid enum member, empty objectives array" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match the CareCase current version (OCC)" }
  - { id: ERR_REPORT_NOT_UNDER_REVIEW, http: 409, condition: "accept/close-no-action requires UNDER_REVIEW; start-review requires SUBMITTED" }
  - { id: ERR_CASE_NOT_TRIAGEABLE, http: 409, condition: "Scoring requires case INTAKE or TRIAGED; plan creation requires TRIAGED or PLAN_ACTIVE" }
  - { id: ERR_SCORING_MODE_INVALID, http: 400, condition: "INITIAL when a prior scoring exists, or REASSESSMENT with no prior scoring" }
  - { id: ERR_RUBRIC_SCORE_OUT_OF_RANGE, http: 400, condition: "A rubric dimension is not an integer in 0..25" }
  - { id: ERR_OPEN_PLAN_EXISTS, http: 409, condition: "A DRAFT or PENDING_APPROVAL plan already exists for the case" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "submit requires plan DRAFT" }
  - { id: ERR_PLAN_NOT_PENDING_APPROVAL, http: 409, condition: "approve/return requires plan PENDING_APPROVAL" }
  - { id: ERR_CASE_STATE_BLOCKS_PLAN_APPROVAL, http: 409, condition: "approve requires the case in PLAN_DRAFTING or PLAN_ACTIVE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same person attempted two segregated steps (approve own draft; record outcome of own order; decide own leave request; re-entry decided by original leave decider)" }
  - { id: ERR_NOT_ASSIGNED_CASE_MANAGER, http: 403, condition: "Check-in completion by someone other than the case's assigned_case_manager_id" }
  - { id: ERR_CASE_NOT_PLAN_ACTIVE, http: 409, condition: "Operation requires case PLAN_ACTIVE (check-in completion, assessment order, closure)" }
  - { id: ERR_CASE_NOT_MANDATED_ASSESSMENT, http: 409, condition: "record-outcome requires the case in MANDATED_ASSESSMENT" }
  - { id: ERR_CASE_NOT_ON_LEAVE, http: 409, condition: "Re-entry petition requires case ON_LEAVE" }
  - { id: ERR_REENTRY_ALREADY_PENDING, http: 409, condition: "A PENDING ReentryEvaluation already exists for the case" }
  - { id: ERR_CONDITIONS_REQUIRED, http: 400, condition: "APPROVED_WITH_CONDITIONS requires a non-empty conditions array" }
  - { id: ERR_CASE_NOT_CLOSABLE, http: 409, condition: "Closure eligibility aggregate fails (stability count, tier, open dependencies)" }
  - { id: ERR_STUDENT_NOT_ACTIVE, http: 409, condition: "Concern report submitted for a WITHDRAWN student" }
  - { id: ERR_PRIVACY_SCOPE_INSUFFICIENT, http: 403, condition: "Caller has no role-based access and no APPROVED unexpired DisclosureGrant for their office on this case" }
  - { id: ERR_DISCLOSURE_WINDOW_INVALID, http: 400, condition: "expires_at <= effective_from" }
  - { id: ERR_DISCLOSURE_WINDOW_OVERLAP, http: 409, condition: "Half-open [effective_from, expires_at) intersects an existing REQUESTED/APPROVED grant for the same (case_id, to_office)" }
  - { id: ERR_GRANT_NOT_REQUESTED, http: 409, condition: "approve/deny requires grant REQUESTED" }
  - { id: ERR_GRANT_NOT_APPROVED, http: 409, condition: "revoke requires grant APPROVED" }
  - { id: ERR_ASSESSMENT_ALREADY_PENDING, http: 409, condition: "Case slot occupied: a SCHEDULED assessment's closed interval [ordered_at, due_at] covers now" }
  - { id: ERR_ASSESSMENT_DUE_WINDOW_VIOLATION, http: 422, condition: "due_at must be > now and <= now + 14 days" }
  - { id: ERR_EVALUATOR_SAME_AS_ORDERER, http: 400, condition: "evaluator_id equals the ordering BITChair's X-User-ID" }
  - { id: ERR_ASSESSMENT_NOT_SCHEDULED, http: 409, condition: "record-outcome requires assessment SCHEDULED" }
  - { id: ERR_DECISION_NOT_PENDING, http: 409, condition: "decide requires LeaveDecision/ReentryEvaluation PENDING" }
  - { id: ERR_CHECKIN_NOT_SCHEDULED, http: 409, condition: "complete requires check-in SCHEDULED" }
  - { id: ERR_TREND_WINDOW_INVALID, http: 400, condition: "window_end <= window_start" }
  - { id: ERR_RELATED_REPORT_STUDENT_MISMATCH, http: 422, condition: "related_report_id references a report for a different student" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Reporter
    description: "Faculty or peer staff member submitting concern reports; reads own reports only"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /bit/concern-reports"
    shared_operations:
      - "GET /bit/concern-reports/{id} (own reports only)"
      - "GET /bit/care-cases/{id} (only with an approved disclosure grant)"
      - "GET /bit/students/{id}, GET /bit/staff/{id}, GET /bit/trend-reports/{id}"
  - name: CaseManager
    description: "BIT case manager: drafts plans, petitions re-entry, completes check-ins, requests disclosures"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /bit/intervention-plans, POST /bit/intervention-plans/{id}/submit (own drafts)"
      - "POST /bit/reentry-evaluations"
      - "POST /bit/follow-up-checkins/{id}/complete (assigned cases only)"
      - "POST /bit/disclosure-grants"
    shared_operations:
      - "GET lists and reads for cases, plans, scorings, assessments, decisions, evaluations, check-ins, grants"
  - name: BITChair
    description: "BIT chair: triage, risk scoring, plan approval, mandated assessment orders, case closure"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /bit/concern-reports/{id}/start-review | /accept | /close-no-action"
      - "POST /bit/risk-scorings"
      - "POST /bit/intervention-plans/{id}/approve | /return (never own drafts — segregation)"
      - "POST /bit/mandated-assessments"
      - "POST /bit/care-cases/{id}/assign-manager | /close"
    shared_operations:
      - "GET reads across the domain (full privacy access)"
  - name: CounselingEvaluator
    description: "Counseling center evaluator recording mandated assessment outcomes"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /bit/mandated-assessments/{id}/record-outcome (assigned evaluator, != orderer)"
    shared_operations:
      - "GET /bit/mandated-assessments*, GET /bit/care-cases* (scoped)"
  - name: DeanOfStudents
    description: "Dean deciding leave-of-absence and re-entry (segregated from requesters)"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /bit/leave-decisions/{id}/decide"
      - "POST /bit/reentry-evaluations/{id}/decide"
    shared_operations:
      - "GET reads across the domain (full privacy access)"
  - name: PrivacyOfficer
    description: "Approves, denies, and revokes cross-office disclosure grants"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /bit/disclosure-grants/{id}/approve | /deny | /revoke"
    shared_operations:
      - "GET reads across the domain (full privacy access)"
  - name: SystemAdmin
    description: "Opaque platform operator: roster/student administration, term trend reports, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /bit/students, PATCH /bit/students/{id}"
      - "POST /bit/staff"
      - "POST /bit/trend-reports"
      - "POST /bit/_clock/set_current_utc"
    shared_operations:
      - "GET /bit/students/{id}, GET /bit/staff/{id}, GET /bit/trend-reports/{id}"
