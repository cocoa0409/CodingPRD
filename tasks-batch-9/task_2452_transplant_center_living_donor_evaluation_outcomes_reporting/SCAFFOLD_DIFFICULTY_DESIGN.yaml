      - TransplantProgram.${prog_id}.donor_fund_committed_cents == 550000
      - TransplantProgram.${prog_id}.donor_fund_remaining_cents == 4450000
- rule_id: combinatorial_formula
  instances:
  - name: cooling_off_window_nested_max_ceil_on_re_disclosure
    grounds:
    - calculations.cooling_off_window
    - calculations.cooling_off_window.constants.NON_DIRECTED_EXTRA_DAYS
    - calculations.cooling_off_window.constants.MIN_RE_DISCLOSURE_DAYS
    - state_machines.DonorCandidate.advocacy.ATTESTED_to_DISCLOSED
    - entities.DonorCandidate.fields.cooling_off_ends_at
    - entities.DonorCandidate.fields.disclosure_sequence
    distinguishing_aspect: 'Mode (a): a NESTED max/ceil over three independent inputs (program.cooling_off_days,
      the non-directed flag, and disclosure_sequence) - max(MIN_RE_DISCLOSURE_DAYS, ceil((cooling_off_days
      + NON_DIRECTED_EXTRA_DAYS) / 2)). Neither the outer max nor the inner ceil can be dropped without
      changing the answer, and the base the ceil divides is itself conditional.'
    test_recipe:
      setup:
      - TransplantProgram with cooling_off_days 5 (NOT the default 7), so the non-directed base is 5 +
        NON_DIRECTED_EXTRA_DAYS 7 = 12 and the halved re-disclosure branch lands on a non-integer 6.0
        that still needs ceil
      - A non-directed donor candidate (intended_recipient_id null) with both clinical domains CLEARED
        at 0 risk points
      - First consent disclosure at the default clock 2026-08-01T00:00:00Z -> disclosure_sequence 1 ->
