              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-YRD", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 20.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 20.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 20.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
          trigger:
            - call: "POST /mill/material-allocations"
              payload: { lot_id: "${lot_id}", order_line_id: "${line_id}", yards: 4.5 }
              as: ProductionPlanner
              captures: { alloc_id: $.data.id }
            - call: "GET /mill/material-lots/${lot_id}"
              as: ProductionPlanner
              captures: { lot_alloc_mid: $.data.allocated_yards, lot_avail_mid: $.data.available_yards }
            - call: "POST /mill/material-allocations/${alloc_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "GET /mill/material-lots/${lot_id}"
              as: ProductionPlanner
              captures: { lot_alloc_end: $.data.allocated_yards, lot_avail_end: $.data.available_yards }
          assert:
            - "After allocation: lot_alloc_mid == 4.5 and lot_avail_mid == 15.5; OrderLine.${line_id}.allocated_yards == 4.5, shortfall_yards == 9.831, status MATERIAL_SHORTFALL"
            - "After release: lot_alloc_end == 0.0 and lot_avail_end == 20.0; OrderLine.${line_id}.allocated_yards == 0.0, shortfall_yards == 14.331"
            - "Invariant held at both observations: allocated_yards + available_yards == usable_yards (20.0)"
