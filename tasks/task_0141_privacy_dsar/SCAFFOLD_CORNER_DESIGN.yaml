# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — Privacy DSAR
# Walks references/claim-extraction-guide.md sections against §1.1-§1.7.
# Sections/claim_types are taken verbatim from the guide. Corners already
# covered by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_dsar_request_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.DsarRequest
          - endpoints[POST /dsar-requests]
        distinguishing_aspect: "POST /dsar-requests with all required fields returns 201, status=PENDING_VERIFICATION, version=1, server-minted id, and a computed deadline_at."
        test_recipe:
          setup:
            - "A GDPR controller and a subject exist."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC1", jurisdiction: "GDPR", dpo_email: "dpo@ec1.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec1@x.example", full_name: "EC1", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id", st: "$.data.status", ver: "$.data.version" }
          assert:
            - "POST /dsar-requests returns code 201"
            - "DsarRequest.${req_id}.status == PENDING_VERIFICATION"
            - "DsarRequest.${req_id}.version == 1"
            - "DsarRequest.${req_id}.deadline_at == 2026-02-04T09:00:00Z"

      - name: get_dsar_request_not_found_uuid
        claim_type: Not Found
        grounds:
          - entities.DsarRequest
          - endpoints[GET /dsar-requests/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /dsar-requests/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /dsar-requests/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "GET /dsar-requests/00000000-0000-4000-8000-000000000000 returns code 404"
            - "response .data.error_id == ERR_NOT_FOUND"

      - name: create_dsar_request_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.DsarRequest.fields.request_type
          - endpoints[POST /dsar-requests]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /dsar-requests omitting request_type returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A controller and subject exist."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC2", jurisdiction: "GDPR", dpo_email: "dpo@ec2.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec2@x.example", full_name: "EC2", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /dsar-requests returns code 400"
            - "response .data.error_id == ERR_INVALID_REQUEST"

      - name: create_dsar_request_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.DsarRequest.fields.request_type
          - endpoints[POST /dsar-requests]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /dsar-requests with request_type='RECTIFICATION' (not in ACCESS|DELETION|OPT_OUT) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A controller and subject exist."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC3", jurisdiction: "GDPR", dpo_email: "dpo@ec3.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec3@x.example", full_name: "EC3", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "RECTIFICATION", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /dsar-requests returns code 400"
            - "response .data.error_id == ERR_INVALID_REQUEST"

      - name: processor_sla_ack_hours_default_applied
        claim_type: Defaults
        grounds:
          - entities.Processor.fields.sla_ack_hours
          - endpoints[POST /processors]
        distinguishing_aspect: "POST /processors omitting sla_ack_hours applies default 72."
        test_recipe:
          setup:
            - "A controller exists."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC4", jurisdiction: "GDPR", dpo_email: "dpo@ec4.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
          trigger:
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "DefProc", notify_email: "dp@x.example" }
              as: PrivacyOfficer
              captures: { proc_id: "$.data.id", sla: "$.data.sla_ack_hours" }
          assert:
            - "Processor.${proc_id}.sla_ack_hours == 72"
            - "Processor.${proc_id}.status == ACTIVE"

      - name: finding_record_count_zero_rejected_boundary
        claim_type: Type Constraints
        grounds:
          - entities.DiscoveryFinding.fields.record_count
          - endpoints[POST /dsar-requests/{id}/findings]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /dsar-requests/{id}/findings with record_count=0 violates the >=1 constraint -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A request in DISCOVERY and a processor exist."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC5", jurisdiction: "GDPR", dpo_email: "dpo@ec5.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "EP5", notify_email: "ep5@x.example" }
              as: PrivacyOfficer
              captures: { proc_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec5@x.example", full_name: "EC5", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id" }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-ec5" }
              as: IntakeAgent
              as_user_id: "intake-ec5"
          trigger:
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "IDENTITY", record_count: 0, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /dsar-requests/${req_id}/findings returns code 400"
            - "response .data.error_id == ERR_INVALID_REQUEST"

      - name: dsar_request_list_filtered_by_controller_paginated
        claim_type: Listing
        grounds:
          - entities.DsarRequest
          - endpoints[GET /dsar-requests]
        distinguishing_aspect: "GET /dsar-requests?controller_id=X returns a paginated array of that controller's requests with total_count and has_more present."
        test_recipe:
          setup:
            - "One controller with one ACCESS request."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC6", jurisdiction: "GDPR", dpo_email: "dpo@ec6.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec6@x.example", full_name: "EC6", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id" }
          trigger:
            - call: "GET /dsar-requests"
              payload: { controller_id: "${ctrl_id}" }
              as: PrivacyOfficer
          assert:
            - "GET /dsar-requests returns response_type array"
            - "meta.total_count == 1"
            - "every returned DsarRequest.controller_id == ${ctrl_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_finding_from_dismissed_terminal_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DiscoveryFinding.PENDING_to_DISMISSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming a DISMISSED finding (a terminal-for-confirm state) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup:
            - "A request in DISCOVERY with one finding already DISMISSED."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC7", jurisdiction: "GDPR", dpo_email: "dpo@ec7.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "EP7", notify_email: "ep7@x.example" }
              as: PrivacyOfficer
              captures: { proc_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec7@x.example", full_name: "EC7", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id" }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-ec7" }
              as: IntakeAgent
              as_user_id: "intake-ec7"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "CONTACT", record_count: 1, confidence: "PROBABLE" }
              as: PrivacyOfficer
              captures: { find_id: "$.data.id" }
            - call: "POST /findings/${find_id}/dismiss"
              as: PrivacyOfficer
          trigger:
            - call: "POST /findings/${find_id}/confirm"
              as: PrivacyOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /findings/${find_id}/confirm returns code 409"
            - "response .data.error_id == ERR_INVALID_STATE"
            - "DiscoveryFinding.${find_id}.state == DISMISSED"

      - name: new_dsar_request_starts_in_pending_verification
        claim_type: Initial State
        grounds:
          - state_machines.DsarRequest
          - entities.DsarRequest.fields.status
        distinguishing_aspect: "A freshly created DsarRequest initializes to status=PENDING_VERIFICATION and identity_attempts=0."
        test_recipe:
          setup:
            - "A controller and subject exist."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC8", jurisdiction: "GDPR", dpo_email: "dpo@ec8.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec8@x.example", full_name: "EC8", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "DELETION", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id", st: "$.data.status", att: "$.data.identity_attempts" }
          assert:
            - "DsarRequest.${req_id}.status == PENDING_VERIFICATION"
            - "DsarRequest.${req_id}.identity_attempts == 0"

      - name: dispatch_fulfillment_from_pending_verification_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DsarRequest.UNDER_REVIEW_to_FULFILLING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling dispatch-fulfillment while the request is still PENDING_VERIFICATION returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A freshly intaken request still PENDING_VERIFICATION (version 1)."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC9", jurisdiction: "GDPR", dpo_email: "dpo@ec9.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec9@x.example", full_name: "EC9", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
          trigger:
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v}" }
              as: PrivacyOfficer
              as_user_id: "officer-ec9"
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /dsar-requests/${req_id}/dispatch-fulfillment returns code 409"
            - "response .data.error_id == ERR_INVALID_STATE"

      - name: acknowledge_overdue_notification_still_allowed
        claim_type: Valid Transition
        grounds:
          - state_machines.ProcessorNotification.SENT_to_OVERDUE
          - state_machines.ProcessorNotification.SENT_to_ACKNOWLEDGED
        distinguishing_aspect: "A notification that has gone OVERDUE can still transition to ACKNOWLEDGED (precondition allows SENT or OVERDUE)."
        test_recipe:
          setup:
            - "An item dispatched with sla_ack_hours=24; clock advanced past ack_deadline so the notification is OVERDUE."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC10", jurisdiction: "GDPR", dpo_email: "dpo@ec10.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "EP10", notify_email: "ep10@x.example", sla_ack_hours: 24 }
              as: PrivacyOfficer
              captures: { proc_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec10@x.example", full_name: "EC10", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T10:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id" }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-ec10" }
              as: IntakeAgent
              as_user_id: "intake-ec10"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "IDENTITY", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_id: "$.data.id" }
            - call: "POST /findings/${find_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /dsar-requests/${req_id}/complete-discovery"
              as: PrivacyOfficer
              captures: { req_v_review: "$.data.version" }
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v_review}" }
              as: PrivacyOfficer
              as_user_id: "officer-ec10"
            - call: "GET /fulfillment-items"
              payload: { discovery_finding_id: "${find_id}" }
              as: PrivacyOfficer
              captures: { item_id: "$.data[0].id", item_v: "$.data[0].version" }
            - call: "POST /fulfillment-items/${item_id}/dispatch"
              payload: { expected_item_version: "${item_v}" }
              as: FulfillmentWorker
            - call: "GET /fulfillment-items/${item_id}/notifications"
              as: FulfillmentWorker
              captures: { notif_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-11T11:00:00Z" }
              as: PrivacyOfficer
          trigger:
            - call: "POST /processor-notifications/${notif_id}/acknowledge"
              as: ProcessorAgent
              captures: { nstate: "$.data.state" }
          assert:
            - "ProcessorNotification.${notif_id}.state == ACKNOWLEDGED"

      - name: legal_hold_lift_then_unblock_item_compensation
        claim_type: Compensation
        grounds:
          - state_machines.FulfillmentItem.BLOCKED_to_QUEUED
          - state_machines.LegalHold.ACTIVE_to_LIFTED
          - entities.FulfillmentItem.fields.state
        distinguishing_aspect: "A BLOCKED erasure item returns to QUEUED via unblock only after the covering LegalHold is LIFTED; the compensation reverses the dispatch-time block."
        test_recipe:
          setup:
            - "A DELETION request in FULFILLING with one ERASE item BLOCKED by an ACTIVE LegalHold on IDENTITY; the hold is then lifted."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC11", jurisdiction: "GDPR", dpo_email: "dpo@ec11.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "EP11", notify_email: "ep11@x.example" }
              as: PrivacyOfficer
              captures: { proc_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec11@x.example", full_name: "EC11", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
            - call: "POST /legal-holds"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", matter_reference: "M-EC11", data_categories: ["IDENTITY"] }
              as: PrivacyOfficer
              captures: { hold_id: "$.data.id" }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "DELETION", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id" }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-ec11" }
              as: IntakeAgent
              as_user_id: "intake-ec11"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "IDENTITY", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_id: "$.data.id" }
            - call: "POST /findings/${find_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /dsar-requests/${req_id}/complete-discovery"
              as: PrivacyOfficer
              captures: { req_v_review: "$.data.version" }
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v_review}" }
              as: PrivacyOfficer
              as_user_id: "officer-ec11"
            - call: "GET /fulfillment-items"
              payload: { discovery_finding_id: "${find_id}" }
              as: PrivacyOfficer
              captures: { item_id: "$.data[0].id" }
            - call: "POST /legal-holds/${hold_id}/lift"
              as: PrivacyOfficer
          trigger:
            - call: "POST /fulfillment-items/${item_id}/unblock"
              as: PrivacyOfficer
              captures: { istate: "$.data.state" }
          assert:
            - "FulfillmentItem.${item_id}.state == QUEUED"
            - "LegalHold.${hold_id}.state == LIFTED"

      - name: unblock_item_while_hold_active_returns_legal_hold_active
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FulfillmentItem.BLOCKED_to_QUEUED
          - validations[priority=9]
          - errors[ERR_LEGAL_HOLD_ACTIVE]
        distinguishing_aspect: "Unblocking a BLOCKED erasure item while the covering LegalHold is still ACTIVE returns ERR_LEGAL_HOLD_ACTIVE (409); item stays BLOCKED."
        test_recipe:
          setup:
            - "A DELETION request in FULFILLING with one ERASE item BLOCKED by an ACTIVE LegalHold on IDENTITY (hold NOT lifted)."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EC12", jurisdiction: "GDPR", dpo_email: "dpo@ec12.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "EP12", notify_email: "ep12@x.example" }
              as: PrivacyOfficer
              captures: { proc_id: "$.data.id" }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "ec12@x.example", full_name: "EC12", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: "$.data.id" }
            - call: "POST /legal-holds"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", matter_reference: "M-EC12", data_categories: ["IDENTITY"] }
              as: PrivacyOfficer
              captures: { hold_id: "$.data.id" }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "DELETION", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: "$.data.id" }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-ec12" }
              as: IntakeAgent
              as_user_id: "intake-ec12"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "IDENTITY", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_id: "$.data.id" }
            - call: "POST /findings/${find_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /dsar-requests/${req_id}/complete-discovery"
              as: PrivacyOfficer
              captures: { req_v_review: "$.data.version" }
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v_review}" }
              as: PrivacyOfficer
              as_user_id: "officer-ec12"
            - call: "GET /fulfillment-items"
