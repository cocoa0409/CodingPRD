          media_notice_required flips to true at the boundary itself.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one DISCOVERED BreachIncident, breach_scope CHD_ONLY, protection_state UNPROTECTED, affected_consumer_count 900 and affected_state_max_count exactly 500"
