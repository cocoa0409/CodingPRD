    roles: [LmsAdmin, Registrar, Instructor]
    code: 200
    input: ["limit?", "offset?", "term_id?", "owner_person_id?", "merged_into_shell_id?", "shell_type?", "provisioning_state?"]
    output: CourseShell[]
    side_effects: []

  - method: GET
    path: "/course-shells/{id}"
