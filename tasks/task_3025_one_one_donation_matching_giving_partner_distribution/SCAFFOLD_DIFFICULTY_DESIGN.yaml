              payload: { season_code: "2026-Q3", max_allocatable_units: 4000, effective_from: "2026-09-30T23:59:59Z", effective_to: "2026-12-01T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the overlapping profile is refused with 409 ERR_CAPACITY_PROFILE_AMBIGUOUS"
            - "POST /impact-program/giving-partners/${p_id}/capacity-profiles with effective_from exactly 2026-10-01T00:00:00Z is accepted, because the earlier window is closed above and adjacency is not overlap"
            - "after the adjacent profile is accepted, exactly two PartnerCapacityProfile rows exist for the partner and season, and only one is selectable at any clock position"
            - "with the clock at 2026-10-01T00:00:00Z the selected profile is the later one, whose max_allocatable_units is 4000"

      - name: allocation_reversal_reservations_only_overlap_rows_thirty_days_apart
        grounds:
          - state_machines.DonationAllocation.RECEIVED_to_REVERSED
          - entities.PartnerCapacityProfile.fields.reserved_units
          - errors[ERR_ALLOCATION_NOT_REVERSIBLE]
        distinguishing_aspect: "The reversal rule carries a thirty-day receipt buffer that the capacity-profile rule does not: a reversal whose receipt is 29 days old is accepted while an identical reversal 31 days later is refused, so the two overlap rules on two different resource entities disagree on adjacency and on buffers."
