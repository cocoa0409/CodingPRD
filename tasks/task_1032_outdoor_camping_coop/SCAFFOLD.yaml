    roles: [Member, StoreStaff]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["payment_status->REFUNDED, fulfillment_status->RETURNED", "Member.store_credit_cents += total_cents", "Member.loyalty -= loyalty_points_earned", "Member.lifetime_eligible_spend_cents -= total_cents"]

  # ------------------------------- Trade-Ins
  - method: POST
    path: "/coop/trade-ins"
    description: "Submit a used-gear trade-in"
    roles: [Member]
    code: 201
    input: [member_id, gear_sku_id, described_condition, payout_method]
    output: TradeIn
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/coop/trade-ins/{id}"
    description: "Get a trade-in by id"
