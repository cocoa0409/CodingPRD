      - name: psc_orderline_collect_requires_appointment_checked_in
        grounds:
          - state_machines.OrderLine.ORDERED_to_COLLECTED
          - state_machines.Appointment.BOOKED_to_CHECKED_IN
          - errors[ERR_APPOINTMENT_NOT_CHECKED_IN]
          - entities.Appointment.fields.status
        distinguishing_aspect: |
          Different entity pair OrderLine→Appointment: a PSC order line cannot be collected while
