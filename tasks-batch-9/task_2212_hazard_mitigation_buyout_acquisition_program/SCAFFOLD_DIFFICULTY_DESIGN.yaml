            - call: "POST /parcels/${p1}/purchase-offers"
              payload: { parcel_id: "${p1}", source_appraisal_id: "${ap1r}", offer_basis: "PRE_EVENT_FMV", expected_parcel_version: "${p1v}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { of1: $.data.id }
          trigger:
            - call: "POST /dob-records/${dob_sba1}/reverse"
              payload: { dob_record_id: "${dob_sba1}", reversal_reason: "SBA loan was disbursed for contents, not structure repair" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /parcels/${p1}"
              payload: { parcel_id: "${p1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1v2: $.data.version }
            - call: "POST /parcels/${p1}/purchase-offers"
              payload: { parcel_id: "${p1}", source_appraisal_id: "${ap1r}", offer_basis: "PRE_EVENT_FMV", expected_parcel_version: "${p1v2}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { of2: $.data.id }
          assert:
            - "before the first trigger call Parcel.${p1}.dob_deduction_total_cents == 1500002"
            - "before the first trigger call PurchaseOffer.${of1}.dob_deduction_cents == 1500002"
            - "before the first trigger call PurchaseOffer.${of1}.net_offer_cents == 19794998"
            - "the first trigger call returns 200"
            - "DuplicationOfBenefitsRecord.${dob_sba1}.status == REVERSED"
            - "DuplicationOfBenefitsRecord.${dob_sba1}.deductible_cents == 250001"
            - "Parcel.${p1}.dob_deduction_total_cents == 1250001 after the first trigger call"
            - "PurchaseOffer.${of1}.dob_deduction_cents == 1500002 after the first trigger call"
            - "PurchaseOffer.${of1}.net_offer_cents == 19794998 after the first trigger call"
            - "the third trigger call returns 201"
            - "PurchaseOffer.${of2}.dob_deduction_cents == 1250001"
            - "PurchaseOffer.${of2}.pre_incentive_net_cents == 18749999"
            - "PurchaseOffer.${of2}.incentive_cents == 1312500"
            - "PurchaseOffer.${of2}.net_offer_cents == 20062499"
            - "PurchaseOffer.${of1}.status == SUPERSEDED"
            - "PurchaseOffer.${of1}.superseded_by_offer_id == ${of2}"
