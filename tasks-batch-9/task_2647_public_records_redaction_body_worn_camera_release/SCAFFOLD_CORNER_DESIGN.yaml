      - name: open_request_locks_the_recording_against_destruction
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_15
          - errors.ERR_RETENTION_HOLD_ACTIVE
          - entities.VideoAsset.fields.retention_locked
          - endpoints.POST_/records/responsive-records/{id}/inclusion
        distinguishing_aspect: |
          retention_locked is set by an open request as well as by a litigation hold, so a
          past-due recording attached to a live request is refused destruction with
          ERR_RETENTION_HOLD_ACTIVE while no LitigationHold exists at all, and ruling the
          record EXCLUDED releases the lock in the same flow.
        test_recipe:
          setup:
            - "One 10-minute ROUTINE recording whose scheduled_purge_at is 2026-07-01T00:00:00Z, i.e. already past due against the 2026-08-01T00:00:00Z clock."
            - "No LitigationHold anywhere in the database, so disposition_state stays SCHEDULED throughout."
            - "One clarified request with that recording attached as a CANDIDATE ResponsiveRecord, which sets retention_locked true."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0646", device_serial: "AXON-0646", officer_badge: "B-1140", recorded_start_at: "2026-01-15T14:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "NON_EVIDENTIARY_180D", scheduled_purge_at: "2026-07-01T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0646", requested_date_from: "2026-01-15T00:00:00Z", requested_date_to: "2026-01-16T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0646" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Single unit", requested_date_from: "2026-01-15T00:00:00Z", requested_date_to: "2026-01-15T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
          trigger:
            - { call: "POST /records/video-assets/${asset_id}/purge", payload: { destruction_note: "Retention schedule sweep" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_locked: $.data.error_id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "EXCLUDED" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/video-assets/${asset_id}/purge", payload: { destruction_note: "Retention schedule sweep, second pass" }, as: RecordsSupervisor, as_user_id: "supv-1" }
          assert:
            - "first purge: HTTP 409 and ${e_locked} == ERR_RETENTION_HOLD_ACTIVE (not ERR_PURGE_NOT_DUE, since the schedule matured on 2026-07-01, and not ERR_ASSET_STATE_INVALID, since the asset is SCHEDULED)"
            - "after the refusal: VideoAsset.${asset_id}.disposition_state == SCHEDULED, retention_locked == true and suspended_by_hold_id == null"
            - "inclusion response: HTTP 200 and ResponsiveRecord.${rec_id}.inclusion_status == EXCLUDED"
            - "second purge: HTTP 200 and VideoAsset.${asset_id}.disposition_state == PURGED and retention_locked == false"
            - "PublicRecordsRequest.${req_id}.processing_status == SCOPING and responsive_record_count == 0 (the EXCLUDED record is not counted)"
      - name: task_cannot_cite_a_claim_from_a_different_record
