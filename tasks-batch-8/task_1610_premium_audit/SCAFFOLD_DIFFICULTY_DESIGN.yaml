          setup:
            - "WC policy WC-1100A: term 2026-01-01..2026-07-31 -> appointment window ends 2026-09-29; WC policy WC-1100B: term 2025-12-01..2026-05-31 -> appointment window ends 2026-07-30; both PHYSICAL (estimated premium 2000000 each), both assigned to the same auditor"
