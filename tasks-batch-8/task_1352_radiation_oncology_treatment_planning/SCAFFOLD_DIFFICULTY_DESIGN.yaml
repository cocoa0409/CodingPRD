            - { call: "GET /oncology/billing-claims/${clm}", payload: {}, as: BillingCoordinator, as_user_id: "bill_a", captures: { cl_v: $.data.version } }
            - { call: "POST /oncology/billing-claims/${clm}/finalize", payload: { expected_claim_version: "${cl_v}" }, as: BillingCoordinator, as_user_id: "bill_a" }
