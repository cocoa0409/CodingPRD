# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Cashback & Receipt-Rebate Rewards — breadth probe over §1.1-§1.7
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_merchant_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Merchant, endpoints]
        distinguishing_aspect: "POST /merchants with required fields returns 201; status defaults to ACTIVE; online/instore rates echoed."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /merchants"
              payload: { name: "Acme", online_rate_bps: 500, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Merchant.${m_id}.status == ACTIVE"
            - "Merchant.${m_id}.online_rate_bps == 500"
            - "Merchant.${m_id}.attribution_window_hours == 168"
            - "Merchant.${m_id}.double_dip_allowed == false"

      - name: get_merchant_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "entities.Merchant"
        distinguishing_aspect: "GET /merchants/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /merchants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_merchant_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - "errors[ERR_VALIDATION]"
          - "entities.Merchant.fields.online_rate_bps"
        distinguishing_aspect: "POST /merchants without online_rate_bps -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /merchants"
              payload: { name: "Acme", instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: list_merchants_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Merchant]
        distinguishing_aspect: "GET /merchants returns a paginated array envelope with total_count and has_more after two merchants created."
        test_recipe:
          setup: ["Two merchants created."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "A", online_rate_bps: 100, instore_rate_bps: 100 }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { name: "B", online_rate_bps: 200, instore_rate_bps: 200 }
              as: PlatformAdmin
          trigger:
            - call: "GET /merchants"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response.response_type == array"
            - "response.meta has total_count == 2"
            - "response.meta has_more == true"

      - name: reward_claim_amount_is_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.RewardClaim.fields.amount_cents, calculations.reward_amount_computation]
        distinguishing_aspect: "amount_cents is computed at creation from the formula; it is not a client input field (POST /reward-claims input has no amount_cents), so it cannot be set by the caller."
        test_recipe:
          setup: ["Merchant online_rate_bps=1000; a member with a click."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ci@x.com" }
              as: PlatformAdmin
              captures: { mi_id: $.data.id }
            - call: "POST /clickthroughs"
              payload: { member_id: "${mi_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mi_id}"
              captures: { click_id: $.data.id }
          trigger:
            - call: "POST /reward-claims"
              payload: { member_id: "${mi_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 5000 }
              as: Member
              as_user_id: "${mi_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "RewardClaim.${claim_id}.amount_cents == 500"
            - "RewardClaim.${claim_id}.attribution == ONLINE"

      - name: clickthrough_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ClickThrough]
        distinguishing_aspect: "ClickThrough has common_fields:false; the create response carries id and created_at but no version field (append-only event)."
        test_recipe:
          setup: ["Merchant + member exist."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "cc@x.com" }
              as: PlatformAdmin
              captures: { mc_id: $.data.id }
          trigger:
            - call: "POST /clickthroughs"
              payload: { member_id: "${mc_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { click_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ClickThrough.${click_id} response has no version field"
            - "ClickThrough.${click_id}.clicked_at == 2026-01-01T00:00:00.000Z"

      - name: create_offer_invalid_enum_offer_type_returns_validation
        claim_type: Type Constraints
        grounds:
          - "errors[ERR_VALIDATION]"
          - "entities.Offer.fields.offer_type"
        distinguishing_aspect: "POST /offers with offer_type='FOO' (not in {LINKED, RECEIPT_REBATE}) -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A merchant exists."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "FOO", starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_offer_unknown_merchant_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_REFERENCE_NOT_FOUND]"
          - "entities.Offer.fields.merchant_id"
        distinguishing_aspect: "POST /offers with a body merchant_id that does not resolve -> ERR_REFERENCE_NOT_FOUND (422), distinct from path 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /offers"
              payload: { merchant_id: "00000000-0000-4000-8000-000000000000", offer_type: "LINKED", starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_REFERENCE_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_unknown_transition_approve_already_approved_receipt
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ReceiptScan.IN_REVIEW_to_APPROVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Approving an already-APPROVED receipt (terminal) -> ERR_INVALID_STATE (409); no second claim is spawned."
        test_recipe:
          setup: ["A receipt approved once (status APPROVED)."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 0, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "sa@x.com" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${sa_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 8000, purchased_at: "2026-01-01T06:00:00Z" }
              as: Member
              as_user_id: "${sa_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "ok" }
              as: ReviewAgent
          trigger:
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "again" }
              as: ReviewAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_member_initial_states
        claim_type: Initial State
        grounds: [state_machines.Member.account_status, state_machines.Member.verification_status]
        distinguishing_aspect: "A freshly created Member starts account_status=ACTIVE and verification_status=UNVERIFIED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "si@x.com" }
              as: PlatformAdmin
              captures: { si_id: $.data.id }
          assert:
            - "Member.${si_id}.account_status == ACTIVE"
            - "Member.${si_id}.verification_status == UNVERIFIED"
            - "Member.${si_id}.pending_balance_cents == 0"

      - name: terminal_paid_cashout_cannot_be_processed
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.CashOut.PROCESSING_to_PAID"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A PAID (terminal) cash-out cannot be processed again -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member VERIFIED with a 1000-cent AVAILABLE claim; cash-out created, processed, and settled PAID."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "st@x.com" }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /members/${st_id}/verify"
              payload: {}
              as: FinanceAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${st_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${st_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${st_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${st_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
            - call: "GET /members/${st_id}"
              payload: {}
              as: Member
              as_user_id: "${st_id}"
              captures: { st_ver: $.data.version }
            - call: "POST /cashouts"
              payload: { member_id: "${st_id}", method: "PAYPAL", requested_amount_cents: 1000, expected_member_version: "${st_ver}" }
              as: Member
              as_user_id: "${st_id}"
              captures: { co_id: $.data.id }
            - call: "POST /cashouts/${co_id}/process"
              payload: {}
              as: FinanceAdmin
            - call: "POST /cashouts/${co_id}/settle"
              payload: { outcome: "PAID" }
              as: FinanceAdmin
          trigger:
            - call: "POST /cashouts/${co_id}/process"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cashout_paid_cascades_claims_to_paid
        claim_type: Side Effect Execution
        grounds: [state_machines.CashOut.PROCESSING_to_PAID, state_machines.RewardClaim.RESERVED_to_PAID, entities.Member.fields.lifetime_paid_cents]
        distinguishing_aspect: "Settling a cash-out PAID transitions its reserved claim RESERVED->PAID and increments Member.lifetime_paid_cents by the claim amount; a CASHOUT_DEBIT ledger entry is emitted."
        test_recipe:
          setup: ["Member VERIFIED with a 1000-cent AVAILABLE claim; cash-out created and PROCESSING."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "se@x.com" }
              as: PlatformAdmin
              captures: { se_id: $.data.id }
            - call: "POST /members/${se_id}/verify"
              payload: {}
              as: FinanceAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${se_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${se_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${se_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${se_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
            - call: "GET /members/${se_id}"
              payload: {}
              as: Member
              as_user_id: "${se_id}"
              captures: { se_ver: $.data.version }
            - call: "POST /cashouts"
              payload: { member_id: "${se_id}", method: "PAYPAL", requested_amount_cents: 1000, expected_member_version: "${se_ver}" }
              as: Member
              as_user_id: "${se_id}"
              captures: { co_id: $.data.id }
            - call: "POST /cashouts/${co_id}/process"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /cashouts/${co_id}/settle"
              payload: { outcome: "PAID" }
              as: FinanceAdmin
          assert:
            - "CashOut.${co_id}.status == PAID"
            - "RewardClaim.${claim_id}.status == PAID"
            - "Member.${se_id}.lifetime_paid_cents == 1000"
            - "Member.${se_id}.reserved_balance_cents == 0"

      - name: clock_advance_matures_pending_claim
        claim_type: Valid Transition
        grounds: [state_machines.RewardClaim.PENDING_to_AVAILABLE, entities.RewardClaim.fields.matures_at]
        distinguishing_aspect: "Advancing the clock past matures_at auto-transitions a PENDING claim to AVAILABLE and moves the amount from pending to available balance."
        test_recipe:
          setup: ["Member with one PENDING online claim of 1000 (merchant maturity_hold_days=30)."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "sv@x.com" }
              as: PlatformAdmin
              captures: { sv_id: $.data.id }
            - call: "POST /clickthroughs"
              payload: { member_id: "${sv_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${sv_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${sv_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${sv_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
          assert:
            - "RewardClaim.${claim_id}.status == AVAILABLE"
            - "Member.${sv_id}.pending_balance_cents == 0"
            - "Member.${sv_id}.available_balance_cents == 1000"

      - name: available_claim_expires_after_expiry_window
        claim_type: Valid Transition
        grounds: [state_machines.RewardClaim.AVAILABLE_to_EXPIRED, entities.RewardClaim.fields.expires_at, entities.LedgerEntry.fields.entry_type]
        distinguishing_aspect: "An AVAILABLE, unreserved claim auto-expires once the clock passes expires_at; available_balance_cents drops to 0 and a CLAIM_EXPIRED ledger entry is emitted."
        test_recipe:
          setup: ["Member with one matured AVAILABLE claim of 1000; clock advanced far beyond expires_at."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "sx@x.com" }
              as: PlatformAdmin
              captures: { sx_id: $.data.id }
            - call: "POST /clickthroughs"
              payload: { member_id: "${sx_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${sx_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${sx_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${sx_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: FinanceAdmin
          assert:
            - "RewardClaim.${claim_id}.status == EXPIRED"
            - "Member.${sx_id}.available_balance_cents == 0"

      - name: failed_cashout_retry_cycle_re_reserves
        claim_type: cyclic
        grounds: [state_machines.CashOut.FAILED_to_REQUESTED, state_machines.RewardClaim.AVAILABLE_to_RESERVED]
        distinguishing_aspect: "CashOut FAILED->REQUESTED (retry cycle) re-reserves the AVAILABLE claim and re-enters the lifecycle; status returns to REQUESTED and the claim is RESERVED again."
        test_recipe:
          setup: ["Member VERIFIED, 1000-cent claim AVAILABLE, cash-out created->processed->settled FAILED (claim reverted to AVAILABLE)."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "sc@x.com" }
              as: PlatformAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /members/${sc_id}/verify"
              payload: {}
              as: FinanceAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${sc_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${sc_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${sc_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${sc_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
            - call: "GET /members/${sc_id}"
              payload: {}
              as: Member
              as_user_id: "${sc_id}"
              captures: { sc_ver: $.data.version }
            - call: "POST /cashouts"
              payload: { member_id: "${sc_id}", method: "PAYPAL", requested_amount_cents: 1000, expected_member_version: "${sc_ver}" }
              as: Member
              as_user_id: "${sc_id}"
              captures: { co_id: $.data.id }
            - call: "POST /cashouts/${co_id}/process"
              payload: {}
              as: FinanceAdmin
            - call: "POST /cashouts/${co_id}/settle"
              payload: { outcome: "FAILED" }
              as: FinanceAdmin
          trigger:
            - call: "POST /cashouts/${co_id}/retry"
              payload: {}
              as: FinanceAdmin
          assert:
            - "CashOut.${co_id}.status == REQUESTED"
            - "RewardClaim.${claim_id}.status == RESERVED"
            - "Member.${sc_id}.reserved_balance_cents == 1000"

      - name: referral_signup_links_referee
        claim_type: Valid Transition
        grounds: [state_machines.Referral.INVITED_to_SIGNED_UP, entities.Referral.fields.referee_member_id]
        distinguishing_aspect: "Registering a member whose email matches an INVITED referral and referred_by_member_id matches the referrer transitions that Referral INVITED->SIGNED_UP and sets referee_member_id."
        test_recipe:
          setup: ["A referrer member; an INVITED referral to referee email."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "referrer@x.com" }
              as: PlatformAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_member_id: "${ref_id}", referee_email: "newbie@x.com" }
              as: Member
              as_user_id: "${ref_id}"
              captures: { referral_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { email: "newbie@x.com", referred_by_member_id: "${ref_id}" }
              as: PlatformAdmin
              captures: { newbie_id: $.data.id }
          assert:
            - "Referral.${referral_id}.status == SIGNED_UP"
            - "Referral.${referral_id}.referee_member_id == ${newbie_id}"

      - name: invited_referral_expires_on_clock_advance
        claim_type: Valid Transition
        grounds: [state_machines.Referral.INVITED_to_EXPIRED]
        distinguishing_aspect: "An INVITED referral with no sign-up transitions to EXPIRED once the clock passes created_at + REFERRAL_EXPIRY_DAYS."
        test_recipe:
          setup: ["A referrer member; an INVITED referral; clock advanced well past expiry."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "rr@x.com" }
              as: PlatformAdmin
              captures: { rr_id: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_member_id: "${rr_id}", referee_email: "ghost@x.com" }
              as: Member
              as_user_id: "${rr_id}"
              captures: { referral_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: FinanceAdmin
          assert:
            - "Referral.${referral_id}.status == EXPIRED"

      - name: error_receipt_approve_already_terminal
        claim_type: Idempotency
        grounds: [state_machines.ReceiptScan.IN_REVIEW_to_APPROVED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / receipt_scan_reject_then_resubmit_cycle
