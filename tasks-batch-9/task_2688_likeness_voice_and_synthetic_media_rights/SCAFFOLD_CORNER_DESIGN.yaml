          with identical detection inputs opened against a CLEAR and a RESTRICTED talent must differ by
          exactly 0.15 * (0.6 - 0.3) = 0.0450, and a third case shows the reach term saturating at
          min(1, views / REACH_SATURATION) instead of growing past it. The posture factor is read as it
          stands BEFORE the case is persisted.
        test_recipe:
          setup:
            - "CA profile, SAG_AFTRA/ADVERTISING union row"
            - "Talent A with nothing attached, hence CLEAR"
            - "Talent B with one ACTIVE grant that is then SUSPENDED, hence RESTRICTED"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { ta_id: $.data.id }
            - call: "POST /talents"
              payload: { legal_name: "Bo Lindqvist", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { tb_id: $.data.id, tb_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${tb_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Campaign", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${tb_v}" }
              as: RightsAdministrator
              captures: { gb_id: $.data.id }
            - call: "POST /consent-grants/${gb_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${tb_id}"
            - call: "POST /consent-grants/${gb_id}/suspension"
              payload: { action: "SUSPEND", suspension_reason: "COMPLIANCE_HOLD" }
              as: RightsAdministrator
              as_user_id: "ra-001"
            - call: "GET /talents/${tb_id}"
              payload: {}
              as: RightsAdministrator
          trigger:
            - call: "POST /infringement-cases"
              payload: { talent_id: "${ta_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/a", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 8000000, match_confidence: 0.900 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { ca_case: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${tb_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/b", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 8000000, match_confidence: 0.900 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { cb_case: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${ta_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/c", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 20000000, match_confidence: 0.900 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { cc_case: $.data.id }
