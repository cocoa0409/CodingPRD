        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/fuel-grades/{id}/index-quotes
          - entities.IndexQuote.parent
          - complexity_profile.complexity_layers.pagination_with_filtering
        distinguishing_aspect: "The sub-resource returns only the addressed grade's quotes, ordered by quote_date descending, and paginates over that filtered set: with three quotes on MGO-DMA and one on RMG-380, limit 2 offset 0 yields the 2026-08-09 and 2026-08-03 rows with total_count 3 and has_more true, offset 2 yields the 2026-08-01 row with has_more false, and the RMG-380 sub-resource yields exactly one row."
        test_recipe:
          setup:
            - "Clock set to 2026-08-10T00:00:00Z"
            - "Two grades: MGO-DMA with quotes at 2026-08-01 (698.00), 2026-08-03 (705.00) and 2026-08-09 (745.50); RMG-380 with one quote at 2026-08-05 (462.25)"
