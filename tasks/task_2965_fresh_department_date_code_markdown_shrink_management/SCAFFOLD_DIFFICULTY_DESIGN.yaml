# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every literal in an `assert:` line was
# computed by executing the matching §1.3 formula with its declared constants.
# The logical clock starts at 2026-08-01T00:00:00Z in every instance.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: markdown_price_ladder_days_vs_sell_through_on_same_lot
        grounds:
          - calculations.markdown_price
          - calculations.ladder_rung_selection
          - calculations.expected_sell_through
          - entities.DateCodeLot.fields.current_rung_index
          - entities.MarkdownLadder.fields.sell_through_floor_pct
        distinguishing_aspect: |
          One lot, one clock position and one ladder produce two different shelf prices: the
          LADDER_DAYS variant prices rung 0 at 509 cents because days_remaining is 3, while the
          SELL_THROUGH variant deepens to rung 1 at 419 cents because expected_sell_through_pct
          (50.00) is one 20-point step below the ladder's 60.00 floor.
        test_recipe:
          setup:
            - "One MEAT department on store 0412 priced by an ACTIVE ladder with four rungs (days_remaining_max 3/2/1/0 at 15/30/50/75 percent)."
            - "One item at 599 cents retail, 420 cents cost, daily_forecast_units 4.00, no item-specific shelf life so the department default of 10 days applies."
            - "One lot of 24 units produced 2026-08-05, so sell_by_at is 2026-08-15T00:00:00.000Z; nothing sold, nothing shrunk, no label yet."
            - "Logical clock parked at 2026-08-12T00:00:00.000Z, which is exactly 3 days before sell_by_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1", "D2"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 2, discount_pct: 30, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }, { days_remaining_max: 0, discount_pct: 75, requires_manager_approval: true }], sell_through_floor_pct: 60, max_total_discount_pct: 75 }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10, past_date_tolerance_hours: 4, shrink_budget_pct: 2.5, markdown_policy_profile: "STANDARD" }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00, donation_eligible: true, sampling_allowed: false }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "GET /fresh/lots/${lot_id}/markdown-quote"
              payload: {}
              as: DepartmentManager
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}", pricing_variant: "SELL_THROUGH" }
              as: DepartmentManager
              captures: { label_id: $.data.id }
          assert:
            - "markdown-quote response data.days_remaining == 3"
            - "markdown-quote response data.expected_sell_through_pct == 50.00"
            - "markdown-quote response data.base_rung_index == 0"
            - "markdown-quote response data.ladder_days_rung_index == 0 and data.ladder_days_price_cents == 509"
            - "markdown-quote response data.sell_through_shortfall_steps == 1"
            - "markdown-quote response data.sell_through_rung_index == 1 and data.sell_through_price_cents == 419"
            - "markdown-quote response data.ladder_days_price_cents - data.sell_through_price_cents == 90"
            - "MarkdownLabel.${label_id}.to_price_cents == 419"
            - "MarkdownLabel.${label_id}.rung_index == 1"
            - "MarkdownLabel.${label_id}.reason == SELL_THROUGH"
            - "MarkdownLabel.${label_id}.discount_pct == 30.05"
            - "MarkdownLabel.${label_id}.barcode == 'MD-000111222333-00419'"
            - "DateCodeLot.${lot_id}.current_price_cents == 419"
            - "DateCodeLot.${lot_id}.current_rung_index == 1"
            - "DateCodeLot.${lot_id}.total_discount_pct == 30.05"
            - "DateCodeLot.${lot_id}.status == MARKED_DOWN"
      - name: order_feedback_chronological_actual_vs_forward_looking_projected
        grounds:
          - calculations.shrink_history_order_feedback
          - entities.OrderRecommendation.fields.method
          - entities.OrderRecommendation.fields.shrink_rate_pct
          - concurrency_rules[recommendation-create-stale-item]
        distinguishing_aspect: |
          The same item, window and open stock yield shrink_rate_pct 12.50 and 18 recommended units
          under CHRONOLOGICAL_ACTUAL (verified shrink only) versus 30.00 and 7 units under
          FORWARD_LOOKING_PROJECTED, which adds the 2 unverified RECORDED units and the 5 projected
          units of lot C that its 1 remaining day of forecast cannot clear.
        test_recipe:
          setup:
            - "One MEAT department; one item at 899 cents retail, 500 cents cost, daily_forecast_units 20.00, department shelf life 10 days."
            - "Lot C: 30 units created while the clock read 2026-08-10T08:00Z, produced 2026-08-05 so sell_by_at is 2026-08-15T00:00:00.000Z; 5 units shrunk by a VERIFIED event, leaving 25 on hand."
            - "Lot D: 10 units created while the clock read 2026-08-11T09:00Z, produced 2026-08-06 so sell_by_at is 2026-08-16T00:00:00.000Z; one RECORDED (unverified) shrink event of 2 units, 10 units still on hand."
            - "received_units over the window 2026-08-10..2026-08-12 is 40; open_units is 35."
            - "Clock parked at 2026-08-13T12:00:00.000Z, so days_remaining is 1 for lot C and 2 for lot D."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000444555666", description: "Beef Sirloin 16oz", base_retail_cents: 899, unit_cost_cents: 500, daily_forecast_units: 20.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id, item_v1: $.data.version }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 30 }
              as: FreshClerk
              captures: { lot_c_id: $.data.id }
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_c_id}", cause_code: "SPOILAGE", quantity_units: 5, note: "case crushed in cooler" }
              as: FreshClerk
              as_user_id: "clerk-1"
              captures: { shrink_c_id: $.data.id }
            - call: "POST /fresh/shrink-events/${shrink_c_id}/verify"
              payload: {}
              as: DepartmentManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T09:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-06", quantity_original: 10 }
              as: FreshClerk
              captures: { lot_d_id: $.data.id }
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_d_id}", cause_code: "DAMAGE", quantity_units: 2 }
              as: FreshClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T12:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/order-recommendations"
              payload: { item_id: "${item_id}", window_start_date: "2026-08-10", window_end_date: "2026-08-12", method: "CHRONOLOGICAL_ACTUAL", expected_item_version: "${item_v1}" }
              as: DepartmentManager
              captures: { rec_chron_id: $.data.id }
            - call: "GET /fresh/items/${item_id}"
              payload: {}
              as: DepartmentManager
              captures: { item_v2: $.data.version }
            - call: "POST /fresh/order-recommendations"
              payload: { item_id: "${item_id}", window_start_date: "2026-08-10", window_end_date: "2026-08-12", method: "FORWARD_LOOKING_PROJECTED", expected_item_version: "${item_v2}" }
              as: DepartmentManager
              captures: { rec_fwd_id: $.data.id }
          assert:
            - "OrderRecommendation.${rec_chron_id}.received_units == 40"
            - "OrderRecommendation.${rec_chron_id}.shrink_units == 5"
            - "OrderRecommendation.${rec_chron_id}.shrink_rate_pct == 12.50"
            - "OrderRecommendation.${rec_chron_id}.open_units == 35"
            - "OrderRecommendation.${rec_chron_id}.recommended_order_units == 18"
            - "OrderRecommendation.${rec_fwd_id}.received_units == 40"
            - "OrderRecommendation.${rec_fwd_id}.shrink_units == 12"
            - "OrderRecommendation.${rec_fwd_id}.shrink_rate_pct == 30.00"
            - "OrderRecommendation.${rec_fwd_id}.open_units == 35"
            - "OrderRecommendation.${rec_fwd_id}.recommended_order_units == 7"
            - "OrderRecommendation.${rec_chron_id}.recommended_order_units - OrderRecommendation.${rec_fwd_id}.recommended_order_units == 11"
            - "OrderRecommendation.${rec_chron_id}.status == DRAFT and OrderRecommendation.${rec_fwd_id}.supersedes_recommendation_id == null"
  - rule_id: combinatorial_formula
    instances:
      - name: expected_sell_through_three_inputs_two_branches_aggressive_deli
        grounds:
          - calculations.expected_sell_through
          - calculations.days_remaining
          - entities.Department.fields.markdown_policy_profile
          - entities.Item.fields.daily_forecast_units
          - entities.DateCodeLot.fields.expected_sell_through_pct
          - state_machines.MarkdownLabel.PRINTED_to_APPLIED
        distinguishing_aspect: |
          Mode (a) -- multiple inputs plus conditional branches: the one formula folds three numeric
          inputs (daily_forecast_units 5.00, days_remaining 2, quantity_on_hand 20) through two
          independent conditional branches, the AGGRESSIVE profile multiplier 1.25 and the
          has-an-APPLIED-label promo lift of 10 percent of on-hand units, so the identical lot reads
          62.50 while its new label is still QUEUED and 72.50 once that label is APPLIED.
        test_recipe:
          setup:
            - "One DELI department on store 0412 with markdown_policy_profile AGGRESSIVE and an ACTIVE four-rung ladder (days_remaining_max 3/2/1/0 at 20/35/55/70 percent)."
            - "One item at 700 cents retail, 300 cents cost, daily_forecast_units 5.00, item-specific shelf_life_days 6 which overrides the department default of 8."
            - "One lot of 20 units produced 2026-08-08, so sell_by_at is 2026-08-14T00:00:00.000Z; nothing sold, nothing shrunk, no label."
            - "Logical clock parked at 2026-08-12T00:00:00.000Z, exactly 2 days before sell_by_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "DELI-AGGR-2026", department_code: "DELI", rungs: [{ days_remaining_max: 3, discount_pct: 20, requires_manager_approval: false }, { days_remaining_max: 2, discount_pct: 35, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 55, requires_manager_approval: true }, { days_remaining_max: 0, discount_pct: 70, requires_manager_approval: true }], sell_through_floor_pct: 60, max_total_discount_pct: 70 }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "DELI", shelf_life_days_default: 8, markdown_policy_profile: "AGGRESSIVE" }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000777888999", description: "Rotisserie Chicken", base_retail_cents: 700, unit_cost_cents: 300, daily_forecast_units: 5.00, shelf_life_days: 6 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-08", quantity_original: 20 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}" }
              as: DepartmentManager
              captures: { label_id: $.data.id, label_price: $.data.to_price_cents }
            - call: "GET /fresh/lots/${lot_id}"
              payload: {}
              as: DepartmentManager
              captures: { est_queued: $.data.expected_sell_through_pct }
            - call: "POST /fresh/markdown-labels/${label_id}/print"
              payload: {}
              as: FreshClerk
            - call: "POST /fresh/markdown-labels/${label_id}/apply"
              payload: {}
              as: FreshClerk
            - call: "GET /fresh/lots/${lot_id}"
              payload: {}
              as: DepartmentManager
              captures: { est_applied: $.data.expected_sell_through_pct }
          assert:
            - "${label_price} == 455"
            - "MarkdownLabel.${label_id}.rung_index == 1"
            - "MarkdownLabel.${label_id}.discount_pct == 35.00"
            - "MarkdownLabel.${label_id}.barcode == 'MD-000777888999-00455'"
            - "MarkdownLabel.${label_id}.status == APPLIED"
            - "${est_queued} == 62.50"
            - "${est_applied} == 72.50"
            - "${est_applied} - ${est_queued} == 10.00"
            - "DateCodeLot.${lot_id}.current_price_cents == 455"
            - "DateCodeLot.${lot_id}.total_discount_pct == 35.00"
            - "DateCodeLot.${lot_id}.status == MARKED_DOWN"
      - name: donation_manifest_tier_keyed_on_provisional_total
        grounds:
          - calculations.donation_manifest_valuation
          - calculations.donation_eligibility
          - entities.DonationPickup.fields.credit_rate_pct
          - entities.DonationLotAssignment.fields.line_credit_cents
          - state_machines.DonationPickup.DRAFT_to_SEALED
        distinguishing_aspect: |
          Mode (c) -- pinned evaluation order: the manifest's two lines are chosen so the tier lookup
          and the rounding step are both order-observable, giving manifest_credit_cents == 47793 only
          when the tier is keyed on the provisional total (65920 -> 72.5 percent) and each line is
          rounded before summation; rounding the summed value once instead yields 47792 and re-keying
          the tier from the credited total (47793 < 50000 -> 62.5 percent) yields 41201.
        test_recipe:
          setup:
            - "Store 0412 in region MID-ATL with donation_program_enabled true and dock doors D1 and D2."
            - "FoodBankPartner in MID-ATL, ACTIVE, accepted_department_codes [PRODUCE], cold_chain_certified false (PRODUCE needs no cold chain)."
            - "One PRODUCE department with an ACTIVE ladder and shelf_life_days_default 8; two donation-eligible items at 899 and 599 cents retail, never marked down."
            - "Lot A: 60 units produced 2026-08-05, sell_by_at 2026-08-13T00:00:00.000Z. Lot B: 20 units of the second item, same production date."
            - "Clock parked at 2026-08-12T00:00:00.000Z, inside the 48-hour donation window and before sell_by_at; one SCHEDULED pickup on dock D1 for 14:00-16:00 that day, manifest still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1", "D2"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/food-bank-partners"
              payload: { name: "Mid-Atlantic Food Bank", contact_email: "ops@mafb.example", service_region_code: "MID-ATL", accepted_department_codes: ["PRODUCE"], cold_chain_certified: false }
              as: StoreOperationsAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "PRODUCE-STD-2026", department_code: "PRODUCE", rungs: [{ days_remaining_max: 2, discount_pct: 25, requires_manager_approval: false }, { days_remaining_max: 0, discount_pct: 50, requires_manager_approval: true }], sell_through_floor_pct: 60, max_total_discount_pct: 50 }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "PRODUCE", shelf_life_days_default: 8 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000222333444", description: "Organic Berry Tray", base_retail_cents: 899, unit_cost_cents: 400, daily_forecast_units: 10.00, donation_eligible: true }
              as: DepartmentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000555666777", description: "Salad Kit", base_retail_cents: 599, unit_cost_cents: 250, daily_forecast_units: 8.00, donation_eligible: true }
              as: DepartmentManager
              captures: { item_b_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_a_id}", production_date: "2026-08-05", quantity_original: 60 }
              as: FreshClerk
              captures: { lot_a_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_b_id}", production_date: "2026-08-05", quantity_original: 20 }
              as: FreshClerk
              captures: { lot_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-12T14:00:00.000Z", scheduled_window_end: "2026-08-12T16:00:00.000Z" }
              as: DepartmentManager
              captures: { pickup_id: $.data.id }
          trigger:
            - call: "POST /fresh/donation-pickups/${pickup_id}/assignments"
              payload: { lot_id: "${lot_a_id}", quantity_units: 60 }
              as: FreshClerk
              captures: { asg_a_id: $.data.id }
            - call: "POST /fresh/donation-pickups/${pickup_id}/assignments"
              payload: { lot_id: "${lot_b_id}", quantity_units: 20 }
              as: FreshClerk
              captures: { asg_b_id: $.data.id }
            - call: "POST /fresh/donation-pickups/${pickup_id}/seal"
              payload: {}
              as: DepartmentManager
              captures: { sealed_credit: $.data.manifest_credit_cents, sealed_rate: $.data.credit_rate_pct }
          assert:
            - "DonationLotAssignment.${asg_a_id}.unit_price_cents_snapshot == 899"
            - "DonationLotAssignment.${asg_a_id}.line_value_cents == 53940"
            - "DonationLotAssignment.${asg_b_id}.unit_price_cents_snapshot == 599"
            - "DonationLotAssignment.${asg_b_id}.line_value_cents == 11980"
            - "DonationPickup.${pickup_id}.assignment_count == 2"
            - "DonationPickup.${pickup_id}.provisional_value_cents == 65920"
            - "${sealed_rate} == 72.5"
            - "DonationLotAssignment.${asg_a_id}.line_credit_cents == 39107"
            - "DonationLotAssignment.${asg_b_id}.line_credit_cents == 8686"
            - "${sealed_credit} == 47793"
            - "${sealed_credit} != 47792, the value a single round_half_up over 65920 * 72.5 percent would produce"
            - "${sealed_credit} != 41201, the value re-keying the tier from the credited total (47793 < 50000 -> 62.5 percent) would produce"
            - "DonationPickup.${pickup_id}.manifest_status == SEALED and DonationPickup.${pickup_id}.logistics_status == SCHEDULED"
            - "DateCodeLot.${lot_a_id}.status == DONATION_PENDING and DateCodeLot.${lot_b_id}.status == DONATION_PENDING"
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_marked_down_then_voided_back_to_fresh_then_remarked_deeper
        grounds:
          - state_machines.DateCodeLot.FRESH_to_MARKED_DOWN
          - state_machines.DateCodeLot.MARKED_DOWN_to_FRESH
          - calculations.markdown_price
          - calculations.markdown_liability
          - entities.DateCodeLot.fields.current_rung_index
        distinguishing_aspect: |
          The lot re-enters a state it already left: FRESH -> MARKED_DOWN (rung 0, 509) -> FRESH
          (rung reset to -1, price restored to 599) -> MARKED_DOWN again at the strictly deeper rung 1
          (419) one clock-day later, and the department's markdown_liability_cents follows the loop
          0 -> 2160 -> 0 -> 4320 instead of moving monotonically.
        test_recipe:
          setup:
            - "One MEAT department on store 0412 with an ACTIVE four-rung ladder (days_remaining_max 3/2/1/0 at 15/30/50/75 percent), markdown_policy_profile STANDARD."
