            - "TakePermit P ACTIVE, authorized_take_total=10, take_consumed=0"
            - "Two DispersalActivity referencing P, both in LOGGED status"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
