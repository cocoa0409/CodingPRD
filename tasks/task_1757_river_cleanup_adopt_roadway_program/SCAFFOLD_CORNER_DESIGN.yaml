            - { call: "POST /program/events/${e}/debris-report", payload: { weight_method: "MEASURED", measured_total_weight_lbs: 20.1, material_lines: [ { material_type: "GENERAL_TRASH", line_weight_lbs: 12.8 }, { material_type: "RECYCLABLES", line_weight_lbs: 7.3 } ] }, as: GroupLeader, as_user_id: "${g}", captures: { official: $.data.official_weight_lbs } }
          assert:
            - "err == ERR_WEIGHT_MISMATCH (12.8 + 7.3 = 20.1 != 20.0)"
            - "official == 20.1 once the declared total matches the line sum"

      - name: estimated_weight_per_bag_constants_applied
        claim_type: constants_applied
        grounds: [calculations.official_event_weight]
        distinguishing_aspect: "Per-bag averages are applied per material: 3 METALS bags at 22.4 lbs each yield exactly 67.2, and 2 YARD_WASTE at 10.6 yield 21.2; the report total is 88.4."
        test_recipe:
          setup: ["approved agreement; event briefed; clock on scheduled date 2026-09-10"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/events/${e}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "METALS", bag_count: 3 }, { material_type: "YARD_WASTE", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}", captures: { official: $.data.official_weight_lbs, breakdown: $.data.material_breakdown } }
          assert:
            - "official == 88.4 (67.2 + 21.2)"
            - "breakdown contains {material_type: METALS, line_weight_lbs: 67.2} and {material_type: YARD_WASTE, line_weight_lbs: 21.2}"

      - name: program_metrics_status_filtering
        claim_type: input_set_filtering
        grounds: [calculations.program_metrics]
        distinguishing_aspect: "Metrics count only pinned statuses: a PENDING_REVIEW agreement is excluded from active_agreements, a RESOLVED hazard is excluded from open_hazards, and only ADOPTED segments add adopted_miles."
        test_recipe:
          setup: ["one ACTIVE agreement on a 2.0-mile segment; one PENDING_REVIEW agreement on a 1.5-mile segment; one REPORTED hazard; one hazard taken REPORTED -> ACKNOWLEDGED -> RESOLVED"]
          setup_api_calls:
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 10.0, mile_marker_end: 11.5, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g1: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g1}", segment_id: "${s1}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g1}", captures: { ag1: $.data.id } }
            - { call: "POST /program/agreements/${ag1}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/groups", payload: { name: "Road Rangers", org_type: "BUSINESS", contact_name: "Rob Lead", contact_email: "rob@roadrangers.com" }, as: GroupLeader, captures: { g2: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g2}", segment_id: "${s2}", contact_email: "rob@roadrangers.com" }, as: GroupLeader, as_user_id: "${g2}" }
            - { call: "POST /program/hazards", payload: { segment_id: "${s1}", hazard_type: "PROPANE_TANK", description: "tank at shore", location_note: "MP 5.0" }, as: ProgramCoordinator, captures: { h1: $.data.id } }
            - { call: "POST /program/hazards", payload: { segment_id: "${s1}", hazard_type: "OTHER", description: "drum", location_note: "MP 5.4" }, as: ProgramCoordinator, captures: { h2: $.data.id } }
            - { call: "POST /program/hazards/${h2}/acknowledge", payload: {}, as: ProgramCoordinator }
            - { call: "POST /program/hazards/${h2}/resolve", payload: { resolution_note: "removed" }, as: ProgramCoordinator }
          trigger:
            - { call: "GET /program/metrics", payload: {}, as: ProgramCoordinator, captures: { m_active: $.data.active_agreements, m_adopted: $.data.adopted_miles, m_avail: $.data.available_miles, m_debris: $.data.total_debris_lbs, m_cleanups: $.data.completed_cleanups, m_hazards: $.data.open_hazards } }
          assert:
            - "m_active == 1 (PENDING_REVIEW agreement excluded)"
            - "m_adopted == 2.0 and m_avail == 1.5"
            - "m_hazards == 1 (RESOLVED hazard excluded from open_hazards)"
            - "m_debris == 0.0 and m_cleanups == 0"

      - name: rolling_window_inclusive_lower_bound
        claim_type: boundary_edge
        grounds: [calculations.compliance_standing, state_machines.AdoptionAgreement.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "The rolling window [today-365d, today] is inclusive at both ends: at 2027-08-20 a cleanup dated 2026-08-20 still counts (count 3, ACTIVE); one day later it ages out (count 2, SUSPENDED)."
        test_recipe:
          setup: ["approved agreement with COMPLETED cleanups on 2026-08-20, 2026-09-10, 2026-09-15"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-08-20", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e1: $.data.id } }
            - { call: "POST /program/events/${e1}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e2: $.data.id } }
            - { call: "POST /program/events/${e2}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-15", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e3: $.data.id } }
            - { call: "POST /program/events/${e3}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e1}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e2}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e3}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-20T09:00:00Z" }, as: ProgramCoordinator }
            - { call: "GET /program/agreements/${ag}", payload: {}, as: ProgramCoordinator, captures: { d0_status: $.data.status, d0_count: $.data.cleanups_completed_in_window } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-21T09:00:00Z" }, as: ProgramCoordinator }
            - { call: "GET /program/agreements/${ag}", payload: {}, as: ProgramCoordinator, captures: { d1_status: $.data.status, d1_count: $.data.cleanups_completed_in_window } }
          assert:
            - "d0_count == 3 and d0_status == ACTIVE (2026-08-20 cleanup still inside [2026-08-20, 2027-08-20])"
            - "d1_count == 2 and d1_status == SUSPENDED (window slides to [2026-08-21, 2027-08-21] and the oldest cleanup ages out)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: foreign_group_cannot_brief_event_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "GroupLeader of group B attempting to brief group A's event fails ownership (ERR_FORBIDDEN_OWNERSHIP, 403) even though the role is otherwise allowed to brief."
        test_recipe:
          setup: ["two groups each with an approved agreement on its own segment; group A has a SCHEDULED event and an adult waiver"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Group A", org_type: "CIVIC", contact_name: "A Lead", contact_email: "a@a.org" }, as: GroupLeader, captures: { ga: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Alpha Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { sa: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${ga}", segment_id: "${sa}", contact_email: "a@a.org" }, as: GroupLeader, as_user_id: "${ga}", captures: { aga: $.data.id } }
            - { call: "POST /program/agreements/${aga}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${aga}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${ga}", captures: { wa: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${aga}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${ga}", captures: { ea: $.data.id } }
            - { call: "POST /program/groups", payload: { name: "Group B", org_type: "SCHOOL", contact_name: "B Lead", contact_email: "b@b.org" }, as: GroupLeader, captures: { gb: $.data.id } }
          trigger:
            - { call: "POST /program/events/${ea}/briefing", payload: { attendee_waiver_ids: ["${wa}"] }, as: GroupLeader, as_user_id: "${gb}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_OWNERSHIP (X-User-ID ${gb} does not match the event's agreement group ${ga})"

      - name: request_without_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no valid X-User-Role is rejected 401 ERR_UNAUTHENTICATED at priority 1, before role/ownership checks."
        test_recipe:
          setup: ["one group exists"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
          trigger:
            - { call: "GET /program/groups/${g}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (http 401)"

      - name: supply_return_exceeding_issued_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_RETURN_EXCEEDS_ISSUED]"]
        distinguishing_aspect: "Returning 5 grabbers when only 4 were issued fails with ERR_RETURN_EXCEEDS_ISSUED (cumulative check); the legal full return of 4 then reconciles."
        test_recipe:
          setup: ["depot 100/40/20; approved agreement on water-adjacent 2.0-mile segment; event V=7 issued 7 vests / 4 grabbers / 35 bags"]
          setup_api_calls:
            - { call: "POST /program/depots", payload: { name: "South Depot", bags_on_hand: 100, vests_on_hand: 40, grabbers_on_hand: 20 }, as: ProgramCoordinator, captures: { d: $.data.id } }
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 7 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g}", captures: { dist: $.data.id } }
          trigger:
            - { call: "POST /program/supplies/${dist}/return", payload: { returned_vests: 7, returned_grabbers: 5 }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
            - { call: "POST /program/supplies/${dist}/return", payload: { returned_vests: 7, returned_grabbers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { st: $.data.status } }
          assert:
            - "err == ERR_RETURN_EXCEEDS_ISSUED (5 > 4 issued grabbers)"
            - "st == RECONCILED after the valid full return"

      - name: second_report_on_completed_event_hits_state_guard
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_EVENT_NOT_BRIEFED]"]
        distinguishing_aspect: "A second debris report on an already COMPLETED event is rejected by the state guard ERR_EVENT_NOT_BRIEFED (priority 6) — completion leaves BRIEFING_DONE, which is also what enforces one-report-per-event."
        test_recipe:
          setup: ["approved agreement; event completed via a first debris report on 2026-09-10"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "POST /program/events/${e}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 1 } ] }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_NOT_BRIEFED (state guard fires; no second report is created)"

      - name: renewal_request_outside_window_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_RENEWAL_WINDOW_CLOSED]"]
        distinguishing_aspect: "renewal-request on day 1 of a 24-month term (2026-08-01, window opens 2028-05-03) is rejected ERR_RENEWAL_WINDOW_CLOSED."
        test_recipe:
          setup: ["approved agreement; clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/agreements/${ag}/renewal-request", payload: {}, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RENEWAL_WINDOW_CLOSED (today 2026-08-01 is far before term_end 2028-08-01 minus 90 days)"

      - name: report_window_thirty_days_inclusive
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_REPORT_WINDOW_CLOSED]"]
        distinguishing_aspect: "The report window [scheduled_date, scheduled_date+30d] is inclusive at the upper bound: a report exactly 30 days after the event succeeds (2026-10-10 for a 2026-09-10 event), while a sibling event reported at +31 days fails ERR_REPORT_WINDOW_CLOSED."
        test_recipe:
          setup: ["approved agreement; events e1 (2026-09-10) and e2 (2026-09-11) both BRIEFING_DONE"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e1: $.data.id } }
            - { call: "POST /program/events/${e1}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-11", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e2: $.data.id } }
            - { call: "POST /program/events/${e2}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-10T09:00:00Z" }, as: ProgramCoordinator }
