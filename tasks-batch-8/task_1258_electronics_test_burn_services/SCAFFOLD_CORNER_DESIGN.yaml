          assert:
            - "${err} == ERR_RESULT_IMMUTABLE"
            - "Unit.${u1}.test_status remains PASSED with retest_count 0"

      - name: slot_capacity_boundary_equal_allowed_excess_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=9]
          - calculations.chamber_slot_ledger
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: "slot_count exactly equal to available_slots is allowed; one more slot fails ERR_SLOT_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["QUEUED lot; chamber slots 3 class A; clock 2026-06-01T00:00:00Z; R1 takes 2 slots (1 remains)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "CapCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-232", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-CP", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-232", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "CP-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-CP", area_code: "AREA-CP", slot_count: 3, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", slot_count: 2 }, as: OperationsManager, as_user_id: "ops-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T12:00:00Z", end_at: "2026-06-01T13:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { r2: $.data.id } }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T14:00:00Z", end_at: "2026-06-01T15:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "slot_count 1 against available 1 accepted: ${r2} created (equality allowed, non-overlapping window)"
            - "Third reservation (available now 0): ${err} == ERR_SLOT_CAPACITY_EXCEEDED"

  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: units_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints."GET /api/units"
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: 4 units, limit 2 offset 2 returns 2 rows with total_count 4 and has_more false."
        test_recipe:
          setup: ["Lot quantity 4 RECEIVED with 4 units registered"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "PageCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-233", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-PG", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-233", quantity: 4, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "PG-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "PG-2" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "PG-3" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "PG-4" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "GET /api/units", payload: { lot_id: "${lot}", limit: 2, offset: 0 }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "GET /api/units", payload: { lot_id: "${lot}", limit: 2, offset: 2 }, as: OperationsManager, as_user_id: "ops-1" }
          assert:
            - "Page 1: 2 rows, total_count == 4, has_more == true"
            - "Page 2: 2 rows, total_count == 4, has_more == false"
            - "Pages are disjoint and ordered by created_at ASC"

      - name: response_envelope_success_shape
        claim_type: creation
        grounds:
          - response_envelope
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data per the fixed envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "EnvCo", tier: "STANDARD" }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
          assert:
            - "201 response has meta.api_request_id (string) and meta.api_request_timestamp (ISO8601)"
            - "response_type == 'object' and data.id == ${cust} (server-minted UUID, no type prefix)"

      - name: fk_reverse_lookup_results_by_unit
        claim_type: retrieval
        grounds:
          - endpoints."GET /api/test-results"
          - entities.TestResult.fields.unit_id
        distinguishing_aspect: "Filtered list reverse-reaches children: GET /api/test-results?unit_id returns exactly that unit's 2 insertions in chronological order."
        test_recipe:
          setup: ["Lot of 1 IN_TEST; unit soft-failed then authorized-retested to pass (2 results)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "FkCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-234", bin_map: { "1": "PASS", "2": "SOFT_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-FK", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-234", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "FK-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u1}", reason: "retry" }, as: TestEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "GET /api/test-results", payload: { unit_id: "${u1}" }, as: TestEngineer, as_user_id: "eng-1", captures: { first_bin: "$.data[0].bin_code", second_bin: "$.data[1].bin_code", second_idx: "$.data[1].insertion_index" } }
          assert:
            - "Exactly 2 rows for unit ${u1}; ${first_bin} == 2 then ${second_bin} == 1 (chronological)"
            - "${second_idx} == 2"

      - name: utilization_computed_read
        claim_type: computed_read
        grounds:
          - endpoints."GET /api/chambers/{chamber_id}/utilization"
        excluded_because:
          difficulty_instance: chamber_utilization_scheduled_vs_actual_diverge
          rationale: "Computed read exercised with literal numerator/denominator expectations there."

      - name: yield_report_computed_read
        claim_type: computed_read
        grounds:
          - endpoints."GET /api/lots/{lot_id}/yield-report"
        excluded_because:
          difficulty_instance: lot_yield_first_pass_vs_final_diverge
          rationale: "Computed read asserted field-by-field (FPY 0.5, FINAL 0.75, tallies, bin_counts) there."

  # ---------------------------------------------------------------------------
  # Section: errors (triggerability audit — §1.8-covered codes appear as stubs)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: err_slot_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SLOT_OVERLAP]
        excluded_because:
          difficulty_instance: chamber_half_open_adjacency_vs_profile_buffer
          rationale: "True-overlap rejection asserted there."
      - name: err_profile_buffer_violation_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROFILE_BUFFER_VIOLATION]
        excluded_because:
          difficulty_instance: chamber_half_open_adjacency_vs_profile_buffer
          rationale: "Different-class adjacency without purge gap asserted there."
      - name: err_maintenance_window_conflict_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: equipment_maintenance_closed_interval_conflict
          rationale: "Closed-interval touching-endpoint conflict asserted there."
      - name: err_retest_limit_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RETEST_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: retest_limit_boundary_at_max
          rationale: "Boundary retest_count == max asserted there."
      - name: err_disposition_review_required_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DISPOSITION_REVIEW_REQUIRED]
        excluded_because:
          difficulty_instance: ship_yield_threshold_inclusive
          rationale: "Ship rejection below the FPY threshold asserted there."
      - name: err_chamber_not_online_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHAMBER_NOT_ONLINE]
        excluded_because:
          difficulty_instance: reservation_requires_chamber_online
          rationale: "Reservation create against MAINTENANCE chamber asserted there."
      - name: err_equipment_not_in_service_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EQUIPMENT_NOT_IN_SERVICE]
        excluded_because:
          difficulty_instance: result_requires_equipment_in_service
          rationale: "Result recording with CALIBRATION_DUE equipment asserted there."
      - name: err_esd_containment_priority_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ESD_CONTAINMENT]
        excluded_because:
          difficulty_instance: esd_safety_beats_slot_overlap
          rationale: "Dual-failure priority plus the single-failure corner esd_containment_single_failure both assert it."
      # Remaining catalog codes are triggered by validations/rbac/cross-cutting
      # instances in this file: ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED_ROLE,
      # ERR_FORBIDDEN_OWNERSHIP, ERR_NOT_FOUND, ERR_INVALID_REQUEST,
      # ERR_INVALID_STATE, ERR_REVIEW_PENDING, ERR_CUSTOMER_SUSPENDED,
      # ERR_RETEST_SEGREGATION, ERR_AUTHORIZATION_EXPIRED, ERR_PROGRAM_NOT_RELEASED,
      # ERR_PROGRAM_SUPERSEDED, ERR_FIXTURE_NOT_AVAILABLE, ERR_FIXTURE_PROGRAM_MISMATCH,
      # ERR_NO_AVAILABLE_FIXTURE, ERR_BIN_NOT_MAPPED, ERR_HARD_FAIL_NO_RETEST,
      # ERR_NO_ACTIVE_AUTHORIZATION, ERR_RESULT_IMMUTABLE, ERR_DUPLICATE_SERIAL,
      # ERR_QUANTITY_EXCEEDED, ERR_UNITS_INCOMPLETE, ERR_SLOT_CAPACITY_EXCEEDED,
      # ERR_PROFILE_NOT_SUPPORTED, ERR_MISSING_CORRECTIVE_ACTION.
      # ERR_STALE_VERSION is triggered by the two OCC instances below.

  # ---------------------------------------------------------------------------
  # Section: rbac
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: customer_rep_cannot_create_test_program_unauthorized
        claim_type: rbac_denial
        grounds:
          - roles
          - endpoints."POST /api/test-programs"
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "CustomerRep is outside the roles list of POST /api/test-programs: 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "RbacCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-235", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: CustomerRep, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE"

      - name: quality_engineer_cannot_record_results_unauthorized
        claim_type: rbac_denial
        grounds:
          - roles
          - endpoints."POST /api/test-results"
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "QualityEngineer may void results but may NOT record them: 403 on POST /api/test-results."
        test_recipe:
          setup: ["Lot of 1 IN_TEST with AVAILABLE fixture"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "RbacCo2", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-236", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-RB", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-236", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "RB-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
