          trigger:
            - call: "POST /discount-offers/${offer_a}/accept"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { err_supplier_on_named: "$.data.error_id" }
            - call: "POST /discount-offers/${offer_b}/accept"
              payload: {}
