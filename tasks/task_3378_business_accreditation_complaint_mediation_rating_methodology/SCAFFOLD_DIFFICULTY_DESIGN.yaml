            - "provisional score before the review was 88 (unanswered 12)"
            - "Business.${biz_id}.current_provisional_score == 73 after referral (12 + 15; hops 2-3) and current_provisional_grade == C_PLUS"
            - "a new PROVISIONAL RatingSnapshot exists with advertising_deduction == 15 and unanswered_deduction == 12"

