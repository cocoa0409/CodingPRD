    output: LatecomerReimbursement
    side_effects: ["status -> WAIVED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint, or acting entity-backed/opaque owner mismatch."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource or body FK reference does not exist."
  - id: ERR_METER_SIZE_UNKNOWN
    http: 422
    condition: "Application meter_size does not match any MeterSizeSchedule row."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not allowed from the resource's current state."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Approver X-User-ID equals the availability_reviewer_id (four-eyes violated)."
  - id: ERR_DETERMINATION_MISSING
    http: 422
    condition: "Approve attempted with no AvailabilityDetermination for the application."
  - id: ERR_SERVICE_UNAVAILABLE
    http: 422
    condition: "Approve attempted while a requested service is unavailable and no executed developer agreement covers it."
  - id: ERR_INSPECTION_NOT_PASSED
    http: 422
    condition: "Meter-set complete-install attempted before the TAP inspection passed."
  - id: ERR_BACKFLOW_NOT_CERTIFIED
    http: 422
    condition: "Activation attempted while backflow is required but not CERTIFIED."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "Window end is not strictly after window start."
  - id: ERR_INSPECTOR_UNAVAILABLE
    http: 409
    condition: "Inspection window overlaps another SCHEDULED/IN_PROGRESS inspection on the same inspector (half-open)."
  - id: ERR_CREW_UNAVAILABLE
    http: 409
    condition: "Meter-set appointment violates the buffer gap around another SCHEDULED/SET appointment on the same crew."
  - id: ERR_ESCROW_INSUFFICIENT
    http: 422
    condition: "Drawdown exceeds escrow_held_cents, or execute attempted before escrow fully funded."
  - id: ERR_FEES_UNPAID
    http: 402
    condition: "Activation attempted with fees_paid_cents < total_fees_due_cents."
  - id: ERR_REIMBURSEMENT_EXCEEDED
    http: 422
    condition: "Latecomer assessed share exceeds project.outstanding_recoverable_cents."
  - id: ERR_PROJECT_NOT_ACCEPTED
    http: 422
    condition: "Latecomer assessment attempted against a project not yet ACCEPTED."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match the parent's current version."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field or invalid enum/number value."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: Property owner/developer connecting a parcel; owns applications via applicant_user_id.
    identity: "opaque"
    exclusive_operations:
      - "POST /connection-applications (create; owns via applicant_user_id)"
      - "POST /connection-applications/{id}/submit|activate|withdraw|pay-fees"
      - "POST /backflow-assemblies/{id}/install"
    shared_operations:
      - "POST /inspections, POST /meter-sets (with FieldInspector, UtilityReviewer)"
      - "GET on own applications, availability, inspections, meter-sets, backflow, service-accounts"
  - name: Developer
    description: Party building a main extension and receiving latecomer reimbursements; owns projects/agreements via developer_user_id.
    identity: "opaque"
    exclusive_operations:
      - "POST /developer-agreements/{id}/execute"
      - "POST /developer-agreements/{id}/escrow-transactions"
      - "POST /main-extension-projects/{id}/start-construction"
    shared_operations:
      - "POST /main-extension-projects (with UtilityReviewer)"
      - "GET on developer-agreements, main-extension-projects, latecomer-reimbursements"
  - name: UtilityReviewer
    description: Reviews applications, records availability, approves/denies, accepts extensions, proposes projects.
    identity: "opaque"
    exclusive_operations:
      - "POST /connection-applications/{id}/start-review|request-revision|approve|deny"
      - "POST /availability-determinations"
      - "POST /main-extension-projects/{id}/accept|cancel"
    shared_operations:
      - "POST /main-extension-projects (with Developer)"
      - "POST /inspections (with Applicant, FieldInspector)"
      - "GET on applications, projects, inspections, backflow"
  - name: FieldInspector
    description: Performs inspections and meter-set field work; X-User-ID is an Inspector id.
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/schedule|start|pass|fail|cancel"
      - "POST /meter-sets/{id}/schedule|complete-install"
      - "POST /main-extension-projects/{id}/record-inspection"
    shared_operations:
      - "POST /inspections, POST /meter-sets (with Applicant, UtilityReviewer)"
      - "GET on inspections, meter-sets, inspectors, meter-crews, backflow"
  - name: UtilityAdmin
    description: Configures schedules/resources, manages developer agreements, accounts, and latecomer collections.
    identity: "opaque"
    exclusive_operations:
      - "POST /meter-size-schedules|/fee-schedules|/inspectors|/meter-crews"
      - "POST /developer-agreements and /offer|/close|/terminate"
      - "POST /latecomer-reimbursements and /collect|/waive"
      - "POST /service-accounts/{id}/suspend|reinstate|close"
      - "POST /meter-sets/{id}/remove"
    shared_operations:
      - "GET on all collections"
