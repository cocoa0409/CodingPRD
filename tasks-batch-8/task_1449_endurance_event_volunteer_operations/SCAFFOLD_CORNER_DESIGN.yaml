# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Endurance Event Volunteer Operations
# Breadth walk over §1.1–§1.7 per the claim-extraction guide. Claims already
# exercised by §1.8 instances are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: event_create_applies_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - entities.Event
        distinguishing_aspect: "POST /events returns 201 with status DRAFT, version 1, server-minted id, created_at == updated_at, and all six input fields echoed."
        test_recipe:
          setup: ["empty DB; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id, st: $.data.status, ver: $.data.version } }
          assert:
            - "response envelope: meta.api_request_id present, response_type == object"
            - "Event.${ev}: status == DRAFT (${st}), version == 1 (${ver}), id is a prefix-free UUID, created_at == updated_at"
      - name: role_entry_create_applies_defaults
        claim_type: defaults
        grounds:
          - entities.RoleCatalogEntry.fields.required_skill
          - entities.RoleCatalogEntry.fields.credit_weight
        distinguishing_aspect: "Omitting optional role fields yields required_skill NONE, required_training_module NONE, credit_weight 1.0, status ACTIVE."
        test_recipe:
          setup: ["event DRAFT exists"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { r: $.data.id, sk: $.data.required_skill, tm: $.data.required_training_module, cw: $.data.credit_weight, st: $.data.status } }
          assert:
            - "RoleCatalogEntry.${r}: required_skill == NONE (${sk}), required_training_module == NONE (${tm}), credit_weight == 1.0 (${cw}), status == ACTIVE (${st})"
      - name: volunteer_computed_age_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Volunteer.fields.age_years_on_event
          - calculations.age_years_on_event
        distinguishing_aspect: "Client-supplied age_years_on_event is ignored; the server computes 26 from DOB 2000-05-01 vs event date 2026-10-04."
        test_recipe:
          setup: ["event exists (any status)"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Age", date_of_birth: "2000-05-01", age_years_on_event: 99 }, as: Anonymous, captures: { v: $.data.id, age: $.data.age_years_on_event } }
          assert:
            - "Volunteer.${v}.age_years_on_event == 26 (${age}) — computed server-side; the injected 99 was ignored"
      - name: segment_invalid_terrain_enum_rejected
        claim_type: type_constraints
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - entities.CourseSegment.fields.terrain_type
        distinguishing_aspect: "terrain_type DESERT is outside {ROAD, TRAIL, BRIDGE, TRACK} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["event exists"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-X", mile_start: 1, mile_end: 2, terrain_type: DESERT }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "rejected 400 with error_id == ERR_INVALID_REQUEST (${err})"
      - name: shift_inverted_times_rejected
        claim_type: type_constraints
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - entities.Shift.fields.end_at
        distinguishing_aspect: "end_at <= start_at (equal or inverted) -> 400 ERR_INVALID_REQUEST; same for event windows and mile ranges."
        test_recipe:
          setup: ["event with segment and role exists"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
          trigger:
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T11:00:00Z", end_at: "2026-10-04T07:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "rejected 400 ERR_INVALID_REQUEST (${err}); no Shift persisted"
      - name: get_missing_shift_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_SHIFT_NOT_FOUND]"
        distinguishing_aspect: "GET /shifts/{random-uuid} -> 404 ERR_SHIFT_NOT_FOUND with error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /volunteer-ops/shifts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "404 with data.error_id == ERR_SHIFT_NOT_FOUND (${err}), response_type == error, data.message present"
      - name: volunteer_list_filtered_by_group
        claim_type: listing
        grounds:
          - entities.Volunteer.fields.group_id
        distinguishing_aspect: "GET /volunteers?group_id=G returns exactly the 2 volunteers affiliated with G out of 3 created."
        test_recipe:
          setup: ["event PUBLISHED-irrelevant; group G; volunteers V1,V2 in G, V3 unaffiliated"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/fundraising-groups", payload: { event_id: "${ev}", name: "Track Club", charity_code: "CHARITY-TC" }, as: EventDirector, captures: { grp: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01", group_id: "${grp}" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02", group_id: "${grp}" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Three", date_of_birth: "2000-01-03" }, as: Anonymous, captures: { v3: $.data.id } }
          trigger:
            - { call: "GET /volunteer-ops/volunteers?group_id=${grp}", as: VolunteerCoordinator }
          assert:
            - "response data contains exactly the ids {${v1}, ${v2}} and not ${v3}; total_count == 2"
      - name: training_record_create_defaults
        claim_type: defaults
        grounds:
          - entities.TrainingRecord.fields.status
          - entities.TrainingRecord.fields.attempt_count
        distinguishing_aspect: "New TrainingRecord starts ENROLLED with attempt_count 1 and null passed_at/valid_until."
        test_recipe:
          setup: ["event + volunteer exist"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /volunteer-ops/training-records", payload: { event_id: "${ev}", volunteer_id: "${v1}", module_code: MEDICAL_RESPONSE }, as: VolunteerCoordinator, captures: { tr: $.data.id, st: $.data.status, att: $.data.attempt_count } }
          assert:
            - "TrainingRecord.${tr}: status == ENROLLED (${st}), attempt_count == 1 (${att}), passed_at == null, valid_until == null"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_requested_rejected
        claim_type: invalid_transition
        grounds:
          - "errors[ERR_SIGNUP_NOT_CONFIRMABLE]"
          - state_machines.Signup.APPROVED_to_CONFIRMED
        distinguishing_aspect: "Skipping approve: confirm directly from REQUESTED -> ERR_SIGNUP_NOT_CONFIRMABLE; signup stays REQUESTED."
        test_recipe:
          setup: ["PUBLISHED event, OPEN shift, ELIGIBLE volunteer with a REQUESTED signup"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 2 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
          trigger:
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "rejected 409 ERR_SIGNUP_NOT_CONFIRMABLE (${err})"
            - "GET signup shows status still REQUESTED"
      - name: terminal_cancelled_signup_rejects_approve
        claim_type: terminal_lockdown
        grounds:
          - "errors[ERR_SIGNUP_NOT_APPROVABLE]"
          - state_machines.Signup.REQUESTED_to_CANCELLED
        distinguishing_aspect: "CANCELLED is terminal: approve on a cancelled signup -> ERR_SIGNUP_NOT_APPROVABLE (idempotency of terminal state)."
        test_recipe:
          setup: ["signup S1 REQUESTED then cancelled by its volunteer"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 2 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/cancel", payload: {}, as: Volunteer, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "rejected 409 ERR_SIGNUP_NOT_APPROVABLE (${err}); a second cancel also fails ERR_SIGNUP_NOT_CANCELLABLE"
      - name: role_suspend_blocks_signup_then_reactivate_restores
        claim_type: precondition_enforcement
        grounds:
          - "errors[ERR_ROLE_ENTRY_NOT_ACTIVE]"
          - state_machines.RoleCatalogEntry.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "While a role is SUSPENDED both new shifts AND new signups against its existing shifts fail ERR_ROLE_ENTRY_NOT_ACTIVE; reactivate restores signup creation (cyclic ACTIVE->SUSPENDED->ACTIVE)."
        test_recipe:
          setup: ["PUBLISHED event; role R with one shift; R suspended"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 2 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/role-catalog-entries/${role}/suspend", payload: {}, as: VolunteerCoordinator, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T12:00:00Z", end_at: "2026-10-04T14:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /volunteer-ops/role-catalog-entries/${role}/reactivate", payload: {}, as: VolunteerCoordinator, captures: { st2: $.data.status } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg: $.data.id, sg_st: $.data.status } }
          assert:
            - "suspended: signup -> ERR_ROLE_ENTRY_NOT_ACTIVE (${err1}); new shift -> ERR_ROLE_ENTRY_NOT_ACTIVE (${err2})"
            - "cycle leg: suspend showed SUSPENDED (${st1}), reactivate shows ACTIVE (${st2})"
            - "after reactivate the same signup succeeds 201 REQUESTED (${sg_st})"
      - name: shift_reconcile_blocked_with_unresolved_confirmed
        claim_type: precondition_enforcement
        grounds:
          - "errors[ERR_SHIFT_HAS_UNRESOLVED_SIGNUPS]"
          - state_machines.Shift.IN_PROGRESS_to_RECONCILED
        distinguishing_aspect: "reconcile while a CONFIRMED signup remains (never checked in, never marked no-show) -> ERR_SHIFT_HAS_UNRESOLVED_SIGNUPS."
        test_recipe:
          setup: ["event COMPLETED; shift IN_PROGRESS; one signup still CONFIRMED"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T08:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T22:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/complete", payload: {}, as: EventDirector }
          trigger:
            - { call: "POST /volunteer-ops/shifts/${sh}/reconcile", payload: {}, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "rejected 409 ERR_SHIFT_HAS_UNRESOLVED_SIGNUPS (${err}); shift stays IN_PROGRESS"
      - name: captain_assignment_requires_current_captain_course
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=7]"
          - state_machines.Signup
          - ERR_TRAINING_NOT_CURRENT
