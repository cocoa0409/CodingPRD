  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_visit_cap_four_term_min_selects_annual_remainder
        grounds:
          - calculations.per_visit_disbursement_cap
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear min() interaction. Pinned so
          each of the four terms is the binding minimum in a distinct probe of
          the same fixture family — this instance pins annual-remainder
          (annual_max 25, ytd 21 => 4) below per-visit max (10), rep balance
          (30), and entry remainder (24): quantity 5 must be rejected while 4
          succeeds, proving the min() selected term 2.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Region/Territory/rep S; ELIGIBLE prescriber H; product P with per_visit_max 10, annual_max 25."
            - "Lot with 100 units; 30 issued to S."
            - "Tier-A entry (24 planned units); plan published; one visit completed today."
            - "H already has 21 SIGNED units this calendar year via three earlier signed disbursements (7+7+7)."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "MW-01", name: "Midwest" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
