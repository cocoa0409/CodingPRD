  # ============================================================================
  # SECTION 9 — consistency_model
  # Every write in this domain is immediately consistent: cascades, derived
  # fields and ledgers are all settled inside the request that triggers them.
  # There is no eventual-consistency surface and no saga with compensating
  # steps spread across requests.
  # ============================================================================
  - section: consistency_model
    instances:

      - name: every_cascade_is_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - endpoints[POST /carriage/subscriber-reports/{reportId}/review]
          - state_machines.CarriageAgreement.EXECUTED_to_SUSPENDED
          - state_machines.RightsWindow.CLEARED_to_BLOCKED
          - calculations.agreement_penetration_compliance
          - entities.ContentTitle.fields.distribution_coverage_status
        distinguishing_aspect: >-
          The model is immediate, not eventual: the very first read after a single
          ACCEPT that trips the second penetration breach already shows the agreement
          SUSPENDED, its window BLOCKED and the title's coverage re-derived — there is
          no polling loop, no retry and no intermediate state in which the report is
          ACCEPTED but the agreement is still EXECUTED.
        test_recipe:
          setup:
            - "Cliffside Telco, 200,000 homes, floor 0.50 → floor_subscribers 100,000; agreement EXECUTED."
            - "A cleared title and one CLEARED LINEAR/US window on that agreement."
            - "One accepted 2026-05 report at 90,000 subscribers, so penetration_breach_count is already 1."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 150000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dc_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dc_id}"
                contract_code: "CT-IMMED"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_id: "id"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_v1: "version"
            - call: "POST /carriage/content-titles"
              payload:
                title: "Night Circuit"
                home_territory_code: "US"
                linear_premiere_at: "2026-01-15T00:00:00Z"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                ct_id: "id"
            - call: "POST /carriage/content-titles/${ct_id}/rights-status"
              payload:
                rights_status: "OWNED_CLEARED"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${ac_id}"
                content_title_id: "${ct_id}"
                platform: "LINEAR"
                territory_code: "US"
                window_start: "2026-10-01T00:00:00Z"
                window_end: "2026-10-08T00:00:00Z"
                exclusivity: "NON_EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                w_id: "id"
            - call: "POST /carriage/rights-windows/${w_id}/lifecycle"
              payload:
                action: "CLEAR"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${ac_id}"
                period_month: "2026-05"
                reported_subscribers: 90000
                reported_tier: "BASIC"
                expected_agreement_version: "${ac_v1}"
              as: DistributorLiaison
              as_user_id: "${dc_id}"
              captures:
                r1_id: "id"
            - call: "POST /carriage/subscriber-reports/${r1_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "GET /carriage/agreements/${ac_id}"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                ac_v2: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${ac_id}"
                period_month: "2026-06"
                reported_subscribers: 95000
                reported_tier: "BASIC"
