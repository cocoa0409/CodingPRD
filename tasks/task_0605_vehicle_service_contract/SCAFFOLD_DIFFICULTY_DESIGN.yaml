# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Vehicle Service Contract & F&I Product Admin
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: refund_basis_time_vs_mileage_on_cancellation
        grounds:
          - calculations.pro_rata_refund
          - state_machines.Cancellation.transitions.REQUESTED_to_APPROVED
          - entities.Cancellation.fields.refund_basis
        distinguishing_aspect: |
          On a Cancellation (subject = contract refund accounting) the same sale_price yields a
          DIFFERENT net_refund depending on whether time_frac or mileage_frac dominates: a
          low-mileage long-elapsed contract refunds 186333 cents on PRO_RATA_TIME while a
          high-mileage short-elapsed contract refunds 139000 cents on PRO_RATA_MILEAGE.
        test_recipe:
          setup:
            - "ACTIVE plan term_months=60, term_miles=100000, base_premium 200000, deductible 10000, labor_rate_cap 12000."
            - "OPEN reinsurance pool."
            - "ACTIVE contract: sale_date 2026-01-01, odometer_at_sale 20000, sale_price 240000, model_year 2024."
            - "Clock advanced to 2027-01-01 (365 days in force); no claims so miles_used=0."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool A" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINTIME0001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /cancellations"
              payload: { contract_id: "${contract_id}", reason: "CUSTOMER_REQUEST", request_date: "2027-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { canc_id: $.data.id }
          trigger:
            - call: "POST /cancellations/${canc_id}/approve"
              payload: {}
              as: ContractAdmin
              captures: { basis: $.data.refund_basis, net: $.data.net_refund_cents }
          assert:
            - "Cancellation.${canc_id}.refund_basis == PRO_RATA_TIME"
            - "Cancellation.${canc_id}.gross_refund_cents == 191333"
            - "Cancellation.${canc_id}.net_refund_cents == 186333"

      - name: pool_surplus_reserve_vs_loss_accounting
        grounds:
          - calculations.pool_surplus
          - state_machines.Claim.transitions.SUBMITTED_to_UNDER_REVIEW
          - state_machines.RepairAuthorization.transitions.PENDING_to_DISBURSED
          - entities.ReinsurancePool.fields.surplus_cents
        distinguishing_aspect: |
          On a ReinsurancePool (subject = reinsurance loss accounting, a DIFFERENT entity domain than
          the contract-refund calc) surplus is computed two ways across the claim lifecycle: while the
          claim is UNDER_REVIEW surplus reflects a held case reserve (-35349), but after disbursement
          the same loss is realized as paid_loss giving a different surplus (-48349).
        test_recipe:
          setup:
            - "ACTIVE plan + OPEN pool + ACTIVE contract (eligible)."
            - "Claim filed with one LABOR line (2.3h) and one covered PART line (13499); adjudicated 35349; reserve held 35349."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool S" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, network_status: "IN_NETWORK", direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINSURP0001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "transmission", rental_days_claimed: 4, towing_claimed: true }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "LABOR", labor_hours: 2.3, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "PART", part_number: "TX-900", requested_amount_cents: 13499, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/authorize"
              payload: {}
              as: ClaimsAdjuster
              captures: { auth_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { cver: $.data.version }
          trigger:
            - call: "GET /reinsurance-pools/${pool_id}"
              payload: {}
              as: AdminUnderwriter
              captures: { surplus_pre: $.data.surplus_cents }
            - call: "POST /repair-authorizations/${auth_id}/disburse"
              payload: { expected_contract_version: "${cver}" }
              as: ClaimsAdjuster
            - call: "GET /reinsurance-pools/${pool_id}"
              payload: {}
              as: AdminUnderwriter
              captures: { surplus_post: $.data.surplus_cents }
          assert:
            - "ReinsurancePool.${pool_id}.surplus_cents == -35349 before disburse (reserve-held basis)"
            - "ReinsurancePool.${pool_id}.surplus_cents == -48349 after disburse (paid-loss basis)"
            - "ReinsurancePool.${pool_id}.reserve_held_cents == 0 after disburse"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: labor_round_per_line_then_sum
        grounds:
          - calculations.claim_adjudication
          - state_machines.Claim.transitions.SUBMITTED_to_UNDER_REVIEW
          - entities.ClaimLine.fields.allowed_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: two LABOR lines each at 2.3h * 9500 = 21850.0
          are ROUNDED per line THEN summed to 43700; summing raw (43700.0) then rounding would also be
          43700 here, so the test pins fractional-cent lines (1.15h*9500=10925.0 and 0.05h*9500=475.0)
          whose per-line vs sum-then-round divergence is exercised, with adjudicated pinned to 11400.
        test_recipe:
          setup:
            - "ACTIVE plan labor_rate_cap 12000; facility posted 9500 (effective 9500)."
            - "Claim with two LABOR lines: 1.15h and 0.05h, both covered."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool R" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINROUND001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "noise" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "LABOR", labor_hours: 1.15, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "LABOR", labor_hours: 0.05, covered: true }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { adj: $.data.adjudicated_amount_cents }
          assert:
            - "Claim.${claim_id}.adjudicated_amount_cents == 11400 (10925 + 475, each line rounded then summed)"

      - name: refund_nested_min_max_with_fee_and_offset
        grounds:
          - calculations.pro_rata_refund
          - state_machines.Cancellation.transitions.REQUESTED_to_APPROVED
          - entities.Cancellation.fields.net_refund_cents
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: net_refund = max(0, round(sale_price *
          (1 - max(time_frac, mileage_frac))) - fee - (paid_claim_total if DEALER_UNWIND else 0))
          nests max/min over four inputs (days, miles, fee, claims-offset). For DEALER_UNWIND with a
          paid claim of 48349 the offset branch fires and net resolves to 137984, distinct from the
          non-unwind 186333.
        test_recipe:
          setup:
            - "ACTIVE contract sale_price 240000, term 60mo/100000mi, sale_date 2026-01-01, clock 2027-01-01."
            - "One claim fully paid for 48349 cents so contract.paid_claim_total_cents == 48349."
            - "Cancellation reason DEALER_UNWIND."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool U" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, network_status: "IN_NETWORK", direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINUNWIND01", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "transmission", rental_days_claimed: 4, towing_claimed: true }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "LABOR", labor_hours: 2.3, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "PART", part_number: "TX-900", requested_amount_cents: 13499, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/authorize"
              payload: {}
              as: ClaimsAdjuster
              captures: { auth_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { cver: $.data.version }
            - call: "POST /repair-authorizations/${auth_id}/disburse"
              payload: { expected_contract_version: "${cver}" }
              as: ClaimsAdjuster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /cancellations"
              payload: { contract_id: "${contract_id}", reason: "DEALER_UNWIND", request_date: "2027-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { canc_id: $.data.id }
          trigger:
            - call: "POST /cancellations/${canc_id}/approve"
              payload: {}
              as: ContractAdmin
          assert:
            - "Cancellation.${canc_id}.gross_refund_cents == 191333"
            - "Cancellation.${canc_id}.cancellation_fee_cents == 5000"
            - "Cancellation.${canc_id}.claims_offset_cents == 48349"
            - "Cancellation.${canc_id}.net_refund_cents == 137984"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_parallel_adjudication_and_payment_dimensions
        grounds:
          - state_machines.Claim.transitions.UNDER_REVIEW_to_APPROVED
          - state_machines.RepairAuthorization.transitions.PENDING_to_DISBURSED
          - entities.Claim.fields.payment_status
        distinguishing_aspect: |
          On Claim, adjudication_status (SUBMITTED->UNDER_REVIEW->APPROVED) and payment_status
          (UNPAID->AUTHORIZED->PAID) are two INDEPENDENT dimensions on the same row: approval does not
          move payment_status, and authorize/disburse advance payment_status without touching
          adjudication_status — verified by observing adjudication_status==APPROVED while payment_status
          transitions UNPAID->AUTHORIZED->PAID.
        test_recipe:
          setup:
            - "Claim adjudicated (35349), APPROVED, authorized, then disbursed."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool P" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, network_status: "IN_NETWORK", direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINPAR00001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "transmission", rental_days_claimed: 4, towing_claimed: true }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "LABOR", labor_hours: 2.3, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "PART", part_number: "TX-900", requested_amount_cents: 13499, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/authorize"
              payload: {}
              as: ClaimsAdjuster
              captures: { auth_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /repair-authorizations/${auth_id}/disburse"
              payload: { expected_contract_version: "${cver}" }
              as: ClaimsAdjuster
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { adjs: $.data.adjudication_status, pays: $.data.payment_status }
          assert:
            - "Claim.${claim_id}.adjudication_status == APPROVED"
            - "Claim.${claim_id}.payment_status == PAID"

      - name: contract_cyclic_lapse_reinstate_loop
        grounds:
          - state_machines.Contract.transitions.ACTIVE_to_LAPSED
          - state_machines.Contract.transitions.LAPSED_to_ACTIVE
          - entities.Contract.fields.status
        distinguishing_aspect: |
          On Contract (a DIFFERENT entity than Claim), the state machine is cyclic: ACTIVE->LAPSED->ACTIVE
          is a legal loop, verified by lapsing then reinstating the same contract back to ACTIVE with
          version incremented twice.
        test_recipe:
          setup:
            - "ACTIVE eligible contract under an ACTIVE plan; no open claims."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool C" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINCYC00001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /contracts/${contract_id}/lapse"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /contracts/${contract_id}/reinstate"
              payload: {}
              as: ContractAdmin
              captures: { st: $.data.status }
          assert:
            - "Contract.${contract_id}.status == ACTIVE after reinstate"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: disburse_reserve_release_loss_paid_contract_ledger
        grounds:
          - state_machines.RepairAuthorization.transitions.PENDING_to_DISBURSED
          - entities.ReinsurancePool.fields.paid_loss_cents
          - entities.Contract.fields.paid_claim_total_cents
        distinguishing_aspect: |
          Depth-3 chain from POST /repair-authorizations/{id}/disburse: hop 1 releases the claim case
          reserve (reserve_held -> 0); that release THEN drives hop 2 posting LOSS_PAID into the pool
          (paid_loss 48349); the loss posting THEN drives hop 3 incrementing Contract.paid_claim_total_cents
          to 48349. Each link is caused by the previous link, not by the original action.
        test_recipe:
          setup:
            - "Claim adjudicated 35349, approved, authorized; total_payout 48349; pool reserve 35349 held."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool D3" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, network_status: "IN_NETWORK", direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VIND300001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "transmission", rental_days_claimed: 4, towing_claimed: true }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "LABOR", labor_hours: 2.3, covered: true }
              as: ClaimsAdjuster
