            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.900, post_closure_annual_cost: 96000.00, inflation_pct: 0.03, post_closure_years: 30, expected_landfill_version: "${lf_v2}" }
              as: FinanceOfficer
