        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Quote.ISSUED_to_ACCEPTED]
        distinguishing_aspect: "Immediate consistency: the accept response returns the ACCEPTED quote, and the very next read of /api/contracts?quote_id= already shows the cascade-created Contract with the locked unit price copied."
        test_recipe:
          setup: ["Index 20000; lane 420mi; buyer 1000000; quote PREMIUM 12.0t ISSUED"]
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", distance_miles: 420, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer AO", region_code: "CA-NORTH", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b_id}", forage_type: "ALFALFA", quality_tier: "PREMIUM", tons: 12.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b_id}", captures: { q_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q_id}/issue", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { q_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/quotes/${q_id}/accept", payload: { expected_quote_version: "${q_v}" }, as: Buyer, as_user_id: "${b_id}", captures: { q_st: "$.data.status" } }
            - { call: "GET /api/contracts?quote_id=${q_id}", payload: {}, as: BrokerOps, captures: { ct_unit: "$.data[0].unit_price_cents", ct_st: "$.data[0].status", ct_tons: "$.data[0].committed_tons" } }
          assert:
