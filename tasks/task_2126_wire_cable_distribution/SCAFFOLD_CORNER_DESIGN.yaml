  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_quote_version_on_line_add_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-line-add-stale-quote]
          - errors[ERR_STALE_QUOTE_VERSION]
          - validations[priority=28]
        distinguishing_aspect: "Adding a second line while still carrying the version observed before the first line was added returns ERR_STALE_QUOTE_VERSION (412); resending with the current version succeeds, and the quote ends with exactly two lines."
        test_recipe:
          setup:
            - "One branch, one customer, product P1, index CI1 and a DRAFT quote whose version was captured at creation."
            - "One 300 ft CUT line has already been added using that captured version, which advanced the quote's version by one."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
