  - rule_id: compensating_invariant
    instances:
      - name: fund_cash_is_conserved_across_collection_expenditure_and_refund
        grounds:
          - calculations.fund_posture
          - calculations.fifo_expenditure_vintage_consumption
          - state_machines.FundLedgerEntry.REFUND_DUE_to_REFUNDED
          - entities.FacilityCategory.fields.fund_balance_cents
          - entities.FacilityCategory.fields.refund_due_cents
        distinguishing_aspect: |
          fund_balance_cents is a derived total that must always equal
          sum(COLLECTION) - sum(EXPENDITURE) - sum(REFUND), and it must also equal the sum
          of unexpended_cents over the live COLLECTION rows: 5,235,860 after two
          collections, 2,235,860 after a 3,000,000 FIFO expenditure that exhausts the
          oldest vintage first, and exactly 0 after the statutory refund of the remaining
          2,235,860 - with no drift and with oldest_unexpended_vintage_at back to null.
        test_recipe:
          setup:
            - "HARBOR program with an EFFECTIVE study; two 10-dwelling SINGLE_FAMILY PERMIT applications BP-1001 and BP-1002, both assessed at net_due 5,189,521."
