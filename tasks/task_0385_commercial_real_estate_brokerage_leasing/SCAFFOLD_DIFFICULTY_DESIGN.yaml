  - rule_id: compensating_invariant
    instances:
      - name: commission_split_conserves_total_commission
        grounds:
          - calculations.commission_split
          - entities.CommissionSplit.fields.amount
          - entities.Deal.fields.total_commission
          - state_machines.Deal.LEASE_OUT_to_EXECUTED
        distinguishing_aspect: |
          Conserved quantity #1 = DOLLARS (Deal.total_commission). The forward action
          (execute) writes LISTING + PROCURING rows; the invariant LISTING.amount +
          PROCURING.amount == Deal.total_commission holds exactly (9450.00) because listing
          is the residual, not independently rounded — no penny drift.
        test_recipe:
          setup:
            - "Same EXECUTED co-broke deal as commission_residual_rounding_order (total_commission 9450.00, co_broke 0.3333)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "CI1 List", side: "LISTING" }
