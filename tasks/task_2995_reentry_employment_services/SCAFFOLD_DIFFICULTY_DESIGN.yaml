- rule_id: compensating_invariant
  instances:
  - name: grant_money_conservation_across_approve_then_void
    grounds:
    - calculations.grant_ledger
    - state_machines.SupportRequest_status.SUBMITTED_to_APPROVED
    - state_machines.SupportRequest_status.APPROVED_to_VOIDED
    - validations[priority=10,rule_id=settler-is-not-reviewer]
    - entities.FunderGrant.fields.authorized_cents
    distinguishing_aspect: 'Conserved quantity: MONEY in integer cents — authorized_cents == available_cents + committed_cents
      + disbursed_cents must hold both after the approval commits 8240 and after the void releases it, with the ledger
      returning exactly to its opening figures (no drift).'
    test_recipe:
      setup:
      - Logical clock at 2026-08-01T08:00:00.000Z.
      - Participant p1 registered; FunderGrant g1 authorized_cents 100000, per_participant_cap_cents 60000 (restricted_floor
        15000).
      - 'SupportRequest sr1: ID_FEE 8000 x 1 -> requested 8000, admin fee 240, total_charge_cents 8240, submitted
        by cm-1 and reviewed APPROVED by pd-1.'
      - 'Ledger read immediately after the approval: committed 8240, disbursed 0, available 91760.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Andre Colwell
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /grants
        payload:
          funder_name: Statewide Reentry Fund
          program_year: 2026
          authorized_cents: 100000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 50.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_a: $.data.version
      - call: POST /support-requests
        payload:
          participant_id: ${p1_id}
          grant_id: ${g1_id}
          category: ID_FEE
          expected_grant_version: ${g1_v_a}
          line_items:
          - description: State ID replacement fee
            unit_cost_cents: 8000
            quantity: 1
          justification: State photo ID required before onboarding
        as: CaseManager
        as_user_id: cm-1
        captures:
          sr1_id: $.data.id
      - call: POST /support-requests/${sr1_id}/review
        payload:
          decision: APPROVED
          review_note: Approved as submitted
        as: ProgramDirector
        as_user_id: pd-1
      - call: GET /grants/${g1_id}/ledger
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          c1: $.data.committed_cents
          d1: $.data.disbursed_cents
          a1: $.data.available_cents
          o1: $.data.open_request_count
      trigger:
      - call: POST /support-requests/${sr1_id}/settle
        payload:
          to_status: VOIDED
          settlement_note: Participant obtained the ID free of charge through the facility
        as: ProgramDirector
        as_user_id: pd-2
      - call: GET /grants/${g1_id}/ledger
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          c2: $.data.committed_cents
          d2: $.data.disbursed_cents
          a2: $.data.available_cents
          o2: $.data.open_request_count
          f2: $.data.funding_posture
          rf2: $.data.restricted_floor_cents
      assert:
      - 'before the void: committed_cents ${c1} == 8240, disbursed_cents ${d1} == 0, available_cents ${a1} == 91760'
      - 'before the void the invariant holds: 100000 == ${a1} + ${c1} + ${d1}'
      - open_request_count ${o1} == 0 (an APPROVED request is not an open request)
      - 'after the void: committed_cents ${c2} == 0, disbursed_cents ${d2} == 0, available_cents ${a2} == 100000'
      - 'after the void the invariant still holds: 100000 == ${a2} + ${c2} + ${d2}'
      - the void restores available_cents exactly to authorized_cents — no cent of drift
      - SupportRequest.${sr1_id}.status == VOIDED with settled_by_user_id == "pd-2"
      - SupportRequest.${sr1_id}.total_charge_cents == 8240 (the amount itself is never rewritten)
      - open_request_count ${o2} == 0 and funding_posture ${f2} == OPEN
      - restricted_floor_cents ${rf2} == 15000
  - name: session_seat_conservation_across_enroll_withdraw_reenroll
    grounds:
    - calculations.capacity_counters
    - state_machines.SessionEnrollment_status.ENROLLED_to_WITHDRAWN
    - validations[priority=12,rule_id=enrollment-unique-per-session]
    - entities.ReadinessSession.fields.seat_capacity
    - entities.ReadinessSession.fields.remaining_seats
    distinguishing_aspect: 'Conserved quantity: SEAT CAPACITY as a counted resource (not money) — seat_capacity ==
      enrolled_count + remaining_seats must hold at all three observation points, and the WITHDRAWN transition is
      the compensating half that returns the seat so the same participant can re-enroll.'
    test_recipe:
      setup:
      - Logical clock at 2026-08-01T08:00:00.000Z.
      - Participants p1 and p2 registered.
      - 'ReadinessSession s1: RESUME_LAB with coach-1 on 2026-08-03 13:00-15:00, seat_capacity 3, SCHEDULED.'
      - Both participants enrolled -> enrolled_count 2, remaining_seats 1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Andre Colwell
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Denise Whitlock
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p2_id: $.data.id
      - call: POST /readiness-sessions
        payload:
          session_type: RESUME_LAB
          coach_user_id: coach-1
          starts_at: '2026-08-03T13:00:00.000Z'
          ends_at: '2026-08-03T15:00:00.000Z'
          seat_capacity: 3
        as: CaseManager
        as_user_id: cm-1
        captures:
          s1_id: $.data.id
      - call: POST /readiness-sessions/${s1_id}/enrollments
        payload:
          participant_id: ${p1_id}
          disclosure_script_reviewed: true
        as: CaseManager
        as_user_id: cm-1
        captures:
          e1_id: $.data.id
      - call: POST /readiness-sessions/${s1_id}/enrollments
        payload:
          participant_id: ${p2_id}
          disclosure_script_reviewed: false
        as: CaseManager
        as_user_id: cm-1
        captures:
          e2_id: $.data.id
      - call: GET /readiness-sessions/${s1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          ec1: $.data.enrolled_count
          rs1: $.data.remaining_seats
      trigger:
      - call: POST /enrollments/${e1_id}/status
        payload:
          to_status: WITHDRAWN
        as: CaseManager
        as_user_id: cm-1
      - call: GET /readiness-sessions/${s1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          ec2: $.data.enrolled_count
          rs2: $.data.remaining_seats
      - call: POST /readiness-sessions/${s1_id}/enrollments
        payload:
          participant_id: ${p1_id}
          disclosure_script_reviewed: true
        as: CaseManager
        as_user_id: cm-1
        captures:
          e3_id: $.data.id
      - call: GET /readiness-sessions/${s1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          ec3: $.data.enrolled_count
          rs3: $.data.remaining_seats
      assert:
      - 'observation 1: enrolled_count ${ec1} == 2 and remaining_seats ${rs1} == 1, so 3 == ${ec1} + ${rs1}'
      - 'observation 2 (after WITHDRAWN): enrolled_count ${ec2} == 1 and remaining_seats ${rs2} == 2, so 3 == ${ec2}
        + ${rs2}'
      - 'observation 3 (after re-enrolment): enrolled_count ${ec3} == 2 and remaining_seats ${rs3} == 1, so 3 == ${ec3}
        + ${rs3}'
      - SessionEnrollment.${e1_id}.status == WITHDRAWN
      - SessionEnrollment.${e3_id}.status == ENROLLED — permitted because enrollment-unique-per-session counts only
        {ENROLLED, ATTENDED, NO_SHOW}
      - SessionEnrollment.${e2_id}.status == ENROLLED throughout
      - GET /readiness-sessions/${s1_id}/enrollments returns total_count == 3 (one WITHDRAWN, two ENROLLED)
      - ReadinessSession.${s1_id}.seat_capacity == 3 at every observation — the capacity itself never changes
