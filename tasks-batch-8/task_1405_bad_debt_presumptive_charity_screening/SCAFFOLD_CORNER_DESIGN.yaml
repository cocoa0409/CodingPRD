scaffold_corner_design:
  # ===========================================================================
  # Section: entities (§1.1) — CRUD, defaults, computed fields, required fields
  # ===========================================================================
  - section: entities
    instances:
      - name: account_creation_sets_computed_defaults
        claim_type: creation
        grounds:
          - entities.SelfPayAccount
        distinguishing_aspect: "POST /self-pay/accounts with valid input returns 201 with computed fields initialized: current_balance_cents == original_balance_cents, status == OPEN, statements_sent_count == 0, charity_writeoff_total_cents == 0, bad_debt_writeoff_total_cents == 0, recovery_total_cents == 0, credit_reporting_status == NOT_REPORTED, aging_bucket derived from clock."
        test_recipe:
          setup: ["Logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-K1", patient_name: "K1", original_balance_cents: 50000, guarantor_liability_date: "2026-07-15" }
              as: Collector
              captures: { acct_k1: $.data.id }
          assert:
            - "SelfPayAccount.${acct_k1}.current_balance_cents == 50000"
            - "SelfPayAccount.${acct_k1}.status == OPEN"
            - "SelfPayAccount.${acct_k1}.statements_sent_count == 0"
            - "SelfPayAccount.${acct_k1}.credit_reporting_status == NOT_REPORTED"
            - "SelfPayAccount.${acct_k1}.aging_bucket == CURRENT  (17 days outstanding)"

      - name: account_creation_missing_required_field_returns_invalid_request
        claim_type: required_field_validation
        grounds:
          - entities.SelfPayAccount.fields.patient_mrn
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /self-pay/accounts missing patient_mrn returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /self-pay/accounts"
              payload: { patient_name: "NoMRN", original_balance_cents: 50000, guarantor_liability_date: "2026-07-15" }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: account_retrieval_by_id_returns_persisted_fields
        claim_type: retrieval
        grounds:
          - entities.SelfPayAccount
        distinguishing_aspect: "GET /self-pay/accounts/{id} returns the persisted entity with all input fields intact."
        test_recipe:
          setup: ["Account K2 exists"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-K2", patient_name: "K2 Name", original_balance_cents: 75000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_k2: $.data.id }
          trigger:
            - call: "GET /self-pay/accounts/${acct_k2}"
              as: Collector
          assert:
            - "SelfPayAccount.${acct_k2}.patient_mrn == 'MRN-K2'"
            - "SelfPayAccount.${acct_k2}.patient_name == 'K2 Name'"
            - "SelfPayAccount.${acct_k2}.original_balance_cents == 75000"

      - name: account_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /self-pay/accounts/{nonexistent-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /self-pay/accounts/00000000-0000-0000-0000-000000000000"
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: statement_due_date_computed_from_cycle
        claim_type: computed_field
        grounds:
          - entities.Statement.fields.due_date
          - calculations.statement_cycle
        distinguishing_aspect: "Statement.due_date = guarantor_liability_date + statement_index * 30 days. First statement on an account with guarantor_liability_date 2026-01-10 has due_date 2026-02-09."
        test_recipe:
          setup: ["Account K3 with guarantor_liability_date 2026-01-10"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-K3", patient_name: "K3", original_balance_cents: 100000, guarantor_liability_date: "2026-01-10" }
              as: Collector
              captures: { acct_k3: $.data.id }
          trigger:
            - call: "POST /self-pay/accounts/${acct_k3}/statements"
              payload: {}
              as: Collector
              captures: { stmt_k3: $.data.id }
          assert:
            - "Statement.${stmt_k3}.statement_index == 1"
            - "Statement.${stmt_k3}.due_date == '2026-02-09'"
            - "Statement.${stmt_k3}.status == SENT"
            - "Statement.${stmt_k3}.balance_at_issue_cents == 100000"

      - name: screening_list_filtered_by_account
        claim_type: listing
        grounds:
          - entities.PresumptiveCharityScreening
        distinguishing_aspect: "GET /self-pay/accounts/{id}/presumptive-charity-screenings returns only screenings for that account; pagination envelope contains limit, offset, total_count, has_more."
        test_recipe:
          setup: ["Account K4 with 2 screenings; Account K5 with 1 screening"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-K4", patient_name: "K4", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_k4: $.data.id, acct_k4_v: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_k4}", screening_model: "FPL_TIERED", household_size: 1, household_income_cents: 1000000, expected_account_version: "${acct_k4_v}" }
              as: FinancialCounselor
            - call: "GET /self-pay/accounts/${acct_k4}"
              as: FinancialCounselor
              captures: { acct_k4_v2: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_k4}", screening_model: "SCORE_BASED", third_party_score: 800, expected_account_version: "${acct_k4_v2}" }
              as: FinancialCounselor
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-K5", patient_name: "K5", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_k5: $.data.id, acct_k5_v: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_k5}", screening_model: "FPL_TIERED", household_size: 4, household_income_cents: 9000000, expected_account_version: "${acct_k5_v}" }
              as: FinancialCounselor
          trigger:
            - call: "GET /self-pay/accounts/${acct_k4}/presumptive-charity-screenings"
              as: FinancialCounselor
          assert:
            - "length(response.data) == 2"
            - "every screening in response.data has account_id == ${acct_k4}"

  # ===========================================================================
  # Section: state_machines (§1.2) — invalid transitions, terminal lockdown, etc.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: statement_mark_delivered_from_returned_is_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.Statement.SENT_to_DELIVERED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Statement in RETURNED_UNDELIVERABLE (terminal) cannot transition to DELIVERED; returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account L1 with 1 statement S_L1 marked RETURNED_UNDELIVERABLE"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-L1", patient_name: "L1", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_l1: $.data.id }
            - call: "POST /self-pay/accounts/${acct_l1}/statements"
              payload: {}
              as: Collector
              captures: { stmt_l1: $.data.id }
            - call: "POST /self-pay/statements/${stmt_l1}/mark-returned"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /self-pay/statements/${stmt_l1}/mark-delivered"
              payload: {}
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Statement.${stmt_l1}.status == RETURNED_UNDELIVERABLE  (unchanged)"

      - name: writeoff_approve_from_posted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.BadDebtWriteOff.PENDING_APPROVAL_to_POSTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving an already-POSTED write-off is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account L2 with POSTED write-off W_L2"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-L2", patient_name: "L2", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_l2: $.data.id }
            - call: "POST /self-pay/accounts/${acct_l2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_l2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_l2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_l2}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_l2: $.data.id }
            - call: "GET /self-pay/accounts/${acct_l2}"
              as: RevenueIntegrityOfficer
              captures: { acct_l2_v: $.data.version }
            - call: "POST /self-pay/bad-debt-write-offs/${wo_l2}/approve"
              payload: { expected_account_version: "${acct_l2_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
            - call: "GET /self-pay/accounts/${acct_l2}"
              as: RevenueIntegrityOfficer
              captures: { acct_l2_v2: $.data.version }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_l2}/approve"
              payload: { expected_account_version: "${acct_l2_v2}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-2"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: payment_plan_cure_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PaymentPlan.IN_DEFAULT_to_CURED
          - errors[ERR_PLAN_NOT_IN_DEFAULT]
        distinguishing_aspect: "Cure on an ACTIVE plan (not IN_DEFAULT) returns 409 ERR_PLAN_NOT_IN_DEFAULT."
        test_recipe:
          setup: ["Account L3 with ACTIVE plan P_L3"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-L3", patient_name: "L3", original_balance_cents: 100000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_l3: $.data.id }
            - call: "POST /self-pay/payment-plans"
              payload: { account_id: "${acct_l3}", installment_amount_cents: 50000, installment_count: 2, first_installment_due: "2026-02-01" }
              as: Collector
              captures: { plan_l3: $.data.id }
          trigger:
            - call: "POST /self-pay/payment-plans/${plan_l3}/cure"
              payload: {}
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_NOT_IN_DEFAULT"

      - name: dispute_resolve_from_resolved_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PatientDispute.OPEN_to_RESOLVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Resolving an already-RESOLVED dispute returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account L4 with RESOLVED dispute PD_L4"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-L4", patient_name: "L4", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_l4: $.data.id }
            - call: "POST /self-pay/patient-disputes"
              payload: { account_id: "${acct_l4}", dispute_reason: "test", dispute_amount_cents: 5000 }
              as: Collector
              captures: { pd_l4: $.data.id }
            - call: "POST /self-pay/patient-disputes/${pd_l4}/resolve"
              payload: { resolution_outcome: "UPHELD_PROVIDER" }
              as: RevenueIntegrityOfficer
          trigger:
            - call: "POST /self-pay/patient-disputes/${pd_l4}/resolve"
              payload: { resolution_outcome: "UPHELD_PATIENT" }
              as: RevenueIntegrityOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: account_status_terminal_lockdown_closed_paid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SelfPayAccount
        distinguishing_aspect: "CLOSED_PAID is terminal — placing an early-out placement on a CLOSED_PAID account is rejected."
        test_recipe:
          setup: ["Account L5 with balance 50000; payment posted bringing balance to 0 (status CLOSED_PAID)"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-L5", patient_name: "L5", original_balance_cents: 50000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_l5: $.data.id }
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_l5}", payment_kind: "LUMP_SUM", amount_cents: 50000 }
              as: Collector
          trigger:
            - call: "POST /self-pay/early-out-placements"
              payload: { account_id: "${acct_l5}", vendor_name: "VENDOR_X", contingency_fee_bps: 1500 }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: earlyout_recall_after_deadline_returns_recall_deadline_passed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EarlyOutPlacement.ACTIVE_to_RECALLED
          - validations[priority=12]
          - errors[ERR_RECALL_DEADLINE_PASSED]
        distinguishing_aspect: "Recall after recall_deadline is rejected with ERR_RECALL_DEADLINE_PASSED."
        test_recipe:
          setup: ["Account L6 with guarantor_liability_date 2026-06-01; EOP_L6 placed at default clock 2026-08-01; recall_deadline = 2026-06-01 + 90 days = 2026-08-30; clock advanced to 2026-09-01"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-L6", patient_name: "L6", original_balance_cents: 80000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_l6: $.data.id }
            - call: "POST /self-pay/early-out-placements"
              payload: { account_id: "${acct_l6}", vendor_name: "VENDOR_A", contingency_fee_bps: 1500 }
              as: Collector
              captures: { eop_l6: $.data.id }
            - call: "POST /self-pay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Collector
          trigger:
            - call: "POST /self-pay/early-out-placements/${eop_l6}/recall"
              payload: {}
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_RECALL_DEADLINE_PASSED"

  # ===========================================================================
  # Section: calculations (§1.3) — correct result, input set filtering, constants
  # ===========================================================================
  - section: calculations
    instances:
      - name: statement_returned_undeliverable_decrements_count
        claim_type: input_set_filtering
        grounds:
          - calculations.statement_cycle
          - entities.SelfPayAccount.fields.statements_sent_count
        distinguishing_aspect: "statements_sent_count includes only statements with status IN {SENT, DELIVERED}; a RETURNED_UNDELIVERABLE statement is excluded."
        test_recipe:
          setup: ["Account M1"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-M1", patient_name: "M1", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_m1: $.data.id }
            - call: "POST /self-pay/accounts/${acct_m1}/statements"
              payload: {}
              as: Collector
              captures: { stmt_m1: $.data.id }
            - call: "POST /self-pay/accounts/${acct_m1}/statements"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /self-pay/statements/${stmt_m1}/mark-returned"
              payload: {}
              as: Collector
          assert:
            - "SelfPayAccount.${acct_m1}.statements_sent_count == 1  (was 2, decremented by return)"

      - name: agency_recall_fee_boundary_zero_when_within_window
        claim_type: correct_result
        grounds:
          - calculations.agency_recall_fee
        distinguishing_aspect: "Recall within the window (logical_clock_date <= recall_window_closes_at) yields RECALLED_NO_FEE; recall after the window yields RECALLED_WITH_FEE."
        test_recipe:
          setup: ["Account M2 with guarantor_liability_date 2026-01-01, BUCKET_120_PLUS, 3 statements; placement AP_M2 placed at default clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-M2", patient_name: "M2", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_m2: $.data.id }
            - call: "POST /self-pay/accounts/${acct_m2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_m2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_m2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/collection-agency-placements"
              payload: { account_id: "${acct_m2}", agency_name: "AG_X", contingency_fee_bps: 2000 }
              as: Collector
              captures: { ap_m2: $.data.id }
          trigger:
            - call: "POST /self-pay/collection-agency-placements/${ap_m2}/recall"
              payload: {}
              as: Collector
          assert:
            - "CollectionAgencyPlacement.${ap_m2}.status == RECALLED_NO_FEE"

      - name: vendor_contingency_fee_calculation_rounds_half_up
        claim_type: correct_result
        grounds:
          - calculations.vendor_contingency_fee
        distinguishing_aspect: "AGENCY_REMITTANCE of 33333 cents at 2000 bps (20%) yields fee = round_half_up(33333 * 2000 / 10000) = round_half_up(6666.6) = 6667; net_to_hospital_cents = 33333 - 6667 = 26666."
        test_recipe:
          setup: ["Account M3 with placement AP_M3"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-M3", patient_name: "M3", original_balance_cents: 100000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_m3: $.data.id }
            - call: "POST /self-pay/accounts/${acct_m3}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_m3}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_m3}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/collection-agency-placements"
              payload: { account_id: "${acct_m3}", agency_name: "AG_Y", contingency_fee_bps: 2000 }
              as: Collector
              captures: { ap_m3: $.data.id }
          trigger:
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_m3}", payment_kind: "AGENCY_REMITTANCE", amount_cents: 33333, attributed_placement_id: "${ap_m3}" }
              as: CollectionAgencyUser
              captures: { rt_m3: $.data.id }
          assert:
            - "RecoveryTransaction.${rt_m3}.net_to_hospital_cents == 26666"
            - "SelfPayAccount.${acct_m3}.current_balance_cents == 66667  (100000 - 33333 gross)"
            - "CollectionAgencyPlacement.${ap_m3}.recovered_cents == 33333  (gross credited to placement)"

      - name: medicare_log_collection_effort_days_computed
        claim_type: correct_result
        grounds:
          - calculations.medicare_collection_effort_days
        distinguishing_aspect: "collection_effort_days = posted_at.date - guarantor_liability_date in whole days. With guarantor_liability_date 2026-01-01 and clock at 2026-08-01, effort = 212 days."
        test_recipe:
          setup: ["Account M4 with write-off posted at default clock"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-M4", patient_name: "M4", original_balance_cents: 80000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_m4: $.data.id }
            - call: "POST /self-pay/accounts/${acct_m4}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_m4}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_m4}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_m4}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_m4: $.data.id }
            - call: "GET /self-pay/accounts/${acct_m4}"
              as: RevenueIntegrityOfficer
              captures: { acct_m4_v: $.data.version }
            - call: "POST /self-pay/bad-debt-write-offs/${wo_m4}/approve"
              payload: { expected_account_version: "${acct_m4_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /self-pay/accounts/${acct_m4}/medicare-bad-debt-log-entries"
              as: RevenueIntegrityOfficer
              captures: { entry_id: "$.data[0].id", effort_days: "$.data[0].collection_effort_days" }
          assert:
            - "MedicareBadDebtLogEntry.${entry_id}.collection_effort_days == 212"
            - "MedicareBadDebtLogEntry.${entry_id}.claimed_amount_cents == 80000"
            - "MedicareBadDebtLogEntry.${entry_id}.cost_report_year == 2026"
            - "MedicareBadDebtLogEntry.${entry_id}.indigence_documented == false  (no charity screening on account)"

  # ===========================================================================
  # Section: validations (§1.4) — violation to error, satisfaction passes
  # ===========================================================================
  - section: validations
    instances:
      - name: occ_stale_version_returns_412
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - concurrency_rules[screening-create-stale-account]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating a screening with an expected_account_version that no longer matches the server's version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Account N1 created (version=1); a statement is issued (version -> 2)"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N1", patient_name: "N1", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_n1: $.data.id, acct_n1_v1: $.data.version }
            - call: "POST /self-pay/accounts/${acct_n1}/statements"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_n1}", screening_model: "FPL_TIERED", household_size: 1, household_income_cents: 1000000, expected_account_version: "${acct_n1_v1}" }
              as: FinancialCounselor
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION  (captured version 1 is stale; current version is 2)"

      - name: segregation_of_duties_creator_cannot_approve
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
        distinguishing_aspect: "The RevenueIntegrityOfficer who created the write-off cannot approve it — same X-User-ID is rejected with ERR_SEGREGATION_OF_DUTIES_VIOLATION."
        test_recipe:
          setup: ["Account N2 with statements; write-off W_N2 created by RevenueIntegrityOfficer officer-1"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N2", patient_name: "N2", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: RevenueIntegrityOfficer
              captures: { acct_n2: $.data.id }
            - call: "POST /self-pay/accounts/${acct_n2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_n2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_n2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_n2}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
              captures: { wo_n2: $.data.id }
            - call: "GET /self-pay/accounts/${acct_n2}"
              as: RevenueIntegrityOfficer
              captures: { acct_n2_v: $.data.version }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_n2}/approve"
              payload: { expected_account_version: "${acct_n2_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION"

      - name: dispute_amount_exceeding_balance_returns_422
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DISPUTE_AMOUNT_INVALID]
        distinguishing_aspect: "dispute_amount_cents > current_balance_cents is rejected."
        test_recipe:
          setup: ["Account N3 with balance 50000"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N3", patient_name: "N3", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_n3: $.data.id }
          trigger:
            - call: "POST /self-pay/patient-disputes"
              payload: { account_id: "${acct_n3}", dispute_reason: "test", dispute_amount_cents: 99999 }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DISPUTE_AMOUNT_INVALID"

      - name: bad_debt_writeoff_before_120_days_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_WRITE_OFF_BEFORE_120_DAYS]
        distinguishing_aspect: "BAD_DEBT write-off approval on an account in BUCKET_60 (not BUCKET_120_PLUS) is rejected with ERR_WRITE_OFF_BEFORE_120_DAYS."
        test_recipe:
          setup: ["Account N4 with guarantor_liability_date 2026-06-15 (47 days at default clock = BUCKET_30); 3 statements sent; BAD_DEBT write-off W_N4 in PENDING_APPROVAL"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N4", patient_name: "N4", original_balance_cents: 50000, guarantor_liability_date: "2026-06-15" }
              as: Collector
              captures: { acct_n4: $.data.id }
            - call: "POST /self-pay/accounts/${acct_n4}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_n4}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_n4}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_n4}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_n4: $.data.id }
            - call: "GET /self-pay/accounts/${acct_n4}"
              as: RevenueIntegrityOfficer
              captures: { acct_n4_v: $.data.version }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_n4}/approve"
              payload: { expected_account_version: "${acct_n4_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_WRITE_OFF_BEFORE_120_DAYS"

      - name: active_payment_plan_blocks_bad_debt_writeoff
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACTIVE_PAYMENT_PLAN_BLOCKS_WRITE_OFF]
        distinguishing_aspect: "Bad-debt write-off approval on an account with an ACTIVE payment plan is rejected."
        test_recipe:
          setup: ["Account N5 BUCKET_120_PLUS with 3 statements; ACTIVE payment plan PP_N5; BAD_DEBT write-off W_N5 in PENDING_APPROVAL"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N5", patient_name: "N5", original_balance_cents: 100000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_n5: $.data.id }
            - call: "POST /self-pay/accounts/${acct_n5}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_n5}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_n5}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/payment-plans"
              payload: { account_id: "${acct_n5}", installment_amount_cents: 25000, installment_count: 4, first_installment_due: "2026-02-01" }
              as: Collector
              captures: { plan_n5: $.data.id }
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_n5}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_n5: $.data.id }
            - call: "GET /self-pay/accounts/${acct_n5}"
              as: RevenueIntegrityOfficer
              captures: { acct_n5_v: $.data.version }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_n5}/approve"
              payload: { expected_account_version: "${acct_n5_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_ACTIVE_PAYMENT_PLAN_BLOCKS_WRITE_OFF"

      - name: partial_writeoff_attempt_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_PARTIAL_WRITE_OFF_NOT_SUPPORTED]
        distinguishing_aspect: "POST /self-pay/bad-debt-write-offs with an explicit amount_cents (not in declared input) triggers ERR_INVALID_REQUEST because amount_cents is not a client-supplied field. The system computes it at approval time."
        test_recipe:
          setup: ["Account N6"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N6", patient_name: "N6", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_n6: $.data.id }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_n6}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026, amount_cents: 10000 }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST  (amount_cents not in endpoint's input contract)"

      - name: invalid_cost_report_year_in_future
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_INVALID_COST_REPORT_YEAR]
        distinguishing_aspect: "medicare_cost_report_year later than the logical clock's year (2026) is rejected."
        test_recipe:
          setup: ["Account N7 BUCKET_120_PLUS; logical clock 2026"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N7", patient_name: "N7", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_n7: $.data.id }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_n7}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2027 }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_COST_REPORT_YEAR"

      - name: recovery_fk_mismatch_polymorphic
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_RECOVERY_FK_MISMATCH]
        distinguishing_aspect: "AGENCY_REMITTANCE with attributed_placement_id pointing to an EarlyOutPlacement (not a CollectionAgencyPlacement) is rejected."
        test_recipe:
          setup: ["Account N8 with an ACTIVE EarlyOutPlacement EOP_N8"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N8", patient_name: "N8", original_balance_cents: 80000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_n8: $.data.id }
            - call: "POST /self-pay/early-out-placements"
              payload: { account_id: "${acct_n8}", vendor_name: "VENDOR_A", contingency_fee_bps: 1500 }
              as: Collector
              captures: { eop_n8: $.data.id }
          trigger:
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_n8}", payment_kind: "AGENCY_REMITTANCE", amount_cents: 5000, attributed_placement_id: "${eop_n8}" }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_RECOVERY_FK_MISMATCH"

      - name: recovery_exceeds_balance_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_RECOVERY_EXCEEDS_BALANCE]
        distinguishing_aspect: "LUMP_SUM payment of 99999 on an account with balance 50000 is rejected."
        test_recipe:
          setup: ["Account N9 with balance 50000"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N9", patient_name: "N9", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_n9: $.data.id }
          trigger:
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_n9}", payment_kind: "LUMP_SUM", amount_cents: 99999 }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_RECOVERY_EXCEEDS_BALANCE"

      - name: statement_on_written_off_account_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACCOUNT_NOT_STATEMENT_ELIGIBLE]
        distinguishing_aspect: "Statements cannot be issued for an account in WRITTEN_OFF status."
        test_recipe:
          setup: ["Account N10 WRITTEN_OFF via full BAD_DEBT write-off"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-N10", patient_name: "N10", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_n10: $.data.id }
            - call: "POST /self-pay/accounts/${acct_n10}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_n10}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_n10}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_n10}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_n10: $.data.id }
            - call: "GET /self-pay/accounts/${acct_n10}"
              as: RevenueIntegrityOfficer
              captures: { acct_n10_v: $.data.version }
            - call: "POST /self-pay/bad-debt-write-offs/${wo_n10}/approve"
              payload: { expected_account_version: "${acct_n10_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /self-pay/accounts/${acct_n10}/statements"
              payload: {}
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_STATEMENT_ELIGIBLE"

  # ===========================================================================
  # Section: endpoints (§1.5) — endpoint behaviors not covered elsewhere
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_accounts_pagination_envelope
        claim_type: standard_crud
        grounds:
          - endpoints."GET /self-pay/accounts"
          - response_envelope
        distinguishing_aspect: "GET /self-pay/accounts returns the standard envelope with meta.api_request_id, meta.api_request_timestamp, response_type='array', data as array, and pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["3 accounts exist"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-P1", patient_name: "P1", original_balance_cents: 10000, guarantor_liability_date: "2026-07-01" }
              as: Collector
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-P2", patient_name: "P2", original_balance_cents: 10000, guarantor_liability_date: "2026-07-01" }
              as: Collector
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-P3", patient_name: "P3", original_balance_cents: 10000, guarantor_liability_date: "2026-07-01" }
              as: Collector
          trigger:
            - call: "GET /self-pay/accounts"
              as: Collector
          assert:
            - "response.meta.api_request_id is present"
            - "response.response_type == 'array'"
            - "length(response.data) == 3"
            - "response contains pagination fields (limit, offset, total_count, has_more)"
            - "response.total_count == 3"

      - name: list_accounts_filter_by_status
        claim_type: standard_crud
        grounds:
          - endpoints."GET /self-pay/accounts"
        distinguishing_aspect: "GET /self-pay/accounts?status=OPEN returns only OPEN accounts; CLOSED_PAID accounts are excluded."
        test_recipe:
          setup: ["Account P_OPEN (balance 50000); Account P_CLOSED (balance 20000, paid off)"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-P-OPEN", patient_name: "P Open", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_p_open: $.data.id }
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-P-CLOSED", patient_name: "P Closed", original_balance_cents: 20000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_p_closed: $.data.id }
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_p_closed}", payment_kind: "LUMP_SUM", amount_cents: 20000 }
              as: Collector
          trigger:
            - call: "GET /self-pay/accounts?status=OPEN"
              as: Collector
          assert:
            - "every account in response.data has status == OPEN"
            - "${acct_p_closed} not in response.data ids"
            - "${acct_p_open} in response.data ids"

      - name: agency_placement_marks_credit_reportable
        claim_type: side_effect_execution
        grounds:
          - endpoints."POST /self-pay/collection-agency-placements"
        distinguishing_aspect: "Direct agency placement sets account.credit_reporting_status to REPORTABLE as a side effect."
        test_recipe:
          setup: ["Account P2 BUCKET_120_PLUS with 3 statements"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-P-CR", patient_name: "P CR", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_p2: $.data.id }
            - call: "POST /self-pay/accounts/${acct_p2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_p2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_p2}/statements"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /self-pay/collection-agency-placements"
              payload: { account_id: "${acct_p2}", agency_name: "AG_Z", contingency_fee_bps: 2500 }
              as: Collector
          assert:
            - "SelfPayAccount.${acct_p2}.credit_reporting_status == REPORTABLE"
            - "SelfPayAccount.${acct_p2}.status == IN_COLLECTIONS"

      - name: clock_endpoint_reports_sweep_results
        claim_type: computed_read
        grounds:
          - endpoints."POST /self-pay/_clock/set_current_utc"
          - calculations.payment_plan_default_sweep
        distinguishing_aspect: "POST /self-pay/_clock/set_current_utc returns the new clock value plus sweep counts (plans_flagged_in_default, disputes_expired)."
        test_recipe:
          setup: ["Account P3 with a plan that has 2 missed installments when clock reaches 2026-04-01"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-P3", patient_name: "P3", original_balance_cents: 100000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_p3: $.data.id }
            - call: "POST /self-pay/payment-plans"
              payload: { account_id: "${acct_p3}", installment_amount_cents: 50000, installment_count: 2, first_installment_due: "2026-02-01" }
              as: Collector
              captures: { plan_p3: $.data.id }
          trigger:
            - call: "POST /self-pay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Collector
          assert:
            - "response.data.now_iso8601 == '2026-04-15T00:00:00Z'"
            - "response.data.plans_flagged_in_default == 1"
            - "PaymentPlan.${plan_p3}.status == IN_DEFAULT"

  # ===========================================================================
  # Section: errors (§1.6) — every error code triggerable
  # ===========================================================================
  - section: errors
    instances:
      - name: insufficient_permissions_when_collector_tries_approve
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - roles.Collector
        distinguishing_aspect: "Collector attempting POST /bad-debt-write-offs/{id}/approve (a RevenueIntegrityOfficer-only endpoint) is rejected with 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["Account Q1 with BAD_DEBT write-off in PENDING_APPROVAL"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-Q1", patient_name: "Q1", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_q1: $.data.id }
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_q1}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_q1: $.data.id }
            - call: "GET /self-pay/accounts/${acct_q1}"
              as: Collector
              captures: { acct_q1_v: $.data.version }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_q1}/approve"
              payload: { expected_account_version: "${acct_q1_v}" }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: missing_user_context_header
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Any endpoint invoked without X-User-ID or X-User-Role headers returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER. (Test driver must explicitly omit headers — pinned here as a contract.)"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /self-pay/accounts"
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER  (when X-User-ID / X-User-Role headers are stripped by the test driver)"

  # ===========================================================================
  # Section: rbac (§1.7) — role denial
  # ===========================================================================
  - section: rbac
    instances:
      - name: agency_user_cannot_place_early_out
        claim_type: role_denial
        grounds:
          - roles.CollectionAgencyUser
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "CollectionAgencyUser attempting POST /self-pay/early-out-placements is denied."
        test_recipe:
          setup: ["Account R1"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-R1", patient_name: "R1", original_balance_cents: 50000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_r1: $.data.id }
          trigger:
            - call: "POST /self-pay/early-out-placements"
              payload: { account_id: "${acct_r1}", vendor_name: "VENDOR_A", contingency_fee_bps: 1500 }
              as: CollectionAgencyUser
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: financial_counselor_cannot_terminate_plan
        claim_type: role_denial
        grounds:
          - roles.FinancialCounselor
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "FinancialCounselor attempting POST /self-pay/payment-plans/{id}/terminate (RevenueIntegrityOfficer-only) is denied."
        test_recipe:
          setup: ["Account R2 with IN_DEFAULT plan"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-R2", patient_name: "R2", original_balance_cents: 100000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_r2: $.data.id }
            - call: "POST /self-pay/payment-plans"
              payload: { account_id: "${acct_r2}", installment_amount_cents: 50000, installment_count: 2, first_installment_due: "2026-01-01" }
              as: Collector
              captures: { plan_r2: $.data.id }
            - call: "POST /self-pay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Collector
          trigger:
            - call: "POST /self-pay/payment-plans/${plan_r2}/terminate"
              payload: {}
              as: FinancialCounselor
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: collector_cannot_read_medicare_log
        claim_type: role_denial
        grounds:
          - roles.Collector
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Collector attempting GET /self-pay/medicare-bad-debt-log-entries/{id} is denied (RevenueIntegrityOfficer-only)."
        test_recipe:
          setup: ["Account R3 WRITTEN_OFF; a Medicare log entry exists"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-R3", patient_name: "R3", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_r3: $.data.id }
            - call: "POST /self-pay/accounts/${acct_r3}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_r3}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_r3}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_r3}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_r3: $.data.id }
            - call: "GET /self-pay/accounts/${acct_r3}"
              as: RevenueIntegrityOfficer
              captures: { acct_r3_v: $.data.version }
            - call: "POST /self-pay/bad-debt-write-offs/${wo_r3}/approve"
              payload: { expected_account_version: "${acct_r3_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
            - call: "GET /self-pay/accounts/${acct_r3}/medicare-bad-debt-log-entries"
              as: RevenueIntegrityOfficer
              captures: { log_id: "$.data[0].id" }
          trigger:
            - call: "GET /self-pay/medicare-bad-debt-log-entries/${log_id}"
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

  # ===========================================================================
  # Section: cross-cutting layers — optimistic_concurrency, cascading_side_effects
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_on_writeoff_approve_stale_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[writeoff-approve-stale-account]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Approve a write-off with an expected_account_version that is stale (the account was mutated between read and approve) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Account S1 BUCKET_120_PLUS with 3 statements; BAD_DEBT write-off W_S1 PENDING_APPROVAL; account read at version V; a new statement issued (version advances to V+1)"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-S1", patient_name: "S1", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_s1: $.data.id }
            - call: "POST /self-pay/accounts/${acct_s1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_s1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_s1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_s1}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_s1: $.data.id }
            - call: "GET /self-pay/accounts/${acct_s1}"
              as: RevenueIntegrityOfficer
              captures: { acct_s1_v_stale: $.data.version }
            - call: "POST /self-pay/accounts/${acct_s1}/statements"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_s1}/approve"
              payload: { expected_account_version: "${acct_s1_v_stale}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[screening-create-stale-account]
          - entities.SelfPayAccount
        distinguishing_aspect: "Each mutation (statement issuance, screening creation, payment posting) increments SelfPayAccount.version by exactly 1."
        test_recipe:
          setup: ["Account S2 created (version 1)"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-S2", patient_name: "S2", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_s2: $.data.id, s2_v1: $.data.version }
          trigger:
            - call: "POST /self-pay/accounts/${acct_s2}/statements"
              payload: {}
              as: Collector
            - call: "GET /self-pay/accounts/${acct_s2}"
              as: Collector
              captures: { s2_v2: $.data.version }
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_s2}", payment_kind: "LUMP_SUM", amount_cents: 5000 }
              as: Collector
            - call: "GET /self-pay/accounts/${acct_s2}"
              as: Collector
              captures: { s2_v3: $.data.version }
          assert:
            - "${s2_v1} == 1"
            - "${s2_v2} == 2  (statement issuance bumped version)"
            - "${s2_v3} == 3  (recovery posting bumped version)"

  # ===========================================================================
  # Section: consistency_model — immediate consistency
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_visible_in_same_request_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "POST /self-pay/accounts/{id}/statements returns the new Statement with status=SENT and statement_index=1 immediately; a subsequent GET of the account shows statements_sent_count=1 immediately (no lag)."
        test_recipe:
          setup: ["Account T1"]
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-T1", patient_name: "T1", original_balance_cents: 50000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_t1: $.data.id }
          trigger:
            - call: "POST /self-pay/accounts/${acct_t1}/statements"
              payload: {}
              as: Collector
              captures: { stmt_t1_id: $.data.id, stmt_t1_status: $.data.status, stmt_t1_idx: $.data.statement_index }
            - call: "GET /self-pay/accounts/${acct_t1}"
              as: Collector
              captures: { acct_t1_count: $.data.statements_sent_count }
          assert:
            - "${stmt_t1_status} == 'SENT'"
            - "${stmt_t1_idx} == 1"
            - "${acct_t1_count} == 1  (immediately consistent, no async lag)"
