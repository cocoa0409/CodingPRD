  - method: GET
    path: "/racquet/enrollments"
    description: "List/filter enrollments"
    roles: [Member, Pro, FrontDesk]
    code: 200
    input: ["lesson_id?", "member_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/racquet/enrollments/{enrollment_id}/cancel"
    description: "Cancel an enrollment"
    roles: [Member, FrontDesk]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status->CANCELLED", "promote earliest WAITLISTED (created_at ASC) to ENROLLED"]

  # ---- Competition ----
  - method: POST
    path: "/racquet/competitions"
    description: "Create a league, ladder, or tournament"
    roles: [FrontDesk]
    code: 201
    input: [name, format, "draw_size?", "entry_fee_cents?"]
    output: Competition
    side_effects: ["status=REGISTRATION"]
  - method: GET
    path: "/racquet/competitions/{competition_id}"
    description: "Get a competition"
    roles: [Member, Pro, FrontDesk]
    code: 200
    input: []
    output: Competition
    side_effects: []
  - method: GET
    path: "/racquet/competitions"
    description: "List competitions"
    roles: [Member, Pro, FrontDesk]
    code: 200
    input: ["status?", "format?", "limit?", "offset?"]
    output: Competition[]
    side_effects: []
  - method: POST
    path: "/racquet/competitions/{competition_id}/start"
    description: "Start a competition; for TOURNAMENT format this seeds the bracket"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Competition
    side_effects: ["status REGISTRATION->IN_PROGRESS", "TOURNAMENT: competition_seeding assigns bracket_slot; LADDER: ladder_rank assigned by created_at ASC"]
  - method: POST
    path: "/racquet/competitions/{competition_id}/report"
    description: "Report a match result and update standings"
    roles: [FrontDesk]
    code: 200
    input: [player1_participant_id, player2_participant_id, winner_participant_id, "round?"]
    output: Competition
    side_effects: ["competition_standings updates wins/losses/points/ladder_rank/bracket per format"]
  - method: POST
    path: "/racquet/competitions/{competition_id}/close"
    description: "Close a competition"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Competition
    side_effects: ["status IN_PROGRESS->COMPLETED"]

  # ---- Participant ----
  - method: POST
    path: "/racquet/participants"
    description: "Register a member into a competition"
    roles: [Member, FrontDesk]
    code: 201
    input: [competition_id, member_id, "seed?"]
    output: Participant
    side_effects: ["status=ACTIVE", "entry_fee_cents posted to member ledger"]
  - method: GET
    path: "/racquet/participants/{participant_id}"
    description: "Get a participant"
    roles: [Member, Pro, FrontDesk]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: GET
    path: "/racquet/participants"
    description: "List/filter participants"
    roles: [Member, Pro, FrontDesk]
    code: 200
    input: ["competition_id?", "member_id?", "status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  # ---- StringingJob ----
  - method: POST
    path: "/racquet/stringing-jobs"
    description: "Intake a pro-shop stringing job"
    roles: [Member, FrontDesk]
    code: 201
    input: [member_id, racquet_label, string_type, tension, price_cents]
    output: StringingJob
    side_effects: ["status=RECEIVED", "price_cents posted to member ledger"]
  - method: GET
    path: "/racquet/stringing-jobs/{job_id}"
    description: "Get a stringing job"
    roles: [Member, Pro, FrontDesk]
    code: 200
    input: []
    output: StringingJob
    side_effects: []
  - method: GET
    path: "/racquet/stringing-jobs"
    description: "List/filter stringing jobs"
    roles: [Member, Pro, FrontDesk]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: StringingJob[]
    side_effects: []
  - method: POST
    path: "/racquet/stringing-jobs/{job_id}/advance"
    description: "Advance a stringing job one workflow step (RECEIVED->IN_PROGRESS->READY->PICKED_UP)"
    roles: [FrontDesk]
    code: 200
    input: []
    output: StringingJob
    side_effects: ["status advances one step"]
  - method: POST
    path: "/racquet/stringing-jobs/{job_id}/cancel"
    description: "Cancel a stringing job before pickup and refund"
    roles: [FrontDesk]
    code: 200
    input: []
    output: StringingJob
    side_effects: ["status->CANCELLED", "price_cents reversed from ledger"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity_backed role acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or referenced FK id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type/enum, end_time <= start_time" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a valid state for the requested transition" }
  - { id: ERR_COURT_NOT_AVAILABLE, http: 409, condition: "Booking a court whose status is not AVAILABLE" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Booking or enrolling for a member whose status is SUSPENDED" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Enrolling requires the member's subscription to be ACTIVE" }
  - { id: ERR_SUBSCRIPTION_REQUIRED, http: 409, condition: "Operation requires the member to have a non-CANCELLED subscription" }
  - { id: ERR_SUBSCRIPTION_EXISTS, http: 409, condition: "Member already has a non-CANCELLED subscription" }
  - { id: ERR_BOOKING_IN_PAST, http: 409, condition: "Reservation start_time is not strictly after the current clock" }
  - { id: ERR_BOOKING_WINDOW_EXCEEDED, http: 409, condition: "Reservation start_time is more than MAX_ADVANCE_DAYS ahead of the current clock" }
  - { id: ERR_COURT_TIME_CONFLICT, http: 409, condition: "Reservation interval half-open-overlaps another non-terminal reservation on the same court" }
  - { id: ERR_PRO_TIME_CONFLICT, http: 409, condition: "Lesson interval violates the pro's buffer gap or overlaps another of the pro's non-cancelled lessons" }
  - { id: ERR_LESSON_COURT_CONFLICT, http: 409, condition: "Lesson interval half-open-overlaps another booking on the same court" }
  - { id: ERR_CHECKIN_WINDOW, http: 409, condition: "Check-in attempted outside [start_time - CHECKIN_EARLY_MINUTES, end_time)" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 409, condition: "Mark-no-show attempted before start_time + NO_SHOW_GRACE_MINUTES" }
  - { id: ERR_DUPLICATE_RESERVATION, http: 409, condition: "Non-terminal reservation already exists for same member + court + start_time" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Member already has a non-CANCELLED enrollment on the lesson" }
  - { id: ERR_DUPLICATE_PARTICIPANT, http: 409, condition: "Member already registered in the competition" }
  - { id: ERR_FREEZE_LIMIT_REACHED, http: 409, condition: "Manual freeze would exceed the plan's freeze_limit" }
  - { id: ERR_COMPETITION_NOT_OPEN, http: 409, condition: "Registration attempted when competition status is not REGISTRATION" }
  - { id: ERR_INVALID_DRAW_SIZE, http: 409, condition: "TOURNAMENT start where draw_size is not a power of two or does not equal the ACTIVE participant count" }
  - { id: ERR_BALANCE_LIMIT_EXCEEDED, http: 402, condition: "Member.account_balance_cents exceeds MAX_OUTSTANDING_BALANCE_CENTS at booking" }
  - { id: ERR_RENEW_NOT_DUE, http: 409, condition: "Renew attempted before current_period_end" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A club member. Books own reservations, enrolls self in clinics, registers self in competitions, requests stringing, and freezes/changes own subscription."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /racquet/reservations (own member_id must equal X-User-ID)"
      - "POST /racquet/reservations/{id}/check-in"
      - "POST /racquet/reservations/{id}/cancel"
      - "POST /racquet/reservations/{id}/reschedule"
      - "POST /racquet/enrollments (own member_id)"
      - "POST /racquet/enrollments/{id}/cancel"
      - "POST /racquet/participants (own member_id)"
      - "POST /racquet/stringing-jobs (own member_id)"
      - "POST /racquet/subscriptions/{id}/freeze"
      - "POST /racquet/subscriptions/{id}/unfreeze"
      - "POST /racquet/subscriptions/{id}/change-plan"
      - "POST /racquet/subscriptions/{id}/cancel"
      - "GET (courts, plans, own member, subscriptions, reservations, lessons, enrollments, competitions, participants, stringing jobs)"
  - name: Pro
    description: "A coaching pro. Creates and manages own lessons/clinics."
    identity: "entity_backed:Pro"
    exclusive_operations:
      - "POST /racquet/lessons/{id}/confirm"
      - "POST /racquet/lessons/{id}/complete"
    shared_operations:
      - "POST /racquet/lessons (own pro_id must equal X-User-ID)"
      - "POST /racquet/lessons/{id}/cancel"
      - "GET (courts, pros, lessons, enrollments)"
  - name: FrontDesk
    description: "Club operations desk. Manages courts, plans, members, subscription billing/renewal, no-shows, competitions seeding/results, and pro-shop workflow. Superset operational authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /racquet/courts and /maintenance /reopen /retire"
      - "POST /racquet/membership-plans"
      - "POST /racquet/members and /suspend /reinstate"
      - "POST /racquet/subscriptions and /renew"
      - "POST /racquet/reservations/{id}/complete"
      - "POST /racquet/reservations/{id}/mark-no-show"
      - "POST /racquet/pros"
      - "POST /racquet/competitions and /start /report /close"
      - "POST /racquet/stringing-jobs/{id}/advance and /cancel"
      - "POST /racquet/_clock/set_current_utc"
    shared_operations:
      - "POST /racquet/reservations, /check-in, /cancel, /reschedule (on behalf of any member)"
      - "POST /racquet/enrollments and /cancel (on behalf of any member)"
      - "POST /racquet/participants (on behalf of any member)"
      - "POST /racquet/stringing-jobs (on behalf of any member)"
      - "POST /racquet/lessons and /cancel"
      - "POST /racquet/subscriptions/{id}/freeze, /unfreeze, /change-plan, /cancel"
      - "GET (all collections)"

# =============================================================================
# Global constants referenced above
# =============================================================================
constants:
  CREDIT_MINUTES: 60
  PEAK_START_HOUR: 17
  PEAK_END_HOUR: 21
  PEAK_SURCHARGE_PCT: 0.25
  NO_SHOW_GRACE_MINUTES: 15
  NO_SHOW_SUSPEND_THRESHOLD: 3
  CHECKIN_EARLY_MINUTES: 30
  PRO_BUFFER_MINUTES: 15
  MAX_ADVANCE_DAYS: 14
  DAYS_PER_PERIOD: 30
  MAX_OUTSTANDING_BALANCE_CENTS: 20000
  POINTS_WIN: 3
  POINTS_LOSS: 0
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
