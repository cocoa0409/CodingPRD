      - name: billing_admin_cannot_open_a_ticket
        claim_type: Role Denial
        grounds: ["roles.BillingAdmin", "endpoints[POST /smart-home-support/tickets]", "validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Ticket creation is limited to Owner, Member and SupportAgent, so a BILLING_ADMIN of the same household is refused with ERR_FORBIDDEN_ROLE (403) even though every other rule would pass."
