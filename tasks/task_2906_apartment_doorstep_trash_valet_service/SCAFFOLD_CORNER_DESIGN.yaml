          - calculations.statement_settlement.constants.SLA_TIER1_CREDIT_BPS
          - calculations.statement_settlement.constants.SLA_TIER2_ENTRY_BPS
          - entities.MonthlyStatement.fields.missed_equivalent_nights
        distinguishing_aspect: "One PARTIAL night out of four scheduled gives missed_service_bps 1250 -> TIER1 (500 bps); had the PARTIAL night been weighted as a whole missed night the ratio would be 2500 bps and cross SLA_TIER2_ENTRY_BPS, so the half-weight is visible in the money, not just in the ratio field."
