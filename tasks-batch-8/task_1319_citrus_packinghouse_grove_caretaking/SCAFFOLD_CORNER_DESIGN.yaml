            - { call: "POST /packinghouse/quarantine-orders/${sm10_q}/release", payload: { inspection_passed: true }, as: ComplianceOfficer, as_user_id: "co_qr_a", captures: { sm10_e2: "$.data.error_id" } }
            - { call: "POST /packinghouse/quarantine-orders/${sm10_q}/release", payload: { inspection_passed: true }, as: ComplianceOfficer, as_user_id: "co_qr_b" }
          assert:
