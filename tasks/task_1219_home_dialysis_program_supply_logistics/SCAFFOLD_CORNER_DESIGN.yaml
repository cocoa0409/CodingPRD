            - { call: "POST /api/maintenance-events", payload: { machine_id: "${m1}", event_type: REPAIR, window_start: "2026-05-11T09:00:00Z", window_end: "2026-05-11T12:00:00Z" }, as: BiomedTechnician, captures: { ev2: $.data.id } }
            - { call: "POST /api/maintenance-events/${ev1}/start", as: BiomedTechnician, captures: { m1_mid: $.data.status } }
            - { call: "POST /api/maintenance-events/${ev2}/start", as: BiomedTechnician, captures: { e4: $.data.error_id } }
            - { call: "POST /api/maintenance-events/${ev1}/cancel", as: BiomedTechnician, captures: { e5: $.data.error_id } }
            - { call: "POST /api/maintenance-events/${ev1}/complete", as: BiomedTechnician }
            - { call: "POST /api/maintenance-events", payload: { machine_id: "${m1}", event_type: DECONTAMINATION, window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T12:00:00Z" }, as: BiomedTechnician, captures: { ev3: $.data.id } }
