            - "the submit on ${rl_locked_id} returns error_id == ERR_EXCLUSIVITY_CONFLICT with http_status 409"
            - "DealRegistration.${rl_locked_id}.status == DRAFT and submitted_at == null"
            - "the submit on ${rl_open_id} succeeds: DealRegistration.${rl_open_id}.status == SUBMITTED with submitted_at == 2026-04-01T00:00:00.000Z"
            - "Account.${acc2_id}.coverage_state == OPEN_CHANNEL (the second account was never touched, proving the refusal came from the first Account's state and nothing else)"
            - "Partner.${pl_id}.tier_status == COMPLIANT and open_conflict_count == 0"

      - name: mdf_claim_create_depends_on_allocation_closed_state
        grounds:
          - validations[priority=11]
          - state_machines.MdfAllocation.OPEN_to_CLOSED
          - state_machines.MdfClaim.validation_state_SUBMITTED_to_REJECTED
          - errors[ERR_ALLOCATION_CLOSED]
          - entities.MdfAllocation.fields.expired_cents
        distinguishing_aspect: |
          A different entity pair (MdfClaim, MdfAllocation): creating a claim is refused because
          the PARENT allocation reached its terminal CLOSED state, and CASCADE C first rejects the
          in-flight claim with rejection_reason PERIOD_CLOSED, releases its commitment and then
          sweeps the entire remaining available_cents into expired_cents - so the refusal comes
          with an allocation whose available_cents is 0 for a structural reason (closed period),
          not because the money ran out.
