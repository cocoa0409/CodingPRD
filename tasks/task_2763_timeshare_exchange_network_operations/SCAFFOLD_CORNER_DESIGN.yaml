      - name: deposit_withdrawal_reverses_the_credit_and_the_resort_counters
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: deposit_then_withdraw_conserves_trading_power
          rationale: >-
            The BANKED -> WITHDRAWN edge and its three-way reversal (member power, resort
            deposits_committed_count and committed_nights, plus the DEPOSIT_WITHDRAWAL_REVERSAL ledger
            row) are exercised in full by the §1.8 compensating_invariant instance, which additionally
            checks the round-trip conservation across three sizes. A separate corner probe would
            re-run the same edge with weaker assertions.

      - name: deposit_status_and_rental_status_are_independent_dimensions
        claim_type: parallel_transitions
        excluded_because:
          difficulty_instance: deposit_status_and_rental_status_advance_independently
          rationale: >-
            The parallel-machine shape of Deposit is the explicit subject of the §1.8
            non_linear_state_machine instance, which walks both dimensions through several states
            while holding the other fixed. The corner-level version here would be a strict subset.

  # ===========================================================================
  - section: calculations
    instances:

      - name: resort_quality_score_mean_of_composites_sets_standard_rating
        claim_type: weighted_scoring
        grounds: ["calculations.resort_quality_score", "entities.ResortQualityReview", "entities.Resort.quality_rating"]
        distinguishing_aspect: >-
          The rating is a two-stage weighted score: each review is collapsed to a 2-decimal composite
          with weights 0.40/0.35/0.25, and the resort score is the mean of the ALREADY-ROUNDED
          composites, not the mean of the raw sub-scores. Below MIN_REVIEWS_FOR_SCORE the score must
          stay null and the rating must stay at initial_quality_rating, so the first review is
          deliberately invisible in the rating even though it is stored.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A (demand_index 4, initial_quality_rating GOLD_CROWN, units_per_size 2)
            with a GOLD band 04-01..06-30 and a BRONZE band 11-01..12-31, affiliated at the default
            clock. Member M1 banks two STUDIO weeks at Resort A in the BRONZE band, checking in
            2026-12-05 and 2026-12-20, each worth 29 (30 * 0.70 * 1.10 = 23.1 -> 23, +6 = 29, lead
            126 and 141 both give factor 1.00). Member M2 banks a TWO_BR GOLD week checking in
            2027-05-10 worth 107 and files two DEPOSIT_FIRST STUDIO requests funded by it, one over
            2026-12-01..2026-12-10 and one over 2026-12-15..2026-12-25, each with
            required_power_estimate 29, power_budget 117 and quoted_charge_cents 23060. One matching
            run pairs each request with the week inside its window, M2 confirms both, the clock
            advances to 2026-12-27 and a second run completes both stays.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "BRONZE", start_month_day: "11-01", end_month_day: "12-31" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "STUDIO", check_in_date: "2026-12-05" }
              captures: { dep_a: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "STUDIO", check_in_date: "2026-12-20" }
              captures: { dep_b: "$.data.id" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Ravi Bergqvist", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "STUDIO", window_start_date: "2026-12-01", window_end_date: "2026-12-10", deposit_id: "${dep_m2}" }
              captures: { req_a: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "STUDIO", window_start_date: "2026-12-15", window_end_date: "2026-12-25", deposit_id: "${dep_m2}" }
              captures: { req_b: "$.data.id" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "december pairing" }
              captures: { run1: "$.data.id" }
            - call: "POST /exchange-network/confirmations"
              as: Member
              as_user_id: "${m2}"
              payload: { exchange_request_id: "${req_a}" }
              captures: { conf_a: "$.data.id" }
            - call: "POST /exchange-network/confirmations"
              as: Member
              as_user_id: "${m2}"
              payload: { exchange_request_id: "${req_b}" }
              captures: { conf_b: "$.data.id" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2026-12-27T00:00:00Z" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "completion sweep" }
              captures: { run2: "$.data.id" }
          trigger:
            - call: "GET /exchange-network/resorts/${resort_a}"
              as: NetworkOperator
              payload: {}
              captures: { ra_v1: "$.data.version" }
            - call: "POST /exchange-network/resorts/${resort_a}/quality-reviews"
              as: Member
              as_user_id: "${m2}"
              payload: { confirmation_id: "${conf_a}", cleanliness_score: 9, service_score: 8, amenities_score: 7, expected_resort_version: "${ra_v1}" }
              captures: { rev_a: "$.data.id" }
            - call: "GET /exchange-network/resorts/${resort_a}"
              as: NetworkOperator
              payload: {}
              captures: { ra_v2: "$.data.version" }
            - call: "POST /exchange-network/resorts/${resort_a}/quality-reviews"
              as: Member
              as_user_id: "${m2}"
              payload: { confirmation_id: "${conf_b}", cleanliness_score: 6, service_score: 6, amenities_score: 5, expected_resort_version: "${ra_v2}" }
              captures: { rev_b: "$.data.id" }
          assert:
            - "run2 returned completed_confirmation_count == 2 and both confirmations report status \"COMPLETED\""
            - "review A returns HTTP 201 with composite_score == \"8.15\" (0.40*9 + 0.35*8 + 0.25*7 = 8.15)"
            - "after review A, GET /exchange-network/resorts/${resort_a} shows review_count == 1, quality_score == null and quality_rating still \"GOLD_CROWN\" — one review is below MIN_REVIEWS_FOR_SCORE"
            - "review B returns HTTP 201 with composite_score == \"5.75\" (0.40*6 + 0.35*6 + 0.25*5 = 5.75)"
            - "after review B, GET /exchange-network/resorts/${resort_a} shows review_count == 2 and quality_score == \"6.95\", the mean of the two rounded composites"
            - "quality_rating == \"STANDARD\" — 6.95 falls in the 5.0..7.0 band, so the resort drops two rungs from GOLD_CROWN in one call"
            - "downgrade_notches == 0 and complaint_strikes == 0; the drop came from the score bands alone, not from a dispute penalty"
            - "GET /exchange-network/members/${m2} — trading_power_balance == 49 (107 - 29 - 29) and wallet_credit_cents == 33980 (80100 - 23060 - 23060)"

      - name: request_first_funding_keeps_the_surcharged_power_budget
        claim_type: correct_result
        grounds: ["calculations.request_power_budget", "endpoints[POST /exchange-network/exchange-requests/{request_id}/funding]", "entities.ExchangeRequest.funding_mode"]
        distinguishing_aspect: >-
          The deposit-first advantage is implemented as an asymmetry between two branches of the same
          formula, and attaching a deposit later must NOT convert the request: funding_mode is frozen
          at creation, so the identical 107-power week yields 97 through the REQUEST_FIRST branch
          against 117 through the DEPOSIT_FIRST branch. The charge quoted at creation, when the budget
          was still 0, is also frozen — funding does not requote it.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated, member M1 on PLUS with dues paid (wallet 80100) holding a
            banked TWO_BR week checking in 2027-05-10 worth 107. M1 files an exchange request for a
            ONE_BR at Resort A over 2027-06-01..2027-06-30 WITHOUT deposit_id, so funding_mode is
            REQUEST_FIRST, power_budget is 0 and the estimate of 82 is entirely a shortfall: subtotal
            20900 + 82*350 + 2500 = 52100, no deposit-first credit, processing fee 2900, quoted charge
            55000, leaving wallet 25100.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m1: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30" }
              captures: { req: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/exchange-requests/${req}/funding"
              as: Member
              as_user_id: "${m1}"
              payload: { deposit_id: "${dep_m1}" }
          assert:
            - "the creation call returned funding_mode \"REQUEST_FIRST\", power_budget 0, required_power_estimate 82 and quoted_charge_cents 55000"
            - "HTTP 200; data.deposit_id == \"${dep_m1}\" and data.funding_mode is still \"REQUEST_FIRST\" — attaching a deposit never promotes the request"
            - "data.power_budget == 97 (floor(107 * 100 / 110)), NOT 117 (floor(107 * 110 / 100)) and NOT 107"
            - "data.quoted_charge_cents is still 55000 and data.charge_refunded_cents is 0; the charge is quoted once, at creation"
            - "data.status is still \"SUBMITTED\""
            - "GET /exchange-network/members/${m1} — wallet_credit_cents == 25100 and trading_power_balance == 107; funding moves no cash and no power"

      - name: deposit_first_credit_band_boundary_at_subtotal_9999
        claim_type: tiered_pricing
        grounds: ["calculations.exchange_charge.DEPOSIT_FIRST_CREDIT_BANDS", "calculations.exchange_charge.band_selection_is_normative"]
        distinguishing_aspect: >-
          The first credit band pays 0 percent, so crossing from subtotal 9999 to 10000 makes the
          member's total go DOWN by 499 cents: one extra cent of base fee buys a 500-cent credit. The
          inclusive upper bound must be honoured exactly — a server using `< 9999` or `<= 10000`
          inverts the sign of the jump, and a server keying the band on the post-credit total cannot
          reproduce either figure.
        test_recipe:
          setup: >-
            Two tiers whose only meaningful difference is one cent of base fee: BASIC with
            base_exchange_fee_cents 9999 and PLUS with 10000, both with annual_dues_cents 0,
            priority_surcharge_cents 0, deposit_first_bonus_pct 10 and max_active_requests 3. Resort A
            (units_per_size 2) affiliated with a GOLD band. One member on each tier pays dues of
            100000 with nothing withheld, so both wallets start at 100000, and each banks a ONE_BR
            week checking in 2027-06-15 worth 82, giving power_budget floor(82 * 110 / 100) = 90. Both
            then file a DEPOSIT_FIRST request for a ONE_BR at Resort A with the window pinned to the
            single day 2027-06-15, so required_power_estimate is 82 and power_gap is 0 — the subtotal
            is the base fee alone.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "BASIC", annual_dues_cents: 0, base_exchange_fee_cents: 9999, priority_surcharge_cents: 0, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 0, reinstatement_fee_cents: 0, extension_fee_cents_per_month: 0 }
              captures: { basic_tier: "$.data.id" }
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 0, base_exchange_fee_cents: 10000, priority_surcharge_cents: 0, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 0, reinstatement_fee_cents: 0, extension_fee_cents_per_month: 0 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
