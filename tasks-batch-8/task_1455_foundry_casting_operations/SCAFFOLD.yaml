    description: "List equipment (reverse-reachability for Equipment.foundry_id)"
    roles: [FoundryAdmin, MeltSupervisor, LineOperator]
    code: 200
    input: ["foundry_id?", "kind?", "limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []
