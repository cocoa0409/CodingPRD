              captures: { sub_comp_1: $.data.competency_status, sub_grace: $.data.current_grace_days, sub_deadline: $.data.lapse_deadline, sub_expires: $.data.competency_expires_at }
            - call: "GET /poct/operators/${op_dir}"
              as: QualityCoordinator
              captures: { dir_grace: $.data.current_grace_days, dir_deadline: $.data.lapse_deadline }
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/oversight-runs"
              payload: { note: "run one day past the lapse deadline" }
              as: ProgramAdmin
              captures: { lapsed_after: $.data.competencies_lapsed, locked_after: $.data.operators_locked_out }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { posture_after: $.data.oversight_posture, lapsed_count: $.data.lapsed_or_locked_operator_count, readiness_after: $.data.inspection_readiness_score }
          assert:
            - "${asm_status} == \"APPROVED\" and ${sub_expires} == \"2026-09-15\""
            - "${sub_grace} == 14 (BASE_GRACE_DAYS_OTHER 14 minus POSTURE_PENALTY_OPEN 0) and ${sub_deadline} == \"2026-09-29\""
            - "${dir_grace} == 30 (BASE_GRACE_DAYS_PHYSICIAN) and ${dir_deadline} == null - phase 1 assigns grace to every operator, deadline only where competency_expires_at exists"
            - "${lapsed_on_deadline} == 0 and ${locked_on_deadline} == 0 and ${sub_comp_1} == \"COMPETENT\" - phase 2 uses a STRICT date(now) > lapse_deadline"
            - "${lapsed_after} == 1 and ${locked_after} == 1"
            - "Operator.${op_sub}.competency_status == LAPSED and .access_status == LOCKED_OUT and .lockout_reason == \"COMPETENCY_LAPSED\""
            - "${lapsed_count} == 1 and TestSite.${site_id}.total_operator_count == 3"
            - "${posture_after} == \"OPEN\" (1 * 2 == 2 is NOT > 3)"
            - "${readiness_after} == 91.67 (competency_gap_pct 33.33... -> min(25.00, round(33.3333 * 0.25, 2)) == 8.33)"

      - name: correct_result_for_the_readiness_score_from_known_inputs
        claim_type: correct_result
        grounds:
          - calculations.site_inspection_readiness_score
        excluded_because:
          difficulty_instance: combinatorial_formula / readiness_four_penalty_terms_with_two_caps_binding_under_moderate_scope
          rationale: "All four penalty terms are computed from pinned inputs and asserted as literals there."

      - name: constants_applied_from_the_readiness_penalty_table
        claim_type: constants_applied
        grounds:
          - calculations.site_inspection_readiness_score.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / readiness_four_penalty_terms_with_two_caps_binding_under_moderate_scope
          rationale: "That instance drives two of the caps (DEFICIENCY_PENALTY_CAP and COMPETENCY_PENALTY_CAP) to bind simultaneously, which is the sharpest test of the constant table."

      - name: precision_and_rounding_order_of_the_site_index
        claim_type: precision
        grounds:
          - calculations.site_qc_compliance_index.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / site_index_two_stage_rounding_order_pinned_at_forty_one_fifty
          rationale: "The pinned two-stage rounding order (41.50, not 41.67) is exactly that instance's subject."

      - name: aggregation_of_covered_days_into_the_device_rate
        claim_type: aggregation
        grounds:
          - calculations.device_qc_compliance_rate
        excluded_because:
          difficulty_instance: dual_variant_calc / device_qc_rate_calendar_basis_vs_day_of_use_basis_divergence
          rationale: "Numerator and both denominators are asserted as literals there."

      - name: weighted_scoring_terms_sum_without_rounding_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.site_inspection_readiness_score
        excluded_because:
          difficulty_instance: combinatorial_formula / readiness_four_penalty_terms_with_two_caps_binding_under_moderate_scope
          rationale: "Four simultaneously non-zero terms with per-term rounding before capping are asserted there."

      - name: forward_looking_credit_for_in_flight_remediation
        claim_type: forward_looking
        grounds:
          - calculations.site_inspection_readiness_score.variants.PRE_SURVEY_PROJECTED
        excluded_because:
          difficulty_instance: dual_variant_calc / readiness_basis_variant_divergence_on_submitted_correction
          rationale: "The projected basis excluding an in-flight CORRECTION_SUBMITTED finding is that instance's whole point."

      - name: interval_merge_on_touching_coverage_endpoints
        claim_type: interval_merge
        grounds:
          - calculations.certificate_coverage_overlap
        excluded_because:
          difficulty_instance: resource_temporal_overlap / coverage_window_touching_endpoint_collides_then_next_day_is_accepted
          rationale: "Closed-closed touching endpoints colliding and the next-day window being accepted are asserted there."

      - name: variant_divergence_between_the_two_qc_rate_bases
        claim_type: variant_divergence
        grounds:
          - calculations.device_qc_compliance_rate.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / device_qc_rate_calendar_basis_vs_day_of_use_basis_divergence
          rationale: "Same stored QC and result data, two different rates, with the delta asserted."

      - name: variant_selection_by_the_basis_query_parameter
        claim_type: variant_selection
        grounds:
          - endpoints[GET /poct/sites/{id}/readiness]
        excluded_because:
          difficulty_instance: dual_variant_calc / readiness_basis_variant_divergence_on_submitted_correction
          rationale: "Both explicit basis values are requested there and each returns its own variant's score."

      - name: reconciliation_of_the_persisted_score_after_a_projected_read
        claim_type: reconciliation
        grounds:
          - entities.TestSite.fields.inspection_readiness_score
        excluded_because:
          difficulty_instance: dual_variant_calc / readiness_basis_variant_divergence_on_submitted_correction
          rationale: "That instance asserts the PRE_SURVEY_PROJECTED read still persists the AS_OF_ACTUAL value, i.e. the variant switch does not corrupt the stored figure."

  # ===========================================================================
  # Section 4 - Validations (claim-extraction-guide "From Table 4")
  # 39 ordered rules; the priority-ordering and priority-conflict rows are §1.8's
  # priority_pair_validation_conflict territory and are stubbed here.
  # ===========================================================================
  - section: validations
    instances:

      - name: manual_entry_result_without_reason_returns_manual_entry_reason_required
        claim_type: violation_to_error
        grounds:
          - validations[priority:21]
          - errors[ERR_MANUAL_ENTRY_REASON_REQUIRED]
          - entities.TestResult.fields.manual_entry_reason
        distinguishing_aspect: |
          manual_entry_reason is conditionally required: with entry_mode MANUAL and
          the field omitted the request dies at priority 21 with a 400, BEFORE the
          422 manual-entry permission rule at priority 66 - even though the site is
          OPEN and the device is a MANUAL_ENTRY instrument, so 66 would have passed.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site at posture OPEN, one trained operator, device GLUCO-9 with connectivity_mode MANUAL_ENTRY and manual_entry_suspended false, VERIFIED lot expiring 2027-01-31."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243030", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Infusion Suite POCT", department_code: "DEPT-2200", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Rhea Talbot", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-2200", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "MANUAL_ENTRY", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
              captures: { lot_state: $.data.verification_status }
          trigger:
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_id}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-3001", analyte: "GLUCOSE", measured_value: 112.0, entry_mode: "MANUAL" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "${lot_state} == \"VERIFIED\""
            - "HTTP status is 400"
            - "${err} == \"ERR_MANUAL_ENTRY_REASON_REQUIRED\" (NOT ERR_MANUAL_ENTRY_NOT_PERMITTED - priority 21 precedes priority 66)"
            - "${msg} names manual_entry_reason"
            - "GET /poct/test-results?device_id=${dev_id} returns meta.total_count == 0"
            - "TestSite.${site_id}.oversight_posture == OPEN and .manual_entry_blocked == false - the permission rule would have passed"

      - name: manual_entry_result_posts_only_after_a_second_person_review
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority:21]
          - validations[priority:65]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.TestResult.PENDING_REVIEW_to_POSTED
        distinguishing_aspect: |
          With manual_entry_reason supplied the same request that failed at
          priority 21 now succeeds; posting it then exercises segregation clause
          (d) - the operator who keyed the value is refused with 422 and a second
          trained operator's post succeeds, writing posted_value and
          posted_by_user_id.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site at posture OPEN, TWO trained operators (both PROVISIONAL x ACTIVE), device GLUCO-9 connectivity_mode MANUAL_ENTRY, VERIFIED lot."
            - "Operator A keys one MANUAL result with a reason, so it sits in PENDING_REVIEW with operator_id == A."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243031", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Pre-Op Clinic POCT", department_code: "DEPT-2300", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Sam Ito", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_a: $.data.id }
            - call: "POST /poct/operators/${op_a}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Tia Moreau", role_title: "NURSE", hire_date: "2026-02-05" }
              as: ProgramAdmin
              captures: { op_b: $.data.id }
            - call: "POST /poct/operators/${op_b}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-21" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-2300", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "MANUAL_ENTRY", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_a}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op_a}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_a}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op_a}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_id}", operator_id: "${op_a}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-3101", analyte: "GLUCOSE", measured_value: 112.0, entry_mode: "MANUAL", manual_entry_reason: "meter interface offline during the draw" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { res_id: $.data.id, res_status: $.data.posting_status, res_reason: $.data.manual_entry_reason }
          trigger:
            - call: "POST /poct/test-results/${res_id}/post"
