  # ===========================================================================
  - section: rbac
    instances:

      - name: checklist_verifier_may_not_be_its_executor
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=15]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.PrefunctionalChecklist.fields.executed_by_user_id
          - roles.Contractor
        distinguishing_aspect: "Segregation of duties compares X-User-ID, not role: a CxAuthority acting under the same user id that executed the checklist is refused with 403 ERR_SEGREGATION_OF_DUTIES, while a different CxAuthority user id succeeds."
        test_recipe:
          setup:
            - "Project P with EquipmentUnit E1 (weight_units 10) INSTALLED."
            - "Checklist CL1 has one recorded item and was executed under X-User-ID u-shared-1."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "SoD Cx", building_name: "SoD Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-SD", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-shared-1"
            - call: "POST /prefunctional-checklists"
              payload: { equipment_id: "${e1}", template_code: "PFC-AHU-STD" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { cl1: $.data.id }
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-01", description: "Filters installed", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-01", result: "PASS" }
              as: Contractor
              as_user_id: "u-shared-1"
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-shared-1"
              captures: { executor: $.data.executed_by_user_id }
          trigger:
            - call: "POST /prefunctional-checklists/${cl1}/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-shared-1"
              captures: { err: $.data.error_id }
            - call: "POST /prefunctional-checklists/${cl1}/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-9"
              captures: { status_after: $.data.status, verifier: $.data.verified_by_user_id }
          assert:
            - "${executor} == u-shared-1"
            - "${err} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "${status_after} == VERIFIED and ${verifier} == u-cxa-9"
            - "CxProject.${p}.verified_prefunctional_units == 10"

      - name: deliverable_acceptor_may_not_be_its_deliverer
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=15]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.CloseoutDeliverable.fields.delivered_by_user_id
        distinguishing_aspect: "The second segregation pair is on CloseoutDeliverable: accepting under the same X-User-ID that delivered answers 403 ERR_SEGREGATION_OF_DUTIES, and the deliverable stays DELIVERED."
        test_recipe:
          setup:
            - "Project P with one SYSTEMS_MANUAL_SECTION deliverable D1 delivered under X-User-ID u-shared-2."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "SoD2 Cx", building_name: "SoD2 Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
