# =============================================================================
# SCAFFOLD — Labor Relations & Collective Bargaining Administration (task 1147)
# Employer-side labor relations department platform.
# =============================================================================

scenario: |
  generate task hard than expert level! 1147. Labor Relations & Collective
  Bargaining Administration (employer labor relations department): contract term
  repository & clause interpretation, bargaining calendar & proposal exchange
  tracking, costing of economic proposals & scenario modeling, ratification vote
  & implementation of new terms, side letter & memorandum of agreement tracking,
  past-practice documentation, union information request response deadline,
  contract expiration planning

domain_name: labor-relations-collective-bargaining
api_prefix: /labor-relations

complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency        # OCC on CollectiveAgreement.version for lock-supersede and extend
    - cascading_side_effects        # ratification cascade depth 5; decertify cascade; extend recompute
    - dual_variant_calculation      # PROVISIONAL vs FINAL costing; LEGALISTIC vs OPERATIONAL practice strength
    - ops_run_checkpoint            # logical clock sweep advances the system epoch (expiry, overdue, MISSED, NO_SHOW)
  entity_topology: flat             # all collections directly under api_prefix; FK references in bodies
  state_machine_shape: cyclic       # negotiation counter rounds, costing rework loop, dispute cycles, EXPIRED<->EXTENDED
  relationship_patterns:
    - one_to_many                   # Union -> Agreement -> Clause/Session/Proposal/...
    - self_referential              # Proposal.supersedes_proposal_id (counter-proposal chain)
    - cross_aggregate               # Proposal.clause_id may reference a clause on the incumbent agreement
  role_model: segregation_of_duties # coster != reviewer != locker; drafter != executor
  consistency_model: immediate      # all mutations + cascades atomic in the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Union
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Union legal name" }
      - { name: union_code, type: string, source: input, description: "Unique union code", constraints: "unique across all unions" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TRUSTEED | DECERTIFIED", default: ACTIVE }
      - { name: open_information_request_count, type: integer, source: computed, description: "Count of InformationRequest rows for this union with status IN {RECEIVED, ACKNOWLEDGED, IN_PROGRESS, OBJECTED}", default: 0 }

  - name: CollectiveAgreement
    parent: null
    common_fields: true
    fields:
      - { name: union_id, type: string, source: input, description: "FK -> Union.id; the signatory union" }
      - { name: title, type: string, source: input, description: "Agreement title" }
      - { name: effective_date, type: datetime, source: input, description: "Contract effective date (UTC)" }
      - { name: expiration_date, type: datetime, source: input, description: "Contract expiration date (UTC); must be > effective_date" }
      - { name: headcount_baseline, type: integer, source: input, description: "Actual current bargaining-unit headcount (FINAL costing basis)" }
      - { name: fte_projected, type: integer, source: input, description: "Projected FTE over the successor term (PROVISIONAL costing basis)" }
      - { name: avg_loaded_wage_cents, type: integer, source: input, description: "Average loaded hourly wage in cents" }
      - { name: costing_envelope_cents, type: integer, source: input, description: "Board-approved year-1 economic envelope for the package" }
      - { name: envelope_committed_cents, type: integer, source: computed, description: "Sum of estimated_year1_cost_cents over proposals of this agreement with status IN {ACCEPTED, IMPLEMENTED}", default: 0 }
      - { name: deadline_mode, type: enum, source: input, description: "BUSINESS | CALENDAR — deadline arithmetic mode for linked information requests", default: BUSINESS }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | EXTENDED | REPLACED | ARCHIVED", default: DRAFT }
      - { name: posture, type: enum, source: computed, description: "NEGOTIATING | OPEN | SUNSET | CRITICAL | UNCOVERED | CLOSED — derived from status + days to expiration per calc agreement_posture" }
      - { name: extension_count, type: integer, source: system, description: "Number of EXTENDED transitions applied", default: 0 }

  - name: Clause
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CollectiveAgreement.id; owning agreement" }
      - { name: article_ref, type: string, source: input, description: "Article/section reference, e.g. '12.1'", constraints: "unique within agreement_id" }
      - { name: title, type: string, source: input, description: "Clause title" }
      - { name: body_text, type: string, source: input, description: "Clause text" }
      - { name: is_economic, type: boolean, source: input, description: "Whether the clause has economic effect", default: false }
      - { name: interpretation_status, type: enum, source: system, description: "UNINTERPRETED | UNDER_REVIEW | INTERPRETED | DISPUTED | RESOLVED", default: UNINTERPRETED }
      - { name: interpretation_text, type: string, source: system, description: "Recorded interpretation ruling text; null until INTERPRETED" }
      - { name: resolved_by_ref, type: string, source: system, description: "Id of the SideLetter (EXECUTED) or PastPractice (VERIFIED) cited at RESOLVED; null otherwise" }

  - name: BargainingSession
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CollectiveAgreement.id; agreement under negotiation" }
      - { name: mediator_id, type: string, source: input, description: "Opaque mediator identifier; half-open interval overlap resource" }
      - { name: lead_negotiator_id, type: string, source: input, description: "Opaque lead negotiator identifier; buffered-interval overlap resource" }
      - { name: location, type: string, source: input, description: "Session location" }
      - { name: start_at, type: datetime, source: input, description: "Session start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Session end (UTC); must be > start_at and duration <= 12h" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_SESSION | COMPLETED | CANCELLED | NO_SHOW", default: SCHEDULED }
      - { name: summary_note, type: string, source: system, description: "Bargaining summary recorded at COMPLETED; null otherwise" }
      - { name: cancel_reason, type: string, source: system, description: "Cancellation reason; null unless CANCELLED" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CollectiveAgreement.id; agreement being bargained" }
      - { name: clause_id, type: string, source: input, description: "FK -> Clause.id; clause this proposal amends (may belong to the incumbent agreement); optional", constraints: "nullable" }
      - { name: side, type: enum, source: input, description: "EMPLOYER | UNION — proposing side" }
      - { name: title, type: string, source: input, description: "Proposal title" }
      - { name: proposal_type, type: enum, source: input, description: "ECONOMIC | NON_ECONOMIC" }
      - { name: wage_increase_pct, type: number, source: input, description: "General wage increase as decimal fraction", constraints: "0 <= p <= 0.25; nullable" }
      - { name: affected_headcount, type: integer, source: input, description: "Headcount covered by this proposal; drives coverage-tier multiplier", constraints: "nullable" }
      - { name: includes_benefits, type: boolean, source: input, description: "Whether wage movement carries benefits loading", default: false }
      - { name: one_time_cost_cents, type: integer, source: input, description: "One-time payment cost in cents", default: 0 }
      - { name: recurring_annual_cost_cents, type: integer, source: input, description: "Recurring annual non-wage cost in cents", default: 0 }
      - { name: session_id, type: string, source: system, description: "Session at which the proposal was tendered; optional, set at TENDERED", constraints: "nullable" }
      - { name: round_number, type: integer, source: system, description: "Negotiation round; 1 at create, +1 for each counter in the supersedes chain", default: 1 }
      - { name: status, type: enum, source: system, description: "DRAFT | TENDERED | ON_TABLE | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | IMPLEMENTED | VOID", default: DRAFT }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the creator" }
      - { name: supersedes_proposal_id, type: string, source: system, description: "FK -> Proposal.id; set on counter-proposals to the proposal they replace; null otherwise", constraints: "nullable" }
      - { name: estimated_year1_cost_cents, type: integer, source: computed, description: "Year-1 cost line assigned by the most recent COMPUTED/LOCKED scenario covering this proposal; null until costed", constraints: "nullable" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at REJECTED; null otherwise" }

  - name: CostingScenario
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CollectiveAgreement.id; agreement whose economics are modeled" }
      - { name: name, type: string, source: input, description: "Scenario name" }
      - { name: scenario_mode, type: enum, source: input, description: "PROVISIONAL | FINAL — selects costing variant" }
      - { name: term_years, type: integer, source: input, description: "Contract term modeled, in years", constraints: "1 <= n <= 5" }
      - { name: proposal_ids, type: array, source: input, description: "ids of Proposal entities included in the model (all must be ECONOMIC and ON_TABLE or ACCEPTED at compute time)" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPUTED | REVIEWED | LOCKED | SUPERSEDED", default: DRAFT }
      - { name: computed_by_user_id, type: string, source: system, description: "X-User-ID that ran the most recent compute" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID that reviewed; must differ from computed_by_user_id", constraints: "nullable" }
      - { name: locked_by_user_id, type: string, source: system, description: "X-User-ID that locked; must differ from computed_by_user_id", constraints: "nullable" }
      - { name: year_breakdown_cents, type: array, source: computed, description: "Per-year total cost lines (length term_years), each line rounded half-up to whole cents before summing" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of year_breakdown_cents before contingency reserve" }
      - { name: reserve_cents, type: integer, source: computed, description: "Contingency reserve = round_half_up(0.05 * subtotal_cents), computed after subtotal (pinned evaluation order)" }
      - { name: total_cost_cents, type: integer, source: computed, description: "subtotal_cents + reserve_cents" }

  - name: RatificationVote
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CollectiveAgreement.id; the DRAFT successor agreement put to membership vote" }
      - { name: eligible_voter_count, type: integer, source: input, description: "Number of bargaining-unit members eligible to vote", constraints: ">= 1" }
      - { name: ballot_close_at, type: datetime, source: input, description: "Ballot closing instant (UTC); tally rejected before this" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | RATIFIED | REJECTED", default: SCHEDULED }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that opened the vote", constraints: "nullable" }
      - { name: votes_for, type: integer, source: system, description: "Ballots in favor, set by tally", constraints: "nullable" }
      - { name: votes_against, type: integer, source: system, description: "Ballots against, set by tally", constraints: "nullable" }
      - { name: votes_cast, type: integer, source: computed, description: "votes_for + votes_against", constraints: "nullable" }
      - { name: quorum_met, type: boolean, source: computed, description: "votes_cast >= ceil(eligible_voter_count / 2)", constraints: "nullable" }
      - { name: retro_payout_cents, type: integer, source: computed, description: "Retroactive payout computed at RATIFIED per calc ratification_retro_payout; 0 when effective_date is not in the past" }

  - name: SideLetter
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CollectiveAgreement.id; agreement the letter rides on" }
      - { name: clause_id, type: string, source: input, description: "FK -> Clause.id; clause the letter interprets or modifies" }
      - { name: letter_type, type: enum, source: input, description: "SIDE_LETTER | MOA | MOU" }
      - { name: title, type: string, source: input, description: "Letter title" }
      - { name: effective_start, type: datetime, source: input, description: "Effective window start (UTC), closed interval" }
      - { name: effective_end, type: datetime, source: input, description: "Effective window end (UTC), closed interval; must be >= effective_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_LEGAL | EXECUTED | EXPIRED | SUPERSEDED", default: DRAFT }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the drafter" }
      - { name: executed_by_user_id, type: string, source: system, description: "X-User-ID of the executing counsel; must differ from drafted_by_user_id", constraints: "nullable" }

  - name: PastPractice
    parent: null
    common_fields: true
    fields:
      - { name: union_id, type: string, source: input, description: "FK -> Union.id; union whose practice is documented" }
      - { name: clause_id, type: string, source: input, description: "FK -> Clause.id; clause the practice relates to; optional", constraints: "nullable" }
      - { name: title, type: string, source: input, description: "Practice title" }
      - { name: description, type: string, source: input, description: "Practice description" }
      - { name: first_observed_date, type: datetime, source: input, description: "First documented occurrence (UTC)" }
      - { name: last_observed_date, type: datetime, source: input, description: "Most recent documented occurrence (UTC); must be >= first_observed_date" }
      - { name: occurrence_count, type: integer, source: input, description: "Number of documented occurrences", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ASSERTED | DOCUMENTED | VERIFIED | DISPUTED | NOTICE_GIVEN | ABANDONED", default: ASSERTED }
      - { name: strength_legalistic, type: number, source: computed, description: "Recency-decayed weighted score per calc past_practice_strength (LEGALISTIC variant), 4 decimals", constraints: "nullable" }
      - { name: strength_operational, type: number, source: computed, description: "Step-decay weighted score per calc past_practice_strength (OPERATIONAL variant), 4 decimals", constraints: "nullable" }
      - { name: asserted_by_user_id, type: string, source: system, description: "X-User-ID of the creator" }
      - { name: abandon_effective_date, type: datetime, source: system, description: "Set at NOTICE_GIVEN = clock + 30 days; sweep flips to ABANDONED at this instant", constraints: "nullable" }

  - name: InformationRequest
    parent: null
    common_fields: true
    fields:
      - { name: union_id, type: string, source: input, description: "FK -> Union.id; requesting union; must equal X-User-ID for UnionRepresentative" }
      - { name: agreement_id, type: string, source: input, description: "FK -> CollectiveAgreement.id; governing agreement (supplies deadline_mode); optional", constraints: "nullable" }
      - { name: subject, type: string, source: input, description: "Subject of the information request" }
      - { name: received_at, type: datetime, source: input, description: "Instant the union's request was received (UTC)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACKNOWLEDGED | IN_PROGRESS | FULFILLED | PARTIALLY_FULFILLED | OBJECTED", default: RECEIVED }
      - { name: due_at, type: datetime, source: computed, description: "Response deadline per calc information_request_deadline; recomputed by extend" }
      - { name: is_overdue, type: boolean, source: computed, description: "true once clock > due_at while status IN {RECEIVED, ACKNOWLEDGED, IN_PROGRESS, OBJECTED}; strictly greater-than at the boundary", default: false }
      - { name: extension_count, type: integer, source: system, description: "Number of extensions granted", default: 0 }
      - { name: response_note, type: string, source: system, description: "Response note recorded at FULFILLED / PARTIALLY_FULFILLED", constraints: "nullable" }
      - { name: objection_basis, type: string, source: system, description: "Statutory basis recorded at OBJECTED", constraints: "nullable" }

  - name: ExpirationTask
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CollectiveAgreement.id; agreement whose expiration is being planned" }
      - { name: title, type: string, source: input, description: "Task title" }
      - { name: task_type, type: enum, source: input, description: "NOTICE_DEADLINE | DATA_PREP | SUNSET_COMMUNICATION | STRIKE_CONTINGENCY | BUDGET_REOPENER" }
      - { name: due_offset_days, type: integer, source: input, description: "Days relative to expiration_date (negative = before expiration)" }
      - { name: due_date, type: datetime, source: computed, description: "expiration_date + due_offset_days; recomputed on every extend of the parent agreement" }
      - { name: assignee_user_id, type: string, source: input, description: "Operator id responsible for the task" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | DONE | MISSED", default: PENDING }
      - { name: completed_late, type: boolean, source: system, description: "true when DONE is reached after due_date (including from MISSED)", default: false }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Union
    initial_state: ACTIVE
    terminal_states: [DECERTIFIED]
    transitions:
      - from: ACTIVE
        to: TRUSTEED
        trigger: "POST /labor-relations/unions/{id}/state (to_status=TRUSTEED)"
        actor: LRAdmin
        preconditions: ["union.status == ACTIVE"]
        side_effects: ["Union.version += 1"]
      - from: TRUSTEED
        to: ACTIVE
        trigger: "POST /labor-relations/unions/{id}/state (to_status=ACTIVE)"
        actor: LRAdmin
        preconditions: ["union.status == TRUSTEED"]
        side_effects: ["Union.version += 1"]
      - from: ACTIVE
        to: DECERTIFIED
        trigger: "POST /labor-relations/unions/{id}/state (to_status=DECERTIFIED)"
        actor: LRAdmin
        preconditions: ["union.status IN {ACTIVE, TRUSTEED}"]
        side_effects:
          - "Cascade link 1: every CollectiveAgreement of this union with status == DRAFT becomes ARCHIVED"
          - "Cascade link 2: every BargainingSession whose agreement was just ARCHIVED (or belongs to this union) with status == SCHEDULED becomes CANCELLED (cancel_reason='UNION_DECERTIFIED')"
          - "Union.version += 1"
      - from: TRUSTEED
        to: DECERTIFIED
        trigger: "POST /labor-relations/unions/{id}/state (to_status=DECERTIFIED)"
        actor: LRAdmin
        preconditions: ["union.status IN {ACTIVE, TRUSTEED}"]
        side_effects: ["Same two-link cascade as ACTIVE -> DECERTIFIED"]

  - entity: CollectiveAgreement
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /labor-relations/agreements/{id}/activate"
        actor: LRAdmin
        preconditions:
          - "agreement.status == DRAFT"
          - "agreement.expiration_date > current clock (ERR_INVALID_STATE otherwise)"
          - "union.status == ACTIVE (ERR_UNION_TRUSTEED / ERR_UNION_DECERTIFIED otherwise)"
        side_effects:
          - "Any other agreement of the same union with status IN {ACTIVE, EXTENDED} becomes REPLACED (incumbent supersession)"
          - "posture recomputed per calc agreement_posture"
          - "CollectiveAgreement.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep: clock > expiration_date"
        actor: system
        preconditions: ["clock > expiration_date (strictly)"]
        side_effects: ["posture -> UNCOVERED", "CollectiveAgreement.version += 1"]
      - from: EXTENDED
        to: EXPIRED
        trigger: "system clock sweep: clock > expiration_date"
        actor: system
        preconditions: ["clock > expiration_date (strictly)"]
        side_effects: ["posture -> UNCOVERED", "CollectiveAgreement.version += 1"]
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /labor-relations/agreements/{id}/extend"
        actor: ChiefNegotiator
        preconditions:
          - "agreement.status IN {ACTIVE, EXPIRED, EXTENDED}"
          - "new_expiration_date > current expiration_date (ERR_EXTENSION_NOT_FORWARD)"
          - "expected_agreement_version == agreement.version (ERR_STALE_AGREEMENT_VERSION)"
        side_effects:
          - "expiration_date = new_expiration_date; extension_count += 1"
          - "Cascade link 1: every ExpirationTask of this agreement with status IN {PENDING, IN_PROGRESS} recomputes due_date = new expiration_date + due_offset_days"
          - "Cascade link 2: any such task whose recomputed due_date < current clock becomes MISSED in the same request"
          - "posture recomputed per calc agreement_posture"
          - "CollectiveAgreement.version += 1"
      - from: EXPIRED
        to: EXTENDED
        trigger: "POST /labor-relations/agreements/{id}/extend"
        actor: ChiefNegotiator
        preconditions: ["same as ACTIVE -> EXTENDED"]
        side_effects: ["same as ACTIVE -> EXTENDED"]
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /labor-relations/agreements/{id}/extend"
        actor: ChiefNegotiator
        preconditions: ["same as ACTIVE -> EXTENDED (re-extension is permitted)"]
        side_effects: ["same as ACTIVE -> EXTENDED"]
      - from: ACTIVE
        to: REPLACED
        trigger: "system cascade: successor agreement activated (directly or via RATIFIED vote)"
        actor: system
        preconditions: ["a different agreement of the same union transitions to ACTIVE"]
        side_effects: ["posture -> CLOSED", "CollectiveAgreement.version += 1"]
      - from: EXTENDED
        to: REPLACED
        trigger: "system cascade: successor agreement activated"
        actor: system
        preconditions: ["a different agreement of the same union transitions to ACTIVE"]
        side_effects: ["posture -> CLOSED", "CollectiveAgreement.version += 1"]
      - from: EXPIRED
        to: ARCHIVED
        trigger: "POST /labor-relations/agreements/{id}/archive"
        actor: LRAdmin
        preconditions: ["agreement.status IN {EXPIRED, REPLACED}"]
        side_effects: ["posture -> CLOSED", "CollectiveAgreement.version += 1"]
      - from: REPLACED
        to: ARCHIVED
        trigger: "POST /labor-relations/agreements/{id}/archive"
        actor: LRAdmin
        preconditions: ["agreement.status IN {EXPIRED, REPLACED}"]
        side_effects: ["posture -> CLOSED", "CollectiveAgreement.version += 1"]

  - entity: Clause
    initial_state: UNINTERPRETED
    terminal_states: []
    transitions:
      - from: UNINTERPRETED
        to: UNDER_REVIEW
        trigger: "POST /labor-relations/clauses/{id}/interpretation (action=OPEN_REVIEW)"
        actor: LRManager
        preconditions: ["clause.interpretation_status == UNINTERPRETED"]
        side_effects: ["Clause.version += 1"]
      - from: UNDER_REVIEW
        to: UNINTERPRETED
        trigger: "POST /labor-relations/clauses/{id}/interpretation (action=CLOSE_REVIEW)"
        actor: LRManager
        preconditions: ["clause.interpretation_status == UNDER_REVIEW"]
        side_effects: ["Clause.version += 1"]
      - from: UNDER_REVIEW
        to: INTERPRETED
        trigger: "POST /labor-relations/clauses/{id}/interpretation (action=RECORD, interpretation_text required)"
        actor: LegalCounsel
        preconditions: ["clause.interpretation_status == UNDER_REVIEW", "interpretation_text present (ERR_INVALID_REQUEST otherwise)"]
        side_effects: ["interpretation_text stored", "Clause.version += 1"]
      - from: INTERPRETED
        to: DISPUTED
        trigger: "POST /labor-relations/clauses/{id}/interpretation (action=DISPUTE)"
        actor: LRManager | UnionRepresentative
        preconditions: ["clause.interpretation_status IN {INTERPRETED, RESOLVED}", "UnionRepresentative X-User-ID must equal clause.agreement.union_id (ERR_UNION_MISMATCH)"]
        side_effects: ["Clause.version += 1"]
      - from: RESOLVED
        to: DISPUTED
        trigger: "POST /labor-relations/clauses/{id}/interpretation (action=DISPUTE)"
        actor: LRManager | UnionRepresentative
        preconditions: ["same as INTERPRETED -> DISPUTED (re-dispute cycle)"]
        side_effects: ["resolved_by_ref cleared", "Clause.version += 1"]
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /labor-relations/clauses/{id}/interpretation (action=RESOLVE, exactly one of side_letter_id / past_practice_id required)"
        actor: LegalCounsel
        preconditions:
          - "clause.interpretation_status == DISPUTED"
          - "exactly one of side_letter_id / past_practice_id present (ERR_INVALID_REQUEST otherwise)"
          - "referenced SideLetter.status == EXECUTED or referenced PastPractice.status == VERIFIED (ERR_RESOLUTION_REFERENCE_INVALID)"
        side_effects: ["resolved_by_ref set to the cited id", "Clause.version += 1"]
      - from: INTERPRETED
        to: UNDER_REVIEW
        trigger: "system cascade: an EXECUTED SideLetter on this clause becomes SUPERSEDED"
        actor: system
        preconditions: ["clause.interpretation_status IN {INTERPRETED, DISPUTED, RESOLVED}"]
        side_effects: ["resolved_by_ref cleared when it referenced the superseded letter", "Clause.version += 1"]
        note: "same cascade transition applies from DISPUTED and RESOLVED"

  - entity: BargainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /labor-relations/sessions/{id}/state (to_status=IN_SESSION)"
        actor: ChiefNegotiator
        preconditions: ["session.status == SCHEDULED", "clock >= session.start_at (ERR_SESSION_NOT_STARTED)"]
        side_effects: ["BargainingSession.version += 1"]
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /labor-relations/sessions/{id}/state (to_status=COMPLETED, summary_note required)"
        actor: ChiefNegotiator
        preconditions: ["session.status == IN_SESSION", "summary_note present (ERR_INVALID_REQUEST otherwise)"]
        side_effects: ["summary_note stored", "BargainingSession.version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /labor-relations/sessions/{id}/state (to_status=CANCELLED, cancel_reason required)"
        actor: Negotiator | ChiefNegotiator
        preconditions: ["session.status == SCHEDULED", "cancel_reason present (ERR_INVALID_REQUEST otherwise)"]
        side_effects:
          - "Mediator scheduled-minutes invariant: the session's (end_at - start_at) minutes are released from the mediator's SCHEDULED aggregate"
          - "BargainingSession.version += 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system clock sweep: clock > end_at while still SCHEDULED"
        actor: system
        preconditions: ["clock > end_at (strictly)"]
        side_effects:
          - "Mediator scheduled-minutes released exactly as in CANCELLED"
          - "BargainingSession.version += 1"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [COUNTERED, REJECTED, WITHDRAWN, VOID]
    transitions:
      - from: DRAFT
        to: TENDERED
        trigger: "POST /labor-relations/proposals/{id}/state (to_status=TENDERED, session_id optional)"
        actor: "ChiefNegotiator (EMPLOYER proposals) | UnionRepresentative (UNION proposals, X-User-ID == agreement.union_id)"
        preconditions:
          - "proposal.status == DRAFT"
          - "actor side matches proposal.side (ERR_WRONG_SIDE)"
          - "agreement is bargainable: agreement.status IN {DRAFT, EXPIRED, EXTENDED} OR agreement.posture IN {SUNSET, CRITICAL} (ERR_AGREEMENT_NOT_BARGAINABLE)"
          - "union.status == ACTIVE (ERR_UNION_TRUSTEED / ERR_UNION_DECERTIFIED)"
          - "when session_id present: session.agreement_id == proposal.agreement_id AND session.status IN {IN_SESSION, COMPLETED} (ERR_INVALID_STATE)"
        side_effects: ["session_id stored when provided", "Proposal.version += 1"]
      - from: TENDERED
        to: ON_TABLE
        trigger: "POST /labor-relations/proposals/{id}/state (to_status=ON_TABLE)"
        actor: "receiving side: UnionRepresentative for EMPLOYER proposals | ChiefNegotiator for UNION proposals"
        preconditions: ["proposal.status == TENDERED", "actor side != proposal.side (ERR_WRONG_SIDE)"]
        side_effects: ["Proposal.version += 1"]
      - from: ON_TABLE
        to: ACCEPTED
        trigger: "POST /labor-relations/proposals/{id}/state (to_status=ACCEPTED)"
        actor: "receiving side (as ON_TABLE)"
        preconditions:
          - "proposal.status == ON_TABLE"
          - "actor side != proposal.side (ERR_WRONG_SIDE)"
          - "when proposal_type == ECONOMIC: a CostingScenario with status == LOCKED exists for this agreement whose proposal_ids contains this proposal (ERR_COSTING_NOT_LOCKED)"
          - "when proposal_type == ECONOMIC: agreement.envelope_committed_cents + proposal.estimated_year1_cost_cents <= agreement.costing_envelope_cents (ERR_ENVELOPE_EXCEEDED; equality allowed)"
        side_effects:
          - "agreement.envelope_committed_cents recomputed (this proposal now included)"
          - "CollectiveAgreement.version += 1; Proposal.version += 1"
      - from: ON_TABLE
        to: REJECTED
        trigger: "POST /labor-relations/proposals/{id}/state (to_status=REJECTED, reason required)"
        actor: "receiving side (as ON_TABLE)"
        preconditions: ["proposal.status == ON_TABLE", "actor side != proposal.side", "reason present (ERR_INVALID_REQUEST otherwise)"]
        side_effects: ["rejection_reason stored", "Proposal.version += 1"]
      - from: ON_TABLE
        to: WITHDRAWN
        trigger: "POST /labor-relations/proposals/{id}/state (to_status=WITHDRAWN)"
        actor: "proposing side: ChiefNegotiator for EMPLOYER proposals | UnionRepresentative for UNION proposals"
        preconditions: ["proposal.status == ON_TABLE", "actor side == proposal.side (ERR_WRONG_SIDE)"]
        side_effects: ["Proposal.version += 1"]
      - from: ON_TABLE
        to: COUNTERED
        trigger: "POST /labor-relations/proposals/{id}/counter"
        actor: "receiving side (as ON_TABLE)"
        preconditions:
          - "proposal.status == ON_TABLE"
          - "actor side != proposal.side (ERR_WRONG_SIDE)"
          - "proposal.round_number < 12 (ERR_MAX_ROUNDS_EXCEEDED)"
        side_effects:
          - "New Proposal created: side flipped, status = ON_TABLE, round_number = original.round_number + 1, supersedes_proposal_id = original.id, same agreement_id and clause_id"
          - "Original proposal.status -> COUNTERED"
          - "Proposal.version += 1 on the original"
      - from: ACCEPTED
        to: IMPLEMENTED
        trigger: "system cascade: ratification vote on the agreement decides RATIFIED"
        actor: system
        preconditions: ["vote on proposal.agreement_id reaches RATIFIED"]
        side_effects:
          - "Cross-entity cascade: every EXECUTED SideLetter with clause_id == proposal.clause_id whose [effective_start, effective_end] overlaps the agreement's [effective_date, expiration_date] (closed-interval test) becomes SUPERSEDED"
          - "Each such supersession re-triggers the Clause cascade: clause.interpretation_status IN {INTERPRETED, DISPUTED, RESOLVED} -> UNDER_REVIEW"
          - "Proposal.version += 1"
      - from: ACCEPTED
        to: ON_TABLE
        trigger: "system cascade: ratification vote decides REJECTED (compensation revert)"
        actor: system
        preconditions: ["vote on proposal.agreement_id reaches REJECTED"]
        side_effects:
          - "agreement.envelope_committed_cents recomputed (this proposal dropped back out)"
          - "CollectiveAgreement.version += 1; Proposal.version += 1"
      - from: IMPLEMENTED
        to: VOID
        trigger: "POST /labor-relations/proposals/{id}/void-implementation"
        actor: LRAdmin
        preconditions: ["proposal.status == IMPLEMENTED"]
        side_effects:
          - "Envelope conservation: agreement.envelope_committed_cents recomputed (this proposal removed)"
          - "CollectiveAgreement.version += 1; Proposal.version += 1"

  - entity: CostingScenario
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /labor-relations/costing-scenarios/{id}/state (to_status=COMPUTED)"
        actor: Negotiator
        preconditions:
          - "scenario.status IN {DRAFT, REVIEWED} (recompute after rework reuses this transition's computation)"
          - "every id in proposal_ids resolves to a Proposal with agreement_id == scenario.agreement_id, proposal_type == ECONOMIC, status IN {ON_TABLE, ACCEPTED} (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "calc scenario_total_cost executes in scenario.scenario_mode; year_breakdown_cents, subtotal_cents, reserve_cents, total_cost_cents stored"
          - "each included proposal.estimated_year1_cost_cents overwritten with its year-1 line under this scenario's variant"
          - "computed_by_user_id = X-User-ID"
          - "CostingScenario.version += 1"
      - from: REVIEWED
        to: DRAFT
        trigger: "POST /labor-relations/costing-scenarios/{id}/state (to_status=DRAFT)"
        actor: Negotiator
        preconditions: ["scenario.status == REVIEWED"]
        side_effects: ["rework loop: totals retained but stale until recomputed", "CostingScenario.version += 1"]
      - from: COMPUTED
        to: REVIEWED
        trigger: "POST /labor-relations/costing-scenarios/{id}/state (to_status=REVIEWED)"
        actor: Negotiator
        preconditions:
          - "scenario.status == COMPUTED"
          - "X-User-ID != scenario.computed_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: ["reviewed_by_user_id = X-User-ID", "CostingScenario.version += 1"]
      - from: REVIEWED
        to: LOCKED
        trigger: "POST /labor-relations/costing-scenarios/{id}/lock"
        actor: ChiefNegotiator
        preconditions:
          - "scenario.status == REVIEWED"
          - "X-User-ID != scenario.computed_by_user_id (ERR_SOD_VIOLATION)"
          - "expected_agreement_version == agreement.version (ERR_STALE_AGREEMENT_VERSION, 412)"
        side_effects:
          - "Any other CostingScenario of the same agreement with status == LOCKED becomes SUPERSEDED (lock-supersede)"
          - "CollectiveAgreement.version += 1; CostingScenario.version += 1"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system cascade: another scenario of the same agreement becomes LOCKED"
        actor: system
        preconditions: ["a different scenario of the same agreement transitions to LOCKED"]
        side_effects: ["CostingScenario.version += 1"]

  - entity: RatificationVote
    initial_state: SCHEDULED
    terminal_states: [RATIFIED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /labor-relations/ratification-votes/{id}/state (to_status=OPEN)"
        actor: ChiefNegotiator
        preconditions:
          - "vote.status == SCHEDULED"
          - "a CostingScenario with status == LOCKED exists for vote.agreement_id (ERR_NO_LOCKED_SCENARIO)"
          - "at least one Proposal of vote.agreement_id has status == ACCEPTED (ERR_NO_ACCEPTED_PACKAGE)"
          - "ballot_close_at > current clock (ERR_INVALID_STATE otherwise)"
        side_effects: ["opened_by_user_id = X-User-ID", "RatificationVote.version += 1"]
      - from: OPEN
        to: RATIFIED
        trigger: "POST /labor-relations/ratification-votes/{id}/tally (system-decided per calc ratification_outcome)"
        actor: "UnionRepresentative (X-User-ID == vote.agreement.union_id, ERR_UNION_MISMATCH)"
        preconditions: ["vote.status == OPEN", "clock >= ballot_close_at (ERR_BALLOT_STILL_OPEN)", "calc ratification_outcome: quorum_met AND approved"]
        side_effects:
          - "votes_for, votes_against, votes_cast, quorum_met stored; calc ratification_retro_payout executes -> retro_payout_cents"
          - "Cascade link 1: agreement DRAFT -> ACTIVE (posture recomputed)"
          - "Cascade link 2 (caused by link 1): the incumbent agreement of the same union with status IN {ACTIVE, EXTENDED} becomes REPLACED"
          - "Cascade link 3 (caused by link 1): every ACCEPTED proposal of the agreement becomes IMPLEMENTED; envelope_committed_cents recomputed"
          - "Cascade link 4 (caused by link 3): EXECUTED side letters overlapping per Proposal ACCEPTED->IMPLEMENTED side effects become SUPERSEDED"
          - "Cascade link 5 (caused by link 4): affected clauses with interpretation_status IN {INTERPRETED, DISPUTED, RESOLVED} become UNDER_REVIEW"
          - "RatificationVote.version += 1"
      - from: OPEN
        to: REJECTED
        trigger: "POST /labor-relations/ratification-votes/{id}/tally (system-decided per calc ratification_outcome)"
        actor: "UnionRepresentative (as RATIFIED)"
        preconditions: ["vote.status == OPEN", "clock >= ballot_close_at", "calc ratification_outcome: NOT (quorum_met AND approved)"]
        side_effects:
          - "votes_for, votes_against, votes_cast, quorum_met stored; retro_payout_cents = 0"
          - "Compensation cascade: every ACCEPTED proposal of the agreement reverts to ON_TABLE; envelope_committed_cents recomputed (accepts rolled back)"
          - "RatificationVote.version += 1"

  - entity: SideLetter
    initial_state: DRAFT
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_LEGAL
        trigger: "POST /labor-relations/side-letters/{id}/state (to_status=PENDING_LEGAL)"
        actor: LRManager
        preconditions: ["letter.status == DRAFT"]
        side_effects: ["SideLetter.version += 1"]
      - from: PENDING_LEGAL
        to: DRAFT
        trigger: "POST /labor-relations/side-letters/{id}/state (to_status=DRAFT) — legal return-for-rework loop"
        actor: LegalCounsel
        preconditions: ["letter.status == PENDING_LEGAL"]
        side_effects: ["SideLetter.version += 1"]
      - from: PENDING_LEGAL
        to: EXECUTED
        trigger: "POST /labor-relations/side-letters/{id}/state (to_status=EXECUTED)"
        actor: LegalCounsel
        preconditions:
          - "letter.status == PENDING_LEGAL"
          - "X-User-ID != letter.drafted_by_user_id (ERR_SOD_VIOLATION)"
          - "agreement.status IN {ACTIVE, EXTENDED} (ERR_INVALID_STATE otherwise)"
          - "closed-interval overlap: no other EXECUTED SideLetter with the same clause_id where effective_start <= other.effective_end AND other.effective_start <= effective_end (ERR_SIDE_LETTER_OVERLAP; touching boundaries conflict)"
        side_effects: ["executed_by_user_id = X-User-ID", "SideLetter.version += 1"]
      - from: EXECUTED
        to: EXPIRED
        trigger: "system clock sweep: clock > effective_end"
        actor: system
        preconditions: ["clock > effective_end (strictly)"]
        side_effects: ["SideLetter.version += 1"]
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system cascade: a Proposal referencing this letter's clause becomes IMPLEMENTED with overlapping effective window"
        actor: system
        preconditions: ["proposal.status IMPLEMENTED", "proposal.clause_id == letter.clause_id", "closed-interval overlap with the agreement window"]
        side_effects:
          - "Clause cascade re-triggered: clause.interpretation_status IN {INTERPRETED, DISPUTED, RESOLVED} -> UNDER_REVIEW"
          - "SideLetter.version += 1"

  - entity: PastPractice
    initial_state: ASSERTED
    terminal_states: [ABANDONED]
    transitions:
      - from: ASSERTED
        to: DOCUMENTED
        trigger: "POST /labor-relations/past-practices/{id}/state (to_status=DOCUMENTED)"
        actor: LRManager
        preconditions: ["practice.status IN {ASSERTED, DISPUTED} (re-documentation cycle)"]
        side_effects: ["calc past_practice_strength executes (both variants stored)", "PastPractice.version += 1"]
      - from: DISPUTED
        to: DOCUMENTED
        trigger: "POST /labor-relations/past-practices/{id}/state (to_status=DOCUMENTED)"
        actor: LRManager
        preconditions: ["practice.status IN {ASSERTED, DISPUTED}"]
        side_effects: ["calc past_practice_strength re-executes", "PastPractice.version += 1"]
      - from: DOCUMENTED
        to: VERIFIED
        trigger: "POST /labor-relations/past-practices/{id}/state (to_status=VERIFIED)"
        actor: LegalCounsel
        preconditions:
          - "practice.status == DOCUMENTED"
          - "occurrence_count >= 3 AND strength_legalistic >= 0.5000 (ERR_PRACTICE_NOT_VERIFIABLE)"
        side_effects: ["PastPractice.version += 1"]
      - from: DOCUMENTED
        to: DISPUTED
        trigger: "POST /labor-relations/past-practices/{id}/state (to_status=DISPUTED)"
        actor: LRManager | UnionRepresentative
        preconditions: ["practice.status == DOCUMENTED", "UnionRepresentative X-User-ID must equal practice.union_id (ERR_UNION_MISMATCH)"]
        side_effects: ["PastPractice.version += 1"]
      - from: VERIFIED
        to: NOTICE_GIVEN
        trigger: "POST /labor-relations/past-practices/{id}/state (to_status=NOTICE_GIVEN)"
        actor: LRManager
        preconditions: ["practice.status IN {VERIFIED, NOTICE_GIVEN rescind source VERIFIED}"]
        side_effects: ["abandon_effective_date = current clock + 30 days", "PastPractice.version += 1"]
      - from: NOTICE_GIVEN
        to: VERIFIED
        trigger: "POST /labor-relations/past-practices/{id}/state (to_status=VERIFIED) — rescind abandonment (cycle)"
        actor: LRManager
        preconditions: ["practice.status == NOTICE_GIVEN", "clock < abandon_effective_date (ERR_INVALID_STATE otherwise)"]
        side_effects: ["abandon_effective_date = null", "PastPractice.version += 1"]
      - from: NOTICE_GIVEN
        to: ABANDONED
        trigger: "system clock sweep: clock >= abandon_effective_date"
        actor: system
        preconditions: ["clock >= abandon_effective_date"]
        side_effects:
          - "Cross-entity ripple: clauses with resolved_by_ref == this practice.id move RESOLVED -> DISPUTED (resolution support abandoned)"
          - "PastPractice.version += 1"

  - entity: InformationRequest
    initial_state: RECEIVED
    terminal_states: [FULFILLED]
    transitions:
      - from: RECEIVED
        to: ACKNOWLEDGED
        trigger: "POST /labor-relations/information-requests/{id}/state (to_status=ACKNOWLEDGED)"
        actor: LRManager
        preconditions: ["request.status == RECEIVED"]
        side_effects: ["InformationRequest.version += 1"]
      - from: ACKNOWLEDGED
        to: IN_PROGRESS
        trigger: "POST /labor-relations/information-requests/{id}/state (to_status=IN_PROGRESS)"
        actor: LRManager
        preconditions: ["request.status IN {ACKNOWLEDGED, OBJECTED} (OBJECTED -> IN_PROGRESS is the objection-withdrawn cycle, LegalCounsel only)"]
        side_effects: ["InformationRequest.version += 1"]
      - from: OBJECTED
        to: IN_PROGRESS
        trigger: "POST /labor-relations/information-requests/{id}/state (to_status=IN_PROGRESS)"
        actor: LegalCounsel
        preconditions: ["request.status == OBJECTED"]
        side_effects: ["objection_basis retained for audit", "InformationRequest.version += 1"]
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "POST /labor-relations/information-requests/{id}/state (to_status=FULFILLED, response_note required)"
        actor: LRManager
        preconditions: ["request.status IN {IN_PROGRESS, PARTIALLY_FULFILLED}", "response_note present (ERR_INVALID_REQUEST otherwise)"]
        side_effects: ["union.open_information_request_count -= 1", "Union.version += 1; InformationRequest.version += 1"]
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "POST /labor-relations/information-requests/{id}/state (to_status=FULFILLED, response_note required)"
        actor: LRManager
        preconditions: ["same as IN_PROGRESS -> FULFILLED"]
        side_effects: ["same as IN_PROGRESS -> FULFILLED"]
      - from: IN_PROGRESS
        to: PARTIALLY_FULFILLED
        trigger: "POST /labor-relations/information-requests/{id}/state (to_status=PARTIALLY_FULFILLED, response_note required)"
        actor: LRManager
        preconditions: ["request.status == IN_PROGRESS", "response_note present"]
        side_effects: ["union.open_information_request_count -= 1", "Union.version += 1; InformationRequest.version += 1"]
      - from: IN_PROGRESS
        to: OBJECTED
        trigger: "POST /labor-relations/information-requests/{id}/state (to_status=OBJECTED, objection_basis required)"
        actor: LegalCounsel
        preconditions: ["request.status == IN_PROGRESS", "objection_basis present (ERR_INVALID_REQUEST otherwise)"]
        side_effects: ["objection_basis stored", "InformationRequest.version += 1"]

  - entity: ExpirationTask
    initial_state: PENDING
    terminal_states: [DONE, MISSED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /labor-relations/expiration-tasks/{id}/state (to_status=IN_PROGRESS)"
        actor: LRManager | Negotiator
        preconditions: ["task.status == PENDING"]
        side_effects: ["ExpirationTask.version += 1"]
      - from: PENDING
        to: DONE
        trigger: "POST /labor-relations/expiration-tasks/{id}/state (to_status=DONE)"
        actor: LRManager | Negotiator
        preconditions: ["task.status IN {PENDING, IN_PROGRESS, MISSED}"]
        side_effects: ["completed_late = (clock > due_date) OR (prior status == MISSED)", "ExpirationTask.version += 1"]
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /labor-relations/expiration-tasks/{id}/state (to_status=DONE)"
        actor: LRManager | Negotiator
        preconditions: ["task.status IN {PENDING, IN_PROGRESS, MISSED}"]
        side_effects: ["same as PENDING -> DONE"]
      - from: MISSED
        to: DONE
        trigger: "POST /labor-relations/expiration-tasks/{id}/state (to_status=DONE)"
        actor: LRManager | Negotiator
        preconditions: ["task.status IN {PENDING, IN_PROGRESS, MISSED}"]
        side_effects: ["completed_late forced true", "ExpirationTask.version += 1"]
      - from: PENDING
        to: MISSED
        trigger: "system clock sweep: clock > due_date; also fired synchronously by the extend recompute cascade"
        actor: system
        preconditions: ["clock > due_date (strictly)"]
        side_effects: ["ExpirationTask.version += 1"]
      - from: IN_PROGRESS
        to: MISSED
        trigger: "system clock sweep: clock > due_date"
        actor: system
        preconditions: ["clock > due_date (strictly)"]
        side_effects: ["ExpirationTask.version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: scenario-lock-stale-agreement
    parent_entity: CollectiveAgreement
    write_endpoint: "POST /labor-relations/costing-scenarios/{id}/lock"
    occ_field: expected_agreement_version
    description: |
      Locking a CostingScenario against a CollectiveAgreement whose version has
      advanced since the client last observed it is rejected. Locking legitimately
      supersedes the previously LOCKED scenario and bumps the agreement version,
      so a second lock issued against the pre-lock version is stale and is
      rejected deterministically.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: agreement-extend-stale-version
    parent_entity: CollectiveAgreement
    write_endpoint: "POST /labor-relations/agreements/{id}/extend"
    occ_field: expected_agreement_version
    description: |
      Extending a CollectiveAgreement whose version has advanced since the client
      last observed it is rejected. Re-extension is a legitimate product operation
      (EXTENDED -> EXTENDED), so a second extend carrying the pre-extend version
      is stale and is rejected deterministically.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: scenario_total_cost
    trigger: "CostingScenario transitions to COMPUTED (POST .../costing-scenarios/{id}/state, to_status=COMPUTED)"
    algorithm: forward_looking
    formula: |
      basis = (scenario_mode == PROVISIONAL) ? agreement.fte_projected : agreement.headcount_baseline
      base_payroll_cents = basis * agreement.avg_loaded_wage_cents * HOURS_PER_YEAR
      for each proposal p in proposal_ids (ECONOMIC, status IN {ON_TABLE, ACCEPTED}):
        wage_y1 = base_payroll_cents * p.wage_increase_pct (0 when null)
        wage_y1 = min(wage_y1, base_payroll_cents * WAGE_DRIFT_CAP_PCT)          # cap before loading
        if p.includes_benefits: wage_y1 = wage_y1 * BENEFITS_LOAD
        r = (p.affected_headcount or 0) / basis                                  # coverage ratio
        mult = (r >= 0.80) ? 1.10 : (r >= 0.50) ? 1.05 : 1.00                    # tiered multiplier
        wage_y1 = round_half_up(wage_y1 * mult)                                  # per-line rounding, pinned
        one_time_share = (PROVISIONAL) ? round_half_up(p.one_time_cost_cents / term_years)
                                       : (year 1 ? p.one_time_cost_cents : 0)    # FINAL charges year 1 in full
        year_line(1) = wage_y1 + p.recurring_annual_cost_cents + one_time_share
        for k in 2..term_years:
          wage_k = round_half_up(wage_y1 * (1 + p.wage_increase_pct or 0)^(k-1)) # from year-1 base, not recursive
          one_time_k = (PROVISIONAL) ? one_time_share : 0
          year_line(k) = wage_k + p.recurring_annual_cost_cents + one_time_k
        p.estimated_year1_cost_cents = year_line(1)                              # persisted on the proposal
      year_breakdown_cents[k] = sum over proposals of year_line(k)               # already integer cents
      subtotal_cents = sum(year_breakdown_cents)
      reserve_cents = round_half_up(CONTINGENCY_PCT * subtotal_cents)            # evaluation order pinned: reserve AFTER subtotal
      total_cost_cents = subtotal_cents + reserve_cents                          # reserve is NOT part of its own base (circularity pinned)
    input_set: "proposals listed in scenario.proposal_ids with proposal_type == ECONOMIC and status IN {ON_TABLE, ACCEPTED}; all listed ids must qualify (compute rejects otherwise)"
    constants:
      HOURS_PER_YEAR: 2080
      WAGE_DRIFT_CAP_PCT: 0.15
      BENEFITS_LOAD: 1.32
      TIER_HIGH_THRESHOLD: 0.80
      TIER_HIGH_MULT: 1.10
      TIER_MID_THRESHOLD: 0.50
      TIER_MID_MULT: 1.05
      CONTINGENCY_PCT: 0.05
    precision: "integer cents; round_half_up at each per-proposal-per-year line; reserve rounded once after subtotal"
    variants:
      - name: PROVISIONAL
        when: "scenario_mode == PROVISIONAL — forward-looking planning basis"
        difference: "basis = fte_projected; one-time costs amortized evenly across term_years"
      - name: FINAL
        when: "scenario_mode == FINAL — payroll-actual basis"
        difference: "basis = headcount_baseline; one-time costs charged entirely to year 1"

  - name: ratification_retro_payout
    trigger: "RatificationVote tally decides RATIFIED"
    algorithm: chronological
    formula: |
      retro_periods = floor( (tally_date - agreement.effective_date).days / RETRO_PERIOD_DAYS )   # 0 when negative
      for each proposal p of the agreement that becomes IMPLEMENTED with proposal_type == ECONOMIC:
        monthly_cents(p) = round_half_up(p.recurring_annual_cost_cents / 12)     # PINNED: round the monthly line FIRST
        payout(p) = monthly_cents(p) * retro_periods                             # THEN multiply/sum (NOT round(sum*p/12))
      vote.retro_payout_cents = sum over p of payout(p)
    input_set: "proposals of the ratified agreement with status transitioning ACCEPTED -> IMPLEMENTED and proposal_type == ECONOMIC"
    constants:
      RETRO_PERIOD_DAYS: 30
      MONTHS_PER_YEAR: 12
    precision: "integer cents; round_half_up on the monthly line before multiplication"
    variants: []

  - name: past_practice_strength
    trigger: "PastPractice transitions to DOCUMENTED (initial documentation and re-documentation after DISPUTED)"
    algorithm: weighted_scoring
    formula: |
      recency_years = (current_clock_date - last_observed_date).days / 365.0
      frequency = min(occurrence_count / 10, 1.0)
      LEGALISTIC:  recency_component = LEGALISTIC_DECAY ^ floor(recency_years)
                   strength_legalistic = round_half_up_4dp(0.6 * recency_component + 0.4 * frequency)
      OPERATIONAL: recency_component = (recency_years < 5) ? 1.0 : 0.5           # step decay, no exponent
                   strength_operational = round_half_up_4dp(0.4 * recency_component + 0.6 * frequency)
    input_set: "the single PastPractice being documented; uses current clock for recency"
    constants:
      LEGALISTIC_DECAY: 0.85
      LEGALISTIC_RECENCY_WEIGHT: 0.6
      OPERATIONAL_RECENCY_WEIGHT: 0.4
      OPERATIONAL_STEP_YEARS: 5
      OPERATIONAL_STEP_VALUE: 0.5
      VERIFY_MIN_OCCURRENCES: 3
      VERIFY_MIN_LEGALISTIC: 0.5000
    precision: "4 decimal places, round_half_up"
    variants:
      - name: LEGALISTIC
        when: "verification gate (VERIFIED requires strength_legalistic >= 0.5000) and arbitration-style review"
        difference: "exponential recency decay 0.85^years, recency-weighted 0.6"
      - name: OPERATIONAL
        when: "operational leverage assessments reported on reads"
        difference: "step decay (full within 5 years, half beyond), frequency-weighted 0.6"

  - name: information_request_deadline
    trigger: "InformationRequest creation; recomputed by POST .../information-requests/{id}/extend"
    algorithm: threshold
    formula: |
      mode = agreement.deadline_mode when agreement_id present else BUSINESS
      base due: BUSINESS -> starting the day AFTER received_at, advance RESPONSE_BUSINESS_DAYS days
                counting only Mon-Fri; due_at = that date at 17:00:00Z
                CALENDAR -> received date + RESPONSE_BUSINESS_DAYS calendar days; due_at = that date at 17:00:00Z
      extend: BUSINESS -> due_at advanced extra_business_days business days (same skip rule, time stays 17:00:00Z)
              CALENDAR -> due_at advanced extra_business_days calendar days
      guards: extension_count < EXTENSION_MAX_COUNT and 1 <= extra_business_days <= EXTENSION_MAX_DAYS
              (ERR_EXTENSION_LIMIT_EXCEEDED otherwise)
      overdue: is_overdue = (clock > due_at) AND status IN {RECEIVED, ACKNOWLEDGED, IN_PROGRESS, OBJECTED}
               — strictly greater-than: at clock == due_at the request is NOT overdue
    input_set: "the single InformationRequest; weekend set = Saturday/Sunday (UTC)"
    constants:
      RESPONSE_BUSINESS_DAYS: 10
      DUE_TIME_UTC: "17:00:00Z"
      EXTENSION_MAX_COUNT: 2
      EXTENSION_MAX_DAYS: 5
    precision: "whole seconds"
    variants:
      - name: BUSINESS
        when: "agreement.deadline_mode == BUSINESS or no agreement linked"
        difference: "skips Saturdays and Sundays"
      - name: CALENDAR
        when: "agreement.deadline_mode == CALENDAR"
        difference: "counts every calendar day"

  - name: ratification_outcome
    trigger: "RatificationVote tally submission"
    algorithm: threshold
    formula: |
      votes_cast = votes_for + votes_against
      quorum_met = votes_cast >= ceil(eligible_voter_count / 2)                  # >= : exactly half is enough
      approved = (votes_for * 2) > votes_cast                                    # > : an exact tie FAILS
      outcome = (quorum_met AND approved) ? RATIFIED : REJECTED
    input_set: "the single vote being tallied"
    constants:
      QUORUM_FRACTION: 0.5
    precision: "integer ballot arithmetic"
    variants: []

  - name: agreement_posture
    trigger: "clock sweep; agreement activate / extend; read paths recompute lazily but stored value is refreshed by sweep"
    algorithm: threshold
    formula: |
      if status == DRAFT: posture = NEGOTIATING
      elif status IN {REPLACED, ARCHIVED}: posture = CLOSED
      elif status == EXPIRED: posture = UNCOVERED
      else (ACTIVE | EXTENDED):
        days_left = (expiration_date - clock).days                               # calendar days, floor toward past midnight UTC
        posture = (days_left > SUNSET_DAYS) ? OPEN : (days_left > CRITICAL_DAYS) ? SUNSET : CRITICAL
      bargainable predicate (used by proposal tender + session create):
        status IN {DRAFT, EXPIRED, EXTENDED} OR posture IN {SUNSET, CRITICAL}
    input_set: "the single agreement; days_left uses whole calendar days"
    constants:
      SUNSET_DAYS: 180
      CRITICAL_DAYS: 30
    precision: "whole days"
    variants: []

  - name: expiration_task_due_date
    trigger: "ExpirationTask creation; recomputed for non-terminal tasks on every agreement extend"
    algorithm: constraint_propagation
    formula: |
      due_date = agreement.expiration_date + due_offset_days (calendar days; offset may be negative, zero, or positive)
      on extend: every task with status IN {PENDING, IN_PROGRESS} recomputes due_date from the NEW expiration_date;
                 a task whose recomputed due_date < current clock becomes MISSED in the same request
    input_set: "tasks of the agreement with status IN {PENDING, IN_PROGRESS}"
    constants: {}
    precision: "whole seconds (date arithmetic at 00:00:00Z of the expiration_date's time-of-day)"
    variants: []

  - name: envelope_commitment
    trigger: "proposal ACCEPTED (add), ACCEPTED->ON_TABLE revert (remove), IMPLEMENTED (stays), IMPLEMENTED->VOID (remove)"
    algorithm: aggregation
    formula: |
      agreement.envelope_committed_cents =
        sum of estimated_year1_cost_cents over proposals of the agreement with status IN {ACCEPTED, IMPLEMENTED}
      accept gate: envelope_committed_cents + candidate.estimated_year1_cost_cents <= costing_envelope_cents
                   (equality allowed; ERR_ENVELOPE_EXCEEDED when strictly greater)
      CONSERVED QUANTITY: after any matched accept+revert or implement+void pair, envelope_committed_cents
      returns exactly to its prior value.
    input_set: "proposals of the agreement with status IN {ACCEPTED, IMPLEMENTED} and estimated_year1_cost_cents non-null"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-blank; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "ownership/side rules: UnionRepresentative X-User-ID equals the target resource's union_id; side-gated proposal actions executed by the correct bargaining side; clause interpretation action permitted for the acting role (LRManager: OPEN_REVIEW/CLOSE_REVIEW/DISPUTE; LegalCounsel: RECORD/RESOLVE; UnionRepresentative: DISPUTE)"
    error_id: ERR_UNION_MISMATCH
    http_status: 403
    applies_to: "POST /labor-relations/information-requests, POST /labor-relations/ratification-votes/{id}/tally, side-gated proposal transitions, POST /labor-relations/clauses/{id}/interpretation (ERR_UNAUTHORIZED_ROLE for disallowed action-per-role pairs)"
  - priority: 4
    category: existence
    check: "request shape: required fields present, enum members valid, numeric ranges respected (wage_increase_pct in [0, 0.25]; term_years in [1, 5]; eligible_voter_count >= 1; occurrence_count >= 1; extra_business_days >= 1); pagination limit in [1, 100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all (ERR_PAGINATION_INVALID for list endpoints' limit/offset violations)"
  - priority: 5
    category: existence
    check: "path and body referenced ids resolve, validated left-to-right (union, agreement, clause, session, proposal, scenario, vote, letter, practice, request, task)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body id references"
  - priority: 6
    category: state
    check: "target entity in a valid from-state for the requested transition; cross-entity state gates: agreement bargainable for tender/session create (ERR_AGREEMENT_NOT_BARGAINABLE); session open window (ERR_SESSION_NOT_STARTED); tally window (ERR_BALLOT_STILL_OPEN); agreement not ARCHIVED/REPLACED for child creation (ERR_INVALID_STATE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"
  - priority: 7
    category: state
    check: "optimistic concurrency: expected_agreement_version equals agreement.version on OCC-guarded writes"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /labor-relations/costing-scenarios/{id}/lock, POST /labor-relations/agreements/{id}/extend"
  - priority: 8
    category: business_safety
    check: "union standing: TRUSTEED blocks proposal tender and session create (ERR_UNION_TRUSTEED); DECERTIFIED blocks proposal/session/info-request creation and tender (ERR_UNION_DECERTIFIED); segregation of duties: scenario reviewer != computed_by, scenario locker != computed_by, side-letter executor != drafted_by (ERR_SOD_VIOLATION)"
    error_id: ERR_UNION_TRUSTEED
    http_status: 409
    applies_to: "proposal create/tender, session create, information-request create, scenario review/lock, side-letter execute (ERR_SOD_VIOLATION 403; ERR_UNION_DECERTIFIED 409)"
  - priority: 9
    category: business_temporal
    check: "scalar temporal validity: session start_at < end_at and duration <= 12h (ERR_INVALID_TIME_RANGE); side letter effective_start <= effective_end (ERR_INVALID_EFFECTIVE_RANGE); extend new_expiration_date > current expiration_date (ERR_EXTENSION_NOT_FORWARD); past practice last_observed_date >= first_observed_date (ERR_INVALID_REQUEST); agreement expiration_date > effective_date (ERR_INVALID_REQUEST)"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "session create, side-letter create, agreement create/extend, past-practice create"
  - priority: 10
    category: business_temporal
    check: "interval conflicts: mediator half-open overlap [start_at, end_at) against sessions with status IN {SCHEDULED, IN_SESSION} sharing mediator_id (ERR_MEDIATOR_CONFLICT; adjacency allowed); lead-negotiator 45-minute buffer: conflict when same lead_negotiator_id and intervals expanded by 45 minutes on both ends intersect (ERR_NEGOTIATOR_BUFFER_CONFLICT); side-letter closed-interval overlap on same clause_id among EXECUTED letters (ERR_SIDE_LETTER_OVERLAP; touching boundaries conflict)"
    error_id: ERR_MEDIATOR_CONFLICT
    http_status: 409
    applies_to: "session create, side-letter execute"
  - priority: 11
    category: business_constraint
    check: "uniqueness and caps: clause article_ref unique within agreement (ERR_DUPLICATE_ARTICLE_REF); proposal round_number < 12 before counter (ERR_MAX_ROUNDS_EXCEEDED); information-request extension_count < 2 and extra_business_days <= 5 (ERR_EXTENSION_LIMIT_EXCEEDED); union_code unique (ERR_INVALID_REQUEST)"
    error_id: ERR_DUPLICATE_ARTICLE_REF
    http_status: 409
    applies_to: "clause create, proposal counter, information-request extend, union create"
  - priority: 12
    category: business_referential
    check: "referenced supporting entities in required states: clause RESOLVE cites an EXECUTED side letter or VERIFIED past practice (ERR_RESOLUTION_REFERENCE_INVALID); economic proposal acceptance requires a LOCKED scenario covering it (ERR_COSTING_NOT_LOCKED); vote open requires a LOCKED scenario (ERR_NO_LOCKED_SCENARIO) then an ACCEPTED package (ERR_NO_ACCEPTED_PACKAGE); scenario compute requires every listed proposal ECONOMIC and ON_TABLE/ACCEPTED (ERR_INVALID_REQUEST); past-practice verify requires occurrence_count >= 3 and strength_legalistic >= 0.5000 (ERR_PRACTICE_NOT_VERIFIABLE)"
    error_id: ERR_COSTING_NOT_LOCKED
    http_status: 409
    applies_to: "clause interpretation RESOLVE, proposal accept, vote open, scenario compute, past-practice verify"
  - priority: 13
    category: business_fiscal
    check: "economic envelope: on accept, envelope_committed_cents + estimated_year1_cost_cents <= costing_envelope_cents (equality allowed)"
    error_id: ERR_ENVELOPE_EXCEEDED
    http_status: 422
    applies_to: "POST /labor-relations/proposals/{id}/state (to_status=ACCEPTED)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Union ---
  - method: POST
    path: "/labor-relations/unions"
    description: "Create a union"
    roles: [LRAdmin]
    code: 201
    input: [name, union_code]
    output: Union
    side_effects: ["status=ACTIVE, open_information_request_count=0"]
  - method: GET
    path: "/labor-relations/unions"
    description: "List unions"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Union[]
    side_effects: []
  - method: GET
    path: "/labor-relations/unions/{id}"
    description: "Get a union"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: Union
    side_effects: []
  - method: POST
    path: "/labor-relations/unions/{id}/state"
    description: "Transition union status (TRUSTEED / ACTIVE / DECERTIFIED) with decertify cascade"
    roles: [LRAdmin]
    code: 200
    input: [to_status]
    output: Union
    side_effects: ["Union state machine transitions; DECERTIFIED cascades to agreements and sessions"]

  # --- CollectiveAgreement ---
  - method: POST
    path: "/labor-relations/agreements"
    description: "Create a collective agreement (DRAFT)"
    roles: [LRAdmin]
    code: 201
    input: [union_id, title, effective_date, expiration_date, headcount_baseline, fte_projected, avg_loaded_wage_cents, costing_envelope_cents, "deadline_mode?"]
    output: CollectiveAgreement
    side_effects: ["status=DRAFT, posture=NEGOTIATING, envelope_committed_cents=0, extension_count=0"]
  - method: GET
    path: "/labor-relations/agreements"
    description: "List agreements with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["union_id?", "status?", "posture?", "limit?", "offset?"]
    output: CollectiveAgreement[]
    side_effects: []
  - method: GET
    path: "/labor-relations/agreements/{id}"
    description: "Get an agreement"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: CollectiveAgreement
    side_effects: []
  - method: POST
    path: "/labor-relations/agreements/{id}/activate"
    description: "Activate a DRAFT agreement; supersedes the union's incumbent ACTIVE/EXTENDED agreement to REPLACED"
    roles: [LRAdmin]
    code: 200
    input: []
    output: CollectiveAgreement
    side_effects: ["DRAFT -> ACTIVE; incumbent supersession; posture recompute; increments CollectiveAgreement.version by 1"]
  - method: POST
    path: "/labor-relations/agreements/{id}/extend"
    description: "Extend expiration (ACTIVE/EXPIRED/EXTENDED -> EXTENDED); OCC-guarded; recomputes expiration-task due dates"
    roles: [ChiefNegotiator]
    code: 200
    input: [new_expiration_date, expected_agreement_version]
    output: CollectiveAgreement
    side_effects: ["status -> EXTENDED; extension_count += 1; ExpirationTask due_date recompute cascade (may flip tasks to MISSED); posture recompute; increments CollectiveAgreement.version by 1"]
  - method: POST
    path: "/labor-relations/agreements/{id}/archive"
    description: "Archive an EXPIRED or REPLACED agreement"
    roles: [LRAdmin]
    code: 200
    input: []
    output: CollectiveAgreement
    side_effects: ["status -> ARCHIVED; posture -> CLOSED; increments CollectiveAgreement.version by 1"]

  # --- Clause ---
  - method: POST
    path: "/labor-relations/clauses"
    description: "Create a clause in the contract-term repository"
    roles: [LRManager]
    code: 201
    input: [agreement_id, article_ref, title, body_text, "is_economic?"]
    output: Clause
    side_effects: ["interpretation_status=UNINTERPRETED"]
  - method: GET
    path: "/labor-relations/clauses"
    description: "List clauses with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["agreement_id?", "interpretation_status?", "limit?", "offset?"]
    output: Clause[]
    side_effects: []
  - method: GET
    path: "/labor-relations/clauses/{id}"
    description: "Get a clause"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: Clause
    side_effects: []
  - method: POST
    path: "/labor-relations/clauses/{id}/interpretation"
    description: "Drive the clause interpretation workflow (OPEN_REVIEW, CLOSE_REVIEW, RECORD, DISPUTE, RESOLVE) with per-action role gating"
    roles: [LRManager, LegalCounsel, UnionRepresentative]
    code: 200
    input: [action, "interpretation_text?", "side_letter_id?", "past_practice_id?"]
    output: Clause
    side_effects: ["Clause state machine transitions per action"]

  # --- BargainingSession ---
  - method: POST
    path: "/labor-relations/sessions"
    description: "Schedule a bargaining session; mediator half-open overlap and lead-negotiator 45-minute buffer enforced"
    roles: [Negotiator]
    code: 201
    input: [agreement_id, mediator_id, lead_negotiator_id, location, start_at, end_at]
    output: BargainingSession
    side_effects: ["status=SCHEDULED; mediator scheduled-minutes aggregate increases by (end_at - start_at)"]
  - method: GET
    path: "/labor-relations/sessions"
    description: "List sessions with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["agreement_id?", "mediator_id?", "status?", "limit?", "offset?"]
    output: BargainingSession[]
    side_effects: []
  - method: GET
    path: "/labor-relations/sessions/{id}"
    description: "Get a session"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: BargainingSession
    side_effects: []
  - method: POST
    path: "/labor-relations/sessions/{id}/state"
    description: "Transition session (IN_SESSION by ChiefNegotiator once clock >= start_at; COMPLETED with summary_note; CANCELLED with cancel_reason)"
    roles: [Negotiator, ChiefNegotiator]
    code: 200
    input: [to_status, "summary_note?", "cancel_reason?"]
    output: BargainingSession
    side_effects: ["BargainingSession state machine transitions; cancel releases mediator scheduled-minutes"]

  # --- Proposal ---
  - method: POST
    path: "/labor-relations/proposals"
    description: "Draft a proposal (Negotiator drafts EMPLOYER; UnionRepresentative drafts UNION for own union's agreements)"
    roles: [Negotiator, UnionRepresentative]
    code: 201
    input: [agreement_id, side, title, proposal_type, "clause_id?", "wage_increase_pct?", "affected_headcount?", "includes_benefits?", "one_time_cost_cents?", "recurring_annual_cost_cents?"]
    output: Proposal
    side_effects: ["status=DRAFT, round_number=1, submitted_by_user_id recorded"]
  - method: GET
    path: "/labor-relations/proposals"
    description: "List proposals with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["agreement_id?", "clause_id?", "supersedes_proposal_id?", "side?", "status?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []
  - method: GET
    path: "/labor-relations/proposals/{id}"
    description: "Get a proposal"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: POST
    path: "/labor-relations/proposals/{id}/state"
    description: "Transition proposal (TENDERED / ON_TABLE / ACCEPTED / REJECTED / WITHDRAWN) with side gating and envelope checks"
    roles: [Negotiator, ChiefNegotiator, UnionRepresentative]
    code: 200
    input: [to_status, "session_id?", "reason?"]
    output: Proposal
    side_effects: ["Proposal state machine transitions; accept recomputes agreement envelope commitment and bumps agreement version"]
  - method: POST
    path: "/labor-relations/proposals/{id}/counter"
    description: "Counter an ON_TABLE proposal: original becomes COUNTERED; a new ON_TABLE proposal of the receiving side is created at round_number + 1"
    roles: [ChiefNegotiator, UnionRepresentative]
    code: 201
    input: [title, "wage_increase_pct?", "affected_headcount?", "includes_benefits?", "one_time_cost_cents?", "recurring_annual_cost_cents?"]
    output: Proposal
    side_effects: ["original -> COUNTERED; new proposal created with supersedes_proposal_id, flipped side, status ON_TABLE"]
  - method: POST
    path: "/labor-relations/proposals/{id}/void-implementation"
    description: "Void an IMPLEMENTED proposal; credits the agreement envelope back (compensation)"
    roles: [LRAdmin]
    code: 200
    input: []
    output: Proposal
    side_effects: ["IMPLEMENTED -> VOID; envelope_committed_cents recomputed; increments CollectiveAgreement.version by 1"]

  # --- CostingScenario ---
  - method: POST
    path: "/labor-relations/costing-scenarios"
    description: "Create a costing scenario (DRAFT)"
    roles: [Negotiator]
    code: 201
    input: [agreement_id, name, scenario_mode, term_years, proposal_ids]
    output: CostingScenario
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/labor-relations/costing-scenarios"
    description: "List costing scenarios with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["agreement_id?", "status?", "scenario_mode?", "limit?", "offset?"]
    output: CostingScenario[]
    side_effects: []
  - method: GET
    path: "/labor-relations/costing-scenarios/{id}"
    description: "Get a costing scenario"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: CostingScenario
    side_effects: []
  - method: POST
    path: "/labor-relations/costing-scenarios/{id}/state"
    description: "Transition scenario (COMPUTED runs the variant calculation; REVIEWED enforces SoD vs computed_by; DRAFT is the rework loop)"
    roles: [Negotiator]
    code: 200
    input: [to_status]
    output: CostingScenario
    side_effects: ["compute executes calc scenario_total_cost and overwrites included proposals' estimated_year1_cost_cents"]
  - method: POST
    path: "/labor-relations/costing-scenarios/{id}/lock"
    description: "Lock a REVIEWED scenario; supersedes the previously LOCKED scenario of the same agreement; OCC on the agreement"
    roles: [ChiefNegotiator]
    code: 200
    input: [expected_agreement_version]
    output: CostingScenario
    side_effects: ["REVIEWED -> LOCKED; prior LOCKED -> SUPERSEDED; SoD vs computed_by; increments CollectiveAgreement.version by 1"]

  # --- RatificationVote ---
  - method: POST
    path: "/labor-relations/ratification-votes"
    description: "Create a ratification vote for a DRAFT successor agreement"
    roles: [ChiefNegotiator]
    code: 201
    input: [agreement_id, eligible_voter_count, ballot_close_at]
    output: RatificationVote
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/labor-relations/ratification-votes"
    description: "List ratification votes with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: RatificationVote[]
    side_effects: []
  - method: GET
    path: "/labor-relations/ratification-votes/{id}"
    description: "Get a ratification vote"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: RatificationVote
    side_effects: []
  - method: POST
    path: "/labor-relations/ratification-votes/{id}/state"
    description: "Open a SCHEDULED vote (requires LOCKED scenario then ACCEPTED package; ballot_close_at in the future)"
    roles: [ChiefNegotiator]
    code: 200
    input: [to_status]
    output: RatificationVote
    side_effects: ["SCHEDULED -> OPEN; opened_by_user_id recorded"]
  - method: POST
    path: "/labor-relations/ratification-votes/{id}/tally"
    description: "Submit union ballot tally after ballot_close_at; system decides RATIFIED or REJECTED and fires the corresponding cascade"
    roles: [UnionRepresentative]
    code: 200
    input: [votes_for, votes_against]
    output: RatificationVote
    side_effects: ["calc ratification_outcome + ratification_retro_payout; RATIFIED fires the depth-5 activation cascade; REJECTED fires the compensation revert"]

  # --- SideLetter ---
  - method: POST
    path: "/labor-relations/side-letters"
    description: "Draft a side letter / MOA / MOU against a clause"
    roles: [LRManager]
    code: 201
    input: [agreement_id, clause_id, letter_type, title, effective_start, effective_end]
    output: SideLetter
    side_effects: ["status=DRAFT; drafted_by_user_id recorded"]
  - method: GET
    path: "/labor-relations/side-letters"
    description: "List side letters with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["agreement_id?", "clause_id?", "status?", "limit?", "offset?"]
    output: SideLetter[]
    side_effects: []
  - method: GET
    path: "/labor-relations/side-letters/{id}"
    description: "Get a side letter"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: SideLetter
    side_effects: []
  - method: POST
    path: "/labor-relations/side-letters/{id}/state"
    description: "Transition side letter (PENDING_LEGAL by LRManager; EXECUTED or DRAFT-return by LegalCounsel with SoD and closed-interval overlap check)"
    roles: [LRManager, LegalCounsel]
    code: 200
    input: [to_status]
    output: SideLetter
    side_effects: ["SideLetter state machine transitions"]

  # --- PastPractice ---
  - method: POST
    path: "/labor-relations/past-practices"
    description: "Assert a past practice (UnionRepresentative asserts for own union; LRManager asserts for any)"
    roles: [LRManager, UnionRepresentative]
    code: 201
    input: [union_id, "clause_id?", title, description, first_observed_date, last_observed_date, occurrence_count]
    output: PastPractice
    side_effects: ["status=ASSERTED"]
  - method: GET
    path: "/labor-relations/past-practices"
    description: "List past practices with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["union_id?", "clause_id?", "status?", "limit?", "offset?"]
    output: PastPractice[]
    side_effects: []
  - method: GET
    path: "/labor-relations/past-practices/{id}"
    description: "Get a past practice"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: PastPractice
    side_effects: []
  - method: POST
    path: "/labor-relations/past-practices/{id}/state"
    description: "Transition past practice (DOCUMENTED recomputes both strength variants; VERIFIED gated on thresholds; NOTICE_GIVEN schedules abandonment; rescind cycle back to VERIFIED)"
    roles: [LRManager, LegalCounsel, UnionRepresentative]
    code: 200
    input: [to_status]
    output: PastPractice
    side_effects: ["PastPractice state machine transitions; DOCUMENTED runs calc past_practice_strength"]

  # --- InformationRequest ---
  - method: POST
    path: "/labor-relations/information-requests"
    description: "File a union information request; due_at computed per deadline_mode of the linked agreement (BUSINESS default)"
    roles: [UnionRepresentative]
    code: 201
    input: [union_id, "agreement_id?", subject, received_at]
    output: InformationRequest
    side_effects: ["status=RECEIVED; due_at computed; union.open_information_request_count += 1; increments Union.version by 1"]
  - method: GET
    path: "/labor-relations/information-requests"
    description: "List information requests with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["union_id?", "agreement_id?", "status?", "is_overdue?", "limit?", "offset?"]
    output: InformationRequest[]
    side_effects: []
  - method: GET
    path: "/labor-relations/information-requests/{id}"
    description: "Get an information request"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: InformationRequest
    side_effects: []
  - method: POST
    path: "/labor-relations/information-requests/{id}/state"
    description: "Transition information request (ACKNOWLEDGED / IN_PROGRESS / FULFILLED / PARTIALLY_FULFILLED by LRManager; OBJECTED and objection-withdrawn IN_PROGRESS by LegalCounsel)"
    roles: [LRManager, LegalCounsel]
    code: 200
    input: [to_status, "response_note?", "objection_basis?"]
    output: InformationRequest
    side_effects: ["terminal fulfillment decrements union.open_information_request_count and bumps Union.version"]
  - method: POST
    path: "/labor-relations/information-requests/{id}/extend"
    description: "Extend the response deadline (max 2 extensions, each at most 5 days in the agreement's deadline_mode)"
    roles: [LRManager]
    code: 200
    input: [extra_business_days]
    output: InformationRequest
    side_effects: ["due_at recomputed per calc information_request_deadline; extension_count += 1"]

  # --- ExpirationTask ---
  - method: POST
    path: "/labor-relations/expiration-tasks"
    description: "Create an expiration-planning task (agreement must be ACTIVE, EXPIRED, or EXTENDED)"
    roles: [LRManager, Negotiator]
    code: 201
    input: [agreement_id, title, task_type, due_offset_days, assignee_user_id]
    output: ExpirationTask
    side_effects: ["status=PENDING; due_date computed from expiration_date + due_offset_days"]
  - method: GET
    path: "/labor-relations/expiration-tasks"
    description: "List expiration tasks with FK filters"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: ["agreement_id?", "status?", "task_type?", "limit?", "offset?"]
    output: ExpirationTask[]
    side_effects: []
  - method: GET
    path: "/labor-relations/expiration-tasks/{id}"
    description: "Get an expiration task"
    roles: [LRAdmin, LRManager, Negotiator, ChiefNegotiator, LegalCounsel, UnionRepresentative]
    code: 200
    input: []
    output: ExpirationTask
    side_effects: []
  - method: POST
    path: "/labor-relations/expiration-tasks/{id}/state"
    description: "Transition expiration task (IN_PROGRESS; DONE from PENDING/IN_PROGRESS/MISSED with completed_late flag)"
    roles: [LRManager, Negotiator]
    code: 200
    input: [to_status]
    output: ExpirationTask
    side_effects: ["ExpirationTask state machine transitions"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock runs the epoch sweep in pinned order: (1) agreements ACTIVE/EXTENDED past expiration -> EXPIRED with posture recompute; (2) SCHEDULED sessions past end_at -> NO_SHOW; (3) EXECUTED side letters past effective_end -> EXPIRED; (4) NOTICE_GIVEN past practices at abandon_effective_date -> ABANDONED (with clause ripple); (5) information requests past due_at -> is_overdue=true; (6) PENDING/IN_PROGRESS expiration tasks past due_date -> MISSED; (7) posture refresh for remaining ACTIVE/EXTENDED agreements."
    roles: [LRAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, transitioned: object }"
    side_effects: ["epoch sweep per pinned order above; each mutated entity's version increments"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing, blank, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint, or clause-interpretation action not permitted for the acting role" }
  - { id: ERR_UNION_MISMATCH, http: 403, condition: "UnionRepresentative X-User-ID does not equal the target resource's union_id" }
  - { id: ERR_WRONG_SIDE, http: 403, condition: "Proposal side-gating violated: tender/withdraw by non-proposing side, table/accept/reject/counter by non-receiving side" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, or numeric range violation (wage_increase_pct, term_years, eligible_voter_count, occurrence_count, dates ordering)" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit outside [1, 100] or offset < 0 on a list endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced id does not resolve (validated left-to-right)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition; also child creation on REPLACED/ARCHIVED agreement, vote open with ballot_close_at in the past, rescind after abandon_effective_date" }
  - { id: ERR_AGREEMENT_NOT_BARGAINABLE, http: 409, condition: "Proposal tender or session create while the agreement fails the bargainable predicate (status/posture gate)" }
  - { id: ERR_SESSION_NOT_STARTED, http: 409, condition: "Opening a session before its start_at per the logical clock" }
  - { id: ERR_BALLOT_STILL_OPEN, http: 409, condition: "Tally submitted before ballot_close_at per the logical clock" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not equal the agreement's current version on an OCC-guarded write (lock, extend)" }
  - { id: ERR_UNION_TRUSTEED, http: 409, condition: "Union in TRUSTEED status: proposal tender and session scheduling blocked" }
  - { id: ERR_UNION_DECERTIFIED, http: 409, condition: "Union DECERTIFIED: proposal/session/information-request creation and tender blocked" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: scenario reviewer or locker equals computed_by_user_id; side-letter executor equals drafted_by_user_id" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "Session start_at >= end_at or duration exceeds 12 hours" }
  - { id: ERR_MEDIATOR_CONFLICT, http: 409, condition: "Mediator half-open interval overlap with a SCHEDULED or IN_SESSION session sharing mediator_id (adjacency allowed)" }
  - { id: ERR_NEGOTIATOR_BUFFER_CONFLICT, http: 409, condition: "Lead negotiator has another SCHEDULED/IN_SESSION session within the 45-minute buffer window" }
  - { id: ERR_INVALID_EFFECTIVE_RANGE, http: 422, condition: "Side letter effective_start > effective_end" }
  - { id: ERR_SIDE_LETTER_OVERLAP, http: 409, condition: "Closed-interval effective-window overlap with another EXECUTED side letter on the same clause (touching boundaries conflict)" }
  - { id: ERR_DUPLICATE_ARTICLE_REF, http: 409, condition: "Clause article_ref already exists within the agreement" }
  - { id: ERR_MAX_ROUNDS_EXCEEDED, http: 409, condition: "Counter attempted on a proposal already at round_number 12" }
  - { id: ERR_EXTENSION_LIMIT_EXCEEDED, http: 409, condition: "Information-request extension beyond 2 grants or beyond 5 days in one grant" }
  - { id: ERR_EXTENSION_NOT_FORWARD, http: 422, condition: "new_expiration_date is not strictly later than the current expiration_date" }
  - { id: ERR_COSTING_NOT_LOCKED, http: 409, condition: "Accepting an ECONOMIC proposal without a LOCKED costing scenario covering it" }
  - { id: ERR_ENVELOPE_EXCEEDED, http: 422, condition: "Accept would push envelope_committed_cents strictly above costing_envelope_cents" }
  - { id: ERR_NO_LOCKED_SCENARIO, http: 409, condition: "Vote open attempted with no LOCKED costing scenario for the agreement" }
  - { id: ERR_NO_ACCEPTED_PACKAGE, http: 409, condition: "Vote open attempted with no ACCEPTED proposal for the agreement (checked after the locked-scenario gate)" }
  - { id: ERR_RESOLUTION_REFERENCE_INVALID, http: 422, condition: "Clause RESOLVE cites a side letter that is not EXECUTED or a past practice that is not VERIFIED" }
  - { id: ERR_PRACTICE_NOT_VERIFIABLE, http: 422, condition: "Past-practice verification gate failed: occurrence_count < 3 or strength_legalistic < 0.5000" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LRAdmin
    description: "Labor-relations department administrator; owns reference data, agreement lifecycle, archival, implementation voids, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/unions, POST /labor-relations/unions/{id}/state"
      - "POST /labor-relations/agreements, /activate, /archive"
      - "POST /labor-relations/proposals/{id}/void-implementation"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: LRManager
    description: "Labor-relations manager; owns clause repository, past-practice documentation, information-request responses, side-letter drafting, expiration planning"
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/clauses"
      - "clause interpretation actions OPEN_REVIEW / CLOSE_REVIEW / DISPUTE"
      - "POST /labor-relations/side-letters; side-letter PENDING_LEGAL transition"
      - "past-practice DOCUMENTED / DISPUTE / NOTICE_GIVEN / rescind transitions"
      - "information-request ACKNOWLEDGED / IN_PROGRESS / FULFILLED / PARTIALLY_FULFILLED transitions and extend"
    shared_operations: ["expiration-task create and transitions (shared with Negotiator)", "all GET endpoints"]
  - name: Negotiator
    description: "Bargaining team member; schedules sessions, drafts employer proposals, builds and computes costing scenarios"
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/sessions"
      - "POST /labor-relations/costing-scenarios and scenario state transitions (COMPUTED / REVIEWED / DRAFT)"
    shared_operations: ["proposal create (EMPLOYER drafts, shared with ChiefNegotiator via side rule)", "expiration-task create and transitions", "all GET endpoints"]
  - name: ChiefNegotiator
    description: "Employer chief spokesperson; tenders and decides employer side, locks costing scenarios, extends agreements, manages ratification votes"
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/costing-scenarios/{id}/lock"
      - "POST /labor-relations/agreements/{id}/extend"
      - "POST /labor-relations/ratification-votes and vote state (OPEN)"
      - "session IN_SESSION / COMPLETED transitions"
    shared_operations: ["proposal side-gated actions for the EMPLOYER side (tender, counter, accept/reject of UNION proposals, withdraw)", "session CANCELLED (shared with Negotiator)", "all GET endpoints"]
  - name: UnionRepresentative
    description: "External union counterpart; X-User-ID must equal the acting Union's id"
    identity: "entity_backed:Union"
    exclusive_operations:
      - "POST /labor-relations/information-requests"
      - "POST /labor-relations/ratification-votes/{id}/tally"
      - "proposal side-gated actions for the UNION side (draft, tender, counter, accept/reject of EMPLOYER proposals, withdraw)"
      - "clause DISPUTE and past-practice DISPUTE for own union"
    shared_operations: ["past-practice create for own union (shared with LRManager)", "all GET endpoints"]
  - name: LegalCounsel
    description: "Employer labor counsel; records clause interpretations, resolves disputes against executed letters or verified practices, executes side letters, objects to information requests, verifies past practices"
    identity: opaque
    exclusive_operations:
      - "clause interpretation actions RECORD / RESOLVE"
      - "side-letter EXECUTED and DRAFT-return transitions (SoD vs drafter)"
      - "past-practice VERIFIED transition"
      - "information-request OBJECTED transition and objection-withdrawn IN_PROGRESS transition"
    shared_operations: ["all GET endpoints"]
