              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-MAP-5", name: "Aurora Projector", msrp_cents: 15000, standard_map_floor_cents: 10000, governing_policy_id: "${pol_id}" }
