      - name: board_approval_on_constrained_source_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AcquisitionPacket.DUE_DILIGENCE_to_BOARD_APPROVED.preconditions
          - validations[priority=96]
          - errors.ERR_FUNDING_CONSTRAINED
        distinguishing_aspect: "The board-approval precondition funding_source.status == ACTIVE bites even when the money is technically there: the source holds 4000 available against a 1000-cent ask, but it is CONSTRAINED, so the acquisition commitment is refused with ERR_FUNDING_CONSTRAINED rather than ERR_FUNDING_INSUFFICIENT."
        test_recipe:
          setup:
            - "One ANY funding source authorized 100000 cents (reserve floor 5000)."
            - "A first packet for 96000 cents is board-approved, leaving available 4000 < 5000 so the source is CONSTRAINED."
            - "A second packet for 1000 cents on the same source is left in DUE_DILIGENCE... it is moved to ON_HOLD_FUNDING by the constraint cascade."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Constrained Acquisition Line", source_type: "GENERAL_FUND", authorized_cents: 100000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
