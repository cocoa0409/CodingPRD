              as_user_id: "${sub_v1}"
            - call: "POST /pers/devices/${dev_v1}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_v1}"
            - call: "POST /pers/contracts/${ctr_v1}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { v_active: $.data.version }
          trigger:
