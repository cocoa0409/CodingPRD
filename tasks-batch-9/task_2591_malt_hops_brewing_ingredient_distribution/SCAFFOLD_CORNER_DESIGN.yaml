            - call: "POST /yeast-propagation-jobs/${ws_job_id}/complete"
              payload: { outcome: "FAILED", failure_reason: "vessel contamination" }
              as: WarehouseOperator
              captures: { ws_state3: $.data.status, ws_v3: $.data.version }
            - call: "POST /yeast-propagation-jobs/${ws_job_id}/complete"
              payload: { outcome: "READY" }
              as: WarehouseOperator
              captures: { ws_err_double_complete: $.data.error_id }
            - call: "POST /yeast-propagation-jobs/${ws_job_id}/requeue"
              payload: { new_pitch_date: "2026-08-25T00:00:00Z" }
              as: WarehouseOperator
              captures: { ws_state4: $.data.status, ws_v4: $.data.version }
          assert:
            - "setup: ${ws_state1} == REQUESTED and ${ws_v1} == 1"
            - "complete on a REQUESTED job: HTTP 409 with ${ws_err_complete_early} == ERR_INVALID_JOB_STATE"
            - "requeue on a REQUESTED job: HTTP 409 with ${ws_err_requeue_requested} == ERR_INVALID_JOB_STATE — 2026-08-25 clears the 7-day lead time, so priority 15 is what refuses it, not priority 28"
            - "after those two refusals YeastPropagationJob.${ws_job_id}.version == ${ws_v1} — a refused transition never bumps the version"
            - "start: HTTP 200, ${ws_state2} == PROPAGATING, ${ws_v2} == 2 and ${ws_ready_at} == 2026-08-08T00:00:00Z"
            - "second start: HTTP 409 with ${ws_err_double_start} == ERR_INVALID_JOB_STATE"
            - "requeue on a PROPAGATING job: HTTP 409 with ${ws_err_requeue_propagating} == ERR_INVALID_JOB_STATE"
            - "complete FAILED: HTTP 200, ${ws_state3} == FAILED, ${ws_v3} == 3 and failure_reason == vessel contamination"
            - "second complete: HTTP 409 with ${ws_err_double_complete} == ERR_INVALID_JOB_STATE"
            - "requeue from FAILED: HTTP 200, ${ws_state4} == REQUESTED, ${ws_v4} == 4, pitch_date == 2026-08-25T00:00:00Z, failure_reason == null and ready_at == null"

      - name: pick_is_blocked_until_the_yeast_job_reaches_ready
        claim_type: violation_to_error
        grounds:
          - errors[ERR_YEAST_NOT_READY]
          - validations[priority=23]
          - state_machines.SalesOrder.CONFIRMED_to_PICKED
        distinguishing_aspect: "The yeast readiness gate is a cross-entity precondition on pick, not on confirm: a YEAST line whose job is still REQUESTED confirms and prices normally, and only the warehouse move is refused — which also proves a yeast-only order pays the freight minimum with zero chargeable pounds."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Certified brewer, Pale Ale malt, WLP001 and one recipe; one propagation job pitched 2026-08-20 left in REQUESTED."
