  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: visit_scheduling_depends_on_site_planning_state
        grounds:
          - validations[priority=31]
          - errors[ERR_SITE_NOT_PLANNED]
          - entities.Site.fields.recommended_model_id
          - endpoints[POST /ocs/sites/{site_id}/size-and-plan]
        distinguishing_aspect: |
          Entity pair (ServiceVisit -> Site): whether a visit can be created depends entirely on a
          field of a DIFFERENT entity, Site.recommended_model_id, which only
          POST /ocs/sites/{site_id}/size-and-plan can fill. The identical request body is refused
          before planning and accepted afterwards, with nothing about the visit itself changing.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route with capacity 480 and travel_buffer_minutes 30; one COFFEE product in the catalog"
            - "one account with one site created but NOT yet planned: recommended_model_id is null, forecast_cups_per_week is 0 and the site has no ParLevel rows"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
