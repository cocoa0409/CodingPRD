# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Municipal Lien Search & Estoppel Ordering (task_1594)
# 9 rules x 2 instances. Every setup_api_calls / trigger chain replays against
# SCAFFOLD.yaml §1.2 / §1.4 / §1.5 / §1.6.
#
# Common fixture conventions:
#   - Clock default is 2026-08-01T00:00:00Z; most chains set it explicitly.
#   - Statute S1: [2026-01-01, null), response 10d, cap 12000, validity 30d.
#   - Departments created in order: UTILITY(5000/2500), CODE_ENFORCEMENT(7000/3000),
#     PERMIT(4000/2000) — tasks spawn in that order, so $.data[0..2] are fixed.
#   - Base findings: utility [UNPAID_UTILITY 300000]; code [CODE_VIOLATION 10000,
#     daily 150, days 10] -> 11500; permit [] -> 0. Estoppel quote 10000, payoff 45000.
#   - Base totals: payoff 356500; fees 26000.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: estoppel_fee_on_time_vs_late_forfeiture
        grounds:
          - calculations.estoppel_fee_charge
          - state_machines.EstoppelOrder.ORDERED_to_RECEIVED
          - state_machines.EstoppelOrder.OVERDUE_to_RECEIVED
        distinguishing_aspect: |
          Same quoted fee (10000) and payoff (45000) on two identical estoppels
          produce different fees depending solely on receipt timing relative to
          the statutory deadline: on-time receipt charges 10000, late receipt
          (from OVERDUE) forfeits the fee to 0 — the on_time and late_forfeiture
          variants of the EstoppelOrder fee domain diverge by exactly 10000.
        test_recipe:
          setup:
            - "Config A live (jurisdiction FL-DADE, statute 10d/12000/30d, 3 departments, association fee 10000 validity 30)"
            - "Order A (parcel P-A) and Order B (parcel P-B) both identified, each with one DRAFT estoppel"
            - "Both estoppels placed at 2026-08-01 with fee_quoted_cents 10000; statutory_due date 2026-08-11"
            - "Estoppel A received on time at 2026-08-05 with payoff 45000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "CODE_ENFORCEMENT", name: "Code Compliance", research_fee_cents: 7000, rush_surcharge_cents: 3000, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "PERMIT", name: "Building Permits", research_fee_cents: 4000, rush_surcharge_cents: 2000, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /associations"
              payload: { jurisdiction_id: "${j_id}", name: "Sunset HOA", management_company: "Sunset Mgmt", estoppel_fee_cents: 10000, estoppel_validity_days: 30 }
              as: ProviderAdmin
              captures: { a_id: $.data.id}
            - call: "POST /search-orders"
              payload: { property_address: "1 A St", parcel_number: "P-A", closing_date: "2026-08-20", order_class: "STANDARD", association_id: "${a_id}" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_a: $.data.id}
            - call: "POST /search-orders"
              payload: { property_address: "2 B St", parcel_number: "P-B", closing_date: "2026-08-20", order_class: "STANDARD", association_id: "${a_id}" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_b: $.data.id}
            - { call: "POST /search-orders/${o_a}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_b}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_a}/estoppel-orders"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_a: "$.data[0].id"}
            - call: "GET /search-orders/${o_b}/estoppel-orders"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_b: "$.data[0].id"}
            - { call: "POST /estoppel-orders/${e_a}/place", payload: { fee_quoted_cents: 10000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /estoppel-orders/${e_b}/place", payload: { fee_quoted_cents: 10000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ProviderAdmin }
            - { call: "POST /estoppel-orders/${e_a}/receive", payload: { payoff_amount_cents: 45000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: ProviderAdmin }
            - call: "POST /estoppel-orders/${e_b}/receive"
              payload: { payoff_amount_cents: 45000 }
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_b_fee: $.data.current_fee_cents}
            - call: "GET /search-orders/${o_a}"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { oa_fees: $.data.total_fees_cents}
            - call: "GET /search-orders/${o_b}"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { ob_fees: $.data.total_fees_cents}
          assert:
            - "EstoppelOrder.${e_a}.current_fee_cents == 10000 and late_delivery == false"
            - "EstoppelOrder.${e_b}.current_fee_cents == 0 and late_delivery == true"
            - "SearchOrder.${o_a}.total_fees_cents == 10000 and SearchOrder.${o_b}.total_fees_cents == 0 — identical quotes diverge by exactly 10000 across variants"

      - name: missed_item_provisional_vs_confirmed_liability
        grounds:
          - calculations.missed_item_liability
          - state_machines.Discrepancy.UNDER_REVIEW_to_RESOLVED
          - entities.Delivery.fields.liability_cap_cents
        distinguishing_aspect: |
          The same claimed amount (150000) yields two different numbers across the
          provisional and confirmed variants in the liability domain (Discrepancy /
          SearchOrder, distinct from the EstoppelOrder fee domain): provisionally
          the full 150000 sits in pending_claims_cents, while confirmation yields
          min(150000, delivered cap 100000) = 100000 of total_liability_cents.
        test_recipe:
          setup:
            - "Config A live; order delivered via the base flow: 3 tasks completed (balances 300000 / 11500 / 0), estoppel received on time (quote 10000, payoff 45000)"
            - "total_fees_cents == 26000 -> delivery liability cap clamp(10 * 26000) = 100000"
            - "Post-delivery MISSED_ITEM discrepancy filed claiming 150000; under review"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "CODE_ENFORCEMENT", name: "Code Compliance", research_fee_cents: 7000, rush_surcharge_cents: 3000, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "PERMIT", name: "Building Permits", research_fee_cents: 4000, rush_surcharge_cents: 2000, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /associations"
              payload: { jurisdiction_id: "${j_id}", name: "Sunset HOA", management_company: "Sunset Mgmt", estoppel_fee_cents: 10000, estoppel_validity_days: 30 }
              as: ProviderAdmin
              captures: { a_id: $.data.id}
            - call: "POST /search-orders"
              payload: { property_address: "9 L St", parcel_number: "P-L1", closing_date: "2026-08-20", order_class: "STANDARD", association_id: "${a_id}" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t1: "$.data[0].id", t1v: "$.data[0].version", t2: "$.data[1].id", t2v: "$.data[1].version", t3: "$.data[2].id", t3v: "$.data[2].version"}
            - { call: "POST /research-tasks/${t1}/record-findings", payload: { expected_research_task_version: "${t1v}", findings: [ { finding_kind: "UNPAID_UTILITY", amount_cents: 300000 } ] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t1}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t2}/record-findings", payload: { expected_research_task_version: "${t2v}", findings: [ { finding_kind: "CODE_VIOLATION", amount_cents: 10000, daily_accrual_cents: 150, days_outstanding: 10 } ] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t2}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t3}/record-findings", payload: { expected_research_task_version: "${t3v}", findings: [] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t3}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/estoppel-orders"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_id: "$.data[0].id"}
            - { call: "POST /estoppel-orders/${e_id}/place", payload: { fee_quoted_cents: 10000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /estoppel-orders/${e_id}/receive", payload: { payoff_amount_cents: 45000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_id}/submit-for-verification", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_id}/verify-payoff", payload: { verified_payoff_total_cents: 356500 }, as: QAReviewer, as_user_id: "qa_1" }
            - call: "POST /deliveries"
              payload: { search_order_id: "${o_id}" }
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { d_id: $.data.id}
            - { call: "POST /deliveries/${d_id}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa_1" }
            - call: "POST /discrepancies"
              payload: { search_order_id: "${o_id}", subject_type: "SEARCH_ORDER", subject_id: "${o_id}", discrepancy_type: "MISSED_ITEM", claimed_amount_cents: 150000, description: "Missed utility lien" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { dc_id: $.data.id}
            - { call: "POST /discrepancies/${dc_id}/start-review", payload: {}, as: QAReviewer, as_user_id: "qa_2" }
            - call: "GET /search-orders/${o_id}"
              as: QAReviewer
              as_user_id: "qa_2"
              captures: { o_pending: $.data.pending_claims_cents, o_liab0: $.data.total_liability_cents}
          trigger:
            - { call: "POST /discrepancies/${dc_id}/resolve", payload: { resolution_outcome: "CONFIRMED_CORRECTION", confirmed_amount_cents: 150000 }, as: QAReviewer, as_user_id: "qa_2" }
            - call: "GET /search-orders/${o_id}"
              as: QAReviewer
              as_user_id: "qa_2"
              captures: { o_status: $.data.status, o_liab: $.data.total_liability_cents, o_pend: $.data.pending_claims_cents}
          assert:
            - "Provisional variant: before resolve, SearchOrder.${o_id}.pending_claims_cents == 150000 and total_liability_cents == 0"
            - "Discrepancy.${dc_id}.confirmed_liability_cents == 100000 (min(150000, delivered cap 100000))"
            - "Confirmed variant: SearchOrder.${o_id}.total_liability_cents == 100000 and pending_claims_cents == 0"
            - "SearchOrder.${o_id}.status == RESEARCH_IN_PROGRESS and Delivery.${d_id}.status == SUPERSEDED (post-delivery correction cascade)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: violation_accrual_rounded_per_finding_then_summed
        grounds:
          - calculations.task_unpaid_balance
        distinguishing_aspect: |
          Mode (b) nested rounding: fractional daily accruals (133.5 x 7 = 934.5;
          66.5 x 3 = 199.5) are rounded per finding BEFORE summation, yielding
          19135 — the opposite order (sum accruals then round) yields 19134, a
          one-cent divergence; the scaffold pins round-per-finding-then-sum.
        test_recipe:
          setup:
            - "Config A live; order identified; CODE_ENFORCEMENT task is the 2nd spawned task ($.data[1])"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "CODE_ENFORCEMENT", name: "Code Compliance", research_fee_cents: 7000, rush_surcharge_cents: 3000, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "PERMIT", name: "Building Permits", research_fee_cents: 4000, rush_surcharge_cents: 2000, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /search-orders"
              payload: { property_address: "5 R St", parcel_number: "P-R1", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t_code: "$.data[1].id", t_code_v: "$.data[1].version"}
          trigger:
            - call: "POST /research-tasks/${t_code}/record-findings"
              payload:
                expected_research_task_version: "${t_code_v}"
                findings:
                  - { finding_kind: "CODE_VIOLATION", amount_cents: 10000, daily_accrual_cents: 133.5, days_outstanding: 7 }
                  - { finding_kind: "CODE_VIOLATION", amount_cents: 5000, daily_accrual_cents: 66.5, days_outstanding: 3 }
                  - { finding_kind: "UNPAID_UTILITY", amount_cents: 3000 }
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t_bal: $.data.unpaid_balance_cents, t_vc: $.data.open_violation_count}
          assert:
            - "ResearchTask.${t_code}.unpaid_balance_cents == 19135 (10935 + 5200 + 3000; per-finding round_half_up before summation)"
            - "ResearchTask.${t_code}.open_violation_count == 2"
            - "ResearchTask.${t_code}.status == IN_PROGRESS and findings_recorded == true"

      - name: liability_cap_evaluation_order_with_extended_coverage
        grounds:
          - calculations.liability_cap
          - entities.Delivery.fields.coverage_fee_cents
          - entities.Delivery.fields.liability_cap_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the coverage fee is 10% of the
          PROVISIONAL cap while the final cap is 10x fees INCLUDING the coverage
          fee; with base fees 1000 the provisional cap is MIN-bound at 25000,
          coverage is 2500, and the final cap escapes the floor to 35000 — a
          value reachable only with the pinned 5-step evaluation order.
        test_recipe:
          setup:
            - "Cheap jurisdiction (fees 400/350/250 -> base 1000), no association (no estoppel spawned), order with extended_coverage true"
            - "All 3 tasks completed with empty findings; payoff total 0; order verified and delivery created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-PIN", name: "Pinellas", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Utilities", research_fee_cents: 400, rush_surcharge_cents: 100, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "CODE_ENFORCEMENT", name: "Code", research_fee_cents: 350, rush_surcharge_cents: 100, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "PERMIT", name: "Permits", research_fee_cents: 250, rush_surcharge_cents: 100, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /search-orders"
              payload: { property_address: "7 C St", parcel_number: "P-C1", closing_date: "2026-08-20", order_class: "STANDARD", extended_coverage: true }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: $.data.id}
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/research-tasks"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { t1: "$.data[0].id", t1v: "$.data[0].version", t2: "$.data[1].id", t2v: "$.data[1].version", t3: "$.data[2].id", t3v: "$.data[2].version"}
            - { call: "POST /research-tasks/${t1}/record-findings", payload: { expected_research_task_version: "${t1v}", findings: [] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t1}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t2}/record-findings", payload: { expected_research_task_version: "${t2v}", findings: [] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t2}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t3}/record-findings", payload: { expected_research_task_version: "${t3v}", findings: [] }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /research-tasks/${t3}/complete", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_id}/submit-for-verification", payload: {}, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - { call: "POST /search-orders/${o_id}/verify-payoff", payload: { verified_payoff_total_cents: 0 }, as: QAReviewer, as_user_id: "qa_1" }
            - call: "POST /deliveries"
              payload: { search_order_id: "${o_id}" }
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { d_id: $.data.id}
          trigger:
            - call: "POST /deliveries/${d_id}/deliver"
              payload: {}
              as: QAReviewer
              as_user_id: "qa_1"
              captures: { d_cov: $.data.coverage_fee_cents, d_cap: $.data.liability_cap_cents, d_fees: $.data.snapshot_fees_cents}
          assert:
            - "Delivery.${d_id}.snapshot_fees_cents == 1000"
            - "Delivery.${d_id}.coverage_fee_cents == 2500 (10% of provisional cap 25000, MIN-bound since 10 x 1000 = 10000 < 25000)"
            - "Delivery.${d_id}.liability_cap_cents == 35000 (10 x (1000 + 2500) = 35000, escaping the 25000 floor — only with the pinned step order)"
            - "SearchOrder.${o_id}.status == DELIVERED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: estoppel_order_renewal_cycle
        grounds:
          - state_machines.EstoppelOrder.RECEIVED_to_EXPIRED
          - state_machines.EstoppelOrder.EXPIRED_to_ORDERED
          - calculations.estoppel_timeline
        distinguishing_aspect: |
          EstoppelOrder runs a true cycle ORDERED -> RECEIVED -> EXPIRED ->
          ORDERED -> RECEIVED: after expiry the same row is re-placed
          (renewal_count 1, prior fee retained in lifetime_fees_cents) and a
          second receipt adds a second fee — a non-linear machine on
          EstoppelOrder.
        test_recipe:
          setup:
            - "Config A live; order identified with association; estoppel placed at 2026-08-01 (quote 10000) and received same day (payoff 45000); valid_through = 2026-08-31"
            - "Order remains RESEARCH_IN_PROGRESS (tasks untouched) so expiry applies"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 5 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
