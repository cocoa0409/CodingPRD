  - section: calculations
    instances:
      - name: reevaluation_waived_consent_caseload_points
        claim_type: correct_result
        grounds:
          - calculations.evaluation_caseload_points
          - state_machines.Referral.INTAKE_RECEIVED_to_CONSENT_WAIVED
          - entities.Referral.fields.waiver_reason
        distinguishing_aspect: "Two referrals with the SAME two domains and no interpreter score differently purely on referral_type (INITIAL 6 vs REEVALUATION 5), and the REEVALUATION arrives through the consent-to-waive branch, whose Evaluation clock still starts from the waiver's effective_at."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School."
            - "Referral 1: INITIAL, domains [COGNITIVE, ADAPTIVE], consented 2026-08-01T09:00:00Z."
            - "Referral 2: REEVALUATION of evaluation 1, same two domains, consent WAIVED at 2026-08-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Tamarack Elementary", building_code: "TM39", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 400 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-20", referral_type: "INITIAL", requested_domains: ["COGNITIVE", "ADAPTIVE"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-20" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-20", referral_type: "REEVALUATION", prior_evaluation_id: "${eval1}", requested_domains: ["COGNITIVE", "ADAPTIVE"] }
              as: IntakeCoordinator
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /psych-services/referrals/${r2}/consent-events"
              payload: { event_type: "CONSENT_WAIVED", effective_at: "2026-08-01T12:00:00Z", waiver_reason: "Parents waived the three-year reevaluation consent in writing." }
              as: IntakeCoordinator
              captures: { eval2: $.data.active_evaluation_id }
          assert:
            - "Evaluation.${eval1}.caseload_points == 6 (3 base + 1 extra domain + 0 interpreter + 2 INITIAL)"
            - "Evaluation.${eval2}.caseload_points == 5 (3 base + 1 extra domain + 0 interpreter + 1 REEVALUATION) — identical domains, 1 point cheaper"
            - "Referral.${r2}.status == CONSENT_WAIVED, last_consent_event_type == CONSENT_WAIVED, waiver_reason is the submitted string, and parent_signature_reference == null"
            - "Evaluation.${eval2}.clock_start_date == \"2026-08-01\", base_due_date == \"2026-09-30\", referral_type == \"REEVALUATION\", prior_evaluation_id == ${eval1}"
            - "GET /psych-services/evaluations?prior_evaluation_id=${eval1} returns exactly one row whose id == ${eval2}"

