# PRD Benchmark Scaffold — Government Reseller Contract Vehicle & Schedule Pricing Compliance
# Generated per skills/prd-bench-scaffold-generator/SKILL.md
# §1.0–§1.7 live here. §1.8 -> SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 -> SCAFFOLD_CORNER_DESIGN.yaml.

scenario: |
  Government Reseller Contract Vehicle & Schedule Pricing Compliance (Carahsoft):
  manufacturer partnership agreements authorizing resale of software and services to public
  sector buyers, contract vehicle management across federal schedules, state cooperative
  agreements and agency-specific vehicles with scope limits, price list submission and
  modification with most-favored-customer and price reduction obligations, order intake from
  agencies and integrators with contract vehicle eligibility validation, teaming arrangements
  with system integrators and small business subcontracting requirements, compliance with
  trade agreements and supply chain restrictions on product origin, invoicing, payment terms
  and government payment systems, audit readiness on pricing disclosures and sales reporting.

domain_name: "govreseller-schedule-compliance"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: parallel   # Order: compliance_status x billing_status; PriceList: cyclic; ManufacturerAgreement: compound posture
  relationship_patterns:
    - one_to_many
    - many_to_many        # TeamingArrangement <-> ManufacturerAgreement via TeamingScope
    - cross_aggregate     # Order -> Agreement via TeamingScope; Invoice -> Order; SalesReport -> Agreement
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the manufacturer" }
      - { name: duns, type: string, source: input, description: "9-digit DUNS identifier; unique across manufacturers", constraints: "unique; exactly 9 digits" }
      - { name: manufacturer_type, type: enum, source: input, description: "SOFTWARE_PUBLISHER | HARDWARE_OEM | CLOUD_SAAS | HYBRID" }
      - { name: headquarters_country, type: string, source: input, description: "ISO-3166 alpha-2 country of headquarters" }
      - { name: designated_countries, type: array, source: input, description: "ISO-3166 alpha-2 list of countries whose origin the manufacturer attests as TAA designated; drives TAA evaluation variant", default: [] }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }

  - name: ManufacturerAgreement
    parent: Manufacturer
    common_fields: true
    fields:
      - { name: manufacturer_id, type: string, source: input, description: "FK -> Manufacturer.id" }
      - { name: scope_tiers, type: array, source: input, description: "Subset of {FEDERAL, STATE, LOCAL, EDUCATION, HEALTHCARE}; ceilings keyed to tier", constraints: "non-empty" }
      - { name: mfc_discount_pct, type: number, source: input, description: "Most-favored-customer discount fraction (0..0.5); floor = MFC_BASE_DISCOUNT", constraints: "0 <= x <= 0.5, 4 decimal places" }
      - { name: small_business_goal_pct, type: number, source: input, description: "Small-business subcontracting goal fraction (0..1); attainment below this on TERMINATED blocks agreement posture", constraints: "0 <= x <= 1, 4 decimal places" }
      - { name: product_scope, type: array, source: input, description: "SKU prefixes authorized for resale; PriceList lines must match a prefix" }
      - { name: term_start, type: datetime, source: input, description: "Agreement term start, inclusive" }
      - { name: term_end, type: datetime, source: input, description: "Agreement term end, exclusive" }
      - { name: dispute_credit_cents, type: integer, source: computed, description: "Aggregated credit/debit ledger from open disputes (positive = credit owed to manufacturer); recomputed on dispute raise/resolve; drives posture" }
      - { name: posture, type: enum, source: computed, description: "GOOD_STANDING | ON_HOLD | SUSPENDED; derived: SUSPENDED if status==TERMINATED else ON_HOLD if dispute_credit_cents < POSTURE_ON_HOLD_DEBT_CENTS else GOOD_STANDING; recomputed on every mutation chain", default: GOOD_STANDING }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED", default: DRAFT }

  - name: ContractVehicle
    parent: ManufacturerAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ManufacturerAgreement.id" }
      - { name: vehicle_kind, type: enum, source: input, description: "FED_SCHEDULE | STATE_COOP | AGENCY_SPECIFIC | COOP_PURCHASING" }
      - { name: buyer_tiers, type: array, source: input, description: "Subset of {FEDERAL, STATE, LOCAL, EDUCATION, HEALTHCARE} — intersected against agreement scope at authorization", constraints: "non-empty" }
      - { name: ceiling_cents, type: integer, source: input, description: "Tier-scoped ceiling: applied to the sum of order_total_cents across DELIVERED+INVOICED orders on this vehicle keyed by buyer tier; exact value allowed, exceeding rejected", constraints: "> 0" }
      - { name: taa_required, type: boolean, source: input, description: "Trade Agreements Act origin restriction applies on this vehicle", default: true }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive" }
      - { name: prc_accumulator_cents, type: integer, source: computed, description: "Price Reduction Clause exposure: sum over ACTIVE price-list lines of max(0, (basis_price_cents - offered_price_cents)) * sold_qty_on_vehicle; recomputed on every price-list activation, order intake, and order cancellation", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | AUTHORIZED | SUSPENDED | EXPIRED", default: PENDING }

  - name: PriceList
    parent: ContractVehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> ContractVehicle.id" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of the ContractsManager who submitted" }
      - { name: period_from, type: datetime, source: input, description: "Price period start, inclusive" }
      - { name: period_to, type: datetime, source: input, description: "Price period end, exclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE | SUPERSEDED | REJECTED", default: DRAFT }

  - name: PriceLine
    parent: PriceList
    common_fields: false
    fields:
      - { name: price_list_id, type: string, source: input, description: "FK -> PriceList.id" }
      - { name: sku, type: string, source: input, description: "SKU offered; must match a ManufacturerAgreement.product_scope prefix" }
      - { name: basis_price_cents, type: integer, source: input, description: "Commercial list (basis) price per unit", constraints: "> 0" }
      - { name: offered_price_cents, type: integer, source: input, description: "Government-offered unit price; must satisfy offered <= floor(basis * (1 - mfc_discount_pct))", constraints: "> 0" }
      - { name: origin_country, type: string, source: input, description: "ISO-3166 alpha-2 product origin" }
      - { name: sold_qty, type: integer, source: computed, description: "Cumulative delivered quantity on this line; incremented on order DELIVERED, decremented on order CANCELLED before delivery", default: 0 }

  - name: TeamingArrangement
    parent: ManufacturerAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ManufacturerAgreement.id" }
      - { name: integrator_name, type: string, source: input, description: "System integrator legal name" }
      - { name: small_business, type: boolean, source: input, description: "SB classification; affects teaming surcharge and subcontracting goal credit" }
      - { name: revenue_share_pct, type: number, source: input, description: "Integrator revenue share fraction on teaming orders (0..0.4)", constraints: "0 <= x <= 0.4, 4 decimal places" }
      - { name: window_start, type: datetime, source: input, description: "Teaming window start, inclusive" }
      - { name: window_end, type: datetime, source: input, description: "Teaming window end, exclusive" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | SUSPENDED | TERMINATED", default: PROPOSED }

  - name: TeamingScope
    parent: TeamingArrangement
    common_fields: false
    fields:
      - { name: teaming_id, type: string, source: input, description: "FK -> TeamingArrangement.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> ContractVehicle.id; vehicles this arrangement may transact on" }
      - { name: sku_prefixes, type: array, source: input, description: "SKU prefix allow-list for this teaming scope; must be subset of agreement product_scope", constraints: "non-empty" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> ContractVehicle.id" }
      - { name: price_list_id, type: string, source: input, description: "FK -> PriceList.id; must be the ACTIVE list for the vehicle at order creation (version-pinned at creation)" }
      - { name: teaming_id, type: string, source: input, description: "FK -> TeamingArrangement.id; optional — null for direct agency orders", default: null }
      - { name: buyer_tier, type: enum, source: input, description: "FEDERAL | STATE | LOCAL | EDUCATION | HEALTHCARE" }
      - { name: lines, type: array, source: input, description: "[{ sku, qty }] — each sku must appear on the pinned ACTIVE price list; qty > 0", constraints: "1..100 lines" }
      - { name: order_total_cents, type: integer, source: computed, description: "sum over lines of offered_price_cents * qty, computed per-line then summed (see calc order_pricing); frozen at creation" }
      - { name: teaming_surcharge_cents, type: integer, source: computed, description: "Non-SB teaming uplift applied on order_total (see calc teaming_surcharge); 0 when teaming_id null or SB" }
      - { name: subcontract_cents, type: integer, source: computed, description: "Amount credited to small-business subcontracting goal when teaming partner is SB and order is DELIVERED", default: 0 }
      - { name: compliance_status, type: enum, source: system, description: "DRAFT | SCREENING | CLEARED | BLOCKED | CANCELLED — parallel dimension 1", default: DRAFT }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | DELIVERED | INVOICED | PAID — parallel dimension 2", default: UNBILLED }
      - { name: origin_flag, type: enum, source: computed, description: "TAA_PASS | TAA_FAIL | NOT_APPLICABLE — evaluated per TAA variant for the vehicle at SCREENING", default: NOT_APPLICABLE }

  - name: Invoice
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: period_label, type: string, source: input, description: "YYYY-MM billing period; aggregates into SalesReport of that period" }
      - { name: amount_cents, type: integer, source: computed, description: "order_total_cents + teaming_surcharge_cents of the source order at invoicing time" }
      - { name: payment_terms_days, type: integer, source: input, description: "Net terms (15|30|45|60); due_at = issued_at + terms", constraints: "one of 15,30,45,60" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at invoicing" }
      - { name: due_at, type: datetime, source: computed, description: "issued_at + payment_terms_days" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | OVERDUE | VOID", default: ISSUED }

  - name: Dispute
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: kind, type: enum, source: input, description: "PRICING_OVERCHARGE | TAA_BREACH | SCOPE_VIOLATION | BILLING_ERROR" }
      - { name: amount_cents, type: integer, source: input, description: "Disputed amount; positive = credit owed to manufacturer (reduces posture debt); negative = debt owed to government", constraints: "!= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED_CREDIT | RESOLVED_DEBIT | REJECTED", default: OPEN }

  - name: SalesReport
    parent: ManufacturerAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ManufacturerAgreement.id" }
      - { name: period_label, type: string, source: input, description: "YYYY-MM reporting period; one report per agreement per period", constraints: "unique (agreement_id, period_label)" }
      - { name: total_sales_cents, type: integer, source: computed, description: "Sum of Invoice.amount_cents for invoices with period_label == this period on orders routed via this agreement (order -> vehicle -> agreement), invoices in ISSUED|PAID|OVERDUE (VOID excluded); recomputed on invoice issue/void/period sweep" }
      - { name: total_sb_subcontract_cents, type: integer, source: computed, description: "Sum of Order.subcontract_cents for DELIVERED+ orders in the period; small-business attainment numerator", default: 0 }
      - { name: sb_goal_met, type: boolean, source: computed, description: "total_sb_subcontract_cents >= agreement.small_business_goal_pct * total_sales_cents (guard: total_sales_cents == 0 -> true)", default: true }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED", default: DRAFT }

  - name: ComplianceAudit
    parent: ManufacturerAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ManufacturerAgreement.id" }
      - { name: scope, type: enum, source: input, description: "PRICING_DISCLOSURE | SALES_REPORTING | TAA_ORIGIN | FULL" }
      - { name: mfc_attestation_cents, type: integer, source: input, description: "Auditor-attested commercial benchmark sum used to re-derive MFC discount" }
      - { name: mfc_variance_cents, type: integer, source: computed, description: "|disclosed_total_cents - mfc_attestation_cents| at finding time; exceeds AUDIT_MATERIALITY_CENTS -> finding opens" }
      - { name: disclosed_total_cents, type: integer, source: computed, description: "Snapshot of agreement-wide disclosed sales (sum of FINALIZED SalesReport.total_sales_cents) at audit open" }
      - { name: status, type: enum, source: system, description: "OPEN | FINDING_ISSUED | CLOSED", default: OPEN }

  - name: PriceModification
    parent: PriceList
    common_fields: true
    fields:
      - { name: price_list_id, type: string, source: input, description: "FK -> PriceList.id" }
      - { name: sku, type: string, source: input, description: "SKU being modified; must exist on the list" }
      - { name: new_offered_price_cents, type: integer, source: input, description: "Replacement offered unit price; re-checked against MFC floor", constraints: "> 0" }
      - { name: reason_code, type: enum, source: input, description: "PRC_TRIGGERED | COMMERCIAL_ALIGNMENT | ADMIN_CORRECTION" }
      - { name: expected_price_list_version, type: integer, source: input, description: "OCC guard on PriceList.version" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED", default: PENDING }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ManufacturerAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: ContractsManager
        preconditions:
          - "term_start < term_end"
          - "scope_tiers non-empty"
          - "manufacturer.status == ACTIVE"
          - "no other ManufacturerAgreement for the same manufacturer is ACTIVE (one active agreement per manufacturer)"
        side_effects:
          - "recompute posture (initially GOOD_STANDING since dispute_credit_cents == 0)"
          - "increments ManufacturerAgreement.version"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agreements/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "posture := SUSPENDED"
          - "cascade: all ContractVehicle under agreement with status AUTHORIZED -> SUSPENDED"
          - "cascade: all TeamingArrangement under agreement with status APPROVED -> SUSPENDED"
          - "increments ManufacturerAgreement.version"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /agreements/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "agreement.status == SUSPENDED"
          - "manufacturer.status == ACTIVE"
          - "agreement.dispute_credit_cents >= POSTURE_ON_HOLD_DEBT_CENTS"
        side_effects:
          - "posture recomputed via posture_derivation"
          - "cascade: vehicles SUSPENDED-by-cascade -> AUTHORIZED (only those whose own suspension was cascade-flagged)"
          - "increments ManufacturerAgreement.version"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agreements/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "agreement.status == ACTIVE"
          - "every SalesReport under the agreement is FINALIZED and has sb_goal_met == true"
        side_effects:
          - "posture := SUSPENDED"
          - "cascade: all ContractVehicle under agreement -> EXPIRED"
          - "cascade: all TeamingArrangement under agreement -> TERMINATED"
          - "cascade: all PriceList ACTIVE -> SUPERSEDED"
          - "cascade: all Order with billing_status == UNBILLED and compliance_status in {DRAFT, SCREENING, CLEARED} -> compliance_status CANCELLED; each cancellation recomputes its vehicle.prc_accumulator_cents"
          - "increments ManufacturerAgreement.version"

  - entity: ContractVehicle
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /vehicles/{id}/authorize"
        actor: ContractsManager
        preconditions:
          - "agreement.status == ACTIVE"
          - "agreement.posture == GOOD_STANDING"
          - "vehicle.buyer_tiers ⊆ agreement.scope_tiers (scope containment)"
          - "vehicle.effective_from < vehicle.effective_to"
          - "logical clock within [effective_from, effective_to)"
        side_effects:
          - "increments ContractVehicle.version"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /vehicles/{id}/suspend OR cascade from agreement suspend"
        actor: ComplianceOfficer
        preconditions:
          - "vehicle.status == AUTHORIZED"
        side_effects:
          - "cascade: ACTIVE PriceList under vehicle -> SUSPENDED-equivalent: list stays ACTIVE but order intake blocked via cross-entity gate (orders blocked while vehicle suspended)"
          - "increments ContractVehicle.version"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /vehicles/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "vehicle.status == SUSPENDED"
          - "agreement.status == ACTIVE AND agreement.posture == GOOD_STANDING"
        side_effects:
          - "increments ContractVehicle.version"
      - from: AUTHORIZED
        to: EXPIRED
        trigger: "system: logical clock reaches effective_to (checked lazily on any order intake / price-list submission; also POST /vehicles/{id}/expire forces it)"
        actor: system
        preconditions:
          - "current logical time >= vehicle.effective_to OR forced expire"
        side_effects:
          - "cascade: ACTIVE PriceList under vehicle -> SUPERSEDED"
          - "cascade: DRAFT/SCREENING Orders on vehicle -> CANCELLED (compliance dimension)"
          - "increments ContractVehicle.version"

  - entity: PriceList
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /price-lists/{id}/submit"
        actor: ContractsManager
        preconditions:
          - "list.status == DRAFT"
          - "vehicle.status == AUTHORIZED"
          - "list has >= 1 PriceLine"
          - "period_from < period_to; period intersects vehicle window"
        side_effects:
          - "increments PriceList.version"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /price-lists/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "list.status == SUBMITTED"
          - "vehicle.status == AUTHORIZED"
          - "every PriceLine: offered_price_cents <= floor(basis_price_cents * (1 - agreement.mfc_discount_pct)) (MFC floor)"
          - "every PriceLine.origin_country TAA-pass under vehicle.taa_required rules"
          - "every PriceLine.sku matches agreement.product_scope prefix"
          - "no other PriceList for this vehicle is ACTIVE"
        side_effects:
          - "recompute vehicle.prc_accumulator_cents (baseline 0 if all offered <= basis)"
          - "increments PriceList.version"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /price-lists/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "list.status == SUBMITTED"
        side_effects:
          - "increments PriceList.version"
      - from: ACTIVE
        to: DRAFT
        trigger: "POST /price-lists/{id}/reopen (cyclic revision loop)"
        actor: ContractsManager
        preconditions:
          - "list.status == ACTIVE"
          - "no Order pinned to this price list exists with billing_status in {DELIVERED, INVOICED} (PAID or beyond)"
        side_effects:
          - "cascade: existing pinned orders remain pinned to this list version snapshot, but new orders cannot be created while list not ACTIVE"
          - "vehicle.prc_accumulator_cents recomputed with this list treated as inactive (excluded)"
          - "increments PriceList.version"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "activation of a sibling PriceList on the same vehicle, or vehicle expire/terminate cascade"
        actor: system
        preconditions:
          - "a sibling list is being activated (then this one supersedes atomically)"
        side_effects:
          - "vehicle.prc_accumulator_cents recomputed with only the newly ACTIVE list"
          - "increments PriceList.version"

  - entity: TeamingArrangement
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /teaming/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "arrangement.status == PROPOSED"
          - "agreement.status == ACTIVE AND agreement.posture == GOOD_STANDING"
          - "every TeamingScope.vehicle_id is AUTHORIZED"
          - "every TeamingScope.sku_prefixes ⊆ agreement.product_scope"
        side_effects:
          - "increments TeamingArrangement.version"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /teaming/{id}/suspend OR cascade from agreement suspend"
        actor: ComplianceOfficer
        preconditions:
          - "arrangement.status == APPROVED"
        side_effects:
          - "increments TeamingArrangement.version"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /teaming/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "arrangement.status == SUSPENDED"
          - "agreement.status == ACTIVE AND agreement.posture == GOOD_STANDING"
        side_effects:
          - "increments TeamingArrangement.version"
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /teaming/{id}/terminate OR cascade from agreement terminate"
        actor: ContractsManager
        preconditions:
          - "arrangement.status == APPROVED"
        side_effects:
          - "increments TeamingArrangement.version"

  - entity: Order
    initial_state: "DRAFT/UNBILLED (parallel dimensions)"
    terminal_states: ["compliance: CANCELLED or BLOCKED; billing: PAID"]
    transitions:
      - from: "compliance DRAFT"
        to: "compliance SCREENING"
        trigger: "POST /orders/{id}/submit"
        actor: Integrator
        preconditions:
          - "order.compliance_status == DRAFT"
          - "vehicle.status == AUTHORIZED"
          - "price_list.status == ACTIVE"
          - "agreement.posture == GOOD_STANDING"
        side_effects:
          - "evaluate TAA origin across order lines (sets origin_flag)"
          - "increments Order.version"
      - from: "compliance SCREENING"
        to: "compliance CLEARED"
        trigger: "system: auto-clear when origin_flag != TAA_FAIL and scope/teaming checks pass"
        actor: system
        preconditions:
          - "origin_flag in {TAA_PASS, NOT_APPLICABLE}"
          - "buyer_tier ∈ vehicle.buyer_tiers"
          - "teaming (if present): arrangement APPROVED, scope covers vehicle, sku prefixes cover all order skus"
        side_effects:
          - "increments Order.version"
      - from: "compliance SCREENING"
        to: "compliance BLOCKED"
        trigger: "system: TAA fail, scope miss, or teaming ineligibility"
        actor: system
        preconditions:
          - "origin_flag == TAA_FAIL OR buyer_tier ∉ vehicle.buyer_tiers OR teaming ineligible"
        side_effects:
          - "increments Order.version"
      - from: "compliance CLEARED, billing UNBILLED"
        to: "billing DELIVERED"
        trigger: "POST /orders/{id}/deliver"
        actor: ResellerOps
        preconditions:
          - "compliance_status == CLEARED AND billing_status == UNBILLED"
          - "order_total_cents + Σ(existing DELIVERED+INVOICED+PAID order_total_cents on vehicle with same buyer_tier) <= vehicle.ceiling_cents (boundary: equal allowed)"
        side_effects:
          - "increment each PriceLine.sold_qty by ordered qty"
          - "recompute vehicle.prc_accumulator_cents"
          - "if teaming SB: subcontract_cents := order_total_cents (full credit); ledger toward sb_goal"
          - "increments Order.version"
      - from: "billing DELIVERED"
        to: "billing INVOICED"
        trigger: "POST /invoices (creates Invoice from DELIVERED order)"
        actor: ResellerOps
        preconditions:
          - "order.billing_status == DELIVERED"
          - "order.compliance_status == CLEARED"
          - "no existing non-VOID Invoice for this order"
        side_effects:
          - "create Invoice ISSUED with amount_cents := order_total + teaming_surcharge; due_at := issued_at + terms"
          - "update SalesReport.total_sales_cents for the invoice period (upsert DRAFT report if missing)"
          - "recompute SalesReport.sb_goal_met"
          - "increments Order.version"
      - from: "billing INVOICED"
        to: "billing PAID"
        trigger: "POST /invoices/{id}/pay"
        actor: FinanceOps
        preconditions:
          - "invoice.status in {ISSUED, OVERDUE}"
        side_effects:
          - "invoice.status := PAID"
          - "SalesReport totals unchanged (invoice already counted)"
          - "increments Order.version"
      - from: "compliance DRAFT|SCREENING|CLEARED with billing UNBILLED"
        to: "compliance CANCELLED"
        trigger: "POST /orders/{id}/cancel OR cascade from vehicle expire / agreement terminate"
        actor: Integrator
        preconditions:
          - "billing_status == UNBILLED"
          - "compliance_status not in {CANCELLED, BLOCKED}"
        side_effects:
          - "release reserved capacity: subtract order_total from vehicle tier-consumed (only had been counted after DELIVERED; for UNBILLED no-op on ceiling)"
          - "recompute vehicle.prc_accumulator_cents (no sold_qty yet — unchanged unless previously delivered; delivered orders cannot cancel)"
          - "increments Order.version"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: FinanceOps
        preconditions:
          - "invoice.status in {ISSUED, OVERDUE}"
        side_effects:
          - "increments Invoice.version"
      - from: ISSUED
        to: OVERDUE
        trigger: "system: logical clock passes due_at while unpaid (checked on read or sweep)"
        actor: system
        preconditions:
          - "current logical time > invoice.due_at"
          - "invoice.status == ISSUED"
        side_effects:
          - "increments Invoice.version"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceOps
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "order.billing_status reverts INVOICED -> DELIVERED"
          - "SalesReport.total_sales_cents -= invoice.amount_cents; recompute sb_goal_met"
          - "increments Invoice.version"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_CREDIT, RESOLVED_DEBIT, REJECTED]
    transitions:
      - from: OPEN
        to: RESOLVED_CREDIT
        trigger: "POST /disputes/{id}/resolve with outcome=CREDIT"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status == OPEN"
        side_effects:
          - "agreement.dispute_credit_cents += dispute.amount_cents (signed; positive amounts increase credit)"
          - "recompute agreement.posture"
          - "increments Dispute.version"
      - from: OPEN
        to: RESOLVED_DEBIT
        trigger: "POST /disputes/{id}/resolve with outcome=DEBIT"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status == OPEN"
        side_effects:
          - "agreement.dispute_credit_cents += dispute.amount_cents (negative amounts deepen debt; posture may flip to ON_HOLD)"
          - "recompute agreement.posture"
          - "increments Dispute.version"
      - from: OPEN
        to: REJECTED
        trigger: "POST /disputes/{id}/resolve with outcome=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status == OPEN"
        side_effects:
          - "no ledger change; posture unchanged"
          - "increments Dispute.version"

  - entity: SalesReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /sales-reports/{id}/finalize"
        actor: FinanceOps
        preconditions:
          - "report.status == DRAFT"
          - "logical clock beyond period end (period closed)"
        side_effects:
          - "snapshot totals; recompute sb_goal_met one final time"
          - "increments SalesReport.version"

  - entity: ComplianceAudit
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FINDING_ISSUED
        trigger: "POST /audits/{id}/issue-finding"
        actor: Auditor
        preconditions:
          - "audit.status == OPEN"
          - "mfc_variance_cents > AUDIT_MATERIALITY_CENTS"
        side_effects:
          - "cascade: agreement.status ACTIVE -> SUSPENDED (segregation-of-duties: the auditor cannot also reinstate)"
          - "increments ComplianceAudit.version"
      - from: FINDING_ISSUED
        to: CLOSED
        trigger: "POST /audits/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "audit.status == FINDING_ISSUED"
          - "agreement.status == ACTIVE (finding remediated)"
        side_effects:
          - "increments ComplianceAudit.version"
      - from: OPEN
        to: CLOSED
        trigger: "POST /audits/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "audit.status == OPEN"
          - "no finding was issued"
        side_effects:
          - "increments ComplianceAudit.version"

  - entity: PriceModification
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /price-modifications/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "mod.status == PENDING"
          - "price_list.status == ACTIVE"
          - "new_offered_price_cents <= floor(line.basis_price_cents * (1 - agreement.mfc_discount_pct))"
          - "segregation of duties: approver X-User-ID != mod creator X-User-ID"
        side_effects:
          - "PriceLine.offered_price_cents := new_offered_price_cents"
          - "recompute vehicle.prc_accumulator_cents"
          - "increments PriceList.version AND increments PriceModification.version"
      - from: PENDING
        to: REJECTED
        trigger: "POST /price-modifications/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "mod.status == PENDING"
        side_effects:
          - "increments PriceModification.version"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serially observable only)
# =============================================================================
concurrency_rules:
  - rule_id: price-modification-stale-list
    parent_entity: PriceList
    write_endpoint: "POST /price-modifications"
    occ_field: "expected_price_list_version"
    description: |
      Creating a PriceModification against a PriceList whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just approved a different modification (which bumps the
      list version) and the current writer's view of the list is therefore stale.
    error_id: ERR_STALE_PRICE_LIST_VERSION
    http_status: 412

  - rule_id: agreement-update-stale-version
    parent_entity: ManufacturerAgreement
    write_endpoint: "PATCH /agreements/{id}"
    occ_field: "expected_agreement_version"
    description: |
      Patching a ManufacturerAgreement (e.g., adjusting mfc_discount_pct or
      scope_tiers) with an expected version older than the current version is
      rejected — the patcher is acting on a stale snapshot.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: vehicle-update-stale-version
    parent_entity: ContractVehicle
    write_endpoint: "PATCH /vehicles/{id}"
    occ_field: "expected_vehicle_version"
    description: |
      Patching a ContractVehicle (ceiling or effective window) with a stale
      expected version is rejected so a ceiling raise does not silently clobber
      a concurrent ceiling change.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412

  - rule_id: order-cancel-stale-version
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/cancel"
    occ_field: "expected_order_version"
    description: |
      Cancelling an order whose version advanced since the caller last read it
      is rejected; the caller may be cancelling a stale snapshot.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    description: "Compute order_total_cents and teaming_surcharge_cents for an Order from the pinned ACTIVE PriceList"
    trigger: "on POST /orders (at creation; frozen thereafter)"
    algorithm: aggregation
    formula: |
      pinned_list := PriceList[order.price_list_id]
      order_total_cents := 0
      for each line in order.lines:
        pl := PriceLine in pinned_list where sku == line.sku
        line_subtotal_cents := round_half_up(pl.offered_price_cents * line.qty)   # per-line rounding
        order_total_cents := order_total_cents + line_subtotal_cents              # then sum
      # Rounding order is pinned: per-line round_half_up, then integer sum.
      # DO NOT sum-then-round.
      teaming_surcharge_cents := teaming_surcharge(order)
      # Teaming surcharge added at invoice time; order_total_cents itself excludes surcharge.
    input_set: "Order.lines (qty > 0 each), pinned PriceList lines"
    constants:
      ROUNDING: "round_half_up per line"
    precision: "0 decimal places (integer cents)"
    variants:
      - name: direct_agency
        when: "order.teaming_id is null"
        difference: "teaming_surcharge_cents := 0"
      - name: teaming_partnered
        when: "order.teaming_id is not null"
        difference: "teaming_surcharge_cents computed by teaming_surcharge rule"

  - name: teaming_surcharge
    description: "Non-small-business teaming uplift; combinatorial formula with non-linear interaction of team size, SB flag, and revenue share"
    trigger: "on POST /orders when teaming_id != null; recomputed if PriceModification approves a lower offered price on any line BEFORE delivery"
    algorithm: tiered_pricing
    formula: |
      if TeamingArrangement.small_business == true:
        surcharge := 0
      else:
        base := order.order_total_cents
        share := TeamingArrangement.revenue_share_pct
        # Non-linear: surcharge is min(SURCHARGE_CAP_CENTS, max(base * share * SURCHARGE_RATE,
        #              base * SURCHARGE_FLOOR_PCT))
        # mode (a): >=3 inputs (base, share, cap, floor) with nested min/max
        raw := base * share * SURCHARGE_RATE
        floored := base * SURCHARGE_FLOOR_PCT
        surcharge := round_half_up(min(SURCHARGE_CAP_CENTS, max(raw, floored)))
    input_set: "Order with teaming_id non-null; TeamingArrangement fields"
    constants:
      SURCHARGE_RATE: 0.30       # fraction of integrator share remitted as uplift
      SURCHARGE_FLOOR_PCT: 0.015 # minimum 1.5% of order_total regardless of share
      SURCHARGE_CAP_CENTS: 500000  # $5,000 cap per order
    precision: "0 decimal places (integer cents), round_half_up"
    variants: []

  - name: mfc_floor
    description: "Most-favored-customer price floor per PriceLine: offered must not exceed floor(basis * (1 - mfc_discount_pct))"
    trigger: "on PriceList activate; on PriceModification approve"
    algorithm: threshold
    formula: |
      mfc_floor_cents := floor(basis_price_cents * (1 - ManufacturerAgreement.mfc_discount_pct))
      violation iff offered_price_cents > mfc_floor_cents
      # Boundary: offered == floor is ALLOWED; offered == floor + 1 is REJECTED.
    input_set: "PriceLine on activating list or PriceModification target line"
    constants: {}
    precision: "integer floor"
    variants:
      - name: federal_schedule
        when: "vehicle.vehicle_kind == FED_SCHEDULE"
        difference: "apply agreement.mfc_discount_pct as stated"
      - name: state_coop
        when: "vehicle.vehicle_kind in {STATE_COOP, COOP_PURCHASING}"
        difference: "effective discount := min(agreement.mfc_discount_pct, STATE_COOP_MFC_CAP) — state co-ops cap the MFC discount so offered prices may sit above the federal floor without violating this variant"
    constants_extra:
      STATE_COOP_MFC_CAP: 0.25

  - name: taa_origin_evaluation
    description: "TAA origin determination per order; dual variant between manufacturer-attested designated countries and per-line evidence"
    trigger: "on Order DRAFT -> SCREENING"
    algorithm: forward_looking
    formula: |
      if vehicle.taa_required == false:
        origin_flag := NOT_APPLICABLE
      else variant per TAA_MODE:
        # Variant MANUFACTURER_ATTESTED (default on FED_SCHEDULE):
        #   pass iff every line.origin_country ∈ manufacturer.designated_countries
        # Variant LINE_EVIDENCE (default on STATE_COOP / AGENCY_SPECIFIC):
        #   pass iff every line.origin_country ∈ TAA_DESIGNATED_COUNTRIES (fixed statutory list)
        # Both use the same lines; results can diverge when manufacturer attests a country
        # that is not on the statutory list, or vice versa.
    input_set: "Order lines, Manufacturer.designated_countries, statutory TAA list"
    constants:
      TAA_DESIGNATED_COUNTRIES: ["US","CA","MX","GB","DE","FR","JP","AU","IL","KR","NO","CH"]
    precision: "boolean"
    variants:
      - name: manufacturer_attested
        when: "vehicle.vehicle_kind == FED_SCHEDULE"
        difference: "whitelist := Manufacturer.designated_countries"
      - name: line_evidence
        when: "vehicle.vehicle_kind in {STATE_COOP, AGENCY_SPECIFIC, COOP_PURCHASING}"
        difference: "whitelist := statutory TAA_DESIGNATED_COUNTRIES"

  - name: prc_accumulator
    description: "Price Reduction Clause exposure accumulator on ContractVehicle; chronological sum over sold quantities"
    trigger: "on PriceList activate; on Order deliver; on Order cancel; on PriceModification approve"
    algorithm: chronological
    formula: |
      prc_accumulator_cents := 0
      for each PriceLine pl on the ACTIVE list of this vehicle:
        delta_cents := max(0, pl.basis_price_cents - pl.offered_price_cents)
        prc_accumulator_cents := prc_accumulator_cents + delta_cents * pl.sold_qty
      # Order of summation: lines sorted by (sku ASC, created_at ASC); sold_qty changes
      # as orders are delivered. SUPERSEDED/DRAFT lists excluded.
    input_set: "ACTIVE PriceList's PriceLines on this vehicle"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: posture_derivation
    description: "ManufacturerAgreement.posture from dispute_credit_cents and status; compound posture gates all child operations"
    trigger: "on any change to dispute_credit_cents (dispute resolve), on suspend/reinstate/terminate, on audit finding"
    algorithm: threshold
    formula: |
      if agreement.status == TERMINATED: posture := SUSPENDED
      elif agreement.status == SUSPENDED: posture := SUSPENDED
      elif dispute_credit_cents < POSTURE_ON_HOLD_DEBT_CENTS: posture := ON_HOLD
      else: posture := GOOD_STANDING
      # POSTURE_ON_HOLD_DEBT_CENTS is a NEGATIVE threshold (debt). Boundary:
      #   dispute_credit_cents == threshold -> ON_HOLD;  threshold + 1 -> GOOD_STANDING.
    input_set: "agreement.dispute_credit_cents, agreement.status"
    constants:
      POSTURE_ON_HOLD_DEBT_CENTS: -100000   # -$1,000.00 net debt triggers ON_HOLD
    precision: "integer cents"
    variants: []

  - name: sb_goal_attainment
    description: "Small-business subcontracting goal check per SalesReport"
    trigger: "on SalesReport finalize; on every invoice issue/void that changes totals"
    algorithm: threshold
    formula: |
      if total_sales_cents == 0:
        sb_goal_met := true       # zero-sales periods trivially meet the goal
      else:
        sb_goal_met := (total_sb_subcontract_cents >=
                        round_half_up(agreement.small_business_goal_pct * total_sales_cents))
      # Boundary: attainment == goal exactly -> MET; attainment == goal - 1 cent -> NOT MET.
    input_set: "SalesReport totals + agreement.small_business_goal_pct"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: audit_mfc_variance
    description: "Audit materiality: |disclosed - attested| triggers finding; combinatorial circular-looking evaluation with pinned order"
    trigger: "on ComplianceAudit open and on POST /audits/{id}/issue-finding"
    algorithm: aggregation
    formula: |
      # Evaluation order pinned to break apparent circularity:
      #   1) disclosed_total_cents := Σ FINALIZED SalesReport.total_sales_cents on agreement
      #      (DRAFT reports excluded — they are not yet attested)
      #   2) mfc_variance_cents := abs(disclosed_total_cents - audit.mfc_attestation_cents)
      #   3) finding allowed iff mfc_variance_cents > AUDIT_MATERIALITY_CENTS
      # The audit CANNOT modify disclosed_total_cents; FINALIZED reports are immutable.
      pass
    input_set: "FINALIZED SalesReport rows under agreement"
    constants:
      AUDIT_MATERIALITY_CENTS: 250000   # $2,500.00
    precision: "integer cents"
    variants: []

  - name: ceiling_consumption
    description: "Vehicle ceiling consumption per buyer tier; tiered against ceiling_cents"
    trigger: "on Order deliver (only point at which ceiling is enforced)"
    algorithm: threshold
    formula: |
      consumed := Σ order_total_cents over orders on this vehicle
                  with billing_status in {DELIVERED, INVOICED, PAID}
                  and compliance_status not in {CANCELLED, BLOCKED}
                  and buyer_tier == order.buyer_tier
      admit iff consumed + this_order.order_total_cents <= vehicle.ceiling_cents
      # Boundary: equality allowed. consumed + total == ceiling -> ADMIT.
      #           consumed + total == ceiling + 1 -> REJECT with ERR_VEHICLE_CEILING_EXCEEDED.
    input_set: "Vehicle's DELIVERED+ orders keyed by buyer_tier"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_MISSING_AUTH_HEADERS, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "X-User-Role is a declared role and permitted on this endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "every path-templated id resolves to an existing entity (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4,  category: existence,            check: "every body-referenced FK id resolves (vehicle_id, price_list_id, teaming_id, order_id, agreement_id)", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "all POST/PATCH with body FKs" }
  - { priority: 5,  category: state,                check: "target entity is in a state from which the requested transition is valid", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6,  category: state,                check: "OCC: expected_*_version matches parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "endpoints listed in §1.2.1" }
  - { priority: 7,  category: business_safety,      check: "manufacturer.status == ACTIVE for any new agreement activation or vehicle authorization", error_id: ERR_MANUFACTURER_INACTIVE, http_status: 422, applies_to: ["POST /agreements/{id}/activate", "POST /vehicles/{id}/authorize"] }
  - { priority: 8,  category: business_safety,      check: "agreement.posture == GOOD_STANDING gates order submit, vehicle authorize, teaming approve", error_id: ERR_AGREEMENT_NOT_GOOD_STANDING, http_status: 422, applies_to: ["POST /orders/{id}/submit", "POST /vehicles/{id}/authorize", "POST /teaming/{id}/approve"] }
  - { priority: 9,  category: business_safety,      check: "TAA origin: when vehicle.taa_required, every line origin must pass the vehicle's TAA variant", error_id: ERR_TAA_ORIGIN_VIOLATION, http_status: 422, applies_to: ["POST /orders/{id}/submit"] }
  - { priority: 10, category: business_constraint,  check: "MFC floor: offered <= floor(basis * (1 - mfc_discount_pct)); variant-aware per vehicle_kind", error_id: ERR_MFC_FLOOR_VIOLATION, http_status: 422, applies_to: ["POST /price-lists/{id}/activate", "POST /price-modifications/{id}/approve"] }
  - { priority: 11, category: business_constraint,  check: "scope containment: vehicle.buyer_tiers ⊆ agreement.scope_tiers; teaming scope SKUs ⊆ agreement.product_scope", error_id: ERR_SCOPE_VIOLATION, http_status: 422, applies_to: ["POST /vehicles", "POST /teaming", "POST /teaming/{id}/approve"] }
  - { priority: 12, category: business_temporal,    check: "logical clock within [effective_from, effective_to) for vehicle authorization and order submit", error_id: ERR_OUTSIDE_VEHICLE_WINDOW, http_status: 422, applies_to: ["POST /vehicles/{id}/authorize", "POST /orders/{id}/submit"] }
  - { priority: 13, category: business_temporal,    check: "price list period intersects vehicle window; period_from < period_to", error_id: ERR_INVALID_PRICE_PERIOD, http_status: 422, applies_to: ["POST /price-lists", "POST /price-lists/{id}/submit"] }
  - { priority: 14, category: business_referential, check: "order.price_list_id is the vehicle's currently ACTIVE list; pinned at creation", error_id: ERR_PRICE_LIST_NOT_ACTIVE, http_status: 422, applies_to: ["POST /orders"] }
  - { priority: 15, category: business_referential, check: "every order sku exists on pinned price list; qty > 0; line count 1..100", error_id: ERR_ORDER_LINE_INVALID, http_status: 422, applies_to: ["POST /orders"] }
  - { priority: 16, category: business_referential, check: "teaming (if present) is APPROVED and scope covers vehicle and all order skus", error_id: ERR_TEAMING_INELIGIBLE, http_status: 422, applies_to: ["POST /orders", "POST /orders/{id}/submit"] }
  - { priority: 17, category: business_fiscal,      check: "vehicle ceiling per buyer tier: consumed + new order_total <= ceiling_cents", error_id: ERR_VEHICLE_CEILING_EXCEEDED, http_status: 422, applies_to: ["POST /orders/{id}/deliver"] }
  - { priority: 18, category: business_fiscal,      check: "small-business goal: termination blocked when any FINALIZED SalesReport has sb_goal_met == false", error_id: ERR_SB_GOAL_NOT_MET, http_status: 422, applies_to: ["POST /agreements/{id}/terminate"] }
  - { priority: 19, category: business_fiscal,      check: "audit finding allowed only when mfc_variance_cents > AUDIT_MATERIALITY_CENTS", error_id: ERR_AUDIT_NOT_MATERIAL, http_status: 422, applies_to: ["POST /audits/{id}/issue-finding"] }
  - { priority: 20, category: business_constraint,  check: "segregation of duties: PriceModification approver X-User-ID != creator; ComplianceAudit finding issuer role == Auditor", error_id: ERR_SOD_VIOLATION, http_status: 422, applies_to: ["POST /price-modifications/{id}/approve", "POST /audits/{id}/issue-finding"] }
  - { priority: 21, category: business_constraint,  check: "uniqueness: Manufacturer.duns unique; (agreement_id, period_label) unique on SalesReport; at most one ACTIVE PriceList per vehicle", error_id: ERR_UNIQUENESS_VIOLATION, http_status: 409, applies_to: ["POST /manufacturers", "POST /sales-reports", "POST /price-lists/{id}/activate"] }
  - { priority: 22, category: business_temporal,    check: "sales report finalize only after period closed (logical clock past period end)", error_id: ERR_PERIOD_NOT_CLOSED, http_status: 422, applies_to: ["POST /sales-reports/{id}/finalize"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock (test-driving; mandatory default) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server logical clock. Server starts at exactly 2026-09-01T00:00:00Z; before any set call, every deadline/window/expiry rule reads this fixed instant. Never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy re-evaluation: vehicles past effective_to flip EXPIRED on next touch; invoices past due_at flip OVERDUE on next read/sweep"]

  # ---- manufacturers ----
  - method: POST
    path: "/manufacturers"
    description: "Register a manufacturer"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, duns, manufacturer_type, headquarters_country, "designated_countries?"]
    output: Manufacturer
    side_effects: ["uniqueness check on duns"]
  - method: GET
    path: "/manufacturers"
    description: "List manufacturers"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Manufacturer[]
    side_effects: []
  - method: GET
    path: "/manufacturers/{id}"
    description: "Fetch one manufacturer"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: []
    output: Manufacturer
    side_effects: []
  - method: POST
    path: "/manufacturers/{id}/suspend"
    description: "Suspend manufacturer (blocks new agreements; existing agreement posture unchanged)"
