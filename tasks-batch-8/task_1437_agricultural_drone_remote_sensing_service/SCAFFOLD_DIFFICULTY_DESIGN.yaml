              payload: { field_name: "F", legal_acres: 100, airspace_class: "D", insurance_policy_no: "POL-XS" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot N", part107_certificate_no: "P107-N", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/airspace-authorizations"
              payload: { field_id: "${field_id}", authorization_ref: "LAANC-X", max_altitude_ft: 400, effective_from: "2026-06-02T08:00:00Z", effective_until: "2026-06-02T11:00:00Z" }
              as: OpsAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
