            - "IN_PROGRESS cancel: CIAC ${cb_st} == REFUNDED with refunded ${cb_ref} == 45000 and forfeited ${cb_for} == 5000"
            - "Write-off landed: program expense_writeoff_cents ${writeoff} == 20000"

      - name: charge_reversal_state_errors
        claim_type: invalid_transition
        grounds: ["errors[ERR_CHARGE_ALREADY_REVERSED]", "errors[ERR_REVERSAL_NOT_ALLOWED]", state_machines.CostCharge.POSTED_to_REVERSED]
        distinguishing_aspect: "Reversing an already-REVERSED original fails with ERR_CHARGE_ALREADY_REVERSED; reversing the REVERSAL row itself fails with ERR_REVERSAL_NOT_ALLOWED."
        test_recipe:
          setup: ["CAPITAL work order started; one 30,000c MATERIAL charge posted and then reversed; period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-RERR", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Reversal errors", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 30000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg: $.data.id } }
            - { call: "POST /ucp/cost-charges/${chg}/reverse", payload: {}, as: FieldClerk, as_user_id: clerk-1, captures: { rev: $.data.id } }
          trigger:
            - { call: "POST /ucp/cost-charges/${chg}/reverse", payload: {}, as: FieldClerk, as_user_id: clerk-1, captures: { err1: $.data.error_id } }
            - { call: "POST /ucp/cost-charges/${rev}/reverse", payload: {}, as: FieldClerk, as_user_id: clerk-1, captures: { err2: $.data.error_id } }
          assert:
            - "Second reverse of the original: ${err1} == ERR_CHARGE_ALREADY_REVERSED"
            - "Reversing the reversal row: ${err2} == ERR_REVERSAL_NOT_ALLOWED"

      - name: period_reopen_guards
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_PERIOD_ALREADY_OPEN]", "errors[ERR_PERIOD_REOPEN_NOT_LATEST]", state_machines.AccountingPeriod.CLOSED_to_REOPENED]
        distinguishing_aspect: "Reopen is refused with ERR_PERIOD_ALREADY_OPEN while any period is OPEN, and with ERR_PERIOD_REOPEN_NOT_LATEST for a CLOSED period that is not the most recently created one; the latest closed period reopens successfully."
        test_recipe:
          setup: ["P1 2026-08 closed, P2 2026-09 closed, P3 2026-10 open"]
          setup_api_calls:
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { p1: $.data.id } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { err_create: $.data.error_id } }
            - { call: "POST /ucp/accounting-periods/${p1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { p2: $.data.id } }
            - { call: "POST /ucp/accounting-periods/${p2}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 10, start_date: "2026-10-01", end_date: "2026-10-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { p3: $.data.id } }
          trigger:
            - { call: "POST /ucp/accounting-periods/${p2}/reopen", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { err_open: $.data.error_id } }
            - { call: "POST /ucp/accounting-periods/${p3}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods/${p1}/reopen", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { err_latest: $.data.error_id } }
            - { call: "POST /ucp/accounting-periods/${p3}/reopen", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { p3_st: $.data.status } }
          assert:
            - "Create while P1 OPEN: ${err_create} == ERR_PERIOD_ALREADY_OPEN"
            - "Reopen P2 while P3 OPEN: ${err_open} == ERR_PERIOD_ALREADY_OPEN"
            - "Reopen P1 when P3 is the latest CLOSED: ${err_latest} == ERR_PERIOD_REOPEN_NOT_LATEST"
            - "Reopen latest closed P3 succeeds: status ${p3_st} == REOPENED"

      - name: regulatory_asset_reject_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RegulatoryAsset.PROPOSED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A rejected regulatory asset is terminal: approving it afterwards fails with ERR_INVALID_STATE, and its remaining_cents never amortizes."
