      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: allocated_qty, type: integer, source: input, description: "Seasonal/exclusive units allocated to this store", constraints: ">= 1" }
      - { name: committed_qty, type: integer, source: computed, description: "Units committed to fulfilled orders and converted special orders", constraints: ">= 0" }
      - { name: released_qty, type: integer, source: computed, description: "Units released back from cancellations", constraints: ">= 0" }
      - { name: available_alloc_qty, type: integer, source: computed, description: "allocated_qty - committed_qty", constraints: ">= 0" }
      - { name: season_start, type: datetime, source: input, description: "Allocation window start (inclusive)" }
      - { name: season_end, type: datetime, source: input, description: "Allocation window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | RELEASED", default: ACTIVE }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Customer
