scenario: |
  Generate task harder than expert level!

  2615. Writers Room Staffing & Script Development (scripted television production): staffing season
  timing with availability windows, level requirements and diversity program participation, writer
  level determination with minimum compensation, script fees and episodic guarantees under the guild
  agreement, room configuration decisions across in-person, remote and mini-room formats with duration
  commitments, script assignment, outline and draft milestone schedule with delivery deadlines tied to
  production start, script coverage of production needs with number of ready scripts before shooting
  begins, credit determination submissions and arbitration under guild rules, script clearance for
  names, trademarks and depictions with legal review, rewrite assignments, production polish and
  showrunner approval workflow

domain_name: writers-room-staffing-script-development
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Writer <-> WritersRoom is a many-to-many via RoomSeat; Writer <-> Episode is a many-to-many via
  # ScriptAssignment and (independently) via CreditSubmission; ScriptAssignment is self-referential
  # through predecessor_assignment_id (rewrite/polish chains). No single ownership tree exists: an
  # Episode's script state depends on RoomSeat state in a sibling subtree (WritersRoom), and a
  # CreditArbitration panel references Writers that are not descendants of the Episode.

  state_machine_shape: cyclic
  # ScriptAssignment cycles DRAFTING -> DELIVERED -> IN_NOTES -> DRAFTING with a revision_round
  # counter and a guild revision cap; Episode carries two independent state dimensions
  # (script_readiness x credit_status); CreditArbitration forks DETERMINED vs DEADLOCKED with
  # divergent side-effect sets; ClearanceReview.posture is compound over ClearanceItem decisions.

  relationship_patterns:
    - one_to_many          # Season -> WritersRoom, Season -> Episode, ScriptAssignment -> Milestone
    - many_to_many         # Writer <-> WritersRoom via RoomSeat; Writer <-> Episode via ScriptAssignment
    - self_referential     # ScriptAssignment.predecessor_assignment_id -> ScriptAssignment.id
    - cross_aggregate      # ScriptAssignment.room_seat_id crosses the Episode aggregate into the Room aggregate
    - polymorphic: false

  role_model: segregation_of_duties
  # A Showrunner may not approve a draft they authored (StudioExecutive must); an arbitration panel
  # member may not be a participating writer on the episode under arbitration.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 61 endpoints / 80 error codes / 14 calculations (2 dual-variant-bearing) /
  # 9 state machines (1 cyclic, 2 parallel dimensions of Episode, 1 fork-join, 1 compound) /
  # 4 OCC rules / 38 validation rules.

entities:
  - name: GuildAgreement
    parent: null
    common_fields: true
    fields:
      - name: mba_year
        type: integer
        source: input
        description: Guild minimum basic agreement year this rate card belongs to.
        constraints: 2020..2035; unique across GuildAgreement rows
      - name: min_weekly_cents_by_level
        type: object
        source: input
        description: >-
          Minimum weekly compensation in cents keyed by writer level. Keys MUST be exactly
          {STAFF_WRITER, STORY_EDITOR, EXEC_STORY_EDITOR, CO_PRODUCER, PRODUCER}.
        constraints: every value integer >= 1; all five keys required
      - name: script_fee_cents_by_length
        type: object
        source: input
        description: >-
          Base script fee in cents keyed by episode length format. Keys MUST be exactly
          {HALF_HOUR, ONE_HOUR}.
        constraints: every value integer >= 1; both keys required
      - name: type_share_pct_by_assignment_type
        type: object
        source: input
        description: >-
          Share of the base script fee earned by each assignment type. Keys MUST be exactly
          {STORY, TELEPLAY, STORY_AND_TELEPLAY, REWRITE, PRODUCTION_POLISH}.
        constraints: values are numbers in (0, 1]; all five keys required
      - name: guarantee_offset_pct_by_level
        type: object
        source: input
        description: >-
          Fraction of a script fee absorbed by the writer's episodic guarantee when a guarantee slot
          is applied, keyed by the level recorded on the writer's RoomSeat. Keys MUST be exactly
          {STAFF_WRITER, STORY_EDITOR, EXEC_STORY_EDITOR, CO_PRODUCER, PRODUCER}.
        constraints: values are numbers in [0, 1]; all five keys required
      - name: level_credit_thresholds
        type: object
        source: input
        description: >-
          Minimum Writer.career_episodic_credits required to be determined at each level above
          STAFF_WRITER. Keys MUST be exactly {STORY_EDITOR, EXEC_STORY_EDITOR, CO_PRODUCER, PRODUCER}
          and values MUST be strictly increasing in that key order.
        constraints: integers >= 1, strictly increasing
      - name: diversity_subsidy_pct
        type: number
        source: input
        description: Fraction of a diversity-program-funded seat's weekly compensation paid by the program.
        default: 0.5
        constraints: 0 < value <= 1
      - name: diversity_subsidy_cap_weekly_cents
        type: integer
        source: input
        description: Hard weekly ceiling in cents on the diversity program subsidy for one seat.
        constraints: integer >= 1
      - name: mini_room_floor_multiplier
        type: number
        source: input
        description: Multiplier applied to the level minimum when the room format is MINI_ROOM.
        default: 1.2
        constraints: value >= 1
      - name: short_commitment_weeks_threshold
        type: integer
        source: input
        description: >-
          Room duration_weeks_committed strictly below this value counts as a short commitment and
          attracts short_commitment_uplift_pct on the weekly floor.
        default: 20
        constraints: integer >= 1
      - name: short_commitment_uplift_pct
        type: number
        source: input
        description: Uplift fraction added to the weekly floor for short-commitment rooms.
        default: 0.1
        constraints: 0 <= value <= 1
      - name: facility_fee_tiers
        type: object
        source: input
        description: >-
          Weekly facility fee in cents keyed by tier. Keys MUST be exactly {TIER_1, TIER_2, TIER_3}.
        constraints: integers >= 0; all three keys required
      - name: facility_tier_subtotal_bounds
        type: object
        source: input
        description: >-
          Inclusive upper bounds in cents on the room seat subtotal for TIER_1 and TIER_2 selection.
          Keys MUST be exactly {TIER_1_MAX, TIER_2_MAX} with TIER_1_MAX < TIER_2_MAX.
        constraints: integers >= 1; TIER_1_MAX < TIER_2_MAX
      - name: format_surcharge_pct
        type: object
        source: input
        description: >-
          Fraction of the selected facility fee charged for each room format. Keys MUST be exactly
          {IN_PERSON, REMOTE, MINI_ROOM}.
        constraints: values are numbers in [0, 1]; all three keys required
      - name: max_free_revision_rounds
        type: integer
        source: input
        description: >-
          Number of revision rounds (IN_NOTES -> DRAFTING loops) a writer owes without an additional
          rewrite fee on a single ScriptAssignment.
        default: 2
        constraints: integer >= 0
      - name: credit_share_threshold_pct
        type: integer
        source: input
        description: >-
          Minimum final credit share percentage (inclusive) at which a writer receives on-screen
          credit.
        default: 33
        constraints: 1..100
      - name: arbitration_concurrence_pct
        type: number
        source: input
        description: >-
          Minimum fraction of the arbitration panel that must land within
          arbitration_concurrence_band_pct of the panel mean for a determination to stand.
        default: 0.667
        constraints: 0 < value <= 1
      - name: arbitration_concurrence_band_pct
        type: integer
        source: input
        description: >-
          Absolute percentage-point band around the panel mean share of the leading writer inside
          which an arbiter's vote counts as concurring.
        default: 10
        constraints: 1..100
      - name: outline_lead_days
        type: integer
        source: input
        description: Days before Episode.production_start_date that the OUTLINE milestone is due.
        constraints: integer >= 1
      - name: first_draft_lead_days
        type: integer
        source: input
        description: Days before Episode.production_start_date that the FIRST_DRAFT milestone is due.
        constraints: integer >= 1; < outline_lead_days
      - name: second_draft_lead_days
        type: integer
        source: input
        description: Days before Episode.production_start_date that the SECOND_DRAFT milestone is due.
        constraints: integer >= 1; < first_draft_lead_days
      - name: polish_lead_days
        type: integer
        source: input
        description: Days before Episode.production_start_date that the PRODUCTION_POLISH milestone is due.
        constraints: integer >= 1; < second_draft_lead_days
      - name: turnaround_buffer_days
        type: integer
        source: input
        description: >-
          Buffer in days added on both sides of an Episode shoot window when testing production-unit
          collisions.
        default: 2
        constraints: integer >= 0
      - name: clearance_item_weights
        type: object
        source: input
        description: >-
          Risk weight per clearance item type. Keys MUST be exactly {NAME, TRADEMARK, DEPICTION}.
        constraints: integers >= 1; all three keys required
      - name: clearance_escalation_score
        type: integer
        source: input
        description: >-
          ClearanceReview.risk_score strictly above this value escalates the review to ESCALATED
          instead of CONDITIONAL.
        default: 30
        constraints: integer >= 0

  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: guild_agreement_id
        type: string
        source: input
        description: FK -> GuildAgreement.id; the rate card every fee and minimum on this season resolves against.
        constraints: must reference an existing GuildAgreement
      - name: showrunner_writer_id
        type: string
        source: input
        description: FK -> Writer.id; the only Writer whose X-User-ID may act with role Showrunner on this season's episodes.
        constraints: must reference an existing Writer with is_showrunner_eligible == true
      - name: title
        type: string
        source: input
        description: Series/season title.
        constraints: 1..200 chars
      - name: episode_order
        type: integer
        source: input
        description: Number of episodes ordered for the season.
        constraints: 1..30
      - name: length_format
        type: enum
        source: input
        description: Default episode length format for the season.
        constraints: one of {HALF_HOUR, ONE_HOUR}
      - name: production_start_date
        type: datetime
        source: input
        description: >-
          UTC date-time at which principal photography for the season begins. Mutated only by
          POST /seasons/{season_id}/reschedule, which shifts every child Episode by the same delta.
        constraints: ISO 8601 UTC; must be strictly after staffing_window_end
      - name: staffing_window_start
        type: datetime
        source: input
        description: Inclusive UTC start of the window during which RoomSeat offers may start.
        constraints: ISO 8601 UTC
      - name: staffing_window_end
        type: datetime
        source: input
        description: Inclusive UTC end of the window during which RoomSeat offers may start.
        constraints: ISO 8601 UTC; must be >= staffing_window_start
      - name: ready_script_target
        type: integer
        source: input
        description: >-
          Number of ready scripts the season must be able to count before any Episode may be locked
          for production.
        constraints: 1..30
      - name: guarantee_application_mode
        type: enum
        source: input
        description: >-
          Selects which episodic-guarantee settlement variant this season uses; see calculation
          guarantee_settlement.
        default: CHRONOLOGICAL_ON_ACCEPTANCE
        constraints: one of {FORWARD_COMMIT, CHRONOLOGICAL_ON_ACCEPTANCE}
      - name: staffing_budget_weekly_cents
        type: integer
        source: input
        description: Ceiling in cents on the sum of all room weekly burns for this season.
        constraints: integer >= 0
      - name: script_fee_budget_cents
        type: integer
        source: input
        description: Ceiling in cents on script_fee_committed_cents.
        constraints: integer >= 0
      - name: staffing_commitment_weekly_cents
        type: integer
        source: computed
        description: >-
          Sum of WritersRoom.weekly_burn_cents over rooms of this season whose status IN
          {STAFFING, ACTIVE}. Recomputed by calculation season_staffing_commitment.
        default: 0
      - name: script_fee_committed_cents
        type: integer
        source: computed
        description: >-
          Signed sum of FeeLedgerEntry.amount_cents over entries whose season_id == this Season.id.
          Conserved quantity of invariant fee_ledger_conservation.
        default: 0
      - name: ready_script_count
        type: integer
        source: computed
        description: >-
          Count of this season's Episodes with script_readiness IN {READY, LOCKED} AND
          clearance_posture IN {CLEARED, CONDITIONAL_WAIVED}. See calculation script_coverage_index.
        default: 0
      - name: coverage_posture
        type: enum
        source: computed
        description: >-
          Derived from coverage_gap by calculation script_coverage_index; gates
          POST /episodes/{episode_id}/lock-for-production.
        default: CRITICAL
        constraints: one of {COVERED, AT_RISK, CRITICAL}
      - name: coverage_gap
        type: integer
        source: computed
        description: max(0, ready_script_target - ready_script_count).
        default: 0

  - name: Writer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Writer's legal name as it appears on guild paperwork.
        constraints: 1..200 chars
      - name: guild_member_id
        type: string
        source: input
        description: Guild membership number; uniqueness is enforced across all Writer rows.
        constraints: 1..40 chars; unique
      - name: career_episodic_credits
        type: integer
        source: input
        description: >-
          Career count of produced episodic credits at Writer creation time; afterwards mutated only
          by POST /writers/{writer_id}/credit-history.
        default: 0
        constraints: integer >= 0
      - name: diversity_program_participant
        type: boolean
        source: input
        description: >-
          True when the writer is enrolled in a guild/studio diversity staffing program; required for
          a RoomSeat to be diversity_program_funded.
        default: false
      - name: is_showrunner_eligible
        type: boolean
        source: input
        description: True when the writer may be named as a Season.showrunner_writer_id.
        default: false
      - name: determined_level
        type: enum
        source: computed
        description: >-
          Level derived from career_episodic_credits against GuildAgreement.level_credit_thresholds by
          calculation writer_level_determination. Recomputed on every credit-history award.
        default: STAFF_WRITER
        constraints: one of {STAFF_WRITER, STORY_EDITOR, EXEC_STORY_EDITOR, CO_PRODUCER, PRODUCER}
      - name: level_determination_agreement_id
        type: string
        source: computed
        description: >-
          GuildAgreement.id whose level_credit_thresholds produced the current determined_level
          (the agreement supplied to the last credit-history award); null before the first award.
      - name: active_seat_count
        type: integer
        source: computed
        description: Count of this writer's RoomSeats with status IN {OFFERED, CONFIRMED}.
        default: 0
      - name: on_screen_credit_count
        type: integer
        source: computed
        description: >-
          Count of CreditSubmissions of this writer with receives_credit == true; incremented only by
          arbitration determination side effects.
        default: 0

  - name: AvailabilityWindow
    parent: Writer
    common_fields: true
    fields:
      - name: writer_id
        type: string
        source: input
        description: FK -> Writer.id; owner of this availability window.
        constraints: must reference an existing Writer
      - name: start_date
        type: datetime
        source: input
        description: Inclusive UTC start of the window; window interval semantics are half-open [start_date, end_date).
        constraints: ISO 8601 UTC
      - name: end_date
        type: datetime
        source: input
        description: Exclusive UTC end of the window.
        constraints: ISO 8601 UTC; must be strictly after start_date
      - name: commitment_type
        type: enum
        source: input
        description: >-
          EXCLUSIVE windows may back at most one occupying RoomSeat interval at a time;
          NON_EXCLUSIVE windows may back overlapping seats.
        constraints: one of {EXCLUSIVE, NON_EXCLUSIVE}
      - name: status
        type: enum
        source: computed
        description: >-
          OPEN until a RoomSeat acceptance consumes it, CONSUMED afterwards; returns to OPEN when the
          consuming seat is released.
        default: OPEN
        constraints: one of {OPEN, CONSUMED}
      - name: consumed_by_seat_id
        type: string
        source: computed
        description: FK -> RoomSeat.id; the CONFIRMED seat currently consuming this window, null while status == OPEN.

  - name: WritersRoom
    parent: Season
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season this room staffs.
        constraints: must reference an existing Season
      - name: name
        type: string
        source: input
        description: Room label, e.g. "Main Room" or "Mini Room B".
        constraints: 1..120 chars
      - name: format
        type: enum
        source: input
        description: >-
          Room configuration. Mutated only by POST /rooms/{room_id}/reconfigure, which re-derives every
          CONFIRMED seat's compensation and this room's weekly burn.
        constraints: one of {IN_PERSON, REMOTE, MINI_ROOM}
      - name: seat_capacity
        type: integer
        source: input
        description: >-
          Total seats this room may hold. Conserved quantity of invariant seat_capacity_conservation.
          MINI_ROOM format caps this at MINI_ROOM_MAX_SEATS (4).
        constraints: 1..12
      - name: duration_weeks_committed
        type: integer
        source: input
        description: >-
          Number of weeks the studio commits the room for. Feeds the short-commitment uplift in
          calculation seat_weekly_compensation and the proration in seat_prorated_commitment.
        constraints: 1..52
      - name: start_date
        type: datetime
        source: input
        description: Inclusive UTC start of the room's operating interval.
        constraints: ISO 8601 UTC; must be within [Season.staffing_window_start, Season.production_start_date]
      - name: end_date
        type: datetime
        source: input
        description: Exclusive UTC end of the room's operating interval; interval semantics are half-open.
        constraints: ISO 8601 UTC; strictly after start_date
      - name: diversity_seats_required
        type: integer
        source: input
        description: >-
          Minimum number of CONFIRMED seats with diversity_program_funded == true required before the
          room may be activated.
        default: 0
        constraints: 0..seat_capacity
      - name: status
        type: enum
        source: computed
        description: >-
          Room lifecycle posture; gates all seat operations. See state machine WritersRoom.
        default: OPEN
        constraints: one of {OPEN, STAFFING, ACTIVE, WRAPPED}
      - name: filled_seat_count
        type: integer
        source: computed
        description: Count of this room's RoomSeats with status IN {OFFERED, CONFIRMED}.
        default: 0
      - name: confirmed_seat_count
        type: integer
        source: computed
        description: Count of this room's RoomSeats with status == CONFIRMED.
        default: 0
      - name: open_seat_count
        type: integer
        source: computed
        description: seat_capacity - filled_seat_count.
        default: 0
      - name: confirmed_diversity_seat_count
        type: integer
        source: computed
        description: Count of this room's RoomSeats with status == CONFIRMED AND diversity_program_funded == true.
        default: 0
      - name: seat_subtotal_weekly_cents
        type: integer
        source: computed
        description: >-
          Sum of RoomSeat.weekly_compensation_cents over this room's seats with status == CONFIRMED.
          Evaluation step 1 of calculation room_weekly_burn.
        default: 0
      - name: facility_tier
        type: enum
        source: computed
        description: >-
          Tier selected from seat_subtotal_weekly_cents (NOT from weekly_burn_cents) per calculation
          room_weekly_burn step 2.
        default: TIER_1
        constraints: one of {TIER_1, TIER_2, TIER_3}
      - name: facility_surcharge_weekly_cents
        type: integer
        source: computed
        description: Rounded format surcharge on the tier's facility fee; step 3 of room_weekly_burn.
        default: 0
      - name: weekly_burn_cents
        type: integer
        source: computed
        description: seat_subtotal_weekly_cents + facility_surcharge_weekly_cents; step 4 of room_weekly_burn.
        default: 0

  - name: RoomSeat
    parent: WritersRoom
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: FK -> WritersRoom.id; the room this seat belongs to.
        constraints: must reference an existing WritersRoom
      - name: writer_id
        type: string
        source: input
        description: FK -> Writer.id; the writer offered this seat.
        constraints: must reference an existing Writer
      - name: level_at_hire
        type: enum
        source: input
        description: >-
          Level the seat is written at; must be <= Writer.determined_level in the level order
          [STAFF_WRITER, STORY_EDITOR, EXEC_STORY_EDITOR, CO_PRODUCER, PRODUCER] unless the seat is
          diversity_program_funded, which permits exactly one level above determined_level.
        constraints: one of {STAFF_WRITER, STORY_EDITOR, EXEC_STORY_EDITOR, CO_PRODUCER, PRODUCER}
      - name: offered_weekly_compensation_cents
        type: integer
        source: input
        description: Weekly compensation the studio offers, before the guild floor is applied.
        constraints: integer >= 1
      - name: exclusivity
        type: enum
        source: input
        description: >-
          EXCLUSIVE seats collide with any other OFFERED/CONFIRMED seat of the same writer whose
          half-open interval overlaps; NON_EXCLUSIVE seats do not.
        constraints: one of {EXCLUSIVE, NON_EXCLUSIVE}
      - name: start_date
        type: datetime
        source: input
        description: >-
          Inclusive UTC start of the seat's occupation of the writer; seat interval semantics are
          half-open [start_date, end_date) so touching endpoints do not collide.
        constraints: ISO 8601 UTC; must fall inside [Season.staffing_window_start, Season.staffing_window_end]
      - name: end_date
        type: datetime
        source: input
        description: Exclusive UTC end of the seat's occupation of the writer.
        constraints: ISO 8601 UTC; strictly after start_date
      - name: episodic_guarantee_count
        type: integer
        source: input
        description: >-
          Number of episode script assignments guaranteed to this writer under the seat. Conserved
          quantity of invariant guarantee_slot_conservation.
        default: 0
        constraints: 0..30
      - name: diversity_program_funded
        type: boolean
        source: input
        description: >-
          True when the diversity program subsidises this seat; requires
          Writer.diversity_program_participant == true.
        default: false
      - name: weekly_compensation_cents
        type: integer
        source: computed
        description: >-
          max(offered_weekly_compensation_cents, guild floor) per calculation
          seat_weekly_compensation; re-derived on room reconfigure.
        default: 0
      - name: guild_floor_weekly_cents
        type: integer
        source: computed
        description: The rounded level minimum after format multiplier and short-commitment uplift.
        default: 0
      - name: diversity_subsidy_weekly_cents
        type: integer
        source: computed
        description: Weekly subsidy paid by the diversity program; 0 when the seat is not program funded.
        default: 0
      - name: studio_charge_weekly_cents
        type: integer
        source: computed
        description: weekly_compensation_cents - diversity_subsidy_weekly_cents.
        default: 0
      - name: prorated_commitment_cents
        type: integer
        source: computed
        description: >-
          Total studio commitment across the seat interval per calculation
          seat_prorated_commitment (whole weeks at the weekly rate plus residual days at the rounded
          daily rate).
        default: 0
      - name: guarantee_slots_consumed
        type: integer
        source: computed
        description: Count of non-VOID ScriptAssignments of this seat with guarantee_slot_applied == true.
        default: 0
      - name: guarantee_slots_remaining
        type: integer
        source: computed
        description: episodic_guarantee_count - guarantee_slots_consumed.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Seat lifecycle; see state machine RoomSeat.
        default: OFFERED
        constraints: one of {OFFERED, CONFIRMED, DECLINED, WITHDRAWN, RELEASED}
      - name: confirmed_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the writer accepted the seat; null until CONFIRMED.
      - name: consumed_window_id
        type: string
        source: computed
        description: FK -> AvailabilityWindow.id; the window this seat consumed on acceptance, null otherwise.

  - name: Episode
    parent: Season
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season this episode belongs to.
        constraints: must reference an existing Season
      - name: episode_number
        type: integer
        source: input
        description: 1-based episode number; unique within the season.
        constraints: 1..Season.episode_order; unique per (season_id, episode_number)
      - name: length_format
        type: enum
        source: input
        description: Length format of this episode, which selects the base script fee.
        constraints: one of {HALF_HOUR, ONE_HOUR}
      - name: production_unit
        type: enum
        source: input
        description: >-
          Shooting unit that will photograph the episode; shoot windows may not collide within one
          unit of one season.
        constraints: one of {UNIT_A, UNIT_B}
      - name: production_start_date
        type: datetime
        source: input
        description: >-
          Inclusive UTC first day of photography for this episode; the shoot window is the CLOSED
          interval [production_start_date, production_start_date + shoot_days - 1 day]. Shifted by the
          same delta as Season.production_start_date on reschedule.
        constraints: ISO 8601 UTC; must be >= Season.production_start_date
      - name: shoot_days
        type: integer
        source: input
        description: Number of shooting days in this episode's closed shoot window.
        default: 8
        constraints: 1..30
      - name: script_readiness
        type: enum
        source: computed
        description: >-
          First of two independent state dimensions on Episode; tracks script development only. See
          state machine Episode.script_readiness.
        default: NOT_STARTED
        constraints: one of {NOT_STARTED, IN_PROGRESS, READY, LOCKED}
      - name: credit_status
        type: enum
        source: computed
        description: >-
          Second, independent state dimension on Episode; tracks credit determination only. See state
          machine Episode.credit_status.
        default: PENDING
        constraints: one of {PENDING, SUBMISSIONS_OPEN, SUBMISSIONS_CLOSED, IN_ARBITRATION, DETERMINED}
      - name: clearance_posture
        type: enum
        source: computed
        description: >-
          Mirror of the posture of the ClearanceReview attached to the episode's
          approved_teleplay_assignment_id, or PENDING when no such review exists.
        default: PENDING
        constraints: one of {PENDING, CLEARED, CONDITIONAL, CONDITIONAL_WAIVED, ESCALATED, BLOCKED}
      - name: approved_teleplay_assignment_id
        type: string
        source: computed
        description: >-
          Id of the single ScriptAssignment of this episode with status == APPROVED and
          assignment_type IN {TELEPLAY, STORY_AND_TELEPLAY}; null until such an approval exists.
      - name: provisional_credit_shares
        type: object
        source: computed
        description: >-
          Map of Writer.id -> integer share percentage produced by variant provisional_normalized of
          calculation credit_share_determination at submission close; empty object before close.
        default: {}
      - name: final_credit_shares
        type: object
        source: computed
        description: >-
          Map of Writer.id -> integer share percentage produced by variant arbitrated_panel_mean of
          calculation credit_share_determination on arbitration determination; empty until DETERMINED.
        default: {}
      - name: determined_credit_string
        type: string
        source: computed
        description: >-
          On-screen credit string assembled from final_credit_shares; null until credit_status ==
          DETERMINED.
      - name: locked_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the episode was locked for production; null otherwise.

  - name: ScriptAssignment
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: FK -> Episode.id; the episode whose script this assignment covers.
        constraints: must reference an existing Episode
      - name: writer_id
        type: string
        source: input
        description: FK -> Writer.id; the writer assigned the work.
        constraints: must reference an existing Writer
      - name: room_seat_id
        type: string
        source: computed
        description: >-
          FK -> RoomSeat.id; resolved at creation as the writer's RoomSeat with status == CONFIRMED in
          a WritersRoom of this episode's season whose status == ACTIVE. Eligibility filter: seats of
          writer_id with status == CONFIRMED AND room.season_id == episode.season_id AND room.status ==
          ACTIVE. Ranking: seat.confirmed_at ASC; tie-break: seat.created_at ASC. Empty candidate set
          is rejected with ERR_WRITER_NOT_STAFFED (no freelance path exists in this scaffold).
      - name: predecessor_assignment_id
        type: string
        source: input
        description: >-
          FK -> ScriptAssignment.id; required for assignment_type IN {REWRITE, PRODUCTION_POLISH} and
          forbidden otherwise. Must belong to the same episode and have status == APPROVED.
        default: null
      - name: assignment_type
        type: enum
        source: input
        description: Kind of writing service this assignment covers; selects the fee share.
        constraints: one of {STORY, TELEPLAY, STORY_AND_TELEPLAY, REWRITE, PRODUCTION_POLISH}
      - name: gross_fee_cents
        type: integer
        source: computed
        description: >-
          round_half_up(base script fee x type share) per calculation script_fee_derivation; base is
          GuildAgreement.script_fee_cents_by_length[Episode.length_format].
        default: 0
      - name: guarantee_slot_applied
        type: boolean
        source: computed
        description: >-
          True when an episodic guarantee slot of room_seat_id was allocated to this assignment by
          calculation guarantee_settlement.
        default: false
      - name: guarantee_offset_cents
        type: integer
        source: computed
        description: round_half_up(gross_fee_cents x offset pct) when guarantee_slot_applied, else 0.
        default: 0
      - name: payable_fee_cents
        type: integer
        source: computed
        description: gross_fee_cents - guarantee_offset_cents.
        default: 0
      - name: revision_round
        type: integer
        source: computed
        description: >-
          Number of completed IN_NOTES -> DRAFTING loops on this assignment. Rounds strictly greater
          than GuildAgreement.max_free_revision_rounds are rejected with ERR_REVISION_CAP_EXCEEDED.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle; cyclic. See state machine ScriptAssignment.
        default: DRAFTING
        constraints: one of {DRAFTING, DELIVERED, IN_NOTES, APPROVED, REASSIGNMENT_PENDING, VOID}
      - name: outline_due_date
        type: datetime
        source: computed
        description: >-
          Episode.production_start_date - GuildAgreement.outline_lead_days, stamped at 23:59:59.999Z
          of the resulting UTC date. Re-derived by calculation milestone_schedule_derivation.
      - name: first_draft_due_date
        type: datetime
        source: computed
        description: Episode.production_start_date - first_draft_lead_days at 23:59:59.999Z.
      - name: second_draft_due_date
        type: datetime
        source: computed
        description: Episode.production_start_date - second_draft_lead_days at 23:59:59.999Z.
      - name: polish_due_date
        type: datetime
        source: computed
        description: Episode.production_start_date - polish_lead_days at 23:59:59.999Z.
      - name: late_milestone_count
        type: integer
        source: computed
        description: >-
          Count of this assignment's Milestones with status == LATE, or with status IN
          {DELIVERED, NOTES_ISSUED, ACCEPTED} AND days_late > 0.
        default: 0
      - name: approved_at
        type: datetime
        source: computed
        description: >-
          Logical-clock instant of the DELIVERED -> APPROVED transition; null until approved. Sole
          ordering key of the CHRONOLOGICAL_ON_ACCEPTANCE variant of calculation guarantee_settlement.
      - name: approved_by_role
        type: enum
        source: computed
        description: >-
          Role that performed the approval; null until status == APPROVED. Records which side of the
          segregation-of-duties rule executed the approval.
        constraints: one of {SHOWRUNNER, STUDIO_EXECUTIVE} or null

  - name: Milestone
    parent: ScriptAssignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: FK -> ScriptAssignment.id; the assignment this milestone belongs to.
        constraints: must reference an existing ScriptAssignment
      - name: milestone_type
        type: enum
        source: system
        description: >-
          Milestone kind. Synthesized by the assignment-create side effect: STORY assignments get
          {OUTLINE}; TELEPLAY and STORY_AND_TELEPLAY get {OUTLINE, FIRST_DRAFT, SECOND_DRAFT}; REWRITE
          gets {FIRST_DRAFT}; PRODUCTION_POLISH gets {PRODUCTION_POLISH}.
        constraints: one of {OUTLINE, FIRST_DRAFT, SECOND_DRAFT, PRODUCTION_POLISH}
      - name: sequence_index
        type: integer
        source: system
        description: 1-based position of this milestone inside its assignment's milestone chain.
        constraints: integer >= 1
      - name: due_date
        type: datetime
        source: computed
        description: >-
          Copied from the matching due-date field of the parent assignment by calculation
          milestone_schedule_derivation; re-derived when the season is rescheduled.
      - name: delivered_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent delivery; null while never delivered.
      - name: days_late
        type: integer
        source: computed
        description: >-
          max(0, UTC calendar date of delivered_at - UTC calendar date of due_date) in whole days,
          frozen at the moment of delivery.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Milestone lifecycle; see state machine Milestone.
        default: PENDING
        constraints: one of {PENDING, LATE, DELIVERED, NOTES_ISSUED, ACCEPTED}

  - name: ClearanceReview
    parent: ScriptAssignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: FK -> ScriptAssignment.id; the assignment whose draft is under legal review.
        constraints: must reference an existing ScriptAssignment
      - name: reviewed_draft_milestone_id
        type: string
        source: input
        description: >-
          FK -> Milestone.id; the delivered draft milestone under review. Must belong to
          assignment_id and have status IN {DELIVERED, NOTES_ISSUED, ACCEPTED}.
        constraints: must reference an existing Milestone of the same assignment
      - name: item_count
        type: integer
        source: computed
        description: Count of ClearanceItems whose review_id == this review.
        default: 0
      - name: decided_item_count
        type: integer
        source: computed
        description: Count of this review's ClearanceItems with decision IN {CLEARED, CONDITIONAL, BLOCKED}.
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: >-
          Capped weighted risk total over decided items per calculation clearance_risk_score.
        default: 0
      - name: posture
        type: enum
        source: computed
        description: >-
          Compound posture derived from this review's ClearanceItem decisions; see state machine
          ClearanceReview.
        default: PENDING
        constraints: one of {PENDING, CLEARED, CONDITIONAL, CONDITIONAL_WAIVED, ESCALATED, BLOCKED}
      - name: legal_waiver_granted
        type: boolean
        source: computed
        description: >-
          True once LegalCounsel grants a waiver on a CONDITIONAL review, which moves posture to
          CONDITIONAL_WAIVED and makes the episode countable as a ready script.
        default: false
      - name: waiver_memo
        type: string
        source: computed
        description: Free-text legal memo captured with the waiver; null when no waiver exists.

  - name: ClearanceItem
    parent: ClearanceReview
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: FK -> ClearanceReview.id; the review this item was raised under.
        constraints: must reference an existing ClearanceReview
      - name: item_type
        type: enum
        source: input
        description: Category of clearance exposure; selects the risk weight.
        constraints: one of {NAME, TRADEMARK, DEPICTION}
      - name: descriptor
        type: string
        source: input
        description: The name, trademark or depiction being cleared, e.g. "MERIDIAN COLA".
        constraints: 1..200 chars
      - name: scene_reference
        type: string
        source: input
        description: Script scene reference where the exposure occurs, e.g. "Act 2 / Sc 14".
        constraints: 1..80 chars
      - name: decision
        type: enum
        source: computed
        description: Legal decision on this item; see state machine ClearanceItem.
        default: SUBMITTED
        constraints: one of {SUBMITTED, CLEARED, CONDITIONAL, BLOCKED}
      - name: risk_weight
        type: integer
        source: computed
        description: >-
          GuildAgreement.clearance_item_weights[item_type] x decision multiplier
          (CLEARED 0, CONDITIONAL 1, BLOCKED 4); 0 while decision == SUBMITTED.
        default: 0
      - name: conditional_note
        type: string
        source: computed
        description: Condition attached to a CONDITIONAL decision; null for other decisions.

  - name: CreditSubmission
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: FK -> Episode.id; the episode whose credit is claimed.
        constraints: must reference an existing Episode
      - name: writer_id
        type: string
        source: input
        description: FK -> Writer.id; the claiming writer, which MUST equal the acting X-User-ID.
        constraints: must reference an existing Writer; unique per (episode_id, writer_id)
      - name: claim_basis
        type: enum
        source: input
        description: Credit form claimed under guild rules.
        constraints: one of {WRITTEN_BY, STORY_BY, TELEPLAY_BY}
      - name: claimed_contribution_pct
        type: integer
        source: input
        description: Percentage of the script the writer claims to have authored.
        constraints: 1..100
      - name: status
        type: enum
        source: computed
        description: >-
          SUBMITTED until the episode's submissions close, then ELIGIBLE or INELIGIBLE per the
          eligibility filter of calculation credit_share_determination.
        default: SUBMITTED
        constraints: one of {SUBMITTED, ELIGIBLE, INELIGIBLE}
      - name: provisional_share_pct
        type: integer
        source: computed
        description: Share assigned by variant provisional_normalized at submission close.
        default: 0
      - name: arbitrated_share_pct
        type: integer
        source: computed
        description: Share assigned by variant arbitrated_panel_mean on determination; null before then.
      - name: receives_credit
        type: boolean
        source: computed
        description: >-
          True when the writer's effective final share is >= GuildAgreement.credit_share_threshold_pct.
        default: false

  - name: CreditArbitration
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: FK -> Episode.id; the episode under arbitration. At most one arbitration per episode.
        constraints: must reference an existing Episode; unique per episode_id
      - name: arbiter_writer_ids
        type: array
        source: input
        description: >-
          Array of exactly three Writer.id values forming the panel. Each id MUST reference an existing
          Writer that has neither a non-VOID ScriptAssignment nor any CreditSubmission on episode_id.
        constraints: exactly 3 distinct ids
      - name: participant_writer_ids
        type: array
        source: computed
        description: >-
          Array of Writer.id values with a CreditSubmission on episode_id whose status == ELIGIBLE,
          ordered by CreditSubmission.created_at ASC.
        default: []
      - name: status
        type: enum
        source: computed
        description: Arbitration lifecycle with a fork on determination; see state machine CreditArbitration.
        default: INITIATED
        constraints: one of {INITIATED, STATEMENTS_OPEN, PANEL_VOTING, DETERMINED, DEADLOCKED, POLICY_REVIEW}
      - name: votes_cast_count
        type: integer
        source: computed
        description: Number of distinct panel arbiters that have cast a vote.
        default: 0
      - name: vote_ledger
        type: object
        source: computed
        description: >-
          Map of arbiter Writer.id -> { participant Writer.id -> integer pct } capturing every cast
          ballot; ballots are append-only and a second ballot from the same arbiter is rejected.
        default: {}
      - name: leading_writer_id
        type: string
        source: computed
        description: >-
          Writer.id with the highest panel mean share; tie-break CreditSubmission.created_at ASC among
          tied writers. Null until the first ballot is cast.
      - name: concurrence_pct
        type: number
        source: computed
        description: >-
          Fraction of cast ballots whose share for leading_writer_id lies within
          GuildAgreement.arbitration_concurrence_band_pct percentage points of the panel mean share for
          that writer. Rounded to 3 decimals, round_half_up.
        default: 0
      - name: outcome
        type: enum
        source: computed
        description: "Terminal outcome recorded on determination: UPHELD when the arbitrated share map equals Episode.provisional_credit_shares, REVISED when it differs, DEADLOCK_RESOLVED_BY_POLICY when the determination arrived through the DEADLOCKED -> POLICY_REVIEW branch; NONE before determination."
        default: NONE
        constraints: one of {NONE, UPHELD, REVISED, DEADLOCK_RESOLVED_BY_POLICY}
      - name: determined_credit_string
        type: string
        source: computed
        description: "On-screen credit string produced by the determination: the legal_name of every writer with receives_credit == true, joined by ' & ' in descending final share order with tie-break CreditSubmission.created_at ASC; null before determination."

  - name: FeeLedgerEntry
    parent: ScriptAssignment
    common_fields: false
    fields:
      - name: season_id
        type: string
        source: system
        description: FK -> Season.id; the season whose script_fee_committed_cents this entry moves.
      - name: assignment_id
        type: string
        source: system
        description: FK -> ScriptAssignment.id; the assignment that produced this entry.
      - name: writer_id
        type: string
        source: system
        description: FK -> Writer.id; the writer the money is owed to (or reversed from).
      - name: entry_type
        type: enum
        source: system
        description: >-
          SCRIPT_FEE_ACCRUAL on assignment creation (positive gross fee), GUARANTEE_OFFSET when a
          guarantee slot absorbs part of the fee (negative), FEE_REVERSAL on void (negation of every
          prior entry of the assignment), GUARANTEE_REALLOCATION when a chronological settlement moves
          a slot between assignments (signed delta).
        constraints: one of {SCRIPT_FEE_ACCRUAL, GUARANTEE_OFFSET, FEE_REVERSAL, GUARANTEE_REALLOCATION}
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount in cents; the ledger is append-only and entries are never mutated.
      - name: memo
        type: string
        source: system
        description: Human-readable explanation of the entry, e.g. "void reversal of TELEPLAY fee".

state_machines:
  - entity: WritersRoom
    initial_state: OPEN
    terminal_states: [WRAPPED]
    transitions:
      - from: OPEN
        to: STAFFING
        trigger: "POST /rooms/{room_id}/open-staffing"
        actor: Showrunner
        preconditions:
          - "room.status == OPEN"
          - "logical clock <= Season.staffing_window_end of room.season_id (else ERR_STAFFING_WINDOW_CLOSED)"
        side_effects:
          - "room.status = STAFFING"
          - "recompute room.seat_subtotal_weekly_cents, room.facility_tier, room.facility_surcharge_weekly_cents, room.weekly_burn_cents via calculation room_weekly_burn (subtotal is 0, so TIER_1 applies and only the format surcharge is charged)"
          - "recompute Season.staffing_commitment_weekly_cents via calculation season_staffing_commitment (rooms with status IN {STAFFING, ACTIVE} are now included)"
          - "increments WritersRoom.version by 1"
      - from: STAFFING
        to: STAFFING
        trigger: "POST /rooms/{room_id}/reconfigure"
        actor: StudioExecutive
        preconditions:
          - "room.status == STAFFING"
          - "payload.expected_room_version == room.version (else ERR_STALE_ROOM_VERSION)"
          - "if payload.format == MINI_ROOM then room.seat_capacity <= 4 (else ERR_MINI_ROOM_SEAT_LIMIT)"
          - "if payload.format == MINI_ROOM then room.filled_seat_count <= 4"
        side_effects:
          - "room.format = payload.format; room.duration_weeks_committed = payload.duration_weeks_committed"
          - "CASCADE C link 1: because room.format/duration changed, every RoomSeat of this room with status == CONFIRMED has guild_floor_weekly_cents, weekly_compensation_cents, diversity_subsidy_weekly_cents, studio_charge_weekly_cents recomputed via calculation seat_weekly_compensation and prorated_commitment_cents recomputed via calculation seat_prorated_commitment"
          - "CASCADE C link 2: because those seat weekly_compensation_cents values changed, room.seat_subtotal_weekly_cents, room.facility_tier, room.facility_surcharge_weekly_cents and room.weekly_burn_cents are recomputed via calculation room_weekly_burn"
          - "CASCADE C link 3: because room.weekly_burn_cents changed, Season.staffing_commitment_weekly_cents is recomputed via calculation season_staffing_commitment"
          - "increments WritersRoom.version by 1 and RoomSeat.version by 1 for each recomputed seat"
        note: >-
          Self-loop; the room stays in STAFFING. This is CASCADE C, whose links each follow from the
          previous one (format -> seat compensation -> room burn -> season commitment).
      - from: STAFFING
        to: ACTIVE
        trigger: "POST /rooms/{room_id}/activate"
        actor: StudioExecutive
        preconditions:
          - "room.status == STAFFING"
          - "no RoomSeat of this room has status == OFFERED (else ERR_SEATS_STILL_OFFERED)"
          - "room.confirmed_seat_count >= 1 (else ERR_ROOM_HAS_NO_CONFIRMED_SEATS)"
          - "room.confirmed_diversity_seat_count >= room.diversity_seats_required (else ERR_DIVERSITY_REQUIREMENT_UNMET)"
          - "Season.staffing_commitment_weekly_cents <= Season.staffing_budget_weekly_cents (else ERR_SEASON_STAFFING_BUDGET_EXCEEDED)"
        side_effects:
          - "room.status = ACTIVE"
          - "recompute room.weekly_burn_cents via calculation room_weekly_burn"
          - "recompute Season.staffing_commitment_weekly_cents via calculation season_staffing_commitment"
          - "increments WritersRoom.version by 1"
      - from: ACTIVE
        to: WRAPPED
        trigger: "POST /rooms/{room_id}/wrap"
        actor: StudioExecutive
        preconditions:
          - "room.status == ACTIVE"
        side_effects:
          - "room.status = WRAPPED"
          - "conditional cascade: every RoomSeat of this room with status == CONFIRMED transitions CONFIRMED -> RELEASED, each firing the full RoomSeat release side-effect chain (CASCADE B); seats already in DECLINED/WITHDRAWN/RELEASED are untouched"
          - "recompute room.seat_subtotal_weekly_cents, room.facility_tier, room.facility_surcharge_weekly_cents, room.weekly_burn_cents (room leaves the {STAFFING, ACTIVE} filter so its burn no longer counts)"
          - "recompute Season.staffing_commitment_weekly_cents via calculation season_staffing_commitment"
          - "increments WritersRoom.version by 1"

  - entity: RoomSeat
    initial_state: OFFERED
    terminal_states: [DECLINED, WITHDRAWN, RELEASED]
    transitions:
      - from: "(none)"
        to: OFFERED
        trigger: "POST /rooms/{room_id}/seats"
        actor: Showrunner
        preconditions:
          - "room.status == STAFFING (else ERR_ROOM_NOT_ACCEPTING_SEATS)"
          - "payload.expected_room_version == room.version (else ERR_STALE_ROOM_VERSION)"
          - "room.open_seat_count >= 1 (else ERR_SEAT_CAPACITY_EXCEEDED)"
          - "if payload.diversity_program_funded == true then Writer.diversity_program_participant == true (else ERR_DIVERSITY_FUNDING_INELIGIBLE)"
          - "level_at_hire is at most Writer.determined_level in the order [STAFF_WRITER, STORY_EDITOR, EXEC_STORY_EDITOR, CO_PRODUCER, PRODUCER], or exactly one position above it when payload.diversity_program_funded == true (else ERR_LEVEL_ABOVE_DETERMINED)"
          - "payload.offered_weekly_compensation_cents >= GuildAgreement.min_weekly_cents_by_level[level_at_hire] (else ERR_BELOW_GUILD_MINIMUM)"
          - "Season.staffing_window_start <= payload.start_date <= Season.staffing_window_end (else ERR_OUTSIDE_STAFFING_WINDOW)"
          - "an AvailabilityWindow of writer_id with status == OPEN contains the half-open seat interval (window.start_date <= seat.start_date AND seat.end_date <= window.end_date) (else ERR_WRITER_UNAVAILABLE)"
          - "no other RoomSeat of writer_id with status IN {OFFERED, CONFIRMED} where either seat has exclusivity == EXCLUSIVE overlaps the half-open interval [start_date, end_date) (else ERR_WRITER_WINDOW_CONFLICT)"
          - "Season.staffing_commitment_weekly_cents + this seat's weekly_compensation_cents <= Season.staffing_budget_weekly_cents (else ERR_SEASON_STAFFING_BUDGET_EXCEEDED)"
        side_effects:
          - "seat.status = OFFERED"
          - "compute seat.guild_floor_weekly_cents, seat.weekly_compensation_cents, seat.diversity_subsidy_weekly_cents, seat.studio_charge_weekly_cents via calculation seat_weekly_compensation"
          - "compute seat.prorated_commitment_cents via calculation seat_prorated_commitment"
          - "seat.guarantee_slots_consumed = 0; seat.guarantee_slots_remaining = seat.episodic_guarantee_count"
          - "room.filled_seat_count += 1; room.open_seat_count = room.seat_capacity - room.filled_seat_count"
          - "Writer.active_seat_count += 1"
          - "increments WritersRoom.version by 1"
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /room-seats/{seat_id}/accept"
        actor: Writer
        preconditions:
          - "seat.status == OFFERED (else ERR_SEAT_NOT_OFFERED)"
          - "X-User-ID == seat.writer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "room.status == STAFFING (else ERR_ROOM_NOT_ACCEPTING_SEATS)"
          - "at least one AvailabilityWindow of seat.writer_id with status == OPEN contains the seat interval (else ERR_WRITER_UNAVAILABLE)"
        side_effects:
          - "seat.status = CONFIRMED; seat.confirmed_at = logical clock"
          - "select the consumed window: eligibility = AvailabilityWindows of seat.writer_id with status == OPEN whose interval contains [seat.start_date, seat.end_date); ranking = window.start_date ASC; tie-break = window.created_at ASC; empty set -> ERR_WRITER_UNAVAILABLE. The selected window gets status = CONSUMED and consumed_by_seat_id = seat.id, and seat.consumed_window_id = window.id"
          - "room.confirmed_seat_count += 1; room.confirmed_diversity_seat_count += 1 when seat.diversity_program_funded"
          - "recompute room.seat_subtotal_weekly_cents, room.facility_tier, room.facility_surcharge_weekly_cents, room.weekly_burn_cents via calculation room_weekly_burn"
          - "recompute Season.staffing_commitment_weekly_cents via calculation season_staffing_commitment"
          - "increments WritersRoom.version by 1 and AvailabilityWindow.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /room-seats/{seat_id}/decline"
        actor: Writer
        preconditions:
          - "seat.status == OFFERED (else ERR_SEAT_NOT_OFFERED)"
          - "X-User-ID == seat.writer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "seat.status = DECLINED"
          - "room.filled_seat_count -= 1; room.open_seat_count = room.seat_capacity - room.filled_seat_count (invariant seat_capacity_conservation restored)"
          - "Writer.active_seat_count -= 1"
          - "increments WritersRoom.version by 1"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /room-seats/{seat_id}/withdraw"
        actor: Showrunner
        preconditions:
          - "seat.status == OFFERED (else ERR_SEAT_NOT_OFFERED)"
        side_effects:
          - "seat.status = WITHDRAWN"
          - "room.filled_seat_count -= 1; room.open_seat_count = room.seat_capacity - room.filled_seat_count (invariant seat_capacity_conservation restored)"
          - "Writer.active_seat_count -= 1"
          - "increments WritersRoom.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /room-seats/{seat_id}/release"
        actor: StudioExecutive
        preconditions:
          - "seat.status == CONFIRMED (else ERR_SEAT_NOT_CONFIRMED)"
        side_effects:
          - "seat.status = RELEASED"
          - "seat.consumed_window_id window returns to status = OPEN with consumed_by_seat_id = null; seat.consumed_window_id = null"
          - "room.filled_seat_count -= 1; room.confirmed_seat_count -= 1; room.confirmed_diversity_seat_count -= 1 when seat.diversity_program_funded; room.open_seat_count = room.seat_capacity - room.filled_seat_count"
          - "Writer.active_seat_count -= 1"
          - "recompute room.seat_subtotal_weekly_cents, room.facility_tier, room.facility_surcharge_weekly_cents, room.weekly_burn_cents via calculation room_weekly_burn, then recompute Season.staffing_commitment_weekly_cents via calculation season_staffing_commitment"
          - "CASCADE B link 1: because the seat is no longer CONFIRMED, every ScriptAssignment with room_seat_id == seat.id and status IN {DRAFTING, DELIVERED, IN_NOTES} transitions to REASSIGNMENT_PENDING"
          - "CASCADE B link 2: because those assignments left {DRAFTING, DELIVERED, IN_NOTES}, each affected Episode.script_readiness is recomputed (READY -> IN_PROGRESS when the episode's approved_teleplay_assignment_id is null and at least one non-VOID assignment remains; IN_PROGRESS -> NOT_STARTED when every assignment of the episode is VOID)"
          - "CASCADE B link 3: because those Episode.script_readiness values changed, Season.ready_script_count, Season.coverage_gap and Season.coverage_posture are recomputed via calculation script_coverage_index"
          - "increments WritersRoom.version by 1"
        note: >-
          CASCADE B is the seat-release propagation chain: seat release -> assignment reassignment ->
          episode readiness -> season coverage posture. Each link is caused by the previous link's
          mutation, not directly by the release call.

  - entity: ScriptAssignment
    initial_state: DRAFTING
    terminal_states: [APPROVED, VOID]
    transitions:
      - from: "(none)"
        to: DRAFTING
        trigger: "POST /episodes/{episode_id}/script-assignments"
        actor: Showrunner
        preconditions:
          - "X-User-ID == Season.showrunner_writer_id of the episode's season (else ERR_NOT_SEASON_SHOWRUNNER)"
          - "payload.expected_episode_version == episode.version (else ERR_STALE_EPISODE_VERSION)"
          - "episode.script_readiness != LOCKED (else ERR_EPISODE_ALREADY_LOCKED)"
          - "the writer has a resolvable room_seat_id per the RoomSeat selector on ScriptAssignment.room_seat_id (else ERR_WRITER_NOT_STAFFED)"
          - "assignment_type IN {REWRITE, PRODUCTION_POLISH} requires payload.predecessor_assignment_id present, belonging to the same episode, with status == APPROVED (else ERR_PREDECESSOR_NOT_APPROVED); the other three types require it absent (else ERR_PREDECESSOR_NOT_ALLOWED)"
          - "no other ScriptAssignment of this episode with the same assignment_type has status IN {DRAFTING, DELIVERED, IN_NOTES, APPROVED} (else ERR_ASSIGNMENT_TYPE_CONFLICT)"
          - "Season.script_fee_committed_cents + this assignment's payable_fee_cents <= Season.script_fee_budget_cents (else ERR_SCRIPT_FEE_BUDGET_EXCEEDED)"
        side_effects:
          - "assignment.status = DRAFTING; assignment.room_seat_id resolved by the declared seat selector"
          - "compute assignment.gross_fee_cents via calculation script_fee_derivation"
          - "run calculation guarantee_settlement in the season's guarantee_application_mode, setting guarantee_slot_applied, guarantee_offset_cents and payable_fee_cents"
          - "append FeeLedgerEntry {entry_type: SCRIPT_FEE_ACCRUAL, amount_cents: +gross_fee_cents}; when guarantee_slot_applied append FeeLedgerEntry {entry_type: GUARANTEE_OFFSET, amount_cents: -guarantee_offset_cents}"
          - "recompute Season.script_fee_committed_cents as the signed sum of the season's FeeLedgerEntry.amount_cents"
          - "recompute RoomSeat.guarantee_slots_consumed and guarantee_slots_remaining for assignment.room_seat_id (invariant guarantee_slot_conservation)"
          - "synthesize Milestones per assignment_type with due_date values from calculation milestone_schedule_derivation: STORY -> [OUTLINE]; TELEPLAY and STORY_AND_TELEPLAY -> [OUTLINE, FIRST_DRAFT, SECOND_DRAFT]; REWRITE -> [FIRST_DRAFT]; PRODUCTION_POLISH -> [PRODUCTION_POLISH]; each milestone starts PENDING, or LATE when the logical clock is already past its due_date"
          - "Episode.script_readiness NOT_STARTED -> IN_PROGRESS; when assignment_type == REWRITE and episode.script_readiness == READY it moves READY -> IN_PROGRESS and episode.approved_teleplay_assignment_id is retained"
          - "when Episode.script_readiness leaves READY, recompute Season.ready_script_count / coverage_gap / coverage_posture via calculation script_coverage_index"
          - "increments Episode.version by 1"
      - from: DRAFTING
        to: DELIVERED
        trigger: "POST /milestones/{milestone_id}/deliver (system transition, fires only once every milestone of the assignment has status IN {DELIVERED, NOTES_ISSUED, ACCEPTED})"
        actor: system
        preconditions:
          - "assignment.status == DRAFTING"
          - "every Milestone of the assignment has status IN {DELIVERED, NOTES_ISSUED, ACCEPTED} after the current delivery is applied"
        side_effects:
          - "assignment.status = DELIVERED"
          - "recompute assignment.late_milestone_count"
      - from: DELIVERED
        to: IN_NOTES
        trigger: "POST /script-assignments/{assignment_id}/issue-notes"
        actor: Showrunner
        preconditions:
          - "assignment.status == DELIVERED (else ERR_ASSIGNMENT_NOT_DELIVERED)"
          - "X-User-ID == Season.showrunner_writer_id of the episode's season (else ERR_NOT_SEASON_SHOWRUNNER)"
          - "assignment.revision_round + 1 <= GuildAgreement.max_free_revision_rounds (else ERR_REVISION_CAP_EXCEEDED)"
        side_effects:
          - "assignment.status = IN_NOTES; assignment.revision_round += 1"
          - "every Milestone of the assignment with status == DELIVERED becomes NOTES_ISSUED"
      - from: IN_NOTES
        to: DRAFTING
        trigger: "POST /milestones/{milestone_id}/deliver (system transition executed before the milestone delivery is applied)"
        actor: system
        preconditions:
          - "assignment.status == IN_NOTES"
          - "the delivered milestone belongs to this assignment and has status == NOTES_ISSUED"
        side_effects:
          - "assignment.status = DRAFTING"
        note: >-
          Closes the revision cycle DRAFTING -> DELIVERED -> IN_NOTES -> DRAFTING. One deliver call may
          execute this transition and then the DRAFTING -> DELIVERED transition, in that order, when
          the delivery completes the milestone chain again.
      - from: DELIVERED
        to: APPROVED
        trigger: "POST /script-assignments/{assignment_id}/approve"
        actor: Showrunner | StudioExecutive
        preconditions:
          - "assignment.status == DELIVERED (else ERR_ASSIGNMENT_NOT_DELIVERED)"
          - "when the acting role is Showrunner: X-User-ID == Season.showrunner_writer_id (else ERR_NOT_SEASON_SHOWRUNNER) AND X-User-ID != assignment.writer_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "every Milestone of the assignment has status IN {DELIVERED, NOTES_ISSUED}"
        side_effects:
          - "assignment.status = APPROVED; assignment.approved_by_role = SHOWRUNNER or STUDIO_EXECUTIVE"
          - "every Milestone of the assignment becomes ACCEPTED"
          - "when assignment_type IN {TELEPLAY, STORY_AND_TELEPLAY}: Episode.approved_teleplay_assignment_id = assignment.id and Episode.script_readiness IN_PROGRESS -> READY"
          - "Episode.credit_status PENDING -> SUBMISSIONS_OPEN (system auto-transition on the episode's first APPROVED assignment)"
          - "when Season.guarantee_application_mode == CHRONOLOGICAL_ON_ACCEPTANCE, re-run calculation guarantee_settlement for RoomSeat = assignment.room_seat_id over its non-VOID assignments in acceptance order; every assignment whose guarantee_slot_applied flips appends a FeeLedgerEntry {entry_type: GUARANTEE_REALLOCATION, amount_cents: signed delta of payable_fee_cents} and has guarantee_offset_cents / payable_fee_cents rewritten"
          - "recompute Season.script_fee_committed_cents from the ledger and RoomSeat.guarantee_slots_consumed / guarantee_slots_remaining"
          - "recompute Season.ready_script_count / coverage_gap / coverage_posture via calculation script_coverage_index"
          - "increments Episode.version by 1"
      - from: DRAFTING | DELIVERED | IN_NOTES | REASSIGNMENT_PENDING
        to: VOID
        trigger: "POST /script-assignments/{assignment_id}/void"
        actor: StudioExecutive
        preconditions:
          - "assignment.status IN {DRAFTING, DELIVERED, IN_NOTES, REASSIGNMENT_PENDING} (else ERR_ASSIGNMENT_ALREADY_TERMINAL)"
          - "episode.script_readiness != LOCKED (else ERR_EPISODE_ALREADY_LOCKED)"
        side_effects:
          - "assignment.status = VOID"
          - "append one FeeLedgerEntry {entry_type: FEE_REVERSAL, amount_cents: -1 x sum of this assignment's prior FeeLedgerEntry.amount_cents} so the assignment's net ledger contribution becomes exactly 0 (invariant fee_ledger_conservation)"
          - "assignment.guarantee_slot_applied = false; assignment.guarantee_offset_cents = 0; assignment.payable_fee_cents = 0"
          - "recompute Season.script_fee_committed_cents from the ledger"
          - "recompute RoomSeat.guarantee_slots_consumed / guarantee_slots_remaining for assignment.room_seat_id (invariant guarantee_slot_conservation)"
          - "when Season.guarantee_application_mode == CHRONOLOGICAL_ON_ACCEPTANCE and a slot was freed, re-run calculation guarantee_settlement for that seat, appending GUARANTEE_REALLOCATION entries for any assignment whose guarantee_slot_applied flips"
          - "recompute Episode.script_readiness (IN_PROGRESS -> NOT_STARTED when every assignment of the episode is VOID) and then Season.ready_script_count / coverage_posture via calculation script_coverage_index"
      - from: DRAFTING | DELIVERED | IN_NOTES
        to: REASSIGNMENT_PENDING
        trigger: "system event: the assignment's RoomSeat leaves status CONFIRMED (CASCADE B link 1 of RoomSeat release or WritersRoom wrap)"
        actor: system
        preconditions:
          - "assignment.status IN {DRAFTING, DELIVERED, IN_NOTES}"
          - "RoomSeat with id == assignment.room_seat_id has status == RELEASED"
        side_effects:
          - "assignment.status = REASSIGNMENT_PENDING"
          - "the assignment's Milestones keep their current status and due dates"
          - "triggers CASCADE B link 2 (Episode.script_readiness recompute)"

  - entity: Episode.script_readiness
    initial_state: NOT_STARTED
    terminal_states: [LOCKED]
    note: >-
      First of two INDEPENDENT state dimensions persisted on the same Episode row. Nothing in this
      dimension reads or writes Episode.credit_status, and vice versa; the pair (script_readiness,
      credit_status) is the episode's combined state.
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /episodes/{episode_id}/script-assignments (system side effect of the first non-VOID assignment)"
        actor: system
        preconditions:
          - "episode.script_readiness == NOT_STARTED"
        side_effects:
          - "episode.script_readiness = IN_PROGRESS"
      - from: IN_PROGRESS
        to: READY
        trigger: "POST /script-assignments/{assignment_id}/approve for assignment_type IN {TELEPLAY, STORY_AND_TELEPLAY}"
        actor: system
        preconditions:
          - "episode.script_readiness == IN_PROGRESS"
          - "the approved assignment has assignment_type IN {TELEPLAY, STORY_AND_TELEPLAY}"
        side_effects:
          - "episode.script_readiness = READY; episode.approved_teleplay_assignment_id = the approved assignment id"
          - "recompute Season.ready_script_count / coverage_gap / coverage_posture via calculation script_coverage_index"
      - from: READY
        to: IN_PROGRESS
        trigger: "POST /episodes/{episode_id}/script-assignments with assignment_type == REWRITE"
        actor: system
        preconditions:
          - "episode.script_readiness == READY"
        side_effects:
          - "episode.script_readiness = IN_PROGRESS (a rewrite reopens the script; approved_teleplay_assignment_id is retained so the clearance mirror keeps pointing at the approved draft)"
          - "recompute Season.ready_script_count / coverage_gap / coverage_posture via calculation script_coverage_index"
        note: Makes this dimension cyclic (IN_PROGRESS -> READY -> IN_PROGRESS).
      - from: IN_PROGRESS
        to: NOT_STARTED
        trigger: "POST /script-assignments/{assignment_id}/void (system side effect when the episode's last non-VOID assignment is voided)"
        actor: system
        preconditions:
          - "episode.script_readiness == IN_PROGRESS"
          - "every ScriptAssignment of the episode has status == VOID after the void is applied"
        side_effects:
          - "episode.script_readiness = NOT_STARTED"
      - from: READY
        to: LOCKED
        trigger: "POST /episodes/{episode_id}/lock-for-production"
        actor: Showrunner | StudioExecutive
        preconditions:
          - "episode.script_readiness == READY (else ERR_EPISODE_NOT_READY)"
          - "when the acting role is Showrunner: X-User-ID == Season.showrunner_writer_id (else ERR_NOT_SEASON_SHOWRUNNER); a StudioExecutive may lock any episode of the season"
          - "episode.clearance_posture IN {CLEARED, CONDITIONAL_WAIVED} (else ERR_CLEARANCE_NOT_CLEARED, or ERR_CLEARANCE_BLOCKED when the posture is BLOCKED)"
          - "Season.ready_script_count >= Season.ready_script_target, counting this episode, i.e. the comparison is >= and NOT > (else ERR_SCRIPT_COVERAGE_INSUFFICIENT)"
        side_effects:
          - "episode.script_readiness = LOCKED; episode.locked_at = logical clock"
          - "recompute Season.ready_script_count / coverage_gap / coverage_posture via calculation script_coverage_index (LOCKED episodes keep counting)"
          - "increments Episode.version by 1"

  - entity: Episode.credit_status
    initial_state: PENDING
    terminal_states: [DETERMINED]
    note: >-
      Second INDEPENDENT state dimension on the Episode row; advances only through credit endpoints and
      never reads Episode.script_readiness beyond the fact that an APPROVED assignment exists.
    transitions:
      - from: PENDING
        to: SUBMISSIONS_OPEN
        trigger: "POST /script-assignments/{assignment_id}/approve (system side effect of the episode's first APPROVED assignment of any type)"
        actor: system
        preconditions:
          - "episode.credit_status == PENDING"
        side_effects:
          - "episode.credit_status = SUBMISSIONS_OPEN"
      - from: SUBMISSIONS_OPEN
        to: SUBMISSIONS_CLOSED
        trigger: "POST /episodes/{episode_id}/credit-submissions/close"
        actor: Showrunner | GuildAdministrator
        preconditions:
          - "episode.credit_status == SUBMISSIONS_OPEN (else ERR_SUBMISSION_WINDOW_CLOSED)"
          - "at least one CreditSubmission of the episode exists (else ERR_NO_ELIGIBLE_SUBMISSIONS)"
        side_effects:
          - "episode.credit_status = SUBMISSIONS_CLOSED"
          - "each CreditSubmission of the episode is marked ELIGIBLE or INELIGIBLE per the eligibility filter of calculation credit_share_determination"
          - "when no submission is ELIGIBLE the call is rejected with ERR_NO_ELIGIBLE_SUBMISSIONS and nothing is persisted"
          - "run variant provisional_normalized of calculation credit_share_determination, writing CreditSubmission.provisional_share_pct and Episode.provisional_credit_shares"
          - "increments Episode.version by 1"
      - from: SUBMISSIONS_CLOSED
        to: IN_ARBITRATION
        trigger: "POST /episodes/{episode_id}/credit-arbitration"
        actor: GuildAdministrator
        preconditions:
          - "episode.credit_status == SUBMISSIONS_CLOSED (else ERR_ARBITRATION_NOT_AVAILABLE)"
          - "no CreditArbitration exists for the episode (else ERR_ARBITRATION_ALREADY_EXISTS)"
        side_effects:
          - "episode.credit_status = IN_ARBITRATION"
          - "a CreditArbitration is created in INITIATED and immediately auto-advanced to STATEMENTS_OPEN"
          - "increments Episode.version by 1"
      - from: IN_ARBITRATION
        to: DETERMINED
        trigger: "POST /credit-arbitrations/{arbitration_id}/determine"
        actor: GuildAdministrator
        preconditions:
          - "episode.credit_status == IN_ARBITRATION"
          - "the arbitration reached DETERMINED (concurrence branch) or POLICY_REVIEW (deadlock-override branch)"
        side_effects:
          - "episode.credit_status = DETERMINED"
          - "episode.final_credit_shares and episode.determined_credit_string written from the branch that fired"
          - "each ELIGIBLE CreditSubmission gets receives_credit = (effective final share >= GuildAgreement.credit_share_threshold_pct) and Writer.on_screen_credit_count is incremented for every writer whose receives_credit flips to true"
          - "increments Episode.version by 1"

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: LATE
        trigger: "system re-evaluation inside POST /milestones/{milestone_id}/deliver (this milestone only) or POST /seasons/{season_id}/reschedule (every milestone of the season)"
        actor: system
        preconditions:
          - "milestone.status == PENDING"
          - "logical clock > milestone.due_date"
        side_effects:
          - "milestone.status = LATE"
          - "recompute ScriptAssignment.late_milestone_count"
      - from: LATE
        to: PENDING
        trigger: "POST /seasons/{season_id}/reschedule (CASCADE A link 3)"
        actor: system
        preconditions:
          - "milestone.status == LATE"
          - "the re-derived milestone.due_date is >= the logical clock"
        side_effects:
          - "milestone.status = PENDING"
          - "recompute ScriptAssignment.late_milestone_count"
      - from: PENDING | LATE
        to: DELIVERED
        trigger: "POST /milestones/{milestone_id}/deliver"
        actor: Writer
        preconditions:
          - "milestone.status IN {PENDING, LATE, NOTES_ISSUED} (else ERR_MILESTONE_NOT_DELIVERABLE)"
          - "X-User-ID == ScriptAssignment.writer_id of milestone.assignment_id (else ERR_NOT_RESOURCE_OWNER)"
          - "the parent assignment has status IN {DRAFTING, IN_NOTES} (else ERR_ASSIGNMENT_NOT_DRAFTING)"
          - "Episode.script_readiness != LOCKED (else ERR_EPISODE_ALREADY_LOCKED)"
        side_effects:
          - "milestone.delivered_at = logical clock; milestone.status = DELIVERED"
          - "milestone.days_late = max(0, UTC calendar date of delivered_at - UTC calendar date of due_date) in whole days"
          - "recompute ScriptAssignment.late_milestone_count"
          - "may trigger the assignment transitions IN_NOTES -> DRAFTING and then DRAFTING -> DELIVERED"
      - from: DELIVERED
        to: NOTES_ISSUED
        trigger: "POST /script-assignments/{assignment_id}/issue-notes"
        actor: system
        preconditions:
          - "milestone.status == DELIVERED"
          - "the parent assignment transitions DELIVERED -> IN_NOTES in the same call"
        side_effects:
          - "milestone.status = NOTES_ISSUED"
      - from: NOTES_ISSUED
        to: DELIVERED
        trigger: "POST /milestones/{milestone_id}/deliver"
        actor: Writer
        preconditions:
          - "milestone.status == NOTES_ISSUED"
          - "X-User-ID == ScriptAssignment.writer_id of milestone.assignment_id"
        side_effects:
          - "milestone.delivered_at = logical clock (overwritten); milestone.status = DELIVERED; days_late recomputed against the unchanged due_date"
      - from: DELIVERED | NOTES_ISSUED
        to: ACCEPTED
        trigger: "POST /script-assignments/{assignment_id}/approve"
        actor: system
        preconditions:
          - "the parent assignment transitions DELIVERED -> APPROVED in the same call"
        side_effects:
          - "milestone.status = ACCEPTED"

  - entity: ClearanceItem
    initial_state: SUBMITTED
    terminal_states: [CLEARED, CONDITIONAL, BLOCKED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /clearance-items/{item_id}/decide with decision == CLEARED"
        actor: LegalCounsel
        preconditions:
          - "item.decision == SUBMITTED (else ERR_ITEM_ALREADY_DECIDED)"
          - "the parent ClearanceReview.posture != CONDITIONAL_WAIVED (else ERR_REVIEW_WAIVED)"
        side_effects:
          - "item.decision = CLEARED; item.risk_weight = 0"
          - "recompute ClearanceReview.decided_item_count, risk_score and posture via calculation clearance_risk_score"
          - "mirror the review posture onto Episode.clearance_posture when the review's assignment is the episode's approved_teleplay_assignment_id"
          - "recompute Season.ready_script_count / coverage_posture via calculation script_coverage_index"
      - from: SUBMITTED
        to: CONDITIONAL
        trigger: "POST /clearance-items/{item_id}/decide with decision == CONDITIONAL and a conditional_note"
        actor: LegalCounsel
        preconditions:
          - "item.decision == SUBMITTED (else ERR_ITEM_ALREADY_DECIDED)"
          - "payload.conditional_note is present and non-empty (else ERR_CONDITIONAL_NOTE_REQUIRED)"
        side_effects:
          - "item.decision = CONDITIONAL; item.conditional_note = payload.conditional_note; item.risk_weight = GuildAgreement.clearance_item_weights[item_type] x 1"
          - "recompute ClearanceReview.decided_item_count, risk_score and posture via calculation clearance_risk_score"
          - "mirror the review posture onto Episode.clearance_posture when applicable, then recompute Season coverage via calculation script_coverage_index"
      - from: SUBMITTED
        to: BLOCKED
        trigger: "POST /clearance-items/{item_id}/decide with decision == BLOCKED"
        actor: LegalCounsel
        preconditions:
          - "item.decision == SUBMITTED (else ERR_ITEM_ALREADY_DECIDED)"
        side_effects:
          - "item.decision = BLOCKED; item.risk_weight = GuildAgreement.clearance_item_weights[item_type] x 4"
          - "recompute ClearanceReview.decided_item_count, risk_score and posture via calculation clearance_risk_score; posture becomes BLOCKED because at least one item is BLOCKED"
          - "mirror the review posture onto Episode.clearance_posture when applicable, then recompute Season coverage via calculation script_coverage_index"

  - entity: ClearanceReview
    initial_state: PENDING
    terminal_states: []
    note: >-
      Compound machine: posture is a pure function of the child ClearanceItem decisions (plus the
      waiver flag) and is re-derived after every item decision, so it may move CLEARED -> BLOCKED as
      later items are decided.
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "system recompute after POST /clearance-items/{item_id}/decide"
        actor: system
        preconditions:
          - "review.item_count >= 1 AND review.decided_item_count == review.item_count"
          - "review.risk_score == 0"
        side_effects:
          - "review.posture = CLEARED"
          - "Episode.clearance_posture mirror + Season coverage recompute"
      - from: PENDING | CLEARED
        to: CONDITIONAL
        trigger: "system recompute after POST /clearance-items/{item_id}/decide"
        actor: system
        preconditions:
          - "no item of the review has decision == BLOCKED"
          - "0 < review.risk_score <= GuildAgreement.clearance_escalation_score"
        side_effects:
          - "review.posture = CONDITIONAL"
          - "Episode.clearance_posture mirror + Season coverage recompute"
      - from: PENDING | CLEARED | CONDITIONAL
        to: ESCALATED
        trigger: "system recompute after POST /clearance-items/{item_id}/decide"
        actor: system
        preconditions:
          - "no item of the review has decision == BLOCKED"
          - "review.risk_score > GuildAgreement.clearance_escalation_score"
        side_effects:
          - "review.posture = ESCALATED"
          - "Episode.clearance_posture mirror + Season coverage recompute"
      - from: PENDING | CLEARED | CONDITIONAL | ESCALATED
        to: BLOCKED
        trigger: "system recompute after POST /clearance-items/{item_id}/decide"
        actor: system
        preconditions:
          - "at least one item of the review has decision == BLOCKED"
        side_effects:
          - "review.posture = BLOCKED"
          - "Episode.clearance_posture mirror + Season coverage recompute"
      - from: CONDITIONAL
        to: CONDITIONAL_WAIVED
        trigger: "POST /clearance-reviews/{review_id}/waiver"
        actor: LegalCounsel
        preconditions:
          - "review.posture == CONDITIONAL (else ERR_WAIVER_NOT_APPLICABLE)"
          - "review.legal_waiver_granted == false (else ERR_REVIEW_WAIVED)"
        side_effects:
          - "review.legal_waiver_granted = true; review.waiver_memo = payload.waiver_memo; review.posture = CONDITIONAL_WAIVED"
          - "Episode.clearance_posture mirror + Season coverage recompute (the episode now counts as a ready script)"

  - entity: CreditArbitration
    initial_state: INITIATED
    terminal_states: [DETERMINED, POLICY_REVIEW]
    note: >-
      Fork-join machine: PANEL_VOTING forks into the DETERMINED branch (panel concurrence reached, the
      arbitrated shares govern) and the DEADLOCKED branch (concurrence missed, the provisional shares
      govern after a policy override). The two branches carry different side-effect sets and rejoin at
      Episode.credit_status == DETERMINED.
    transitions:
      - from: INITIATED
        to: STATEMENTS_OPEN
        trigger: "POST /episodes/{episode_id}/credit-arbitration (system auto-advance in the creating call)"
        actor: system
        preconditions:
          - "arbitration.status == INITIATED"
        side_effects:
          - "arbitration.status = STATEMENTS_OPEN"
          - "arbitration.participant_writer_ids = Writer.id list of the episode's ELIGIBLE CreditSubmissions ordered by CreditSubmission.created_at ASC"
      - from: STATEMENTS_OPEN
        to: PANEL_VOTING
        trigger: "POST /credit-arbitrations/{arbitration_id}/votes (first ballot)"
        actor: Writer
        preconditions:
          - "arbitration.status == STATEMENTS_OPEN (else ERR_ARBITRATION_CLOSED)"
          - "X-User-ID IN arbitration.arbiter_writer_ids (else ERR_ARBITER_NOT_ON_PANEL)"
          - "payload.vote_shares keys are exactly arbitration.participant_writer_ids and its values are integers summing to exactly 100 (else ERR_VOTE_SHARES_INVALID)"
        side_effects:
          - "arbitration.status = PANEL_VOTING; arbitration.votes_cast_count = 1"
          - "arbitration.vote_ledger[X-User-ID] = payload.vote_shares"
          - "recompute arbitration.leading_writer_id and arbitration.concurrence_pct via calculation credit_share_determination variant arbitrated_panel_mean"
      - from: PANEL_VOTING
        to: PANEL_VOTING
        trigger: "POST /credit-arbitrations/{arbitration_id}/votes (second and third ballots)"
        actor: Writer
        preconditions:
          - "arbitration.status == PANEL_VOTING (else ERR_ARBITRATION_CLOSED)"
          - "X-User-ID IN arbitration.arbiter_writer_ids (else ERR_ARBITER_NOT_ON_PANEL)"
          - "X-User-ID is not already a key of arbitration.vote_ledger (else ERR_BALLOT_ALREADY_CAST)"
          - "payload.vote_shares keys are exactly arbitration.participant_writer_ids and its values are integers summing to exactly 100 (else ERR_VOTE_SHARES_INVALID)"
        side_effects:
          - "arbitration.vote_ledger[X-User-ID] = payload.vote_shares; arbitration.votes_cast_count += 1"
          - "recompute arbitration.leading_writer_id and arbitration.concurrence_pct"
      - from: PANEL_VOTING
        to: DETERMINED
        trigger: "POST /credit-arbitrations/{arbitration_id}/determine with policy_override == false"
        actor: GuildAdministrator
        preconditions:
          - "arbitration.status == PANEL_VOTING (else ERR_ARBITRATION_CLOSED)"
          - "arbitration.votes_cast_count == 3 (else ERR_PANEL_INCOMPLETE)"
          - "arbitration.concurrence_pct >= GuildAgreement.arbitration_concurrence_pct"
        side_effects:
          - "arbitration.status = DETERMINED; arbitration.outcome = UPHELD when the arbitrated leading writer equals the provisional leading writer, otherwise REVISED"
          - "CreditSubmission.arbitrated_share_pct written for every ELIGIBLE submission from variant arbitrated_panel_mean"
          - "arbitration.determined_credit_string assembled from the arbitrated shares; Episode.final_credit_shares = arbitrated shares; Episode.credit_status -> DETERMINED"
          - "receives_credit and Writer.on_screen_credit_count updated per the Episode.credit_status DETERMINED transition"
      - from: PANEL_VOTING
        to: DEADLOCKED
        trigger: "POST /credit-arbitrations/{arbitration_id}/determine with policy_override == false"
        actor: GuildAdministrator
        preconditions:
          - "arbitration.status == PANEL_VOTING"
          - "arbitration.votes_cast_count == 3"
          - "arbitration.concurrence_pct < GuildAgreement.arbitration_concurrence_pct"
        side_effects:
          - "arbitration.status = DEADLOCKED; arbitration.outcome stays NONE"
          - "no CreditSubmission.arbitrated_share_pct is written and Episode.credit_status stays IN_ARBITRATION"
        note: Divergent branch - the DETERMINED branch writes shares and closes the episode, this one writes neither.
      - from: DEADLOCKED
        to: POLICY_REVIEW
        trigger: "POST /credit-arbitrations/{arbitration_id}/determine with policy_override == true"
        actor: GuildAdministrator
        preconditions:
          - "arbitration.status == DEADLOCKED (else ERR_POLICY_OVERRIDE_NOT_APPLICABLE)"
        side_effects:
          - "arbitration.status = POLICY_REVIEW; arbitration.outcome = DEADLOCK_RESOLVED_BY_POLICY"
          - "CreditSubmission.arbitrated_share_pct = CreditSubmission.provisional_share_pct for every ELIGIBLE submission (the guild policy fallback keeps the provisional split)"
          - "arbitration.determined_credit_string assembled from the provisional shares; Episode.final_credit_shares = provisional shares; Episode.credit_status -> DETERMINED"

concurrency_rules:
  - rule_id: seat-offer-stale-room
    parent_entity: WritersRoom
    write_endpoint: "POST /rooms/{room_id}/seats"
    occ_field: "expected_room_version"
    description: |
      Offering a seat against a WritersRoom whose version has advanced since the client last observed
      it is rejected. A seat offer consumes one of the room's finite open seats and moves the room's
      derived counters, so a create issued from a stale view of the room would legitimately succeed
      under the product semantics while silently over-subscribing capacity or pricing against a
      superseded room configuration.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412
  - rule_id: room-reconfigure-stale-room
    parent_entity: WritersRoom
    write_endpoint: "POST /rooms/{room_id}/reconfigure"
    occ_field: "expected_room_version"
    description: |
      Reconfiguring a room's format or duration commitment legitimately supersedes the prior
      configuration, so a reconfigure carrying a version the room has already advanced past is
      rejected rather than applied on top of a configuration the client never saw.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412
  - rule_id: assignment-create-stale-episode
    parent_entity: Episode
    write_endpoint: "POST /episodes/{episode_id}/script-assignments"
    occ_field: "expected_episode_version"
    description: |
      Creating a ScriptAssignment against an Episode whose version has advanced since the client last
      observed it is rejected. A new assignment legitimately supersedes the episode's script posture
      (a REWRITE reopens a READY script, a PRODUCTION_POLISH stacks on an approved draft), so a create
      from a stale episode view would otherwise be applied against a script state the client never saw.
    error_id: ERR_STALE_EPISODE_VERSION
    http_status: 412
  - rule_id: season-reschedule-stale-season
    parent_entity: Season
    write_endpoint: "POST /seasons/{season_id}/reschedule"
    occ_field: "expected_season_version"
    description: |
      A reschedule legitimately supersedes the season's whole milestone calendar, so a reschedule
      carrying a season version that has already advanced is rejected instead of shifting dates that
      were derived from a production start the client never observed.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

calculations:
  - name: writer_level_determination
    trigger: "POST /writers (initial determination) and POST /writers/{writer_id}/credit-history (re-determination)"
    algorithm: threshold
    formula: |
      t = agreement.level_credit_thresholds
      c = writer.career_episodic_credits          # after the award is applied, on credit-history
      determined_level =
          PRODUCER            if c >= t.PRODUCER
          CO_PRODUCER         else if c >= t.CO_PRODUCER
          EXEC_STORY_EDITOR   else if c >= t.EXEC_STORY_EDITOR
          STORY_EDITOR        else if c >= t.STORY_EDITOR
          STAFF_WRITER        otherwise
      writer.level_determination_agreement_id = agreement.id
      # Every comparison is >= (inclusive): credits exactly equal to a threshold DO reach that level.
    input_set: >-
      Exactly one Writer row and the GuildAgreement identified by the request's agreement_id. No other
      entity participates; RoomSeat.level_at_hire is NOT read here.
    constants:
      COMPARISON: ">= (inclusive at every threshold)"
    precision: "integer credits; no rounding"
    variants: []

  - name: seat_weekly_compensation
    trigger: "POST /rooms/{room_id}/seats (initial) and POST /rooms/{room_id}/reconfigure (CASCADE C link 1 re-derivation for every CONFIRMED seat)"
    algorithm: tiered_pricing
    formula: |
      level_min          = agreement.min_weekly_cents_by_level[seat.level_at_hire]
      format_multiplier  = agreement.mini_room_floor_multiplier  if room.format == MINI_ROOM
                           else 1.0                              # IN_PERSON and REMOTE both 1.0
      uplift_pct         = agreement.short_commitment_uplift_pct
                             if room.duration_weeks_committed < agreement.short_commitment_weeks_threshold
                           else 0.0
      # ONE rounding only, applied to the single product - NOT once per factor:
      guild_floor_weekly_cents = round_half_up(level_min * format_multiplier * (1 + uplift_pct))
      weekly_compensation_cents = max(seat.offered_weekly_compensation_cents, guild_floor_weekly_cents)
      diversity_subsidy_weekly_cents =
          min(round_half_up(weekly_compensation_cents * agreement.diversity_subsidy_pct),
              agreement.diversity_subsidy_cap_weekly_cents)
          if (seat.diversity_program_funded AND writer.diversity_program_participant) else 0
      studio_charge_weekly_cents = weekly_compensation_cents - diversity_subsidy_weekly_cents
    input_set: >-
      One RoomSeat, its WritersRoom (format, duration_weeks_committed), its Writer
      (diversity_program_participant) and the Season's GuildAgreement. Seat status is irrelevant at
      creation; the reconfigure re-derivation is restricted to seats with status == CONFIRMED.
    constants:
      NON_MINI_ROOM_MULTIPLIER: 1.0
      ROUNDING: round_half_up applied exactly once to the floor product and once to the subsidy
    precision: "whole cents, round_half_up"
    variants: []
    note: >-
      Combinatorial mode (a): five inputs (level minimum, room format, duration commitment, offered
      amount, diversity funding) interacting through a nested max/min with conditional branches on two
      different entities' state.

  - name: seat_prorated_commitment
    trigger: "POST /rooms/{room_id}/seats and POST /rooms/{room_id}/reconfigure (after seat_weekly_compensation)"
    algorithm: aggregation
    formula: |
      total_days   = whole UTC days in the half-open interval [seat.start_date, seat.end_date)
      full_weeks   = floor(total_days / 7)
      residual_days = total_days - 7 * full_weeks
      # PINNED ROUNDING ORDER - round the daily rate to whole cents FIRST, then multiply:
      daily_rate_cents = round_half_up(seat.weekly_compensation_cents / 7)
      prorated_commitment_cents = full_weeks * seat.weekly_compensation_cents
                                  + residual_days * daily_rate_cents
      # REJECTED alternative (produces different cents and MUST NOT be used):
      #   full_weeks * weekly + round_half_up(weekly * residual_days / 7)
    input_set: "One RoomSeat plus its already-computed weekly_compensation_cents."
    constants:
      DAYS_PER_WEEK: 7
      ROUNDING_ORDER: "round per-day rate first, then multiply, then sum"
    precision: "whole cents, round_half_up on the daily rate only"
    variants: []
    note: >-
      Combinatorial mode (b): nested rounding where the order changes the answer. With
      weekly_compensation_cents = 450000 and residual_days = 3, the pinned order gives
      3 * round_half_up(450000/7) = 3 * 64286 = 192858, while the rejected order gives
      round_half_up(450000 * 3 / 7) = 192857 - a one-cent divergence on every seat whose weekly rate is
      not a multiple of 7 cents.

  - name: room_weekly_burn
    trigger: >-
      "POST /rooms/{room_id}/open-staffing, POST /room-seats/{seat_id}/accept,
      POST /room-seats/{seat_id}/release, POST /rooms/{room_id}/reconfigure (CASCADE C link 2),
      POST /rooms/{room_id}/activate, POST /rooms/{room_id}/wrap"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - subtotal over CONFIRMED seats only (OFFERED seats never contribute):
      seat_subtotal_weekly_cents = sum(seat.weekly_compensation_cents
                                       for seat in room.seats if seat.status == CONFIRMED)
      # STEP 2 - the tier is keyed on the SUBTOTAL, never on weekly_burn_cents:
      facility_tier = TIER_1 if seat_subtotal_weekly_cents <= bounds.TIER_1_MAX
                      TIER_2 else if seat_subtotal_weekly_cents <= bounds.TIER_2_MAX
                      TIER_3 otherwise
      # STEP 3:
      facility_surcharge_weekly_cents =
          round_half_up(agreement.facility_fee_tiers[facility_tier]
                        * agreement.format_surcharge_pct[room.format])
      # STEP 4:
      weekly_burn_cents = seat_subtotal_weekly_cents + facility_surcharge_weekly_cents
    input_set: >-
      One WritersRoom and its RoomSeats filtered to status == CONFIRMED, plus the Season's
      GuildAgreement tier table. Rooms with status IN {OPEN, WRAPPED} still carry the computed value but
      are excluded from season_staffing_commitment.
    constants:
      TIER_BOUNDS: "inclusive upper bounds; TIER_1 when subtotal <= TIER_1_MAX, TIER_2 when subtotal <= TIER_2_MAX"
      EVALUATION_ORDER: "subtotal -> tier -> surcharge -> total (four ordered steps)"
    precision: "whole cents, round_half_up on the surcharge only"
    variants: []
    note: >-
      Combinatorial mode (c): the dependency looks circular because the facility surcharge is part of
      the room's weekly cost while the tier that selects it is a function of a cost figure. The order
      above pins the tier to the pre-surcharge subtotal, which makes the value well-defined; keying the
      tier off weekly_burn_cents would be self-referential.

  - name: season_staffing_commitment
    trigger: >-
      "every transition that changes a WritersRoom.weekly_burn_cents or a room's status: open-staffing,
      seat accept, seat release, reconfigure (CASCADE C link 3), activate, wrap"
    algorithm: aggregation
    formula: |
      Season.staffing_commitment_weekly_cents =
          sum(room.weekly_burn_cents for room in season.rooms if room.status IN {STAFFING, ACTIVE})
    input_set: >-
      WritersRooms of one Season with status IN {STAFFING, ACTIVE}; rooms with status IN {OPEN, WRAPPED}
      are excluded. No time window applies. The sum is order-insensitive (integer addition), so no
      tie-break is required.
    constants: {}
    precision: "whole cents"
    variants: []

  - name: script_fee_derivation
    trigger: "POST /episodes/{episode_id}/script-assignments"
    algorithm: tiered_pricing
    formula: |
      base_cents = agreement.script_fee_cents_by_length[episode.length_format]
      share      = agreement.type_share_pct_by_assignment_type[assignment.assignment_type]
      gross_fee_cents = round_half_up(base_cents * share)
    input_set: "One ScriptAssignment, its Episode (length_format) and the Season's GuildAgreement."
    constants:
      ROUNDING: round_half_up to whole cents
    precision: "whole cents, round_half_up"
    variants: []

  - name: guarantee_settlement
    trigger: >-
      "POST /episodes/{episode_id}/script-assignments (both variants evaluate at creation),
      POST /script-assignments/{assignment_id}/approve (CHRONOLOGICAL_ON_ACCEPTANCE re-settlement),
      POST /script-assignments/{assignment_id}/void (slot release and re-settlement)"
    algorithm: waterfall_allocation
    formula: |
      seat        = RoomSeat with id == assignment.room_seat_id
      capacity    = seat.episodic_guarantee_count
      offset_pct  = agreement.guarantee_offset_pct_by_level[seat.level_at_hire]
      # allocation is a waterfall over an ordered candidate list; the ORDER is the variant axis:
      allocate slots to the first `capacity` candidates in the variant's order;
      for every non-VOID assignment of the seat:
          guarantee_slot_applied = (assignment is inside the allocated prefix)
          guarantee_offset_cents = round_half_up(gross_fee_cents * offset_pct) if guarantee_slot_applied else 0
          payable_fee_cents      = gross_fee_cents - guarantee_offset_cents
      seat.guarantee_slots_consumed  = count(non-VOID assignments of the seat with guarantee_slot_applied)
      seat.guarantee_slots_remaining = capacity - seat.guarantee_slots_consumed
    input_set: >-
      All ScriptAssignments whose room_seat_id == seat.id and whose status != VOID. VOID assignments are
      excluded from the candidate list and free their slot.
    constants:
      SLOT_UNIT: "one assignment consumes exactly one slot regardless of assignment_type"
      ROUNDING: round_half_up on the offset
    precision: "whole cents, round_half_up"
    variants:
      - name: forward_commit
        when: "Season.guarantee_application_mode == FORWARD_COMMIT"
        difference: >-
          Candidate order is ScriptAssignment.created_at ASC (tie-break: none needed, created_at is
          unique per row) over assignments with status != VOID, so a slot is committed at CREATION time
          and the earliest-created assignment wins the guarantee even if a later-created assignment is
          approved first. Approval performs no re-settlement.
      - name: chronological_on_acceptance
        when: "Season.guarantee_application_mode == CHRONOLOGICAL_ON_ACCEPTANCE"
        difference: >-
          Candidate order is ScriptAssignment.approved_at ASC with tie-break created_at ASC over
          assignments with status == APPROVED only, so an assignment carries no slot at creation
          (payable_fee_cents == gross_fee_cents) and the slot is granted at APPROVAL time in approval
          order. Every flip appends a GUARANTEE_REALLOCATION FeeLedgerEntry for the signed delta of
          payable_fee_cents.
    note: >-
      Dual-variant instance #1, on the money domain (ScriptAssignment fees and the season fee ledger).
      Identical inputs diverge: seat guarantee capacity 1, STORY_EDITOR offset 0.5, assignment A1 on a
      ONE_HOUR episode (gross 3500000) created first, A2 on a HALF_HOUR episode (gross 1750000) created
      second, A2 approved before A1. forward_commit -> A1.payable 1750000, A2.payable 1750000,
      Season.script_fee_committed_cents 3500000. chronological_on_acceptance -> A2.payable 875000,
      A1.payable 3500000, Season.script_fee_committed_cents 4375000.

  - name: credit_share_determination
    trigger: >-
      "POST /episodes/{episode_id}/credit-submissions/close (provisional_normalized),
      POST /credit-arbitrations/{arbitration_id}/votes (recompute of leading_writer_id and
      concurrence_pct), POST /credit-arbitrations/{arbitration_id}/determine (arbitrated_panel_mean)"
    algorithm: weighted_scoring
    formula: |
      # ELIGIBILITY (applied at submission close):
      submission.status = ELIGIBLE  if submission.status == SUBMITTED
                                    AND the writer has >= 1 ScriptAssignment on the episode
                                        with status == APPROVED
                          INELIGIBLE otherwise
      # SHARE NORMALISATION (shared by both variants; `weight_w` is the variant axis):
      denominator = sum(weight_w over ELIGIBLE writers)
      raw_w   = weight_w / denominator * 100
      floor_w = floor(raw_w)
      remainder = 100 - sum(floor_w)
      order ELIGIBLE writers by (raw_w - floor_w) DESC, tie-break CreditSubmission.created_at ASC;
      add exactly 1 percentage point to each of the first `remainder` writers in that order
      share_w = floor_w + (1 if w received a remainder point else 0)
      # LEADER AND CONCURRENCE (arbitration only):
      mean_w            = sum(ballot[w] for ballot in vote_ledger.values()) / votes_cast_count
      leading_writer_id = writer with max mean_w; tie-break CreditSubmission.created_at ASC
      concurring        = count(ballot for ballot in vote_ledger.values()
                                if abs(ballot[leading_writer_id] - mean_leading)
                                   <= agreement.arbitration_concurrence_band_pct)
      concurrence_pct   = round_half_up(concurring / votes_cast_count, 3)
      # CREDIT THRESHOLD (inclusive):
      receives_credit = (final share_w >= agreement.credit_share_threshold_pct)
    input_set: >-
      CreditSubmissions of one Episode with status == ELIGIBLE after the close-time filter, plus every
      ballot in CreditArbitration.vote_ledger for the arbitrated variant. Submissions with status
      INELIGIBLE contribute neither weight nor share and never receive credit.
    constants:
      TOTAL_SHARE_PCT: 100
      REMAINDER_RULE: "largest fractional part first, tie-break CreditSubmission.created_at ASC"
      THRESHOLD_COMPARISON: ">= credit_share_threshold_pct"
    precision: "integer percentage points; concurrence_pct to 3 decimals, round_half_up"
    variants:
      - name: provisional_normalized
        when: "POST /episodes/{episode_id}/credit-submissions/close"
        difference: >-
          weight_w = CreditSubmission.claimed_contribution_pct (the writer's own claim), so the split is
          driven purely by self-reported contribution and written to
          CreditSubmission.provisional_share_pct and Episode.provisional_credit_shares.
      - name: arbitrated_panel_mean
        when: "POST /credit-arbitrations/{arbitration_id}/determine on the DETERMINED branch"
        difference: >-
          weight_w = mean_w, the arithmetic mean of the three panel ballots for that writer, so the
          split is driven by the panel rather than the claims and is written to
          CreditSubmission.arbitrated_share_pct and Episode.final_credit_shares. Identical submissions
          therefore yield a different split whenever the panel mean differs from the claim ratio.
    note: >-
      Dual-variant instance #2, on the credit/authorship domain (Writer credit shares on an Episode) -
      a different entity domain from guarantee_settlement's money ledger.

  - name: clearance_risk_score
    trigger: "POST /clearance-items/{item_id}/decide"
    algorithm: weighted_scoring
    formula: |
      multiplier = { CLEARED: 0, CONDITIONAL: 1, BLOCKED: 4 }
      item.risk_weight = agreement.clearance_item_weights[item.item_type] * multiplier[item.decision]
      review.risk_score = min(100, sum(item.risk_weight
                                       for item in review.items
                                       if item.decision IN {CLEARED, CONDITIONAL, BLOCKED}))
      review.decided_item_count = count(item for item in review.items
                                        if item.decision IN {CLEARED, CONDITIONAL, BLOCKED})
      # posture is then re-derived by state machine ClearanceReview:
      #   BLOCKED      if any item.decision == BLOCKED
      #   ESCALATED    else if risk_score >  agreement.clearance_escalation_score
      #   CONDITIONAL  else if risk_score >  0
      #   CLEARED      else if item_count >= 1 AND decided_item_count == item_count
      #   PENDING      otherwise (including the empty-item review)
    input_set: >-
      ClearanceItems of one ClearanceReview with decision IN {CLEARED, CONDITIONAL, BLOCKED}; items
      still SUBMITTED contribute 0 and keep the review PENDING unless another item forces BLOCKED.
    constants:
      SCORE_CAP: 100
      ESCALATION_COMPARISON: "> clearance_escalation_score (strictly greater)"
    precision: "integer score"
    variants: []

  - name: script_coverage_index
    trigger: >-
      "every transition that changes an Episode.script_readiness or Episode.clearance_posture: assignment
      create, assignment approve, assignment void, seat release (CASCADE B link 3), room wrap, clearance
      item decide, clearance waiver, episode lock"
    algorithm: threshold
    formula: |
      Season.ready_script_count = count(episode for episode in season.episodes
                                        if episode.script_readiness IN {READY, LOCKED}
                                        AND episode.clearance_posture IN {CLEARED, CONDITIONAL_WAIVED})
      Season.coverage_gap = max(0, Season.ready_script_target - Season.ready_script_count)
      Season.coverage_posture = COVERED  if Season.coverage_gap == 0
                                AT_RISK  else if Season.coverage_gap <= 2
                                CRITICAL otherwise
      # Gate used by POST /episodes/{episode_id}/lock-for-production, evaluated AFTER the episode's own
      # readiness is counted: Season.ready_script_count >= Season.ready_script_target (>=, not >).
    input_set: >-
      Episodes of one Season; episodes with script_readiness IN {NOT_STARTED, IN_PROGRESS} or with
      clearance_posture IN {PENDING, CONDITIONAL, ESCALATED, BLOCKED} are excluded from the count. The
      count is order-insensitive.
    constants:
      AT_RISK_MAX_GAP: 2
      LOCK_COMPARISON: ">= ready_script_target (inclusive)"
    precision: "integer counts"
    variants: []

  - name: milestone_schedule_derivation
    trigger: >-
      "POST /episodes/{episode_id}/script-assignments (initial derivation) and
      POST /seasons/{season_id}/reschedule (CASCADE A links 2 and 3 re-derivation)"
    algorithm: constraint_propagation
    formula: |
      lead_days = { OUTLINE:            agreement.outline_lead_days,
                    FIRST_DRAFT:        agreement.first_draft_lead_days,
                    SECOND_DRAFT:       agreement.second_draft_lead_days,
                    PRODUCTION_POLISH:  agreement.polish_lead_days }
      due_date(type) = (UTC calendar date of episode.production_start_date - lead_days[type] days)
                       stamped at 23:59:59.999Z
      assignment.outline_due_date      = due_date(OUTLINE)
      assignment.first_draft_due_date  = due_date(FIRST_DRAFT)
      assignment.second_draft_due_date = due_date(SECOND_DRAFT)
      assignment.polish_due_date       = due_date(PRODUCTION_POLISH)
      milestone.due_date               = due_date(milestone.milestone_type)
      # Propagation on reschedule: Season.production_start_date delta d
      #   -> every Episode.production_start_date += d
      #   -> every non-VOID assignment's four due-date fields re-derived
      #   -> every Milestone.due_date re-derived and PENDING<->LATE re-evaluated against the clock
      #   -> every assignment's late_milestone_count recomputed
      # Fixed point is reached in one pass; no milestone feeds back into an episode date.
    input_set: >-
      One Episode's non-VOID ScriptAssignments and their Milestones; VOID assignments and their
      milestones keep their stale dates and are never re-derived.
    constants:
      DUE_TIME_OF_DAY: "23:59:59.999Z"
    precision: "millisecond-stamped UTC datetimes; whole-day arithmetic on calendar dates"
    variants: []

  - name: fee_ledger_conservation
    trigger: >-
      "invariant re-checked after POST /episodes/{episode_id}/script-assignments,
      POST /script-assignments/{assignment_id}/approve and POST /script-assignments/{assignment_id}/void"
    algorithm: aggregation
    formula: |
      Season.script_fee_committed_cents ==
          sum(entry.amount_cents for entry in FeeLedgerEntry if entry.season_id == season.id)
      AND for every VOID assignment:
          sum(entry.amount_cents for entry in FeeLedgerEntry if entry.assignment_id == assignment.id) == 0
      # Conserved quantity: season committed script money. A create followed by its compensating void
      # MUST leave Season.script_fee_committed_cents byte-identical to its pre-create value.
    input_set: >-
      Every FeeLedgerEntry of the season, all entry_types included; the ledger is append-only so no
      entry is ever mutated or deleted.
    constants: {}
    precision: "whole cents; signed integer sum"
    variants: []

  - name: guarantee_slot_conservation
    trigger: >-
      "invariant re-checked after POST /episodes/{episode_id}/script-assignments,
      POST /script-assignments/{assignment_id}/approve, POST /script-assignments/{assignment_id}/void"
    algorithm: aggregation
    formula: |
      for every RoomSeat:
          seat.episodic_guarantee_count ==
              seat.guarantee_slots_consumed + seat.guarantee_slots_remaining
          AND seat.guarantee_slots_consumed ==
              count(a for a in assignments where a.room_seat_id == seat.id
                    AND a.status != VOID AND a.guarantee_slot_applied)
      # Conserved quantity: episodic guarantee slots (a COUNT, not money). Voiding an assignment that
      # held a slot MUST return guarantee_slots_remaining to its pre-assignment value.
    input_set: "All ScriptAssignments of one RoomSeat; VOID assignments are excluded from the consumed count."
    constants: {}
    precision: "integer counts"
    variants: []

  - name: seat_capacity_conservation
    trigger: >-
      "invariant re-checked after POST /rooms/{room_id}/seats, POST /room-seats/{seat_id}/decline,
      POST /room-seats/{seat_id}/withdraw, POST /room-seats/{seat_id}/release"
    algorithm: aggregation
    formula: |
      for every WritersRoom:
          room.seat_capacity == room.filled_seat_count + room.open_seat_count
          AND room.filled_seat_count == count(s for s in room.seats
                                              if s.status IN {OFFERED, CONFIRMED})
          AND room.confirmed_seat_count == count(s for s in room.seats if s.status == CONFIRMED)
      # Conserved quantity: room seats (a COUNT of a physical resource). An offer followed by its
      # compensating withdraw MUST return open_seat_count to its pre-offer value.
    input_set: "All RoomSeats of one WritersRoom, partitioned by status."
    constants: {}
    precision: "integer counts"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of {StudioExecutive, Showrunner, Writer, GuildAdministrator, LegalCounsel}"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: >-
      for the entity_backed roles Writer and Showrunner, X-User-ID is the id of an existing Writer row
    error_id: ERR_ACTING_WRITER_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints whose roles include Writer or Showrunner"
  - priority: 5
    category: existence
    check: >-
      every path-segment resource exists, validated left to right: GuildAgreement -> Season -> Episode
      -> ScriptAssignment -> Milestone; WritersRoom -> RoomSeat; ClearanceReview -> ClearanceItem;
      CreditArbitration; FeeLedgerEntry; Writer
    error_id: ERR_AGREEMENT_NOT_FOUND | ERR_SEASON_NOT_FOUND | ERR_WRITER_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_SEAT_NOT_FOUND | ERR_EPISODE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_ARBITRATION_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: existence
    check: >-
      every body-referenced resource exists: guild_agreement_id, showrunner_writer_id, writer_id,
      agreement_id, predecessor_assignment_id, reviewed_draft_milestone_id, each id in arbiter_writer_ids
    error_id: ERR_AGREEMENT_NOT_FOUND | ERR_WRITER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_MILESTONE_NOT_FOUND
    http_status: 404
    applies_to: "POST /seasons, POST /writers, POST /writers/{writer_id}/credit-history, POST /rooms/{room_id}/seats, POST /episodes/{episode_id}/script-assignments, POST /script-assignments/{assignment_id}/clearance-reviews, POST /episodes/{episode_id}/credit-arbitration"
  - priority: 10
    category: business_constraint
    check: >-
      request body satisfies the declared field schema: required fields present, types correct, enum
      members valid, integers within their declared ranges, object rate-card keys exactly as declared
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 11
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 12
    category: business_temporal
    check: >-
      every supplied interval is well formed: end_date strictly after start_date on AvailabilityWindow,
      WritersRoom and RoomSeat; Season.staffing_window_end >= staffing_window_start;
      Season.production_start_date strictly after Season.staffing_window_end
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /seasons, POST /writers/{writer_id}/availability-windows, POST /seasons/{season_id}/rooms, POST /rooms/{room_id}/seats"
  - priority: 13
    category: business_constraint
    check: >-
      vote_shares keys are exactly CreditArbitration.participant_writer_ids and its integer values sum
      to exactly 100
    error_id: ERR_VOTE_SHARES_INVALID
    http_status: 422
    applies_to: "POST /credit-arbitrations/{arbitration_id}/votes"
  - priority: 15
    category: auth
    check: >-
      the acting entity owns the resource: role Writer acting on a RoomSeat has X-User-ID ==
      seat.writer_id; on a Milestone has X-User-ID == assignment.writer_id; on a CreditSubmission has
      X-User-ID == payload.writer_id
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /room-seats/{seat_id}/accept, POST /room-seats/{seat_id}/decline, POST /milestones/{milestone_id}/deliver, POST /episodes/{episode_id}/credit-submissions"
  - priority: 16
    category: auth
    check: >-
      role Showrunner acting on a season's episodes has X-User-ID == Season.showrunner_writer_id of that
      episode's season
    error_id: ERR_NOT_SEASON_SHOWRUNNER
    http_status: 403
    applies_to: "POST /episodes/{episode_id}/script-assignments, POST /script-assignments/{assignment_id}/issue-notes, POST /script-assignments/{assignment_id}/approve, POST /episodes/{episode_id}/lock-for-production, POST /episodes/{episode_id}/credit-submissions/close"
  - priority: 20
    category: state
    check: >-
      the OCC field matches the parent's current version: expected_room_version == WritersRoom.version,
      expected_episode_version == Episode.version, expected_season_version == Season.version
    error_id: ERR_STALE_ROOM_VERSION | ERR_STALE_EPISODE_VERSION | ERR_STALE_SEASON_VERSION
    http_status: 412
    applies_to: "POST /rooms/{room_id}/seats, POST /rooms/{room_id}/reconfigure, POST /episodes/{episode_id}/script-assignments, POST /seasons/{season_id}/reschedule"
  - priority: 30
    category: state
    check: >-
      the target resource is in a state that admits the operation: room.status == OPEN for
      open-staffing; room.status == STAFFING for seat offers and reconfigure; room.status == STAFFING for activate; room.status == ACTIVE for wrap;
      seat.status == OFFERED for accept/decline/withdraw; seat.status == CONFIRMED for release;
      assignment.status == DELIVERED for issue-notes and approve; assignment.status IN {DRAFTING,
      IN_NOTES} for milestone delivery; assignment.status non-terminal for void; episode.script_readiness
      == READY for lock; episode.credit_status == SUBMISSIONS_OPEN for close; episode.credit_status ==
      SUBMISSIONS_CLOSED for arbitration initiation; arbitration.status admits the ballot or
      determination; item.decision == SUBMITTED for a decision; review.posture == CONDITIONAL for a waiver
    error_id: ERR_ROOM_NOT_ACCEPTING_SEATS | ERR_ROOM_NOT_ACTIVE | ERR_SEAT_NOT_OFFERED | ERR_SEAT_NOT_CONFIRMED | ERR_SEATS_STILL_OFFERED | ERR_ROOM_HAS_NO_CONFIRMED_SEATS | ERR_ASSIGNMENT_NOT_DELIVERED | ERR_ASSIGNMENT_NOT_DRAFTING | ERR_ASSIGNMENT_ALREADY_TERMINAL | ERR_MILESTONE_NOT_DELIVERABLE | ERR_EPISODE_NOT_READY | ERR_EPISODE_ALREADY_LOCKED | ERR_SUBMISSION_WINDOW_CLOSED | ERR_ARBITRATION_NOT_AVAILABLE | ERR_ARBITRATION_CLOSED | ERR_PANEL_INCOMPLETE | ERR_POLICY_OVERRIDE_NOT_APPLICABLE | ERR_ITEM_ALREADY_DECIDED | ERR_WAIVER_NOT_APPLICABLE | ERR_REVIEW_WAIVED
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 40
    category: business_safety
    check: >-
      segregation of duties on approval: a Showrunner may not approve a ScriptAssignment whose
      writer_id equals the acting X-User-ID (a StudioExecutive must approve instead)
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /script-assignments/{assignment_id}/approve"
  - priority: 41
    category: business_safety
    check: >-
      segregation of duties on arbitration: no id in arbiter_writer_ids may belong to a writer holding a
      non-VOID ScriptAssignment or any CreditSubmission on the episode under arbitration, and the three
      ids must be distinct
    error_id: ERR_ARBITER_IS_PARTICIPANT
    http_status: 422
    applies_to: "POST /episodes/{episode_id}/credit-arbitration"
  - priority: 45
    category: business_safety
    check: >-
      guild compensation floor: offered_weekly_compensation_cents >=
      GuildAgreement.min_weekly_cents_by_level[level_at_hire]
    error_id: ERR_BELOW_GUILD_MINIMUM
    http_status: 422
    applies_to: "POST /rooms/{room_id}/seats"
  - priority: 46
    category: business_safety
    check: >-
      level requirement: level_at_hire is at most Writer.determined_level, or exactly one position above
      it when the seat is diversity_program_funded
    error_id: ERR_LEVEL_ABOVE_DETERMINED
    http_status: 422
    applies_to: "POST /rooms/{room_id}/seats"
  - priority: 47
    category: business_safety
    check: "diversity_program_funded seats require Writer.diversity_program_participant == true"
    error_id: ERR_DIVERSITY_FUNDING_INELIGIBLE
    http_status: 422
    applies_to: "POST /rooms/{room_id}/seats"
  - priority: 50
    category: business_safety
    check: >-
      clearance gate on locking: Episode.clearance_posture IN {CLEARED, CONDITIONAL_WAIVED};
      ERR_CLEARANCE_BLOCKED when the posture is BLOCKED, ERR_CLEARANCE_NOT_CLEARED for PENDING,
      CONDITIONAL or ESCALATED
    error_id: ERR_CLEARANCE_BLOCKED | ERR_CLEARANCE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /episodes/{episode_id}/lock-for-production"
  - priority: 51
    category: business_safety
    check: "a CONDITIONAL decision must carry a non-empty conditional_note"
    error_id: ERR_CONDITIONAL_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /clearance-items/{item_id}/decide"
  - priority: 55
    category: business_safety
    check: >-
      diversity staffing requirement at activation: room.confirmed_diversity_seat_count >=
      room.diversity_seats_required
    error_id: ERR_DIVERSITY_REQUIREMENT_UNMET
    http_status: 409
    applies_to: "POST /rooms/{room_id}/activate"
  - priority: 60
    category: business_temporal
    check: >-
      staffing season timing: Season.staffing_window_start <= RoomSeat.start_date <=
      Season.staffing_window_end
    error_id: ERR_OUTSIDE_STAFFING_WINDOW
    http_status: 422
    applies_to: "POST /rooms/{room_id}/seats"
  - priority: 61
    category: business_temporal
    check: "the logical clock is at or before Season.staffing_window_end when a room opens staffing"
    error_id: ERR_STAFFING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rooms/{room_id}/open-staffing"
  - priority: 62
    category: business_temporal
    check: >-
      a reschedule's new_production_start_date is strictly after Season.staffing_window_end and strictly
      after the logical clock
    error_id: ERR_RESCHEDULE_DATE_INVALID
    http_status: 422
    applies_to: "POST /seasons/{season_id}/reschedule"
  - priority: 65
    category: business_constraint
    check: >-
      writer interval exclusivity: the new RoomSeat's half-open interval [start_date, end_date) must not
      overlap any other RoomSeat of the same writer with status IN {OFFERED, CONFIRMED} when either seat
      has exclusivity == EXCLUSIVE; touching endpoints (new.start_date == existing.end_date) do NOT overlap
    error_id: ERR_WRITER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /rooms/{room_id}/seats"
  - priority: 66
    category: business_constraint
    check: >-
      availability containment: an AvailabilityWindow of the writer with status == OPEN must satisfy
      window.start_date <= seat.start_date AND seat.end_date <= window.end_date
    error_id: ERR_WRITER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rooms/{room_id}/seats, POST /room-seats/{seat_id}/accept"
  - priority: 67
    category: business_constraint
    check: >-
      production-unit turnaround: for two Episodes of one Season with the same production_unit, the
      CLOSED shoot windows [production_start_date, production_start_date + shoot_days - 1 day] expanded
      by GuildAgreement.turnaround_buffer_days on both sides must not intersect, i.e. reject when
      new.start <= existing.end + buffer AND existing.start <= new.end + buffer
    error_id: ERR_PRODUCTION_UNIT_CONFLICT
    http_status: 409
    applies_to: "POST /seasons/{season_id}/episodes"
  - priority: 68
    category: business_constraint
    check: >-
      capacity and uniqueness: room.open_seat_count >= 1 on a seat offer; MINI_ROOM rooms cap
      seat_capacity at 4; Writer.guild_member_id unique; (season_id, episode_number) unique;
      (episode_id, writer_id) unique for CreditSubmission; one CreditArbitration per Episode; one ballot
      per arbiter; one non-terminal ScriptAssignment per (episode, assignment_type)
    error_id: ERR_SEAT_CAPACITY_EXCEEDED | ERR_MINI_ROOM_SEAT_LIMIT | ERR_DUPLICATE_GUILD_MEMBER_ID | ERR_DUPLICATE_EPISODE_NUMBER | ERR_DUPLICATE_SUBMISSION | ERR_ARBITRATION_ALREADY_EXISTS | ERR_BALLOT_ALREADY_CAST | ERR_ASSIGNMENT_TYPE_CONFLICT
    http_status: 409
    applies_to: "POST /rooms/{room_id}/seats, POST /seasons/{season_id}/rooms, POST /writers, POST /seasons/{season_id}/episodes, POST /episodes/{episode_id}/credit-submissions, POST /episodes/{episode_id}/credit-arbitration, POST /credit-arbitrations/{arbitration_id}/votes, POST /episodes/{episode_id}/script-assignments"
  - priority: 69
    category: business_constraint
    check: >-
      revision cap: assignment.revision_round + 1 <= GuildAgreement.max_free_revision_rounds when notes
      are issued
    error_id: ERR_REVISION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /script-assignments/{assignment_id}/issue-notes"
  - priority: 70
    category: business_referential
    check: >-
      staffing linkage: the assigned writer has a RoomSeat with status == CONFIRMED in a WritersRoom of
      the episode's season with status == ACTIVE (the ScriptAssignment.room_seat_id selector's candidate
      set is non-empty)
    error_id: ERR_WRITER_NOT_STAFFED
    http_status: 409
    applies_to: "POST /episodes/{episode_id}/script-assignments"
  - priority: 71
    category: business_referential
    check: >-
      predecessor linkage: REWRITE and PRODUCTION_POLISH require a predecessor_assignment_id of the same
      episode with status == APPROVED; the other three types must omit it
    error_id: ERR_PREDECESSOR_NOT_APPROVED | ERR_PREDECESSOR_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /episodes/{episode_id}/script-assignments"
  - priority: 72
    category: business_referential
    check: >-
      review linkage: reviewed_draft_milestone_id belongs to the path assignment and has status IN
      {DELIVERED, NOTES_ISSUED, ACCEPTED}
    error_id: ERR_MILESTONE_NOT_IN_ASSIGNMENT
    http_status: 422
    applies_to: "POST /script-assignments/{assignment_id}/clearance-reviews"
  - priority: 73
    category: business_referential
    check: "the acting writer's X-User-ID appears in CreditArbitration.arbiter_writer_ids"
    error_id: ERR_ARBITER_NOT_ON_PANEL
    http_status: 403
    applies_to: "POST /credit-arbitrations/{arbitration_id}/votes"
  - priority: 74
    category: business_referential
    check: >-
      submission set non-empty: at least one CreditSubmission of the episode passes the ELIGIBLE filter
      of calculation credit_share_determination at close time, and CreditArbitration
      participant_writer_ids is non-empty at initiation
    error_id: ERR_NO_ELIGIBLE_SUBMISSIONS
    http_status: 422
    applies_to: "POST /episodes/{episode_id}/credit-submissions/close, POST /episodes/{episode_id}/credit-arbitration"
  - priority: 75
    category: business_fiscal
    check: >-
      staffing budget: Season.staffing_commitment_weekly_cents + the new seat's
      weekly_compensation_cents <= Season.staffing_budget_weekly_cents on a seat offer, and
      Season.staffing_commitment_weekly_cents <= Season.staffing_budget_weekly_cents at room activation
    error_id: ERR_SEASON_STAFFING_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /rooms/{room_id}/seats, POST /rooms/{room_id}/activate"
  - priority: 76
    category: business_fiscal
    check: >-
      script fee budget: Season.script_fee_committed_cents + the new assignment's payable_fee_cents <=
      Season.script_fee_budget_cents
    error_id: ERR_SCRIPT_FEE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /episodes/{episode_id}/script-assignments"
  - priority: 80
    category: business_constraint
    check: >-
      script coverage of production needs: Season.ready_script_count >= Season.ready_script_target,
      counting the episode being locked (inclusive comparison)
    error_id: ERR_SCRIPT_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /episodes/{episode_id}/lock-for-production"

endpoints:
  # ---- Guild agreement (rate card / configuration) ----
  - method: POST
    path: "/guild-agreements"
    description: "Register the Minimum Basic Agreement rate card that governs a season."
    roles: [GuildAdministrator]
    code: 201
    input: ["mba_year", "min_weekly_cents_by_level", "script_fee_cents_by_length", "type_share_pct_by_assignment_type", "guarantee_offset_pct_by_level", "level_credit_thresholds", "diversity_subsidy_pct?", "diversity_subsidy_cap_weekly_cents", "mini_room_floor_multiplier?", "short_commitment_weeks_threshold?", "short_commitment_uplift_pct?", "facility_fee_tiers", "facility_tier_subtotal_bounds", "format_surcharge_pct", "max_free_revision_rounds?", "credit_share_threshold_pct?", "arbitration_concurrence_pct?", "arbitration_concurrence_band_pct?", "outline_lead_days", "first_draft_lead_days", "second_draft_lead_days", "polish_lead_days", "turnaround_buffer_days?", "clearance_item_weights", "clearance_escalation_score?"]
    output: GuildAgreement
    side_effects: ["none - configuration row only"]
  - method: GET
    path: "/guild-agreements/{agreement_id}"
    description: "Read one guild agreement rate card."
    roles: [GuildAdministrator, StudioExecutive, Showrunner, LegalCounsel, Writer]
    code: 200
    input: []
    output: GuildAgreement
    side_effects: []
  - method: GET
    path: "/guild-agreements"
    description: "List guild agreement rate cards, newest first by created_at."
    roles: [GuildAdministrator, StudioExecutive, Showrunner, LegalCounsel, Writer]
    code: 200
    input: ["mba_year?", "limit?", "offset?"]
    output: GuildAgreement[]
    side_effects: []

  # ---- Writers ----
  - method: POST
    path: "/writers"
    description: "Register a guild writer and derive the initial determined_level from career credits."
    roles: [GuildAdministrator]
    code: 201
    input: ["legal_name", "guild_member_id", "agreement_id", "career_episodic_credits?", "diversity_program_participant?", "is_showrunner_eligible?"]
    output: Writer
    side_effects: ["runs calculation writer_level_determination and sets determined_level and level_determination_agreement_id"]
  - method: POST
    path: "/writers/{writer_id}/credit-history"
    description: "Award episodic credits to a writer and re-derive determined_level against a guild agreement."
    roles: [GuildAdministrator]
    code: 200
    input: ["episodic_credits_awarded", "agreement_id"]
    output: Writer
    side_effects: ["increases career_episodic_credits", "re-runs calculation writer_level_determination and may raise determined_level", "increments Writer.version by 1"]
  - method: GET
    path: "/writers/{writer_id}"
    description: "Read one writer with the derived level and staffing counters."
    roles: [GuildAdministrator, StudioExecutive, Showrunner, LegalCounsel, Writer]
    code: 200
    input: []
    output: Writer
    side_effects: []
  - method: GET
    path: "/writers"
    description: "List writers, filterable by derived level and diversity-program flag."
    roles: [GuildAdministrator, StudioExecutive, Showrunner, LegalCounsel, Writer]
    code: 200
    input: ["determined_level?", "diversity_program_participant?", "limit?", "offset?"]
    output: Writer[]
    side_effects: []

  # ---- Availability windows ----
  - method: POST
    path: "/writers/{writer_id}/availability-windows"
    description: "Declare a window in which the writer is available for a room commitment."
    roles: [Writer, GuildAdministrator]
    code: 201
    input: ["start_date", "end_date", "commitment_type"]
    output: AvailabilityWindow
    side_effects: ["window starts in status OPEN"]
  - method: GET
    path: "/availability-windows/{window_id}"
    description: "Read one availability window."
    roles: [GuildAdministrator, StudioExecutive, Showrunner, Writer]
    code: 200
    input: []
    output: AvailabilityWindow
    side_effects: []
  - method: GET
    path: "/availability-windows"
    description: "List availability windows, filterable by writer, consuming seat and status."
    roles: [GuildAdministrator, StudioExecutive, Showrunner, Writer]
    code: 200
    input: ["writer_id?", "consumed_by_seat_id?", "status?", "limit?", "offset?"]
    output: AvailabilityWindow[]
    side_effects: []

  # ---- Seasons ----
  - method: POST
    path: "/seasons"
    description: "Open a scripted season under a guild agreement with its staffing window, production start and coverage target."
    roles: [StudioExecutive]
    code: 201
    input: ["guild_agreement_id", "showrunner_writer_id", "title", "episode_order", "length_format", "production_start_date", "staffing_window_start", "staffing_window_end", "ready_script_target", "guarantee_application_mode?", "staffing_budget_weekly_cents", "script_fee_budget_cents"]
    output: Season
    side_effects: ["initialises staffing_commitment_weekly_cents, script_fee_committed_cents and ready_script_count to 0", "runs calculation script_coverage_index and sets coverage_posture and coverage_gap"]
  - method: POST
    path: "/seasons/{season_id}/reschedule"
    description: "Move the season's production start date; head of CASCADE A."
    roles: [StudioExecutive]
    code: 200
    input: ["new_production_start_date", "expected_season_version"]
    output: Season
    side_effects: ["shifts every non-LOCKED Episode.production_start_date of the season by the same signed delta", "re-runs calculation milestone_schedule_derivation for every ScriptAssignment of those episodes", "re-evaluates every PENDING/LATE Milestone against the logical clock and flips PENDING<->LATE", "recomputes ScriptAssignment.late_milestone_count", "re-runs calculation script_coverage_index for the season", "increments Season.version by 1"]
  - method: GET
    path: "/seasons/{season_id}"
    description: "Read one season with its live staffing commitment, fee commitment and coverage posture."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: GET
    path: "/seasons"
    description: "List seasons, filterable by governing agreement and showrunner."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: ["guild_agreement_id?", "showrunner_writer_id?", "coverage_posture?", "limit?", "offset?"]
    output: Season[]
    side_effects: []

  # ---- Writers rooms ----
  - method: POST
    path: "/seasons/{season_id}/rooms"
    description: "Configure a writers room for the season in one of the IN_PERSON, REMOTE or MINI_ROOM formats with a duration commitment."
    roles: [Showrunner, StudioExecutive]
    code: 201
    input: ["name", "format", "seat_capacity", "duration_weeks_committed", "start_date", "end_date", "diversity_seats_required?"]
    output: WritersRoom
    side_effects: ["room starts in status OPEN with open_seat_count = seat_capacity", "runs calculation room_weekly_burn on an empty seat set and sets facility_tier"]
  - method: POST
    path: "/rooms/{room_id}/open-staffing"
    description: "Open the room for seat offers."
    roles: [Showrunner]
    code: 200
    input: []
    output: WritersRoom
    side_effects: ["status OPEN -> STAFFING", "increments WritersRoom.version by 1"]
  - method: POST
    path: "/rooms/{room_id}/reconfigure"
    description: "Change the room format and duration commitment while staffing; head of CASCADE C."
    roles: [StudioExecutive]
    code: 200
    input: ["format", "duration_weeks_committed", "expected_room_version"]
    output: WritersRoom
    side_effects: ["status STAFFING -> STAFFING (self-loop)", "re-runs calculation seat_weekly_compensation for every OFFERED or CONFIRMED seat of the room, updating weekly_compensation_cents, guild_floor_weekly_cents, diversity_subsidy_weekly_cents and studio_charge_weekly_cents", "re-runs calculation room_weekly_burn, updating seat_subtotal_weekly_cents, facility_tier, facility_surcharge_weekly_cents and weekly_burn_cents", "re-runs calculation season_staffing_commitment for the season", "increments WritersRoom.version by 1"]
  - method: POST
    path: "/rooms/{room_id}/activate"
    description: "Activate a fully staffed room so its writers can take script assignments."
    roles: [StudioExecutive]
    code: 200
    input: []
    output: WritersRoom
    side_effects: ["status STAFFING -> ACTIVE", "recomputes weekly_burn_cents via calculation room_weekly_burn and Season.staffing_commitment_weekly_cents via calculation season_staffing_commitment; every AvailabilityWindow keeps the status it already held, since windows move to CONSUMED only on seat acceptance", "increments WritersRoom.version by 1"]
  - method: POST
    path: "/rooms/{room_id}/wrap"
    description: "Wrap an active room and release its remaining confirmed seats."
    roles: [Showrunner, StudioExecutive]
    code: 200
    input: []
    output: WritersRoom
    side_effects: ["status ACTIVE -> WRAPPED", "moves every CONFIRMED seat to RELEASED", "re-runs calculation season_staffing_commitment for the season", "increments WritersRoom.version by 1"]
  - method: GET
    path: "/rooms/{room_id}"
    description: "Read one writers room with its seat counters and weekly burn."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: []
    output: WritersRoom
    side_effects: []
  - method: GET
    path: "/rooms"
    description: "List writers rooms, filterable by season, format and status."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: ["season_id?", "format?", "status?", "limit?", "offset?"]
    output: WritersRoom[]
    side_effects: []

  # ---- Room seats (staffing) ----
  - method: POST
    path: "/rooms/{room_id}/seats"
    description: "Offer a seat in the room to a writer at a level with a weekly rate, exclusivity and episodic guarantee count."
    roles: [Showrunner]
    code: 201
    input: ["writer_id", "level_at_hire", "offered_weekly_compensation_cents", "exclusivity", "start_date", "end_date", "episodic_guarantee_count?", "diversity_program_funded?", "expected_room_version"]
    output: RoomSeat
    side_effects: ["runs calculation seat_weekly_compensation and sets guild_floor_weekly_cents, weekly_compensation_cents, diversity_subsidy_weekly_cents and studio_charge_weekly_cents", "runs calculation seat_prorated_commitment and sets prorated_commitment_cents", "sets guarantee_slots_remaining = episodic_guarantee_count", "seat starts in status OFFERED", "decrements WritersRoom.open_seat_count and increments filled_seat_count", "re-runs calculation room_weekly_burn for the room", "re-runs calculation season_staffing_commitment for the season", "increments WritersRoom.version by 1"]
  - method: POST
    path: "/room-seats/{seat_id}/accept"
    description: "Writer accepts the seat offer, consuming one availability window."
    roles: [Writer]
    code: 200
    input: []
    output: RoomSeat
    side_effects: ["status OFFERED -> CONFIRMED and stamps confirmed_at from the logical clock", "selects the containing OPEN AvailabilityWindow with the earliest start_date (created_at breaks ties), sets it to CONSUMED and stores its id in consumed_window_id and the window's consumed_by_seat_id", "increments WritersRoom.confirmed_seat_count and, for a diversity_program_funded seat, confirmed_diversity_seat_count", "increments Writer.active_seat_count", "increments RoomSeat.version by 1"]
  - method: POST
    path: "/room-seats/{seat_id}/decline"
    description: "Writer declines the seat offer."
    roles: [Writer]
    code: 200
    input: ["reason?"]
    output: RoomSeat
    side_effects: ["status OFFERED -> DECLINED", "increments WritersRoom.open_seat_count and decrements filled_seat_count", "re-runs calculation room_weekly_burn and calculation season_staffing_commitment", "increments RoomSeat.version by 1"]
  - method: POST
    path: "/room-seats/{seat_id}/withdraw"
    description: "Showrunner withdraws an outstanding seat offer."
    roles: [Showrunner]
    code: 200
    input: ["reason?"]
    output: RoomSeat
    side_effects: ["status OFFERED -> WITHDRAWN", "increments WritersRoom.open_seat_count and decrements filled_seat_count", "re-runs calculation room_weekly_burn and calculation season_staffing_commitment", "increments RoomSeat.version by 1"]
  - method: POST
    path: "/room-seats/{seat_id}/release"
    description: "Release a confirmed writer from the room; head of CASCADE B."
    roles: [StudioExecutive, Showrunner]
    code: 200
    input: ["reason?"]
    output: RoomSeat
    side_effects: ["status CONFIRMED -> RELEASED", "returns the consumed AvailabilityWindow to status OPEN and clears its consumed_by_seat_id", "decrements WritersRoom.confirmed_seat_count, confirmed_diversity_seat_count where applicable, and filled_seat_count; increments open_seat_count", "moves every non-terminal ScriptAssignment held through this seat to REASSIGNMENT_PENDING and clears its room_seat_id", "re-derives Episode.script_readiness for each affected episode", "re-runs calculation script_coverage_index for the season", "re-runs calculation room_weekly_burn and calculation season_staffing_commitment", "decrements Writer.active_seat_count", "increments RoomSeat.version by 1"]
  - method: GET
    path: "/room-seats/{seat_id}"
    description: "Read one room seat with its derived compensation and guarantee counters."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, Writer]
    code: 200
    input: []
    output: RoomSeat
    side_effects: []
  - method: GET
    path: "/room-seats"
    description: "List room seats, filterable by room, writer, consumed availability window and status."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, Writer]
    code: 200
    input: ["room_id?", "writer_id?", "consumed_window_id?", "status?", "limit?", "offset?"]
    output: RoomSeat[]
    side_effects: []

  # ---- Episodes ----
  - method: POST
    path: "/seasons/{season_id}/episodes"
    description: "Add an episode to the season with its production unit and shoot window."
    roles: [StudioExecutive]
    code: 201
    input: ["episode_number", "length_format", "production_unit", "production_start_date", "shoot_days?"]
    output: Episode
    side_effects: ["episode starts with script_readiness NOT_STARTED, credit_status PENDING and clearance_posture PENDING", "re-runs calculation script_coverage_index for the season"]
  - method: POST
    path: "/episodes/{episode_id}/lock-for-production"
    description: "Lock a ready episode for production once coverage and clearance both permit."
    roles: [StudioExecutive, Showrunner]
    code: 200
    input: []
    output: Episode
    side_effects: ["script_readiness READY -> LOCKED and stamps locked_at from the logical clock", "re-runs calculation script_coverage_index for the season", "increments Episode.version by 1"]
  - method: GET
    path: "/episodes/{episode_id}"
    description: "Read one episode with its script readiness, credit status and clearance posture."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: []
    output: Episode
    side_effects: []
  - method: GET
    path: "/episodes"
    description: "List episodes, filterable by season and by each parallel state dimension."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: ["season_id?", "script_readiness?", "credit_status?", "clearance_posture?", "limit?", "offset?"]
    output: Episode[]
    side_effects: []

  # ---- Script assignments ----
  - method: POST
    path: "/episodes/{episode_id}/script-assignments"
    description: "Assign a staffed writer to write the episode, deriving script fee, guarantee offset and the milestone schedule."
    roles: [Showrunner]
    code: 201
    input: ["writer_id", "assignment_type", "predecessor_assignment_id?", "expected_episode_version"]
    output: ScriptAssignment
    side_effects: ["selects the writer's CONFIRMED RoomSeat in an ACTIVE room of the season with the earliest start_date (created_at breaks ties) and stores it in room_seat_id", "runs calculation script_fee_derivation and sets gross_fee_cents", "runs calculation guarantee_settlement and sets guarantee_slot_applied, guarantee_offset_cents and payable_fee_cents; consumes one seat guarantee slot when applied", "runs calculation milestone_schedule_derivation and synthesizes the Milestone rows for this assignment_type (STORY -> [OUTLINE]; TELEPLAY and STORY_AND_TELEPLAY -> [OUTLINE, FIRST_DRAFT, SECOND_DRAFT]; REWRITE -> [FIRST_DRAFT]; PRODUCTION_POLISH -> [PRODUCTION_POLISH]) in status PENDING with their due dates, while all four due-date fields outline_due_date, first_draft_due_date, second_draft_due_date and polish_due_date are always populated on the assignment itself", "appends a SCRIPT_FEE_ACCRUAL FeeLedgerEntry of +gross_fee_cents and, when guarantee_slot_applied is true, a GUARANTEE_OFFSET entry of -guarantee_offset_cents; adds payable_fee_cents to Season.script_fee_committed_cents", "moves Episode.script_readiness NOT_STARTED -> IN_PROGRESS", "re-runs calculation script_coverage_index for the season", "increments Episode.version by 1"]
  - method: POST
    path: "/script-assignments/{assignment_id}/issue-notes"
    description: "Return a delivered script to the writer with notes, consuming one revision round."
    roles: [Showrunner]
    code: 200
    input: ["notes"]
    output: ScriptAssignment
    side_effects: ["status DELIVERED -> IN_NOTES then back to DRAFTING on the same call, closing one cycle of the assignment loop", "increments revision_round by 1", "moves the most recently DELIVERED Milestone to NOTES_ISSUED", "moves Episode.script_readiness READY -> IN_PROGRESS when the episode had been READY", "re-runs calculation script_coverage_index for the season", "increments ScriptAssignment.version by 1"]
  - method: POST
    path: "/script-assignments/{assignment_id}/approve"
    description: "Showrunner or studio approves the delivered script, settling the guarantee and advancing readiness."
    roles: [Showrunner, StudioExecutive]
    code: 200
    input: []
    output: ScriptAssignment
    side_effects: ["status DELIVERED -> APPROVED, stamps approved_at from the logical clock and records approved_by_role", "moves every DELIVERED or NOTES_ISSUED Milestone of the assignment to ACCEPTED", "re-runs calculation guarantee_settlement in the season's guarantee_application_mode, rewriting payable_fee_cents for this assignment and, in CHRONOLOGICAL_ON_ACCEPTANCE mode, for every later-approved assignment of the same seat", "appends one GUARANTEE_REALLOCATION FeeLedgerEntry per assignment whose payable_fee_cents changed, each carrying the signed delta, and moves Season.script_fee_committed_cents by the sum of those deltas", "sets Episode.approved_teleplay_assignment_id when assignment_type is TELEPLAY or STORY_AND_TELEPLAY", "moves Episode.script_readiness IN_PROGRESS -> READY when the approved assignment_type is TELEPLAY or STORY_AND_TELEPLAY", "moves Episode.credit_status PENDING -> SUBMISSIONS_OPEN on the episode's first APPROVED assignment of any type", "re-runs calculation script_coverage_index for the season", "increments ScriptAssignment.version by 1"]
  - method: POST
    path: "/script-assignments/{assignment_id}/void"
    description: "Void a non-terminal assignment, reversing its fee commitment and guarantee slot."
    roles: [Showrunner, StudioExecutive]
    code: 200
    input: ["reason"]
    output: ScriptAssignment
    side_effects: ["status DRAFTING, IN_NOTES or REASSIGNMENT_PENDING -> VOID", "leaves every Milestone of the assignment frozen at its current status (the Milestone enum has no cancelled member) and blocks any further delivery against them, because milestone delivery requires the owning assignment to be in DRAFTING or IN_NOTES (ERR_MILESTONE_NOT_DELIVERABLE)", "returns the consumed guarantee slot to the seat when guarantee_slot_applied is true", "appends a FEE_REVERSAL FeeLedgerEntry of -payable_fee_cents, which drives the assignment's own ledger sum to exactly 0, and subtracts payable_fee_cents from Season.script_fee_committed_cents", "moves Episode.script_readiness IN_PROGRESS -> NOT_STARTED when this was the episode's last non-terminal assignment and no assignment is APPROVED", "re-runs calculation script_coverage_index for the season", "increments ScriptAssignment.version by 1"]
  - method: GET
    path: "/script-assignments/{assignment_id}"
    description: "Read one script assignment with its fee breakdown and milestone due dates."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: []
    output: ScriptAssignment
    side_effects: []
  - method: GET
    path: "/script-assignments"
    description: "List script assignments, filterable by episode, writer, staffing seat, predecessor and status."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: ["episode_id?", "writer_id?", "room_seat_id?", "predecessor_assignment_id?", "status?", "limit?", "offset?"]
    output: ScriptAssignment[]
    side_effects: []

  # ---- Milestones ----
  - method: POST
    path: "/milestones/{milestone_id}/deliver"
    description: "Writer delivers an outline, draft or polish against its deadline."
    roles: [Writer]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status PENDING or LATE -> DELIVERED and stamps delivered_at from the logical clock", "sets days_late to the whole days by which delivered_at exceeds due_date, floored at 0", "moves the owning ScriptAssignment IN_NOTES -> DRAFTING first when the milestone was NOTES_ISSUED, then DRAFTING -> DELIVERED once every Milestone of the assignment has status IN {DELIVERED, NOTES_ISSUED, ACCEPTED}", "flips the milestone PENDING -> LATE first when the logical clock is past due_date", "recomputes ScriptAssignment.late_milestone_count", "increments Milestone.version by 1"]
  - method: GET
    path: "/milestones/{milestone_id}"
    description: "Read one milestone with its due date and lateness."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: []
    output: Milestone
    side_effects: []
  - method: GET
    path: "/milestones"
    description: "List milestones ordered by sequence_index ASC (OUTLINE, FIRST_DRAFT, SECOND_DRAFT, PRODUCTION_POLISH), filterable by assignment, type and status."
    roles: [StudioExecutive, Showrunner, GuildAdministrator, LegalCounsel, Writer]
    code: 200
    input: ["assignment_id?", "milestone_type?", "status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []

  # ---- Script clearance (legal) ----
  - method: POST
    path: "/script-assignments/{assignment_id}/clearance-reviews"
    description: "Open a legal clearance review over a delivered draft of the assignment."
    roles: [LegalCounsel]
    code: 201
    input: ["reviewed_draft_milestone_id"]
    output: ClearanceReview
    side_effects: ["review starts in posture PENDING with risk_score 0", "sets Episode.clearance_posture to PENDING"]
  - method: POST
    path: "/clearance-reviews/{review_id}/items"
    description: "Add a name, trademark or depiction item to a clearance review."
    roles: [LegalCounsel]
    code: 201
    input: ["item_type", "descriptor", "scene_reference"]
    output: ClearanceItem
    side_effects: ["sets risk_weight from GuildAgreement.clearance_item_weights[item_type]", "item starts with decision SUBMITTED", "increments ClearanceReview.item_count", "re-runs calculation clearance_risk_score and re-derives ClearanceReview.posture", "propagates the posture to Episode.clearance_posture", "increments ClearanceReview.version by 1"]
  - method: POST
    path: "/clearance-items/{item_id}/decide"
    description: "Record the legal decision on one clearance item."
    roles: [LegalCounsel]
    code: 200
    input: ["decision", "conditional_note?"]
    output: ClearanceItem
    side_effects: ["decision SUBMITTED -> CLEARED, CONDITIONAL or BLOCKED", "increments ClearanceReview.decided_item_count", "re-runs calculation clearance_risk_score and re-derives ClearanceReview.posture across CLEARED, CONDITIONAL, ESCALATED and BLOCKED", "propagates the posture to Episode.clearance_posture", "increments ClearanceItem.version by 1"]
  - method: POST
    path: "/clearance-reviews/{review_id}/waiver"
    description: "Grant a legal waiver over a CONDITIONAL review so the episode may lock."
    roles: [LegalCounsel]
    code: 200
    input: ["waiver_memo"]
    output: ClearanceReview
    side_effects: ["posture CONDITIONAL -> CONDITIONAL_WAIVED, sets legal_waiver_granted true and stores waiver_memo", "propagates CONDITIONAL_WAIVED to Episode.clearance_posture", "increments ClearanceReview.version by 1"]
  - method: GET
    path: "/clearance-reviews/{review_id}"
    description: "Read one clearance review with its risk score and posture."
    roles: [LegalCounsel, Showrunner, StudioExecutive]
    code: 200
    input: []
    output: ClearanceReview
    side_effects: []
  - method: GET
    path: "/clearance-reviews"
    description: "List clearance reviews, filterable by assignment, reviewed draft milestone and posture."
    roles: [LegalCounsel, Showrunner, StudioExecutive]
    code: 200
    input: ["assignment_id?", "reviewed_draft_milestone_id?", "posture?", "limit?", "offset?"]
    output: ClearanceReview[]
    side_effects: []
  - method: GET
    path: "/clearance-items/{item_id}"
    description: "Read one clearance item with its risk weight and decision."
    roles: [LegalCounsel, Showrunner, StudioExecutive]
    code: 200
    input: []
    output: ClearanceItem
    side_effects: []
  - method: GET
    path: "/clearance-items"
    description: "List clearance items, filterable by review, type and decision."
    roles: [LegalCounsel, Showrunner, StudioExecutive]
    code: 200
    input: ["review_id?", "item_type?", "decision?", "limit?", "offset?"]
    output: ClearanceItem[]
    side_effects: []

  # ---- Credit determination ----
  - method: POST
    path: "/episodes/{episode_id}/credit-submissions"
    description: "Writer submits a credit claim on the episode under guild credit rules."
    roles: [Writer]
    code: 201
    input: ["writer_id", "claim_basis", "claimed_contribution_pct"]
    output: CreditSubmission
    side_effects: ["submission starts in status SUBMITTED; requires Episode.credit_status == SUBMISSIONS_OPEN, which the episode's first APPROVED assignment opened", "increments Episode.version by 1"]
  - method: POST
    path: "/episodes/{episode_id}/credit-submissions/close"
    description: "Close the credit submission window and compute provisional shares."
    roles: [Showrunner, GuildAdministrator]
    code: 200
    input: []
    output: Episode
    side_effects: ["moves Episode.credit_status SUBMISSIONS_OPEN -> SUBMISSIONS_CLOSED", "runs calculation credit_share_determination in the PROVISIONAL_NORMALIZED variant, writing provisional_share_pct and receives_credit on every ELIGIBLE submission and the map into Episode.provisional_credit_shares", "sets each excluded submission's status to INELIGIBLE", "increments Episode.version by 1"]
  - method: POST
    path: "/episodes/{episode_id}/credit-arbitration"
    description: "Convene a three-arbiter guild panel over the episode's closed credit submissions."
    roles: [GuildAdministrator]
    code: 201
    input: ["arbiter_writer_ids"]
    output: CreditArbitration
    side_effects: ["moves Episode.credit_status SUBMISSIONS_CLOSED -> IN_ARBITRATION", "copies the episode's ELIGIBLE submission writer ids into participant_writer_ids", "arbitration starts in status INITIATED then STATEMENTS_OPEN on the same call", "increments Episode.version by 1"]
  - method: POST
    path: "/credit-arbitrations/{arbitration_id}/votes"
    description: "An arbiter casts a ballot allocating percentage shares across the participants."
    roles: [Writer]
    code: 200
    input: ["vote_shares"]
    output: CreditArbitration
    side_effects: ["moves status STATEMENTS_OPEN -> PANEL_VOTING on the first ballot", "records the ballot in vote_ledger and increments votes_cast_count", "re-runs the leader-and-concurrence block of calculation credit_share_determination on every ballot, updating leading_writer_id and concurrence_pct; the status stays PANEL_VOTING until determine is called", "increments CreditArbitration.version by 1"]
  - method: POST
    path: "/credit-arbitrations/{arbitration_id}/determine"
    description: "Apply the panel result, or a guild policy override after a deadlock, to the episode's credits."
    roles: [GuildAdministrator]
    code: 200
    input: ["policy_override?"]
    output: CreditArbitration
    side_effects: ["with policy_override absent or false: status PANEL_VOTING -> DETERMINED when concurrence_pct >= GuildAgreement.arbitration_concurrence_pct, otherwise PANEL_VOTING -> DEADLOCKED", "with policy_override true: status DEADLOCKED -> POLICY_REVIEW", "on the DETERMINED branch runs calculation credit_share_determination in the ARBITRATED_PANEL_MEAN variant; on the POLICY_REVIEW branch carries the provisional shares forward as final", "writes arbitrated_share_pct and receives_credit onto every participating CreditSubmission and the map into Episode.final_credit_shares", "sets determined_credit_string on both the arbitration and the episode, and sets outcome", "moves Episode.credit_status IN_ARBITRATION -> DETERMINED on the DETERMINED and POLICY_REVIEW branches; the DEADLOCKED branch leaves credit_status at IN_ARBITRATION", "increments CreditArbitration.version by 1"]
  - method: GET
    path: "/credit-submissions/{submission_id}"
    description: "Read one credit submission with its provisional and arbitrated shares."
    roles: [GuildAdministrator, Showrunner, StudioExecutive, Writer]
    code: 200
    input: []
    output: CreditSubmission
    side_effects: []
  - method: GET
    path: "/credit-submissions"
    description: "List credit submissions, filterable by episode, writer and status."
    roles: [GuildAdministrator, Showrunner, StudioExecutive, Writer]
    code: 200
    input: ["episode_id?", "writer_id?", "status?", "limit?", "offset?"]
    output: CreditSubmission[]
    side_effects: []
  - method: GET
    path: "/credit-arbitrations/{arbitration_id}"
    description: "Read one credit arbitration with its ballot ledger and concurrence."
    roles: [GuildAdministrator, Showrunner, StudioExecutive, Writer]
    code: 200
    input: []
    output: CreditArbitration
    side_effects: []
  - method: GET
    path: "/credit-arbitrations"
    description: "List credit arbitrations, filterable by episode and status."
    roles: [GuildAdministrator, Showrunner, StudioExecutive, Writer]
    code: 200
    input: ["episode_id?", "status?", "limit?", "offset?"]
    output: CreditArbitration[]
    side_effects: []

  # ---- Fee ledger (append-only money log) ----
  - method: GET
    path: "/fee-ledger-entries/{entry_id}"
    description: "Read one fee ledger entry."
    roles: [StudioExecutive, GuildAdministrator]
    code: 200
    input: []
    output: FeeLedgerEntry
    side_effects: []
  - method: GET
    path: "/fee-ledger-entries"
    description: "List fee ledger entries, filterable by season, assignment, writer and entry type; the conservation invariant is audited against this list."
    roles: [StudioExecutive, GuildAdministrator]
    code: 200
    input: ["season_id?", "assignment_id?", "writer_id?", "entry_type?", "limit?", "offset?"]
    output: FeeLedgerEntry[]
    side_effects: []

  # ---- Test-driving endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window and lateness rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [StudioExecutive, Showrunner, Writer, GuildAdministrator, LegalCounsel]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["subsequent reads of the logical clock return to_iso8601", "does not by itself mutate any entity; Milestone PENDING<->LATE re-evaluation happens on the next write that touches the milestone's assignment or season"]

errors:
  # ---- auth ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_ACTING_WRITER_NOT_FOUND
    http: 403
    condition: "X-User-ID of an entity_backed role (Writer, Showrunner) is not an existing Writer id"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting Writer is not the seat holder, milestone author or submitting writer of the target resource"
  - id: ERR_NOT_SEASON_SHOWRUNNER
    http: 403
    condition: "acting Showrunner is not Season.showrunner_writer_id of the target episode's season"
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: "a Showrunner attempts to approve a ScriptAssignment whose writer_id equals the acting X-User-ID"
  - id: ERR_ARBITER_NOT_ON_PANEL
    http: 403
    condition: "acting writer is not in CreditArbitration.arbiter_writer_ids"

  # ---- not found ----
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no GuildAgreement with the supplied id"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "no Season with the supplied id"
  - id: ERR_WRITER_NOT_FOUND
    http: 404
    condition: "no Writer with the supplied id"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "no AvailabilityWindow with the supplied id"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "no WritersRoom with the supplied id"
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "no RoomSeat with the supplied id"
  - id: ERR_EPISODE_NOT_FOUND
    http: 404
    condition: "no Episode with the supplied id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no ScriptAssignment with the supplied id"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "no Milestone with the supplied id"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "no ClearanceReview with the supplied id"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "no ClearanceItem with the supplied id"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "no CreditSubmission with the supplied id"
  - id: ERR_ARBITRATION_NOT_FOUND
    http: 404
    condition: "no CreditArbitration with the supplied id"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "no FeeLedgerEntry with the supplied id"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, negative money or count, or malformed rate-card object"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "end_date not strictly after start_date, or Season.production_start_date not strictly after staffing_window_end"
  - id: ERR_VOTE_SHARES_INVALID
    http: 422
    condition: "vote_shares keys are not exactly participant_writer_ids or its values do not sum to 100"
  - id: ERR_CONDITIONAL_NOTE_REQUIRED
    http: 422
    condition: "a CONDITIONAL clearance decision omits conditional_note or supplies an empty one"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_ROOM_VERSION
    http: 412
    condition: "expected_room_version does not equal the current WritersRoom.version"
  - id: ERR_STALE_EPISODE_VERSION
    http: 412
    condition: "expected_episode_version does not equal the current Episode.version"
  - id: ERR_STALE_SEASON_VERSION
    http: 412
    condition: "expected_season_version does not equal the current Season.version"

  # ---- state preconditions ----
  - id: ERR_ROOM_NOT_ACCEPTING_SEATS
    http: 409
    condition: "seat offer or reconfigure attempted on a room whose status is not STAFFING, or open-staffing attempted on a room whose status is not OPEN"
  - id: ERR_ROOM_NOT_ACTIVE
    http: 409
    condition: "wrap attempted on a room whose status is not ACTIVE"
  - id: ERR_SEATS_STILL_OFFERED
    http: 409
    condition: "activation attempted while the room still holds seats in status OFFERED"
  - id: ERR_ROOM_HAS_NO_CONFIRMED_SEATS
    http: 409
    condition: "activation attempted on a room with confirmed_seat_count = 0"
  - id: ERR_SEAT_NOT_OFFERED
    http: 409
    condition: "accept, decline or withdraw attempted on a seat whose status is not OFFERED"
  - id: ERR_SEAT_NOT_CONFIRMED
    http: 409
    condition: "release attempted on a seat whose status is not CONFIRMED"
  - id: ERR_ASSIGNMENT_NOT_DELIVERED
    http: 409
    condition: "issue-notes or approve attempted on an assignment whose status is not DELIVERED"
  - id: ERR_ASSIGNMENT_NOT_DRAFTING
    http: 409
    condition: "milestone delivery attempted while the owning assignment is not in DRAFTING or IN_NOTES"
  - id: ERR_ASSIGNMENT_ALREADY_TERMINAL
    http: 409
    condition: "void attempted on an assignment already in APPROVED or VOID"
  - id: ERR_MILESTONE_NOT_DELIVERABLE
    http: 409
    condition: "delivery attempted on a milestone whose status is not PENDING or LATE"
  - id: ERR_EPISODE_NOT_READY
    http: 409
    condition: "lock-for-production attempted while Episode.script_readiness is not READY"
  - id: ERR_EPISODE_ALREADY_LOCKED
    http: 409
    condition: "any write against an episode whose script_readiness is LOCKED"
  - id: ERR_SUBMISSION_WINDOW_CLOSED
    http: 409
    condition: "credit submission or close attempted while Episode.credit_status is not SUBMISSIONS_OPEN"
  - id: ERR_ARBITRATION_NOT_AVAILABLE
    http: 409
    condition: "arbitration convened while Episode.credit_status is not SUBMISSIONS_CLOSED"
  - id: ERR_ARBITRATION_ALREADY_EXISTS
    http: 409
    condition: "a second CreditArbitration convened on the same episode"
  - id: ERR_ARBITRATION_CLOSED
    http: 409
    condition: "ballot or determination attempted on an arbitration already in DETERMINED"
  - id: ERR_PANEL_INCOMPLETE
    http: 409
    condition: "determine attempted before all three ballots are cast"
  - id: ERR_BALLOT_ALREADY_CAST
    http: 409
    condition: "an arbiter casts a second ballot on the same arbitration"
  - id: ERR_POLICY_OVERRIDE_NOT_APPLICABLE
    http: 409
    condition: "policy_override supplied on an arbitration whose status is not DEADLOCKED, or omitted on one that is"
  - id: ERR_ITEM_ALREADY_DECIDED
    http: 409
    condition: "a decision is recorded on a ClearanceItem whose decision is not SUBMITTED"
  - id: ERR_REVIEW_WAIVED
    http: 409
    condition: "an item is added to or decided on a ClearanceReview already in CONDITIONAL_WAIVED"
  - id: ERR_WAIVER_NOT_APPLICABLE
    http: 409
    condition: "waiver requested on a review whose posture is not CONDITIONAL"
  - id: ERR_STAFFING_WINDOW_CLOSED
    http: 409
    condition: "staffing opened after the logical clock passed Season.staffing_window_end"

  # ---- business safety ----
  - id: ERR_BELOW_GUILD_MINIMUM
    http: 422
    condition: "offered_weekly_compensation_cents below the guild minimum for level_at_hire"
  - id: ERR_LEVEL_ABOVE_DETERMINED
    http: 422
    condition: "level_at_hire exceeds the writer's determined_level beyond the one-step diversity-program allowance"
  - id: ERR_DIVERSITY_FUNDING_INELIGIBLE
    http: 422
    condition: "diversity_program_funded seat offered to a writer who is not a diversity-program participant"
  - id: ERR_DIVERSITY_REQUIREMENT_UNMET
    http: 409
    condition: "activation attempted with confirmed_diversity_seat_count below diversity_seats_required"
  - id: ERR_ARBITER_IS_PARTICIPANT
    http: 422
    condition: "an arbiter holds a non-VOID assignment or a credit submission on the episode, or the three arbiter ids are not distinct"
  - id: ERR_CLEARANCE_BLOCKED
    http: 409
    condition: "lock attempted while Episode.clearance_posture is BLOCKED"
  - id: ERR_CLEARANCE_NOT_CLEARED
    http: 409
    condition: "lock attempted while Episode.clearance_posture is PENDING, CONDITIONAL or ESCALATED"

  # ---- temporal ----
  - id: ERR_OUTSIDE_STAFFING_WINDOW
    http: 422
    condition: "RoomSeat.start_date falls outside the season's staffing window"
  - id: ERR_RESCHEDULE_DATE_INVALID
    http: 422
    condition: "new_production_start_date is not strictly after both staffing_window_end and the logical clock"
  - id: ERR_WRITER_UNAVAILABLE
    http: 409
    condition: "no OPEN AvailabilityWindow of the writer contains the seat's whole interval"

  # ---- business constraints ----
  - id: ERR_WRITER_WINDOW_CONFLICT
    http: 409
    condition: "the seat's half-open interval overlaps another live seat of the same writer where either side is EXCLUSIVE"
  - id: ERR_PRODUCTION_UNIT_CONFLICT
    http: 409
    condition: "two episodes of one season share a production unit and their buffer-expanded shoot windows intersect"
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "seat offer attempted with WritersRoom.open_seat_count = 0"
  - id: ERR_MINI_ROOM_SEAT_LIMIT
    http: 422
    condition: "a MINI_ROOM is configured or reconfigured with seat_capacity above 4"
  - id: ERR_DUPLICATE_GUILD_MEMBER_ID
    http: 409
    condition: "guild_member_id already registered"
  - id: ERR_DUPLICATE_EPISODE_NUMBER
    http: 409
    condition: "episode_number already used within the season"
  - id: ERR_DUPLICATE_SUBMISSION
    http: 409
    condition: "the writer already has a CreditSubmission on the episode"
  - id: ERR_ASSIGNMENT_TYPE_CONFLICT
    http: 409
    condition: "a non-terminal assignment of the same assignment_type already exists on the episode"
  - id: ERR_REVISION_CAP_EXCEEDED
    http: 409
    condition: "notes issued when revision_round + 1 would exceed max_free_revision_rounds"

  # ---- referential ----
  - id: ERR_WRITER_NOT_STAFFED
    http: 409
    condition: "the assigned writer holds no CONFIRMED seat in an ACTIVE room of the episode's season"
  - id: ERR_PREDECESSOR_NOT_APPROVED
    http: 422
    condition: "a REWRITE or PRODUCTION_POLISH names a predecessor that is absent, of another episode, or not APPROVED"
  - id: ERR_PREDECESSOR_NOT_ALLOWED
    http: 422
    condition: "predecessor_assignment_id supplied for a STORY, TELEPLAY or STORY_AND_TELEPLAY assignment"
  - id: ERR_MILESTONE_NOT_IN_ASSIGNMENT
    http: 422
    condition: "reviewed_draft_milestone_id belongs to another assignment or is not yet delivered"
  - id: ERR_NO_ELIGIBLE_SUBMISSIONS
    http: 422
    condition: "the episode has no ELIGIBLE credit submission at close or no participants at arbitration"

  # ---- fiscal and coverage ----
  - id: ERR_SEASON_STAFFING_BUDGET_EXCEEDED
    http: 409
    condition: "the seat's weekly compensation would push staffing_commitment_weekly_cents above staffing_budget_weekly_cents"
  - id: ERR_SCRIPT_FEE_BUDGET_EXCEEDED
    http: 409
    condition: "the assignment's payable_fee_cents would push script_fee_committed_cents above script_fee_budget_cents"
  - id: ERR_SCRIPT_COVERAGE_INSUFFICIENT
    http: 409
    condition: "locking the episode would leave ready_script_count below ready_script_target"

roles:
  - name: StudioExecutive
    description: "Studio production executive: owns season setup, budgets, episode ordering, room activation and the lock-for-production decision."
    identity: "opaque"
    exclusive_operations: ["create seasons", "reschedule a season's production start", "order episodes", "reconfigure a room's format and duration commitment", "activate a room"]
    shared_operations: ["release a confirmed seat", "approve or void a script assignment", "wrap a room", "lock an episode for production", "read seasons, rooms, seats, episodes, assignments, milestones, clearance and the fee ledger", "set the logical clock"]
  - name: Showrunner
    description: "Season showrunner, an entity-backed writer who configures the room, offers seats, assigns scripts and issues notes on the episodes of their own season."
    identity: "entity_backed:Writer"
    exclusive_operations: ["open a room for staffing", "offer a seat", "withdraw a seat offer", "create script assignments", "issue notes on a delivered script"]
    shared_operations: ["configure a room for the season", "release a confirmed seat", "approve or void a script assignment", "wrap a room", "close the credit submission window", "lock an episode for production", "read seasons, rooms, seats, episodes, assignments, milestones and clearance", "set the logical clock"]
  - name: Writer
    description: "Guild writer, entity-backed: accepts or declines seat offers, delivers milestones, submits credit claims and votes when serving as an arbiter."
    identity: "entity_backed:Writer"
    exclusive_operations: ["accept a seat offer", "decline a seat offer", "deliver a milestone", "submit a credit claim", "cast an arbitration ballot"]
    shared_operations: ["declare an availability window", "read seasons, rooms, seats, episodes, assignments, milestones, credit submissions and arbitrations", "set the logical clock"]
  - name: GuildAdministrator
    description: "Guild administrator: maintains the minimum basic agreement rate card and the writer registry, closes credit windows and administers arbitration panels."
    identity: "opaque"
    exclusive_operations: ["register a guild agreement", "register a writer", "award episodic credits", "convene a credit arbitration panel", "apply an arbitration determination or policy override"]
    shared_operations: ["declare an availability window on a writer's behalf", "close the credit submission window", "read agreements, writers, seasons, rooms, seats, episodes, assignments, milestones, credit records and the fee ledger", "set the logical clock"]
  - name: LegalCounsel
    description: "Production legal counsel: owns script clearance for names, trademarks and depictions, including item decisions and waivers."
    identity: "opaque"
    exclusive_operations: ["open a clearance review", "add a clearance item", "decide a clearance item", "grant a clearance waiver"]
    shared_operations: ["read agreements, seasons, rooms, episodes, assignments, milestones and clearance records", "set the logical clock"]
