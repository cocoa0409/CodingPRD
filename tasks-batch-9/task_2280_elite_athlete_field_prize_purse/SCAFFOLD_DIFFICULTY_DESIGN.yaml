  # ===========================================================================
  # RULE 3 — non_linear_state_machine (2 instances, different entities/shapes)
  # ===========================================================================

  - rule_id: non_linear_state_machine
    instances:
      - name: invitation_negotiation_cycle_offered_countered_to_round_cap
        grounds:
          - state_machines.Invitation.OFFERED_to_COUNTERED
          - state_machines.Invitation.COUNTERED_to_OFFERED
          - state_machines.Invitation.COUNTERED_to_ACCEPTED
          - entities.Invitation.fields.round_count
          - concurrency_rules[negotiation-round-stale-invitation]
          - validations[priority=14]
        distinguishing_aspect: >-
          The Invitation machine contains a genuine CYCLE: OFFERED -> COUNTERED -> OFFERED can repeat,
          and the only thing that stops it is the round cap round_count < 2 * max_negotiation_rounds,
          so with max_negotiation_rounds = 2 the fifth round is refused with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED while the invitation is still perfectly alive and can be
          accepted on the terms of round 4. Falsifiable in one sentence: an implementation that models
          the invitation as a forward-only chain either refuses the second COMMITTEE round (round 3) or
          never refuses a fifth, and it will not report round_count == 4 with status COUNTERED followed
          by a successful ACCEPT at guaranteed_commitment_cents == 2718000.
        test_recipe:
          setup: >-
            Edition with max_negotiation_rounds = 2 (cap 4 rounds total) and appearance_budget_cents =
            5,000,000, FIELD_OPEN. One ELITE MALE athlete with a VERIFIED 7900 performance, one ACTIVE
            agent. The committee offers round 1; the clock stays at 2026-08-01 so the 14-day response
            window never lapses.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
