            - "After ISSUE: Client.${client_id}.paid_to_date_cents == 0"
            - "After VOID: Client.${client_id}.outstanding_balance_cents == 0"
            - "After VOID: Client.${client_id}.paid_to_date_cents == 0"
            - "After VOID: Invoice.${inv_id}.status == VOID"
            - "After VOID: Invoice.${inv_id}.total_cents == 37665 (the invoice keeps its computed total; only the client ledger drops it)"

      - name: assign_then_unassign_restores_guard_committed_hours
        grounds:
          - calculations.guard_committed_hours
          - state_machines.CoverageShift.OPEN_UNFILLED_to_SCHEDULED
          - state_machines.CoverageShift.SCHEDULED_to_OPEN_UNFILLED
          - entities.Guard.fields.committed_hours
          - entities.CoverageShift.fields.pay_rate_cents_per_hour
        distinguishing_aspect: |
          Conserved quantity #2 — COMMITTED LABOUR HOURS (not money): Guard.committed_hours ==
          sum(scheduled_hours over shifts in {SCHEDULED, CONFIRMED, IN_PROGRESS}); assignment (0.0 → 7.5)
          followed by its compensating UNASSIGN returns it to exactly 0.0 and clears the pay-rate snapshot,
          leaving no residue on either the guard or the shift.
