    side_effects: ["see state_machines.CrsCycle -> CERTIFIED; version += 1"]

  - method: POST
    path: "/floodplain/crs-cycles/{cycleId}/lapse"
    description: "Record a missed recertification deadline"
    roles: [StateNfipCoordinator]
    code: 200
    input: []
    output: CrsCycle
    side_effects: ["status -> LAPSED; Community.crs_class -> 10; version += 1"]

  # ------------------------------------------------------- test-driving surface
  - method: POST
    path: "/floodplain/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every timestamp, deadline and window rule reads that default and never real wall-clock time. The new value must be at or after the current logical clock."
    roles: [StateNfipCoordinator, FloodplainAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["the logical clock advances; no entity is mutated and no deferred action fires"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / rbac ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, blank, or not a declared role" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "Acting role is not listed for the endpoint in §1.5" }
  - { id: ERR_NOT_PROPERTY_OWNER, http: 403, condition: "PropertyOwner's X-User-ID does not equal the owning Property.id of the target resource" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeal decided by the same X-User-ID recorded in DeterminationCase.determined_by_user_id" }

  # --- existence ---
  - { id: ERR_COMMUNITY_NOT_FOUND, http: 404, condition: "communityId path segment or community_id body field does not resolve" }
  - { id: ERR_FIRM_PANEL_NOT_FOUND, http: 404, condition: "panelId or firm_panel_id does not resolve" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "propertyId or property_id does not resolve" }
  - { id: ERR_STRUCTURE_NOT_FOUND, http: 404, condition: "structureId or structure_id does not resolve" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "permitId or permit_id does not resolve" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "certificateId does not resolve" }
  - { id: ERR_IMPROVEMENT_RECORD_NOT_FOUND, http: 404, condition: "recordId or reverses_record_id does not resolve" }
  - { id: ERR_DETERMINATION_CASE_NOT_FOUND, http: 404, condition: "caseId does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspectionId does not resolve" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "violationId or violation_id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId does not resolve" }
  - { id: ERR_LOSS_AREA_NOT_FOUND, http: 404, condition: "areaId does not resolve" }
  - { id: ERR_HIGHER_STANDARD_NOT_FOUND, http: 404, condition: "standardId does not resolve" }
  - { id: ERR_CRS_CYCLE_NOT_FOUND, http: 404, condition: "cycleId or crs_cycle_id does not resolve" }

  # --- request schema ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required body field, invalid enum member, out-of-range number, limit outside [1,100], negative offset, market_value_usd <= 0, claimed_points < 1, cycle_end_date not after cycle_start_date, cost_usd missing for a non-REVERSAL record" }

  # --- OCC ---
  - { id: ERR_STALE_STRUCTURE_VERSION, http: 412, condition: "expected_structure_version does not equal the Structure's current version" }
  - { id: ERR_STALE_COMMUNITY_VERSION, http: 412, condition: "expected_community_version does not equal the Community's current version" }

  # --- state preconditions ---
  - { id: ERR_PANEL_NOT_PENDING, http: 409, condition: "Activation attempted on a FirmPanel whose status is not PENDING_REVISION" }
  - { id: ERR_PANEL_NOT_EFFECTIVE, http: 422, condition: "A property is created against, or a permit is submitted under, a FirmPanel whose status is not EFFECTIVE" }
  - { id: ERR_PERMIT_NOT_SUBMITTABLE, http: 409, condition: "Submit attempted on a permit whose status is not DRAFT or REVISION_REQUIRED" }
  - { id: ERR_PERMIT_NOT_UNDER_REVIEW, http: 409, condition: "Review decision recorded on a permit whose status is not UNDER_REVIEW" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "Issue attempted on a permit whose status is not APPROVED" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "Close attempted, or a certificate filed, against a permit whose status is not ISSUED" }
  - { id: ERR_CERTIFICATE_NOT_REVIEWABLE, http: 409, condition: "Review attempted on a certificate whose status is not SUBMITTED" }
  - { id: ERR_CERTIFICATE_NOT_DEFICIENT, http: 409, condition: "Amendment attempted on a certificate whose status is not DEFICIENT" }
  - { id: ERR_DETERMINATION_NOT_OPEN, http: 409, condition: "Determination recorded on a case whose status is not OPEN" }
  - { id: ERR_DETERMINATION_NOT_DETERMINED, http: 409, condition: "Appeal filed against a case whose status is not DETERMINED" }
  - { id: ERR_APPEAL_NOT_PENDING, http: 409, condition: "Appeal decision recorded on a case whose status is not APPEALED" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "Assessment recorded on an inspection whose status is not SCHEDULED" }
  - { id: ERR_INSPECTION_NOT_ASSESSED, http: 409, condition: "Finalization attempted on an inspection whose status is not ASSESSED" }
  - { id: ERR_VIOLATION_NOT_ACTIONABLE, http: 409, condition: "Resolution attempted on a violation whose status is REMEDIATED or CLOSED_UNRESOLVED; order issuance attempted on a violation whose status is not IN {OPEN, ORDER_ISSUED} (the priority-40 gate for POST /floodplain/remediation-orders deliberately admits ORDER_ISSUED so that the priority-78 uniqueness rule decides duplicate active orders)" }
  - { id: ERR_ORDER_NOT_ACTIONABLE, http: 409, condition: "Extension or resolution attempted on an order whose status is SATISFIED or DEFAULTED" }
  - { id: ERR_ORDER_ALREADY_ACTIVE, http: 409, condition: "A RemediationOrder with status ISSUED or EXTENDED already exists for the violation; reachable because the priority-40 state gate admits violations already in ORDER_ISSUED and the priority-78 rule then rejects the second order" }
  - { id: ERR_LOSS_AREA_NOT_DESIGNATED, http: 409, condition: "Outreach launched on a repetitive loss area whose status is not DESIGNATED" }
  - { id: ERR_LOSS_AREA_ANALYSIS_STALE, http: 422, condition: "Designation or outreach launch attempted while analysis_status is PENDING_ANALYSIS or STALE" }
  - { id: ERR_OUTREACH_NOT_IN_PROGRESS, http: 409, condition: "Delivery recording or completion attempted while outreach_status is not IN_PROGRESS" }
  - { id: ERR_OUTREACH_ALREADY_IN_PROGRESS, http: 409, condition: "Outreach launch attempted while outreach_status is already IN_PROGRESS" }
  - { id: ERR_STANDARD_NOT_DRAFT, http: 409, condition: "Submission attempted on a standard whose documentation_status is not DRAFT" }
  - { id: ERR_STANDARD_NOT_SUBMITTED, http: 409, condition: "Verification decision recorded on a standard whose documentation_status is not SUBMITTED" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Submission attempted on a cycle whose status is not OPEN, or outreach references a cycle whose status is not OPEN" }
  - { id: ERR_CYCLE_NOT_SUBMITTED, http: 409, condition: "Verification visit recorded on a cycle whose status is not SUBMITTED" }
  - { id: ERR_CYCLE_NOT_CERTIFIABLE, http: 409, condition: "Certification attempted on a cycle whose status is not SUBMITTED or UNDER_VERIFICATION" }
  - { id: ERR_RECORD_ALREADY_REVERSED, http: 409, condition: "A REVERSAL targets an ImprovementRecord whose reversed flag is already true" }

  # --- referential ---
  - { id: ERR_STRUCTURE_PROPERTY_MISMATCH, http: 422, condition: "structure_id on a permit does not belong to the supplied property_id" }
  - { id: ERR_CERTIFICATE_STRUCTURE_MISMATCH, http: 422, condition: "Certificate structure_id differs from its permit's structure_id" }
  - { id: ERR_REVERSAL_TARGET_INVALID, http: 422, condition: "reverses_record_id missing for a REVERSAL, supplied for a non-REVERSAL, or targeting a record of another structure" }
  - { id: ERR_CYCLE_COMMUNITY_MISMATCH, http: 422, condition: "crs_cycle_id supplied at outreach launch belongs to a different community than the area" }
  - { id: ERR_SURVEYOR_LICENSE_REQUIRED, http: 422, condition: "A FINISHED_CONSTRUCTION certificate is filed or amended without surveyor_license_no" }
  - { id: ERR_STANDARD_PREREQUISITE_NOT_MET, http: 422, condition: "Verification requested while the activity's recomputed max_points_allowed is 0" }
  - { id: ERR_UNRESOLVED_SUBMISSIONS, http: 422, condition: "Certification attempted while at least one HigherStandard of the community is still SUBMITTED" }
  - { id: ERR_VERIFICATION_VISIT_REQUIRED, http: 422, condition: "Certification attempted while verification_visit_required is true and no visit has been recorded" }
  - { id: ERR_FINISHED_CERTIFICATE_REQUIRED, http: 422, condition: "Permit closeout attempted without an ACCEPTED FINISHED_CONSTRUCTION certificate for that permit" }

  # --- safety / floodplain ---
  - { id: ERR_BFE_UNDETERMINED, http: 422, condition: "Permit submitted under a panel whose base_flood_elevation_ft is null" }
  - { id: ERR_OUTSIDE_FLOOD_HAZARD_AREA, http: 422, condition: "Permit submitted under a panel whose flood_zone is X" }
  - { id: ERR_ELEVATION_BELOW_REQUIRED, http: 422, condition: "Approval requested with proposed_lowest_floor_elevation_ft below the requirement, or certificate acceptance requested with freeboard_margin_ft < 0.0" }
  - { id: ERR_DETERMINATION_REQUIRED, http: 422, condition: "Approval requested for an IMPROVEMENT/REPAIR whose single-event ratio reaches SI_THRESHOLD_PCT without a resolved determination case" }
  - { id: ERR_COMMUNITY_SUSPENDED, http: 403, condition: "Permit issuance attempted while Community.compliance_posture is SUSPENDED" }
  - { id: ERR_COMMUNITY_ON_PROBATION, http: 403, condition: "Permit issuance attempted for a substantially improved or damaged structure while Community.compliance_posture is ON_PROBATION" }

  # --- temporal ---
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal filed after DeterminationCase.appeal_deadline_at" }
  - { id: ERR_INSPECTION_WINDOW_CLOSED, http: 422, condition: "Assessment recorded after PostDisasterInspection.deadline_at" }
  - { id: ERR_CYCLE_PAST_DUE, http: 422, condition: "Recertification submitted after CrsCycle.due_at" }
  - { id: ERR_CYCLE_NOT_PAST_DUE, http: 422, condition: "Lapse recorded while the logical clock is at or before CrsCycle.due_at" }
  - { id: ERR_ORDER_DEADLINE_NOT_PASSED, http: 422, condition: "Default recorded while the logical clock is at or before the order's deadline_at" }
  - { id: ERR_EVENT_DATE_IN_FUTURE, http: 422, condition: "ImprovementRecord event_date is after the current logical clock" }
  - { id: ERR_DEADLINE_NOT_IN_FUTURE, http: 422, condition: "RemediationOrder deadline_at is at or before the current logical clock at creation, or an extension deadline is not after the current deadline" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 422, condition: "set_current_utc target instant is before the current logical clock" }
  - { id: ERR_PANEL_EFFECTIVE_DATE_OVERLAP, http: 422, condition: "A panel's effective_date is at or before the effective_date of the EFFECTIVE panel with the same community_id and panel_number" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 422, condition: "A new cycle's closed [cycle_start_date, cycle_end_date] intersects the closed interval of an existing non-LAPSED cycle of the community, including at a shared endpoint" }
  - { id: ERR_SWEEP_WINDOW_CONFLICT, http: 422, condition: "A sweep's buffer-expanded window intersects the window of an existing sweep of the same community" }

  # --- constraint / uniqueness / fiscal ---
  - { id: ERR_REVISION_LIMIT_EXCEEDED, http: 422, condition: "Resubmission or revision request would push revision_round beyond MAX_REVISION_ROUNDS" }
  - { id: ERR_EXTENSION_LIMIT_EXCEEDED, http: 422, condition: "Extension would push extension_count beyond MAX_ORDER_EXTENSIONS" }
  - { id: ERR_DUPLICATE_CID_NUMBER, http: 409, condition: "cid_number already registered" }
  - { id: ERR_DUPLICATE_PARCEL_ID, http: 409, condition: "parcel_id already used inside the community" }
  - { id: ERR_DUPLICATE_AREA_CODE, http: 409, condition: "area_code already used inside the community" }
  - { id: ERR_DUPLICATE_CYCLE_YEAR, http: 409, condition: "cycle_year already opened for the community" }
  - { id: ERR_DUPLICATE_DECLARATION_CODE, http: 409, condition: "declaration_code already swept for the community" }
  - { id: ERR_DUPLICATE_PANEL_REVISION, http: 409, condition: "A PENDING_REVISION panel already exists for the community_id and panel_number" }
  - { id: ERR_DUPLICATE_STANDARD_ACTIVITY, http: 409, condition: "A HigherStandard with documentation_status SUBMITTED or VERIFIED already exists for the community_id, activity_code and documentation_cycle_year" }
  - { id: ERR_OUTREACH_TARGET_BELOW_ANALYZED, http: 422, condition: "target_property_count at outreach launch is below the area's analyzed property_count" }
  - { id: ERR_DELIVERY_EXCEEDS_TARGET, http: 422, condition: "delivered_count + delivered_increment would exceed target_property_count" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StateNfipCoordinator
    description: "State NFIP / CRS coordinator: owns community registration, the flood map inventory, credit verification and recertification decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /floodplain/communities"
      - "POST /floodplain/firm-panels"
      - "POST /floodplain/firm-panels/{panelId}/activate"
      - "POST /floodplain/higher-standards/{standardId}/verify"
      - "POST /floodplain/crs-cycles"
      - "POST /floodplain/crs-cycles/{cycleId}/verify-visit"
      - "POST /floodplain/crs-cycles/{cycleId}/certify"
      - "POST /floodplain/crs-cycles/{cycleId}/lapse"
    shared_operations:
      - "POST /floodplain/_clock/set_current_utc (with FloodplainAdministrator)"
      - "all GET endpoints"

  - name: FloodplainAdministrator
    description: "Municipal floodplain administrator: permit review and issuance, certificate review, determinations, ledger maintenance, enforcement, repetitive-loss analysis and outreach, credit submissions, recertification filing"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /floodplain/communities/{communityId}"
      - "POST /floodplain/communities/{communityId}/inspection-sweep"
      - "POST /floodplain/properties"
      - "POST /floodplain/structures"
      - "PATCH /floodplain/structures/{structureId}"
      - "POST /floodplain/permits/{permitId}/review"
      - "POST /floodplain/permits/{permitId}/issue"
      - "POST /floodplain/permits/{permitId}/close"
      - "POST /floodplain/elevation-certificates/{certificateId}/review"
      - "POST /floodplain/improvement-records"
      - "POST /floodplain/determination-cases"
      - "POST /floodplain/determination-cases/{caseId}/determine"
      - "POST /floodplain/inspections/{inspectionId}/assess"
      - "POST /floodplain/inspections/{inspectionId}/finalize"
      - "POST /floodplain/violations"
      - "POST /floodplain/violations/{violationId}/resolve"
      - "POST /floodplain/remediation-orders"
      - "POST /floodplain/remediation-orders/{orderId}/extend"
      - "POST /floodplain/remediation-orders/{orderId}/resolve"
      - "POST /floodplain/repetitive-loss-areas"
      - "POST /floodplain/repetitive-loss-areas/{areaId}/analyze"
      - "POST /floodplain/repetitive-loss-areas/{areaId}/designate"
      - "POST /floodplain/repetitive-loss-areas/{areaId}/outreach"
      - "POST /floodplain/repetitive-loss-areas/{areaId}/record-outreach-delivery"
      - "POST /floodplain/repetitive-loss-areas/{areaId}/complete-outreach"
      - "POST /floodplain/higher-standards"
      - "POST /floodplain/higher-standards/{standardId}/submit"
      - "POST /floodplain/crs-cycles/{cycleId}/submit"
    shared_operations:
      - "POST /floodplain/_clock/set_current_utc (with StateNfipCoordinator)"
      - "all GET endpoints"
    note: "Segregation of duties: an administrator who records a determination is barred from deciding its appeal, and never verifies the credit it submits."

  - name: PropertyOwner
    description: "Owner of record acting for one parcel; X-User-ID is that Property's id"
    identity: "entity_backed:Property"
    exclusive_operations:
      - "POST /floodplain/permits"
      - "POST /floodplain/permits/{permitId}/submit"
      - "POST /floodplain/elevation-certificates"
      - "POST /floodplain/elevation-certificates/{certificateId}/amend"
      - "POST /floodplain/determination-cases/{caseId}/appeal"
    shared_operations:
      - "all GET endpoints"

  - name: AppealsBoardMember
    description: "Local floodplain appeals board member; decides substantial improvement / damage appeals"
    identity: "opaque"
    exclusive_operations:
      - "POST /floodplain/determination-cases/{caseId}/appeal-decision"
    shared_operations:
      - "all GET endpoints"
