# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across §1.1–§1.7 not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: create_unit_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Unit, endpoints]
        distinguishing_aspect: "POST /units with required fields returns 201, a server-minted id, status DRAFT, version 1."
        test_recipe:
          setup: ["A registered host"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CA", email: "ca@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "Cozy", address: "1 A St", monthly_rate_cents: 250000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response code 201; captured unit_id is a non-prefixed UUID; captured st == DRAFT; captured ver == 1"

      - name: unit_defaults_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Unit.fields.min_term_days, entities.Unit.fields.max_term_days, entities.Unit.fields.turnover_buffer_days]
        distinguishing_aspect: "Omitting min_term_days/max_term_days/turnover_buffer_days applies defaults 30/90/2."
        test_recipe:
          setup: ["A registered host"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CB", email: "cb@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "Dflt", address: "2 A St", monthly_rate_cents: 250000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { mn: $.data.min_term_days, mx: $.data.max_term_days, buf: $.data.turnover_buffer_days }
          assert:
            - "captured mn == 30, mx == 90, buf == 2"

      - name: booking_term_days_computed_from_dates
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.term_days, calculations.booking_term_days]
        distinguishing_aspect: "term_days is computed as end_date - start_date (half-open); a client-supplied term_days would be ignored."
        test_recipe:
          setup: ["Host + verified-payout, tenant, LISTED unit"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CC", email: "cc@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "Nurse CC", email: "ncc@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "TC", address: "3 A St", monthly_rate_cents: 300000, cleaning_included: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { td: $.data.term_days, st: $.data.status }
          assert:
            - "captured td == 30; captured st == REQUESTED (initial state)"

      - name: get_booking_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bookings/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_NOT_FOUND"

      - name: create_unit_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Unit.fields.monthly_rate_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /units without monthly_rate_cents returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A registered host"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CD", email: "cd@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "NoRate", address: "4 A St" }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION"

      - name: register_tenant_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Tenant.fields.tenant_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /tenants with tenant_type outside {TRAVEL_NURSE, RELOCATION, OTHER} returns ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tenants"
              payload: { full_name: "Bad", email: "bad@x.com", tenant_type: "ASTRONAUT" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION"

  # ==========================================================================
  - section: state_machines
    instances:
      - name: cancel_completed_booking_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED booking has no CANCELLED transition; cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Verified host/tenant, LISTED unit; booking confirmed, activated and completed (default clock 2026-05-01 already past a Feb window)"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CE", email: "ce@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse CE", email: "nce@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docCE" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CE", address: "5 A St", monthly_rate_cents: 300000, cleaning_included: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-02-01", end_date: "2026-03-03" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "COMPLETED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CANCELLED" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: verification_resubmit_cycle_restores_pending
        claim_type: cyclic
        grounds: [state_machines.Verification.REJECTED_to_PENDING, entities.Tenant.fields.verification_status]
        distinguishing_aspect: "A REJECTED verification resubmitted by the tenant returns to PENDING and Tenant.verification_status becomes PENDING."
        test_recipe:
          setup: ["Tenant with a REJECTED verification"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { full_name: "Nurse CF", email: "ncf@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docCF" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "REJECTED", reviewer_note: "blurry" }
              as: ComplianceReviewer
          trigger:
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "PENDING" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { st: $.data.status }
          assert:
            - "captured st == PENDING; GET /tenants/${tenant_id}: verification_status == PENDING"

      - name: delist_unit_with_active_booking_rejected
        claim_type: guarded transitions
        grounds: [state_machines.Unit, "errors[ERR_UNIT_HAS_ACTIVE_BOOKINGS]"]
        distinguishing_aspect: "Delisting a unit that has a REQUESTED booking returns ERR_UNIT_HAS_ACTIVE_BOOKINGS."
        test_recipe:
          setup: ["Host, tenant, LISTED unit with one REQUESTED booking"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CG", email: "cg@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "Nurse CG", email: "ncg@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CG", address: "6 A St", monthly_rate_cents: 300000, cleaning_included: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "DELISTED" }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_UNIT_HAS_ACTIVE_BOOKINGS"

      - name: booking_confirm_side_effects_spawn_children
        claim_type: Side Effect Execution
        grounds: [state_machines.Booking.REQUESTED_to_CONFIRMED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_confirm_vs_decline_branch
          rationale: "The CONFIRMED-branch side effects (Deposit + Payout + TaxAssessment) are asserted by the named §1.8 branch instance."

  # ==========================================================================
  - section: calculations
    instances:
      - name: cleaning_charge_added_when_not_included
        claim_type: Correct Result
        grounds: [calculations.cleaning_charge, entities.Booking.fields.gross_rent_cents]
        distinguishing_aspect: "With cleaning_included false and cleaning_fee_cents 15000, a term-30 booking at rate 300000 has cleaning_charge 15000 and gross_rent 315000."
        test_recipe:
          setup: ["Host, tenant, unit with cleaning_included false, cleaning_fee_cents 15000, rate 300000"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CH", email: "ch@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "Nurse CH", email: "nch@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CH", address: "7 A St", monthly_rate_cents: 300000, cleaning_included: false, cleaning_fee_cents: 15000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { cc: $.data.cleaning_charge_cents, gr: $.data.gross_rent_cents, rc: $.data.rent_cents }
          assert:
            - "captured rc == 300000, cc == 15000, gr == 315000"

      - name: booking_rent_provisional_result
        claim_type: Variant Selection
        grounds: [calculations.booking_rent]
        excluded_because:
          difficulty_instance: dual_variant_calc / booking_rent_provisional_vs_final
          rationale: "The PROVISIONAL variant value (300000 at creation) is asserted by the named §1.8 dual-variant instance."

      - name: occupancy_tax_taxable_result
        claim_type: Correct Result
        grounds: [calculations.occupancy_tax]
        excluded_because:
          difficulty_instance: boundary_precision_check / tax_exempt_30_day_boundary
          rationale: "Taxable (40600) and exempt (0) results at the 30-day boundary are asserted by the named §1.8 instance."

  # ==========================================================================
  - section: validations
    instances:
      - name: booking_end_before_start_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /bookings with end_date <= start_date returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Host, tenant, unit"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CI", email: "ci@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "Nurse CI", email: "nci@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CI", address: "8 A St", monthly_rate_cents: 300000, cleaning_included: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-07-01", end_date: "2026-06-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION"

      - name: booking_term_too_short_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_TERM_TOO_SHORT]"]
        distinguishing_aspect: "A 20-day booking on a unit with min_term_days 30 returns ERR_TERM_TOO_SHORT."
        test_recipe:
          setup: ["Host, tenant, unit min_term_days 30"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CJ", email: "cj@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "Nurse CJ", email: "ncj@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CJ", address: "9 A St", monthly_rate_cents: 300000, cleaning_included: true, min_term_days: 30 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-06-21" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_TERM_TOO_SHORT (term 20 < 30)"

      - name: booking_term_exceeds_max_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_TERM_EXCEEDS_MAX]"]
        distinguishing_aspect: "A 120-day booking on a unit with max_term_days 90 returns ERR_TERM_EXCEEDS_MAX."
        test_recipe:
          setup: ["Host, tenant, unit max_term_days 90"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CK", email: "ck@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "Nurse CK", email: "nck@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CK", address: "10 A St", monthly_rate_cents: 300000, cleaning_included: true, max_term_days: 90 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-09-29" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_TERM_EXCEEDS_MAX (term 120 > 90)"

      - name: extension_not_later_rejected
        claim_type: Violation to Error
        grounds: [state_machines.Extension.REQUESTED_to_APPROVED, "errors[ERR_EXTENSION_NOT_LATER]"]
        distinguishing_aspect: "Approving an extension whose new_end_date is not after the current end_date returns ERR_EXTENSION_NOT_LATER."
        test_recipe:
          setup: ["Verified host/tenant, LISTED unit; booking [2026-06-01,2026-07-01] confirmed; extension REQUESTED with an earlier new_end_date"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CL", email: "cl@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse CL", email: "ncl@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docCL" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CL", address: "11 A St", monthly_rate_cents: 300000, cleaning_included: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
              captures: { booking_v: $.data.version }
            - call: "POST /extensions"
              payload: { booking_id: "${booking_id}", expected_booking_version: "${booking_v}", new_end_date: "2026-06-20" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ext_id: $.data.id }
          trigger:
            - call: "POST /extensions/${ext_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_EXTENSION_NOT_LATER (new_end 2026-06-20 <= current end 2026-07-01)"

      - name: confirm_requires_coi_rejected
        claim_type: Cross-entity validation
        grounds: [state_machines.Booking.REQUESTED_to_CONFIRMED, "errors[ERR_COI_REQUIRED]"]
        distinguishing_aspect: "Confirming a booking on a requires_coi unit with no ACTIVE CoiPolicy returns ERR_COI_REQUIRED."
        test_recipe:
          setup: ["Verified host/tenant, LISTED unit with requires_coi true; booking REQUESTED, no COI submitted"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CM", email: "cm@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse CM", email: "ncm@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docCM" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CM", address: "12 A St", monthly_rate_cents: 300000, cleaning_included: true, requires_coi: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_COI_REQUIRED"

      - name: coi_activate_insufficient_coverage_rejected
        claim_type: Violation to Error
        grounds: [state_machines.CoiPolicy.PENDING_to_ACTIVE, "errors[ERR_COI_INSUFFICIENT_COVERAGE]"]
        distinguishing_aspect: "Activating a CoiPolicy whose coverage_cents is below COI_MIN_COVERAGE_CENTS returns ERR_COI_INSUFFICIENT_COVERAGE."
        test_recipe:
