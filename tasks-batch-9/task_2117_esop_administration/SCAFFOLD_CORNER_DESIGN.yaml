  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_plan_version_on_valuation_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[valuation-create-stale-plan]
          - errors[ERR_STALE_PLAN_VERSION]
          - endpoints.POST /valuations
        distinguishing_aspect: "The first valuation submission bumps EsopPlan.version, so a second submission still carrying the pre-submission version is refused with ERR_STALE_PLAN_VERSION (412) even though its coverage interval is adjacent and would otherwise be legal."
        test_recipe:
          setup:
            - "One plan in VALUATION_PENDING whose version was captured at close-year and has since been advanced by one accepted valuation submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "OCC Valuation", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "LUMP_SUM" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/close-year"
              payload: {}
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_v_closed: $.data.version }
            - call: "POST /valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2026, enterprise_value_cents: 12000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2026-01-01", effective_to_date: "2027-01-01", expected_plan_version: "${plan_v_closed}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val1_id: $.data.id }
          trigger:
            - call: "POST /valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2027, enterprise_value_cents: 11000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2027-01-01", effective_to_date: "2028-01-01", expected_plan_version: "${plan_v_closed}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { err: $.data.error_id }
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { plan_v_fresh: $.data.version }
            - call: "POST /valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2027, enterprise_value_cents: 11000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2027-01-01", effective_to_date: "2028-01-01", expected_plan_version: "${plan_v_fresh}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val2_id: $.data.id }
          assert:
            - "the stale submission returns error_id ERR_STALE_PLAN_VERSION with HTTP 412"
            - "EsopPlan.${plan_id}.open_valuation_count == 1 immediately after the refusal"
            - "the retry with the refreshed version returns HTTP 201 with Valuation.${val2_id}.status == SUBMITTED"
            - "EsopPlan.${plan_id}.open_valuation_count == 2 and Valuation.${val1_id}.status == SUBMITTED"
            - "EsopPlan.${plan_id}.version advances by exactly 1 on each accepted submission and does not move on the refused one"

      - name: stale_expected_plan_version_on_allocation_run_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-run-create-stale-plan]
          - errors[ERR_STALE_PLAN_VERSION]
          - endpoints.POST /allocation-runs
        distinguishing_aspect: "A second DRAFT run is legitimate on the same plan year, so nothing in the state machine rejects it; only the stale expected_plan_version - unchanged since before the first run advanced EsopPlan.version - produces ERR_STALE_PLAN_VERSION (412)."
        test_recipe:
          setup:
