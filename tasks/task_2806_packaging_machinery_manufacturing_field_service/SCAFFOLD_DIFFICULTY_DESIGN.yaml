# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2806 - Packaging Machinery Manufacturing & Field Service
# Nine 0.5 Difficulty Rules x >= 2 instances. Every grounds entry resolves to a
# declared element of SCAFFOLD.yaml 1.1-1.7; every call resolves to a 1.5
# endpoint; every ${var} is bound by an earlier captures block in the same
# instance; every formula-derived assert is a literal computed from 1.3.
# Logical clock stays at its 2026-08-01T00:00:00Z default unless a chain moves it.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: guarantee_attainment_nameplate_basis_misses_guarantee
        grounds:
          - calculations.guarantee_attainment
          - entities.MachineOrder.fields.guarantee_basis
          - entities.AcceptanceTest.fields.attainment_pct
          - entities.AcceptanceTest.fields.guarantee_met
          - state_machines.AcceptanceTest.IN_PROGRESS_to_FAILED
        distinguishing_aspect: |
          Selects the NAMEPLATE variant of guarantee_attainment: reference_rate_cpm is the raw
          catalog rate 600, so identical run data (552 cpm at 97.00% efficiency) yields
          attainment_pct 89.24 and guarantee_met false - the customer's 10.00% product variation
          is ignored on this variant, which is exactly what makes the machine miss the guarantee.
        test_recipe:
          setup:
            - "Customer 'Northwind Beverages' in region NA with product_variation_pct 10.00"
            - "MachineModel FL-600, family FILLER, nameplate_rate_cpm 600, guarantee_efficiency_pct 90.00"
            - "MachineOrder engineered with guarantee_basis NAMEPLATE, commercial_status PO_RECEIVED, fulfillment_status IN_BUILD"
            - "A FAT AcceptanceTest for that order is IN_PROGRESS with the customer's own product and 500 containers supplied"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 10.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/production-lines"
              payload: { line_code: "LINE-A", machine_family: "FILLER", changeover_buffer_days: 5, capacity_days_per_quarter: 120 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
            - call: "POST /packaging-oem/machine-orders/${order_id}/engineer"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders/${order_id}/commercial-advance"
              payload: { target_status: "PO_RECEIVED" }
              as: PlatformAdmin
              captures: { order_v: $.data.version }
            - call: "POST /packaging-oem/build-slots"
              payload: { machine_order_id: "${order_id}", production_line_id: "${line_id}", start_date: "2026-08-06", requested_slot_days: 20, expected_machine_order_version: "${order_v}" }
              as: ProductionPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /packaging-oem/build-slots/${slot_id}/confirm"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/build-slots/${slot_id}/start-build"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/acceptance-tests"
              payload: { machine_order_id: "${order_id}", kind: "FAT", scheduled_on: "2026-08-26" }
              as: QualityInspector
              captures: { fat_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests/${fat_id}/start"
              payload: { customer_product_supplied: true, containers_supplied_count: 500 }
              as: QualityInspector
          trigger:
            - call: "POST /packaging-oem/acceptance-tests/${fat_id}/finalize"
              payload: { measured_rate_cpm: 552, measured_efficiency_pct: 97.00 }
              as: QualityInspector
          assert:
            - "AcceptanceTest.${fat_id}.attainment_pct == 89.24"
            - "AcceptanceTest.${fat_id}.guarantee_met == false"
            - "AcceptanceTest.${fat_id}.status == FAILED"
            - "MachineOrder.${order_id}.fulfillment_status == FAT_FAILED"
            - "MachineOrder.${order_id}.fat_failure_count == 1"

      - name: guarantee_attainment_product_adjusted_basis_meets_guarantee
        grounds:
          - calculations.guarantee_attainment
          - entities.MachineOrder.fields.guarantee_basis
          - entities.Customer.fields.product_variation_pct
          - state_machines.AcceptanceTest.IN_PROGRESS_to_PASSED
          - state_machines.MachineOrder.IN_BUILD_to_FAT_PASSED
        distinguishing_aspect: |
          Selects the PRODUCT_ADJUSTED variant of the same calculation on the same endpoint with
          byte-identical run data (552 cpm at 97.00%): reference_rate_cpm is derated to
          600 * (1 - 10.00/100) = 540, so attainment_pct is 99.16 and guarantee_met flips to true -
          a strictly different numeric result from the NAMEPLATE instance, not a different threshold.
        test_recipe:
          setup:
            - "Customer 'Northwind Beverages' in region NA with product_variation_pct 10.00"
            - "MachineModel FL-600, nameplate_rate_cpm 600, guarantee_efficiency_pct 90.00"
            - "MachineOrder engineered with guarantee_basis PRODUCT_ADJUSTED, commercial_status PO_RECEIVED, fulfillment_status IN_BUILD"
            - "A FAT AcceptanceTest for that order is IN_PROGRESS with the customer's own product and 500 containers supplied"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 10.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/production-lines"
              payload: { line_code: "LINE-A", machine_family: "FILLER", changeover_buffer_days: 5, capacity_days_per_quarter: 120 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "PRODUCT_ADJUSTED" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
            - call: "POST /packaging-oem/machine-orders/${order_id}/engineer"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders/${order_id}/commercial-advance"
              payload: { target_status: "PO_RECEIVED" }
              as: PlatformAdmin
              captures: { order_v: $.data.version }
            - call: "POST /packaging-oem/build-slots"
              payload: { machine_order_id: "${order_id}", production_line_id: "${line_id}", start_date: "2026-08-06", requested_slot_days: 20, expected_machine_order_version: "${order_v}" }
              as: ProductionPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /packaging-oem/build-slots/${slot_id}/confirm"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/build-slots/${slot_id}/start-build"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/acceptance-tests"
              payload: { machine_order_id: "${order_id}", kind: "FAT", scheduled_on: "2026-08-26" }
              as: QualityInspector
              captures: { fat_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests/${fat_id}/start"
              payload: { customer_product_supplied: true, containers_supplied_count: 500 }
              as: QualityInspector
          trigger:
            - call: "POST /packaging-oem/acceptance-tests/${fat_id}/finalize"
              payload: { measured_rate_cpm: 552, measured_efficiency_pct: 97.00 }
              as: QualityInspector
          assert:
            - "AcceptanceTest.${fat_id}.attainment_pct == 99.16"
            - "AcceptanceTest.${fat_id}.guarantee_met == true"
            - "AcceptanceTest.${fat_id}.status == PASSED"
            - "MachineOrder.${order_id}.fulfillment_status == FAT_PASSED"
            - "BuildSlot.${slot_id}.status == COMPLETED"
            - "ProductionLine.${line_id}.committed_slot_days == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: order_total_rollup_tier_keyed_on_pre_fee_subtotal
        grounds:
          - calculations.order_total_rollup
          - entities.MachineOrder.fields.discount_tier
          - entities.MachineOrder.fields.commissioning_fee_cents
          - entities.MachineOrder.fields.order_total_cents
          - state_machines.MachineOrder.DRAFT_to_ENGINEERED
        distinguishing_aspect: |
          Mode (c) - pinned evaluation order. The four steps must run in the declared sequence with
          the tier keyed on the PRE-FEE subtotal 73000000 (T1, fee 5.00%); because the resulting
          order_total_cents 76650000 sits above the T2 floor 75000000, an implementation that keys
          the tier off order_total_cents instead produces 75920000 and is detectably wrong.
        test_recipe:
          setup:
            - "Customer 'Northwind Beverages' region NA, product_variation_pct 4.00"
            - "MachineModel FL-600 ACTIVE with nameplate_rate_cpm 600"
            - "ProductTrial PASSED for that customer and model"
            - "MachineOrder in DRAFT with equipment_price_cents 70000000 and change_parts_price_cents 3000000"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /packaging-oem/machine-orders/${order_id}/engineer"
              payload: {}
              as: ApplicationEngineer
          assert:
            - "MachineOrder.${order_id}.discount_tier == T1"
            - "MachineOrder.${order_id}.commissioning_fee_cents == 3650000"
            - "MachineOrder.${order_id}.order_total_cents == 76650000"
            - "MachineOrder.${order_id}.fulfillment_status == ENGINEERED"
            - "MachineOrder.${order_id}.commercial_status == QUOTED"

      - name: claim_apportionment_rounds_each_line_before_summing
        grounds:
          - calculations.claim_cost_apportionment
          - calculations.claim_cause_classification
          - calculations.claim_goodwill_charge
          - entities.WarrantyClaimLine.fields.oem_line_share_cents
          - state_machines.WarrantyClaim.DEFECT_REVIEW_to_ADJUDICATED
        distinguishing_aspect: |
          Mode (b) - pinned rounding order inside an aggregation. Two lines under the
          VARIATION_DISCOUNTED variant produce raw shares 9184.68 and 2525.508; rounding each line
          first then summing yields oem_share_cents 11711, whereas summing raw then rounding once
          yields 11710 - a one-cent divergence that pins the order.
        test_recipe:
          setup:
            - "Customer 'Cascade Foods' region NA with product_variation_pct 12.00 (above VARIATION_TOLERANCE_PCT 5.00)"
            - "An InstalledMachine in status ACCEPTED under an ACTIVE SILVER ServiceContract with goodwill_budget_cents 500000"
            - "A WarrantyClaim on that machine with two immutable lines (12345 cents at 80.00% defect, 6789 cents at 40.00% defect)"
            - "Both fork branches signed off: product_variation_review_done and defect_review_done are true"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Cascade Foods", region_code: "NA", product_variation_pct: 12.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/production-lines"
              payload: { line_code: "LINE-A", machine_family: "FILLER", changeover_buffer_days: 5, capacity_days_per_quarter: 120 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Kettle Sauce", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
            - call: "POST /packaging-oem/machine-orders/${order_id}/engineer"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders/${order_id}/commercial-advance"
              payload: { target_status: "PO_RECEIVED" }
              as: PlatformAdmin
              captures: { order_v: $.data.version }
            - call: "POST /packaging-oem/build-slots"
              payload: { machine_order_id: "${order_id}", production_line_id: "${line_id}", start_date: "2026-08-06", requested_slot_days: 20, expected_machine_order_version: "${order_v}" }
              as: ProductionPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /packaging-oem/build-slots/${slot_id}/confirm"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/build-slots/${slot_id}/start-build"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/acceptance-tests"
              payload: { machine_order_id: "${order_id}", kind: "FAT", scheduled_on: "2026-08-26" }
              as: QualityInspector
              captures: { fat_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests/${fat_id}/start"
              payload: { customer_product_supplied: true, containers_supplied_count: 500 }
              as: QualityInspector
            - call: "POST /packaging-oem/acceptance-tests/${fat_id}/finalize"
              payload: { measured_rate_cpm: 570, measured_efficiency_pct: 96.00 }
              as: QualityInspector
            - call: "POST /packaging-oem/machine-orders/${order_id}/ship"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/installed-machines"
              payload: { machine_order_id: "${order_id}", customer_id: "${cust_id}", serial_number: "SN-2806-001", remote_diagnostics_enabled: true }
              as: ServiceManager
              captures: { machine_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests"
              payload: { machine_order_id: "${order_id}", kind: "SAT", scheduled_on: "2026-08-27", required_operators_trained: 2 }
              as: QualityInspector
              captures: { sat_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests/${sat_id}/start"
              payload: { customer_product_supplied: true, containers_supplied_count: 200 }
              as: QualityInspector
            - call: "POST /packaging-oem/acceptance-tests/${sat_id}/finalize"
              payload: { measured_rate_cpm: 570, measured_efficiency_pct: 96.00, operators_trained_count: 2 }
              as: QualityInspector
            - call: "POST /packaging-oem/service-contracts"
              payload: { installed_machine_id: "${machine_id}", tier: "SILVER", start_date: "2026-08-01", end_date: "2027-07-31", pm_visits_included: 2, goodwill_budget_initial_cents: 500000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /packaging-oem/service-contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /packaging-oem/warranty-claims"
              payload: { installed_machine_id: "${machine_id}", service_contract_id: "${contract_id}", failure_summary: "Filling valve seat wear with product carry-over" }
              as: ServiceManager
              captures: { claim_id: $.data.id }
            - call: "POST /packaging-oem/warranty-claim-lines"
              payload: { warranty_claim_id: "${claim_id}", line_label: "Valve seat kit", amount_cents: 12345, defect_attribution_pct: 80.00 }
              as: ServiceManager
              captures: { line1_id: $.data.id }
            - call: "POST /packaging-oem/warranty-claim-lines"
              payload: { warranty_claim_id: "${claim_id}", line_label: "Field labour", amount_cents: 6789, defect_attribution_pct: 40.00 }
              as: ServiceManager
              captures: { line2_id: $.data.id }
            - call: "POST /packaging-oem/warranty-claims/${claim_id}/reviews/product-variation"
              payload: {}
              as: ServiceManager
            - call: "POST /packaging-oem/warranty-claims/${claim_id}/reviews/defect"
              payload: {}
              as: QualityInspector
          trigger:
            - call: "POST /packaging-oem/warranty-claims/${claim_id}/adjudicate"
              payload: { resolution: "APPROVE" }
              as: ServiceManager
          assert:
            - "WarrantyClaim.${claim_id}.claimed_cost_cents == 19134"
            - "WarrantyClaim.${claim_id}.cause == MIXED"
            - "WarrantyClaimLine.${line1_id}.oem_line_share_cents == 9185"
            - "WarrantyClaimLine.${line2_id}.oem_line_share_cents == 2526"
            - "WarrantyClaim.${claim_id}.oem_share_cents == 11711"
            - "WarrantyClaim.${claim_id}.customer_share_cents == 7423"
            - "WarrantyClaim.${claim_id}.goodwill_charged_cents == 8783"
            - "ServiceContract.${contract_id}.goodwill_budget_cents == 491217"
            - "ServiceContract.${contract_id}.coverage_posture == OPEN"
            - "WarrantyClaim.${claim_id}.status == ADJUDICATED"

      - name: format_kit_lead_time_outer_cap_beats_inner_max
        grounds:
          - calculations.format_kit_lead_time
          - calculations.format_kit_price
          - entities.FormatKit.fields.quoted_lead_time_days
          - entities.FormatKit.fields.price_cents
          - state_machines.FormatKit.DRAFT_to_QUOTED
        distinguishing_aspect: |
          Mode (a) - nested min/max where both levels bind. The inner max picks the component branch
          (200 + 10 = 210 days) over the assembly branch (ceil(16/4) + 0 + 5 = 9 days), and the outer
          min then clamps 210 down to MAX_QUOTED_LEAD_DAYS 180; flattening either level yields 210 or 9.
        test_recipe:
          setup:
            - "Customer 'Northwind Beverages' region NA, product_variation_pct 4.00"
            - "InstalledMachine in status ACCEPTED whose current_format_family is PET_ROUND"
            - "MachineModel diameter window is 60..110 mm"
            - "A DRAFT FormatKit for family GLASS_SQUARE at 82 mm with two components (200-day part qty 6, 55-day part qty 10)"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/production-lines"
              payload: { line_code: "LINE-A", machine_family: "FILLER", changeover_buffer_days: 5, capacity_days_per_quarter: 120 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
            - call: "POST /packaging-oem/machine-orders/${order_id}/engineer"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders/${order_id}/commercial-advance"
              payload: { target_status: "PO_RECEIVED" }
              as: PlatformAdmin
