            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 10 }
              as: Underwriter
              captures: { cu_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/premium-payments"
              payload: { amount_cents: 13320 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units/${cu_id}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims"
              payload: { coverage_unit_id: "${cu_id}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/field-inspections"
              payload: { adjuster_id: "${adjuster_id}", scheduled_for: "2026-08-04T12:00:00Z", observed_percent_damage_pct: 10, notes: "10%" }
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "GET /carriers/${carrier_id}/policies/${policy_id}"
              payload: {}
              as: ClaimsApprover
              captures: { p_v_pre: $.data.version, p_reserve_pre: $.data.premium_reserve_cents }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/determinations"
              payload: { decision: "APPROVE", approved_indemnity_cents: 5000, expected_policy_version: "${p_v_pre}" }
              as: ClaimsApprover
            - call: "GET /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}"
              payload: {}
              as: ClaimsApprover
              captures: { pre_final: $.data.final_indemnity_cents, pre_state: $.data.claim_state }
          trigger:
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/indemnity-payments"
              payload: { payment_method: "ACH" }
              as: ClaimsApprover
              captures: { payment_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/indemnity-payments/${payment_id}/void"
              payload: {}
              as: ClaimsApprover
          assert:
            - "IndemnityPayment.${payment_id}.status == VOID"
            - "Claim.${claim_id}.claim_state == APPROVED   (re-opened)"
            - "Claim.${claim_id}.final_indemnity_cents == 5000   (unchanged)"
            - "Policy.${policy_id}.premium_reserve_cents == ${p_reserve_pre} - 5000   (reserve consumed at APPROVE, unchanged by issue+void)"

      - name: renewal_carryover_credit_conserved_through_policy_amount
        grounds:
          - calculations.continuous_coverage_carryover_credit
          - state_machines.Policy
        distinguishing_aspect: |
          Different conserved quantity: aggregate premium dollars across the
          renewal boundary. The new policy's premium equals the unit-sum plus
          surcharge MINUS the carryover credit; the credit itself is a fixed
          function (5%) of the prior policy's premium. The conserved quantity
          is the implied "total premium billed across both periods = prior_premium
          + new_premium_after_credit" which differs from the naive
          "prior_premium + new_premium_without_credit" by exactly the credit.
        test_recipe:
          setup:
            - "Carrier; grower (prior_claims_count=0); PUBLISHED rate (rate=333)"
            - "Prior policy P0 with 1 CU of 10 acres; premium = round_half_up(10*40000*333/10000) = 13320; BOUND+PAID"
            - "Expire P0 by clock; renew with 3-day gap → credit = round_half_up(13320 * 0.05) = 666"
            - "New policy P1 has 1 CU of 10 acres; same rate"
            - "P1 premium = 13320 - 666 = 12654"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-R", legal_name: "Carrier R", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower R", tax_id_last4: "1616", email: "r@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-08-20T00:00:00Z" }
              as: Underwriter
              captures: { p0: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${p0}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 10 }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${p0}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${p0}/premium-payments"
              payload: { amount_cents: 13320 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: Underwriter
            - call: "GET /carriers/${carrier_id}/policies/${p0}"
              payload: {}
              as: Underwriter
              captures: { p0_v: $.data.version, p0_premium: $.data.premium_cents }
          trigger:
            - call: "POST /carriers/${carrier_id}/policies/${p0}/renewals"
              payload: { decision: "RENEW", effective_date: "2026-08-23T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", expected_prior_policy_version: "${p0_v}" }
              as: Underwriter
              captures: { renewal_id: $.data.id, carryover: $.data.carryover_credit_cents }
            - call: "GET /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}" }
              as: Underwriter
              captures: { p1: "$.data[1].id" }
            - call: "POST /carriers/${carrier_id}/policies/${p1}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 10 }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${p1}/bind"
              payload: {}
              as: Underwriter
              captures: { p1_premium: $.data.premium_cents, p1_carryover: $.data.continuous_coverage_carryover_credit_cents }
          assert:
            - "Renewal.${renewal_id}.carryover_credit_cents == 666"
            - "Policy.${p1}.continuous_coverage_carryover_credit_cents == 666"
            - "Policy.${p1}.premium_cents == 12654   (13320 - 666)"
            - "Invariant: prior_premium + new_premium_after_credit == 13320 + 12654 == 25974 == (13320 + 13320) - 666"
