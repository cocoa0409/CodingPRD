  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: case_close_releases_aborts_seals
        grounds:
          - state_machines.Case.ACTIVE_to_CLOSED
          - state_machines.Assignment.ACTIVE_to_RELEASED
          - state_machines.SurveillanceSession.IN_PROGRESS_to_ABORTED
          - state_machines.EvidenceItem.COLLECTED_to_SEALED
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /cases/{id}/close: closing mutates the Assignment (link 1),
          the Assignment's release itself aborts that investigator's open session (link 2), and the
          session's abort itself seals that session's COLLECTED evidence (link 3, chain_seq 1 -> 2).
          Each link is caused by the previous link, not directly by the close.
        test_recipe:
          setup:
            - "ACTIVE CA case with a 500000-cent retainer, no court testimony, no DRAFT invoice."
            - "LEAD assignment in status ACTIVE, one IN_PROGRESS session, one COLLECTED evidence item on it (chain_seq 1)."
