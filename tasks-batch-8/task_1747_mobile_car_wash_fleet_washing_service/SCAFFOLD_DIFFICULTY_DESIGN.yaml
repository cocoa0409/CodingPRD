            - "R0 (BASIC van, 2026-08-05, default shift 08:00): stop for O0 (3 sedans) planned 08:00-09:15"
            - "R2 (ADVANCED van, 2026-08-05, lead T1, shift_start_at 09:45) empty; R3 (NONE van, 2026-08-05, lead T1, shift_start_at 09:30) empty"
            - "O_R2A (1 sedan + 2 SUVs) and O_R3A (1 sedan) CONFIRMED"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail TB", email: "rtb@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "PLAIN", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
