          assert:
            - "Submit fails with error_id == ERR_GRANT_NOT_ACTIVE (grant SUSPENDED; report itself is validly DRAFT)"
            - "PartnerReport.${rep_id}.status remains DRAFT and grant.reserved_cents remains 0"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (two different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: campaign_zip_cluster_half_open_overlap
        grounds:
          - calculations.campaign_overlap_check
          - "errors[ERR_CAMPAIGN_OVERLAP]"
          - "errors[ERR_CAMPAIGN_BUDGET_EXCEEDED]"
        distinguishing_aspect: |
          Resource OutreachCampaign zip_cluster with HALF-OPEN [window_start, window_end)
          semantics: a campaign starting exactly at the other's window_end is adjacent and
          allowed, while a one-day-earlier start conflicts — adjacency-allowed semantics.
        test_recipe:
          setup:
            - "ACTIVE campaign C1 on zip_cluster 90001 spanning [2026-06-01, 2026-08-01), budget 100000"
          setup_api_calls:
            - { call: "POST /api/outreach-campaigns", payload: { name: "Summer Push", zip_cluster: "90001", window_start: "2026-06-01", window_end: "2026-08-01", budget_cents: 100000, per_conversion_cents: 1000 }, as: CoalitionAdmin, captures: { c1_id: $.data.id } }
          trigger:
            - { call: "POST /api/outreach-campaigns", payload: { name: "Fall Push", zip_cluster: "90001", window_start: "2026-08-01", window_end: "2026-10-01", budget_cents: 50000, per_conversion_cents: 1000 }, as: CoalitionAdmin, captures: { c2_id: $.data.id } }
            - { call: "POST /api/outreach-campaigns", payload: { name: "Overlap Push", zip_cluster: "90001", window_start: "2026-07-15", window_end: "2026-09-01", budget_cents: 50000, per_conversion_cents: 1000 }, as: CoalitionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "C2 (start == C1.end, adjacent half-open) is created successfully with status ACTIVE"
            - "C3 (overlaps C1 by 17 days and C2 by 32 days) fails with error_id == ERR_CAMPAIGN_OVERLAP"
            - "Only 2 ACTIVE campaigns exist on zip_cluster 90001 afterwards"

      - name: review_window_min_gap_buffer
        grounds:
          - calculations.review_gap_check
          - "errors[ERR_REVIEW_GAP_VIOLATION]"
        distinguishing_aspect: |
          Resource PartnerInstitution review windows with CLOSED intervals plus a mandatory
          30-day buffer: period_start == prior period_end + 30 days is allowed (>=), one day
          earlier is rejected — buffer semantics, not half-open adjacency, and a different
          resource than campaigns.
        test_recipe:
          setup:
            - "Institution CERTIFIED via review with period_end 2026-02-28 (gap rule: next period_start >= 2026-03-30)"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev1: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev1}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev1}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "GET /api/partner-institutions/${inst_id}", payload: {}, as: CoalitionAdmin, captures: { inst_v2: $.data.version } }
          trigger:
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-03-29", period_end: "2026-04-15", expected_institution_version: "${inst_v2}" }, as: CoalitionAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-03-30", period_end: "2026-04-30", expected_institution_version: "${inst_v2}" }, as: CoalitionAdmin, captures: { rev2: $.data.id } }
          assert:
            - "period_start 2026-03-29 fails with error_id == ERR_REVIEW_GAP_VIOLATION (29 days < 30-day buffer)"
            - "period_start 2026-03-30 succeeds (== period_end + 30 days; >= comparison, equality allowed)"
            - "The failed first create did NOT bump institution.version (second create with the same expected_institution_version still passes OCC)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (two different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: grant_ledger_submit_reject_conserved
        grounds:
          - calculations.grant_ledger
          - state_machines.PartnerReport.DRAFT_to_SUBMITTED
          - state_machines.PartnerReport.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity: grant CENTS. available + reserved + disbursed == total_cents at
          every observation; the forward action (submit, reserving 4963) paired with its
          compensation (review REJECT) returns available_cents to exactly 500000 with
          disbursed_cents unchanged at 0.
        test_recipe:
          setup:
            - "CERTIFIED institution with one OPENED account; ACTIVE grant total 500000 cap 200000; report with claim 4963 in DRAFT"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { ref_id: $.data.id } }
            - { call: "POST /api/referrals/${ref_id}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p_id}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${ref_id}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/account-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/funding-grants", payload: { funder_name: "City Foundation", program_year: 2026, total_cents: 500000, per_report_cap_cents: 200000 }, as: CoalitionAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/funding-grants/${g_id}/activate", payload: {}, as: CoalitionAdmin, captures: { g_v: $.data.version } }
            - { call: "POST /api/partner-reports", payload: { institution_id: "${inst_id}", grant_id: "${g_id}", period_start: "2026-01-01", period_end: "2026-05-31", evaluation_mode: "FINAL", expected_grant_version: "${g_v}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { rep_id: $.data.id } }
          trigger:
            - { call: "POST /api/partner-reports/${rep_id}/submit", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "GET /api/funding-grants/${g_id}", payload: {}, as: CoalitionAdmin, captures: { avail_mid: $.data.available_cents, res_mid: $.data.reserved_cents, dis_mid: $.data.disbursed_cents } }
            - { call: "POST /api/partner-reports/${rep_id}/review", payload: { outcome: "REJECT" }, as: CoalitionAdmin }
            - { call: "GET /api/funding-grants/${g_id}", payload: {}, as: CoalitionAdmin, captures: { avail_end: $.data.available_cents, res_end: $.data.reserved_cents, dis_end: $.data.disbursed_cents } }
          assert:
            - "After submit: available_cents == 495037, reserved_cents == 4963, disbursed_cents == 0 (sum == 500000)"
            - "After review REJECT (compensation): available_cents == 500000, reserved_cents == 0, disbursed_cents == 0 (sum == 500000, zero drift)"
            - "PartnerReport.${rep_id}.status == REJECTED"

      - name: event_seats_book_unbook_conserved
        grounds:
          - calculations.event_capacity
          - state_machines.Referral.DOCS_COMPLETE_to_BOOKED
          - state_machines.Referral.BOOKED_to_DOCS_COMPLETE
        distinguishing_aspect: |
          Conserved quantity: event SEAT COUNT (integer occupancy, not cents). booked_count ==
          live count of BOOKED referrals at every observation; book + unbook is a
          forward/compensating pair leaving booked_count and the roster exactly as before.
        test_recipe:
          setup:
            - "CERTIFIED institution; SCHEDULED event capacity 2; two participants with DOCS_COMPLETE referrals"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-1", starts_at: "2026-05-10T09:00:00Z", ends_at: "2026-05-10T13:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p1: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p1}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r1: $.data.id } }
            - { call: "POST /api/referrals/${r1}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/participants", payload: { full_name: "Ben Okafor", date_of_birth: "1985-11-02", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p2: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p2}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r2: $.data.id } }
            - { call: "POST /api/referrals/${r2}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
          trigger:
            - { call: "POST /api/referrals/${r1}/book", payload: { event_id: "${ev_id}" }, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/referrals/${r2}/book", payload: { event_id: "${ev_id}" }, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "GET /api/account-opening-events/${ev_id}", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { bc_mid: $.data.booked_count } }
            - { call: "POST /api/referrals/${r1}/unbook", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "GET /api/account-opening-events/${ev_id}", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { bc_end: $.data.booked_count } }
            - { call: "GET /api/account-opening-events/${ev_id}/referrals", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { roster_n: "$.data[0].status" } }
          assert:
            - "After two books: event.booked_count == 2 (== capacity; invariant booked_count + remaining == capacity holds)"
            - "After unbook of R1: event.booked_count == 1 — the compensating action restores exactly one seat"
            - "Roster GET /api/account-opening-events/${ev_id}/referrals contains exactly 1 row and it is R2 in BOOKED (R1's booked_event_id was cleared)"
            - "Referral.${r1}.status == DOCS_COMPLETE and Referral.${r2}.status == BOOKED"
