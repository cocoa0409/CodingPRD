# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x >= 2 instances each (18 instances total).
# All literals precomputed against SCAFFOLD.yaml §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overpayment_provisional_vs_final
        grounds:
          - calculations.overpayment_amount
          - entities.Overpayment.fields.provisional_amount_cents
          - entities.Overpayment.fields.final_amount_cents
          - state_machines.Overpayment.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Same OverpaymentMonth rows, two entitlement bases: provisional (reported income)
          yields 35050 cents while final (verified income) yields 45050 cents on the
          Overpayment entity domain.
        test_recipe:
          setup:
            - "A SUBSTANTIATED case with an IHE Overpayment carrying two months whose reported and verified entitlements differ."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "John Doe", ssn_last4: "1234", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "DATA_MATCH", allegation_summary: "Unreported income" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/cases/${case_id}/assign"
              payload: { investigator_user_id: "inv-1" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/evidence"
              payload: { kind: "DATA_MATCH", description: "IEVS wage match" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE" }
              as: Supervisor
            - call: "POST /fraud-recovery/overpayments"
              payload: { case_id: "${case_id}", claim_type: "IHE" }
              as: Investigator
              captures: { op_id: $.data.id }
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-01", benefits_issued_cents: 50050, benefits_entitled_reported_cents: 30000, benefits_entitled_verified_cents: 20000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-02", benefits_issued_cents: 40000, benefits_entitled_reported_cents: 25000, benefits_entitled_verified_cents: 25000 }
              as: Investigator
          trigger:
            - call: "POST /fraud-recovery/overpayments/${op_id}/calculate"
              payload: {}
              as: Investigator
          assert:
            - "Overpayment.${op_id}.provisional_amount_cents == 35050"
            - "Overpayment.${op_id}.final_amount_cents == 45050"
            - "Overpayment.${op_id}.status == CALCULATED"

      - name: recovery_projection_regulatory_vs_scheduled
        grounds:
          - calculations.recovery_projection
          - entities.RecoveryPlan.fields.projected_months_regulatory
          - entities.RecoveryPlan.fields.projected_months_scheduled
        distinguishing_aspect: |
          Same outstanding principal (45050) on the RecoveryPlan entity domain: the
          regulatory-minimum pace projects 12 months (45050/3880) while the agreed
          schedule projects 5 months (45050/9010).
        test_recipe:
          setup:
            - "An IPV Overpayment (final 45050) DEMANDED with an ACTIVE RECOUPMENT plan (allotment 19400, scheduled 9010)."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Jane Roe", ssn_last4: "2222", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "HOTLINE", allegation_summary: "Trafficking" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/cases/${case_id}/assign"
              payload: { investigator_user_id: "inv-1" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/evidence"
              payload: { kind: "SURVEILLANCE", description: "Store video" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE" }
              as: Supervisor
            - call: "POST /fraud-recovery/overpayments"
              payload: { case_id: "${case_id}", claim_type: "IPV" }
              as: Investigator
              captures: { op_id: $.data.id }
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-01", benefits_issued_cents: 50050, benefits_entitled_reported_cents: 30000, benefits_entitled_verified_cents: 20000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-02", benefits_issued_cents: 40000, benefits_entitled_reported_cents: 25000, benefits_entitled_verified_cents: 25000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/calculate"
              payload: {}
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/establish"
              payload: {}
              as: Supervisor
            - call: "POST /fraud-recovery/overpayments/${op_id}/demand"
              payload: {}
              as: RecoveryOfficer
            - call: "POST /fraud-recovery/recovery-plans"
              payload: { overpayment_id: "${op_id}", method: "RECOUPMENT", start_date: "2026-05-01", end_date: "2027-05-01", monthly_allotment_cents: 19400, scheduled_monthly_cents: 9010 }
              as: RecoveryOfficer
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /fraud-recovery/recovery-plans/${plan_id}"
              payload: {}
              as: RecoveryOfficer
          assert:
            - "RecoveryPlan.${plan_id}.monthly_recoupment_cents == 3880"
            - "RecoveryPlan.${plan_id}.projected_months_regulatory == 12"
            - "RecoveryPlan.${plan_id}.projected_months_scheduled == 5"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: recoupment_tiered_rate_mode_a
        grounds:
          - calculations.recoupment_amount
          - entities.RecoveryPlan.fields.monthly_recoupment_cents
          - entities.Overpayment.fields.claim_type
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — claim_type branch selects
          rate 0.20 and floor 2000 (IPV), then min(45050, max(2000, round(0.20*19400)=3880))
          resolves to 3880 via nested min/max.
        test_recipe:
          setup:
            - "An IPV Overpayment (final 45050) DEMANDED with an ACTIVE RECOUPMENT plan (allotment 19400)."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Ada Poe", ssn_last4: "3333", primary_program: "TANF" }
              as: Intake
