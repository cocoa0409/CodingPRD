# =============================================================================
# PRD Benchmark Seed Tables — Alarm Dealer Origination, Contract Funding &
# Monitoring Transfer (Vivint-style)
#
# §1.0–§1.7 live in this file. The §1.8 Difficulty Design (Test Targeting Index)
# and §1.9 Corner Design (Coverage Index) are siblings:
#   SCAFFOLD_DIFFICULTY_DESIGN.yaml, SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Alarm Dealer Origination, Contract Funding & Monitoring Transfer (Vivint): direct and
  dealer channel origination where dealers sell contracts that are purchased by the company
  under funding criteria, contract quality standards including credit score, term and
  equipment configuration with holdback reserves, customer onboarding with equipment
  installation, system activation and monitoring center provisioning, attrition management
  with early cancellation, relocation and contract assumption processes, monitoring center
  operations with alarm verification, false alarm reduction and dispatch coordination,
  equipment financing separated from monitoring service with disclosure requirements, dealer
  chargeback when a funded contract cancels within a defined period, service and repair
  dispatch under warranty

domain_name: alarm-dealer-origination-contract-funding
api_prefix: /alarm-funding

complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: compliance / audit
  complexity_layers:
    - Optimistic concurrency
    - Cascading side effects
    - Scheduled / deferred actions
    - Rate / threshold triggers
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1 (§1.1): Entity-Relationship Table
# =============================================================================
entities:

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: dealer_code, type: string, source: input, description: "Dealer programme code supplied by the channel manager; the second half of the funded-package natural key" }
      - { name: legal_name, type: string, source: input, description: "Registered dealer legal name" }
      - { name: holdback_rate, type: number, source: input, description: "Fraction of the dealer remittance retained by the company as a holdback reserve", constraints: "0.0 <= holdback_rate <= 0.5" }
      - { name: quality_tier, type: enum, source: input, description: "Dealer quality band used in the funding-points base and the chargeback holdback release ceiling", constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: standing, type: enum, source: computed, description: "Dealer standing derived from funded-package counts", constraints: "ACTIVE | WATCH | SUSPENDED" }
      - { name: chargeback_balance_due_cents, type: integer, source: computed, description: "Unremitted dealer chargebacks (early-cancel, contract-quality clawback, monitoring-transfer-not-completed) net of dealer remittances and holdback applications", constraints: ">= 0" }
      - { name: holdback_reserve_cents, type: integer, source: computed, description: "Company-held holdback reserve balance for this dealer, net of holdback applications" }
      - { name: funded_package_count, type: integer, source: computed, description: "Count of this dealer's packages in state FUNDED" }
      - { name: chargeback_rate_12mo_sum, type: integer, source: computed, description: "Numerator L of dealer_chargeback_rate; summed charged_back_count over the trailing 12 logical months" }
      - { name: funding_package_count_12mo, type: integer, source: computed, description: "Denominator D of dealer_chargeback_rate; count of this dealer's packages in state FUNDED for the trailing 12 logical months" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: contract_number, type: string, source: system, description: "Company-stamped contract number, assigned on funding" }
      - { name: source_channel, type: enum, source: input, description: "Origination channel", constraints: "DIRECT | DEALER" }
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; the selling dealer (DEALER channel only). Null for DIRECT channel" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscriber the contract is sold to" }
      - { name: dealer_package_id, type: string, source: input, description: "FK -> DealerPackage.id; the originating package (DEALER channel only). Null for DIRECT channel" }
      - { name: equipment_config_code, type: enum, source: input, description: "Equipment configuration under contract", constraints: "BASE | PREMIUM | ELITE" }
      - { name: credit_score, type: integer, source: input, description: "FICO-style credit score captured at origination", constraints: "300 <= credit_score <= 850" }
      - { name: contract_term_months, type: integer, source: input, description: "Monitoring contract term in months", constraints: "12 <= contract_term_months <= 84" }
      - { name: monthly_monitoring_cents, type: integer, source: input, description: "Recurring monitoring fee, billed separately from equipment financing", constraints: "> 0" }
      - { name: capex_cents, type: integer, source: computed, description: "Funded capitalised equipment amount used in funding_fee" }
      - { name: funding_amount_cents, type: integer, source: computed, description: "Net cash remitted to the originating party at funding, net of the dealer holdback" }
      - { name: holdback_cents, type: integer, source: computed, description: "Holdback reserve retained by the company at funding" }
      - { name: holdback_remaining_cents, type: integer, source: computed, description: "Portion of holdback_cents never applied to a post-warranty dealer service sweep" }
      - { name: dealer_holdback_sweep_cents, type: integer, source: computed, description: "Aggregate of dealer service sweep amounts applied against this dealer's holdback for this contract", default: 0 }
      - { name: contract_status, type: enum, source: computed, description: "Contract lifecycle state", constraints: "PENDING_VALIDATION | ACTIVE | DELINQUENT | CANCELLED | ASSUMED" }
      - { name: equipment_financed_cents, type: integer, source: computed, description: "Equipment-financed portion shown on the disclosure" }
      - { name: financed_charge_at_apr_cents, type: integer, source: input, description: "Total finance charge at the disclosed APR for the equipment-financed portion, supplied at origination", default: 0 }
      - { name: equipment_payment_cents, type: integer, source: computed, description: "Monthly equipment-financed payment, equal to equipment_financed_cents / contract_term_months" }
      - { name: post_warranty_cents, type: integer, source: computed, description: "Billable base for the dealer post-warranty service sweep (RESUMPTION variant uses post_warranty_cents * 3)" }
      - { name: warranty_months, type: integer, source: system, description: "Warranty coverage window from funding", default: 6 }
      - { name: assumption_count, type: integer, source: computed, description: "Number of times this contract has been assumed by a new subscriber" }
      - { name: funding_points, type: number, source: computed, description: "Funded-package funding multiplier applied to capex_cents; 0 for DIRECT channel", default: 0 }
      - { name: attrition_checked_at, type: datetime, source: system, description: "Logical-clock instant of the last attrition sweep this contract was included in; null until first sweep" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant the contract reached ACTIVE; null until funded" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical-clock instant the contract reached CANCELLED; null otherwise" }
      - { name: cancelled_from_status, type: enum, source: system, description: "Contract status observed immediately before cancellation; drives the compliance disclosure floor", default: null, constraints: "PENDING_VALIDATION | ACTIVE | DELINQUENT | null" }
      - { name: chargeback_exempt, type: boolean, source: system, description: "Set true by an approved onsite-install install waiver; exempts any chargeback arising from this contract", default: false }
      - { name: equipment_financing_disclosed, type: boolean, source: system, description: "Set true when the equipment-financing disclosure is issued for this contract; null until an install completes", default: null }
      - { name: validation_failure_code, type: enum, source: system, description: "Freezing origination gate code captured when a contract is cancelled out of PENDING_VALIDATION; null for every other cancellation", default: null, constraints: "ERR_CREDIT_SCORE_BELOW_FLOOR | ERR_TERM_BELOW_FLOOR | ERR_EQUIPMENT_CONFIG_NOT_PERMITTED | ERR_MONITORING_NOT_PROVISIONED | ERR_FUNDING_WINDOW_EXPIRED | ERR_PACKAGE_DECLINED | null" }
      - { name: monitoring_hold_until, type: datetime, source: system, description: "Logical instant a service/admin hold on the contract lifts; an attrition sweep skips an ACTIVE contract whose monitoring_hold_until is after the sweep instant", default: null }

  - name: DealerPackage
    parent: Dealer
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; the selling dealer; the first half of the funded-package natural key" }
      - { name: package_reference, type: string, source: input, description: "Dealer's own package reference; the second half of the funded-package natural key" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant the package was submitted for funding" }
      - { name: package_status, type: enum, source: computed, description: "Funding-package lifecycle state", constraints: "DRAFT | UNDER_REVIEW | APPROVED | FUNDED | DECLINED | EXPIRED" }
      - { name: package_capex_cents, type: integer, source: computed, description: "Sum of capex_cents over child contracts declared FUNDED" }
      - { name: package_holdback_cents, type: integer, source: computed, description: "Sum of holdback_cents over child contracts declared FUNDED" }
      - { name: package_funding_amount_cents, type: integer, source: computed, description: "Sum of funding_amount_cents over child contracts declared FUNDED" }
      - { name: funded_count, type: integer, source: computed, description: "Count of child contracts declared FUNDED" }
      - { name: declined_count, type: integer, source: computed, description: "Count of child contracts declared DECLINED" }
      - { name: submitted_contract_count, type: integer, source: computed, description: "Count of all child contracts, any status" }
      - { name: expires_at, type: datetime, source: computed, description: "Logical instant at which the package funding window closes; the approval instant plus funding_window_days" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock instant the package left UNDER_REVIEW (FUNDED or DECLINED); null otherwise" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Subscriber name" }
      - { name: email, type: string, source: input, description: "Subscriber email", constraints: "unique across Customer" }
      - { name: phone, type: string, source: input, description: "Subscriber phone used for monitoring provisioning" }
      - { name: status, type: enum, source: computed, description: "Subscriber state", constraints: "PENDING_ACTIVATION | ACTIVE | CANCELLED | ASSUMED" }

  - name: Site
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract this site is protected under" }
      - { name: address_line, type: string, source: input, description: "Street address of the protected premises" }
      - { name: city, type: string, source: input, description: "City of the protected premises" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code", constraints: "len == 2" }
      - { name: postal_code, type: string, source: input, description: "Postal code" }
      - { name: occupancy_status, type: enum, source: computed, description: "Occupancy of the protected premises", constraints: "OCCUPIED | VACATED" }

  - name: Installation
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract being installed" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled installation instant" }
      - { name: duration_minutes, type: integer, source: input, description: "Installation slot length in minutes", default: 180 }
      - { name: installation_engineer_id, type: string, source: input, description: "Installer crew identifier; the resource whose installation windows must not overlap" }
      - { name: install_status, type: enum, source: computed, description: "Installation lifecycle state", constraints: "SCHEDULED | COMPLETED | FAILED" }
      - { name: equipment_config_code, type: enum, source: computed, description: "Copied from the contract at completion", constraints: "BASE | PREMIUM | ELITE" }
      - { name: activation_committed, type: boolean, source: system, description: "Set true when a monitoring transfer has been committed against this installation; failure after commit requeues instead of cancelling", default: false }

  - name: MonitoringAccount
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract this monitoring account services" }
      - { name: central_station_host, type: string, source: system, description: "Central-station host provisioned for this account" }
      - { name: monitoring_account_number, type: string, source: system, description: "Central-station account number", constraints: "unique across MonitoringAccount" }
      - { name: provision_state, type: enum, source: computed, description: "Provisioning lifecycle of the monitoring account", constraints: "UNPROVISIONED | PROVISIONED | SUSPENDED | CLOSED" }
      - { name: activation_gate_met, type: boolean, source: system, description: "Set true on the monitoring-account provisioning trigger; must be true before a package may fund", default: false }

  - name: AlarmEvent
    parent: MonitoringAccount
    common_fields: true
    fields:
      - { name: monitoring_account_id, type: string, source: input, description: "FK -> MonitoringAccount.id; the account that received the alarm" }
      - { name: signal_source, type: string, source: input, description: "Sensor or zone that raised the alarm" }
      - { name: occurred_at, type: datetime, source: input, description: "Logical instant the signal was received; carried on the alarm-creation request" }
      - { name: entered_at_utc, type: datetime, source: input, description: "Client-supplied logical instant of the alarm, used for the false-alarm window; when omitted the server uses occurred_at", default: null }
      - { name: verification_outcome, type: enum, source: computed, description: "Verification outcome of the alarm", constraints: "PENDING | VERIFIED | FALSE_ALARM" }
      - { name: verified_at, type: datetime, source: computed, description: "Logical-clock instant the alarm was verified; null until verified" }
      - { name: counted_for_false_alarm, type: boolean, source: system, description: "Set true when the alarm entered the verified window and the account was provisioned; drives the false-alarm ratio numerator", default: false }
      - { name: counted_for_window_total, type: boolean, source: system, description: "Set true for every alarm whose occurred_at falls in the ratio window; drives the false-alarm ratio denominator", default: false }

  - name: DispatchRequest
    parent: AlarmEvent
    common_fields: true
    fields:
      - { name: alarm_event_id, type: string, source: input, description: "FK -> AlarmEvent.id; the alarm that prompted dispatch" }
      - { name: dispatch_status, type: enum, source: computed, description: "Dispatch lifecycle state", constraints: "REQUESTED | DISPATCHED | COMPLETED | ABORTED | CLOSED" }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock instant the dispatch was requested" }
      - { name: dispatched_at, type: datetime, source: computed, description: "Logical-clock instant the dispatch was released; null until dispatch occurs" }
      - { name: abort_reason, type: string, source: input, description: "Reason recorded when a dispatch is aborted or closed", default: "" }

  - name: AlarmReductionAction
    parent: MonitoringAccount
    common_fields: true
    fields:
      - { name: monitoring_account_id, type: string, source: input, description: "FK -> MonitoringAccount.id; the account under a false-alarm watch" }
      - { name: action_type, type: enum, source: input, description: "False-alarm reduction measure", constraints: "WATCH | TRAINING_REQUIRED | SERVICE_REQUIRED" }
      - { name: triggered_at, type: datetime, source: system, description: "Logical-clock instant the reduction action was raised" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock instant the reduction action was cleared; null while open" }
      - { name: action_status, type: enum, source: computed, description: "Reduction-action state", constraints: "OPEN | RESOLVED" }

  - name: AttritionSweep
    parent: null
    common_fields: true
    fields:
      - { name: sweep_month, type: string, source: input, description: "Logical month label as YYYY-MM", constraints: "unique across AttritionSweep" }
      - { name: ran_at, type: datetime, source: system, description: "Logical-clock instant the sweep ran" }
      - { name: evaluated_count, type: integer, source: system, description: "Contracts whose attrition cohort prefix equaled the sweep month" }
      - { name: delinquent_count, type: integer, source: system, description: "Eligible contracts moved to DELINQUENT" }
      - { name: resumed_count, type: integer, source: system, description: "DELINQUENT contracts returned to ACTIVE by REACTIVATE_SERVICE" }
      - { name: flagged_contract_ids, type: array, source: system, description: "Contract ids appended by this sweep, in ascending created_at order of the contract row; each append is the trigger for that contract's monitoring-account SUSPEND cascade", default: [] }

  - name: AttritionFlag
    parent: AttritionSweep
    common_fields: true
    fields:
      - { name: attrition_sweep_id, type: string, source: input, description: "FK -> AttritionSweep.id; the sweep that raised this flag" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract entering attrition" }
      - { name: cohort_month, type: string, source: input, description: "Logical month of the contract's activated_at, as YYYY-MM" }
      - { name: flagged_at, type: datetime, source: system, description: "Logical-clock instant the flag was raised" }

  - name: ServiceVisit
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract the visit services" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled service instant" }
      - { name: duration_minutes, type: integer, source: input, description: "Service slot length in minutes", default: 120 }
      - { name: work_type, type: enum, source: input, description: "Service or repair work type", constraints: "REPAIR | WARRANTY_REPAIR" }
      - { name: technician_id, type: string, source: input, description: "Technician identifier; the resource whose service windows must not overlap" }
      - { name: warranty_status_at_visit, type: boolean, source: computed, description: "True when scheduled_at is at or before the warranty window end (activated_at plus warranty_months); decides billing and the dealer sweep" }
      - { name: billing_route, type: enum, source: computed, description: "Who bears the visit cost", default: null, constraints: "CUSTOMER | DEALER_HOLDBACK | null" }
      - { name: billed_cents, type: integer, source: computed, description: "Flat visit fee charged", default: 0 }
      - { name: dealer_sweep_cents, type: integer, source: computed, description: "Amount applied against the dealer holdback for this Post-Warranty Dealer-Billable visit" }
      - { name: allowed_duration_minutes, type: integer, source: input, description: "Requested service-slot length carried on the visit; used only for technician-window overlap detection", default: 60 }
      - { name: visit_status, type: enum, source: computed, description: "Service visit lifecycle state", constraints: "REQUESTED | SCHEDULED | PERFORMED | CANCELLED" }
      - { name: performed_at, type: datetime, source: computed, description: "Logical-clock instant the visit was performed; null until performed" }

  - name: ContractOwner
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract whose ownership is recorded" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscriber currently owning the contract" }
      - { name: ownership_status, type: enum, source: computed, description: "Ownership segment life cycle", constraints: "CURRENT | SUPERSEDED" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock instant this ownership segment began" }
      - { name: ended_at, type: datetime, source: system, description: "Logical-clock instant this segment was superseded; null while CURRENT" }
      - { name: assumption_request_id, type: string, source: system, description: "FK -> AssumptionRequest.id; the assumption that produced this segment, null for the original owner", default: null }

  - name: AssumptionRequest
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract being assumed" }
      - { name: incoming_customer_id, type: string, source: input, description: "FK -> Customer.id; the subscriber assuming the contract" }
      - { name: incoming_credit_score, type: integer, source: input, description: "Credit score of the incoming subscriber", constraints: "300 <= incoming_credit_score <= 850" }
      - { name: residence_state_code, type: string, source: input, description: "Two-letter state of the incoming subscriber's residence; must lie inside the relocation service radius", constraints: "len == 2" }
      - { name: request_status, type: enum, source: computed, description: "Assumption-request lifecycle state", constraints: "PENDING_NEGOTIATION | REJECTED | ACCEPTED | COMPLETED" }
      - { name: rejection_count, type: integer, source: system, description: "Number of recorded credit rejections on the negotiation cycle", default: 0 }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant acceptance was recorded; null until accepted" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant the assumption completed; null until completed" }

  - name: RescissionRequest
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the funded contract under rescission" }
      - { name: operator_id, type: string, source: input, description: "Opaque operator identifier of the requestor" }
      - { name: days_since_funding, type: integer, source: computed, description: "Whole calendar days between the contract's funding instant and the request instant" }
      - { name: request_status, type: enum, source: computed, description: "Rescission lifecycle state", constraints: "REQUESTED | APPROVED | DECLINED" }
      - { name: approved_by, type: string, source: system, description: "Opaque operator identifier that approved the rescission; null until approved" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock instant the rescission was approved; null until approved" }

state_machines:
  - entity: Dealer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: WATCH
        trigger: "POST /alarm-funding/dealers/{id}/chargeback-rate-recompute"
        actor: FundingAnalyst
        preconditions:
          - "L is the number of packages in state FUNDED whose dealer_id is this dealer and whose closed_at falls within the trailing 12 logical months ending at the current logical clock"
          - "D is the number of this dealer's contracts whose contract_status is CANCELLED, current cancelled_from_status == 'ACTIVE' AND activated_at is non-null, between activated_at and cancelled_at inclusive at least one valid INADVERTENT_ALARM AlarmEvent existed (verified_at non-null, verification_outcome in {VERIFIED, FALSE_ALARM}), and cancelled_at falls within the trailing 12 logical months"
          - "the computed chargeback_rate_percent is strictly greater than 12.00"
        side_effects:
          - "sets Dealer.chargeback_rate_12mo_sum = L and Dealer.funding_package_count_12mo = D"
          - "increments Dealer.version by 1"
        note: "WATCH is derived by this recompute trigger; an attempt to POST /dealer-packages for a dealer in WATCH is rejected with ERR_DEALER_CHARGEBACK_RATE_EXCEEDED, never silently accepted."
      - from: WATCH
        to: ACTIVE
        trigger: "POST /alarm-funding/dealers/{id}/chargeback-rate-recompute"
        actor: FundingAnalyst
        preconditions:
          - "the recomputed chargeback_rate_percent is at or below 12.00"
        side_effects:
          - "updates Dealer.chargeback_rate_12mo_sum, Dealer.funding_package_count_12mo and Dealer.chargeback_balance_due_cents"
          - "increments Dealer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /alarm-funding/dealers/{id}/suspend"
        actor: FundingAnalyst
        preconditions:
          - "no precondition beyond authorization: an administrative suspension is an explicit operator action, and the automatic path that also yields SUSPENDED is dealer_standing_derivation when chargeback_balance_due_cents exceeds 500000"
        side_effects:
          - "increments Dealer.version by 1"
        note: "A dealer in SUSPENDED cannot have a package approved: POST /dealer-packages/{id}/approve is rejected with ERR_DEALER_STANDING_SUSPENDED."
      - from: WATCH
        to: SUSPENDED
        trigger: "POST /alarm-funding/dealers/{id}/suspend"
        actor: FundingAnalyst
        preconditions:
          - "no precondition beyond authorization (administrative suspension)"
        side_effects:
          - "increments Dealer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /alarm-funding/dealers/{id}/reinstate"
        actor: FundingAnalyst
        preconditions:
          - "Dealer.chargeback_balance_due_cents == 0"
          - "the recomputed chargeback_rate_percent is at or below 12.00"
        side_effects:
          - "increments Dealer.version by 1"
      - from: SUSPENDED
        to: WATCH
        trigger: "POST /alarm-funding/dealers/{id}/reinstate"
        actor: FundingAnalyst
        preconditions:
          - "Dealer.chargeback_balance_due_cents == 0"
          - "the recomputed chargeback_rate_percent is strictly greater than 12.00"
        side_effects:
          - "increments Dealer.version by 1"

  - entity: DealerPackage
    initial_state: DRAFT
    terminal_states: [FUNDED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /alarm-funding/dealer-packages/{id}/submit"
        actor: Dealer
        preconditions:
          - "at least one child contract exists on the package"
        side_effects:
          - "stamps DealerPackage.submitted_at from the logical clock"
          - "increments DealerPackage.version by 1"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /alarm-funding/dealer-packages/{id}/withdraw"
        actor: Dealer
        preconditions:
          - "no child contract is in a terminal contract state"
        side_effects:
          - "clears DealerPackage.submitted_at"
          - "increments DealerPackage.version by 1"
        note: "The negotiation cycle DRAFT -> UNDER_REVIEW -> DRAFT may repeat without bound; each pass re-runs the whole-package evaluation on submit."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /alarm-funding/dealer-packages/{id}/approve"
        actor: FundingAnalyst
        preconditions:
          - "the package reference is unique within the dealer"
          - "Dealer.standing is not SUSPENDED"
        side_effects:
          - "runs package_funding_posture; writes the package's allowed_holdback_rate_ceiling_cents and the returned package_posture into DealerPackage.package_holdback_cents"
          - "sets DealerPackage.expires_at = approval instant + funding_window_days"
          - "increments DealerPackage.version by 1"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /alarm-funding/dealer-packages/{id}/reopen"
        actor: FundingAnalyst
        preconditions:
          - "DealerPackage.funded_count == 0"
        side_effects:
          - "clears DealerPackage.expires_at"
          - "increments DealerPackage.version by 1"
      - from: APPROVED
        to: FUNDED
        trigger: "POST /alarm-funding/dealer-packages/{id}/fund"
        actor: FundingAnalyst
        preconditions:
          - "at least one child contract is in PENDING_VALIDATION"
          - "the datetime is at or before DealerPackage.expires_at"
        side_effects:
          - "sets DealerPackage.closed_at from the logical clock"
          - "increments DealerPackage.version by 1"
          - "runs package_funding_posture and cascades the package funding cascade down to every child contract in PENDING_VALIDATION (grant contracts move to ACTIVE; gate-failing contracts move to CANCELLED, and a cancelled child with validation_failure_code ERR_CREDIT_SCORE_BELOW_FLOOR flips the package to DECLINED)"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /alarm-funding/dealer-packages/{id}/decline"
        actor: FundingAnalyst
        preconditions:
          - "no precondition beyond authorization"
        side_effects:
          - "sets DealerPackage.closed_at from the logical clock"
          - "increments DealerPackage.version by 1"
          - "cascades a decline to every child contract still in PENDING_VALIDATION"
      - from: APPROVED
        to: EXPIRED
        trigger: "system event — pending-expiry sweep"
        actor: system
        preconditions:
          - "DealerPackage.expires_at is strictly before the current logical clock"
          - "the package was last observed in state APPROVED"
        side_effects:
          - "sets DealerPackage.closed_at from the logical clock, equal to the sweep-observed expiry instant"
          - "increments DealerPackage.version by 1"
          - "cascades a deadline miss to every child contract still in PENDING_VALIDATION, freezing each with validation_failure_code ERR_FUNDING_WINDOW_EXPIRED"
        note: "Observed opportunistically by the next write touching a funding verb — no wall-clock wait; the sweep compares DealerPackage.expires_at against the logical clock at the moment of the request."

  - entity: Contract
    initial_state: PENDING_VALIDATION
    terminal_states: [CANCELLED, ASSUMED]
    transitions:
      - from: PENDING_VALIDATION
        to: ACTIVE
        trigger: "POST /alarm-funding/dealer-packages/{id}/fund or POST /alarm-funding/contracts/{id}/fund"
        actor: FundingAnalyst
        preconditions:
          - "the parent DealerPackage is APPROVED and the datetime is at or before DealerPackage.expires_at"
          - "credit_score >= 620 and contract_term_months >= 36"
          - "a monitoring account is PROVISIONED, or an approved onsite-install install waiver is present"
          - "the equipment configuration is on the contract quality matrix for the channel"
        side_effects:
          - "runs equipment_financing_split with the frozen credit_band; sets equipment_financed_cents, equipment_payment_cents, equipment_financing_disclosed = false"
          - "runs funding_fee; sets holdback_cents, holdback_remaining_cents = holdback_cents, funding_amount_cents, capex_cents"
          - "sets Contract.funding_points from Dealer.quality_tier"
          - "sets Contract.contract_status = ACTIVE and stamps Contract.activated_at from the logical clock"
          - "sets Customer.status = ACTIVE"
          - "increments Contract.version by 1"
        note: "The contract funding cascade is the depth-3 chain driven by package_funding_posture; the package version bump is applied once by package_funding_posture, not once per funded child."
      - from: PENDING_VALIDATION
        to: CANCELLED
        trigger: "POST /alarm-funding/dealer-packages/{id}/fund or POST /alarm-funding/dealer-packages/{id}/decline"
        actor: FundingAnalyst
        preconditions:
          - "the contract failed at least one origination funding gate"
        side_effects:
          - "freezes the failing gate name and code into Contract.validation_failure_code"
          - "sets Contract.cancelled_from_status = PENDING_VALIDATION and stamps Contract.cancelled_at from the logical clock"
          - "increments DealerPackage.declined_count by 1 and DealerPackage.version by 1"
        note: "No dealer chargeback arises here; the FAILED_GATE_TO_DEALER_RATE_CHANGE hop of the origination-window cascade is a rate-only recompute on Dealer (chargeback_balance_due_cents unchanged)."
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /alarm-funding/attrition-sweeps/run"
        actor: FundingAnalyst
        preconditions:
          - "the contract's cohort month is at or before the sweep month"
          - "Contract.monitoring_hold_until is null or not after the sweep instant"
        side_effects:
          - "appends Contract.id to the AttritionSweep.flagged_contract_ids array and increments AttritionSweep.delinquent_count"
          - "the AttritionFlag append itself triggers a SUSPEND cascade on the contract's monitoring account"
          - "sets Contract.attrition_checked_at from the logical clock"
          - "increments Contract.version by 1"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /alarm-funding/contracts/{id}/reactivate-service"
        actor: ServiceCoordinator
        preconditions:
          - "an open AlarmReductionAction of type SERVICE_REQUIRED exists on the contract's monitoring account"
        side_effects:
          - "resolves that AlarmReductionAction and stamps its resolved_at from the logical clock"
          - "re-provisions the monitoring account to PROVISIONED and increments MonitoringAccount.version by 1"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /alarm-funding/contracts/{id}/cancel"
        actor: Customer
        preconditions:
          - "for DEALER-channel contracts the cancellation-on-backlog check passes: the count of that dealer's contracts in status ACTIVE is strictly less than the dealer backlog threshold of 8; for DIRECT-channel contracts (dealer_id null) the backlog test does not apply"
        side_effects:
          - "sets Contract.cancelled_from_status = ACTIVE and stamps Contract.cancelled_at from the logical clock"
          - "sets Customer.status = CANCELLED iff the contract is the customer's last contract not in a terminal state"
          - "closes the contract's monitoring account and cascades CLOSED to every non-terminal dispatch of that account"
          - "if the contract's post_warranty_cents is strictly greater than post_warranty_sweep_threshold_cents, runs dealer_holdback_sweep against the dealer's holdback reserve; this sweep auto-transitions any open SERVICE_REQUIRED AlarmReductionAction of the account to RESOLVED and recomputes Dealer.standing"
          - "increments Contract.version by 1"
      - from: DELINQUENT
        to: CANCELLED
        trigger: "POST /alarm-funding/contracts/{id}/cancel"
        actor: Customer
        preconditions:
          - "the contract is in DELINQUENT, so the backlog test does not apply"
        side_effects:
          - "sets Contract.cancelled_from_status = DELINQUENT and stamps Contract.cancelled_at from the logical clock"
          - "sets Customer.status = CANCELLED iff the contract is the customer's last contract not in a terminal state"
          - "closes the contract's monitoring account and cascades CLOSED to every non-terminal dispatch of that account"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: ASSUMED
        trigger: "POST /alarm-funding/assumption-requests/{id}/complete"
        actor: Customer
        preconditions:
          - "the assumption request is ACCEPTED and the incoming subscriber meets the credit floor"
          - "the outgoing Customer has at least one other contract whose status is in {ACTIVE, DELINQUENT}"
        side_effects:
          - "sets Customer.status = ASSUMED on the outgoing subscriber and moves the contract to the incoming subscriber"
          - "sets Contract.assumption_count = Contract.assumption_count + 1"
          - "increments the incoming Customer.version by 1"
          - "increments Contract.version by 1"
        note: "ASSUMED is terminal for the outgoing subscriber's interest but the contract itself remains monitored under the incoming subscriber."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /alarm-funding/rescission-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "the request instant is at or before the funding instant plus rescission_window_days = 5"
          - "the approving operator id differs from the requesting operator id (segregation of duties)"
        side_effects:
          - "sets Contract.cancelled_from_status = ACTIVE and stamps Contract.cancelled_at from the logical clock"
          - "records RescissionRequest.approved_by and approved_at, and sets RescissionRequest.request_status = APPROVED"
          - "creates the equipment_and_rescission_refund_floor adjudication, cascading the refund into Dealer.chargeback_balance_due_cents and holdback_reserve_cents"
          - "closes the contract's monitoring account and cascades CLOSED to every non-terminal dispatch of that account"
          - "increments Contract.version by 1"

  - entity: Site
    initial_state: OCCUPIED
    terminal_states: [VACATED]
    transitions:
      - from: OCCUPIED
        to: VACATED
        trigger: "POST /alarm-funding/contracts/{id}/cancel"
        actor: Customer
        preconditions:
          - "the contract cancellation is itself permitted"
        side_effects:
          - "sets Site.occupancy_status = VACATED"
          - "increments Site.version by 1"
        note: "A site returns to OCCUPIED by a relocation, where the new Site row is created OCCUPIED and the old one is VACATED — never by a reverse transition."

  - entity: Installation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /alarm-funding/installations/{id}/mark-failed"
        actor: ServiceCoordinator
        preconditions:
          - "Installation.activation_committed is false"
        side_effects:
          - "increments Installation.version by 1"
          - "increments the parent Contract.version by 1 via a task-bubble"
        note: "When Installation.activation_committed is true the same request requeues the installation: install_status stays SCHEDULED and Installation.version increments by 1 (no FAILED transition)."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /alarm-funding/installations/{id}/complete"
        actor: ServiceCoordinator
        preconditions:
          - "the associated monitoring transfer has been committed"
        side_effects:
          - "runs equipment_financing_split; persists Contract.equipment_financed_cents, Contract.equipment_payment_cents and Contract.equipment_financing_disclosed = false"
          - "sets Installation.install_status = COMPLETED and refreshes Contract.updated_at"
          - "increments Installation.version by 1 and Contract.version by 1"
          - "issues the equipment-financing disclosure: sets Contract.equipment_financing_disclosed = true, recording equipment_financed_cents, monthly_monitoring_cents, financed_payment_cents and the per-installment-rounded total_of_payments_cents on the contract's disclosure"

  - entity: MonitoringAccount
    initial_state: UNPROVISIONED
    terminal_states: [CLOSED]
    transitions:
      - from: UNPROVISIONED
        to: PROVISIONED
        trigger: "POST /alarm-funding/monitoring-transfers/{id}/trigger"
        actor: MonitoringOperator
        preconditions:
          - "MonitoringAccount.site_id is on file"
        side_effects:
          - "sets MonitoringAccount.provision_state = PROVISIONED"
          - "sets MonitoringAccount.activation_gate_met = true"
          - "increments MonitoringAccount.version by 1"
      - from: PROVISIONED
        to: SUSPENDED
        trigger: "system event — AttritionFlag creation"
        actor: system
        preconditions:
          - "an AttritionFlag for the contract was created"
        side_effects:
          - "sets MonitoringAccount.provision_state = SUSPENDED"
          - "increments MonitoringAccount.version by 1"
        note: "This is the middle hop of the attrition cascade and the second hop of the relocation cascade."
      - from: SUSPENDED
        to: PROVISIONED
        trigger: "POST /alarm-funding/contracts/{id}/reactivate-service"
        actor: ServiceCoordinator
        preconditions:
          - "the AlarmReductionAction of type SERVICE_REQUIRED has been resolved"
        side_effects:
          - "sets MonitoringAccount.provision_state = PROVISIONED"
          - "increments MonitoringAccount.version by 1"
      - from: PROVISIONED
        to: CLOSED
        trigger: "POST /alarm-funding/contracts/{id}/cancel"
        actor: Customer
        preconditions:
          - "the contract cancellation is itself permitted"
        side_effects:
          - "sets MonitoringAccount.provision_state = CLOSED"
          - "cascades CLOSED to every dispatch of this account whose dispatch_status is in {REQUESTED, DISPATCHED}"
          - "increments MonitoringAccount.version by 1"

  - entity: AlarmEvent
    initial_state: PENDING
    terminal_states: [VERIFIED, FALSE_ALARM]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /alarm-funding/alarm-events/{id}/verify"
        actor: MonitoringOperator
        preconditions:
          - "AlarmEvent.entered_at_utc is within the verified window [occurred_at - 30s, occurred_at + 120s] inclusive"
        side_effects:
          - "sets AlarmEvent.verification_outcome = VERIFIED and stamps AlarmEvent.verified_at from the logical clock"
          - "sets AlarmEvent.counted_for_window_total = true and AlarmEvent.counted_for_false_alarm = true iff the account was PROVISIONED at occurred_at"
          - "the false-alarm ratio predicate is evaluated on read, so no field of MonitoringAccount changes here"
          - "increments AlarmEvent.version by 1"
      - from: PENDING
        to: FALSE_ALARM
        trigger: "POST /alarm-funding/alarm-events/{id}/mark-false"
        actor: MonitoringOperator
        preconditions:
          - "AlarmEvent.entered_at_utc is within the verified window"
        side_effects:
          - "sets AlarmEvent.verification_outcome = FALSE_ALARM and stamps AlarmEvent.verified_at from the logical clock"
          - "sets AlarmEvent.counted_for_window_total = true; leaves counted_for_false_alarm false because a false alarm is not a verified alarm"
          - "increments AlarmEvent.version by 1"
      - from: PENDING
        to: VERIFIED
        trigger: "POST /alarm-funding/dispatch-requests"
        actor: MonitoringOperator
        preconditions:
          - "the alarm event is PENDING"
        side_effects:
          - "sets AlarmEvent.verification_outcome = VERIFIED and stamps AlarmEvent.verified_at"
          - "sets AlarmEvent.counted_for_window_total = true and AlarmEvent.counted_for_false_alarm = true iff the account was PROVISIONED at occurred_at"
          - "creates a DispatchRequest in REQUESTED"
          - "increments AlarmEvent.version by 1"

  - entity: DispatchRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, ABORTED, CLOSED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /alarm-funding/dispatch-requests/{id}/dispatch"
        actor: MonitoringOperator
        preconditions:
          - "the monitoring account is PROVISIONED"
        side_effects:
          - "stamps DispatchRequest.dispatched_at from the logical clock"
          - "increments DispatchRequest.version by 1"
      - from: DISPATCHED
        to: ABORTED
        trigger: "POST /alarm-funding/dispatch-requests/{id}/abort"
        actor: MonitoringOperator
        preconditions:
          - "the dispatch is strictly inside the pre-arrival abort window, entered_at_utc + 60s"
          - "the mass-cancel guard has not tripped: fewer than 3 ABORTED dispatches exist for the alarm event's monitoring account at or after occurred_at"
        side_effects:
          - "records DispatchRequest.abort_reason"
          - "increments DispatchRequest.version by 1"
      - from: REQUESTED
        to: CLOSED
        trigger: "POST /alarm-funding/dispatch-requests/{id}/abort"
        actor: MonitoringOperator
        preconditions:
          - "no precondition beyond authorization"
        side_effects:
          - "records DispatchRequest.abort_reason"
          - "increments DispatchRequest.version by 1"
        note: "Closing a REQUESTED dispatch counts toward the mass-cancel guard exactly like aborting a DISPATCHED one."
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /alarm-funding/dispatch-requests/{id}/complete"
        actor: MonitoringOperator
        preconditions:
          - "the dispatch is DISPATCHED"
        side_effects:
          - "increments DispatchRequest.version by 1"

  - entity: AlarmReductionAction
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /alarm-funding/contracts/{id}/reactivate-service"
        actor: ServiceCoordinator
        preconditions:
          - "the AlarmReductionAction.action_type is SERVICE_REQUIRED"
        side_effects:
          - "stamps AlarmReductionAction.resolved_at from the logical clock"
          - "increments AlarmReductionAction.version by 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /alarm-funding/service-visits"
        actor: ServiceCoordinator
        preconditions:
          - "the visit is Post-Warranty Dealer-Billable and the account is in false-alarm watch"
        side_effects:
          - "stamps AlarmReductionAction.resolved_at from the logical clock and applies a post-warranty service sweep against the dealer holdback"
          - "increments AlarmReductionAction.version by 1"

  - entity: AssumptionRequest
    initial_state: PENDING_NEGOTIATION
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: PENDING_NEGOTIATION
        to: PENDING_NEGOTIATION
        trigger: "POST /alarm-funding/assumption-requests/{id}/reject"
        actor: FundingAnalyst
        preconditions:
          - "incoming_credit_score is strictly below the credit floor of 620, or residence_state_code is outside the relocation service radius {TX, OK, NM, AR, LA}"
        side_effects:
          - "records AssumptionRequest.rejection_count = rejection_count + 1"
          - "increments AssumptionRequest.version by 1"
        note: "Reject loops back to PENDING_NEGOTIATION (a cyclic negotiation round); the request stays open for a new incoming subscriber."
      - from: PENDING_NEGOTIATION
        to: REJECTED
        trigger: "POST /alarm-funding/assumption-requests/{id}/reject"
        actor: FundingAnalyst
        preconditions:
          - "AssumptionRequest.rejection_count is at least 3 at the moment of this reject"
        side_effects:
          - "sets AssumptionRequest.request_status = REJECTED and stamps ended_at on the CURRENT ContractOwner segment"
          - "increments AssumptionRequest.version by 1"
        note: "The third rejection is terminal; the first two loop back to PENDING_NEGOTIATION."
      - from: PENDING_NEGOTIATION
        to: ACCEPTED
        trigger: "POST /alarm-funding/assumption-requests/{id}/accept"
        actor: FundingAnalyst
        preconditions:
          - "incoming_credit_score >= 620"
        side_effects:
          - "stamps AssumptionRequest.accepted_at from the logical clock"
          - "increments AssumptionRequest.version by 1"
        note: "An ACCEPTED request that is then rejected returns to PENDING_NEGOTIATION, not directly to REJECTED — the terminal REJECTED state is reachable only from PENDING_NEGOTIATION."
      - from: ACCEPTED
        to: PENDING_NEGOTIATION
        trigger: "POST /alarm-funding/assumption-requests/{id}/reject"
        actor: FundingAnalyst
        preconditions:
          - "the counterparty withdrew after acceptance"
        side_effects:
          - "clears AssumptionRequest.accepted_at"
          - "increments AssumptionRequest.version by 1"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /alarm-funding/assumption-requests/{id}/complete"
        actor: Customer
        preconditions:
          - "incoming_credit_score >= 620"
          - "residence_state_code is in the relocation service radius {TX, OK, NM, AR, LA}"
          - "the outgoing Customer has at least one other contract whose status is in {ACTIVE, DELINQUENT}"
        side_effects:
          - "sets the CURRENT ContractOwner segment to SUPERSEDED and stamps its ended_at from the logical clock"
          - "bubbles the ownership change up to the contract: sets Contract.customer_id to the incoming subscriber, Contract.contract_status = ASSUMED, assumption_count = assumption_count + 1 and increments Contract.version by 1"
          - "creates a new ContractOwner segment in CURRENT for the incoming subscriber"
          - "sets Customer.status = ASSUMED on the outgoing subscriber; re-provisions the monitoring account to PROVISIONED and closes the old Site as VACATED"
          - "stamps AssumptionRequest.completed_at and increments AssumptionRequest.version by 1"
        note: "The relocation/assumption cascade is the depth-3 chain ATTRIBUTED_TO_CANCEL -> REQUEST_AMENDMENT -> STATUS_NOT_ELIGIBLE for relocation, but for assumption the chain is ContractOwner -> Contract -> Customer.status."

  - entity: RescissionRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /alarm-funding/rescission-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "the request instant is at or before the funding instant plus rescission_window_days = 5"
          - "the approving X-User-ID differs from RescissionRequest.operator_id"
        side_effects:
          - "runs equipment_and_rescission_refund_floor and cascades the adjudication amount down to Dealer.chargeback_balance_due_cents and Dealer.holdback_reserve_cents"
          - "increments Dealer.version by 1"
          - "sets RescissionRequest.request_status = APPROVED, records approved_by and approved_at"
          - "increments RescissionRequest.version by 1"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /alarm-funding/rescission-requests/{id}/decision"
        actor: ComplianceOfficer
        preconditions:
          - "no precondition beyond authorization"
        side_effects:
          - "sets RescissionRequest.request_status = DECLINED"
          - "increments RescissionRequest.version by 1"

  - entity: ServiceVisit
    initial_state: REQUESTED
    terminal_states: [PERFORMED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /alarm-funding/service-visits/{id}/schedule"
        actor: ServiceCoordinator
        preconditions:
          - "the technician's service windows hold for the requested instant under the half-open overlap rule"
        side_effects:
          - "stamps the visit's scheduled_at and sets visit_status = SCHEDULED"
          - "increments ServiceVisit.version by 1"
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /alarm-funding/service-visits/{id}/perform"
        actor: ServiceCoordinator
        preconditions:
          - "ServiceVisit.warranty_status_at_visit has been derived for this visit"
        side_effects:
          - "derives billing_route and billed_cents: CUSTOMER with a flat warranty-after-hours fee when warranty_status_at_visit, otherwise DEALER_HOLDBACK with a post-warranty dealer-billable sweep"
          - "applies the post-warranty service sweep against Dealer.holdback_reserve_cents, which then auto-transitions an open SERVICE_REQUIRED reduction action to RESOLVED and recomputes Dealer.standing"
          - "stamps ServiceVisit.performed_at from the logical clock"
          - "increments Dealer.version by 1 and ServiceVisit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /alarm-funding/service-visits/{id}/cancel"
        actor: ServiceCoordinator
        preconditions:
          - "the visit is strictly before its scheduled_at"
        side_effects:
          - "increments ServiceVisit.version by 1"

  - entity: ContractOwner
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "POST /alarm-funding/assumption-requests/{id}/complete"
        actor: Customer
        preconditions:
          - "the assumption request is ACCEPTED and the incoming subscriber meets the credit floor and radius"
        side_effects:
          - "stamps ContractOwner.ended_at from the logical clock"
          - "increments ContractOwner.version by 1"
        note: "The segment is superseded, never deleted; a contract with three assumptions carries four ContractOwner rows, exactly one in CURRENT."

# =============================================================================
# §1.2.1 Concurrency Rules
# Only true races that survive the serial-observability filter are listed.
# =============================================================================
concurrency_rules:
  - rule_id: package-fund-stale-package
    parent_entity: DealerPackage
    write_endpoint: "POST /alarm-funding/dealer-packages/{id}/fund"
    occ_field: "expected_dealer_package_version"
    description: |
      Funding a package against a DealerPackage whose version has advanced since
      the client last observed it is rejected. Funding legitimately supersedes the
      previously observed package posture, so a stale client view would otherwise
      fund against a package composition that no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: package-approve-stale-package
    parent_entity: DealerPackage
    write_endpoint: "POST /alarm-funding/dealer-packages/{id}/approve"
    occ_field: "expected_dealer_package_version"
    description: |
      Approving a package against a DealerPackage whose version has advanced since
      the client last observed it is rejected. Approval legitimately supersedes the
      earlier observation of the package, so a stale client view would otherwise
      approve against a contract composition that has already been resubmitted.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-fund-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /alarm-funding/contracts/{id}/fund"
    occ_field: "expected_contract_version"
    description: |
      Funding a direct-channel contract against a Contract whose version has
      advanced since the client last observed it is rejected. The funding decision
      legitimately supersedes the observed contract, so a stale view would otherwise
      fund a contract whose gates have already been re-evaluated.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Dealers -------------------------------------------------------------
  - method: POST
