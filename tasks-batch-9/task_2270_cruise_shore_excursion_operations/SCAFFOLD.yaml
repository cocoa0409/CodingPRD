    output: TenderWave[]
    side_effects: []

  # ---------------------------------------------------------------- Excursions
  - method: POST
    path: /shore-excursions/excursions
    description: "Create a catalog item for a port. Starts in DRAFT; return_guarantee mirrors is_line_operated."
    roles: [ExcursionManager]
    success_code: 201
    input:
      - port_id
      - operator_id
      - title
      - duration_minutes
      - min_age
      - mobility_level
      - languages
      - base_price_cents
      - price_tier
      - is_line_operated
      - max_age?
      - medical_warning_codes?
      - alternative_excursion_id?
    output: Excursion
    side_effects:
      - "Excursion created with catalog_status DRAFT, published_at null and return_guarantee == is_line_operated"
  - method: GET
    path: /shore-excursions/excursions/{excursionId}
    description: "Read one catalog item."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input: []
    output: Excursion
    side_effects: []
  - method: GET
    path: /shore-excursions/excursions
    description: "List catalog items, filterable by port, operator, nominated alternative and catalog status."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input:
      - port_id?
      - operator_id?
      - alternative_excursion_id?
      - catalog_status?
      - price_tier?
      - limit?
      - offset?
    output: Excursion[]
    side_effects: []
  - method: PATCH
    path: /shore-excursions/excursions/{excursionId}
    description: "Amend a catalog item that has not yet been published. Refused once catalog_status leaves DRAFT or PENDING_REVIEW."
    roles: [ExcursionManager]
    success_code: 200
    input:
      - title?
      - duration_minutes?
      - min_age?
      - max_age?
      - mobility_level?
      - medical_warning_codes?
      - languages?
      - base_price_cents?
      - price_tier?
      - alternative_excursion_id?
    output: Excursion
    side_effects:
      - "the supplied fields are replaced; omitted fields are untouched"
      - "every departure of this excursion has its timing projections recomputed when duration_minutes changes"
      - "increments Excursion.version by 1"
  - method: POST
    path: /shore-excursions/excursions/{excursionId}/catalog-actions
    description: "Drive the catalog state machine. Actions: SUBMIT_REVIEW, RETURN_TO_DRAFT, PUBLISH, WITHDRAW, ARCHIVE."
    roles: [ExcursionManager]
    success_code: 200
    input:
      - action
      - note?
    output: Excursion
    side_effects:
      - "PUBLISH sets published_at and flips every SCHEDULED departure on an OPEN_FOR_SALE call to SELLING"
      - "WITHDRAW runs CASCADE-A hop 3: every live departure of this excursion is cancelled with cause OPERATIONAL, which cascades to its bookings"
      - "increments Excursion.version by 1"

  # -------------------------------------------------------------- Departures
  - method: POST
    path: /shore-excursions/departures
    description: "Schedule one operating instance of a catalog item on a port call, with its channel seat split. Enters SELLING immediately when the excursion is PUBLISHED and the call is OPEN_FOR_SALE, otherwise SCHEDULED."
    roles: [ExcursionManager]
    success_code: 201
    input:
      - excursion_id
      - port_call_id
      - meeting_point_id
      - meeting_time_utc
      - dispatch_dwell_minutes
      - total_capacity
      - precruise_allocation
      - onboard_allocation
    output: ExcursionDeparture
    side_effects:
      - "meeting-point congestion checked per calculations.meeting_point_occupancy"
      - "SCHEDULED, or SELLING when the excursion is PUBLISHED and the port call is OPEN_FOR_SALE, in which case return_guarantee_eligible is frozen from the SCHEDULED_BASIS band"
      - "both timing projections, both slack figures and both risk bands computed per calculations.departure_timing_risk"
      - "seats_available_total set to total_capacity; sold counters 0; effective channel availability computed"
  - method: GET
    path: /shore-excursions/departures/{departureId}
    description: "Read one departure including both timing-risk variants and both channel availability figures."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input: []
    output: ExcursionDeparture
    side_effects: []
  - method: GET
    path: /shore-excursions/departures
    description: "List departures, filterable by excursion, port call, meeting point, assigned tender wave and status."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, OperatorVettingOfficer, PortAgent, RiskOfficer, FinanceController]
    success_code: 200
    input:
      - excursion_id?
      - port_call_id?
      - meeting_point_id?
      - tender_wave_id?
      - status?
      - limit?
      - offset?
    output: ExcursionDeparture[]
    side_effects: []
  - method: POST
    path: /shore-excursions/departures/{departureId}/allocation
    description: "Rebalance the pre-cruise and onboard seat split, and optionally resize the departure. Optimistically concurrent on the departure's version."
    roles: [ExcursionManager]
    success_code: 200
    input:
      - expected_departure_version
      - precruise_allocation
      - onboard_allocation
      - total_capacity?
    output: ExcursionDeparture
    side_effects:
      - "rejected with ERR_STALE_DEPARTURE_VERSION (412) when expected_departure_version does not equal the current version"
      - "rejected with ERR_ALLOCATION_MISMATCH when the two buckets do not sum to total_capacity"
      - "rejected with ERR_ALLOCATION_BELOW_SOLD when a bucket would fall below the seats already sold out of it"
      - "effective channel availability recomputed; seats_available_total recomputed"
      - "increments ExcursionDeparture.version by 1"
  - method: POST
    path: /shore-excursions/departures/{departureId}/tender-assignment
    description: "Assign the departure to a tender landing wave using calculations.tender_wave_selection. Idempotent reassignment releases the previous wave's counters first."
    roles: [PortAgent, ExcursionManager]
    success_code: 200
    input: []
    output: ExcursionDeparture
    side_effects:
      - "previous wave's assigned_guest_count and assigned_departure_count decremented when a wave was already assigned"
      - "winning wave chosen by window_end_utc DESC, then wave_index ASC, then created_at ASC; ERR_NO_ELIGIBLE_TENDER_WAVE when the pool is empty"
      - "winning wave's assigned_guest_count += total_capacity and assigned_departure_count += 1"
      - "both timing projections recomputed: assigning a wave removes the 20-minute unassigned penalty and may floor the ACTUAL_BASIS start"
      - "increments ExcursionDeparture.version by 1"
  - method: POST
    path: /shore-excursions/departures/{departureId}/reschedule-meeting
    description: "Move a departure's meeting time and loading dwell. Re-runs the meeting-point congestion sweep and both timing projections."
    roles: [ExcursionManager]
    success_code: 200
    input:
      - meeting_time_utc
      - dispatch_dwell_minutes?
    output: ExcursionDeparture
    side_effects:
      - "refused unless status IN {SCHEDULED, SELLING}"
      - "meeting_time_utc must lie within the port call's published window, else ERR_MEETING_TIME_OUTSIDE_CALL"
      - "meeting-point congestion re-checked per calculations.meeting_point_occupancy"
      - "both timing projections and both risk bands recomputed; return_guarantee_eligible is NOT re-frozen once the departure is SELLING"
      - "an assigned tender wave whose window_end_utc now exceeds the new meeting time is released and tender_wave_id set to null"
      - "increments ExcursionDeparture.version by 1"
  - method: POST
    path: /shore-excursions/departures/{departureId}/cancel
    description: "Cancel a departure for weather or operational cause. The cause selects two materially different side-effect sets."
    roles: [ExcursionManager]
    success_code: 200
    input:
      - cause
      - offer_alternative?
      - note?
    output: ExcursionDeparture
    side_effects:
      - "status becomes CANCELLED_WEATHER or CANCELLED_OPERATIONAL and cancellation_cause is recorded"
      - "every live booking becomes CANCELLED_BY_LINE; charged bookings are refunded the whole charge_total_cents, authorised-only bookings get an AUTH_VOID entry"
      - "OPERATIONAL only: a GOODWILL_CREDIT of 10% of quoted_total_cents per charged booking, TourOperator.reliability_strikes += 1, automatic suspension at 3 strikes, and an operational penalty of 20% of the forgone gross recorded for settlement"
      - "WEATHER only: no goodwill credit, no reliability strike, no settlement penalty"
      - "offer_alternative == true attaches alternative_departure_id and alternative_offer_status OFFERED per calculations.alternative_departure_selection, and the whole cancellation is refused with ERR_NO_ALTERNATIVE_AVAILABLE when the pool is empty"
      - "seats returned to each booking's own channel bucket; assigned tender wave counters released; commission_accrued_cents zeroed on every line"
      - "increments ExcursionDeparture.version by 1"
  - method: POST
    path: /shore-excursions/departures/{departureId}/operations
    description: "Dispatch or complete a departure. Actions: DISPATCH, COMPLETE."
    roles: [PortAgent]
    success_code: 200
    input:
      - action
      - actual_return_utc?
    output: ExcursionDeparture
    side_effects:
      - "DISPATCH requires the call IN_PORT, at least one CHECKED_IN booking, a tender wave at TENDER ports, and timing_risk_band_actual != RED; every still-TICKETED booking becomes NO_SHOW with a RETENTION ledger entry"
      - "COMPLETE records actual_return_utc, moves every CHECKED_IN booking to COMPLETED, and re-accrues every line on the FINAL commission variant"
      - "COMPLETE after the all-aboard deadline sets return_guarantee_honored false on every completed booking, and on a return_guarantee_eligible departure additionally refunds quoted_total_cents and pays a flat 25000-cent repatriation allowance per booking"
      - "increments ExcursionDeparture.version by 1"

