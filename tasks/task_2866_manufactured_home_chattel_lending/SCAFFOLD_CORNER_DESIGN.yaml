        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_state_error_precedes_exposure_cap_fiscal_error
          rationale: "That §1.8 instance builds 15100000 of exposure out of individually-valid loans to cross the 15000000 cap, which is exactly the aggregate-validation claim."
      - name: funding_depends_on_the_communitys_agreement_state
