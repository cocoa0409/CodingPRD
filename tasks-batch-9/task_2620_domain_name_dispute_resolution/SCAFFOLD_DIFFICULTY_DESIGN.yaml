      - name: domain_occupation_has_no_right_endpoint_until_the_case_closes
        grounds:
          - calculations.domain_occupation_conflict
          - validations[priority=56].ERR_DOMAIN_PROCEEDING_OVERLAP
          - validations[priority=57].ERR_REFILING_BAR_ACTIVE
          - entities.Case.fields.refiling_bar_until
          - entities.Case.fields.closed_at
        distinguishing_aspect: |
          The scarce resource is the domain name itself, and its occupation interval is OPEN-ENDED on
          the right: a case filed on 2026-08-01 and left in FILED still blocks the domain forty-five
          days later, so a second complaint is refused with ERR_DOMAIN_PROCEEDING_OVERLAP. The moment
          that case is withdrawn the open-ended interval is replaced by the bounded cooling-off
          interval, and the very same request is refused with a DIFFERENT error,
          ERR_REFILING_BAR_ACTIVE, until the bar expires. A third domain filed by the same complainant
          in between proves the occupation is scoped to the domain and not to the party.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, then 2026-09-15T00:00:00Z, 2026-09-20T00:00:00Z, 2026-10-15T00:00:00Z and 2026-10-15T00:00:01Z."
            - "Registrar IANA-2515 ACTIVE; domains occupied.example and spare.example under it."
            - "Complainant Occupy SA (country_code FR) files a single-member case on occupied.example with three grounds and 150000 cents paid, and leaves it in FILED - no clearance, no notification."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Twentyfive", iana_id: "IANA-2515", contact_email: "abuse@registwentyfive.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "occupied.example", registrar_id: "${reg_id}", registrant_name_public: "Occupied Holder", registrant_email_public: "occupied@proxy.example", registration_date: "2017-07-07T00:00:00Z", expiry_date: "2027-07-07T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "spare.example", registrar_id: "${reg_id}", registrant_name_public: "Spare Holder", registrant_email_public: "spare@proxy.example", registration_date: "2017-08-08T00:00:00Z", expiry_date: "2027-08-08T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_spare_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Occupy SA", country_code: "FR", email: "ip@occupy.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_1_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_1_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "OCCUPY is a registered French mark.", evidence_count: 1, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_1_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "No licence exists.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_1_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The registrant listed the domain on a broker site.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_1_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-2515" }
              as: CaseManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "CANCELLATION", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_spare_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_spare_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_1_id}/withdraw"
              payload: { reason: "Refiling with better evidence." }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { bar_until: "$.data.refiling_bar_until" }
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:01Z" }
              as: ProviderAdmin
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_2_id: "$.data.id", case_2_created: "$.data.created_at" }
          assert:
            - "Case.${case_1_id}.status == FILED and closed_at is null at clock 2026-09-15T00:00:00Z, forty-five days after filing"
            - "The second filing on ${dom_id} at 2026-09-15T00:00:00Z returns ERR_DOMAIN_PROCEEDING_OVERLAP with HTTP 409, because the occupation interval has no right endpoint while the case is non-terminal"
            - "The filing on the unrelated ${dom_spare_id} at the same instant succeeds: Case.${case_spare_id}.status == FILED, proving the occupation is per-domain, not per-complainant"
            - "Complainant.${cpl_id}.open_case_count == 2 after the spare filing"
            - "The withdrawal sets Case.${case_1_id}.status == WITHDRAWN, closed_at == 2026-09-15T00:00:00Z and refiling_bar_until == 2026-10-15T00:00:00Z"
            - "The filing at 2026-09-20T00:00:00Z returns ERR_REFILING_BAR_ACTIVE with HTTP 409 - a DIFFERENT error from the pre-withdrawal attempt, because the open-ended occupation has been replaced by the bounded cooling-off interval"
            - "The filing at exactly 2026-10-15T00:00:00Z still returns ERR_REFILING_BAR_ACTIVE, the closing endpoint being inclusive"
            - "The filing at 2026-10-15T00:00:01Z succeeds: Case.${case_2_id}.status == FILED with created_at == 2026-10-15T00:00:01Z, version 1 and assessed_fee_cents 150000"
            - "GET /udrp/cases?domain_id=${dom_id} then returns meta.total_count == 2 ordered created_at ASC, the withdrawn case first"
            - "Complainant.${cpl_id}.open_case_count == 2 after the successful refiling: the spare case plus the new one"

      - name: capacity_ceiling_is_a_pure_count_and_bites_even_when_no_window_overlaps
        grounds:
          - calculations.panelist_window_conflict
          - validations[priority=67].ERR_PANELIST_CAPACITY_EXCEEDED
          - calculations.load_and_population_counters
          - entities.Panelist.fields.active_case_load
          - state_machines.PanelistAppointment.ACCEPTED_to_REPLACED
        distinguishing_aspect: |
          Three engagements are laid end to end - [2026-08-10, 2026-08-24), [2026-08-24, 2026-09-07)
          and a candidate [2026-09-07, 2026-09-21) - so no two of them overlap by even one second, and
          the third is still refused: the aggregate ceiling is a pure count over ACCEPTED seats on
          non-terminal cases, not an interval computation. Releasing one seat by replacement, which
          changes no window at all, immediately makes the identical third nomination legal, which no
          overlap-based implementation can reproduce.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for the three case chains, then 2026-08-10, 2026-08-24 and 2026-09-07."
            - "Registrar IANA-2616 ACTIVE; domains cap1.example, cap2.example and cap3.example under it."
