            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T09:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/notices/${n}/record-cure", payload: { paid_amount_cents: 149999 }, as: Landlord, as_user_id: "${ll}", captures: { err: $.data.error_id } }
            - { call: "POST /api/notices/${n}/record-cure", payload: { paid_amount_cents: 150000 }, as: Landlord, as_user_id: "${ll}", captures: { n_status: $.data.status } }
