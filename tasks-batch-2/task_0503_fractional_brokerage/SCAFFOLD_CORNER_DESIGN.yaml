              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_can}"
            - call: "GET /accounts/${acc_can}"
              as: AccountHolder
              as_user_id: "${acc_can}"
              captures: { v_can: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_can}", security_id: "${sec_can}", side: "BUY", order_type: "MARKET", notional_cents: 50000, expected_account_version: "${v_can}" }
              as: AccountHolder
              as_user_id: "${acc_can}"
