              captures: { fa_v2: $.data.version }
            - call: "POST /farm-network/farms/${fa_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${fa_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${fa_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/farms"
              payload: { name: "Farm Beta", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { fb_id: $.data.id }
            - call: "POST /farm-network/farms/${fb_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { ab_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${ab_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${fb_id}"
              as: NetworkManager
              captures: { fb_v2: $.data.version }
            - call: "POST /farm-network/farms/${fb_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${fb_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${fb_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /farm-network/routes/${r_id}/stops"
              payload: { farm_id: "${fa_id}", stop_sequence: 1, planned_cases: 6 }
              as: PlantOperator
            - call: "POST /farm-network/routes/${r_id}/stops"
              payload: { farm_id: "${fb_id}", stop_sequence: 2, planned_cases: 4 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/routes/${r_id}/stops/1/collect"
              payload: { collected_cases: 5, laid_start_date: "2026-09-06", laid_end_date: "2026-09-07" }
              as: PlantOperator
            - call: "POST /farm-network/routes/${r_id}/stops/2/skip"
              as: PlantOperator
            - call: "GET /farm-network/routes/${r_id}"
              as: PlantOperator
          assert:
            - "after adds: committed 6+4 == 10, available 0 (10 == 10 + 0)"
            - "after collecting 5 of 6 planned: committed == 5 + 4 == 9, available == 1 (10 == 9 + 1; the 1-case under-collection frees capacity)"
            - "after skipping stop 2: committed == 5, available == 5 (10 == 5 + 5; skip restores the full planned 4)"
            - "invariant capacity_cases == committed_cases + available_cases holds at every step"
