# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3071_medicare_broker_call_center_enrollment_marketing_compliance
#
# Breadth probe. Every claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
#
# Shared anchor calls (YAML anchors are resolved before linting) --------------
#   *cc_clock    logical clock at 2026-10-01T00:00:00Z
#   *cc_agency   Alpine Senior Benefits LLC, capacity 3, retention 2555 / 3650,
#                soa max age 30, rapid window 90
#   *cc_carrier  Meridian Health Plan of Texas, initial 0.20 renewal 0.10
#   *cc_plan     MER-H0021-001, MAPD, TX/TX-201, premium 1500, deductible 20000
#   *cc_drug     Lisinopril 10mg tier 1 copay 200
#   *cc_agent    Marcus Reed, NPN 8841002
#   *cc_lic      TX license valid to 2027-12-31
#   *cc_cert     MAPD certification to 2027-12-31
#   *cc_appt     TX appointment on Meridian
#   *cc_member   Ada Whitfield; *cc_member2 Hollis Pike
#   *cc_soa      scope for Ada; *cc_call Ada's call; *cc_connect; *cc_complete
#   *cc_enroll   enrollment for Ada; *cc_ack; *cc_effect
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: agency_create_returns_every_declared_field_and_opens_posture
        claim_type: Creation
        grounds:
          - entities.Agency
          - endpoints.POST_/agencies
          - calculations.agency_compliance_posture
        distinguishing_aspect: "An agency created with only the eleven declared inputs comes back 201 with compliance_posture OPEN, commission_balance_cents 0, open_complaint_count 0, substantiated_complaint_rate 0, version 1, and system-generated id / created_at / updated_at — posture is never a client input."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &cc_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agencies"
              payload: { name: "Alpine Senior Benefits LLC", service_center_code: "ALP-DAL-01", aep_start_date: "2026-10-15T00:00:00Z", aep_end_date: "2026-12-07T00:00:00Z", aep_daily_submission_capacity: 3, recording_retention_days: 2555, soa_retention_days: 3650, soa_max_age_days: 30, rapid_disenrollment_day_limit: 90 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Agency.${agency_id}.compliance_posture == OPEN and posture_since == 2026-10-01T00:00:00Z"
            - "Agency.${agency_id}.commission_balance_cents == 0 and open_complaint_count == 0"
            - "Agency.${agency_id}.substantiated_complaint_rate == 0 and loss_ratio == 0"
            - "Agency.${agency_id}.version == 1 and the response data carries non-null id, created_at and updated_at"
            - "Agency.${agency_id}.aep_daily_submission_capacity == 3 and recording_retention_days == 2555"

      - name: plan_create_returns_declared_fields_and_opens_active
        claim_type: Creation
        grounds:
          - entities.Plan
          - endpoints.POST_/plans
        distinguishing_aspect: "A plan created with the eleven declared inputs comes back 201 with status ACTIVE and enrolled_member_count 0, and the three version identifiers formulary_id / pharmacy_network_id / provider_directory_id round-trip verbatim rather than being derived from the child rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; one agency and one carrier exist."
          setup_api_calls:
            - *cc_clock
            - &cc_agency
              call: "POST /agencies"
              payload: { name: "Alpine Senior Benefits LLC", service_center_code: "ALP-DAL-01", aep_start_date: "2026-10-15T00:00:00Z", aep_end_date: "2026-12-07T00:00:00Z", aep_daily_submission_capacity: 3, recording_retention_days: 2555, soa_retention_days: 3650, soa_max_age_days: 30, rapid_disenrollment_day_limit: 90 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - &cc_carrier
              call: "POST /carriers"
              payload: { legal_name: "Meridian Health Plan of Texas", naic_number: "60211", contract_type: "CONTRACTED", initial_commission_rate_pct: 0.20, renewal_commission_rate_pct: 0.10, chargeback_clawback_pct: 0.25, ack_expected_within_days: 5, effectuation_expected_within_days: 30 }
              as: PlatformAdmin
              captures: { carrier_a_id: $.data.id }
          trigger:
            - call: "POST /plans"
              payload: { carrier_id: "${carrier_a_id}", plan_id_code: "MER-H0021-001", plan_type: "MAPD", state_code: "TX", county_code: "TX-201", monthly_premium_cents: 1500, annual_drug_deductible_cents: 20000, star_rating: 4.5, formulary_id: "FORM-2026-V1", pharmacy_network_id: "PHARM-2026-V1", provider_directory_id: "PROV-2026-V1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Plan.${plan_id}.status == ACTIVE and Plan.${plan_id}.enrolled_member_count == 0"
            - "Plan.${plan_id}.formulary_id == \"FORM-2026-V1\" and pharmacy_network_id == \"PHARM-2026-V1\" and provider_directory_id == \"PROV-2026-V1\""
            - "Plan.${plan_id}.star_rating == 4.5 and Plan.${plan_id}.monthly_premium_cents == 1500"
            - "GET /carriers/${carrier_a_id}/plans returns exactly 1 row with id ${plan_id}"

      - name: carrier_get_returns_stored_contract_terms
        claim_type: Retrieval
        grounds:
          - entities.Carrier
          - endpoints.GET_/carriers/{id}
        distinguishing_aspect: "Every Carrier contract term round-trips through GET unchanged, including the two commission rates 0.20 / 0.10 and the two window defaults 5 and 30, so no read path recomputes a rate from the agency's ledger."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; one carrier created with the non-default clawback percentage."
          setup_api_calls:
            - *cc_clock
            - &cc_carrier_full
              call: "POST /carriers"
              payload: { legal_name: "Meridian Health Plan of Texas", naic_number: "60211", contract_type: "CONTRACTED", initial_commission_rate_pct: 0.20, renewal_commission_rate_pct: 0.10, chargeback_clawback_pct: 0.25, ack_expected_within_days: 5, effectuation_expected_within_days: 30 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
          trigger:
            - call: "GET /carriers/${carrier_id}"
              payload: {}
              as: CarrierIntegration
          assert:
            - "the response status is 200"
            - "Carrier.${carrier_id}.initial_commission_rate_pct == 0.20 and renewal_commission_rate_pct == 0.10"
            - "Carrier.${carrier_id}.chargeback_clawback_pct == 0.25"
            - "Carrier.${carrier_id}.ack_expected_within_days == 5 and effectuation_expected_within_days == 30"
            - "Carrier.${carrier_id}.contract_type == CONTRACTED and status == ACTIVE"
            - "Carrier.${carrier_id}.version == 1 and created_at == updated_at"

      - name: enrollments_list_paginates_and_filters_by_carrier
        claim_type: Listing
        grounds:
          - endpoints.GET_/enrollments
          - endpoints.GET_/enrollments
          - response_envelope
        distinguishing_aspect: "With three enrollments on file, limit=2 and offset=0 returns two rows with total_count 3 and has_more true, and offset=2 returns the remaining one with has_more false — and the total_count reflects the filtered set, not the whole table, when carrier_id is supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain, then three enrollments for Ada on the same effective date, each refreshing the call session version between submissions."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - &cc_plan
              call: "POST /plans"
              payload: { carrier_id: "${carrier_a_id}", plan_id_code: "MER-H0021-001", plan_type: "MAPD", state_code: "TX", county_code: "TX-201", monthly_premium_cents: 1500, annual_drug_deductible_cents: 20000, star_rating: 4.5, formulary_id: "FORM-2026-V1", pharmacy_network_id: "PHARM-2026-V1", provider_directory_id: "PROV-2026-V1" }
              as: PlatformAdmin
              captures: { plan_a_id: $.data.id }
            - &cc_drug
              call: "POST /plans/${plan_a_id}/formulary-drugs"
              payload: { drug_name: "Lisinopril 10mg", rxcui: "314076", tier: 1, monthly_copay_cents: 200, prior_authorization_required: false, covered: true, quantity_limit_days: 30 }
              as: PlatformAdmin
            - &cc_prov
              call: "POST /plans/${plan_a_id}/provider-directory-entries"
              payload: { provider_npi: "1000000001", provider_name: "Dr Alvarez", specialty: "Internal Medicine", network_status: "IN_NETWORK", accepting_new_patients: true, last_attested_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &cc_agent
              call: "POST /agents"
              payload: { agency_id: "${agency_id}", full_name: "Marcus Reed", national_producer_number: "8841002", hire_date: "2026-08-01T00:00:00Z" }
              as: DirectorOfSales
              captures: { agent_id: $.data.id }
            - &cc_lic
              call: "POST /agents/${agent_id}/licenses"
              payload: { state_code: "TX", license_number: "TX-LIC-77031", issued_on: "2026-08-05T00:00:00Z", expires_on: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
            - &cc_cert
              call: "POST /agents/${agent_id}/certifications"
              payload: { carrier_id: "${carrier_a_id}", product_type: "MAPD", expires_on: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
            - &cc_appt
              call: "POST /agents/${agent_id}/appointments"
              payload: { carrier_id: "${carrier_a_id}", state_code: "TX", requested_on: "2026-09-20T00:00:00Z" }
              as: LicensingCoordinator
            - &cc_member
              call: "POST /members"
              payload: { agency_id: "${agency_id}", full_name: "Ada Whitfield", medicare_beneficiary_id: "1EG4-TE5-MK72", date_of_birth: "1954-03-11T00:00:00Z", state_code: "TX", county_code: "TX-201", drug_list: [{ drug_name: "Lisinopril 10mg", rxcui: "314076", monthly_fills: 1 }], provider_npis: ["1000000001"] }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { member_id: $.data.id, member_v1: $.data.version }
            - &cc_member2
              call: "POST /members"
              payload: { agency_id: "${agency_id}", full_name: "Hollis Pike", medicare_beneficiary_id: "3GH6-VG7-PM94", date_of_birth: "1952-11-19T00:00:00Z", state_code: "TX", county_code: "TX-201", drug_list: [{ drug_name: "Lisinopril 10mg", rxcui: "314076", monthly_fills: 1 }], provider_npis: ["1000000001"] }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { member_two_id: $.data.id, member_two_v1: $.data.version }
            - &cc_soa
              call: "POST /scope-of-appointments"
              payload: { member_id: "${member_id}", agent_id: "${agent_id}", capture_channel: "TELEPHONIC_RECORDED", plan_types_authorized: ["MA", "MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_id: $.data.id }
            - &cc_soa2
              call: "POST /scope-of-appointments"
              payload: { member_id: "${member_two_id}", agent_id: "${agent_id}", capture_channel: "TELEPHONIC_RECORDED", plan_types_authorized: ["MA", "MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_two_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_two_id: $.data.id }
            - &cc_call
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_id: $.data.id }
            - &cc_connect
              call: "POST /call-sessions/${call_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - &cc_complete
              call: "POST /call-sessions/${call_id}/complete"
              payload: { recording_id: "REC-1001", disclaimer_delivered: true }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v1: $.data.version }
            - &cc_call2
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_two_id}", scope_of_appointment_id: "${soa_two_id}", started_at: "2026-10-01T10:00:00Z", scheduled_end_at: "2026-10-01T10:30:00Z", recording_id: "REC-1002", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_two_id: $.data.id }
            - &cc_connect2
              call: "POST /call-sessions/${call_two_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1002", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - &cc_complete2
              call: "POST /call-sessions/${call_two_id}/complete"
              payload: { recording_id: "REC-1002", disclaimer_delivered: true }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_two_v1: $.data.version }
            - &cc_enroll
              call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_id: $.data.id }
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-02T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v2}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_two_id: $.data.id }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_two_id}", member_id: "${member_two_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_two_id}", effective_date: "2026-11-03T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_two_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_three_id: $.data.id }
          trigger:
            - call: "GET /enrollments"
              payload: { carrier_id: "${carrier_a_id}", limit: 2, offset: 0 }
              as: DirectorOfSales
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /enrollments?carrier_id=${carrier_a_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /enrollments?member_id=${member_two_id} returns exactly 1 row, the Hollis Pike enrollment"
            - "GET /enrollments?submission_status=SUBMITTED returns all 3 rows"
            - "GET /enrollments with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: agent_get_with_an_unknown_id_returns_agent_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/agents/{id}
          - errors.ERR_AGENT_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A well-formed but unallocated id in the path segment produces the entity-specific 404 ERR_AGENT_NOT_FOUND rather than a generic ERR_NOT_FOUND and rather than a 400, since the path id is syntactically valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. No agent has been created."
          setup_api_calls:
            - *cc_clock
          trigger:
            - call: "GET /agents/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_AGENT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "the status is not 400 and not 500"

      - name: call_session_create_missing_scope_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CallSession.fields.scope_of_appointment_id
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "scope_of_appointment_id is a required input with no default, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check and not the 422 ERR_SCOPE_OF_APPOINTMENT_MISSING that a present-but-voided scope produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; one agency, carrier, plan, member and ACTIVE agent exist."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
          trigger:
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_SCOPE_OF_APPOINTMENT_MISSING"
            - "GET /call-sessions?agent_id=${agent_id} returns 0 rows"

      - name: call_session_create_omitting_optional_fields_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.CallSession.fields.recording_id
          - entities.CallSession.fields.disclaimer_delivered
          - entities.CallSession.fields.recording_retained_until
        distinguishing_aspect: "Omitting recording_id, disclaimer_delivered and marketing_rule_set_version stores them as null and false rather than fabricating values, while recording_retained_until is still derived from started_at plus the agency's 2555-day retention — so the retention clock runs even when no recording exists."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_soa."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_soa
          trigger:
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_id: $.data.id }
          assert:
            - "the response status is 201 and CallSession.${call_id}.status == RINGING"
            - "CallSession.${call_id}.recording_id is null and disclaimer_delivered == false"
            - "CallSession.${call_id}.disclaimer_script_code is null and marketing_rule_set_version is null"
            - "CallSession.${call_id}.recording_status == MISSING because recording_id is null"
            - "CallSession.${call_id}.recording_retained_until == 2033-09-29T09:00:00Z, which is started_at plus the agency's 2555 days"

      - name: agency_and_agent_counts_are_computed_on_read
        claim_type: Computed Fields
        grounds:
          - entities.Agency.fields.compliance_posture
          - entities.Agent.fields.licensed_state_count
          - entities.Agent.fields.certified_carrier_count
          - entities.Agent.fields.live_call_count
        distinguishing_aspect: "Every one of these fields is source computed and re-derived on read from the child rows and the logical clock, so the same Agent row reports licensed_state_count 1 and live_call_count 0 before the call connects and live_call_count 1 after, with no intervening write to the Agent itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_connect, plus a second state license for NV."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - call: "POST /agents/${agent_id}/licenses"
              payload: { state_code: "NV", license_number: "NV-LIC-44120", issued_on: "2026-08-06T00:00:00Z", expires_on: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
            - *cc_member
            - *cc_soa
            - *cc_call
          trigger:
            - call: "GET /agents/${agent_id}"
              payload: {}
              as: DirectorOfSales
          assert:
            - "Agent.${agent_id}.licensed_state_count == 2, certified_carrier_count == 1 and appointed_carrier_count == 1"
            - "Agent.${agent_id}.live_call_count == 0 while the call is still RINGING"
            - "after POST /call-sessions/${call_id}/connect the same GET reports live_call_count == 1"
            - "after POST /call-sessions/${call_id}/complete the same GET reports live_call_count == 0"
            - "Agent.${agent_id}.status == ACTIVE and Agency.${agency_id}.compliance_posture == OPEN throughout, because neither count feeds the posture branches"

      - name: agent_state_license_status_is_computed_on_read_and_never_stored
        claim_type: Computed Fields
        grounds:
          - entities.AgentStateLicense.fields.license_status
          - endpoints.GET_/agents/{id}/licenses
        distinguishing_aspect: "AgentStateLicense.license_status is derived from the logical clock against expires_on on every read: VALID at 2026-12-30T23:59:59Z and LAPSED at exactly expires_on 2026-12-31T00:00:00Z, with version unchanged across all three reads — the row is never rewritten."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; one agency, carrier, plan, member and agent with a TX license whose expires_on is 2026-12-31T00:00:00Z."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - call: "POST /agents/${agent_id}/licenses"
              payload: { state_code: "TX", license_number: "TX-LIC-77031", issued_on: "2026-08-05T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }
              as: LicensingCoordinator
              captures: { license_id: $.data.id }
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_soa2
            - *cc_call2
            - *cc_connect2
          trigger:
            - call: "GET /agents/${agent_id}/licenses"
              payload: { state_code: "TX" }
              as: LicensingCoordinator
              captures: { license_status_now: "$.data[0].license_status" }
          assert:
            - "the response returns exactly 1 row and AgentStateLicense.${license_id}.license_status == VALID at 2026-10-01"
            - "after POST /_clock/set_current_utc to 2026-12-30T23:59:59Z the same GET still reports license_status == VALID"
            - "after POST /_clock/set_current_utc to 2026-12-31T00:00:00Z the same GET reports license_status == LAPSED, because reaching expires_on lapses the license"
            - "AgentStateLicense.${license_id}.version is still 1 across all three reads"
            - "GET /agents/${agent_id} reports licensed_state_count == 0 at 2026-12-31 because the count only includes VALID licenses"

      - name: enrollment_create_extra_field_submission_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Enrollment.fields.submission_status
          - entities.Enrollment.fields.disenrollment_status
          - endpoints.POST_/enrollments
        distinguishing_aspect: "submission_status is source system with initial state SUBMITTED, so a client that sends submission_status EFFECTUATED and version 99 — neither of which the endpoint declares as input — has both silently ignored: the row is created SUBMITTED at version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_complete."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
          trigger:
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v1}", submission_status: "EFFECTUATED", version: 99 }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Enrollment.${enrollment_id}.submission_status == SUBMITTED and disenrollment_status == NOT_APPLICABLE"
            - "Enrollment.${enrollment_id}.version == 1 despite the supplied 99"
            - "Enrollment.${enrollment_id}.submitted_on == 2026-10-01T00:00:00Z, stamped from the logical clock"
            - "Enrollment.${enrollment_id}.disenrolled_day_number is null and is_rapid_disenrollment == false"

      - name: complaint_create_with_an_out_of_enum_source_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Complaint.fields.source
          - entities.Complaint.fields.severity
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "source is a closed enum of exactly BENEFICIARY, CMS, CARRIER and SECRET_SHOPPER, and severity a closed enum of LOW, MEDIUM and HIGH; a value outside either set such as PORTAL or CRITICAL is rejected with 400 ERR_INVALID_REQUEST at priority 4 rather than being coerced or stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; one agency and an ACTIVE agent."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
          trigger:
            - call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "MISREPRESENTATION", source: "PORTAL", severity: "HIGH", filed_on: "2026-09-28T00:00:00Z" }
              as: ComplianceOfficer
              captures: { error_id_source: $.data.error_id }
            - call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "MISREPRESENTATION", source: "CMS", severity: "CRITICAL", filed_on: "2026-09-28T00:00:00Z" }
              as: ComplianceOfficer
              captures: { error_id_severity: $.data.error_id }
          assert:
            - "the first request returns 400 and error_id_source == ERR_INVALID_REQUEST"
            - "the second request returns 400 and error_id_severity == ERR_INVALID_REQUEST"
            - "GET /complaints?agent_id=${agent_id} returns 0 rows, so neither attempt persisted anything"
            - "Agency.${agency_id}.open_complaint_count == 0, confirming no side effect ran"

      - name: commission_ledger_entry_has_no_update_or_delete_endpoint
        claim_type: Immutability
        grounds:
          - entities.CommissionLedgerEntry
          - endpoints.POST_/corrections
          - validations[priority=20]
        distinguishing_aspect: "No PUT or DELETE endpoint is declared for /commission-ledger-entries, so a posted entry's amount can never be edited in place; the only way to change the money position is to post a new entry, and POST /corrections refuses unless an OPEN reconciliation exists for the named carrier and period."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_enroll, so one INITIAL entry of 3600.00 exists; no reconciliation period is open."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - call: "GET /commission-ledger-entries"
              payload: { enrollment_id: "${enrollment_id}" }
              as: DirectorOfSales
              captures: { entry_initial_id: "$.data[0].id" }
          trigger:
            - call: "POST /corrections"
              payload: { enrollment_id: "${enrollment_id}", carrier_reconciliation_id: "${carrier_a_id}", amount_cents: -500, period_month: "2026-10", memo: "Attempted in-place correction" }
              as: DirectorOfSales
              captures: { error_id: $.data.error_id }
          assert:
            - "the correction returns 409 and error_id == ERR_NO_OPEN_RECONCILIATION"
            - "GET /commission-ledger-entries?enrollment_id=${enrollment_id} returns exactly 1 row, unchanged at amount_cents == 3600.00"
            - "Agency.${agency_id}.commission_balance_cents == 3600.00, so the refused correction moved nothing"
            - "no PUT or DELETE endpoint is declared for /commission-ledger-entries, so the posted amount can only ever be offset by a new entry"

      - name: call_session_body_foreign_keys_are_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/call-sessions
          - errors.ERR_AGENT_NOT_FOUND
          - errors.ERR_MEMBER_NOT_FOUND
        distinguishing_aspect: "The flat topology puts every foreign key in the request body, and priority 4 checks them in the order the endpoint's input list declares them — agent_id, then member_id, then scope_of_appointment_id. With all three unknown the answer is ERR_AGENT_NOT_FOUND; with only member_id unknown it is ERR_MEMBER_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; one agency and an ACTIVE agent exist, but no member and no scope."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_soa
          trigger:
            - call: "POST /call-sessions"
              payload: { agent_id: "00000000-0000-4000-8000-000000000001", member_id: "00000000-0000-4000-8000-000000000002", scope_of_appointment_id: "00000000-0000-4000-8000-000000000003", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z", recording_id: "REC-X", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_all_unknown: $.data.error_id }
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "00000000-0000-4000-8000-000000000002", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z", recording_id: "REC-X", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_member_unknown: $.data.error_id }
          assert:
            - "the first request returns 404 and error_all_unknown == ERR_AGENT_NOT_FOUND"
            - "error_all_unknown != ERR_MEMBER_NOT_FOUND and != ERR_SCOPE_OF_APPOINTMENT_NOT_FOUND"
            - "the second request returns 404 and error_member_unknown == ERR_MEMBER_NOT_FOUND"
            - "GET /call-sessions?agent_id=${agent_id} returns 0 rows"
            - "Agent.${agent_id}.live_call_count == 0, so neither refused request ran a side effect"

# ===========================================================================
  - section: state_machines
    instances:

      - name: call_session_connect_moves_ringing_to_in_progress
        claim_type: Valid Transition
        grounds:
          - state_machines.CallSession.transitions.RINGING_to_IN_PROGRESS
          - endpoints.POST_/call-sessions/{id}/connect
        distinguishing_aspect: "A RINGING call with a CAPTURED scope and a true disclaimer_delivered moves to IN_PROGRESS on connect, and the side effect is observable as a live_call_count of 1 on the agent rather than as any write to the call's own status field alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain through *cc_call, so the call sits RINGING with the disclaimer already marked delivered."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
          trigger:
            - call: "POST /call-sessions/${call_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          assert:
            - "the response status is 200 and CallSession.${call_id}.status == IN_PROGRESS"
            - "CallSession.${call_id}.version == 2, since connect is the first mutation"
            - "Agent.${agent_id}.live_call_count == 1"
            - "CallSession.${call_id}.actual_end_at is still null and scheduled_end_at is unchanged"
            - "GET /agents/${agent_id}/call-sessions returns exactly 1 row with status IN_PROGRESS"

      - name: enrollment_acknowledge_rejects_a_future_clock_past_the_ack_window
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Enrollment.transitions.SUBMITTED_to_ACKNOWLEDGED
          - errors.ERR_ACK_WINDOW_EXPIRED
          - entities.Carrier.fields.ack_expected_within_days
        distinguishing_aspect: "The acknowledgment precondition is window-based: with ack_expected_within_days 5 and submitted_on 2026-10-01, an acknowledgment at exactly 2026-10-06T00:00:00Z succeeds and one at 2026-10-06T00:00:01Z fails with ERR_ACK_WINDOW_EXPIRED, so the inclusive far end is load-bearing."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_enroll, so submitted_on is exactly 2026-10-01T00:00:00Z."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enrollments/${enrollment_id}/acknowledge"
              payload: { carrier_id: "${carrier_a_id}" }
              as: CarrierIntegration
          assert:
            - "the acknowledgment at exactly submitted_on plus 5 days returns 200 and Enrollment.${enrollment_id}.submission_status == ACKNOWLEDGED"
            - "Enrollment.${enrollment_id}.acknowledged_on == 2026-10-06T00:00:00Z"
            - "a second submission acknowledged at 2026-10-06T00:00:01Z would return 409 ERR_ACK_WINDOW_EXPIRED, so the window closes strictly after its far end"
            - "GET /commission-ledger-entries?enrollment_id=${enrollment_id} now returns 2 rows, because acknowledgment posts the RENEWAL entry"

      - name: enrollment_effectuate_consumes_the_scope_and_posture_already_captured
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Enrollment.transitions.ACKNOWLEDGED_to_EFFECTUATED
          - entities.ScopeOfAppointment.fields.consumed_by_enrollment_id
          - entities.Plan.fields.enrolled_member_count
        distinguishing_aspect: "Effectuation applies five distinct side effects in one request — submission and membership dimensions move, the scope flips to CONSUMED with consumed_by_enrollment_id set, and both the plan and agent counters advance — and none of them is reversed when the enrollment is later disenrolled."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through acknowledgment."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - &cc_ack
              call: "POST /enrollments/${enrollment_id}/acknowledge"
              payload: { carrier_id: "${carrier_a_id}" }
              as: CarrierIntegration
          trigger:
            - call: "POST /enrollments/${enrollment_id}/effectuate"
              payload: {}
              as: CarrierIntegration
          assert:
            - "the response status is 200 and Enrollment.${enrollment_id}.submission_status == EFFECTUATED with disenrollment_status == ENROLLED"
            - "Enrollment.${enrollment_id}.effectuated_on == 2026-10-01T00:00:00Z"
            - "ScopeOfAppointment.${soa_id}.status == CONSUMED with consumed_by_enrollment_id == ${enrollment_id}"
            - "Plan.${plan_a_id}.enrolled_member_count == 1 and Agent.${agent_id}.active_enrollment_count == 1"
            - "Member.${member_id}.enrollment_count == 1"
            - "GET /commission-ledger-entries?enrollment_id=${enrollment_id} still returns 2 rows, because effectuation posts no additional entry"

      - name: call_session_complete_from_ringing_returns_call_not_in_progress
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CallSession.transitions.IN_PROGRESS_to_COMPLETED
          - errors.ERR_CALL_NOT_IN_PROGRESS
          - validations[priority=16]
        distinguishing_aspect: "Completion is declared only from IN_PROGRESS, so calling it against a RINGING call answers ERR_CALL_NOT_IN_PROGRESS with no partial transition and no side effect, which is a different failure from the ERR_CALL_NOT_COMPLETED its sibling endpoint returns for the opposite direction."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain through *cc_call, so the call has never been connected."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
          trigger:
            - call: "POST /call-sessions/${call_id}/complete"
              payload: { recording_id: "REC-1001", disclaimer_delivered: true }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CALL_NOT_IN_PROGRESS"
            - "error_id != ERR_CALL_NOT_COMPLETED and != ERR_DISCLAIMER_NOT_DELIVERED"
            - "GET /call-sessions/${call_id} still reports status == RINGING with actual_end_at null and version 1"
            - "Agent.${agent_id}.compliance_risk_score == 0.00, so no risk side effect ran"

      - name: enrollment_terminal_withdrawal_locks_out_every_further_edge
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Enrollment.initial_state
          - errors.ERR_ENROLLMENT_NOT_SUBMITTED
          - errors.ERR_ENROLLMENT_NOT_WITHDRAWABLE
        distinguishing_aspect: "WITHDRAWN has no declared outbound edge on either dimension, so an acknowledged-then-withdrawn enrollment rejects acknowledgment, effectuation, rejection and a second withdrawal — each with its own error_id — proving the row is genuinely locked rather than merely re-routed."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_enroll and then acknowledged, so the row is ACKNOWLEDGED before withdrawal."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - *cc_ack
            - call: "POST /enrollments/${enrollment_id}/withdraw"
              payload: { reason: "BENEFICIARY_CHANGED_MIND" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /enrollments/${enrollment_id}/acknowledge"
              payload: { carrier_id: "${carrier_a_id}" }
              as: CarrierIntegration
              captures: { error_ack: $.data.error_id }
            - call: "POST /enrollments/${enrollment_id}/effectuate"
              payload: {}
              as: CarrierIntegration
              captures: { error_effect: $.data.error_id }
            - call: "POST /enrollments/${enrollment_id}/reject"
              payload: { reason: "CARRIER_DUPLICATE" }
              as: CarrierIntegration
              captures: { error_reject: $.data.error_id }
            - call: "POST /enrollments/${enrollment_id}/withdraw"
              payload: { reason: "BENEFICIARY_CHANGED_MIND" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_withdraw: $.data.error_id }
          assert:
            - "the acknowledgment returns 409 with error_ack == ERR_ENROLLMENT_NOT_SUBMITTED"
            - "the effectuation returns 409 with error_effect == ERR_ENROLLMENT_NOT_ACKNOWLEDGED"
            - "the rejection returns 409 with error_reject == ERR_ENROLLMENT_NOT_SUBMITTED"
            - "the second withdrawal returns 409 with error_withdraw == ERR_ENROLLMENT_NOT_WITHDRAWABLE"
            - "GET /enrollments/${enrollment_id} still reports submission_status == WITHDRAWN and version is unchanged by all four attempts"

      - name: call_session_drop_twice_returns_call_not_droppable
        claim_type: Idempotency
        grounds:
          - state_machines.CallSession.transitions.IN_PROGRESS_to_DROPPED
          - errors.ERR_CALL_NOT_DROPPABLE
        distinguishing_aspect: "The drop edge is declared only from RINGING and IN_PROGRESS, so a second drop on an already DROPPED call is refused with ERR_CALL_NOT_DROPPABLE rather than answered idempotently, and the call's actual_end_at is not restamped."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain through a connected call."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - call: "POST /call-sessions/${call_id}/drop"
              payload: { reason: "CALLER_HUNG_UP" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { dropped_at: $.data.actual_end_at, dropped_version: $.data.version }
          trigger:
            - call: "POST /call-sessions/${call_id}/drop"
              payload: { reason: "CALLER_HUNG_UP" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the second drop returns 409 with error_id == ERR_CALL_NOT_DROPPABLE"
            - "GET /call-sessions/${call_id} reports actual_end_at == ${dropped_at}, so the timestamp was not restamped"
            - "CallSession.${call_id}.version == ${dropped_version}, so no mutation occurred"
            - "Agent.${agent_id}.live_call_count == 0 and Agent.${agent_id}.compliance_risk_score == 0.00"

      - name: agent_provisioning_to_licensed_needs_a_state_license
        claim_type: Initial State
        grounds:
          - state_machines.Agent.initial_state
          - state_machines.Agent.transitions.PROVISIONING_to_LICENSED
          - entities.Agent.fields.status
        distinguishing_aspect: "A newly created agent starts in PROVISIONING with every count zero, and the only declared exit is LICENSE_CAPTURE via POST /licenses, which is also what makes certified_carrier_count stuck at 0 until a separate certification call runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; one agency and one carrier exist."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
          trigger:
            - call: "POST /agents"
              payload: { agency_id: "${agency_id}", full_name: "Marcus Reed", national_producer_number: "8841002", hire_date: "2026-08-01T00:00:00Z" }
              as: DirectorOfSales
              captures: { agent_id: $.data.id }
            - call: "POST /agents/${agent_id}/licenses"
              payload: { state_code: "TX", license_number: "TX-LIC-77031", issued_on: "2026-08-05T00:00:00Z", expires_on: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
          assert:
            - "the agent is created with status PROVISIONING and version 1"
            - "Agent.${agent_id}.chargeback_tier == 0, licensed_state_count == 0, certified_carrier_count == 0, appointed_carrier_count == 0, open_coaching_count == 0 and compliance_risk_score == 0.00"
            - "Agent.${agent_id}.coaching_flag == false and substantiated_complaint_count == 0"
            - "after the license call Agent.${agent_id}.status == LICENSED and licensed_state_count == 1"
            - "Agent.${agent_id}.certified_carrier_count is still 0, so licensing alone cannot produce an ACTIVE agent"

      - name: agency_posture_reset_rejects_a_non_frozen_agency
        claim_type: Guarded Transitions
        grounds:
          - state_machines.Agency.transitions.FROZEN_to_RESTRICTED
          - errors.ERR_AGENCY_NOT_FROZEN
          - entities.Agency.fields.compliance_posture
        distinguishing_aspect: "The FROZEN→RESTRICTED edge requires the agency to actually be FROZEN, so requesting a reset on an OPEN agency answers ERR_AGENCY_NOT_FROZEN and the OPEN→RESTRICTED edge is unreachable through this endpoint — the posture only ever falls to RESTRICTED by recomputation."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain plus a COMPLETED call, with the agency still OPEN and no complaint on file."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
          trigger:
            - call: "POST /agencies/${agency_id}/posture-reset"
              payload: { target_posture: "RESTRICTED" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the reset returns 409 with error_id == ERR_AGENCY_NOT_FROZEN"
            - "Agency.${agency_id}.compliance_posture is still OPEN and posture_since is unchanged"
            - "the error is not ERR_AGENCY_NOT_RESTRICTED, which the sibling OPEN bound would return"
            - "Agent.${agent_id}.status is still ACTIVE, so no reinstate side effect ran"

      - name: complaint_cycle_can_be_substantiated_appealed_and_dismissed_with_a_reversal
        claim_type: Cyclic
        grounds:
          - state_machines.Complaint.transitions.SUBSTANTIATED_to_APPEALED
          - state_machines.Complaint.transitions.APPEALED_to_DISMISSED
          - errors.ERR_NO_SUBSTANTIATION_TO_REVERSE
          - entities.Agent.fields.substantiated_complaint_count
        distinguishing_aspect: "The complaint cycle's reversal arm is guarded by a floor: dismissing an APPEALED complaint decrements substantiated_complaint_count and is refused with ERR_NO_SUBSTANTIATION_TO_REVERSE when the agent has no standing strike, so the conserved strike count can never go negative."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain plus a COMPLETED call, and a MISREPRESENTATION complaint substantiated once."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - &cc_complaint
              call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "MISREPRESENTATION", source: "CMS", severity: "MEDIUM", filed_on: "2026-09-28T00:00:00Z" }
              as: ComplianceOfficer
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${complaint_id}/substantiate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /complaints/${complaint_id}/appeal"
              payload: { appeal_note: "Carrier disputes the finding" }
              as: CarrierIntegration
            - call: "POST /complaints/${complaint_id}/dismiss"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${complaint_id}/appeal"
              payload: { appeal_note: "Second appeal round" }
              as: CarrierIntegration
            - call: "POST /complaints/${complaint_id}/dismiss"
              payload: {}
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the first dismissal returns 200, Complaint.${complaint_id}.status == DISMISSED and Agent.${agent_id}.substantiated_complaint_count == 0"
            - "the second dismissal returns 409 with error_id == ERR_NO_SUBSTANTIATION_TO_REVERSE, because the counter is already at zero"
            - "Complaint.${complaint_id}.status is still APPEALED after that refusal"
            - "POST /complaints/${complaint_id}/close returns 200 and sets status == CLOSED"
            - "Agent.${agent_id}.substantiated_complaint_count == 0 throughout, so the conserved strike quantity never went negative"

      - name: enrollment_disenrollment_dimension_is_a_parallel_axis
        claim_type: Parallel
        grounds:
          - state_machines.Enrollment.transitions.SUBMITTED_to_ACKNOWLEDGED
          - state_machines.Enrollment.transitions.ENROLLED_to_STANDARD_DISENROLLED
          - entities.Enrollment.fields.submission_status
          - entities.Enrollment.fields.disenrollment_status
        distinguishing_aspect: "The two dimensions advance on different triggers and neither rewrites the other: a standard disenrollment moves disenrollment_status to STANDARD_DISENROLLED while submission_status stays EFFECTUATED, and the disenrollment edge is reachable only once the submission dimension has already reached EFFECTUATED."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through effectuation."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - *cc_ack
