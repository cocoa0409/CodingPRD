          assert:
            - "dependency in DRAFT: the version APPROVE returns HTTP 422 with error_id 'ERR_DATASET_NOT_APPROVED' (priority 40)"
            - "the dependent entity is untouched by that rejection: ModelVersion.${v1_id}.approval_state is still 'PENDING_REVIEW', approved_at is null, revalidation_due_at is null, decided_by_user_id is null"
            - "dependency in SUBMITTED: the very same APPROVE body still returns 422 'ERR_DATASET_NOT_APPROVED' — submitting the snapshot is not the same as approving it"
            - "the gate reads the CURRENT dependency state, not the state at version-creation time: nothing about ModelVersion.${v1_id} changed between the two attempts"
