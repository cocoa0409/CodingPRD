# =============================================================================
# PRD Benchmark Seed Tables — task_3084
# Private Student Loan Origination, School Certification & Cosigner Release
# difficulty: EXPERT (see complexity_profile)
# =============================================================================

scenario: |
  Private Student Loan Origination, School Certification & Cosigner Release (Sallie Mae): application with cosigner underwriting and combined credit evaluation, school certification of enrollment and cost of attendance limiting the approved amount, disbursement scheduling by academic period with school refund handling for over-disbursement, interest accrual options during school with deferred, interest-only and immediate repayment choices, cosigner release application after a required number of on-time payments and independent underwriting, grace period, deferment and forbearance rules that differ from federal programs, repayment plan changes and rate reduction incentives for automatic debit, delinquency and default handling with cosigner notification

domain_name: private-student-loan-origination
api_prefix: /private-student-loans

complexity_profile:
  primary_archetype: multi-party negotiation        # borrower + cosigner + school + underwriter + servicer must all agree before money moves
  secondary_archetype: compliance / audit           # private-loan servicing rules, cosigner notification duties, opt-in forbearance
  complexity_layers:
    - dual-variant calculation                      # deferred-vs-immediate accrual; forecast-vs-chronological delinquency aging
    - cascading side effects                        # disbursement → limit → blocked, delinquency → cosigner notification → release eligibility
    - optimistic concurrency                        # RepaymentPlan supersede guarded by Loan.version
    - derived field reconciliation                  # Loan.lifetime_capitalized_interest_cents vs InterestAccrualEntry ledger
    - rate / threshold triggers                     # cosigner-release payment run, autodebit 24-month floor, certified-limit crossing

  entity_topology: hybrid                            # Borrower-rooted tree + flat cross-references (School, LoanPolicy, Cosigner spanning loans)
  state_machine_shape: compound                      # Loan status is derived from certification/disbursement/forbearance children, with parallel axes
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                                   # Decision records eligibility_category selects ACADEMIC | CREDIT | POLICY_ERROR
  role_model: approval_chain                         # Borrower requests → Underwriter approves → School certifies → Servicer disburses
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the student borrower" }
      - { name: email, type: string, source: input, description: "Unique login/notification email" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of residence" }
      - { name: program_level, type: enum, source: input, description: "Program level of the borrower's degree", constraints: "UNDERGRADUATE | GRADUATE" }
      - { name: enrollment_status, type: enum, source: computed, description: "Current enrollment standing used by accrual and grace rules", constraints: "IN_SCHOOL | LESS_THAN_HALF_TIME | GRADUATED | WITHDRAWN" }
      - { name: on_time_payment_run_count, type: integer, source: computed, default: 0, description: "Length of the CURRENT unbroken run of consecutive qualifying payments ending at the most recent due period; resets to 0 on any missed or late payment" }
      - { name: lifetime_on_time_payment_count, type: integer, source: computed, default: 0, description: "Monotonic count of qualifying payments ever made; never decremented by a later late payment" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Borrower lifecycle", constraints: "ACTIVE | LOCKED" }

  - name: Cosigner
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; the borrower this cosigner backs" }
      - { name: full_name, type: string, source: input, description: "Legal name of the cosigner" }
      - { name: email, type: string, source: input, description: "Cosigner notification email" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of residence" }
      - { name: relationship, type: enum, source: input, description: "Relationship to the borrower", constraints: "PARENT | GRANDPARENT | SIBLING | SPOUSE | OTHER" }
      - { name: credit_score, type: integer, source: input, description: "Cosigner FICO score at invitation" }
      - { name: credit_history_months, type: integer, source: input, description: "Length of the cosigner's credit history in months" }
      - { name: dti_ratio, type: number, source: input, description: "Cosigner debt-to-income ratio, 0.0-1.0" }
      - { name: underwriting_status, type: enum, source: computed, default: "INVITED", description: "Cosigner standing; RELEASED removes the cosigner from combined evaluation", constraints: "INVITED | UNDER_REVIEW | ELIGIBLE | INELIGIBLE | RELEASED" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution legal name" }
      - { name: school_code, type: string, source: input, description: "Unique six-digit federal school code" }
      - { name: state_code, type: string, source: input, description: "Two-letter state where the institution is located" }
      - { name: certification_capacity_per_period_cents, type: integer, source: input, description: "Maximum aggregate amount this school will certify in a single academic period across all its certifications" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the institution is currently an eligible lender-partner school" }

  - name: LoanPolicy
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique loan product code, e.g. SM-UG-2026" }
      - { name: program_level, type: enum, source: input, description: "Program level this policy underwrites", constraints: "UNDERGRADUATE | GRADUATE" }
      - { name: cosigner_release_min_on_time_payments, type: integer, source: input, default: 24, description: "Number of consecutive qualifying on-time payments required before a cosigner release application may be approved" }
      - { name: cosigner_release_min_credit_score, type: integer, source: input, default: 660, description: "Minimum independent credit score on the release underwriting" }
      - { name: cosigner_release_max_dti_ratio, type: number, source: input, default: 0.45, description: "Maximum independent debt-to-income ratio on the release underwriting" }
      - { name: autodebit_rate_reduction_pct, type: number, source: input, default: 0.25, description: "Interest-rate reduction granted while automatic debit is enrolled" }
      - { name: autodebit_min_payments_before_reduction, type: integer, source: input, default: 24, description: "Distinct on-time payments that must be cleared before the automatic-debit reduction applies to the accrual rate" }
      - { name: extended_term_months, type: integer, source: input, default: 120, description: "Term length of an EXTENDED repayment plan" }
      - { name: capitalized_interest_cap_pct, type: number, source: input, default: 0.10, description: "Interest capitalized at repayment entry may never exceed this fraction of the disbursed principal" }
      - { name: in_school_max_deferment_months, type: integer, source: input, default: 48, description: "Maximum cumulative forbearance/deferment months granted while the loan is IN_SCHOOL" }
      - { name: repayment_max_deferment_months, type: integer, source: input, default: 24, description: "Maximum cumulative forbearance/deferment months granted while the loan is in REPAYMENT" }
      - { name: delinquency_notice_threshold_days, type: integer, source: input, default: 5, description: "Arrears in days at which the cosigner delinquency notice obligation triggers" }
      - { name: allows_standalone_borrower, type: boolean, source: input, default: false, description: "Whether a file with no cosigner may be underwritten at all" }

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; the applicant" }
      - { name: cosigner_id, type: string, source: input, required: false, description: "FK -> Cosigner.id; optional cosigner backing this application" }
      - { name: school_id, type: string, source: input, description: "FK -> School.id; institution the funds are certified for" }
      - { name: policy_id, type: string, source: input, description: "FK -> LoanPolicy.id; underwriting policy the application is priced against" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the borrower asked for" }
      - { name: cost_of_attendance_cents, type: integer, source: input, description: "Stated cost of attendance for the academic year" }
      - { name: other_aid_cents, type: integer, source: input, default: 0, description: "Aid the borrower already receives from other sources" }
      - { name: interest_accrual_option, type: enum, source: input, description: "In-school interest treatment selected at application", constraints: "DEFERRED | INTEREST_ONLY | IMMEDIATE" }
      - { name: repayment_term_months, type: integer, source: input, description: "Requested in-repayment term length in months" }
      - { name: certified_limit_cents, type: computed, description: "Cost of attendance minus other aid, floored at zero; the hard ceiling any certification may authorize" }
      - { name: combined_credit_score, type: computed, description: "Credit metric from the combined borrower+cosigner evaluation" }
      - { name: tier, type: enum, source: computed, description: "Pricing tier derived from combined_credit_score", constraints: "A | B | C | D | DECLINED" }
      - { name: margin_rate_pct, type: computed, description: "Annual margin rate assigned by tier" }
      - { name: decision_path, type: enum, source: computed, required: false, description: "Which underwriting track the file took", constraints: "COSIGNER_PRIMARY | BORROWER_STANDALONE" }
      - { name: approved_amount_cents, type: computed, required: false, description: "Amount approved at underwriting, before any school certification cap" }
      - { name: denial_reason, type: enum, source: computed, required: false, description: "Reason recorded when the application is DENIED", constraints: "CREDIT_SCORE | DTI | INSUFFICIENT_HISTORY | POLICY_ERROR" }
      - { name: application_status, type: enum, source: system, default: "SUBMITTED", description: "Application lifecycle", constraints: "SUBMITTED | UNDER_REVIEW | SCHOOL_CERT_PENDING | APPROVED | DENIED | CANCELLED | DISBURSED | CLOSED" }

  - name: SchoolCertification
    parent: LoanApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> LoanApplication.id; the application being certified" }
      - { name: school_id, type: string, source: system, description: "FK -> School.id; the certifying institution" }
      - { name: academic_period_label, type: string, source: input, description: "Academic period the certification covers, e.g. 2026-FALL" }
      - { name: certified_amount_cents, type: integer, source: input, description: "Amount the school certifies for this period; may not exceed the application's certified_limit_cents" }
      - { name: certified_enrollment_status, type: enum, source: input, description: "Enrollment standing the school certifies", constraints: "IN_SCHOOL | LESS_THAN_HALF_TIME | GRADUATED | WITHDRAWN" }
      - { name: certified_date, type: datetime, source: system, description: "Server-stamped instant the school returned the certification" }
      - { name: certification_status, type: enum, source: system, default: "REQUESTED", description: "Certification lifecycle", constraints: "REQUESTED | CERTIFIED | PARTIAL_CERTIFIED | REJECTED | EXPIRED" }
      - { name: rejection_reason, type: enum, source: computed, required: false, description: "Reason recorded when the school rejects", constraints: "NOT_ENROLLED | COST_EXCEEDED | PROGRAM_INELIGIBLE | SCHOOL_INACTIVE" }

  - name: Loan
    parent: Borrower
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; the student obligor" }
      - { name: application_id, type: string, source: system, description: "FK -> LoanApplication.id; the approved application this loan was opened from" }
      - { name: cosigner_id, type: string, source: system, required: false, description: "FK -> Cosigner.id; the cosigner currently on the note, cleared on release" }
      - { name: policy_id, type: string, source: system, description: "FK -> LoanPolicy.id; servicing policy in force" }
      - { name: principal_cents, type: computed, description: "Disbursed principal still outstanding" }
      - { name: disbursed_amount_cents, type: computed, default: 0, description: "Sum of RELEASED disbursements on this loan" }
      - { name: certified_amount_cents, type: computed, description: "Sum of certified amounts across non-REJECTED SchoolCertification children" }
      - { name: repayment_entered_date, type: datetime, source: computed, required: false, description: "Instant the loan moved GRACE -> REPAYMENT; null while the loan has not entered repayment" }
      - { name: lifetime_accrued_interest_cents, type: computed, default: 0, description: "Sum of InterestAccrualEntry.accrued_amount_cents over ACCRUED and CAPITALIZED entries" }
      - { name: lifetime_capitalized_interest_cents, type: computed, default: 0, description: "Denormalized sum of InterestAccrualEntry entries in CAPITALIZED status; MUST equal the ledger sum" }
      - { name: current_balance_cents, type: computed, description: "principal_cents + unpaid accrued interest still owed" }
      - { name: interest_accrual_option, type: enum, source: system, description: "In-school interest treatment in force", constraints: "DEFERRED | INTEREST_ONLY | IMMEDIATE" }
      - { name: repayment_option, type: enum, source: computed, default: "DEFERRED", description: "In-school repayment obligation in force; follows interest_accrual_option unless a deferment supersedes it", constraints: "DEFERRED | INTEREST_ONLY | IMMEDIATE" }
      - { name: active_plan_type, type: enum, source: computed, required: false, description: "plan_type of the single RepaymentPlan child in ACTIVE status; null when no plan is active", constraints: "STANDARD | GRADUATED | EXTENDED | INCOME_BASED" }
      - { name: effective_rate_pct, type: computed, description: "margin_rate_pct minus the automatic-debit reduction actually in force" }
      - { name: autodebit_enrolled, type: boolean, source: system, default: false, description: "Whether automatic debit is currently enrolled" }
      - { name: autodebit_enrolled_date, type: datetime, source: computed, required: false, description: "Instant automatic debit was enrolled; null when not enrolled" }
      - { name: cumulative_deferment_months, type: computed, default: 0, description: "Sum of granted forbearance/deferment months since origination" }
      - { name: earned_capitalization_count, type: integer, source: computed, default: 0, description: "Number of capitalization events already applied to this loan" }
      - { name: lifetime_principal_reduction_cents, type: computed, default: 0, description: "Conserved quantity: cumulative principal reduction caused by rate changes and automatic-debit incentives" }
      - { name: unpaid_interest_cents, type: computed, description: "Accrued interest not yet capitalized or paid" }
      - { name: max_allowed_capitalization_cents, type: computed, description: "capitalized_interest_cap_pct * disbursed_amount_cents, rounded half up to the cent" }
      - { name: max_autodebit_waiver_benefit_cents, type: computed, description: "Upper bound of the automatic-debit waiver benefit: the balance times the product of rate reduction fraction and the in-school-with-immediate-accrual months" }
      - { name: disburse_blocked, type: boolean, source: computed, default: false, description: "True when a school refund is outstanding or the loan is in DEFAULT/FORBEARANCE_DEFERMENT; blocks new disbursements" }
      - { name: certification_limit_cents, type: integer, source: computed, description: "The certified_limit_cents of the originating application, frozen onto the loan at approval" }
      - { name: days_past_due, type: integer, source: computed, default: 0, description: "Arrears in days as of the current logical clock" }
      - { name: delinquency_stage, type: enum, source: computed, default: "CURRENT", description: "Derived aging stage", constraints: "CURRENT | LATE | DELINQUENT | DEFAULT_ELIGIBLE" }
      - { name: notice_obligation_status, type: enum, source: computed, default: "NONE", description: "Cosigner-notification obligation state", constraints: "NONE | PENDING | SATISFIED" }
      - { name: loan_status, type: enum, source: system, default: "APPROVED", description: "Compound loan lifecycle derived from children", constraints: "APPROVED | IN_SCHOOL | GRACE | REPAYMENT | FORBEARANCE_DEFERMENT | DELINQUENT | DEFAULT | PAID_IN_FULL" }

  - name: Disbursement
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; the loan this disbursement funds" }
      - { name: academic_period_label, type: string, source: input, description: "Academic period the funds are released for, e.g. 2026-FALL" }
      - { name: period_start_date, type: datetime, source: input, description: "Start of the academic period" }
      - { name: period_end_date, type: datetime, source: input, description: "End of the academic period" }
      - { name: scheduled_date, type: datetime, source: input, description: "Date the funds are scheduled to be sent to the school" }
      - { name: amount_cents, type: integer, source: input, description: "Amount scheduled for release in this period" }
      - { name: released_date, type: datetime, source: system, required: false, description: "Instant the disbursement was released" }
      - { name: remainder_credited_cents, type: computed, default: 0, description: "Over-disbursement returned by the school and credited back against the loan" }
      - { name: refund_status, type: enum, source: computed, default: "NOT_APPLICABLE", description: "School refund handling state", constraints: "NOT_APPLICABLE | REFUND_DUE | REFUNDED" }
      - { name: disbursement_status, type: enum, source: system, default: "SCHEDULED", description: "Disbursement lifecycle", constraints: "SCHEDULED | RELEASED | CANCELLED | FAILED" }

  - name: InterestAccrualEntry
    parent: Loan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; the loan this accrual belongs to" }
      - { name: entry_date, type: datetime, source: input, description: "Logical date the accrual entry is booked for" }
      - { name: accrued_amount_cents, type: integer, source: input, description: "Interest accrued for this entry" }
      - { name: entry_status, type: enum, source: system, default: "ACCRUED", description: "Entry lifecycle; CAPITALIZED entries are the ones summed into lifetime_capitalized_interest_cents", constraints: "ACCRUED | CAPITALIZED | UNPAID_DUE | WRITTEN_OFF" }
      - { name: source_event, type: enum, source: system, description: "Which action booked the entry", constraints: "PERIOD_ACCRUAL | CAPITALIZATION | PAYMENT_REVERSAL" }

  - name: RepaymentPlan
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; the loan this plan amortizes" }
      - { name: plan_type, type: enum, source: input, description: "Requested plan shape", constraints: "STANDARD | GRADUATED | EXTENDED | INCOME_BASED" }
      - { name: term_months, type: integer, source: input, description: "Requested term length; EXTENDED plans longer than the product's extended_term_months are rejected" }
      - { name: principal_snapshot_cents, type: integer, source: system, description: "Loan principal captured at plan submission; version-pinned and frozen for the life of the plan" }
      - { name: rate_snapshot_pct, type: number, source: system, description: "Loan effective_rate_pct captured at plan submission; version-pinned" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Level monthly payment solved from the pinned snapshot, the pinned rate and term_months" }
      - { name: plan_status, type: enum, source: system, default: "PENDING_APPROVAL", description: "Plan lifecycle; at most one ACTIVE plan may exist per loan", constraints: "PENDING_APPROVAL | ACTIVE | SUPERSEDED | DECLINED" }

  - name: Payment
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; the loan this payment services" }
      - { name: due_period_index, type: integer, source: input, description: "1-based repayment period this payment covers" }
      - { name: scheduled_due_date, type: datetime, source: system, description: "Server-stamped scheduled due instant for the period" }
      - { name: paid_date, type: datetime, source: input, description: "Logical date the payment cleared" }
      - { name: amount_cents, type: integer, source: input, description: "Amount paid" }
      - { name: payment_status, type: enum, source: system, default: "SCHEDULED", description: "Payment lifecycle", constraints: "SCHEDULED | PAID_ON_TIME | PAID_LATE | MISSED | REVERSED" }
      - { name: arrear_days, type: integer, source: computed, default: 0, description: "Days between scheduled_due_date and paid_date when late; 0 when on time" }
      - { name: is_qualifying, type: boolean, source: computed, default: false, description: "True iff payment_status is PAID_ON_TIME; only qualifying payments extend the borrower's on-time run" }

  - name: ForbearanceDeferment
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; the loan this relief applies to" }
      - { name: relief_type, type: enum, source: input, description: "Type of relief; private-loan in-school deferment covers less than federal programs", constraints: "IN_SCHOOL_DEFERMENT | RESIDENCY_DEFERMENT | ECONOMIC_HARDSHIP_FORBEARANCE | ADMINISTRATIVE_FORBEARANCE" }
      - { name: months_requested, type: integer, source: input, description: "Months of relief requested" }
      - { name: interest_treatment, type: enum, source: input, description: "Requested interest treatment while relief runs", constraints: "ACCRUES_UNPAID | INTEREST_ONLY" }
      - { name: start_date, type: datetime, source: input, description: "Requested start instant" }
      - { name: months_granted, type: integer, source: computed, default: 0, description: "Months actually granted after the product cap is applied" }
      - { name: relief_status, type: enum, source: system, default: "REQUESTED", description: "Relief lifecycle", constraints: "REQUESTED | GRANTED | DENIED | CANCELLED" }

  - name: CosignerReleaseApplication
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; the loan the cosigner wants off" }
      - { name: cosigner_id, type: string, source: system, description: "FK -> Cosigner.id; the cosigner requesting release" }
      - { name: payments_at_application, type: integer, source: system, description: "Borrower.on_time_payment_run_count captured at submission" }
      - { name: independent_credit_score, type: integer, source: input, description: "Borrower-only credit score submitted for the independent re-underwriting" }
      - { name: independent_dti_ratio, type: number, source: input, description: "Borrower-only debt-to-income ratio submitted for the independent re-underwriting" }
      - { name: required_min_payments, type: integer, source: computed, description: "policy.cosigner_release_min_on_time_payments frozen at submission" }
      - { name: run_at_submission, type: integer, source: computed, description: "Snapshot of the borrower's unbroken run at submission; the release decision reads this snapshot, never the live counter" }
      - { name: release_status, type: enum, source: system, default: "SUBMITTED", description: "Release lifecycle", constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | DECLINED | WITHDRAWN" }
      - { name: deficiency_reason, type: enum, source: computed, required: false, description: "Why the release was declined", constraints: "INSUFFICIENT_PAYMENTS | CREDIT_SCORE | DTI | RELEASE_SCORE | DELINQUENT_LOAN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # LoanApplication — branching with revert (DENIED -> UNDER_REVIEW reconsider loop)
  # ---------------------------------------------------------------------------
  - entity: LoanApplication
    initial_state: SUBMITTED
    terminal_states: [CANCELLED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system event on POST /private-student-loans/loan-applications"
        actor: system
        preconditions:
          - "referenced borrower_id, school_id and policy_id all resolve"
          - "when cosigner_id is supplied, the Cosigner.underwriting_status is INVITED or UNDER_REVIEW"
        side_effects:
          - "LoanApplication.combined_credit_score recomputed by calculation combined_credit_underwriting (provisional variant)"
          - "LoanApplication.tier and LoanApplication.margin_rate_pct recomputed"
          - "LoanApplication.decision_path set to COSIGNER_PRIMARY when cosigner_id is non-null, else BORROWER_STANDALONE"
        note: "Application is created directly in SUBMITTED and immediately advances; the provisional tier is priced from client-stated figures."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /private-student-loans/loan-applications/{id}/decision with decision=APPROVE"
        actor: Underwriter
        preconditions:
          - "application_status == UNDER_REVIEW"
          - "tier != DECLINED under the FINAL variant of combined_credit_underwriting"
          - "approved_amount_cents >= 100000"
        side_effects:
          - "LoanApplication.credit decision recomputed under the FINAL variant of combined_credit_underwriting"
          - "LoanApplication.approved_amount_cents = min(requested_amount_cents, certified_limit_cents)"
          - "a Loan is created with loan_status APPROVED, certification_limit_cents frozen from the application, and interest_accrual_option copied"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /private-student-loans/loan-applications/{id}/decision with decision=DENY"
        actor: Underwriter
        preconditions:
          - "application_status == UNDER_REVIEW"
        side_effects:
          - "LoanApplication.denial_reason set to the first failing underwriting gate"
          - "when cosigner_id is non-null, Cosigner.underwriting_status set to INELIGIBLE"

      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /private-student-loans/loan-applications/{id}/reconsider"
        actor: Borrower
        preconditions:
          - "application_status == DENIED"
          - "the acting Borrower owns this application"
        side_effects:
          - "LoanApplication.combined_credit_score recomputed by the provisional variant of combined_credit_underwriting"
          - "Cosigner.underwriting_status reset INVITED -> UNDER_REVIEW"
        note: "Cycle: a denied file may be re-presented after fresh figures."

      - from: APPROVED
        to: SCHOOL_CERT_PENDING
        trigger: "POST /private-student-loans/loan-applications/{id}/school-certifications"
        actor: School
        preconditions:
          - "application_status == APPROVED"
          - "the acting School is the application's school_id"
        side_effects:
          - "a SchoolCertification child is created in REQUESTED status"

      - from: SCHOOL_CERT_PENDING
        to: APPROVED
        trigger: "system event when the last non-EXPIRED SchoolCertification child is REJECTED"
        actor: system
        preconditions:
          - "every SchoolCertification child is in REJECTED or EXPIRED status"
        side_effects:
          - "the Loan created at approval remains APPROVED and receives no disbursements"

      - from: SCHOOL_CERT_PENDING
        to: DISBURSED
        trigger: "system event when the first Disbursement child reaches RELEASED"
        actor: system
        preconditions:
          - "at least one SchoolCertification child is CERTIFIED or PARTIAL_CERTIFIED"
          - "the originating Loan.loan_status == IN_SCHOOL"
        side_effects:
          - "LoanApplication.application_status advances to DISBURSED"

      - from: DISBURSED
        to: CLOSED
        trigger: "system event when the originating Loan reaches PAID_IN_FULL"
        actor: system
        preconditions:
          - "Loan.loan_status == PAID_IN_FULL"
        side_effects:
          - "no further disbursements may be scheduled on the application"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /private-student-loans/loan-applications/{id}/cancel"
        actor: Borrower
        preconditions:
          - "application_status == SUBMITTED or UNDER_REVIEW"
        side_effects:
          - "any SchoolCertification children in REQUESTED status move to EXPIRED"

      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /private-student-loans/loan-applications/{id}/cancel"
        actor: Borrower
        preconditions:
          - "application_status == UNDER_REVIEW"
          - "the acting Borrower owns this application"
        side_effects:
          - "any SchoolCertification children in REQUESTED status move to EXPIRED"

  # ---------------------------------------------------------------------------
  # Loan — compound + parallel + cure cycle (DELINQUENT -> REPAYMENT)
  # ---------------------------------------------------------------------------
  - entity: Loan
    initial_state: APPROVED
    terminal_states: [PAID_IN_FULL]
    transitions:
      - from: APPROVED
        to: IN_SCHOOL
        trigger: "system event when the first Disbursement child reaches RELEASED"
        actor: system
        preconditions:
          - "the originating LoanApplication.application_status == SCHOOL_CERT_PENDING or DISBURSED"
          - "Loan.disburse_blocked == false"
        side_effects:
          - "Loan.disbursed_amount_cents recomputed as the sum of RELEASED Disbursement.amount_cents minus REFUNDED Disbursement.remainder_credited_cents"
          - "Loan.principal_cents recomputed from the disbursement ledger"
          - "Loan.current_balance_cents recomputed"
          - "LoanApplication.application_status advances to DISBURSED"

      - from: IN_SCHOOL
        to: GRACE
        trigger: "POST /private-student-loans/loans/{id}/enrollment-status with enrollment_status=GRADUATED or WITHDRAWN"
        actor: School
        preconditions:
          - "Loan.loan_status == IN_SCHOOL"
          - "at least one SchoolCertification child is CERTIFIED or PARTIAL_CERTIFIED"
        side_effects:
          - "Borrower.enrollment_status set to the submitted value"
          - "Loan.unpaid_interest_cents recomputed by in_school_interest_accrual_dual in its revaluation variant"
        note: "Private-loan grace is 6 months and begins at graduation or withdrawal only; dropping below half time does not start grace."

      - from: IN_SCHOOL
        to: FORBEARANCE_DEFERMENT
        trigger: "POST /private-student-loans/loans/{id}/forbearances with relief_type=IN_SCHOOL_DEFERMENT and relief_status=GRANTED"
        actor: Servicer
        preconditions:
          - "cumulative_deferment_months + months_granted <= policy.in_school_max_deferment_months"
        side_effects:
          - "Loan.unpaid_interest_cents frozen for the granted window"
          - "Loan.loan_status set to FORBEARANCE_DEFERMENT"

      - from: FORBEARANCE_DEFERMENT
        to: IN_SCHOOL
        trigger: "POST /private-student-loans/loans/{id}/forbearances/{fid}/cancel"
        actor: Servicer
        preconditions:
          - "the relief was GRANTED and its start_date is not in the past relative to the logical clock"
        side_effects:
          - "Loan.cumulative_deferment_months reduced by the cancelled months_granted"
          - "Loan.loan_status restored to IN_SCHOOL"

      - from: GRACE
        to: REPAYMENT
        trigger: "POST /private-student-loans/loans/{id}/enter-repayment"
        actor: Servicer
        preconditions:
          - "Loan.loan_status == GRACE"
          - "at least one RepaymentPlan child is ACTIVE"
        side_effects:
          - "Loan.repayment_entered_date stamped from the logical clock"
          - "an InterestAccrualEntry is created with entry_status CAPITALIZED and source_event CAPITALIZATION, capped at max_allowed_capitalization_cents"
          - "Loan.lifetime_capitalized_interest_cents increases by that entry's accrued_amount_cents"
          - "Loan.principal_cents increases by that entry's accrued_amount_cents"
          - "Loan.unpaid_interest_cents reset to zero"
          - "Loan.current_balance_cents recomputed"

      - from: REPAYMENT
        to: DELINQUENT
        trigger: "system event on POST /private-student-loans/loans/{id}/payments when a payment is recorded PAID_LATE or MISSED"
        actor: system
        preconditions:
          - "Loan.loan_status == REPAYMENT"
          - "the payment's arrear_days > 0"
        side_effects:
          - "Borrower.on_time_payment_run_count reset to 0"
          - "Loan.days_past_due recomputed from the oldest unpaid Payment scheduled_due_date"
          - "Loan.delinquency_stage recomputed by delinquency_aging_projection"
          - "when days_past_due >= policy.delinquency_notice_threshold_days, Loan.notice_obligation_status set to PENDING"
          - "Cosigner.underwriting_status set to INELIGIBLE when days_past_due >= policy.delinquency_notice_threshold_days"
          - "every CosignerReleaseApplication child in SUBMITTED or UNDER_REVIEW moves to DECLINED with deficiency_reason DELINQUENT_LOAN"

      - from: REPAYMENT
        to: PAID_IN_FULL
        trigger: "system event when Loan.current_balance_cents reaches 0"
        actor: system
        preconditions:
          - "current_balance_cents == 0"
          - "every Payment child is PAID_ON_TIME, PAID_LATE or REVERSED"
        side_effects:
          - "LoanApplication.application_status advances to CLOSED when it was DISBURSED"

      - from: DELINQUENT
        to: REPAYMENT
        trigger: "POST /private-student-loans/loans/{id}/cure"
        actor: Servicer
        preconditions:
          - "Loan.loan_status == DELINQUENT"
          - "every Payment child with payment_status MISSED has had a cleared payment (PAID_ON_TIME or PAID_LATE) recorded against the same due_period_index"
        side_effects:
          - "Loan.days_past_due recomputed to 0"
          - "Loan.delinquency_stage recomputed to CURRENT"
          - "Borrower.on_time_payment_run_count recomputed as the unbroken run ending at the most recent cleared due period"
        note: "Cycle: a delinquent private loan may cure back to REPAYMENT, but the lifetime counter is not restored."

      - from: DELINQUENT
        to: DEFAULT
        trigger: "POST /private-student-loans/loans/{id}/declare-default"
        actor: Servicer
        preconditions:
          - "Loan.loan_status == DELINQUENT"
          - "Loan.days_past_due >= 120"
        side_effects:
          - "Loan.notice_obligation_status set to PENDING"
          - "Cosigner.underwriting_status set to INELIGIBLE"
          - "every CosignerReleaseApplication child in SUBMITTED or UNDER_REVIEW moves to DECLINED with deficiency_reason DELINQUENT_LOAN"
          - "Loan.disburse_blocked set to true"
          - "Loan.effective_rate_pct reverts to margin_rate_pct (automatic-debit reduction removed)"

      - from: DEFAULT
        to: REPAYMENT
        trigger: "POST /private-student-loans/loans/{id}/rehabilitate"
        actor: Servicer
        preconditions:
          - "Loan.loan_status == DEFAULT"
          - "rehabilitation_amount_cents >= 3 * the ACTIVE RepaymentPlan.monthly_payment_cents"
        side_effects:
          - "Loan.disburse_blocked set to false"
          - "Loan.days_past_due recomputed to 0"
          - "Loan.delinquency_stage recomputed to CURRENT"
          - "Loan.loan_status set to REPAYMENT"
        note: "Cycle: default is recoverable by rehabilitation."

      - from: REPAYMENT
        to: FORBEARANCE_DEFERMENT
        trigger: "POST /private-student-loans/loans/{id}/forbearances with relief_status=GRANTED"
        actor: Servicer
        preconditions:
          - "cumulative_deferment_months + months_granted <= policy.repayment_max_deferment_months"
        side_effects:
          - "Loan.loan_status set to FORBEARANCE_DEFERMENT"
          - "Loan.unpaid_interest_cents recomputed by in_school_interest_accrual_dual in its revaluation variant"

      - from: FORBEARANCE_DEFERMENT
        to: REPAYMENT
        trigger: "POST /private-student-loans/loans/{id}/forbearances/{fid}/cancel"
        actor: Servicer
        preconditions:
          - "the relief was GRANTED and its start_date is not in the past relative to the logical clock"
        side_effects:
          - "Loan.cumulative_deferment_months reduced by the cancelled months_granted"
          - "Loan.loan_status restored to REPAYMENT"

  # ---------------------------------------------------------------------------
  # SchoolCertification — branch + revert (REJECTED -> REQUESTED re-file)
  # ---------------------------------------------------------------------------
  - entity: SchoolCertification
    initial_state: REQUESTED
    terminal_states: [EXPIRED]
    transitions:
      - from: REQUESTED
        to: CERTIFIED
        trigger: "POST /private-student-loans/school-certifications/{id}/certify"
        actor: School
        preconditions:
          - "the certification's application SchoolCertification parent is APPROVED or SCHOOL_CERT_PENDING"
          - "the acting School is the certification's school_id"
          - "School.active == true"
          - "certified_amount_cents + the period's already-certified total <= School.certification_capacity_per_period_cents"
        side_effects:
          - "SchoolCertification.certified_date stamped from the logical clock"
          - "LoanApplication.certified_amount_cents recomputed as the sum of certified_amount_cents over children in CERTIFIED or PARTIAL_CERTIFIED status"
          - "the originating Loan.certified_amount_cents recomputed"

      - from: REQUESTED
        to: PARTIAL_CERTIFIED
        trigger: "POST /private-student-loans/school-certifications/{id}/certify with a certified_amount_cents below the requested amount"
        actor: School
        preconditions:
          - "the three CERTIFIED preconditions hold"
          - "certified_amount_cents < the amount the application requested for this period"
        side_effects:
          - "SchoolCertification.certified_date stamped from the logical clock"
          - "LoanApplication.certified_amount_cents recomputed over CERTIFIED and PARTIAL_CERTIFIED children"
          - "the originating Loan.certified_amount_cents recomputed"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /private-student-loans/school-certifications/{id}/reject"
        actor: School
        preconditions:
          - "rejection_reason is a declared enum member"
        side_effects:
          - "LoanApplication.certified_amount_cents recomputed over non-REJECTED, non-EXPIRED children"
          - "when every sibling certification is REJECTED or EXPIRED, LoanApplication.application_status reverts to APPROVED"
        note: "Branch: reject reverts the application so a fresh certification may be filed."

      - from: REJECTED
        to: REQUESTED
        trigger: "POST /private-student-loans/school-certifications/{id}/refile"
        actor: School
        preconditions:
          - "certification_status == REJECTED"
          - "the parent LoanApplication.application_status == APPROVED"
        side_effects:
          - "SchoolCertification.rejection_reason cleared to null"
          - "certified_amount_cents reset to 0"

      - from: CERTIFIED
        to: EXPIRED
        trigger: "system event when the logical clock passes period_end_date + 30 days"
        actor: system
        preconditions:
          - "certification_status is CERTIFIED or PARTIAL_CERTIFIED"
        side_effects:
          - "Loan.certified_amount_cents recomputed excluding the expired certification"
          - "Loan.application certified total recomputed"

      - from: PARTIAL_CERTIFIED
        to: EXPIRED
        trigger: "system event when the logical clock passes period_end_date + 30 days"
        actor: system
        preconditions:
          - "certification_status is PARTIAL_CERTIFIED"
        side_effects:
          - "Loan.certified_amount_cents recomputed excluding the expired certification"

  # ---------------------------------------------------------------------------
  # Disbursement — linear with a retry cycle (FAILED -> SCHEDULED)
  # ---------------------------------------------------------------------------
  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /private-student-loans/disbursements/{id}/release"
        actor: Servicer
        preconditions:
          - "Loan.loan_status is APPROVED or IN_SCHOOL"
          - "Loan.disburse_blocked == false"
          - "the certification covering academic_period_label is CERTIFIED or PARTIAL_CERTIFIED"
          - "Loan.disbursed_amount_cents + amount_cents - Loan.refunded_amount_cents <= Loan.certified_amount_cents"
        side_effects:
          - "Disbursement.released_date stamped from the logical clock"
          - "Loan.disbursed_amount_cents recomputed over RELEASED children net of refunds"
          - "Loan.principal_cents recomputed"
          - "Loan.current_balance_cents recomputed"
          - "when this is the loan's first RELEASED disbursement, Loan.loan_status advances APPROVED -> IN_SCHOOL"
          - "when Loan.disbursed_amount_cents + amount_cents - remainder credits > Loan.certified_amount_cents, Disbursement.refund_status set to REFUND_DUE on the overage"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "DELETE /private-student-loans/disbursements/{id}"
        actor: Servicer
        preconditions:
          - "disbursement_status == SCHEDULED"
        side_effects:
          - "Loan.disburse_blocked recomputed"

      - from: SCHEDULED
        to: FAILED
        trigger: "system event when the school rejects the transmitted funds"
        actor: system
        preconditions:
          - "disbursement_status == SCHEDULED"
        side_effects:
          - "Loan.disburse_blocked set to true"

      - from: FAILED
        to: SCHEDULED
        trigger: "POST /private-student-loans/disbursements/{id}/reschedule"
        actor: Servicer
        preconditions:
          - "disbursement_status == FAILED"
          - "scheduled_date is not in the past relative to the logical clock"
        side_effects:
          - "Loan.disburse_blocked recomputed to false when no other blocker remains"

      - from: RELEASED
        to: RELEASED
        trigger: "POST /private-student-loans/disbursements/{id}/school-refund"
        actor: School
        preconditions:
          - "disbursement_status == RELEASED"
          - "remainder_credited_cents == 0"
          - "remainder_credited_cents <= amount_cents"
        side_effects:
          - "Disbursement.refund_status set to REFUNDED"
          - "Disbursement.remainder_credited_cents set from the submitted amount"
          - "Loan.disbursed_amount_cents recomputed net of the refund"
          - "Loan.principal_cents, Loan.current_balance_cents and Loan.certified_amount_cents recomputed"
          - "Loan.disburse_blocked recomputed to false once no REFUND_DUE disbursement remains"
        note: "Over-disbursement handling: the school returns the excess and it is credited against principal without reducing the recorded certification."

  # ---------------------------------------------------------------------------
  # RepaymentPlan — branch; at most one ACTIVE plan per loan
  # ---------------------------------------------------------------------------
  - entity: RepaymentPlan
    initial_state: PENDING_APPROVAL
    terminal_states: [SUPERSEDED, DECLINED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /private-student-loans/repayment-plans/{id}/approve"
        actor: Servicer
        preconditions:
          - "Loan.loan_status is IN_SCHOOL, GRACE, REPAYMENT or FORBEARANCE_DEFERMENT"
          - "monthly_payment_cents >= 5000"
          - "when plan_type == EXTENDED, term_months <= policy.extended_term_months"
        side_effects:
          - "any sibling RepaymentPlan in ACTIVE status moves to SUPERSEDED"
          - "Loan.active_plan_type set to this plan's plan_type"
          - "Loan.version incremented"

      - from: PENDING_APPROVAL
        to: DECLINED
        trigger: "POST /private-student-loans/repayment-plans/{id}/decline"
        actor: Servicer
        preconditions:
          - "plan_status == PENDING_APPROVAL"
        side_effects:
          - "no change to Loan.active_plan_type"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event when a sibling RepaymentPlan is approved"
        actor: system
        preconditions:
          - "plan_status == ACTIVE"
          - "another RepaymentPlan child of the same Loan entered ACTIVE"
        side_effects:
          - "Loan.active_plan_type recomputed to the newest ACTIVE sibling's plan_type"
          - "Loan.version incremented"

  # ---------------------------------------------------------------------------
  # Payment — parallel with the loan's delinquency axis; reversal cycle
  # ---------------------------------------------------------------------------
  - entity: Payment
    initial_state: SCHEDULED
    terminal_states: [PAID_ON_TIME, MISSED, REVERSED]
    transitions:
      - from: SCHEDULED
        to: PAID_ON_TIME
        trigger: "POST /private-student-loans/loans/{id}/payments"
        actor: Borrower
        preconditions:
          - "paid_date <= scheduled_due_date + policy delinquency_notice_threshold_days days"
          - "Loan.loan_status is REPAYMENT, DELINQUENT or FORBEARANCE_DEFERMENT"
        side_effects:
          - "Payment.arrear_days set to 0"
          - "Payment.is_qualifying set to true"
          - "Borrower.on_time_payment_run_count incremented"
          - "Borrower.lifetime_on_time_payment_count incremented"
          - "Loan.current_balance_cents reduced by amount_cents"

      - from: SCHEDULED
        to: PAID_LATE
        trigger: "POST /private-student-loans/loans/{id}/payments"
        actor: Borrower
        preconditions:
          - "paid_date > scheduled_due_date + policy delinquency_notice_threshold_days days"
          - "Loan.loan_status is REPAYMENT or DELINQUENT"
        side_effects:
          - "Payment.arrear_days set to the whole-day gap between scheduled_due_date and paid_date"
          - "Payment.is_qualifying set to false"
          - "Borrower.on_time_payment_run_count reset to 0"
          - "Loan.days_past_due recomputed"
          - "Loan.delinquency_stage recomputed by delinquency_aging_projection"
          - "when days_past_due >= company threshold, Loan.notice_obligation_status set to PENDING"

      - from: SCHEDULED
        to: MISSED
        trigger: "system event when the logical clock passes scheduled_due_date + policy delinquency_notice_threshold_days days with no clearing payment"
        actor: system
        preconditions:
          - "the due period has elapsed on the logical clock"
        side_effects:
          - "Borrower.on_time_payment_run_count reset to 0"
          - "Loan.days_past_due recomputed"
          - "Loan.loan_status advances REPAYMENT -> DELINQUENT"

      - from: PAID_ON_TIME
        to: REVERSED
        trigger: "POST /private-student-loans/payments/{id}/reverse"
        actor: Servicer
        preconditions:
          - "payment_status is PAID_ON_TIME, PAID_LATE or MISSED"
          - "an InterestAccrualEntry with source_event PAYMENT_REVERSAL may be booked in the same call"
        side_effects:
          - "Payment.payment_status set to REVERSED and is_qualifying set to false"
          - "Borrower.on_time_payment_run_count recomputed to exclude the reversed payment"
          - "Loan.current_balance_cents increased by amount_cents"
        note: "Compensating action: the lifetime_on_time_payment_count is deliberately NOT decremented — it is a conserved quantity."

  # ---------------------------------------------------------------------------
  # Cosigner — branch + re-underwrite cycle
  # ---------------------------------------------------------------------------
  - entity: Cosigner
    initial_state: INVITED
    terminal_states: [RELEASED]
    transitions:
      - from: INVITED
        to: UNDER_REVIEW
        trigger: "POST /private-student-loans/cosigners/{id}/reunderwrite (first underwriting pass) or system event when the cosigner consents"
        actor: Cosigner
        preconditions:
          - "the acting Cosigner is this record"
          - "borrower_id resolves"
        side_effects:
          - "credit_score and dti_ratio refreshed from the submitted values"
          - "no loan-side effect until the cosigner is ELIGIBLE"

      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "system event on combined underwriting completion"
        actor: system
        preconditions:
          - "credit_score >= policy.cosigner_release_min_credit_score - 60"
          - "dti_ratio <= policy.cosigner_release_max_dti_ratio"
        side_effects:
          - "LoanApplication.combined_credit_score recomputed by the provisional variant of combined_credit_underwriting"

      - from: UNDER_REVIEW
        to: INELIGIBLE
        trigger: "system event on combined underwriting completion"
        actor: system
        preconditions:
          - "credit_score < policy.cosigner_release_min_credit_score - 60 or dti_ratio > policy.cosigner_release_max_dti_ratio"
        side_effects:
          - "LoanApplication.decision_path remains COSIGNER_PRIMARY but the cosigner is excluded from the final combined score"

      - from: INELIGIBLE
        to: UNDER_REVIEW
        trigger: "POST /private-student-loans/cosigners/{id}/reunderwrite"
        actor: Cosigner
        preconditions:
          - "underwriting_status == INELIGIBLE"
          - "the acting Cosigner is this record"
        side_effects:
          - "credit_score and dti_ratio refreshed from the submitted values"
        note: "Cycle: an ineligible cosigner may re-present after fresh figures."

      - from: ELIGIBLE
        to: RELEASED
        trigger: "system event when a CosignerReleaseApplication is APPROVED"
        actor: system
        preconditions:
          - "the approving release application references this cosigner"
        side_effects:
          - "Loan.cosigner_id cleared to null on every loan carrying this cosigner"
          - "Loan.principal_cents unchanged"
          - "any remaining CosignerReleaseApplication child is left WITHDRAWN"

  # ---------------------------------------------------------------------------
  # ForbearanceDeferment — branch
  # ---------------------------------------------------------------------------
  - entity: ForbearanceDeferment
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /private-student-loans/loans/{id}/forbearances"
        actor: Servicer
        preconditions:
          - "months_requested >= 1"
          - "cumulative_deferment_months + months_requested <= the applicable product cap"
          - "the loan's current loan_status permits relief (IN_SCHOOL, GRACE, REPAYMENT or FORBEARANCE_DEFERMENT)"
        side_effects:
          - "months_granted = min(months_requested, cap - cumulative_deferment_months)"
          - "Loan.cumulative_deferment_months increased by months_granted"
          - "Loan.loan_status set to FORBEARANCE_DEFERMENT"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /private-student-loans/loans/{id}/forbearances with a relief_type the private product does not offer"
        actor: Servicer
        preconditions:
          - "relief_type is not one of the four declared private-loan relief types"
        side_effects:
          - "no change to Loan.cumulative_deferment_months"

      - from: GRANTED
        to: CANCELLED
        trigger: "POST /private-student-loans/loans/{id}/forbearances/{fid}/cancel"
        actor: Servicer
        preconditions:
          - "relief_status == GRANTED"
          - "start_date is not in the past relative to the logical clock"
        side_effects:
          - "Loan.cumulative_deferment_months reduced by months_granted"
          - "Loan.loan_status restored to the pre-relief state"

  # ---------------------------------------------------------------------------
  # CosignerReleaseApplication — branch + reapply cycle
  # ---------------------------------------------------------------------------
  - entity: CosignerReleaseApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system event on POST /private-student-loans/loans/{id}/cosigner-release-applications"
        actor: system
        preconditions:
          - "Loan.cosigner_id is non-null and the named Cosigner.underwriting_status is ELIGIBLE"
          - "payments_at_application >= policy.cosigner_release_min_on_time_payments"
        side_effects:
          - "run_at_submission frozen from Borrower.on_time_payment_run_count"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /private-student-loans/cosigner-release-applications/{id}/decision with decision=APPROVE"
        actor: Underwriter
        preconditions:
          - "run_at_submission >= policy.cosigner_release_min_on_time_payments"
          - "independent_credit_score >= policy.cosigner_release_min_credit_score"
          - "independent_dti_ratio <= policy.cosigner_release_max_dti_ratio"
          - "Loan.loan_status is not DELINQUENT or DEFAULT"
        side_effects:
          - "Cosigner.underwriting_status set to RELEASED"
          - "Loan.cosigner_id cleared to null"
          - "Loan.version incremented"

      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /private-student-loans/cosigner-release-applications/{id}/decision with decision=DECLINE"
        actor: Underwriter
        preconditions:
          - "any APPROVE precondition fails"
        side_effects:
          - "deficiency_reason set to the first failing gate in the order INSUFFICIENT_PAYMENTS, CREDIT_SCORE, DTI, RELEASE_SCORE, DELINQUENT_LOAN"

      - from: DECLINED
        to: SUBMITTED
        trigger: "POST /private-student-loans/cosigner-release-applications/{id}/reapply"
        actor: Borrower
        preconditions:
          - "release_status == DECLINED"
          - "the acting Borrower owns the loan"
        side_effects:
          - "payments_at_application refreshed from the live Borrower counter"
          - "deficiency_reason cleared to null"
        note: "Cycle: a declined release may be re-presented after the payment run rebuilds."

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /private-student-loans/cosigner-release-applications/{id}/withdraw"
        actor: Borrower
        preconditions:
          - "release_status is SUBMITTED or UNDER_REVIEW"
        side_effects:
          - "Loan.cosigner_id unchanged"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /private-student-loans/loans/{id}/repayment-plans"
    occ_field: "expected_loan_version"
    description: |
      Submitting a RepaymentPlan against a Loan whose version has advanced
      since the client last observed it is rejected in OCC terms: the submitted
      expected_loan_version no longer equals Loan.version. This captures the
      case where another writer has just created a plan — which legitimately
      supersedes the prior ACTIVE plan when approved — so the current writer's
      view of the loan is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: disbursement-schedule-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /private-student-loans/loans/{id}/disbursements"
    occ_field: "expected_loan_version"
    description: |
      Scheduling a Disbursement against a Loan whose version has advanced since
      the client last observed it is rejected in OCC terms: the submitted
      expected_loan_version no longer equals Loan.version. This captures the
      case where a school refund or a release has just moved the loan's
      disbursement ledger — which legitimately changes the remaining
      certification headroom — so the current writer is working from a stale
      capitalization of that headroom.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: combined_credit_underwriting
    trigger: "LoanApplication enters UNDER_REVIEW (provisional), and again on POST /private-student-loans/loan-applications/{id}/decision (final)"
    algorithm: weighted_scoring
    input_set: "Included: the applying Borrower's credit_score and dti_ratio; plus the Cosigner's credit_score and dti_ratio when cosigner_id is non-null and the Cosigner's underwriting_status is ELIGIBLE. Excluded: any Cosigner in INVITED, INELIGIBLE or RELEASED status — a RELEASED cosigner contributes nothing even though the loan once carried them."
    formula: |
      # inputs
      b_score = Borrower.credit_score
      c_score = Cosigner.credit_score            # 0 when no cosigner is included
      has_cosigner = (LoanApplication.cosigner_id is non-null AND Cosigner.underwriting_status == ELIGIBLE)

      # provisional variant (pricing quoted the moment the file opens)
      provisional = max(b_score, c_score)        when has_cosigner
      provisional = b_score                      otherwise

      # final variant (decision-time re-price)
      final = round_half_up(0.55 * c_score + 0.45 * b_score)   when has_cosigner
      final = b_score - 25                       otherwise       # standalone penalty

      combined_credit_score = provisional | final   # selected by variant
      tier = A  when combined_credit_score >= 750
             B  when combined_credit_score >= 700
             C  when combined_credit_score >= 650
             D  when combined_credit_score >= 600
             DECLINED otherwise
      margin_rate_pct = A->2.75 | B->3.75 | C->5.50 | D->7.25 | DECLINED->null
    constants:
      COSIGNER_WEIGHT: 0.55
      BORROWER_WEIGHT: 0.45
      STANDALONE_PENALTY: 25
      TIER_A_MIN: 750
      TIER_B_MIN: 700
      TIER_C_MIN: 650
      TIER_D_MIN: 600
      MARGIN_A_PCT: 2.75
      MARGIN_B_PCT: 3.75
      MARGIN_C_PCT: 5.50
      MARGIN_D_PCT: 7.25
    precision: "combined_credit_score to 0 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "application is created and immediately advanced SUBMITTED -> UNDER_REVIEW"
        difference: "takes the better of the two scores (max), so a strong cosigner prices the file at the cosigner's own tier"
      - name: final
        when: "POST /private-student-loans/loan-applications/{id}/decision"
        difference: "blends 55% cosigner / 45% borrower, so a strong cosigner is diluted by a weak borrower and the tier can move DOWN; with no eligible cosigner it applies the 25-point standalone penalty"

  - name: in_school_interest_accrual_dual
    trigger: "recomputation of Loan.unpaid_interest_cents at reported accrual events and at POST /private-student-loans/loans/{id}/deferment-projection"
    algorithm: forward_looking
    input_set: "Included: the loan's principal_cents, effective_rate_pct and the accrual window in months. Excluded: any window month already covered by an InterestAccrualEntry in CAPITALIZED status — capitalization zeroes the un-capitalized balance and restarts the window."
    formula: |
      P = Loan.principal_cents
      annual_rate = Loan.effective_rate_pct / 100
      monthly_rate = annual_rate / 12
      W = window_months

      # variant `accrued_per_period` — used for the booked ledger
      accrued_per_period = SUM over m in 1..W of round_half_up(P * monthly_rate)

      # variant `accrued_consolidated` — used for the deferment projection
      accrued_consolidated = round_half_up(P * annual_rate * W / 12)

      unpaid_interest_cents = accrued_per_period | accrued_consolidated   # selected by variant
    constants:
      MONTHS_PER_YEAR: 12
    precision: "each variant rounds to 0 decimal places (whole cents), round_half_up; the per-period variant rounds W times, the consolidated variant rounds exactly once"
    variants:
      - name: accrued_per_period
        when: "POST /private-student-loans/loans/{id}/accrual-entries and the GET /private-student-loans/loans/{id} read of unpaid_interest_cents"
        difference: "rounds each month independently and sums, so the rounding remainder accumulates across the window"
      - name: accrued_consolidated
        when: "the in-school relief projection returned by POST /private-student-loans/loans/{id}/deferment-projection"
        difference: "rounds once over the whole window, so it is never equal to the per-period variant when P * monthly_rate has a fractional part"

  - name: capitalized_interest_cap
    trigger: "POST /private-student-loans/loans/{id}/enter-repayment"
    algorithm: threshold
    input_set: "Included: Loan.unpaid_interest_cents as of the transition and Loan.disbursed_amount_cents over RELEASED Disbursement children net of REFUNDED remainder credits. Excluded: any interest already booked in an InterestAccrualEntry with entry_status CAPITALIZED."
    formula: |
      uncapped = Loan.unpaid_interest_cents
      cap = round_half_up(Loan.disbursed_amount_cents * 0.10)
      capitalized = min(uncapped, cap)
      # exact-boundary rule: capitalized == cap when uncapped == cap (>= is inclusive)
      Loan.principal_cents += capitalized
      Loan.lifetime_capitalized_interest_cents += capitalized
      Loan.unpaid_interest_cents -= capitalized
      Loan.current_balance_cents = Loan.principal_cents + Loan.unpaid_interest_cents
    constants:
      CAP_FRACTION_OF_DISBURSED: 0.10
    precision: "2 decimal places for the cap fraction product, rounded half up to whole cents; the min() is taken on cent integers"
    variants:
      - name: capped
        when: "uncapped > cap"
        difference: "the excess interest is NOT capitalized; it stays in unpaid_interest_cents and continues to accrue"
      - name: uncapped_fits
        when: "uncapped <= cap"
        difference: "the whole unpaid balance is capitalized and unpaid_interest_cents resets to 0"

  - name: certification_limit_waterfall
    trigger: "POST /private-student-loans/school-certifications/{id}/certify and POST /private-student-loans/loans/{id}/disbursements"
    algorithm: waterfall_allocation
    input_set: "Included: the SchoolCertification children of the application in CERTIFIED or PARTIAL_CERTIFIED status, in ascending certified_date order then ascending created_at. Excluded: children in REJECTED or EXPIRED status."
    formula: |
      # EVALUATION ORDER IS PINNED — the capacity check and the certified total
      # are mutually referential, so the order below is the only well-defined one.
      # step 1: the application ceiling, independent of any child
      certified_limit_cents = max(0, LoanApplication.cost_of_attendance_cents - LoanApplication.other_aid_cents)

      # step 2: walk the included children in ascending certified_date, created_at order,
      #         allocating each child's certified_amount_cents against the remaining ceiling
      remaining = certified_limit_cents
      for child in included_children_ordered:
          child.certified_amount_cents = min(child.certified_amount_cents, remaining)
          remaining -= child.certified_amount_cents

      # step 3: the loan-level total is the post-allocation sum
      Loan.certified_amount_cents = SUM(child.certified_amount_cents for child in included_children_ordered)

      # step 4: headroom, used by every release
      headroom = max(0, Loan.certified_amount_cents - Loan.disbursed_amount_cents)

      # step 5: a release may not exceed headroom
      release_amount_cents = min(requested_amount_cents, headroom)
    constants:
      ORDER_KEY_PRIMARY: certified_date
      ORDER_KEY_SECONDARY: created_at
    precision: "whole cents; no rounding applied — every step is integer min/subtraction"
    variants:
      - name: ceiling_binds
        when: "the sum of requested certifications exceeds certified_limit_cents"
        difference: "the LAST child in (certified_date, created_at) order absorbs the shortfall and is recorded PARTIAL_CERTIFIED, so two certifications of the same nominal amount can land differently"
      - name: ceiling_slack
        when: "the sum of requested certifications is at or below certified_limit_cents"
        difference: "every child keeps its full requested amount and headroom equals certified_limit_cents minus disbursed_amount_cents"

  - name: monthly_payment_amortization
    trigger: "POST /private-student-loans/loans/{id}/repayment-plans and POST /private-student-loans/repayment-plans/{id}/approve"
    algorithm: constraint_propagation
    input_set: "Included: the plan's own principal_snapshot_cents and rate_snapshot_pct, both frozen at submission, and term_months. Excluded: the live Loan.principal_cents and Loan.effective_rate_pct — the snapshot never re-reads the loan after submission."
    formula: |
      P = RepaymentPlan.principal_snapshot_cents
      r = RepaymentPlan.rate_snapshot_pct / 100 / 12
      n = RepaymentPlan.term_months
      monthly_payment_cents = round_half_up(P * r / (1 - (1 + r) ** (-n)))
      # evaluation order: rate_snapshot_pct is read FIRST from the loan's
      # effective_rate_pct as of submission; only then is the annuity solved.
      # An automatic-debit change after submission moves the loan's live rate
      # but MUST NOT move this plan's payment.
    constants:
      MIN_MONTHLY_PAYMENT_CENTS: 5000
    precision: "2 decimal places inside the annuity, rounded half up to whole cents at the end"
    variants:
      - name: standard_shape
        when: "plan_type is STANDARD, INCOME_BASED or GRADUATED"
        difference: "term_months is used exactly as requested"
      - name: extended_capped
        when: "plan_type is EXTENDED"
        difference: "term_months above LoanPolicy.extended_term_months is rejected outright rather than silently clamped"

  - name: delinquency_aging_projection
    trigger: "every Payment write, POST /private-student-loans/loans/{id}/cure and GET /private-student-loans/loans/{id}"
    algorithm: forward_looking
    input_set: "Included: every Payment child of the loan whose payment_status is MISSED or PAID_LATE, plus the loan's scheduled period due dates. Excluded: payments in PAID_ON_TIME or REVERSED status — they never contribute arrears."
    formula: |
      now = logical clock
      # variant `as_of_clock` — what the servicer sees today
      oldest_open_due = MIN(Payment.scheduled_due_date) over payments with
                         payment_status IN {MISSED, PAID_LATE}
      days_past_due = whole_days(oldest_open_due -> now)   when such a payment exists
      days_past_due = 0                                    otherwise

      # variant `at_period_close` — what the period-close batch books
      days_past_due = whole_days(oldest_open_due -> now) - 5   when the gap exceeds 5 days
      days_past_due = 0                                        otherwise

      delinquency_stage = CURRENT          when days_past_due == 0
                          LATE             when days_past_due <= 29
                          DELINQUENT       when days_past_due <= 119
                          DEFAULT_ELIGIBLE otherwise
    constants:
      PERIOD_CLOSE_LAG_DAYS: 5
      LATE_MAX_DAYS: 29
      DELINQUENT_MAX_DAYS: 119
      DEFAULT_MIN_DAYS: 120
    precision: "whole days, floor; no fractional days are carried"
    variants:
      - name: as_of_clock
        when: "the live GET /private-student-loans/loans/{id} read and any Payment write"
        difference: "counts every elapsed day, so a period 3 days past due already reports days_past_due 3 and stage LATE"
      - name: at_period_close
        when: "the period-close booking surfaced as period_close_days_past_due by GET /private-student-loans/loans/{id}/summary"
        difference: "subtracts the 5-day grace lag first, so the same 6-day gap reports period_close_days_past_due 1 while the live as_of_clock read reports days_past_due 6"

  - name: cosigner_release_eligibility_score
    trigger: "POST /private-student-loans/cosigner-release-applications/{id}/decision"
    algorithm: weighted_scoring
    input_set: "Included: the release application's frozen run_at_submission, its required_min_payments, and the submitted independent_credit_score and independent_dti_ratio. Excluded: the live Borrower.on_time_payment_run_count — the decision reads the snapshot only."
    formula: |
      credit_component = min(300, max(0, independent_credit_score - 550))
      dti_component    = min(250, max(0, round_half_up((0.60 - independent_dti_ratio) * 1000)))
      run_component    = min(200, max(0, round_half_up(200 * run_at_submission / required_min_payments)))
      release_score    = credit_component + dti_component + run_component
      approved iff release_score >= 500
    constants:
      CREDIT_CAP: 300
      CREDIT_FLOOR_SCORE: 550
      DTI_CAP: 250
      DTI_INTERCEPT: 0.60
      DTI_SCALE: 1000
      RUN_CAP: 200
      RUN_WEIGHT: 200
      RELEASE_SCORE_MIN: 500
    precision: "each component rounded half up to an integer before summing; the sum is compared as an integer"
    variants:
      - name: run_capped
        when: "run_at_submission exceeds required_min_payments"
        difference: "run_component is pinned at 200, so an over-long run cannot compensate for a weak credit or DTI component"
      - name: run_prorated
        when: "run_at_submission is below required_min_payments"
        difference: "run_component scales linearly and the file is already rejected at the INSUFFICIENT_PAYMENTS gate before the score is even consulted"

  - name: autodebit_waiver_benefit
    trigger: "POST /private-student-loans/loans/{id}/autodebit and every accrual recomputation"
    algorithm: threshold
    input_set: "Included: Borrower.lifetime_on_time_payment_count and Loan.autodebit_enrolled. Excluded: Borrower.on_time_payment_run_count — a run broken by one late payment does not revoke an earned rate reduction."
    formula: |
      reduction_applies = Loan.autodebit_enrolled AND
                          Borrower.lifetime_on_time_payment_count >= 24

      Loan.effective_rate_pct = LoanApplication.margin_rate_pct
                                - (0.25 when reduction_applies else 0.0)

      # the conservative bound the loan exposes for disclosure
      max_autodebit_waiver_benefit_cents =
          round_half_up(Loan.current_balance_cents
                        * (0.25 / 100)
                        * (in_school_months_elapsed_with_immediate_accrual / 12))
    constants:
      AUTODEBIT_MIN_PAYMENTS: 24
      AUTODEBIT_RATE_REDUCTION_PCT: 0.25
    precision: "effective_rate_pct to 4 decimal places, round_half_up; the waiver benefit bound to whole cents"
    variants:
      - name: threshold_met
        when: "lifetime_on_time_payment_count >= 24 and autodebit_enrolled is true"
        difference: "effective_rate_pct is margin minus 0.25; 24 payments qualifies, 23 does not"
      - name: threshold_missed
        when: "lifetime_on_time_payment_count <= 23 or autodebit_enrolled is false"
        difference: "effective_rate_pct equals margin_rate_pct exactly; a later DEFAULT also reverts a previously granted reduction"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  # --- priority 1-2: auth / authz -------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.5 roles AND, for every operation whose §1.5 description pins an owner, the acting X-User-ID equals the owning entity's id as declared by that role's §1.7 identity"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all; ownership-checked on POST /private-student-loans/loan-applications/{id}/cancel, /reconsider, POST /private-student-loans/cosigner-release-applications/{id}/reapply, /withdraw, POST /private-student-loans/cosigners/{id}/reunderwrite"

  # --- priority 3: existence -------------------------------------------------
  - priority: 3
    category: existence
    check: "Borrower referenced in path or body exists"
    error_id: ERR_BORROWER_NOT_FOUND
    http_status: 404
    applies_to: "POST /private-student-loans/loan-applications, POST /private-student-loans/borrowers/{id}/cosigners, GET /private-student-loans/borrowers/{id}"

  - priority: 4
    category: existence
    check: "Cosigner referenced in path or body exists, and is not already in RELEASED status"
    error_id: ERR_COSIGNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /private-student-loans/loan-applications, POST /private-student-loans/loans/{id}/cosigner-release-applications, GET /private-student-loans/cosigners/{id}"

  - priority: 5
    category: existence
    check: "School referenced in path or body exists"
    error_id: ERR_SCHOOL_NOT_FOUND
    http_status: 404
    applies_to: "POST /private-student-loans/loan-applications, POST /private-student-loans/loan-applications/{id}/school-certifications, GET /private-student-loans/schools/{id}"

  - priority: 6
    category: existence
    check: "LoanPolicy referenced in path or body exists"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "POST /private-student-loans/loan-applications, GET /private-student-loans/loan-policies/{id}"

  - priority: 7
    category: existence
    check: "LoanApplication referenced in path exists"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /private-student-loans/loan-applications/{id}/decision, /reconsider, /cancel, /school-certifications"

  - priority: 8
    category: existence
    check: "Loan referenced in path exists"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /private-student-loans/loans/{id}/enrollment-status, /enter-repayment, /autodebit, /cure, /declare-default, /rehabilitate, /deferment-projection, /accrual-entries, /forbearances, /payments, /payment-schedule, /repayment-plans, /disbursements, /cosigner-release-applications, GET /private-student-loans/loans/{id}"

  - priority: 9
    category: existence
    check: "SchoolCertification referenced in path exists"
    error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /private-student-loans/school-certifications/{id}/certify, /reject, /refile, GET /private-student-loans/school-certifications/{id}"

  - priority: 10
    category: existence
    check: "the addressed loan-child resource (RepaymentPlan, Payment, Disbursement or CosignerReleaseApplication) exists and belongs to the Loan named in the path"
    error_id: ERR_LOAN_CHILD_NOT_FOUND
    http_status: 404
    applies_to: "POST /private-student-loans/repayment-plans/{id}/approve, /decline, POST /private-student-loans/payments/{id}/reverse, DELETE /private-student-loans/disbursements/{id}, POST /private-student-loans/disbursements/{id}/release, /reschedule, /school-refund, POST /private-student-loans/loans/{id}/forbearances/{fid}/cancel, POST /private-student-loans/cosigner-release-applications/{id}/decision, /reapply, /withdraw"

  # --- priority 11-12: request shape ----------------------------------------
  - priority: 11
    category: business_constraint
    check: "every required body field is present and every enum-valued field carries a declared enum member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 12
    category: business_temporal
    check: "to_iso8601 is a well-formed ISO 8601 UTC instant not earlier than the server's fixed start-of-time default"
    error_id: ERR_INVALID_CLOCK
    http_status: 400
    applies_to: "POST /private-student-loans/_clock/set_current_utc"

  # --- priority 13-14: state preconditions ----------------------------------
  - priority: 13
    category: state
    check: "the target resource is in a state from which this operation is a declared transition in §1.2; a resource already in a terminal_states member can accept no transition at all"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (…/decision, /reconsider, /cancel, /certify, /reject, /refile, /release, /reschedule, /school-refund, /approve, /decline, /reverse, /enter-repayment, /enrollment-status, /cure, /declare-default, /rehabilitate, /withdraw, /reapply)"

  - priority: 14
    category: state
    check: "when the request carries expected_<parent>_version, it equals the parent's current version field"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /private-student-loans/loans/{id}/repayment-plans, POST /private-student-loans/loans/{id}/disbursements"

  # --- priority 15-17: business_safety / compliance -------------------------
  - priority: 15
    category: business_safety
    check: "a disbursement may not be created or released while Loan.disburse_blocked is true — i.e. while any Disbursement child carries refund_status REFUND_DUE, or Loan.loan_status is DEFAULT or FORBEARANCE_DEFERMENT"
    error_id: ERR_DISBURSEMENT_BLOCKED
    http_status: 409
    applies_to: "POST /private-student-loans/loans/{id}/disbursements, POST /private-student-loans/disbursements/{id}/release"

  - priority: 16
    category: business_safety
    check: "a cosigner-release approval may not be granted while Loan.notice_obligation_status is PENDING; the notification obligation must first be recorded as SATISFIED"
    error_id: ERR_NOTICE_OBLIGATION_PENDING
    http_status: 409
    applies_to: "POST /private-student-loans/cosigner-release-applications/{id}/decision"

  - priority: 17
    category: business_safety
    check: "the disbursement's academic period window [period_start_date, period_end_date] must not overlap an existing non-CANCELLED Disbursement child of the same Loan; adjacency with zero gap is treated as an overlap and rejected"
    error_id: ERR_DISBURSEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /private-student-loans/loans/{id}/disbursements"

  # --- priority 18-20: business_constraint ----------------------------------
  - priority: 18
    category: business_constraint
    check: "the certification's own certified_amount_cents may not exceed the application's certified_limit_cents; this is a STANDALONE check only — a certification that fits on its own but overflows the running certified total is NOT an error, it is recorded PARTIAL_CERTIFIED by the certification_limit_waterfall step 2 which runs after this validation"
    error_id: ERR_CERTIFICATION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /private-student-loans/school-certifications/{id}/certify"

  - priority: 19
    category: business_constraint
    check: "the sum of certified_amount_cents across all of a School's CERTIFIED and PARTIAL_CERTIFIED certifications sharing an academic_period_label may not exceed School.certification_capacity_per_period_cents"
    error_id: ERR_SCHOOL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /private-student-loans/school-certifications/{id}/certify"

  - priority: 20
    category: business_constraint
    check: "an application may hold at most one CERTIFIED or PARTIAL_CERTIFIED certification per academic_period_label; a second certification for the same label is rejected rather than silently summed, because the certified_amount_cents aggregate would otherwise double-count a single period"
    error_id: ERR_CERTIFICATION_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /private-student-loans/school-certifications/{id}/certify"

  - priority: 21
    category: business_constraint
    check: "a ForbearanceDeferment's window [start_date, start_date + months_granted months] may not overlap an existing GRANTED relief on the same Loan; a request beginning exactly on another grant's end boundary is treated as an overlap"
    error_id: ERR_FORBEARANCE_OVERLAP
    http_status: 409
    applies_to: "POST /private-student-loans/loans/{id}/forbearances"

  # --- priority 22-24: business_referential ---------------------------------
  - priority: 22
    category: business_referential
    check: "entering repayment requires at least one RepaymentPlan child in ACTIVE status on the loan"
    error_id: ERR_PLAN_REQUIRED
    http_status: 409
    applies_to: "POST /private-student-loans/loans/{id}/enter-repayment"

  - priority: 23
    category: business_referential
    check: "a cosigner-backing relationship must exist on the loan: Loan.cosigner_id is non-null and the referenced Cosigner.underwriting_status is ELIGIBLE"
    error_id: ERR_COSIGNER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /private-student-loans/loans/{id}/cosigner-release-applications, POST /private-student-loans/cosigners/{id}/reunderwrite"

  - priority: 24
    category: business_referential
    check: "an application that names no cosigner_id may only be underwritten when the policy permits a standalone file; LoanPolicy for the requested program_level requires a cosigner"
    error_id: ERR_COSIGNER_REQUIRED
    http_status: 422
    applies_to: "POST /private-student-loans/loan-applications/{id}/decision"

  # --- priority 25-30: business_fiscal (fiscal checks last) -----------------
  - priority: 25
    category: business_fiscal
    check: "the credit decision fails: under the FINAL variant of combined_credit_underwriting the resulting tier is DECLINED"
    error_id: ERR_CREDIT_DECLINED
    http_status: 422
    applies_to: "POST /private-student-loans/loan-applications/{id}/decision"

  - priority: 26
    category: business_fiscal
    check: "a money amount falls outside its declared range — approved_amount_cents below 100000, monthly_payment_cents below 5000, remainder_credited_cents above the disbursement's amount_cents, or rehabilitation_amount_cents below three monthly payments"
    error_id: ERR_AMOUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /private-student-loans/loan-applications/{id}/decision, POST /private-student-loans/repayment-plans/{id}/approve, POST /private-student-loans/disbursements/{id}/school-refund, POST /private-student-loans/loans/{id}/rehabilitate"

  - priority: 27
    category: business_fiscal
    check: "a release's amount_cents may not exceed the loan's certification headroom, computed as Loan.certified_amount_cents minus Loan.disbursed_amount_cents"
    error_id: ERR_DISBURSEMENT_OVER_CERTIFIED
    http_status: 422
    applies_to: "POST /private-student-loans/disbursements/{id}/release"

  - priority: 28
    category: business_fiscal
    check: "the relief request would push cumulative_deferment_months above the applicable product cap — policy.in_school_max_deferment_months while the loan is IN_SCHOOL or GRACE, policy.repayment_max_deferment_months while it is REPAYMENT"
    error_id: ERR_DEFERMENT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /private-student-loans/loans/{id}/forbearances"

  - priority: 29
    category: business_fiscal
    check: "the requested plan or relief shape is not offered by the private product — relief_type outside the four declared private-loan relief types, or an EXTENDED plan whose term_months exceeds policy.extended_term_months"
    error_id: ERR_PRODUCT_RULE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /private-student-loans/loans/{id}/forbearances, POST /private-student-loans/loans/{id}/repayment-plans"

  - priority: 30
    category: business_fiscal
    check: "the release application's frozen run_at_submission is below its required_min_payments"
    error_id: ERR_RELEASE_RUN_INSUFFICIENT
    http_status: 422
    applies_to: "POST /private-student-loans/loans/{id}/cosigner-release-applications, POST /private-student-loans/cosigner-release-applications/{id}/decision"

  - priority: 31
    category: business_fiscal
    check: "the independent re-underwriting fails: cosigner_release_eligibility_score below 500, or independent_credit_score below policy.cosigner_release_min_credit_score, or independent_dti_ratio above policy.cosigner_release_max_dti_ratio"
    error_id: ERR_RELEASE_UNDERWRITING_FAILED
    http_status: 422
    applies_to: "POST /private-student-loans/cosigner-release-applications/{id}/decision"

  - priority: 32
    category: business_fiscal
    check: "declaring default requires Loan.days_past_due >= 120 under the as_of_clock variant of delinquency_aging_projection"
    error_id: ERR_DEFAULT_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /private-student-loans/loans/{id}/declare-default"

  - priority: 33
    category: business_constraint
    check: "the loan is in DELINQUENT or DEFAULT and therefore cannot accept a cosigner-release approval, a new disbursement schedule or an automatic-debit enrolment"
    error_id: ERR_LOAN_DELINQUENT
    http_status: 422
    applies_to: "POST /private-student-loans/cosigner-release-applications/{id}/decision, POST /private-student-loans/loans/{id}/autodebit"

