            - "HOP 2 arithmetic: base_urgency == 61.66 (120 * 0.5055 = 60.66 plus 0.5 * 2 days = 1.0), escalation_tier_bonus_pct == 25, total_urgency == 77.08, priority_band == 'CRITICAL', retrain_required == true"
            - "HOP 2: RetrainingTrigger.stale_after == '2026-11-01T00:00:00Z' (clock 2026-08-03 + 90 days) and Model.${m_id}.open_retraining_trigger_count == 1"
