              as: Veterinarian
              captures: { hold_id: $.data.id, hold_status: $.data.status }
          assert:
            - "frozen == true"
            - "fstatus == FROZEN"
            - "err == ERR_RECORDS_FROZEN"
            - "the frozen write returns HTTP 409"
            - "read_status == IN_CUSTODY"
