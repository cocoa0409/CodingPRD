              captures: { cs_base: $.data.base_cost_cents, cs_otc: $.data.overtime_cost_cents, cs_total: $.data.total_cost_cents }
          assert:
            - "each officer holds 60 planned minutes, so per officer o_regular = 45 and o_overtime = 15: ${r_reg} == 90 and ${r_ot} == 30"
            - "${r_base} == 9090 == 45 x 101 + 45 x 101 (integers, no rounding involved)"
            - "${r_otc} == 4546 == round_half_up(2272.5) + round_half_up(2272.5); summing first and rounding once yields 4545 and is WRONG"
