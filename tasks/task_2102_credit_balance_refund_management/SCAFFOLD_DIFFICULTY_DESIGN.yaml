  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: refund_batch_half_open_window_allows_adjacency_rejects_intersection
        grounds:
          - validations[priority=27]
          - errors[ERR_BATCH_WINDOW_OVERLAP]
          - entities.RefundBatch.fields.cutoff_at
          - entities.RefundBatch.fields.scheduled_run_at
          - entities.RefundBatch.fields.bank_account_code
        distinguishing_aspect: |
          Interval semantics A on the RefundBatch resource: windows are HALF-OPEN
          [cutoff_at, scheduled_run_at) with a zero buffer, so a batch starting
          exactly when another ends is accepted, while a one-day intersection is
          rejected — and the whole rule is scoped per bank_account_code, so the same
          intersecting window on the TRUST channel is accepted.
        test_recipe:
          setup:
            - "One OPEN RefundBatch B-W1 on the OPERATING channel occupying [2026-08-18T00:00:00Z, 2026-08-20T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /refund-batches"
              payload: { batch_number: "B-W1", bank_account_code: "OPERATING", cutoff_at: "2026-08-18T00:00:00Z", scheduled_run_at: "2026-08-20T00:00:00Z" }
              as: DisbursementOfficer
              as_user_id: "disb-1"
              captures: { batch_w1_id: "$.data.id" }
          trigger:
            - call: "POST /refund-batches"
              payload: { batch_number: "B-W2", bank_account_code: "OPERATING", cutoff_at: "2026-08-20T00:00:00Z", scheduled_run_at: "2026-08-22T00:00:00Z" }
              as: DisbursementOfficer
              as_user_id: "disb-1"
              captures: { batch_w2_id: "$.data.id" }
            - call: "POST /refund-batches"
              payload: { batch_number: "B-W3", bank_account_code: "OPERATING", cutoff_at: "2026-08-19T00:00:00Z", scheduled_run_at: "2026-08-21T00:00:00Z" }
              as: DisbursementOfficer
              as_user_id: "disb-1"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /refund-batches"
              payload: { batch_number: "B-W4", bank_account_code: "TRUST", cutoff_at: "2026-08-19T00:00:00Z", scheduled_run_at: "2026-08-21T00:00:00Z" }
              as: DisbursementOfficer
              as_user_id: "disb-1"
              captures: { batch_w4_id: "$.data.id" }
          assert:
            - "the B-W2 create returns HTTP 201 and RefundBatch.${batch_w2_id}.state == OPEN"
            - "the B-W3 create returns HTTP 409 with data.error_id == ERR_BATCH_WINDOW_OVERLAP"
            - "the B-W4 create returns HTTP 201 and RefundBatch.${batch_w4_id}.bank_account_code == TRUST"
            - "GET /refund-batches?bank_account_code=OPERATING returns total_count == 2"

      - name: compliance_report_closed_period_requires_seven_day_buffer_between_scopes
        grounds:
          - validations[priority=28]
          - errors[ERR_REPORT_PERIOD_CONFLICT]
          - entities.ComplianceReport.fields.period_start_at
          - entities.ComplianceReport.fields.period_end_at
          - entities.ComplianceReport.fields.report_type
        distinguishing_aspect: |
          Interval semantics B on a different resource entity, ComplianceReport:
          periods are CLOSED [period_start_at, period_end_at] and carry a mandatory
          7-day buffer, so a next period starting 1 day after the prior end is
          rejected while one starting exactly 7 days after is accepted — the exact
          opposite adjacency treatment from the RefundBatch rule.
        test_recipe:
          setup:
            - "One DRAFT CREDIT_BALANCE_LIABILITY report R-1 with scope_code ALL covering the closed period [2026-07-01T00:00:00Z, 2026-07-31T00:00:00Z] valued as_of 2026-08-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /compliance-reports"
              payload: { report_type: "CREDIT_BALANCE_LIABILITY", scope_code: "ALL", period_start_at: "2026-07-01T00:00:00Z", period_end_at: "2026-07-31T00:00:00Z", as_of_at: "2026-08-16T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { rpt_r1_id: "$.data.id" }
          trigger:
            - call: "POST /compliance-reports"
              payload: { report_type: "CREDIT_BALANCE_LIABILITY", scope_code: "ALL", period_start_at: "2026-08-01T00:00:00Z", period_end_at: "2026-08-06T00:00:00Z", as_of_at: "2026-08-16T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /compliance-reports"
              payload: { report_type: "CREDIT_BALANCE_LIABILITY", scope_code: "ALL", period_start_at: "2026-08-07T00:00:00Z", period_end_at: "2026-08-14T00:00:00Z", as_of_at: "2026-08-16T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { rpt_r3_id: "$.data.id" }
            - call: "POST /compliance-reports"
              payload: { report_type: "MEDICARE_CBR", scope_code: "ALL", period_start_at: "2026-08-01T00:00:00Z", period_end_at: "2026-08-06T00:00:00Z", as_of_at: "2026-08-16T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { rpt_r4_id: "$.data.id" }
          assert:
            - "the 2026-08-01 CREDIT_BALANCE_LIABILITY create returns HTTP 409 with data.error_id == ERR_REPORT_PERIOD_CONFLICT"
            - "the 2026-08-07 CREDIT_BALANCE_LIABILITY create returns HTTP 201 and ComplianceReport.${rpt_r3_id}.state == DRAFT"
            - "the MEDICARE_CBR create returns HTTP 201 and ComplianceReport.${rpt_r4_id}.report_type == MEDICARE_CBR"
            - "GET /compliance-reports?report_type=CREDIT_BALANCE_LIABILITY returns total_count == 2"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_credit_liability_conserved_across_check_issue_and_void
        grounds:
          - entities.PatientAccount.fields.credit_balance_cents
          - state_machines.CreditBalance.REFUND_PENDING_to_REFUNDED
          - state_machines.CreditBalance.REFUNDED_to_REFUND_PENDING
          - state_machines.CheckDisbursement.ISSUED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity 1 — the open credit liability roll-up
          PatientAccount.credit_balance_cents == sum(CreditBalance.credit_amount_cents
          where status IN {IDENTIFIED, UNDER_REVIEW, ATTRIBUTED, REFUND_PENDING}).
          Issuing the check drives it 12000 -> 0 and voting the compensating void
          drives it 0 -> 12000 exactly, with zero drift in refunded_cents or
          outstanding_cents.
        test_recipe:
          setup:
