# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x >=2 instances each (18 instances total).
# All money literals were computed by executing the §1.3 formulas with the
# fixtures pinned in each instance's setup (round_half_up, integer cents).
#
# Canonical fixture (re-established per instance via setup_api_calls):
#   Catalog: price_lock_hours=168, requote_tolerance_pct=0.15,
#            recycle_floor_value_cents=5000.
#   DeviceModel "PHN-1" SMARTPHONE base_value_cents=60000
#     condition_multipliers {FLAWLESS:1.0, GOOD:0.8, FAIR:0.6, POOR:0.35}
#     defect_deductions {CRACKED_SCREEN:12000, BATTERY_DEGRADED:4000,
#       WATER_DAMAGE:20000, MISSING_PARTS:5000, WONT_POWER_ON:15000, DENTED_BODY:3000}
# Derived (worked by code, round_half_up):
#   GOOD,[],on            -> graded 48000
#   GOOD,[CRACKED_SCREEN],on -> graded 36000
#   FAIR,[WATER_DAMAGE],on   -> graded 16000
#   POOR,[WATER_DAMAGE],off  -> conditioned POOR 21000, ded 20000+15000=35000 -> max(0,-14000)=0
#   GOOD,[],off              -> POOR floor 21000 - WONT_POWER_ON 15000 = 6000
#   FLAWLESS,[],on           -> graded 60000; min_acceptable = 60000-rhu(60000*0.15=9000)=51000
#   FLAWLESS,[BATTERY_DEGRADED,MISSING_PARTS],on -> 60000-4000-5000 = 51000 (==min_acc -> MATCH)
#   FLAWLESS,[BATTERY_DEGRADED,MISSING_PARTS,DENTED_BODY],on -> 48000 (<51000 -> REQUOTE)
#   promo pct .10 on 36000 -> 3600; +flat 2000 -> 5600 (<=cap6000); +flat 4000 -> 7600 cap5000 -> 5000
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: graded_value_quoted_vs_inspected_diverge
        grounds:
          - calculations.graded_value
          - state_machines.TradeIn.DRAFT_to_QUOTED
          - state_machines.TradeIn.RECEIVED_to_INSPECTED
          - entities.Quote.fields.amount_cents
          - entities.Inspection.fields.inspected_value_cents
        distinguishing_aspect: |
          Same grading formula on two DIFFERENT entity domains: the self-graded INITIAL Quote
          (declared GOOD, no defects) yields amount 48000, while the verified Inspection (FAIR +
          WATER_DAMAGE) yields inspected_value 16000 on the same device — the quoted value lives on
          Quote, the verified value on Inspection, and they diverge by 32000.
        test_recipe:
          setup:
            - "Catalog + SMARTPHONE model PHN-1 (base 60000) registered."
            - "Customer trade-in declared GOOD, no defects, powers_on -> INITIAL quote amount 48000."
            - "Device received; inspector finds FAIR + WATER_DAMAGE -> inspected_value 16000."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: ["SMARTPHONE"], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "A" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: [], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/receive"
              payload: {}
              as: GradingAgent
          trigger:
            - call: "POST /trade-ins/${ti_id}/inspect"
              payload: { verified_grade: "FAIR", verified_defects: ["WATER_DAMAGE"], verified_powers_on: true }
              as: GradingAgent
          assert:
            - "GET /trade-ins/${ti_id}/quotes -> the INITIAL Quote.amount_cents == 48000"
            - "GET /trade-ins/${ti_id}/inspections -> Inspection.inspected_value_cents == 16000"
            - "Inspection.inspected_value_cents != INITIAL Quote.amount_cents"

      - name: wallet_settlement_store_credit_vs_external_diverge
        grounds:
          - calculations.wallet_settlement
          - state_machines.TradeIn.ACCEPTED_to_PAID
          - entities.Customer.fields.wallet_balance_cents
          - entities.Customer.fields.lifetime_payout_cents
        distinguishing_aspect: |
          The SAME payout amount settles two ways on the Customer domain (distinct from the
          Quote/Inspection grading domain above): STORE_CREDIT moves BOTH wallet_balance_cents and
          lifetime_payout_cents, while ACH moves ONLY lifetime_payout_cents — wallet stays unchanged.
        test_recipe:
          setup:
            - "Two FLAWLESS no-defect trade-ins for the same customer, each MATCH-accepted at final_value 60000."
            - "First paid by STORE_CREDIT, second by ACH."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "b@x.com", full_name: "B" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "FLAWLESS", declared_defects: [], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti1: $.data.id }
            - call: "POST /trade-ins/${ti1}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti1}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti1}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti1}/inspect"
              payload: { verified_grade: "FLAWLESS", verified_defects: [], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "FLAWLESS", declared_defects: [], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti2: $.data.id }
            - call: "POST /trade-ins/${ti2}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti2}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti2}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti2}/inspect"
              payload: { verified_grade: "FLAWLESS", verified_defects: [], verified_powers_on: true }
              as: GradingAgent
          trigger:
            - call: "POST /trade-ins/${ti1}/payouts"
              payload: { method: "STORE_CREDIT" }
              as: FinanceOperator
            - call: "POST /trade-ins/${ti2}/payouts"
              payload: { method: "ACH" }
              as: FinanceOperator
          assert:
            - "Customer.${cust_id}.wallet_balance_cents == 60000"
            - "Customer.${cust_id}.lifetime_payout_cents == 120000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: graded_value_three_input_nonlinear_poweroff_floor
        grounds:
          - calculations.graded_value
          - state_machines.TradeIn.DRAFT_to_QUOTED
          - entities.Quote.fields.graded_subtotal_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with NON-LINEAR interaction — grade selects a multiplier, the
          declared_powers_on=false branch OVERRIDES the multiplier to POOR AND injects the
          WONT_POWER_ON deduction even though the customer declared GOOD with no defects, so the
          output is not a linear function of any single input.
        test_recipe:
          setup:
            - "SMARTPHONE base 60000; customer declares GOOD, no defects, but powers_on=false."
            - "Formula forces POOR floor 21000 then subtracts WONT_POWER_ON 15000 -> graded 6000."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: [], declared_powers_on: false }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "GET /trade-ins/${ti_id}/quotes -> INITIAL Quote.graded_subtotal_cents == 6000"
            - "GET /trade-ins/${ti_id}/quotes -> INITIAL Quote.amount_cents == 6000"

      - name: promo_bonus_nested_rounding_then_cap_order
        grounds:
          - calculations.promo_bonus
          - calculations.quote_amount
          - state_machines.TradeIn.DRAFT_to_QUOTED
          - entities.Quote.fields.promo_bonus_cents
        distinguishing_aspect: |
          Mode (b): nested rounding/clamp where ORDER matters — pct part is rounded FIRST
          (rhu(36000*0.10)=3600), the flat part is added SECOND (3600+4000=7600), then the cap is
          applied LAST (min(7600,5000)=5000). Summing-then-capping vs capping-each-part diverge; the
          scaffold pins round-pct -> add-flat -> cap and the result observes the cap straddle.
        test_recipe:
          setup:
            - "Promo CAP5: pct 0.10, flat 4000, cap 5000, scope ALL, window covering 2026."
            - "GOOD + CRACKED_SCREEN graded 36000; raw bonus 3600+4000=7600 clamped to cap 5000; amount 41000."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/promotion-campaigns"
              payload: { code: "CAP5", category_scope: "ALL", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", bonus_pct: 0.10, bonus_flat_cents: 4000, bonus_cap_cents: 5000 }
              as: CatalogAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "d@x.com", full_name: "D" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true, promo_code: "CAP5" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "GET /trade-ins/${ti_id}/quotes -> INITIAL Quote.graded_subtotal_cents == 36000"
            - "GET /trade-ins/${ti_id}/quotes -> INITIAL Quote.promo_bonus_cents == 5000"
            - "GET /trade-ins/${ti_id}/quotes -> INITIAL Quote.amount_cents == 41000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tradein_inspect_fork_three_branches
        grounds:
          - state_machines.TradeIn.RECEIVED_to_INSPECTED
          - state_machines.TradeIn.INSPECTED_to_ACCEPTED
          - state_machines.TradeIn.INSPECTED_to_REQUOTED
          - state_machines.TradeIn.INSPECTED_to_RECYCLED
        distinguishing_aspect: |
          Branching fork-join on the TradeIn entity: the single /inspect trigger lands in exactly
          one of {ACCEPTED, REQUOTED, RECYCLED} with divergent side-effect sets (honor quote vs
          mint re-quote vs create recycle disposition), selected by Inspection.outcome.
        test_recipe:
          setup:
            - "Three trade-ins for one customer differing only in verified findings drive the three branches."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e@x.com", full_name: "E" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_match: $.data.id }
            - call: "POST /trade-ins/${ti_match}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_match}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_match}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_req: $.data.id }
            - call: "POST /trade-ins/${ti_req}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_req}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_req}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_rec: $.data.id }
            - call: "POST /trade-ins/${ti_rec}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_rec}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_rec}/receive"
              payload: {}
              as: GradingAgent
          trigger:
            - call: "POST /trade-ins/${ti_match}/inspect"
              payload: { verified_grade: "GOOD", verified_defects: ["CRACKED_SCREEN"], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins/${ti_req}/inspect"
              payload: { verified_grade: "FAIR", verified_defects: ["WATER_DAMAGE"], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins/${ti_rec}/inspect"
              payload: { verified_grade: "POOR", verified_defects: ["WATER_DAMAGE"], verified_powers_on: false }
              as: GradingAgent
          assert:
            - "TradeIn.${ti_match}.status == ACCEPTED"
            - "TradeIn.${ti_req}.status == REQUOTED"
            - "TradeIn.${ti_rec}.status == RECYCLED"

      - name: quote_lock_branches_to_three_terminals
        grounds:
          - state_machines.Quote.LOCKED_to_HONORED
          - state_machines.Quote.LOCKED_to_SUPERSEDED
          - state_machines.Quote.LOCKED_to_EXPIRED
        distinguishing_aspect: |
          Branching on the Quote entity (different entity from TradeIn above): a LOCKED quote
          resolves into one of three terminals HONORED / SUPERSEDED / EXPIRED depending on whether
          the trade-in is accepted, superseded by a re-quote, or swept past lock_expires_at.
        test_recipe:
          setup:
            - "One trade-in's INITIAL quote HONORED via MATCH; another's SUPERSEDED via REQUOTE; a third's EXPIRED via sweep."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "f@x.com", full_name: "F" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_hon: $.data.id }
            - call: "POST /trade-ins/${ti_hon}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_hon}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_hon}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_hon}/inspect"
              payload: { verified_grade: "GOOD", verified_defects: ["CRACKED_SCREEN"], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_sup: $.data.id }
            - call: "POST /trade-ins/${ti_sup}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_sup}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_sup}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_sup}/inspect"
              payload: { verified_grade: "FAIR", verified_defects: ["WATER_DAMAGE"], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "GOOD", declared_defects: ["CRACKED_SCREEN"], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_exp: $.data.id }
            - call: "POST /trade-ins/${ti_exp}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /trade-ins/${ti_exp}/sweep-expiry"
              payload: {}
              as: CatalogAdmin
          assert:
            - "GET /trade-ins/${ti_hon}/quotes -> the INITIAL Quote.status == HONORED"
            - "GET /trade-ins/${ti_sup}/quotes -> the INITIAL Quote.status == SUPERSEDED"
            - "GET /trade-ins/${ti_exp}/quotes -> the INITIAL Quote.status == EXPIRED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspect_recycle_cascade_depth3
        grounds:
          - state_machines.TradeIn.RECEIVED_to_INSPECTED
          - state_machines.TradeIn.INSPECTED_to_RECYCLED
