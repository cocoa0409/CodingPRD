          OWNING CYCLE is PUBLISHED; closing the cycle requires no OPEN orders,
          so the dependency is observed by creating an order on a DRAFT cycle
          (rejected) and by submit after the cycle is PUBLISHED (accepted).
        test_recipe:
          setup:
            - "School S13 NORMAL, Teacher T13 G3_5, title CD1, DRAFT cycle C13d with offering OCD1 (NOT published)"
          setup_api_calls:
            - call: "POST /club/schools"
              payload: { name: "S13", address: "13 Alder St", low_income_program: false }
              as: ClubAdmin
              captures: { s13: $.data.id }
            - call: "POST /club/schools/${s13}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${s13}", full_name: "T Thirteen", email: "t13@x.com", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { t13: $.data.id }
            - call: "POST /club/titles"
              payload: { isbn: "9780000000100", name: "CD1", format: "PAPERBACK", grade_band: "G3_5", base_price_cents: 1000, points_cost: 10, rights_holder: "Pub K", royalty_cap_cents: 100000 }
              as: ClubAdmin
              captures: { cd1: $.data.id }
            - call: "POST /club/flyer-cycles"
              payload: { school_id: "${s13}", month: "2026-10", grade_band: "G3_5" }
              as: ClubAdmin
              captures: { c13d: $.data.id }
            - call: "POST /club/flyer-cycles/${c13d}/offerings"
              payload: { title_id: "${cd1}" }
              as: ClubAdmin
          trigger:
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${c13d}", teacher_id: "${t13}" }
              as: Teacher
              as_user_id: "${t13}"
              captures: { co_err: $.data.error_id }
            - call: "POST /club/flyer-cycles/${c13d}/publish"
              payload: {}
              as: ClubAdmin
            - call: "POST /club/class-orders"
              payload: { cycle_id: "${c13d}", teacher_id: "${t13}" }
              as: Teacher
              as_user_id: "${t13}"
              captures: { co13: $.data.id }
          assert:
            - "Create on DRAFT cycle rejected with ERR_CYCLE_NOT_PUBLISHED (ClassOrder creation depends on FlyerCycle state)"
            - "After publish: create succeeds and ClassOrder.${co13}.status == OPEN"
      - name: donation_match_gated_by_school_low_income_and_posture
        grounds:
          - state_machines.DonationRequest.status.OPEN_to_MATCHED
          - entities.School.fields.low_income_program
          - entities.School.fields.posture
        distinguishing_aspect: |
          DIFFERENT entity pair: DonationRequest -> School — match requires
          School.low_income_program == true AND posture == NORMAL; a school
          that is low-income but RESTRICTED rejects match with
          ERR_SCHOOL_RESTRICTED, and a NORMAL non-low-income school rejects
          creation with ERR_NOT_LOW_INCOME.
        test_recipe:
          setup:
            - "School S14 NORMAL low_income, Teacher T14, title DN1 ACTIVE"
            - "DonationRequest DR1 created at S14 while NORMAL"
            - "S14 then suspended (RESTRICTED) before the donor match"
            - "School S15 NORMAL NOT low-income (for the create-time gate)"
          setup_api_calls:
