      - name: a_request_with_missing_auth_headers_is_rejected_before_role_and_existence
        claim_type: Violation → Error
        grounds:
          - validations[priority 1 ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "The header presence check sits at priority 1, ahead of the role check and of every existence check, so a call with no X-User-Role at all returns 401 ERR_MISSING_AUTH_HEADERS even though the same path with an unknown id would return 404 and the same path with a wrong role would return 403; an empty X-User-ID is treated as absent too."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Q exists so that the target path is otherwise resolvable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Q", name: "Quay Loop Q", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 6000.0 }
              as: SystemController
              captures: { loop_q_id: $.data.id }
          trigger:
            - call: "GET /district-energy/network-loops/${loop_q_id}"
              payload: {}
              as: NONE
              captures: { e_no_role: $.data.error_id }
            - call: "GET /district-energy/network-loops/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: NONE
              captures: { e_no_role_unknown_id: $.data.error_id }
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Q2", name: "Quay Loop Q2", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 6000.0 }
              as: SystemController
              as_user_id: ""
              captures: { e_empty_user: $.data.error_id }
          assert:
            - "the first response status is 401 and ${e_no_role} == ERR_MISSING_AUTH_HEADERS — the X-User-Role header is omitted entirely, which is what `as: NONE` denotes here"
            - "the second response status is 401 and ${e_no_role_unknown_id} == ERR_MISSING_AUTH_HEADERS, not 404 ERR_LOOP_NOT_FOUND"
            - "the third response status is 401 and ${e_empty_user} == ERR_MISSING_AUTH_HEADERS because an empty X-User-ID counts as absent"
            - "GET /district-energy/network-loops as SystemController still has total_count == 1, so no LOOP-Q2 row was created"

      - name: service_mode_and_forecast_loop_mismatches_are_reported_by_distinct_error_ids
        claim_type: Violation → Error
        grounds:
          - validations[priority 9 ERR_SERVICE_MODE_MISMATCH]
          - validations[priority 9 ERR_FORECAST_LOOP_MISMATCH]
          - concurrency_rules[dispatch-plan-create-stale-loop]
        distinguishing_aspect: "Both refusals are cross-row compatibility failures on create, but they are separate identifiers: a COOLING agreement on a HEATING loop returns ERR_SERVICE_MODE_MISMATCH, while a plan quoting a forecast belonging to the other loop returns ERR_FORECAST_LOOP_MISMATCH even though its expected_loop_version is correct, proving the mismatch check runs after the version gate."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-B (HEATING) and NetworkLoop LOOP-Z1 (DUAL), RateSchedule RS-U."
            - "A PUBLISHED LoadForecast F_Z on LOOP-Z1 with an ACTIVE agreement CZ1 (UNIVERSITY, reserved 1000.0) on LOOP-Z1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-B", name: "Bayside Loop B", service_mode: "HEATING", design_supply_temp_c: 92.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 6000.0 }
              as: SystemController
              captures: { loop_b_id: $.data.id }
            - call: "POST /district-energy/network-loops"
