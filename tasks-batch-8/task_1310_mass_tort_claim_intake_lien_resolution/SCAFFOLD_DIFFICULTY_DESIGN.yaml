            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid_high}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Rita", date_of_birth: "1960-01-01", ssn_last4: "8989", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 30, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { r1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 25, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { r2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r2}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { v_pre: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid_low}", expected_claim_version: "${v_pre}" }
              as: ProgramAdministrator
              captures: { active_before: $.data.active_appeal_id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/appeals"
              payload: { appealed_tier_matrix_id: "${tmid_low}", requested_tier_matrix_id: "${tmid_high}", grounds: "Tier dispute" }
              as: ClaimantRole
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { active_after_file: $.data.active_appeal_id }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/appeals/${aid}/withdraw"
              payload: {}
              as: ClaimantRole
