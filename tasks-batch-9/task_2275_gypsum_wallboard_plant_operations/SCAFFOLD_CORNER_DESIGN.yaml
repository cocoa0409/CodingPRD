      - name: third_deferral_of_one_outage_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MAX_DEFERRALS_REACHED]
          - validations[priority 8, ERR_MAX_DEFERRALS_REACHED]
        distinguishing_aspect: |
          MAX_DEFERRALS is 2 counted per outage, so the third defer on the same PROPOSED outage returns
          ERR_MAX_DEFERRALS_REACHED (409) and the outage stays PROPOSED with deferral_count pinned at 2 —
          the counter survives every repropose rather than resetting with the new window.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1 and no runs; an October outage proposed (seasonality_index 0.90)."
            - "The outage has already been deferred twice, each time reproposed onto a new October window."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2026-10-05T06:00:00Z", window_end: "2026-10-07T06:00:00Z", scope_note: "kiln burner rebuild" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { outage_id: $.data.id }
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/defer"
              payload: { deferred_reason: "contractor unavailable" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/repropose"
              payload: { window_start: "2026-10-12T06:00:00Z", window_end: "2026-10-14T06:00:00Z" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/defer"
              payload: { deferred_reason: "spare parts on backorder" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/repropose"
              payload: { window_start: "2026-10-19T06:00:00Z", window_end: "2026-10-21T06:00:00Z" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
          trigger:
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/defer"
              payload: { deferred_reason: "third slip" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409 and ${err_id} == ERR_MAX_DEFERRALS_REACHED"
            - "MaintenanceOutage.${outage_id}.status == PROPOSED and deferral_count == 2"
            - "MaintenanceOutage.${outage_id}.window_start == '2026-10-19T06:00:00.000Z' and seasonality_index == 0.90"
            - "MaintenanceOutage.${outage_id}.deferred_reason == 'spare parts on backorder' (unchanged by the refused call)"
            - "BoardLine.${line_id}.status == AVAILABLE"

