      - name: listing_certification_variation_notice_cycle
        grounds:
          - state_machines.ListingCertification.ACTIVE_to_VARIATION_NOTICE
          - state_machines.ListingCertification.VARIATION_NOTICE_to_ACTIVE
          - state_machines.FactoryInspection.OPEN_to_CLOSED
          - entities.ListingCertification.fields.open_variation_count
          - calculations.inspection_cadence
        distinguishing_aspect: |
          ListingCertification - a third entity, distinct from ProductionLot and
          CustomerOrder - closes a true cycle ACTIVE -> VARIATION_NOTICE ->
          ACTIVE, and the round trip is observable in open_variation_count going
          0 -> 1 -> 0 while the FactoryInspection row itself moves OPEN -> CLOSED
          and next_inspection_due_date advances to 2026-11-08.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Listing file UL E12345 for BLDG-WIRE created with initial_listing_date 2026-06-01 and inspection_interval_days 90."
            - "A PASS inspection on 2026-06-05 has already moved the file PENDING -> ACTIVE with last_inspection_date 2026-06-05 and next_inspection_due_date 2026-09-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
