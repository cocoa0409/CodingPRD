        distinguishing_aspect: "Failing a DISPATCHED batch releases all three orders (batch_id null); the two never-picked orders revert PICKED_UP-side state to READY_FOR_PICKUP while the already-picked order keeps PICKED_UP, and a fresh batch containing the two reverted orders dispatches cleanly with a different courier."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Merchant billing 1000, store, policy ACTIVE, surge 1.0. Batch b1 holds o1 (picked) + o2 + o3 (not picked); o2 and o3 must be re-batchable after fail."
