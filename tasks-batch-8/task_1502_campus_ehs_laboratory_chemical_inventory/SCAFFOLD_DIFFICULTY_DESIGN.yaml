            - "p3 rejected: error_id == ERR_DOCK_WINDOW_CONFLICT (HTTP 409); p3 stays SUBMITTED"

  - rule_id: compensating_invariant
    instances:
      - name: area_count_conserved_tag_untag
        grounds:
          - state_machines.ChemicalContainer.IN_USE_to_WASTE_TAGGED
          - state_machines.ChemicalContainer.WASTE_TAGGED_to_IN_USE
          - entities.AccumulationArea.fields.current_container_count
        distinguishing_aspect: |
          Conserved quantity = area container COUNT: the tag-waste/untag-waste pair
          leaves AccumulationArea.current_container_count unchanged, pinned as
          count(containers with accumulation_area_id == area.id AND state ==
          WASTE_TAGGED); the area returns to exactly 0 with no drift.
        test_recipe:
          setup:
            - "Lab with trained PI; empty area (capacity 10); one IN_USE FLAMMABLE container"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab Q", department: "Chemistry", building: "Hall A", room: "117" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "Q-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 3.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
          trigger:
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "GET /ehs/labs/${l}/accumulation-areas", as: EHSAdmin, captures: { cnt_mid: "$.data[0].current_container_count" } }
            - { call: "POST /ehs/containers/${c1}/untag-waste", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "GET /ehs/labs/${l}/accumulation-areas", as: EHSAdmin }
            - { call: "GET /ehs/containers/${c1}", as: EHSAdmin }
          assert:
            - "after tag: current_container_count == 1"
            - "after untag: AccumulationArea.${area}.current_container_count == 0 (invariant restored)"
            - "ChemicalContainer.${c1}.state == IN_USE and accumulation_area_id == null and tagged_at == null"
      - name: pickup_totals_conserved_add_remove
        grounds:
          - state_machines.WastePickupRequest
          - calculations.pickup_cost_estimate
          - entities.WastePickupRequest.fields.estimated_quantity_total
        distinguishing_aspect: |
          Different conserved quantity (aggregate gallons and money on the request, not
          a container count): add-item/remove-item of the same container restores
          estimated_quantity_total to 0.0 and estimated_cost to exactly the 75.00 base
          fee — no rounding residue survives the compensation.
        test_recipe:
          setup:
            - "Lab with trained PI; one 2.5 FLAMMABLE container tagged; DRAFT pickup"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab R", department: "Chemistry", building: "Hall A", room: "118" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "R-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 2.5, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/remove-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "GET /ehs/waste-pickup-requests/${p}", as: EHSAdmin }
          assert:
            - "WastePickupRequest.${p}.estimated_quantity_total == 0.0"
            - "WastePickupRequest.${p}.estimated_cost == 75.00 (BASE_FEE only; per-item fee of 31.25 fully compensated)"
            - "ChemicalContainer.${c1}.pickup_request_id == null"
