              payload: {}
              as: Mentor
              as_user_id: "${men}"
              captures: { err: $.data.error_id }
            - call: "POST /science-fair/research-plans"
              payload: { project_id: "${p}", plan_text: "plan", risk_level: "LOW" }
              as: Mentor
              as_user_id: "${men}"
              captures: { rp: $.data.id }
