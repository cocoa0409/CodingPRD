      - name: snow_accounting_starts_at_the_full_water_right_and_openable_acres_diverge_from_the_open_percentage
        claim_type: computed_read
        grounds:
          - endpoints[GET /mountain-ops/seasons/{id}/snow-accounting]
          - calculations.season_snow_accounting
          - entities.SeasonConfig.fields.water_right_seasonal_af
          - state_machines.TerrainArea.OPEN_to_CLOSED
        distinguishing_aspect: |
          A season with no sessions must report 0.000 across all three ledgers and
          water_right_remaining_af exactly equal to water_right_seasonal_af - the trap is emitting null or
          omitting the key. The second half separates two acreage figures that a naive implementation
          collapses: after the only area is CLOSED, openable_acres drops to 0.0 (CLOSED is not in {READY,
          OPEN, PATROL_HOLD}) while the DENOMINATOR of terrain_open_pct is still every non-SEASON_CLOSED
          area, i.e. 18.0 - so the percentage is 0.0 rather than undefined or a division by zero.
        test_recipe:
          setup:
            - "A season OPERATING with water_right_seasonal_af 250.000, one OPEN area of 18.0 acres and no snowmaking sessions."
