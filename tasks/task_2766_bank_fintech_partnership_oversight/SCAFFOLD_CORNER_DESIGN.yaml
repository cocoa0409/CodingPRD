      - name: funding_walks_four_gates_in_priority_order_reconciliation_then_live_then_custody_then_reserve
        claim_type: Priority Ordering
        grounds:
          - validations.priority_36
          - validations.priority_38
          - validations.priority_46
          - validations.priority_86
          - errors.ERR_BATCH_NOT_RECONCILED
          - errors.ERR_PARTNER_NOT_LIVE
          - errors.ERR_RESERVE_SHORTFALL_BLOCKS_FUNDING
          - errors.ERR_CUSTODY_ACCOUNT_NOT_ACTIVE
        distinguishing_aspect: "The same fund call is issued five times against the same batch and returns four different error ids and finally 200, purely because the surrounding state advances. The pairs are individually confusable: the first call violates BOTH the reconciliation gate and the LIVE gate and must report the reconciliation error (36 before 38); the fourth violates BOTH the frozen-custody gate and the reserve gate and must report the custody error (46 before 86, and 402 is only ever emitted by 86)."
        test_recipe:
