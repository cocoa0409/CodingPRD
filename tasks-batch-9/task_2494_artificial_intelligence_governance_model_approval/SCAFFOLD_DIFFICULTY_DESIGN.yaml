            - "the PASSED BIAS evaluation is untouched (only PLANNED evaluations on the newly stale binding would have been VOIDED)"
            - "filing a second SEV3 incident afterwards leaves posture at IMPAIRED - the SEV1 branch dominates the count branch"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precedes_business_referential_on_approve
        grounds: "validations priority 13 (category state, ERR_USE_CASE_NOT_READY_FOR_APPROVAL, 409) and priority 29 (category business_referential, ERR_MODEL_BINDING_STALE, 422) both guard POST /use-cases/{id}/approve. A single request can violate both, and the declared priority order forces the state error to win."
        distinguishing_aspect: "category pair state vs business_referential, on the approve endpoint, with the lower-priority error being the more expensive one to fix (a re-approval of the vendor's new model version). The recipe also proves priority 9 (optimistic concurrency) still outranks priority 13 by supplying a CURRENT expected_use_case_version, so the conflict observed is genuinely 13-vs-29 and not 9-vs-anything."
        test_recipe:
          setup: "Drive the HIGH-tier use case to READY_FOR_APPROVAL exactly as in the revoke recipe but WITHOUT approving. Then break two things at once: PATCH the model asset to a new vendor model version (asset version 2 -> 3, so the PINNED binding's pinned_model_version 2 is now behind and violates priority 29), and reopen the LEGAL gate (so the use case leaves READY_FOR_APPROVAL and violates priority 13). Finally read the current UseCase.version so the priority 9 check cannot fire."
          setup_api_calls:
