# =============================================================================
# task_1032 — §1.9 Scaffold Corner Design (breadth coverage of testable claims)
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- Entities
  - section: entities
    instances:
      - name: member_creation_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Member.fields.email, entities.Member.fields.membership_tier]
        distinguishing_aspect: "POST /coop/members with email+full_name returns 201 with membership_tier=BASIC, membership_status=ACTIVE, and all ledgers at 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/members"
              payload: { email: "e1@x.com", full_name: "Ent One" }
              as: Public
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.membership_tier == BASIC"
            - "Member.${m_id}.membership_status == ACTIVE"
            - "Member.${m_id}.store_credit_cents == 0"
            - "Member.${m_id}.loyalty_points_balance == 0"

      - name: member_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /coop/members/{id} with a random UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /coop/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: gear_sku_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.GearSku.fields.retail_price_cents]
        distinguishing_aspect: "POST /coop/gear-skus omitting retail_price_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/gear-skus"
              payload: { name: "No Price", category: "TENT" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: gear_sku_invalid_category_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.GearSku.fields.category]
        distinguishing_aspect: "POST /coop/gear-skus with category=SPACESUIT (not in the enum) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/gear-skus"
              payload: { name: "Bad Cat", category: "SPACESUIT", retail_price_cents: 1000 }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: classtrip_computed_seats_available_equals_capacity_on_create
        claim_type: Computed Fields
        grounds: [entities.ClassTrip.fields.seats_available, calculations.class_trip_seats]
        distinguishing_aspect: "A newly created ClassTrip with capacity 4 has seats_reserved=0 and seats_available=4 (computed), waitlist_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/class-trips"
              payload: { title: "Ent Trip", category: "GUIDED_TRIP", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T16:00:00Z", capacity: 4, price_cents: 5000 }
              as: StoreStaff
              captures: { ct: $.data.id }
          assert:
            - "ClassTrip.${ct}.seats_reserved == 0"
            - "ClassTrip.${ct}.seats_available == 4"
            - "ClassTrip.${ct}.waitlist_count == 0"

      - name: gear_unit_bad_sku_reference_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.GearUnit.fields.gear_sku_id, "errors[ERR_GEAR_SKU_NOT_FOUND]"]
        distinguishing_aspect: "POST /coop/gear-units with a non-existent gear_sku_id returns ERR_GEAR_SKU_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "11111111-1111-4111-8111-111111111111", serial_number: "X-1" }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_GEAR_SKU_NOT_FOUND"

  # ------------------------------------------------------- State machines
  - section: state_machines
    instances:
      - name: rental_pickup_after_return_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RentalAgreement.PICKED_UP_to_RETURNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RETURNED rental is terminal; a second pickup returns ERR_INVALID_STATE (409) and no side effects fire."
        test_recipe:
          setup: ["Member; rentable unit; rental picked up and returned (RETURNED)."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "sm1@x.com", full_name: "SM One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Sm Tent", category: "TENT", retail_price_cents: 20000, rentable: true, daily_rental_rate_cents: 1000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "SM-1" }
              as: StoreStaff
              captures: { unit_id: $.data.id }
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-05T09:00:00Z", due_at: "2026-07-06T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r: $.data.id }
            - call: "POST /coop/rental-agreements/${r}/pickup"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/rental-agreements/${r}/return"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/rental-agreements/${r}/pickup"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: order_return_before_pay_returns_order_not_paid
        claim_type: Precondition Enforcement
        grounds: [state_machines.SalesOrder.return, "errors[ERR_ORDER_NOT_PAID]"]
        distinguishing_aspect: "Returning an UNPAID order returns ERR_ORDER_NOT_PAID (409); the return precondition requires payment_status==PAID."
        test_recipe:
          setup: ["Member; one SKU; created UNPAID order (never paid or fulfilled)."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "sm2@x.com", full_name: "SM Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Sm Stove", category: "STOVE", retail_price_cents: 4000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/sales-orders"
              payload: { member_id: "${m_id}", lines: [ { gear_sku_id: "${sku_id}", quantity: 1 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { o: $.data.id }
          trigger:
            - call: "POST /coop/sales-orders/${o}/return"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_PAID"

      - name: trade_in_sell_on_instant_credit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TradeIn.LISTED_to_SOLD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling sell on an INSTANT_CREDIT trade-in that is ACCEPTED (never LISTED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member; SKU; INSTANT_CREDIT trade-in appraised 10000 and accepted (status ACCEPTED, not LISTED)."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "sm3@x.com", full_name: "SM Three" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Sm Bag", category: "APPAREL", retail_price_cents: 15000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", gear_sku_id: "${sku_id}", described_condition: "GOOD", payout_method: "INSTANT_CREDIT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti: $.data.id }
            - call: "POST /coop/trade-ins/${ti}/appraise"
              payload: { appraised_value_cents: 10000 }
              as: StoreStaff
            - call: "POST /coop/trade-ins/${ti}/respond"
              payload: { action: "ACCEPT" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /coop/trade-ins/${ti}/sell"
              payload: { resale_price_cents: 12000 }
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: classtrip_cancel_cascades_bookings_to_cancelled
        claim_type: Side Effect Execution
        grounds: [state_machines.ClassTrip.SCHEDULED_to_CANCELLED, state_machines.Booking.BOOKED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a trip with one BOOKED member sets that booking to CANCELLED and refunds price_paid_cents (1000) back to the member's store_credit."
        test_recipe:
          setup: ["Member with 1000 credit; trip capacity 3 price 1000; member BOOKED (credit 0)."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "sm4@x.com", full_name: "SM Four" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 1000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Cascade Trip", category: "CLASS", start_at: "2026-08-08T08:00:00Z", end_at: "2026-08-08T10:00:00Z", capacity: 3, price_cents: 1000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b: $.data.id }
          trigger:
            - call: "POST /coop/class-trips/${ct}/cancel"
              payload: {}
              as: StoreStaff
          assert:
            - "Booking.${b}.status == CANCELLED"
            - "Member.${m_id}.store_credit_cents == 1000"
            - "ClassTrip.${ct}.status == CANCELLED"

      - name: classtrip_complete_marks_booked_as_no_show
        claim_type: Side Effect Execution
        grounds: [state_machines.ClassTrip.SCHEDULED_to_COMPLETED, entities.Booking.fields.status]
        distinguishing_aspect: "Completing a trip flips a still-BOOKED (never checked-in) booking to NO_SHOW with no refund."
        test_recipe:
          setup: ["Member with 2000 credit; trip capacity 3 price 2000; member BOOKED, not checked in."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "sm5@x.com", full_name: "SM Five" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 2000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "NoShow Trip", category: "CLASS", start_at: "2026-08-09T08:00:00Z", end_at: "2026-08-09T10:00:00Z", capacity: 3, price_cents: 2000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b: $.data.id }
          trigger:
            - call: "POST /coop/class-trips/${ct}/complete"
              payload: {}
              as: StoreStaff
          assert:
            - "Booking.${b}.status == NO_SHOW"
            - "Member.${m_id}.store_credit_cents == 0"

      - name: permit_pass_expires_after_clock_advances
        claim_type: Valid Transition
        grounds: [state_machines.PermitPass.ISSUED_to_EXPIRED, entities.PermitPass.fields.status]
        distinguishing_aspect: "A pass with entry_date 2026-08-10 becomes EXPIRED once the clock advances past 2026-08-11 (entry_date + 1 day)."
        test_recipe:
          setup: ["Member with 5000 credit; allocation season Aug 2026 quota 5 price 2000; one pass issued for 2026-08-10."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "sm6@x.com", full_name: "SM Six" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/permit-allocations"
              payload: { park_name: "Rainier", season_start: "2026-08-01T00:00:00Z", season_end: "2026-08-31T23:59:59Z", total_quota: 5, price_cents: 2000 }
              as: StoreStaff
              captures: { pa: $.data.id, pav0: $.data.version }
            - call: "POST /coop/permit-passes"
              payload: { member_id: "${m_id}", permit_allocation_id: "${pa}", entry_date: "2026-08-10T00:00:00Z", expected_allocation_version: "${pav0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { pp: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: StoreStaff
          assert:
            - "PermitPass.${pp}.status == EXPIRED"

  # --------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: rental_charge_below_multiday_threshold_no_discount
        claim_type: Constants Applied
        grounds: [calculations.rental_charge]
        distinguishing_aspect: "Threshold-1 boundary: a 6-day PREMIER rental at 2000/day gets NO multi-day discount (rental_days<7), so estimated_charge_cents == 10800 (12000 − 1200 member discount)."
        test_recipe:
          setup: ["PREMIER member; rentable SKU daily 2000; 6-day rental 2026-07-05T09:00Z→2026-07-11T09:00Z, no waiver."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "ca1@x.com", full_name: "Ca One", membership_tier: "PREMIER" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Ca Kayak", category: "KAYAK", retail_price_cents: 80000, rentable: true, daily_rental_rate_cents: 2000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "CA-1" }
              as: StoreStaff
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-05T09:00:00Z", due_at: "2026-07-11T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r: $.data.id }
          assert:
            - "RentalAgreement.${r}.rental_days == 6"
            - "RentalAgreement.${r}.estimated_charge_cents == 10800"

      - name: order_loyalty_points_floor_on_pay
        claim_type: Correct Result
        grounds: [calculations.order_total, entities.Member.fields.loyalty_points_balance]
        distinguishing_aspect: "loyalty_points_earned = floor(total_cents/100): a BASIC order of 1850 earns 18 points (not 19), credited to the member on pay."
        test_recipe:
          setup: ["BASIC member; one SKU priced 1850; order not using store credit."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "ca2@x.com", full_name: "Ca Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Headlamp", category: "APPAREL", retail_price_cents: 1850 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/sales-orders"
              payload: { member_id: "${m_id}", lines: [ { gear_sku_id: "${sku_id}", quantity: 1 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { o: $.data.id }
          trigger:
            - call: "POST /coop/sales-orders/${o}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "SalesOrder.${o}.loyalty_points_earned == 18"
            - "Member.${m_id}.loyalty_points_balance == 18"

      - name: permit_quota_decrements_on_issue
        claim_type: Correct Result
        grounds: [calculations.permit_allocation_quota, entities.PermitAllocation.fields.available_quota]
        distinguishing_aspect: "Issuing one pass from a quota-3 pool sets issued_count=1 and available_quota=2."
        test_recipe:
          setup: ["Member with 5000 credit; allocation quota 3 price 2000, season Aug 2026."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "ca3@x.com", full_name: "Ca Three" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/permit-allocations"
              payload: { park_name: "Olympic", season_start: "2026-08-01T00:00:00Z", season_end: "2026-08-31T23:59:59Z", total_quota: 3, price_cents: 2000 }
              as: StoreStaff
              captures: { pa: $.data.id, pav0: $.data.version }
          trigger:
            - call: "POST /coop/permit-passes"
              payload: { member_id: "${m_id}", permit_allocation_id: "${pa}", entry_date: "2026-08-15T00:00:00Z", expected_allocation_version: "${pav0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { pp: $.data.id }
          assert:
            - "PermitAllocation.${pa}.issued_count == 1"
            - "PermitAllocation.${pa}.available_quota == 2"
            - "PermitPass.${pp}.price_cents == 2000"

  # ---------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: booking_rejected_when_membership_inactive
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_MEMBERSHIP_INACTIVE]"]
        distinguishing_aspect: "A LAPSED member with sufficient credit booking a SCHEDULED trip is rejected with ERR_MEMBERSHIP_INACTIVE (403) — business_safety single-failure."
        test_recipe:
          setup: ["LAPSED member with 5000 credit; SCHEDULED trip capacity 3 price 1000."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "va1@x.com", full_name: "Va One", membership_status: "LAPSED" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Va Trip", category: "CLASS", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T10:00:00Z", capacity: 3, price_cents: 1000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
          trigger:
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBERSHIP_INACTIVE"

      - name: rental_rejected_when_unit_not_rentable
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_UNIT_NOT_RENTABLE]"]
        distinguishing_aspect: "Creating a rental against a unit whose GearSku.rentable==false returns ERR_UNIT_NOT_RENTABLE (422) — business_referential."
        test_recipe:
          setup: ["ACTIVE member; a non-rentable SKU with one unit."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "va2@x.com", full_name: "Va Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Display Only", category: "TENT", retail_price_cents: 30000, rentable: false }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "VA-2" }
              as: StoreStaff
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-05T09:00:00Z", due_at: "2026-07-06T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNIT_NOT_RENTABLE"

      - name: permit_rejected_when_insufficient_store_credit
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_STORE_CREDIT]"]
        distinguishing_aspect: "A member with 500 credit buying a 2000 permit (within season, quota available) is rejected with ERR_INSUFFICIENT_STORE_CREDIT (402) — business_fiscal single-failure."
        test_recipe:
          setup: ["Member with 500 credit; allocation quota 2 price 2000, season Aug 2026."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "va3@x.com", full_name: "Va Three" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 500 }
              as: StoreStaff
            - call: "POST /coop/permit-allocations"
              payload: { park_name: "Baker", season_start: "2026-08-01T00:00:00Z", season_end: "2026-08-31T23:59:59Z", total_quota: 2, price_cents: 2000 }
              as: StoreStaff
              captures: { pa: $.data.id, pav0: $.data.version }
          trigger:
            - call: "POST /coop/permit-passes"
              payload: { member_id: "${m_id}", permit_allocation_id: "${pa}", entry_date: "2026-08-12T00:00:00Z", expected_allocation_version: "${pav0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_STORE_CREDIT"

  # ------------------------------------------------------------ Endpoints
  - section: endpoints
    instances:
      - name: gear_units_filtered_list_by_sku_returns_children
        claim_type: Computed read
        grounds: [entities.GearUnit.fields.gear_sku_id]
        distinguishing_aspect: "GET /coop/gear-units?gear_sku_id={sku} returns the array of units for that SKU (FK reverse-reachability), length 2 after two units are registered."
        test_recipe:
          setup: ["One SKU with two units."]
          setup_api_calls:
            - call: "POST /coop/gear-skus"
              payload: { name: "Ep Kayak", category: "KAYAK", retail_price_cents: 70000, rentable: true, daily_rental_rate_cents: 2500 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "EP-1" }
              as: StoreStaff
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "EP-2" }
              as: StoreStaff
          trigger:
            - call: "GET /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}" }
              as: StoreStaff
          assert:
            - "response.data is an array of length 2, each with gear_sku_id == ${sku_id}"

  # ---------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: member_cannot_appraise_trade_in
        claim_type: Cannot perform other role ops
        grounds: [roles.Member, roles.StoreStaff, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Appraise is StoreStaff-exclusive; a Member calling POST /coop/trade-ins/{id}/appraise is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Member; SKU; a SUBMITTED trade-in owned by the member."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "rb1@x.com", full_name: "Rb One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Rb Bag", category: "APPAREL", retail_price_cents: 12000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", gear_sku_id: "${sku_id}", described_condition: "GOOD", payout_method: "INSTANT_CREDIT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti: $.data.id }
          trigger:
            - call: "POST /coop/trade-ins/${ti}/appraise"
              payload: { appraised_value_cents: 8000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: member_cannot_pay_another_members_order
        claim_type: Peer-role ownership
        grounds: [roles.Member, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "entity_backed Member ownership: member M2 paying M1's order (X-User-ID != order.member_id) is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Member M1 with an UNPAID order; a second member M2."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "rb2a@x.com", full_name: "Rb2 A" }
              as: Public
              captures: { m1: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "rb2b@x.com", full_name: "Rb2 B" }
              as: Public
              captures: { m2: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Rb Stove", category: "STOVE", retail_price_cents: 3000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/sales-orders"
              payload: { member_id: "${m1}", lines: [ { gear_sku_id: "${sku_id}", quantity: 1 } ] }
              as: Member
              as_user_id: "${m1}"
              captures: { o: $.data.id }
          trigger:
            - call: "POST /coop/sales-orders/${o}/pay"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: protected_read_with_unknown_role_returns_unauthenticated
        claim_type: Cannot perform other role ops
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request carrying an unrecognized X-User-Role (Anonymous) on GET /coop/members/{id} is rejected at priority 1 with ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["One member."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "rb3@x.com", full_name: "Rb Three" }
              as: Public
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /coop/members/${m_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ----------------------------------------------- Cross-cutting layers
  - section: cross_cutting
    instances:
      - name: booking_occ_correct_version_succeeds_and_bumps_classtrip_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-create-stale-classtrip]", entities.ClassTrip.fields.version]
        distinguishing_aspect: "A booking with expected_classtrip_version matching the current version succeeds and increments ClassTrip.version from 1 to 2."
        test_recipe:
          setup: ["Member with 3000 credit; trip capacity 3 price 3000 (version 1)."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "cc1@x.com", full_name: "Cc One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 3000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Cc Trip", category: "CLASS", start_at: "2026-08-14T08:00:00Z", end_at: "2026-08-14T10:00:00Z", capacity: 3, price_cents: 3000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
          trigger:
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b: $.data.id, st: $.data.status }
            - call: "GET /coop/class-trips/${ct}"
              payload: {}
              as: StoreStaff
              captures: { ctv1: $.data.version }
          assert:
            - "Booking.${b}.status == BOOKED"
            - "ClassTrip.${ct}.version == 2"

      - name: booking_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-create-stale-classtrip]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one booking bumps ClassTrip.version to 2, a second booking still carrying expected_classtrip_version=1 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Two members each with 3000 credit; trip capacity 3 price 3000; member A already booked (version now 2)."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "cc2a@x.com", full_name: "Cc2 A" }
              as: Public
              captures: { ma: $.data.id }
            - call: "POST /coop/members/${ma}/store-credit"
              payload: { amount_cents: 3000 }
              as: StoreStaff
            - call: "POST /coop/members"
              payload: { email: "cc2b@x.com", full_name: "Cc2 B" }
              as: Public
              captures: { mb: $.data.id }
            - call: "POST /coop/members/${mb}/store-credit"
              payload: { amount_cents: 3000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Cc2 Trip", category: "CLASS", start_at: "2026-08-16T08:00:00Z", end_at: "2026-08-16T10:00:00Z", capacity: 3, price_cents: 3000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${ma}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${ma}"
              captures: { ba: $.data.id }
          trigger:
            - call: "POST /coop/bookings"
              payload: { member_id: "${mb}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${mb}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: permit_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-issue-stale-allocation]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one issue bumps PermitAllocation.version to 2, a second issue still carrying expected_allocation_version=1 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Two members each with 5000 credit; allocation quota 5 price 2000 season Aug 2026; member A already issued a pass (version now 2)."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "cc3a@x.com", full_name: "Cc3 A" }
              as: Public
              captures: { ma: $.data.id }
            - call: "POST /coop/members/${ma}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/members"
              payload: { email: "cc3b@x.com", full_name: "Cc3 B" }
              as: Public
              captures: { mb: $.data.id }
            - call: "POST /coop/members/${mb}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/permit-allocations"
              payload: { park_name: "North Cascades", season_start: "2026-08-01T00:00:00Z", season_end: "2026-08-31T23:59:59Z", total_quota: 5, price_cents: 2000 }
              as: StoreStaff
              captures: { pa: $.data.id, pav0: $.data.version }
            - call: "POST /coop/permit-passes"
              payload: { member_id: "${ma}", permit_allocation_id: "${pa}", entry_date: "2026-08-18T00:00:00Z", expected_allocation_version: "${pav0}" }
              as: Member
              as_user_id: "${ma}"
              captures: { ppa: $.data.id }
          trigger:
            - call: "POST /coop/permit-passes"
              payload: { member_id: "${mb}", permit_allocation_id: "${pa}", entry_date: "2026-08-19T00:00:00Z", expected_allocation_version: "${pav0}" }
              as: Member
              as_user_id: "${mb}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

  # ----------------------------------------------------- Consistency model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_reflects_state
        claim_type: immediate
        grounds: [entities.SalesOrder.fields.payment_status]
        distinguishing_aspect: "Immediate consistency: a GET on an order right after pay reflects payment_status=PAID in the same synchronous flow."
        test_recipe:
          setup: ["Member; SKU 5000; order paid (no store credit)."]
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "cm1@x.com", full_name: "Cm One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Cm Stove", category: "STOVE", retail_price_cents: 5000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/sales-orders"
              payload: { member_id: "${m_id}", lines: [ { gear_sku_id: "${sku_id}", quantity: 1 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { o: $.data.id }
            - call: "POST /coop/sales-orders/${o}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /coop/sales-orders/${o}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ps: $.data.payment_status }
          assert:
            - "SalesOrder.${o}.payment_status == PAID"

  # --------------------------------------- Already-covered corners (stubs)
  - section: calculations
    instances:
      - name: rental_late_fee_boundary_strict_after_due
        claim_type: Precision
        grounds: [calculations.rental_charge]
        excluded_because:
          difficulty_instance: boundary_precision_check / rental_return_exactly_at_due_no_late_fee
          rationale: "The exact `>` late-fee boundary on rental return is asserted by the named §1.8 boundary instance."

      - name: trade_in_variant_divergence
        claim_type: Variant Divergence
        grounds: [calculations.trade_in_payout]
        excluded_because:
          difficulty_instance: dual_variant_calc / trade_in_instant_vs_consignment_payout_diverge
          rationale: "Instant-vs-consignment payout divergence is the subject of the named §1.8 dual-variant instance."

  - section: validations
    instances:
      - name: booking_state_vs_fiscal_priority
        claim_type: Priority Ordering
        grounds: ["validations[priority=4]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_booking_completed_trip
          rationale: "State-over-fiscal priority on booking is asserted by the named §1.8 priority instance."
