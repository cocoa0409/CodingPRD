# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1-§1.7. Deleting this
# file leaves the declared behaviour identical; it only makes coverage harder to
# audit. All money figures below were computed by executing the §1.3 formulas
# with their declared constants against the literal inputs pinned in `setup:`.
#
# Shared literal fixture used by most chains (each instance re-creates it from
# empty DB; nothing is shared implicitly):
#   logical clock start ......... 2026-08-01T00:00:00Z (§1.5 startup default)
#   Program ..................... arrival 2026-09-10, departure 2026-09-14
#   Venue ....................... turnover_buffer_minutes 90
#   Supplier .................... APPROVED, coi_verified, limit 500000000 cents
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: billable_headcount_estimate_vs_final_divergence
        grounds:
          - calculations.element_billable_headcount
          - calculations.program_client_total
          - calculations.reconciliation_line_amounts
          - entities.ProgramElement.fields.guaranteed_headcount
          - entities.ProgramElement.fields.actual_headcount
          - entities.ReconciliationLine.fields.billed_headcount
          - entities.Program.fields.estimated_client_total_cents
          - entities.Program.fields.final_client_total_cents
          - validations[priority=46]
        distinguishing_aspect: |
          The ESTIMATE variant of element_billable_headcount bills max(planned=110, guaranteed=100)=110
          guests while the FINAL variant bills max(ceil(100*0.85)=85, actual=70)=85 on the SAME element,
          so the attrition floor — not the actual turnout — sets the invoice; the two variants differ by
          exactly 25 guests and 631300 cents of client total on identical stored data.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Venue with capacity_reception 400 and turnover_buffer_minutes 90."
            - "One APPROVED Supplier of type ACTIVITY with coi_verified true and liability limit 500000000 cents."
            - "One Program for 2026-09-10..2026-09-14 with guaranteed_count 100 and markup_pct 0.18."
            - "One ACTIVITY ProgramElement 2026-09-11T09:00Z..13:00Z with planned_headcount 110, guaranteed_headcount 100, per_person_cost_cents 20000."
            - "One ACTIVE SupplierContract for that (program, supplier) pair, countersigned by a different user than the sender."
            - "Program CONFIRMED (so estimated_client_total_cents is frozen), then IN_EXECUTION, element DELIVERED with actual_headcount 70, program COMPLETED by the bubble-up, reconciliation opened, the single line annotated with a variance reason and APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/venues"
              payload: { name: "Harbor Pavilion", capacity_seated: 200, capacity_reception: 400, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Bayside Ground Services LLC", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Meridian Pharma", group_name: "Global Sales Kickoff", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 100, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Harbor Sail Regatta", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T13:00:00Z", planned_headcount: 110, guaranteed_headcount: 100, per_person_cost_cents: 20000, is_weather_dependent: false, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el_id: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 2200000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
            - call: "POST /dmc/supplier-contracts/${ctr_id}/countersign"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-signer-2"
            - call: "POST /dmc/programs/${prog_id}/lock-design"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/confirm"
              payload: {}
              as: ProgramDirector
              captures: { est_total: $.data.estimated_client_total_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/start-execution"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /dmc/program-elements/${el_id}/mark-ready"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T13:30:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/program-elements/${el_id}/deliver"
              payload: { actual_headcount: 70 }
              as: OperationsCoordinator
            - call: "POST /dmc/programs/${prog_id}/reconcile"
              payload: {}
              as: ProgramDirector
            - call: "GET /dmc/reconciliation-lines?program_id=${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { line_id: "$.data[0].id" }
            - call: "PATCH /dmc/reconciliation-lines/${line_id}"
              payload: { variance_reason: "Attrition floor applied; 30 guests dropped after client-side agenda change." }
              as: ProgramDirector
            - call: "POST /dmc/reconciliation-lines/${line_id}/approve"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /dmc/programs/${prog_id}/issue-invoice"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
          assert:
            - "Program.${prog_id}.estimated_client_total_cents == 2777720"
            - "ReconciliationLine.${line_id}.billed_headcount == 85"
            - "ReconciliationLine.${line_id}.actual_headcount == 70"
            - "ReconciliationLine.${line_id}.guaranteed_headcount == 100"
            - "ReconciliationLine.${line_id}.supplier_cost_cents == 1700000"
            - "ReconciliationLine.${line_id}.markup_cents == 306000"
            - "ReconciliationLine.${line_id}.client_charge_cents == 2006000"
            - "Program.${prog_id}.final_subtotal_cents == 1700000"
            - "Program.${prog_id}.disclosed_markup_cents == 306000"
            - "Program.${prog_id}.management_fee_cents == 140420"
            - "Program.${prog_id}.final_client_total_cents == 2146420"
            - "Program.${prog_id}.estimated_client_total_cents - Program.${prog_id}.final_client_total_cents == 631300"
            - "Program.${prog_id}.settlement_status == CLIENT_INVOICED"

      - name: staff_labor_cost_planned_vs_actual_divergence
        grounds:
          - calculations.staff_labor_cost
          - entities.StaffAssignment.fields.planned_labor_cost_cents
          - entities.StaffAssignment.fields.actual_labor_cost_cents
          - entities.StaffMember.fields.pay_rate_cents_per_hour
          - state_machines.StaffAssignment.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          On one shift the PLANNED variant reads the scheduled span (600 minutes, crossing the
          480-minute OT threshold, costing 49500 cents) while the ACTUAL variant reads the worked span
          (90 minutes, lifted to the 240-minute minimum call-out, costing 18000 cents) — the two
          variants engage opposite arms of the same formula (OT ceiling vs call-out floor) in the labor
          domain, not the attendance domain of billable_headcount_estimate_vs_final_divergence.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Venue, APPROVED Supplier, Program 2026-09-10..2026-09-14 markup_pct 0.18."
            - "One ACTIVITY ProgramElement 2026-09-11T09:00Z..13:00Z, planned/guaranteed 40, per_person_cost_cents 5000."
            - "One ACTIVE SupplierContract for that (program, supplier)."
            - "One ACTIVE StaffMember of role COORDINATOR, pay_rate_cents_per_hour 4500, min_rest_minutes 600, max_daily_minutes 720, credentials valid through 2027."
            - "One StaffAssignment on that element scheduled 2026-09-11T08:00Z..18:00Z (600 minutes) in status CONFIRMED."
            - "Program IN_EXECUTION, element READY, staff CHECKED_IN at 2026-09-11T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/venues"
              payload: { name: "Harbor Pavilion", capacity_seated: 200, capacity_reception: 400, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Bayside Ground Services LLC", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Meridian Pharma", group_name: "Global Sales Kickoff", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 100, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Waterfront Welcome Reception", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T13:00:00Z", planned_headcount: 40, guaranteed_headcount: 40, per_person_cost_cents: 5000, is_weather_dependent: false, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el_id: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 200000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
            - call: "POST /dmc/supplier-contracts/${ctr_id}/countersign"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-signer-2"
            - call: "POST /dmc/staff-members"
              payload: { full_name: "Dana Okafor", role_type: "COORDINATOR", badge_expires_on: "2027-06-30", first_aid_expires_on: "2027-12-31", pay_rate_cents_per_hour: 4500, min_rest_minutes: 600, max_daily_minutes: 720, status: "ACTIVE" }
              as: ProgramDirector
              captures: { staff_id: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_id}", program_id: "${prog_id}", target_type: "ELEMENT", element_id: "${el_id}", role_type: "COORDINATOR", starts_at: "2026-09-11T08:00:00Z", ends_at: "2026-09-11T18:00:00Z" }
              as: ProgramDirector
              captures: { asg_id: $.data.id }
            - call: "POST /dmc/staff-assignments/${asg_id}/confirm"
              payload: {}
              as: ProgramDirector
              captures: { planned_cost: $.data.planned_labor_cost_cents }
            - call: "POST /dmc/programs/${prog_id}/lock-design"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/start-execution"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /dmc/program-elements/${el_id}/mark-ready"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T12:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/staff-assignments/${asg_id}/check-in"
              payload: {}
              as: OperationsCoordinator
              as_user_id: "${staff_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T13:30:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /dmc/program-elements/${el_id}/deliver"
              payload: { actual_headcount: 40 }
              as: OperationsCoordinator
          assert:
            - "StaffAssignment.${asg_id}.planned_labor_cost_cents == 49500"
            - "StaffAssignment.${asg_id}.actual_labor_cost_cents == 18000"
            - "StaffAssignment.${asg_id}.status == COMPLETED"
            - "StaffAssignment.${asg_id}.check_in_at == 2026-09-11T12:00:00Z"
            - "StaffAssignment.${asg_id}.completed_at == 2026-09-11T13:30:00Z"
            - "StaffMember.${staff_id}.confirmed_minutes_total == 600"
            - "Program.${prog_id}.staffing_gap_count == 0"
            - "Program.${prog_id}.execution_status == COMPLETED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: labor_cost_three_input_interaction_at_ot_threshold
        grounds:
          - calculations.staff_labor_cost
          - entities.StaffMember.fields.pay_rate_cents_per_hour
          - entities.StaffAssignment.fields.planned_labor_cost_cents
          - validations[priority=25]
        distinguishing_aspect: |
          Mode (a) — three independent inputs (scheduled minutes, hourly rate, OT multiplier) interact
          non-additively at the 480-minute threshold: a shift of exactly 480 minutes at 3600 cents/hour
          costs 28800, while a shift of 481 minutes costs 28890, i.e. the 481st minute is worth 90 cents
          rather than the 60 cents a linear model would charge.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Program 2026-09-10..2026-09-14."
            - "One TransportSegment SHUTTLE_LOOP on that program (assignment target)."
            - "Two ACTIVE GREETER StaffMembers, both pay_rate_cents_per_hour 3600, min_rest_minutes 600, max_daily_minutes 720, credentials valid through 2027."
            - "Staff A has a PROPOSED shift 2026-09-11T09:00Z..17:00Z (exactly 480 minutes); Staff B has a PROPOSED shift 2026-09-11T09:00Z..17:01Z (481 minutes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Northwind Insurance", group_name: "Agent Summit", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 80, markup_pct: 0.20 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "SHUTTLE_LOOP", vehicle_code: "SHUT-01", origin: "Host Hotel", destination: "Convention Center", depart_at: "2026-09-11T09:00:00Z", arrive_at: "2026-09-11T17:30:00Z", seat_capacity: 40, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /dmc/staff-members"
              payload: { full_name: "Ana Ruiz", role_type: "GREETER", badge_expires_on: "2027-06-30", first_aid_expires_on: "2027-12-31", pay_rate_cents_per_hour: 3600, min_rest_minutes: 600, max_daily_minutes: 720, status: "ACTIVE" }
              as: ProgramDirector
              captures: { staff_a: $.data.id }
            - call: "POST /dmc/staff-members"
              payload: { full_name: "Bo Lindqvist", role_type: "GREETER", badge_expires_on: "2027-06-30", first_aid_expires_on: "2027-12-31", pay_rate_cents_per_hour: 3600, min_rest_minutes: 600, max_daily_minutes: 720, status: "ACTIVE" }
              as: ProgramDirector
              captures: { staff_b: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_a}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "GREETER", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T17:00:00Z" }
              as: ProgramDirector
              captures: { asg_a: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_b}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "GREETER", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T17:01:00Z" }
              as: ProgramDirector
              captures: { asg_b: $.data.id }
          trigger:
            - call: "POST /dmc/staff-assignments/${asg_a}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/staff-assignments/${asg_b}/confirm"
              payload: {}
              as: ProgramDirector
          assert:
            - "StaffAssignment.${asg_a}.planned_labor_cost_cents == 28800"
            - "StaffAssignment.${asg_b}.planned_labor_cost_cents == 28890"
            - "StaffAssignment.${asg_b}.planned_labor_cost_cents - StaffAssignment.${asg_a}.planned_labor_cost_cents == 90"
            - "StaffMember.${staff_a}.confirmed_minutes_total == 480"
            - "StaffMember.${staff_b}.confirmed_minutes_total == 481"
            - "both confirm calls return 200 (481 minutes is still under max_daily_minutes 720, so validations[priority=25] does not fire)"

      - name: markup_rounded_per_line_not_on_program_total
        grounds:
          - calculations.reconciliation_line_amounts
          - calculations.program_client_total
          - entities.ReconciliationLine.fields.markup_cents
          - entities.Program.fields.disclosed_markup_cents
          - entities.Program.fields.markup_pct
        distinguishing_aspect: |
          Mode (b) — rounding order is observable: three identical lines of 40020 cents each round
          40020*0.175 = 7003.5 up to 7004 per line for a disclosed markup of 21012, whereas rounding the
          aggregate (120060*0.175 = 21010.5 -> 21011) would produce 21011; the scaffold's per-line-then-sum
          order is pinned by exactly one cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Venue capacity_reception 400, turnover_buffer_minutes 90; APPROVED Supplier."
            - "Program 2026-09-10..2026-09-14 with markup_pct 0.175."
            - "Three ACTIVITY ProgramElements on 2026-09-11, each planned/guaranteed 20 and per_person_cost_cents 2001, at 09:00Z-11:00Z, 12:30Z-14:30Z and 16:00Z-18:00Z (each start respects the previous element's 90-minute turnover buffer)."
            - "One ACTIVE SupplierContract; Program IN_EXECUTION; all three elements READY then DELIVERED with actual_headcount 20 each (so FINAL billable = max(ceil(20*0.85)=17, 20) = 20 and variance_pct = 0.00 on every line)."
            - "Program COMPLETED by bubble-up, reconciliation opened, all three lines APPROVED without a variance reason."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/venues"
              payload: { name: "Old Customs House", capacity_seated: 200, capacity_reception: 400, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Coastline Experiences Inc", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Halberd Capital", group_name: "Partner Offsite", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 60, markup_pct: 0.175 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Morning Kayak Clinic", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 2001, is_weather_dependent: false, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el1: $.data.id }
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v2: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Afternoon Studio Tour", starts_at: "2026-09-11T12:30:00Z", ends_at: "2026-09-11T14:30:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 2001, is_weather_dependent: false, expected_program_version: "${prog_v2}" }
              as: ProgramDirector
              captures: { el2: $.data.id }
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v3: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Evening Rooftop Tasting", starts_at: "2026-09-11T16:00:00Z", ends_at: "2026-09-11T18:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 2001, is_weather_dependent: false, expected_program_version: "${prog_v3}" }
              as: ProgramDirector
              captures: { el3: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 120060, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
            - call: "POST /dmc/supplier-contracts/${ctr_id}/countersign"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-signer-2"
            - call: "POST /dmc/programs/${prog_id}/lock-design"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/start-execution"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /dmc/program-elements/${el1}/mark-ready"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /dmc/program-elements/${el2}/mark-ready"
              payload: {}
