  # ============================================================ cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: banner_publish_occ_stale_then_fresh
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[banner-publish-stale-property]", "errors[ERR_STALE_PROPERTY_VERSION]"]
        distinguishing_aspect: "Publish with the pre-publish version after a successful publish is rejected 412; re-reading the version and retrying succeeds; each publish increments Property.version by exactly 1."
        test_recipe:
          setup: ["Property P (version 1); ACTIVE policy US-CA; configs A and B (DRAFT)"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id, pv: $.data.version } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ANALYTICS"], config_label: "A" }, as: PrivacyAdmin, captures: { cfgA: $.data.id } }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ANALYTICS"], config_label: "B" }, as: PrivacyAdmin, captures: { cfgB: $.data.id } }
          trigger:
            - { call: "POST /v1/banner-configs/${cfgA}/publish", payload: { expected_property_version: "${pv}" }, as: PrivacyAdmin, captures: { stA: $.data.status } }
            - { call: "POST /v1/banner-configs/${cfgB}/publish", payload: { expected_property_version: "${pv}" }, as: PrivacyAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /v1/properties/${prop}", as: Any, captures: { pv2: $.data.version } }
            - { call: "POST /v1/banner-configs/${cfgB}/publish", payload: { expected_property_version: "${pv2}" }, as: PrivacyAdmin, captures: { stB: $.data.status } }
          assert:
            - "stA == PUBLISHED (fresh version 1 accepted)"
            - "err == ERR_STALE_PROPERTY_VERSION (HTTP 412) — same stale version reused after A's publish bumped it"
            - "pv2 == 2 (publish bumped version by exactly 1)"
            - "stB == PUBLISHED after re-reading the version"

      - name: sod_scan_creator_cannot_confirm_own
        claim_type: segregation_of_duties
        grounds: ["validations[priority=17]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]"]
        distinguishing_aspect: "The ComplianceAuditor whose X-User-ID created the scan cannot confirm its violations; a different auditor can."
        test_recipe:
          setup: ["Property P; scan by aud-1 run with one rogue tracker -> OPEN finding"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-06-01T10:00:00Z", duration_minutes: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { scan: $.data.id } }
            - { call: "POST /v1/tag-audit-scans/${scan}/run", payload: { observed_trackers: [{ tracker_signature: "rogue.com", purpose_category: "ADVERTISING" }] }, as: ComplianceAuditor, as_user_id: "aud-1" }
            - { call: "GET /v1/tag-audit-scans/${scan}/findings", as: Any, captures: { f1: "$.data[0].id" } }
          trigger:
            - { call: "PUT /v1/tracker-findings/${f1}", payload: { status: "CONFIRMED_VIOLATION" }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { err: $.data.error_id } }
            - { call: "PUT /v1/tracker-findings/${f1}", payload: { status: "CONFIRMED_VIOLATION" }, as: ComplianceAuditor, as_user_id: "aud-2", captures: { st: $.data.status, by: $.data.confirmed_by_user_id } }
          assert: ["err == ERR_SEGREGATION_OF_DUTIES_VIOLATION (HTTP 403)", "st == CONFIRMED_VIOLATION", "by == 'aud-2'"]

      - name: scan_run_dedup_and_clean_tracker
        claim_type: cascading_side_effects
        grounds: [state_machines.TagAuditScan.SCHEDULED_to_COMPLETED, entities.TrackerFinding]
        distinguishing_aspect: "Detection: duplicate observations of the same signature yield one finding; a tracker matching an APPROVED vendor's declared purpose yields none; unknown tracker -> single UNAUTHORIZED HIGH finding with vendor_id null."
        test_recipe:
          setup: ["Property P; APPROVED vendor V declaring ['ok-1.com'] for ADVERTISING"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "OK", declared_purposes: ["ADVERTISING"], tracker_signatures: ["ok-1.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-06-01T10:00:00Z", duration_minutes: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { scan: $.data.id } }
          trigger:
            - { call: "POST /v1/tag-audit-scans/${scan}/run", payload: { observed_trackers: [{ tracker_signature: "ok-1.com", purpose_category: "ADVERTISING" }, { tracker_signature: "ok-1.com", purpose_category: "ADVERTISING" }, { tracker_signature: "sneaky.com", purpose_category: "ANALYTICS" }] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { fc: $.data.findings_created_count, uc: $.data.unauthorized_findings_count } }
            - { call: "GET /v1/tag-audit-scans/${scan}/findings", as: Any, captures: { vt: "$.data[0].violation_type", sev: "$.data[0].severity", vid: "$.data[0].vendor_id" } }
          assert: ["fc == 1 (dup ok-1.com observations and the clean match produce no finding)", "uc == 1", "vt == UNAUTHORIZED_TRACKER", "sev == HIGH", "vid == null"]

      - name: gpc_off_does_not_regrant
        claim_type: cascading_side_effects
        grounds: [state_machines.ConsentRecord.GRANTED_to_WITHDRAWN, calculations.effective_consent_resolution]
        distinguishing_aspect: "GPC OFF clears sale_share_opted_out but never resurrects cascaded withdrawals: the record stays WITHDRAWN and preview reports EXPLICIT_WITHDRAWN."
        test_recipe:
          setup: ["Property P; ACTIVE policy US-CA gpc_honored true; ADULT visitor with GRANTED SALE_SHARE; GPC ON (cascaded); then GPC OFF"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_OUT_ALLOWED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "off@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1988-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "SALE_SHARE" }, as: Visitor, as_user_id: "${vis}", captures: { rec: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors/${vis}/gpc-signals", payload: { signal: "ON" }, as: Visitor, as_user_id: "${vis}" }
          trigger:
            - { call: "POST /v1/visitors/${vis}/gpc-signals", payload: { signal: "OFF" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "GET /v1/visitors/${vis}", as: Any, captures: { opted: $.data.sale_share_opted_out, gpc: $.data.gpc_effective } }
            - { call: "GET /v1/consent-records/${rec}", as: Any, captures: { st: $.data.status } }
            - { call: "GET /v1/visitors/${vis}/consent-preview", payload: { purpose_category: "SALE_SHARE" }, as: Any, captures: { dec: $.data.decision } }
          assert: ["gpc == OFF and opted == false", "st == WITHDRAWN (no automatic re-grant)", "dec == EXPLICIT_WITHDRAWN (latest record governs once GPC is OFF)"]

      - name: default_clock_pinned
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Without any set_current_utc call the logical clock is exactly 2026-05-01T00:00:00Z — a visitor created first has that created_at, never wall-clock."
        test_recipe:
          setup: ["empty database, clock never set"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
          trigger:
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "clk@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { ca: $.data.created_at } }
          assert: ["ca == '2026-05-01T00:00:00Z'"]

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_corner
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: "compensating_invariant / grant_withdraw_regrant_counter_conservation"
          rationale: "Counter visibility immediately after each mutation is asserted there step by step."
