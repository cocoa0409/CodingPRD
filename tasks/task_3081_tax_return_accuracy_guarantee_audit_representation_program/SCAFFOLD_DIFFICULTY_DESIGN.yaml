              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 1000, penalty_cents: 0, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
              captures: { cl1: $.data.id }
            - call: "POST /tax/claims/${cl1}/scope"
              payload: { scope: "IN_SCOPE", error_attribution: "PREPARER_ERROR" }
              as: CaseManager
              as_user_id: "cm-A"
            - call: "POST /tax/agents"
              payload: { full_name: "Agent One", license_number: "EA-001", max_parallel: 3 }
              as: ProgramAdmin
              captures: { ag1: $.data.id }
            - call: "POST /tax/claims/${cl1}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-09-12T00:00:00Z", window_end: "2026-12-12T00:00:00Z" }
              as: CaseManager
            - call: "POST /tax/claims/${cl1}/poa"
              payload: { agent_id: "${ag1}", expires_at: "2027-06-01T00:00:00Z" }
              as: CaseManager
              captures: { poav1: $.data.version }
            - call: "POST /tax/claims/${cl1}/poa/execute"
              payload: { expected_poa_version: "${poav1}" }
              as: CaseManager
          trigger:
            - call: "POST /tax/claims/${cl1}/resolve"
              payload: {}
              as: CaseManager
              as_user_id: "cm-B"
              captures: { err: $.data.error_id }
            - call: "POST /tax/notices/${n1}/pay"
              payload: {}
              as: OfficeManager
