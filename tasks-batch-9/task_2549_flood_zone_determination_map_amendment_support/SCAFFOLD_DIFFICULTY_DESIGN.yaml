              captures: { n2_id: $.data.id, n2_deadline: $.data.response_deadline_at }
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/compliance-notices"
              payload: { loan_folio_id: "${f_a_id}", determination_id: "${det_a_id}", notice_type: "MANDATORY_PURCHASE", annual_premium_rate_cents: 288000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { n3_id: $.data.id, n3_deadline: $.data.response_deadline_at }
          assert:
