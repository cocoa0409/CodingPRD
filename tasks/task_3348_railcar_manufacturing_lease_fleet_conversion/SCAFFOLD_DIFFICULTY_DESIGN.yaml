- rule_id: resource_temporal_overlap
  instances:
  - name: shop_line_half_open_touching_windows_allowed
    grounds:
    - validations[priority=10]
    - state_machines.LeaseFleetCar.HELD_to_UNDER_REPAIR
    - state_machines.RetrofitWorkOrder.SCHEDULED_to_IN_PROGRESS
    - entities.RetrofitWorkOrder.fields.shop_line
    - entities.RetrofitWorkOrder.fields.scheduled_start_date
    - entities.RetrofitWorkOrder.fields.scheduled_end_date
    - entities.RetrofitWorkOrder.fields.shop_days
    - calculations.retrofit_program_cost_allocation
    - calculations.lease_fleet_capital_allocation
    - entities.LeaseContract.fields.capital_allocation_cents
    distinguishing_aspect: 'The occupied resource is RetrofitWorkOrder.shop_line and its windows are PURE
      half-open

      intervals [scheduled_start_date, scheduled_end_date) with no buffer: the incumbent

      [2026-10-01, 2026-10-11) on shop_line SHOP-R8A and the request [2026-10-11, 2026-10-21) have an

      empty intersection, so the request is ACCEPTED (201), while [2026-10-10, 2026-10-20) is REJECTED

      409 ERR_SHOP_SLOT_OVERLAP because it intersects the incumbent over exactly the one day 2026-10-10.

      Adjacency is legal here, the opposite geometric treatment from the sibling placement instance,

      whose LeaseFleetCar resource additionally demands a one-day gap.

      '
    test_recipe:
      setup:
      - Logical clock pinned at 2026-09-01T00:00:00Z (the scaffold's startup default); database empty.
      - 'Car type R8A-100 (BOXCAR, build_hours 10, regulatory_life_years 40, line_count_family R8A_LINE)
        with one WHEELSET bill-of-material row: component R8A-WS at qty_per_car 4, unit_cost_cents 100000,
        lead_time_days 20, on_hand_qty 100. Worst gated lead = ceil(20 / 4) = 5 days, so the 19-day horizon
        2026-09-01..2026-09-20 passes the §1.3 production_feasibility_gate.'
      - 'A RETAINED production order for 2 cars (planned_shop_days 20 = build_hours 10 * quantity 2) is
        reserved, released against the ACTIVE contract, changed over on line R8A_LINE for [2026-09-05,
        2026-09-25) (width 20 = planned_shop_days), and completed on 2026-09-25 with completed_qty 2:
        two LeaseFleetCars in status HELD, both with built_date 2026-09-25, regulatory_life_end_date 2066-09-25
        and acquisition_cost_cents 875000. The two rows are interchangeable, so the captured order of
        data[0]/data[1] is immaterial.'
      - Lessee plus a FULL_SERVICE contract (per_diem_rate_cents 5000, liability_bearer LESSOR, term 2026-09-01..2027-09-01,
        fleet_car_cap 10) in status ACTIVE; after completion LeaseContract.capital_allocation_cents ==
        122500 (retained_cars = 2 live cars of this order; capital_cents = 2 * 875000 = 1750000; lessor_equity_cents
        = floor(1750000 * min(700, 900) / 10000) = 122500).
      - A retrofit program R8A-MANDATE stays in status PLANNED (never started), so neither car is enrolled
        in an IN_PROGRESS program and both remain eligible for the HELD -> UNDER_REPAIR transition; it
        covers car type R8A-100 through a RetrofitProgramCarType row, has required_shop_days_per_car 10
        and compliance_deadline_date 2026-12-31 (every window ends on or before it).
      - Work order A already occupies shop_line SHOP-R8A for [2026-10-01, 2026-10-11) (shop_days 10) against
