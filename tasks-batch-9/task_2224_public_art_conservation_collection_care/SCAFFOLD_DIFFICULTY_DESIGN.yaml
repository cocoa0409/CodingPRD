scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: priority_score_single_assessment_vs_cycle_cohort_variant
        grounds:
          - calculations.treatment_priority_score
          - calculations.condition_index_score
          - entities.Artwork.fields.treatment_priority_score
          - entities.Artwork.fields.priority_basis
          - state_machines.ConditionAssessment.SUBMITTED_to_FINALIZED
          - endpoints["POST /public-art/ops/run-cycle"]
        distinguishing_aspect: |
          Dual variance sits on the Artwork domain (curatorial triage): the same FINALIZED survey scores
          75.38 under variant single_assessment (days_deferred pinned to 0 at finalization) and 118.79
          under variant cycle_cohort (days_deferred measured from assessed_on 2026-03-10 to the clock
          2026-08-01, i.e. 144 days), a 43.41-point divergence on byte-identical stored data.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "one living artist, one URBAN site with capacity_units 20, one BRONZE LANDMARK artwork of footprint 6 installed there"
            - "one ConditionAssessment for cycle_year 2026 assessed_on 2026-03-10 with subscores 2/2/1/1/1, three photos attached, status SUBMITTED by user surv-1"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20, concurrent_work_capacity: 1 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001", recognized_stature: false }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/condition-assessments"
              payload: { artwork_id: "${artwork_id}", cycle_year: 2026, assessed_on: "2026-03-10", surface_score: 2, structural_score: 2, coating_score: 1, mount_score: 1, graffiti_score: 1 }
              as: ConditionSurveyor
              as_user_id: "surv-1"
              captures: { assess_id: $.data.id }
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "FRONT", media_ref: "media/2024.001/front.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "SIDE", media_ref: "media/2024.001/side.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "DETAIL", media_ref: "media/2024.001/detail.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/submit"
              payload: { surveyor_note: "cycle 2026 survey complete" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
          trigger:
            - call: "POST /public-art/condition-assessments/${assess_id}/finalize"
              payload: { finalization_note: "accepted" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "POST /public-art/ops/run-cycle"
              payload: { cycle_year: 2026 }
              as: PublicArtManager
              as_user_id: "mgr-1"
          assert:
            - "ConditionAssessment.${assess_id}.condition_index == 59.8"
            - "ConditionAssessment.${assess_id}.recommendation == ROUTINE"
            - "Artwork.${artwork_id}.treatment_priority_score == 75.38 immediately after the finalize call"
            - "Artwork.${artwork_id}.priority_basis == SINGLE_ASSESSMENT immediately after the finalize call"
            - "Artwork.${artwork_id}.treatment_priority_score == 118.79 after the run-cycle call"
            - "Artwork.${artwork_id}.priority_basis == CYCLE_COHORT after the run-cycle call"
            - "Artwork.${artwork_id}.conservation_status == MONITORED throughout (59.8 is not below 55.0)"

      - name: claim_settlement_acv_vs_restoration_variant
        grounds:
          - calculations.claim_settlement_cents
          - calculations.proposal_estimate_total_cents
          - entities.DamageIncident.fields.claim_basis
          - entities.DamageIncident.fields.settlement_cents
          - state_machines.DamageIncident.NONE_to_FILED
          - state_machines.TreatmentProposal.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Dual variance sits on the DamageIncident domain (insurance recovery), a different entity domain
          from the Artwork priority score: two incidents carrying identical damage_extent_pct 0.35 on the
          same artwork settle at 3045810 under variant acv (age-depreciated insured value) and 433269
          under variant restoration (pinned repair estimate), because the two variants read disjoint fields.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "BRONZE LANDMARK artwork insured for 12000000 cents, acquired 2014-06-01"
            - "an APPROVED TreatmentProposal on that artwork whose pinned_estimate_total_cents is 683269, funded by a RESERVED allocation of 700000 cents from an ENDOWMENT pool"
            - "two DamageIncident rows on that artwork, both damage_status TRIAGED with damage_extent_pct 0.35; the second carries linked_proposal_id pointing at the approved proposal"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20, concurrent_work_capacity: 1 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001", recognized_stature: false }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/conservators"
              payload: { firm_name: "Patina Studio", accreditation: "AIC_PA", material_specialties: ["BRONZE", "STONE"], hourly_rate_cents: 14500, insurance_expires_on: "2027-01-31" }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /public-art/condition-assessments"
              payload: { artwork_id: "${artwork_id}", cycle_year: 2026, assessed_on: "2026-07-15", surface_score: 3, structural_score: 2, coating_score: 2, mount_score: 1, graffiti_score: 2 }
              as: ConditionSurveyor
              as_user_id: "surv-1"
              captures: { assess_id: $.data.id }
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "FRONT", media_ref: "media/a/1.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "SIDE", media_ref: "media/a/2.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "DETAIL", media_ref: "media/a/3.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/submit"
              payload: { surveyor_note: "condition poor" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/finalize"
              payload: { finalization_note: "treatment required" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "GET /public-art/artworks/${artwork_id}"
              payload: {}
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { aw_v: $.data.version }
            - call: "POST /public-art/treatment-proposals"
              payload: { artwork_id: "${artwork_id}", conservator_id: "${cons_id}", assessment_id: "${assess_id}", treatment_scope: "COATING", engagement_start: "2026-09-01T00:00:00Z", engagement_end: "2026-09-05T00:00:00Z", expected_artwork_version: "${aw_v}", alters_appearance: false }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { prop_id: $.data.id }
            - call: "POST /public-art/treatment-proposals/${prop_id}/line-items"
              payload: { labor_hours: 12.5, complexity_class: "COATING", materials_cents: 82500, description: "recoat and wax" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "POST /public-art/treatment-proposals/${prop_id}/line-items"
              payload: { labor_hours: 12.5, complexity_class: "SURFACE", materials_cents: 15000, description: "surface cleaning" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "POST /public-art/treatment-proposals/${prop_id}/submit"
              payload: { submitter_note: "for approval" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-2026", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 400000000, draw_rate_bps: 450 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pool_id: $.data.id, pool_v: $.data.version }
            - call: "POST /public-art/funding-allocations"
              payload: { pool_id: "${pool_id}", purpose: "TREATMENT", amount_cents: 700000, expected_pool_version: "${pool_v}", proposal_id: "${prop_id}" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /public-art/treatment-proposals/${prop_id}/approve"
              payload: { approval_note: "proceed" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/damage-incidents"
              payload: { artwork_id: "${artwork_id}", incident_type: "VANDALISM", damage_extent_pct: 0.35, narrative: "Gouging and paint loss on torso" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { inc_acv: $.data.id }
            - call: "POST /public-art/damage-incidents/${inc_acv}/triage"
              payload: { triage_class: "CONSERVATOR_TREATMENT" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "POST /public-art/damage-incidents"
              payload: { artwork_id: "${artwork_id}", incident_type: "VANDALISM", damage_extent_pct: 0.35, narrative: "Second strike, same measured extent", linked_proposal_id: "${prop_id}" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { inc_rest: $.data.id }
            - call: "POST /public-art/damage-incidents/${inc_rest}/triage"
              payload: { triage_class: "CONSERVATOR_TREATMENT" }
              as: ChiefConservator
              as_user_id: "chief-1"
          trigger:
            - call: "POST /public-art/damage-incidents/${inc_acv}/file-claim"
              payload: { claim_basis: "ACV", credited_pool_id: "${pool_id}", policy_note: "actual cash value basis" }
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "POST /public-art/damage-incidents/${inc_rest}/file-claim"
              payload: { claim_basis: "RESTORATION", credited_pool_id: "${pool_id}", policy_note: "restoration cost basis" }
              as: FinanceOfficer
              as_user_id: "fin-1"
          assert:
            - "TreatmentProposal.${prop_id}.pinned_estimate_total_cents == 683269"
            - "DamageIncident.${inc_acv}.claimed_gross_cents == 3295810"
            - "DamageIncident.${inc_acv}.settlement_cents == 3045810"
            - "DamageIncident.${inc_rest}.claimed_gross_cents == 683269"
            - "DamageIncident.${inc_rest}.settlement_cents == 433269"
            - "DamageIncident.${inc_acv}.settlement_cents != DamageIncident.${inc_rest}.settlement_cents on identical damage_extent_pct"

  - rule_id: combinatorial_formula
    instances:
      - name: estimate_rounds_each_line_then_sums_mode_b
        grounds:
          - calculations.proposal_estimate_total_cents
          - entities.TreatmentProposal.fields.subtotal_cents
          - entities.TreatmentProposal.fields.overhead_cents
          - entities.TreatmentProposal.fields.contingency_cents
          - endpoints["POST /public-art/treatment-proposals/{id}/line-items"]
        distinguishing_aspect: |
          Mode (b) nested rounding: both lines cost 181250 * factor, landing on exact half cents
          (226562.5 and 208437.5). Rounding per line then summing yields subtotal 532501 and total
          683269; summing raw products then rounding yields 532500 and 683268. The scaffold pins
          round-per-line-then-sum, and contingency is taken on (subtotal + overhead), not on subtotal.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "conservator Patina Studio at 14500 cents/hour, specialties BRONZE and STONE"
            - "a DRAFT TreatmentProposal on a BRONZE artwork with exactly one line already added: 12.5 h COATING plus 82500 cents of materials"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
