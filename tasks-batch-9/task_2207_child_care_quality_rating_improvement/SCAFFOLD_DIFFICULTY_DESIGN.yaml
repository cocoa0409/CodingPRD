  - rule_id: resource_temporal_overlap
    instances:
      - name: observer_half_open_window_adjacency_across_providers
        grounds:
          - validations[priority=41]
          - entities.ObservationVisit.fields.window_start
          - entities.ObservationVisit.fields.window_end
          - entities.Observer.fields.status
        distinguishing_aspect: |
          Resource = Observer; interval semantics = HALF-OPEN [window_start, window_end) with
          NO buffer because the colliding visits belong to different providers: a new window
          starting exactly at 2026-08-10T17:00:00Z, the instant the existing visit ends, is
          ACCEPTED (201), while a window starting one second earlier at
          2026-08-10T16:59:59Z is REJECTED with 409 ERR_OBSERVER_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00Z"
            - "all 5 StandardDomain rows exist with weights 0.20 each"
            - "one RELIABLE Observer obs_a certified_until 2027-06-30"
            - "Provider B holds a SCHEDULED visit led by obs_a occupying [2026-08-10T09:00:00Z, 2026-08-10T17:00:00Z)"
            - "Provider A and Provider C each hold a cycle in DOCS_VERIFIED, ready to schedule"
            - "A, B and C are three DIFFERENT providers, so the 48-hour same-provider cool-down clause of priority 41 is inert and only the geometric half-open test applies"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateAdministrator
              as_user_id: "admin-1"
