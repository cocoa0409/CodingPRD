              captures: { a1_id: "$.data.id" }
            - call: "GET /pressure-injury-cases?skin_assessment_id=${a1_id}"
              payload: {}
              as: WocProgramDirector
              captures: { k1_id: "$.data[0].id" }
          trigger:
            - call: "GET /patients/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: WocProgramDirector
              captures: { err_patient: "$.data.error_id" }
            - call: "GET /woc-nurses/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: WocProgramDirector
              captures: { err_nurse: "$.data.error_id" }
            - call: "GET /consult-requests/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: WocProgramDirector
              captures: { err_consult: "$.data.error_id" }
