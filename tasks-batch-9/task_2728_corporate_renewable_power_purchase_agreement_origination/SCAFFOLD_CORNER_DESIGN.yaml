            - "GET /ppa/deals/${deal_id}/allocations then lists exactly three rows - CONFIRMED 15.000, WITHDRAWN 15.000 and CONFIRMED 10.000 - and only the two CONFIRMED rows enter the aggregate"

      - name: execute_ladder_allocation_incomplete_then_support_shortfall_then_signed
        claim_type: cascading_validation
        grounds:
          - validations.priority_31_ERR_ALLOCATION_INCOMPLETE
          - validations.priority_32_ERR_CREDIT_SUPPORT_SHORTFALL
          - endpoints.POST_/ppa/deals/{id}/execute
          - endpoints.POST_/ppa/offtakers/{id}/rating-change
          - calculations.credit_support_requirement
        distinguishing_aspect: |
          One execute attempt violates two business-fiscal rules at once and must report
          only the lower-priority-number one, so the operator has to clear them in
          order: allocation completeness at 31, then collateral coverage at 32. The
          shortfall exists only because a SAME-BAND rating change re-sizes the
          requirement without re-opening credit_status - a downgrade across a band
          would set credit_status SUPPORT_SHORTFALL and be intercepted earlier by the
          priority-8 state gate, so this is the single path on which the deal can sit at
          APPROVED while under-collateralised. The third attempt succeeds with equality
          between posted and required, and the CP set is built from a PRE_DEVELOPMENT
          project, so signing precedes permitting by design.
