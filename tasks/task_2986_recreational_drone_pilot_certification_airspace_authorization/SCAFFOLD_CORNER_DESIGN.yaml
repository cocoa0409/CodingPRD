# §1.9 Scaffold Corner Design - breadth probe over the claim-extraction guide's nine
# sections. Every `section:` value below is one of the guide's nine sections and every
# `claim_type:` is a row from that section's table. Instances whose corner is already
# asserted by §1.8 carry an `excluded_because:` stub naming the difficulty instance and
# no `test_recipe`. All names are unique across SCAFFOLD_DIFFICULTY_DESIGN.yaml and this
# file. Non-applicable guide rows (bulk_action, soft_delete, idempotency-key, pagination
# cursors, multi_tenancy, scheduled_actions, feature flags, eventual/saga consistency,
# approval_chain/hierarchical_override/delegated_authority role models, and the
# algorithm_type-specific rows this scaffold's §1.3 does not declare) are skipped.
scaffold_corner_design:

  - section: entities
    instances:
      - name: pilot_creation_returns_declared_defaults_and_server_stamped_fields
        claim_type: creation
        grounds:
          - endpoints.POST_/drone-ops/pilots
          - entities.Pilot
          - entities.Pilot.fields.status
          - response_envelope
        distinguishing_aspect: |
          The single POST that needs no prior domain state. Locks the 201 body: every
          `source: computed` counter at its declared default, every optional datetime null,
          and the four common fields server-stamped from the logical clock - so a creation
          that quietly returns status CERTIFIED, risk_score null or version 0 fails here.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ada Ferrer", email: "ada.ferrer@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { echoed_status: $.data.status }
          assert:
            - "HTTP 201; envelope is { meta: { api_request_id, api_request_timestamp }, response_type: \"object\", data: {...} }"
            - "data.status == \"UNCERTIFIED\", data.operator_category == \"RECREATIONAL\", data.full_name == \"Ada Ferrer\", data.email == \"ada.ferrer@example.com\""
            - "data.risk_score == 0, data.knowledge_attempt_count == 0, data.open_waiver_count == 0"
            - "data.certified_at, data.currency_expires_at, data.currency_basis, data.last_completed_flight_end and data.suspension_reason are all null"
            - "data.version == 1 and data.created_at == data.updated_at == \"2026-03-01T00:00:00Z\""
            - "the read-back ${echoed_status} == \"UNCERTIFIED\" - the GET reflects exactly what the POST returned"

      - name: get_airspace_zone_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints.GET_/drone-ops/airspace-zones/{id}
          - entities.AirspaceZone
        distinguishing_aspect: |
          Retrieval of a zone by id must echo every input field verbatim and the computed
          occupancy counter at its default 0 - a zone read that recomputes class_ceiling_ft
          or omits structure_relief_eligible (whose declared default is false) fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; one class D zone created with structure_relief_eligible omitted."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-D-READ", class_code: "D", class_ceiling_ft: 500, requires_authorization: true, max_concurrent_authorizations: 4 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
          trigger:
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: AirspaceAuthority
              captures: { got: $.data.designator }
          assert:
            - "HTTP 200 and ${got} == \"ZONE-D-READ\""
            - "data.class_code == \"D\", data.class_ceiling_ft == 500, data.requires_authorization == true, data.max_concurrent_authorizations == 4"
            - "data.structure_relief_eligible == false - the declared default, not null"
            - "data.reserved_slot_count == 0 and data.version == 1"
            - "data.id == ${zid} and data.created_at == \"2026-03-01T00:00:00Z\""

      - name: list_flights_paginates_with_limit_offset_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/drone-ops/flights
          - response_envelope
        distinguishing_aspect: |
          Three flights of one pilot, spaced 60 minutes apart so the 30-minute turnaround
          buffer never bites, are paged two at a time. Pins that total_count counts the whole
          filtered set (3) rather than the page (2), that has_more is derived from
          offset + returned < total_count, and that limit 0 is a 400 rather than a silent
          clamp to the default of 10.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-03-01T00:00:00Z with a REGISTERED 249 g airframe (max_altitude_ft 900)."
            - "One uncontrolled class G zone, class_ceiling_ft 400, requires_authorization false."
            - "Three RECREATIONAL-category PLANNED flights on 2026-03-05: 09:00-10:00, 11:00-12:00 and 13:00-14:00."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Bo Wexler", email: "bo.wexler@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 88 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Pager 1", serial_number: "SN-PAGE-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-PAGE", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 3 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-05T09:00:00Z", planned_end: "2026-03-05T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.50, launch_longitude: -122.20 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f1: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-05T11:00:00Z", planned_end: "2026-03-05T12:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.50, launch_longitude: -122.20 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f2: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-05T13:00:00Z", planned_end: "2026-03-05T14:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.50, launch_longitude: -122.20 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f3: $.data.id }
          trigger:
            - call: "GET /drone-ops/flights"
              payload: { pilot_id: "${pid}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /drone-ops/flights"
              payload: { pilot_id: "${pid}", limit: 2, offset: 2 }
              as: ComplianceOfficer
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /drone-ops/flights"
              payload: { pilot_id: "${pid}", limit: 0 }
              as: ComplianceOfficer
              captures: { bad_limit_error: $.data.error_id }
          assert:
            - "page 1: HTTP 200, response_type == \"array\", exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "the union of page 1 and page 2 ids is exactly {${f1}, ${f2}, ${f3}} with no row repeated across pages"
            - "${bad_limit_error} == \"ERR_INVALID_REQUEST\" with HTTP 400 - limit must be in 1..100, not silently clamped to the default 10"

      - name: get_pilot_with_an_unknown_id_returns_pilot_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/drone-ops/pilots/{id}
          - validations.priority_6
          - errors[ERR_PILOT_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid UUID that names no row must produce 404 ERR_PILOT_NOT_FOUND,
          not 200 with a null body and not 400 - path existence is priority 6, ahead of the
          body-shape rule at priority 7.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; exactly one unrelated pilot exists so the table is non-empty."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ivy Osei", email: "ivy.osei@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /drone-ops/pilots/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "${err} == \"ERR_PILOT_NOT_FOUND\" with HTTP 404 and response_type == \"error\""
            - "${msg} is a non-empty human-readable string"
            - "GET /drone-ops/pilots/${pid} still returns HTTP 200 - the miss did not disturb the existing row"

      - name: create_aircraft_without_takeoff_weight_is_rejected_as_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/drone-ops/aircraft
          - entities.Aircraft.fields.takeoff_weight_g
          - validations.priority_7
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          takeoff_weight_g has `source: input` and no default, and it is the sole input of
          calculations.aircraft_remote_id_requirement - so omitting it must be a 400 at
          priority 7 rather than defaulting to 0 and silently minting an exempt airframe.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; one RECREATIONAL pilot exists."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ken Aoki", email: "ken.aoki@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Stub 1", serial_number: "SN-REQ-01", max_altitude_ft: 400 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_weight: $.data.error_id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "   ", serial_number: "SN-REQ-02", takeoff_weight_g: 900, max_altitude_ft: 400 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_blank: $.data.error_id }
          assert:
            - "${err_weight} == \"ERR_INVALID_REQUEST\" with HTTP 400"
            - "${err_blank} == \"ERR_INVALID_REQUEST\" with HTTP 400 - a whitespace-only model is blank, not a 1..80 char string"
            - "GET /drone-ops/aircraft?owner_pilot_id=${pid} returns total_count == 0 - neither rejected request persisted a row"

      - name: flight_creation_applies_the_declared_field_defaults
        claim_type: defaults
        grounds:
          - endpoints.POST_/drone-ops/flights
          - entities.Flight.fields.over_people
          - entities.Flight.fields.investigation_status
          - entities.Flight.fields.logged_minutes
        distinguishing_aspect: |
          A flight created with all three special-operation flags omitted must read back
          false/false/false - not null - because the waiver gate at priority 23 keys on
          exactly those booleans; and the derived counters start at their declared defaults
          (status PLANNED, investigation_status NONE, logged_minutes 0, altitude_exceedance
          false) with covering_policy_id null because a RECREATIONAL flight never runs the
          covering-policy selector.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-03-01T00:00:00Z with a REGISTERED 249 g airframe and one uncontrolled class G zone."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 75 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Default 1", serial_number: "SN-DEF-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-DEF", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
          trigger:
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-06T09:00:00Z", planned_end: "2026-03-06T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.61, launch_longitude: -122.33 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id, st: $.data.status }
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { pc_result: $.data.result }
          assert:
            - "${st} == \"PLANNED\" - the declared initial status"
            - "data.over_people == false, data.night_operation == false, data.beyond_visual_line_of_sight == false"
            - "data.investigation_status == \"NONE\", data.logged_minutes == 0, data.altitude_exceedance == false"
            - "data.covering_policy_id, data.authorization_id, data.waiver_id, data.actual_start, data.actual_end, data.max_altitude_reached_ft, data.incident_occurred, data.incident_summary and data.cancellation_reason are all null"
            - "the PreflightCheck created with no body reads acknowledged_tfr_ids == [] (declared default) and ${pc_result} == \"PASSED\""

      - name: knowledge_test_attempt_number_and_passed_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - endpoints.POST_/drone-ops/knowledge-tests/{id}/grade
          - calculations.knowledge_test_pass_determination
          - entities.KnowledgeTest.fields.attempt_number
          - entities.Pilot.fields.knowledge_attempt_count
        distinguishing_aspect: |
          Neither attempt_number, passed nor status is ever client-supplied: the grade
          endpoint accepts only raw_score. A 69 against PASS_SCORE_PART107 70 must FAIL and
          return the pilot to UNCERTIFIED so a second test can be scheduled with
          attempt_number 2, and 70 exactly must PASS because the comparison is inclusive.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; one COMMERCIAL pilot in UNCERTIFIED."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Omar Diallo", email: "omar.diallo@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { kt1: $.data.id, attempt1: $.data.attempt_number }
            - call: "POST /drone-ops/knowledge-tests/${kt1}/grade"
              payload: { raw_score: 69 }
              as: ComplianceOfficer
              captures: { st1: $.data.status, passed1: $.data.passed }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-02T00:00:00Z" }
              as: ComplianceOfficer
              captures: { kt2: $.data.id, attempt2: $.data.attempt_number }
            - call: "POST /drone-ops/knowledge-tests/${kt2}/grade"
              payload: { raw_score: 70 }
              as: ComplianceOfficer
              captures: { st2: $.data.status, passed2: $.data.passed }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { pilot_status: $.data.status, attempts: $.data.knowledge_attempt_count }
          assert:
            - "${attempt1} == 1 and ${attempt2} == 2 - attempt_number is computed per pilot, in scheduling order"
            - "${st1} == \"FAILED\", ${passed1} == false, and the pilot returns to UNCERTIFIED after the failing grade"
            - "${st2} == \"PASSED\" and ${passed2} == true - raw_score 70 == PASS_SCORE_PART107 passes on the inclusive comparison"
            - "${pilot_status} == \"CERTIFIED\" and ${attempts} == 2"
            - "both graded rows carry a graded_at of the logical clock at grading time and their raw_score is exactly the value submitted"

      - name: certification_number_and_issue_stamp_are_system_generated_on_pass
        claim_type: system_fields
        grounds:
          - state_machines.Certification
          - endpoints.GET_/drone-ops/certifications
          - entities.Certification.fields.certificate_number
          - entities.Certification.fields.issued_at
        distinguishing_aspect: |
          Certification has no POST endpoint at all: the row is minted as a side effect of the
          passing grade, so every one of its identity fields is `source: system`. Pins that
          issued_at is the logical clock at grading (not the test's scheduled_at), that
          originating_test_id back-references the test, and that the first certificate has
          supersedes_certification_id null.
        test_recipe:
          setup:
            - "Logical clock advanced from 2026-03-01T00:00:00Z to 2026-03-04T08:30:00Z between scheduling and grading."
            - "One RECREATIONAL pilot with one SCHEDULED TRUST_RECREATIONAL test."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Nia Okonjo", email: "nia.okonjo@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-03-02T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T08:30:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 100 }
              as: ComplianceOfficer
              captures: { kt_status: $.data.status }
            - call: "GET /drone-ops/certifications"
              payload: { pilot_id: "${pid}" }
              as: ComplianceOfficer
              captures: { cert_id: "$.data[0].id", cert_no: "$.data[0].certificate_number" }
          assert:
            - "${kt_status} == \"PASSED\" - TRUST_RECREATIONAL demands PASS_SCORE_TRUST 100 exactly"
            - "the list returns total_count == 1 and ${cert_no} is a non-empty server-minted string the client never supplied"
            - "data[0].pilot_id == ${pid}, data[0].originating_test_id == ${ktid}, data[0].supersedes_certification_id == null"
            - "data[0].category == \"RECREATIONAL\", data[0].status == \"ACTIVE\", data[0].issued_at == \"2026-03-04T08:30:00Z\" (the grading instant, not scheduled_at 2026-03-02T00:00:00Z)"
            - "data[0].expires_at == \"2028-03-04T08:30:00Z\" - issued_at plus CERT_VALIDITY_MONTHS 24, time-of-day preserved"
            - "GET /drone-ops/certifications/${cert_id} returns the same row with HTTP 200"

      - name: out_of_range_and_out_of_enum_values_are_rejected_on_creation
        claim_type: type_constraints
        grounds:
          - entities.Aircraft.fields.takeoff_weight_g
          - entities.AirspaceZone.fields.class_code
          - entities.SafetyCase.fields.ground_risk_class
          - validations.priority_7
        distinguishing_aspect: |
          Range and enum closure, one field per declared constraint form: an integer above its
          upper bound (takeoff_weight_g 25001 against 1..25000), a latitude outside -90..90,
          and an enum member the scaffold never declares (class_code "F" against B|C|D|E|G).
          All three are priority-7 ERR_INVALID_REQUEST 400s, never 422s.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; one RECREATIONAL pilot exists."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Pia Halla", email: "pia.halla@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Overweight", serial_number: "SN-RNG-01", takeoff_weight_g: 25001, max_altitude_ft: 400 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_range: $.data.error_id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-F-BAD", class_code: "F", class_ceiling_ft: 500, requires_authorization: true, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { err_enum: $.data.error_id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-D-BAD", class_code: "D", class_ceiling_ft: 2400, requires_authorization: true, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { err_ceiling: $.data.error_id }
          assert:
            - "${err_range} == \"ERR_INVALID_REQUEST\" (HTTP 400) - 25001 exceeds the declared 1..25000 range"
            - "${err_enum} == \"ERR_INVALID_REQUEST\" (HTTP 400) - \"F\" is not a member of B|C|D|E|G"
            - "${err_ceiling} == \"ERR_INVALID_REQUEST\" (HTTP 400) - 2400 exceeds the declared 100..2000 range"
            - "GET /drone-ops/airspace-zones returns total_count == 0 - no partially-valid row was persisted"

      - name: preflight_check_rows_are_immutable_and_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.PreflightCheck
          - endpoints.GET_/drone-ops/flights/{id}/preflight-checks
          - state_machines.TemporaryFlightRestriction
        distinguishing_aspect: |
          PreflightCheck is the scaffold's only `common_fields: false` entity: it has no
          version, no update endpoint and no delete endpoint, and a re-check appends a second
          immutable row rather than mutating the first. A failing check leaves the flight in
          PLANNED, which is what makes two rows reachable at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-03-01T00:00:00Z, one REGISTERED 249 g airframe, one uncontrolled class G zone."
            - "One PLANNED RECREATIONAL-category flight on 2026-03-07 09:00-10:00."
            - "One ACTIVE total-ban TemporaryFlightRestriction on that zone covering 2026-03-07T08:00:00Z .. 2026-03-07T12:00:00Z."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ravi Menon", email: "ravi.menon@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 80 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Immutable 1", serial_number: "SN-IMM-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-IMM", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/tfrs"
              payload: { zone_id: "${zid}", reason: "Wildfire suppression aircraft operating.", effective_from: "2026-03-07T08:00:00Z", effective_until: "2026-03-07T12:00:00Z" }
              as: AirspaceAuthority
              captures: { tfrid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-07T09:00:00Z", planned_end: "2026-03-07T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.62, launch_longitude: -122.35 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { pc1_result: $.data.result, pc1_id: $.data.id }
            - call: "POST /drone-ops/tfrs/${tfrid}/lift"
              payload: {}
              as: AirspaceAuthority
              captures: { tfr_state: $.data.status }
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { pc2_result: $.data.result, pc2_id: $.data.id }
            - call: "GET /drone-ops/flights/${fid}/preflight-checks"
              payload: {}
              as: ComplianceOfficer
              captures: { first_result: "$.data[0].result" }
          assert:
            - "${pc1_result} == \"FAILED\" with the lifted TFR id ${tfrid} present in blocking_findings and in active_tfr_ids, and the flight is still PLANNED"
            - "${tfr_state} == \"LIFTED\" and ${pc2_result} == \"PASSED\", moving the flight PLANNED -> PREFLIGHT_CLEARED"
            - "${pc1_id} != ${pc2_id} and the list returns total_count == 2 - the second check appended a row instead of mutating the first"
            - "${first_result} == \"FAILED\" - the historical row is unchanged after the second check; PreflightCheck rows are append-only"
            - "no PreflightCheck payload carries a `version` field, and §1.5 declares no PUT, PATCH or DELETE for preflight-checks"

      - name: knowledge_test_creation_requires_an_existing_parent_pilot
        claim_type: parent_relationships
        grounds:
          - endpoints.POST_/drone-ops/pilots/{id}/knowledge-tests
          - entities.KnowledgeTest
          - validations.priority_6
        distinguishing_aspect: |
          KnowledgeTest is a child of Pilot addressed through a nested path. An unknown parent
          id must fail at priority 6 with ERR_PILOT_NOT_FOUND - before the body is even
          shape-checked, so a request that is ALSO missing test_code still reports the parent
          miss rather than ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; one unrelated pilot exists."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Tom Ilves", email: "tom.ilves@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /drone-ops/pilots/00000000-0000-4000-8000-0000000009ff/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_parent: $.data.error_id }
            - call: "POST /drone-ops/pilots/00000000-0000-4000-8000-0000000009ff/knowledge-tests"
              payload: { scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_parent_and_body: $.data.error_id }
          assert:
            - "${err_parent} == \"ERR_PILOT_NOT_FOUND\" with HTTP 404"
            - "${err_parent_and_body} == \"ERR_PILOT_NOT_FOUND\" - priority 6 (path existence) precedes priority 7 (body shape)"
            - "GET /drone-ops/knowledge-tests?pilot_id=${pid} returns total_count == 0 and the surviving pilot is still UNCERTIFIED"

      - name: flight_cannot_cite_another_pilots_airframe_across_the_reference_graph
        claim_type: graph
        grounds:
          - endpoints.POST_/drone-ops/flights
          - entities.Flight.fields.aircraft_id
          - entities.Aircraft.fields.owner_pilot_id
          - validations.priority_3
        distinguishing_aspect: |
          The topology is a graph: one Flight row points at a Pilot, an Aircraft, an
          AirspaceZone and optionally an AirspaceAuthorization, a Waiver and a policy. Cross
          -aggregate integrity is therefore not just FK existence - pilot B's airframe exists,
          so the request would pass priority 9, and must instead be stopped at priority 3 by
          ownership.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "Two COMMERCIAL pilots A and B, both CERTIFIED at 2026-03-01T00:00:00Z, each owning one REGISTERED 249 g airframe."
            - "One uncontrolled class G zone."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Alma Ruiz", email: "alma.ruiz@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pa: $.data.id }
            - call: "POST /drone-ops/pilots/${pa}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { kta: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${kta}/grade"
              payload: { raw_score: 90 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Bela Stark", email: "bela.stark@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pb: $.data.id }
            - call: "POST /drone-ops/pilots/${pb}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktb: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktb}/grade"
              payload: { raw_score: 90 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pa}", model: "Graph A", serial_number: "SN-GRA-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pa}"
              captures: { aca: $.data.id }
            - call: "POST /drone-ops/aircraft/${aca}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pb}", model: "Graph B", serial_number: "SN-GRB-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pb}"
              captures: { acb: $.data.id }
            - call: "POST /drone-ops/aircraft/${acb}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-GRAPH", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
          trigger:
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pa}", aircraft_id: "${acb}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-08T09:00:00Z", planned_end: "2026-03-08T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.63, launch_longitude: -122.36 }
              as: Pilot
              as_user_id: "${pa}"
              captures: { err_foreign_airframe: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pb}", aircraft_id: "${acb}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-08T09:00:00Z", planned_end: "2026-03-08T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.63, launch_longitude: -122.36 }
              as: Pilot
              as_user_id: "${pa}"
              captures: { err_foreign_pilot: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pa}", aircraft_id: "00000000-0000-4000-8000-0000000009aa", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-08T09:00:00Z", planned_end: "2026-03-08T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.63, launch_longitude: -122.36 }
              as: Pilot
              as_user_id: "${pa}"
              captures: { err_missing_airframe: $.data.error_id }
          assert:
            - "${err_foreign_airframe} == \"ERR_OWNERSHIP_VIOLATION\" with HTTP 403 - the airframe exists but belongs to pilot ${pb}"
            - "${err_foreign_pilot} == \"ERR_OWNERSHIP_VIOLATION\" with HTTP 403 - a body pilot_id that differs from X-User-ID is refused even when the airframe matches it"
            - "${err_missing_airframe} == \"ERR_AIRCRAFT_NOT_FOUND\" with HTTP 404 - an unresolvable FK is priority 9, a resolvable one owned by someone else is priority 3"
            - "GET /drone-ops/flights?pilot_id=${pa} and GET /drone-ops/flights?pilot_id=${pb} both return total_count == 0"

  - section: state_machines
    instances:
      - name: register_moves_an_airframe_from_pending_registration_to_registered
        claim_type: valid_transition
        grounds:
          - state_machines.Aircraft
          - endpoints.POST_/drone-ops/aircraft/{id}/register
          - entities.Aircraft.fields.registration_number
        distinguishing_aspect: |
          The happy path of the one transition every flight depends on. A 249 g airframe is
          exempt from remote ID, so the registration succeeds with no RemoteIdModule row at
          all - which pins that the priority-20 gate is conditional on remote_id_required
          rather than unconditional.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z; one COMMERCIAL pilot in UNCERTIFIED (certification is not a precondition of registration)."
            - "One Aircraft in PENDING_REGISTRATION, takeoff_weight_g 249, with no RemoteIdModule."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ines Vogel", email: "ines.vogel@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Regmark 1", serial_number: "SN-REG-01", takeoff_weight_g: 249, max_altitude_ft: 800 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id, initial_status: $.data.registration_status, v_before: $.data.version }
          trigger:
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
              captures: { after: $.data.registration_status, regno: $.data.registration_number, v_after: $.data.version }
          assert:
            - "${initial_status} == \"PENDING_REGISTRATION\" and ${after} == \"REGISTERED\""
            - "${regno} is a non-empty server-minted string; it was null before the transition"
            - "data.remote_id_required == false and data.grounding_reason == null"
            - "${v_after} == ${v_before} + 1 and updated_at == \"2026-04-01T00:00:00Z\""
            - "GET /drone-ops/remote-id-modules?aircraft_id=${acid} returns total_count == 0 - registration needed no module"

      - name: module_verification_enforces_its_from_state_precondition
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RemoteIdModule
          - endpoints.POST_/drone-ops/remote-id-modules/{id}/verify
          - errors[ERR_MODULE_INVALID_STATE]
        distinguishing_aspect: |
          verify is declared only from VERIFICATION_PENDING. Both neighbours of that state are
          probed: UNVERIFIED (before submission) and VERIFICATION_FAILED (after a rejection),
          and each must be a 409 that leaves the module's status untouched - so an
          implementation that treats verify as an unconditional setter fails twice.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "One COMMERCIAL pilot, one Aircraft of 900 g in PENDING_REGISTRATION (remote_id_required true), one RemoteIdModule in UNVERIFIED."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Yuki Sato", email: "yuki.sato@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Heavy 1", serial_number: "SN-MOD-01", takeoff_weight_g: 900, max_altitude_ft: 800 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id, rid_required: $.data.remote_id_required }
            - call: "POST /drone-ops/aircraft/${acid}/remote-id-modules"
              payload: { module_serial: "MOD-0001", broadcast_protocol: "WIFI_NAN", firmware_version: "1.4.2" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { mid: $.data.id, mod_initial: $.data.status }
          trigger:
            - call: "POST /drone-ops/remote-id-modules/${mid}/verify"
              payload: { outcome: "VERIFIED", verified_until: "2027-04-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_from_unverified: $.data.error_id }
            - call: "POST /drone-ops/remote-id-modules/${mid}/submit-verification"
              payload: { broadcast_sample_ref: "SAMPLE-A" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { pending_status: $.data.status }
            - call: "POST /drone-ops/remote-id-modules/${mid}/verify"
              payload: { outcome: "FAILED", failure_reason: "Broadcast sample lacked a serial field." }
              as: ComplianceOfficer
              captures: { failed_status: $.data.status }
            - call: "POST /drone-ops/remote-id-modules/${mid}/verify"
              payload: { outcome: "VERIFIED", verified_until: "2027-04-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_from_failed: $.data.error_id }
          assert:
            - "${rid_required} == true and ${mod_initial} == \"UNVERIFIED\""
            - "${err_from_unverified} == \"ERR_MODULE_INVALID_STATE\" (HTTP 409) and the module is still UNVERIFIED with verified_at and verified_until null"
            - "${pending_status} == \"VERIFICATION_PENDING\" and broadcast_sample_ref == \"SAMPLE-A\""
            - "${failed_status} == \"VERIFICATION_FAILED\" with failure_reason \"Broadcast sample lacked a serial field.\""
            - "${err_from_failed} == \"ERR_MODULE_INVALID_STATE\" (HTTP 409) - recovery from VERIFICATION_FAILED runs through submit-verification, never straight to verify"
            - "the module never reaches VERIFIED, so POST /drone-ops/aircraft/${acid}/register would still be refused by the priority-20 gate"

      - name: a_passing_grade_executes_every_declared_side_effect_on_the_pilot
        claim_type: side_effect_execution
        grounds:
          - state_machines.Pilot
          - state_machines.KnowledgeTest
          - endpoints.POST_/drone-ops/knowledge-tests/{id}/grade
          - calculations.pilot_currency_expiry
        distinguishing_aspect: |
          One trigger, five declared effects: the test becomes PASSED with graded_at, a
          Certification row is minted ACTIVE, the pilot moves KNOWLEDGE_PENDING -> CERTIFIED
          with certified_at, currency_basis is written from operator_category and
          currency_expires_at from the COMMERCIAL_BASIS variant (min of the 24-month
          certificate expiry and the 90-day recency window, which for a pilot who has never
          flown is issued_at + 90 days), and the pilot's version increments. Missing any one
          of the five fails the claim.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "One COMMERCIAL pilot in KNOWLEDGE_PENDING with one SCHEDULED PART107_COMMERCIAL test and no completed flights."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Sam Adeyemi", email: "sam.adeyemi@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id, v0: $.data.version }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { pending_status: $.data.status, v1: $.data.version }
          trigger:
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 91 }
              as: ComplianceOfficer
              captures: { kt_status: $.data.status, kt_graded_at: $.data.graded_at }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { pilot_status: $.data.status, expiry: $.data.currency_expires_at, basis: $.data.currency_basis, v2: $.data.version }
          assert:
            - "${pending_status} == \"KNOWLEDGE_PENDING\" - scheduling the test already moved the pilot off UNCERTIFIED"
            - "${kt_status} == \"PASSED\" and ${kt_graded_at} == \"2026-03-01T00:00:00Z\""
            - "${pilot_status} == \"CERTIFIED\" with certified_at == \"2026-03-01T00:00:00Z\""
            - "${basis} == \"COMMERCIAL_BASIS\" and ${expiry} == \"2026-05-30T00:00:00Z\" == min(2028-03-01T00:00:00Z, 2026-03-01T00:00:00Z + 90 days)"
            - "GET /drone-ops/certifications?pilot_id=${pid} returns total_count == 1 with status \"ACTIVE\", category \"COMMERCIAL\" and expires_at \"2028-03-01T00:00:00Z\""
            - "${v2} > ${v1} > ${v0} - both the scheduling and the grading bumped Pilot.version, which is why OCC callers must re-read before POST /drone-ops/waivers"

      - name: waiver_triggers_from_undeclared_states_are_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Waiver
          - endpoints.POST_/drone-ops/waivers/{id}/begin-review
          - endpoints.POST_/drone-ops/waivers/{id}/clear-safety-case
          - errors[ERR_WAIVER_INVALID_STATE]
        distinguishing_aspect: |
          Waiver has the widest trigger surface in the scaffold, so every trigger that is NOT
          declared from the current state must 409 while leaving the state alone: begin-review
          and clear-safety-case from DRAFT, submit and clear-safety-case from SUBMITTED, and
          decide from UNDER_REVIEW (decide is declared only from CLEARED).
        test_recipe:
          setup:
            - "Logical clock at 2026-04-05T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-04-05T00:00:00Z owning one Aircraft."
            - "One Waiver of type NIGHT in DRAFT with one PENDING SafetyCase (ground_risk_class 2, ARC_B, sail_level 3)."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Lena Fischer", email: "lena.fischer@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-04-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 90 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Nightbird", serial_number: "SN-WVS-01", takeoff_weight_g: 249, max_altitude_ft: 700 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { pv: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 400, operation_description: "Night inspection of a rail yard with lit obstacle markers.", expected_pilot_version: "${pv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { wid: $.data.id, w_initial: $.data.status }
            - call: "POST /drone-ops/waivers/${wid}/safety-cases"
              payload: { mitigation_summary: "Lit landing zone, two observers, tethered return path.", ground_risk_class: 2, air_risk_class: "ARC_B", contingency_procedures: "Immediate descent to the lit landing zone on signal loss." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { scid: $.data.id, sail: $.data.sail_level }
          trigger:
            - call: "POST /drone-ops/waivers/${wid}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "rev-21"
              captures: { err_review_draft: $.data.error_id }
            - call: "POST /drone-ops/waivers/${wid}/clear-safety-case"
              payload: {}
              as: SafetyReviewer
              as_user_id: "rev-21"
              captures: { err_clear_draft: $.data.error_id }
            - call: "POST /drone-ops/waivers/${wid}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { submitted: $.data.status }
            - call: "POST /drone-ops/waivers/${wid}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_resubmit: $.data.error_id }
            - call: "POST /drone-ops/waivers/${wid}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "rev-21"
              captures: { under_review: $.data.status }
            - call: "POST /drone-ops/waivers/${wid}/decide"
              payload: { decision: "APPROVE", granted_ceiling_ft: 400 }
              as: WaiverApprover
              as_user_id: "app-21"
              captures: { err_decide_early: $.data.error_id }
          assert:
            - "${w_initial} == \"DRAFT\" and ${sail} == 3 == min(6, ground_risk_class 2 + ARC_B index 1 + NIGHT uplift 0)"
            - "${err_review_draft} == \"ERR_WAIVER_INVALID_STATE\" (409) and ${err_clear_draft} == \"ERR_WAIVER_INVALID_STATE\" (409); the waiver is still DRAFT and SafetyCase ${scid} is still PENDING"
            - "${submitted} == \"SUBMITTED\" and ${err_resubmit} == \"ERR_WAIVER_INVALID_STATE\" - submit is declared only from DRAFT and REVISION_REQUESTED"
            - "${under_review} == \"UNDER_REVIEW\""
            - "${err_decide_early} == \"ERR_WAIVER_INVALID_STATE\" - decide is declared only from CLEARED, so the approver cannot skip the safety review"
            - "after all five rejections the waiver is UNDER_REVIEW with revision_round == 0, valid_until null, granted_ceiling_ft null and approved_by_user_id null"

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Pilot
          - state_machines.Aircraft
          - state_machines.RemoteIdModule
          - state_machines.InsurancePolicy
          - state_machines.TemporaryFlightRestriction
        distinguishing_aspect: |
          Five machines, five different initial states, all asserted from a single fixture:
          Pilot UNCERTIFIED, Aircraft PENDING_REGISTRATION, RemoteIdModule UNVERIFIED,
          InsurancePolicy PENDING_VERIFICATION (never ACTIVE on creation, however complete the
          filing) and TemporaryFlightRestriction ACTIVE on publication.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-10T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Tariq Nasser", email: "tariq.nasser@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id, pilot_state: $.data.status }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Initial 1", serial_number: "SN-INI-01", takeoff_weight_g: 1200, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id, aircraft_state: $.data.registration_status }
            - call: "POST /drone-ops/aircraft/${acid}/remote-id-modules"
              payload: { module_serial: "MOD-INI-01", broadcast_protocol: "BLUETOOTH_LE", firmware_version: "2.0.0" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { module_state: $.data.status }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Skyline Mutual", policy_number: "POL-INI-01", coverage_limit_cents: 3000000, deductible_cents: 50000, effective_from: "2026-04-10T00:00:00Z", effective_until: "2027-04-10T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { policy_state: $.data.coverage_status, remaining: $.data.remaining_coverage_cents }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-C-INI", class_code: "C", class_ceiling_ft: 600, requires_authorization: true, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id, slots: $.data.reserved_slot_count }
            - call: "POST /drone-ops/tfrs"
              payload: { zone_id: "${zid}", reason: "Head-of-state movement.", effective_from: "2026-04-12T00:00:00Z", effective_until: "2026-04-13T00:00:00Z", max_permitted_altitude_ft: 0 }
              as: AirspaceAuthority
              captures: { tfr_state: $.data.status }
          assert:
            - "${pilot_state} == \"UNCERTIFIED\", ${aircraft_state} == \"PENDING_REGISTRATION\", ${module_state} == \"UNVERIFIED\""
            - "${policy_state} == \"PENDING_VERIFICATION\" - a fully populated filing is still unusable until POST /drone-ops/insurance-policies/{id}/verify"
            - "${remaining} == 3000000 == coverage_limit_cents, with open_reserved_cents_total == 0 and settled_cents_total == 0"
            - "${slots} == 0 and ${tfr_state} == \"ACTIVE\" - a published restriction bites immediately, with published_by_user_id stamped"
            - "every one of the six rows has version == 1 and created_at == \"2026-04-10T00:00:00Z\""

      - name: a_revoked_pilot_rejects_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Pilot
          - endpoints.POST_/drone-ops/pilots/{id}/reinstate
          - endpoints.POST_/drone-ops/pilots/{id}/revoke
          - errors[ERR_PILOT_INVALID_STATE]
        distinguishing_aspect: |
          REVOKED is the Pilot machine's only terminal state and it is reached through
          SUSPENDED. From there reinstate, suspend, revoke and currency-review must all 409,
          and the operating gates must refuse the pilot at priority 15 - a revoked pilot that
          can be reinstated would resurrect a DEREGISTERED fleet.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-15T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-04-15T00:00:00Z owning one REGISTERED 249 g airframe."
            - "The pilot is then SUSPENDED and REVOKED."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Gus Halvorsen", email: "gus.halvorsen@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-04-15T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 84 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Terminal 1", serial_number: "SN-TRM-01", takeoff_weight_g: 249, max_altitude_ft: 700 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots/${pid}/suspend"
              payload: { suspension_reason: "Falsified flight log entries." }
              as: ComplianceOfficer
              captures: { suspended: $.data.status }
            - call: "POST /drone-ops/pilots/${pid}/revoke"
              payload: { suspension_reason: "Certificate action finalised." }
              as: ComplianceOfficer
              captures: { revoked: $.data.status }
          trigger:
            - call: "POST /drone-ops/pilots/${pid}/reinstate"
              payload: {}
              as: ComplianceOfficer
              captures: { err_reinstate: $.data.error_id }
            - call: "POST /drone-ops/pilots/${pid}/suspend"
              payload: { suspension_reason: "Second attempt." }
              as: ComplianceOfficer
              captures: { err_suspend: $.data.error_id }
            - call: "POST /drone-ops/pilots/${pid}/revoke"
              payload: { suspension_reason: "Second attempt." }
              as: ComplianceOfficer
              captures: { err_revoke: $.data.error_id }
            - call: "POST /drone-ops/pilots/${pid}/currency-review"
              payload: {}
              as: ComplianceOfficer
              captures: { err_currency: $.data.error_id }
            - call: "POST /drone-ops/aircraft/${acid}/return-to-service"
              payload: {}
              as: ComplianceOfficer
              captures: { err_rts: $.data.error_id }
          assert:
            - "${suspended} == \"SUSPENDED\" and ${revoked} == \"REVOKED\" with suspension_reason \"Certificate action finalised.\""
            - "${err_reinstate} == ${err_suspend} == ${err_revoke} == ${err_currency} == \"ERR_PILOT_INVALID_STATE\" (HTTP 409)"
            - "the pilot is still REVOKED after all four attempts and its version did not change across them"
            - "Aircraft ${acid} is \"DEREGISTERED\" (the revoke cascade) and Certification status is \"REVOKED\""
            - "${err_rts} == \"ERR_AIRCRAFT_INVALID_STATE\" - return-to-service is declared only from GROUNDED, so a DEREGISTERED airframe is terminal too"

      - name: repeating_a_completed_transition_is_rejected_rather_than_ignored
        claim_type: idempotency
        grounds:
          - state_machines.Aircraft
          - endpoints.POST_/drone-ops/aircraft/{id}/register
          - endpoints.POST_/drone-ops/aircraft/{id}/ground
          - errors[ERR_AIRCRAFT_INVALID_STATE]
        distinguishing_aspect: |
          These action endpoints are not idempotent by design: a second register or a second
          ground must be a 409, not a silent 200 re-emitting the same row, because a tolerant
          re-ground would let grounding_reason be overwritten after the fact.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-20T00:00:00Z; one COMMERCIAL pilot with one 249 g airframe in PENDING_REGISTRATION."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Mira Kaur", email: "mira.kaur@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Twice 1", serial_number: "SN-IDM-01", takeoff_weight_g: 249, max_altitude_ft: 600 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
          trigger:
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
              captures: { first_regno: $.data.registration_number, v1: $.data.version }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
              captures: { err_second_register: $.data.error_id }
            - call: "POST /drone-ops/aircraft/${acid}/ground"
              payload: { grounding_reason: "Motor bearing replacement." }
              as: ComplianceOfficer
              captures: { grounded: $.data.registration_status }
            - call: "POST /drone-ops/aircraft/${acid}/ground"
              payload: { grounding_reason: "Overwritten reason." }
              as: ComplianceOfficer
              captures: { err_second_ground: $.data.error_id }
            - call: "GET /drone-ops/aircraft/${acid}"
              payload: {}
              as: ComplianceOfficer
              captures: { final_reason: $.data.grounding_reason, final_regno: $.data.registration_number }
          assert:
            - "${err_second_register} == \"ERR_AIRCRAFT_INVALID_STATE\" (409) and ${final_regno} == ${first_regno} - the registration number was not reissued"
            - "${grounded} == \"GROUNDED\" and ${err_second_ground} == \"ERR_AIRCRAFT_INVALID_STATE\" (409)"
            - "${final_reason} == \"Motor bearing replacement.\" - the second ground did not overwrite grounding_reason"
            - "the airframe's version advanced exactly twice from ${v1} - 1: once on register, once on ground; the two rejected calls left it untouched"

      - name: flight_completion_syncs_the_pilots_derived_recency_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.Flight
          - endpoints.POST_/drone-ops/flights/{id}/complete
          - entities.Pilot.fields.last_completed_flight_end
          - calculations.pilot_currency_expiry
          - calculations.pilot_risk_score
        distinguishing_aspect: |
          A child transition rewrites three derived fields on its ancestor in one hop:
          last_completed_flight_end takes the new actual_end, currency_expires_at is recomputed
          from it (the COMMERCIAL 90-day recency window now bites later than the certificate),
          and risk_score is re-derived - one clean flight scores -5 raw, which the SCORE_FLOOR
          clamps to 0 rather than letting it go negative.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-05-01T00:00:00Z (currency_expires_at 2026-07-30T00:00:00Z, last_completed_flight_end null, risk_score 0)."
            - "One REGISTERED 249 g airframe (max_altitude_ft 900) and one uncontrolled class G zone."
            - "One PLANNED RECREATIONAL-category flight for 2026-05-02 09:00-10:00."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
