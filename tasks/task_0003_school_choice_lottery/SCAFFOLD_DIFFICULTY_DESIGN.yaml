        grounds:
          - validations[priority=5]
          - state_machines.EnrollmentWindow.DRAFT_to_OPEN
          - entities.EnrollmentWindow.fields.opens_at
          - entities.EnrollmentWindow.fields.closes_at
        distinguishing_aspect: |
          Half-open interval semantics on EnrollmentWindow: [opens_at, closes_at). At clock == closes_at the window is no longer accepting OPEN transitions (must transition to CLOSED). Boundary test: open attempt at clock == closes_at -> ERR_WINDOW_TIMING. Different resource (EnrollmentWindow) and different interval semantics (half-open) from instance 2 (Offer respond_by exclusive).
        test_recipe:
          setup:
            - "Window in DRAFT with opens_at=01-02 and closes_at=02-01. Clock set to exactly 02-01 (closes_at instant). Attempt open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "D17", name: "Ov1", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { d17_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${d17_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { w17_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /lottery/windows/${w17_id}/open"
              payload: {}
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_WINDOW_TIMING (closes_at is exclusive; clock at closes_at means window may not be opened)"
            - "Response http status == 422"

      - name: offer_accept_after_respond_by_deadline_strict_less_than
        grounds:
          - state_machines.Offer.OFFERED_to_ACCEPTED
          - state_machines.Offer.OFFERED_to_EXPIRED
          - entities.Offer.fields.respond_by
        distinguishing_aspect: |
          Strict-less-than interval semantics on Offer: clock < respond_by required for accept. At clock == respond_by, accept is rejected. Different resource (Offer, not EnrollmentWindow) and different interval semantics (point deadline with strict less-than, not a half-open range).
        test_recipe:
          setup:
            - "An OFFERED offer with respond_by computed as offered_at+7d. Clock advanced to exactly respond_by instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
