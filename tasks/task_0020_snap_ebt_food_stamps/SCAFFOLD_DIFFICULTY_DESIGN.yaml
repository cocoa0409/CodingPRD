          - entities.EBTCard.fields.status
        distinguishing_aspect: |
          Conserved quantity: cardinality |{EBTCard : household_id==HH.id AND
          status IN {ACTIVE, SUSPENDED, PENDING_ISSUE}}|. The
          forward action /suspend and compensating action /reinstate
          shuffle one card between {ACTIVE, SUSPENDED} but the
          card-set cardinality is unchanged. Different conserved
          quantity from
