      - name: rate_supersede_retires_prior_active_rate_to_superseded
        claim_type: Side Effect Execution
        grounds:
          - endpoints.POST_/indirect-cost-rates
          - entities.IndirectCostRate.fields.status
          - concurrency_rules[rate-supersede-stale-award]
        distinguishing_aspect: |
          Creating a second IndirectCostRate retires the prior ACTIVE rate to SUPERSEDED and makes the new
          one ACTIVE: after the second create the award has exactly one ACTIVE rate (the new one) and the
          first is SUPERSEDED. The second create uses the post-first-create award version (OCC ${var}).
        test_recipe:
          setup:
            - "An ACTIVE Award with one ACTIVE NEGOTIATED rate already in force."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C20", applicant_org_name: "Corner Org 20", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
