# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Glider Club & Soaring Operations
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: member_creation_applies_defaults_and_system_fields
        claim_type: creation_with_defaults
        grounds: [entities.Member]
        distinguishing_aspect: "POST /soaring/members with only required inputs returns 201; system fields initialized: status ACTIVE, account_balance_cents 0, pending_dues_cents 0, solo_endorsed false, badge_level NONE, version 1; is_instructor/is_tow_pilot default false."
        test_recipe:
          setup: ["tier T0 exists"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "D0", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { t0: $.data.id }
          trigger:
            - call: "POST /soaring/members"
              payload: { full_name: "Defaults Member", tier_id: "${t0}" }
              as: ClubAdmin
              captures: { dm: $.data.id }
          assert:
            - "Member.${dm}.status == ACTIVE and account_balance_cents == 0 and pending_dues_cents == 0"
            - "Member.${dm}.solo_endorsed == false and badge_level == NONE and is_instructor == false and is_tow_pilot == false"
            - "Member.${dm}.version == 1 and id is a bare UUID (no type prefix)"

      - name: tier_unique_code_rejected
        claim_type: uniqueness_constraint
        grounds: [entities.MembershipTier.fields.tier_code, "errors[ERR_UNIQUE_CONSTRAINT]"]
        distinguishing_aspect: "Second tier with an identical tier_code is rejected with ERR_UNIQUE_CONSTRAINT (409); aircraft registration uniqueness shares the same error."
        test_recipe:
          setup: ["tier UNIQUE1 exists"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "UNIQUE1", monthly_dues_cents: 1000, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
          trigger:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "UNIQUE1", monthly_dues_cents: 2000, tow_fee_discount_pct: 0.1, included_tows_per_month: 1 }
              as: ClubAdmin
              captures: { uniq_err: $.data.error_id }
          assert:
            - "rejected with error_id ERR_UNIQUE_CONSTRAINT and http 409"

      - name: maintenance_record_immutable_no_version
        claim_type: immutability
        grounds: [entities.MaintenanceRecord]
        distinguishing_aspect: "MaintenanceRecord has common_fields false: no update endpoint exists, record carries id + created_at only (no version field in its representation contract); it is append-only under the airframe."
        test_recipe:
          setup: ["aircraft AM exists"]
          setup_api_calls:
            - call: "POST /soaring/aircraft"
              payload: { registration: "N001G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { am: $.data.id }
          trigger:
            - call: "POST /soaring/aircraft/${am}/maintenance-records"
              payload: { kind: "REPAIR", performed_at: "2026-08-05T10:00:00Z", hobbs_hours_at_service: 12.5, notes: "canopy latch" }
              as: ClubAdmin
              captures: { mr: $.data.id }
          assert:
            - "201 returned; MaintenanceRecord.${mr}.aircraft_id == ${am} and kind == REPAIR"
            - "GET /soaring/aircraft/${am}/maintenance-records returns array of length 1 containing ${mr}"

      - name: list_pagination_envelope_shape
        claim_type: listing_pagination
        grounds: [response_envelope, 'endpoints."GET /soaring/members"']
        distinguishing_aspect: "GET list respects limit/offset defaults (limit 10) and returns the fixed envelope: meta.api_request_id, response_type array, data plus pagination fields total_count and has_more."
        test_recipe:
          setup: ["tier TP exists; 3 members created"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "PG", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tp: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "P1", tier_id: "${tp}" }
              as: ClubAdmin
            - call: "POST /soaring/members"
              payload: { full_name: "P2", tier_id: "${tp}" }
              as: ClubAdmin
            - call: "POST /soaring/members"
              payload: { full_name: "P3", tier_id: "${tp}" }
              as: ClubAdmin
          trigger:
            - call: "GET /soaring/members?limit=2&offset=0"
              as: ClubAdmin
          assert:
            - "response envelope: response_type == array, meta.api_request_id present, data length == 2"
            - "pagination: total_count == 3 and has_more == true"

      - name: get_missing_resource_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_RESOURCE_NOT_FOUND (existence priority 3 fires before any state or business check)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /soaring/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ClubAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "http 404 with error_id ERR_RESOURCE_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: reservation_checkout_from_cancelled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Reservation.BOOKED_to_CANCELLED, "errors[ERR_RESERVATION_NOT_BOOKED]"]
        distinguishing_aspect: "Checkout on a CANCELLED reservation fails with ERR_RESERVATION_NOT_BOOKED; terminal CANCELLED state permits no further transitions."
        test_recipe:
          setup: ["member MC ACTIVE; glider GC; reservation RC BOOKED then cancelled (well before start so no late fee: start 2026-08-30, cancel at clock 2026-08-26)"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "CN", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tc0: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Cancel Pilot", tier_id: "${tc0}" }
              as: ClubAdmin
              captures: { mc0: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N002G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gc0: $.data.id, gc0_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T08:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gc0}", member_id: "${mc0}", start_at: "2026-08-30T10:00:00Z", end_at: "2026-08-30T12:00:00Z", expected_aircraft_version: "${gc0_ver}" }
              as: Member
              as_user_id: "${mc0}"
              captures: { rc0: $.data.id }
            - call: "POST /soaring/reservations/${rc0}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mc0}"
          trigger:
            - call: "POST /soaring/reservations/${rc0}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mc0}"
              captures: { term_err: $.data.error_id }
          assert:
            - "rejected with error_id ERR_RESERVATION_NOT_BOOKED (terminal CANCELLED)"
            - "Member.${mc0}.account_balance_cents == 0 (cancel was more than 24h before start: no late-cancel fee)"

      - name: flight_land_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Flight.IN_FLIGHT_to_LANDED, "errors[ERR_FLIGHT_NOT_IN_FLIGHT]"]
        distinguishing_aspect: "Landing an already-LANDED flight fails with ERR_FLIGHT_NOT_IN_FLIGHT; fee fields and airframe hours are not double-applied."
        test_recipe:
          setup: ["full flight chain through LANDED for member MF2 on zero-dues tier (release 1500 -> base 3000, no discount, 30-min flight: final 3000)"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "L2", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tl2: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Land Pilot", tier_id: "${tl2}" }
              as: ClubAdmin
              captures: { ml2: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Land Tow", tier_id: "${tl2}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { twl2: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N003G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gl2: $.data.id, gl2_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N004T", kind: "TOW_PLANE", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tpl2: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tpl2}", tow_pilot_id: "${twl2}", start_at: "2026-08-26T09:00:00Z", end_at: "2026-08-26T18:00:00Z", capacity: 3 }
              as: ClubAdmin
              captures: { sl2: $.data.id, sl2_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gl2}", member_id: "${ml2}", start_at: "2026-08-26T09:30:00Z", end_at: "2026-08-26T14:00:00Z", expected_aircraft_version: "${gl2_ver}" }
              as: Member
              as_user_id: "${ml2}"
              captures: { rl2: $.data.id }
            - call: "POST /soaring/reservations/${rl2}/checkout"
              payload: {}
              as: Member
              as_user_id: "${ml2}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${rl2}", tow_slot_id: "${sl2}", release_altitude_ft: 1500, takeoff_at: "2026-08-26T10:05:00Z", expected_tow_slot_version: "${sl2_ver}" }
              as: Member
              as_user_id: "${ml2}"
              captures: { fl2: $.data.id }
            - call: "POST /soaring/flights/${fl2}/land"
              payload: { landed_at: "2026-08-26T10:35:00Z" }
              as: Member
              as_user_id: "${ml2}"
          trigger:
            - call: "POST /soaring/flights/${fl2}/land"
              payload: { landed_at: "2026-08-26T10:40:00Z" }
              as: Member
              as_user_id: "${ml2}"
              captures: { land2_err: $.data.error_id }
          assert:
            - "second land rejected with error_id ERR_FLIGHT_NOT_IN_FLIGHT"
            - "Member.${ml2}.account_balance_cents == 3000 (single final fee; no double-apply)"
            - "Flight.${fl2}.flight_minutes == 30 (unchanged)"

      - name: tow_slot_cancel_blocked_while_in_flight
        claim_type: precondition_enforcement
        grounds: [state_machines.TowSlot.SCHEDULED_to_CANCELLED, "errors[ERR_TOW_SLOT_IN_USE]"]
        distinguishing_aspect: "Cancelling a tow slot with an IN_FLIGHT flight linked fails with ERR_TOW_SLOT_IN_USE; after that flight lands and reconciles, the same cancel succeeds."
        test_recipe:
          setup: ["member + tow pilot + glider + tow plane; slot SC capacity 2; reservation CHECKED_OUT; flight IN_FLIGHT on the slot"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "TS", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tts: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Slot Pilot", tier_id: "${tts}" }
              as: ClubAdmin
              captures: { mts: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Slot Tow", tier_id: "${tts}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { tts2: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N005G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gts: $.data.id, gts_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N006T", kind: "TOW_PLANE", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tpts: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tpts}", tow_pilot_id: "${tts2}", start_at: "2026-08-27T09:00:00Z", end_at: "2026-08-27T18:00:00Z", capacity: 2 }
              as: ClubAdmin
              captures: { sc_id: $.data.id, sc_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gts}", member_id: "${mts}", start_at: "2026-08-27T09:30:00Z", end_at: "2026-08-27T14:00:00Z", expected_aircraft_version: "${gts_ver}" }
              as: Member
              as_user_id: "${mts}"
              captures: { rts: $.data.id }
            - call: "POST /soaring/reservations/${rts}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mts}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${rts}", tow_slot_id: "${sc_id}", release_altitude_ft: 1500, takeoff_at: "2026-08-27T10:05:00Z", expected_tow_slot_version: "${sc_ver}" }
              as: Member
              as_user_id: "${mts}"
              captures: { fts: $.data.id }
          trigger:
            - call: "POST /soaring/tow-slots/${sc_id}/cancel"
              payload: {}
              as: ClubAdmin
              captures: { slot_err: $.data.error_id }
            - call: "POST /soaring/flights/${fts}/land"
              payload: { landed_at: "2026-08-27T11:00:00Z" }
              as: Member
              as_user_id: "${mts}"
            - call: "POST /soaring/flights/${fts}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${tts2}"
            - call: "POST /soaring/tow-slots/${sc_id}/cancel"
              payload: {}
              as: ClubAdmin
          assert:
            - "first cancel rejected with error_id ERR_TOW_SLOT_IN_USE"
            - "after land+reconcile the second cancel succeeds: TowSlot.${sc_id}.status == CANCELLED"

      - name: verify_requires_signed_off_state
        claim_type: invalid_transition
        grounds: [state_machines.StudentProgress.SIGNED_OFF_to_VERIFIED, "errors[ERR_PROGRESS_NOT_SIGNED_OFF]"]
        distinguishing_aspect: "Verifying a PENDING StudentProgress record fails with ERR_PROGRESS_NOT_SIGNED_OFF — the verify edge exists only from SIGNED_OFF."
        test_recipe:
          setup: ["student + instructor on student tier; StudentProgress BADGE_B record PENDING"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "SP", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0, student_tier: true }
              as: ClubAdmin
              captures: { tsp: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "V Student", tier_id: "${tsp}" }
              as: ClubAdmin
              captures: { vst: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "V CFI", tier_id: "${tsp}", is_instructor: true }
              as: ClubAdmin
              captures: { vci: $.data.id }
            - call: "POST /soaring/student-progress"
              payload: { student_id: "${vst}", instructor_id: "${vci}", kind: "BADGE_B" }
              as: Instructor
              as_user_id: "${vci}"
              captures: { vsp: $.data.id }
          trigger:
            - call: "POST /soaring/student-progress/${vsp}/verify"
              payload: {}
              as: ClubAdmin
              captures: { ver_err: $.data.error_id }
          assert:
            - "rejected with error_id ERR_PROGRESS_NOT_SIGNED_OFF"
            - "StudentProgress.${vsp}.status == PENDING unchanged"

      - name: retrieve_terminal_cancel_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RetrieveRequest.REQUESTED_to_CANCELLED, "errors[ERR_RETRIEVE_NOT_REQUESTED]"]
        distinguishing_aspect: "A CANCELLED retrieve accepts no further transitions: assign-crew on the cancelled retrieve fails with ERR_RETRIEVE_NOT_REQUESTED."
        test_recipe:
          setup: ["reconciled flight FX for member MX; retrieve RR REQUESTED then cancelled; second active member MCREW"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "RT", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { trt: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Ret Pilot", tier_id: "${trt}" }
              as: ClubAdmin
              captures: { mrx: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Ret Tow", tier_id: "${trt}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { trx: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N007G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { grx: $.data.id, grx_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N008T", kind: "TOW_PLANE", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tprx: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tprx}", tow_pilot_id: "${trx}", start_at: "2026-08-28T09:00:00Z", end_at: "2026-08-28T18:00:00Z", capacity: 2 }
              as: ClubAdmin
              captures: { srx: $.data.id, srx_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-28T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${grx}", member_id: "${mrx}", start_at: "2026-08-28T09:30:00Z", end_at: "2026-08-28T14:00:00Z", expected_aircraft_version: "${grx_ver}" }
              as: Member
              as_user_id: "${mrx}"
              captures: { rrx: $.data.id }
            - call: "POST /soaring/reservations/${rrx}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mrx}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${rrx}", tow_slot_id: "${srx}", release_altitude_ft: 1500, takeoff_at: "2026-08-28T10:05:00Z", expected_tow_slot_version: "${srx_ver}" }
              as: Member
              as_user_id: "${mrx}"
              captures: { frx: $.data.id }
            - call: "POST /soaring/flights/${frx}/land"
              payload: { landed_at: "2026-08-28T11:00:00Z" }
              as: Member
              as_user_id: "${mrx}"
            - call: "POST /soaring/flights/${frx}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${trx}"
            - call: "POST /soaring/retrieves"
              payload: { flight_id: "${frx}", distance_km: 40 }
              as: Member
              as_user_id: "${mrx}"
              captures: { ret_id: $.data.id }
            - call: "POST /soaring/retrieves/${ret_id}/cancel"
              payload: {}
              as: DutyOfficer
              as_user_id: "${trx}"
          trigger:
            - call: "POST /soaring/retrieves/${ret_id}/assign-crew"
              payload: { crew_member_id: "${trx}" }
              as: DutyOfficer
              as_user_id: "${trx}"
              captures: { crew_err: $.data.error_id }
          assert:
            - "rejected with error_id ERR_RETRIEVE_NOT_REQUESTED (terminal CANCELLED lockdown)"
            - "RetrieveRequest.${ret_id}.status == CANCELLED and crew_member_id == null"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: tow_fee_altitude_tier_branches
        claim_type: correct_result_per_tier
        grounds: [calculations.tow_fee_calculation]
        excluded_because:
          difficulty_instance: tow_fee_provisional_vs_final_divergence
          rationale: "Tier selection exercised at 2500 ft (TIER2); the §1.8 instance pins the base ladder against the provisional assert (3800 -> 3420). Branch coverage of the remaining tiers reuses the same code path."

      - name: badge_level_recompute_highest_verified
        claim_type: aggregation_correctness
        grounds: [calculations.badge_level_recompute]
        distinguishing_aspect: "badge_level is the highest VERIFIED badge: verifying BADGE_A then BADGE_C yields C; a PENDING BADGE_SILVER does not count (input-set filter status == VERIFIED)."
        test_recipe:
          setup: ["student SB on student tier; instructor IB; BADGE_A verified; BADGE_C verified; BADGE_SILVER pending"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "BDG", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0, student_tier: true }
              as: ClubAdmin
              captures: { tbdg: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Badge Student", tier_id: "${tbdg}" }
              as: ClubAdmin
              captures: { sb: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Badge CFI", tier_id: "${tbdg}", is_instructor: true }
              as: ClubAdmin
              captures: { ib: $.data.id }
            - call: "POST /soaring/student-progress"
              payload: { student_id: "${sb}", instructor_id: "${ib}", kind: "BADGE_A" }
              as: Instructor
              as_user_id: "${ib}"
              captures: { ba: $.data.id }
            - call: "POST /soaring/student-progress/${ba}/signoff"
              payload: {}
              as: Instructor
              as_user_id: "${ib}"
            - call: "POST /soaring/student-progress/${ba}/verify"
              payload: {}
              as: ClubAdmin
            - call: "POST /soaring/student-progress"
              payload: { student_id: "${sb}", instructor_id: "${ib}", kind: "BADGE_C" }
              as: Instructor
              as_user_id: "${ib}"
              captures: { bc: $.data.id }
            - call: "POST /soaring/student-progress/${bc}/signoff"
              payload: {}
              as: Instructor
              as_user_id: "${ib}"
            - call: "POST /soaring/student-progress/${bc}/verify"
              payload: {}
              as: ClubAdmin
            - call: "POST /soaring/student-progress"
              payload: { student_id: "${sb}", instructor_id: "${ib}", kind: "BADGE_SILVER" }
              as: Instructor
              as_user_id: "${ib}"
          trigger:
            - call: "GET /soaring/members/${sb}"
              as: ClubAdmin
          assert:
            - "Member.${sb}.badge_level == C (highest VERIFIED; PENDING BADGE_SILVER excluded from the input set)"

      - name: solo_eligibility_recency_window
        claim_type: input_set_filtering
        grounds: [calculations.student_solo_eligibility, "errors[ERR_SOLO_ELIGIBILITY_FAILED]"]
        distinguishing_aspect: "SOLO_SIGNOFF signoff requires >= 10.0 dual hours AND a dual flight within the trailing 90 days: a student whose dual flights (total 12.5h across three reconciled instructional flights) all occurred > 90 days ago fails with ERR_SOLO_ELIGIBILITY_FAILED even though the cumulative hour threshold is met."
        test_recipe:
          setup:
            - "student SE on student tier; instructor IE; glider GE; tow plane TE; slot SE_SLOT; clock advanced to 2026-08-30 (well past 90 days after the flights below)"
            - "three dual flights totalling 12.5h (250 min each: 4.0+4.0+4.5) reconciled on 2026-08-01 with takeoffs 2026-08-01T09:00/11:00/13:00 — all more than 90 days... (2026-08-30 minus 2026-08-01 = 29 days, inside window!). Use takeoffs on 2026-05-01 instead and clock 2026-08-30: 121 days stale — but flights land before default clock start is fine because flight times are input data; checkout however needs clock within reservation window, so run those flights at clock 2026-05-01 (before the 2026-08-01 default — explicit set overrides default)."
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "REC", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 99, student_tier: true }
              as: ClubAdmin
              captures: { trec: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Recency Student", tier_id: "${trec}" }
              as: ClubAdmin
              captures: { se: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Recency CFI", tier_id: "${trec}", is_instructor: true }
              as: ClubAdmin
              captures: { ie: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Recency Tow", tier_id: "${trec}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { te: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N009G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { ge: $.data.id, ge_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N010T", kind: "TOW_PLANE", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tpe: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tpe}", tow_pilot_id: "${te}", start_at: "2026-05-01T08:00:00Z", end_at: "2026-05-01T20:00:00Z", capacity: 10 }
              as: ClubAdmin
              captures: { sslot: $.data.id, sslot_v: $.data.version }
            - call: "POST /soaring/instructor-availability"
              payload: { instructor_id: "${ie}", start_at: "2026-05-01T08:00:00Z", end_at: "2026-05-01T20:00:00Z" }
              as: Instructor
              as_user_id: "${ie}"
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:30:00Z" }
              as: ClubAdmin
            # --- dual flight 1 (250 min) ---
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${ge}", member_id: "${se}", instructor_id: "${ie}", start_at: "2026-05-01T08:30:00Z", end_at: "2026-05-01T10:30:00Z", expected_aircraft_version: "${ge_ver}" }
              as: Member
              as_user_id: "${se}"
              captures: { re1: $.data.id }
            - call: "POST /soaring/reservations/${re1}/checkout"
              payload: {}
              as: Member
              as_user_id: "${se}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${re1}", tow_slot_id: "${sslot}", release_altitude_ft: 1500, takeoff_at: "2026-05-01T09:00:00Z", expected_tow_slot_version: "${sslot_v}" }
              as: Member
              as_user_id: "${se}"
              captures: { fe1: $.data.id }
            - call: "POST /soaring/flights/${fe1}/land"
              payload: { landed_at: "2026-05-01T13:10:00Z" }
              as: Member
              as_user_id: "${se}"
            - call: "POST /soaring/flights/${fe1}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${te}"
            # --- dual flight 2 (250 min) ---
            - call: "GET /soaring/aircraft/${ge}"
              as: ClubAdmin
              captures: { ge_ver2: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${ge}", member_id: "${se}", instructor_id: "${ie}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", expected_aircraft_version: "${ge_ver2}" }
              as: Member
              as_user_id: "${se}"
              captures: { re2: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T13:50:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${re2}/checkout"
              payload: {}
              as: Member
              as_user_id: "${se}"
            - call: "GET /soaring/tow-slots/${sslot}"
              as: ClubAdmin
              captures: { sslot_v2: $.data.version }
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${re2}", tow_slot_id: "${sslot}", release_altitude_ft: 1500, takeoff_at: "2026-05-01T14:00:00Z", expected_tow_slot_version: "${sslot_v2}" }
              as: Member
              as_user_id: "${se}"
              captures: { fe2: $.data.id }
            - call: "POST /soaring/flights/${fe2}/land"
              payload: { landed_at: "2026-05-01T18:10:00Z" }
              as: Member
              as_user_id: "${se}"
            - call: "POST /soaring/flights/${fe2}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${te}"
            # --- dual flight 3 (270 min) ---
            - call: "GET /soaring/aircraft/${ge}"
              as: ClubAdmin
              captures: { ge_ver3: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${ge}", member_id: "${se}", instructor_id: "${ie}", start_at: "2026-05-01T18:30:00Z", end_at: "2026-05-01T20:00:00Z", expected_aircraft_version: "${ge_ver3}" }
              as: Member
              as_user_id: "${se}"
              captures: { re3: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T18:20:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${re3}/checkout"
              payload: {}
              as: Member
              as_user_id: "${se}"
            - call: "GET /soaring/tow-slots/${sslot}"
              as: ClubAdmin
              captures: { sslot_v3: $.data.version }
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${re3}", tow_slot_id: "${sslot}", release_altitude_ft: 1500, takeoff_at: "2026-05-01T18:30:00Z", expected_tow_slot_version: "${sslot_v3}" }
              as: Member
              as_user_id: "${se}"
              captures: { fe3: $.data.id }
            - call: "POST /soaring/flights/${fe3}/land"
              payload: { landed_at: "2026-05-01T23:00:00Z" }
              as: Member
              as_user_id: "${se}"
            - call: "POST /soaring/flights/${fe3}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${te}"
            # --- jump the clock past the 90-day recency window ---
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/student-progress"
              payload: { student_id: "${se}", instructor_id: "${ie}", kind: "SOLO_SIGNOFF" }
              as: Instructor
              as_user_id: "${ie}"
              captures: { sps: $.data.id }
          trigger:
            - call: "POST /soaring/student-progress/${sps}/signoff"
              payload: {}
              as: Instructor
              as_user_id: "${ie}"
              captures: { solo_err: $.data.error_id }
          assert:
            - "rejected with error_id ERR_SOLO_ELIGIBILITY_FAILED: dual_hours_total == 12.83 >= 10.0 (770 min; hours gate passes) but latest dual takeoff 2026-05-01 is 121 days before now 2026-08-30 (> 90-day recency window)"
            - "StudentProgress.${sps}.status == PENDING"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]"]
        distinguishing_aspect: "A request without X-User-Role fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT before any role check — verified against a harmless GET."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /soaring/tiers"
              as: Anonymous
              captures: { auth_err: $.data.error_id }
          assert:
            - "rejected with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT (http 400)"

      - name: checkout_outside_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "Checkout before (start_at - 15min) is rejected with ERR_INVALID_TIME_WINDOW (priority 7) when the airframe is AIRWORTHY — isolates the temporal gate from the safety gate."
        test_recipe:
          setup: ["member MW ACTIVE; glider GW AIRWORTHY; reservation RW BOOKED 2026-08-29T10:00-12:00; clock 2026-08-29T09:30 (15:30 min before start -> outside grace)"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "TW", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { ttw: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Window Pilot", tier_id: "${ttw}" }
              as: ClubAdmin
              captures: { mw: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N011G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gw: $.data.id, gw_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T09:30:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gw}", member_id: "${mw}", start_at: "2026-08-29T10:00:00Z", end_at: "2026-08-29T12:00:00Z", expected_aircraft_version: "${gw_ver}" }
              as: Member
              as_user_id: "${mw}"
              captures: { rw: $.data.id }
          trigger:
            - call: "POST /soaring/reservations/${rw}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mw}"
              captures: { win_err: $.data.error_id }
          assert:
            - "rejected with error_id ERR_INVALID_TIME_WINDOW (09:30 is before start-15min = 09:45)"
            - "Reservation.${rw}.status == BOOKED"

      - name: instructor_availability_coverage_required
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INSTRUCTOR_UNAVAILABLE]"]
        distinguishing_aspect: "An instructional reservation whose window is only PARTIALLY covered by the instructor's OPEN availability (window extends 30 min past availability end) is rejected with ERR_INSTRUCTOR_UNAVAILABLE — coverage must be total."
        test_recipe:
          setup: ["instructor IC with OPEN availability 2026-08-30T09:00-12:00; student SC2; glider GC2; proposed reservation 11:00-12:30 (30 min uncovered); no double-booking"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "AV", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0, student_tier: true }
              as: ClubAdmin
              captures: { tav: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Avail CFI", tier_id: "${tav}", is_instructor: true }
              as: ClubAdmin
              captures: { ic: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Avail Stu", tier_id: "${tav}" }
              as: ClubAdmin
              captures: { sc2: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N012G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gc2: $.data.id, gc2_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T08:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/instructor-availability"
              payload: { instructor_id: "${ic}", start_at: "2026-08-30T09:00:00Z", end_at: "2026-08-30T12:00:00Z" }
              as: Instructor
              as_user_id: "${ic}"
          trigger:
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gc2}", member_id: "${sc2}", instructor_id: "${ic}", start_at: "2026-08-30T11:00:00Z", end_at: "2026-08-30T12:30:00Z", expected_aircraft_version: "${gc2_ver}" }
              as: Member
              as_user_id: "${sc2}"
              captures: { av_err: $.data.error_id }
          assert:
            - "rejected with error_id ERR_INSTRUCTOR_UNAVAILABLE (window [11:00,12:30) not fully covered by availability [09:00,12:00))"

      - name: referential_integrity_kind_and_flags
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_REFERENTIAL_INTEGRITY]"]
        distinguishing_aspect: "Three referential mismatches share ERR_REFERENTIAL_INTEGRITY: reservation on a TOW_PLANE, tow slot on a GLIDER, and student-progress for a member whose tier has student_tier false."
        test_recipe:
          setup: ["mixed fleet: glider GR, tow plane TR; plain member MR (non-student tier); instructor IR"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "REF", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tref: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Ref Pilot", tier_id: "${tref}" }
              as: ClubAdmin
              captures: { mr2: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Ref Tow", tier_id: "${tref}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { tr2: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Ref CFI", tier_id: "${tref}", is_instructor: true }
              as: ClubAdmin
              captures: { ir: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N013G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gr: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N014T", kind: "TOW_PLANE", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tr3: $.data.id, tr3_ver: $.data.version }
          trigger:
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${tr3}", member_id: "${mr2}", start_at: "2026-08-31T10:00:00Z", end_at: "2026-08-31T12:00:00Z", expected_aircraft_version: "${tr3_ver}" }
              as: Member
              as_user_id: "${mr2}"
              captures: { ref_err1: $.data.error_id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${gr}", tow_pilot_id: "${tr2}", start_at: "2026-08-31T09:00:00Z", end_at: "2026-08-31T17:00:00Z", capacity: 2 }
              as: ClubAdmin
              captures: { ref_err2: $.data.error_id }
            - call: "POST /soaring/student-progress"
              payload: { student_id: "${mr2}", instructor_id: "${ir}", kind: "BADGE_A" }
              as: Instructor
              as_user_id: "${ir}"
              captures: { ref_err3: $.data.error_id }
          assert:
            - "reservation on TOW_PLANE rejected: error_id ERR_REFERENTIAL_INTEGRITY"
            - "tow slot on GLIDER rejected: error_id ERR_REFERENTIAL_INTEGRITY"
            - "progress record for non-student tier rejected: error_id ERR_REFERENTIAL_INTEGRITY"

      - name: late_cancel_fee_applied_within_window
        claim_type: violation_to_error
        grounds: [state_machines.Reservation.BOOKED_to_CANCELLED, constants.LATE_CANCEL_WINDOW_HOURS, constants.LATE_CANCEL_FEE_CENTS]
        distinguishing_aspect: "Member-initiated cancel 12 hours before start (inside the 24h window) debits LATE_CANCEL_FEE 1500; a cancel 30 hours before start debits 0 — the fee is keyed to start_at - now at cancel time."
        test_recipe:
          setup: ["member ML on zero-dues tier; glider GL; two BOOKED reservations: RL1 starts 2026-09-01T10:00, RL2 starts 2026-09-02T04:00; clock 2026-08-31T22:00 (12h and 30h before respectively)"]
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "LC", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tlc: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Late Pilot", tier_id: "${tlc}" }
              as: ClubAdmin
              captures: { ml: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N015G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gl: $.data.id, gl_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T22:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gl}", member_id: "${ml}", start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T12:00:00Z", expected_aircraft_version: "${gl_ver}" }
              as: Member
              as_user_id: "${ml}"
              captures: { rl1: $.data.id }
            - call: "GET /soaring/aircraft/${gl}"
              as: ClubAdmin
              captures: { gl_ver2: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gl}", member_id: "${ml}", start_at: "2026-09-02T04:00:00Z", end_at: "2026-09-02T06:00:00Z", expected_aircraft_version: "${gl_ver2}" }
              as: Member
              as_user_id: "${ml}"
              captures: { rl2: $.data.id }
          trigger:
            - call: "POST /soaring/reservations/${rl1}/cancel"
              payload: {}
              as: Member
              as_user_id: "${ml}"
            - call: "POST /soaring/reservations/${rl2}/cancel"
              payload: {}
              as: Member
              as_user_id: "${ml}"
          assert:
            - "Reservation.${rl1}.status == CANCELLED with Member.${ml}.account_balance_cents == 1500 (12h < 24h: LATE_CANCEL_FEE applied)"
            - "Reservation.${rl2}.status == CANCELLED with Member.${ml}.account_balance_cents == 1500 still (30h > 24h: no additional fee)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: ops_day_close_marks_reservation_no_show
        claim_type: conditional_action
        grounds: ['endpoints."POST /soaring/ops-day/close"', state_machines.Reservation.BOOKED_to_NO_SHOW, constants.NO_SHOW_FEE_CENTS]
        distinguishing_aspect: "A BOOKED reservation whose end_at passed without checkout is flipped to NO_SHOW at ops-day close with NO_SHOW_FEE 2500 debited; a CHECKED_OUT reservation past end is left alone."
        test_recipe:
