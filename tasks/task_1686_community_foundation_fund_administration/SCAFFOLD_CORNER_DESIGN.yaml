              captures: { st35: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-02-01T00:00:00Z" }
              as: FoundationAdmin
            - call: "GET /funds/${inf_id}"
              as: FoundationAdmin
              captures: { st37: $.data.status }
          assert:
            - "At 35 months (2028-12-16): Fund.status == ACTIVE"
            - "At exactly 36 months (2029-02-01, day-of-month earlier so 37 raw - 1 = 36): Fund.status == INACTIVE (>= trigger boundary is inclusive)"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_disbursement
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "entities.Disbursement"
        distinguishing_aspect: "Under the immediate model, the disburse response and a subsequent GET /funds/{id}/disbursements in the same test step already show the new Disbursement row and debited cash_balance — no lag."
        test_recipe:
          setup: ["grant APPROVED 500.00 on fund with cash 50000.00"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "IC Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { icf_id: $.data.id }
            - call: "POST /funds/${icf_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { icf_ag: $.data.id }
            - call: "POST /agreements/${icf_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${icf_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 50000.00 }
              as: GiftOfficer
              captures: { icf_c: $.data.id }
            - call: "POST /contributions/${icf_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${icf_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /grantees"
              payload: { legal_name: "IC Org", tax_id: "998877665", irs_subsection: "C3_501" }
              as: ComplianceOfficer
              captures: { icg_id: $.data.id }
            - call: "POST /grantees/${icg_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grantees/${icg_id}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /funds/${icf_id}"
              as: FoundationAdmin
              captures: { icf_v: $.data.version }
            - call: "POST /grants"
              payload: { fund_id: "${icf_id}", grantee_id: "${icg_id}", amount: 500.00, purpose: "IC", expected_fund_version: "${icf_v}" }
              as: FoundationAdmin
              captures: { icgr_id: $.data.id }
            - call: "POST /grants/${icgr_id}/submit"
              payload: {}
              as: FoundationAdmin
            - call: "POST /grants/${icgr_id}/claim-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /grants/${icgr_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
          trigger:
            - call: "POST /grants/${icgr_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fo-1"
              captures: { icst: $.data.status }
            - call: "GET /funds/${icf_id}"
              as: FoundationAdmin
              captures: { iccash: $.data.cash_balance }
            - call: "GET /funds/${icf_id}/disbursements"
              as: FinanceOfficer
              captures: { icd_amt: "$.data[0].amount", icd_kind: "$.data[0].source_kind" }
          assert:
            - "GrantRecommendation.status == DISBURSED"
            - "Fund.cash_balance == 49500.00 in the immediately following GET"
            - "Disbursement[0].amount == 500.00 and source_kind == GRANT visible immediately"
