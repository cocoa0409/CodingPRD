              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "InclCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic_id: $.data.id }
