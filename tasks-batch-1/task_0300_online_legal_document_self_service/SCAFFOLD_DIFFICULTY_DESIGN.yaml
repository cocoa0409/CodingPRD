              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "P1" }
              as: Customer
              as_user_id: "${cust}"
              captures: { p1: $.data.id }
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "P2" }
              as: Customer
              as_user_id: "${cust}"
              captures: { p2: $.data.id }
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "P3" }
              as: Customer
              as_user_id: "${cust}"
              captures: { p3: $.data.id }
          trigger:
            - call: "POST /legal/document-projects/${p3}/transition"
              payload: { to_status: "ABANDONED" }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /legal/subscriptions/${sub}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { used: $.data.credits_used }
          assert:
            - "After 3 creates: Subscription.credits_used == 3, credits_remaining == 0"
            - "After abandoning P3: Subscription.credits_used == 2, credits_remaining == 1"
            - "Subscription.credits_used == count of DocumentProjects with credit_held==true (no drift)"
