            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: WatchService
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status == 403"

      - name: clientcontact_cannot_read_other_client_record
        claim_type: violation_to_error
        grounds: [roles, entities.Client, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "ClientContact is entity-backed by Client: reading a record owned by client A while authenticated as client B is rejected with ERR_FORBIDDEN; reading one's own record succeeds."
        test_recipe:
          setup: ["Clients A and B; a record owned by A"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Alpha", industry: "tech", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_a: $.data.id }
            - call: "POST /brand/clients"
              payload: { name: "Beta", industry: "food", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_b: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_a}", mark_text: "ALPHA", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-A1" }
              as: Paralegal
              captures: { rec_a: $.data.id }
          trigger:
            - call: "GET /brand/trademark-records/${rec_a}"
              as: ClientContact
              as_user_id: "${client_b}"
              captures: { err: $.data.error_id }
            - call: "GET /brand/trademark-records/${rec_a}"
              as: ClientContact
              as_user_id: "${client_a}"
          assert:
            - "As client B: error_id == ERR_FORBIDDEN (record's client_id != X-User-ID)"
            - "As client A: 200 with the record"

      - name: paralegal_cannot_resolve_matter
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Matter resolution is exclusive to PartnerAttorney; a Paralegal attempt is rejected with ERR_FORBIDDEN."
        test_recipe:
          setup: ["Client, PUBLISHED record, INFRINGEMENT matter (no deadlines)"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id }
          trigger:
            - call: "POST /brand/enforcement-matters/${matter_id}/resolve"
              payload: { outcome: FAVORABLE }
              as: Paralegal
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and matter stays ACTIVE"

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any other validation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /brand/clients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status == 401"

  # ---------------------------------------------------------------------------
  # Section: cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_stale_version_on_assess_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[alert-assess-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first assessment bumps WatchAlert.version, a second assess carrying the pre-assessment expected_watch_alert_version is rejected with ERR_STALE_VERSION (412); re-reading and re-sending with the fresh version succeeds."
        test_recipe:
          setup: ["Client, PUBLISHED record, TRIAGED alert at version observed before the first assess"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
          trigger:
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "first", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.5, weight_goods: 0.3, weight_channels: 0.2, fame_adjustment: 0, rationale: "stale retry", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_2
              captures: { err: $.data.error_id }
            - call: "GET /brand/watch-alerts/${alert_id}"
              as: AssociateAttorney
              captures: { av_fresh: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.5, weight_goods: 0.3, weight_channels: 0.2, fame_adjustment: 0, rationale: "fresh retry", expected_watch_alert_version: "${av_fresh}" }
              as: AssociateAttorney
              as_user_id: assoc_2
          assert:
            - "First assess succeeded and bumped WatchAlert.version"
            - "Stale retry with the pre-assessment version: error_id == ERR_STALE_VERSION, http 412, assessment_round stays 1"
            - "Fresh retry with the re-read version succeeds: assessment_round == 2 and final_score == 73.00 (0.5*80+0.3*70+0.2*60)"
            - "WatchAlert.version increments by exactly 1 per accepted assess"

      - name: occ_stale_version_on_propose_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-propose-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A counter bumps CoexistenceAgreement.version; a propose built on the pre-counter expected_agreement_version is rejected with ERR_STALE_VERSION (412), and a propose with the fresh version succeeds."
        test_recipe:
          setup: ["Client, PUBLISHED record, agreement PROPOSED once then COUNTERED (version advanced twice since creation)"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec_id}/coexistence-agreements"
              payload: { counterparty_name: "Rival Co", territory_codes: ["US"], effective_start: "2026-09-01T00:00:00Z", effective_end: "2027-09-01T00:00:00Z" }
              as: AssociateAttorney
              captures: { agr_id: $.data.id, agr_v: $.data.version }
            - call: "POST /brand/coexistence-agreements/${agr_id}/propose"
              payload: { terms_text: "round 1", expected_agreement_version: "${agr_v}" }
              as: AssociateAttorney
            - call: "POST /brand/coexistence-agreements/${agr_id}/counter"
              payload: { counter_terms_text: "counter 1" }
              as: AssociateAttorney
              captures: { agr_v2: $.data.version }
          trigger:
            - call: "POST /brand/coexistence-agreements/${agr_id}/propose"
              payload: { terms_text: "stale proposal", expected_agreement_version: "${agr_v}" }
              as: AssociateAttorney
              captures: { err: $.data.error_id }
            - call: "POST /brand/coexistence-agreements/${agr_id}/propose"
              payload: { terms_text: "fresh proposal", expected_agreement_version: "${agr_v2}" }
              as: AssociateAttorney
          assert:
            - "Stale propose (creation-time version): error_id == ERR_STALE_VERSION, http 412, status stays COUNTERED, round_count stays 2"
            - "Fresh propose (post-counter version): succeeds, status == PROPOSED, round_count == 3"

      - name: evidence_count_reconciliation_forward_and_reverse
        claim_type: derived_field_reconciliation
        grounds: [entities.TrademarkRecord.fields.verified_evidence_count, state_machines.UseEvidenceItem.VERIFIED_to_REJECTED]
        distinguishing_aspect: "The record's verified_evidence_count tracks its VERIFIED children in both directions with immediate read-after-write consistency: verify makes it 1, a subsequent reject of the same item brings it back to 0."
        test_recipe:
          setup: ["Client; record; one evidence item collected"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/evidence-items"
              payload: { nice_class: 9, specimen_type: LABEL, specimen_date: "2026-06-01T00:00:00Z" }
              as: Paralegal
              as_user_id: para_1
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /brand/evidence-items/${ev_id}/verify"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "GET /brand/trademark-records/${rec_id}"
              as: Paralegal
            - call: "POST /brand/evidence-items/${ev_id}/reject"
              payload: { reason: "specimen illegible" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "GET /brand/trademark-records/${rec_id}"
              as: Paralegal
          assert:
            - "After verify: TrademarkRecord.${rec_id}.verified_evidence_count == 1"
            - "After reject: verified_evidence_count == 0 (compensating decrement, no drift)"
            - "Both reads reflect the write immediately (immediate consistency model)"

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_escalate_writes
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.WatchAlert.UNDER_ASSESSMENT_to_ESCALATED]
        distinguishing_aspect: "All escalate writes are visible immediately: the 201 response IS the created ACTIVE matter with copied FKs, and a follow-up GET shows the alert ESCALATED with the client exposure already recomputed."
        test_recipe:
          setup: ["Client, PUBLISHED record, alert assessed to 80.00"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
          trigger:
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id, m_client: $.data.client_id, m_rec: $.data.trademark_record_id, m_alert: $.data.watch_alert_id, m_status: $.data.status }
            - call: "GET /brand/watch-alerts/${alert_id}"
              as: Paralegal
            - call: "GET /brand/clients/${client_id}"
              as: Paralegal
          assert:
            - "Escalate response matter: status == ACTIVE, posture == NORMAL, accrued_fees_cents == 0, resolution_outcome == null"
            - "Copied FKs: matter.client_id == ${client_id}, matter.trademark_record_id == ${rec_id}, matter.watch_alert_id == ${alert_id}"
            - "GET alert immediately after: status == ESCALATED"
            - "GET client immediately after: exposure_index == 20 (INFRINGEMENT) — the recompute is visible in the same request chain"
