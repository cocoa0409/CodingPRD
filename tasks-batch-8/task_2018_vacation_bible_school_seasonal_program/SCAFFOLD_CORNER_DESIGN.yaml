            - { call: "PATCH /vbs/classrooms/${cls_k}", payload: { capacity: 1, expected_classroom_version: "${cls_v}" }, as: RegistrationCoordinator, captures: { new_cap: $.data.capacity } }
            - { call: "POST /vbs/registrations/${reg_c}/accept", payload: {}, as: Parent, as_user_id: "${fam_id}", captures: { err: $.data.error_id } }
