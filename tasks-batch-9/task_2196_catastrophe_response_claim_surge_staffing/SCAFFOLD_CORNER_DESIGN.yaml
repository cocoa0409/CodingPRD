      - name: corner_sm_invalid_transition_five_illegal_hops_each_own_error
        claim_type: invalid_transition
        grounds:
          - state_machines.CatastropheEvent.transitions
          - state_machines.Claim.transitions
          - errors[ERR_EVENT_NOT_DECLARED]
          - errors[ERR_EVENT_NOT_SURGE_ACTIVE]
          - errors[ERR_CLAIM_NOT_CAT_CODED]
          - errors[ERR_CLAIM_NOT_INSPECTED]
          - errors[ERR_CLAIM_NOT_CLOSED]
        distinguishing_aspect: |
          Five hops that do not exist from the current states are attempted against a MONITORING event and an
          INTAKE claim with a null parent. Each must fail with the error named on the transition it tried to
          use — never a generic 409, never a 404 — and none may leave a partial trace: the event's version and
          status, the claim's two status axes, its zeroed severity and the empty ledger must all be untouched
          after the run. Skipping MONITORING -> DECLARED straight to SURGE_ACTIVE and closing an untouched
          claim are the two shortcuts a naive machine allows.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-1104' left in its initial MONITORING state (never declared)."
            - "One Claim taken with event_id omitted, so handling_status == INTAKE and event_id == null."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1104", peril_type: "WINTER_STORM", jurisdiction_state: "GA", event_start_utc: "2026-07-28T00:00:00.000Z", exposure_count: 120, avg_insured_value: 140000, expected_severity_index: 0.1000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id, ev_v_at_create: $.data.version, ev_status_at_create: $.data.status }
            - call: "POST /claims"
              payload: { policy_number: "POL-1104A", loss_state: "GA", loss_date_utc: "2026-07-28T00:00:00.000Z", reported_loss_amount: 9000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 120000, deductible_amount: 1000, estimated_damage_amount: 9000 }] }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id, cl_v_at_create: $.data.version }
          trigger:
            - call: "POST /catastrophe-events/${ev}/activate-surge"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /catastrophe-events/${ev}/demobilize"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /claims/${cl}/close"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /claims/${cl}/reopen"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "${ev_status_at_create} == MONITORING and ${ev_v_at_create} == 1 and ${cl_v_at_create} == 1"
            - "trigger call 1 response HTTP status == 409 and response.data.error_id == ERR_EVENT_NOT_DECLARED   # MONITORING cannot skip to SURGE_ACTIVE"
            - "trigger call 2 response HTTP status == 409 and response.data.error_id == ERR_EVENT_NOT_SURGE_ACTIVE"
            - "trigger call 3 response HTTP status == 409 and response.data.error_id == ERR_CLAIM_NOT_CAT_CODED   # handling_status IS INTAKE, so the second precondition is the one that fails"
            - "trigger call 4 response HTTP status == 409 and response.data.error_id == ERR_CLAIM_NOT_INSPECTED"
            - "trigger call 5 response HTTP status == 409 and response.data.error_id == ERR_CLAIM_NOT_CLOSED"
            - "every one of the five responses carries the error envelope with meta.api_request_id present"
            - "CatastropheEvent.${ev}.status == MONITORING and posture == OPEN and version == ${ev_v_at_create}"
            - "CatastropheEvent.${ev}.declared_at_utc == null and open_claim_count == 0 and case_reserve_total == 0.00"
            - "Claim.${cl}.handling_status == INTAKE and payment_status == NONE and version == ${cl_v_at_create}"
            - "Claim.${cl}.severity_score == 0.00 and triage_tier == null and inspection_mode == null and deadline_utc == null and reopen_count == 0"
            - "Claim.${cl}.closing_examiner_user_id == null and case_reserve == 0.00"
            - "GET /reserve-entries?claim_id=${cl} returns meta.total_count == 0 — five rejected hops appended nothing"

      - name: corner_sm_terminal_state_lockdown_closed_event_and_released_block
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CatastropheEvent.terminal_states
          - state_machines.CatastropheEvent.DECLARED_to_CLOSED
          - state_machines.HousingBlock.ACTIVE_to_RELEASED
          - errors[ERR_EVENT_NOT_MONITORING]
          - errors[ERR_HOUSING_NOT_RELEASABLE]
        distinguishing_aspect: |
          CLOSED is CatastropheEvent's only terminal state and it is reached here by the stand-down branch
          (DECLARED -> CLOSED with zero open claims and zero surge adjusters), which is the cheapest way in.
          Every trigger of the machine must then be refused with the error of the transition it attempted —
          including /declare, which would otherwise look like a harmless "restart". The cascade's collateral,
          the block driven to RELEASED, is locked down too: RELEASED has no outgoing transition, so a second
          release is ERR_HOUSING_NOT_RELEASABLE rather than a no-op 200.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One DECLARED CatastropheEvent 'CAT-2026-1105' (HAIL, TX) with no claims and no adjusters, so it is stand-down eligible."
            - "One HousingBlock left in PENDING, which the stand-down close must drive to RELEASED."
            - "The event is then closed, reaching its terminal state with posture FROZEN."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1105", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 90, avg_insured_value: 130000, expected_severity_index: 0.0500 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /housing-blocks"
              payload: { event_id: "${ev}", hotel_name: "Standdown Suites", city: "Austin", rooms_total: 3, nightly_rate: 110, block_start_date: "2026-09-01T00:00:00.000Z", block_end_date: "2026-09-04T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { hb: $.data.id }
            - call: "POST /catastrophe-events/${ev}/close"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { closed_status: $.data.status, closed_posture: $.data.posture, ev_v_closed: $.data.version }
          trigger:
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /catastrophe-events/${ev}/activate-surge"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /catastrophe-events/${ev}/demobilize"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /housing-blocks/${hb}/release"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
          assert:
            - "${closed_status} == CLOSED and ${closed_posture} == FROZEN"
            - "trigger call 1 response HTTP status == 409 and response.data.error_id == ERR_EVENT_NOT_MONITORING   # a closed event cannot be re-declared"
            - "trigger call 2 response HTTP status == 409 and response.data.error_id == ERR_EVENT_NOT_DECLARED"
            - "trigger call 3 response HTTP status == 409 and response.data.error_id == ERR_EVENT_NOT_SURGE_ACTIVE"
            - "trigger call 4 response HTTP status == 409 and response.data.error_id == ERR_HOUSING_NOT_RELEASABLE   # RELEASED is terminal for HousingBlock too"
            - "CatastropheEvent.${ev}.status == CLOSED and posture == FROZEN and version == ${ev_v_closed}"
            - "CatastropheEvent.${ev}.declared_at_utc == 2026-08-01T00:00:00.000Z"
            - "HousingBlock.${hb}.status == RELEASED and rooms_occupied == 0 and rooms_available == 3"
            - "GET /housing-blocks?event_id=${ev}&status=RELEASED returns meta.total_count == 1"

      - name: corner_sm_idempotency_repeat_triage_void_and_open_are_rejected_not_replayed
        claim_type: idempotency
        grounds:
          - state_machines.Claim.INTAKE_to_TRIAGED
          - state_machines.AdvancePayment.ISSUED_to_VOIDED
          - state_machines.HousingBlock.PENDING_to_ACTIVE
          - errors[ERR_CLAIM_NOT_IN_INTAKE]
          - errors[ERR_ADVANCE_NOT_ISSUED]
          - errors[ERR_HOUSING_NOT_PENDING]
