          - state_machines[MenuPeriodReview] CLASSIFIED -> CLOSED
        distinguishing_aspect: "Three reviews carry a mix line for the same item: a CLOSED one ending 2026-07-01 with 100 units, a CLOSED one ending 2026-08-01 with 40 units and a still-MIX_LOADED one with 900 units. baseline_units must be 40 — the period_end DESC ranking picks the later CLOSED review, the un-closed review is excluded no matter how large, and DEFAULT_BASELINE_UNITS is not consulted because a qualifying line does exist. The projection fans out from that single number, so 40 versus 100 versus 900 versus 1000 gives four different projected_units and four different contribution deltas."
