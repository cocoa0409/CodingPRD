            - "$.data.error_id == ERR_DORMANCY_NOT_DUE (364 < 365 threshold)"
            - "GET /accounts/${acct_h} -> Account.status == ACTIVE"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ach_debit_returns_when_debtor_frozen
        grounds:
          - state_machines.Transaction.PENDING_to_RETURNED
          - state_machines.Account.ACTIVE_to_FROZEN
          - state_machines.AchOrigination.STAGED_to_SETTLED
          - entities.Transaction.fields.return_reason_code
        distinguishing_aspect: |
          A settling DEBIT leg's outcome depends on the debtor Account's status: when the debtor
          is FROZEN the produced Transaction is RETURNED with return_reason_code ACCOUNT_FROZEN
          rather than POSTED. Entity pair = Transaction depends on Account, distinct from the
          Application-depends-on-ApyTier pair below.
        test_recipe:
          setup:
            - "A funded debtor account that is FROZEN, a creditor account, and a STAGED batch with one DEBIT leg 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Frozen Debtor", date_of_birth: "1990-01-01", tax_id_last4: "8080", country_of_residence: "US" }
              as: Teller
              captures: { cust_fd: $.data.id }
            - call: "POST /applications"
