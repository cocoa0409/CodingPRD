  - Ledger.pending_balance_cents recomputed excluding this row
- method: POST
  path: /transactions/{id}/mark_settled
  description: Move a manual ledger entry (payment_order_id IS NULL, i.e. booked through POST /ledgers/{id}/transactions)
    to the settled partition so it enters the posted book without a rail round trip
  roles:
  - PaymentOpsAnalyst
  - LedgerController
  code: 200
  input: []
  output: Transaction
  side_effects:
