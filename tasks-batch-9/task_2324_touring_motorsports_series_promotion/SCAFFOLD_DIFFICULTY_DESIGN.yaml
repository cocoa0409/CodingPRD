              as: SeriesPromoter
              captures: { alloc_dg: "$.data.id" }
          assert:
            - "at the boundary: trigger call 1 returns HTTP 201, MarketingAllocation.${alloc_gr}.amount_cents == 2400000 and state == COMMITTED (channel_total_after == channel_cap_cents == 2400000 is admitted)"
            - "TourStop.${stop_atl}.marketing_spend_committed_cents == 2400000 and Season.${season}.marketing_unallocated_cents == 37600000"
            - "one cent past the boundary: trigger call 3 returns HTTP 409 with ${err_cap} == ERR_CHANNEL_CAP_EXCEEDED (channel_total_after 2400001 > 2400000)"
            - "the stop cap is not the cause: stop_total_after would have been 2400001, far below the 8000000 stop cap, so ERR_STOP_MARKETING_CAP_EXCEEDED must not be returned"
            - "same-cent control on a different channel: trigger call 4 returns HTTP 201, so the single cent is only inadmissible against the GRASSROOTS running total"
            - "after all four calls: TourStop.${stop_atl}.marketing_spend_committed_cents == 2400001 and Season.${season}.marketing_allocated_cents == 2400001"

      - name: run_order_exact_fit_at_the_show_window_then_one_more_segment_overruns
        grounds:
          - calculations.run_order_timeline
          - validations[order=39]
          - entities.TourStop.fields.run_order_end_offset_minutes
          - global_constants.FLOOR_RESET_MINUTES
          - errors.ERR_SHOW_WINDOW_EXCEEDED
        distinguishing_aspect: |
          A different boundary metric (integer minutes of on-floor time) on a different endpoint
          (POST /tour-stops/{id}/show-segments). The run order is packed to land its final segment
          exactly on show_window_minutes == 150, which the `>` comparison admits; the next segment is
          rejected before a single minute of its own duration is counted, because the mandatory 8-minute
          COMPETITION-to-COMPETITION floor reset alone already starts it at 158.
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking and its TourStop with show_window_minutes 150 and show_start_utc 2026-11-14T23:00:00Z"
            - "No show segments yet"
          setup_api_calls:
