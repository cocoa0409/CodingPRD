# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3386_case_screening_evidence_testing_requests_exoneration_support
#
# Breadth probe over every testable claim §1.1-§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# covers appear as excluded_because stubs (no test_recipe).
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: jurisdiction_create_applies_defaults_and_roundtrips
        claim_type: Defaults
        grounds: [entities.Jurisdiction, endpoints.POST_/jurisdictions]
        distinguishing_aspect: "Omitting the three optional statute fields stores null deadline / null cap / 0 enhancement, and every stored field round-trips through GET unchanged."
        test_recipe:
          setup: ["Empty database; clock default."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "AK", name: "Alaska", has_post_conviction_dna_statute: false, clemency_available: false, compensation_statute_exists: false }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${jur_id}"
              as: PlatformAdmin
              captures: { dl: $.data.post_conviction_deadline_years, cap: $.data.compensation_cap_cents, enh: $.data.actual_innocence_enhancement_pct }
          assert:
            - "create response status 201; version == 1; id/created_at/updated_at present"
            - "post_conviction_deadline_years is null and compensation_cap_cents is null (optionals omitted)"
            - "actual_innocence_enhancement_pct == 0 (declared default applied)"
            - "GET returns state_code == 'AK', has_post_conviction_dna_statute == false, clemency_available == false, compensation_statute_exists == false"

      - name: client_create_returns_system_minted_fields
        claim_type: Creation
        grounds: [entities.Client, endpoints.POST_/clients]
        distinguishing_aspect: "A client created with only required fields returns 201 with server-minted id, created_at/updated_at with three fractional digits, version 1, and no facility_name key constraint violated (null)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Prim Okafor", inmate_number: "XX-0001" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
          assert:
            - "status 201; response_type == object; meta.api_request_id and meta.api_request_timestamp present"
            - "Client.${client_id}.full_name == 'Prim Okafor' and inmate_number == 'XX-0001'"
            - "version == 1; created_at and updated_at are ISO-8601 UTC with millisecond precision"
            - "facility_name is null (optional omitted)"

      - name: intake_create_initializes_screening_fields
        claim_type: Initial State
        grounds: [entities.IntakeRequest, state_machines.IntakeRequest]
        distinguishing_aspect: "A fresh intake request starts in RECEIVED with null scores, null recommendation/decision, expedited_review defaulted false, and accepted_case_id null."
        test_recipe:
          setup: ["Jurisdiction and client exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "VT", name: "Vermont", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Quentin Abe", inmate_number: "VT-11" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2021-04-01T00:00:00Z", conviction_summary: "Init-state probe", claim_of_actual_innocence: false, claim_strength: "WEAK", evidence_potential: "NONE_KNOWN", years_served: 5, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id, st: $.data.status, ex: $.data.expedited_review }
          assert:
            - "status == RECEIVED (initial_state)"
            - "expedited_review == false (default)"
            - "screening_score_standard, screening_score_expedited, waitlist_priority_score, recommendation, decision, decided_by_user_id, accepted_case_id are all null"

      - name: case_is_created_only_by_accept_decision
        claim_type: Creation
        grounds: ["state_machines.IntakeRequest.DECISION_PENDING_to_ACCEPTED", "endpoints.GET_/intake-requests/{id}/cases"]
        distinguishing_aspect: "There is no POST /cases: a REJECTED decision leaves the intake's case list empty, while an ACCEPTED decision materializes exactly one Case whose intake_request_id points back."
        test_recipe:
          setup: ["Two intake requests in DECISION_PENDING (same jurisdiction, two clients)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "ME", name: "Maine", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ray Doss", inmate_number: "ME-1" }
              as: IntakeSpecialist
              captures: { cl1: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Sara Penn", inmate_number: "ME-2" }
              as: IntakeSpecialist
              captures: { cl2: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl1}", jurisdiction_id: "${jur_id}", conviction_date: "2020-01-01T00:00:00Z", conviction_summary: "Will be rejected", claim_of_actual_innocence: false, claim_strength: "WEAK", evidence_potential: "NONE_KNOWN", years_served: 6, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_rej: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl2}", jurisdiction_id: "${jur_id}", conviction_date: "2020-01-01T00:00:00Z", conviction_summary: "Will be accepted", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 6, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_acc: $.data.id }
            - { call: "POST /intake-requests/${r_rej}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_rej}/advance", payload: { event: "RECOMMEND", recommendation: "REJECT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - { call: "POST /intake-requests/${r_acc}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_acc}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - { call: "POST /intake-requests/${r_rej}/decide", payload: { decision: "REJECTED", rejection_reason: "No innocence claim" }, as: ManagingAttorney, as_user_id: "ma_1" }
          trigger:
            - call: "GET /intake-requests/${r_rej}/cases"
              as: ManagingAttorney
              captures: { n_rej: $.meta }
            - call: "POST /intake-requests/${r_acc}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_9" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - call: "GET /intake-requests/${r_acc}/cases"
              as: ManagingAttorney
          assert:
            - "rejected intake: GET /intake-requests/{id}/cases returns response_type array with total_count == 0 (no Case materialized)"
            - "accepted intake: total_count == 1 and the element's intake_request_id == ${r_acc}, status == OPEN, assigned_attorney_id == 'atty_9', contact_interval_days == 90, release_readiness == NOT_APPLICABLE, evidence_posture == NO_EVIDENCE"
            - "the accepted intake request's accepted_case_id equals that Case's id and decision == 'ACCEPTED'"

      - name: get_case_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CASE_NOT_FOUND]", "endpoints.GET_/cases/{id}"]
        distinguishing_aspect: "A well-formed but nonexistent UUID in the case path resolves to ERR_CASE_NOT_FOUND with http 404 and the error envelope, not a stack trace or empty object."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/11111111-2222-4333-8444-555555555555"
              as: StaffAttorney
              captures: { err: $.data.error_id }
          assert:
            - "http 404; response_type == error; data.error_id == ERR_CASE_NOT_FOUND; data.message present"

      - name: evidence_item_create_computes_remaining_and_posture
        claim_type: Computed Fields
        grounds: [entities.EvidenceItem.fields.remaining_sample_ng, calculations.evidence_posture_derivation]
        distinguishing_aspect: "remaining_sample_ng is server-computed to equal initial_sample_ng at creation (client cannot set it), and the parent Case's evidence_posture flips NO_EVIDENCE -> SEEKING on first item creation."
        test_recipe:
          setup: ["Accepted case (OPEN)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "UT", name: "Utah", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Uma West", inmate_number: "UT-7" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2019-09-09T00:00:00Z", conviction_summary: "Computed-field probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id, posture0: $.data }
            - call: "GET /cases/${case_id}"
              as: StaffAttorney
              captures: { posture_before: $.data.evidence_posture }
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case_id}", description: "Envelope with hair", evidence_type: "OTHER", custodian_type: "COURT_CLERK", initial_sample_ng: 9 }
              as: EvidenceAnalyst
              captures: { item_id: $.data.id, rem: $.data.remaining_sample_ng, loc: $.data.location_status, tst: $.data.testing_status }
            - call: "GET /cases/${case_id}"
              as: StaffAttorney
              captures: { posture_after: $.data.evidence_posture }
          assert:
            - "item response: remaining_sample_ng == 9 (== initial_sample_ng), location_status == IDENTIFIED, testing_status == UNTESTED"
            - "case evidence_posture before == NO_EVIDENCE, after == SEEKING (derived, not settable)"

      - name: list_intake_requests_pagination_and_status_filter
        claim_type: Listing
        grounds: [endpoints.GET_/intake-requests, response_envelope]
        distinguishing_aspect: "Filter + paginate interaction: with 3 requests (2 in SCREENING, 1 RECEIVED), status=SCREENING&limit=1 returns exactly 1 row with total_count 2 and has_more true; offset=1 returns the other; an unfiltered list uses the default limit 10."
        test_recipe:
          setup: ["Three intake requests: r1 and r2 advanced to SCREENING, r3 left RECEIVED."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "NH", name: "New Hampshire", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ann Wren", inmate_number: "NH-1" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2022-01-01T00:00:00Z", conviction_summary: "P1", claim_of_actual_innocence: true, claim_strength: "WEAK", evidence_potential: "UNCERTAIN", years_served: 4, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r1: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2022-01-02T00:00:00Z", conviction_summary: "P2", claim_of_actual_innocence: true, claim_strength: "WEAK", evidence_potential: "UNCERTAIN", years_served: 4, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r2: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2022-01-03T00:00:00Z", conviction_summary: "P3", claim_of_actual_innocence: true, claim_strength: "WEAK", evidence_potential: "UNCERTAIN", years_served: 4, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r3: $.data.id }
            - { call: "POST /intake-requests/${r1}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r2}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
          trigger:
            - call: "GET /intake-requests?status=SCREENING&limit=1&offset=0"
              as: IntakeSpecialist
            - call: "GET /intake-requests?status=SCREENING&limit=1&offset=1"
              as: IntakeSpecialist
            - call: "GET /intake-requests"
              as: IntakeSpecialist
          assert:
            - "page 1: response_type array, 1 data row, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "page 2: exactly the other SCREENING request, total_count == 2, has_more == false"
            - "unfiltered: 3 rows, total_count == 3, default limit == 10 applied"
            - "r3 (RECEIVED) never appears under status=SCREENING"

      - name: decide_accepted_response_carries_decision_fields
        claim_type: Retrieval
        grounds: ["endpoints.POST_/intake-requests/{id}/decide", "entities.IntakeRequest.fields.decided_by_user_id"]
        distinguishing_aspect: "The decide response is the updated IntakeRequest carrying decision, decided_by_user_id equal to the caller's X-User-ID, and the new accepted_case_id — the only channel through which the cascaded Case id is discoverable."
        test_recipe:
          setup: ["One intake request in DECISION_PENDING (recommended by spec_1)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "RI", name: "Rhode Island", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Bo Kline", inmate_number: "RI-3" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2018-08-08T00:00:00Z", conviction_summary: "Decide-fields probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "CONFIRMED_STORED", years_served: 8, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
          trigger:
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_5" }
              as: ManagingAttorney
              as_user_id: "ma_7"
              captures: { cid: $.data.accepted_case_id, dec: $.data.decision, by: $.data.decided_by_user_id }
          assert:
            - "decision == ACCEPTED; decided_by_user_id == 'ma_7' (the caller, not the recommender 'spec_1')"
            - "accepted_case_id is a non-null UUID; GET /cases/${cid} returns status OPEN and assigned_attorney_id 'atty_5'"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: records_response_destroyed_rejected_for_confirmed_item
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RecordsRequest.SUBMITTED_to_FULFILLED"
        distinguishing_aspect: "A DESTROYED reveal is legal only while the item is IDENTIFIED/SEARCHING/REPORTED_MISSING; against a CUSTODY_CONFIRMED item the whole RECORD_RESPONSE fails with ERR_INVALID_STATE and neither entity mutates."
        test_recipe:
          setup: ["Case OPEN; item advanced to CUSTODY_CONFIRMED; records request SUBMITTED."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "KS", name: "Kansas", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Kit Darn", inmate_number: "KS-4" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2019-01-01T00:00:00Z", conviction_summary: "Reveal-legality probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "CONFIRMED_STORED", years_served: 7, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case_id}", description: "Vial", evidence_type: "BIOLOGICAL_SWAB", custodian_type: "CRIME_LAB", initial_sample_ng: 8 }
              as: EvidenceAnalyst
              captures: { item_id: $.data.id }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "START_SEARCH" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "MARK_LOCATED" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "CONFIRM_CUSTODY" }, as: EvidenceAnalyst }
            - call: "POST /records-requests"
              payload: { case_id: "${case_id}", agency_type: "LABORATORY", agency_name: "State Crime Lab", request_summary: "Storage logs for vial" }
              as: EvidenceAnalyst
              captures: { rr_id: $.data.id }
            - { call: "POST /records-requests/${rr_id}/advance", payload: { event: "SUBMIT" }, as: EvidenceAnalyst }
          trigger:
            - call: "POST /records-requests/${rr_id}/advance"
              payload: { event: "RECORD_RESPONSE", disposition: "FULFILLED", items_revealed: [ { evidence_item_id: "${item_id}", disposition: "DESTROYED" } ] }
              as: EvidenceAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /evidence-items/${item_id}"
              as: EvidenceAnalyst
              captures: { loc: $.data.location_status }
            - call: "GET /cases/${case_id}/records-requests"
              as: EvidenceAnalyst
              captures: { rr_status: "$.data[0].status" }
          assert:
            - "RECORD_RESPONSE fails with ERR_INVALID_STATE (409): DESTROYED is illegal against CUSTODY_CONFIRMED"
            - "EvidenceItem.location_status remains CUSTODY_CONFIRMED (no partial cascade)"
            - "RecordsRequest remains SUBMITTED (atomic rejection, no status drift)"

      - name: accepted_intake_is_terminal_for_advance
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.IntakeRequest"
        distinguishing_aspect: "Once ACCEPTED, every advance event on the intake request — including the otherwise-legal REQUEST_MORE_INFO — fails with ERR_INVALID_STATE; the created Case is unaffected."
        test_recipe:
          setup: ["One ACCEPTED intake request (case created)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "ID", name: "Idaho", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Lou Fern", inmate_number: "ID-8" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2017-07-07T00:00:00Z", conviction_summary: "Terminal probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 9, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - { call: "POST /intake-requests/${r_id}/decide", payload: { decision: "ACCEPTED" }, as: ManagingAttorney, as_user_id: "ma_1" }
          trigger:
            - call: "POST /intake-requests/${r_id}/advance"
              payload: { event: "REQUEST_MORE_INFO" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "advance on the ACCEPTED (terminal) request fails with ERR_INVALID_STATE (409)"

      - name: motion_kind_rejects_agreement_events_and_cycles_to_grant
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.TestingAuthorization"
        distinguishing_aspect: "kind=MOTION follows the court graph: PROPOSE (an AGREEMENT event) is ERR_INVALID_STATE even from DRAFTED, and the motion can loop DENIED -> APPEALED -> RECORD_RULING until a GRANTED flips the item to TESTING_AUTHORIZED."
        test_recipe:
          setup: ["Case INVESTIGATION; item CUSTODY_CONFIRMED; a kind=MOTION authorization exists."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "MT", name: "Montana", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Nia Ford", inmate_number: "MT-9" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2016-06-06T00:00:00Z", conviction_summary: "Motion-graph probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "CONFIRMED_STORED", years_served: 10, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
