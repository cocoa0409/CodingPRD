      - name: guardian_ownership_beats_placement_state
        grounds:
          - validations[priority=3]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair {auth, state} — disjoint from the {state, business_temporal} pair:
          a guardian whose X-User-ID does not match the student's primary_guardian_user_id
          (ownership violation, priority 3) attempts accept on a placement that is already ACTIVE
          (state violation, priority 7). ERR_GUARDIAN_MISMATCH must win.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; student honored via TRANSFER_HONOR (guardian guard-1)"
            - "PULL_OUT placement offered and already accepted by guard-1 -> ACTIVE (no longer OFFERED)"
