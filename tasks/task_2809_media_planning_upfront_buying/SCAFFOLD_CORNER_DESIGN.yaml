        claim_type: Priority Ordering
        grounds:
          - validations[priority 11]
          - validations[priority 43]
          - errors.ERR_BUY_NOT_IN_EXPECTED_STATE
          - errors.ERR_CAMPAIGN_BUDGET_EXCEEDED
        excluded_because:
          difficulty_instance: buy_state_check_outranks_campaign_budget_check_on_replacement
          rationale: |
            That instance constructs a single request that violates both rules at once and
            asserts the priority 11 error, then removes the state violation to prove the
            priority 43 error is what the same request would otherwise return - both halves
            of the ordering claim are already covered.

      - name: cancellation_window_rule_outranks_the_percentage_ceiling_rule
        claim_type: Priority Ordering
        grounds:
          - validations[priority 21]
          - validations[priority 26]
          - errors.ERR_RIGHTS_WINDOW_CLOSED
          - errors.ERR_RIGHTS_PCT_ABOVE_CEILING
        excluded_because:
          difficulty_instance: cancellation_window_close_outranks_pct_ceiling
          rationale: |
            The window and ceiling rules are violated together there, at the exact
            cancel_window_2_close instant with a request above the 25.00 percent late
            ceiling, and the instance asserts that ERR_RIGHTS_WINDOW_CLOSED is the single
            reported error.

  # =========================================================================
  # Endpoints - one instance per claim_type row of the endpoint table.
  # The guide's "Bulk action" row has no instance because SCAFFOLD.yaml §1.5
  # declares no bulk endpoint: every mutation addresses exactly one resource.
  # =========================================================================
  - section: endpoints
    instances:
      - name: close_endpoint_completes_a_buy_within_tolerance
        claim_type: Action endpoint
        grounds:
          - "endpoints[POST /upfront/buys/{buyId}/close]"
          - "state_machines.Buy.buy_status.IN_FLIGHT_to_COMPLETED"
          - "state_machines.Buy.stewardship_status.NOT_STARTED_to_WITHIN_TOLERANCE"
          - "calculations.post_buy_shortfall"
        distinguishing_aspect: |
          The action endpoint is only reachable through the system-driven axis: the buy must first be
          carried PLACED -> IN_FLIGHT by the first report acceptance, and its stewardship axis must
          already sit in WITHIN_TOLERANCE or MADE_GOOD. This instance walks the whole path with a
          shortfall of 1.0000 percent (below the 2.0000 tolerance), so no MakeGood is ever created and
          close is legal. An implementation that exposes close as a plain status setter, or that
          requires a MakeGood before closing, fails.
