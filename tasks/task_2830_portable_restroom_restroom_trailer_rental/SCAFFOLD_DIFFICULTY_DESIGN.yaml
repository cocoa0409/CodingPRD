              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-7001", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
