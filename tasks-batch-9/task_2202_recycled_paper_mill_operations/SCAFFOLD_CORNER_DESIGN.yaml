            - "after all four calls the clock still reads 2026-08-03T00:00:00Z, so the refused call did not advance it"

      - name: absent_headers_outrank_an_unknown_role_name
        claim_type: cross_role_denial
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "A request that both omits X-User-ID and carries a role name that is not one of the eight declared roles must return 401 ERR_MISSING_AUTH_HEADERS, not ERR_UNKNOWN_ROLE: priority 1 strictly precedes priority 2. An empty-string X-User-ID counts as absent, which is the second half of this claim and the part a truthiness-free implementation gets wrong."
        test_recipe:
          setup: ["An empty system; three read attempts against the fiber-grade list with malformed auth headers."]
          setup_api_calls: []
          trigger:
            - call: "GET /fiber-grades"
              payload: {}
              as: "MillSuperintendent (undeclared role name)"
              as_user_id: "(X-User-ID header omitted entirely)"
            - call: "GET /fiber-grades"
              payload: {}
              as: FiberBuyer
              as_user_id: "(X-User-ID header present but empty string)"
            - call: "GET /fiber-grades"
              payload: {}
              as: "(X-User-Role header omitted entirely)"
              as_user_id: "buyer-1"
          assert:
            - "the first call returns HTTP 401 with response.data.error_id == 'ERR_MISSING_AUTH_HEADERS' — NOT 'ERR_UNKNOWN_ROLE'"
            - "the second call returns HTTP 401 with response.data.error_id == 'ERR_MISSING_AUTH_HEADERS'"
            - "the third call returns HTTP 401 with response.data.error_id == 'ERR_MISSING_AUTH_HEADERS'"
            - "GET /fiber-grades as FiberBuyer with X-User-ID 'buyer-1' returns HTTP 200 with total_count == 0, proving the endpoint itself is healthy"

      - name: an_undeclared_role_is_rejected_before_identity_resolution
        claim_type: cross_role_denial
        grounds:
          - validations.priority_2
          - validations.priority_3
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "Both headers are present, so priority 1 passes, but 'MillSuperintendent' is not among the eight roles of §1.7 and the X-User-ID happens to be a real Supplier row id. The answer must be 401 ERR_UNKNOWN_ROLE from priority 2 — the identity lookup at priority 3 and the endpoint role list at priority 4 are never consulted. Casing matters too: 'millplanner' is not the declared 'MillPlanner'."
        test_recipe:
          setup: ["One Supplier row, whose id is deliberately reused as the X-User-ID of the malformed calls."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
