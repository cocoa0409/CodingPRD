scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: aptc_estimated_vs_reconciled_on_application
        grounds:
          - calculations.aptc_estimated
          - calculations.aptc_estimated.variants[estimated]
          - calculations.aptc_estimated.variants[reconciled]
          - entities.Application.fields.aptc_estimated_cents
          - entities.Application.fields.aptc_reconciled_cents
          - endpoints.POST_/_sweep/reconcile-aptc
        distinguishing_aspect: |
          The estimated variant runs forward-looking at ELIGIBILITY_DETERMINED time and uses the CURRENT
          total_magi_cents (including any IncomeRecord rows that have been submitted, even retroactive corrections),
          while the reconciled variant time-slices the IncomeRecord ledger so a corrective record with
          effective_date=2026-07-01 only contributes to MAGI for months >= July 2026 — therefore for identical
          IncomeRecord inputs the two values diverge whenever a corrective IncomeRecord arrives mid-year.
          This dual variant operates on Application (eligibility/subsidy domain).
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-01-15T00:00:00Z"
            - "Insurer + benchmark Silver Plan exist for filing_state=CA, coverage_year=2026, base_monthly_premium_cents=40000"
            - "Application(filing_state=CA, coverage_year=2026) with HouseholdMember PRIMARY_FILER age 35"
            - "IncomeRecord(WAGES, amount_cents=2_500_000, effective_date=2026-01-01)"
            - "POST /applications/{id}/submit"
            - "POST /applications/{id}/determine-eligibility — produces aptc_estimated_cents based on 25,000 MAGI"
            - "POST /applications/{id}/approve and create Enrollment"
            - "POST /_clock/advance to 2026-07-01T00:00:00Z"
            - "POST /applications/{id}/household-members/{member_id}/income-records {source_type:WAGES, amount_cents:3_500_000, effective_date:2026-07-01, supersedes_id:<first IR>}"
            - "POST /_clock/advance to 2027-01-02T00:00:00Z"
            - "POST /_sweep/reconcile-aptc {coverage_year:2026}"
          trigger:
            - "GET /applications/{id}"
          assert:
            - "Application.aptc_estimated_cents was pinned at SUBMITTED→ELIGIBILITY_DETERMINED with MAGI=2_500_000 and never changed"
            - "Application.aptc_reconciled_cents differs from aptc_estimated_cents because months Jan-Jun 2026 use MAGI 2_500_000 while months Jul-Dec use MAGI 3_500_000"
            - "Application.aptc_reconciled_cents != Application.aptc_estimated_cents (literal inequality; PRD test computes both literals against APPLICABLE_PERCENTAGE_TABLE)"

      - name: payment_status_rollup_strict_vs_grace_on_enrollment
        grounds:
          - calculations.payment_status_rollup
          - entities.Enrollment.fields.payment_status
          - entities.Enrollment.fields.coverage_status
          - state_machines.Enrollment.ACTIVE_to_GRACE_PERIOD
          - state_machines.Enrollment.GRACE_PERIOD_to_TERMINATED
          - endpoints.POST_/_sweep/age-invoices
        distinguishing_aspect: |
          The same set of unpaid PremiumInvoice rows yields two different observable payment_status outcomes
          depending on which algorithm the rollup runs: a strict reading (any unpaid invoice past due_date →
          DELINQUENT_M1) flips coverage_status to GRACE_PERIOD immediately, while the grace-aware algorithm
          (the scaffold-pinned formula in calculations.payment_status_rollup) gives the consumer a 30-day grace
          window after due_date before flipping payment_status. Same invoice ledger, two algorithms, different
          coverage_status results. This dual-variant operates on Enrollment (billing/coverage domain), distinct
          from the Application domain of instance 1.
        test_recipe:
          setup:
            - "Enrollment ACTIVE with monthly_net_premium_cents=20000"
            - "PremiumInvoice for billing_month=2026-03 due_date=2026-03-01, status=ISSUED (unpaid)"
            - "POST /_clock/advance to 2026-03-15T00:00:00Z (14 days past due, inside the 30-day grace)"
          trigger:
            - "POST /_sweep/age-invoices"
            - "GET /enrollments/{id}"
          assert:
            - "Enrollment.payment_status == 'CURRENT' (grace-aware rollup; strict reading would have produced DELINQUENT_M1)"
            - "Enrollment.coverage_status == 'ACTIVE' (NOT GRACE_PERIOD)"
            - "POST /_clock/advance to 2026-04-05T00:00:00Z then POST /_sweep/age-invoices; now Enrollment.payment_status == 'DELINQUENT_M1' (35 days past due_date) and Enrollment.coverage_status == 'GRACE_PERIOD'"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: aptc_estimated_nonlinear_min_max_with_three_plus_inputs
        grounds:
          - calculations.aptc_estimated
          - calculations.aptc_estimated.constants.APPLICABLE_PERCENTAGE_TABLE
          - calculations.aptc_estimated.constants.AGE_CURVE_MULTIPLIERS
          - calculations.aptc_estimated.constants.TOBACCO_SURCHARGE
          - entities.Plan.fields.is_benchmark_silver
        distinguishing_aspect: |
          This is MODE (a) — a formula with 5 inputs (total_magi_cents, household_size, age-curve multiplier per
          member, tobacco flag per member, benchmark_silver base premium) and non-linear interaction: the
          applicable-percentage table is a tier-selected fraction (conditional branch on fpl_percentage), the
          age curve is per-member multiplicative, and the final value uses max(0, benchmark - contribution).
          Different from instance 2 which exercises MODE (b) nested-rounding-order.
        test_recipe:
          setup:
            - "Benchmark Silver Plan for CA, 2026, base_monthly_premium_cents=40000 (annual base 480000)"
            - "Application household_size=2 (two PRIMARY_FILER+SPOUSE, both age 35, no tobacco)"
            - "IncomeRecord total summing to total_magi_cents=4_500_000 (MAGI $45,000)"
            - "POST /applications/{id}/submit"
            - "POST /applications/{id}/determine-eligibility"
          trigger:
            - "GET /applications/{id}"
          assert:
            - "fpl_percentage == 211.2 (round_half_up of 4_500_000 / 2_131_000 * 100 = 211.169...)"
            - "Applicable-percentage tier == [200.0, 250.0) → fraction 0.04"
            - "expected_household_contribution_cents == 180_000 (4_500_000 * 0.04)"
            - "per-member annual premium == 12 * round_half_up(40000 * 1.181) == 12 * 47240 == 566_880"
            - "annual_benchmark_cents == 2 * 566_880 == 1_133_760"
            - "Application.aptc_estimated_cents == max(0, 1_133_760 - 180_000) == 953_760"
            - "Application.csr_eligibility == 'CSR_73' (fpl_percentage 211.2 falls in [200.0, 250.0))"

      - name: monthly_premium_per_member_round_then_sum_pinned_order
        grounds:
          - calculations.monthly_premium
          - calculations.monthly_premium.constants.ROUNDING_ORDER
          - calculations.aptc_estimated.constants.AGE_CURVE_MULTIPLIERS
        distinguishing_aspect: |
          This is MODE (b) — nested rounding where order matters. The scaffold pins
          'per-member round to nearest cent, THEN sum'. With base=12345 cents, age_mult=1.181, and 3 members:
          per-member round_half_up(12345 * 1.181) = round_half_up(14579.445) = 14579; sum = 43737.
          The alternative order (sum then round) yields round_half_up(12345 * 1.181 * 3) = round_half_up(43738.335) = 43738.
          A test pinning monthly_premium_gross_cents == 43737 falsifies the wrong order. Different mode from
          instance 1 (which was mode (a) min/max non-linear).
        test_recipe:
          setup:
            - "Plan with base_monthly_premium_cents=12345"
            - "PlanVariant STANDARD attached"
            - "Application APPROVED with 3 HouseholdMember rows all age 35 (age_mult 1.181), all include_in_household=true, no tobacco"
            - "Application.csr_eligibility == 'NONE'"
          trigger:
            - "POST /enrollments {application_id, plan_variant_id}"
          assert:
            - "Enrollment.monthly_premium_gross_cents == 43737 (per-member round_half_up then sum)"
            - "Enrollment.monthly_premium_gross_cents != 43738 (NOT the sum-then-round order)"

      - name: enrollment_net_premium_evaluation_order_when_subsidy_caps
        grounds:
          - calculations.monthly_premium
          - calculations.aptc_estimated
          - entities.Enrollment.fields.monthly_net_premium_cents
          - entities.Enrollment.fields.monthly_aptc_applied_cents
        distinguishing_aspect: |
          This is MODE (c) — a circular-looking dependency pinned by evaluation order. The scaffold pins:
          1) monthly_premium_gross_cents = sum of per-member rounded premiums;
          2) monthly_aptc_applied_cents = min( round_half_up(aptc_estimated_cents / 12), monthly_premium_gross_cents );
          3) monthly_net_premium_cents = gross - aptc_applied.
          The naive alternative — applying APTC fraction directly to net before computing the cap — produces
          a different number when aptc_estimated / 12 > gross. Test pins the cap to gross. Distinct mode (c)
          from instances 1 (mode a) and 2 (mode b).
        test_recipe:
          setup:
            - "Application aptc_estimated_cents == 1_500_000 (so /12 = 125_000)"
            - "Enrollment with monthly_premium_gross_cents == 47240 (single age-35 member, base 40000, age_mult 1.181)"
          trigger:
            - "POST /enrollments {application_id, plan_variant_id}"
          assert:
            - "Enrollment.monthly_aptc_applied_cents == 47240 (capped at gross, not 125_000)"
            - "Enrollment.monthly_net_premium_cents == 0"
            - "Enrollment.monthly_aptc_applied_cents != 125_000 (the uncapped alternative)"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_branch_with_revert_loop
        grounds:
          - state_machines.Application.SUBMITTED_to_DRAFT
          - state_machines.Application.APPROVED_to_ELIGIBILITY_DETERMINED
          - state_machines.Application.ELIGIBILITY_DETERMINED_to_APPROVED
          - state_machines.Application.ELIGIBILITY_DETERMINED_to_DENIED
        distinguishing_aspect: |
          Application has cycles: SUBMITTED → DRAFT (amend) → SUBMITTED, and APPROVED → ELIGIBILITY_DETERMINED
          (redetermine) → APPROVED, plus a branching fork ELIGIBILITY_DETERMINED → {APPROVED, DENIED} with
          divergent side-effect sets (APPROVE sets approved_at and allows /enrollments; DENY does not). Multiple
          non-linear shapes on Application entity.
        test_recipe:
          setup:
            - "Application in SUBMITTED state"
          trigger:
            - "POST /applications/{id}/amend"
            - "POST /applications/{id}/submit"
            - "POST /applications/{id}/determine-eligibility"
            - "POST /applications/{id}/approve"
            - "POST /applications/{id}/redetermine (loops back)"
          assert:
            - "After amend Application.status == 'DRAFT' and Application.pinned_fpl_table_version IS NULL"
            - "After second submit Application.status == 'SUBMITTED' and pinned_fpl_table_version is set again"
            - "After redetermine Application.status == 'ELIGIBILITY_DETERMINED' (cycle closed)"

      - name: enrollment_parallel_dimensions_coverage_vs_payment
        grounds:
          - entities.Enrollment.fields.coverage_status
          - entities.Enrollment.fields.payment_status
          - state_machines.Enrollment.ACTIVE_to_GRACE_PERIOD
          - state_machines.Enrollment.GRACE_PERIOD_to_ACTIVE
          - calculations.payment_status_rollup
        distinguishing_aspect: |
          Enrollment carries two parallel state dimensions on the SAME row that evolve INDEPENDENTLY:
          coverage_status in {PENDING_PAYMENT, ACTIVE, GRACE_PERIOD, TERMINATED} and payment_status in
          {AWAITING_BINDER, CURRENT, DELINQUENT_M1, DELINQUENT_M2, DELINQUENT_M3}. A single ageing event can
          flip payment_status without flipping coverage_status (the 30-day grace), and a payment posting can
          flip payment_status back to CURRENT while coverage_status remains GRACE_PERIOD until the rollup runs.
          Distinct entity (Enrollment) from instance 1's Application.
        test_recipe:
          setup:
            - "Enrollment ACTIVE with single PremiumInvoice ISSUED due_date 2026-03-01"
          trigger:
            - "POST /_clock/advance to 2026-04-05T00:00:00Z, POST /_sweep/age-invoices"
            - "POST /premium-invoices/{id}/post-payment {amount_cents:net_amount_cents}"
          assert:
            - "After the sweep: Enrollment.coverage_status == 'GRACE_PERIOD' AND Enrollment.payment_status == 'DELINQUENT_M1' (both dimensions advanced together this time)"
            - "After payment posting: Enrollment.payment_status == 'CURRENT' AND Enrollment.coverage_status == 'ACTIVE' (both dimensions reverted)"
            - "The pair (coverage_status, payment_status) is observable independently in GET /enrollments/{id}"

      - name: sep_event_reject_appeal_cycle
        grounds:
          - state_machines.SEPEvent.SUBMITTED_to_REJECTED
          - state_machines.SEPEvent.REJECTED_to_SUBMITTED
          - state_machines.SEPEvent.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          SEPEvent has an explicit cyclic shape: REJECTED → SUBMITTED via /appeal. Same entity row can move
          forward and backward in the lifecycle, distinct from a linear A→B→C. Operates on SEPEvent — a different
          entity from instances 1 (Application) and 2 (Enrollment).
        test_recipe:
          setup:
            - "Application with SEPEvent SUBMITTED"
            - "POST /applications/{app_id}/sep-events/{id}/reject"
          trigger:
            - "POST /applications/{app_id}/sep-events/{id}/appeal"
          assert:
            - "After reject SEPEvent.status == 'REJECTED'"
            - "After appeal SEPEvent.status == 'SUBMITTED' (cycle traversed)"
            - "A subsequent /verify with valid event_date succeeds (full cycle reachable)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sep_verify_depth3_cascade_redetermine_recalc_invoice
        grounds:
          - state_machines.SEPEvent.SUBMITTED_to_VERIFIED
          - state_machines.Application.APPROVED_to_ELIGIBILITY_DETERMINED
          - calculations.monthly_premium
          - entities.PremiumInvoice.fields.gross_amount_cents
          - entities.Enrollment.fields.monthly_aptc_applied_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by SEPEvent /verify on event_type=BIRTH_ADOPTION when parent Application
          is APPROVED with an active Enrollment. Chain: A) SEPEvent SUBMITTED→VERIFIED → B) Application
          APPROVED→ELIGIBILITY_DETERMINED (redetermine cascaded) → C) Enrollment.monthly_premium recompute and
          Enrollment.monthly_aptc_applied_cents updated → D) fresh PremiumInvoice issued for next billing_month.
          Each link is caused by the previous link, not by the original verify call directly. Originates from
          SEPEvent /verify trigger.
        test_recipe:
          setup:
            - "Application APPROVED with Enrollment ACTIVE, monthly_premium_gross_cents=47240 (one age-35 PRIMARY_FILER)"
            - "POST /applications/{id}/household-members {filer_type:DEPENDENT, date_of_birth:'2026-05-12'}"
            - "POST /applications/{app_id}/sep-events {event_type:BIRTH_ADOPTION, event_date:'2026-05-12'}"
            - "POST /_clock/advance to 2026-05-15T00:00:00Z"
          trigger:
            - "POST /applications/{app_id}/sep-events/{id}/verify"
          assert:
            - "Link A: SEPEvent.status == 'VERIFIED' and effective_date == '2026-05-12'"
            - "Link B: Application transitioned APPROVED→ELIGIBILITY_DETERMINED (cascade redetermine fired)"
            - "Link C: Enrollment.monthly_premium_gross_cents > 47240 (now includes infant per AGE_CURVE_MULTIPLIERS['0-14']=0.765 → round_half_up(40000*0.765)=30600 added)"
            - "Link D: A new PremiumInvoice exists with billing_month >= '2026-06' and gross_amount_cents matching the new Enrollment.monthly_premium_gross_cents"

      - name: enrollment_cancel_depth2_cascade_void_future_invoices
        grounds:
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
          - state_machines.PremiumInvoice.ISSUED_to_VOIDED
          - entities.PremiumInvoice.fields.status
        distinguishing_aspect: |
          Depth-2 cascade triggered by Applicant /cancel on an Enrollment. Chain: A) Enrollment ACTIVE→TERMINATED
          via POST /enrollments/{id}/cancel → B) every PremiumInvoice with billing_month > coverage_end_date
          transitions ISSUED→VOIDED. Originates from Enrollment /cancel (different trigger from instance 1's
          SEPEvent /verify).
        test_recipe:
          setup:
            - "Enrollment ACTIVE on 2026-04-01 with PremiumInvoices for billing_month 2026-04 (PAID), 2026-05 (ISSUED), 2026-06 (ISSUED)"
            - "POST /_clock/advance to 2026-04-20T00:00:00Z"
          trigger:
            - "POST /enrollments/{id}/cancel"
          assert:
            - "Link A: Enrollment.coverage_status == 'TERMINATED', terminated_reason == 'APPLICANT_CANCELLED', coverage_end_date == '2026-04-30'"
            - "Link B: PremiumInvoice for billing_month=2026-05 has status=='VOIDED'"
            - "Link B: PremiumInvoice for billing_month=2026-06 has status=='VOIDED'"
            - "PremiumInvoice for billing_month=2026-04 retains status=='PAID' (only invoices with billing_month > coverage_end_date are voided)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_csr_mismatch_on_approved_app
        grounds:
          - validations[priority=5]                         # ERR_INVALID_STATE
          - validations[priority=10]                        # ERR_CSR_VARIANT_MISMATCH
          - errors.ERR_INVALID_STATE
          - errors.ERR_CSR_VARIANT_MISMATCH
        distinguishing_aspect: |
          Dual-failure scenario: Application is NOT yet APPROVED (still ELIGIBILITY_DETERMINED) AND the chosen
          PlanVariant.csr_level does not match Application.csr_eligibility. Two errors both apply; priority
          ordering says ERR_INVALID_STATE (priority 5, category=state) wins over ERR_CSR_VARIANT_MISMATCH
          (priority 10, category=business_referential). Error-category pair: state vs business_referential.
        test_recipe:
          setup:
            - "Application in ELIGIBILITY_DETERMINED (NOT APPROVED yet) with csr_eligibility=CSR_94"
            - "PlanVariant with csr_level=CSR_73 (mismatch)"
          trigger:
            - "POST /enrollments {application_id, plan_variant_id}"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_STATE' (not ERR_CSR_VARIANT_MISMATCH)"

      - name: business_temporal_vs_business_fiscal_outside_sep_and_negative_magi
        grounds:
          - validations[priority=11]                        # ERR_OUTSIDE_SEP_WINDOW (business_temporal)
          - validations[priority=12]                        # ERR_MAGI_NEGATIVE (business_fiscal)
          - errors.ERR_OUTSIDE_SEP_WINDOW
          - errors.ERR_MAGI_NEGATIVE
        distinguishing_aspect: |
          Dual-failure on POST /applications/{id}/redetermine: a corrective IncomeRecord pushes the household
          MAGI below 0 AND the current /_clock.now() is outside any active SEP window. Two errors apply;
          priority ordering states ERR_OUTSIDE_SEP_WINDOW (priority 11, category=business_temporal) wins over
          ERR_MAGI_NEGATIVE (priority 12, category=business_fiscal). Error-category pair: business_temporal vs
          business_fiscal — distinct from instance 1's state vs business_referential pair.
        test_recipe:
          setup:
            - "Application APPROVED, all SEPs EXPIRED, /_clock.now()=2026-04-05 (outside OEP 2026-01-01..2026-01-15 hypothetical)"
            - "Pending IncomeRecord append that would make total_magi_cents negative"
          trigger:
            - "POST /applications/{id}/redetermine"
          assert:
            - "Response status == 409 (the higher-priority temporal check)"
            - "Response error_id == 'ERR_OUTSIDE_SEP_WINDOW' (priority 11 wins over priority 12 ERR_MAGI_NEGATIVE)"

      - name: existence_vs_state_owner_check_on_missing_application
        grounds:
          - validations[priority=3]                         # ERR_NOT_FOUND (existence)
          - validations[priority=5]                         # ERR_INVALID_STATE (state)
          - errors.ERR_NOT_FOUND
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Dual-failure scenario: client calls /approve on an Application id that does not exist. Two error
          categories could apply if the client also has wrong state assumption, but existence (priority 3)
          beats state (priority 5). Pair: existence vs state — distinct from instances 1 and 2.
        test_recipe:
          setup:
            - "No Application with id='00000000-0000-0000-0000-000000000000' exists"
          trigger:
            - "POST /applications/00000000-0000-0000-0000-000000000000/approve"
          assert:
            - "Response status == 404"
            - "Response error_id == 'ERR_NOT_FOUND' (not ERR_INVALID_STATE)"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fpl_138_inclusive_lower_boundary_csr_94_vs_csr_plus
        grounds:
          - calculations.csr_tier_classification
          - entities.Application.fields.csr_eligibility
          - endpoints.POST_/applications/{id}/determine-eligibility
        distinguishing_aspect: |
          Boundary at fpl_percentage == 138.0 exactly: inclusive at lower → CSR_94. fpl_percentage == 137.9
          (one decimal place below) → CSR_PLUS. Numeric threshold on a derived percentage metric, exercised
          through determine-eligibility endpoint.
        test_recipe:
          setup:
            - "Application(filing_state=CA, coverage_year=2026, household_size=2, pinned_fpl_table_version=v2 → FPL_denom=2_131_000)"
            - "IncomeRecord rows summing to total_magi_cents = 2_940_780 (gives fpl_percentage = 138.0 exactly: 2940780/2131000*100 = 138.0)"
          trigger:
            - "POST /applications/{id}/submit; POST /applications/{id}/determine-eligibility"
          assert:
            - "Application.fpl_percentage == 138.0"
            - "Application.csr_eligibility == 'CSR_94' (inclusive at lower bound 138.0)"
            - "A parallel test with total_magi_cents = 2_938_649 (giving fpl_percentage = 137.9) produces csr_eligibility == 'CSR_PLUS'"

      - name: enrollment_payment_insufficient_zero_short_boundary
        grounds:
          - validations[priority=15]                        # ERR_PAYMENT_INSUFFICIENT
          - errors.ERR_PAYMENT_INSUFFICIENT
          - endpoints.POST_/premium-invoices/{id}/post-payment
          - entities.PremiumInvoice.fields.net_amount_cents
        distinguishing_aspect: |
          Empty/zero-cent boundary on a different metric (currency amount) and a different endpoint
          (/premium-invoices/{id}/post-payment). amount_cents == net_amount_cents → accepted; amount_cents ==
          net_amount_cents - 1 → ERR_PAYMENT_INSUFFICIENT. Distinct from instance 1's percentage-threshold
          boundary on determine-eligibility.
        test_recipe:
          setup:
            - "PremiumInvoice ISSUED with net_amount_cents = 20000"
          trigger:
            - "POST /premium-invoices/{id}/post-payment {amount_cents: 19999}"
            - "POST /premium-invoices/{id}/post-payment {amount_cents: 20000} (on a fresh ISSUED invoice)"
          assert:
            - "First call: status 422, error_id == 'ERR_PAYMENT_INSUFFICIENT' (one cent short)"
            - "Second call: status 200, invoice.status == 'PAID' (exact-match boundary inclusive)"

      - name: sep_window_60_day_exact_boundary
        grounds:
          - validations[priority=17]                        # ERR_SEP_WINDOW_EXPIRED
          - errors.ERR_SEP_WINDOW_EXPIRED
          - state_machines.SEPEvent.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Day-count boundary on a third metric (calendar-day delta) and a third endpoint (/sep-events/{id}/verify):
          event_date exactly 60 days before /_clock.now() → VERIFIED accepted; event_date exactly 61 days
          before → ERR_SEP_WINDOW_EXPIRED. Distinct from instances 1 (percentage) and 2 (currency).
        test_recipe:
          setup:
            - "SEPEvent created with event_date='2026-01-01', currently SUBMITTED"
            - "POST /_clock/advance to 2026-03-02T00:00:00Z (exactly 60 days after 2026-01-01)"
          trigger:
            - "POST /applications/{app_id}/sep-events/{id}/verify"
          assert:
            - "Status 200, SEPEvent.status == 'VERIFIED' (boundary inclusive at 60 days)"
            - "Parallel: a second SEPEvent with event_date='2025-12-31' on the same /_clock.now()=2026-03-02 (61 days) → status 422, error_id == 'ERR_SEP_WINDOW_EXPIRED'"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_creation_requires_application_approved
        grounds:
          - validations[priority=5]                         # state precondition
          - endpoints.POST_/enrollments
          - entities.Application.fields.status
          - entities.Enrollment.fields.application_id
        distinguishing_aspect: |
          Enrollment.PENDING_PAYMENT initial state can only be entered if parent Application.status==APPROVED.
          The valid transitions on Enrollment depend on the state of a different entity (Application). Entity
          pair: Enrollment → Application.
        test_recipe:
          setup:
            - "Application in ELIGIBILITY_DETERMINED (not yet APPROVED)"
            - "PlanVariant whose csr_level matches Application.csr_eligibility"
          trigger:
            - "POST /enrollments {application_id, plan_variant_id}"
          assert:
            - "Status 409, error_id == 'ERR_INVALID_STATE'"
            - "After POST /applications/{id}/approve, the same /enrollments call succeeds with status 201"

      - name: application_approve_requires_open_enrollment_window_from_sep_event
        grounds:
          - validations[priority=8]                         # ERR_OUTSIDE_ENROLLMENT_WINDOW
          - state_machines.Application.ELIGIBILITY_DETERMINED_to_APPROVED
          - state_machines.SEPEvent.SUBMITTED_to_VERIFIED
          - entities.Application.fields.enrollment_window
        distinguishing_aspect: |
          Application's valid transition ELIGIBILITY_DETERMINED→APPROVED depends on SEPEvent state (whether any
          VERIFIED SEP currently governs the Application). Entity pair: Application → SEPEvent — distinct from
          instance 1's Enrollment → Application pair.
        test_recipe:
          setup:
            - "Clock at 2026-04-05 (outside hypothetical OEP 2026-01-01..2026-01-15)"
            - "Application ELIGIBILITY_DETERMINED, enrollment_window=CLOSED (no VERIFIED SEPs)"
          trigger:
            - "POST /applications/{id}/approve"
          assert:
            - "Status 409, error_id == 'ERR_OUTSIDE_ENROLLMENT_WINDOW'"
            - "Then: POST /sep-events {event_type:MOVE, event_date:'2026-03-15'}; POST /sep-events/{id}/verify → Application.enrollment_window flips to SEP → POST /approve now succeeds with status 200"

      - name: premium_invoice_void_requires_enrollment_terminated_or_recalced
        grounds:
          - state_machines.PremiumInvoice.ISSUED_to_VOIDED
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
          - entities.Enrollment.fields.coverage_status
          - entities.PremiumInvoice.fields.status
        distinguishing_aspect: |
          PremiumInvoice's ISSUED→VOIDED transition is only valid when parent Enrollment has just been
          CANCELLED or recalculated. Entity pair: PremiumInvoice → Enrollment — distinct from instances 1 and 2.
        test_recipe:
          setup:
            - "Enrollment ACTIVE with PremiumInvoice ISSUED for next month"
          trigger:
            - "POST /enrollments/{id}/cancel"
          assert:
            - "PremiumInvoice for billing_month > coverage_end_date: status == 'VOIDED'"
            - "A bare attempt to VOID a PremiumInvoice with no Enrollment cancel/recalc is not exposed via any endpoint (system-only transition; only reachable via the cross-entity cascade)"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_one_per_application_per_coverage_year_uniqueness
        grounds:
          - validations[priority=14]                        # ERR_ENROLLMENT_ALREADY_EXISTS
          - errors.ERR_ENROLLMENT_ALREADY_EXISTS
          - concurrency_rules[two_enrollments_same_application_coverage_year]
          - entities.Enrollment.fields.application_id
          - entities.Enrollment.fields.coverage_start_date
        distinguishing_aspect: |
          Interval semantics A (uniqueness/exact-match): Two Enrollments on the same Application cannot share
          the same coverage_year — any pair of Enrollments whose [coverage_start_date, coverage_end_date or
          12/31 of coverage_year] intervals fall in the same coverage_year collide. The interval geometry is
          EXACT EQUALITY on the year bucket. Resource: Enrollment.
        test_recipe:
          setup:
            - "Application APPROVED with first Enrollment ACTIVE for coverage_year=2026, coverage_start_date=2026-01-01"
          trigger:
            - "POST /enrollments {application_id (same), plan_variant_id (any valid)}"
          assert:
            - "Status 409, error_id == 'ERR_ENROLLMENT_ALREADY_EXISTS'"
            - "Only one Enrollment row exists for the (application_id, coverage_year) pair"

      - name: sep_window_overlap_with_60_day_open_half_open_interval
        grounds:
          - entities.SEPEvent.fields.window_opens_on
          - entities.SEPEvent.fields.window_closes_on
          - calculations.sep_effective_date
          - validations[priority=11]                        # ERR_OUTSIDE_SEP_WINDOW
        distinguishing_aspect: |
          Interval semantics B (half-open windows on a different resource): SEPEvent's window is
          [window_opens_on, window_closes_on + 1 day) — inclusive at open, exclusive on the day AFTER
          window_closes_on. A second SEPEvent VERIFIED on the same Application can OVERLAP without rejection
          (multiple verified SEPs coexist; only the earliest-by-reported_at governs Enrollment effective_date).
          Resource: SEPEvent — different entity from Enrollment in instance 1, and different interval geometry
          (half-open day range, not exact-year-bucket).
        test_recipe:
          setup:
            - "Application with two SEPEvent rows: A(event_type=MARRIAGE, event_date=2026-03-01, reported_at=2026-03-02), B(event_type=MOVE, event_date=2026-04-01, reported_at=2026-04-02)"
            - "Both verified"
          trigger:
            - "POST /enrollments using application_id; coverage_start_date defaults to A.effective_date because A.reported_at is earlier (tie-break ascending)"
          assert:
            - "Both SEPEvents remain VERIFIED simultaneously (no overlap-rejection)"
            - "Enrollment.coverage_start_date == SEPEvent_A.effective_date == '2026-03-01' (earliest VERIFIED's effective_date governs)"
            - "An Enrollment with coverage_start_date < '2026-03-01' is rejected with ERR_OUTSIDE_SEP_WINDOW (window_opens_on inclusive)"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_payment_and_void_total_paid_cents_invariant
        grounds:
          - state_machines.PremiumInvoice.ISSUED_to_PAID
          - state_machines.PremiumInvoice.ISSUED_to_VOIDED
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
          - entities.PremiumInvoice.fields.status
          - entities.PremiumInvoice.fields.net_amount_cents
        distinguishing_aspect: |
          Conserved quantity = sum_of_net_amount_cents_over_PAID_invoices on an Enrollment.
          Forward action: POST /premium-invoices/{id}/post-payment moves an invoice ISSUED→PAID, adding
          net_amount_cents to the conserved sum. Compensating action: POST /enrollments/{id}/cancel followed
          by replaying does NOT void already-PAID invoices (the cancel cascade only voids ISSUED future
          invoices). Therefore the sum_of_paid_cents BEFORE cancel must equal the sum AFTER cancel.
          Invariant: sum_of(PremiumInvoice.net_amount_cents WHERE status=PAID AND enrollment_id=E.id) ==
          unchanged across the cancel.
        test_recipe:
          setup:
            - "Enrollment ACTIVE with three PremiumInvoices: April PAID (net 20000), May PAID (net 20000), June ISSUED (net 20000)"
            - "Pre-cancel total_paid_cents = 40000"
          trigger:
            - "POST /enrollments/{id}/cancel"
          assert:
            - "Post-cancel: April status=='PAID', May status=='PAID', June status=='VOIDED'"
            - "Post-cancel total_paid_cents (sum of PAID net_amount_cents) == 40000 (UNCHANGED from pre-cancel)"
            - "PremiumInvoice.status counts: PAID=2, VOIDED=1, ISSUED=0 (no PAID→VOIDED transitions)"

      - name: application_amend_resubmit_household_size_invariant
        grounds:
          - state_machines.Application.SUBMITTED_to_DRAFT
          - state_machines.Application.DRAFT_to_SUBMITTED
          - entities.Application.fields.household_size
          - entities.Application.fields.total_magi_cents
        distinguishing_aspect: |
          Conserved quantity = (HouseholdMember row count where include_in_household=true) — must remain
          identical across an amend + resubmit when the applicant did not touch HouseholdMember between the
          two transitions. Forward action: POST /applications/{id}/amend clears computed fields
          (pinned_fpl_table_version, fpl_percentage, total_magi_cents). Compensating action: POST /submit
          recomputes them. Invariant: the COUNT of include_in_household HouseholdMember rows is unchanged,
          and Application.household_size after the second submit equals household_size before the first amend.
          Different conserved quantity (entity row count) from instance 1's currency-sum invariant.
        test_recipe:
          setup:
            - "Application SUBMITTED with 3 HouseholdMember rows (2 with include_in_household=true)"
            - "Pre-amend Application.household_size == 2"
          trigger:
            - "POST /applications/{id}/amend"
            - "POST /applications/{id}/submit (no HouseholdMember mutations between)"
          assert:
            - "After amend Application.household_size is NULL or unchanged at 2 (per scaffold prose, household_size derives from members and remains 2 since no member was removed)"
            - "After second submit Application.household_size == 2 (UNCHANGED conserved quantity)"
            - "HouseholdMember row count where include_in_household=true is still 2"
