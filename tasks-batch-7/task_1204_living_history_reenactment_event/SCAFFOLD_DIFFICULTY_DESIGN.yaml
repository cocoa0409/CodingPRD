- rule_id: transitive_cascade
  instances:
  - name: unit_suspend_depth3_cascade
    grounds:
    - state_machines.Unit.APPROVED_to_SUSPENDED
    - state_machines.Participant
    - state_machines.EquipmentItem
    - state_machines.Inspection
    distinguishing_aspect: 'Depth-3 chain triggered by unit suspension: Unit -> SUSPENDED causes

      Participant -> WITHDRAWN (hop 1), which causes EquipmentItem ->

      WITHDRAWN (hop 2), which causes Inspection -> CANCELLED (hop 3); each

      hop is caused by the previous mutation, not by the original call.

      '
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; unit APPROVED
      - Participant VETTED; one FIREARM equipment item INSPECTION_DUE with a SCHEDULED inspection
