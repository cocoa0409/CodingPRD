          - state_machines.PledgeAgreement.PENDING_SIGNATURES_to_EXECUTED
          - endpoints.POST_/pledge-allocations
        distinguishing_aspect: |
          Creating a PledgeAllocation is gated on the state of a DIFFERENT entity (the PledgeAgreement),
          and the gate is not simply "not DRAFT": the same payload is rejected in DRAFT and again in
          PENDING_SIGNATURES with two of three stamps, then accepted the instant the third stamp makes the
          agreement EXECUTED. Because the OCC version bumps on every stamp, each attempt must re-read it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "APPROVED custodian, APPROVED well-capitalized depository, FUNDED DEDICATED DEMAND account with 100,000,000 cents (required 78,750,000)."
