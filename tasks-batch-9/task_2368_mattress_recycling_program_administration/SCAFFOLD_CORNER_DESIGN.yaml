          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header, and one with an unrecognised role value, both return 401 ERR_UNAUTHENTICATED — priority 10 runs before the priority-20 role membership check and before existence."
        test_recipe:
