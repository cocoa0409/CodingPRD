            - "GET /foundry/products (as FoundryManager) still returns total_count == 0"
      - name: wholesale_below_brand_floor_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=26]", "errors[ERR_PRICE_BELOW_BRAND_FLOOR]"]
        distinguishing_aspect: "Brand premium over imports: import_landed_cost 2000 pins the wholesale floor at round_half_up(2000 * 1.15) == 2300. A product at 2300 is accepted (equality allowed); its sibling at 2299 is rejected ERR_PRICE_BELOW_BRAND_FLOOR."
        test_recipe:
          setup: ["product A created at the exact floor wholesale_price_cents 2300 (201)"]
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2300, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /foundry/products"
              payload: { sku_code: "L9SK3", name: "Skillet 12in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2299, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { err: $.data.error_id }
          assert:
            - "Product.${p_id} exists (2300 == floor is allowed)"
            - "${err} == ERR_PRICE_BELOW_BRAND_FLOOR (HTTP 422) for 2299"
      - name: outlet_sale_below_floor_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=27]", "errors[ERR_OUTLET_PRICE_BELOW_FLOOR]"]
        distinguishing_aspect: "FACTORY_OUTLET floor is round_half_up(msrp 4000 * 0.55) == 2200: a sale at 2199 fails ERR_OUTLET_PRICE_BELOW_FLOOR, while 2200 passes the floor and instead fails the later fiscal check ERR_INSUFFICIENT_INVENTORY (empty stock) — proving the floor is inclusive and its priority (27 before 28)."
        test_recipe:
          setup: ["product P (msrp_cents 4000) exists with empty inventory"]
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
