  # ==========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sanitation_failure_four_link_cascade
        grounds:
          - state_machines.SanitationCycle.IN_PROGRESS_to_FAILED
          - state_machines.WaterLoop
          - state_machines.Rack
          - "state_machines.GrowBatch (safety_status)"
          - entities.Shipment.fields.has_safety_block
        distinguishing_aspect: |
          Depth-4 chain from a single trigger (record-result FAILED): SanitationCycle FAILED
          mutates WaterLoop.posture (link 1); the loop's hold cascades to Rack SANITATION_HOLD
          (link 2); the rack hold quarantines the PACKED GrowBatch's safety dimension (link 3);
          the quarantine flags the dependent Shipment.has_safety_block (link 4) — each link
          caused by the previous one, not by the original API call.
