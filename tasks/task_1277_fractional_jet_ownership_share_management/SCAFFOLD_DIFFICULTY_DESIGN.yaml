              payload: { program_id: "${prog_id}", class_code: "LIGHT", hourly_rate_cents: 300000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 1500000, seats: 6 }
              as: ProgramAdmin
              captures: { cls_l: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "PP1 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_l}", fraction_numerator: 1, fraction_denominator: 16, purchase_price_cents: 1200000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_l}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 60.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state check fires before priority 10 fiscal check)"
            - "HTTP status 409, not 422 (the fiscal error's status)"
            - "Share.${share_id}.hours_remaining_cy == 50.00 (no debit attempted)"

      - name: exit_value_temporal_vs_referential_priority
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_TEMPORAL_INVALID]
          - errors[ERR_REFERENTIAL_CONFLICT]
        distinguishing_aspect: |
          Category pair business_temporal(7) vs business_referential(9): a
          maintenance create with window_end <= window_start AND an aircraft_id
          that is valid, exercised against POST /maintenance-events, must return
          ERR_TEMPORAL_INVALID (7) — versus a second scenario where a transfer
          listing create on a share already covered by a live listing returns
          ERR_REFERENTIAL_CONFLICT (9). The pair is exercised on two different
          endpoints to pin the ordering of both categories.
        test_recipe:
          setup:
            - "Program ACTIVE; one MID tail; owner with ACTIVE 1/8 MID share already covered by a LISTED TransferListing"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-PP2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N400PP", class_id: "${cls_mid}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "PP2 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /transfer-listings"
              payload: { share_id: "${share_id}", asking_price_cents: 10000000, program_repurchase_flag: false, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
            - call: "GET /shares/${share_id}"
              payload: {}
              as: ProgramAdmin
              captures: { share_v2: $.data.version }
          trigger:
            - call: "POST /maintenance-events"
              payload: { aircraft_id: "${tail_id}", window_start_utc: "2026-09-10T10:00:00Z", window_end_utc: "2026-09-10T09:00:00Z", cost_cents: 1000, unscheduled_flag: false }
              as: FleetOps
              captures: { err1: $.data.error_id }
            - call: "POST /transfer-listings"
              payload: { share_id: "${share_id}", asking_price_cents: 11000000, program_repurchase_flag: false, expected_share_version: "${share_v2}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "First trigger error_id == ERR_TEMPORAL_INVALID (priority 7, window_end <= window_start)"
            - "Second trigger error_id == ERR_REFERENTIAL_CONFLICT (priority 9, live listing already covers share)"
            - "Statuses 422 and 409 respectively — the two categories carry different HTTP codes"

  # ==========================================================================
  # Rule 6 — boundary_precision_check: different metrics, different endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: entitlement_exact_equality_confirm_allowed
        grounds:
          - validations[priority=10]
          - calculations.annual_entitlement_hours
          - endpoints: "POST /bookings/{id}/confirm"
        distinguishing_aspect: |
          Numeric threshold boundary on HOURS: hours_remaining_cy >= estimated
          uses >=, so a booking of exactly 50.00h against a 1/16 share (50.00h
          entitlement) CONFIRMS and leaves hours_remaining_cy == 0.00; a second
          booking of 0.01h is then rejected with ERR_ENTITLEMENT_EXHAUSTED.
        test_recipe:
          setup:
            - "Owner with ACTIVE 1/16 LIGHT share (50.00h); booking A estimated exactly 50.00h"
