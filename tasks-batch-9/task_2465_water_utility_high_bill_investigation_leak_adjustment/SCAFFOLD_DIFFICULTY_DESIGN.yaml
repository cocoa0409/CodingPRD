            - "HighBillInvestigation.${inv_id}.status == EVIDENCE_UNDER_REVIEW after the PASS"
            - "Bill.${bill_p4_id}.consumption_gallons == 41000 and billing_status == UNDER_INVESTIGATION — a PASS corrects nothing"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      # -------- conserved quantity: the account receivable in cents --------
      - name: compensating_invariant_receivable_balance_restored_after_adjustment_reversal
        grounds:
          - endpoints[POST /leak-adjustments/{id}/reverse]
          - state_machines.LeakAdjustment
          - state_machines.Bill
          - calculations.account_balance
          - entities.AccountLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          CONSERVED QUANTITY: ServiceAccount.balance_cents, the money the customer owes. Approving
          the adjustment writes -26963 and moves the balance from 60569 to 33606; reversing it
          writes a single compensating +26963 and returns the balance to exactly 60569 — the
          pre-approval value to the cent, with no drift and with the credit and admin-fee legs
          collapsed into one reversal row. The ledger is append-only, so conservation is proved by
          three surviving rows summing back to the original figure, not by anything being deleted,
          and the Bill and the investigation both walk back to their pre-approval states.
        test_recipe:
          setup:
            - "The full ACC-1001 fixture is in place with four ISSUED bills; balance_cents is 60569 and the 2026-07 bill is 44939 with adjusted_total_cents 44939."
            - "An investigation determined by csr-1 carries a VERIFIED SERVICE_LINE proof; a SERVICE_LINE adjustment of net_credit_cents 26963 (capped_credit_cents 26963, admin_fee_charged_cents 0) has been drafted and submitted."
            - "sup-1 approves and later reverses, which is permitted because sup-1 is not the determining user."
