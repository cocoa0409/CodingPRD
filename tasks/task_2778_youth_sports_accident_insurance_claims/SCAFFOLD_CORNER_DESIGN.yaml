          - errors.ERR_INJURY_REPORT_NOT_FOUND
          - errors.ERR_PROVIDER_BILL_NOT_FOUND
        distinguishing_aspect: "Seven distinct 404 codes are demanded from seven distinct routes, and the last two probes show that a referenced foreign key is checked with the SAME per-entity code as an addressed path id (priority 6 reuses the priority 5 catalog). A server with one generic ERR_NOT_FOUND, or one that reports the addressed entity's code when a referenced parent is missing, fails."
