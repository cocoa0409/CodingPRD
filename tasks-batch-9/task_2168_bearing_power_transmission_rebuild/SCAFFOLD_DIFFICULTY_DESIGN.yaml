              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "END_PLAY", measured_um: 160 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /shop/rebuild-orders/${order_id}"
              as: Planner
          trigger:
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "ACCEPT" }
              as: Inspector
              as_user_id: "insp-2"
            - call: "GET /shop/rebuild-orders/${order_id}"
              as: Planner
            - call: "GET /shop/credit-notes"
              payload: { customer_id: "${cust_id}", status: "POSTED" }
              as: ShopAdmin
          assert:
            - "before the trigger RebuildOrder.${order_id}.core_credit_applied_cents == 10800 and quote_total_cents == 160450"
            - "hop 1: Inspection.${insp_id}.status == ACCEPTED and accepted_by_user_id == insp-2"
            - "hop 2: CoreUnit.${core_id}.status == GRADED and condition_grade == GRADE_A and final_core_credit_cents == 81450"
            - "hop 3: GET /shop/credit-notes?customer_id=${cust_id}&status=POSTED returns total_count == 1 with amount_cents == 81450"
            - "hop 4: Customer.${cust_id}.total_credit_balance_cents == 81450"
            - "hop 5: RebuildOrder.${order_id}.core_credit_applied_cents == 68500 and quote_total_cents == 102750"
            - "RebuildOrder.${order_id}.parts_subtotal_cents == 77000 and labor_cents == 94250 (untouched by hop 5)"
            - "RebuildOrder.${order_id}.covered_base_cents == 171250 (untouched by hop 5)"

      - name: order_cancel_releases_bench_and_promotes_queued_reservation
        grounds:
          - state_machines.RebuildOrder.DRAFT_to_CANCELLED
          - state_machines.BenchReservation.HELD_to_RELEASED
          - calculations.bench_committed_minutes
          - calculations.bench_queue_promotion
          - entities.BenchReservation.fields.promoted_at
        distinguishing_aspect: |
          A depth-4 chain from a different trigger than the ACCEPT cascade:
          cancelling order A releases its reservation, the release forces a
          recompute of Bench.committed_minutes to 0, that recompute triggers the
          queue promotion which lifts order B's QUEUED row to HELD, and the
          promotion forces a second recompute back to 240.
        test_recipe:
          setup:
            - "A single-slot bench B-1 with order A holding [08:00, 12:00) on 2026-09-01 and order B queued for [10:00, 14:00) the same day via queue_if_full."
            - "Bench.committed_minutes is 240 because only order A's row is HELD."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Northgate Mill", account_code: "NGM-008" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "CONV-04-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/benches"
              payload: { bench_code: "B-1", parallel_slots: 1, cleanroom: false }
              as: ShopAdmin
              captures: { bench_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-A-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_a: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-B-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_b: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_a}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_a: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_b}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_b: $.data.id }
            - call: "POST /shop/bench-reservations"
              payload: { rebuild_order_id: "${order_a}", bench_id: "${bench_id}", window_start_at: "2026-09-01T08:00:00Z", window_end_at: "2026-09-01T12:00:00Z" }
              as: Planner
              captures: { res_a: $.data.id }
            - call: "POST /shop/bench-reservations"
              payload: { rebuild_order_id: "${order_b}", bench_id: "${bench_id}", window_start_at: "2026-09-01T10:00:00Z", window_end_at: "2026-09-01T14:00:00Z", queue_if_full: true }
              as: Planner
              captures: { res_b: $.data.id }
            - call: "GET /shop/benches/${bench_id}"
              as: Planner
          trigger:
            - call: "POST /shop/rebuild-orders/${order_a}/cancel"
              payload: { cancel_reason: "customer deferred the outage" }
              as: Planner
            - call: "GET /shop/benches/${bench_id}"
              as: Planner
            - call: "GET /shop/benches/${bench_id}/reservations"
              as: Planner
          assert:
            - "before the trigger BenchReservation.${res_a}.status == HELD, BenchReservation.${res_b}.status == QUEUED and Bench.${bench_id}.committed_minutes == 240"
            - "hop 1: RebuildOrder.${order_a}.work_status == CANCELLED and BenchReservation.${res_a}.status == RELEASED"
            - "hop 3: BenchReservation.${res_b}.status == HELD and BenchReservation.${res_b}.promoted_at is not null"
            - "hop 4: Bench.${bench_id}.committed_minutes == 240"
            - "BenchReservation.${res_a}.window_minutes == 240 and BenchReservation.${res_b}.window_minutes == 240"
            - "RebuildOrder.${order_b}.work_status == DRAFT (the promotion does not touch order B's work dimension)"

