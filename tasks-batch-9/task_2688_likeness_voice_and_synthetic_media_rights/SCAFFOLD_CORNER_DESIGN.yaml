            - call: "POST /usage-licenses"
              payload: { generated_performance_id: "${p3_id}", channel: "ADVERTISING", territory_codes: ["US"], distribution_start: "2026-08-01T00:00:00Z", distribution_end: "2026-12-01T00:00:00Z", actual_impressions: 500000, expected_replica_version: "${r_v2}" }
