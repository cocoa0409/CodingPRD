          assert:
            - "publishing the empty session → HTTP 409 ERR_EMPTY_SESSION"
            - "slot for A2 → HTTP 422 ERR_SESSION_THEME_MISMATCH (oncology is not in [immunotherapy])"
            - "slot for A3 → HTTP 422 ERR_SESSION_FORMAT_MISMATCH (POSTER decision, ORAL session)"
            - "slot for A1 with Cara → HTTP 422 ERR_PRESENTER_NOT_ON_ABSTRACT"
            - "slot for A1 with Ada at position 1 → HTTP 201; Session.slot_count == 1 and Abstract.${ab1_id}.status == SCHEDULED"
            - "slot for A4 at position 1 → HTTP 422 ERR_DUPLICATE_SLOT_POSITION (slot_count 1 < capacity 2, so this is not a capacity failure)"
            - "slot for A4 at position 2 → HTTP 201; Session.slot_count == 2 and committed_minutes == 60"
            - "slot for A5 at position 3 → HTTP 422 ERR_SESSION_SLOT_CAPACITY_REACHED"
            - "publishing → HTTP 200 with status PUBLISHED (accreditation_posture NOT_APPLICABLE)"
            - "slot for A5 on the PUBLISHED session → HTTP 409 ERR_SESSION_STATE_INVALID"
            - "PRESENTED before start_utc → HTTP 409 ERR_SLOT_STATE_INVALID"
            - "Cho's resignation → HTTP 409 ERR_MEMBER_STILL_CHAIRING; CommitteeMember.${mb_chair_id}.status stays ACTIVE"
            - "the first change request → HTTP 201 with status PENDING; the second for the same slot → HTTP 409 ERR_CHANGE_REQUEST_STATE_INVALID"
            - "CANCELLED at 2026-08-20T00:00:00Z → HTTP 409 ERR_PROGRAM_FROZEN; Session.${ses_id}.status stays PUBLISHED"
            - "both NO_SHOW_RECORDED calls → HTTP 200; Author.${au_ada_id}.no_show_strikes == 2 and sanction_status == BARRED"
            - "Ada confirming A6 → HTTP 403 ERR_AUTHOR_BARRED; Abstract.${ab6_id}.status stays ACCEPTED"

      - name: accreditation_disclosure_and_press_guards_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CATEGORY_NOT_CME_ELIGIBLE
          - errors.ERR_ACCREDITATION_STATE_INVALID
          - errors.ERR_DISCLOSURE_ABSTRACT_MISMATCH
          - errors.ERR_DISCLOSURE_STATE_INVALID
          - errors.ERR_DISCLOSURE_INCOMPLETE
          - errors.ERR_ACCREDITATION_SELF_VALIDATION
          - errors.ERR_CME_POOL_EXHAUSTED
          - errors.ERR_SESSION_NOT_ACCREDITED
          - errors.ERR_NOT_NEWSWORTHY
          - errors.ERR_EMBARGO_NOT_SET
          - errors.ERR_EMBARGO_WINDOW_INVALID
        distinguishing_aspect: |
          The accreditation lane needs two distinct chairs to be testable at all:
          Cho records the decision and is therefore permanently barred from
          validating that abstract's accreditation, so Dana is the only caller who
          can reach the gates behind p11. Running the same accreditation past its
          gates in ascending priority order shows each guard in isolation —
          ERR_DISCLOSURE_INCOMPLETE (p13) while the disclosure is merely SUBMITTED,
          then ERR_ACCREDITATION_SELF_VALIDATION (p11) which outranks the exhausted
          pool, then ERR_CME_POOL_EXHAUSTED (p21) once every earlier gate passes.
          The pool is deliberately sized at 60 minutes against 90 requested minutes
          so no accreditation ever validates, which is exactly what keeps the
          cme_designated session's posture NON_COMPLIANT and makes
          ERR_SESSION_NOT_ACCREDITED reachable in the same fixture.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z. Conference GOS26 with capacities 2 / 2 / 1, cme_minutes_pool_total 60, freeze 2026-08-15T00:00:00Z, event 2026-09-01T08:00:00Z .. 2026-09-03T18:00:00Z."
            - "Two categories: CME (cme_eligible true, allowed_formats [ORAL], min_reviews_required 2) and GEN (cme_eligible false, allowed_formats [ORAL], min_reviews_required 2)."
            - "Two chairs: Cho (records both decisions) and Dana (validates); two reviewers Rui and Mei; author Ada, registered."
            - "A1: category CME, keywords [oncology], is_newsworthy true. A2: category GEN, keywords [oncology], is_newsworthy false. Both scored 4/4/4/4 twice, decided ORAL by Cho, then CONFIRMED by Ada."
            - "Session S2: chair Cho, theme oncology, format ORAL, room R1, 2026-09-01T09:00:00Z .. 2026-09-01T11:00:00Z, capacity_slots 2, cme_designated true; one slot holds A1 (presenter Ada, 30 minutes), so A1 is SCHEDULED and the session's accredited_credit_total is 0.00 with posture NON_COMPLIANT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 2, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 60 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "CME", name: "Accredited Oncology", max_word_count: 300, allowed_formats: ["ORAL"], min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: true }
              as: ConferenceAdmin
              captures: { cat_cme_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL"], min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: false }
              as: ConferenceAdmin
              captures: { cat_gen_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_cho_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_cho_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_cho_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Dana Whitfield", email: "dana@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_dana_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_dana_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_dana_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Mei Osei", email: "mei@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r2_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r2_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r2_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_cme_id}", submitting_author_id: "${au_ada_id}", title: "A1 accredited talk", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology"], is_newsworthy: true }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_gen_id}", submitting_author_id: "${au_ada_id}", title: "A2 general talk", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology"], is_newsworthy: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab2_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts/{abstractId}/review-assignments"
              payload: { reviewer_member_id: "<mb_r1_id then mb_r2_id>" }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
              note: "repeated four times: Rui and Mei are each assigned once on A1 and once on A2"
            - call: "POST /reviews/{reviewId}/submission"
              payload: { score_originality: 4, score_methodology: 4, score_relevance: 4, score_clarity: 4, confidence: "HIGH", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "<the review's own reviewer_member_id>"
              note: "repeated once for each of the four ASSIGNED reviews; both abstracts reach SCORED with score_spread 0.00, so no DiscrepancyCase opens; Dana submits no review and therefore stays eligible to validate"
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_CLOSED" }
              as: ConferenceAdmin
            - call: "GET /conferences/${conf_id}"
              as: ConferenceAdmin
              captures: { conf_va: "$.data.version" }
            - call: "POST /abstracts/${ab1_id}/decision"
              payload: { decision: "ORAL", expected_conference_version: "${conf_va}" }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
            - call: "GET /conferences/${conf_id}"
              as: ConferenceAdmin
              captures: { conf_vb: "$.data.version" }
            - call: "POST /abstracts/${ab2_id}/decision"
              payload: { decision: "ORAL", expected_conference_version: "${conf_vb}" }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "DECISIONS_RELEASED" }
              as: ConferenceAdmin
            - call: "POST /authors/${au_ada_id}/registration"
              payload: { is_registered: true }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/status-transitions"
              payload: { to_status: "CONFIRMED" }
              as: Author
              as_user_id: "${au_ada_id}"
            - call: "POST /abstracts/${ab2_id}/status-transitions"
              payload: { to_status: "CONFIRMED" }
              as: Author
              as_user_id: "${au_ada_id}"
            - call: "POST /sessions"
              payload: { conference_id: "${conf_id}", chair_member_id: "${mb_cho_id}", theme_code: "oncology", format: "ORAL", room_code: "R1", start_utc: "2026-09-01T09:00:00Z", end_utc: "2026-09-01T11:00:00Z", capacity_slots: 2, cme_designated: true }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
              captures: { ses_id: "$.data.id" }
            - call: "GET /sessions/${ses_id}"
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
              captures: { ses_v0: "$.data.version" }
            - call: "POST /sessions/${ses_id}/slots"
              payload: { abstract_id: "${ab1_id}", presenter_author_id: "${au_ada_id}", position: 1, duration_minutes: 30, expected_session_version: "${ses_v0}" }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
              captures: { slot1_id: "$.data.id" }
          trigger:
            - call: "POST /accreditations"
              payload: { abstract_id: "${ab2_id}", content_minutes: 30 }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
              captures: { e_not_eligible: "$.data.error_id" }
            - call: "POST /accreditations"
              payload: { abstract_id: "${ab1_id}", content_minutes: 90, commercial_support_disclosed: false }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
              captures: { acc1_id: "$.data.id", acc1_status: "$.data.validation_status" }
            - call: "POST /accreditations/${acc1_id}/validation"
              payload: { action: "REVOKE" }
              as: ProgramChair
              as_user_id: "${mb_dana_id}"
              captures: { e_acc_state: "$.data.error_id" }
            - call: "POST /disclosure-statements"
              payload: { abstract_id: "${ab2_id}", accreditation_id: "${acc1_id}", author_id: "${au_ada_id}", has_financial_relationship: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { e_disc_mismatch: "$.data.error_id" }
            - call: "POST /disclosure-statements"
              payload: { abstract_id: "${ab1_id}", accreditation_id: "${acc1_id}", author_id: "${au_ada_id}", has_financial_relationship: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { disc1_id: "$.data.id", disc1_status: "$.data.status" }
            - call: "POST /accreditations/${acc1_id}/validation"
              payload: { action: "VALIDATE" }
              as: ProgramChair
              as_user_id: "${mb_dana_id}"
              captures: { e_disc_incomplete: "$.data.error_id" }
            - call: "POST /disclosure-statements/${disc1_id}/adjudication"
              payload: { outcome: "VALIDATED" }
              as: ProgramChair
              as_user_id: "${mb_dana_id}"
              captures: { disc1_status_after: "$.data.status" }
            - call: "POST /disclosure-statements/${disc1_id}/adjudication"
              payload: { outcome: "VALIDATED" }
              as: ProgramChair
              as_user_id: "${mb_dana_id}"
              captures: { e_disc_state: "$.data.error_id" }
            - call: "POST /accreditations/${acc1_id}/validation"
              payload: { action: "VALIDATE" }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
              captures: { e_self_validation: "$.data.error_id" }
            - call: "POST /accreditations/${acc1_id}/validation"
              payload: { action: "VALIDATE" }
              as: ProgramChair
              as_user_id: "${mb_dana_id}"
              captures: { e_pool: "$.data.error_id" }
            - call: "GET /accreditations/${acc1_id}"
              as: ProgramChair
              as_user_id: "${mb_dana_id}"
              captures: { acc1_status_end: "$.data.validation_status", acc1_credits: "$.data.awarded_credits" }
            - call: "POST /sessions/${ses_id}/status-transitions"
              payload: { to_status: "PUBLISHED" }
              as: ProgramChair
              as_user_id: "${mb_cho_id}"
              captures: { e_not_accredited: "$.data.error_id" }
            - call: "POST /abstracts/${ab2_id}/press-actions"
              payload: { action: "SET_EMBARGO", embargo_until_utc: "2026-08-01T00:00:00Z" }
              as: PressOfficer
              captures: { e_not_newsworthy: "$.data.error_id" }
            - call: "POST /abstracts/${ab1_id}/press-actions"
              payload: { action: "RELEASE", outlet_name: "The Northline Herald" }
              as: PressOfficer
              captures: { e_embargo_not_set: "$.data.error_id" }
            - call: "POST /abstracts/${ab1_id}/press-actions"
              payload: { action: "SET_EMBARGO", embargo_until_utc: "2025-12-01T00:00:00Z" }
              as: PressOfficer
              captures: { e_window_past: "$.data.error_id" }
            - call: "POST /abstracts/${ab1_id}/press-actions"
              payload: { action: "SET_EMBARGO", embargo_until_utc: "2026-09-04T00:00:00Z" }
              as: PressOfficer
              captures: { e_window_after_event: "$.data.error_id" }
            - call: "POST /abstracts/${ab1_id}/press-actions"
              payload: { action: "SET_EMBARGO", embargo_until_utc: "2026-08-01T00:00:00Z" }
              as: PressOfficer
              captures: { emb_status: "$.data.embargo_status", emb_until: "$.data.embargo_until_utc" }
          assert:
            - "accreditation on A2 (category GEN) → HTTP 422 ERR_CATEGORY_NOT_CME_ELIGIBLE"
            - "accreditation on A1 → HTTP 201 with validation_status PENDING and awarded_credits 0.00"
            - "REVOKE on a PENDING accreditation → HTTP 409 ERR_ACCREDITATION_STATE_INVALID"
            - "disclosure quoting abstract A2 under A1's accreditation → HTTP 422 ERR_DISCLOSURE_ABSTRACT_MISMATCH"
            - "disclosure on A1 → HTTP 201 with status SUBMITTED and mitigation_required false"
            - "VALIDATE by Dana while the disclosure is only SUBMITTED → HTTP 409 ERR_DISCLOSURE_INCOMPLETE"
            - "adjudicating the disclosure VALIDATED → HTTP 200 with status VALIDATED; posting VALIDATED again → HTTP 409 ERR_DISCLOSURE_STATE_INVALID"
            - "VALIDATE by Cho (Abstract.decided_by_member_id) → HTTP 409 ERR_ACCREDITATION_SELF_VALIDATION, which outranks the exhausted pool at p21"
            - "VALIDATE by Dana with every earlier gate satisfied → HTTP 422 ERR_CME_POOL_EXHAUSTED (90 > 60)"
            - "CmeAccreditation.${acc1_id}.validation_status is still PENDING and awarded_credits is still 0.00; Conference.cme_minutes_allocated == 0"
            - "publishing the cme_designated session → HTTP 409 ERR_SESSION_NOT_ACCREDITED (accredited_credit_total 0.00 < 0.50)"
            - "SET_EMBARGO on A2 → HTTP 422 ERR_NOT_NEWSWORTHY"
            - "RELEASE on A1 while embargo_status is NONE → HTTP 409 ERR_EMBARGO_NOT_SET"
            - "SET_EMBARGO at 2025-12-01T00:00:00Z (before the clock) and at 2026-09-04T00:00:00Z (after event_end_utc) → HTTP 422 ERR_EMBARGO_WINDOW_INVALID both times"
            - "SET_EMBARGO at 2026-08-01T00:00:00Z → HTTP 200 with embargo_status EMBARGOED and embargo_until_utc 2026-08-01T00:00:00Z"

      - name: insufficient_reviews_guard_is_shadowed_by_the_abstract_state_guard
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INSUFFICIENT_REVIEWS
          - state_machines.Abstract.SCORED_to_ACCEPTED
          - validations.p10
        distinguishing_aspect: |
          ERR_INSUFFICIENT_REVIEWS is declared on the decision endpoint, but the
          §1.2 Abstract machine makes it unreachable through the API: an abstract
          only becomes SCORED once submitted_review_count has already reached
          category.min_reviews_required, and no transition ever voids a SUBMITTED
          review (suspension, resignation and revision void only ASSIGNED ones), so
          the count can never fall back below the minimum while the abstract is
          SCORED. The honest claim is therefore that the earlier p10 entity-state
          guard answers instead: a decision on an abstract that has only one of two
          required reviews is refused with ERR_ABSTRACT_STATE_INVALID because the
          abstract is still UNDER_REVIEW. An implementation that returns
          ERR_INSUFFICIENT_REVIEWS here has ordered its guards wrongly.
