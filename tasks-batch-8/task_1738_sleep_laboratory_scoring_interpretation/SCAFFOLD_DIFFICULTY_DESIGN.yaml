            - "ReferralOrder.${o1}.status == AUTHORIZED (order flip caused by the auth mutation)"
            - "GET /authorizations?order_id=${o1} shows exactly one APPROVED authorization"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: split_state_beats_safety
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_STUDY_NOT_IN_PROGRESS]
          - errors[ERR_SPLIT_CENTRAL_PREDOMINANCE]
        distinguishing_aspect: |
          Category pair state vs business_safety: a split-decision on a merely SCHEDULED
          study with central_predominance_flag true violates both p7 (state) and p8 (safety);
          the state error ERR_STUDY_NOT_IN_PROGRESS must win.
        test_recipe:
          setup:
            - "SPLIT_NIGHT study created but never checked in (status SCHEDULED)"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D5A-01", full_name: "Pat Nine", date_of_birth: "1978-09-09" }, as: Scheduler, captures: { p1: $.data.id } }
