scenario: |
  Blockchain evidence preservation platform: data hash on-chain with file fingerprint generation
  (SHA-256/SM3), original-data optional storage, on-chain transaction submission, multi-chain
  support, on-chain confirmation tracking, and re-submission on failure; evidence certificate
  generation with certificate template, on-chain transaction reference, hash and timestamp
  embedding, certificate-verification code, and certificate download in multiple formats;
  forensic verification with file re-hashing, on-chain hash comparison, certificate-validity
  check, tamper detection, and verification report generation; judicial evidence issuance with
  judicial-authority cooperation interface, evidence package preparation (original data/hash/
  on-chain proof/notary statement), case number and party information binding, official-seal
  embedding, and judicial-authority delivery records; timestamp notarization with trusted
  timestamp authority integration, notary-office cooperation, timestamp embedding in evidence,
  and timestamp-verification interface; batch evidence preservation with batch file submission,
  Merkle-tree aggregation, single on-chain transaction for batch, individual-evidence
  verification path generation, and batch-result report; fee calculation with pricing by
  evidence type and storage period, batch-volume discount, judicial-issuance additional fee,
  recharge and deduction, and invoice issuance; event-driven synchronization with payment,
  judicial authority, and notary office systems; audit logging for on-chain transactions and
  evidence issuance.

domain_name: "blockchain-evidence"
api_prefix: "/evidences"

complexity_profile:
  primary_archetype: "compliance_audit"
  secondary_archetype: "workflow_orchestration"
  complexity_layers:
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "bulk_operations"
    - "idempotency"
    - "scheduled_deferred_actions"
  entity_topology: "flat"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
    - "polymorphic"
  role_model: "peer_roles"
  consistency_model: "saga"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique customer email used for login identity."
        constraints: "RFC5322; unique across active customers."
      - name: display_name
        type: string
        source: input
        description: "Human-readable name shown on certificates."
      - name: wallet_balance_cents
        type: integer
        source: computed
        description: "Prepaid balance in cents; credited by recharge, debited by deductions."
        default: 0
        constraints: ">= 0; never negative."
      - name: status
        type: enum
        source: system
        description: "ACTIVE customers can submit evidence; SUSPENDED cannot."
        default: "ACTIVE"
        constraints: "values: ACTIVE, SUSPENDED."

  - name: FeeAccount
    parent: null
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK to Customer.id; one ledger per customer."
        constraints: "unique."
      - name: lifetime_recharge_cents
        type: integer
        source: computed
        description: "Sum of all completed recharges in cents."
        default: 0
      - name: lifetime_deduction_cents
        type: integer
        source: computed
        description: "Sum of all completed deductions in cents."
        default: 0

  - name: Evidence
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK to Customer.id; owner of this evidence."
      - name: evidence_type
        type: enum
        source: input
        description: "Pricing dimension; affects per-evidence fee."
        constraints: "values: DOCUMENT, IMAGE, VIDEO, CODE_REPOSITORY, DATASET."
      - name: storage_period_days
        type: integer
        source: input
        description: "Requested retention duration; floor for fee tier."
        constraints: "values: 30, 90, 365, 1095."
      - name: hash_algorithm
        type: enum
        source: input
        description: "Fingerprint algorithm applied to the source file."
        constraints: "values: SHA256, SM3."
      - name: file_hash
        type: string
        source: input
        description: "Hex-encoded digest of the original file."
        constraints: "64 hex chars for SHA256/SM3."
      - name: original_data_b64
        type: string
        source: input
        description: "Optional base64 payload; null when only the hash is stored."
        default: null
      - name: chain_id
        type: enum
        source: input
        description: "Target blockchain for the on-chain anchor."
        constraints: "values: ETHEREUM, FABRIC, BSN, COSMOS."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of this evidence record."
        default: "PENDING"
        constraints: "values: PENDING, SUBMITTING, CONFIRMED, FAILED, EXPIRED."
      - name: submission_attempts
        type: integer
        source: computed
        description: "Count of on-chain submission attempts performed for this evidence."
        default: 0
      - name: per_evidence_fee_cents
        type: integer
        source: computed
        description: "Final preservation fee in cents debited at CONFIRMED transition."
        default: null
      - name: batch_id
        type: string
        source: system
        description: "FK to Batch.id; null when evidence is preserved individually."
        default: null
      - name: confirmed_at
        type: datetime
        source: system
        description: "ISO 8601 timestamp when status flipped to CONFIRMED."
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "confirmed_at + storage_period_days * 86400 seconds; null until CONFIRMED."
        default: null
      - name: idempotency_key
        type: string
        source: input
        description: "Client-supplied de-duplication key per customer."
        default: null
        constraints: "unique per (customer_id, idempotency_key) when present."

  - name: OnChainTx
    parent: null
    common_fields: true
    fields:
      - name: evidence_id
        type: string
        source: system
        description: "FK to Evidence.id; null when this tx anchors a Batch instead."
        default: null
      - name: batch_id
        type: string
        source: system
        description: "FK to Batch.id; mutually exclusive with evidence_id."
        default: null
      - name: chain_id
        type: enum
        source: system
        description: "Blockchain network this tx targets."
        constraints: "values: ETHEREUM, FABRIC, BSN, COSMOS."
      - name: anchored_hash
        type: string
        source: system
        description: "The hash actually written on-chain (file_hash for single, Merkle root for batch)."
      - name: tx_hash
        type: string
        source: system
        description: "On-chain transaction identifier returned by the chain adapter."
        default: null
      - name: block_height
        type: integer
        source: system
        description: "Confirmed block height; null until CONFIRMED."
        default: null
      - name: confirmations
        type: integer
        source: computed
        description: "Number of confirmations observed; CONFIRMED at threshold per chain."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Transaction lifecycle."
        default: "SUBMITTED"
        constraints: "values: SUBMITTED, CONFIRMED, FAILED."
      - name: attempt_index
        type: integer
        source: system
        description: "1-based sequence number among retries for the same anchor target."
        constraints: ">= 1."

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK to Customer.id; the submitter."
      - name: chain_id
        type: enum
        source: input
        description: "Target chain for the aggregated batch anchor."
        constraints: "values: ETHEREUM, FABRIC, BSN, COSMOS."
      - name: evidence_count
        type: integer
        source: system
        description: "Number of evidences aggregated; pinned at creation."
        constraints: ">= 2 and <= 1000."
      - name: merkle_root
        type: string
        source: system
        description: "Hex-encoded Merkle root over evidence file_hash leaves in submission order."
      - name: status
        type: enum
        source: system
        description: "Batch lifecycle."
        default: "PENDING"
        constraints: "values: PENDING, SUBMITTING, CONFIRMED, FAILED."
      - name: total_fee_cents
        type: integer
        source: computed
        description: "Aggregate fee debited at CONFIRMED, after batch-volume discount."
        default: null
      - name: submission_attempts
        type: integer
        source: computed
        description: "Count of on-chain submission attempts for this batch."
        default: 0

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: evidence_id
        type: string
        source: input
        description: "FK to Evidence.id; the evidence this certificate testifies to."
      - name: template_code
        type: enum
        source: input
        description: "Visual template selector embedded in the rendered certificate."
        constraints: "values: STANDARD, PREMIUM, JUDICIAL."
      - name: verification_code
        type: string
        source: system
        description: "12-character alphanumeric public verification handle."
        constraints: "12 uppercase alphanumeric chars; unique."
      - name: embedded_timestamp
        type: datetime
        source: system
        description: "Trusted timestamp anchored on the certificate; sourced from TimestampNotarization."
      - name: tx_hash_ref
        type: string
        source: system
        description: "Copy of OnChainTx.tx_hash for the confirmed anchor."
      - name: chain_id
        type: enum
        source: system
        description: "Copy of Evidence.chain_id at issuance."
        constraints: "values: ETHEREUM, FABRIC, BSN, COSMOS."
      - name: hash_snapshot
        type: string
        source: system
        description: "Copy of Evidence.file_hash at issuance (immutable)."
      - name: status
        type: enum
        source: system
        description: "ISSUED until revoked; REVOKED if evidence is invalidated."
        default: "ISSUED"
        constraints: "values: ISSUED, REVOKED."

  - name: TimestampNotarization
    parent: null
    common_fields: false
    fields:
      - name: evidence_id
        type: string
        source: input
        description: "FK to Evidence.id; one notarization per evidence."
        constraints: "unique."
      - name: tsa_provider
        type: enum
        source: input
        description: "Trusted Timestamp Authority provider."
        constraints: "values: RFC3161_TSA_A, RFC3161_TSA_B, NOTARY_OFFICE."
      - name: notary_office_id
        type: string
        source: input
        description: "Notary office identifier when tsa_provider = NOTARY_OFFICE; null otherwise."
        default: null
      - name: trusted_time
        type: datetime
        source: system
        description: "Authoritative ISO 8601 timestamp returned by the TSA."
      - name: tsa_token
        type: string
        source: system
        description: "Opaque token returned by the TSA proving issuance."

  - name: JudicialPackage
    parent: null
    common_fields: true
    fields:
      - name: evidence_id
        type: string
        source: input
        description: "FK to Evidence.id; the evidence being issued to a court."
      - name: case_number
        type: string
        source: input
        description: "Court-assigned case identifier."
        constraints: "non-empty; max 64 chars."
      - name: party_info
        type: object
        source: input
        description: "{ plaintiff, defendant } record bound at preparation."
      - name: authority_code
        type: enum
        source: input
        description: "Receiving judicial authority."
        constraints: "values: COURT_BJ, COURT_SH, COURT_GZ, COURT_SZ, PROCURATORATE, ARBITRATION."
      - name: include_original_data
        type: boolean
        source: input
        description: "Whether the original_data_b64 payload is bundled into the package."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the issuance package."
        default: "DRAFT"
        constraints: "values: DRAFT, SEALED, DELIVERED, REJECTED."
      - name: official_seal_id
        type: string
        source: system
        description: "Seal identifier embedded at SEALED transition."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "ISO 8601 timestamp of judicial-authority delivery acknowledgement."
        default: null
      - name: surcharge_cents
        type: integer
        source: computed
        description: "Judicial-issuance additional fee debited at SEALED."
        default: null

  - name: VerificationReport
    parent: null
    common_fields: false
    fields:
      - name: evidence_id
        type: string
        source: input
        description: "FK to Evidence.id; the evidence under verification."
      - name: recomputed_hash
        type: string
        source: system
        description: "Hash derived from the re-submitted file during verification."
      - name: on_chain_hash
        type: string
        source: system
        description: "Hash read back from OnChainTx.anchored_hash (single) or Merkle path (batch)."
      - name: certificate_valid
        type: boolean
        source: system
        description: "Whether the linked Certificate is ISSUED and chain proof verifies."
      - name: tamper_detected
        type: boolean
        source: system
        description: "True when recomputed_hash != on_chain_hash or chain proof fails."
      - name: outcome
        type: enum
        source: system
        description: "Single-word summary of the report."
        constraints: "values: VERIFIED, TAMPERED, EXPIRED, REVOKED, UNAVAILABLE."

  - name: Recharge
    parent: null
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK to Customer.id; account being credited."
      - name: amount_cents
        type: integer
        source: input
        description: "Recharge amount in cents."
        constraints: ">= 100 and <= 10000000."
      - name: external_payment_ref
        type: string
        source: input
        description: "Opaque payment-system reference; unique."
        constraints: "unique across all Recharges."
      - name: status
        type: enum
        source: system
        description: "PENDING until payment event observed; COMPLETED on credit."
        default: "PENDING"
        constraints: "values: PENDING, COMPLETED, FAILED."

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK to Customer.id; the billed party."
      - name: scope
        type: enum
        source: input
        description: "Billing window selector."
        constraints: "values: SINGLE_EVIDENCE, SINGLE_BATCH, BILLING_PERIOD."
      - name: scope_ref_id
        type: string
        source: input
        description: "FK depending on scope: Evidence.id, Batch.id, or null for BILLING_PERIOD."
        default: null
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start when scope = BILLING_PERIOD; null otherwise."
        default: null
      - name: period_end
        type: datetime
        source: input
        description: "Inclusive end when scope = BILLING_PERIOD; null otherwise."
        default: null
      - name: total_cents
        type: integer
        source: computed
        description: "Sum of debits captured by scope. Pinned at issuance."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: "ISSUED"
        constraints: "values: ISSUED, VOIDED."

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: enum
        source: system
        description: "Role of the caller."
        constraints: "values: Customer, JudicialOfficer, NotaryOfficer, PlatformAdmin, system."
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID at request time; null for system events."
        default: null
      - name: event_type
        type: enum
        source: system
        description: "Audited event category."
        constraints: "values: EVIDENCE_SUBMITTED, EVIDENCE_CONFIRMED, EVIDENCE_FAILED, EVIDENCE_RESUBMITTED, BATCH_CONFIRMED, CERTIFICATE_ISSUED, JUDICIAL_SEALED, JUDICIAL_DELIVERED, FEE_DEBITED, RECHARGE_COMPLETED, INVOICE_ISSUED."
      - name: target_entity
        type: enum
        source: system
        description: "Affected entity type."
        constraints: "values: Evidence, Batch, OnChainTx, Certificate, JudicialPackage, FeeAccount, Recharge, Invoice."
      - name: target_id
        type: string
        source: system
        description: "id of the affected entity."
      - name: detail
        type: object
        source: system
        description: "JSON snapshot of key field deltas (before/after)."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Evidence
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: SUBMITTING
        trigger: "POST /evidences/{id}/submit"
        actor: Customer
        preconditions:
          - "Customer.status == ACTIVE"
          - "Evidence.batch_id IS NULL"
          - "Customer.wallet_balance_cents >= per_evidence_fee_cents_quote (see calc preservation_fee_quote)"
        side_effects:
          - "Create OnChainTx (evidence_id=this, attempt_index=Evidence.submission_attempts + 1, status=SUBMITTED, anchored_hash=Evidence.file_hash)."
          - "Increment Evidence.submission_attempts by 1."
          - "Append AuditLog event_type=EVIDENCE_SUBMITTED."
      - from: SUBMITTING
        to: CONFIRMED
        trigger: "POST /_chain/confirm (system; called after sufficient confirmations observed)"
        actor: system
        preconditions:
          - "OnChainTx.status == CONFIRMED for the latest attempt"
          - "TimestampNotarization exists for this Evidence"
        side_effects:
          - "Set Evidence.confirmed_at = now; Evidence.expires_at = confirmed_at + storage_period_days*86400s."
          - "Compute per_evidence_fee_cents via calculation preservation_fee_final and debit Customer.wallet_balance_cents."
          - "Increment FeeAccount.lifetime_deduction_cents by per_evidence_fee_cents."
          - "Append AuditLog event_type=EVIDENCE_CONFIRMED and FEE_DEBITED."
      - from: SUBMITTING
        to: FAILED
        trigger: "POST /_chain/fail (system; observed transaction failure)"
        actor: system
        preconditions:
          - "OnChainTx.status == FAILED for the latest attempt"
        side_effects:
          - "Append AuditLog event_type=EVIDENCE_FAILED."
          - "No fee debited."
      - from: FAILED
        to: SUBMITTING
        trigger: "POST /evidences/{id}/resubmit"
        actor: Customer
        preconditions:
          - "Evidence.submission_attempts < 3"
          - "Customer.wallet_balance_cents >= per_evidence_fee_cents_quote"
        side_effects:
          - "Create a new OnChainTx (attempt_index = Evidence.submission_attempts + 1)."
          - "Increment Evidence.submission_attempts by 1."
          - "Append AuditLog event_type=EVIDENCE_RESUBMITTED."
      - from: CONFIRMED
        to: EXPIRED
        trigger: "POST /_sweep/run (system; runs after expires_at)"
        actor: system
        preconditions:
          - "now() >= Evidence.expires_at"
        side_effects:
          - "Revoke linked Certificate (Certificate.status = REVOKED)."
          - "If any JudicialPackage with status IN {DRAFT} for this Evidence exists, set JudicialPackage.status = REJECTED."

  - entity: OnChainTx
    initial_state: SUBMITTED
    terminal_states: [CONFIRMED, FAILED]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /_chain/confirm"
        actor: system
        preconditions:
          - "Reported confirmations >= chain confirmation_threshold (ETHEREUM:12, FABRIC:1, BSN:5, COSMOS:6)"
        side_effects:
          - "Set OnChainTx.block_height and confirmations."
          - "Cascade-trigger Evidence.SUBMITTING_to_CONFIRMED (if evidence-anchored) or Batch.SUBMITTING_to_CONFIRMED (if batch-anchored)."
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /_chain/fail"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade-trigger Evidence.SUBMITTING_to_FAILED or Batch.SUBMITTING_to_FAILED."

  - entity: Batch
    initial_state: PENDING
    terminal_states: [CONFIRMED, FAILED]
    transitions:
      - from: PENDING
        to: SUBMITTING
        trigger: "POST /batches/{id}/submit"
        actor: Customer
        preconditions:
          - "Batch.evidence_count >= 2"
          - "All member Evidence rows have status == PENDING and batch_id == Batch.id"
          - "Customer.wallet_balance_cents >= batch_total_fee_quote"
        side_effects:
          - "Compute Batch.merkle_root over member file_hash leaves in submission order."
          - "Create OnChainTx (batch_id=this, attempt_index = Batch.submission_attempts + 1, anchored_hash = Batch.merkle_root, status=SUBMITTED)."
          - "Set every member Evidence.status to SUBMITTING."
          - "Increment Batch.submission_attempts by 1."
      - from: SUBMITTING
        to: CONFIRMED
        trigger: "POST /_chain/confirm (cascade from OnChainTx)"
        actor: system
        preconditions:
          - "OnChainTx.status == CONFIRMED for the latest attempt"
          - "Every member Evidence has a TimestampNotarization"
        side_effects:
          - "For each member Evidence: set status=CONFIRMED, confirmed_at=now, expires_at=now+storage_period_days*86400s."
          - "Compute Batch.total_fee_cents via calculation batch_fee_final (applies batch-volume discount) and debit Customer.wallet_balance_cents once."
          - "Increment FeeAccount.lifetime_deduction_cents by Batch.total_fee_cents."
          - "Append AuditLog event_type=BATCH_CONFIRMED and FEE_DEBITED."
      - from: SUBMITTING
        to: FAILED
        trigger: "POST /_chain/fail (cascade from OnChainTx)"
        actor: system
        preconditions: []
        side_effects:
          - "Set every member Evidence.status to FAILED."
          - "No fee debited."

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "Cascade: Evidence.CONFIRMED_to_EXPIRED OR PlatformAdmin POST /certificates/{id}/revoke"
        actor: system | PlatformAdmin
        preconditions:
          - "Certificate.status == ISSUED"
        side_effects:
          - "If a SEALED JudicialPackage references this evidence and has not been DELIVERED, do not auto-cascade — judicial channel decides."

  - entity: JudicialPackage
    initial_state: DRAFT
    terminal_states: [DELIVERED, REJECTED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /judicial-packages/{id}/seal"
        actor: JudicialOfficer
        preconditions:
          - "Linked Evidence.status == CONFIRMED"
          - "Linked Certificate.status == ISSUED"
          - "Linked TimestampNotarization exists"
          - "Customer.wallet_balance_cents >= judicial_surcharge_quote"
        side_effects:
          - "Set official_seal_id = newly minted seal identifier."
          - "Compute JudicialPackage.surcharge_cents via calculation judicial_surcharge_final and debit Customer.wallet_balance_cents."
          - "Increment FeeAccount.lifetime_deduction_cents by surcharge_cents."
          - "Append AuditLog event_type=JUDICIAL_SEALED and FEE_DEBITED."
      - from: SEALED
        to: DELIVERED
        trigger: "POST /judicial-packages/{id}/deliver"
        actor: JudicialOfficer
        preconditions:
          - "JudicialPackage.status == SEALED"
        side_effects:
          - "Set delivered_at = now."
          - "Append AuditLog event_type=JUDICIAL_DELIVERED."
      - from: DRAFT
        to: REJECTED
        trigger: "Cascade from Evidence.CONFIRMED_to_EXPIRED while package is still DRAFT"
        actor: system
        preconditions: []
        side_effects:
          - "No fee refund (no fee has yet been debited for DRAFT)."

  - entity: Recharge
    initial_state: PENDING
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /_events/payment (external payment system callback)"
        actor: system
        preconditions:
          - "Event payload status == SUCCESS"
          - "external_payment_ref matches Recharge.external_payment_ref"
        side_effects:
          - "Credit Customer.wallet_balance_cents by amount_cents."
          - "Increment FeeAccount.lifetime_recharge_cents by amount_cents."
          - "Append AuditLog event_type=RECHARGE_COMPLETED."
      - from: PENDING
        to: FAILED
        trigger: "POST /_events/payment (status == FAILURE)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clients call POST /evidences/{id}/submit simultaneously on the same PENDING evidence"
    guarantee: "At most one OnChainTx submission per attempt index; the loser is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Evidence.status (PENDING -> SUBMITTING)."

  - scenario: "Two clients call POST /evidences/{id}/resubmit simultaneously on the same FAILED evidence"
    guarantee: "Exactly one resubmission succeeds and increments submission_attempts."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Evidence.status (FAILED -> SUBMITTING)."

  - scenario: "Two payment events arrive carrying the same external_payment_ref"
    guarantee: "Wallet is credited at most once for any external_payment_ref."
    error_id: ERR_DUPLICATE_PAYMENT_REF
    http_status: 409
    serialization: "Unique constraint on Recharge.external_payment_ref; second event acknowledged but ignored after returning conflict."

  - scenario: "Two clients submit Evidence with identical (customer_id, idempotency_key)"
    guarantee: "Only the first submission creates a new Evidence; the second is rejected."
    error_id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http_status: 409
    serialization: "Unique constraint on (Evidence.customer_id, Evidence.idempotency_key) when key is present."

  - scenario: "Two clients seal the same DRAFT JudicialPackage at once"
    guarantee: "Exactly one seal succeeds; the loser observes the package already SEALED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on JudicialPackage.status (DRAFT -> SEALED)."

  - scenario: "Customer issues a refund-style void on an Invoice while a new fee debit is being applied"
    guarantee: "Wallet balance never goes negative; the operation that would drive it below 0 fails."
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    serialization: "First-writer-wins on Customer.wallet_balance_cents using row lock; reads inside the same critical section."

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: preservation_fee_quote
    trigger: "Evidence.PENDING -> SUBMITTING precondition check (forward-looking estimate)"
    algorithm: forward_looking
    formula: |
      base = BASE_FEE_BY_TYPE[evidence_type]
      multiplier = PERIOD_MULTIPLIER[storage_period_days]
      original_data_surcharge = (original_data_b64 IS NOT NULL) ? 50 : 0
      quote_cents = round_half_up(base * multiplier + original_data_surcharge)
    input_set: "Single Evidence row in PENDING; ignores any sibling evidence and ignores wallet balance."
    constants:
      BASE_FEE_BY_TYPE: { DOCUMENT: 200, IMAGE: 300, VIDEO: 800, CODE_REPOSITORY: 500, DATASET: 1000 }
      PERIOD_MULTIPLIER: { 30: 1.00, 90: 2.50, 365: 8.00, 1095: 20.00 }
    precision: "integer cents; round_half_up at the final step."
    variants:
      - name: forward_looking_quote
        when: "Used for precondition check before SUBMITTING"
        difference: "Uses optimistic assumption: no batch discount and no judicial surcharge applied yet."

  - name: preservation_fee_final
    trigger: "Evidence.SUBMITTING -> CONFIRMED side_effect (chronological actual debit)"
    algorithm: chronological
    formula: |
      base = BASE_FEE_BY_TYPE[evidence_type]
      multiplier = PERIOD_MULTIPLIER[storage_period_days]
      original_data_surcharge = (original_data_b64 IS NOT NULL) ? 50 : 0
      # No batch discount applies to single-evidence path.
      final_cents = round_half_up(base * multiplier + original_data_surcharge)
    input_set: "The single Evidence row reaching CONFIRMED. Excludes evidences inside a Batch (those use batch_fee_final)."
    constants:
      BASE_FEE_BY_TYPE: { DOCUMENT: 200, IMAGE: 300, VIDEO: 800, CODE_REPOSITORY: 500, DATASET: 1000 }
      PERIOD_MULTIPLIER: { 30: 1.00, 90: 2.50, 365: 8.00, 1095: 20.00 }
    precision: "integer cents; round_half_up at the final step."
    variants:
      - name: chronological_actual
        when: "Evidence.batch_id IS NULL"
        difference: "Matches quote exactly when no batch path is taken; final value is the debited amount."

  - name: batch_fee_final
    trigger: "Batch.SUBMITTING -> CONFIRMED side_effect"
    algorithm: tiered_pricing
    formula: |
      # Step 1: per-member subtotal in cents (use per-evidence formula PER LINE then sum).
      per_member_subtotal = []
      for ev in batch.members (ordered by submission order):
          base = BASE_FEE_BY_TYPE[ev.evidence_type]
          multiplier = PERIOD_MULTIPLIER[ev.storage_period_days]
          original_data_surcharge = (ev.original_data_b64 IS NOT NULL) ? 50 : 0
          line = round_half_up(base * multiplier + original_data_surcharge)   # round per line first
          per_member_subtotal.append(line)
      subtotal_cents = sum(per_member_subtotal)

      # Step 2: batch-volume discount (tiered, applied to the SUM after per-line rounding).
      if batch.evidence_count >= 100:
          discount_rate = 0.20
      elif batch.evidence_count >= 50:
          discount_rate = 0.15
      elif batch.evidence_count >= 10:
          discount_rate = 0.10
      elif batch.evidence_count >= 2:
          discount_rate = 0.05
      else:
          discount_rate = 0.00

      # Step 3: discount applied to subtotal, then a single final round.
      total_cents = round_half_up(subtotal_cents * (1 - discount_rate))
    input_set: "All Evidence rows whose batch_id == this Batch.id, ordered by submission order. Excludes any later-added evidences (the count is pinned at batch creation)."
    constants:
      BASE_FEE_BY_TYPE: { DOCUMENT: 200, IMAGE: 300, VIDEO: 800, CODE_REPOSITORY: 500, DATASET: 1000 }
      PERIOD_MULTIPLIER: { 30: 1.00, 90: 2.50, 365: 8.00, 1095: 20.00 }
      DISCOUNT_TIERS:
        - { min_count: 100, rate: 0.20 }
        - { min_count: 50,  rate: 0.15 }
        - { min_count: 10,  rate: 0.10 }
        - { min_count: 2,   rate: 0.05 }
    precision: "integer cents; round-per-line first, then round_half_up after discount."
    variants:
      - name: round_per_line_then_sum
        when: "Authoritative variant: pin the rounding order"
        difference: "Computes per-line cents (rounded), sums them, applies discount, then rounds once more. A 'sum-then-round' variant would shift cents on each line and is explicitly NOT used."

  - name: judicial_surcharge_quote
    trigger: "JudicialPackage.DRAFT -> SEALED precondition check (forward-looking)"
    algorithm: forward_looking
    formula: |
      base_surcharge = 5000
      original_data_uplift = include_original_data ? 1500 : 0
      authority_multiplier = AUTHORITY_MULT[authority_code]
      quote_cents = round_half_up((base_surcharge + original_data_uplift) * authority_multiplier)
    input_set: "Single JudicialPackage row in DRAFT; ignores wallet balance."
    constants:
      AUTHORITY_MULT:
        COURT_BJ: 1.20
        COURT_SH: 1.20
        COURT_GZ: 1.10
        COURT_SZ: 1.10
        PROCURATORATE: 1.00
        ARBITRATION: 0.90
    precision: "integer cents; round_half_up at the final step."
    variants:
      - name: forward_looking_quote
        when: "Used as precondition during seal check"
        difference: "Optimistic — does not consult any later discount or refund logic."

  - name: judicial_surcharge_final
    trigger: "JudicialPackage.DRAFT -> SEALED side_effect (actual debit)"
    algorithm: chronological
    formula: |
      base_surcharge = 5000
      original_data_uplift = include_original_data ? 1500 : 0
      authority_multiplier = AUTHORITY_MULT[authority_code]
      final_cents = round_half_up((base_surcharge + original_data_uplift) * authority_multiplier)
    input_set: "The single JudicialPackage reaching SEALED."
    constants:
      AUTHORITY_MULT:
        COURT_BJ: 1.20
        COURT_SH: 1.20
        COURT_GZ: 1.10
        COURT_SZ: 1.10
        PROCURATORATE: 1.00
        ARBITRATION: 0.90
    precision: "integer cents; round_half_up at the final step."
    variants:
      - name: chronological_actual
        when: "Always at SEALED transition"
        difference: "Matches the quote because no per-package discount logic exists; debited literally."

  - name: invoice_total
    trigger: "POST /invoices (issuance)"
    algorithm: aggregation
    formula: |
      if scope == SINGLE_EVIDENCE:
          total = Evidence.per_evidence_fee_cents   # null if not CONFIRMED -> ERR_INVOICE_SCOPE_INVALID
      elif scope == SINGLE_BATCH:
          total = Batch.total_fee_cents
      elif scope == BILLING_PERIOD:
          # Sum every fee debited in [period_start, period_end] for this customer:
          #   single CONFIRMED Evidence: per_evidence_fee_cents at confirmed_at
          #   CONFIRMED Batch: total_fee_cents at confirmed_at
          #   SEALED JudicialPackage: surcharge_cents at sealed_at (= JudicialPackage.updated_at when status==SEALED)
          # Tie-break for events at exactly period_end: included (closed interval).
          total = sum(those amounts)
    input_set: "Filtered by scope; CONFIRMED/SEALED rows only; period boundaries are inclusive."
    constants: {}
    precision: "integer cents; no further rounding (inputs already integer)."
    variants:
      - name: billing_period_inclusive
        when: "scope == BILLING_PERIOD"
        difference: "Both period boundaries are inclusive; events at period_start and period_end are both counted."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role authorized for the operation per RBAC (§1.7)"
    error_id: ERR_PERMISSION_DENIED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "When the caller role is Customer (entity_backed:Customer), X-User-ID must equal the resource's customer_id for Customer-restricted endpoints (e.g., POST /evidences/{id}/submit, POST /evidences/{id}/resubmit, POST /batches/{id}/submit, POST /recharges, POST /invoices when scope owner = customer_id)"
    error_id: ERR_PERMISSION_DENIED
    http_status: 403
    applies_to: "POST /evidences/{id}/submit, POST /evidences/{id}/resubmit, POST /batches, POST /batches/{id}/submit, POST /recharges, POST /invoices"

  - priority: 4
    category: existence
    check: "Path resources (Evidence, Batch, Certificate, JudicialPackage, …) exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 5
    category: existence
    check: "Customer.id referenced in body exists when present"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "POST /evidences, POST /batches, POST /recharges, POST /invoices"

  - priority: 6
    category: state
    check: "Target entity is in a state that admits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"

  - priority: 7
    category: state
    check: "Linked Evidence.status == CONFIRMED for certificate issuance and judicial sealing"
    error_id: ERR_EVIDENCE_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /certificates, POST /judicial-packages/{id}/seal"

  - priority: 8
    category: business_safety
    check: "file_hash format matches hash_algorithm (64 hex chars for SHA256/SM3)"
    error_id: ERR_HASH_FORMAT_INVALID
    http_status: 422
    applies_to: "POST /evidences"

  - priority: 9
    category: business_referential
    check: "Every member evidence in a Batch belongs to the same customer and is in PENDING with batch_id NULL at batch creation"
    error_id: ERR_BATCH_MEMBER_INVALID
    http_status: 422
    applies_to: "POST /batches"

  - priority: 10
    category: business_constraint
    check: "Batch.evidence_count is between 2 and 1000 inclusive"
    error_id: ERR_BATCH_SIZE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /batches"

  - priority: 11
    category: business_constraint
    check: "storage_period_days is one of {30, 90, 365, 1095}"
    error_id: ERR_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /evidences"

  - priority: 12
    category: business_constraint
    check: "Resubmission attempts may not exceed 3"
    error_id: ERR_RESUBMIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /evidences/{id}/resubmit"

  - priority: 13
    category: business_referential
    check: "TimestampNotarization MUST exist for the Evidence before confirmation can be observed"
    error_id: ERR_TIMESTAMP_REQUIRED
    http_status: 409
    applies_to: "POST /_chain/confirm (cascade target Evidence)"

  - priority: 14
    category: business_referential
    check: "JudicialPackage.case_number must be non-empty and the linked Certificate exists and is ISSUED"
    error_id: ERR_CERTIFICATE_REQUIRED
    http_status: 409
    applies_to: "POST /judicial-packages/{id}/seal"

  - priority: 15
    category: business_temporal
    check: "Certificate download and judicial-package preparation rejected once Evidence.expires_at has passed (verification itself still runs and returns outcome=EXPIRED)"
    error_id: ERR_EVIDENCE_EXPIRED
    http_status: 410
    applies_to: "GET /certificates/{id}/download, POST /judicial-packages"

  - priority: 16
    category: business_temporal
    check: "Invoice period_start <= period_end and the [period_start, period_end] window is in the past (period_end <= now())"
    error_id: ERR_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /invoices (scope == BILLING_PERIOD)"

  - priority: 17
    category: business_fiscal
    check: "Customer.wallet_balance_cents >= preservation_fee_quote at submit / resubmit"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /evidences/{id}/submit, POST /evidences/{id}/resubmit"

  - priority: 18
    category: business_fiscal
    check: "Customer.wallet_balance_cents >= batch_fee_quote (subtotal with discount) at batch submit"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /batches/{id}/submit"

  - priority: 19
    category: business_fiscal
    check: "Customer.wallet_balance_cents >= judicial_surcharge_quote at seal"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /judicial-packages/{id}/seal"

  - priority: 20
    category: business_constraint
    check: "Idempotency key uniqueness on (Customer.id, Evidence.idempotency_key) when provided"
    error_id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http_status: 409
    applies_to: "POST /evidences"

  - priority: 21
    category: business_constraint
    check: "external_payment_ref is globally unique across Recharges"
    error_id: ERR_DUPLICATE_PAYMENT_REF
    http_status: 409
    applies_to: "POST /recharges, POST /_events/payment"

  - priority: 22
    category: business_constraint
    check: "Body version (when supplied on mutation) matches stored version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customers & wallet ----
  - method: POST
    path: "/customers"
    description: "Bootstrap a customer (test fixture endpoint)."
    roles: [PlatformAdmin]
    code: 201
    input: [email, display_name]
    output: Customer
    side_effects: ["Create paired FeeAccount (lifetime_recharge_cents=0, lifetime_deduction_cents=0)."]

  - method: GET
    path: "/customers/{id}"
    description: "Fetch customer including wallet_balance_cents."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/recharges"
    description: "Begin a recharge in PENDING; external payment system later resolves via /_events/payment."
    roles: [Customer]
    code: 201
    input: [customer_id, amount_cents, external_payment_ref]
    output: Recharge
    side_effects: []

  - method: GET
    path: "/recharges/{id}"
    description: "Read a recharge."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Recharge
    side_effects: []

  # ---- Evidence lifecycle ----
  - method: POST
    path: "/evidences"
    description: "Create evidence in PENDING with file fingerprint."
    roles: [Customer]
    code: 201
    input: ["customer_id", "evidence_type", "storage_period_days", "hash_algorithm", "file_hash", "chain_id", "original_data_b64?", "idempotency_key?"]
    output: Evidence
    side_effects: []

  - method: GET
    path: "/evidences/{id}"
    description: "Read evidence."
    roles: [Customer, JudicialOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Evidence
    side_effects: []

  - method: GET
    path: "/evidences"
    description: "List evidences with filter by status and customer_id."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["status?", "customer_id?", "limit?", "offset?"]
    output: Evidence[]
    side_effects: []

  - method: POST
    path: "/evidences/{id}/submit"
    description: "PENDING -> SUBMITTING; creates an OnChainTx attempt."
    roles: [Customer]
    code: 200
    input: []
    output: Evidence
    side_effects:
      - "Create OnChainTx."
      - "Increment Evidence.submission_attempts."
      - "Append AuditLog EVIDENCE_SUBMITTED."

  - method: POST
    path: "/evidences/{id}/resubmit"
    description: "FAILED -> SUBMITTING with a new OnChainTx attempt."
    roles: [Customer]
    code: 200
    input: []
    output: Evidence
    side_effects:
      - "Create OnChainTx (new attempt_index)."
      - "Increment Evidence.submission_attempts."
      - "Append AuditLog EVIDENCE_RESUBMITTED."

  # ---- Timestamp notarization ----
  - method: POST
    path: "/timestamp-notarizations"
    description: "Attach a TSA/Notary timestamp to an evidence."
    roles: [Customer, NotaryOfficer]
    code: 201
    input: ["evidence_id", "tsa_provider", "notary_office_id?"]
    output: TimestampNotarization
    side_effects: []

  - method: GET
    path: "/timestamp-notarizations/{id}"
    description: "Read a notarization including tsa_token."
    roles: [Customer, NotaryOfficer, JudicialOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TimestampNotarization
    side_effects: []

  - method: POST
    path: "/timestamp-notarizations/{id}/verify"
    description: "Verify the TSA token against the evidence's hash; idempotent read-side operation."
    roles: [Customer, JudicialOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TimestampNotarization
    side_effects: []

  # ---- Batch ----
  - method: POST
    path: "/batches"
    description: "Create a Batch over PENDING evidences belonging to the caller."
    roles: [Customer]
    code: 201
    input: [customer_id, chain_id, evidence_ids]
    output: Batch
    side_effects:
      - "Set Evidence.batch_id for every member."
      - "Compute Batch.merkle_root."

  - method: GET
    path: "/batches/{id}"
    description: "Read a batch."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects: []

  - method: POST
    path: "/batches/{id}/submit"
    description: "PENDING -> SUBMITTING; one OnChainTx for the Merkle root."
    roles: [Customer]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "Set member Evidence.status = SUBMITTING."
      - "Create OnChainTx (batch_id=this, anchored_hash=Batch.merkle_root)."

  - method: GET
    path: "/batches/{id}/proof/{evidence_id}"
    description: "Return the Merkle inclusion path for a specific member evidence."
    roles: [Customer, JudicialOfficer, PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  # ---- Certificate ----
  - method: POST
    path: "/certificates"
    description: "Issue a certificate for a CONFIRMED evidence."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [evidence_id, template_code]
    output: Certificate
    side_effects:
      - "Embed hash_snapshot and tx_hash_ref."
      - "Embed embedded_timestamp from the linked TimestampNotarization.trusted_time."
      - "Append AuditLog CERTIFICATE_ISSUED."

  - method: GET
    path: "/certificates/{id}"
    description: "Read certificate metadata."
    roles: [Customer, JudicialOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: GET
    path: "/certificates/{id}/download"
    description: "Return certificate rendition (format=pdf|png|json)."
    roles: [Customer, JudicialOfficer, PlatformAdmin]
    code: 200
    input: [format]
    output: object
    side_effects: []

  - method: POST
    path: "/certificates/{id}/revoke"
    description: "Admin-driven revocation; sets status=REVOKED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: ["Set Certificate.status=REVOKED."]

  # ---- Verification ----
  - method: POST
    path: "/verifications"
    description: "Run forensic verification: re-hash file, compare with on-chain hash, check cert validity, write report."
    roles: [Customer, JudicialOfficer, PlatformAdmin]
    code: 201
    input: [evidence_id, file_hash]
    output: VerificationReport
    side_effects:
      - "Create VerificationReport with outcome in {VERIFIED, TAMPERED, EXPIRED, REVOKED, UNAVAILABLE}."

  # ---- Judicial issuance ----
  - method: POST
    path: "/judicial-packages"
    description: "Prepare a DRAFT package (case_number, party_info, authority_code)."
    roles: [JudicialOfficer]
    code: 201
    input: ["evidence_id", "case_number", "party_info", "authority_code", "include_original_data?"]
    output: JudicialPackage
    side_effects: []

  - method: GET
    path: "/judicial-packages/{id}"
    description: "Read package."
    roles: [JudicialOfficer, PlatformAdmin]
    code: 200
    input: []
    output: JudicialPackage
    side_effects: []

  - method: POST
    path: "/judicial-packages/{id}/seal"
    description: "DRAFT -> SEALED; embeds official_seal_id; debits judicial_surcharge_final."
    roles: [JudicialOfficer]
    code: 200
    input: []
    output: JudicialPackage
    side_effects:
      - "Debit Customer.wallet_balance_cents by judicial_surcharge_final."
      - "Increment FeeAccount.lifetime_deduction_cents."
      - "Append AuditLog JUDICIAL_SEALED, FEE_DEBITED."

  - method: POST
    path: "/judicial-packages/{id}/deliver"
    description: "SEALED -> DELIVERED; records delivered_at."
    roles: [JudicialOfficer]
    code: 200
    input: []
    output: JudicialPackage
    side_effects: ["Append AuditLog JUDICIAL_DELIVERED."]

  # ---- Invoice ----
  - method: POST
    path: "/invoices"
    description: "Issue an invoice for SINGLE_EVIDENCE, SINGLE_BATCH, or BILLING_PERIOD."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: ["customer_id", "scope", "scope_ref_id?", "period_start?", "period_end?"]
    output: Invoice
    side_effects: ["Compute total_cents via invoice_total.", "Append AuditLog INVOICE_ISSUED."]

  - method: GET
    path: "/invoices/{id}"
    description: "Read invoice."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  # ---- Audit log read ----
  - method: GET
    path: "/audit-logs"
    description: "List audit events; filter by event_type, target_entity, target_id."
    roles: [PlatformAdmin]
    code: 200
    input: ["event_type?", "target_entity?", "target_id?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  # ---- Test-driving endpoints (clock + chain + events) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock; required for expiry sweeps and period-end checks."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: object
    side_effects: []

  - method: POST
    path: "/_chain/confirm"
    description: "Simulate chain confirmation for the latest OnChainTx of a target (evidence or batch)."
    roles: [PlatformAdmin]
    code: 200
    input: [tx_id, block_height, confirmations]
    output: OnChainTx
    side_effects:
      - "Cascade to Evidence.SUBMITTING_to_CONFIRMED or Batch.SUBMITTING_to_CONFIRMED."

  - method: POST
    path: "/_chain/fail"
    description: "Simulate chain failure for the latest OnChainTx of a target."
    roles: [PlatformAdmin]
    code: 200
    input: [tx_id, reason]
    output: OnChainTx
    side_effects:
      - "Cascade to Evidence.SUBMITTING_to_FAILED or Batch.SUBMITTING_to_FAILED."

  - method: POST
    path: "/_sweep/run"
    description: "Run the expiry sweep; flips CONFIRMED evidences past expires_at to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects:
      - "Cascade Certificate revocation and DRAFT JudicialPackage rejection per state machine."

  - method: POST
    path: "/_events/payment"
    description: "Deliver an external payment event for a Recharge (status SUCCESS|FAILURE)."
    roles: [PlatformAdmin]
    code: 200
    input: [external_payment_ref, status]
    output: Recharge
    side_effects:
      - "On SUCCESS: credit Customer.wallet_balance_cents and increment FeeAccount.lifetime_recharge_cents."

  - method: POST
    path: "/_events/judicial-ack"
    description: "Deliver judicial-authority delivery acknowledgement."
    roles: [PlatformAdmin]
    code: 200
    input: [judicial_package_id]
    output: JudicialPackage
    side_effects:
      - "Drives SEALED -> DELIVERED on the named JudicialPackage."

  - method: POST
    path: "/_events/notary-callback"
    description: "Deliver a notary-office attachment callback completing a TimestampNotarization."
    roles: [PlatformAdmin]
    code: 200
    input: [timestamp_notarization_id, trusted_time, tsa_token]
    output: TimestampNotarization
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header."
  - id: ERR_PERMISSION_DENIED
    http: 403
    condition: "Caller's role is not in the endpoint's authorized_roles."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource (Evidence, Batch, Certificate, etc.) does not exist."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Customer.id referenced in a body does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Operation is incompatible with the target entity's current state."
  - id: ERR_EVIDENCE_NOT_CONFIRMED
    http: 409
    condition: "Operation requires the linked Evidence to be in CONFIRMED state."
  - id: ERR_HASH_FORMAT_INVALID
    http: 422
    condition: "file_hash is not a 64-character hex digest matching hash_algorithm."
  - id: ERR_BATCH_MEMBER_INVALID
    http: 422
    condition: "Batch member evidence belongs to another customer or is not PENDING with batch_id NULL."
  - id: ERR_BATCH_SIZE_OUT_OF_RANGE
    http: 422
    condition: "Batch evidence_count is outside [2, 1000]."
  - id: ERR_PERIOD_INVALID
    http: 422
    condition: "storage_period_days is not in {30,90,365,1095}, or invoice period_start/period_end are inconsistent."
  - id: ERR_RESUBMIT_LIMIT_EXCEEDED
    http: 409
    condition: "Evidence.submission_attempts is already 3 and resubmit was requested."
  - id: ERR_TIMESTAMP_REQUIRED
    http: 409
    condition: "Chain confirmation observed but the Evidence has no TimestampNotarization."
  - id: ERR_CERTIFICATE_REQUIRED
    http: 409
    condition: "Judicial sealing requires an ISSUED Certificate; missing or REVOKED."
  - id: ERR_EVIDENCE_EXPIRED
    http: 410
    condition: "Certificate download or judicial-package creation attempted after Evidence.expires_at. (Verification itself is allowed and returns VerificationReport.outcome == 'EXPIRED'.)"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 402
    condition: "Customer.wallet_balance_cents < required quote for the operation."
  - id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http: 409
    condition: "Evidence submission reused an existing (customer_id, idempotency_key) pair."
  - id: ERR_DUPLICATE_PAYMENT_REF
    http: 409
    condition: "Recharge.external_payment_ref is already in use."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version does not match the current stored version."
  - id: ERR_INVOICE_SCOPE_INVALID
    http: 422
    condition: "Invoice scope references an entity that has not been billed (e.g., non-CONFIRMED Evidence)."
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Generic body-shape or required-field failure not matched by a more specific error (missing field, wrong type, malformed UUID, etc.)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End-user submitting evidence, paying fees, viewing certificates."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /evidences"
      - "POST /evidences/{id}/submit"
      - "POST /evidences/{id}/resubmit"
      - "POST /batches"
      - "POST /batches/{id}/submit"
      - "POST /recharges"
    shared_operations:
      - "POST /timestamp-notarizations (with NotaryOfficer)"
      - "POST /certificates (with PlatformAdmin)"
      - "POST /verifications (with JudicialOfficer, PlatformAdmin)"
      - "POST /invoices (with PlatformAdmin)"
      - "GET resources owned by this Customer.id"

  - name: NotaryOfficer
    description: "Notary office staff: attaches notarized timestamps on behalf of customers."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /timestamp-notarizations (with Customer)"
      - "GET /timestamp-notarizations/{id}"

  - name: JudicialOfficer
    description: "Judicial authority operator: prepares, seals, and delivers judicial packages."
    identity: "opaque"
    exclusive_operations:
      - "POST /judicial-packages"
      - "POST /judicial-packages/{id}/seal"
      - "POST /judicial-packages/{id}/deliver"
    shared_operations:
      - "GET /evidences/{id}"
      - "GET /certificates/{id}"
      - "POST /verifications"
      - "GET /batches/{id}/proof/{evidence_id}"

  - name: PlatformAdmin
    description: "Operator role for the platform — bootstraps customers, runs sweeps, simulates chain/event callbacks, lists audit logs."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /certificates/{id}/revoke"
      - "GET /audit-logs"
      - "POST /_clock/advance"
      - "POST /_chain/confirm"
      - "POST /_chain/fail"
      - "POST /_sweep/run"
      - "POST /_events/payment"
      - "POST /_events/judicial-ack"
      - "POST /_events/notary-callback"
    shared_operations:
      - "POST /certificates"
      - "POST /verifications"
      - "POST /invoices"
      - "GET on any resource"
