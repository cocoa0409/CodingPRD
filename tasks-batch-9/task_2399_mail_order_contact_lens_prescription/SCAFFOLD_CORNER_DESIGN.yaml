              captures: { cust_id: "$.data.id" }
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", prescriber_id: "${presc_id}", capture_mode: "DOCTOR_LOOKUP", issue_date: "2026-07-01", expiry_date: "2027-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: "$.data.id" }
            - call: POST /prescriptions/${rx_id}/submit
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: POST /prescriptions/${rx_id}/verification-requests
              payload: { prescriber_id: "${presc_id}" }
              as: ComplianceOfficer
              as_user_id: co-alpha
              captures: { vr_id: "$.data.id" }
            - call: POST /orders
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", ordered_product_id: "${p1_id}", boxes_od: 1, boxes_os: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order1_id: "$.data.id" }
            - call: POST /orders
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", ordered_product_id: "${p1_id}", boxes_od: 2, boxes_os: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order2_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-09-08T12:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
          trigger:
            - call: POST /verification-requests/${vr_id}/respond
              payload: { response_type: "CONFIRMED" }
              as: Prescriber
              as_user_id: "${presc_id}"
          assert:
            - "Both orders were created with verification_state RX_PENDING because the prescription was still PENDING_VERIFICATION."
            - "Response status is 200, data.status is CONFIRMED and data.response_type is CONFIRMED."
            - "GET /prescriptions/${rx_id} as ComplianceOfficer co-alpha reports status VERIFIED_ACTIVE and boxes_consumed 5."
            - "GET /orders with prescription_id=${rx_id} and verification_state=RX_CLEARED as FulfillmentOperator fo-one returns total_count 2, and the RX_PENDING filter returns total_count 0."
            - "POST /compliance/verification-sweep as ComplianceOfficer co-alpha immediately afterwards returns promoted_prescription_ids empty and timed_out_request_ids empty."
