              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-5030-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
