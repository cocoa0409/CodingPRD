            - "both rejected attempts leave their referrals TRIAGED with unchanged versions, and ProcedureRoom.${room_id}.recovery_bay_count remains 1"

  - rule_id: compensating_invariant
    instances:
      - name: device_unit_conservation_survives_one_consumption_and_one_release
        grounds:
          - entities.DeviceLot.fields.received_quantity
          - state_machines.DeviceUsage.RESERVED_to_CONSUMED
          - state_machines.DeviceUsage.RESERVED_to_RELEASED
          - endpoints.POST_procedures_id_cancel
        distinguishing_aspect: |
          The lot has two counters that decrement asymmetrically and one anchor that never moves:
          a consumption decrements BOTH quantity_on_hand and quantity_reserved, while a release
          decrements ONLY quantity_reserved. The invariant
          quantity_on_hand + SUM(CONSUMED quantities) == received_quantity must therefore hold after
          a mixed sequence of one discharge and one cancellation, and quantity_reserved must land
          exactly on 0 without ever going negative. The natural wrong implementation - treating a
          release as the mirror image of a consumption and adding the units back to
          quantity_on_hand - yields 11 on hand against a received_quantity of 10, which is
          arithmetically impossible for a physical shelf.
        test_recipe:
          setup:
            - "one BALLOON lot L-2026-G with received_quantity 10, expires_on 2027-06-30"
            - "two ANGIOPLASTY procedures on the same IN_USE access: proc1 13:00-14:00 and proc2 15:00-16:00, both MODERATE"
            - "proc1 reserves 3 units, proc2 reserves 4 units, so the lot sits at on_hand 10 / reserved 7"
            - "proc1 driven to RECOVERY with two qualifying observations"
