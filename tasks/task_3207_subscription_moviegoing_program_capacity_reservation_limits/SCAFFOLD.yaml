# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity-backed identity mismatch (member acting on another member's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced entity does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum violation, unknown payload key not declared in the endpoint's input schema, or out-of-range scalar (e.g. pause_days outside 7..30)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition (terminal lockdown included)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Member.status == SUSPENDED blocks reservation creation and concession purchase" }
  - { id: ERR_REJOIN_LOCKED, http: 409, condition: "Enrollment attempted before the greatest rejoin_locked_until among the member's CANCELLED subscriptions has elapsed" }
  - { id: ERR_PLAN_NOT_ENROLLABLE, http: 422, condition: "Plan is DRAFT or RETIRED at enrollment time" }
  - { id: ERR_PAUSE_LIMIT_REACHED, http: 422, condition: "Second pause within the same billing cycle, or pause_days outside 7..30" }
  - { id: ERR_WEEKLY_QUOTA_EXHAUSTED, http: 422, condition: "Current week bucket has credits_available == 0 (posture EXHAUSTED) or is EXPIRED" }
  - { id: ERR_FUTURE_RESERVATION_LIMIT, http: 422, condition: "future_reservation_count would reach the effective cap (halved at 2 active strikes)" }
  - { id: ERR_PREMIUM_NOT_INCLUDED, http: 422, condition: "Plan does not include premium formats and showtime.format != STANDARD" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "No seats available, or opening-weekend displacement cap would be exceeded" }
  - { id: ERR_SHOWTIME_LOCKED, http: 409, condition: "Showtime is LOCKED/COMPLETED/CANCELLED for new reservations" }
  - { id: ERR_CANCEL_WINDOW_CLOSED, http: 409, condition: "Member-initiated cancel at or after cancel_deadline" }
  - { id: ERR_CHECKIN_WINDOW, http: 409, condition: "Check-in outside [starts_at-45m, starts_at+30m]" }
  - { id: ERR_FORMAT_UNSUPPORTED, http: 422, condition: "Showtime format not in auditorium.supported_formats" }
  - { id: ERR_LINE_NOT_SETTLEABLE, http: 422, condition: "Reservation not in CHECKED_IN/NO_SHOW, already settlement_reported, wrong theater/studio, or outside the report period" }
  - { id: ERR_EMPTY_REPORT, http: 422, condition: "Submit attempted on a report with zero lines" }
  - { id: ERR_DUPLICATE_LINE, http: 422, condition: "Same reservation added twice to one report" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Platform operator; manages plans, theaters, auditoriums, showtimes, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /cinemas/_clock/set_current_utc"
      - "POST /cinemas/subscription-plans and plan publish/retire"
      - "POST /cinemas/theaters and auditoriums"
      - "POST /cinemas/showtimes, open_sales, cancel"
    shared_operations:
      - "Read members, subscriptions, buckets, showtimes, settlement reports"
  - name: MemberServices
    description: "Customer-service operator; manages member lifecycle and goodwill strike reversals"
    identity: "opaque"
    exclusive_operations:
      - "POST /cinemas/members (register), activate, unsuspend, close"
      - "POST /cinemas/members/{id}/loyalty-adjustments"
      - "POST /cinemas/strikes/{id}/reverse"
      - "POST /cinemas/members/{id}/subscriptions (agent-assisted enrollment)"
    shared_operations:
      - "Read members, subscriptions, reservations, plans, ledgers"
  - name: Member
    description: "Subscribing moviegoer; acts only on own resources"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /cinemas/reservations (create), confirm, cancel"
      - "POST /cinemas/subscriptions/{id}/pause, resume, cancel (own subscription)"
    shared_operations:
      - "POST /cinemas/members/{id}/subscriptions (self-enrollment)"
      - "POST /cinemas/subscriptions/{id}/change-plan (own)"
      - "POST /cinemas/concession-purchases (as purchaser)"
      - "Read own member record, subscriptions, buckets, reservations, ledger, showtimes"
  - name: TheaterStaff
    description: "Theater operations; check-ins, concession ringing, settlement reporting"
    identity: "opaque"
    exclusive_operations:
      - "POST /cinemas/reservations/{id}/check_in"
      - "Settlement report create/lines/submit/revise"
    shared_operations:
      - "POST /cinemas/concession-purchases (ringing up a member)"
      - "Read showtimes, reservations, theaters"
  - name: StudioRep
    description: "Studio settlement counterparty; acknowledges or disputes submitted reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /cinemas/settlement-reports/{id}/acknowledge"
      - "POST /cinemas/settlement-reports/{id}/dispute"
    shared_operations:
      - "Read settlement reports and lines, theaters, showtimes"
