# =============================================================================
# Veterinary Clinic Practice Management — PRD Benchmark Seed Tables (SCAFFOLD)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  243. Veterinary Clinic Practice Management: patient/owner record, appointment & wellness plan,
  vaccination/reminder schedule, surgery & boarding, prescription/Rx refill, multi-pet household,
  deposit/estimate, dental & lab orders

domain_name: veterinary-clinic-practice-management
api_prefix: /clinic

# -----------------------------------------------------------------------------
# Complexity profile (Expert band, §0.4). Depth — not breadth — is the difficulty
# driver here: 7 calculations (two dual-variant pairs across distinct domains,
# weight-band tiered surgery pricing, per-line-item rounding order), 5 state
# machines (two cyclic: Appointment reschedule loop + Estimate revision loop),
# 3-hop and 2-hop transitive cascades, two resource-overlap geometries
# (operatory half-open+buffer vs kennel aggregate-capacity), OCC on Household.
# Flat topology: every entity is a peer collection mounted under /clinic with FK
# references carried in the request body and a filtered-list GET per FK; the
# endpoint count is the honest cost of flat CRUD across 14 load-bearing entities.
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat            # peer collections under /clinic; FK references in body, filtered-list GETs
  state_machine_shape: cyclic      # Estimate and Appointment carry revision loops
  relationship_patterns:
    - one_to_many                  # Household -> Owners/Patients/Invoices; Patient -> Appointments/etc.
    - cross_aggregate              # Surgery/Boarding occupy shared Operatory/Kennel resources
  role_model: peer_roles           # Receptionist / Veterinarian / PracticeManager own different surfaces
  consistency_model: immediate

  entity_count: 14
  state_machine_count: 7
  calculation_count: 7
  validation_layers: 14
  endpoint_count: 51
  error_code_count: 36
  role_count: 3

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Household: the multi-pet billing account; OCC parent for credit/invoice ops ---
  - name: Household
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: account_name, type: string, source: input, description: "Household display name (e.g., 'The Rivera Family')." }
      - { name: account_credit_cents, type: integer, source: computed, default: 0, description: "Refundable monetary credit held on account, in integer cents; never negative. Mutated only by deposit posting, deposit refund, and invoice settlement. CONSERVED quantity for Rule 9 invariant deposit_refund_conserves_credit." }
      - { name: lifetime_invoiced_cents, type: integer, source: computed, default: 0, description: "Running sum of finalized Invoice.actual_total_cents for this household; monotonically non-decreasing." }
      - { name: status, type: enum, source: system, description: "ACTIVE — the only reachable value in this version (households are not closed). Set ACTIVE on create.", constraints: "enum: ACTIVE" }

  # --- Owner: a human client in the household ---
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the household this owner belongs to." }
      - { name: full_name, type: string, source: input, description: "Owner full name." }
      - { name: email, type: string, source: input, description: "Owner contact email; must be unique across all Owners (ERR_OWNER_EMAIL_TAKEN)." }
      - { name: is_primary, type: boolean, source: input, default: false, description: "Whether this owner is the primary billing contact for the household." }

  # --- Patient: the pet ---
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the household that owns this pet." }
      - { name: name, type: string, source: input, description: "Pet name." }
      - { name: species, type: enum, source: input, description: "Species governing vaccine schedule.", constraints: "enum: DOG, CAT, RABBIT, FERRET" }
      - { name: weight_kg, type: number, source: input, description: "Current body weight in kilograms; drives anesthesia dosing. Must be > 0." }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE | DECEASED. Set ACTIVE on create.", constraints: "enum: ACTIVE, INACTIVE, DECEASED" }

  # --- WellnessPlan: subscription giving a service discount + bundled vaccines ---
  - name: WellnessPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the pet enrolled in this plan." }
      - { name: tier, type: enum, source: input, description: "Plan tier governing discount percent and bundled-vaccine count.", constraints: "enum: BASIC, PLUS, PREMIER" }
      - { name: service_discount_pct, type: number, source: computed, description: "Discount fraction applied to eligible service line items: BASIC=0.10, PLUS=0.20, PREMIER=0.30." }
      - { name: bundled_vaccines_remaining, type: integer, source: computed, description: "Count of fee-waived vaccinations still available this plan year: BASIC=2, PLUS=4, PREMIER=8 at enrollment; decremented when a bundled vaccine is administered." }
      - { name: realized_savings_cents, type: integer, source: computed, default: 0, description: "Chronological running sum of discount cents actually applied on settled appointments under this plan; see calc wellness_realized_savings." }
      - { name: status, type: enum, source: system, description: "ACTIVE — the only reachable value in this version (plans are not cancelled). Set ACTIVE on create.", constraints: "enum: ACTIVE" }

  # --- Appointment: a clinical visit; cyclic state machine (reschedule loop) ---
  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the pet seen at this visit." }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC visit start." }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC visit end; must be strictly after scheduled_start (ERR_INVALID_TIME_RANGE)." }
      - { name: visit_reason, type: string, source: input, description: "Free-text reason for visit." }
      - { name: reschedule_count, type: integer, source: computed, default: 0, description: "Number of times this appointment has cycled IN_EXAM->SCHEDULED; capped at 3 (ERR_RESCHEDULE_LIMIT)." }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | IN_EXAM | COMPLETED | CANCELLED | NO_SHOW. Set SCHEDULED on create.", constraints: "enum: SCHEDULED, CHECKED_IN, IN_EXAM, COMPLETED, CANCELLED, NO_SHOW" }

  # --- Vaccination: a vaccine dose with interval rule + reminder schedule ---
  - name: Vaccination
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the vaccinated pet." }
      - { name: vaccine_code, type: enum, source: input, description: "Vaccine type, each with a minimum re-dose interval in days.", constraints: "enum: RABIES, DHPP, BORDETELLA, FVRCP" }
      - { name: administered_at, type: datetime, source: input, description: "ISO 8601 UTC time of administration; must be <= clock now (ERR_FUTURE_ADMINISTRATION)." }
      - { name: bundled, type: boolean, source: input, default: false, description: "Whether this dose draws from the patient's WellnessPlan bundle (fee waived)." }
      - { name: fee_cents, type: integer, source: computed, description: "Charged fee in cents: 0 when bundled AND the patient's ACTIVE WellnessPlan had bundled_vaccines_remaining > 0; otherwise the flat base fee STANDARD_VACCINE_FEE_CENTS (4500), identical for every vaccine_code." }
      - { name: next_due_at, type: datetime, source: computed, description: "administered_at + MIN_INTERVAL_DAYS[vaccine_code] (calc vaccine_next_due)." }
      - { name: reminder_at, type: datetime, source: computed, description: "next_due_at - REMINDER_LEAD_DAYS (14 days); the date a reminder becomes due." }

  # --- Prescription: an Rx with refills; controlled substances have a refill cooldown ---
  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the pet this Rx is for." }
      - { name: drug_name, type: string, source: input, description: "Prescribed drug." }
      - { name: is_controlled, type: boolean, source: input, default: false, description: "Whether the drug is a controlled substance subject to a 30-day refill cooldown." }
      - { name: refills_authorized, type: integer, source: input, description: "Total refills the prescriber authorized; must be >= 0. CONSERVED budget for Rule 9 invariant refill_void_conserves_count." }
      - { name: refills_used, type: integer, source: computed, default: 0, description: "Refills dispensed so far; refills_remaining = refills_authorized - refills_used; never below 0 or above refills_authorized." }
      - { name: last_refill_at, type: datetime, source: computed, description: "Clock time of the most recent dispense; null until first refill." }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | VOIDED. Set ACTIVE on create.", constraints: "enum: ACTIVE, EXHAUSTED, VOIDED" }

  # --- Estimate: a treatment estimate with line items and an optional deposit; cyclic SM ---
  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the pet this estimate is for." }
      - { name: line_items, type: array, source: input, description: "Array of {service_code, qty, unit_price_cents, eligible_for_plan_discount}; qty>=1, unit_price_cents>=0." }
      - { name: deposit_required_cents, type: integer, source: input, default: 0, description: "Deposit the household must post before the estimate may be approved; >= 0." }
      - { name: deposit_posted_cents, type: integer, source: computed, default: 0, description: "Deposit actually posted against this estimate; set when a deposit is paid." }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Forward-looking projected total over all line items with plan discount; see calc estimate_projected_total (round-per-line-item-then-sum)." }
      - { name: revision, type: integer, source: computed, default: 1, description: "Increments each time a DECLINED estimate is revised back to DRAFT." }
      - { name: status, type: enum, source: system, description: "DRAFT | PRESENTED | APPROVED | DECLINED | EXPIRED. Set DRAFT on create.", constraints: "enum: DRAFT, PRESENTED, APPROVED, DECLINED, EXPIRED" }

  # --- Surgery: a surgical procedure booked into an Operatory; consumes estimate deposit ---
  - name: Surgery
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the visit this surgery belongs to." }
      - { name: operatory_id, type: string, source: input, description: "FK -> Operatory.id; the surgical suite booked." }
      - { name: estimate_id, type: string, source: input, description: "FK -> Estimate.id; the approved estimate funding this surgery (deposit source)." }
      - { name: procedure_name, type: string, source: input, description: "Surgical procedure name." }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC booking start (half-open interval start)." }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC booking end; strictly after window_start (ERR_INVALID_TIME_RANGE)." }
      - { name: surgery_total_cents, type: integer, source: computed, description: "Tiered surgical charge; see calc surgery_total (>=3 inputs, weight-band tiered)." }
      - { name: deposit_consumed_cents, type: integer, source: computed, default: 0, description: "Deposit committed from the funding Estimate to this surgery at BOOKING time (min of estimate deposit_posted and surgery_total); debits Household.account_credit at booking, refunded back to account_credit on cancel, settled permanently on complete." }
      - { name: status, type: enum, source: system, description: "BOOKED | IN_PROGRESS | DONE | CANCELLED. Set BOOKED on create.", constraints: "enum: BOOKED, IN_PROGRESS, DONE, CANCELLED" }

  # --- BoardingStay: a boarding interval occupying a Kennel (aggregate capacity) ---
  - name: BoardingStay
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the boarded pet." }
      - { name: kennel_id, type: string, source: input, description: "FK -> Kennel.id; the kennel block occupied." }
      - { name: check_in_date, type: datetime, source: input, description: "ISO 8601 UTC date of arrival (inclusive day)." }
      - { name: check_out_date, type: datetime, source: input, description: "ISO 8601 UTC date of departure (inclusive day); must be >= check_in_date (ERR_INVALID_TIME_RANGE)." }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Per-night board rate in cents; >= 0." }
      - { name: board_total_cents, type: integer, source: computed, description: "nightly_rate_cents * number_of_nights, where nights = inclusive-day span; see calc boarding_total." }
      - { name: status, type: enum, source: system, description: "RESERVED | CHECKED_IN | CHECKED_OUT | CANCELLED. Set RESERVED on create.", constraints: "enum: RESERVED, CHECKED_IN, CHECKED_OUT, CANCELLED" }

  # --- LabOrder: a lab or dental diagnostic order on an appointment ---
  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the visit this order belongs to." }
      - { name: order_type, type: enum, source: input, description: "Diagnostic category.", constraints: "enum: BLOODWORK, URINALYSIS, DENTAL_XRAY, CYTOLOGY, BIOPSY" }
      - { name: fee_cents, type: integer, source: input, description: "Order fee in cents; >= 0." }
      - { name: result_text, type: string, source: input, default: null, description: "Result, set when the order is resulted." }
      - { name: status, type: enum, source: system, description: "ORDERED | COLLECTED | RESULTED | CANCELLED. Set ORDERED on create.", constraints: "enum: ORDERED, COLLECTED, RESULTED, CANCELLED" }

  # --- Invoice: the finalized household bill; dual-variant estimate vs actual ---
  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the billed household." }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the completed appointment whose rendered services are billed." }
      - { name: estimate_id, type: string, source: input, default: null, description: "FK -> Estimate.id; the approved estimate this invoice reconciles against (optional)." }
      - { name: estimate_total_cents, type: integer, source: computed, default: 0, description: "Forward-looking copy of the linked Estimate.estimated_total_cents at finalize time (0 if no estimate)." }
      - { name: actual_total_cents, type: integer, source: computed, description: "Chronological sum of actually-rendered charges (vaccinations, lab orders, surgery) on the appointment, minus credit applied; see calc invoice_actual_total." }
      - { name: variance_cents, type: integer, source: computed, description: "actual_total_cents - estimate_total_cents (may be negative)." }
      - { name: status, type: enum, source: system, description: "FINALIZED — an invoice is created already finalized (immutable billing record). Set FINALIZED on create.", constraints: "enum: FINALIZED" }

  # --- Operatory: a surgical suite resource (configuration); half-open + buffer overlap ---
  - name: Operatory
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: name, type: string, source: input, description: "Operatory display name." }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory cleanup buffer enforced AFTER each surgery window before the suite is free again; >= 0." }
      - { name: booked_minutes, type: integer, source: computed, default: 0, description: "Sum of (window_end - window_start) in minutes over BOOKED/IN_PROGRESS/DONE surgeries in this suite; CONSERVED quantity for Rule 9 invariant surgery_cancel_conserves_operatory_minutes." }
      - { name: status, type: enum, source: system, description: "OPEN — the only reachable value in this version (resources are not closed). Set OPEN on create.", constraints: "enum: OPEN" }

  # --- Kennel: a boarding kennel resource (configuration); aggregate-capacity overlap ---
  - name: Kennel
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: name, type: string, source: input, description: "Kennel block display name." }
      - { name: capacity, type: integer, source: input, description: "Maximum number of overlapping stays the kennel may hold on any single shared day; >= 1." }
      - { name: status, type: enum, source: system, description: "OPEN — the only reachable value in this version (resources are not closed). Set OPEN on create.", constraints: "enum: OPEN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Patient: ACTIVE -> INACTIVE/DECEASED; DECEASED cascades (Rule 4 cascade B) ---
  - entity: Patient
    field: status
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /clinic/patients/{pid}/deactivate"
        actor: Receptionist
        preconditions:
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE)."
          - "No Appointment for this patient in status SCHEDULED, CHECKED_IN, or IN_EXAM (ERR_PATIENT_HAS_OPEN_VISITS)."
        side_effects:
          - "Patient.status -> INACTIVE."

      - from: ACTIVE
        to: DECEASED
        trigger: "POST /clinic/patients/{pid}/mark-deceased"
        actor: Veterinarian
        preconditions:
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE)."
        side_effects:
          - "Patient.status -> DECEASED."
          - "CASCADE (Rule 4 B, hop 1): every Prescription for this patient with status ACTIVE -> VOIDED."
          - "CASCADE (Rule 4 B, hop 2): each just-VOIDED controlled Prescription restores its refills_remaining to refills_authorized (refills_used -> 0), conserving the authorized-refill count per Rule 9 refill_void_conserves_count."
          - "CASCADE (Rule 4 B, hop 1, parallel target): every BoardingStay for this patient with status RESERVED or CHECKED_IN -> CANCELLED; each cancellation decrements its Kennel occupancy for the stay's days."

  # --- Appointment: cyclic (IN_EXAM -> SCHEDULED reschedule loop) (Rule 3 instance A) ---
  - entity: Appointment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /clinic/appointments/{aid}/transition (action=check-in)"
        actor: Receptionist
        preconditions:
          - "Appointment.status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)."
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE) — cross-entity dependency Appointment->Patient."
        side_effects:
          - "Appointment.status -> CHECKED_IN."

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /clinic/appointments/{aid}/transition (action=no-show)"
        actor: Receptionist
        preconditions:
          - "Appointment.status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)."
          - "Clock now >= scheduled_end (ERR_APPOINTMENT_INVALID_STATE — too early for no-show)."
        side_effects:
          - "Appointment.status -> NO_SHOW."

      - from: CHECKED_IN
        to: IN_EXAM
        trigger: "POST /clinic/appointments/{aid}/transition (action=begin-exam)"
        actor: Veterinarian
        preconditions:
          - "Appointment.status == CHECKED_IN (ERR_APPOINTMENT_INVALID_STATE)."
        side_effects:
          - "Appointment.status -> IN_EXAM."

      - from: IN_EXAM
        to: SCHEDULED
        trigger: "POST /clinic/appointments/{aid}/transition (action=reschedule)"
        actor: Veterinarian
        preconditions:
          - "Appointment.status == IN_EXAM (ERR_APPOINTMENT_INVALID_STATE)."
          - "reschedule_count < 3 (ERR_APPOINTMENT_INVALID_STATE — reschedule limit)."
          - "No Surgery on this appointment in status BOOKED or IN_PROGRESS (ERR_APPOINTMENT_INVALID_STATE — surgery blocks reschedule)."
        side_effects:
          - "Appointment.status -> SCHEDULED (cycle back)."
          - "reschedule_count += 1."
          - "scheduled_start/scheduled_end replaced by the new window in the request body."

      - from: IN_EXAM
        to: COMPLETED
        trigger: "POST /clinic/appointments/{aid}/transition (action=complete)"
        actor: Veterinarian
        preconditions:
          - "Appointment.status == IN_EXAM (ERR_APPOINTMENT_INVALID_STATE)."
          - "No LabOrder on this appointment in status ORDERED or COLLECTED (ERR_APPOINTMENT_INVALID_STATE — open lab orders)."
          - "No Surgery on this appointment in status BOOKED or IN_PROGRESS (ERR_APPOINTMENT_INVALID_STATE — open surgery)."
        side_effects:
          - "Appointment.status -> COMPLETED."

      - from: [SCHEDULED, CHECKED_IN, IN_EXAM]
        to: CANCELLED
        trigger: "POST /clinic/appointments/{aid}/transition (action=cancel)"
        actor: Receptionist
        preconditions:
          - "Appointment.status IN {SCHEDULED, CHECKED_IN, IN_EXAM} (ERR_APPOINTMENT_INVALID_STATE)."
        side_effects:
          - "Appointment.status -> CANCELLED."
          - "CASCADE (Rule 4 A, hop 1): every Surgery on this appointment in status BOOKED or IN_PROGRESS -> CANCELLED."
          - "CASCADE (Rule 4 A, hop 2): each cancelled Surgery releases its Operatory booking — Operatory.booked_minutes decremented by the surgery window minutes (conserves operatory minutes, Rule 9)."
          - "CASCADE (Rule 4 A, hop 3): each cancelled Surgery refunds deposit_consumed_cents back to the funding Estimate's Household.account_credit_cents and bumps that Household.version by 1 (conserves credit, Rule 9 deposit_refund_conserves_credit)."
          - "CASCADE (Rule 4 A, hop 1, parallel target): every LabOrder on this appointment in status ORDERED or COLLECTED -> CANCELLED."

  # --- Estimate: cyclic (DECLINED -> DRAFT revision loop) (Rule 3 instance B) ---
  - entity: Estimate
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /clinic/estimates/{eid}/transition (action=present)"
        actor: Veterinarian
        preconditions:
          - "Estimate.status == DRAFT (ERR_ESTIMATE_INVALID_STATE)."
          - "Estimate has at least one line item (ERR_ESTIMATE_INVALID_STATE — empty estimate)."
        side_effects:
          - "Estimate.status -> PRESENTED."
          - "estimated_total_cents recomputed via calc estimate_projected_total."

      - from: PRESENTED
        to: DECLINED
        trigger: "POST /clinic/estimates/{eid}/transition (action=decline)"
        actor: Receptionist
        preconditions:
          - "Estimate.status == PRESENTED (ERR_ESTIMATE_INVALID_STATE)."
        side_effects:
          - "Estimate.status -> DECLINED."

      - from: DECLINED
        to: DRAFT
        trigger: "POST /clinic/estimates/{eid}/transition (action=revise)"
        actor: Veterinarian
        preconditions:
          - "Estimate.status == DECLINED (ERR_ESTIMATE_INVALID_STATE)."
        side_effects:
          - "Estimate.status -> DRAFT (cycle back)."
          - "revision += 1."
          - "line_items replaced by the request body's line_items."

      - from: PRESENTED
        to: APPROVED
        trigger: "POST /clinic/estimates/{eid}/transition (action=approve)"
        actor: Receptionist
        preconditions:
          - "Estimate.status == PRESENTED (ERR_ESTIMATE_INVALID_STATE)."
          - "deposit_posted_cents >= deposit_required_cents (ERR_DEPOSIT_NOT_MET)."
        side_effects:
          - "Estimate.status -> APPROVED."

      - from: [DRAFT, PRESENTED]
        to: EXPIRED
        trigger: "POST /clinic/estimates/{eid}/transition (action=expire)"
        actor: PracticeManager
        preconditions:
          - "Estimate.status IN {DRAFT, PRESENTED} (ERR_ESTIMATE_INVALID_STATE)."
        side_effects:
          - "Estimate.status -> EXPIRED."
          - "If deposit_posted_cents > 0: refund deposit_posted_cents to the patient's Household.account_credit_cents and bump that Household.version by 1."

  # --- Surgery: BOOKED -> IN_PROGRESS -> DONE; cancel anywhere pre-DONE (Rule 4 A targets) ---
  - entity: Surgery
    field: status
    initial_state: BOOKED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: BOOKED
        to: IN_PROGRESS
        trigger: "POST /clinic/surgeries/{sid}/transition (action=start)"
        actor: Veterinarian
        preconditions:
          - "Surgery.status == BOOKED (ERR_SURGERY_INVALID_STATE)."
          - "Parent Appointment.status == IN_EXAM (ERR_APPOINTMENT_NOT_IN_EXAM) — cross-entity dependency Surgery->Appointment."
        side_effects:
          - "Surgery.status -> IN_PROGRESS."

      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /clinic/surgeries/{sid}/transition (action=complete)"
        actor: Veterinarian
        preconditions:
          - "Surgery.status == IN_PROGRESS (ERR_SURGERY_INVALID_STATE)."
        side_effects:
          - "Surgery.status -> DONE."
          - "deposit_consumed_cents (committed at booking) is now permanently settled toward this surgery; account_credit_cents is unchanged (it was already debited at booking)."

      - from: [BOOKED, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /clinic/surgeries/{sid}/transition (action=cancel)"
        actor: Veterinarian
        preconditions:
          - "Surgery.status IN {BOOKED, IN_PROGRESS} (ERR_SURGERY_INVALID_STATE)."
        side_effects:
          - "Surgery.status -> CANCELLED."
          - "Operatory.booked_minutes decremented by this surgery's window minutes (Rule 9 surgery_cancel_conserves_operatory_minutes)."
          - "deposit_consumed_cents (if > 0) refunded to the funding Estimate's Household.account_credit_cents AND added back to that Estimate.deposit_posted_cents; that Household.version bumped by 1; then deposit_consumed_cents reset to 0 (Rule 9 deposit_refund_conserves_credit)."

  # --- BoardingStay: RESERVED -> CHECKED_IN -> CHECKED_OUT; cancel pre-checkout ---
  - entity: BoardingStay
    field: status
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /clinic/boarding-stays/{bid}/transition (action=check-in)"
        actor: Receptionist
        preconditions:
          - "BoardingStay.status == RESERVED (ERR_BOARDING_INVALID_STATE)."
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE)."
        side_effects:
          - "BoardingStay.status -> CHECKED_IN."

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /clinic/boarding-stays/{bid}/transition (action=check-out)"
        actor: Receptionist
        preconditions:
          - "BoardingStay.status == CHECKED_IN (ERR_BOARDING_INVALID_STATE)."
        side_effects:
          - "BoardingStay.status -> CHECKED_OUT."
          - "board_total_cents finalized via calc boarding_total; Kennel occupancy retained for those days (a checked-out stay still counts as having occupied the days)."

      - from: [RESERVED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /clinic/boarding-stays/{bid}/transition (action=cancel)"
        actor: Receptionist
        preconditions:
          - "BoardingStay.status IN {RESERVED, CHECKED_IN} (ERR_BOARDING_INVALID_STATE)."
        side_effects:
          - "BoardingStay.status -> CANCELLED."
          - "Kennel occupancy for this stay's days decremented (frees aggregate capacity)."

  # --- Prescription: ACTIVE -> EXHAUSTED (auto on last refill) or VOIDED (cascade) ---
  - entity: Prescription
    field: status
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, VOIDED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /clinic/prescriptions/{rxid}/refill"
        actor: Veterinarian
        preconditions:
          - "Prescription.status == ACTIVE (ERR_PRESCRIPTION_NOT_ACTIVE)."
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE) — cross-entity dependency Prescription->Patient."
          - "If is_controlled: clock now - last_refill_at >= 30 days (ERR_CONTROLLED_COOLDOWN)."
          - "refills_remaining (refills_authorized - refills_used) > 0 (ERR_NO_REFILLS_REMAINING)."
        side_effects:
          - "refills_used += 1; last_refill_at := clock now."
        note: "Self-loop while refills remain; auto-advances to EXHAUSTED on the dispense that drives refills_remaining to 0."

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (the refill that drives refills_remaining to 0)"
        actor: system
        preconditions:
          - "refills_remaining becomes 0 after this dispense."
        side_effects:
          - "Prescription.status -> EXHAUSTED."

      - from: ACTIVE
        to: VOIDED
        trigger: "system (parent Patient marked DECEASED — cascade Rule 4 B hop 1)"
        actor: system
        preconditions:
          - "Patient.status transitions to DECEASED."
        side_effects:
          - "Prescription.status -> VOIDED."
          - "refills_used reset to 0 (restores refills_remaining to refills_authorized; Rule 9 refill_void_conserves_count)."

  # --- LabOrder: ORDERED -> COLLECTED -> RESULTED; cancel pre-RESULTED ---
  - entity: LabOrder
    field: status
    initial_state: ORDERED
    terminal_states: [RESULTED, CANCELLED]
    transitions:
      - from: ORDERED
        to: COLLECTED
        trigger: "POST /clinic/lab-orders/{loid}/transition (action=collect)"
        actor: Veterinarian
        preconditions:
          - "LabOrder.status == ORDERED (ERR_LAB_ORDER_INVALID_STATE)."
        side_effects:
          - "LabOrder.status -> COLLECTED."

      - from: COLLECTED
        to: RESULTED
        trigger: "POST /clinic/lab-orders/{loid}/transition (action=result)"
        actor: Veterinarian
        preconditions:
          - "LabOrder.status == COLLECTED (ERR_LAB_ORDER_INVALID_STATE)."
          - "result_text present in the request body (ERR_INVALID_REQUEST)."
        side_effects:
          - "LabOrder.status -> RESULTED; result_text stored."

      - from: [ORDERED, COLLECTED]
        to: CANCELLED
        trigger: "POST /clinic/lab-orders/{loid}/transition (action=cancel), or system (parent Appointment cancelled)"
        actor: Veterinarian
        preconditions:
          - "LabOrder.status IN {ORDERED, COLLECTED} (ERR_LAB_ORDER_INVALID_STATE)."
        side_effects:
          - "LabOrder.status -> CANCELLED."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: invoice-create-stale-household
    parent_entity: Household
    write_endpoint: "POST /clinic/invoices"
    occ_field: "expected_household_version"
    description: |
      Finalizing a new Invoice for a Household whose version has advanced since the client last
      observed it is rejected. Invoice finalization legitimately applies account credit and
      advances lifetime_invoiced_cents, debiting account_credit_cents; a second finalize against
      a household view that has gone stale (because another writer just finalized an invoice, or a
      deposit/refund or surgery deposit-commit bumped the household version since the client read
      it) is rejected on the stale-version check before any credit is applied twice.
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- Rule 1 dual-variant A (billing domain): forward estimate vs chronological actual ----
  - name: estimate_projected_total
    trigger: "Estimate present/approve; recomputed on revise"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING projection: round per line item, then sum (Rule 2 mode (b): rounding order pinned).
      plan = the patient's ACTIVE WellnessPlan, if any
      total = 0
      for li in line_items:                      # processed in array order
        gross = li.unit_price_cents * li.qty
        if li.eligible_for_plan_discount AND plan is not None:
          discount = round_half_up(gross * plan.service_discount_pct)   # ROUND PER LINE ITEM
        else:
          discount = 0
        net_line = gross - discount
        total += net_line                        # SUM AFTER per-line rounding
      estimated_total_cents = total
    input_set: "All line_items on the Estimate (array order); discount only when eligible_for_plan_discount AND an ACTIVE WellnessPlan exists."
    constants: {}
    precision: "integer cents; round_half_up applied per line item BEFORE summing."
    variants:
      - name: forward_estimate
        when: "Estimate.present / approve and Invoice.estimate_total_cents copy"
        difference: "Projects ALL planned line items; plan discount applied optimistically to every eligible line regardless of what is ultimately rendered."

  - name: invoice_actual_total
    trigger: "POST /clinic/invoices (finalize)"
    algorithm: chronological
    formula: |
      # CHRONOLOGICAL actual: sum charges in the order they were actually rendered on the appointment.
      charges = []
      for v in Vaccinations on the appointment's patient with administered_at within
               [appointment.scheduled_start, finalize_time], ordered by administered_at ASC,
               then created_at ASC:
        charges.append(v.fee_cents)             # bundled doses contribute 0
      for lo in LabOrders on the appointment with status RESULTED, ordered by created_at ASC:
        charges.append(lo.fee_cents)
      for sg in Surgeries on the appointment with status DONE, ordered by created_at ASC:
        charges.append(sg.surgery_total_cents - sg.deposit_consumed_cents)  # deposit already settled
      raw_actual = sum(charges)
      credit_applied = min(raw_actual, Household.account_credit_cents)
      actual_total_cents = raw_actual - credit_applied
    input_set: "Only RESULTED lab orders and DONE surgeries and administered vaccinations count; ORDERED/CANCELLED items excluded."
    constants: {}
    precision: "integer cents; sum of already-integer charges (no intermediate rounding)."
    variants:
      - name: actual_chronological
        when: "Invoice finalize"
        difference: "Counts only services ACTUALLY rendered (RESULTED/DONE/administered), in chronological render order, net of deposit already consumed and account credit applied — diverges from forward_estimate whenever some estimated line items are not rendered or were not discount-eligible at render time."

  # ---- Rule 1 dual-variant B (loyalty/savings domain): projected vs realized wellness savings ----
  - name: wellness_projected_savings
    trigger: "GET /clinic/wellness-plans/{wpid} (savings projection field)"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING: projected annual savings if the plan's full bundle is used.
      base_vaccine_fee = STANDARD_VACCINE_FEE_CENTS
      projected_bundle_savings = bundled_vaccines_total_for_tier(tier) * base_vaccine_fee
      # plus projected service discount on a reference annual spend
      projected_service_savings = round_half_up(REFERENCE_ANNUAL_SERVICE_CENTS * service_discount_pct)
      projected_savings_cents = projected_bundle_savings + projected_service_savings
    input_set: "Plan tier and its full bundled-vaccine allotment; reference annual service spend constant (not actual usage)."
    constants:
      STANDARD_VACCINE_FEE_CENTS: 4500
      REFERENCE_ANNUAL_SERVICE_CENTS: 60000
    precision: "integer cents; round_half_up on the service-savings term."
    variants:
      - name: projected_optimistic
        when: "savings projection read"
        difference: "Assumes the full vaccine bundle and a fixed reference spend; ignores what the household actually consumed."

  - name: wellness_realized_savings
    trigger: "Appointment complete (settles plan discounts); incremented chronologically"
    algorithm: aggregation
    formula: |
      # CHRONOLOGICAL realized: only discounts actually applied to rendered, discount-eligible charges.
      # On each Appointment complete for a patient with an ACTIVE WellnessPlan:
      for each RESULTED LabOrder and DONE Surgery and administered non-bundled Vaccination
          on the appointment marked discount-eligible, in render order (created_at ASC):
        applied = round_half_up(eligible_gross * plan.service_discount_pct)
        plan.realized_savings_cents += applied
      # plus, when a bundled vaccine is administered: realized_savings_cents += STANDARD_VACCINE_FEE_CENTS
    input_set: "Only discount-eligible items actually rendered on completed appointments; bundled vaccines add the waived fee at administration time."
    constants:
      STANDARD_VACCINE_FEE_CENTS: 4500
    precision: "integer cents; round_half_up per item, accumulated."
    variants:
      - name: realized_chronological
        when: "Appointment complete and bundled-vaccine administration"
        difference: "Counts only savings the household has actually accrued; diverges from projected_optimistic by however much of the bundle/discount went unused."

  # ---- Rule 2 mode (a): >=3 inputs, weight-band tiered, min/max clamp (surgery domain) ----
  - name: surgery_total
    trigger: "Surgery create (BOOKED); fixed at booking time"
    algorithm: tiered_pricing
    formula: |
      # >= 3 inputs (procedure base, patient weight, operatory time) with non-linear tier selection.
      base = PROCEDURE_BASE_CENTS                                  # input 1
      # weight-band tiered anesthesia (input 2: patient.weight_kg)
      if weight_kg <= 5:        anesthesia = weight_kg * ANES_RATE_SMALL_CENTS
      elif weight_kg <= 25:     anesthesia = weight_kg * ANES_RATE_MEDIUM_CENTS
      else:                     anesthesia = weight_kg * ANES_RATE_LARGE_CENTS
      anesthesia = round_half_up(anesthesia)
      # operatory time surcharge (input 3: window minutes)
      minutes = (window_end - window_start) in minutes
      time_surcharge = max(0, minutes - FREE_MINUTES) * TIME_RATE_CENTS_PER_MIN
      raw = base + anesthesia + time_surcharge
      # clamp into [MIN_SURGERY_CENTS, MAX_SURGERY_CENTS]
      surgery_total_cents = min(MAX_SURGERY_CENTS, max(MIN_SURGERY_CENTS, raw))
    input_set: "Procedure base, patient.weight_kg (weight band), surgery window minutes."
    constants:
      PROCEDURE_BASE_CENTS: 20000
      ANES_RATE_SMALL_CENTS: 800
      ANES_RATE_MEDIUM_CENTS: 600
      ANES_RATE_LARGE_CENTS: 500
      FREE_MINUTES: 60
      TIME_RATE_CENTS_PER_MIN: 150
      MIN_SURGERY_CENTS: 25000
      MAX_SURGERY_CENTS: 500000
    precision: "integer cents; round_half_up on anesthesia term, then integer arithmetic, then clamp."

  # ---- Boarding total: inclusive-day night count ----
  - name: boarding_total
    trigger: "BoardingStay create and check-out"
    algorithm: aggregation
    formula: |
      # nights = number of inclusive days from check_in_date to check_out_date.
      # A same-day stay (check_in_date == check_out_date) counts as 1 night.
      nights = (date(check_out_date) - date(check_in_date)).days + 1
      board_total_cents = nightly_rate_cents * nights
    input_set: "check_in_date, check_out_date (inclusive day span), nightly_rate_cents."
    constants: {}
    precision: "integer cents."

  # ---- Vaccine next-due / reminder schedule ----
  - name: vaccine_next_due
    trigger: "Vaccination create"
    algorithm: threshold
    formula: |
      interval_days = MIN_INTERVAL_DAYS[vaccine_code]
      next_due_at = administered_at + interval_days days
      reminder_at = next_due_at - REMINDER_LEAD_DAYS days
      # Interval guard (Rule 6 boundary): a NEW dose of the same vaccine_code for the same patient
      # is REJECTED when (administered_at - prior_latest.administered_at).days < interval_days.
      # Exactly == interval_days is ALLOWED (>= passes); strictly < is rejected (ERR_VACCINE_INTERVAL).
    input_set: "Latest prior Vaccination of the same vaccine_code for the patient (by administered_at DESC, then created_at DESC)."
    constants:
      MIN_INTERVAL_DAYS_RABIES: 365
      MIN_INTERVAL_DAYS_DHPP: 21
      MIN_INTERVAL_DAYS_BORDETELLA: 180
      MIN_INTERVAL_DAYS_FVRCP: 21
      REMINDER_LEAD_DAYS: 14
      STANDARD_VACCINE_FEE_CENTS: 4500
    precision: "whole days; date arithmetic in UTC."
    note: "fee_cents = 0 when bundled and the patient's ACTIVE WellnessPlan had bundled_vaccines_remaining > 0; otherwise STANDARD_VACCINE_FEE_CENTS (4500), the same flat fee for every vaccine_code."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role."
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id referenced in the path exists."
    error_id: "ERR_HOUSEHOLD_NOT_FOUND / ERR_PATIENT_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_ESTIMATE_NOT_FOUND / ERR_SURGERY_NOT_FOUND / ERR_BOARDING_NOT_FOUND / ERR_PRESCRIPTION_NOT_FOUND / ERR_VACCINATION_NOT_FOUND / ERR_LAB_ORDER_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_OPERATORY_NOT_FOUND / ERR_KENNEL_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with a path id

  - priority: 4
    category: existence
    check: "Referenced FK bodies (operatory_id, kennel_id, estimate_id, appointment_id) resolve to existing resources."
    error_id: "ERR_OPERATORY_NOT_FOUND / ERR_KENNEL_NOT_FOUND / ERR_ESTIMATE_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND"
    http_status: 404
    applies_to: "Surgery create, BoardingStay create, Invoice create"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, weight_kg>0, qty>=1, time ranges have end strictly after start (boarding allows equal day)."
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_TIME_RANGE"
    http_status: 400
    applies_to: all create/transition endpoints with a body

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition (state-machine precondition)."
    error_id: "ERR_APPOINTMENT_INVALID_STATE / ERR_ESTIMATE_INVALID_STATE / ERR_SURGERY_INVALID_STATE / ERR_BOARDING_INVALID_STATE / ERR_PATIENT_NOT_ACTIVE / ERR_PRESCRIPTION_NOT_ACTIVE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: state
    check: "Cross-entity state dependency: Surgery start requires parent Appointment.status == IN_EXAM (Surgery->Appointment); Prescription refill requires Patient.status == ACTIVE (Prescription->Patient)."
    error_id: "ERR_APPOINTMENT_NOT_IN_EXAM / ERR_PATIENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "Surgery start, Prescription refill"

  - priority: 8
    category: business_safety
    check: "Vaccine re-dose interval: a same-code dose administered strictly fewer than MIN_INTERVAL_DAYS[vaccine_code] days after the latest prior dose is rejected (== interval is allowed)."
    error_id: ERR_VACCINE_INTERVAL
    http_status: 422
    applies_to: "POST /clinic/vaccinations"

  - priority: 9
    category: business_safety
    check: "Controlled-substance refill cooldown: a refill of a controlled Prescription within 30 days of last_refill_at is rejected."
    error_id: ERR_CONTROLLED_COOLDOWN
    http_status: 422
    applies_to: "POST /clinic/prescriptions/{rxid}/refill"

  - priority: 10
    category: business_constraint
    check: "Refill availability: refills_remaining (refills_authorized - refills_used) must be > 0 to dispense."
    error_id: ERR_NO_REFILLS_REMAINING
    http_status: 409
    applies_to: "POST /clinic/prescriptions/{rxid}/refill"

  - priority: 11
    category: business_temporal
    check: "Operatory overlap: a Surgery window [start,end) plus the operatory's cleanup_buffer_minutes after end must not overlap any other non-CANCELLED surgery's [start, end+buffer) in the same operatory."
    error_id: ERR_OPERATORY_CONFLICT
    http_status: 409
    applies_to: "POST /clinic/surgeries"

  - priority: 12
    category: business_temporal
    check: "Kennel capacity overlap: for every inclusive day spanned by a new BoardingStay, the count of non-CANCELLED stays in that kennel covering that day must remain <= kennel.capacity."
    error_id: ERR_KENNEL_AT_CAPACITY
    http_status: 409
    applies_to: "POST /clinic/boarding-stays"

  - priority: 13
    category: business_fiscal
    check: "Estimate approval requires deposit_posted_cents >= deposit_required_cents."
    error_id: ERR_DEPOSIT_NOT_MET
    http_status: 402
    applies_to: "POST /clinic/estimates/{eid}/transition (action=approve)"

  - priority: 14
    category: business_fiscal
    check: "Invoice finalize requires the appointment to have at least one rendered, billable line (administered vaccination, RESULTED lab order, or DONE surgery); an empty actual set is rejected."
    error_id: ERR_NO_BILLABLE_ITEMS
    http_status: 422
    applies_to: "POST /clinic/invoices"

# =============================================================================
# §1.5 API Endpoint Table (51 endpoints) — flat topology under /clinic
# =============================================================================
endpoints:

  # ---- Operatory (resource config) ----
  - method: POST
    path: "/clinic/operatories"
    description: "Create an operatory (surgical suite)."
    roles: [PracticeManager]
    code: 201
    input: [name, "cleanup_buffer_minutes?"]
    output: Operatory
    side_effects: ["status=OPEN, booked_minutes=0"]

  - method: GET
    path: "/clinic/operatories"
    description: "List operatories."
    roles: [PracticeManager, Veterinarian, Receptionist]
    code: 200
    input: ["limit?", "offset?"]
    output: "Operatory[]"
    side_effects: []

  - method: GET
    path: "/clinic/operatories/{oid}"
    description: "Get an operatory (includes computed booked_minutes)."
    roles: [PracticeManager, Veterinarian, Receptionist]
    code: 200
    input: []
    output: Operatory
    side_effects: []

  # ---- Kennel (resource config) ----
  - method: POST
    path: "/clinic/kennels"
    description: "Create a kennel block."
    roles: [PracticeManager]
    code: 201
    input: [name, capacity]
    output: Kennel
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/clinic/kennels"
    description: "List kennels."
    roles: [PracticeManager, Veterinarian, Receptionist]
    code: 200
    input: ["limit?", "offset?"]
    output: "Kennel[]"
    side_effects: []

  - method: GET
    path: "/clinic/kennels/{kid}"
    description: "Get a kennel."
    roles: [PracticeManager, Veterinarian, Receptionist]
    code: 200
    input: []
    output: Kennel
    side_effects: []

  # ---- Household ----
  - method: POST
    path: "/clinic/households"
    description: "Create a household billing account."
    roles: [Receptionist, PracticeManager]
    code: 201
    input: [account_name]
    output: Household
    side_effects: ["status=ACTIVE, account_credit_cents=0, lifetime_invoiced_cents=0, version=1"]

  - method: GET
    path: "/clinic/households"
    description: "List households."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Household[]"
    side_effects: []

  - method: GET
    path: "/clinic/households/{hid}"
    description: "Get a household (includes computed account_credit_cents, version)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: POST
    path: "/clinic/deposits"
    description: "Post a refundable deposit, crediting a household account and optionally earmarking it to an estimate. OCC-guarded on household version."
    roles: [Receptionist, PracticeManager]
    code: 201
    input: [household_id, amount_cents, "estimate_id?", expected_household_version]
    output: Household
    side_effects:
      - "account_credit_cents += amount_cents"
      - "If estimate_id given: that Estimate.deposit_posted_cents += amount_cents"
      - "increments Household.version by 1"

  # ---- Owner ----
  - method: POST
    path: "/clinic/owners"
    description: "Add an owner to a household."
    roles: [Receptionist, PracticeManager]
    code: 201
    input: [household_id, full_name, email, "is_primary?"]
    output: Owner
    side_effects: []

  - method: GET
    path: "/clinic/owners"
    description: "List owners; filter by household_id (reverse-reachability for Owner.household_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: "Owner[]"
    side_effects: []

  - method: GET
    path: "/clinic/owners/{ownerid}"
    description: "Get an owner."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/clinic/patients"
    description: "Register a patient (pet) under a household."
    roles: [Receptionist, PracticeManager]
    code: 201
    input: [household_id, name, species, weight_kg]
    output: Patient
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/clinic/patients"
    description: "List patients; filter by household_id (reverse-reachability for Patient.household_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/clinic/patients/{pid}"
    description: "Get a patient."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/clinic/patients/{pid}/deactivate"
    description: "Deactivate a patient (ACTIVE -> INACTIVE)."
    roles: [Receptionist]
    code: 200
    input: []
    output: Patient
    side_effects: ["status -> INACTIVE"]

  - method: POST
    path: "/clinic/patients/{pid}/mark-deceased"
    description: "Mark a patient deceased; cascades to prescriptions and boarding stays."
    roles: [Veterinarian]
    code: 200
    input: []
    output: Patient
    side_effects:
      - "status -> DECEASED"
      - "ACTIVE Prescriptions -> VOIDED with refill count restored"
      - "RESERVED/CHECKED_IN BoardingStays -> CANCELLED with kennel occupancy released"

  # ---- WellnessPlan ----
  - method: POST
    path: "/clinic/wellness-plans"
    description: "Enroll a patient in a wellness plan."
    roles: [Receptionist, PracticeManager]
    code: 201
    input: [patient_id, tier]
    output: WellnessPlan
    side_effects: ["status=ACTIVE; service_discount_pct, bundled_vaccines_remaining, realized_savings_cents initialized from tier"]

  - method: GET
    path: "/clinic/wellness-plans"
    description: "List wellness plans; filter by patient_id (reverse-reachability for WellnessPlan.patient_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: "WellnessPlan[]"
    side_effects: []

  - method: GET
    path: "/clinic/wellness-plans/{wpid}"
    description: "Get a wellness plan (savings read returns projected vs realized fields; dual-variant)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: WellnessPlan
    side_effects: []

  # ---- Appointment ----
  - method: POST
    path: "/clinic/appointments"
    description: "Schedule an appointment."
    roles: [Receptionist]
    code: 201
    input: [patient_id, scheduled_start, scheduled_end, visit_reason]
    output: Appointment
    side_effects: ["status=SCHEDULED, reschedule_count=0"]

  - method: GET
    path: "/clinic/appointments"
    description: "List appointments; filter by patient_id (reverse-reachability for Appointment.patient_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/clinic/appointments/{aid}"
    description: "Get an appointment."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/clinic/appointments/{aid}/transition"
    description: "Drive an appointment through its lifecycle. action selects the transition (check-in, begin-exam, reschedule, complete, cancel, no-show)."
    roles: [Receptionist, Veterinarian]
    code: 200
    input: [action, "scheduled_start?", "scheduled_end?"]
    output: Appointment
    side_effects:
      - "Applies the chosen transition with its preconditions and side effects (see §1.2 Appointment)."
      - "cancel cascades to surgeries (operatory release + deposit refund + household version bump) and lab orders."
      - "reschedule increments reschedule_count and replaces the window."

  # ---- Vaccination ----
  - method: POST
    path: "/clinic/vaccinations"
    description: "Record a vaccine dose; enforces re-dose interval and computes next_due/reminder."
    roles: [Veterinarian]
    code: 201
    input: [patient_id, vaccine_code, administered_at, "bundled?"]
    output: Vaccination
    side_effects: ["fee_cents, next_due_at, reminder_at computed; if bundled and bundle remaining: WellnessPlan.bundled_vaccines_remaining -= 1 and realized_savings_cents += STANDARD_VACCINE_FEE_CENTS"]

  - method: GET
    path: "/clinic/vaccinations"
    description: "List vaccinations; filter by patient_id (reverse-reachability for Vaccination.patient_id). due_only returns doses whose reminder_at <= clock now."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["patient_id?", "due_only?", "limit?", "offset?"]
    output: "Vaccination[]"
    side_effects: []

  - method: GET
    path: "/clinic/vaccinations/{vid}"
    description: "Get a vaccination."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Vaccination
    side_effects: []

  # ---- Prescription ----
  - method: POST
    path: "/clinic/prescriptions"
    description: "Create a prescription."
    roles: [Veterinarian]
    code: 201
    input: [patient_id, drug_name, refills_authorized, "is_controlled?"]
    output: Prescription
    side_effects: ["status=ACTIVE, refills_used=0"]

  - method: GET
    path: "/clinic/prescriptions"
    description: "List prescriptions; filter by patient_id (reverse-reachability for Prescription.patient_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: "Prescription[]"
    side_effects: []

  - method: GET
    path: "/clinic/prescriptions/{rxid}"
    description: "Get a prescription."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: POST
    path: "/clinic/prescriptions/{rxid}/refill"
    description: "Dispense one refill; enforces patient-active, controlled cooldown, and remaining count."
    roles: [Veterinarian]
    code: 200
    input: []
    output: Prescription
    side_effects: ["refills_used += 1; last_refill_at = clock now; if refills_remaining hits 0 -> status EXHAUSTED"]

  # ---- Estimate ----
  - method: POST
    path: "/clinic/estimates"
    description: "Create a draft estimate with line items and an optional required deposit."
    roles: [Veterinarian, Receptionist]
    code: 201
    input: [patient_id, line_items, "deposit_required_cents?"]
    output: Estimate
    side_effects: ["status=DRAFT, revision=1, estimated_total_cents computed"]

  - method: GET
    path: "/clinic/estimates"
    description: "List estimates; filter by patient_id (reverse-reachability for Estimate.patient_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: "Estimate[]"
    side_effects: []

  - method: GET
    path: "/clinic/estimates/{eid}"
    description: "Get an estimate."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Estimate
    side_effects: []

  - method: POST
    path: "/clinic/estimates/{eid}/transition"
    description: "Drive an estimate through its lifecycle. action selects present, decline, revise, approve, or expire."
    roles: [Veterinarian, Receptionist, PracticeManager]
    code: 200
    input: [action, "line_items?"]
    output: Estimate
    side_effects:
      - "Applies the chosen transition (see §1.2 Estimate)."
      - "revise increments revision and replaces line_items; approve requires deposit met; expire refunds any posted deposit to household credit (version bump)."

  # ---- Surgery ----
  - method: POST
    path: "/clinic/surgeries"
    description: "Book a surgery into an operatory against an APPROVED estimate; enforces operatory overlap+buffer and commits the estimate deposit. The parent appointment need only exist (no IN_EXAM precondition at booking time)."
    roles: [Veterinarian]
    code: 201
    input: [appointment_id, operatory_id, estimate_id, procedure_name, window_start, window_end]
    output: Surgery
    side_effects:
      - "status=BOOKED; surgery_total_cents computed (calc surgery_total); Operatory.booked_minutes += window minutes."
      - "deposit_consumed_cents := min(funding Estimate.deposit_posted_cents, surgery_total_cents); the funding Estimate's Household.account_credit_cents is DEBITED by deposit_consumed_cents, Estimate.deposit_posted_cents is reduced by the same, and that Household.version is bumped by 1 (the deposit is committed to this surgery; refunded on cancel)."
    note: "Requires the funding Estimate.status == APPROVED (ERR_ESTIMATE_INVALID_STATE)."

  - method: GET
    path: "/clinic/surgeries"
    description: "List surgeries; filter by appointment_id (reverse-reachability for Surgery.appointment_id), operatory_id (Surgery.operatory_id), estimate_id (Surgery.estimate_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["appointment_id?", "operatory_id?", "estimate_id?", "limit?", "offset?"]
    output: "Surgery[]"
    side_effects: []

  - method: GET
    path: "/clinic/surgeries/{sid}"
    description: "Get a surgery."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Surgery
    side_effects: []

  - method: POST
    path: "/clinic/surgeries/{sid}/transition"
    description: "Drive a surgery through its lifecycle. action selects start, complete, or cancel."
    roles: [Veterinarian]
    code: 200
    input: [action]
    output: Surgery
    side_effects:
      - "Applies the chosen transition (see §1.2 Surgery)."
      - "complete consumes deposit; cancel releases operatory minutes and refunds deposit to household credit (version bump)."

  # ---- BoardingStay ----
  - method: POST
    path: "/clinic/boarding-stays"
    description: "Reserve a boarding stay in a kennel; enforces kennel aggregate-capacity overlap."
    roles: [Receptionist, PracticeManager]
    code: 201
    input: [patient_id, kennel_id, check_in_date, check_out_date, nightly_rate_cents]
    output: BoardingStay
    side_effects: ["status=RESERVED; board_total_cents computed; kennel occupancy incremented for the stay's days"]

  - method: GET
    path: "/clinic/boarding-stays"
    description: "List boarding stays; filter by patient_id (reverse-reachability for BoardingStay.patient_id) and kennel_id (BoardingStay.kennel_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["patient_id?", "kennel_id?", "limit?", "offset?"]
    output: "BoardingStay[]"
    side_effects: []

  - method: GET
    path: "/clinic/boarding-stays/{bid}"
    description: "Get a boarding stay."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: BoardingStay
    side_effects: []

  - method: POST
    path: "/clinic/boarding-stays/{bid}/transition"
    description: "Drive a boarding stay through its lifecycle. action selects check-in, check-out, or cancel."
    roles: [Receptionist]
    code: 200
    input: [action]
    output: BoardingStay
    side_effects: ["Applies the chosen transition (see §1.2 BoardingStay); cancel releases kennel occupancy."]

  # ---- LabOrder ----
  - method: POST
    path: "/clinic/lab-orders"
    description: "Place a lab or dental diagnostic order on an appointment."
    roles: [Veterinarian]
    code: 201
    input: [appointment_id, order_type, fee_cents]
    output: LabOrder
    side_effects: ["status=ORDERED"]

  - method: GET
    path: "/clinic/lab-orders"
    description: "List lab orders; filter by appointment_id (reverse-reachability for LabOrder.appointment_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: "LabOrder[]"
    side_effects: []

  - method: GET
    path: "/clinic/lab-orders/{loid}"
    description: "Get a lab order."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: LabOrder
    side_effects: []

  - method: POST
    path: "/clinic/lab-orders/{loid}/transition"
    description: "Drive a lab order through its lifecycle. action selects collect, result (requires result_text), or cancel."
    roles: [Veterinarian]
    code: 200
    input: [action, "result_text?"]
    output: LabOrder
    side_effects: ["Applies the chosen transition: ORDERED->COLLECTED->RESULTED, or ->CANCELLED."]

  # ---- Invoice ----
  - method: POST
    path: "/clinic/invoices"
    description: "Finalize an invoice for a completed appointment; computes dual-variant estimate vs actual; OCC-guarded on household version."
    roles: [PracticeManager]
    code: 201
    input: [household_id, appointment_id, "estimate_id?", expected_household_version]
    output: Invoice
    side_effects:
      - "status=FINALIZED; estimate_total_cents copied; actual_total_cents and variance_cents computed"
      - "Household.account_credit_cents reduced by credit applied; lifetime_invoiced_cents += actual_total_cents"
      - "increments Household.version by 1"

  - method: GET
    path: "/clinic/invoices"
    description: "List invoices; filter by household_id (reverse-reachability for Invoice.household_id), appointment_id (Invoice.appointment_id), estimate_id (Invoice.estimate_id)."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: ["household_id?", "appointment_id?", "estimate_id?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/clinic/invoices/{invid}"
    description: "Get an invoice."
    roles: [Receptionist, Veterinarian, PracticeManager]
    code: 200
    input: []
    output: Invoice
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog (36 errors)
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID/X-User-Role header missing or role unknown." }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation." }

  # --- existence (404) ---
  - { id: ERR_HOUSEHOLD_NOT_FOUND, http: 404, condition: "Household id not found." }
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "Owner id not found." }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id not found." }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment id not found." }
  - { id: ERR_ESTIMATE_NOT_FOUND, http: 404, condition: "Estimate id not found (path or estimate_id body)." }
  - { id: ERR_SURGERY_NOT_FOUND, http: 404, condition: "Surgery id not found." }
  - { id: ERR_BOARDING_NOT_FOUND, http: 404, condition: "BoardingStay id not found." }
  - { id: ERR_PRESCRIPTION_NOT_FOUND, http: 404, condition: "Prescription id not found." }
  - { id: ERR_VACCINATION_NOT_FOUND, http: 404, condition: "Vaccination id not found." }
  - { id: ERR_LAB_ORDER_NOT_FOUND, http: 404, condition: "LabOrder id not found." }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id not found." }
  - { id: ERR_OPERATORY_NOT_FOUND, http: 404, condition: "Operatory id not found (path or operatory_id body)." }
  - { id: ERR_KENNEL_NOT_FOUND, http: 404, condition: "Kennel id not found (path or kennel_id body)." }

  # --- request validation (400) ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, weight_kg<=0, qty<1, negative cents, or unknown action." }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "end not strictly after start (appointment/surgery), or boarding check_out < check_in." }
  - { id: ERR_OWNER_EMAIL_TAKEN, http: 409, condition: "Owner email already used by another owner." }
  - { id: ERR_FUTURE_ADMINISTRATION, http: 422, condition: "Vaccination administered_at is after clock now." }

  # --- state (409) ---
  - { id: ERR_PATIENT_NOT_ACTIVE, http: 409, condition: "Operation requires Patient.status == ACTIVE." }
  - { id: ERR_PATIENT_HAS_OPEN_VISITS, http: 409, condition: "Deactivate blocked: patient has SCHEDULED/CHECKED_IN/IN_EXAM appointments." }
  - { id: ERR_APPOINTMENT_INVALID_STATE, http: 409, condition: "Appointment not in the required state for the requested action (covers not-scheduled / not-checked-in / not-in-exam / not-cancellable / too-early-for-no-show / reschedule-limit / surgery-blocks-reschedule / open-lab-orders / open-surgery)." }
  - { id: ERR_ESTIMATE_INVALID_STATE, http: 409, condition: "Estimate not in the required state for the requested action (not-draft / not-presented / not-declined / not-expirable / empty-estimate)." }
  - { id: ERR_SURGERY_INVALID_STATE, http: 409, condition: "Surgery not in the required state for the requested action (not-booked / not-in-progress / not-cancellable)." }
  - { id: ERR_APPOINTMENT_NOT_IN_EXAM, http: 409, condition: "Cross-entity dependency: Surgery start requires parent Appointment.status == IN_EXAM." }
  - { id: ERR_BOARDING_INVALID_STATE, http: 409, condition: "BoardingStay not in the required state (not-reserved / not-checked-in / not-cancellable)." }
  - { id: ERR_LAB_ORDER_INVALID_STATE, http: 409, condition: "LabOrder not in the required state for the requested action (collect requires ORDERED; result requires COLLECTED; cancel requires ORDERED or COLLECTED)." }
  - { id: ERR_PRESCRIPTION_NOT_ACTIVE, http: 409, condition: "Refill blocked: prescription not ACTIVE." }
  - { id: ERR_NO_REFILLS_REMAINING, http: 409, condition: "Refill blocked: refills_remaining == 0." }

  # --- business safety/temporal/fiscal ---
  - { id: ERR_VACCINE_INTERVAL, http: 422, condition: "Same-code dose given strictly fewer than MIN_INTERVAL_DAYS days after the latest prior dose." }
  - { id: ERR_CONTROLLED_COOLDOWN, http: 422, condition: "Controlled-substance refill within 30 days of last_refill_at." }
  - { id: ERR_OPERATORY_CONFLICT, http: 409, condition: "Surgery window+buffer overlaps another non-cancelled surgery in the same operatory." }
  - { id: ERR_KENNEL_AT_CAPACITY, http: 409, condition: "Boarding would exceed kennel.capacity on at least one overlapping day." }
  - { id: ERR_DEPOSIT_NOT_MET, http: 402, condition: "Estimate approve: deposit_posted_cents < deposit_required_cents." }
  - { id: ERR_NO_BILLABLE_ITEMS, http: 422, condition: "Invoice finalize: appointment has no rendered billable items." }

  # --- concurrency ---
  - { id: ERR_STALE_HOUSEHOLD_VERSION, http: 412, condition: "expected_household_version does not match current Household.version on a credit/invoice write." }

# =============================================================================
# §1.7 RBAC Matrix (peer roles)
# =============================================================================
roles:
  - name: Receptionist
    description: "Front desk: households, owners, patients, scheduling, deposits, check-in/out, estimate presentation handling."
    identity: opaque
    exclusive_operations:
      - "POST /clinic/patients/{pid}/deactivate — Deactivate patient"
    shared_operations:
      - "POST /clinic/households — Create household"
      - "POST /clinic/deposits — Post deposit (credit a household, optionally earmark to an estimate)"
      - "POST /clinic/owners — Add owner"
      - "POST /clinic/patients — Register patient"
      - "POST /clinic/wellness-plans — Enroll plan"
      - "POST /clinic/appointments — Schedule appointment"
      - "POST /clinic/appointments/{aid}/transition — check-in/cancel/no-show actions"
      - "POST /clinic/boarding-stays — Reserve boarding"
      - "POST /clinic/boarding-stays/{bid}/transition — boarding check-in/out/cancel"
      - "POST /clinic/estimates — Create estimate"
      - "POST /clinic/estimates/{eid}/transition — decline/approve actions"
      - "GET endpoints (read access)"

  - name: Veterinarian
    description: "Clinician: exams, vaccinations, prescriptions, surgery, lab orders, estimate clinical actions, mark-deceased."
    identity: opaque
    exclusive_operations:
      - "POST /clinic/patients/{pid}/mark-deceased — Mark patient deceased"
      - "POST /clinic/vaccinations — Record vaccination"
      - "POST /clinic/prescriptions — Create prescription"
      - "POST /clinic/prescriptions/{rxid}/refill — Dispense refill"
      - "POST /clinic/surgeries — Book surgery"
      - "POST /clinic/surgeries/{sid}/transition — surgery lifecycle"
      - "POST /clinic/lab-orders — Place lab order"
      - "POST /clinic/lab-orders/{loid}/transition — lab lifecycle"
    shared_operations:
      - "POST /clinic/appointments/{aid}/transition — begin-exam/reschedule/complete actions"
      - "POST /clinic/estimates — Create estimate"
      - "POST /clinic/estimates/{eid}/transition — present/revise actions"
      - "GET endpoints (read access)"

  - name: PracticeManager
    description: "Operations/finance: resource config (operatories, kennels), invoice finalization, estimate expiry, household admin."
    identity: opaque
    exclusive_operations:
      - "POST /clinic/operatories — Create operatory"
      - "POST /clinic/kennels — Create kennel"
      - "POST /clinic/invoices — Finalize invoice"
    shared_operations:
      - "POST /clinic/households — Create household"
      - "POST /clinic/deposits — Post deposit"
      - "POST /clinic/owners — Add owner"
      - "POST /clinic/patients — Register patient"
      - "POST /clinic/wellness-plans — Enroll plan"
      - "POST /clinic/estimates/{eid}/transition — expire action"
      - "GET endpoints (read access)"
