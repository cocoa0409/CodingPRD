      - name: athlete_withdraw_cascades_entry_event_slot_and_bed_night_ledger
        grounds:
          - state_machines.Athlete.REGISTERED_to_WITHDRAWN
          - state_machines.SportEntry.ACCEPTED_to_WITHDRAWN
          - state_machines.SportEvent.OPEN_to_UNDERSUBSCRIBED
          - state_machines.SessionSlot.SCHEDULED_to_RELEASED
