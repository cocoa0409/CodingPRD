# =============================================================================
# Task 0973: Respite-Care Coordination & Voucher — §1.8 Test Targeting Index
# 2 instances per Difficulty Rule (18 total). Every recipe replays empty-DB ->
# target state using only SCAFFOLD.yaml §1.5 endpoints. Logical clock default:
# 2026-05-01T00:00:00Z (fiscal quarters from 2026-01-01: Q2 = Apr 1 - Jul 1).
# Rate card used in recipes: standard 3000 cents/h, weekend x1.5, evening
# x1.25 (>= 18:00 UTC Mon-Fri), ENHANCED x1.10, emergency x2.0, overage 1.10.
# Weekday anchors: 2026-05-01 = Friday, 2026-05-02 = Saturday, 2026-05-04 = Monday.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: claim_payment_provisional_vs_final_evening
        grounds:
          - calculations.claim_amount_provisional
          - calculations.claim_amount_final
        distinguishing_aspect: |
          Claim-domain dual variant: the same Monday-evening 2-hour service yields
          provisional_amount_cents 6000 (committed x base rate, multipliers ignored)
          at confirm and amount_cents 7500 (evening multiplier x1.25 applied) at
          verification — a 1500-cent delta on identical inputs.
        test_recipe:
          setup:
            - "Program with rate 3000, evening multiplier 1.25 from 18:00 UTC, budget 50000000"
            - "Caregiver ACTIVE with OPEN allocation (80.00h granted) for Q2"
            - "Provider STANDARD ACTIVE with window 2026-05-04T00:00Z..2026-05-15T00:00Z capacity 2"
            - "Voucher of 20.00h ISSUED (provisional encumbrance 60000)"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-04T00:00:00Z", end_at: "2026-05-15T00:00:00Z", capacity: 2 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 20 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-04T19:00:00Z", end_at: "2026-05-04T21:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk: $.data.id } }
          trigger:
            - { call: "POST /respite/bookings/${bk}/confirm", as: Provider, as_user_id: "${prov}", captures: { bk_prov: $.data.provisional_amount_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T19:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/bookings/${bk}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { vis: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T21:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/visit-records/${vis}/check-out", payload: { tasks_completed: ["meal_prep"] }, as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/visit-records/${vis}/verification-decisions", payload: { decision: "VERIFY" }, as: Coordinator }
            - { call: "GET /respite/claims?voucher_id=${vch}", as: Coordinator, captures: { clm: "$.data[0].id", clm_amt: "$.data[0].amount_cents", clm_prov: "$.data[0].provisional_amount_cents" } }
          assert:
            - "Booking.${bk}.provisional_amount_cents == 6000"
            - "Claim.${clm}.provisional_amount_cents == 6000"
            - "Claim.${clm}.amount_cents == 7500"
            - "Claim.${clm}.amount_cents - Claim.${clm}.provisional_amount_cents == 1500"

      - name: provider_quality_simple_vs_recency_weighted
        grounds:
          - calculations.provider_quality_score
        distinguishing_aspect: |
          Provider-domain dual variant (distinct from the Claim-domain pair):
          identical rating multiset {2, 5} yields quality_score_simple 3.50 but
          quality_score_weighted 4.40 because the 30-day half-life decay weights
          the 60-day-old rating 2 at 0.25 and the fresh rating 5 at 1.0.
        test_recipe:
          setup:
            - "Program, ACTIVE caregiver with Q2 allocation, ACTIVE STANDARD provider with one window 2026-05-01T00:00Z..2026-06-30T23:59Z capacity 4"
            - "Booking1 completed 2026-05-01 08:00-09:00 (voucher1 5h) and rated 2 at 2026-05-01T09:00Z"
            - "Booking2 completed 2026-06-30 08:00-09:00 (voucher2 5h) and rated 5 at 2026-06-30T09:00Z"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-01T00:00:00Z", end_at: "2026-06-30T23:59:00Z", capacity: 4 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 5 }, as: Caregiver, as_user_id: "${cg}", captures: { vch1: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch1}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-01T08:00:00Z", end_at: "2026-05-01T09:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk1: $.data.id } }
            - { call: "POST /respite/bookings/${bk1}/confirm", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:30:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/bookings/${bk1}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { vis1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/visit-records/${vis1}/check-out", payload: { tasks_completed: ["meal_prep"] }, as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/visit-records/${vis1}/verification-decisions", payload: { decision: "VERIFY" }, as: Coordinator }
            - { call: "POST /respite/bookings/${bk1}/satisfaction-surveys", payload: { rating: 2, would_rebook: false }, as: Caregiver, as_user_id: "${cg}", captures: { sv1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T08:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 5 }, as: Caregiver, as_user_id: "${cg}", captures: { vch2: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch2}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-06-30T08:00:00Z", end_at: "2026-06-30T09:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk2: $.data.id } }
            - { call: "POST /respite/bookings/${bk2}/confirm", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/bookings/${bk2}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { vis2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T09:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/visit-records/${vis2}/check-out", payload: { tasks_completed: ["meal_prep"] }, as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/visit-records/${vis2}/verification-decisions", payload: { decision: "VERIFY" }, as: Coordinator }
          trigger:
            - { call: "POST /respite/bookings/${bk2}/satisfaction-surveys", payload: { rating: 5, would_rebook: true }, as: Caregiver, as_user_id: "${cg}" }
            - { call: "GET /respite/providers/${prov}", as: Coordinator, captures: { qs: $.data.quality_score_simple, qw: $.data.quality_score_weighted } }
          assert:
            - "Provider.${prov}.quality_score_simple == 3.50"
            - "Provider.${prov}.quality_score_weighted == 4.40"
            - "Provider.${prov}.quality_score_weighted != Provider.${prov}.quality_score_simple"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: claim_amount_emergency_weekend_enhanced_stack
        grounds:
          - calculations.claim_amount_final
        distinguishing_aspect: |
          Mode (a) combinatorial formula: four inputs (payable-minutes cap,
          Saturday day multiplier 1.5, ENHANCED credential multiplier 1.10,
          emergency multiplier 2.0) interact non-linearly; evaluation order is
          pinned and the stacked result on 90 payable minutes is exactly 14850 cents.
        test_recipe:
          setup:
            - "Program (rate 3000, emergency x2.0, ENHANCED premium x1.10, weekend x1.5), reserve 200h"
            - "Caregiver ACTIVE; ENHANCED provider ACTIVE with accepts_emergency true and no other ACTIVE accepts_emergency provider"
            - "Emergency request for Saturday 2026-05-02 10:00-14:00 TRIAGED with approved_hours 4"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "POST /respite/providers", payload: { name: "Prov Enh", credential_level: "ENHANCED", service_zip: "94110", accepts_emergency: true }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/emergency-requests", payload: { caregiver_id: "${cg}", needed_start_at: "2026-05-02T10:00:00Z", needed_end_at: "2026-05-02T14:00:00Z", reason: "caregiver hospitalized" }, as: Caregiver, as_user_id: "${cg}", captures: { emg: $.data.id } }
            - { call: "POST /respite/emergency-requests/${emg}/triage", payload: { approved_hours: 4 }, as: Coordinator }
          trigger:
            - { call: "POST /respite/emergency-requests/${emg}/dispatch", as: Coordinator, captures: { emg_bk: $.data.dispatched_booking_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/bookings/${emg_bk}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { vis: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T11:30:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/visit-records/${vis}/check-out", payload: { tasks_completed: ["meal_prep"] }, as: Provider, as_user_id: "${prov}", captures: { vis_payable: $.data.payable_minutes } }
            - { call: "POST /respite/visit-records/${vis}/verification-decisions", payload: { decision: "VERIFY" }, as: Coordinator }
            - { call: "GET /respite/claims?visit_record_id=${vis}", as: Coordinator, captures: { clm: "$.data[0].id", clm_amt: "$.data[0].amount_cents" } }
          assert:
            - "VisitRecord.${vis}.verified_minutes == 90"
            - "VisitRecord.${vis}.payable_minutes == 90"
            - "Claim.${clm}.amount_cents == 14850"

      - name: per_claim_rounding_then_sum_in_report
        grounds:
          - calculations.claim_amount_final
          - calculations.utilization_reporting
        distinguishing_aspect: |
          Mode (b) nested rounding: each claim rounds half-up individually
          (2227.5 -> 2228 per 27-payable-minute Saturday ENHANCED visit), and the
          report sums rounded integers — total_paid_amount_cents 4456, whereas
          sum-then-round would yield round(4455.0) = 4455. Distinct mode from the
          stacked-multiplier instance.
        test_recipe:
          setup:
            - "Program (rate 3000, weekend x1.5, ENHANCED premium x1.10), budget 50000000"
            - "Caregiver ACTIVE with allocation; ENHANCED provider ACTIVE with Saturday window 2026-05-02T09:00Z-13:00Z capacity 1"
            - "Two vouchers (1.00h each); two bookings 2026-05-02 10:00-10:25 and 11:00-11:25 (35-minute gap satisfies the 30-minute caregiver buffer)"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov Enh", credential_level: "ENHANCED", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-02T09:00:00Z", end_at: "2026-05-02T13:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 1 }, as: Caregiver, as_user_id: "${cg}", captures: { vch1: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch1}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:25:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk1: $.data.id } }
            - { call: "POST /respite/bookings/${bk1}/confirm", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/bookings/${bk1}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { vis1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:25:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/visit-records/${vis1}/check-out", payload: {}, as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/visit-records/${vis1}/verification-decisions", payload: { decision: "VERIFY" }, as: Coordinator }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 1 }, as: Caregiver, as_user_id: "${cg}", captures: { vch2: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch2}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-02T11:00:00Z", end_at: "2026-05-02T11:25:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk2: $.data.id } }
            - { call: "POST /respite/bookings/${bk2}/confirm", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T11:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/bookings/${bk2}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { vis2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T11:25:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/visit-records/${vis2}/check-out", payload: {}, as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/visit-records/${vis2}/verification-decisions", payload: { decision: "VERIFY" }, as: Coordinator }
            - { call: "GET /respite/claims?visit_record_id=${vis1}", as: Coordinator, captures: { clm1: "$.data[0].id" } }
            - { call: "GET /respite/claims?visit_record_id=${vis2}", as: Coordinator, captures: { clm2: "$.data[0].id" } }
            - { call: "POST /respite/claims/${clm1}/submit", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/claims/${clm1}/adjudicate", payload: { decision: "APPROVE" }, as: FunderAdmin }
            - { call: "POST /respite/claims/${clm1}/pay", as: FunderAdmin }
            - { call: "POST /respite/claims/${clm2}/submit", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/claims/${clm2}/adjudicate", payload: { decision: "APPROVE" }, as: FunderAdmin }
            - { call: "POST /respite/claims/${clm2}/pay", as: FunderAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T12:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/programs/${prog}/ops-runs", payload: { run_type: "STANDARD" }, as: Coordinator, captures: { snap: $.data.id, snap_paid: $.data.total_paid_amount_cents } }
            - { call: "GET /respite/claims/${clm1}", as: Coordinator, captures: { c1_amt: $.data.amount_cents } }
            - { call: "GET /respite/claims/${clm2}", as: Coordinator, captures: { c2_amt: $.data.amount_cents } }
          assert:
            - "VisitRecord.${vis1}.payable_minutes == 27"
            - "Claim.${clm1}.amount_cents == 2228"
            - "Claim.${clm2}.amount_cents == 2228"
            - "ReportSnapshot.${snap}.total_paid_amount_cents == 4456"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: eligibility_info_request_resubmission_cycle
        grounds:
          - state_machines.EligibilityApplication.SUBMITTED_to_INFO_REQUESTED
          - state_machines.EligibilityApplication.INFO_REQUESTED_to_SUBMITTED
          - state_machines.EligibilityApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          EligibilityApplication traverses a revision cycle SUBMITTED ->
          INFO_REQUESTED -> SUBMITTED -> APPROVED; revision_count increments to 1
          and the coordinator's review_note survives the loop.
        test_recipe:
          setup:
            - "Program ENROLLMENT_OPEN; caregiver ENROLLED with a SUBMITTED application (need_score 5)"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 5 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "REQUEST_INFO", note: "need physician letter" }, as: Coordinator, captures: { st1: $.data.status } }
            - { call: "POST /respite/eligibility-applications/${app}/resubmit", payload: { need_score: 7, notes: "letter attached" }, as: Caregiver, as_user_id: "${cg}", captures: { st2: $.data.status, rev: $.data.revision_count } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator, captures: { st3: $.data.status } }
            - { call: "GET /respite/caregivers/${cg}", as: Coordinator, captures: { cg_status: $.data.status } }
          assert:
