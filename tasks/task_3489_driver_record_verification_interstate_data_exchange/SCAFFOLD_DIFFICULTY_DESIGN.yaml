              payload: {}
              as: AuditAuthority
          assert:
            - "First manual disqualification succeeds (dq1_id non-null, basis == MANUAL_JUDICIAL)"
            - "err == ERR_DISQUALIFICATION_OVERLAP for the shared-boundary-day request (closed intervals: 2026-10-10 is inside both)"
            - "The 2026-10-11-start request succeeds (dq2_id non-null) — adjacency one day after the inclusive end is disjoint"
            - "Exactly 2 Disqualifications exist on the record"

      - name: certification_window_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_CERT_WINDOW_OVERLAP]
          - entities.ConnectionCertification.fields.window_end
        distinguishing_aspect: |
          HALF-OPEN [window_start, window_end) semantics on the SystemParticipation resource —
          different interval geometry than the closed disqualification intervals and a different
          resource: a new window starting exactly at the incumbent's window_end is ADJACENT and
          allowed, while a start one day earlier overlaps and is rejected.
        test_recipe:
          setup:
            - "Jurisdiction AA exists (APPLIED) with an ENROLLING POINTER_NETWORK participation; no certifications scheduled"
          setup_api_calls:
