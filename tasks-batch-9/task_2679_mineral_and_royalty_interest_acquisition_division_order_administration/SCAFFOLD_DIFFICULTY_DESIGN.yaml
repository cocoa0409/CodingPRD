# ===========================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2679 - Mineral and Royalty Interest Acquisition & Division Order
#             Administration
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Every numeric assert
# below was computed by executing the referenced calculations[].formula with its
# declared constants at the declared precision.
#
# Canonical fixture reused across instances (all literals, no hidden state):
#   logical clock default            2026-08-01T00:00:00Z
#   Tract                            Reeves / TX / 640.0000 gross acres / HIGH
#   chain PATENT 1.0, DEED 480.0000, PROBATE 0.5, ASSIGNMENT 0.0625
#     -> net_mineral_acres_certified 80.0000, existing_burden_fraction 0.0625
#   MineralInterest seller_share_fraction 0.5, lease_royalty_rate 0.1875
#     -> net_mineral_acres 40.0000
#   Valuation 1200.00 / 0.18 / 20.0000 undeveloped, tier HIGH
#     -> pdp_pv 39589.70, undeveloped_pv 19440.00,
#        bid_floor 37115.34, max_bid 55340.34
#   Unit 1280.0000 gross acres, cap 0.2500, depths 2 of 3, pugh 2026-12-31
#   UnitTractAllocation 320.0000 acres, [2026-01-01, 2028-01-01), POOLED
#     -> expected_decimal 0.00195313 (0.00136719 if NON_CONSENT)
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: valuation_bid_band_pdp_only_versus_risked_upside
        grounds:
          - calculations.valuation_bid_band
          - entities.Valuation.fields.pdp_pv
          - entities.Valuation.fields.undeveloped_pv
          - entities.Valuation.fields.bid_floor
          - entities.Valuation.fields.max_bid
          - entities.MineralInterest.fields.existing_burden_fraction
        distinguishing_aspect: |
          Asset-valuation domain (Valuation of a MineralInterest): one filing produces two
          burden-adjusted numbers from the same decline curve - bid_floor from variant
          pdp_only excludes undeveloped_pv entirely while max_bid from variant risked_upside
          adds it, so max_bid - bid_floor == 18225.00 == round(undeveloped_pv * (1 - 0.0625), 2).
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "one CERTIFIED Tract in Reeves County TX with 640.0000 gross acres, operator_activity_tier HIGH, net_mineral_acres_certified 80.0000 and existing_burden_fraction 0.0625"
            - "one PROSPECT MineralInterest on that tract with seller_share_fraction 0.5 and net_mineral_acres 40.0000"
            - "no Valuation filed yet"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
              as: TitleAnalyst
              captures: { t1: $.data.id }
            - call: "POST /tracts/${t1}/title-chain-entries"
              payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t1}/title-chain-entries"
              payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t1}/title-chain-entries"
              payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
              as: TitleAnalyst
            - call: "POST /tracts/${t1}/title-chain-entries"
              payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
              as: TitleAnalyst
            - call: "POST /tracts/${t1}/certify-title"
              payload: {}
              as: TitleAnalyst
            - call: "POST /royalty-owners"
              payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
              as: DivisionOrderAdmin
              captures: { own1: $.data.id }
            - call: "POST /mineral-interests"
              payload: { tract_id: "${t1}", seller_owner_id: "${own1}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
              as: AcquisitionManager
              captures: { mi1: $.data.id }
          trigger:
            - call: "POST /mineral-interests/${mi1}/valuations"
              payload: { current_monthly_net_revenue: 1200.00, annual_decline_rate: 0.18, undeveloped_net_acres: 20.0000 }
              as: AcquisitionManager
              as_user_id: "am-user-001"
              captures: { val1: $.data.id }
          assert:
            - "Valuation.${val1}.pdp_pv == 39589.70"
            - "Valuation.${val1}.undeveloped_pv == 19440.00"
            - "Valuation.${val1}.bid_floor == 37115.34"
            - "Valuation.${val1}.max_bid == 55340.34"
            - "Valuation.${val1}.max_bid - Valuation.${val1}.bid_floor == 18225.00"
            - "Valuation.${val1}.operator_activity_tier == HIGH (copied from the tract, not supplied in the payload)"
            - "Valuation.${val1}.valuation_status == CURRENT"
            - "MineralInterest.${mi1}.current_valuation_id == ${val1}"

      - name: revenue_check_pinned_decimal_versus_live_allocation_decimal
        grounds:
          - calculations.royalty_check_reconciliation
          - calculations.expected_decimal_interest
          - entities.RevenueCheckDetail.fields.expected_gross_royalty
          - entities.RevenueCheckDetail.fields.variance_amount
          - entities.RevenueCheckDetail.fields.audit_decimal
          - entities.RevenueCheckDetail.fields.audit_variance_amount
          - state_machines.UnitTractAllocation.ACTIVE_to_PUGH_RELEASED
          - state_machines.DivisionOrder.EXECUTED_to_SUSPENDED
        distinguishing_aspect: |
          Revenue-ledger domain (RevenueCheckDetail on a DivisionOrder), a different entity
          domain and a different metric from the valuation instance: one posted check line is
          reconciled twice - the pinned variant against DivisionOrder.pinned_decimal 0.00195313
          (variance_amount 9.05, which routes funds) and the live variant against the
          post-pugh-release decimal 0.00130208 (audit_variance_amount -29.45, which routes
          nothing), so the same input row yields opposite-signed variances.
        test_recipe:
          setup:
            - "CERTIFIED Reeves tract, PROSPECT MineralInterest with net_mineral_acres 40.0000"
            - "Unit of 1280.0000 gross acres, royalty_rate_cap 0.2500, producing_depth_count 2 of total_depth_count 3, pugh_clause_active true, pugh_deadline 2026-12-31, operator_user_id op-user-001"
            - "one ACTIVE UnitTractAllocation of 320.0000 acres over [2026-01-01, 2028-01-01) with pooling_election POOLED"
            - "one DivisionOrder EXECUTED with expected_decimal and pinned_decimal both 0.00195313"
            - "logical clock advanced to 2027-01-01T00:00:00Z and the allocation pugh-released, so its allocated_acres is 213.3333 and the live decimal is 0.00130208"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
              as: TitleAnalyst
              captures: { t2: $.data.id }
            - call: "POST /tracts/${t2}/title-chain-entries"
              payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t2}/title-chain-entries"
              payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t2}/title-chain-entries"
              payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
              as: TitleAnalyst
            - call: "POST /tracts/${t2}/title-chain-entries"
              payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
              as: TitleAnalyst
            - call: "POST /tracts/${t2}/certify-title"
              payload: {}
              as: TitleAnalyst
            - call: "POST /royalty-owners"
              payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
              as: DivisionOrderAdmin
              captures: { own2: $.data.id }
            - call: "POST /mineral-interests"
              payload: { tract_id: "${t2}", seller_owner_id: "${own2}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
              as: AcquisitionManager
              captures: { mi2: $.data.id }
            - call: "POST /units"
              payload: { unit_name: "Reeves Unit 1H", formation: "Wolfcamp", state_code: "TX", unit_gross_acres: 1280.0000, royalty_rate_cap: 0.2500, producing_depth_count: 2, total_depth_count: 3, pugh_clause_active: true, pugh_deadline: "2026-12-31" }
              as: Operator
              as_user_id: "op-user-001"
              captures: { u2: $.data.id }
            - call: "POST /unit-tract-allocations"
              payload: { unit_id: "${u2}", tract_id: "${t2}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
              as: Operator
              as_user_id: "op-user-001"
              captures: { al2: $.data.id }
            - call: "GET /units/${u2}"
              payload: {}
              as: Operator
              as_user_id: "op-user-001"
              captures: { uv2: $.data.version }
            - call: "POST /division-orders"
              payload: { mineral_interest_id: "${mi2}", unit_id: "${u2}", expected_unit_version: "${uv2}" }
              as: DivisionOrderAdmin
              as_user_id: "do-user-001"
              captures: { do2: $.data.id }
            - call: "POST /division-orders/${do2}/operator-response"
              payload: { operator_decimal: 0.00195313, effective_production_month: "2026-06" }
              as: Operator
              as_user_id: "op-user-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /unit-tract-allocations/${al2}/pugh-release"
              payload: {}
              as: Operator
              as_user_id: "op-user-001"
          trigger:
            - call: "POST /division-orders/${do2}/revenue-check-details"
              payload: { production_month: "2026-06", product_code: "OIL", gross_volume: 1000.0000, gross_value: 62000.00, operator_decimal_used: 0.00180000 }
              as: Operator
              as_user_id: "op-user-001"
              captures: { rd2: $.data.id }
          assert:
            - "RevenueCheckDetail.${rd2}.severance_tax_rate == 0.046000"
            - "RevenueCheckDetail.${rd2}.reported_gross_royalty == 111.60"
            - "RevenueCheckDetail.${rd2}.net_amount == 106.47"
            - "RevenueCheckDetail.${rd2}.expected_gross_royalty == 121.09"
            - "RevenueCheckDetail.${rd2}.expected_net_amount == 115.52"
            - "RevenueCheckDetail.${rd2}.variance_amount == 9.05"
            - "RevenueCheckDetail.${rd2}.audit_decimal == 0.00130208"
            - "RevenueCheckDetail.${rd2}.audit_gross_royalty == 80.73"
            - "RevenueCheckDetail.${rd2}.audit_variance_amount == -29.45"
            - "RevenueCheckDetail.${rd2}.check_status == VARIANCE_HELD"
            - "DivisionOrder.${do2}.do_status == SUSPENDED"
            - "DivisionOrder.${do2}.pinned_decimal == 0.00195313 (unchanged by the pugh release)"
            - "UnitTractAllocation.${al2}.allocated_acres == 213.3333"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: expected_decimal_nested_min_max_with_non_consent_branch
        grounds:
          - calculations.expected_decimal_interest
          - entities.UnitTractAllocation.fields.pooling_election
          - entities.Unit.fields.royalty_rate_cap
          - entities.MineralInterest.fields.existing_burden_fraction
          - entities.DivisionOrder.fields.expected_decimal
          - validations[priority=72]
        distinguishing_aspect: |
          Mode (a) - four interacting inputs with genuinely non-linear composition:
          min(lease_royalty_rate, unit.royalty_rate_cap) nested inside
          max(0, rate - existing_burden_fraction), multiplied by an ownership ratio, a
          participation ratio and a branch-selected election_factor. With pooling_election
          NON_CONSENT the 0.70 factor applies and expected_decimal is 0.00136719 instead of
          the POOLED 0.00195313 - a 30% reduction that no single-input formula can produce.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "CERTIFIED Reeves tract, MineralInterest with net_mineral_acres 40.0000, lease_royalty_rate 0.1875, existing_burden_fraction 0.0625"
            - "Unit of 1280.0000 gross acres with royalty_rate_cap 0.2500 (above the lease rate, so the min selects the lease rate)"
            - "one ACTIVE UnitTractAllocation of 320.0000 acres over [2026-01-01, 2028-01-01) with pooling_election NON_CONSENT"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
              as: TitleAnalyst
              captures: { t3: $.data.id }
            - call: "POST /tracts/${t3}/title-chain-entries"
              payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t3}/title-chain-entries"
              payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t3}/title-chain-entries"
              payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
              as: TitleAnalyst
            - call: "POST /tracts/${t3}/title-chain-entries"
              payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
              as: TitleAnalyst
            - call: "POST /tracts/${t3}/certify-title"
              payload: {}
              as: TitleAnalyst
            - call: "POST /royalty-owners"
              payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
              as: DivisionOrderAdmin
              captures: { own3: $.data.id }
            - call: "POST /mineral-interests"
              payload: { tract_id: "${t3}", seller_owner_id: "${own3}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
              as: AcquisitionManager
              captures: { mi3: $.data.id }
            - call: "POST /units"
              payload: { unit_name: "Reeves Unit 2H", formation: "Bone Spring", state_code: "TX", unit_gross_acres: 1280.0000, royalty_rate_cap: 0.2500, producing_depth_count: 2, total_depth_count: 3 }
              as: Operator
              as_user_id: "op-user-001"
              captures: { u3: $.data.id }
            - call: "POST /unit-tract-allocations"
              payload: { unit_id: "${u3}", tract_id: "${t3}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "NON_CONSENT" }
              as: Operator
              as_user_id: "op-user-001"
              captures: { al3: $.data.id }
            - call: "GET /units/${u3}"
              payload: {}
              as: Operator
              as_user_id: "op-user-001"
              captures: { uv3: $.data.version }
          trigger:
            - call: "POST /division-orders"
              payload: { mineral_interest_id: "${mi3}", unit_id: "${u3}", expected_unit_version: "${uv3}" }
              as: DivisionOrderAdmin
              as_user_id: "do-user-001"
              captures: { do3: $.data.id }
          assert:
            - "DivisionOrder.${do3}.expected_decimal == 0.00136719"
            - "DivisionOrder.${do3}.allocation_id == ${al3}"
            - "DivisionOrder.${do3}.royalty_owner_id == ${own3}"
            - "DivisionOrder.${do3}.do_status == SENT"
            - "DivisionOrder.${do3}.pinned_decimal is null"
            - "the same fixture with pooling_election POOLED yields expected_decimal 0.00195313, so the NON_CONSENT branch is the only source of the 0.00136719 value"

      - name: defect_basket_per_defect_rounding_then_sum
        grounds:
          - calculations.defect_price_adjustment
          - entities.TitleDefect.fields.allocated_value
          - entities.TitleDefect.fields.net_defect_value
          - entities.PurchaseSaleAgreement.fields.defect_adjustment_amount
          - entities.PurchaseSaleAgreement.fields.adjusted_purchase_price
          - state_machines.PurchaseSaleAgreement.CURATIVE_OPEN_to_CURATIVE_CLOSED
          - state_machines.TitleDefect.RAISED_to_UNCURED
        distinguishing_aspect: |
          Mode (b) - the scaffold pins "round each defect to cents, subtract the per-defect
          deductible, then sum" and forbids "sum the raw allocated values then round once".
          Three UNCURED defects of 10.0000, 7.5000 and 2.5000 net mineral acres produce
          per-defect net values 9500.00 + 6500.00 + 500.00 = 16500.00 against a
          16000.00 basket, so defect_adjustment_amount is exactly 500.00 and
          adjusted_purchase_price is 47500.00; the deductible must also be applied per
          defect (three times), never once against the aggregate.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "CERTIFIED Reeves tract, MineralInterest with net_mineral_acres 40.0000, a CURRENT Valuation with bid_floor 37115.34 and max_bid 55340.34"
            - "an ACCEPTED OfferLetter at 48000.00"
            - "a PurchaseSaleAgreement with purchase_price 48000.00, effective_date 2026-08-01, curative_days 45 (curative_deadline 2026-09-15), individual_defect_threshold 2500.00 and aggregate_defect_basket 16000.00"
            - "three RAISED TitleDefects with affected_nma 10.0000, 7.5000 and 2.5000 and none cured or waived"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
              as: TitleAnalyst
              captures: { t4: $.data.id }
            - call: "POST /tracts/${t4}/title-chain-entries"
              payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t4}/title-chain-entries"
              payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t4}/title-chain-entries"
              payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
              as: TitleAnalyst
            - call: "POST /tracts/${t4}/title-chain-entries"
              payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
              as: TitleAnalyst
            - call: "POST /tracts/${t4}/certify-title"
              payload: {}
              as: TitleAnalyst
            - call: "POST /royalty-owners"
              payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
              as: DivisionOrderAdmin
              captures: { own4: $.data.id }
            - call: "POST /mineral-interests"
              payload: { tract_id: "${t4}", seller_owner_id: "${own4}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
              as: AcquisitionManager
              captures: { mi4: $.data.id }
            - call: "POST /mineral-interests/${mi4}/valuations"
              payload: { current_monthly_net_revenue: 1200.00, annual_decline_rate: 0.18, undeveloped_net_acres: 20.0000 }
              as: AcquisitionManager
              as_user_id: "am-user-001"
            - call: "POST /mineral-interests/${mi4}/offer-letters"
              payload: { offer_amount: 48000.00, expires_on: "2026-09-01" }
              as: AcquisitionManager
              as_user_id: "am-user-002"
              captures: { off4: $.data.id }
            - call: "POST /offer-letters/${off4}/accept"
              payload: {}
              as: RoyaltyOwner
              as_user_id: "${own4}"
            - call: "GET /mineral-interests/${mi4}"
              payload: {}
              as: AcquisitionManager
              captures: { iv4: $.data.version }
            - call: "POST /psas"
              payload: { offer_letter_id: "${off4}", effective_date: "2026-08-01", curative_days: 45, individual_defect_threshold: 2500.00, aggregate_defect_basket: 16000.00, expected_mineral_interest_version: "${iv4}" }
              as: AcquisitionManager
              as_user_id: "am-user-002"
              captures: { psa4: $.data.id }
            - call: "POST /psas/${psa4}/title-defects"
              payload: { defect_type: "MISSING_HEIR", affected_nma: 10.0000, description: "Unprobated heir interest in the 1988 estate" }
              as: TitleAnalyst
              captures: { d4a: $.data.id }
            - call: "POST /psas/${psa4}/title-defects"
              payload: { defect_type: "UNRELEASED_LEASE", affected_nma: 7.5000, description: "1974 lease never released of record" }
              as: TitleAnalyst
              captures: { d4b: $.data.id }
            - call: "POST /psas/${psa4}/title-defects"
              payload: { defect_type: "TAX_SALE_GAP", affected_nma: 2.5000, description: "1963 tax sale gap in the chain" }
              as: TitleAnalyst
              captures: { d4c: $.data.id }
          trigger:
            - call: "POST /psas/${psa4}/close-curative"
              payload: {}
              as: AcquisitionManager
              as_user_id: "am-user-002"
          assert:
            - "TitleDefect.${d4a}.allocated_value == 12000.00 and net_defect_value == 9500.00"
            - "TitleDefect.${d4b}.allocated_value == 9000.00 and net_defect_value == 6500.00"
            - "TitleDefect.${d4c}.allocated_value == 3000.00 and net_defect_value == 500.00"
            - "TitleDefect.${d4a}.defect_status == UNCURED"
            - "TitleDefect.${d4b}.defect_status == UNCURED"
            - "TitleDefect.${d4c}.defect_status == UNCURED"
            - "PurchaseSaleAgreement.${psa4}.defect_adjustment_amount == 500.00"
            - "PurchaseSaleAgreement.${psa4}.adjusted_purchase_price == 47500.00"
            - "PurchaseSaleAgreement.${psa4}.curative_status == CURATIVE_CLOSED"
            - "PurchaseSaleAgreement.${psa4}.psa_status == EXECUTED"
            - "PurchaseSaleAgreement.${psa4}.funding_status == UNFUNDED"
            - "the allocated values are computed from purchase_price 48000.00, never from adjusted_purchase_price 47500.00 - no second allocation pass runs"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: offer_letter_counter_revise_negotiation_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.OfferLetter.SENT_to_COUNTERED
          - state_machines.OfferLetter.COUNTERED_to_REVISED
          - state_machines.OfferLetter.REVISED_to_COUNTERED
          - entities.OfferLetter.fields.counter_round_count
          - entities.OfferLetter.fields.current_amount
          - entities.OfferLetter.fields.last_counter_amount
          - validations[priority=67]
          - errors[ERR_COUNTER_ROUNDS_EXHAUSTED]
