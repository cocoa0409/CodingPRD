            - call: "POST /generic-drug-review/applications/${app_id}/amendments"
              payload: { classification: "MINOR", contains_new_be_data: false, expected_application_version: "${app_v0}" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { err: $.data.error_id }
            - call: "POST /generic-drug-review/applications/${app_id}/amendments"
              payload: { classification: "MINOR", contains_new_be_data: false, expected_application_version: "${app_v_fresh}" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { am_id: $.data.id }
          assert:
            - "the stale attempt (expected_application_version == ${app_v0} == 1, three mutations stale) returns 412 with data.error_id == ERR_STALE_VERSION"
            - "the fresh attempt (expected_application_version == ${app_v_fresh}) returns 201 and creates the amendment"
            - "GET afterwards shows version == ${app_v_fresh} + 1 (exactly one successful mutation landed)"

