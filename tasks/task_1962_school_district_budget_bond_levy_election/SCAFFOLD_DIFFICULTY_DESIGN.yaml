# =============================================================================
# Task 1962 — School District Budget & Bond/Levy Election
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — 9 rules x 20 instances
# =============================================================================
# Shared fixture notes (all chains start from empty DB; logical clock defaults to
# 2026-08-01T00:00:00Z and is advanced explicitly where a date rule matters):
#   FY-A: FY2028, 2027-07-01..2028-06-30, eav_current 500,000,000, eav_prior
#         480,000,000, prior_year_extension 9,000,000, outstanding_debt 4,500,000,
#         fte_ceiling 200  ->  PTELL cap 9,306,000; bond capacity 34,500,000.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two calculations, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: state_aid_provisional_vs_certified_revenue_estimate
        grounds:
          - calculations.state_aid_estimate
          - calculations.weighted_pupil_projection
          - entities.RevenueEstimate.fields.state_aid
          - entities.RevenueEstimate.fields.state_aid_provisional
        distinguishing_aspect: |
          Revenue-domain dual variant: the PROVISIONAL variant (projected weighted pupils
          3190 on eav_prior 480,000,000) and the CERTIFIED variant (certified weighted pupils
          3242 on eav_current 500,000,000) of the SAME revenue estimate produce different
          state aid (13,204,000.00 vs 13,139,200.00), different total tax rates
          (2.0208 vs 1.9400), and different total revenue (23,404,000.00 vs 23,339,200.00);
          the provisional values are retained in *_provisional fields after recertification.
        test_recipe:
          setup:
            - "Fiscal year FY2028 OPEN with three PROVISIONAL enrollment projections (ELEMENTARY 1200, MIDDLE 800, HIGH 1000)"
            - "Budget version v1 exists with a PROVISIONAL revenue estimate (operating request 8,500,000; debt service 1,200,000; other 500,000; cpi 0.034)"
            - "All three projections then CERTIFIED with actuals 1250 / 780 / 1020"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { ep_e: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "MIDDLE", projected_pupils: 800 }
              as: BudgetAnalyst
              captures: { ep_m: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "HIGH", projected_pupils: 1000 }
              as: BudgetAnalyst
              captures: { ep_h: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 1200000, other_revenue: 500000, cpi_rate: 0.034 }
              as: BusinessManager
              captures: { re: $.data.id }
            - call: "POST /district/enrollment-projections/${ep_e}/certify"
              payload: { actual_pupils: 1250 }
              as: BusinessManager
            - call: "POST /district/enrollment-projections/${ep_m}/certify"
              payload: { actual_pupils: 780 }
              as: BusinessManager
            - call: "POST /district/enrollment-projections/${ep_h}/certify"
              payload: { actual_pupils: 1020 }
              as: BusinessManager
          trigger:
            - call: "POST /district/revenue-estimates/${re}/recertify"
              as: BusinessManager
          assert:
            - "Before recertify: RevenueEstimate.${re}.state_aid == 13204000.00 (7600*3190 - 0.023*480,000,000), operating_rate == 1.7708, debt_service_rate == 0.2500, total_tax_rate == 2.0208, total_revenue == 23404000.00, eav_basis == PRIOR, status == PROVISIONAL"
            - "After recertify: RevenueEstimate.${re}.state_aid == 13139200.00 (7600*3242 - 0.023*500,000,000), operating_rate == 1.7000, debt_service_rate == 0.2400, total_tax_rate == 1.9400, total_revenue == 23339200.00, eav_basis == CURRENT, status == RECERTIFIED"
            - "RevenueEstimate.${re}.state_aid_provisional == 13204000.00 and total_revenue_provisional == 23404000.00 (provisional variant retained)"
            - "The two variants diverge by exactly 64800.00 of state aid for identical levy inputs — the variants are NOT interchangeable"

      - name: staffing_cost_projected_vs_position_actual
        grounds:
          - calculations.staffing_cost_estimate
          - entities.StaffingAllocation.fields.cost_estimate_projected
          - entities.StaffingAllocation.fields.cost_estimate_actual
        distinguishing_aspect: |
          Staffing-domain dual variant (different entity domain from the revenue estimate):
          PROJECTED_ALLOCATION (allocated_fte 3.0 x district average 62,000 x 1.34) yields
          249,240.00 while POSITION_ACTUAL (per-slot salary basis 58,000 incumbent +
          71,000 incumbent + 64,000 base, x fte 1.0, x 1.34) yields 258,620.00 for the SAME
          allocation — a 9,380.00 divergence driven purely by variant selection.
        test_recipe:
          setup:
            - "FY2028 OPEN; ELEMENTARY projection 1200 pupils; budget version with one 1,000.00 line and a revenue estimate"
            - "Staffing allocation ELEMENTARY allocated_fte 3.0 (required 60.0) with three positions (1.0 FTE each, base salary 64,000)"
            - "Budget adopted (hearing held 2027-03-20, adopted 2027-03-27) so the allocation is AUTHORIZED and positions are OPEN"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { ep_e: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 1000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 1200000, other_revenue: 500000, cpi_rate: 0.034 }
              as: BusinessManager
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${ep_e}", allocated_fte: 3.0 }
              as: BudgetAnalyst
              captures: { sa: $.data.id }
            - call: "POST /district/staffing-allocations/${sa}/positions"
              payload: { title: "Teacher 1", fte: 1.0, base_salary: 64000 }
              as: BudgetAnalyst
              captures: { p1: $.data.id }
            - call: "POST /district/staffing-allocations/${sa}/positions"
              payload: { title: "Teacher 2", fte: 1.0, base_salary: 64000 }
              as: BudgetAnalyst
              captures: { p2: $.data.id }
            - call: "POST /district/staffing-allocations/${sa}/positions"
              payload: { title: "Teacher 3", fte: 1.0, base_salary: 64000 }
              as: BudgetAnalyst
              captures: { p3: $.data.id }
            - call: "POST /district/budget-versions/${bv}/propose"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/public-hearings/${h1}/hold"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-27T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/adopt"
              as: BoardClerk
          trigger:
            - call: "POST /district/positions/${p1}/fill"
              payload: { incumbent_salary: 58000 }
              as: Superintendent
            - call: "POST /district/positions/${p2}/fill"
              payload: { incumbent_salary: 71000 }
              as: Superintendent
            - call: "GET /district/staffing-allocations/${sa}"
              as: Auditor
          assert:
            - "StaffingAllocation.${sa}.cost_estimate_projected == 249240.00 (3.0 * 62000 * 1.34)"
            - "StaffingAllocation.${sa}.cost_estimate_actual == 258620.00 ((58000 + 71000 + 64000) * 1.0 * 1.34)"
            - "cost_estimate_actual != cost_estimate_projected — divergence 9380.00 from variant selection alone"
            - "Position.${p3} remains OPEN and contributes its base_salary 64000 to the POSITION_ACTUAL variant"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three instances, modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: staffing_fte_small_band_floor_vs_half_step_ceil
        grounds:
          - calculations.staffing_fte_requirement
          - entities.StaffingAllocation.fields.required_fte
        distinguishing_aspect: |
          Mode (a): the formula combines a conditional small-band floor (pupils < 40 -> 1.0),
          a per-band ratio, and ceil at half-FTE granularity: 39 ELEMENTARY pupils -> 1.0,
          41 MIDDLE pupils -> 2.0 (41/22 = 1.8636 -> x2 = 3.7272 -> ceil = 4 -> /2 = 2.0),
          800 HIGH pupils -> 36.5; allocated_fte may equal required_fte but not exceed it.
        test_recipe:
          setup:
            - "FY2028 OPEN with projections ELEMENTARY 39, MIDDLE 41, HIGH 800 and a budget version"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 39 }
              as: BudgetAnalyst
              captures: { ep_e: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "MIDDLE", projected_pupils: 41 }
              as: BudgetAnalyst
              captures: { ep_m: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "HIGH", projected_pupils: 800 }
              as: BudgetAnalyst
              captures: { ep_h: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${ep_e}", allocated_fte: 1.5 }
              as: BudgetAnalyst
              captures: { err_over: $.data.error_id }
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${ep_e}", allocated_fte: 1.0 }
              as: BudgetAnalyst
              captures: { sa_e: $.data.id, req_e: $.data.required_fte }
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "MIDDLE", enrollment_projection_id: "${ep_m}", allocated_fte: 2.0 }
              as: BudgetAnalyst
              captures: { req_m: $.data.required_fte }
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "HIGH", enrollment_projection_id: "${ep_h}", allocated_fte: 36.5 }
              as: BudgetAnalyst
              captures: { req_h: $.data.required_fte }
          assert:
            - "ELEMENTARY over-allocation (1.5 > 1.0) rejected: ${err_over} == ERR_ALLOCATION_EXCEEDS_FORMULA"
            - "ELEMENTARY (39 pupils) required_fte == 1.0 (small-band floor branch)"
            - "MIDDLE (41 pupils) required_fte == 2.0 (ceil at half-step granularity)"
            - "HIGH (800 pupils) required_fte == 36.5 (ceil((800/25)*2)/2 = 32.5 exactly, no ceil effect)"
            - "allocated_fte == required_fte exactly is accepted in all three bands (inclusive upper boundary)"

      - name: tax_rate_per_fund_rounding_then_sum
        grounds:
          - calculations.tax_extension_rates
          - entities.RevenueEstimate.fields.total_tax_rate
        distinguishing_aspect: |
          Mode (b): per-fund rates are rounded half-up to 4 decimals BEFORE summation.
          Levies 5,925,840 and 2,400,240 on eav_prior 480,000,000 give unrounded rates
          1.23455 and 0.50005 -> per-fund rounded 1.2346 + 0.5001 = 1.7347; the forbidden
          order (sum levies 8,326,080 then round) yields 1.7346 — one hundredth of a cent
          of rate apart, so the rounding order is observable and pinned.
        test_recipe:
          setup:
            - "FY2028 OPEN with one ELEMENTARY projection of 100 pupils and a budget version"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 100 }
              as: BudgetAnalyst
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 5925840, debt_service_levy: 2400240, other_revenue: 0, cpi_rate: 0.034 }
              as: BusinessManager
              captures: { re: $.data.id }
          assert:
            - "RevenueEstimate.${re}.capped_operating_levy == 5925840.00 (PTELL cap 9,306,000 does not bind)"
            - "operating_rate == 1.2346 (unrounded 1.23455 rounds half-up at the 4th decimal)"
            - "debt_service_rate == 0.5001 (unrounded 0.50005 rounds half-up)"
            - "total_tax_rate == 1.7347 — the sum of the two ROUNDED rates; sum-then-round would give 1.7346 and is forbidden"
            - "state_aid == 0.00 (max(0, 7600*100 - 0.023*480,000,000) floors at zero)"

      - name: ptell_cap_binds_before_rate_cap_check
        grounds:
          - calculations.ptell_capped_levy
          - entities.RevenueEstimate.fields.capped_operating_levy
        distinguishing_aspect: |
          Mode (c): pinned evaluation order — PTELL cap first (8,000,000 x 1.034 = 8,272,000),
          THEN the rate-cap check on the capped value. A 9,000,000 request whose RAW rate
          (1.8750) would violate the 1.8400 operating cap succeeds because the PTELL-capped
          8,272,000 has rate 1.7233; debt service is PTELL-exempt and added after.
        test_recipe:
          setup:
            - "FY2028 OPEN with prior_year_extension 8,000,000; one ELEMENTARY projection of 100 pupils; a budget version"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 8000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 100 }
              as: BudgetAnalyst
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 9000000, debt_service_levy: 1200000, other_revenue: 0, cpi_rate: 0.034 }
              as: BusinessManager
              captures: { re: $.data.id }
          assert:
            - "RevenueEstimate.${re}.capped_operating_levy == 8272000.00 (PTELL cap binds: 9,000,000 request cut to 8,272,000)"
            - "operating_rate == 1.7233 — computed from the CAPPED levy; the raw-request rate 1.8750 would have breached the 1.8400 cap, proving cap-then-rate order"
            - "total_levy == 9472000.00 (debt service 1,200,000 is PTELL-exempt, added after the cap)"
            - "total_tax_rate == 1.9733 (1.7233 + 0.2500)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (three instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: budget_version_propose_return_revision_loop
        grounds:
          - state_machines.BudgetVersion.PROPOSED_to_DRAFT
          - state_machines.BudgetVersion.HEARING_HELD_to_DRAFT
          - state_machines.PublicHearing.NOTICE_PUBLISHED_to_CANCELLED
        distinguishing_aspect: |
          BudgetVersion is CYCLIC: DRAFT -> PROPOSED -> DRAFT -> PROPOSED -> HEARING_HELD ->
          DRAFT is a legal path; each return-to-draft from PROPOSED cancels that version's
          NOTICE_PUBLISHED hearings, and returning from HEARING_HELD clears hearing_held_date,
          so a recycled version carries no stale hearing credit.
        test_recipe:
          setup:
            - "FY2028 OPEN; budget version v1 with one line and a revenue estimate"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 1000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 1200000, other_revenue: 500000, cpi_rate: 0.034 }
              as: BusinessManager
            - call: "POST /district/budget-versions/${bv}/propose"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h1: $.data.id }
            - call: "POST /district/public-hearings/${h1}/cancel"
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/public-hearings/${h2}/hold"
              as: BoardClerk
          trigger:
            - call: "POST /district/budget-versions/${bv}/return-to-draft"
              as: BoardClerk
              captures: { st1: $.data.status, hhd: $.data.hearing_held_date }
            - call: "POST /district/budget-versions/${bv}/propose"
              as: BoardClerk
              captures: { st2: $.data.status }
            - call: "POST /district/budget-versions/${bv}/hearings"
              payload: { venue: "GYMNASIUM", hearing_date: "2027-04-05" }
              as: BoardClerk
              captures: { h3: $.data.id }
            - call: "POST /district/budget-versions/${bv}/return-to-draft"
              as: BoardClerk
              captures: { st3: $.data.status }
            - call: "GET /district/budget-versions/${bv}/hearings"
              as: Auditor
              captures: { h3_status: "$.data[2].status" }
          assert:
            - "First return-to-draft from HEARING_HELD: status == DRAFT and hearing_held_date == null (stale hearing credit cleared)"
            - "Re-propose succeeds from DRAFT: status == PROPOSED (cycle, not a dead end)"
            - "Second return-to-draft from PROPOSED: status == DRAFT and the pending hearing h3 was cascade-CANCELLED (hearings list index 2 status == CANCELLED)"
            - "Held hearing h2 remains HELD (only NOTICE_PUBLISHED hearings are cancelled by the loop)"

      - name: expenditure_parallel_review_and_payment_dimensions
        grounds:
          - state_machines.ProjectExpenditure
          - entities.ProjectExpenditure.fields.review_status
          - entities.ProjectExpenditure.fields.payment_status
        distinguishing_aspect: |
          ProjectExpenditure carries TWO independent state dimensions: review_status cycles
          PENDING_REVIEW -> FLAGGED -> REVIEWED while payment_status stays UNPAID; disburse
          is gated on review REVIEWED but review transitions are gated on payment UNPAID —
          after disbursement (payment DISBURSED) a further review flip is rejected.
        test_recipe:
          setup:
            - "FY2028 OPEN; bond proposal 18,000,000 with one project (6,000,000, HS-01) BOARD_APPROVED, referred, and PASSED at the 2027-11-02 election"
            - "Bond sale 2027-A CLOSED (par 10,000,000 + premium 150,000 - costs 80,000 = net 10,070,000); project activated (IN_PROGRESS)"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
