              payload: { reviewer_findings: "Parachute deployment altitude is not documented; resubmit with the minimum safe height." }
              as: SafetyReviewer
              as_user_id: "rev-07"
              captures: { round_after_revision: $.data.revision_round }
            - call: "POST /drone-ops/waivers/${wid}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/waivers/${wid}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "rev-07"
            - call: "POST /drone-ops/waivers/${wid}/clear-safety-case"
