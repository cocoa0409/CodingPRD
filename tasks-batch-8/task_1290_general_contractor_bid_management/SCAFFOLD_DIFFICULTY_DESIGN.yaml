              as: Anonymous
              captures: { sub_y: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Z Add LLC", contact_email: "za@x.com", license_number: "LIC-Z-601" }
              as: Anonymous
              captures: { sub_z: $.data.id }
