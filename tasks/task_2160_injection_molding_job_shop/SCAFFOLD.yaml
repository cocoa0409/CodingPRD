# =============================================================================
# PRD Benchmark Seed Tables — Injection Molding Job Shop (task_2160)
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#            §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: >-
  desgin task harder than expert level.!!!!2160. Injection Molding Job Shop (Protolabs / regional
  custom molder): mold/tool ownership & tonnage-press routing, quote (cycle-time/cavitation/resin)
  & cost roll, resin lot & regrind ratio, first-article & PPAP approval, scrap/short-shot & yield
  accounting, mold maintenance cycle & shot counter, customer-owned tool transfer, run-at-rate &
  capacity commit

domain_name: injection-molding-job-shop

# Flat topology: every resource is its own top-level collection and children carry
# foreign keys in the request body. There is no single owning root resource, so the
# API prefix is empty and all §1.5 paths below are absolute.
api_prefix: ""

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys carried in request bodies. No nested URL
  # paths: /molds/{id}, /production-jobs/{id}, /production-reports/{id} are all
  # top-level collections; reverse navigation is by filtered list endpoints.

  state_machine_shape: cyclic
  # ProductionJob carries two independent axes (run_status x material_status) and a
  # SCHEDULED -> BLOCKED -> SCHEDULED loop; Mold carries status x service_state with a
  # SERVICEABLE -> PM_DUE -> IN_MAINTENANCE -> SERVICEABLE loop; PPAPSubmission loops
  # REJECTED -> DRAFT on revision; PressQualification loops FAILED -> RUN_AT_RATE_SCHEDULED.

  relationship_patterns:
    - one_to_many          # Customer -> Mold, Mold -> ProductionJob, ProductionJob -> ProductionReport
    - many_to_many         # PressQualification is the Mold x Press junction (run-at-rate record)
    - self_referential     # PPAPSubmission.supersedes_submission_id -> PPAPSubmission.id (revision chain)
    - cross_aggregate      # ProductionReport mutates Mold (shot counter) and ResinLot (mass balance)

  role_model: segregation_of_duties
  # The QualityEngineer user id that submitted a PPAPSubmission may not endorse it at
  # internal review; the customer decision is reserved to the owning CustomerRep.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the buying customer" }
      - { name: code, type: string, source: input, description: "Short customer code", constraints: "unique across all Customers; 2-16 chars" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "When true the customer may not accept quotes or open capacity commits" }

  - name: Press
    parent: null
    common_fields: true
    fields:
      - { name: press_code, type: string, source: input, description: "Machine identifier on the floor", constraints: "unique across all Presses" }
      - { name: tonnage, type: integer, source: input, description: "Clamp tonnage of the machine", constraints: ">= 1" }
      - { name: shot_size_grams_max, type: integer, source: input, description: "Maximum shot mass the barrel can deliver, in grams", constraints: ">= 1" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Machine burden rate in cents per hour, used by every cost roll", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OFFLINE. Only AVAILABLE presses are routing candidates" }
      - { name: committed_minutes_scheduled, type: integer, source: computed, default: 0, description: "Sum of (scheduled_end - scheduled_start) in whole minutes over ProductionJobs on this press whose run_status IN {SCHEDULED, RUNNING}" }

  - name: Mold
    parent: null
    common_fields: true
    fields:
      - { name: mold_code, type: string, source: input, description: "Tool identifier stamped on the mold base", constraints: "unique across all Molds" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer whose part program this tool runs" }
      - { name: cavity_count, type: integer, source: input, description: "Number of cavities; parts produced per shot", constraints: ">= 1" }
      - { name: shot_weight_grams, type: integer, source: input, description: "Total shot mass including runner, in grams", constraints: ">= 1" }
      - { name: required_min_tonnage, type: integer, source: input, description: "Lowest clamp tonnage that may run this tool", constraints: ">= 1" }
      - { name: required_max_tonnage, type: integer, source: input, description: "Highest clamp tonnage that may run this tool", constraints: ">= required_min_tonnage" }
      - { name: pm_interval_shots, type: integer, source: input, description: "Shots between preventive maintenance events", constraints: ">= 1" }
      - { name: tooling_cost_cents, type: integer, source: input, description: "Capitalised tool cost amortised into shop-owned quotes", constraints: ">= 0" }
      - { name: ownership, type: enum, source: input, default: SHOP_OWNED, description: "SHOP_OWNED | CUSTOMER_OWNED. Drives whether tooling amortisation enters the quote" }
      - { name: status, type: enum, source: system, default: NEW, description: "NEW | SAMPLING | PPAP_APPROVED | INTERIM_APPROVED | QUARANTINED | TRANSFERRED | RETIRED (lifecycle axis)" }
      - { name: service_state, type: enum, source: system, default: SERVICEABLE, description: "SERVICEABLE | PM_DUE | IN_MAINTENANCE (maintenance axis, independent of status)" }
      - { name: total_shot_count, type: integer, source: computed, default: 0, description: "Sum of ProductionReport.shots over non-reversed reports whose job.mold_id == this mold" }
      - { name: shots_since_pm, type: integer, source: computed, default: 0, description: "Shots accumulated since the last MaintenanceOrder closed with reset_shot_counter true" }
      - { name: approved_max_regrind_bp, type: integer, source: computed, description: "Regrind ceiling in basis points copied from the PPAPSubmission that most recently reached APPROVED or INTERIM_APPROVED; null until then" }
      - { name: interim_expiry_shots, type: integer, source: computed, description: "Total shot count at which an INTERIM_APPROVED PPAP lapses; null when the approval is full" }
      - { name: active_transfer_id, type: string, source: computed, description: "Id of the ToolTransfer for this mold whose status IN {REQUESTED, APPROVED}; null when none (audit reference, not a routing input)" }

  - name: PressQualification
    parent: null
    common_fields: true
    fields:
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; the tool being qualified" }
      - { name: press_id, type: string, source: input, description: "FK -> Press.id; the machine being qualified" }
      - { name: status, type: enum, source: system, default: UNQUALIFIED, description: "UNQUALIFIED | RUN_AT_RATE_SCHEDULED | QUALIFIED | FAILED | REVOKED" }
      - { name: scheduled_start, type: datetime, source: system, description: "Start of the booked run-at-rate trial window, ISO 8601 UTC; null until scheduled" }
      - { name: scheduled_end, type: datetime, source: system, description: "End of the booked run-at-rate trial window, ISO 8601 UTC; null until scheduled" }
      - { name: target_parts_per_hour, type: integer, source: system, description: "Contracted rate the trial must hit; null until scheduled" }
      - { name: actual_parts_per_hour, type: integer, source: system, description: "Rate observed during the trial; null until recorded" }
      - { name: attempt_count, type: integer, source: computed, default: 0, description: "Number of run-at-rate trials recorded on this junction row" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the quoting customer" }
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; the tool the quote is priced against" }
      - { name: part_weight_grams, type: integer, source: input, description: "Finished mass of a single part, in grams", constraints: ">= 1" }
      - { name: cycle_time_sec, type: integer, source: input, description: "Nominal molding cycle in whole seconds", constraints: ">= 1" }
      - { name: cavitation, type: integer, source: input, description: "Cavities run for this quote; may be lower than Mold.cavity_count when cavities are blocked off", constraints: ">= 1 and <= Mold.cavity_count" }
      - { name: resin_grade, type: string, source: input, description: "Resin specification; ProductionJob material staging must match it" }
      - { name: resin_price_cents_per_kg, type: integer, source: input, description: "Contracted resin price in cents per kilogram", constraints: ">= 1" }
      - { name: annual_volume, type: integer, source: input, description: "Estimated annual part volume; selects the margin tier", constraints: ">= 1" }
      - { name: rate_press_id, type: string, source: computed, description: "FK -> Press.id; the press whose hourly_rate_cents was used at pricing time; null until PRICED" }
      - { name: margin_bp, type: integer, source: computed, description: "Margin in basis points selected from annual_volume at pricing time" }
      - { name: quoted_lot_price_cents, type: integer, source: computed, description: "Price of one 1000-part lot from the quoted_estimate variant of quote_piece_price" }
      - { name: quoted_piece_price_cents, type: integer, source: computed, description: "Per-piece price in cents from the quoted_estimate variant of quote_piece_price" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PRICED | SUBMITTED | ACCEPTED | DECLINED | SUPERSEDED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the CustomerRep who accepted or declined; audit only, not a foreign key" }

  - name: PPAPSubmission
    parent: null
    common_fields: true
    fields:
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; the tool this submission qualifies" }
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the accepted quote the submission is filed against" }
      - { name: level, type: integer, source: input, description: "PPAP level 1-5", constraints: "1 <= level <= 5" }
      - { name: max_regrind_bp, type: integer, source: input, description: "Regrind ceiling this submission asks the customer to approve, in basis points", constraints: "0 <= max_regrind_bp <= 10000" }
      - { name: supersedes_submission_id, type: string, source: input, description: "FK -> PPAPSubmission.id; the REJECTED submission this one replaces; null for a first filing" }
      - { name: revision_no, type: integer, source: computed, default: 1, description: "Increments by one each time the submission is revised out of REJECTED" }
      - { name: fai_dimensional_pass, type: boolean, source: system, description: "First-article dimensional verdict captured at submit; null while DRAFT" }
      - { name: fai_sample_shots, type: integer, source: system, description: "Shot count of the first-article sample run captured at submit; null while DRAFT" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the QualityEngineer who submitted; audit only, not a foreign key" }
      - { name: internal_reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the endorser at internal review; audit only, not a foreign key" }
      - { name: customer_decided_by_user_id, type: string, source: system, description: "X-User-ID of the CustomerRep who rendered the customer decision; audit only, not a foreign key" }
      - { name: interim_expiry_shots, type: integer, source: system, description: "Shot ceiling attached to an INTERIM_APPROVED decision; null otherwise" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | INTERIM_APPROVED | REJECTED" }

  - name: ResinLot
    parent: null
    common_fields: true
    fields:
      - { name: resin_grade, type: string, source: input, description: "Resin specification of the delivered material" }
      - { name: supplier_lot_code, type: string, source: input, description: "Supplier traceability code", constraints: "unique across all ResinLots" }
      - { name: qty_kg_received, type: integer, source: input, description: "Kilograms received at the dock", constraints: ">= 1" }
      - { name: moisture_bp, type: integer, source: input, description: "Incoming moisture in basis points of mass", constraints: "0 <= moisture_bp <= 10000" }
      - { name: qty_grams_remaining, type: integer, source: computed, description: "qty_kg_received * 1000 minus the sum of virgin_grams over non-reversed ProductionReports pointing at this lot" }
      - { name: status, type: enum, source: system, default: QUARANTINE, description: "QUARANTINE | RELEASED | HOLD | REJECTED | DEPLETED" }

  - name: ProductionJob
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the ACCEPTED quote this job runs" }
      - { name: mold_id, type: string, source: system, description: "FK -> Mold.id; snapshot copied from the quote at creation" }
      - { name: press_id, type: string, source: system, description: "FK -> Press.id; supplied by the caller or chosen by press_routing_selection at creation" }
      - { name: staged_resin_lot_id, type: string, source: system, description: "FK -> ResinLot.id; the lot bound by stage-material; null while material_status is UNSTAGED" }
      - { name: planned_qty, type: integer, source: input, description: "Good parts the job is expected to deliver", constraints: ">= 1" }
      - { name: scheduled_start, type: datetime, source: input, description: "Start of the press occupancy window, ISO 8601 UTC, whole minutes" }
      - { name: scheduled_end, type: datetime, source: input, description: "End of the press occupancy window, ISO 8601 UTC, whole minutes", constraints: "strictly after scheduled_start" }
      - { name: run_status, type: enum, source: system, default: DRAFT, description: "DRAFT | SCHEDULED | BLOCKED | RUNNING | COMPLETED | CANCELLED (run axis)" }
      - { name: material_status, type: enum, source: system, default: UNSTAGED, description: "UNSTAGED | STAGED | CONSUMED (material axis, independent of run_status)" }
      - { name: block_reason, type: string, source: system, description: "Why the job was moved to BLOCKED; null otherwise" }
      - { name: total_shots, type: integer, source: computed, default: 0, description: "Sum of shots over non-reversed ProductionReports on this job" }
      - { name: parts_molded_total, type: integer, source: computed, default: 0, description: "Sum of (shots * Mold.cavity_count) over non-reversed ProductionReports on this job" }
      - { name: good_parts_total, type: integer, source: computed, default: 0, description: "Sum of good_parts over non-reversed ProductionReports on this job" }
      - { name: scrap_parts_total, type: integer, source: computed, default: 0, description: "Sum of scrap_parts over non-reversed ProductionReports on this job" }
      - { name: short_shot_shots_total, type: integer, source: computed, default: 0, description: "Sum of short_shot_shots over non-reversed ProductionReports on this job" }
      - { name: total_run_minutes, type: integer, source: computed, default: 0, description: "Sum of run_minutes over non-reversed ProductionReports on this job" }
      - { name: cumulative_regrind_bp, type: integer, source: computed, default: 0, description: "Job-level regrind ratio in basis points per the regrind_ratio_control calculation" }
      - { name: first_pass_yield_bp, type: integer, source: computed, default: 10000, description: "good_parts_total / parts_molded_total in basis points, floored; 10000 while parts_molded_total is 0" }
      - { name: actual_cycle_time_sec, type: integer, source: computed, description: "round_half_up(total_run_minutes * 60 / total_shots); null while total_shots is 0" }
      - { name: job_direct_cost_cents, type: integer, source: computed, default: 0, description: "Sum of ProductionReport.report_direct_cost_cents over non-reversed reports (per-line rounding, then sum)" }
      - { name: job_overhead_cents, type: integer, source: computed, default: 0, description: "Overhead burden from job_cost_roll, keyed on job_direct_cost_cents before overhead is added" }
      - { name: job_total_cost_cents, type: integer, source: computed, default: 0, description: "job_direct_cost_cents + job_overhead_cents" }
      - { name: as_run_piece_price_cents, type: integer, source: computed, description: "Per-piece price from the as_run_actual variant of quote_piece_price; null until run_status is COMPLETED" }
      - { name: price_variance_cents, type: integer, source: computed, description: "as_run_piece_price_cents - Quote.quoted_piece_price_cents; null until run_status is COMPLETED" }

  - name: ProductionReport
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ProductionJob.id; the job this shift report belongs to" }
      - { name: resin_lot_id, type: string, source: system, description: "FK -> ResinLot.id; snapshot of the job's staged_resin_lot_id at posting time" }
      - { name: shots, type: integer, source: input, description: "Shots taken during the reported interval", constraints: ">= 1" }
      - { name: short_shot_shots, type: integer, source: input, description: "Shots that filled incompletely", constraints: "0 <= short_shot_shots <= shots" }
      - { name: good_parts, type: integer, source: input, description: "Parts accepted at the press", constraints: ">= 0" }
      - { name: scrap_parts, type: integer, source: input, description: "Parts rejected at the press", constraints: ">= 0" }
      - { name: virgin_grams, type: integer, source: input, description: "Virgin resin drawn from the staged ResinLot, in grams", constraints: ">= 0" }
      - { name: regrind_grams, type: integer, source: input, description: "Regrind drawn from the grinder bin, in grams", constraints: ">= 0" }
      - { name: run_minutes, type: integer, source: input, description: "Whole minutes of press occupancy covered by this report", constraints: ">= 1" }
      - { name: instantaneous_regrind_bp, type: integer, source: computed, description: "This report's own regrind ratio in basis points" }
      - { name: report_direct_cost_cents, type: integer, source: computed, description: "Machine burden plus material cost for this report line, rounded once at the line" }
      - { name: is_reversed, type: boolean, source: system, default: false, description: "True once the report has been reversed; reversed reports leave every rollup unchanged" }
      - { name: reversal_reason, type: string, source: system, description: "Reason captured at reversal; null while is_reversed is false" }

  - name: MaintenanceOrder
    parent: null
    common_fields: true
    fields:
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; the tool going into the toolroom" }
      - { name: kind, type: enum, source: input, description: "PM | REPAIR" }
      - { name: window_start, type: datetime, source: input, description: "Start of the toolroom occupancy window, ISO 8601 UTC, whole minutes" }
      - { name: window_end, type: datetime, source: input, description: "End of the toolroom occupancy window, ISO 8601 UTC, whole minutes", constraints: "strictly after window_start" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED" }
      - { name: shots_at_open, type: integer, source: system, description: "Mold.shots_since_pm captured when the order was opened" }
      - { name: shots_reset, type: boolean, source: system, default: false, description: "True when closing the order zeroed Mold.shots_since_pm" }

  - name: ToolTransfer
    parent: null
    common_fields: true
    fields:
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; the tool changing hands" }
      - { name: to_customer_id, type: string, source: input, description: "FK -> Customer.id; the customer taking ownership" }
      - { name: from_ownership, type: enum, source: system, description: "SHOP_OWNED | CUSTOMER_OWNED; snapshot of Mold.ownership at request time" }
      - { name: settlement_cents, type: integer, source: input, description: "Buy-out amount agreed for the tool, in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | DECLINED | COMPLETED" }
      - { name: decision_reason, type: string, source: system, description: "Reason captured with the approve/decline decision; null until decided" }

  - name: CapacityCommit
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer buying press time" }
      - { name: press_id, type: string, source: input, description: "FK -> Press.id; the machine whose time is committed" }
      - { name: window_start, type: datetime, source: input, description: "Start of the commitment window, ISO 8601 UTC, whole minutes" }
      - { name: window_end, type: datetime, source: input, description: "End of the commitment window, ISO 8601 UTC, whole minutes", constraints: "strictly after window_start" }
      - { name: committed_minutes, type: integer, source: input, description: "Press minutes the customer commits to consume inside the window", constraints: ">= 1" }
      - { name: shortfall_policy, type: enum, source: input, description: "STRICT | GOODWILL; selects the capacity_commit_settlement variant" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SETTLED | CANCELLED" }
      - { name: consumed_minutes, type: integer, source: computed, default: 0, description: "Press minutes consumed inside the window by this customer's jobs; frozen at settlement" }
      - { name: shortfall_minutes, type: integer, source: computed, default: 0, description: "max(0, committed_minutes - consumed_minutes); computed at settlement" }
      - { name: shortfall_fee_cents, type: integer, source: computed, default: 0, description: "Fee produced by the capacity_commit_settlement variant named by shortfall_policy" }
      - { name: utilization_bp, type: integer, source: computed, default: 0, description: "floor(consumed_minutes * 10000 / committed_minutes); computed at settlement" }

# =============================================================================
# §1.2 State Machine Table
# Two entities carry parallel state axes: ProductionJob (run_status x
# material_status) and Mold (status x service_state). Each axis is listed as its
# own machine and identified by `dimension:`.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Quote ----
  - entity: Quote
    dimension: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /quotes/{id}/price"
        actor: SalesEngineer
        preconditions:
          - "Mold.status NOT IN {TRANSFERRED, RETIRED}"
          - "Quote.cavitation <= Mold.cavity_count"
          - "when press_id is supplied: that Press exists, Press.status == AVAILABLE, Mold.required_min_tonnage <= Press.tonnage <= Mold.required_max_tonnage, Press.shot_size_grams_max >= Mold.shot_weight_grams"
          - "when press_id is omitted: the rate_press_selection candidate set of quote_press_rate_selection is non-empty"
        side_effects:
          - "rate_press_id set to the supplied or selected Press.id"
          - "margin_bp, quoted_lot_price_cents and quoted_piece_price_cents recomputed by calculation quote_piece_price, variant quoted_estimate"

      - from: PRICED
        to: SUBMITTED
        trigger: "POST /quotes/{id}/submit"
        actor: SalesEngineer
        preconditions:
          - "Quote.quoted_piece_price_cents is not null"
        side_effects:
          - "no field other than status, updated_at and version changes"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /quotes/{id}/customer-decision with decision ACCEPT"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == Quote.customer_id"
          - "expected_mold_version == Mold.version"
          - "Customer.credit_hold == false"
          - "Mold.status IN {NEW, SAMPLING}"
        side_effects:
          - "Quote.decided_by_user_id set to X-User-ID"
          - "Mold.status NEW -> SAMPLING (no-op when already SAMPLING); Mold.version incremented by 1"
          - "every other Quote with the same mold_id whose status IN {DRAFT, PRICED, SUBMITTED} transitions to SUPERSEDED"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /quotes/{id}/customer-decision with decision DECLINE"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == Quote.customer_id"
          - "expected_mold_version == Mold.version"
        side_effects:
          - "Quote.decided_by_user_id set to X-User-ID; Mold is not mutated and Mold.version is unchanged"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a sibling Quote on the same mold_id reaches ACCEPTED"
        actor: system
        preconditions:
          - "the accepted sibling Quote has the same mold_id and a different id"
        side_effects:
          - "no further cascade; a SUPERSEDED quote can no longer be submitted, decided or used to open a ProductionJob"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a sibling Quote on the same mold_id reaches ACCEPTED"
        actor: system
        preconditions:
          - "the accepted sibling Quote has the same mold_id and a different id"
        side_effects:
          - "no further cascade; an unpriced quote is closed out with the rest"

      - from: PRICED
        to: SUPERSEDED
        trigger: "system: a sibling Quote on the same mold_id reaches ACCEPTED"
        actor: system
        preconditions:
          - "the accepted sibling Quote has the same mold_id and a different id"
        side_effects:
          - "no further cascade"

  # ------------------------------------------------- Mold — lifecycle axis ----
  - entity: Mold
    dimension: status
    initial_state: NEW
    terminal_states: [TRANSFERRED, RETIRED]
    transitions:
      - from: NEW
        to: SAMPLING
        trigger: "POST /quotes/{id}/customer-decision with decision ACCEPT"
        actor: CustomerRep
        preconditions:
          - "the accepting Quote.mold_id == Mold.id and Quote.status == SUBMITTED"
        side_effects:
          - "Mold.version incremented by 1"

      - from: SAMPLING
        to: PPAP_APPROVED
        trigger: "POST /ppap-submissions/{id}/customer-decision with decision APPROVE"
        actor: CustomerRep
        preconditions:
          - "PPAPSubmission.status == UNDER_REVIEW and PPAPSubmission.mold_id == Mold.id"
          - "expected_mold_version == Mold.version"
        side_effects:
          - "Mold.approved_max_regrind_bp set to PPAPSubmission.max_regrind_bp"
          - "Mold.interim_expiry_shots set to null"
          - "Mold.version incremented by 1"

      - from: SAMPLING
        to: INTERIM_APPROVED
        trigger: "POST /ppap-submissions/{id}/customer-decision with decision INTERIM_APPROVE"
        actor: CustomerRep
        preconditions:
          - "PPAPSubmission.status == UNDER_REVIEW and PPAPSubmission.mold_id == Mold.id"
          - "expected_mold_version == Mold.version"
          - "interim_expiry_shots is supplied and >= 1"
        side_effects:
          - "Mold.approved_max_regrind_bp set to PPAPSubmission.max_regrind_bp"
          - "Mold.interim_expiry_shots set to Mold.total_shot_count + interim_expiry_shots"
          - "Mold.version incremented by 1"

      - from: SAMPLING
        to: QUARANTINED
        trigger: "POST /molds/{id}/quality-hold with action QUARANTINE"
        actor: QualityEngineer
        preconditions:
          - "Mold.status == SAMPLING"
        side_effects:
          - "no ProductionJob can exist on a SAMPLING mold, so no cascade fires; an UNDER_REVIEW PPAPSubmission can no longer be approved until the mold is released"

      - from: PPAP_APPROVED
        to: QUARANTINED
        trigger: "POST /molds/{id}/quality-hold with action QUARANTINE"
        actor: QualityEngineer
        preconditions:
          - "Mold.status IN {SAMPLING, PPAP_APPROVED, INTERIM_APPROVED}"
        side_effects:
          - "CASCADE LINK 1 -> 2: every ProductionJob with this mold_id whose run_status == SCHEDULED transitions to BLOCKED with block_reason MOLD_QUARANTINED"
          - "each such job's own BLOCKED transition then fires its documented side effects (material de-stage and press minute release)"

      - from: INTERIM_APPROVED
        to: QUARANTINED
        trigger: "system: a ProductionReport pushes Mold.total_shot_count to or past Mold.interim_expiry_shots"
        actor: system
        preconditions:
          - "Mold.interim_expiry_shots is not null and Mold.total_shot_count >= Mold.interim_expiry_shots"
        side_effects:
          - "CASCADE LINK 1 -> 2: every ProductionJob with this mold_id whose run_status == SCHEDULED transitions to BLOCKED with block_reason INTERIM_PPAP_EXPIRED"

      - from: QUARANTINED
        to: PPAP_APPROVED
        trigger: "POST /molds/{id}/quality-hold with action RELEASE"
        actor: QualityEngineer
        preconditions:
          - "Mold.status == QUARANTINED"
          - "Mold.approved_max_regrind_bp is not null (the tool had already reached an approved PPAP before it was quarantined)"
        side_effects:
          - "Mold.interim_expiry_shots set to null; an approved tool always returns to full PPAP_APPROVED, never to INTERIM_APPROVED"
          - "BLOCKED jobs are NOT auto-restored; each must be unblocked explicitly via POST /production-jobs/{id}/unblock"

      - from: QUARANTINED
        to: SAMPLING
        trigger: "POST /molds/{id}/quality-hold with action RELEASE"
        actor: QualityEngineer
        preconditions:
          - "Mold.status == QUARANTINED"
          - "Mold.approved_max_regrind_bp is null (the tool was quarantined while still SAMPLING)"
        side_effects:
          - "the pending PPAPSubmission becomes decidable again; no job cascade fires because a SAMPLING mold never had jobs"

      - from: PPAP_APPROVED
        to: TRANSFERRED
        trigger: "POST /tool-transfers/{id}/complete"
        actor: PlantAdmin
        preconditions:
          - "ToolTransfer.status == APPROVED and ToolTransfer.mold_id == Mold.id"
          - "expected_mold_version == Mold.version"
        side_effects:
          - "Mold.ownership set to CUSTOMER_OWNED; Mold.customer_id set to ToolTransfer.to_customer_id; Mold.active_transfer_id set to null; Mold.version incremented by 1"
          - "CASCADE LINK 1 -> 2: every PressQualification with this mold_id whose status == QUALIFIED transitions to REVOKED"
          - "each REVOKED qualification then fires its own documented side effect (job cancellation), which is CASCADE LINK 2 -> 3"

      - from: NEW
        to: RETIRED
        trigger: "POST /molds/{id}/retire"
        actor: PlantAdmin
        preconditions:
          - "no ProductionJob with this mold_id has run_status IN {SCHEDULED, BLOCKED, RUNNING}"
        side_effects:
          - "every PressQualification with this mold_id whose status == QUALIFIED transitions to REVOKED; a tool scrapped before sampling simply carries its qualifications down with it"

      - from: PPAP_APPROVED
        to: RETIRED
        trigger: "POST /molds/{id}/retire"
        actor: PlantAdmin
        preconditions:
          - "no ProductionJob with this mold_id has run_status IN {SCHEDULED, BLOCKED, RUNNING}"
        side_effects:
          - "every PressQualification with this mold_id whose status == QUALIFIED transitions to REVOKED"

  # ----------------------------------------------- Mold — maintenance axis ----
  - entity: Mold
    dimension: service_state
    initial_state: SERVICEABLE
    terminal_states: []
    transitions:
      - from: SERVICEABLE
        to: PM_DUE
        trigger: "system: POST /production-reports pushes Mold.shots_since_pm to or past Mold.pm_interval_shots"
        actor: system
        preconditions:
          - "Mold.shots_since_pm >= Mold.pm_interval_shots after the report's shots are added"
        side_effects:
          - "CASCADE LINK 1 -> 2: every ProductionJob with this mold_id whose run_status == SCHEDULED transitions to BLOCKED with block_reason MOLD_PM_DUE"
          - "the job posting the report keeps run_status RUNNING; only SCHEDULED jobs are blocked"

      - from: PM_DUE
        to: IN_MAINTENANCE
        trigger: "POST /maintenance-orders"
        actor: ToolroomTech
        preconditions:
          - "no other MaintenanceOrder on this mold has status OPEN"
        side_effects:
          - "MaintenanceOrder.shots_at_open set to Mold.shots_since_pm"

      - from: SERVICEABLE
        to: IN_MAINTENANCE
        trigger: "POST /maintenance-orders"
        actor: ToolroomTech
        preconditions:
          - "no other MaintenanceOrder on this mold has status OPEN"
        side_effects:
          - "MaintenanceOrder.shots_at_open set to Mold.shots_since_pm"

      - from: IN_MAINTENANCE
        to: SERVICEABLE
        trigger: "POST /maintenance-orders/{id}/close with reset_shot_counter true"
        actor: ToolroomTech
        preconditions:
          - "MaintenanceOrder.status == OPEN"
          - "expected_mold_version == Mold.version"
        side_effects:
          - "Mold.shots_since_pm set to 0; Mold.total_shot_count is NOT reset; MaintenanceOrder.shots_reset set to true; Mold.version incremented by 1"

      - from: IN_MAINTENANCE
        to: PM_DUE
        trigger: "POST /maintenance-orders/{id}/close with reset_shot_counter false"
        actor: ToolroomTech
        preconditions:
          - "MaintenanceOrder.status == OPEN"
          - "expected_mold_version == Mold.version"
          - "Mold.shots_since_pm >= Mold.pm_interval_shots"
        side_effects:
          - "Mold.shots_since_pm left untouched; MaintenanceOrder.shots_reset stays false; Mold.version incremented by 1"

  # ------------------------------------------------------ PPAPSubmission ----
  - entity: PPAPSubmission
    dimension: status
    initial_state: DRAFT
    terminal_states: [APPROVED, INTERIM_APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ppap-submissions/{id}/submit"
        actor: QualityEngineer
        preconditions:
          - "Mold.status == SAMPLING"
          - "fai_dimensional_pass == true"
          - "fai_sample_shots >= MIN_FAI_SAMPLE_SHOTS"
        side_effects:
          - "fai_dimensional_pass and fai_sample_shots stored; submitted_by_user_id set to X-User-ID"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /ppap-submissions/{id}/internal-review with decision ENDORSE"
        actor: QualityEngineer
        preconditions:
          - "X-User-ID != PPAPSubmission.submitted_by_user_id"
        side_effects:
          - "internal_reviewed_by_user_id set to X-User-ID"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ppap-submissions/{id}/internal-review with decision REJECT"
        actor: QualityEngineer
        preconditions:
          - "X-User-ID != PPAPSubmission.submitted_by_user_id"
        side_effects:
          - "internal_reviewed_by_user_id set to X-User-ID; Mold is not mutated"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /ppap-submissions/{id}/customer-decision with decision APPROVE"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == Mold.customer_id"
          - "expected_mold_version == Mold.version"
          - "Mold.status == SAMPLING"
        side_effects:
          - "customer_decided_by_user_id set to X-User-ID"
          - "Mold.status SAMPLING -> PPAP_APPROVED with approved_max_regrind_bp copied over; Mold.version incremented by 1"

      - from: UNDER_REVIEW
        to: INTERIM_APPROVED
        trigger: "POST /ppap-submissions/{id}/customer-decision with decision INTERIM_APPROVE"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == Mold.customer_id"
          - "expected_mold_version == Mold.version"
          - "Mold.status == SAMPLING"
          - "interim_expiry_shots supplied and >= 1"
        side_effects:
          - "PPAPSubmission.interim_expiry_shots stored; Mold.status SAMPLING -> INTERIM_APPROVED; Mold.interim_expiry_shots set to Mold.total_shot_count + interim_expiry_shots; Mold.version incremented by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /ppap-submissions/{id}/customer-decision with decision REJECT"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == Mold.customer_id"
          - "expected_mold_version == Mold.version"
        side_effects:
          - "customer_decided_by_user_id set to X-User-ID; Mold is not mutated and Mold.version is unchanged"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /ppap-submissions/{id}/revise"
        actor: QualityEngineer
        preconditions:
          - "Mold.status == SAMPLING"
        side_effects:
          - "revision_no incremented by 1; fai_dimensional_pass, fai_sample_shots, submitted_by_user_id, internal_reviewed_by_user_id and customer_decided_by_user_id all reset to null"
          - "max_regrind_bp replaced when the request supplies one"

  # --------------------------------------------------- PressQualification ----
  - entity: PressQualification
    dimension: status
    initial_state: UNQUALIFIED
    terminal_states: []
    transitions:
      - from: UNQUALIFIED
        to: RUN_AT_RATE_SCHEDULED
        trigger: "POST /press-qualifications/{id}/schedule-run-at-rate"
        actor: ProcessEngineer
        preconditions:
          - "Press.status == AVAILABLE"
          - "Mold.status NOT IN {TRANSFERRED, RETIRED}"
          - "scheduled_start < scheduled_end"
        side_effects:
          - "scheduled_start, scheduled_end and target_parts_per_hour stored"

      - from: RUN_AT_RATE_SCHEDULED
        to: QUALIFIED
        trigger: "POST /press-qualifications/{id}/record-run-at-rate"
        actor: QualityEngineer
        preconditions:
          - "actual_parts_per_hour * 10000 >= target_parts_per_hour * RUN_AT_RATE_MIN_BP"
        side_effects:
          - "actual_parts_per_hour stored; attempt_count incremented by 1"

      - from: RUN_AT_RATE_SCHEDULED
        to: FAILED
        trigger: "POST /press-qualifications/{id}/record-run-at-rate"
        actor: QualityEngineer
        preconditions:
          - "actual_parts_per_hour * 10000 < target_parts_per_hour * RUN_AT_RATE_MIN_BP"
        side_effects:
          - "actual_parts_per_hour stored; attempt_count incremented by 1"

      - from: FAILED
        to: RUN_AT_RATE_SCHEDULED
        trigger: "POST /press-qualifications/{id}/schedule-run-at-rate"
        actor: ProcessEngineer
        preconditions:
          - "Press.status == AVAILABLE"
          - "scheduled_start < scheduled_end"
        side_effects:
          - "actual_parts_per_hour reset to null; a new trial window and target are stored"

      - from: QUALIFIED
        to: REVOKED
        trigger: "system: Mold.status reaches TRANSFERRED or RETIRED"
        actor: system
        preconditions:
          - "PressQualification.mold_id == the mold that transitioned"
        side_effects:
          - "CASCADE LINK 2 -> 3: every ProductionJob with this mold_id AND this press_id whose run_status IN {DRAFT, SCHEDULED, BLOCKED} transitions to CANCELLED with block_reason QUALIFICATION_REVOKED"

      - from: REVOKED
        to: RUN_AT_RATE_SCHEDULED
        trigger: "POST /press-qualifications/{id}/schedule-run-at-rate"
        actor: ProcessEngineer
        preconditions:
          - "Mold.status NOT IN {TRANSFERRED, RETIRED}"
          - "Press.status == AVAILABLE"
        side_effects:
          - "a new trial window and target are stored"

  # ---------------------------------------------------------- ResinLot ----
  - entity: ResinLot
    dimension: status
    initial_state: QUARANTINE
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /resin-lots/{id}/disposition with decision RELEASE"
        actor: QualityEngineer
        preconditions:
          - "moisture_bp <= MAX_MOISTURE_BP"
        side_effects: ["qty_grams_remaining initialised to qty_kg_received * 1000 when it is still null"]

      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /resin-lots/{id}/disposition with decision REJECT"
        actor: QualityEngineer
        preconditions: ["ResinLot.status == QUARANTINE or HOLD"]
        side_effects: ["the lot can never be staged again"]

      - from: RELEASED
        to: HOLD
        trigger: "POST /resin-lots/{id}/disposition with decision HOLD"
        actor: QualityEngineer
        preconditions: ["ResinLot.status == RELEASED"]
        side_effects: ["jobs that already staged this lot keep material_status STAGED but can no longer start"]

      - from: HOLD
        to: RELEASED
        trigger: "POST /resin-lots/{id}/disposition with decision RELEASE"
        actor: QualityEngineer
        preconditions: ["moisture_bp <= MAX_MOISTURE_BP"]
        side_effects: ["staged jobs become startable again"]

      - from: RELEASED
        to: DEPLETED
        trigger: "system: a ProductionReport drives qty_grams_remaining to 0"
        actor: system
        preconditions: ["qty_grams_remaining == 0 after the report's virgin_grams are deducted"]
        side_effects: ["the lot may no longer be staged by another job"]

  # ------------------------------------------------ ProductionJob — run ----
  - entity: ProductionJob
    dimension: run_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /production-jobs/{id}/schedule"
        actor: ProcessEngineer
        preconditions:
          - "expected_press_version == Press.version"
          - "Press.status == AVAILABLE"
          - "Mold.status IN {PPAP_APPROVED, INTERIM_APPROVED}"
          - "Mold.service_state == SERVICEABLE"
          - "Mold.active_transfer_id is null"
          - "the job window does not collide with another ProductionJob on this press under press_window_overlap semantics"
          - "the job window does not collide with an OPEN MaintenanceOrder on this mold under mold_window_overlap semantics"
          - "press day-capacity aggregate stays within PRESS_DAILY_CAPACITY_MINUTES"
        side_effects:
          - "Press.committed_minutes_scheduled increased by the job's whole-minute duration"
          - "increments Press.version by 1"

      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /production-jobs/{id}/start"
        actor: ProcessEngineer
        preconditions:
          - "ProductionJob.material_status == STAGED"
          - "the staged ResinLot.status == RELEASED"
          - "Mold.status IN {PPAP_APPROVED, INTERIM_APPROVED}"
          - "Mold.service_state == SERVICEABLE"
        side_effects:
          - "no counter changes; the job simply becomes report-eligible"

      - from: RUNNING
        to: COMPLETED
        trigger: "POST /production-jobs/{id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "ProductionJob.total_shots >= 1"
        side_effects:
          - "material_status STAGED -> CONSUMED"
          - "actual_cycle_time_sec, first_pass_yield_bp and the as_run_actual variant of quote_piece_price are computed, filling as_run_piece_price_cents and price_variance_cents"
          - "Press.committed_minutes_scheduled decreased by the job's whole-minute duration; Press.version incremented by 1"

      - from: SCHEDULED
        to: BLOCKED
        trigger: "system: Mold.service_state reaches PM_DUE, or Mold.status reaches QUARANTINED"
        actor: system
        preconditions:
          - "ProductionJob.mold_id == the mold that transitioned and ProductionJob.run_status == SCHEDULED"
        side_effects:
          - "block_reason set to MOLD_PM_DUE, MOLD_QUARANTINED or INTERIM_PPAP_EXPIRED"
          - "CASCADE LINK 2 -> 3: material_status STAGED -> UNSTAGED and staged_resin_lot_id cleared"
          - "CASCADE LINK 2 -> 3: Press.committed_minutes_scheduled decreased by the job's whole-minute duration and Press.version incremented by 1"

      - from: BLOCKED
        to: SCHEDULED
        trigger: "POST /production-jobs/{id}/unblock"
        actor: ProcessEngineer
        preconditions:
          - "expected_press_version == Press.version"
          - "Mold.service_state == SERVICEABLE and Mold.status IN {PPAP_APPROVED, INTERIM_APPROVED}"
          - "the job window is still free under press_window_overlap and mold_window_overlap semantics"
        side_effects:
          - "block_reason cleared; Press.committed_minutes_scheduled increased by the job's whole-minute duration; increments Press.version by 1"
          - "material_status stays UNSTAGED; the lot must be staged again"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /production-jobs/{id}/cancel, or system cascade when a PressQualification for this mold_id and press_id reaches REVOKED"
        actor: ProcessEngineer
        preconditions:
          - "ProductionJob.run_status IN {DRAFT, SCHEDULED, BLOCKED, RUNNING}"
        side_effects:
          - "Press.committed_minutes_scheduled decreased by the job's whole-minute duration; Press.version incremented by 1"
          - "material_status STAGED -> UNSTAGED and staged_resin_lot_id cleared"
          - "block_reason set to QUALIFICATION_REVOKED when the system cascade caused it, and to null when a ProcessEngineer cancelled it explicitly"

      - from: RUNNING
        to: CANCELLED
        trigger: "POST /production-jobs/{id}/cancel"
        actor: ProcessEngineer
        preconditions:
          - "ProductionJob.run_status == RUNNING"
        side_effects:
          - "Press.committed_minutes_scheduled decreased by the job's whole-minute duration; Press.version incremented by 1"
          - "material_status STAGED -> UNSTAGED and staged_resin_lot_id cleared; already-posted ProductionReports keep their resin_lot_id snapshot and stay non-reversed, so the resin and shot ledgers are untouched"
          - "as_run_piece_price_cents and price_variance_cents stay null because the as_run_actual variant only runs on completion"

      - from: BLOCKED
        to: CANCELLED
        trigger: "system: a PressQualification for this mold_id and press_id reaches REVOKED, or POST /production-jobs/{id}/cancel"
        actor: system
        preconditions:
          - "ProductionJob.run_status IN {DRAFT, SCHEDULED, BLOCKED}"
        side_effects:
          - "block_reason set to QUALIFICATION_REVOKED when the cascade caused it; press minutes were already released when the job entered BLOCKED, so no second release occurs"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /production-jobs/{id}/cancel, or system cascade from a REVOKED PressQualification"
        actor: ProcessEngineer
        preconditions:
          - "ProductionJob.run_status == DRAFT"
        side_effects:
          - "no press minutes are released because a DRAFT job never reserved any"

  # ------------------------------------------- ProductionJob — material ----
  - entity: ProductionJob
    dimension: material_status
    initial_state: UNSTAGED
    terminal_states: [CONSUMED]
    transitions:
      - from: UNSTAGED
        to: STAGED
        trigger: "POST /production-jobs/{id}/stage-material"
        actor: ProcessEngineer
        preconditions:
          - "ProductionJob.run_status == SCHEDULED"
          - "ResinLot.status == RELEASED"
          - "ResinLot.resin_grade == Quote.resin_grade"
          - "ResinLot.qty_grams_remaining >= 1"
        side_effects:
          - "staged_resin_lot_id set; run_status is untouched, proving the two axes advance independently"

      - from: STAGED
        to: UNSTAGED
        trigger: "system: the job transitions to BLOCKED or CANCELLED"
        actor: system
        preconditions:
          - "ProductionJob.material_status == STAGED"
        side_effects:
          - "staged_resin_lot_id cleared; already-posted reports keep their resin_lot_id snapshot"

      - from: STAGED
        to: CONSUMED
        trigger: "POST /production-jobs/{id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "ProductionJob.run_status == RUNNING"
        side_effects:
          - "the lot binding is frozen for audit; no further reports may be posted"

  # -------------------------------------------------- MaintenanceOrder ----
  - entity: MaintenanceOrder
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /maintenance-orders/{id}/close"
        actor: ToolroomTech
        preconditions:
          - "expected_mold_version == Mold.version"
          - "MaintenanceOrder.status == OPEN"
        side_effects:
          - "Mold.service_state IN_MAINTENANCE -> SERVICEABLE when reset_shot_counter is true (Mold.shots_since_pm set to 0), otherwise IN_MAINTENANCE -> PM_DUE"
          - "increments Mold.version by 1"

  # ------------------------------------------------------ ToolTransfer ----
  - entity: ToolTransfer
    dimension: status
    initial_state: REQUESTED
    terminal_states: [DECLINED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /tool-transfers/{id}/decision with decision APPROVE"
        actor: PlantAdmin
        preconditions:
          - "Mold.status NOT IN {RETIRED, TRANSFERRED}"
        side_effects:
          - "decision_reason stored; Mold.active_transfer_id remains this transfer's id"

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /tool-transfers/{id}/decision with decision DECLINE"
        actor: PlantAdmin
        preconditions:
          - "ToolTransfer.status == REQUESTED"
        side_effects:
          - "Mold.active_transfer_id cleared to null; Mold.version incremented by 1"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /tool-transfers/{id}/complete"
        actor: PlantAdmin
        preconditions:
          - "expected_mold_version == Mold.version"
          - "no ProductionJob with this mold_id has run_status == RUNNING"
        side_effects:
          - "CASCADE LINK 0 -> 1: Mold.ownership set to CUSTOMER_OWNED, Mold.customer_id set to to_customer_id, Mold.status set to TRANSFERRED, Mold.active_transfer_id cleared, Mold.version incremented by 1"
          - "the mold's TRANSFERRED transition then fires its own cascade (qualification revocation, which itself cancels jobs)"

  # ----------------------------------------------------- CapacityCommit ----
  - entity: CapacityCommit
    dimension: status
    initial_state: OPEN
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /capacity-commits/{id}/settle"
        actor: PlantAdmin
        preconditions:
          - "CapacityCommit.status == OPEN"
        side_effects:
          - "consumed_minutes, utilization_bp, shortfall_minutes and shortfall_fee_cents frozen by calculation capacity_commit_settlement using the variant named by shortfall_policy"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /capacity-commits/{id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "CapacityCommit.status == OPEN"
        side_effects:
          - "consumed_minutes, shortfall_minutes, shortfall_fee_cents and utilization_bp all stay 0; the press's uncommitted capacity is restored for future commits"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: job-schedule-stale-press
    parent_entity: Press
    write_endpoint: "POST /production-jobs/{id}/schedule"
    occ_field: "expected_press_version"
    description: |
      Scheduling a ProductionJob against a Press whose version has advanced since
      the client last read it is rejected. A second, different job would legitimately
      occupy the same press under the product rules, so the loser is not caught by any
      state precondition; the stale press version is what identifies its occupancy view
      as out of date.
    error_id: ERR_STALE_PRESS_VERSION
    http_status: 412

  - rule_id: job-unblock-stale-press
    parent_entity: Press
    write_endpoint: "POST /production-jobs/{id}/unblock"
    occ_field: "expected_press_version"
    description: |
      Returning a BLOCKED ProductionJob to SCHEDULED re-reserves press minutes. When the
      Press version the client carries is behind the stored one, the reservation view is
      stale and the unblock is rejected.
    error_id: ERR_STALE_PRESS_VERSION
    http_status: 412

  - rule_id: report-post-stale-job
    parent_entity: ProductionJob
    write_endpoint: "POST /production-reports"
    occ_field: "expected_job_version"
    description: |
      Posting a ProductionReport against a ProductionJob whose version has advanced is
      rejected. A further report on the same running job is legitimate on its own, so no
      state precondition catches the loser; only the stale job version does.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

  - rule_id: quote-accept-stale-mold
    parent_entity: Mold
    write_endpoint: "POST /quotes/{id}/customer-decision"
    occ_field: "expected_mold_version"
    description: |
      Deciding a Quote whose Mold version has advanced is rejected. Accepting a quote
      legitimately supersedes every sibling quote on the same mold, so a decision on a
      different quote for that mold would itself succeed; the stale mold version is what
      marks the current decision's view of the tool program as out of date.
    error_id: ERR_STALE_MOLD_VERSION
    http_status: 412

  - rule_id: ppap-customer-decision-stale-mold
    parent_entity: Mold
    write_endpoint: "POST /ppap-submissions/{id}/customer-decision"
    occ_field: "expected_mold_version"
    description: |
      Rendering a customer decision on a PPAPSubmission whose Mold version has advanced is
      rejected. A decision on a different submission for the same mold legitimately
      supersedes the earlier approval terms, so the loser is identified only by the stale
      mold version.
    error_id: ERR_STALE_MOLD_VERSION
    http_status: 412

  - rule_id: maintenance-close-stale-mold
    parent_entity: Mold
    write_endpoint: "POST /maintenance-orders/{id}/close"
    occ_field: "expected_mold_version"
    description: |
      Closing a MaintenanceOrder resets the mold shot counter. When the Mold version the
      client carries is behind the stored one, the counter view is stale and the close is
      rejected.
    error_id: ERR_STALE_MOLD_VERSION
    http_status: 412

  - rule_id: transfer-complete-stale-mold
    parent_entity: Mold
    write_endpoint: "POST /tool-transfers/{id}/complete"
    occ_field: "expected_mold_version"
    description: |
      Completing a ToolTransfer rewrites the mold's ownership and customer. A second,
      different APPROVED transfer on the same mold would legitimately supersede the first,
      so the loser is caught only by the stale mold version it carries.
    error_id: ERR_STALE_MOLD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents, all ratios are integer basis points (bp).
# round_half_up(a / b) for non-negative integers a, b is defined exactly as
# (2*a + b) // (2*b); floor and ceil are integer division forms of the same.
# No calculation, selector, tie-break or ordering rule anywhere in this scaffold
# reads `id`; where a final tie-break over common fields is needed it is
# created_at ASC.
# =============================================================================
calculations:

  - name: quote_press_rate_selection
    trigger: "POST /quotes/{id}/price when press_id is omitted from the request body"
    algorithm: selector_policy
    formula: |
      candidates = [ p in Press
                     WHERE p.status == "AVAILABLE"
                       AND p.tonnage >= mold.required_min_tonnage
                       AND p.tonnage <= mold.required_max_tonnage
                       AND p.shot_size_grams_max >= mold.shot_weight_grams ]
      # NOTE: a PressQualification is deliberately NOT required here. Quoting prices the
      # cheapest adequate machine before any run-at-rate trial exists.
      rank_key   = (p.tonnage ASC, p.hourly_rate_cents ASC, p.created_at ASC)
      tie_break  = "p.created_at ASC"          # never p.id
      selected   = first(sort(candidates, rank_key))
      if candidates is empty: reject with ERR_NO_ELIGIBLE_PRESS
    input_set: "Every Press row regardless of PressQualification state; only status AVAILABLE rows enter the candidate set."
    constants: {}
    precision: "integer comparisons only"
    variants: []

  - name: press_routing_selection
    trigger: "POST /production-jobs when press_id is omitted from the request body"
    algorithm: selector_policy
    formula: |
      candidates = [ p in Press
                     WHERE p.status == "AVAILABLE"
                       AND p.tonnage >= mold.required_min_tonnage
                       AND p.tonnage <= mold.required_max_tonnage
                       AND p.shot_size_grams_max >= mold.shot_weight_grams
                       AND EXISTS q in PressQualification
                             WHERE q.mold_id == mold.id AND q.press_id == p.id
                               AND q.status == "QUALIFIED"
                       AND press_window_overlap(p, requested_start, requested_end) == false ]
      rank_key   = (p.tonnage ASC, p.hourly_rate_cents ASC, p.created_at ASC)
      tie_break  = "p.created_at ASC"          # never p.id
      selected   = first(sort(candidates, rank_key))
      if candidates is empty: reject with ERR_NO_ELIGIBLE_PRESS
    input_set: "Press rows with status AVAILABLE that carry a QUALIFIED PressQualification for this mold and no window collision. This filter is strictly narrower than quote_press_rate_selection's."
    constants: {}
    precision: "integer comparisons only"
    variants: []

  - name: quote_piece_price
    trigger: "POST /quotes/{id}/price (variant quoted_estimate) and POST /production-jobs/{id}/complete (variant as_run_actual)"
    algorithm: tiered_pricing
    formula: |
      # inputs: cavitation, cycle_time_sec, press.hourly_rate_cents, part_weight_grams,
      #         resin_price_cents_per_kg, mold.ownership, mold.tooling_cost_cents,
      #         annual_volume, yield_bp
      shots_per_lot        = ceil(LOT_PARTS / cavitation)
      machine_seconds      = shots_per_lot * cycle_time_sec
      machine_cost_cents   = round_half_up(machine_seconds * press.hourly_rate_cents / 3600)
      gross_resin_grams    = ceil(LOT_PARTS * part_weight_grams * 10000 / yield_bp)
      resin_cost_cents     = round_half_up(gross_resin_grams * resin_price_cents_per_kg / 1000)
      tooling_cents        = (mold.ownership == "SHOP_OWNED")
                               ? ceil(mold.tooling_cost_cents / TOOLING_AMORT_LOTS)
                               : 0
      direct_lot_cents     = machine_cost_cents + resin_cost_cents + tooling_cents
                             + PACKAGING_CENTS_PER_LOT
      margin_bp            = annual_volume <  VOLUME_BREAK_MID  ? MARGIN_BP_TIER_LOW
                           : annual_volume <  VOLUME_BREAK_HIGH ? MARGIN_BP_TIER_MID
                           :                                      MARGIN_BP_TIER_HIGH
      lot_price_cents      = round_half_up(direct_lot_cents * (10000 + margin_bp) / 10000)
      piece_price_cents    = max(MIN_PIECE_PRICE_CENTS, ceil(lot_price_cents / 1000))
      # Evaluation order is pinned: machine, resin, tooling and packaging are each rounded
      # to whole cents BEFORE they are summed into direct_lot_cents; the margin is then
      # applied once to that already-rounded subtotal; the per-piece figure is the LAST
      # rounding step and is a ceil, not a round_half_up.
    input_set: "quoted_estimate reads only Quote input fields plus the rate press; as_run_actual reads the same Quote fields except cycle_time_sec and yield_bp, which come from the job's non-reversed ProductionReports."
    constants:
      LOT_PARTS: 1000
      PACKAGING_CENTS_PER_LOT: 1800
      TOOLING_AMORT_LOTS: 50
      STANDARD_YIELD_BP: 9700
      MIN_PIECE_PRICE_CENTS: 12
      VOLUME_BREAK_MID: 50000
      VOLUME_BREAK_HIGH: 250000
      MARGIN_BP_TIER_LOW: 2800
      MARGIN_BP_TIER_MID: 2200
      MARGIN_BP_TIER_HIGH: 1600
    precision: "integer cents; round_half_up on machine, resin and lot price; ceil on shots_per_lot, gross_resin_grams, tooling amortisation and the final per-piece price"
    variants:
      - name: quoted_estimate
        when: "POST /quotes/{id}/price — writes Quote.quoted_lot_price_cents and Quote.quoted_piece_price_cents"
        difference: "cycle_time_sec = Quote.cycle_time_sec (nominal); yield_bp = STANDARD_YIELD_BP (9700); press = Quote.rate_press_id"
      - name: as_run_actual
        when: "POST /production-jobs/{id}/complete — writes ProductionJob.as_run_piece_price_cents and ProductionJob.price_variance_cents"
        difference: "cycle_time_sec = ProductionJob.actual_cycle_time_sec; yield_bp = ProductionJob.first_pass_yield_bp; press = ProductionJob.press_id. Identical Quote inputs therefore produce a different per-piece figure whenever the observed cycle or yield differs from nominal."

  - name: job_yield_accounting
    trigger: "POST /production-reports and POST /production-reports/{id}/reverse"
    algorithm: aggregation
    formula: |
      R = [ r in ProductionReport WHERE r.job_id == job.id AND r.is_reversed == false ]
      job.total_shots            = sum(r.shots            for r in R)
      job.parts_molded_total     = sum(r.shots * mold.cavity_count for r in R)
      job.good_parts_total       = sum(r.good_parts       for r in R)
      job.scrap_parts_total      = sum(r.scrap_parts      for r in R)
      job.short_shot_shots_total = sum(r.short_shot_shots for r in R)
      job.total_run_minutes      = sum(r.run_minutes      for r in R)
      job.first_pass_yield_bp    = job.parts_molded_total == 0
                                     ? 10000
                                     : floor(job.good_parts_total * 10000 / job.parts_molded_total)
      job.actual_cycle_time_sec  = job.total_shots == 0
                                     ? null
                                     : round_half_up(job.total_run_minutes * 60 / job.total_shots)
      # CONSERVED QUANTITY (parts):
      #   job.parts_molded_total == job.good_parts_total + job.scrap_parts_total
      # holds after every post and after every reversal.
    input_set: "Only ProductionReports of this job with is_reversed == false. Reversed reports contribute nothing to any rollup."
    constants: {}
    precision: "integers; floor on first_pass_yield_bp, round_half_up on actual_cycle_time_sec"
    variants: []

  - name: regrind_ratio_control
    trigger: "POST /production-reports, evaluated before the report row is persisted"
    algorithm: threshold
    formula: |
      limit_bp = mold.approved_max_regrind_bp != null
                   ? mold.approved_max_regrind_bp
                   : DEFAULT_MAX_REGRIND_BP
      inst_total = virgin_grams + regrind_grams
      instantaneous_regrind_bp = inst_total == 0
                                   ? 0
                                   : round_half_up(regrind_grams * 10000 / inst_total)
      R  = non-reversed ProductionReports of this job that already exist
      cum_regrind = regrind_grams + sum(r.regrind_grams for r in R)
      cum_total   = inst_total    + sum(r.virgin_grams + r.regrind_grams for r in R)
      cumulative_regrind_bp = cum_total == 0
                                ? 0
                                : round_half_up(cum_regrind * 10000 / cum_total)
      # Both gates use <= : a ratio EXACTLY equal to limit_bp is accepted.
      # The instantaneous gate is evaluated FIRST; only if it passes is the
      # cumulative gate evaluated. Both failures raise ERR_REGRIND_RATIO_EXCEEDED.
      if instantaneous_regrind_bp > limit_bp: reject ERR_REGRIND_RATIO_EXCEEDED
      if cumulative_regrind_bp   > limit_bp: reject ERR_REGRIND_RATIO_EXCEEDED
      on success: job.cumulative_regrind_bp = cumulative_regrind_bp
    input_set: "The candidate report plus all existing non-reversed reports of the same job. Reversing a report lowers both accumulators on the next evaluation."
    constants:
      DEFAULT_MAX_REGRIND_BP: 1500
    precision: "integer basis points, round_half_up"
    variants: []

  - name: resin_lot_mass_balance
    trigger: "POST /production-reports and POST /production-reports/{id}/reverse"
    algorithm: aggregation
    formula: |
      lot.qty_grams_remaining = lot.qty_kg_received * 1000
                                - sum(r.virgin_grams for r in ProductionReport
                                      WHERE r.resin_lot_id == lot.id AND r.is_reversed == false)
      # CONSERVED QUANTITY (resin mass, grams):
      #   lot.qty_grams_remaining
      #   + sum(virgin_grams over non-reversed reports on that lot)
      #   == lot.qty_kg_received * 1000
      # Regrind never touches a ResinLot: it comes from the grinder bin.
      if lot.qty_grams_remaining == 0 and lot.status == "RELEASED": lot.status = "DEPLETED"
    input_set: "Non-reversed ProductionReports whose resin_lot_id equals the lot. Reversal restores the grams exactly, with no rounding drift because grams are integers."
    constants: {}
    precision: "integer grams, exact"
    variants: []

  - name: job_cost_roll
    trigger: "POST /production-reports, POST /production-reports/{id}/reverse and POST /production-jobs/{id}/complete"
    algorithm: aggregation
    formula: |
      # STEP 1 — per report LINE, rounded once at the line:
      report.report_direct_cost_cents =
            round_half_up(report.run_minutes * press.hourly_rate_cents / 60)
          + round_half_up((report.virgin_grams + report.regrind_grams)
                          * quote.resin_price_cents_per_kg / 1000)
      # STEP 2 — sum the ALREADY ROUNDED lines. The rounding order is pinned:
      # ROUND PER REPORT LINE, THEN SUM. Summing raw minutes and raw grams first and
      # rounding once at the end is explicitly NOT the rule and yields a different
      # number of cents whenever two or more lines each carry a fractional half-cent.
      job.job_direct_cost_cents = sum(r.report_direct_cost_cents
                                      for r in non-reversed reports of the job)
      # STEP 3 — the overhead tier is keyed on the PRE-OVERHEAD direct cost. The total
      # is then direct + overhead. Evaluation order is pinned so the apparent circularity
      # (tier keyed on a total that includes overhead) never arises.
      overhead_bp = job.job_direct_cost_cents <  OVERHEAD_BREAK_MID  ? OVERHEAD_BP_TIER_LOW
                  : job.job_direct_cost_cents <  OVERHEAD_BREAK_HIGH ? OVERHEAD_BP_TIER_MID
                  :                                                    OVERHEAD_BP_TIER_HIGH
      job.job_overhead_cents = round_half_up(job.job_direct_cost_cents * overhead_bp / 10000)
      job.job_total_cost_cents = job.job_direct_cost_cents + job.job_overhead_cents
    input_set: "Non-reversed ProductionReports of the job; press.hourly_rate_cents is read from ProductionJob.press_id, resin price from the job's Quote."
    constants:
      OVERHEAD_BREAK_MID: 500000
      OVERHEAD_BREAK_HIGH: 2000000
      OVERHEAD_BP_TIER_LOW: 3500
      OVERHEAD_BP_TIER_MID: 2800
      OVERHEAD_BP_TIER_HIGH: 2200
    precision: "integer cents; round_half_up applied twice per report line, once for overhead"
    variants: []

  - name: mold_shot_counter_and_pm
    trigger: "POST /production-reports and POST /production-reports/{id}/reverse"
    algorithm: threshold
    formula: |
      mold.total_shot_count = sum(r.shots for r in ProductionReport
                                  WHERE r.job.mold_id == mold.id AND r.is_reversed == false)
      mold.shots_since_pm   = sum(r.shots for r in ProductionReport
                                  WHERE r.job.mold_id == mold.id AND r.is_reversed == false
                                    AND r.created_at >= last_pm_reset_at)
      # last_pm_reset_at is the created_at of the most recent MaintenanceOrder on this mold
      # with status CLOSED and shots_reset == true, ordered created_at DESC; when no such
      # order exists it is the mold's own created_at. Never ordered by id.
      # THRESHOLD GATE A (preventive maintenance), evaluated FIRST:
      if mold.shots_since_pm >= mold.pm_interval_shots and mold.service_state == "SERVICEABLE":
          mold.service_state = "PM_DUE"        # fires the SCHEDULED -> BLOCKED cascade
      # THRESHOLD GATE B (interim PPAP lapse), evaluated SECOND:
      if mold.interim_expiry_shots != null and mold.total_shot_count >= mold.interim_expiry_shots
         and mold.status == "INTERIM_APPROVED":
          mold.status = "QUARANTINED"          # fires the SCHEDULED -> BLOCKED cascade
      # Both gates use >= : the shot that lands exactly on the interval trips them.
      # Reversing a report recomputes both sums; when shots_since_pm falls back below
      # pm_interval_shots the mold returns to SERVICEABLE only if service_state is PM_DUE
      # (a mold already IN_MAINTENANCE is left alone).
    input_set: "Non-reversed ProductionReports whose job points at this mold; the PM window starts at the most recent counter-resetting CLOSED MaintenanceOrder."
    constants: {}
    precision: "integers, exact"
    variants: []

  - name: press_capacity_ledger
    trigger: "POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock, POST /production-jobs/{id}/cancel, POST /production-jobs/{id}/complete, and the system SCHEDULED -> BLOCKED cascade"
    algorithm: aggregation
    formula: |
      duration_minutes(job) = (job.scheduled_end - job.scheduled_start) in whole minutes
      # CONSERVED QUANTITY (press minutes):
      press.committed_minutes_scheduled
        == sum(duration_minutes(j) for j in ProductionJob
               WHERE j.press_id == press.id AND j.run_status IN {SCHEDULED, RUNNING})
      # Every forward reservation (schedule, unblock) and every compensating release
      # (cancel, complete, the BLOCKED cascade) keeps this identity true with zero drift.
      # PRESS DAY CAPACITY GATE, evaluated at schedule and unblock only:
      day = the UTC calendar date of job.scheduled_start
      day_minutes = sum(duration_minutes(j) for j in ProductionJob
                        WHERE j.press_id == press.id
                          AND j.run_status IN {SCHEDULED, RUNNING}
                          AND the UTC calendar date of j.scheduled_start == day)
      if day_minutes + duration_minutes(candidate) > PRESS_DAILY_CAPACITY_MINUTES:
          reject ERR_PRESS_DAILY_CAPACITY_EXCEEDED
    input_set: "ProductionJobs on the press whose run_status is SCHEDULED or RUNNING; DRAFT, BLOCKED, COMPLETED and CANCELLED jobs contribute nothing."
    constants:
      PRESS_DAILY_CAPACITY_MINUTES: 1224
    precision: "whole minutes, exact"
    variants: []

  - name: press_window_overlap
    trigger: "POST /production-jobs (routing eligibility), POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock"
    algorithm: interval_merge
    formula: |
      # PRESS INTERVAL SEMANTICS: HALF-OPEN [start, end) plus a mandatory changeover
      # buffer applied to the GAP between the two windows.
      collides(candidate, existing) =
          NOT ( candidate.scheduled_start >= existing.scheduled_end   + CHANGEOVER_BUFFER_MINUTES
             OR candidate.scheduled_end   + CHANGEOVER_BUFFER_MINUTES <= existing.scheduled_start )
      existing set = ProductionJobs on the same press_id, other than the candidate,
                     with run_status IN {SCHEDULED, RUNNING}
      # A candidate starting EXACTLY CHANGEOVER_BUFFER_MINUTES after an existing job ends
      # is accepted; one minute earlier collides.
      if any collision: reject ERR_PRESS_WINDOW_CONFLICT
    input_set: "SCHEDULED and RUNNING jobs on the same press. BLOCKED, DRAFT, COMPLETED and CANCELLED jobs free the window."
    constants:
      CHANGEOVER_BUFFER_MINUTES: 45
    precision: "whole minutes, exact"
    variants: []

  - name: mold_window_overlap
    trigger: "POST /maintenance-orders, POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock"
    algorithm: interval_merge
    formula: |
      # MOLD INTERVAL SEMANTICS: CLOSED [start, end] with ZERO buffer. Unlike the press
      # rule, two mold occupancies that merely TOUCH at an endpoint DO collide, and no
      # changeover allowance is granted, because the tool itself is physically in one
      # place at a time.
      collides(candidate, existing) =
          candidate.window_start <= existing.window_end
          AND existing.window_start <= candidate.window_end
      existing set = OPEN MaintenanceOrders on the same mold_id
                   + ProductionJobs on the same mold_id with run_status IN {SCHEDULED, RUNNING}
                     (their scheduled_start / scheduled_end read as window_start / window_end)
      if any collision: reject ERR_MOLD_WINDOW_CONFLICT
    input_set: "OPEN MaintenanceOrders and SCHEDULED/RUNNING ProductionJobs on the same mold, regardless of which press they use."
    constants:
      MOLD_BUFFER_MINUTES: 0
    precision: "whole minutes, exact"
    variants: []

  - name: capacity_commit_settlement
    trigger: "POST /capacity-commits/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      J = [ j in ProductionJob
            WHERE j.press_id == commit.press_id
              AND j.run_status IN {RUNNING, COMPLETED}
              AND Mold(j.mold_id).customer_id == commit.customer_id
              AND j.scheduled_start >= commit.window_start
              AND j.scheduled_end   <= commit.window_end ]
      consumed_minutes  = sum((j.scheduled_end - j.scheduled_start) in whole minutes for j in J)
      utilization_bp    = floor(consumed_minutes * 10000 / commit.committed_minutes)
      shortfall_minutes = max(0, commit.committed_minutes - consumed_minutes)
      rate              = Press(commit.press_id).hourly_rate_cents
      # variant STRICT   (see variants below)
      #   shortfall_fee_cents = round_half_up(shortfall_minutes * rate / 60)
      # variant GOODWILL (see variants below)
      #   waived_minutes   = floor(commit.committed_minutes * GOODWILL_WAIVER_BP / 10000)
      #   billable_minutes = max(0, shortfall_minutes - waived_minutes)
      #   shortfall_fee_cents = round_half_up(billable_minutes * rate * GOODWILL_RATE_BP
      #                                        / (60 * 10000))
    input_set: "RUNNING and COMPLETED jobs of the commit's customer on the commit's press whose whole window sits inside the commit window. Jobs partially outside the window are excluded entirely."
    constants:
      GOODWILL_WAIVER_BP: 1000
      GOODWILL_RATE_BP: 5000
      PRESS_AVAILABILITY_BP: 8500
    precision: "integer cents, round_half_up; floor on utilization_bp and waived_minutes"
    variants:
      - name: strict_shortfall
        when: "CapacityCommit.shortfall_policy == STRICT"
        difference: "Every unconsumed committed minute is billed at the press's full hourly rate; no waiver band exists."
      - name: goodwill_shortfall
        when: "CapacityCommit.shortfall_policy == GOODWILL"
        difference: "The first GOODWILL_WAIVER_BP (10%) of committed_minutes is forgiven, and only the remainder is billed, at GOODWILL_RATE_BP (50%) of the press rate. Identical committed_minutes and identical consumption therefore settle at a strictly lower fee than strict_shortfall whenever shortfall_minutes > 0."

  - name: capacity_commit_availability
    trigger: "POST /capacity-commits"
    algorithm: threshold
    formula: |
      window_minutes  = (candidate.window_end - candidate.window_start) in whole minutes
      available       = floor(window_minutes * PRESS_AVAILABILITY_BP / 10000)
      overlapping     = [ c in CapacityCommit
                          WHERE c.press_id == candidate.press_id
                            AND c.status == "OPEN"
                            AND c.window_start < candidate.window_end
                            AND candidate.window_start < c.window_end ]
      if sum(c.committed_minutes for c in overlapping) + candidate.committed_minutes > available:
          reject ERR_CAPACITY_COMMIT_EXCEEDED
      # OPEN commits only; SETTLED and CANCELLED commits release their reservation.
    input_set: "OPEN CapacityCommits on the same press whose windows strictly overlap the candidate's (half-open comparison, so touching windows do not aggregate)."
    constants:
      PRESS_AVAILABILITY_BP: 8500
    precision: "whole minutes; floor on available"
    variants: []

  - name: run_at_rate_verdict
    trigger: "POST /press-qualifications/{id}/record-run-at-rate"
    algorithm: threshold
    formula: |
      achieved_bp = floor(actual_parts_per_hour * 10000 / target_parts_per_hour)
      verdict     = achieved_bp >= RUN_AT_RATE_MIN_BP ? "QUALIFIED" : "FAILED"
      # >= : hitting exactly RUN_AT_RATE_MIN_BP qualifies.
    input_set: "The single trial recorded on this PressQualification row; earlier attempts do not average in."
    constants:
      RUN_AT_RATE_MIN_BP: 9000
    precision: "integer basis points, floor"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first failing row determines the returned error_id and HTTP status)
# Named quality-gate constants used below: MIN_FAI_SAMPLE_SHOTS = 30,
# MAX_MOISTURE_BP = 200, RUN_AT_RATE_MIN_BP = 9000.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource named by a path segment exists, checked left to right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (ERR_MOLD_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_PPAP_SUBMISSION_NOT_FOUND, ERR_JOB_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_QUALIFICATION_NOT_FOUND, ERR_RESIN_LOT_NOT_FOUND, ERR_MAINTENANCE_ORDER_NOT_FOUND, ERR_TOOL_TRANSFER_NOT_FOUND, ERR_CAPACITY_COMMIT_NOT_FOUND, ERR_PRESS_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND)"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 4
    category: business_constraint
    check: "request body shape — every required field present, types correct, enum members valid, integers inside their declared ranges, pagination limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: business_temporal
    check: "every supplied window has start strictly before end (scheduled_start/scheduled_end, window_start/window_end) and both are whole-minute ISO 8601 UTC instants"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /production-jobs, POST /maintenance-orders, POST /capacity-commits, POST /press-qualifications/{id}/schedule-run-at-rate"

  - priority: 6
    category: existence
    check: "every foreign key carried in the request body resolves to an existing row, checked in the order the fields are listed in §1.5 input"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose input carries a *_id field"

  - priority: 7
    category: auth
    check: "when the acting role is CustomerRep, X-User-ID equals the Customer.id that owns the target resource (Quote.customer_id, Mold.customer_id for a PPAP decision, ToolTransfer.to_customer_id at request time)"
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /quotes/{id}/customer-decision, POST /ppap-submissions/{id}/customer-decision, POST /tool-transfers, GET /customers/{id}"

  - priority: 8
    category: state
    check: "the supplied expected_<parent>_version equals the current version of the parent named by the matching §1.2.1 concurrency rule"
    error_id: "ERR_STALE_PRESS_VERSION | ERR_STALE_JOB_VERSION | ERR_STALE_MOLD_VERSION"
    http_status: 412
    applies_to: "POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock, POST /production-reports, POST /quotes/{id}/customer-decision, POST /ppap-submissions/{id}/customer-decision, POST /maintenance-orders/{id}/close, POST /tool-transfers/{id}/complete"

  - priority: 9
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2 (includes: quote not PRICED for submit, quote not SUBMITTED for a decision, job not DRAFT for schedule, job not SCHEDULED for start or stage-material, job not RUNNING for complete or report posting, job not BLOCKED for unblock, report already reversed, submission not in the required status, transfer not APPROVED for complete, commit not OPEN, maintenance order not OPEN, qualification not RUN_AT_RATE_SCHEDULED for record-run-at-rate)"
    error_id: "ERR_INVALID_STATE | ERR_QUOTE_NOT_PRICED | ERR_JOB_NOT_SCHEDULED | ERR_JOB_NOT_RUNNING | ERR_JOB_NOT_BLOCKED | ERR_REPORT_ALREADY_REVERSED | ERR_TRANSFER_NOT_APPROVED | ERR_CAPACITY_COMMIT_NOT_OPEN | ERR_RUN_AT_RATE_NOT_SCHEDULED"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 10
    category: business_safety
    check: "segregation of duties — the X-User-ID performing PPAP internal review differs from PPAPSubmission.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ppap-submissions/{id}/internal-review"

  - priority: 11
    category: business_safety
    check: "mold lifecycle gate — the Mold is not QUARANTINED, not TRANSFERRED and not RETIRED for the requested operation, and is in the status the operation requires (PPAP_APPROVED or INTERIM_APPROVED for job creation, scheduling, unblock and start; SAMPLING for PPAP submit, revise and customer decision)"
    error_id: "ERR_MOLD_QUARANTINED | ERR_MOLD_RETIRED | ERR_MOLD_TRANSFERRED | ERR_MOLD_NOT_PPAP_APPROVED"
    http_status: 409
    applies_to: "POST /production-jobs, POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock, POST /production-jobs/{id}/start, POST /ppap-submissions/{id}/submit, POST /ppap-submissions/{id}/revise, POST /ppap-submissions/{id}/customer-decision, POST /quotes/{id}/price"

  - priority: 12
    category: business_safety
    check: "material and first-article gates — the staged ResinLot.status is RELEASED at start time; fai_dimensional_pass is true and fai_sample_shots >= 30 (MIN_FAI_SAMPLE_SHOTS) at PPAP submit; moisture_bp <= 200 (MAX_MOISTURE_BP) at lot release; the staged lot's resin_grade equals the job's Quote.resin_grade"
    error_id: "ERR_RESIN_LOT_NOT_RELEASED | ERR_FAI_NOT_PASSED | ERR_RESIN_GRADE_MISMATCH | ERR_RESIN_MOISTURE_TOO_HIGH"
    http_status: 422
    applies_to: "POST /production-jobs/{id}/start, POST /production-jobs/{id}/stage-material, POST /ppap-submissions/{id}/submit, POST /resin-lots/{id}/disposition"

  - priority: 13
    category: business_safety
    check: "tool service gate — Mold.service_state is SERVICEABLE for job creation, scheduling, unblock and start"
    error_id: ERR_PM_OVERDUE
    http_status: 409
    applies_to: "POST /production-jobs, POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock, POST /production-jobs/{id}/start"

  - priority: 14
    category: business_safety
    check: "no ToolTransfer with status IN {REQUESTED, APPROVED} exists on the mold (Mold.active_transfer_id is null) when creating or scheduling a job; and no ProductionJob on the mold is RUNNING when completing a transfer"
    error_id: ERR_MOLD_TRANSFER_IN_PROGRESS
    http_status: 409
    applies_to: "POST /production-jobs, POST /production-jobs/{id}/schedule, POST /tool-transfers/{id}/complete"

  - priority: 15
    category: business_referential
    check: "press routing — the press is AVAILABLE, its tonnage is inside [Mold.required_min_tonnage, Mold.required_max_tonnage], its shot_size_grams_max >= Mold.shot_weight_grams, and a QUALIFIED PressQualification exists for the mold/press pair; when press_id is omitted, press_routing_selection must return a non-empty candidate set"
    error_id: "ERR_PRESS_OFFLINE | ERR_PRESS_TONNAGE_MISMATCH | ERR_PRESS_SHOT_SIZE_EXCEEDED | ERR_PRESS_NOT_QUALIFIED | ERR_NO_ELIGIBLE_PRESS"
    http_status: 422
    applies_to: "POST /production-jobs, POST /quotes/{id}/price"

  - priority: 16
    category: business_temporal
    check: "press window overlap under press_window_overlap semantics — half-open windows separated by at least CHANGEOVER_BUFFER_MINUTES (45)"
    error_id: ERR_PRESS_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock"

  - priority: 17
    category: business_temporal
    check: "mold window overlap under mold_window_overlap semantics — closed windows with zero buffer, spanning OPEN MaintenanceOrders and SCHEDULED/RUNNING jobs on the same tool"
    error_id: ERR_MOLD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock, POST /maintenance-orders"

  - priority: 18
    category: business_constraint
    check: "parts conservation — good_parts + scrap_parts == shots * Mold.cavity_count, and scrap_parts >= short_shot_shots * Mold.cavity_count"
    error_id: ERR_PARTS_BALANCE_MISMATCH
    http_status: 422
    applies_to: "POST /production-reports"

  - priority: 19
    category: business_constraint
    check: "regrind ratio control per calculation regrind_ratio_control — instantaneous gate first, then cumulative gate, both <=="
    error_id: ERR_REGRIND_RATIO_EXCEEDED
    http_status: 422
    applies_to: "POST /production-reports"

  - priority: 20
    category: business_constraint
    check: "resin sufficiency — virgin_grams <= the staged ResinLot.qty_grams_remaining"
    error_id: ERR_RESIN_LOT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /production-reports"

  - priority: 21
    category: business_constraint
    check: "press day capacity — the press's SCHEDULED plus RUNNING minutes on the job's UTC calendar start date, including the candidate, stay within PRESS_DAILY_CAPACITY_MINUTES (1224)"
    error_id: ERR_PRESS_DAILY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /production-jobs/{id}/schedule, POST /production-jobs/{id}/unblock"

  - priority: 22
    category: business_constraint
    check: "capacity commit availability per calculation capacity_commit_availability"
    error_id: ERR_CAPACITY_COMMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /capacity-commits"

  - priority: 23
    category: business_constraint
    check: "uniqueness — Customer.code, Press.press_code, Mold.mold_code and ResinLot.supplier_lot_code are unique; at most one PressQualification row exists per (mold_id, press_id) pair; at most one MaintenanceOrder per mold has status OPEN; at most one ToolTransfer per mold has status IN {REQUESTED, APPROVED}"
    error_id: "ERR_DUPLICATE_CODE | ERR_DUPLICATE_QUALIFICATION | ERR_MAINTENANCE_ALREADY_OPEN | ERR_MOLD_TRANSFER_IN_PROGRESS"
    http_status: 409
    applies_to: "POST /customers, POST /presses, POST /molds, POST /resin-lots, POST /press-qualifications, POST /maintenance-orders, POST /tool-transfers"

  - priority: 24
    category: business_fiscal
    check: "the customer is not on credit hold"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /quotes/{id}/customer-decision with decision ACCEPT, POST /capacity-commits"

# =============================================================================
# §1.5 API Endpoint Table
# Flat topology: all paths are absolute top-level collections (api_prefix is "").
# Every foreign key declared in §1.1 is reverse-reachable through the filtered-list
# form: GET /<child-collection> accepts the FK field as an optional query filter and
# returns <Child>[].
# =============================================================================
endpoints:

  # ----------------------------------------------------------- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a buying customer"
    roles: [PlantAdmin]
    code: 201
    input: [name, code, "credit_hold?"]
    output: Customer
    side_effects: ["credit_hold defaults to false"]

  - method: GET
    path: "/customers/{id}"
    description: "Read one customer"
    roles: [PlantAdmin, SalesEngineer, CustomerRep]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # -------------------------------------------------------------- Press ----
  - method: POST
    path: "/presses"
    description: "Register a molding machine"
    roles: [PlantAdmin]
    code: 201
    input: [press_code, tonnage, shot_size_grams_max, hourly_rate_cents]
    output: Press
    side_effects: ["status initialised to AVAILABLE, committed_minutes_scheduled to 0"]

  - method: GET
    path: "/presses/{id}"
    description: "Read one press, including its current version for OCC and its committed_minutes_scheduled ledger"
    roles: [PlantAdmin, SalesEngineer, ProcessEngineer, QualityEngineer, ToolroomTech]
    code: 200
    input: []
    output: Press
    side_effects: []

  - method: GET
    path: "/presses"
    description: "List presses with filtering and pagination"
    roles: [PlantAdmin, SalesEngineer, ProcessEngineer, QualityEngineer]
    code: 200
    input: ["status?", "min_tonnage?", "limit?", "offset?"]
    output: Press[]
    side_effects: []

  - method: POST
    path: "/presses/{id}/status"
    description: "Take a press offline or bring it back online"
    roles: [PlantAdmin]
    code: 200
    input: [status, "note?"]
    output: Press
    side_effects: ["an OFFLINE press stops being a routing candidate for quote_press_rate_selection and press_routing_selection"]

  # --------------------------------------------------------------- Mold ----
  - method: POST
    path: "/molds"
    description: "Register a tool"
    roles: [PlantAdmin]
    code: 201
    input: [mold_code, customer_id, cavity_count, shot_weight_grams, required_min_tonnage, required_max_tonnage, pm_interval_shots, tooling_cost_cents, "ownership?"]
    output: Mold
    side_effects: ["status initialised to NEW, service_state to SERVICEABLE, counters to 0, ownership defaults to SHOP_OWNED"]

  - method: GET
    path: "/molds/{id}"
    description: "Read one tool, including its version for OCC, both state axes and both shot counters"
    roles: [PlantAdmin, SalesEngineer, ProcessEngineer, QualityEngineer, ToolroomTech, CustomerRep]
    code: 200
    input: []
    output: Mold
    side_effects: []

  - method: GET
    path: "/molds"
    description: "List tools; customer_id is the reverse-reachability filter for Mold -> Customer"
    roles: [PlantAdmin, SalesEngineer, ProcessEngineer, QualityEngineer, ToolroomTech, CustomerRep]
    code: 200
    input: ["customer_id?", "status?", "service_state?", "ownership?", "limit?", "offset?"]
    output: Mold[]
    side_effects: []

  - method: POST
    path: "/molds/{id}/quality-hold"
    description: "Quarantine a tool or release it from quarantine"
    roles: [QualityEngineer, PlantAdmin]
    code: 200
    input: [action, "reason?"]
    output: Mold
    side_effects:
      - "QUARANTINE: every SCHEDULED ProductionJob on this mold moves to BLOCKED, each of which then de-stages its material and releases its press minutes"
      - "RELEASE: interim_expiry_shots cleared; BLOCKED jobs are not restored automatically"

  - method: POST
    path: "/molds/{id}/retire"
    description: "Retire a tool permanently"
    roles: [PlantAdmin]
    code: 200
    input: ["reason?"]
    output: Mold
    side_effects: ["QUALIFIED PressQualifications on this mold move to REVOKED, cancelling their DRAFT/SCHEDULED/BLOCKED jobs"]

  # -------------------------------------------------- PressQualification ----
  - method: POST
    path: "/press-qualifications"
    description: "Open a mold/press qualification junction row"
    roles: [ProcessEngineer, PlantAdmin]
    code: 201
    input: [mold_id, press_id]
    output: PressQualification
    side_effects: ["status initialised to UNQUALIFIED, attempt_count to 0"]

  - method: GET
    path: "/press-qualifications/{id}"
    description: "Read one qualification row"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: []
    output: PressQualification
    side_effects: []

  - method: GET
    path: "/press-qualifications"
    description: "List qualification rows; mold_id and press_id are the reverse-reachability filters for the junction"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: ["mold_id?", "press_id?", "status?", "limit?", "offset?"]
    output: PressQualification[]
    side_effects: []

  - method: POST
    path: "/press-qualifications/{id}/schedule-run-at-rate"
    description: "Book a run-at-rate trial window on the qualification row"
    roles: [ProcessEngineer]
    code: 200
    input: [scheduled_start, scheduled_end, target_parts_per_hour]
    output: PressQualification
    side_effects: ["status moves to RUN_AT_RATE_SCHEDULED from UNQUALIFIED, FAILED or REVOKED; actual_parts_per_hour cleared"]

  - method: POST
    path: "/press-qualifications/{id}/record-run-at-rate"
    description: "Record the observed rate and settle the trial verdict"
    roles: [QualityEngineer]
    code: 200
    input: [actual_parts_per_hour]
    output: PressQualification
    side_effects: ["run_at_rate_verdict decides QUALIFIED vs FAILED; attempt_count incremented by 1"]

  # -------------------------------------------------------------- Quote ----
  - method: POST
    path: "/quotes"
    description: "Draft a quote against a tool"
    roles: [SalesEngineer]
    code: 201
    input: [customer_id, mold_id, part_weight_grams, cycle_time_sec, cavitation, resin_grade, resin_price_cents_per_kg, annual_volume]
    output: Quote
    side_effects: ["status initialised to DRAFT; no price is computed yet"]

  - method: GET
    path: "/quotes/{id}"
    description: "Read one quote including its computed price fields"
    roles: [PlantAdmin, SalesEngineer, ProcessEngineer, QualityEngineer, CustomerRep]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/quotes"
    description: "List quotes; customer_id, mold_id and rate_press_id are the reverse-reachability filters for Quote's foreign keys"
    roles: [PlantAdmin, SalesEngineer, ProcessEngineer, CustomerRep]
    code: 200
    input: ["customer_id?", "mold_id?", "rate_press_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/quotes/{id}/price"
    description: "Price the quote with the quoted_estimate variant; press_id may pin the rate press, otherwise quote_press_rate_selection chooses it"
    roles: [SalesEngineer]
    code: 200
    input: ["press_id?"]
    output: Quote
    side_effects: ["rate_press_id, margin_bp, quoted_lot_price_cents and quoted_piece_price_cents written; status DRAFT -> PRICED"]

  - method: POST
    path: "/quotes/{id}/submit"
    description: "Send the priced quote to the customer"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: Quote
    side_effects: ["status PRICED -> SUBMITTED"]

  - method: POST
    path: "/quotes/{id}/customer-decision"
    description: "Customer accepts or declines the submitted quote"
    roles: [CustomerRep]
    code: 200
    input: [decision, expected_mold_version, "reason?"]
    output: Quote
    side_effects:
      - "ACCEPT: Mold.status NEW -> SAMPLING and increments Mold.version by 1; sibling DRAFT/PRICED/SUBMITTED quotes on the same mold move to SUPERSEDED"
      - "DECLINE: only this quote changes; Mold.version is unchanged"

  # ----------------------------------------------------- PPAPSubmission ----
  - method: POST
    path: "/ppap-submissions"
    description: "Open a PPAP package for a mold and a quote. Creation itself is ungated; the SAMPLING gate is enforced at submit."
    roles: [QualityEngineer]
    code: 201
    input: [mold_id, quote_id, level, max_regrind_bp, "supersedes_submission_id?"]
    output: PPAPSubmission
    side_effects: ["status initialised to DRAFT, revision_no to 1"]

  - method: GET
    path: "/ppap-submissions/{id}"
    description: "Read one PPAP package"
    roles: [PlantAdmin, QualityEngineer, ProcessEngineer, CustomerRep]
    code: 200
    input: []
    output: PPAPSubmission
    side_effects: []

  - method: GET
    path: "/ppap-submissions"
    description: "List PPAP packages; mold_id, quote_id and supersedes_submission_id are the reverse-reachability filters, the last one walking the self-referential revision chain"
    roles: [PlantAdmin, QualityEngineer, ProcessEngineer, CustomerRep]
    code: 200
    input: ["mold_id?", "quote_id?", "supersedes_submission_id?", "status?", "limit?", "offset?"]
    output: PPAPSubmission[]
    side_effects: []

  - method: POST
    path: "/ppap-submissions/{id}/submit"
    description: "File the package with its first-article results"
    roles: [QualityEngineer]
    code: 200
    input: [fai_dimensional_pass, fai_sample_shots]
    output: PPAPSubmission
    side_effects: ["submitted_by_user_id set to X-User-ID; status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/ppap-submissions/{id}/internal-review"
    description: "Internal quality endorsement or rejection; the submitter may not review their own package"
    roles: [QualityEngineer, PlantAdmin]
    code: 200
    input: [decision, "note?"]
    output: PPAPSubmission
    side_effects: ["internal_reviewed_by_user_id set to X-User-ID; ENDORSE -> UNDER_REVIEW, REJECT -> REJECTED"]

  - method: POST
    path: "/ppap-submissions/{id}/customer-decision"
    description: "Customer approves, interim-approves or rejects the package"
    roles: [CustomerRep]
    code: 200
    input: [decision, expected_mold_version, "interim_expiry_shots?", "reason?"]
    output: PPAPSubmission
    side_effects:
      - "APPROVE: Mold.status SAMPLING -> PPAP_APPROVED, Mold.approved_max_regrind_bp copied from the package, Mold.interim_expiry_shots cleared, increments Mold.version by 1"
      - "INTERIM_APPROVE: Mold.status SAMPLING -> INTERIM_APPROVED, Mold.interim_expiry_shots set to Mold.total_shot_count + interim_expiry_shots, increments Mold.version by 1"
      - "REJECT: package -> REJECTED; Mold is untouched and Mold.version is unchanged"

  - method: POST
    path: "/ppap-submissions/{id}/revise"
    description: "Send a rejected package back to DRAFT for another revision round"
    roles: [QualityEngineer]
    code: 200
    input: ["max_regrind_bp?"]
    output: PPAPSubmission
    side_effects: ["revision_no incremented by 1; FAI fields and all three actor ids cleared; status REJECTED -> DRAFT"]

  # ----------------------------------------------------------- ResinLot ----
  - method: POST
    path: "/resin-lots"
    description: "Receive a resin lot into quarantine"
    roles: [PlantAdmin, ProcessEngineer]
    code: 201
    input: [resin_grade, supplier_lot_code, qty_kg_received, moisture_bp]
    output: ResinLot
    side_effects: ["status initialised to QUARANTINE; qty_grams_remaining set to qty_kg_received * 1000"]

  - method: GET
    path: "/resin-lots/{id}"
    description: "Read one resin lot including its running mass balance"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: []
    output: ResinLot
    side_effects: []

  - method: POST
    path: "/resin-lots/{id}/disposition"
    description: "Release, hold or reject a resin lot"
    roles: [QualityEngineer]
    code: 200
    input: [decision, "reason?"]
    output: ResinLot
    side_effects: ["RELEASE requires moisture_bp <= 200; HOLD leaves already-staged jobs staged but unstartable"]

  # ------------------------------------------------------ ProductionJob ----
  - method: POST
    path: "/production-jobs"
    description: "Open a job against an accepted quote; press_id may pin the machine, otherwise press_routing_selection chooses it"
    roles: [ProcessEngineer]
    code: 201
    input: [quote_id, planned_qty, scheduled_start, scheduled_end, "press_id?"]
    output: ProductionJob
    side_effects: ["mold_id copied from the quote; press_id resolved; run_status DRAFT, material_status UNSTAGED; no press minutes are reserved yet"]

  - method: GET
    path: "/production-jobs/{id}"
    description: "Read one job including both state axes, every rollup counter and the cost roll"
    roles: [PlantAdmin, SalesEngineer, ProcessEngineer, QualityEngineer, CustomerRep]
    code: 200
    input: []
    output: ProductionJob
    side_effects: []

  - method: GET
    path: "/production-jobs"
    description: "List jobs; quote_id, mold_id, press_id and staged_resin_lot_id are the reverse-reachability filters for the job's four foreign keys"
    roles: [PlantAdmin, SalesEngineer, ProcessEngineer, QualityEngineer, CustomerRep]
    code: 200
    input: ["quote_id?", "mold_id?", "press_id?", "staged_resin_lot_id?", "run_status?", "material_status?", "limit?", "offset?"]
    output: ProductionJob[]
    side_effects: []

  - method: POST
    path: "/production-jobs/{id}/schedule"
    description: "Reserve the press window for a DRAFT job"
    roles: [ProcessEngineer]
    code: 200
    input: [expected_press_version]
    output: ProductionJob
    side_effects: ["run_status DRAFT -> SCHEDULED; Press.committed_minutes_scheduled increased by the job duration; increments Press.version by 1"]

  - method: POST
    path: "/production-jobs/{id}/stage-material"
    description: "Bind a released resin lot to the job (material axis only)"
    roles: [ProcessEngineer]
    code: 200
    input: [resin_lot_id]
    output: ProductionJob
    side_effects: ["material_status UNSTAGED -> STAGED; run_status untouched"]

  - method: POST
    path: "/production-jobs/{id}/start"
    description: "Put the scheduled, staged job on the press"
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: ProductionJob
    side_effects: ["run_status SCHEDULED -> RUNNING; material_status untouched"]

  - method: POST
    path: "/production-jobs/{id}/complete"
    description: "Close the job and roll the as-run cost"
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: ProductionJob
    side_effects: ["run_status RUNNING -> COMPLETED; material_status STAGED -> CONSUMED; as_run_piece_price_cents and price_variance_cents computed; Press.committed_minutes_scheduled released and Press.version incremented by 1"]

  - method: POST
    path: "/production-jobs/{id}/cancel"
    description: "Cancel a job that has not completed"
    roles: [ProcessEngineer, PlantAdmin]
    code: 200
    input: [reason]
    output: ProductionJob
    side_effects: ["run_status -> CANCELLED; material_status STAGED -> UNSTAGED; press minutes released for SCHEDULED/RUNNING jobs and Press.version incremented by 1"]

  - method: POST
    path: "/production-jobs/{id}/unblock"
    description: "Return a BLOCKED job to SCHEDULED once the tool is serviceable again"
    roles: [ProcessEngineer]
    code: 200
    input: [expected_press_version]
    output: ProductionJob
    side_effects: ["run_status BLOCKED -> SCHEDULED; block_reason cleared; Press.committed_minutes_scheduled increased again; increments Press.version by 1"]

  # --------------------------------------------------- ProductionReport ----
  - method: POST
    path: "/production-reports"
    description: "Post a shift report against a RUNNING job"
    roles: [ProcessEngineer]
    code: 201
    input: [job_id, shots, short_shot_shots, good_parts, scrap_parts, virgin_grams, regrind_grams, run_minutes, expected_job_version]
    output: ProductionReport
    side_effects:
      - "resin_lot_id snapshotted from the job's staged lot; instantaneous_regrind_bp and report_direct_cost_cents computed"
      - "job_yield_accounting, job_cost_roll, regrind_ratio_control, resin_lot_mass_balance and mold_shot_counter_and_pm all re-run"
      - "increments ProductionJob.version by 1"
      - "crossing pm_interval_shots moves Mold.service_state to PM_DUE, which blocks that mold's SCHEDULED jobs, which in turn de-stages their material and releases their press minutes"

  - method: GET
    path: "/production-reports/{id}"
    description: "Read one shift report"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: []
    output: ProductionReport
    side_effects: []

  - method: GET
    path: "/production-reports"
    description: "List shift reports; job_id and resin_lot_id are the reverse-reachability filters for the report's foreign keys"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: ["job_id?", "resin_lot_id?", "is_reversed?", "limit?", "offset?"]
    output: ProductionReport[]
    side_effects: []

  - method: POST
    path: "/production-reports/{id}/reverse"
    description: "Reverse a posted shift report; the compensating action for POST /production-reports"
    roles: [QualityEngineer, PlantAdmin]
    code: 200
    input: [reason]
    output: ProductionReport
    side_effects:
      - "is_reversed set to true; every rollup that consumed the report is recomputed from the remaining non-reversed reports"
      - "ResinLot.qty_grams_remaining, Mold.total_shot_count, Mold.shots_since_pm and the job's part counters all return to their pre-report values with zero drift"
      - "a mold whose service_state is PM_DUE returns to SERVICEABLE when shots_since_pm falls back below pm_interval_shots"

  # --------------------------------------------------- MaintenanceOrder ----
  - method: POST
    path: "/maintenance-orders"
    description: "Open a toolroom order and take the mold out of service for the window"
    roles: [ToolroomTech, PlantAdmin]
    code: 201
    input: [mold_id, kind, window_start, window_end]
    output: MaintenanceOrder
    side_effects: ["Mold.service_state -> IN_MAINTENANCE; shots_at_open snapshotted; the window is checked with mold_window_overlap's closed-interval semantics"]

  - method: GET
    path: "/maintenance-orders/{id}"
    description: "Read one toolroom order"
    roles: [PlantAdmin, ToolroomTech, ProcessEngineer, QualityEngineer]
    code: 200
    input: []
    output: MaintenanceOrder
    side_effects: []

  - method: GET
    path: "/maintenance-orders"
    description: "List toolroom orders; mold_id is the reverse-reachability filter"
    roles: [PlantAdmin, ToolroomTech, ProcessEngineer, QualityEngineer]
    code: 200
    input: ["mold_id?", "status?", "limit?", "offset?"]
    output: MaintenanceOrder[]
    side_effects: []

  - method: POST
    path: "/maintenance-orders/{id}/close"
    description: "Close the toolroom order, optionally zeroing the PM shot counter"
    roles: [ToolroomTech, PlantAdmin]
    code: 200
    input: [reset_shot_counter, expected_mold_version]
    output: MaintenanceOrder
    side_effects: ["Mold.service_state IN_MAINTENANCE -> SERVICEABLE (reset true) or -> PM_DUE (reset false); Mold.shots_since_pm zeroed when reset true; increments Mold.version by 1"]

  # -------------------------------------------------------- ToolTransfer ----
  - method: POST
    path: "/tool-transfers"
    description: "Request transfer of tool ownership to a customer"
    roles: [CustomerRep, PlantAdmin]
    code: 201
    input: [mold_id, to_customer_id, settlement_cents]
    output: ToolTransfer
    side_effects: ["from_ownership snapshotted; Mold.active_transfer_id set to this transfer and Mold.version incremented by 1"]

  - method: GET
    path: "/tool-transfers/{id}"
    description: "Read one transfer"
    roles: [PlantAdmin, CustomerRep, ToolroomTech]
    code: 200
    input: []
    output: ToolTransfer
    side_effects: []

  - method: GET
    path: "/tool-transfers"
    description: "List transfers; mold_id and to_customer_id are the reverse-reachability filters"
    roles: [PlantAdmin, CustomerRep, ToolroomTech]
    code: 200
    input: ["mold_id?", "to_customer_id?", "status?", "limit?", "offset?"]
    output: ToolTransfer[]
    side_effects: []

  - method: POST
    path: "/tool-transfers/{id}/decision"
    description: "Approve or decline a requested transfer"
    roles: [PlantAdmin]
    code: 200
    input: [decision, "reason?"]
    output: ToolTransfer
    side_effects: ["DECLINE clears Mold.active_transfer_id and increments Mold.version by 1; APPROVE leaves the reservation in place"]

  - method: POST
    path: "/tool-transfers/{id}/complete"
    description: "Hand the tool over; rewrites ownership and cascades through qualifications into jobs"
    roles: [PlantAdmin]
    code: 200
    input: [expected_mold_version]
    output: ToolTransfer
    side_effects:
      - "Mold.ownership -> CUSTOMER_OWNED, Mold.customer_id -> to_customer_id, Mold.status -> TRANSFERRED, active_transfer_id cleared, increments Mold.version by 1"
      - "the mold's TRANSFERRED transition revokes every QUALIFIED PressQualification on it, and each revocation cancels that mold/press pair's DRAFT, SCHEDULED and BLOCKED jobs"

  # ------------------------------------------------------ CapacityCommit ----
  - method: POST
    path: "/capacity-commits"
    description: "Sell a block of press minutes to a customer for a window"
    roles: [SalesEngineer, PlantAdmin]
    code: 201
    input: [customer_id, press_id, window_start, window_end, committed_minutes, shortfall_policy]
    output: CapacityCommit
    side_effects: ["capacity_commit_availability gate applied; status initialised to OPEN with all settlement fields at 0"]

  - method: GET
    path: "/capacity-commits/{id}"
    description: "Read one commitment including its settled figures"
    roles: [PlantAdmin, SalesEngineer, CustomerRep]
    code: 200
    input: []
    output: CapacityCommit
    side_effects: []

  - method: GET
    path: "/capacity-commits"
    description: "List commitments; customer_id and press_id are the reverse-reachability filters"
    roles: [PlantAdmin, SalesEngineer, CustomerRep]
    code: 200
    input: ["customer_id?", "press_id?", "status?", "limit?", "offset?"]
    output: CapacityCommit[]
    side_effects: []

  - method: POST
    path: "/capacity-commits/{id}/settle"
    description: "Close the window and bill the shortfall with the variant named by shortfall_policy"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: CapacityCommit
    side_effects: ["consumed_minutes, utilization_bp, shortfall_minutes and shortfall_fee_cents frozen; status OPEN -> SETTLED"]

  - method: POST
    path: "/capacity-commits/{id}/cancel"
    description: "Cancel an open commitment without billing"
    roles: [PlantAdmin]
    code: 200
    input: [reason]
    output: CapacityCommit
    side_effects: ["status OPEN -> CANCELLED; the reserved minutes stop counting toward capacity_commit_availability"]

  # ------------------------------------------------------- Logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: move the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["every subsequent created_at / updated_at stamp and every window comparison uses the new logical now"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED,            http: 401, condition: "X-User-Role or X-User-ID missing, or the role is not one of the six declared in §1.7" }
  - { id: ERR_FORBIDDEN_ROLE,             http: 403, condition: "the acting role is not listed in the endpoint's §1.5 roles" }
  - { id: ERR_CUSTOMER_SCOPE_VIOLATION,   http: 403, condition: "a CustomerRep acts on a resource whose owning Customer.id differs from X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES,      http: 403, condition: "the PPAP internal reviewer's X-User-ID equals PPAPSubmission.submitted_by_user_id" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST,            http: 400, condition: "a required body field is missing, a type is wrong, an enum value is unknown, an integer is out of range, or a pagination parameter is outside 1..100 / >= 0" }
  - { id: ERR_INVALID_WINDOW,             http: 400, condition: "a supplied window has start >= end, or a timestamp is not a whole-minute ISO 8601 UTC instant" }

  # --- existence ---
  - { id: ERR_CUSTOMER_NOT_FOUND,         http: 404, condition: "the referenced Customer does not exist" }
  - { id: ERR_PRESS_NOT_FOUND,            http: 404, condition: "the referenced Press does not exist" }
  - { id: ERR_MOLD_NOT_FOUND,             http: 404, condition: "the referenced Mold does not exist" }
  - { id: ERR_QUALIFICATION_NOT_FOUND,    http: 404, condition: "the referenced PressQualification does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND,            http: 404, condition: "the referenced Quote does not exist" }
  - { id: ERR_PPAP_SUBMISSION_NOT_FOUND,  http: 404, condition: "the referenced PPAPSubmission does not exist" }
  - { id: ERR_RESIN_LOT_NOT_FOUND,        http: 404, condition: "the referenced ResinLot does not exist" }
  - { id: ERR_JOB_NOT_FOUND,              http: 404, condition: "the referenced ProductionJob does not exist" }
  - { id: ERR_REPORT_NOT_FOUND,           http: 404, condition: "the referenced ProductionReport does not exist" }
  - { id: ERR_MAINTENANCE_ORDER_NOT_FOUND,http: 404, condition: "the referenced MaintenanceOrder does not exist" }
  - { id: ERR_TOOL_TRANSFER_NOT_FOUND,    http: 404, condition: "the referenced ToolTransfer does not exist" }
  - { id: ERR_CAPACITY_COMMIT_NOT_FOUND,  http: 404, condition: "the referenced CapacityCommit does not exist" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_PRESS_VERSION,        http: 412, condition: "expected_press_version does not equal Press.version on schedule or unblock" }
  - { id: ERR_STALE_JOB_VERSION,          http: 412, condition: "expected_job_version does not equal ProductionJob.version when posting a report" }
  - { id: ERR_STALE_MOLD_VERSION,         http: 412, condition: "expected_mold_version does not equal Mold.version on a quote decision, PPAP customer decision, maintenance close or transfer completion" }

  # --- state ---
  - { id: ERR_INVALID_STATE,              http: 409, condition: "the requested transition is not declared from the resource's current state and no more specific state error applies" }
  - { id: ERR_QUOTE_NOT_PRICED,           http: 409, condition: "POST /quotes/{id}/submit on a quote whose status is not PRICED" }
  - { id: ERR_JOB_NOT_SCHEDULED,          http: 409, condition: "start or stage-material on a job whose run_status is not SCHEDULED" }
  - { id: ERR_JOB_NOT_RUNNING,            http: 409, condition: "complete, or a report posting, on a job whose run_status is not RUNNING" }
  - { id: ERR_JOB_NOT_BLOCKED,            http: 409, condition: "unblock on a job whose run_status is not BLOCKED" }
  - { id: ERR_JOB_MATERIAL_NOT_STAGED,    http: 409, condition: "start on a job whose material_status is not STAGED" }
  - { id: ERR_REPORT_ALREADY_REVERSED,    http: 409, condition: "reverse on a ProductionReport whose is_reversed is already true" }
  - { id: ERR_TRANSFER_NOT_APPROVED,      http: 409, condition: "complete on a ToolTransfer whose status is not APPROVED" }
  - { id: ERR_CAPACITY_COMMIT_NOT_OPEN,   http: 409, condition: "settle or cancel on a CapacityCommit whose status is not OPEN" }
  - { id: ERR_RUN_AT_RATE_NOT_SCHEDULED,  http: 409, condition: "record-run-at-rate on a qualification whose status is not RUN_AT_RATE_SCHEDULED" }

  # --- quality / safety gates ---
  - { id: ERR_MOLD_NOT_PPAP_APPROVED,     http: 409, condition: "a job operation needs Mold.status IN {PPAP_APPROVED, INTERIM_APPROVED}, or a PPAP operation needs Mold.status == SAMPLING, and the mold is elsewhere" }
  - { id: ERR_MOLD_QUARANTINED,           http: 409, condition: "the operation targets a mold whose status is QUARANTINED" }
  - { id: ERR_MOLD_TRANSFERRED,           http: 409, condition: "the operation targets a mold whose status is TRANSFERRED" }
  - { id: ERR_MOLD_RETIRED,               http: 409, condition: "the operation targets a mold whose status is RETIRED" }
  - { id: ERR_PM_OVERDUE,                 http: 409, condition: "a job operation requires Mold.service_state == SERVICEABLE but the tool is PM_DUE or IN_MAINTENANCE" }
  - { id: ERR_MOLD_TRANSFER_IN_PROGRESS,  http: 409, condition: "a job operation runs while Mold.active_transfer_id is set, a second transfer is requested on the same mold, or a transfer completes while a job on that mold is RUNNING" }
  - { id: ERR_FAI_NOT_PASSED,             http: 422, condition: "PPAP submit with fai_dimensional_pass false or fai_sample_shots below 30" }
  - { id: ERR_RESIN_LOT_NOT_RELEASED,     http: 422, condition: "staging or starting against a ResinLot whose status is not RELEASED" }
  - { id: ERR_RESIN_GRADE_MISMATCH,       http: 422, condition: "the staged lot's resin_grade differs from the job's Quote.resin_grade" }
  - { id: ERR_RESIN_MOISTURE_TOO_HIGH,    http: 422, condition: "releasing a lot whose moisture_bp exceeds 200" }

  # --- routing / referential ---
  - { id: ERR_PRESS_OFFLINE,              http: 409, condition: "the named press has status OFFLINE" }
  - { id: ERR_PRESS_TONNAGE_MISMATCH,     http: 422, condition: "the named press's tonnage sits outside the mold's [required_min_tonnage, required_max_tonnage] band" }
  - { id: ERR_PRESS_SHOT_SIZE_EXCEEDED,   http: 422, condition: "the named press's shot_size_grams_max is below the mold's shot_weight_grams" }
  - { id: ERR_PRESS_NOT_QUALIFIED,        http: 422, condition: "no QUALIFIED PressQualification exists for the mold/press pair when opening a job" }
  - { id: ERR_NO_ELIGIBLE_PRESS,          http: 422, condition: "press_id was omitted and the selector's candidate set is empty" }

  # --- temporal ---
  - { id: ERR_PRESS_WINDOW_CONFLICT,      http: 409, condition: "the job window collides with another SCHEDULED or RUNNING job on the same press under half-open plus 45-minute changeover semantics" }
  - { id: ERR_MOLD_WINDOW_CONFLICT,       http: 409, condition: "the window collides with an OPEN MaintenanceOrder or a SCHEDULED/RUNNING job on the same mold under closed-interval zero-buffer semantics" }

  # --- accounting constraints ---
  - { id: ERR_PARTS_BALANCE_MISMATCH,     http: 422, condition: "good_parts + scrap_parts != shots * cavity_count, or scrap_parts < short_shot_shots * cavity_count" }
  - { id: ERR_REGRIND_RATIO_EXCEEDED,     http: 422, condition: "the report's instantaneous or the job's cumulative regrind ratio exceeds the approved ceiling" }
  - { id: ERR_RESIN_LOT_INSUFFICIENT,     http: 422, condition: "virgin_grams exceeds the staged lot's qty_grams_remaining" }
  - { id: ERR_PRESS_DAILY_CAPACITY_EXCEEDED, http: 422, condition: "the press's committed minutes on the job's UTC start date would exceed 1224" }
  - { id: ERR_CAPACITY_COMMIT_EXCEEDED,   http: 422, condition: "overlapping OPEN commitments plus the new one exceed the press's available minutes in the window" }

  # --- uniqueness ---
  - { id: ERR_DUPLICATE_CODE,             http: 409, condition: "Customer.code, Press.press_code, Mold.mold_code or ResinLot.supplier_lot_code already exists" }
  - { id: ERR_DUPLICATE_QUALIFICATION,    http: 409, condition: "a PressQualification row already exists for the mold/press pair" }
  - { id: ERR_MAINTENANCE_ALREADY_OPEN,   http: 409, condition: "another MaintenanceOrder on the same mold already has status OPEN" }

  # --- fiscal ---
  - { id: ERR_CUSTOMER_CREDIT_HOLD,       http: 402, condition: "the customer has credit_hold true and tries to accept a quote or open a capacity commitment" }

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
#
# Exactly six roles exist. `Anonymous` is NOT a role: it is the notation this
# scaffold's design files use for a request that carries no X-User-Role /
# X-User-ID headers at all, which validation priority 1 answers with
# ERR_UNAUTHENTICATED (401) before any other rule runs.
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant operations administrator: masters customers, presses and tools, adjudicates tool transfers, settles capacity commitments and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /presses"
      - "POST /presses/{id}/status"
      - "POST /molds"
      - "POST /molds/{id}/retire"
      - "POST /tool-transfers/{id}/decision"
      - "POST /tool-transfers/{id}/complete"
      - "POST /capacity-commits/{id}/settle"
      - "POST /capacity-commits/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /molds/{id}/quality-hold (with QualityEngineer)"
      - "POST /press-qualifications (with ProcessEngineer)"
      - "POST /resin-lots (with ProcessEngineer)"
      - "POST /production-jobs/{id}/cancel (with ProcessEngineer)"
      - "POST /production-reports/{id}/reverse (with QualityEngineer)"
      - "POST /maintenance-orders and POST /maintenance-orders/{id}/close (with ToolroomTech)"
      - "POST /tool-transfers (with CustomerRep)"
      - "POST /capacity-commits (with SalesEngineer)"
      - "POST /ppap-submissions/{id}/internal-review (with QualityEngineer)"
      - "all GET endpoints"

  - name: SalesEngineer
    description: "Owns the commercial surface: drafts and prices quotes, sends them to customers and sells press capacity. May never accept a quote on the customer's behalf."
    identity: "opaque"
    exclusive_operations:
      - "POST /quotes"
      - "POST /quotes/{id}/price"
      - "POST /quotes/{id}/submit"
    shared_operations:
      - "POST /capacity-commits (with PlantAdmin)"
      - "GET /customers/{id}, GET /presses, GET /presses/{id}, GET /molds, GET /molds/{id}, GET /quotes, GET /quotes/{id}, GET /production-jobs, GET /production-jobs/{id}, GET /capacity-commits, GET /capacity-commits/{id}"

  - name: ProcessEngineer
    description: "Owns the manufacturing surface: opens qualification rows and run-at-rate trials, opens and schedules jobs, stages material, starts and completes jobs and posts shift reports. May never render a quality verdict."
    identity: "opaque"
    exclusive_operations:
      - "POST /press-qualifications/{id}/schedule-run-at-rate"
      - "POST /production-jobs"
      - "POST /production-jobs/{id}/schedule"
      - "POST /production-jobs/{id}/stage-material"
      - "POST /production-jobs/{id}/start"
      - "POST /production-jobs/{id}/complete"
      - "POST /production-jobs/{id}/unblock"
      - "POST /production-reports"
    shared_operations:
      - "POST /press-qualifications (with PlantAdmin)"
      - "POST /resin-lots (with PlantAdmin)"
      - "POST /production-jobs/{id}/cancel (with PlantAdmin)"
      - "GET endpoints for presses, molds, qualifications, quotes, resin lots, jobs, reports and maintenance orders"

  - name: QualityEngineer
    description: "Owns every quality verdict: resin lot disposition, mold quarantine, PPAP filing and internal endorsement, run-at-rate verdicts and report reversal. The individual who submitted a PPAP package may not endorse it."
    identity: "opaque"
    exclusive_operations:
      - "POST /press-qualifications/{id}/record-run-at-rate"
      - "POST /resin-lots/{id}/disposition"
      - "POST /ppap-submissions"
      - "POST /ppap-submissions/{id}/submit"
      - "POST /ppap-submissions/{id}/revise"
    shared_operations:
      - "POST /molds/{id}/quality-hold (with PlantAdmin)"
      - "POST /ppap-submissions/{id}/internal-review (with PlantAdmin)"
      - "POST /production-reports/{id}/reverse (with PlantAdmin)"
      - "GET endpoints for presses, molds, qualifications, quotes, PPAP submissions, resin lots, jobs, reports and maintenance orders"

  - name: ToolroomTech
    description: "Runs the toolroom: opens and closes maintenance orders, which is the only way the PM shot counter is ever reset."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /maintenance-orders (with PlantAdmin)"
      - "POST /maintenance-orders/{id}/close (with PlantAdmin)"
      - "GET /presses/{id}, GET /molds, GET /molds/{id}, GET /maintenance-orders, GET /maintenance-orders/{id}, GET /tool-transfers, GET /tool-transfers/{id}"

  - name: CustomerRep
    description: "Acts for exactly one Customer. X-User-ID is that Customer's id, and every CustomerRep action is confined to resources whose owning customer id matches it."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /quotes/{id}/customer-decision"
      - "POST /ppap-submissions/{id}/customer-decision"
    shared_operations:
      - "POST /tool-transfers (with PlantAdmin)"
      - "GET /customers/{id}, GET /molds, GET /molds/{id}, GET /quotes, GET /quotes/{id}, GET /ppap-submissions, GET /ppap-submissions/{id}, GET /production-jobs, GET /production-jobs/{id}, GET /tool-transfers, GET /tool-transfers/{id}, GET /capacity-commits, GET /capacity-commits/{id}"
