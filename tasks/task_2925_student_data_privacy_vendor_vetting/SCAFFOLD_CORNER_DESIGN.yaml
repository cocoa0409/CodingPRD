              as: PrivacyOfficeAdmin
              captures: { inc2_id: $.data.id }
          assert:
            - "both trigger calls return status 201"
            - "VendorIncident.${inc1_id}.severity == CRITICAL and notification_due_at == 2026-08-01T12:00:00.000Z"
            - "VendorIncident.${inc2_id}.severity == CRITICAL and notification_due_at == 2026-08-02T00:00:00.000Z"
            - "Vendor.${v1_id}.risk_score == 30.00 (breach-term penalty 0 + CRITICAL weight 30 at full decay)"
            - "Vendor.${v2_id}.risk_score == 40.00 (breach-term penalty 10 + CRITICAL weight 30)"
            - "Vendor.${v1_id}.privacy_posture == FROZEN and Vendor.${v2_id}.privacy_posture == FROZEN"
            - "Vendor.${v1_id}.open_incident_count == 1 and Vendor.${v2_id}.open_incident_count == 1"

