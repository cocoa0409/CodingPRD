              as: Regulator
              as_user_id: "regulator-ca"
              captures: { typed_seq: "$.data[0].sequence_no", typed_subject_kind: "$.data[0].subject_kind", typed_subject_id: "$.data[0].subject_id" }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { subject_kind: "CONSUMER", subject_id: "${consumer_id}" }
              as: Regulator
              as_user_id: "regulator-ca"
