  # =====================================================================
  # Rule 5: priority_pair_validation_conflict (>=2 instances, different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_trip_lock
        grounds:
          - validations[priority=5]
          - validations[priority=16]
        distinguishing_aspect: |
          state (priority 5) vs business_fiscal (priority 16) pair: when trip lock
          is attempted on a trip that is both not in DRAFT posture AND would
          exceed budget, ERR_TRIP_NOT_DRAFT (409, state) must be returned, NOT
          ERR_BUDGET_EXCEEDED (402, fiscal).
        test_recipe:
          setup:
            - "Trip already LOCKED (state violation)"
            - "Season remaining budget insufficient for the estimated cost (fiscal violation)"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "LAL", display_name: "LA Lakers", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "SAC", game_tipoff_utc: "2026-12-25T03:00:00Z", return_arrival_utc: "2026-12-26T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "L01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HSAC", room_count: 1, rate_cents_per_night: 50000, check_in_date: "2026-12-24", night_count: 1, cutoff_date: "2026-12-20" }
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "LAX", destination_code: "SAC", scheduled_depart_utc: "2026-12-24T18:00:00Z", scheduled_arrive_utc: "2026-12-24T19:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${trip_v0}" }
              as: TravelManager
              captures: { trip_after_lock: $.data }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${trip_after_lock.version}" }
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TRIP_NOT_DRAFT (not ERR_BUDGET_EXCEEDED even though budget would also fail)"
            - "http_status == 409"

      - name: business_safety_vs_business_constraint_rest_vs_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=11]
        distinguishing_aspect: |
          business_safety (priority 7, rest floor) vs business_constraint
          (priority 11, manifest capacity) — different error-category pair than
          instance 1: when a rebook violates both the rest floor AND would
          overbook the manifest, ERR_REST_FLOOR_VIOLATION must be returned
          (safety beats constraint), not ERR_MANIFEST_FULL.
        test_recipe:
          setup:
            - "Charter leg with seat_capacity=1, currently 1 CONFIRMED manifest entry"
            - "Rebook request with new departure that violates rest floor against prior leg"
            - "Both conditions fail; safety must win"
          setup_api_calls:
