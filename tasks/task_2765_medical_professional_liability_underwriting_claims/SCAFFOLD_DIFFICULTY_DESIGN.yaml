            - "Insured E: years_in_practice 5, policy prior_acts_step_credit 3 -> step_year 4 (below the step-year bound only)."
            - "Insured B: years_in_practice 5, policy prior_acts_step_credit 4 -> step_year 5 (exactly on both bounds)."
