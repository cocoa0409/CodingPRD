          Entity pair Observation -> Evaluator: whether an Observation row may be created at
          all depends on a state field of a different entity, Evaluator.certification_status.
          With the evaluator SUSPENDED by two consecutive calibration failures, the schedule
          call fails with ERR_EVALUATOR_NOT_CERTIFIED even though every field of the request
          itself is valid.
