            - "VoluntaryDisclosureAgreement.${agr_id}.liability_variant == \"AMNESTY_STATUTORY\""

      - name: suspended_representative_gates_only_representative_side_negotiation
        grounds:
          - validations[priority=21]
          - entities.Representative.fields.status
          - endpoints[POST /amnesty/representatives/{id}/suspend]
          - errors[ERR_REPRESENTATIVE_SUSPENDED]
        distinguishing_aspect: |
          The gate lives on the Representative row, and it is one-sided: with the firm SUSPENDED
          the representative's counter is refused and the negotiation counters do not move, yet
          the DisclosureOfficer can still act on the very same request and reject it — a blanket
          "suspended request is frozen" reading fails the second call.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Representative Halloran holds one pre-clearance that reached TERMS_OFFERED with round_index 1 and counter_count 0"
            - "The representative was then suspended by the administrator"
