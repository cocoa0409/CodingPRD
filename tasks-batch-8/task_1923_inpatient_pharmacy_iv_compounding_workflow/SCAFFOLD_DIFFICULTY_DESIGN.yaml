scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: renal_dosing_ibw_vs_abw_divergence
        grounds:
          - calculations.renal_dose_adjustment
          - entities.PatientProfile.fields.crcl_ibw_ml_min
          - entities.PatientProfile.fields.crcl_abw_ml_min
          - entities.MedicationOrder.fields.renal_adjusted_dose_mg
        distinguishing_aspect: |
          MedicationOrder-domain calculation: the SAME obese patient (age 70, male, 175.0 cm,
          100 kg, SCr 1.5) verified against an IBW-policy drug yields renal_adjusted_dose_mg
          750.00 (CrCl 45.67 -> 0.75 tier) while an ABW_WHEN_OBESE-policy drug yields 1000.00
          (CrCl 53.33 -> 1.00 tier); identical order inputs, two valid weight variants,
          different numeric result.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z"
            - "Obese patient P: male, DOB 1956-08-01 (age 70), height 175.0 cm, weight 100 kg, SCr 1.5 -> ibw 70.46, bmi 32.65 (>= 30), crcl_ibw 45.67, crcl_abw 53.33"
            - "Drug A: policy IBW, concentration 10 mg/mL; Drug B: policy ABW_WHEN_OBESE, concentration 10 mg/mL"
            - "Two PO orders for P, 1000 mg each, both verified"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Prescribe", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Obese Pat", date_of_birth: "1956-08-01T00:00:00Z", sex: "M", height_cm: 175.0, weight_kg: 100.0, scr_mg_dl: 1.5 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugA IBW", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, renal_dosing_policy: "IBW" }
              as: PharmacyAdmin
              captures: { drug_a: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugB ABW", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, renal_dosing_policy: "ABW_WHEN_OBESE" }
              as: PharmacyAdmin
              captures: { drug_b: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_a}", route: "PO", ordered_dose_mg: 1000.0, frequency_per_day: 2, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_a: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_b}", route: "PO", ordered_dose_mg: 1000.0, frequency_per_day: 2, expected_patient_version: "${pat_v} + 1" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_b: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_a}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/medication-orders/${ord_b}/verify"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "GET /pharmacy/medication-orders/${ord_a}"
              payload: {}
              as: Pharmacist
            - call: "GET /pharmacy/medication-orders/${ord_b}"
              payload: {}
              as: Pharmacist
          assert:
            - "MedicationOrder.${ord_a}.crcl_used_ml_min == 45.67"
            - "MedicationOrder.${ord_a}.renal_adjusted_dose_mg == 750.0"
            - "MedicationOrder.${ord_a}.final_dose_ml == 75.0"
            - "MedicationOrder.${ord_b}.crcl_used_ml_min == 53.33"
            - "MedicationOrder.${ord_b}.renal_adjusted_dose_mg == 1000.0"
            - "MedicationOrder.${ord_b}.final_dose_ml == 100.0"
            - "MedicationOrder.${ord_a}.renal_adjusted_dose_mg != MedicationOrder.${ord_b}.renal_adjusted_dose_mg"
      - name: bud_default_table_vs_stability_extended
        grounds:
          - calculations.beyond_use_dating
          - entities.CompoundedPreparation.fields.bud_expiry
          - state_machines.CompoundingBatch.IN_PROGRESS_to_QA_REVIEW
        distinguishing_aspect: |
          CompoundedPreparation-domain calculation (distinct entity domain from the
          MedicationOrder-domain renal instance above): two preparations completed at the same
          logical instant 2026-08-01T00:00:00Z in one LOW-risk REFRIGERATED batch with
          documents_stability_source=true diverge — the drug without stability data gets
          bud_expiry 2026-08-15T00:00:00Z (table 336h) while the drug with 720h refrigerated
          stability data gets bud_expiry 2026-08-31T00:00:00Z (extended variant, min(720,720)).
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z"
            - "Healthy patient H (CrCl >= 50, factor 1.0): male, DOB 1996-08-01, height 180.0, weight 80.0, SCr 0.9"
            - "Drug S (no stability data) and Drug T (has_stability_data, stability_hours_refrigerated 720), both non-hazardous, concentration 10, vial 10"
            - "Verified IV orders for both drugs (100 mg each -> 10 mL each)"
            - "Hood + session IN_USE covering the clock; batch LOW risk, documents_stability_source=true"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr P2", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech T2", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Healthy Pat", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugS plain", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_s: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugT stable", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, has_stability_data: true, stability_hours_refrigerated: 720 }
              as: PharmacyAdmin
              captures: { drug_t: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_s}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_s: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_t}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v} + 1" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_t: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_s}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/medication-orders/${ord_t}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-1", iso_class: "ISO_5", is_hd_rated: false }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions/${sess_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches"
              payload: { hood_session_id: "${sess_id}", order_ids: ["${ord_s}", "${ord_t}"], usp_risk_level: "LOW", documents_stability_source: true }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/batches/${batch_id}/complete"
              payload: { prepared_volumes_ml: [10.0, 10.0], waste_ml: 0.0, storage_condition: "REFRIGERATED" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "GET /pharmacy/preparations"
              payload: { order_id: "${ord_s}" }
              as: Pharmacist
            - call: "GET /pharmacy/preparations"
              payload: { order_id: "${ord_t}" }
              as: Pharmacist
          assert:
            - "preparation for ${ord_s}.bud_expiry == 2026-08-15T00:00:00Z (default USP table, 336h)"
            - "preparation for ${ord_t}.bud_expiry == 2026-08-31T00:00:00Z (stability-extended, min(720,720)h)"
            - "the two bud_expiry values differ though both preparations completed at 2026-08-01T00:00:00Z in the same batch"

  # ===================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: diversion_risk_score_tiered_interaction
        grounds:
          - calculations.diversion_risk_score
          - entities.InventoryEvent.fields.event_type
        distinguishing_aspect: |
          Mode (a) formula with >= 3 inputs and non-linear interaction: weighted terms
          (variance z-score 10*(6/2)=30, controlled waste count 5*4=20, after-hours count
          3*4=12) plus a conditional C_II schedule multiplier; the subject records the identical event pattern
          (4 after-hours wastes, 2 counts with variances -2 and -4) on BOTH a C_II pocket and
          a NON_CONTROLLED pocket; the multiplier is what pushes the C_II evaluation to 93.00
          (OPEN_CASE, auto-creating a DiversionCase) while the NON_CONTROLLED evaluation of
          the same pattern stays 62.00 (WATCH) — the >= 75 threshold is crossed only via the
          schedule-multiplier interaction.
        test_recipe:
          setup:
            - "Station ST with pocket P_C2 (C_II drug) and pocket P_NC (NON_CONTROLLED drug)"
            - "A TECHNICIAN restocks BOTH pockets to 50 (restock excluded from the subject's score by the recorded_by filter); the SUBJECT is Pharmacist PH who at clock 2026-08-01T23:30:00Z (after-hours) records 4 WASTE events of 1 unit each on EACH pocket (C_II wastes witnessed by Nurse W)"
            - "At 2026-08-02T12:00:00Z the same Pharmacist PH records two COUNTs on EACH pocket: physical 44 (variance -2) then physical 42 (variance -4); C_II counts breach threshold >= 2 and open DiscrepancyCases, NON_CONTROLLED counts stay below its threshold 5 and open none — but variances still feed the score"
            - "Evaluate at 2026-08-03T00:00:00Z; all events inside the trailing 30-day inclusive window"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Pharm Risky", staff_role: "PHARMACIST" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Nurse Wit", staff_role: "NURSE" }
              as: PharmacyAdmin
              captures: { wit_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech Restocker", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { restocker_id: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "C2 Drug", schedule: "C_II", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_c2: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "NC Drug", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_nc: $.data.id }
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-1", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_c2}", max_units: 500 }
              as: PharmacyAdmin
              captures: { pk_c2: $.data.id, pk_c2_v: $.data.version }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_nc}", max_units: 500 }
              as: PharmacyAdmin
              captures: { pk_nc: $.data.id, pk_nc_v: $.data.version }
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:30:00Z" }
              as: PharmacyAdmin
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/restock"
              payload: { units: 50, expected_pocket_version: "${pk_c2_v}" }
              as: PharmacyTechnician
              as_user_id: "${restocker_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/waste"
              payload: { units: 1, witness_staff_id: "${wit_id}" }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/waste"
              payload: { units: 1, witness_staff_id: "${wit_id}" }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/waste"
              payload: { units: 1, witness_staff_id: "${wit_id}" }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/waste"
              payload: { units: 1, witness_staff_id: "${wit_id}" }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/restock"
              payload: { units: 50, expected_pocket_version: "${pk_nc_v}" }
              as: PharmacyTechnician
              as_user_id: "${restocker_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/waste"
              payload: { units: 1 }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/waste"
              payload: { units: 1 }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/waste"
              payload: { units: 1 }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/waste"
              payload: { units: 1 }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: PharmacyAdmin
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/count"
              payload: { physical_count_units: 44 }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/count"
              payload: { physical_count_units: 42 }
              as: Pharmacist
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/count"
              payload: { physical_count_units: 44 }
              as: Pharmacist
              as_user_id: "${tech_id}"
              captures: { cnt1_var: $.data.variance_units }
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/count"
              payload: { physical_count_units: 42 }
              as: Pharmacist
              as_user_id: "${tech_id}"
              captures: { cnt2_var: $.data.variance_units }
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PharmacyAdmin
          trigger:
            - call: "POST /pharmacy/diversion-risk/evaluate"
              payload: { station_id: "${st_id}", subject_staff_id: "${tech_id}", drug_product_id: "${drug_c2}" }
              as: DiversionOfficer
              captures: { score_c2: $.data.score, tier_c2: $.data.tier, case_c2: $.data.diversion_case_id }
            - call: "POST /pharmacy/diversion-risk/evaluate"
              payload: { station_id: "${st_id}", subject_staff_id: "${tech_id}", drug_product_id: "${drug_nc}" }
              as: DiversionOfficer
              captures: { score_nc: $.data.score, tier_nc: $.data.tier, case_nc: $.data.diversion_case_id }
          assert:
            - "first count response variance_units == -2 (46 expected vs 44 physical) and discrepancy_case_id != null (C_II threshold 2 breached)"
            - "second count response variance_units == -4 (expected unchanged at 46; COUNT events do not adjust the ledger)"
            - "C_II evaluate: score == 93.0 (raw 62 = 30 + 20 + 12, times 1.5), tier == OPEN_CASE, diversion_case_id != null"
            - "NON_CONTROLLED evaluate over the subject's identical pattern on P_NC: score == 62.0 (raw 62, multiplier 1.0), tier == WATCH, diversion_case_id == null"
            - "the C_II multiplier alone moves the same event pattern from 62.0 WATCH to 93.0 OPEN_CASE across the >= 75 boundary"
            - "GET /pharmacy/diversion-cases?subject_staff_id=${tech_id} returns exactly 1 row with opened_via == RISK_SCORE and status == OPEN"
      - name: dose_rounding_per_component_then_sum
        grounds:
          - calculations.dose_rounding
          - calculations.batch_yield_and_waste
          - entities.CompoundingBatch.fields.demand_ml
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters (distinct mode from the tiered weighted
          score above): raw component volumes [0.26, 0.24, 0.25, 1.25] mL rounded
          per-component-then-summed yield batch demand_ml == 2.3, whereas the forbidden
          sum-then-round order would yield 2.0 (raw sum 2.00 in the 1-10 band, step 0.5);
          the scaffold pins per-component-first.
        test_recipe:
          setup:
            - "Clock at default; four distinct healthy patients (factor 1.0) so no supersede fires"
            - "Drug R concentration 10 mg/mL, vial 10 mL"
            - "Four verified IV orders of 2.6, 2.4, 2.5, 12.5 mg -> raw volumes 0.26, 0.24, 0.25, 1.25 mL"
            - "Hood session IN_USE; batch with the four orders, created DRAFT"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr P3", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech T3", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat R1", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p1: $.data.id, p1v: $.data.version }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat R2", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p2: $.data.id, p2v: $.data.version }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat R3", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p3: $.data.id, p3v: $.data.version }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat R4", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p4: $.data.id, p4v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugR", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_r: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p1}", drug_product_id: "${drug_r}", route: "IV", ordered_dose_mg: 2.6, frequency_per_day: 1, expected_patient_version: "${p1v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o1: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p2}", drug_product_id: "${drug_r}", route: "IV", ordered_dose_mg: 2.4, frequency_per_day: 1, expected_patient_version: "${p2v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o2: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p3}", drug_product_id: "${drug_r}", route: "IV", ordered_dose_mg: 2.5, frequency_per_day: 1, expected_patient_version: "${p3v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o3: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p4}", drug_product_id: "${drug_r}", route: "IV", ordered_dose_mg: 12.5, frequency_per_day: 1, expected_patient_version: "${p4v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o4: $.data.id }
            - call: "POST /pharmacy/medication-orders/${o1}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/medication-orders/${o2}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/medication-orders/${o3}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/medication-orders/${o4}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-R", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions/${sess_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/batches"
              payload: { hood_session_id: "${sess_id}", order_ids: ["${o1}", "${o2}", "${o3}", "${o4}"], usp_risk_level: "LOW" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id, demand: $.data.demand_ml }
          assert:
            - "MedicationOrder.${o1}.final_dose_ml == 0.3 (0.26 rounded per-component at step 0.1)"
            - "MedicationOrder.${o2}.final_dose_ml == 0.2"
            - "MedicationOrder.${o3}.final_dose_ml == 0.3"
            - "MedicationOrder.${o4}.final_dose_ml == 1.5 (1.25 in 1-10 band, step 0.5, round_half_up)"
            - "CompoundingBatch.${batch_id}.demand_ml == 2.3 (per-component-then-sum; sum-then-round would give 2.0)"
            - "CompoundingBatch.${batch_id}.vials_used == 1 (ceil(2.3/10))"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_rework_cycle
        grounds:
          - state_machines.CompoundingBatch.QA_REVIEW_to_REJECTED
          - state_machines.CompoundingBatch.REJECTED_to_DRAFT
          - state_machines.CompoundingBatch.REJECTED_to_FAILED
          - entities.CompoundingBatch.fields.rework_count
        distinguishing_aspect: |
          Cyclic machine on CompoundingBatch: DRAFT -> IN_PROGRESS -> QA_REVIEW -> REJECTED
          -> DRAFT loops with rework_count incrementing per cycle; the third POST rework at
          rework_count == 2 terminates the cycle into FAILED (200, not an error), pinning the
          MAX_REWORK=2 termination condition of the loop.
        test_recipe:
          setup:
            - "Clock at default; healthy patient; Drug X non-hazardous concentration 10 vial 10"
            - "Verified IV order 100 mg (10 mL); hood session IN_USE; batch created and started"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Cyc", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech Cyc", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Pharm Cyc", staff_role: "PHARMACIST" }
              as: PharmacyAdmin
              captures: { pharm_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Cyc", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugX", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_x: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_x}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-C", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions/${sess_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches"
              payload: { hood_session_id: "${sess_id}", order_ids: ["${ord_id}"], usp_risk_level: "LOW" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/batches/${batch_id}/complete"
              payload: { prepared_volumes_ml: [10.0], waste_ml: 0.0, storage_condition: "ROOM" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/qa-reject"
              payload: { reason: "particulate seen" }
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/batches/${batch_id}/rework"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { b_after_rw1: $.data.status, rw1: $.data.rework_count }
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/complete"
              payload: { prepared_volumes_ml: [10.0], waste_ml: 0.0, storage_condition: "ROOM" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/qa-reject"
              payload: { reason: "second reject" }
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/batches/${batch_id}/rework"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { b_after_rw2: $.data.status, rw2: $.data.rework_count }
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/complete"
              payload: { prepared_volumes_ml: [10.0], waste_ml: 0.0, storage_condition: "ROOM" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/qa-reject"
              payload: { reason: "third reject" }
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/batches/${batch_id}/rework"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { b_final: $.data.status, rw_final: $.data.rework_count }
          assert:
            - "after first rework: status == DRAFT and rework_count == 1 (cycle REJECTED -> DRAFT completed)"
            - "after second rework: status == DRAFT and rework_count == 2"
            - "third rework call at rework_count == 2: HTTP 200 with status == FAILED and rework_count == 2 (terminal, cycle terminates)"
            - "subsequent GET /pharmacy/batches/${batch_id}: status == FAILED"
      - name: order_parallel_dimensions
        grounds:
          - state_machines.MedicationOrder.verification:PENDING_to_verification:VERIFIED
          - state_machines.MedicationOrder.fulfillment:QUEUED_to_fulfillment:COMPOUNDING
          - entities.MedicationOrder.fields.verification_status
          - entities.MedicationOrder.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on MedicationOrder (different entity and different
          non-linear shape from the batch rework cycle): an IV order is moved verification
          VERIFIED -> ON_HOLD (clinical dimension) AFTER its fulfillment dimension already
          advanced NONE -> QUEUED -> COMPOUNDING (batch created), demonstrating the two axes
          evolve independently; resuming VERIFIED restores verification without resetting
          fulfillment (stays COMPOUNDING).
        test_recipe:
          setup:
            - "Clock at default; healthy patient; Drug X (IV); verified order included in a DRAFT batch (fulfillment COMPOUNDING)"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Par", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech Par", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Par", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugXP", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_x: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_x}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-P", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/batches"
              payload: { hood_session_id: "${sess_id}", order_ids: ["${ord_id}"], usp_risk_level: "LOW" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/interventions"
              payload: { intervention_type: "DOSE_CLARIFICATION", note: "rechecking dose", placed_on_hold: true }
              as: Pharmacist
            - call: "GET /pharmacy/medication-orders/${ord_id}"
              payload: {}
              as: Pharmacist
              captures: { v_mid: $.data.verification_status, f_mid: $.data.fulfillment_status }
            - call: "POST /pharmacy/medication-orders/${ord_id}/resume"
              payload: {}
              as: Pharmacist
            - call: "GET /pharmacy/medication-orders/${ord_id}"
              payload: {}
              as: Pharmacist
              captures: { v_end: $.data.verification_status, f_end: $.data.fulfillment_status }
          assert:
            - "after intervention with placed_on_hold: verification_status == ON_HOLD while fulfillment_status == COMPOUNDING (dimensions independent)"
            - "after resume: verification_status == VERIFIED and fulfillment_status == COMPOUNDING (resume does not reset the fulfillment axis)"
            - "GET /pharmacy/medication-orders/${ord_id}/interventions returns 1 row with intervention_type == DOSE_CLARIFICATION"

  # ===================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_discontinue_cascade
        grounds:
          - state_machines.MedicationOrder.verification:PENDING_|_VERIFIED_|_ON_HOLD_to_verification:DISCONTINUED
          - state_machines.CompoundedPreparation.PLANNED_|_COMPOUNDED_to_CANCELLED
          - state_machines.CompoundingBatch.DRAFT_|_IN_PROGRESS_to_CANCELLED
          - state_machines.HoodSession.SCHEDULED_|_IN_USE_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST discontinue: order -> its PLANNED preparation is
          CANCELLED (L1) -> the batch, left with zero live preparations, recomputes and
          auto-CANCELs (L2, caused by L1) -> the batch's SCHEDULED hood session is CANCELLED
          (L3, caused by L2). Four entities mutate in a cause-linked chain.
        test_recipe:
          setup:
            - "Clock at default; healthy patient; Drug X IV; verified order O"
            - "Hood session S (SCHEDULED, not started); batch B (DRAFT) containing only O -> one PLANNED preparation"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Cas", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech Cas", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Cas", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugXC", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_x: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_x}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-DC", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/batches"
              payload: { hood_session_id: "${sess_id}", order_ids: ["${ord_id}"], usp_risk_level: "LOW" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/discontinue"
              payload: { reason: "therapy changed" }
              as: Prescriber
              as_user_id: "${pres_id}"
            - call: "GET /pharmacy/preparations"
              payload: { order_id: "${ord_id}" }
              as: Pharmacist
            - call: "GET /pharmacy/batches/${batch_id}"
              payload: {}
              as: Pharmacist
              captures: { b_status: $.data.status }
            - call: "GET /pharmacy/hood-sessions/${sess_id}"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { s_status: $.data.status }
          assert:
            - "MedicationOrder.${ord_id}.verification_status == DISCONTINUED and discontinue_reason == 'therapy changed'"
            - "the preparation for ${ord_id}.status == CANCELLED (L1)"
            - "CompoundingBatch.${batch_id}.status == CANCELLED (L2: last live preparation removed) and demand_ml == 0.0"
            - "HoodSession.${sess_id}.status == CANCELLED (L3: freed by batch cancellation)"
      - name: protocol_activation_cascade
        grounds:
          - state_machines.SubstitutionProtocol.DRAFT_to_ACTIVE
          - entities.MedicationOrder.fields.substitution_pending
          - entities.ADCPocket.fields.pick_blocked
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST activate, not discontinue): protocol
          activation flags all open orders of the shortage drug substitution_pending=true
          (L1), which in turn blocks every ADC pocket holding that drug pick_blocked=true
          (L2, caused by L1's flagging sweep, not by the activate call directly addressing
          pockets... the cascade is protocol -> orders -> pockets).
        test_recipe:
          setup:
            - "Clock at default; Drug SHORT in_shortage=true; Drug SUB active as substitute"
            - "Two verified PO orders of SHORT for two patients; one pocket stocking SHORT"
            - "Protocol DRAFT mapping SHORT -> SUB factor 0.5, expires 2026-09-01"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Sub", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat S1", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p1: $.data.id, p1v: $.data.version }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat S2", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p2: $.data.id, p2v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugSHORT", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, in_shortage: true }
              as: PharmacyAdmin
              captures: { drug_short: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugSUB", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_sub: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p1}", drug_product_id: "${drug_short}", route: "PO", ordered_dose_mg: 80.0, frequency_per_day: 1, expected_patient_version: "${p1v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o1: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p2}", drug_product_id: "${drug_short}", route: "PO", ordered_dose_mg: 80.0, frequency_per_day: 1, expected_patient_version: "${p2v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o2: $.data.id }
            - call: "POST /pharmacy/medication-orders/${o1}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/medication-orders/${o2}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-S", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_short}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id }
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.5, max_dose_mg: 200.0, expires_at: "2026-09-01T00:00:00Z" }
              as: PharmacyAdmin
              captures: { proto_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/substitution-protocols/${proto_id}/activate"
              payload: {}
              as: PharmacyAdmin
            - call: "GET /pharmacy/medication-orders/${o1}"
              payload: {}
              as: Pharmacist
              captures: { o1_flag: $.data.substitution_pending }
            - call: "GET /pharmacy/medication-orders/${o2}"
              payload: {}
              as: Pharmacist
              captures: { o2_flag: $.data.substitution_pending }
            - call: "GET /pharmacy/adc-pockets/${pk_id}"
              payload: {}
              as: Pharmacist
              captures: { pk_blocked: $.data.pick_blocked }
          assert:
            - "SubstitutionProtocol.${proto_id}.status == ACTIVE"
            - "MedicationOrder.${o1}.substitution_pending == true and ${o2}.substitution_pending == true (L1)"
            - "ADCPocket.${pk_id}.pick_blocked == true (L2: pocket blocked as a consequence of the order-flag sweep over the shortage drug)"
            - "GET /pharmacy/medication-orders?drug_product_id=${drug_short}&verification_status=VERIFIED returns 2 rows both with substitution_pending == true"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: verify_state_beats_allergy_safety
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ALLERGY_CONFLICT]
        distinguishing_aspect: |
          Category pair (state, business_safety): the order is already VERIFIED (state
          violation: verify requires PENDING) AND the patient's allergy list now contains the
          ordered drug (safety violation); the state-category error ERR_INVALID_STATE must win
          because priority 9 < priority 10.
        test_recipe:
          setup:
            - "Clock at default; patient P; drug D; order O created and successfully verified"
            - "After verification, admin PATCHes P.allergy_drug_product_ids to include D"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Pri1", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Pri1", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugPri1", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_d: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_d}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "PATCH /pharmacy/patients/${pat_id}"
              payload: { allergy_drug_product_ids: ["${drug_d}"] }
              as: PharmacyAdmin
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 9 beats business_safety priority 10)"
            - "HTTP status == 409, NOT 422 ERR_ALLERGY_CONFLICT"
            - "MedicationOrder.${ord_id}.verification_status remains VERIFIED"
      - name: substitute_safety_beats_protocol_referential
        grounds:
          - validations[priority=10]
          - validations[priority=33]
          - errors[ERR_ALLERGY_CONFLICT]
          - errors[ERR_NO_ACTIVE_PROTOCOL]
        distinguishing_aspect: |
          Category pair (business_safety, business_referential) — different pair from the
          state-vs-safety instance above: the order is substitution_pending, the referenced
          protocol is DRAFT (referential violation ERR_NO_ACTIVE_PROTOCOL) AND the patient is
          allergic to the substitute drug (safety violation ERR_ALLERGY_CONFLICT); the
          safety-category error must win because priority 10 < priority 33.
        test_recipe:
          setup:
            - "Clock at default; Drug SHORT in_shortage=true; Drug SUB is the substitute; patient allergic to SUB"
            - "Order O (SHORT) verified; protocol P (SHORT->SUB) ACTIVATED once to flag O, then REVOKED... simpler: a second DRAFT protocol P2 also maps SHORT->SUB; the substitute call references P2 (DRAFT) while O is substitution_pending=true from P's activation"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Pri2", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugSH2", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, in_shortage: true }
              as: PharmacyAdmin
              captures: { drug_short: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugSUB2", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_sub: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Pri2", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9, allergy_drug_product_ids: ["${drug_sub}"] }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_short}", route: "PO", ordered_dose_mg: 80.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.5, max_dose_mg: 200.0, expires_at: "2026-09-01T00:00:00Z" }
              as: PharmacyAdmin
              captures: { proto1: $.data.id }
            - call: "POST /pharmacy/substitution-protocols/${proto1}/activate"
              payload: {}
              as: PharmacyAdmin
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.25, max_dose_mg: 200.0, expires_at: "2026-09-01T00:00:00Z" }
              as: PharmacyAdmin
              captures: { proto2: $.data.id }
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/substitute"
