# Generated companion to SCAFFOLD.yaml -- SKILL.md 1.9 (Corner Coverage Index).
# Taxonomy: references/claim-extraction-guide.md, nine sections, per-section claim types.
# Every literal below was computed by executing the SCAFFOLD.yaml 1.3 formulas.
scaffold_corner_design:
  - section: entities
    instances:
      - name: resin_grade_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.ResinGrade
          - endpoints[POST /resin-grades]
          - response_envelope
        distinguishing_aspect: "A ResinGrade is a pure reference entity with no state machine: every field is supplied by the caller and echoed back, and the four common fields are minted alongside."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - &a_clock_d1_0600 { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T06:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /resin-grades", payload: { grade_code: "EV-4004", material_class: "VIRGIN_RESIN", polymer_family: "EVOH", melt_index: 3.0, density_kg_m3: 1170.0, food_contact_approved: true, pcr_content_pct: 0.0, cost_per_kg: 8.9, dart_impact_index: 12.0, haze_index: 4.0, cof_index: 0.35, seal_initiation_temp_c: 180.0, is_barrier: true }, as: PlantAdmin, captures: { g_ev: "$.data.id" } }
          assert:
            - "POST /resin-grades -> 201 with the success envelope { data: {...} }"
            - "ResinGrade.${g_ev}.grade_code == 'EV-4004', material_class == 'VIRGIN_RESIN', polymer_family == 'EVOH'"
            - "ResinGrade.${g_ev}.density_kg_m3 == 1170.0, cost_per_kg == 8.90, dart_impact_index == 12.0, haze_index == 4.0, cof_index == 0.35"
            - "ResinGrade.${g_ev}.is_barrier == true, food_contact_approved == true, pcr_content_pct == 0.0, seal_initiation_temp_c == 180.0"
            - "ResinGrade.${g_ev}.version == 1 and id, created_at, updated_at are all non-null"
      - name: get_extrusion_line_by_id_returns_the_stored_entity
        claim_type: retrieval
        grounds:
          - entities.ExtrusionLine
          - endpoints[GET /extrusion-lines/{id}]
        distinguishing_aspect: "A read-back of a line returns the posted values plus the system-derived posture, which is OPEN for a freshly created line because all three counters start at 0."
        test_recipe:
          setup:
            - "line L-FD created"
          setup_api_calls:
            - *a_clock_d1_0600
            - &a_line_fd { call: "POST /extrusion-lines", payload: { line_code: "L-FD", process_type: "BLOWN", max_layers: 5, min_gauge_micron: 20.0, max_gauge_micron: 120.0, max_layflat_mm: 900.0, purge_buffer_minutes: 60, food_contact_certified: true }, as: PlantAdmin, captures: { line_fd: "$.data.id" } }
          trigger:
            - { call: "GET /extrusion-lines/${line_fd}", payload: {}, as: ExtrusionOperator }
          assert:
            - "GET /extrusion-lines/${line_fd} -> 200"
            - "ExtrusionLine.${line_fd}.line_code == 'L-FD', max_layers == 5, purge_buffer_minutes == 60, food_contact_certified == true"
            - "ExtrusionLine.${line_fd}.posture == OPEN"
            - "ExtrusionLine.${line_fd}.incapable_run_count == 0, active_hold_count == 0, revoked_dossier_count == 0"
      - name: resin_grade_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /resin-grades]
          - response_envelope
        distinguishing_aspect: "total_count counts the whole filtered set, not the page; has_more is true only while offset + len(data) < total_count."
        test_recipe:
          setup:
            - "three resin grades registered: LL-1001, EV-4004, TI-5005"
          setup_api_calls:
            - *a_clock_d1_0600
            - &a_g_ll { call: "POST /resin-grades", payload: { grade_code: "LL-1001", material_class: "VIRGIN_RESIN", polymer_family: "LLDPE", melt_index: 1.0, density_kg_m3: 918.0, food_contact_approved: true, pcr_content_pct: 0.0, cost_per_kg: 1.45, dart_impact_index: 42.0, haze_index: 8.0, cof_index: 0.42, seal_initiation_temp_c: 105.0, is_barrier: false }, as: PlantAdmin, captures: { g_ll: "$.data.id" } }
            - &a_g_ev { call: "POST /resin-grades", payload: { grade_code: "EV-4004", material_class: "VIRGIN_RESIN", polymer_family: "EVOH", melt_index: 3.0, density_kg_m3: 1170.0, food_contact_approved: true, pcr_content_pct: 0.0, cost_per_kg: 8.9, dart_impact_index: 12.0, haze_index: 4.0, cof_index: 0.35, seal_initiation_temp_c: 180.0, is_barrier: true }, as: PlantAdmin, captures: { g_ev: "$.data.id" } }
            - &a_g_ti { call: "POST /resin-grades", payload: { grade_code: "TI-5005", material_class: "VIRGIN_RESIN", polymer_family: "TIE", melt_index: 2.0, density_kg_m3: 930.0, food_contact_approved: true, pcr_content_pct: 0.0, cost_per_kg: 3.4, dart_impact_index: 20.0, haze_index: 5.0, cof_index: 0.45, seal_initiation_temp_c: 120.0, is_barrier: false }, as: PlantAdmin, captures: { g_ti: "$.data.id" } }
          trigger:
            - { call: "GET /resin-grades", payload: { limit: 2, offset: 0 }, as: BlendEngineer }
            - { call: "GET /resin-grades", payload: { limit: 2, offset: 2 }, as: BlendEngineer }
            - { call: "GET /resin-grades", payload: { polymer_family: "EVOH" }, as: BlendEngineer }
          assert:
            - "the first page returns total_count 3, exactly 2 items and has_more == true"
            - "the second page returns total_count 3, exactly 1 item and has_more == false"
            - "the polymer_family filter returns total_count 1 and data[0].grade_code == 'EV-4004'"
      - name: negative_limit_on_resin_grade_list_is_rejected
        claim_type: listing
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "Pagination is validated at priority 4, before any existence check, so a bad limit is reported even on an empty collection."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *a_clock_d1_0600
          trigger:
            - { call: "GET /resin-grades", payload: { limit: -1, offset: 0 }, as: BlendEngineer }
          assert:
            - "GET /resin-grades -> 400 ERR_INVALID_PAGINATION"
            - "the error envelope carries error_id == 'ERR_INVALID_PAGINATION' and a non-empty message"
      - name: get_bag_lot_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_BAG_LOT_NOT_FOUND]
        distinguishing_aspect: "Path-level existence is priority 5: a syntactically valid UUID that matches no row yields 404, not 400."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *a_clock_d1_0600
          trigger:
            - { call: "GET /bag-lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ConvertingOperator }
          assert:
            - "GET /bag-lots/{unknown} -> 404 ERR_BAG_LOT_NOT_FOUND"
      - name: create_product_missing_required_bags_per_case_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Product.fields.bags_per_case
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "bags_per_case has source input and no default, so omitting it is a schema violation at priority 3 and no Product row is created."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *a_clock_d1_0600
          trigger:
            - { call: "POST /products", payload: { product_code: "P-BAD-1", customer_code: "CUST-X", bag_style: "FLAT", target_gauge_micron: 40.0, layflat_width_mm: 400.0, bag_length_mm: 600.0, min_bottom_seal_n_per_15mm: 18.0, min_strength_index: 25.0, cases_per_pallet: 30 }, as: PlantAdmin }
          assert:
            - "POST /products -> 400 ERR_INVALID_REQUEST"
            - "GET /products with customer_code CUST-X returns total_count 0"
      - name: omitted_optional_product_fields_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Product.fields.gauge_tolerance_pct
          - entities.Product.fields.food_contact_required
          - entities.Product.fields.min_partial_case_bags
          - entities.Product.fields.required_layer_count
        distinguishing_aspect: "Eleven Product fields declare defaults; posting only the ten required fields must materialise every one of them rather than leaving nulls."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *a_clock_d1_0600
          trigger:
            - { call: "POST /products", payload: { product_code: "P-MIN-1", customer_code: "CUST-MIN", bag_style: "FLAT", target_gauge_micron: 40.0, layflat_width_mm: 400.0, bag_length_mm: 600.0, min_bottom_seal_n_per_15mm: 18.0, min_strength_index: 25.0, bags_per_case: 250, cases_per_pallet: 30 }, as: PlantAdmin, captures: { p_min: "$.data.id" } }
          assert:
            - "POST /products -> 201"
            - "Product.${p_min}.food_contact_required == false and perforation_required == false"
            - "Product.${p_min}.gauge_tolerance_pct == 8.0 and gusset_depth_mm == 0.0"
            - "Product.${p_min}.max_regrind_pct_food == 10.0 and max_regrind_pct_nonfood == 35.0"
            - "Product.${p_min}.declared_recycled_content_pct == 0.0 and assumed_regrind_pcr_pct == 0.0"
            - "Product.${p_min}.min_partial_case_bags == 0 and count_accuracy_tolerance_pct == 2.0"
            - "Product.${p_min}.required_layer_count == 1"
      - name: film_roll_layflat_and_gauge_default_from_the_product_when_omitted
        claim_type: defaults
        grounds:
          - endpoints[POST /film-rolls].side_effects
          - entities.FilmRoll.fields.layflat_mm
          - entities.FilmRoll.fields.gauge_micron_avg
        distinguishing_aspect: "These two FilmRoll fields are not plain literal defaults: when omitted they are copied from the run's recipe's Product, which is what makes the later layflat-tolerance check pass."
        test_recipe:
          setup:
            - "RUN-FD-1 RUNNING on the food line with recipe R-FD-1 for P-FD-1 (layflat_width_mm 300.0, target_gauge_micron 50.0)"
          setup_api_calls:
            - *a_clock_d1_0600
            - &a_p_fd { call: "POST /products", payload: { product_code: "P-FD-1", customer_code: "CUST-FD", bag_style: "FLAT", food_contact_required: true, target_gauge_micron: 50.0, gauge_tolerance_pct: 8.0, layflat_width_mm: 300.0, bag_length_mm: 450.0, gusset_depth_mm: 0.0, perforation_required: false, min_bottom_seal_n_per_15mm: 22.0, min_strength_index: 30.0, max_regrind_pct_food: 10.0, max_regrind_pct_nonfood: 35.0, declared_recycled_content_pct: 0.0, assumed_regrind_pcr_pct: 5.0, bags_per_case: 500, min_partial_case_bags: 200, cases_per_pallet: 40, count_accuracy_tolerance_pct: 2.0, required_layer_count: 3 }, as: PlantAdmin, captures: { p_fd: "$.data.id" } }
            - *a_g_ll
            - *a_g_ev
            - *a_g_ti
            - &a_g_ad { call: "POST /resin-grades", payload: { grade_code: "AD-6006", material_class: "ADDITIVE_MASTERBATCH", polymer_family: "LLDPE", melt_index: 5.0, density_kg_m3: 940.0, food_contact_approved: true, pcr_content_pct: 0.0, cost_per_kg: 4.2, dart_impact_index: 15.0, haze_index: 12.0, cof_index: 0.12, seal_initiation_temp_c: 110.0, is_barrier: false }, as: PlantAdmin, captures: { g_ad: "$.data.id" } }
            - *a_line_fd
            - &a_pool_fd { call: "POST /regrind-pools", payload: { pool_code: "POOL-FD", food_contact_status: "FOOD_CONTACT_ELIGIBLE", polymer_family: "LLDPE" }, as: PlantAdmin, captures: { pool_fd: "$.data.id" } }
            - &a_press1 { call: "POST /print-presses", payload: { press_code: "PR-1", cylinder_capacity: 8, max_colors: 6, registration_tolerance_micron: 80.0, max_delta_e: 2.0 }, as: PlantAdmin, captures: { press1: "$.data.id" } }
            - &a_r1_new { call: "POST /blend-recipes", payload: { recipe_code: "R-FD-1", product_id: "${p_fd}", process_type: "BLOWN", layer_count: 3 }, as: BlendEngineer, captures: { r1: "$.data.id" } }
            - &a_r1_c1 { call: "POST /blend-recipes/${r1}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 30.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r1_c2 { call: "POST /blend-recipes/${r1}/components", payload: { layer_index: 2, component_kind: "VIRGIN", weight_pct: 2.5, resin_grade_id: "${g_ev}" }, as: BlendEngineer }
            - &a_r1_c3 { call: "POST /blend-recipes/${r1}/components", payload: { layer_index: 2, component_kind: "VIRGIN", weight_pct: 7.5, resin_grade_id: "${g_ti}" }, as: BlendEngineer }
            - &a_r1_c4 { call: "POST /blend-recipes/${r1}/components", payload: { layer_index: 3, component_kind: "VIRGIN", weight_pct: 50.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r1_c5 { call: "POST /blend-recipes/${r1}/components", payload: { layer_index: 3, component_kind: "ADDITIVE", weight_pct: 10.0, resin_grade_id: "${g_ad}" }, as: BlendEngineer }
            - &a_r1_sub { call: "POST /blend-recipes/${r1}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
            - &a_r1_app { call: "POST /blend-recipes/${r1}/approve", payload: {}, as: QualityManager, as_user_id: "u-qm-1" }
            - &a_runfd_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-FD-1", line_id: "${line_fd}", blend_recipe_id: "${r1}", scheduled_start: "2026-08-05T06:00:00Z", scheduled_end: "2026-08-05T18:00:00Z", target_output_kg: 1000.0 }, as: ExtrusionOperator, captures: { run_fd: "$.data.id" } }
            - &a_runfd_start { call: "POST /extrusion-runs/${run_fd}/start", payload: {}, as: ExtrusionOperator }
            - &a_gfd_50 { call: "POST /extrusion-runs/${run_fd}/gauge-readings", payload: { thickness_micron: 50.0 }, as: ExtrusionOperator }
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
          trigger:
            - { call: "POST /film-rolls", payload: { extrusion_run_id: "${run_fd}", roll_number: 1, net_kg: 600.0 }, as: ExtrusionOperator, captures: { roll_fd: "$.data.id" } }
          assert:
            - "POST /film-rolls -> 201 and FilmRoll.${roll_fd}.status == WOUND"
            - "FilmRoll.${roll_fd}.layflat_mm == 300.0 (copied from Product.layflat_width_mm)"
            - "FilmRoll.${roll_fd}.gauge_micron_avg == 50.0 (copied from Product.target_gauge_micron)"
            - "FilmRoll.${roll_fd}.actual_recycled_content_pct == null before the run completes"
      - name: bag_lot_unit_weight_theoretical_count_and_accuracy_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - calculations.bag_count_and_accuracy
          - entities.BagLot.fields.bag_unit_weight_kg
          - entities.BagLot.fields.bag_count_theoretical
          - entities.BagLot.fields.count_accuracy_pct
        distinguishing_aspect: "None of the three fields is an input: the unit weight comes from layflat, bag length, gusset depth, target gauge and the recipe's blended density, and the theoretical count floors printed_kg against it."
        test_recipe:
          setup:
            - "print job PJ-1 COMPLETED with printed_kg 576.0 off recipe R-FD-1 (blended_density_kg_m3 927.40)"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_g_ll
            - *a_g_ev
            - *a_g_ti
            - *a_g_ad
            - *a_line_fd
            - *a_pool_fd
            - *a_press1
            - *a_r1_new
            - *a_r1_c1
            - *a_r1_c2
            - *a_r1_c3
            - *a_r1_c4
            - *a_r1_c5
            - *a_r1_sub
            - *a_r1_app
            - *a_runfd_new
            - *a_runfd_start
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - &a_rollfd { call: "POST /film-rolls", payload: { extrusion_run_id: "${run_fd}", roll_number: 1, net_kg: 600.0 }, as: ExtrusionOperator, captures: { roll_fd: "$.data.id" } }
            - &a_roll2 { call: "POST /film-rolls", payload: { extrusion_run_id: "${run_fd}", roll_number: 2, net_kg: 200.0 }, as: ExtrusionOperator, captures: { roll2: "$.data.id" } }
            - &a_roll3 { call: "POST /film-rolls", payload: { extrusion_run_id: "${run_fd}", roll_number: 3, net_kg: 50.0 }, as: ExtrusionOperator, captures: { roll3: "$.data.id" } }
            - &a_runfd_comp { call: "POST /extrusion-runs/${run_fd}/complete", payload: { gross_output_kg: 1000.0, scrap_kg: 12.0 }, as: ExtrusionOperator }
            - &a_rollfd_rel { call: "POST /film-rolls/${roll_fd}/release", payload: {}, as: QualityManager }
            - &a_roll2_rel { call: "POST /film-rolls/${roll2}/release", payload: {}, as: QualityManager }
            - &a_plate1 { call: "POST /plate-sets", payload: { plate_code: "PL-1", product_id: "${p_fd}", color_count: 4 }, as: PrintOperator, captures: { plate1: "$.data.id" } }
            - &a_plate1_mount { call: "POST /plate-sets/${plate1}/mount", payload: { press_id: "${press1}" }, as: PrintOperator }
            - &a_pj1 { call: "POST /print-jobs", payload: { job_code: "PJ-1", film_roll_id: "${roll_fd}", plate_set_id: "${plate1}", press_id: "${press1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T18:00:00Z" }, as: PrintOperator, captures: { pj1: "$.data.id" } }
            - &a_pj1_reg { call: "POST /print-jobs/${pj1}/registration-check", payload: { registration_drift_micron: 40.0 }, as: PrintOperator }
            - &a_pj1_col { call: "POST /print-jobs/${pj1}/color-proof", payload: { delta_e_measured: 1.2 }, as: PrintOperator }
            - &a_pj1_sp { call: "POST /print-jobs/${pj1}/start-print", payload: {}, as: PrintOperator }
            - &a_pj1_cmp { call: "POST /print-jobs/${pj1}/complete", payload: { printed_kg: 576.0 }, as: PrintOperator }
          trigger:
            - { call: "POST /bag-lots", payload: { lot_code: "BL-1", print_job_id: "${pj1}", product_id: "${p_fd}", bag_count_produced: 46000 }, as: ConvertingOperator, captures: { bl1: "$.data.id" } }
          assert:
            - "POST /bag-lots -> 201 and BagLot.${bl1}.status == CONVERTING"
            - "BagLot.${bl1}.bag_unit_weight_kg == 0.012520"
            - "BagLot.${bl1}.bag_count_theoretical == 46006"
            - "BagLot.${bl1}.count_accuracy_pct == 99.99 and count_accuracy_conforming == true"
            - "BagLot.${bl1}.bag_count_unpacked == 46000, packed_bag_count == 0, bag_count_scrapped == 0"
            - "BagLot.${bl1}.seal_provisional_verdict == PENDING and seal_final_verdict == null"
      - name: system_fields_are_server_minted_on_regrind_pool_create
        claim_type: system_fields
        grounds:
          - entities.RegrindPool
          - endpoints[POST /regrind-pools]
        distinguishing_aspect: "id, created_at, updated_at and version are system-sourced; the aggregate counters are also system-sourced and start at zero rather than null."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *a_clock_d1_0600
          trigger:
            - { call: "POST /regrind-pools", payload: { pool_code: "POOL-FD", food_contact_status: "FOOD_CONTACT_ELIGIBLE", polymer_family: "LLDPE" }, as: PlantAdmin, captures: { pool_fd: "$.data.id" } }
          assert:
            - "POST /regrind-pools -> 201 with version == 1"
            - "RegrindPool.${pool_fd}.available_kg == 0.000, cumulative_in_kg == 0.000, cumulative_out_kg == 0.000"
            - "RegrindPool.${pool_fd}.cumulative_in_pcr_kg == 0.000 and embedded_pcr_pct == 0.000"
            - "RegrindPool.${pool_fd}.generation_count == 0 and reincorporation_count == 0"
      - name: invalid_process_type_enum_on_extrusion_line_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ExtrusionLine.fields.process_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "process_type is constrained to BLOWN | CAST; an out-of-set value is a schema violation, not a business error."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *a_clock_d1_0600
          trigger:
            - { call: "POST /extrusion-lines", payload: { line_code: "L-BAD", process_type: "EXTRUDED", max_layers: 3, min_gauge_micron: 20.0, max_gauge_micron: 120.0, max_layflat_mm: 900.0 }, as: PlantAdmin }
          assert:
            - "POST /extrusion-lines -> 400 ERR_INVALID_REQUEST"
            - "GET /extrusion-lines filtered by process_type BLOWN returns total_count 0"
      - name: regrind_transaction_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.RegrindTransaction
          - entities.RegrindTransaction.common_fields
        distinguishing_aspect: "RegrindTransaction declares common_fields false: it is an append-only ledger row with id and created_at only, and it is corrected by appending a REVERSAL rather than by updating."
        test_recipe:
          setup:
            - "a 50.000 kg reincorporation booked against RUN-NF-2 from POOL-NF"
          setup_api_calls:
            - *a_clock_d1_0600
            - &a_p_nf { call: "POST /products", payload: { product_code: "P-NF-1", customer_code: "CUST-NF", bag_style: "GUSSETED", food_contact_required: false, target_gauge_micron: 40.0, gauge_tolerance_pct: 10.0, layflat_width_mm: 400.0, bag_length_mm: 600.0, gusset_depth_mm: 60.0, perforation_required: true, min_bottom_seal_n_per_15mm: 18.0, min_strength_index: 25.0, max_regrind_pct_food: 10.0, max_regrind_pct_nonfood: 35.0, declared_recycled_content_pct: 0.0, assumed_regrind_pcr_pct: 25.0, bags_per_case: 250, min_partial_case_bags: 100, cases_per_pallet: 30, count_accuracy_tolerance_pct: 3.0, required_layer_count: 1 }, as: PlantAdmin, captures: { p_nf: "$.data.id" } }
            - *a_g_ll
            - &a_line_nf { call: "POST /extrusion-lines", payload: { line_code: "L-NF", process_type: "BLOWN", max_layers: 3, min_gauge_micron: 20.0, max_gauge_micron: 120.0, max_layflat_mm: 900.0, purge_buffer_minutes: 45, food_contact_certified: false }, as: PlantAdmin, captures: { line_nf: "$.data.id" } }
            - &a_pool_nf { call: "POST /regrind-pools", payload: { pool_code: "POOL-NF", food_contact_status: "NON_FOOD_ONLY", polymer_family: "LLDPE" }, as: PlantAdmin, captures: { pool_nf: "$.data.id" } }
