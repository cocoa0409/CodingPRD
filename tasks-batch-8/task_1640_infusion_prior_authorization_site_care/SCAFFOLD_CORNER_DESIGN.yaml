# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Infusion Prior Authorization & Site-of-Care Steering
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: payer_policy_create_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.PayerPolicy.fields.requires_prior_auth"
          - "entities.PayerPolicy.fields.site_policy"
          - "entities.PayerPolicy.fields.steer_threshold"
        distinguishing_aspect: "Omitting every optional field on policy creation applies the declared defaults (requires_prior_auth true, buy_and_bill_required false, pharmacy_validity_days 30, allowed_amount_known true, discount_rate 0.80, site_policy NO_STEERING, steer_threshold 1.50)."
        test_recipe:
          setup: ["Empty database; logical clock at startup default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERD", drug_code: "J9100", regimen_name: "Defaults", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { d_req: $.data.requires_prior_auth, d_bnb: $.data.buy_and_bill_required, d_pvd: $.data.pharmacy_validity_days, d_aak: $.data.allowed_amount_known, d_dr: $.data.discount_rate, d_sp: $.data.site_policy, d_st: $.data.steer_threshold, d_ver: $.data.version } }
          assert:
            - "requires_prior_auth == true; buy_and_bill_required == false; pharmacy_validity_days == 30"
            - "allowed_amount_known == true; discount_rate == 0.80; site_policy == NO_STEERING; steer_threshold == 1.50"
            - "version == 1 and id is a server-minted UUID"
      - name: create_patient_missing_required_returns_validation_failed
        claim_type: required_fields
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_VALIDATION_FAILED]"
        distinguishing_aspect: "POST /infusion/patients without member_id fails with ERR_VALIDATION_FAILED (400); no patient row is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /infusion/patients", payload: { full_name: "No Member", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION_FAILED, http 400"
      - name: auth_request_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.AuthorizationRequest.fields.status"
          - "entities.AuthorizationRequest"
        distinguishing_aspect: "Client-supplied status/version on creation are ignored: the request is born DRAFT with version 1 regardless of injected values."
        test_recipe:
          setup: ["Policy and patient exist"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9101", regimen_name: "SysF", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_sf: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1101", full_name: "Sys P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_sf: $.data.id } }
          trigger:
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_sf}", policy_id: "${pol_sf}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70, status: "APPROVED", version: 99 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { st_sf: $.data.status, v_sf: $.data.version, cb_sf: $.data.created_by_user_id } }
          assert:
            - "status == DRAFT (injected APPROVED ignored); version == 1 (injected 99 ignored)"
            - "created_by_user_id == coord-1 (stamped from X-User-ID, not from the body)"
      - name: get_nonexistent_auth_request_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_AUTH_REQUEST_NOT_FOUND]"
        distinguishing_aspect: "GET on a well-formed but unknown request id returns 404 ERR_AUTH_REQUEST_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /infusion/authorization-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AUTH_REQUEST_NOT_FOUND, http 404"
      - name: clearance_create_initial_estimate_zero
        claim_type: computed_fields
        grounds:
          - "entities.FinancialClearance.fields.estimated_patient_responsibility_cents"
          - "entities.FinancialClearance.fields.method"
        distinguishing_aspect: "A fresh clearance on an APPROVED request computes estimate 0 (no line items), selects method from policy.allowed_amount_known, and starts ESTIMATED at version 1."
        test_recipe:
          setup: ["Approved authorization chain under an ACCUMULATOR policy"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9102", regimen_name: "Fc0", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_f0: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1102", full_name: "Fc P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_f0: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_f0}", policy_id: "${pol_f0}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_f0: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_f0}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_f0: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_f0}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_f0}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_f0: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_f0}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_f0}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_f0}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_f0: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_f0}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_f0}" }, as: MedicalDirector, as_user_id: "md-2" }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_f0}/financial-clearances", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { fc0: $.data.id, est0: $.data.estimated_patient_responsibility_cents, m0: $.data.method, s0: $.data.status } }
          assert:
            - "estimated_patient_responsibility_cents == 0; method == ACCUMULATOR_METHOD; status == ESTIMATED; version == 1"

  - section: state_machines
    instances:
      - name: auth_request_initial_state_draft
        claim_type: initial_state
        grounds:
          - "state_machines.AuthorizationRequest"
        distinguishing_aspect: "A newly created AuthorizationRequest starts in DRAFT with version 1 before any transition endpoint is invoked."
        test_recipe:
          setup: ["Policy and patient exist"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9110", regimen_name: "Init", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_i: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1110", full_name: "Init P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_i: $.data.id } }
          trigger:
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_i}", policy_id: "${pol_i}", requested_site_type: "HOME", requested_dose_mg: 250, patient_weight_kg: 80 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { st_i: $.data.status, v_i: $.data.version } }
          assert:
            - "status == DRAFT; version == 1; auth_valid_from/auth_valid_to null"
      - name: determinations_on_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.AuthorizationRequest"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Determinations are only legal from SUBMITTED; calling the endpoint on a DRAFT request fails with ERR_INVALID_STATE even when SoD and OCC inputs are well-formed."
        test_recipe:
          setup: ["DRAFT request (version 1)"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9111", regimen_name: "InvTr", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_it: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1111", full_name: "IT P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_it: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_it}", policy_id: "${pol_it}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_it: $.data.id, v_it: $.data.version } }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_it}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_it}" }, as: MedicalDirector, as_user_id: "md-2", captures: { err_it: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409); request remains DRAFT"
      - name: expired_auth_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.AuthorizationRequest.APPROVED_to_EXPIRED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Once EXPIRED (a terminal state), determinations on the request are rejected with ERR_INVALID_STATE and no field changes."
        test_recipe:
          setup: ["Approved request with validity_days 30 (auth_valid_to 2026-08-31T00:00:00Z); clock advanced to 2026-09-01T00:00:00Z so the request is EXPIRED"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9112", regimen_name: "Lock", benefit_channel: "MEDICAL", validity_days: 30, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_lk: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1112", full_name: "Lock P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_lk: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_lk}", policy_id: "${pol_lk}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_lk: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_lk}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_lk: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_lk}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_lk}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_lk: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_lk}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_lk}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_lk}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_lk2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_lk}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_lk2}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PolicyAdmin, as_user_id: "admin-1" }
            - { call: "GET /infusion/authorization-requests/${auth_lk}", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { st_lk: $.data.status, v_lk3: $.data.version } }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_lk}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_lk3}" }, as: MedicalDirector, as_user_id: "md-2", captures: { err_lk: $.data.error_id } }
          assert:
            - "After clock advance: status == EXPIRED (auto-transition)"
            - "Determinations on EXPIRED: error_id == ERR_INVALID_STATE (409)"
      - name: appointment_missed_auto_transition
        claim_type: valid_transition
        grounds:
          - "state_machines.InfusionAppointment.SCHEDULED_to_MISSED"
        distinguishing_aspect: "A SCHEDULED appointment auto-transitions to MISSED once the logical clock passes scheduled_start + 60 minutes without confirmation."
        test_recipe:
          setup: ["Approved request (validity 90); OFFICE chair; appointment 2026-08-10T10:00-11:00 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9113", regimen_name: "Miss", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_ms: $.data.id } }
            - { call: "POST /infusion/infusion-chairs", payload: { site_type: "OFFICE", label: "CH-MS" }, as: PolicyAdmin, as_user_id: "admin-1", captures: { chair_ms: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1113", full_name: "Miss P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_ms: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_ms}", policy_id: "${pol_ms}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_ms: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_ms}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_ms: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_ms}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ms}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_ms: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_ms}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ms}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ms}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_ms2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_ms}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_ms2}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_ms}/appointments", payload: { chair_id: "${chair_ms}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { appt_ms: $.data.id } }
          trigger:
            - { call: "POST /infusion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:01:00Z" }, as: PolicyAdmin, as_user_id: "admin-1" }
            - { call: "GET /infusion/authorization-requests/${auth_ms}/appointments", payload: {}, as: Scheduler, as_user_id: "sched-1" }
          assert:
            - "InfusionAppointment.${appt_ms}.status == MISSED after clock passes start + 60 minutes (11:01 > 11:00)"
      - name: appointment_completed_auto_transition
        claim_type: valid_transition
        grounds:
          - "state_machines.InfusionAppointment.CONFIRMED_to_COMPLETED"
        distinguishing_aspect: "A CONFIRMED appointment auto-transitions to COMPLETED when the logical clock reaches scheduled_end (inclusive now >= end)."
        test_recipe:
          setup: ["Approved request; CLEARED clearance (one 10000-cent line, cleared by fin-2 vs estimator fin-1); appointment 2026-08-10T10:00-11:00 CONFIRMED"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9114", regimen_name: "Comp", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_cp: $.data.id } }
            - { call: "POST /infusion/infusion-chairs", payload: { site_type: "OFFICE", label: "CH-CP" }, as: PolicyAdmin, as_user_id: "admin-1", captures: { chair_cp: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1114", full_name: "Comp P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_cp: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_cp}", policy_id: "${pol_cp}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_cp: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_cp}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_cp: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_cp}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cp}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_cp: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_cp}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cp}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cp}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_cp2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_cp}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_cp2}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_cp}/financial-clearances", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { fc_cp: $.data.id } }
            - { call: "POST /infusion/financial-clearances/${fc_cp}/line-items", payload: { description: "drug", allowed_amount_cents: 10000, billed_charges_cents: 10000 }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/financial-clearances/${fc_cp}/clear", payload: {}, as: FinanceSpecialist, as_user_id: "fin-2" }
            - { call: "POST /infusion/authorization-requests/${auth_cp}/appointments", payload: { chair_id: "${chair_cp}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { appt_cp: $.data.id } }
            - { call: "POST /infusion/appointments/${appt_cp}/confirm", payload: {}, as: Scheduler, as_user_id: "sched-1", captures: { st_cp: $.data.status } }
          trigger:
            - { call: "POST /infusion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: PolicyAdmin, as_user_id: "admin-1" }
