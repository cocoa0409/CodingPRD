            - { call: "POST /mill-orders/${m9}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${j9}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${d9}", sequence_id: "${s9}" }, as: FOREMAN, captures: { p9: $.data.id } }
            - { call: "POST /pieces/${p9}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${j9}", kind: "FINAL_PIECE", piece_id: "${p9}" }, as: QC_INSPECTOR, captures: { i9: $.data.id } }
            - { call: "POST /inspections/${i9}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
