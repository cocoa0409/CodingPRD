          rationale: "The IMPORT_SUSPENSION branch's cascade down to every pair of the supplier (including the exempt sibling) and on to their entry lines is asserted end-to-end in that §1.8 instance; a §1.9 probe would duplicate its trigger and asserts."

  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: hazard_risk_score_correct_result_for_ready_to_eat_biological_hazard
        claim_type: correct_result
        grounds:
          - calculations.hazard_risk_score
          - entities.Hazard.fields.risk_score
          - endpoints["POST /fsvp/hazard-analyses/{id}/hazards"]
        distinguishing_aspect: "severity 4 × probability 3 × exposure GENERAL 1.0 × rac_relief 1.00 × rte_penalty 1.15 × control_factor FOREIGN_SUPPLIER 1.00 = 13.80 exactly; the rte_penalty applies because the food is ready_to_eat AND the hazard is BIOLOGICAL, and dropping it would give 12.00."
        test_recipe:
          setup:
