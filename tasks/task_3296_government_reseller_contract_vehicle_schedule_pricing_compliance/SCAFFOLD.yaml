    description: "Reverse FK: orders pinned to this price list"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/teaming/{id}/orders"
    description: "Reverse FK: orders routed via this teaming arrangement"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []

  # ---- price lists ----
  - method: POST
    path: "/price-lists"
    description: "Create PriceList (DRAFT) with lines"
    roles: [ContractsManager]
    code: 201
    input: [vehicle_id, period_from, period_to, lines]
    output: PriceList
    side_effects: ["creates child PriceLine rows"]
  - method: GET
    path: "/price-lists"
    description: "List price lists"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?", "vehicle_id?", "status?"]
    output: PriceList[]
    side_effects: []
  - method: GET
    path: "/price-lists/{id}"
    description: "Fetch one price list"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: []
    output: PriceList
    side_effects: []
  - method: GET
    path: "/price-lists/{id}/lines"
    description: "Reverse FK: price lines under list"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?"]
    output: PriceLine[]
    side_effects: []
  - method: POST
    path: "/price-lists/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [ContractsManager]
    code: 200
    input: []
    output: PriceList
    side_effects: ["increments PriceList.version"]
  - method: POST
    path: "/price-lists/{id}/activate"
    description: "SUBMITTED -> ACTIVE (MFC + TAA + scope re-validated; sibling ACTIVE -> SUPERSEDED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PriceList
    side_effects: ["recompute vehicle.prc_accumulator_cents", "increments PriceList.version"]
  - method: POST
    path: "/price-lists/{id}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PriceList
    side_effects: ["increments PriceList.version"]
  - method: POST
    path: "/price-lists/{id}/reopen"
    description: "ACTIVE -> DRAFT (cyclic revision loop; blocked when billed orders pinned)"
    roles: [ContractsManager]
    code: 200
    input: []
    output: PriceList
    side_effects: ["recompute vehicle.prc_accumulator_cents excluding this list", "increments PriceList.version"]
  - method: GET
    path: "/price-lists/{id}/modifications"
    description: "Reverse FK: price modifications under list"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PriceModification[]
    side_effects: []

  # ---- price modifications ----
  - method: POST
    path: "/price-modifications"
    description: "Propose a price modification (OCC on PriceList.version)"
    roles: [ContractsManager]
    code: 201
    input: [price_list_id, sku, new_offered_price_cents, reason_code, expected_price_list_version]
    output: PriceModification
    side_effects: ["increments PriceModification.version only; list version unchanged until approve"]
  - method: GET
    path: "/price-modifications/{id}"
    description: "Fetch one modification"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: PriceModification
    side_effects: []
  - method: POST
    path: "/price-modifications/{id}/approve"
    description: "PENDING -> APPROVED (SoD: approver != creator)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PriceModification
    side_effects: ["update PriceLine.offered_price_cents", "recompute vehicle.prc_accumulator_cents", "increments PriceList.version"]
  - method: POST
    path: "/price-modifications/{id}/reject"
    description: "PENDING -> REJECTED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PriceModification
    side_effects: ["increments PriceModification.version"]

  # ---- teaming ----
  - method: POST
    path: "/teaming"
    description: "Create TeamingArrangement with scope list"
    roles: [ContractsManager]
    code: 201
    input: [agreement_id, integrator_name, small_business, revenue_share_pct, window_start, window_end, scopes]
    output: TeamingArrangement
    side_effects: ["creates child TeamingScope rows"]
  - method: GET
    path: "/teaming"
    description: "List teaming arrangements"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?", "agreement_id?", "status?"]
    output: TeamingArrangement[]
    side_effects: []
  - method: GET
    path: "/teaming/{id}"
    description: "Fetch one arrangement"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, ResellerOps, Integrator]
    code: 200
    input: []
    output: TeamingArrangement
    side_effects: []
  - method: GET
    path: "/teaming/{id}/scopes"
    description: "Reverse FK: scopes under arrangement"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?"]
    output: TeamingScope[]
    side_effects: []
  - method: POST
    path: "/teaming/{id}/approve"
    description: "PROPOSED -> APPROVED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TeamingArrangement
    side_effects: ["increments TeamingArrangement.version"]
  - method: POST
    path: "/teaming/{id}/suspend"
    description: "APPROVED -> SUSPENDED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TeamingArrangement
    side_effects: ["increments TeamingArrangement.version"]
  - method: POST
    path: "/teaming/{id}/reinstate"
    description: "SUSPENDED -> APPROVED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TeamingArrangement
    side_effects: ["increments TeamingArrangement.version"]
  - method: POST
    path: "/teaming/{id}/terminate"
    description: "APPROVED -> TERMINATED"
    roles: [ContractsManager]
    code: 200
    input: []
    output: TeamingArrangement
    side_effects: ["increments TeamingArrangement.version"]

  # ---- orders ----
  - method: POST
    path: "/orders"
    description: "Create Order (DRAFT/UNBILLED); freezes order_total_cents via order_pricing"
    roles: [Integrator, ResellerOps]
    code: 201
    input: [vehicle_id, price_list_id, "teaming_id?", buyer_tier, lines]
    output: Order
    side_effects: ["compute order_total_cents + teaming_surcharge_cents"]
  - method: GET
    path: "/orders"
    description: "List orders"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: ["limit?", "offset?", "vehicle_id?", "compliance_status?", "billing_status?", "buyer_tier?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/orders/{id}"
    description: "Fetch one order"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps, Integrator]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/orders/{id}/submit"
    description: "DRAFT -> SCREENING -> auto CLEARED or BLOCKED"
    roles: [Integrator, ResellerOps]
    code: 200
    input: []
    output: Order
    side_effects: ["evaluate TAA variant", "increments Order.version"]
  - method: POST
    path: "/orders/{id}/deliver"
    description: "billing UNBILLED -> DELIVERED (enforces vehicle ceiling per buyer tier)"
    roles: [ResellerOps]
    code: 200
    input: []
    output: Order
    side_effects: ["increment PriceLine.sold_qty", "recompute vehicle.prc_accumulator_cents", "if SB teaming: subcontract_cents := order_total_cents", "increments Order.version"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "compliance -> CANCELLED (OCC on Order.version; UNBILLED only)"
    roles: [Integrator, ResellerOps]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["increments Order.version"]
  - method: GET
    path: "/orders/{id}/invoices"
    description: "Reverse FK: invoices under order"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/disputes"
    description: "Reverse FK: disputes under order"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Dispute[]
    side_effects: []

  # ---- invoices ----
  - method: POST
    path: "/invoices"
    description: "Invoice a DELIVERED order"
    roles: [ResellerOps, FinanceOps]
    code: 201
    input: [order_id, period_label, payment_terms_days]
    output: Invoice
    side_effects: ["order.billing_status := INVOICED", "upsert DRAFT SalesReport for period; total_sales_cents += amount_cents; recompute sb_goal_met"]
  - method: GET
    path: "/invoices"
    description: "List invoices"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps]
    code: 200
    input: ["limit?", "offset?", "period_label?", "status?"]
    output: Invoice[]
    side_effects: ["lazy OVERDUE evaluation on read"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch one invoice"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps]
    code: 200
    input: []
    output: Invoice
    side_effects: ["lazy OVERDUE evaluation on read"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "ISSUED|OVERDUE -> PAID"
    roles: [FinanceOps]
    code: 200
    input: []
    output: Invoice
    side_effects: ["order.billing_status := PAID", "increments Invoice.version"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "ISSUED -> VOID (reverts order to DELIVERED, decrements SalesReport)"
    roles: [FinanceOps]
    code: 200
    input: []
    output: Invoice
    side_effects: ["order.billing_status := DELIVERED", "SalesReport.total_sales_cents -= amount_cents; recompute sb_goal_met", "increments Invoice.version"]

  # ---- disputes ----
  - method: POST
    path: "/disputes"
    description: "Raise dispute on an order"
    roles: [ComplianceOfficer, FinanceOps]
    code: 201
    input: [order_id, kind, amount_cents]
    output: Dispute
    side_effects: ["agreement.dispute_credit_cents += amount_cents immediately on raise (OPEN disputes count toward ledger)", "recompute agreement.posture"]
  - method: GET
    path: "/disputes"
    description: "List disputes"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps]
    code: 200
    input: ["limit?", "offset?", "order_id?", "status?"]
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/disputes/{id}"
    description: "Fetch one dispute"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "OPEN -> RESOLVED_CREDIT | RESOLVED_DEBIT | REJECTED"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: Dispute
    side_effects: ["on REJECT: agreement.dispute_credit_cents -= original amount (compensating the raise-time credit); on CREDIT/DEBIT: amount stands", "recompute agreement.posture", "increments Dispute.version"]

  # ---- sales reports ----
  - method: POST
    path: "/sales-reports"
    description: "Manually open a DRAFT SalesReport for (agreement, period) if not auto-created"
    roles: [FinanceOps]
    code: 201
    input: [agreement_id, period_label]
    output: SalesReport
    side_effects: ["uniqueness check"]
  - method: GET
    path: "/sales-reports"
    description: "List sales reports"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps]
    code: 200
    input: ["limit?", "offset?", "agreement_id?", "period_label?", "status?"]
    output: SalesReport[]
    side_effects: []
  - method: GET
    path: "/sales-reports/{id}"
    description: "Fetch one report"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps]
    code: 200
    input: []
    output: SalesReport
    side_effects: []
  - method: POST
    path: "/sales-reports/{id}/finalize"
    description: "DRAFT -> FINALIZED (period must be closed)"
    roles: [FinanceOps]
    code: 200
    input: []
    output: SalesReport
    side_effects: ["final sb_goal_met recompute", "increments SalesReport.version"]

  # ---- audits ----
  - method: POST
    path: "/audits"
    description: "Open ComplianceAudit on an agreement"
    roles: [Auditor]
    code: 201
    input: [agreement_id, scope, mfc_attestation_cents]
    output: ComplianceAudit
    side_effects: ["compute disclosed_total_cents + mfc_variance_cents at open"]
  - method: GET
    path: "/audits"
    description: "List audits"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor]
    code: 200
    input: ["limit?", "offset?", "agreement_id?", "status?"]
    output: ComplianceAudit[]
    side_effects: []
  - method: GET
    path: "/audits/{id}"
    description: "Fetch one audit"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: []
  - method: POST
    path: "/audits/{id}/issue-finding"
    description: "OPEN -> FINDING_ISSUED (suspends agreement; SoD: Auditor only)"
    roles: [Auditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["agreement.status := SUSPENDED", "cascade vehicles/teaming SUSPENDED", "increments ComplianceAudit.version"]
  - method: POST
    path: "/audits/{id}/close"
    description: "OPEN|FINDING_ISSUED -> CLOSED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["increments ComplianceAudit.version"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADERS,       http: 401, condition: "X-User-Role or X-User-ID missing or malformed" }
  - { id: ERR_UNAUTHORIZED,               http: 403, condition: "role not permitted on endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND,                  http: 404, condition: "path-templated id does not resolve" }
  - { id: ERR_FK_NOT_FOUND,               http: 404, condition: "body-referenced FK does not resolve" }
  - { id: ERR_INVALID_STATE,              http: 409, condition: "transition not valid from current state" }
  - { id: ERR_STALE_VERSION,              http: 412, condition: "generic OCC mismatch (backstop)" }
  - { id: ERR_STALE_PRICE_LIST_VERSION,   http: 412, condition: "price-modification-stale-list OCC mismatch" }
  - { id: ERR_STALE_AGREEMENT_VERSION,    http: 412, condition: "agreement-update-stale-version OCC mismatch" }
  - { id: ERR_STALE_VEHICLE_VERSION,      http: 412, condition: "vehicle-update-stale-version OCC mismatch" }
  - { id: ERR_STALE_ORDER_VERSION,        http: 412, condition: "order-cancel-stale-version OCC mismatch" }
  - { id: ERR_MANUFACTURER_INACTIVE,      http: 422, condition: "manufacturer.status != ACTIVE on authorize/activate" }
  - { id: ERR_AGREEMENT_NOT_GOOD_STANDING,http: 422, condition: "agreement.posture != GOOD_STANDING on gated op" }
  - { id: ERR_TAA_ORIGIN_VIOLATION,       http: 422, condition: "order line origin fails TAA variant for vehicle" }
  - { id: ERR_MFC_FLOOR_VIOLATION,        http: 422, condition: "offered price exceeds MFC floor" }
  - { id: ERR_SCOPE_VIOLATION,            http: 422, condition: "buyer_tier or sku prefix outside agreement scope" }
  - { id: ERR_OUTSIDE_VEHICLE_WINDOW,     http: 422, condition: "logical clock outside vehicle effective window" }
  - { id: ERR_INVALID_PRICE_PERIOD,       http: 422, condition: "price list period empty or disjoint from vehicle window" }
  - { id: ERR_PRICE_LIST_NOT_ACTIVE,      http: 422, condition: "pinned price list is not the vehicle's ACTIVE list" }
  - { id: ERR_ORDER_LINE_INVALID,         http: 422, condition: "sku missing from pinned list, qty <= 0, or > 100 lines" }
  - { id: ERR_TEAMING_INELIGIBLE,         http: 422, condition: "teaming arrangement not APPROVED or scope mismatch" }
  - { id: ERR_VEHICLE_CEILING_EXCEEDED,   http: 422, condition: "tier-keyed consumption would exceed ceiling_cents" }
  - { id: ERR_SB_GOAL_NOT_MET,            http: 422, condition: "agreement terminate blocked by unmet small-business goal" }
  - { id: ERR_AUDIT_NOT_MATERIAL,         http: 422, condition: "mfc_variance_cents <= AUDIT_MATERIALITY_CENTS" }
  - { id: ERR_SOD_VIOLATION,              http: 422, condition: "same X-User-ID attempted both create and approve; or wrong role attempted Auditor-only op" }
  - { id: ERR_UNIQUENESS_VIOLATION,       http: 409, condition: "duns, (agreement, period), or ACTIVE list uniqueness violated" }
  - { id: ERR_PERIOD_NOT_CLOSED,          http: 422, condition: "sales report finalize before period end" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages manufacturers and logical clock; no business mutations beyond manufacturer lifecycle"
    identity: opaque
    exclusive_operations: ["POST /manufacturers", "POST /manufacturers/{id}/suspend", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: ContractsManager
    description: "Reseller contracts owner; creates/patches agreements, vehicles, price lists, teaming; submits price lists; proposes price modifications"
    identity: opaque
    exclusive_operations: ["POST /agreements", "PATCH /agreements/{id}", "POST /agreements/{id}/activate", "POST /vehicles", "PATCH /vehicles/{id}", "POST /vehicles/{id}/authorize", "POST /price-lists", "POST /price-lists/{id}/submit", "POST /price-lists/{id}/reopen", "POST /price-modifications", "POST /teaming", "POST /teaming/{id}/terminate"]
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Compliance reviewer; approves price lists and price modifications; approves/suspends teaming; raises/resolves disputes; suspends/reinstates/terminates agreements; closes audits"
    identity: opaque
    exclusive_operations: ["POST /agreements/{id}/suspend", "POST /agreements/{id}/reinstate", "POST /agreements/{id}/terminate", "POST /vehicles/{id}/suspend", "POST /vehicles/{id}/reinstate", "POST /vehicles/{id}/expire", "POST /price-lists/{id}/activate", "POST /price-lists/{id}/reject", "POST /price-modifications/{id}/approve", "POST /price-modifications/{id}/reject", "POST /teaming/{id}/approve", "POST /teaming/{id}/suspend", "POST /teaming/{id}/reinstate", "POST /disputes/{id}/resolve", "POST /audits/{id}/close"]
    shared_operations: ["all GET endpoints", "POST /disputes"]
  - name: ResellerOps
    description: "Operations; creates and delivers orders; issues invoices"
    identity: opaque
    exclusive_operations: ["POST /orders/{id}/deliver"]
    shared_operations: ["all GET endpoints", "POST /orders", "POST /orders/{id}/submit", "POST /orders/{id}/cancel", "POST /invoices"]
  - name: Integrator
    description: "System integrator; creates teaming-scoped orders and cancels own orders"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints", "POST /orders", "POST /orders/{id}/submit", "POST /orders/{id}/cancel"]
  - name: FinanceOps
    description: "Finance; manages invoices lifecycle and sales reports"
    identity: opaque
    exclusive_operations: ["POST /invoices/{id}/pay", "POST /invoices/{id}/void", "POST /sales-reports", "POST /sales-reports/{id}/finalize"]
    shared_operations: ["all GET endpoints", "POST /invoices", "POST /disputes"]
  - name: Auditor
    description: "External auditor; opens audits and issues findings; cannot close own findings (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /audits", "POST /audits/{id}/issue-finding"]
    shared_operations: ["all GET endpoints"]

