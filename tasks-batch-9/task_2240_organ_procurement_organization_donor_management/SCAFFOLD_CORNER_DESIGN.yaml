      - name: authorization_before_clearance_and_a_second_open_packet_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 43]
          - errors.ERR_AUTHORIZATION_NOT_OPENABLE
        distinguishing_aspect: |
          Both limbs of priority 43 on one referral: opening a packet while the referral is still
          SCREENING is refused, and after a legitimate packet exists a second open attempt on the same
          (now AUTH_PENDING) referral is refused too - the "no non-terminal authorization already
          exists" limb, which the status limb alone would not catch.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T08:00:00Z with a referral in SCREENING carrying a risk-assessed screening."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T08:00:00Z" }
              as: OpoAdmin
