            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-WB" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot L", part107_certificate_no: "P107-L", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            # M20 -> IN_FLIGHT
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 50 }
              as: FlightCoordinator
              captures: { m20_id: $.data.id }
            - call: "POST /ag-drone/missions/${m20_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m20_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            # M21 -> IN_FLIGHT (later window same day)
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T12:00:00Z", scheduled_end: "2026-06-02T14:00:00Z", acres_planned: 50 }
              as: FlightCoordinator
              captures: { m21_id: $.data.id }
            - call: "POST /ag-drone/missions/${m21_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T12:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m21_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
          trigger:
            # M21 launch happened; but M20 still IN_FLIGHT. We test wind=20 on M20 first.
            # M21 launch was at 12:30 but M20's window 08:00-10:00 has passed. M20 cannot
            # capture because clock advanced past its window — but capture has no temporal
            # check, only launch does. Capture on IN_FLIGHT M20 is still allowed.
            - call: "POST /ag-drone/missions/${m20_id}/capture"
              payload: { acres_flown: 50, wind_kt_max_observed: 20 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
