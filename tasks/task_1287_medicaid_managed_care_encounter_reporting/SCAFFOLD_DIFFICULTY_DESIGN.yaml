            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b_v2}" }, as: McoEncounterOps, captures: { b_v3: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e3}", expected_batch_version: "${b_v3}" }, as: McoEncounterOps }
