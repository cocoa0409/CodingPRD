          priority 2 auth) AND the same person as the condition assessor (priority 5 SoD)
          MUST receive ERR_INSUFFICIENT_PERMISSIONS — the auth failure outranks the SoD
          failure. A second call by a different user with the BillingManager role then
          succeeds, proving SoD keyed on X-User-ID was the only remaining gate.
        test_recipe:
          setup:
            - "Returned order assessed at check-in by ReturnsClerk pinned X-User-ID 'rc-shared-1'; DRAFT invoice exists for that line"
          setup_api_calls:
