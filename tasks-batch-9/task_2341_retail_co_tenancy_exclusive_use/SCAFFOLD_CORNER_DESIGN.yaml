    claim_type: aggregate_validation
    grounds:
    - validations[priority=22]
    - errors[ERR_LENDER_CONDITIONS_NOT_MET]
    - entities.EstoppelCertificate.fields.lender_conditions_met
    - entities.Lease.fields.use_compliance_status
