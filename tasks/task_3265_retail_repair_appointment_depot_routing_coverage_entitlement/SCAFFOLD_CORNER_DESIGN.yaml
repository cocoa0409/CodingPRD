# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3265_retail_repair_appointment_depot_routing_coverage_entitlement
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: customer_create_returns_all_declared_fields_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Customer
          - endpoints.POST_/customers
        distinguishing_aspect: "A customer created with email, full_name, and phone comes back 201 with account_status ACTIVE, version 1, and system-generated id / created_at / updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /repair/customers"
              payload: { email: "corner1@x.com", full_name: "Corner One", phone: "555-1000" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Customer.${cust_id}.email == \"corner1@x.com\" and full_name == \"Corner One\""
            - "Customer.${cust_id}.account_status == ACTIVE"
            - "Customer.${cust_id}.version == 1"
            - "the response data carries non-null id, created_at and updated_at"

      - name: device_get_returns_stored_data
        claim_type: Retrieval
        grounds:
          - entities.Device
          - endpoints.GET_/devices/{id}
        distinguishing_aspect: "Every Device field round-trips through GET exactly as posted, including the boolean flags."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer with one device."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "corner2@x.com", full_name: "Corner Two", phone: "555-1001" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN-C2", model_code: "IPHONE_14", activation_lock_enabled: true, proof_of_purchase_on_file: false, purchase_date: "2025-03-15T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { device_id: $.data.id, device_v: $.data.version }
          trigger:
            - call: "GET /repair/devices/${device_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "the response status is 200"
            - "Device.${device_id}.serial_number == \"SN-C2\" and model_code == \"IPHONE_14\""
            - "Device.${device_id}.activation_lock_enabled == true and proof_of_purchase_on_file == false"
            - "Device.${device_id}.device_status == ACTIVE"

      - name: service_locations_list_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/service-locations
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three service locations, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three service locations."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/service-locations"
              payload: { location_code: "C3-A", location_type: "RETAIL_STORE", address: "1 A St", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
            - call: "POST /repair/service-locations"
              payload: { location_code: "C3-B", location_type: "RETAIL_STORE", address: "2 B St", supports_same_day_repair: false, supports_express_replacement: true, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
            - call: "POST /repair/service-locations"
              payload: { location_code: "C3-C", location_type: "MAIL_IN_DEPOT", address: "3 C St", supports_same_day_repair: false, supports_express_replacement: false, diagnostic_slot_duration_minutes: 0 }
              as: PlatformAdmin
          trigger:
            - call: "GET /repair/service-locations"
              payload: { limit: 2, offset: 0 }
              as: Customer
              as_user_id: "cust-x"
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /service-locations?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"

      - name: device_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/devices/{id}
          - errors.ERR_DEVICE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID produces 404 ERR_DEVICE_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /repair/devices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Customer
              as_user_id: "cust-x"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_DEVICE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: device_create_missing_serial_number_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Device.fields.serial_number
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "serial_number is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "corner5@x.com", full_name: "Corner Five", phone: "555-1004" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /customers/${cust_id}/devices returns 0 rows"

      - name: coverage_plan_create_defaults_incidents_used_to_zero
        claim_type: Defaults
        grounds:
          - entities.CoveragePlan.fields.accidental_damage_incidents_used
        distinguishing_aspect: "accidental_damage_incidents_used defaults to 0 when not supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer with one device."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "corner6@x.com", full_name: "Corner Six", phone: "555-1005" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN-C6", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { device_id: $.data.id, device_v: $.data.version }
          trigger:
            - call: "POST /repair/coverage-plans"
              payload: { device_id: "${device_id}", plan_type: "LIMITED_WARRANTY", starts_on: "2025-01-01T00:00:00Z", expires_on: "2026-01-01T00:00:00Z", accidental_damage_incident_limit: 0, service_fee_cents: 0 }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
          assert:
            - "CoveragePlan.${plan_id}.accidental_damage_incidents_used == 0"
            - "CoveragePlan.${plan_id}.coverage_status == ACTIVE"

      - name: part_inventory_available_quantity_is_computed
        claim_type: Computed Fields
        grounds:
          - entities.PartInventory.fields.available_quantity
        distinguishing_aspect: "available_quantity is computed as on_hand - reserved - express_replacement on every read; input values are ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One location with part inventory."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/service-locations"
              payload: { location_code: "C7-LOC", location_type: "RETAIL_STORE", address: "7 C St", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /repair/parts"
              payload: { part_number: "PN-C7", model_code: "IPHONE_14", part_category: "DISPLAY", is_whole_unit_replacement: false }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /repair/part-inventories"
              payload: { location_id: "${loc_id}", part_id: "${part_id}", on_hand_quantity: 10, express_replacement_quantity: 2 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "GET /repair/part-inventories/${inv_id}"
              payload: {}
              as: Technician
              as_user_id: "tech-x"
          assert:
            - "PartInventory.${inv_id}.available_quantity == 8"
            - "PartInventory.${inv_id}.reserved_quantity == 0"

      - name: repair_order_status_is_system_managed
        claim_type: System Fields
        grounds:
          - entities.RepairOrder.fields.repair_status
        distinguishing_aspect: "repair_status is source: system with initial state TRIAGED. A client sending repair_status=COMPLETED is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base appointment setup."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "corner8@x.com", full_name: "Corner Eight", phone: "555-1007" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN-C8", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { device_id: $.data.id, device_v: $.data.version }
            - call: "POST /repair/service-locations"
              payload: { location_code: "C8-LOC", location_type: "RETAIL_STORE", address: "8 C St", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /repair/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tech C8", certification_level: "BASIC" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${device_id}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T10:00:00Z", slot_end: "2026-09-02T10:30:00Z", issue_category: "SOFTWARE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt_id}", device_id: "${device_id}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SOFTWARE", is_accidental_damage: false, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id }
          assert:
            - "RepairOrder.${ro_id}.repair_status == TRIAGED"
            - "RepairOrder.${ro_id}.version == 1"
            - "a request body containing repair_status=COMPLETED is ignored by the server"

      - name: device_create_with_invalid_enum_model_code_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Device.fields.model_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "model_code is a string but the system validates against known model families; an empty string is rejected."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "corner9@x.com", full_name: "Corner Nine", phone: "555-1008" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN-C9", model_code: "", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: repair_order_create_checks_appointment_belongs_to_device
        claim_type: Parent Relationships
        grounds:
          - entities.RepairOrder.fields.appointment_id
          - validations.priority_9_business_referential
        distinguishing_aspect: "RepairOrder references an Appointment; if the appointment's device_id does not match the repair order's device_id, the request is rejected."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two devices, one appointment on device A."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "corner10@x.com", full_name: "Corner Ten", phone: "555-1009" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN-C10A", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { dev_a: $.data.id, device_v: $.data.version }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN-C10B", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { dev_b: $.data.id, device_v: $.data.version }
            - call: "POST /repair/service-locations"
              payload: { location_code: "C10-LOC", location_type: "RETAIL_STORE", address: "10 C St", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /repair/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tech C10", certification_level: "BASIC" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${dev_a}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T10:00:00Z", slot_end: "2026-09-02T10:30:00Z", issue_category: "SOFTWARE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt_id}", device_id: "${dev_b}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "SOFTWARE", is_accidental_damage: false, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_REFERENCE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: appointment_cancel_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Appointment.COMPLETED_to_CANCELLED
        distinguishing_aspect: "Appointment already COMPLETED — cancel must fail with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Appointment completed."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "corner11@x.com", full_name: "Corner Eleven", phone: "555-1010" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN-C11", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { device_id: $.data.id, device_v: $.data.version }
            - call: "POST /repair/service-locations"
              payload: { location_code: "C11-LOC", location_type: "RETAIL_STORE", address: "11 C St", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /repair/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tech C11", certification_level: "BASIC" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${device_id}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T10:00:00Z", slot_end: "2026-09-02T10:30:00Z", issue_category: "SOFTWARE", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt_id: $.data.id }
            - call: "POST /repair/appointments/${appt_id}/check-in"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /repair/appointments/${appt_id}/start-diagnosis"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/appointments/${appt_id}/complete-diagnosis"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /repair/appointments/${appt_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"

      - name: repair_order_allocate_parts_from_in_progress_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RepairOrder.IN_PROGRESS_to_PARTS_ALLOCATED
        distinguishing_aspect: "RepairOrder in IN_PROGRESS — allocate-parts must fail with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Repair order in IN_PROGRESS."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair/customers"
              payload: { email: "corner12@x.com", full_name: "Corner Twelve", phone: "555-1011" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /repair/devices"
              payload: { customer_id: "${cust_id}", serial_number: "SN-C12", model_code: "IPHONE_14", activation_lock_enabled: false, proof_of_purchase_on_file: true, purchase_date: "2025-01-01T00:00:00Z" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { device_id: $.data.id, device_v: $.data.version }
            - call: "POST /repair/service-locations"
              payload: { location_code: "C12-LOC", location_type: "RETAIL_STORE", address: "12 C St", supports_same_day_repair: true, supports_express_replacement: false, diagnostic_slot_duration_minutes: 30 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /repair/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tech C12", certification_level: "ADVANCED" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /repair/appointments"
              payload: { customer_id: "${cust_id}", device_id: "${device_id}", location_id: "${loc_id}", technician_id: "${tech_id}", slot_start: "2026-09-02T10:00:00Z", slot_end: "2026-09-02T10:30:00Z", issue_category: "BATTERY", expected_device_version: "${device_v}" }
              as: CustomerService
              as_user_id: "cs-1"
              captures: { appt_id: $.data.id }
            - call: "POST /repair/repair-orders"
              payload: { appointment_id: "${appt_id}", device_id: "${device_id}", customer_id: "${cust_id}", origin_location_id: "${loc_id}", issue_category: "BATTERY", is_accidental_damage: false, data_backup_acknowledged: true, privacy_wipe_consent: true, expected_device_version: "${device_v}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /repair/security-verifications"
              payload: { repair_order_id: "${ro_id}", verification_type: "ACTIVATION_LOCK_REMOVAL" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /repair/security-verifications/${sec_id}/verify"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair/repair-orders/${ro_id}/allocate-parts"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
