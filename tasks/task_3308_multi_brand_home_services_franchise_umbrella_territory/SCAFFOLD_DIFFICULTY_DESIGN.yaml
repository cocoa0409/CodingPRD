              captures: { agt_a2_id: $.data.id }
            - *c_off_ms
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_ms_v: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_ms_v}" }
              as: FranchiseAdmin
            - call: "POST /franchise/territories/${ter_il_id}/offer"
              payload: { franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_il_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_il_v: $.data.version }
            - call: "POST /franchise/territories/${ter_il_id}/award"
              payload: { expected_territory_version: "${ter_il_v}" }
              as: FranchiseAdmin
            - *c_off_a1
            - call: "POST /franchise/agreements/${agt_a2_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_a1_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_a2_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/leads"
              payload: { brand_id: "${ms_brand_id}", source: "CALL_CENTER", household_income_band: "BAND_2", estimated_value_cents: 150000 }
              as: FranchiseAdmin
              captures: { lead1_id: $.data.id }
            - call: "GET /franchise/franchisees/${fr_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { fr_ms_v: $.data.version }
          trigger:
            - call: "POST /franchise/leads/${lead1_id}/allocate"
              payload: { expected_franchisee_version: "${fr_ms_v}", allocated_agreement_id: "${agt_a1_id}" }
