scenario: "Mobile Home Community Lot Lease: lot rental, utility apportionment, home sale with lot lease, annual increase cap (state-specific), eviction for violation, Park-owned/Resident-owned conversion."

domain_name: mobile-home-lease
api_prefix: /parks

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - scheduled_deferred_actions
    - ops_run_checkpoint
    - cascading_side_effects
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entities
# =============================================================================
entities:
  - name: Park
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Mobile home park display name.
        constraints: 1..120 chars, unique per park.
      - name: state_code
        type: enum
        source: input
        description: US state where the park is located; selects the annual rent-increase cap law.
        constraints: One of {CA, FL, OR, AZ, TX}. CA cap=5.0% + master_cpi capped at 10.0%. OR cap=7.0% + master_cpi capped at 10.0%. FL cap=null (no statutory cap). AZ cap=10.0% flat (no CPI add). TX cap=null (no statutory cap).
      - name: master_cpi_pct
        type: number
        source: input
        description: Park-level CPI (percent) used by states that compute cap as base_pct + master_cpi_pct.
        constraints: 0.00..20.00, two decimals.
      - name: utility_apportionment_method
        type: enum
        source: input
        description: How master-metered utility totals are split across occupied lots.
        constraints: One of {SUB_METER, EQUAL_SPLIT}. SUB_METER uses each lot's sub_meter_reading. EQUAL_SPLIT divides equally across lots whose lease is in CURRENT or DELINQUENT status.
      - name: billing_period_anchor_day
        type: integer
        source: input
        description: Day-of-month on which the monthly billing run is anchored (used by clock-advance test endpoint).
        constraints: 1..28.
      - name: ownership_pool_count
        type: integer
        source: computed
        description: Count of Lots whose ownership_mode == PARK_OWNED. Recomputed on every Lot ownership change.
        default: 0
  - name: Lot
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: Foreign key to Park.
      - name: lot_number
        type: string
        source: input
        description: Lot identifier within the park.
        constraints: 1..16 chars, unique within Park.
      - name: ownership_mode
        type: enum
        source: computed
        description: Who owns the home sitting on the lot. PARK_OWNED means the park rents both the lot AND the home; RESIDENT_OWNED means resident owns the home and only rents the lot.
        constraints: One of {PARK_OWNED, RESIDENT_OWNED}. Set on Lot creation; mutated only by Conversion side-effects.
        default: PARK_OWNED
      - name: base_rent_cents
        type: integer
        source: input
        description: Current monthly rent in cents. Mutated only when a RentIncreaseNotice becomes effective.
        constraints: "> 0."
      - name: sub_meter_reading_kwh
        type: number
        source: input
        description: Latest sub-meter reading in kWh; consumed by SUB_METER apportionment.
        constraints: ">= 0.0, three decimals."
      - name: home_id
        type: string
        source: computed
        description: FK to the Home sitting on this lot, or null if vacant. Set by Home placement / Conversion.
        default: null
      - name: current_lease_id
        type: string
        source: computed
        description: FK to the Lease in state CURRENT/DELINQUENT/GRACE on this lot, or null.
        default: null
  - name: Home
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: FK to Park where the home is sited.
      - name: lot_id
        type: string
        source: computed
        description: FK to Lot the home currently occupies; null only during a sale handover window.
      - name: owner_resident_id
        type: string
        source: computed
        description: Resident who owns the home (RESIDENT_OWNED) or null when the Park owns it (PARK_OWNED via Lot.ownership_mode).
        default: null
      - name: vin
        type: string
        source: input
        description: Mobile home VIN.
        constraints: Exactly 17 chars, A-Z and 0-9, globally unique.
      - name: assessed_value_cents
        type: integer
        source: input
        description: Most recent assessed value of the home in cents (used by conversion buyout calc).
        constraints: "> 0."
  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name.
        constraints: 1..120 chars.
      - name: email
        type: string
        source: input
        description: Contact email.
        constraints: RFC5322, globally unique.
      - name: violation_count_12mo
        type: integer
        source: computed
        description: Rolling count of EvictionCases against this resident that finalized in state FINALIZED_FOR_CAUSE within the last 365 days from current clock.
        default: 0
  - name: Lease
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK to Lot under lease.
      - name: resident_id
        type: string
        source: input
        description: Tenant Resident.
      - name: monthly_rent_cents
        type: integer
        source: computed
        description: Rent applied for the lease's CURRENT month. Equals Lot.base_rent_cents unless a RentIncreaseNotice has become effective.
      - name: start_date
        type: datetime
        source: input
        description: Lease commencement (UTC, midnight aligned).
      - name: status
        type: enum
        source: computed
        description: Lease lifecycle state.
        constraints: One of {DRAFT, CURRENT, DELINQUENT, GRACE, TERMINATED, ASSUMED}. DRAFT created by POST; CURRENT activated on signing; DELINQUENT after monthly billing run if outstanding_balance_cents > 0; GRACE during eviction cure period; TERMINATED on eviction finalize; ASSUMED when transferred during a home sale.
        default: DRAFT
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: Sum of unpaid UtilityBill.total_due_cents and unpaid monthly rent for this lease.
        default: 0
      - name: predecessor_lease_id
        type: string
        source: computed
        description: Self-referential FK to the prior Lease that this lease succeeded via home sale assumption; null for original leases.
        default: null
  - name: RentIncreaseNotice
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: Lease the notice applies to.
      - name: proposed_new_rent_cents
        type: integer
        source: input
        description: Submitted target rent in cents.
        constraints: "> current monthly_rent_cents."
      - name: effective_on
        type: datetime
        source: input
        description: Date on which the increase becomes effective. Must be at least 90 calendar days after notice issuance.
      - name: capped_new_rent_cents
        type: integer
        source: computed
        description: New rent after applying the state-specific cap to proposed_new_rent_cents. May equal proposed if under cap; capped at the maximum legal value otherwise.
      - name: status
        type: enum
        source: computed
        description: Notice lifecycle.
        constraints: One of {DRAFT, ISSUED, EFFECTIVE, VOIDED}. DRAFT on POST; ISSUED on POST /issue (locks fields); EFFECTIVE after clock crosses effective_on and pending sweep runs; VOIDED if lease terminates first.
        default: DRAFT
  - name: EvictionCase
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: Lease being challenged.
      - name: violation_type
        type: enum
        source: input
        description: Reason for eviction filing.
        constraints: "One of {NONPAYMENT, RULE_VIOLATION, ILLEGAL_USE}. Selects the cure window — NONPAYMENT=30 days, RULE_VIOLATION=14 days, ILLEGAL_USE=0 days (no cure offered)."
      - name: filed_at
        type: datetime
        source: system
        description: Server timestamp on POST /eviction-cases.
      - name: cure_deadline
        type: datetime
        source: computed
        description: filed_at + cure_window_days. Null when violation_type=ILLEGAL_USE.
      - name: status
        type: enum
        source: computed
        description: Case lifecycle.
        constraints: One of {FILED, IN_CURE, CURED, FINALIZED_FOR_CAUSE, DISMISSED}. FILED→IN_CURE when cure window > 0 (auto on filing); FILED→FINALIZED_FOR_CAUSE direct path for ILLEGAL_USE; IN_CURE→CURED on tenant cure action; IN_CURE→FINALIZED_FOR_CAUSE when clock passes cure_deadline and sweep runs without cure; FILED/IN_CURE/CURED→DISMISSED only by ParkManager.
        default: FILED
  - name: UtilityBill
    parent: Lot
    common_fields: false
    fields:
      - name: lot_id
        type: string
        source: input
        description: Lot the bill applies to.
      - name: lease_id
        type: string
        source: system
        description: Lease in effect on the lot at the billing-period end (or null if vacant).
      - name: billing_period_start
        type: datetime
        source: system
        description: Inclusive start of the billing period.
      - name: billing_period_end
        type: datetime
        source: system
        description: Exclusive end of the billing period.
      - name: master_total_cents
        type: integer
        source: input
        description: Park-level master meter charge for the period, supplied to the monthly sweep.
        constraints: ">= 0."
      - name: lot_share_cents
        type: integer
        source: computed
        description: This lot's apportioned share.
      - name: rent_due_cents
        type: integer
        source: computed
        description: Rent component for the period (Lease.monthly_rent_cents if lease active for the whole period, else prorated).
      - name: total_due_cents
        type: integer
        source: computed
        description: rent_due_cents + lot_share_cents.
      - name: paid_at
        type: datetime
        source: computed
        description: Timestamp when tenant marked the bill paid in full; null while outstanding.
        default: null
  - name: HomeSaleTransfer
    parent: Home
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: Home being sold.
      - name: seller_resident_id
        type: string
        source: input
        description: Current home owner (must equal Home.owner_resident_id).
      - name: buyer_resident_id
        type: string
        source: input
        description: Prospective new owner.
      - name: sale_price_cents
        type: integer
        source: input
        description: Agreed sale price in cents.
        constraints: "> 0."
      - name: status
        type: enum
        source: computed
        description: Transfer workflow.
        constraints: One of {PENDING_PARK_APPROVAL, APPROVED, REJECTED, CLOSED}. PENDING_PARK_APPROVAL on POST; APPROVED by ParkManager only if buyer has zero open EvictionCases anywhere; REJECTED otherwise; CLOSED on POST /close which assumes the lease.
        default: PENDING_PARK_APPROVAL
      - name: new_lease_id
        type: string
        source: computed
        description: FK to the successor Lease created on CLOSED; null until close.
        default: null
  - name: ConversionRequest
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: Lot subject to conversion. Park-owned → resident-owned (one direction only).
      - name: prospective_buyer_resident_id
        type: string
        source: input
        description: Resident who will own the home post-conversion.
      - name: offer_price_cents
        type: integer
        source: input
        description: Park's offered buyout price in cents (must be >= Home.assessed_value_cents to be accepted).
      - name: status
        type: enum
        source: computed
        description: Conversion lifecycle.
        constraints: One of {OFFERED, ACCEPTED, REJECTED, CLOSED}. OFFERED on POST; ACCEPTED by resident if price >= assessed; REJECTED otherwise (terminal); CLOSED via POST /finalize switching Lot.ownership_mode.
        default: OFFERED

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED, ASSUMED]
    transitions:
      - from: DRAFT
        to: CURRENT
        trigger: "POST /leases/{id}/sign"
        actor: ParkManager
        preconditions:
          - "Lot.current_lease_id is null"
          - "Resident.violation_count_12mo == 0"
        side_effects:
          - "Lot.current_lease_id := this.id"
          - "Lease.monthly_rent_cents := Lot.base_rent_cents"
      - from: CURRENT
        to: DELINQUENT
        trigger: "Monthly billing run (POST /_sweep/billing) finds outstanding_balance_cents > 0"
        actor: system
        preconditions: ["outstanding_balance_cents > 0 after billing"]
        side_effects: ["No automatic eviction; ParkManager may file EvictionCase"]
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /leases/{id}/pay (pays all UtilityBill rows)"
        actor: Resident
        preconditions: ["outstanding_balance_cents drops to 0"]
        side_effects: ["UtilityBill.paid_at set on every previously unpaid bill"]
      - from: CURRENT
        to: GRACE
        trigger: "EvictionCase filed for this lease enters IN_CURE state"
        actor: system
        preconditions: ["No other open EvictionCase against this lease"]
        side_effects: ["Block RentIncreaseNotice issuance while in GRACE"]
      - from: DELINQUENT
        to: GRACE
        trigger: "EvictionCase filed for this lease enters IN_CURE state"
        actor: system
        preconditions: []
        side_effects: ["Block RentIncreaseNotice issuance while in GRACE"]
      - from: GRACE
        to: CURRENT
        trigger: "EvictionCase associated with this lease transitions to CURED or DISMISSED"
        actor: system
        preconditions: ["outstanding_balance_cents == 0"]
        side_effects: []
      - from: GRACE
        to: DELINQUENT
        trigger: "EvictionCase associated with this lease transitions to CURED or DISMISSED while balance > 0"
        actor: system
        preconditions: ["outstanding_balance_cents > 0"]
        side_effects: []
      - from: GRACE
        to: TERMINATED
        trigger: "EvictionCase associated with this lease transitions to FINALIZED_FOR_CAUSE"
        actor: system
        preconditions: []
        side_effects:
          - "Lot.current_lease_id := null"
          - "Any DRAFT/ISSUED RentIncreaseNotice on this lease transitions to VOIDED"
          - "Resident.violation_count_12mo incremented by 1"
      - from: CURRENT
        to: ASSUMED
        trigger: "HomeSaleTransfer for the home on this lot transitions to CLOSED"
        actor: system
        preconditions: ["Lot.ownership_mode == RESIDENT_OWNED"]
        side_effects:
          - "Create successor Lease in CURRENT with predecessor_lease_id := this.id, resident_id := buyer, monthly_rent_cents := this.monthly_rent_cents"
          - "Lot.current_lease_id := successor.id"
          - "Home.owner_resident_id := buyer_resident_id"
          - "HomeSaleTransfer.new_lease_id := successor.id"

  - entity: EvictionCase
    initial_state: FILED
    terminal_states: [FINALIZED_FOR_CAUSE, DISMISSED]
    transitions:
      - from: FILED
        to: IN_CURE
        trigger: "Automatic on creation when violation_type in {NONPAYMENT, RULE_VIOLATION}"
        actor: system
        preconditions: ["cure_deadline is not null"]
        side_effects:
          - "Lease transitions to GRACE (from CURRENT or DELINQUENT)"
      - from: FILED
        to: FINALIZED_FOR_CAUSE
        trigger: "Automatic on creation when violation_type == ILLEGAL_USE"
        actor: system
        preconditions: ["cure_deadline is null"]
        side_effects:
          - "Lease transitions GRACE→TERMINATED chain (or CURRENT/DELINQUENT→TERMINATED via GRACE)"
          - "See Lease transition GRACE→TERMINATED for downstream cascade"
      - from: IN_CURE
        to: CURED
        trigger: "POST /eviction-cases/{id}/cure"
        actor: Resident
        preconditions:
          - "now() < cure_deadline"
          - "For NONPAYMENT: Lease.outstanding_balance_cents == 0"
        side_effects:
          - "Lease transitions GRACE→CURRENT (if balance 0) or GRACE→DELINQUENT (if balance > 0)"
      - from: IN_CURE
        to: FINALIZED_FOR_CAUSE
        trigger: "Eviction sweep (POST /_sweep/evictions) sees now() >= cure_deadline"
        actor: system
        preconditions: ["No CURED transition occurred"]
        side_effects:
          - "Lease GRACE→TERMINATED cascade"
      - from: FILED
        to: DISMISSED
        trigger: "POST /eviction-cases/{id}/dismiss"
        actor: ParkManager
        preconditions: []
        side_effects: []
      - from: IN_CURE
        to: DISMISSED
        trigger: "POST /eviction-cases/{id}/dismiss"
        actor: ParkManager
        preconditions: []
        side_effects:
          - "Lease GRACE→CURRENT (if balance 0) or GRACE→DELINQUENT (if balance > 0)"
      - from: CURED
        to: DISMISSED
        trigger: "POST /eviction-cases/{id}/dismiss"
        actor: ParkManager
        preconditions: []
        side_effects: []

  - entity: RentIncreaseNotice
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /rent-increase-notices/{id}/issue"
        actor: ParkManager
        preconditions:
          - "Lease.status in {CURRENT, DELINQUENT} (NOT GRACE — RentIncreaseNotice issuance blocked while lease in GRACE)"
          - "effective_on >= now() + 90 days"
          - "proposed_new_rent_cents > Lease.monthly_rent_cents"
        side_effects:
          - "Compute capped_new_rent_cents per Park.state_code cap rule (see calculation rent_cap_application)"
          - "Lock proposed_new_rent_cents, effective_on, capped_new_rent_cents (immutable post-issuance)"
      - from: ISSUED
        to: EFFECTIVE
        trigger: "Rent-effective sweep (POST /_sweep/rent-effective) sees now() >= effective_on"
        actor: system
        preconditions: ["Lease.status in {CURRENT, DELINQUENT}"]
        side_effects:
          - "Lease.monthly_rent_cents := capped_new_rent_cents"
          - "Lot.base_rent_cents := capped_new_rent_cents"
      - from: DRAFT
        to: VOIDED
        trigger: "Lease transitions to TERMINATED or ASSUMED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "Lease transitions to TERMINATED or ASSUMED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HomeSaleTransfer
    initial_state: PENDING_PARK_APPROVAL
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: PENDING_PARK_APPROVAL
        to: APPROVED
        trigger: "POST /home-sale-transfers/{id}/approve"
        actor: ParkManager
        preconditions:
          - "Lot.ownership_mode == RESIDENT_OWNED"
          - "Buyer Resident has zero EvictionCases in status FILED/IN_CURE/FINALIZED_FOR_CAUSE within last 365 days"
          - "Home.owner_resident_id == seller_resident_id"
        side_effects: []
      - from: PENDING_PARK_APPROVAL
        to: REJECTED
        trigger: "POST /home-sale-transfers/{id}/reject"
        actor: ParkManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CLOSED
        trigger: "POST /home-sale-transfers/{id}/close"
        actor: ParkManager
        preconditions:
          - "Lease for this home's lot is in CURRENT or DELINQUENT (NOT GRACE/TERMINATED/ASSUMED)"
        side_effects:
          - "Lease transitions to ASSUMED (see Lease CURRENT→ASSUMED side effects for successor creation cascade)"
          - "HomeSaleTransfer.new_lease_id := successor lease id"

  - entity: ConversionRequest
    initial_state: OFFERED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /conversion-requests/{id}/accept"
        actor: Resident
        preconditions:
          - "offer_price_cents >= Home.assessed_value_cents"
          - "Lot.ownership_mode == PARK_OWNED"
        side_effects: []
      - from: OFFERED
        to: REJECTED
        trigger: "POST /conversion-requests/{id}/reject OR offer_price_cents < Home.assessed_value_cents at accept time"
        actor: Resident
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /conversion-requests/{id}/finalize"
        actor: ParkManager
        preconditions:
          - "Lot.ownership_mode == PARK_OWNED at finalize time"
        side_effects:
          - "Lot.ownership_mode := RESIDENT_OWNED"
          - "Home.owner_resident_id := prospective_buyer_resident_id"
          - "Park.ownership_pool_count decremented by 1"
          - "If Lot has no current_lease_id: create new Lease in CURRENT with resident_id := buyer, monthly_rent_cents := Lot.base_rent_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two POST /home-sale-transfers/{id}/approve calls race on the same transfer"
    guarantee: "At most one transition PENDING_PARK_APPROVAL → APPROVED succeeds; second loses with ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on HomeSaleTransfer.status field."
  - scenario: "ParkManager dismisses an EvictionCase while eviction sweep is finalizing it for cause"
    guarantee: "Exactly one of {DISMISSED, FINALIZED_FOR_CAUSE} wins; loser receives ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on EvictionCase.status."
  - scenario: "Two POST /rent-increase-notices/{id}/issue requests on the same draft notice"
    guarantee: "Exactly one issue succeeds; the second is rejected with ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RentIncreaseNotice.status."
  - scenario: "Concurrent POST /conversion-requests/{id}/finalize and POST /home-sale-transfers/{id}/close on the same Lot"
    guarantee: "At most one mutation of Lot.ownership_mode/current_lease_id wins; loser receives ERR_LOT_OCCUPIED_BY_PENDING_OP."
    error_id: ERR_LOT_OCCUPIED_BY_PENDING_OP
    http_status: 409
    serialization: "First-writer-wins on Lot.version."
  - scenario: "Two POST /leases/{id}/pay requests on the same delinquent lease"
    guarantee: "At most one succeeds in marking bills paid; the duplicate is rejected with ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Lease.outstanding_balance_cents drop to 0."

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: rent_cap_application
    trigger: "POST /rent-increase-notices/{id}/issue (state transition DRAFT→ISSUED on RentIncreaseNotice)"
    algorithm: threshold
    formula: |
      current = Lease.monthly_rent_cents
      proposed = RentIncreaseNotice.proposed_new_rent_cents
      proposed_pct = ((proposed - current) / current) * 100.0      # percent, float
      state = Park.state_code
      cpi = Park.master_cpi_pct
      if state == "CA":
          max_pct = min(5.0 + cpi, 10.0)
      elif state == "OR":
          max_pct = min(7.0 + cpi, 10.0)
      elif state == "AZ":
          max_pct = 10.0                                            # flat, no CPI
      elif state in {"FL", "TX"}:
          max_pct = None                                            # no statutory cap
      if max_pct is None or proposed_pct <= max_pct:
          capped_new_rent_cents = proposed
      else:
          # Cap activates: round-half-up to nearest cent AFTER applying percent
          capped_new_rent_cents = round_half_up(current * (1 + max_pct / 100.0))
    input_set: "Park.state_code, Park.master_cpi_pct (latest committed value), Lease.monthly_rent_cents (current), RentIncreaseNotice.proposed_new_rent_cents."
    constants:
      CA_BASE_PCT: 5.0
      OR_BASE_PCT: 7.0
      AZ_FLAT_PCT: 10.0
      ABSOLUTE_CEILING_CA_OR_PCT: 10.0
    precision: "Cents are integer. Intermediate percent math uses Python float; final cents rounded half-up. Cap-application path: round(current * (1 + max_pct/100), nearest cent). Order of operations: (1) compute proposed_pct, (2) lookup max_pct by state, (3) compare, (4) IF capping: apply percent then round to cents — NOT round the percent first."
    variants:
      - name: capped_under_ceiling
        when: "State is CA or OR and (base_pct + cpi) < 10.0"
        difference: "Cap = base_pct + cpi. E.g., CA with cpi=2.0 -> cap=7.0%. proposed 8% -> capped to 7%."
      - name: capped_at_ceiling
        when: "State is CA or OR and (base_pct + cpi) >= 10.0"
        difference: "Cap clamps to absolute 10.0%. E.g., CA cpi=8.0 -> cap min(13.0, 10.0)=10.0%."
      - name: uncapped
        when: "State is FL or TX"
        difference: "max_pct=None; proposed value is used as-is regardless of magnitude."

  - name: utility_apportionment
    trigger: "Monthly billing run (POST /_sweep/billing) creates one UtilityBill per occupied Lot."
    algorithm: waterfall_allocation
    formula: |
      method = Park.utility_apportionment_method
      master_total = period_master_total_cents
      occupied_lots = [L for L in Park.lots
                       if L.current_lease_id is not null
                       and Lease(L.current_lease_id).status in {CURRENT, DELINQUENT, GRACE}]
      occupied_lots.sort_by(Lot.lot_number ascending)  # tie-break for remainder
      if method == "SUB_METER":
          total_kwh = sum(L.sub_meter_reading_kwh for L in occupied_lots)
          if total_kwh == 0.0:
              # zero-reading edge case: split equally
              shares = [master_total // n for L in occupied_lots]  # n = count
              remainder = master_total - sum(shares)
          else:
              raw = [(L.sub_meter_reading_kwh / total_kwh) * master_total for L in occupied_lots]
              shares = [floor(r) for r in raw]                     # truncate to cents
              remainder = master_total - sum(shares)
      elif method == "EQUAL_SPLIT":
          n = len(occupied_lots)
          if n == 0:
              shares = []
              remainder = 0
          else:
              shares = [master_total // n for _ in occupied_lots]
              remainder = master_total - sum(shares)
      # Distribute remainder cent-by-cent to lots in ascending lot_number order
      for i in range(remainder):
          shares[i] += 1
      assign shares[i] to occupied_lots[i].lot_share_cents
    input_set: "occupied_lots = Lot rows with current_lease_id pointing to a Lease whose status is in {CURRENT, DELINQUENT, GRACE}. TERMINATED/ASSUMED/DRAFT leases excluded. Sub-meter readings: latest value at billing_period_end - 1 microsecond."
    constants:
      EXCLUDED_LEASE_STATES: ["DRAFT", "TERMINATED", "ASSUMED"]
    precision: "Integer cents. Truncate raw fractional cents (floor), then distribute remainder cents one-per-lot in ascending lot_number order (tie-break)."
    variants:
      - name: sub_meter_method
        when: "Park.utility_apportionment_method == SUB_METER and sum of readings > 0"
        difference: "Proportional to sub_meter_reading_kwh ratio."
      - name: equal_split_method
        when: "Park.utility_apportionment_method == EQUAL_SPLIT or (SUB_METER with all zero readings)"
        difference: "Equal division floor + waterfall remainder."

  - name: lease_outstanding_balance
    trigger: "Recomputed (a) at end of each monthly billing run after UtilityBill rows are created, (b) on POST /leases/{id}/pay, (c) when a UtilityBill is marked paid."
    algorithm: aggregation
    formula: |
      outstanding = SUM(UtilityBill.total_due_cents)
                    FOR bills WHERE bill.lease_id == this.id
                              AND bill.paid_at IS NULL
                              AND bill.billing_period_end <= now()
      Lease.outstanding_balance_cents = outstanding
    input_set: "All UtilityBill rows whose lease_id matches and whose paid_at is null and whose billing_period_end has elapsed at evaluation time."
    constants: {}
    precision: "Integer cents. Sum is exact."
    variants:
      - name: post_billing_recompute
        when: "After /_sweep/billing run"
        difference: "Includes the just-created period's UtilityBill."
      - name: post_payment_recompute
        when: "After POST /leases/{id}/pay clears all bills"
        difference: "Resulting value is 0 (drives DELINQUENT→CURRENT and IN_CURE NONPAYMENT cure eligibility)."

  - name: resident_violation_count_12mo
    trigger: "Recomputed at the start of HomeSaleTransfer approval check, at Lease sign precondition check, and on EvictionCase.status mutation."
    algorithm: aggregation
    formula: |
      count = COUNT(EvictionCase
                    WHERE Lease(case.lease_id).resident_id == this_resident.id
                      AND case.status == FINALIZED_FOR_CAUSE
                      AND (now() - case.updated_at).days <= 365)
      Resident.violation_count_12mo = count
    input_set: "EvictionCases that finalized FOR_CAUSE with updated_at within the 365-day rolling window ending at evaluation time. Tie-break / boundary: updated_at exactly 365 days ago is INCLUDED (>=). Updated_at strictly more than 365 days ago is excluded."
    constants:
      WINDOW_DAYS: 365
    precision: "Integer count."
    variants:
      - name: at_window_boundary
        when: "EvictionCase.updated_at == now() - 365 days exactly"
        difference: "Included (boundary is inclusive: 'within last 365 days' means days_elapsed <= 365)."
      - name: outside_window
        when: "EvictionCase.updated_at == now() - 366 days"
        difference: "Excluded; resident is eligible again."

  - name: rent_due_calculation
    trigger: "Per UtilityBill row during /_sweep/billing."
    algorithm: chronological
    formula: |
      # Two competing interpretations resolved here:
      # Variant A (full-period): if Lease was in {CURRENT,DELINQUENT,GRACE} on billing_period_end - 1 microsecond,
      #                          charge full Lease.monthly_rent_cents.
      # Variant B (prorated):    if Lease was newly activated (DRAFT->CURRENT) mid-period, prorate by days active.
      # The scaffold pins Variant B: prorate.
      lease = Lease(lot.current_lease_id) if lot.current_lease_id is not null else None
      if lease is None:
          rent_due_cents = 0
      else:
          period_start = bill.billing_period_start
          period_end = bill.billing_period_end
          active_start = max(lease.start_date, period_start)
          period_days = (period_end - period_start).days
          active_days = (period_end - active_start).days
          if active_days >= period_days:
              rent_due_cents = lease.monthly_rent_cents
          else:
              rent_due_cents = floor((lease.monthly_rent_cents * active_days) / period_days)
    input_set: "Lease.monthly_rent_cents at billing_period_end, lease.start_date, period interval [start, end)."
    constants: {}
    precision: "Integer cents. Floor truncate proration. Day counts use whole calendar days at UTC midnight; partial days round down."
    variants:
      - name: full_period_rent
        when: "lease.start_date <= billing_period_start"
        difference: "Charge full lease.monthly_rent_cents."
      - name: prorated_rent
        when: "lease.start_date > billing_period_start (mid-period activation including ASSUMED successors)"
        difference: "Prorate by floor(monthly_rent * active_days / period_days). Boundary: a successor lease whose start_date == billing_period_start is FULL period."

  - name: conversion_buyout_eligibility
    trigger: "POST /conversion-requests/{id}/accept (Resident action)."
    algorithm: threshold
    formula: |
      eligible = (ConversionRequest.offer_price_cents >= Home.assessed_value_cents)
      if eligible: transition OFFERED -> ACCEPTED
      else: transition OFFERED -> REJECTED
    input_set: "ConversionRequest.offer_price_cents and Home.assessed_value_cents at accept time. Boundary: equal price is ACCEPT (>=, not >)."
    constants: {}
    precision: "Integer cents comparison."
    variants:
      - name: meets_threshold
        when: "offer_price_cents >= assessed_value_cents"
        difference: "Transition to ACCEPTED."
      - name: below_threshold
        when: "offer_price_cents < assessed_value_cents"
        difference: "Transition to REJECTED (terminal)."

# =============================================================================
# §1.4 Validation Rules (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role authorized for this endpoint per RBAC matrix (§1.7)."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All resources referenced in URL path exist (Park, Lot, Lease, Home, etc.), validated left-to-right."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "Resources referenced in request body (resident_id, home_id, lease_id, etc.) exist."
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Acting role's identity matches the resource (e.g., Resident-only actions require X-User-ID == owner)."
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "Resident-only POST endpoints (pay, cure, accept conversion)"
  - priority: 6
    category: state
    check: "Target resource in valid source state for the requested transition."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state-transition endpoints"
  - priority: 7
    category: state
    check: "OCC version match — when client supplies version in body it MUST equal current entity version."
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "PATCH endpoints"
  - priority: 8
    category: business_safety
    check: "EvictionCase.violation_type ILLEGAL_USE forbids cure attempts (no IN_CURE state reachable)."
    error_id: ERR_NO_CURE_PERMITTED
    http_status: 409
    applies_to: "POST /eviction-cases/{id}/cure"
  - priority: 9
    category: business_safety
    check: "Buyer in HomeSaleTransfer has zero EvictionCases in FILED/IN_CURE/FINALIZED_FOR_CAUSE within last 365 days."
    error_id: ERR_BUYER_INELIGIBLE
    http_status: 422
    applies_to: "POST /home-sale-transfers/{id}/approve"
  - priority: 10
    category: business_referential
    check: "Lease being signed targets a Lot whose current_lease_id is null."
    error_id: ERR_LOT_OCCUPIED
    http_status: 409
    applies_to: "POST /leases/{id}/sign"
  - priority: 11
    category: business_referential
    check: "ConversionRequest finalize requires Lot.ownership_mode == PARK_OWNED."
    error_id: ERR_LOT_ALREADY_RESIDENT_OWNED
    http_status: 409
    applies_to: "POST /conversion-requests/{id}/finalize"
  - priority: 12
    category: business_referential
    check: "HomeSaleTransfer requires Lot.ownership_mode == RESIDENT_OWNED on approval (park-owned homes cannot be sold to residents this way)."
    error_id: ERR_HOME_NOT_RESIDENT_OWNED
    http_status: 409
    applies_to: "POST /home-sale-transfers/{id}/approve"
  - priority: 13
    category: business_temporal
    check: "RentIncreaseNotice.effective_on >= now() + 90 days at issuance time."
    error_id: ERR_NOTICE_WINDOW_TOO_SHORT
    http_status: 422
    applies_to: "POST /rent-increase-notices/{id}/issue"
  - priority: 14
    category: business_temporal
    check: "EvictionCase /cure attempted before cure_deadline."
    error_id: ERR_CURE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /eviction-cases/{id}/cure"
  - priority: 15
    category: business_constraint
    check: "RentIncreaseNotice cannot be issued while Lease.status == GRACE (eviction pending)."
    error_id: ERR_RENT_INCREASE_BLOCKED_DURING_EVICTION
    http_status: 409
    applies_to: "POST /rent-increase-notices/{id}/issue"
  - priority: 16
    category: business_constraint
    check: "RentIncreaseNotice.proposed_new_rent_cents > Lease.monthly_rent_cents."
    error_id: ERR_RENT_INCREASE_NONPOSITIVE
    http_status: 422
    applies_to: "POST /rent-increase-notices/{id}/issue"
  - priority: 17
    category: business_fiscal
    check: "For NONPAYMENT cure: Lease.outstanding_balance_cents must equal 0 at cure time."
    error_id: ERR_BALANCE_NOT_ZERO
    http_status: 409
    applies_to: "POST /eviction-cases/{id}/cure"
  - priority: 18
    category: business_fiscal
    check: "ConversionRequest /accept requires offer_price_cents >= Home.assessed_value_cents."
    error_id: ERR_BUYOUT_UNDERVALUED
    http_status: 422
    applies_to: "POST /conversion-requests/{id}/accept"

# =============================================================================
# §1.5 Endpoints
# =============================================================================
endpoints:
  # --- Parks ---
  - method: POST
    path: /parks
    description: Create a park.
    roles: [ParkManager, PlatformAdmin]
    code: 201
    input: [name, state_code, master_cpi_pct, utility_apportionment_method, billing_period_anchor_day]
    output: Park
    side_effects: []
  - method: GET
    path: /parks/{park_id}
    description: Fetch park including ownership_pool_count.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: []
    output: Park
    side_effects: []
  # --- Lots ---
  - method: POST
    path: /parks/{park_id}/lots
    description: Create a lot under the park (defaults to PARK_OWNED).
    roles: [ParkManager]
    code: 201
    input: [lot_number, base_rent_cents, "sub_meter_reading_kwh?"]
    output: Lot
    side_effects: ["Park.ownership_pool_count incremented by 1"]
  - method: GET
    path: /parks/{park_id}/lots
    description: List lots in the park, paginated; supports ?ownership_mode= filter.
    roles: [ParkManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "ownership_mode?"]
    output: Lot[]
    side_effects: []
  - method: PATCH
    path: /lots/{lot_id}
    description: Update sub_meter_reading_kwh (OCC). Other fields immutable post-creation.
    roles: [ParkManager]
    code: 200
    input: [sub_meter_reading_kwh, version]
    output: Lot
    side_effects: []
  # --- Homes ---
  - method: POST
    path: /parks/{park_id}/homes
    description: Register a home on a lot (initial placement).
    roles: [ParkManager]
    code: 201
    input: [vin, lot_id, assessed_value_cents, "owner_resident_id?"]
    output: Home
    side_effects: ["If lot.ownership_mode == RESIDENT_OWNED: owner_resident_id required and set"]
  - method: GET
    path: /homes/{home_id}
    description: Fetch home.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: []
    output: Home
    side_effects: []
  # --- Residents ---
  - method: POST
    path: /residents
    description: Register a resident.
    roles: [ParkManager, PlatformAdmin]
    code: 201
    input: [full_name, email]
    output: Resident
    side_effects: []
  - method: GET
    path: /residents/{resident_id}
    description: Fetch resident with current violation_count_12mo.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: ["Recompute Resident.violation_count_12mo on read"]
  # --- Leases ---
  - method: POST
    path: /lots/{lot_id}/leases
    description: Draft a lease for a lot.
    roles: [ParkManager]
    code: 201
    input: [resident_id, start_date]
    output: Lease
    side_effects: []
  - method: POST
    path: /leases/{lease_id}/sign
    description: Activate a draft lease.
    roles: [ParkManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["Lot.current_lease_id := lease.id", "Lease.monthly_rent_cents := Lot.base_rent_cents"]
  - method: POST
    path: /leases/{lease_id}/pay
    description: Resident pays all outstanding UtilityBills for the lease.
    roles: [Resident]
    code: 200
    input: []
    output: Lease
    side_effects: ["UtilityBill.paid_at := now() for all unpaid bills", "Recompute outstanding_balance_cents", "DELINQUENT→CURRENT or GRACE→CURRENT/DELINQUENT cascade"]
  - method: GET
    path: /leases/{lease_id}
    description: Fetch lease including outstanding_balance_cents.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: []
    output: Lease
    side_effects: []
  # --- Rent Increase Notices ---
  - method: POST
    path: /leases/{lease_id}/rent-increase-notices
    description: Draft a rent increase notice.
    roles: [ParkManager]
    code: 201
    input: [proposed_new_rent_cents, effective_on]
    output: RentIncreaseNotice
    side_effects: []
  - method: POST
    path: /rent-increase-notices/{notice_id}/issue
    description: Issue the notice (validates 90-day window, computes capped value).
    roles: [ParkManager]
    code: 200
    input: []
    output: RentIncreaseNotice
    side_effects: ["Compute capped_new_rent_cents via rent_cap_application"]
  - method: GET
    path: /rent-increase-notices/{notice_id}
    description: Fetch notice.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: []
    output: RentIncreaseNotice
    side_effects: []
  # --- Eviction Cases ---
  - method: POST
    path: /leases/{lease_id}/eviction-cases
    description: File an eviction case.
    roles: [ParkManager]
    code: 201
    input: [violation_type]
    output: EvictionCase
    side_effects: ["Auto-transition FILED→IN_CURE (or →FINALIZED_FOR_CAUSE for ILLEGAL_USE)", "Lease CURRENT/DELINQUENT→GRACE (if IN_CURE) or →TERMINATED cascade (if ILLEGAL_USE)"]
  - method: POST
    path: /eviction-cases/{case_id}/cure
    description: Resident cures the violation.
    roles: [Resident]
    code: 200
    input: []
    output: EvictionCase
    side_effects: ["Lease GRACE→CURRENT or GRACE→DELINQUENT"]
  - method: POST
    path: /eviction-cases/{case_id}/dismiss
    description: ParkManager dismisses the case.
    roles: [ParkManager]
    code: 200
    input: []
    output: EvictionCase
    side_effects: ["Lease GRACE→CURRENT or GRACE→DELINQUENT"]
  - method: GET
    path: /eviction-cases/{case_id}
    description: Fetch case.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: []
    output: EvictionCase
    side_effects: []
  # --- Utility Bills ---
  - method: GET
    path: /lots/{lot_id}/utility-bills
    description: List utility bills for a lot.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: ["limit?", "offset?"]
    output: UtilityBill[]
    side_effects: []
  # --- Home Sale Transfers ---
  - method: POST
    path: /home-sale-transfers
    description: Open a home sale transfer.
    roles: [ParkManager, Resident]
    code: 201
    input: [home_id, seller_resident_id, buyer_resident_id, sale_price_cents]
    output: HomeSaleTransfer
    side_effects: []
  - method: POST
    path: /home-sale-transfers/{transfer_id}/approve
    description: Park approves a pending transfer.
    roles: [ParkManager]
    code: 200
    input: []
    output: HomeSaleTransfer
    side_effects: ["Recompute buyer Resident.violation_count_12mo"]
  - method: POST
    path: /home-sale-transfers/{transfer_id}/reject
    description: Park rejects a pending transfer.
    roles: [ParkManager]
    code: 200
    input: []
    output: HomeSaleTransfer
    side_effects: []
  - method: POST
    path: /home-sale-transfers/{transfer_id}/close
    description: Close approved transfer, generating successor lease.
    roles: [ParkManager]
    code: 200
    input: []
    output: HomeSaleTransfer
    side_effects: ["Lease CURRENT→ASSUMED", "Create successor Lease in CURRENT", "Home.owner_resident_id := buyer", "Lot.current_lease_id := successor lease id", "Void any DRAFT/ISSUED RentIncreaseNotice on the predecessor lease"]
  - method: GET
    path: /home-sale-transfers/{transfer_id}
    description: Fetch transfer.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: []
    output: HomeSaleTransfer
    side_effects: []
  # --- Conversion Requests ---
  - method: POST
    path: /lots/{lot_id}/conversion-requests
    description: Park offers conversion of PARK_OWNED lot to RESIDENT_OWNED.
    roles: [ParkManager]
    code: 201
    input: [prospective_buyer_resident_id, offer_price_cents]
    output: ConversionRequest
    side_effects: []
  - method: POST
    path: /conversion-requests/{conv_id}/accept
    description: Resident accepts (or auto-rejects if undervalued).
    roles: [Resident]
    code: 200
    input: []
    output: ConversionRequest
    side_effects: []
  - method: POST
    path: /conversion-requests/{conv_id}/reject
    description: Resident rejects offer.
    roles: [Resident]
    code: 200
    input: []
    output: ConversionRequest
    side_effects: []
  - method: POST
    path: /conversion-requests/{conv_id}/finalize
    description: ParkManager finalizes accepted conversion.
    roles: [ParkManager]
    code: 200
    input: []
    output: ConversionRequest
    side_effects: ["Lot.ownership_mode := RESIDENT_OWNED", "Park.ownership_pool_count -= 1", "Home.owner_resident_id := prospective_buyer_resident_id", "If lot has no current_lease_id: create new Lease in CURRENT"]
  - method: GET
    path: /conversion-requests/{conv_id}
    description: Fetch conversion request.
    roles: [ParkManager, PlatformAdmin, Resident]
    code: 200
    input: []
    output: ConversionRequest
    side_effects: []
  # --- Test harness endpoints (required by §1.5 testability-completeness) ---
  - method: POST
    path: /_clock/advance
    description: Advance server clock by N seconds (test harness).
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: null
    side_effects: ["Affects time-gated transitions and cure_deadline / effective_on checks"]
  - method: POST
    path: /_sweep/billing
    description: Run the monthly billing sweep — creates UtilityBill rows, recomputes Lease.monthly_rent and outstanding balances, applies CURRENT→DELINQUENT.
    roles: [PlatformAdmin]
    code: 200
    input: [park_id, billing_period_start, billing_period_end, master_total_cents]
    output: UtilityBill[]
    side_effects: ["Create UtilityBill per occupied Lot", "utility_apportionment runs", "rent_due_calculation runs per bill", "Lease.outstanding_balance_cents recomputed", "CURRENT→DELINQUENT if outstanding > 0"]
  - method: POST
    path: /_sweep/evictions
    description: Eviction sweep — transitions IN_CURE→FINALIZED_FOR_CAUSE for cases past cure_deadline.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EvictionCase[]
    side_effects: ["IN_CURE→FINALIZED_FOR_CAUSE cascade", "Lease GRACE→TERMINATED", "Resident.violation_count_12mo recomputed"]
  - method: POST
    path: /_sweep/rent-effective
    description: Rent-effective sweep — transitions ISSUED→EFFECTIVE for notices whose effective_on has passed.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RentIncreaseNotice[]
    side_effects: ["Lease.monthly_rent_cents := capped_new_rent_cents", "Lot.base_rent_cents := capped_new_rent_cents"]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for the endpoint per RBAC matrix."
  - id: ERR_FORBIDDEN_NOT_OWNER
    http: 403
    condition: "Acting Resident X-User-ID does not match the resource's resident_id / owner_resident_id."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Resource referenced in URL path does not exist."
  - id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 404
    condition: "Resource referenced in request body does not exist (e.g., resident_id, home_id)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition is permitted."
  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "OCC version supplied in PATCH body does not equal current entity version."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic request body validation failure (missing required field, malformed type, out-of-range)."
  - id: ERR_NO_CURE_PERMITTED
    http: 409
    condition: "Attempted /cure on an EvictionCase with violation_type ILLEGAL_USE (no cure window exists)."
  - id: ERR_BUYER_INELIGIBLE
    http: 422
    condition: "HomeSaleTransfer buyer has a disqualifying EvictionCase within last 365 days."
  - id: ERR_LOT_OCCUPIED
    http: 409
    condition: "Lease sign rejected because Lot.current_lease_id is already non-null."
  - id: ERR_LOT_ALREADY_RESIDENT_OWNED
    http: 409
    condition: "ConversionRequest /finalize rejected because Lot.ownership_mode is already RESIDENT_OWNED."
  - id: ERR_HOME_NOT_RESIDENT_OWNED
    http: 409
    condition: "HomeSaleTransfer requires the lot to be RESIDENT_OWNED (cannot sell a park-owned home)."
  - id: ERR_NOTICE_WINDOW_TOO_SHORT
    http: 422
    condition: "RentIncreaseNotice.effective_on is less than 90 days after now() at issuance."
  - id: ERR_CURE_WINDOW_EXPIRED
    http: 409
    condition: "EvictionCase /cure attempted at or after cure_deadline."
  - id: ERR_RENT_INCREASE_BLOCKED_DURING_EVICTION
    http: 409
    condition: "RentIncreaseNotice /issue rejected because Lease.status is GRACE."
  - id: ERR_RENT_INCREASE_NONPOSITIVE
    http: 422
    condition: "RentIncreaseNotice.proposed_new_rent_cents is not strictly greater than Lease.monthly_rent_cents."
  - id: ERR_BALANCE_NOT_ZERO
    http: 409
    condition: "NONPAYMENT EvictionCase /cure attempted while Lease.outstanding_balance_cents > 0."
  - id: ERR_BUYOUT_UNDERVALUED
    http: 422
    condition: "ConversionRequest /accept attempted when offer_price_cents < Home.assessed_value_cents."
  - id: ERR_LOT_OCCUPIED_BY_PENDING_OP
    http: 409
    condition: "Concurrent mutation of Lot ownership/lease attempted — one operation won, this one lost."
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "Home VIN already exists globally."
  - id: ERR_DUPLICATE_LOT_NUMBER
    http: 409
    condition: "Lot.lot_number already exists within the same Park."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ParkManager
    description: Operator of a specific Park; manages lots, leases, notices, evictions, and approves transfers/conversions for that park's resources.
    identity: "entity_backed:Park"
    exclusive_operations:
      - "POST /parks/{park_id}/lots"
      - "PATCH /lots/{lot_id}"
      - "POST /parks/{park_id}/homes"
      - "POST /lots/{lot_id}/leases"
      - "POST /leases/{lease_id}/sign"
      - "POST /leases/{lease_id}/rent-increase-notices"
      - "POST /rent-increase-notices/{notice_id}/issue"
      - "POST /leases/{lease_id}/eviction-cases"
      - "POST /eviction-cases/{case_id}/dismiss"
      - "POST /home-sale-transfers/{transfer_id}/approve"
      - "POST /home-sale-transfers/{transfer_id}/reject"
      - "POST /home-sale-transfers/{transfer_id}/close"
      - "POST /lots/{lot_id}/conversion-requests"
      - "POST /conversion-requests/{conv_id}/finalize"
    shared_operations:
      - "POST /home-sale-transfers (with Resident)"
      - "GET endpoints (with PlatformAdmin and Resident)"
  - name: Resident
    description: Individual tenant; pays bills, cures evictions, accepts/rejects conversion offers, initiates home sales.
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /leases/{lease_id}/pay"
      - "POST /eviction-cases/{case_id}/cure"
      - "POST /conversion-requests/{conv_id}/accept"
      - "POST /conversion-requests/{conv_id}/reject"
    shared_operations:
      - "POST /home-sale-transfers (with ParkManager)"
      - "GET endpoints scoped to resources where X-User-ID matches resident_id or owner_resident_id"
  - name: PlatformAdmin
    description: Cross-park operator; manages parks and runs test-harness sweeps.
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_sweep/billing"
      - "POST /_sweep/evictions"
      - "POST /_sweep/rent-effective"
    shared_operations:
      - "POST /parks (with ParkManager)"
      - "POST /residents (with ParkManager)"
      - "GET endpoints (read-only across all parks)"
