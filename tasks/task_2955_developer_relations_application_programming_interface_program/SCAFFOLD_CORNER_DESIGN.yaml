              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /sandbox-leases"
              payload: { developer_id: "${d1_id}", api_product_id: "${p1_id}", starts_at: "2026-08-01T00:00:00Z", lease_days: 3, sample_app_slug: "quickstart-node" }
