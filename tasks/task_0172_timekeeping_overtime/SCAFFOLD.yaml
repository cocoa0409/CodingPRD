scenario: "Timekeeping & FLSA Overtime: exempt/non-exempt classification, state Meal/Rest break, Overtime (>40/week), Double Time (CA daily >12), shift detention, Time Edit audit, Tipped Wage"
domain_name: "timekeeping-overtime"
api_prefix: "/timekeeping"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - idempotency
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ─────────────────────────────────────────────────────────────────────────────
# §1.1 Entities
# ─────────────────────────────────────────────────────────────────────────────
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the employee.
        constraints: "1..120 chars"
      - name: jurisdiction
        type: enum
        source: input
        description: Governing state for labor rules. CA enables daily OT and double-time; FED disables them.
        constraints: "values: CA, FED"
      - name: classification
        type: enum
        source: input
        description: FLSA exempt vs non-exempt. Exempt employees are not eligible for OT, DT, meal/rest premiums, or shift detention.
        constraints: "values: EXEMPT, NON_EXEMPT"
      - name: base_hourly_rate_cents
        type: integer
        source: input
        description: Regular hourly wage in whole cents. Required for non-exempt, ignored for exempt.
        constraints: ">= 725 (federal minimum) when classification=NON_EXEMPT"
      - name: tipped_role
        type: boolean
        source: input
        description: True if the employee customarily earns tips and is paid the tipped-wage subminimum.
        default: false
      - name: tipped_cash_rate_cents
        type: integer
        source: input
        description: Direct cash wage paid before tip credit. Required when tipped_role=true.
        constraints: ">= 213 (federal tipped minimum); ignored when tipped_role=false"
      - name: applicable_minimum_wage_cents
        type: integer
        source: input
        description: Full state minimum wage that the tip credit must close the gap to. Used for tip-credit shortfall calculation.
        constraints: ">= 725"
      - name: status
        type: enum
        source: system
        description: HR status. Only ACTIVE employees may clock in.
        default: ACTIVE
        constraints: "values: ACTIVE, TERMINATED"

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: Foreign key to Employee.
      - name: scheduled_start
        type: datetime
        source: input
        description: Originally scheduled start time (ISO 8601 UTC).
      - name: scheduled_end
        type: datetime
        source: input
        description: Originally scheduled end time. Used to compute detention windows.
        constraints: "scheduled_end > scheduled_start"
      - name: actual_start
        type: datetime
        source: system
        description: Stamped on first IN punch tied to this shift.
        default: null
      - name: actual_end
        type: datetime
        source: system
        description: Stamped on the OUT punch that closes the shift.
        default: null
      - name: state
        type: enum
        source: system
        description: Lifecycle state of the shift.
        default: SCHEDULED
        constraints: "values: SCHEDULED, OPEN, CLOSED, DISPUTED, FINALIZED, VOIDED"
      - name: workweek_id
        type: string
        source: system
        description: Foreign key to the Workweek bucket this shift's hours roll into (assigned on first punch, based on shift.actual_start week of Sunday 00:00 in employee's locale, UTC for this benchmark).
        default: null
      - name: requires_meal_break
        type: boolean
        source: computed
        description: True when expected worked hours > 5.0 (CA & non-exempt rule).
      - name: meal_break_premium_owed_cents
        type: integer
        source: computed
        description: One hour at base rate if meal break not taken before fifth hour of work, else 0. Recomputed on CLOSE.
        default: 0
      - name: detention_minutes
        type: integer
        source: computed
        description: Minutes worked past scheduled_end. Drives DetentionEvent premium.
        default: 0

  - name: Punch
    parent: null
    common_fields: false
    fields:
      - name: shift_id
        type: string
        source: input
        description: Foreign key to Shift.
      - name: employee_id
        type: string
        source: input
        description: Denormalized for audit queries.
      - name: punch_type
        type: enum
        source: input
        description: IN/OUT punches bracket worked time. MEAL_OUT/MEAL_IN bracket the unpaid meal break.
        constraints: "values: IN, OUT, MEAL_OUT, MEAL_IN"
      - name: punched_at
        type: datetime
        source: system
        description: Server-stamped at request receipt; not user-supplied. Time edits create TimeEdit entries instead of mutating this field.
      - name: source
        type: enum
        source: system
        description: How the punch was recorded. EDIT punches are created when an approved TimeEdit alters effective time.
        default: TIMECLOCK
        constraints: "values: TIMECLOCK, EDIT"
      - name: superseded_by_edit_id
        type: string
        source: system
        description: When an approved TimeEdit retires this punch, this points to the TimeEdit. The retired punch stays for audit.
        default: null

  - name: TimeEdit
    parent: null
    common_fields: true
    fields:
      - name: shift_id
        type: string
        source: input
        description: Foreign key to Shift.
      - name: target_punch_id
        type: string
        source: input
        description: Foreign key to Punch being edited. Must belong to shift_id.
      - name: proposed_punched_at
        type: datetime
        source: input
        description: New effective timestamp the editor is proposing for the target punch.
      - name: reason_code
        type: enum
        source: input
        description: Categorical reason. CLERICAL/MISSED_PUNCH are clerical; FRAUD_CORRECTION requires PayrollAdmin.
        constraints: "values: CLERICAL, MISSED_PUNCH, EQUIPMENT_FAILURE, FRAUD_CORRECTION"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of requester (Supervisor or Employee).
      - name: requested_by_role
        type: enum
        source: system
        description: Role of requester at time of submission.
        constraints: "values: Employee, Supervisor, PayrollAdmin"
      - name: approved_by_user_id
        type: string
        source: system
        description: Approver's X-User-ID. Must NOT equal requested_by_user_id (segregation of duties).
        default: null
      - name: state
        type: enum
        source: system
        description: Approval lifecycle.
        default: PENDING
        constraints: "values: PENDING, APPROVED, REJECTED, REVERTED"
      - name: idempotency_key
        type: string
        source: input
        description: Caller-supplied; identical key within the same shift returns the existing TimeEdit.
        constraints: "1..64 chars; unique per shift_id"
      - name: applied_at
        type: datetime
        source: system
        description: When the APPROVE transition fired and created the EDIT punch.
        default: null

  - name: MealBreak
    parent: null
    common_fields: false
    fields:
      - name: shift_id
        type: string
        source: input
        description: Foreign key to Shift. Exactly one MealBreak per shift is allowed.
      - name: meal_out_punch_id
        type: string
        source: system
        description: Pointer to MEAL_OUT punch.
      - name: meal_in_punch_id
        type: string
        source: system
        description: Pointer to MEAL_IN punch.
      - name: duration_minutes
        type: integer
        source: computed
        description: meal_in.punched_at - meal_out.punched_at in whole minutes (truncated).
      - name: taken_before_fifth_hour
        type: boolean
        source: computed
        description: True iff meal_out.punched_at <= actual_start + 5 hours AND duration_minutes >= 30. Drives meal-break premium waiver.

  - name: DetentionEvent
    parent: null
    common_fields: false
    fields:
      - name: shift_id
        type: string
        source: input
        description: Foreign key to Shift.
      - name: minutes_past_scheduled_end
        type: integer
        source: computed
        description: max(0, ceil((actual_end - scheduled_end) / 1 minute)).
      - name: premium_owed_cents
        type: integer
        source: computed
        description: Per §1.3 shift_detention_premium.
      - name: tier
        type: enum
        source: computed
        description: NONE (<15m), TIER_1 (15..59m), TIER_2 (60..119m), TIER_3 (>=120m).
        constraints: "values: NONE, TIER_1, TIER_2, TIER_3"

  - name: TipDeclaration
    parent: null
    common_fields: true
    fields:
      - name: shift_id
        type: string
        source: input
        description: Foreign key to Shift. At most one TipDeclaration per shift.
      - name: declared_tips_cents
        type: integer
        source: input
        description: Tips the employee declares for the shift, in whole cents.
        constraints: ">= 0"
      - name: tip_credit_applied_cents
        type: integer
        source: computed
        description: Portion of tips counted toward closing the gap to applicable_minimum_wage_cents (per worked hour, summed).
      - name: shortfall_topup_cents
        type: integer
        source: computed
        description: Employer make-up pay when (cash + tips) < applicable_minimum_wage_cents * worked_hours.

  - name: Workweek
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: Foreign key to Employee.
      - name: week_start
        type: datetime
        source: input
        description: Sunday 00:00:00.000Z anchoring the FLSA workweek.
        constraints: "must be Sunday 00:00:00.000 UTC"
      - name: total_hours
        type: number
        source: computed
        description: Sum of worked hours across all FINALIZED shifts in the week (excluding unpaid meal time).
        default: 0
      - name: regular_hours
        type: number
        source: computed
        description: Hours paid at base rate.
        default: 0
      - name: overtime_hours
        type: number
        source: computed
        description: Hours paid at 1.5x base. Includes federal weekly OT (>40) and CA daily OT (>8 and <=12) bucket.
        default: 0
      - name: double_time_hours
        type: number
        source: computed
        description: "Hours paid at 2x. CA-only: daily hours >12; FED jurisdiction always 0."
        default: 0
      - name: gross_pay_cents
        type: integer
        source: computed
        description: Total gross pay in whole cents (sum of all premiums + base + OT + DT + tip-credit topup).
        default: 0
      - name: payroll_status
        type: enum
        source: system
        description: Compound state. POSTED when every constituent Shift is FINALIZED; LOCKED after payroll run.
        default: OPEN
        constraints: "values: OPEN, POSTED, LOCKED"

  - name: AuditEntry
    parent: null
    common_fields: false
    fields:
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose action produced the audit.
      - name: actor_role
        type: enum
        source: system
        description: Role at action time.
        constraints: "values: Employee, Supervisor, PayrollAdmin"
      - name: action
        type: enum
        source: system
        description: What happened.
        constraints: "values: TIME_EDIT_SUBMITTED, TIME_EDIT_APPROVED, TIME_EDIT_REJECTED, TIME_EDIT_REVERTED, SHIFT_FINALIZED, WORKWEEK_LOCKED"
      - name: subject_entity
        type: enum
        source: system
        description: Entity whose state changed.
        constraints: "values: Shift, TimeEdit, Workweek"
      - name: subject_id
        type: string
        source: system
        description: ID of the subject.
      - name: before_snapshot
        type: object
        source: system
        description: Field-level snapshot prior to the action (free-form JSON object).
      - name: after_snapshot
        type: object
        source: system
        description: Field-level snapshot after the action.

# ─────────────────────────────────────────────────────────────────────────────
# §1.2 State Machines
# ─────────────────────────────────────────────────────────────────────────────
state_machines:
  - entity: Shift
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /timekeeping/shifts/{id}/punches (first IN punch)"
        actor: Employee
        preconditions:
          - "Employee.status == ACTIVE"
          - "Employee.classification == NON_EXEMPT  (exempt employees never produce Shift punches; their hours are administrative)"
          - "punch_type == IN"
          - "Shift.scheduled_start - 60 minutes <= now() <= Shift.scheduled_end + 60 minutes"
        side_effects:
          - "Shift.actual_start := now()"
          - "Shift.workweek_id := upsert Workweek for (employee_id, week_start of now())"
          - "Punch row created with source=TIMECLOCK"
      - from: OPEN
        to: CLOSED
        trigger: "POST /timekeeping/shifts/{id}/punches (punch_type=OUT)"
        actor: Employee
        preconditions:
          - "punch_type == OUT"
          - "any preceding MEAL_OUT has a matching MEAL_IN (no dangling meal)"
        side_effects:
          - "Shift.actual_end := now()"
          - "Run §1.3 detention_minutes; upsert DetentionEvent; set Shift.detention_minutes"
          - "Run §1.3 meal_break_premium; set Shift.meal_break_premium_owed_cents"
          - "Workweek.payroll_status remains OPEN until all sibling shifts close"
      - from: OPEN
        to: DISPUTED
        trigger: "POST /timekeeping/time-edits (any role) targeting an unclosed punch"
        actor: Supervisor
        preconditions:
          - "TimeEdit.state == PENDING"
        side_effects:
          - "Shift becomes immutable to punches until TimeEdit resolves"
      - from: CLOSED
        to: DISPUTED
        trigger: "POST /timekeeping/time-edits targeting a CLOSED shift"
        actor: Supervisor
        preconditions: ["TimeEdit.state == PENDING"]
        side_effects:
          - "Shift held back from FINALIZED until edit resolves"
      - from: DISPUTED
        to: CLOSED
        trigger: "POST /timekeeping/time-edits/{id}/approve OR /reject (last pending edit resolved)"
        actor: Supervisor
        preconditions: ["no remaining TimeEdit.state == PENDING for this shift"]
        side_effects:
          - "If approved: insert EDIT Punch; mark target Punch.superseded_by_edit_id"
          - "Recompute detention_minutes and meal_break_premium_owed_cents"
      - from: CLOSED
        to: FINALIZED
        trigger: "POST /timekeeping/shifts/{id}/finalize"
        actor: PayrollAdmin
        preconditions:
          - "Shift.state == CLOSED"
          - "Workweek.payroll_status != LOCKED"
          - "No PENDING TimeEdit on this shift"
        side_effects:
          - "Run §1.3 workweek_pay_engine — recompute Workweek.regular_hours, overtime_hours, double_time_hours, gross_pay_cents"
          - "Append AuditEntry(action=SHIFT_FINALIZED)"
          - "If all sibling shifts in the week are FINALIZED, transition Workweek OPEN→POSTED"
      - from: FINALIZED
        to: CLOSED
        trigger: "POST /timekeeping/time-edits/{id}/approve (revert path: approve a new edit on a finalized shift)"
        actor: PayrollAdmin
        preconditions:
          - "Workweek.payroll_status != LOCKED"
          - "TimeEdit.reason_code in {CLERICAL, FRAUD_CORRECTION}"
        side_effects:
          - "Workweek POSTED → OPEN (revert posting)"
          - "Recompute Workweek pay engine downstream"
      - from: SCHEDULED
        to: VOIDED
        trigger: "DELETE /timekeeping/shifts/{id}"
        actor: Supervisor
        preconditions: ["Shift.state == SCHEDULED", "no Punch exists"]
        side_effects: ["Shift becomes terminal-void"]

  - entity: TimeEdit
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, REVERTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /timekeeping/time-edits/{id}/approve"
        actor: Supervisor
        preconditions:
          - "approver.user_id != TimeEdit.requested_by_user_id  (segregation of duties)"
          - "If TimeEdit.reason_code == FRAUD_CORRECTION, approver.role == PayrollAdmin"
          - "Shift.state in {OPEN, DISPUTED, CLOSED, FINALIZED}"
          - "Workweek.payroll_status != LOCKED"
        side_effects:
          - "Create EDIT Punch with punched_at = proposed_punched_at, source=EDIT"
          - "Set target Punch.superseded_by_edit_id := this TimeEdit.id"
          - "TimeEdit.applied_at := now(); TimeEdit.approved_by_user_id := actor"
          - "Recompute Shift.detention_minutes and meal_break_premium_owed_cents"
          - "If Shift was FINALIZED: Shift FINALIZED → CLOSED; Workweek POSTED → OPEN"
          - "AuditEntry(action=TIME_EDIT_APPROVED)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /timekeeping/time-edits/{id}/reject"
        actor: Supervisor
        preconditions: ["approver.user_id != TimeEdit.requested_by_user_id"]
        side_effects:
          - "Shift returns to its prior pre-DISPUTED state"
          - "AuditEntry(action=TIME_EDIT_REJECTED)"
      - from: APPROVED
        to: REVERTED
        trigger: "POST /timekeeping/time-edits/{id}/revert"
        actor: PayrollAdmin
        preconditions:
          - "Workweek.payroll_status != LOCKED"
        side_effects:
          - "EDIT Punch removed; target Punch.superseded_by_edit_id := null"
          - "Recompute Shift detention/meal-break premium"
          - "If Shift was FINALIZED, Workweek POSTED → OPEN"
          - "AuditEntry(action=TIME_EDIT_REVERTED)"

  - entity: Workweek
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: POSTED
        trigger: "Automatic on POST /timekeeping/shifts/{id}/finalize when last sibling shift finalizes"
        actor: system
        preconditions: ["every Shift for (employee_id, week_start) has state == FINALIZED"]
        side_effects:
          - "Workweek.gross_pay_cents := result of §1.3 workweek_pay_engine"
      - from: POSTED
        to: OPEN
        trigger: "Automatic when an approved TimeEdit (or revert) recomputes a constituent shift"
        actor: system
        preconditions: ["any constituent Shift transitioned FINALIZED → CLOSED"]
        side_effects:
          - "Workweek.payroll_status := OPEN; downstream consumers may not assume gross_pay_cents stable"
      - from: POSTED
        to: LOCKED
        trigger: "POST /timekeeping/workweeks/{id}/lock"
        actor: PayrollAdmin
        preconditions:
          - "Workweek.payroll_status == POSTED"
          - "no PENDING TimeEdit on any constituent shift"
        side_effects:
          - "Workweek frozen; further TimeEdit approvals are rejected"
          - "AuditEntry(action=WORKWEEK_LOCKED)"

# ─────────────────────────────────────────────────────────────────────────────
# §1.2.1 Concurrency Rules
# ─────────────────────────────────────────────────────────────────────────────
concurrency_rules:
  - scenario: "Two simultaneous IN punches against the same SCHEDULED shift"
    guarantee: "At most one transition SCHEDULED→OPEN; the second is rejected."
    error_id: ERR_SHIFT_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on Shift.actual_start; subsequent IN punches see Shift.state != SCHEDULED."
  - scenario: "Approve and Reject called on the same PENDING TimeEdit"
    guarantee: "Exactly one transition fires; the loser receives an invalid-state error."
    error_id: ERR_TIME_EDIT_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on TimeEdit.state field."
  - scenario: "Lock workweek while a TimeEdit approval is in-flight"
    guarantee: "Exactly one of {lock, approve} succeeds; the other sees a frozen workweek or non-PENDING edit."
    error_id: ERR_WORKWEEK_LOCKED
    http_status: 409
    serialization: "First-writer-wins on Workweek.payroll_status."
  - scenario: "Two TimeEdits with identical idempotency_key on the same shift"
    guarantee: "Only the first creates a row; the second returns the existing TimeEdit."
    error_id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http_status: 409
    serialization: "Unique constraint on (shift_id, idempotency_key); the second returns the first row instead of erroring when payload matches; otherwise rejects."

# ─────────────────────────────────────────────────────────────────────────────
# §1.3 Calculations
# ─────────────────────────────────────────────────────────────────────────────
calculations:
  - name: detention_minutes
    trigger: "On Shift transition OPEN→CLOSED and on every recompute after TimeEdit APPROVE/REVERT"
    algorithm: threshold
    formula: |
      raw = (actual_end - scheduled_end) in seconds
      minutes_past = max(0, ceil(raw / 60.0))
      tier =
        NONE    if minutes_past <  15
        TIER_1  if 15 <= minutes_past <  60
        TIER_2  if 60 <= minutes_past < 120
        TIER_3  if 120 <= minutes_past
      premium_owed_cents =
        0                                                  if tier == NONE
        round_half_up(0.5  * base_hourly_rate_cents)       if tier == TIER_1   (~ 30 min at half-rate)
        round_half_up(1.0  * base_hourly_rate_cents)       if tier == TIER_2   (one hour at base)
        round_half_up(2.0  * base_hourly_rate_cents)       if tier == TIER_3   (two hours at base)
      DetentionEvent fields set accordingly; Shift.detention_minutes = minutes_past
    input_set: "One DetentionEvent per Shift in state {CLOSED, FINALIZED}. Exempt employees: skip — DetentionEvent.tier=NONE, premium_owed_cents=0."
    constants:
      MINUTES_PER_HOUR: 60
    precision: "Whole cents, round_half_up."
    variants:
      - name: exempt_bypass
        when: "Employee.classification == EXEMPT"
        difference: "tier forced to NONE; premium_owed_cents forced to 0 regardless of minutes_past."

  - name: meal_break_premium
    trigger: "On Shift transition OPEN→CLOSED and on every recompute after TimeEdit APPROVE/REVERT"
    algorithm: threshold
    formula: |
      worked_hours = (actual_end - actual_start - meal_break.duration_minutes*60) / 3600
      if classification == EXEMPT or worked_hours <= 5.0:
          meal_break_premium_owed_cents = 0
      else:
          if no MealBreak row exists for shift OR meal_break.duration_minutes < 30:
              meal_break_premium_owed_cents = round_half_up(1.0 * base_hourly_rate_cents)
          elif meal_break.taken_before_fifth_hour == false:
              meal_break_premium_owed_cents = round_half_up(1.0 * base_hourly_rate_cents)
          else:
              meal_break_premium_owed_cents = 0
    input_set: "Per Shift; one premium per shift."
    constants:
      FIFTH_HOUR_SECONDS: 18000
      MEAL_MIN_DURATION_MIN: 30
    precision: "Whole cents, round_half_up."

  - name: workweek_pay_engine
    trigger: "On Shift transition CLOSED→FINALIZED, and re-runs when an approved TimeEdit causes Workweek POSTED→OPEN"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — per-day worked hours for each calendar day (UTC) in the week:
      for each shift S finalized in workweek W (employee jurisdiction = J):
          day = floor(S.actual_start to start of UTC day)
          worked_seconds = S.actual_end - S.actual_start - meal_break_duration_seconds(S)
          per_day[day] += worked_seconds / 3600.0
      total_hours = sum(per_day.values())
      # Step 2 — CA daily buckets (only when J == CA):
      if J == CA:
          for d, hours in per_day:
              ca_regular[d]    = min(8.0,  hours)
              ca_ot[d]         = max(0.0, min(4.0,  hours - 8.0))    # 8..12 -> OT
              ca_double[d]     = max(0.0, hours - 12.0)              # >12   -> DT
      else:
          ca_regular = per_day
          ca_ot      = {d: 0 for d in per_day}
          ca_double  = {d: 0 for d in per_day}
      # Step 3 — federal weekly OT applied to ca_regular bucket only:
      cumulative_regular = 0.0
      fed_ot_hours       = 0.0
      regular_hours      = 0.0
      for d in calendar order (Sun..Sat):
          r = ca_regular[d]
          available_to_40 = max(0.0, 40.0 - cumulative_regular)
          regular_today  = min(r, available_to_40)
          fed_ot_today   = r - regular_today
          regular_hours    += regular_today
          fed_ot_hours     += fed_ot_today
          cumulative_regular += regular_today
      overtime_hours    = fed_ot_hours + sum(ca_ot.values())
      double_time_hours = sum(ca_double.values())
      # Step 4 — gross pay (round each line then sum):
      base_cents   = round_half_up(regular_hours    * base_hourly_rate_cents)
      ot_cents     = round_half_up(overtime_hours    * base_hourly_rate_cents * 1.5)
      dt_cents     = round_half_up(double_time_hours * base_hourly_rate_cents * 2.0)
      premiums     = sum(Shift.meal_break_premium_owed_cents) + sum(DetentionEvent.premium_owed_cents)
      tip_topup    = sum(TipDeclaration.shortfall_topup_cents)   # see tip_credit_shortfall
      gross_pay_cents = base_cents + ot_cents + dt_cents + premiums + tip_topup
    input_set: "All FINALIZED shifts in (employee_id, week_start). Excludes shifts in DISPUTED/VOIDED."
    constants:
      WEEKLY_OT_THRESHOLD_HOURS: 40
      CA_DAILY_OT_LOW: 8
      CA_DAILY_DT_HIGH: 12
      OT_MULTIPLIER: 1.5
      DT_MULTIPLIER: 2.0
    precision: "Hours kept at full float during accumulation; per-line cents rounded round_half_up before summing."
    variants:
      - name: federal_only
        when: "Employee.jurisdiction == FED"
        difference: "Daily OT/DT buckets force-zeroed; all >40h overflow becomes overtime_hours at 1.5x. Identical raw punches in CA vs FED produce different gross_pay_cents."
      - name: california_daily
        when: "Employee.jurisdiction == CA"
        difference: "Daily 8 and 12-hour thresholds carve OT and DT before weekly OT is computed. Federal weekly OT applies only to the CA-regular bucket, never double-counting hours already classified daily-OT/DT."

  - name: tip_credit_shortfall
    trigger: "On Shift transition CLOSED→FINALIZED for tipped_role employees"
    algorithm: aggregation
    formula: |
      # Per shift (no rounding until the very end):
      worked_hours = (Shift.actual_end - Shift.actual_start - meal_break_seconds) / 3600
      cash_wage_cents      = round_half_up(worked_hours * tipped_cash_rate_cents)
      min_wage_required    = round_half_up(worked_hours * applicable_minimum_wage_cents)
      tip_credit_applied   = min(declared_tips_cents, max(0, min_wage_required - cash_wage_cents))
      shortfall_topup_cents = max(0, min_wage_required - cash_wage_cents - tip_credit_applied)
      TipDeclaration.tip_credit_applied_cents := tip_credit_applied
      TipDeclaration.shortfall_topup_cents    := shortfall_topup_cents
    input_set: "Only for shifts where Employee.tipped_role == true AND a TipDeclaration row exists. Exempt employees: not applicable."
    constants: {}
    precision: "Round each intermediate (cash_wage, min_wage_required) round_half_up to whole cents BEFORE computing shortfall — this ordering is pinned."
    variants:
      - name: per_line_rounding
        when: "Pinned ordering (THIS scaffold's authoritative variant)"
        difference: "cash_wage_cents and min_wage_required are each rounded to whole cents FIRST, then subtracted. Yields shortfall_topup_cents that can differ by ±1¢ from the alternative."
      - name: sum_then_round
        when: "Alternative (NOT used by this scaffold; documented for benchmark only)"
        difference: "Computes (applicable_minimum_wage_cents - tipped_cash_rate_cents) * worked_hours, rounds the difference once. This can yield a different last-cent value for non-integer worked_hours. The pinned per_line_rounding variant is authoritative; implementations producing sum_then_round results FAIL the tip-credit assertion."

# ─────────────────────────────────────────────────────────────────────────────
# §1.4 Validation Rules (Ordered)
# ─────────────────────────────────────────────────────────────────────────────
validations:
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all except GET /healthz"
  - priority: 2
    category: auth
    check: "X-User-Role is one of {Employee, Supervisor, PayrollAdmin}"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Role permits this endpoint per RBAC §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Referenced resources resolve (Employee, Shift, Punch, TimeEdit, Workweek)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path params"
  - priority: 5
    category: existence
    check: "Ownership: Employee role can only act on own Shift/Punch; Supervisor restricted to employees they cover; PayrollAdmin unrestricted"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all shift/punch/time-edit endpoints"
  - priority: 6
    category: state
    check: "Shift in correct state for requested action (e.g., punches blocked on FINALIZED/VOIDED)"
    error_id: ERR_SHIFT_INVALID_STATE
    http_status: 409
    applies_to: "POST /shifts/{id}/punches, /finalize"
  - priority: 7
    category: state
    check: "TimeEdit in correct state for approve/reject/revert"
    error_id: ERR_TIME_EDIT_NOT_PENDING
    http_status: 409
    applies_to: "POST /time-edits/{id}/approve, /reject, /revert"
  - priority: 8
    category: state
    check: "Workweek not LOCKED for any mutation (finalize, time-edit approve, revert)"
    error_id: ERR_WORKWEEK_LOCKED
    http_status: 409
    applies_to: "finalize, time-edits approve/revert, lock"
  - priority: 9
    category: business_safety
    check: "Approver of TimeEdit MUST NOT equal requester (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /time-edits/{id}/approve, /reject"
  - priority: 10
    category: business_safety
    check: "FRAUD_CORRECTION TimeEdits require PayrollAdmin approver"
    error_id: ERR_FRAUD_REQUIRES_ADMIN
    http_status: 403
    applies_to: "POST /time-edits/{id}/approve when reason_code=FRAUD_CORRECTION"
  - priority: 11
    category: business_safety
    check: "Exempt employees cannot create Shift punches, MealBreaks, or DetentionEvents"
    error_id: ERR_EXEMPT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /shifts, /punches"
  - priority: 12
    category: business_referential
    check: "Punch ordering: IN before any MEAL_OUT before MEAL_IN before OUT; no second IN after OUT"
    error_id: ERR_PUNCH_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /shifts/{id}/punches"
  - priority: 13
    category: business_referential
    check: "At most one MealBreak per Shift (MEAL_OUT/MEAL_IN pair)"
    error_id: ERR_MEAL_BREAK_DUPLICATE
    http_status: 409
    applies_to: "POST /shifts/{id}/punches type=MEAL_OUT"
  - priority: 14
    category: business_temporal
    check: "Punch window: IN allowed only within [scheduled_start - 60m, scheduled_end + 60m]"
    error_id: ERR_PUNCH_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /shifts/{id}/punches type=IN"
  - priority: 15
    category: business_temporal
    check: "TimeEdit proposed_punched_at must lie within [Shift.scheduled_start - 4h, Shift.scheduled_end + 6h]"
    error_id: ERR_TIME_EDIT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /time-edits"
  - priority: 16
    category: business_constraint
    check: "Workweek.week_start must align to Sunday 00:00:00.000 UTC"
    error_id: ERR_WORKWEEK_BAD_ANCHOR
    http_status: 422
    applies_to: "POST /workweeks (when manually upserted via test endpoint)"
  - priority: 17
    category: business_constraint
    check: "Tipped employees: tipped_cash_rate_cents and applicable_minimum_wage_cents required; non-tipped employees must not supply tipped fields"
    error_id: ERR_TIPPED_FIELDS_MISMATCH
    http_status: 422
    applies_to: "POST /employees"
  - priority: 18
    category: business_constraint
    check: "TipDeclaration: only for tipped_role employees; declared_tips_cents >= 0"
    error_id: ERR_TIPS_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /shifts/{id}/tip-declaration"
  - priority: 19
    category: business_fiscal
    check: "base_hourly_rate_cents must satisfy: cash + tips/hour >= applicable_minimum_wage_cents when tipped_role=true (config-time only, before finalize)"
    error_id: ERR_BELOW_MINIMUM_WAGE
    http_status: 422
    applies_to: "POST /employees"
  - priority: 20
    category: business_fiscal
    check: "OCC version: if `version` supplied on PATCH and != current, reject"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /employees/{id}, PATCH /shifts/{id}"
  - priority: 21
    category: business_constraint
    check: "Idempotency: identical (shift_id, idempotency_key) + payload returns existing TimeEdit; mismatched payload errors"
    error_id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http_status: 409
    applies_to: "POST /time-edits"

# ─────────────────────────────────────────────────────────────────────────────
# §1.5 Endpoints
# ─────────────────────────────────────────────────────────────────────────────
endpoints:
  # Employees
  - method: POST
    path: "/timekeeping/employees"
    description: Create an employee record.
    roles: [PayrollAdmin]
    code: 201
    input: ["full_name", "jurisdiction", "classification", "base_hourly_rate_cents", "tipped_role?", "tipped_cash_rate_cents?", "applicable_minimum_wage_cents?"]
    output: Employee
    side_effects: []
  - method: GET
    path: "/timekeeping/employees/{id}"
    description: Read employee.
    roles: [Employee, Supervisor, PayrollAdmin]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: PATCH
    path: "/timekeeping/employees/{id}"
    description: Update employee fields (rate, classification, jurisdiction).
    roles: [PayrollAdmin]
    code: 200
    input: ["version?", "classification?", "base_hourly_rate_cents?", "jurisdiction?", "tipped_role?", "tipped_cash_rate_cents?", "applicable_minimum_wage_cents?", "status?"]
    output: Employee
    side_effects: ["Does not retroactively recompute past FINALIZED workweeks; affects future shifts only"]
  - method: GET
    path: "/timekeeping/employees"
    description: List employees (filter by status, classification).
    roles: [Supervisor, PayrollAdmin]
    code: 200
    input: ["status?", "classification?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  # Shifts
  - method: POST
    path: "/timekeeping/shifts"
    description: Schedule a new shift.
    roles: [Supervisor, PayrollAdmin]
    code: 201
    input: [employee_id, scheduled_start, scheduled_end]
    output: Shift
    side_effects: ["Validation 11: rejects EXEMPT employees"]
  - method: GET
    path: "/timekeeping/shifts/{id}"
    description: Read shift with computed fields.
    roles: [Employee, Supervisor, PayrollAdmin]
    code: 200
    input: []
    output: Shift
    side_effects: []
  - method: GET
    path: "/timekeeping/shifts"
    description: List shifts (filter by employee_id, state, week_start).
    roles: [Employee, Supervisor, PayrollAdmin]
    code: 200
    input: ["employee_id?", "state?", "week_start?", "limit?", "offset?"]
    output: Shift[]
    side_effects: []
  - method: DELETE
    path: "/timekeeping/shifts/{id}"
    description: Void a SCHEDULED shift.
    roles: [Supervisor, PayrollAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["Shift.state := VOIDED"]
  - method: POST
    path: "/timekeeping/shifts/{id}/punches"
    description: Record a punch (IN/OUT/MEAL_OUT/MEAL_IN). Server stamps punched_at.
    roles: [Employee, Supervisor]
    code: 201
    input: [punch_type]
    output: Punch
    side_effects: ["May transition Shift state per §1.2", "On OUT: triggers detention_minutes and meal_break_premium calcs"]
  - method: POST
    path: "/timekeeping/shifts/{id}/finalize"
    description: Finalize a CLOSED shift; rolls hours into the workweek and runs pay engine.
    roles: [PayrollAdmin]
    code: 200
    input: []
    output: Shift
    side_effects: ["Recompute Workweek totals", "May transition Workweek OPEN→POSTED"]
  - method: POST
    path: "/timekeeping/shifts/{id}/tip-declaration"
    description: Declare tips for a shift (tipped employees only).
    roles: [Employee, Supervisor, PayrollAdmin]
    code: 201
    input: [declared_tips_cents]
    output: TipDeclaration
    side_effects: ["On Shift FINALIZE: recomputes tip_credit_shortfall and workweek pay engine"]

  # Time edits
  - method: POST
    path: "/timekeeping/time-edits"
    description: Submit a time edit request.
    roles: [Employee, Supervisor, PayrollAdmin]
    code: 201
    input: [shift_id, target_punch_id, proposed_punched_at, reason_code, idempotency_key]
    output: TimeEdit
    side_effects: ["Shift may transition OPEN→DISPUTED or CLOSED→DISPUTED"]
  - method: GET
    path: "/timekeeping/time-edits/{id}"
    description: Read a time edit with audit trail.
    roles: [Employee, Supervisor, PayrollAdmin]
    code: 200
    input: []
    output: TimeEdit
    side_effects: []
  - method: GET
    path: "/timekeeping/time-edits"
    description: List time edits.
    roles: [Supervisor, PayrollAdmin]
    code: 200
    input: ["shift_id?", "state?", "reason_code?", "limit?", "offset?"]
    output: TimeEdit[]
    side_effects: []
  - method: POST
    path: "/timekeeping/time-edits/{id}/approve"
    description: Approve a pending time edit.
    roles: [Supervisor, PayrollAdmin]
    code: 200
    input: []
    output: TimeEdit
    side_effects: ["Cascade per §1.2 — inserts EDIT punch, recomputes detention/meal, may flip Workweek POSTED→OPEN"]
  - method: POST
    path: "/timekeeping/time-edits/{id}/reject"
    description: Reject a pending time edit.
    roles: [Supervisor, PayrollAdmin]
    code: 200
    input: []
    output: TimeEdit
    side_effects: ["Shift returns to pre-DISPUTED state"]
  - method: POST
    path: "/timekeeping/time-edits/{id}/revert"
    description: Revert an APPROVED time edit (PayrollAdmin only).
    roles: [PayrollAdmin]
    code: 200
    input: []
    output: TimeEdit
    side_effects: ["Removes EDIT punch, restores target, recomputes; may flip Workweek POSTED→OPEN"]

  # Workweek
  - method: GET
    path: "/timekeeping/workweeks/{id}"
    description: Read a workweek with computed regular/OT/DT/gross.
    roles: [Employee, Supervisor, PayrollAdmin]
    code: 200
    input: []
    output: Workweek
    side_effects: []
  - method: GET
    path: "/timekeeping/workweeks"
    description: List workweeks (filter by employee_id, payroll_status, week_start).
    roles: [Supervisor, PayrollAdmin]
    code: 200
    input: ["employee_id?", "payroll_status?", "week_start?", "limit?", "offset?"]
    output: Workweek[]
    side_effects: []
  - method: POST
    path: "/timekeeping/workweeks/{id}/lock"
    description: Lock a POSTED workweek; payroll-final.
    roles: [PayrollAdmin]
    code: 200
    input: []
    output: Workweek
    side_effects: ["Workweek POSTED→LOCKED; further time edits on its shifts are rejected"]

  # Audit
  - method: GET
    path: "/timekeeping/audit"
    description: Read the audit log (filter by subject_entity, subject_id, action).
    roles: [PayrollAdmin]
    code: 200
    input: ["subject_entity?", "subject_id?", "action?", "limit?", "offset?"]
    output: AuditEntry[]
    side_effects: []

  # Test-driving endpoints (clock advance)
  - method: POST
    path: "/timekeeping/_clock/advance"
    description: Test-only — advance the server clock by N seconds (used to reach time-gated states like punch-window checks and detention).
    roles: [PayrollAdmin]
    code: 200
    input: [seconds]
    output: object
    side_effects: ["Server now() shifts by seconds; affects validations 14, 15 and detention_minutes."]
  - method: POST
    path: "/timekeeping/_clock/set"
    description: Test-only — set the server clock to a specific ISO 8601 timestamp.
    roles: [PayrollAdmin]
    code: 200
    input: [now]
    output: object
    side_effects: ["Server now() becomes the supplied timestamp."]

# ─────────────────────────────────────────────────────────────────────────────
# §1.6 Errors
# ─────────────────────────────────────────────────────────────────────────────
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing X-User-ID or X-User-Role header."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of {Employee, Supervisor, PayrollAdmin}."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for endpoint, or actor is not the owner of the resource."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Referenced employee/shift/punch/time-edit/workweek does not exist."
  - id: ERR_SHIFT_INVALID_STATE
    http: 409
    condition: "Shift in a state that disallows the requested action (e.g., punch on FINALIZED, finalize on OPEN)."
  - id: ERR_SHIFT_ALREADY_OPEN
    http: 409
    condition: "Concurrent IN punches against the same SCHEDULED shift; loser sees Shift.state != SCHEDULED."
  - id: ERR_TIME_EDIT_NOT_PENDING
    http: 409
    condition: "approve/reject/revert called when TimeEdit is not in the required state."
  - id: ERR_WORKWEEK_LOCKED
    http: 409
    condition: "Any mutation attempted on a LOCKED workweek (finalize, edit approve, revert)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "approver.user_id equals requester.user_id on a TimeEdit."
  - id: ERR_FRAUD_REQUIRES_ADMIN
    http: 403
    condition: "FRAUD_CORRECTION TimeEdit approved by a non-PayrollAdmin role."
  - id: ERR_EXEMPT_NOT_ELIGIBLE
    http: 422
    condition: "Attempted to create a shift/punch/MealBreak for an EXEMPT employee."
  - id: ERR_PUNCH_OUT_OF_ORDER
    http: 422
    condition: "Punch sequence violates IN → (MEAL_OUT → MEAL_IN)? → OUT."
  - id: ERR_MEAL_BREAK_DUPLICATE
    http: 409
    condition: "Second MEAL_OUT punch attempted on a shift with an existing MealBreak."
  - id: ERR_PUNCH_OUTSIDE_WINDOW
    http: 422
    condition: "IN punch outside [scheduled_start - 60m, scheduled_end + 60m]."
  - id: ERR_TIME_EDIT_OUT_OF_RANGE
    http: 422
    condition: "proposed_punched_at outside [scheduled_start - 4h, scheduled_end + 6h]."
  - id: ERR_WORKWEEK_BAD_ANCHOR
    http: 422
    condition: "Workweek week_start is not Sunday 00:00:00.000 UTC."
  - id: ERR_TIPPED_FIELDS_MISMATCH
    http: 422
    condition: "tipped_role/tipped_cash_rate_cents/applicable_minimum_wage_cents not internally consistent on employee create/update."
  - id: ERR_TIPS_NOT_APPLICABLE
    http: 422
    condition: "TipDeclaration submitted on a non-tipped employee or with negative tips."
  - id: ERR_BELOW_MINIMUM_WAGE
    http: 422
    condition: "Configured base/tipped rate cannot satisfy minimum-wage floor at config time."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version supplied in PATCH does not match current Employee/Shift version."
  - id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http: 409
    condition: "Conflicting payload reused (shift_id, idempotency_key) on /time-edits."
  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Generic schema validation failure (missing required field, bad enum value, bad ISO 8601 timestamp)."

# ─────────────────────────────────────────────────────────────────────────────
# §1.7 RBAC
# ─────────────────────────────────────────────────────────────────────────────
roles:
  - name: Employee
    description: "Hourly worker who clocks in/out and may submit time edits on their own shifts."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /timekeeping/shifts/{id}/punches (own shift)"
    shared_operations:
      - "POST /timekeeping/time-edits (own shifts)"
      - "GET /timekeeping/shifts/{id} (own)"
      - "GET /timekeeping/workweeks/{id} (own)"
      - "POST /timekeeping/shifts/{id}/tip-declaration (own)"

  - name: Supervisor
    description: "Front-line manager. Schedules shifts, may punch on behalf of, approves/rejects time edits except FRAUD_CORRECTION."
    identity: "opaque"
    exclusive_operations:
      - "POST /timekeeping/shifts"
      - "DELETE /timekeeping/shifts/{id}"
    shared_operations:
      - "POST /timekeeping/shifts/{id}/punches"
      - "POST /timekeeping/time-edits"
      - "POST /timekeeping/time-edits/{id}/approve"
      - "POST /timekeeping/time-edits/{id}/reject"
      - "GET /timekeeping/audit (denied — admin-only; included here as a counter-example)"

  - name: PayrollAdmin
    description: "Payroll/HR operator. Creates employees, runs finalization, approves FRAUD_CORRECTION edits, reverts approved edits, locks workweeks, reads audit log."
    identity: "opaque"
    exclusive_operations:
      - "POST /timekeeping/employees"
      - "PATCH /timekeeping/employees/{id}"
      - "POST /timekeeping/shifts/{id}/finalize"
      - "POST /timekeeping/time-edits/{id}/revert"
      - "POST /timekeeping/workweeks/{id}/lock"
      - "GET /timekeeping/audit"
      - "POST /timekeeping/_clock/advance"
      - "POST /timekeeping/_clock/set"
      - "Approval of FRAUD_CORRECTION TimeEdits"
    shared_operations:
      - "POST /timekeeping/time-edits/{id}/approve (all reason codes)"
      - "POST /timekeeping/time-edits/{id}/reject"
