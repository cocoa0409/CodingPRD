            - call: "POST /recruitment/contracts/${c2_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "EXCLUSIVE", start_date: "2026-08-15", end_date: "2027-01-01" }
              as: RecruitmentOfficer
