      - name: four_sibling_labels_each_fail_approval_on_their_own_gate
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CARE_NOT_SUBSTANTIATED
          - errors.ERR_PLACEMENT_NOT_PERMANENT
          - errors.ERR_LABEL_CONTENT_MISMATCH
          - errors.ERR_LANGUAGE_REQUIREMENT_UNMET
