scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: selection_score_provisional_vs_final_gpa
        grounds:
          - calculations.selection_score
          - entities.Application.fields.final_selection_score
          - entities.Application.fields.selection_score
          - entities.Application.fields.verified_gpa
          - entities.Applicant.fields.gpa
        distinguishing_aspect: |
          The two variants of calculation `selection_score` sit on the Application/Applicant domain and
          diverge by exactly 0.04 for the same application: the provisional variant reads Applicant.gpa=4.00
          and yields 85.00, while the final variant reads Application.verified_gpa=3.99 and yields 84.96 --
          and only the final variant feeds the SELECT gate.
        test_recipe:
          setup:
            - "One Region (TX), one CertificationPathway, one ACTIVE PartnerDistrict with one PartnerSchool."
            - "One Applicant with leadership_score 80.0, achievement_score 85.0, campus_tier STANDARD, gpa 4.00."
            - "One Application on that applicant with subject_area ENGLISH and grade_preference HIGH, so neither the PRIORITY-campus bonus nor the high-need-subject bonus applies."
            - "The application has been reviewed with verified_gpa 3.99."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/certification-pathways"
              payload: { region_id: "${r_id}", state_code: "TX", certification_track: "ALTERNATIVE_EMERGENCY", required_coursework_hours: 60, required_practice_hours: 120, deadline_days_before_term: 30, coursework_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /corps/partner-districts"
              payload: { region_id: "${r_id}", name: "Bayou ISD", hiring_commitment_slots: 4, placement_fee_per_member_cents: 350000, unfilled_slot_penalty_cents: 120000, fee_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_v1: $.data.version }
            - call: "POST /corps/partner-schools"
              payload: { district_id: "${d_id}", name: "Bayou High", grade_band: "HIGH", subject_needs: ["MATH", "SCIENCE"], classroom_capacity: 1, expected_district_version: "${d_v1}" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /corps/partner-districts/${d_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a_id}", preferred_region_id: "${r_id}", subject_area: "ENGLISH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app_id: $.data.id }
            - call: "POST /corps/applications/${app_id}/review"
              payload: { verified_gpa: 3.99 }
              as: SelectionManager
              as_user_id: "sm_reviewer"
          trigger:
            - call: "POST /corps/applications/${app_id}/decision"
              payload: { decision: "SELECT", decision_reason: "strong leadership record" }
              as: SelectionManager
              as_user_id: "sm_decider"
              captures: { final_score: $.data.final_selection_score, err: $.data.error_id }
          assert:
            - "Application.${app_id}.selection_score == 85.00 (provisional variant, reads Applicant.gpa == 4.00)"
            - "Application.${app_id}.final_selection_score == 84.96 (final variant, reads Application.verified_gpa == 3.99)"
            - "Application.${app_id}.selection_score != Application.${app_id}.final_selection_score"
            - "Application.${app_id}.status == UNDER_REVIEW (the SELECT gate refused: 84.96 < 85.00, ERR_SCORE_BELOW_THRESHOLD)"
      - name: district_invoice_actual_vs_forward_looking
        grounds:
          - calculations.district_invoice_amount_cents
          - entities.PartnerDistrict.fields.invoice_amount_cents
          - entities.PartnerDistrict.fields.hiring_commitment_slots
          - entities.PartnerDistrict.fields.unfilled_slot_penalty_cents
          - state_machines.Placement.MATCHED_to_CONFIRMED
        distinguishing_aspect: |
          The two variants of calculation `district_invoice_amount_cents` sit on the PartnerDistrict domain
          and return different integers for the same district: `actual` returns 710000 once one of four
          committed slots is filled (350000 filled-slot fee plus 360000 unfilled-slot penalty), while
          `forward_looking` returns 1400000 by assuming all four slots fill and charging no penalty.
        test_recipe:
          setup:
            - "One Region (TX), one CertificationPathway, one ACTIVE PartnerDistrict with hiring_commitment_slots 4, placement_fee_per_member_cents 350000, unfilled_slot_penalty_cents 120000 and fee_budget_cents 2000000."
            - "One PartnerSchool under that district, grade_band HIGH, subject_needs [MATH, SCIENCE], classroom_capacity 1."
            - "One corps member (synthesized by offer acceptance) with a CONFIRMED placement at that school, so exactly one of the four committed slots is filled."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/certification-pathways"
              payload: { region_id: "${r_id}", state_code: "TX", certification_track: "ALTERNATIVE_EMERGENCY", required_coursework_hours: 60, required_practice_hours: 120, deadline_days_before_term: 30, coursework_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /corps/partner-districts"
              payload: { region_id: "${r_id}", name: "Bayou ISD", hiring_commitment_slots: 4, placement_fee_per_member_cents: 350000, unfilled_slot_penalty_cents: 120000, fee_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_v1: $.data.version }
            - call: "POST /corps/partner-schools"
              payload: { district_id: "${d_id}", name: "Bayou High", grade_band: "HIGH", subject_needs: ["MATH", "SCIENCE"], classroom_capacity: 1, expected_district_version: "${d_v1}" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /corps/partner-districts/${d_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a_id}", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app_id: $.data.id }
            - call: "POST /corps/applications/${app_id}/review"
              payload: { verified_gpa: 4.0 }
              as: SelectionManager
              as_user_id: "sm_reviewer"
            - call: "POST /corps/applications/${app_id}/decision"
              payload: { decision: "SELECT" }
              as: SelectionManager
              as_user_id: "sm_decider"
            - call: "POST /corps/applications/${app_id}/offer"
              payload: {}
              as: SelectionManager
            - call: "POST /corps/applications/${app_id}/offer/respond"
              payload: { accept: true }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { m_id: $.data.created_corps_member_id }
            - call: "GET /corps/corps-members/${m_id}"
              payload: {}
              as: PlacementCoordinator
              captures: { m_v: $.data.version }
            - call: "POST /corps/placements"
              payload: { corps_member_id: "${m_id}", school_id: "${s_id}", subject_area: "MATH", grade_band: "HIGH", term_start_date: "2026-12-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z", expected_corps_member_version: "${m_v}" }
              as: PlacementCoordinator
              captures: { pl_id: $.data.id }
            - call: "POST /corps/placements/${pl_id}/confirm"
              payload: {}
              as: PlacementCoordinator
          trigger:
            - call: "GET /corps/partner-districts/${d_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv_actual: $.data.invoice_amount_cents }
            - call: "GET /corps/partner-districts/${d_id}?projection=FORWARD_LOOKING"
              payload: {}
              as: PlatformAdmin
              captures: { inv_fwd: $.data.invoice_amount_cents }
          assert:
            - "PartnerDistrict.${d_id}.committed_placement_count == 1"
            - "PartnerDistrict.${d_id}.invoice_amount_cents == 710000 under the default ACTUAL projection"
            - "PartnerDistrict.${d_id}.invoice_amount_cents == 1400000 under projection=FORWARD_LOOKING"
            - "710000 != 1400000, so the two variants of `district_invoice_amount_cents` are observably distinct"
  - rule_id: combinatorial_formula
    instances:
      - name: selection_score_bonus_stack_mode_a
        grounds:
          - calculations.selection_score
          - entities.Applicant.fields.campus_tier
          - entities.Application.fields.subject_area
        distinguishing_aspect: |
          Mode (a): `selection_score` takes four inputs with non-linear interaction -- a weighted base plus a
          campus-tier bonus plus a high-need-subject bonus, each clamped by min(100.0, ...). The same
          leadership 88.0 / achievement 76.0 / gpa 3.50 applicant scores 83.13 on a STANDARD campus in
          ENGLISH and 95.13 on a PRIORITY campus in MATH.
        test_recipe:
          setup:
            - "One Region (TX) and one CertificationPathway."
            - "Two Applicants with identical leadership_score 88.0, achievement_score 76.0 and gpa 3.50, differing only in campus_tier (STANDARD vs PRIORITY)."
            - "Two Applications on those applicants, both subject_area ENGLISH for the first and MATH for the second."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/certification-pathways"
              payload: { region_id: "${r_id}", state_code: "TX", certification_track: "ALTERNATIVE_EMERGENCY", required_coursework_hours: 60, required_practice_hours: 120, deadline_days_before_term: 30, coursework_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /corps/applicants"
              payload: { full_name: "Bo Chen", email: "bo@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 88.0, achievement_score: 76.0, gpa: 3.5 }
              as: SelectionManager
              captures: { a1_id: $.data.id }
            - call: "POST /corps/applicants"
              payload: { full_name: "Cy Diallo", email: "cy@x.edu", campus_name: "Flagship U", campus_tier: "PRIORITY", graduation_year: 2026, leadership_score: 88.0, achievement_score: 76.0, gpa: 3.5 }
              as: SelectionManager
              captures: { a2_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a1_id}", preferred_region_id: "${r_id}", subject_area: "ENGLISH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app1_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a2_id}", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app2_id: $.data.id }
          trigger:
            - call: "GET /corps/applications/${app1_id}"
              payload: {}
              as: SelectionManager
              captures: { score_plain: $.data.selection_score }
            - call: "GET /corps/applications/${app2_id}"
              payload: {}
              as: SelectionManager
              captures: { score_bonused: $.data.selection_score }
          assert:
            - "Application.${app1_id}.selection_score == 83.13 (0.45*88.0 + 0.40*76.0 + 0.15*(3.50/4.0*100) = 83.125, round_half_up to 2dp)"
            - "Application.${app2_id}.selection_score == 95.13 (83.125 + 5.0 PRIORITY bonus + 7.0 MATH bonus = 95.125, round_half_up to 2dp)"
            - "Application.${app2_id}.selection_score - Application.${app1_id}.selection_score == 12.00"
      - name: institute_stipend_round_per_week_mode_b
        grounds:
          - calculations.institute_stipend_cents
          - entities.CorpsMember.fields.practice_teaching_hours
          - entities.CorpsMember.fields.institute_stipend_cents
        distinguishing_aspect: |
          Mode (b): `institute_stipend_cents` pins a nested rounding order -- round each week's amount to
          2 decimals BEFORE summing. For 240 practice hours the pinned order yields 75114 cents, while
          summing first and rounding once yields 75115 cents.
        test_recipe:
          setup:
            - "One Region (TX), one CertificationPathway, one ACTIVE PartnerDistrict and one PartnerSchool."
            - "One corps member synthesized by offer acceptance, with institute_status ENROLLED and practice_teaching_hours 0."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/certification-pathways"
              payload: { region_id: "${r_id}", state_code: "TX", certification_track: "ALTERNATIVE_EMERGENCY", required_coursework_hours: 60, required_practice_hours: 120, deadline_days_before_term: 30, coursework_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /corps/partner-districts"
              payload: { region_id: "${r_id}", name: "Bayou ISD", hiring_commitment_slots: 4, placement_fee_per_member_cents: 350000, unfilled_slot_penalty_cents: 120000, fee_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_v1: $.data.version }
            - call: "POST /corps/partner-schools"
              payload: { district_id: "${d_id}", name: "Bayou High", grade_band: "HIGH", subject_needs: ["MATH", "SCIENCE"], classroom_capacity: 1, expected_district_version: "${d_v1}" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /corps/partner-districts/${d_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a_id}", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app_id: $.data.id }
            - call: "POST /corps/applications/${app_id}/review"
              payload: { verified_gpa: 4.0 }
              as: SelectionManager
              as_user_id: "sm_reviewer"
            - call: "POST /corps/applications/${app_id}/decision"
              payload: { decision: "SELECT" }
              as: SelectionManager
              as_user_id: "sm_decider"
            - call: "POST /corps/applications/${app_id}/offer"
              payload: {}
              as: SelectionManager
            - call: "POST /corps/applications/${app_id}/offer/respond"
              payload: { accept: true }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { m_id: $.data.created_corps_member_id }
          trigger:
            - call: "POST /corps/corps-members/${m_id}/institute/practice-hours"
              payload: { practice_hours_delta: 240 }
              as: InstituteDirector
              captures: { stipend: $.data.institute_stipend_cents, ph: $.data.practice_teaching_hours }
          assert:
            - "CorpsMember.${m_id}.practice_teaching_hours == 240"
            - "CorpsMember.${m_id}.institute_status == IN_TRAINING"
            - "CorpsMember.${m_id}.institute_stipend_cents == 75114"
            - "75114 == 6 * 12519, i.e. round_half_up(6510.00/52, 2) = 125.19 rounded per week then summed; the rejected sum-then-round order would give 75115"
      - name: readiness_score_credit_keyed_on_subtotal_mode_c
        grounds:
          - calculations.readiness_score
          - calculations.certification_hours_verified
          - calculations.coursework_hours_completed
          - state_machines.CertificationMilestone.UNVERIFIED_to_VERIFIED
        distinguishing_aspect: |
          Mode (c): `readiness_score` has a circular-looking dependency -- the support credit is selected by
          the tier of `subtotal`, and `subtotal` is the value BEFORE the credit. With subtotal 78.50 the
          pinned order yields 80.00; re-keying the credit on the post-credit value would cross the STRONG
          tier and yield 81.50.
        test_recipe:
          setup:
            - "One Region (TX), one CertificationPathway with required_coursework_hours 60 and required_practice_hours 120, one ACTIVE PartnerDistrict and one PartnerSchool."
            - "One corps member synthesized by offer acceptance, so four milestones exist in the fixed order COURSEWORK(60), PRACTICUM(120), ORIENTATION(60), EXAM(0)."
            - "The member has recorded 84 practice-teaching hours and completed the COURSEWORK milestone, so coursework_hours_completed is 60."
            - "The COURSEWORK and PRACTICUM milestones are COMPLETED and VERIFIED, so certification_hours_verified is 180 and certified_ratio is 180/240 = 0.75."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/certification-pathways"
              payload: { region_id: "${r_id}", state_code: "TX", certification_track: "ALTERNATIVE_EMERGENCY", required_coursework_hours: 60, required_practice_hours: 120, deadline_days_before_term: 30, coursework_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /corps/partner-districts"
              payload: { region_id: "${r_id}", name: "Bayou ISD", hiring_commitment_slots: 4, placement_fee_per_member_cents: 350000, unfilled_slot_penalty_cents: 120000, fee_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_v1: $.data.version }
            - call: "POST /corps/partner-schools"
              payload: { district_id: "${d_id}", name: "Bayou High", grade_band: "HIGH", subject_needs: ["MATH", "SCIENCE"], classroom_capacity: 1, expected_district_version: "${d_v1}" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /corps/partner-districts/${d_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a_id}", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app_id: $.data.id }
            - call: "POST /corps/applications/${app_id}/review"
              payload: { verified_gpa: 4.0 }
              as: SelectionManager
              as_user_id: "sm_reviewer"
            - call: "POST /corps/applications/${app_id}/decision"
              payload: { decision: "SELECT" }
              as: SelectionManager
              as_user_id: "sm_decider"
            - call: "POST /corps/applications/${app_id}/offer"
              payload: {}
              as: SelectionManager
            - call: "POST /corps/applications/${app_id}/offer/respond"
              payload: { accept: true }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { m_id: $.data.created_corps_member_id }
            - call: "GET /corps/corps-members/${m_id}/certification-milestones"
              payload: {}
              as: CertificationOfficer
              captures: { ms_cw: "$.data[0].id", ms_pr: "$.data[1].id" }
            - call: "POST /corps/corps-members/${m_id}/institute/practice-hours"
              payload: { practice_hours_delta: 84 }
              as: InstituteDirector
            - call: "POST /corps/certification-milestones/${ms_cw}/start"
              payload: {}
              as: CertificationOfficer
            - call: "POST /corps/certification-milestones/${ms_cw}/complete"
              payload: {}
              as: CertificationOfficer
              as_user_id: "co_completer"
            - call: "POST /corps/certification-milestones/${ms_cw}/verify"
              payload: { outcome: "VERIFY" }
              as: CertificationOfficer
              as_user_id: "co_verifier"
            - call: "POST /corps/certification-milestones/${ms_pr}/start"
              payload: {}
              as: CertificationOfficer
            - call: "POST /corps/certification-milestones/${ms_pr}/complete"
              payload: {}
              as: CertificationOfficer
              as_user_id: "co_completer"
            - call: "POST /corps/certification-milestones/${ms_pr}/verify"
              payload: { outcome: "VERIFY" }
              as: CertificationOfficer
              as_user_id: "co_verifier"
          trigger:
            - call: "GET /corps/corps-members/${m_id}"
              payload: {}
              as: CertificationOfficer
              captures: { ready: $.data.readiness_score, chv: $.data.certification_hours_verified, cwc: $.data.coursework_hours_completed }
          assert:
            - "CorpsMember.${m_id}.certification_hours_verified == 180"
            - "CorpsMember.${m_id}.coursework_hours_completed == 60"
            - "CorpsMember.${m_id}.readiness_score == 80.00"
            - "80.00 == 78.50 + 1.5, i.e. the QUALIFIED credit was keyed on subtotal 78.50; keying the credit on the post-credit value would cross STRONG and give 81.50"
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle_reentry
        grounds:
          - state_machines.Application.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Application.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.Application.RETURNED_FOR_REVISION_to_UNDER_REVIEW
          - entities.Application.fields.revision_count
        distinguishing_aspect: |
          The Application machine is cyclic, not a linear pipeline: UNDER_REVIEW -> RETURNED_FOR_REVISION ->
          UNDER_REVIEW can be traversed twice on the same row, so the second return leaves revision_count at
          2 and the application back at UNDER_REVIEW rather than in a terminal state.
        test_recipe:
          setup:
            - "One Region (TX) and one Applicant with leadership_score 80.0 and achievement_score 85.0."
            - "One Application in state SUBMITTED with revision_count 0."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
