          setup: ["clock 2026-05-01; E_STEWARDS policy ACTIVE with export_allowed false; recycler cert 2027-05-01"]
          setup_api_calls:
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
