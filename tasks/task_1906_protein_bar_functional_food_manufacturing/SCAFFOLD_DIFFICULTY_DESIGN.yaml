            - { call: "POST /mfg/formulas/${fq2}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }, { ingredient_id: "${syr}", qty_kg_per_batch: 10, is_protein_contributor: false }], batch_size_kg: 100, target_protein_g_per_serving: 15, claim_tags: [] }, as: FormulationScientist, captures: { rq2: "$.data.id" } }
            - { call: "POST /mfg/revisions/${rq2}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rq2}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${rq2}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rq2}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/lines", payload: { name: "LD", capacity_kg_per_hour: 500, slab_weight_kg: 20 }, as: PlantAdmin, captures: { ld: "$.data.id", ld_v: "$.data.version" } }
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T06:00:00Z" }, as: PlantAdmin }
            - { call: "GET /mfg/agreements/${ag}", payload: {}, as: ProductionPlanner, captures: { ag_v1: "$.data.version" } }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${rq2}", agreement_id: "${ag}", line_id: "${ld}", planned_cases: 100, expected_agreement_version: "${ag_v1}" }, as: ProductionPlanner, captures: { runA: "$.data.id" } }
            - { call: "POST /mfg/production-runs/${runA}/schedule", payload: { start_utc: "2026-08-05T08:00:00Z", end_utc: "2026-08-05T10:00:00Z", expected_line_version: "${ld_v}" }, as: ProductionPlanner }
            - { call: "GET /mfg/agreements/${ag}", payload: {}, as: ProductionPlanner, captures: { ag_v2: "$.data.version" } }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${rq2}", agreement_id: "${ag}", line_id: "${ld}", planned_cases: 100, expected_agreement_version: "${ag_v2}" }, as: ProductionPlanner, captures: { runC: "$.data.id" } }
            - { call: "GET /mfg/lines/${ld}", payload: {}, as: ProductionPlanner, captures: { ld_v2: "$.data.version" } }
            - { call: "POST /mfg/production-runs/${runC}/schedule", payload: { start_utc: "2026-08-05T12:30:00Z", end_utc: "2026-08-05T14:00:00Z", expected_line_version: "${ld_v2}" }, as: ProductionPlanner }
            - { call: "GET /mfg/lines/${ld}/day-availability", payload: { date: "2026-08-05" }, as: ProductionPlanner, captures: { occ1: "$.data.occupied_minutes", buf1: "$.data.buffered_minutes", free1: "$.data.free_minutes" } }
            - { call: "GET /mfg/agreements/${ag}", payload: {}, as: ProductionPlanner, captures: { ag_v3: "$.data.version" } }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${rq2}", agreement_id: "${ag}", line_id: "${ld}", planned_cases: 100, expected_agreement_version: "${ag_v3}" }, as: ProductionPlanner, captures: { runB: "$.data.id" } }
            - { call: "GET /mfg/lines/${ld}", payload: {}, as: ProductionPlanner, captures: { ld_v3: "$.data.version" } }
            - { call: "POST /mfg/production-runs/${runB}/schedule", payload: { start_utc: "2026-08-05T10:30:00Z", end_utc: "2026-08-05T12:00:00Z", expected_line_version: "${ld_v3}" }, as: ProductionPlanner }
            - { call: "GET /mfg/lines/${ld}/day-availability", payload: { date: "2026-08-05" }, as: ProductionPlanner, captures: { occ2: "$.data.occupied_minutes", buf2: "$.data.buffered_minutes", free2: "$.data.free_minutes" } }
          trigger:
            - { call: "POST /mfg/production-runs/${runB}/cancel", payload: {}, as: ProductionPlanner, captures: { runB_st: "$.data.status" } }
            - { call: "GET /mfg/lines/${ld}/day-availability", payload: { date: "2026-08-05" }, as: ProductionPlanner, captures: { occ3: "$.data.occupied_minutes", buf3: "$.data.buffered_minutes", free3: "$.data.free_minutes" } }
          assert:
            - "after A and C: occupied_minutes == 210 (120+90), buffered_minutes == 30 (0+30), free_minutes == 1200"
            - "after B scheduled: occupied_minutes == 300, buffered_minutes == 60, free_minutes == 1080"
            - "after B cancelled: free_minutes == 1200 exactly restored (occupied 210, buffered 30) — forward + compensating action conserves 1440"
            - "ProductionRun.${runB}.status == CANCELLED"
