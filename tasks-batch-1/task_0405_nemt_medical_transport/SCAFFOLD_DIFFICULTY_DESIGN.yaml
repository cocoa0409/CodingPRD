  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: eligibility_lapse_cascade_depth3
        grounds:
          - state_machines.Member.ELIGIBLE_to_SUSPENDED
          - state_machines.TripRequest.ASSIGNED_to_CANCELLED
          - state_machines.Assignment
          - state_machines.Driver.ON_TRIP_to_AVAILABLE
          - calculations.standing_order_generation
        distinguishing_aspect: |
          Depth-3 chain originating from Member ELIGIBLE->SUSPENDED: (1) Member lapse
          -> (2) ASSIGNED TripRequest -> CANCELLED, which (3) RELEASES its ACTIVE
          Assignment and bubbles the bound Driver ON_TRIP -> AVAILABLE; each hop is
          caused by the prior hop, not directly by the recompute call.
        test_recipe:
          setup:
            - "ELIGIBLE WHEELCHAIR member with a span covering only [2026-01-01,2026-03-03) (expires before recompute clock)."
            - "A WHEELCHAIR round-trip trip ASSIGNED to a broker+driver (driver ON_TRIP, ACTIVE Assignment)."
            - "Clock advanced to 2026-03-04T00:00:00Z so no span covers now."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "WHEELCHAIR", base_fare_cents: 2000, loaded_rate_cents_per_mile: 150, dwell_free_minutes: 10, dwell_cents_per_minute: 50 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-EL-1", full_name: "Ella L", mobility_level: "WHEELCHAIR", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "BARIATRIC", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-03-03T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerEL", covered_counties: ["C1"], max_modality: "STRETCHER", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "El D", vehicle_modality: "WHEELCHAIR", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "WHEELCHAIR", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 10, is_round_trip: true, return_is_will_call: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
              captures: { assigned_drv: $.data.assigned_driver_id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-04T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /members/${mem_id}/eligibility/recompute"
              payload: {}
              as: Coordinator
              captures: { elig: $.data.eligibility_status }
          assert:
            - "Member.${mem_id}.eligibility_status == SUSPENDED"
            - "TripRequest.${trip_id}.trip_status == CANCELLED"
            - "The trip's Assignment.status == RELEASED"
            - "Driver.${drv_id}.status == AVAILABLE"

      - name: broker_suspend_cascade_depth2
        grounds:
          - state_machines.Broker.ACTIVE_to_SUSPENDED
          - state_machines.TripRequest.field.trip_status
          - state_machines.Driver.ON_TRIP_to_AVAILABLE
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (Broker ACTIVE->SUSPENDED): (1)
          broker suspend reverts each ASSIGNED trip on that broker to SCHEDULED,
          which (2) RELEASES its Assignment and frees the Driver ON_TRIP->AVAILABLE.
          Originates from a distinct transition vs the eligibility cascade.
        test_recipe:
          setup:
            - "ELIGIBLE AMBULATORY member with covering span; one ASSIGNED trip on an ACTIVE broker, driver ON_TRIP."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
