            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_xyz}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 90000000, liquid_net_worth_cents: 90000000, investment_experience_years: 9 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
