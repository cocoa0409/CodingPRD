              as_user_id: "u-designer-1"
              captures: { s5: $.data.status, sub5: $.data.submitted_by_user_id, v5: $.data.version }
            - call: "POST /incentives/programs/${prog_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { s6: $.data.status, appr6: $.data.approved_by_user_id, v6: $.data.version }
          assert:
            - "the state trace is ${s1} PENDING_APPROVAL, ${s2} DRAFT, ${s3} PENDING_APPROVAL, ${s4} DRAFT, ${s5} PENDING_APPROVAL, ${s6} ACTIVE — two full laps of the cycle before the exit edge"
            - "${sub1} == u-designer-1, ${sub2} == null (revise clears the submitter), ${sub3} == u-designer-2 and ${sub5} == u-designer-1"
            - "${v1} == 2, ${v2} == 3, ${v3} == 4, ${v4} == 5, ${v5} == 6 and ${v6} == 7 — version is monotonic across the cycle and NEVER resets with the state"
