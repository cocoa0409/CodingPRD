            - "Order.${o1}.status remains ASSEMBLING; no PortionVerification rows created"
      - name: customization_on_non_spec_ingredient_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_INVALID_CUSTOMIZATION]"]
        distinguishing_aspect: "An EXTRA customization naming an ingredient absent from the recipe's portion_spec is rejected with ERR_INVALID_CUSTOMIZATION."
        test_recipe:
          setup: ["Restaurant R1; lines; ingredient ING in recipe; extra ingredient EXT not in the recipe"]
          setup_api_calls:
