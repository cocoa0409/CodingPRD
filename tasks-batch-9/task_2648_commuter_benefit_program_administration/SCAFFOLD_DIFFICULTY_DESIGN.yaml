            - "MediaOrder.${mo_half_id}.line_gross_cents == 1020"
            - "MediaOrder.${mo_half_id}.line_surcharge_cents == 26"
            - "MediaOrder.${mo_half_id}.line_total_cents == 1046"
            - "MediaOrder.${mo_under_id}.line_gross_cents == 1019"
            - "MediaOrder.${mo_under_id}.line_surcharge_cents == 25"
            - "MediaOrder.${mo_under_id}.line_total_cents == 1044"
            - "${sealed_lines} == 2"
            - "${sealed_subtotal} == 2090"
            - "the subtotal is NOT 2089, which is what banker's rounding of the exact 25.5 half-cent would produce"
            - "${sealed_discount} == 0"
            - "${sealed_total} == 2090"
            - "OrderBatch.${bat_id}.status == SEALED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: media_order_create_blocked_by_order_batch_sealed_state
        grounds:
          - validations[priority=47]
          - errors.ERR_ORDER_BATCH_NOT_OPEN
          - state_machines.OrderBatch.OPEN_to_SEALED
          - endpoints.POST_/benefits/media-orders
        distinguishing_aspect: |
          ENTITY PAIR MediaOrder -> OrderBatch. Whether a media-order create succeeds depends on the
          status of the OrderBatch it is filed into, not on anything about the order itself: the very
          same body succeeds while the batch is OPEN, is rejected with ERR_ORDER_BATCH_NOT_OPEN once
          the batch is SEALED, and succeeds again when re-pointed at a brand new OPEN batch.
