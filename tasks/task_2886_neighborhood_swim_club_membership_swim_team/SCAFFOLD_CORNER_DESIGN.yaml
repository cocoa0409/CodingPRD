            - "the third entry omitted priority_tier and reads back priority_tier == STANDARD, the declared default"
            - "${e_leg_key} == ${e_leg_created} exactly: queue_key_at starts as created_at, not as the current clock rounded"
            - "${e_std_defer} == 0 and ${e_std_requeued} == null on every fresh entry"

      - name: system_fields_conduct_case_stamps_reported_by_user_id_from_the_header
        claim_type: system_fields
        grounds:
          - entities.ConductCase.fields.reported_by_user_id
          - endpoints[POST /swim-club/conduct-cases]
          - roles[PoolManager]
        distinguishing_aspect: |
          reported_by_user_id is stamped from the X-User-ID header and is not an input field, which
          is what makes the two-person control on this aggregate enforceable at all. The corner is
          that the stamp records the ACTING user rather than the subject or the household, and that
          the freshly reported case carries null in every decision field.
        test_recipe:
          setup:
            - "One household in GOOD_STANDING with no membership, so no cascade can fire."
            - "The case is reported by PoolManager user pm-001."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-10T15:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Reporter Test Household", address_line: "21 Cedar Court", residency: "IN_DISTRICT", member_count: 3, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /swim-club/conduct-cases"
              payload: { household_id: "${h_id}", subject_name: "Teen guest of the household", severity: "MINOR", narrative: "Ran on the deck twice after two warnings from the guard chair." }
              as: PoolManager
              as_user_id: pm-001
              captures: { c_id: $.data.id, c_reporter: $.data.reported_by_user_id, c_status: $.data.status, c_points: $.data.points_assessed }
            - call: "GET /swim-club/conduct-cases/${c_id}"
              payload: {}
              as: BoardPresident
              captures: { c_reporter_2: $.data.reported_by_user_id, c_decider: $.data.decided_by_user_id }
          assert:
            - "HTTP 201 with data.status == REPORTED, the declared initial state"
            - "${c_reporter} == pm-001, taken from X-User-ID and not from the payload, which carries no such field"
            - "data.decided_by_user_id == null, data.sanction_type == null, data.sanctioned_at == null, data.appeal_count == 0"
            - "${c_points} == 0: points are assessed at SANCTIONED, not at report time"
            - "the household's conduct_points is still 0, because conduct_point_accrual counts only SANCTIONED and CLOSED cases"
            - "the stamp survives a re-read by a different role (${c_reporter_2} == pm-001), so it is persisted rather than echoed"

      - name: type_constraints_unknown_squad_value_returns_invalid_enum
