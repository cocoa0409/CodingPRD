      - name: endpoint_conditional_retire_refused_while_resale_pending
        claim_type: conditional_action
        grounds: ["endpoints[POST /retail/routes/{id}/status]", "errors[ERR_RESALE_ALREADY_PENDING]", state_machines.Route.DRAFT_to_RETIRED]
        distinguishing_aspect: "Retire is conditionally allowed only when resale_status is not PENDING: the same action on the same route is refused with ERR_RESALE_ALREADY_PENDING 409 while a filing is pending and succeeds once the resale is declined."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 DRAFT with a QUALIFIED territory and resale_status NONE; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: SUSPEND }, as: FranchiseManager, captures: { r1_suspended: "$.data.route_status" } }
            - { call: "POST /retail/routes/${r1_id}/resale", payload: { action: FILE, buyer_training_status: ENROLLED, buyer_training_points: 10 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_resale: "$.data.resale_status" } }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: RETIRE }, as: FranchiseManager, captures: { retire_error: "$.data.error_id" } }
            - { call: "POST /retail/routes/${r1_id}/resale", payload: { action: DECLINE }, as: FranchiseManager, captures: { r1_declined: "$.data.resale_status" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: RETIRE }, as: FranchiseManager, captures: { r1_retired: "$.data.route_status" } }
          assert:
            - "Route.${r1_id}.resale_status == PENDING before the attempt and route_status == SUSPENDED"
            - "the first RETIRE captures ${retire_error} == ERR_RESALE_ALREADY_PENDING with http 409"
            - "Route.${r1_id}.route_status remains SUSPENDED after the refusal"
            - "after the resale is DECLINED the same RETIRE succeeds and Route.${r1_id}.route_status == RETIRED"
            - "Route.${r1_id}.territory_development_status == SURRENDERED, the retire side effect on a QUALIFIED territory"

