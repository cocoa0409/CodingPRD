  - rule_id: priority_pair_validation_conflict
    instances:

      - name: apply_unapproved_state_beats_dual_approval_shortfall
        grounds:
          - validations.priority_12_ERR_REQUEST_NOT_APPROVED
          - validations.priority_35_ERR_DUAL_APPROVAL_REQUIRED
          - calculations.price_uplift_and_approval_tier
        distinguishing_aspect: |
          Pair P1: a `state` category rule at priority 12 versus a `business_fiscal` rule at
          priority 35. The request is PENDING_APPROVAL with 1 of the 2 required approvals, so
          both conditions hold at once; only ERR_REQUEST_NOT_APPROVED may surface, and the
          approval-count shortfall must stay invisible.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A (x1.10, NINE_ENDING) holds Item A at effective 559."
            - "A PriceChangeRequest proposing 590 (uplift 555 bp >= 500 bp, so required_approvals is 2) is SUBMITTED and then APPROVED once by u_approver_1, leaving it PENDING_APPROVAL with exactly one entry in approval_user_ids."
            - "Cluster CL_ZONE and store S001 put at least one Store in this price zone, which validation priority 32 (ERR_PRICE_ZONE_MISMATCH) requires before any PriceChangeRequest may name it."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
