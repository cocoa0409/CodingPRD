      - The error is ERR_EFFECTIVE_DATE_NOT_REACHED, not ERR_NO_EFFECTIVE_RECIPROCAL_RATE
  - name: offer_acceptance_pins_terms_and_supersedes_the_standing_offer
    claim_type: side_effect_execution
    grounds:
    - state_machines.InterconnectionAgreement.PROPOSED_to_EXECUTED
    - state_machines.NegotiationOffer.OPEN_to_SUPERSEDED
    excluded_because:
      difficulty_instance: non_linear_state_machine / agreement_negotiation_cycles_proposed_countered_proposed
      rationale: The named §1.8 instance asserts every side effect of the accept transition (pinned rate, term and POI responsibility, executed_at, and the SUPERSEDED/ACCEPTED offer statuses) across a three-round
        cycle.
  - name: factor_filing_supersession_retires_the_previous_filing_for_the_quarter
    claim_type: side_effect_execution
    grounds:
    - state_machines.TrafficFactorFiling.ACCEPTED_to_SUPERSEDED
    - concurrency_rules[factor-filing-create-stale-carrier]
    distinguishing_aspect: |
      Side-effect claim: creating a second filing for the same (carrier_id, quarter) drives the system transition ACCEPTED -> SUPERSEDED on the incumbent and stamps superseded_at, so later jurisdictionalization pins the newer row.
    test_recipe:
      setup:
      - A carrier whose 2026Q3 factor filing was reported at PIU 50.00 / PLU 10.00 and ACCEPTED by review.
      - Creating that filing advanced Carrier.version to 2, so the second filing must quote the fresh version.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/traffic-factor-filings
        payload:
          carrier_id: ${car_id}
          expected_carrier_version: ${car_v0}
          quarter: 2026Q3
          reported_piu_pct: 50.00
          reported_plu_pct: 10.00
        as: AccessBillingAnalyst
        captures:
          ff_id: $.data.id
      - call: POST /interconnection/traffic-factor-filings/${ff_id}/review
        payload:
