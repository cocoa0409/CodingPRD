  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: session_credit_conserved_on_book_then_cancel
        grounds:
          - calculations.session_credit_ledger
          - state_machines.CounselingSession.SCHEDULED_to_CANCELLED
          - entities.CounselingCase.fields.covered_sessions
          - entities.CounselingCase.fields.sessions_remaining
        distinguishing_aspect: "Conserved quantity = session credit COUNT: book (consume) then cancel (refund) leaves covered_sessions == sessions_remaining + sessions_used with sessions_used back to 0 and sessions_remaining back to 2."
        test_recipe:
          setup:
            - "Case with covered_sessions=2; a session booked then cancelled"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam17", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC P", npi: "1000000016" }, as: ProgramAdmin, captures: { cid: $.data.id } }
