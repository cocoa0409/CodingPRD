# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1716_livestream_creator_channel_monetization
# 9 rules x >=2 instances = 20 instances (rules 1, 3, 4, 7 carry 3).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: revenue_provisional_vs_final_rebate_cliff
        grounds: [calculations.net_revenue_recognition, entities.RevenueEvent.fields.net_cents]
        distinguishing_aspect: |
          Same three ingested events produce different net_cents under the two variants:
          provisional (plain fee) sums to 5439500, final (250bps rebate cliff, month gross
          6060000 >= 5000000) sums to 5591000 — a revenue-ledger domain variant pair.
        test_recipe:
          setup:
            - "Channel with VERIFIED W9 tax form; three August revenue events: SUBSCRIPTION 50000@4000bps, TIP 10000@500bps, SPONSORSHIP 6000000@1000bps, all PENDING with provisional nets 30000/9500/5400000"
            - "Clock advanced to 2026-09-01 so the August month settles at ops run"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "dv_rev", display_name: "DV Rev", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "DV Rev LLC", tax_id_last4: "1234", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "SUBSCRIPTION", gross_cents: 50000, platform_fee_bps: 4000, occurred_at: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { ev_sub: $.data.id }
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 10000, platform_fee_bps: 500, occurred_at: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { ev_tip: $.data.id }
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "SPONSORSHIP", gross_cents: 6000000, platform_fee_bps: 1000, occurred_at: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { ev_spo: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/ops/run"
              as: PlatformAdmin
            - call: "GET /api/revenue-events/${ev_sub}"
              as: PlatformAdmin
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { ch_payable: $.data.balance_payable_cents }
          assert:
            - "pre-settle provisional nets were 30000, 9500, 5400000 (sum 5439500)"
            - "RevenueEvent.${ev_sub}.net_cents == 31250 (final, rebate applied: 50000*0.625)"
            - "TIP event final net_cents == 9750 (10000*0.975) and SPONSORSHIP final net_cents == 5550000 (6000000*0.925)"
            - "Channel.${ch_id}.balance_payable_cents == 5591000 (final sum), not 5439500 (provisional sum) — identical inputs, divergent variants"

      - name: strike_weight_hard_window_vs_projected_decay
        grounds: [calculations.strike_weight, entities.Channel.fields.projected_strike_weight, entities.Channel.fields.monetization_posture]
        distinguishing_aspect: |
          Compliance-domain variant pair: the canonical hard-window weight drops to exactly 0 at
          the 90-day expiry (posture recovers), while the projected_decay variant over the same
          strike set yields 0.1221 at day 91 — same data, different numbers, different entity
          domain (ContentStrike) than revenue_provisional_vs_final_rebate_cliff (RevenueEvent).
        test_recipe:
          setup:
            - "Channel with VERIFIED W9 (posture STANDARD); one MINOR strike issued at 2026-08-01T00:00:00Z (weight 1, expires_at 2026-10-30T00:00:00Z)"
            - "Clock at 2026-10-31T00:00:00Z (strike age 91 days, past expiry); ops run executed"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "dv_strike", display_name: "DV Strike", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "DV Strike LLC", tax_id_last4: "1234", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/strikes"
              payload: { policy_code: "COPYRIGHT", severity: "MINOR", evidence_ref: "vod://1" }
              as: TrustAgent
              as_user_id: "trust_nina"
              captures: { st_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
          trigger:
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { ch_posture: $.data.monetization_posture, ch_proj: $.data.projected_strike_weight }
            - call: "GET /api/channels/${ch_id}/strikes"
              as: TrustAgent
          assert:
            - "ContentStrike.${st_id}.strike_status == EXPIRED (hard window: expired at 2026-10-30)"
            - "Channel.${ch_id}.monetization_posture == STANDARD (canonical weight == 0)"
            - "Channel.${ch_id}.active_strike_count == 0"
            - "Channel.${ch_id}.projected_strike_weight == 0.1221 (1 * 2^(-91/30), 4dp) — nonzero where canonical is 0"
      - name: payout_fee_tier_provisional_vs_final_context
        grounds: [calculations.payout_settlement, calculations.withholding_per_event]
        distinguishing_aspect: |
          Second revenue-domain divergence axis: the W9-vs-W8 withholding variant of the same
          swept event set changes the fee-tier snapshot — same events, W8 channel sweeps
          amount_cents 3913700 (post-1677300 withholding) while a W9 channel over identical
          events sweeps 5591000; both are 'final' contexts with different valid totals.
        test_recipe:
          setup:
            - "Channel with VERIFIED W8BEN tax form; August events SUBSCRIPTION 50000@4000, TIP 10000@500, SPONSORSHIP 6000000@1000 settled CLEARED (final nets 31250/9750/5550000)"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "dv_w8", display_name: "DV W8", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W8BEN", legal_name: "DV W8 Intl", tax_id_last4: "9999", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "SUBSCRIPTION", gross_cents: 50000, platform_fee_bps: 4000, occurred_at: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 10000, platform_fee_bps: 500, occurred_at: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "SPONSORSHIP", gross_cents: 6000000, platform_fee_bps: 1000, occurred_at: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels/${ch_id}/payouts"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { p_id: $.data.id }
          assert:
            - "Payout.${p_id}.withholding_cents == 1677300 (9375+2925+1665000, per-event rounding then sum)"
            - "Payout.${p_id}.amount_cents == 3913700 (5591000 - 1677300)"
            - "Payout.${p_id}.fee_cents == 9784 (snapshot >= 1000000 -> 25bps; round_half_up(3913700*0.0025)=round_half_up(9784.25))"
            - "Payout.${p_id}.net_transfer_cents == 3903916"
            - "Payout.${p_id}.settled_event_count == 3"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: withholding_round_per_event_then_sum
        grounds: [calculations.withholding_per_event]
        distinguishing_aspect: |
          Mode (b) nested rounding: 3 events of net 1111 each give per-event withholding
          round_half_up(333.3)=333, summed to 999 — the alternative sum-then-round order would
          give round_half_up(999.9)=1000; the scaffold pins per-event-then-sum.
        test_recipe:
          setup:
            - "W8BEN-verified channel; three August TIP events of gross 1111 @ 0bps each settled CLEARED (net 1111 each)"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "cf_round", display_name: "CF Round", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W8BEN", legal_name: "CF Round Intl", tax_id_last4: "8888", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 1111, platform_fee_bps: 0, occurred_at: "2026-08-10T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 1111, platform_fee_bps: 0, occurred_at: "2026-08-10T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 1111, platform_fee_bps: 0, occurred_at: "2026-08-10T03:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels/${ch_id}/payouts"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { p_id: $.data.id }
          assert:
            - "Payout.${p_id}.withholding_cents == 999 (3 x 333, per-event rounding) — not 1000 (aggregate rounding)"
            - "Payout.${p_id}.amount_cents == 2334 (3333 - 999)"
            - "Payout.${p_id}.fee_cents == 23 (snapshot < 100000 -> 100bps; round_half_up(23.34))"
            - "Payout.${p_id}.net_transfer_cents == 2311"

      - name: payout_fee_tier_evaluation_order
        grounds: [calculations.payout_settlement, calculations.payout_threshold_gate]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order: the fee tier is keyed
          on the PRE-fee post-withholding snapshot, not on the net transfer — snapshot 3913700
          selects 25bps, fee 9784, net 3903916 (mode (c), distinct from the mode (b) rounding
          instance withholding_round_per_event_then_sum).
        test_recipe:
          setup:
            - "Identical to payout_fee_tier_provisional_vs_final_context: W8BEN channel, final nets 31250/9750/5550000 cleared (payable 5591000)"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "cf_order", display_name: "CF Order", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W8BEN", legal_name: "CF Order Intl", tax_id_last4: "7777", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "SUBSCRIPTION", gross_cents: 50000, platform_fee_bps: 4000, occurred_at: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 10000, platform_fee_bps: 500, occurred_at: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "SPONSORSHIP", gross_cents: 6000000, platform_fee_bps: 1000, occurred_at: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels/${ch_id}/payouts"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { p_id: $.data.id }
          assert:
            - "Payout.${p_id}.amount_cents == 3913700 (pre-fee snapshot after withholding)"
            - "Payout.${p_id}.fee_cents == 9784 — tier selected on amount_cents (>= 1000000 -> 25bps), NOT on net_transfer"
            - "Payout.${p_id}.net_transfer_cents == 3903916 (3903916 >= 1000000 too, so the order is pinned by construction: if the tier were keyed post-fee the rule would be circular)"

      - name: consistency_score_multi_input_nonlinear
        grounds: [calculations.consistency_score, entities.Channel.fields.consistency_score_bps]
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction (nested min/max, conditional
          vacuous-schedule branch): two ENDED streams (one on-time 60/60min, one 15min late
          30/60min) give attendance 1.0, punctuality_factor 0.75, duration_factor 0.75 ->
          8750bps; distinct mode from (b) and (c) instances.
        test_recipe:
          setup:
            - "Channel; stream S1 scheduled 2026-08-10 10:00-11:00 started on time ended after 60min; stream S2 scheduled 2026-08-12 10:00-11:00 started 15min late ended after 30min"
            - "Clock at 2026-08-13 inside the trailing 28-day window"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "cf_cons", display_name: "CF Cons", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "S1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s1: $.data.id }
            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "S2", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s2: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/streams/${s1}/transition"
              payload: { action: "START" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/streams/${s1}/transition"
              payload: { action: "END", peak_viewers: 100, avg_viewers: 80 }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T10:15:00Z" }
              as: PlatformAdmin
            - call: "POST /api/streams/${s2}/transition"
              payload: { action: "START" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T10:45:00Z" }
              as: PlatformAdmin
            - call: "POST /api/streams/${s2}/transition"
              payload: { action: "END", peak_viewers: 50, avg_viewers: 40 }
              as: Creator
              as_user_id: "${ch_id}"
          trigger:
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { ch_score: $.data.consistency_score_bps }
          assert:
            - "StreamSession.${s2}.punctuality_minutes_late == 15"
            - "Channel.${ch_id}.consistency_score_bps == 8750 (attendance 1.0 x (0.5 + 0.3*0.75 + 0.2*0.75))"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: payout_retry_cycle
        grounds: [state_machines.Payout.FAILED_to_SCHEDULED, state_machines.Payout.SCHEDULED_to_PROCESSING]
        distinguishing_aspect: |
          Cyclic machine on Payout: SCHEDULED->PROCESSING->FAILED->SCHEDULED loops with a
          retry_count cap of 3 — a cycle (not a linear pipeline) on the Payout entity.
        test_recipe:
          setup:
            - "W9-verified channel with payable 100000 (one TIP 100000@0bps cleared); payout opened (amount 100000, fee 500, net 99500), processed, settlement failed once"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "nl_pay", display_name: "NL Pay", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "NL Pay LLC", tax_id_last4: "1111", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 100000, platform_fee_bps: 0, occurred_at: "2026-08-03T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/payouts"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "PROCESS" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "SETTLE_FAILURE", failure_reason: "bank_reject" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "RETRY" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { p_retry: $.data.retry_count }
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "PROCESS" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "SETTLE_FAILURE", failure_reason: "bank_reject_2" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "RETRY" }
              as: Creator
              as_user_id: "${ch_id}"
          assert:
            - "After first RETRY: Payout.${p_id}.payout_status == SCHEDULED and retry_count == 1 (cycle FAILED->SCHEDULED traversed)"
            - "Second PROCESS succeeds from SCHEDULED (cycle re-enters PROCESSING), second SETTLE_FAILURE returns to FAILED"
            - "After second RETRY: payout_status == SCHEDULED and retry_count == 2"

      - name: deliverable_parallel_performance_disclosure_axes
        grounds: [state_machines.Deliverable.SCHEDULED_to_PERFORMED, state_machines.Deliverable.PERFORMED_to_VERIFIED]
        distinguishing_aspect: |
          Parallel state dimensions on Deliverable: performance_status (SCHEDULED->PERFORMED->
          VERIFIED) and disclosure_status (PENDING->DISCLOSED_ON_TIME) evolve independently on
          one row; VERIFY is blocked purely by the disclosure axis (ERR_DISCLOSURE_REQUIRED)
          while the performance axis stays PERFORMED — a non-linear shape distinct from the
          Payout retry cycle.
        test_recipe:
          setup:
            - "Channel STANDARD (W9 verified); deal PROPOSED->ACCEPTED->ACTIVE (flight 2026-08-05..2026-09-30); one deliverable due 2026-08-20; stream S scheduled+ended 2026-08-15 10:00-11:00; clock 2026-08-15T12:00:00Z"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "nl_del", display_name: "NL Del", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "NL Del LLC", tax_id_last4: "2222", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/deals"
