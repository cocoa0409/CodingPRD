      - name: restructure_execution_rejected_while_the_access_axis_is_degraded
        grounds:
          - state_machines.RenewalDecision.DECIDED_RESTRUCTURE_to_EXECUTED
          - state_machines.Subscription.CONFIGURED_to_DEGRADED
          - validations.priority_8_state_transition_guard
