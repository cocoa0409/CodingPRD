            - "Unit.${unit_id}.scheduled_hours_total == 11.5 and active_assignment_count == 1"

      - name: sweep_second_run_idempotent
        claim_type: idempotency
        grounds:
          - "endpoints"
          - "state_machines.StateLicense.ACTIVE_to_EXPIRED"
        distinguishing_aspect: "The expiry sweep is an idempotent ops-run checkpoint: a second sweep at the same clock expires nothing and cancels nothing (all summary counters 0)."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse with ACTIVE license expiring 2026-08-10; clock moves to 2026-08-11."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
