  - rule_id: compensating_invariant
    instances:
      - name: invariant_points_conserved_across_transfer_submit_and_rejection
        grounds:
          - state_machines.TransferRequest.SUBMITTED_to_HELD
          - state_machines.TransferRequest.HELD_to_REJECTED
          - entities.Account.fields.points_balance
          - entities.Account.fields.points_pending_redemption
          - calculations.available_points_for_redemption
        distinguishing_aspect: |
          Conserved quantity: the cardholder points total
          `Account.points_balance + Account.points_pending_redemption`, which must read exactly
          10000 before submission, during the hold, and after rejection. Submission moves 4000
          across the two terms via a TRANSFER_DEBIT entry and rejection moves it back via a
          TRANSFER_REVERSAL entry, so the two ledger rows sum to zero and no drift is left in
          either term.
        test_recipe:
          setup:
            - "One CORE account holding exactly 10000 points from a single 1000000-cent GROCERY transaction, posture CLEAR, no reservations."
            - "One ACTIVE PartnerAgreement with min_transfer_points 1000 and transfer_increment_points 1000."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Mira Delcourt", email: "mira@example.com", card_product_code: "CORE", enrolled_at: "2025-12-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements"
              payload: { partner_name: "Skyward Miles", partner_program_code: "SKYW", ratio_points_out: 1000, ratio_partner_units_in: 1000, min_transfer_points: 1000, transfer_increment_points: 1000, transfer_latency_hours: 48, reversal_window_hours: 72, settlement_cost_cents_per_1k: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 4000, expected_account_version: "${a_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /rewards/transfer-requests/${tr_id}/hold"
              payload: { hold_reason: "ATO_SUSPECTED" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
            - call: "POST /rewards/transfer-requests/${tr_id}/reject"
              payload: { resolution_reason: "CARDHOLDER_DENIED_REQUEST" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
          assert:
            - "immediately after submission Account.${a_id}.points_balance == 6000 and Account.${a_id}.points_pending_redemption == 4000, summing to 10000"
            - "immediately after the hold Account.${a_id}.points_balance == 6000 and Account.${a_id}.points_pending_redemption == 4000, summing to 10000"
            - "TransferRequest.${tr_id}.status == REJECTED"
            - "TransferRequest.${tr_id}.resolution_reason == CARDHOLDER_DENIED_REQUEST"
            - "Account.${a_id}.points_balance == 10000"
            - "Account.${a_id}.points_pending_redemption == 0"
            - "exactly one PointsLedgerEntry with entry_type TRANSFER_DEBIT and points_delta -4000 exists for account_id ${a_id}"
            - "exactly one PointsLedgerEntry with entry_type TRANSFER_REVERSAL and points_delta 4000 exists for account_id ${a_id}"
            - "Account.${a_id}.lifetime_points_earned == 10000"

      - name: invariant_agency_payable_conserved_across_ticket_settle_and_refund
        grounds:
          - state_machines.RedemptionOrder.CONFIRMED_to_TICKETED
          - state_machines.RedemptionOrder.AGENCY_INVOICED_to_SETTLED
          - state_machines.RedemptionOrder.TICKETED_to_REFUNDED
          - entities.TravelAgencyPartner.fields.payable_cents
          - calculations.redemption_issuer_cost
        distinguishing_aspect: |
          A conserved quantity of a different type: agency cash owed, `TravelAgencyPartner.payable_cents`
          in cents rather than cardholder points. The forward path credits the provisional 36000
          and then trues it up by +500 to the final 36500; the compensating refund must subtract
          exactly the amount that was actually credited (36500, the settled figure, not the 36000
          provisional), returning payable_cents to exactly 0 with no half-cent of drift.
        test_recipe:
          setup:
            - "One PREMIER account holding 72000 points from a single 1600000-cent DINING transaction."
            - "One ACTIVE agency with payable_cents 0, markup 2000 bps, tolerance 1000 bps."
            - "One OPEN, IN_PARITY offer: net_rate_cents 40000, agency_public_price_cents 50000, agency_public_seats 3, portal_seats 2, tax_cents 4000, so portal_price_cents is 48000, cash_copay_cents 4000 and points_debited 35200."
            - "One CONFIRMED order on that offer."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5812", display_name: "Restaurants", base_category: "DINING", base_multiplier: 3.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Sasha Belanger", email: "sasha@example.com", card_product_code: "PREMIER", enrolled_at: "2024-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5812", amount_cents: 1600000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Northwind Travel", contracted_markup_bps: 2000, parity_tolerance_bps: 1000, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "SFO-AMS-05", depart_at: "2026-10-18T15:00:00Z", return_at: "2026-11-01T07:00:00Z", net_rate_cents: 40000, agency_public_price_cents: 50000, agency_public_seats: 3, portal_seats: 2, tax_cents: 4000 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Sasha Belanger", expected_offer_version: "${o_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /rewards/redemption-orders/${ro_id}/confirm"
              as: Cardholder
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /rewards/redemption-orders/${ro_id}/ticket"
              payload: { ticket_number: "TKT-90021" }
              as: AgencySupplier
              as_user_id: "${ag_id}"
            - call: "POST /rewards/redemption-orders/${ro_id}/settle"
              payload: { invoice_amount_cents: 41000, settlement_adjustment_cents: -500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/redemption-orders/${ro_id}/refund"
              payload: { closed_reason: "AIRLINE_CANCELLED_ROUTE" }
              as: AgencySupplier
              as_user_id: "${ag_id}"
          assert:
            - "immediately after ticketing TravelAgencyPartner.${ag_id}.payable_cents == 36000"
            - "immediately after settlement TravelAgencyPartner.${ag_id}.payable_cents == 36500"
            - "RedemptionOrder.${ro_id}.issuer_cost_provisional_cents == 36000"
            - "RedemptionOrder.${ro_id}.issuer_cost_final_cents == 36500"
            - "RedemptionOrder.${ro_id}.cost_per_1k_provisional_cents == 1023"
            - "RedemptionOrder.${ro_id}.cost_per_1k_final_cents == 1037"
            - "RedemptionOrder.${ro_id}.fulfillment_status == REFUNDED"
            - "RedemptionOrder.${ro_id}.settlement_status == CLAWED_BACK"
            - "TravelAgencyPartner.${ag_id}.payable_cents == 0"
            - "Account.${a_id}.points_balance == 72000"
            - "Account.${a_id}.points_pending_redemption == 0"
            - "PortalInventoryOffer.${o_id}.seats_committed == 0"
