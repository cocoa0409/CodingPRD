# =============================================================================
# §1.8 Scaffold Difficulty Design — Trademark Watch & Enforcement
# Test Targeting Index: 2+ instances per §0.5 rule; every recipe replayable
# from empty-DB via §1.5 endpoints only.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: WatchAlert vs Deadline)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_assessed_confusion_score
        grounds:
          - calculations.confusion_score
          - entities.WatchAlert.fields.provisional_score
          - entities.WatchAlert.fields.final_score
        distinguishing_aspect: |
          Same similarity triple (80, 70, 60) yields provisional_score 73.00 under the
          fixed 0.5/0.3/0.2 intake weights but final_score 80.00 under attorney weights
          0.6/0.3/0.1 with fame_adjustment +5 — two valid variants on the SAME alert in
          the WatchAlert domain produce different numbers (the paired instance
          calendar_rollforward_vs_business_day_deadline covers the Deadline domain).
        test_recipe:
          setup:
            - "Client exists; TrademarkRecord PUBLISHED; one WatchAlert with similarity_mark 80, similarity_goods 70, similarity_channels 60"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id, prov_score: $.data.provisional_score }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
          trigger:
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "famous mark in class 9", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
          assert:
            - "WatchAlert.${alert_id}.provisional_score == 73.00 (0.5*80 + 0.3*70 + 0.2*60)"
            - "WatchAlert.${alert_id}.provisional_tier == HIGH"
            - "WatchAlert.${alert_id}.final_score == 80.00 (0.6*80 + 0.3*70 + 0.1*60 = 75.00, + 5 fame)"
            - "WatchAlert.${alert_id}.final_tier == HIGH"
            - "WatchAlert.${alert_id}.assessment_round == 1"
            - "provisional_score (73.00) != final_score (80.00) for identical similarity inputs"

      - name: calendar_rollforward_vs_business_day_deadline
        grounds:
          - calculations.deadline_due_at
          - entities.Deadline.fields.computation_variant
          - entities.Deadline.fields.computed_due_at
        distinguishing_aspect: |
          Identical basis_date 2026-08-07T09:00:00Z (a Friday) and offset_days 5 produce
          computed_due_at 2026-08-12T09:00:00Z under CALENDAR_ROLL_FORWARD (OPPOSITION_WINDOW)
          but 2026-08-14T09:00:00Z under BUSINESS_DAY_COUNT (RESPONSE_DUE) — two valid
          variants on Deadline, a different entity domain than the WatchAlert score pairing.
        test_recipe:
          setup:
            - "Client, PUBLISHED record, and an ESCALATED INFRINGEMENT matter exist (alert assessed to 80.00 first)"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              captures: { matter_id: $.data.id }
          trigger:
            - call: "POST /brand/enforcement-matters/${matter_id}/deadlines"
              payload: { deadline_type: OPPOSITION_WINDOW, statutory_basis: "15 USC 1063", basis_date: "2026-08-07T09:00:00Z", offset_days: 5 }
              as: Paralegal
              captures: { dl_cal_id: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/deadlines"
              payload: { deadline_type: RESPONSE_DUE, statutory_basis: "37 CFR 2.196", basis_date: "2026-08-07T09:00:00Z", offset_days: 5 }
              as: Paralegal
              captures: { dl_biz_id: $.data.id }
          assert:
            - "Deadline.${dl_cal_id}.computation_variant == CALENDAR_ROLL_FORWARD"
            - "Deadline.${dl_cal_id}.computed_due_at == 2026-08-12T09:00:00Z (calendar +5 lands Wednesday, no roll needed)"
            - "Deadline.${dl_biz_id}.computation_variant == BUSINESS_DAY_COUNT"
            - "Deadline.${dl_biz_id}.computed_due_at == 2026-08-14T09:00:00Z (business days Aug 10,11,12,13,14; weekend skipped)"
            - "Deadline.${dl_cal_id}.computed_due_at != Deadline.${dl_biz_id}.computed_due_at for identical basis and offset"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a), (b), (c) — all distinct)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: confusion_score_identical_presumption_floor
        grounds:
          - calculations.confusion_score
          - entities.WatchAlert.fields.provisional_tier
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — the conditional
          identical-presumption branch (similarity_mark >= 90 AND similarity_goods >= 90)
          engages a max() floor that lifts the raw weighted sum 72.00 to 85.00 for input
          (90, 90, 0), flipping the tier from what the bare weighted formula would give.
        test_recipe:
          setup:
            - "Client and PUBLISHED record exist"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
          trigger:
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "ACME", conflicting_owner: "Clone Co", conflicting_classes: [9], similarity_mark: 90, similarity_goods: 90, similarity_channels: 0 }
              as: WatchService
              captures: { alert_id: $.data.id }
          assert:
            - "WatchAlert.${alert_id}.provisional_score == 85.00 (raw weighted sum 0.5*90+0.3*90+0.2*0 == 72.00 lifted by the max(., 85) floor branch)"
            - "WatchAlert.${alert_id}.provisional_tier == HIGH (85.00 >= 70)"
            - "72.00 (branch-free formula result) != 85.00 (floored result) — the conditional branch changed the output"

      - name: counterfeit_damages_per_line_rounding
        grounds:
          - calculations.counterfeit_damages
          - entities.CounterfeitReferral.fields.estimated_damages_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — per-line round_half_up(units x
          unit_value_cents x 1.5) then sum yields 2002 for lines [{3, 333}, {1, 335}];
          the forbidden sum-then-round order yields 2001 for the same inputs.
        test_recipe:
          setup:
            - "Client, PUBLISHED record, TRIAGED alert with confirmed_counterfeit_count == 3 (three COUNTERFEIT takedown filings REMOVED)"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: MARKETPLACE_SWEEP, conflicting_mark_text: "ACME", conflicting_owner: "FakeShop", conflicting_classes: [25], similarity_mark: 95, similarity_goods: 92, similarity_channels: 80 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
            - call: "POST /brand/watch-alerts/${alert_id}/takedown-filings"
              payload: { platform: META, listing_url: "https://meta.example/shop/1", basis: COUNTERFEIT }
              as: Paralegal
              captures: { tf1: $.data.id }
            - call: "POST /brand/takedown-filings/${tf1}/file"
              as: Paralegal
            - call: "POST /brand/takedown-filings/${tf1}/platform-response"
              payload: { outcome: REMOVED }
              as: Paralegal
            - call: "POST /brand/watch-alerts/${alert_id}/takedown-filings"
              payload: { platform: META, listing_url: "https://meta.example/shop/2", basis: COUNTERFEIT }
              as: Paralegal
              captures: { tf2: $.data.id }
            - call: "POST /brand/takedown-filings/${tf2}/file"
              as: Paralegal
            - call: "POST /brand/takedown-filings/${tf2}/platform-response"
              payload: { outcome: REMOVED }
              as: Paralegal
            - call: "POST /brand/watch-alerts/${alert_id}/takedown-filings"
              payload: { platform: META, listing_url: "https://meta.example/shop/3", basis: COUNTERFEIT }
              as: Paralegal
              captures: { tf3: $.data.id }
            - call: "POST /brand/takedown-filings/${tf3}/file"
              as: Paralegal
            - call: "POST /brand/takedown-filings/${tf3}/platform-response"
              payload: { outcome: REMOVED }
              as: Paralegal
          trigger:
            - call: "POST /brand/watch-alerts/${alert_id}/counterfeit-referrals"
              payload: { referral_channel: LAW_ENFORCEMENT, seizure_lines: [{ units: 3, unit_value_cents: 333 }, { units: 1, unit_value_cents: 335 }] }
              as: AssociateAttorney
              captures: { ref_id: $.data.id }
          assert:
            - "CounterfeitReferral.${ref_id}.estimated_damages_cents == 2002 (line 1: round_half_up(3*333*1.5) == 1499; line 2: round_half_up(1*335*1.5) == 503; 1499 + 503)"
            - "2002 != 2001, the value the forbidden sum-then-round order would produce"
            - "CounterfeitReferral.${ref_id}.auto_created == false"
            - "CounterfeitReferral.${ref_id}.status == DRAFT"

      - name: maintenance_fee_band_pinned_to_base_not_total
        grounds:
          - calculations.maintenance_filing_fee
          - entities.MaintenanceFiling.fields.fee_total_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation order —
          the surcharge band is derived from fee_base_cents ONLY (never recomputed from
          the total), so a 5-class record (base 200000, STANDARD band) totals 220000
          while a 6-class record (base 240000, exactly at BAND_HIGH_MIN_CENTS, HIGH band)
          totals 300000; recomputing the band from the total would be circular.
        test_recipe:
          setup:
            - "Client with two REGISTERED records: one with 5 Nice classes, one with 6"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "FIVE", mark_type: WORD, jurisdiction: "US", nice_classes: [1, 2, 3, 4, 5], application_number: "US-905" }
              as: Paralegal
              captures: { rec5_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec5_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec5_id}/register"
              payload: { registration_date: "2026-08-10T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "SIX", mark_type: WORD, jurisdiction: "US", nice_classes: [1, 2, 3, 4, 5, 6], application_number: "US-906" }
              as: Paralegal
              captures: { rec6_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec6_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec6_id}/register"
              payload: { registration_date: "2026-08-10T00:00:00Z" }
              as: Paralegal
          trigger:
            - call: "POST /brand/trademark-records/${rec5_id}/maintenance-filings"
              payload: { filing_type: SECTION_8, evidence_item_ids: [] }
              as: Paralegal
              captures: { fil5_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec6_id}/maintenance-filings"
              payload: { filing_type: SECTION_8, evidence_item_ids: [] }
              as: Paralegal
              captures: { fil6_id: $.data.id }
          assert:
            - "MaintenanceFiling.${fil5_id}.fee_base_cents == 200000 (5 x 40000)"
            - "MaintenanceFiling.${fil5_id}.fee_surcharge_cents == 20000 (STANDARD band: 200000 < 240000; 10% of base)"
            - "MaintenanceFiling.${fil5_id}.fee_total_cents == 220000"
            - "MaintenanceFiling.${fil6_id}.fee_base_cents == 240000 (6 x 40000)"
            - "MaintenanceFiling.${fil6_id}.fee_surcharge_cents == 60000 (HIGH band: base >= 240000 boundary inclusive; 25% of base)"
            - "MaintenanceFiling.${fil6_id}.fee_total_cents == 300000"
            - "MaintenanceFiling.${fil6_id}.late_fee_cents == 0 and MaintenanceFiling.${fil5_id}.late_fee_cents == 0 at PREPARED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cyclic, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: coexistence_propose_counter_cycle
        grounds:
          - state_machines.CoexistenceAgreement.COUNTERED_to_PROPOSED
          - state_machines.CoexistenceAgreement.PROPOSED_to_COUNTERED
        distinguishing_aspect: |
          CoexistenceAgreement cycles PROPOSED -> COUNTERED -> PROPOSED (negotiation
          rounds) before reaching EXECUTED — a genuine A->B->A loop on the agreement
          entity, distinct from the letter reissue loop.
        test_recipe:
          setup:
            - "Client and PUBLISHED record exist; one DRAFT agreement on the record"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec_id}/coexistence-agreements"
              payload: { counterparty_name: "Rival Co", territory_codes: ["US"], effective_start: "2026-09-01T00:00:00Z", effective_end: "2027-09-01T00:00:00Z" }
              as: AssociateAttorney
              captures: { agr_id: $.data.id, agr_v: $.data.version }
          trigger:
            - call: "POST /brand/coexistence-agreements/${agr_id}/propose"
              payload: { terms_text: "round 1 terms", expected_agreement_version: "${agr_v}" }
              as: AssociateAttorney
            - call: "POST /brand/coexistence-agreements/${agr_id}/counter"
              payload: { counter_terms_text: "counterparty counter" }
              as: AssociateAttorney
              captures: { agr_v2: $.data.version }
            - call: "POST /brand/coexistence-agreements/${agr_id}/propose"
              payload: { terms_text: "round 3 amended terms", expected_agreement_version: "${agr_v2}" }
              as: AssociateAttorney
              captures: { agr_v3: $.data.version }
            - call: "POST /brand/coexistence-agreements/${agr_id}/execute"
              as: PartnerAttorney
          assert:
            - "After first propose: status == PROPOSED and round_count == 1"
            - "After counter: status == COUNTERED and round_count == 2"
            - "After second propose: status == PROPOSED again (cycle revisited) and round_count == 3"
            - "CoexistenceAgreement.${agr_id}.current_terms_text == 'round 3 amended terms'"
            - "After execute: status == EXECUTED"

      - name: letter_sendback_and_reissue_cycles
        grounds:
          - state_machines.CeaseDesistLetter.PENDING_REVIEW_to_DRAFT
          - state_machines.CeaseDesistLetter.NEGOTIATING_to_ISSUED
        distinguishing_aspect: |
          CeaseDesistLetter exhibits two distinct loops on one entity: the
          DRAFT -> PENDING_REVIEW -> DRAFT send-back loop and the
          ISSUED -> NEGOTIATING -> ISSUED reissue loop, with reissue_count tracking
          traversals — a different entity than the agreement negotiation cycle.
        test_recipe:
          setup:
            - "Client (budget 1000000), PUBLISHED record, ESCALATED INFRINGEMENT matter; letter drafted by assoc_1"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              captures: { matter_id: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/cease-desist-letters"
              payload: { demand_type: CEASE_USE, recipient_name: "Rival Co", recipient_address: "1 Rival Way", response_due_days: 14 }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { letter_id: $.data.id }
          trigger:
            - call: "POST /brand/cease-desist-letters/${letter_id}/submit-review"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/approve"
              payload: { decision: SENT_BACK }
              as: PartnerAttorney
              as_user_id: partner_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/submit-review"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/approve"
              payload: { decision: APPROVED }
              as: PartnerAttorney
              as_user_id: partner_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/issue"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/record-response"
              payload: { response_outcome: NEGOTIATION_STARTED }
              as: Paralegal
            - call: "POST /brand/cease-desist-letters/${letter_id}/reissue"
              payload: { response_due_days: 10 }
              as: AssociateAttorney
              as_user_id: assoc_1
          assert:
            - "SENT_BACK traversed PENDING_REVIEW -> DRAFT (send-back loop) and the second submit-review succeeded"
            - "After reissue: CeaseDesistLetter.${letter_id}.status == ISSUED (NEGOTIATING -> ISSUED cycle revisited)"
            - "CeaseDesistLetter.${letter_id}.reissue_count == 1"
            - "CeaseDesistLetter.${letter_id}.response_due_at == 2026-08-14T00:00:00Z (issued at default clock 2026-08-01T00:00:00Z + 10 business days: Aug 3-7, 10-14)"
            - "Client.${client_id}.budget_spent_cents == 100000 (75000 issue + 25000 reissue)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: breach_reopen_reissue_redocket_cascade
        grounds:
          - state_machines.CoexistenceAgreement.MONITORING_to_BREACH_ALLEGED
          - state_machines.EnforcementMatter.RESOLVED_to_ACTIVE
          - state_machines.CeaseDesistLetter.COMPLIED_to_ISSUED
        distinguishing_aspect: |
          Depth-3 chain from the breach trigger: agreement breach (link 1) reopens the
          RESOLVED matter; the matter reopening (link 2) reissues its COMPLIED letter;
          each letter reissue (link 3) auto-dockets a fresh DOCKETED response Deadline.
          Each hop is caused by the previous hop, not by the breach call directly.
        test_recipe:
          setup:
            - "Client (budget 1000000); PUBLISHED record; ESCALATED INFRINGEMENT matter; letter ISSUED then COMPLIED; the auto-docketed response deadline verified+satisfied; agreement EXECUTED->MONITORING linked to the matter; matter RESOLVED (SETTLED)"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
