scenario: |
  2730. Union Representation Election Response (employer labor relations team): petition receipt with
  bargaining unit scope analysis and community-of-interest arguments, showing-of-interest verification
  and election agreement versus hearing decisions, eligible voter list preparation with statutory content
  and deadlines, supervisor training on lawful communication boundaries and prohibited conduct, campaign
  communication planning with factual accuracy review, election logistics including voting method,
  observers and challenged ballots, objections to conduct affecting results and unfair labor practice
  charge defense, certification outcome with bargaining obligation onset or decertification implications
domain_name: union-representation-election-response
api_prefix: /labor-relations

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection under the `/labor-relations` namespace and links by FK
  # (`/labor-relations/voter-lists/{id}`, `/labor-relations/challenged-ballots/{id}`). No entity id is
  # nested inside another entity's path segment, so no ownership chain is expressible in the URL — every
  # parent/child relationship must be validated from FK fields in the body.

  state_machine_shape: cyclic
  # Petition.case_status loops TALLY_POSTED -> OBJECTIONS_PENDING -> RERUN_DIRECTED -> ELECTION_SET, and
  # Petition carries a second independent dimension (case_posture) driven by ULP charges. VoterList loops
  # SUBMITTED -> DEFICIENT -> SUBMITTED, CampaignCommunication loops DRAFT -> PENDING_LEGAL_REVIEW ->
  # REVISION_REQUIRED -> DRAFT, Supervisor loops UNTRAINED -> TRAINED -> UNTRAINED.

  relationship_patterns:
    - one_to_many
    - self_referential      # ElectionRound.prior_round_id -> ElectionRound.id (rerun chain)
    - cross_aggregate       # ChallengedBallot.voter_list_entry_id crosses the voter-list aggregate into the poll aggregate
    - polymorphic_party     # filed_by_party / charging_party / challenger_party select the acting side without a party entity

  role_model: segregation_of_duties
  # The user who authored a CampaignCommunication may never be the user who clears it in legal review,
  # even when both act under the EmploymentCounsel role. Layered on top of peer role ownership
  # (HRDataAnalyst owns list data, SupervisorTrainer owns training, BoardAgent owns Board-side rulings).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Petition
    parent: null
    common_fields: true
    fields:
      - name: case_number
        type: string
        source: input
        description: "Board docket number, e.g. 07-RC-330011"
        constraints: "unique across all Petition rows; violation -> ERR_DUPLICATE_CASE_NUMBER"
      - name: petition_type
        type: enum
        source: input
        description: "RC = union-filed certification, RM = employer-filed, RD = decertification"
        constraints: "one of {RC, RM, RD}"
      - name: union_name
        type: string
        source: input
        description: "Petitioning labor organization"
      - name: filed_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the petition was docketed"
      - name: proposed_unit_description
        type: string
        source: input
        description: "Unit description exactly as the petition words it"
      - name: claimed_employee_count
        type: integer
        source: input
        description: "Headcount the petitioner claims is in the unit"
        constraints: ">= 1"
      - name: payroll_period_end
        type: string
        source: input
        description: "Last day (YYYY-MM-DD) of the payroll period that fixes voter eligibility"
      - name: case_status
        type: enum
        source: computed
        description: "Primary case lifecycle dimension"
        default: RECEIVED
        constraints: "one of {RECEIVED, SCOPE_ANALYSIS, SOI_VERIFIED, ELECTION_SET, VOTING_CLOSED, TALLY_POSTED, OBJECTIONS_PENDING, RERUN_DIRECTED, CERTIFIED, DISMISSED}"
      - name: case_posture
        type: enum
        source: computed
        description: "Second, independent dimension driven only by ULPCharge rows; gates child write operations"
        default: OPEN
        constraints: "one of {OPEN, BLOCKED, IMPOUNDED}"
      - name: total_classified_headcount
        type: integer
        source: computed
        description: "Sum of Classification.headcount over every Classification with this petition_id"
        default: 0
      - name: included_headcount
        type: integer
        source: computed
        description: "Sum of Classification.headcount where scope_ruling == INCLUDED"
        default: 0
      - name: excluded_headcount
        type: integer
        source: computed
        description: "Sum of Classification.headcount where scope_ruling == EXCLUDED"
        default: 0
      - name: pending_headcount
        type: integer
        source: computed
        description: "Sum of Classification.headcount where scope_ruling IN {PENDING, MOOT}"
        default: 0
      - name: core_avg_hourly_wage_cents
        type: integer
        source: computed
        description: "Frozen weighted-average wage of the undisputed core group; written once by core_wage_snapshot"
      - name: core_wage_locked_at
        type: datetime
        source: computed
        description: "Instant core_avg_hourly_wage_cents was frozen; null until the first Classification score call"
      - name: submitted_card_count
        type: integer
        source: input
        description: "Authorization cards the petitioner submitted, as recorded at showing-of-interest verification"
        default: 0
      - name: duplicate_card_count
        type: integer
        source: input
        description: "Cards struck as duplicate signatures"
        default: 0
      - name: undated_card_count
        type: integer
        source: input
        description: "Cards struck for missing signature date"
        default: 0
      - name: stale_card_count
        type: integer
        source: input
        description: "Cards struck because signed more than 6 months before filed_date"
        default: 0
      - name: nonunit_card_count
        type: integer
        source: input
        description: "Cards struck because the signer sits in a classification outside the counted unit"
        default: 0
      - name: valid_card_count
        type: integer
        source: computed
        description: "submitted_card_count minus the four struck-card counts; output of showing_of_interest_ratio"
      - name: showing_of_interest_pct
        type: number
        source: computed
        description: "Percentage of the counted unit that signed a valid card, 2 decimals"
      - name: showing_headcount_basis
        type: enum
        source: computed
        description: "Denominator variant used by the most recent verification"
        constraints: "one of {AS_PETITIONED, AS_RULED}"
      - name: showing_verdict
        type: enum
        source: computed
        description: "Sufficiency verdict from showing_of_interest_ratio"
        default: PENDING
        constraints: "one of {PENDING, SUFFICIENT, INSUFFICIENT}"
      - name: retraining_required
        type: boolean
        source: computed
        description: "Set true when any Supervisor on this petition loses certification for substantiated conduct"
        default: false
      - name: certification_outcome
        type: enum
        source: computed
        description: "Certification issued at the close of the case"
        default: NONE
        constraints: "one of {NONE, CERTIFICATION_OF_REPRESENTATIVE, CERTIFICATION_OF_RESULTS}"
      - name: certified_at
        type: datetime
        source: computed
        description: "Instant the certification issued; null before certification"
      - name: certified_round_id
        type: string
        source: computed
        description: "FK -> ElectionRound.id; the round whose revised tally the certification rests on, null before certification"
      - name: bargaining_obligation_start_at
        type: datetime
        source: computed
        description: "Onset of the duty to bargain; non-null only for CERTIFICATION_OF_REPRESENTATIVE"
      - name: bargaining_obligation_end_at
        type: datetime
        source: computed
        description: "Termination of an existing bargaining duty; non-null only when an RD petition ends in CERTIFICATION_OF_RESULTS"
      - name: certification_year_end_at
        type: datetime
        source: computed
        description: "End of the insulated certification year; non-null only for CERTIFICATION_OF_REPRESENTATIVE"
      - name: election_bar_end_at
        type: datetime
        source: computed
        description: "End of the 12-month election bar; non-null only for CERTIFICATION_OF_RESULTS"
      - name: decert_window_open_at
        type: datetime
        source: computed
        description: "First instant a decertification petition may be filed; non-null only for CERTIFICATION_OF_REPRESENTATIVE"
      - name: notice_posting_end_at
        type: datetime
        source: computed
        description: "End of a ULP settlement notice-posting period; blocks certification while in the future"
      - name: pending_objection_count
        type: integer
        source: computed
        description: "Count of Objection rows on this petition's rounds with status == FILED"
        default: 0
      - name: blocking_charge_count
        type: integer
        source: computed
        description: "Count of ULPCharge rows with blocking_requested == true and status IN {FILED, MERIT_FOUND}"
        default: 0

  - name: Classification
    parent: null
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; the case whose unit scope this classification is argued in"
      - name: code
        type: string
        source: input
        description: "Employer job-classification code"
        constraints: "unique per petition_id; violation -> ERR_DUPLICATE_CLASSIFICATION_CODE"
      - name: title
        type: string
        source: input
        description: "Job title as it appears on the payroll"
      - name: headcount
        type: integer
        source: input
        description: "Employees currently in this classification"
        constraints: ">= 1"
      - name: avg_hourly_wage_cents
        type: integer
        source: input
        description: "Average straight-time hourly wage in cents"
        constraints: ">= 1"
      - name: shift_code
        type: string
        source: input
        description: "Primary shift designation"
      - name: work_location
        type: string
        source: input
        description: "Primary work location code"
      - name: supervisory_authority_count
        type: integer
        source: input
        description: "Number of Section 2(11) indicia (hire, fire, discipline, assign, ...) this classification exercises"
        default: 0
        constraints: ">= 0; >= 1 forces MANDATORY_EXCLUSION"
      - name: employer_position
        type: enum
        source: input
        description: "Employer's asserted scope position"
        constraints: "one of {INCLUDE, EXCLUDE}"
      - name: union_position
        type: enum
        source: input
        description: "Petitioner's asserted scope position"
        constraints: "one of {INCLUDE, EXCLUDE}"
      - name: supervision_overlap
        type: integer
        source: input
        description: "Community-of-interest factor: shared supervision, 0-100"
        constraints: "0 <= value <= 100"
      - name: skills_overlap
        type: integer
        source: input
        description: "Community-of-interest factor: shared skills and training, 0-100"
        constraints: "0 <= value <= 100"
      - name: functional_integration
        type: integer
        source: input
        description: "Community-of-interest factor: functional integration of work, 0-100"
        constraints: "0 <= value <= 100"
      - name: interchange_rate
        type: integer
        source: input
        description: "Community-of-interest factor: employee interchange, 0-100"
        constraints: "0 <= value <= 100"
      - name: work_conditions_overlap
        type: integer
        source: input
        description: "Community-of-interest factor: similarity of working conditions, 0-100"
        constraints: "0 <= value <= 100"
      - name: wage_proximity
        type: number
        source: computed
        description: "Derived factor: 100 minus the capped percentage distance from Petition.core_avg_hourly_wage_cents, 2 decimals"
      - name: coi_score
        type: number
        source: computed
        description: "Weighted community-of-interest score, 2 decimals; null until scored"
      - name: scoring_standard
        type: enum
        source: computed
        description: "Mode selector echoed from the most recent scoring call; picks the formula shape AND the recommendation bands"
        constraints: "one of {TRADITIONAL, OVERWHELMING, ACCRETION}"
      - name: coi_recommendation
        type: enum
        source: computed
        description: "Verdict from community_of_interest_score; null until scored"
        constraints: "one of {SHARED_COMMUNITY, CONTESTED_COMMUNITY, DISTINCT_COMMUNITY, MANDATORY_EXCLUSION}"
      - name: scope_ruling
        type: enum
        source: computed
        description: "Board ruling on inclusion in the voting unit"
        default: PENDING
        constraints: "one of {PENDING, INCLUDED, EXCLUDED, MOOT}"
      - name: ruling_rationale
        type: string
        source: computed
        description: "Rationale text recorded with the ruling; null while PENDING"

  - name: ElectionAgreement
    parent: null
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; the case this election arrangement belongs to"
      - name: agreement_type
        type: enum
        source: input
        description: "Form of election arrangement the employer proposes"
        constraints: "one of {STIPULATED, CONSENT}"
      - name: proposed_election_date
        type: string
        source: input
        description: "Election date (YYYY-MM-DD) the employer proposes"
      - name: proposed_voting_method
        type: enum
        source: input
        description: "Voting method the employer proposes"
        constraints: "one of {MANUAL, MAIL, MIXED}"
      - name: status
        type: enum
        source: computed
        description: "Agreement lifecycle; the branch point between a stipulated election and a directed election"
        default: PROPOSED
        constraints: "one of {PROPOSED, STIPULATED_APPROVED, HEARING_REQUESTED, DIRECTED, VOID}"
      - name: route
        type: enum
        source: computed
        description: "Which branch actually produced the election"
        default: PENDING
        constraints: "one of {PENDING, STIPULATED, DIRECTED}"
      - name: approved_election_date
        type: string
        source: computed
        description: "Election date fixed by approval or by direction of election"
      - name: voting_method
        type: enum
        source: computed
        description: "Voting method fixed by approval or by direction of election"
        constraints: "one of {MANUAL, MAIL, MIXED}"
      - name: polls_open_at
        type: datetime
        source: computed
        description: "First instant polls may open for the election this agreement produced"
      - name: polls_close_at
        type: datetime
        source: computed
        description: "Last instant polls may remain open"
      - name: hearing_requested_at
        type: datetime
        source: computed
        description: "Instant a pre-election hearing was demanded; null on the stipulated branch"
      - name: hearing_requested_by_party
        type: enum
        source: computed
        description: "Party that demanded the hearing"
        constraints: "one of {EMPLOYER, UNION}"
      - name: decision_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) of the Decision and Direction of Election; null on the stipulated branch"
      - name: voter_list_due_at
        type: datetime
        source: computed
        description: "Statutory deadline for the eligible voter list; formula differs per branch"

  - name: VoterList
    parent: null
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; the case this eligible voter list serves"
      - name: election_agreement_id
        type: string
        source: input
        description: "FK -> ElectionAgreement.id; the approved or directed arrangement whose deadline governs"
      - name: status
        type: enum
        source: computed
        description: "List lifecycle, including the deficiency/cure loop"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, DEFICIENT, REJECTED, SUPERSEDED, CANCELLED}"
      - name: due_at
        type: datetime
        source: computed
        description: "Copied from ElectionAgreement.voter_list_due_at at creation"
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent submission; null while DRAFT"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the director who attested the most recent submission"
      - name: attested_by_title
        type: string
        source: input
        description: "Title of the attesting official, captured at submission"
      - name: total_entry_count
        type: integer
        source: computed
        description: "Count of VoterListEntry rows with this voter_list_id"
        default: 0
      - name: complete_entry_count
        type: integer
        source: computed
        description: "Count of VoterListEntry rows with is_statutory_content_complete == true"
        default: 0
      - name: completeness_pct
        type: number
        source: computed
        description: "Statutory content completeness, 2 decimals; output of voter_list_grading"
      - name: is_late
        type: boolean
        source: computed
        description: "True iff submitted_at > due_at (equality is on time)"
        default: false
      - name: list_grade
        type: enum
        source: computed
        description: "Completeness tier after the lateness bump; null while DRAFT"
        constraints: "one of {COMPLIANT, MINOR_DEFECT, MATERIAL_DEFECT, GROSSLY_DEFICIENT}"
      - name: cure_window_hours
        type: integer
        source: computed
        description: "Hours allowed to cure defects, selected by list_grade; null until a DEFICIENT review"
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "reviewed_at plus cure_window_hours; null until a DEFICIENT review"
      - name: reviewed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent Board review"
      - name: noted_defects
        type: array
        source: computed
        description: "Defect codes recorded by the reviewing Board agent"
      - name: resubmission_count
        type: integer
        source: computed
        description: "Number of times this list re-entered SUBMITTED from DEFICIENT"
        default: 0
      - name: eligible_voter_count
        type: integer
        source: computed
        description: "Count of VoterListEntry rows with eligibility_status == ELIGIBLE"
        default: 0

  - name: VoterListEntry
    parent: null
    common_fields: true
    fields:
      - name: voter_list_id
        type: string
        source: input
        description: "FK -> VoterList.id; the list this voter appears on"
      - name: classification_id
        type: string
        source: input
        description: "FK -> Classification.id; the voter's job classification, which must belong to the list's petition"
      - name: full_name
        type: string
        source: input
        description: "Statutory content: full name"
      - name: hire_date
        type: string
        source: input
        description: "Date of hire (YYYY-MM-DD); compared against Petition.payroll_period_end"
      - name: termination_date
        type: string
        source: input
        description: "Separation date (YYYY-MM-DD) or null if still employed"
      - name: home_address
        type: string
        source: input
        description: "Statutory content: home address; null counts as a defect"
      - name: personal_email
        type: string
        source: input
        description: "Statutory content: personal email; null counts as a defect"
      - name: personal_phone
        type: string
        source: input
        description: "Statutory content: personal phone; null counts as a defect"
      - name: shift_code
        type: string
        source: input
        description: "Statutory content: shift; null counts as a defect"
      - name: work_location
        type: string
        source: input
        description: "Statutory content: work location; null counts as a defect"
      - name: on_leave_type
        type: enum
        source: input
        description: "Leave status on the eligibility date"
        default: NONE
        constraints: "one of {NONE, SICK, FMLA, MILITARY, PERMANENT_LAYOFF}"
      - name: is_statutory_content_complete
        type: boolean
        source: computed
        description: "True iff all five optional statutory content fields (home_address, personal_email, personal_phone, shift_code, work_location) are present and non-empty"
        default: false
      - name: missing_field_count
        type: integer
        source: computed
        description: "Count of absent statutory content fields, 0-5"
        default: 0
      - name: eligibility_status
        type: enum
        source: computed
        description: "Output of voter_eligibility"
        default: CHALLENGED
        constraints: "one of {ELIGIBLE, INELIGIBLE, CHALLENGED}"
      - name: ineligibility_reason
        type: enum
        source: computed
        description: "Why the voter is ineligible; null unless eligibility_status == INELIGIBLE"
        constraints: "one of {OUTSIDE_UNIT, HIRED_AFTER_PAYROLL_PERIOD, TERMINATED_BEFORE_ELECTION, PERMANENT_LAYOFF}"

  - name: Supervisor
    parent: null
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; the case this supervisor is briefed for"
      - name: full_name
        type: string
        source: input
        description: "Supervisor name"
      - name: job_title
        type: string
        source: input
        description: "Supervisory job title"
      - name: span_of_control
        type: integer
        source: input
        description: "Number of unit employees reporting to this supervisor"
        constraints: ">= 0"
      - name: has_hire_fire_authority
        type: boolean
        source: input
        description: "Whether the supervisor holds Section 2(11) hire/fire authority"
        default: false
      - name: training_status
        type: enum
        source: computed
        description: "Lawful-communication training state; cycles back to UNTRAINED on substantiated conduct"
        default: UNTRAINED
        constraints: "one of {UNTRAINED, TRAINED}"
      - name: modules_completed
        type: array
        source: computed
        description: "Module codes recorded by the most recent training attempt"
      - name: quiz_score
        type: integer
        source: computed
        description: "Score of the most recent training attempt, 0-100; null before the first attempt"
      - name: training_attempt_count
        type: integer
        source: computed
        description: "Number of training attempts recorded"
        default: 0
      - name: certified_at
        type: datetime
        source: computed
        description: "Instant certification was granted; cleared when certification is revoked"
      - name: violation_count
        type: integer
        source: computed
        description: "Number of substantiated prohibited-conduct findings"
        default: 0
      - name: last_violation_code
        type: enum
        source: computed
        description: "Most recent substantiated conduct code"
        constraints: "one of {THREAT, INTERROGATION, PROMISE_OF_BENEFIT, SURVEILLANCE, SOLICITATION_RULE_DISPARITY}"

  - name: CampaignCommunication
    parent: null
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; the campaign this message belongs to"
      - name: presenter_supervisor_id
        type: string
        source: input
        description: "FK -> Supervisor.id; the presenting supervisor, required for meeting channels and null otherwise"
      - name: channel
        type: enum
        source: input
        description: "Delivery channel; drives the risk base rate and whether meeting-geometry rules apply"
        constraints: "one of {EMAIL, LETTER, DIGITAL_POST, SMALL_GROUP_MEETING, CAPTIVE_AUDIENCE_MEETING}"
      - name: audience_scope
        type: enum
        source: input
        description: "Breadth of the audience"
        constraints: "one of {UNIT_WIDE, CLASSIFICATION, INDIVIDUAL}"
      - name: planned_delivery_at
        type: datetime
        source: input
        description: "Planned delivery/presentation start instant"
      - name: duration_minutes
        type: integer
        source: input
        description: "Planned duration of a meeting channel, in minutes"
        default: 60
        constraints: ">= 1"
      - name: message_summary
        type: string
        source: input
        description: "Summary of the message content"
      - name: threat_statement_count
        type: integer
        source: input
        description: "Reviewer-counted statements that predict adverse consequences"
        default: 0
      - name: contains_interrogation
        type: boolean
        source: input
        description: "Whether the message solicits employees' union sympathies"
        default: false
      - name: contains_promise_of_benefit
        type: boolean
        source: input
        description: "Whether the message promises a benefit conditioned on the vote"
        default: false
      - name: contains_surveillance_reference
        type: boolean
        source: input
        description: "Whether the message references watching protected activity"
        default: false
      - name: material_claim_count
        type: integer
        source: computed
        description: "Material factual claims counted by the accuracy review"
        default: 0
      - name: unsupported_material_claim_count
        type: integer
        source: computed
        description: "Material claims the accuracy review could not source"
        default: 0
      - name: accuracy_reviewed_at
        type: datetime
        source: computed
        description: "Instant the factual accuracy review was recorded; null until reviewed"
      - name: risk_score
        type: integer
        source: computed
        description: "Output of campaign_risk_score, 0-100"
        default: 0
      - name: peerless_plywood_violation
        type: boolean
        source: computed
        description: "True iff a captive-audience meeting falls inside the 24-hour pre-poll blackout"
        default: false
      - name: status
        type: enum
        source: computed
        description: "Review/delivery lifecycle with a revision loop"
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_LEGAL_REVIEW, REVISION_REQUIRED, APPROVED, DELIVERED, BLOCKED}"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of completed revision loops; capped at MAX_REVISION_ROUNDS"
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the author, captured at creation and compared in the segregation-of-duties check"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the counsel who last dispositioned legal review"
      - name: escalation_ack
        type: boolean
        source: input
        description: "Counsel's explicit acknowledgement required in the elevated risk band"
        default: false
      - name: blocked_reason
        type: enum
        source: computed
        description: "Why the message was blocked; null unless status == BLOCKED"
        constraints: "one of {PRESENTER_DECERTIFIED, RERUN_BLACKOUT, POSTURE_BLOCKED, CASE_DISMISSED}"
      - name: delivered_at
        type: datetime
        source: computed
        description: "Instant delivery was confirmed"

  - name: ElectionRound
    parent: null
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; the case this balloting round belongs to"
      - name: election_agreement_id
        type: string
        source: input
        description: "FK -> ElectionAgreement.id; the arrangement that produced this round"
      - name: prior_round_id
        type: string
        source: input
        description: "FK -> ElectionRound.id; the set-aside round this rerun replaces, null for round 1"
      - name: round_number
        type: integer
        source: computed
        description: "1 for the original election, incremented for each rerun"
        default: 1
      - name: voting_method
        type: enum
        source: computed
        description: "Voting method fixed for this round"
        constraints: "one of {MANUAL, MAIL, MIXED}"
      - name: election_date
        type: string
        source: computed
        description: "Election date (YYYY-MM-DD) for this round"
      - name: polls_open_at
        type: datetime
        source: computed
        description: "First instant polls may open; anchors the 24-hour captive-audience blackout"
      - name: polls_close_at
        type: datetime
        source: computed
        description: "Last instant polls may remain open"
      - name: status
        type: enum
        source: computed
        description: "Round lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, SUSPENDED, POLLS_OPEN, POLLS_CLOSED, TALLY_POSTED, TALLY_REVISED, SET_ASIDE, ROUND_CERTIFIED}"
      - name: ballots_impounded
        type: boolean
        source: computed
        description: "True when a blocking charge lands after polls close but before the tally is certified"
        default: false
      - name: scheduled_session_count
        type: integer
        source: computed
        description: "Count of PollSession rows with status == SCHEDULED"
        default: 0
      - name: closed_session_count
        type: integer
        source: computed
        description: "Count of PollSession rows with status == CLOSED"
        default: 0
      - name: ballots_cast_total
        type: integer
        source: computed
        description: "Conserved quantity: all ballots that entered the box across the round"
        default: 0
      - name: provisional_votes_for
        type: integer
        source: computed
        description: "Unchallenged votes for representation, summed at tally posting"
        default: 0
      - name: provisional_votes_against
        type: integer
        source: computed
        description: "Unchallenged votes against representation, summed at tally posting"
        default: 0
      - name: provisional_void_count
        type: integer
        source: computed
        description: "Void ballots summed at tally posting"
        default: 0
      - name: provisional_margin
        type: integer
        source: computed
        description: "provisional_votes_for minus provisional_votes_against, may be negative"
        default: 0
      - name: challenged_open_count
        type: integer
        source: computed
        description: "ChallengedBallot rows on this round's sessions with resolution == OPEN"
        default: 0
      - name: challenged_counted_for_count
        type: integer
        source: computed
        description: "ChallengedBallot rows resolved COUNTED_FOR"
        default: 0
      - name: challenged_counted_against_count
        type: integer
        source: computed
        description: "ChallengedBallot rows resolved COUNTED_AGAINST"
        default: 0
      - name: challenged_voided_count
        type: integer
        source: computed
        description: "ChallengedBallot rows resolved VOIDED"
        default: 0
      - name: challenged_withdrawn_count
        type: integer
        source: computed
        description: "ChallengedBallot rows resolved WITHDRAWN (returned unopened)"
        default: 0
      - name: determinative_challenges
        type: boolean
        source: computed
        description: "True iff challenged_open_count >= abs(provisional_margin)"
        default: false
      - name: revised_votes_for
        type: integer
        source: computed
        description: "Votes for after challenge resolution; null until the tally is revised"
      - name: revised_votes_against
        type: integer
        source: computed
        description: "Votes against after challenge resolution; null until the tally is revised"
      - name: revised_void_count
        type: integer
        source: computed
        description: "Void ballots after challenge resolution; null until the tally is revised"
      - name: revised_margin
        type: integer
        source: computed
        description: "revised_votes_for minus revised_votes_against; null until the tally is revised"
      - name: valid_votes_cast
        type: integer
        source: computed
        description: "revised_votes_for plus revised_votes_against, excluding void ballots; null until the tally is revised"
      - name: majority_threshold
        type: number
        source: computed
        description: "valid_votes_cast divided by 2, 2 decimals; representation requires strictly more than this"
      - name: tally_posted_at
        type: datetime
        source: computed
        description: "Instant the provisional tally was posted; anchors the objection window"
      - name: tally_revised_at
        type: datetime
        source: computed
        description: "Instant the revised tally was issued"
      - name: objection_window_close_at
        type: datetime
        source: computed
        description: "Last instant objections may be filed against this round"

  - name: PollSession
    parent: null
    common_fields: true
    fields:
      - name: election_round_id
        type: string
        source: input
        description: "FK -> ElectionRound.id; the round this voting session belongs to"
      - name: location_code
        type: string
        source: input
        description: "Polling location code; the resource whose occupancy intervals must not collide"
      - name: session_start_at
        type: datetime
        source: input
        description: "Session opening instant"
      - name: session_end_at
        type: datetime
        source: input
        description: "Session closing instant"
        constraints: "must be strictly after session_start_at"
      - name: method
        type: enum
        source: input
        description: "How ballots are cast in this session"
        constraints: "one of {MANUAL, MAIL}"
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CANCELLED, CLOSED}"
      - name: votes_for_count
        type: integer
        source: input
        description: "Unchallenged ballots cast for representation, recorded at close"
        default: 0
      - name: votes_against_count
        type: integer
        source: input
        description: "Unchallenged ballots cast against representation, recorded at close"
        default: 0
      - name: void_count
        type: integer
        source: input
        description: "Void ballots recorded at close"
        default: 0
      - name: challenged_ballot_count
        type: integer
        source: computed
        description: "Count of ChallengedBallot rows with this poll_session_id"
        default: 0
      - name: employer_observer_count
        type: integer
        source: computed
        description: "Observers designated by the employer for this session"
        default: 0
      - name: union_observer_count
        type: integer
        source: computed
        description: "Observers designated by the union for this session"
        default: 0
      - name: observer_roster
        type: array
        source: computed
        description: "Designated observers as { party, observer_name, supervisor_id } objects in designation order"
      - name: closed_at
        type: datetime
        source: computed
        description: "Instant the session was closed and its counts recorded"

  - name: ChallengedBallot
    parent: null
    common_fields: true
    fields:
      - name: poll_session_id
        type: string
        source: input
        description: "FK -> PollSession.id; the session at which the ballot was challenged"
      - name: voter_list_entry_id
        type: string
        source: input
        description: "FK -> VoterListEntry.id; the voter whose ballot is segregated"
        constraints: "at most one OPEN or resolved ChallengedBallot per voter_list_entry_id per round; violation -> ERR_DUPLICATE_CHALLENGED_BALLOT"
      - name: challenger_party
        type: enum
        source: input
        description: "Party that lodged the challenge"
        constraints: "one of {EMPLOYER, UNION, BOARD}"
      - name: basis
        type: enum
        source: input
        description: "Ground for the challenge"
        constraints: "one of {SUPERVISOR, NOT_ON_LIST, OUTSIDE_UNIT, IDENTITY, LAID_OFF}"
      - name: resolution
        type: enum
        source: computed
        description: "Disposition of the segregated ballot"
        default: OPEN
        constraints: "one of {OPEN, COUNTED_FOR, COUNTED_AGAINST, VOIDED, WITHDRAWN}"
      - name: resolved_at
        type: datetime
        source: computed
        description: "Instant of the most recent resolution; null while OPEN"
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of times a resolution was undone by the compensating reopen action"
        default: 0

  - name: Objection
    parent: null
    common_fields: true
    fields:
      - name: election_round_id
        type: string
        source: input
        description: "FK -> ElectionRound.id; the round whose conduct is objected to"
      - name: related_supervisor_id
        type: string
        source: input
        description: "FK -> Supervisor.id; the supervisor whose conduct is at issue, null for non-conduct grounds"
      - name: filed_by_party
        type: enum
        source: input
        description: "Party filing the objection"
        constraints: "one of {EMPLOYER, UNION}"
      - name: ground_code
        type: enum
        source: input
        description: "Objection ground"
        constraints: "one of {PROHIBITED_SUPERVISOR_CONDUCT, CAPTIVE_AUDIENCE_TIMING, LIST_DEFICIENCY, POLLING_IRREGULARITY, THIRD_PARTY_CONDUCT}"
      - name: conduct_occurred_at
        type: datetime
        source: input
        description: "Instant the objectionable conduct occurred"
      - name: alleged_affected_voter_count
        type: integer
        source: input
        description: "Number of voters the filer alleges the conduct reached"
        constraints: ">= 0"
      - name: description
        type: string
        source: input
        description: "Narrative of the objectionable conduct"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the objection was filed"
      - name: status
        type: enum
        source: computed
        description: "Objection lifecycle"
        default: FILED
        constraints: "one of {FILED, SUSTAINED, OVERRULED}"
      - name: affects_results
        type: boolean
        source: computed
        description: "True iff alleged_affected_voter_count >= abs(ElectionRound.provisional_margin) for the objected round"
        default: false
      - name: rerun_directed
        type: boolean
        source: computed
        description: "True when sustaining this objection directed a rerun"
        default: false
      - name: disposition_rationale
        type: string
        source: computed
        description: "Rationale recorded with the ruling; null while FILED"
      - name: ruled_at
        type: datetime
        source: computed
        description: "Instant the objection was ruled on"

  - name: ULPCharge
    parent: null
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; the case this charge is docketed against"
      - name: related_objection_id
        type: string
        source: input
        description: "FK -> Objection.id; the objection this charge is consolidated with, null when standalone"
      - name: charging_party
        type: enum
        source: input
        description: "Party filing the charge"
        constraints: "one of {UNION, EMPLOYER, INDIVIDUAL}"
      - name: charged_party
        type: enum
        source: input
        description: "Party charged"
        constraints: "one of {EMPLOYER, UNION}"
      - name: section_code
        type: enum
        source: input
        description: "Alleged statutory violation"
        constraints: "one of {8A1, 8A3, 8A5, 8B1A}"
      - name: allegation_summary
        type: string
        source: input
        description: "Narrative of the alleged unfair labor practice"
      - name: conduct_occurred_at
        type: datetime
        source: input
        description: "Instant the alleged conduct occurred"
      - name: blocking_requested
        type: boolean
        source: input
        description: "Whether the charging party asks that the election be blocked"
        default: false
      - name: status
        type: enum
        source: computed
        description: "Charge lifecycle"
        default: FILED
        constraints: "one of {FILED, MERIT_FOUND, DISMISSED, SETTLED}"
      - name: remedy_code
        type: enum
        source: input
        description: "Remedy recorded with a merit determination; null otherwise"
        constraints: "one of {NOTICE_POSTING, REINSTATEMENT, BARGAINING_ORDER, RERUN_ELECTION}"
      - name: settlement_type
        type: enum
        source: input
        description: "Form of settlement; null unless status == SETTLED"
        constraints: "one of {NON_BOARD, FORMAL}"
      - name: notice_posting_days
        type: integer
        source: input
        description: "Days a settlement notice must remain posted; drives Petition.notice_posting_end_at"
        constraints: ">= 0"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the charge was docketed"
      - name: determined_at
        type: datetime
        source: computed
        description: "Instant of the merit/dismissal determination"
      - name: settled_at
        type: datetime
        source: computed
        description: "Instant the charge was settled"

state_machines:
  # ---------------------------------------------------------------------------
  # Petition carries TWO independent state dimensions on the same row:
  #   (1) case_status — the procedural lifecycle, which contains a rerun cycle
  #   (2) case_posture — a ULP-charge-driven gate, whose states are written below
  #       with the POSTURE_ prefix so transition ids stay unambiguous
  # ---------------------------------------------------------------------------
  - entity: Petition
    initial_state: RECEIVED
    terminal_states: [DISMISSED, CERTIFIED]
    transitions:
      - from: RECEIVED
        to: SCOPE_ANALYSIS
        trigger: "POST /labor-relations/petitions/{id}/open-scope-analysis"
        actor: LaborRelationsDirector
        preconditions:
          - "case_status == RECEIVED"
          - "case_posture == OPEN"
        side_effects:
          - "no field writes beyond case_status, updated_at, version"
      - from: SCOPE_ANALYSIS
        to: SOI_VERIFIED
        trigger: "POST /labor-relations/petitions/{id}/verify-showing when showing_of_interest_ratio returns SUFFICIENT"
        actor: BoardAgent
        preconditions:
          - "case_status == SCOPE_ANALYSIS"
          - "case_posture == OPEN"
          - "the selected denominator variant is > 0 (else ERR_UNIT_HEADCOUNT_ZERO)"
        side_effects:
          - "writes valid_card_count, showing_of_interest_pct, showing_headcount_basis, showing_verdict = SUFFICIENT"
      - from: SOI_VERIFIED
        to: SOI_VERIFIED
        trigger: "POST /labor-relations/petitions/{id}/verify-showing (re-verification after a scope ruling changed the denominator) when the result is SUFFICIENT"
        actor: BoardAgent
        preconditions:
          - "case_status == SOI_VERIFIED"
          - "case_posture == OPEN"
        side_effects:
          - "overwrites valid_card_count, showing_of_interest_pct, showing_headcount_basis, showing_verdict"
        note: "Self-loop: the Board may re-verify while the case has not yet been set for election; each call recomputes from the card counts in the request body."
      - from: SOI_VERIFIED
        to: DISMISSED
        trigger: "POST /labor-relations/petitions/{id}/verify-showing when showing_of_interest_ratio returns INSUFFICIENT"
        actor: BoardAgent
        preconditions:
          - "case_status IN {SCOPE_ANALYSIS, SOI_VERIFIED}"
        side_effects:
          - "hop 1: showing_verdict = INSUFFICIENT and showing_of_interest_pct written"
          - "hop 2: because the verdict is INSUFFICIENT, case_status = DISMISSED"
          - "hop 3a: because the petition is DISMISSED, every Classification on this petition with scope_ruling == PENDING becomes MOOT (pending_headcount is unchanged because MOOT stays in the pending bucket)"
          - "hop 3b: because the petition is DISMISSED, every ElectionAgreement on this petition with status IN {PROPOSED, HEARING_REQUESTED} becomes VOID and its voter_list_due_at is cleared to null"
          - "hop 3c: because the petition is DISMISSED, every CampaignCommunication on this petition with status IN {DRAFT, PENDING_LEGAL_REVIEW, APPROVED} becomes BLOCKED with blocked_reason = CASE_DISMISSED"
          - "hop 3d: because the petition is DISMISSED, every VoterList on this petition with status == DRAFT becomes CANCELLED"
        note: "Same endpoint as the SUFFICIENT branch; the verdict selects which branch fires. Also reachable from SCOPE_ANALYSIS."
      - from: SOI_VERIFIED
        to: ELECTION_SET
        trigger: "POST /labor-relations/election-agreements/{id}/stipulate or POST /labor-relations/election-agreements/{id}/direct-election"
        actor: BoardAgent
        preconditions:
          - "case_status == SOI_VERIFIED"
          - "case_posture == OPEN"
          - "showing_verdict == SUFFICIENT"
        side_effects:
          - "an ElectionRound row is created with round_number = 1 and status = SCHEDULED"
      - from: ELECTION_SET
        to: VOTING_CLOSED
        trigger: "system: the last PollSession of the current round leaves SCHEDULED via POST /labor-relations/poll-sessions/{id}/close"
        actor: system
        preconditions:
          - "current ElectionRound.status == POLLS_OPEN"
          - "current ElectionRound.scheduled_session_count reaches 0 and closed_session_count >= 1"
        side_effects:
          - "current ElectionRound.status = POLLS_CLOSED"
      - from: VOTING_CLOSED
        to: TALLY_POSTED
        trigger: "POST /labor-relations/election-rounds/{id}/post-tally"
        actor: BoardAgent
        preconditions:
          - "current ElectionRound.status == POLLS_CLOSED"
          - "current ElectionRound.ballots_impounded == false"
        side_effects:
          - "ElectionRound provisional tally fields and objection_window_close_at are written"
      - from: TALLY_POSTED
        to: OBJECTIONS_PENDING
        trigger: "POST /labor-relations/objections (first objection accepted for the current round)"
        actor: LaborRelationsDirector | UnionRepresentative
        preconditions:
          - "current ElectionRound.status IN {TALLY_POSTED, TALLY_REVISED}"
          - "logical clock <= ElectionRound.objection_window_close_at"
        side_effects:
          - "pending_objection_count += 1"
      - from: OBJECTIONS_PENDING
        to: TALLY_POSTED
        trigger: "system: the last FILED objection on the current round is OVERRULED via POST /labor-relations/objections/{id}/rule"
        actor: system
        preconditions:
          - "pending_objection_count reaches 0 with no objection SUSTAINED on the current round"
        side_effects:
          - "case_status returns to TALLY_POSTED so certification may proceed"
      - from: OBJECTIONS_PENDING
        to: RERUN_DIRECTED
        trigger: "POST /labor-relations/objections/{id}/rule with disposition = SUSTAIN"
        actor: BoardAgent
        preconditions:
          - "objection.status == FILED"
          - "objection.affects_results == true"
        side_effects:
          - "hop 1: Objection.status = SUSTAINED, rerun_directed = true, ruled_at set"
          - "hop 2: because the objection is SUSTAINED, the objected ElectionRound.status = SET_ASIDE and its revised/provisional tally stays readable but is no longer certifiable"
          - "hop 3: because the round is SET_ASIDE, Petition.case_status = RERUN_DIRECTED and pending_objection_count = 0"
          - "hop 4a: because the petition entered RERUN_DIRECTED, the VoterList with status == ACCEPTED for this petition becomes SUPERSEDED (a fresh list is required for the rerun)"
          - "hop 4b: because the petition entered RERUN_DIRECTED, every CampaignCommunication with status IN {APPROVED, PENDING_LEGAL_REVIEW} becomes BLOCKED with blocked_reason = RERUN_BLACKOUT"
      - from: RERUN_DIRECTED
        to: ELECTION_SET
        trigger: "POST /labor-relations/petitions/{id}/schedule-rerun"
        actor: BoardAgent
        preconditions:
          - "case_status == RERUN_DIRECTED"
          - "case_posture == OPEN"
        side_effects:
          - "a new ElectionRound is created with round_number = prior.round_number + 1, prior_round_id = the SET_ASIDE round, status = SCHEDULED"
        note: "Closes the cycle: the case re-enters ELECTION_SET and the whole polling/tally/objection arc runs again."
      - from: TALLY_POSTED
        to: CERTIFIED
        trigger: "POST /labor-relations/petitions/{id}/certify"
        actor: BoardAgent
        preconditions:
          - "case_status == TALLY_POSTED"
          - "case_posture == OPEN"
          - "the named ElectionRound.status == TALLY_REVISED"
          - "logical clock > ElectionRound.objection_window_close_at"
          - "pending_objection_count == 0"
          - "blocking_charge_count == 0"
          - "notice_posting_end_at is null or <= logical clock"
        side_effects:
          - "certification_outcome, certified_at, certified_round_id and the bargaining/bar/decert timestamps are written by certification_timeline"
          - "the named ElectionRound.status = ROUND_CERTIFIED"
      - from: POSTURE_OPEN
        to: POSTURE_BLOCKED
        trigger: "POST /labor-relations/ulp-charges with blocking_requested = true"
        actor: UnionRepresentative | LaborRelationsDirector
        preconditions:
          - "case_status NOT IN {DISMISSED, CERTIFIED}"
          - "the petition's highest-numbered ElectionRound has status NOT IN {POLLS_CLOSED, TALLY_POSTED, TALLY_REVISED} (otherwise the IMPOUNDED branch fires)"
        side_effects:
          - "hop 1: ULPCharge row created with status = FILED, filed_at = logical clock; Petition.blocking_charge_count += 1"
          - "hop 2: because blocking_charge_count became > 0, case_posture = BLOCKED"
          - "hop 3: because the posture is BLOCKED, the highest-numbered ElectionRound with status == SCHEDULED becomes SUSPENDED"
          - "hop 4: because that round became SUSPENDED, each of its PollSession rows with status == SCHEDULED becomes CANCELLED and the round's scheduled_session_count is recomputed to 0"
          - "fan-out on hop 2: every CampaignCommunication with status == APPROVED becomes BLOCKED with blocked_reason = POSTURE_BLOCKED"
        note: "Second dimension: case_status is untouched by this transition."
      - from: POSTURE_OPEN
        to: POSTURE_IMPOUNDED
        trigger: "POST /labor-relations/ulp-charges with blocking_requested = true while ballots are already cast"
        actor: UnionRepresentative | LaborRelationsDirector
        preconditions:
          - "case_status NOT IN {DISMISSED, CERTIFIED}"
          - "the petition's highest-numbered ElectionRound has status IN {POLLS_CLOSED, TALLY_POSTED, TALLY_REVISED}"
        side_effects:
          - "blocking_charge_count += 1, case_posture = IMPOUNDED"
          - "that ElectionRound.ballots_impounded = true"
        note: "Conditional cascade: the same trigger produces BLOCKED or IMPOUNDED depending on the round's state."
      - from: POSTURE_BLOCKED
        to: POSTURE_OPEN
        trigger: "POST /labor-relations/ulp-charges/{id}/determine with determination = DISMISS, or POST /labor-relations/ulp-charges/{id}/settle"
        actor: BoardAgent | EmploymentCounsel
        preconditions:
          - "after the write, blocking_charge_count == 0"
        side_effects:
          - "case_posture = OPEN"
          - "every ElectionRound of this petition with status == SUSPENDED returns to SCHEDULED"
          - "every CampaignCommunication with status == BLOCKED and blocked_reason == POSTURE_BLOCKED returns to APPROVED with blocked_reason = null"
          - "PollSession rows cancelled while blocked are NOT restored; the Board must create replacement sessions"
      - from: POSTURE_IMPOUNDED
        to: POSTURE_OPEN
        trigger: "POST /labor-relations/ulp-charges/{id}/determine with determination = DISMISS, or POST /labor-relations/ulp-charges/{id}/settle"
        actor: BoardAgent | EmploymentCounsel
        preconditions:
          - "after the write, blocking_charge_count == 0"
        side_effects:
          - "case_posture = OPEN and the impounded ElectionRound.ballots_impounded = false"

  - entity: Classification
    initial_state: PENDING
    terminal_states: [MOOT]
    transitions:
      - from: PENDING
        to: INCLUDED
        trigger: "POST /labor-relations/classifications/{id}/rule with ruling = INCLUDED"
        actor: BoardAgent
        preconditions:
          - "scope_ruling == PENDING"
          - "Petition.case_status IN {SCOPE_ANALYSIS, SOI_VERIFIED}"
          - "coi_score is not null (the classification has been scored)"
        side_effects:
          - "Petition.included_headcount += headcount and Petition.pending_headcount -= headcount"
          - "ruling_rationale written"
      - from: PENDING
        to: EXCLUDED
        trigger: "POST /labor-relations/classifications/{id}/rule with ruling = EXCLUDED"
        actor: BoardAgent
        preconditions:
          - "scope_ruling == PENDING"
          - "Petition.case_status IN {SCOPE_ANALYSIS, SOI_VERIFIED}"
          - "coi_score is not null"
        side_effects:
          - "Petition.excluded_headcount += headcount and Petition.pending_headcount -= headcount"
          - "ruling_rationale written"
      - from: INCLUDED
        to: PENDING
        trigger: "POST /labor-relations/classifications/{id}/reconsider"
        actor: BoardAgent
        preconditions:
          - "scope_ruling IN {INCLUDED, EXCLUDED}"
          - "Petition.case_status IN {SCOPE_ANALYSIS, SOI_VERIFIED}"
        side_effects:
          - "Petition.included_headcount -= headcount and Petition.pending_headcount += headcount"
          - "ruling_rationale = null"
        note: "Compensating action for the INCLUDED ruling; unit_headcount_conservation must hold before and after."
      - from: EXCLUDED
        to: PENDING
        trigger: "POST /labor-relations/classifications/{id}/reconsider"
        actor: BoardAgent
        preconditions:
          - "scope_ruling IN {INCLUDED, EXCLUDED}"
          - "Petition.case_status IN {SCOPE_ANALYSIS, SOI_VERIFIED}"
        side_effects:
          - "Petition.excluded_headcount -= headcount and Petition.pending_headcount += headcount"
          - "ruling_rationale = null"
      - from: PENDING
        to: MOOT
        trigger: "system: cascade hop 3a of the Petition SOI_VERIFIED -> DISMISSED transition"
        actor: system
        preconditions:
          - "Petition.case_status becomes DISMISSED in the same request"
        side_effects:
          - "no headcount movement: MOOT headcount remains inside Petition.pending_headcount"

  - entity: ElectionAgreement
    initial_state: PROPOSED
    terminal_states: [VOID]
    transitions:
      - from: PROPOSED
        to: STIPULATED_APPROVED
        trigger: "POST /labor-relations/election-agreements/{id}/stipulate"
        actor: BoardAgent
        preconditions:
          - "status == PROPOSED"
          - "Petition.case_status == SOI_VERIFIED and Petition.case_posture == OPEN"
          - "polls_close_at is strictly after polls_open_at"
        side_effects:
          - "route = STIPULATED; approved_election_date, voting_method, polls_open_at, polls_close_at written from the request"
          - "voter_list_due_at = end of the 2nd business day after the logical clock's date (voter_list_deadline, STIPULATED variant)"
          - "an ElectionRound row is created (round_number 1, status SCHEDULED) copying voting_method, election_date, polls_open_at, polls_close_at"
          - "Petition.case_status = ELECTION_SET and Petition.version increments"
      - from: PROPOSED
        to: HEARING_REQUESTED
        trigger: "POST /labor-relations/election-agreements/{id}/request-hearing"
        actor: LaborRelationsDirector | UnionRepresentative
        preconditions:
          - "status == PROPOSED"
          - "Petition.case_status == SOI_VERIFIED"
        side_effects:
          - "hearing_requested_at = logical clock, hearing_requested_by_party recorded"
          - "no ElectionRound is created and voter_list_due_at stays null"
        note: "Divergent branch: the stipulated branch fixes the deadline from the approval instant, this branch defers it to the decision date."
      - from: HEARING_REQUESTED
        to: DIRECTED
        trigger: "POST /labor-relations/election-agreements/{id}/direct-election"
        actor: BoardAgent
        preconditions:
          - "status == HEARING_REQUESTED"
          - "Petition.case_status == SOI_VERIFIED and Petition.case_posture == OPEN"
          - "every Classification on the petition has scope_ruling != PENDING (the hearing must resolve scope first)"
        side_effects:
          - "route = DIRECTED; decision_date, approved_election_date, voting_method, polls_open_at, polls_close_at written from the request"
          - "voter_list_due_at = end of the 2nd business day after decision_date (voter_list_deadline, DIRECTED variant) — a different anchor than the STIPULATED variant"
          - "an ElectionRound row is created (round_number 1, status SCHEDULED)"
          - "Petition.case_status = ELECTION_SET and Petition.version increments"
      - from: PROPOSED
        to: VOID
        trigger: "system: cascade hop 3b of the Petition SOI_VERIFIED -> DISMISSED transition"
        actor: system
        preconditions:
          - "status IN {PROPOSED, HEARING_REQUESTED} when the petition is dismissed"
        side_effects:
          - "voter_list_due_at = null"
      - from: HEARING_REQUESTED
        to: VOID
        trigger: "system: cascade hop 3b of the Petition SOI_VERIFIED -> DISMISSED transition"
        actor: system
        preconditions:
          - "status IN {PROPOSED, HEARING_REQUESTED} when the petition is dismissed"
        side_effects:
          - "hearing_requested_at is retained for the record; voter_list_due_at = null"

  - entity: VoterList
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /labor-relations/voter-lists/{id}/submit"
        actor: LaborRelationsDirector
        preconditions:
          - "status == DRAFT"
          - "total_entry_count >= 1"
          - "Petition.case_status == ELECTION_SET and Petition.case_posture == OPEN"
          - "logical clock <= due_at, unless the caller passes late_submission_ack = true"
        side_effects:
          - "submitted_at = logical clock, submitted_by_user_id = X-User-ID, attested_by_title written"
          - "voter_list_grading recomputes completeness_pct, is_late and list_grade"
          - "eligible_voter_count recomputed from the entries' eligibility_status"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /labor-relations/voter-lists/{id}/review with disposition = ACCEPT"
        actor: BoardAgent
        preconditions:
          - "status == SUBMITTED"
          - "list_grade IN {COMPLIANT, MINOR_DEFECT}"
        side_effects:
          - "reviewed_at = logical clock; cure_window_hours and cure_deadline_at stay null"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /labor-relations/voter-lists/{id}/review with disposition = RETURN_FOR_CURE"
        actor: BoardAgent
        preconditions:
          - "status == SUBMITTED"
          - "list_grade IN {MINOR_DEFECT, MATERIAL_DEFECT}"
        side_effects:
          - "reviewed_at = logical clock, noted_defects written"
          - "cure_window_hours = 48 when list_grade == MINOR_DEFECT, 24 when MATERIAL_DEFECT; cure_deadline_at = reviewed_at + cure_window_hours"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /labor-relations/voter-lists/{id}/resubmit"
        actor: LaborRelationsDirector
        preconditions:
          - "status == DEFICIENT"
          - "logical clock <= cure_deadline_at"
          - "resubmission_count < MAX_LIST_RESUBMISSIONS"
        side_effects:
          - "resubmission_count += 1, submitted_at = logical clock"
          - "completeness_pct, is_late and list_grade are regraded from the current entry rows"
        note: "Cure loop: DEFICIENT -> SUBMITTED -> DEFICIENT may repeat until MAX_LIST_RESUBMISSIONS."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /labor-relations/voter-lists/{id}/review with disposition = REJECT"
        actor: BoardAgent
        preconditions:
          - "status == SUBMITTED"
          - "list_grade == GROSSLY_DEFICIENT"
        side_effects:
          - "reviewed_at = logical clock, noted_defects written, cure_window_hours = 0"
          - "no cure is offered; a replacement list must be created"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a replacement list is created for the same petition via POST /labor-relations/voter-lists"
        actor: system
        preconditions:
          - "status IN {DRAFT, DEFICIENT} at the moment the replacement is created"
        side_effects:
          - "the superseded row keeps its entries for the record but can no longer be submitted"
      - from: DEFICIENT
        to: SUPERSEDED
        trigger: "system: a replacement list is created for the same petition via POST /labor-relations/voter-lists"
        actor: system
        preconditions:
          - "status IN {DRAFT, DEFICIENT} at the moment the replacement is created"
        side_effects:
          - "cure_deadline_at is retained for the record"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: cascade hop 4a of the objection-sustained chain"
        actor: system
        preconditions:
          - "Petition.case_status becomes RERUN_DIRECTED in the same request"
        side_effects:
          - "the rerun requires a brand-new list; this row is frozen"
      - from: DRAFT
        to: CANCELLED
        trigger: "system: cascade of the Petition SOI_VERIFIED -> DISMISSED transition"
        actor: system
        preconditions:
          - "status == DRAFT when the petition is dismissed"
        side_effects:
          - "due_at is retained for the record"

  - entity: Supervisor
    initial_state: UNTRAINED
    terminal_states: []
    transitions:
      - from: UNTRAINED
        to: TRAINED
        trigger: "POST /labor-relations/supervisors/{id}/train with quiz_score >= TRAINING_PASS_SCORE and all required modules present"
        actor: SupervisorTrainer
        preconditions:
          - "training_status == UNTRAINED"
          - "modules_completed contains every code in REQUIRED_TRAINING_MODULES"
          - "quiz_score >= TRAINING_PASS_SCORE"
        side_effects:
          - "training_attempt_count += 1, quiz_score and modules_completed written, certified_at = logical clock"
      - from: UNTRAINED
        to: UNTRAINED
        trigger: "POST /labor-relations/supervisors/{id}/train with quiz_score < TRAINING_PASS_SCORE or a missing required module"
        actor: SupervisorTrainer
        preconditions:
          - "training_status == UNTRAINED"
        side_effects:
          - "training_attempt_count += 1 and quiz_score recorded, but certification is withheld"
        note: "Failed-attempt self-loop; the attempt counter is the only durable effect."
      - from: TRAINED
        to: UNTRAINED
        trigger: "POST /labor-relations/supervisors/{id}/record-violation with substantiated = true"
        actor: EmploymentCounsel
        preconditions:
          - "training_status == TRAINED"
        side_effects:
          - "hop 1: violation_count += 1, last_violation_code written, certified_at = null, training_status = UNTRAINED"
          - "hop 2: because the presenter lost certification, every CampaignCommunication whose presenter_supervisor_id is this supervisor and whose status IN {PENDING_LEGAL_REVIEW, APPROVED} becomes BLOCKED with blocked_reason = PRESENTER_DECERTIFIED"
          - "hop 3: because at least one message was blocked for decertification, Petition.retraining_required = true"
        note: "Cycle: the supervisor may re-train back to TRAINED, which does NOT unblock the messages."

  - entity: CampaignCommunication
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: PENDING_LEGAL_REVIEW
        trigger: "POST /labor-relations/campaign-communications/{id}/submit-for-review"
        actor: LaborRelationsDirector
        preconditions:
          - "status IN {DRAFT, REVISION_REQUIRED}"
          - "accuracy_reviewed_at is not null (factual accuracy review must precede legal review)"
          - "risk_score is not null"
          - "risk_score < RISK_PROHIBITED_THRESHOLD"
          - "the presenter Supervisor.training_status == TRAINED when channel IN {SMALL_GROUP_MEETING, CAPTIVE_AUDIENCE_MEETING}"
        side_effects:
          - "no counters change; reviewed_by_user_id is cleared"
      - from: REVISION_REQUIRED
        to: PENDING_LEGAL_REVIEW
        trigger: "POST /labor-relations/campaign-communications/{id}/submit-for-review after the author edits the message"
        actor: LaborRelationsDirector
        preconditions:
          - "status == REVISION_REQUIRED"
          - "revision_round < MAX_REVISION_ROUNDS"
          - "accuracy_reviewed_at is not null and is at or after the last review instant (the message must be re-reviewed for accuracy)"
        side_effects:
          - "reviewed_by_user_id cleared"
        note: "Closes the revision loop DRAFT -> PENDING_LEGAL_REVIEW -> REVISION_REQUIRED -> PENDING_LEGAL_REVIEW."
      - from: PENDING_LEGAL_REVIEW
        to: APPROVED
        trigger: "POST /labor-relations/campaign-communications/{id}/review with disposition = APPROVE"
        actor: EmploymentCounsel
        preconditions:
          - "status == PENDING_LEGAL_REVIEW"
          - "X-User-ID != authored_by_user_id (segregation of duties)"
          - "escalation_ack == true when risk_score >= RISK_ESCALATION_THRESHOLD"
          - "peerless_plywood_violation == false"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: PENDING_LEGAL_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /labor-relations/campaign-communications/{id}/review with disposition = REQUEST_REVISION"
        actor: EmploymentCounsel
        preconditions:
          - "status == PENDING_LEGAL_REVIEW"
          - "X-User-ID != authored_by_user_id"
          - "revision_round < MAX_REVISION_ROUNDS (otherwise ERR_REVISION_LIMIT_EXCEEDED)"
        side_effects:
          - "revision_round += 1, reviewed_by_user_id = X-User-ID"
      - from: APPROVED
        to: DELIVERED
        trigger: "POST /labor-relations/campaign-communications/{id}/deliver"
        actor: LaborRelationsDirector
        preconditions:
          - "status == APPROVED"
          - "Petition.case_posture == OPEN"
          - "the logical clock is not inside the Peerless Plywood blackout for the current round"
          - "the current ElectionRound.status IN {SCHEDULED, POLLS_OPEN}"
        side_effects:
          - "delivered_at = logical clock"
      - from: APPROVED
        to: BLOCKED
        trigger: "system: presenter decertification, rerun direction, blocking posture or case dismissal"
        actor: system
        preconditions:
          - "status IN {PENDING_LEGAL_REVIEW, APPROVED} (DRAFT is also blocked by the dismissal cascade)"
        side_effects:
          - "blocked_reason is set to PRESENTER_DECERTIFIED, RERUN_BLACKOUT, POSTURE_BLOCKED or CASE_DISMISSED according to the originating cascade"
      - from: PENDING_LEGAL_REVIEW
        to: BLOCKED
        trigger: "system: presenter decertification, rerun direction or case dismissal"
        actor: system
        preconditions:
          - "status == PENDING_LEGAL_REVIEW"
        side_effects:
          - "blocked_reason set by the originating cascade; revision_round is preserved"
      - from: BLOCKED
        to: APPROVED
        trigger: "system: the petition's last blocking charge is dismissed or settled"
        actor: system
        preconditions:
          - "status == BLOCKED and blocked_reason == POSTURE_BLOCKED"
          - "Petition.case_posture returns to OPEN"
        side_effects:
          - "blocked_reason = null"
        note: "Only the POSTURE_BLOCKED reason is reversible; RERUN_BLACKOUT, PRESENTER_DECERTIFIED and CASE_DISMISSED are permanent for that row."

  - entity: ElectionRound
    initial_state: SCHEDULED
    terminal_states: [SET_ASIDE, ROUND_CERTIFIED]
    transitions:
      - from: SCHEDULED
        to: POLLS_OPEN
        trigger: "POST /labor-relations/election-rounds/{id}/open-polls"
        actor: BoardAgent
        preconditions:
          - "status == SCHEDULED"
          - "Petition.case_posture == OPEN"
          - "the petition has a VoterList with status == ACCEPTED"
          - "scheduled_session_count >= 1"
          - "logical clock >= polls_open_at"
        side_effects:
          - "no counters change; poll sessions may now be closed with results"
      - from: SCHEDULED
        to: SUSPENDED
        trigger: "system: cascade hop 3 of the blocking-charge chain"
        actor: system
        preconditions:
          - "status == SCHEDULED when Petition.case_posture becomes BLOCKED"
        side_effects:
          - "each SCHEDULED PollSession of this round becomes CANCELLED and scheduled_session_count = 0"
      - from: SUSPENDED
        to: SCHEDULED
        trigger: "system: the petition's last blocking charge is dismissed or settled"
        actor: system
        preconditions:
          - "status == SUSPENDED and Petition.blocking_charge_count reaches 0"
        side_effects:
          - "cancelled sessions are not restored, so scheduled_session_count stays 0 until replacements are created"
      - from: POLLS_OPEN
        to: POLLS_CLOSED
        trigger: "system: the last SCHEDULED PollSession of this round is closed"
        actor: system
        preconditions:
          - "status == POLLS_OPEN and scheduled_session_count reaches 0"
        side_effects:
          - "ballots_cast_total, provisional_votes_for, provisional_votes_against and provisional_void_count are accumulated from the closed sessions"
          - "Petition.case_status = VOTING_CLOSED"
      - from: POLLS_CLOSED
        to: TALLY_POSTED
        trigger: "POST /labor-relations/election-rounds/{id}/post-tally"
        actor: BoardAgent
        preconditions:
          - "status == POLLS_CLOSED"
          - "ballots_impounded == false"
          - "the session-level counts reconcile with ballots_cast_total (ballot_conservation)"
        side_effects:
          - "provisional_margin, valid_votes_cast, majority_threshold, determinative_challenges, tally_posted_at written by ballot_tally (PROVISIONAL variant)"
          - "objection_window_close_at = end of the 7th business day after the tally date"
          - "Petition.case_status = TALLY_POSTED"
      - from: TALLY_POSTED
        to: TALLY_REVISED
        trigger: "POST /labor-relations/election-rounds/{id}/revise-tally"
        actor: BoardAgent
        preconditions:
          - "status IN {TALLY_POSTED, TALLY_REVISED}"
          - "challenged_open_count == 0"
        side_effects:
          - "revised_votes_for, revised_votes_against, revised_void_count, revised_margin, valid_votes_cast, majority_threshold and tally_revised_at written by ballot_tally (REVISED variant)"
          - "objection_window_close_at is NOT recomputed: the window still runs from the provisional posting date"
      - from: TALLY_REVISED
        to: TALLY_REVISED
        trigger: "POST /labor-relations/election-rounds/{id}/revise-tally again after a challenged ballot is reopened and re-resolved"
        actor: BoardAgent
        preconditions:
          - "status == TALLY_REVISED"
          - "challenged_open_count == 0"
        side_effects:
          - "the revised tally fields are overwritten; tally_revised_at advances"
        note: "Self-loop that pairs with ChallengedBallot reopen, so the revised tally can converge after a correction."
      - from: TALLY_POSTED
        to: SET_ASIDE
        trigger: "system: cascade hop 2 of the objection-sustained chain"
        actor: system
        preconditions:
          - "status IN {TALLY_POSTED, TALLY_REVISED} when an objection with affects_results == true is SUSTAINED"
        side_effects:
          - "Petition.case_status = RERUN_DIRECTED"
      - from: TALLY_REVISED
        to: SET_ASIDE
        trigger: "system: cascade hop 2 of the objection-sustained chain"
        actor: system
        preconditions:
          - "status IN {TALLY_POSTED, TALLY_REVISED} when an objection with affects_results == true is SUSTAINED"
        side_effects:
          - "the revised tally is retained for the record but is no longer certifiable"
      - from: TALLY_REVISED
        to: ROUND_CERTIFIED
        trigger: "POST /labor-relations/petitions/{id}/certify naming this round"
        actor: BoardAgent
        preconditions:
          - "status == TALLY_REVISED"
          - "logical clock > objection_window_close_at"
        side_effects:
          - "Petition.certification_outcome and the bargaining/bar/decert timestamps are written"

  - entity: PollSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /labor-relations/poll-sessions/{id}/close"
        actor: BoardAgent
        preconditions:
          - "status == SCHEDULED"
          - "ElectionRound.status == POLLS_OPEN"
          - "logical clock >= session_end_at"
          - "employer_observer_count and union_observer_count are each <= MAX_OBSERVERS_PER_PARTY"
        side_effects:
          - "votes_for_count, votes_against_count, void_count recorded; closed_at = logical clock"
          - "ElectionRound.closed_session_count += 1 and scheduled_session_count -= 1"
          - "when scheduled_session_count reaches 0 the round moves to POLLS_CLOSED (see the ElectionRound machine)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade hop 4 of the blocking-charge chain"
        actor: system
        preconditions:
          - "status == SCHEDULED when the parent round becomes SUSPENDED"
        side_effects:
          - "the row is frozen; cancelling never contributes ballots to the round"

  - entity: ChallengedBallot
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: COUNTED_FOR
        trigger: "POST /labor-relations/challenged-ballots/{id}/resolve with resolution = COUNTED_FOR"
        actor: BoardAgent
        preconditions:
          - "resolution == OPEN"
          - "ElectionRound.status IN {TALLY_POSTED, TALLY_REVISED}"
        side_effects:
          - "resolved_at = logical clock; round challenged_open_count -= 1 and challenged_counted_for_count += 1"
      - from: OPEN
        to: COUNTED_AGAINST
        trigger: "POST /labor-relations/challenged-ballots/{id}/resolve with resolution = COUNTED_AGAINST"
        actor: BoardAgent
        preconditions:
          - "resolution == OPEN"
          - "ElectionRound.status IN {TALLY_POSTED, TALLY_REVISED}"
        side_effects:
          - "round challenged_open_count -= 1 and challenged_counted_against_count += 1"
      - from: OPEN
        to: VOIDED
        trigger: "POST /labor-relations/challenged-ballots/{id}/resolve with resolution = VOIDED"
        actor: BoardAgent
        preconditions:
          - "resolution == OPEN"
          - "ElectionRound.status IN {TALLY_POSTED, TALLY_REVISED}"
        side_effects:
          - "round challenged_open_count -= 1 and challenged_voided_count += 1"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /labor-relations/challenged-ballots/{id}/resolve with resolution = WITHDRAWN"
        actor: BoardAgent
        preconditions:
          - "resolution == OPEN"
          - "ElectionRound.status IN {TALLY_POSTED, TALLY_REVISED}"
          - "challenger_party is the party recorded in the request's withdrawing_party"
        side_effects:
          - "round challenged_open_count -= 1 and challenged_withdrawn_count += 1"
      - from: COUNTED_FOR
        to: OPEN
        trigger: "POST /labor-relations/challenged-ballots/{id}/reopen"
        actor: BoardAgent
        preconditions:
          - "resolution != OPEN"
          - "ElectionRound.status IN {TALLY_POSTED, TALLY_REVISED}"
          - "reopen_count < MAX_BALLOT_REOPENS"
        side_effects:
          - "resolution = OPEN, resolved_at = null, reopen_count += 1"
          - "the bucket counter for the prior resolution decrements and challenged_open_count += 1"
        note: "Compensating action: ballot_conservation must hold identically before and after."
      - from: COUNTED_AGAINST
        to: OPEN
        trigger: "POST /labor-relations/challenged-ballots/{id}/reopen"
        actor: BoardAgent
        preconditions:
          - "resolution != OPEN"
          - "reopen_count < MAX_BALLOT_REOPENS"
        side_effects:
          - "challenged_counted_against_count -= 1 and challenged_open_count += 1"
      - from: VOIDED
        to: OPEN
        trigger: "POST /labor-relations/challenged-ballots/{id}/reopen"
        actor: BoardAgent
        preconditions:
          - "resolution != OPEN"
          - "reopen_count < MAX_BALLOT_REOPENS"
        side_effects:
          - "challenged_voided_count -= 1 and challenged_open_count += 1"
      - from: WITHDRAWN
        to: OPEN
        trigger: "POST /labor-relations/challenged-ballots/{id}/reopen"
        actor: BoardAgent
        preconditions:
          - "resolution != OPEN"
          - "reopen_count < MAX_BALLOT_REOPENS"
        side_effects:
          - "challenged_withdrawn_count -= 1 and challenged_open_count += 1"

  - entity: Objection
    initial_state: FILED
    terminal_states: [SUSTAINED, OVERRULED]
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /labor-relations/objections/{id}/rule with disposition = SUSTAIN"
        actor: BoardAgent
        preconditions:
          - "status == FILED"
          - "affects_results == true (an objection that cannot change the outcome may not be sustained)"
          - "ElectionRound.status IN {TALLY_POSTED, TALLY_REVISED}"
        side_effects:
          - "rerun_directed = true, ruled_at and disposition_rationale written"
          - "starts the four-hop set-aside cascade documented on the Petition machine"
      - from: FILED
        to: OVERRULED
        trigger: "POST /labor-relations/objections/{id}/rule with disposition = OVERRULE"
        actor: BoardAgent
        preconditions:
          - "status == FILED"
        side_effects:
          - "ruled_at and disposition_rationale written; Petition.pending_objection_count -= 1"
          - "when pending_objection_count reaches 0 the petition returns to TALLY_POSTED"

  - entity: ULPCharge
    initial_state: FILED
    terminal_states: [DISMISSED, SETTLED]
    transitions:
      - from: FILED
        to: MERIT_FOUND
        trigger: "POST /labor-relations/ulp-charges/{id}/determine with determination = MERIT"
        actor: BoardAgent
        preconditions:
          - "status == FILED"
          - "remedy_code is present in the request"
        side_effects:
          - "determined_at = logical clock, remedy_code written"
          - "blocking_charge_count is NOT decremented: a meritorious blocking charge keeps the case BLOCKED or IMPOUNDED until it is settled"
          - "when remedy_code == NOTICE_POSTING, Petition.notice_posting_end_at = determined_at + notice_posting_days days"
      - from: FILED
        to: DISMISSED
        trigger: "POST /labor-relations/ulp-charges/{id}/determine with determination = DISMISS"
        actor: BoardAgent
        preconditions:
          - "status == FILED"
        side_effects:
          - "determined_at = logical clock; when blocking_requested == true, Petition.blocking_charge_count -= 1 and the posture-unblock chain may fire"
      - from: MERIT_FOUND
        to: SETTLED
        trigger: "POST /labor-relations/ulp-charges/{id}/settle"
        actor: EmploymentCounsel
        preconditions:
          - "status IN {FILED, MERIT_FOUND}"
          - "settlement_type is present in the request"
        side_effects:
          - "settled_at = logical clock; when blocking_requested == true, Petition.blocking_charge_count -= 1"
          - "Petition.notice_posting_end_at = settled_at + notice_posting_days days when notice_posting_days > 0"
      - from: FILED
        to: SETTLED
        trigger: "POST /labor-relations/ulp-charges/{id}/settle before any determination"
        actor: EmploymentCounsel
        preconditions:
          - "status IN {FILED, MERIT_FOUND}"
          - "settlement_type is present in the request"
        side_effects:
          - "settled_at = logical clock; blocking_charge_count -= 1 when the charge was blocking"

concurrency_rules:
  - name: voter-list-create-stale-petition
    parent_entity: Petition
    child_entity: VoterList
    endpoint: "POST /labor-relations/voter-lists"
    version_field: "Petition.version"
    expected_version_param: expected_petition_version
    conflict_error_code: ERR_STALE_PETITION_VERSION
    conflict_http_status: 412
    rationale: >
      Creating an eligible voter list is only meaningful against the scope rulings and the
      election arrangement that were in force when the director read the case. Any intervening
      write to the Petition row - a reconsidered classification, a blocking charge that changed
      the posture, an objection ruling - invalidates the list the director is about to file.
    behavior:
      - "The request must carry expected_petition_version; when it is absent the request fails validation with ERR_INVALID_REQUEST (422)."
      - "The comparison happens after authentication, role and existence checks but before any business validation."
      - "When expected_petition_version != Petition.version the request fails with ERR_STALE_PETITION_VERSION (412) and nothing is written."
      - "On success any VoterList of this petition in DRAFT or DEFICIENT is SUPERSEDED, the new row is created with due_at copied from ElectionAgreement.voter_list_due_at, and Petition.version increments by exactly 1."
      - "Petition.version increments on every mutation of the Petition row, including the cascade-driven ones."
  - name: poll-session-create-stale-round
    parent_entity: ElectionRound
    child_entity: PollSession
    endpoint: "POST /labor-relations/poll-sessions"
    version_field: "ElectionRound.version"
    expected_version_param: expected_election_round_version
    conflict_error_code: ERR_STALE_ROUND_VERSION
    conflict_http_status: 412
    rationale: >
      Poll sessions are laid out against a round whose schedule, suspension state and session
      counts move underneath the planner. Overlap checks computed against a stale round would
      admit two crews at one location or resurrect sessions on a round that a blocking charge
      just suspended.
    behavior:
      - "The request must carry expected_election_round_version; when it is absent the request fails validation with ERR_INVALID_REQUEST (422)."
      - "When expected_election_round_version != ElectionRound.version the request fails with ERR_STALE_ROUND_VERSION (412) and no session is created."
      - "On success the session is created, ElectionRound.scheduled_session_count += 1 and ElectionRound.version increments by exactly 1, so a second create replayed with the same expected value conflicts."
      - "The location-overlap and observer-capacity checks run only after the version comparison succeeds."

calculations:
  - name: showing_of_interest_ratio
    entity: Petition
    trigger: "POST /labor-relations/petitions/{id}/verify-showing"
    inputs: [submitted_card_count, duplicate_card_count, undated_card_count, stale_card_count, nonunit_card_count, total_classified_headcount, included_headcount, pending_headcount, "every Classification.scope_ruling on the petition"]
    outputs: [valid_card_count, showing_of_interest_pct, showing_headcount_basis, showing_verdict]
    formula: |
      valid_card_count = submitted_card_count
                       - duplicate_card_count - undated_card_count
                       - stale_card_count - nonunit_card_count
      # Denominator variant selector (NOT caller-supplied):
      #   AS_RULED       when every Classification on the petition has scope_ruling != PENDING
      #   AS_PETITIONED  when at least one Classification is still PENDING (or MOOT)
      denominator = included_headcount                      # AS_RULED
      denominator = total_classified_headcount              # AS_PETITIONED
      showing_of_interest_pct = round(valid_card_count * 100 / denominator, 2)
      showing_verdict = SUFFICIENT if showing_of_interest_pct >= 30.00 else INSUFFICIENT
    variants:
      - name: AS_PETITIONED
        applies_when: "at least one Classification on the petition has scope_ruling IN {PENDING, MOOT}"
        denominator: total_classified_headcount
        note: "Scope is unresolved, so the Board tests the showing against the unit as the petition described it - every classified head counts, including the ones the employer wants excluded."
      - name: AS_RULED
        applies_when: "every Classification on the petition has scope_ruling IN {INCLUDED, EXCLUDED}"
        denominator: included_headcount
        note: "Once scope is ruled, only the classifications actually in the voting unit form the denominator, so excluding a large disputed group RAISES the percentage."
    precision: "showing_of_interest_pct is ROUND_HALF_UP to exactly 2 decimals; valid_card_count is an exact integer subtraction"
    boundaries:
      - "showing_of_interest_pct == 30.00 exactly is SUFFICIENT (the comparison is >=, not >)"
      - "denominator == 0 is not a 0-percent showing: the request fails with ERR_UNIT_HEADCOUNT_ZERO (422) before any write"
      - "valid_card_count < 0 (struck cards exceed submitted cards) fails with ERR_CARD_COUNTS_INCONSISTENT (422)"
    worked_examples:
      - "30 valid cards, 110 classified, all four classifications PENDING -> AS_PETITIONED, 30*100/110 = 27.2727... -> 27.27 -> INSUFFICIENT -> the petition is DISMISSED"
      - "30 valid cards, 90 included after two EXCLUDED rulings -> AS_RULED, 30*100/90 = 33.3333... -> 33.33 -> SUFFICIENT"
      - "27 valid cards, 90 included -> 30.00 exactly -> SUFFICIENT; 26 valid cards, 90 included -> 28.89 -> INSUFFICIENT"

  - name: core_wage_snapshot
    entity: Petition
    trigger: "POST /labor-relations/classifications/{id}/score - only on the FIRST such call for the petition"
    inputs: ["every Classification on the petition with employer_position == INCLUDE and union_position == INCLUDE", headcount, avg_hourly_wage_cents]
    outputs: [core_avg_hourly_wage_cents, core_wage_locked_at]
    formula: |
      core = [ c for c in classifications(petition)
               if c.employer_position == INCLUDE and c.union_position == INCLUDE ]
      core_avg_hourly_wage_cents = round( sum(c.headcount * c.avg_hourly_wage_cents for c in core)
                                          / sum(c.headcount for c in core) )
      core_wage_locked_at = logical clock
    precision: "ROUND_HALF_UP to a whole cent; the division is done once over the summed products, never as an average of per-classification averages"
    freeze_semantics: |
      The snapshot is written exactly once. Every later score call - including calls that happen after a
      scope ruling removed a classification from the core group, after a reconsideration put one back, or
      after a rerun was directed - reads the frozen core_avg_hourly_wage_cents. Recomputing it produces a
      different wage_proximity and therefore a different coi_score, which is the single most common way to
      get community_of_interest_score wrong.
    boundaries:
      - "if the core group is empty (no classification has both positions == INCLUDE) the first score call fails with ERR_NO_UNDISPUTED_CORE (422) and nothing is frozen"
      - "core_wage_locked_at is never overwritten once non-null"
    worked_examples:
      - "PROD 60 heads @ 2400 and MAINT 30 heads @ 3200 are the only classifications with both positions INCLUDE -> (60*2400 + 30*3200)/90 = 240000/90 = 2666.666... -> 2667 cents"
      - "Naive average of the two class averages would be (2400+3200)/2 = 2800 cents - wrong, the weights are headcounts"

  - name: community_of_interest_score
    entity: Classification
    trigger: "POST /labor-relations/classifications/{id}/score"
    inputs: [scoring_standard, supervision_overlap, skills_overlap, functional_integration, interchange_rate, work_conditions_overlap, avg_hourly_wage_cents, supervisory_authority_count, "Petition.core_avg_hourly_wage_cents (frozen)"]
    outputs: [wage_proximity, coi_score, scoring_standard, coi_recommendation]
    formula: |
      # Step 1 - the derived sixth factor, always computed the same way
      wage_gap_pct    = round(abs(avg_hourly_wage_cents - Petition.core_avg_hourly_wage_cents) * 100
                              / Petition.core_avg_hourly_wage_cents, 2)
      wage_proximity  = max(0.00, 100.00 - wage_gap_pct)

      # Step 2 - the formula SHAPE is selected by scoring_standard (mode selector)
      W = { supervision_overlap: 0.325, skills_overlap: 0.225, functional_integration: 0.175,
            interchange_rate: 0.125, work_conditions_overlap: 0.100, wage_proximity: 0.050 }
      weighted = sum( round(W[f] * value(f), 2) for f in W )      # per-term rounding, then sum

      mode TRADITIONAL: coi_score = weighted
      mode OVERWHELMING: coi_score = round(0.5 * weighted + 0.5 * min(value(f) for f in W), 2)
      mode ACCRETION:    coi_score = round(0.40 * functional_integration
                                         + 0.35 * interchange_rate
                                         + 0.25 * supervision_overlap, 2)

      # Step 3 - band mapping, also mode-dependent
      TRADITIONAL:  >= 65 -> SHARED_COMMUNITY; >= 45 -> CONTESTED_COMMUNITY; else DISTINCT_COMMUNITY
      OVERWHELMING: >= 80 -> SHARED_COMMUNITY; >= 60 -> CONTESTED_COMMUNITY; else DISTINCT_COMMUNITY
      ACCRETION:    >= 60 -> SHARED_COMMUNITY; >= 40 -> CONTESTED_COMMUNITY; else DISTINCT_COMMUNITY

      # Step 4 - statutory override, applied AFTER the band mapping
      if supervisory_authority_count >= 1:
          coi_recommendation = MANDATORY_EXCLUSION      # Section 2(11); coi_score is still stored
    modes:
      - id: TRADITIONAL
        shape: "plain weighted mean of all six factors"
        rationale: "the ordinary community-of-interest test, where a weak factor can be carried by strong ones"
      - id: OVERWHELMING
        shape: "half the weighted mean plus half the single weakest factor"
        rationale: "the overwhelming-community standard used when the petitioner seeks to add a group to an existing unit: the weakest link is dispositive, so the minimum factor carries half the score"
      - id: ACCRETION
        shape: "three-factor integration-only mean (functional integration 0.40, interchange 0.35, shared supervision 0.25); wages, skills and working conditions are ignored entirely"
        rationale: "accretion turns on operational integration with the existing unit, not on pay comparability"
    precision: |
      Each weighted term in the TRADITIONAL/OVERWHELMING shapes is rounded ROUND_HALF_UP to 2 decimals
      BEFORE the six terms are summed. Summing the unrounded products and rounding once at the end
      produces a different score (see the worked examples) and is wrong.
    boundaries:
      - "wage_proximity floors at 0.00 and never goes negative, even when the classification pays more than twice the core wage"
      - "supervisory_authority_count == 0 leaves the band mapping in force; == 1 already forces MANDATORY_EXCLUSION"
      - "a band comparison is >= at every edge: TRADITIONAL 65.00 is SHARED_COMMUNITY, 64.99 is CONTESTED_COMMUNITY"
    worked_examples:
      - "QC classification: 2900 cents against frozen core 2667 -> wage_gap_pct = 23300/2667 = 8.7364... -> 8.74 -> wage_proximity 91.26"
      - "QC TRADITIONAL with factors 41/55/61/21/71 and wage_proximity 91.26: terms 13.33 + 12.38 + 10.68 + 2.63 + 7.10 + 4.56 = 50.68 -> CONTESTED_COMMUNITY (sum-then-round would give 50.66 - wrong)"
      - "QC OVERWHELMING on identical inputs: 0.5*50.68 + 0.5*min(41,55,61,21,71,91.26) = 25.34 + 10.50 = 35.84 -> DISTINCT_COMMUNITY"
      - "QC ACCRETION on identical inputs: 0.40*61 + 0.35*21 + 0.25*41 = 24.40 + 7.35 + 10.25 = 42.00 -> CONTESTED_COMMUNITY"
      - "QC TRADITIONAL if the core wage were wrongly recomputed to 2400 after MAINT was excluded: wage_proximity 79.17 and coi_score 50.08 instead of 50.68"
      - "LEAD classification with factors 78/82/80/66/88, 2800 cents (wage_proximity 95.01) and supervisory_authority_count 4: coi_score 79.60 (a SHARED_COMMUNITY band) but coi_recommendation = MANDATORY_EXCLUSION"

  - name: voter_list_grading
    entity: VoterList
    trigger: "POST /labor-relations/voter-lists/{id}/submit and POST /labor-relations/voter-lists/{id}/resubmit"
    inputs: [total_entry_count, complete_entry_count, submitted_at, due_at]
    outputs: [completeness_pct, is_late, list_grade, eligible_voter_count]
    formula: |
      completeness_pct = round(complete_entry_count * 100 / total_entry_count, 2)
      base_grade = COMPLIANT          if completeness_pct == 100.00
                   MINOR_DEFECT       if completeness_pct >= 90.00
                   MATERIAL_DEFECT    if completeness_pct >= 75.00
                   GROSSLY_DEFICIENT  otherwise
      is_late = submitted_at > due_at
      # A late list is graded one tier worse; the tiers are ordered
      # COMPLIANT < MINOR_DEFECT < MATERIAL_DEFECT < GROSSLY_DEFICIENT
      list_grade = next_worse(base_grade) if is_late else base_grade
      cure window at review time: MINOR_DEFECT -> 48 h, MATERIAL_DEFECT -> 24 h,
                                  GROSSLY_DEFICIENT -> 0 h (REJECT, no cure), COMPLIANT -> null
    precision: "completeness_pct is ROUND_HALF_UP to 2 decimals; the tier comparisons run on the rounded value"
    boundaries:
      - "submitted_at == due_at exactly is ON TIME (is_late is false); one second later is late"
      - "completeness_pct == 90.00 exactly is MINOR_DEFECT, 89.99 is MATERIAL_DEFECT, 75.00 exactly is MATERIAL_DEFECT"
      - "a rounded 100.00 that came from 99.996 is impossible: completeness_pct only reaches 100.00 when complete_entry_count == total_entry_count"
      - "total_entry_count == 0 cannot be graded; submit fails with ERR_VOTER_LIST_EMPTY (422)"
    worked_examples:
      - "6 of 6 complete, on time -> 100.00 -> COMPLIANT"
      - "5 of 6 complete, on time -> 83.3333... -> 83.33 -> MATERIAL_DEFECT -> cure window 24 h"
      - "9 of 10 complete, on time -> 90.00 -> MINOR_DEFECT -> cure window 48 h"
      - "9 of 10 complete but LATE -> 90.00 -> base MINOR_DEFECT bumped to MATERIAL_DEFECT -> cure window 24 h"
      - "4 of 6 complete -> 66.67 -> GROSSLY_DEFICIENT -> REJECT with cure window 0"

  - name: voter_eligibility
    entity: VoterListEntry
    trigger: "POST /labor-relations/voter-list-entries and PATCH /labor-relations/voter-list-entries/{id}"
    inputs: [hire_date, termination_date, on_leave_type, home_address, personal_email, personal_phone, shift_code, work_location, "Classification.scope_ruling", "Petition.payroll_period_end", "ElectionAgreement.approved_election_date"]
    outputs: [is_statutory_content_complete, missing_field_count, eligibility_status, ineligibility_reason]
    formula: |
      missing_field_count = number of {home_address, personal_email, personal_phone, shift_code,
                                       work_location} that are absent, null or empty
      is_statutory_content_complete = (missing_field_count == 0)

      # Eligibility is decided in this fixed order; the first matching rule wins.
      1. Classification.scope_ruling == EXCLUDED            -> INELIGIBLE, OUTSIDE_UNIT
      2. hire_date > Petition.payroll_period_end            -> INELIGIBLE, HIRED_AFTER_PAYROLL_PERIOD
      3. termination_date is not null and
         termination_date < ElectionAgreement.approved_election_date
                                                            -> INELIGIBLE, TERMINATED_BEFORE_ELECTION
      4. on_leave_type == PERMANENT_LAYOFF                  -> INELIGIBLE, PERMANENT_LAYOFF
      5. Classification.scope_ruling == PENDING             -> CHALLENGED (ballot subject to challenge)
      6. otherwise                                          -> ELIGIBLE, ineligibility_reason = null
    precision: "all three comparisons are date comparisons (YYYY-MM-DD), not datetime comparisons; no timezone conversion is applied"
    boundaries:
      - "hire_date == payroll_period_end is ELIGIBLE: hired ON the eligibility cut-off is inside the period"
      - "termination_date == approved_election_date is ELIGIBLE: the last day worked is election day, so the voter is still employed when the polls open"
      - "on_leave_type IN {SICK, FMLA, MILITARY} never defeats eligibility"
      - "rule order matters: a voter in an EXCLUDED classification who was also hired late reports OUTSIDE_UNIT, not HIRED_AFTER_PAYROLL_PERIOD"
    worked_examples:
      - "hire_date 2026-08-14 with payroll_period_end 2026-08-14 -> ELIGIBLE"
      - "hire_date 2026-08-15 with payroll_period_end 2026-08-14 -> INELIGIBLE, HIRED_AFTER_PAYROLL_PERIOD"
      - "termination_date 2026-09-01 with approved_election_date 2026-09-01 -> ELIGIBLE; 2026-08-31 -> INELIGIBLE, TERMINATED_BEFORE_ELECTION"
      - "complete entry missing only personal_email -> missing_field_count 1, is_statutory_content_complete false, but eligibility is unaffected"

  - name: campaign_risk_score
    entity: CampaignCommunication
    trigger: "POST /labor-relations/campaign-communications/{id}/accuracy-review"
    inputs: [channel, audience_scope, threat_statement_count, contains_interrogation, contains_promise_of_benefit, contains_surveillance_reference, material_claim_count, unsupported_material_claim_count, planned_delivery_at, "the current ElectionRound.polls_open_at"]
    outputs: [risk_score, peerless_plywood_violation, accuracy_reviewed_at]
    formula: |
      base = { EMAIL: 5, LETTER: 5, DIGITAL_POST: 10,
               SMALL_GROUP_MEETING: 20, CAPTIVE_AUDIENCE_MEETING: 30 }[channel]
      raw = base
          + 15 * threat_statement_count
          + 12 * (1 if contains_interrogation else 0)
          + 10 * (1 if contains_promise_of_benefit else 0)
          +  8 * (1 if contains_surveillance_reference else 0)
          +  6 * max(0, unsupported_material_claim_count - 1)   # the first unsupported claim is free
          +  5 * (1 if audience_scope == UNIT_WIDE else 0)
      risk_score = min(100, raw)

      # Per-se rule, evaluated independently of the additive score
      peerless_plywood_violation =
          channel == CAPTIVE_AUDIENCE_MEETING
          and polls_open_at - 24 hours <= planned_delivery_at < polls_open_at
      if peerless_plywood_violation: risk_score = 100
    thresholds:
      - "risk_score >= 70 (RISK_ESCALATION_THRESHOLD): legal review may only APPROVE when escalation_ack == true"
      - "risk_score >= 90 (RISK_PROHIBITED_THRESHOLD): the message may not even be submitted for review (ERR_RISK_SCORE_PROHIBITED, 422)"
    precision: "risk_score is an exact integer; the clamp is applied once, after every additive term, and never per-term"
    boundaries:
      - "risk_score == 70 exactly requires escalation_ack (comparison is >=)"
      - "risk_score == 69 does not require it"
      - "risk_score == 90 exactly is prohibited, not merely escalated"
      - "unsupported_material_claim_count == 1 adds 0 (max(0, 1-1)); == 2 adds 6"
      - "unsupported_material_claim_count > material_claim_count fails with ERR_CLAIM_COUNTS_INCONSISTENT (422)"
      - "planned_delivery_at exactly 24 h before polls_open_at IS inside the blackout (window is closed at the lower edge, open at the upper: [open-24h, open))"
    worked_examples:
      - "SMALL_GROUP_MEETING, 2 threats, interrogation, surveillance, CLASSIFICATION scope, 1 unsupported claim: 20 + 30 + 12 + 0 + 8 + 0 + 0 = 70 -> escalation_ack required"
      - "CAPTIVE_AUDIENCE_MEETING, 1 threat, interrogation, 3 unsupported claims, CLASSIFICATION scope: 30 + 15 + 12 + 12 = 69 -> no ack required"
      - "CAPTIVE_AUDIENCE_MEETING, 2 threats, interrogation, promise, surveillance, CLASSIFICATION scope: 30 + 30 + 12 + 10 + 8 = 90 -> prohibited"
      - "CAPTIVE_AUDIENCE_MEETING, 3 threats, interrogation, promise, surveillance, 4 unsupported claims, UNIT_WIDE: 30 + 45 + 12 + 10 + 8 + 18 + 5 = 128 -> clamped to 100"
      - "EMAIL, 0 threats, delivered 3 h before the polls open: base 5, no per-se violation because the channel is not a captive-audience meeting"

  - name: ballot_tally
    entity: ElectionRound
    trigger: "POST /labor-relations/election-rounds/{id}/post-tally (PROVISIONAL) and POST /labor-relations/election-rounds/{id}/revise-tally (REVISED)"
    inputs: [provisional_votes_for, provisional_votes_against, provisional_void_count, challenged_open_count, challenged_counted_for_count, challenged_counted_against_count, challenged_voided_count, challenged_withdrawn_count, ballots_cast_total]
    outputs: [provisional_margin, revised_votes_for, revised_votes_against, revised_void_count, revised_margin, valid_votes_cast, majority_threshold, determinative_challenges]
    formula: |
      PROVISIONAL (post-tally):
        provisional_votes_for/against/void are accumulated from the CLOSED PollSession rows
        provisional_margin        = provisional_votes_for - provisional_votes_against
        valid_votes_cast          = provisional_votes_for + provisional_votes_against
        majority_threshold        = floor(valid_votes_cast / 2) + 1
        determinative_challenges  = challenged_open_count >= abs(provisional_margin)

      REVISED (revise-tally, only when challenged_open_count == 0):
        revised_votes_for     = provisional_votes_for     + challenged_counted_for_count
        revised_votes_against = provisional_votes_against + challenged_counted_against_count
        revised_void_count    = provisional_void_count    + challenged_voided_count
        revised_margin         = revised_votes_for - revised_votes_against
        valid_votes_cast       = revised_votes_for + revised_votes_against
        majority_threshold     = floor(valid_votes_cast / 2) + 1
        determinative_challenges is left at its provisional value (it is a historical finding)
    variants:
      - name: PROVISIONAL
        applies_when: "post-tally, immediately after the polls close and before any challenged ballot is resolved"
        note: "Challenged ballots are segregated: they are inside ballots_cast_total but outside valid_votes_cast, so the provisional majority_threshold is computed on a SMALLER base than the revised one."
      - name: REVISED
        applies_when: "revise-tally, after every challenged ballot of the round has left OPEN"
        note: "Counted challenges enter the vote columns and therefore RAISE valid_votes_cast and can raise majority_threshold; withdrawn challenges never enter any column."
    precision: "every field is an exact integer; majority_threshold uses floor division and then +1, so an even and an odd valid_votes_cast give thresholds 41 and 41 for 80 and 81 respectively"
    boundaries:
      - "challenged_open_count == abs(provisional_margin) exactly makes the challenges DETERMINATIVE (comparison is >=)"
      - "a provisional_margin of 0 makes any single open challenge determinative"
      - "withdrawn challenges are excluded from every vote column but stay inside ballots_cast_total"
    worked_examples:
      - "Sessions close with (30 for, 25 against, 1 void) and (12 for, 14 against, 0 void) -> provisional 42/39/1, margin 3, valid_votes_cast 81, majority_threshold 41"
      - "3 challenged ballots still OPEN with margin 3 -> 3 >= 3 -> determinative_challenges true"
      - "Resolving those 3 as COUNTED_FOR, COUNTED_FOR, VOIDED -> revised 44/39/2, margin 5, valid_votes_cast 83, majority_threshold 42; 44 >= 42 so the union prevails"
      - "ballots_cast_total stays 85 = 42 + 39 + 1 + 3 through every resolution and reopen"

  - name: deadline_schedule
    entity: [ElectionAgreement, ElectionRound, VoterList]
    trigger: "POST /labor-relations/election-agreements/{id}/stipulate, POST /labor-relations/election-agreements/{id}/direct-election, POST /labor-relations/election-rounds/{id}/post-tally, POST /labor-relations/voter-lists/{id}/review"
    inputs: [route, decision_date, "logical clock", tally_posted_at, list_grade, reviewed_at]
    outputs: [voter_list_due_at, objection_window_close_at, cure_window_hours, cure_deadline_at]
    formula: |
      BUSINESS_DAY_CALENDAR = Monday..Friday, excluding the fixed holiday set
                              {2026-09-07, 2026-11-26, 2026-11-27, 2026-12-25}
      add_business_days(anchor_date, n): step forward one calendar day at a time, counting only
                              business days, until n have been counted; the anchor day itself is
                              never counted even when it is a business day.
      end_of_day(d) = d at 23:59:59Z

      voter_list_due_at:
        route == STIPULATED -> end_of_day(add_business_days(date(logical clock at approval), 2))
        route == DIRECTED   -> end_of_day(add_business_days(decision_date, 2))
      objection_window_close_at = end_of_day(add_business_days(date(tally_posted_at), 7))
      cure_deadline_at = reviewed_at + cure_window_hours (exact hour arithmetic, no calendar skipping)
    variants:
      - name: STIPULATED
        applies_when: "the parties signed a stipulated election agreement"
        anchor: "the approval instant on the logical clock"
      - name: DIRECTED
        applies_when: "a hearing produced a Decision and Direction of Election"
        anchor: "the decision_date supplied with the direction, which may be earlier or later than the approval instant"
    precision: "all deadline instants end at 23:59:59Z; cure deadlines are exact-hour offsets and deliberately DO skip nothing, so a 24 h cure granted Friday afternoon expires Saturday afternoon"
    boundaries:
      - "a deadline exactly equal to the logical clock is still open (comparisons are <=)"
      - "holidays are skipped without consuming a count; a Saturday or Sunday likewise"
    worked_examples:
      - "Stipulated agreement approved 2026-08-20T15:00:00Z (Thursday): +2 business days = Friday 21st, Monday 24th -> voter_list_due_at 2026-08-24T23:59:59Z"
      - "Directed election with decision_date 2026-08-25 (Tuesday): Wednesday 26th, Thursday 27th -> voter_list_due_at 2026-08-27T23:59:59Z"
      - "Tally posted 2026-09-02T12:00:00Z (Wednesday): +7 business days skips Labor Day 2026-09-07 -> objection_window_close_at 2026-09-14T23:59:59Z"
      - "MATERIAL_DEFECT reviewed at 2026-08-21T18:00:00Z -> cure_window_hours 24 -> cure_deadline_at 2026-08-22T18:00:00Z (a Saturday: the cure clock does not respect business days)"

  - name: certification_timeline
    entity: Petition
    trigger: "POST /labor-relations/petitions/{id}/certify"
    inputs: [petition_type, "ElectionRound.revised_votes_for", "ElectionRound.majority_threshold", "logical clock"]
    outputs: [certification_outcome, certified_at, certified_round_id, bargaining_obligation_start_at, bargaining_obligation_end_at, certification_year_end_at, election_bar_end_at, decert_window_open_at]
    formula: |
      certified_at = logical clock
      union_prevailed = ElectionRound.revised_votes_for >= ElectionRound.majority_threshold

      variant REPRESENTATIVE (union_prevailed):
        certification_outcome          = CERTIFICATION_OF_REPRESENTATIVE
        bargaining_obligation_start_at = certified_at
        certification_year_end_at      = certified_at + 365 days
        decert_window_open_at          = certification_year_end_at
        election_bar_end_at            = null
        bargaining_obligation_end_at   = null

      variant RESULTS (not union_prevailed):
        certification_outcome          = CERTIFICATION_OF_RESULTS
        election_bar_end_at            = certified_at + 365 days
        bargaining_obligation_start_at = null
        certification_year_end_at      = null
        decert_window_open_at          = null
        bargaining_obligation_end_at   = certified_at when petition_type == RD, else null
    variants:
      - name: REPRESENTATIVE
        applies_when: "revised_votes_for >= majority_threshold"
        note: "The duty to bargain starts immediately and the insulated certification year runs 365 days; a decertification petition may only be filed once that year closes."
      - name: RESULTS
        applies_when: "revised_votes_for < majority_threshold"
        note: "No bargaining duty arises; a 12-month election bar runs instead, and on an RD petition the pre-existing bargaining duty terminates at certification."
    precision: "365 days is exact day arithmetic on the certified_at instant, preserving the time of day; no month arithmetic and no leap-year adjustment"
    boundaries:
      - "revised_votes_for == majority_threshold exactly is a union win (a tie on the raw ballots is a loss, because majority_threshold is already floor(valid/2)+1)"
      - "certification is blocked while notice_posting_end_at is in the future"
      - "the two variants write DISJOINT field sets; a field belonging to the other variant must be left null, not zero or copied"
    worked_examples:
      - "Revised 44 for, 39 against, majority_threshold 42, certified 2026-09-15T09:00:00Z -> CERTIFICATION_OF_REPRESENTATIVE, bargaining_obligation_start_at 2026-09-15T09:00:00Z, certification_year_end_at 2027-09-15T09:00:00Z, decert_window_open_at 2027-09-15T09:00:00Z, election_bar_end_at null"
      - "Revised 40 for, 43 against, majority_threshold 42, certified 2026-09-15T09:00:00Z -> CERTIFICATION_OF_RESULTS, election_bar_end_at 2027-09-15T09:00:00Z, certification_year_end_at null"

validations:
  # ---- 1-2: authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when X-User-Role == PlantSupervisor, X-User-ID equals the Supervisor.id addressed by the request (a supervisor may only read their own training record)"
    error_id: ERR_SUPERVISOR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "GET /labor-relations/supervisors/{id}, GET /labor-relations/campaign-communications"
  - priority: 4
    category: auth
    check: "the reviewing user is not the authoring user: X-User-ID != CampaignCommunication.authored_by_user_id even when both hold EmploymentCounsel"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /labor-relations/campaign-communications/{id}/review"

  # ---- 5: request schema ---------------------------------------------------
  - priority: 5
    category: business_constraint
    check: "request body parses, every required field is present, every enum value is in range, integers are integers, 0 <= factor <= 100, pagination limit is 1..100 and offset >= 0, and datetimes are ISO-8601 with a Z offset"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  # ---- 6-7: existence, path before body, left to right ---------------------
  - priority: 6
    category: existence
    check: "the entity addressed by the path {id} exists"
    error_id: "ERR_PETITION_NOT_FOUND | ERR_CLASSIFICATION_NOT_FOUND | ERR_ELECTION_AGREEMENT_NOT_FOUND | ERR_VOTER_LIST_NOT_FOUND | ERR_VOTER_LIST_ENTRY_NOT_FOUND | ERR_SUPERVISOR_NOT_FOUND | ERR_CAMPAIGN_COMMUNICATION_NOT_FOUND | ERR_ELECTION_ROUND_NOT_FOUND | ERR_POLL_SESSION_NOT_FOUND | ERR_CHALLENGED_BALLOT_NOT_FOUND | ERR_OBJECTION_NOT_FOUND | ERR_ULP_CHARGE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path {id}"
  - priority: 7
    category: existence
    check: "every FK in the request body resolves to an existing row, checked in the field order declared by the endpoint's input list"
    error_id: "the *_NOT_FOUND code of the referenced entity"
    http_status: 404
    applies_to: "every create endpoint and every action that names another entity in its body"

  # ---- 8: optimistic concurrency ------------------------------------------
  - priority: 8
    category: state
    check: "expected_petition_version equals Petition.version (voter-list create) and expected_election_round_version equals ElectionRound.version (poll-session create)"
    error_id: "ERR_STALE_PETITION_VERSION | ERR_STALE_ROUND_VERSION"
    http_status: 412
    applies_to: "POST /labor-relations/voter-lists, POST /labor-relations/poll-sessions"

  # ---- 9: referential coherence (rows exist but belong to the wrong case) --
  - priority: 9
    category: business_referential
    check: "every entity named in the request belongs to the same Petition: Classification.petition_id == VoterList.petition_id for a voter-list entry, ElectionAgreement.petition_id == VoterList.petition_id, Supervisor.petition_id == CampaignCommunication.petition_id for the presenter and for a designated observer, Objection.election_round_id's round belongs to the ULP charge's petition"
    error_id: ERR_CROSS_PETITION_REFERENCE
    http_status: 409
    applies_to: "POST /labor-relations/voter-list-entries, POST /labor-relations/voter-lists, POST /labor-relations/campaign-communications, POST /labor-relations/poll-sessions/{id}/designate-observer, POST /labor-relations/ulp-charges, POST /labor-relations/challenged-ballots"
  - priority: 10
    category: business_referential
    check: "the ChallengedBallot's voter_list_entry_id, when supplied, belongs to a VoterList whose status is ACCEPTED for the same petition as the PollSession's round"
    error_id: ERR_BALLOT_VOTER_NOT_ON_ACCEPTED_LIST
    http_status: 409
    applies_to: "POST /labor-relations/challenged-ballots"

  # ---- 11: case posture gate (second state dimension) ---------------------
  - priority: 11
    category: state
    check: "Petition.case_posture == OPEN before any write that advances the election: opening polls, closing sessions, posting or revising a tally, submitting or reviewing a voter list, delivering a communication, scheduling a rerun, certifying"
    error_id: ERR_CASE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /labor-relations/election-rounds/{id}/open-polls, POST /labor-relations/poll-sessions/{id}/close, POST /labor-relations/election-rounds/{id}/post-tally, POST /labor-relations/election-rounds/{id}/revise-tally, POST /labor-relations/voter-lists/{id}/submit, POST /labor-relations/voter-lists/{id}/review, POST /labor-relations/campaign-communications/{id}/deliver, POST /labor-relations/petitions/{id}/schedule-rerun, POST /labor-relations/petitions/{id}/certify"

  # ---- 12-13: state preconditions ----------------------------------------
  - priority: 12
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_PETITION_STATUS_INVALID | ERR_CLASSIFICATION_ALREADY_RULED | ERR_AGREEMENT_STATUS_INVALID | ERR_VOTER_LIST_STATUS_INVALID | ERR_COMMUNICATION_STATUS_INVALID | ERR_ROUND_NOT_SCHEDULED | ERR_ROUND_STATUS_INVALID | ERR_POLL_SESSION_STATUS_INVALID | ERR_BALLOT_STATUS_INVALID | ERR_OBJECTION_ALREADY_RULED | ERR_CHARGE_STATUS_INVALID"
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 13
    category: state
    check: "cross-entity state prerequisites hold: an unscored Classification cannot be ruled, a round cannot open polls without an ACCEPTED VoterList, a tally cannot be posted while ballots_impounded is true, a tally cannot be revised while challenged_open_count > 0, an election cannot be certified unless the named round is TALLY_REVISED, a communication cannot be submitted for review before its accuracy review, and a meeting-channel communication cannot be submitted while its presenter is UNTRAINED"
    error_id: "ERR_CLASSIFICATION_NOT_SCORED | ERR_VOTER_LIST_NOT_ACCEPTED | ERR_BALLOTS_IMPOUNDED | ERR_CHALLENGES_UNRESOLVED | ERR_ROUND_NOT_REVISED | ERR_ACCURACY_REVIEW_MISSING | ERR_PRESENTER_NOT_TRAINED"
    http_status: 409
    applies_to: "POST /labor-relations/classifications/{id}/rule, POST /labor-relations/election-rounds/{id}/open-polls, POST /labor-relations/election-rounds/{id}/post-tally, POST /labor-relations/election-rounds/{id}/revise-tally, POST /labor-relations/petitions/{id}/certify, POST /labor-relations/campaign-communications/{id}/submit-for-review"

  # ---- 14-16: safety / statutory compliance (beats every later layer) -----
  - priority: 14
    category: business_safety
    check: "a CAPTIVE_AUDIENCE_MEETING may not be delivered inside the 24 hours immediately before the polls open (Peerless Plywood): peerless_plywood_violation must be false"
    error_id: ERR_PEERLESS_PLYWOOD_WINDOW
    http_status: 422
    applies_to: "POST /labor-relations/campaign-communications/{id}/submit-for-review, POST /labor-relations/campaign-communications/{id}/review, POST /labor-relations/campaign-communications/{id}/deliver"
  - priority: 15
    category: business_safety
    check: "risk_score < 90 to submit at all, and escalation_ack == true to APPROVE anything scoring 70 or more"
    error_id: "ERR_RISK_SCORE_PROHIBITED | ERR_ESCALATION_ACK_REQUIRED"
    http_status: 422
    applies_to: "POST /labor-relations/campaign-communications/{id}/submit-for-review, POST /labor-relations/campaign-communications/{id}/review"
  - priority: 16
    category: business_safety
    check: "a Section 2(11) supervisor may never be designated as an election observer, and a supervisor whose training_status is UNTRAINED may never present a meeting-channel message"
    error_id: ERR_SUPERVISOR_OBSERVER_PROHIBITED
    http_status: 422
    applies_to: "POST /labor-relations/poll-sessions/{id}/designate-observer"

  # ---- 17-19: temporal windows -------------------------------------------
  - priority: 17
    category: business_temporal
    check: "a communication may only be delivered while the campaign period is open: the logical clock is before the current round's polls_close_at and the round is SCHEDULED or POLLS_OPEN"
    error_id: ERR_CAMPAIGN_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /labor-relations/campaign-communications/{id}/deliver"
  - priority: 18
    category: business_temporal
    check: "the voter list is submitted at or before due_at unless the request carries late_submission_ack = true, a cure resubmission arrives at or before cure_deadline_at, and polls are not opened before polls_open_at"
    error_id: "ERR_VOTER_LIST_PAST_DUE | ERR_CURE_WINDOW_EXPIRED | ERR_POLLS_NOT_YET_OPEN"
    http_status: 409
    applies_to: "POST /labor-relations/voter-lists/{id}/submit, POST /labor-relations/voter-lists/{id}/resubmit, POST /labor-relations/election-rounds/{id}/open-polls"
  - priority: 19
    category: business_temporal
    check: "an objection is filed at or before ElectionRound.objection_window_close_at, and certification happens strictly after it"
    error_id: "ERR_OBJECTION_WINDOW_CLOSED | ERR_OBJECTION_WINDOW_OPEN"
    http_status: 409
    applies_to: "POST /labor-relations/objections, POST /labor-relations/petitions/{id}/certify"
  - priority: 20
    category: business_temporal
    check: "certification is refused while a ULP settlement notice is still posted: notice_posting_end_at is null or at/before the logical clock"
    error_id: ERR_NOTICE_POSTING_ACTIVE
    http_status: 409
    applies_to: "POST /labor-relations/petitions/{id}/certify"

  # ---- 21-24: constraint satisfaction (overlap, uniqueness, limits) -------
  - priority: 21
    category: business_constraint
    check: "two PollSession rows at the same location_code for the same round may not overlap on the half-open interval [session_start_at, session_end_at + 30 minutes): a session may start exactly 30 minutes after the previous one ends, but not one second earlier"
    error_id: ERR_POLL_SESSION_LOCATION_CONFLICT
    http_status: 409
    applies_to: "POST /labor-relations/poll-sessions"
  - priority: 22
    category: business_constraint
    check: "two meeting-channel CampaignCommunication rows with the same presenter_supervisor_id may not overlap on the CLOSED, symmetrically padded interval [planned_delivery_at - 60 minutes, planned_delivery_at + duration_minutes + 60 minutes]: touching endpoints conflict"
    error_id: ERR_PRESENTER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /labor-relations/campaign-communications"
  - priority: 23
    category: business_constraint
    check: "uniqueness: Petition.case_number is globally unique, Classification.code is unique per petition, one non-terminal VoterList per petition, one open ElectionAgreement per petition, one ChallengedBallot per (poll_session_id, voter_list_entry_id), one Supervisor per (petition_id, full_name, job_title)"
    error_id: "ERR_DUPLICATE_CASE_NUMBER | ERR_DUPLICATE_CLASSIFICATION_CODE | ERR_DUPLICATE_CHALLENGED_BALLOT | ERR_DUPLICATE_SUPERVISOR"
    http_status: 409
    applies_to: "POST /labor-relations/petitions, POST /labor-relations/classifications, POST /labor-relations/challenged-ballots, POST /labor-relations/supervisors"
  - priority: 24
    category: business_constraint
    check: "loop limits: revision_round < MAX_REVISION_ROUNDS before another REQUEST_REVISION, resubmission_count < MAX_LIST_RESUBMISSIONS before another cure resubmission, reopen_count < MAX_BALLOT_REOPENS before another reopen"
    error_id: "ERR_REVISION_LIMIT_EXCEEDED | ERR_RESUBMISSION_LIMIT_EXCEEDED | ERR_REOPEN_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "POST /labor-relations/campaign-communications/{id}/review, POST /labor-relations/voter-lists/{id}/resubmit, POST /labor-relations/challenged-ballots/{id}/reopen"

  # ---- 25-27: numeric coherence and capacity (last) ----------------------
  - priority: 25
    category: business_constraint
    check: "arithmetic coherence of caller-supplied counts: struck cards may not exceed submitted cards, unsupported_material_claim_count <= material_claim_count, the closed sessions' ballot counts must reconcile with the round's ballots_cast_total, and the denominator of the showing ratio must be greater than zero"
    error_id: "ERR_CARD_COUNTS_INCONSISTENT | ERR_CLAIM_COUNTS_INCONSISTENT | ERR_TALLY_RECONCILIATION_FAILED | ERR_UNIT_HEADCOUNT_ZERO"
    http_status: 422
    applies_to: "POST /labor-relations/petitions/{id}/verify-showing, POST /labor-relations/campaign-communications/{id}/accuracy-review, POST /labor-relations/election-rounds/{id}/post-tally"
  - priority: 26
    category: business_fiscal
    check: "observer capacity: each party may designate at most MAX_OBSERVERS_PER_PARTY (3) observers per poll session, counted separately for the employer and the union"
    error_id: ERR_OBSERVER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /labor-relations/poll-sessions/{id}/designate-observer"
  - priority: 27
    category: business_fiscal
    check: "conservation invariants hold after the write: included + excluded + pending == total_classified_headcount on the Petition, and the nine ballot buckets sum to ballots_cast_total on the ElectionRound; a request that would break either is rejected and nothing is written"
    error_id: "ERR_HEADCOUNT_CONSERVATION_VIOLATION | ERR_BALLOT_CONSERVATION_VIOLATION"
    http_status: 409
    applies_to: "POST /labor-relations/classifications/{id}/rule, POST /labor-relations/classifications/{id}/reconsider, POST /labor-relations/challenged-ballots/{id}/resolve, POST /labor-relations/challenged-ballots/{id}/reopen"

validation_priority_conflicts:
  - name: safety-beats-temporal
    request: "POST /labor-relations/campaign-communications/{id}/deliver on an APPROVED captive-audience message whose planned_delivery_at sits inside the 24-hour blackout, submitted after the polls have already closed"
    violated:
      - "priority 14, business_safety, ERR_PEERLESS_PLYWOOD_WINDOW (422)"
      - "priority 17, business_temporal, ERR_CAMPAIGN_PERIOD_CLOSED (409)"
    winner: ERR_PEERLESS_PLYWOOD_WINDOW
    winner_http_status: 422
    rationale: "A per-se statutory violation is reported before a mere scheduling-window failure; the categories differ (business_safety vs business_temporal) and so does the status code."
  - name: state-beats-constraint
    request: "POST /labor-relations/poll-sessions naming a round that a blocking charge already SUSPENDED, with a location and time window that also collide with an existing session at that location"
    violated:
      - "priority 12, state, ERR_ROUND_NOT_SCHEDULED (409)"
      - "priority 21, business_constraint, ERR_POLL_SESSION_LOCATION_CONFLICT (409)"
    winner: ERR_ROUND_NOT_SCHEDULED
    winner_http_status: 409
    rationale: "The round cannot host any session at all, so the overlap question is moot; both are 409 but the categories differ (state vs business_constraint), which forces the implementation to order the checks rather than pick by status code."
  - name: referential-beats-fiscal
    request: "POST /labor-relations/poll-sessions/{id}/designate-observer naming a Supervisor from a different petition, for a party that already has three observers on that session"
    violated:
      - "priority 9, business_referential, ERR_CROSS_PETITION_REFERENCE (409)"
      - "priority 26, business_fiscal, ERR_OBSERVER_CAPACITY_EXCEEDED (409)"
    winner: ERR_CROSS_PETITION_REFERENCE
    winner_http_status: 409
    rationale: "A person who is not part of this case can never occupy a seat, so the seat count is never consulted."
  - name: posture-beats-safety
    request: "POST /labor-relations/campaign-communications/{id}/deliver while the case is BLOCKED by a ULP charge, on a message that also scores 100 for a per-se blackout violation"
    violated:
      - "priority 11, state, ERR_CASE_POSTURE_BLOCKED (409)"
      - "priority 14, business_safety, ERR_PEERLESS_PLYWOOD_WINDOW (422)"
    winner: ERR_CASE_POSTURE_BLOCKED
    winner_http_status: 409
    rationale: "The posture gate is a state check on the parent case and runs before any message-level compliance analysis."

constants:
  RISK_ESCALATION_THRESHOLD: 70
  RISK_PROHIBITED_THRESHOLD: 90
  SHOWING_OF_INTEREST_THRESHOLD_PCT: 30.00
  TRADITIONAL_SHARED_BAND: 65
  TRADITIONAL_CONTESTED_BAND: 45
  OVERWHELMING_SHARED_BAND: 80
  OVERWHELMING_CONTESTED_BAND: 60
  ACCRETION_SHARED_BAND: 60
  ACCRETION_CONTESTED_BAND: 40
  TRAINING_PASS_SCORE: 80
  REQUIRED_TRAINING_MODULES: [TIPS_BOUNDARIES, PROHIBITED_CONDUCT, SOLICITATION_RULES]
  MAX_REVISION_ROUNDS: 3
  MAX_LIST_RESUBMISSIONS: 2
  MAX_BALLOT_REOPENS: 2
  MAX_OBSERVERS_PER_PARTY: 3
  VOTER_LIST_BUSINESS_DAYS: 2
  OBJECTION_WINDOW_BUSINESS_DAYS: 7
  CERTIFICATION_YEAR_DAYS: 365
  ELECTION_BAR_DAYS: 365
  PEERLESS_PLYWOOD_HOURS: 24
  POLL_SESSION_TEARDOWN_MINUTES: 30
  PRESENTER_TRAVEL_BUFFER_MINUTES: 60
  CURE_HOURS_MINOR_DEFECT: 48
  CURE_HOURS_MATERIAL_DEFECT: 24
  HOLIDAY_CALENDAR: ["2026-09-07", "2026-11-26", "2026-11-27", "2026-12-25"]
  CLOCK_STARTUP_DEFAULT: "2026-08-01T00:00:00Z"

endpoints:
  # ------------------------------------------------------------------ clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every deadline, blackout window and certification-timeline rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time."
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, SupervisorTrainer, PlantSupervisor, BoardAgent, UnionRepresentative]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["every subsequent temporal comparison uses the new instant"]

  # -------------------------------------------------------------- petitions
  - method: POST
    path: "/labor-relations/petitions"
    description: "Docket a representation petition served on the employer"
    roles: [LaborRelationsDirector]
    code: 201
    input: [case_number, petition_type, union_name, filed_date, proposed_unit_description, claimed_employee_count, payroll_period_end]
    output: Petition
    side_effects: ["case_status = RECEIVED, case_posture = OPEN, all headcount and card counters 0"]
  - method: GET
    path: "/labor-relations/petitions"
    description: "List petitions, optionally filtered by lifecycle dimension or by the round a certification rests on"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, SupervisorTrainer, BoardAgent, UnionRepresentative]
    code: 200
    input: ["case_status?", "case_posture?", "certified_round_id?", "limit?", "offset?"]
    output: Petition[]
    side_effects: []
  - method: GET
    path: "/labor-relations/petitions/{id}"
    description: "Read one petition, including both state dimensions, the headcount buckets and the certification timeline"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, SupervisorTrainer, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: Petition
    side_effects: []
  - method: POST
    path: "/labor-relations/petitions/{id}/open-scope-analysis"
    description: "Move the case into bargaining-unit scope analysis so classifications may be scored and ruled"
    roles: [LaborRelationsDirector]
    code: 200
    input: []
    output: Petition
    side_effects: ["case_status = SCOPE_ANALYSIS"]
  - method: POST
    path: "/labor-relations/petitions/{id}/verify-showing"
    description: "Record the authorization-card audit and run showing_of_interest_ratio; an INSUFFICIENT verdict dismisses the petition and cascades"
    roles: [BoardAgent]
    code: 200
    input: [submitted_card_count, duplicate_card_count, undated_card_count, stale_card_count, nonunit_card_count]
    output: Petition
    side_effects: ["showing_of_interest_ratio", "case_status -> SOI_VERIFIED or DISMISSED", "three-hop dismissal cascade over Classification, ElectionAgreement, CampaignCommunication and VoterList"]
  - method: POST
    path: "/labor-relations/petitions/{id}/schedule-rerun"
    description: "Schedule the rerun election after an objection was sustained and the prior round was set aside"
    roles: [BoardAgent]
    code: 201
    input: [rerun_election_date, voting_method, polls_open_at, polls_close_at]
    output: ElectionRound
    side_effects: ["creates the next ElectionRound with prior_round_id pointing at the SET_ASIDE round", "case_status = ELECTION_SET"]
  - method: POST
    path: "/labor-relations/petitions/{id}/certify"
    description: "Issue the certification on the named round's revised tally and write the bargaining, bar and decertification timestamps"
    roles: [BoardAgent]
    code: 200
    input: [election_round_id]
    output: Petition
    side_effects: ["certification_timeline", "case_status = CERTIFIED", "named ElectionRound.status = ROUND_CERTIFIED"]

  # --------------------------------------------------------- classifications
  - method: POST
    path: "/labor-relations/classifications"
    description: "Add a job classification to the scope analysis with both parties' asserted positions and the five community-of-interest factors"
    roles: [LaborRelationsDirector, HRDataAnalyst]
    code: 201
    input: [petition_id, code, title, headcount, avg_hourly_wage_cents, shift_code, work_location, "supervisory_authority_count?", employer_position, union_position, supervision_overlap, skills_overlap, functional_integration, interchange_rate, work_conditions_overlap]
    output: Classification
    side_effects: ["Petition.total_classified_headcount += headcount and Petition.pending_headcount += headcount", "Petition.version increments"]
  - method: GET
    path: "/labor-relations/classifications"
    description: "List classifications, filtered by petition or by scope ruling"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["petition_id?", "scope_ruling?", "limit?", "offset?"]
    output: Classification[]
    side_effects: []
  - method: GET
    path: "/labor-relations/classifications/{id}"
    description: "Read one classification with its score, derived wage proximity and ruling"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: Classification
    side_effects: []
  - method: POST
    path: "/labor-relations/classifications/{id}/score"
    description: "Run community_of_interest_score under the requested standard; the first call for the petition also freezes the core wage snapshot"
    roles: [LaborRelationsDirector, EmploymentCounsel]
    code: 200
    input: [scoring_standard]
    output: Classification
    side_effects: ["core_wage_snapshot on the first call only", "community_of_interest_score", "Petition.version increments on the freezing call"]
  - method: POST
    path: "/labor-relations/classifications/{id}/rule"
    description: "Board ruling that puts the classification inside or outside the voting unit"
    roles: [BoardAgent]
    code: 200
    input: [ruling, ruling_rationale]
    output: Classification
    side_effects: ["moves headcount between Petition.pending_headcount and included/excluded", "unit_headcount_conservation re-checked", "Petition.version increments"]
  - method: POST
    path: "/labor-relations/classifications/{id}/reconsider"
    description: "Compensating action that returns a ruled classification to PENDING and reverses the headcount movement"
    roles: [BoardAgent]
    code: 200
    input: ["reconsideration_note?"]
    output: Classification
    side_effects: ["reverses the exact headcount movement made by the ruling", "Petition.version increments"]

  # ------------------------------------------------------ election agreements
  - method: POST
    path: "/labor-relations/election-agreements"
    description: "Open the election-arrangement file for the case with the proposed date and voting method"
    roles: [LaborRelationsDirector]
    code: 201
    input: [petition_id, agreement_type, proposed_election_date, proposed_voting_method]
    output: ElectionAgreement
    side_effects: ["status = PROPOSED"]
  - method: GET
    path: "/labor-relations/election-agreements"
    description: "List election agreements for a petition"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["petition_id?", "status?", "limit?", "offset?"]
    output: ElectionAgreement[]
    side_effects: []
  - method: GET
    path: "/labor-relations/election-agreements/{id}"
    description: "Read one election agreement including the route taken and the voter-list deadline it produced"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: ElectionAgreement
    side_effects: []
  - method: POST
    path: "/labor-relations/election-agreements/{id}/stipulate"
    description: "Approve a stipulated election agreement; anchors the voter-list deadline on the approval instant and schedules round 1"
    roles: [BoardAgent]
    code: 200
    input: [approved_election_date, voting_method, polls_open_at, polls_close_at]
    output: ElectionAgreement
    side_effects: ["deadline_schedule STIPULATED variant", "creates ElectionRound round_number 1", "Petition.case_status = ELECTION_SET"]
  - method: POST
    path: "/labor-relations/election-agreements/{id}/request-hearing"
    description: "Either party refuses to stipulate and demands a representation hearing"
    roles: [LaborRelationsDirector, UnionRepresentative]
    code: 200
    input: [hearing_requested_by_party]
    output: ElectionAgreement
    side_effects: ["status = HEARING_REQUESTED, no round scheduled, voter_list_due_at stays null"]
  - method: POST
    path: "/labor-relations/election-agreements/{id}/direct-election"
    description: "Issue a Decision and Direction of Election after the hearing; anchors the voter-list deadline on decision_date and schedules round 1"
    roles: [BoardAgent]
    code: 200
    input: [decision_date, approved_election_date, voting_method, polls_open_at, polls_close_at]
    output: ElectionAgreement
    side_effects: ["deadline_schedule DIRECTED variant", "creates ElectionRound round_number 1", "Petition.case_status = ELECTION_SET"]

  # ------------------------------------------------------------- voter lists
  - method: POST
    path: "/labor-relations/voter-lists"
    description: "Open a new eligible-voter list against a read-consistent petition version; supersedes any list still in DRAFT or DEFICIENT"
    roles: [LaborRelationsDirector, HRDataAnalyst]
    code: 201
    input: [petition_id, election_agreement_id, expected_petition_version]
    output: VoterList
    side_effects: ["optimistic concurrency check on Petition.version", "due_at copied from ElectionAgreement.voter_list_due_at", "supersedes prior DRAFT/DEFICIENT lists", "Petition.version increments"]
  - method: GET
    path: "/labor-relations/voter-lists"
    description: "List eligible-voter lists for a petition or for an election agreement"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["petition_id?", "election_agreement_id?", "status?", "limit?", "offset?"]
    output: VoterList[]
    side_effects: []
  - method: GET
    path: "/labor-relations/voter-lists/{id}"
    description: "Read one voter list with its completeness grade, lateness flag and cure window"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: VoterList
    side_effects: []
  - method: POST
    path: "/labor-relations/voter-lists/{id}/submit"
    description: "Attest and file the list with the Board; grades statutory content and lateness"
    roles: [LaborRelationsDirector]
    code: 200
    input: [attested_by_title, "late_submission_ack?"]
    output: VoterList
    side_effects: ["voter_list_grading", "status = SUBMITTED"]
  - method: POST
    path: "/labor-relations/voter-lists/{id}/resubmit"
    description: "File a cured list inside the cure window; regrades from the current entries"
    roles: [LaborRelationsDirector]
    code: 200
    input: [attested_by_title]
    output: VoterList
    side_effects: ["resubmission_count += 1", "voter_list_grading re-runs", "status = SUBMITTED"]
  - method: POST
    path: "/labor-relations/voter-lists/{id}/review"
    description: "Board review of a filed list: accept, return for cure with a grade-driven window, or reject outright"
    roles: [BoardAgent]
    code: 200
    input: [disposition, "noted_defects?"]
    output: VoterList
    side_effects: ["status -> ACCEPTED, DEFICIENT or REJECTED", "cure_window_hours and cure_deadline_at written by deadline_schedule"]

  # ------------------------------------------------------ voter list entries
  - method: POST
    path: "/labor-relations/voter-list-entries"
    description: "Add one voter to the list with the statutory content fields and run the eligibility rules"
    roles: [HRDataAnalyst, LaborRelationsDirector]
    code: 201
    input: [voter_list_id, classification_id, full_name, hire_date, "termination_date?", "home_address?", "personal_email?", "personal_phone?", "shift_code?", "work_location?", "on_leave_type?"]
    output: VoterListEntry
    side_effects: ["voter_eligibility", "VoterList.total_entry_count, complete_entry_count and eligible_voter_count recomputed"]
  - method: GET
    path: "/labor-relations/voter-list-entries"
    description: "List voter entries for a list, a classification, or an eligibility outcome"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["voter_list_id?", "classification_id?", "eligibility_status?", "limit?", "offset?"]
    output: VoterListEntry[]
    side_effects: []
  - method: GET
    path: "/labor-relations/voter-list-entries/{id}"
    description: "Read one voter entry with its statutory-content completeness and eligibility outcome"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: VoterListEntry
    side_effects: []
  - method: PATCH
    path: "/labor-relations/voter-list-entries/{id}"
    description: "Cure a voter entry's missing statutory content or correct its employment dates"
    roles: [HRDataAnalyst, LaborRelationsDirector]
    code: 200
    input: ["home_address?", "personal_email?", "personal_phone?", "shift_code?", "work_location?", "termination_date?", "on_leave_type?"]
    output: VoterListEntry
    side_effects: ["voter_eligibility re-runs", "parent VoterList counters recomputed"]

  # ------------------------------------------------------------- supervisors
  - method: POST
    path: "/labor-relations/supervisors"
    description: "Register a supervisor who will be trained on lawful campaign communication"
    roles: [SupervisorTrainer, LaborRelationsDirector]
    code: 201
    input: [petition_id, full_name, job_title, span_of_control, has_hire_fire_authority]
    output: Supervisor
    side_effects: ["training_status = UNTRAINED"]
  - method: GET
    path: "/labor-relations/supervisors"
    description: "List supervisors for a petition or by training status"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, SupervisorTrainer, BoardAgent]
    code: 200
    input: ["petition_id?", "training_status?", "limit?", "offset?"]
    output: Supervisor[]
    side_effects: []
  - method: GET
    path: "/labor-relations/supervisors/{id}"
    description: "Read one supervisor's training and conduct record; a PlantSupervisor may only read their own row"
    roles: [LaborRelationsDirector, EmploymentCounsel, SupervisorTrainer, PlantSupervisor, BoardAgent]
    code: 200
    input: []
    output: Supervisor
    side_effects: []
  - method: POST
    path: "/labor-relations/supervisors/{id}/train"
    description: "Record a training attempt; certification is granted only when every required module is present and the quiz score clears the pass mark"
    roles: [SupervisorTrainer]
    code: 200
    input: [modules_completed, quiz_score]
    output: Supervisor
    side_effects: ["training_attempt_count += 1", "training_status -> TRAINED on a passing attempt, unchanged on a failing one"]
  - method: POST
    path: "/labor-relations/supervisors/{id}/record-violation"
    description: "Record a prohibited-conduct finding; a substantiated finding decertifies the supervisor and cascades to their pending messages"
    roles: [EmploymentCounsel]
    code: 200
    input: [violation_code, substantiated]
    output: Supervisor
    side_effects: ["violation_count += 1", "training_status = UNTRAINED", "presenter cascade blocks their PENDING_LEGAL_REVIEW and APPROVED messages", "Petition.retraining_required = true"]

  # ------------------------------------------------ campaign communications
  - method: POST
    path: "/labor-relations/campaign-communications"
    description: "Draft a campaign message and reserve the presenter's calendar with travel buffers"
    roles: [LaborRelationsDirector]
    code: 201
    input: [petition_id, "presenter_supervisor_id?", channel, audience_scope, planned_delivery_at, "duration_minutes?", message_summary, "threat_statement_count?", "contains_interrogation?", "contains_promise_of_benefit?", "contains_surveillance_reference?", "material_claim_count?", "unsupported_material_claim_count?"]
    output: CampaignCommunication
    side_effects: ["status = DRAFT, authored_by_user_id = X-User-ID", "presenter overlap check for meeting channels"]
  - method: GET
    path: "/labor-relations/campaign-communications"
    description: "List campaign messages for a petition or a presenter; a PlantSupervisor may only filter to their own presenter id"
    roles: [LaborRelationsDirector, EmploymentCounsel, SupervisorTrainer, PlantSupervisor, BoardAgent]
    code: 200
    input: ["petition_id?", "presenter_supervisor_id?", "status?", "limit?", "offset?"]
    output: CampaignCommunication[]
    side_effects: []
  - method: GET
    path: "/labor-relations/campaign-communications/{id}"
    description: "Read one campaign message with its risk score, per-se blackout flag and review history"
    roles: [LaborRelationsDirector, EmploymentCounsel, SupervisorTrainer, BoardAgent]
    code: 200
    input: []
    output: CampaignCommunication
    side_effects: []
  - method: POST
    path: "/labor-relations/campaign-communications/{id}/accuracy-review"
    description: "Record the factual-accuracy review and compute the campaign risk score and the per-se blackout flag"
    roles: [LaborRelationsDirector, HRDataAnalyst]
    code: 200
    input: [material_claim_count, unsupported_material_claim_count]
    output: CampaignCommunication
    side_effects: ["campaign_risk_score", "accuracy_reviewed_at = logical clock"]
  - method: POST
    path: "/labor-relations/campaign-communications/{id}/submit-for-review"
    description: "Send an accuracy-reviewed message into legal review; also used to re-submit after a revision"
    roles: [LaborRelationsDirector]
    code: 200
    input: []
    output: CampaignCommunication
    side_effects: ["status = PENDING_LEGAL_REVIEW", "reviewed_by_user_id cleared"]
  - method: POST
    path: "/labor-relations/campaign-communications/{id}/review"
    description: "Counsel approves the message or returns it for revision; the author may never be the reviewer"
    roles: [EmploymentCounsel]
    code: 200
    input: [disposition, "escalation_ack?", "review_note?"]
    output: CampaignCommunication
    side_effects: ["status -> APPROVED or REVISION_REQUIRED", "revision_round += 1 on a revision request"]
  - method: POST
    path: "/labor-relations/campaign-communications/{id}/deliver"
    description: "Confirm delivery of an approved message inside the lawful campaign window"
    roles: [LaborRelationsDirector]
    code: 200
    input: []
    output: CampaignCommunication
    side_effects: ["status = DELIVERED, delivered_at = logical clock"]

  # ---------------------------------------------------------- election rounds
  - method: GET
    path: "/labor-relations/election-rounds"
    description: "List election rounds for a petition, for an agreement, or the rerun that replaced a given round"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["petition_id?", "election_agreement_id?", "prior_round_id?", "status?", "limit?", "offset?"]
    output: ElectionRound[]
    side_effects: []
  - method: GET
    path: "/labor-relations/election-rounds/{id}"
    description: "Read one round with its provisional and revised tallies, challenge buckets and objection window"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: ElectionRound
    side_effects: []
  - method: POST
    path: "/labor-relations/election-rounds/{id}/open-polls"
    description: "Open the polls once an accepted voter list exists and at least one session is scheduled"
    roles: [BoardAgent]
    code: 200
    input: []
    output: ElectionRound
    side_effects: ["status = POLLS_OPEN"]
  - method: POST
    path: "/labor-relations/election-rounds/{id}/post-tally"
    description: "Post the provisional tally accumulated from the closed sessions and open the objection window"
    roles: [BoardAgent]
    code: 200
    input: []
    output: ElectionRound
    side_effects: ["ballot_tally PROVISIONAL variant", "deadline_schedule objection window", "Petition.case_status = TALLY_POSTED"]
  - method: POST
    path: "/labor-relations/election-rounds/{id}/revise-tally"
    description: "Fold every resolved challenged ballot into a revised tally; requires no ballot to be OPEN"
    roles: [BoardAgent]
    code: 200
    input: []
    output: ElectionRound
    side_effects: ["ballot_tally REVISED variant", "status -> TALLY_REVISED"]

  # ------------------------------------------------------------ poll sessions
  - method: POST
    path: "/labor-relations/poll-sessions"
    description: "Lay out a polling session at a location and time window against a read-consistent round version"
    roles: [BoardAgent]
    code: 201
    input: [election_round_id, location_code, session_start_at, session_end_at, method, expected_election_round_version]
    output: PollSession
    side_effects: ["optimistic concurrency check on ElectionRound.version", "location overlap check with the 30-minute teardown buffer", "ElectionRound.scheduled_session_count += 1 and version increments"]
  - method: GET
    path: "/labor-relations/poll-sessions"
    description: "List polling sessions for a round"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["election_round_id?", "status?", "limit?", "offset?"]
    output: PollSession[]
    side_effects: []
  - method: GET
    path: "/labor-relations/poll-sessions/{id}"
    description: "Read one polling session with its observer roster and recorded counts"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: PollSession
    side_effects: []
  - method: POST
    path: "/labor-relations/poll-sessions/{id}/designate-observer"
    description: "Seat one party observer at the session; statutory supervisors are barred and each party is capped"
    roles: [LaborRelationsDirector, UnionRepresentative, BoardAgent]
    code: 200
    input: [party, observer_name, "supervisor_id?"]
    output: PollSession
    side_effects: ["employer_observer_count or union_observer_count += 1", "observer_roster appended"]
  - method: POST
    path: "/labor-relations/poll-sessions/{id}/close"
    description: "Close the session and record its unchallenged ballot counts; closing the last session closes the polls"
    roles: [BoardAgent]
    code: 200
    input: [votes_for_count, votes_against_count, void_count]
    output: PollSession
    side_effects: ["ElectionRound counters updated", "round -> POLLS_CLOSED and Petition -> VOTING_CLOSED when this was the last scheduled session"]

  # ------------------------------------------------------- challenged ballots
  - method: POST
    path: "/labor-relations/challenged-ballots"
    description: "Segregate a challenged ballot cast at a session, optionally naming the voter's list entry"
    roles: [BoardAgent]
    code: 201
    input: [poll_session_id, "voter_list_entry_id?", challenger_party, basis]
    output: ChallengedBallot
    side_effects: ["resolution = OPEN", "PollSession.challenged_ballot_count += 1, ElectionRound.challenged_open_count += 1 and ballots_cast_total += 1"]
  - method: GET
    path: "/labor-relations/challenged-ballots"
    description: "List challenged ballots by session, by voter entry, or by resolution"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["poll_session_id?", "voter_list_entry_id?", "resolution?", "limit?", "offset?"]
    output: ChallengedBallot[]
    side_effects: []
  - method: GET
    path: "/labor-relations/challenged-ballots/{id}"
    description: "Read one challenged ballot with its basis, resolution and reopen count"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: ChallengedBallot
    side_effects: []
  - method: POST
    path: "/labor-relations/challenged-ballots/{id}/resolve"
    description: "Resolve a segregated ballot into a vote column, void it, or record its withdrawal"
    roles: [BoardAgent]
    code: 200
    input: [resolution, "withdrawing_party?"]
    output: ChallengedBallot
    side_effects: ["moves one ballot between the round's challenge buckets", "ballot_conservation re-checked"]
  - method: POST
    path: "/labor-relations/challenged-ballots/{id}/reopen"
    description: "Compensating action that undoes a resolution and returns the ballot to the open pool"
    roles: [BoardAgent]
    code: 200
    input: ["reopen_reason?"]
    output: ChallengedBallot
    side_effects: ["reverses the exact bucket movement made by the resolution", "reopen_count += 1"]

  # ---------------------------------------------------------------- objections
  - method: POST
    path: "/labor-relations/objections"
    description: "File an objection to conduct affecting the results of a posted tally"
    roles: [LaborRelationsDirector, UnionRepresentative]
    code: 201
    input: [election_round_id, "related_supervisor_id?", filed_by_party, ground_code, conduct_occurred_at, alleged_affected_voter_count, description]
    output: Objection
    side_effects: ["affects_results computed against the round's provisional margin", "Petition.pending_objection_count += 1 and case_status = OBJECTIONS_PENDING"]
  - method: GET
    path: "/labor-relations/objections"
    description: "List objections by round, by the supervisor whose conduct is alleged, or by status"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["election_round_id?", "related_supervisor_id?", "status?", "limit?", "offset?"]
    output: Objection[]
    side_effects: []
  - method: GET
    path: "/labor-relations/objections/{id}"
    description: "Read one objection with its determinativeness finding and disposition"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: Objection
    side_effects: []
  - method: POST
    path: "/labor-relations/objections/{id}/rule"
    description: "Sustain or overrule the objection; sustaining sets the round aside and directs a rerun through a four-hop cascade"
    roles: [BoardAgent]
    code: 200
    input: [disposition, disposition_rationale]
    output: Objection
    side_effects: ["SUSTAIN: round SET_ASIDE, petition RERUN_DIRECTED, accepted voter list SUPERSEDED, approved messages BLOCKED", "OVERRULE: pending_objection_count -= 1 and the petition returns to TALLY_POSTED when it reaches 0"]

  # -------------------------------------------------------------- ULP charges
  - method: POST
    path: "/labor-relations/ulp-charges"
    description: "Docket an unfair labor practice charge, optionally requesting that the election be blocked"
    roles: [UnionRepresentative, LaborRelationsDirector]
    code: 201
    input: [petition_id, "related_objection_id?", charging_party, charged_party, section_code, allegation_summary, conduct_occurred_at, "blocking_requested?"]
    output: ULPCharge
    side_effects: ["a blocking charge drives Petition.case_posture to BLOCKED or IMPOUNDED and suspends or impounds the current round"]
  - method: GET
    path: "/labor-relations/ulp-charges"
    description: "List ULP charges for a petition, or the charge that grew out of a given objection"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: ["petition_id?", "related_objection_id?", "status?", "limit?", "offset?"]
    output: ULPCharge[]
    side_effects: []
  - method: GET
    path: "/labor-relations/ulp-charges/{id}"
    description: "Read one ULP charge with its determination, remedy and settlement"
    roles: [LaborRelationsDirector, HRDataAnalyst, EmploymentCounsel, BoardAgent, UnionRepresentative]
    code: 200
    input: []
    output: ULPCharge
    side_effects: []
  - method: POST
    path: "/labor-relations/ulp-charges/{id}/determine"
    description: "Determine the charge on the merits or dismiss it; a dismissal releases the blocking hold"
    roles: [BoardAgent]
    code: 200
    input: [determination, "remedy_code?", "notice_posting_days?"]
    output: ULPCharge
    side_effects: ["MERIT: remedy recorded and the hold survives", "DISMISS: blocking_charge_count -= 1 and the posture-unblock chain may fire"]
  - method: POST
    path: "/labor-relations/ulp-charges/{id}/settle"
    description: "Settle the charge and start any notice-posting period, releasing the blocking hold"
    roles: [EmploymentCounsel, BoardAgent]
    code: 200
    input: [settlement_type, "notice_posting_days?"]
    output: ULPCharge
    side_effects: ["blocking_charge_count -= 1", "Petition.notice_posting_end_at written when notice_posting_days > 0"]

errors:
  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, or X-User-Role not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_SUPERVISOR_IDENTITY_MISMATCH
    http: 403
    condition: "a PlantSupervisor addresses a Supervisor row or filters campaign messages by a presenter id that is not their own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the user dispositioning legal review is the same user who authored the message"
  # --- request schema ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body, missing required field, enum out of range, factor outside 0..100, negative count, pagination out of range, non-ISO-8601 datetime, or a missing expected_*_version"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "session_end_at not strictly after session_start_at, or polls_close_at not strictly after polls_open_at"
  # --- existence ---
  - id: ERR_PETITION_NOT_FOUND
    http: 404
    condition: "no Petition with the given id"
  - id: ERR_CLASSIFICATION_NOT_FOUND
    http: 404
    condition: "no Classification with the given id"
  - id: ERR_ELECTION_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no ElectionAgreement with the given id"
  - id: ERR_VOTER_LIST_NOT_FOUND
    http: 404
    condition: "no VoterList with the given id"
  - id: ERR_VOTER_LIST_ENTRY_NOT_FOUND
    http: 404
    condition: "no VoterListEntry with the given id"
  - id: ERR_SUPERVISOR_NOT_FOUND
    http: 404
    condition: "no Supervisor with the given id"
  - id: ERR_CAMPAIGN_COMMUNICATION_NOT_FOUND
    http: 404
    condition: "no CampaignCommunication with the given id"
  - id: ERR_ELECTION_ROUND_NOT_FOUND
    http: 404
    condition: "no ElectionRound with the given id"
  - id: ERR_POLL_SESSION_NOT_FOUND
    http: 404
    condition: "no PollSession with the given id"
  - id: ERR_CHALLENGED_BALLOT_NOT_FOUND
    http: 404
    condition: "no ChallengedBallot with the given id"
  - id: ERR_OBJECTION_NOT_FOUND
    http: 404
    condition: "no Objection with the given id"
  - id: ERR_ULP_CHARGE_NOT_FOUND
    http: 404
    condition: "no ULPCharge with the given id"
  # --- optimistic concurrency ---
  - id: ERR_STALE_PETITION_VERSION
    http: 412
    condition: "expected_petition_version does not equal the current Petition.version on voter-list creation"
  - id: ERR_STALE_ROUND_VERSION
    http: 412
    condition: "expected_election_round_version does not equal the current ElectionRound.version on poll-session creation"
  # --- referential coherence ---
  - id: ERR_CROSS_PETITION_REFERENCE
    http: 409
    condition: "a referenced row exists but belongs to a different Petition than the target of the request"
  - id: ERR_BALLOT_VOTER_NOT_ON_ACCEPTED_LIST
    http: 409
    condition: "the challenged ballot names a voter entry that is not on an ACCEPTED voter list for the round's petition"
  # --- posture and state ---
  - id: ERR_CASE_POSTURE_BLOCKED
    http: 409
    condition: "Petition.case_posture is BLOCKED or IMPOUNDED and the request would advance the election"
  - id: ERR_PETITION_STATUS_INVALID
    http: 409
    condition: "Petition.case_status does not permit the requested transition"
  - id: ERR_CLASSIFICATION_ALREADY_RULED
    http: 409
    condition: "a rule call targets a classification whose scope_ruling is no longer PENDING, or a reconsider call targets one that is still PENDING or MOOT"
  - id: ERR_AGREEMENT_STATUS_INVALID
    http: 409
    condition: "ElectionAgreement.status does not permit stipulating, requesting a hearing, or directing an election"
  - id: ERR_VOTER_LIST_STATUS_INVALID
    http: 409
    condition: "VoterList.status does not permit submitting, resubmitting or reviewing"
  - id: ERR_COMMUNICATION_STATUS_INVALID
    http: 409
    condition: "CampaignCommunication.status does not permit submitting for review, reviewing or delivering"
  - id: ERR_ROUND_NOT_SCHEDULED
    http: 409
    condition: "a poll session is created against a round that is not SCHEDULED, typically one a blocking charge suspended"
  - id: ERR_ROUND_STATUS_INVALID
    http: 409
    condition: "ElectionRound.status does not permit opening polls, posting or revising a tally"
  - id: ERR_POLL_SESSION_STATUS_INVALID
    http: 409
    condition: "the poll session is already CLOSED or was CANCELLED"
  - id: ERR_BALLOT_STATUS_INVALID
    http: 409
    condition: "a resolve call targets a ballot that is not OPEN, or a reopen call targets one that is still OPEN"
  - id: ERR_OBJECTION_ALREADY_RULED
    http: 409
    condition: "the objection has already been sustained or overruled"
  - id: ERR_CHARGE_STATUS_INVALID
    http: 409
    condition: "the ULP charge has already been determined or settled"
  # --- cross-entity prerequisites ---
  - id: ERR_CLASSIFICATION_NOT_SCORED
    http: 409
    condition: "a scope ruling is requested before community_of_interest_score has run on the classification"
  - id: ERR_NO_UNDISPUTED_CORE
    http: 422
    condition: "the first score call finds no classification with both employer_position and union_position == INCLUDE, so the core wage cannot be frozen"
  - id: ERR_SCOPE_RULINGS_INCOMPLETE
    http: 409
    condition: "an election is directed after a hearing while at least one classification is still PENDING"
  - id: ERR_VOTER_LIST_NOT_ACCEPTED
    http: 409
    condition: "the polls are opened before an eligible voter list has been ACCEPTED for the petition"
  - id: ERR_BALLOTS_IMPOUNDED
    http: 409
    condition: "a tally is posted while the round's ballots are impounded by a blocking charge"
  - id: ERR_CHALLENGES_UNRESOLVED
    http: 409
    condition: "a revised tally is requested while challenged_open_count > 0"
  - id: ERR_ROUND_NOT_REVISED
    http: 409
    condition: "certification names a round whose status is not TALLY_REVISED"
  - id: ERR_ACCURACY_REVIEW_MISSING
    http: 409
    condition: "a message is submitted for legal review before its factual-accuracy review, or after an edit that predates the last accuracy review"
  - id: ERR_PRESENTER_NOT_TRAINED
    http: 409
    condition: "a meeting-channel message is submitted for review while its presenter's training_status is UNTRAINED"
  - id: ERR_OBJECTION_NOT_DETERMINATIVE
    http: 409
    condition: "an objection whose affects_results is false is submitted for SUSTAIN"
  - id: ERR_PENDING_OBJECTIONS
    http: 409
    condition: "certification is attempted while pending_objection_count > 0"
  - id: ERR_BLOCKING_CHARGE_PENDING
    http: 409
    condition: "certification is attempted while blocking_charge_count > 0"
  # --- statutory safety ---
  - id: ERR_PEERLESS_PLYWOOD_WINDOW
    http: 422
    condition: "a captive-audience meeting is planned inside the 24 hours immediately before the polls open"
  - id: ERR_RISK_SCORE_PROHIBITED
    http: 422
    condition: "risk_score is 90 or more, so the message may not be submitted for review at all"
  - id: ERR_ESCALATION_ACK_REQUIRED
    http: 422
    condition: "a message scoring 70 or more is approved without escalation_ack"
  - id: ERR_SUPERVISOR_OBSERVER_PROHIBITED
    http: 422
    condition: "a designated observer is a Section 2(11) supervisor"
  # --- temporal windows ---
  - id: ERR_CAMPAIGN_PERIOD_CLOSED
    http: 409
    condition: "delivery is confirmed after the polls have closed or on a round that is no longer SCHEDULED or POLLS_OPEN"
  - id: ERR_VOTER_LIST_PAST_DUE
    http: 409
    condition: "the list is submitted after due_at without late_submission_ack"
  - id: ERR_CURE_WINDOW_EXPIRED
    http: 409
    condition: "a cured list is resubmitted after cure_deadline_at"
  - id: ERR_POLLS_NOT_YET_OPEN
    http: 409
    condition: "open-polls is called before the round's polls_open_at"
  - id: ERR_OBJECTION_WINDOW_CLOSED
    http: 409
    condition: "an objection is filed after objection_window_close_at"
  - id: ERR_OBJECTION_WINDOW_OPEN
    http: 409
    condition: "certification is attempted at or before objection_window_close_at"
  - id: ERR_NOTICE_POSTING_ACTIVE
    http: 409
    condition: "certification is attempted while a settlement notice-posting period is still running"
  # --- constraint satisfaction ---
  - id: ERR_POLL_SESSION_LOCATION_CONFLICT
    http: 409
    condition: "a session overlaps another session at the same location on the half-open interval that includes the 30-minute teardown buffer"
  - id: ERR_PRESENTER_SCHEDULE_CONFLICT
    http: 409
    condition: "a meeting-channel message overlaps another message by the same presenter on the closed 60-minute-padded interval"
  - id: ERR_DUPLICATE_CASE_NUMBER
    http: 409
    condition: "another Petition already uses the case_number"
  - id: ERR_DUPLICATE_CLASSIFICATION_CODE
    http: 409
    condition: "another Classification on the same petition already uses the code"
  - id: ERR_DUPLICATE_ELECTION_AGREEMENT
    http: 409
    condition: "the petition already has an ElectionAgreement that is not VOID"
  - id: ERR_DUPLICATE_VOTER_LIST
    http: 409
    condition: "the petition already has a VoterList in SUBMITTED or ACCEPTED, which cannot be superseded by a new one"
  - id: ERR_DUPLICATE_CHALLENGED_BALLOT
    http: 409
    condition: "the same voter entry is already challenged at the same poll session"
  - id: ERR_DUPLICATE_SUPERVISOR
    http: 409
    condition: "the petition already has a Supervisor with the same full_name and job_title"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "a revision is requested when revision_round has already reached MAX_REVISION_ROUNDS"
  - id: ERR_RESUBMISSION_LIMIT_EXCEEDED
    http: 409
    condition: "a cure resubmission is attempted when resubmission_count has already reached MAX_LIST_RESUBMISSIONS"
  - id: ERR_REOPEN_LIMIT_EXCEEDED
    http: 409
    condition: "a reopen is attempted when reopen_count has already reached MAX_BALLOT_REOPENS"
  # --- numeric coherence, capacity and conservation ---
  - id: ERR_CARD_COUNTS_INCONSISTENT
    http: 422
    condition: "the four struck-card counts sum to more than submitted_card_count"
  - id: ERR_CLAIM_COUNTS_INCONSISTENT
    http: 422
    condition: "unsupported_material_claim_count exceeds material_claim_count"
  - id: ERR_UNIT_HEADCOUNT_ZERO
    http: 422
    condition: "the selected showing-of-interest denominator is zero"
  - id: ERR_VOTER_LIST_EMPTY
    http: 422
    condition: "a voter list with no entries is submitted"
  - id: ERR_TALLY_RECONCILIATION_FAILED
    http: 422
    condition: "the closed sessions' ballot counts do not reconcile with the round's ballots_cast_total"
  - id: ERR_OBSERVER_CAPACITY_EXCEEDED
    http: 409
    condition: "the party already seats MAX_OBSERVERS_PER_PARTY observers at the session"
  - id: ERR_HEADCOUNT_CONSERVATION_VIOLATION
    http: 409
    condition: "the write would leave included + excluded + pending different from total_classified_headcount"
  - id: ERR_BALLOT_CONSERVATION_VIOLATION
    http: 409
    condition: "the write would leave the nine ballot buckets summing to something other than ballots_cast_total"

invariants:
  - name: unit_headcount_conservation
    entity: Petition
    conserved_quantity: "classified employee headcount"
    statement: "included_headcount + excluded_headcount + pending_headcount == total_classified_headcount"
    maintained_across: ["POST /labor-relations/classifications", "POST /labor-relations/classifications/{id}/rule", "POST /labor-relations/classifications/{id}/reconsider", "the dismissal cascade that makes classifications MOOT"]
    violation_error: ERR_HEADCOUNT_CONSERVATION_VIOLATION
    note: "MOOT classifications stay inside pending_headcount, so the dismissal cascade moves no headcount at all."
  - name: ballot_conservation
    entity: ElectionRound
    conserved_quantity: "physical ballots cast in the round"
    statement: |
      (provisional_votes_for + challenged_counted_for_count)
      + (provisional_votes_against + challenged_counted_against_count)
      + (provisional_void_count + challenged_voided_count)
      + challenged_withdrawn_count
      + challenged_open_count
      == ballots_cast_total
    maintained_across: ["POST /labor-relations/poll-sessions/{id}/close", "POST /labor-relations/challenged-ballots", "POST /labor-relations/challenged-ballots/{id}/resolve", "POST /labor-relations/challenged-ballots/{id}/reopen", "POST /labor-relations/election-rounds/{id}/revise-tally"]
    violation_error: ERR_BALLOT_CONSERVATION_VIOLATION
    note: "resolve and reopen are exact inverses: every resolution moves one ballot out of the open bucket into exactly one other bucket, and reopen moves it back."

roles:
  - name: LaborRelationsDirector
    description: "Employer-side owner of the case file: dockets the petition, opens scope analysis, drafts and delivers campaign messages, attests and files the eligible voter list, seats employer observers, files employer objections and charges."
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/petitions"
      - "POST /labor-relations/petitions/{id}/open-scope-analysis"
      - "POST /labor-relations/election-agreements"
      - "POST /labor-relations/campaign-communications"
      - "POST /labor-relations/campaign-communications/{id}/submit-for-review"
      - "POST /labor-relations/campaign-communications/{id}/deliver"
      - "POST /labor-relations/voter-lists/{id}/submit"
      - "POST /labor-relations/voter-lists/{id}/resubmit"
    shared_operations:
      - "POST /labor-relations/classifications (with HRDataAnalyst)"
      - "POST /labor-relations/voter-lists (with HRDataAnalyst)"
      - "POST /labor-relations/voter-list-entries and PATCH (with HRDataAnalyst)"
      - "POST /labor-relations/supervisors (with SupervisorTrainer)"
      - "POST /labor-relations/campaign-communications/{id}/accuracy-review (with HRDataAnalyst)"
      - "POST /labor-relations/election-agreements/{id}/request-hearing (with UnionRepresentative)"
      - "POST /labor-relations/objections and POST /labor-relations/ulp-charges (with UnionRepresentative)"
      - "POST /labor-relations/poll-sessions/{id}/designate-observer (with UnionRepresentative and BoardAgent)"
      - "every GET under /labor-relations"
  - name: HRDataAnalyst
    description: "Builds the data behind the case: classification rosters, voter entries and their statutory content, and the factual-accuracy pass over campaign claims. Never attests a filing and never dispositions anything."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /labor-relations/classifications (with LaborRelationsDirector)"
      - "POST /labor-relations/voter-lists (with LaborRelationsDirector)"
      - "POST /labor-relations/voter-list-entries and PATCH /labor-relations/voter-list-entries/{id} (with LaborRelationsDirector)"
      - "POST /labor-relations/campaign-communications/{id}/accuracy-review (with LaborRelationsDirector)"
      - "every GET under /labor-relations except GET /labor-relations/supervisors/{id} and GET /labor-relations/campaign-communications/{id}"
  - name: EmploymentCounsel
    description: "Outside or in-house labour counsel: scores community-of-interest arguments, clears or returns campaign messages in legal review, records substantiated prohibited conduct, and settles ULP charges. Bound by segregation of duties against the message author."
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/campaign-communications/{id}/review"
      - "POST /labor-relations/supervisors/{id}/record-violation"
    shared_operations:
      - "POST /labor-relations/classifications/{id}/score (with LaborRelationsDirector)"
      - "POST /labor-relations/ulp-charges/{id}/settle (with BoardAgent)"
      - "every GET under /labor-relations"
  - name: SupervisorTrainer
    description: "Delivers and records lawful-communication training for front-line supervisors. Cannot draft, review or deliver any campaign message."
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/supervisors/{id}/train"
    shared_operations:
      - "POST /labor-relations/supervisors (with LaborRelationsDirector)"
      - "GET /labor-relations/supervisors, GET /labor-relations/supervisors/{id}, GET /labor-relations/campaign-communications, GET /labor-relations/campaign-communications/{id}, GET /labor-relations/petitions"
  - name: PlantSupervisor
    description: "A front-line supervisor acting as themselves. May read only their own training record and only the campaign messages they are scheduled to present."
    identity: "entity_backed:Supervisor"
    exclusive_operations: []
    shared_operations:
      - "GET /labor-relations/supervisors/{id} restricted to their own Supervisor.id"
      - "GET /labor-relations/campaign-communications restricted to presenter_supervisor_id == their own id"
      - "POST /_clock/set_current_utc"
  - name: BoardAgent
    description: "The Board's regional agent. Owns every neutral determination: showing-of-interest verification, scope rulings, stipulation and direction of election, voter-list review, poll layout and closing, tally posting and revision, challenged-ballot resolution, objection rulings, charge determinations, rerun scheduling and certification."
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/petitions/{id}/verify-showing"
      - "POST /labor-relations/petitions/{id}/schedule-rerun"
      - "POST /labor-relations/petitions/{id}/certify"
      - "POST /labor-relations/classifications/{id}/rule"
      - "POST /labor-relations/classifications/{id}/reconsider"
      - "POST /labor-relations/election-agreements/{id}/stipulate"
      - "POST /labor-relations/election-agreements/{id}/direct-election"
      - "POST /labor-relations/voter-lists/{id}/review"
      - "POST /labor-relations/election-rounds/{id}/open-polls"
      - "POST /labor-relations/election-rounds/{id}/post-tally"
      - "POST /labor-relations/election-rounds/{id}/revise-tally"
      - "POST /labor-relations/poll-sessions"
      - "POST /labor-relations/poll-sessions/{id}/close"
      - "POST /labor-relations/challenged-ballots"
      - "POST /labor-relations/challenged-ballots/{id}/resolve"
      - "POST /labor-relations/challenged-ballots/{id}/reopen"
      - "POST /labor-relations/objections/{id}/rule"
      - "POST /labor-relations/ulp-charges/{id}/determine"
    shared_operations:
      - "POST /labor-relations/ulp-charges/{id}/settle (with EmploymentCounsel)"
      - "POST /labor-relations/poll-sessions/{id}/designate-observer (with LaborRelationsDirector and UnionRepresentative)"
      - "every GET under /labor-relations"
  - name: UnionRepresentative
    description: "The petitioning labour organisation's representative. Demands a hearing, seats union observers, files objections and unfair labour practice charges, and reads the public case record."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /labor-relations/election-agreements/{id}/request-hearing (with LaborRelationsDirector)"
      - "POST /labor-relations/objections and POST /labor-relations/ulp-charges (with LaborRelationsDirector)"
      - "POST /labor-relations/poll-sessions/{id}/designate-observer (with LaborRelationsDirector and BoardAgent)"
      - "every GET under /labor-relations except the supervisor and campaign-message reads"
