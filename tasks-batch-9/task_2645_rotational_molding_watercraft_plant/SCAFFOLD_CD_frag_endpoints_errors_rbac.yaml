# =============================================================================
# §1.9 Scaffold Corner Design — FRAGMENT 3 of 3
# task_2645_rotational_molding_watercraft_plant
#
# Sections in this fragment: endpoints, errors, rbac,
#                            cross_cutting_complexity_layers, consistency_model
#
# Conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml §1.8)
# ---------------------------------------------------------------
#   * The logical clock starts at exactly 2026-08-01T00:00:00Z. Wherever an
#     endpoint takes an explicit actual timestamp AND stamps the clock, the
#     chain sets the clock first and passes the identical instant.
#   * Opaque roles act as the fixed audit ids "admin-1" / "planner-1" /
#     "agent-1"; §1.4 priority 1 requires a non-empty X-User-ID on EVERY call.
#   * Segregation of duties (§1.4 priority 57) is honoured: MOLDING_OPERATOR,
#     ASSEMBLY_TECH and QUALITY_INSPECTOR are always three distinct Technician
#     rows.
#   * Every expected_*_version is captured from a GET immediately before the
#     OCC call (or is a deliberately superseded capture, for stale tests).
#   * Production orders are created WITHOUT demand_bucket_id unless the
#     instance targets the build-ahead quota.
#   * All literal business codes in this fragment carry the "-CD-" infix
#     (PM-CD-KM, MLD-CD-1, OVN-CD-1, BAY-CD-1, T-CD-*, WH-CD, LOT-CD-1,
#     PO-CD-*, HK-CD-*, SHP-CD-*, CUS-CD-*, CLM-CD-*) so nothing can collide
#     with the §1.8 file's identifiers.
#   * YAML anchors prefixed "cd2_" carry the shared setup calls. Every anchor
#     is DEFINED in the endpoints section and only ALIASED afterwards, so the
#     merged document always defines before it references.
#
# Numeric literals in asserts were computed with python3 (Decimal,
# ROUND_HALF_UP) from the §1.3 formulas, never estimated.
# =============================================================================

  # ===========================================================================
  # SECTION — endpoints  (§1.5)
  #
  # Claim types drawn from claim-extraction-guide "From Table 5 (Endpoints)":
  # Standard CRUD, Action endpoint, Bulk action, Cross-reference link,
  # Computed read, Conditional action.
  #
  # NOTE on the "Bulk action" row: §1.5 declares no endpoint that accepts a
  # collection of ids or returns per-item status, so the row is vacuous for
  # this scaffold and no instance is invented for it. Likewise §1.0/§1.5
  # declare no method-not-allowed or unknown-path behaviour, so no such claim
  # is asserted.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: ep_response_envelope_success_and_error_shapes_on_one_resource
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.error
          - "endpoints.POST_/product-models"
          - "endpoints.GET_/product-models/{product_model_id}"
          - "errors[ERR_PRODUCT_MODEL_NOT_FOUND]"
        distinguishing_aspect: |
          Both halves of the §1.0 envelope are asserted on the same resource in
          one instance: the 201 create carries meta.api_request_id,
          meta.api_request_timestamp, response_type "object" and a data object,
          while the 404 read carries response_type "error" and puts error_id
          INSIDE data — there is no top-level "error" key on either shape.
        test_recipe:
          setup:
            - "Empty database. Logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &cd2_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
            - &cd2_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CD-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 12.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id, pm_v: $.data.version }
            - call: "GET /product-models/pm-cd-does-not-exist"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the create response status is 201 and response_type is object"
            - "meta.api_request_id and meta.api_request_timestamp are both present and non-empty on the create response"
            - "ProductModel.${pm}.model_code == 'PM-CD-KM' and ProductModel.${pm}.version == 1"
            - "ProductModel.${pm}.warranty_reserve_cents == 500000 and ProductModel.${pm}.warranty_paid_cents == 0"
            - "the create response body has exactly the keys meta, response_type and data — no top-level error key"
            - "the GET /product-models/pm-cd-does-not-exist response status is 404 and response_type is error"
            - "the 404 response data.error_id == 'ERR_PRODUCT_MODEL_NOT_FOUND' and data.message is a non-empty string"
            - "the 404 response carries meta.api_request_id and meta.api_request_timestamp, and has no top-level error key"

      - name: ep_finished_unit_filtered_list_is_the_only_discovery_channel_for_its_fks
        claim_type: Cross-reference link
        grounds:
          - "endpoints.GET_/finished-units"
          - "endpoints.GET_/finished-units/{finished_unit_id}"
          - "endpoints.POST_/molding-cycles/{molding_cycle_id}/demold"
          - entities.FinishedUnit.fields.hull_serial
          - entities.FinishedUnit.fields.is_zone_anchor
        distinguishing_aspect: |
          FinishedUnit has no POST, so every one of the six foreign keys the
          demold cascade mints (molding_cycle_id, product_model_id,
          warehouse_id, outfitted_by_technician_id, inspected_by_technician_id,
          demand_bucket_id) must be reverse-reachable through
          GET /finished-units filters; the is_zone_anchor filter separates the
          anchor hull from its nested sibling inside the same zone.
        test_recipe:
          setup:
            - "ProductModel PM-CD-KM: KAYAK/MID, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 12.000, charge_tolerance_pct 5.00, min_cooling_minutes 30, wall_thickness_min_mm 4.50, wall_cv_max_pct 12.00, impact_test_min_joules 90.00, msrp_cents 180000, PRO_RATA_AGE, reserve 500000."
            - "Mold MLD-CD-1 for that model, cavity_count 2 so one demold mints two hulls, nominal_charge_kg 24.000, service_interval_cycles 10 so CASCADE-B never fires."
            - "OvenStation OVN-CD-1 (arm_count 2, changeover_buffer_min 15, energy_cents_per_min 100, max_size_class OVERSIZE) and CoolingBay BAY-CD-1 (concurrent_slot_capacity 2, airflow_mode FORCED_AIR), both OPERATIONAL."
            - "Four ACTIVE Technicians with distinct role_codes: RESIN_TECH (RESIN_BLENDING), MOLDING_OPERATOR, ASSEMBLY_TECH (FIXTURE_ASSEMBLY), QUALITY_INSPECTOR (WALL_GAUGE + IMPACT_RIG)."
            - "Warehouse WH-CD, footprint_capacity_cube_m3 20.0000, one zone Z-A of 20.0000, thresholds 85.00 / 95.00 so the site stays NORMAL."
            - "ResinLot LOT-CD-1 qualified for the model: HDPE_LINEAR, melt_index 4.00, colour exactly SEAFOAM, additive UV12, regrind 10.00 pct, 210 cents/kg, received 500.000 kg, expires 2027-12-31."
            - "ProductionOrder PO-CD-1 (ordered_qty 2, no demand_bucket_id) released, one cycle run to DEMOLDED, both hulls trimmed, outfitted and inspected PASS, then both STORED in Z-A: hull 1 is the anchor at 2.0000 and hull 2 nests at 1.0000."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - &cd2_mold
              call: "POST /molds"
              payload: { mold_code: "MLD-CD-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - &cd2_ov
              call: "POST /oven-stations"
              payload: { station_code: "OVN-CD-1", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - &cd2_cb
              call: "POST /cooling-bays"
              payload: { bay_code: "BAY-CD-1", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - &cd2_tres
              call: "POST /technicians"
              payload: { employee_code: "T-CD-RES-1", full_name: "Rosa Blend", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - &cd2_top
              call: "POST /technicians"
              payload: { employee_code: "T-CD-OPR-1", full_name: "Owen Arm", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - &cd2_tasm
              call: "POST /technicians"
              payload: { employee_code: "T-CD-ASM-1", full_name: "Alba Fixture", role_code: "ASSEMBLY_TECH", certifications: ["FIXTURE_ASSEMBLY"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_asm: $.data.id }
            - &cd2_tqc
              call: "POST /technicians"
              payload: { employee_code: "T-CD-QCI-1", full_name: "Quill Gauge", role_code: "QUALITY_INSPECTOR", certifications: ["WALL_GAUGE", "IMPACT_RIG"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_qc: $.data.id }
            - &cd2_wh
              call: "POST /warehouses"
              payload: { site_code: "WH-CD", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - &cd2_lot
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CD-1", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
            - &cd2_po
              call: "POST /production-orders"
              payload: { order_code: "PO-CD-1", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - &cd2_porel
              call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - &cd2_cyc
              call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc: $.data.id }
            - &cd2_chg
              call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chg: $.data.id }
            - &cd2_clk0900
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - &cd2_start
              call: "POST /molding-cycles/${cyc}/start-oven"
              payload: { actual_oven_start_at: "2026-08-01T09:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - &cd2_clk1000
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - &cd2_cool
              call: "POST /molding-cycles/${cyc}/enter-cooling"
              payload: { actual_oven_end_at: "2026-08-01T10:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - &cd2_clk1035
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:35:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - &cd2_demold
              call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T10:35:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - &cd2_disc
              call: "GET /finished-units?molding_cycle_id=${cyc}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { fu1: "$.data[0].id", fu2: "$.data[1].id" }
            - &cd2_trim1
              call: "POST /finished-units/${fu1}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - &cd2_out1
              call: "POST /finished-units/${fu1}/outfit"
              payload: { hardware_kit_serial: "HK-CD-0001" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - &cd2_insp1
              call: "POST /finished-units/${fu1}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - &cd2_trim2
              call: "POST /finished-units/${fu2}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - &cd2_out2
              call: "POST /finished-units/${fu2}/outfit"
              payload: { hardware_kit_serial: "HK-CD-0002" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - &cd2_insp2
              call: "POST /finished-units/${fu2}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - &cd2_whv1
              call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v1: $.data.version }
            - &cd2_store1
              call: "POST /finished-units/${fu1}/store"
              payload: { expected_warehouse_version: "${wh_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - &cd2_whv2
              call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v2: $.data.version }
            - &cd2_store2
              call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "GET /finished-units?product_model_id=${pm}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units?warehouse_id=${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units?outfitted_by_technician_id=${t_asm}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units?inspected_by_technician_id=${t_qc}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units?build_status=SELLABLE&logistics_status=STORED"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units?inspection_verdict=PASS&storage_zone_code=Z-A"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units?is_zone_anchor=true"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units/${fu1}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "GET /finished-units?molding_cycle_id=${cyc} returns exactly 2 rows with total_count 2 and has_more false"
            - "the two hull_serial values are exactly 'PO-CD-1-1-1' and 'PO-CD-1-2-2', and cavity_index is 1 and 2 respectively"
            - "GET /finished-units?product_model_id=${pm} returns exactly 2 rows"
            - "GET /finished-units?warehouse_id=${wh} returns exactly 2 rows"
            - "GET /finished-units?outfitted_by_technician_id=${t_asm} returns exactly 2 rows"
            - "GET /finished-units?inspected_by_technician_id=${t_qc} returns exactly 2 rows"
            - "GET /finished-units?build_status=SELLABLE&logistics_status=STORED returns exactly 2 rows"
            - "GET /finished-units?inspection_verdict=PASS&storage_zone_code=Z-A returns exactly 2 rows"
            - "GET /finished-units?is_zone_anchor=true returns exactly 1 row and its id is ${fu1}"
            - "FinishedUnit.${fu1}.is_zone_anchor == true and FinishedUnit.${fu1}.stored_footprint_cube_m3 == 2.0000"
            - "FinishedUnit.${fu2}.is_zone_anchor == false and FinishedUnit.${fu2}.stored_footprint_cube_m3 == 1.0000"
            - "GET /finished-units/${fu1} returns response_type object with mean_wall_thickness_mm 6.000, wall_sd_mm 0.065, wall_cv_pct 1.08, min_wall_thickness_mm 5.900, final_warpage_index 0.000 and inspection_verdict PASS"

      - name: ep_product_model_list_pagination_defaults_and_offset_window
        claim_type: Standard CRUD
        grounds:
          - "endpoints.GET_/product-models"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - "validations[priority=22]"
        distinguishing_aspect: |
          With exactly three rows the offset window is observable end to end:
          limit=2&offset=0 yields 2 rows with has_more true, offset=2 yields the
          last row with has_more false, an omitted limit falls back to 10 (not
          to "all"), and limit outside the declared 1..100 band is refused with
          ERR_INVALID_QUANTITY rather than being silently clamped.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z."
            - "Exactly three ProductModel rows: PM-CD-KM (KAYAK/MID/PADDLE), PM-CD-K2 (KAYAK/COMPACT/PADDLE) and PM-CD-T3 (PONTOON/TANDEM/DECK)."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - &cd2_pm2
              call: "POST /product-models"
              payload: { model_code: "PM-CD-K2", hull_type: "KAYAK", size_class: "COMPACT", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 9.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 25, target_wall_thickness_mm: 5.00, wall_thickness_min_mm: 4.00, wall_cv_max_pct: 12.00, impact_test_min_joules: 80.00, gross_cube_m3: 1.5000, nest_factor: 0.5000, unit_weight_kg: 18.000, msrp_cents: 120000, warranty_basis: "FLAT_SCHEDULE", initial_warranty_reserve_cents: 300000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm2: $.data.id }
            - &cd2_pm3
              call: "POST /product-models"
              payload: { model_code: "PM-CD-T3", hull_type: "PONTOON", size_class: "TANDEM", resin_grade: "HDPE_CROSSLINK", master_color_code: "GRAPHITE", max_color_delta_e: 2.00, required_additive_package_code: "UV20", max_regrind_pct: 20.00, min_melt_index_g10min: 3.00, max_melt_index_g10min: 7.00, nominal_charge_kg: 30.000, charge_tolerance_pct: 4.00, min_cooling_minutes: 45, target_wall_thickness_mm: 8.00, wall_thickness_min_mm: 6.50, wall_cv_max_pct: 10.00, impact_test_min_joules: 140.00, gross_cube_m3: 6.0000, nest_factor: 0.7000, unit_weight_kg: 90.000, msrp_cents: 640000, warranty_basis: "FLAT_SCHEDULE", initial_warranty_reserve_cents: 900000, seasonal_family: "DECK" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm3: $.data.id }
          trigger:
            - call: "GET /product-models?limit=2&offset=0"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=2&offset=2"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=101"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=0"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "GET /product-models?limit=2&offset=0 returns status 200, response_type array, exactly 2 rows, limit 2, offset 0, total_count 3 and has_more true"
            - "GET /product-models?limit=2&offset=2 returns exactly 1 row, limit 2, offset 2, total_count 3 and has_more false"
            - "GET /product-models with no query parameters returns limit 10, offset 0, exactly 3 rows, total_count 3 and has_more false"
            - "GET /product-models?limit=101 returns status 422 with data.error_id 'ERR_INVALID_QUANTITY'"
            - "GET /product-models?limit=0 returns status 422 with data.error_id 'ERR_INVALID_QUANTITY'"

      - name: ep_product_model_list_filters_compose_and_can_narrow_to_zero_rows
        claim_type: Standard CRUD
        grounds:
          - "endpoints.GET_/product-models"
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Two declared filters supplied together are ANDed, not ORed:
          hull_type=KAYAK alone matches two rows, size_class=COMPACT alone
          matches one, the pair matches exactly one, and a pair that is
          individually satisfiable but jointly empty (KAYAK + TANDEM) returns an
          empty array with total_count 0 and has_more false rather than a 404.
        test_recipe:
          setup:
