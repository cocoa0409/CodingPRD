            - "BatchTicket.${bt_id}.movement_status == PLANNED and BatchTicket.${bt_id}.quality_status == PENDING"
            - "Terminal.${org_id}.inventory_bbl == 100000 and Shipper.${alpha_id}.exposure_usd == 0.00"

      - name: reschedule_window_bay_capacity_action
        claim_type: Action endpoint
        grounds:
