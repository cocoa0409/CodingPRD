          - calculations.conformance_score.variants.PROVISIONAL
          - calculations.conformance_score.variants.VERIFIED
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_verified_conformance_score_on_router_assessment
          rationale: "That §1.8 instance already scores one THIRD_PARTY_TEST assessment under both variants and asserts the whole delta (provisional 90.00 vs verified 100.00) on the same responses."

      - name: variant_selection_route_decides_which_score_becomes_decided
