            - "HospitalUnit.${s16_u}.posture == LOCKED_FOR_SURVEY again after the follow-up open"

      - name: escalated_ticket_cascade_to_unit_posture
        claim_type: cross_entity
        grounds:
          - state_machines.DeficiencyTicket.OPEN_to_ESCALATED
          - state_machines.HospitalUnit.OPEN_to_RESTRICTED
        excluded_because:
          difficulty_instance: transitive_cascade / life_safety_escalation_cascades_to_tracer_abort
          rationale: "The LIFE_SAFETY escalation cascade, the posture flip and the tracer abort are the asserted trigger chain of that §1.8 instance."

      - name: evidence_expiry_sweep_transition_to_expired
        claim_type: valid_transition
        grounds:
          - state_machines.EvidenceItem.VALIDATED_to_EXPIRED
        excluded_because:
          difficulty_instance: transitive_cascade / clock_expiry_cascades_to_chapter_evidence_counter
          rationale: "The VALIDATED -> EXPIRED sweep at the inclusive expires_at boundary is that instance's trigger."

      - name: deficiency_ticket_failed_verification_loop_back
        claim_type: cyclic
        grounds:
          - state_machines.DeficiencyTicket.REMEDIATED_to_OPEN
        excluded_because:
          difficulty_instance: non_linear_state_machine / deficiency_ticket_failed_verification_revision_cycle
          rationale: "The FAIL_VERIFICATION loop and its frozen penalty ledger are asserted there."

      - name: survey_window_parallel_dimension_independence
        claim_type: parallel
        grounds:
          - state_machines.SurveyWindow
        excluded_because:
          difficulty_instance: non_linear_state_machine / survey_window_two_dimensions_advance_independently
          rationale: "Independent advance of window_state and command_center_state is the whole subject of that instance."

      - name: finding_clarification_round_cycle
        claim_type: cyclic
        grounds:
          - state_machines.SurveyFinding.RESPONSE_SUBMITTED_to_CLARIFICATION_REQUESTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / finding_clarification_cycle_bounded_at_two_rounds
          rationale: "Both the cycle and its MAX_CLARIFICATION_ROUNDS bound are asserted there."

      - name: standard_deficient_on_noncompliant_observation
        claim_type: cross_entity
        grounds:
          - state_machines.Standard.MAPPED_to_DEFICIENT
        excluded_because:
          difficulty_instance: transitive_cascade / tracer_completion_cascades_to_ppr_reassessment
          rationale: "MAPPED -> DEFICIENT for two standards and the chapter/PPR fallout are that instance's asserted chain."

  # =========================================================================
  # Guide section 3 - Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: mock_tracer_score_partial_credit_is_half_weight
        claim_type: correct_result
        grounds:
          - calculations.mock_tracer_score
          - calculations.mock_tracer_score.constants.CREDIT_PARTIAL
        distinguishing_aspect: "Observations COMPLIANT/PARTIAL/NON_COMPLIANT at equal weight 10 give earned 15 of scored 30, so tracer_score is exactly 50.00 - PARTIAL contributes half, not all or nothing."
        test_recipe:
          setup:
            - "Chapter EC weight 100 with three standards, one owned so the chapter is MAPPED; unit MED-8; clock 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c1_ch: $.data.id }
            - call: "POST /accreditation/chapters/${c1_ch}/standards"
              payload: { standard_code: "EC.02.01.01", title: "Risk management", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c1_s1: $.data.id }
            - call: "POST /accreditation/chapters/${c1_ch}/standards"
              payload: { standard_code: "EC.02.02.01", title: "Hazardous materials", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c1_s2: $.data.id }
            - call: "POST /accreditation/chapters/${c1_ch}/standards"
              payload: { standard_code: "EC.02.03.01", title: "Fire response", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c1_s3: $.data.id }
            - call: "POST /accreditation/standards/${c1_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "MED-8", unit_type: "MED_SURG", bed_count: 30 }
              as: AccreditationDirector
              captures: { c1_u: $.data.id, c1_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${c1_u}", chapter_id: "${c1_ch}", tracer_type: "PATIENT", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${c1_u_v1}" }
              as: TracerSurveyor
              captures: { c1_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${c1_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${c1_t}/observations"
              payload: { standard_id: "${c1_s1}", result: "COMPLIANT", weight: 10 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${c1_t}/observations"
              payload: { standard_id: "${c1_s2}", result: "PARTIAL", weight: 10 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${c1_t}/observations"
              payload: { standard_id: "${c1_s3}", result: "NON_COMPLIANT", weight: 10 }
              as: TracerSurveyor
          trigger:
            - call: "POST /accreditation/mock-tracers/${c1_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
              captures: { c1_scored: $.data.scored_weight, c1_earned: $.data.earned_weight, c1_score: $.data.tracer_score, c1_contrib: $.data.contributes_to_readiness }
            - call: "GET /accreditation/units/${c1_u}/readiness"
              as: AccreditationDirector
              captures: { c1_base: $.data.base_score, c1_rscore: $.data.readiness_score, c1_band: $.data.readiness_band }
          assert:
            - "${c1_scored} == 30 and ${c1_earned} == 15 (10*1.0 + 10*0.5 + 10*0.0)"
            - "${c1_score} == 50.00 and ${c1_contrib} == true"
            - "${c1_base} == 50.00, ${c1_rscore} == 50.00 and ${c1_band} == NOT_READY (no tickets, single chapter at weight 100)"

      - name: tracer_score_precision_two_thirds_rounds_half_up
        claim_type: precision
        grounds:
          - calculations.mock_tracer_score.precision
          - calculations.unit_readiness_score.formula
        distinguishing_aspect: "2 of 3 equal-weight observations compliant gives 66.6666...; tracer_score is 66.67 (2 dp round_half_up) while rate_c is 0.6667 (4 dp), so the two precisions are applied at their own steps."
        test_recipe:
          setup:
            - "Chapter EC weight 100 with three standards (one owned); unit MED-9; clock 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c2_ch: $.data.id }
            - call: "POST /accreditation/chapters/${c2_ch}/standards"
              payload: { standard_code: "EC.02.01.01", title: "Risk management", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c2_s1: $.data.id }
            - call: "POST /accreditation/chapters/${c2_ch}/standards"
              payload: { standard_code: "EC.02.02.01", title: "Hazardous materials", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c2_s2: $.data.id }
            - call: "POST /accreditation/chapters/${c2_ch}/standards"
              payload: { standard_code: "EC.02.03.01", title: "Fire response", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c2_s3: $.data.id }
            - call: "POST /accreditation/standards/${c2_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "MED-9", unit_type: "MED_SURG", bed_count: 30 }
              as: AccreditationDirector
              captures: { c2_u: $.data.id, c2_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${c2_u}", chapter_id: "${c2_ch}", tracer_type: "PATIENT", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${c2_u_v1}" }
              as: TracerSurveyor
              captures: { c2_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${c2_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${c2_t}/observations"
              payload: { standard_id: "${c2_s1}", result: "COMPLIANT", weight: 1 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${c2_t}/observations"
              payload: { standard_id: "${c2_s2}", result: "COMPLIANT", weight: 1 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${c2_t}/observations"
              payload: { standard_id: "${c2_s3}", result: "NON_COMPLIANT", weight: 1 }
              as: TracerSurveyor
          trigger:
            - call: "POST /accreditation/mock-tracers/${c2_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
              captures: { c2_score: $.data.tracer_score }
            - call: "GET /accreditation/units/${c2_u}/readiness"
              as: AccreditationDirector
              captures: { c2_break: $.data.chapter_breakdown, c2_base: $.data.base_score, c2_band: $.data.readiness_band }
          assert:
            - "${c2_score} == 66.67 (2 of 3 -> 66.6666... rounded half up at 2 dp)"
            - "${c2_break} contains one entry for chapter ${c2_ch} with rate 0.6667 (4 dp) and contribution 66.67"
            - "${c2_base} == 66.67 and ${c2_band} == AT_RISK (>= 60.00, < 75.00)"

      - name: not_applicable_observations_excluded_from_both_sums
        claim_type: input_set_filtering
        grounds:
          - calculations.mock_tracer_score.input_set
          - entities.TracerObservation.fields.result
        distinguishing_aspect: "A NOT_APPLICABLE observation of weight 6 alongside one COMPLIANT observation of weight 4 leaves scored_weight at 4 (not 10) and tracer_score at 100.00, and the tracer still contributes because a scored observation exists."
        test_recipe:
          setup:
            - "Chapter EC weight 100 with two standards (one owned); unit OR-9; clock 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c3_ch: $.data.id }
            - call: "POST /accreditation/chapters/${c3_ch}/standards"
              payload: { standard_code: "EC.02.01.01", title: "Risk management", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c3_s1: $.data.id }
            - call: "POST /accreditation/chapters/${c3_ch}/standards"
              payload: { standard_code: "EC.02.02.01", title: "Hazardous materials", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c3_s2: $.data.id }
            - call: "POST /accreditation/standards/${c3_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "OR-9", unit_type: "OR", bed_count: 4 }
              as: AccreditationDirector
              captures: { c3_u: $.data.id, c3_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${c3_u}", chapter_id: "${c3_ch}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${c3_u_v1}" }
              as: TracerSurveyor
              captures: { c3_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${c3_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${c3_t}/observations"
              payload: { standard_id: "${c3_s1}", result: "COMPLIANT", weight: 4 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${c3_t}/observations"
              payload: { standard_id: "${c3_s2}", result: "NOT_APPLICABLE", weight: 6 }
              as: TracerSurveyor
          trigger:
            - call: "POST /accreditation/mock-tracers/${c3_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
              captures: { c3_scored: $.data.scored_weight, c3_earned: $.data.earned_weight, c3_score: $.data.tracer_score, c3_contrib: $.data.contributes_to_readiness }
            - call: "GET /accreditation/units/${c3_u}/readiness"
              as: AccreditationDirector
              captures: { c3_weight: $.data.participating_weight_pct, c3_score2: $.data.readiness_score, c3_band: $.data.readiness_band }
          assert:
            - "${c3_scored} == 4 and ${c3_earned} == 4 (the NOT_APPLICABLE weight 6 is excluded from BOTH sums)"
            - "${c3_score} == 100.00 and ${c3_contrib} == true"
            - "${c3_weight} == 100.00, ${c3_score2} == 100.00 and ${c3_band} == READY"
            - "Standard.${c3_s2}.compliance_state is unchanged by a NOT_APPLICABLE observation"

      - name: ppr_denominator_counts_unrated_chapter_standards
        claim_type: input_set_filtering
        grounds:
          - calculations.ppr_chapter_assessment.input_set
          - calculations.ppr_chapter_assessment.constants.OVERSTATEMENT_THRESHOLD
        distinguishing_aspect: "With 2 chapter standards and only 1 rated COMPLIANT, self_score is 100/2 = 50.00 rather than 100.00, because the denominator is Chapter.standard_count, not the number of ratings supplied."
        test_recipe:
          setup:
            - "Chapter PC with two standards; only the first has an ACTIVE owner (MAPPED = 50 points), the second is UNMAPPED (0 points)."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "PC", name: "Provision of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c4_ch: $.data.id }
            - call: "POST /accreditation/chapters/${c4_ch}/standards"
              payload: { standard_code: "PC.01.02.03", title: "Care planning", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c4_s1: $.data.id }
            - call: "POST /accreditation/chapters/${c4_ch}/standards"
              payload: { standard_code: "PC.02.01.21", title: "Pain assessment", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c4_s2: $.data.id }
            - call: "POST /accreditation/standards/${c4_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/chapters/${c4_ch}/ppr-self-assessments"
              payload: { period_label: "2026-H1", self_ratings: [{ standard_id: "${c4_s1}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { c4_p: $.data.id, c4_self: $.data.self_score, c4_ver: $.data.verified_score, c4_gap: $.data.gap, c4_flag: $.data.flagged_overstatement }
            - call: "GET /accreditation/chapters/${c4_ch}"
              as: AccreditationDirector
              captures: { c4_esc: $.data.ppr_escalation_count, c4_cflag: $.data.readiness_flag }
          assert:
            - "${c4_self} == 50.00 (100 points over denominator 2, the unrated standard still counts)"
            - "${c4_ver} == 25.00 (MAPPED 50 + UNMAPPED 0 over 2)"
            - "${c4_gap} == 25.00 and ${c4_flag} == true (25.00 >= OVERSTATEMENT_THRESHOLD 10.0)"
            - "${c4_esc} == 1 and ${c4_cflag} == ON_TRACK and PprSelfAssessment.${c4_p}.state == RETURNED_FOR_REASSESSMENT"

      - name: survey_window_prediction_clamps_to_end_of_month
        claim_type: correct_result
        grounds:
          - calculations.survey_window_prediction.formula
          - calculations.survey_window_prediction.constants.MIN_INTERVAL_MONTHS
          - calculations.survey_window_prediction.constants.COMMAND_CENTER_LEAD_DAYS
        distinguishing_aspect: "prior_survey_end_date 2025-08-31 + 18 months clamps to 2027-02-28 (February has no 31st) while + 36 months lands on 2028-08-31, and the command-center lead is exact 24h day arithmetic giving 2027-01-29."
        test_recipe:
          setup:
            - "Empty database; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2027", prior_survey_end_date: "2025-08-31T00:00:00Z" }
              as: AccreditationDirector
              captures: { c5_sw: $.data.id, c5_open: $.data.predicted_open_date, c5_close: $.data.predicted_close_date, c5_cc: $.data.command_center_activation_allowed_from, c5_ws: $.data.window_state }
          assert:
            - "${c5_open} == 2027-02-28T00:00:00.000Z (day-of-month clamped, not 2027-03-03)"
            - "${c5_close} == 2028-08-31T00:00:00.000Z"
            - "${c5_cc} == 2027-01-29T00:00:00.000Z (2027-02-28 minus exactly 30 x 24h)"
            - "${c5_ws} == PROJECTED and command_center_state == STANDBY"

      - name: deficiency_severity_days_low_is_forty_five_unaccelerated
        claim_type: constants_applied
        grounds:
          - calculations.deficiency_due_at.constants.SEVERITY_DAYS
          - entities.DeficiencyTicket.fields.accelerated
        distinguishing_aspect: "A LOW ticket on a NOT_ASSESSED unit uses SEVERITY_DAYS[LOW] = 45 unhalved, so due_at is 2026-09-15 with accelerated false and penalty_points 1."
        test_recipe:
          setup:
            - "Unit AMB-1 with no tracer at all (readiness_band NOT_ASSESSED); one standard to reference; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c6_ch: $.data.id }
            - call: "POST /accreditation/chapters/${c6_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { c6_s1: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "AMB-1", unit_type: "AMBULATORY", bed_count: 0 }
              as: AccreditationDirector
              captures: { c6_u: $.data.id }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${c6_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: SafetyOfficer
              captures: { c6_rs: $.data.id }
          trigger:
            - call: "POST /accreditation/rounding-sessions/${c6_rs}/deficiencies"
              payload: { standard_id: "${c6_s1}", description: "Unlabelled spray bottle", severity: "LOW" }
              as: SafetyOfficer
              captures: { c6_k: $.data.id, c6_due: $.data.due_at, c6_acc: $.data.accelerated, c6_pts: $.data.penalty_points, c6_state: $.data.state }
            - call: "GET /accreditation/units/${c6_u}"
              as: SafetyOfficer
              captures: { c6_u_pts: $.data.open_deficiency_penalty_points, c6_u_band: $.data.readiness_band, c6_u_posture: $.data.posture }
          assert:
            - "${c6_due} == 2026-09-15T00:00:00.000Z (2026-08-01 plus exactly 45 x 24h)"
            - "${c6_acc} == false because the band snapshot NOT_ASSESSED is outside {AT_RISK, NOT_READY}"
            - "${c6_pts} == 1 and ${c6_state} == OPEN"
            - "${c6_u_pts} == 1, ${c6_u_band} == NOT_ASSESSED and ${c6_u_posture} == OPEN (1 < POSTURE_RESTRICT_POINTS 15)"

      - name: unit_readiness_variant_divergence_attested_versus_projected
        claim_type: variant_divergence
        grounds:
          - calculations.unit_readiness_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / unit_readiness_attested_vs_projected_penalty_set
          rationale: "Both variants, their delta and the differing bands are asserted there on one shared ticket set."

      - name: ppr_variant_divergence_self_versus_verified
        claim_type: variant_divergence
        grounds:
          - calculations.ppr_chapter_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / ppr_self_reported_vs_evidence_verified_chapter_score
          rationale: "self_score 100.00 versus verified_score 50.00 on identical data is that instance's subject."

      - name: esc_due_variant_selection_by_context
        claim_type: variant_selection
        grounds:
          - calculations.esc_response_due_at.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / esc_deadline_initial_vs_clarification_variant
          rationale: "Variant initial at CLOSE_SURVEY and variant clarification at esc-review are both asserted there with pinned instants."

      - name: finding_rate_threshold_boundary_values
        claim_type: threshold_boundary
        grounds:
          - calculations.finding_risk_classification.constants.RATE_PATTERN_MIN
        excluded_because:
          difficulty_instance: boundary_precision_check / noncompliance_rate_pattern_threshold_four_decimal_precision
          rationale: "0.3300 / 0.3400 / 0.3333 around RATE_PATTERN_MIN are asserted there."

      - name: finding_risk_index_cap_applied
        claim_type: correct_result
        grounds:
          - calculations.finding_risk_classification.constants.INDEX_CAP
        excluded_because:
          difficulty_instance: combinatorial_formula / finding_risk_index_four_input_non_linear_cap
          rationale: "The four-input index, its cap at 6 and the resulting risk levels are asserted there."

      - name: unit_readiness_weighted_scoring_round_then_sum
        claim_type: weighted_scoring_boundary
        grounds:
          - calculations.unit_readiness_score.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / readiness_round_per_chapter_then_sum_pinned_order
          rationale: "The pinned round-then-sum order across three chapters is asserted there."

      - name: deficiency_due_at_band_snapshot_ordering
        claim_type: threshold_boundary
        grounds:
          - calculations.deficiency_due_at.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / deficiency_due_at_band_snapshot_precedes_own_penalty
          rationale: "The pinned pre-insert band snapshot and the acceleration flip are asserted there."

      - name: empty_participating_chapter_set_result
        claim_type: correct_result
        grounds:
          - calculations.unit_readiness_score.formula
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_participating_set_not_assessed_versus_zero_score
          rationale: "The empty participating set (0.00 / NOT_ASSESSED, penalty not applied) is asserted there."

      - name: tracer_window_interval_adjacency
        claim_type: interval_merge_boundary
        grounds:
          - calculations.tracer_window_occupancy
        excluded_because:
          difficulty_instance: resource_temporal_overlap / tracer_half_open_interval_with_sixty_minute_turnaround_buffer
          rationale: "The half-open interval plus 60-minute buffer boundary is asserted there."

      - name: rounding_session_aggregate_capacity_limit
        claim_type: aggregation_boundary
        grounds:
          - calculations.rounding_session_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rounding_session_aggregate_capacity_two_closed_intervals
          rationale: "Aggregate capacity 2 with touching endpoints is asserted there."

      - name: survey_window_occupancy_touching_endpoints
        claim_type: interval_merge_boundary
        grounds:
          - calculations.survey_window_prediction.formula
        excluded_because:
          difficulty_instance: resource_temporal_overlap / survey_window_hospital_wide_capacity_one_touching_endpoints
          rationale: "Hospital-wide capacity 1 with touching endpoints is asserted there."

  # =========================================================================
  # Guide section 4 - Validations
  # =========================================================================
  - section: validations
    instances:
      - name: pagination_limit_zero_returns_invalid_pagination
        claim_type: violation_error
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_PAGINATION]
          - endpoints[GET /accreditation/deficiency-tickets]
        distinguishing_aspect: "limit 0 is outside the declared [1,100] range, so the list endpoint returns ERR_INVALID_PAGINATION with HTTP 400 instead of an empty page."
        test_recipe:
          setup:
            - "Empty database (the rule is evaluated before any row is read)."
          setup_api_calls: []
          trigger:
            - call: "GET /accreditation/deficiency-tickets"
              payload: { limit: 0, offset: 0 }
              as: SafetyOfficer
              captures: { v1_err: $.data.error_id }
          assert:
            - "${v1_err} == ERR_INVALID_PAGINATION with HTTP 400"

      - name: tracer_zero_length_window_returns_invalid_interval
        claim_type: violation_error
        grounds:
