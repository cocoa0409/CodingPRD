          setup:
            - "chain_l5 truncated: every call up to and including the approval of prop_lc, but NOT the notice-issue, the clock move or the execute. The slot slot_lc is therefore PENDING_REPLACEMENT with prop_lc APPROVED and notice_delivered_at null, and the capacity triple is occupied 5 + reserved 1 + available 0 == 6."
