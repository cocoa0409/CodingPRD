            - call: "GET /home-oxygen/cmns/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Physician
              captures: { e_cmn_phys: $.data.error_id }
            - call: "GET /home-oxygen/patients/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DeliveryDriver
