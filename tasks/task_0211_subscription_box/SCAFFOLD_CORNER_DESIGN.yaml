            - "GiftGrant.${gift_id}.status == ISSUED"

      - name: gift_redeem_creates_prepaid_gift_subscription
        claim_type: Correct Result
        grounds: [endpoints, entities.Subscription.fields.is_gift, entities.Subscription.fields.prepaid_periods_remaining]
        distinguishing_aspect: "Redeeming a 3-period gift creates a Subscription with is_gift==true, billing_status==PREPAID, prepaid_periods_remaining==3, lifecycle ACTIVE; GiftGrant flips to REDEEMED."
