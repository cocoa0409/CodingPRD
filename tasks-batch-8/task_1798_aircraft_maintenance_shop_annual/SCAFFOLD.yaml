  - { method: POST, path: "/api/work-orders/{id}/begin-work", description: "APPROVED -> WORK_IN_PROGRESS", roles: [Mechanic], code: 200, input: [], output: WorkOrder, side_effects: ["WorkOrder.version += 1"] }
  - { method: POST, path: "/api/work-orders/{id}/labor-entries", description: "Post labor entry (tenths)", roles: [Mechanic], code: 201, input: [mechanic_id, duration_tenths, notes], output: LaborEntry, side_effects: ["WorkOrder.labor_hours_tenths recomputed"] }
  - { method: GET, path: "/api/work-orders/{id}/labor-entries", description: "List labor entries", roles: [ShopManager, Mechanic, Owner], code: 200, input: ["status?", "mechanic_id?"], output: "LaborEntry[]", side_effects: [] }
