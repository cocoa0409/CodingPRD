              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 100.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E851", full_name: "Ada Long", job_level: "L5", base_salary_cents: 20000000, hire_date: "2025-03-01" }
              as: PlanAdmin
              captures: { p_ada: "$.data.id" }
            - call: "POST /accrual-periods"
              payload: { plan_id: "${plan_id}", period_start: "2026-01-01", period_end: "2026-06-30", forecast_company_achievement_pct: 100.00 }
              as: FinanceController
              captures: { per1: "$.data.id" }
            - call: "POST /accrual-periods/${per1}/post"
              payload: { posting_note: "H1" }
              as: FinanceController
            - call: "POST /accrual-periods"
              payload: { plan_id: "${plan_id}", period_start: "2026-07-01", period_end: "2026-12-31", forecast_company_achievement_pct: 100.00 }
              as: FinanceController
              captures: { per2: "$.data.id" }
            - call: "POST /accrual-periods/${per2}/post"
              payload: { posting_note: "H2" }
              as: FinanceController
          trigger:
            - call: "POST /accrual-periods/${per1}/post"
              payload: { posting_note: "double post" }
              as: FinanceController
            - call: "POST /accrual-periods/${per1}/reverse"
              payload: { reversal_reason: "out of order reversal" }
              as: FinanceController
            - call: "POST /accrual-periods/${per2}/reverse"
