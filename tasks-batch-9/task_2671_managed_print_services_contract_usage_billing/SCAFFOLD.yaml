scenario: |
  Generate task harder than expert level!

  2671. Managed Print Services Contract & Usage Billing (managed print services provider): fleet
  assessment with device inventory, volume capture and total cost of ownership baseline, contract
  structure with cost per page tiers, minimum volumes and included service scope, device placement,
  network integration and secure print release configuration, automated meter reading with exception
  handling for offline devices and manual reads, consumables auto-replenishment triggered by toner
  levels with waste and hoarding controls, service dispatch with response time commitments and parts
  availability, quarterly business review with volume trends, right-sizing recommendations and
  refresh planning, end-of-contract device removal, data sanitization and settlement

domain_name: managed-print-services-contract-usage-billing
api_prefix: ""          # flat topology: every collection sits at the URL root (/service-contracts, /devices, /meter-reads, ...)

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit FK fields; no entity is nested inside another's URL path except
  # for read-only sub-resource listings (cost-tiers, lines, spare-part-stocks) and action endpoints.

  state_machine_shape: cyclic
  # MeterRead cycles PENDING_VALIDATION -> EXCEPTION -> PENDING_VALIDATION; ServiceContract cycles
  # ACTIVE -> SUSPENDED -> ACTIVE; Device carries two independent state dimensions
  # (lifecycle_state x supply_state); ServiceTicket forks DISPATCHED -> {PARTS_HOLD, ONSITE} -> RESOLVED.

  relationship_patterns:
    - one_to_many          # ServiceContract -> Site/Device/BillingPeriod/QuarterlyReview/RemovalOrder
    - self_referential     # Device.replaced_by_device_id -> Device.id (refresh / right-sizing chain)
    - cross_aggregate      # StatementLine.device_id crosses the billing aggregate into the fleet aggregate

  role_model: segregation_of_duties
  # The FleetOpsController who resolves a meter-read exception MUST NOT be the user who submitted the
  # read; the AccountManager who approves a QuarterlyReview MUST NOT be the user who authored it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - name: customer_name
        type: string
        source: input
        description: Legal name of the managed-print customer.
        constraints: non-empty, max 120 chars
      - name: term_months
        type: integer
        source: input
        description: Contract term length in months.
        constraints: 12..60
      - name: status
        type: enum
        source: system
        description: Contract lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, TERMINATING, CLOSED}"
      - name: included_service_scope
        type: enum
        source: input
        description: Whether break/fix labor is inside the cost-per-page envelope.
        constraints: "one of {BASIC, FULL}; BASIC bills labor as a statement line, FULL bills 0 labor"
      - name: minimum_mono_pages_per_period
        type: integer
        source: input
        description: Contracted monochrome minimum volume per billing period; shortfall is billed.
        constraints: ">= 0"
      - name: minimum_color_pages_per_period
        type: integer
        source: input
        description: Contracted color minimum volume per billing period; shortfall is billed.
        constraints: ">= 0"
      - name: monthly_service_fee_cents
        type: integer
        source: input
        description: Fixed monthly service fee; the SLA credit base amount.
        constraints: ">= 0"
      - name: response_sla_hours_critical
        type: integer
        source: input
        description: Response-time commitment in hours for CRITICAL tickets.
        default: 4
        constraints: 1..72
      - name: response_sla_hours_standard
        type: integer
        source: input
        description: Response-time commitment in hours for STANDARD tickets.
        default: 24
        constraints: 1..168
      - name: labor_rate_cents_per_hour
        type: integer
        source: input
        description: Billable labor rate used when included_service_scope == BASIC.
        default: 9500
        constraints: ">= 0"
      - name: early_termination_fee_cents
        type: integer
        source: input
        description: Fee added to the removal settlement when the contract is terminated before term end.
        default: 0
        constraints: ">= 0"
      - name: active_device_count
        type: integer
        source: computed
        description: "Count of Device rows with contract_id == this.id and lifecycle_state IN {PLACED, NETWORKED, ACTIVE, SERVICE_HOLD}."
        default: 0
      - name: consumables_committed_cents
        type: integer
        source: computed
        description: "Sum of ConsumableOrder.committed_cents over orders whose device.contract_id == this.id and status == ORDERED."
        default: 0
      - name: true_up_balance_cents
        type: integer
        source: computed
        description: "Running sum over CLOSED BillingPeriods of (FINAL statement total_cents - PROVISIONAL statement total_cents); 0 when a period had no PROVISIONAL statement."
        default: 0
      - name: lifetime_billed_cents
        type: integer
        source: computed
        description: "Sum of total_cents over BillingStatement rows with variant == FINAL whose period belongs to this contract."
        default: 0
      - name: suspension_count
        type: integer
        source: computed
        description: Number of completed ACTIVE -> SUSPENDED transitions on this contract.
        default: 0
      - name: suspension_reason
        type: enum
        source: system
        description: Reason recorded by the most recent suspend; retained after resume for audit.
        default: NONE
        constraints: "one of {NONE, NONPAYMENT, DISPUTE, CUSTOMER_REQUEST}"

  - name: CostTier
    parent: ServiceContract
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> ServiceContract.id; the contract whose rate card this tier row belongs to.
      - name: page_class
        type: enum
        source: input
        description: Which meter this tier row prices.
        constraints: "one of {MONO, COLOR}"
      - name: tier_index
        type: integer
        source: input
        description: 1-based ordering of the tier row inside (contract_id, page_class).
        constraints: ">= 1; unique per (contract_id, page_class)"
      - name: from_page
        type: integer
        source: input
        description: Inclusive lower bound of contract-level period volume that selects this tier.
        constraints: ">= 1; tier_index 1 MUST have from_page == 1"
      - name: to_page
        type: integer
        source: input
        description: Inclusive upper bound of contract-level period volume; null means unbounded.
        constraints: "null or >= from_page; exactly one row per (contract_id, page_class) may have to_page == null"
      - name: rate_micro_dollars_per_page
        type: integer
        source: input
        description: Cost per page in micro-dollars (1 cent == 10000 micro-dollars); e.g. 8900 == $0.0089/page.
        constraints: ">= 1"

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> ServiceContract.id; the contract that covers this customer location.
      - name: name
        type: string
        source: input
        description: Human-readable site name.
        constraints: non-empty
      - name: address_region
        type: string
        source: input
        description: Dispatch region code used to match Technician.home_region.
        constraints: "non-empty, upper-case, e.g. NE-01"
      - name: secure_release_state
        type: enum
        source: system
        description: Secure print release configuration state for the site.
        default: UNCONFIGURED
        constraints: "one of {UNCONFIGURED, PENDING_VALIDATION, CONFIGURED, FAILED}"
      - name: release_method
        type: enum
        source: input
        description: Authentication method for secure print release; set by the secure-release-config call.
        default: NONE
        constraints: "one of {NONE, BADGE, PIN}"
      - name: network_vlan_tag
        type: integer
        source: input
        description: VLAN tag the print devices join during network integration.
        default: null
        constraints: "null or 1..4094"
      - name: toner_unit_cap
        type: integer
        source: input
        description: Hoarding control - maximum toner units that may be open (ConsumableOrder.status == ORDERED) across the site at once.
        default: 4
        constraints: ">= 1"
      - name: open_toner_units
        type: integer
        source: computed
        description: "Sum of ConsumableOrder.quantity over orders whose device.site_id == this.id and status == ORDERED."
        default: 0

  - name: SparePartStock
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the site whose parts locker holds this SKU.
      - name: part_sku
        type: string
        source: input
        description: Spare-part SKU string.
        constraints: "non-empty; unique per (site_id, part_sku)"
      - name: on_hand_qty
        type: integer
        source: system
        description: Units physically on hand; adjusted by the spare-part-stocks endpoint's qty_delta.
        default: 0
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: computed
        description: "Count of ServiceTicket rows with part_sku == this.part_sku, device.site_id == this.site_id, and status IN {DISPATCHED, PARTS_HOLD, ONSITE}."
        default: 0

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> ServiceContract.id; the contract this asset is billed under.
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the placement location assessed for this asset.
      - name: asset_tag
        type: string
        source: input
        description: Customer asset tag.
        constraints: "non-empty; unique per contract_id"
      - name: model_code
        type: string
        source: input
        description: Manufacturer model code.
        constraints: non-empty
      - name: color_capable
        type: boolean
        source: input
        description: Whether the device can print color pages.
        default: false
      - name: rated_monthly_duty_cycle
        type: integer
        source: input
        description: Manufacturer rated monthly page volume; denominator of the right-sizing utilization ratio.
        constraints: ">= 1"
      - name: lifecycle_state
        type: enum
        source: system
        description: Placement/decommission dimension of the device state (independent of supply_state).
        default: ASSESSED
        constraints: "one of {ASSESSED, PLACED, NETWORKED, ACTIVE, SERVICE_HOLD, RETRIEVED, REMOVED}"
      - name: supply_state
        type: enum
        source: system
        description: Consumables dimension of the device state (independent of lifecycle_state).
        default: SUPPLY_OK
        constraints: "one of {SUPPLY_OK, SUPPLY_LOW, SUPPLY_ORDERED, SUPPLY_BLOCKED}"
      - name: toner_level_pct
        type: integer
        source: system
        description: Toner remaining percentage as of the most recently ACCEPTED meter read.
        default: 100
        constraints: 0..100
      - name: last_accepted_mono_meter
        type: integer
        source: system
        description: Absolute monochrome meter value of the most recently ACCEPTED read; 0 before any read.
        default: 0
      - name: last_accepted_color_meter
        type: integer
        source: system
        description: Absolute color meter value of the most recently ACCEPTED read; 0 before any read.
        default: 0
      - name: last_read_at
        type: datetime
        source: system
        description: coverage_end of the most recently ACCEPTED read; null before any read.
        default: null
      - name: lifetime_mono_pages
        type: integer
        source: computed
        description: "Sum of MeterRead.mono_delta over reads with device_id == this.id and status == ACCEPTED."
        default: 0
      - name: lifetime_color_pages
        type: integer
        source: computed
        description: "Sum of MeterRead.color_delta over reads with device_id == this.id and status == ACCEPTED."
        default: 0
      - name: pages_since_last_cartridge
        type: integer
        source: computed
        description: "Sum of (mono_delta + color_delta) over ACCEPTED reads whose coverage_end > the delivered_at of the latest DELIVERED ConsumableOrder for this device; equals lifetime_mono_pages + lifetime_color_pages when no order was ever delivered."
        default: 0
      - name: offline_exception_count
        type: integer
        source: computed
        description: "Count of MeterRead rows with device_id == this.id, status == EXCEPTION and exception_reason == DEVICE_OFFLINE."
        default: 0
      - name: waste_event_count
        type: integer
        source: computed
        description: "Count of ConsumableOrder rows with device_id == this.id and waste_flagged == true and status != CANCELLED."
        default: 0
      - name: secure_release_enrolled
        type: boolean
        source: system
        description: Set true by network integration when the site's release_method is BADGE or PIN.
        default: false
      - name: assessed_monthly_mono_pages
        type: integer
        source: input
        description: Fleet-assessment baseline monochrome volume per month for this asset (TCO baseline input).
        constraints: ">= 0"
      - name: assessed_monthly_color_pages
        type: integer
        source: input
        description: Fleet-assessment baseline color volume per month for this asset (TCO baseline input).
        constraints: ">= 0"
      - name: baseline_cost_micro_dollars_per_page
        type: integer
        source: input
        description: Pre-contract total cost of ownership per page in micro-dollars, from the fleet assessment.
        constraints: ">= 1"
      - name: baseline_overhead_cents_per_month
        type: integer
        source: input
        description: Pre-contract fixed overhead per month allocated to this asset (help-desk, storage, admin).
        constraints: ">= 0"
      - name: right_sizing_action
        type: enum
        source: computed
        description: Right-sizing recommendation written by the most recent QuarterlyReview creation for this device's contract.
        default: NONE
        constraints: "one of {NONE, RETAIN, DOWNGRADE, UPGRADE, CONSOLIDATE}"
      - name: refresh_due
        type: boolean
        source: computed
        description: True when the most recent QuarterlyReview creation classified this device as refresh-due (right_sizing_action IN {UPGRADE, CONSOLIDATE}).
        default: false
      - name: replaced_by_device_id
        type: string
        source: input
        description: FK -> Device.id; the successor asset that replaces this one under a refresh plan; null while the asset is not superseded.
        default: null
      - name: removal_order_id
        type: string
        source: system
        description: FK -> RemovalOrder.id; set when a RemovalOrder that covers this device is created; null otherwise.
        default: null

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Technician name.
        constraints: non-empty
      - name: home_region
        type: string
        source: input
        description: Dispatch region the technician serves; MUST equal Site.address_region to be dispatchable.
        constraints: non-empty, upper-case
      - name: skill_level
        type: enum
        source: input
        description: Certification level; L1 cannot take CRITICAL tickets.
        constraints: "one of {L1, L2, L3}"
      - name: travel_buffer_minutes
        type: integer
        source: input
        description: Travel buffer applied on BOTH sides of every dispatch window this technician occupies.
        default: 30
        constraints: 0..120
      - name: open_dispatch_count
        type: integer
        source: computed
        description: "Count of ServiceTicket rows with assigned_technician_id == this.id and status IN {DISPATCHED, PARTS_HOLD, ONSITE}."
        default: 0

  - name: MeterRead
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id; the metered asset.
      - name: billing_period_id
        type: string
        source: input
        description: FK -> BillingPeriod.id; the period whose half-open [period_start, period_end) window contains coverage_end.
      - name: source
        type: enum
        source: system
        description: How the read entered the system - AUTOMATED (data collection agent), MANUAL (technician), SWEEP_ESTIMATE (meter sweep placeholder for an offline device).
        constraints: "one of {AUTOMATED, MANUAL, SWEEP_ESTIMATE}"
      - name: status
        type: enum
        source: system
        description: Validation state of the read.
        default: PENDING_VALIDATION
        constraints: "one of {PENDING_VALIDATION, ACCEPTED, EXCEPTION, VOID}"
      - name: mono_meter
        type: integer
        source: input
        description: Absolute monochrome meter reading on the device counter.
        constraints: ">= 0"
      - name: color_meter
        type: integer
        source: input
        description: Absolute color meter reading on the device counter.
        constraints: ">= 0"
      - name: toner_level_pct
        type: integer
        source: input
        description: Toner remaining percentage reported with this read.
        constraints: 0..100
      - name: coverage_start
        type: datetime
        source: input
        description: Inclusive start of the usage interval this read covers.
      - name: coverage_end
        type: datetime
        source: input
        description: Exclusive end of the usage interval this read covers; intervals are half-open [coverage_start, coverage_end).
      - name: mono_delta
        type: integer
        source: computed
        description: "mono_meter - Device.last_accepted_mono_meter evaluated at acceptance time; 0 while status != ACCEPTED."
        default: 0
      - name: color_delta
        type: integer
        source: computed
        description: "color_meter - Device.last_accepted_color_meter evaluated at acceptance time; 0 while status != ACCEPTED."
        default: 0
      - name: exception_reason
        type: enum
        source: system
        description: Why the read landed in EXCEPTION.
        default: NONE
        constraints: "one of {NONE, DEVICE_OFFLINE, ROLLBACK, IMPLAUSIBLE_SPIKE}"
      - name: read_at
        type: datetime
        source: system
        description: Logical clock value when the read was recorded.
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that created the read; opaque operator identifier, not a foreign key.
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the FleetOpsController that resolved the exception; null while unresolved. Opaque operator identifier, not a foreign key.
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Free-text note recorded when an exception is resolved.
        default: null
      - name: voided_reason
        type: enum
        source: input
        description: Reason recorded when an ACCEPTED read is voided.
        default: NONE
        constraints: "one of {NONE, WRONG_DEVICE, DUPLICATE_CAPTURE, CUSTOMER_DISPUTE}"

  - name: BillingPeriod
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> ServiceContract.id; the contract being billed.
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the billing window.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the billing window; windows are half-open [period_start, period_end).
      - name: status
        type: enum
        source: system
        description: Billing-run state of the period.
        default: OPEN
        constraints: "one of {OPEN, SWEPT, PROVISIONAL, CLOSED}"
      - name: sweep_run_count
        type: integer
        source: computed
        description: Number of completed meter-sweep runs on this period.
        default: 0
      - name: exception_open_count
        type: integer
        source: computed
        description: "Count of MeterRead rows with billing_period_id == this.id and status IN {PENDING_VALIDATION, EXCEPTION}."
        default: 0
      - name: provisional_total_cents
        type: integer
        source: computed
        description: total_cents of the PROVISIONAL BillingStatement for this period; null when none exists.
        default: null
      - name: final_total_cents
        type: integer
        source: computed
        description: total_cents of the FINAL BillingStatement for this period; null until the period is CLOSED.
        default: null

  - name: BillingStatement
    parent: BillingPeriod
    common_fields: true
    fields:
      - name: billing_period_id
        type: string
        source: input
        description: FK -> BillingPeriod.id; the period this statement bills.
      - name: variant
        type: enum
        source: system
        description: PROVISIONAL (forward-looking projection) or FINAL (chronological actuals).
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: projection_basis
        type: enum
        source: system
        description: PROJECTED for PROVISIONAL statements, ACTUAL for FINAL statements.
        constraints: "one of {PROJECTED, ACTUAL}"
      - name: mono_pages_billed
        type: integer
        source: computed
        description: Contract-level monochrome pages the statement priced (projected for PROVISIONAL, actual for FINAL).
        default: 0
      - name: color_pages_billed
        type: integer
        source: computed
        description: Contract-level color pages the statement priced.
        default: 0
      - name: mono_tier_index
        type: integer
        source: computed
        description: tier_index of the CostTier selected for MONO by the contract-level volume; 0 when no MONO tier matched.
        default: 0
      - name: color_tier_index
        type: integer
        source: computed
        description: tier_index of the CostTier selected for COLOR by the contract-level volume; 0 when no COLOR tier matched.
        default: 0
      - name: mono_rate_micro_dollars_per_page
        type: integer
        source: computed
        description: rate_micro_dollars_per_page of the selected MONO tier.
        default: 0
      - name: color_rate_micro_dollars_per_page
        type: integer
        source: computed
        description: rate_micro_dollars_per_page of the selected COLOR tier.
        default: 0
      - name: usage_subtotal_cents
        type: integer
        source: computed
        description: Sum of StatementLine.amount_cents over this statement's lines (per-line rounding, then summation).
        default: 0
      - name: shortfall_pages
        type: integer
        source: computed
        description: Total minimum-volume shortfall pages across MONO and COLOR.
        default: 0
      - name: shortfall_cents
        type: integer
        source: computed
        description: Charge for the minimum-volume shortfall, priced at the tier_index 1 rate of each page_class.
        default: 0
      - name: service_labor_cents
        type: integer
        source: computed
        description: Billable break/fix labor for the period; always 0 when contract.included_service_scope == FULL.
        default: 0
      - name: sla_credit_cents
        type: integer
        source: computed
        description: Sum of ServiceTicket.sla_credit_cents for tickets RESOLVED inside the period window; subtracted from the total.
        default: 0
      - name: waste_penalty_cents
        type: integer
        source: computed
        description: Consumables waste penalty for the period; always 0 on PROVISIONAL statements.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: Statement total after usage, shortfall, labor, waste penalty and SLA credit.
        default: 0
      - name: generated_at
        type: datetime
        source: system
        description: Logical clock value when the statement was generated.

  - name: StatementLine
    parent: BillingStatement
    common_fields: false
    fields:
      - name: statement_id
        type: string
        source: input
        description: FK -> BillingStatement.id; the statement this line belongs to.
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id; the device whose pages this line prices.
      - name: page_class
        type: enum
        source: computed
        description: Which meter this line prices.
        constraints: "one of {MONO, COLOR}"
      - name: pages
        type: integer
        source: computed
        description: Pages attributed to this device and page_class for the statement's period.
        default: 0
      - name: rate_micro_dollars_per_page
        type: integer
        source: computed
        description: Rate copied from the statement's selected tier for this page_class.
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: "round_half_up(pages * rate_micro_dollars_per_page / 10000) - rounded at the line, before summation."
        default: 0

  - name: ConsumableOrder
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id; the device the cartridge is destined for.
      - name: part_type
        type: enum
        source: input
        description: Cartridge type ordered.
        constraints: "one of {TONER_BLACK, TONER_COLOR}"
      - name: quantity
        type: integer
        source: input
        description: Number of cartridge units on the order.
        default: 1
        constraints: 1..3
      - name: unit_price_cents
        type: integer
        source: input
        description: Price per cartridge unit in cents.
        constraints: ">= 1"
      - name: committed_cents
        type: integer
        source: computed
        description: "quantity * unit_price_cents; the amount held against ServiceContract.consumables_committed_cents while status == ORDERED."
        default: 0
      - name: status
        type: enum
        source: system
        description: Fulfilment state of the replenishment order.
        default: ORDERED
        constraints: "one of {ORDERED, DELIVERED, CANCELLED}"
      - name: trigger_source
        type: enum
        source: system
        description: AUTO_THRESHOLD when raised by a toner-level threshold crossing during read acceptance, MANUAL when raised through the consumable-orders endpoint.
        constraints: "one of {AUTO_THRESHOLD, MANUAL}"
      - name: pages_since_last_cartridge_at_order
        type: integer
        source: system
        description: Snapshot of Device.pages_since_last_cartridge at the moment the order was created; the waste-control input.
        default: 0
      - name: waste_flagged
        type: boolean
        source: computed
        description: "True when pages_since_last_cartridge_at_order < MIN_CARTRIDGE_PAGES and the device has had at least one DELIVERED order before this one."
        default: false
      - name: delivered_at
        type: datetime
        source: system
        description: Logical clock value when the cartridge was recorded delivered; null until then.
        default: null
      - name: cancel_reason
        type: enum
        source: input
        description: Reason recorded when an open order is cancelled.
        default: NONE
        constraints: "one of {NONE, HOARDING_CONTROL, WRONG_PART, DEVICE_REMOVED, READ_VOIDED}"

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id; the failing asset.
      - name: assigned_technician_id
        type: string
        source: system
        description: FK -> Technician.id; set by dispatch, null while OPEN.
        default: null
      - name: severity
        type: enum
        source: input
        description: Ticket severity; selects which contract response-time commitment applies.
        constraints: "one of {CRITICAL, STANDARD}"
      - name: status
        type: enum
        source: system
        description: Dispatch state of the ticket.
        default: OPEN
        constraints: "one of {OPEN, DISPATCHED, PARTS_HOLD, ONSITE, RESOLVED, CANCELLED}"
      - name: symptom_code
        type: string
        source: input
        description: Reported fault code.
        constraints: non-empty
      - name: part_sku
        type: string
        source: input
        description: Spare-part SKU required for the repair; null when no part is needed. Matched against SparePartStock.part_sku at the device's site.
        default: null
      - name: opened_at
        type: datetime
        source: system
        description: Logical clock value at ticket creation.
      - name: respond_by
        type: datetime
        source: computed
        description: "opened_at + (severity == CRITICAL ? contract.response_sla_hours_critical : contract.response_sla_hours_standard) hours."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the onsite dispatch window reserved on the technician.
        default: null
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the onsite dispatch window reserved on the technician.
        default: null
      - name: hold_started_at
        type: datetime
        source: system
        description: Logical clock value when the ticket entered PARTS_HOLD; null when never held.
        default: null
      - name: parts_hold_hours
        type: integer
        source: computed
        description: "ceil((resolve time - hold_started_at) in hours) accumulated across PARTS_HOLD periods; 0 when never held."
        default: 0
      - name: responded_at
        type: datetime
        source: system
        description: Logical clock value at resolve; the response-time measurement point.
        default: null
      - name: hours_late
        type: integer
        source: computed
        description: "max(0, ceil((responded_at - respond_by) in hours)); 0 when resolved on time."
        default: 0
      - name: labor_hours
        type: number
        source: input
        description: Onsite labor hours reported at resolve.
        default: 0
        constraints: ">= 0"
      - name: labor_cents
        type: integer
        source: computed
        description: "0 when contract.included_service_scope == FULL, else ceil(labor_hours) * contract.labor_rate_cents_per_hour."
        default: 0
      - name: sla_credit_cents
        type: integer
        source: computed
        description: Response-time breach credit computed at resolve by the sla_response_credit calculation.
        default: 0

  - name: QuarterlyReview
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> ServiceContract.id; the contract under review.
      - name: quarter_label
        type: string
        source: input
        description: Quarter identifier.
        constraints: "matches ^[0-9]{4}-Q[1-4]$; unique per contract_id"
      - name: status
        type: enum
        source: system
        description: Review state.
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED}"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the AccountManager that created the review; opaque operator identifier, not a foreign key.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the AccountManager that approved the review; null while DRAFT. Opaque operator identifier, not a foreign key.
        default: null
      - name: baseline_savings_cents
        type: integer
        source: computed
        description: Savings computed on the ASSESSED variant of the tco_savings calculation (fleet-assessment volumes).
        default: 0
      - name: realized_savings_cents
        type: integer
        source: computed
        description: Savings computed on the REALIZED variant of the tco_savings calculation (actual closed-period volumes).
        default: 0
      - name: volume_trend_pct
        type: number
        source: computed
        description: Percentage change in total billed pages between the two most recent CLOSED periods of the contract; 0 when fewer than two exist.
        default: 0
      - name: retain_count
        type: integer
        source: computed
        description: Number of devices classified RETAIN by this review.
        default: 0
      - name: downgrade_count
        type: integer
        source: computed
        description: Number of devices classified DOWNGRADE by this review.
        default: 0
      - name: upgrade_count
        type: integer
        source: computed
        description: Number of devices classified UPGRADE by this review.
        default: 0
      - name: consolidate_count
        type: integer
        source: computed
        description: Number of devices classified CONSOLIDATE by this review.
        default: 0
      - name: refresh_due_device_count
        type: integer
        source: computed
        description: "upgrade_count + consolidate_count; the devices whose refresh_due flag this review set true."
        default: 0

  - name: RemovalOrder
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> ServiceContract.id; the contract being wound down.
      - name: status
        type: enum
        source: system
        description: End-of-contract removal state.
        default: REQUESTED
        constraints: "one of {REQUESTED, SCHEDULED, COLLECTED, SANITIZED, SETTLED}"
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned collection date/time.
      - name: device_count
        type: integer
        source: computed
        description: "Count of Device rows with removal_order_id == this.id."
        default: 0
      - name: sanitization_method
        type: enum
        source: input
        description: Data sanitization method applied to device storage.
        default: NONE
        constraints: "one of {NONE, CRYPTO_ERASE, OVERWRITE_3PASS, PHYSICAL_DESTRUCTION}"
      - name: sanitization_certificate_ref
        type: string
        source: input
        description: Certificate reference recorded at sanitization; required to leave COLLECTED.
        default: null
      - name: unbilled_pages_charge_cents
        type: integer
        source: computed
        description: Charge for ACCEPTED pages that no FINAL statement has billed yet, priced at the contract's tier_index 1 rates.
        default: 0
      - name: early_termination_fee_applied_cents
        type: integer
        source: computed
        description: "contract.early_termination_fee_cents when settlement occurs before the contract term ends, else 0."
        default: 0
      - name: device_residual_credit_cents
        type: integer
        source: computed
        description: Credit returned to the customer for returned assets, per the settlement_amount calculation.
        default: 0
      - name: gross_settlement_cents
        type: integer
        source: computed
        description: Settlement subtotal BEFORE the sanitization fee (the tier key for the sanitization volume discount).
        default: 0
      - name: sanitization_fee_cents
        type: integer
        source: computed
        description: Sanitization fee after the gross-keyed volume discount.
        default: 0
      - name: net_settlement_cents
        type: integer
        source: computed
        description: "gross_settlement_cents + sanitization_fee_cents; the amount invoiced at settlement."
        default: 0
      - name: settled_at
        type: datetime
        source: system
        description: Logical clock value when the removal order was settled; null until then.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-contracts/{id}/activate"
        actor: AccountManager
        preconditions:
          - "contract.status == DRAFT"
          - "at least one CostTier row exists for (contract_id, page_class=MONO) with tier_index == 1 and from_page == 1"
          - "if any Device with contract_id == contract.id has color_capable == true, at least one CostTier row exists for (contract_id, page_class=COLOR) with tier_index == 1 and from_page == 1"
        side_effects:
          - "contract.status := ACTIVE"
          - "contract.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-contracts/{id}/suspend"
        actor: AccountManager
        preconditions:
          - "contract.status == ACTIVE"
          - "no BillingPeriod of this contract has status == PROVISIONAL"
        side_effects:
          - "contract.status := SUSPENDED; contract.suspension_reason := body.reason"
          - "contract.suspension_count += 1"
          - "contract.version += 1"
        note: "Suspension blocks meter-read intake and billing runs but leaves device lifecycle untouched."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-contracts/{id}/resume"
        actor: AccountManager
        preconditions:
          - "contract.status == SUSPENDED"
        side_effects:
          - "contract.status := ACTIVE (suspension_reason retained for audit)"
          - "contract.version += 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE may repeat; suspension_count accumulates."
      - from: ACTIVE
        to: TERMINATING
        trigger: "POST /removal-orders (creation of the contract's removal order)"
        actor: AccountManager
        preconditions:
          - "contract.status == ACTIVE"
          - "no RemovalOrder with contract_id == contract.id has status IN {REQUESTED, SCHEDULED, COLLECTED, SANITIZED}"
        side_effects:
          - "contract.status := TERMINATING"
          - "contract.version += 1"
          - "every Device with contract_id == contract.id and lifecycle_state IN {PLACED, NETWORKED, ACTIVE, SERVICE_HOLD} gets removal_order_id := new RemovalOrder.id"
      - from: TERMINATING
        to: CLOSED
        trigger: "POST /removal-orders/{id}/settle"
        actor: BillingAnalyst
        preconditions:
          - "contract.status == TERMINATING"
          - "removal_order.status == SANITIZED"
          - "every BillingPeriod with contract_id == contract.id whose period_end <= the logical clock has status == CLOSED"
        side_effects:
          - "contract.status := CLOSED"
          - "contract.version += 1"

  - entity: Device
    initial_state: ASSESSED
    terminal_states: [REMOVED]
    transitions:
      - from: ASSESSED
        to: PLACED
        trigger: "POST /devices/{id}/place"
        actor: FieldTechnician
        preconditions:
          - "device.lifecycle_state == ASSESSED"
          - "contract.status == ACTIVE"
        side_effects:
          - "device.lifecycle_state := PLACED"
          - "device.version += 1"
          - "contract.active_device_count += 1"
      - from: PLACED
        to: NETWORKED
        trigger: "POST /devices/{id}/network-integration"
        actor: FieldTechnician
        preconditions:
          - "device.lifecycle_state == PLACED"
          - "site.network_vlan_tag is not null"
        side_effects:
          - "device.lifecycle_state := NETWORKED"
          - "device.secure_release_enrolled := (site.release_method IN {BADGE, PIN})"
          - "device.version += 1"
      - from: NETWORKED
        to: ACTIVE
        trigger: "POST /devices/{id}/activate"
        actor: FleetOpsController
        preconditions:
          - "device.lifecycle_state == NETWORKED"
          - "site.secure_release_state == CONFIGURED"
          - "contract.status == ACTIVE"
        side_effects:
          - "device.lifecycle_state := ACTIVE (device becomes eligible for meter-read intake)"
          - "device.version += 1"
        note: "Cross-entity guard: Device cannot go ACTIVE while its Site's secure print release is UNCONFIGURED, PENDING_VALIDATION or FAILED."
      - from: ACTIVE
        to: SERVICE_HOLD
        trigger: "POST /service-tickets/{id}/dispatch (cascade from the ticket's device)"
        actor: FleetOpsController
        preconditions:
          - "device.lifecycle_state == ACTIVE"
        side_effects:
          - "device.lifecycle_state := SERVICE_HOLD"
          - "device.version += 1"
      - from: SERVICE_HOLD
        to: ACTIVE
        trigger: "POST /service-tickets/{id}/resolve (cascade from the ticket's device)"
        actor: FieldTechnician
        preconditions:
          - "device.lifecycle_state == SERVICE_HOLD"
        side_effects:
          - "device.lifecycle_state := ACTIVE"
          - "device.version += 1"
        note: "Cycle: ACTIVE -> SERVICE_HOLD -> ACTIVE repeats once per dispatched ticket."
      - from: ACTIVE
        to: RETRIEVED
        trigger: "POST /removal-orders/{id}/collect (cascade over covered devices)"
        actor: FieldTechnician
        preconditions:
          - "device.lifecycle_state IN {PLACED, NETWORKED, ACTIVE, SERVICE_HOLD}"
          - "device.removal_order_id == removal_order.id"
        side_effects:
          - "device.lifecycle_state := RETRIEVED"
          - "device.version += 1"
      - from: SERVICE_HOLD
        to: RETRIEVED
        trigger: "POST /removal-orders/{id}/collect (cascade over covered devices)"
        actor: FieldTechnician
        preconditions:
          - "device.lifecycle_state == SERVICE_HOLD"
          - "device.removal_order_id == removal_order.id"
          - "no ServiceTicket with device_id == device.id has status IN {DISPATCHED, PARTS_HOLD, ONSITE}"
        side_effects:
          - "device.lifecycle_state := RETRIEVED"
          - "device.version += 1"
      - from: RETRIEVED
        to: REMOVED
        trigger: "POST /removal-orders/{id}/sanitize (cascade over covered devices)"
        actor: FieldTechnician
        preconditions:
          - "device.lifecycle_state == RETRIEVED"
          - "removal_order.sanitization_method != NONE"
        side_effects:
          - "device.lifecycle_state := REMOVED; device.secure_release_enrolled := false"
          - "device.version += 1"
          - "CASCADE HOP 2: contract.active_device_count -= 1 (recomputed from the device set)"
          - "CASCADE HOP 2: every ConsumableOrder with device_id == device.id and status == ORDERED is transitioned to CANCELLED with cancel_reason := DEVICE_REMOVED"
          - "CASCADE HOP 3 (caused by hop 2's order cancellations, not by the sanitize call): site.open_toner_units and contract.consumables_committed_cents are recomputed downward by each cancelled order's quantity / committed_cents"

  - entity: Device
    initial_state: SUPPLY_OK
    terminal_states: []
    transitions:
      - from: SUPPLY_OK
        to: SUPPLY_LOW
        trigger: "system: MeterRead acceptance whose toner_level_pct <= TONER_REORDER_PCT"
        actor: system
        preconditions:
          - "device.supply_state == SUPPLY_OK"
          - "the accepted read's toner_level_pct <= 15 (TONER_REORDER_PCT)"
        side_effects:
          - "device.supply_state := SUPPLY_LOW"
          - "device.version += 1"
        note: "Parallel dimension: supply_state evolves independently of lifecycle_state on the same Device row."
      - from: SUPPLY_LOW
        to: SUPPLY_ORDERED
        trigger: "system: auto-replenishment raised during the same read acceptance that produced SUPPLY_LOW"
        actor: system
        preconditions:
          - "device.supply_state == SUPPLY_LOW"
          - "no ConsumableOrder with device_id == device.id has status == ORDERED (MAX_OPEN_ORDERS_PER_DEVICE == 1)"
          - "site.open_toner_units + 1 <= site.toner_unit_cap"
        side_effects:
          - "a ConsumableOrder is created with trigger_source := AUTO_THRESHOLD, quantity := 1, part_type := (TONER_COLOR when device.color_capable and the accepted read's color_delta > 0, else TONER_BLACK), unit_price_cents := AUTO_TONER_UNIT_PRICE_CENTS"
          - "device.supply_state := SUPPLY_ORDERED"
          - "device.version += 1"
          - "CASCADE HOP 4 (caused by the order creation): site.open_toner_units += order.quantity and contract.consumables_committed_cents += order.committed_cents"
      - from: SUPPLY_LOW
        to: SUPPLY_BLOCKED
        trigger: "system: auto-replenishment suppressed by a hoarding control during read acceptance"
        actor: system
        preconditions:
          - "device.supply_state == SUPPLY_LOW"
          - "either a ConsumableOrder with device_id == device.id and status == ORDERED already exists, or site.open_toner_units + 1 > site.toner_unit_cap"
        side_effects:
          - "device.supply_state := SUPPLY_BLOCKED (no ConsumableOrder is created)"
          - "device.version += 1"
        note: "The read still ACCEPTs; only the replenishment is suppressed."
      - from: SUPPLY_BLOCKED
        to: SUPPLY_ORDERED
        trigger: "POST /consumable-orders"
        actor: FleetOpsController
        preconditions:
          - "device.supply_state IN {SUPPLY_LOW, SUPPLY_BLOCKED}"
          - "site.open_toner_units - superseded_units + body.quantity <= site.toner_unit_cap, where superseded_units is the quantity of the single ConsumableOrder for this device with status == ORDERED (0 when none exists)"
        side_effects:
          - "the manual order is created with trigger_source := MANUAL"
          - "any pre-existing ConsumableOrder for this device with status == ORDERED is transitioned to CANCELLED with cancel_reason := HOARDING_CONTROL (supersede)"
          - "device.supply_state := SUPPLY_ORDERED"
          - "device.version += 1"
          - "site.open_toner_units and contract.consumables_committed_cents are recomputed from the resulting ORDERED set"
      - from: SUPPLY_LOW
        to: SUPPLY_ORDERED
        trigger: "POST /consumable-orders"
        actor: FleetOpsController
        preconditions:
          - "device.supply_state IN {SUPPLY_LOW, SUPPLY_BLOCKED}"
          - "site.open_toner_units - superseded_units + body.quantity <= site.toner_unit_cap, where superseded_units is the quantity of the single ConsumableOrder for this device with status == ORDERED (0 when none exists)"
        side_effects:
          - "the manual order is created with trigger_source := MANUAL"
          - "device.supply_state := SUPPLY_ORDERED"
          - "device.version += 1"
          - "site.open_toner_units and contract.consumables_committed_cents are recomputed from the resulting ORDERED set"
      - from: SUPPLY_ORDERED
        to: SUPPLY_OK
        trigger: "POST /consumable-orders/{id}/deliver"
        actor: FieldTechnician
        preconditions:
          - "device.supply_state == SUPPLY_ORDERED"
          - "order.status == ORDERED and order.device_id == device.id"
        side_effects:
          - "device.supply_state := SUPPLY_OK"
          - "device.pages_since_last_cartridge is recomputed against the new delivered_at watermark (resets to 0)"
          - "device.version += 1"
          - "site.open_toner_units -= order.quantity and contract.consumables_committed_cents -= order.committed_cents"
        note: "Cycle: SUPPLY_OK -> SUPPLY_LOW -> SUPPLY_ORDERED -> SUPPLY_OK."
      - from: SUPPLY_ORDERED
        to: SUPPLY_LOW
        trigger: "POST /consumable-orders/{id}/cancel"
        actor: FleetOpsController
        preconditions:
          - "device.supply_state == SUPPLY_ORDERED"
          - "order.status == ORDERED and order.device_id == device.id"
          - "no other ConsumableOrder for this device has status == ORDERED after the cancellation"
          - "device.toner_level_pct <= 15 (TONER_REORDER_PCT)"
        side_effects:
          - "device.supply_state := SUPPLY_LOW"
          - "device.version += 1"
          - "site.open_toner_units -= order.quantity and contract.consumables_committed_cents -= order.committed_cents (compensating: both return to their pre-create values)"
      - from: SUPPLY_ORDERED
        to: SUPPLY_OK
        trigger: "POST /consumable-orders/{id}/cancel"
        actor: FleetOpsController
        preconditions:
          - "device.supply_state == SUPPLY_ORDERED"
          - "order.status == ORDERED and order.device_id == device.id"
          - "no other ConsumableOrder for this device has status == ORDERED after the cancellation"
          - "device.toner_level_pct > 15 (TONER_REORDER_PCT)"
        side_effects:
          - "device.supply_state := SUPPLY_OK"
          - "device.version += 1"
          - "site.open_toner_units -= order.quantity and contract.consumables_committed_cents -= order.committed_cents (compensating: both return to their pre-create values)"

  - entity: Site
    initial_state: UNCONFIGURED
    terminal_states: []
    transitions:
      - from: UNCONFIGURED
        to: CONFIGURED
        trigger: "POST /sites/{id}/secure-release-config with probe_result == PASS"
        actor: CustomerAdmin
        preconditions:
          - "site.secure_release_state IN {UNCONFIGURED, PENDING_VALIDATION, FAILED, CONFIGURED}"
          - "body.release_method IN {BADGE, PIN}"
          - "body.network_vlan_tag is provided (1..4094)"
        side_effects:
          - "site.release_method := body.release_method; site.network_vlan_tag := body.network_vlan_tag"
          - "site.secure_release_state := CONFIGURED"
          - "site.version += 1"
          - "every Device with site_id == site.id and lifecycle_state == NETWORKED gets secure_release_enrolled := true and version += 1"
      - from: UNCONFIGURED
        to: PENDING_VALIDATION
        trigger: "POST /sites/{id}/secure-release-config with probe_result == DEFERRED"
        actor: CustomerAdmin
        preconditions:
          - "site.secure_release_state IN {UNCONFIGURED, PENDING_VALIDATION, FAILED, CONFIGURED}"
          - "body.release_method IN {BADGE, PIN}"
        side_effects:
          - "site.release_method := body.release_method; site.network_vlan_tag := body.network_vlan_tag when provided"
          - "site.secure_release_state := PENDING_VALIDATION"
          - "site.version += 1"
      - from: PENDING_VALIDATION
        to: FAILED
        trigger: "POST /sites/{id}/secure-release-config with probe_result == FAIL"
        actor: CustomerAdmin
        preconditions:
          - "site.secure_release_state IN {UNCONFIGURED, PENDING_VALIDATION, FAILED, CONFIGURED}"
        side_effects:
          - "site.secure_release_state := FAILED"
          - "site.version += 1"
        note: "Re-running the config endpoint from any state is allowed; the resulting state is decided solely by probe_result (PASS -> CONFIGURED, DEFERRED -> PENDING_VALIDATION, FAIL -> FAILED)."
      - from: FAILED
        to: CONFIGURED
        trigger: "POST /sites/{id}/secure-release-config with probe_result == PASS"
        actor: CustomerAdmin
        preconditions:
          - "site.secure_release_state == FAILED"
          - "body.release_method IN {BADGE, PIN}"
          - "body.network_vlan_tag is provided (1..4094)"
        side_effects:
          - "site.secure_release_state := CONFIGURED"
          - "site.version += 1"
          - "every Device with site_id == site.id and lifecycle_state == NETWORKED gets secure_release_enrolled := true and version += 1"
        note: "Cycle: CONFIGURED -> FAILED -> CONFIGURED is permitted (re-validation after a network change)."

  - entity: MeterRead
    initial_state: PENDING_VALIDATION
    terminal_states: [VOID]
    transitions:
      - from: PENDING_VALIDATION
        to: ACCEPTED
        trigger: "system: validation at POST /_agent/meter-reads, POST /meter-reads or POST /meter-reads/{id}/resolve-exception"
        actor: system
        preconditions:
          - "read.mono_meter >= device.last_accepted_mono_meter AND read.color_meter >= device.last_accepted_color_meter"
          - "(read.mono_meter - device.last_accepted_mono_meter) + (read.color_meter - device.last_accepted_color_meter) <= SPIKE_MULTIPLIER * device.rated_monthly_duty_cycle"
        side_effects:
          - "read.status := ACCEPTED; read.mono_delta := read.mono_meter - device.last_accepted_mono_meter; read.color_delta := read.color_meter - device.last_accepted_color_meter; read.exception_reason := NONE"
          - "CASCADE HOP 2: device.last_accepted_mono_meter := read.mono_meter; device.last_accepted_color_meter := read.color_meter; device.last_read_at := read.coverage_end; device.toner_level_pct := read.toner_level_pct; device.lifetime_mono_pages += read.mono_delta; device.lifetime_color_pages += read.color_delta; device.pages_since_last_cartridge += read.mono_delta + read.color_delta; device.version += 1"
          - "CASCADE HOP 3 (caused by hop 2's toner_level_pct write, not by the read call): when device.toner_level_pct <= 15 and device.supply_state == SUPPLY_OK, the supply dimension transitions SUPPLY_OK -> SUPPLY_LOW and then either SUPPLY_LOW -> SUPPLY_ORDERED (creating an AUTO_THRESHOLD ConsumableOrder) or SUPPLY_LOW -> SUPPLY_BLOCKED (hoarding control)"
          - "CASCADE HOP 4 (caused by hop 3's order creation): site.open_toner_units += order.quantity; contract.consumables_committed_cents += order.committed_cents"
          - "billing_period.exception_open_count is recomputed"
      - from: PENDING_VALIDATION
        to: EXCEPTION
        trigger: "system: validation at POST /_agent/meter-reads, POST /meter-reads or POST /meter-reads/{id}/resolve-exception"
        actor: system
        preconditions:
          - "read.mono_meter < device.last_accepted_mono_meter OR read.color_meter < device.last_accepted_color_meter (ROLLBACK), OR the candidate combined delta > SPIKE_MULTIPLIER * device.rated_monthly_duty_cycle (IMPLAUSIBLE_SPIKE)"
        side_effects:
          - "read.status := EXCEPTION; read.exception_reason := ROLLBACK when a meter went backwards, else IMPLAUSIBLE_SPIKE (ROLLBACK is evaluated first)"
          - "read.mono_delta := 0; read.color_delta := 0 (no device counters move)"
          - "billing_period.exception_open_count is recomputed upward"
        note: "The create call still returns 201 with the read in EXCEPTION; the read carries no billable pages."
      - from: PENDING_VALIDATION
        to: EXCEPTION
        trigger: "POST /billing-periods/{id}/meter-sweep (SWEEP_ESTIMATE placeholder for an offline device)"
        actor: FleetOpsController
        preconditions:
          - "the device has no ACCEPTED MeterRead whose coverage_end falls inside [period_start, period_end)"
          - "device.lifecycle_state IN {ACTIVE, SERVICE_HOLD}"
        side_effects:
          - "a MeterRead is created with source := SWEEP_ESTIMATE, status := EXCEPTION, exception_reason := DEVICE_OFFLINE, mono_meter := device.last_accepted_mono_meter, color_meter := device.last_accepted_color_meter, toner_level_pct := device.toner_level_pct, coverage_start := period_start, coverage_end := the logical clock value at sweep time"
          - "device.offline_exception_count is recomputed upward"
          - "billing_period.exception_open_count is recomputed upward"
      - from: EXCEPTION
        to: PENDING_VALIDATION
        trigger: "POST /meter-reads/{id}/resolve-exception"
        actor: FleetOpsController
        preconditions:
          - "read.status == EXCEPTION"
          - "X-User-ID != read.submitted_by_user_id (segregation of duties)"
          - "billing_period.status != CLOSED"
        side_effects:
          - "read.mono_meter := body.corrected_mono_meter; read.color_meter := body.corrected_color_meter; read.toner_level_pct := body.corrected_toner_level_pct; read.resolution_note := body.resolution_note; read.resolved_by_user_id := X-User-ID"
          - "read.status := PENDING_VALIDATION, after which the same validation runs again and lands the read in ACCEPTED or back in EXCEPTION"
          - "read.version += 1"
        note: "Cycle: EXCEPTION -> PENDING_VALIDATION -> EXCEPTION may repeat any number of times until the corrected meters validate."
      - from: ACCEPTED
        to: VOID
        trigger: "POST /meter-reads/{id}/void"
        actor: FleetOpsController
        preconditions:
          - "read.status == ACCEPTED"
          - "read is the ACCEPTED read of its device with the greatest (coverage_end, created_at) - i.e. only the newest accepted read may be voided"
          - "billing_period.status != CLOSED"
        side_effects:
          - "COMPENSATION: device.last_accepted_mono_meter / last_accepted_color_meter / last_read_at revert to the values of the remaining ACCEPTED read of this device with the greatest (coverage_end, created_at), or to 0 / 0 / null when none remains"
          - "device.lifetime_mono_pages -= read.mono_delta; device.lifetime_color_pages -= read.color_delta; device.pages_since_last_cartridge -= (read.mono_delta + read.color_delta)"
          - "read.mono_delta := 0; read.color_delta := 0; read.status := VOID; read.voided_reason := body.voided_reason"
          - "device.toner_level_pct reverts to the toner_level_pct of that remaining ACCEPTED read, or to 100 when none remains"
          - "CASCADE HOP 2 (caused by the reverted toner_level_pct): when device.supply_state == SUPPLY_ORDERED and the device's single ORDERED ConsumableOrder has trigger_source == AUTO_THRESHOLD and device.toner_level_pct > 15, that order is CANCELLED with cancel_reason := READ_VOIDED and device.supply_state := SUPPLY_OK"
          - "CASCADE HOP 3 (caused by hop 2's cancellation): site.open_toner_units -= order.quantity; contract.consumables_committed_cents -= order.committed_cents"
          - "device.version += 1; billing_period.exception_open_count unchanged (a VOID read is neither open nor billable)"

  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SWEPT
        trigger: "POST /billing-periods/{id}/meter-sweep"
        actor: FleetOpsController
        preconditions:
          - "period.status IN {OPEN, SWEPT}"
          - "contract.status == ACTIVE"
        side_effects:
          - "for every Device of the contract with lifecycle_state IN {ACTIVE, SERVICE_HOLD} that has no ACCEPTED read covering the period, a SWEEP_ESTIMATE / EXCEPTION / DEVICE_OFFLINE MeterRead is created (see MeterRead machine)"
          - "period.status := SWEPT; period.sweep_run_count += 1; period.exception_open_count recomputed"
          - "period.version += 1"
        note: "Empty-set edge: when every eligible device already has an ACCEPTED read, the sweep creates zero reads, still advances status to SWEPT and still increments sweep_run_count."
      - from: SWEPT
        to: SWEPT
        trigger: "POST /billing-periods/{id}/meter-sweep (re-run)"
        actor: FleetOpsController
        preconditions:
          - "period.status IN {OPEN, SWEPT}"
          - "contract.status == ACTIVE"
        side_effects:
          - "only devices still lacking an ACCEPTED read receive a new SWEEP_ESTIMATE read; devices that already hold a SWEEP_ESTIMATE read in status EXCEPTION for this period are skipped (no duplicates)"
          - "period.sweep_run_count += 1; period.version += 1"
      - from: SWEPT
        to: PROVISIONAL
        trigger: "POST /billing-periods/{id}/provisional-statement"
        actor: BillingAnalyst
        preconditions:
          - "period.status IN {OPEN, SWEPT, PROVISIONAL}"
          - "contract.status == ACTIVE"
          - "body.expected_billing_period_version == period.version"
        side_effects:
          - "a BillingStatement with variant := PROVISIONAL, projection_basis := PROJECTED is created and its StatementLines written (see billing_statement_charge, PROVISIONAL variant)"
          - "any pre-existing PROVISIONAL BillingStatement for this period is superseded: it is deleted together with its StatementLines and replaced by the new one"
          - "period.status := PROVISIONAL; period.provisional_total_cents := statement.total_cents"
          - "period.version += 1"
      - from: OPEN
        to: PROVISIONAL
        trigger: "POST /billing-periods/{id}/provisional-statement"
        actor: BillingAnalyst
        preconditions:
          - "period.status IN {OPEN, SWEPT, PROVISIONAL}"
          - "contract.status == ACTIVE"
          - "body.expected_billing_period_version == period.version"
        side_effects:
          - "same as SWEPT -> PROVISIONAL"
      - from: PROVISIONAL
        to: PROVISIONAL
        trigger: "POST /billing-periods/{id}/provisional-statement (regeneration that supersedes the prior projection)"
        actor: BillingAnalyst
        preconditions:
          - "period.status == PROVISIONAL"
          - "body.expected_billing_period_version == period.version"
        side_effects:
          - "same as SWEPT -> PROVISIONAL; period.provisional_total_cents is overwritten with the new projection"
      - from: PROVISIONAL
        to: CLOSED
        trigger: "POST /billing-periods/{id}/close"
        actor: BillingAnalyst
        preconditions:
          - "period.status IN {SWEPT, PROVISIONAL}"
          - "period.exception_open_count == 0 (no MeterRead of this period is PENDING_VALIDATION or EXCEPTION)"
          - "contract.status IN {ACTIVE, TERMINATING}"
          - "the logical clock is >= period.period_end"
        side_effects:
          - "a BillingStatement with variant := FINAL, projection_basis := ACTUAL is created and its StatementLines written (see billing_statement_charge, FINAL variant)"
          - "period.status := CLOSED; period.final_total_cents := statement.total_cents"
          - "CASCADE HOP 2: contract.lifetime_billed_cents += statement.total_cents; contract.true_up_balance_cents += (period.final_total_cents - COALESCE(period.provisional_total_cents, period.final_total_cents))"
          - "period.version += 1; contract.version += 1"
        note: "Cross-entity guard: a period cannot close while any of its MeterReads is unresolved."
      - from: SWEPT
        to: CLOSED
        trigger: "POST /billing-periods/{id}/close"
        actor: BillingAnalyst
        preconditions:
          - "period.status IN {SWEPT, PROVISIONAL}"
          - "period.exception_open_count == 0"
          - "contract.status IN {ACTIVE, TERMINATING}"
          - "the logical clock is >= period.period_end"
        side_effects:
          - "same as PROVISIONAL -> CLOSED; true_up_balance_cents contribution is 0 because provisional_total_cents is null"

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /service-tickets/{id}/dispatch"
        actor: FleetOpsController
        preconditions:
          - "ticket.status == OPEN"
          - "technician.home_region == site.address_region"
          - "ticket.severity != CRITICAL OR technician.skill_level IN {L2, L3}"
          - "the dispatch window [window_start, window_end) does not collide with any window already occupied by this technician after inflating each occupied window by technician.travel_buffer_minutes on both sides"
          - "window_start >= the logical clock value"
        side_effects:
          - "ticket.status := DISPATCHED; ticket.assigned_technician_id := body.technician_id; ticket.window_start / window_end := body values"
          - "technician.open_dispatch_count recomputed upward"
          - "CASCADE: when device.lifecycle_state == ACTIVE it transitions ACTIVE -> SERVICE_HOLD"
          - "ticket.version += 1"
      - from: DISPATCHED
        to: ONSITE
        trigger: "POST /service-tickets/{id}/arrive-onsite"
        actor: FieldTechnician
        preconditions:
          - "ticket.status IN {DISPATCHED, PARTS_HOLD}"
          - "ticket.part_sku is null OR the SparePartStock row for (device.site_id, ticket.part_sku) exists with on_hand_qty >= 1"
          - "X-User-ID == ticket.assigned_technician_id"
        side_effects:
          - "ticket.status := ONSITE"
          - "when ticket.part_sku is not null: SparePartStock.on_hand_qty -= 1 and SparePartStock.version += 1"
          - "ticket.version += 1"
        note: "Branch A of the fork: parts were on hand, so no hold time accrues and parts_hold_hours stays 0."
      - from: DISPATCHED
        to: PARTS_HOLD
        trigger: "POST /service-tickets/{id}/parts-hold"
        actor: FieldTechnician
        preconditions:
          - "ticket.status == DISPATCHED"
          - "ticket.part_sku is not null"
          - "the SparePartStock row for (device.site_id, ticket.part_sku) is missing or has on_hand_qty == 0"
          - "X-User-ID == ticket.assigned_technician_id"
        side_effects:
          - "ticket.status := PARTS_HOLD; ticket.hold_started_at := the logical clock value"
          - "ticket.version += 1"
        note: "Branch B of the fork: hold time accrues into parts_hold_hours and later excuses part of the SLA breach."
      - from: PARTS_HOLD
        to: ONSITE
        trigger: "POST /service-tickets/{id}/arrive-onsite"
        actor: FieldTechnician
        preconditions:
          - "ticket.status IN {DISPATCHED, PARTS_HOLD}"
          - "the SparePartStock row for (device.site_id, ticket.part_sku) has on_hand_qty >= 1"
          - "X-User-ID == ticket.assigned_technician_id"
        side_effects:
          - "ticket.parts_hold_hours += ceil((logical clock - ticket.hold_started_at) in hours); ticket.hold_started_at := null"
          - "ticket.status := ONSITE; SparePartStock.on_hand_qty -= 1; SparePartStock.version += 1"
          - "ticket.version += 1"
      - from: ONSITE
        to: RESOLVED
        trigger: "POST /service-tickets/{id}/resolve"
        actor: FieldTechnician
        preconditions:
          - "ticket.status == ONSITE (join point: both branches converge here)"
          - "X-User-ID == ticket.assigned_technician_id"
        side_effects:
          - "ticket.responded_at := the logical clock value; ticket.hours_late := max(0, ceil(responded_at - respond_by in hours))"
          - "ticket.labor_hours := body.labor_hours; ticket.labor_cents := sla_labor_charge output"
          - "ticket.sla_credit_cents := sla_response_credit output (parts_hold_hours partially excuses lateness)"
          - "ticket.status := RESOLVED; technician.open_dispatch_count recomputed downward"
          - "CASCADE: when device.lifecycle_state == SERVICE_HOLD it transitions SERVICE_HOLD -> ACTIVE"
          - "ticket.version += 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: CustomerAdmin
        preconditions:
          - "ticket.status IN {OPEN, DISPATCHED, PARTS_HOLD}"
        side_effects:
          - "ticket.status := CANCELLED; ticket.assigned_technician_id retained for audit"
          - "COMPENSATION: when device.lifecycle_state == SERVICE_HOLD and no other ServiceTicket of the device is in {DISPATCHED, PARTS_HOLD, ONSITE}, the device transitions SERVICE_HOLD -> ACTIVE"
          - "technician.open_dispatch_count recomputed downward; no SparePartStock is consumed or returned (stock is only consumed at ONSITE)"
          - "ticket.version += 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: CustomerAdmin
        preconditions:
          - "ticket.status IN {OPEN, DISPATCHED, PARTS_HOLD}"
        side_effects:
          - "same as OPEN -> CANCELLED"
      - from: PARTS_HOLD
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: CustomerAdmin
        preconditions:
          - "ticket.status IN {OPEN, DISPATCHED, PARTS_HOLD}"
        side_effects:
          - "same as OPEN -> CANCELLED"

  - entity: ConsumableOrder
    initial_state: ORDERED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: ORDERED
        to: DELIVERED
        trigger: "POST /consumable-orders/{id}/deliver"
        actor: FieldTechnician
        preconditions:
          - "order.status == ORDERED"
          - "device.lifecycle_state != REMOVED"
        side_effects:
          - "order.status := DELIVERED; order.delivered_at := the logical clock value"
          - "device.supply_state := SUPPLY_OK; device.pages_since_last_cartridge := 0 (new cartridge watermark)"
          - "site.open_toner_units -= order.quantity; contract.consumables_committed_cents -= order.committed_cents"
          - "order.version += 1; device.version += 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /consumable-orders/{id}/cancel"
        actor: FleetOpsController
        preconditions:
          - "order.status == ORDERED"
        side_effects:
          - "order.status := CANCELLED; order.cancel_reason := body.cancel_reason"
          - "site.open_toner_units -= order.quantity; contract.consumables_committed_cents -= order.committed_cents"
          - "device.supply_state transitions SUPPLY_ORDERED -> SUPPLY_LOW or SUPPLY_ORDERED -> SUPPLY_OK per the Device supply machine"
          - "order.version += 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "system: cascade from POST /removal-orders/{id}/sanitize (cancel_reason DEVICE_REMOVED), POST /consumable-orders supersede (cancel_reason HOARDING_CONTROL), or POST /meter-reads/{id}/void (cancel_reason READ_VOIDED)"
        actor: system
        preconditions:
          - "order.status == ORDERED"
        side_effects:
          - "order.status := CANCELLED with the cascade's cancel_reason"
          - "site.open_toner_units and contract.consumables_committed_cents are recomputed downward"
          - "order.version += 1"

  - entity: QuarterlyReview
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /quarterly-reviews/{id}/approve"
        actor: AccountManager
        preconditions:
          - "review.status == DRAFT"
          - "X-User-ID != review.authored_by_user_id (segregation of duties)"
        side_effects:
          - "review.status := APPROVED; review.approved_by_user_id := X-User-ID"
          - "every Device of the contract whose right_sizing_action IN {UPGRADE, CONSOLIDATE} gets refresh_due := true and version += 1"
          - "review.version += 1"
        note: "Right-sizing recommendations are computed at review creation; approval is what publishes them onto the fleet as refresh_due."

  - entity: RemovalOrder
    initial_state: REQUESTED
    terminal_states: [SETTLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /removal-orders/{id}/schedule"
        actor: AccountManager
        preconditions:
          - "removal_order.status == REQUESTED"
          - "body.scheduled_for >= the logical clock value"
        side_effects:
          - "removal_order.status := SCHEDULED; removal_order.scheduled_for := body.scheduled_for"
          - "removal_order.version += 1"
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /removal-orders/{id}/collect"
        actor: FieldTechnician
        preconditions:
          - "removal_order.status == SCHEDULED"
          - "the logical clock is >= removal_order.scheduled_for"
          - "no ServiceTicket of a covered device has status IN {DISPATCHED, PARTS_HOLD, ONSITE}"
        side_effects:
          - "every covered Device transitions to RETRIEVED (see Device lifecycle machine)"
          - "removal_order.status := COLLECTED; removal_order.device_count recomputed"
          - "removal_order.version += 1"
      - from: COLLECTED
        to: SANITIZED
        trigger: "POST /removal-orders/{id}/sanitize"
        actor: FieldTechnician
        preconditions:
          - "removal_order.status == COLLECTED"
          - "body.sanitization_method IN {CRYPTO_ERASE, OVERWRITE_3PASS, PHYSICAL_DESTRUCTION}"
          - "body.sanitization_certificate_ref is non-empty"
        side_effects:
          - "removal_order.sanitization_method / sanitization_certificate_ref := body values; removal_order.status := SANITIZED"
          - "CASCADE HOP 2: every covered Device transitions RETRIEVED -> REMOVED (secure_release_enrolled := false)"
          - "CASCADE HOP 3 (caused by hop 2): contract.active_device_count recomputed downward and each removed device's ORDERED ConsumableOrders are CANCELLED with cancel_reason := DEVICE_REMOVED"
          - "CASCADE HOP 4 (caused by hop 3): site.open_toner_units and contract.consumables_committed_cents are recomputed downward"
          - "removal_order.version += 1"
      - from: SANITIZED
        to: SETTLED
        trigger: "POST /removal-orders/{id}/settle"
        actor: BillingAnalyst
        preconditions:
          - "removal_order.status == SANITIZED"
          - "every BillingPeriod with contract_id == removal_order.contract_id whose period_end <= the logical clock has status == CLOSED (a still-running period may remain OPEN and its ACCEPTED pages settle as unbilled)"
          - "contract.status == TERMINATING"
        side_effects:
          - "the settlement_amount calculation writes unbilled_pages_charge_cents, early_termination_fee_applied_cents, device_residual_credit_cents, gross_settlement_cents, sanitization_fee_cents and net_settlement_cents"
          - "removal_order.status := SETTLED; removal_order.settled_at := the logical clock value"
          - "CASCADE: contract.status := CLOSED"
          - "removal_order.version += 1; contract.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: provisional-statement-stale-period
    parent_entity: BillingPeriod
    write_endpoint: "POST /billing-periods/{id}/provisional-statement"
    occ_field: "expected_billing_period_version"
    description: |
      Generating a provisional statement against a BillingPeriod whose version has advanced since
      the client last observed it is rejected with 412. Regeneration is legitimate - a new
      PROVISIONAL statement supersedes the prior one - so the operation cannot be rejected by any
      state precondition; the stale-version check is what protects the analyst from publishing a
      projection derived from a period whose read set or sweep count has since moved.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412
  - rule_id: consumable-order-create-stale-device
    parent_entity: Device
    write_endpoint: "POST /consumable-orders"
    occ_field: "expected_device_version"
    description: |
      Creating a manual ConsumableOrder against a Device whose version has advanced since the client
      last observed it is rejected with 412. A manual order legitimately supersedes the device's
      existing ORDERED order (cancelled with cancel_reason HOARDING_CONTROL), so no state
      precondition rejects the write; the stale-version check is what prevents an operator from
      re-ordering toner on a stale view of the device's supply dimension.
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billing_statement_charge
    trigger: "POST /billing-periods/{id}/provisional-statement (PROVISIONAL variant) and POST /billing-periods/{id}/close (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # ---- Step 0. Input set -------------------------------------------------
      READS = MeterRead rows with billing_period_id == period.id AND status == ACCEPTED.
              (PENDING_VALIDATION, EXCEPTION and VOID reads contribute nothing.)
      DEVICES = distinct Device rows referenced by READS, ordered by device.created_at ASC.

      actual_mono(d)  = sum of read.mono_delta  over READS with device_id == d.id
      actual_color(d) = sum of read.color_delta over READS with device_id == d.id

      # ---- Step 1. Per-device billable pages (variant-dependent) -------------
      FINAL variant:
        pages_mono(d)  = actual_mono(d)
        pages_color(d) = actual_color(d)
      PROVISIONAL variant:
        period_days  = ceil((period_end - period_start) / 86400 seconds)
        elapsed_days = max(1, floor((min(clock_now, period_end) - period_start) / 86400 seconds))
        pages_mono(d)  = round_half_up(actual_mono(d)  * period_days / elapsed_days)
        pages_color(d) = round_half_up(actual_color(d) * period_days / elapsed_days)
        # projection is per device and per page_class, rounded to whole pages BEFORE aggregation

      # ---- Step 2. Contract-level volume and tier selection ------------------
      volume_mono  = sum over DEVICES of pages_mono(d)
      volume_color = sum over DEVICES of pages_color(d)

      select_tier(page_class, volume):
        CANDIDATES = CostTier rows with contract_id == contract.id AND page_class == page_class
        if volume == 0: return the CANDIDATE with tier_index == 1 (rate is unused, no line is emitted);
                        when NO CostTier row exists for that page_class at all, the statement's
                        <class>_tier_index := 0 and <class>_rate_micro_dollars_per_page := 0
        return the single CANDIDATE with from_page <= volume AND (to_page IS NULL OR volume <= to_page)
        # bounds are INCLUSIVE on both ends; tier rows never overlap; when no CANDIDATE matches,
        # the request fails with ERR_TIER_COVERAGE_GAP
      mono_tier  = select_tier(MONO,  volume_mono);   mono_rate  = mono_tier.rate_micro_dollars_per_page
      color_tier = select_tier(COLOR, volume_color);  color_rate = color_tier.rate_micro_dollars_per_page
      # NON-GRADUATED: the selected tier's rate applies to ALL pages of that class for every device;
      # pages are NOT split across tier bands.

      # ---- Step 3. Lines: round per line, THEN sum (rounding order is pinned) -
      for d in DEVICES (device.created_at ASC), for page_class in [MONO, COLOR] (MONO first):
        pages = pages_<class>(d)
        if pages == 0: emit NO line for (d, page_class)
        else: emit StatementLine{ device_id: d.id, page_class, pages,
                                  rate_micro_dollars_per_page: <class>_rate,
                                  amount_cents: round_half_up(pages * <class>_rate / 10000) }
      usage_subtotal_cents = sum of line.amount_cents over the emitted lines
      # "round each line to whole cents, then sum" is the pinned order; summing
      # micro-dollars first and rounding once at the end is WRONG.

      # ---- Step 4. Minimum-volume shortfall ---------------------------------
      shortfall_mono_pages  = max(0, contract.minimum_mono_pages_per_period  - volume_mono)
      shortfall_color_pages = max(0, contract.minimum_color_pages_per_period - volume_color)
      shortfall_pages = shortfall_mono_pages + shortfall_color_pages
      tier1_rate(page_class) = rate_micro_dollars_per_page of the CostTier with
                               contract_id == contract.id, page_class == page_class, tier_index == 1
                               (0 when no such row exists)
      shortfall_cents = round_half_up(shortfall_mono_pages  * tier1_rate(MONO)  / 10000)
                      + round_half_up(shortfall_color_pages * tier1_rate(COLOR) / 10000)
      # each page_class is rounded separately, then the two are summed

      # ---- Step 5. Service labor, SLA credits, waste ------------------------
      TICKETS = ServiceTicket rows with status == RESOLVED, device.contract_id == contract.id,
                and responded_at in [period_start, period_end)
      service_labor_cents = 0 when contract.included_service_scope == FULL
                            else sum of ticket.labor_cents over TICKETS
      sla_credit_cents    = sum of ticket.sla_credit_cents over TICKETS
      waste_penalty_cents = 0 for the PROVISIONAL variant
                            else WASTE_PENALTY_CENTS_PER_EVENT * count of ConsumableOrder rows with
                            device.contract_id == contract.id, waste_flagged == true,
                            status != CANCELLED, created_at in [period_start, period_end)

      # ---- Step 6. Total ----------------------------------------------------
      total_cents = usage_subtotal_cents + shortfall_cents + service_labor_cents
                    + waste_penalty_cents - sla_credit_cents
      # NOT floored at zero: a credit-heavy period may produce a negative total_cents.
    input_set: |
      Only MeterReads with status == ACCEPTED and billing_period_id == this period. Devices enter the
      line set only when their billable pages for that page_class are > 0. Tickets enter only when
      status == RESOLVED and responded_at falls inside the half-open period window. Consumable orders
      enter the waste count only when waste_flagged == true and status != CANCELLED.
    constants:
      MICRO_DOLLARS_PER_CENT: 10000
      WASTE_PENALTY_CENTS_PER_EVENT: 4500
    precision: "amount_cents / shortfall_cents / total_cents are whole cents, round_half_up applied per line and per page_class as pinned above; projected pages are whole pages, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "POST /billing-periods/{id}/provisional-statement — forward-looking projection mid-period"
        difference: "Per-device pages are scaled to the full period by period_days/elapsed_days and rounded per device per page_class BEFORE aggregation; tier selection and shortfall therefore run on projected volume; waste_penalty_cents is forced to 0; projection_basis = PROJECTED."
      - name: FINAL
        when: "POST /billing-periods/{id}/close — chronological actuals at period end"
        difference: "Per-device pages are the raw sums of ACCEPTED read deltas; tier selection and shortfall run on actual volume; waste penalties are charged; projection_basis = ACTUAL. For identical read data the two variants produce different total_cents whenever elapsed_days < period_days."

  - name: sla_response_credit
    trigger: "POST /service-tickets/{id}/resolve (writes ServiceTicket.sla_credit_cents)"
    algorithm: threshold
    formula: |
      hours_late          = max(0, ceil((responded_at - respond_by) in hours))          # ServiceTicket.hours_late
      excused_hours       = min(hours_late, max(0, parts_hold_hours - PARTS_GRACE_HOURS))
      billable_late_hours = hours_late - excused_hours
      if billable_late_hours == 0:
          sla_credit_cents = 0
      else:
          step            = ceil(billable_late_hours / 4)
          severity_factor = 0.05 * step * (2 if severity == CRITICAL else 1)
          factor          = min(0.50, severity_factor)
          sla_credit_cents = min(SLA_CREDIT_CAP_CENTS,
                                 round_half_up(contract.monthly_service_fee_cents * factor))
      # Four interacting inputs (hours_late, parts_hold_hours, severity, monthly_service_fee_cents),
      # two nested min/max layers and a conditional branch on ticket severity.
    input_set: "A single ServiceTicket at the moment it leaves ONSITE; parts_hold_hours is whatever accumulated across its PARTS_HOLD periods."
    constants:
      PARTS_GRACE_HOURS: 8
      SLA_CREDIT_CAP_CENTS: 25000
      CREDIT_STEP_HOURS: 4
      CREDIT_PCT_PER_STEP: 0.05
      MAX_FACTOR: 0.50
    precision: "whole cents, round_half_up applied once to monthly_service_fee_cents * factor"

  - name: service_labor_charge
    trigger: "POST /service-tickets/{id}/resolve (writes ServiceTicket.labor_cents)"
    algorithm: aggregation
    formula: |
      labor_cents = 0 when contract.included_service_scope == FULL
                    else ceil(ticket.labor_hours) * contract.labor_rate_cents_per_hour
      # labor_hours is rounded UP to whole hours before multiplication (never after)
    input_set: "The resolving ticket only; the contract's included_service_scope decides whether labor is inside the cost-per-page envelope."
    constants: {}
    precision: "whole cents; labor_hours ceil-ed to whole hours first"

  - name: settlement_amount
    trigger: "POST /removal-orders/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED: gross first (WITHOUT the sanitization fee), then the discount
      # keyed on gross, then the fee, then net. The fee is part of net but its discount tier is
      # keyed on gross - resolving the apparent circularity.
      UNBILLED = MeterRead rows with status == ACCEPTED, device.contract_id == contract.id,
                 and billing_period.status IN {OPEN, SWEPT, PROVISIONAL}
      unbilled_mono_pages  = sum of mono_delta  over UNBILLED
      unbilled_color_pages = sum of color_delta over UNBILLED
      unbilled_pages_charge_cents =
            round_half_up(unbilled_mono_pages  * tier1_rate(MONO)  / 10000)
          + round_half_up(unbilled_color_pages * tier1_rate(COLOR) / 10000)

      early_termination_fee_applied_cents =
            contract.early_termination_fee_cents
              when clock_now < contract.created_at + contract.term_months calendar months
            else 0

      device_residual_credit_cents =
            0 when removal_order.sanitization_method == PHYSICAL_DESTRUCTION
            else RESIDUAL_CREDIT_PER_DEVICE_CENTS * removal_order.device_count

      gross_settlement_cents = unbilled_pages_charge_cents
                             + early_termination_fee_applied_cents
                             - device_residual_credit_cents

      sanitization_base_cents = SANITIZATION_FEE_PER_DEVICE_CENTS * removal_order.device_count
      volume_discount_pct = SANITIZATION_DISCOUNT_PCT
                              when gross_settlement_cents >= SANITIZATION_DISCOUNT_THRESHOLD_CENTS
                            else 0.00
      sanitization_fee_cents = round_half_up(sanitization_base_cents * (1 - volume_discount_pct))

      net_settlement_cents = gross_settlement_cents + sanitization_fee_cents
    input_set: "All ACCEPTED reads of the contract's devices that sit in a non-CLOSED period; the removal order's device_count (devices whose removal_order_id == this order); the contract's early-termination fee and tier_index 1 rates."
    constants:
      RESIDUAL_CREDIT_PER_DEVICE_CENTS: 12000
      SANITIZATION_FEE_PER_DEVICE_CENTS: 7500
      SANITIZATION_DISCOUNT_THRESHOLD_CENTS: 500000
      SANITIZATION_DISCOUNT_PCT: 0.10
    precision: "whole cents; the sanitization fee is rounded once after the discount multiplication; the unbilled charge is rounded once per page_class then summed"

  - name: tco_savings
    trigger: "POST /quarterly-reviews (writes QuarterlyReview.baseline_savings_cents and realized_savings_cents)"
    algorithm: forward_looking
    formula: |
      FLEET = Device rows with contract_id == contract.id and
              lifecycle_state IN {PLACED, NETWORKED, ACTIVE, SERVICE_HOLD}, ordered by created_at ASC

      # --- ASSESSED variant (fleet-assessment baseline vs contracted list rates) ---
      for d in FLEET:
        baseline_cost(d) = round_half_up((d.assessed_monthly_mono_pages + d.assessed_monthly_color_pages)
                                         * d.baseline_cost_micro_dollars_per_page / 10000)
                           + d.baseline_overhead_cents_per_month
        mps_cost(d)      = round_half_up((d.assessed_monthly_mono_pages  * tier1_rate(MONO)
                                        + d.assessed_monthly_color_pages * tier1_rate(COLOR)) / 10000)
      baseline_savings_cents = sum over FLEET of (baseline_cost(d) - mps_cost(d))

      # --- REALIZED variant (actual last closed period vs actually billed cents) ---
      P = the BillingPeriod with contract_id == contract.id and status == CLOSED having the greatest
          period_end; tie-break: created_at ASC. When none exists, realized_savings_cents = 0.
      SP = the BillingStatement of P with variant == FINAL
      for d in FLEET:
        realized_pages(d) = sum of StatementLine.pages over SP's lines with device_id == d.id
        realized_baseline(d) = round_half_up(realized_pages(d) * d.baseline_cost_micro_dollars_per_page / 10000)
                               + d.baseline_overhead_cents_per_month
        realized_billed(d)   = sum of StatementLine.amount_cents over SP's lines with device_id == d.id
      realized_savings_cents = sum over FLEET of (realized_baseline(d) - realized_billed(d))
    input_set: "Devices still in the fleet (PLACED/NETWORKED/ACTIVE/SERVICE_HOLD); RETRIEVED and REMOVED devices are excluded from both variants. The REALIZED variant reads only the FINAL statement of the most recently closed period."
    constants:
      MICRO_DOLLARS_PER_CENT: 10000
    precision: "whole cents; each device's cost is rounded before the fleet summation (round-then-sum, per device)"
    variants:
      - name: ASSESSED
        when: "always computed at review creation, into baseline_savings_cents"
        difference: "Uses the fleet-assessment projected volumes (assessed_monthly_* pages) on both sides of the subtraction, so it reports the savings the assessment promised."
      - name: REALIZED
        when: "always computed at review creation, into realized_savings_cents"
        difference: "Uses the actual pages and actual billed cents of the most recently CLOSED period, so a fleet that under-runs or over-runs its assessment reports a different number from the ASSESSED variant on identical device rows."

  - name: right_sizing_classification
    trigger: "POST /quarterly-reviews (writes Device.right_sizing_action and the review's four counters)"
    algorithm: threshold
    formula: |
      P = the CLOSED BillingPeriod of the contract with the greatest period_end (tie-break created_at ASC)
      When P does not exist: every device in FLEET gets right_sizing_action := RETAIN.
      Otherwise, for each d in FLEET (same FLEET definition as tco_savings):
        realized_pages(d) = sum of StatementLine.pages over P's FINAL statement lines with device_id == d.id
        utilization(d)    = realized_pages(d) / d.rated_monthly_duty_cycle     # exact rational, never rounded
        if utilization(d) <= UTIL_CONSOLIDATE_MAX: CONSOLIDATE
        elif utilization(d) <= UTIL_DOWNGRADE_MAX: DOWNGRADE
        elif utilization(d) >= UTIL_UPGRADE_MIN:   UPGRADE
        else:                                      RETAIN
      Devices with lifecycle_state IN {ASSESSED, RETRIEVED, REMOVED} keep right_sizing_action == NONE.
      review.retain_count / downgrade_count / upgrade_count / consolidate_count = counts over FLEET
      review.refresh_due_device_count = upgrade_count + consolidate_count
    input_set: "FLEET devices only; page counts come exclusively from the FINAL statement lines of the most recently CLOSED period."
    constants:
      UTIL_CONSOLIDATE_MAX: 0.15
      UTIL_DOWNGRADE_MAX: 0.40
      UTIL_UPGRADE_MIN: 0.90
    precision: "utilization is compared as an exact rational (pages * 100 vs duty_cycle * threshold_pct) so a device at exactly 15% or exactly 90% lands on the inclusive side"

  - name: volume_trend
    trigger: "POST /quarterly-reviews (writes QuarterlyReview.volume_trend_pct)"
    algorithm: chronological
    formula: |
      CLOSED_PERIODS = BillingPeriod rows with contract_id == contract.id and status == CLOSED,
                       ordered by period_end DESC, created_at ASC
      P1 = CLOSED_PERIODS[0]; P0 = CLOSED_PERIODS[1]
      v(P) = P's FINAL statement (mono_pages_billed + color_pages_billed)
      volume_trend_pct = 0 when P0 does not exist or v(P0) == 0
                         else round_half_up(((v(P1) - v(P0)) / v(P0)) * 100, 2)
    input_set: "The two most recently closed periods of the contract; OPEN/SWEPT/PROVISIONAL periods are ignored."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: consumable_waste_flag
    trigger: "POST /consumable-orders and the AUTO_THRESHOLD order creation inside MeterRead acceptance (writes ConsumableOrder.waste_flagged and pages_since_last_cartridge_at_order)"
    algorithm: threshold
    formula: |
      pages_since_last_cartridge_at_order = device.pages_since_last_cartridge at creation time
      had_prior_delivery = exists ConsumableOrder with device_id == device.id and status == DELIVERED
      waste_flagged = had_prior_delivery
                      AND pages_since_last_cartridge_at_order < MIN_CARTRIDGE_PAGES
      # A device's very first cartridge order is never a waste event, however few pages it has printed.
    input_set: "The ordering device's pages_since_last_cartridge watermark and its DELIVERED order history."
    constants:
      MIN_CARTRIDGE_PAGES: 3000
      TONER_REORDER_PCT: 15
      AUTO_TONER_UNIT_PRICE_CENTS: 8900
      MAX_OPEN_ORDERS_PER_DEVICE: 1
    precision: "integer page comparison; strict `<` at the MIN_CARTRIDGE_PAGES boundary (exactly 3000 pages is NOT waste)"

  - name: meter_read_validation
    trigger: "POST /_agent/meter-reads, POST /meter-reads, POST /meter-reads/{id}/resolve-exception"
    algorithm: projection
    formula: |
      candidate_mono_delta  = read.mono_meter  - device.last_accepted_mono_meter
      candidate_color_delta = read.color_meter - device.last_accepted_color_meter
      if candidate_mono_delta < 0 OR candidate_color_delta < 0:
          status := EXCEPTION; exception_reason := ROLLBACK
      elif candidate_mono_delta + candidate_color_delta > SPIKE_MULTIPLIER * device.rated_monthly_duty_cycle:
          status := EXCEPTION; exception_reason := IMPLAUSIBLE_SPIKE
      else:
          status := ACCEPTED; mono_delta := candidate_mono_delta; color_delta := candidate_color_delta
      # ROLLBACK is checked before IMPLAUSIBLE_SPIKE; a read that is both backwards on one meter and
      # spiky on the other reports ROLLBACK.
    input_set: "The submitted read and the device's last ACCEPTED meter watermarks; EXCEPTION and VOID reads never move the watermarks."
    constants:
      SPIKE_MULTIPLIER: 3
    precision: "integer page arithmetic; the spike test uses strict `>` so a combined delta exactly equal to 3 * rated_monthly_duty_cycle is ACCEPTED"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path-templated resource id resolves to an existing row, validated left-to-right"
    error_id: "ERR_CONTRACT_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_METER_READ_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_REMOVAL_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: business_constraint
    check: "request body contains every required field, every field has the declared type, every enum field carries a declared member, and every numeric field respects its declared range (including limit 1..100 and offset >= 0 on list endpoints)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row (contract_id, site_id, device_id, billing_period_id, technician_id)"
    error_id: "ERR_CONTRACT_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND"
    http_status: 404
    applies_to: "POST /sites, POST /devices, POST /_agent/meter-reads, POST /meter-reads, POST /billing-periods, POST /consumable-orders, POST /service-tickets, POST /service-tickets/{id}/dispatch, POST /quarterly-reviews, POST /removal-orders, POST /devices/{id}/refresh-replacement (successor_device_id -> ERR_DEVICE_NOT_FOUND)"
  - priority: 6
    category: state
    check: "the OCC version supplied in the body equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_PERIOD_VERSION | ERR_STALE_DEVICE_VERSION"
    http_status: 412
    applies_to: "POST /billing-periods/{id}/provisional-statement, POST /consumable-orders"
  - priority: 7
    category: state
    check: "the target resource is in a state from which the requested transition exists in §1.2"
    error_id: "ERR_CONTRACT_INVALID_STATE | ERR_DEVICE_INVALID_STATE | ERR_READ_INVALID_STATE | ERR_PERIOD_INVALID_STATE | ERR_ORDER_INVALID_STATE | ERR_TICKET_INVALID_STATE | ERR_REVIEW_ALREADY_APPROVED | ERR_REMOVAL_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 8
    category: state
    check: "the governing ServiceContract is ACTIVE for operations that consume the contract (device placement/activation, meter-read intake, sweeps, statement generation, period close, consumable orders, ticket creation)"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /devices/{id}/place, POST /devices/{id}/activate, POST /_agent/meter-reads, POST /meter-reads, POST /billing-periods/{id}/meter-sweep, POST /billing-periods/{id}/provisional-statement, POST /consumable-orders, POST /service-tickets (POST /billing-periods/{id}/close accepts contract.status IN {ACTIVE, TERMINATING} so a wind-down contract can still be billed out)"
  - priority: 9
    category: state
    check: "the MeterRead's BillingPeriod is not CLOSED when a read is created, resolved or voided"
    error_id: ERR_PERIOD_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /_agent/meter-reads, POST /meter-reads, POST /meter-reads/{id}/resolve-exception, POST /meter-reads/{id}/void"
  - priority: 10
    category: state
    check: "only the newest ACCEPTED read of a device (greatest coverage_end, then greatest created_at) may be voided"
    error_id: ERR_READ_NOT_NEWEST
    http_status: 409
    applies_to: "POST /meter-reads/{id}/void"
  - priority: 11
    category: business_safety
    check: "the acting X-User-ID differs from the user recorded on the record for the paired duty: resolve-exception vs MeterRead.submitted_by_user_id, review approval vs QuarterlyReview.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /meter-reads/{id}/resolve-exception, POST /quarterly-reviews/{id}/approve"
  - priority: 12
    category: business_safety
    check: "the acting FieldTechnician's X-User-ID equals ServiceTicket.assigned_technician_id; and the acting CustomerAdmin's X-User-ID equals the Site.id that owns the resource (site path id for secure-release-config, device.site_id for ticket creation and ticket cancellation)"
    error_id: "ERR_TECHNICIAN_NOT_ASSIGNED | ERR_SITE_OWNERSHIP_REQUIRED"
    http_status: 403
    applies_to: "POST /service-tickets/{id}/arrive-onsite, POST /service-tickets/{id}/parts-hold, POST /service-tickets/{id}/resolve, POST /sites/{id}/secure-release-config, POST /service-tickets, POST /service-tickets/{id}/cancel"
  - priority: 13
    category: business_safety
    check: "a CRITICAL ticket may only be dispatched to a Technician with skill_level IN {L2, L3}"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /service-tickets/{id}/dispatch"
  - priority: 14
    category: business_safety
    check: "the Site's secure print release must be CONFIGURED before a NETWORKED device may be activated"
    error_id: ERR_SECURE_RELEASE_NOT_CONFIGURED
    http_status: 409
    applies_to: "POST /devices/{id}/activate"
  - priority: 15
    category: business_safety
    check: "sanitization requires a method other than NONE and a non-empty certificate reference"
    error_id: ERR_SANITIZATION_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /removal-orders/{id}/sanitize"
  - priority: 16
    category: business_referential
    check: "the dispatched Technician's home_region equals the device's Site.address_region"
    error_id: ERR_TECHNICIAN_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /service-tickets/{id}/dispatch"
  - priority: 17
    category: business_referential
    check: "the MeterRead's device belongs to the BillingPeriod's contract (device.contract_id == period.contract_id) and coverage_end falls inside the half-open window [period_start, period_end)"
    error_id: ERR_READ_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /_agent/meter-reads, POST /meter-reads"
  - priority: 18
    category: business_referential
    check: "the device is eligible for meter-read intake: lifecycle_state IN {ACTIVE, SERVICE_HOLD}"
    error_id: ERR_DEVICE_NOT_METERABLE
    http_status: 409
    applies_to: "POST /_agent/meter-reads, POST /meter-reads"
  - priority: 19
    category: business_referential
    check: "a ticket requiring a part may only reach ONSITE when the SparePartStock row for (device.site_id, ticket.part_sku) exists with on_hand_qty >= 1; a ticket may only enter PARTS_HOLD when that row is missing or has on_hand_qty == 0"
    error_id: "ERR_PART_NOT_AVAILABLE | ERR_PART_IS_AVAILABLE"
    http_status: 409
    applies_to: "POST /service-tickets/{id}/arrive-onsite, POST /service-tickets/{id}/parts-hold"
  - priority: 20
    category: business_temporal
    check: "coverage_start < coverage_end and the read's half-open interval [coverage_start, coverage_end) does not intersect the interval of any MeterRead of the same device whose status IN {PENDING_VALIDATION, ACCEPTED}; touching endpoints (previous coverage_end == new coverage_start) are allowed"
    error_id: ERR_READ_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /_agent/meter-reads, POST /meter-reads"
  - priority: 21
    category: business_temporal
    check: "window_start < window_end, window_start >= the logical clock, and the new window does not intersect any window occupied by the same Technician (tickets with status IN {DISPATCHED, PARTS_HOLD, ONSITE}) after inflating each occupied window by technician.travel_buffer_minutes on BOTH sides"
    error_id: ERR_DISPATCH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /service-tickets/{id}/dispatch"
  - priority: 22
    category: business_temporal
    check: "a period may only close once the logical clock has reached period_end; a removal order may only be collected once the clock has reached scheduled_for; scheduled_for must not be in the past at scheduling time; a BillingPeriod's window must not intersect another period of the same contract (half-open, touching endpoints allowed)"
    error_id: "ERR_PERIOD_NOT_ENDED | ERR_COLLECTION_NOT_DUE | ERR_SCHEDULE_IN_PAST | ERR_PERIOD_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /billing-periods/{id}/close, POST /removal-orders/{id}/collect, POST /removal-orders/{id}/schedule, POST /billing-periods"
  - priority: 23
    category: business_constraint
    check: "a period may not close while exception_open_count > 0 (any MeterRead of the period is PENDING_VALIDATION or EXCEPTION)"
    error_id: ERR_PERIOD_HAS_OPEN_EXCEPTIONS
    http_status: 409
    applies_to: "POST /billing-periods/{id}/close"
  - priority: 24
    category: business_constraint
    check: "uniqueness: (contract_id, asset_tag) on Device, (contract_id, page_class, tier_index) plus non-overlapping [from_page, to_page] bands on CostTier, (contract_id, quarter_label) on QuarterlyReview"
    error_id: "ERR_ASSET_TAG_DUPLICATE | ERR_TIER_BAND_CONFLICT | ERR_QUARTER_DUPLICATE"
    http_status: 409
    applies_to: "POST /devices, POST /service-contracts/{id}/cost-tiers, POST /quarterly-reviews"
  - priority: 25
    category: business_constraint
    check: "hoarding control: site.open_toner_units - superseded_units + body.quantity <= site.toner_unit_cap"
    error_id: ERR_TONER_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /consumable-orders"
  - priority: 26
    category: business_constraint
    check: "contract activation requires a tier_index 1 / from_page 1 MONO CostTier row, plus the same for COLOR when any device of the contract is color_capable"
    error_id: ERR_RATE_CARD_INCOMPLETE
    http_status: 409
    applies_to: "POST /service-contracts/{id}/activate"
  - priority: 27
    category: business_fiscal
    check: "statement generation requires a CostTier row covering the contract-level volume for every page_class with volume > 0"
    error_id: ERR_TIER_COVERAGE_GAP
    http_status: 409
    applies_to: "POST /billing-periods/{id}/provisional-statement, POST /billing-periods/{id}/close"
  - priority: 28
    category: business_fiscal
    check: "reported labor_hours must not exceed MAX_LABOR_HOURS_PER_TICKET (8)"
    error_id: ERR_LABOR_HOURS_EXCEED_LIMIT
    http_status: 422
    applies_to: "POST /service-tickets/{id}/resolve"
  - priority: 29
    category: business_fiscal
    check: "settlement requires every BillingPeriod of the contract whose period_end <= the logical clock to be CLOSED"
    error_id: ERR_SETTLEMENT_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /removal-orders/{id}/settle"
  - priority: 30
    category: business_referential
    check: "refresh linkage requires the path device to carry refresh_due == true and replaced_by_device_id == null, and requires the successor device to belong to the same contract with lifecycle_state IN {ASSESSED, PLACED, NETWORKED, ACTIVE} and id != the path device id"
    error_id: ERR_DEVICE_NOT_REFRESH_DUE
    http_status: 409
    applies_to: "POST /devices/{id}/refresh-replacement"
  - priority: 31
    category: business_constraint
    check: "spare-part stock adjustment: qty_delta != 0 and on_hand_qty + qty_delta >= 0 for the (site_id, part_sku) row (absent row counts as on_hand_qty 0)"
    error_id: ERR_PART_STOCK_UNDERFLOW
    http_status: 409
    applies_to: "POST /sites/{id}/spare-part-stocks"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- ServiceContract ---
  - method: POST
    path: "/service-contracts"
    description: "Create a managed-print contract in DRAFT."
    roles: [AccountManager]
    code: 201
    input: [customer_name, term_months, included_service_scope, minimum_mono_pages_per_period, minimum_color_pages_per_period, monthly_service_fee_cents, "response_sla_hours_critical?", "response_sla_hours_standard?", "labor_rate_cents_per_hour?", "early_termination_fee_cents?"]
    output: ServiceContract
    side_effects: ["status := DRAFT", "all computed counters initialised to 0"]
  - method: GET
    path: "/service-contracts/{id}"
    description: "Read one contract with its computed ledger counters."
    roles: [AccountManager, BillingAnalyst, FleetOpsController, FieldTechnician, CustomerAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: POST
    path: "/service-contracts/{id}/cost-tiers"
    description: "Append a cost-per-page tier row to the contract rate card."
    roles: [AccountManager]
    code: 201
    input: [page_class, tier_index, from_page, "to_page?", rate_micro_dollars_per_page]
    output: CostTier
    side_effects: ["rejects overlapping [from_page, to_page] bands within (contract_id, page_class) with ERR_TIER_BAND_CONFLICT"]
  - method: GET
    path: "/service-contracts/{id}/cost-tiers"
    description: "List the contract's rate card rows (reverse lookup for CostTier.contract_id)."
    roles: [AccountManager, BillingAnalyst, FleetOpsController]
    code: 200
    input: ["page_class?", "limit?", "offset?"]
    output: CostTier[]
    side_effects: []
  - method: POST
    path: "/service-contracts/{id}/activate"
    description: "Activate a DRAFT contract once its rate card is complete."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status := ACTIVE", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/service-contracts/{id}/suspend"
    description: "Suspend an ACTIVE contract; blocks meter-read intake, consumable orders and billing runs."
    roles: [AccountManager]
    code: 200
    input: [reason]
    output: ServiceContract
    side_effects: ["status := SUSPENDED", "suspension_count += 1", "suspension_reason := reason", "increments ServiceContract.version by 1"]
  - method: POST
    path: "/service-contracts/{id}/resume"
    description: "Return a SUSPENDED contract to ACTIVE (cycle; suspension_reason retained)."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status := ACTIVE", "increments ServiceContract.version by 1"]

  # --- Site ---
  - method: POST
    path: "/sites"
    description: "Register a customer location under a contract."
    roles: [AccountManager]
    code: 201
    input: [contract_id, name, address_region, "toner_unit_cap?", "network_vlan_tag?"]
    output: Site
    side_effects: ["secure_release_state := UNCONFIGURED", "release_method := NONE", "open_toner_units := 0"]
  - method: GET
    path: "/sites/{id}"
    description: "Read one site including its computed open_toner_units."
    roles: [AccountManager, BillingAnalyst, FleetOpsController, FieldTechnician, CustomerAdmin]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/sites"
    description: "List sites, filterable by contract (reverse lookup for Site.contract_id)."
    roles: [AccountManager, BillingAnalyst, FleetOpsController]
    code: 200
    input: ["contract_id?", "secure_release_state?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: POST
    path: "/sites/{id}/secure-release-config"
    description: "Configure secure print release for the site; probe_result decides the resulting state (PASS -> CONFIGURED, DEFERRED -> PENDING_VALIDATION, FAIL -> FAILED)."
    roles: [CustomerAdmin]
    code: 200
    input: [release_method, probe_result, "network_vlan_tag?"]
    output: Site
    side_effects: ["secure_release_state per probe_result", "NETWORKED devices at the site get secure_release_enrolled := true on PASS", "increments Site.version by 1"]
  - method: POST
    path: "/sites/{id}/spare-part-stocks"
    description: "Create or adjust the site's parts-locker quantity for one SKU (qty_delta may be negative; the result must stay >= 0)."
    roles: [FleetOpsController]
    code: 200
    input: [part_sku, qty_delta]
    output: SparePartStock
    side_effects: ["creates the (site_id, part_sku) row when missing", "on_hand_qty += qty_delta", "increments SparePartStock.version by 1"]
  - method: GET
    path: "/sites/{id}/spare-part-stocks"
    description: "List the site's parts-locker rows (reverse lookup for SparePartStock.site_id)."
    roles: [FleetOpsController, FieldTechnician, AccountManager]
    code: 200
    input: ["part_sku?", "limit?", "offset?"]
    output: SparePartStock[]
    side_effects: []

  # --- Device / fleet ---
  - method: POST
    path: "/devices"
    description: "Intake a device from the fleet assessment, carrying its TCO baseline figures; starts in ASSESSED / SUPPLY_OK."
    roles: [FleetOpsController]
    code: 201
    input: [contract_id, site_id, asset_tag, model_code, rated_monthly_duty_cycle, assessed_monthly_mono_pages, assessed_monthly_color_pages, baseline_cost_micro_dollars_per_page, baseline_overhead_cents_per_month, "color_capable?"]
    output: Device
    side_effects: ["lifecycle_state := ASSESSED", "supply_state := SUPPLY_OK", "toner_level_pct := 100"]
  - method: GET
    path: "/devices/{id}"
    description: "Read one device with both state dimensions and all computed meters."
    roles: [AccountManager, BillingAnalyst, FleetOpsController, FieldTechnician, CustomerAdmin]
    code: 200
    input: []
    output: Device
    side_effects: []
  - method: GET
    path: "/devices"
    description: "List devices with filters (reverse lookup for Device.contract_id, Device.site_id, Device.replaced_by_device_id and Device.removal_order_id)."
    roles: [AccountManager, BillingAnalyst, FleetOpsController, FieldTechnician]
    code: 200
    input: ["contract_id?", "site_id?", "replaced_by_device_id?", "removal_order_id?", "lifecycle_state?", "supply_state?", "limit?", "offset?"]
    output: Device[]
    side_effects: []
  - method: POST
    path: "/devices/{id}/place"
    description: "Record physical placement of an ASSESSED device at its site."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: Device
    side_effects: ["lifecycle_state := PLACED", "contract.active_device_count += 1", "increments Device.version by 1"]
  - method: POST
    path: "/devices/{id}/network-integration"
    description: "Join the placed device to the site VLAN and enrol it in secure release when the site has a release method."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: Device
    side_effects: ["lifecycle_state := NETWORKED", "secure_release_enrolled := site.release_method IN {BADGE, PIN}", "increments Device.version by 1"]
  - method: POST
    path: "/devices/{id}/activate"
    description: "Bring a NETWORKED device into billable service; guarded by the site's secure print release state."
    roles: [FleetOpsController]
    code: 200
    input: []
    output: Device
    side_effects: ["lifecycle_state := ACTIVE", "increments Device.version by 1"]
  - method: POST
    path: "/devices/{id}/refresh-replacement"
    description: "Link a refresh-due device to its successor asset (sets replaced_by_device_id); only allowed once an APPROVED QuarterlyReview has flagged the device refresh_due."
    roles: [AccountManager]
    code: 200
    input: [successor_device_id]
    output: Device
    side_effects: ["replaced_by_device_id := successor_device_id", "increments Device.version by 1"]
  - method: GET
    path: "/devices/{id}/statement-lines"
    description: "List every StatementLine ever written for this device (reverse lookup for StatementLine.device_id)."
    roles: [BillingAnalyst, AccountManager]
    code: 200
    input: ["page_class?", "limit?", "offset?"]
    output: StatementLine[]
    side_effects: []

  # --- Technician ---
  - method: POST
    path: "/technicians"
    description: "Register a field technician with a dispatch region, skill level and travel buffer."
    roles: [AccountManager]
    code: 201
    input: [full_name, home_region, skill_level, "travel_buffer_minutes?"]
    output: Technician
    side_effects: ["open_dispatch_count := 0"]
  - method: GET
    path: "/technicians/{id}"
    description: "Read one technician with the live open_dispatch_count."
    roles: [AccountManager, FleetOpsController, FieldTechnician]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/technicians"
    description: "List technicians, optionally filtered by dispatch region and skill level."
    roles: [AccountManager, FleetOpsController, FieldTechnician]
    code: 200
    input: ["home_region?", "skill_level?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  # --- Meter reading ---
  - method: POST
    path: "/billing-periods"
    description: "Open a billing period for a contract; windows are half-open and must not intersect another period of the same contract."
    roles: [BillingAnalyst]
    code: 201
    input: [contract_id, period_start, period_end]
    output: BillingPeriod
    side_effects: ["status := OPEN", "sweep_run_count := 0"]
  - method: GET
    path: "/billing-periods/{id}"
    description: "Read one billing period with its exception counter and both totals."
    roles: [BillingAnalyst, AccountManager, FleetOpsController]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: []
  - method: GET
    path: "/billing-periods"
    description: "List billing periods (reverse lookup for BillingPeriod.contract_id)."
    roles: [BillingAnalyst, AccountManager, FleetOpsController]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: BillingPeriod[]
    side_effects: []
  - method: POST
    path: "/_agent/meter-reads"
    description: "Test-driving endpoint: emit the reading a data collection agent would push for a device (source := AUTOMATED). Declared under the /_ namespace because the real feed arrives from an out-of-band DCA process."
    roles: [FleetOpsController]
    code: 201
    input: [device_id, billing_period_id, mono_meter, color_meter, toner_level_pct, coverage_start, coverage_end]
    output: MeterRead
    side_effects: ["source := AUTOMATED", "runs meter_read_validation -> ACCEPTED or EXCEPTION", "on ACCEPTED: cascades into Device counters, the supply dimension, auto-replenishment, Site.open_toner_units and ServiceContract.consumables_committed_cents"]
  - method: POST
    path: "/meter-reads"
    description: "Submit a manual meter reading for a device (source := MANUAL); used for offline devices."
    roles: [FieldTechnician]
    code: 201
    input: [device_id, billing_period_id, mono_meter, color_meter, toner_level_pct, coverage_start, coverage_end]
    output: MeterRead
    side_effects: ["source := MANUAL", "submitted_by_user_id := X-User-ID", "same validation and cascade as the agent endpoint"]
  - method: GET
    path: "/meter-reads/{id}"
    description: "Read one meter read with its deltas and exception reason."
    roles: [FleetOpsController, BillingAnalyst, FieldTechnician, AccountManager]
    code: 200
    input: []
    output: MeterRead
    side_effects: []
  - method: GET
    path: "/meter-reads"
    description: "List meter reads (reverse lookup for MeterRead.device_id and MeterRead.billing_period_id)."
    roles: [FleetOpsController, BillingAnalyst, FieldTechnician, AccountManager]
    code: 200
    input: ["device_id?", "billing_period_id?", "status?", "source?", "limit?", "offset?"]
    output: MeterRead[]
    side_effects: []
  - method: POST
    path: "/meter-reads/{id}/resolve-exception"
    description: "Resolve a read exception with corrected meters (manual read for an offline device); re-runs validation and may land back in EXCEPTION."
    roles: [FleetOpsController]
    code: 200
    input: [corrected_mono_meter, corrected_color_meter, corrected_toner_level_pct, resolution_note]
    output: MeterRead
    side_effects: ["resolved_by_user_id := X-User-ID", "re-runs meter_read_validation", "on ACCEPTED: full acceptance cascade", "increments MeterRead.version by 1"]
  - method: POST
    path: "/meter-reads/{id}/void"
    description: "Void the newest ACCEPTED read of a device and compensate every counter it moved."
    roles: [FleetOpsController]
    code: 200
    input: [voided_reason]
    output: MeterRead
    side_effects: ["status := VOID", "device meters, lifetime pages, pages_since_last_cartridge and toner_level_pct reverted", "an AUTO_THRESHOLD order raised by this read is CANCELLED with cancel_reason READ_VOIDED", "increments MeterRead.version by 1"]
  - method: POST
    path: "/billing-periods/{id}/meter-sweep"
    description: "Ops run: create SWEEP_ESTIMATE / DEVICE_OFFLINE exception reads for every eligible device that has no ACCEPTED read covering the period."
    roles: [FleetOpsController]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status := SWEPT", "sweep_run_count += 1", "exception_open_count recomputed", "increments BillingPeriod.version by 1"]

  # --- Billing ---
  - method: POST
    path: "/billing-periods/{id}/provisional-statement"
    description: "Generate (or regenerate) the forward-looking PROVISIONAL statement for a period. OCC-guarded on the period version."
    roles: [BillingAnalyst]
    code: 201
    input: [expected_billing_period_version]
    output: BillingStatement
    side_effects: ["supersedes any prior PROVISIONAL statement and its lines", "period.status := PROVISIONAL", "period.provisional_total_cents := statement.total_cents", "increments BillingPeriod.version by 1"]
  - method: POST
    path: "/billing-periods/{id}/close"
    description: "Close the period and issue the FINAL chronological statement; requires zero open read exceptions and a clock at or past period_end."
    roles: [BillingAnalyst]
    code: 201
    input: []
    output: BillingStatement
    side_effects: ["period.status := CLOSED", "period.final_total_cents := statement.total_cents", "contract.lifetime_billed_cents and contract.true_up_balance_cents updated", "increments BillingPeriod.version by 1"]
  - method: GET
    path: "/billing-statements/{id}"
    description: "Read one statement with every computed money field."
    roles: [BillingAnalyst, AccountManager, CustomerAdmin]
    code: 200
    input: []
    output: BillingStatement
    side_effects: []
  - method: GET
    path: "/billing-statements"
    description: "List statements (reverse lookup for BillingStatement.billing_period_id)."
    roles: [BillingAnalyst, AccountManager, CustomerAdmin]
    code: 200
    input: ["billing_period_id?", "variant?", "limit?", "offset?"]
    output: BillingStatement[]
    side_effects: []
  - method: GET
    path: "/billing-statements/{id}/lines"
    description: "List the statement's lines in emission order (reverse lookup for StatementLine.statement_id)."
    roles: [BillingAnalyst, AccountManager, CustomerAdmin]
    code: 200
    input: ["page_class?", "limit?", "offset?"]
    output: StatementLine[]
    side_effects: []

  # --- Consumables ---
  - method: POST
    path: "/consumable-orders"
    description: "Raise a manual toner replenishment order; supersedes the device's existing open order. OCC-guarded on the device version."
    roles: [FleetOpsController]
    code: 201
    input: [device_id, part_type, unit_price_cents, expected_device_version, "quantity?"]
    output: ConsumableOrder
    side_effects: ["trigger_source := MANUAL", "prior ORDERED order for the device CANCELLED with cancel_reason HOARDING_CONTROL", "device.supply_state := SUPPLY_ORDERED", "site.open_toner_units and contract.consumables_committed_cents recomputed", "increments Device.version by 1"]
  - method: GET
    path: "/consumable-orders/{id}"
    description: "Read one replenishment order with its waste flag."
    roles: [FleetOpsController, FieldTechnician, BillingAnalyst, AccountManager]
    code: 200
    input: []
    output: ConsumableOrder
    side_effects: []
  - method: GET
    path: "/consumable-orders"
    description: "List replenishment orders (reverse lookup for ConsumableOrder.device_id)."
    roles: [FleetOpsController, FieldTechnician, BillingAnalyst, AccountManager]
    code: 200
    input: ["device_id?", "status?", "trigger_source?", "limit?", "offset?"]
    output: ConsumableOrder[]
    side_effects: []
  - method: POST
    path: "/consumable-orders/{id}/deliver"
    description: "Record cartridge delivery; resets the device's cartridge page watermark and releases the commitment."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ConsumableOrder
    side_effects: ["status := DELIVERED", "delivered_at := clock", "device.supply_state := SUPPLY_OK", "device.pages_since_last_cartridge := 0", "site.open_toner_units and contract.consumables_committed_cents released"]
  - method: POST
    path: "/consumable-orders/{id}/cancel"
    description: "Cancel an open replenishment order and release every committed quantity it held."
    roles: [FleetOpsController]
    code: 200
    input: [cancel_reason]
    output: ConsumableOrder
    side_effects: ["status := CANCELLED", "site.open_toner_units and contract.consumables_committed_cents released", "device.supply_state := SUPPLY_LOW or SUPPLY_OK per toner_level_pct"]

  # --- Service dispatch ---
  - method: POST
    path: "/service-tickets"
    description: "Open a break/fix ticket for a device; respond_by is stamped from the contract's response-time commitment."
    roles: [CustomerAdmin]
    code: 201
    input: [device_id, severity, symptom_code, "part_sku?"]
    output: ServiceTicket
    side_effects: ["status := OPEN", "opened_at := clock", "respond_by := opened_at + the severity's SLA hours"]
  - method: GET
    path: "/service-tickets/{id}"
    description: "Read one ticket with its SLA computations."
    roles: [FleetOpsController, FieldTechnician, CustomerAdmin, BillingAnalyst, AccountManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: GET
    path: "/service-tickets"
    description: "List tickets (reverse lookup for ServiceTicket.device_id and ServiceTicket.assigned_technician_id)."
    roles: [FleetOpsController, FieldTechnician, CustomerAdmin, BillingAnalyst, AccountManager]
    code: 200
    input: ["device_id?", "assigned_technician_id?", "status?", "severity?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []
  - method: POST
    path: "/service-tickets/{id}/dispatch"
    description: "Assign a technician and reserve an onsite window; the window is checked against the technician's buffered occupancy."
    roles: [FleetOpsController]
    code: 200
    input: [technician_id, window_start, window_end]
    output: ServiceTicket
    side_effects: ["status := DISPATCHED", "assigned_technician_id := technician_id", "device ACTIVE -> SERVICE_HOLD", "increments ServiceTicket.version by 1"]
  - method: POST
    path: "/service-tickets/{id}/parts-hold"
    description: "Put a dispatched ticket on parts hold because the required SKU is not in the site locker."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status := PARTS_HOLD", "hold_started_at := clock", "increments ServiceTicket.version by 1"]
  - method: POST
    path: "/service-tickets/{id}/arrive-onsite"
    description: "Record technician arrival; consumes one unit of the required SKU and closes any parts-hold interval."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status := ONSITE", "parts_hold_hours accumulated", "SparePartStock.on_hand_qty -= 1 when a part is required", "increments ServiceTicket.version by 1"]
  - method: POST
    path: "/service-tickets/{id}/resolve"
    description: "Resolve the ticket; stamps responded_at and computes labor and the response-time credit."
    roles: [FieldTechnician]
    code: 200
    input: [labor_hours]
    output: ServiceTicket
    side_effects: ["status := RESOLVED", "hours_late, labor_cents and sla_credit_cents computed", "device SERVICE_HOLD -> ACTIVE", "increments ServiceTicket.version by 1"]
  - method: POST
    path: "/service-tickets/{id}/cancel"
    description: "Cancel a ticket that has not yet reached ONSITE and release the device hold."
    roles: [CustomerAdmin]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status := CANCELLED", "device SERVICE_HOLD -> ACTIVE when no other open ticket exists", "increments ServiceTicket.version by 1"]

  # --- Quarterly business review ---
  - method: POST
    path: "/quarterly-reviews"
    description: "Create the QBR: computes both TCO savings variants, the volume trend and the per-device right-sizing recommendations."
    roles: [AccountManager]
    code: 201
    input: [contract_id, quarter_label]
    output: QuarterlyReview
    side_effects: ["authored_by_user_id := X-User-ID", "Device.right_sizing_action written for every FLEET device", "baseline_savings_cents, realized_savings_cents, volume_trend_pct and the four counters computed"]
  - method: GET
    path: "/quarterly-reviews/{id}"
    description: "Read one review with all computed review figures."
    roles: [AccountManager, BillingAnalyst, CustomerAdmin]
    code: 200
    input: []
    output: QuarterlyReview
    side_effects: []
  - method: GET
    path: "/service-contracts/{id}/quarterly-reviews"
    description: "List the contract's reviews (reverse lookup for QuarterlyReview.contract_id)."
    roles: [AccountManager, BillingAnalyst, CustomerAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QuarterlyReview[]
    side_effects: []
  - method: POST
    path: "/quarterly-reviews/{id}/approve"
    description: "Approve the review and publish refresh_due onto the fleet; the approver must differ from the author."
    roles: [AccountManager]
    code: 200
    input: []
    output: QuarterlyReview
    side_effects: ["status := APPROVED", "approved_by_user_id := X-User-ID", "Device.refresh_due := true for UPGRADE/CONSOLIDATE devices", "increments QuarterlyReview.version by 1"]

  # --- End of contract ---
  - method: POST
    path: "/removal-orders"
    description: "Request end-of-contract removal; moves the contract to TERMINATING and stamps removal_order_id onto every in-service device."
    roles: [AccountManager]
    code: 201
    input: [contract_id, scheduled_for]
    output: RemovalOrder
    side_effects: ["status := REQUESTED", "contract.status := TERMINATING", "covered devices get removal_order_id"]
  - method: GET
    path: "/removal-orders/{id}"
    description: "Read one removal order with every settlement money field."
    roles: [AccountManager, BillingAnalyst, FieldTechnician]
    code: 200
    input: []
    output: RemovalOrder
    side_effects: []
  - method: GET
    path: "/removal-orders"
    description: "List removal orders (reverse lookup for RemovalOrder.contract_id)."
    roles: [AccountManager, BillingAnalyst, FieldTechnician]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: RemovalOrder[]
    side_effects: []
  - method: POST
    path: "/removal-orders/{id}/schedule"
    description: "Confirm the collection date for a requested removal order."
    roles: [AccountManager]
    code: 200
    input: [scheduled_for]
    output: RemovalOrder
    side_effects: ["status := SCHEDULED", "scheduled_for := body value", "increments RemovalOrder.version by 1"]
  - method: POST
    path: "/removal-orders/{id}/collect"
    description: "Record physical collection; every covered device moves to RETRIEVED."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: RemovalOrder
    side_effects: ["status := COLLECTED", "covered devices -> RETRIEVED", "device_count recomputed", "increments RemovalOrder.version by 1"]
  - method: POST
    path: "/removal-orders/{id}/sanitize"
    description: "Record data sanitization with its certificate; devices move to REMOVED and their open toner orders are cancelled."
    roles: [FieldTechnician]
    code: 200
    input: [sanitization_method, sanitization_certificate_ref]
    output: RemovalOrder
    side_effects: ["status := SANITIZED", "covered devices RETRIEVED -> REMOVED", "contract.active_device_count recomputed", "open ConsumableOrders CANCELLED with cancel_reason DEVICE_REMOVED", "site.open_toner_units and contract.consumables_committed_cents released"]
  - method: POST
    path: "/removal-orders/{id}/settle"
    description: "Compute and post the end-of-contract settlement, then close the contract."
    roles: [BillingAnalyst]
    code: 200
    input: []
    output: RemovalOrder
    side_effects: ["settlement_amount calculation writes all six money fields", "status := SETTLED", "settled_at := clock", "contract.status := CLOSED", "increments RemovalOrder.version by 1"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default); it MUST NOT fall back to real wall-clock time."
    roles: [AccountManager, BillingAnalyst, FleetOpsController, FieldTechnician, CustomerAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["every subsequent opened_at / read_at / delivered_at / generated_at / settled_at stamp and every deadline comparison uses the new value"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of AccountManager / BillingAnalyst / FleetOpsController / FieldTechnician / CustomerAdmin."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles in §1.5."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals MeterRead.submitted_by_user_id on resolve-exception, or equals QuarterlyReview.authored_by_user_id on review approval."
  - id: ERR_TECHNICIAN_NOT_ASSIGNED
    http: 403
    condition: "A FieldTechnician acts on a ServiceTicket whose assigned_technician_id differs from the acting X-User-ID."
  - id: ERR_SITE_OWNERSHIP_REQUIRED
    http: 403
    condition: "A CustomerAdmin acts on a resource whose owning Site.id differs from the acting X-User-ID (site path id on secure-release-config; device.site_id on ticket create and ticket cancel)."
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required body field is missing, a field has the wrong type, an enum field carries an undeclared member, or a numeric field is out of its declared range (including limit outside 1..100 or negative offset)."
  # --- not found ---
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "No ServiceContract exists for the supplied path id or body contract_id."
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "No Site exists for the supplied path id or body site_id."
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "No Device exists for the supplied path id, body device_id, or body successor_device_id."
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "No Technician exists for the supplied path id or body technician_id."
  - id: ERR_METER_READ_NOT_FOUND
    http: 404
    condition: "No MeterRead exists for the supplied path id."
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "No BillingPeriod exists for the supplied path id or body billing_period_id."
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "No BillingStatement exists for the supplied path id."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No ConsumableOrder exists for the supplied path id."
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "No ServiceTicket exists for the supplied path id."
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No QuarterlyReview exists for the supplied path id."
  - id: ERR_REMOVAL_ORDER_NOT_FOUND
    http: 404
    condition: "No RemovalOrder exists for the supplied path id."
  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_PERIOD_VERSION
    http: 412
    condition: "expected_billing_period_version supplied to POST /billing-periods/{id}/provisional-statement differs from BillingPeriod.version at the moment the write is applied."
  - id: ERR_STALE_DEVICE_VERSION
    http: 412
    condition: "expected_device_version supplied to POST /consumable-orders differs from Device.version at the moment the write is applied."
  # --- state machine gating ---
  - id: ERR_CONTRACT_INVALID_STATE
    http: 409
    condition: "The requested ServiceContract transition does not exist from the contract's current status (e.g. activate on an ACTIVE contract, resume on an ACTIVE contract, suspend on a CLOSED contract)."
  - id: ERR_DEVICE_INVALID_STATE
    http: 409
    condition: "The requested Device lifecycle transition does not exist from the device's current lifecycle_state (e.g. place on an ACTIVE device, activate on an ASSESSED device)."
  - id: ERR_READ_INVALID_STATE
    http: 409
    condition: "The requested MeterRead transition does not exist from the read's current status (e.g. resolve-exception on an ACCEPTED read, void on an EXCEPTION read)."
  - id: ERR_PERIOD_INVALID_STATE
    http: 409
    condition: "The requested BillingPeriod transition does not exist from the period's current status (e.g. meter-sweep on a CLOSED period, provisional-statement on an OPEN period that has never been swept)."
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "The requested ConsumableOrder transition does not exist from the order's current status (e.g. deliver or cancel on a DELIVERED order)."
  - id: ERR_TICKET_INVALID_STATE
    http: 409
    condition: "The requested ServiceTicket transition does not exist from the ticket's current status (e.g. resolve on a DISPATCHED ticket that never reached ONSITE, arrive-onsite on an OPEN ticket, cancel on a RESOLVED ticket)."
  - id: ERR_REVIEW_ALREADY_APPROVED
    http: 409
    condition: "POST /quarterly-reviews/{id}/approve on a QuarterlyReview whose status is already APPROVED."
  - id: ERR_REMOVAL_INVALID_STATE
    http: 409
    condition: "The requested RemovalOrder transition does not exist from the order's current status (e.g. sanitize on a SCHEDULED order, settle on a COLLECTED order)."
  # --- cross-entity state prerequisites ---
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "An operation that consumes the contract (device placement, device activation, meter-read intake, meter sweep, provisional statement, consumable order, ticket creation) is attempted while ServiceContract.status is not ACTIVE."
  - id: ERR_PERIOD_ALREADY_CLOSED
    http: 409
    condition: "A MeterRead is created, resolved or voided against a BillingPeriod whose status is CLOSED."
  - id: ERR_READ_NOT_NEWEST
    http: 409
    condition: "POST /meter-reads/{id}/void targets an ACCEPTED read that is not the device's newest ACCEPTED read by (coverage_end DESC, created_at DESC)."
  - id: ERR_DEVICE_NOT_METERABLE
    http: 409
    condition: "Meter-read intake is attempted for a Device whose lifecycle_state is not in {ACTIVE, SERVICE_HOLD}."
  - id: ERR_SECURE_RELEASE_NOT_CONFIGURED
    http: 409
    condition: "POST /devices/{id}/activate while the device's Site.secure_release_state is not CONFIGURED."
  - id: ERR_DEVICE_NOT_REFRESH_DUE
    http: 409
    condition: "POST /devices/{id}/refresh-replacement while the path device has refresh_due == false or already carries a non-null replaced_by_device_id, or the successor device belongs to another contract, is not in {ASSESSED, PLACED, NETWORKED, ACTIVE}, or is the path device itself."
  - id: ERR_PERIOD_HAS_OPEN_EXCEPTIONS
    http: 409
    condition: "POST /billing-periods/{id}/close while exception_open_count > 0 (some MeterRead of the period is PENDING_VALIDATION or EXCEPTION)."
  - id: ERR_SETTLEMENT_PERIOD_OPEN
    http: 409
    condition: "POST /removal-orders/{id}/settle while some BillingPeriod of the contract with period_end <= the logical clock is not CLOSED."
  # --- dispatch / parts ---
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 422
    condition: "A CRITICAL ServiceTicket is dispatched to a Technician whose skill_level is L1."
  - id: ERR_TECHNICIAN_REGION_MISMATCH
    http: 422
    condition: "The dispatched Technician's home_region differs from the address_region of the Site that hosts the ticket's device."
  - id: ERR_DISPATCH_WINDOW_CONFLICT
    http: 409
    condition: "window_start >= window_end, window_start is before the logical clock, or the requested window intersects a window already occupied by the same Technician after inflating each occupied window by travel_buffer_minutes on both sides."
  - id: ERR_PART_NOT_AVAILABLE
    http: 409
    condition: "POST /service-tickets/{id}/arrive-onsite for a ticket with a non-null part_sku while the SparePartStock row for (device.site_id, part_sku) is missing or has on_hand_qty == 0."
  - id: ERR_PART_IS_AVAILABLE
    http: 409
    condition: "POST /service-tickets/{id}/parts-hold while the SparePartStock row for (device.site_id, ticket.part_sku) exists with on_hand_qty >= 1 (a hold is only legitimate when the part is genuinely unavailable)."
  - id: ERR_LABOR_HOURS_EXCEED_LIMIT
    http: 422
    condition: "Reported labor_hours exceeds MAX_LABOR_HOURS_PER_TICKET (8)."
  # --- temporal ---
  - id: ERR_READ_OUTSIDE_PERIOD
    http: 422
    condition: "The read's device.contract_id differs from the period's contract_id, or coverage_end falls outside the half-open window [period_start, period_end)."
  - id: ERR_READ_INTERVAL_OVERLAP
    http: 409
    condition: "coverage_start >= coverage_end, or the read's half-open interval intersects the interval of another MeterRead of the same device whose status is in {PENDING_VALIDATION, ACCEPTED}; touching endpoints are allowed."
  - id: ERR_PERIOD_WINDOW_OVERLAP
    http: 409
    condition: "period_start >= period_end, or the new BillingPeriod window intersects another period of the same contract (half-open, touching endpoints allowed)."
  - id: ERR_PERIOD_NOT_ENDED
    http: 409
    condition: "POST /billing-periods/{id}/close while the logical clock is before period_end."
  - id: ERR_COLLECTION_NOT_DUE
    http: 409
    condition: "POST /removal-orders/{id}/collect while the logical clock is before scheduled_for."
  - id: ERR_SCHEDULE_IN_PAST
    http: 409
    condition: "scheduled_for supplied to POST /removal-orders or POST /removal-orders/{id}/schedule is before the logical clock."
  # --- rate card / uniqueness / caps ---
  - id: ERR_RATE_CARD_INCOMPLETE
    http: 409
    condition: "POST /service-contracts/{id}/activate while the contract has no MONO CostTier with tier_index 1 and from_page 1, or has a color_capable device but no such COLOR tier."
  - id: ERR_TIER_COVERAGE_GAP
    http: 409
    condition: "Statement generation finds a page_class with contract-level volume > 0 for which no CostTier band contains that volume."
  - id: ERR_TIER_BAND_CONFLICT
    http: 409
    condition: "A CostTier row duplicates (contract_id, page_class, tier_index) or its [from_page, to_page] band intersects an existing band of the same (contract_id, page_class)."
  - id: ERR_ASSET_TAG_DUPLICATE
    http: 409
    condition: "A Device is created with an asset_tag already used within the same contract_id."
  - id: ERR_PART_STOCK_UNDERFLOW
    http: 409
    condition: "POST /sites/{id}/spare-part-stocks supplies qty_delta == 0, or a negative qty_delta that would drive the (site_id, part_sku) row's on_hand_qty below zero; the row itself is upserted, so a repeated part_sku is not by itself an error."
  - id: ERR_QUARTER_DUPLICATE
    http: 409
    condition: "A QuarterlyReview is created with a quarter_label already present for the same contract_id."
  - id: ERR_TONER_CAP_EXCEEDED
    http: 409
    condition: "site.open_toner_units - superseded_units + requested quantity would exceed site.toner_unit_cap."

# =============================================================================
# §1.7 RBAC Matrix
# role_model: segregation_of_duties — the meter reader may not resolve its own
# exception, the review author may not approve its own review, and the three
# money-touching duties (rate card, statement, settlement) sit with different
# roles from the operational duties (dispatch, sweep, replenishment).
# =============================================================================
roles:
  - name: AccountManager
    description: "Commercial owner of the contract: writes the contract shell and its cost-per-page rate card, activates/suspends/resumes it, registers sites and technicians, authors quarterly business reviews, approves other authors' reviews, links refresh successors, and opens end-of-contract removal orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-contracts"
      - "POST /service-contracts/{id}/cost-tiers"
      - "POST /service-contracts/{id}/activate"
      - "POST /service-contracts/{id}/suspend"
      - "POST /service-contracts/{id}/resume"
      - "POST /sites"
      - "POST /technicians"
      - "POST /devices/{id}/refresh-replacement"
      - "POST /quarterly-reviews"
      - "POST /quarterly-reviews/{id}/approve"
      - "POST /removal-orders"
      - "POST /removal-orders/{id}/schedule"
    shared_operations:
      - "GET /service-contracts/{id}"
      - "GET /service-contracts/{id}/cost-tiers"
      - "GET /sites/{id}"
      - "GET /sites"
      - "GET /sites/{id}/spare-part-stocks"
      - "GET /devices/{id}"
      - "GET /devices"
      - "GET /devices/{id}/statement-lines"
      - "GET /technicians/{id}"
      - "GET /technicians"
      - "GET /billing-periods/{id}"
      - "GET /billing-periods"
      - "GET /meter-reads/{id}"
      - "GET /meter-reads"
      - "GET /billing-statements/{id}"
      - "GET /billing-statements"
      - "GET /billing-statements/{id}/lines"
      - "GET /consumable-orders/{id}"
      - "GET /consumable-orders"
      - "GET /service-tickets/{id}"
      - "GET /service-tickets"
      - "GET /quarterly-reviews/{id}"
      - "GET /service-contracts/{id}/quarterly-reviews"
      - "GET /removal-orders/{id}"
      - "GET /removal-orders"
      - "POST /_clock/set_current_utc"
  - name: BillingAnalyst
    description: "Owns the money surface: opens billing periods, issues the forward-looking PROVISIONAL statement, closes the period into the chronological FINAL statement, and posts the end-of-contract settlement. Never touches meters, dispatch or replenishment."
    identity: "opaque"
    exclusive_operations:
      - "POST /billing-periods"
      - "POST /billing-periods/{id}/provisional-statement"
      - "POST /billing-periods/{id}/close"
      - "POST /removal-orders/{id}/settle"
    shared_operations:
      - "GET /service-contracts/{id}"
      - "GET /service-contracts/{id}/cost-tiers"
      - "GET /sites/{id}"
      - "GET /sites"
      - "GET /devices/{id}"
      - "GET /devices"
      - "GET /devices/{id}/statement-lines"
      - "GET /billing-periods/{id}"
      - "GET /billing-periods"
      - "GET /meter-reads/{id}"
      - "GET /meter-reads"
      - "GET /billing-statements/{id}"
      - "GET /billing-statements"
      - "GET /billing-statements/{id}/lines"
      - "GET /consumable-orders/{id}"
      - "GET /consumable-orders"
      - "GET /service-tickets/{id}"
      - "GET /service-tickets"
      - "GET /quarterly-reviews/{id}"
      - "GET /service-contracts/{id}/quarterly-reviews"
      - "GET /removal-orders/{id}"
      - "GET /removal-orders"
      - "POST /_clock/set_current_utc"
  - name: FleetOpsController
    description: "Runs the fleet: registers devices, activates them once the site's secure print release is configured, stocks spare parts, ingests automated meter reads, resolves read exceptions raised by someone else's submission, voids the newest accepted read, sweeps the period, raises and cancels consumable orders, and dispatches technicians."
    identity: "opaque"
    exclusive_operations:
      - "POST /devices"
      - "POST /devices/{id}/activate"
      - "POST /sites/{id}/spare-part-stocks"
      - "POST /_agent/meter-reads"
      - "POST /meter-reads/{id}/resolve-exception"
      - "POST /meter-reads/{id}/void"
      - "POST /billing-periods/{id}/meter-sweep"
      - "POST /consumable-orders"
      - "POST /consumable-orders/{id}/cancel"
      - "POST /service-tickets/{id}/dispatch"
    shared_operations:
      - "GET /service-contracts/{id}"
      - "GET /service-contracts/{id}/cost-tiers"
      - "GET /sites/{id}"
      - "GET /sites"
      - "GET /sites/{id}/spare-part-stocks"
      - "GET /devices/{id}"
      - "GET /devices"
      - "GET /technicians/{id}"
      - "GET /technicians"
      - "GET /billing-periods/{id}"
      - "GET /billing-periods"
      - "GET /meter-reads/{id}"
      - "GET /meter-reads"
      - "GET /consumable-orders/{id}"
      - "GET /consumable-orders"
      - "GET /service-tickets/{id}"
      - "GET /service-tickets"
      - "POST /_clock/set_current_utc"
  - name: FieldTechnician
    description: "The person at the device: places and network-integrates hardware, submits manual meter reads, delivers consumables, declares parts holds, arrives onsite, resolves tickets with reported labor hours, and collects and sanitizes hardware at end of contract. X-User-ID is a Technician.id, so assignment ownership is checkable."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /devices/{id}/place"
      - "POST /devices/{id}/network-integration"
      - "POST /meter-reads"
      - "POST /consumable-orders/{id}/deliver"
      - "POST /service-tickets/{id}/parts-hold"
      - "POST /service-tickets/{id}/arrive-onsite"
      - "POST /service-tickets/{id}/resolve"
      - "POST /removal-orders/{id}/collect"
      - "POST /removal-orders/{id}/sanitize"
    shared_operations:
      - "GET /service-contracts/{id}"
      - "GET /sites/{id}"
      - "GET /sites/{id}/spare-part-stocks"
      - "GET /devices/{id}"
      - "GET /devices"
      - "GET /technicians/{id}"
      - "GET /technicians"
      - "GET /meter-reads/{id}"
      - "GET /meter-reads"
      - "GET /consumable-orders/{id}"
      - "GET /consumable-orders"
      - "GET /service-tickets/{id}"
      - "GET /service-tickets"
      - "GET /removal-orders/{id}"
      - "GET /removal-orders"
      - "POST /_clock/set_current_utc"
  - name: CustomerAdmin
    description: "The customer's own site administrator: configures secure print release for the site it represents, raises and cancels service tickets for devices at that site, and reads its statements and reviews. X-User-ID is a Site.id, so site ownership is checkable."
    identity: "entity_backed:Site"
    exclusive_operations:
      - "POST /sites/{id}/secure-release-config"
      - "POST /service-tickets"
      - "POST /service-tickets/{id}/cancel"
    shared_operations:
      - "GET /service-contracts/{id}"
      - "GET /sites/{id}"
      - "GET /devices/{id}"
      - "GET /billing-statements/{id}"
      - "GET /billing-statements"
      - "GET /billing-statements/{id}/lines"
      - "GET /service-tickets/{id}"
      - "GET /service-tickets"
      - "GET /quarterly-reviews/{id}"
      - "GET /service-contracts/{id}/quarterly-reviews"
      - "POST /_clock/set_current_utc"
