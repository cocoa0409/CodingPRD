      - name: facility_slot_aggregate_and_millisecond_lead_time_both_endpoints
        grounds:
          - calculations.calendar_conflict_scan
          - validations[priority=30]
          - validations[priority=31]
          - entities.DetentionFacility.fields.max_daily_visit_slots
          - entities.DetentionFacility.fields.visit_lead_time_hours
        distinguishing_aspect: |
          Two boundaries of two different metric kinds on POST /calendar-events: the facility
          geometry is an INTEGER per-UTC-date aggregate compared with >=, so slot 1 of 1 books
          and slot 2 fails, and a facility with max_daily_visit_slots 0 rejects its very first
          visit; the lead-time gate is a MILLISECOND instant comparison, so a start exactly
          visit_lead_time_hours after the logical clock books while a start one millisecond
          earlier is rejected with ERR_FACILITY_LEAD_TIME_NOT_MET / 422. The one-millisecond
          candidate deliberately carries client_conflict_waived true so that geometry B
          (priority 30) cannot mask the priority-31 answer.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "Facility F1: visit_lead_time_hours 48, max_daily_visit_slots 1, access_credential_required false (so ERR_FACILITY_CREDENTIAL_EXPIRED can never confound the probe)."
            - "Facility F0: visit_lead_time_hours 24, max_daily_visit_slots 0 - the degenerate ceiling."
            - "One detained BOND_HEARING matter at F1 for client C1, accepted so the matter exists."
            - "Three distinct representatives rep_v1, rep_v2, rep_v3 are used as the assigned_representative_id of the four candidate events so that geometry A (representative, half-open with travel buffer) never trips and each rejection is attributable to exactly one rule."
            - "48 hours after 2026-09-01T00:00:00.000Z is exactly 2026-09-03T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
