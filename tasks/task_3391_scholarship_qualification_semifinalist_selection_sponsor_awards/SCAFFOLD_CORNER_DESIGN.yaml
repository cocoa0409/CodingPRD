        grounds: ["errors[ERR_CLOCK_REGRESSION]", "validations[priority=8]", "endpoints[POST /api/_clock/set_current_utc]"]
        distinguishing_aspect: "The logical clock is strictly monotonic: setting it to the exact current instant (let alone an earlier one) is ERR_CLOCK_REGRESSION, and the failed call leaves the clock untouched."
        test_recipe:
          setup:
            - "A cycle exists; the logical clock has been advanced to 2027-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-E5", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
