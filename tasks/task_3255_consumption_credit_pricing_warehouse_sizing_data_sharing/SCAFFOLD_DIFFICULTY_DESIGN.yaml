              captures: { err_pp: $.data.error_id }
          assert:
            - "${err_pp} == ERR_ACCOUNT_DRAINING"
            - "Account.${acct_pp}.account_state == DRAINING"
            - "the same request also violates the segregation rule because fin-sod-1 activated the contract, so priority 7 over priority 8 is what selects the reported error"
            - "CapacityContract.${ct_pp}.status == ACTIVE and the close had no side effect"
  - rule_id: boundary_precision_check
    instances:
      - name: billed_floor_exact_boundary_at_sixty_seconds
        grounds:
          - calculations.warehouse_credit_burn
          - entities.VirtualWarehouse.fields.auto_suspend_seconds
          - entities.WarehouseSession.fields.billed_seconds
        distinguishing_aspect: "The floor is a monotonic raise rather than a strict greater-than, so a 60-second session bills exactly 0.066667 credits while a 59-second session bills the same 0.066667 and a 61-second session bills 0.067778 — one endpoint, three probe lengths, two of which are indistinguishable."
        test_recipe:
          setup:
            - "one MEDIUM warehouse with auto_suspend_seconds 60 and a contract to draw against"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Boundary Floor", account_locator: "bf1003", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_bf: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_bf}", name: "WH_BF", size: "MEDIUM", auto_suspend_seconds: 60, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_bf: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_bf}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_bf: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_bf}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_bf}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_bf}" }
              as: DataEngineer
              captures: { ses_bf_59: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:59Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_bf}"
              payload: {}
              as: DataEngineer
              captures: { wh_bf_v1: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_bf_59}/close"
              payload: { expected_warehouse_version: "${wh_bf_v1}" }
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_bf}" }
              as: DataEngineer
              captures: { ses_bf_60: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:01:59Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_bf}"
              payload: {}
              as: DataEngineer
              captures: { wh_bf_v2: $.data.version }
          trigger:
            - call: "POST /v1/warehouse-sessions/${ses_bf_60}/close"
              payload: { expected_warehouse_version: "${wh_bf_v2}" }
              as: DataEngineer
              captures: { ses_bf_60_credits: $.data.billed_credits }
          assert:
            - "WarehouseSession.${ses_bf_59}.billed_seconds == 60 and WarehouseSession.${ses_bf_59}.billed_credits == 0.066667"
            - "${ses_bf_60_credits} == 0.066667"
            - "WarehouseSession.${ses_bf_60}.billed_seconds == 60 and WarehouseSession.${ses_bf_60}.metered_credits == 0.066667"
            - "the 59-second and 60-second sessions are indistinguishable at this boundary, which is the precision being pinned"
      - name: abandoned_session_empty_billing_edge
        grounds:
          - state_machines.WarehouseSession.transitions.RESUMING_to_CLOSED
          - entities.WarehouseSession.fields.billed_seconds
          - entities.VirtualWarehouse.fields.multi_cluster_queued_queries
        distinguishing_aspect: "The zero case sits on a different metric from the floor: a session abandoned from RESUMING bills exactly zero even though the floor would otherwise guarantee a full minute, so a 47-second abandoned session bills 0.000000 while the same length closed normally bills 0.066667."
        test_recipe:
          setup:
            - "one MEDIUM warehouse with auto_suspend_seconds 60, an open session and a contract, plus an account about to be drained with work still queued"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Boundary Zero", account_locator: "bz1004", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_bz: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_bz}", name: "WH_BZ", size: "MEDIUM", auto_suspend_seconds: 60, auto_resume: true, clusters_min: 1, clusters_max: 2, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_bz: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_bz}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_bz: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_bz}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_bz}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_bz}" }
              as: DataEngineer
              captures: { ses_bz: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:47Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_bz}"
              payload: {}
              as: DataEngineer
              captures: { wh_bz_v: $.data.version }
          trigger:
            - call: "POST /v1/warehouses/${wh_bz}/cluster-scaling"
              payload: { clusters: 2, queued_queries: 24, expected_warehouse_version: "${wh_bz_v}" }
              as: DataEngineer
          assert:
            - "WarehouseSession.${ses_bz}.elapsed_seconds == 47"
            - "the queued depth of 24 keeps the session out of the ordinary drain sweep, so the session takes the RESUMING edge instead"
            - "WarehouseSession.${ses_bz}.billed_seconds == 0"
            - "WarehouseSession.${ses_bz}.metered_credits == 0.0 and WarehouseSession.${ses_bz}.billed_credits == 0.0"
            - "no AccountLedgerEntry row exists for WarehouseSession.${ses_bz}, so the account's reconciled credit figure stays 0.0"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: share_publish_requires_published_bound_listing_prestate
        grounds:
          - state_machines.Listing.transitions.DRAFT_to_PUBLISHED
          - state_machines.DataShare.transitions.DRAFT_to_PUBLISHED
          - errors[ERR_SHARE_NOT_PUBLISHED]
          - validations[priority=14]
        distinguishing_aspect: "The Listing to DataShare pair: a listing can be published only while its bound share is PUBLISHED, so the same listing create and publish pair is refused before the share is published and accepted after — the dependency crosses those two entities and no other."
        test_recipe:
          setup:
            - "a share left in DRAFT and a DRAFT usage-based listing bound to it"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Dep Share", account_locator: "ds1005", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ds: $.data.id }
            - call: "POST /v1/accounts"
              payload: { org_name: "Dep Consumer", account_locator: "dc1006", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_dsc: $.data.id }
            - call: "POST /v1/data-shares"
              payload: { provider_account_id: "${acct_ds}", name: "SHARE_DS", objects_exposed: 4, consumer_account_ids: ["${acct_dsc}"], status: "DRAFT" }
              as: ShareAdmin
              as_user_id: "${acct_ds}"
              captures: { share_ds: $.data.id }
          trigger:
            - call: "POST /v1/listings"
              payload: { share_id: "${share_ds}", title: "LIST_DS", pricing_model: "USAGE_BASED", flat_price_usd: 0.50 }
              as: ShareAdmin
              as_user_id: "${acct_ds}"
              captures: { err_ds: $.data.error_id }
            - call: "POST /v1/data-shares/${share_ds}/publish"
              payload: {}
              as: ShareAdmin
              as_user_id: "${acct_ds}"
            - call: "POST /v1/listings"
              payload: { share_id: "${share_ds}", title: "LIST_DS", pricing_model: "USAGE_BASED", flat_price_usd: 0.50 }
              as: ShareAdmin
              as_user_id: "${acct_ds}"
              captures: { list_ds: $.data.id }
            - call: "POST /v1/listings/${list_ds}/publish"
              payload: {}
              as: ShareAdmin
              as_user_id: "${acct_ds}"
          assert:
            - "${err_ds} == ERR_SHARE_NOT_PUBLISHED"
            - "DataShare.${share_ds}.status == PUBLISHED after the second call"
            - "Listing.${list_ds}.listing_state == PUBLISHED"
            - "the same body that failed while the share was DRAFT succeeded once the share reached PUBLISHED"
      - name: resume_blocked_by_suspended_monitor_on_account
        grounds:
          - state_machines.VirtualWarehouse.transitions.SUSPENDED_to_STARTING
          - state_machines.Account.transitions.monitor_suspend_to_account_draining
          - validations[priority=16]
          - errors[ERR_QUOTA_EXCEEDED]
        distinguishing_aspect: "The VirtualWarehouse to Account pair, which is a different entity pair from the Listing to DataShare instance: the warehouse's own state admits the resume, but the owning account's SUSPENDED monitor is what rejects it, so the block comes from the parent and not from the warehouse."
        test_recipe:
          setup:
            - "one account with a SUSPEND_IMMEDIATE monitor on a zero quota and a SUSPENDED SMALL warehouse"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Dep Resume", account_locator: "dr1007", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_dr: $.data.id }
            - call: "POST /v1/resource-monitors"
              payload: { account_id: "${acct_dr}", name: "MON_DR", credit_quota: 0.5, interval: "MONTHLY", action: "SUSPEND_IMMEDIATE" }
              as: FinanceController
              captures: { mon_dr: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_dr}", name: "WH_DR", size: "SMALL", auto_suspend_seconds: 600, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_dr: $.data.id }
          trigger:
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_dr}" }
              as: DataEngineer
          assert:
            - "the same body against a warehouse whose monitor is NOT suspended succeeds, so the rejection is caused by the parent account's monitor state and not by the warehouse's own status"
            - "ResourceMonitor.${mon_dr}.monitor_state remains OK because a zero-consumption interval never crosses 100.0"
            - "the resume is admissible through POST /v1/warehouses/${wh_dr}/resume while the monitor is OK, which is the positive control for the same pair"
            - "VirtualWarehouse.${wh_dr}.status == RUNNING after the control call, proving the block is not a static warehouse property"
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_term_half_open_adjacency_permitted
        grounds:
          - validations[priority=11]
          - errors[ERR_TERM_OVERLAP]
          - state_machines.CapacityContract.transitions.EXPIRED_to_ACTIVE
        distinguishing_aspect: "Half-open [term_start, term_end) windows on CapacityContract, where a renewal whose new_term_start exactly equals the prior term_end is admitted because adjacency is not overlap."
        test_recipe:
          setup:
            - "one ACTIVE contract running 2026-09-01T00:00:00Z to 2026-10-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Overlap Terms", account_locator: "ot1008", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ot: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_ot}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_ot: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_ot}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /v1/capacity-contracts/${ct_ot}/renew"
              payload: { new_term_start: "2026-10-01T00:00:00Z", new_term_end: "2026-11-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00 }
              as: FinanceController
              captures: { ct_ot_end: $.data.term_end }
          assert:
            - "${ct_ot_end} == 2026-11-01T00:00:00Z"
            - "CapacityContract.${ct_ot}.term_start == 2026-10-01T00:00:00Z which is exactly the prior term_end, and the renewal was admitted"
            - "no ERR_TERM_OVERLAP was raised because a shared endpoint is not an overlap under half-open windows"
            - "an overlapping renewal with new_term_start 2026-09-15T00:00:00Z would have raised ERR_TERM_OVERLAP, which is the negative probe for the same rule"
      - name: storage_snapshot_daily_window_capacity_gap_allowed
        grounds:
          - validations[priority=11]
          - errors[ERR_TERM_OVERLAP]
          - entities.StorageUsageRecord.fields.usage_date
        distinguishing_aspect: "Daily storage windows on StorageUsageRecord accumulate rather than merely collide: a second snapshot for the same day is refused, but a snapshot for a day with no snapshot at all is admitted, so the rule mixes a same-resource collision with a capacity-style gap tolerance that the contract-term rule does not have."
        test_recipe:
          setup:
            - "one storage snapshot already recorded for 2026-09-02"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Overlap Storage", account_locator: "os1009", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_os: $.data.id }
            - call: "POST /v1/storage-usage-records"
              payload: { account_id: "${acct_os}", usage_date: "2026-09-02T00:00:00Z", active_tb: 10.0, time_travel_tb: 1.0, fail_safe_tb: 1.0, time_travel_days: 7 }
              as: DataEngineer
              captures: { sur_os_2: $.data.id }
          trigger:
            - call: "POST /v1/storage-usage-records"
              payload: { account_id: "${acct_os}", usage_date: "2026-09-02T12:00:00Z", active_tb: 11.0, time_travel_tb: 1.0, fail_safe_tb: 1.0, time_travel_days: 7 }
              as: DataEngineer
              captures: { err_os: $.data.error_id }
            - call: "POST /v1/storage-usage-records"
              payload: { account_id: "${acct_os}", usage_date: "2026-09-04T00:00:00Z", active_tb: 12.0, time_travel_tb: 1.0, fail_safe_tb: 1.0, time_travel_days: 7 }
              as: DataEngineer
              captures: { sur_os_4: $.data.id }
          assert:
            - "${err_os} == ERR_TERM_OVERLAP"
            - "the 2026-09-02T12:00:00Z window collides with the existing [2026-09-02T00:00:00Z, 2026-09-03T00:00:00Z) window"
            - "GET /v1/storage-usage-records?account_id=${acct_os} contains exactly two records, so the unbilled gap day 2026-09-03 is tolerated"
            - "StorageUsageRecord.${sur_os_4}.usage_date == 2026-09-04T00:00:00Z"
  - rule_id: compensating_invariant
    instances:
      - name: warehouse_session_burn_invariant_under_capacity_changes
        grounds:
          - calculations.warehouse_credit_burn
          - entities.WarehouseSession.fields.billed_credits
          - entities.VirtualWarehouse.fields.size
        distinguishing_aspect: "Session billed credits are a conserved quantity: no resize, scale or resume that happens after a session opens may change that session's billed_credits, so the quantity is invariant under warehouse mutation and only the compensating reverse can remove it."
        test_recipe:
          setup:
            - "one SMALL warehouse with a contract, one open session started at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Inv Session", account_locator: "is1010", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_is: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_is}", name: "WH_IS", size: "SMALL", auto_suspend_seconds: 60, auto_resume: true, clusters_min: 1, clusters_max: 3, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_is: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_is}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_is: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_is}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_is}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_is}" }
              as: DataEngineer
              captures: { ses_is: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:10:00Z" }
              as: PlatformOperator
            - call: "PATCH /v1/warehouses/${wh_is}"
              payload: { size: "XXXLARGE" }
              as: DataEngineer
            - call: "PATCH /v1/warehouses/${wh_is}"
              payload: { size: "SMALL" }
              as: DataEngineer
            - call: "GET /v1/warehouses/${wh_is}"
              payload: {}
              as: DataEngineer
              captures: { wh_is_v: $.data.version }
          trigger:
            - call: "POST /v1/warehouse-sessions/${ses_is}/close"
              payload: { expected_warehouse_version: "${wh_is_v}" }
              as: DataEngineer
              captures: { ses_is_credits: $.data.billed_credits }
          assert:
            - "${ses_is_credits} == 0.333333"
            - "WarehouseSession.${ses_is}.size == SMALL, the frozen snapshot, not the XXXLARGE the warehouse briefly carried"
            - "WarehouseSession.${ses_is}.billed_credits equals the value a session never resized at all would have produced"
            - "Account.${acct_is}.posted_consumption_credits_reconciled == 0.333333"
            - "VirtualWarehouse.${wh_is}.credits_per_hour == 2 while the session was billed at the SMALL rate of 2 per hour"
      - name: credit_drawdown_reversal_leaves_account_credit_conserved
        grounds:
          - state_machines.CreditDrawdown.transitions.ACTIVE_to_REVERSED
          - calculations.account_ledger_reconciliation
          - entities.Account.fields.posted_consumption_credits_reconciled
        distinguishing_aspect: "A different conserved quantity: the account's credit-denominated balance, which a drawdown and its compensating reverse must return to its exact pre-drawdown value, leaving no drift — unlike the session-burn invariant this quantity is a sum over a ledger bucket set."
        test_recipe:
          setup:
            - "one account with an ACTIVE contract at base 1000 and a warehouse"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Inv Draw", account_locator: "id1011", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_id: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_id}", name: "WH_ID", size: "SMALL", auto_suspend_seconds: 600, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_id: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_id: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_id}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_id}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_id}" }
              as: DataEngineer
              captures: { ses_id_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:10:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_id}"
              payload: {}
              as: DataEngineer
              captures: { wh_id_v1: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_id_1}/close"
              payload: { expected_warehouse_version: "${wh_id_v1}" }
              as: DataEngineer
            - call: "GET /v1/accounts/${acct_id}"
              payload: {}
              as: PlatformOperator
              captures: { acct_id_after_1: $.data.posted_consumption_credits_reconciled }
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_id}" }
              as: DataEngineer
              captures: { ses_id_2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:20:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_id}"
              payload: {}
              as: DataEngineer
              captures: { wh_id_v2: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_id_2}/close"
              payload: { expected_warehouse_version: "${wh_id_v2}" }
              as: DataEngineer
            - call: "GET /v1/accounts/${acct_id}"
              payload: {}
              as: PlatformOperator
              captures: { acct_id_after_2: $.data.posted_consumption_credits_reconciled }
            - call: "GET /v1/credit-drawdowns?contract_id=${ct_id}"
              payload: {}
              as: FinanceController
              captures: { dd_id_burn: "$.data[0].id" }
            - call: "GET /v1/credit-drawdowns/${dd_id_burn}"
              payload: {}
              as: FinanceController
              captures: { dd_id_burn_status: $.data.status }
          trigger:
            - call: "POST /v1/credit-drawdowns/${dd_id_burn}/reverse"
              payload: {}
              as: FinanceController
              captures: { dd_id_burn_after: $.data.status }
          assert:
            - "${acct_id_after_1} == 0.333333 and ${acct_id_after_2} == 0.666666"
            - "${dd_id_burn_status} == ACTIVE"
            - "${dd_id_burn_after} == REVERSED"
            - "Account.${acct_id}.posted_consumption_credits_reconciled == 0.333333, exactly the value it held before the second session's posting"
            - "CapacityContract.${ct_id}.remaining_credits == 999.666667"
            - "the drift after the forward-and-compensate pair is 0.000000"