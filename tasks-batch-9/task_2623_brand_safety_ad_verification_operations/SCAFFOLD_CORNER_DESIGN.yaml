          assert:
            - "HTTP 200; Appeal.${appeal_id}.appeal_state == UPHELD (terminal), decided_by_user_id == officer-1, revised_tier == null, remedy_classification_id == null, round_no == 1"
            - "Page.${page_id}.classification_state == HUMAN_CONFIRMED, current_classification_id == ${cls_id}, current_tier == HIGH_RISK, latest_category_codes == [ARMS], appeal_count == 1"
            - "PageClassification.${cls_id}.review_state is still CONFIRMED (not VACATED) and its version is unchanged by the decision"
            - "GET /page-classifications filtered by page_id == ${page_id} returns total_count == 1 (no APPEAL_REMEDY record was minted)"
            - "MeasurementBatch.${batch_id}.assessed_tier == HIGH_RISK, suitability_breach_flag == true, settlement_status == CLAIMED"
            - "RefundClaim.${claim_id}.claim_state == SUBMITTED, claimed_impressions == 10000, provisional_credit_cents == 8750 and Campaign.${camp_id}.open_claim_count == 1"
            - "Publisher.${pub_id}.decided_appeal_count == 1 and overturned_appeal_count == 0"

      - name: override_review_recomputes_the_tier_from_the_revised_categories
        claim_type: side_effect_execution
        grounds:
          - state_machines.PageClassification.PENDING_REVIEW_to_OVERRIDDEN
          - state_machines.Page.MODEL_CLASSIFIED_to_HUMAN_CONFIRMED
          - calculations.page_suitability_tier
        distinguishing_aspect: |
          OVERRIDE has four side effects that must all land on one call:
          category_codes is REPLACED by revised_category_codes, the risk
          arithmetic is redone, the record is re-scored as HUMAN so the
          confidence multiplier that applied to the MODEL original is dropped,
          and Page.current_tier / latest_category_codes are republished. An
          implementation that stores revised_category_codes without recomputing
          leaves a MEDIUM_RISK page that should now be HIGH_RISK.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; publisher with sourced_traffic_pct 0.40; SUITABILITY methodology version."
            - "Page classified MODEL with category_codes [GAMBLING] and model_confidence 0.95 (at or above MODEL_CONFIDENCE_FLOOR 0.80, so no inflation): base_risk_points 15, adjusted_risk_points 15.00, assigned_tier MEDIUM_RISK."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/odds" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "MODEL", category_codes: ["GAMBLING"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_id: $.data.id, mfa_before: $.data.mfa_score }
          trigger:
            - call: "POST /page-classifications/${cls_id}/review"
              payload: { decision: "OVERRIDE", revised_category_codes: ["ARMS", "GAMBLING"], review_note: "Sportsbook page also promotes firearms merchandise" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
          assert:
            - "Before the trigger: PageClassification.${cls_id}.base_risk_points == 15, adjusted_risk_points == 15.00, assigned_tier == MEDIUM_RISK, review_state == PENDING_REVIEW; Page.${page_id}.classification_state == MODEL_CLASSIFIED, current_tier == MEDIUM_RISK, version == 2"
            - "HTTP 200; PageClassification.${cls_id}.review_state == OVERRIDDEN and reviewed_by_user_id == analyst-2 and review_note is stored"
            - "PageClassification.${cls_id}.category_codes == [ARMS, GAMBLING] (replaced, not appended alongside the original)"
            - "PageClassification.${cls_id}.base_risk_points == 55 (ARMS 40 + GAMBLING 15) and adjusted_risk_points == 55.00 - no CONFIDENCE_INFLATION even though the record was authored as MODEL with confidence 0.95, because an overridden record is re-scored as HUMAN"
            - "PageClassification.${cls_id}.assigned_tier == HIGH_RISK (55.00 is at or above the HIGH_RISK cut of 40 and below the FLOOR cut of 100)"
            - "PageClassification.${cls_id}.mfa_score == ${mfa_before} and mfa_flag == false (the MFA signals were not part of the override)"
            - "Page.${page_id}.classification_state == HUMAN_CONFIRMED, current_tier == HIGH_RISK, latest_category_codes == [ARMS, GAMBLING], current_classification_id == ${cls_id}, version == 3"
            - "Publisher.${pub_id}.mfa_page_count == 0 (unchanged)"

      - name: mfa_restriction_lifts_only_after_reclassification_then_list_and_segment_recover
        claim_type: cyclic
        grounds:
          - state_machines.Publisher.ACTIVE_to_RESTRICTED
          - state_machines.Publisher.RESTRICTED_to_ACTIVE
          - state_machines.Page.RECLASSIFIED_to_MODEL_CLASSIFIED
          - state_machines.InventoryList.PUBLISHED_to_STALE
          - state_machines.PreBidSegment.SYNCED_to_STALE
          - errors[ERR_RESTRICTION_STILL_JUSTIFIED]
        distinguishing_aspect: |
          This is the only route back out of RESTRICTED, and it only exists on
          the MFA counter: quarantined_batch_count never decrements, but
          mfa_page_count does when a reclassification flips mfa_flag true ->
          false. Reinstatement attempted before that flip must be refused with
          ERR_RESTRICTION_STILL_JUSTIFIED, and after reinstatement the STALE
