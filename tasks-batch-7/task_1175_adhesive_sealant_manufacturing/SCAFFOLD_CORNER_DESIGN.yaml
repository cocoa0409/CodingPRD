  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_on_404
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Every error body conforms to the fixed envelope: meta.api_request_id present, response_type == error, data.error_id and data.message present."
        test_recipe:
          setup: ["empty database (clock initialized)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/formulations/00000000-0000-4000-8000-000000000000", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "http 404; body has meta.api_request_id (non-empty string) and meta.api_request_timestamp"
            - "response_type == error; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string"

