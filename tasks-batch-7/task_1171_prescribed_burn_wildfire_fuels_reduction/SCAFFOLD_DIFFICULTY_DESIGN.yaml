      - name: airshed_aggregate_capacity_rejects_overflow
        grounds:
          - calculations.airshed_daily_capacity
          - state_machines.SmokeApproval.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Third interval semantic: aggregate daily capacity (not pairwise geometry). A
          CONDITIONALLY_APPROVED 300-acre approval consumes the same capacity; a 201-acre
          request takes the total to 501 > 500 and is rejected.
        test_recipe:
          setup:
            - "Two approved plans on two parcels in ASH-1; smokeA (300 acres, 2026-05-12) CONDITIONALLY_APPROVED"
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
