            - { call: "POST /hotline/interpreters", payload: { display_name: "Interp FR", language_code: "fr" }, as: AgencyAdmin, captures: { interp: $.data.id } }
            - { call: "POST /hotline/callers", payload: { alias: "caller-a", phone: "+15550010", preferred_language: "fr", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { calA: $.data.id } }
            - { call: "POST /hotline/callers", payload: { alias: "caller-b", phone: "+15550011", preferred_language: "es", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { calB: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${calA}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sessA: $.data.id } }
            - { call: "POST /hotline/sessions/${sessA}/interpretation", payload: { to_status: "REQUESTED", interpreter_id: "${interp}", scheduled_start_at: "2026-08-02T10:00:00Z", scheduled_end_at: "2026-08-02T11:00:00Z" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${calB}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sessB: $.data.id } }
          trigger:
            - { call: "POST /hotline/sessions/${sessB}/interpretation", payload: { to_status: "REQUESTED", interpreter_id: "${interp}", scheduled_start_at: "2026-08-02T10:30:00Z", scheduled_end_at: "2026-08-02T11:30:00Z" }, as: Counselor, as_user_id: "${wk}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INTERPRETER_LANGUAGE_MISMATCH (fr interpreter for es caller — safety rule at priority 9)"
            - "NOT ERR_INTERPRETER_OVERLAP even though 10:30 < 11:00 + 10min buffer makes the windows conflict (constraint rule at priority 12 loses)"

  - rule_id: boundary_precision_check
