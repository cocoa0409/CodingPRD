          trigger:
            - call: "POST /tickets"
              payload: { event_id: "${ev1_id}", access_zone_id: "${z2_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { err_cross: $.data.error_id }
            - call: "POST /tickets"
              payload: { event_id: "${ev1_id}", access_zone_id: "${z1_id}", holder_patron_id: "00000000-0000-0000-0000-0000000000ff", ticket_type: "PAID", face_value_cents: 12000 }
