    path: "/accreditation/interim-reports/{id}/accept"
    description: "Accept a submitted report"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: InterimReport
    side_effects: ["Report SUBMITTED|LATE->ACCEPTED; LATE acceptance debits LATE_REPORT_PENALTY_CENTS from system.fee_credit_cents; increments InterimReport.version by 1 (and InstitutionSystem.version by 1 when penalty applied)"]

  - method: POST
    path: "/accreditation/interim-reports/{id}/return"
    description: "Return a submitted report for rework"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: InterimReport
    side_effects: ["Report SUBMITTED->RETURNED; increments InterimReport.version by 1"]

  # --- FeeSchedule ---
  - method: POST
    path: "/accreditation/fee-schedules"
    description: "Create a fee schedule"
    roles: [AccreditationOfficer]
    code: 201
    input: [effective_from, base_system_fee_cents, per_campus_fee_cents, large_campus_fee_cents, large_campus_threshold, visit_day_rate_cents]
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/accreditation/fee-schedules"
    description: "List fee schedules"
    roles: [AccreditationOfficer, SystemBursar]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []

  # --- Invoice / Payment ---
  - method: POST
    path: "/accreditation/systems/{id}/invoices"
    description: "Issue an invoice (amount computed per fee schedule)"
    roles: [SystemBursar]
    code: 201
    input: [billing_year, invoice_type]
    output: Invoice
    side_effects: ["amount_cents computed per annual_fee_invoice_amount or visit_fee_invoice_amount; status=ISSUED; issued_at=now; may decrement system.fee_credit_cents when credit applied (increments InstitutionSystem.version by 1 in that case)"]

  - method: GET
    path: "/accreditation/systems/{id}/invoices"
    description: "List invoices of a system"
    roles: [AccreditationOfficer, SystemBursar]
    code: 200
    input: ["status?", "invoice_type?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/accreditation/invoices/{id}"
    description: "Get an invoice"
    roles: [AccreditationOfficer, SystemBursar]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/accreditation/invoices/{id}/payments"
    description: "Post a payment against an invoice (OCC-guarded)"
    roles: [SystemBursar]
    code: 201
    input: [amount_cents, paid_at, expected_invoice_version]
    output: Payment
    side_effects: ["Invoice ISSUED->PARTIALLY_PAID|PAID or PARTIALLY_PAID->PAID; increments Invoice.version by 1"]

  - method: GET
    path: "/accreditation/invoices/{id}/payments"
    description: "List payments of an invoice"
    roles: [AccreditationOfficer, SystemBursar]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/accreditation/invoices/{id}/void"
    description: "Void an unpaid invoice"
    roles: [SystemBursar]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice ISSUED->VOID; increments Invoice.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role is not permitted for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource id does not exist or is out of scope of its parent"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource state does not permit the requested transition"

  - id: ERR_STALE_TERM_VERSION
    http: 412
    condition: "expected_term_version does not match the AccreditationTerm's current version"

  - id: ERR_STALE_GOAL_VERSION
    http: 412
    condition: "expected_goal_version does not match the ImprovementGoal's current version"

  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not match the Invoice's current version"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Actor is the same individual who performed the upstream step (evidence review of own submission, conflicted reviewer assignment)"

  - id: ERR_TEMPORAL_WINDOW_VIOLATION
    http: 422
    condition: "Operation falls outside its allowed time window (survey response outside OPEN window, overlapping visit dates, late verify/waive)"

  - id: ERR_REFERENTIAL_INTEGRITY
    http: 422
    condition: "Referenced entity does not belong to the required scope (campus not in system, reviewer not AVAILABLE, cross-system FK)"

  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Uniqueness constraint violated (second ACTIVE term, duplicate rating per term-campus-standard, duplicate survey window per term-campus-instrument, duplicate interim report per term-year, duplicate respondent token)"

  - id: ERR_THRESHOLD_NOT_MET
    http: 422
    condition: "A quorum/threshold precondition failed (evidence below min_items, attainment < 100, direction inconsistent with baseline/target)"

  - id: ERR_FISCAL_VIOLATION
    http: 422
    condition: "Fiscal rule violated (renewal close before renewal fee PAID, overpayment, missing fee schedule, SINGLE_SCHOOL second campus)"

  - id: ERR_VALIDATION
    http: 400
    condition: "Schema-level validation failure (missing required field, enum out of range, enrollment < 1, rating outside 1..4, closes_at <= opens_at)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccreditationOfficer
    description: "Staff member of the accrediting body; administers terms, campuses, standards, evidence review, visit scheduling, and reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/systems"
      - "POST /accreditation/systems/{id}/campuses"
      - "POST /accreditation/campuses/{id}/scope-out|scope-in|withdraw"
      - "POST /accreditation/standards"
      - "POST /accreditation/systems/{id}/terms"
      - "POST /accreditation/terms/{id}/advance|close"
      - "POST /accreditation/ratings/{id}/finalize|reopen"
      - "POST /accreditation/evidence/{id}/review"
      - "POST /accreditation/survey-instruments"
      - "POST /accreditation/terms/{id}/survey-windows"
      - "POST /accreditation/survey-windows/{id}/close|invalidate"
      - "POST /accreditation/goals/{id}/adopt|mark-achieved|abandon"
      - "POST /accreditation/reviewers"
      - "POST /accreditation/reviewers/{id}/deactivate"
      - "POST /accreditation/terms/{id}/visits"
      - "POST /accreditation/visits/{id}/assignments|confirm|cancel"
      - "POST /accreditation/interim-reports/{id}/accept|return"
      - "POST /accreditation/fee-schedules"
      - "POST /accreditation/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (read access shared with Commission, SchoolLeader, Reviewer as listed per endpoint)"

  - name: AccreditationCommission
    description: "Decision-making body; renders accreditation decisions and waives action items"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/terms/{id}/decide"
      - "POST /accreditation/action-items/{id}/waive"
    shared_operations:
      - "GET endpoints as listed"

  - name: SchoolLeader
    description: "Leader of a member school/system; performs self-study, evidence submission, survey response tracking, goal progress, action-item responses, interim reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/ratings"
      - "POST /accreditation/ratings/{id}/submit"
      - "POST /accreditation/ratings/{id}/evidence"
      - "POST /accreditation/evidence/{id}/resubmit"
      - "POST /accreditation/terms/{id}/goals"
      - "POST /accreditation/goals/{id}/indicators"
      - "POST /accreditation/action-items/{id}/submit-evidence"
      - "POST /accreditation/terms/{id}/interim-reports"
      - "POST /accreditation/interim-reports/{id}/submit"
    shared_operations:
      - "GET endpoints as listed"

  - name: Reviewer
    description: "Peer reviewer serving on visiting teams; drafts and issues findings, verifies action items, issues visit reports"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /accreditation/visits/{id}/findings"
      - "POST /accreditation/findings/{id}/issue|supersede"
      - "POST /accreditation/visits/{id}/issue-report"
      - "POST /accreditation/action-items/{id}/verify|return"
    shared_operations:
      - "GET endpoints as listed"

  - name: SystemBursar
    description: "Finance officer of the accrediting body; issues invoices and posts payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/systems/{id}/invoices"
      - "POST /accreditation/invoices/{id}/payments"
      - "POST /accreditation/invoices/{id}/void"
    shared_operations:
      - "GET /accreditation/systems/{id}, GET /accreditation/systems/{id}/invoices, GET /accreditation/invoices/{id}, GET /accreditation/invoices/{id}/payments, GET /accreditation/fee-schedules"

  - name: Anonymous
    description: "Unauthenticated survey respondent identified only by a one-time token"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/survey-windows/{id}/responses"
    shared_operations: []
