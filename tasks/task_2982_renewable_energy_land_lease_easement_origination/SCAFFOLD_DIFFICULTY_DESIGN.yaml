          setup:
            - "One Landowner 'Ridgeline Solar Land Co' with w9_on_file true and payment_hold false."
            - "SetbackRule rows: three for jurisdiction_code 48453 (rates 0.06, 0.10, 0.04), one for 48491 (rate 0.0500), and none at all for 48451."
            - "Parcel P_below in county 48491 with gross_acres 105.25 and slope 3.0: buildable_acres 99.99, QUALIFIED."
            - "Parcel P_at in county 48453 with gross_acres 125.00 and slope 4.0: buildable_acres 100.00, QUALIFIED."
            - "Parcel P_above in county 48451 with gross_acres 106.00 and slope 4.0: no setback rules match, so raw_setback_acres 0.00 and buildable_acres 106.00, QUALIFIED."
            - "One OptionAgreement per parcel, each sent, accepted and executed by pm-user-01, all three sitting in EXECUTED with option_term_days 365 so none is expired."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Ridgeline Solar Land Co", entity_type: "LLC", mailing_state: "TX", contact_email: "acq@ridgeline.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l5_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.06, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "OCCUPIED_DWELLING", setback_feet: 500, encumbrance_rate_per_acre: 0.10, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PUBLIC_ROAD", setback_feet: 100, encumbrance_rate_per_acre: 0.04, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48491", rule_type: "PROPERTY_LINE", setback_feet: 130, encumbrance_rate_per_acre: 0.0500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-2491-770", county_fips: "48491", landowner_id: "${l5_id}", gross_acres: 105.25, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 3.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
