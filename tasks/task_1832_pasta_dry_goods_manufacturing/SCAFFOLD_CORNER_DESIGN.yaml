# =============================================================================
# Task 1832 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# Chains replayed against SCAFFOLD.yaml §1.2/§1.4/§1.5. Clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ============================================================ 1. Entities
  - section: entities
    instances:
      - name: contract_creation_applies_system_defaults
        claim_type: creation
        grounds: [entities.IngredientContract]
        distinguishing_aspect: "A contract created with only the eight required inputs starts DRAFT with cumulative_delivered_kg 0, version 1, and server-stamped id/created_at taken from the logical clock default."
        test_recipe:
          setup: ["empty DB; clock never set (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-DEF", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
          assert:
            - "IngredientContract.${c_id}.status == DRAFT"
            - "IngredientContract.${c_id}.cumulative_delivered_kg == 0"
            - "IngredientContract.${c_id}.version == 1"
            - "IngredientContract.${c_id}.created_at == 2026-08-01T00:00:00Z (logical clock default stamps server fields)"

      - name: recipe_private_label_conditional_field_rules
        claim_type: required_fields
        grounds: [entities.Recipe.fields.customer_name, entities.Recipe.fields.min_remaining_shelf_life_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "PRIVATE_LABEL recipes require customer_name and min_remaining_shelf_life_pct; BRANDED recipes forbid customer_name — three violations, one acceptance."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /recipes"
              payload: { recipe_name: "PL Missing Customer", brand_type: "PRIVATE_LABEL", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, min_remaining_shelf_life_pct: 0.75, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { e1: $.data.error_id }
            - call: "POST /recipes"
              payload: { recipe_name: "PL Missing Shelf Min", brand_type: "PRIVATE_LABEL", customer_name: "Acme Retail", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { e2: $.data.error_id }
            - call: "POST /recipes"
              payload: { recipe_name: "Branded With Customer", brand_type: "BRANDED", customer_name: "Acme Retail", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { e3: $.data.error_id }
            - call: "POST /recipes"
              payload: { recipe_name: "PL Valid", brand_type: "PRIVATE_LABEL", customer_name: "Acme Retail", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, min_remaining_shelf_life_pct: 0.75, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r_ok: $.data.id }
          assert:
            - "e1 == ERR_INVALID_REQUEST (PRIVATE_LABEL without customer_name)"
            - "e2 == ERR_INVALID_REQUEST (PRIVATE_LABEL without min_remaining_shelf_life_pct)"
            - "e3 == ERR_INVALID_REQUEST (BRANDED with customer_name)"
            - "Recipe.${r_ok} created 201 with status DRAFT"

      - name: recipe_ingredients_created_as_junction_rows
        claim_type: creation
        grounds: [entities.RecipeIngredient, endpoints]
        distinguishing_aspect: "The embedded ingredients array on POST /recipes materializes RecipeIngredient junction rows retrievable via the reverse-reachability GET."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { recipe_name: "Blend 80/20", brand_type: "BRANDED", shape_family: "SHORT_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 80.0, min_protein_pct: 12.5 }, { ingredient_type: "DURUM_SEMOLINA", percentage: 20.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "GET /recipes/${r_id}/ingredients"
              as: PlantManager
          assert:
            - "GET returns 2 RecipeIngredient rows"
            - "Row 1: ingredient_type SEMOLINA, percentage 80.0, min_protein_pct 12.5"
            - "Row 2: ingredient_type DURUM_SEMOLINA, percentage 20.0, min_protein_pct null"
            - "Each row carries recipe_id == ${r_id}"

      - name: gluten_test_polymorphic_subject_constraints
        claim_type: type_constraints
        grounds: [entities.GlutenTest.fields.test_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "LINE_SWAB requires line_id and forbids run_id; PRODUCT_TEST requires run_id and forbids line_id — the polymorphic subject is validated per test_type."
        test_recipe:
          setup: ["line L-POLY and one SCHEDULED run exist"]
          setup_api_calls:
            - call: "POST /production-lines"
              payload: { line_name: "L-POLY" }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-POLY", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /recipes"
              payload: { recipe_name: "Penne POLY", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r_id: $.data.id }
            - call: "POST /recipes/${r_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { line_v: $.data.version }
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 100.0, scheduled_start: "2026-08-10T00:00:00Z", scheduled_end: "2026-08-11T00:00:00Z", expected_line_version: "${line_v}" }
              as: ProductionOperator
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /gluten-tests"
              payload: { test_type: "LINE_SWAB", line_id: "${line_id}", run_id: "${run_id}", result: "PASS" }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { e1: $.data.error_id }
            - call: "POST /gluten-tests"
              payload: { test_type: "PRODUCT_TEST", result: "PASS" }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { e2: $.data.error_id }
            - call: "POST /gluten-tests"
              payload: { test_type: "LINE_SWAB", line_id: "${line_id}", result: "PASS" }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t_ok: $.data.id }
          assert:
            - "e1 == ERR_INVALID_REQUEST (LINE_SWAB with run_id set)"
            - "e2 == ERR_INVALID_REQUEST (PRODUCT_TEST without run_id)"
            - "GlutenTest.${t_ok} created 201 with status RECORDED, recorded_by_user_id == tech-1"

      - name: price_index_reading_append_only_unique_per_date
        claim_type: immutability
        grounds: [entities.PriceIndexReading, "errors[ERR_DUPLICATE_INDEX_READING]"]
        distinguishing_aspect: "PriceIndexReading has common_fields: false — no version/updated_at — and a second reading for the same (contract, effective_date) is rejected as a duplicate."
        test_recipe:
          setup: ["ACTIVE contract C-IMM"]
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-IMM", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /ingredient-contracts/${c_id}/index-readings"
              payload: { effective_date: "2026-08-01", index_value: 110.0 }
              as: ProcurementManager
              captures: { r1: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/index-readings"
              payload: { effective_date: "2026-08-01", index_value: 111.0 }
              as: ProcurementManager
              captures: { dup_err: $.data.error_id }
            - call: "GET /ingredient-contracts/${c_id}/index-readings"
              as: ProcurementManager
          assert:
            - "First reading created 201; response has id and created_at but NO version field (common_fields false)"
            - "dup_err == ERR_DUPLICATE_INDEX_READING (http 409)"
            - "List returns exactly 1 reading for 2026-08-01 with index_value 110.0"

      - name: resource_not_found_per_entity
        claim_type: not_found
        grounds: ["errors[ERR_RECIPE_NOT_FOUND]", "errors[ERR_RUN_NOT_FOUND]", "errors[ERR_ZONE_NOT_FOUND]", "errors[ERR_GOODS_LOT_NOT_FOUND]", "errors[ERR_CONTRACT_NOT_FOUND]", "errors[ERR_LOT_NOT_FOUND]", "errors[ERR_LINE_NOT_FOUND]", "errors[ERR_DIE_NOT_FOUND]", "errors[ERR_DRYING_SESSION_NOT_FOUND]", "errors[ERR_PACKAGING_JOB_NOT_FOUND]", "errors[ERR_INSPECTION_NOT_FOUND]", "errors[ERR_GLUTEN_TEST_NOT_FOUND]"]
        distinguishing_aspect: "Every path-addressed resource family returns its own domain 404 error for a well-formed but absent UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /recipes/11111111-1111-4111-8111-111111111111"
              as: PlantManager
              captures: { e1: $.data.error_id }
            - call: "GET /production-runs/22222222-2222-4222-8222-222222222222"
              as: PlantManager
              captures: { e2: $.data.error_id }
            - call: "GET /warehouse-zones/33333333-3333-4333-8333-333333333333"
              as: PlantManager
              captures: { e3: $.data.error_id }
            - call: "GET /finished-goods-lots/44444444-4444-4444-8444-444444444444"
              as: PlantManager
              captures: { e4: $.data.error_id }
            - call: "GET /ingredient-contracts/55555555-5555-4555-8555-555555555555"
              as: PlantManager
              captures: { e5: $.data.error_id }
            - call: "GET /semolina-lots/66666666-6666-4666-8666-666666666666"
              as: PlantManager
              captures: { e6: $.data.error_id }
            - call: "GET /production-lines/77777777-7777-4777-8777-777777777777"
              as: PlantManager
              captures: { e7: $.data.error_id }
            - call: "GET /extrusion-dies/88888888-8888-4888-8888-888888888888"
              as: PlantManager
              captures: { e8: $.data.error_id }
            - call: "GET /drying-sessions/99999999-9999-4999-8999-999999999999"
              as: PlantManager
              captures: { e9: $.data.error_id }
            - call: "GET /packaging-jobs/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              as: PlantManager
              captures: { e10: $.data.error_id }
            - call: "GET /pest-inspections/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              as: PlantManager
              captures: { e11: $.data.error_id }
            - call: "GET /gluten-tests/cccccccc-cccc-4ccc-8ccc-cccccccccccc"
              as: PlantManager
              captures: { e12: $.data.error_id }
          assert:
            - "e1 == ERR_RECIPE_NOT_FOUND (404)"
            - "e2 == ERR_RUN_NOT_FOUND (404)"
            - "e3 == ERR_ZONE_NOT_FOUND (404)"
            - "e4 == ERR_GOODS_LOT_NOT_FOUND (404)"
            - "e5 == ERR_CONTRACT_NOT_FOUND (404)"
            - "e6 == ERR_LOT_NOT_FOUND (404)"
            - "e7 == ERR_LINE_NOT_FOUND (404)"
            - "e8 == ERR_DIE_NOT_FOUND (404)"
            - "e9 == ERR_DRYING_SESSION_NOT_FOUND (404)"
            - "e10 == ERR_PACKAGING_JOB_NOT_FOUND (404)"
            - "e11 == ERR_INSPECTION_NOT_FOUND (404)"
            - "e12 == ERR_GLUTEN_TEST_NOT_FOUND (404)"

      - name: lot_receipt_computed_fields_and_defaults
        claim_type: computed_fields
        grounds: [entities.SemolinaLot.fields.unit_price_cents, entities.SemolinaLot.fields.remaining_weight_kg, calculations.contract_settlement_price]
        distinguishing_aspect: "Receipt with no index readings prices at ratio 1.0000: unit 500c/kg, total 50000c for 100 kg; remaining initializes to received and consumed to 0; status QUARANTINED."
        test_recipe:
          setup: ["ACTIVE contract C-CMP (base 500, ref 100.0, INDEX_LAGGED, no readings)"]
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-CMP", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
          assert:
            - "SemolinaLot.${lot_id}.unit_price_cents == 500 (ratio fallback 1.0000, tier 1)"
            - "SemolinaLot.${lot_id}.total_price_cents == 50000"
            - "SemolinaLot.${lot_id}.remaining_weight_kg == 100.0 AND consumed_kg == 0"
            - "SemolinaLot.${lot_id}.status == QUARANTINED AND lab_grade_score IS NULL"

      - name: recipes_listing_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List pagination honors limit/offset with total_count and has_more: 3 recipes, limit 2 -> 2 items + has_more true; offset 2 -> 1 item + has_more false."
        test_recipe:
          setup: ["three DRAFT recipes exist"]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { recipe_name: "PG A", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
            - call: "POST /recipes"
              payload: { recipe_name: "PG B", brand_type: "BRANDED", shape_family: "SHORT_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
            - call: "POST /recipes"
              payload: { recipe_name: "PG C", brand_type: "BRANDED", shape_family: "SPECIALTY", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
          trigger:
            - call: "GET /recipes"
              payload: { limit: 2, offset: 0 }
              as: PlantManager
            - call: "GET /recipes"
              payload: { limit: 2, offset: 2 }
              as: PlantManager
          assert:
            - "Page 1: response_type == array, 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"

  # ============================================================ 2. State Machines
  - section: state_machines
    instances:
      - name: contract_terminal_lockout
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IngredientContract.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: activate and close on a CLOSED contract both fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE contract C-TL"]
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-TL", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /ingredient-contracts/${c_id}/close"
              payload: {}
              as: ProcurementManager
          trigger:
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
              captures: { e1: $.data.error_id }
            - call: "POST /ingredient-contracts/${c_id}/close"
              payload: {}
              as: ProcurementManager
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_INVALID_STATE (CLOSED is terminal)"
            - "e2 == ERR_INVALID_STATE"

      - name: lot_accept_state_and_lab_preconditions
        claim_type: invalid_transition
        grounds: [state_machines.SemolinaLot.transitions, "errors[ERR_INVALID_REQUEST]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accept requires QUARANTINED plus recorded lab values: fresh lot without labs -> ERR_INVALID_REQUEST; double accept -> ERR_INVALID_STATE; reject of an ACCEPTED lot -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE contract; lot L1 fresh (no labs); lot L2 ACCEPTED"]
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-LST", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { l1: $.data.id }
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { l2: $.data.id }
            - call: "POST /semolina-lots/${l2}/lab-results"
              payload: { lab_protein_pct: 13.8, lab_moisture_pct: 13.0, lab_gluten_index: 88, lab_falling_number_s: 340 }
              as: QATechnician
              as_user_id: "tech-1"
            - call: "POST /semolina-lots/${l2}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
          trigger:
            - call: "POST /semolina-lots/${l1}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
              captures: { e1: $.data.error_id }
            - call: "POST /semolina-lots/${l2}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
              captures: { e2: $.data.error_id }
            - call: "POST /semolina-lots/${l2}/reject"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_INVALID_REQUEST (no lab results recorded)"
            - "e2 == ERR_INVALID_STATE (lot not QUARANTINED)"
            - "e3 == ERR_INVALID_STATE (reject only from QUARANTINED; retest loop required first)"

      - name: recipe_retire_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Recipe.APPROVED_to_RETIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "retire exists only from APPROVED; a DRAFT recipe rejects it."
        test_recipe:
          setup: ["DRAFT recipe"]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { recipe_name: "Draft Only", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
