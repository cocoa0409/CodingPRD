# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Electrical Contractor Service & Dispatch — Expert tier
# 9 Difficulty Rules x 2 instances = 18 instances
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# All formula-derived asserts pre-computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: forward-looking Estimate quote vs chronological Invoice actuals
      - name: dual_variant_quote_estimate_vs_invoice_actual
        grounds:
          - calculations.estimate_quoted_total
          - calculations.invoice_total
          - entities.Estimate.fields.quoted_total_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          estimate_quoted_total is forward_looking on the Estimate entity domain (uses
          estimated_labor_hours and a DEFAULT_HOURLY_RATE_CENTS projection), while
          invoice_total is chronological on the Invoice/ServiceJob domain (uses
          actual_labor_hours and realized non-voided MaterialUsage rows); identical job,
          two different subjects yield different numbers (40500 vs 36148).
        test_recipe:
          setup:
            - "One customer, one MASTER technician in zone '100' with hourly_rate_cents=12000 (matches invoice rate)."
            - "A SERVICE/OUTLET job in DRAFT for that customer; no membership."
            - "A TIME_MATERIALS estimate quoted with estimated_labor_hours=3, estimated_material_cents=4500, no technician dispatched at quote time so quote uses DEFAULT_HOURLY_RATE_CENTS=12000."
            - "One MaterialSku unit_price_cents=1000 taxable; technician truck stocked with 5 of it."
            - "Estimate sent and accepted; technician dispatched, departs, arrives; one MaterialUsage of quantity 3; job completed with actual_labor_hours=2, then invoiced."
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "Q Cust", email: "dv1@x.com", service_zip: "10001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "Master T", license_class: "MASTER", service_zone: "100", hourly_rate_cents: 12000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/material-skus"
              payload: { sku_code: "DV1-SKU", description: "Wire", unit_price_cents: 1000, taxable: true }
              as: Dispatcher
              captures: { sku_id: $.data.id }
            - call: "POST /v1/truck-stock-items"
              payload: { technician_id: "${tech_id}", sku_id: "${sku_id}", quantity_on_hand: 5, reorder_threshold: 0 }
              as: Dispatcher
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "TIME_MATERIALS", expected_job_version: "${job_v0}", estimated_labor_hours: 3, estimated_material_cents: 4500 }
              as: Dispatcher
              captures: { est_id: $.data.id, quote: $.data.quoted_total_cents, job_v1: $.data.version }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_v2: $.data.version }
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_v_after_accept: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-01T09:00:00Z", window_end: "2026-07-01T11:00:00Z", expected_job_version: "${job_v_after_accept}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/material-usages"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", sku_id: "${sku_id}", quantity: 3 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: { actual_labor_hours: 2 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /v1/service-jobs/${job_id}/invoice"
              payload: {}
              as: Dispatcher
              captures: { total_due: $.data.total_due_cents }
          assert:
            - "Estimate.${est_id}.quoted_total_cents == 40500"   # rhu(3*12000)+4500
            - "ServiceJob.${job_id}.total_due_cents == 36148"     # 24000 + 3000 + 8900 + 248 tax
            - "Estimate.${est_id}.quoted_total_cents != ServiceJob.${job_id}.total_due_cents"

      # ---- Instance 2: member vs nonmember billing variant on Invoice
      - name: dual_variant_member_vs_nonmember_invoice
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.discount_cents
          - entities.Invoice.fields.dispatch_fee_cents
          - entities.MembershipPlan.fields.labor_discount_pct
        distinguishing_aspect: |
          invoice_total's member_billing variant subtracts a labor discount and (per plan flag)
          waives the dispatch fee, while nonmember_billing applies neither; two structurally
          identical FLAT_RATE jobs differ only by membership and produce different total_cents
          (member 32500 vs nonmember 41730).
        test_recipe:
          setup:
            - "PREMIER plan: labor_discount_pct=0.20, waives_dispatch_fee=true."
            - "Member customer enrolled in PREMIER; non-member customer with no membership."
            - "Each owns a FLAT_RATE OUTLET SERVICE job, STANDARD priority, flat_rate_cents=40000, no materials."
            - "Both jobs estimate-accepted, dispatched, worked, completed, invoiced."
          setup_api_calls:
            - call: "POST /v1/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 2999, labor_discount_pct: 0.20, waives_dispatch_fee: true, priority_dispatch: true }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Mem Cust", email: "dv2m@x.com", service_zip: "20001", phone: "555" }
              as: Dispatcher
              captures: { mem_cust_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { customer_id: "${mem_cust_id}", plan_id: "${plan_id}" }
              as: Dispatcher
            - call: "POST /v1/customers"
              payload: { full_name: "Non Cust", email: "dv2n@x.com", service_zip: "20002", phone: "555" }
              as: Dispatcher
              captures: { non_cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "Z Tech", license_class: "JOURNEYMAN", service_zone: "200", hourly_rate_cents: 11000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${mem_cust_id}", scope: "OUTLET", job_class: "SERVICE", priority: "STANDARD" }
              as: Dispatcher
              captures: { mjob_id: $.data.id, mjob_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${mjob_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${mjob_v0}", flat_rate_cents: 40000 }
              as: Dispatcher
              captures: { mest_id: $.data.id }
            - call: "POST /v1/estimates/${mest_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${mest_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${mem_cust_id}"
              captures: { mjob_v2: $.data.version }
            - call: "GET /v1/service-jobs/${mjob_id}"
              payload: {}
              as: Dispatcher
              captures: { mjob_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${mjob_id}", technician_id: "${tech_id}", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T10:00:00Z", expected_job_version: "${mjob_vacc}" }
              as: Dispatcher
              captures: { mdisp_id: $.data.id }
            - call: "POST /v1/dispatches/${mdisp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${mdisp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${mjob_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${mjob_id}/invoice"
              payload: {}
              as: Dispatcher
              captures: { mtotal: $.data.total_due_cents }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${non_cust_id}", scope: "OUTLET", job_class: "SERVICE", priority: "STANDARD" }
              as: Dispatcher
              captures: { njob_id: $.data.id, njob_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${njob_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${njob_v0}", flat_rate_cents: 40000 }
              as: Dispatcher
              captures: { nest_id: $.data.id }
            - call: "POST /v1/estimates/${nest_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${nest_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${non_cust_id}"
            - call: "GET /v1/service-jobs/${njob_id}"
              payload: {}
              as: Dispatcher
              captures: { njob_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${njob_id}", technician_id: "${tech_id}", window_start: "2026-07-02T11:00:00Z", window_end: "2026-07-02T12:00:00Z", expected_job_version: "${njob_vacc}" }
              as: Dispatcher
              captures: { ndisp_id: $.data.id }
            - call: "POST /v1/dispatches/${ndisp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${ndisp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${njob_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /v1/service-jobs/${njob_id}/invoice"
              payload: {}
              as: Dispatcher
              captures: { ntotal: $.data.total_due_cents }
          assert:
            # member: labor 40000 - disc rhu(40000*0.20)=8000 + material 0 + dispatch 0 (waived) + emerg 0 + tax 0 = 32000
            - "ServiceJob.${mjob_id}.total_due_cents == 32000"
            # nonmember: labor 40000 - 0 + material 0 + dispatch 8900 + emerg 0 + tax 0 = 48900
            - "ServiceJob.${njob_id}.total_due_cents == 48900"
            - "ServiceJob.${mjob_id}.total_due_cents != ServiceJob.${njob_id}.total_due_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Mode (b): nested rounding where order matters — round-then-sum pinned
      - name: combinatorial_invoice_round_then_sum_half_up
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.discount_cents
          - entities.Invoice.fields.tax_cents
          - entities.MembershipPlan.fields.labor_discount_pct
        distinguishing_aspect: |
          Mode (b): invoice_total applies round_half_up INDEPENDENTLY at the discount step and
          the tax step (round-then-sum, NOT sum-then-round); discount rhu(32500*0.125)=4063 exposes
          the half-up boundary (4062.5 rounds UP to 4063), which a truncating or sum-then-round
          implementation gets wrong.
        test_recipe:
          setup:
            - "Plan labor_discount_pct=0.125, waives_dispatch_fee=true (isolate discount+tax)."
            - "Member customer; MASTER tech hourly_rate_cents=13000 in zone '300'."
            - "TIME_MATERIALS job, STANDARD; one taxable SKU unit_price_cents=1000 taxable, qty 4 (material 4000)."
            - "actual_labor_hours=2.5 supplied on complete -> labor rhu(2.5*13000)=32500."
          setup_api_calls:
            - call: "POST /v1/membership-plans"
              payload: { name: "Eighth", tier: "BASIC", monthly_fee_cents: 1000, labor_discount_pct: 0.125, waives_dispatch_fee: true, priority_dispatch: false }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Round Cust", email: "cf1@x.com", service_zip: "30001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}" }
              as: Dispatcher
            - call: "POST /v1/technicians"
              payload: { full_name: "M3 Tech", license_class: "MASTER", service_zone: "300", hourly_rate_cents: 13000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/material-skus"
              payload: { sku_code: "CF1-SKU", description: "Conduit", unit_price_cents: 1000, taxable: true }
              as: Dispatcher
              captures: { sku_id: $.data.id }
            - call: "POST /v1/truck-stock-items"
              payload: { technician_id: "${tech_id}", sku_id: "${sku_id}", quantity_on_hand: 10, reorder_threshold: 0 }
              as: Dispatcher
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "TIME_MATERIALS", expected_job_version: "${job_v0}", estimated_labor_hours: 2.5, estimated_material_cents: 4000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-03T09:00:00Z", window_end: "2026-07-03T12:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/material-usages"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", sku_id: "${sku_id}", quantity: 4 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: { actual_labor_hours: 2.5 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /v1/service-jobs/${job_id}/invoice"
              payload: {}
              as: Dispatcher
              captures: { inv_total: $.data.total_due_cents }
          assert:
            - "Invoice for ${job_id}: labor_subtotal_cents == 32500"   # rhu(2.5*13000)
            - "Invoice for ${job_id}: discount_cents == 4063"          # rhu(32500*0.125)=rhu(4062.5) half-up
            - "Invoice for ${job_id}: tax_cents == 330"                # rhu(4000*0.0825)=rhu(330.0)
            - "ServiceJob.${job_id}.total_due_cents == 32767"          # (32500-4063)+4000+0+0+330

      # ---- Mode (c): circular-looking dependency with pinned evaluation order
      - name: combinatorial_invoice_pinned_eval_order_discount_then_total
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.labor_subtotal_cents
          - entities.Invoice.fields.discount_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (c): invoice_total has a circular-looking dependency (discount_cents is keyed off
          labor_subtotal_cents at Step 5, then total_cents consumes the discount at Step 7); the
          scaffold pins the order so discount is computed from labor alone, never from the running
          total — with labor 20000, pct 0.10, material 1000 the discount is exactly 2000 (off labor),
          not a value derived from any partial total.
        test_recipe:
          setup:
            - "Plan labor_discount_pct=0.10, waives_dispatch_fee=true."
            - "Member customer; MASTER tech hourly_rate_cents=10000 zone '310'."
            - "TIME_MATERIALS job STANDARD; SKU unit_price_cents=1000 taxable, usage qty 1 (material 1000)."
            - "actual_labor_hours=2 -> labor 20000."
          setup_api_calls:
            - call: "POST /v1/membership-plans"
              payload: { name: "Tenth", tier: "BASIC", monthly_fee_cents: 1000, labor_discount_pct: 0.10, waives_dispatch_fee: true, priority_dispatch: false }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Order Cust", email: "cf2@x.com", service_zip: "31001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}" }
              as: Dispatcher
            - call: "POST /v1/technicians"
              payload: { full_name: "M31 Tech", license_class: "MASTER", service_zone: "310", hourly_rate_cents: 10000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/material-skus"
              payload: { sku_code: "CF2-SKU", description: "Box", unit_price_cents: 1000, taxable: true }
              as: Dispatcher
              captures: { sku_id: $.data.id }
            - call: "POST /v1/truck-stock-items"
              payload: { technician_id: "${tech_id}", sku_id: "${sku_id}", quantity_on_hand: 5, reorder_threshold: 0 }
              as: Dispatcher
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "TIME_MATERIALS", expected_job_version: "${job_v0}", estimated_labor_hours: 2, estimated_material_cents: 1000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-04T09:00:00Z", window_end: "2026-07-04T11:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/material-usages"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", sku_id: "${sku_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: { actual_labor_hours: 2 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /v1/service-jobs/${job_id}/invoice"
              payload: {}
              as: Dispatcher
              captures: { inv_total: $.data.total_due_cents }
          assert:
            - "Invoice for ${job_id}: labor_subtotal_cents == 20000"
            - "Invoice for ${job_id}: discount_cents == 2000"   # rhu(20000*0.10) — keyed off labor, not total
            - "Invoice for ${job_id}: tax_cents == 83"           # rhu(1000*0.0825)=rhu(82.5)
            - "ServiceJob.${job_id}.total_due_cents == 19083"    # (20000-2000)+1000+0+0+83

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- ServiceJob cyclic warranty loop (INVOICED -> WARRANTY -> IN_PROGRESS -> ...)
      - name: nonlinear_servicejob_warranty_cycle
        grounds:
          - state_machines.ServiceJob.INVOICED_to_WARRANTY
          - state_machines.ServiceJob.WARRANTY_to_IN_PROGRESS
          - state_machines.Dispatch.EN_ROUTE_to_ON_SITE
          - entities.ServiceJob.fields.status
        distinguishing_aspect: |
          ServiceJob has a cyclic shape: a warranty-covered Callback drives INVOICED -> WARRANTY,
          and a re-dispatch arrival drives WARRANTY -> IN_PROGRESS, re-entering the work cycle —
          a non-linear loop on the ServiceJob entity, distinct from the linear Permit pipeline.
        test_recipe:
          setup:
            - "Customer with an OUTLET SERVICE job carried fully to INVOICED with warranty_until in the future."
            - "Server clock set so the callback is filed within warranty_until (covered)."
            - "A fresh dispatch is created for the WARRANTY job and arrived to re-enter IN_PROGRESS."
          setup_api_calls:
            - call: "POST /v1/_clock/set"
              payload: { to_iso8601: "2026-07-05T08:00:00Z" }
              as: Dispatcher
            - call: "POST /v1/customers"
              payload: { full_name: "Warr Cust", email: "nl1@x.com", service_zip: "40001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "W Tech", license_class: "JOURNEYMAN", service_zone: "400", hourly_rate_cents: 10000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 10000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-05T09:00:00Z", window_end: "2026-07-05T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/invoice"
              payload: {}
              as: Dispatcher
              captures: { warr_until: $.data.warranty_until }
            - call: "POST /v1/callbacks"
              payload: { job_id: "${job_id}", reason: "intermittent fault" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cb_id: $.data.id }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-06T09:00:00Z", window_end: "2026-07-06T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp2_id: $.data.id }
            - call: "POST /v1/dispatches/${disp2_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /v1/dispatches/${disp2_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { disp2_status: $.data.status }
          assert:
            - "After callback filed: ServiceJob.${job_id}.status == WARRANTY"
            - "Callback.${cb_id}.covered_by_warranty == true"
            - "After arrive: Dispatch.${disp2_id}.status == ON_SITE"
            - "After arrive: ServiceJob.${job_id}.status == IN_PROGRESS"   # WARRANTY -> IN_PROGRESS cyclic edge

      # ---- Permit cyclic FAILED -> INSPECTION_SCHEDULED re-inspection loop
      - name: nonlinear_permit_failed_reinspection_cycle
        grounds:
          - state_machines.Permit.INSPECTION_SCHEDULED_to_FAILED
          - state_machines.Permit.FAILED_to_INSPECTION_SCHEDULED
          - state_machines.Permit.INSPECTION_SCHEDULED_to_PASSED
          - entities.Permit.fields.status
        distinguishing_aspect: |
          Permit has a cycle on a DIFFERENT entity from ServiceJob: a FAILED inspection re-enters
          INSPECTION_SCHEDULED and can then be re-recorded to PASSED (FAILED -> INSPECTION_SCHEDULED
          -> PASSED), a revision loop the linear permit pipeline alone could not express.
        test_recipe:
          setup:
            - "A PANEL job exists (requires_permit=true) with a permit filed and ISSUED then INSPECTION_SCHEDULED."
            - "First inspection recorded FAIL; permit re-scheduled; second inspection recorded PASS."
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "Permit Cust", email: "nl2@x.com", service_zip: "41001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "PANEL", job_class: "INSTALL", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /v1/permits"
              payload: { job_id: "${job_id}", jurisdiction: "City", permit_number: "PN-1" }
              as: Dispatcher
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/issue"
              payload: {}
              as: Inspector
            - call: "POST /v1/permits/${permit_id}/schedule-inspection"
              payload: { inspection_at: "2026-07-07T09:00:00Z" }
              as: Dispatcher
            - call: "POST /v1/permits/${permit_id}/record-inspection"
              payload: { result: "FAIL" }
              as: Inspector
              captures: { failed_status: $.data.status }
            - call: "POST /v1/permits/${permit_id}/schedule-inspection"
              payload: { inspection_at: "2026-07-08T09:00:00Z" }
              as: Dispatcher
              captures: { resched_status: $.data.status }
          trigger:
            - call: "POST /v1/permits/${permit_id}/record-inspection"
              payload: { result: "PASS" }
              as: Inspector
              captures: { final_status: $.data.status }
          assert:
            - "After first record-inspection: Permit.${permit_id}.status == FAILED"
            - "After re-schedule: Permit.${permit_id}.status == INSPECTION_SCHEDULED"   # FAILED -> INSPECTION_SCHEDULED cyclic edge
            - "After second record-inspection: Permit.${permit_id}.status == PASSED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- Depth >=3: estimate accept -> job QUOTED + sibling SUPERSEDED chain
      - name: cascade_estimate_accept_supersede_chain_depth3
        grounds:
          - state_machines.Estimate.SENT_to_ACCEPTED
          - state_machines.Estimate.SENT_to_SUPERSEDED
          - state_machines.ServiceJob.DRAFT_to_QUOTED
          - entities.ServiceJob.fields.pricing_mode
        distinguishing_aspect: |
          Accepting one SENT estimate (action on Estimate A) sets A -> ACCEPTED, that acceptance
          itself supersedes sibling SENT estimate B (A's side-effect -> B mutated), and B's
          supersession is part of the same chain that bubbles the parent ServiceJob DRAFT -> QUOTED
          with pricing_mode copied — a 3-hop cascade (A.accept -> B.SUPERSEDED + job.QUOTED), each
          link caused by the prior, triggered by SENT_to_ACCEPTED.
        test_recipe:
          setup:
            - "One customer with a DRAFT OUTLET SERVICE job."
            - "Two estimates created and SENT on the same job: A (FLAT_RATE 30000), B (TIME_MATERIALS)."
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "Casc Cust", email: "tc1@x.com", service_zip: "50001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 30000 }
              as: Dispatcher
              captures: { estA_id: $.data.id, job_v1: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "TIME_MATERIALS", expected_job_version: "${job_v1}", estimated_labor_hours: 2, estimated_material_cents: 500 }
              as: Dispatcher
              captures: { estB_id: $.data.id }
            - call: "POST /v1/estimates/${estA_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${estB_id}/send"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /v1/estimates/${estA_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { estA_status: $.data.status }
          assert:
            - "Estimate.${estA_id}.status == ACCEPTED"
            - "Estimate.${estB_id}.status == SUPERSEDED"      # caused by A's acceptance
            - "ServiceJob.${job_id}.status == QUOTED"          # bubbled by the acceptance chain
            - "ServiceJob.${job_id}.pricing_mode == FLAT_RATE" # copied from accepted estimate A

      # ---- Depth >=2: job cancel from SCHEDULED -> dispatch CANCELLED + estimates SUPERSEDED
      - name: cascade_job_cancel_dispatch_and_estimates_depth2
        grounds:
          - state_machines.ServiceJob.SCHEDULED_to_CANCELLED
          - state_machines.Dispatch.ASSIGNED_to_CANCELLED
          - entities.Dispatch.fields.status
        distinguishing_aspect: |
          Cancelling a SCHEDULED job (action on ServiceJob) drives the job -> CANCELLED, and that
          cancellation cascades to its active Dispatch -> CANCELLED (freeing the technician window)
          — a 2-hop cascade originating from SCHEDULED_to_CANCELLED, a different triggering
          transition than the estimate-accept cascade.
        test_recipe:
          setup:
            - "A QUOTED job with one ASSIGNED dispatch (so job is SCHEDULED)."
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "Cancel Cust", email: "tc2@x.com", service_zip: "51001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "C Tech", license_class: "JOURNEYMAN", service_zone: "510", hourly_rate_cents: 10000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 12000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-09T09:00:00Z", window_end: "2026-07-09T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /v1/service-jobs/${job_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_status: $.data.status }
          assert:
            - "ServiceJob.${job_id}.status == CANCELLED"
            - "Dispatch.${disp_id}.status == CANCELLED"   # cascaded from job cancel

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- state (priority 7) vs business_safety (priority 8/12): which wins?
      - name: priority_conflict_invalid_state_beats_permit_safety
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PERMIT_NOT_PASSED]
        distinguishing_aspect: |
          A /complete on a PANEL job that is NOT IN_PROGRESS (already COMPLETED) AND whose permit
          is not PASSED violates both priority 7 (state, ERR_INVALID_STATE) and priority 12
          (business_safety permit gate, ERR_PERMIT_NOT_PASSED); lower priority number wins, so
          ERR_INVALID_STATE (state vs business_safety pair) is returned.
        test_recipe:
          setup:
            - "A PANEL job already in COMPLETED state with no PASSED permit (permit still APPLIED)."
            - "To reach COMPLETED on a permit job we first PASS the permit, complete, then file a SECOND job — simpler: build a non-permit OUTLET job to COMPLETED, then attempt /complete again while also it would (if it were a panel) need permit. Use the PANEL job that was completed via passed permit, then revert is impossible — instead use state precedence directly: a PANEL job in COMPLETED whose (new) permit is FAILED."
            - "Concretely: PANEL job carried to COMPLETED (permit PASSED). A second /complete is attempted; job is COMPLETED (not IN_PROGRESS) so state check fails first regardless of permit."
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "PV1 Cust", email: "pv1@x.com", service_zip: "60001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
