      - name: facility_score_is_the_two_decimal_mean_of_the_latest_review_per_category
        claim_type: precision
        grounds:
          - calculations.facility_posture_evaluation
          - entities.Affiliate.fields.facility_score
        distinguishing_aspect: "Scores 85, 84 and 84 across three categories average to 253/3 = 84.3333..., which must be stored as exactly 84.33 under round_half_up at two places, and the affiliate lands on PROVISIONAL because two MINOR reviews are open while no MAJOR is."
        test_recipe:
          setup:
            - "The logical clock is at 2026-03-01T00:00:00Z."
            - "One affiliate with no agreement yet, so only the facility rollup is exercised."
            - "Author-computed: 85 -> deficiency NONE (auto CLOSED); 84 -> MINOR twice; mean(85, 84, 84) = 253/3 = 84.333333... -> 84.33; open_major 0, open_minor 2 -> facility_status PROVISIONAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /affiliates"
              payload: { name: "Precision Club", level: "DOUBLE_A", market_city: "Portland", meal_stipend_cents_per_day: 2900 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pf_aff: $.data.id }
          trigger:
            - call: "POST /affiliates/${pf_aff}/facility-reviews"
              payload: { category: "CLUBHOUSE", review_date: "2026-03-01", score: 85 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pf_r1: $.data.id, pf_r1_level: $.data.deficiency_level, pf_r1_status: $.data.status }
            - call: "POST /affiliates/${pf_aff}/facility-reviews"
              payload: { category: "WEIGHT_ROOM", review_date: "2026-03-01", score: 84 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pf_r2: $.data.id, pf_r2_level: $.data.deficiency_level }
            - call: "POST /affiliates/${pf_aff}/facility-reviews"
              payload: { category: "FIELD_SURFACE", review_date: "2026-03-01", score: 84 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pf_r3: $.data.id }
            - call: "GET /affiliates/${pf_aff}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pf_score: $.data.facility_score, pf_status: $.data.facility_status }
          assert:
            - "FacilityStandardReview.${pf_r1}.deficiency_level == NONE and status == CLOSED (a clean inspection is persisted directly in CLOSED)"
            - "FacilityStandardReview.${pf_r2}.deficiency_level == MINOR with status == OPEN and remediation_due_date == 2026-04-30 (review_date + REMEDIATION_DAYS[MINOR] 60)"
            - "Affiliate.${pf_aff}.facility_score == 84.33 — two decimals, round_half_up over 84.333333..."
            - "Affiliate.${pf_aff}.open_major_deficiency_count == 0 and facility_status == PROVISIONAL"

      - name: facility_rollup_takes_the_latest_per_category_and_drops_waived_reviews
        claim_type: input_set_filtering
        grounds:
          - calculations.facility_posture_evaluation.input_set
          - "state_machines.FacilityStandardReview[OPEN -> WAIVED]"
        distinguishing_aspect: "Two reviews in the SAME category show that only the later review_date feeds facility_score while the earlier one still counts toward the open-deficiency tally, and WAIVING that earlier review removes it from both the score input set and the tally — two different filters observed on one row."
        test_recipe:
          setup:
