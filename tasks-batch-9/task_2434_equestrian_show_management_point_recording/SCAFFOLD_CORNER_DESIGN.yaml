              as: Exhibitor
              as_user_id: "${rider1_id}"
              captures: { entry1_id: $.data.id }
            - call: "POST /class-entries"
              payload: { entry_id: "${entry1_id}", class_id: "${class101_id}" }
              as: Exhibitor
              as_user_id: "${rider1_id}"
              captures: { ce1_id: $.data.id }
          trigger:
            - call: "POST /entries/${entry1_id}/accept"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry1_id}/payment"
              payload: { amount_cents: 30000 }
              as: Exhibitor
              as_user_id: "${rider1_id}"
            - call: "POST /entries/${entry1_id}/verify"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry1_id}/verify"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry1_id}/invoice"
              payload: {}
              as: ShowSecretary
            - call: "POST /entries/${entry1_id}/invoice"
              payload: {}
