              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2600, ship_window_start: "2026-10-01T00:00:00Z", ship_window_end: "2026-10-15T00:00:00Z", expected_plan_month_version: "${mv0}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_id: $.data.id, rc_cost: $.data.cost_cents, rc_open_cost: $.data.open_cost_cents }
            - call: "POST /otb/receipt-commitments/${rc_id}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { commit_status: $.data.commit_status, commit_open_cost: $.data.open_cost_cents }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { m_committed: $.data.otb_committed_cents, m_open: $.data.otb_open_cents, mv1: $.data.version }
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { plan_ratio: $.data.open_ratio_bps, plan_posture: $.data.otb_posture }
          assert:
            - "${item_units_at_create} is null and ${item_mult} == 10000 at creation: the derived units are absent until the transition that computes them, which is different from being stale"
            - "${adopt_status} == ADOPTED, ${adopt_basis} == CARRYOVER_PRIOR, ${adopt_st} == 7455 (round_half_up(7100 * 10500 / 10000)) and ${adopt_units} == 276 - all four are present in the ACTION response, not only on a later read"
            - "${read_status} == ${adopt_status}, ${read_basis} == ${adopt_basis}, ${read_st} == ${adopt_st} and ${read_units} == ${adopt_units}: the immediate re-read is field-for-field identical, so nothing settled between the two calls"
            - "${approve_budget} == 60000000, ${approve_ratio} == 10000 and ${approve_posture} == OPEN are all already in the approve response, even though they are written by cascade-B links 1 and 3"
            - "${m_planned} == 18200000 was readable immediately after that same approve response, with no intermediate zero state observable"
            - "${rc_cost} == 1040000 and ${rc_open_cost} == 1040000 in the create response; ${commit_status} == COMMITTED with ${commit_open_cost} == 1040000 in the commit response"
            - "${m_committed} == 1040000, ${m_open} == 17160000 and ${mv1} == ${mv0} + 1 on the first read after the commit: the cascade to PlanMonth is synchronous"
            - "${plan_ratio} == 9741 and ${plan_posture} == OPEN on the first read after the commit: the cascade to CategoryPlan is synchronous too, two entities away from the write"
            - "no assertion in this instance is preceded by a retry, a sleep or a second identical read; a single read after each write is sufficient by definition of the immediate model"
