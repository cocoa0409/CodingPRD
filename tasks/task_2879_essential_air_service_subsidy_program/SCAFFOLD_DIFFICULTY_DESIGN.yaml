        grounds:
          - calculations.proposal_subsidy_per_passenger
          - calculations.proposal_subsidy_per_passenger.precision
          - validations.priority_29
          - entities.Proposal.fields.subsidy_per_passenger_usd
        boundary_metric: "subsidy dollars per projected passenger at the 200.00 cap, probed at exact equality and at the cent-rounding tipping point 200.005"
        distinguishing_aspect: |
          The metric is money and the boundary is only observable because the quotient is quantized to
          cents *before* the comparison: 1778444.00 / 8892 is 200.00494... which rounds down onto the
          cap and passes, while one dollar more rounds up to 200.01 and fails. A raw comparison of the
          unrounded quotient would reject both. This is the only instance where the rounding step
          itself decides the boundary.
