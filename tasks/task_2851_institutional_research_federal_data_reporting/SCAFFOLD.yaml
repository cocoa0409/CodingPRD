scenario: |
  2851. Institutional Research & Federal Data Reporting (university institutional research
  office): census date snapshot rules and frozen file governance, survey component preparation
  across enrollment, completions, finance and human resources, cohort definition and tracking
  for graduation and retention rates including exclusions, data element mapping between local
  systems and federal definitions, edit check resolution and prior-year comparison explanations,
  state, consortium and ranking survey submissions with reconciliation, internal dashboard
  publication with restated-data change control, data request intake and disclosure avoidance
  for small cells

domain_name: institutional-research-federal-reporting
api_prefix: "/ir"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Graph: DataElementMapping is a junction resolving the many-to-many between local system
  # fields (per ReportingCycle) and FederalDefinition rows; FrozenFile is self-referential via
  # supersedes_frozen_file_id; DashboardPublication and ExternalSubmission both reference
  # SurveyComponent across aggregate boundaries; CohortDefinition reaches DashboardPublication
  # by metric_key rather than by containment.

  state_machine_shape: cyclic
  # ReportingCycle is a true cycle (FROZEN -> REOPENED -> CENSUS_LOCKED -> FROZEN).
  # SurveyComponent carries two independent dimensions (prep_status x edit_status); its
  # edit_status is compound (derived from EditCheck children) and itself cycles
  # (EXPLAINED -> OPEN_EDITS -> EXPLAINED). EditCheck branches three ways on adjudication.

  relationship_patterns:
    - one_to_many          # ReportingCycle -> FrozenFile / SurveyComponent / CohortDefinition / DataRequest
    - many_to_many         # DataElementMapping junction: (ReportingCycle, local system) <-> FederalDefinition
    - self_referential     # FrozenFile.supersedes_frozen_file_id -> FrozenFile.id
    - cross_aggregate      # DashboardPublication <-> CohortDefinition matched on metric_key; ExternalSubmission reads ComponentMetric

  role_model: segregation_of_duties
  # The IRAnalyst who prepares a component may not certify it; the IRAnalyst who authors a
  # restatement may not approve it; the analyst who explains an edit check may not adjudicate
  # it. Enforcement compares X-User-ID against the stored actor id, never against an entity id.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 60 endpoints; density concentrated in: two dual-variant calculations on
  # different subjects (cohort rates, disclosure avoidance), two combinatorial calculations in
  # different modes (nested rounding order; pinned single-pass tier evaluation), two
  # transitive cascades of depth 4 from different triggers, two interval geometries
  # (closed coverage windows vs half-open publication windows), and two conserved quantities.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================================
# §1.1 Entity-Relationship Table
# =====================================================================================
entities:
  - name: ReportingCycle
    parent: null
    common_fields: true
    description: "A federal collection cycle (e.g. IPEDS 2027) governing census-date snapshot rules and frozen-file governance for one institution-year."
    fields:
      - name: cycle_code
        type: string
        source: input
        description: "Human-readable cycle identifier, e.g. 'IPEDS-2027'. Unique across all ReportingCycle rows."
        constraints: "1-32 chars; unique (case-sensitive); violation -> ERR_DUPLICATE_CYCLE_CODE"
      - name: collection_year
        type: integer
        source: input
        description: "Federal collection year the cycle reports on."
        constraints: ">= 2000 and <= 2100"
      - name: census_date
        type: string
        source: input
        description: "Census date (ISO 8601 calendar date, YYYY-MM-DD). No snapshot may be census-locked before the logical clock reaches this date."
        constraints: "ISO date; census-lock before this date -> ERR_CENSUS_DATE_NOT_REACHED"
      - name: collection_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant (three fractional digits accepted) after which certification, component submission and external transmission are refused."
        constraints: "must be strictly after census_date T00:00:00Z"
      - name: snapshot_posture
        type: enum
        source: system
        description: "Governance posture of the cycle; gates every child mutation."
        default: OPEN
        constraints: "OPEN | CENSUS_LOCKED | FROZEN | REOPENED | ARCHIVED"
      - name: census_locked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent census-lock; null while snapshot_posture == OPEN."
        default: null
      - name: frozen_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent freeze; null until first freeze."
        default: null
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times the cycle has been reopened after a freeze."
        default: 0
      - name: active_record_count
        type: integer
        source: computed
        description: "Derived ledger: SUM(FrozenFile.record_count) over FrozenFile rows of this cycle whose status IN {ACTIVE, LOCKED}. Recomputed on frozen-file creation, on census-lock and on reopen."
        default: 0
      - name: frozen_file_count
        type: integer
        source: computed
        description: "Derived count of FrozenFile rows of this cycle whose status != SUPERSEDED (see calculations.cycle_active_record_count). Recomputed alongside active_record_count."
        default: 0
      - name: reopen_reason
        type: string
        source: input
        description: "Reason text recorded by the most recent reopen; null until first reopen."
        default: null
        constraints: "when supplied, 10-500 chars"

  - name: FrozenFile
    parent: ReportingCycle
    common_fields: true
    description: "An immutable census extract for one survey domain of one cycle, occupying a closed coverage window on the (cycle, domain) resource."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id; the cycle this extract belongs to."
      - name: supersedes_frozen_file_id
        type: string
        source: system
        description: "FK -> FrozenFile.id; self-referential link to the file this extract replaced (identical coverage window, same domain). Null when this extract replaced nothing."
        default: null
      - name: domain
        type: enum
        source: input
        description: "Survey domain covered by the extract."
        constraints: "ENROLLMENT | COMPLETIONS | FINANCE | HR"
      - name: record_count
        type: integer
        source: input
        description: "Number of source records in the extract."
        constraints: ">= 0"
      - name: coverage_start_date
        type: string
        source: input
        description: "First calendar date covered by the extract (ISO date). Interval semantics are CLOSED: both endpoints are occupied."
      - name: coverage_end_date
        type: string
        source: input
        description: "Last calendar date covered by the extract (ISO date), inclusive."
        constraints: "must be >= coverage_start_date; violation -> ERR_INVALID_COVERAGE_WINDOW"
      - name: checksum
        type: string
        source: input
        description: "Extract fingerprint supplied by the source system."
        constraints: "8-64 chars"
      - name: snapshot_taken_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the extract was registered."
      - name: status
        type: enum
        source: system
        description: "Governance state of the extract."
        default: ACTIVE
        constraints: "ACTIVE | LOCKED | SUPERSEDED"

  - name: SurveyComponent
    parent: ReportingCycle
    common_fields: true
    description: "Preparation workspace for one survey component (enrollment, completions, finance, HR) of one cycle. Carries two independent state dimensions: prep_status and edit_status."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id; the cycle whose collection this component belongs to."
      - name: frozen_file_id
        type: string
        source: input
        description: "FK -> FrozenFile.id; the census extract this component is prepared from. Its domain MUST equal component_code."
      - name: component_code
        type: enum
        source: input
        description: "Survey component identifier; unique per cycle."
        constraints: "ENROLLMENT | COMPLETIONS | FINANCE | HR; duplicate per cycle -> ERR_DUPLICATE_COMPONENT"
      - name: prep_status
        type: enum
        source: system
        description: "Preparation dimension; advances via prepare/certify/submit and reverts via revert-to-draft."
        default: DRAFT
        constraints: "DRAFT | PREPARED | CERTIFIED | SUBMITTED"
      - name: edit_status
        type: enum
        source: computed
        description: "Edit-resolution dimension, re-derived from this component's EditCheck children on every EditCheck mutation and on prepare/revert (see calculations.edit_status_derivation)."
        default: NOT_RUN
        constraints: "NOT_RUN | OPEN_EDITS | EXPLAINED | CLEARED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IRAnalyst who ran the most recent prepare; null while prep_status == DRAFT and never prepared."
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IRDirector who certified; cleared to null on revert-to-draft."
        default: null
      - name: certification_statement
        type: string
        source: input
        description: "Attestation text recorded at certification; null until certified."
        default: null
        constraints: "when supplied, 20-1000 chars"
      - name: mapping_coverage_pct
        type: number
        source: computed
        description: "Percentage of required FederalDefinition elements for this component_code that have a VALIDATED DataElementMapping in this cycle (see calculations.mapping_coverage_pct). Recomputed on prepare."
        default: null
      - name: core_expense_per_fte_cents
        type: integer
        source: computed
        description: "FINANCE-only per-FTE core expense, computed round-per-category-then-sum (see calculations.core_expense_per_fte_cents). Null for non-FINANCE components and before the first prepare."
        default: null
      - name: fatal_open_count
        type: integer
        source: computed
        description: "Count of this component's EditCheck rows with severity == FATAL and status IN {OPEN, EXPLAINED, REJECTED}."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of federal submission; null until prep_status == SUBMITTED."
        default: null

  - name: ComponentMetric
    parent: SurveyComponent
    common_fields: true
    description: "One reported data element of a survey component, with its prior-year value for comparison edit checks."
    fields:
      - name: component_id
        type: string
        source: input
        description: "FK -> SurveyComponent.id; the component this metric is reported under."
      - name: metric_key
        type: enum
        source: input
        description: "Metric identifier; must be permitted for the parent component_code (see validations priority 17)."
        constraints: "TOTAL_HEADCOUNT | FTE_ENROLLMENT | TOTAL_COMPLETIONS | CIP_PROGRAM_COUNT | INSTRUCTION_EXPENSES_CENTS | ACADEMIC_SUPPORT_EXPENSES_CENTS | STUDENT_SERVICES_EXPENSES_CENTS | INSTRUCTIONAL_STAFF_HEADCOUNT | INSTRUCTIONAL_CONTRACT_MONTHS; duplicate per component -> ERR_DUPLICATE_METRIC_KEY"
      - name: reported_value
        type: number
        source: input
        description: "Value reported to the federal collection for this metric."
        constraints: ">= 0"
      - name: prior_year_value
        type: number
        source: input
        description: "Same metric from the prior collection year; null when no prior-year value exists."
        default: null
        constraints: "when supplied, >= 0"
      - name: variance_pct
        type: number
        source: computed
        description: "Prior-year variance percentage (see calculations.prior_year_variance_pct); null when prior_year_value is null or 0."
        default: null
      - name: source_field_path
        type: string
        source: input
        description: "Local-system field path the value was extracted from, e.g. 'SIS.STUDENT.HEADCOUNT_FALL'."
        constraints: "3-120 chars"
      - name: restated
        type: boolean
        source: system
        description: "True once reported_value has been changed by PATCH after the metric was first created."
        default: false
      - name: restatement_note
        type: string
        source: input
        description: "Explanation recorded by the most recent PATCH; null while restated == false."
        default: null

  - name: EditCheck
    parent: SurveyComponent
    common_fields: true
    description: "A machine-raised edit flag on a prepared component, resolved by an analyst explanation and a director adjudication."
    fields:
      - name: component_id
        type: string
        source: input
        description: "FK -> SurveyComponent.id; the component whose prepare run raised this check."
      - name: check_code
        type: string
        source: system
        description: "Deterministic code composed by the prepare run, e.g. 'PY_VAR_TOTAL_HEADCOUNT', 'PY_ZERO_BASE_FTE_ENROLLMENT', 'ZERO_NO_BASE_CIP_PROGRAM_COUNT', 'UNMAPPED_ELEMENTS'. Unique per component."
      - name: sequence_no
        type: integer
        source: system
        description: "1-based creation order inside the prepare run; pins the deterministic order in which checks are created and listed."
      - name: severity
        type: enum
        source: system
        description: "FATAL checks must be ACCEPTED before certification; WARNING checks may also be WAIVED."
        constraints: "FATAL | WARNING"
      - name: metric_key
        type: string
        source: system
        description: "metric_key of the ComponentMetric that raised the check; 'ALL' for the component-level UNMAPPED_ELEMENTS check."
      - name: observed_value
        type: number
        source: system
        description: "reported_value captured at prepare time; null for UNMAPPED_ELEMENTS."
        default: null
      - name: prior_year_value
        type: number
        source: system
        description: "prior_year_value captured at prepare time; null when absent."
        default: null
      - name: variance_pct
        type: number
        source: system
        description: "variance_pct captured at prepare time; null for zero-base and UNMAPPED_ELEMENTS checks."
        default: null
      - name: status
        type: enum
        source: system
        description: "Resolution state of the check."
        default: OPEN
        constraints: "OPEN | EXPLAINED | ACCEPTED | WAIVED | REJECTED | VOIDED"
      - name: explanation_text
        type: string
        source: input
        description: "Analyst explanation of the flagged value; replaced on each re-explanation."
        default: null
        constraints: "when supplied, 20-2000 chars; shorter -> ERR_EXPLANATION_TOO_SHORT"
      - name: prior_year_comparison_note
        type: string
        source: input
        description: "Analyst narrative comparing the value to the prior year, required alongside explanation_text."
        default: null
        constraints: "when supplied, 10-2000 chars"
      - name: explained_by_user_id
        type: string
        source: system
        description: "X-User-ID of the analyst who supplied the most recent explanation; null while status == OPEN."
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the director who last adjudicated; null before first adjudication."
        default: null
      - name: adjudication_note
        type: string
        source: input
        description: "Director note recorded with the most recent adjudication."
        default: null
      - name: explanation_round
        type: integer
        source: system
        description: "Number of explanations supplied so far; increments on every explain, including re-explanations after rejection."
        default: 0

  - name: CohortDefinition
    parent: ReportingCycle
    common_fields: true
    description: "A graduation-rate or retention cohort for one entry term, with exclusion handling and two divergent rate variants."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id; the cycle the cohort is reported in."
      - name: cohort_type
        type: enum
        source: input
        description: "Cohort flavour; selects the rate numerator."
        constraints: "GRAD_RATE_150 | RETENTION_FT; duplicate (cycle_id, cohort_type, entry_term) -> ERR_DUPLICATE_COHORT"
      - name: entry_term
        type: string
        source: input
        description: "Entry term label, e.g. 'FALL_2020'."
        constraints: "3-32 chars"
      - name: publication_metric_key
        type: string
        source: input
        description: "Dashboard metric key this cohort's federal rate feeds; used to select the DashboardPublication rows the exclusion cascade touches."
        constraints: "3-64 chars"
      - name: initial_count
        type: integer
        source: computed
        description: "COUNT of CohortMember rows of this cohort, all exclusion states included."
        default: 0
      - name: exclusion_count
        type: integer
        source: computed
        description: "COUNT of CohortMember rows of this cohort with exclusion_status == APPROVED."
        default: 0
      - name: adjusted_count
        type: integer
        source: computed
        description: "initial_count - exclusion_count; the federal (exclusion-adjusted) denominator."
        default: 0
      - name: completers_count
        type: integer
        source: computed
        description: "COUNT of CohortMember rows with outcome == COMPLETED_150 (exclusion state ignored)."
        default: 0
      - name: retained_count
        type: integer
        source: computed
        description: "COUNT of CohortMember rows with outcome IN {COMPLETED_150, STILL_ENROLLED} (exclusion state ignored)."
        default: 0
      - name: federal_rate_pct
        type: number
        source: computed
        description: "Federal variant rate: exclusion-adjusted denominator and exclusion-filtered numerator (see calculations.cohort_rate_variants). Null while adjusted_count == 0."
        default: null
      - name: ranking_rate_pct
        type: number
        source: computed
        description: "Ranking-survey variant rate: full initial denominator and unfiltered numerator (see calculations.cohort_rate_variants). Null while initial_count == 0."
        default: null
      - name: status
        type: enum
        source: system
        description: "DRAFT allows membership edits; LOCKED freezes membership and propagates later exclusion approvals to dashboards."
        default: DRAFT
        constraints: "DRAFT | LOCKED"
      - name: locked_at
        type: datetime
        source: system
        description: "Logical-clock instant the cohort was locked; null while DRAFT."
        default: null

  - name: CohortMember
    parent: CohortDefinition
    common_fields: true
    description: "One student row of a cohort, carrying its tracked outcome and its allowable-exclusion claim."
    fields:
      - name: cohort_id
        type: string
        source: input
        description: "FK -> CohortDefinition.id; the cohort this student belongs to."
      - name: student_local_id
        type: string
        source: input
        description: "Local SIS identifier of the student; unique per cohort."
        constraints: "3-32 chars; duplicate per cohort -> ERR_DUPLICATE_MEMBER"
      - name: entry_status
        type: enum
        source: input
        description: "Attendance status at cohort entry."
        constraints: "FULL_TIME | PART_TIME"
      - name: outcome
        type: enum
        source: input
        description: "Tracked outcome at the end of the tracking window."
        default: STILL_ENROLLED
        constraints: "COMPLETED_150 | STILL_ENROLLED | TRANSFERRED_OUT | NO_LONGER_ENROLLED"
      - name: exclusion_code
        type: enum
        source: input
        description: "Allowable-exclusion reason claimed for this student; null while no claim exists."
        default: null
        constraints: "DECEASED | PERMANENTLY_DISABLED | ARMED_FORCES | FOREIGN_AID_SERVICE | CHURCH_MISSION; anything else -> ERR_INVALID_EXCLUSION_CODE"
      - name: exclusion_status
        type: enum
        source: system
        description: "Review state of the exclusion claim."
        default: NONE
        constraints: "NONE | CLAIMED | APPROVED | DENIED"
      - name: exclusion_evidence_note
        type: string
        source: input
        description: "Evidence description recorded with the claim."
        default: null
        constraints: "when supplied, 10-500 chars"
      - name: exclusion_claimed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the registrar who filed the claim; null while exclusion_status == NONE."
        default: null
      - name: exclusion_reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the director who last reviewed the claim; null before first review."
        default: null
      - name: review_note
        type: string
        source: input
        description: "Director note recorded with the most recent exclusion review."
        default: null

  - name: FederalDefinition
    parent: null
    common_fields: false
    description: "Immutable federal data-element definition (configuration). Created once per collection cycle code; never updated or deleted."
    fields:
      - name: definition_code
        type: string
        source: input
        description: "Federal element code, e.g. 'EF_TOTAL_HEADCOUNT'. Unique per effective_cycle_code."
        constraints: "3-64 chars; duplicate (definition_code, effective_cycle_code) -> ERR_DUPLICATE_DEFINITION"
      - name: survey_component
        type: enum
        source: input
        description: "Survey component the element belongs to."
        constraints: "ENROLLMENT | COMPLETIONS | FINANCE | HR"
      - name: value_domain
        type: array
        source: input
        description: "Closed list of federal codes the element accepts; every target code of a DataElementMapping.value_map must appear here."
        constraints: "1-40 strings, each 1-32 chars"
      - name: required
        type: boolean
        source: input
        description: "Whether a VALIDATED mapping for this element is required before its component can be prepared without a FATAL edit check."
        default: true
      - name: unit_of_measure
        type: string
        source: input
        description: "Federal unit, e.g. 'HEADCOUNT', 'USD_CENTS', 'MONTHS'."
        constraints: "1-32 chars"
      - name: effective_cycle_code
        type: string
        source: input
        description: "cycle_code of the ReportingCycle this definition is effective for; matched by string equality, not by FK."
        constraints: "1-32 chars"

  - name: DataElementMapping
    parent: null
    common_fields: true
    description: "Junction resolving the many-to-many between a cycle's local-system fields and federal definitions, with its own validation lifecycle."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id; the cycle this mapping is authored for."
      - name: definition_id
        type: string
        source: input
        description: "FK -> FederalDefinition.id; the federal element this mapping targets."
      - name: local_system_code
        type: enum
        source: input
        description: "Source system the local field lives in."
        constraints: "SIS | HR | FIN | ADV; duplicate (cycle_id, definition_id, local_system_code) -> ERR_DUPLICATE_MAPPING"
      - name: local_field_path
        type: string
        source: input
        description: "Local field path being mapped, e.g. 'SIS.STUDENT.ETHNICITY'."
        constraints: "3-120 chars"
      - name: transform_expression
        type: string
        source: input
        description: "Transformation applied to the local value before reporting, e.g. 'UPPER(TRIM(x))'."
        constraints: "1-500 chars"
      - name: value_map
        type: object
        source: input
        description: "Mapping of local codes to federal codes; every value MUST appear in the target FederalDefinition.value_domain."
        constraints: "1-40 entries; violation -> ERR_VALUE_DOMAIN_VIOLATION"
      - name: status
        type: enum
        source: system
        description: "Validation lifecycle; REJECTED mappings return to PROPOSED via revise."
        default: PROPOSED
        constraints: "PROPOSED | VALIDATED | REJECTED"
      - name: validated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DataSteward who last decided the mapping; null while PROPOSED and never decided."
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Steward's reason recorded when a mapping is rejected; cleared to null on revise."
        default: null
        constraints: "when supplied, 10-500 chars"
      - name: revision_round
        type: integer
        source: system
        description: "Number of revise calls applied; increments on every REJECTED -> PROPOSED transition."
        default: 0

  - name: ExternalSubmission
    parent: null
    common_fields: true
    description: "A state, consortium or ranking survey submission of one metric, reconciled against the certified federal value before transmission."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id; the cycle whose data is being resubmitted externally."
      - name: component_id
        type: string
        source: input
        description: "FK -> SurveyComponent.id; the federal component the reported value is reconciled against. Its cycle_id MUST equal this submission's cycle_id."
      - name: target_type
        type: enum
        source: input
        description: "Recipient class; selects tolerance_pct."
        constraints: "STATE | CONSORTIUM | RANKING"
      - name: target_name
        type: string
        source: input
        description: "Recipient name, e.g. 'State Board of Higher Education'."
        constraints: "3-120 chars"
      - name: metric_key
        type: string
        source: input
        description: "metric_key whose ComponentMetric supplies the federal comparison value on the referenced component."
        constraints: "3-64 chars"
      - name: reported_value
        type: number
        source: input
        description: "Value being reported to the external recipient."
        constraints: ">= 0"
      - name: federal_value
        type: number
        source: computed
        description: "reported_value of the matching ComponentMetric, captured at reconcile time; null before the first reconcile."
        default: null
      - name: raw_delta_pct
        type: number
        source: computed
        description: "Unadjusted percentage gap between reported_value and federal_value (step 1 of calculations.submission_reconciliation)."
        default: null
      - name: allowance_pct
        type: number
        source: computed
        description: "Tier allowance selected from raw_delta_pct only (step 2); never re-derived from effective_delta_pct."
        default: null
      - name: effective_delta_pct
        type: number
        source: computed
        description: "max(0.00, raw_delta_pct - allowance_pct) (step 3); compared against tolerance_pct."
        default: null
      - name: tolerance_pct
        type: number
        source: computed
        description: "Tolerance for target_type: STATE 0.50, CONSORTIUM 1.00, RANKING 3.00 (step 4)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Submission lifecycle."
        default: DRAFT
        constraints: "DRAFT | RECONCILED | VARIANCE_HOLD | TRANSMITTED"
      - name: override_reason
        type: string
        source: input
        description: "Director justification recorded when a VARIANCE_HOLD is overridden; null otherwise."
        default: null
        constraints: "when supplied, 20-500 chars"
      - name: overridden_by_user_id
        type: string
        source: system
        description: "X-User-ID of the director who overrode the variance hold; null when never overridden."
        default: null
      - name: transmission_reference
        type: string
        source: input
        description: "Recipient-side receipt reference recorded at transmission; null until TRANSMITTED."
        default: null
        constraints: "when supplied, 3-64 chars"
      - name: transmitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of transmission; null until TRANSMITTED."
        default: null

  - name: DashboardPublication
    parent: SurveyComponent
    common_fields: true
    description: "An internal dashboard figure published for one (component, metric) pair over a half-open effective window, under restated-data change control."
    fields:
      - name: component_id
        type: string
        source: input
        description: "FK -> SurveyComponent.id; the certified component the figure is published from."
      - name: metric_key
        type: string
        source: input
        description: "Dashboard metric key, e.g. 'GRAD_RATE_150_FALL_2020'. Together with component_id it identifies the publication series."
        constraints: "3-64 chars"
      - name: published_value
        type: number
        source: input
        description: "Currently published figure; mutated only by an APPLIED RestatementRequest."
      - name: original_value
        type: number
        source: system
        description: "published_value as first accepted at creation; never mutated afterwards."
      - name: net_applied_delta
        type: number
        source: computed
        description: "SUM of (proposed_value - published_value_before) over this publication's RestatementRequest rows with status == APPLIED. Invariant: published_value == original_value + net_applied_delta."
        default: 0
      - name: restatement_count
        type: integer
        source: computed
        description: "COUNT of this publication's RestatementRequest rows with status == APPLIED."
        default: 0
      - name: effective_from
        type: string
        source: input
        description: "First calendar date the figure is effective (ISO date). Interval semantics are HALF-OPEN [effective_from, effective_to)."
      - name: effective_to
        type: string
        source: input
        description: "Exclusive end date of the effective window (ISO date); null means open-ended (+infinity)."
        default: null
        constraints: "when supplied, must be strictly after effective_from; violation -> ERR_INVALID_EFFECTIVE_WINDOW"
      - name: publication_status
        type: enum
        source: system
        description: "Change-control state of the published figure."
        default: PUBLISHED
        constraints: "PUBLISHED | RESTATEMENT_PENDING | RESTATED | WITHDRAWN"
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID of the analyst who published the figure."
      - name: withdrawal_reason
        type: string
        source: input
        description: "Reason recorded at withdrawal; null unless publication_status == WITHDRAWN."
        default: null
        constraints: "when supplied, 10-500 chars"

  - name: RestatementRequest
    parent: DashboardPublication
    common_fields: true
    description: "Change-control record proposing a new value for a published dashboard figure; subject to segregation of duties and a materiality notice threshold."
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> DashboardPublication.id; the publication whose figure is being restated."
      - name: proposed_value
        type: number
        source: input
        description: "Replacement figure proposed for the publication."
      - name: baseline_value
        type: number
        source: system
        description: "publication.published_value captured at request creation; the delta is measured against this."
      - name: delta_pct
        type: number
        source: computed
        description: "round_half_up(abs(proposed_value - baseline_value) / abs(baseline_value) * 100, 2); null when baseline_value == 0."
        default: null
      - name: public_notice_required
        type: boolean
        source: computed
        description: "True when delta_pct >= MATERIALITY_PCT (2.00), or when baseline_value == 0 and proposed_value != 0. Approval then requires public_notice_reference."
        default: false
      - name: justification
        type: string
        source: input
        description: "Analyst justification for the restatement."
        constraints: "20-1000 chars"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the analyst who filed the request, or the literal 'SYSTEM' for cascade-generated requests."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the director who approved or rejected; null while SUBMITTED."
        default: null
      - name: public_notice_reference
        type: string
        source: input
        description: "External notice reference supplied at approval when public_notice_required is true."
        default: null
        constraints: "when supplied, 3-120 chars"
      - name: rejection_reason
        type: string
        source: input
        description: "Director reason recorded on rejection."
        default: null
        constraints: "when supplied, 10-500 chars"
      - name: status
        type: enum
        source: system
        description: "Change-control lifecycle. SUPERSEDED is set when a newer request is filed on the same publication; VOIDED when the publication's source component is decertified or the publication is withdrawn."
        default: SUBMITTED
        constraints: "SUBMITTED | APPLIED | REJECTED | SUPERSEDED | VOIDED"
      - name: origin
        type: enum
        source: system
        description: "ANALYST for requests filed through the API; CASCADE for requests auto-created by an exclusion-approval cascade."
        default: ANALYST
        constraints: "ANALYST | CASCADE"

  - name: DataRequest
    parent: ReportingCycle
    common_fields: true
    description: "An intake record for an internal or external data request, screened for disclosure risk before release."
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id; the cycle whose frozen figures the request draws on."
      - name: requester_org
        type: string
        source: input
        description: "Requesting organisation name."
        constraints: "3-120 chars"
      - name: requester_type
        type: enum
        source: input
        description: "Requester class; EXTERNAL and MEDIA requests may not be released while residual disclosure risk remains."
        constraints: "INTERNAL | EXTERNAL | MEDIA"
      - name: requested_metric_key
        type: string
        source: input
        description: "Metric the crosstab reports."
        constraints: "3-64 chars"
      - name: avoidance_method
        type: enum
        source: input
        description: "Disclosure-avoidance algorithm applied at screening; selects between the two divergent variants of calculations.disclosure_avoidance."
        default: SMALL_CELL_SUPPRESSION
        constraints: "SMALL_CELL_SUPPRESSION | CONTROLLED_ROUNDING"
      - name: min_cell_size
        type: integer
        source: input
        description: "Primary suppression threshold: a cell is primary-suppressed when 0 < raw_count < min_cell_size."
        default: 5
        constraints: ">= 2 and <= 10"
      - name: status
        type: enum
        source: system
        description: "Intake lifecycle."
        default: RECEIVED
        constraints: "RECEIVED | SCREENED | RELEASED | SUPPRESSED_RELEASE | REFUSED"
      - name: cell_count
        type: integer
        source: computed
        description: "COUNT of this request's DisclosureCell rows."
        default: 0
      - name: suppressed_cell_count
        type: integer
        source: computed
        description: "COUNT of this request's DisclosureCell rows with suppression_state IN {PRIMARY_SUPPRESSED, COMPLEMENTARY_SUPPRESSED}; 0 before screening."
        default: 0
      - name: released_cell_count
        type: integer
        source: computed
        description: "COUNT of this request's DisclosureCell rows with suppression_state == RELEASED; 0 before screening."
        default: 0
      - name: residual_disclosure_risk
        type: boolean
        source: computed
        description: "True when at least one dimension_group ended screening with exactly one PRIMARY_SUPPRESSED cell and no eligible complementary candidate."
        default: false
      - name: refusal_reason
        type: string
        source: system
        description: "Set to 'AGGREGATE_BELOW_MINIMUM' when screening refuses the request outright; null otherwise."
        default: null
      - name: screened_at
        type: datetime
        source: system
        description: "Logical-clock instant screening completed; null while RECEIVED."
        default: null
      - name: release_note
        type: string
        source: input
        description: "Note recorded at release."
        default: null
      - name: screened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the disclosure officer who screened the request."
        default: null

  - name: DisclosureCell
    parent: DataRequest
    common_fields: true
    description: "One crosstab cell of a data request, carrying its raw count and the released value produced by disclosure avoidance."
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> DataRequest.id; the request this cell belongs to."
      - name: dimension_group
        type: string
        source: input
        description: "Grouping the cell participates in for complementary suppression, e.g. 'RACE_ETHNICITY'."
        constraints: "2-64 chars"
      - name: dimension_key
        type: string
        source: input
        description: "Cell label inside the group, e.g. 'ASIAN'. Unique per (request_id, dimension_group); also the deterministic tie-break key for complementary suppression (ASC)."
        constraints: "1-64 chars; duplicate -> ERR_DUPLICATE_CELL"
      - name: raw_count
        type: integer
        source: input
        description: "Unprotected count for the cell."
        constraints: ">= 0"
      - name: released_count
        type: integer
        source: computed
        description: "Value cleared for release: raw_count when RELEASED under SMALL_CELL_SUPPRESSION, the base-5 rounded value under CONTROLLED_ROUNDING, null when suppressed. Null before screening."
        default: null
      - name: suppression_state
        type: enum
        source: computed
        description: "Screening outcome for the cell."
        default: PENDING
        constraints: "PENDING | RELEASED | PRIMARY_SUPPRESSED | COMPLEMENTARY_SUPPRESSED"

# =====================================================================================
# §1.2 State Machine Table
# =====================================================================================
state_machines:
  - entity: ReportingCycle
    dimension: snapshot_posture
    shape: cyclic
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: CENSUS_LOCKED
        trigger: "POST /ir/reporting-cycles/{cycle_id}/census-lock"
        actor: RegistrarOfficer
        preconditions:
          - "snapshot_posture == OPEN"
          - "logical clock date >= census_date (equality passes) else ERR_CENSUS_DATE_NOT_REACHED"
          - "at least one FrozenFile of this cycle has status == ACTIVE else ERR_NO_ACTIVE_SNAPSHOT"
        side_effects:
          - "snapshot_posture := CENSUS_LOCKED; census_locked_at := logical clock; version += 1"
          - "every FrozenFile of this cycle with status == ACTIVE := LOCKED (processed in created_at ASC); each such file's version += 1"
          - "active_record_count recomputed per calculations.cycle_active_record_count (unchanged in value: LOCKED files remain in the sum)"
      - from: REOPENED
        to: CENSUS_LOCKED
        trigger: "POST /ir/reporting-cycles/{cycle_id}/census-lock"
        actor: RegistrarOfficer
        preconditions:
          - "snapshot_posture == REOPENED"
          - "logical clock date >= census_date else ERR_CENSUS_DATE_NOT_REACHED"
          - "at least one FrozenFile of this cycle has status == ACTIVE (i.e. a fresh extract was registered after the reopen) else ERR_NO_ACTIVE_SNAPSHOT"
        side_effects:
          - "snapshot_posture := CENSUS_LOCKED; census_locked_at := logical clock; version += 1"
          - "every FrozenFile of this cycle with status == ACTIVE := LOCKED; each such file's version += 1"
          - "active_record_count recomputed"
        note: "Closes the reopen cycle: FROZEN -> REOPENED -> CENSUS_LOCKED -> FROZEN is a true loop, and reopen_count records how many laps were run."
      - from: CENSUS_LOCKED
        to: FROZEN
        trigger: "POST /ir/reporting-cycles/{cycle_id}/freeze"
        actor: IRDirector
        preconditions:
          - "snapshot_posture == CENSUS_LOCKED"
          - "at least one SurveyComponent exists for this cycle else ERR_COMPONENTS_NOT_READY"
          - "every SurveyComponent of this cycle has prep_status == CERTIFIED else ERR_COMPONENTS_NOT_READY"
        side_effects:
          - "snapshot_posture := FROZEN; frozen_at := logical clock; version += 1"
          - "every CohortDefinition of this cycle with status == DRAFT and adjusted_count >= 1 := LOCKED, locked_at := logical clock, rates recomputed per calculations.cohort_rate_variants (processed in created_at ASC); each such cohort's version += 1"
        note: "Cohorts whose adjusted_count == 0 are left DRAFT by the freeze (no rate is definable); they must be fixed and locked explicitly."
      - from: FROZEN
        to: REOPENED
        trigger: "POST /ir/reporting-cycles/{cycle_id}/reopen"
        actor: IRDirector
        preconditions:
          - "snapshot_posture == FROZEN"
          - "reopen_reason supplied (10-500 chars) else ERR_INVALID_REQUEST"
        side_effects:
          - "L1: snapshot_posture := REOPENED; reopen_count += 1; reopen_reason stored; version += 1"
          - "L2 (caused by L1): every SurveyComponent of this cycle with prep_status == CERTIFIED is reverted -> prep_status := DRAFT, certified_by_user_id := null, certification_statement := null, edit_status := NOT_RUN, and every EditCheck of that component with status IN {OPEN, EXPLAINED, REJECTED, ACCEPTED, WAIVED} := VOIDED; components processed in created_at ASC; each component's version += 1. Components with prep_status == SUBMITTED are NOT reverted (federal transmission is irreversible)."
          - "L3 (caused by each L2 reversion): every DashboardPublication of that reverted component with publication_status != WITHDRAWN is visited and set to RESTATEMENT_PENDING (PUBLISHED and RESTATED rows change status; rows already RESTATEMENT_PENDING keep it); publications processed in created_at ASC; every visited publication's version += 1"
          - "L4 (caused by each L3 visit): every RestatementRequest of that visited publication with status == SUBMITTED := VOIDED"
          - "every FrozenFile of this cycle keeps status LOCKED; a fresh extract with an identical coverage window may now supersede it"
      - from: FROZEN
        to: ARCHIVED
        trigger: "system event: the last SurveyComponent of the cycle reaches prep_status SUBMITTED"
        actor: system
        preconditions:
          - "snapshot_posture == FROZEN"
          - "every SurveyComponent of this cycle has prep_status == SUBMITTED"
        side_effects:
          - "snapshot_posture := ARCHIVED; version += 1"
        note: "Bubble-up: the parent's posture is derived from the aggregate state of its components at submit time."

  - entity: FrozenFile
    dimension: status
    shape: branching
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: LOCKED
        trigger: "system event: parent ReportingCycle census-lock"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := LOCKED; version += 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /ir/reporting-cycles/{cycle_id}/frozen-files with an identical (domain, coverage_start_date, coverage_end_date)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the new extract declares the same domain and the identical closed coverage window"
        side_effects:
          - "status := SUPERSEDED; version += 1; the new FrozenFile.supersedes_frozen_file_id := this row's id"
          - "parent cycle.active_record_count recomputed (this row's record_count leaves the sum, the new row's enters)"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "POST /ir/reporting-cycles/{cycle_id}/frozen-files with an identical (domain, coverage window) while the cycle is REOPENED"
        actor: system
        preconditions:
          - "status == LOCKED"
          - "parent cycle.snapshot_posture == REOPENED"
        side_effects:
          - "status := SUPERSEDED; version += 1; the new FrozenFile.supersedes_frozen_file_id := this row's id"
          - "parent cycle.active_record_count recomputed"
        note: "A component still pointing at a SUPERSEDED extract can no longer be prepared (ERR_FROZEN_FILE_SUPERSEDED)."

  - entity: SurveyComponent
    dimension: prep_status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    note: "First of two independent dimensions on the same row. prep_status is driven by operator actions; edit_status (second machine below) is derived from EditCheck children. The two evolve independently except at the certify gate, which requires prep_status == PREPARED AND edit_status == CLEARED."
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /ir/survey-components/{component_id}/prepare"
        actor: IRAnalyst
        preconditions:
          - "prep_status == DRAFT"
          - "parent cycle.snapshot_posture IN {CENSUS_LOCKED, REOPENED} else ERR_INVALID_CYCLE_STATE (census-date snapshot rule: a component may only be prepared from a census-locked extract)"
          - "referenced FrozenFile.status IN {ACTIVE, LOCKED} else ERR_FROZEN_FILE_SUPERSEDED"
          - "at least one ComponentMetric exists for this component else ERR_NO_METRICS"
        side_effects:
          - "prepared_by_user_id := X-User-ID; prep_status := PREPARED; version += 1"
          - "mapping_coverage_pct recomputed per calculations.mapping_coverage_pct"
          - "core_expense_per_fte_cents recomputed per calculations.core_expense_per_fte_cents when component_code == FINANCE (null otherwise)"
          - "EditCheck rows created per calculations.edit_check_generation, in ascending metric_key order with sequence_no 1..N, followed by the component-level UNMAPPED_ELEMENTS check when mapping_coverage_pct < 100.0"
          - "each ComponentMetric.variance_pct recomputed per calculations.prior_year_variance_pct"
          - "edit_status re-derived per calculations.edit_status_derivation: OPEN_EDITS when at least one check was created, CLEARED when none were"
          - "fatal_open_count recomputed"
      - from: PREPARED
        to: DRAFT
        trigger: "POST /ir/survey-components/{component_id}/revert-to-draft"
        actor: IRDirector
        preconditions:
          - "prep_status == PREPARED"
          - "decertify_reason supplied (10-500 chars)"
        side_effects:
          - "prep_status := DRAFT; prepared_by_user_id := null; version += 1"
          - "every EditCheck of this component with status IN {OPEN, EXPLAINED, REJECTED, ACCEPTED, WAIVED} := VOIDED (processed in sequence_no ASC)"
          - "edit_status := NOT_RUN; fatal_open_count := 0"
        note: "Closes the preparation loop DRAFT -> PREPARED -> DRAFT so a corrected metric can be re-prepared and re-flagged."
      - from: CERTIFIED
        to: DRAFT
        trigger: "POST /ir/survey-components/{component_id}/revert-to-draft"
        actor: IRDirector
        preconditions:
          - "prep_status == CERTIFIED"
          - "parent cycle.snapshot_posture != ARCHIVED else ERR_INVALID_CYCLE_STATE"
          - "decertify_reason supplied (10-500 chars)"
        side_effects:
          - "L1: prep_status := DRAFT; prepared_by_user_id := null; certified_by_user_id := null; certification_statement := null; version += 1"
          - "L1: every EditCheck of this component with status IN {OPEN, EXPLAINED, REJECTED, ACCEPTED, WAIVED} := VOIDED; edit_status := NOT_RUN; fatal_open_count := 0"
          - "L2 (caused by L1 decertification): every DashboardPublication of this component with publication_status != WITHDRAWN is visited and set to RESTATEMENT_PENDING (created_at ASC); every visited publication's version += 1"
          - "L3 (caused by each L2 visit): every RestatementRequest of that visited publication with status == SUBMITTED := VOIDED"
      - from: PREPARED
        to: CERTIFIED
        trigger: "POST /ir/survey-components/{component_id}/certify"
        actor: IRDirector
        preconditions:
          - "prep_status == PREPARED"
          - "parent cycle.snapshot_posture IN {CENSUS_LOCKED, REOPENED} else ERR_INVALID_CYCLE_STATE"
          - "edit_status == CLEARED else ERR_EDIT_CHECKS_UNRESOLVED"
          - "X-User-ID != prepared_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "logical clock <= cycle.collection_deadline else ERR_COLLECTION_DEADLINE_PASSED"
          - "certification_statement supplied (20-1000 chars)"
        side_effects:
          - "prep_status := CERTIFIED; certified_by_user_id := X-User-ID; certification_statement stored; version += 1"
      - from: CERTIFIED
        to: SUBMITTED
        trigger: "POST /ir/survey-components/{component_id}/submit"
        actor: IRDirector
        preconditions:
          - "prep_status == CERTIFIED"
          - "parent cycle.snapshot_posture == FROZEN else ERR_INVALID_CYCLE_STATE"
          - "logical clock <= cycle.collection_deadline else ERR_COLLECTION_DEADLINE_PASSED"
        side_effects:
          - "prep_status := SUBMITTED; submitted_at := logical clock; version += 1"
          - "bubble-up: when every SurveyComponent of the parent cycle has prep_status == SUBMITTED, the cycle transitions FROZEN -> ARCHIVED and cycle.version += 1"

  - entity: SurveyComponent
    dimension: edit_status
    shape: compound
    initial_state: NOT_RUN
    terminal_states: []
    note: "Second, independent dimension on the same row: it is a pure function of the component's EditCheck children (calculations.edit_status_derivation) and is re-derived after every EditCheck mutation. It cycles: EXPLAINED -> OPEN_EDITS -> EXPLAINED for every rejection round."
    transitions:
      - from: NOT_RUN
        to: OPEN_EDITS
        trigger: "system event: prepare created at least one EditCheck"
        actor: system
        preconditions: ["at least one EditCheck of this component has status == OPEN"]
        side_effects: ["edit_status := OPEN_EDITS; fatal_open_count recomputed"]
      - from: NOT_RUN
        to: CLEARED
        trigger: "system event: prepare created zero EditCheck rows"
        actor: system
        preconditions: ["the prepare run raised no checks (every metric passed and mapping_coverage_pct == 100.0)"]
        side_effects: ["edit_status := CLEARED; fatal_open_count := 0"]
      - from: OPEN_EDITS
        to: EXPLAINED
        trigger: "system event: the last EditCheck with status IN {OPEN, REJECTED} is explained"
        actor: system
        preconditions: ["no EditCheck of this component has status IN {OPEN, REJECTED}", "at least one has status == EXPLAINED"]
        side_effects: ["edit_status := EXPLAINED"]
      - from: EXPLAINED
        to: CLEARED
        trigger: "system event: the last EXPLAINED EditCheck is adjudicated ACCEPTED or WAIVED"
        actor: system
        preconditions: ["every EditCheck of this component has status IN {ACCEPTED, WAIVED, VOIDED}"]
        side_effects: ["edit_status := CLEARED; fatal_open_count := 0"]
      - from: EXPLAINED
        to: OPEN_EDITS
        trigger: "system event: an EditCheck is adjudicated REJECTED"
        actor: system
        preconditions: ["at least one EditCheck of this component has status == REJECTED"]
        side_effects: ["edit_status := OPEN_EDITS; fatal_open_count recomputed"]
        note: "The rejection loop: the component falls back out of EXPLAINED and must be re-explained before it can be certified."
      - from: OPEN_EDITS
        to: NOT_RUN
        trigger: "system event: revert-to-draft voided every EditCheck"
        actor: system
        preconditions: ["every EditCheck of this component has status == VOIDED"]
        side_effects: ["edit_status := NOT_RUN"]
      - from: CLEARED
        to: NOT_RUN
        trigger: "system event: revert-to-draft voided every EditCheck"
        actor: system
        preconditions: ["every EditCheck of this component has status == VOIDED"]
        side_effects: ["edit_status := NOT_RUN"]
      - from: EXPLAINED
        to: NOT_RUN
        trigger: "system event: revert-to-draft voided every EditCheck"
        actor: system
        preconditions: ["every EditCheck of this component has status == VOIDED"]
        side_effects: ["edit_status := NOT_RUN"]

  - entity: EditCheck
    dimension: status
    shape: branching
    initial_state: OPEN
    terminal_states: [ACCEPTED, WAIVED, VOIDED]
    transitions:
      - from: OPEN
        to: EXPLAINED
        trigger: "POST /ir/edit-checks/{edit_check_id}/explain"
        actor: IRAnalyst
        preconditions:
          - "status == OPEN"
          - "parent component.prep_status == PREPARED else ERR_INVALID_COMPONENT_STATE"
          - "explanation_text length >= 20 else ERR_EXPLANATION_TOO_SHORT"
          - "prior_year_comparison_note length >= 10 else ERR_INVALID_REQUEST"
        side_effects:
          - "status := EXPLAINED; explanation_text and prior_year_comparison_note stored; explained_by_user_id := X-User-ID; explanation_round += 1; version += 1"
          - "parent component.edit_status re-derived; component.version += 1"
      - from: REJECTED
        to: EXPLAINED
        trigger: "POST /ir/edit-checks/{edit_check_id}/explain"
        actor: IRAnalyst
        preconditions:
          - "status == REJECTED"
          - "parent component.prep_status == PREPARED else ERR_INVALID_COMPONENT_STATE"
          - "explanation_text length >= 20 else ERR_EXPLANATION_TOO_SHORT"
        side_effects:
          - "status := EXPLAINED; explanation_text replaced; explained_by_user_id := X-User-ID; explanation_round += 1; version += 1"
          - "parent component.edit_status re-derived (OPEN_EDITS -> EXPLAINED once no OPEN/REJECTED check remains); component.version += 1"
        note: "Closes the resolution loop EXPLAINED -> REJECTED -> EXPLAINED; explanation_round counts the negotiation rounds."
      - from: EXPLAINED
        to: ACCEPTED
        trigger: "POST /ir/edit-checks/{edit_check_id}/adjudicate with decision ACCEPT"
        actor: IRDirector
        preconditions:
          - "status == EXPLAINED"
          - "X-User-ID != explained_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status := ACCEPTED; adjudicated_by_user_id := X-User-ID; adjudication_note stored; version += 1"
          - "parent component.edit_status re-derived; component.fatal_open_count recomputed; component.version += 1"
      - from: EXPLAINED
        to: WAIVED
        trigger: "POST /ir/edit-checks/{edit_check_id}/adjudicate with decision WAIVE"
        actor: IRDirector
        preconditions:
          - "status == EXPLAINED"
          - "severity == WARNING else ERR_WAIVER_NOT_PERMITTED"
          - "X-User-ID != explained_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status := WAIVED; adjudicated_by_user_id := X-User-ID; version += 1"
          - "parent component.edit_status re-derived; component.version += 1"
        note: "Divergent branch: WAIVE clears the check without accepting the explanation and is only legal for WARNING severity."
      - from: EXPLAINED
        to: REJECTED
        trigger: "POST /ir/edit-checks/{edit_check_id}/adjudicate with decision REJECT"
        actor: IRDirector
        preconditions:
          - "status == EXPLAINED"
          - "adjudication_note supplied (10-500 chars) else ERR_INVALID_REQUEST"
          - "X-User-ID != explained_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status := REJECTED; adjudicated_by_user_id := X-User-ID; adjudication_note stored; version += 1"
          - "parent component.edit_status := OPEN_EDITS (re-derived); component.fatal_open_count recomputed; component.version += 1"
      - from: OPEN
        to: VOIDED
        trigger: "system event: parent component reverted to DRAFT (directly or via cycle reopen)"
        actor: system
        preconditions: ["status IN {OPEN, EXPLAINED, REJECTED, ACCEPTED, WAIVED}"]
        side_effects: ["status := VOIDED; version += 1"]
      - from: EXPLAINED
        to: VOIDED
        trigger: "system event: parent component reverted to DRAFT (directly or via cycle reopen)"
        actor: system
        preconditions: ["status IN {OPEN, EXPLAINED, REJECTED, ACCEPTED, WAIVED}"]
        side_effects: ["status := VOIDED; version += 1"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "system event: parent component reverted to DRAFT (directly or via cycle reopen)"
        actor: system
        preconditions: ["status IN {OPEN, EXPLAINED, REJECTED, ACCEPTED, WAIVED}"]
        side_effects: ["status := VOIDED; version += 1"]
      - from: REJECTED
        to: VOIDED
        trigger: "system event: parent component reverted to DRAFT (directly or via cycle reopen)"
        actor: system
        preconditions: ["status IN {OPEN, EXPLAINED, REJECTED, ACCEPTED, WAIVED}"]
        side_effects: ["status := VOIDED; version += 1"]
      - from: WAIVED
        to: VOIDED
        trigger: "system event: parent component reverted to DRAFT (directly or via cycle reopen)"
        actor: system
        preconditions: ["status IN {OPEN, EXPLAINED, REJECTED, ACCEPTED, WAIVED}"]
        side_effects: ["status := VOIDED; version += 1"]

  - entity: CohortDefinition
    dimension: status
    shape: linear
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /ir/cohorts/{cohort_id}/lock"
        actor: RegistrarOfficer
        preconditions:
          - "status == DRAFT else ERR_COHORT_LOCKED"
          - "parent cycle.snapshot_posture != ARCHIVED else ERR_INVALID_CYCLE_STATE"
          - "initial_count >= 1 else ERR_EMPTY_COHORT"
          - "no CohortMember of this cohort has exclusion_status == CLAIMED else ERR_UNRESOLVED_EXCLUSION_CLAIM"
          - "adjusted_count >= 1 else ERR_EMPTY_COHORT_DENOMINATOR"
        side_effects:
          - "status := LOCKED; locked_at := logical clock; version += 1"
          - "federal_rate_pct and ranking_rate_pct recomputed per calculations.cohort_rate_variants"
      - from: DRAFT
        to: LOCKED
        trigger: "system event: parent ReportingCycle freeze"
        actor: system
        preconditions:
          - "status == DRAFT"
          - "adjusted_count >= 1 (cohorts with a zero denominator are skipped by the freeze)"
        side_effects:
          - "status := LOCKED; locked_at := logical clock; version += 1"
          - "federal_rate_pct and ranking_rate_pct recomputed"

  - entity: CohortMember
    dimension: exclusion_status
    shape: cyclic
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: CLAIMED
        trigger: "POST /ir/cohort-members/{member_id}/exclusion-claim"
        actor: RegistrarOfficer
        preconditions:
          - "exclusion_status == NONE else ERR_INVALID_EXCLUSION_STATE"
          - "parent cohort's cycle.snapshot_posture != ARCHIVED else ERR_INVALID_CYCLE_STATE"
          - "exclusion_code IN {DECEASED, PERMANENTLY_DISABLED, ARMED_FORCES, FOREIGN_AID_SERVICE, CHURCH_MISSION} else ERR_INVALID_EXCLUSION_CODE"
        side_effects:
          - "exclusion_status := CLAIMED; exclusion_code and exclusion_evidence_note stored; exclusion_claimed_by_user_id := X-User-ID; version += 1"
        note: "Claims are accepted on LOCKED cohorts too — late allowable exclusions are exactly what drives restated dashboards."
      - from: CLAIMED
        to: APPROVED
        trigger: "POST /ir/cohort-members/{member_id}/exclusion-review with decision APPROVE"
        actor: IRDirector
        preconditions:
          - "exclusion_status == CLAIMED else ERR_INVALID_EXCLUSION_STATE"
          - "parent cohort's cycle.snapshot_posture != ARCHIVED else ERR_INVALID_CYCLE_STATE"
        side_effects:
          - "L1: exclusion_status := APPROVED; exclusion_reviewed_by_user_id := X-User-ID; review_note stored; version += 1"
          - "L2 (caused by L1): parent CohortDefinition recomputes exclusion_count, adjusted_count, federal_rate_pct and ranking_rate_pct per calculations.cohort_rate_variants; cohort.version += 1. Invariant preserved: adjusted_count + exclusion_count == initial_count."
          - "L3 (caused by the L2 federal_rate_pct change, ONLY when cohort.status == LOCKED): every DashboardPublication whose metric_key == cohort.publication_metric_key, whose parent component's cycle_id == cohort.cycle_id and whose publication_status == PUBLISHED := RESTATEMENT_PENDING; publications processed in created_at ASC; each publication's version += 1 for the whole visit"
          - "L4 (caused by each L3 flip): every RestatementRequest of that publication with status == SUBMITTED := SUPERSEDED, then a new RestatementRequest is created with origin CASCADE, requested_by_user_id 'SYSTEM', proposed_value := cohort.federal_rate_pct, baseline_value := publication.published_value, justification := 'Cascade restatement: cohort exclusion decision applied', status SUBMITTED, delta_pct and public_notice_required per calculations.restatement_materiality"
      - from: CLAIMED
        to: DENIED
        trigger: "POST /ir/cohort-members/{member_id}/exclusion-review with decision DENY"
        actor: IRDirector
        preconditions:
          - "exclusion_status == CLAIMED else ERR_INVALID_EXCLUSION_STATE"
          - "parent cohort's cycle.snapshot_posture != ARCHIVED else ERR_INVALID_CYCLE_STATE"
        side_effects:
          - "exclusion_status := DENIED; exclusion_reviewed_by_user_id := X-User-ID; review_note stored; version += 1"
          - "parent CohortDefinition counts recomputed (exclusion_count unchanged, since a CLAIMED member never entered it); cohort.version += 1"
      - from: APPROVED
        to: DENIED
        trigger: "POST /ir/cohort-members/{member_id}/exclusion-review with decision DENY"
        actor: IRDirector
        preconditions:
          - "exclusion_status == APPROVED else ERR_INVALID_EXCLUSION_STATE"
          - "parent cohort's cycle.snapshot_posture != ARCHIVED else ERR_INVALID_CYCLE_STATE"
        side_effects:
          - "exclusion_status := DENIED; exclusion_reviewed_by_user_id := X-User-ID; version += 1"
          - "parent CohortDefinition recomputes exclusion_count (-1), adjusted_count (+1), federal_rate_pct and ranking_rate_pct; cohort.version += 1"
          - "when cohort.status == LOCKED the same L3/L4 dashboard cascade fires with the restored federal_rate_pct"
        note: "Compensating action for the APPROVE transition: it must restore CohortDefinition.adjusted_count, exclusion_count and both rate variants to their exact pre-approval values (calculations.cohort_headcount_conservation)."
      - from: DENIED
        to: CLAIMED
        trigger: "POST /ir/cohort-members/{member_id}/exclusion-claim"
        actor: RegistrarOfficer
        preconditions:
          - "exclusion_status == DENIED"
          - "parent cohort's cycle.snapshot_posture != ARCHIVED else ERR_INVALID_CYCLE_STATE"
          - "exclusion_code IN the allowed enum else ERR_INVALID_EXCLUSION_CODE"
        side_effects:
          - "exclusion_status := CLAIMED; exclusion_code and exclusion_evidence_note replaced; exclusion_claimed_by_user_id := X-User-ID; version += 1"
        note: "Re-claim loop: a denied exclusion can be refiled with new evidence."

  - entity: DataElementMapping
    dimension: status
    shape: cyclic
    initial_state: PROPOSED
    terminal_states: [VALIDATED]
    transitions:
      - from: PROPOSED
        to: VALIDATED
        trigger: "POST /ir/element-mappings/{mapping_id}/validate with decision APPROVE"
        actor: DataSteward
        preconditions:
          - "status == PROPOSED else ERR_INVALID_MAPPING_STATE"
          - "cycle.snapshot_posture NOT IN {FROZEN, ARCHIVED} else ERR_CYCLE_FROZEN"
          - "every value of value_map appears in the target FederalDefinition.value_domain else ERR_VALUE_DOMAIN_VIOLATION"
        side_effects:
          - "status := VALIDATED; validated_by_user_id := X-User-ID; rejection_reason := null; version += 1"
          - "any SurveyComponent of the same cycle recomputes mapping_coverage_pct at its next prepare (coverage is not cached on the component until then)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /ir/element-mappings/{mapping_id}/validate with decision REJECT"
        actor: DataSteward
        preconditions:
          - "status == PROPOSED else ERR_INVALID_MAPPING_STATE"
          - "rejection_reason supplied (10-500 chars) else ERR_REJECTION_REASON_REQUIRED"
        side_effects:
          - "status := REJECTED; validated_by_user_id := X-User-ID; rejection_reason stored; version += 1"
        note: "Divergent branch of the same trigger: APPROVE writes a terminal VALIDATED row, REJECT writes a reviewable one and demands a reason."
      - from: REJECTED
        to: PROPOSED
        trigger: "POST /ir/element-mappings/{mapping_id}/revise"
        actor: IRAnalyst
        preconditions:
          - "status == REJECTED else ERR_INVALID_MAPPING_STATE"
          - "cycle.snapshot_posture NOT IN {FROZEN, ARCHIVED} else ERR_CYCLE_FROZEN"
          - "every value of the new value_map appears in the target FederalDefinition.value_domain else ERR_VALUE_DOMAIN_VIOLATION"
        side_effects:
          - "status := PROPOSED; transform_expression and value_map replaced; rejection_reason := null; revision_round += 1; version += 1"

  - entity: ExternalSubmission
    dimension: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [TRANSMITTED]
    transitions:
      - from: DRAFT
        to: RECONCILED
        trigger: "POST /ir/external-submissions/{submission_id}/reconcile (effective_delta_pct <= tolerance_pct)"
        actor: IRAnalyst
        preconditions:
          - "status == DRAFT else ERR_INVALID_SUBMISSION_STATE"
          - "referenced component.prep_status IN {CERTIFIED, SUBMITTED} else ERR_SOURCE_NOT_CERTIFIED"
          - "a ComponentMetric with metric_key == submission.metric_key exists on that component else ERR_FEDERAL_VALUE_UNAVAILABLE"
          - "that metric's reported_value != 0 else ERR_ZERO_BASE_RECONCILIATION"
        side_effects:
          - "federal_value, raw_delta_pct, allowance_pct, effective_delta_pct and tolerance_pct written per calculations.submission_reconciliation; status := RECONCILED; version += 1"
      - from: DRAFT
        to: VARIANCE_HOLD
        trigger: "POST /ir/external-submissions/{submission_id}/reconcile (effective_delta_pct > tolerance_pct)"
        actor: IRAnalyst
        preconditions:
          - "status == DRAFT else ERR_INVALID_SUBMISSION_STATE"
          - "referenced component.prep_status IN {CERTIFIED, SUBMITTED} else ERR_SOURCE_NOT_CERTIFIED"
          - "a ComponentMetric with metric_key == submission.metric_key exists on that component else ERR_FEDERAL_VALUE_UNAVAILABLE"
        side_effects:
          - "the same five reconciliation fields are written; status := VARIANCE_HOLD; version += 1"
        note: "Same trigger, divergent branch chosen purely by the threshold comparison in step 5 of calculations.submission_reconciliation."
      - from: VARIANCE_HOLD
        to: RECONCILED
        trigger: "POST /ir/external-submissions/{submission_id}/variance-override"
        actor: IRDirector
        preconditions:
          - "status == VARIANCE_HOLD else ERR_INVALID_SUBMISSION_STATE"
          - "override_reason supplied (20-500 chars) else ERR_INVALID_REQUEST"
        side_effects:
          - "status := RECONCILED; override_reason stored; overridden_by_user_id := X-User-ID; version += 1"
          - "the five reconciliation fields are NOT recomputed — the recorded variance is preserved for audit"
      - from: RECONCILED
        to: TRANSMITTED
        trigger: "POST /ir/external-submissions/{submission_id}/transmit"
        actor: IRDirector
        preconditions:
          - "status == RECONCILED else ERR_INVALID_SUBMISSION_STATE"
          - "cycle.snapshot_posture IN {FROZEN, ARCHIVED} else ERR_CYCLE_NOT_FROZEN"
          - "logical clock <= cycle.collection_deadline else ERR_COLLECTION_DEADLINE_PASSED"
          - "transmission_reference supplied (3-64 chars)"
        side_effects:
          - "status := TRANSMITTED; transmission_reference stored; transmitted_at := logical clock; version += 1"

  - entity: DashboardPublication
    dimension: publication_status
    shape: cyclic
    initial_state: PUBLISHED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PUBLISHED
        to: RESTATEMENT_PENDING
        trigger: "POST /ir/publications/{publication_id}/restatements, or a cascade from component decertification / cohort exclusion decision"
        actor: IRAnalyst
        preconditions:
          - "publication_status == PUBLISHED else ERR_INVALID_PUBLICATION_STATE (a WITHDRAWN publication is never visited by a cascade and never accepts a restatement)"
        side_effects:
          - "publication_status := RESTATEMENT_PENDING; version += 1"
          - "when triggered by a restatement creation: every other RestatementRequest of this publication with status == SUBMITTED := SUPERSEDED"
      - from: RESTATEMENT_PENDING
        to: RESTATED
        trigger: "POST /ir/restatements/{restatement_id}/approve"
        actor: IRDirector
        preconditions:
          - "publication_status == RESTATEMENT_PENDING else ERR_INVALID_PUBLICATION_STATE"
          - "the approved RestatementRequest belongs to this publication and has status == SUBMITTED"
        side_effects:
          - "published_value := request.proposed_value; net_applied_delta += (request.proposed_value - request.baseline_value); restatement_count += 1; publication_status := RESTATED; version += 1"
          - "invariant preserved: published_value == original_value + net_applied_delta (calculations.publication_value_conservation)"
      - from: RESTATED
        to: RESTATEMENT_PENDING
        trigger: "POST /ir/publications/{publication_id}/restatements, or a cascade from component decertification / cycle reopen"
        actor: IRAnalyst
        preconditions:
          - "publication_status == RESTATED"
        side_effects:
          - "publication_status := RESTATEMENT_PENDING; version += 1"
        note: "Restatement loop: a restated figure can itself be restated, which is how a compensating restatement returns the figure to original_value."
      - from: RESTATEMENT_PENDING
        to: PUBLISHED
        trigger: "POST /ir/restatements/{restatement_id}/reject"
        actor: IRDirector
        preconditions:
          - "publication_status == RESTATEMENT_PENDING"
          - "no other RestatementRequest of this publication remains with status == SUBMITTED after the rejection"
          - "restatement_count == 0"
        side_effects:
          - "publication_status := PUBLISHED; version += 1"
        note: "Compensation: rejecting the only pending request restores the pre-request status. A publication that has already applied a restatement returns to RESTATED instead."
      - from: RESTATEMENT_PENDING
        to: RESTATED
        trigger: "POST /ir/restatements/{restatement_id}/reject on a publication with restatement_count >= 1"
        actor: IRDirector
        preconditions:
          - "publication_status == RESTATEMENT_PENDING"
          - "no other RestatementRequest of this publication remains with status == SUBMITTED after the rejection"
          - "restatement_count >= 1"
        side_effects:
          - "publication_status := RESTATED; version += 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /ir/publications/{publication_id}/withdraw"
        actor: IRDirector
        preconditions:
          - "publication_status IN {PUBLISHED, RESTATEMENT_PENDING, RESTATED} else ERR_INVALID_PUBLICATION_STATE"
          - "withdrawal_reason supplied (10-500 chars)"
        side_effects:
          - "publication_status := WITHDRAWN; withdrawal_reason stored; version += 1"
          - "every RestatementRequest of this publication with status == SUBMITTED := VOIDED"
          - "the row leaves the effective-window occupancy set, so a new publication may claim its window"
      - from: RESTATEMENT_PENDING
        to: WITHDRAWN
        trigger: "POST /ir/publications/{publication_id}/withdraw"
        actor: IRDirector
        preconditions:
          - "publication_status IN {PUBLISHED, RESTATEMENT_PENDING, RESTATED}"
          - "withdrawal_reason supplied"
        side_effects:
          - "publication_status := WITHDRAWN; every SUBMITTED RestatementRequest of this publication := VOIDED; version += 1"
      - from: RESTATED
        to: WITHDRAWN
        trigger: "POST /ir/publications/{publication_id}/withdraw"
        actor: IRDirector
        preconditions:
          - "publication_status IN {PUBLISHED, RESTATEMENT_PENDING, RESTATED}"
          - "withdrawal_reason supplied"
        side_effects:
          - "publication_status := WITHDRAWN; every SUBMITTED RestatementRequest of this publication := VOIDED; version += 1"

  - entity: RestatementRequest
    dimension: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [APPLIED, REJECTED, SUPERSEDED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPLIED
        trigger: "POST /ir/restatements/{restatement_id}/approve"
        actor: IRDirector
        preconditions:
          - "status == SUBMITTED else ERR_INVALID_RESTATEMENT_STATE"
          - "parent publication.publication_status == RESTATEMENT_PENDING else ERR_INVALID_PUBLICATION_STATE"
          - "X-User-ID != requested_by_user_id else ERR_SEGREGATION_OF_DUTIES (requests with requested_by_user_id 'SYSTEM' can never collide)"
          - "when public_notice_required is true, public_notice_reference supplied (3-120 chars) else ERR_PUBLIC_NOTICE_REQUIRED"
        side_effects:
          - "status := APPLIED; approved_by_user_id := X-User-ID; public_notice_reference stored; version += 1"
          - "parent publication mutated per its RESTATEMENT_PENDING -> RESTATED transition"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ir/restatements/{restatement_id}/reject"
        actor: IRDirector
        preconditions:
          - "status == SUBMITTED else ERR_INVALID_RESTATEMENT_STATE"
          - "X-User-ID != requested_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "rejection_reason supplied (10-500 chars) else ERR_REJECTION_REASON_REQUIRED"
        side_effects:
          - "status := REJECTED; approved_by_user_id := X-User-ID; rejection_reason stored; version += 1"
          - "parent publication returns to PUBLISHED (restatement_count == 0) or RESTATED (restatement_count >= 1)"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system event: a newer RestatementRequest is created on the same publication"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: ["status := SUPERSEDED; version += 1"]
      - from: SUBMITTED
        to: VOIDED
        trigger: "system event: the parent publication's component is decertified (directly or by cycle reopen), or the publication is withdrawn"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: ["status := VOIDED; version += 1"]

  - entity: DataRequest
    dimension: status
    shape: branching
    initial_state: RECEIVED
    terminal_states: [RELEASED, SUPPRESSED_RELEASE, REFUSED]
    transitions:
      - from: RECEIVED
        to: SCREENED
        trigger: "POST /ir/data-requests/{request_id}/screen (SUM of raw_count >= min_cell_size)"
        actor: DisclosureOfficer
        preconditions:
          - "status == RECEIVED else ERR_INVALID_DATA_REQUEST_STATE"
          - "cycle.snapshot_posture IN {FROZEN, ARCHIVED} else ERR_CYCLE_NOT_FROZEN"
          - "cell_count >= 1 else ERR_NO_CELLS_TO_SCREEN"
        side_effects:
          - "every DisclosureCell of this request is assigned suppression_state and released_count per calculations.disclosure_avoidance (variant selected by avoidance_method); cells processed in dimension_group ASC then dimension_key ASC; each cell's version += 1"
          - "suppressed_cell_count, released_cell_count and residual_disclosure_risk recomputed; screened_at := logical clock; screened_by_user_id := X-User-ID; status := SCREENED; version += 1"
      - from: RECEIVED
        to: REFUSED
        trigger: "POST /ir/data-requests/{request_id}/screen (SUM of raw_count < min_cell_size)"
        actor: DisclosureOfficer
        preconditions:
          - "status == RECEIVED else ERR_INVALID_DATA_REQUEST_STATE"
          - "cycle.snapshot_posture IN {FROZEN, ARCHIVED} else ERR_CYCLE_NOT_FROZEN"
          - "cell_count >= 1 else ERR_NO_CELLS_TO_SCREEN"
        side_effects:
          - "status := REFUSED; refusal_reason := 'AGGREGATE_BELOW_MINIMUM'; screened_at := logical clock; screened_by_user_id := X-User-ID; version += 1"
          - "NO DisclosureCell is mutated: every cell keeps suppression_state PENDING and released_count null"
        note: "Divergent branch of the same trigger; the whole crosstab is too small to protect, so nothing is computed at all."
      - from: SCREENED
        to: RELEASED
        trigger: "POST /ir/data-requests/{request_id}/release (released_cell_count >= 1)"
        actor: DisclosureOfficer
        preconditions:
          - "status == SCREENED else ERR_INVALID_DATA_REQUEST_STATE"
          - "released_cell_count >= 1"
          - "NOT (residual_disclosure_risk == true AND requester_type IN {EXTERNAL, MEDIA}) else ERR_SMALL_CELL_DISCLOSURE"
        side_effects:
          - "status := RELEASED; release_note stored; version += 1"
      - from: SCREENED
        to: SUPPRESSED_RELEASE
        trigger: "POST /ir/data-requests/{request_id}/release (released_cell_count == 0)"
        actor: DisclosureOfficer
        preconditions:
          - "status == SCREENED else ERR_INVALID_DATA_REQUEST_STATE"
          - "released_cell_count == 0"
          - "NOT (residual_disclosure_risk == true AND requester_type IN {EXTERNAL, MEDIA}) else ERR_SMALL_CELL_DISCLOSURE"
        side_effects:
          - "status := SUPPRESSED_RELEASE; release_note stored; version += 1"
        note: "Boundary branch: zero releasable cells still closes the request, but as a suppressed release rather than a release."

  - entity: DisclosureCell
    dimension: suppression_state
    shape: branching
    initial_state: PENDING
    terminal_states: [RELEASED, PRIMARY_SUPPRESSED, COMPLEMENTARY_SUPPRESSED]
    transitions:
      - from: PENDING
        to: PRIMARY_SUPPRESSED
        trigger: "system event: screening under SMALL_CELL_SUPPRESSION with 0 < raw_count < request.min_cell_size"
        actor: system
        preconditions: ["suppression_state == PENDING", "parent request.avoidance_method == SMALL_CELL_SUPPRESSION"]
        side_effects: ["suppression_state := PRIMARY_SUPPRESSED; released_count := null; version += 1"]
      - from: PENDING
        to: COMPLEMENTARY_SUPPRESSED
        trigger: "system event: screening selected this cell as the complementary suppression for its dimension_group"
        actor: system
        preconditions:
          - "suppression_state == PENDING"
          - "the cell's dimension_group ended primary suppression with exactly one PRIMARY_SUPPRESSED cell"
          - "the cell is the group's eligible candidate with the smallest raw_count (tie-break dimension_key ASC) among cells with raw_count > 0 that were not primary-suppressed"
        side_effects: ["suppression_state := COMPLEMENTARY_SUPPRESSED; released_count := null; version += 1"]
      - from: PENDING
        to: RELEASED
        trigger: "system event: screening cleared the cell"
        actor: system
        preconditions:
          - "suppression_state == PENDING"
          - "under SMALL_CELL_SUPPRESSION: raw_count == 0 OR raw_count >= request.min_cell_size, and the cell was not chosen as the complementary suppression"
          - "under CONTROLLED_ROUNDING: always"
        side_effects: ["suppression_state := RELEASED; released_count := raw_count (SMALL_CELL_SUPPRESSION) or the base-5 rounded value (CONTROLLED_ROUNDING); version += 1"]

# =====================================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned mechanism)
# =====================================================================================
concurrency_rules:
  - rule_id: frozen-file-create-stale-cycle
    parent_entity: ReportingCycle
    write_endpoint: "POST /ir/reporting-cycles/{cycle_id}/frozen-files"
    occ_field: "expected_cycle_version"
    description: |
      Registering a census extract whose (domain, coverage window) matches an existing
      non-superseded extract legitimately supersedes that extract under §1.2's
      FrozenFile ACTIVE -> SUPERSEDED rule, so a writer whose view of the cycle predates
      an already-registered replacement would silently discard governance state it never
      saw. The write is therefore rejected when expected_cycle_version differs from the
      cycle's current version.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
  - rule_id: restatement-create-stale-publication
    parent_entity: DashboardPublication
    write_endpoint: "POST /ir/publications/{publication_id}/restatements"
    occ_field: "expected_publication_version"
    description: |
      Filing a restatement supersedes every other SUBMITTED request on the same
      publication and captures baseline_value from the publication's current
      published_value, both of which are legitimate under §1.2's restatement loop. A
      request carrying a stale expected_publication_version would therefore be measured
      against a baseline the client never observed, so it is rejected.
    error_id: ERR_STALE_PUBLICATION_VERSION
    http_status: 412

# =====================================================================================
# §1.3 Calculation Rules Table
# =====================================================================================
calculations:
  - name: prior_year_variance_pct
    trigger: "on POST /ir/survey-components/{component_id}/prepare (side effect: each ComponentMetric.variance_pct recomputed) and on PATCH /ir/component-metrics/{metric_id}"
    algorithm: threshold
    formula: |
      if prior_year_value is null:            variance_pct = null
      elif prior_year_value == 0:             variance_pct = null      # zero-base, see edit_check_generation rule 1
      else:
          variance_pct = round_half_up(abs(reported_value - prior_year_value) / prior_year_value * 100, 1)
    input_set: "The single ComponentMetric row being evaluated; no other rows participate."
    constants:
      PY_VARIANCE_WARNING_PCT: 10.0
      PY_VARIANCE_FATAL_PCT: 25.0
    precision: "1 decimal place, round_half_up; comparisons against the constants use >= (10.0 exactly is a WARNING, 25.0 exactly is FATAL, 9.9 raises nothing)"

  - name: edit_check_generation
    trigger: "on POST /ir/survey-components/{component_id}/prepare (side effect: EditCheck rows created)"
    algorithm: constraint_propagation
    formula: |
      seq = 0
      for m in ComponentMetric rows of this component, ordered by metric_key ASC:
          if   m.prior_year_value is not null and m.prior_year_value == 0 and m.reported_value > 0:
                   emit(check_code="PY_ZERO_BASE_" + m.metric_key, severity=FATAL,   variance_pct=null)
          elif m.variance_pct is not null and m.variance_pct >= PY_VARIANCE_FATAL_PCT:
                   emit(check_code="PY_VAR_" + m.metric_key,       severity=FATAL,   variance_pct=m.variance_pct)
          elif m.variance_pct is not null and m.variance_pct >= PY_VARIANCE_WARNING_PCT:
                   emit(check_code="PY_VAR_" + m.metric_key,       severity=WARNING, variance_pct=m.variance_pct)
          elif m.prior_year_value is null and m.reported_value == 0:
                   emit(check_code="ZERO_NO_BASE_" + m.metric_key, severity=WARNING, variance_pct=null)
          else:    emit nothing
      # component-level check, always last:
      if mapping_coverage_pct < 100.0:
               emit(check_code="UNMAPPED_ELEMENTS", severity=FATAL, metric_key="ALL", variance_pct=null)
      # emit(): seq += 1; create EditCheck with sequence_no=seq, status=OPEN,
      #         observed_value=m.reported_value, prior_year_value=m.prior_year_value
    input_set: "Every ComponentMetric of the component (no status filter — metrics have no status), evaluated in metric_key ASC order; exactly one check at most per metric; ties impossible because metric_key is unique per component."
    constants:
      PY_VARIANCE_WARNING_PCT: 10.0
      PY_VARIANCE_FATAL_PCT: 25.0
    precision: "Integer sequence_no starting at 1; the branch cascade is evaluated top-down and stops at the first matching rule per metric."

  - name: mapping_coverage_pct
    trigger: "on POST /ir/survey-components/{component_id}/prepare (side effect: SurveyComponent.mapping_coverage_pct written)"
    algorithm: aggregation
    formula: |
      required = FederalDefinition rows where survey_component == component.component_code
                 AND required == true
                 AND effective_cycle_code == parent_cycle.cycle_code
      if count(required) == 0:
          mapping_coverage_pct = 100.0          # empty-set convention: nothing required is fully covered
      else:
          covered = count of d in required such that there EXISTS a DataElementMapping with
                    definition_id == d.id AND cycle_id == component.cycle_id AND status == 'VALIDATED'
          mapping_coverage_pct = round_half_up(covered / count(required) * 100, 1)
    input_set: "Definitions filtered by survey_component + required == true + effective_cycle_code == cycle.cycle_code; mappings filtered by status == VALIDATED only (PROPOSED and REJECTED never count). local_system_code is ignored: any one validated mapping covers the definition."
    constants:
      FULL_COVERAGE_PCT: 100.0
    precision: "1 decimal place, round_half_up. Comparison in edit_check_generation is `< 100.0`, so 99.9 raises UNMAPPED_ELEMENTS and 100.0 does not."

  - name: edit_status_derivation
    trigger: "after every EditCheck creation, explain, adjudicate or void, and on prepare/revert-to-draft"
    algorithm: projection
    formula: |
      checks = EditCheck rows of this component
      if count(checks) == 0 or every check.status == 'VOIDED':      edit_status = 'NOT_RUN'
      elif any check.status in {'OPEN','REJECTED'}:                 edit_status = 'OPEN_EDITS'
      elif any check.status == 'EXPLAINED':                         edit_status = 'EXPLAINED'
      else:                                                         edit_status = 'CLEARED'
      # special case pinned: a prepare run that raised zero checks yields 'CLEARED', not 'NOT_RUN'
      fatal_open_count = count(checks where severity == 'FATAL' and status in {'OPEN','EXPLAINED','REJECTED'})
    input_set: "All EditCheck rows of the component including VOIDED ones; VOIDED rows never block the CLEARED verdict."
    constants: {}
    precision: "Exact enumeration; the branch order above is normative."

  - name: cohort_rate_variants
    trigger: "on POST /ir/cohorts/{cohort_id}/members, PATCH /ir/cohort-members/{member_id}, POST /ir/cohort-members/{member_id}/exclusion-review, POST /ir/cohorts/{cohort_id}/lock and the ReportingCycle freeze cascade"
    algorithm: aggregation
    formula: |
      members         = CohortMember rows of this cohort (no filter)
      initial_count   = count(members)
      exclusion_count = count(m in members where m.exclusion_status == 'APPROVED')
      adjusted_count  = initial_count - exclusion_count
      completers_count = count(m where m.outcome == 'COMPLETED_150')
      retained_count   = count(m where m.outcome in {'COMPLETED_150','STILL_ENROLLED'})

      # --- variant FEDERAL: exclusions removed from BOTH sides ---
      fed_num = count(m where m.exclusion_status != 'APPROVED'
                        and m.outcome == 'COMPLETED_150')                      if cohort_type == 'GRAD_RATE_150'
                count(m where m.exclusion_status != 'APPROVED'
                        and m.outcome in {'COMPLETED_150','STILL_ENROLLED'})   if cohort_type == 'RETENTION_FT'
      federal_rate_pct = null if adjusted_count == 0
                         else round_half_up(fed_num / adjusted_count * 100, 1)

      # --- variant RANKING: exclusions ignored on BOTH sides ---
      rank_num = completers_count  if cohort_type == 'GRAD_RATE_150' else retained_count
      ranking_rate_pct = null if initial_count == 0
                         else round_half_up(rank_num / initial_count * 100, 1)

      rate_divergence_pp = null if (federal_rate_pct is null or ranking_rate_pct is null)
                           else round_half_up(federal_rate_pct - ranking_rate_pct, 1)
    input_set: "Every CohortMember of the cohort. The FEDERAL variant filters exclusion_status == APPROVED out of numerator and denominator; the RANKING variant applies no exclusion filter at all. Both variants share the same outcome filter."
    constants: {}
    precision: "1 decimal place, round_half_up on each variant independently; rate_divergence_pp is the difference of the two ALREADY-ROUNDED variants, not a re-derived ratio."
    variants:
      - name: federal_adjusted_rate
        when: "Reported to the federal collection and published on the internal dashboard; exposed as CohortDefinition.federal_rate_pct."
        difference: "Approved allowable exclusions leave the denominator (adjusted_count) and the numerator."
      - name: ranking_gross_rate
        when: "Reported on ranking and consortium surveys, which forbid exclusion adjustments; exposed as CohortDefinition.ranking_rate_pct."
        difference: "Denominator stays initial_count and the numerator counts approved-excluded completers, so the rate is strictly lower whenever exclusion_count > 0 and the excluded students are non-completers."

  - name: core_expense_per_fte_cents
    trigger: "on POST /ir/survey-components/{component_id}/prepare when component_code == 'FINANCE' (side effect: SurveyComponent.core_expense_per_fte_cents written)"
    algorithm: waterfall_allocation
    formula: |
      i = ComponentMetric(metric_key='INSTRUCTION_EXPENSES_CENTS').reported_value
      a = ComponentMetric(metric_key='ACADEMIC_SUPPORT_EXPENSES_CENTS').reported_value
      s = ComponentMetric(metric_key='STUDENT_SERVICES_EXPENSES_CENTS').reported_value
      f = ComponentMetric(metric_key='FTE_ENROLLMENT').reported_value
      if any of i, a, s, f is missing or f == 0:  core_expense_per_fte_cents = null
      else:
          # PINNED ORDER: round each functional category to whole cents FIRST, then sum.
          per_instruction       = round_half_up(i / f, 0)
          per_academic_support  = round_half_up(a / f, 0)
          per_student_services  = round_half_up(s / f, 0)
          core_expense_per_fte_cents = per_instruction + per_academic_support + per_student_services
      # The alternative order round_half_up((i + a + s) / f, 0) is explicitly NOT used and
      # differs by 1-2 cents whenever the three per-category remainders accumulate past 0.5.
    input_set: "Exactly the four FINANCE metrics above on this component; a missing metric or a zero FTE yields null and no per-FTE figure is published."
    constants:
      CENTS_PRECISION: 0
    precision: "Whole cents, round_half_up per category (an exact .5 remainder rounds up, e.g. 500007 / 6 = 83334.5 -> 83335), then integer summation. Round-then-sum is normative; sum-then-round is a wrong answer."

  - name: submission_reconciliation
    trigger: "on POST /ir/external-submissions/{submission_id}/reconcile"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - raw gap against the certified federal value
      federal_value = ComponentMetric(component_id=submission.component_id,
                                      metric_key=submission.metric_key).reported_value
      raw_delta_pct = round_half_up(abs(submission.reported_value - federal_value) / federal_value * 100, 2)
      # Step 2 - allowance tier, selected from raw_delta_pct ONLY
      allowance_pct = 0.00 if raw_delta_pct < 1.00 else (0.50 if raw_delta_pct < 5.00 else 1.00)
      # Step 3 - reduced gap
      effective_delta_pct = max(0.00, round_half_up(raw_delta_pct - allowance_pct, 2))
      # Step 4 - recipient tolerance
      tolerance_pct = {'STATE': 0.50, 'CONSORTIUM': 1.00, 'RANKING': 3.00}[submission.target_type]
      # Step 5 - verdict
      status = 'RECONCILED' if effective_delta_pct <= tolerance_pct else 'VARIANCE_HOLD'
      # PINNED EVALUATION ORDER: the tier in step 2 is derived from the UNADJUSTED raw_delta_pct
      # and is never re-derived from effective_delta_pct. The dependency only looks circular
      # (tolerance comparison consumes a value whose allowance came from a tier of that same
      # value); a single pass in the order 1->2->3->4->5 makes it well-defined. Iterating to a
      # fixed point is a wrong answer: raw 1.40 gives allowance 0.50 and effective 0.90 (single
      # pass), whereas re-tiering 0.90 into the <1.00 band would give allowance 0.00 and
      # effective 1.40 - a different value AND, for CONSORTIUM, a different status.
    input_set: "The single ComponentMetric on the referenced component whose metric_key equals the submission's metric_key; the component must be CERTIFIED or SUBMITTED, and the metric's reported_value must be non-zero."
    constants:
      TIER_1_UPPER_PCT: 1.00
      TIER_2_UPPER_PCT: 5.00
      ALLOWANCE_TIER_1_PCT: 0.00
      ALLOWANCE_TIER_2_PCT: 0.50
      ALLOWANCE_TIER_3_PCT: 1.00
      TOLERANCE_STATE_PCT: 0.50
      TOLERANCE_CONSORTIUM_PCT: 1.00
      TOLERANCE_RANKING_PCT: 3.00
    precision: "2 decimal places, round_half_up, on raw_delta_pct and effective_delta_pct. Tier bounds use `<` (raw 1.00 falls in tier 2, raw 5.00 falls in tier 3); the verdict uses `<=` (effective exactly equal to tolerance reconciles)."

  - name: disclosure_avoidance
    trigger: "on POST /ir/data-requests/{request_id}/screen (side effect: every DisclosureCell of the request is assigned a suppression_state and released_count)"
    algorithm: constraint_propagation
    formula: |
      cells = DisclosureCell rows of this request
      # --- variant SMALL_CELL_SUPPRESSION (default avoidance_method) ---
      # pass 1: primary suppression, cell by cell
      for c in cells ordered by dimension_group ASC, dimension_key ASC:
          if 0 < c.raw_count < request.min_cell_size:
              c.suppression_state = 'PRIMARY_SUPPRESSED'; c.released_count = null
          else:                                    # raw_count == 0 or raw_count >= min_cell_size
              c.suppression_state = 'RELEASED';     c.released_count = c.raw_count
      # pass 2: complementary suppression, per dimension_group
      for g in distinct dimension_group values, ordered ASC:
          primaries  = cells in g with suppression_state == 'PRIMARY_SUPPRESSED'
          candidates = cells in g with suppression_state == 'RELEASED' and raw_count > 0
          if count(primaries) == 1:
              if count(candidates) == 0:
                  request.residual_disclosure_risk = true
              else:
                  victim = candidate with smallest raw_count, tie broken by dimension_key ASC
                  victim.suppression_state = 'COMPLEMENTARY_SUPPRESSED'; victim.released_count = null
          # count(primaries) == 0 -> nothing to protect; count(primaries) >= 2 -> the
          # primaries already mask each other, no complementary suppression is applied
      # --- variant CONTROLLED_ROUNDING ---
      for c in cells:
          c.suppression_state = 'RELEASED'
          c.released_count = round_half_up(c.raw_count / ROUNDING_BASE, 0) * ROUNDING_BASE
      request.residual_disclosure_risk = false
      # --- shared tail ---
      request.released_cell_count   = count(cells where suppression_state == 'RELEASED')
      request.suppressed_cell_count = count(cells where suppression_state in
                                            {'PRIMARY_SUPPRESSED','COMPLEMENTARY_SUPPRESSED'})
    input_set: "Every DisclosureCell of the request. Complementary suppression is scoped to a single dimension_group: cells in other groups are never candidates. A raw_count of 0 is a structural zero and is always released untouched under SMALL_CELL_SUPPRESSION, and it is never a complementary candidate."
    constants:
      DEFAULT_MIN_CELL_SIZE: 5
      ROUNDING_BASE: 5
    precision: "Integer counts throughout; the rounding variant uses round_half_up on raw_count / 5 then multiplies by 5, so 3 -> 5, 12 -> 10, 20 -> 20, 45 -> 45, 0 -> 0."
    variants:
      - name: small_cell_suppression
        when: "request.avoidance_method == 'SMALL_CELL_SUPPRESSION' (the default). Used for external and press requests where exact counts must never be inferable."
        difference: "Cells below min_cell_size are withheld entirely (released_count null) and one additional cell per group is sacrificed so the withheld value cannot be recovered by subtraction; released_cell_count shrinks."
      - name: controlled_rounding
        when: "request.avoidance_method == 'CONTROLLED_ROUNDING'. Used for internal research partners cleared for perturbed microdata."
        difference: "No cell is withheld; every released_count is perturbed to the nearest multiple of 5, so released_cell_count equals the total cell count, suppressed_cell_count is 0 and residual_disclosure_risk is always false."

  - name: restatement_materiality
    trigger: "on POST /ir/publications/{publication_id}/restatements (side effect: RestatementRequest.delta_pct and public_notice_required written)"
    algorithm: threshold
    formula: |
      baseline = publication.published_value
      if baseline == 0:
          delta_pct = null
          public_notice_required = (proposed_value != 0)
      else:
          delta_pct = round_half_up(abs(proposed_value - baseline) / abs(baseline) * 100, 2)
          public_notice_required = (delta_pct >= MATERIALITY_PCT)
    input_set: "The single DashboardPublication being restated, using its current published_value as the baseline. A second restatement on the same publication measures against the value left by the first, not against original_value."
    constants:
      MATERIALITY_PCT: 2.00
    precision: "2 decimal places, round_half_up. The comparison is >=, so a delta of exactly 2.00 requires a public notice. Note the baseline asymmetry: 250 -> 275 is 10.00 while 275 -> 250 is 9.09."

  - name: cycle_active_record_count
    trigger: "on POST /ir/reporting-cycles/{cycle_id}/frozen-files and on any FrozenFile status change (side effect: ReportingCycle.active_record_count rewritten)"
    algorithm: aggregation
    formula: |
      active_record_count = SUM(f.record_count for f in FrozenFile rows of this cycle
                                where f.status in {'ACTIVE','LOCKED'})
      # empty set convention: 0
      frozen_file_count   = count(FrozenFile rows of this cycle where f.status != 'SUPERSEDED')
    input_set: "FrozenFile rows of the cycle with status ACTIVE or LOCKED; SUPERSEDED files drop out of the total the moment the replacement file is created."
    constants: {}
    precision: "Integer sum, no rounding."

  - name: cohort_headcount_conservation
    trigger: "invariant re-checked after every CohortMember creation and after every POST /ir/cohort-members/{member_id}/exclusion-review"
    algorithm: aggregation
    formula: |
      # Conservation invariant: no student is ever lost or double counted.
      assert adjusted_count + exclusion_count == initial_count
      # Compensating property: an APPROVED exclusion that is later moved back to CLAIMED and then
      # DENIED must restore adjusted_count, federal_rate_pct and ranking_rate_pct to the exact
      # values they held before the approval - the recomputation is total, not incremental, so
      # no drift can accumulate across approve/deny cycles.
    input_set: "All CohortMember rows of the cohort; both sides of the identity are recomputed from scratch on every write rather than adjusted by deltas."
    constants: {}
    precision: "Integer identity, exact. Rate fields are recomputed at 1 decimal place by cohort_rate_variants."

  - name: publication_value_conservation
    trigger: "invariant re-checked after every POST /ir/restatements/{restatement_id}/approve"
    algorithm: aggregation
    formula: |
      # net_applied_delta accumulates every APPROVED restatement's signed movement:
      #   on approve:  net_applied_delta += round_half_up(restatement.proposed_value - publication.published_value, 1)
      #                publication.published_value = restatement.proposed_value
      #                publication.restatement_count += 1
      # Conservation invariant:
      assert published_value == round_half_up(original_value + net_applied_delta, 1)
      # Compensating property: approving a restatement back to the original value drives
      # net_applied_delta to exactly 0.0 and published_value back to original_value, while
      # restatement_count keeps climbing - the audit trail is never rewound.
    input_set: "The DashboardPublication row plus its APPROVED RestatementRequest children; REJECTED restatements contribute nothing to net_applied_delta and do not increment restatement_count."
    constants: {}
    precision: "1 decimal place, round_half_up, on the accumulated delta; original_value is written once at creation and is immutable."

  - name: frozen_file_coverage_overlap
    trigger: "on POST /ir/reporting-cycles/{cycle_id}/frozen-files, before the row is created"
    algorithm: interval_merge
    formula: |
      # Coverage windows are CLOSED date intervals [coverage_start_date, coverage_end_date]:
      # a census extract that ends on 2026-10-15 includes 2026-10-15, so a file starting on
      # 2026-10-15 double counts that day.
      peers = FrozenFile rows where cycle_id == this cycle AND domain == new.domain
                                AND status in {'ACTIVE','LOCKED'}
      identical = peers where coverage_start_date == new.coverage_start_date
                          AND coverage_end_date   == new.coverage_end_date
      if count(identical) == 1:
          # SUPERSEDE PATH (implicit, never client-declared): re-registering the very same
          # domain and the very same closed window is a corrected extract, so the incumbent
          # is superseded rather than rejected. `identical` can never hold more than one row,
          # because the overlap scan below already forbids a second row on that window.
          target = the single row in identical
          target.status = 'SUPERSEDED'                      # ACTIVE -> SUPERSEDED, or LOCKED -> SUPERSEDED
          new.supersedes_frozen_file_id = target.id         # written by the server, not supplied
          peers = peers - {target}
      for p in peers:
          if new.coverage_start_date <= p.coverage_end_date
             AND p.coverage_start_date <= new.coverage_end_date:   -> ERR_COVERAGE_WINDOW_OVERLAP (409)
      # ADJACENCY COLLIDES: [2026-09-01, 2026-10-15] and [2026-10-15, 2026-11-30] share
      # 2026-10-15 and are rejected. A gap of one day, [.., 2026-10-14] and [2026-10-15, ..],
      # is accepted.
    input_set: "Same cycle and same domain only, restricted to ACTIVE and LOCKED rows; SUPERSEDED rows are invisible to the overlap scan, so a superseded window can be reused freely."
    constants: {}
    precision: "Whole dates (YYYY-MM-DD), inclusive on both ends."

  - name: publication_window_overlap
    trigger: "on POST /ir/publications, before the row is created"
    algorithm: interval_merge
    formula: |
      # Effective windows are HALF-OPEN instant intervals [effective_from, effective_to):
      # a dashboard value stops applying at the instant its successor starts, so the two
      # can share that instant. effective_to == null means +infinity (currently effective).
      peers = DashboardPublication rows where component_id == new.component_id
                                        AND metric_key  == new.metric_key
                                        AND publication_status != 'WITHDRAWN'
      for p in peers:
          new_to = new.effective_to or +infinity
          p_to   = p.effective_to   or +infinity
          if new.effective_from < p_to AND p.effective_from < new_to:  -> ERR_PUBLICATION_WINDOW_OVERLAP (409)
      # ADJACENCY IS ALLOWED: [2026-11-01T00:00:00Z, 2026-12-01T00:00:00Z) and
      # [2026-12-01T00:00:00Z, null) do not overlap. Contrast frozen_file_coverage_overlap,
      # where the shared endpoint IS an overlap.
    input_set: "Same component and same metric_key only; WITHDRAWN publications are excluded, so withdrawing a publication frees its window for reuse."
    constants: {}
    precision: "ISO-8601 UTC instants at second precision; comparisons are strict `<` on both sides."

# =====================================================================================
# §1.4 Validation Rules Table (evaluated in strict ascending priority; the first
#      violated rule decides the response and no later rule is evaluated)
# =====================================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body schema: every field marked required in the endpoint's §1.5 input is present, JSON types match, enum fields carry a declared member, dates are YYYY-MM-DD, instants are ISO-8601 UTC, counts and monetary cent fields are non-negative integers, and declared free-text length bounds hold. Exceptions handled by dedicated later rules: explanation_text (priority 30), rejection_reason (priority 31)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints that accept a body"

  - priority: 4
    category: existence
    check: "every path parameter resolves to an existing row, validated left-to-right: {cycle_id} -> ERR_CYCLE_NOT_FOUND, {frozen_file_id} -> ERR_FROZEN_FILE_NOT_FOUND, {component_id} -> ERR_COMPONENT_NOT_FOUND, {metric_id} -> ERR_METRIC_NOT_FOUND, {edit_check_id} -> ERR_EDIT_CHECK_NOT_FOUND, {cohort_id} -> ERR_COHORT_NOT_FOUND, {member_id} -> ERR_MEMBER_NOT_FOUND, {mapping_id} -> ERR_MAPPING_NOT_FOUND, {submission_id} -> ERR_SUBMISSION_NOT_FOUND, {publication_id} -> ERR_PUBLICATION_NOT_FOUND, {restatement_id} -> ERR_RESTATEMENT_NOT_FOUND, {request_id} -> ERR_DATA_REQUEST_NOT_FOUND, {cell_id} -> ERR_CELL_NOT_FOUND"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (the thirteen ids enumerated above are all catalogued in §1.6)"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the body resolves: cycle_id -> ERR_CYCLE_NOT_FOUND, frozen_file_id -> ERR_FROZEN_FILE_NOT_FOUND, component_id -> ERR_COMPONENT_NOT_FOUND, definition_id -> ERR_DEFINITION_NOT_FOUND. A row that exists but belongs to a different parent (e.g. a frozen_file_id from another cycle, or a component_id whose cycle_id differs from the supplied cycle_id) is treated as not found."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /ir/survey-components, POST /ir/element-mappings, POST /ir/external-submissions, POST /ir/publications, POST /ir/reporting-cycles/{cycle_id}/frozen-files"

  - priority: 6
    category: state
    check: "pre-freeze work is refused once the governing ReportingCycle.snapshot_posture is FROZEN or ARCHIVED: no frozen-file registration, no component creation, no metric write, no prepare/certify, no cohort or member write, no mapping validate/revise"
    error_id: ERR_CYCLE_FROZEN
    http_status: 409
    applies_to: "POST /ir/reporting-cycles/{cycle_id}/frozen-files, POST /ir/survey-components, POST /ir/survey-components/{component_id}/metrics, PATCH /ir/component-metrics/{metric_id}, POST /ir/survey-components/{component_id}/prepare, POST /ir/survey-components/{component_id}/certify, POST /ir/reporting-cycles/{cycle_id}/cohorts, POST /ir/cohorts/{cohort_id}/members, PATCH /ir/cohort-members/{member_id}, POST /ir/element-mappings, POST /ir/element-mappings/{mapping_id}/validate, POST /ir/element-mappings/{mapping_id}/revise"

  - priority: 7
    category: state
    check: "a census extract may not be registered while the cycle is CENSUS_LOCKED — the snapshot is sealed until the cycle is reopened (posture must be OPEN or REOPENED)"
    error_id: ERR_CENSUS_LOCKED
    http_status: 409
    applies_to: "POST /ir/reporting-cycles/{cycle_id}/frozen-files"

  - priority: 8
    category: state
    check: "post-freeze work requires ReportingCycle.snapshot_posture IN {FROZEN, ARCHIVED}: dashboard publication, external transmission, and every disclosure step"
    error_id: ERR_CYCLE_NOT_FROZEN
    http_status: 409
    applies_to: "POST /ir/publications, POST /ir/external-submissions/{submission_id}/transmit, POST /ir/reporting-cycles/{cycle_id}/data-requests, POST /ir/data-requests/{request_id}/screen, POST /ir/data-requests/{request_id}/release"

  - priority: 9
    category: state
    check: "any remaining cycle-posture mismatch: component work attempted while the cycle is still OPEN, a cycle transition fired from the wrong posture (census-lock from CENSUS_LOCKED or FROZEN, freeze from OPEN or REOPENED, reopen from anything but FROZEN), or any mutation of a child of an ARCHIVED cycle"
    error_id: ERR_INVALID_CYCLE_STATE
    http_status: 409
    applies_to: "POST /ir/reporting-cycles/{cycle_id}/census-lock, POST /ir/reporting-cycles/{cycle_id}/freeze, POST /ir/reporting-cycles/{cycle_id}/reopen, POST /ir/survey-components, POST /ir/survey-components/{component_id}/metrics, POST /ir/survey-components/{component_id}/prepare, POST /ir/survey-components/{component_id}/certify, POST /ir/survey-components/{component_id}/submit, POST /ir/survey-components/{component_id}/revert-to-draft, POST /ir/external-submissions, POST /ir/cohorts/{cohort_id}/lock, POST /ir/cohort-members/{member_id}/exclusion-claim, POST /ir/cohort-members/{member_id}/exclusion-review"

  - priority: 10
    category: state
    check: "optimistic concurrency (§1.2.1): the supplied expected_cycle_version / expected_publication_version equals the parent's current version"
    error_id: "ERR_STALE_CYCLE_VERSION | ERR_STALE_PUBLICATION_VERSION"
    http_status: 412
    applies_to: "POST /ir/reporting-cycles/{cycle_id}/frozen-files, POST /ir/publications/{publication_id}/restatements"

  - priority: 11
    category: state
    check: "the target row itself is in a state the requested transition accepts, per §1.2: ERR_INVALID_COMPONENT_STATE, ERR_INVALID_EDIT_CHECK_STATE, ERR_INVALID_EXCLUSION_STATE, ERR_INVALID_MAPPING_STATE, ERR_INVALID_SUBMISSION_STATE, ERR_INVALID_PUBLICATION_STATE, ERR_INVALID_RESTATEMENT_STATE, ERR_INVALID_DATA_REQUEST_STATE, and ERR_COHORT_LOCKED for any write to a LOCKED cohort's roster (POST members, PATCH member outcome, second lock)"
    error_id: "ERR_INVALID_<ENTITY>_STATE | ERR_COHORT_LOCKED"
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition, plus POST /ir/cohorts/{cohort_id}/members, PATCH /ir/cohort-members/{member_id}, POST /ir/survey-components/{component_id}/metrics, PATCH /ir/component-metrics/{metric_id}, POST /ir/data-requests/{request_id}/cells"

  - priority: 12
    category: state
    check: "cross-entity state preconditions: prepare requires the referenced FrozenFile.status IN {ACTIVE, LOCKED} (ERR_FROZEN_FILE_SUPERSEDED); certify requires edit_status == CLEARED (ERR_EDIT_CHECKS_UNRESOLVED); freeze requires at least one component and every component CERTIFIED (ERR_COMPONENTS_NOT_READY); census-lock requires at least one ACTIVE FrozenFile (ERR_NO_ACTIVE_SNAPSHOT); cohort lock requires no CLAIMED exclusion (ERR_UNRESOLVED_EXCLUSION_CLAIM); reconcile requires the source component CERTIFIED or SUBMITTED (ERR_SOURCE_NOT_CERTIFIED)"
    error_id: "ERR_FROZEN_FILE_SUPERSEDED | ERR_EDIT_CHECKS_UNRESOLVED | ERR_COMPONENTS_NOT_READY | ERR_NO_ACTIVE_SNAPSHOT | ERR_UNRESOLVED_EXCLUSION_CLAIM | ERR_SOURCE_NOT_CERTIFIED"
    http_status: 409
    applies_to: "POST /ir/survey-components/{component_id}/prepare, POST /ir/survey-components/{component_id}/certify, POST /ir/reporting-cycles/{cycle_id}/freeze, POST /ir/reporting-cycles/{cycle_id}/census-lock, POST /ir/cohorts/{cohort_id}/lock, POST /ir/external-submissions/{submission_id}/reconcile"

  - priority: 13
    category: business_safety
    check: "segregation of duties: the acting X-User-ID differs from the user who performed the preceding step — certify vs prepared_by_user_id, adjudicate vs explained_by_user_id, restatement approve/reject vs requested_by_user_id (the literal 'SYSTEM' requester never collides)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ir/survey-components/{component_id}/certify, POST /ir/edit-checks/{edit_check_id}/adjudicate, POST /ir/restatements/{restatement_id}/approve, POST /ir/restatements/{restatement_id}/reject"

  - priority: 14
    category: business_safety
    check: "disclosure safety: a screened request with residual_disclosure_risk == true may not be released to an EXTERNAL or MEDIA requester, because the single primary-suppressed cell in some dimension_group had no complementary candidate and is therefore recoverable by subtraction"
    error_id: ERR_SMALL_CELL_DISCLOSURE
    http_status: 422
    applies_to: "POST /ir/data-requests/{request_id}/release"

  - priority: 15
    category: business_safety
    check: "a FATAL edit check may not be waived — decision WAIVE requires severity == WARNING"
    error_id: ERR_WAIVER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /ir/edit-checks/{edit_check_id}/adjudicate"

  - priority: 16
    category: business_referential
    check: "every value of a mapping's value_map appears in the referenced FederalDefinition.value_domain"
    error_id: ERR_VALUE_DOMAIN_VIOLATION
    http_status: 422
    applies_to: "POST /ir/element-mappings/{mapping_id}/validate, POST /ir/element-mappings/{mapping_id}/revise"

  - priority: 17
    category: business_referential
    check: "metric_key belongs to the parent component's survey domain: ENROLLMENT accepts {TOTAL_HEADCOUNT, FTE_ENROLLMENT}; COMPLETIONS accepts {TOTAL_COMPLETIONS, CIP_PROGRAM_COUNT}; FINANCE accepts {INSTRUCTION_EXPENSES_CENTS, ACADEMIC_SUPPORT_EXPENSES_CENTS, STUDENT_SERVICES_EXPENSES_CENTS, FTE_ENROLLMENT}; HR accepts {INSTRUCTIONAL_STAFF_HEADCOUNT, INSTRUCTIONAL_CONTRACT_MONTHS}. FTE_ENROLLMENT is deliberately shared by ENROLLMENT and FINANCE (the per-FTE expense figure needs it on the FINANCE component). The same rule gates an ExternalSubmission's metric_key against its source component."
    error_id: ERR_METRIC_DOMAIN_MISMATCH
    http_status: 422
    applies_to: "POST /ir/survey-components/{component_id}/metrics, POST /ir/external-submissions"

  - priority: 18
    category: business_referential
    check: "an exclusion_code is one of {DECEASED, PERMANENTLY_DISABLED, ARMED_FORCES, FOREIGN_AID_SERVICE, CHURCH_MISSION} — the closed federal list of allowable exclusions"
    error_id: ERR_INVALID_EXCLUSION_CODE
    http_status: 422
    applies_to: "POST /ir/cohort-members/{member_id}/exclusion-claim"

  - priority: 19
    category: business_referential
    check: "reconciliation needs a federal counterpart: a ComponentMetric with metric_key == submission.metric_key exists on the referenced component"
    error_id: ERR_FEDERAL_VALUE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /ir/external-submissions/{submission_id}/reconcile"

  - priority: 20
    category: business_referential
    check: "the federal counterpart's reported_value is non-zero, so a percentage gap is defined"
    error_id: ERR_ZERO_BASE_RECONCILIATION
    http_status: 422
    applies_to: "POST /ir/external-submissions/{submission_id}/reconcile"

  - priority: 21
    category: business_temporal
    check: "the logical clock's date is on or after cycle.census_date (equality passes) before the census snapshot may be locked"
    error_id: ERR_CENSUS_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /ir/reporting-cycles/{cycle_id}/census-lock"

  - priority: 22
    category: business_temporal
    check: "the logical clock is at or before cycle.collection_deadline (equality passes) for any act that binds the institution to a reported figure"
    error_id: ERR_COLLECTION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /ir/survey-components/{component_id}/certify, POST /ir/survey-components/{component_id}/submit, POST /ir/external-submissions/{submission_id}/transmit"

  - priority: 23
    category: business_temporal
    check: "coverage_start_date <= coverage_end_date and both dates fall inside the cycle's reporting year window [ (collection_year - 1)-07-01, collection_year-06-30 ]"
    error_id: ERR_INVALID_COVERAGE_WINDOW
    http_status: 422
    applies_to: "POST /ir/reporting-cycles/{cycle_id}/frozen-files"

  - priority: 24
    category: business_temporal
    check: "effective_from < effective_to when effective_to is supplied (a zero-length half-open window would publish nothing)"
    error_id: ERR_INVALID_EFFECTIVE_WINDOW
    http_status: 422
    applies_to: "POST /ir/publications"

  - priority: 25
    category: business_constraint
    check: "closed coverage windows of the same (cycle_id, domain) with status IN {ACTIVE, LOCKED} do not overlap, per calculations.frozen_file_coverage_overlap — a shared endpoint date IS an overlap"
    error_id: ERR_COVERAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ir/reporting-cycles/{cycle_id}/frozen-files"

  - priority: 26
    category: business_constraint
    check: "half-open effective windows of the same (component_id, metric_key) with publication_status != WITHDRAWN do not overlap, per calculations.publication_window_overlap — a shared boundary instant is NOT an overlap"
    error_id: ERR_PUBLICATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ir/publications"

  - priority: 27
    category: business_constraint
    check: "scoped uniqueness: cycle_code globally (ERR_DUPLICATE_CYCLE_CODE); (cycle_id, component_code) (ERR_DUPLICATE_COMPONENT); (component_id, metric_key) (ERR_DUPLICATE_METRIC_KEY); (cohort_id, student_local_id) (ERR_DUPLICATE_MEMBER); (cycle_id, definition_id, local_system_code) among rows with status != REJECTED (ERR_DUPLICATE_MAPPING); (definition_code, effective_cycle_code) (ERR_DUPLICATE_DEFINITION); (cycle_id, target_name, metric_key) among rows with status != TRANSMITTED (ERR_DUPLICATE_SUBMISSION); (request_id, dimension_group, dimension_key) (ERR_DUPLICATE_CELL); (cycle_id, cohort_type, entry_term) (ERR_DUPLICATE_COHORT)"
    error_id: "ERR_DUPLICATE_<SCOPE>"
    http_status: 409
    applies_to: "POST /ir/reporting-cycles, POST /ir/survey-components, POST /ir/survey-components/{component_id}/metrics, POST /ir/cohorts/{cohort_id}/members, POST /ir/element-mappings, POST /ir/federal-definitions, POST /ir/external-submissions, POST /ir/data-requests/{request_id}/cells, POST /ir/reporting-cycles/{cycle_id}/cohorts"

  - priority: 28
    category: business_fiscal
    check: "a material restatement (public_notice_required == true, i.e. delta_pct >= 2.00) cannot be applied without a public_notice_reference"
    error_id: ERR_PUBLIC_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /ir/restatements/{restatement_id}/approve"

  - priority: 29
    category: business_fiscal
    check: "denominator sufficiency: a cohort lock needs initial_count >= 1 (ERR_EMPTY_COHORT) and adjusted_count >= 1 (ERR_EMPTY_COHORT_DENOMINATOR); a prepare needs at least one ComponentMetric (ERR_NO_METRICS); a screen needs at least one DisclosureCell (ERR_NO_CELLS_TO_SCREEN)"
    error_id: "ERR_EMPTY_COHORT | ERR_EMPTY_COHORT_DENOMINATOR | ERR_NO_METRICS | ERR_NO_CELLS_TO_SCREEN"
    http_status: 422
    applies_to: "POST /ir/cohorts/{cohort_id}/lock, POST /ir/survey-components/{component_id}/prepare, POST /ir/data-requests/{request_id}/screen"

  - priority: 30
    category: business_constraint
    check: "explanation_text is at least 20 characters after trimming — a prior-year comparison explanation must be substantive"
    error_id: ERR_EXPLANATION_TOO_SHORT
    http_status: 422
    applies_to: "POST /ir/edit-checks/{edit_check_id}/explain"

  - priority: 31
    category: business_constraint
    check: "a negative decision carries its reason: decision REJECT on a mapping validate, and reject on a restatement, both require rejection_reason of 10-500 characters"
    error_id: ERR_REJECTION_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /ir/element-mappings/{mapping_id}/validate, POST /ir/restatements/{restatement_id}/reject"

# =====================================================================================
# §1.5 API Endpoint Table   (api_prefix /ir; every response uses the §1.0 envelope)
# =====================================================================================
endpoints:
  # ---------------------------------------------------------------- ReportingCycle
  - method: POST
    path: "/ir/reporting-cycles"
    description: "Open a federal collection cycle. snapshot_posture starts at OPEN, reopen_count at 0, active_record_count at 0."
    roles: [RegistrarOfficer]
    code: 201
    input: [cycle_code, collection_year, census_date, collection_deadline]
    output: ReportingCycle
    side_effects:
      - "creates the ReportingCycle with snapshot_posture OPEN and version 1"

  - method: GET
    path: "/ir/reporting-cycles/{cycle_id}"
    description: "Read one reporting cycle, including its derived active_record_count and posture timestamps."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: ReportingCycle
    side_effects: []

  - method: POST
    path: "/ir/reporting-cycles/{cycle_id}/census-lock"
    description: "Seal the census snapshot: OPEN -> CENSUS_LOCKED, or REOPENED -> CENSUS_LOCKED after a corrected extract."
    roles: [RegistrarOfficer]
    code: 200
    input: []
    output: ReportingCycle
    side_effects:
      - "snapshot_posture := CENSUS_LOCKED; census_locked_at := logical clock; version += 1"
      - "every ACTIVE FrozenFile of the cycle := LOCKED (created_at ASC), each file's version += 1"
      - "active_record_count recomputed per calculations.cycle_active_record_count"

  - method: POST
    path: "/ir/reporting-cycles/{cycle_id}/freeze"
    description: "Freeze the file for publication: CENSUS_LOCKED -> FROZEN once every survey component is CERTIFIED."
    roles: [IRDirector]
    code: 200
    input: []
    output: ReportingCycle
    side_effects:
      - "snapshot_posture := FROZEN; frozen_at := logical clock; version += 1"
      - "every DRAFT CohortDefinition of the cycle with adjusted_count >= 1 := LOCKED with both rate variants recomputed; each cohort's version += 1"

  - method: POST
    path: "/ir/reporting-cycles/{cycle_id}/reopen"
    description: "Reopen a frozen file for correction: FROZEN -> REOPENED, cascading down through components, publications and pending restatements."
    roles: [IRDirector]
    code: 200
    input: [reopen_reason]
    output: ReportingCycle
    side_effects:
      - "snapshot_posture := REOPENED; reopen_count += 1; reopen_reason stored; version += 1"
      - "cascade L2: every CERTIFIED SurveyComponent := DRAFT with its EditCheck rows VOIDED and edit_status NOT_RUN"
      - "cascade L3: every non-WITHDRAWN DashboardPublication of those components is visited and set to RESTATEMENT_PENDING (version += 1 on every visited row, including rows already RESTATEMENT_PENDING)"
      - "cascade L4: every SUBMITTED RestatementRequest of those visited publications := VOIDED"

  # ---------------------------------------------------------------- FrozenFile
  - method: POST
    path: "/ir/reporting-cycles/{cycle_id}/frozen-files"
    description: "Register a census extract for one source domain over a CLOSED coverage window. Re-registering the identical (domain, window) supersedes the incumbent extract; any other overlap is rejected. OCC-guarded on the cycle (§1.2.1 frozen-file-create-stale-cycle)."
    roles: [RegistrarOfficer]
    code: 201
    input: [domain, record_count, coverage_start_date, coverage_end_date, checksum, expected_cycle_version]
    output: FrozenFile
    side_effects:
      - "creates the FrozenFile with status ACTIVE, snapshot_taken_at := logical clock, version 1"
      - "when an ACTIVE or LOCKED peer holds the identical (domain, coverage window): that peer := SUPERSEDED, its version += 1, and the new row's supersedes_frozen_file_id := that peer's id"
      - "increments ReportingCycle.version by 1"
      - "parent cycle.active_record_count recomputed per calculations.cycle_active_record_count"

  - method: GET
    path: "/ir/frozen-files/{frozen_file_id}"
    description: "Read one census extract with its status and coverage window."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: FrozenFile
    side_effects: []

  - method: GET
    path: "/ir/frozen-files"
    description: "List census extracts, filterable by cycle, domain, status, or the extract they superseded. Ordered by created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["cycle_id?", "domain?", "status?", "supersedes_frozen_file_id?", "limit?", "offset?"]
    output: FrozenFile[]
    side_effects: []

  # ---------------------------------------------------------------- SurveyComponent
  - method: POST
    path: "/ir/survey-components"
    description: "Start preparing a survey component (ENROLLMENT, COMPLETIONS, FINANCE, HUMAN_RESOURCES) against a specific census extract. Requires the cycle to be CENSUS_LOCKED or REOPENED."
    roles: [IRAnalyst]
    code: 201
    input: [cycle_id, frozen_file_id, component_code]
    output: SurveyComponent
    side_effects:
      - "creates the SurveyComponent with prep_status DRAFT, edit_status NOT_RUN, fatal_open_count 0, version 1"

  - method: GET
    path: "/ir/survey-components/{component_id}"
    description: "Read one survey component with both state dimensions and its derived coverage and per-FTE figures."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: SurveyComponent
    side_effects: []

  - method: GET
    path: "/ir/survey-components"
    description: "List survey components, filterable by cycle, source extract, prep_status or edit_status. Ordered by created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["cycle_id?", "frozen_file_id?", "prep_status?", "edit_status?", "limit?", "offset?"]
    output: SurveyComponent[]
    side_effects: []

  - method: POST
    path: "/ir/survey-components/{component_id}/prepare"
    description: "Run preparation: DRAFT -> PREPARED, recompute coverage and the FINANCE per-FTE figure, and raise the edit checks."
    roles: [IRAnalyst]
    code: 200
    input: []
    output: SurveyComponent
    side_effects:
      - "prep_status := PREPARED; prepared_by_user_id := X-User-ID; version += 1"
      - "mapping_coverage_pct, core_expense_per_fte_cents and every metric's variance_pct recomputed"
      - "EditCheck rows created per calculations.edit_check_generation with sequence_no 1..N"
      - "edit_status re-derived (OPEN_EDITS when checks were raised, CLEARED when none were); fatal_open_count recomputed"

  - method: POST
    path: "/ir/survey-components/{component_id}/certify"
    description: "Certify a prepared component: PREPARED -> CERTIFIED. Requires every edit check resolved and a certifier distinct from the preparer."
    roles: [IRDirector]
    code: 200
    input: [certification_statement]
    output: SurveyComponent
    side_effects:
      - "prep_status := CERTIFIED; certified_by_user_id := X-User-ID; certification_statement stored; version += 1"

  - method: POST
    path: "/ir/survey-components/{component_id}/submit"
    description: "Transmit the component to the federal collection: CERTIFIED -> SUBMITTED (terminal). Bubbles the cycle to ARCHIVED once every component is submitted."
    roles: [IRDirector]
    code: 200
    input: []
    output: SurveyComponent
    side_effects:
      - "prep_status := SUBMITTED; submitted_at := logical clock; version += 1"
      - "bubble-up: parent cycle FROZEN -> ARCHIVED when every component is SUBMITTED; cycle.version += 1"

  - method: POST
    path: "/ir/survey-components/{component_id}/revert-to-draft"
    description: "Decertify or unprepare a component (PREPARED -> DRAFT or CERTIFIED -> DRAFT), voiding its edit checks and flipping its published figures to RESTATEMENT_PENDING."
    roles: [IRDirector]
    code: 200
    input: [decertify_reason]
    output: SurveyComponent
    side_effects:
      - "prep_status := DRAFT; prepared_by_user_id := null; certified_by_user_id := null; certification_statement := null; version += 1"
      - "every non-VOIDED EditCheck of the component := VOIDED; edit_status := NOT_RUN; fatal_open_count := 0"
      - "cascade: every non-WITHDRAWN DashboardPublication of this component is visited and set to RESTATEMENT_PENDING (version += 1 on every visited row), and every SUBMITTED RestatementRequest beneath those visited rows := VOIDED"

  # ---------------------------------------------------------------- ComponentMetric
  - method: POST
    path: "/ir/survey-components/{component_id}/metrics"
    description: "Add one reported survey metric with its optional prior-year comparison value and the local system field it was mapped from. Only while the component is DRAFT."
    roles: [IRAnalyst]
    code: 201
    input: [metric_key, reported_value, "prior_year_value?", source_field_path]
    output: ComponentMetric
    side_effects:
      - "creates the ComponentMetric with restated false, variance_pct null, version 1"

  - method: GET
    path: "/ir/component-metrics/{metric_id}"
    description: "Read one reported metric with its derived variance_pct."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: ComponentMetric
    side_effects: []

  - method: GET
    path: "/ir/component-metrics"
    description: "List reported metrics, filterable by component or metric_key. Ordered by metric_key ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["component_id?", "metric_key?", "limit?", "offset?"]
    output: ComponentMetric[]
    side_effects: []

  - method: PATCH
    path: "/ir/component-metrics/{metric_id}"
    description: "Correct a reported value while the component is DRAFT; recomputes that metric's variance_pct and marks it restated."
    roles: [IRAnalyst]
    code: 200
    input: [reported_value, "restatement_note?"]
    output: ComponentMetric
    side_effects:
      - "reported_value replaced; restated := true; restatement_note stored; variance_pct recomputed per calculations.prior_year_variance_pct; version += 1"

  # ---------------------------------------------------------------- EditCheck
  - method: GET
    path: "/ir/edit-checks/{edit_check_id}"
    description: "Read one edit check with its severity, observed and prior-year values, explanation and adjudication trail."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: EditCheck
    side_effects: []

  - method: GET
    path: "/ir/edit-checks"
    description: "List edit checks, filterable by component, status or severity. Ordered by sequence_no ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["component_id?", "status?", "severity?", "limit?", "offset?"]
    output: EditCheck[]
    side_effects: []

  - method: POST
    path: "/ir/edit-checks/{edit_check_id}/explain"
    description: "File the prior-year comparison explanation for a flagged metric: OPEN -> EXPLAINED, or REJECTED -> EXPLAINED for a further round."
    roles: [IRAnalyst]
    code: 200
    input: [explanation_text, prior_year_comparison_note]
    output: EditCheck
    side_effects:
      - "status := EXPLAINED; explained_by_user_id := X-User-ID; explanation_round += 1; version += 1"
      - "parent component.edit_status re-derived per calculations.edit_status_derivation; component.version += 1"

  - method: POST
    path: "/ir/edit-checks/{edit_check_id}/adjudicate"
    description: "Adjudicate an explained check with decision ACCEPT, WAIVE (WARNING severity only) or REJECT. Requires an adjudicator distinct from the explainer."
    roles: [IRDirector]
    code: 200
    input: [decision, "adjudication_note?"]
    output: EditCheck
    side_effects:
      - "status := ACCEPTED | WAIVED | REJECTED; adjudicated_by_user_id := X-User-ID; adjudication_note stored; version += 1"
      - "parent component.edit_status re-derived and fatal_open_count recomputed; component.version += 1"

  # ---------------------------------------------------------------- CohortDefinition
  - method: POST
    path: "/ir/reporting-cycles/{cycle_id}/cohorts"
    description: "Define a graduation-rate or retention cohort for an entry term and bind it to the dashboard metric its federal rate publishes to."
    roles: [RegistrarOfficer]
    code: 201
    input: [cohort_type, entry_term, publication_metric_key]
    output: CohortDefinition
    side_effects:
      - "creates the CohortDefinition with status DRAFT, all five counts 0, both rate variants null, version 1"

  - method: GET
    path: "/ir/cohorts/{cohort_id}"
    description: "Read one cohort with its headcounts and both rate variants."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: CohortDefinition
    side_effects: []

  - method: GET
    path: "/ir/cohorts"
    description: "List cohorts, filterable by cycle, cohort_type or status. Ordered by created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["cycle_id?", "cohort_type?", "status?", "limit?", "offset?"]
    output: CohortDefinition[]
    side_effects: []

  - method: POST
    path: "/ir/cohorts/{cohort_id}/lock"
    description: "Lock the cohort roster: DRAFT -> LOCKED with both rate variants frozen. Refuses while any exclusion claim is unresolved."
    roles: [RegistrarOfficer]
    code: 200
    input: []
    output: CohortDefinition
    side_effects:
      - "status := LOCKED; locked_at := logical clock; version += 1"
      - "federal_rate_pct and ranking_rate_pct recomputed per calculations.cohort_rate_variants"

  - method: GET
    path: "/ir/cohorts/{cohort_id}/rate-summary"
    description: "Computed read: both rate variants side by side with the headcounts they were derived from and their divergence in percentage points."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output:
      federal_rate_pct: number
      ranking_rate_pct: number
      rate_divergence_pp: number
      initial_count: integer
      adjusted_count: integer
      exclusion_count: integer
      completers_count: integer
      retained_count: integer
    side_effects: []

  # ---------------------------------------------------------------- CohortMember
  - method: POST
    path: "/ir/cohorts/{cohort_id}/members"
    description: "Add a student to a DRAFT cohort roster with an entry status and an optional outcome (defaults to STILL_ENROLLED)."
    roles: [RegistrarOfficer]
    code: 201
    input: [student_local_id, entry_status, "outcome?"]
    output: CohortMember
    side_effects:
      - "creates the CohortMember with exclusion_status NONE, version 1"
      - "parent cohort's counts and both rate variants recomputed; cohort.version += 1"

  - method: GET
    path: "/ir/cohort-members/{member_id}"
    description: "Read one cohort member with its outcome and exclusion trail."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: CohortMember
    side_effects: []

  - method: GET
    path: "/ir/cohort-members"
    description: "List cohort members, filterable by cohort, exclusion_status or outcome. Ordered by created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["cohort_id?", "exclusion_status?", "outcome?", "limit?", "offset?"]
    output: CohortMember[]
    side_effects: []

  - method: PATCH
    path: "/ir/cohort-members/{member_id}"
    description: "Record a student's tracked outcome (COMPLETED_150, STILL_ENROLLED, TRANSFERRED, WITHDRAWN) while the cohort is DRAFT."
    roles: [RegistrarOfficer]
    code: 200
    input: [outcome]
    output: CohortMember
    side_effects:
      - "outcome replaced; version += 1"
      - "parent cohort's completers_count, retained_count and both rate variants recomputed; cohort.version += 1"

  - method: POST
    path: "/ir/cohort-members/{member_id}/exclusion-claim"
    description: "File an allowable-exclusion claim (NONE -> CLAIMED, or DENIED -> CLAIMED to refile with new evidence). Accepted on LOCKED cohorts too."
    roles: [RegistrarOfficer]
    code: 200
    input: [exclusion_code, exclusion_evidence_note]
    output: CohortMember
    side_effects:
      - "exclusion_status := CLAIMED; exclusion_code and exclusion_evidence_note stored; exclusion_claimed_by_user_id := X-User-ID; version += 1"

  - method: POST
    path: "/ir/cohort-members/{member_id}/exclusion-review"
    description: "Adjudicate an exclusion claim with decision APPROVE or DENY. An approval on a LOCKED cohort cascades into the published rate and files a system restatement."
    roles: [IRDirector]
    code: 200
    input: [decision, "review_note?"]
    output: CohortMember
    side_effects:
      - "exclusion_status := APPROVED | DENIED; exclusion_reviewed_by_user_id := X-User-ID; review_note stored; version += 1"
      - "parent cohort recomputes exclusion_count, adjusted_count and both rate variants; cohort.version += 1"
      - "cascade (LOCKED cohorts only): matching PUBLISHED DashboardPublication rows := RESTATEMENT_PENDING, their SUBMITTED RestatementRequest rows := SUPERSEDED, and a new CASCADE-origin RestatementRequest is filed with the restored federal_rate_pct"

  # ---------------------------------------------------------------- FederalDefinition
  - method: POST
    path: "/ir/federal-definitions"
    description: "Register an immutable federal data element definition for one survey component and cycle code, including its closed value_domain."
    roles: [DataSteward]
    code: 201
    input: [definition_code, survey_component, value_domain, "required?", unit_of_measure, effective_cycle_code]
    output: FederalDefinition
    side_effects:
      - "creates the FederalDefinition (immutable: no update endpoint, no version field)"

  - method: GET
    path: "/ir/federal-definitions/{definition_id}"
    description: "Read one federal element definition."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: FederalDefinition
    side_effects: []

  - method: GET
    path: "/ir/federal-definitions"
    description: "List federal element definitions, filterable by survey component, cycle code or requiredness. Ordered by created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["survey_component?", "effective_cycle_code?", "required?", "limit?", "offset?"]
    output: FederalDefinition[]
    side_effects: []

  # ---------------------------------------------------------------- DataElementMapping
  - method: POST
    path: "/ir/element-mappings"
    description: "Propose a mapping from a local system field to a federal element definition, with a transform expression and a local-to-federal value_map."
    roles: [IRAnalyst]
    code: 201
    input: [cycle_id, definition_id, local_system_code, local_field_path, transform_expression, value_map]
    output: DataElementMapping
    side_effects:
      - "creates the DataElementMapping with status PROPOSED, revision_round 0, version 1"

  - method: GET
    path: "/ir/element-mappings/{mapping_id}"
    description: "Read one element mapping with its validation verdict and revision round."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: DataElementMapping
    side_effects: []

  - method: GET
    path: "/ir/element-mappings"
    description: "List element mappings, filterable by cycle, federal definition, status or local system. Ordered by created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["cycle_id?", "definition_id?", "status?", "local_system_code?", "limit?", "offset?"]
    output: DataElementMapping[]
    side_effects: []

  - method: POST
    path: "/ir/element-mappings/{mapping_id}/validate"
    description: "Steward verdict on a proposed mapping: decision APPROVE (-> VALIDATED, counts toward coverage) or REJECT (-> REJECTED, reason required)."
    roles: [DataSteward]
    code: 200
    input: [decision, "rejection_reason?"]
    output: DataElementMapping
    side_effects:
      - "status := VALIDATED | REJECTED; validated_by_user_id := X-User-ID; rejection_reason stored or cleared; version += 1"
      - "a VALIDATED mapping raises mapping_coverage_pct at the next prepare of any component of the same cycle"

  - method: POST
    path: "/ir/element-mappings/{mapping_id}/revise"
    description: "Revise a rejected mapping's transform and value map: REJECTED -> PROPOSED with revision_round incremented."
    roles: [IRAnalyst]
    code: 200
    input: [transform_expression, value_map]
    output: DataElementMapping
    side_effects:
      - "status := PROPOSED; transform_expression and value_map replaced; rejection_reason := null; revision_round += 1; version += 1"

  # ---------------------------------------------------------------- ExternalSubmission
  - method: POST
    path: "/ir/external-submissions"
    description: "Draft a state, consortium or ranking submission of one metric drawn from a survey component, at the value that recipient's definitions require."
    roles: [IRAnalyst]
    code: 201
    input: [cycle_id, component_id, target_type, target_name, metric_key, reported_value]
    output: ExternalSubmission
    side_effects:
      - "creates the ExternalSubmission with status DRAFT, all five reconciliation fields null, version 1"

  - method: GET
    path: "/ir/external-submissions/{submission_id}"
    description: "Read one external submission with its reconciliation figures."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: ExternalSubmission
    side_effects: []

  - method: GET
    path: "/ir/external-submissions"
    description: "List external submissions, filterable by cycle, source component, recipient type or status. Ordered by created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["cycle_id?", "component_id?", "target_type?", "status?", "limit?", "offset?"]
    output: ExternalSubmission[]
    side_effects: []

  - method: POST
    path: "/ir/external-submissions/{submission_id}/reconcile"
    description: "Reconcile the submitted figure against the certified federal value: DRAFT -> RECONCILED or DRAFT -> VARIANCE_HOLD per calculations.submission_reconciliation."
    roles: [IRAnalyst]
    code: 200
    input: []
    output: ExternalSubmission
    side_effects:
      - "federal_value, raw_delta_pct, allowance_pct, effective_delta_pct and tolerance_pct written; status := RECONCILED | VARIANCE_HOLD; version += 1"

  - method: POST
    path: "/ir/external-submissions/{submission_id}/variance-override"
    description: "Director override of a held variance: VARIANCE_HOLD -> RECONCILED, preserving the recorded reconciliation figures for audit."
    roles: [IRDirector]
    code: 200
    input: [override_reason]
    output: ExternalSubmission
    side_effects:
      - "status := RECONCILED; override_reason stored; overridden_by_user_id := X-User-ID; version += 1"
      - "the five reconciliation fields are deliberately NOT recomputed"

  - method: POST
    path: "/ir/external-submissions/{submission_id}/transmit"
    description: "Transmit a reconciled submission to its recipient: RECONCILED -> TRANSMITTED (terminal). Requires a frozen cycle and a deadline not yet passed."
    roles: [IRDirector]
    code: 200
    input: [transmission_reference]
    output: ExternalSubmission
    side_effects:
      - "status := TRANSMITTED; transmission_reference stored; transmitted_at := logical clock; version += 1"

  # ---------------------------------------------------------------- DashboardPublication
  - method: POST
    path: "/ir/publications"
    description: "Publish one metric value to the internal dashboard over a HALF-OPEN effective window [effective_from, effective_to); omitting effective_to means currently effective. Requires a frozen cycle."
    roles: [IRAnalyst]
    code: 201
    input: [component_id, metric_key, published_value, effective_from, "effective_to?"]
    output: DashboardPublication
    side_effects:
      - "creates the DashboardPublication with publication_status PUBLISHED, original_value := published_value, net_applied_delta 0.0, restatement_count 0, published_by_user_id := X-User-ID, version 1"

  - method: GET
    path: "/ir/publications/{publication_id}"
    description: "Read one dashboard publication with its restatement ledger fields."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: DashboardPublication
    side_effects: []

  - method: GET
    path: "/ir/publications"
    description: "List dashboard publications, filterable by component, metric_key or publication_status. Ordered by effective_from ASC then created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["component_id?", "metric_key?", "publication_status?", "limit?", "offset?"]
    output: DashboardPublication[]
    side_effects: []

  - method: POST
    path: "/ir/publications/{publication_id}/withdraw"
    description: "Withdraw a published figure (terminal WITHDRAWN), voiding its pending restatements and freeing its effective window."
    roles: [IRDirector]
    code: 200
    input: [withdrawal_reason]
    output: DashboardPublication
    side_effects:
      - "publication_status := WITHDRAWN; withdrawal_reason stored; version += 1"
      - "every SUBMITTED RestatementRequest of this publication := VOIDED"

  # ---------------------------------------------------------------- RestatementRequest
  - method: POST
    path: "/ir/publications/{publication_id}/restatements"
    description: "File a change-control request to restate a published figure. OCC-guarded on the publication (§1.2.1 restatement-create-stale-publication); materiality and public-notice need are computed at filing time."
    roles: [IRAnalyst]
    code: 201
    input: [proposed_value, justification, expected_publication_version]
    output: RestatementRequest
    side_effects:
      - "creates the RestatementRequest with status SUBMITTED, origin ANALYST, baseline_value := publication.published_value, requested_by_user_id := X-User-ID, delta_pct and public_notice_required per calculations.restatement_materiality, version 1"
      - "increments DashboardPublication.version by 1 and moves it PUBLISHED -> RESTATEMENT_PENDING (or RESTATED -> RESTATEMENT_PENDING)"
      - "every other SUBMITTED RestatementRequest of this publication := SUPERSEDED"

  - method: GET
    path: "/ir/restatements/{restatement_id}"
    description: "Read one restatement request with its baseline, delta and public-notice flag."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: []
    output: RestatementRequest
    side_effects: []

  - method: GET
    path: "/ir/restatements"
    description: "List restatement requests, filterable by publication, status or origin (ANALYST vs CASCADE). Ordered by created_at ASC."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: ["publication_id?", "status?", "origin?", "limit?", "offset?"]
    output: RestatementRequest[]
    side_effects: []

  - method: POST
    path: "/ir/restatements/{restatement_id}/approve"
    description: "Approve and apply a restatement: SUBMITTED -> APPLIED, moving the publication to RESTATED. A material change requires a public notice reference."
    roles: [IRDirector]
    code: 200
    input: ["public_notice_reference?"]
    output: RestatementRequest
    side_effects:
      - "status := APPLIED; approved_by_user_id := X-User-ID; public_notice_reference stored; version += 1"
      - "publication.published_value := proposed_value; net_applied_delta += (proposed_value - baseline_value); restatement_count += 1; publication_status := RESTATED; publication.version += 1"

  - method: POST
    path: "/ir/restatements/{restatement_id}/reject"
    description: "Reject a restatement: SUBMITTED -> REJECTED, returning the publication to PUBLISHED (never restated) or RESTATED (already restated once)."
    roles: [IRDirector]
    code: 200
    input: [rejection_reason]
    output: RestatementRequest
    side_effects:
      - "status := REJECTED; approved_by_user_id := X-User-ID; rejection_reason stored; version += 1"
      - "publication_status := PUBLISHED when restatement_count == 0, else RESTATED; publication.version += 1; published_value and net_applied_delta unchanged"

  # ---------------------------------------------------------------- DataRequest
  - method: POST
    path: "/ir/reporting-cycles/{cycle_id}/data-requests"
    description: "Intake a data request against a frozen file, choosing the disclosure-avoidance method (default SMALL_CELL_SUPPRESSION) and the minimum cell size (default 5)."
    roles: [DisclosureOfficer]
    code: 201
    input: [requester_org, requester_type, requested_metric_key, "avoidance_method?", "min_cell_size?"]
    output: DataRequest
    side_effects:
      - "creates the DataRequest with status RECEIVED, cell_count 0, suppressed_cell_count 0, released_cell_count 0, residual_disclosure_risk false, version 1"

  - method: GET
    path: "/ir/data-requests/{request_id}"
    description: "Read one data request with its screening counters and residual-risk flag."
    roles: [IRDirector, DisclosureOfficer]
    code: 200
    input: []
    output: DataRequest
    side_effects: []

  - method: GET
    path: "/ir/data-requests"
    description: "List data requests, filterable by cycle, status or requester type. Ordered by created_at ASC."
    roles: [IRDirector, DisclosureOfficer]
    code: 200
    input: ["cycle_id?", "status?", "requester_type?", "limit?", "offset?"]
    output: DataRequest[]
    side_effects: []

  - method: POST
    path: "/ir/data-requests/{request_id}/screen"
    description: "Run disclosure avoidance over the request's crosstab: RECEIVED -> SCREENED, or RECEIVED -> REFUSED when the whole crosstab totals below the minimum cell size."
    roles: [DisclosureOfficer]
    code: 200
    input: []
    output: DataRequest
    side_effects:
      - "every DisclosureCell is assigned suppression_state and released_count per calculations.disclosure_avoidance (dimension_group ASC then dimension_key ASC); each cell's version += 1"
      - "suppressed_cell_count, released_cell_count and residual_disclosure_risk recomputed; screened_at and screened_by_user_id written; status := SCREENED; version += 1"
      - "on the REFUSED branch no cell is touched: refusal_reason := 'AGGREGATE_BELOW_MINIMUM' and every cell stays PENDING"

  - method: POST
    path: "/ir/data-requests/{request_id}/release"
    description: "Close a screened request: SCREENED -> RELEASED, or SCREENED -> SUPPRESSED_RELEASE when no cell survived screening. Refused for EXTERNAL/MEDIA requesters when residual disclosure risk remains."
    roles: [DisclosureOfficer]
    code: 200
    input: ["release_note?"]
    output: DataRequest
    side_effects:
      - "status := RELEASED | SUPPRESSED_RELEASE; release_note stored; version += 1"

  # ---------------------------------------------------------------- DisclosureCell
  - method: POST
    path: "/ir/data-requests/{request_id}/cells"
    description: "Add one raw crosstab cell (dimension group plus key) to a RECEIVED data request."
    roles: [DisclosureOfficer]
    code: 201
    input: [dimension_group, dimension_key, raw_count]
    output: DisclosureCell
    side_effects:
      - "creates the DisclosureCell with suppression_state PENDING, released_count null, version 1"
      - "parent request.cell_count recomputed; request.version += 1"

  - method: GET
    path: "/ir/disclosure-cells/{cell_id}"
    description: "Read one crosstab cell with its screening verdict and released_count."
    roles: [IRDirector, DisclosureOfficer]
    code: 200
    input: []
    output: DisclosureCell
    side_effects: []

  - method: GET
    path: "/ir/disclosure-cells"
    description: "List crosstab cells, filterable by request, dimension group or screening verdict. Ordered by dimension_group ASC then dimension_key ASC."
    roles: [IRDirector, DisclosureOfficer]
    code: 200
    input: ["request_id?", "dimension_group?", "suppression_state?", "limit?", "offset?"]
    output: DisclosureCell[]
    side_effects: []

  # ---------------------------------------------------------------- test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock, which every census-date, deadline and window rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before the first call."
    roles: [IRAnalyst, IRDirector, RegistrarOfficer, DataSteward, DisclosureOfficer]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects:
      - "the logical clock reads to_iso8601 for every subsequent request; no business row is mutated"

# =====================================================================================
# §1.6 Error Code Catalog
# =====================================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the called endpoint in §1.5"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong JSON type, undeclared enum member, malformed date or instant, negative count, or a declared free-text length bound violated (reopen_reason, decertify_reason, certification_statement, prior_year_comparison_note, adjudication_note, override_reason, withdrawal_reason, justification, transmission_reference)"
  # --- existence ---
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "{cycle_id} path parameter or cycle_id body field names no ReportingCycle"
  - id: ERR_FROZEN_FILE_NOT_FOUND
    http: 404
    condition: "{frozen_file_id} path parameter or frozen_file_id body field names no FrozenFile, or names one belonging to a different cycle"
  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "{component_id} path parameter or component_id body field names no SurveyComponent, or names one belonging to a different cycle than the supplied cycle_id"
  - id: ERR_METRIC_NOT_FOUND
    http: 404
    condition: "{metric_id} names no ComponentMetric"
  - id: ERR_EDIT_CHECK_NOT_FOUND
    http: 404
    condition: "{edit_check_id} names no EditCheck"
  - id: ERR_COHORT_NOT_FOUND
    http: 404
    condition: "{cohort_id} names no CohortDefinition"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "{member_id} names no CohortMember"
  - id: ERR_DEFINITION_NOT_FOUND
    http: 404
    condition: "{definition_id} path parameter or definition_id body field names no FederalDefinition"
  - id: ERR_MAPPING_NOT_FOUND
    http: 404
    condition: "{mapping_id} names no DataElementMapping"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "{submission_id} names no ExternalSubmission"
  - id: ERR_PUBLICATION_NOT_FOUND
    http: 404
    condition: "{publication_id} names no DashboardPublication"
  - id: ERR_RESTATEMENT_NOT_FOUND
    http: 404
    condition: "{restatement_id} names no RestatementRequest"
  - id: ERR_DATA_REQUEST_NOT_FOUND
    http: 404
    condition: "{request_id} names no DataRequest"
  - id: ERR_CELL_NOT_FOUND
    http: 404
    condition: "{cell_id} names no DisclosureCell"
  # --- cycle posture ---
  - id: ERR_CYCLE_FROZEN
    http: 409
    condition: "pre-freeze work attempted while the governing cycle's snapshot_posture is FROZEN or ARCHIVED"
  - id: ERR_CENSUS_LOCKED
    http: 409
    condition: "a census extract registration attempted while the cycle is CENSUS_LOCKED (the snapshot is sealed until reopen)"
  - id: ERR_CYCLE_NOT_FROZEN
    http: 409
    condition: "dashboard publication, external transmission or a disclosure step attempted while the cycle is not FROZEN or ARCHIVED"
  - id: ERR_INVALID_CYCLE_STATE
    http: 409
    condition: "component work attempted while the cycle is still OPEN, a cycle transition fired from the wrong posture, or any child mutation on an ARCHIVED cycle"
  # --- optimistic concurrency ---
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal ReportingCycle.version on POST /ir/reporting-cycles/{cycle_id}/frozen-files"
  - id: ERR_STALE_PUBLICATION_VERSION
    http: 412
    condition: "expected_publication_version does not equal DashboardPublication.version on POST /ir/publications/{publication_id}/restatements"
  # --- target-entity state ---
  - id: ERR_INVALID_COMPONENT_STATE
    http: 409
    condition: "the SurveyComponent's prep_status does not admit this operation (metric write outside DRAFT, prepare outside DRAFT, certify outside PREPARED, submit outside CERTIFIED, revert from DRAFT or SUBMITTED, explain while not PREPARED)"
  - id: ERR_INVALID_EDIT_CHECK_STATE
    http: 409
    condition: "explain attempted on a check that is not OPEN or REJECTED, or adjudicate on a check that is not EXPLAINED"
  - id: ERR_COHORT_LOCKED
    http: 409
    condition: "roster write (member add, outcome patch) or a second lock attempted on a LOCKED CohortDefinition"
  - id: ERR_INVALID_EXCLUSION_STATE
    http: 409
    condition: "exclusion claim filed on a member that is CLAIMED or APPROVED, or a review fired on a member that is NONE or DENIED"
  - id: ERR_INVALID_MAPPING_STATE
    http: 409
    condition: "validate attempted on a mapping that is not PROPOSED, or revise on one that is not REJECTED"
  - id: ERR_INVALID_SUBMISSION_STATE
    http: 409
    condition: "reconcile outside DRAFT, variance-override outside VARIANCE_HOLD, or transmit outside RECONCILED"
  - id: ERR_INVALID_PUBLICATION_STATE
    http: 409
    condition: "restatement filed on a WITHDRAWN publication, approve or reject fired while the publication is not RESTATEMENT_PENDING, or withdraw on an already WITHDRAWN publication"
  - id: ERR_INVALID_RESTATEMENT_STATE
    http: 409
    condition: "approve or reject fired on a RestatementRequest that is not SUBMITTED (already APPLIED, REJECTED, SUPERSEDED or VOIDED)"
  - id: ERR_INVALID_DATA_REQUEST_STATE
    http: 409
    condition: "cell added outside RECEIVED, screen fired outside RECEIVED, or release fired outside SCREENED"
  # --- cross-entity state ---
  - id: ERR_FROZEN_FILE_SUPERSEDED
    http: 409
    condition: "prepare attempted on a component whose referenced FrozenFile has status SUPERSEDED"
  - id: ERR_EDIT_CHECKS_UNRESOLVED
    http: 409
    condition: "certify attempted while the component's edit_status is not CLEARED"
  - id: ERR_COMPONENTS_NOT_READY
    http: 409
    condition: "freeze attempted with no SurveyComponent at all, or with at least one component whose prep_status is not CERTIFIED"
  - id: ERR_NO_ACTIVE_SNAPSHOT
    http: 409
    condition: "census-lock attempted with no ACTIVE FrozenFile on the cycle"
  - id: ERR_UNRESOLVED_EXCLUSION_CLAIM
    http: 409
    condition: "cohort lock attempted while at least one member's exclusion_status is CLAIMED"
  - id: ERR_SOURCE_NOT_CERTIFIED
    http: 409
    condition: "reconcile attempted while the source component's prep_status is neither CERTIFIED nor SUBMITTED"
  # --- safety / compliance ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals prepared_by_user_id on certify, explained_by_user_id on adjudicate, or requested_by_user_id on restatement approve/reject"
  - id: ERR_SMALL_CELL_DISCLOSURE
    http: 422
    condition: "release attempted for an EXTERNAL or MEDIA requester while residual_disclosure_risk is true"
  - id: ERR_WAIVER_NOT_PERMITTED
    http: 422
    condition: "decision WAIVE on an edit check whose severity is FATAL"
  # --- referential / domain ---
  - id: ERR_VALUE_DOMAIN_VIOLATION
    http: 422
    condition: "a mapping's value_map targets a code absent from the referenced FederalDefinition.value_domain"
  - id: ERR_METRIC_DOMAIN_MISMATCH
    http: 422
    condition: "metric_key is not permitted for the component's component_code (validations priority 17)"
  - id: ERR_INVALID_EXCLUSION_CODE
    http: 422
    condition: "exclusion_code is outside the closed federal list of allowable exclusions"
  - id: ERR_FEDERAL_VALUE_UNAVAILABLE
    http: 422
    condition: "reconcile finds no ComponentMetric with the submission's metric_key on the referenced component"
  - id: ERR_ZERO_BASE_RECONCILIATION
    http: 422
    condition: "reconcile finds the federal counterpart's reported_value equal to 0, so no percentage gap is defined"
  # --- temporal ---
  - id: ERR_CENSUS_DATE_NOT_REACHED
    http: 422
    condition: "census-lock attempted while the logical clock's date is strictly before cycle.census_date"
  - id: ERR_COLLECTION_DEADLINE_PASSED
    http: 422
    condition: "certify, submit or transmit attempted while the logical clock is strictly after cycle.collection_deadline"
  - id: ERR_INVALID_COVERAGE_WINDOW
    http: 422
    condition: "coverage_start_date > coverage_end_date, or a coverage date outside the cycle's reporting year window"
  - id: ERR_INVALID_EFFECTIVE_WINDOW
    http: 422
    condition: "effective_to supplied and not strictly after effective_from"
  # --- overlap / uniqueness ---
  - id: ERR_COVERAGE_WINDOW_OVERLAP
    http: 409
    condition: "the new closed coverage window intersects a non-superseded extract of the same (cycle_id, domain); a shared endpoint date counts as an intersection"
  - id: ERR_PUBLICATION_WINDOW_OVERLAP
    http: 409
    condition: "the new half-open effective window intersects a non-withdrawn publication of the same (component_id, metric_key); a shared boundary instant does not count"
  - id: ERR_DUPLICATE_CYCLE_CODE
    http: 409
    condition: "cycle_code already exists"
  - id: ERR_DUPLICATE_COMPONENT
    http: 409
    condition: "(cycle_id, component_code) already exists"
  - id: ERR_DUPLICATE_METRIC_KEY
    http: 409
    condition: "(component_id, metric_key) already exists"
  - id: ERR_DUPLICATE_COHORT
    http: 409
    condition: "(cycle_id, cohort_type, entry_term) already exists"
  - id: ERR_DUPLICATE_MEMBER
    http: 409
    condition: "(cohort_id, student_local_id) already exists"
  - id: ERR_DUPLICATE_DEFINITION
    http: 409
    condition: "(definition_code, effective_cycle_code) already exists"
  - id: ERR_DUPLICATE_MAPPING
    http: 409
    condition: "(cycle_id, definition_id, local_system_code) already exists among mappings whose status is not REJECTED"
  - id: ERR_DUPLICATE_SUBMISSION
    http: 409
    condition: "(cycle_id, target_name, metric_key) already exists among submissions whose status is not TRANSMITTED"
  - id: ERR_DUPLICATE_CELL
    http: 409
    condition: "(request_id, dimension_group, dimension_key) already exists"
  # --- fiscal / sufficiency ---
  - id: ERR_PUBLIC_NOTICE_REQUIRED
    http: 422
    condition: "approve attempted on a restatement with public_notice_required true and no public_notice_reference supplied"
  - id: ERR_EMPTY_COHORT
    http: 422
    condition: "cohort lock attempted with initial_count == 0"
  - id: ERR_EMPTY_COHORT_DENOMINATOR
    http: 422
    condition: "cohort lock attempted with adjusted_count == 0 (every member approved-excluded)"
  - id: ERR_NO_METRICS
    http: 422
    condition: "prepare attempted on a component with no ComponentMetric"
  - id: ERR_NO_CELLS_TO_SCREEN
    http: 422
    condition: "screen attempted on a data request with cell_count == 0"
  # --- content sufficiency ---
  - id: ERR_EXPLANATION_TOO_SHORT
    http: 422
    condition: "explanation_text shorter than 20 characters after trimming"
  - id: ERR_REJECTION_REASON_REQUIRED
    http: 422
    condition: "decision REJECT on a mapping validate, or a restatement reject, without a 10-500 character rejection_reason"

# =====================================================================================
# §1.7 RBAC Matrix   (role_model: segregation_of_duties — the acting X-User-ID is
#      compared against the user who performed the preceding step, per §1.4 priority 13)
# =====================================================================================
roles:
  - name: IRAnalyst
    description: "Institutional research analyst: assembles survey components, reports metrics, explains prior-year variances, proposes element mappings, drafts external submissions, publishes dashboard figures and files restatement requests."
    identity: opaque
    exclusive_operations:
      - "POST /ir/survey-components"
      - "POST /ir/survey-components/{component_id}/metrics"
      - "PATCH /ir/component-metrics/{metric_id}"
      - "POST /ir/survey-components/{component_id}/prepare"
      - "POST /ir/edit-checks/{edit_check_id}/explain"
      - "POST /ir/element-mappings"
      - "POST /ir/element-mappings/{mapping_id}/revise"
      - "POST /ir/external-submissions"
      - "POST /ir/external-submissions/{submission_id}/reconcile"
      - "POST /ir/publications"
      - "POST /ir/publications/{publication_id}/restatements"
    shared_operations:
      - "every GET except the data-request and disclosure-cell reads"
      - "POST /_clock/set_current_utc"

  - name: IRDirector
    description: "Institutional research director: the approving authority. Certifies and submits components, adjudicates edit checks and exclusion claims, decides restatements, overrides held variances, transmits external submissions and withdraws publications. Never performs the analyst step it approves."
    identity: opaque
    exclusive_operations:
      - "POST /ir/reporting-cycles/{cycle_id}/freeze"
      - "POST /ir/reporting-cycles/{cycle_id}/reopen"
      - "POST /ir/survey-components/{component_id}/certify"
      - "POST /ir/survey-components/{component_id}/submit"
      - "POST /ir/survey-components/{component_id}/revert-to-draft"
      - "POST /ir/edit-checks/{edit_check_id}/adjudicate"
      - "POST /ir/cohort-members/{member_id}/exclusion-review"
      - "POST /ir/external-submissions/{submission_id}/variance-override"
      - "POST /ir/external-submissions/{submission_id}/transmit"
      - "POST /ir/publications/{publication_id}/withdraw"
      - "POST /ir/restatements/{restatement_id}/approve"
      - "POST /ir/restatements/{restatement_id}/reject"
    shared_operations:
      - "every GET, including the data-request and disclosure-cell reads shared with DisclosureOfficer"
      - "POST /_clock/set_current_utc"

  - name: RegistrarOfficer
    description: "Registrar office: owns the census snapshot and the student roster. Opens cycles, registers census extracts, locks the census, defines and locks cohorts, records outcomes and files allowable-exclusion claims."
    identity: opaque
    exclusive_operations:
      - "POST /ir/reporting-cycles"
      - "POST /ir/reporting-cycles/{cycle_id}/census-lock"
      - "POST /ir/reporting-cycles/{cycle_id}/frozen-files"
      - "POST /ir/reporting-cycles/{cycle_id}/cohorts"
      - "POST /ir/cohorts/{cohort_id}/members"
      - "PATCH /ir/cohort-members/{member_id}"
      - "POST /ir/cohort-members/{member_id}/exclusion-claim"
      - "POST /ir/cohorts/{cohort_id}/lock"
    shared_operations:
      - "every GET except the data-request and disclosure-cell reads"
      - "POST /_clock/set_current_utc"

  - name: DataSteward
    description: "Data steward: owns the federal definition library and the verdict on local-to-federal element mappings. Cannot author the mappings it validates."
    identity: opaque
    exclusive_operations:
      - "POST /ir/federal-definitions"
      - "POST /ir/element-mappings/{mapping_id}/validate"
    shared_operations:
      - "every GET except the data-request and disclosure-cell reads"
      - "POST /_clock/set_current_utc"

  - name: DisclosureOfficer
    description: "Disclosure officer: intakes external data requests, builds the crosstab, runs disclosure avoidance and closes the request. The only role that may write disclosure artefacts."
    identity: opaque
    exclusive_operations:
      - "POST /ir/reporting-cycles/{cycle_id}/data-requests"
      - "POST /ir/data-requests/{request_id}/cells"
      - "POST /ir/data-requests/{request_id}/screen"
      - "POST /ir/data-requests/{request_id}/release"
    shared_operations:
      - "every GET, including GET /ir/data-requests, GET /ir/data-requests/{request_id}, GET /ir/disclosure-cells and GET /ir/disclosure-cells/{cell_id} (shared only with IRDirector)"
      - "POST /_clock/set_current_utc"
