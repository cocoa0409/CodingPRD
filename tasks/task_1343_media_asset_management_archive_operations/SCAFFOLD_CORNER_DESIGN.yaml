# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Media Asset Management & Archive Operations
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: ingest_batch_create_defaults
        claim_type: creation
        grounds: [entities.IngestBatch, endpoints."POST /archive/ingest-batches"]
        distinguishing_aspect: "Create returns 201 with system fields: status OPEN, asset_count 0, version 1, server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { b: $.data.id, b_status: $.data.status, b_count: $.data.asset_count, b_v: $.data.version }
          trigger:
            - call: "GET /archive/ingest-batches/${b}"
              as: IngestCoordinator
          assert:
            - "status == OPEN; asset_count == 0; version == 1; id is a prefix-free UUID"

      - name: asset_create_missing_title_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Asset.fields.title", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field title yields ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["OPEN batch exists"]
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME" }
              as: IngestCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http 400"

      - name: asset_create_computed_posture_input_ignored
        claim_type: computed_fields
        grounds: [entities.Asset.fields.rights_posture, entities.Asset.fields.storage_tier]
        distinguishing_aspect: "Client-supplied rights_posture/storage_tier are ignored: a fresh asset with no grants computes rights_posture EXPIRED and storage_tier ONLINE."
        test_recipe:
          setup: ["OPEN batch exists"]
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
          assert:
            - "Asset.${asset_id}.rights_posture == EXPIRED (no grants), storage_tier == ONLINE, catalog_status == METADATA_DRAFT"
            - "Asset.${asset_id}.source_asset_id == null; batch asset_count == 1"

      - name: asset_create_invalid_format_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Asset.fields.format_class", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "format_class 'LASERDISC' is outside the declared enum → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["OPEN batch exists"]
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "LASERDISC", duration_seconds: 60, size_gb: 5, rights_holder: "ACME" }
              as: IngestCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http 400"

      - name: asset_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ASSET_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID → ERR_ASSET_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /archive/assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ArchivistLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSET_NOT_FOUND; http 404"

      - name: asset_list_pagination_has_more
        claim_type: listing
        grounds: [response_envelope, endpoints."GET /archive/assets"]
        distinguishing_aspect: "3 assets listed with limit=2: page 1 has 2 items + has_more true + total_count 3; offset=2 returns 1 item + has_more false."
        test_recipe:
          setup: ["One OPEN batch with 3 assets"]
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "A", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME" }
              as: IngestCoordinator
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "B", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME" }
              as: IngestCoordinator
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "C", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME" }
              as: IngestCoordinator
          trigger:
            - call: "GET /archive/assets?ingest_batch_id=${batch_id}&limit=2&offset=0"
              as: ArchivistLead
            - call: "GET /archive/assets?ingest_batch_id=${batch_id}&limit=2&offset=2"
              as: ArchivistLead
          assert:
            - "Page 1: exactly 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset=2): exactly 1 item, has_more == false"

      - name: digitization_qc_pass_creates_self_referential_derivative
        claim_type: parent_relationships
        grounds: [entities.Asset.fields.source_asset_id, state_machines.DigitizationTicket.QC_REVIEW_to_COMPLETED]
        distinguishing_aspect: "qc-pass materializes a derivative Asset whose source_asset_id == original id (self-referential FK), format_class == ticket output_format, inheriting the FINALIZED batch; discoverable via GET /archive/assets?source_asset_id=."
        test_recipe:
          setup:
            - "BETACAM_SP asset in batch B (batch left OPEN); workstation supports BETACAM_SP; ticket run to QC_REVIEW"
          setup_api_calls:
            - call: "POST /archive/workstations"
              payload: { name: "WS-1", supported_formats: ["BETACAM_SP"] }
              as: SystemAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "VAULT" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "Old tape", description: "d", media_type: "VIDEO", format_class: "BETACAM_SP", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/digitization-tickets"
              payload: { asset_id: "${asset_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T02:00:00Z", output_format: "PRORES_FILE" }
              as: ArchivistLead
              captures: { t_id: $.data.id }
            - call: "POST /archive/digitization-tickets/${t_id}/assign"
              payload: { workstation_id: "${ws_id}" }
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/digitization-tickets/${t_id}/submit-qc"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /archive/digitization-tickets/${t_id}/qc-pass"
              payload: { qc_notes: "clean" }
              as: LabTechnician
            - call: "GET /archive/assets?source_asset_id=${asset_id}"
              as: ArchivistLead
              captures: {deriv_id: "$.data[0].id", deriv_fmt: "$.data[0].format_class"}
          assert:
            - "Ticket.${t_id}.status == COMPLETED"
            - "GET ?source_asset_id returns exactly 1 asset: format_class == PRORES_FILE, catalog_status == METADATA_DRAFT, storage_tier == ONLINE, ingest_batch_id == ${batch_id}"

      - name: staff_member_duplicate_email_rejected
        claim_type: type_constraints
        grounds: ["entities.StaffMember.fields.email", "errors[ERR_DUPLICATE_STAFF_EMAIL]"]
        distinguishing_aspect: "Second staff member with the same email → ERR_DUPLICATE_STAFF_EMAIL 422."
        test_recipe:
          setup: ["staff member r@x.com exists"]
          setup_api_calls:
            - call: "POST /archive/staff-members"
              payload: { email: "r@x.com", full_name: "R", department: "NEWS" }
              as: SystemAdmin
          trigger:
            - call: "POST /archive/staff-members"
              payload: { email: "r@x.com", full_name: "R2", department: "NEWS" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_STAFF_EMAIL; http 422"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: asset_initial_state_and_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Asset", "errors[ERR_INVALID_CATALOG_TRANSITION]"]
        distinguishing_aspect: "A DISPOSED asset rejects submit-metadata with ERR_INVALID_CATALOG_TRANSITION (terminal lockdown); fresh asset starts METADATA_DRAFT."
        test_recipe:
          setup: ["Asset fully disposed via executed DisposalOrder (chain mirrors disposal_execution_depth2_cascade setup)"]
          setup_api_calls:
            - call: "POST /archive/retention-policies"
              payload: { media_type: "VIDEO", min_retention_years: 0 }
              as: SystemAdmin
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/assets/${asset_id}/submit-metadata"
              payload: {}
              as: MetadataCataloger
              as_user_id: "cat-1"
            - call: "POST /archive/assets/${asset_id}/metadata-approve"
              payload: {}
              as: MetadataLibrarian
              as_user_id: "lib-1"
            - call: "POST /archive/proxy-renditions"
              payload: { asset_id: "${asset_id}" }
              as: LabTechnician
              captures: { pr_id: $.data.id }
            - call: "POST /archive/proxy-renditions/${pr_id}/claim"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr_id}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: RightsManager
            - call: "POST /archive/assets/${asset_id}/archive"
              payload: {}
              as: ArchivistLead
              as_user_id: "arch-1"
              captures: { v_arch: $.data.version }
            - call: "POST /archive/disposal-orders"
              payload: { asset_id: "${asset_id}", scheduled_execution_date: "2026-08-02T00:00:00Z", expected_asset_version: "${v_arch}" }
              as: ArchivistLead
              as_user_id: "arch-1"
              captures: { order_id: $.data.id }
            - call: "POST /archive/disposal-orders/${order_id}/submit"
              payload: {}
              as: ArchivistLead
              as_user_id: "arch-1"
            - call: "POST /archive/disposal-orders/${order_id}/approve"
              payload: {}
              as: ArchivistLead
              as_user_id: "arch-2"
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /archive/disposal-orders/${order_id}/execute"
              payload: {}
              as: ArchivistLead
              as_user_id: "arch-1"
          trigger:
            - call: "POST /archive/assets/${asset_id}/submit-metadata"
              payload: {}
              as: MetadataCataloger
              as_user_id: "cat-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_CATALOG_TRANSITION; http 409 (DISPOSED is terminal)"

      - name: proxy_retry_budget_exhausted_at_cap
        claim_type: invalid_transition
        grounds: ["state_machines.ProxyRendition.FAILED_to_QUEUED", "errors[ERR_RETRY_BUDGET_EXHAUSTED]"]
        distinguishing_aspect: "Retries allowed while retry_count < 3: after 3 retries the 4th retry attempt → ERR_RETRY_BUDGET_EXHAUSTED; rendition stays FAILED."
        test_recipe:
          setup: ["Asset exists; rendition failed 3 times and retried 3 times (retry_count == 3)"]
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/proxy-renditions"
              payload: { asset_id: "${asset_id}" }
              as: LabTechnician
              captures: { pr: $.data.id }
            - call: "POST /archive/proxy-renditions/${pr}/claim"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/fail"
              payload: { reason: "f1" }
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/retry"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/claim"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/fail"
              payload: { reason: "f2" }
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/retry"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/claim"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/fail"
              payload: { reason: "f3" }
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/retry"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/claim"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr}/fail"
              payload: { reason: "f4" }
              as: LabTechnician
          trigger:
            - call: "POST /archive/proxy-renditions/${pr}/retry"
              payload: {}
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETRY_BUDGET_EXHAUSTED; http 409; ProxyRendition.${pr}.retry_count == 3 and status == FAILED"

      - name: migration_retry_budget_and_start_from_hold_paused
        claim_type: precondition_enforcement
        grounds: ["state_machines.MigrationJob", "errors[ERR_JOB_NOT_QUEUED]", "errors[ERR_RETRY_BUDGET_EXHAUSTED]"]
        distinguishing_aspect: "start on a HOLD_PAUSED job → ERR_JOB_NOT_QUEUED; migration retry cap 2 → third retry attempt → ERR_RETRY_BUDGET_EXHAUSTED."
        test_recipe:
          setup: ["Asset ARCHIVED-free (METADATA_DRAFT ok) with one migration job that has failed twice and been retried twice (retry_count == 2), currently FAILED; plus a second asset with a QUEUED job paused by a hold"]
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /archive/migration-jobs"
              payload: { asset_id: "${a1}", target_tier: "NEARLINE", expected_asset_version: "${a1_v}" }
              as: ArchivistLead
              captures: { j1: $.data.id }
            - call: "POST /archive/migration-jobs/${j1}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/migration-jobs/${j1}/fail"
              payload: { reason: "x" }
              as: LabTechnician
            - call: "POST /archive/migration-jobs/${j1}/retry"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/migration-jobs/${j1}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/migration-jobs/${j1}/fail"
              payload: { reason: "x" }
              as: LabTechnician
            - call: "POST /archive/migration-jobs/${j1}/retry"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/migration-jobs/${j1}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/migration-jobs/${j1}/fail"
              payload: { reason: "x" }
              as: LabTechnician
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "U", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { a2: $.data.id, a2_v: $.data.version }
            - call: "POST /archive/migration-jobs"
              payload: { asset_id: "${a2}", target_tier: "DEEP_ARCHIVE", expected_asset_version: "${a2_v}" }
              as: ArchivistLead
              captures: { j2: $.data.id }
            - call: "POST /archive/legal-holds"
              payload: { asset_id: "${a2}", matter_reference: "M1", reason: "r" }
              as: LegalCounsel
              as_user_id: "lc-1"
              captures: { h2: $.data.id }
          trigger:
            - call: "POST /archive/migration-jobs/${j1}/retry"
              payload: {}
              as: LabTechnician
              captures: { err1: $.data.error_id }
            - call: "POST /archive/migration-jobs/${j2}/start"
              payload: {}
              as: LabTechnician
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_RETRY_BUDGET_EXHAUSTED (retry_count == 2 at cap for migrations)"
            - "err2 == ERR_JOB_NOT_QUEUED (HOLD_PAUSED is not QUEUED)"

      - name: retrieval_deliver_after_expiry_sweep_rejected
        claim_type: side_effect_execution
        grounds: ["state_machines.RetrievalRequest.STAGED_to_EXPIRED", "state_machines.RetrievalRequest.STAGED_to_DELIVERED", "errors[ERR_REQUEST_NOT_STAGED]"]
        distinguishing_aspect: "Clock sweep: STAGED request expires only when now > staged_at + 72h — at exactly +72h deliver still succeeds; +72h1s the sweep has moved it to EXPIRED and deliver → ERR_REQUEST_NOT_STAGED."
        test_recipe:
          setup: ["Two CATALOGED assets each with a STAGED request staged at 2026-08-01T00:00:00Z (default clock)"]
          setup_api_calls:
            - call: "POST /archive/staff-members"
              payload: { email: "r@x.com", full_name: "R", department: "NEWS" }
              as: SystemAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "A", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { a1: $.data.id }
            - call: "POST /archive/assets/${a1}/submit-metadata"
              payload: {}
              as: MetadataCataloger
              as_user_id: "cat-1"
            - call: "POST /archive/assets/${a1}/metadata-approve"
              payload: {}
              as: MetadataLibrarian
              as_user_id: "lib-1"
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${a1}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: RightsManager
            - call: "POST /archive/retrieval-requests"
              payload: { asset_id: "${a1}", requester_id: "${staff_id}", purpose: "BROADCAST", requested_delivery_by: "2026-12-01T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { r1: $.data.id }
            - call: "POST /archive/retrieval-requests/${r1}/start-review"
              payload: {}
              as: AccessOfficer
            - call: "POST /archive/retrieval-requests/${r1}/approve"
              payload: {}
              as: AccessOfficer
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "B", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { a2: $.data.id }
            - call: "POST /archive/assets/${a2}/submit-metadata"
              payload: {}
              as: MetadataCataloger
              as_user_id: "cat-1"
            - call: "POST /archive/assets/${a2}/metadata-approve"
              payload: {}
              as: MetadataLibrarian
              as_user_id: "lib-1"
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${a2}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: RightsManager
            - call: "POST /archive/retrieval-requests"
              payload: { asset_id: "${a2}", requester_id: "${staff_id}", purpose: "BROADCAST", requested_delivery_by: "2026-12-01T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { r2: $.data.id }
            - call: "POST /archive/retrieval-requests/${r2}/start-review"
              payload: {}
              as: AccessOfficer
            - call: "POST /archive/retrieval-requests/${r2}/approve"
              payload: {}
              as: AccessOfficer
          trigger:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /archive/retrieval-requests/${r1}/deliver"
              payload: {}
              as: AccessOfficer
