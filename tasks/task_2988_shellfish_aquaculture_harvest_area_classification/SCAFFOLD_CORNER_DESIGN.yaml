      - name: authorization_windows_longer_than_a_day_or_of_zero_length_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=55]
          - errors[ERR_AUTHORIZATION_WINDOW_INVALID]
          - entities.HarvestAuthorization.fields.window_end
        distinguishing_aspect: |
          The window rule has two limbs and both are exercised: window_end must be strictly after
          window_start (a zero-length window is refused, not silently accepted) and the span must not
          exceed MAX_AUTHORIZATION_WINDOW_HOURS (24), so a 31-hour window fails even though it is
          correctly ordered.
