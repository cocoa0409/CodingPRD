              as: ProgramAdmin
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_m_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/pt-enrollments"
