            - "All five round-1 reviews are SUPERSEDED; valid_review_count == 0 and provisional_composite_score, score_spread are null"
            - "After three round-2 reviews (8.00, 7.00, 6.00): valid_review_count == 3 and provisional_composite_score == 7.00"
            - "Second close-round: final_composite_score == 7.00 (trim still applies at seated_count 5 and n 3: kept = {7.00}), score_spread == 2.00, reopen_required == false, Application.status == SCORED, review_round_number == 2"
            - "A third open-round returns 409 ERR_PANEL_STATE_INVALID because round_number 2 is not below max_review_rounds 2"

      - name: award_agreement_payment_and_reporting_dimensions_diverge
        grounds:
          - state_machines.Award.payment_status.UNPAID_to_PARTIALLY_PAID
          - state_machines.Award.reporting_status.NOT_DUE_to_DUE
