      - name: allocation_revoke_restores_partner_committed_volume
        grounds:
          - state_machines.PartnerAllocation.COMMITTED_to_REVOKED
          - calculations.interval_allocatable_volume
          - entities.OutsourcePartner.fields.committed_volume_outstanding
          - entities.IntervalPlan.fields.partner_committed_volume
          - entities.IntervalPlan.fields.unserved_volume
