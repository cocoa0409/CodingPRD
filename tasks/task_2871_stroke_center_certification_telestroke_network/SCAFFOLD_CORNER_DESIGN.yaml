  - name: only_sentinel_deviations_need_a_debrief_before_they_can_be_substantiated
    claim_type: conditional_validation
    grounds:
    - validations priority 77 -> ERR_DEBRIEF_REQUIRED (422)
    - endpoints.POST /stroke-network/deviations/{id}/debrief
    - state_machines.ProtocolDeviation UNDER_REVIEW -> SUBSTANTIATED / DISMISSED
    distinguishing_aspect: 'The requirement is conditional on TWO things at once — severity SENTINEL and outcome SUBSTANTIATE — so three deviations are needed to pin it: SENTINEL+SUBSTANTIATE is refused without a debrief, MAJOR+SUBSTANTIATE is allowed without one, and SENTINEL+DISMISS is allowed without one. A rule keyed on severity alone would block the dismissal.'
