      - name: corner_custody_projection_breaks_on_seal_mismatch_and_never_repairs
        claim_type: correct_result
        grounds: [calculations.custody_chain_integrity, "calculations.custody_chain_integrity.formula rule (4)", "endpoints[POST /sample-kits/{id}/lab-accept]"]
        distinguishing_aspect: "The projection is monotone: a violation detected at event 2 pins the chain to BROKEN even though the remaining three events replay perfectly, and lab-accept then reads UNUSABLE off the projection rather than re-deriving it."
        test_recipe:
          setup: ["A shipped kit whose CONSUMER_SEALED event reports the wrong seal id."]
