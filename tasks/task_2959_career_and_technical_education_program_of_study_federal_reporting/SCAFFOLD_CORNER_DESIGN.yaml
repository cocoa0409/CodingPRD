          The clna axis is a CYCLE and re-entering it is not free: after the lazy CERTIFIED -> EXPIRED flip the program
          may advance EXPIRED -> DATA_COLLECTION, but DATA_COLLECTION -> STAKEHOLDER_CONSULTATION then fails with
          ERR_LABOR_MARKET_DATA_STALE because labor_market_data_asof 2026-03-01 is 883 days behind the 2028-08-01 clock,
