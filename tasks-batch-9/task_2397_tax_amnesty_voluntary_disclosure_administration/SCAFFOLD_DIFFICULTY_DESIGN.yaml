  - rule_id: cross_entity_state_dependency
    instances:
      - name: open_criminal_case_gates_agreement_drafting_until_closed
        grounds:
          - validations[priority=19]
          - entities.EnforcementCase.fields.status
          - state_machines.EnforcementCase.OPEN_to_CLOSED
          - calculations.taxpayer_compliance_behavior_score
        distinguishing_aspect: |
          Eligibility is decided by the CURRENT state of a foreign EnforcementCase row, not by
          any field on the Taxpayer or the program: the identical drafting payload is refused
          while the case is OPEN and accepted after /close, and the behavior score moves 80 -> 100
          on the same edge.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Granite Fork has one OPEN CRIMINAL_INVESTIGATION case on SALES_USE, so its behavior score is 80"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
