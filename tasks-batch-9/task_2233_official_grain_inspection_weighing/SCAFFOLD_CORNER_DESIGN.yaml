                drafts:
                  - { gross_lbs: 55000, tare_lbs: 21300 }
                  - { gross_lbs: 55000, tare_lbs: 21100 }
                  - { gross_lbs: 55200, tare_lbs: 21100 }
                  - { gross_lbs: 55300, tare_lbs: 21000 }
                  - { gross_lbs: 55500, tare_lbs: 21000 }
                  - { gross_lbs: 55700, tare_lbs: 21000 }
