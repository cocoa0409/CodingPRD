              as_user_id: "${tc_e}"
              captures: { wf_after: $.data.workflow_status }
          assert:
            - "${err_id} == ERR_EQUIPMENT_CALIBRATION_LAPSED"
            - "HTTP status == 409"
            - "${cal_status_fresh} == VALID"
            - "${wf_after} == ACQUIRED"
            - "Study.${s_e}.equipment_id == ${eq_e}"
            - "Equipment.${eq_e}.usage_count_since_qc == 1"

      - name: route_publish_blocked_until_mobile_unit_returns_to_service
        grounds:
          - state_machines.Route.DRAFT_to_PUBLISHED
          - entities.MobileUnit.fields.service_status
          - validations[priority=10]
          - write_gate_precedence.order.G3_UNIT_OUT_OF_SERVICE
          - errors[ERR_UNIT_OUT_OF_SERVICE]
        distinguishing_aspect: |
          A DIFFERENT entity pair — Route -> MobileUnit. The Route's
          DRAFT -> PUBLISHED transition is admissible only while the MobileUnit
          reads IN_SERVICE; taking the van out of service after the route was
          already built blocks publication, and returning it unblocks the very
          same request.
        test_recipe:
          setup:
            - "one DRAFT route carrying one PLANNED stop"
            - "the route's mobile unit switched to OUT_OF_SERVICE after the stop was added"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Grounded Vet", address_zone: "Z15" }
              as: PlatformAdmin
              captures: { cl_o: $.data.id }
