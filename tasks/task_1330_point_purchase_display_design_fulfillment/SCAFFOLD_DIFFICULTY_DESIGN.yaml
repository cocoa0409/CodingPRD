          business_safety (priority 5, ERR_COMPLIANCE_FAILED): approving a design
          that is BOTH in the wrong state (DRAFT, not COMPLIANCE_REVIEW) AND
          failing compliance must return ERR_INVALID_STATE (state wins).
        test_recipe:
          setup:
            - "Design in DRAFT with width exceeding MAX_WIDTH_IN (compliance FAIL), never submitted"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
