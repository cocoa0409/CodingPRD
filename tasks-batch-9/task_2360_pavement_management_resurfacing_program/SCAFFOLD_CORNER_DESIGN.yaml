      - name: segments_listing_with_limit_one_hundred_one_returns_invalid_request
        claim_type: input_validation_error
        grounds: ["validations.ERR_INVALID_REQUEST", "errors.ERR_INVALID_REQUEST", "pagination_defaults"]
        distinguishing_aspect: "Pagination bounds are validated, not silently clamped: limit=101 is 400 ERR_INVALID_REQUEST rather than a 100-row page, and limit=0 is rejected too because the declared minimum is 1 — while limit=100 is accepted, pinning the maximum as inclusive."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Exactly one segment exists (Maple St, Z1, LOCAL), so any accepted page would contain 1 row."
            - "The declared pagination bounds are limit in [1, 100] with default 10, offset >= 0 with default 0."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
          trigger:
            - call: "GET /pavement/segments"
              payload: { geo_zone: "Z1", limit: 101 }
              as: PavementEngineer
              captures: { e_id: "$.data.error_id" }
            - call: "GET /pavement/segments"
              payload: { geo_zone: "Z1", limit: 0 }
              as: PavementEngineer
              captures: { e_id2: "$.data.error_id" }
            - call: "GET /pavement/segments"
              payload: { geo_zone: "Z1", limit: 100 }
              as: PavementEngineer
              captures: { ok_first: "$.data[0].id" }
          assert:
            - "limit=101: HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'."
            - "limit=0: HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'."
            - "limit=100: HTTP 200 with meta.limit == 100, meta.total_count == 1 and ${ok_first} == ${seg1}."
            - "Neither rejection is a 404 and neither returns a data array."

