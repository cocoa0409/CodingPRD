          Certification of a plan with no budgets on an operation whose only structure holds 48 days
          of manure violates both priority 38 and priority 39, and 38 must win — which is only
          possible if the storage-days aggregate is computed before the budget existence check.
          The same fixture also proves the renewal gate is closed 4 years before the window opens.
        test_recipe:
          setup:
