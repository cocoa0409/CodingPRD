            - "RedemptionOrder.${ro_id}.issuer_cost_final_cents == null and cost_per_1k_final_cents == null"
            - "after the confirm Account.${a_id}.points_balance == 66666 and points_pending_redemption == 0"
            - "Account.${a_id}.lifetime_points_earned == 96000 and lifetime_points_redeemed == 29334"

      - name: available_points_subtracts_quoted_orders_only_not_confirmed_ones
        claim_type: input_set_filtering
        grounds:
          - calculations.available_points_for_redemption
          - validations[priority=70]
          - errors.ERR_INSUFFICIENT_POINTS
        distinguishing_aspect: "available_points is points_balance minus QUOTED reservations only: with a 10000-point balance fully reserved by a QUOTED portal order a 3000-point statement credit is refused with 402 ERR_INSUFFICIENT_POINTS, and once that order is cancelled the same 3000-point request succeeds; after confirming it the remaining 7000 points are still fully spendable, proving the CONFIRMED order's ledger debit is not subtracted a second time and that equality is admitted."
        test_recipe:
          setup:
