            - "Release.${rel_id}.status remains SCHEDULED and allocations == []"

      - name: pick_insufficient_stock_rejected
        claim_type: precondition_enforcement
        grounds:
          - "calculations.fefo_allocation"
          - "errors[ERR_INSUFFICIENT_STOCK]"
        distinguishing_aspect: "Pool non-empty but total on_hand (3) < release qty (10): ERR_INSUFFICIENT_STOCK and NO partial allocation is persisted (atomic rejection)."
        test_recipe:
          setup: ["Contract ACTIVE; blanket order committed 10 OPEN; release qty 10 SCHEDULED; single lot qty 3"]
          setup_api_calls:
