              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /meal-claims/${claim_id}/submit"
              payload: {}
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with error_id == ERR_CLAIM_NO_RECONCILED_DAYS"
            - "MealClaim.${claim_id}.status remains DRAFT and final_total_cents remains null"
            - "MealClaim.${claim_id}.provisional_total_cents == 248 (round(1 x 225 x 1.10) = round(247.5) = 248) — the CLOSED day still counts provisionally"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: ride_window_half_open_overlap_adjacency_allowed
        grounds:
          - validations[priority=9]
          - entities.RideAssignment.fields.effective_start_date
          - errors[ERR_RIDE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = pairwise half-open collision on the MEMBER's
          ride schedule (resource: the member): [08-03, 08-10) overlapping
          [08-07, 08-14) is rejected, while the adjacent window
          [08-10, 08-17) — new start == existing end — is ACCEPTED because the
          end boundary is exclusive.
        test_recipe:
          setup: ["ACTIVE member; route seat_capacity 5; existing ACTIVE ride [2026-08-03, 2026-08-10)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club O", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid R", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /transport-routes"
              payload: { site_id: "${site_id}", route_name: "Route 1", school_name: "Lincoln", seat_capacity: 5 }
              as: PlatformAdmin
              captures: { route: $.data.id }
            - { call: "POST /ride-assignments", payload: { route_id: "${route}", member_id: "${m1}", effective_start_date: "2026-08-03", effective_end_date: "2026-08-10" }, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - call: "POST /ride-assignments"
              payload: { route_id: "${route}", member_id: "${m1}", effective_start_date: "2026-08-07", effective_end_date: "2026-08-14" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
            - call: "POST /ride-assignments"
              payload: { route_id: "${route}", member_id: "${m1}", effective_start_date: "2026-08-10", effective_end_date: "2026-08-17" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { ride3: $.data.id }
          assert:
            - "the overlapping create [08-07, 08-14) fails with error_id == ERR_RIDE_WINDOW_OVERLAP"
            - "the adjacent create [08-10, 08-17) succeeds (half-open: start == existing end is NOT an overlap); RideAssignment.${ride3}.status == ACTIVE"

      - name: route_seat_aggregate_occupancy_at_capacity
        grounds:
          - validations[priority=9]
          - entities.TransportRoute.fields.seat_capacity
          - errors[ERR_SEAT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (the
          TransportRoute, not the member): aggregate occupancy per club-day
          date — the ride bringing occupancy exactly to seat_capacity (2) is
          allowed, and the one pushing it to capacity+1 on an existing club day
          in its window is rejected ERR_SEAT_CAPACITY_EXCEEDED.
        test_recipe:
          setup: ["route seat_capacity 2; club day 2026-08-03 exists; three ACTIVE members A/B/C each requesting open-ended rides starting 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club P", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Rider A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { ma: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Rider B", date_of_birth: "2012-02-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { mb: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Rider C", date_of_birth: "2012-03-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { mc: $.data.id }
            - { call: "POST /members/${ma}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${mb}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${mc}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /transport-routes"
              payload: { site_id: "${site_id}", route_name: "Route 9", school_name: "Hoover", seat_capacity: 2 }
              as: PlatformAdmin
              captures: { route: $.data.id }
            - { call: "POST /club-days", payload: { site_id: "${site_id}", date: "2026-08-03" }, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - call: "POST /ride-assignments"
              payload: { route_id: "${route}", member_id: "${ma}", effective_start_date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { ra: $.data.id }
            - call: "POST /ride-assignments"
              payload: { route_id: "${route}", member_id: "${mb}", effective_start_date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { rb: $.data.id }
            - call: "POST /ride-assignments"
              payload: { route_id: "${route}", member_id: "${mc}", effective_start_date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "RideAssignment.${ra} and .${rb} are ACTIVE (occupancy reaching exactly seat_capacity 2 is allowed)"
            - "third create fails with error_id == ERR_SEAT_CAPACITY_EXCEEDED (occupancy 2 + 1 > 2 on club day 2026-08-03)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fund_conservation_across_activate_accrual_revoke
        grounds:
          - calculations.scholarship_fund_accounting
          - calculations.weekly_fee_assessment
          - state_machines.ScholarshipAward.PENDING_to_ACTIVE
          - state_machines.ScholarshipAward.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity = fund cents: budget_cents == available_cents +
          reserved_cents + disbursed_cents after the forward action (activate:
          10000 == 4000+6000+0), after the accrual disbursement (10000 ==
          4000+3500+2500), AND after the compensating revoke (10000 ==
          7500+0+2500) — zero drift at every checkpoint.
        test_recipe:
          setup:
            - "PAID member (weekly fee 5000); fund budget 10000; award discount 0.50, weekly_cap 5000, annual_cap 6000"
            - "Friday 2026-08-07 close disburses min(5000, 6000, round(5000 x 0.5)=2500) = 2500"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club Q", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Pay Kid", date_of_birth: "2011-01-01", grade: 8, household_size: 1, household_income_cents: 5000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /scholarship-funds"
              payload: { site_id: "${site_id}", name: "Fund Q", budget_cents: 10000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id, fund_v: $.data.version }
            - call: "POST /scholarship-awards"
              payload: { fund_id: "${fund_id}", member_id: "${m1}", discount_pct: 0.50, weekly_cap_cents: 5000, annual_cap_cents: 6000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { aw1: $.data.id }
          trigger:
            - { call: "POST /scholarship-awards/${aw1}/activate", payload: { expected_fund_version: "${fund_v}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T16:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-07" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { w1: $.data.id }
            - { call: "POST /club-days/${w1}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /scholarship-awards/${aw1}/revoke", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
          assert:
            - "after activate: reserved 6000, disbursed 0, available 4000 -> 10000 == 4000 + 6000 + 0"
            - "after Friday close: reserved 3500, disbursed 2500, available 4000 -> 10000 == 4000 + 3500 + 2500; Member.${m1}.fee_balance_cents == 5000 (2500 registration + 5000 gross - 2500 disbursed)"
            - "after revoke (compensating action): reserved 0, disbursed 2500, available 7500 -> 10000 == 7500 + 0 + 2500"
            - "ScholarshipFund.${fund_id}.budget_cents is unchanged (10000) across all three checkpoints"

      - name: attendance_tally_conservation_through_signin_signout_close
        grounds:
          - calculations.club_day_posture
          - state_machines.AttendanceRecord.ON_SITE_to_SIGNED_OUT
          - state_machines.AttendanceRecord.ON_SITE_to_MISSING_SIGNOUT
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — attendance headcount (not cents):
          present_count + signed_out_count + missing_signout_count == total
          AttendanceRecords of the day, and present_count == count(ON_SITE) at
          every step; sign-in/sign-out/close move records between buckets
          without drift (3 == 3+0+0, then 3 == 2+1+0, then 3 == 0+1+2).
        test_recipe:
          setup: ["3 ACTIVE members; club day 2026-08-03 OPEN; all 3 signed in; member 1 signed out as WALKER"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club R", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid One", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid Two", date_of_birth: "2012-02-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m2: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid Three", date_of_birth: "2012-03-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m3: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m2}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m3}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { day: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${day}", member_id: "${m1}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { a1: $.data.id }
            - { call: "POST /attendance-records", payload: { club_day_id: "${day}", member_id: "${m2}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records", payload: { club_day_id: "${day}", member_id: "${m3}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records/${a1}/sign-out", payload: { sign_out_type: "WALKER" }, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - { call: "POST /club-days/${day}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
          assert:
            - "after 3 sign-ins: ClubDay.${day}.present_count == 3, signed_out_count == 0, missing_signout_count == 0 (3 == 3+0+0)"
            - "after 1 sign-out: present_count == 2, signed_out_count == 1 (3 == 2+1+0)"
            - "after close: present_count == 0, signed_out_count == 1, missing_signout_count == 2 (3 == 0+1+2) and status == CLOSED"
            - "the 2 un-signed-out records have status MISSING_SIGNOUT; total records for the day == 3 (no drift)"
