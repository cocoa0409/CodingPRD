              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { appt_a: $.data.id }
