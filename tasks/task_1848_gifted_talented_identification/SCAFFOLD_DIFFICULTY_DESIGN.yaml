# =============================================================================
# Task 1848 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All chains replay against §1.5.
# Canonical setup facts used across instances:
#   - logical clock default 2026-08-01T00:00:00Z; recipes set 2026-08-20T00:00:00Z
#   - band profile P_BAND: weights 0.40/0.30/0.20/0.10, cut 95, floor 88,
#     cut_2e 90, floor_2e 82 (validity default 730 days)
#   - cycle window [2026-08-15, 2026-12-15), referral_close_on 2026-09-30
#   - measures dated 2026-08-20 (inside validity, not in the future)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: composite_standard_vs_twice_exceptional
        grounds:
          - calculations.composite_score
          - calculations.cut_score_determination
          - entities.GiftedCase.fields.scored_variant
        distinguishing_aspect: |
          Same percentiles (99/90/88, no PORTFOLIO), same published profile, two different students:
          the STANDARD variant yields composite 94 -> AWAITING_COMMITTEE, while the TWICE_EXCEPTIONAL
          variant (student has a SpedPlan) substitutes max(ability, achievement) into both slots and
          applies cut_score_2e, yielding composite 97 -> IDENTIFIED. Same inputs, two algorithms,
          different numbers on the GiftedCase scoring domain.
        test_recipe:
          setup:
            - "site S; clock at 2026-08-20; student A (no plan) and student B (IEP) both grade 3"
            - "cycle ELEMENTARY with P_BAND published and advanced to SCORING"
            - "both cases UNIVERSAL_SCREEN with ABILITY 99, ACHIEVEMENT 90, RATING_SCALE 88 on 2026-08-20"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site A", code: "SA", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-A", legal_name: "Stu A", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-a" }, as: GiftedCoordinator, captures: { stu_a: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-B", legal_name: "Stu B", grade_level: 3, school_site_id: "${site_id}", demographic_group: "HISPANIC", primary_guardian_user_id: "guard-b" }, as: GiftedCoordinator, captures: { stu_b: $.data.id } }
            - { call: "POST /gifted/students/${stu_b}/sped-plans", payload: { plan_type: "IEP", started_on: "2026-01-15" }, as: SpecialEdCoordinator }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu_a}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_a: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu_b}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_b: $.data.id } }
            - { call: "POST /gifted/cases/${case_a}/measure-scores", payload: { measure_type: "ABILITY", percentile: 99, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_a}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 90, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_a}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_b}/measure-scores", payload: { measure_type: "ABILITY", percentile: 99, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_b}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 90, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_b}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/cases/${case_a}/finalize-scoring", payload: {}, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_b}/finalize-scoring", payload: {}, as: GiftedCoordinator }
          assert:
            - "GiftedCase.${case_a}.composite_score == 94 and scored_variant == STANDARD and status == AWAITING_COMMITTEE (88 <= 94 < 95)"
            - "GiftedCase.${case_b}.composite_score == 97 and scored_variant == TWICE_EXCEPTIONAL and status == IDENTIFIED (97 >= cut_score_2e 90)"
            - "Student.${stu_b}.gifted_status == IDENTIFIED; Student.${stu_a}.gifted_status == NOT_IDENTIFIED"

      - name: disproportionality_interim_vs_final_projection
        grounds:
          - calculations.disproportionality_risk_ratio
        distinguishing_aspect: |
          Same roster and same committee decisions: the INTERIM variant counts IDENTIFIED +
          AWAITING_COMMITTEE + APPEAL_PENDING (projection) while FINAL counts IDENTIFIED only,
          so BLACK identified reads 5 vs 4 and total_identified 15 vs 14 on identical underlying
          students — a dual-variant split on the district-reporting domain, a different entity
          domain from case scoring.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; roster totals 50 WHITE (40 bulk + 10 individual) and 25 BLACK (20 bulk + 4 transfer + 1 band case), all grade 3"
            - "cycle ELEMENTARY, P_BAND published, OPEN"
            - "10 WHITE and 4 BLACK students honored via TRANSFER_HONOR (IDENTIFIED immediately)"
            - "1 additional BLACK student via UNIVERSAL_SCREEN scored 99/90/88 -> composite 94 -> AWAITING_COMMITTEE after SCORING finalize"
            - "cycle advanced to REVIEW"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site R", code: "SR", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students/bulk-enroll", payload: { school_site_id: "${site_id}", grade_level: 3, demographic_group: "WHITE", count: 40 }, as: GiftedCoordinator }
            - { call: "POST /gifted/students/bulk-enroll", payload: { school_site_id: "${site_id}", grade_level: 3, demographic_group: "BLACK", count: 20 }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "W01", legal_name: "W 01", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-w01" }, as: GiftedCoordinator, captures: { w01: $.data.id } }
