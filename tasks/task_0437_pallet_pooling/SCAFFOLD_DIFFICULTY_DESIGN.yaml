              payload: { from_location_id: "${a_id}", to_location_id: "${b_id}", kind: "TRANSFER", asset_ids: ["${d1}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
            - call: "POST /assets/${d1}/report-damage"
              payload: {}
              as: PoolOperator
          trigger:
            - call: "POST /transfer-orders/${to_id}/dispatch"
              payload: {}
              as: PoolOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ASSET_NOT_AVAILABLE"
            - "response.status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_window_overlap_same_location_rejected
        grounds:
          - validations[priority=10]
          - state_machines.AuditReconciliation.DRAFT_to_FINALIZED
          - entities.AuditReconciliation.fields.window_start
          - entities.AuditReconciliation.fields.window_end
          - errors[ERR_AUDIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed-interval-with-adjacency-buffer semantics on AuditReconciliation: a second finalize
          on the same Location whose [window_start, window_end] sits inside audit_min_interval_days
          (28) of a prior FINALIZED window is rejected with ERR_AUDIT_WINDOW_OVERLAP — buffered
          closed intervals.
        test_recipe:
          setup:
            - "Location L1 with one FINALIZED audit window [2026-05-01, 2026-05-31]; a second DRAFT audit window [2026-06-10, 2026-06-20] (within 28 days of 2026-05-31) awaiting finalize"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD", audit_min_interval_days: 28 }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /audit-reconciliations"
              payload: { location_id: "${l1_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2026-05-31T00:00:00Z", counted_physical: 0, loss_basis: "REPLACEMENT" }
              as: PoolOperator
              captures: { audit1: $.data.id }
            - call: "POST /audit-reconciliations/${audit1}/finalize"
              payload: {}
              as: PoolOperator
            - call: "POST /audit-reconciliations"
              payload: { location_id: "${l1_id}", window_start: "2026-06-10T00:00:00Z", window_end: "2026-06-20T00:00:00Z", counted_physical: 0, loss_basis: "REPLACEMENT" }
              as: PoolOperator
              captures: { audit2: $.data.id }
          trigger:
            - call: "POST /audit-reconciliations/${audit2}/finalize"
              payload: {}
              as: PoolOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_AUDIT_WINDOW_OVERLAP"
            - "response.status == 409"
            - "AuditReconciliation.${audit2}.status == DRAFT"

      - name: hire_asset_occupancy_overlap_rejected
        grounds:
          - validations[priority=8]
          - state_machines.Asset.AVAILABLE_to_ON_HIRE
          - entities.Asset.fields.current_hire_id
          - errors[ERR_ASSET_NOT_AVAILABLE]
        distinguishing_aspect: |
          Half-open per-asset occupancy semantics on Asset (a different resource entity than the
          buffered audit windows): an asset already occupied by an OPEN hire [on_hire_at, off_hire_at)
          cannot be placed on a second concurrently-OPEN hire — the second open is rejected with
          ERR_ASSET_NOT_AVAILABLE because the occupancy interval is still open.
        test_recipe:
          setup:
            - "One asset ON_HIRE on hire H1 (still OPEN); attempt to open H2 over the same asset"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "DISTRIBUTOR", credit_limit_cents: 100000000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "O1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a1: $.data.id }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { l1_v: $.data.version }
            - call: "POST /hires"
              payload: { account_id: "${acct_id}", location_id: "${l1_id}", asset_type_id: "${at_id}", asset_ids: ["${a1}"], expected_location_version: "${l1_v}" }
              as: PoolOperator
              captures: { h1: $.data.id }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { l1_v2: $.data.version }
          trigger:
            - call: "POST /hires"
              payload: { account_id: "${acct_id}", location_id: "${l1_id}", asset_type_id: "${at_id}", asset_ids: ["${a1}"], expected_location_version: "${l1_v2}" }
              as: PoolOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ASSET_NOT_AVAILABLE"
            - "response.status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: voucher_issue_redeem_conserves_total_system_equity
        grounds:
          - state_machines.Voucher.OUTSTANDING_to_REDEEMED
          - entities.Voucher.fields.quantity
          - entities.Location.fields.equity_balance
        distinguishing_aspect: |
          Conserved quantity = total system equity = sum(Location.equity_balance) + sum(OUTSTANDING
          Voucher.quantity). Issue debits from_location by 4 (held as outstanding voucher equity);
          redeem credits redeem_location by 4 and clears the voucher; total stays exactly at the
          pre-issue 10 across both forward (issue) and compensating (redeem) actions.
        test_recipe:
          setup:
            - "Location LA (acct1) equity_balance=10 via 10-asset ISSUANCE; Location LB (acct2) equity_balance=0; clock 2026-06-01"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD", voucher_expiry_days: 90 }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acct1", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct1: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acct2", role_type: "RETAILER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct2: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct1}", name: "Stock" }
              as: PoolAdmin
              captures: { stock_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct1}", name: "LA" }
              as: PoolAdmin
              captures: { la_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct2}", name: "LB" }
              as: PoolAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V2", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v2: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V3", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v3: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V4", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v4: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V5", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v5: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V6", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v6: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V7", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v7: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V8", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v8: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V9", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v9: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "V10", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { v10: $.data.id }
            - call: "POST /transfer-orders"
              payload: { from_location_id: "${stock_id}", to_location_id: "${la_id}", kind: "ISSUANCE", asset_ids: ["${v1}","${v2}","${v3}","${v4}","${v5}","${v6}","${v7}","${v8}","${v9}","${v10}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
            - call: "POST /transfer-orders/${to_id}/dispatch"
              payload: {}
              as: PoolOperator
            - call: "POST /transfer-orders/${to_id}/receive"
              payload: {}
              as: PoolOperator
            - call: "GET /locations/${la_id}"
              payload: {}
              as: PoolOperator
              captures: { la_v: $.data.version }
            - call: "POST /vouchers"
              payload: { from_location_id: "${la_id}", to_account_id: "${acct2}", asset_type_id: "${at_id}", quantity: 4, expected_from_location_version: "${la_v}" }
              as: PoolOperator
              captures: { vch_id: $.data.id }
          trigger:
            - call: "POST /vouchers/${vch_id}/redeem"
              payload: { redeem_location_id: "${lb_id}" }
              as: PoolOperator
            - call: "GET /locations/${la_id}"
              payload: {}
              as: PoolOperator
              captures: { la_eq: $.data.equity_balance }
            - call: "GET /locations/${lb_id}"
              payload: {}
              as: PoolOperator
              captures: { lb_eq: $.data.equity_balance }
          assert:
            - "Location.${la_id}.equity_balance == 6"
            - "Location.${lb_id}.equity_balance == 4"
            - "Voucher.${vch_id}.status == REDEEMED"

      - name: transfer_dispatch_receive_conserves_total_physical_count
        grounds:
          - state_machines.TransferOrder.DRAFT_to_DISPATCHED
          - state_machines.TransferOrder.DISPATCHED_to_RECEIVED
          - entities.Location.fields.physical_balance
          - entities.Asset.fields.condition
        distinguishing_aspect: |
          Conserved quantity = total physical asset count = sum(Location.physical_balance) +
          count(Assets IN_TRANSIT). A different conserved quantity than equity: dispatch moves 3
          assets to IN_TRANSIT (origin physical drops 3, in-transit +3); receive lands them at the
          destination (destination physical +3, in-transit 0); total physical count stays 5 across
          forward (dispatch) and compensating (receive) hops.
        test_recipe:
          setup:
            - "Location A with 5 AVAILABLE assets (physical 5); Location B physical 0; DRAFT TRANSFER of 3 from A to B"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "DISTRIBUTOR", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "A" }
              as: PoolAdmin
              captures: { a_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "B" }
              as: PoolAdmin
              captures: { b_id: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "C1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${a_id}" }
              as: PoolOperator
              captures: { c1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "C2", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${a_id}" }
              as: PoolOperator
              captures: { c2: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "C3", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${a_id}" }
              as: PoolOperator
              captures: { c3: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "C4", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${a_id}" }
              as: PoolOperator
              captures: { c4: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "C5", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${a_id}" }
              as: PoolOperator
              captures: { c5: $.data.id }
            - call: "POST /transfer-orders"
              payload: { from_location_id: "${a_id}", to_location_id: "${b_id}", kind: "TRANSFER", asset_ids: ["${c1}","${c2}","${c3}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
          trigger:
            - call: "POST /transfer-orders/${to_id}/dispatch"
              payload: {}
              as: PoolOperator
            - call: "POST /transfer-orders/${to_id}/receive"
              payload: {}
              as: PoolOperator
            - call: "GET /locations/${a_id}"
              payload: {}
              as: PoolOperator
              captures: { phys_a: $.data.physical_balance }
            - call: "GET /locations/${b_id}"
              payload: {}
              as: PoolOperator
              captures: { phys_b: $.data.physical_balance }
          assert:
            - "Location.${a_id}.physical_balance == 2"
            - "Location.${b_id}.physical_balance == 3"
            - "TransferOrder.${to_id}.status == RECEIVED"
