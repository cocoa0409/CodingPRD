    grounds:
    - errors[ERR_CLOCK_NOT_MONOTONIC]
    - validations[priority=21]
    distinguishing_aspect: 'The fourth clock-relative rule guards the clock endpoint itself: 2026-08-05
      is strictly behind the current 2026-08-10, and the refusal keeps every derived due_on and deadline
      in the database meaningful.'
    test_recipe:
      setup:
      - The logical clock has been advanced to 2026-08-10T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
