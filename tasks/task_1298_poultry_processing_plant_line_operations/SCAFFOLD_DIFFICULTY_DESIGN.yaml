            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
