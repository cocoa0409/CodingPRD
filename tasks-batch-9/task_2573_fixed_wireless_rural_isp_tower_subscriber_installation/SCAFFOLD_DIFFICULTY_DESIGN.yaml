  - rule_id: transitive_cascade
    instances:
      - name: backhaul_degradation_cascade_freezes_sector_releases_hold_expires_request
        grounds:
          - state_machines.BackhaulCircuit.ACCEPTED_to_DEGRADED
          - state_machines.CapacityHold.HELD_to_RELEASED
          - state_machines.ServiceabilityRequest.QUALIFIED_to_EXPIRED
          - calculations.sector_capacity_posture
          - entities.Tower.fields.backhaul_accepted_mbps
          - entities.Sector.fields.capacity_posture
          - entities.CapacityHold.fields.release_reason
        distinguishing_aspect: |
          Cascade chain X, depth 4, triggered by a TRANSPORT-side state change (POST
          /backhaul-circuits/{id}/state-changes to_state=DEGRADED): hop 1 zeroes
          Tower.backhaul_accepted_mbps, hop 2 forces Sector.capacity_posture to FROZEN *because* the
          tower now has no accepted backhaul, hop 3 releases the HELD CapacityHold with
          release_reason BACKHAUL_DEGRADED *because* the sector went FROZEN, and hop 4 expires the
          ServiceabilityRequest *because* its hold left HELD unconsumed - each link is caused by the
          previous one, and no hop is reachable by acting on that entity directly.
