# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages orgs, plans, subscriptions, clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /broker-orgs, /broker-orgs/{id}/suspend|reinstate|deactivate"
      - "POST /carrier-orgs, /carrier-orgs/{id}/suspend|reinstate"
      - "POST /subscription-plans"
      - "POST /subscriptions and all /subscriptions/{id}/* actions"
  - name: BrokerAdmin
    description: "Acts as a BrokerOrg; X-User-ID equals BrokerOrg.id"
    identity: "entity_backed:BrokerOrg"
    exclusive_operations:
      - "POST /load-posts, /load-posts/{id}/withdraw"
      - "POST /credit-report-events/{id}/disputes"
      - "POST /credit-disputes/{id}/rebut"
    shared_operations:
      - "POST /bookings/{id}/cancel (own loads only)"
      - "POST /rate-transactions"
      - "POST /authority-verifications (own org)"
      - "GET /lane-rate-benchmarks and all GET endpoints"
  - name: CarrierAdmin
    description: "Acts as a CarrierOrg; X-User-ID equals CarrierOrg.id"
    identity: "entity_backed:CarrierOrg"
    exclusive_operations:
      - "POST /truck-posts, /truck-posts/{id}/withdraw"
      - "POST /bookings, /bookings/{id}/complete"
      - "POST /credit-report-events"
    shared_operations:
      - "POST /bookings/{id}/cancel (own trucks only)"
      - "POST /rate-transactions"
      - "POST /authority-verifications (own org)"
      - "GET /load-posts (consumes daily search limit) and all GET endpoints"
  - name: ComplianceAnalyst
    description: "Fraud and dispute adjudication; authority verification decisions"
    identity: opaque
    exclusive_operations:
      - "POST /fraud-alerts, /fraud-alerts/{id}/confirm|dismiss"
      - "POST /credit-disputes/{id}/start-review|resolve"
      - "POST /authority-verifications/{id}/verify|revoke"
  - name: DataOps
    description: "Data stewardship; excludes bad rate transactions"
    identity: opaque
    exclusive_operations:
      - "POST /rate-transactions/{id}/exclude"
