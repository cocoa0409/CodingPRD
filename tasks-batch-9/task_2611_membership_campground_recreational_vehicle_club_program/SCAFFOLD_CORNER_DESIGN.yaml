            - "Paying the PAID invoice again: HTTP 409 with error_id ERR_DUES_INVOICE_NOT_PAYABLE, not the priority-47 ERR_PAYMENT_AMOUNT_MISMATCH that the 45360 body would otherwise trip once paid_amount_cents is non-zero"
            - "The reversal succeeds: HTTP 200, status PAID -> OPEN (the current logical date is on or before due_date 2026-08-31), paid_amount_cents back to 0 and paid_at null"
            - "Reversing the reopened invoice: HTTP 409 with error_id ERR_DUES_INVOICE_NOT_PAYABLE again, so the guard is evaluated against the live status rather than against a one-shot flag"
      - name: a_scheduled_window_blocks_its_closed_interval_and_the_season_edge_blocks_the_night_after_close
