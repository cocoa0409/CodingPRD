  # ===========================================================================
  - section: errors
    instances:
      - name: stale_unit_version_on_fund
        claim_type: violation_to_error
        grounds: ["concurrency_rules[deal-fund-stale-unit]", "errors[ERR_STALE_UNIT_VERSION]"]
        distinguishing_aspect: "Funding a deal with an expected_unit_version one less than current (stale) returns ERR_STALE_UNIT_VERSION (412)."
        test_recipe:
          setup: ["an APPROVED SALE deal; the unit version has advanced past the value the client first read"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Stale Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-ST-1", condition: "NEW", model_code: "8R280", serial_number: "SN-ST-1", dealer_cost_cents: 6000000, list_price_cents: 8000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 8000000 }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v} - 1" }
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "response error_id == ERR_STALE_UNIT_VERSION"
            - "Deal.${deal_id}.status == APPROVED"

      - name: bid_on_non_live_lot_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_BID_TOO_LOW]"]
        distinguishing_aspect: "Placing a bid on a DRAFT (not LIVE) lot is rejected with ERR_BID_TOO_LOW (lot not LIVE branch)."
        test_recipe:
          setup: ["a DRAFT AuctionLot (never opened)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "DB Cust", customer_type: "COMMERCIAL_AG" }
              as: DealerAdmin
              captures: { bidder: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-DB-1", condition: "USED", model_code: "S780", serial_number: "SN-DB-1", dealer_cost_cents: 4000000, list_price_cents: 5500000, engine_hours: 2400 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /auction-lots"
              payload: { unit_id: "${unit_id}", reserve_price_cents: 4500000, opens_at: "2026-01-01T00:00:00Z", closes_at: "2026-06-01T00:00:00Z" }
              as: AuctionClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_customer_id: "${bidder}", amount_cents: 5000000 }
              as: AuctionClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BID_TOO_LOW"
            - "AuctionLot.${lot_id}.status == DRAFT"

  # ===========================================================================
  - section: rbac
    instances:
      - name: salesrep_cannot_fund_deal_forbidden
        claim_type: peer_roles
        grounds: [roles, endpoints, "validations[priority=2]"]
        distinguishing_aspect: "A SalesRep calling POST /deals/{id}/fund (FinanceManager-exclusive) is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["an APPROVED SALE deal"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "RB Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-RB-1", condition: "NEW", model_code: "6R185", serial_number: "SN-RB-1", dealer_cost_cents: 7000000, list_price_cents: 9000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 9000000 }
              as: SalesRep
              captures: { deal_id: $.data.id, unit_v: $.data.version }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403"
            - "response error_id == ERR_FORBIDDEN"
            - "Deal.${deal_id}.status == APPROVED"

      - name: partsclerk_cannot_create_work_order_forbidden
        claim_type: peer_roles
