            - "Deposit C rejected with ERR_CAPACITY_FULL at deposited_count 2 == capacity_seats (boundary: == rejects)"
            - "Program ${p_id}: deposited_count == 2, seats_open == 0, intake_posture == PAUSED"

      - name: merit_tier_score_90_boundary_inclusive
        grounds:
          - calculations.aid_leveraging_award
          - entities.AidOffer.fields.amount_cents
        distinguishing_aspect: |
          Academic-score metric on POST /enrollment/aid-offers (different
          metric and endpoint than the seat boundary): score exactly 90.00 hits
          the >= 90 tier (0.35 * 5000000 = 1750000); score 89.99 falls to the
          >= 80 tier (0.20 * 5000000 = 1000000).
        test_recipe:
          setup:
            - "Cycle OPEN; program tuition 5000000, budget 10000000, capacity 5, target 4"
            - "Two ADMITTED applications: X score 90.00, Y score 89.99"
          setup_api_calls:
