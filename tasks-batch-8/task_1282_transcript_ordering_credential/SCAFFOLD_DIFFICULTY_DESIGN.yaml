  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >=3 and >=2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: hold_release_to_order_advance_to_line_items_queued_depth3
        grounds:
          - state_machines.Hold.ACTIVE_to_RELEASED
          - state_machines.TranscriptOrder.HOLD_CHECK_to_READY_TO_FULFILL
          - state_machines.OrderLineItem.PENDING_to_QUEUED
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: Hold release (Hop 1) -> order
          advances HOLD_CHECK->READY_TO_FULFILL (Hop 2, caused BY the hold
          release side-effect, not the original POST) -> order advance fans
          PENDING line items to QUEUED (Hop 3, caused BY the order advance).
          Each hop is caused by the previous, not by the original actor.
        test_recipe:
          setup:
            - "Student s with FINANCIAL Hold h (blocking_scope=OFFICIAL)"
            - "Order o OFFICIAL in HOLD_CHECK, 1 line item PENDING"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-CASC1"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S5000001"
                full_name: "Hank Yu"
                date_of_birth: "1998-08-08"
                email: "hank@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "EMAIL_PDF"
                display_name: "Self"
                email_address: "hank@example.edu"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "EMAIL_PDF"
                quantity: 1
                expected_order_version: "${order_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order_v1: $.data.version, line_id: $.data.id }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_id}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_id: $.data.id, idv_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_id}/confirm"
              payload: { verification_token: "${idv_token}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/holds"
              payload:
                student_id: "${student_id}"
                hold_type: "FINANCIAL"
                blocking_scope: "OFFICIAL"
                amount_cents: 5000
              as: BursarOffice
              captures: { hold_id: $.data.id }
            - call: "POST /registrar/orders/${order_id}/submit"
              payload: { expected_order_version: "${order_v1}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { order_fulfillment_at_hold: $.data.fulfillment_status }
          trigger:
            - call: "POST /registrar/holds/${hold_id}/release"
              payload: {}
              as: BursarOffice
              captures: { hold_status_after: $.data.status }
          assert:
            - "order_fulfillment_at_hold == HOLD_CHECK (verified before trigger)"
            - "Hold.${hold_id}.status == RELEASED (Hop 1)"
            - "TranscriptOrder.${order_id}.fulfillment_status == READY_TO_FULFILL (Hop 2)"
            - "OrderLineItem.${line_id}.line_status == QUEUED (Hop 3)"

      - name: consent_revoke_to_verification_denied_depth2
        grounds:
          - state_machines.ConsentGrant.ACTIVE_to_REVOKED
          - state_machines.VerificationRequest.CONSENT_CHECK_to_DENIED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (Student-initiated consent
          revoke, not an office-side Hold release). Hop 1: ConsentGrant ->
          REVOKED. Hop 2: VerificationRequest in CONSENT_CHECK referencing the
          grant -> DENIED with denial_reason=CONSENT_REVOKED. Different
          originating transition from the sibling cascade instance.
        test_recipe:
          setup:
            - "Student s, ConsentGrant cg ACTIVE to 'Employer Inc'"
            - "VerificationRequest vr against s, scope=DEGREE_ONLY, consent_grant_id=cg, status=CONSENT_CHECK"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S5000002"
                full_name: "Ivy Chen"
                date_of_birth: "1999-12-01"
                email: "ivy@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/consent-grants"
              payload:
                student_id: "${student_id}"
                grantee_name: "Employer Inc"
                scope: "DEGREE_ONLY"
                expires_at: "2027-08-01T00:00:00Z"
              as: Student
              as_user_id: "${student_id}"
              captures: { grant_id: $.data.id }
            - call: "POST /registrar/verification-requests"
              payload:
                requester_name: "Employer Inc"
                subject_student_id: "${student_id}"
                scope: "DEGREE_ONLY"
                consent_grant_id: "${grant_id}"
              as: VerificationRequester
              captures: { vr_id: $.data.id }
            - call: "POST /registrar/verification-requests/${vr_id}/begin-review"
              payload: {}
              as: RegistrarReviewer
          trigger:
            - call: "POST /registrar/consent-grants/${grant_id}/revoke"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          assert:
            - "ConsentGrant.${grant_id}.status == REVOKED (Hop 1)"
            - "VerificationRequest.${vr_id}.status == DENIED (Hop 2)"
            - "VerificationRequest.${vr_id}.denial_reason == CONSENT_REVOKED"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_cancel_captured_order
        grounds:
          - validations[priority=5]
          - validations[priority=18]
          - state_machines.TranscriptOrder.payment_status.CAPTURED_to_REFUNDED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REFUND_EXCEEDS_CAPTURED]
        distinguishing_aspect: |
          Error-category pair: state (priority 5) vs business_fiscal (priority
          18). Cancelling a DELIVERED order (state check fails) AND supplying
          a refund_amount > captured (fiscal check would fail) — the STATE
          error must win because priority 5 fires before priority 18.
        test_recipe:
          setup:
            - "Order o1 DELIVERED with payment CAPTURED 1000 cents"
            - "Trigger: attempt to refund payment with refund_amount_cents=2000 (> captured) AND simultaneously order is in a terminal state"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-PRIO1"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S6000001"
                full_name: "Jane Kim"
                date_of_birth: "2000-02-14"
                email: "jane@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "EMAIL_PDF"
                display_name: "Self"
                email_address: "jane@example.edu"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "EMAIL_PDF"
                quantity: 1
                expected_order_version: "${order_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order_v1: $.data.version, line_id: $.data.id }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_id}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_id: $.data.id, idv_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_id}/confirm"
              payload: { verification_token: "${idv_token}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/orders/${order_id}/submit"
              payload: { expected_order_version: "${order_v1}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/payments"
              payload:
                order_id: "${order_id}"
                idempotency_key: "pay-prio-001"
              as: Student
              as_user_id: "${student_id}"
              captures: { payment_id: $.data.id }
            - call: "POST /registrar/payments/${payment_id}/capture"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${line_id}/dispatch"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${line_id}/mark-delivered"
              payload: {}
              as: RegistrarOperator
          trigger:
            # Order DELIVERED (terminal). Payment CAPTURED 1000. Try over-refund AND cancel.
            # We test over-refund on a DELIVERED order's payment — fiscal rule would normally
            # reject with ERR_REFUND_EXCEEDS_CAPTURED, but the order being terminal is a
            # state violation that fires FIRST.
            - call: "POST /registrar/orders/${order_id}/cancel"
              payload: { cancelled_reason: "want a refund" }
              as: Student
              as_user_id: "${student_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (state priority 5 fires; fiscal refund check at priority 18 never evaluated)"

      - name: business_safety_vs_business_referential_reissue_on_non_delivered
        grounds:
          - validations[priority=8]
          - validations[priority=16]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REISSUE_SOURCE_INVALID]
        distinguishing_aspect: |
          Error-category pair: business_safety (priority 8, SoD) vs
          business_referential (priority 16, reissue source validity). A
          reviewer attempts to approve a reissue where (a) reviewer X-User-ID
          matches the student (SoD violation) AND (b) the original order is
          not DELIVERED (referential violation). The SoD error must win
          because priority 8 fires before 16.
        test_recipe:
          setup:
            - "Student s places an order o1 in READY_TO_FULFILL (NOT yet DELIVERED)"
            - "Student s files a ReissueRequest against o1 — but this fails because order not DELIVERED (priority 16)"
            - "We instead drive the conflict at approve-time: craft scenario where the reissue request exists but its source order is in REISSUE_PENDING (post-state) AND the reviewer is the same user as the student"
