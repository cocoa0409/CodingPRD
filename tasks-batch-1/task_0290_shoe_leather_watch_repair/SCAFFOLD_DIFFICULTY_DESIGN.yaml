            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_w}", service_type_id: "${st_watch}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_w: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
