      - name: the_presiding_role_must_match_the_forum_it_decides
        claim_type: Segregation of duties
        grounds: ["endpoints.POST /appeal-proceedings/{id}/decision", roles.TaxTribunalJudge.shared_operations, roles.AppealsOfficer.shared_operations, errors.ERR_SEGREGATION_OF_DUTIES, validations.priority_8]
        distinguishing_aspect: |
          Both presiding roles appear in the endpoint's role list, so §1.5 alone
          cannot separate them — the forum-to-role match is a priority-8 compliance
          rule. A TaxTribunalJudge deciding an INFORMAL_CONFERENCE must be refused
          with ERR_SEGREGATION_OF_DUTIES (403) even though the proceeding is OPEN and
          the outcome is legal, and the identical call from the AppealsOfficer must
          succeed. This is the forum-mismatch face of rule 8, distinct from the
          same-user face (the lead auditor closing their own fieldwork).
        test_recipe:
          setup:
