              as: AccountManager
              captures: { c2b_o2: $.data.id, c2b_o2_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${c2b_o2}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c2b_o2}/schedule", payload: { scheduled_for: "2026-08-07T00:00:00Z", expected_delivery_order_version: "${c2b_o2_v}" }, as: AccountManager }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/delivery-orders/${c2b_o2}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c2b_o2}/confirm-delivery", payload: { delivered_gal: 10.005 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${c2b_o2}/close", payload: { returned_residual_gal: 0 }, as: WaterChemist }
