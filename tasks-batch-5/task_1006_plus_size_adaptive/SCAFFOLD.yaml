# =============================================================================
# PRD Benchmark Scaffold — Plus-Size & Adaptive-Clothing Retail (Expert tier)
# =============================================================================

scenario: |
  Plus-Size & Adaptive-Clothing Retail: fit & size range, adaptive feature
  (magnetic/seated) filter, fit-specialist & virtual styling, extended-sizing
  return/exchange, subscription/box, loyalty, community fit-review, special order

domain_name: plus-size-adaptive
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys, no nested ownership tree; all
  # single-resource GETs live at the API root ("/") so every entity is a
  # top-level collection. Chosen for diversity (flat is under-represented).

  state_machine_shape: parallel
  # Order carries two INDEPENDENT status dimensions (payment_status x
  # fulfillment_status). Also present: cyclic (StylingAppointment reschedule
  # loop) and branching (ReturnRequest RETURN-vs-EXCHANGE fork).

  relationship_patterns:
    - one_to_many          # Product->ProductVariant, Order->OrderLine, BoxSubscription->BoxShipment
    - cross_aggregate      # OrderLine->ProductVariant, ReturnRequest->ProductVariant, BoxShipment.items->ProductVariant

  role_model: peer_roles
  # Customer owns own orders/returns/appointments/subscriptions; FitSpecialist
  # owns styling appointments and box curation; StoreManager operates catalog,
  # fulfillment, settlement, moderation; Anonymous browses/registers.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email (unique)" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: size_code, type: integer, source: input, description: "Preferred numeric size ordinal (e.g. 22 for 2X)" }
      - { name: adaptive_needs, type: array, source: input, description: "Subset of MAGNETIC_CLOSURE|SEATED_CUT|SENSORY_FRIENDLY|ONE_HANDED|PORT_ACCESS; adaptive features this customer requires", default: "[]" }
      - { name: loyalty_points_balance, type: integer, source: computed, description: "Spendable loyalty points; earned on order DELIVER and box SETTLE, decremented on redeem, restored on cancel", default: 0 }
      - { name: loyalty_lifetime_points, type: integer, source: computed, description: "Cumulative points ever earned; drives loyalty_tier; never decremented by redemption", default: 0 }
      - { name: loyalty_tier, type: enum, source: computed, description: "STANDARD|INSIDER|VIP — derived from loyalty_lifetime_points thresholds", default: STANDARD, constraints: "STANDARD | INSIDER | VIP" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Store credit in cents; funded by refunds and tier-up bonuses; spent at checkout", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "Count of styling appointments that reached NO_SHOW", default: 0 }
      - { name: booking_status, type: enum, source: computed, description: "ACTIVE|SUSPENDED — SUSPENDED once no_show_count >= NO_SHOW_SUSPEND_THRESHOLD; blocks new appointment confirmation", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE|SUSPENDED|CLOSED — set by StoreManager; gates checkout", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | CLOSED" }

  - name: FitSpecialist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Specialist full name" }
      - { name: specialties, type: array, source: input, description: "Subset of ADAPTIVE|PLUS_FORMAL|MATERNITY — styling topics this specialist can serve" }
      - { name: buffer_minutes, type: integer, source: input, description: "Required clearance minutes before/after each confirmed appointment for overlap checks", default: 15 }
      - { name: status, type: enum, source: system, description: "ACTIVE|ON_LEAVE — ON_LEAVE specialists cannot confirm appointments", default: ACTIVE, constraints: "ACTIVE | ON_LEAVE" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "TOPS|BOTTOMS|DRESSES|OUTERWEAR|INTIMATES", constraints: "TOPS | BOTTOMS | DRESSES | OUTERWEAR | INTIMATES" }
      - { name: base_price_cents, type: integer, source: input, description: "Base retail price in cents before per-variant delta" }
      - { name: adaptive_features, type: array, source: input, description: "Subset of MAGNETIC_CLOSURE|SEATED_CUT|SENSORY_FRIENDLY|ONE_HANDED|PORT_ACCESS present on this garment", default: "[]" }
      - { name: size_min, type: integer, source: input, description: "Smallest numeric size ordinal offered" }
      - { name: size_max, type: integer, source: input, description: "Largest numeric size ordinal offered" }
      - { name: is_special_order, type: boolean, source: input, description: "True for made-to-order garments (extended lead time)", default: false }
      - { name: restock_fee_pct, type: number, source: input, description: "Restocking fee fraction applied to non-damaged returned lines of this product", default: 0.15 }
      - { name: status, type: enum, source: system, description: "ACTIVE (all created products are ACTIVE in v1)", default: ACTIVE, constraints: "ACTIVE" }

  - name: ProductVariant
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the parent product this SKU belongs to" }
      - { name: size_code, type: integer, source: input, description: "Numeric size ordinal of this SKU; must satisfy Product.size_min <= size_code <= Product.size_max" }
      - { name: color, type: string, source: input, description: "Colorway" }
      - { name: price_delta_cents, type: integer, source: input, description: "Surcharge added to base_price_cents for this SKU (extended sizes cost more)", default: 0 }
      - { name: inventory_on_hand, type: integer, source: input, description: "Physical units in stock", default: 0 }
      - { name: inventory_reserved, type: integer, source: computed, description: "Units reserved by open order lines and in-flight box items; inventory_available = inventory_on_hand - inventory_reserved", default: 0 }
      - { name: inventory_available, type: integer, source: computed, description: "= inventory_on_hand - inventory_reserved", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE (all created variants are ACTIVE in v1)", default: ACTIVE, constraints: "ACTIVE" }

  - name: StylingAppointment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; booking customer (set from X-User-ID)" }
      - { name: specialist_id, type: string, source: input, description: "FK -> FitSpecialist.id; the fit specialist" }
      - { name: start_at, type: datetime, source: input, description: "Half-open interval start [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Half-open interval end (exclusive)" }
      - { name: topic, type: enum, source: input, description: "GENERAL|ADAPTIVE|PLUS_FORMAL|MATERNITY; non-GENERAL must be in specialist.specialties", default: GENERAL, constraints: "GENERAL | ADAPTIVE | PLUS_FORMAL | MATERNITY" }
      - { name: status, type: enum, source: system, description: "REQUESTED|CONFIRMED|RESCHEDULE_REQUESTED|COMPLETED|CANCELLED|NO_SHOW", default: REQUESTED, constraints: "REQUESTED | CONFIRMED | RESCHEDULE_REQUESTED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: proposed_start_at, type: datetime, source: input, description: "Proposed new start supplied on RESCHEDULE_REQUEST; promoted to start_at on RESCHEDULE_CONFIRM", default: null }
      - { name: proposed_end_at, type: datetime, source: input, description: "Proposed new end supplied on RESCHEDULE_REQUEST", default: null }
      - { name: late_cancel_fee_cents, type: integer, source: computed, description: "LATE_CANCEL_FEE_CENTS if cancelled within LATE_CANCEL_WINDOW_HOURS of start_at while CONFIRMED, else 0", default: 0 }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer (set from X-User-ID)" }
      - { name: payment_status, type: enum, source: system, description: "PENDING|AUTHORIZED|CAPTURED|REFUNDED — independent payment dimension", default: PENDING, constraints: "PENDING | AUTHORIZED | CAPTURED | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "UNFULFILLED|PICKING|SHIPPED|DELIVERED|CANCELLED — independent fulfillment dimension", default: UNFULFILLED, constraints: "UNFULFILLED | PICKING | SHIPPED | DELIVERED | CANCELLED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of OrderLine.line_total_cents over all lines", default: 0 }
      - { name: tier_discount_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * tier_pct) where tier_pct from customer.loyalty_tier; pinned at checkout", default: 0 }
      - { name: loyalty_redeemed_points, type: integer, source: input, description: "Points the customer chose to redeem at checkout", default: 0 }
      - { name: loyalty_redeemed_cents, type: integer, source: computed, description: "Cents value of redeemed points applied at checkout (after cap)", default: 0 }
      - { name: wallet_applied_cents, type: integer, source: computed, description: "Store credit applied at checkout", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "Amount authorized at checkout; see order_total calculation", default: 0 }
      - { name: points_earned, type: integer, source: computed, description: "Loyalty points granted when fulfillment reaches DELIVERED", default: 0 }
      - { name: delivered_at, type: datetime, source: system, description: "Clock time when fulfillment_status became DELIVERED; anchors return window", default: null }

  - name: OrderLine
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order this line belongs to" }
      - { name: variant_id, type: string, source: input, description: "FK -> ProductVariant.id; the purchased SKU" }
      - { name: quantity, type: integer, source: input, description: "Units on this line (>= 1)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot = Product.base_price_cents + ProductVariant.price_delta_cents at add time", default: 0 }
      - { name: line_total_cents, type: integer, source: computed, description: "= unit_price_cents * quantity", default: 0 }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the delivered order being returned" }
      - { name: return_type, type: enum, source: input, description: "RETURN|EXCHANGE — branches side effects at INSPECT/COMPLETE", constraints: "RETURN | EXCHANGE" }
      - { name: line_ids, type: array, source: input, description: "OrderLine ids being returned; each must belong to order_id" }
      - { name: exchange_variant_id, type: string, source: input, description: "FK -> ProductVariant.id; required when return_type=EXCHANGE, else null", default: null }
      - { name: fit_verdict, type: enum, source: input, description: "RUNS_SMALL|TRUE_TO_SIZE|RUNS_LARGE — community fit feedback captured on the return", default: TRUE_TO_SIZE, constraints: "RUNS_SMALL | TRUE_TO_SIZE | RUNS_LARGE" }
      - { name: refund_destination, type: enum, source: input, description: "WALLET|ORIGINAL — where COMPLETE credits the final refund", default: WALLET, constraints: "WALLET | ORIGINAL" }
      - { name: damaged_line_ids, type: array, source: input, description: "Subset of line_ids flagged damaged at INSPECT; excluded from refund and not restocked", default: "[]" }
      - { name: status, type: enum, source: system, description: "REQUESTED|APPROVED|INSPECTED|COMPLETED|REJECTED", default: REQUESTED, constraints: "REQUESTED | APPROVED | INSPECTED | COMPLETED | REJECTED" }
      - { name: provisional_refund_cents, type: integer, source: computed, description: "Estimate pinned at REQUESTED: sum of line_total_cents over line_ids (no fees)", default: 0 }
      - { name: restock_fee_cents, type: integer, source: computed, description: "Pinned at INSPECT: round_half_up(product.restock_fee_pct * non-damaged returned line totals)", default: 0 }
      - { name: final_refund_cents, type: integer, source: computed, description: "Pinned at INSPECT: non-damaged returned line totals - restock_fee_cents", default: 0 }

  - name: BoxSubscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; subscriber (set from X-User-ID)" }
      - { name: plan_tier, type: enum, source: input, description: "ESSENTIALS|SIGNATURE|LUXE — sets styling_fee_cents and target item count", constraints: "ESSENTIALS | SIGNATURE | LUXE" }
      - { name: cadence, type: enum, source: input, description: "MONTHLY|QUARTERLY", default: MONTHLY, constraints: "MONTHLY | QUARTERLY" }
      - { name: styling_fee_cents, type: integer, source: computed, description: "Derived from plan_tier: ESSENTIALS 0, SIGNATURE 2500, LUXE 5000; credited against kept items at settle", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE|PAUSED|CANCELLED", default: ACTIVE, constraints: "ACTIVE | PAUSED | CANCELLED" }

  - name: BoxShipment
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> BoxSubscription.id; the parent subscription" }
      - { name: items, type: array, source: computed, description: "Curated items snapshot: list of objects { variant_id, retail_cents } built from item_variant_ids at creation (retail_cents = Product.base_price_cents + ProductVariant.price_delta_cents)" }
      - { name: kept_variant_ids, type: array, source: input, description: "Subset of item variant_ids the customer chose to keep; recorded on keep-decisions", default: "[]" }
      - { name: status, type: enum, source: system, description: "CURATED|SHIPPED|KEPT_PENDING|SETTLED", default: CURATED, constraints: "CURATED | SHIPPED | KEPT_PENDING | SETTLED" }
      - { name: shipped_at, type: datetime, source: system, description: "Clock time SHIP fired; try-on window = shipped_at + TRYON_WINDOW_DAYS", default: null }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "Pinned at SHIP: sum of retail_cents over ALL items (full box authorization)", default: 0 }
      - { name: final_charge_cents, type: integer, source: computed, description: "Pinned at SETTLE: kept-only, tier-discounted per item, minus styling credit; see box_charge calculation", default: 0 }
      - { name: points_earned, type: integer, source: computed, description: "Loyalty points granted at SETTLE from final_charge_cents", default: 0 }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Order: payment dimension (parallel with fulfillment) ----
  - entity: Order
    initial_state: PENDING
    terminal_states: [REFUNDED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /orders/{id}/checkout"
        actor: Customer
        preconditions:
          - "Order has >= 1 OrderLine (ERR_EMPTY_ORDER)"
          - "customer.account_status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "loyalty_redeemed_points <= customer.loyalty_points_balance (ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "Compute subtotal_cents, tier_discount_cents, loyalty_redeemed_cents, wallet_applied_cents, total_cents per order_total calculation"
          - "customer.loyalty_points_balance -= loyalty_redeemed_points"
          - "customer.wallet_credit_cents -= wallet_applied_cents"
        note: "payment dimension advances; fulfillment_status stays UNFULFILLED"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /orders/{id}/transition action=CAPTURE"
        actor: StoreManager
        preconditions: ["payment_status == AUTHORIZED"]
        side_effects: []
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /orders/{id}/transition action=CANCEL (when already CAPTURED)"
        actor: Customer|StoreManager
        preconditions: ["fulfillment_status IN {UNFULFILLED, PICKING}"]
        side_effects:
          - "Refund total_cents to customer.wallet_credit_cents"
        note: "compensating refund; see fulfillment CANCEL for the paired inventory/loyalty reversal"

  # ---- Order: fulfillment dimension (parallel with payment) ----
  - entity: Order
    initial_state: UNFULFILLED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: UNFULFILLED
        to: PICKING
        trigger: "POST /orders/{id}/transition action=PICK"
        actor: StoreManager
        preconditions: ["payment_status == CAPTURED (cross-dimension gate)"]
        side_effects: []
        note: "cross-dimension precondition: fulfillment cannot start until payment captured"
      - from: PICKING
        to: SHIPPED
        trigger: "POST /orders/{id}/transition action=SHIP"
        actor: StoreManager
        preconditions: ["fulfillment_status == PICKING"]
        side_effects:
          - "For each OrderLine: variant.inventory_on_hand -= quantity; variant.inventory_reserved -= quantity (reservation converts to sale)"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /orders/{id}/transition action=DELIVER"
        actor: StoreManager
        preconditions: ["fulfillment_status == SHIPPED"]
        side_effects:
          - "Set delivered_at = clock now"
          - "points_earned = floor(total_cents / EARN_CENTS_PER_POINT)"
          - "customer.loyalty_points_balance += points_earned; customer.loyalty_lifetime_points += points_earned (link 1)"
          - "Recompute customer.loyalty_tier from loyalty_lifetime_points (link 2)"
          - "If loyalty_tier crossed upward this recompute: customer.wallet_credit_cents += TIER_UP_BONUS_CENTS[new_tier] (link 3)"
      - from: UNFULFILLED
        to: CANCELLED
        trigger: "POST /orders/{id}/transition action=CANCEL"
        actor: Customer|StoreManager
        preconditions: ["fulfillment_status IN {UNFULFILLED, PICKING}"]
        side_effects:
          - "For each OrderLine: variant.inventory_reserved -= quantity (release reservation; inventory_on_hand unchanged)"
          - "customer.loyalty_points_balance += loyalty_redeemed_points (reverse redemption)"
          - "customer.wallet_credit_cents += wallet_applied_cents (reverse wallet spend)"
          - "If payment_status == CAPTURED: also apply payment CAPTURED->REFUNDED refund"
      - from: PICKING
        to: CANCELLED
        trigger: "POST /orders/{id}/transition action=CANCEL"
        actor: Customer|StoreManager
        preconditions: ["fulfillment_status IN {UNFULFILLED, PICKING}"]
        side_effects:
          - "Same reversal side effects as UNFULFILLED->CANCELLED"

  # ---- StylingAppointment: cyclic reschedule + branching terminals ----
  - entity: StylingAppointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /appointments/{id}/transition action=CONFIRM"
        actor: FitSpecialist|StoreManager
        preconditions:
          - "specialist.status == ACTIVE (ERR_SPECIALIST_ON_LEAVE)"
          - "customer.booking_status == ACTIVE (ERR_BOOKING_SUSPENDED)"
          - "topic == GENERAL OR topic IN specialist.specialties (ERR_SPECIALTY_MISMATCH)"
          - "No specialist overlap: no other appointment on specialist_id in {CONFIRMED, RESCHEDULE_REQUESTED} whose [start-buffer, end+buffer] intersects [start_at, end_at] (ERR_SPECIALIST_UNAVAILABLE)"
          - "No customer overlap: no other appointment for customer_id in {CONFIRMED} whose [start_at, end_at) intersects [start_at, end_at) (ERR_CUSTOMER_DOUBLE_BOOKED)"
        side_effects: []
      - from: CONFIRMED
        to: RESCHEDULE_REQUESTED
        trigger: "POST /appointments/{id}/transition action=RESCHEDULE_REQUEST"
        actor: Customer
        preconditions: ["status == CONFIRMED", "proposed_start_at < proposed_end_at"]
        side_effects: ["Store proposed_start_at, proposed_end_at"]
      - from: RESCHEDULE_REQUESTED
        to: CONFIRMED
        trigger: "POST /appointments/{id}/transition action=RESCHEDULE_CONFIRM"
        actor: FitSpecialist|StoreManager
        preconditions:
          - "Re-check specialist overlap and customer overlap at proposed interval (ERR_SPECIALIST_UNAVAILABLE / ERR_CUSTOMER_DOUBLE_BOOKED)"
        side_effects:
          - "start_at = proposed_start_at; end_at = proposed_end_at; clear proposed_* fields"
        note: "cycle: CONFIRMED -> RESCHEDULE_REQUESTED -> CONFIRMED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /appointments/{id}/transition action=COMPLETE"
        actor: FitSpecialist
        preconditions: ["clock now >= end_at (ERR_APPOINTMENT_NOT_ENDED)"]
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/transition action=NO_SHOW"
        actor: FitSpecialist|StoreManager
        preconditions: ["clock now >= start_at (ERR_APPOINTMENT_NOT_STARTED)"]
        side_effects:
          - "customer.no_show_count += 1 (link 1)"
          - "If customer.no_show_count >= NO_SHOW_SUSPEND_THRESHOLD: customer.booking_status = SUSPENDED (link 2)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /appointments/{id}/transition action=CANCEL"
        actor: Customer|FitSpecialist
        preconditions: ["status IN {REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED}"]
        side_effects: ["late_cancel_fee_cents = 0 (was not CONFIRMED)"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{id}/transition action=CANCEL"
        actor: Customer|FitSpecialist
        preconditions: ["status IN {REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED}"]
        side_effects:
          - "If (start_at - clock now) < LATE_CANCEL_WINDOW_HOURS: late_cancel_fee_cents = LATE_CANCEL_FEE_CENTS and customer.wallet_credit_cents -= LATE_CANCEL_FEE_CENTS (floored at 0), else late_cancel_fee_cents = 0"

  # ---- ReturnRequest: branching RETURN vs EXCHANGE ----
  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{id}/transition action=APPROVE"
        actor: StoreManager
        preconditions: ["status == REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: INSPECTED
        trigger: "POST /returns/{id}/transition action=INSPECT"
        actor: StoreManager
        preconditions:
          - "status == APPROVED"
          - "damaged_line_ids subset of line_ids (ERR_INVALID_LINE_SELECTION)"
        side_effects:
          - "Compute restock_fee_cents and final_refund_cents per return_refund calculation"
          - "For each non-damaged returned OrderLine: variant.inventory_on_hand += quantity (restock)"
          - "If return_type == EXCHANGE: reserve exchange_variant_id (variant.inventory_reserved += 1)"
      - from: INSPECTED
        to: COMPLETED
        trigger: "POST /returns/{id}/transition action=COMPLETE"
        actor: StoreManager
        preconditions: ["status == INSPECTED"]
        side_effects:
          - "If return_type == RETURN and refund_destination == WALLET: customer.wallet_credit_cents += final_refund_cents"
          - "If return_type == EXCHANGE: variant(exchange_variant_id).inventory_reserved -= 1; variant(exchange_variant_id).inventory_on_hand -= 1; net price difference (exchange unit price - final_refund_cents) settled to customer.wallet_credit_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{id}/transition action=REJECT"
        actor: StoreManager
        preconditions: ["status IN {REQUESTED, APPROVED}"]
        side_effects: ["If return_type == EXCHANGE and a reservation was made: release exchange reservation"]
      - from: APPROVED
        to: REJECTED
        trigger: "POST /returns/{id}/transition action=REJECT"
        actor: StoreManager
        preconditions: ["status IN {REQUESTED, APPROVED}"]
        side_effects: ["If return_type == EXCHANGE and a reservation was made: release exchange reservation"]

  # ---- BoxSubscription ----
  - entity: BoxSubscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /box-subscriptions/{id}/status to_status=PAUSED"
        actor: Customer
        preconditions: ["status == ACTIVE"]
        side_effects: ["increments BoxSubscription.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /box-subscriptions/{id}/status to_status=ACTIVE"
        actor: Customer
        preconditions: ["status == PAUSED"]
        side_effects: ["increments BoxSubscription.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /box-subscriptions/{id}/status to_status=CANCELLED"
        actor: Customer
        preconditions: ["status IN {ACTIVE, PAUSED}"]
        side_effects: ["increments BoxSubscription.version by 1"]

  # ---- BoxShipment ----
  - entity: BoxShipment
    initial_state: CURATED
    terminal_states: [SETTLED]
    transitions:
      - from: CURATED
        to: SHIPPED
        trigger: "POST /box-shipments/{id}/ship"
        actor: StoreManager
        preconditions:
          - "status == CURATED"
          - "parent BoxSubscription.status == ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "shipped_at = clock now"
          - "provisional_charge_cents = sum(retail_cents over all items)"
      - from: SHIPPED
        to: KEPT_PENDING
        trigger: "POST /box-shipments/{id}/keep-decisions"
        actor: Customer
        preconditions:
          - "status == SHIPPED"
          - "kept_variant_ids subset of item variant_ids (ERR_INVALID_KEEP_SELECTION)"
        side_effects: ["Record kept_variant_ids"]
      - from: KEPT_PENDING
        to: SETTLED
        trigger: "POST /box-shipments/{id}/settle"
        actor: StoreManager
        preconditions:
          - "status == KEPT_PENDING"
          - "clock now >= shipped_at + TRYON_WINDOW_DAYS (ERR_TRYON_WINDOW_OPEN)"
        side_effects:
          - "Compute final_charge_cents per box_charge calculation (kept items only)"
          - "For each KEPT item: variant.inventory_on_hand -= 1; variant.inventory_reserved -= 1"
          - "For each NOT-kept item: variant.inventory_reserved -= 1 (release)"
          - "points_earned = floor(final_charge_cents / EARN_CENTS_PER_POINT)"
          - "customer.loyalty_points_balance += points_earned; customer.loyalty_lifetime_points += points_earned (link 1)"
          - "Recompute customer.loyalty_tier (link 2)"
          - "If loyalty_tier crossed upward: customer.wallet_credit_cents += TIER_UP_BONUS_CENTS[new_tier] (link 3)"

  # ---- Customer: account + booking status ----
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{id}/status to_status=SUSPENDED"
        actor: StoreManager
        preconditions: ["account_status == ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{id}/status to_status=ACTIVE"
        actor: StoreManager
        preconditions: ["account_status == SUSPENDED"]
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /customers/{id}/status to_status=CLOSED"
        actor: StoreManager
        preconditions: ["account_status IN {ACTIVE, SUSPENDED}"]
        side_effects: []
    note: "account_status machine shown; booking_status (ACTIVE->SUSPENDED) is driven only by the NO_SHOW cascade above, not by a direct endpoint."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: shipment-create-stale-subscription
    parent_entity: BoxSubscription
    write_endpoint: "POST /box-subscriptions/{id}/shipments"
    occ_field: "expected_subscription_version"
    description: |
      Curating a BoxShipment against a BoxSubscription whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just curated the current-cycle box (which
      legitimately supersedes the prior curation and bumped the subscription
      version) so the current writer's view of the subscription is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_total
    trigger: "POST /orders/{id}/checkout (payment PENDING->AUTHORIZED)"
    algorithm: weighted_scoring
    formula: |
      # evaluation order is pinned; each step consumes the prior result
      subtotal_cents      = sum(OrderLine.line_total_cents for all lines)
      tier_pct            = TIER_DISCOUNT[customer.loyalty_tier]   # 0.00 | 0.05 | 0.10
      tier_discount_cents = round_half_up(subtotal_cents * tier_pct)
      after_tier          = subtotal_cents - tier_discount_cents
      redeem_cap_cents    = round_half_up(REDEEM_CAP_PCT * subtotal_cents)
      loyalty_redeemed_cents = min(loyalty_redeemed_points * REDEEM_VALUE_CENTS_PER_POINT,
                                   redeem_cap_cents, after_tier)
      after_redeem        = after_tier - loyalty_redeemed_cents
      wallet_applied_cents = min(customer.wallet_credit_cents, after_redeem)  # only if use_wallet_credit
      total_cents         = after_redeem - wallet_applied_cents
    input_set: "All OrderLine rows of the order; customer.loyalty_tier, loyalty_points_balance, wallet_credit_cents at checkout time."
    constants:
      REDEEM_VALUE_CENTS_PER_POINT: 5
      REDEEM_CAP_PCT: 0.30
      TIER_DISCOUNT: { STANDARD: 0.00, INSIDER: 0.05, VIP: 0.10 }
    precision: "integer cents; round_half_up on each percentage product before subtraction"

  - name: box_charge
    trigger: "SHIP sets provisional (POST /box-shipments/{id}/ship); SETTLE sets final (POST /box-shipments/{id}/settle)"
    algorithm: aggregation
    formula: |
      # PROVISIONAL (at SHIP): full box, no discount
      provisional_charge_cents = sum(item.retail_cents for item in items)   # ALL items

      # FINAL (at SETTLE): kept items only, tier-discounted, ROUND PER ITEM then sum
      tier_pct = TIER_DISCOUNT[customer.loyalty_tier]
      kept_subtotal_cents = sum( round_half_up(item.retail_cents * (1 - tier_pct))
                                 for item in items if item.variant_id in kept_variant_ids )
      styling_credit_cents = min(subscription.styling_fee_cents, kept_subtotal_cents)
      final_charge_cents   = kept_subtotal_cents - styling_credit_cents
    input_set: "BoxShipment.items (all for provisional; kept subset for final); customer.loyalty_tier; subscription.styling_fee_cents."
    constants:
      TIER_DISCOUNT: { STANDARD: 0.00, INSIDER: 0.05, VIP: 0.10 }
    precision: "integer cents; rounding order is PINNED to round-each-kept-item then sum (NOT sum-then-round)"
    variants:
      - name: provisional
        when: "at SHIP"
        difference: "sum of retail_cents over ALL items; no tier discount, no styling credit"
      - name: final
        when: "at SETTLE"
        difference: "kept items only, each tier-discounted and rounded, minus styling credit"

  - name: return_refund
    trigger: "REQUESTED sets provisional (POST /returns); INSPECT sets final (POST /returns/{id}/transition action=INSPECT)"
    algorithm: aggregation
    formula: |
      # PROVISIONAL (at REQUESTED): estimate, full line totals, no fees
      provisional_refund_cents = sum(OrderLine.line_total_cents for id in line_ids)

      # FINAL (at INSPECT): exclude damaged lines, subtract restocking fee
      nondamaged_total = sum(OrderLine.line_total_cents
                             for id in line_ids if id not in damaged_line_ids)
      restock_fee_cents = round_half_up(product.restock_fee_pct * nondamaged_total)
      final_refund_cents = nondamaged_total - restock_fee_cents
    input_set: "The OrderLine rows named in line_ids; damaged_line_ids supplied at INSPECT; product.restock_fee_pct."
    constants: {}
    precision: "integer cents; round_half_up on restock fee"
    variants:
      - name: provisional
        when: "at REQUESTED"
        difference: "full sum of returned line totals; damaged lines and restock fee not yet known"
      - name: final
        when: "at INSPECT"
        difference: "damaged lines removed from base, then restock fee subtracted"

  - name: loyalty_earn_and_tier
    trigger: "Order DELIVER and BoxShipment SETTLE"
    algorithm: threshold
    formula: |
      earned = floor(spend_cents / EARN_CENTS_PER_POINT)   # spend = Order.total_cents or box final_charge_cents
      customer.loyalty_points_balance  += earned
      customer.loyalty_lifetime_points += earned
      new_tier = VIP      if loyalty_lifetime_points >= TIER_VIP_MIN
                 else INSIDER if loyalty_lifetime_points >= TIER_INSIDER_MIN
                 else STANDARD
      if rank(new_tier) > rank(customer.loyalty_tier):   # upward crossing only
          customer.wallet_credit_cents += TIER_UP_BONUS_CENTS[new_tier]
      customer.loyalty_tier = new_tier
    input_set: "Single earning event; customer's pre-event lifetime points and tier."
    constants:
      EARN_CENTS_PER_POINT: 100
      TIER_INSIDER_MIN: 500
      TIER_VIP_MIN: 2000
      TIER_UP_BONUS_CENTS: { INSIDER: 1000, VIP: 2500 }
    precision: "integer points (floor on earn); tier boundaries use >= (lifetime 500 => INSIDER, 2000 => VIP)"

  - name: inventory_availability
    trigger: "POST /orders/{id}/lines, box shipment curation, and every reserve/release side effect"
    algorithm: aggregation
    formula: |
      inventory_available = inventory_on_hand - inventory_reserved
      # add-line precondition: inventory_available >= quantity, else ERR_INSUFFICIENT_INVENTORY
      # reserve: inventory_reserved += n ; release: inventory_reserved -= n (inventory_on_hand unchanged)
      # sale (SHIP / box keep): inventory_on_hand -= n AND inventory_reserved -= n
    input_set: "A single ProductVariant row; the requested quantity."
    constants: {}
    precision: "integer units; boundary is inventory_available >= quantity (>=)"

  - name: specialist_buffer_overlap
    trigger: "Appointment CONFIRM / RESCHEDULE_CONFIRM"
    algorithm: interval_merge
    formula: |
      # specialist resource: BUFFERED single-occupancy
      conflict_specialist = EXISTS other appointment A2 on same specialist_id
        with A2.status in {CONFIRMED, RESCHEDULE_REQUESTED}
        and (this.start_at - buffer) < A2.end_at
        and A2.start_at < (this.end_at + buffer)    # buffer = specialist.buffer_minutes
      # customer resource: UNBUFFERED half-open [start, end)
      conflict_customer = EXISTS other appointment A3 for same customer_id
        with A3.status == CONFIRMED
        and this.start_at < A3.end_at and A3.start_at < this.end_at
    input_set: "Sibling appointments on the same specialist / same customer."
    constants: {}
    precision: "minutes; specialist uses buffered exclusion, customer uses exact half-open intersection"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers/register and public product GETs"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix; for entity_backed roles, X-User-ID must own the target resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource and every referenced FK (product_id, variant_id, order_id, specialist_id, subscription_id, exchange_variant_id, line_ids) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "OCC: expected_subscription_version equals BoxSubscription.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /box-subscriptions/{id}/shipments"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Domain constraints: variant size within product range; inventory_available >= quantity; line_ids/damaged_line_ids/kept_variant_ids subset checks; topic in specialist.specialties; EXCHANGE requires exchange_variant_id"
    error_id: "ERR_SIZE_OUT_OF_RANGE / ERR_INSUFFICIENT_INVENTORY / ERR_INVALID_LINE_SELECTION / ERR_INVALID_KEEP_SELECTION / ERR_SPECIALTY_MISMATCH / ERR_EXCHANGE_VARIANT_REQUIRED"
    http_status: 409
    applies_to: "variant create, add-line, return inspect, keep-decisions, appointment confirm, return create"

  - priority: 7
    category: business_referential
    check: "Linked entity in required state: customer.account_status ACTIVE for checkout; customer.booking_status ACTIVE for confirm; subscription.status ACTIVE for ship; specialist.status ACTIVE for confirm"
    error_id: "ERR_CUSTOMER_SUSPENDED / ERR_BOOKING_SUSPENDED / ERR_SUBSCRIPTION_NOT_ACTIVE / ERR_SPECIALIST_ON_LEAVE"
    http_status: 409
    applies_to: "checkout, appointment confirm, box ship"

  - priority: 8
    category: business_temporal
    check: "Time-window rules: return within RETURN_WINDOW_DAYS of delivered_at; settle only after shipped_at + TRYON_WINDOW_DAYS; appointment overlap (specialist buffered, customer half-open); complete/no-show clock gates"
    error_id: "ERR_RETURN_WINDOW_CLOSED / ERR_TRYON_WINDOW_OPEN / ERR_SPECIALIST_UNAVAILABLE / ERR_CUSTOMER_DOUBLE_BOOKED / ERR_APPOINTMENT_NOT_ENDED / ERR_APPOINTMENT_NOT_STARTED"
    http_status: 409
    applies_to: "return create, box settle, appointment confirm/complete/no-show"

  - priority: 9
    category: business_fiscal
    check: "Fiscal capacity: loyalty_redeemed_points <= loyalty_points_balance; empty-order guard"
    error_id: "ERR_INSUFFICIENT_POINTS / ERR_EMPTY_ORDER"
    http_status: 409
    applies_to: "checkout"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock."
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advances to to_iso8601 for all subsequent time comparisons"]

  # ---- Customer ----
  - method: POST
    path: "/customers/register"
    description: "Register a new customer"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, size_code, "adaptive_needs?"]
    output: Customer
    side_effects: ["loyalty_points_balance=0, loyalty_lifetime_points=0, loyalty_tier=STANDARD, wallet_credit_cents=0, no_show_count=0, booking_status=ACTIVE, account_status=ACTIVE"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/status"
    description: "StoreManager sets account_status (ACTIVE|SUSPENDED|CLOSED)"
    roles: [StoreManager]
    code: 200
    input: [to_status]
    output: Customer
    side_effects: ["account_status transition per Customer state machine"]

  - method: POST
    path: "/customers/{id}/wallet-adjustments"
    description: "StoreManager issues or deducts store credit (customer-service credit)"
    roles: [StoreManager]
    code: 200
    input: [delta_cents, "reason?"]
    output: Customer
    side_effects: ["customer.wallet_credit_cents += delta_cents (floored at 0)"]

  - method: POST
    path: "/customers/{id}/loyalty-adjustments"
    description: "StoreManager grants or deducts loyalty points (goodwill). delta_points adjusts BOTH loyalty_points_balance and loyalty_lifetime_points and recomputes loyalty_tier, but grants NO tier-up wallet bonus (bonuses come only from organic DELIVER/SETTLE earning)."
    roles: [StoreManager]
    code: 200
    input: [delta_points, "reason?"]
    output: Customer
    side_effects: ["loyalty_points_balance += delta_points; loyalty_lifetime_points += delta_points; recompute loyalty_tier (no bonus)"]

  # ---- Product ----
  - method: POST
    path: "/products"
    description: "Create a catalog product"
    roles: [StoreManager]
    code: 201
    input: [name, category, base_price_cents, size_min, size_max, "adaptive_features?", "is_special_order?", "restock_fee_pct?"]
    output: Product
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/products"
    description: "List/browse products. Filters: adaptive_feature (garment includes it), size_code (size_min<=size_code<=size_max), category, is_special_order."
    roles: [Anonymous, Customer, StoreManager]
    code: 200
    input: ["adaptive_feature?", "size_code?", "category?", "is_special_order?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Get a product"
    roles: [Anonymous, Customer, StoreManager]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/products/{id}/variants"
    description: "Create a size/color SKU under a product"
    roles: [StoreManager]
    code: 201
    input: [size_code, color, "price_delta_cents?", "inventory_on_hand?"]
    output: ProductVariant
    side_effects: ["inventory_reserved=0; inventory_available=inventory_on_hand; validates size_code within product range"]

  - method: GET
    path: "/products/{id}/variants"
    description: "List variants of a product (reverse-reachability for ProductVariant.product_id)"
    roles: [Anonymous, Customer, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductVariant[]
    side_effects: []

  - method: GET
    path: "/variants/{id}"
    description: "Get a variant"
    roles: [Anonymous, Customer, StoreManager]
    code: 200
    input: []
    output: ProductVariant
    side_effects: []

  - method: POST
    path: "/variants/{id}/restock"
    description: "StoreManager adjusts physical stock"
    roles: [StoreManager]
    code: 200
    input: [quantity]
    output: ProductVariant
    side_effects: ["inventory_on_hand += quantity; recompute inventory_available"]

  - method: GET
    path: "/variants/{id}/order-lines"
    description: "List order lines referencing this variant (reverse-reachability for OrderLine.variant_id)"
    roles: [StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  # ---- FitSpecialist ----
  - method: POST
    path: "/specialists"
    description: "Create a fit specialist"
    roles: [StoreManager]
    code: 201
    input: [full_name, specialties, "buffer_minutes?"]
    output: FitSpecialist
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/specialists/{id}"
    description: "Get a fit specialist"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: FitSpecialist
    side_effects: []

  - method: POST
    path: "/specialists/{id}/status"
    description: "Set specialist availability (ACTIVE|ON_LEAVE)"
    roles: [StoreManager]
    code: 200
    input: [to_status]
    output: FitSpecialist
    side_effects: []

  # ---- StylingAppointment ----
  - method: POST
    path: "/appointments"
    description: "Customer books a virtual styling / fit appointment (starts REQUESTED)"
    roles: [Customer]
    code: 201
    input: [specialist_id, start_at, end_at, "topic?"]
    output: StylingAppointment
    side_effects: ["status=REQUESTED; customer_id set from X-User-ID"]

  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [Customer, FitSpecialist, StoreManager]
    code: 200
    input: []
    output: StylingAppointment
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments (reverse-reachability for customer_id and specialist_id)"
    roles: [Customer, FitSpecialist, StoreManager]
    code: 200
    input: ["customer_id?", "specialist_id?", "limit?", "offset?"]
    output: StylingAppointment[]
    side_effects: []

  - method: POST
    path: "/appointments/{id}/transition"
    description: "Advance an appointment. action in {CONFIRM, RESCHEDULE_REQUEST, RESCHEDULE_CONFIRM, COMPLETE, CANCEL, NO_SHOW}. Actor gated per state machine."
    roles: [Customer, FitSpecialist, StoreManager]
    code: 200
    input: [action, "proposed_start_at?", "proposed_end_at?"]
    output: StylingAppointment
    side_effects: ["Per StylingAppointment state machine (overlap checks, cascades, late-cancel fee)"]

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Customer opens an order (cart) in PENDING/UNFULFILLED"
    roles: [Customer]
    code: 201
    input: []
    output: Order
    side_effects: ["payment_status=PENDING; fulfillment_status=UNFULFILLED; customer_id set from X-User-ID"]

  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders (reverse-reachability for Order.customer_id)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a line to a PENDING order; reserves inventory"
    roles: [Customer]
    code: 201
    input: [variant_id, quantity]
    output: OrderLine
    side_effects: ["unit_price_cents snapshot; line_total_cents computed; variant.inventory_reserved += quantity (requires inventory_available >= quantity)"]

  - method: GET
    path: "/orders/{id}/lines"
    description: "List lines of an order (reverse-reachability for OrderLine.order_id)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/checkout"
    description: "Authorize the order: compute totals, redeem points, optionally apply wallet (payment PENDING->AUTHORIZED)"
    roles: [Customer]
    code: 200
    input: ["loyalty_redeem_points?", "use_wallet_credit?"]
    output: Order
    side_effects: ["Per order_total calculation; debit loyalty_points_balance and wallet_credit_cents"]

  - method: POST
    path: "/orders/{id}/transition"
    description: "Order lifecycle action in {CAPTURE, PICK, SHIP, DELIVER, CANCEL}. Advances the payment or fulfillment dimension per the Order state machines."
    roles: [Customer, StoreManager]
    code: 200
    input: [action]
    output: Order
    side_effects: ["Per Order payment/fulfillment state machines (inventory sale/release, loyalty earn cascade, redemption reversal, refund)"]

  # ---- ReturnRequest ----
  - method: POST
    path: "/returns"
    description: "Customer opens a return/exchange against a DELIVERED order (starts REQUESTED)"
    roles: [Customer]
    code: 201
    input: [order_id, return_type, line_ids, "exchange_variant_id?", "fit_verdict?", "refund_destination?"]
    output: ReturnRequest
    side_effects: ["provisional_refund_cents pinned; requires order DELIVERED and within RETURN_WINDOW_DAYS"]

  - method: GET
    path: "/returns/{id}"
    description: "Get a return request"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []

  - method: GET
    path: "/returns"
    description: "List returns (reverse-reachability for order_id and exchange_variant_id)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["order_id?", "exchange_variant_id?", "limit?", "offset?"]
    output: ReturnRequest[]
    side_effects: []

  - method: POST
    path: "/returns/{id}/transition"
    description: "Return lifecycle action in {APPROVE, INSPECT, COMPLETE, REJECT}. INSPECT accepts damaged_line_ids and pins final_refund_cents."
    roles: [StoreManager]
    code: 200
    input: [action, "damaged_line_ids?"]
    output: ReturnRequest
    side_effects: ["Per ReturnRequest state machine (restock, exchange reservation, wallet credit)"]

  # ---- BoxSubscription ----
  - method: POST
    path: "/box-subscriptions"
    description: "Customer starts a subscription box membership (ACTIVE)"
    roles: [Customer]
    code: 201
    input: [plan_tier, "cadence?"]
    output: BoxSubscription
    side_effects: ["styling_fee_cents derived from plan_tier; status=ACTIVE; version=1; customer_id from X-User-ID"]

  - method: GET
    path: "/box-subscriptions/{id}"
    description: "Get a subscription"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: BoxSubscription
    side_effects: []

  - method: GET
    path: "/box-subscriptions"
    description: "List subscriptions (reverse-reachability for BoxSubscription.customer_id)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: BoxSubscription[]
    side_effects: []

  - method: POST
    path: "/box-subscriptions/{id}/status"
    description: "Set subscription status (to_status in {ACTIVE, PAUSED, CANCELLED})"
    roles: [Customer]
    code: 200
    input: [to_status]
    output: BoxSubscription
    side_effects: ["Per BoxSubscription state machine; increments BoxSubscription.version by 1"]

  - method: POST
    path: "/box-subscriptions/{id}/shipments"
    description: "Curate a new box shipment for a subscription (OCC-guarded on subscription version)"
    roles: [FitSpecialist, StoreManager]
    code: 201
    input: [expected_subscription_version, item_variant_ids]
    output: BoxShipment
    side_effects: ["items snapshot built with retail_cents per variant; status=CURATED; reserve each item (variant.inventory_reserved += 1); increments BoxSubscription.version by 1"]

  # ---- BoxShipment ----
  - method: GET
    path: "/box-shipments/{id}"
    description: "Get a box shipment"
    roles: [Customer, FitSpecialist, StoreManager]
    code: 200
    input: []
    output: BoxShipment
    side_effects: []

  - method: GET
    path: "/box-subscriptions/{id}/shipments"
    description: "List shipments of a subscription (reverse-reachability for BoxShipment.subscription_id)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: BoxShipment[]
    side_effects: []

  - method: POST
    path: "/box-shipments/{id}/ship"
    description: "Ship a curated box (CURATED->SHIPPED); pins provisional_charge_cents; requires subscription ACTIVE"
    roles: [StoreManager]
    code: 200
    input: []
    output: BoxShipment
    side_effects: ["shipped_at=clock now; provisional_charge_cents = sum(retail over items)"]

  - method: POST
    path: "/box-shipments/{id}/keep-decisions"
    description: "Customer records kept items (SHIPPED->KEPT_PENDING)"
    roles: [Customer]
    code: 200
    input: [kept_variant_ids]
    output: BoxShipment
    side_effects: ["Record kept_variant_ids (must be subset of item variant_ids)"]

  - method: POST
    path: "/box-shipments/{id}/settle"
    description: "Settle the box after the try-on window (KEPT_PENDING->SETTLED); pins final_charge_cents; awards loyalty (cascade)"
    roles: [StoreManager]
    code: 200
    input: []
    output: BoxShipment
    side_effects: ["Per box_charge (final) and loyalty_earn_and_tier; inventory sale/release; try-on window gate"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body / missing required field / wrong type" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or entity_backed user does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or referenced FK does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_subscription_version does not match BoxSubscription.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "Checkout on an order with no lines" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "inventory_available < requested quantity" }
  - { id: ERR_SIZE_OUT_OF_RANGE, http: 409, condition: "Variant size_code outside product size_min..size_max" }
  - { id: ERR_INVALID_LINE_SELECTION, http: 409, condition: "line_ids not all in the order, or damaged_line_ids not subset of line_ids" }
  - { id: ERR_INVALID_KEEP_SELECTION, http: 409, condition: "kept_variant_ids not subset of box item variant_ids" }
  - { id: ERR_EXCHANGE_VARIANT_REQUIRED, http: 409, condition: "return_type=EXCHANGE without exchange_variant_id" }
  - { id: ERR_SPECIALTY_MISMATCH, http: 409, condition: "Appointment topic not in specialist.specialties" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Checkout while customer.account_status != ACTIVE" }
  - { id: ERR_BOOKING_SUSPENDED, http: 409, condition: "Confirm while customer.booking_status == SUSPENDED" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Ship while parent subscription.status != ACTIVE" }
  - { id: ERR_SPECIALIST_ON_LEAVE, http: 409, condition: "Confirm while specialist.status == ON_LEAVE" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 409, condition: "Return opened after RETURN_WINDOW_DAYS from delivered_at" }
  - { id: ERR_TRYON_WINDOW_OPEN, http: 409, condition: "Settle before shipped_at + TRYON_WINDOW_DAYS" }
  - { id: ERR_SPECIALIST_UNAVAILABLE, http: 409, condition: "Confirm collides with specialist's buffered occupancy" }
  - { id: ERR_CUSTOMER_DOUBLE_BOOKED, http: 409, condition: "Confirm collides with customer's own confirmed appointment" }
  - { id: ERR_APPOINTMENT_NOT_ENDED, http: 409, condition: "Complete before clock reaches end_at" }
  - { id: ERR_APPOINTMENT_NOT_STARTED, http: 409, condition: "No-show before clock reaches start_at" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 409, condition: "loyalty_redeemed_points exceeds loyalty_points_balance" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor: register and browse the catalog only."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers/register"
    shared_operations:
      - "GET /products, GET /products/{id}, GET /products/{id}/variants, GET /variants/{id}"

  - name: Customer
    description: "A registered shopper acting on their own resources (X-User-ID must equal the owning Customer.id)."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /appointments"
      - "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/checkout"
      - "POST /returns"
      - "POST /box-subscriptions, POST /box-subscriptions/{id}/status"
      - "POST /box-shipments/{id}/keep-decisions"
    shared_operations:
      - "GET own customer/orders/returns/appointments/subscriptions/shipments"
      - "POST /appointments/{id}/transition (CANCEL, RESCHEDULE_REQUEST)"
      - "POST /orders/{id}/transition (CANCEL)"

  - name: FitSpecialist
    description: "Staff stylist (X-User-ID equals FitSpecialist.id) who confirms/completes/no-shows appointments and curates boxes."
    identity: "entity_backed:FitSpecialist"
    exclusive_operations:
      - "POST /appointments/{id}/transition (CONFIRM, RESCHEDULE_CONFIRM, COMPLETE, NO_SHOW)"
    shared_operations:
      - "POST /box-subscriptions/{id}/shipments (shared with StoreManager)"
      - "GET /appointments, GET /box-shipments/{id}"

  - name: StoreManager
    description: "Operational back-office (opaque operator id). Manages catalog, inventory, fulfillment, settlement, returns, customer status, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /products, POST /products/{id}/variants, POST /variants/{id}/restock"
      - "POST /specialists, POST /specialists/{id}/status"
      - "POST /customers/{id}/status, POST /customers/{id}/wallet-adjustments, POST /customers/{id}/loyalty-adjustments"
      - "POST /orders/{id}/transition (CAPTURE, PICK, SHIP, DELIVER)"
      - "POST /returns/{id}/transition"
      - "POST /box-shipments/{id}/ship, POST /box-shipments/{id}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /box-subscriptions/{id}/shipments (shared with FitSpecialist)"
      - "POST /appointments/{id}/transition (CONFIRM, RESCHEDULE_CONFIRM, NO_SHOW)"
      - "GET across all collections"
