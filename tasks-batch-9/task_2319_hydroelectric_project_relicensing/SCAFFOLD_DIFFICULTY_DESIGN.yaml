            - "${st_r2} == NEGOTIATING and ${round_after_2} == 3 and ${pct_r2} == 0.00 (the round-1 signature does not carry forward)"
            - "${st_r3} == FAILED and ${round_after_3} == 3"
            - "SettlementSignature.${sig_r1}.round_number == 1 and share_pct == 50.00 (retained, never rewritten)"
            - "PmeMeasure.${m_stl}.status == SUPERSEDED"
            - "RelicensingProject.${proj}.total_pme_annual_cost_usd == 0.00 and total_annual_burden_usd == 0.00 and burden_ratio_pct == 0.00"

