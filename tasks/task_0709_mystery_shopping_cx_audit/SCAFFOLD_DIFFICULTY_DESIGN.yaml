            - "Assignment.${asg_id}.shopper_fee_cents == 2400 (reliability 90 → HIGH tier 0.20: 2000 + round_half_up(400))"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_revision_cycle_returns_to_in_field
        grounds:
          - state_machines.Assignment.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Assignment.REVISION_REQUESTED_to_IN_FIELD
          - entities.Assignment.fields.submission_count
        distinguishing_aspect: |
          Assignment is cyclic: SUBMITTED→REVISION_REQUESTED→IN_FIELD→SUBMITTED again,
          with submission_count incrementing each SUBMITTED entry (reaches 2) — a
          revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Assignment SUBMITTED once (submission_count=1) with complete APPROVED evidence + scorecard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "CycCo", billing_email: "ap@cyc.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "CL", lat: 40.0, lng: -74.0, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "Cyc", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: false, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 1.0 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
