        grounds:
          - validations[priority=9 business_constraint ERR_GRANT_PERIOD_OVERLAP]
          - state_machines.Grant.PROVISIONAL_to_CONFIRMED
        distinguishing_aspect: "Grant-period overlap uses HALF-OPEN interval semantics on the applicant's grant resource: a new confirmed period starting exactly on the existing grant's end_date (2028-09-01 == 2028-09-01) is legal adjacency, while starting one month earlier (2028-08-01) overlaps and is rejected."
