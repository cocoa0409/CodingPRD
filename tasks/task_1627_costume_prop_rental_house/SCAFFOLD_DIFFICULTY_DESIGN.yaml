          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: the pull list is CANCELLED (priority 5) and
          the renter is on credit_hold (priority 11) in the same request state; the dispatch MUST fail
          with ERR_INVALID_STATE (409), never ERR_CREDIT_LIMIT_EXCEEDED (402).
        test_recipe:
          setup:
            - "RC published; item with 2 units; renter ACTIVE with credit_limit initially 10000000"
            - "Production P1 (long-run): reservation R1 qty 1 Sep 1-10 CONFIRMED; pull list PL1 PICKING with line PICKED"
