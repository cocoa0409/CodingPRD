      - name: certification_gate_order_top_critic_shortfall_beats_score
        grounds:
          - calculations.certification_status
          - calculations.tomatometer_score
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency (certified input set depends
          on accreditation, certification depends on the score over that set) is
          resolved by the pinned evaluation order N -> T -> P. With N=5
          accredited reviews (meets MIN_REVIEWS_CERTIFIED), P=80 pct (>= 75) but
          T=1 top-critic review (< MIN_TOP_CRITIC_REVIEWS=2), gate 2 fires and
          certification is NONE despite the qualifying percentage.
        test_recipe:
