              captures: { e1: $.data.error_id }
            - call: "POST /commission/licensees/${sam_id}/exam-results"
              payload: { score: 76, taken_on: "2026-07-20" }
              as: LicensingAnalyst
          assert:
            - "the broker's exam result returns 422 ERR_PRELICENSE_HOURS_INSUFFICIENT (90 < 180)"
            - "Licensee.${bea_id}.exam_attempt_count is still 0, exam_best_score is still 0, exam_passed_at is null and license_status is still APPLICANT - a refused result is not an attempt"
            - "the salesperson's result with the same 90 hours returns 200 with license_status == EXAM_PASSED, exam_attempt_count == 1, exam_best_score == 76 and exam_passed_at == 2026-08-01T00:00:00Z (the logical clock, not taken_on)"
      - name: a_ce_deficient_licensee_cannot_transfer_and_the_transfer_revokes_the_team_name
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=37]
