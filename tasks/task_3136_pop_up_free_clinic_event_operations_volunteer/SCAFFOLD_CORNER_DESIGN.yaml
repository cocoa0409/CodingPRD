            - call: "POST /clinic-events"
              payload: { event_code: "RAM-OCC", name: "OCC Event", host_state_code: "TN", service_date: "2027-07-17", doors_open_utc: "2027-07-17T10:00:00Z", total_patient_capacity: 10 }
