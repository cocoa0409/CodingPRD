            - "after reverse Prescription.${rx_id}.refills_remaining == 2"
            - "refills_remaining + FULFILLED count == total_refills_authorized (2) before and after"

      - name: deductible_conservation_on_charge_reverse
        grounds:
          - calculations.deductible_conservation_invariant
          - state_machines.Charge.ESTIMATED_to_ADJUDICATED
          - state_machines.Charge.ADJUDICATED_to_REVERSED
          - entities.InsurancePolicy.fields.consumed_deductible_cents
        distinguishing_aspect: "Conserved quantity = deductible DOLLARS: adjudicate consumes 20000 (remaining 25000->5000, consumed 0->20000); a direct charge reverse restores it (remaining 25000, consumed 0), keeping remaining + consumed == deductible_cents (25000) — a different conserved quantity than the refill count."
