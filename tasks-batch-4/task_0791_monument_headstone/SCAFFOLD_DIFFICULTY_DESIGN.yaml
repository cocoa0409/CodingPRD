# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Monument & Headstone Service (Expert) — 9 rules x 2 instances = 18 instances.
# All numeric asserts were computed against the §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: order_provisional_vs_final_merchandise
        grounds:
          - calculations.order_pricing
          - entities.MonumentOrder.fields.provisional_merchandise_cents
          - entities.MonumentOrder.fields.merchandise_price_cents
          - state_machines.DesignProof.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Cost accounting on the MonumentOrder domain: the provisional variant prices from
          estimated_line_char_counts [20,20] (27700) at creation, the final variant re-prices
          from the approved proof's line_char_counts [21,31] (30251) — the two differ.
        test_recipe:
          setup:
            - "Cemetery allowing GRANITE with permit_fee_cents 12000; a Customer; an order 60x40 GRANITE HUMAN with estimated_line_char_counts [20,20] (provisional merchandise 27700, contract 84700, deposit 33880); a proof with line_char_counts [21,31] SUBMITTED; deposit of 33880 paid."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE", "BRONZE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000, requires_foundation: true }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "In Loving Memory", line_char_counts: [21, 31] }
              as: Designer
              captures: { proof: $.data.id }
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /memorials/design-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "MonumentOrder.${ord}.provisional_merchandise_cents == 27700"
            - "MonumentOrder.${ord}.merchandise_price_cents == 30251"
            - "MonumentOrder.${ord}.contract_total_cents == 87251"
            - "MonumentOrder.${ord}.merchandise_price_cents != MonumentOrder.${ord}.provisional_merchandise_cents"

      - name: restoration_quoted_vs_assessed_cost
        grounds:
          - calculations.restoration_costing
          - entities.RestorationJob.fields.quoted_cost_cents
          - entities.RestorationJob.fields.assessed_cost_cents
          - state_machines.RestorationJob.REQUESTED_to_ASSESSED
        distinguishing_aspect: |
          Cost accounting on the RestorationJob domain (different entity from MonumentOrder): the
          quoted variant uses customer-reported area 1000 (REPAIR -> 6000); the assessed variant
          uses shop-measured area 1200 plus the SEVERE surcharge (1200*6 + 5000 = 12200).
        test_recipe:
          setup:
            - "A Cemetery, Customer, and order; a Workshop; a RestorationJob REQUESTED with service_type REPAIR, reported_area_cm2 1000 (quoted 6000)."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /memorials/workshops"
              payload: { name: "Shop A" }
              as: Admin
              captures: { ws: $.data.id }
            - call: "POST /memorials/restorations"
              payload: { order_id: "${ord}", service_type: "REPAIR", is_warranty: false, reported_area_cm2: 1000 }
              as: Customer
              as_user_id: "${cust}"
              captures: { rest: $.data.id }
          trigger:
            - call: "POST /memorials/restorations/${rest}/assess"
              payload: { workshop_id: "${ws}", measured_area_cm2: 1200, condition: "SEVERE", scheduled_start: "2026-03-10T09:00:00Z", scheduled_end: "2026-03-10T11:00:00Z" }
              as: ShopManager
          assert:
            - "RestorationJob.${rest}.quoted_cost_cents == 6000"
            - "RestorationJob.${rest}.assessed_cost_cents == 12200"
            - "RestorationJob.${rest}.assessed_cost_cents != RestorationJob.${rest}.quoted_cost_cents"
            - "RestorationJob.${rest}.status == ASSESSED"

  - rule_id: combinatorial_formula
    instances:
      - name: order_tiered_size_multiplier_pricing
        grounds:
          - calculations.order_pricing
          - entities.MonumentOrder.fields.provisional_merchandise_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear tier selection. face_area 80*80 = 6400 selects the
          125% LARGE tier; material_priced = round_half_up(6400*8*125/100) = 64000; plus engraving
          11051 -> provisional_merchandise_cents 75051.
        test_recipe:
          setup:
            - "A Cemetery permitting large markers (max 120cm each dimension); a Customer."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Grand Lawn", allowed_materials: ["GRANITE"], max_height_cm: 120, max_width_cm: 120, max_base_width_cm: 120, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Sam Roe", email: "sam@example.com" }
              as: Admin
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 80, width_cm: 80, base_width_cm: 60, estimated_line_char_counts: [21, 31] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          assert:
            - "MonumentOrder.${ord}.provisional_merchandise_cents == 75051"

      - name: engraving_per_line_rounding_charge
        grounds:
          - calculations.engraving_charge
          - entities.MonumentOrder.fields.provisional_merchandise_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order. Per-line rounding round(21*212.5)=4463 + round(31*212.5)=6588
          = 11051 vs sum-then-round round(52*212.5)=11050. Scaffold pins per-line, so with material 19200
          the provisional_merchandise_cents is 30251, not 30250.
        test_recipe:
          setup:
            - "A Cemetery permitting GRANITE (max 90/75/80); a Customer."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Sam Roe", email: "sam@example.com" }
              as: Admin
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [21, 31] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          assert:
            - "MonumentOrder.${ord}.provisional_merchandise_cents == 30251"

  - rule_id: non_linear_state_machine
    instances:
      - name: design_proof_revision_cycle
        grounds:
          - state_machines.DesignProof.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.DesignProof.CHANGES_REQUESTED_to_SUBMITTED
          - entities.DesignProof.fields.revision_round
        distinguishing_aspect: |
          Cyclic shape on DesignProof: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED returns to a prior
          state and increments revision_round to 2.
        test_recipe:
          setup:
            - "A Cemetery, Customer, order; a proof created, submitted (round 1), then CHANGES_REQUESTED by the customer."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "Rest In Peace", line_char_counts: [12, 18] }
              as: Designer
              captures: { proof: $.data.id }
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
            - call: "POST /memorials/design-proofs/${proof}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
          assert:
            - "DesignProof.${proof}.status == SUBMITTED"
            - "DesignProof.${proof}.revision_round == 2"

      - name: order_parallel_payment_vs_production
        grounds:
          - state_machines.MonumentOrder.UNPAID_to_DEPOSIT_PAID
          - entities.MonumentOrder.fields.payment_status
          - entities.MonumentOrder.fields.production_status
        distinguishing_aspect: |
          Parallel dimensions on MonumentOrder (different entity from DesignProof): paying the deposit
          advances payment_status to DEPOSIT_PAID while production_status stays DRAFTING — the two axes
          evolve independently.
        test_recipe:
          setup:
            - "A Cemetery, Customer, and a DRAFTING/UNPAID order 60x40 GRANITE (provisional deposit 33880)."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "MonumentOrder.${ord}.payment_status == DEPOSIT_PAID"
            - "MonumentOrder.${ord}.production_status == DRAFTING"

  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_installation_permit_crew_chain
        grounds:
          - state_machines.MonumentOrder.production_status
          - state_machines.Installation.SCHEDULED_to_CANCELLED
          - state_machines.CemeteryPermit.ISSUED_to_REVOKED
          - entities.InstallationCrew.fields.booked_minutes
        distinguishing_aspect: |
          Depth-3 causal chain from POST /orders/{id}/cancel: order CANCELLED triggers Installation
          CANCELLED, and that Installation cancellation itself triggers CemeteryPermit REVOKED and
          InstallationCrew capacity release (each hop caused by the previous, not by the cancel directly).
        test_recipe:
          setup:
            - "An order driven to READY_TO_INSTALL (proof approved, deposit paid, fabrication completed at clock 2026-03-10), an ISSUED permit (placement 2026-03-20), and a SCHEDULED installation on a crew for [2026-03-25T09:00, 11:00) (crew booked 120 min)."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/workshops"
              payload: { name: "Shop A" }
              as: Admin
              captures: { ws: $.data.id }
            - call: "POST /memorials/crews"
              payload: { name: "Crew 1" }
              as: Admin
              captures: { cr: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "In Loving Memory", line_char_counts: [21, 31] }
              as: Designer
              captures: { proof: $.data.id }
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/design-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: Admin
            - call: "POST /memorials/fabrication-jobs"
              payload: { order_id: "${ord}", workshop_id: "${ws}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: ShopManager
              captures: { fab: $.data.id }
            - call: "POST /memorials/fabrication-jobs/${fab}/complete"
              payload: {}
              as: ShopManager
            - call: "POST /memorials/permits"
              payload: { order_id: "${ord}", cemetery_id: "${cem}", permit_number: "P-100", placement_date: "2026-03-20T00:00:00Z" }
              as: FieldOps
              captures: { permit: $.data.id }
            - call: "POST /memorials/permits/${permit}/issue"
              payload: {}
              as: FieldOps
            - call: "POST /memorials/installations"
              payload: { order_id: "${ord}", crew_id: "${cr}", scheduled_start: "2026-03-25T09:00:00Z", scheduled_end: "2026-03-25T11:00:00Z" }
              as: FieldOps
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /memorials/orders/${ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "MonumentOrder.${ord}.production_status == CANCELLED"
            - "Installation.${inst}.status == CANCELLED"
            - "CemeteryPermit.${permit}.status == REVOKED"
            - "InstallationCrew.${cr}.booked_minutes == 0"

      - name: installation_complete_marks_order_installed
        grounds:
          - state_machines.Installation.SCHEDULED_to_COMPLETED
          - state_machines.MonumentOrder.READY_TO_INSTALL_to_INSTALLED
          - calculations.warranty_window
          - entities.MonumentOrder.fields.warranty_expires_at
        distinguishing_aspect: |
          Depth-2 cascade from POST /installations/{id}/complete (a trigger distinct from cancel):
          Installation COMPLETED itself advances the owning MonumentOrder to INSTALLED and stamps
          warranty_expires_at = completed_at + 120 months (HUMAN) = 2036-03-25T12:00:00Z.
        test_recipe:
          setup:
            - "An order at READY_TO_INSTALL, PAID_IN_FULL (deposit 33880 + balance 53371 = 87251), ISSUED permit, and a SCHEDULED installation [2026-03-25T09:00, 11:00); logical clock set to 2026-03-25T12:00:00Z before completion."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/workshops"
              payload: { name: "Shop A" }
              as: Admin
              captures: { ws: $.data.id }
            - call: "POST /memorials/crews"
              payload: { name: "Crew 1" }
              as: Admin
              captures: { cr: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "In Loving Memory", line_char_counts: [21, 31] }
              as: Designer
              captures: { proof: $.data.id }
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/design-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: Admin
            - call: "POST /memorials/fabrication-jobs"
              payload: { order_id: "${ord}", workshop_id: "${ws}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: ShopManager
              captures: { fab: $.data.id }
            - call: "POST /memorials/fabrication-jobs/${fab}/complete"
              payload: {}
              as: ShopManager
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "BALANCE", amount_cents: 53371 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/permits"
              payload: { order_id: "${ord}", cemetery_id: "${cem}", permit_number: "P-101", placement_date: "2026-03-20T00:00:00Z" }
              as: FieldOps
              captures: { permit: $.data.id }
            - call: "POST /memorials/permits/${permit}/issue"
              payload: {}
              as: FieldOps
            - call: "POST /memorials/installations"
              payload: { order_id: "${ord}", crew_id: "${cr}", scheduled_start: "2026-03-25T09:00:00Z", scheduled_end: "2026-03-25T11:00:00Z" }
              as: FieldOps
              captures: { inst: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-25T12:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /memorials/installations/${inst}/complete"
              payload: {}
              as: FieldOps
          assert:
            - "Installation.${inst}.status == COMPLETED"
            - "MonumentOrder.${ord}.production_status == INSTALLED"
            - "MonumentOrder.${ord}.warranty_expires_at == 2036-03-25T12:00:00Z"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_precedes_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_PROOF_NOT_SUBMITTED]
          - errors[ERR_DEPOSIT_NOT_PAID]
        distinguishing_aspect: |
          State (priority 6) precedes business_fiscal (priority 11): approving a DRAFT proof with the
          deposit unpaid returns ERR_PROOF_NOT_SUBMITTED, never ERR_DEPOSIT_NOT_PAID.
        test_recipe:
          setup:
            - "An order with a proof still in DRAFT (never submitted) and payment_status UNPAID."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "In Loving Memory", line_char_counts: [21, 31] }
              as: Designer
              captures: { proof: $.data.id }
          trigger:
            - call: "POST /memorials/design-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PROOF_NOT_SUBMITTED"
            - "Both violations hold (proof DRAFT not SUBMITTED, order UNPAID) yet the priority-6 state error is returned, not the priority-11 ERR_DEPOSIT_NOT_PAID"

      - name: install_temporal_precedes_referential
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_INSTALL_BEFORE_FAB_READY]
