# =============================================================================
# PRD Benchmark Scaffold — Family Entertainment Center & Arcade Card
# Difficulty tier: Expert
# =============================================================================

scenario: |
  578. Family Entertainment Center & Arcade Card (Dave & Buster's style):
  game-card/chip stored-value & reload, attraction & redemption-prize inventory,
  party/event package & room, food-beverage combo, membership & promo
  (eat-and-play), e-ticket/points & redemption, capacity & wristband, daily
  reconciliation

domain_name: arcade-card
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  # Peer top-level collections linked by foreign keys; no deep URL nesting.
  state_machine_shape: cyclic
  # PartyBooking loops CONFIRMED->DRAFT; Redemption forks RESERVED->{FULFILLED,
  # CANCELLED} with divergent side effects; DailyReconciliation branches on
  # computed variance.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  # Member (self-service) + four operational roles; Manager holds config +
  # reconciliation + override authority.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member contact email; unique among Members" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: promo_opt_in, type: boolean, source: input, default: false, description: "Whether member is enrolled in eat-and-play promotions" }
      - { name: lifetime_spend_cents, type: integer, source: computed, default: 0, description: "Cumulative reload amount in cents; only reload amount_cents accrues here (bonus credits do NOT), incremented AFTER each reload's tier lookup" }
      - { name: membership_tier, type: enum, source: computed, default: NONE, description: "NONE | SILVER | GOLD | PLATINUM — recomputed from lifetime_spend_cents after each reload", constraints: "NONE>=0, SILVER>=50000, GOLD>=200000, PLATINUM>=500000 (cents)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE on create; SUSPENDED reserved for future admin action" }

  - name: GameCard
    parent: null
    common_fields: true
    fields:
      - { name: owner_member_id, type: string, source: input, description: "FK -> Member.id; nullable — anonymous walk-in cards have no owner", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: INACTIVE, description: "INACTIVE | ACTIVE | FROZEN | CLOSED", constraints: "created INACTIVE" }
      - { name: chip_balance_cents, type: integer, source: computed, default: 0, description: "Purchased stored-value chip credits in cents; equals sum of CardLedgerEntry.chip_delta_cents for this card" }
      - { name: bonus_chip_balance_cents, type: integer, source: computed, default: 0, description: "Promotional/party-granted chip credits in cents; equals sum of CardLedgerEntry.bonus_delta_cents; spent before purchased chips (waterfall)" }
      - { name: ticket_points_balance, type: integer, source: computed, default: 0, description: "e-ticket points available for redemption; equals sum of CardLedgerEntry.points_delta" }

  - name: CardLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> GameCard.id; the card this immutable ledger line belongs to" }
      - { name: entry_type, type: enum, source: system, description: "RELOAD | BONUS_GRANT | GAMEPLAY_DEBIT | POINTS_EARN | POINTS_HOLD | POINTS_SETTLE | POINTS_REFUND | BONUS_CLAWBACK", constraints: "append-only" }
      - { name: chip_delta_cents, type: integer, source: system, default: 0, description: "Signed change to purchased chip balance in cents" }
      - { name: bonus_delta_cents, type: integer, source: system, default: 0, description: "Signed change to promotional chip balance in cents" }
      - { name: points_delta, type: integer, source: system, default: 0, description: "Signed change to e-ticket points balance" }
      - { name: business_day, type: string, source: system, description: "UTC calendar date (YYYY-MM-DD) the entry occurred, from the logical clock" }
      - { name: note, type: string, source: system, description: "Human-readable provenance, e.g. reload/gameplay/party-provision" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp when the entry was written" }

  - name: Attraction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Attraction/game name" }
      - { name: chip_cost_cents, type: integer, source: input, description: "Chip credits (cents) charged per play", constraints: ">0" }
      - { name: points_award, type: integer, source: input, description: "Base e-ticket points granted per play before member multiplier", constraints: ">=0" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | MAINTENANCE | RETIRED", constraints: "OPEN on create" }

  - name: PrizeItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Redemption prize name" }
      - { name: points_price, type: integer, source: input, description: "e-ticket points required per unit at the current moment", constraints: ">0" }
      - { name: stock_qty, type: integer, source: input, description: "Physical units on hand not yet reserved", constraints: ">=0" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Units held by RESERVED Redemptions; never exceeds stock_qty+reserved_qty invariant" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OUT_OF_STOCK | DISCONTINUED", constraints: "AVAILABLE on create; DISCONTINUED set via PATCH; OUT_OF_STOCK when stock_qty==0 after a PATCH sets it or via reprice" }

  - name: Redemption
    parent: null
    common_fields: true
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> GameCard.id; card whose points fund this redemption" }
      - { name: prize_item_id, type: string, source: input, description: "FK -> PrizeItem.id; prize being redeemed" }
      - { name: quantity, type: integer, source: input, description: "Units requested", constraints: ">0" }
      - { name: points_hold, type: integer, source: computed, description: "Provisional points debited at RESERVED time = prize.points_price(at reserve) * quantity" }
      - { name: points_settled, type: integer, source: computed, default: null, description: "Final points charged at FULFILLED time = prize.points_price(at fulfill) * quantity; null until fulfilled", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | FULFILLED | CANCELLED", constraints: "RESERVED on create" }

  - name: GamePlay
    parent: null
    common_fields: false
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> GameCard.id; card charged for the play" }
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id; attraction played" }
      - { name: chip_cost_cents, type: integer, source: computed, description: "Total chip cost snapshot = attraction.chip_cost_cents at play time" }
      - { name: chip_from_bonus_cents, type: integer, source: computed, description: "Portion drawn from bonus_chip_balance_cents (spent first)" }
      - { name: chip_from_stored_cents, type: integer, source: computed, description: "Portion drawn from chip_balance_cents (spent after bonus exhausted)" }
      - { name: points_awarded, type: integer, source: computed, description: "e-ticket points granted = floor(attraction.points_award * member tier multiplier)" }
      - { name: business_day, type: string, source: system, description: "UTC calendar date (YYYY-MM-DD) of the play from the logical clock" }

  - name: PartyPackage
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Party package name" }
      - { name: base_price_cents, type: integer, source: input, description: "Flat package price in cents", constraints: ">0" }
      - { name: included_guests, type: integer, source: input, description: "Guests covered by base_price before per-extra-guest surcharge", constraints: ">0" }
      - { name: included_hours, type: integer, source: input, description: "Room hours covered by base_price before overage", constraints: ">0" }
      - { name: included_chip_cents, type: integer, source: input, description: "Bonus chip credits (cents) loaded onto EACH provisioned guest card at confirm", constraints: ">=0" }
      - { name: tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD — marketing tier label" }
      - { name: combo_name, type: string, source: input, description: "Included food-beverage combo name (eat-and-play)" }
      - { name: combo_value_cents, type: integer, source: input, description: "Retail value of the included food-beverage combo in cents", constraints: ">=0" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Party room name" }
      - { name: capacity, type: integer, source: input, description: "Maximum guests the room physically seats", constraints: ">0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Overage rate (cents) per hour beyond package included_hours", constraints: ">=0" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | MAINTENANCE", constraints: "AVAILABLE on create" }

  - name: PartyBooking
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; room reserved for the party" }
      - { name: package_id, type: string, source: input, description: "FK -> PartyPackage.id; package purchased" }
      - { name: host_member_id, type: string, source: input, description: "FK -> Member.id; hosting member" }
      - { name: start_at, type: datetime, source: input, description: "Planned window start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Planned window end (ISO8601 UTC); must be strictly after start_at" }
      - { name: guest_count, type: integer, source: input, description: "Planned guest headcount", constraints: ">0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED", constraints: "DRAFT on create" }
      - { name: checked_in_at, type: datetime, source: system, default: null, description: "Logical-clock time of check-in; null until CHECKED_IN", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock time of completion; null until COMPLETED", constraints: "nullable" }
      - { name: provisional_total_cents, type: integer, source: computed, default: null, description: "Estimated charge computed at confirm (planned inputs); null before CONFIRMED", constraints: "nullable" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Settled charge computed at complete (actual inputs); null before COMPLETED", constraints: "nullable" }
      - { name: actual_guest_count, type: integer, source: computed, default: null, description: "Count of this booking's wristbands in {ISSUED,ACTIVE} at completion; null before COMPLETED", constraints: "nullable" }

  - name: Wristband
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> PartyBooking.id; nullable — walk-in wristbands have no booking", constraints: "nullable" }
      - { name: card_id, type: string, source: input, description: "FK -> GameCard.id; the card linked to this wristband; nullable for unlinked bands", constraints: "nullable" }
      - { name: band_code, type: string, source: system, description: "Server-minted human-readable band code" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | ACTIVE | RETURNED | VOID", constraints: "ISSUED on create" }

  - name: DailyReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: business_day, type: string, source: input, description: "UTC calendar date (YYYY-MM-DD) reconciled; unique across DailyReconciliations" }
      - { name: expected_chip_liability_cents, type: integer, source: computed, description: "Snapshot at open = sum over GameCards status IN {ACTIVE,FROZEN} of (chip_balance_cents + bonus_chip_balance_cents)" }
      - { name: expected_prize_units, type: integer, source: computed, description: "Snapshot at open = sum over PrizeItems status IN {AVAILABLE,OUT_OF_STOCK} of stock_qty" }
      - { name: counted_chip_liability_cents, type: integer, source: input, default: null, description: "Operator-entered physical chip liability count; null until counted", constraints: "nullable, >=0" }
      - { name: counted_prize_units, type: integer, source: input, default: null, description: "Operator-entered physical prize unit count; null until counted", constraints: "nullable, >=0" }
      - { name: variance_chip_cents, type: integer, source: computed, default: null, description: "counted_chip_liability_cents - expected_chip_liability_cents; null until counted", constraints: "nullable" }
      - { name: variance_prize_units, type: integer, source: computed, default: null, description: "counted_prize_units - expected_prize_units; null until counted", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RECONCILED | DISCREPANCY", constraints: "OPEN on create; branches to RECONCILED iff both variances==0 else DISCREPANCY on count" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GameCard
    initial_state: INACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /game-cards/{id}/activate"
        actor: Cashier
        preconditions: ["card.status == INACTIVE"]
        side_effects: ["card becomes spendable/reloadable"]
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /game-cards/{id}/freeze"
        actor: Manager
        preconditions: ["card.status == ACTIVE"]
        side_effects: ["reload / gameplay / redemption blocked while FROZEN"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /game-cards/{id}/close"
        actor: Cashier
        preconditions: ["card.status == ACTIVE"]
        side_effects: ["balances frozen; no further ledger entries"]
      - from: FROZEN
        to: CLOSED
        trigger: "POST /game-cards/{id}/close"
        actor: Cashier
        preconditions: ["card.status == FROZEN"]
        side_effects: ["balances frozen; no further ledger entries"]
    note: "reload/gameplay/redemption are operations valid only while status==ACTIVE; they are not state transitions. A lifecycle trigger (activate/freeze/close) attempted from a forbidden from-state returns ERR_INVALID_CARD_STATE (409)."

  - entity: Redemption
    initial_state: RESERVED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /redemptions"
        actor: Attendant
        preconditions:
          - "card.status == ACTIVE"
          - "prize.status == AVAILABLE"
          - "prize.stock_qty - prize.reserved_qty >= quantity"
          - "card.ticket_points_balance >= points_hold (= prize.points_price * quantity)"
          - "expected_card_version == card.version"
        side_effects:
          - "points_hold = prize.points_price * quantity (redemption_points_valuation, reserved variant)"
          - "GameCard.ticket_points_balance -= points_hold"
          - "append CardLedgerEntry(POINTS_HOLD, points_delta = -points_hold)"
          - "PrizeItem.reserved_qty += quantity"
          - "increments GameCard.version by 1"
      - from: RESERVED
        to: FULFILLED
        trigger: "POST /redemptions/{id}/fulfill"
        actor: Attendant
        preconditions:
          - "redemption.status == RESERVED"
          - "card.ticket_points_balance >= max(0, points_settled - points_hold)"
        side_effects:
          - "points_settled = prize.points_price(current) * quantity (redemption_points_valuation, settled variant)"
          - "GameCard.ticket_points_balance -= (points_settled - points_hold)"
          - "append CardLedgerEntry(POINTS_SETTLE, points_delta = -(points_settled - points_hold))"
          - "PrizeItem.reserved_qty -= quantity; PrizeItem.stock_qty -= quantity"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /redemptions/{id}/cancel"
        actor: Attendant
        preconditions: ["redemption.status == RESERVED"]
        side_effects:
          - "GameCard.ticket_points_balance += points_hold (full refund of the hold)"
          - "append CardLedgerEntry(POINTS_REFUND, points_delta = +points_hold)"
          - "PrizeItem.reserved_qty -= quantity (stock_qty unchanged)"

  - entity: PartyBooking
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /party-bookings/{id}/confirm"
        actor: Coordinator
        preconditions:
          - "booking.status == DRAFT"
          - "no other non-CANCELLED PartyBooking on the same room_id has a half-open [start_at,end_at) window overlapping this booking's window (resource_room_overlap)"
          - "guest_count <= room.capacity"
          - "sum of guest_count over CONFIRMED/CHECKED_IN bookings whose window overlaps this window + this guest_count <= MAX_VENUE_OCCUPANCY (venue_occupancy_overlap)"
        side_effects:
          - "provisional_total_cents = party_booking_charge(provisional variant)"
          - "CASCADE hop1: for i in 1..guest_count create Wristband(status=ISSUED, booking_id=this)"
          - "CASCADE hop2: each new Wristband provisions a fresh GameCard(status=ACTIVE) and links Wristband.card_id to it"
          - "CASCADE hop3: each provisioned GameCard is granted included_chip_cents bonus -> append CardLedgerEntry(BONUS_GRANT, bonus_delta=+included_chip_cents); GameCard.bonus_chip_balance_cents += included_chip_cents"
      - from: CONFIRMED
        to: DRAFT
        trigger: "POST /party-bookings/{id}/revert-to-draft"
        actor: Coordinator
        preconditions: ["booking.status == CONFIRMED"]
        side_effects:
          - "release room window reservation"
          - "CASCADE hop1: each Wristband of this booking -> status=VOID"
          - "CASCADE hop2: each VOID Wristband's linked GameCard -> bonus clawback of included_chip_cents"
          - "CASCADE hop3: append CardLedgerEntry(BONUS_CLAWBACK, bonus_delta=-included_chip_cents); GameCard.bonus_chip_balance_cents -= included_chip_cents"
          - "provisional_total_cents reset to null"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /party-bookings/{id}/check-in"
        actor: Cashier
        preconditions:
          - "booking.status == CONFIRMED"
          - "room.status == AVAILABLE (not MAINTENANCE)"
          - "start_at <= clock_now < end_at"
        side_effects:
          - "checked_in_at = clock_now"
          - "each Wristband of this booking -> status=ACTIVE"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /party-bookings/{id}/complete"
        actor: Coordinator
        preconditions: ["booking.status == CHECKED_IN"]
        side_effects:
          - "completed_at = clock_now"
          - "actual_guest_count = count of this booking's Wristbands in {ISSUED,ACTIVE}"
          - "final_total_cents = party_booking_charge(final variant)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /party-bookings/{id}/cancel"
        actor: Coordinator
        preconditions: ["booking.status == DRAFT"]
        side_effects: ["no wristbands exist yet; booking closed"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /party-bookings/{id}/cancel"
        actor: Coordinator
        preconditions: ["booking.status == CONFIRMED"]
        side_effects:
          - "release room window reservation"
          - "CASCADE hop1: each Wristband of this booking -> status=VOID"
          - "CASCADE hop2: each VOID Wristband's linked GameCard -> bonus clawback of included_chip_cents"
          - "CASCADE hop3: append CardLedgerEntry(BONUS_CLAWBACK, bonus_delta=-included_chip_cents); GameCard.bonus_chip_balance_cents -= included_chip_cents"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /party-bookings/{id}/cancel"
        actor: Coordinator
        preconditions: ["booking.status == CHECKED_IN"]
        side_effects:
          - "release room window reservation"
          - "CASCADE hop1: each Wristband of this booking -> status=VOID"
          - "CASCADE hop2: each VOID Wristband's linked GameCard -> bonus clawback of included_chip_cents"
          - "CASCADE hop3: append CardLedgerEntry(BONUS_CLAWBACK, bonus_delta=-included_chip_cents); GameCard.bonus_chip_balance_cents -= included_chip_cents"

  - entity: Wristband
    initial_state: ISSUED
    terminal_states: [RETURNED, VOID]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /party-bookings/{id}/wristbands (or cascade from confirm)"
        actor: Cashier
        preconditions:
          - "booking.status IN {CONFIRMED, CHECKED_IN}"
          - "expected_booking_version == booking.version"
          - "count of {ISSUED,ACTIVE} wristbands on booking < room.capacity"
        side_effects:
          - "band_code minted"
          - "increments PartyBooking.version by 1"
      - from: ISSUED
        to: ACTIVE
        trigger: "cascade from PartyBooking check-in"
        actor: system
        preconditions: ["wristband.status == ISSUED", "booking.status transitions to CHECKED_IN"]
        side_effects: ["wristband usable on floor"]
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /wristbands/{id}/return"
        actor: Cashier
        preconditions: ["wristband.status == ACTIVE"]
        side_effects: ["wristband decommissioned; linked card unaffected"]
      - from: ISSUED
        to: VOID
        trigger: "cascade from PartyBooking revert-to-draft / cancel"
        actor: system
        preconditions: ["wristband.status == ISSUED"]
        side_effects: ["linked GameCard bonus clawback (see PartyBooking cascade)"]
      - from: ACTIVE
        to: VOID
        trigger: "cascade from PartyBooking cancel"
        actor: system
        preconditions: ["wristband.status == ACTIVE"]
        side_effects: ["linked GameCard bonus clawback (see PartyBooking cascade)"]

  - entity: DailyReconciliation
    initial_state: OPEN
    terminal_states: [RECONCILED, DISCREPANCY]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /daily-reconciliations"
        actor: Manager
        preconditions:
          - "no existing DailyReconciliation for the same business_day"
        side_effects:
          - "expected_chip_liability_cents = daily_reconciliation snapshot (chip)"
          - "expected_prize_units = daily_reconciliation snapshot (prize)"
      - from: OPEN
        to: RECONCILED
        trigger: "POST /daily-reconciliations/{id}/count"
        actor: Manager
        preconditions:
          - "recon.status == OPEN"
          - "variance_chip_cents == 0 AND variance_prize_units == 0"
        side_effects:
          - "variance_chip_cents = counted_chip_liability_cents - expected_chip_liability_cents"
          - "variance_prize_units = counted_prize_units - expected_prize_units"
      - from: OPEN
        to: DISCREPANCY
        trigger: "POST /daily-reconciliations/{id}/count"
        actor: Manager
        preconditions:
          - "recon.status == OPEN"
          - "variance_chip_cents != 0 OR variance_prize_units != 0"
        side_effects:
          - "variance_chip_cents = counted_chip_liability_cents - expected_chip_liability_cents"
          - "variance_prize_units = counted_prize_units - expected_prize_units"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version — true CREATE/consume races)
# =============================================================================
concurrency_rules:
  - rule_id: redemption-create-stale-card
    parent_entity: GameCard
    write_endpoint: "POST /redemptions"
    occ_field: "expected_card_version"
    description: |
      Creating a Redemption against a GameCard whose version has advanced since
      the client last observed it is rejected. A prior redemption (or gameplay)
      already consumed points on the same card and bumped its version, so the
      current writer's view of the card — and of the points available to hold —
      is stale. Both redemptions would otherwise legitimately succeed under the
      product's natural points-spend semantics, so only a stale-version check
      resolves it deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: wristband-issue-stale-booking
    parent_entity: PartyBooking
    write_endpoint: "POST /party-bookings/{id}/wristbands"
    occ_field: "expected_booking_version"
    description: |
      Issuing an extra Wristband against a PartyBooking whose version has advanced
      since the client last observed it is rejected. Another writer already added
      a wristband (consuming room/venue headcount and bumping the booking version),
      so the current writer's view of remaining headcount is stale. Under natural
      semantics both issues would succeed while headroom exists, so a stale-version
      check is the only deterministic resolution.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: party_booking_charge
    trigger: "PartyBooking confirm (provisional) and complete (final)"
    algorithm: forward_looking
    formula: |
      per_extra_guest_cents = PER_EXTRA_GUEST_CENTS
      # PROVISIONAL (at confirm, planned inputs):
      planned_hours = ceil((end_at - start_at) / 1 hour)
      extra_guests_p = max(0, guest_count - package.included_guests)
      overage_hours_p = max(0, planned_hours - package.included_hours)
      provisional_total_cents = package.base_price_cents
                              + extra_guests_p * PER_EXTRA_GUEST_CENTS
                              + overage_hours_p * room.hourly_rate_cents
      # FINAL (at complete, actual inputs):
      actual_hours = ceil((completed_at - checked_in_at) / 1 hour)
      extra_guests_f = max(0, actual_guest_count - package.included_guests)
      overage_hours_f = max(0, actual_hours - package.included_hours)
      final_total_cents = package.base_price_cents
                        + extra_guests_f * PER_EXTRA_GUEST_CENTS
                        + overage_hours_f * room.hourly_rate_cents
    input_set: "One PartyBooking + its PartyPackage + its Room; provisional uses planned guest_count and [start_at,end_at); final uses actual_guest_count (ISSUED/ACTIVE wristbands) and [checked_in_at,completed_at)."
    constants:
      PER_EXTRA_GUEST_CENTS: 1500
    precision: "integer cents; hour counts use ceil (partial hour rounds up)"
    variants:
      - name: provisional
        when: "PartyBooking confirm"
        difference: "planned guest_count and booked window; written to provisional_total_cents"
      - name: final
        when: "PartyBooking complete"
        difference: "actual_guest_count and check-in..complete window; written to final_total_cents; diverges from provisional when actuals differ from plan"

  - name: card_reload_credit
    trigger: "POST /game-cards/{id}/reload"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED (circular-looking: bonus depends on tier,
      # tier depends on lifetime_spend which this reload mutates).
      # STEP 1 — tier lookup on the PRE-reload lifetime_spend_cents:
      tier_at_reload = tier_of(member.lifetime_spend_cents)   # BEFORE adding amount_cents
      bonus_pct = BONUS_PCT[tier_at_reload]
      # STEP 2 — bonus computed from pre-reload tier:
      bonus_cents = floor(amount_cents * bonus_pct)
      # STEP 3 — apply purchased credit + bonus:
      chip_balance_cents += amount_cents
      bonus_chip_balance_cents += bonus_cents
      # STEP 4 — accrue spend AFTER bonus, then recompute stored tier:
      member.lifetime_spend_cents += amount_cents
      member.membership_tier = tier_of(member.lifetime_spend_cents)  # POST-reload
      # tier_of(s): PLATINUM if s>=500000; GOLD if s>=200000; SILVER if s>=50000; else NONE
    input_set: "One reload amount_cents against one GameCard's owner Member."
    constants:
      SILVER_THRESHOLD_CENTS: 50000
      GOLD_THRESHOLD_CENTS: 200000
      PLATINUM_THRESHOLD_CENTS: 500000
      BONUS_PCT: { NONE: 0.0, SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.20 }
    precision: "floor on bonus_cents; integer cents; tier thresholds are >= (inclusive)"
    variants:
      - name: anonymous_card
        when: "card.owner_member_id is null"
        difference: "no member => tier NONE => bonus 0; lifetime_spend not accrued"

  - name: gameplay_settlement
    trigger: "POST /game-plays"
    algorithm: waterfall_allocation
    formula: |
      cost = attraction.chip_cost_cents
      require: card.bonus_chip_balance_cents + card.chip_balance_cents >= cost   # >= inclusive
      chip_from_bonus_cents = min(card.bonus_chip_balance_cents, cost)
      remainder = cost - chip_from_bonus_cents
      chip_from_stored_cents = remainder
      card.bonus_chip_balance_cents -= chip_from_bonus_cents
      card.chip_balance_cents -= chip_from_stored_cents
      mult = TIER_MULTIPLIER[member.membership_tier]   # NONE if anonymous
      points_awarded = floor(attraction.points_award * mult)
      card.ticket_points_balance += points_awarded
      append CardLedgerEntry(GAMEPLAY_DEBIT, chip_delta=-chip_from_stored_cents, bonus_delta=-chip_from_bonus_cents, points_delta=+points_awarded)
    input_set: "One GameCard + one Attraction; balances split bonus-first then stored (waterfall)."
    constants:
      TIER_MULTIPLIER: { NONE: 1.0, SILVER: 1.1, GOLD: 1.25, PLATINUM: 1.5 }
    precision: "floor on points_awarded; integer cents"
    variants:
      - name: bonus_only
        when: "bonus_chip_balance_cents >= cost"
        difference: "chip_from_stored_cents == 0; stored balance untouched"

  - name: redemption_points_valuation
    trigger: "Redemption create (reserved) and fulfill (settled)"
    algorithm: aggregation
    formula: |
      # RESERVED variant (at create): price snapshot at reserve time
      points_hold = prize.points_price[at_reserve] * quantity
      # SETTLED variant (at fulfill): price snapshot at fulfill time
      points_settled = prize.points_price[at_fulfill] * quantity
      settlement_delta = points_settled - points_hold   # extra debit (or refund if negative) at fulfill
    input_set: "One Redemption + its PrizeItem; hold uses price at RESERVED, settled uses price at FULFILLED (diverges if PrizeItem was repriced between)."
    constants: {}
    precision: "integer points"
    variants:
      - name: reserved
        when: "Redemption create"
        difference: "uses prize.points_price at reserve; written to points_hold"
      - name: settled
        when: "Redemption fulfill"
        difference: "uses prize.points_price at fulfill; written to points_settled; delta applied to card"

  - name: daily_reconciliation
    trigger: "DailyReconciliation open (expected snapshot) and count (variance)"
    algorithm: aggregation
    formula: |
      # OPEN snapshot:
      expected_chip_liability_cents = SUM over GameCard where status IN {ACTIVE,FROZEN}
                                        of (chip_balance_cents + bonus_chip_balance_cents)
      expected_prize_units = SUM over PrizeItem where status IN {AVAILABLE,OUT_OF_STOCK}
                               of stock_qty
      # COUNT:
      variance_chip_cents = counted_chip_liability_cents - expected_chip_liability_cents
      variance_prize_units = counted_prize_units - expected_prize_units
      status = RECONCILED if (variance_chip_cents == 0 AND variance_prize_units == 0) else DISCREPANCY
    input_set: "All GameCards in {ACTIVE,FROZEN} and PrizeItems in {AVAILABLE,OUT_OF_STOCK} at open; CLOSED cards and DISCONTINUED prizes are excluded."
    constants: {}
    precision: "integer cents / integer units; variance==0 boundary is exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7; Member acting on a card/booking must own it (X-User-ID == owner_member_id / host_member_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and body FK references an existing resource, validated left-to-right in the path then body"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, quantity>0, guest_count>0, amount_cents>0, and for bookings end_at strictly after start_at"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "GameCard must be ACTIVE for reload/gameplay/redemption; FROZEN card -> ERR_CARD_FROZEN, INACTIVE/CLOSED card -> ERR_CARD_NOT_ACTIVE"
    error_id: ERR_CARD_FROZEN
    http_status: 409
    applies_to: "POST /game-cards/{id}/reload, POST /game-plays, POST /redemptions"
  - priority: 5
    category: state
    check: "GameCard is INACTIVE or CLOSED when an ACTIVE-only operation is attempted"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /game-cards/{id}/reload, POST /game-plays, POST /redemptions"
  - priority: 6
    category: state
    check: "target entity is in a state whose transition table permits this trigger (Redemption RESERVED for fulfill/cancel; PartyBooking from-state for each transition; Wristband ACTIVE for return; Reconciliation OPEN for count)"
    error_id: "ERR_INVALID_<ENTITY>_STATE"
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 7
    category: business_referential
    check: "Attraction must be OPEN for gameplay; PrizeItem must be AVAILABLE for redemption"
    error_id: ERR_ATTRACTION_NOT_OPEN
    http_status: 409
    applies_to: "POST /game-plays"
  - priority: 7
    category: business_referential
    check: "PrizeItem must be AVAILABLE (not OUT_OF_STOCK/DISCONTINUED) for a new redemption"
    error_id: ERR_PRIZE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /redemptions"
  - priority: 7
    category: business_referential
    check: "Room must be AVAILABLE (not MAINTENANCE) at party check-in"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /party-bookings/{id}/check-in"
  - priority: 8
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /redemptions, POST /party-bookings/{id}/wristbands"
  - priority: 9
    category: business_temporal
    check: "party check-in only when start_at <= clock_now < end_at"
    error_id: ERR_OUTSIDE_BOOKING_WINDOW
    http_status: 409
    applies_to: "POST /party-bookings/{id}/check-in"
  - priority: 9
    category: business_temporal
    check: "on confirm, booking window [start_at,end_at) must not overlap another non-CANCELLED booking on the same room (adjacency end==start allowed)"
    error_id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /party-bookings/{id}/confirm"
  - priority: 10
    category: business_constraint
    check: "on confirm, guest_count must be <= room.capacity"
    error_id: ERR_GUEST_COUNT_EXCEEDS_ROOM
    http_status: 409
    applies_to: "POST /party-bookings/{id}/confirm"
  - priority: 10
    category: business_constraint
    check: "on confirm, aggregate overlapping guests must not exceed MAX_VENUE_OCCUPANCY"
    error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /party-bookings/{id}/confirm"
  - priority: 10
    category: business_constraint
    check: "redemption quantity must not exceed prize available units (stock_qty - reserved_qty)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /redemptions"
  - priority: 11
    category: business_fiscal
    check: "gameplay: bonus+stored chip balance must cover attraction.chip_cost_cents"
    error_id: ERR_INSUFFICIENT_CHIP_BALANCE
    http_status: 402
    applies_to: "POST /game-plays"
  - priority: 11
    category: business_fiscal
    check: "redemption: card ticket_points_balance must cover points_hold (reserve) / settlement delta (fulfill)"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 402
    applies_to: "POST /redemptions, POST /redemptions/{id}/fulfill"
  - priority: 11
    category: business_fiscal
    check: "reload: resulting chip_balance_cents must not exceed CARD_BALANCE_CAP_CENTS (100000)"
    error_id: ERR_CARD_BALANCE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /game-cards/{id}/reload"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Manager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

  # --- Attractions ---
  - method: POST
    path: "/attractions"
    description: "Create an attraction (OPEN)."
    roles: [Manager]
    code: 201
    input: [name, chip_cost_cents, points_award]
    output: Attraction
    side_effects: ["status=OPEN"]
  - method: PATCH
    path: "/attractions/{id}"
    description: "Update attraction status/pricing."
    roles: [Manager]
    code: 200
    input: ["status?", "chip_cost_cents?", "points_award?"]
    output: Attraction
    side_effects: ["mutates attraction; increments Attraction.version by 1"]
  - method: GET
    path: "/attractions/{id}"
    description: "Read attraction."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: []
    output: Attraction
    side_effects: []

  # --- Prize items ---
  - method: POST
    path: "/prize-items"
    description: "Create a redemption prize (AVAILABLE)."
    roles: [Manager]
    code: 201
    input: [name, points_price, stock_qty]
    output: PrizeItem
    side_effects: ["status=AVAILABLE"]
  - method: PATCH
    path: "/prize-items/{id}"
    description: "Reprice / restock / discontinue a prize."
    roles: [Manager]
    code: 200
    input: ["status?", "points_price?", "stock_qty?"]
    output: PrizeItem
    side_effects: ["mutates prize; increments PrizeItem.version by 1"]
  - method: GET
    path: "/prize-items/{id}"
    description: "Read prize item."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: []
    output: PrizeItem
    side_effects: []

  # --- Party packages ---
  - method: POST
    path: "/party-packages"
    description: "Create a party package (includes food-beverage combo)."
    roles: [Manager]
    code: 201
    input: [name, base_price_cents, included_guests, included_hours, included_chip_cents, tier, combo_name, combo_value_cents]
    output: PartyPackage
    side_effects: []

  # --- Rooms ---
  - method: POST
    path: "/rooms"
    description: "Create a party room (AVAILABLE)."
    roles: [Manager]
    code: 201
    input: [name, capacity, hourly_rate_cents]
    output: Room
    side_effects: ["status=AVAILABLE"]
  - method: PATCH
    path: "/rooms/{id}"
    description: "Set room status (AVAILABLE/MAINTENANCE)."
    roles: [Manager]
    code: 200
    input: ["status?"]
    output: Room
    side_effects: ["mutates room; increments Room.version by 1"]
  - method: GET
    path: "/rooms/{id}"
    description: "Read room."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: []
    output: Room
    side_effects: []

  # --- Members ---
  - method: POST
    path: "/members"
    description: "Register a member (ACTIVE, tier NONE)."
    roles: [Cashier, Manager]
    code: 201
    input: [email, full_name, "promo_opt_in?"]
    output: Member
    side_effects: ["status=ACTIVE; membership_tier=NONE; lifetime_spend_cents=0"]
  - method: GET
    path: "/members/{id}"
    description: "Read member (includes tier and lifetime_spend_cents)."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: []
    output: Member
    side_effects: []

  # --- Game cards ---
  - method: POST
    path: "/game-cards"
    description: "Issue a new stored-value game card (INACTIVE)."
    roles: [Cashier]
    code: 201
    input: ["owner_member_id?"]
    output: GameCard
    side_effects: ["status=INACTIVE; balances 0"]
  - method: GET
    path: "/game-cards/{id}"
    description: "Read a game card (balances + version)."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: []
    output: GameCard
    side_effects: []
  - method: GET
    path: "/game-cards"
    description: "List game cards; filterable by owner and status."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: ["owner_member_id?", "status?", "limit?", "offset?"]
    output: GameCard[]
    side_effects: []
  - method: POST
    path: "/game-cards/{id}/activate"
    description: "Activate an INACTIVE card."
    roles: [Cashier]
    code: 200
    input: []
    output: GameCard
    side_effects: ["status INACTIVE->ACTIVE; increments GameCard.version by 1"]
  - method: POST
    path: "/game-cards/{id}/reload"
    description: "Reload stored value; grants tier-based promo bonus (card_reload_credit)."
    roles: [Cashier]
    code: 200
    input: [amount_cents, "promo_code?"]
    output: GameCard
    side_effects: ["chip_balance_cents += amount_cents; bonus_chip_balance_cents += bonus; member lifetime_spend_cents/tier updated; append CardLedgerEntry(RELOAD) and CardLedgerEntry(BONUS_GRANT) if bonus>0; increments GameCard.version by 1"]
  - method: POST
    path: "/game-cards/{id}/freeze"
    description: "Freeze an ACTIVE card (blocks spend/reload)."
    roles: [Manager]
    code: 200
    input: []
    output: GameCard
    side_effects: ["status ACTIVE->FROZEN; increments GameCard.version by 1"]
  - method: POST
    path: "/game-cards/{id}/close"
    description: "Close an ACTIVE or FROZEN card (terminal)."
    roles: [Cashier, Manager]
    code: 200
    input: []
    output: GameCard
    side_effects: ["status->CLOSED; increments GameCard.version by 1"]
  - method: GET
    path: "/game-cards/{id}/ledger"
    description: "List the card's immutable ledger entries (reverse-reachability for CardLedgerEntry.card_id)."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: CardLedgerEntry[]
    side_effects: []

  # --- Game plays ---
  - method: POST
    path: "/game-plays"
    description: "Play an attraction; waterfall chip debit + points award (gameplay_settlement)."
    roles: [Attendant, Member]
    code: 201
    input: [card_id, attraction_id]
    output: GamePlay
    side_effects: ["card bonus-then-stored chip debited; ticket_points_balance += points_awarded; append CardLedgerEntry(GAMEPLAY_DEBIT); increments GameCard.version by 1"]
  - method: GET
    path: "/game-plays/{id}"
    description: "Read a game play."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: []
    output: GamePlay
    side_effects: []
  - method: GET
    path: "/game-plays"
    description: "List game plays; filterable by card and attraction."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: ["card_id?", "attraction_id?", "limit?", "offset?"]
    output: GamePlay[]
    side_effects: []

  # --- Redemptions ---
  - method: POST
    path: "/redemptions"
    description: "Reserve a prize redemption (OCC on card version)."
    roles: [Attendant, Member]
    code: 201
    input: [card_id, prize_item_id, quantity, expected_card_version]
    output: Redemption
    side_effects: ["points_hold computed & held; ticket_points_balance -= points_hold; PrizeItem.reserved_qty += quantity; append CardLedgerEntry(POINTS_HOLD); increments GameCard.version by 1"]
  - method: GET
    path: "/redemptions/{id}"
    description: "Read a redemption."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: []
    output: Redemption
    side_effects: []
  - method: GET
    path: "/redemptions"
    description: "List redemptions; filterable by card and prize."
    roles: [Member, Cashier, Attendant, Coordinator, Manager]
    code: 200
    input: ["card_id?", "prize_item_id?", "status?", "limit?", "offset?"]
    output: Redemption[]
    side_effects: []
  - method: POST
    path: "/redemptions/{id}/fulfill"
    description: "Fulfill a RESERVED redemption; settle at current price (redemption_points_valuation settled)."
    roles: [Attendant]
    code: 200
    input: []
    output: Redemption
    side_effects: ["points_settled computed; ticket_points_balance -= (settled-hold); PrizeItem.stock_qty -= quantity; reserved_qty -= quantity; append CardLedgerEntry(POINTS_SETTLE)"]
  - method: POST
    path: "/redemptions/{id}/cancel"
    description: "Cancel a RESERVED redemption; release the points hold and prize reservation."
    roles: [Attendant]
    code: 200
    input: []
    output: Redemption
    side_effects: ["ticket_points_balance += points_hold; PrizeItem.reserved_qty -= quantity; append CardLedgerEntry(POINTS_REFUND)"]

  # --- Party bookings ---
  - method: POST
    path: "/party-bookings"
    description: "Create a party booking (DRAFT)."
    roles: [Coordinator]
    code: 201
    input: [room_id, package_id, host_member_id, start_at, end_at, guest_count]
    output: PartyBooking
