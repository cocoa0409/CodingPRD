  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cycle_approval_gated_by_addendum_state
        grounds:
          - state_machines.AssessmentCycle.RISK_ACCEPTANCE_REVIEW_to_APPROVED
          - state_machines.ContractAddendum.REQUIRED_to_DRAFTED
          - errors[ERR_OPEN_ITEMS_OUTSTANDING]
        distinguishing_aspect: |
          Entity pair AssessmentCycle -> ContractAddendum: a cycle cannot
          transition RISK_ACCEPTANCE_REVIEW -> APPROVED while any of its
          ContractAddenda is still REQUIRED or DRAFTED; only SIGNED or WAIVED
          addenda unblock approval.
        test_recipe:
          setup:
            - "Cycle in RISK_ACCEPTANCE_REVIEW with zero open exceptions, one RiskAcceptance APPROVED, and a REQUIRED ContractAddendum (TIER_3 vendor with HIGH exception => clause set includes C_REMEDIATION_TIMELINE)"
