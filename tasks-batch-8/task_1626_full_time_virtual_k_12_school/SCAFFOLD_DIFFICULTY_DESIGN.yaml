            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/proctor-assignments"
              payload: { student_id: "${student_id}", assessment_window_id: "${window_id}", test_site_id: "${site_id}", expected_test_site_version: "${site_v}" }
              as: ProctorCoordinator
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /vks/proctor-assignments/${pa_id}/mark-completed"
              payload: {}
              as: ProctorCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_ASSESSMENT_WINDOW_NOT_OPEN"
            - "ProctorAssignment.${pa_id}.assignment_status == BOOKED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: proctor_seat_capacity_per_window
        grounds:
          - calculations.test_site_seat_check
          - entities.TestSite.fields.seat_capacity
        distinguishing_aspect: |
          Interval semantics: seat capacity is an aggregate slot-count over
          a discrete window, NOT a half-open time-interval arithmetic. A
          booking is rejected iff seats_booked + 1 > seat_capacity at the
          moment of the request. The "interval" is the window lifecycle —
          the seat becomes free again only via CANCEL.
        test_recipe:
          setup:
            - "TestSite with seat_capacity=1"
            - "Student S1 booked at site (seats_booked=1)"
            - "Student S2 ENROLLED, awaiting a seat"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-070", state_code: "WA", funding_rate_cents: 400, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/test-sites"
              payload: { site_name: "Seattle Site", state_code: "WA", seat_capacity: 1 }
              as: ProctorCoordinator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /vks/assessment-windows"
              payload: { assessment_name: "Fall Math", subject: "MATH", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T17:00:00Z" }
              as: ProctorCoordinator
              captures: { w1_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Ruth", date_of_birth: "2012-11-11T00:00:00Z", grade_level: 7, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { s1_id: $.data.id }
            - call: "POST /vks/students/${s1_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s1_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${s1_id}/enroll"
              payload: { expected_student_version: "${s1_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/proctor-assignments"
              payload: { student_id: "${s1_id}", assessment_window_id: "${w1_id}", test_site_id: "${site_id}", expected_test_site_version: "${site_v0}" }
              as: ProctorCoordinator
            - call: "GET /vks/test-sites/${site_id}"
              payload: {}
              as: ProctorCoordinator
              captures: { site_v1: $.data.version }
            - call: "POST /vks/students"
              payload: { legal_name: "Sam", date_of_birth: "2012-12-12T00:00:00Z", grade_level: 7, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { s2_id: $.data.id }
            - call: "POST /vks/students/${s2_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s2_v: $.data.version }
            - call: "POST /vks/students/${s2_id}/enroll"
              payload: { expected_student_version: "${s2_v}" }
              as: EnrollmentOfficer
          trigger:
            - call: "POST /vks/proctor-assignments"
              payload: { student_id: "${s2_id}", assessment_window_id: "${w1_id}", test_site_id: "${site_id}", expected_test_site_version: "${site_v1}" }
              as: ProctorCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_NO_SEAT_AVAILABLE"
      - name: teacher_caseload_as_aggregate_capacity
        grounds:
          - calculations.teacher_caseload_check
          - entities.Teacher.fields.caseload_cap
        distinguishing_aspect: |
          Interval semantics differ from the seat-capacity rule: caseload is
          an aggregate over the open-ended ASSIGNED state dimension, not a
          per-window slot. Once a teacher hits caseload_cap, NO additional
          assignment can be added until one is ended — the "occupancy" is
          the duration of the ASSIGNED status, a different geometric
          treatment than the discrete per-window slot occupancy of a test
          site.
        test_recipe:
          setup:
            - "Teacher T with caseload_cap=2, certified in CA"
            - "Two students S1, S2 in CA districts, already ENROLLED and ASSIGNED to T"
            - "Third student S3 also ENROLLED, awaiting assignment"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-071", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/teachers"
