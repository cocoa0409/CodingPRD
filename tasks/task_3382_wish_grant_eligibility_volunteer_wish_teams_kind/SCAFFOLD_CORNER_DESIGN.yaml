# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: wish-grant eligibility, volunteer wish teams & in-kind sourcing
# Breadth probe across the claim-extraction-guide taxonomy. Claims already
# covered by a 1.8 instance are emitted as excluded_because stubs.
# Logical clock default: 2026-09-01T00:00:00Z.
# Canonical child: dob 2016-03-10 -> 125 complete months at 2026-09-01
# (eligible; visit-method band 72..155 -> PLAY_BASED or DRAWING).
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: chapter_create_applies_computed_defaults
        claim_type: creation
        grounds: ["entities.Chapter.fields.committed_cost_cents", "entities.Chapter.fields.posture"]
        distinguishing_aspect: "A new chapter starts with all aggregates zeroed and posture OPEN; system fields id/created_at/version are server-minted (version == 1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "GET /wish-grant/chapters/${ch_id}"
              as: NationalAdmin
          assert:
            - "Chapter.${ch_id}.committed_cost_cents == 0"
            - "Chapter.${ch_id}.granted_wish_count == 0 and granted_cost_total_cents == 0 and granted_cash_total_cents == 0"
            - "Chapter.${ch_id}.avg_cost_blended_cents == 0 and avg_cost_cash_cents == 0"
            - "Chapter.${ch_id}.posture == OPEN and version == 1 and created_at is present"

      - name: child_chapter_assignment_longest_prefix_then_created_at
        claim_type: computed_fields
        grounds: ["calculations.territory_assignment", "entities.Child.fields.chapter_id"]
        distinguishing_aspect: "Territory selector: zip 90012 matches C1 (prefix 900, length 3), C2 (prefix 90, length 2), and C3 (prefix 900, length 3); longest match wins, ties break by created_at ASC, so the child lands on C1."
        test_recipe:
          setup: ["Three chapters with overlapping prefixes created in order C1 [900], C2 [90], C3 [900]."]
          setup_api_calls:
            - call: "POST /wish-grant/chapters"
              payload: { name: "C1", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /wish-grant/chapters"
              payload: { name: "C2", territory_zip_prefixes: ["90"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /wish-grant/chapters"
              payload: { name: "C3", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 3000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id, child_id: $.data.child_id }
          trigger:
            - call: "GET /wish-grant/children/${child_id}"
              as: EligibilityReviewer
          assert:
            - "Child.${child_id}.chapter_id == ${c1_id} (longest prefix 3 beats 2; tie 3==3 broken by created_at ASC, not by id)"

      - name: referral_create_computes_age_and_initial_state
        claim_type: computed_fields
        grounds: ["entities.Referral.fields.age_months_at_intake", "entities.Referral.fields.status"]
        distinguishing_aspect: "Referral creation computes age_months_at_intake == 125 for dob 2016-03-10 at the 2026-09-01 clock and starts in PENDING_CERTIFICATION with wish_id null."
        test_recipe:
          setup: ["Chapter covering 900xx; clock at default."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id }
          trigger:
            - call: "GET /wish-grant/referrals/${ref_id}"
              as: EligibilityReviewer
          assert:
            - "Referral.${ref_id}.age_months_at_intake == 125"
            - "Referral.${ref_id}.status == PENDING_CERTIFICATION and wish_id is null and qualifying_condition is null"

      - name: child_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET of a well-formed but non-existent child id returns the error envelope with ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /wish-grant/children/00000000-0000-4000-8000-000000000000"
              as: WishCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404; error envelope has response_type == error and meta.api_request_id present"

      - name: referral_create_missing_required_child_dob_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required child_date_of_birth fails with 400 ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup: ["Chapter exists (not reached: priority 4 fires first)."]
          setup_api_calls: []
          trigger:
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "No Dob", child_zip_code: "90012", parent_email: "x@example.org", diagnosis_summary: "x", source_type: "FAMILY" }
              as: ReferralSource
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: chapter_create_extra_field_input_ignored
        claim_type: system_fields
        grounds: ["entities.Chapter"]
        distinguishing_aspect: "Unknown request fields are ignored: POST /chapters with a bogus extra field still succeeds and the stored entity has no such field."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000, bogus_field: "zzz" }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "GET /wish-grant/chapters/${ch_id}"
              as: NationalAdmin
          assert:
            - "creation returned 201 and the stored Chapter has no bogus_field key"

      - name: donation_offer_computed_quantities_on_create
        claim_type: computed_fields
        grounds: ["entities.DonationOffer.fields.quantity_available", "entities.DonationOffer.fields.fmv_unit_cents"]
        distinguishing_aspect: "New offer: quantity_reserved 0, quantity_available == quantity_total, status AVAILABLE, fmv_unit_cents == unit_retail_cents under RETAIL_BASIS."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /wish-grant/donation-offers"
              payload: { partner_name: "ToyWorld", category: "RETAILER", valuation_method: "RETAIL_BASIS", description: "toy truck", quantity_total: 10, unit_retail_cents: 12000, valid_from: "2026-08-01", valid_until: "2026-12-31" }
              as: InKindOfficer
              captures: { offer_id: $.data.id }
          trigger:
            - call: "GET /wish-grant/donation-offers/${offer_id}"
              as: InKindOfficer
          assert:
            - "DonationOffer.${offer_id}.quantity_reserved == 0 and quantity_available == 10"
            - "DonationOffer.${offer_id}.fmv_unit_cents == 12000 and status == AVAILABLE"

      - name: volunteer_create_initial_state_applied
        claim_type: initial_state
        grounds: ["state_machines.Volunteer"]
        distinguishing_aspect: "New volunteers start APPLIED with version 1."
        test_recipe:
          setup: ["Chapter exists."]
          setup_api_calls:
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Nina Park", email: "nina@example.org" }
              as: WishCoordinator
              captures: { v1_id: $.data.id }
          trigger:
            - call: "GET /wish-grant/volunteers/${v1_id}"
              as: WishCoordinator
          assert:
            - "Volunteer.${v1_id}.status == APPLIED and version == 1"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: volunteer_transition_skip_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Volunteer.APPLIED_to_TRAINED", "validations[priority=5]"]
        distinguishing_aspect: "APPLIED -> ACTIVE directly is not a declared transition; the endpoint only accepts the exact next state."
        test_recipe:
          setup: ["Chapter; volunteer v1 APPLIED."]
          setup_api_calls:
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Nina Park", email: "nina@example.org" }
              as: WishCoordinator
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_VOLUNTEER_STATE (409); Volunteer.${v1_id}.status stays APPLIED"

      - name: referral_state_guards_and_terminal_lockdown
        claim_type: invalid_transition
        grounds: ["state_machines.Referral", "validations[priority=6]"]
        distinguishing_aspect: "determine before certify, certify twice, and determine after APPROVED (terminal) are each rejected with ERR_INVALID_REFERRAL_STATE; the legal path in between succeeds."
        test_recipe:
          setup: ["Chapter; one referral in PENDING_CERTIFICATION."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { err_early: $.data.error_id }
            - call: "POST /wish-grant/referrals/${ref_id}/certify"
              payload: { qualifying_condition: "ONCOLOGY" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref_id}/certify"
              payload: { qualifying_condition: "CARDIAC" }
              as: MedicalProvider
              captures: { err_twice: $.data.error_id }
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish_id: $.data.wish_id }
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "DENIED", denial_reason: "late" }
              as: EligibilityReviewer
              captures: { err_terminal: $.data.error_id }
          assert:
            - "err_early == ERR_INVALID_REFERRAL_STATE (determine requires CERTIFIED)"
            - "err_twice == ERR_INVALID_REFERRAL_STATE (certify requires PENDING_CERTIFICATION)"
            - "the APPROVED determination succeeded and created Wish.${wish_id} with status CREATED"
            - "err_terminal == ERR_INVALID_REFERRAL_STATE (APPROVED is terminal)"

      - name: certify_non_qualifying_auto_denies_referral
        claim_type: side_effect_execution
        grounds: ["state_machines.Referral.PENDING_CERTIFICATION_to_DENIED"]
        distinguishing_aspect: "certify with NON_QUALIFYING bypasses CERTIFIED and lands directly in DENIED with system-set denial_reason CONDITION_NOT_QUALIFYING; no wish is created."
        test_recipe:
          setup: ["Chapter; referral PENDING_CERTIFICATION."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /wish-grant/referrals/${ref_id}/certify"
              payload: { qualifying_condition: "NON_QUALIFYING", certification_note: "not life-threatening" }
              as: MedicalProvider
          assert:
            - "Referral.${ref_id}.status == DENIED"
            - "Referral.${ref_id}.denial_reason == CONDITION_NOT_QUALIFYING"
            - "Referral.${ref_id}.wish_id is null and determined_at is set"

      - name: visit_conclude_guards_and_terminal_lockdown
        claim_type: invalid_transition
        grounds: ["state_machines.WishVisit", "validations[priority=9]"]
        distinguishing_aspect: "conclude COMPLETED without captured fields -> 400; a proper conclude succeeds; concluding the COMPLETED visit again -> ERR_INVALID_VISIT_STATE (terminal lockdown)."
        test_recipe:
          setup: ["Wish DETERMINATION_PENDING with ACTIVE team and one SCHEDULED visit."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Nina Park", email: "nina@example.org" }
              as: WishCoordinator
              captures: { v1_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Owen Diaz", email: "owen@example.org" }
              as: WishCoordinator
              captures: { v2_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "POST /wish-grant/referrals/${ref_id}/certify"
              payload: { qualifying_condition: "ONCOLOGY" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish_id: $.data.wish_id }
            - call: "GET /wish-grant/wishes/${wish_id}"
              as: WishCoordinator
              captures: { wish_v1: $.data.version }
            - call: "POST /wish-grant/wish-teams"
              payload: { wish_id: "${wish_id}", lead_volunteer_id: "${v1_id}", second_volunteer_id: "${v2_id}", expected_wish_version: "${wish_v1}" }
              as: WishCoordinator
              captures: { team_id: $.data.id }
            - call: "POST /wish-grant/wish-visits"
              payload: { wish_team_id: "${team_id}", scheduled_start: "2026-09-05T09:00:00Z", scheduled_end: "2026-09-05T11:00:00Z", visit_method: "PLAY_BASED" }
              as: Volunteer
              as_user_id: "${v1_id}"
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /wish-grant/wish-visits/${visit_id}/conclude"
              payload: { outcome: "COMPLETED", captured_true_wish: "a treehouse" }
              as: Volunteer
              as_user_id: "${v1_id}"
              captures: { err_missing: $.data.error_id }
            - call: "POST /wish-grant/wish-visits/${visit_id}/conclude"
              payload: { outcome: "COMPLETED", captured_true_wish: "a treehouse", captured_wish_type: "RECEIVE_ITEM" }
              as: Volunteer
              as_user_id: "${v1_id}"
            - call: "POST /wish-grant/wish-visits/${visit_id}/conclude"
              payload: { outcome: "NO_SHOW" }
              as: Volunteer
              as_user_id: "${v1_id}"
              captures: { err_again: $.data.error_id }
          assert:
            - "err_missing == ERR_INVALID_REQUEST (captured_wish_type required when outcome == COMPLETED)"
            - "the complete conclude succeeds: visit COMPLETED, wish DETERMINED with wish_type RECEIVE_ITEM, team COMPLETED"
            - "err_again == ERR_INVALID_VISIT_STATE (COMPLETED is terminal)"

      - name: visit_no_show_keeps_wish_and_team_active
        claim_type: side_effect_execution
        grounds: ["state_machines.WishVisit.SCHEDULED_to_NO_SHOW"]
        distinguishing_aspect: "A NO_SHOW conclusion touches only the visit: the wish stays DETERMINATION_PENDING and the team stays ACTIVE so a replacement visit can be scheduled and completed."
        test_recipe:
          setup: ["Wish DETERMINATION_PENDING with ACTIVE team and one SCHEDULED visit."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Nina Park", email: "nina@example.org" }
              as: WishCoordinator
              captures: { v1_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Owen Diaz", email: "owen@example.org" }
              as: WishCoordinator
              captures: { v2_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "POST /wish-grant/referrals/${ref_id}/certify"
              payload: { qualifying_condition: "ONCOLOGY" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish_id: $.data.wish_id }
            - call: "GET /wish-grant/wishes/${wish_id}"
              as: WishCoordinator
              captures: { wish_v1: $.data.version }
            - call: "POST /wish-grant/wish-teams"
              payload: { wish_id: "${wish_id}", lead_volunteer_id: "${v1_id}", second_volunteer_id: "${v2_id}", expected_wish_version: "${wish_v1}" }
              as: WishCoordinator
              captures: { team_id: $.data.id }
            - call: "POST /wish-grant/wish-visits"
              payload: { wish_team_id: "${team_id}", scheduled_start: "2026-09-05T09:00:00Z", scheduled_end: "2026-09-05T11:00:00Z", visit_method: "PLAY_BASED" }
              as: Volunteer
              as_user_id: "${v1_id}"
              captures: { visit1_id: $.data.id }
          trigger:
            - call: "POST /wish-grant/wish-visits/${visit1_id}/conclude"
              payload: { outcome: "NO_SHOW" }
              as: Volunteer
              as_user_id: "${v1_id}"
            - call: "POST /wish-grant/wish-visits"
              payload: { wish_team_id: "${team_id}", scheduled_start: "2026-09-06T09:00:00Z", scheduled_end: "2026-09-06T11:00:00Z", visit_method: "DRAWING" }
              as: Volunteer
              as_user_id: "${v2_id}"
              captures: { visit2_id: $.data.id }
            - call: "POST /wish-grant/wish-visits/${visit2_id}/conclude"
              payload: { outcome: "COMPLETED", captured_true_wish: "a treehouse", captured_wish_type: "RECEIVE_ITEM" }
              as: Volunteer
              as_user_id: "${v2_id}"
          assert:
            - "after NO_SHOW: WishVisit.${visit1_id}.status == NO_SHOW, team still ACTIVE, wish still DETERMINATION_PENDING"
            - "a fresh visit on the same team succeeds and completes: Wish.${wish_id}.status == DETERMINED, wish_type == RECEIVE_ITEM, determined_at set to the logical clock date 2026-09-01"

      - name: team_supersede_disbands_and_cancels_scheduled_visits
        claim_type: side_effect_execution
