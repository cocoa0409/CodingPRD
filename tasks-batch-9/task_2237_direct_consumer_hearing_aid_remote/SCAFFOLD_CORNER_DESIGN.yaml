            - { call: "POST /patients/${pat_pc}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_pc}", captures: { scr_pc: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_pc}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_pc}" }
