  - rule_id: resource_temporal_overlap
    instances:

      - name: badge_window_overlap_rejected_while_adjacent_window_is_legal
        grounds:
          - validations.priority_28_ERR_REP_BADGE_WINDOW_CONFLICT
          - calculations.badge_validity_window
          - state_machines.CaseRepAuthorization.REQUESTED_to_APPROVED
          - entities.CaseRepAuthorization.fields.badge_window_start_utc
          - entities.CaseRepAuthorization.fields.badge_window_end_utc
          - entities.VendorRep.fields.open_authorization_count
        distinguishing_aspect: |
          HALF-OPEN interval semantics on a single-holder resource (one rep's presence), with adjacency
          explicitly legal: window [07:00, 12:30) and window [12:30, 16:30) touch at one instant and
          BOTH are approved, while [12:00, 15:30) genuinely overlaps the first by 30 minutes and is
          refused with ERR_REP_BADGE_WINDOW_CONFLICT (409). Treating the windows as closed intervals
          would wrongly reject the adjacent pair.
        test_recipe:
          setup:
            - "Facility RT-15 keeps the default badge_lead_minutes 60 and badge_grace_minutes 30."
            - "Rep Ada Cole of Vendor TEMPO is CREDENTIALED with four credentials VERIFIED to 2027-07-01T00:00:00Z."
            - "Case C3 runs 2026-09-22T08:00:00Z to 12:00:00Z, so its badge window is [07:00:00Z, 12:30:00Z)."
            - "Case C4 runs 2026-09-22T13:30:00Z to 16:00:00Z, so its badge window is [12:30:00Z, 16:30:00Z) — exactly adjacent to C3's window."
            - "Case C5 runs 2026-09-22T13:00:00Z to 15:00:00Z, so its badge window is [12:00:00Z, 15:30:00Z), which overlaps C3's window on [12:00, 12:30)."
            - "C3 and C4 are approved (proving adjacency is legal); C5's authorization is created and left REQUESTED."
            - "Two approvals against BASE_QUOTA 4 leave the hard cap of 6 untouched, so no quota interaction can mask the conflict."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Ridgetop Surgical Hospital", code: "RT-15", spd_turnaround_hours: 6, spd_bay_count: 3 }
