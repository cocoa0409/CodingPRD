              as: PlatformAdmin
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "FACILITIES_STUDY" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/studies"
              payload: { phase: "FACILITIES", window_start: "2027-01-05T00:00:00Z", window_end: "2027-02-15T00:00:00Z" }
              as: OriginationManager
              captures: { s3: $.data.id }
            - call: "POST /api/interconnection-studies/${s3}/transitions"
              payload: { to: "IN_PROGRESS" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${s3}/transitions"
              payload: { to: "DELIVERED" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${s3}/transitions"
              payload: { to: "ACCEPTED" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "AGREEMENT_EXECUTED" }
              as: OriginationManager
            - call: "GET /api/projects/${p}"
              as: DeveloperAdmin
              captures: { pv: $.data.version }
            - call: "POST /api/projects/${p}/offtake-agreements"
              payload: { buyer_type: "UTILITY", base_price_usd_mwh: 44.00, escalator_pct: 2.0, term_years: 20, delivery_start_date: "2028-01-01T00:00:00Z", expected_project_version: "${pv}" }
              as: OriginationManager
              captures: { oa: $.data.id }
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "EXECUTED" }
              as: OriginationManager
          trigger:
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "READY_FOR_CONSTRUCTION" }
              as: DeveloperAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "EFFECTIVE" }
              as: OriginationManager
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "READY_FOR_CONSTRUCTION" }
              as: DeveloperAdmin
          assert:
            - "First project transition fails: ${err1} == ERR_OFFTAKE_REQUIRED (EXECUTED is not EFFECTIVE)"
            - "After the offtake reaches EFFECTIVE, the identical project transition succeeds: Project.${p}.status == READY_FOR_CONSTRUCTION"

      - name: safe_harbor_confirm_requires_executed_supply_agreement
        grounds:
          - state_machines.ProcurementOrder.DEPOSIT_PAID_to_SAFE_HARBOR_QUALIFIED
          - errors[ERR_SUPPLY_AGREEMENT_NOT_EXECUTED]
        distinguishing_aspect: |
          A different entity pair (ProcurementOrder -> SupplyAgreement): the order
          confirm is gated on the PARENT supply agreement's lifecycle state, and
          the gate re-opens mid-cycle — an agreement sent to AMENDMENT_PENDING
          still satisfies it (amendment holds execution) while DRAFT does not.
        test_recipe:
          setup:
            - "Project P; supply agreement SA in DRAFT; PO under SA with 120,000.00 deposit"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Ref Gate Farm", technology: "WIND", target_capacity_mw: 55, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/supply-agreements"
              payload: { equipment_type: "TURBINE", supplier_name: "Nordex", total_contract_usd: 3000000 }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 2400000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2400000 }
              as: ProcurementLead
              captures: { po: $.data.id }
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 120000.00 }
              as: ProcurementLead
          trigger:
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
              captures: { err1: $.data.error_id }
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "AMENDMENT_PENDING", amendment_total_contract_usd: 3200000 }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
          assert:
            - "First confirm fails: ${err1} == ERR_SUPPLY_AGREEMENT_NOT_EXECUTED (parent still DRAFT)"
            - "After EXECUTED -> AMENDMENT_PENDING the confirm succeeds (AMENDMENT_PENDING still counts as executed): ProcurementOrder.${po}.status == SAFE_HARBOR_QUALIFIED"
            - "SupplyAgreement.${sa}.amendment_count == 0 (amendment not yet re-executed)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: parcel_half_open_adjacency_allowed
        grounds:
          - state_machines.SiteControlInstrument.DRAFT_to_EXECUTED
          - errors[ERR_PARCEL_OVERLAP]
          - entities.SiteControlInstrument.fields.start_date
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the SiteControlInstrument
          resource — an instrument beginning exactly at another's end_date is
          adjacent, not overlapping, and executes cleanly; one day earlier fails.
        test_recipe:
          setup:
            - "Project P; instrument A EXECUTED on parcel PCL-H1 covering [2026-09-01, 2027-09-01)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Parcel Farm", technology: "SOLAR", target_capacity_mw: 30, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/site-control-instruments"
              payload: { parcel_id: "PCL-H1", instrument_type: "LAND_OPTION", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z", exercise_price_usd: 40000 }
              as: DeveloperAdmin
              captures: { a: $.data.id }
            - call: "POST /api/site-control-instruments/${a}/transitions"
              payload: { to: "EXECUTED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/site-control-instruments"
              payload: { parcel_id: "PCL-H1", instrument_type: "EASEMENT", start_date: "2027-09-01T00:00:00Z", end_date: "2047-09-01T00:00:00Z", exercise_price_usd: 5000 }
              as: DeveloperAdmin
              captures: { b: $.data.id }
            - call: "POST /api/projects/${p}/site-control-instruments"
              payload: { parcel_id: "PCL-H1", instrument_type: "EASEMENT", start_date: "2027-08-31T00:00:00Z", end_date: "2047-08-31T00:00:00Z", exercise_price_usd: 5000 }
              as: DeveloperAdmin
              captures: { c: $.data.id }
          trigger:
            - call: "POST /api/site-control-instruments/${b}/transitions"
              payload: { to: "EXECUTED" }
              as: DeveloperAdmin
            - call: "POST /api/site-control-instruments/${c}/transitions"
              payload: { to: "EXECUTED" }
              as: DeveloperAdmin
              captures: { err_c: $.data.error_id }
          assert:
            - "Instrument ${b} (start == A.end_date) executes: status == EXECUTED (half-open adjacency is not overlap)"
            - "Instrument ${c} (one day earlier) fails: ${err_c} == ERR_PARCEL_OVERLAP and status remains DRAFT"

      - name: study_window_closed_interval_with_buffer
        grounds:
          - errors[ERR_STUDY_WINDOW_CONFLICT]
          - endpoints: "POST /api/interconnection-requests/{request_id}/studies"
        distinguishing_aspect: |
          Different resource (InterconnectionStudy on a cluster) with different
          interval semantics: CLOSED intervals plus a 5-calendar-day buffer — a
          new window starting exactly 5 days after a prior window's end
          (2027-03-15 vs end 2027-03-10) conflicts, while 6 days after is clean.
        test_recipe:
          setup:
            - "Project P1 with request in cluster CL-S and an IN_PROGRESS SYSTEM_IMPACT study window [2027-02-01, 2027-03-10]; project P2 with a second request in the same cluster"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Study Farm 1", technology: "WIND", target_capacity_mw: 80, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Study Farm 2", technology: "WIND", target_capacity_mw: 70, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p2: $.data.id }
            - call: "POST /api/projects/${p1}/interconnection-requests"
              payload: { cluster_id: "CL-S", requested_capacity_mw: 80 }
              as: OriginationManager
              captures: { r1: $.data.id }
            - call: "POST /api/projects/${p2}/interconnection-requests"
              payload: { cluster_id: "CL-S", requested_capacity_mw: 70 }
              as: OriginationManager
              captures: { r2: $.data.id }
            - call: "POST /api/interconnection-requests/${r1}/transitions"
              payload: { to: "FEASIBILITY_STUDY" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${r1}/studies"
              payload: { phase: "SYSTEM_IMPACT", window_start: "2027-02-01T00:00:00Z", window_end: "2027-03-10T00:00:00Z" }
              as: OriginationManager
          trigger:
            - call: "POST /api/interconnection-requests/${r2}/studies"
              payload: { phase: "SYSTEM_IMPACT", window_start: "2027-03-15T00:00:00Z", window_end: "2027-04-15T00:00:00Z" }
              as: OriginationManager
              captures: { err1: $.data.error_id }
            - call: "POST /api/interconnection-requests/${r2}/studies"
              payload: { phase: "SYSTEM_IMPACT", window_start: "2027-03-16T00:00:00Z", window_end: "2027-04-16T00:00:00Z" }
              as: OriginationManager
          assert:
            - "First create fails: ${err1} == ERR_STUDY_WINDOW_CONFLICT (2027-03-15 <= 2027-03-10 + 5 days buffer)"
            - "Second create succeeds: a start of 2027-03-16 is strictly beyond the buffered end"

  - rule_id: compensating_invariant
    instances:
      - name: queue_position_permutation_conserved
        grounds:
          - calculations.queue_reseat
          - state_machines.InterconnectionRequest.*_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: the SET of active queue positions. Withdrawal of the
          head and a fresh creation are compensating actions — the active set is
          exactly {1,2,3} before, {1,2} after withdrawal (sum 3), and {1,2,3}
          again after the new request takes 3; no gap or duplicate ever persists.
        test_recipe:
          setup:
            - "Cluster CL-I with three active requests at positions 1, 2, 3"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Perm Farm 1", technology: "WIND", target_capacity_mw: 50, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Perm Farm 2", technology: "WIND", target_capacity_mw: 60, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p2: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Perm Farm 3", technology: "SOLAR", target_capacity_mw: 70, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p3: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Perm Farm 4", technology: "SOLAR", target_capacity_mw: 40, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p4: $.data.id }
            - call: "POST /api/projects/${p1}/interconnection-requests"
              payload: { cluster_id: "CL-I", requested_capacity_mw: 50 }
              as: OriginationManager
              captures: { r1: $.data.id }
            - call: "POST /api/projects/${p2}/interconnection-requests"
              payload: { cluster_id: "CL-I", requested_capacity_mw: 60 }
              as: OriginationManager
              captures: { r2: $.data.id }
            - call: "POST /api/projects/${p3}/interconnection-requests"
              payload: { cluster_id: "CL-I", requested_capacity_mw: 70 }
              as: OriginationManager
              captures: { r3: $.data.id }
          trigger:
            - call: "POST /api/interconnection-requests/${r1}/transitions"
              payload: { to: "WITHDRAWN" }
              as: OriginationManager
            - call: "POST /api/projects/${p4}/interconnection-requests"
              payload: { cluster_id: "CL-I", requested_capacity_mw: 40 }
              as: OriginationManager
              captures: { r4: $.data.id, r4_pos: $.data.queue_position }
          assert:
            - "After withdrawal: active positions are exactly {${r2}: 1, ${r3}: 2} — sum == 3 == 2*3/2 and the withdrawn request's queue_position == 0"
            - "After the compensating creation: ${r4_pos} == 3 (max active + 1 over the compacted set) and the active set is a permutation of {1,2,3} again"

      - name: credit_allocation_sum_invariant
        grounds:
          - calculations.waterfall_distribution
          - calculations.itc_credit_amount
          - entities.PartnershipLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          A different conserved quantity (dollars of tax credit, not queue
          positions): across every distribution run — pre-flip at 99/1 and
          post-flip at 5/95 — the two CREDIT_ALLOCATION entry types always sum
          exactly to Project.total_itc_credits_usd; the rounding remainder always
          lands in the developer tier so no cent is created or destroyed.
        test_recipe:
          setup:
            - "Project at COD with total_itc_credits_usd == 5,000,000.00; partnership fully funded and PRE_FLIP_OPERATING (chain as in waterfall_per_tier_rounding_mode_b); flip elected after the first run"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Invariant Farm", technology: "SOLAR", target_capacity_mw: 200, resource_class: "A", energy_community_eligible: true, domestic_content_certified: true }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/site-control-instruments"
              payload: { parcel_id: "PCL-I1", instrument_type: "EASEMENT", start_date: "2026-09-01T00:00:00Z", end_date: "2046-09-01T00:00:00Z", exercise_price_usd: 50000 }
              as: DeveloperAdmin
              captures: { sc: $.data.id }
            - call: "POST /api/site-control-instruments/${sc}/transitions"
              payload: { to: "EXECUTED" }
              as: DeveloperAdmin
            - call: "POST /api/site-control-instruments/${sc}/transitions"
              payload: { to: "EXERCISED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "SITE_SECURED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/interconnection-requests"
              payload: { cluster_id: "CL-IV", requested_capacity_mw: 200 }
              as: OriginationManager
              captures: { ir: $.data.id }
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "DEVELOPMENT" }
