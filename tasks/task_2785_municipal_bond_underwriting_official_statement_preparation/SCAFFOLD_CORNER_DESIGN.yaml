              as_user_id: "${ma_firm_id}"
              captures: { deal_u_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_u_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_u_id}/submit-structure"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          trigger:
            - call: "GET /bond-offerings/deals/${deal_c_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bond-offerings/deals/${deal_c_id}/designate-sale-method"
              payload: { sale_method: "COMPETITIVE" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_n_id}/designate-sale-method"
              payload: { sale_method: "NEGOTIATED" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "GET /bond-offerings/deals/${deal_u_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "first call: HTTP 200 with requires_notice_of_sale false and requires_g17_letter false, the declared defaults, before any designation"
            - "second call: HTTP 200, Deal.${deal_c_id}.requires_notice_of_sale == true, requires_g17_letter == false, gross_spread_basis == COMPETITIVE_BID and status PRICING_COMPETITIVE"
            - "third call: HTTP 200, Deal.${deal_n_id}.requires_g17_letter == true, requires_notice_of_sale == false, gross_spread_basis == NEGOTIATED_SPREAD and status PRICING_NEGOTIATED"
            - "fourth call: HTTP 200, the never-designated deal still reports both flags false and sale_method UNDETERMINED, so absence of the fork means absence of both features"
            - "the two designated deals disagree on both flags, so neither flag is a constant"

  # ===========================================================================
  # SECTION 9 - CONSISTENCY MODEL
  # ===========================================================================
  - section: consistency model
    instances:

      - name: computed_fields_are_visible_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model immediate
          - entities[Issuer].disclosure_risk_score, entities[MaturityTranche].price_to_maturity_pct / reoffering_price_pct, entities[Deal].gross_spread_usd / net_proceeds_usd
        distinguishing_aspect: |
          Every computed field must already be correct in the body of the request that caused it -
          not on a later re-read. The instance checks that at three different layers in one run:
          the issuer's weighted score in the POST /issuers response, the tranche's price variants
          in the POST /maturity-tranches response, and the whole money set in the POST /price
          response. A follow-up GET must return byte-identical values, which is what separates an
          immediate model from an eventual one where the write response would lag.
          The pricing chain is replayed rather than re-derived here.
          The 5,000,000 par at 5.000 coupon / 4.250 yield is the same fixture used elsewhere so the
          expected numbers are the pinned ones.
        test_recipe:
          setup:
            - "Firms MA0001 and AU0001 exist."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "Riverside Authority", state_code: "OH", entity_type: "AUTHORITY", prior_late_annual_filings: 0, prior_late_event_notices: 3, has_prior_material_event: false }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "GET /bond-offerings/issuers/${issuer_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "GET /bond-offerings/maturity-tranches/${t1_id}"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          assert:
            - "first call: HTTP 201 and the CREATE response body already carries disclosure_risk_score == 39, computed from 15 + 8*3, with no second request needed"
            - "second call: HTTP 200 with disclosure_risk_score == 39, identical to the create response"
            - "fourth call: HTTP 201 and the CREATE response body already carries periods_to_maturity == 20, price_to_maturity_pct == 106.058, price_to_call_pct == null, reoffering_price_pct == 106.058 and is_priced_to_call == false"
            - "fifth call: HTTP 200 with the same five computed values, so nothing was back-filled asynchronously"

      - name: cascade_effects_are_visible_without_advancing_the_clock
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model immediate
          - state_machines[CreditEnhancement] COMMITTED -> WITHDRAWN side effects
        distinguishing_aspect: |
          A cascade is the hardest case for an immediate model because the write touches entities
          the caller never named. Here one enhancement-withdraw call reaches the tranche's
          is_insured / rating_basis and the deal's enhanced-rating fields, and every one of those
          must be observable by a GET issued immediately afterwards with the logical clock left
          untouched - no clock advance, no re-post, no retry loop. Distinct from the OCC instances,
          which are about rejecting writes; this one is about the visibility of accepted ones.
        test_recipe:
          setup:
            - "A STRUCTURING deal with one 5,000,000 tranche T1 and a COMMITTED BOND_INSURANCE enhancement naming T1."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/credit-enhancements"
              payload: { provider_name: "Keystone Assurance", enhancement_type: "BOND_INSURANCE", enhanced_rating: "AA2", premium_bps: 45, insured_tranche_ids: ["${t1_id}"] }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { enh_id: $.data.id }
            - call: "POST /bond-offerings/credit-enhancements/${enh_id}/commit"
              payload: {}
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "GET /bond-offerings/maturity-tranches/${t1_id}"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          trigger:
            - call: "POST /bond-offerings/credit-enhancements/${enh_id}/withdraw"
              payload: { withdrawal_reason: "Provider downgraded before pricing." }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "GET /bond-offerings/maturity-tranches/${t1_id}"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
          assert:
            - "the setup GET shows MaturityTranche.${t1_id}.is_insured == true and rating_basis == ENHANCED after the commit, itself proving the commit cascade was immediate"
            - "the withdraw call returns HTTP 200 with status WITHDRAWN"
            - "the GET issued right after the withdraw, with no POST /bond-offerings/_clock/set_current_utc in between, shows is_insured == false and rating_basis == UNDERLYING"
            - "the deal GET in the same uninterrupted sequence shows credit_enhancement_premium_usd == 0.00 with net_proceeds_usd recomputed, so no field required a delayed re-read to settle"
