          assert:
            - "first DISALLOWED ruling without ruling_reason rejected ERR_INVALID_REQUEST (400)"
            - "with ruling_reason, q1.ruling == DISALLOWED"
            - "close-cross-exam with q2 still PENDING rejected ERR_PENDING_QUESTIONS_REMAIN (422)"
            - "after ruling q2 ALLOWED, close-cross-exam succeeds: Hearing.${hr_id}.status == DELIBERATION and Case.${case_id}.status == DELIBERATION"

