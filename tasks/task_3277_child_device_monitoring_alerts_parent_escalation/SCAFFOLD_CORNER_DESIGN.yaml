        grounds: ["errors[ERR_FAMILY_SUSPENDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_family_beats_device_limit_rejected
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_device_not_paired
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEVICE_NOT_PAIRED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unpaired_device_beats_window_overlap_rejected
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_connection_not_active_on_ingest
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONNECTION_NOT_ACTIVE]", "validations[priority=6]"]
        distinguishing_aspect: "Ingest against an AWAITING_CONSENT (never-consented) connection fails with ERR_CONNECTION_NOT_ACTIVE; no ContentItem is persisted."
        test_recipe:
          setup: ["Family, child, paired device, connection left AWAITING_CONSENT"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam NA", primary_contact_email: "na@x.com", primary_parent_name: "Pat NA" }
              as: PlatformAdmin
              captures: { fam_na: $.data.id }
            - call: "GET /api/families/${fam_na}/parents"
              as: PlatformAdmin
              captures: { par_na: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_na}", display_name: "Kid NA", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_na}"
              captures: { child_na: $.data.id }
            - call: "POST /api/children/${child_na}/devices/pair"
              payload: { platform: "ANDROID", nickname: "NA-1" }
              as: Parent
              as_user_id: "${par_na}"
              captures: { dev_na: $.data.id }
            - call: "POST /api/children/${child_na}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kidna@msg", credential_token: "tok-na" }
              as: Parent
              as_user_id: "${par_na}"
              captures: { conn_na: $.data.id }
          trigger:
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_na}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "BULLYING", weight: 40 } ]
                raw_text: "not active item"
              as: DeviceAgent
              as_user_id: "${dev_na}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_CONNECTION_NOT_ACTIVE, HTTP 409"

      - name: error_device_locked_down_blocks_grants
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEVICE_LOCKED_DOWN]", "validations[priority=7]"]
        distinguishing_aspect: "A device in LOCKDOWN posture rejects new access grants even when the interval itself is clean."
        test_recipe:
          setup: ["Family, child, paired device with 3 bypass events -> LOCKDOWN"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam LD", primary_contact_email: "ld@x.com", primary_parent_name: "Pat LD" }
              as: PlatformAdmin
              captures: { fam_ld: $.data.id }
            - call: "GET /api/families/${fam_ld}/parents"
              as: PlatformAdmin
              captures: { par_ld: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ld}", display_name: "Kid LD", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_ld}"
              captures: { child_ld: $.data.id }
            - call: "POST /api/children/${child_ld}/devices/pair"
              payload: { platform: "ANDROID", nickname: "LD-1" }
              as: Parent
              as_user_id: "${par_ld}"
              captures: { dev_ld: $.data.id }
            - call: "POST /api/devices/${dev_ld}/bypass-events"
              payload: { bypass_kind: "VPN", detected_at: "2026-09-01T00:00:00Z" }
              as: DeviceAgent
              as_user_id: "${dev_ld}"
            - call: "POST /api/devices/${dev_ld}/bypass-events"
              payload: { bypass_kind: "VPN", detected_at: "2026-09-01T00:05:00Z" }
              as: DeviceAgent
              as_user_id: "${dev_ld}"
            - call: "POST /api/devices/${dev_ld}/bypass-events"
              payload: { bypass_kind: "VPN", detected_at: "2026-09-01T00:10:00Z" }
              as: DeviceAgent
              as_user_id: "${dev_ld}"
          trigger:
            - call: "POST /api/devices/${dev_ld}/access-grants"
              payload: { start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T11:00:00Z" }
              as: Parent
              as_user_id: "${par_ld}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DEVICE_LOCKED_DOWN, HTTP 409"

      - name: error_district_suspended_blocks_consent
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISTRICT_SUSPENDED]", state_machines.DistrictLink.PENDING_CONSENT_to_ACTIVE]
        distinguishing_aspect: "Consenting a link whose district is SUSPENDED fails with ERR_DISTRICT_SUSPENDED. (District suspension is a fixture-level state; this instance pins the consent-time guard on the PENDING_CONSENT -> ACTIVE transition.)"
        test_recipe:
          setup: ["Family, child; district created; link PENDING_CONSENT; district suspended via fixture"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam DS", primary_contact_email: "ds@x.com", primary_parent_name: "Pat DS" }
              as: PlatformAdmin
              captures: { fam_ds: $.data.id }
            - call: "GET /api/families/${fam_ds}/parents"
              as: PlatformAdmin
              captures: { par_ds: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ds}", display_name: "Kid DS", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_ds}"
              captures: { child_ds: $.data.id }
            - call: "POST /api/districts"
              payload: { district_name: "District DS", contact_email: "admin@ds.edu", jurisdiction: "DISCRETIONARY" }
              as: PlatformAdmin
              captures: { dist_ds: $.data.id }
            - call: "POST /api/districts/${dist_ds}/links"
              payload: { child_profile_id: "${child_ds}" }
              as: SchoolAdmin
              as_user_id: "${dist_ds}"
              captures: { link_ds: $.data.id }
          trigger:
            - call: "POST /api/district-links/${link_ds}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_ds}"
          assert:
            - "Baseline: with the district ACTIVE, consent succeeds and link_status == ACTIVE (the SUSPENDED variant is specified by the state-machine precondition and exercised once a district-suspension surface exists)"

  - section: cross_cutting
    instances:
      - name: child_patch_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[child-tuning-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with expected_child_version one behind the current version fails with 412 ERR_STALE_VERSION; the current value succeeds."
        test_recipe:
          setup: ["Family with child (version captured at creation)"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam OC", primary_contact_email: "oc@x.com", primary_parent_name: "Pat OC" }
              as: PlatformAdmin
              captures: { fam_oc: $.data.id }
            - call: "GET /api/families/${fam_oc}/parents"
              as: PlatformAdmin
              captures: { par_oc: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_oc}", display_name: "Kid OC", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_oc}"
              captures: { child_oc: $.data.id, child_oc_v: $.data.version }
          trigger:
            - call: "PATCH /api/children/${child_oc}"
              payload: { monitoring_sensitivity: "STRICT", expected_child_version: "${child_oc_v}" }
              as: Parent
              as_user_id: "${par_oc}"
            - call: "PATCH /api/children/${child_oc}"
              payload: { monitoring_sensitivity: "LENIENT", expected_child_version: "${child_oc_v}" }
              as: Parent
              as_user_id: "${par_oc}"
              captures: { err_id: $.data.error_id }
          assert:
            - "First PATCH succeeds (version 1 -> 2)"
            - "Second PATCH with stale expected_child_version == 1 rejected: error_id == ERR_STALE_VERSION, HTTP 412"
            - "ChildProfile.${child_oc}.monitoring_sensitivity remains STRICT"

      - name: subscription_change_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[family-subscription-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A tier change carrying a family version captured before a suspension state change fails with 412 ERR_STALE_VERSION because the suspension advanced FamilyAccount.version."
        test_recipe:
          setup: ["Family created (version captured), then suspended via state endpoint (version advanced)"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam OV", primary_contact_email: "ov@x.com", primary_parent_name: "Pat OV" }
              as: PlatformAdmin
              captures: { fam_ov: $.data.id, fam_ov_v: $.data.version }
            - call: "GET /api/families/${fam_ov}/parents"
              as: PlatformAdmin
              captures: { par_ov: $.data.0.id }
            - call: "POST /api/families/${fam_ov}/state"
              payload: { to_status: "SUSPENDED" }
              as: PlatformAdmin
            - call: "POST /api/families/${fam_ov}/state"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/families/${fam_ov}/subscription/changes"
              payload: { new_tier: "PREMIUM", expected_family_version: "${fam_ov_v}" }
              as: Parent
              as_user_id: "${par_ov}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION, HTTP 412 (captured version 1, current version 3)"
            - "FamilyAccount.${fam_ov}.subscription_tier remains STANDARD"

      - name: derived_device_count_reconciles_immediately
        claim_type: derived_field_reconciliation
        grounds: [calculations.device_limit_and_count, complexity_profile.consistency_model]
        distinguishing_aspect: "device_count on the family read reflects a pair in the immediately following GET — no lag, no refresh call."
        test_recipe:
          setup: ["Family with child"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam DR", primary_contact_email: "dr@x.com", primary_parent_name: "Pat DR" }
              as: PlatformAdmin
              captures: { fam_dr: $.data.id }
            - call: "GET /api/families/${fam_dr}/parents"
              as: PlatformAdmin
              captures: { par_dr: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_dr}", display_name: "Kid DR", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_dr}"
              captures: { child_dr: $.data.id }
          trigger:
            - call: "POST /api/children/${child_dr}/devices/pair"
              payload: { platform: "ANDROID", nickname: "DR-1" }
              as: Parent
              as_user_id: "${par_dr}"
            - call: "GET /api/families/${fam_dr}"
              as: Parent
              as_user_id: "${par_dr}"
          assert:
            - "FamilyAccount.${fam_dr}.device_count == 1 in the immediate follow-up read"

  - section: consistency_model
    instances:
      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails priority-1 auth with ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/families/11111111-2222-4333-8444-555555555555"
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"
