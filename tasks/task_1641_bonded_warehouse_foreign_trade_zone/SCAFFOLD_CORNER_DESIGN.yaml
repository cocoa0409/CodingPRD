              payload: { zone_id: "${z}", week_start_date: "2026-07-27T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e: "$.data.id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 1, weekly_entry_id: "${e}" }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/weekly-entries/${e}/file"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/weekly-entries/${e}/transition"
              payload: { to_status: "OPEN" }
              as: CustomsOfficer
              captures: { s1: "$.data.status" }
            - call: "POST /zones/weekly-entries/${e}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { s2: "$.data.status" }
            - call: "POST /zones/weekly-entries/${e}/transition"
              payload: { to_status: "ACCEPTED" }
              as: CustomsOfficer
              captures: { s3: "$.data.status" }
            - call: "POST /zones/weekly-entries/${e}/transition"
              payload: { to_status: "OPEN" }
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "FILED -> OPEN return succeeds (status OPEN), re-file succeeds (status FILED), then FILED -> ACCEPTED succeeds"
            - "from ACCEPTED any further transition -> ERR_ENTRY_INVALID_TRANSITION (http 409)"

      - name: c_zone_deactivate_non_empty_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Zone.ACTIVE_to_DEACTIVATED"
          - "errors[ERR_ZONE_NOT_EMPTY]"
        distinguishing_aspect: "Deactivation requires active_lot_count == 0; with one IN_ZONE lot the transition fails with ERR_ZONE_NOT_EMPTY."
        test_recipe:
          setup: ["Zone; one lot ADMITTED and still IN_ZONE"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "NonEmpty Zone", zone_code: "Z-NE", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
          trigger:
            - call: "POST /zones/${z}/transition"
              payload: { to_status: "DEACTIVATED" }
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ZONE_NOT_EMPTY (http 409); Zone.${z}.status remains ACTIVE"

      - name: c_zone_invalid_transition_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Zone.ACTIVE_to_SUSPENDED"
          - "errors[ERR_ZONE_INVALID_TRANSITION]"
        distinguishing_aspect: "ACTIVE -> ACTIVE is not a declared transition -> ERR_ZONE_INVALID_TRANSITION."
        test_recipe:
          setup: ["Zone (ACTIVE)"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Bad Trans Zone", zone_code: "Z-BT", bond_coverage_cents: 1000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
          trigger:
            - call: "POST /zones/${z}/transition"
              payload: { to_status: "ACTIVE" }
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ZONE_INVALID_TRANSITION (http 409)"

      - name: c_lot_auto_depleted_excluded
        claim_type: valid_transition
        grounds:
          - "state_machines.InventoryLot.IN_ZONE_to_DEPLETED"
        excluded_because:
          difficulty_instance: withdrawal_file_cascade_depletes_lot
          rationale: "The automatic IN_ZONE -> DEPLETED transition and its aggregate side effects are asserted by the named §1.8 instance (and by lot_exact_depletion_boundary)."

  # =================================================================
  - section: calculations
    instances:
      - name: c_exposure_recompute_after_manipulation
        claim_type: correct_result
        grounds:
          - "calculations.deferred_duty_exposure"
          - "calculations.manipulation_output_valuation"
        distinguishing_aspect: "Zone exposure is a live derived field: 40000 after admission, 144000 after full consumption + output lot creation (round(50 x 24000 x 0.12)); active_lot_count stays 1."
        test_recipe:
          setup: ["Zone; NPF lot (qty 100, unit 10000, HTS 8542.31 rate 0.04) ADMITTED"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Exposure Zone", zone_code: "Z-EXP", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors", hts_code: "8542.31", quantity: 100, unit_value_cents: 10000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { exp_before: $.data.deferred_duty_exposure_cents, cnt_before: "$.data.active_lot_count" }
            - call: "POST /zones/manipulation-orders"
              payload: { zone_id: "${z}", source_lot_id: "${lot}", input_quantity: 100, output_hts_code: "9503.00", output_quantity: 50, value_added_cents: 200000, output_description: "Assembled toys" }
              as: Importer
              as_user_id: "imp-1"
              captures: { m: "$.data.id" }
            - call: "POST /zones/manipulation-orders/${m}/approve"
              as: ZoneOperator
          trigger:
            - call: "POST /zones/manipulation-orders/${m}/complete"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { exp_after: $.data.deferred_duty_exposure_cents, cnt_after: "$.data.active_lot_count" }
          assert:
            - "before: deferred_duty_exposure_cents == 40000 (round(100 x 10000 x 0.04)) and active_lot_count == 1"
            - "after complete: deferred_duty_exposure_cents == 144000 (source DEPLETED contributes 0; output round(50 x 24000 x 0.12))"
            - "active_lot_count remains 1 (source DEPLETED, output IN_ZONE)"

      - name: c_recon_window_filters_prior_year
        claim_type: input_set_filtering
        grounds:
          - "calculations.reconciliation_variance"
        distinguishing_aspect: "Only admissions whose admission_date falls in [2026-01-01, 2027-01-01) feed book_receipts: a 2025 admission is excluded, so book_receipts_value_cents == 0."
        test_recipe:
          setup: ["Zone; admission (qty 4, unit 2500, HTS 0401.10, NPF) admitted while the logical clock reads 2025-06-01; clock restored to 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Window Zone", zone_code: "Z-WIN", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: ZoneOperator
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Old dairy", hts_code: "0401.10", quantity: 4, unit_value_cents: 2500, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
              captures: { adate: "$.data.admission_date" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneOperator
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { zv: "$.data.version" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${z}", zone_year: 2026, beginning_value_cents: 0, physical_ending_value_cents: 0, expected_zone_version: "${zv}" }
              as: ZoneOperator
              captures: { r: "$.data.id" }
          trigger:
            - call: "POST /zones/annual-reconciliations/${r}/submit"
              as: ZoneOperator
              captures: { rec: $.data.book_receipts_value_cents, be: $.data.book_ending_value_cents, dp: $.data.discrepancy_pct, fl: "$.data.audit_flagged" }
          assert:
            - "Admission.${a}.admission_date == 2025-06-01T00:00:00Z (admitted under the moved clock)"
            - "AnnualReconciliation.${r}.book_receipts_value_cents == 0 (the 2025 admission is outside the 2026 window; would be 10000 if included)"
            - "book_ending_value_cents == 0; discrepancy_pct == 0 (zero-book rule: physical == 0); audit_flagged == false"

      - name: c_duty_rounding_half_up
        claim_type: precision
        grounds:
          - "calculations.duty_assessment"
        distinguishing_aspect: "Exact half-cent rounds up: 1 x 1220 x 0.025 = 30.5 -> 31 (round_half_even would give 30)."
        test_recipe:
          setup: ["Zone; lot (qty 1, unit 1220, HTS 8708.29 rate 0.025, NPF) ADMITTED"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Half Zone", zone_code: "Z-HLF", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Auto parts", hts_code: "8708.29", quantity: 1, unit_value_cents: 1220, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 1 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { duty: "$.data.assessed_duty_cents" }
          assert:
            - "Withdrawal.${w}.assessed_duty_cents == 31 (30.5 rounds half-up)"

      - name: c_domestic_zero_duty_excluded
        claim_type: constants_applied
        grounds:
          - "calculations.duty_assessment"
        excluded_because:
          difficulty_instance: duty_branching_by_zone_status
          rationale: "The DOMESTIC zero-rate branch is asserted by the named §1.8 combinatorial instance."

  # =================================================================
  - section: validations
    instances:
      - name: c_missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers fails priority-1 auth with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) even on a read endpoint."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /zones"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: c_existence_beats_state_priority
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=6]"
          - "errors[ERR_ADMISSION_NOT_FOUND]"
        distinguishing_aspect: "Admit on a nonexistent admission id returns 404 ERR_ADMISSION_NOT_FOUND — priority-3 existence beats any priority-6 state evaluation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /zones/admissions/00000000-0000-4000-8000-0000000000ad/admit"
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ADMISSION_NOT_FOUND (http 404), not any state error"

      - name: c_referential_beats_fiscal_priority
        claim_type: priority_ordering
        grounds:
          - "validations[priority=10]"
          - "validations[priority=11]"
          - "errors[ERR_UNKNOWN_HTS_CODE]"
          - "errors[ERR_BOND_CAPACITY_EXCEEDED]"
        distinguishing_aspect: "Dual failure on admit: unknown HTS code (referential p10) AND bond breach (fiscal p11, tiny 100-cent bond) — the referential error wins."
        test_recipe:
          setup: ["Zone with bond_coverage_cents 100; admission with hts_code 9999.99 (not in HTS_RATE_TABLE) SUBMITTED"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "RefFiscal Zone", zone_code: "Z-RF", bond_coverage_cents: 100 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Mystery goods", hts_code: "9999.99", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNKNOWN_HTS_CODE (http 422) — priority-10 referential beats priority-11 fiscal"
            - "error_id != ERR_BOND_CAPACITY_EXCEEDED even though any positive exposure would breach the 100-cent bond"

      - name: c_state_beats_fiscal_excluded
        claim_type: priority_ordering
        grounds:
          - "validations[priority=6]"
          - "validations[priority=11]"
        excluded_because:
          difficulty_instance: admit_state_error_beats_bond_fiscal
          rationale: "The (state, business_fiscal) priority pair is asserted by the named §1.8 instance."

      - name: c_non_owner_file_forbidden
        claim_type: conditional_validation
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "Ownership gate: a withdrawal created by imp-1 cannot be filed by imp-2 — ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Zone; lot owned by imp-1 (qty 5, unit 1000, HTS 0401.10); withdrawal qty 1 created by imp-1, still DRAFT"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Owner Zone", zone_code: "Z-OWN", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 1 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
          trigger:
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-2"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER (http 403); Withdrawal.${w}.status remains DRAFT"

      - name: c_cross_zone_lot_reference_rejected
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_CROSS_ZONE_REFERENCE]"
        distinguishing_aspect: "A withdrawal whose zone_id differs from its lot's zone is rejected with ERR_CROSS_ZONE_REFERENCE (422) even when the acting importer owns the lot."
        test_recipe:
          setup: ["Zones A and B; lot in zone B owned by imp-1"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Zone A", zone_code: "Z-A", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { za: "$.data.id" }
            - call: "POST /zones"
              payload: { name: "Zone B", zone_code: "Z-B", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { zb: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${zb}", description: "Dairy B", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${za}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 1 }
              as: Importer
              as_user_id: "imp-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_CROSS_ZONE_REFERENCE (http 422); no withdrawal persisted (GET /zones/withdrawals?lot_id=${lot} total_count == 0)"

      - name: c_zr_consumption_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_ZR_CONSUMPTION_FORBIDDEN]"
        distinguishing_aspect: "ZONE_RESTRICTED merchandise may not be withdrawn for consumption (422) but an EXPORT withdrawal on the same lot is accepted."
        test_recipe:
          setup: ["Zone; ZONE_RESTRICTED lot (qty 5, unit 1000, HTS 0401.10) ADMITTED"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "ZR Zone", zone_code: "Z-ZR", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Restricted dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "ZONE_RESTRICTED" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 1 }
              as: Importer
              as_user_id: "imp-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "EXPORT", quantity: 1 }
              as: Importer
              as_user_id: "imp-1"
              captures: { wx: $.data.id, wxs: "$.data.status" }
          assert:
            - "CONSUMPTION create on the ZR lot -> ERR_ZR_CONSUMPTION_FORBIDDEN (http 422)"
            - "EXPORT create on the same ZR lot succeeds: Withdrawal.${wx}.status == DRAFT"

      - name: c_manipulation_on_zr_lot_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_MANIPULATION_NOT_PERMITTED]"
          - "state_machines.ManipulationOrder.REQUESTED_to_APPROVED"
        distinguishing_aspect: "Approving a manipulation order against a ZONE_RESTRICTED source lot fails with ERR_MANIPULATION_NOT_PERMITTED; the order stays REQUESTED and no reservation is made."
        test_recipe:
          setup: ["Zone; ZONE_RESTRICTED lot ADMITTED; manipulation order created against it (REQUESTED)"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "ZR Manip Zone", zone_code: "Z-ZRM", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Restricted parts", hts_code: "8708.29", quantity: 10, unit_value_cents: 1221, zone_status: "ZONE_RESTRICTED" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/manipulation-orders"
              payload: { zone_id: "${z}", source_lot_id: "${lot}", input_quantity: 5, output_hts_code: "9503.00", output_quantity: 2, value_added_cents: 1000, output_description: "Repairs" }
              as: Importer
              as_user_id: "imp-1"
              captures: { m: "$.data.id" }
          trigger:
            - call: "POST /zones/manipulation-orders/${m}/approve"
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
          assert:
