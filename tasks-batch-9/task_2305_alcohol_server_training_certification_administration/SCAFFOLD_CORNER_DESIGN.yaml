              payload: { location_name: "Alamo Taproom", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 4821734 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { loc_a_id: $.data.id }
          trigger:
            - call: "POST /employer-accounts/${emp_id}/dram-shop-documents"
              payload: { insurer_name: "Brazos Mutual", policy_number: "BM-2026-77", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-09-01T00:00:00Z", expected_employer_account_version: "${emp_v1}" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
            - call: "GET /employer-accounts/${emp_id}"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { emp_v2: $.data.version }
            - call: "POST /employer-accounts/${emp_id}/dram-shop-documents"
              payload: { insurer_name: "Brazos Mutual", policy_number: "BM-2026-77", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-09-01T00:00:00Z", expected_employer_account_version: "${emp_v2}" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
          assert:
            - "the stale issuance returns 412 with error.code == 'ERR_STALE_ACCOUNT_VERSION'"
            - "${emp_v2} == ${emp_v1} + 1 (adding the location bumped the account version)"
            - "the current-version issuance returns 422 with error.code == 'ERR_COMPLIANCE_RATE_TOO_LOW', proving the OCC gate was passed"
            - "GET /employer-accounts/${emp_id}/dram-shop-documents returns total_count 0 and dram_shop_discount_status == 'NOT_DOCUMENTED'"

      - name: posture_band_crosses_the_eighty_floor_only_when_the_uncertified_hire_leaves
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.location_compliance_metrics.constants
          - entities.EmployerLocation.fields.compliance_posture
          - entities.EmployerAccount.fields.dram_shop_discount_status
        distinguishing_aspect: |
          The same location walks the threshold ladder 0.00 -> 50.00 -> 100.00 as an
          uncertified hire is added, a certified server is added, and the uncertified
          assignment is ended: posture is NON_COMPLIANT at both 0.00 and 50.00 and only
          reaches COMPLIANT at 100.00, and dram_shop_discount_status stays NOT_DOCUMENTED
          until the account rate finally clears the 80.00 promotion floor.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction, an APPROVED ON_PREMISE course, a CERTIFIED trainer, and a COMPLETED session that issued Ari an ACTIVE certificate."
            - "Bo Nakamura has never trained, so his work_eligibility is UNCERTIFIED."
            - "Employer Lone Star Taverns LLC has one ON_PREMISE location and no assignments yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"], min_passing_score_pct: 70, proctor_separation_required: false, certificate_validity_months: 24, registry_deadline_days: 15 }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "initial filing" }
              as: ProgramAdmin
              captures: { appr_id: $.data.id }
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "APPROVE", approval_number: "TX-ABC-2026-001", effective_from: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: StateRegulator
            - call: "POST /trainers"
              payload: { full_name: "Dana Reyes", email: "dana@tips.example" }
              as: ProgramAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /trainers/${tr_id}/credential"
              payload: { certified_tracks: ["ON_PREMISE"], certified_state_codes: ["TX"], credential_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", trainer_id: "${tr_id}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T18:00:00Z", capacity: 20 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /alcohol-servers"
              payload: { full_name: "Ari Cole", email: "ari@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_a: $.data.id }
            - call: "POST /alcohol-servers"
              payload: { full_name: "Bo Nakamura", email: "bo@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_b: $.data.id }
            - call: "POST /enrollments"
              payload: { class_session_id: "${sess_id}", alcohol_server_id: "${srv_a}", expected_class_session_version: "${sess_v}" }
              as: AlcoholServer
              as_user_id: "${srv_a}"
              captures: { enr_a: $.data.id }
            - call: "POST /class-sessions/${sess_id}/lock-roster"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /enrollments/${enr_a}/attendance"
              payload: { attended: true }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:05:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions/${sess_id}/open-exam"
              payload: { proctor_trainer_id: "${tr_id}" }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /enrollments/${enr_a}/exam-attempts"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
              captures: { att_a: $.data.id }
            - call: "POST /exam-attempts/${att_a}/submit"
              payload: { raw_correct_count: 34, proctor_attestation: true }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:30:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions/${sess_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /employer-accounts"
              payload: { legal_name: "Lone Star Taverns LLC", billing_state_code: "TX" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employer-accounts/${emp_id}/locations"
              payload: { location_name: "Alamo Taproom", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 4821734 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { loc_a_id: $.data.id }
          trigger:
            - call: "POST /employer-locations/${loc_a_id}/server-assignments"
              payload: { alcohol_server_id: "${srv_b}", role_title: "Barback" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { asg_b: $.data.id }
            - call: "POST /employer-locations/${loc_a_id}/server-assignments"
              payload: { alcohol_server_id: "${srv_a}", role_title: "Bartender" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { asg_a: $.data.id }
            - call: "POST /server-assignments/${asg_b}/end"
              payload: { end_reason: "did not complete training" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
          assert:
            - "AlcoholServer.${srv_b}.work_eligibility == 'UNCERTIFIED' and ServerAssignment.${asg_b}.assignment_state == 'ACTIVE' (an untrained new hire is assignable, only RESTRICTED servers are blocked)"
            - "after Bo's assignment EmployerLocation.${loc_a_id}.assigned_server_count == 1, compliant_server_count == 0, compliance_rate_strict_pct == 0.00, compliance_rate_grace_inclusive_pct == 0.00 and compliance_posture == 'NON_COMPLIANT'"
            - "after Ari's assignment assigned_server_count == 2, compliant_server_count == 1, both rates == 50.00 and compliance_posture is still 'NON_COMPLIANT' (50.00 < AT_RISK_MIN_PCT 80.00)"
            - "at 50.00 EmployerAccount.${emp_id}.account_compliance_rate_pct == 50.00 and dram_shop_discount_status == 'NOT_DOCUMENTED' (below the 80.00 promotion floor)"
            - "after Bo's assignment ends assigned_server_count == 1, both rates == 100.00 and compliance_posture == 'COMPLIANT' (100.00 >= COMPLIANT_MIN_PCT 95.00)"
            - "at 100.00 EmployerAccount.${emp_id}.account_compliance_rate_pct == 100.00 and dram_shop_discount_status == 'ELIGIBLE'"
            - "GET /employer-locations/${loc_a_id}/server-assignments returns total_count 2 while only ${asg_a} is ACTIVE"

      - name: corner_layer_cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / registry_rejection_cascades_six_hops_to_dram_shop_document_void
          rationale: "That instance verifies a six-hop chain end to end from one regulator acknowledgement, asserting every intermediate hop."

      - name: corner_layer_cascade_ordering_sensitivity_across_runs
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / epoch_driven_certificate_lapse_cascades_four_hops_across_two_runs
          rationale: "That instance shows the cascade is ordering-sensitive: the grace hop must be applied by the earlier run before the lapse hop of the later run can restrict the assignment."

      - name: corner_layer_dual_variant_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / location_strict_rate_diverges_from_grace_inclusive_rate_for_all_grace_roster
          rationale: "That instance asserts both variants on one roster (0.00 STRICT vs 100.00 GRACE_INCLUSIVE) and the posture the selected variant produces."

  # =========================================================================
  - section: consistency model
    instances:
      - name: derived_compliance_fields_are_visible_in_the_same_response_that_caused_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.location_compliance_metrics
          - entities.EmployerAccount.fields.account_compliance_rate_pct
        distinguishing_aspect: |
          A single assignment write recomputes the location counters, both location rates,
          the posture, the account roll-up and location_count, and every one of those values
          is already correct on the first read after the write returns - there is no
          background job, no lag and no second call needed to converge.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction, employer Lone Star Taverns LLC with one ON_PREMISE location, and untrained server Bo Nakamura."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /alcohol-servers"
              payload: { full_name: "Bo Nakamura", email: "bo@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_b: $.data.id }
            - call: "POST /employer-accounts"
              payload: { legal_name: "Lone Star Taverns LLC", billing_state_code: "TX" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employer-accounts/${emp_id}/locations"
              payload: { location_name: "Alamo Taproom", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 4821734 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { loc_a_id: $.data.id }
          trigger:
            - call: "POST /employer-locations/${loc_a_id}/server-assignments"
              payload: { alcohol_server_id: "${srv_b}", role_title: "Barback" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { asg_b: $.data.id }
            - call: "GET /employer-locations/${loc_a_id}/compliance-dashboard"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${emp_id}"
            - call: "GET /employer-accounts/${emp_id}"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${emp_id}"
          assert:
            - "the assignment write returns 201 with ServerAssignment.${asg_b}.assignment_state == 'ACTIVE' and assigned_at == '2026-08-03T09:00:00Z'"
            - "the very first dashboard read reports assigned_server_count 1, compliant_server_count 0, grace_server_count 0, restricted_server_count 0, both rates 0.00 and compliance_posture 'NON_COMPLIANT'"
            - "the very first account read reports location_count 1 and account_compliance_rate_pct 0.00 with dram_shop_discount_status 'NOT_DOCUMENTED'"
            - "repeating both reads without any intervening write returns byte-identical derived values (no convergence step)"
