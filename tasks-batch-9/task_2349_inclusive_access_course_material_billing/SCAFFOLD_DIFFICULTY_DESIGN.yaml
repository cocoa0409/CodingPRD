            - "OptOutRequest.${oo1_id}.status == GRANTED (unchanged) and StudentCharge.${chg1_id}.billing_status == REFUNDED, access_status == REVOKED"
            - "Trigger call 2 -> HTTP 200: OptOutRequest.${oo2_id}.status == RESCINDED with recharge_amount_cents == 9450"
            - "StudentCharge.${chg2_id}.billing_status == POSTED, access_status == RESTORED, net_billed_cents == 9450, refunded_amount_cents == 0"
            - "Student.${stu2_id}.bursar_balance_cents == 9450 while Student.${stu1_id}.bursar_balance_cents == 0"
            - "CourseSection.${sec_id}.enrolled_count == 1, provisioned_access_count == 1, revoked_access_count == 1, participation_rate == 1.0000, ia_status == BILLED (AT_RISK -> BILLED on the rescind)"
