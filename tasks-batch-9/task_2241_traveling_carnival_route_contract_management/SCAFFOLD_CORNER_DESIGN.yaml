          setup:
            - "Jurisdiction OH and Venue V1."
            - "Route R1 COMMITTED with stop A1 (open 2026-09-04T12:00Z, close 2026-09-07T12:00Z) and Contract C1 (exclusivity FULL, guarantee 400000) EXECUTED."
            - "Route R2 COMMITTED with stop A2 at the SAME venue (open 2026-09-06T12:00Z, close 2026-09-09T12:00Z, i.e. overlapping) and Contract C2 (exclusivity FULL, guarantee 400000) SENT."
