      - 'deactivate with live call: 409 and live_err == ERR_AGENT_HAS_LIVE_CALLS'
      - 'close queue with ASSIGNED call: 409 and qne_err == ERR_QUEUE_NOT_EMPTY'
      - 're-route of an ASSIGNED call: 409 and dup_route_err == ERR_INVALID_STATE (route is WAITING-only; ERR_CALL_OVERFLOW_FORBIDDEN is asserted
        in the dedicated overflow scenario where a depth-2 call re-routes)'
- section: roles
  instances:
  - name: peer_role_exclusive_denials
    claim_type: RBAC denial
    grounds:
    - roles
    - errors.ERR_FORBIDDEN
    distinguishing_aspect: 'Peer roles cannot cross: a BillingAnalyst cannot create queues (OpsManager-exclusive), a Supervisor cannot publish
      articles (KnowledgeManager-exclusive), a QualityAnalyst cannot route calls (Supervisor-exclusive), an Agent cannot create invoices (BillingAnalyst-exclusive)
      — each denial is 403 ERR_FORBIDDEN at priority 2.'
    test_recipe:
      setup:
      - One DRAFT contract; one course; one waiting-call fixture is unnecessary since denials fire before existence.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /queues
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          queue_type: GENERAL
        as: BillingAnalyst
        captures:
          rbac_e1: $.data.error_id
      - call: POST /knowledge-articles
        payload:
          program_code: MEDICAID
          title: t
          body: b
          effective_at: '2026-09-10T00:00:00Z'
        as: Supervisor
        captures:
          rbac_e2: $.data.error_id
      - call: POST /invoices
        payload:
          contract_id: ${kc_id}
          period: 2026-09
        as: Agent
        as_user_id: 00000000-0000-4000-8000-000000000000
        captures:
          rbac_e3: $.data.error_id
      assert:
      - rbac_e1 == ERR_FORBIDDEN (403)
      - rbac_e2 == ERR_FORBIDDEN (403)
      - rbac_e3 == ERR_FORBIDDEN (403) — role check fires before contract state or body validation
  - name: agent_identity_ownership_on_answer_and_dispute
    claim_type: RBAC ownership
    grounds:
    - roles.Agent
    - entities.Call.fields.agent_id
    distinguishing_aspect: 'entity_backed:Agent identity: agent A2 answering a call assigned to A1 is 403 ERR_FORBIDDEN (ownership), and A2 disputing
      the review of A1''s call is likewise 403 — X-User-ID must equal Call.agent_id / handled_by_agent_id.'
    test_recipe:
      setup:
      - ACTIVE contract, queue, certified agents A1 and A2; call assigned to A1; a SUBMITTED review of A1's completed call.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - call: POST /agents
        payload:
          full_name: Agent Two
          languages:
