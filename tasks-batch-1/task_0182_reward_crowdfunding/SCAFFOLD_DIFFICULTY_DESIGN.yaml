  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pledge_create_requires_campaign_live
        grounds:
          - state_machines.Pledge.PENDING_AUTH_to_AUTHORIZED
          - entities.Campaign.fields.status
          - validations[priority=8]
          - errors[ERR_CAMPAIGN_NOT_LIVE]
        distinguishing_aspect: |
          Entity pair Pledge -> Campaign: a Pledge can only be created when its owning Campaign is LIVE.
          On a DRAFT campaign the pledge create is rejected ERR_CAMPAIGN_NOT_LIVE; the decision reads
          Campaign.status, a different entity than the Pledge being written.
        test_recipe:
          setup:
            - "Campaign in DRAFT with a valid tier; pledge amount meets the tier minimum."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id, camp_v0: $.data.version }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v0}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Pledge create rejected with error_id == ERR_CAMPAIGN_NOT_LIVE because Campaign.${camp_id}.status == DRAFT."
            - "HTTP status == 409."

      - name: campaign_launch_requires_available_tier
        grounds:
          - state_machines.Campaign.DRAFT_to_LIVE
          - entities.RewardTier.fields.status
          - errors[ERR_NO_TIERS]
        distinguishing_aspect: |
          A DIFFERENT entity pair Campaign -> RewardTier: a Campaign may transition DRAFT->LIVE only if
          it owns at least one RewardTier with status == AVAILABLE. With zero tiers the launch is
          rejected ERR_NO_TIERS; the decision reads RewardTier rows, a different pair than
          Pledge->Campaign above.
        test_recipe:
          setup:
            - "Campaign in DRAFT with NO reward tiers created."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Launch rejected with error_id == ERR_NO_TIERS because the campaign owns no AVAILABLE RewardTier."
            - "Campaign.${camp_id}.status remains DRAFT (HTTP 409)."

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: creator_live_window_overlap_half_open
        grounds:
          - calculations.campaign_window_overlap
          - validations[priority=14]
          - errors[ERR_CAMPAIGN_WINDOW_OVERLAP]
          - state_machines.Campaign.DRAFT_to_LIVE
        distinguishing_aspect: |
          Resource = Creator; interval semantics = half-open [launched_at, deadline_utc) with adjacency
          ALLOWED. Creator C1 has a LIVE campaign K1 [2026-06-01, 2026-07-01). Launching K2 at clock
          2026-06-15 (deadline 2026-08-01) overlaps (2026-06-15 < 2026-07-01) and is rejected
          ERR_CAMPAIGN_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Creator C1 with LIVE campaign K1 launched at 2026-06-01, deadline 2026-07-01; second DRAFT campaign K2 deadline 2026-08-01."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C1", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c1_id}", title: "K1", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c1_id}"
              captures: { k1_id: $.data.id }
            - call: "POST /campaigns/${k1_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /campaigns/${k1_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c1_id}"
            - call: "POST /campaigns"
              payload: { creator_id: "${c1_id}", title: "K2", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-08-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c1_id}"
              captures: { k2_id: $.data.id }
            - call: "POST /campaigns/${k2_id}/tiers"
              payload: { title: "T2", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns/${k2_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "K2 launch rejected with error_id == ERR_CAMPAIGN_WINDOW_OVERLAP (2026-06-15 < K1.deadline 2026-07-01)."
            - "Campaign.${k2_id}.status remains DRAFT (HTTP 409)."

      - name: tier_early_bird_window_overlap_with_buffer
        grounds:
          - calculations.tier_window_overlap
          - validations[priority=15]
          - errors[ERR_TIER_WINDOW_OVERLAP]
          - entities.RewardTier.fields.available_from
        distinguishing_aspect: |
          Resource = RewardTier; interval semantics DIFFER from the creator rule: early-bird windows
          require a TIER_GAP_SECONDS=3600 BUFFER, so adjacency (gap 0) is REJECTED. An existing
          early-bird tier [10:00, 11:00) blocks a new early-bird [11:00, 12:00) because the gap (0s) is
          below the 3600s buffer.
        test_recipe:
          setup:
            - "DRAFT campaign with one early-bird tier window [2026-06-02T10:00, 2026-06-02T11:00)."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "EarlyA", price_cents: 4000, weight_grams: 800, is_early_bird: true, available_from: "2026-06-02T10:00:00.000Z", available_until: "2026-06-02T11:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_a: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "EarlyB", price_cents: 4500, weight_grams: 800, is_early_bird: true, available_from: "2026-06-02T11:00:00.000Z", available_until: "2026-06-02T12:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second early-bird tier rejected with error_id == ERR_TIER_WINDOW_OVERLAP (gap 0s < 3600s buffer; adjacency rejected, unlike the half-open creator rule)."
            - "HTTP status == 409."

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_count_conserved_on_pledge_create_then_cancel
        grounds:
          - state_machines.Pledge.PENDING_AUTH_to_AUTHORIZED
          - calculations.tier_claimed_quantity
          - entities.RewardTier.fields.claimed_quantity
        distinguishing_aspect: |
          Conserved quantity = RewardTier.claimed_quantity (an integer COUNT). Forward action (create a
          pledge: claimed 0->1) paired with its compensating action (cancel that pledge: claimed 1->0)
          leaves the invariant tier.claimed_quantity unchanged at its baseline 0.
        test_recipe:
          setup:
            - "LIVE campaign with tier limit 5, baseline claimed_quantity 0."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, limit_quantity: 5, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { pledge_id: $.data.id }
            - call: "POST /pledges/${pledge_id}/cancel"
              payload: {}
              as: Backer
              as_user_id: "${b_id}"
            - call: "GET /tiers/${tier_id}"
              as: PlatformAdmin
              captures: { claimed_final: $.data.claimed_quantity }
          assert:
            - "After create then cancel: RewardTier.${tier_id}.claimed_quantity == 0 (equal to the pre-create baseline; count conserved)."

      - name: projected_raise_cents_conserved_on_pledge_create_then_cancel
        grounds:
          - calculations.projected_raise
          - entities.Campaign.fields.committed_amount_cents
          - state_machines.StretchGoal.UNLOCKED_to_LOCKED
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = Campaign.committed_amount_cents (MONEY in cents, not a count).
          Forward (create pledge: committed 0->5650, stretch goal at 5000 unlocks) paired with
          compensating (cancel pledge: committed 5650->0) restores committed_amount_cents to 0 AND
          re-locks the stretch goal — the money invariant returns to baseline with no drift.
        test_recipe:
          setup:
            - "LIVE campaign with a stretch goal threshold 5000; baseline committed_amount_cents 0, stretch LOCKED."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/stretch-goals"
              payload: { title: "SG", threshold_cents: 5000 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { sg_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { pledge_id: $.data.id }
            - call: "GET /stretch-goals/${sg_id}"
              as: PlatformAdmin
              captures: { unlocked_mid: $.data.unlocked }
            - call: "POST /pledges/${pledge_id}/cancel"
              payload: {}
              as: Backer
              as_user_id: "${b_id}"
            - call: "GET /campaigns/${camp_id}"
              as: PlatformAdmin
              captures: { committed_final: $.data.committed_amount_cents }
            - call: "GET /stretch-goals/${sg_id}"
              as: PlatformAdmin
              captures: { unlocked_final: $.data.unlocked }
          assert:
            - "Mid-state: StretchGoal.${sg_id}.unlocked == true (committed 5650 >= 5000)."
            - "After cancel: Campaign.${camp_id}.committed_amount_cents == 0 (money invariant restored to baseline)."
            - "After cancel: StretchGoal.${sg_id}.unlocked == false (re-locked; no drift)."
