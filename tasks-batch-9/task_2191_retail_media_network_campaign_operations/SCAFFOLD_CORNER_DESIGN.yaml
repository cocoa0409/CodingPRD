          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: "The invoice clears every earlier check — the advertiser is ACTIVE, the plan is ACTIVE, the (advertiser_id, 2026-08) pair is unique, the campaign is COMPLETED — and only the priority-79 gross_spend_cents >= 1 test stops it, because no auction was ever settled so all ten waterfall steps would run against a zero base."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an OPEN 2026-Q3 TradeFundAccount and an ACTIVE plan whose trade_fund_share_cents is 0."
            - "A campaign that reached DELIVERING with one SERVING line item, never held an auction, and was then COMPLETED; a DRAFT invoice for 2026-08 exists."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *b_tfa
            - *c_plan
            - *c_plan_sub
