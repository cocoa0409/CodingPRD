              captures: { nf_stay: $.data.error_id }
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_nf_id}", course_code: "SS999", due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
