    side_effects: ["IN_REVIEW -> APPROVED; case -> PENDING_CLOSURE"]
  - method: POST
    path: "/api/response-letters/{id}/return"
    description: "Return letter to drafting (revision loop)"
    roles: [PatientRelationsDirector]
    code: 200
    input: [return_reason]
    output: ResponseLetter
    side_effects: ["IN_REVIEW -> RETURNED; case -> RESPONSE_DRAFTING"]
  - method: POST
    path: "/api/response-letters/{id}/issue"
    description: "Issue the approved letter to the patient; closes the case"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: ResponseLetter
    side_effects: ["APPROVED -> ISSUED; case -> CLOSED with full closure cascade (follow-up created, assignments completed, timeliness evaluated)"]

  # --- ServiceRecoveryAction ---
  - method: POST
    path: "/api/patient-cases/{id}/recovery-actions"
    description: "Issue a real-time service recovery gesture; value above issuer limit -> PENDING_APPROVAL; cumulative cap enforced"
    roles: [PatientAdvocate]
    code: 201
    input: [action_type, value_cents, justification]
    output: ServiceRecoveryAction
    side_effects: ["ISSUED: case.outstanding_recovery_cents += value_cents; PENDING_APPROVAL: no ledger effect until approved"]
  - method: GET
    path: "/api/recovery-actions"
    description: "List recovery actions"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "case_id?", "issued_by_id?", "approved_by_id?", "status?"]
    output: "ServiceRecoveryAction[]"
    side_effects: []
  - method: GET
    path: "/api/recovery-actions/{id}"
    description: "Get a recovery action"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: ServiceRecoveryAction
    side_effects: []
  - method: POST
    path: "/api/recovery-actions/{id}/approve"
    description: "Director approves a PENDING_APPROVAL action (SoD enforced; cap re-checked)"
    roles: [PatientRelationsDirector]
    code: 200
    input: []
    output: ServiceRecoveryAction
    side_effects: ["PENDING_APPROVAL -> ISSUED; case.outstanding_recovery_cents += value_cents"]
  - method: POST
    path: "/api/recovery-actions/{id}/reject"
    description: "Director rejects a PENDING_APPROVAL action"
    roles: [PatientRelationsDirector]
    code: 200
    input: ["reject_reason?"]
    output: ServiceRecoveryAction
    side_effects: ["PENDING_APPROVAL -> REJECTED"]
  - method: POST
    path: "/api/recovery-actions/{id}/revoke"
    description: "Revoke an ISSUED action (compensating action)"
    roles: [PatientRelationsDirector]
    code: 200
    input: [revoke_reason]
    output: ServiceRecoveryAction
    side_effects: ["ISSUED -> REVOKED; case.outstanding_recovery_cents -= value_cents"]

  # --- QualityRiskEscalation ---
  - method: POST
    path: "/api/patient-cases/{id}/escalations"
