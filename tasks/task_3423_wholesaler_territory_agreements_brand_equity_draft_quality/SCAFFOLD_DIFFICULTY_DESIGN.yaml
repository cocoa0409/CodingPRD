              as: BrewerAdmin
              captures: { revk_id: $.data.id }
            - call: "GET /performance-reviews/${revk_id}/corrective-plans"
              payload: {}
              as: BrewerAdmin
              captures: { plk_id: "$.data[0].id" }
          trigger:
            - call: "POST /corrective-plans/${plk_id}/activate"
              payload: {}
              as: BrewerCompliance
              captures: { ack_err: $.data.error_id }
            - call: "POST /performance-reviews/${revk_id}/response"
              payload: { action: "ACKNOWLEDGE" }
              as: WholesalerPrincipal
              as_user_id: "${wk_id}"
