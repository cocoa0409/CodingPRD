# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3213_live_event_touring_talent_agreements_event_windowing
# 9 Difficulty Rules x 2 instances each. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Numeric asserts were computed by executing the
# formulas in §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_vs_final_event_state_filter
        grounds:
          - calculations.royalty_line_split
          - entities.RoyaltyStatement.fields.basis_mode
          - entities.RoyaltyStatement.fields.total_royalty_cents
        distinguishing_aspect: |
          Same MerchSale data yields different statement totals purely from the
          variant's event-state input filter: PROVISIONAL counts lines on LOCKED
          events (here total_sales_cents == 100000, total_royalty_cents == 20000)
          while FINAL counts only COMPLETED events (both totals == 0).
        test_recipe:
          setup:
            - "Talent T has an ACTIVE agreement (rate 2000bp, likeness granted) and wellness raised to BOOKABLE via three fulfilled house shows"
            - "House event HP (2026-09-14) is LOCKED with T booked"
            - "Two merch sale lines recorded against HP: 2 x 5000 cents and 3 x 30000 cents"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Roy Ace", legal_name: "Roy Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2027-01-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: true, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
            - call: "POST /touring/arenas"
              payload: { name: "House Arena", city: "Orlando", country_code: "US", capacity: 2000, merch_booths: 2, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "HS1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { hs1_id: $.data.id, hs1_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${hs1_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${hs1_id}/lock"
              payload: { expected_event_version: "${hs1_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${hs1_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "HS2", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { hs2_id: $.data.id, hs2_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${hs2_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${hs2_id}/lock"
              payload: { expected_event_version: "${hs2_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${hs2_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "HS3", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-07", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { hs3_id: $.data.id, hs3_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${hs3_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${hs3_id}/lock"
              payload: { expected_event_version: "${hs3_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${hs3_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "HP", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-14", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { hp_id: $.data.id, hp_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${hp_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${hp_id}/lock"
              payload: { expected_event_version: "${hp_v}" }
              as: TourPlanner
            - call: "POST /touring/merch-sales"
              payload: { event_id: "${hp_id}", talent_id: "${t_id}", quantity: 2, unit_price_cents: 5000, sold_at: "2026-09-14T20:00:00Z" }
              as: MerchOps
            - call: "POST /touring/merch-sales"
              payload: { event_id: "${hp_id}", talent_id: "${t_id}", quantity: 3, unit_price_cents: 30000, sold_at: "2026-09-14T20:30:00Z" }
              as: MerchOps
          trigger:
            - call: "POST /touring/royalty-statements"
              payload: { talent_id: "${t_id}", period_start_date: "2026-09-01", period_end_date: "2026-10-01", basis_mode: "PROVISIONAL" }
              as: ContractAdmin
              captures: { st_prov_id: $.data.id }
            - call: "POST /touring/royalty-statements"
              payload: { talent_id: "${t_id}", period_start_date: "2026-09-01", period_end_date: "2026-10-01", basis_mode: "FINAL" }
              as: ContractAdmin
              captures: { st_final_id: $.data.id }
          assert:
            - "RoyaltyStatement.${st_prov_id}.total_sales_cents == 100000"
            - "RoyaltyStatement.${st_prov_id}.total_royalty_cents == 20000"
            - "RoyaltyStatement.${st_final_id}.total_sales_cents == 0"
            - "RoyaltyStatement.${st_final_id}.total_royalty_cents == 0"

      - name: appearance_obligation_committed_vs_forward_looking
        grounds:
          - calculations.appearance_obligation_shortfall
          - entities.TalentAgreement.fields.min_appearances_per_quarter
        distinguishing_aspect: |
          Unlike the royalty entity-domain variant (merch lines filtered by event
          state), this dual reading sits on the Booking domain: a backward-looking
          committed-only count gives shortfall 3, while the pinned forward-looking
          variant (committed + projected BOOKED remainder) gives shortfall 2 for
          identical data — the endpoint MUST return 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-30 (inside Q3)"
            - "Talent T ACTIVE agreement with min_appearances_per_quarter == 5, BOOKABLE (three fulfilled house shows 2026-09-05/06/07 — only the last falls in Q3)"
            - "Q3: two FULFILLED bookings (house show 2026-09-07 and premium PE1 2026-09-20) and one BOOKED booking on SCHEDULED house show 2026-09-28 (the Q3 remainder relative to the clock at 2026-09-26)"
            - "Agreement floor applies to Q3 (Jul-Sep); counts: committed == 2 (2026-09-07 house + 2026-09-20 premium), projected == 1 (2026-09-28 booked)"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Appt Star", legal_name: "Appt Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
