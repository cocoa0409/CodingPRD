  - section: calculations
    instances:
      - name: freight_class_density_exact_boundaries
        claim_type: correct_result
        grounds:
          - calculations.calc_freight_and_oversize
        distinguishing_aspect: "Density exactly on a table bound takes the interval whose UPPER bound it is: 15.0 -> class 85 while 15.0001 -> class 77.5; 8.0 -> 150; 1.0 -> 500."
        test_recipe:
          setup: ["warehouse ATL; account; three products at densities 15.0, 15.0001, 1.0 with inventory; one order with three lines"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
