# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Recognition & Rewards Program Administration
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: program_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Program.fields.velocity_limit_per_7_days, entities.Program.fields.accrual_method, entities.Program.fields.status]
        distinguishing_aspect: "Creating a program with only required fields applies documented defaults: status=DRAFT, accrual_method=STRAIGHT_LINE, velocity_limit_per_7_days=5, duplicate_window_days=30, nomination_review_sla_days=14, grossup_enabled=false, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "GET /api/programs/${prog}", payload: {}, as: HRAdmin, captures: { st: $.data.status, am: $.data.accrual_method, vel: $.data.velocity_limit_per_7_days, dw: $.data.duplicate_window_days, sla: $.data.nomination_review_sla_days, gu: $.data.grossup_enabled, v: $.data.version } }
          assert:
            - "${st} == DRAFT and ${am} == STRAIGHT_LINE"
            - "${vel} == 5 and ${dw} == 30 and ${sla} == 14"
            - "${gu} == false and ${v} == 1"

      - name: employee_creation_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Employee.fields.available_points, entities.Employee.fields.recognition_tier]
        distinguishing_aspect: "A new employee has available_points=0, held_points=0, all lifetime_* counters 0, ytd_supplemental_wages_cents=0, program_status=ELIGIBLE, recognition_tier=BRONZE; client-supplied values for computed fields are ignored."
        test_recipe:
          setup: ["department exists"]
          setup_api_calls:
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
          trigger:
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp One", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA", available_points: 9999, recognition_tier: PLATINUM }, as: HRAdmin, captures: { emp: $.data.id, avail: $.data.available_points, tier: $.data.recognition_tier, life: $.data.lifetime_granted_points, ytd: $.data.ytd_supplemental_wages_cents, ps: $.data.program_status } }
          assert:
            - "${avail} == 0 and ${life} == 0 and ${ytd} == 0"
            - "${tier} == BRONZE and ${ps} == ELIGIBLE"
            - "client-sent computed-field values (9999, PLATINUM) were ignored"

      - name: employee_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Employee.fields.state_code, "validations[priority=4]"]
        distinguishing_aspect: "POST /api/employees without state_code (source: input, no default) is rejected ERR_INVALID_REQUEST; no row is created."
        test_recipe:
          setup: ["department exists"]
          setup_api_calls:
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
          trigger:
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", hire_date: "2021-06-15" }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: nomination_invalid_enum_reason_code_rejected
        claim_type: type_constraints
        grounds: [entities.Nomination.fields.reason_code, "validations[priority=4]"]
        distinguishing_aspect: "reason_code outside {TEAMWORK, INNOVATION, CUSTOMER_SAVE, DELIVERY, MENTORSHIP, OTHER} fails schema validation before any business rule."
        test_recipe:
          setup: ["program ACTIVE, budget, two employees"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "A", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E2", full_name: "B", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 100, reason_code: HEROISM, message: "bad enum", idempotency_key: "ent-enum-1" }, as: Employee, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: ledger_entry_immutable_no_version
        claim_type: immutability
        grounds: [entities.PointLedgerEntry]
        distinguishing_aspect: "PointLedgerEntry is append-only (common_fields: false): it carries id and created_at but no version/updated_at, and no update or delete endpoint exists for it."
        test_recipe:
          setup: ["employee with one approved 100-point nomination"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 100, reason_code: DELIVERY, message: "g", idempotency_key: "ent-imm-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
          trigger:
            - { call: "GET /api/employees/${emp}/ledger-entries", payload: {}, as: HRAdmin, captures: { le0: "$.data[0].id", le0_has_version: "$.data[0].version" } }
          assert:
            - "ledger entry ${le0} has no version field and no updated_at field"
            - "GET /api/employees/${emp}/ledger-entries returns exactly 1 entry (entry_type GRANT_NOMINATION)"

      - name: employee_body_fk_department_not_found
        claim_type: parent_relationships
        grounds: [entities.Employee.fields.department_id, "validations[priority=3]"]
        distinguishing_aspect: "Body-supplied FK department_id that does not exist is rejected ERR_NOT_FOUND (404), distinct from a cross-program reference."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "00000000-0000-0000-0000-000000000000", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: employee_duplicate_ref_rejected
        claim_type: type_constraints
        grounds: [entities.Employee.fields.employee_ref, "validations[priority=11]"]
        distinguishing_aspect: "employee_ref is unique across all employees; a second create reusing it is rejected ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup: ["department exists; one employee with employee_ref DUP already created"]
          setup_api_calls:
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "DUP", full_name: "First", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
          trigger:
            - { call: "POST /api/employees", payload: { employee_ref: "DUP", full_name: "Second", department_id: "${dept}", hire_date: "2022-01-01", state_code: "TX" }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /api/employees returns exactly 1 row (the duplicate was not created)"

      - name: list_pagination_defaults_and_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints."GET /api/employees"]
        distinguishing_aspect: "GET /api/employees without params returns at most 10 rows plus pagination fields limit=10, offset=0, total_count, has_more; the success envelope carries meta.api_request_id and response_type=array."
        test_recipe:
          setup: ["12 employees in one department"]
          setup_api_calls:
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E01", full_name: "E01", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E02", full_name: "E02", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E03", full_name: "E03", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E04", full_name: "E04", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E05", full_name: "E05", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E06", full_name: "E06", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E07", full_name: "E07", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E08", full_name: "E08", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E09", full_name: "E09", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E10", full_name: "E10", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E11", full_name: "E11", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E12", full_name: "E12", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin }
          trigger:
            - { call: "GET /api/employees", payload: {}, as: HRAdmin, captures: { first_ref: "$.data[0].employee_ref" } }
          assert:
            - "response envelope: response_type == array; data has exactly 10 rows"
            - "pagination block: limit == 10, offset == 0, total_count == 12, has_more == true"
            - "meta.api_request_id is present and non-empty"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: nomination_initial_state_pending_review
        claim_type: initial_state
        grounds: [state_machines.Nomination]
        distinguishing_aspect: "A newly submitted nomination starts in PENDING_REVIEW with revision_count 0 and a review_deadline 14 days out."
        test_recipe:
          setup: ["program ACTIVE, budget 10000, nominee + peer nominator in same department"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "A", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E2", full_name: "B", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "hi", idempotency_key: "sm-init-1" }, as: Employee, as_user_id: "${e1}", captures: { st: $.data.status, rc: $.data.revision_count, dl: $.data.review_deadline } }
          assert:
            - "${st} == PENDING_REVIEW and ${rc} == 0"
            - "${dl} == 2026-08-15T00:00:00Z (default clock 2026-08-01T00:00:00Z + 14 days)"

      - name: approve_rejected_nomination_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Nomination.PENDING_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "From terminal REJECTED, approve is rejected ERR_INVALID_STATE_TRANSITION and no award is created."
        test_recipe:
          setup: ["nomination rejected by HRAdmin"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "A", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E2", full_name: "B", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e2: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "hi", idempotency_key: "sm-inv-1" }, as: Employee, as_user_id: "${e1}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/reject", payload: { reason: "no" }, as: HRAdmin }
          trigger:
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "GET /api/awards?nomination_id=${nom} returns 0 rows"
            - "budget reserved_points stays 0 (rejection already released it)"

      - name: mark_shipped_from_pending_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RedemptionOrder]
        distinguishing_aspect: "mark-shipped requires SUBMITTED; from PENDING_SUBMISSION it is rejected ERR_INVALID_STATE_TRANSITION and no ship_date is assigned."
        test_recipe:
          setup: ["employee funded 1000 points, item 100 points, order created but never submitted"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 1000, reason_code: DELIVERY, message: "g", idempotency_key: "sm-sh-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "V", vendor_code: "V1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "M", name: "Mug", category: "MERCH", point_cost: 100, cash_value_cents: 500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "sm-sh-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders/${ord}/mark-shipped", payload: {}, as: VendorOps, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "RedemptionOrder.${ord}.ship_date is null and fulfillment_status == PENDING_SUBMISSION"

      - name: cancel_delivered_order_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RedemptionOrder]
        distinguishing_aspect: "cancel is allowed only from PENDING_SUBMISSION or SUBMITTED; a DELIVERED order (escrow SETTLED) rejects cancel with ERR_INVALID_STATE_TRANSITION — the return path is the only way out."
        test_recipe:
          setup: ["order fully delivered"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 1000, reason_code: DELIVERY, message: "g", idempotency_key: "sm-cd-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "V", vendor_code: "V1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "M", name: "Mug", category: "MERCH", point_cost: 100, cash_value_cents: 500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "sm-cd-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "POST /api/redemption-orders/${ord}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord}/mark-delivered", payload: {}, as: VendorOps }
          trigger:
            - { call: "POST /api/redemption-orders/${ord}/cancel", payload: {}, as: Employee, as_user_id: "${emp}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "escrow_status remains SETTLED"

      - name: revoked_award_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Award]
        distinguishing_aspect: "REVOKED is terminal: a second revoke returns ERR_INVALID_STATE_TRANSITION and posts no second CLAWBACK."
        test_recipe:
          setup: ["award revoked once"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 700, reason_code: DELIVERY, message: "g", idempotency_key: "sm-tl-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin, captures: { award: $.data.award_id } }
            - { call: "POST /api/awards/${award}/revoke", payload: { reason: "first" }, as: HRAdmin }
          trigger:
            - { call: "POST /api/awards/${award}/revoke", payload: { reason: "second" }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "GET /api/employees/${emp}/ledger-entries contains exactly 1 CLAWBACK entry"

      - name: dismissed_flag_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AbuseFlag]
        distinguishing_aspect: "From DISMISSED, both confirm and a second dismiss are rejected ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["flag raised and dismissed"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/abuse-flags", payload: { employee_id: "${emp}", program_id: "${prog}", rule_code: MANUAL_REVIEW, details: { note: "x" } }, as: HRAdmin, captures: { flag: $.data.id } }
            - { call: "POST /api/abuse-flags/${flag}/dismiss", payload: {}, as: HRAdmin }
          trigger:
            - { call: "POST /api/abuse-flags/${flag}/confirm", payload: {}, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "Employee.${emp}.program_status remains ELIGIBLE"

      - name: nomination_auto_expiry_releases_reservation
        claim_type: automatic_transition
        grounds: [state_machines.Nomination.PENDING_REVIEW_to_EXPIRED, entities.Nomination.fields.review_deadline]
        distinguishing_aspect: "Advancing the logical clock past review_deadline (submitted 2026-08-01 + 14 days SLA) auto-expires the nomination to EXPIRED and releases its budget reservation in the same clock sweep."
        test_recipe:
          setup: ["pending nomination for 400 points against a 10000 budget"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, nomination_review_sla_days: 14 }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "A", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E2", full_name: "B", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e2: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 400, reason_code: TEAMWORK, message: "hi", idempotency_key: "sm-exp-1" }, as: Employee, as_user_id: "${e1}", captures: { nom: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: HRAdmin }
            - { call: "GET /api/nominations/${nom}", payload: {}, as: HRAdmin, captures: { st: $.data.status } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { res: $.data.reserved_points } }
          assert:
            - "${st} == EXPIRED"
            - "${res} == 0"

      - name: award_expiry_sweep_and_budget_release
        claim_type: automatic_transition
        grounds: [state_machines.Award.ACTIVE_to_EXPIRED, calculations.points_fifo_allocation]
        distinguishing_aspect: "Advancing the clock 12 months past grant expires the ACTIVE award: EXPIRY ledger entry debits available_points, lifetime_expired_points accrues, and the still-OPEN budget's committed_points is released."
        test_recipe:
          setup: ["employee granted 600 points at 2026-08-01; expires_at 2027-08-01"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
