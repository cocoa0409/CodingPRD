  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_segregation_on_directive_activate
        grounds:
          - validations[priority=4]  # state
          - validations[priority=5]  # business_safety (SoD)
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATED]
        distinguishing_aspect: |
          Priority pair (state) vs (business_safety): a directive in DRAFT (not yet WITNESSED) AND whose physician_attester_user_id equals the executor's id triggers BOTH violations; the lower priority number wins → ERR_INVALID_STATE (priority 4) over ERR_SEGREGATION_OF_DUTIES_VIOLATED (priority 5).
