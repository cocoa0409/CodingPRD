            - call: "POST /findings"
              payload: { exercise_id: "${exM_id}", recovery_group_id: "${g1_id}", severity: "MEDIUM", title: "Bridge roster out of date", description: "Two paged engineers had left the team" }
              as: ResilienceCoordinator
