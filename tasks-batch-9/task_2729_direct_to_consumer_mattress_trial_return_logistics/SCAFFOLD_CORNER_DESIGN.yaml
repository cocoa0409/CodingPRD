  - section: errors
    instances:
      - name: every_single_entity_read_answers_its_own_not_found_error_id
        claim_type: Error Triggerable
        grounds:
          - validations[priority=4]
          - errors.ERR_CUSTOMER_NOT_FOUND
          - errors.ERR_RETURN_CASE_NOT_FOUND
          - errors.ERR_ROUTE_NOT_FOUND
          - errors.ERR_APPOINTMENT_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_EXCHANGE_NOT_FOUND
          - errors.ERR_REFUND_NOT_FOUND
          - errors.ERR_ATTRIBUTION_CLAIM_NOT_FOUND
        distinguishing_aspect: "Priority 4 resolves each {id} segment against its own collection, so nine different unknown-id reads answer nine distinct error_ids at 404 - no shared generic ERR_NOT_FOUND anywhere in the catalog."
        test_recipe:
          setup:
            - "An empty system: no rows in any collection. Every id below is a syntactically valid but unused UUID."
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-0000000000c1"
              payload: {}
              as: TrialSupportAgent
            - call: "GET /return-cases/00000000-0000-0000-0000-0000000000c2"
              payload: {}
              as: TrialSupportAgent
            - call: "GET /pickup-routes/00000000-0000-0000-0000-0000000000c3"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /pickup-appointments/00000000-0000-0000-0000-0000000000c4"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /disposition-assignments/00000000-0000-0000-0000-0000000000c5"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /quality-claims/00000000-0000-0000-0000-0000000000c6"
              payload: {}
              as: TrialSupportAgent
            - call: "GET /comfort-exchanges/00000000-0000-0000-0000-0000000000c7"
              payload: {}
              as: TrialSupportAgent
            - call: "GET /refund-authorizations/00000000-0000-0000-0000-0000000000c8"
              payload: {}
              as: PlatformAdmin
            - call: "GET /attribution-claims/00000000-0000-0000-0000-0000000000c9"
              payload: {}
              as: PlatformAdmin
          assert:
            - "all nine responses have code == 404"
            - "the error_ids are, in order: ERR_CUSTOMER_NOT_FOUND, ERR_RETURN_CASE_NOT_FOUND, ERR_ROUTE_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_EXCHANGE_NOT_FOUND, ERR_REFUND_NOT_FOUND, ERR_ATTRIBUTION_CLAIM_NOT_FOUND"
            - "each response body follows the error envelope: response_type == error and data carries error_id plus message"

      - name: an_unknown_retail_partner_id_in_the_body_returns_partner_not_found
        claim_type: Error Triggerable
        grounds:
          - validations[priority=5]
          - errors.ERR_PARTNER_NOT_FOUND
        distinguishing_aspect: "Priority 5 validates body foreign keys in the endpoint's declared input order, and the retail-partner reference has its own error_id: ERR_PARTNER_NOT_FOUND at 404, distinct from the ERR_CATALOG_NOT_FOUND raised by a bad model_id on the same endpoint."
        test_recipe:
          setup:
            - "One QUEEN MattressModel and one Customer; no RetailPartner rows at all."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-X2", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "x2@example.com", full_name: "Xan Two", household_hash: "HH-X2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "RETAIL_PARTNER", gross_price_cents: 120000, retail_partner_id: "00000000-0000-0000-0000-0000000000f1" }
              as: TrialSupportAgent
          assert:
            - "response code == 404 with data.error_id == ERR_PARTNER_NOT_FOUND"
            - "GET /trial-orders?customer_id=${cust_id} returns total_count == 0"

      - name: a_request_without_auth_headers_returns_unauthenticated
        claim_type: Error Triggerable
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 outranks everything, including the 404 family: a request to a non-existent customer id with no X-User-Role / X-User-ID headers answers 401 ERR_UNAUTHENTICATED, not 404."
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            # the harness issues this request with BOTH the X-User-Role and X-User-ID headers omitted
            - call: "GET /customers/00000000-0000-0000-0000-0000000000d1"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response code == 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the 404 that the same path would produce with valid headers is never reached"

      - name: inspecting_a_return_case_before_pickup_returns_invalid_return_state
        claim_type: Error Triggerable
        grounds:
          - validations[priority=8]
          - errors.ERR_INVALID_RETURN_STATE
        distinguishing_aspect: "Grading requires the unit in hand: inspect on a REQUESTED case (never scheduled, never collected) answers 409 ERR_INVALID_RETURN_STATE and stamps no grade, no offsets and no provisional refund."
        test_recipe:
          setup:
            - "One QUEEN MattressModel, one Customer with a DTC order delivered 2026-08-01 and a ReturnCase opened 2026-09-10 in REQUESTED."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-X4", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "x4@example.com", full_name: "Xia Four", household_hash: "HH-X4" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
