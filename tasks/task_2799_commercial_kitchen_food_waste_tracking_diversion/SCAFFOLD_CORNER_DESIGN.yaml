        distinguishing_aspect: "ACTIVE -> MAINTENANCE -> ACTIVE is a declared reversible pair, and the return trip may refresh calibration_due_at in the same call."
        test_recipe:
          setup: ["Site HK-01 with an ACTIVE PREP-1 station whose calibration is due 2026-09-01."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
