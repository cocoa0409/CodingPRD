          - state_machines.Enrollment.PENDING_CLINICAL_REVIEW_to_AWAITING_TRANSITION_REVIEW
          - state_machines.Enrollment.AWAITING_TRANSITION_REVIEW_to_PENDING_CLINICAL_REVIEW
          - state_machines.ClinicalReview.CONDUCTED_to_SUBMITTED
