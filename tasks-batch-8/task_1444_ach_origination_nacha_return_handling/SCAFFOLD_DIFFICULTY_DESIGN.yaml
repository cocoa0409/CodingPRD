# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# ACH Origination & NACHA Return Handling (ODFI)
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: unauth_rate_trailing_vs_mtd_divergence
        grounds:
          - calculations.unauthorized_return_rate
          - entities.Originator.fields.unauth_rate_bps_trailing
          - entities.ReturnRateSnapshot.fields.rate_bps_trailing_60d
          - entities.ReturnRateSnapshot.fields.rate_bps_mtd
        distinguishing_aspect: |
          Risk-scoring domain on Originator: the SAME returns/debits yield
          rate_bps_trailing_60d == 98 (half-open 60-day window includes the July
          return and all 102 debits) but rate_bps_mtd == 0 (August month-to-date
          window excludes the July return); breach is driven by the trailing
          variant alone. Window boundary semantics (exclusive vs inclusive lower
          bound) decide the numbers.
        test_recipe:
          setup:
            - "Originator ACTIVE (limit 100000000, discount 0), CCD allowed"
            - "CutoffWindow NEXT_DAY 00:00-23:00 (per_entry 60, file 200, surcharge 100)"
            - "July phase at 2026-07-15 (Wed): file F1 effective 2026-07-15 with 40 DEBIT entries of 1000 cents, released, dispatched, settled; entry[0] returned R07 at 2026-07-15T11:00Z (auto-recompute 1/40 = 250 bps opens a RATE_BREACH RiskCase — harmless)"
            - "August phase at 2026-08-10 (Mon): file F2 effective 2026-08-10 with 62 DEBIT entries of 1000 cents, released and dispatched (first_transmitted_at set) but NOT settled"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Acme Payroll", sec_codes_allowed: ["CCD", "PPD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 100000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-07-15" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f1_id: "$.data.id", f1_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f1_id}/entries"
              payload:
                expected_file_version: "${f1_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-000", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-001", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-002", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-003", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-004", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-005", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-006", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-007", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "ac-008", receiver_routing: "123456789" }
