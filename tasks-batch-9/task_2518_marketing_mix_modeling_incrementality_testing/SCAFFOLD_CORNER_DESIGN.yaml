          - "state_machines BudgetScenario terminal_states [INVALIDATED] with the note - optimize, revert-optimization and approve all return ERR_BUDGET_SCENARIO_INVALID_STATE from it"
          - "state_machines ModelRun publish CASCADE HOP 1..HOP 3 - the superseded run's OPTIMIZED or APPROVED scenarios become INVALIDATED"
          - "state_machines BudgetScenario OPTIMIZED -> INVALIDATED side_effects - computed allocation and projection fields are FROZEN AS-IS (not reset)"
          - "validations priority 40 (state) - ERR_BUDGET_SCENARIO_INVALID_STATE (409)"
        distinguishing_aspect: |
          Once a second publication supersedes the run behind an OPTIMIZED scenario, the scenario becomes
          INVALIDATED and every one of its three actions is refused with 409
          ERR_BUDGET_SCENARIO_INVALID_STATE - and unlike revert or freeze, invalidation leaves the
