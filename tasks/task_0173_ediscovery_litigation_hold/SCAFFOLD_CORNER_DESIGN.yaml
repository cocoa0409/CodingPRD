            - call: "POST /collection-scopes"
              payload: { matter_id: "${m_id}", custodian_id: "${c1_id}", source_label: "Mbx1", range_start: "2026-06-01T00:00:00Z", range_end: "2026-06-15T00:00:00Z", expected_doc_count: 1 }
