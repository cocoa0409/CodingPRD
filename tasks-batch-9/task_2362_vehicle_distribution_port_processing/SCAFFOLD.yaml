  - method: POST
    path: /vpc/vehicles/{vehicleId}/repair-orders
    description: "Create a repair estimate. calculations.repair_authorization_tier decides AUTO (auto-authorized) versus ESCALATED at creation."
    roles: [DamageSurveyor]
    code: 201
    input: ["description", "estimate_cents", "carrier_claim_id?"]
    output: RepairOrder
    side_effects:
      - "authorization_tier := AUTO -> status AUTHORIZED, authorized_by_user_id := X-User-ID, vehicle.damage_status SURVEY_DAMAGE_OPEN -> REPAIR_AUTHORIZED"
      - "authorization_tier := ESCALATED -> status ESCALATED, authorized_by_user_id stays null, vehicle.damage_status unchanged"

  - method: GET
    path: /vpc/repair-orders/{repairOrderId}
    description: "Read one repair order."
    roles: *ops_roles
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: GET
    path: /vpc/repair-orders
    description: "List repair orders, optionally filtered by unit, recovery claim or status."
    roles: *ops_roles
    code: 200
    input: ["vehicle_id?", "carrier_claim_id?", "status?", "authorization_tier?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []

  - method: POST
    path: /vpc/repair-orders/{repairOrderId}/authorize
    description: "Adjudicate an escalated repair: AUTHORIZE or REJECT."
    roles: [DistributionManager]
    code: 200
    input: ["decision"]
    output: RepairOrder
    side_effects:
      - "decision AUTHORIZE -> status ESCALATED -> AUTHORIZED, authorized_by_user_id := X-User-ID, vehicle.damage_status -> REPAIR_AUTHORIZED"
      - "decision REJECT -> status ESCALATED -> REJECTED; the unit stays damage-blocked"

  - method: POST
    path: /vpc/repair-orders/{repairOrderId}/complete
    description: "Complete an authorized repair at its actual cost; may latch the linked claim onto the REPAIR_ACTUAL basis."
    roles: [DamageSurveyor]
    code: 200
    input: ["actual_cost_cents"]
    output: RepairOrder
    side_effects:
      - "status AUTHORIZED -> COMPLETED; vehicle.damage_status REPAIR_AUTHORIZED -> REPAIRED; damage_cleared_at and blocked_credit_days stamped"
      - "center.repair_spend_cents recomputed"
      - "linked non-terminal CarrierClaim: recoverable_basis -> REPAIR_ACTUAL and recoverable_amount_cents recomputed"

