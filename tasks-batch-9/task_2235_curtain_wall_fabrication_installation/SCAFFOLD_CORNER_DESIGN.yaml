  - name: overtime_multiplier_and_elevation_factor_applied_per_day
    claim_type: constants_applied
    grounds:
    - calculations.zone_field_labor_cost
    - entities.CrewDayLog.fields.straight_person_hours
    - entities.CrewDayLog.fields.overtime_person_hours
    - entities.CrewDayLog.fields.day_cost_cents
    distinguishing_aspect: 'The three labour constants are each visible in one posted day: a 4-crew 10.0-hour shift splits
      into 32.0 straight and 8.0 overtime person-hours (STANDARD_SHIFT_HOURS 8.0), prices at 32*9800 + 8*9800*1.5 = 431200
      and is then multiplied by HIGH_ELEVATION_FACTOR 1.15 because height_m 24.0 exceeds the 20.0 threshold, giving day_cost_cents
      495880 - while the identical day on an 18.0 m zone stays at 431200.'
    test_recipe:
      setup:
      - logical clock 2026-08-10T09:00:00Z; package decided UNITIZED with base_labor_rate_cents_per_hour 9800
      - zone zh at height 24.0 and zone zl at height 18.0, both with budget_crew_hours 320.0
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
