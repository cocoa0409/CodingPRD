            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Travel Date", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-TD", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v1: "$.data.version" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-30", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v1}" }
              as: ProgramAdmin
              captures: { ok_bk: "$.data.id" }
            - call: "GET /award-inventory-windows/${win_id}"
              payload: {}
              as: ProgramAdmin
              captures: { win_v2: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-10-01", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v2}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the first trigger returns HTTP 201"
            - "AwardBooking.${ok_bk}.travel_date == \"2026-09-30\""
            - "AwardBooking.${ok_bk}.quoted_miles == 22500"
            - "the third trigger returns HTTP 422 with data.error_id == ERR_TRAVEL_DATE_OUT_OF_WINDOW"
            - "AwardInventoryWindow.${win_id}.seats_held == 1"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 1000"
            - "GET /award-bookings?window_id=${win_id} returns total_count 1"

      - name: individually_legal_commitments_breach_the_issuer_cap_in_aggregate
        claim_type: aggregate_validation
        grounds:
          - validations[priority=34]
          - errors.ERR_ISSUER_CAP_EXCEEDED
          - entities.CoBrandIssuer.fields.aggregate_committed_miles
          - entities.CoBrandIssuer.fields.status
        distinguishing_aspect: "Each commitment (3000000 then 2000001) is far below the 5000000 cap on its own; only their sum breaches it, so the SECOND ratification fails with ERR_ISSUER_CAP_EXCEEDED (409) while a 2000000 third agreement ratifies and lands the aggregate exactly ON the cap - which also trips the 90 percent utilization alert and suspends the issuer with CAP_BREACH."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one ACTIVE CoBrandIssuer with annual_mile_purchase_cap_miles 5000000 (so the 9000 bps utilization alert sits at 4500000)."
            - "Agreement A: term 2026-09-01..2027-08-31, committed_volume_miles 3000000, already RATIFIED."
            - "Agreement B: term 2027-09-01..2028-08-31, committed_volume_miles 2000001, in ISSUER_REVIEW."
            - "Agreement C: term 2028-09-01..2029-08-31, committed_volume_miles 2000000, in ISSUER_REVIEW."
            - "All three negotiated by pm-1 so a distinct co-1 may ratify."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Aggregate Cap", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 3000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${a_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${a_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2027-09-01"
                term_end_date: "2028-08-31"
                committed_volume_miles: 2000001
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { b_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${b_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2028-09-01"
                term_end_date: "2029-08-31"
                committed_volume_miles: 2000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { c_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${c_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /mile-sale-agreements/${b_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /mile-sale-agreements/${c_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
          assert:
            - "after the setup, CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 3000000 and status == ACTIVE"
            - "the first trigger returns HTTP 409 with data.error_id == ERR_ISSUER_CAP_EXCEEDED"
            - "MileSaleAgreement.${b_id}.status == ISSUER_REVIEW"
            - "MileSaleAgreement.${b_id}.ratified_by_user_id == null"
            - "the second trigger returns HTTP 200"
            - "MileSaleAgreement.${c_id}.status == RATIFIED"
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 5000000"
            - "CoBrandIssuer.${issuer_id}.status == SUSPENDED"
            - "CoBrandIssuer.${issuer_id}.suspension_reason == CAP_BREACH"

      - name: saver_allotment_blocks_a_fourth_saver_seat_while_flex_still_books
        claim_type: conditional_validation
        grounds:
          - validations[priority=29]
          - errors.ERR_SAVER_ALLOTMENT_EXHAUSTED
          - entities.AwardInventoryWindow.fields.saver_seat_share_bps
          - entities.AwardInventoryWindow.fields.saver_seats_consumed
        distinguishing_aspect: "The allotment rule is conditional on fare_class: with 3000 bps of 10 authorized seats the SAVER allotment is 3, so a fourth SAVER seat fails with ERR_SAVER_ALLOTMENT_EXHAUSTED (409) while a FLEX seat on the very same window succeeds - proving the check is not a plain seat-count check (7 raw seats remain)."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE (holds do not debit miles)."
            - "One AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 10, saver_seat_share_bps 3000, already holding one 3-seat SAVER booking."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Saver", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-SAVER", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10, saver_seat_share_bps: 3000 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v1: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 3, fare_class: "SAVER", expected_window_version: "${win_v1}" }
              as: ProgramAdmin
              captures: { saver_bk: "$.data.id" }
            - call: "GET /award-inventory-windows/${win_id}"
              payload: {}
              as: ProgramAdmin
              captures: { win_v2: "$.data.version" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-11", seats: 1, fare_class: "SAVER", expected_window_version: "${win_v2}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-11", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v2}" }
              as: ProgramAdmin
              captures: { flex_bk: "$.data.id" }
          assert:
            - "AwardBooking.${saver_bk}.chart_miles_per_seat == 12500"
            - "AwardBooking.${saver_bk}.quoted_miles == 33750"
            - "AwardBooking.${saver_bk}.cash_surcharge_cents == 1680"
            - "AwardInventoryWindow.${win_id}.saver_seats_consumed == 3"
            - "the first trigger returns HTTP 409 with data.error_id == ERR_SAVER_ALLOTMENT_EXHAUSTED"
            - "the second trigger returns HTTP 201"
            - "AwardBooking.${flex_bk}.quoted_miles == 22500"
            - "AwardInventoryWindow.${win_id}.saver_seats_consumed == 3"
            - "AwardInventoryWindow.${win_id}.seats_held == 4"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 4000"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == OPEN"

      - name: suspended_reciprocity_short_circuits_before_any_capacity_arithmetic
        claim_type: cascading_validation
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - validations[priority=28]
          - errors.ERR_RECIPROCITY_SUSPENDED
        distinguishing_aspect: "The booking violates three checks at once - suspended partner (24), CLOSED window (25) and no free seat (28) - and the partner-level gate must answer first, so the response is ERR_RECIPROCITY_SUSPENDED (409) and never ERR_AWARD_WINDOW_CLOSED or ERR_AWARD_SEATS_UNAVAILABLE."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE."
            - "One PartnerAirline LH with reciprocity_mode SUSPENDED."
            - "One AwardInventoryWindow JFK-FRA ECONOMY 2026-09-01..2026-09-30 with authorized_seats 1, fully held, so load_factor_bps is 10000 and capacity_control_state is CLOSED."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Cascade Validation", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-CASC", home_region: "EMEA" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /partner-airlines"
              payload: { program_id: "${prog_id}", iata_code: "LH", settlement_rate_centicents_per_mile: 100, reciprocity_mode: "SUSPENDED" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { air_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-FRA", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 1 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v1: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v1}" }
              as: ProgramAdmin
              captures: { first_bk: "$.data.id" }
            - call: "GET /award-inventory-windows/${win_id}"
              payload: {}
              as: ProgramAdmin
              captures: { win_v2: "$.data.version", closed_state: "$.data.capacity_control_state" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", partner_airline_id: "${air_id}", travel_date: "2026-09-11", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v2}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 10000"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == CLOSED"
            - "the trigger returns HTTP 409 with data.error_id == ERR_RECIPROCITY_SUSPENDED"
            - "data.error_id != ERR_AWARD_WINDOW_CLOSED"
            - "data.error_id != ERR_AWARD_SEATS_UNAVAILABLE"
            - "AwardInventoryWindow.${win_id}.seats_held == 1"
            - "GET /award-bookings?window_id=${win_id} returns total_count 1"

      - name: frozen_member_outranks_the_fiscal_balance_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=12]
          - validations[priority=31]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_member_state_beats_insufficient_miles_fiscal
          rationale: "That §1.8 instance violates both rules in one request and asserts ERR_MEMBER_FROZEN (409) rather than ERR_INSUFFICIENT_MILES (402)."

      - name: past_window_temporal_outranks_the_overlap_constraint
        claim_type: priority_conflict
        grounds:
          - validations[priority=15]
          - validations[priority=19]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / promotion_window_in_past_temporal_beats_overlap_constraint
          rationale: "That §1.8 instance violates priority 15 and priority 19 together and asserts ERR_WINDOW_IN_PAST (422) over ERR_PROMOTION_WINDOW_OVERLAP (409)."

      - name: ledger_write_depends_on_the_parent_programs_recognition_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=13]
          - errors.ERR_PERIOD_LOCKED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mile_transaction_blocked_when_program_recognition_state_locked
          rationale: "That §1.8 instance tests both sides of the cross-entity dependency: LOCKED blocks the earn with ERR_PERIOD_LOCKED and the unlocked program accepts it."

  # ===================================================================
  - section: endpoints
    instances:

      - name: partner_airline_create_read_list_round_trip_applies_declared_defaults
        claim_type: standard_crud
        grounds:
          - endpoints[POST /partner-airlines]
          - endpoints[GET /partner-airlines/{airlineId}]
          - endpoints[GET /partner-airlines]
          - entities.PartnerAirline.fields.reciprocity_mode
          - entities.PartnerAirline.fields.award_pricing_mode
        distinguishing_aspect: "Creating one airline with only the three required inputs must default reciprocity_mode to FULL and award_pricing_mode to FIXED_CHART, zero both settlement counters, leave last_settlement_run_at null, and the same values must come back on both the single read and the filtered list - so a create-side default that the read path recomputes differently is caught."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, with no partner airlines."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles CRUD", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /partner-airlines"
              payload: { program_id: "${prog_id}", iata_code: "AF", settlement_rate_centicents_per_mile: 150 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { air_id: "$.data.id" }
            - call: "GET /partner-airlines/${air_id}"
              payload: {}
              as: RevenueAccountant
            - call: "GET /partner-airlines?program_id=${prog_id}&reciprocity_mode=FULL"
              payload: {}
              as: RevenueAccountant
          assert:
            - "the create returns HTTP 201"
            - "PartnerAirline.${air_id}.iata_code == \"AF\""
            - "PartnerAirline.${air_id}.settlement_rate_centicents_per_mile == 150"
            - "PartnerAirline.${air_id}.reciprocity_mode == FULL"
            - "PartnerAirline.${air_id}.award_pricing_mode == FIXED_CHART"
            - "PartnerAirline.${air_id}.net_settlement_balance_cents == 0"
            - "PartnerAirline.${air_id}.settled_booking_count == 0"
            - "PartnerAirline.${air_id}.last_settlement_run_at == null"
            - "PartnerAirline.${air_id}.version == 1"
            - "the single read returns HTTP 200 with the identical field values"
            - "GET /partner-airlines?program_id=${prog_id}&reciprocity_mode=FULL returns total_count 1 with has_more false"

      - name: capacity_control_pin_to_closed_blocks_bookings_until_pinned_back_open
        claim_type: action_endpoint
        grounds:
          - endpoints[PATCH /award-inventory-windows/{windowId}/capacity-control]
          - state_machines.AwardInventoryWindow.OPEN_to_CLOSED_manual
          - errors.ERR_AWARD_WINDOW_CLOSED
        distinguishing_aspect: "A manual CLOSED pin on an EMPTY window (load_factor_bps 0) blocks bookings with ERR_AWARD_WINDOW_CLOSED (409) even though every seat is free, and the reverse pin is only admissible because load_factor_bps is under 7500 - after which the same payload prices normally at 22500."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE."
            - "One empty AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 10, capacity_control_state OPEN."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Pin", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-PIN", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id" }
          trigger:
            - call: "PATCH /award-inventory-windows/${win_id}/capacity-control"
              payload: { capacity_control_state: "CLOSED" }
              as: ProgramAdmin
              captures: { win_v2: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v2}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "PATCH /award-inventory-windows/${win_id}/capacity-control"
              payload: { capacity_control_state: "OPEN" }
              as: ProgramAdmin
              captures: { win_v3: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v3}" }
              as: ProgramAdmin
              captures: { bk_id: "$.data.id" }
          assert:
            - "the first trigger returns HTTP 200 and AwardInventoryWindow.${win_id}.capacity_control_state == CLOSED"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 0"
            - "the second trigger returns HTTP 409 with data.error_id == ERR_AWARD_WINDOW_CLOSED"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "the third trigger returns HTTP 200 and capacity_control_state == OPEN"
            - "the fourth trigger returns HTTP 201"
            - "AwardBooking.${bk_id}.quoted_miles == 22500"
            - "AwardBooking.${bk_id}.demand_multiplier_bps_applied == 9000"
            - "AwardInventoryWindow.${win_id}.seats_held == 1"

      - name: run_epoch_on_a_quiet_program_reports_every_counter_as_zero
        claim_type: computed_read
        grounds:
          - endpoints[POST /_ops/run-epoch]
        distinguishing_aspect: "With nothing scheduled or held, the epoch report must be all zeros with epoch_at echoing the logical clock exactly - an implementation that counts rows it merely inspected (or advances the program) fails on holds_expired, campaigns_launched or windows_recomputed."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, with one member, no campaigns, no windows, no bookings, no agreements and no notices."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Quiet", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-QUIET", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
          trigger:
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
              captures: { epoch_at: "$.data.epoch_at" }
          assert:
            - "the trigger returns HTTP 200"
            - "the response epoch_at == \"2026-08-01T00:00:00Z\""
            - "the response holds_expired == 0"
            - "the response campaigns_launched == 0"
            - "the response campaigns_ended == 0"
            - "the response status_matches_lapsed == 0"
            - "the response notices_advanced == 0"
            - "the response agreements_expired == 0"
            - "the response windows_recomputed == 0"
            - "LoyaltyProgram.${prog_id}.current_period == \"2026-08\""
            - "LoyaltyProgram.${prog_id}.revenue_recognition_state == OPEN"
            - "MemberAccount.${mem_id}.version == 1"

      - name: high_reaction_notice_announces_only_when_grandfathering_is_attached
        claim_type: conditional_action
        grounds:
          - endpoints[POST /program-change-notices/{noticeId}/announce]
          - validations[priority=35]
          - errors.ERR_REACTION_RISK_EXCEEDED
          - calculations.member_reaction_index
        distinguishing_aspect: "An AWARD_PRICING change 19 days out scores the maximum 100 and is blocked with ERR_REACTION_RISK_EXCEEDED (409); the identical notice with grandfather_until attached both passes the gate and scores 85 instead of 100, so the relief is applied to the index and not merely used as a bypass flag."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, with no elite members so exposed_member_count is 0."
            - "Notice N1: AWARD_PRICING, effective 2026-08-20T00:00:00Z, no grandfathering, status DRAFT."
            - "Notice N2: AWARD_PRICING, effective 2026-08-20T00:00:00Z, grandfather_until 2026-08-25T00:00:00Z, status DRAFT."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so notice_days is 19 and the lead-time factor is 20000 bps."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Reaction", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id", prog_v1: "$.data.version" }
            - call: "POST /program-change-notices"
              payload: { program_id: "${prog_id}", change_type: "AWARD_PRICING", effective_at: "2026-08-20T00:00:00Z", expected_program_version: "${prog_v1}" }
              as: ProgramAdmin
