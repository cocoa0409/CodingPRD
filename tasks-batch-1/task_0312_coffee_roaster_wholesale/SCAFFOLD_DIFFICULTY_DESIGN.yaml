# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Coffee Roaster Wholesale — 9 rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_roast_yield_planned_vs_actual_diverges
        grounds:
          - calculations.roasted_weight_yield
          - state_machines.RoastBatch.PLANNED_to_ROASTING
          - state_machines.RoastBatch.COOLING_to_COMPLETED
          - entities.RoastBatch.fields.planned_roasted_kg
          - entities.RoastBatch.fields.actual_roasted_kg
        distinguishing_aspect: |
          Dual-variant on the RoastBatch entity domain: planned_roasted_kg (forward estimate
          from expected_shrink_bps) and actual_roasted_kg (measured at complete) are computed
          from the same batch but diverge — 17.000 planned vs 15.300 actual for identical green.
        test_recipe:
          setup:
            - "A RoastProfile with expected_shrink_bps=1500 exists; a Product bound to it; a GreenLot with 50 kg on hand."
            - "A RoastBatch planned with planned_green_kg=20 (planned_roasted_kg=17.000), then run with actual_green_kg=18.0 and actual_roasted_kg=15.3."
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "Filter City", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 200 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-FC", name: "Filter City Blend", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1850, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Ethiopia Yirgacheffe", lot_ref: "ETH-001", received_kg: 50, par_level_kg: 10 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 20, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id, rb_planned_roasted: $.data.planned_roasted_kg }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 18.0 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
          trigger:
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 15.3 }
              as: RoasterStaff
              captures: { rb_actual_roasted: $.data.actual_roasted_kg, rb_actual_shrink: $.data.actual_shrink_bps }
          assert:
            - "RoastBatch.${rb_id}.planned_roasted_kg == 17.000"
            - "RoastBatch.${rb_id}.actual_roasted_kg == 15.300"
            - "RoastBatch.${rb_id}.actual_shrink_bps == 1500"
            - "RoastBatch.${rb_id}.planned_roasted_kg != RoastBatch.${rb_id}.actual_roasted_kg"

      - name: dual_account_balance_posted_vs_projected_diverges
        grounds:
          - calculations.account_outstanding_balance
          - state_machines.Order.UNBILLED_to_INVOICED
          - entities.WholesaleAccount.fields.outstanding_balance_cents
          - validations[priority=13]
        distinguishing_aspect: |
          Dual-variant on the WholesaleAccount entity domain (distinct from RoastBatch): the posted
          balance read off the account is 150000, but the projected balance used for the credit
          precheck at invoice time adds the candidate order's total (210000), so the credit decision
          reflects a different number than the account read.
        test_recipe:
          setup:
            - "Account with credit_limit_cents=200000, net_terms 30, GOLD-ish tier 0 bps; one prior FULFILLED order already invoiced for 150000 (posted balance 150000)."
            - "A second FULFILLED order with total_cents=60000 awaiting invoice."
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "FLAT0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Blue Bottle", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 200000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "Espresso Dark", roast_level: "DARK", expected_shrink_bps: 1600, charge_temp_c: 210 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-ESP", name: "Espresso", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 30 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Brazil Cerrado", lot_ref: "BRA-001", received_kg: 200, par_level_kg: 10 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 120, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 120 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 100 }
              as: RoasterStaff
              captures: { rb_done_v: $.data.version }
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl_id: "$.data[0].id", rl_v: "$.data[0].version"}
            # ---- first order: 75kg @ 2000 = 150000, fulfill + invoice ----
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 75 } ] }
              as: SalesRep
              captures: { ord1_id: $.data.id }
            - call: "POST /orders/${ord1_id}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 75, expected_roasted_lot_version: "${rl_v}" }
              as: SalesRep
              captures: { ful1_id: $.data.id }
            - call: "POST /fulfillments/${ful1_id}/ship"
              payload: {}
              as: RoasterStaff
            - call: "POST /orders/${ord1_id}/invoice"
              payload: {}
              as: SalesRep
              captures: { inv1_id: $.data.id }
            # ---- second order: 30kg @ 2000 = 60000, fulfill, leave for invoice trigger ----
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl2_v: "$.data[0].version"}
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 30 } ] }
              as: SalesRep
              captures: { ord2_id: $.data.id }
            - call: "POST /orders/${ord2_id}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 25, expected_roasted_lot_version: "${rl2_v}" }
              as: SalesRep
              captures: { ful2_id: $.data.id }
            - call: "POST /fulfillments/${ful2_id}/ship"
              payload: {}
              as: RoasterStaff
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: SalesRep
              captures: { posted_balance: $.data.outstanding_balance_cents }
          assert:
            - "WholesaleAccount.${acct_id}.outstanding_balance_cents == 150000"
            - "Order.${ord2_id}.total_cents == 60000"
            - "Posted balance 150000 + candidate 60000 = 210000 is the projected value the invoice precheck would evaluate (exceeds credit_limit 200000)."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pricing_round_per_line_then_sum_order_pinned
        grounds:
          - calculations.order_pricing
          - state_machines.Order.fulfillment_status
          - entities.Order.fields.subtotal_cents
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: round-per-line-then-sum yields subtotal 1333
          (500 + 833) whereas sum-then-round would yield 1332; the scaffold pins round-per-line-first,
          so total after a 1200 bps discount is 1173, not the 1172 the wrong order produces.
        test_recipe:
          setup:
            - "Tier GOLD discount_bps=1200; product base_price 333 cents/kg; an account on GOLD."
            - "Order with two lines: 1.5 kg (raw 499.5) and 2.5 kg (raw 832.5) of the product."
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "GOLD", discount_bps: 1200, min_monthly_kg: 100, freshness_max_days: 30 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Ritual", price_tier_id: "${tier_id}", net_terms_days: 15, credit_limit_cents: 500000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "House", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CHEAP", name: "Daily", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 333, freshness_window_days: 21 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 1.5 }, { product_id: "${prod_id}", qty_kg: 2.5 } ] }
              as: SalesRep
              captures: { ord_id: $.data.id, ord_subtotal: $.data.subtotal_cents, ord_total: $.data.total_cents }
          assert:
            - "Order.${ord_id}.subtotal_cents == 1333"
            - "Order.${ord_id}.discount_cents == 160"
            - "Order.${ord_id}.total_cents == 1173"

      - name: freshness_eligibility_nested_min_three_inputs
        grounds:
          - calculations.freshness_eligibility
          - validations[priority=8]
          - entities.Product.fields.freshness_window_days
          - entities.PriceTier.fields.freshness_max_days
        distinguishing_aspect: |
          Mode (a) >=3-input formula with a nested min across two entities: eligibility = age_days <=
          min(product.freshness_window_days=14, tier.freshness_max_days=10); at age_days=10 it is
          eligible (boundary inclusive), exercising a different combinatorial axis than the rounding mode.
        test_recipe:
          setup:
            - "Tier freshness_max_days=10; product freshness_window_days=14; a roasted lot stamped roast_date 2026-06-01; clock at 2026-06-11 (age 10 days)."
            - "An open order on the account with a line for the product."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RoasterStaff
            - call: "POST /price-tiers"
              payload: { code: "FRESH10", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 10 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Stumptown", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "Light Filter", roast_level: "LIGHT", expected_shrink_bps: 1300, charge_temp_c: 195 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-LF", name: "Light Filter", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2200, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Kenya AA", lot_ref: "KEN-001", received_kg: 100, par_level_kg: 10 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 30, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 30 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 25 }
              as: RoasterStaff
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl_id: "$.data[0].id", rl_v: "$.data[0].version"}
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 5 } ] }
              as: SalesRep
              captures: { ord_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: RoasterStaff
          trigger:
            - call: "POST /orders/${ord_id}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 5, expected_roasted_lot_version: "${rl_v}" }
              as: SalesRep
              captures: { ful_id: $.data.id }
          assert:
            - "Fulfillment.${ful_id}.status == RESERVED"
            - "Fulfillment.${ful_id}.roast_date == 2026-06-01T00:00:00.000Z"
            - "Reservation succeeds because age_days 10 <= min(14, 10) = 10 (boundary inclusive)."

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: roast_batch_cyclic_reroast_loop
        grounds:
          - state_machines.RoastBatch.COOLING_to_ROASTING
          - state_machines.RoastBatch.ROASTING_to_COOLING
          - entities.RoastBatch.fields.status
        distinguishing_aspect: |
          Cyclic shape on RoastBatch: COOLING->ROASTING (reroast) loops back to a prior state, then
          ROASTING->COOLING again — a genuine A->B->A cycle, not a linear pipeline, on the RoastBatch entity.
        test_recipe:
          setup:
            - "A RoastBatch in COOLING (planned, started, dropped)."
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "Dev Roast", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 200 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-DEV", name: "Dev", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1900, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Colombia Huila", lot_ref: "COL-001", received_kg: 60, par_level_kg: 10 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 20, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 20 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
          trigger:
            - call: "POST /roast-batches/${rb_id}/reroast"
              payload: {}
              as: RoasterStaff
              captures: { rb_status_after: $.data.status }
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
              captures: { rb_status_back: $.data.status }
          assert:
            - "After reroast, RoastBatch.${rb_id}.status == ROASTING (looped back from COOLING)"
            - "After the second drop, RoastBatch.${rb_id}.status == COOLING (cycle re-entered)"

      - name: order_parallel_fulfillment_and_billing_dimensions
        grounds:
          - state_machines.Order.fulfillment_status
          - state_machines.Order.billing_status
          - state_machines.Order.UNBILLED_to_INVOICED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.billing_status
        distinguishing_aspect: |
          Parallel state dimensions on the Order entity (distinct from RoastBatch's cycle): fulfillment_status
          and billing_status evolve independently — an order can be PARTIALLY_FULFILLED while UNBILLED, then
          become INVOICED while fulfillment_status stays PARTIALLY_FULFILLED.
        test_recipe:
          setup:
            - "An order for 10 kg of a product; a roasted lot with 25 kg available; only 6 kg shipped (PARTIALLY_FULFILLED), still UNBILLED."
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "STD0", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
              as: SalesRep
              captures: { tier_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Counter Culture", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
            - call: "POST /roast-profiles"
              payload: { name: "Med", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 205 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-MED", name: "Med", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 2000, freshness_window_days: 60 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Guatemala", lot_ref: "GUA-001", received_kg: 100, par_level_kg: 10 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 30, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 30 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 25 }
              as: RoasterStaff
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl_id: "$.data[0].id", rl_v: "$.data[0].version"}
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [ { product_id: "${prod_id}", qty_kg: 10 } ] }
              as: SalesRep
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/fulfillments"
              payload: { product_id: "${prod_id}", roasted_lot_id: "${rl_id}", allocated_kg: 6, expected_roasted_lot_version: "${rl_v}" }
              as: SalesRep
              captures: { ful_id: $.data.id }
            - call: "POST /fulfillments/${ful_id}/ship"
              payload: {}
              as: RoasterStaff
          trigger:
            - call: "POST /orders/${ord_id}/invoice"
              payload: {}
              as: SalesRep
              captures: { inv_id: $.data.id }
          assert:
            - "Order.${ord_id}.fulfillment_status == PARTIALLY_FULFILLED (6 of 10 kg shipped)"
            - "Order.${ord_id}.billing_status == INVOICED (billing advanced independently)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_roast_cascade_green_then_roastedlot_creation
        grounds:
          - state_machines.RoastBatch.PLANNED_to_ROASTING
          - state_machines.RoastBatch.COOLING_to_COMPLETED
          - calculations.green_reorder_status
          - calculations.roasted_lot_availability
          - entities.RoastedLot.fields.produced_kg
        distinguishing_aspect: |
          Depth-3 cascade from the RoastBatch start/complete chain: start mutates GreenLot consumption,
          which itself flips GreenLot.reorder_status to BELOW_PAR (link 2 caused by link 1), and complete
          then creates a RoastedLot whose availability is derived (link 3) — each hop caused by the prior.
        test_recipe:
          setup:
            - "GreenLot received 30 kg, par_level_kg 25; a batch planned for 28 kg of green; on start it consumes 28, dropping available below par."
          setup_api_calls:
            - call: "POST /roast-profiles"
              payload: { name: "Cascade", roast_level: "MEDIUM", expected_shrink_bps: 1500, charge_temp_c: 200 }
              as: RoasterStaff
              captures: { rp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CAS", name: "Cascade", roast_profile_id: "${rp_id}", base_price_cents_per_kg: 1900, freshness_window_days: 14 }
              as: RoasterStaff
              captures: { prod_id: $.data.id }
            - call: "POST /green-lots"
              payload: { origin: "Peru", lot_ref: "PER-001", received_kg: 30, par_level_kg: 25 }
              as: RoasterStaff
              captures: { gl_id: $.data.id, gl_v: $.data.version }
            - call: "POST /roast-batches"
              payload: { green_lot_id: "${gl_id}", product_id: "${prod_id}", planned_green_kg: 28, expected_green_lot_version: "${gl_v}" }
              as: RoasterStaff
              captures: { rb_id: $.data.id }
            - call: "POST /roast-batches/${rb_id}/start"
              payload: { actual_green_kg: 28 }
              as: RoasterStaff
            - call: "POST /roast-batches/${rb_id}/drop"
              payload: {}
              as: RoasterStaff
          trigger:
            - call: "POST /roast-batches/${rb_id}/complete"
              payload: { actual_roasted_kg: 24 }
              as: RoasterStaff
            - call: "GET /green-lots/${gl_id}"
              payload: {}
              as: RoasterStaff
              captures: { gl_avail: $.data.available_kg, gl_reorder: $.data.reorder_status }
            - call: "GET /roast-batches/${rb_id}/roasted-lots"
              payload: {}
              as: RoasterStaff
              captures: { rl_produced: "$.data[0].produced_kg", rl_avail: "$.data[0].available_kg"}
          assert:
            - "GreenLot.${gl_id}.available_kg == 2.000 (30 - 28 consumed)"
            - "GreenLot.${gl_id}.reorder_status == BELOW_PAR (2.000 < 25, link 2 from link 1)"
            - "RoastedLot.produced_kg == 24.000 and available_kg == 24.000 (link 3 from completion)"

      - name: cancel_order_cascade_fulfillment_releases_roastedlot
        grounds:
          - state_machines.Order.OPEN_to_CANCELLED
          - state_machines.Fulfillment.RESERVED_to_CANCELLED
          - calculations.roasted_lot_availability
          - entities.RoastedLot.fields.available_kg
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (order cancel, not roast complete): cancelling the
          OPEN order cancels its RESERVED Fulfillment (link 1), and that fulfillment cancellation releases
          the RoastedLot reservation restoring available_kg (link 2 caused by link 1).
        test_recipe:
          setup:
            - "An OPEN, UNBILLED order with one RESERVED fulfillment for 8 kg against a roasted lot of 25 kg (available 17)."
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { code: "PLAIN", discount_bps: 0, min_monthly_kg: 0, freshness_max_days: 60 }
