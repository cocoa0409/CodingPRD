        grounds: ["validations[80]", "validations[81]", "errors[ERR_STATUTORY_DEPOSIT_LIMIT]", "errors[ERR_INSUFFICIENT_LEDGER_BALANCE]"]
        distinguishing_aspect: "Both fiscal guards are inclusive-boundary tests on the same account: a deposit that lands exactly on PublicUnit.statutory_max_deposit_cents succeeds, one cent more is ERR_STATUTORY_DEPOSIT_LIMIT (422), and a withdrawal of balance+1 is ERR_INSUFFICIENT_LEDGER_BALANCE (422) — the unit-level ceiling is checked against the UNIT aggregate while the debit floor is checked against the ACCOUNT ledger."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; APPROVED depository (capital 1200); COUNTY unit with statutory_max_deposit_cents 100000000; one DEMAND DEDICATED account funded to exactly the ceiling."
