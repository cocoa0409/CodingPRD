# =============================================================================
# Task 1235: Thermoforming & Vacuum-Form Plant — scaffold seed tables
# =============================================================================

scenario: |
  generate task hard than expert level! 1235. Thermoforming & Vacuum-Form Plant (custom thermoformer): sheet gauge & material sourcing, tool build & trim fixture, forming cycle & wall-thickness distribution, trim/scrap regrind loop, secondary assembly & insert, medical/food grade cleanliness, custom vs stock packaging, prototype-to-production tool step

domain_name: thermoforming-vacuum-form-plant
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite sheet-stock & regrind pools reserved/consumed/released
  secondary_archetype: compliance_audit      # medical/food cleanliness gating, segregation of duties, cert expiry
  complexity_layers:
    - optimistic_concurrency                 # OCC on ProductionOrder.version at staging
    - cascading_side_effects                 # run-complete -> order -> allocations -> lot status (depth 3)
    - dual_variant_calculation               # provisional vs final order cost; prototype vs production amortization
    - version_pinning_on_approval            # tool production approval pins drawing_revision
  entity_topology: flat                      # peer entities joined by FK references; no URL nesting
  state_machine_shape: parallel              # ProductionOrder carries schedule_status x quality_status; Tool is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                            # CleanlinessCertificate.subject -> 4 subject types
  role_model: segregation_of_duties          # batch decide != creator; disposition != recorder
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# Cleanliness grade rank (global): INDUSTRIAL(1) < FOOD(2) < MEDICAL(3).
# "grade A >= grade B" everywhere means rank(A) >= rank(B).
# =============================================================================
entities:
  - name: MaterialLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Supplier lot number / coil-tag identifier" }
      - { name: resin_type, type: enum, source: input, description: "PETG | HIPS | ABS | PP | PC", constraints: "immutable after create" }
      - { name: gauge_mm, type: number, source: input, description: "Sheet gauge (thickness) in mm, 3dp", constraints: "> 0" }
      - { name: cleanliness_grade_required, type: enum, source: input, description: "INDUSTRIAL | FOOD | MEDICAL — minimum cert grade needed to release this lot" }
      - { name: quantity_kg, type: number, source: input, description: "Received sheet mass in kg, 3dp", constraints: "> 0" }
      - { name: unit_cost_per_kg, type: number, source: input, description: "Purchase cost per kg, 2dp", constraints: "> 0" }
      - { name: allocated_kg, type: number, source: computed, default: 0, description: "Sum of qty_kg over this lot's allocations in status RESERVED or REVIEW" }
      - { name: consumed_kg, type: number, source: computed, default: 0, description: "Sum of qty_kg over this lot's allocations in status CONSUMED" }
      - { name: available_kg, type: number, source: computed, description: "= quantity_kg - allocated_kg - consumed_kg; invariant maintained on every allocation mutation" }
      - { name: status, type: enum, source: system, description: "QUARANTINE -> CERTIFIED -> DEPLETED | BLOCKED" }

  - name: RegrindBatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_code, type: string, source: input, description: "Plant-internal regrind batch code" }
      - { name: resin_type, type: enum, source: input, description: "PETG | HIPS | ABS | PP | PC — single-resin batches only", constraints: "immutable after create" }
      - { name: source_grade, type: enum, source: input, description: "INDUSTRIAL | FOOD | MEDICAL — highest cleanliness grade among scrap sources" }
      - { name: target_kg, type: number, source: input, description: "Batch fill target in kg, 3dp; reaching it auto-moves batch ACCEPTING -> PENDING_CERT", constraints: "> 0" }
      - { name: accumulated_kg, type: number, source: computed, default: 0, description: "Sum of weight_kg of CERTIFIED scrap records assigned to this batch" }
      - { name: reserved_kg, type: number, source: computed, default: 0, description: "Sum of qty_kg over this batch's allocations in status RESERVED or REVIEW" }
      - { name: consumed_kg, type: number, source: computed, default: 0, description: "Sum of qty_kg over this batch's allocations in status CONSUMED" }
      - { name: available_kg, type: number, source: computed, description: "= accumulated_kg - reserved_kg - consumed_kg" }
      - { name: certified_grade, type: enum, source: system, description: "INDUSTRIAL | FOOD | MEDICAL — null until decide; DOWNGRADED decision must carry a grade strictly below source_grade", constraints: "null until status in {CERTIFIED, DOWNGRADED}" }
      - { name: max_blend_pct, type: number, source: computed, description: "= BLEND_CAP[certified_grade] once decided; null before" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating MaterialsPlanner; segregation-of-duties anchor for decide" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the decider; must differ from created_by_user_id" }
      - { name: status, type: enum, source: system, description: "ACCEPTING -> PENDING_CERT -> CERTIFIED | DOWNGRADED | REJECTED" }

  - name: Tool
    parent: null
    common_fields: true
    fields:
      - { name: tool_code, type: string, source: input, description: "Tool / mold identifier" }
      - { name: part_number, type: string, source: input, description: "Part number this tool forms" }
      - { name: tool_type, type: enum, source: input, description: "FORM_MOLD | TRIM_FIXTURE | MATCHED_SET" }
      - { name: min_gauge_mm, type: number, source: input, description: "Minimum sheet gauge the tool is built for, 3dp" }
      - { name: max_gauge_mm, type: number, source: input, description: "Maximum sheet gauge the tool is built for, 3dp", constraints: ">= min_gauge_mm" }
      - { name: cleanliness_grade, type: enum, source: input, description: "INDUSTRIAL | FOOD | MEDICAL — highest product grade the tool is validated for" }
      - { name: prototype_cost, type: number, source: input, description: "Full prototype tool build cost, 2dp", constraints: "> 0" }
      - { name: production_cost, type: number, source: input, description: "Production tool build cost, 2dp; supplied at approve-production", constraints: "> 0; null until PRODUCTION" }
      - { name: rated_lifetime_shots, type: integer, source: input, description: "Rated lifetime in shots; supplied at approve-production", constraints: "> 0; null until PRODUCTION" }
      - { name: shots_used, type: integer, source: computed, default: 0, description: "Cumulative shots_completed over all COMPLETED runs of orders using this tool" }
      - { name: drawing_revision, type: integer, source: system, default: 1, description: "Starts at 1; +1 on every revise" }
      - { name: qualified_drawing_revision, type: integer, source: system, description: "drawing_revision pinned at approve-production; re-approval after revise re-pins", constraints: "null until first PRODUCTION" }
      - { name: proto_shot_limit, type: integer, source: system, default: 500, description: "PROTO_SHOT_LIMIT constant materialized on the tool at complete-prototype" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROTOTYPE -> QUALIFICATION -> PRODUCTION -> UNDER_REVISION -> QUALIFICATION (cycle)" }

  - name: PackagingSpec
    parent: null
    common_fields: true
    fields:
      - { name: spec_code, type: string, source: input, description: "Packaging spec / catalog code" }
      - { name: spec_type, type: enum, source: input, description: "STOCK | CUSTOM", constraints: "immutable after create" }
      - { name: cleanliness_grade, type: enum, source: input, description: "INDUSTRIAL | FOOD | MEDICAL — product grade this packaging supports" }
      - { name: per_pack_cost, type: number, source: input, description: "Cost per packaged unit, 2dp", constraints: ">= 0" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of PlantManager who decided; null until decided" }
      - { name: status, type: enum, source: system, description: "STOCK created ACTIVE; CUSTOM created PENDING_APPROVAL -> APPROVED | REJECTED" }

  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_code, type: string, source: input, description: "Customer-facing order code" }
      - { name: part_number, type: string, source: input, description: "Part to form; must equal referenced tool.part_number" }
      - { name: resin_type, type: enum, source: input, description: "PETG | HIPS | ABS | PP | PC" }
      - { name: ordered_qty, type: integer, source: input, description: "Good parts required", constraints: "> 0" }
      - { name: required_gauge_mm, type: number, source: input, description: "Sheet gauge this order must run, 3dp; must lie within tool gauge range" }
      - { name: cleanliness_grade, type: enum, source: input, description: "INDUSTRIAL | FOOD | MEDICAL — required product grade" }
      - { name: is_prototype_order, type: boolean, source: input, default: false, description: "True iff order runs on a PROTOTYPE tool" }
      - { name: spec_nominal_wall_mm, type: number, source: input, description: "Nominal wall thickness target, 3dp" }
      - { name: spec_min_wall_mm, type: number, source: input, description: "Minimum acceptable wall thickness, 3dp", constraints: "<= spec_nominal_wall_mm" }
      - { name: nominal_part_weight_kg, type: number, source: input, description: "Nominal sheet mass per part BEFORE trim allowance, 3dp", constraints: "> 0" }
      - { name: std_cycle_time_s, type: integer, source: input, description: "Standard forming cycle seconds per shot for provisional costing", constraints: "> 0" }
      - { name: std_machine_rate_per_hour, type: number, source: input, description: "Standard machine hourly rate for provisional costing, 2dp", constraints: "> 0" }
      - { name: tool_id, type: string, source: input, description: "FK -> Tool.id; tool must be PROTOTYPE or PRODUCTION at create" }
      - { name: packaging_spec_id, type: string, source: input, description: "FK -> PackagingSpec.id" }
      - { name: required_material_kg, type: number, source: computed, description: "= round(ordered_qty * nominal_part_weight_kg * (1 + TRIM_ALLOWANCE_PCT), 3)" }
      - { name: shots_completed, type: integer, source: computed, default: 0, description: "Good parts formed; incremented at run complete, decremented by SCRAP disposition" }
      - { name: shots_scrapped, type: integer, source: computed, default: 0, description: "Bad parts condemned by SCRAP dispositions" }
      - { name: provisional_cost, type: number, source: computed, description: "Computed at stage; null before", constraints: "null until STAGED" }
      - { name: tooling_charge, type: number, source: computed, description: "Tool amortization charge computed at stage per tool status variant", constraints: "null until STAGED" }
      - { name: final_cost, type: number, source: computed, description: "Computed at order completion from actual run windows and consumed material", constraints: "null until COMPLETED" }
      - { name: schedule_status, type: enum, source: system, description: "QUEUED -> STAGED -> RUNNING <-> ON_HOLD -> COMPLETED | CANCELLED" }
      - { name: quality_status, type: enum, source: system, description: "PENDING -> RELEASED | REWORK_HOLD; REWORK_HOLD -> PENDING on resume" }

  - name: MaterialAllocation
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: source_type, type: enum, source: input, description: "VIRGIN_LOT | REGRIND" }
      - { name: lot_id, type: string, source: input, description: "FK -> MaterialLot.id; required iff source_type = VIRGIN_LOT", constraints: "null when source_type = REGRIND" }
      - { name: regrind_batch_id, type: string, source: input, description: "FK -> RegrindBatch.id; required iff source_type = REGRIND", constraints: "null when source_type = VIRGIN_LOT" }
      - { name: qty_kg, type: number, source: input, description: "Reserved mass, 3dp", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "RESERVED -> CONSUMED | RELEASED; RESERVED -> REVIEW -> RESERVED | RELEASED" }

  - name: MachineResource
    parent: null
    common_fields: true
    fields:
      - { name: resource_code, type: string, source: input, description: "Station / booth identifier" }
      - { name: resource_type, type: enum, source: input, description: "FORMING_STATION | INSPECTION_BOOTH", constraints: "immutable after create" }
      - { name: cleanliness_grade, type: enum, source: input, description: "INDUSTRIAL | FOOD | MEDICAL — highest product grade the resource may touch" }
      - { name: machine_rate_per_hour, type: number, source: input, description: "Actual machine hourly rate used in final costing (stations); booths may carry any positive rate", constraints: "> 0" }

  - name: FormingRun
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: station_id, type: string, source: input, description: "FK -> MachineResource.id; referenced resource must be FORMING_STATION" }
      - { name: planned_start, type: datetime, source: input, description: "Planned window start (UTC ISO8601)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned window end; half-open interval [planned_start, planned_end)", constraints: "> planned_start" }
      - { name: oven_temp_c, type: number, source: input, description: "Oven setpoint Celsius", constraints: "> 0" }
      - { name: cycle_time_s, type: integer, source: input, description: "Actual cycle seconds per shot", constraints: "> 0" }
      - { name: shots_planned, type: integer, source: input, description: "Shots planned for this run", constraints: "> 0" }
      - { name: shots_completed, type: integer, source: input, description: "Good shots reported at complete", constraints: ">= 0; null until COMPLETED" }
      - { name: scrap_weight_kg, type: number, source: input, description: "Trim/scrap mass reported at complete, 3dp", constraints: ">= 0; null until COMPLETED" }
      - { name: actual_end, type: datetime, source: input, description: "Actual completion timestamp used in final costing", constraints: "> planned_start; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED" }

  - name: ScrapRecord
    parent: null
    common_fields: false
    fields:
      - { name: forming_run_id, type: string, source: system, description: "FK -> FormingRun.id; set from the completing run" }
      - { name: regrind_batch_id, type: string, source: system, description: "FK -> RegrindBatch.id; null until certify assigns a batch" }
      - { name: resin_type, type: enum, source: system, description: "Copied from the run's ProductionOrder.resin_type" }
      - { name: weight_kg, type: number, source: system, description: "= scrap_weight_kg reported at run complete; record created only when scrap_weight_kg > 0" }
      - { name: status, type: enum, source: system, description: "PENDING -> CERTIFIED | REJECTED" }

  - name: QualityInspection
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: forming_run_id, type: string, source: input, description: "FK -> FormingRun.id; required iff inspection_type = FIRST_ARTICLE", constraints: "null for FINAL" }
      - { name: booth_id, type: string, source: input, description: "FK -> MachineResource.id; referenced resource must be INSPECTION_BOOTH" }
      - { name: inspection_type, type: enum, source: input, description: "FIRST_ARTICLE | FINAL" }
      - { name: scheduled_start, type: datetime, source: input, description: "Booth window start (UTC ISO8601)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Booth window end; half-open with grade-dependent turnover buffer", constraints: "> scheduled_start" }
      - { name: wall_measurements_mm, type: array, source: input, description: "Per-cavity wall thickness readings in mm", constraints: "non-empty array of numbers > 0" }
      - { name: min_wall_mm, type: number, source: computed, description: "min over per-measurement-rounded readings (round each to 0.001 HALF_UP first)" }
      - { name: avg_wall_mm, type: number, source: computed, description: "round(mean of per-measurement-rounded readings, 0.001 HALF_UP)" }
      - { name: deviation_pct, type: number, source: computed, description: "round((spec_nominal_wall_mm - min_wall_mm) / spec_nominal_wall_mm * 100, 0.01 HALF_UP)" }
      - { name: disposition, type: enum, source: input, description: "PASS | REWORK | SCRAP — supplied at disposition", constraints: "null until DISPOSITIONED" }
      - { name: scrapped_qty, type: integer, source: input, description: "Parts condemned; required iff disposition = SCRAP", constraints: "> 0 when SCRAP; null otherwise" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording QualityInspector; SoD anchor" }
      - { name: dispositioned_by_user_id, type: string, source: system, description: "X-User-ID of dispositioning QualityInspector; must differ from recorded_by_user_id" }
      - { name: status, type: enum, source: system, description: "RECORDED -> DISPOSITIONED" }

  - name: AssemblyTask
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: task_type, type: enum, source: input, description: "TRIM | INSERT | BOND | PACK" }
      - { name: sequence_no, type: integer, source: input, description: "Execution order within the order; lower completes first", constraints: "> 0" }
      - { name: insert_part_code, type: string, source: input, description: "Insert component code; required iff task_type = INSERT", constraints: "null for non-INSERT" }
      - { name: status, type: enum, source: system, description: "PENDING -> COMPLETED" }

  - name: CleanlinessCertificate
    parent: null
    common_fields: false
    fields:
      - { name: subject_type, type: enum, source: input, description: "MATERIAL_LOT | REGRIND_BATCH | TOOL | PACKAGING_SPEC — polymorphic subject kind (no FK prefix; join via subject_id)" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic subject reference: id of an entity of subject_type; reverse lookup via GET /cleanliness-certificates?subject_type=&subject_id=" }
      - { name: grade, type: enum, source: input, description: "INDUSTRIAL | FOOD | MEDICAL — certified grade" }
      - { name: issued_at, type: datetime, source: input, description: "Certification instant (UTC ISO8601)" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; cert valid on half-open [issued_at, expires_at)", constraints: "> issued_at" }
      - { name: cert_body, type: string, source: input, description: "Issuing laboratory / authority" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MaterialLot
    initial_state: QUARANTINE
    terminal_states: [BLOCKED, DEPLETED]
    transitions:
      - from: QUARANTINE
        to: CERTIFIED
        trigger: "system (side effect of POST /cleanliness-certificates with subject_type=MATERIAL_LOT naming this lot, cert grade >= lot.cleanliness_grade_required, cert currently valid)"
        actor: system
        preconditions:
          - "Certificate grade rank >= lot.cleanliness_grade_required rank"
          - "Certificate valid at current logical time: issued_at <= now < expires_at"
        side_effects:
          - "lot.status = CERTIFIED; lot.updated_at refreshed; lot.version += 1"
      - from: CERTIFIED
        to: BLOCKED
        trigger: POST /material-lots/{lotId}/block
        actor: MaterialsPlanner
        preconditions:
          - "lot.status == CERTIFIED (ERR_INVALID_LOT_STATE)"
        side_effects:
          - "All allocations of this lot in status RESERVED -> REVIEW"
          - "lot.version += 1"
      - from: CERTIFIED
        to: DEPLETED
        trigger: "system (automatic when available_kg reaches exactly 0 after consumption)"
        actor: system
        preconditions:
          - "available_kg == 0"
        side_effects:
          - "lot.version += 1"

  - entity: RegrindBatch
    initial_state: ACCEPTING
    terminal_states: [REJECTED]
    transitions:
      - from: ACCEPTING
        to: PENDING_CERT
        trigger: "system (automatic when accumulated_kg >= target_kg after a scrap certify)"
        actor: system
        preconditions: []
        side_effects:
          - "batch.version += 1"
      - from: PENDING_CERT
        to: CERTIFIED
        trigger: POST /regrind-batches/{batchId}/decide with decision=CERTIFIED
        actor: MaterialsPlanner
        preconditions:
          - "batch.status == PENDING_CERT (ERR_INVALID_BATCH_STATE)"
          - "decider X-User-ID != batch.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "certified_grade present"
        side_effects:
          - "certified_grade set; max_blend_pct = BLEND_CAP[certified_grade]"
          - "decided_by_user_id recorded; batch.version += 1"
      - from: PENDING_CERT
        to: DOWNGRADED
        trigger: POST /regrind-batches/{batchId}/decide with decision=DOWNGRADED
        actor: MaterialsPlanner
        preconditions:
          - "batch.status == PENDING_CERT (ERR_INVALID_BATCH_STATE)"
          - "decider X-User-ID != batch.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "certified_grade present and strictly below source_grade rank (ERR_INVALID_REQUEST)"
        side_effects:
          - "certified_grade set; max_blend_pct = BLEND_CAP[certified_grade]"
          - "decided_by_user_id recorded; batch.version += 1"
      - from: PENDING_CERT
        to: REJECTED
        trigger: POST /regrind-batches/{batchId}/decide with decision=REJECTED
        actor: MaterialsPlanner
        preconditions:
          - "batch.status == PENDING_CERT (ERR_INVALID_BATCH_STATE)"
          - "decider X-User-ID != batch.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "no allocations referencing this batch exist (ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "batch.version += 1; batch leaves the eligible regrind pool"

  - entity: Tool
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PROTOTYPE
        trigger: POST /tools/{toolId}/complete-prototype
        actor: ToolingEngineer
        preconditions:
          - "tool.status == DRAFT (ERR_INVALID_TOOL_TRANSITION)"
        side_effects:
          - "proto_shot_limit = 500 (PROTO_SHOT_LIMIT); tool.version += 1"
      - from: PROTOTYPE
        to: QUALIFICATION
        trigger: POST /tools/{toolId}/submit-qualification
        actor: ToolingEngineer
        preconditions:
          - "tool.status in {PROTOTYPE, UNDER_REVISION} (ERR_INVALID_TOOL_TRANSITION)"
        side_effects:
          - "tool.version += 1"
      - from: UNDER_REVISION
        to: QUALIFICATION
        trigger: POST /tools/{toolId}/submit-qualification
        actor: ToolingEngineer
        preconditions:
          - "tool.status in {PROTOTYPE, UNDER_REVISION} (ERR_INVALID_TOOL_TRANSITION)"
        side_effects:
          - "tool.version += 1"
      - from: QUALIFICATION
        to: PRODUCTION
        trigger: POST /tools/{toolId}/approve-production
        actor: ToolingEngineer
        preconditions:
          - "tool.status == QUALIFICATION (ERR_INVALID_TOOL_TRANSITION)"
          - "a currently valid CleanlinessCertificate exists with subject_type=TOOL, subject_id=tool.id, grade >= tool.cleanliness_grade (ERR_CERTIFICATE_INVALID)"
        side_effects:
          - "production_cost and rated_lifetime_shots stored from input"
          - "qualified_drawing_revision = drawing_revision (version pin at approval)"
          - "tool.version += 1"
      - from: PRODUCTION
        to: UNDER_REVISION
        trigger: POST /tools/{toolId}/revise
        actor: ToolingEngineer
        preconditions:
          - "tool.status == PRODUCTION (ERR_INVALID_TOOL_TRANSITION)"
        side_effects:
          - "drawing_revision += 1; tool.version += 1"
          - "Cascade hop 1: every ProductionOrder with tool_id = tool.id and schedule_status in {STAGED, RUNNING} -> ON_HOLD"
          - "Cascade hop 2: for each order held by hop 1, every MaterialAllocation of that order in status RESERVED -> REVIEW"

  - entity: PackagingSpec
    initial_state: "ACTIVE (spec_type=STOCK) | PENDING_APPROVAL (spec_type=CUSTOM)"
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: POST /packaging-specs/{specId}/decide with decision=APPROVED
        actor: PlantManager
        preconditions:
          - "spec.status == PENDING_APPROVAL (ERR_INVALID_SPEC_STATE)"
          - "a currently valid CleanlinessCertificate exists with subject_type=PACKAGING_SPEC, subject_id=spec.id, grade >= spec.cleanliness_grade (ERR_CERTIFICATE_INVALID)"
        side_effects:
          - "decided_by_user_id recorded; spec.version += 1"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: POST /packaging-specs/{specId}/decide with decision=REJECTED
        actor: PlantManager
        preconditions:
          - "spec.status == PENDING_APPROVAL (ERR_INVALID_SPEC_STATE)"
        side_effects:
          - "decided_by_user_id recorded; spec.version += 1"

  - entity: ProductionOrder
    dimension: schedule_status
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUEUED
        to: STAGED
        trigger: POST /production-orders/{orderId}/stage
        actor: ProductionScheduler
        preconditions:
          - "order.schedule_status == QUEUED (ERR_INVALID_ORDER_STATE)"
          - "OCC: expected_production_order_version == order.version (ERR_STALE_VERSION)"
          - "tool.status in {PROTOTYPE, PRODUCTION} (ERR_TOOL_NOT_QUALIFIED)"
          - "Sum of qty_kg over order allocations in status RESERVED >= order.required_material_kg (ERR_INSUFFICIENT_MATERIAL)"
          - "Regrind blend re-check: cumulative RESERVED regrind qty <= blend cap (ERR_BLEND_CAP_EXCEEDED)"
        side_effects:
          - "provisional_cost and tooling_charge computed (see calculations)"
          - "order.version += 1"
      - from: STAGED
        to: RUNNING
        trigger: "system (side effect of the order's first POST /forming-runs)"
        actor: system
        preconditions: []
        side_effects:
          - "order.version += 1"
      - from: RUNNING
        to: ON_HOLD
        trigger: POST /production-orders/{orderId}/hold
        actor: ProductionScheduler
        preconditions:
          - "order.schedule_status == RUNNING (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "order.version += 1"
      - from: RUNNING
        to: ON_HOLD
        trigger: "system (cascade from POST /tools/{toolId}/revise when order uses that tool)"
        actor: system
        preconditions: []
        side_effects:
          - "order's RESERVED allocations -> REVIEW; order.version += 1"
      - from: RUNNING
        to: ON_HOLD
        trigger: "system (cascade from REWORK disposition)"
        actor: system
        preconditions: []
        side_effects:
          - "order.version += 1"
      - from: ON_HOLD
        to: RUNNING
        trigger: POST /production-orders/{orderId}/resume
        actor: ProductionScheduler
        preconditions:
          - "order.schedule_status == ON_HOLD (ERR_INVALID_ORDER_STATE)"
          - "tool.status in {PROTOTYPE, PRODUCTION} (ERR_TOOL_NOT_QUALIFIED)"
          - "Every allocation of the order in status REVIEW re-validates (lot CERTIFIED with available_kg >= qty_kg, or batch still allocatable); each passing allocation -> RESERVED; if any fails -> ERR_ALLOCATION_REVIEW_FAILED and order stays ON_HOLD"
        side_effects:
          - "quality_status REWORK_HOLD -> PENDING (if currently REWORK_HOLD)"
          - "order.version += 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "system (automatic when shots_completed >= ordered_qty AND quality_status == RELEASED, evaluated at run complete and at PASS disposition)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 1: every allocation of the order in status RESERVED -> CONSUMED"
          - "Cascade hop 2: for each consumed VIRGIN_LOT allocation, lot.allocated_kg -= qty_kg and lot.consumed_kg += qty_kg; for each consumed REGRIND allocation, batch.reserved_kg -= qty_kg and batch.consumed_kg += qty_kg"
          - "Cascade hop 3: each touched lot recomputes available_kg; if available_kg == 0 the lot -> DEPLETED"
          - "final_cost computed (see calculations)"
          - "order.version += 1"
      - from: QUEUED
        to: CANCELLED
        trigger: POST /production-orders/{orderId}/cancel
        actor: ProductionScheduler
        preconditions:
          - "order.schedule_status in {QUEUED, STAGED, RUNNING, ON_HOLD} (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "Every allocation in status RESERVED or REVIEW -> RELEASED; lot.allocated_kg / batch.reserved_kg decremented accordingly"
          - "order.version += 1"
      - from: STAGED
        to: CANCELLED
        trigger: POST /production-orders/{orderId}/cancel
        actor: ProductionScheduler
        preconditions:
          - "order.schedule_status in {QUEUED, STAGED, RUNNING, ON_HOLD}"
        side_effects:
          - "Same release cascade as QUEUED -> CANCELLED"
      - from: RUNNING
        to: CANCELLED
        trigger: POST /production-orders/{orderId}/cancel
        actor: ProductionScheduler
        preconditions:
          - "order.schedule_status in {QUEUED, STAGED, RUNNING, ON_HOLD}"
        side_effects:
          - "Same release cascade as QUEUED -> CANCELLED"
      - from: ON_HOLD
        to: CANCELLED
        trigger: POST /production-orders/{orderId}/cancel
        actor: ProductionScheduler
        preconditions:
          - "order.schedule_status in {QUEUED, STAGED, RUNNING, ON_HOLD}"
        side_effects:
          - "Same release cascade as QUEUED -> CANCELLED"

  - entity: ProductionOrder
    dimension: quality_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "system (side effect of PASS disposition on any inspection of this order)"
        actor: system
        preconditions: []
        side_effects:
          - "If shots_completed >= ordered_qty: schedule_status -> COMPLETED with full completion cascade (see schedule_status machine)"
          - "order.version += 1"
      - from: PENDING
        to: REWORK_HOLD
        trigger: "system (side effect of REWORK disposition)"
        actor: system
        preconditions: []
        side_effects:
          - "If schedule_status == RUNNING: schedule_status -> ON_HOLD"
          - "order.version += 1"
      - from: REWORK_HOLD
        to: PENDING
        trigger: "system (side effect of POST /production-orders/{orderId}/resume)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaterialAllocation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: REVIEW
        trigger: "system (cascade from tool revise or lot block)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVIEW
        to: RESERVED
        trigger: "system (re-validation inside POST /production-orders/{orderId}/resume)"
        actor: system
        preconditions:
          - "source lot CERTIFIED with available_kg >= qty_kg, or source batch still allocatable"
        side_effects: []
      - from: RESERVED
        to: RELEASED
        trigger: POST /material-allocations/{allocationId}/release
        actor: ProductionScheduler
        preconditions:
          - "allocation.status in {RESERVED, REVIEW} (ERR_ALLOCATION_NOT_RELEASABLE)"
        side_effects:
          - "lot.allocated_kg -= qty_kg (VIRGIN_LOT) or batch.reserved_kg -= qty_kg (REGRIND)"
          - "ProductionOrder.version += 1"
      - from: REVIEW
        to: RELEASED
        trigger: POST /material-allocations/{allocationId}/release
        actor: ProductionScheduler
        preconditions:
          - "allocation.status in {RESERVED, REVIEW} (ERR_ALLOCATION_NOT_RELEASABLE)"
        side_effects:
          - "Same balance restoration as RESERVED -> RELEASED; ProductionOrder.version += 1"
      - from: RESERVED
        to: CONSUMED
        trigger: "system (cascade from order completion)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.allocated_kg -= qty_kg, lot.consumed_kg += qty_kg (VIRGIN_LOT); batch.reserved_kg -= qty_kg, batch.consumed_kg += qty_kg (REGRIND)"

  - entity: FormingRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: POST /forming-runs/{runId}/complete
        actor: ProductionScheduler
        preconditions:
          - "run.status == SCHEDULED (ERR_INVALID_RUN_STATE)"
          - "shots_completed >= 0, scrap_weight_kg >= 0, actual_end > planned_start (ERR_INVALID_REQUEST)"
        side_effects:
          - "order.shots_completed += shots_completed; order.version += 1"
          - "tool.shots_used += shots_completed (tool = order.tool_id)"
          - "If scrap_weight_kg > 0: create ScrapRecord(PENDING, forming_run_id = run.id, resin_type = order.resin_type, weight_kg = scrap_weight_kg)"
          - "Completion check: if order.shots_completed >= order.ordered_qty AND order.quality_status == RELEASED -> order COMPLETED with full completion cascade"

  - entity: ScrapRecord
    initial_state: PENDING
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: POST /scrap-records/{scrapId}/certify with decision=CERTIFY
        actor: MaterialsPlanner
        preconditions:
          - "scrap.status == PENDING (ERR_INVALID_SCRAP_STATE)"
          - "batch.status == ACCEPTING (ERR_INVALID_BATCH_STATE)"
          - "batch.resin_type == scrap.resin_type (ERR_RESIN_MISMATCH)"
        side_effects:
          - "scrap.regrind_batch_id = batch.id"
          - "batch.accumulated_kg += scrap.weight_kg; batch.version += 1"
          - "If batch.accumulated_kg >= batch.target_kg: batch ACCEPTING -> PENDING_CERT"
      - from: PENDING
        to: REJECTED
        trigger: POST /scrap-records/{scrapId}/certify with decision=REJECT
        actor: MaterialsPlanner
        preconditions:
          - "scrap.status == PENDING (ERR_INVALID_SCRAP_STATE)"
        side_effects: []

  - entity: QualityInspection
    initial_state: RECORDED
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: RECORDED
        to: DISPOSITIONED
        trigger: POST /quality-inspections/{inspectionId}/disposition
        actor: QualityInspector
        preconditions:
          - "inspection.status == RECORDED (ERR_INSPECTION_ALREADY_DISPOSITIONED)"
          - "disposition X-User-ID != inspection.recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "PASS requires min_wall_mm >= order.spec_min_wall_mm (ERR_DISPOSITION_CONTRADICTS_MEASUREMENT)"
          - "SCRAP requires min_wall_mm < order.spec_min_wall_mm and scrapped_qty > 0 (ERR_DISPOSITION_CONTRADICTS_MEASUREMENT)"
          - "SCRAP requires scrapped_qty <= order.shots_completed (ERR_INVALID_REQUEST)"
        side_effects:
          - "PASS: order.quality_status PENDING -> RELEASED; completion check runs (may complete order)"
          - "REWORK: order.quality_status PENDING -> REWORK_HOLD; if order RUNNING -> ON_HOLD"
          - "SCRAP: order.shots_completed -= scrapped_qty; order.shots_scrapped += scrapped_qty"
          - "order.version += 1"

  - entity: AssemblyTask
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: POST /assembly-tasks/{taskId}/complete
        actor: ProductionScheduler
        preconditions:
          - "task.status == PENDING (ERR_INVALID_TASK_STATE)"
          - "order.schedule_status in {RUNNING, ON_HOLD, COMPLETED} (ERR_INVALID_ORDER_STATE)"
          - "Every AssemblyTask of the same order with sequence_no < this.sequence_no is COMPLETED (ERR_ASSEMBLY_SEQUENCE_VIOLATION)"
          - "If task_type == PACK: order.quality_status == RELEASED (ERR_ORDER_QUALITY_NOT_RELEASED)"
          - "If task_type == PACK: order's PackagingSpec.status in {ACTIVE, APPROVED} (ERR_PACK_SPEC_NOT_APPROVED)"
        side_effects:
          - "task.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-stage-stale-version
    parent_entity: ProductionOrder
    write_endpoint: "POST /production-orders/{orderId}/stage"
    occ_field: "expected_production_order_version"
    description: |
      Staging a ProductionOrder pins the material plan as the client last
      observed it. If the client's expected version no longer matches the
      order's current version — for example because another allocation was
      created or released against the order after the client's read, each of
      which advances ProductionOrder.version — the stage request is rejected
      as stale and the client must re-read the order before staging.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Global constants:
#   BLEND_CAP = { INDUSTRIAL: 0.40, FOOD: 0.15, MEDICAL: 0.00 }
#   TRIM_ALLOWANCE_PCT = 0.18 ; SETUP_FEE = 250.00 ; REGRIND_VALUE_PCT = 0.60
#   PROTO_SHOT_LIMIT = 500 ; BOOTH_TURNOVER_MINUTES = 30
# Money: 2dp ROUND_HALF_UP. Mass: 3dp ROUND_HALF_UP. Wall: per rule below.
# =============================================================================
calculations:
  - name: required_material
    trigger: "ProductionOrder creation"
    algorithm: aggregation
    formula: |
      required_material_kg = round(ordered_qty * nominal_part_weight_kg * (1 + TRIM_ALLOWANCE_PCT), 3)
      ROUND_HALF_UP at 3 decimal places.
    input_set: "the new ProductionOrder row only"
    constants:
      TRIM_ALLOWANCE_PCT: 0.18
    precision: "3 decimal places, round_half_up"

  - name: regrind_blend_plan
    trigger: "POST /material-allocations with source_type=REGRIND (validation) and POST /production-orders/{id}/stage (re-check)"
    algorithm: constraint_propagation
    formula: |
      Grade rank: INDUSTRIAL=1 < FOOD=2 < MEDICAL=3.
      eligibility gate (conditional branch):
        if batch.status NOT IN {CERTIFIED, DOWNGRADED}            -> eligible_kg = 0 (ERR_INVALID_BATCH_STATE raised earlier)
        elif rank(batch.certified_grade) < rank(order.cleanliness_grade) -> eligible_kg = 0 (ERR_GRADE_INCOMPATIBLE)
        elif batch.resin_type != order.resin_type                 -> ERR_RESIN_MISMATCH
        else eligible_kg = batch.accumulated_kg - batch.reserved_kg - batch.consumed_kg
      blend_cap_kg = round(order.required_material_kg * BLEND_CAP[order.cleanliness_grade], 3)
      cumulative rule: sum of qty_kg over the order's RESERVED regrind allocations
      (including the new request) must be <= blend_cap_kg (ERR_BLEND_CAP_EXCEEDED),
      and the new request's qty_kg must be <= eligible_kg (ERR_INSUFFICIENT_MATERIAL).
      MEDICAL orders: BLEND_CAP = 0.00, so any regrind allocation violates the cap.
    input_set: "the order, all its RESERVED MaterialAllocations with source_type=REGRIND, the referenced RegrindBatch"
    constants:
      BLEND_CAP_INDUSTRIAL: 0.40
      BLEND_CAP_FOOD: 0.15
      BLEND_CAP_MEDICAL: 0.00
    precision: "3 decimal places, round_half_up"

  - name: wall_thickness_distribution
    trigger: "QualityInspection creation"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (round per measurement FIRST, then aggregate):
      1. m_i' = round(wall_measurements_mm[i], 0.001 HALF_UP) for each reading
      2. min_wall_mm = min(m_i')
      3. avg_wall_mm = round(mean(m_i'), 0.001 HALF_UP)
      4. deviation_pct = round((order.spec_nominal_wall_mm - min_wall_mm)
                               / order.spec_nominal_wall_mm * 100, 0.01 HALF_UP)
      Rounding AFTER aggregation (e.g. min over raw readings) is non-conformant:
      a raw reading of 1.2305 with spec_min_wall_mm 1.231 must PASS after
      per-measurement rounding (1.231 >= 1.231), whereas raw-min comparison
      would fail it.
    input_set: "the new QualityInspection row + its ProductionOrder spec fields"
    precision: "wall 3dp HALF_UP; deviation 2dp HALF_UP"

  - name: order_cost
    trigger: "provisional variant at POST /production-orders/{id}/stage; final variant at order completion"
    algorithm: tiered_pricing
    formula: |
      Common:
        material_per_piece_kg = nominal_part_weight_kg * (1 + TRIM_ALLOWANCE_PCT)
        reference_virgin_cost = unit_cost_per_kg of the order's RESERVED virgin
          allocation with the greatest qty_kg (tie-break: earliest created_at)
        regrind_unit_cost = REGRIND_VALUE_PCT * reference_virgin_cost
      PROVISIONAL (at stage):
        machine_component = round(ordered_qty * std_cycle_time_s / 3600
                                  * std_machine_rate_per_hour, 2)
        material_component = round( sum over RESERVED virgin allocations (qty_kg * lot.unit_cost_per_kg)
                                  + sum over RESERVED regrind allocations (qty_kg * regrind_unit_cost), 2)
        tooling_charge = tool_amortization_charge(order, variant by tool.status)
        provisional_cost = round(SETUP_FEE + machine_component + material_component + tooling_charge, 2)
      FINAL (at completion):
        machine_component = round( sum over COMPLETED runs of
          round(station.machine_rate_per_hour * (actual_end - planned_start in hours), 4), 2)
        material_component = round( sum over CONSUMED virgin allocations (qty_kg * lot.unit_cost_per_kg)
                                  + sum over CONSUMED regrind allocations (qty_kg * regrind_unit_cost), 2)
        tooling_charge = same rule as provisional (recomputed; tool status at completion)
        final_cost = round(SETUP_FEE + machine_component + material_component + tooling_charge, 2)
      The two variants legitimately differ: provisional prices the plan
      (standard cycle, standard rate), final prices actuality (measured run
      windows, station rates).
    input_set: "provisional: order + RESERVED allocations; final: order + COMPLETED runs + CONSUMED allocations"
    constants:
      SETUP_FEE: 250.00
      TRIM_ALLOWANCE_PCT: 0.18
      REGRIND_VALUE_PCT: 0.60
    precision: "2 decimal places, round_half_up (inner per-run machine cost 4dp)"
    variants:
      - name: provisional
        when: "order staging"
        difference: "uses std_cycle_time_s and std_machine_rate_per_hour over ordered_qty; RESERVED allocations"
      - name: final
        when: "order completion"
        difference: "uses actual run windows (actual_end - planned_start) and station.machine_rate_per_hour; CONSUMED allocations"

  - name: tool_amortization_charge
    trigger: "invoked by order_cost at stage and at completion"
    algorithm: threshold
    formula: |
      PROTOTYPE variant (tool.status == PROTOTYPE):
        tooling_charge = tool.prototype_cost          # full prototype build cost on the order
      PRODUCTION variant (tool.status == PRODUCTION):
        per_shot = round(tool.production_cost / tool.rated_lifetime_shots, 4)
        tooling_charge = round(per_shot * order.ordered_qty, 2)
      Same order quantity yields materially different charges across the two
      tool states — the prototype-to-production step changes unit economics.
    input_set: "order's Tool row + order.ordered_qty"
    precision: "per_shot 4dp HALF_UP; charge 2dp HALF_UP"
    variants:
      - name: prototype_flat
        when: "tool.status == PROTOTYPE"
        difference: "flat full prototype_cost charged to the single order"
      - name: production_per_shot
        when: "tool.status == PRODUCTION"
        difference: "production_cost amortized over rated_lifetime_shots, per-shot rate x ordered_qty"

  - name: certificate_validity
    trigger: "any check that requires a valid certificate (lot release side effect, allocation grade check, tool approve-production, packaging decide)"
    algorithm: threshold
    formula: |
      A certificate is VALID at logical time T iff issued_at <= T < expires_at
      (half-open). At T == expires_at exactly the certificate is INVALID.
      T is the server logical clock: default 2026-05-01T00:00:00Z at startup,
      advanced only by POST /_clock/set_current_utc.
    input_set: "CleanlinessCertificate rows for the subject, logical clock"
    precision: "instant comparison, no rounding"

  - name: station_window_overlap
    trigger: "POST /forming-runs"
    algorithm: interval_merge
    formula: |
      Station occupation uses HALF-OPEN intervals [planned_start, planned_end).
      A new run on station S conflicts iff exists another run R on S with
      R.status == SCHEDULED and NOT (new.planned_end <= R.planned_start
      OR new.planned_start >= R.planned_end) -> ERR_STATION_WINDOW_OVERLAP.
      Back-to-back windows (new.planned_start == R.planned_end) are ALLOWED.
      Only SCHEDULED runs occupy the station; COMPLETED runs do not block.
    input_set: "FormingRun rows on the same station_id with status SCHEDULED"

  - name: booth_window_schedule
    trigger: "POST /quality-inspections"
    algorithm: interval_merge
    formula: |
      Booth occupation uses HALF-OPEN intervals plus a GRADE-DEPENDENT
      TURNOVER BUFFER — a different interval semantic from station scheduling:
      (a) overlap: conflict iff exists inspection I on the same booth with
          I.status == RECORDED and NOT (new.end <= I.start OR new.start >= I.end)
          -> ERR_BOOTH_WINDOW_OVERLAP. Adjacency alone is not a conflict...
      (b) ...BUT if the EARLIER session's order cleanliness_grade == INDUSTRIAL
          and the LATER session's order cleanliness_grade IN {FOOD, MEDICAL},
          the later session must satisfy new.start >= I.end + 30 minutes
          (BOOTH_TURNOVER_MINUTES) -> else ERR_BOOTH_BUFFER_VIOLATION.
          At exactly I.end + 30 min the later session is ALLOWED (>= rule).
      DISPOSITIONED inspections still occupied their window; only RECORDED
      ones participate (a dispositioned session is over).
    input_set: "QualityInspection rows on the same booth_id with status RECORDED, joined to their ProductionOrder.cleanliness_grade"
    constants:
      BOOTH_TURNOVER_MINUTES: 30

  - name: lot_mass_conservation
    trigger: "invariant evaluated after every allocation create/release/cancel/consume cascade"
    algorithm: aggregation
    formula: |
      INVARIANT (compensating pair: allocate then release):
      lot.available_kg == lot.quantity_kg - lot.allocated_kg - lot.consumed_kg
      A POST /material-allocations of q kg followed by
      POST /material-allocations/{id}/release on the same allocation MUST leave
      available_kg bit-identical to its pre-pair value.
      The analogous regrind invariant:
      batch.available_kg == batch.accumulated_kg - batch.reserved_kg - batch.consumed_kg.
    input_set: "MaterialLot / RegrindBatch aggregate fields"
    precision: "3 decimal places exact equality"

  - name: order_shot_conservation
    trigger: "invariant evaluated after every run complete and every SCRAP disposition"
    algorithm: aggregation
    formula: |
      INVARIANT (compensating pair: run complete then SCRAP disposition):
      order.shots_completed + order.shots_scrapped
        == sum(shots_completed over the order's COMPLETED FormingRuns)
      A run complete adds n to the left via shots_completed and n to the right;
      a SCRAP disposition of s moves s from shots_completed to shots_scrapped,
      leaving both sides unchanged.
    input_set: "ProductionOrder shot counters + its COMPLETED FormingRuns"
    precision: "integer exact equality"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request body schema: required fields present, enums valid, numeric constraints (>0, >=0), conditional fields (lot_id iff VIRGIN_LOT; regrind_batch_id iff REGRIND; insert_part_code iff INSERT; certified_grade iff decision != REJECT; scrapped_qty iff SCRAP; forming_run_id iff FIRST_ARTICLE), spec_min_wall_mm <= spec_nominal_wall_mm, expires_at > issued_at, planned_end > planned_start, scheduled_end > scheduled_start, min_gauge_mm <= max_gauge_mm"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST endpoints
  - priority: 4
    category: existence
    check: "Path ids and body-referenced ids exist (left-to-right); polymorphic certificate subject must exist for its subject_type"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with ids
  - priority: 5
    category: state
    check: "OCC freshness: expected_production_order_version == ProductionOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /production-orders/{orderId}/stage"
  - priority: 6
    category: state
    check: "Target entity in a legal from-state for the requested transition (lot block requires CERTIFIED; tool transitions per machine; decide requires PENDING_CERT; allocation create requires order schedule_status in {QUEUED, STAGED, ON_HOLD} else ERR_ORDER_NOT_ALLOCATABLE; run create requires order schedule_status in {STAGED, RUNNING}; run complete requires SCHEDULED; disposition requires RECORDED; scrap certify requires PENDING; release requires RESERVED|REVIEW; task complete requires PENDING and order in {RUNNING, ON_HOLD, COMPLETED}; order create requires tool.status in {PROTOTYPE, PRODUCTION} and spec.status in {ACTIVE, PENDING_APPROVAL, APPROVED})"
    error_id: "ERR_INVALID_LOT_STATE | ERR_INVALID_TOOL_TRANSITION | ERR_INVALID_BATCH_STATE | ERR_INVALID_ORDER_STATE | ERR_ORDER_NOT_ALLOCATABLE | ERR_ORDER_NOT_RUNNING | ERR_INVALID_RUN_STATE | ERR_INVALID_SCRAP_STATE | ERR_INSPECTION_ALREADY_DISPOSITIONED | ERR_ALLOCATION_NOT_RELEASABLE | ERR_INVALID_TASK_STATE | ERR_PACK_SPEC_NOT_APPROVED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Cleanliness compatibility (grade rank only, time-validity handled at p8): at order create, spec.cleanliness_grade >= order.cleanliness_grade; at allocation, a certificate exists for the lot/batch at grade >= order.cleanliness_grade (regardless of expiry); at run create, tool.cleanliness_grade >= order.cleanliness_grade AND station.cleanliness_grade >= order.cleanliness_grade; at inspection create, booth.cleanliness_grade >= order.cleanliness_grade"
    error_id: ERR_GRADE_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /production-orders, POST /material-allocations, POST /forming-runs, POST /quality-inspections"
  - priority: 8
    category: business_temporal
    check: "Interval and certificate-time rules: station half-open overlap; booth half-open overlap; booth 30-minute turnover buffer after INDUSTRIAL sessions before FOOD/MEDICAL sessions; the grade-satisfying certificate from p7 must be valid at logical time T (half-open [issued_at, expires_at)) else ERR_CERTIFICATE_INVALID"
    error_id: "ERR_STATION_WINDOW_OVERLAP | ERR_BOOTH_WINDOW_OVERLAP | ERR_BOOTH_BUFFER_VIOLATION | ERR_CERTIFICATE_INVALID"
    http_status: 409
    applies_to: "POST /forming-runs, POST /quality-inspections, POST /material-allocations, POST /tools/{toolId}/approve-production, POST /packaging-specs/{specId}/decide"
  - priority: 9
    category: business_constraint
    check: "Domain constraints: resin match on allocation and scrap certify; lot gauge == order.required_gauge_mm; order gauge within tool gauge range; part_number match with tool; regrind blend cap; prototype-order rules (is_prototype_order required on PROTOTYPE tool; cumulative shots <= PROTO_SHOT_LIMIT); segregation of duties on decide and disposition; disposition-measurement consistency; assembly sequence ordering; PACK gates (quality released, spec approved); resume allocation re-validation; FIRST_ARTICLE inspections must reference a COMPLETED run and FINAL inspections require order.shots_completed > 0 (ERR_INVALID_REQUEST)"
    error_id: "ERR_RESIN_MISMATCH | ERR_GAUGE_MISMATCH | ERR_BLEND_CAP_EXCEEDED | ERR_PROTOTYPE_ORDER_REQUIRED | ERR_PROTOTYPE_SHOT_LIMIT_EXCEEDED | ERR_SEGREGATION_OF_DUTIES | ERR_DISPOSITION_CONTRADICTS_MEASUREMENT | ERR_ASSEMBLY_SEQUENCE_VIOLATION | ERR_ORDER_QUALITY_NOT_RELEASED | ERR_ALLOCATION_REVIEW_FAILED | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /material-allocations, POST /scrap-records/{scrapId}/certify, POST /production-orders, POST /forming-runs, POST /regrind-batches/{batchId}/decide, POST /quality-inspections and disposition, POST /assembly-tasks/{taskId}/complete, POST /production-orders/{orderId}/resume, POST /production-orders/{orderId}/stage"
  - priority: 10
    category: business_fiscal
    check: "Material sufficiency: lot.available_kg >= qty_kg; batch eligible_kg >= qty_kg; at stage, RESERVED coverage >= required_material_kg"
    error_id: ERR_INSUFFICIENT_MATERIAL
    http_status: 402
    applies_to: "POST /material-allocations, POST /production-orders/{orderId}/stage"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- MaterialLot ---
  - { method: POST, path: "/material-lots", description: "Receive a virgin sheet lot into QUARANTINE", roles: [MaterialsPlanner], code: 201, input: [lot_code, resin_type, gauge_mm, cleanliness_grade_required, quantity_kg, unit_cost_per_kg], output: MaterialLot, side_effects: ["status=QUARANTINE; allocated_kg=consumed_kg=0"] }
  - { method: GET, path: "/material-lots", description: "List material lots", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "status?", "resin_type?"], output: "MaterialLot[]", side_effects: [] }
  - { method: GET, path: "/material-lots/{lotId}", description: "Get one material lot", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: MaterialLot, side_effects: [] }
  - { method: POST, path: "/material-lots/{lotId}/block", description: "Quarantine-block a CERTIFIED lot (contamination event); its RESERVED allocations -> REVIEW", roles: [MaterialsPlanner], code: 200, input: [], output: MaterialLot, side_effects: ["lot CERTIFIED -> BLOCKED", "RESERVED allocations of this lot -> REVIEW", "lot.version += 1"] }

  # --- RegrindBatch ---
  - { method: POST, path: "/regrind-batches", description: "Open a regrind batch (ACCEPTING)", roles: [MaterialsPlanner], code: 201, input: [batch_code, resin_type, source_grade, target_kg], output: RegrindBatch, side_effects: ["created_by_user_id = X-User-ID", "accumulated_kg=reserved_kg=consumed_kg=0"] }
  - { method: GET, path: "/regrind-batches", description: "List regrind batches", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "status?"], output: "RegrindBatch[]", side_effects: [] }
  - { method: GET, path: "/regrind-batches/{batchId}", description: "Get one regrind batch", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: RegrindBatch, side_effects: [] }
  - { method: POST, path: "/regrind-batches/{batchId}/decide", description: "Certify / downgrade / reject a PENDING_CERT batch (segregated from creator)", roles: [MaterialsPlanner], code: 200, input: [decision, "certified_grade?"], output: RegrindBatch, side_effects: ["sets certified_grade and max_blend_pct on CERTIFIED/DOWNGRADED", "batch.version += 1"] }

  # --- Tool ---
  - { method: POST, path: "/tools", description: "Register a tool in DRAFT", roles: [ToolingEngineer], code: 201, input: [tool_code, part_number, tool_type, min_gauge_mm, max_gauge_mm, cleanliness_grade, prototype_cost], output: Tool, side_effects: ["drawing_revision=1", "shots_used=0"] }
  - { method: GET, path: "/tools", description: "List tools", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "status?"], output: "Tool[]", side_effects: [] }
  - { method: GET, path: "/tools/{toolId}", description: "Get one tool", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: Tool, side_effects: [] }
  - { method: POST, path: "/tools/{toolId}/complete-prototype", description: "DRAFT -> PROTOTYPE; materializes proto_shot_limit=500", roles: [ToolingEngineer], code: 200, input: [], output: Tool, side_effects: ["proto_shot_limit=500", "tool.version += 1"] }
  - { method: POST, path: "/tools/{toolId}/submit-qualification", description: "PROTOTYPE or UNDER_REVISION -> QUALIFICATION", roles: [ToolingEngineer], code: 200, input: [], output: Tool, side_effects: ["tool.version += 1"] }
  - { method: POST, path: "/tools/{toolId}/approve-production", description: "QUALIFICATION -> PRODUCTION; pins qualified_drawing_revision; requires valid tool cleanliness cert", roles: [ToolingEngineer], code: 200, input: [production_cost, rated_lifetime_shots], output: Tool, side_effects: ["qualified_drawing_revision = drawing_revision", "stores production_cost and rated_lifetime_shots", "tool.version += 1"] }
  - { method: POST, path: "/tools/{toolId}/revise", description: "PRODUCTION -> UNDER_REVISION; cascades orders STAGED/RUNNING -> ON_HOLD and their RESERVED allocations -> REVIEW", roles: [ToolingEngineer], code: 200, input: [], output: Tool, side_effects: ["drawing_revision += 1", "tool.version += 1", "cascade: orders -> ON_HOLD", "cascade: their RESERVED allocations -> REVIEW"] }

  # --- PackagingSpec ---
  - { method: POST, path: "/packaging-specs", description: "Create packaging spec; STOCK -> ACTIVE, CUSTOM -> PENDING_APPROVAL", roles: [PackagingEngineer], code: 201, input: [spec_code, spec_type, cleanliness_grade, per_pack_cost], output: PackagingSpec, side_effects: ["status by spec_type"] }
  - { method: GET, path: "/packaging-specs", description: "List packaging specs", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "status?", "spec_type?"], output: "PackagingSpec[]", side_effects: [] }
  - { method: POST, path: "/packaging-specs/{specId}/decide", description: "PlantManager approves (requires valid spec cleanliness cert) or rejects a CUSTOM spec", roles: [PlantManager], code: 200, input: [decision], output: PackagingSpec, side_effects: ["decided_by_user_id recorded", "spec.version += 1"] }

  # --- ProductionOrder ---
  - { method: POST, path: "/production-orders", description: "Create a production order in QUEUED; computes required_material_kg", roles: [ProductionScheduler], code: 201, input: [order_code, part_number, resin_type, ordered_qty, required_gauge_mm, cleanliness_grade, spec_nominal_wall_mm, spec_min_wall_mm, nominal_part_weight_kg, std_cycle_time_s, std_machine_rate_per_hour, tool_id, packaging_spec_id, "is_prototype_order?"], output: ProductionOrder, side_effects: ["required_material_kg computed", "schedule_status=QUEUED; quality_status=PENDING"] }
  - { method: GET, path: "/production-orders", description: "List production orders", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "schedule_status?", "tool_id?", "packaging_spec_id?"], output: "ProductionOrder[]", side_effects: [] }
  - { method: GET, path: "/production-orders/{orderId}", description: "Get one production order", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: ProductionOrder, side_effects: [] }
  - { method: POST, path: "/production-orders/{orderId}/stage", description: "QUEUED -> STAGED under OCC; verifies material coverage and blend cap; computes provisional_cost and tooling_charge", roles: [ProductionScheduler], code: 200, input: [expected_production_order_version], output: ProductionOrder, side_effects: ["provisional_cost computed", "tooling_charge computed", "increments ProductionOrder.version by 1"] }
  - { method: POST, path: "/production-orders/{orderId}/hold", description: "RUNNING -> ON_HOLD", roles: [ProductionScheduler], code: 200, input: [], output: ProductionOrder, side_effects: ["order.version += 1"] }
  - { method: POST, path: "/production-orders/{orderId}/resume", description: "ON_HOLD -> RUNNING; re-validates REVIEW allocations back to RESERVED (ERR_ALLOCATION_REVIEW_FAILED on any failure); clears REWORK_HOLD -> PENDING", roles: [ProductionScheduler], code: 200, input: [], output: ProductionOrder, side_effects: ["REVIEW allocations re-validated -> RESERVED", "quality_status REWORK_HOLD -> PENDING", "order.version += 1"] }
  - { method: POST, path: "/production-orders/{orderId}/cancel", description: "QUEUED|STAGED|RUNNING|ON_HOLD -> CANCELLED; releases RESERVED/REVIEW allocations", roles: [ProductionScheduler], code: 200, input: [], output: ProductionOrder, side_effects: ["allocations RESERVED|REVIEW -> RELEASED with balance restoration", "order.version += 1"] }

  # --- MaterialAllocation ---
  - { method: POST, path: "/material-allocations", description: "Reserve virgin lot or regrind mass against an order", roles: [ProductionScheduler], code: 201, input: [production_order_id, source_type, "lot_id?", "regrind_batch_id?", qty_kg], output: MaterialAllocation, side_effects: ["lot.allocated_kg += qty_kg (VIRGIN_LOT) or batch.reserved_kg += qty_kg (REGRIND)", "increments ProductionOrder.version by 1"] }
  - { method: GET, path: "/material-allocations", description: "List allocations; FK reverse-reachability filters", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "production_order_id?", "lot_id?", "regrind_batch_id?", "status?"], output: "MaterialAllocation[]", side_effects: [] }
  - { method: GET, path: "/material-allocations/{allocationId}", description: "Get one allocation", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: MaterialAllocation, side_effects: [] }
  - { method: POST, path: "/material-allocations/{allocationId}/release", description: "RESERVED|REVIEW -> RELEASED; restores source balance", roles: [ProductionScheduler], code: 200, input: [], output: MaterialAllocation, side_effects: ["lot.allocated_kg -= qty_kg or batch.reserved_kg -= qty_kg", "increments ProductionOrder.version by 1"] }

  # --- MachineResource ---
  - { method: POST, path: "/machine-resources", description: "Register a forming station or inspection booth", roles: [ProductionScheduler], code: 201, input: [resource_code, resource_type, cleanliness_grade, machine_rate_per_hour], output: MachineResource, side_effects: [] }
  - { method: GET, path: "/machine-resources", description: "List machine resources", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "resource_type?"], output: "MachineResource[]", side_effects: [] }
  - { method: GET, path: "/machine-resources/{resourceId}", description: "Get one machine resource", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: MachineResource, side_effects: [] }

  # --- FormingRun ---
  - { method: POST, path: "/forming-runs", description: "Schedule a forming run on a station (half-open window); first run flips order STAGED -> RUNNING", roles: [ProductionScheduler], code: 201, input: [production_order_id, station_id, planned_start, planned_end, oven_temp_c, cycle_time_s, shots_planned], output: FormingRun, side_effects: ["if order.schedule_status == STAGED: order -> RUNNING, order.version += 1"] }
  - { method: GET, path: "/forming-runs", description: "List forming runs; FK reverse-reachability filters", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "production_order_id?", "station_id?", "status?"], output: "FormingRun[]", side_effects: [] }
  - { method: GET, path: "/forming-runs/{runId}", description: "Get one forming run", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: FormingRun, side_effects: [] }
  - { method: POST, path: "/forming-runs/{runId}/complete", description: "Complete a run: shots, scrap, actual_end; may complete the order with full cascade", roles: [ProductionScheduler], code: 200, input: [shots_completed, scrap_weight_kg, actual_end], output: FormingRun, side_effects: ["order.shots_completed += shots_completed", "tool.shots_used += shots_completed", "if scrap_weight_kg > 0: create ScrapRecord PENDING", "if shots target met and quality RELEASED: order COMPLETED cascade (allocations CONSUMED, lot/batch balances, lot DEPLETED at zero, final_cost)"] }

  # --- ScrapRecord ---
  - { method: GET, path: "/scrap-records", description: "List scrap records; FK reverse-reachability filters", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "forming_run_id?", "regrind_batch_id?", "status?"], output: "ScrapRecord[]", side_effects: [] }
  - { method: GET, path: "/scrap-records/{scrapId}", description: "Get one scrap record", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: ScrapRecord, side_effects: [] }
  - { method: POST, path: "/scrap-records/{scrapId}/certify", description: "Certify scrap into an ACCEPTING batch (same resin) or reject it; batch auto-advances at target", roles: [MaterialsPlanner], code: 200, input: [regrind_batch_id, decision], output: ScrapRecord, side_effects: ["CERTIFY: batch.accumulated_kg += weight_kg; auto PENDING_CERT at target"] }

  # --- QualityInspection ---
  - { method: POST, path: "/quality-inspections", description: "Record an inspection with per-cavity wall measurements on a booth window; computes min/avg/deviation", roles: [QualityInspector], code: 201, input: [production_order_id, "forming_run_id?", booth_id, inspection_type, scheduled_start, scheduled_end, wall_measurements_mm], output: QualityInspection, side_effects: ["min_wall_mm, avg_wall_mm, deviation_pct computed (per-measurement rounding first)", "recorded_by_user_id = X-User-ID"] }
  - { method: GET, path: "/quality-inspections", description: "List inspections; FK reverse-reachability filters", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "production_order_id?", "forming_run_id?", "booth_id?", "status?"], output: "QualityInspection[]", side_effects: [] }
  - { method: GET, path: "/quality-inspections/{inspectionId}", description: "Get one inspection", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: QualityInspection, side_effects: [] }
  - { method: POST, path: "/quality-inspections/{inspectionId}/disposition", description: "PASS / REWORK / SCRAP the inspection (segregated from recorder); drives order quality dimension and shot counters", roles: [QualityInspector], code: 200, input: [disposition, "scrapped_qty?"], output: QualityInspection, side_effects: ["PASS: order.quality_status -> RELEASED (+ possible completion cascade)", "REWORK: quality -> REWORK_HOLD, schedule RUNNING -> ON_HOLD", "SCRAP: shots_completed -= scrapped_qty, shots_scrapped += scrapped_qty", "order.version += 1"] }

  # --- AssemblyTask ---
  - { method: POST, path: "/assembly-tasks", description: "Add a secondary-operation task (trim / insert / bond / pack) to an order", roles: [ProductionScheduler], code: 201, input: [production_order_id, task_type, sequence_no, "insert_part_code?"], output: AssemblyTask, side_effects: [] }
  - { method: GET, path: "/assembly-tasks", description: "List assembly tasks; FK reverse-reachability filter", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "production_order_id?", "status?"], output: "AssemblyTask[]", side_effects: [] }
  - { method: GET, path: "/assembly-tasks/{taskId}", description: "Get one assembly task", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: AssemblyTask, side_effects: [] }
  - { method: POST, path: "/assembly-tasks/{taskId}/complete", description: "Complete a task in sequence; PACK additionally requires released quality and an approved/active packaging spec", roles: [ProductionScheduler], code: 200, input: [], output: AssemblyTask, side_effects: ["task.version += 1"] }

  # --- CleanlinessCertificate ---
  - { method: POST, path: "/cleanliness-certificates", description: "Issue a cleanliness certificate for a lot / batch / tool / packaging spec; releasing a QUARANTINE lot whose required grade is met", roles: [QualityInspector], code: 201, input: [subject_type, subject_id, grade, issued_at, expires_at, cert_body], output: CleanlinessCertificate, side_effects: ["if subject is MATERIAL_LOT in QUARANTINE and grade >= lot.cleanliness_grade_required and cert currently valid: lot -> CERTIFIED"] }
  - { method: GET, path: "/cleanliness-certificates", description: "List certificates; polymorphic subject filters", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: ["limit?", "offset?", "subject_type?", "subject_id?"], output: "CleanlinessCertificate[]", side_effects: [] }
  - { method: GET, path: "/cleanliness-certificates/{certId}", description: "Get one certificate", roles: [Any, MaterialsPlanner, ToolingEngineer, PackagingEngineer, PlantManager, ProductionScheduler, QualityInspector], code: 200, input: [], output: CleanlinessCertificate, side_effects: [] }

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set_current_utc call the clock reads that default and never falls back to wall-clock time. All certificate-validity and scheduling comparisons use this clock."
    roles: [Any]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/format violation: missing required field, bad enum, non-positive number, violated conditional-field rule, inverted window/spec range" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_production_order_version != ProductionOrder.version at stage" }
  - { id: ERR_MATERIAL_LOT_NOT_FOUND, http: 404, condition: "MaterialLot id does not exist" }
  - { id: ERR_REGRIND_BATCH_NOT_FOUND, http: 404, condition: "RegrindBatch id does not exist" }
  - { id: ERR_TOOL_NOT_FOUND, http: 404, condition: "Tool id does not exist" }
  - { id: ERR_PACKAGING_SPEC_NOT_FOUND, http: 404, condition: "PackagingSpec id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "ProductionOrder id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "MaterialAllocation id does not exist" }
  - { id: ERR_MACHINE_RESOURCE_NOT_FOUND, http: 404, condition: "MachineResource id does not exist" }
  - { id: ERR_FORMING_RUN_NOT_FOUND, http: 404, condition: "FormingRun id does not exist" }
  - { id: ERR_SCRAP_RECORD_NOT_FOUND, http: 404, condition: "ScrapRecord id does not exist" }
  - { id: ERR_QUALITY_INSPECTION_NOT_FOUND, http: 404, condition: "QualityInspection id does not exist" }
  - { id: ERR_ASSEMBLY_TASK_NOT_FOUND, http: 404, condition: "AssemblyTask id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "CleanlinessCertificate id does not exist" }
  - { id: ERR_INVALID_LOT_STATE, http: 409, condition: "Lot transition/usage requires a different current status (block requires CERTIFIED; allocation source lot must be CERTIFIED)" }
  - { id: ERR_INVALID_TOOL_TRANSITION, http: 409, condition: "Tool transition not legal from current status" }
  - { id: ERR_TOOL_NOT_QUALIFIED, http: 409, condition: "Operation requires the order's tool in status PROTOTYPE or PRODUCTION (order create, stage, resume)" }
  - { id: ERR_INVALID_BATCH_STATE, http: 409, condition: "Batch decide requires PENDING_CERT; scrap certify requires batch ACCEPTING; batch reject requires no referencing allocations" }
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order transition requires a different current schedule_status" }
  - { id: ERR_ORDER_NOT_ALLOCATABLE, http: 409, condition: "Allocation create requires order schedule_status in {QUEUED, STAGED, ON_HOLD}" }
  - { id: ERR_ORDER_NOT_RUNNING, http: 409, condition: "Forming run create requires order schedule_status in {STAGED, RUNNING}" }
  - { id: ERR_INVALID_RUN_STATE, http: 409, condition: "Run complete requires status SCHEDULED" }
  - { id: ERR_INVALID_SCRAP_STATE, http: 409, condition: "Scrap certify requires status PENDING" }
  - { id: ERR_INSPECTION_ALREADY_DISPOSITIONED, http: 409, condition: "Disposition requires inspection status RECORDED" }
  - { id: ERR_ALLOCATION_NOT_RELEASABLE, http: 409, condition: "Release requires allocation status RESERVED or REVIEW" }
  - { id: ERR_INVALID_TASK_STATE, http: 409, condition: "Assembly complete requires task status PENDING" }
  - { id: ERR_PACK_SPEC_NOT_APPROVED, http: 409, condition: "Packaging spec must be ACTIVE or APPROVED (PACK task / order create with REJECTED spec)" }
  - { id: ERR_INVALID_SPEC_STATE, http: 409, condition: "Packaging spec decide requires status PENDING_APPROVAL" }
  - { id: ERR_ORDER_QUALITY_NOT_RELEASED, http: 409, condition: "PACK task requires order quality_status == RELEASED" }
  - { id: ERR_ALLOCATION_REVIEW_FAILED, http: 409, condition: "Resume re-validation failed for at least one REVIEW allocation; order stays ON_HOLD" }
  - { id: ERR_GRADE_INCOMPATIBLE, http: 422, condition: "Cleanliness grade rank insufficient (spec vs order, lot/batch cert vs order, tool/station vs order)" }
  - { id: ERR_STATION_WINDOW_OVERLAP, http: 409, condition: "New run's half-open window intersects another SCHEDULED run on the same station" }
  - { id: ERR_BOOTH_WINDOW_OVERLAP, http: 409, condition: "New inspection's window intersects another RECORDED inspection on the same booth" }
  - { id: ERR_BOOTH_BUFFER_VIOLATION, http: 409, condition: "FOOD/MEDICAL inspection scheduled less than 30 minutes after an INDUSTRIAL session on the same booth" }
  - { id: ERR_CERTIFICATE_INVALID, http: 422, condition: "No currently valid certificate at the required grade (missing, expired at logical time T, or grade too low)" }
  - { id: ERR_RESIN_MISMATCH, http: 422, condition: "Resin type mismatch (allocation vs order; scrap vs batch)" }
  - { id: ERR_GAUGE_MISMATCH, http: 422, condition: "Sheet gauge mismatch (lot gauge vs order required gauge; order gauge outside tool gauge range)" }
  - { id: ERR_BLEND_CAP_EXCEEDED, http: 422, condition: "Cumulative RESERVED regrind for the order would exceed round(required_material_kg * BLEND_CAP[grade], 3)" }
  - { id: ERR_PROTOTYPE_ORDER_REQUIRED, http: 422, condition: "Order on a PROTOTYPE tool must set is_prototype_order=true" }
  - { id: ERR_PROTOTYPE_SHOT_LIMIT_EXCEEDED, http: 422, condition: "Prototype order quantity or cumulative planned shots exceed PROTO_SHOT_LIMIT (500)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID may not perform both halves of a segregated pair (batch create/decide; inspection record/disposition)" }
  - { id: ERR_DISPOSITION_CONTRADICTS_MEASUREMENT, http: 422, condition: "PASS requires min_wall_mm >= spec_min_wall_mm; SCRAP requires min_wall_mm < spec_min_wall_mm" }
  - { id: ERR_ASSEMBLY_SEQUENCE_VIOLATION, http: 409, condition: "A lower-sequence task of the same order is not COMPLETED" }
  - { id: ERR_INSUFFICIENT_MATERIAL, http: 402, condition: "Source available mass below requested qty, or RESERVED coverage below required_material_kg at stage" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MaterialsPlanner
    description: "Owns virgin sheet sourcing, regrind pool, scrap certification; SoD: may not decide a batch they created"
    identity: opaque
    exclusive_operations:
      - "POST /material-lots"
      - "POST /material-lots/{lotId}/block"
      - "POST /regrind-batches"
      - "POST /regrind-batches/{batchId}/decide"
      - "POST /scrap-records/{scrapId}/certify"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /_clock/set_current_utc"
  - name: ToolingEngineer
    description: "Owns tool build, prototype-to-production step, and drawing revision"
    identity: opaque
    exclusive_operations:
      - "POST /tools"
      - "POST /tools/{toolId}/complete-prototype"
      - "POST /tools/{toolId}/submit-qualification"
      - "POST /tools/{toolId}/approve-production"
      - "POST /tools/{toolId}/revise"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /_clock/set_current_utc"
  - name: PackagingEngineer
    description: "Drafts custom and stock packaging specs; cannot approve them"
    identity: opaque
    exclusive_operations:
      - "POST /packaging-specs"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /_clock/set_current_utc"
  - name: PlantManager
    description: "Final authority on custom packaging approval"
    identity: opaque
    exclusive_operations:
      - "POST /packaging-specs/{specId}/decide"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /_clock/set_current_utc"
  - name: ProductionScheduler
    description: "Owns orders, allocations, stations/booths, forming runs, assembly tasks"
    identity: opaque
    exclusive_operations:
      - "POST /production-orders and all /production-orders/{orderId}/* actions"
      - "POST /material-allocations and release"
      - "POST /machine-resources"
      - "POST /forming-runs and complete"
      - "POST /assembly-tasks and complete"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /_clock/set_current_utc"
  - name: QualityInspector
    description: "Records inspections and issues cleanliness certificates; SoD: may not disposition an inspection they recorded"
