              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Cut", dob: "1990-01-01T00:00:00Z", email: "acut@x.com", ssn_last4: "1111", residence_state: "CA" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "CA", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
            - { call: "POST /api/applications/${app}/consent", payload: {}, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
          trigger:
            - call: "POST /api/applications/${app}/record-searches"
              payload: { credit_score: 700, records: [ { record_type: "EVICTION", jurisdiction_state_code: "CA", record_date: "2019-08-01T00:00:00Z", description: "exactly at cutoff" }, { record_type: "EVICTION", jurisdiction_state_code: "CA", record_date: "2019-07-31T00:00:00Z", description: "one day before cutoff" } ] }
              as: Screener
              captures: { rp: "$.data.id" }
            - call: "GET /api/records?report_id=${rp}"
              payload: {}
              as: Screener
              captures: { r_on: "$.data[0].id", r_old: "$.data[1].id" }
          assert:
            - "ScreeningRecord.${r_on}.status == INCLUDED          (record_date == cutoff 2019-08-01 is not strictly older)"
            - "ScreeningRecord.${r_old}.status == SUPPRESSED and suppression_reason == LOOKBACK_EXPIRED"
            - "ScreeningReport.${rp}.included_record_count == 1"
            - "ScreeningApplication.${app}.fee_charged_cents == 3439   (all three search types execute under the CA rule regardless of record contents)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: score_blocked_until_income_verification_resolved
        grounds:
          - state_machines.ScreeningApplication.status.SCREENING_to_SCORED
          - errors[ERR_INCOME_VERIFICATION_UNRESOLVED]
          - entities.IncomeVerification.fields.status
        distinguishing_aspect: |
          Entity pair ScreeningApplication x IncomeVerification: the application's SCREENING -> SCORED
          transition is gated by a DIFFERENT entity's state — with the IncomeVerification still PENDING,
          score fails with ERR_INCOME_VERIFICATION_UNRESOLVED; after that verification resolves VERIFIED,
          the identical score call succeeds.
        test_recipe:
          setup:
            - "Landlord with published criteria; TX application (rent 200000, credit 700, no records) in SCREENING; its IncomeVerification exists and is PENDING"
