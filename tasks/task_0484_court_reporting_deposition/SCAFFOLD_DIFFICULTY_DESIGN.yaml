      - name: reporter_buffer_29_vs_30_min_gap_on_assignment
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - endpoints["POST /jobs/{id}/assignments"]
          - errors[ERR_REPORTER_BUFFER_CONFLICT]
        distinguishing_aspect: |
          A reporter already on a job ending 12:00 cannot take a second job starting 12:29
          (gap 29 min < 30) — ERR_REPORTER_BUFFER_CONFLICT — but CAN take one starting 12:30
          (gap exactly 30, buffer satisfied). The boundary is the 30-minute travel buffer on a
          different metric (gap between adjacent windows) than the page-tier boundary, reached
          via the assignment endpoint.
        test_recipe:
