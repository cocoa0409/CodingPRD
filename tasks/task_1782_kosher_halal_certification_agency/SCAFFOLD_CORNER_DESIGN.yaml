      - name: verify_by_original_inspector_rejected_segregation
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SEGREGATION_OF_DUTIES_VERIFICATION]"]
        distinguishing_aspect: "The visit's own inspector (sup-1) cannot verify-close their finding -> 403 ERR_SEGREGATION_OF_DUTIES_VERIFICATION; a different supervisor (sup-2) succeeds."
        test_recipe:
          setup: ["finding REMEDIATION_SUBMITTED on sup-1's visit"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "RB3 Co", certification_scheme: "KOSHER", contact_email: "rb3@x.com" }, as: AccountManager, captures: { cR3: $.data.id } }
