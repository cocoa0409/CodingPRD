          - state_machines.EnhancedVoucher.ISSUED_to_RESCINDED
          - state_machines.EnhancedVoucher.PENDING_to_RESCINDED
          - state_machines.RenewalCase.OPT_OUT_NOTICED_to_NOTICES_PENDING
          - state_machines.TenantHousehold.EV_ISSUED_to_OPT_OUT_NOTICED
