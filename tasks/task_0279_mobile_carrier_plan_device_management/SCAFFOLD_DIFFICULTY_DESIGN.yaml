  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_reconnect_invalid_state_wins
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - state_machines.Line.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          A reconnect on an ACTIVE (not SUSPENDED) line whose account is also DELINQUENT violates both the
          state precondition (priority 7, category state -> ERR_INVALID_STATE) and the fiscal reconnect gate
          (priority 14, category business_fiscal -> ERR_RECONNECT_BLOCKED); the higher-priority state error wins.
        test_recipe:
          setup:
            - "An ACTIVE line (never suspended) on a DELINQUENT account."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "I", holder_email: "i@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-I", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000060" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /accounts/${acc_id}/mark-delinquent"
              payload: { delinquent: true }
              as: BillingSystem
          trigger:
            - call: "POST /lines/${line_id}/reconnect"
              payload: {}
              as: CarrierAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (priority-7 state check fires before the priority-14 fiscal gate)"

      - name: existence_vs_referential_port_not_found_wins
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          A port-request validate on a missing portRequestId violates existence (priority 3, category
          existence -> ERR_NOT_FOUND), which must beat any body-FK referential check (priority 5, category
          business_referential -> ERR_FK_NOT_FOUND) — a different error-category pair from the state/fiscal conflict.
        test_recipe:
          setup:
            - "An account and an ACTIVE line exist, but no port-request with the queried id."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "J", holder_email: "j@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-J", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /port-requests/00000000-0000-4000-8000-000000000000/validate"
              payload: { account_pin: "0000" }
              as: PortingOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND (existence beats any body-FK referential check)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overage_zero_at_exact_included_mb
        grounds:
          - calculations.line_overage
