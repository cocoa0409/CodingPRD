          - endpoints.GET /cedents/{cedent_id}
          - calculations.brokerage_and_net_remittance
          - calculations.fiduciary_holding
        distinguishing_aspect: |
          Four different entities carry read-only projections of rows that live somewhere else, and
          each one is populated by a different write far away: Program.gross_written_premium_minor /
          brokerage_earned_minor / net_remittance_minor / rounding_residue_minor appear only when
          the program binds; Program.fiduciary_holding_minor moves only when a transaction SETTLES,
          not when it is booked or approved; Reinsurer.committed_capacity_minor is a sum over that
          market's live lines across every program; and Cedent.settled_receipts_minor is a sum over
          SETTLED CEDENT_RECEIPTs of every program of that cedent. Reading each field before its
          driving write must show the zero, not a stale or precomputed value.
