        grounds:
          - calculations.monetization_posture
          - validations[priority=5]
          - calculations.royalty_share_split
        distinguishing_aspect: "Posture is a three-way boundary: a channel with one ACTIVE community strike is RESTRICTED and may still route revenue, while the same channel with three ACTIVE strikes is FROZEN and the identical routing call is rejected with ERR_POSTURE_FROZEN — the boundary sits between 2 and 3 persisted strikes."
