            - { call: "POST /spirit-store/exchanges", payload: { program_id: "${prog}", order_id: "${ord}", original_variant_id: "${vm}", new_variant_id: "${vl}" }, as: Customer, as_user_id: "cust-41", captures: { ex: $.data.id, diff: $.data.differential_cents } }
            - { call: "POST /spirit-store/exchanges/${ex}/decision", payload: { decision: APPROVED }, as: Treasurer }
          trigger:
            - { call: "POST /spirit-store/exchanges/${ex}/complete", payload: { condition: RESALEABLE }, as: Treasurer, captures: { st: $.data.status } }
            - { call: "GET /spirit-store/orders/${ord}", payload: {}, as: Treasurer, captures: { ref: $.data.refunded_cents, pay: $.data.payment_status } }
          assert:
            - "diff == -500"
            - "st == COMPLETED"
            - "ref == 500 AND pay == PARTIALLY_REFUNDED (500 < 3000)"

      - name: campaign_projection_filtering_covered
        claim_type: input_set_filtering
        grounds: [calculations.campaign_units_projection]
        excluded_because:
          difficulty_instance: campaign_units_provisional_vs_final
          rationale: "PLACED-included vs PAID-only filtering is exactly the divergence asserted there."

      - name: valuation_variants_covered
        claim_type: variant_divergence
        grounds: [calculations.stock_valuation_calc]
        excluded_because:
          difficulty_instance: inventory_valuation_fifo_vs_weighted_avg
          rationale: "Both variants executed and divergent literals asserted there."

      - name: waterfall_covered
        claim_type: waterfall_allocation
        grounds: [calculations.allocation_waterfall_calc]
        excluded_because:
          difficulty_instance: allocation_waterfall_caps_overflow
          rationale: "Caps, overflow redistribution, and conservation are asserted there."

      - name: per_line_rounding_covered
        claim_type: precision
        grounds: [calculations.order_total_calc]
        excluded_because:
          difficulty_instance: order_total_per_line_rounding
          rationale: "The pinned rounding order with the 900-vs-899 divergence is asserted there."

  # ============================================================ 4. Validations
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role fails priority 1 before any role, existence, or business check — even on a trivially valid GET."
        test_recipe:
          setup: ["One program exists"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
          trigger:
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: ActivitiesDirector, captures: { err: $.data.error_id } }
          assert:
            - "Test layer withholds both auth headers for the trigger call; err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

      - name: variant_create_with_unknown_design_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_DESIGN_NOT_FOUND]"]
        distinguishing_aspect: "A body FK that does not resolve yields the FK target's 404 (ERR_DESIGN_NOT_FOUND), not a generic 400."
        test_recipe:
          setup: ["Program ACTIVE"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
          trigger:
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "00000000-0000-0000-0000-000000000000", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DESIGN_NOT_FOUND"

      - name: invalid_enum_value_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "channel MAIL is not in {EVENT_POS, ONLINE}; schema validation rejects before stock or event checks would even run."
        test_recipe:
          setup: ["Program ACTIVE"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
          trigger:
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: MAIL, customer_user_id: "cust-60", payment_method: CARD, lines: [] }, as: Customer, as_user_id: "cust-60", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: duplicate_active_campaign_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_ACTIVE_CAMPAIGN]"]
        distinguishing_aspect: "One OPEN campaign per design: opening a second campaign on the same design fails; after the first cancels, the second opens."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED; campaign C1 OPEN; campaign C2 DRAFT on same design; clock 2026-09-01 so C1 can be locked-cancelled (goal unmet with zero preorders)"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 5, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { c1: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${c1}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2000, deposit_pct: 0.5, goal_units: 3, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z" }, as: StoreManager, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/preorder-campaigns/${c2}/open", payload: {}, as: StoreManager, captures: { err: $.data.error_id } }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/preorder-campaigns/${c1}/lock", payload: {}, as: StoreManager, captures: { c1_st: $.data.status } }
            - { call: "POST /spirit-store/preorder-campaigns/${c2}/open", payload: {}, as: StoreManager, captures: { c2_st: $.data.status } }
          assert:
            - "err == ERR_DUPLICATE_ACTIVE_CAMPAIGN while C1 OPEN"
            - "c1_st == CANCELLED (goal 5 unmet with 0 paid units at lock)"
            - "c2_st == OPEN once no active sibling remains"

      - name: refund_exceeds_paid_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_REFUND_EXCEEDS_PAID]"]
        distinguishing_aspect: "Refunding 2501 against a 2500 total violates the fiscal cap; boundary is refunded + amount <= total."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED fee 0; variant M price 2500 stocked 25; event OPEN; CASH POS order qty 1 (total 2500)"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
