              as_user_id: "${a_dx_id}"
          assert:
            - "Application.${app_dx_id}.status == 'DECLINED'"
            - "AidPackage.${aid_dx_id}.status == 'REVOKED' (cascade hop — caused by Application DECLINE)"
            - "School.${s_dx_id}.admitted_count == 0"
            - "School.${s_dx_id}.declined_count == 1"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
