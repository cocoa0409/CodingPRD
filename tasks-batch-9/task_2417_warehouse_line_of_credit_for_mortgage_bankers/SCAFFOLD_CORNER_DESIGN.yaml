      - name: corner_val_priority_conflict_state_over_fiscal_already_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=38]
        excluded_because:
          difficulty_instance: priority_pair_facility_state_outranks_availability_fiscal
          rationale: |
            The pattern "violate a Tier-E state rule and a Tier-J fiscal rule in one
            request, expect the state error" is exactly that §1.8 instance, which
            constructs a SUSPENDED facility with zero availability so both rules are live
            simultaneously and asserts the 409 wins over the 422.

      - name: corner_val_priority_conflict_referential_over_constraint_already_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=43]
        excluded_because:
          difficulty_instance: priority_pair_investor_referential_outranks_commitment_constraint
          rationale: |
            The cross-tier pair "a body id that does not resolve within the addressed
            facility (404) against an exhausted commitment (422)" is that §1.8 instance's
            whole subject, including the assertion that a foreign-facility commitment
            yields the same NOT_FOUND code as a nonexistent one.

      - name: corner_val_commitment_window_buffer_already_covered
        claim_type: temporal_validation
        grounds:
          - validations[priority=37]
          - errors.ERR_COMMITMENT_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: temporal_commitment_window_closed_interval_with_buffer
          rationale: |
            Closed-interval intersection widened by COMMITMENT_BUFFER_DAYS is a boundary
            triple (day+1 conflicts, day+2 conflicts, day+3 is clear) that the §1.8
            instance walks in full, including the fact that WITHDRAWN commitments are
            excluded from the comparison set.

      - name: corner_val_cross_entity_custody_and_margin_gates_already_covered
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=18]
          - validations[priority=22]
        excluded_because:
          difficulty_instance: cross_entity_dry_funding_blocked_by_custodian_receipt_state
          rationale: |
            Two §1.8 instances already own this pattern: the custody-state gate on dry
            funding (priority 22) and, in
            cross_entity_facility_reinstate_blocked_by_open_margin_call, the open-call gate
            on reinstatement (priority 18). Both test the valid and invalid state of the
            OTHER entity against an unchanged request body.

