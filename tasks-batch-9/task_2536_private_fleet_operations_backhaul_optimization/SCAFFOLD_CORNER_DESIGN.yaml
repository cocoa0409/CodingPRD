  - section: rbac
    instances:
      - name: each_role_is_denied_the_exclusive_operations_of_every_other_role
        claim_type: Per-role exclusive operations
        grounds:
          - roles[FleetPlanner].exclusive_operations
          - roles[TransportManager].exclusive_operations
          - roles[Driver].exclusive_operations
          - roles[PayrollAnalyst].exclusive_operations
          - roles[SafetyManager].exclusive_operations
          - roles[MaintenanceCoordinator].exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The six roles are peers under segregation of duties, not a hierarchy, so every role is refused at least one operation with ERR_UNAUTHORIZED (403) - including the operationally senior TransportManager, which cannot mint a pay plan, and the FleetPlanner, which can build the whole schedule but cannot read the cost benchmark. The refusals leave no trace: each roster count is unchanged afterwards."
        test_recipe:
          setup:
            - "A minimal roster created by its rightful owners: DOM-R1 and S-6100 by FleetPlanner, MILE-C by PayrollAnalyst, D-R1 by TransportManager, TR-R1 and TL-R1 by MaintenanceCoordinator, TRIP-R1 by FleetPlanner. Each of those creations is itself the positive half of the claim."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
