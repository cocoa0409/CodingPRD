            - "${e_no_uid} == ERR_UNAUTHENTICATED: a valid role with an empty X-User-ID is still unauthenticated"
            - "${e_unknown} == ERR_UNAUTHENTICATED for a role outside the six declared names, not ERR_ROLE_NOT_PERMITTED"
