  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: mode (a) multi-input non-linear tiered
  # score on LoanOfficer; mode (b) pinned nested-rounding allocation on
  # RemediationPayment. Different modes (a) vs (b).
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: officer_risk_score_multicomponent_tiers
        grounds:
          - calculations.officer_risk_score
          - entities.LoanOfficer.fields.risk_score
          - entities.LoanOfficer.fields.monitoring_tier
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (override_rate, exception_approval_rate,
          pricing_dispersion_bps) with non-linear interaction (per-component
          min(1, x/norm) caps, weighted sum, outer min(100, ...) cap, tiered
          thresholds at 40/70). After 2 confirmed overrides the score is
          exactly 65.00 (WATCH); after also approving 1 exception it is
          exactly 100.00 (RED) — the outer min cap binds at 100.
        test_recipe:
          setup:
            - "Officer O1 with exactly 10 VALIDATED applications in market M1: originated rows at 700bps and 770bps (dispersion 70)"
            - "2 underwriting overrides on O1 applications, both CONFIRMED (score 65.00, WATCH)"
            - "1 pricing exception on an O1 application, still REQUESTED"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { a1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 721, dti_pct: 36.0, application_date: "2026-01-06", decision_date: "2026-01-21" }, as: LendingDataOps, captures: { a2: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 722, dti_pct: 36.0, application_date: "2026-01-07", decision_date: "2026-01-22" }, as: LendingDataOps, captures: { a3: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 723, dti_pct: 36.0, application_date: "2026-01-08", decision_date: "2026-01-23" }, as: LendingDataOps, captures: { a4: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: DENIED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 640, dti_pct: 44.0, application_date: "2026-01-09", decision_date: "2026-01-24" }, as: LendingDataOps, captures: { a5: $.data.id } }
