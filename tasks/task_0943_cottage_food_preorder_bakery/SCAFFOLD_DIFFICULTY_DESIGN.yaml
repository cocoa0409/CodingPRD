scaffold_difficulty_design:
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bakers_dozen_pricing_variant_raises_total_on_quantity_reduction
        grounds:
          - calculations.line_pricing
          - entities.MenuItem.fields.pricing_basis
          - entities.OrderLine.fields.line_total_cents
          - entities.OrderLine.fields.pricing_basis_applied
        distinguishing_aspect: |
          The variant is selected by MenuItem.pricing_basis, and the PER_DOZEN_BAKERS
          variant is non-monotone in quantity on the OrderLine cost domain: reducing
          quantity from 13 to 12 raises line_total_cents from 4600 to 5400, while the
          PER_UNIT variant on a different menu item stays strictly increasing at
          13 * 900 == 11700.
        test_recipe:
          setup:
            - "An ACTIVE baker with one released flour/butter lot and one PUBLISHED recipe."
            - "Two LISTED menu items: a PER_DOZEN_BAKERS cookie at unit 450 / dozen 4600, and a PER_UNIT loaf at unit 900."
            - "An OPEN offer window with the default 240 units / 12 slots / 18.0 oven hours, logical clock at 2026-05-04T09:00:00Z."
            - "A DRAFT PICKUP_COUNTER order for that customer on that window."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/customers"
              payload: { baker_id: "${baker_id}", display_name: "Ada Byron", email: "ada@example.com", delivery_distance_km: 6.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /bakery/ingredient-lots"
              payload: { baker_id: "${baker_id}", lot_code: "FLR-2026-11", received_at: "2026-04-20T00:00:00Z", expires_at: "2026-12-01T00:00:00Z", allergens: ["wheat", "milk"] }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { lot_flour: $.data.id }
            - call: "POST /bakery/ingredient-lots/${lot_flour}/release"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "flour and butter", quantity_grams: 500, declared_allergens: ["wheat", "milk"], ingredient_lot_id: "${lot_flour}" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes/${r_cookie}/publish"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Brown Butter Cookie", product_class: "SHELF_STABLE", pricing_basis: "PER_DOZEN_BAKERS", unit_price_cents: 450, dozen_price_cents: 4600 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_cookie: $.data.id }
            - call: "POST /bakery/menu-items/${mi_cookie}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Country Loaf", product_class: "SHELF_STABLE", pricing_basis: "PER_UNIT", unit_price_cents: 900, dozen_price_cents: 9600, temp_sensitive: true, oven_profile: "LONG_BAKE", oven_hours_per_batch: 3.0, yield_units_per_slot: 12 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_bread: $.data.id }
            - call: "POST /bakery/menu-items/${mi_bread}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/offer-windows"
              payload: { baker_id: "${baker_id}", label: "Wed 6 May", opens_at: "2026-05-04T00:00:00Z", order_cutoff_at: "2026-05-06T12:00:00Z", production_date: "2026-05-07T06:00:00Z", handoff_date: "2026-05-07T15:00:00Z", handoff_window_end_at: "2026-05-07T19:00:00Z" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1: $.data.id }
            - call: "POST /bakery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "OPEN" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1_v1: $.data.version }
            - call: "POST /bakery/orders"
              payload: { customer_id: "${cust_id}", offer_window_id: "${w1}", handoff_mode: "PICKUP_COUNTER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_cookie}", quantity: 13, expected_offer_window_version: "${w1_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_cookie: $.data.id, cookie_total_at_13: $.data.line_total_cents }
            - call: "GET /bakery/offer-windows/${w1}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { w1_v2: $.data.version }
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_bread}", quantity: 13, expected_offer_window_version: "${w1_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_bread: $.data.id, bread_total_at_13: $.data.line_total_cents }
            - call: "GET /bakery/offer-windows/${w1}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { w1_v3: $.data.version }
            - call: "PATCH /bakery/orders/${o1}/lines/${line_cookie}"
              payload: { quantity: 12, expected_offer_window_version: "${w1_v3}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cookie_total_at_12: $.data.line_total_cents }
          assert:
            - "${cookie_total_at_13} == 4600"
            - "${bread_total_at_13} == 11700"
            - "${cookie_total_at_12} == 5400"
            - "OrderLine.${line_cookie}.pricing_basis_applied == PER_DOZEN_BAKERS"
            - "OrderLine.${line_bread}.pricing_basis_applied == PER_UNIT"
            - "${cookie_total_at_12} - ${cookie_total_at_13} == 800, i.e. reducing quantity by one unit RAISED the line total"

      - name: oven_hours_profile_variant_diverges_on_identical_slot_count
        grounds:
          - calculations.batch_oven_hours
          - entities.MenuItem.fields.oven_profile
          - entities.MenuItem.fields.oven_hours_per_batch
          - entities.Batch.fields.oven_hours
          - state_machines.OfferWindow.UNPLANNED_to_PLANNED
        distinguishing_aspect: |
          The variant is selected by MenuItem.oven_profile on the Batch production
          domain, not the Order cost domain: two batches with slot_count 1 each get
          oven_hours 1.5 under STANDARD (slot_count * OVEN_HOURS_PER_BATCH_SLOT) and
          3.0 under LONG_BAKE (slot_count * MenuItem.oven_hours_per_batch), so the
          same slot count consumes a different share of capacity_oven_hours.
        test_recipe:
          setup:
            - "The same ACTIVE baker, PUBLISHED recipe and two LISTED menu items as the previous instance: a STANDARD cookie and a LONG_BAKE loaf with oven_hours_per_batch 3.0."
            - "An OPEN window on which one CONFIRMED order carries 13 cookies and 13 loaves."
            - "Clock advanced past order_cutoff_at, window LOCKED and then PLANNED so both Batches exist."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
