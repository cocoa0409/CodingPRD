            - "PlateOrder.${order_1}.cost_cents is still 163000 and plate_subtotal_cents still 103000 - the compensating debit never rewrites the order's own money fields"
            - "ArtworkAsset.${asset_id}.committed_plate_cost_cents == 114000 immediately after that cancel (277000 - 163000)"
            - "the second POST /plate-orders/${order_1}/cancel returns 409 with data.error_id == ERR_PLATE_ORDER_NOT_CANCELLABLE, and committed_plate_cost_cents is still 114000 - no second debit"
            - "POST /plate-orders (10 plates, expedite true) returns 201 with cost_cents == 312500 (72000 + 62000 + 26000 plates, 90000 large setup, 62500 expedite) - it fits only because the cancelled order's 163000 was released"
            - "ArtworkAsset.${asset_id}.committed_plate_cost_cents == 426500 after order_3 (114000 + 312500)"
            - "POST /plate-orders/${order_2}/cancel returns 200 and committed_plate_cost_cents == 312500, which equals cost_cents of the single remaining ORDERED order"
            - "GET /plate-orders?status=CANCELLED returns order_1 and order_2 with auto_cancelled false on both"

      - name: runout_disposition_reversal_debits_both_ledgers_and_rewinds_the_cascade
        grounds:
          - entities.ArtworkAsset.fields.obsolete_units_total
          - entities.ArtworkAsset.fields.changeover_cost_committed_cents
          - entities.InventoryRunout.fields.reversal_count
          - state_machines.InventoryRunout.SCRAPPED_to_MONITORING
          - state_machines.ArtworkVersion.OBSOLETE_to_OBSOLETE_PENDING
          - state_machines.ArtworkAsset.SUPERSEDED_to_SUPERSEDE_PENDING
          - calculations.changeover_writeoff_cost
          - validations[priority=33]
          - errors[ERR_RUNOUT_STATE_INVALID]
        distinguishing_aspect: |
          The reversal has to unwind three different kinds of state at once and each
          is separately falsifiable: two money/unit ledgers debited by exactly the
          amounts the SCRAP credited (10000 units and 504013 cents, not recomputed
          figures), the two-entity obsolescence cascade rewound one step each
          (ArtworkVersion OBSOLETE -> OBSOLETE_PENDING, ArtworkAsset SUPERSEDED ->
          SUPERSEDE_PENDING), and the physical-unit invariant on_hand_qty ==
          remaining_qty + sum(units_consumed) preserved because on_hand_qty and
          depletion_records are deliberately NOT rewritten. reversal_count 1 plus the
          refused second reversal show the compensation is recorded and single-shot.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED; ArtworkAsset (CARTON, so standard_unit_cost_cents == 42) with v1 APPROVED then v2 APPROVED, leaving v1 OBSOLETE_PENDING and the asset SUPERSEDE_PENDING."
            - "InventoryRunout on that asset (obsolete_version_id v1) with on_hand_qty 20000, weekly_usage_qty 4000, runout_start_utc 2026-08-03T00:00:00Z."
            - "Two depletion records of 3333 units each (weeks 2026-08-03 and 2026-08-10) put it in MONITORING with remaining_qty 13334 and trailing_avg_usage_qty 3333."
            - "A SCRAP disposition of units_scrapped 10000 / units_reworked 3334 (summing to exactly 13334, satisfying priority 51) computed material_writeoff_cents 420000, relabel_cost_cents 60012, changeover_base_cents 480012 - just under the 500000 tier-1 ceiling, so tier_pct 0.05 - changeover_expedite_cents round_half_up(24000.60) == 24001 and total_changeover_cost_cents 504013."
            - "That SCRAP left the runout SCRAPPED with reversal_count 0, ArtworkAsset.obsolete_units_total 10000, ArtworkAsset.changeover_cost_committed_cents 504013, ArtworkVersion v1 OBSOLETE and the asset SUPERSEDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: {verification_note: "Mandatory element verification run."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-versions/${v1_id}/submit"
