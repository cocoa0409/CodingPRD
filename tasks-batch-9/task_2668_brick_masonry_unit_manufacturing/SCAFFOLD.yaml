scenario: "Generate task harder than expert level!\n\n2668. Brick & Masonry Unit Manufacturing (brick manufacturing plant): clay pit reserves, shale blending and body formulation for color and durability, extrusion, cutting and setting on kiln cars with green handling losses, tunnel kiln firing curve with color development and overfire or underfire scrap, product blending across kiln positions to achieve consistent color ranges in shipped blends, sample panel approval for architectural projects with dye lot equivalence, inventory by color and texture with long lead times on special orders, packaging, banding and jobsite delivery with unloading equipment requirements, freight-sensitive market radius and plant assignment for orders"
domain_name: "brick-masonry-unit-manufacturing"
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: graph
  # ProductionRun is a three-way junction (KilnCar x KilnRun x BodyFormulation);
  # BlendComponent is a junction (ShippedBlend x FiredLot); BodyFormulation is
  # self-referential through supersedes_formulation_id, which also defines the
  # dye-lot equivalence closure used at blend certification.

  state_machine_shape: branching
  # ProductionRun.close-green forks SETTING -> {SET, HELD} with divergent
  # side-effect sets; SamplePanel and ShippedBlend both carry revision cycles;
  # Order carries two independent state dimensions (fulfillment x freight).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - name: plant_code
        type: string
        source: input
        description: "Human-readable plant code, unique across all Plants"
        constraints: "1-32 chars; uniqueness violation -> ERR_DUPLICATE_CODE"
      - name: name
        type: string
        source: input
        description: "Plant display name"
      - name: grid_x
        type: integer
        source: input
        description: "East-west plant coordinate, in miles, on the freight grid"
        constraints: "-5000..5000"
      - name: grid_y
        type: integer
        source: input
        description: "North-south plant coordinate, in miles, on the freight grid"
        constraints: "-5000..5000"
      - name: market_radius_miles
        type: integer
        source: input
        description: "Maximum rectilinear jobsite distance this plant will serve; the boundary is INCLUSIVE"
        constraints: "> 0"
      - name: freight_rate_cents_per_ton_mile
        type: integer
        source: input
        description: "Outbound freight rate in whole cents per billable ton per mile"
        constraints: "> 0"
      - name: base_capacity_green_units_per_day
        type: integer
        source: input
        description: "Green (unfired) unit throughput per production day, used by order_lead_time"
        constraints: "> 0"
      - name: unloading_equipment_available
        type: array
        source: input
        description: "Set of unloading equipment classes this plant can dispatch to a jobsite"
        constraints: "non-empty subset of {CUSTOMER_FORKLIFT, TRUCK_MOUNTED_FORKLIFT, CRANE}"
      - name: status
        type: enum
        source: system
        description: "Plant lifecycle. ACTIVE on creation; IDLED via POST /plants/{id}/idle"
        default: ACTIVE
        constraints: "IN {ACTIVE, IDLED}"
      - name: fired_scrap_units
        type: integer
        source: computed
        description: "Running total of fired units on FiredLots of this plant whose grade IN {OVERFIRE_SCRAP, UNDERFIRE_SCRAP}"
        default: 0
      - name: idled_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the plant transitioned ACTIVE -> IDLED; null while ACTIVE"

  - name: ClayPit
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; owning plant, supplied in the path"
      - name: pit_name
        type: string
        source: input
        description: "Pit name, unique within the owning Plant"
        constraints: "uniqueness violation within plant -> ERR_DUPLICATE_CODE"
      - name: material_type
        type: enum
        source: input
        description: "Raw material this pit yields"
        constraints: "IN {CLAY, SHALE}"
      - name: proven_reserve_tons
        type: number
        source: input
        description: "Proven reserve tonnage at pit opening; never mutated after creation"
        constraints: "> 0; 2 decimal places"
      - name: iron_oxide_pct
        type: number
        source: input
        description: "Fe2O3 content of this pit's material, in percent; drives fired color and absorption"
        constraints: "0.000..20.000; 3 decimal places"
      - name: lime_pct
        type: number
        source: input
        description: "CaO content of this pit's material, in percent"
        constraints: "0.000..10.000; 3 decimal places"
      - name: committed_tons
        type: number
        source: computed
        description: "Tonnage reserved by ProductionRuns of this pit's plant whose status IN {SETTING}; released on SCRAPPED, moved to consumed_tons on SET or HELD"
        default: 0
        constraints: "2 decimal places"
      - name: consumed_tons
        type: number
        source: computed
        description: "Tonnage irreversibly consumed by ProductionRuns whose status IN {SET, HELD, LOADED, FIRED}"
        default: 0
        constraints: "2 decimal places"
      - name: available_tons
        type: number
        source: computed
        description: "proven_reserve_tons - committed_tons - consumed_tons; the conserved quantity of clay_reserve_conservation"
        constraints: ">= 0; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "OPEN on creation; SUSPENDED by the plant-idle cascade; DEPLETED automatically when available_tons reaches exactly 0.00"
        default: OPEN
        constraints: "IN {OPEN, SUSPENDED, DEPLETED}"

  - name: BodyFormulation
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; the plant whose pits may appear in this formulation"
      - name: supersedes_formulation_id
        type: string
        source: input
        description: "FK -> BodyFormulation.id; nullable predecessor this formulation replaces. Defines the dye-lot equivalence closure walked by panel_dye_lot_equivalence"
      - name: formulation_code
        type: string
        source: input
        description: "Body formulation code, unique across all BodyFormulations"
        constraints: "uniqueness violation -> ERR_DUPLICATE_CODE"
      - name: target_color_family
        type: enum
        source: input
        description: "Fired color family this body is formulated to develop"
        constraints: "IN {RED, BUFF, GRAY, BROWN}"
      - name: target_cdi
        type: number
        source: input
        description: "Target color development index the firing curve aims at; grading compares position_cdi to this value"
        constraints: "5.00..60.00; 2 decimal places"
      - name: target_soak_hours
        type: number
        source: input
        description: "Target peak-temperature soak duration in hours; used by firing_curve_deviation"
        constraints: "0.5..24.0; 1 decimal place"
      - name: clay_tons_per_thousand_units
        type: number
        source: input
        description: "Raw material tonnage consumed per 1000 green units extruded"
        constraints: "> 0; 2 decimal places"
      - name: components
        type: array
        source: system
        description: "Ordered array of body component objects {pit_id, share_pct}, appended by POST /formulations/{id}/components in call order. Each pit_id must name a ClayPit whose plant_id equals this BodyFormulation.plant_id. Not a foreign-key field itself"
        default: []
      - name: component_share_total_pct
        type: number
        source: computed
        description: "Sum of components[].share_pct; must equal exactly 100.00 to qualify"
        default: 0
        constraints: "2 decimal places"
      - name: blend_iron_oxide_pct
        type: number
        source: computed
        description: "Share-weighted Fe2O3 of the body, per body_blend_chemistry"
        default: 0
        constraints: "3 decimal places"
      - name: blend_lime_pct
        type: number
        source: computed
        description: "Share-weighted CaO of the body, per body_blend_chemistry"
        default: 0
        constraints: "3 decimal places"
      - name: shale_share_pct
        type: number
        source: computed
        description: "Sum of share_pct over components whose ClayPit.material_type == SHALE"
        default: 0
        constraints: "2 decimal places"
      - name: absorption_index
        type: number
        source: computed
        description: "Clamped durability index per body_blend_chemistry; lower is more durable"
        default: 0
        constraints: "2.00..22.00; 2 decimal places"
      - name: computed_durability_grade
        type: enum
        source: computed
        description: "Durability grade derived from absorption_index by body_blend_chemistry"
        constraints: "IN {SW, MW, NW}"
      - name: status
        type: enum
        source: system
        description: "DRAFT on creation; QUALIFIED via POST /formulations/{id}/qualify; back to DRAFT by the plant-idle cascade; RETIRED when a successor formulation supersedes it"
        default: DRAFT
        constraints: "IN {DRAFT, QUALIFIED, RETIRED}"
      - name: qualified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent DRAFT -> QUALIFIED transition; null while never qualified"
      - name: dequalified_count
        type: integer
        source: computed
        description: "Number of QUALIFIED -> DRAFT transitions caused by the plant-idle cascade"
        default: 0

  - name: Kiln
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; owning plant, supplied in the path"
      - name: kiln_code
        type: string
        source: input
        description: "Tunnel kiln code, unique within the owning Plant"
        constraints: "uniqueness violation within plant -> ERR_DUPLICATE_CODE"
      - name: position_count
        type: integer
        source: input
        description: "Number of across-the-car kiln positions; position 1 is the outermost left, position_count the outermost right"
        constraints: "1..15"
      - name: setpoint_peak_c
        type: integer
        source: input
        description: "Firing curve setpoint peak temperature in degrees Celsius; firing_curve_deviation measures against it"
        constraints: "800..1300"
      - name: cooldown_buffer_hours
        type: number
        source: input
        description: "Mandatory post-run cooldown in hours; kiln_firing_window_overlap inflates every run's window by this amount"
        constraints: ">= 0; 1 decimal place"
      - name: status
        type: enum
        source: system
        description: "AVAILABLE on creation; MAINTENANCE when the owning plant is idled"
        default: AVAILABLE
        constraints: "IN {AVAILABLE, MAINTENANCE}"

  - name: KilnCar
    parent: Plant
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; owning plant, supplied in the path"
      - name: car_code
        type: string
        source: input
        description: "Kiln car code, unique within the owning Plant"
        constraints: "uniqueness violation within plant -> ERR_DUPLICATE_CODE"
      - name: capacity_green_units
        type: integer
        source: input
        description: "Maximum green units that may be set on this car in one ProductionRun"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "IDLE on creation; SET while a ProductionRun occupies it; IN_KILN once that run is loaded into a KilnRun; back to IDLE when the KilnRun is graded or aborted; OUT_OF_SERVICE when the owning plant is idled"
        default: IDLE
        constraints: "IN {IDLE, SET, IN_KILN, OUT_OF_SERVICE}"
      - name: current_production_run_id
        type: string
        source: system
        description: "Id of the unique ProductionRun whose kiln_car_id equals this KilnCar.id and whose status IN {SETTING, SET, HELD, LOADED}; null when the car is IDLE or OUT_OF_SERVICE. Not a foreign-key field itself"

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; plant that extrudes, cuts and sets this run"
      - name: formulation_id
        type: string
        source: input
        description: "FK -> BodyFormulation.id; body formulation extruded, must be QUALIFIED at creation"
      - name: kiln_car_id
        type: string
        source: input
        description: "FK -> KilnCar.id; car the cut green units are set on, must be IDLE at creation"
      - name: kiln_run_id
        type: string
        source: system
        description: "FK -> KilnRun.id; nullable, set by POST /kiln-runs/{id}/load and cleared when that KilnRun is aborted"
      - name: run_code
        type: string
        source: input
        description: "Production run code, unique across all ProductionRuns"
        constraints: "uniqueness violation -> ERR_DUPLICATE_CODE"
      - name: texture
        type: enum
        source: input
        description: "Face texture applied at the cutter; carried onto every FiredLot of this run"
        constraints: "IN {WIRE_CUT, SMOOTH, SAND_FACED, TUMBLED}"
      - name: green_units_set
        type: integer
        source: input
        description: "Green units cut and set on the kiln car"
        constraints: "> 0; <= KilnCar.capacity_green_units"
      - name: kiln_position
        type: integer
        source: system
        description: "Across-car kiln position assigned by POST /kiln-runs/{id}/load; null until loaded"
        constraints: "1..Kiln.position_count"
      - name: projected_net_green_units
        type: integer
        source: computed
        description: "PROJECTED variant of green_yield, computed at creation from constants only"
      - name: green_loss_units
        type: integer
        source: input
        description: "Actual green handling loss reported by POST /production-runs/{id}/close-green; null until closed"
        constraints: ">= 0; <= green_units_set"
      - name: net_green_units
        type: integer
        source: computed
        description: "ACTUAL variant of green_yield = green_units_set - green_loss_units; null until closed"
      - name: green_loss_pct
        type: number
        source: computed
        description: "round_half_up(green_loss_units * 100 / green_units_set, 2); null until closed"
        constraints: "2 decimal places"
      - name: green_loss_variance_units
        type: integer
        source: computed
        description: "net_green_units - projected_net_green_units; the signed divergence between the two green_yield variants"
      - name: clay_tons_committed
        type: number
        source: computed
        description: "round_half_up(green_units_set / 1000 * BodyFormulation.clay_tons_per_thousand_units, 2), distributed to pits by clay_tonnage_commitment"
        constraints: "2 decimal places"
      - name: scrap_units
        type: integer
        source: computed
        description: "Fired units on this run's FiredLot whose grade IN {OVERFIRE_SCRAP, UNDERFIRE_SCRAP}; 0 otherwise"
        default: 0
      - name: status
        type: enum
        source: system
        description: "SETTING on creation; SET or HELD by close-green (branch on green_loss_pct); LOADED by kiln load; FIRED by kiln grade; SCRAPPED by the plant-idle cascade"
        default: SETTING
        constraints: "IN {SETTING, SET, HELD, LOADED, FIRED, SCRAPPED}"

  - name: KilnRun
    parent: Kiln
    common_fields: true
    fields:
      - name: kiln_id
        type: string
        source: input
        description: "FK -> Kiln.id; tunnel kiln this run occupies"
      - name: formulation_id
        type: string
        source: input
        description: "FK -> BodyFormulation.id; formulation whose target_cdi and target_soak_hours the firing curve is graded against"
      - name: run_code
        type: string
        source: input
        description: "Kiln run code, unique across all KilnRuns"
        constraints: "uniqueness violation -> ERR_DUPLICATE_CODE"
      - name: start_at
        type: datetime
        source: input
        description: "Scheduled window start, ISO 8601 UTC"
      - name: end_at
        type: datetime
        source: input
        description: "Scheduled window end, ISO 8601 UTC; must be strictly after start_at"
      - name: planned_peak_temp_c
        type: integer
        source: input
        description: "Planned peak temperature in degrees Celsius"
        constraints: "800..1300"
      - name: planned_soak_hours
        type: number
        source: input
        description: "Planned soak duration in hours"
        constraints: "0.5..24.0; 2 decimal places"
      - name: actual_peak_temp_c
        type: integer
        source: input
        description: "Achieved peak temperature reported at grading; null until graded"
        constraints: "800..1300"
      - name: actual_soak_hours
        type: number
        source: input
        description: "Achieved soak duration reported at grading; null until graded"
        constraints: "0.00..24.00; 2 decimal places"
      - name: base_cdi
        type: number
        source: computed
        description: "Centerline color development index per firing_color_development; null until graded"
        constraints: "2 decimal places"
      - name: firing_curve_deviation
        type: number
        source: computed
        description: "round_half_up(abs(actual_peak_temp_c - Kiln.setpoint_peak_c) / 10 + abs(actual_soak_hours - BodyFormulation.target_soak_hours), 2); null until graded"
        constraints: "2 decimal places"
      - name: loaded_units
        type: integer
        source: computed
        description: "Sum of net_green_units over ProductionRuns whose kiln_run_id equals this KilnRun.id"
        default: 0
      - name: graded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PlantOperator that graded this run; null until graded"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED on creation; FIRING via start; GRADED via grade; ABORTED by the plant-idle cascade"
        default: SCHEDULED
        constraints: "IN {SCHEDULED, FIRING, GRADED, ABORTED}"

  - name: FiredLot
    parent: ProductionRun
    common_fields: true
    fields:
      - name: production_run_id
        type: string
        source: system
        description: "FK -> ProductionRun.id; exactly one FiredLot is synthesized per loaded ProductionRun when its KilnRun is graded"
      - name: lot_code
        type: string
        source: system
        description: "Server-minted lot code '<ProductionRun.run_code>-P<kiln_position>'"
      - name: kiln_position
        type: integer
        source: system
        description: "Copied from the ProductionRun's kiln_position at grading time"
      - name: fired_units
        type: integer
        source: system
        description: "Copied from ProductionRun.net_green_units at grading time; the conserved quantity of fired_unit_conservation"
      - name: grade
        type: enum
        source: system
        description: "Firing grade assigned by firing_color_development"
        constraints: "IN {ON_COLOR, OFF_COLOR_SALVAGE, OVERFIRE_SCRAP, UNDERFIRE_SCRAP}"
      - name: position_cdi
        type: number
        source: system
        description: "Position-corrected color development index per firing_color_development"
        constraints: "2 decimal places"
      - name: color_index
        type: number
        source: system
        description: "Shipped-blend color coordinate per firing_color_development; 0.00..100.00"
        constraints: "2 decimal places"
      - name: color_family
        type: enum
        source: system
        description: "Copied from the ProductionRun's BodyFormulation.target_color_family at grading time"
        constraints: "IN {RED, BUFF, GRAY, BROWN}"
      - name: texture
        type: enum
        source: system
        description: "Copied from ProductionRun.texture at grading time"
        constraints: "IN {WIRE_CUT, SMOOTH, SAND_FACED, TUMBLED}"
      - name: durability_grade
        type: enum
        source: system
        description: "Copied from the ProductionRun's BodyFormulation.computed_durability_grade at grading time; pinned, later formulation edits do not change it"
        constraints: "IN {SW, MW, NW}"
      - name: dye_lot_code
        type: string
        source: system
        description: "Server-minted '<BodyFormulation.formulation_code>-<KilnRun.run_code>-P<kiln_position>'; the dye lot identity a SamplePanel is approved against"
      - name: source_formulation_id
        type: string
        source: system
        description: "Id of the BodyFormulation the lot was fired from, copied from ProductionRun.formulation_id at grading time; panel_dye_lot_equivalence walks the supersession closure from here. Not a foreign-key field itself"
      - name: reserved_units
        type: integer
        source: computed
        description: "Sum of BlendComponent.units over components of this lot whose status == ALLOCATED"
        default: 0
      - name: consumed_units
        type: integer
        source: computed
        description: "Sum of BlendComponent.units over components of this lot whose status == CONSUMED"
        default: 0
      - name: available_units
        type: integer
        source: computed
        description: "fired_units - reserved_units - consumed_units"
        constraints: ">= 0"
      - name: quarantine_reason
        type: string
        source: input
        description: "Reason recorded by POST /fired-lots/{id}/quarantine; null unless QUARANTINED"
      - name: status
        type: enum
        source: system
        description: "AVAILABLE at creation when grade IN {ON_COLOR, OFF_COLOR_SALVAGE}; SCRAP at creation when grade IN {OVERFIRE_SCRAP, UNDERFIRE_SCRAP}; RESERVED while reserved_units > 0; back to AVAILABLE when reserved_units returns to 0; CONSUMED when the owning order is delivered; QUARANTINED by the quality hold endpoint"
        constraints: "IN {AVAILABLE, RESERVED, CONSUMED, QUARANTINED, SCRAP}"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: system
        description: "FK -> Plant.id; nullable until POST /orders/{id}/assign-plant runs plant_assignment_selector"
      - name: order_code
        type: string
        source: input
        description: "Order code, unique across all Orders"
        constraints: "uniqueness violation -> ERR_DUPLICATE_CODE"
      - name: jobsite_grid_x
        type: integer
        source: input
        description: "East-west jobsite coordinate, in miles, on the freight grid"
        constraints: "-5000..5000"
      - name: jobsite_grid_y
        type: integer
        source: input
        description: "North-south jobsite coordinate, in miles, on the freight grid"
        constraints: "-5000..5000"
      - name: requested_units
        type: integer
        source: input
        description: "Masonry units the customer ordered"
        constraints: "> 0"
      - name: color_family
        type: enum
        source: input
        description: "Required fired color family; constrains both plant assignment and blend eligibility"
        constraints: "IN {RED, BUFF, GRAY, BROWN}"
      - name: texture
        type: enum
        source: input
        description: "Required face texture"
        constraints: "IN {WIRE_CUT, SMOOTH, SAND_FACED, TUMBLED}"
      - name: durability_grade
        type: enum
        source: input
        description: "Minimum acceptable durability grade; DURABILITY_RANK ranks SW=3 > MW=2 > NW=1"
        constraints: "IN {SW, MW, NW}"
      - name: is_special_order
        type: boolean
        source: input
        description: "Special (non-stock) color and texture combination; adds SPECIAL_ORDER_LEAD_DAYS to order_lead_time"
        default: false
      - name: requires_panel_approval
        type: boolean
        source: input
        description: "Architectural project requiring an APPROVED SamplePanel before blend certification; adds PANEL_APPROVAL_LEAD_DAYS to order_lead_time"
        default: false
      - name: unloading_equipment_required
        type: enum
        source: input
        description: "Unloading equipment the jobsite requires; must be present in the assigned Plant.unloading_equipment_available"
        constraints: "IN {CUSTOMER_FORKLIFT, TRUCK_MOUNTED_FORKLIFT, CRANE}"
      - name: banding_type
        type: enum
        source: input
        description: "Banding material used at packaging; BAND_WEIGHT_LB is keyed on it"
        constraints: "IN {STEEL, POLY}"
      - name: pallet_count
        type: integer
        source: input
        description: "Pallets actually banded, reported by POST /orders/{id}/package; null until packaged"
        constraints: "> 0"
      - name: band_count
        type: integer
        source: input
        description: "Bands actually applied, reported by POST /orders/{id}/package; null until packaged"
        constraints: "> 0"
      - name: unloading_equipment_provided
        type: enum
        source: input
        description: "Equipment actually dispatched, reported by POST /orders/{id}/deliver; must equal unloading_equipment_required"
        constraints: "IN {CUSTOMER_FORKLIFT, TRUCK_MOUNTED_FORKLIFT, CRANE}"
      - name: distance_miles
        type: integer
        source: computed
        description: "abs(jobsite_grid_x - Plant.grid_x) + abs(jobsite_grid_y - Plant.grid_y) for the assigned plant; null until assigned"
      - name: estimated_billable_tons
        type: number
        source: computed
        description: "ESTIMATED variant billable tonnage per order_freight_cost; null until assigned"
        constraints: "2 decimal places"
      - name: estimated_base_freight_cents
        type: integer
        source: computed
        description: "ESTIMATED variant base freight in whole cents; null until assigned"
      - name: estimated_fuel_surcharge_cents
        type: integer
        source: computed
        description: "ESTIMATED variant fuel surcharge in whole cents; null until assigned"
      - name: estimated_freight_cents
        type: integer
        source: computed
        description: "estimated_base_freight_cents + estimated_fuel_surcharge_cents; null until assigned"
      - name: final_billable_tons
        type: number
        source: computed
        description: "FINAL variant billable tonnage per order_freight_cost; null until packaged"
        constraints: "2 decimal places"
      - name: final_base_freight_cents
        type: integer
        source: computed
        description: "FINAL variant base freight in whole cents; null until packaged"
      - name: final_fuel_surcharge_cents
        type: integer
        source: computed
        description: "FINAL variant fuel surcharge in whole cents; null until packaged"
      - name: final_freight_cents
        type: integer
        source: computed
        description: "final_base_freight_cents + final_fuel_surcharge_cents; null until packaged"
      - name: freight_variance_cents
        type: integer
        source: computed
        description: "final_freight_cents - estimated_freight_cents; the signed divergence between the two order_freight_cost variants; null until packaged"
      - name: lead_time_days
        type: integer
        source: computed
        description: "Whole days per order_lead_time; null until assigned"
      - name: promised_ship_date
        type: datetime
        source: computed
        description: "Logical clock at assignment plus lead_time_days whole days; null until assigned"
      - name: assigned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SalesRep that ran plant assignment; null until assigned"
      - name: packaged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LogisticsCoordinator that packaged the order; null until packaged"
      - name: assigned_at
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT -> ASSIGNED fulfillment transition; null while unassigned"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PACKAGED -> DELIVERED fulfillment transition; null until delivered"
      - name: invoiced_at
        type: datetime
        source: system
        description: "Logical-clock instant of the FINALIZED -> INVOICED freight transition; null until invoiced"
      - name: cancellation_reason
        type: string
        source: input
        description: "Reason recorded by POST /orders/{id}/cancel; null unless CANCELLED"
      - name: fulfillment_status
        type: enum
        source: system
        description: "First independent state dimension - where the bricks are. DRAFT on creation; ASSIGNED at plant assignment; IN_BLENDING once a ShippedBlend exists; PACKAGED; DELIVERED; CANCELLED"
        default: DRAFT
        constraints: "IN {DRAFT, ASSIGNED, IN_BLENDING, PACKAGED, DELIVERED, CANCELLED}"
      - name: freight_status
        type: enum
        source: system
        description: "Second independent state dimension - where the money is, evolving on its own axis. UNQUOTED on creation; ESTIMATED at plant assignment; FINALIZED at packaging; INVOICED at delivery; WAIVED when the order is cancelled"
        default: UNQUOTED
        constraints: "IN {UNQUOTED, ESTIMATED, FINALIZED, INVOICED, WAIVED}"

  - name: ShippedBlend
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; owning order, supplied in the path"
      - name: blend_code
        type: string
        source: input
        description: "Blend code, unique across all ShippedBlends"
        constraints: "uniqueness violation -> ERR_DUPLICATE_CODE"
      - name: target_color_index_min
        type: number
        source: input
        description: "Inclusive lower bound of the shipped color range"
        constraints: "0.00..100.00; 2 decimal places; must be < target_color_index_max"
      - name: target_color_index_max
        type: number
        source: input
        description: "Inclusive upper bound of the shipped color range"
        constraints: "0.00..100.00; 2 decimal places"
      - name: target_color_index_midpoint
        type: number
        source: computed
        description: "round_half_up((target_color_index_min + target_color_index_max) / 2, 2); the ranking key of blend_autofill_waterfall"
        constraints: "2 decimal places"
      - name: requested_units
        type: integer
        source: input
        description: "Units this blend must deliver; must be <= Order.requested_units"
        constraints: "> 0"
      - name: allocated_units
        type: integer
        source: computed
        description: "Sum of BlendComponent.units over components whose status == ALLOCATED"
        default: 0
      - name: weighted_color_index
        type: number
        source: computed
        description: "Unit-weighted mean color index per blend_color_profile; null until composed"
        constraints: "2 decimal places"
      - name: color_range_span
        type: number
        source: computed
        description: "max minus min FiredLot.color_index over ALLOCATED components; null until composed"
        constraints: "2 decimal places"
      - name: dye_lot_count
        type: integer
        source: computed
        description: "Count of distinct FiredLot.dye_lot_code over ALLOCATED components; null until composed"
        default: 0
      - name: panel_delta_e
        type: number
        source: computed
        description: "round_half_up(abs(weighted_color_index - SamplePanel.approved_color_index), 2) at certification; null when the order needs no panel"
        constraints: "2 decimal places"
      - name: composed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BlendTechnician that composed this blend; null until composed"
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityManager that certified this blend; must differ from composed_by_user_id"
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock instant of certification; null until certified"
      - name: rejection_reason
        type: string
        source: input
        description: "Reason recorded by the most recent POST /blends/{id}/reject; null when never rejected"
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of COMPOSED -> DRAFT revision cycles this blend has taken"
        default: 0
      - name: status
        type: enum
        source: system
        description: "DRAFT on creation; COMPOSED via compose; back to DRAFT via reject (revision cycle); CERTIFIED via certify; RELEASED when the order is delivered; VOID by the order-cancel cascade"
        default: DRAFT
        constraints: "IN {DRAFT, COMPOSED, CERTIFIED, RELEASED, VOID}"

  - name: BlendComponent
    parent: ShippedBlend
    common_fields: true
    fields:
      - name: blend_id
        type: string
        source: input
        description: "FK -> ShippedBlend.id; owning blend, supplied in the path"
      - name: fired_lot_id
        type: string
        source: input
        description: "FK -> FiredLot.id; inventory lot this component draws from"
      - name: units
        type: integer
        source: input
        description: "Units drawn from the lot"
        constraints: "> 0; <= FiredLot.available_units at allocation time"
      - name: color_index_at_allocation
        type: number
        source: system
        description: "Snapshot of FiredLot.color_index when the component was allocated"
        constraints: "2 decimal places"
      - name: contribution_index
        type: number
        source: computed
        description: "round_half_up(color_index_at_allocation * units, 2); traceability only, never the numerator of blend_color_profile"
        constraints: "2 decimal places"
      - name: source
        type: enum
        source: system
        description: "MANUAL when created by POST /blends/{id}/components; AUTO_FILL when synthesized by blend_autofill_waterfall"
        constraints: "IN {MANUAL, AUTO_FILL}"
      - name: status
        type: enum
        source: system
        description: "ALLOCATED on creation; VOIDED by blend reject or the order-cancel cascade; CONSUMED when the order is delivered"
        default: ALLOCATED
        constraints: "IN {ALLOCATED, VOIDED, CONSUMED}"

  - name: SamplePanel
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; architectural project order, supplied in the path"
      - name: formulation_id
        type: string
        source: input
        description: "FK -> BodyFormulation.id; formulation the panel was laid up from; the root of the dye-lot equivalence closure"
      - name: dye_lot_id
        type: string
        source: input
        description: "FK -> FiredLot.id; the physical lot the panel was built from"
      - name: panel_code
        type: string
        source: input
        description: "Panel code, unique across all SamplePanels"
        constraints: "uniqueness violation -> ERR_DUPLICATE_CODE"
      - name: panel_color_index
        type: number
        source: input
        description: "Color index measured on the laid-up panel"
        constraints: "0.00..100.00; 2 decimal places"
      - name: tolerance_delta_e
        type: number
        source: input
        description: "Maximum acceptable absolute color-index deviation between the approved panel and the shipped blend"
        constraints: "0.00..20.00; 2 decimal places"
      - name: pinned_formulation_version
        type: integer
        source: system
        description: "BodyFormulation.version captured at approval; later formulation mutations do not move it"
      - name: pinned_dye_lot_code
        type: string
        source: system
        description: "FiredLot.dye_lot_code captured at approval"
      - name: approved_color_index
        type: number
        source: system
        description: "panel_color_index captured at approval; null until approved"
        constraints: "2 decimal places"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BlendTechnician that submitted the panel for review"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ArchitectReviewer that approved the panel; must differ from submitted_by_user_id"
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of approval; null until approved"
      - name: expires_at
        type: datetime
        source: system
        description: "approved_at plus PANEL_APPROVAL_VALID_DAYS whole days; null until approved"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of completed SUBMITTED -> REVISION_REQUESTED transitions; PANEL_MAX_REVISION_ROUNDS caps it"
        default: 0
      - name: revision_note
        type: string
        source: input
        description: "Note recorded by POST /sample-panels/{id}/request-revision; null when never revised"
      - name: status
        type: enum
        source: system
        description: "DRAFT on creation; SUBMITTED via submit; REVISION_REQUESTED via request-revision, which returns to SUBMITTED via submit (revision cycle); APPROVED via approve; EXPIRED when a certification observes the clock at or past expires_at; WITHDRAWN by the order-cancel cascade"
        default: DRAFT
        constraints: "IN {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, EXPIRED, WITHDRAWN}"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Plant
    initial_state: ACTIVE
    terminal_states: [IDLED]
    transitions:
      - from: ACTIVE
        to: IDLED
        trigger: "POST /plants/{id}/idle"
        actor: PlantAdmin
        preconditions:
          - "Plant.status == ACTIVE"
        side_effects:
          - "Sets Plant.idled_at to the current logical clock"
          - "Sets every Kiln whose plant_id == Plant.id to MAINTENANCE"
          - "Sets every KilnCar whose plant_id == Plant.id to OUT_OF_SERVICE and clears current_production_run_id"
          - "CASCADE HOP 1: every ClayPit whose plant_id == Plant.id and status == OPEN transitions OPEN -> SUSPENDED"
          - "CASCADE HOP 2 (caused by hop 1): every BodyFormulation whose status == QUALIFIED and whose components[] contain a pit_id now SUSPENDED transitions QUALIFIED -> DRAFT, clears qualified_at and increments dequalified_count by 1"
          - "CASCADE HOP 3 (caused by hop 2): every ProductionRun whose status == SETTING and whose formulation_id is one of the formulations de-qualified in hop 2 transitions SETTING -> SCRAPPED"
          - "CASCADE HOP 4 (caused by hop 3): for every ProductionRun scrapped in hop 3, clay_tonnage_commitment runs in RELEASE mode, decrementing each contributing ClayPit.committed_tons by the exact per-pit amount committed at run creation, restoring ClayPit.available_tons; a pit whose status is DEPLETED and whose available_tons becomes > 0.00 returns to SUSPENDED"
          - "CASCADE HOP 3b (also caused by hop 1 through the kiln branch): every KilnRun whose kiln_id belongs to this plant and whose status IN {SCHEDULED, FIRING} transitions to ABORTED"
          - "CASCADE HOP 4b (caused by hop 3b): every ProductionRun whose kiln_run_id is one of the aborted KilnRuns and whose status == LOADED reverts LOADED -> SET and has kiln_run_id and kiln_position cleared"
          - "Bumps Plant.version by 1 and refreshes updated_at on every entity touched by any hop"
        note: "IDLED is terminal; no endpoint reactivates a plant. Hop ordering is fixed: pits, then formulations, then production runs, then tonnage release; the kiln branch (3b, 4b) runs after hop 4."

  - entity: ClayPit
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "system event: plant-idle cascade hop 1"
        actor: system
        preconditions:
          - "ClayPit.status == OPEN"
          - "owning Plant transitioned ACTIVE -> IDLED in this request"
        side_effects:
          - "Makes every QUALIFIED BodyFormulation containing this pit ineligible, driving cascade hop 2"
      - from: OPEN
        to: DEPLETED
        trigger: "system event: clay_tonnage_commitment COMMIT mode drives available_tons to exactly 0.00"
        actor: system
        preconditions:
          - "ClayPit.status == OPEN"
          - "available_tons == 0.00 after the commitment is applied"
        side_effects:
          - "Blocks any later POST /formulations/{id}/qualify that names this pit"
        note: "Boundary is exact: available_tons == 0.00 depletes, available_tons == 0.01 does not."
      - from: DEPLETED
        to: SUSPENDED
        trigger: "system event: plant-idle cascade hop 4 releases committed tonnage back to a depleted pit"
        actor: system
        preconditions:
          - "ClayPit.status == DEPLETED"
          - "available_tons > 0.00 after the release"
        side_effects: []

  - entity: BodyFormulation
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: QUALIFIED
        trigger: "POST /formulations/{id}/qualify"
        actor: BodyEngineer
        preconditions:
          - "BodyFormulation.status == DRAFT"
          - "component_share_total_pct == 100.00 exactly"
          - "every components[].pit_id names a ClayPit whose status == OPEN"
          - "owning Plant.status == ACTIVE"
        side_effects:
          - "Recomputes body_blend_chemistry, writing blend_iron_oxide_pct, blend_lime_pct, shale_share_pct, absorption_index and computed_durability_grade"
          - "Sets qualified_at to the current logical clock"
          - "Bumps BodyFormulation.version by 1"
      - from: QUALIFIED
        to: DRAFT
        trigger: "system event: plant-idle cascade hop 2"
        actor: system
        preconditions:
          - "BodyFormulation.status == QUALIFIED"
          - "at least one components[].pit_id transitioned to SUSPENDED in cascade hop 1 of this request"
        side_effects:
          - "Clears qualified_at, increments dequalified_count by 1"
          - "Drives cascade hop 3 on every SETTING ProductionRun referencing this formulation"
        note: "Revision cycle: DRAFT -> QUALIFIED -> DRAFT -> QUALIFIED is legal any number of times."
      - from: QUALIFIED
        to: RETIRED
        trigger: "system event: POST /formulations creates a successor whose supersedes_formulation_id names this formulation"
        actor: system
        preconditions:
          - "BodyFormulation.status == QUALIFIED"
          - "successor.plant_id == this BodyFormulation.plant_id"
        side_effects:
          - "The successor's id is now reachable from this formulation through the supersession closure walked by panel_dye_lot_equivalence"
          - "Bumps this BodyFormulation.version by 1"

  - entity: KilnCar
    initial_state: IDLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: IDLE
        to: SET
        trigger: "POST /production-runs"
        actor: PlantOperator
        preconditions:
          - "KilnCar.status == IDLE"
          - "KilnCar.plant_id == the new ProductionRun.plant_id"
          - "green_units_set <= KilnCar.capacity_green_units"
        side_effects:
          - "Sets current_production_run_id to the new ProductionRun.id"
      - from: SET
        to: IN_KILN
        trigger: "POST /kiln-runs/{id}/load"
        actor: PlantOperator
        preconditions:
          - "KilnCar.status == SET"
          - "the ProductionRun on this car has status == SET"
        side_effects: []
      - from: IN_KILN
        to: IDLE
        trigger: "POST /kiln-runs/{id}/grade, or system event: plant-idle cascade hop 4b abort"
        actor: PlantOperator | system
        preconditions:
          - "KilnCar.status == IN_KILN"
        side_effects:
          - "Clears current_production_run_id"
      - from: IDLE
        to: OUT_OF_SERVICE
        trigger: "system event: plant-idle cascade"
        actor: system
        preconditions:
          - "owning Plant transitioned ACTIVE -> IDLED in this request"
        side_effects: []
      - from: SET
        to: OUT_OF_SERVICE
        trigger: "system event: plant-idle cascade"
        actor: system
        preconditions:
          - "owning Plant transitioned ACTIVE -> IDLED in this request"
        side_effects:
          - "Clears current_production_run_id"
      - from: IN_KILN
        to: OUT_OF_SERVICE
        trigger: "system event: plant-idle cascade"
        actor: system
        preconditions:
          - "owning Plant transitioned ACTIVE -> IDLED in this request"
        side_effects:
          - "Clears current_production_run_id"

  - entity: ProductionRun
    initial_state: SETTING
    terminal_states: [FIRED, HELD, SCRAPPED]
    transitions:
      - from: SETTING
        to: SET
        trigger: "POST /production-runs/{id}/close-green"
        actor: PlantOperator
        preconditions:
          - "ProductionRun.status == SETTING"
          - "green_loss_units <= green_units_set"
          - "green_loss_pct <= GREEN_LOSS_HOLD_PCT (6.00)"
        side_effects:
          - "Writes net_green_units, green_loss_pct and green_loss_variance_units from the ACTUAL variant of green_yield"
          - "clay_tonnage_commitment runs in CONSUME mode: each contributing ClayPit.committed_tons decreases and consumed_tons increases by the exact same per-pit amount, leaving available_tons unchanged"
          - "Bumps ProductionRun.version by 1"
        note: "Branch A of the SETTING fork. The boundary is inclusive: green_loss_pct == 6.00 lands here, 6.01 lands in HELD."
      - from: SETTING
        to: HELD
        trigger: "POST /production-runs/{id}/close-green"
        actor: PlantOperator
        preconditions:
          - "ProductionRun.status == SETTING"
          - "green_loss_units <= green_units_set"
          - "green_loss_pct > GREEN_LOSS_HOLD_PCT (6.00)"
        side_effects:
          - "Writes net_green_units, green_loss_pct and green_loss_variance_units from the ACTUAL variant of green_yield"
          - "clay_tonnage_commitment runs in CONSUME mode exactly as in branch A"
          - "Does NOT make the run loadable: POST /kiln-runs/{id}/load requires status == SET"
          - "Bumps ProductionRun.version by 1"
        note: "Branch B of the SETTING fork; HELD is terminal, the green units are written off to loss review."
      - from: SET
        to: LOADED
        trigger: "POST /kiln-runs/{id}/load"
        actor: PlantOperator
        preconditions:
          - "ProductionRun.status == SET"
          - "ProductionRun.plant_id == the Kiln's plant_id for the target KilnRun"
          - "ProductionRun.formulation_id == KilnRun.formulation_id"
          - "target KilnRun.status == SCHEDULED"
          - "kiln_position within 1..Kiln.position_count and not already taken in this KilnRun"
          - "kiln_car_occupancy_overlap passes for the run's KilnCar"
        side_effects:
          - "Sets kiln_run_id and kiln_position"
          - "Moves the run's KilnCar SET -> IN_KILN"
          - "Recomputes KilnRun.loaded_units and bumps KilnRun.version by 1"
      - from: LOADED
        to: FIRED
        trigger: "POST /kiln-runs/{id}/grade"
        actor: PlantOperator
        preconditions:
          - "ProductionRun.status == LOADED"
          - "the owning KilnRun.status == FIRING"
        side_effects:
          - "CASCADE HOP 1: synthesizes exactly one FiredLot for this run using firing_color_development"
          - "CASCADE HOP 2 (caused by hop 1): when the new FiredLot.grade IN {OVERFIRE_SCRAP, UNDERFIRE_SCRAP}, sets this run's scrap_units to the lot's fired_units and increments Plant.fired_scrap_units by the same amount"
          - "CASCADE HOP 3 (caused by hop 1): moves the run's KilnCar IN_KILN -> IDLE and clears current_production_run_id"
      - from: LOADED
        to: SET
        trigger: "system event: plant-idle cascade hop 4b"
        actor: system
        preconditions:
          - "ProductionRun.status == LOADED"
          - "owning KilnRun transitioned to ABORTED in this request"
        side_effects:
          - "Clears kiln_run_id and kiln_position"
          - "Moves the run's KilnCar IN_KILN -> OUT_OF_SERVICE (the plant is idling)"
      - from: SETTING
        to: SCRAPPED
        trigger: "system event: plant-idle cascade hop 3"
        actor: system
        preconditions:
          - "ProductionRun.status == SETTING"
          - "the run's BodyFormulation was de-qualified by cascade hop 2 of this request"
        side_effects:
          - "clay_tonnage_commitment runs in RELEASE mode (cascade hop 4), returning the exact per-pit committed tonnage"
          - "Moves the run's KilnCar to OUT_OF_SERVICE and clears current_production_run_id"

  - entity: KilnRun
    initial_state: SCHEDULED
    terminal_states: [GRADED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: FIRING
        trigger: "POST /kiln-runs/{id}/start"
        actor: PlantOperator
        preconditions:
          - "KilnRun.status == SCHEDULED"
          - "at least one ProductionRun has kiln_run_id == KilnRun.id"
          - "the owning Kiln.status == AVAILABLE"
        side_effects:
          - "Bumps KilnRun.version by 1"
      - from: FIRING
        to: GRADED
        trigger: "POST /kiln-runs/{id}/grade"
        actor: PlantOperator
        preconditions:
          - "KilnRun.status == FIRING"
          - "actual_peak_temp_c and actual_soak_hours are supplied and in range"
        side_effects:
          - "Writes base_cdi and firing_curve_deviation from firing_color_development"
          - "Sets graded_by_user_id to the acting X-User-ID"
          - "Drives ProductionRun LOADED -> FIRED for every loaded run, which itself synthesizes one FiredLot per run and then releases each KilnCar"
          - "Bumps KilnRun.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "system event: plant-idle cascade hop 3b"
        actor: system
        preconditions:
          - "KilnRun.status == SCHEDULED"
          - "the Kiln's owning Plant transitioned ACTIVE -> IDLED in this request"
        side_effects:
          - "Drives cascade hop 4b: every LOADED ProductionRun on this run reverts to SET"
          - "Excludes this run's window from both kiln_firing_window_overlap and kiln_car_occupancy_overlap for all later checks"
      - from: FIRING
        to: ABORTED
        trigger: "system event: plant-idle cascade hop 3b"
        actor: system
        preconditions:
          - "KilnRun.status == FIRING"
          - "the Kiln's owning Plant transitioned ACTIVE -> IDLED in this request"
        side_effects:
          - "Drives cascade hop 4b exactly as from SCHEDULED"

  - entity: FiredLot
    initial_state: AVAILABLE
    terminal_states: [CONSUMED, SCRAP, QUARANTINED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /blends/{id}/components, or system event: blend_autofill_waterfall"
        actor: BlendTechnician | system
        preconditions:
          - "FiredLot.status == AVAILABLE"
          - "units <= FiredLot.available_units"
        side_effects:
          - "Increases reserved_units by the component's units and decreases available_units by the same amount"
          - "Recomputes ShippedBlend.allocated_units and bumps ShippedBlend.version by 1"
        note: "Initial state is AVAILABLE only for grade IN {ON_COLOR, OFF_COLOR_SALVAGE}; grade IN {OVERFIRE_SCRAP, UNDERFIRE_SCRAP} is created directly in SCRAP."
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /blends/{id}/reject, or system event: order-cancel cascade"
        actor: QualityManager | system
        preconditions:
          - "FiredLot.status == RESERVED"
          - "every BlendComponent of this lot in the affected blend moves ALLOCATED -> VOIDED"
          - "reserved_units returns to exactly 0 after the release"
        side_effects:
          - "Restores available_units to its pre-reservation value, which is the fired_unit_conservation invariant"
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /orders/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "FiredLot.status == RESERVED"
          - "the owning ShippedBlend transitions CERTIFIED -> RELEASED in this request"
        side_effects:
          - "Moves every ALLOCATED BlendComponent of this lot in that blend to CONSUMED, shifting reserved_units into consumed_units"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /fired-lots/{id}/quarantine"
        actor: QualityManager
        preconditions:
          - "FiredLot.status IN {AVAILABLE, RESERVED}"
          - "FiredLot.grade != OVERFIRE_SCRAP and != UNDERFIRE_SCRAP"
        side_effects:
          - "Records quarantine_reason"
          - "Excludes the lot from blend_autofill_waterfall eligibility and from manual component addition"
      - from: RESERVED
        to: QUARANTINED
        trigger: "POST /fired-lots/{id}/quarantine"
        actor: QualityManager
        preconditions:
          - "FiredLot.status == RESERVED"
        side_effects:
          - "Records quarantine_reason; existing ALLOCATED components are left untouched, but the blend can no longer be certified"

  - entity: ShippedBlend
    initial_state: DRAFT
    terminal_states: [RELEASED, VOID]
    transitions:
      - from: DRAFT
        to: COMPOSED
        trigger: "POST /blends/{id}/compose"
        actor: BlendTechnician
        preconditions:
          - "ShippedBlend.status == DRAFT"
          - "after optional blend_autofill_waterfall, allocated_units == requested_units exactly"
          - "color_range_span <= BLEND_SPAN_CEILING (12.00)"
          - "every ALLOCATED component's FiredLot.status == RESERVED and grade == ON_COLOR"
        side_effects:
          - "When auto_fill is true and allocated_units < requested_units, blend_autofill_waterfall synthesizes AUTO_FILL components before the equality check"
          - "Writes weighted_color_index, color_range_span and dye_lot_count from blend_color_profile"
          - "Sets composed_by_user_id to the acting X-User-ID"
          - "Bumps ShippedBlend.version by 1"
      - from: COMPOSED
        to: DRAFT
        trigger: "POST /blends/{id}/reject"
        actor: QualityManager
        preconditions:
          - "ShippedBlend.status == COMPOSED"
        side_effects:
          - "CASCADE HOP 1: records rejection_reason, increments rejection_count by 1, clears weighted_color_index, color_range_span, dye_lot_count and composed_by_user_id"
          - "CASCADE HOP 2 (caused by hop 1): every BlendComponent of this blend moves ALLOCATED -> VOIDED and allocated_units returns to 0"
          - "CASCADE HOP 3 (caused by hop 2): every FiredLot referenced by those components has reserved_units decremented by the voided units; a lot whose reserved_units reaches 0 moves RESERVED -> AVAILABLE with available_units restored to its pre-reservation value"
          - "Bumps ShippedBlend.version by 1"
        note: "Revision cycle: DRAFT -> COMPOSED -> DRAFT is legal any number of times; rejection_count records the rounds."
      - from: COMPOSED
        to: CERTIFIED
        trigger: "POST /blends/{id}/certify"
        actor: QualityManager
        preconditions:
          - "ShippedBlend.status == COMPOSED"
          - "acting X-User-ID != composed_by_user_id"
          - "no ALLOCATED component's FiredLot.status == QUARANTINED"
          - "when Order.requires_panel_approval is true: the Order has a SamplePanel whose status == APPROVED and whose expires_at is strictly after the current logical clock"
          - "when a panel applies: panel_dye_lot_equivalence passes for every ALLOCATED component"
          - "when a panel applies: panel_delta_e <= SamplePanel.tolerance_delta_e"
        side_effects:
          - "Writes panel_delta_e when a panel applies, sets certified_by_user_id and certified_at"
          - "Bumps ShippedBlend.version by 1"
      - from: CERTIFIED
        to: RELEASED
        trigger: "POST /orders/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "ShippedBlend.status == CERTIFIED"
          - "the owning Order transitions PACKAGED -> DELIVERED in this request"
        side_effects:
          - "Moves every ALLOCATED BlendComponent to CONSUMED, which shifts each FiredLot's reserved_units into consumed_units and moves those lots RESERVED -> CONSUMED"
      - from: DRAFT
        to: VOID
        trigger: "system event: order-cancel cascade"
        actor: system
        preconditions:
          - "ShippedBlend.status IN {DRAFT, COMPOSED, CERTIFIED}"
          - "the owning Order transitioned to CANCELLED in this request"
        side_effects:
          - "Voids every ALLOCATED component and releases the referenced FiredLots exactly as the reject cascade does"
      - from: COMPOSED
        to: VOID
        trigger: "system event: order-cancel cascade"
        actor: system
        preconditions:
          - "ShippedBlend.status == COMPOSED"
          - "the owning Order transitioned to CANCELLED in this request"
        side_effects:
          - "Voids every ALLOCATED component and releases the referenced FiredLots"
      - from: CERTIFIED
        to: VOID
        trigger: "system event: order-cancel cascade"
        actor: system
        preconditions:
          - "ShippedBlend.status == CERTIFIED"
          - "the owning Order transitioned to CANCELLED in this request"
        side_effects:
          - "Voids every ALLOCATED component and releases the referenced FiredLots"

  - entity: SamplePanel
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sample-panels/{id}/submit"
        actor: BlendTechnician
        preconditions:
          - "SamplePanel.status == DRAFT"
          - "the panel's BodyFormulation.status == QUALIFIED"
        side_effects:
          - "Sets submitted_by_user_id to the acting X-User-ID"
          - "Bumps SamplePanel.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /sample-panels/{id}/request-revision"
        actor: ArchitectReviewer
        preconditions:
          - "SamplePanel.status == SUBMITTED"
          - "revision_round < PANEL_MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "Records revision_note, increments revision_round by 1"
          - "Bumps SamplePanel.version by 1"
        note: "Boundary: the request that would take revision_round from 3 to 4 is rejected with ERR_PANEL_REVISION_LIMIT."
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /sample-panels/{id}/submit"
        actor: BlendTechnician
        preconditions:
          - "SamplePanel.status == REVISION_REQUESTED"
          - "the panel's BodyFormulation.status == QUALIFIED"
        side_effects:
          - "Overwrites submitted_by_user_id with the acting X-User-ID"
          - "Bumps SamplePanel.version by 1"
        note: "This closes the revision cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sample-panels/{id}/approve"
        actor: ArchitectReviewer
        preconditions:
          - "SamplePanel.status == SUBMITTED"
          - "acting X-User-ID != submitted_by_user_id"
          - "the panel's BodyFormulation.status == QUALIFIED"
          - "the panel's FiredLot.status != QUARANTINED"
        side_effects:
          - "Pins pinned_formulation_version to the BodyFormulation.version observed now, and pinned_dye_lot_code to the FiredLot.dye_lot_code"
          - "Sets approved_color_index to panel_color_index, approved_by_user_id, approved_at to the current logical clock and expires_at to approved_at plus PANEL_APPROVAL_VALID_DAYS (180) whole days"
          - "Bumps SamplePanel.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system event: POST /blends/{id}/certify observes the logical clock at or past expires_at"
        actor: system
        preconditions:
          - "SamplePanel.status == APPROVED"
          - "current logical clock >= expires_at"
        side_effects:
          - "The certification that observed the expiry is rejected with ERR_PANEL_APPROVAL_EXPIRED, and the panel is left EXPIRED"
        note: "Boundary is inclusive: clock == expires_at expires the panel, clock == expires_at minus one second does not."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system event: order-cancel cascade"
        actor: system
        preconditions:
          - "SamplePanel.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED}"
          - "the owning Order transitioned to CANCELLED in this request"
        side_effects: []
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "system event: order-cancel cascade"
        actor: system
        preconditions:
          - "SamplePanel.status == REVISION_REQUESTED"
          - "the owning Order transitioned to CANCELLED in this request"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system event: order-cancel cascade"
        actor: system
        preconditions:
          - "SamplePanel.status == DRAFT"
          - "the owning Order transitioned to CANCELLED in this request"
        side_effects: []

  # Order carries TWO independent state dimensions on the same row: fulfillment_status
  # (where the bricks are in the make-and-ship pipeline) and freight_status (where the
  # money is in the quote-and-invoice pipeline). They advance on different triggers and
  # a given request may move one, the other, or both. This is the parallel-dimension
  # machine required by the non-linear-shape rule; the other non-linear machine is the
  # SamplePanel revision cycle on a different entity.
  - entity: Order
    state_field: fulfillment_status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ASSIGNED
        trigger: "POST /orders/{id}/assign-plant"
        actor: SalesRep
        preconditions:
          - "Order.fulfillment_status == DRAFT"
          - "plant_assignment_selector returns a non-empty eligible pool"
        side_effects:
          - "Writes plant_id, distance_miles and assigned_at from plant_assignment_selector"
          - "Advances the freight_status dimension UNQUOTED -> ESTIMATED in the same request"
          - "Writes promised_ship_date from order_lead_time using the winning plant's base_capacity_green_units_per_day"
          - "Bumps Order.version by 1"
      - from: ASSIGNED
        to: IN_BLENDING
        trigger: "POST /orders/{id}/blends"
        actor: BlendTechnician
        preconditions:
          - "Order.fulfillment_status == ASSIGNED"
          - "Order.plant_id is set"
          - "target_color_index_min <= target_color_index_max"
        side_effects:
          - "Creates the ShippedBlend in DRAFT"
          - "Bumps Order.version by 1"
        note: "freight_status is untouched here — this is the dimension independence claim."
      - from: IN_BLENDING
        to: PACKAGED
        trigger: "POST /orders/{id}/package"
        actor: LogisticsCoordinator
        preconditions:
          - "Order.fulfillment_status == IN_BLENDING"
          - "the Order's ShippedBlend.status == CERTIFIED"
          - "pallet_count * PALLET_UNITS (500) >= the blend's allocated_units"
          - "band_count >= pallet_count"
        side_effects:
          - "Records pallet_count, band_count and banding_material"
          - "Advances the freight_status dimension ESTIMATED -> FINALIZED in the same request, which writes final_freight_cents and freight_variance_cents"
          - "Bumps Order.version by 1"
      - from: PACKAGED
        to: DELIVERED
        trigger: "POST /orders/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "Order.fulfillment_status == PACKAGED"
          - "unloading_equipment_provided is in the assigned Plant.unloading_equipment_available"
          - "unloading_equipment_provided == Order.unloading_equipment_required"
        side_effects:
          - "Sets delivered_at to the current logical clock"
          - "Advances the freight_status dimension FINALIZED -> INVOICED in the same request"
          - "Drives the blend CERTIFIED -> RELEASED, which moves every ALLOCATED BlendComponent to CONSUMED, which moves every referenced FiredLot RESERVED -> CONSUMED"
          - "Bumps Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Order.fulfillment_status IN {DRAFT, ASSIGNED, IN_BLENDING, PACKAGED}"
        side_effects:
          - "Records cancellation_reason and advances the freight_status dimension to WAIVED"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Order.fulfillment_status == ASSIGNED"
        side_effects:
          - "Records cancellation_reason and advances the freight_status dimension to WAIVED"
      - from: IN_BLENDING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Order.fulfillment_status == IN_BLENDING"
        side_effects:
          - "CASCADE HOP 1: records cancellation_reason and advances the freight_status dimension to WAIVED"
          - "CASCADE HOP 2 (caused by hop 1): the Order's ShippedBlend moves to VOID"
          - "CASCADE HOP 3 (caused by hop 2): every BlendComponent of that blend moves ALLOCATED -> VOIDED and the blend's allocated_units returns to 0"
          - "CASCADE HOP 4 (caused by hop 3): every FiredLot referenced by those components has its voided units moved out of reserved_units back into available_units, and a lot whose reserved_units reaches 0 moves RESERVED -> AVAILABLE"
          - "CASCADE HOP 4b (caused by hop 1): every SamplePanel of this Order whose status is DRAFT, SUBMITTED or REVISION_REQUESTED moves to WITHDRAWN"
      - from: PACKAGED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Order.fulfillment_status == PACKAGED"
        side_effects:
          - "Runs the identical four-hop cascade described on the IN_BLENDING -> CANCELLED transition"

  - entity: Order
    state_field: freight_status
    initial_state: UNQUOTED
    terminal_states: [INVOICED, WAIVED]
    transitions:
      - from: UNQUOTED
        to: ESTIMATED
        trigger: "POST /orders/{id}/assign-plant"
        actor: SalesRep
        preconditions:
          - "Order.freight_status == UNQUOTED"
          - "the fulfillment_status dimension moves DRAFT -> ASSIGNED in this request"
        side_effects:
          - "Writes estimated_freight_cents from the ESTIMATED variant of order_freight_cost, which bills on requested_units * UNIT_WEIGHT_LB"
      - from: ESTIMATED
        to: FINALIZED
        trigger: "POST /orders/{id}/package"
        actor: LogisticsCoordinator
        preconditions:
          - "Order.freight_status == ESTIMATED"
          - "the fulfillment_status dimension moves IN_BLENDING -> PACKAGED in this request"
        side_effects:
          - "Writes final_freight_cents from the FINAL variant of order_freight_cost, which bills on actual packaged weight including pallet tare and banding"
          - "Writes freight_variance_cents as final_freight_cents minus estimated_freight_cents"
      - from: FINALIZED
        to: INVOICED
        trigger: "POST /orders/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "Order.freight_status == FINALIZED"
          - "the fulfillment_status dimension moves PACKAGED -> DELIVERED in this request"
        side_effects:
          - "Sets invoiced_at to the current logical clock"
      - from: UNQUOTED
        to: WAIVED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Order.freight_status IN {UNQUOTED, ESTIMATED, FINALIZED}"
        side_effects:
          - "Leaves estimated_freight_cents, final_freight_cents and freight_variance_cents untouched at whatever they held, so a WAIVED order still shows what it would have cost"
      - from: ESTIMATED
        to: WAIVED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Order.freight_status == ESTIMATED"
        side_effects: []
      - from: FINALIZED
        to: WAIVED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Order.freight_status == FINALIZED"
        side_effects: []

  - entity: BlendComponent
    initial_state: ALLOCATED
    terminal_states: [CONSUMED, VOIDED]
    transitions:
      - from: ALLOCATED
        to: CONSUMED
        trigger: "POST /orders/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "BlendComponent.status == ALLOCATED"
          - "the owning ShippedBlend moves CERTIFIED -> RELEASED in this request"
        side_effects:
          - "Moves the component's units out of FiredLot.reserved_units into FiredLot.consumed_units, preserving fired_unit_conservation"
      - from: ALLOCATED
        to: VOIDED
        trigger: "POST /blends/{id}/reject, or system event: order-cancel cascade"
        actor: QualityManager | system
        preconditions:
          - "BlendComponent.status == ALLOCATED"
          - "the owning ShippedBlend moves COMPOSED -> DRAFT or moves to VOID in this request"
        side_effects:
          - "Moves the component's units out of FiredLot.reserved_units back into FiredLot.available_units, preserving fired_unit_conservation"
          - "Decreases ShippedBlend.allocated_units by the component's units"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency / Write-Write Conflict Rules
# ---------------------------------------------------------------------------
# Each entry below survived the serial-observability filter: a second strictly
# sequential request would observe state that lets it legitimately succeed under
# the product semantics, so a state precondition cannot express the conflict.
# All three are resolved by optimistic concurrency control on the parent's
# `version` integer, which reduces the conflict to a deterministic stale-version
# check that two strictly sequential requests can trigger.
concurrency_rules:
  - rule_id: blend-component-add-stale-blend
    parent_entity: ShippedBlend
    write_endpoint: "POST /blends/{id}/components"
    occ_field: "expected_blend_version"
    description: |
      Adding a BlendComponent to a ShippedBlend whose version has advanced since
      the client last observed it is rejected. Adding a component is additive and
      always legal against a DRAFT blend, so the blend's status is unchanged by a
      prior add and cannot express the conflict: a writer holding a stale view has
      sized its units against an allocated_units total that no longer holds, and
      accepting it would silently over-allocate the fired inventory. The stale
      version is the only observable that distinguishes the two views.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: kiln-load-stale-kiln-run
    parent_entity: KilnRun
    write_endpoint: "POST /kiln-runs/{id}/load"
    occ_field: "expected_kiln_run_version"
    description: |
      Loading a ProductionRun onto a SCHEDULED KilnRun whose version has advanced
      since the client last observed it is rejected. Loading a car is additive and
      always legal against a SCHEDULED run, so the run's status is unchanged by a
      prior load: a writer holding a stale view chose its kiln_position from an
      occupancy map that no longer holds, and the position it picked may have been
      taken by the write that advanced the version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: formulation-component-stale
    parent_entity: BodyFormulation
    write_endpoint: "POST /formulations/{id}/components"
    occ_field: "expected_formulation_version"
    description: |
      Appending a clay-pit component to a DRAFT BodyFormulation whose version has
      advanced since the client last observed it is rejected. Appending is additive
      and always legal against a DRAFT formulation, so the formulation's status is
      unchanged by a prior append: a writer holding a stale view computed its
      share_pct against a component set whose shares no longer sum to what it saw,
      and accepting it would push the body recipe past 100.00 percent.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: body_blend_chemistry
    trigger: "On POST /formulations/{id}/components (recomputed after every append) and re-verified on POST /formulations/{id}/qualify"
    algorithm: weighted_scoring
    formula: |
      # Inputs: the BodyFormulation's components array, each {pit_id, share_pct},
      # and the referenced ClayPit rows (iron_oxide_pct, lime_pct, material_type).
      total_share_pct = sum(c.share_pct for c in components)          # exact, 2dp addition

      blend_iron_oxide_pct = round_half_up(
          sum(pit(c).iron_oxide_pct * c.share_pct for c in components) / 100, 3)
      blend_lime_pct       = round_half_up(
          sum(pit(c).lime_pct       * c.share_pct for c in components) / 100, 3)
      shale_share_pct      = sum(c.share_pct for c in components
                                 if pit(c).material_type == "SHALE")  # exact, 2dp

      # Absorption falls as iron and shale rise, and rises with free lime.
      raw_absorption = 18.0
                       - 1.2  * blend_iron_oxide_pct
                       - 0.08 * shale_share_pct
                       + 1.5  * blend_lime_pct
      absorption_index = round_half_up(clamp(2.0, 22.0, raw_absorption), 2)

      # Durability grade — evaluated in this pinned order, both bounds INCLUSIVE.
      if   absorption_index <= 8.00:  computed_durability_grade = "SW"   # severe weathering
      elif absorption_index <= 14.00: computed_durability_grade = "MW"   # moderate weathering
      else:                           computed_durability_grade = "NW"   # negligible weathering
    input_set: |
      Only the components of the one BodyFormulation being written. Every
      contributing ClayPit must be OPEN at qualify time: a component whose
      ClayPit.status is DEPLETED or SUSPENDED makes the formulation unqualifiable
      (ERR_CLAY_PIT_SUSPENDED on qualify) rather than being silently dropped from
      the weighted sum, so the weights always sum to total_share_pct.
    constants:
      ABSORPTION_BASE: 18.0
      IRON_ABSORPTION_COEFF: 1.2
      SHALE_ABSORPTION_COEFF: 0.08
      LIME_ABSORPTION_COEFF: 1.5
      ABSORPTION_MIN: 2.0
      ABSORPTION_MAX: 22.0
      SW_MAX_ABSORPTION: 8.00
      MW_MAX_ABSORPTION: 14.00
    precision: |
      blend_iron_oxide_pct and blend_lime_pct: 3 decimal places, round_half_up.
      absorption_index: 2 decimal places, round_half_up.
      shale_share_pct and total_share_pct: exact 2-decimal addition, no rounding.
      The weighted sums are accumulated at full precision and rounded ONCE at the
      end; rounding each pit's contribution before summing is forbidden because it
      lets rounding error accumulate across pits and can flip the grade boundary.

  - name: clay_tonnage_commitment
    trigger: "COMMIT on POST /production-runs; CONSUME on POST /production-runs/{id}/close-green (both the SET and the HELD branch); RELEASE on the plant-idle cascade that scraps a SETTING run"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — the run-level total, computed once from the formulation's recipe rate.
      total_tons = round_half_up(green_units_set / 1000 * formulation.clay_tons_per_thousand_units, 2)

      # Step 2 — split total_tons across the formulation's pits by share_pct, in
      # ascending created_at order of the component rows (the append order).
      ordered = components sorted by component.created_at ASC
      running = 0.00
      for c in ordered:
          per_pit[c] = round_half_up(total_tons * c.share_pct / 100, 2)
          running   += per_pit[c]

      # Step 3 — the rounding residual lands ENTIRELY on the LAST pit in that
      # created_at ASC order. It is never spread, never dropped, and never assigned
      # by id. This is what makes the per-pit split reproducible.
      residual = round_half_up(total_tons - running, 2)
      per_pit[ordered[-1]] += residual

      # Step 4 — apply per_pit to each ClayPit according to the phase.
      # COMMIT:  requires per_pit[c] <= pit.available_tons for EVERY pit (checked
      #          for all pits BEFORE mutating any), then
      #            pit.available_tons -= per_pit[c]; pit.committed_tons += per_pit[c]
      # CONSUME: pit.committed_tons -= per_pit[c]; pit.consumed_tons += per_pit[c]
      # RELEASE: pit.committed_tons -= per_pit[c]; pit.available_tons += per_pit[c]
      #
      # Every phase preserves clay_reserve_conservation:
      #   pit.proven_reserve_tons == available_tons + committed_tons + consumed_tons
      #
      # A pit whose available_tons reaches exactly 0.00 on COMMIT moves OPEN -> DEPLETED.
    input_set: |
      Only the ClayPit rows referenced by the components of the ProductionRun's
      BodyFormulation, and only that one run's green_units_set. Runs already in
      SCRAPPED contribute nothing (their tonnage was released).
    constants:
      TONS_PER_THOUSAND_SOURCE: "BodyFormulation.clay_tons_per_thousand_units"
    precision: |
      2 decimal places, round_half_up, at BOTH levels: the run-level total_tons is
      rounded first, then each per-pit share is rounded from that already-rounded
      total. Recomputing per-pit shares from the unrounded total, or summing
      unrounded shares and rounding once, are both wrong: three pits at
      33.33/33.33/33.34 percent of 32.00 tons must yield 10.67 / 10.67 / 10.66,
      not 10.66 / 10.67 / 10.67 and not 10.67 / 10.67 / 10.67.

  - name: green_yield
    trigger: "PROJECTED variant on POST /production-runs; ACTUAL variant on POST /production-runs/{id}/close-green"
    algorithm: threshold
    formula: |
      # PROJECTED — written at run creation, before any real handling loss is known.
      projected_loss_units = ceil(green_units_set * GREEN_HANDLING_LOSS_BP / 10000)
                             + SETTING_LOSS_UNITS_PER_CAR
      projected_net_units  = green_units_set - projected_loss_units

      # ACTUAL — written when the operator closes out green handling.
      green_loss_units = <supplied>
      net_green_units  = green_units_set - green_loss_units
      green_loss_pct   = round_half_up(green_loss_units * 100 / green_units_set, 2)
      green_loss_variance_units = net_green_units - projected_net_units   # signed

      # Threshold fork, boundary INCLUSIVE on the passing side.
      if green_loss_pct <= GREEN_LOSS_HOLD_PCT:  status = "SET"
      else:                                      status = "HELD"
    input_set: "The single ProductionRun being created or closed; no cross-run aggregation."
    constants:
      GREEN_HANDLING_LOSS_BP: 350
      SETTING_LOSS_UNITS_PER_CAR: 12
      GREEN_LOSS_HOLD_PCT: 6.00
    precision: |
      green_loss_pct: 2 decimal places, round_half_up. All unit counts are integers;
      projected_loss_units uses ceil (never round, never floor) so the projection is
      never optimistic. The HOLD comparison is made on the ROUNDED green_loss_pct,
      so a raw 6.004 percent loss rounds to 6.00 and stays SET.
    variants:
      - name: PROJECTED
        when: "POST /production-runs — the run has just been created and no handling loss has been observed yet"
        difference: |
          Charges a flat GREEN_HANDLING_LOSS_BP of the units set plus one fixed
          SETTING_LOSS_UNITS_PER_CAR allowance, using ceil on the percentage part.
          It never reads green_loss_units (which is still null) and it never sets
          status beyond the initial SETTING.
      - name: ACTUAL
        when: "POST /production-runs/{id}/close-green — the operator reports the real green_loss_units"
        difference: |
          Ignores both constants entirely and subtracts the reported loss directly,
          then forks the run to SET or HELD on the rounded loss percentage and
          records green_loss_variance_units as the signed gap against PROJECTED. For
          10000 units set with 400 units lost, PROJECTED nets 9638 while ACTUAL
          nets 9600 — a variance of -38 on identical run data.

  - name: firing_color_development
    trigger: "On POST /kiln-runs/{id}/grade, once for the run itself and once per loaded ProductionRun to mint that run's FiredLot"
    algorithm: threshold
    formula: |
      # --- Run level: written onto the KilnRun itself -------------------------
      base_cdi = round_half_up(
          CDI_TEMP_COEFF * (actual_peak_temp_c - CDI_TEMP_ORIGIN_C) / 10
          + CDI_SOAK_COEFF * actual_soak_hours, 2)

      firing_curve_deviation = round_half_up(
          abs(actual_peak_temp_c - kiln.setpoint_peak_c) / 10
          + abs(actual_soak_hours - formulation.target_soak_hours), 2)

      # --- Position level: written onto each FiredLot -------------------------
      # A tunnel kiln is hotter at the centerline than at the walls, so a car's
      # kiln_position shifts its realized peak temperature.
      centerline = (kiln.position_count + 1) / 2                # e.g. 3.0 for 5 positions
      position_temp_delta_c = round_half_up(
          -POSITION_TEMP_GRADIENT_C * abs(kiln_position - centerline), 2)
      position_cdi = round_half_up(
          base_cdi + CDI_TEMP_COEFF * position_temp_delta_c / 10, 2)

      # --- Grade: evaluated in EXACTLY this order, first match wins ----------
      target = formulation.target_cdi
      if   position_cdi >  target + OVERFIRE_CDI_MARGIN:   grade = "OVERFIRE_SCRAP"
      elif position_cdi <  target - UNDERFIRE_CDI_MARGIN:  grade = "UNDERFIRE_SCRAP"
      elif abs(position_cdi - target) <= ON_COLOR_CDI_BAND: grade = "ON_COLOR"
      else:                                                 grade = "OFF_COLOR_SALVAGE"

      color_index = round_half_up(
          clamp(0.00, 100.00, COLOR_INDEX_MIDPOINT
                              + COLOR_INDEX_CDI_SLOPE * (position_cdi - target)), 2)
    input_set: |
      Only the ProductionRuns whose status == LOADED and whose kiln_run_id equals the
      KilnRun being graded. A run reverted to SET by the plant-idle cascade is not in
      the set and mints no FiredLot. base_cdi and firing_curve_deviation read the
      KilnRun's own formulation_id, which every loaded run must match.
    constants:
      CDI_TEMP_ORIGIN_C: 900
      CDI_TEMP_COEFF: 0.62
      CDI_SOAK_COEFF: 4.0
      POSITION_TEMP_GRADIENT_C: 6.0
      OVERFIRE_CDI_MARGIN: 6.00
      UNDERFIRE_CDI_MARGIN: 6.00
      ON_COLOR_CDI_BAND: 3.00
      COLOR_INDEX_MIDPOINT: 50.0
      COLOR_INDEX_CDI_SLOPE: 3.2
    precision: |
      2 decimal places, round_half_up, at every step. base_cdi is rounded BEFORE
      position_cdi is derived from it, and position_temp_delta_c is rounded before
      being folded in; recomputing position_cdi from unrounded intermediates can
      shift it by 0.01 and flip a lot sitting on the ON_COLOR band edge. The three
      grade comparisons are strict/inclusive exactly as written: position_cdi
      equal to target + 6.00 is NOT overfire (it falls through to
      OFF_COLOR_SALVAGE), while target + 6.01 is. At the centerline the delta is
      exactly 0.00, so position_cdi == base_cdi.

  - name: blend_color_profile
    trigger: "On POST /blends/{id}/compose, after any auto-fill has appended components; re-verified on POST /blends/{id}/certify"
    algorithm: aggregation
    formula: |
      comps = ALLOCATED BlendComponents of this blend
      allocated_units = sum(c.units for c in comps)                  # integer

      # Units-weighted mean fired color, accumulated at FULL precision.
      weighted_color_index = round_half_up(
          sum(lot(c).color_index * c.units for c in comps) / allocated_units, 2)

      # Spread of the shipped blend across kiln positions and dye lots.
      color_range_span = round_half_up(
          max(lot(c).color_index for c in comps)
          - min(lot(c).color_index for c in comps), 2)
      dye_lot_count = count of DISTINCT lot(c).dye_lot_code over comps

      # Per-component audit field, written on each BlendComponent at allocation.
      contribution_index = round_half_up(lot(c).color_index * c.units, 2)

      # Panel agreement, only when the Order requires panel approval.
      panel_delta_e = round_half_up(abs(weighted_color_index - panel.approved_color_index), 2)
    input_set: |
      Only BlendComponents of this one ShippedBlend whose status == ALLOCATED.
      VOIDED components are excluded, so a reject-then-recompose cycle recomputes
      the profile from scratch rather than accumulating the voided rounds.
      CONSUMED components are included only for a blend already RELEASED, whose
      profile is frozen.
    constants:
      BLEND_SPAN_CEILING: 12.00
    precision: |
      weighted_color_index: 2 decimal places, round_half_up, computed as
      round(SUM(color_index * units) / allocated_units, 2). Rounding each
      component's product before summing, or averaging the per-component rounded
      contributions, is FORBIDDEN — both drift and both can push panel_delta_e
      across a tolerance_delta_e boundary. color_range_span and panel_delta_e:
      2 decimal places, round_half_up. contribution_index: 2 decimal places,
      round_half_up; it is a per-component audit field only and never feeds a
      decision, and in particular it is NEVER summed to derive
      weighted_color_index.

  - name: blend_autofill_waterfall
    trigger: "On POST /blends/{id}/compose when auto_fill is true and allocated_units < requested_units"
    algorithm: waterfall_allocation
    formula: |
      remaining = requested_units - allocated_units
      midpoint  = blend.target_color_index_midpoint     # (min + max) / 2, 2dp

      # Ordered buckets: closest-to-midpoint first, then biggest lot, then oldest.
      eligible = [ lot for lot in FiredLots if
                     lot.status IN {AVAILABLE, RESERVED}
                     and lot.available_units > 0
                     and lot.grade == "ON_COLOR"
                     and lot.color_family == order.color_family
                     and lot.texture      == order.texture
                     and DURABILITY_RANK[lot.durability_grade]
                           >= DURABILITY_RANK[order.durability_grade]
                     and lot.production_run.plant_id == order.plant_id
                     and blend.target_color_index_min
                           <= lot.color_index <= blend.target_color_index_max ]

      ordered = eligible sorted by ( round_half_up(abs(lot.color_index - midpoint), 2) ASC,
                                     lot.available_units DESC,
                                     lot.created_at ASC )

      for lot in ordered:
          if remaining == 0: break
          take = min(remaining, lot.available_units)
          append BlendComponent(fired_lot_id=lot.id, units=take, source="AUTO_FILL")
          remaining -= take

      if remaining > 0:
          reject with ERR_INSUFFICIENT_BLEND_INVENTORY   # nothing is persisted

      # A lot the client already drew from MANUALLY is still eligible for the rest
      # of its available_units; the waterfall sees the post-manual available_units.
    input_set: |
      FiredLots across the whole plant, filtered exactly as above. QUARANTINED and
      SCRAP lots, lots of other plants, off-family or off-texture lots, lots whose
      durability grade ranks below the order's, and lots whose color_index falls
      outside the blend's requested window are all excluded. A lot already partly
      RESERVED remains eligible for its residual available_units.
    constants:
      DURABILITY_RANK: { SW: 3, MW: 2, NW: 1 }
    precision: |
      The ranking key abs(color_index - midpoint) is rounded to 2 decimal places
      before comparison, so two lots equidistant at 2dp fall through to the
      available_units DESC tie-break and then to created_at ASC. `id` is NEVER a
      tie-break input. Allocation amounts are integers; the waterfall fills each
      bucket completely before moving to the next and takes only the remainder from
      the final bucket, so it is order-sensitive by construction.

  - name: plant_assignment_selector
    trigger: "On POST /orders/{id}/assign-plant"
    algorithm: waterfall_allocation
    formula: |
      # Rectilinear (city-block) haul distance on the freight grid.
      distance(plant) = abs(plant.grid_x - order.jobsite_grid_x)
                      + abs(plant.grid_y - order.jobsite_grid_y)

      eligible = [ p for p in Plants if
                     p.status == "ACTIVE"
                     and distance(p) <= p.market_radius_miles          # INCLUSIVE
                     and order.unloading_equipment_required
                           in p.unloading_equipment_available
                     and exists f in BodyFormulations where
                           f.plant_id == p.id
                           and f.status == "QUALIFIED"
                           and f.target_color_family == order.color_family
                           and DURABILITY_RANK[f.computed_durability_grade]
                                 >= DURABILITY_RANK[order.durability_grade] ]

      # Cheapest haul wins; the quote used for ranking is the ESTIMATED variant of
      # order_freight_cost evaluated against each candidate plant's own rate.
      ranked = eligible sorted by ( estimated_total_freight_cents(p) ASC,
                                    distance(p) ASC,
                                    p.created_at ASC )

      if ranked is empty: reject with ERR_NO_PLANT_IN_MARKET_RADIUS
      winner = ranked[0]
      order.plant_id = winner.id ; order.distance_miles = distance(winner)
    input_set: |
      All Plants, filtered exactly as above. IDLED plants are excluded even when
      they are nearest. A plant with only DRAFT or RETIRED formulations in the
      requested color family is excluded. A plant whose qualified formulation grades
      MW cannot serve an SW order, but an SW formulation CAN serve an MW order.
    constants:
      DURABILITY_RANK: { SW: 3, MW: 2, NW: 1 }
    precision: |
      distance_miles is an exact integer — no rounding, no Euclidean square root.
      The primary ranking key is the whole-cent estimated total freight, so two
      plants quoting the identical total fall through to distance ASC and then to
      created_at ASC. `id` is NEVER a ranking or tie-break input.

  - name: order_freight_cost
    trigger: "ESTIMATED variant on POST /orders/{id}/assign-plant (and once per candidate plant inside plant_assignment_selector); FINAL variant on POST /orders/{id}/package"
    algorithm: tiered_pricing
    formula: |
      distance_miles = abs(plant.grid_x - order.jobsite_grid_x)
                     + abs(plant.grid_y - order.jobsite_grid_y)

      # --- billable weight, per variant ---
      # ESTIMATED: bricks only, off the requested unit count.
      estimated_billable_tons = round_half_up(
          order.requested_units * UNIT_WEIGHT_LB / LB_PER_TON, 2)
      # FINAL: real packaged weight — pallets, banding and the units actually blended.
      final_packaged_lb = order.pallet_count * PALLET_TARE_LB
                        + order.band_count * BAND_WEIGHT_LB[order.banding_type]
                        + blend.allocated_units * UNIT_WEIGHT_LB
      final_billable_tons = round_half_up(final_packaged_lb / LB_PER_TON, 2)

      # --- linehaul, then the fuel surcharge tier ---
      base_freight_cents = round_half_up(
          distance_miles * plant.freight_rate_cents_per_ton_mile * billable_tons)

      # The tier is keyed on base_freight_cents, NOT on the total, and the three
      # arms are evaluated in EXACTLY this order with these boundary semantics.
      if   base_freight_cents <  SURCHARGE_TIER_1_CEILING_CENTS:  pct = SURCHARGE_TIER_1_PCT
      elif base_freight_cents <  SURCHARGE_TIER_2_CEILING_CENTS:  pct = SURCHARGE_TIER_2_PCT
      else:                                                       pct = SURCHARGE_TIER_3_PCT

      fuel_surcharge_cents = round_half_up(base_freight_cents * pct / 100)
      total_freight_cents  = base_freight_cents + fuel_surcharge_cents
    input_set: |
      One Order and one Plant. The ESTIMATED variant never reads the blend (which may
      not exist yet); the FINAL variant never reads requested_units. Inside
      plant_assignment_selector the ESTIMATED variant is evaluated once per candidate
      plant against that plant's own freight_rate_cents_per_ton_mile and grid position.
    constants:
      UNIT_WEIGHT_LB: 4.5
      LB_PER_TON: 2000
      PALLET_TARE_LB: 60
      PALLET_UNITS: 500
      BAND_WEIGHT_LB: { STEEL: 3.0, POLY: 1.2 }
      SURCHARGE_TIER_1_CEILING_CENTS: 50000
      SURCHARGE_TIER_2_CEILING_CENTS: 150000
      SURCHARGE_TIER_1_PCT: 6.5
      SURCHARGE_TIER_2_PCT: 4.5
      SURCHARGE_TIER_3_PCT: 3.0
    precision: |
      Billable tons: 2 decimal places, round_half_up, rounded BEFORE the linehaul is
      computed. All cent amounts are whole integers produced by round_half_up (never
      truncation). The surcharge tier is a WHOLE-BILL rate applied to the entire
      base, not a marginal rate applied per bracket, and it is selected from the
      rounded base_freight_cents. That combination makes the schedule non-monotonic
      at the tier edges: at 50 miles and 40 cents/ton-mile, 11106 units bills 24.99
      tons for a 49980-cent base and a 6.5 percent surcharge, totalling 53229 cents,
      while 11111 units bills exactly 25.00 tons for a 50000-cent base that just
      reaches tier 2 at 4.5 percent, totalling only 52250 cents. Shipping five more
      bricks lowers the freight bill; keying the tier on the total instead of the
      base, or applying marginal bracket rates, changes both numbers.
    variants:
      - name: ESTIMATED
        when: "POST /orders/{id}/assign-plant, and once per candidate plant during plant assignment — nothing has been blended or packaged yet"
        difference: |
          Bills brick weight only, off order.requested_units, and writes
          estimated_billable_tons / estimated_base_freight_cents /
          estimated_fuel_surcharge_cents / estimated_freight_cents. It cannot see
          pallet tare or banding because pallet_count and band_count are still null,
          so it systematically under-quotes a real shipment.
      - name: FINAL
        when: "POST /orders/{id}/package — pallet_count, band_count, banding_type and the certified blend's allocated_units are all known"
        difference: |
          Bills the actual packaged weight, adding PALLET_TARE_LB per pallet and
          BAND_WEIGHT_LB per band on top of the blended units, and writes the four
          final_* fields plus freight_variance_cents = final_freight_cents -
          estimated_freight_cents. For a 12000-unit order hauled 60 miles at 42
          cents/ton-mile, ESTIMATED bills 27.00 tons for 71102 cents while FINAL
          bills 27.79 tons (24 pallets, 48 steel bands) for 73182 cents — a
          variance of 2080 cents on identical order data. The re-quote can also
          cross a surcharge tier that the estimate did not.

  - name: order_lead_time
    trigger: "On POST /orders/{id}/assign-plant, using the winning Plant's capacity"
    algorithm: threshold
    formula: |
      lead_time_days = BASE_LEAD_DAYS
                     + (SPECIAL_ORDER_LEAD_DAYS   if order.is_special_order        else 0)
                     + (PANEL_APPROVAL_LEAD_DAYS  if order.requires_panel_approval else 0)
                     + ceil(order.requested_units / plant.base_capacity_green_units_per_day)

      promised_ship_date = current_logical_clock + lead_time_days whole days
    input_set: |
      The one Order and the winning Plant only; no queue of other orders is
      considered, so the run-out term depends solely on this order's requested_units
      against the plant's nominal daily green throughput.
    constants:
      BASE_LEAD_DAYS: 14
      SPECIAL_ORDER_LEAD_DAYS: 28
      PANEL_APPROVAL_LEAD_DAYS: 7
    precision: |
      lead_time_days is a whole number of days; the run-out term uses ceil, never
      round and never floor, so requested_units exactly equal to one day of capacity
      contributes 1 day and one unit more contributes 2. Day arithmetic is on whole
      UTC days against the logical clock, whose startup default is
      2026-08-01T00:00:00Z: a 12000-unit standard order at a 40000-unit/day plant
      promises 2026-08-16T00:00:00Z (15 days), while the same order flagged
      is_special_order and requires_panel_approval promises 2026-09-20T00:00:00Z
      (50 days).

  - name: panel_dye_lot_equivalence
    trigger: "On POST /blends/{id}/certify, for every ALLOCATED BlendComponent, when the Order requires panel approval"
    algorithm: constraint_propagation
    formula: |
      # Walk the supersession chain UP from the panel's own formulation to build the
      # equivalence class of formulations whose dye lots are interchangeable.
      def closure(formulation_id):
          seen = {}
          cursor = formulation_id
          hops = 0
          while cursor is not null
                and cursor not in seen
                and hops <= DYE_LOT_CLOSURE_MAX_HOPS:
              seen.add(cursor)
              cursor = BodyFormulation(cursor).supersedes_formulation_id
              hops += 1
          return seen        # fixed point; the `cursor not in seen` guard makes a
                             # cyclic supersedes chain terminate instead of looping

      equivalent = closure(panel.formulation_id)

      # 1. Every allocated lot must have been fired from a formulation in the class.
      for c in allocated_components:
          if lot(c).source_formulation_id not in equivalent:
              reject with ERR_DYE_LOT_MISMATCH

      # 2. The blend as shipped must sit inside the approved panel's tolerance.
      if panel_delta_e > panel.tolerance_delta_e:
          reject with ERR_PANEL_TOLERANCE_EXCEEDED

      # 3. The spread across dye lots is capped independently of the panel.
      if blend.color_range_span > BLEND_SPAN_CEILING:
          reject with ERR_COLOR_RANGE_SPAN_EXCEEDED
    input_set: |
      The APPROVED, unexpired SamplePanel of the Order; the BodyFormulation
      supersession chain reachable from that panel's formulation_id; and every
      ALLOCATED BlendComponent of the blend with its FiredLot's
      source_formulation_id. A RETIRED formulation stays in the closure — retiring a
      body does not invalidate dye lots already fired from it. When the Order does
      not require panel approval, none of the three checks run.
    constants:
      DYE_LOT_CLOSURE_MAX_HOPS: 16
      BLEND_SPAN_CEILING: 12.00
    precision: |
      The closure walk is exact set membership on formulation ids, with no partial
      matching on formulation_code. The three checks run in the pinned order above,
      so a blend that both draws an out-of-class lot and busts the tolerance reports
      ERR_DYE_LOT_MISMATCH. panel_delta_e and color_range_span are compared at their
      stored 2-decimal precision and BOTH ceilings are inclusive: a panel_delta_e
      exactly equal to tolerance_delta_e passes, and a color_range_span of exactly
      12.00 passes.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (Ordered by Priority)
# ---------------------------------------------------------------------------
# Lower priority number wins. When one request violates several rules, the
# response carries the error_id of the LOWEST-numbered violated rule and no
# state is mutated.
validations:
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role names one of the eight roles declared in section 1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path-templated id resolves to a live row, validated LEFT TO RIGHT so the outermost segment's 404 wins over an inner one"
    error_id: "ERR_PLANT_NOT_FOUND | ERR_CLAY_PIT_NOT_FOUND | ERR_FORMULATION_NOT_FOUND | ERR_KILN_NOT_FOUND | ERR_KILN_CAR_NOT_FOUND | ERR_PRODUCTION_RUN_NOT_FOUND | ERR_KILN_RUN_NOT_FOUND | ERR_FIRED_LOT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_BLEND_NOT_FOUND | ERR_SAMPLE_PANEL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path-templated id"

  - priority: 5
    category: auth
    check: "When the acting role is PlantOperator, X-User-ID equals the Plant.id that owns the target resource (directly for plant sub-resources, or transitively through ProductionRun.plant_id and Kiln.plant_id); when the owning Plant cannot be derived because a body foreign key such as kiln_id or production_run_id does not resolve, this check is skipped and the priority 8 body foreign-key 404 is returned instead"
    error_id: ERR_PLANT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /plants/{id}/kiln-cars, POST /production-runs, POST /production-runs/{id}/close-green, POST /kiln-runs, POST /kiln-runs/{id}/load, POST /kiln-runs/{id}/start, POST /kiln-runs/{id}/grade"

  - priority: 6
    category: auth
    check: "The acting X-User-ID is not the same operator that performed the preceding step of the same control: certification requires X-User-ID != ShippedBlend.composed_by_user_id, and panel approval requires X-User-ID != SamplePanel.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /blends/{id}/certify, POST /sample-panels/{id}/approve"

  - priority: 7
    category: business_constraint
    check: "Request payload is well formed: all required fields present, types correct, enum values in range, numeric bounds and decimal scales honored, arrays non-empty where required, and end_at strictly after start_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 8
    category: existence
    check: "Every foreign-key id supplied in the request BODY resolves to a live row"
    error_id: "ERR_CLAY_PIT_NOT_FOUND | ERR_FORMULATION_NOT_FOUND | ERR_KILN_CAR_NOT_FOUND | ERR_PRODUCTION_RUN_NOT_FOUND | ERR_FIRED_LOT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /formulations, POST /formulations/{id}/components, POST /production-runs, POST /kiln-runs, POST /kiln-runs/{id}/load, POST /blends/{id}/components, POST /orders/{id}/sample-panels"

  - priority: 9
    category: state
    check: "When the endpoint declares an expected_<parent>_version field, it equals the parent's current version (see section 1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /formulations/{id}/components, POST /kiln-runs/{id}/load, POST /blends/{id}/components"

  - priority: 10
    category: state
    check: "The Plant that owns the target resource has status == ACTIVE; on POST /plants/{id}/idle the Plant itself is the target resource, so a second idle on an already IDLED plant is rejected here (IDLED is terminal)"
    error_id: ERR_PLANT_IDLED
    http_status: 409
    applies_to: "POST /plants/{id}/idle, POST /plants/{id}/clay-pits, POST /plants/{id}/kilns, POST /plants/{id}/kiln-cars, POST /formulations, POST /formulations/{id}/components, POST /formulations/{id}/qualify, POST /production-runs, POST /production-runs/{id}/close-green, POST /kiln-runs, POST /kiln-runs/{id}/load, POST /kiln-runs/{id}/start, POST /kiln-runs/{id}/grade"

  - priority: 11
    category: state
    check: "Every ClayPit referenced by the formulation's components has status == OPEN; a DEPLETED pit (its whole proven reserve is already committed or consumed) and a SUSPENDED pit both block qualification"
    error_id: ERR_CLAY_PIT_SUSPENDED
    http_status: 409
    applies_to: "POST /formulations/{id}/qualify"

  - priority: 12
    category: state
    check: "The target BodyFormulation.status == DRAFT"
    error_id: ERR_FORMULATION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /formulations/{id}/components, POST /formulations/{id}/qualify"

  - priority: 13
    category: state
    check: "The target ProductionRun is in the status the operation requires: SETTING for close-green, SET for load"
    error_id: ERR_PRODUCTION_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /production-runs/{id}/close-green, POST /kiln-runs/{id}/load"

  - priority: 14
    category: state
    check: "The KilnCar named by a new ProductionRun has status == IDLE and no current_production_run_id"
    error_id: ERR_KILN_CAR_NOT_IDLE
    http_status: 409
    applies_to: "POST /production-runs"

  - priority: 15
    category: state
    check: "The target KilnRun is in the status the operation requires: SCHEDULED for load and start, FIRING for grade"
    error_id: ERR_KILN_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /kiln-runs/{id}/load, POST /kiln-runs/{id}/start, POST /kiln-runs/{id}/grade"

  - priority: 16
    category: state
    check: "The FiredLot named by a manual blend component has status IN {AVAILABLE, RESERVED}, grade == ON_COLOR and available_units >= the requested units"
    error_id: ERR_FIRED_LOT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /blends/{id}/components"

  - priority: 17
    category: state
    check: "No FiredLot involved in the operation has status == QUARANTINED — neither the lot being allocated nor any lot behind an ALLOCATED component of the blend being certified, nor the dye-lot reference of a panel being approved"
    error_id: ERR_LOT_QUARANTINED
    http_status: 409
    applies_to: "POST /blends/{id}/components, POST /blends/{id}/compose, POST /blends/{id}/certify, POST /sample-panels/{id}/approve"

  - priority: 18
    category: state
    check: "The target ShippedBlend.status == DRAFT"
    error_id: ERR_BLEND_NOT_DRAFT
    http_status: 409
    applies_to: "POST /blends/{id}/components, POST /blends/{id}/compose"

  - priority: 19
    category: state
    check: "The target ShippedBlend.status == COMPOSED"
    error_id: ERR_BLEND_NOT_COMPOSED
    http_status: 409
    applies_to: "POST /blends/{id}/certify, POST /blends/{id}/reject"

  - priority: 20
    category: state
    check: "The target Order's fulfillment_status admits the operation: DRAFT for assign-plant, ASSIGNED for blends, ASSIGNED or IN_BLENDING for sample-panels, IN_BLENDING for package, PACKAGED for deliver, and any of DRAFT/ASSIGNED/IN_BLENDING/PACKAGED for cancel"
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /orders/{id}/assign-plant, POST /orders/{id}/blends, POST /orders/{id}/sample-panels, POST /orders/{id}/package, POST /orders/{id}/deliver, POST /orders/{id}/cancel"

  - priority: 21
    category: state
    check: "The target SamplePanel is in the status the operation requires: DRAFT or REVISION_REQUESTED for submit, SUBMITTED for request-revision and approve"
    error_id: ERR_PANEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /sample-panels/{id}/submit, POST /sample-panels/{id}/request-revision, POST /sample-panels/{id}/approve"

  - priority: 22
    category: business_safety
    check: "When Order.requires_panel_approval is true, the Order has a SamplePanel whose status == APPROVED"
    error_id: ERR_PANEL_NOT_APPROVED
    http_status: 422
    applies_to: "POST /blends/{id}/certify"

  - priority: 23
    category: business_safety
    check: "The APPROVED SamplePanel has not expired: the current logical clock is strictly before expires_at"
    error_id: ERR_PANEL_APPROVAL_EXPIRED
    http_status: 422
    applies_to: "POST /blends/{id}/certify"

  - priority: 24
    category: business_safety
    check: "Every ALLOCATED component's FiredLot.source_formulation_id lies in the supersession closure of the approved panel's formulation, per panel_dye_lot_equivalence"
    error_id: ERR_DYE_LOT_MISMATCH
    http_status: 422
    applies_to: "POST /blends/{id}/certify"

  - priority: 25
    category: business_safety
    check: "panel_delta_e <= SamplePanel.tolerance_delta_e (boundary inclusive)"
    error_id: ERR_PANEL_TOLERANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /blends/{id}/certify"

  - priority: 26
    category: business_safety
    check: "color_range_span <= BLEND_SPAN_CEILING (12.00, boundary inclusive)"
    error_id: ERR_COLOR_RANGE_SPAN_EXCEEDED
    http_status: 422
    applies_to: "POST /blends/{id}/compose, POST /blends/{id}/certify"

  - priority: 27
    category: business_safety
    check: "DURABILITY_RANK of the FiredLot's durability_grade is at least DURABILITY_RANK of the Order's durability_grade (SW 3 > MW 2 > NW 1)"
    error_id: ERR_DURABILITY_GRADE_NOT_MET
    http_status: 422
    applies_to: "POST /blends/{id}/components"

  - priority: 28
    category: business_referential
    check: "The BodyFormulation named by the operation has status == QUALIFIED"
    error_id: ERR_FORMULATION_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /production-runs, POST /kiln-runs, POST /orders/{id}/sample-panels, POST /sample-panels/{id}/submit, POST /sample-panels/{id}/approve"

  - priority: 29
    category: business_referential
    check: "The Order's ShippedBlend has status == CERTIFIED"
    error_id: ERR_BLEND_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /orders/{id}/package"

  - priority: 30
    category: business_referential
    check: "The unloading_equipment_provided reported at delivery is a member of the assigned Plant.unloading_equipment_available - the plant cannot certify unloading with gear it does not operate"
    error_id: ERR_UNLOADING_EQUIPMENT_UNAVAILABLE
    http_status: 422
    applies_to: "POST /orders/{id}/deliver"

  - priority: 31
    category: business_referential
    check: "The unloading_equipment_provided reported at delivery equals Order.unloading_equipment_required"
    error_id: ERR_UNLOADING_EQUIPMENT_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/deliver"

  - priority: 32
    category: business_referential
    check: "The ClayPit appended as a body component has plant_id equal to the BodyFormulation.plant_id"
    error_id: ERR_PIT_PLANT_MISMATCH
    http_status: 422
    applies_to: "POST /formulations/{id}/components"

  - priority: 33
    category: business_referential
    check: "The FiredLot allocated to a blend matches the Order on color_family and texture and was fired at the Order's assigned plant"
    error_id: ERR_LOT_ATTRIBUTE_MISMATCH
    http_status: 422
    applies_to: "POST /blends/{id}/components"

  - priority: 34
    category: business_constraint
    check: "Codes are unique in their declared scope: plant_code, formulation_code, run_code (ProductionRun and KilnRun each within their plant), order_code, blend_code and panel_code globally; pit_name, kiln_code and car_code within their Plant"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /plants, POST /plants/{id}/clay-pits, POST /plants/{id}/kilns, POST /plants/{id}/kiln-cars, POST /formulations, POST /production-runs, POST /kiln-runs, POST /orders, POST /orders/{id}/blends, POST /orders/{id}/sample-panels"

  - priority: 35
    category: business_constraint
    check: "On append, the running component_share_total_pct must not exceed 100.00; on qualify it must equal exactly 100.00, and the same ClayPit must not appear twice"
    error_id: ERR_COMPONENT_SHARE_TOTAL_INVALID
    http_status: 422
    applies_to: "POST /formulations/{id}/components, POST /formulations/{id}/qualify"

  - priority: 36
    category: business_constraint
    check: "kiln_position is an integer in 1..Kiln.position_count for the KilnRun's kiln"
    error_id: ERR_INVALID_KILN_POSITION
    http_status: 422
    applies_to: "POST /kiln-runs/{id}/load"

  - priority: 37
    category: business_constraint
    check: "No other ProductionRun already holds this kiln_position on this KilnRun"
    error_id: ERR_KILN_POSITION_OCCUPIED
    http_status: 409
    applies_to: "POST /kiln-runs/{id}/load"

  - priority: 38
    category: business_temporal
    check: "kiln_firing_window_overlap: the new run's CLOSED interval [start_at, end_at + kiln.cooldown_buffer_hours] must not intersect the same buffer-inflated interval of any existing non-ABORTED KilnRun on that Kiln. Touching endpoints COLLIDE"
    error_id: ERR_KILN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /kiln-runs"

  - priority: 39
    category: business_temporal
    check: "kiln_car_occupancy_overlap: the target KilnRun's HALF-OPEN interval [start_at, end_at) with ZERO buffer must not intersect the interval of any other non-ABORTED KilnRun this KilnCar is already loaded into. Exact adjacency (one run's end_at equal to the next run's start_at) is ALLOWED"
    error_id: ERR_KILN_CAR_OCCUPIED
    http_status: 409
    applies_to: "POST /kiln-runs/{id}/load"

  - priority: 40
    category: business_constraint
    check: "green_units_set <= KilnCar.capacity_green_units"
    error_id: ERR_KILN_CAR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /production-runs"

  - priority: 41
    category: business_constraint
    check: "allocated_units after the append must not exceed ShippedBlend.requested_units"
    error_id: ERR_BLEND_OVER_ALLOCATION
    http_status: 422
    applies_to: "POST /blends/{id}/components"

  - priority: 42
    category: business_constraint
    check: "SamplePanel.revision_round < PANEL_MAX_REVISION_ROUNDS (3) before the increment"
    error_id: ERR_PANEL_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /sample-panels/{id}/request-revision"

  - priority: 43
    category: business_fiscal
    check: "plant_assignment_selector's eligible pool is non-empty"
    error_id: ERR_NO_PLANT_IN_MARKET_RADIUS
    http_status: 422
    applies_to: "POST /orders/{id}/assign-plant"

  - priority: 44
    category: business_fiscal
    check: "In the COMMIT phase of clay_tonnage_commitment, every contributing ClayPit's available_tons is at least its per-pit share; the check runs for ALL pits before any pit is mutated"
    error_id: ERR_CLAY_RESERVE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /production-runs"

  - priority: 45
    category: business_fiscal
    check: "After optional auto-fill, allocated_units == requested_units exactly; a shortfall in blend_autofill_waterfall or a manual under-allocation is rejected"
    error_id: ERR_INSUFFICIENT_BLEND_INVENTORY
    http_status: 422
    applies_to: "POST /blends/{id}/compose"

  - priority: 46
    category: business_fiscal
    check: "pallet_count * PALLET_UNITS (500) >= the certified blend's allocated_units"
    error_id: ERR_PALLET_COUNT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /orders/{id}/package"

  - priority: 47
    category: business_fiscal
    check: "band_count >= pallet_count"
    error_id: ERR_BAND_COUNT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /orders/{id}/package"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# api_prefix is "/", so every path below is the full path. All GET endpoints are
# readable by all eight roles; write endpoints are role-restricted per section 1.7.
endpoints:
  # ---- Plant reads -------------------------------------------------------
  - method: GET
    path: "/plants/{id}"
    description: "Read one plant with its capacity, freight rate, market radius and idle state"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: []
    output: Plant
    side_effects: []

  - method: GET
    path: "/plants"
    description: "List plants, optionally filtered by status"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Plant[]
    side_effects: []

  - method: GET
    path: "/plants/{id}/clay-pits"
    description: "List the clay and shale pits of one plant; reverse-reachability channel for ClayPit.plant_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["status?", "material_type?", "limit?", "offset?"]
    output: ClayPit[]
    side_effects: []

  - method: GET
    path: "/plants/{id}/kilns"
    description: "List the tunnel kilns of one plant; reverse-reachability channel for Kiln.plant_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Kiln[]
    side_effects: []

  - method: GET
    path: "/plants/{id}/kiln-cars"
    description: "List the kiln cars of one plant; reverse-reachability channel for KilnCar.plant_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: KilnCar[]
    side_effects: []

  # ---- BodyFormulation reads --------------------------------------------
  - method: GET
    path: "/formulations/{id}"
    description: "Read one body formulation with its components array and derived chemistry"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: []
    output: BodyFormulation
    side_effects: []

  - method: GET
    path: "/formulations"
    description: "List body formulations; reverse-reachability channel for BodyFormulation.plant_id and BodyFormulation.supersedes_formulation_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["plant_id?", "supersedes_formulation_id?", "status?", "target_color_family?", "limit?", "offset?"]
    output: BodyFormulation[]
    side_effects: []

  # ---- ProductionRun reads ---------------------------------------------
  - method: GET
    path: "/production-runs/{id}"
    description: "Read one extrusion and setting run with its green-yield figures and clay commitment"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/production-runs"
    description: "List production runs; reverse-reachability channel for plant_id, formulation_id, kiln_car_id and kiln_run_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["plant_id?", "formulation_id?", "kiln_car_id?", "kiln_run_id?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  # ---- KilnRun reads ----------------------------------------------------
  - method: GET
    path: "/kiln-runs/{id}"
    description: "Read one tunnel-kiln firing with its window, planned and actual curve and base_cdi"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: []
    output: KilnRun
    side_effects: []

  - method: GET
    path: "/kiln-runs"
    description: "List kiln runs; reverse-reachability channel for KilnRun.kiln_id and KilnRun.formulation_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["kiln_id?", "formulation_id?", "status?", "limit?", "offset?"]
    output: KilnRun[]
    side_effects: []

  # ---- FiredLot reads ---------------------------------------------------
  - method: GET
    path: "/fired-lots/{id}"
    description: "Read one fired lot with its grade, position_cdi, color_index, dye_lot_code and unit ledger"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: []
    output: FiredLot
    side_effects: []

  - method: GET
    path: "/fired-lots"
    description: "List fired inventory by color, texture, grade and durability; reverse-reachability channel for FiredLot.production_run_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["production_run_id?", "color_family?", "texture?", "grade?", "durability_grade?", "status?", "limit?", "offset?"]
    output: FiredLot[]
    side_effects: []

  - method: GET
    path: "/fired-lots/{id}/blend-components"
    description: "List every blend allocation drawn against one fired lot; reverse-reachability channel for BlendComponent.fired_lot_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BlendComponent[]
    side_effects: []

  # ---- ShippedBlend reads -----------------------------------------------
  - method: GET
    path: "/blends/{id}"
    description: "Read one shipped blend with weighted_color_index, color_range_span, dye_lot_count and panel_delta_e"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: []
    output: ShippedBlend
    side_effects: []

  - method: GET
    path: "/blends"
    description: "List shipped blends; reverse-reachability channel for ShippedBlend.order_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: ShippedBlend[]
    side_effects: []

  - method: GET
    path: "/blends/{id}/components"
    description: "List the components of one blend in append order; reverse-reachability channel for BlendComponent.blend_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["status?", "source?", "limit?", "offset?"]
    output: BlendComponent[]
    side_effects: []

  # ---- SamplePanel reads ------------------------------------------------
  - method: GET
    path: "/sample-panels/{id}"
    description: "Read one architectural sample panel with its pinned dye lot and approval window"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: []
    output: SamplePanel
    side_effects: []

  - method: GET
    path: "/sample-panels"
    description: "List sample panels; reverse-reachability channel for SamplePanel.order_id, SamplePanel.formulation_id and SamplePanel.dye_lot_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["order_id?", "formulation_id?", "dye_lot_id?", "status?", "limit?", "offset?"]
    output: SamplePanel[]
    side_effects: []

  # ---- Order reads ------------------------------------------------------
  - method: GET
    path: "/orders/{id}"
    description: "Read one order with both state dimensions, freight figures and promised_ship_date"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders; reverse-reachability channel for Order.plant_id"
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: ["plant_id?", "fulfillment_status?", "freight_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  # ---- Plant writes -----------------------------------------------------
  - method: POST
    path: "/plants"
    description: "Register a brick plant with its freight grid position, market radius, rate, daily green capacity and available unloading equipment"
    roles: [PlantAdmin]
    code: 201
    input: [plant_code, name, grid_x, grid_y, market_radius_miles, freight_rate_cents_per_ton_mile, base_capacity_green_units_per_day, unloading_equipment_available]
    output: Plant
    side_effects: ["Creates the Plant in ACTIVE with fired_scrap_units 0 and version 1"]

  - method: POST
    path: "/plants/{id}/idle"
    description: "Idle a plant, running the four-hop cascade over its pits, formulations, kilns, kiln runs, kiln cars and setting production runs"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Plant
    side_effects:
      - "Moves the Plant ACTIVE -> IDLED and stamps idled_at"
      - "CASCADE HOP 1: every OPEN or DEPLETED ClayPit of the plant moves to SUSPENDED"
      - "CASCADE HOP 2: every QUALIFIED BodyFormulation whose components reference a now-SUSPENDED pit moves QUALIFIED -> DRAFT and increments dequalified_count"
      - "CASCADE HOP 3: every SETTING ProductionRun on a now-DRAFT formulation moves to SCRAPPED"
      - "CASCADE HOP 4: clay_tonnage_commitment runs in RELEASE mode for each scrapped run, moving each contributing pit's committed_tons back to available_tons"
      - "CASCADE HOP 3b: every SCHEDULED or FIRING KilnRun on a kiln of this plant moves to ABORTED"
      - "CASCADE HOP 4b: every LOADED ProductionRun on an aborted run reverts to SET and its KilnCar moves to OUT_OF_SERVICE"
      - "Increments Plant.version by 1"

  - method: POST
    path: "/plants/{id}/clay-pits"
    description: "Open a clay or shale pit at a plant with its proven reserve and chemistry"
    roles: [PlantAdmin]
    code: 201
    input: [pit_name, material_type, proven_reserve_tons, iron_oxide_pct, lime_pct]
    output: ClayPit
    side_effects: ["Creates the ClayPit in OPEN with available_tons equal to proven_reserve_tons and both ledger columns at 0.00"]

  - method: POST
    path: "/plants/{id}/kilns"
    description: "Commission a tunnel kiln with its car position count, peak setpoint and cooldown buffer"
    roles: [PlantAdmin]
    code: 201
    input: [kiln_code, position_count, setpoint_peak_c, cooldown_buffer_hours]
    output: Kiln
    side_effects: ["Creates the Kiln in AVAILABLE"]

  - method: POST
    path: "/plants/{id}/kiln-cars"
    description: "Register a kiln car with its green-unit capacity"
    roles: [PlantAdmin, PlantOperator]
    code: 201
    input: [car_code, capacity_green_units]
    output: KilnCar
    side_effects: ["Creates the KilnCar in IDLE with a null current_production_run_id"]

  # ---- BodyFormulation writes -------------------------------------------
  - method: POST
    path: "/formulations"
    description: "Open a DRAFT body formulation for a plant, optionally superseding an existing formulation to extend its dye-lot equivalence class"
    roles: [BodyEngineer]
    code: 201
    input: [plant_id, formulation_code, target_color_family, target_cdi, target_soak_hours, clay_tons_per_thousand_units, "supersedes_formulation_id?"]
    output: BodyFormulation
    side_effects:
      - "Creates the BodyFormulation in DRAFT with an empty components array and component_share_total_pct 0"
      - "When supersedes_formulation_id is supplied and names a QUALIFIED formulation, that predecessor moves QUALIFIED -> RETIRED"

  - method: POST
    path: "/formulations/{id}/components"
    description: "Append one clay-pit component with its share_pct to a DRAFT body formulation, guarded by optimistic concurrency on the formulation's version"
    roles: [BodyEngineer]
    code: 200
    input: [pit_id, share_pct, expected_formulation_version]
    output: BodyFormulation
    side_effects:
      - "Appends {pit_id, share_pct} to components in call order and recomputes component_share_total_pct"
      - "Recomputes blend_iron_oxide_pct, blend_lime_pct, shale_share_pct, absorption_index and computed_durability_grade via body_blend_chemistry"
      - "Increments BodyFormulation.version by 1"

  - method: POST
    path: "/formulations/{id}/qualify"
    description: "Qualify a DRAFT body formulation once its component shares sum to exactly 100.00 and no contributing pit is suspended"
    roles: [BodyEngineer]
    code: 200
    input: []
    output: BodyFormulation
    side_effects:
      - "Re-runs body_blend_chemistry and freezes computed_durability_grade for downstream firing"
      - "Moves the formulation DRAFT -> QUALIFIED and stamps qualified_at from the logical clock"
      - "Increments BodyFormulation.version by 1"

  # ---- ProductionRun writes ---------------------------------------------
  - method: POST
    path: "/production-runs"
    description: "Extrude, cut and set a run of green units on a kiln car against a qualified body formulation, committing clay tonnage across the formulation's pits"
    roles: [PlantOperator]
    code: 201
    input: [plant_id, formulation_id, kiln_car_id, run_code, texture, green_units_set]
    output: ProductionRun
    side_effects:
      - "Creates the ProductionRun in SETTING"
      - "Runs clay_tonnage_commitment in COMMIT mode, writing clay_tons_committed and moving each contributing pit's per-pit share from available_tons to committed_tons"
      - "A pit whose available_tons reaches exactly 0.00 moves OPEN -> DEPLETED"
      - "Writes projected_net_green_units from the PROJECTED variant of green_yield"
      - "Moves the KilnCar IDLE -> SET and sets its current_production_run_id"

  - method: POST
    path: "/production-runs/{id}/close-green"
    description: "Close out green handling on a setting run by reporting the real handling loss, forking the run to SET or HELD"
    roles: [PlantOperator]
    code: 200
    input: [green_loss_units]
    output: ProductionRun
    side_effects:
      - "Writes net_green_units, green_loss_pct and green_loss_variance_units from the ACTUAL variant of green_yield"
      - "Forks the run SETTING -> SET when green_loss_pct <= 6.00, otherwise SETTING -> HELD"
      - "Runs clay_tonnage_commitment in CONSUME mode on both branches, moving each contributing pit's per-pit share from committed_tons to consumed_tons"
      - "Increments ProductionRun.version by 1"

  # ---- KilnRun writes ---------------------------------------------------
  - method: POST
    path: "/kiln-runs"
    description: "Schedule a tunnel-kiln firing window for one body formulation, rejecting any window that collides with an existing run's buffer-inflated window on the same kiln"
    roles: [PlantOperator]
    code: 201
    input: [kiln_id, formulation_id, run_code, start_at, end_at, planned_peak_temp_c, planned_soak_hours]
    output: KilnRun
    side_effects:
      - "Creates the KilnRun in SCHEDULED with loaded_units 0"
      - "Runs kiln_firing_window_overlap against every non-ABORTED KilnRun on the kiln, inflating both intervals by the kiln's cooldown_buffer_hours and treating touching endpoints as a collision"

  - method: POST
    path: "/kiln-runs/{id}/load"
    description: "Set one SET production run onto a numbered car position of a scheduled kiln run, guarded by optimistic concurrency on the kiln run's version"
    roles: [PlantOperator]
    code: 200
    input: [production_run_id, kiln_position, expected_kiln_run_version]
    output: KilnRun
    side_effects:
      - "Runs kiln_car_occupancy_overlap for the run's KilnCar over the half-open windows of every other non-ABORTED KilnRun the car is loaded into, allowing exact adjacency"
      - "Moves the ProductionRun SET -> LOADED and writes its kiln_run_id and kiln_position"
      - "Moves the run's KilnCar SET -> IN_KILN"
      - "Recomputes KilnRun.loaded_units as the sum of net_green_units over loaded runs"
      - "Increments KilnRun.version by 1"

  - method: POST
    path: "/kiln-runs/{id}/start"
    description: "Light off a scheduled kiln run that has at least one car loaded"
    roles: [PlantOperator]
    code: 200
    input: []
    output: KilnRun
    side_effects:
      - "Moves the KilnRun SCHEDULED -> FIRING"
      - "Increments KilnRun.version by 1"

  - method: POST
    path: "/kiln-runs/{id}/grade"
    description: "Record the realized firing curve and grade every loaded car position, minting one FiredLot per loaded production run"
    roles: [PlantOperator]
    code: 200
    input: [actual_peak_temp_c, actual_soak_hours]
    output: KilnRun
    side_effects:
      - "Writes actual_peak_temp_c, actual_soak_hours, base_cdi and firing_curve_deviation via firing_color_development and stamps graded_by_user_id"
      - "For each LOADED ProductionRun, synthesizes exactly one FiredLot carrying kiln_position, position_cdi, grade, color_index, color_family, texture, durability_grade, dye_lot_code and source_formulation_id, and moves the run LOADED -> FIRED"
      - "A FiredLot graded OVERFIRE_SCRAP or UNDERFIRE_SCRAP is created in SCRAP, sets the run's scrap_units and increments Plant.fired_scrap_units; any other grade is created in AVAILABLE"
      - "Moves each affected KilnCar IN_KILN -> IDLE and clears its current_production_run_id"
      - "Moves the KilnRun FIRING -> GRADED and increments KilnRun.version by 1"

  - method: POST
    path: "/fired-lots/{id}/quarantine"
    description: "Place a quality hold on a fired lot, removing it from blending eligibility without disturbing existing allocations"
    roles: [QualityManager]
    code: 200
    input: [quarantine_reason]
    output: FiredLot
    side_effects:
      - "Moves the FiredLot AVAILABLE or RESERVED -> QUARANTINED and records quarantine_reason"
      - "Increments FiredLot.version by 1"

  # ---- Order writes -----------------------------------------------------
  - method: POST
    path: "/orders"
    description: "Take an architectural brick order with its jobsite grid position, color, texture, durability grade, banding and unloading equipment requirement"
    roles: [SalesRep]
    code: 201
    input: [order_code, jobsite_grid_x, jobsite_grid_y, requested_units, color_family, texture, durability_grade, unloading_equipment_required, banding_type, "is_special_order?", "requires_panel_approval?"]
    output: Order
    side_effects: ["Creates the Order with fulfillment_status DRAFT and freight_status UNQUOTED; is_special_order and requires_panel_approval default to false"]

  - method: POST
    path: "/orders/{id}/assign-plant"
    description: "Run the freight-sensitive plant selector, assigning the cheapest eligible plant inside its market radius and quoting the estimated freight and lead time"
    roles: [SalesRep]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Runs plant_assignment_selector and writes plant_id, distance_miles and assigned_at, or rejects with ERR_NO_PLANT_IN_MARKET_RADIUS"
      - "Runs the ESTIMATED variant of order_freight_cost and writes estimated_billable_tons, estimated_base_freight_cents, estimated_fuel_surcharge_cents and estimated_freight_cents"
      - "Runs order_lead_time and writes lead_time_days and promised_ship_date"
      - "Advances fulfillment_status DRAFT -> ASSIGNED and freight_status UNQUOTED -> ESTIMATED"
      - "Stamps assigned_by_user_id and increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/blends"
    description: "Open a DRAFT shipped blend for an assigned order with the color-index window the jobsite will accept"
    roles: [BlendTechnician]
    code: 201
    input: [blend_code, target_color_index_min, target_color_index_max, requested_units]
    output: ShippedBlend
    side_effects:
      - "Creates the ShippedBlend in DRAFT with allocated_units 0, dye_lot_count 0, rejection_count 0 and target_color_index_midpoint computed as the 2-decimal mean of the window bounds"
      - "Advances Order.fulfillment_status ASSIGNED -> IN_BLENDING and increments Order.version by 1"

  - method: POST
    path: "/blends/{id}/components"
    description: "Hand-pick one fired lot into a draft blend, guarded by optimistic concurrency on the blend's version"
    roles: [BlendTechnician]
    code: 200
    input: [fired_lot_id, units, expected_blend_version]
    output: ShippedBlend
    side_effects:
      - "Creates a BlendComponent in ALLOCATED with source MANUAL, pinning color_index_at_allocation and contribution_index"
      - "Moves the FiredLot's units from available_units to reserved_units and moves the lot AVAILABLE -> RESERVED"
      - "Recomputes ShippedBlend.allocated_units and increments ShippedBlend.version by 1"

  - method: POST
    path: "/blends/{id}/compose"
    description: "Compose a draft blend, optionally auto-filling the shortfall from the closest-to-midpoint fired lots, and write the blend's color profile"
    roles: [BlendTechnician]
    code: 200
    input: ["auto_fill?"]
    output: ShippedBlend
    side_effects:
      - "When auto_fill is true and allocated_units < requested_units, runs blend_autofill_waterfall to append AUTO_FILL components in closest-to-midpoint order, or rejects with ERR_INSUFFICIENT_BLEND_INVENTORY"
      - "Each appended component moves its FiredLot's units from available_units to reserved_units and moves the lot AVAILABLE -> RESERVED"
      - "Runs blend_color_profile and writes weighted_color_index, color_range_span and dye_lot_count"
      - "Moves the ShippedBlend DRAFT -> COMPOSED, stamps composed_by_user_id and increments ShippedBlend.version by 1"

  - method: POST
    path: "/blends/{id}/certify"
    description: "Certify a composed blend against the order's approved sample panel and dye-lot equivalence class; the certifier may not be the composer"
    roles: [QualityManager]
    code: 200
    input: []
    output: ShippedBlend
    side_effects:
      - "Runs panel_dye_lot_equivalence over every ALLOCATED component when the order requires panel approval, writing panel_delta_e"
      - "Moves the ShippedBlend COMPOSED -> CERTIFIED, stamps certified_by_user_id and certified_at, and increments ShippedBlend.version by 1"

  - method: POST
    path: "/blends/{id}/reject"
    description: "Reject a composed blend, releasing every allocation back to fired inventory so the technician can recompose"
    roles: [QualityManager]
    code: 200
    input: [rejection_reason]
    output: ShippedBlend
    side_effects:
      - "CASCADE HOP 1: moves the ShippedBlend COMPOSED -> DRAFT, records rejection_reason, increments rejection_count and clears the color-profile fields and composed_by_user_id"
      - "CASCADE HOP 2: every ALLOCATED BlendComponent of the blend moves to VOIDED and allocated_units returns to 0"
      - "CASCADE HOP 3: every FiredLot behind those components has the voided units moved from reserved_units back to available_units, and a lot whose reserved_units reaches 0 moves RESERVED -> AVAILABLE"
      - "Increments ShippedBlend.version by 1"

  # ---- SamplePanel writes ------------------------------------------------
  - method: POST
    path: "/orders/{id}/sample-panels"
    description: "Lay up an architectural sample panel for an order from a qualified formulation and a specific dye lot"
    roles: [BlendTechnician]
    code: 201
    input: [panel_code, formulation_id, dye_lot_id, panel_color_index, tolerance_delta_e]
    output: SamplePanel
    side_effects: ["Creates the SamplePanel in DRAFT with revision_round 0"]

  - method: POST
    path: "/sample-panels/{id}/submit"
    description: "Submit a panel to the architect for review, from DRAFT or after a requested revision"
    roles: [BlendTechnician]
    code: 200
    input: []
    output: SamplePanel
    side_effects:
      - "Moves the SamplePanel DRAFT or REVISION_REQUESTED -> SUBMITTED and stamps submitted_by_user_id"
      - "Increments SamplePanel.version by 1"

  - method: POST
    path: "/sample-panels/{id}/request-revision"
    description: "Send a submitted panel back for another round, capped at three rounds"
    roles: [ArchitectReviewer]
    code: 200
    input: [revision_note]
    output: SamplePanel
    side_effects:
      - "Moves the SamplePanel SUBMITTED -> REVISION_REQUESTED, records revision_note and increments revision_round"
      - "Increments SamplePanel.version by 1"

  - method: POST
    path: "/sample-panels/{id}/approve"
    description: "Approve a submitted panel, pinning its formulation version and dye lot code and opening a 180-day approval window; the approver may not be the submitter"
    roles: [ArchitectReviewer]
    code: 200
    input: []
    output: SamplePanel
    side_effects:
      - "Moves the SamplePanel SUBMITTED -> APPROVED, pins pinned_formulation_version and pinned_dye_lot_code and copies panel_color_index into approved_color_index"
      - "Stamps approved_by_user_id and approved_at from the logical clock and sets expires_at to approved_at plus 180 whole days"
      - "Increments SamplePanel.version by 1"

  # ---- Packaging and delivery -------------------------------------------
  - method: POST
    path: "/orders/{id}/package"
    description: "Palletize and band a certified blend, re-quoting freight on the real packaged weight"
    roles: [LogisticsCoordinator]
    code: 200
    input: [pallet_count, band_count]
    output: Order
    side_effects:
      - "Records pallet_count and band_count and stamps packaged_by_user_id"
      - "Runs the FINAL variant of order_freight_cost and writes final_billable_tons, final_base_freight_cents, final_fuel_surcharge_cents, final_freight_cents and freight_variance_cents"
      - "Advances fulfillment_status IN_BLENDING -> PACKAGED and freight_status ESTIMATED -> FINALIZED"
      - "Increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/deliver"
    description: "Deliver a packaged order to the jobsite with the required unloading equipment, consuming the blended fired units"
    roles: [LogisticsCoordinator]
    code: 200
    input: [unloading_equipment_provided]
    output: Order
    side_effects:
      - "Advances fulfillment_status PACKAGED -> DELIVERED, freight_status FINALIZED -> INVOICED, and stamps delivered_at and invoiced_at"
      - "Moves the ShippedBlend CERTIFIED -> RELEASED"
      - "Moves every ALLOCATED BlendComponent to CONSUMED, shifting each FiredLot's reserved_units into consumed_units and moving fully drawn lots RESERVED -> CONSUMED"
      - "Increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order before delivery, waiving freight and unwinding the blend, its components, the fired-lot reservations and any open sample panel"
    roles: [SalesRep]
    code: 200
    input: [cancellation_reason]
    output: Order
    side_effects:
      - "CASCADE HOP 1: moves fulfillment_status to CANCELLED, records cancellation_reason and moves freight_status to WAIVED"
      - "CASCADE HOP 2: the Order's ShippedBlend moves to VOID"
      - "CASCADE HOP 3: every ALLOCATED BlendComponent of that blend moves to VOIDED and allocated_units returns to 0"
      - "CASCADE HOP 4: every FiredLot behind those components has the voided units moved from reserved_units back to available_units, and a lot whose reserved_units reaches 0 moves RESERVED -> AVAILABLE"
      - "CASCADE HOP 4b: every DRAFT, SUBMITTED or REVISION_REQUESTED SamplePanel of this Order moves to WITHDRAWN"
      - "Increments Order.version by 1"

  # ---- Test-driving endpoint (outside the public business surface) --------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every timestamp, lead-time and panel-expiry rule reads. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [PlantAdmin, PlantOperator, BodyEngineer, BlendTechnician, QualityManager, ArchitectReviewer, SalesRep, LogisticsCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the logical clock to the supplied instant; the response body is the inline object { current_utc: string } and no entity is mutated"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty on any request"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight roles declared in section 1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_PLANT_SCOPE_VIOLATION
    http: 403
    condition: "A PlantOperator acts on a resource whose owning Plant.id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The certifier equals the blend's composed_by_user_id, or the panel approver equals the panel's submitted_by_user_id"

  # --- not found ---
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "No Plant with the supplied id"
  - id: ERR_CLAY_PIT_NOT_FOUND
    http: 404
    condition: "No ClayPit with the supplied id, in the path or as a body pit_id"
  - id: ERR_FORMULATION_NOT_FOUND
    http: 404
    condition: "No BodyFormulation with the supplied id, in the path or as a body formulation_id or supersedes_formulation_id"
  - id: ERR_KILN_NOT_FOUND
    http: 404
    condition: "No Kiln with the supplied kiln_id"
  - id: ERR_KILN_CAR_NOT_FOUND
    http: 404
    condition: "No KilnCar with the supplied kiln_car_id"
  - id: ERR_PRODUCTION_RUN_NOT_FOUND
    http: 404
    condition: "No ProductionRun with the supplied id, in the path or as a body production_run_id"
  - id: ERR_KILN_RUN_NOT_FOUND
    http: 404
    condition: "No KilnRun with the supplied id"
  - id: ERR_FIRED_LOT_NOT_FOUND
    http: 404
    condition: "No FiredLot with the supplied id, in the path or as a body fired_lot_id or dye_lot_id"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No Order with the supplied id"
  - id: ERR_BLEND_NOT_FOUND
    http: 404
    condition: "No ShippedBlend with the supplied id"
  - id: ERR_SAMPLE_PANEL_NOT_FOUND
    http: 404
    condition: "No SamplePanel with the supplied id"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, out-of-range number, bad decimal scale, unknown enum value, empty required array, or end_at not strictly after start_at"

  # --- optimistic concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_formulation_version, expected_kiln_run_version or expected_blend_version does not equal the parent's current version"

  # --- state preconditions ---
  - id: ERR_PLANT_IDLED
    http: 409
    condition: "The Plant owning the target resource has status IDLED, including a repeat idle on the plant itself"
  - id: ERR_CLAY_PIT_SUSPENDED
    http: 409
    condition: "Qualification attempted while a contributing ClayPit has status DEPLETED or SUSPENDED"
  - id: ERR_FORMULATION_NOT_DRAFT
    http: 409
    condition: "Component append or qualification attempted on a formulation whose status is not DRAFT"
  - id: ERR_PRODUCTION_RUN_STATE_INVALID
    http: 409
    condition: "close-green attempted on a run that is not SETTING, or load attempted on a run that is not SET"
  - id: ERR_KILN_CAR_NOT_IDLE
    http: 409
    condition: "The KilnCar named by a new ProductionRun is not IDLE or already carries a production run"
  - id: ERR_KILN_RUN_STATE_INVALID
    http: 409
    condition: "load or start attempted on a run that is not SCHEDULED, grade attempted on a run that is not FIRING, or start attempted with no car loaded"
  - id: ERR_FIRED_LOT_UNAVAILABLE
    http: 409
    condition: "The FiredLot is not AVAILABLE or RESERVED, is not graded ON_COLOR, or has fewer available_units than requested"
  - id: ERR_LOT_QUARANTINED
    http: 409
    condition: "A FiredLot involved in the allocation, composition, certification or panel approval has status QUARANTINED"
  - id: ERR_BLEND_NOT_DRAFT
    http: 409
    condition: "Component append or composition attempted on a blend whose status is not DRAFT"
  - id: ERR_BLEND_NOT_COMPOSED
    http: 409
    condition: "Certification or rejection attempted on a blend whose status is not COMPOSED"
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "The Order's fulfillment_status does not admit the requested operation"
  - id: ERR_PANEL_STATE_INVALID
    http: 409
    condition: "The SamplePanel's status does not admit submit, request-revision or approve"

  # --- business safety and quality ---
  - id: ERR_PANEL_NOT_APPROVED
    http: 422
    condition: "Certification attempted on an order that requires panel approval with no APPROVED SamplePanel"
  - id: ERR_PANEL_APPROVAL_EXPIRED
    http: 422
    condition: "The APPROVED panel's expires_at is at or before the current logical clock"
  - id: ERR_DYE_LOT_MISMATCH
    http: 422
    condition: "An allocated lot's source_formulation_id lies outside the supersession closure of the approved panel's formulation"
  - id: ERR_PANEL_TOLERANCE_EXCEEDED
    http: 422
    condition: "panel_delta_e strictly exceeds the panel's tolerance_delta_e"
  - id: ERR_COLOR_RANGE_SPAN_EXCEEDED
    http: 422
    condition: "color_range_span strictly exceeds BLEND_SPAN_CEILING of 12.00"
  - id: ERR_DURABILITY_GRADE_NOT_MET
    http: 422
    condition: "The allocated lot's durability_grade ranks below the Order's required durability_grade"

  # --- cross-entity referential ---
  - id: ERR_FORMULATION_NOT_QUALIFIED
    http: 409
    condition: "The referenced BodyFormulation's status is not QUALIFIED"
  - id: ERR_BLEND_NOT_CERTIFIED
    http: 409
    condition: "Packaging attempted while the Order's ShippedBlend is not CERTIFIED"
  - id: ERR_UNLOADING_EQUIPMENT_UNAVAILABLE
    http: 422
    condition: "Delivery reported with unloading equipment the assigned Plant does not operate"
  - id: ERR_UNLOADING_EQUIPMENT_MISMATCH
    http: 422
    condition: "unloading_equipment_provided at delivery differs from the Order's unloading_equipment_required"
  - id: ERR_PIT_PLANT_MISMATCH
    http: 422
    condition: "The appended ClayPit belongs to a different Plant than the BodyFormulation"
  - id: ERR_LOT_ATTRIBUTE_MISMATCH
    http: 422
    condition: "The allocated FiredLot's color_family or texture differs from the Order's, or the lot was fired at a different plant than the Order's assigned plant"

  # --- constraints ---
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A code violates its declared uniqueness scope (plant_code, pit_name, kiln_code, car_code, formulation_code, run_code, order_code, blend_code or panel_code)"
  - id: ERR_COMPONENT_SHARE_TOTAL_INVALID
    http: 422
    condition: "Appending would push component_share_total_pct above 100.00, the same ClayPit appears twice, or qualification is attempted at a total other than exactly 100.00"
  - id: ERR_INVALID_KILN_POSITION
    http: 422
    condition: "kiln_position is outside 1..Kiln.position_count"
  - id: ERR_KILN_POSITION_OCCUPIED
    http: 409
    condition: "Another loaded ProductionRun already holds that kiln_position on this KilnRun"
  - id: ERR_KILN_CAR_CAPACITY_EXCEEDED
    http: 422
    condition: "green_units_set exceeds the KilnCar's capacity_green_units"
  - id: ERR_BLEND_OVER_ALLOCATION
    http: 422
    condition: "The append would push allocated_units above the blend's requested_units"
  - id: ERR_PANEL_REVISION_LIMIT
    http: 409
    condition: "A fourth revision round is requested on a panel already at revision_round 3"

  # --- temporal ---
  - id: ERR_KILN_WINDOW_CONFLICT
    http: 409
    condition: "The new firing window, inflated by the kiln's cooldown_buffer_hours, intersects or touches another non-ABORTED KilnRun's inflated window on the same kiln"
  - id: ERR_KILN_CAR_OCCUPIED
    http: 409
    condition: "The KilnCar's half-open occupancy window on the target run overlaps its window on another non-ABORTED KilnRun; exact adjacency is permitted"

  # --- fiscal and capacity ---
  - id: ERR_NO_PLANT_IN_MARKET_RADIUS
    http: 422
    condition: "plant_assignment_selector finds no ACTIVE plant within its market radius that can meet the order's color family, durability grade and unloading equipment"
  - id: ERR_CLAY_RESERVE_INSUFFICIENT
    http: 422
    condition: "Some contributing ClayPit's available_tons is below its per-pit share of the run's clay commitment"
  - id: ERR_INSUFFICIENT_BLEND_INVENTORY
    http: 422
    condition: "After auto-fill the eligible fired inventory still leaves allocated_units short of requested_units, or composition is attempted while short with auto_fill off"
  - id: ERR_PALLET_COUNT_INSUFFICIENT
    http: 422
    condition: "pallet_count multiplied by PALLET_UNITS of 500 is below the certified blend's allocated_units"
  - id: ERR_BAND_COUNT_INSUFFICIENT
    http: 422
    condition: "band_count is below pallet_count"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlantAdmin
    description: "Corporate plant engineering. Commissions plants, pits, kilns and cars and idles a plant, which is the trigger of the deepest cascade in the domain"
    identity: "opaque"
    exclusive_operations:
      - "POST /plants"
      - "POST /plants/{id}/idle"
      - "POST /plants/{id}/clay-pits"
      - "POST /plants/{id}/kilns"
    shared_operations:
      - "POST /plants/{id}/kiln-cars (shared with PlantOperator)"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: PlantOperator
    description: "The plant itself acting as an operator. Runs extrusion, setting, kiln loading, firing and grading, and may only touch resources belonging to its own plant"
    identity: "entity_backed:Plant"
    exclusive_operations:
      - "POST /production-runs"
      - "POST /production-runs/{id}/close-green"
      - "POST /kiln-runs"
      - "POST /kiln-runs/{id}/load"
      - "POST /kiln-runs/{id}/start"
      - "POST /kiln-runs/{id}/grade"
    shared_operations:
      - "POST /plants/{id}/kiln-cars (shared with PlantAdmin)"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: BodyEngineer
    description: "Ceramic body engineer. Owns shale blending and body formulation, including the supersession chain that defines dye-lot equivalence"
    identity: "opaque"
    exclusive_operations:
      - "POST /formulations"
      - "POST /formulations/{id}/components"
      - "POST /formulations/{id}/qualify"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: BlendTechnician
    description: "Product blender. Draws fired lots across kiln positions into shipped blends and lays up architectural sample panels. May compose a blend but may never certify it"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/blends"
      - "POST /blends/{id}/components"
      - "POST /blends/{id}/compose"
      - "POST /orders/{id}/sample-panels"
      - "POST /sample-panels/{id}/submit"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: QualityManager
    description: "Plant quality control. Quarantines suspect fired lots and certifies or rejects composed blends. Certification is barred to the operator that composed the blend"
    identity: "opaque"
    exclusive_operations:
      - "POST /fired-lots/{id}/quarantine"
      - "POST /blends/{id}/certify"
      - "POST /blends/{id}/reject"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: ArchitectReviewer
    description: "The architect of record for a project. Reviews submitted sample panels, sends them back for revision rounds, and approves them. Approval is barred to the operator that submitted the panel"
    identity: "opaque"
    exclusive_operations:
