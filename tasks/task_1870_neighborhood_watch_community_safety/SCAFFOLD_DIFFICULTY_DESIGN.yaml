          - state_machines.IncidentReport.NEEDS_INFO_to_UNDER_REVIEW
          - state_machines.IncidentReport.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          IncidentReport carries a cyclic review loop (SUBMITTED -> UNDER_REVIEW ->
          NEEDS_INFO -> UNDER_REVIEW -> CORROBORATED): the same entity re-enters
          UNDER_REVIEW after bouncing to NEEDS_INFO, and the cycle count is
          observable through version increments (4 mutations from create to
          corroborated) rather than any loop counter field.
        test_recipe:
          setup:
            - "WatchGroup with 1 REGISTERED block, 2 ACTIVE members, ACTIVE DataShareAgreement."
            - "Incident report filed by member m1 and moved SUBMITTED -> UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Loop Watch", precinct_code: "PCT5" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
