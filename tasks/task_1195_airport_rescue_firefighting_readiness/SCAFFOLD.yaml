  - { id: ERR_INDEX_BELOW_REQUIRED, http: 422, condition: "new_certificated_index below the computed required_index" }
  - { id: ERR_FIREFIGHTER_NOT_ACTIVE, http: 409, condition: "Training record creation for a SUSPENDED firefighter" }
  - { id: ERR_TRAINING_DATE_IN_FUTURE, http: 422, condition: "completed_on after the current logical date" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: AirportManager
    description: "Airport operator executive; owns profile, aircraft register, index determinations, mutual-aid agreements, report adjudication, inspection scheduling, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /arff/airport-profile"
      - "POST /arff/_clock/set_current_utc"
      - "POST/PATCH /arff/aircraft"
      - "POST /arff/index-determinations"
      - "POST /arff/mutual-aid-agreements (+activate/terminate)"
      - "POST /arff/incident-reports/{id}/accept|return (must not be report author)"
      - "POST /arff/faa-inspections (schedule)"
    shared_operations:
      - "All GET endpoints"
  - name: ArffChief
    description: "ARFF station chief; owns vehicles, readiness checks, firefighters, training records, drills, incidents, mutual-aid requests, and out-of-service events."
    identity: opaque
    exclusive_operations:
      - "POST /arff/vehicles, /arff/readiness-checks"
      - "POST /arff/firefighters (+suspend/reactivate), /arff/live-fire-training-records"
      - "POST /arff/response-drills (+execute/certify/fail)"
      - "POST /arff/incidents (+respond/control/close, PATCH alert-level)"
      - "POST /arff/incidents/{id}/mutual-aid-requests, request deploy/release/decline"
      - "POST /arff/vehicles/{id}/out-of-service-events, /arff/out-of-service-events/{id}/restore"
    shared_operations:
      - "All GET endpoints"
  - name: SafetyOfficer
    description: "Airport safety officer; authors incident reports and post-incident reviews."
    identity: opaque
    exclusive_operations:
      - "POST /arff/incidents/{id}/reports, PATCH /arff/incident-reports/{id}, POST submit"
      - "POST /arff/incident-reports/{id}/post-incident-reviews, PATCH/close reviews"
    shared_operations:
      - "All GET endpoints"
  - name: FaaInspector
    description: "FAA certification inspector; acknowledges downgrade notifications and conducts the annual inspection."
    identity: opaque
    exclusive_operations:
      - "POST /arff/index-downgrade-notifications/{id}/acknowledge"
      - "POST /arff/faa-inspections/{id}/begin|issue-findings|conclude"
    shared_operations:
      - "All GET endpoints"
  - name: Firefighter
    description: "Line firefighter; reads own record and training history. X-User-ID equals the Firefighter entity id."
    identity: "entity_backed:Firefighter"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
