            - "RenewalTask.${rt_id}.stage == OFFERED (unchanged)"

  # =================================================================
  # Rule 9 — compensating_invariant (>= 2, different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reinstate_conserves_trust_cash
        grounds:
          - state_machines.Policy.ACTIVE_to_CANCELLED
          - state_machines.Policy.CANCELLED_to_REINSTATED
          - entities.TrustAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = trust cash: cancel posts -604932 then reinstate
          posts +604932, so TrustAccount.balance_cents returns to its pre-cancel
          value 5000000 exactly. Invariant: balance_after_reinstate == balance_pre_cancel.
        test_recipe:
          setup:
            - "Trust account CA opened with balance 5000000; an ACTIVE PRO_RATA policy annual 1200000 term 2026-01-01..2027-01-01; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier C9", naic_code: "99001", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto C9", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod C9", npn: "NPN991", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${prod_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${prod_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /trust-accounts"
              payload: { name: "Trust CA9", state_code: "CA", minimum_balance_cents: 0 }
              as: TrustAccountant
              captures: { trust_id: $.data.id, trust_v: $.data.version }
            - call: "POST /trust-accounts/${trust_id}/entries"
              payload: { entry_type: "OPENING_BALANCE", amount_cents: 5000000, expected_trustaccount_version: "${trust_v}" }
              as: TrustAccountant
            - call: "POST /accounts"
              payload: { name: "Acct C9", servicing_producer_id: "${prod_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${prod_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v}" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_v2: $.data.version }
            - call: "POST /policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v2}" }
              as: AccountManager
              captures: { pol_v3: $.data.version }
            - call: "POST /policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pol_v3}", cancellation_date: "2026-07-01T00:00:00Z", cancellation_reason: "INSURED_REQUEST" }
              as: AccountManager
              captures: { pol_v4: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/reinstate"
              payload: { expected_policy_version: "${pol_v4}" }
              as: AccountManager
            - call: "GET /trust-accounts/${trust_id}"
              payload: {}
              as: TrustAccountant
              captures: { trust_balance: $.data.balance_cents }
          assert:
            - "TrustAccount.${trust_id}.balance_cents == 5000000 (cancel -604932 then reinstate +604932 nets to zero drift)"
            - "Policy.${pol_id}.return_premium_cents == 0"

      - name: reinstate_conserves_producer_commission_accrual
        grounds:
          - state_machines.Policy.ACTIVE_to_CANCELLED
          - state_machines.Policy.CANCELLED_to_REINSTATED
          - calculations.commission_statement_rollup
          - entities.CommissionStatement.fields.net_payable_cents
        distinguishing_aspect: |
          Conserved quantity = producer commission accrual (a DIFFERENT quantity
          than trust cash): cancel records a 155507 chargeback then reinstate
          reverses it, so an OPEN statement's net_payable_cents returns to the
          pre-cancel 264000. Invariant: net_after_reinstate == net_pre_cancel.
