  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_filter
        claim_type: listing
        grounds:
          - "response_envelope"
          - "entities.PortalMessage.fields.status"
        distinguishing_aspect: "Default pagination (limit 10) on 12 messages returns 10 items with total_count 12 and has_more true; limit=5&offset=10 returns 2 items with has_more false; status filter narrows total_count."
        test_recipe:
          setup: ["Nurse; patient with 12 messages, all RECEIVED (no triage)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M01", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M02", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M03", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M04", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M05", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M06", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M07", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M08", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M09", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M10", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M11", body: "b" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M12", body: "b" }, as: Patient, as_user_id: "${pat}" }
          trigger:
            - { call: "GET /inbox/portal-messages", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "GET /inbox/portal-messages", payload: { limit: 5, offset: 10 }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "GET /inbox/portal-messages", payload: { status: "TRIAGED" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "GET /inbox/portal-messages", payload: { patient_id: "${pat}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
          assert:
            - "default page: len(data) == 10, total_count == 12, has_more == true (defaults limit 10, offset 0)"
            - "limit=5&offset=10: len(data) == 2, total_count == 12, has_more == false"
            - "status=TRIAGED filter: total_count == 0 (all 12 are RECEIVED)"
            - "patient_id filter: total_count == 12"

      - name: escalation_reverse_lookup_after_escalate
        claim_type: action_endpoint
        grounds:
          - "entities.Escalation.fields.message_id"
          - "state_machines.PortalMessage.TRIAGED_to_ESCALATED"
        distinguishing_aspect: "Escalate returns 201 with the Escalation resource; the same record is discoverable via GET /inbox/escalations?message_id= (FK reverse reachability) with status OPEN."
        test_recipe:
          setup: ["URGENT message TRIAGED to provider pool; provider P3 on call 08:00-20:00"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P3", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p3: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${p3}", start_utc: "2026-08-03T08:00:00Z", end_utc: "2026-08-03T20:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/escalate", payload: { reason: "after hours" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { esc: "$.data.id", esc_st: "$.data.status" } }
            - { call: "GET /inbox/escalations", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { esc0_st: "$.data[0].status", esc0_prov: "$.data[0].provider_id" } }
          assert:
            - "escalate: 201, Escalation status == OPEN, provider_id == ${p3}"
            - "GET /inbox/escalations?message_id=${m}: total_count == 1, [0].status == OPEN, [0].provider_id == ${p3}"
            - "message is ESCALATED with assignee_id == ${p3}"

      - name: consent_reverse_lookup_by_message
        claim_type: action_endpoint
        grounds:
          - "entities.ConsentRecord.fields.message_id"
          - "state_machines.PortalMessage.IN_REVIEW_to_PENDING_CONSENT"
        distinguishing_aspect: "The cascade-created ConsentRecord (not present in any creation response) is discoverable via GET /inbox/consent-records?message_id= with pinned disclosed code/fee."
        test_recipe:
          setup: ["Message determined BILLABLE_CANDIDATE at 8 provider minutes"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { c_st: "$.data[0].status", c_code: "$.data[0].disclosed_code", c_fee: "$.data[0].disclosed_fee_cents" } }
          assert:
            - "exactly one ConsentRecord for the message: status == REQUESTED, disclosed_code == CPT_99421, disclosed_fee_cents == 5000, patient_id == ${pat}"
            - "message is PENDING_CONSENT with billing_disposition == BILLABLE_CANDIDATE"

      - name: burden_summary_zero_state
        claim_type: computed_read
        grounds:
          - "calculations.provider_inbox_burden"
          - "entities.StaffMember.fields.open_inbox_count"
        distinguishing_aspect: "A brand-new provider's burden summary is all zeros (both variants) with inbox_overloaded false."
        test_recipe:
          setup: ["Provider exists; no messages"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Dr Z", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { pz: "$.data.id" } }
          trigger:
            - { call: "GET /inbox/staff/${pz}/burden-summary", payload: {}, as: Provider, as_user_id: "${pz}", captures: { o: "$.data.open_inbox_count", ov: "$.data.inbox_overloaded", a: "$.data.attributed_resolutions", t: "$.data.touched_resolutions", cm: "$.data.clinical_minutes" } }
          assert: ["open_inbox_count == 0", "inbox_overloaded == false", "attributed_resolutions == 0", "touched_resolutions == 0", "clinical_minutes == 0"]

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_for_not_found
        claim_type: violation_to_error
        grounds:
          - "response_envelope"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Error responses carry the fixed envelope: meta.api_request_id + meta.api_request_timestamp present, response_type == error, data.error_id and data.message present."
        test_recipe:
          setup: ["Nothing needed"]
          setup_api_calls: []
          trigger:
            - { call: "GET /inbox/patients/00000000-0000-4000-8000-000000000000", payload: {}, as: PracticeAdmin, captures: { err: "$.data.error_id", msg: "$.data.message" } }
          assert:
            - "http 404; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp present; response_type == error"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: patient_cannot_triage
        claim_type: violation_to_error
        grounds:
          - "roles"
          - "validations[priority=2]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Patient role is not in the triage endpoint's role list: 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["Patient + own RECEIVED message"]
          setup_api_calls:
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "00000000-0000-4000-8000-000000000000", expected_message_version: "${m_v}" }, as: Patient, as_user_id: "${pat}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_INSUFFICIENT_PERMISSIONS (403) — role check fires before existence, so the bogus pool id is never reached"]

      - name: provider_cannot_adjudicate
        claim_type: violation_to_error
        grounds:
          - "roles"
          - "validations[priority=2]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Provider role may not record adjudication (BillingSpecialist-exclusive): 403, and role check precedes existence so a random claim UUID still yields the role error."
        test_recipe:
          setup: ["Provider staff exists"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
          trigger:
            - { call: "POST /inbox/e-visit-claims/00000000-0000-4000-8000-000000000000/record-adjudication", payload: { outcome: "PAID" }, as: Provider, as_user_id: "${prov_id}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"]

      - name: billing_cannot_cosign
        claim_type: violation_to_error
        grounds:
          - "roles"
          - "validations[priority=2]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "BillingSpecialist role may not cosign (Provider-exclusive): 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["Billing staff exists"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
          trigger:
            - { call: "POST /inbox/portal-messages/00000000-0000-4000-8000-000000000000/cosign", payload: { action: "COSIGN" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"]

      - name: role_staff_type_mismatch_rejected
        claim_type: conditional_validation
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_ROLE_STAFF_MISMATCH]"
        distinguishing_aspect: "X-User-Role TriageNurse with an X-User-ID belonging to a PROVIDER-typed StaffMember is rejected ERR_ROLE_STAFF_MISMATCH (403) — role identity is entity-backed."
        test_recipe:
          setup: ["Provider staff P; patient + RECEIVED message; provider pool"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${prov_id}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_ROLE_STAFF_MISMATCH (403) — a PROVIDER staff id cannot drive the TriageNurse role"]

      - name: patient_cannot_read_others_message
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_PATIENT_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "Patient B reading patient A's message is rejected 403 ERR_PATIENT_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Patients A and B; message owned by A"]
          setup_api_calls:
            - { call: "POST /inbox/patients", payload: { full_name: "Pat A", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_a: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat B", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_b: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat_a}", captures: { m: "$.data.id" } }
          trigger:
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Patient, as_user_id: "${pat_b}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_PATIENT_OWNERSHIP_MISMATCH (403)"]

      - name: patient_list_requires_own_patient_filter
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_PATIENT_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "Patient-role list calls must pass patient_id equal to the caller: no filter or another patient's id is 403; own id returns 200 with only own messages."
        test_recipe:
          setup: ["Patients A (1 message) and B (1 message)"]
          setup_api_calls:
            - { call: "POST /inbox/patients", payload: { full_name: "Pat A", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_a: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat B", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_b: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "A", body: "a" }, as: Patient, as_user_id: "${pat_a}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "B", body: "b" }, as: Patient, as_user_id: "${pat_b}" }
          trigger:
            - { call: "GET /inbox/portal-messages", payload: {}, as: Patient, as_user_id: "${pat_a}", captures: { err1: "$.data.error_id" } }
            - { call: "GET /inbox/portal-messages", payload: { patient_id: "${pat_b}" }, as: Patient, as_user_id: "${pat_a}", captures: { err2: "$.data.error_id" } }
            - { call: "GET /inbox/portal-messages", payload: { patient_id: "${pat_a}" }, as: Patient, as_user_id: "${pat_a}" }
          assert:
            - "no patient_id filter: ERR_PATIENT_OWNERSHIP_MISMATCH (403)"
            - "patient_id of another patient: ERR_PATIENT_OWNERSHIP_MISMATCH (403)"
            - "own patient_id: 200, total_count == 1"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_triage_rejected_412
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[triage-stale-message-version]"
          - "errors[ERR_STALE_VERSION]"
          - "validations[priority=6]"
        distinguishing_aspect: "optimistic_concurrency layer: a triage carrying the pre-first-triage version is rejected 412 ERR_STALE_VERSION, while a re-triage carrying the fresh version succeeds (supersede is legitimate — only staleness is rejected)."
        test_recipe:
          setup: ["Message RECEIVED at version 1; nurse; provider pool"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v1: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_p}", expected_message_version: "${m_v1}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { m_v2: "$.data.version" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v1}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v2}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { m_v3: "$.data.version" } }
          assert:
            - "stale expected_message_version (1 after triage bumped to 2): 412 ERR_STALE_VERSION; classification unchanged"
            - "fresh expected_message_version (2): 200, re-triage succeeds, version == 3, urgency now URGENT"
            - "version increments by exactly 1 per successful triage"

      - name: occ_stale_determine_billing_rejected_412
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[determine-billing-stale-message-version]"
          - "errors[ERR_STALE_VERSION]"
          - "validations[priority=6]"
        distinguishing_aspect: "optimistic_concurrency layer on determine-billing: a second determination carrying the pre-first-determination version is rejected 412 even though NOT_BILLABLE re-determination is a legitimate supersede."
        test_recipe:
          setup: ["Message IN_REVIEW assigned to provider P (3 minutes logged so the NOT_BILLABLE path is exercised)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 3 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "NOT_BILLABLE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "NOT_BILLABLE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v3: "$.data.version", m_bd: "$.data.billing_disposition" } }
          assert:
            - "replayed expected_message_version after the first determination bumped it: 412 ERR_STALE_VERSION"
            - "billing_disposition unchanged == NOT_BILLABLE; version bumped exactly once by the successful determination"

      - name: oncall_selector_empty_fallback
        claim_type: violation_to_error
        grounds:
          - "calculations.on_call_selector"
          - "validations[priority=25]"
          - "errors[ERR_NO_ONCALL_COVERAGE]"
        distinguishing_aspect: "selector_policy layer: with no shift covering now, escalate is rejected 409 ERR_NO_ONCALL_COVERAGE and no Escalation is created."
        test_recipe:
          setup: ["URGENT message TRIAGED to provider pool; NO on-call shifts exist"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/escalate", payload: { reason: "nobody home" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_NO_ONCALL_COVERAGE (409)", "message stays TRIAGED with assignee null", "GET /inbox/escalations?message_id=${m} total_count == 0"]

      - name: oncall_selector_tie_break_earliest_created
        claim_type: conditional_action
        grounds:
          - "calculations.on_call_selector"
        distinguishing_aspect: "selector_policy layer: two providers with identical shift windows [17:00,23:00] — the tie on start_utc is broken by shift created_at ASC, so the provider whose shift was created first (09:00 vs 09:01) wins; id never participates."
        test_recipe:
          setup: ["Providers PA and PB; identical shifts created at clock 09:00 (PA) and 09:01 (PB); URGENT message triaged; clock moved to 18:00 (both shifts cover)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr PA", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { pa: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr PB", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { pb: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${pa}", start_utc: "2026-08-03T17:00:00Z", end_utc: "2026-08-03T23:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:01:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${pb}", start_utc: "2026-08-03T17:00:00Z", end_utc: "2026-08-03T23:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/escalate", payload: { reason: "tie test" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { esc_prov: "$.data.provider_id" } }
          assert:
            - "escalation.provider_id == ${pa} (shift created at 09:00 beats the identical-window shift created at 09:01 via created_at ASC tie-break)"
            - "message.assignee_id == ${pa}"

      - name: delegation_revoke_cascade_covered_by_difficulty
        claim_type: side_effect_execution
        grounds:
          - "state_machines.DelegationGrant.ACTIVE_to_REVOKED"
        excluded_because:
          difficulty_instance: delegation_revoke_reassigns_and_recounts
          rationale: "Revoke cascade (reassignment + zero-sum count shift) asserted hop-by-hop in the named §1.8 instance."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: valid_transition
        grounds:
          - "response_envelope"
          - "calculations.response_deadline"
        distinguishing_aspect: "immediate consistency: a GET issued after triage/reply reflects all mutations in the same logical instant — no lag — and success responses carry the fixed envelope (meta.api_request_id, response_type object)."
        test_recipe:
          setup: ["Nurse pool FROM_TRIAGE urgent 60; nurse coverage; message RECEIVED at clock 10:00"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "NurseTriage", pool_kind: "NURSE_TRIAGE", target_minutes_emergent: 15, target_minutes_urgent: 60, target_minutes_routine: 240, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_n: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "ADMINISTRATIVE", pool_id: "${pool_n}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { st1: "$.data.status", due1: "$.data.response_due_at" } }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${nurse_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/reply", payload: { body: "On it" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { frt: "$.data.first_response_at" } }
          assert:
            - "GET after triage shows status == TRIAGED and response_due_at == 2026-08-03T11:00:00Z (10:00 + 60m) in the SAME logical instant"
            - "GET after staff reply shows first_response_at == 2026-08-03T10:00:00Z and sla_breached == false"
            - "success envelope: response_type == object with meta.api_request_id present on every response"


