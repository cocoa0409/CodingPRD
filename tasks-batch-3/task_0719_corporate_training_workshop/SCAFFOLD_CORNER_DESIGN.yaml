      - name: delivery_mode_mismatch_on_open
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=8]
          - errors[ERR_DELIVERY_MODE_MISMATCH]
          - state_machines.Cohort.SCHEDULED_to_OPEN
        distinguishing_aspect: "Opening an ONSITE cohort whose program delivery_mode is VIRTUAL returns ERR_DELIVERY_MODE_MISMATCH (409)."
