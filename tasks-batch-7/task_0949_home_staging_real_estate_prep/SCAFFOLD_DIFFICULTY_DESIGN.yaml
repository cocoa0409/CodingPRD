      - name: shoot_block_buffer_rejects_a_start_239_minutes_later
        grounds:
          - calculations.shoot_block_interval
          - validations[priority=62]
          - errors[ERR_SHOOT_TIME_CONFLICT]
          - entities.PhotoShoot.fields.scheduled_at
        distinguishing_aspect: |
          INTERVAL SEMANTICS B — HALF-OPEN MINUTE-LEVEL INTERVALS WITH AN ASYMMETRIC
          TRAILING BUFFER on a DIFFERENT resource entity (PhotoShoot on a property). The
          existing 10:00 shoot occupies [10:00, 14:00) once its 60-minute tail is added, so
          13:59 collides and 14:00 does not — arithmetic that shares nothing with the
          Install day-bucket rule.
        test_recipe:
          setup:
            - "The canonical VACANT project staged at 2026-06-10T09:00:00Z with one SCHEDULED shoot at 2026-06-11T10:00:00Z."
          setup_api_calls: *v_staged
