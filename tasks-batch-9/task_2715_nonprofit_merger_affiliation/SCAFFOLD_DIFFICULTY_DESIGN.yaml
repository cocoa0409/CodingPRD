# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2715 - Nonprofit Merger & Affiliation
# 9 rule_ids x 2 instances = 18 instances. Every ref grounds in SCAFFOLD.yaml
# §1.1-§1.7. Logical clock starts at the mandated default 2026-08-01T00:00:00Z,
# so every call below runs at that instant unless a /_clock/set_current_utc
# call moves it.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: alignment_screening_vs_diligence_adjusted_variant_divergence
        grounds:
          - calculations.mission_program_alignment_score
          - calculations.combined_operating_reserve_months
          - entities.AlignmentAssessment.fields.variant
          - entities.AlignmentAssessment.fields.composite_rating
          - entities.Program.fields.continuity_status
          - state_machines.Program.ACTIVE_to_PLANNED_SUNSET
        distinguishing_aspect: |
          Two named variants of ONE calculation read the SAME stored rows and return
          different composite_score values: SCREENING admits all five Programs and
          zero diligence exposure (index 1.0000 -> 0.00 overlap points, reserve 5.99),
          while DILIGENCE_ADJUSTED drops the PLANNED_SUNSET program and subtracts the
          OPEN finding exposure (index 0.5000 -> 30.00 overlap points, reserve 4.20),
          so the same database yields 60.00 MODERATE versus 90.00 STRONG.
        test_recipe:
          setup:
            - "Organization A (initiator) and Organization B (target) both incorporated in CA with the identical mission_code YM-YOUTH_MENTORING and annual_expense_cents 100000002"
            - "A owns 2 Programs, B owns 3 Programs; exactly one initiator/target pair shares both service_category and county_code once B's FOOD_SECURITY program is sunset"
            - "A Restructuring between them in status DILIGENCE with one OPEN FINANCE DiligenceRequest of exposure_cents 29916670"
            - "B's FOOD_SECURITY program has continuity_status PLANNED_SUNSET"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /programs"
              payload: { org_id: "${org_a}", name: "A Mentoring", service_category: "YOUTH_MENTORING", county_code: "CA-ALAMEDA", annual_expense_cents: 10000000, clients_served: 400 }
              as: PlatformAdmin
              captures: { prog_a1: $.data.id }
            - call: "POST /programs"
              payload: { org_id: "${org_a}", name: "A Pantry", service_category: "FOOD_SECURITY", county_code: "CA-ALAMEDA", annual_expense_cents: 10000000, clients_served: 900 }
              as: PlatformAdmin
              captures: { prog_a2: $.data.id }
            - call: "POST /programs"
              payload: { org_id: "${org_b}", name: "B Mentoring", service_category: "YOUTH_MENTORING", county_code: "CA-ALAMEDA", annual_expense_cents: 10000000, clients_served: 350 }
              as: PlatformAdmin
              captures: { prog_b1: $.data.id }
            - call: "POST /programs"
              payload: { org_id: "${org_b}", name: "B Pantry", service_category: "FOOD_SECURITY", county_code: "CA-ALAMEDA", annual_expense_cents: 10000000, clients_served: 800 }
              as: PlatformAdmin
              captures: { prog_b2: $.data.id }
            - call: "POST /programs"
              payload: { org_id: "${org_b}", name: "B Housing", service_category: "HOUSING", county_code: "CA-ALAMEDA", annual_expense_cents: 10000000, clients_served: 120 }
              as: PlatformAdmin
              captures: { prog_b3: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id }
            - call: "POST /letters-of-intent/${loi}/execute"
              payload: { executed_note: "countersigned" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
            - call: "POST /programs/${prog_b2}/continuity-decision"
              payload: { restructuring_id: "${deal}", disposition: "SUNSET" }
              as: IntegrationManager
              as_user_id: "im-001"
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "${deal}", workstream: "FINANCE", severity: "HIGH", summary: "Unreconciled pledge receivable", exposure_cents: 29916670 }
              as: DiligenceLead
              as_user_id: "dl-001"
              captures: { finding: $.data.id }
          trigger:
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { scr: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "DILIGENCE_ADJUSTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { adj: $.data.id }
          assert:
            - "AlignmentAssessment.${scr}.included_program_count == 5"
            - "AlignmentAssessment.${scr}.overlap_pair_count == 2"
            - "AlignmentAssessment.${scr}.program_overlap_index == 1.0000"
            - "AlignmentAssessment.${scr}.program_overlap_points == 0.00"
            - "AlignmentAssessment.${scr}.mission_alignment_points == 40.00"
            - "AlignmentAssessment.${scr}.open_diligence_exposure_cents == 0"
            - "AlignmentAssessment.${scr}.available_unrestricted_cents == 99916670"
            - "AlignmentAssessment.${scr}.reserve_months == 5.99"
            - "AlignmentAssessment.${scr}.sustainability_points == 20.00"
            - "AlignmentAssessment.${scr}.composite_score == 60.00"
            - "AlignmentAssessment.${scr}.composite_rating == MODERATE"
            - "AlignmentAssessment.${adj}.included_program_count == 4"
            - "AlignmentAssessment.${adj}.overlap_pair_count == 1"
            - "AlignmentAssessment.${adj}.program_overlap_index == 0.5000"
            - "AlignmentAssessment.${adj}.program_overlap_points == 30.00"
            - "AlignmentAssessment.${adj}.open_diligence_exposure_cents == 29916670"
            - "AlignmentAssessment.${adj}.available_unrestricted_cents == 70000000"
            - "AlignmentAssessment.${adj}.reserve_months == 4.20"
            - "AlignmentAssessment.${adj}.composite_score == 90.00"
            - "AlignmentAssessment.${adj}.composite_rating == STRONG"
            - "GET /restructurings/${deal}/dossier returns composite_delta == 30.00"

      - name: restricted_fund_donor_consent_vs_judicial_modification_divergence
        grounds:
          - calculations.restricted_fund_transferable_amount
          - entities.RestrictedFund.fields.transferable_amount_cents
          - entities.RestrictedFund.fields.historic_dollar_value_cents
          - state_machines.RestrictedFund.CONSENT_SOUGHT_to_CONSENT_GRANTED
          - state_machines.RestrictedFund.PETITION_FILED_to_MODIFIED
        distinguishing_aspect: |
          The SAME two variants run on byte-identical PERM_ENDOWMENT inputs
          (principal 50000000, appreciation 12000000, historic dollar value 45000000)
          and release different amounts: DONOR_CONSENT releases the whole 62000000
          fund value while JUDICIAL_MODIFICATION releases only 20150000 - the
          17000000 above the historic dollar value plus a floor-truncated 700 bps
          slice of that value - a 41850000 divergence on identical data.
        test_recipe:
          setup:
            - "One Organization holding two identical PERM_ENDOWMENT RestrictedFunds"
            - "Fund D has restriction_conflict false, so the donor-consent branch is open; the donor grants consent"
            - "Fund J has restriction_conflict true with a reachable donor, so consent may be solicited but is denied, forcing a judicial modification petition that the court grants"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Delaney Endowment", fund_type: "PERM_ENDOWMENT", principal_cents: 50000000, accumulated_appreciation_cents: 12000000, historic_dollar_value_cents: 45000000, restriction_purpose_code: "YM-MENTOR_STIPENDS", restriction_conflict: false, donor_of_record_reachable: true }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
              captures: { fund_d: $.data.id }
            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Jarvis Endowment", fund_type: "PERM_ENDOWMENT", principal_cents: 50000000, accumulated_appreciation_cents: 12000000, historic_dollar_value_cents: 45000000, restriction_purpose_code: "YM-MENTOR_STIPENDS", restriction_conflict: true, donor_of_record_reachable: true }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
              captures: { fund_j: $.data.id }
            - call: "POST /restricted-funds/${fund_d}/seek-consent"
              payload: { consent_method: "WRITTEN" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
            - call: "POST /restricted-funds/${fund_j}/seek-consent"
              payload: { consent_method: "WRITTEN" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
            - call: "POST /restricted-funds/${fund_j}/record-consent"
              payload: { decision: "DENIED" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
            - call: "POST /restricted-funds/${fund_j}/file-petition"
              payload: { petition_basis: "IMPRACTICABLE", court_docket_no: "ALA-2026-0099" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
          trigger:
            - call: "POST /restricted-funds/${fund_d}/record-consent"
              payload: { decision: "GRANTED" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
            - call: "POST /restricted-funds/${fund_j}/record-court-decision"
              payload: { decision: "GRANTED_WITH_CONDITIONS", modified_purpose_code: "YM-YOUTH_PROGRAMS" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
          assert:
            - "RestrictedFund.${fund_d}.transfer_status == CONSENT_GRANTED"
            - "RestrictedFund.${fund_d}.transferable_amount_cents == 62000000"
            - "RestrictedFund.${fund_j}.transfer_status == MODIFIED"
            - "RestrictedFund.${fund_j}.court_decision == GRANTED_WITH_CONDITIONS"
            - "RestrictedFund.${fund_j}.transferable_amount_cents == 20150000"
            - "RestrictedFund.${fund_d}.transferable_amount_cents - RestrictedFund.${fund_j}.transferable_amount_cents == 41850000"

  - rule_id: combinatorial_formula
    instances:
      - name: reserve_months_requires_per_organization_rounding_before_summation
        grounds:
          - calculations.combined_operating_reserve_months
          - entities.Organization.fields.monthly_expense_cents
          - entities.AlignmentAssessment.fields.combined_monthly_expense_cents
          - entities.AlignmentAssessment.fields.sustainability_points
        distinguishing_aspect: |
          Two evaluation orders over the identical inputs disagree by exactly one cent
          and that cent crosses a tier boundary: rounding each organization's
          annual_expense_cents / 12 FIRST gives 8333334 + 8333334 = 16666668 and
          reserve_months 5.99 (20 sustainability points, composite 60.00), whereas
          summing the annual figures and dividing once gives 16666667 and
          reserve_months 6.00 (30 points, composite 70.00). Order of rounding versus
          summation is the whole test; the numbers are chosen so no other order can
          coincidentally land on 5.99.
        test_recipe:
          setup:
            - "Two Organizations each with annual_expense_cents 100000002, an amount whose twelfth is exactly 8333333.5 cents so the rounding step is decisive"
            - "Combined unrestricted net assets of 99916670 cents, which sits between 5.995 x 16666667 and 5.995 x 16666668"
            - "A Restructuring between them in status EXPLORATORY and no Programs and no DiligenceRequests, so overlap points are 0.00 and open exposure is 0"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id, monthly_a: $.data.monthly_expense_cents }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
          trigger:
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { scr: $.data.id }
          assert:
            - "Organization.${org_a}.monthly_expense_cents == 8333334"
            - "Organization.${org_b}.monthly_expense_cents == 8333334"
            - "AlignmentAssessment.${scr}.combined_monthly_expense_cents == 16666668"
            - "AlignmentAssessment.${scr}.combined_monthly_expense_cents != 16666667"
            - "AlignmentAssessment.${scr}.available_unrestricted_cents == 99916670"
            - "AlignmentAssessment.${scr}.reserve_months == 5.99"
            - "AlignmentAssessment.${scr}.sustainability_points == 20.00"
            - "AlignmentAssessment.${scr}.composite_score == 60.00"
            - "AlignmentAssessment.${scr}.composite_rating == MODERATE"

      - name: ag_filing_fee_tier_selected_from_fee_exclusive_provisional_total
        grounds:
          - calculations.ag_consideration_and_filing_fee
          - entities.AGFiling.fields.provisional_consideration_cents
          - entities.AGFiling.fields.ag_filing_fee_cents
          - entities.AGFiling.fields.total_consideration_cents
          - entities.Restructuring.fields.unrestricted_transfer_value_cents
        distinguishing_aspect: |
          The fee tier depends on a total that itself contains the fee, and the pinned
          order breaks the loop: the tier is read from the fee-EXCLUSIVE provisional
          total 999999950, which is below the 1000000000 ceiling and therefore yields
          150000, even though the final total_consideration_cents of 1000149950 sits
          ABOVE that ceiling. An implementation that selects the tier from the final
          total charges 500000 and reports 1000499950 - both observably wrong.
        test_recipe:
          setup:
            - "A Restructuring in status REGULATORY_REVIEW with structure_type MERGER, unrestricted_transfer_value_cents 974999950 and no transferred RestrictedFund"
            - "Both parties incorporated in CA so ag_review_required is true"
            - "The logical clock still at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id }
            - call: "POST /letters-of-intent/${loi}/execute"
              payload: { executed_note: "countersigned" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "${deal}", workstream: "FINANCE", severity: "HIGH", summary: "Unreconciled pledge receivable", exposure_cents: 29916670 }
              as: DiligenceLead
              as_user_id: "dl-001"
              captures: { finding: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "DILIGENCE_ADJUSTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /diligence-requests/${finding}/respond"
              payload: { response_ref: "RESP-0001" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /diligence-requests/${finding}/clear"
              payload: { clearance_note: "Reconciled against audited schedule" }
              as: DiligenceLead
              as_user_id: "dl-002"
            - call: "POST /restructurings/${deal}/select-structure"
              payload: { structure_type: "MERGER", unrestricted_transfer_value_cents: 974999950 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: BoardSecretary
              as_user_id: "${org_a}"
              captures: { rv_b: $.data.version }
            - call: "POST /board-approvals"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_b}", approving_party: "INITIATOR", seats_total: 15, recusals: 1, votes_for: 10, votes_against: 4, abstentions: 0, conflict_disclosures_count: 1, recording_secretary_ref: "SEC-A-1" }
              as: BoardSecretary
              as_user_id: "${org_a}"
              captures: { ba_i: $.data.id }
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: BoardSecretary
              as_user_id: "${org_b}"
              captures: { rv_c: $.data.version }
            - call: "POST /board-approvals"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_c}", approving_party: "TARGET", seats_total: 12, recusals: 0, votes_for: 8, votes_against: 4, abstentions: 0, conflict_disclosures_count: 0, recording_secretary_ref: "SEC-B-1" }
              as: BoardSecretary
              as_user_id: "${org_b}"
              captures: { ba_t: $.data.id }
            - call: "POST /board-approvals/${ba_i}/certify"
              payload: { fiduciary_memo_ref: "MEMO-A-1", certifying_secretary_ref: "SEC-A-2" }
              as: BoardSecretary
              as_user_id: "${org_a}"
            - call: "POST /board-approvals/${ba_t}/certify"
              payload: { fiduciary_memo_ref: "MEMO-B-1", certifying_secretary_ref: "SEC-B-2" }
              as: BoardSecretary
              as_user_id: "${org_b}"
          trigger:
            - call: "POST /ag-filings"
              payload: { restructuring_id: "${deal}", state_code: "CA", filing_type: "APPROVAL_PETITION", legal_costs_cents: 25000000 }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
              captures: { filing: $.data.id }
          assert:
            - "AGFiling.${filing}.transferred_charitable_asset_value_cents == 974999950"
            - "AGFiling.${filing}.provisional_consideration_cents == 999999950"
            - "AGFiling.${filing}.ag_filing_fee_cents == 150000"
            - "AGFiling.${filing}.closing_costs_cents == 25150000"
            - "AGFiling.${filing}.total_consideration_cents == 1000149950"
            - "AGFiling.${filing}.ag_filing_fee_cents != 500000"
            - "AGFiling.${filing}.statutory_waiting_days == 45"
            - "AGFiling.${filing}.status == SUBMITTED"

  - rule_id: non_linear_state_machine
    instances:
      - name: letter_of_intent_counter_revise_cycle_preserves_exclusivity_dimension
        grounds:
          - state_machines.LetterOfIntent.ISSUED_to_COUNTERED
          - state_machines.LetterOfIntent.COUNTERED_to_ISSUED
          - entities.LetterOfIntent.fields.counter_round_count
          - entities.LetterOfIntent.fields.exclusivity_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The letter carries two independent state dimensions and the negotiation
          dimension is cyclic: ISSUED -> COUNTERED -> ISSUED can be traversed any
          number of times. Two full laps must (a) return status to ISSUED, (b) leave
          counter_round_count monotonically at 2 rather than resetting it, (c) overwrite
          board_seat_split_initiator on each revise, and (d) leave the exclusivity
          dimension entirely untouched - same start date, same end date, still ACTIVE.
          An implementation that models the letter as a single linear status, or that
          re-derives the exclusivity window on each revise, fails on the second lap.
        test_recipe:
          setup:
            - "Two Organizations and a Restructuring in status RATIONALE_BUILT"
            - "One LetterOfIntent freshly created in status ISSUED with combined_board_seats 15, board_seat_split_initiator 8, exclusivity_days 60 and exclusivity_start_date 2026-08-01"
            - "The logical clock at the default 2026-08-01T00:00:00Z throughout, so no sweep can expire the window"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id, end0: $.data.exclusivity_end_date }
          trigger:
            - call: "POST /letters-of-intent/${loi}/counter"
              payload: { counter_note: "Target seeks parity on the combined board" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
            - call: "POST /letters-of-intent/${loi}/revise"
