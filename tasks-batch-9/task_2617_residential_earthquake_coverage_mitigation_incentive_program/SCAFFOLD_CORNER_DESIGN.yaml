              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eqp/catastrophe-events"
              payload: { event_code: "EQ-2026-ROLE", magnitude: 6.0, epicenter_county_code: "06001", occurred_at: "2026-09-05T00:00:00Z", retention_cents: 100000000 }
              as: ProgramAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /eqp/catastrophe-events/${ev_id}/declare"
              payload: {}
              as: ProgramAdmin
              captures: { ev_status: $.data.status, ev_v: $.data.version }
            - call: "POST /eqp/claims"
              payload: { policy_id: "${pol_id}", event_id: "${ev_id}", structural_damage_cents: 5000000, cosmetic_damage_cents: 0, contents_damage_cents: 0, loss_of_use_cents: 0, expected_event_version: "${ev_v}" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /eqp/claims/${cl_id}/adjust-provisional"
              payload: {}
