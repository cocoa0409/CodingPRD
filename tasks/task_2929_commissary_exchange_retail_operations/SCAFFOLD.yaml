# =============================================================================
# Commissary & Exchange Retail Operations — benchmark seed tables (v1)
# §1.0 – §1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Commissary & Exchange Retail Operations (Defense Commissary Agency / AAFES):
  patron eligibility verification by ID card class and authorized-shopper rules,
  cost-plus surcharge pricing model and no-markup grocery pricing, worldwide
  assortment allocation and overseas shipping cost allowance, surcharge fund
  capital project accounting, exchange dividend to morale/welfare/recreation
  programs, tax-free sales and resale-restriction enforcement on quantity
  limits, deployed and remote site special orders, vendor stocking (DSD)
  agreements and promotional allowance rules.

domain_name: commissary-exchange-retail-ops

# Flat topology: peer collections joined by foreign keys, no single owning
# top-level resource. Every path below is rooted at "/".
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Patron references itself (sponsor -> dependent), Assortment is a
  # store x product junction, Sale reaches across three aggregates
  # (Store, Patron, ShopperDelegation) and FundLedgerEntry is an
  # append-only projection of four different source aggregates.

  state_machine_shape: parallel
  # Patron carries two independent dimensions (card_status x
  # resale_watch_status); Sale carries (tender_state x compliance_state);
  # CapitalProject is cyclic (SUBMITTED -> RETURNED_FOR_REVISION ->
  # SUBMITTED) and branching (SUBMITTED -> {APPROVED, AWAITING_FUNDS,
  # RETURNED_FOR_REVISION, REJECTED}); SpecialOrder forks on route.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The SurchargeFundController that submits a capital project may not be the
  # user that closes it (outlay), and may never decide it — deciding is the
  # MwrBoardOfficer's exclusive operation.

  consistency_model: immediate

  difficulty_level: expert
  # 11 entities, 44 endpoints, 46 error codes, 8 calculations (2 carrying
  # divergent variants), 6 state machines, 2 OCC rules, 35 validations.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Installation store name", constraints: "1..120 chars" }
      - { name: channel, type: enum, source: input, description: "COMMISSARY (grocery, sold at cost plus surcharge) | EXCHANGE (general merchandise, sold at cost plus markup)", constraints: "COMMISSARY | EXCHANGE" }
      - { name: region, type: enum, source: input, description: "CONUS | OVERSEAS | DEPLOYED — drives eligibility, shipping allowance rates and special-order routing", constraints: "CONUS | OVERSEAS | DEPLOYED" }
      - { name: surcharge_rate_bp, type: integer, source: input, default: 500, description: "Cost-plus surcharge in basis points applied per sale line", constraints: "0..1000" }
      - { name: exchange_markup_bp, type: integer, source: input, default: 0, description: "Retail markup in basis points; MUST be 0 when channel == COMMISSARY (no-markup grocery pricing)", constraints: "0..5000" }
      - { name: shelf_block_capacity_facings, type: integer, source: input, default: 24, description: "Facings available per shelf block; aggregate cap for overlapping Assortment windows on the same shelf_block", constraints: ">= 1" }
      - { name: surcharge_fund_balance_cents, type: integer, source: computed, default: 0, description: "= sum(FundLedgerEntry.amount_cents where store_id == this.id AND fund == SURCHARGE); signed sum of collections, reversals and capital outlays" }
      - { name: surcharge_obligated_cents, type: integer, source: computed, default: 0, description: "= sum(CapitalProject.obligation_cents where store_id == this.id AND state == APPROVED); released when the project reaches CLOSED" }
      - { name: dividend_fund_balance_cents, type: integer, source: computed, default: 0, description: "= sum(FundLedgerEntry.amount_cents where store_id == this.id AND fund == DIVIDEND); vendor promotional allowances in, MWR transfers out" }
      - { name: shipping_allowance_committed_cents, type: integer, source: computed, default: 0, description: "= sum(SpecialOrder.shipping_allowance_cents where store_id == this.id AND state IN {LOCAL_FILL_PENDING, OVERSEAS_SHIP_PENDING, FULFILLED})" }
      - { name: fund_posture, type: enum, source: computed, default: FROZEN, description: "Derived gate over surcharge_available_cents (= surcharge_fund_balance_cents - surcharge_obligated_cents): UNRESTRICTED when >= 500000, CONSTRAINED when 100000 <= x < 500000, FROZEN when < 100000", constraints: "UNRESTRICTED | CONSTRAINED | FROZEN" }
      - { name: period_close_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by POST /stores/{id}/close-period" }

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patron name as printed on the ID card", constraints: "1..120 chars" }
      - { name: id_card_class, type: enum, source: input, description: "ID card class driving the channel/region eligibility matrix", constraints: "ACTIVE_DUTY | RETIREE | DEPENDENT | DISABLED_VETERAN | GUARD_RESERVE | DOD_CIVILIAN_OVERSEAS" }
      - { name: sponsor_patron_id, type: string, source: input, default: null, description: "FK -> Patron.id; self-referential sponsor link. REQUIRED when id_card_class == DEPENDENT, MUST be null for every other class" }
      - { name: card_status, type: enum, source: system, default: VALID, description: "Card dimension of the parallel state machine", constraints: "VALID | SUSPENDED | REVOKED" }
      - { name: suspension_reason, type: enum, source: system, default: null, description: "Why card_status left VALID", constraints: "ADMIN_ACTION | RISK_THRESHOLD | SPONSOR_SUSPENDED | null" }
      - { name: resale_watch_status, type: enum, source: system, default: CLEAR, description: "Resale-compliance dimension of the parallel state machine; rewritten by the resale-risk recompute side effect", constraints: "CLEAR | WATCH | RESTRICTED" }
      - { name: resale_risk_score, type: integer, source: computed, default: 0, description: "ROLLING_30D variant of calculations.patron_resale_risk_score; drives resale_watch_status", constraints: "0..100" }
      - { name: recent_sales_risk_score, type: integer, source: computed, default: 0, description: "LAST_5_SALES variant of calculations.patron_resale_risk_score; drives the RISK_THRESHOLD card suspension", constraints: "0..100" }
      - { name: restricted_units_30d, type: integer, source: computed, default: 0, description: "Units of resale-restricted products bought inside the ROLLING_30D input set" }
      - { name: flagged_sale_count_30d, type: integer, source: computed, default: 0, description: "Count of Sales with compliance_state == FLAGGED inside the ROLLING_30D input set" }
      - { name: manual_strike_count, type: integer, source: system, default: 0, description: "Strikes recorded by POST /patrons/{id}/compliance-review with decision == CONFIRM_STRIKE; reset to 0 by CLEAR_WATCH" }

  - name: ShopperDelegation
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_patron_id, type: string, source: input, description: "FK -> Patron.id; the sponsor whose privileges are lent out" }
      - { name: delegate_patron_id, type: string, source: input, description: "FK -> Patron.id; the authorized shopper who may ring sales against the sponsor" }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive start of the delegation window (ISO 8601 UTC instant)" }
      - { name: valid_to, type: datetime, source: input, description: "EXCLUSIVE end of the delegation window — coverage test is valid_from <= business_date < valid_to (half-open)", constraints: "> valid_from" }
      - { name: per_sale_spend_cap_cents, type: integer, source: input, description: "Fiscal ceiling on Sale.total_due_cents when this delegation is the acting delegation", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVOKED | EXPIRED | SUPERSEDED | SUSPENDED_BY_SPONSOR", constraints: "ACTIVE | REVOKED | EXPIRED | SUPERSEDED | SUSPENDED_BY_SPONSOR" }
      - { name: superseded_by_delegation_id, type: string, source: system, default: null, description: "FK -> ShopperDelegation.id; set on the loser when a delegation from a different sponsor supersedes it" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Worldwide item number; unique across all Products", constraints: "unique, 3..32 chars" }
      - { name: name, type: string, source: input, description: "Item description" }
      - { name: category, type: enum, source: input, description: "GROCERY_STAPLE | INFANT_FORMULA | TOBACCO | ALCOHOL | GENERAL_MERCHANDISE", constraints: "GROCERY_STAPLE | INFANT_FORMULA | TOBACCO | ALCOHOL | GENERAL_MERCHANDISE" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Landed cost per unit; the commissary shelf price before surcharge", constraints: ">= 1" }
      - { name: unit_weight_grams, type: integer, source: input, default: 500, description: "Shipping weight per unit; feeds special-order billable weight", constraints: ">= 1" }
      - { name: resale_restricted, type: boolean, source: input, default: false, description: "true when the item is subject to resale-restriction enforcement (tobacco, alcohol, infant formula and other controlled items)" }
      - { name: quantity_limit_per_visit, type: integer, source: input, default: null, description: "Maximum aggregate units of this product per Sale (one visit); null means unlimited", constraints: ">= 1 or null" }

  - name: Assortment
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store the allocation belongs to" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the allocated item" }
      - { name: shelf_block, type: string, source: input, description: "Planogram shelf block code inside the store (capacity-limited resource)", constraints: "1..8 chars" }
      - { name: facings, type: integer, source: input, description: "Facings consumed on the shelf block for the effective window", constraints: ">= 1" }
      - { name: supply_mode, type: enum, source: input, description: "WAREHOUSE (distribution-center supplied) | DSD (vendor direct store delivery)", constraints: "WAREHOUSE | DSD" }
      - { name: vendor_name, type: string, source: input, default: null, description: "DSD stocking vendor; REQUIRED when supply_mode == DSD, MUST be null when WAREHOUSE" }
      - { name: promo_allowance_bp, type: integer, source: input, default: 0, description: "Vendor promotional allowance in basis points of line extended cost; MUST be 0 when supply_mode == WAREHOUSE", constraints: "0..2000" }
      - { name: promo_window_start, type: datetime, source: input, default: null, description: "Inclusive start of the promotional allowance window" }
      - { name: promo_window_end, type: datetime, source: input, default: null, description: "EXCLUSIVE end of the promotional allowance window — allowance applies while start <= instant < end (half-open)" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the shelf allocation window" }
      - { name: effective_to, type: datetime, source: input, description: "INCLUSIVE end of the shelf allocation window — two allocations that merely touch at an endpoint DO overlap (closed interval)", constraints: ">= effective_from" }
      - { name: overseas_shipping_allowance_cents, type: integer, source: input, default: 0, description: "Appropriated-fund second-destination transportation allowance per unit; recorded on the sale line, never added to the price", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED", constraints: "ACTIVE | RETIRED" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the ringing store" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the sponsor whose privileges are used (the account charged)" }
      - { name: acting_delegation_id, type: string, source: input, default: null, description: "FK -> ShopperDelegation.id; null when the patron shops on their own card" }
      - { name: business_date, type: datetime, source: system, description: "Logical-clock instant stamped at sale creation; the date the sale is booked to" }
      - { name: tender_state, type: enum, source: system, default: OPEN, description: "Money dimension of the parallel state machine", constraints: "OPEN | TENDERED | VOIDED" }
      - { name: compliance_state, type: enum, source: system, default: CLEARED, description: "Compliance dimension of the parallel state machine; evolves independently of tender_state", constraints: "CLEARED | FLAGGED" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Number of SaleLine rows on this sale" }
      - { name: merchandise_cents, type: integer, source: computed, default: 0, description: "= sum(SaleLine.extended_cents)" }
      - { name: markup_total_cents, type: integer, source: computed, default: 0, description: "= sum(SaleLine.line_markup_cents); always 0 at a COMMISSARY store" }
      - { name: surcharge_total_cents, type: integer, source: computed, default: 0, description: "= sum(SaleLine.line_surcharge_cents) — rounded per line then summed, never rate-applied to the sale subtotal" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Always 0: commissary and exchange sales are tax-free" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "= merchandise_cents + markup_total_cents + surcharge_total_cents + tax_cents" }
      - { name: provisional_allowance_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL variant of calculations.vendor_promotional_allowance, refreshed on every line add" }
      - { name: settled_allowance_cents, type: integer, source: computed, default: null, description: "SETTLED variant of calculations.vendor_promotional_allowance, written once at tender" }
      - { name: allowance_variance_cents, type: integer, source: computed, default: null, description: "= settled_allowance_cents - provisional_allowance_cents; written at tender" }
      - { name: subsidized_shipping_cents, type: integer, source: computed, default: 0, description: "= sum(SaleLine.line_shipping_allowance_cents); appropriated-fund shipping subsidy recorded, not charged" }
      - { name: voided_reason, type: enum, source: system, default: null, description: "RESALE_VIOLATION | OPERATOR_ERROR | COMPLIANCE_HOLD | null", constraints: "RESALE_VIOLATION | OPERATOR_ERROR | COMPLIANCE_HOLD | null" }

  - name: SaleLine
    parent: Sale
    common_fields: false
    fields:
      - { name: sale_id, type: string, source: system, description: "FK -> Sale.id; the sale this line belongs to" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the item rung" }
      - { name: quantity, type: integer, source: input, description: "Units rung on this line", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit price from calculations.line_retail_price (cost at COMMISSARY, cost + markup at EXCHANGE)" }
      - { name: extended_cents, type: integer, source: computed, description: "= unit_price_cents * quantity" }
      - { name: line_markup_cents, type: integer, source: computed, default: 0, description: "= (unit_price_cents - product.unit_cost_cents) * quantity" }
      - { name: line_surcharge_cents, type: integer, source: computed, description: "= round_half_up(extended_cents * store.surcharge_rate_bp / 10000) — rounded at the line, before any summation" }
      - { name: line_allowance_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL vendor promotional allowance attributable to this line" }
      - { name: line_shipping_allowance_cents, type: integer, source: computed, default: 0, description: "= assortment.overseas_shipping_allowance_cents * quantity when store.region == OVERSEAS and supply_mode == WAREHOUSE, else 0" }
      - { name: restricted_units, type: integer, source: computed, default: 0, description: "= quantity when product.resale_restricted else 0" }

  - name: FundLedgerEntry
    parent: Store
    common_fields: false
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the fund-holding store" }
      - { name: fund, type: enum, source: system, description: "SURCHARGE (capital improvement fund) | DIVIDEND (exchange earnings destined for MWR)", constraints: "SURCHARGE | DIVIDEND" }
      - { name: entry_type, type: enum, source: system, description: "SURCHARGE_COLLECTION | SURCHARGE_REVERSAL | CAPITAL_OUTLAY | ALLOWANCE_CREDIT | ALLOWANCE_REVERSAL | DIVIDEND_TRANSFER", constraints: "SURCHARGE_COLLECTION | SURCHARGE_REVERSAL | CAPITAL_OUTLAY | ALLOWANCE_CREDIT | ALLOWANCE_REVERSAL | DIVIDEND_TRANSFER" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: credits positive, reversals and outlays negative" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Running balance of (store_id, fund) after this entry, ordered by created_at ASC then entry_type ASC" }
      - { name: source_ref_kind, type: enum, source: system, description: "SALE | CAPITAL_PROJECT | MWR_PROGRAM | SPECIAL_ORDER", constraints: "SALE | CAPITAL_PROJECT | MWR_PROGRAM | SPECIAL_ORDER" }
      - { name: source_ref_id, type: string, source: system, description: "Identifier of the originating record named by source_ref_kind; recorded for audit only and deliberately NOT enforced as a foreign key" }
      - { name: period_close_index, type: integer, source: system, description: "Value of Store.period_close_index when the entry was written" }

  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store whose surcharge fund pays for the project" }
      - { name: title, type: string, source: input, description: "Capital project title", constraints: "1..160 chars" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Construction/equipment request excluding contingency", constraints: ">= 1" }
      - { name: contingency_bp, type: integer, source: computed, default: 0, description: "Tier selected from requested_amount_cents ONLY (never from the contingency-inclusive obligation)" }
      - { name: contingency_cents, type: integer, source: computed, default: 0, description: "= round_half_up(requested_amount_cents * contingency_bp / 10000)" }
      - { name: obligation_cents, type: integer, source: computed, default: 0, description: "= requested_amount_cents + contingency_cents; reserved against the surcharge fund while state == APPROVED" }
      - { name: outlay_cents, type: integer, source: computed, default: null, description: "Actual amount disbursed at close; <= obligation_cents" }
      - { name: state, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | RETURNED_FOR_REVISION | AWAITING_FUNDS | APPROVED | REJECTED | CLOSED", constraints: "DRAFT | SUBMITTED | RETURNED_FOR_REVISION | AWAITING_FUNDS | APPROVED | REJECTED | CLOSED" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of times the project has re-entered SUBMITTED from RETURNED_FOR_REVISION" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the SurchargeFundController that last submitted the project" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the MwrBoardOfficer that last decided the project" }
      - { name: closed_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the SurchargeFundController that closed the project; MUST differ from submitted_by_user_id" }

  - name: MwrProgram
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the exchange whose dividend funds this program" }
      - { name: name, type: string, source: input, description: "Morale/welfare/recreation program name" }
      - { name: priority_rank, type: integer, source: input, description: "Waterfall order; lower rank is filled first; ties broken by created_at ASC", constraints: ">= 1" }
      - { name: funding_ceiling_cents, type: integer, source: input, description: "Lifetime funding ceiling for the program", constraints: ">= 1" }
      - { name: ytd_funded_cents, type: integer, source: computed, default: 0, description: "= sum(-1 * FundLedgerEntry.amount_cents where entry_type == DIVIDEND_TRANSFER AND source_ref_id == this.id)" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE (participates in the dividend waterfall) | SUSPENDED (skipped)", constraints: "ACTIVE | SUSPENDED" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the ordering site" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the ordering patron" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the ordered item" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: route, type: enum, source: system, default: null, description: "LOCAL_FILL | OVERSEAS_SHIP | null (not yet routed)", constraints: "LOCAL_FILL | OVERSEAS_SHIP | null" }
      - { name: state, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | LOCAL_FILL_PENDING | OVERSEAS_SHIP_PENDING | FULFILLED | CANCELLED", constraints: "SUBMITTED | LOCAL_FILL_PENDING | OVERSEAS_SHIP_PENDING | FULFILLED | CANCELLED" }
      - { name: billable_weight_kg, type: integer, source: computed, default: 0, description: "= ceil(product.unit_weight_grams * quantity / 1000)" }
      - { name: gross_ship_cents, type: integer, source: computed, default: 0, description: "= billable_weight_kg * SHIP_RATE_CENTS_PER_KG[store.region]" }
      - { name: patron_share_cents, type: integer, source: computed, default: 0, description: "Patron's co-payment share of the shipping cost, by route" }
      - { name: shipping_allowance_cents, type: integer, source: computed, default: 0, description: "Appropriated-fund allowance committed for this order; released on cancel" }
      - { name: cancelled_reason, type: enum, source: system, default: null, description: "PATRON_REQUEST | ASSORTMENT_RETIRED | null", constraints: "PATRON_REQUEST | ASSORTMENT_RETIRED | null" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Patron
    initial_state: "card_status=VALID x resale_watch_status=CLEAR"
    terminal_states: ["card_status=REVOKED"]
    note: |
      PARALLEL DIMENSIONS on one row: card_status (VALID | SUSPENDED | REVOKED)
      and resale_watch_status (CLEAR | WATCH | RESTRICTED) advance independently.
      A patron can be card_status=SUSPENDED while resale_watch_status=CLEAR, and
      resale_watch_status=RESTRICTED while card_status=VALID. Transitions below
      carry a `dimension:` marker naming which axis they move.
    transitions:
      - from: VALID
        to: SUSPENDED
        dimension: card_status
        trigger: "POST /patrons/{id}/card-status with action=SUSPEND"
        actor: ComplianceOfficer
        preconditions: ["card_status == VALID"]
        side_effects:
          - "suspension_reason = ADMIN_ACTION"
          - "CASCADE hop 1: every Patron D where D.sponsor_patron_id == this.id AND D.card_status == VALID -> D.card_status = SUSPENDED, D.suspension_reason = SPONSOR_SUSPENDED"
          - "CASCADE hop 2 (caused by hop 1): every ShopperDelegation G where G.delegate_patron_id == D.id AND G.status == ACTIVE -> G.status = SUSPENDED_BY_SPONSOR"
          - "CASCADE hop 3 (caused by hop 2): every Sale S where S.acting_delegation_id == G.id AND S.tender_state == OPEN -> S.compliance_state = FLAGGED"
          - "version += 1 on every entity mutated above"
      - from: SUSPENDED
        to: VALID
        dimension: card_status
        trigger: "POST /patrons/{id}/card-status with action=REINSTATE"
        actor: ComplianceOfficer
        preconditions: ["card_status == SUSPENDED"]
        side_effects:
          - "suspension_reason = null"
          - "COMPENSATION hop 1: every Patron D where D.sponsor_patron_id == this.id AND D.card_status == SUSPENDED AND D.suspension_reason == SPONSOR_SUSPENDED -> D.card_status = VALID, D.suspension_reason = null"
          - "COMPENSATION hop 2 (caused by hop 1): every ShopperDelegation G where G.delegate_patron_id == D.id AND G.status == SUSPENDED_BY_SPONSOR -> G.status = ACTIVE"
          - "COMPENSATION hop 3 (caused by hop 2): every Sale S where S.acting_delegation_id == G.id AND S.tender_state == OPEN AND S.compliance_state == FLAGGED -> S.compliance_state = CLEARED"
          - "version += 1 on every entity mutated above"
      - from: VALID
        to: SUSPENDED
        dimension: card_status
        trigger: "system — resale-risk recompute after POST /sales/{id}/lines or POST /sales/{id}/tender finds recent_sales_risk_score >= 80"
        actor: system
        preconditions: ["card_status == VALID", "recent_sales_risk_score >= 80 under the LAST_5_SALES variant"]
        side_effects:
          - "suspension_reason = RISK_THRESHOLD"
          - "same three cascade hops as the ADMIN_ACTION suspension"
        note: "Named VALID_to_SUSPENDED_RISK for grounds references."
      - from: SUSPENDED
        to: REVOKED
        dimension: card_status
        trigger: "POST /patrons/{id}/card-status with action=REVOKE"
        actor: ComplianceOfficer
        preconditions: ["card_status == SUSPENDED"]
        side_effects:
          - "suspension_reason unchanged"
          - "every ShopperDelegation G where G.sponsor_patron_id == this.id OR G.delegate_patron_id == this.id, with G.status IN {ACTIVE, SUSPENDED_BY_SPONSOR} -> G.status = REVOKED"
          - "resale_watch_status frozen at its current value; no further risk recompute is applied to a REVOKED card"
      - from: CLEAR
        to: WATCH
        dimension: resale_watch_status
        trigger: "system — resale-risk recompute finds resale_risk_score >= 60 and < 85"
        actor: system
        preconditions: ["card_status != REVOKED"]
        side_effects: ["resale_watch_status = WATCH", "version += 1"]
      - from: WATCH
        to: RESTRICTED
        dimension: resale_watch_status
        trigger: "system — resale-risk recompute finds resale_risk_score >= 85"
        actor: system
        preconditions: ["card_status != REVOKED"]
        side_effects: ["resale_watch_status = RESTRICTED", "version += 1", "subsequent POST /sales/{id}/lines for a resale_restricted product is rejected with ERR_RESTRICTED_ITEM_BLOCKED_BY_WATCH"]
      - from: RESTRICTED
        to: CLEAR
        dimension: resale_watch_status
        trigger: "POST /patrons/{id}/compliance-review with decision=CLEAR_WATCH"
        actor: ComplianceOfficer
        preconditions: ["resale_watch_status IN {WATCH, RESTRICTED}"]
        side_effects:
          - "manual_strike_count = 0"
          - "resale_risk_score and recent_sales_risk_score recomputed; resale_watch_status re-derived from the fresh score (CLEAR when < 60)"
          - "every Sale S where S.patron_id == this.id AND S.tender_state == OPEN AND S.compliance_state == FLAGGED -> S.compliance_state = CLEARED, S.version += 1"
        note: "Cyclic: CLEAR -> WATCH -> RESTRICTED -> CLEAR. Also covers WATCH -> CLEAR."
      - from: CLEAR
        to: WATCH
        dimension: resale_watch_status
        trigger: "POST /patrons/{id}/compliance-review with decision=CONFIRM_STRIKE"
        actor: ComplianceOfficer
        preconditions: ["card_status != REVOKED"]
        side_effects:
          - "manual_strike_count += 1"
          - "resale_risk_score recomputed (each strike adds 25); resale_watch_status re-derived from the fresh score"
          - "every Sale S where S.patron_id == this.id AND S.tender_state == OPEN -> S.compliance_state = FLAGGED, S.version += 1"
        note: "Named CLEAR_to_WATCH_STRIKE for grounds references."

  - entity: Sale
    initial_state: "tender_state=OPEN x compliance_state=CLEARED"
    terminal_states: ["tender_state=VOIDED"]
    note: |
      PARALLEL DIMENSIONS: tender_state (OPEN | TENDERED | VOIDED) is the money
      axis; compliance_state (CLEARED | FLAGGED) is the compliance axis and is
      never written by a sale-scoped call: it moves only as a side effect of a
      Patron card-status cascade (delegation-mediated) or of a Patron
      compliance-review decision (patron-mediated, delegation-free).
    transitions:
      - from: OPEN
        to: TENDERED
        dimension: tender_state
        trigger: "POST /sales/{id}/tender"
        actor: StoreCashier
        preconditions:
          - "tender_state == OPEN"
          - "compliance_state == CLEARED"
          - "line_count >= 1"
          - "Patron(sale.patron_id).card_status == VALID"
          - "when acting_delegation_id is not null: ShopperDelegation.status == ACTIVE AND valid_from <= sale.business_date < valid_to AND total_due_cents <= per_sale_spend_cap_cents"
          - "collected_tax_cents (if supplied) == 0"
        side_effects:
          - "step 1: settled_allowance_cents = SETTLED variant of calculations.vendor_promotional_allowance evaluated at the tender instant; allowance_variance_cents = settled_allowance_cents - provisional_allowance_cents"
          - "step 2: append FundLedgerEntry{fund: SURCHARGE, entry_type: SURCHARGE_COLLECTION, amount_cents: +surcharge_total_cents, source_ref_kind: SALE, source_ref_id: sale.id}"
          - "step 3: when settled_allowance_cents > 0, append FundLedgerEntry{fund: DIVIDEND, entry_type: ALLOWANCE_CREDIT, amount_cents: +settled_allowance_cents, source_ref_kind: SALE, source_ref_id: sale.id}"
          - "CASCADE hop 1 (caused by steps 2-3): Store.surcharge_fund_balance_cents and Store.dividend_fund_balance_cents recomputed from the ledger"
          - "CASCADE hop 2 (caused by hop 1): Store.fund_posture re-derived from surcharge_available_cents"
          - "CASCADE hop 3 (caused by hop 2): when the new fund_posture == UNRESTRICTED, every CapitalProject of this store in state AWAITING_FUNDS, walked in created_at ASC order, is auto-transitioned to APPROVED while obligation_cents <= surcharge_available_cents, each obligation raising Store.surcharge_obligated_cents"
          - "CASCADE hop 4 (caused by hop 3): Store.fund_posture re-derived again after the obligations are booked"
          - "Patron.resale_risk_score / recent_sales_risk_score recomputed; resale_watch_status and card_status re-derived (may fire the RISK_THRESHOLD suspension)"
          - "Store.version += 1, Sale.version += 1"
      - from: OPEN
        to: VOIDED
        dimension: tender_state
        trigger: "POST /sales/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["tender_state IN {OPEN, TENDERED}"]
        side_effects:
          - "voided_reason set from the request"
          - "no ledger entry is written (nothing was ever collected on an OPEN sale)"
          - "Patron risk scores recomputed with this sale excluded from every input set"
      - from: TENDERED
        to: VOIDED
        dimension: tender_state
        trigger: "POST /sales/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["tender_state IN {OPEN, TENDERED}"]
        side_effects:
          - "voided_reason set from the request"
          - "append FundLedgerEntry{fund: SURCHARGE, entry_type: SURCHARGE_REVERSAL, amount_cents: -surcharge_total_cents, source_ref_kind: SALE, source_ref_id: sale.id}"
          - "when settled_allowance_cents > 0, append FundLedgerEntry{fund: DIVIDEND, entry_type: ALLOWANCE_REVERSAL, amount_cents: -settled_allowance_cents, source_ref_kind: SALE, source_ref_id: sale.id}"
          - "Store.surcharge_fund_balance_cents, dividend_fund_balance_cents and fund_posture recomputed; the surcharge balance returns exactly to its pre-tender value (compensating invariant, no drift)"
          - "Patron risk scores recomputed with this sale excluded"
          - "Store.version += 1, Sale.version += 1"
      - from: CLEARED
        to: FLAGGED
        dimension: compliance_state
        trigger: "system — cascade hop 3 of a Patron suspension reaching this sale through its acting delegation"
        actor: system
        preconditions: ["tender_state == OPEN"]
        side_effects: ["compliance_state = FLAGGED", "tender is blocked with ERR_SALE_COMPLIANCE_FLAGGED until cleared", "version += 1"]
      - from: FLAGGED
        to: CLEARED
        dimension: compliance_state
        trigger: "system — compensation hop 3 of a Patron reinstatement reaching this sale through its acting delegation"
        actor: system
        preconditions: ["tender_state == OPEN"]
        side_effects: ["compliance_state = CLEARED", "version += 1"]
      - from: CLEARED
        to: FLAGGED
        dimension: compliance_state
        trigger: "POST /patrons/{id}/compliance-review with decision=CONFIRM_STRIKE — every OPEN sale of that patron is flagged for review"
        actor: ComplianceOfficer
        preconditions: ["tender_state == OPEN", "Sale.patron_id == the reviewed patron"]
        side_effects: ["compliance_state = FLAGGED", "tender is blocked with ERR_SALE_COMPLIANCE_FLAGGED until cleared", "version += 1"]
        note: |
          Named CLEARED_to_FLAGGED_STRIKE for grounds references. This path is
          keyed on Sale.patron_id and touches NO delegation, so a flagged sale can
          coexist with an ACTIVE acting delegation — the only arrangement in which
          the priority-27 compliance gate is observable ahead of the priority-23
          delegation gate.
      - from: FLAGGED
        to: CLEARED
        dimension: compliance_state
        trigger: "POST /patrons/{id}/compliance-review with decision=CLEAR_WATCH — every OPEN sale of that patron is un-flagged"
        actor: ComplianceOfficer
        preconditions: ["tender_state == OPEN", "Sale.patron_id == the reviewed patron"]
        side_effects: ["compliance_state = CLEARED", "version += 1"]
        note: "Named FLAGGED_to_CLEARED_STRIKE for grounds references."

  - entity: ShopperDelegation
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /shopper-delegations — a delegation for the same delegate_patron_id from a DIFFERENT sponsor whose window overlaps"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
          - "incoming.delegate_patron_id == this.delegate_patron_id"
          - "incoming.sponsor_patron_id != this.sponsor_patron_id"
          - "[incoming.valid_from, incoming.valid_to) intersects [this.valid_from, this.valid_to)"
        side_effects:
          - "superseded_by_delegation_id = the new delegation's id"
          - "every Sale S where S.acting_delegation_id == this.id AND S.tender_state == OPEN -> S.compliance_state = FLAGGED"
          - "version += 1"
        note: "A delegate may only shop for one sponsor at a time, so the newer grant legitimately displaces the older one — this is the CREATE-with-supersede pattern guarded by OCC in §1.2.1."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /shopper-delegations/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: ["status IN {ACTIVE, SUSPENDED_BY_SPONSOR}"]
        side_effects:
          - "every Sale S where S.acting_delegation_id == this.id AND S.tender_state == OPEN -> S.compliance_state = FLAGGED"
          - "version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /stores/{id}/close-period sweep"
        actor: system
        preconditions: ["status == ACTIVE", "valid_to <= logical clock now"]
        side_effects: ["version += 1"]
      - from: ACTIVE
        to: SUSPENDED_BY_SPONSOR
        trigger: "system — cascade hop 2 of a Patron suspension"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["version += 1", "cascade continues to this delegation's OPEN sales"]
      - from: SUSPENDED_BY_SPONSOR
        to: ACTIVE
        trigger: "system — compensation hop 2 of a Patron reinstatement"
        actor: system
        preconditions: ["status == SUSPENDED_BY_SPONSOR"]
        side_effects: ["version += 1", "compensation continues to this delegation's OPEN flagged sales"]

  - entity: Assortment
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /assortments/{id}/retire"
        actor: AssortmentPlanner
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "facings released: the shelf_block aggregate no longer counts this allocation"
          - "CASCADE hop 1: every SpecialOrder O where O.store_id == this.store_id AND O.product_id == this.product_id AND O.state == OVERSEAS_SHIP_PENDING -> O.state = CANCELLED, O.cancelled_reason = ASSORTMENT_RETIRED"
          - "CASCADE hop 2 (caused by hop 1): Store.shipping_allowance_committed_cents recomputed, releasing each cancelled order's shipping_allowance_cents"
          - "CASCADE hop 3 (caused by hop 2): Store.version += 1"
          - "Assortment.version += 1"

  - entity: CapitalProject
    initial_state: DRAFT
    terminal_states: [REJECTED, CLOSED]
    note: "CYCLIC (SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED) and BRANCHING (SUBMITTED forks into APPROVED | AWAITING_FUNDS | RETURNED_FOR_REVISION | REJECTED with divergent side-effect sets)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /capital-projects/{id}/submit"
        actor: SurchargeFundController
        preconditions: ["state IN {DRAFT, RETURNED_FOR_REVISION}"]
        side_effects: ["submitted_by_user_id = X-User-ID of the caller", "version += 1"]
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /capital-projects/{id}/submit"
        actor: SurchargeFundController
        preconditions: ["state IN {DRAFT, RETURNED_FOR_REVISION}"]
        side_effects: ["revision_count += 1", "submitted_by_user_id = X-User-ID of the caller", "version += 1"]
        note: "Closes the cycle; revision_count counts only re-submissions."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /capital-projects/{id}/decision with decision=APPROVE"
        actor: MwrBoardOfficer
        preconditions:
          - "state == SUBMITTED"
          - "Store(this.store_id).fund_posture == UNRESTRICTED"
          - "obligation_cents <= Store.surcharge_fund_balance_cents - Store.surcharge_obligated_cents"
        side_effects:
          - "decided_by_user_id = X-User-ID of the caller"
          - "Store.surcharge_obligated_cents += obligation_cents"
          - "Store.fund_posture re-derived (may drop to CONSTRAINED or FROZEN)"
          - "Store.version += 1, CapitalProject.version += 1"
      - from: SUBMITTED
        to: AWAITING_FUNDS
        trigger: "POST /capital-projects/{id}/decision with decision=APPROVE"
        actor: MwrBoardOfficer
        preconditions:
          - "state == SUBMITTED"
          - "Store.fund_posture != UNRESTRICTED OR obligation_cents > Store.surcharge_fund_balance_cents - Store.surcharge_obligated_cents"
        side_effects:
          - "decided_by_user_id = X-User-ID of the caller"
          - "NO obligation is booked; Store.surcharge_obligated_cents unchanged"
        note: "Divergent branch of the same trigger: an approval the fund cannot carry parks the project instead of erroring."
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /capital-projects/{id}/decision with decision=RETURN"
        actor: MwrBoardOfficer
        preconditions: ["state == SUBMITTED"]
        side_effects: ["decided_by_user_id = X-User-ID of the caller", "submitted_by_user_id cleared to null", "version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /capital-projects/{id}/decision with decision=REJECT"
        actor: MwrBoardOfficer
        preconditions: ["state == SUBMITTED"]
        side_effects: ["decided_by_user_id = X-User-ID of the caller", "no obligation booked; terminal", "version += 1"]
      - from: AWAITING_FUNDS
        to: APPROVED
        trigger: "system — Store.fund_posture recompute after POST /sales/{id}/tender or POST /stores/{id}/close-period"
        actor: system
        preconditions:
          - "state == AWAITING_FUNDS"
          - "Store.fund_posture == UNRESTRICTED after the recompute"
          - "obligation_cents <= Store.surcharge_fund_balance_cents - Store.surcharge_obligated_cents at the moment this project is walked (created_at ASC order)"
        side_effects:
          - "Store.surcharge_obligated_cents += obligation_cents"
          - "Store.fund_posture re-derived again"
          - "Store.version += 1, CapitalProject.version += 1"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /capital-projects/{id}/close"
        actor: SurchargeFundController
        preconditions:
          - "state == APPROVED"
          - "outlay_cents <= obligation_cents"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "outlay_cents recorded, closed_by_user_id = X-User-ID of the caller"
          - "append FundLedgerEntry{fund: SURCHARGE, entry_type: CAPITAL_OUTLAY, amount_cents: -outlay_cents, source_ref_kind: CAPITAL_PROJECT, source_ref_id: project.id}"
          - "Store.surcharge_obligated_cents -= obligation_cents (full release, including the unspent contingency)"
          - "Store.surcharge_fund_balance_cents recomputed from the ledger; Store.fund_posture re-derived"
          - "Store.version += 1, CapitalProject.version += 1"

  - entity: SpecialOrder
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, CANCELLED]
    note: "FORK-JOIN: SUBMITTED forks into LOCAL_FILL_PENDING or OVERSEAS_SHIP_PENDING with divergent side-effect sets, and both branches join at FULFILLED via the close-period checkpoint."
    transitions:
      - from: SUBMITTED
        to: LOCAL_FILL_PENDING
        trigger: "POST /special-orders/{id}/route with route=LOCAL_FILL"
        actor: StoreCashier
        preconditions:
          - "state == SUBMITTED"
          - "an Assortment with status == ACTIVE exists for (store_id, product_id)"
        side_effects:
          - "route = LOCAL_FILL; billable_weight_kg computed; gross_ship_cents = 0; patron_share_cents = 0; shipping_allowance_cents = 0"
          - "Store.shipping_allowance_committed_cents unchanged"
          - "version += 1"
      - from: SUBMITTED
        to: OVERSEAS_SHIP_PENDING
        trigger: "POST /special-orders/{id}/route with route=OVERSEAS_SHIP"
        actor: StoreCashier
        preconditions:
          - "state == SUBMITTED"
          - "Store.region IN {OVERSEAS, DEPLOYED} (else ERR_ROUTE_NOT_AVAILABLE_IN_REGION)"
          - "an Assortment with status == ACTIVE exists for (store_id, product_id)"
        side_effects:
          - "route = OVERSEAS_SHIP; billable_weight_kg, gross_ship_cents, patron_share_cents and shipping_allowance_cents computed per calculations.special_order_shipping_allowance"
          - "Store.shipping_allowance_committed_cents += shipping_allowance_cents"
          - "Store.version += 1, SpecialOrder.version += 1"
      - from: LOCAL_FILL_PENDING
        to: FULFILLED
        trigger: "system — POST /stores/{id}/close-period sweep"
        actor: system
        preconditions: ["state IN {LOCAL_FILL_PENDING, OVERSEAS_SHIP_PENDING}"]
        side_effects: ["version += 1", "Store.shipping_allowance_committed_cents unchanged (FULFILLED orders keep their commitment)"]
      - from: OVERSEAS_SHIP_PENDING
        to: FULFILLED
        trigger: "system — POST /stores/{id}/close-period sweep"
        actor: system
        preconditions: ["state IN {LOCAL_FILL_PENDING, OVERSEAS_SHIP_PENDING}"]
        side_effects: ["version += 1", "Store.shipping_allowance_committed_cents unchanged"]
      - from: OVERSEAS_SHIP_PENDING
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: StoreCashier
        preconditions: ["state IN {SUBMITTED, LOCAL_FILL_PENDING, OVERSEAS_SHIP_PENDING}"]
        side_effects:
          - "cancelled_reason set from the request"
          - "Store.shipping_allowance_committed_cents -= shipping_allowance_cents (exact release; the committed total returns to its pre-route value)"
          - "Store.version += 1, SpecialOrder.version += 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: StoreCashier
        preconditions: ["state IN {SUBMITTED, LOCAL_FILL_PENDING, OVERSEAS_SHIP_PENDING}"]
        side_effects: ["cancelled_reason set from the request", "shipping_allowance_cents is already 0, so Store.shipping_allowance_committed_cents is unchanged", "version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: delegation-create-stale-delegate
    parent_entity: Patron
    write_endpoint: "POST /shopper-delegations"
    occ_field: "expected_delegate_patron_version"
    description: |
      Creating a ShopperDelegation for a delegate whose Patron.version has
      advanced since the client last read it is rejected. This captures the
      case where another grant for the same delegate has already been written
      and legitimately superseded the delegate's prior delegation, so the
      current writer's view of the delegate is stale.
    error_id: ERR_STALE_PATRON_VERSION
    http_status: 412
  - rule_id: assortment-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /assortments"
    occ_field: "expected_store_version"
    description: |
      Creating an Assortment against a Store whose version has advanced since
      the client last read it is rejected. Shelf-block facings are a
      store-level aggregate, so an allocation written from a stale view of the
      store may consume capacity that another allocation already claimed.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Conventions used by every formula below:
#   * All money is integer cents. All rates are integer basis points (bp).
#   * round_half_up(x) rounds a non-negative rational to the nearest integer,
#     ties away from zero (0.5 -> 1).
#   * "logical clock now" is the instant held by POST /_clock/set_current_utc,
#     defaulting to 2026-08-01T00:00:00Z before any clock call.
#   * No calculation, selector, ordering or tie-break in this scaffold reads
#     any entity `id`; where a precise fallback is needed the key is
#     `created_at ASC`.
calculations:
  - name: governing_assortment_selector
    trigger: "Whenever a SaleLine is priced (POST /sales/{id}/lines) or a SpecialOrder is routed (POST /special-orders/{id}/route)"
    algorithm: selector_policy
    formula: |
      candidates = Assortment rows where
          store_id   == context.store_id
        AND product_id == context.product_id
        AND status     == ACTIVE
        AND effective_from <= reference_instant <= effective_to     # CLOSED interval
      # reference_instant = Sale.business_date for sale lines,
      #                     logical clock now for special-order routing.
      ranking   = ORDER BY effective_from DESC, created_at DESC     # newest window wins
      governing = first(ranking)
      if candidates is empty: reject the operation with ERR_ITEM_NOT_IN_ASSORTMENT
    input_set: "Assortment rows of the (store, product) pair with status == ACTIVE whose closed effective window contains the reference instant; RETIRED rows are never candidates."
    constants: {}
    precision: "exact set operations; no arithmetic"
    variants: []
    note: "Eligibility filter, ranking expression, tie-break and empty-set fallback are all pinned here so no other rule needs to re-derive them."

  - name: line_retail_price
    trigger: "POST /sales/{id}/lines (once per line, at creation)"
    algorithm: tiered_pricing
    formula: |
      product = Product(line.product_id)
      store   = Store(sale.store_id)
      if store.channel == COMMISSARY:
          unit_price_cents = product.unit_cost_cents            # NO markup, ever
      else:  # EXCHANGE
          unit_price_cents = product.unit_cost_cents
                           + round_half_up(product.unit_cost_cents * store.exchange_markup_bp / 10000)
      extended_cents     = unit_price_cents * quantity
      line_markup_cents  = (unit_price_cents - product.unit_cost_cents) * quantity
      # Appropriated-fund second-destination transportation allowance is
      # RECORDED, never priced into the item:
      governing = calculations.governing_assortment_selector(store, product, sale.business_date)
      if store.region == OVERSEAS and governing.supply_mode == WAREHOUSE:
          line_shipping_allowance_cents = governing.overseas_shipping_allowance_cents * quantity
      else:
          line_shipping_allowance_cents = 0
      restricted_units = quantity if product.resale_restricted else 0
    input_set: "The single line being created; the governing Assortment resolved by calculations.governing_assortment_selector."
    constants: {}
    precision: "integer cents; the markup is rounded per UNIT before multiplying by quantity"
    variants: []

  - name: sale_surcharge_rollup
    trigger: "POST /sales/{id}/lines (after the line is priced) and re-verified at POST /sales/{id}/tender"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round at the line, THEN sum. The alternative
      # (sum extended_cents across lines, then apply surcharge_rate_bp once)
      # is FORBIDDEN and produces a different cent total whenever two or more
      # lines each carry a .5 remainder.
      for each line L of the sale (created_at ASC):
          L.line_surcharge_cents = round_half_up(L.extended_cents * store.surcharge_rate_bp / 10000)
      merchandise_cents     = sum(L.extended_cents)
      markup_total_cents    = sum(L.line_markup_cents)
      surcharge_total_cents = sum(L.line_surcharge_cents)         # <- per-line rounded
      tax_cents             = 0                                   # tax-free sales, always
      total_due_cents       = merchandise_cents + markup_total_cents + surcharge_total_cents + tax_cents
      subsidized_shipping_cents = sum(L.line_shipping_allowance_cents)
      line_count            = count(L)
    input_set: "Every SaleLine of the sale (a sale line is never deleted; a mistaken sale is voided whole)."
    constants: {}
    precision: "2-decimal money held as integer cents; round_half_up applied once per line and never again"
    variants: []

  - name: vendor_promotional_allowance
    trigger: "PROVISIONAL on every POST /sales/{id}/lines; SETTLED once on POST /sales/{id}/tender"
    algorithm: forward_looking
    formula: |
      for each line L of the sale:
          g = calculations.governing_assortment_selector(store, L.product, sale.business_date)
          if g.supply_mode == DSD and g.promo_allowance_bp > 0:
              candidate(L) = round_half_up(L.extended_cents * g.promo_allowance_bp / 10000)
          else:
              candidate(L) = 0
      # Window test is HALF-OPEN: start <= instant < end.
      in_window(instant, g) = (g.promo_window_start is not null
                               and g.promo_window_start <= instant < g.promo_window_end)
      provisional_allowance_cents = sum over lines of ( candidate(L) if in_window(sale.business_date, g) else 0 )
      settled_allowance_cents     = sum over lines of ( candidate(L) if in_window(tender_instant,     g) else 0 )
      allowance_variance_cents    = settled_allowance_cents - provisional_allowance_cents
      # Only settled_allowance_cents ever reaches the DIVIDEND fund.
    input_set: "Every SaleLine of the sale whose governing Assortment has supply_mode == DSD and promo_allowance_bp > 0."
    constants: {}
    precision: "round_half_up per line, then sum (same pinned order as sale_surcharge_rollup)"
    variants:
      - name: PROVISIONAL
        when: "Recomputed on each line add, and stored in Sale.provisional_allowance_cents"
        difference: "Tests the promotional window against Sale.business_date — the forward-looking claim that the allowance will be filed for the day the sale was booked."
      - name: SETTLED
        when: "Computed once at tender, stored in Sale.settled_allowance_cents, and the only variant that posts to the DIVIDEND fund"
        difference: "Tests the promotional window against the logical clock instant AT TENDER — the chronological claim that only a claim filed while the vendor window is open is collectible. When the clock has advanced past promo_window_end between line add and tender, SETTLED is 0 while PROVISIONAL is positive."

  - name: patron_resale_risk_score
    trigger: "Recomputed after POST /sales/{id}/lines, POST /sales/{id}/tender, POST /sales/{id}/void and POST /patrons/{id}/compliance-review"
    algorithm: weighted_scoring
    formula: |
      score(input_sales) = min( 100,
            RESTRICTED_UNIT_WEIGHT * sum(SaleLine.restricted_units over input_sales)
          + STRIKE_WEIGHT * ( count(S in input_sales where S.compliance_state == FLAGGED)
                              + patron.manual_strike_count ) )
      # Watch axis, derived from the ROLLING_30D score:
      resale_watch_status = RESTRICTED if resale_risk_score >= 85
                            else WATCH  if resale_risk_score >= 60
                            else CLEAR
      # Card axis, derived from the LAST_5_SALES score:
      if recent_sales_risk_score >= 80 and card_status == VALID:
          card_status = SUSPENDED, suspension_reason = RISK_THRESHOLD (cascades)
    input_set: "Sales of the patron with tender_state IN {OPEN, TENDERED}; VOIDED sales are excluded from BOTH variants. The current OPEN sale is included, so a line add moves the score immediately."
    constants:
      RESTRICTED_UNIT_WEIGHT: 12
      STRIKE_WEIGHT: 25
      WATCH_THRESHOLD: 60
      RESTRICTED_THRESHOLD: 85
      CARD_SUSPEND_THRESHOLD: 80
      ROLLING_WINDOW_DAYS: 30
    precision: "integer score clamped to 0..100; thresholds are inclusive (>=)"
    variants:
      - name: ROLLING_30D
        when: "Writes Patron.resale_risk_score and drives resale_watch_status"
        difference: "Input set filtered by age: business_date >= (logical clock now - 30 days) AND business_date <= logical clock now, with no cap on how many sales enter."
      - name: LAST_5_SALES
        when: "Writes Patron.recent_sales_risk_score and drives the RISK_THRESHOLD card suspension"
        difference: "Input set filtered by rank, not age: the 5 most recent qualifying sales ordered by business_date DESC, then created_at DESC. A sale older than 30 days still counts, and a 6th sale inside the window does not."

  - name: capital_contingency_obligation
    trigger: "POST /capital-projects (once, at creation; requested_amount_cents is immutable afterwards)"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER — the tier is selected from the
      # CONTINGENCY-FREE requested amount, never from the obligation that
      # already contains the contingency. Selecting the tier from
      # obligation_cents is circular and FORBIDDEN.
      if   requested_amount_cents <  TIER_1_CEILING_CENTS: contingency_bp = TIER_1_BP
      elif requested_amount_cents <  TIER_2_CEILING_CENTS: contingency_bp = TIER_2_BP
      else:                                                contingency_bp = TIER_3_BP
      contingency_cents = round_half_up(requested_amount_cents * contingency_bp / 10000)
      obligation_cents  = requested_amount_cents + contingency_cents
    input_set: "The single project being created."
    constants:
      TIER_1_CEILING_CENTS: 500000
      TIER_2_CEILING_CENTS: 2000000
      TIER_1_BP: 1000
      TIER_2_BP: 700
      TIER_3_BP: 500
    precision: "integer cents, round_half_up once"
    variants: []

  - name: special_order_shipping_allowance
    trigger: "POST /special-orders/{id}/route"
    algorithm: waterfall_allocation
    formula: |
      billable_weight_kg = ceil(product.unit_weight_grams * quantity / 1000)
      rate = SHIP_RATE_CENTS_PER_KG[store.region]        # CONUS 0, OVERSEAS 210, DEPLOYED 340
      if route == LOCAL_FILL:
          gross_ship_cents = 0
          patron_share_cents = 0
          shipping_allowance_cents = 0
      else:  # OVERSEAS_SHIP
          gross_ship_cents   = billable_weight_kg * rate
          patron_share_cents = round_half_up(gross_ship_cents * PATRON_SHARE_BP / 10000)
          shipping_allowance_cents = min( ALLOWANCE_CAP_CENTS,
                                          max( 0, gross_ship_cents - patron_share_cents ) )
    input_set: "The single special order being routed, its product, and its store's region."
    constants:
      SHIP_RATE_CENTS_PER_KG_CONUS: 0
      SHIP_RATE_CENTS_PER_KG_OVERSEAS: 210
      SHIP_RATE_CENTS_PER_KG_DEPLOYED: 340
      PATRON_SHARE_BP: 2500
      ALLOWANCE_CAP_CENTS: 15000
    precision: "integer cents; ceil on weight, round_half_up on the patron share, then nested min/max"
    variants: []

  - name: dividend_waterfall_distribution
    trigger: "POST /stores/{id}/close-period"
    algorithm: waterfall_allocation
    formula: |
      remaining = Store.dividend_fund_balance_cents      # measured BEFORE any transfer
      candidates = MwrProgram rows where store_id == store.id
                     AND status == ACTIVE
                     AND ytd_funded_cents < funding_ceiling_cents
      order      = ORDER BY priority_rank ASC, created_at ASC
      for program in order:
          if remaining <= 0: break
          headroom = program.funding_ceiling_cents - program.ytd_funded_cents
          grant    = min(remaining, headroom)
          if grant > 0:
              append FundLedgerEntry{ fund: DIVIDEND, entry_type: DIVIDEND_TRANSFER,
                                      amount_cents: -grant, source_ref_kind: MWR_PROGRAM,
                                      source_ref_id: program.id }
              program.ytd_funded_cents += grant
              remaining -= grant
      # Empty candidate set or leftover after every ceiling is reached:
      # `remaining` simply stays in the dividend fund. No error, no entry.
    input_set: "ACTIVE MwrPrograms of this store with headroom below their ceiling; SUSPENDED programs and fully funded programs are skipped entirely."
    constants: {}
    precision: "integer cents; no rounding is possible because every grant is a min of two integers"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order)
# =============================================================================
# Domain priority doctrine: authentication -> authorization -> path existence
# -> request schema -> body existence -> field-consistency -> uniqueness ->
# optimistic concurrency -> state preconditions -> COMPLIANCE/SAFETY ->
# temporal -> referential -> capacity -> FISCAL -> segregation of duties.
# Compliance outranks referential and fiscal checks: a patron who may not buy
# an item is told so before the system discusses shelf assortment or money.
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, non-empty, and X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The X-User-Role is listed in the called endpoint's `roles:` in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "When X-User-Role == Patron, X-User-ID equals the patron_id of the addressed resource (Sale.patron_id, SpecialOrder.patron_id) or the patron_id in the request body"
    error_id: ERR_PATRON_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /patrons/{id}, GET /sales/{id}, GET /special-orders/{id}, POST /special-orders, POST /special-orders/{id}/cancel"
  - priority: 4
    category: existence
    check: "Every id in the request path resolves, validated left to right"
    error_id: "ERR_STORE_NOT_FOUND | ERR_PATRON_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_ASSORTMENT_NOT_FOUND | ERR_SALE_NOT_FOUND | ERR_SALE_LINE_NOT_FOUND | ERR_DELEGATION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_SPECIAL_ORDER_NOT_FOUND | ERR_MWR_PROGRAM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: business_constraint
    check: "Request body conforms to the endpoint's `input:` schema — required fields present, types correct, enum members legal, integers within their declared constraints, ISO-8601 UTC instants parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"
  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request body resolves (store_id, patron_id, product_id, sponsor_patron_id, delegate_patron_id, acting_delegation_id)"
    error_id: "ERR_STORE_NOT_FOUND | ERR_PATRON_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_DELEGATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /patrons, POST /shopper-delegations, POST /assortments, POST /sales, POST /sales/{id}/lines, POST /mwr-programs, POST /capital-projects, POST /special-orders"
  - priority: 7
    category: business_constraint
    check: "sponsor_patron_id is present when id_card_class == DEPENDENT and absent (null) for every other class"
    error_id: ERR_SPONSOR_REQUIRED
    http_status: 422
    applies_to: "POST /patrons"
  - priority: 8
    category: business_constraint
    check: "exchange_markup_bp is 0 (or omitted) when channel == COMMISSARY — commissary groceries are sold at cost plus surcharge only"
    error_id: ERR_MARKUP_FORBIDDEN_IN_COMMISSARY
    http_status: 422
    applies_to: "POST /stores"
  - priority: 9
    category: business_constraint
    check: "vendor_name is present when supply_mode == DSD; vendor_name is null and promo_allowance_bp is 0 when supply_mode == WAREHOUSE; promo_window_start/promo_window_end are both present when promo_allowance_bp > 0"
    error_id: ERR_VENDOR_REQUIRED_FOR_DSD
    http_status: 422
    applies_to: "POST /assortments"
  - priority: 10
    category: business_constraint
    check: "Product.sku is unique across all Products"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /products"
  - priority: 11
    category: state
    check: "expected_store_version equals Store.version (optimistic concurrency, §1.2.1 assortment-create-stale-store)"
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412
    applies_to: "POST /assortments"
  - priority: 12
    category: state
    check: "expected_delegate_patron_version equals Patron(delegate_patron_id).version (optimistic concurrency, §1.2.1 delegation-create-stale-delegate)"
    error_id: ERR_STALE_PATRON_VERSION
    http_status: 412
    applies_to: "POST /shopper-delegations"
  - priority: 20
    category: state
    check: "Sale.tender_state == OPEN"
    error_id: ERR_SALE_NOT_OPEN
    http_status: 409
    applies_to: "POST /sales/{id}/lines, POST /sales/{id}/tender"
  - priority: 21
    category: state
    check: "Sale.tender_state != VOIDED"
    error_id: ERR_SALE_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /sales/{id}/void"
  - priority: 22
    category: state
    check: "CapitalProject.state IN {DRAFT, RETURNED_FOR_REVISION} for submit; == SUBMITTED for decision; == APPROVED for close"
    error_id: "ERR_PROJECT_NOT_DRAFT | ERR_PROJECT_NOT_SUBMITTED | ERR_PROJECT_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /capital-projects/{id}/submit, POST /capital-projects/{id}/decision, POST /capital-projects/{id}/close"
  - priority: 23
    category: state
    check: "ShopperDelegation.status IN {ACTIVE, SUSPENDED_BY_SPONSOR} for revoke; == ACTIVE when used as a sale's acting delegation"
    error_id: ERR_DELEGATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /shopper-delegations/{id}/revoke, POST /sales, POST /sales/{id}/tender"
  - priority: 24
    category: state
    check: "Assortment.status == ACTIVE"
    error_id: ERR_ASSORTMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assortments/{id}/retire"
  - priority: 25
    category: state
    check: "SpecialOrder.state == SUBMITTED for route; SpecialOrder.state IN {SUBMITTED, LOCAL_FILL_PENDING, OVERSEAS_SHIP_PENDING} for cancel"
    error_id: "ERR_SPECIAL_ORDER_NOT_ROUTABLE | ERR_SPECIAL_ORDER_TERMINAL"
    http_status: 409
    applies_to: "POST /special-orders/{id}/route, POST /special-orders/{id}/cancel"
  - priority: 26
    category: state
    check: "Sale.line_count >= 1 at tender"
    error_id: ERR_SALE_HAS_NO_LINES
    http_status: 409
    applies_to: "POST /sales/{id}/tender"
  - priority: 27
    category: state
    check: "Sale.compliance_state == CLEARED at tender"
    error_id: ERR_SALE_COMPLIANCE_FLAGGED
    http_status: 409
    applies_to: "POST /sales/{id}/tender"
  - priority: 30
    category: business_safety
    check: "Patron.card_status == VALID"
    error_id: ERR_PATRON_CARD_NOT_VALID
    http_status: 403
    applies_to: "POST /sales, POST /sales/{id}/lines, POST /sales/{id}/tender, POST /special-orders"
  - priority: 31
    category: business_safety
    check: "When the shopping patron's id_card_class == DEPENDENT, the sponsor Patron(sponsor_patron_id).card_status == VALID"
    error_id: ERR_SPONSOR_CARD_NOT_VALID
    http_status: 403
    applies_to: "POST /sales, POST /special-orders"
  - priority: 32
    category: business_safety
    check: |
      Store.channel is authorized for the patron's id_card_class:
        ACTIVE_DUTY, GUARD_RESERVE, RETIREE, DEPENDENT, DISABLED_VETERAN -> {COMMISSARY, EXCHANGE}
        DOD_CIVILIAN_OVERSEAS                                            -> {EXCHANGE} only
    error_id: ERR_PATRON_NOT_ELIGIBLE_FOR_CHANNEL
    http_status: 403
    applies_to: "POST /sales, POST /special-orders"
  - priority: 33
    category: business_safety
    check: |
      Store.region is authorized for the patron's id_card_class:
        ACTIVE_DUTY, GUARD_RESERVE, DEPENDENT -> {CONUS, OVERSEAS, DEPLOYED}
        RETIREE                               -> {CONUS, OVERSEAS}
        DISABLED_VETERAN                      -> {CONUS} only
        DOD_CIVILIAN_OVERSEAS                 -> {OVERSEAS} only
    error_id: ERR_PATRON_NOT_ELIGIBLE_IN_REGION
    http_status: 403
    applies_to: "POST /sales, POST /special-orders"
  - priority: 34
    category: business_safety
    check: "When Product.quantity_limit_per_visit is not null, the AGGREGATE quantity of that product across all lines of this sale (existing lines plus the requested one) is <= the limit. Exactly at the limit passes."
    error_id: ERR_QUANTITY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sales/{id}/lines"
  - priority: 35
    category: business_safety
    check: "When Patron.resale_watch_status == RESTRICTED, no line of a Product with resale_restricted == true may be added"
    error_id: ERR_RESTRICTED_ITEM_BLOCKED_BY_WATCH
    http_status: 403
    applies_to: "POST /sales/{id}/lines"
  - priority: 36
    category: business_temporal
    check: "When acting_delegation_id is supplied, the delegation's half-open window covers the sale: valid_from <= business_date < valid_to"
    error_id: ERR_DELEGATION_WINDOW_NOT_COVERING
    http_status: 409
    applies_to: "POST /sales, POST /sales/{id}/tender"
  - priority: 37
    category: business_temporal
    check: "A new delegation with the SAME (sponsor_patron_id, delegate_patron_id) pair must not overlap an existing ACTIVE delegation of that pair. Windows are HALF-OPEN, so [a,b) and [b,c) are adjacent and legal; [a,c) and [b,d) with b < c collide."
    error_id: ERR_DELEGATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /shopper-delegations"
  - priority: 38
    category: business_referential
    check: "calculations.governing_assortment_selector returns a non-empty candidate set for (store, product) at the reference instant"
    error_id: ERR_ITEM_NOT_IN_ASSORTMENT
    http_status: 409
    applies_to: "POST /sales/{id}/lines, POST /special-orders/{id}/route"
  - priority: 39
    category: business_referential
    check: "route == OVERSEAS_SHIP requires Store.region IN {OVERSEAS, DEPLOYED}"
    error_id: ERR_ROUTE_NOT_AVAILABLE_IN_REGION
    http_status: 409
    applies_to: "POST /special-orders/{id}/route"
  - priority: 41
    category: business_constraint
    check: "For the target (store_id, shelf_block), the sum of `facings` over every ACTIVE Assortment whose CLOSED window [effective_from, effective_to] intersects the incoming CLOSED window, plus the incoming facings, is <= Store.shelf_block_capacity_facings. Touching endpoints count as intersecting."
    error_id: ERR_SHELF_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /assortments"
  - priority: 44
    category: business_fiscal
    check: "When acting_delegation_id is set, Sale.total_due_cents <= ShopperDelegation.per_sale_spend_cap_cents"
    error_id: ERR_DELEGATION_SPEND_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /sales/{id}/tender"
  - priority: 45
    category: business_fiscal
    check: "collected_tax_cents, when supplied, is exactly 0 — commissary and exchange sales are tax-free"
    error_id: ERR_TAX_COLLECTION_FORBIDDEN
    http_status: 422
    applies_to: "POST /sales/{id}/tender"
  - priority: 46
    category: business_fiscal
    check: "outlay_cents <= CapitalProject.obligation_cents"
    error_id: ERR_OUTLAY_EXCEEDS_OBLIGATION
    http_status: 409
    applies_to: "POST /capital-projects/{id}/close"
  - priority: 49
    category: business_constraint
    check: "Segregation of duties: the X-User-ID closing a capital project differs from CapitalProject.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /capital-projects/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Flat surface rooted at "/". Every list endpoint accepts limit/offset per
# §1.0. `?` marks an optional input field.
endpoints:
  # --- logical clock (test-driving endpoint, /_ namespace) -------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every business_date, delegation-window test, promotional-window test and rolling-30-day window is evaluated against that fixed default, never against real wall-clock time."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock moves; no entity is mutated and no sweep runs"]

  # --- Store ----------------------------------------------------------------
  - method: POST
    path: "/stores"
    description: "Register a commissary or exchange store"
    roles: [SurchargeFundController]
    code: 201
    input: [name, channel, region, "surcharge_rate_bp?", "exchange_markup_bp?", "shelf_block_capacity_facings?"]
    output: Store
    side_effects: ["fund balances start at 0; fund_posture computed as FROZEN; period_close_index = 0"]
  - method: GET
    path: "/stores"
    description: "List stores"
    roles: [SurchargeFundController, AssortmentPlanner, ComplianceOfficer, MwrBoardOfficer]
    code: 200
    input: ["channel?", "region?", "limit?", "offset?"]
    output: Store[]
    side_effects: []
  - method: GET
    path: "/stores/{id}"
    description: "Read one store including all four derived fund fields and fund_posture"
    roles: [SurchargeFundController, AssortmentPlanner, ComplianceOfficer, MwrBoardOfficer, StoreCashier]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: "/stores/{id}/close-period"
    description: "Ops-run checkpoint: expires lapsed delegations, joins pending special orders to FULFILLED, runs the dividend waterfall, re-derives fund_posture, auto-approves AWAITING_FUNDS projects, and increments period_close_index"
    roles: [SurchargeFundController]
    code: 200
    input: []
    output: Store
    side_effects:
      - "step 1: every ShopperDelegation with status == ACTIVE and valid_to <= clock now -> EXPIRED"
      - "step 2: every SpecialOrder of this store in LOCAL_FILL_PENDING or OVERSEAS_SHIP_PENDING -> FULFILLED"
      - "step 3: calculations.dividend_waterfall_distribution writes DIVIDEND_TRANSFER entries and raises MwrProgram.ytd_funded_cents"
      - "step 4: dividend_fund_balance_cents recomputed; fund_posture re-derived"
      - "step 5: AWAITING_FUNDS CapitalProjects auto-approved in created_at ASC order while the available balance covers each obligation"
      - "step 6: period_close_index += 1; Store.version += 1"
  - method: GET
    path: "/stores/{id}/fund-ledger"
    description: "Append-only fund ledger of the store, ordered created_at ASC"
    roles: [SurchargeFundController, MwrBoardOfficer, ComplianceOfficer]
    code: 200
    input: ["fund?", "entry_type?", "limit?", "offset?"]
    output: FundLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/stores/{id}/mwr-programs"
    description: "MWR programs funded by this store's dividend, ordered priority_rank ASC then created_at ASC"
    roles: [MwrBoardOfficer, SurchargeFundController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MwrProgram[]
    side_effects: []

  # --- Patron ---------------------------------------------------------------
  - method: POST
    path: "/patrons"
    description: "Enroll a patron with an ID card class; DEPENDENT requires a sponsor"
    roles: [ComplianceOfficer]
    code: 201
    input: [full_name, id_card_class, "sponsor_patron_id?"]
    output: Patron
    side_effects: ["card_status = VALID, resale_watch_status = CLEAR, all risk fields 0"]
  - method: GET
    path: "/patrons"
    description: "List patrons; filter by sponsor to find a sponsor's dependents"
    roles: [ComplianceOfficer, StoreCashier]
    code: 200
    input: ["sponsor_patron_id?", "id_card_class?", "card_status?", "resale_watch_status?", "limit?", "offset?"]
    output: Patron[]
    side_effects: []
  - method: GET
    path: "/patrons/{id}"
    description: "Read one patron with both risk scores and both state dimensions"
    roles: [ComplianceOfficer, StoreCashier, Patron]
    code: 200
    input: []
    output: Patron
    side_effects: []
  - method: POST
    path: "/patrons/{id}/card-status"
    description: "Suspend, reinstate or revoke an ID card; suspension and reinstatement cascade three hops (dependents -> delegations -> open sales)"
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "reason?"]
    output: Patron
    side_effects: ["card_status and suspension_reason updated", "three-hop cascade or three-hop compensation per §1.2", "version += 1 on every entity touched"]
  - method: POST
    path: "/patrons/{id}/compliance-review"
    description: "Record a resale strike (CONFIRM_STRIKE) or clear the watch (CLEAR_WATCH); both recompute both risk scores"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: Patron
    side_effects:
      - "manual_strike_count incremented or zeroed"
      - "resale_risk_score / recent_sales_risk_score recomputed and resale_watch_status re-derived"
      - "CONFIRM_STRIKE flags every Sale of this patron with tender_state == OPEN (compliance_state = FLAGGED); CLEAR_WATCH un-flags them. No delegation is touched by either decision."

  # --- ShopperDelegation ----------------------------------------------------
  - method: POST
    path: "/shopper-delegations"
    description: "Grant authorized-shopper privileges. A grant from a different sponsor for the same delegate supersedes the delegate's overlapping ACTIVE delegation; a grant from the same sponsor may not overlap. Guarded by OCC on the delegate patron's version."
    roles: [ComplianceOfficer]
    code: 201
    input: [sponsor_patron_id, delegate_patron_id, valid_from, valid_to, per_sale_spend_cap_cents, expected_delegate_patron_version]
    output: ShopperDelegation
    side_effects:
      - "increments Patron(delegate_patron_id).version by 1"
      - "an overlapping ACTIVE delegation of the same delegate from a different sponsor -> SUPERSEDED, with superseded_by_delegation_id set and its OPEN sales flagged"
  - method: GET
    path: "/shopper-delegations"
    description: "List delegations by sponsor, delegate, status, or supersession link"
    roles: [ComplianceOfficer, StoreCashier]
    code: 200
    input: ["sponsor_patron_id?", "delegate_patron_id?", "status?", "superseded_by_delegation_id?", "limit?", "offset?"]
    output: ShopperDelegation[]
    side_effects: []
  - method: GET
    path: "/shopper-delegations/{id}"
    description: "Read one delegation"
    roles: [ComplianceOfficer, StoreCashier]
    code: 200
    input: []
    output: ShopperDelegation
    side_effects: []
  - method: POST
    path: "/shopper-delegations/{id}/revoke"
    description: "Revoke a delegation; flags its OPEN sales"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ShopperDelegation
    side_effects: ["status = REVOKED", "OPEN sales carrying this delegation -> compliance_state = FLAGGED"]

  # --- Product --------------------------------------------------------------
  - method: POST
    path: "/products"
    description: "Create a worldwide item record"
    roles: [AssortmentPlanner]
    code: 201
    input: [sku, name, category, unit_cost_cents, "unit_weight_grams?", "resale_restricted?", "quantity_limit_per_visit?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List products"
    roles: [AssortmentPlanner, StoreCashier]
    code: 200
    input: ["category?", "resale_restricted?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Read one product"
    roles: [AssortmentPlanner, StoreCashier, Patron]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- Assortment -----------------------------------------------------------
  - method: POST
    path: "/assortments"
    description: "Allocate an item to a store shelf block for a closed effective window, optionally as a DSD vendor line with a promotional allowance window. Guarded by OCC on the store's version."
    roles: [AssortmentPlanner]
    code: 201
    input: [store_id, product_id, shelf_block, facings, supply_mode, "vendor_name?", "promo_allowance_bp?", "promo_window_start?", "promo_window_end?", effective_from, effective_to, "overseas_shipping_allowance_cents?", expected_store_version]
    output: Assortment
    side_effects: ["increments Store.version by 1", "consumes shelf_block facings for every instant of its closed window"]
  - method: GET
    path: "/assortments"
    description: "List assortment allocations by store, product, shelf block or status"
    roles: [AssortmentPlanner, StoreCashier]
    code: 200
    input: ["store_id?", "product_id?", "shelf_block?", "status?", "supply_mode?", "limit?", "offset?"]
    output: Assortment[]
    side_effects: []
  - method: GET
    path: "/assortments/{id}"
    description: "Read one assortment allocation"
    roles: [AssortmentPlanner, StoreCashier]
    code: 200
    input: []
    output: Assortment
    side_effects: []
  - method: POST
    path: "/assortments/{id}/retire"
    description: "Retire an allocation; releases facings and cancels this store/product's OVERSEAS_SHIP_PENDING special orders"
    roles: [AssortmentPlanner]
    code: 200
    input: ["reason?"]
    output: Assortment
    side_effects: ["status = RETIRED", "three-hop cascade per §1.2 releasing Store.shipping_allowance_committed_cents", "Store.version += 1"]

  # --- Sale + SaleLine ------------------------------------------------------
  - method: POST
    path: "/sales"
    description: "Open a sale (one visit). Stamps business_date from the logical clock and runs the full eligibility gate: card status, sponsor card, channel, region, delegation status and delegation window."
    roles: [StoreCashier]
    code: 201
    input: [store_id, patron_id, "acting_delegation_id?"]
    output: Sale
    side_effects: ["business_date stamped from logical clock now", "tender_state = OPEN, compliance_state = CLEARED, all money fields 0"]
  - method: POST
    path: "/sales/{id}/lines"
    description: "Ring an item onto an open sale; prices it, rolls up the sale, refreshes the provisional vendor allowance and recomputes both patron risk scores"
    roles: [StoreCashier]
    code: 201
    input: [product_id, quantity]
    output: SaleLine
    side_effects:
      - "calculations.line_retail_price then calculations.sale_surcharge_rollup"
      - "Sale.provisional_allowance_cents refreshed (PROVISIONAL variant)"
      - "Patron risk scores recomputed; resale_watch_status re-derived; the RISK_THRESHOLD card suspension may fire and cascade"
      - "Sale.version += 1"
  - method: POST
    path: "/sales/{id}/tender"
    description: "Tender the sale: settles the vendor allowance, posts the surcharge and allowance ledger entries, and cascades into store posture and awaiting-funds capital projects"
    roles: [StoreCashier]
    code: 200
    input: ["collected_tax_cents?"]
    output: Sale
    side_effects: ["full four-hop cascade per §1.2 Sale OPEN -> TENDERED", "Store.version += 1, Sale.version += 1"]
  - method: POST
    path: "/sales/{id}/void"
    description: "Void a sale; a tendered sale is reversed in the ledger so the surcharge fund balance returns exactly to its pre-tender value"
    roles: [ComplianceOfficer]
    code: 200
    input: [voided_reason]
    output: Sale
    side_effects: ["tender_state = VOIDED", "reversal ledger entries when the sale was TENDERED", "patron risk recomputed with the sale excluded"]
  - method: GET
    path: "/sales"
    description: "List sales by store, patron, acting delegation or state"
    roles: [StoreCashier, ComplianceOfficer]
    code: 200
    input: ["store_id?", "patron_id?", "acting_delegation_id?", "tender_state?", "compliance_state?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []
  - method: GET
    path: "/sales/{id}"
    description: "Read one sale with every computed money field"
    roles: [StoreCashier, ComplianceOfficer, Patron]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: GET
    path: "/sale-lines"
    description: "List sale lines by sale or by product"
    roles: [StoreCashier, ComplianceOfficer]
    code: 200
    input: ["sale_id?", "product_id?", "limit?", "offset?"]
    output: SaleLine[]
    side_effects: []
  - method: GET
    path: "/sale-lines/{id}"
    description: "Read one sale line with its priced fields"
    roles: [StoreCashier, ComplianceOfficer]
    code: 200
    input: []
    output: SaleLine
    side_effects: []

  # --- MwrProgram -----------------------------------------------------------
  - method: POST
    path: "/mwr-programs"
    description: "Register a morale/welfare/recreation program as a dividend waterfall bucket"
    roles: [MwrBoardOfficer]
    code: 201
    input: [store_id, name, priority_rank, funding_ceiling_cents, "status?"]
    output: MwrProgram
    side_effects: ["ytd_funded_cents = 0"]
  - method: GET
    path: "/mwr-programs/{id}"
    description: "Read one MWR program including ytd_funded_cents"
    roles: [MwrBoardOfficer, SurchargeFundController]
    code: 200
    input: []
    output: MwrProgram
    side_effects: []

  # --- CapitalProject -------------------------------------------------------
  - method: POST
    path: "/capital-projects"
    description: "Draft a surcharge-funded capital project; the contingency tier and obligation are computed at creation from the contingency-free request amount"
    roles: [SurchargeFundController]
    code: 201
    input: [store_id, title, requested_amount_cents]
    output: CapitalProject
    side_effects: ["calculations.capital_contingency_obligation writes contingency_bp, contingency_cents and obligation_cents", "state = DRAFT"]
  - method: GET
    path: "/capital-projects"
    description: "List capital projects by store or state"
    roles: [SurchargeFundController, MwrBoardOfficer]
    code: 200
    input: ["store_id?", "state?", "limit?", "offset?"]
    output: CapitalProject[]
    side_effects: []
  - method: GET
    path: "/capital-projects/{id}"
    description: "Read one capital project"
    roles: [SurchargeFundController, MwrBoardOfficer]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []
  - method: POST
    path: "/capital-projects/{id}/submit"
    description: "Submit a draft or returned project for board decision; records the submitting user for the segregation-of-duties check at close"
    roles: [SurchargeFundController]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["state = SUBMITTED", "submitted_by_user_id = caller X-User-ID", "revision_count += 1 when re-submitted from RETURNED_FOR_REVISION"]
  - method: POST
    path: "/capital-projects/{id}/decision"
    description: "Board decision: APPROVE (obligates the fund, or parks the project in AWAITING_FUNDS when the posture or balance cannot carry it), RETURN (back for revision), REJECT (terminal)"
    roles: [MwrBoardOfficer]
    code: 200
    input: [decision, "note?"]
    output: CapitalProject
    side_effects: ["branching transition per §1.2", "Store.surcharge_obligated_cents and fund_posture updated on the APPROVED branch only"]
  - method: POST
    path: "/capital-projects/{id}/close"
    description: "Close an approved project with its actual outlay; posts the CAPITAL_OUTLAY ledger entry and releases the whole obligation including unspent contingency. Segregation of duties: the closing user may not be the submitting user."
    roles: [SurchargeFundController]
    code: 200
    input: [outlay_cents]
    output: CapitalProject
    side_effects: ["state = CLOSED", "CAPITAL_OUTLAY ledger entry", "Store.surcharge_obligated_cents -= obligation_cents; balance and posture recomputed"]

  # --- SpecialOrder ---------------------------------------------------------
  - method: POST
    path: "/special-orders"
    description: "Place a deployed/remote-site special order; runs the same eligibility gate as a sale"
    roles: [StoreCashier, Patron]
    code: 201
    input: [store_id, patron_id, product_id, quantity]
    output: SpecialOrder
    side_effects: ["state = SUBMITTED, route = null, all shipping money fields 0"]
  - method: GET
    path: "/special-orders"
    description: "List special orders by store, patron, product or state"
    roles: [StoreCashier, ComplianceOfficer]
    code: 200
    input: ["store_id?", "patron_id?", "product_id?", "state?", "route?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []
  - method: GET
    path: "/special-orders/{id}"
    description: "Read one special order with its shipping computation"
    roles: [StoreCashier, ComplianceOfficer, Patron]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: POST
    path: "/special-orders/{id}/route"
    description: "Fork the order onto a fill route; OVERSEAS_SHIP computes and commits the appropriated-fund shipping allowance, LOCAL_FILL commits nothing"
    roles: [StoreCashier]
    code: 200
    input: [route]
    output: SpecialOrder
    side_effects: ["divergent side-effect sets per branch per §1.2", "Store.shipping_allowance_committed_cents += shipping_allowance_cents on the OVERSEAS_SHIP branch", "Store.version += 1"]
  - method: POST
    path: "/special-orders/{id}/cancel"
    description: "Cancel a non-terminal special order, releasing exactly the committed shipping allowance"
    roles: [StoreCashier, Patron]
    code: 200
    input: [cancelled_reason]
    output: SpecialOrder
    side_effects: ["state = CANCELLED", "Store.shipping_allowance_committed_cents -= shipping_allowance_cents", "Store.version += 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
# 46 codes: 10 of them are per-entity 404s (one per addressable collection),
# the remaining 36 are distinct auth, schema, state, compliance, temporal,
# referential, capacity, fiscal and segregation-of-duties failures.
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside §1.7" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "Authenticated role is not listed in the called endpoint's roles" }
  - { id: ERR_PATRON_SCOPE_VIOLATION, http: 403, condition: "Role Patron addressed a resource whose patron_id differs from X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required body field, wrong type, illegal enum member, out-of-range integer, unparseable instant, or valid_to <= valid_from / effective_to < effective_from" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "store id in path or body does not resolve" }
  - { id: ERR_PATRON_NOT_FOUND, http: 404, condition: "patron id in path or body (patron_id, sponsor_patron_id, delegate_patron_id) does not resolve" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product id in path or body does not resolve" }
  - { id: ERR_ASSORTMENT_NOT_FOUND, http: 404, condition: "assortment id in path does not resolve" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "sale id in path does not resolve" }
  - { id: ERR_SALE_LINE_NOT_FOUND, http: 404, condition: "sale line id in path does not resolve" }
  - { id: ERR_DELEGATION_NOT_FOUND, http: 404, condition: "delegation id in path or acting_delegation_id in body does not resolve" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "capital project id in path does not resolve" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "special order id in path does not resolve" }
  - { id: ERR_MWR_PROGRAM_NOT_FOUND, http: 404, condition: "mwr program id in path does not resolve" }
  - { id: ERR_SPONSOR_REQUIRED, http: 422, condition: "id_card_class == DEPENDENT without sponsor_patron_id, or sponsor_patron_id supplied for a non-DEPENDENT class" }
  - { id: ERR_MARKUP_FORBIDDEN_IN_COMMISSARY, http: 422, condition: "exchange_markup_bp > 0 on a store whose channel == COMMISSARY" }
  - { id: ERR_VENDOR_REQUIRED_FOR_DSD, http: 422, condition: "supply_mode == DSD without vendor_name, or WAREHOUSE with vendor_name/promo_allowance_bp set, or promo_allowance_bp > 0 without both promo window bounds" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "A Product with the same sku already exists" }
  - { id: ERR_STALE_STORE_VERSION, http: 412, condition: "expected_store_version does not equal Store.version on POST /assortments" }
  - { id: ERR_STALE_PATRON_VERSION, http: 412, condition: "expected_delegate_patron_version does not equal Patron(delegate).version on POST /shopper-delegations" }
  - { id: ERR_SALE_NOT_OPEN, http: 409, condition: "Adding a line to, or tendering, a sale whose tender_state is not OPEN" }
  - { id: ERR_SALE_ALREADY_VOIDED, http: 409, condition: "Voiding a sale already in tender_state VOIDED" }
  - { id: ERR_PROJECT_NOT_DRAFT, http: 409, condition: "Submitting a project whose state is not DRAFT or RETURNED_FOR_REVISION" }
  - { id: ERR_PROJECT_NOT_SUBMITTED, http: 409, condition: "Deciding a project whose state is not SUBMITTED" }
  - { id: ERR_PROJECT_NOT_APPROVED, http: 409, condition: "Closing a project whose state is not APPROVED" }
  - { id: ERR_DELEGATION_NOT_ACTIVE, http: 409, condition: "Using a delegation whose status is not ACTIVE as a sale's acting delegation, or revoking one already terminal" }
  - { id: ERR_ASSORTMENT_NOT_ACTIVE, http: 409, condition: "Retiring an assortment already RETIRED" }
  - { id: ERR_SPECIAL_ORDER_NOT_ROUTABLE, http: 409, condition: "Routing a special order whose state is not SUBMITTED" }
  - { id: ERR_SPECIAL_ORDER_TERMINAL, http: 409, condition: "Cancelling a special order already FULFILLED or CANCELLED" }
  - { id: ERR_SALE_HAS_NO_LINES, http: 409, condition: "Tendering a sale with line_count == 0" }
  - { id: ERR_SALE_COMPLIANCE_FLAGGED, http: 409, condition: "Tendering a sale whose compliance_state == FLAGGED" }
  - { id: ERR_PATRON_CARD_NOT_VALID, http: 403, condition: "Patron.card_status is SUSPENDED or REVOKED at sale open, line add, tender or special-order placement" }
  - { id: ERR_SPONSOR_CARD_NOT_VALID, http: 403, condition: "A DEPENDENT patron's sponsor card_status is not VALID" }
  - { id: ERR_PATRON_NOT_ELIGIBLE_FOR_CHANNEL, http: 403, condition: "The patron's id_card_class is not authorized for Store.channel (DOD_CIVILIAN_OVERSEAS at a COMMISSARY)" }
  - { id: ERR_PATRON_NOT_ELIGIBLE_IN_REGION, http: 403, condition: "The patron's id_card_class is not authorized for Store.region (DISABLED_VETERAN outside CONUS, RETIREE at a DEPLOYED site, DOD_CIVILIAN_OVERSEAS outside OVERSEAS)" }
  - { id: ERR_QUANTITY_LIMIT_EXCEEDED, http: 409, condition: "Aggregate quantity of one product across the sale's lines would exceed Product.quantity_limit_per_visit" }
  - { id: ERR_RESTRICTED_ITEM_BLOCKED_BY_WATCH, http: 403, condition: "A resale_restricted product is rung for a patron whose resale_watch_status == RESTRICTED" }
  - { id: ERR_DELEGATION_WINDOW_NOT_COVERING, http: 409, condition: "The acting delegation's half-open window does not contain the sale's business_date" }
  - { id: ERR_DELEGATION_WINDOW_OVERLAP, http: 409, condition: "A new delegation for the same (sponsor, delegate) pair overlaps an ACTIVE delegation of that pair" }
  - { id: ERR_ITEM_NOT_IN_ASSORTMENT, http: 409, condition: "No ACTIVE Assortment of the (store, product) pair covers the reference instant" }
  - { id: ERR_ROUTE_NOT_AVAILABLE_IN_REGION, http: 409, condition: "route == OVERSEAS_SHIP requested at a CONUS store" }
  - { id: ERR_SHELF_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate facings of intersecting ACTIVE allocations on the shelf block would exceed Store.shelf_block_capacity_facings" }
  - { id: ERR_DELEGATION_SPEND_CAP_EXCEEDED, http: 402, condition: "Sale.total_due_cents exceeds the acting delegation's per_sale_spend_cap_cents at tender" }
  - { id: ERR_TAX_COLLECTION_FORBIDDEN, http: 422, condition: "collected_tax_cents != 0 at tender" }
  - { id: ERR_OUTLAY_EXCEEDS_OBLIGATION, http: 409, condition: "outlay_cents exceeds the project's obligation_cents at close" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The X-User-ID closing a capital project equals its submitted_by_user_id" }

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: SystemOperator
    description: "Test/ops harness identity that positions the logical clock"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: []
  - name: SurchargeFundController
    description: "Agency fund officer: owns stores, the surcharge fund, the period-close checkpoint, and the drafting/submission/closeout of capital projects. May never decide a project, and may not close a project they submitted."
    identity: opaque
    exclusive_operations:
      - "POST /stores"
      - "POST /stores/{id}/close-period"
      - "POST /capital-projects"
      - "POST /capital-projects/{id}/submit"
      - "POST /capital-projects/{id}/close"
    shared_operations: ["GET /stores", "GET /stores/{id}", "GET /stores/{id}/fund-ledger", "GET /stores/{id}/mwr-programs", "GET /mwr-programs/{id}", "GET /capital-projects", "GET /capital-projects/{id}"]
  - name: MwrBoardOfficer
    description: "Morale/welfare/recreation board member: registers dividend programs and renders the board decision on capital projects. Cannot draft, submit or close a project."
    identity: opaque
    exclusive_operations: ["POST /mwr-programs", "POST /capital-projects/{id}/decision"]
    shared_operations: ["GET /stores", "GET /stores/{id}", "GET /stores/{id}/fund-ledger", "GET /stores/{id}/mwr-programs", "GET /mwr-programs/{id}", "GET /capital-projects", "GET /capital-projects/{id}"]
  - name: ComplianceOfficer
    description: "Patron eligibility and resale-compliance authority: enrolls patrons, manages ID card status, grants and revokes authorized-shopper delegations, records resale strikes, and voids sales."
    identity: opaque
    exclusive_operations:
      - "POST /patrons"
      - "POST /patrons/{id}/card-status"
      - "POST /patrons/{id}/compliance-review"
      - "POST /shopper-delegations"
      - "POST /shopper-delegations/{id}/revoke"
      - "POST /sales/{id}/void"
    shared_operations: ["GET /stores", "GET /stores/{id}", "GET /stores/{id}/fund-ledger", "GET /patrons", "GET /patrons/{id}", "GET /shopper-delegations", "GET /shopper-delegations/{id}", "GET /sales", "GET /sales/{id}", "GET /sale-lines", "GET /sale-lines/{id}", "GET /special-orders", "GET /special-orders/{id}"]
  - name: AssortmentPlanner
    description: "Worldwide category manager: owns the item file, shelf allocations, DSD vendor terms and promotional allowance windows."
    identity: opaque
    exclusive_operations: ["POST /products", "POST /assortments", "POST /assortments/{id}/retire"]
    shared_operations: ["GET /stores", "GET /stores/{id}", "GET /products", "GET /products/{id}", "GET /assortments", "GET /assortments/{id}"]
  - name: StoreCashier
    description: "Point-of-sale operator: opens sales, rings lines, tenders, and routes special orders. Cannot void a sale (that is the ComplianceOfficer's exclusive power)."
    identity: opaque
    exclusive_operations: ["POST /sales", "POST /sales/{id}/lines", "POST /sales/{id}/tender", "POST /special-orders/{id}/route"]
    shared_operations: ["GET /stores/{id}", "GET /patrons", "GET /patrons/{id}", "GET /shopper-delegations", "GET /shopper-delegations/{id}", "GET /products", "GET /products/{id}", "GET /assortments", "GET /assortments/{id}", "GET /sales", "GET /sales/{id}", "GET /sale-lines", "GET /sale-lines/{id}", "POST /special-orders", "GET /special-orders", "GET /special-orders/{id}", "POST /special-orders/{id}/cancel"]
  - name: Patron
    description: "The patron themselves, acting through the self-service kiosk: may place and cancel their own special orders and read their own records. X-User-ID is the Patron.id."
    identity: "entity_backed:Patron"
    exclusive_operations: []
    shared_operations: ["GET /patrons/{id}", "GET /products/{id}", "GET /sales/{id}", "POST /special-orders", "GET /special-orders/{id}", "POST /special-orders/{id}/cancel"]
