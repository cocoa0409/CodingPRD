              as_user_id: "op-1"
          assert:
            - "HTTP 409 with data.error_id == ERR_REVISION_LIMIT_EXCEEDED"
            - "data.error_id is not ERR_INVALID_LEASE_STATE (REVISION_REQUESTED IS a declared from: state of submit)"
            - "GET /shellfish/leases/${lease} reports status == REVISION_REQUESTED, revision_round == 3, navigation_clearance == OBJECTION and rent_paid_through_date == null"

      - name: future_dated_and_backwards_windows_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=53]
          - validations[priority=54]
          - errors[ERR_FUTURE_DATED_EVENT]
          - errors[ERR_INVALID_DEPLOYMENT_WINDOW]
        distinguishing_aspect: |
          Priority 53 rejects any client-supplied instant describing something that already happened
          when it sits after the logical clock, and it outranks the deployment-window rule at 54 —
          so the window check is only reachable with dates that are themselves in the past, here a
          planned_retrieval_on equal to (not after) deployed_on.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED; APPROVED Lease L-2988-01 with plots P1..P3; SeedLot READY_FOR_PLANTING with 60000 survivors."
            - "Logical clock 2026-08-01T00:00:00Z."
