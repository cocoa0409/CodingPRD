# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules (§0.5).
# 9 rule_ids × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: trust_score_provisional_vs_final_on_member
        grounds:
          - calculations.compute_trust_score
          - entities.Member.fields.trust_score
          - state_machines.Meetup.transitions.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          Same Member with identical phone_verified and upheld_flag_count yields trust_score
          70 (provisional_at_verification) before any sale and 76 (final_after_completion)
          after one COMPLETED meetup — the variant divergence lives on the Member entity domain.
        test_recipe:
          setup:
            - "PlatformAdmin sets clock to 2026-06-01T08:00:00Z; one furniture Category (cap 0)."
            - "Seller S and Buyer B registered; S phone-verified; one active listing ask 10000, floor 8000."
            - "B opens conversation, proposes 9000 (>=floor), S accepts (listing reserved), meetup proposed/confirmed at an open spot, not yet completed."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /safe-trade-spots"
              payload: { name: "City Hall Lobby", is_police_verified: false, open_minute_of_day: 480, close_minute_of_day: 1080 }
              as: PlatformAdmin
              captures: { spot_id: $.data.id }
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /members/${s_id}/request-verification"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { s_code: $.data.verification_code }
            - call: "POST /members/${s_id}/confirm-verification"
              payload: { verification_code: "${s_code}" }
              as: Member
              as_user_id: "${s_id}"
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Oak Desk", description: "solid", ask_price_cents: 10000, min_acceptable_price_cents: 8000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_v: $.data.version }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { off_v: $.data.version }
            - call: "POST /meetups"
              payload: { offer_id: "${off_id}", spot_id: "${spot_id}", start_at: "2026-06-02T14:00:00Z", end_at: "2026-06-02T15:00:00Z", expected_offer_version: "${off_v}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { mt_id: $.data.id }
            - call: "POST /meetups/${mt_id}/confirm"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "GET /members/${s_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { trust_before: $.data.trust_score }
            - call: "POST /meetups/${mt_id}/complete"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /members/${s_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { trust_after: $.data.trust_score }
          assert:
            - "trust_before (Member.${s_id}.trust_score before completion) == 70"
            - "trust_after (Member.${s_id}.trust_score after completion) == 76"
            - "Member.${s_id}.trust_score increased by exactly COMPLETION_BONUS (6) on completion"

      - name: open_offer_count_aggregation_vs_trust_weighted_on_listing
        grounds:
          - calculations.compute_open_offer_count
          - calculations.compute_trust_score
          - entities.Listing.fields.open_offer_count
        distinguishing_aspect: |
          compute_open_offer_count is an exact-integer aggregation on the Listing entity domain,
          whereas compute_trust_score is a clamped weighted_scoring on the Member entity domain —
          two valid calculation algorithms over different subjects, not the same shape twice.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; furniture Category; Seller S; two Buyers B1, B2; published listing ask 10000 floor 5000."
            - "B1 proposes 9000, B2 proposes 8000; both above floor so open_offer_count == 2."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b1@x.com", display_name: "B1", role_kind: "BUYER" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b2@x.com", display_name: "B2", role_kind: "BUYER" }
              as: Anonymous
              captures: { b2_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Oak Desk", description: "solid", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b1_id}" }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { conv1_id: $.data.id }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b2_id}" }
              as: Buyer
              as_user_id: "${b2_id}"
              captures: { conv2_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv1_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /offers"
              payload: { conversation_id: "${conv2_id}", amount_cents: 8000 }
              as: Buyer
              as_user_id: "${b2_id}"
          trigger:
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { ooc: $.data.open_offer_count }
          assert:
            - "Listing.${lst_id}.open_offer_count == 2"
            - "Member.${s_id}.trust_score == 50 (BASE_TRUST, no verification/flags/completions)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: trust_score_nonlinear_clamped_three_inputs
        grounds:
          - calculations.compute_trust_score
          - entities.Member.fields.trust_score
          - entities.Member.fields.upheld_flag_count
        distinguishing_aspect: |
          Mode (a): trust_score combines three inputs (phone_verified bonus, completion bonus
          with min-cap, upheld penalty) then clamps via max(0,min(100,raw)) — a non-linear
          interaction where the clamp makes the result non-additive at the boundaries.
        test_recipe:
          setup:
            - "Member M not phone-verified; four UPHELD flags target M; raw = 50+0+0-60 = -10, clamped to 0."
            - "Build four UPHELD flags via Moderator on M (each reporter is a distinct member)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m@x.com", display_name: "M", role_kind: "BOTH" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "r1@x.com", display_name: "R1", role_kind: "BUYER" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /flags"
              payload: { reporter_id: "${r1_id}", target_type: "MEMBER", target_member_id: "${m_id}", reason: "SCAM" }
              as: Member
              as_user_id: "${r1_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /flags"
              payload: { reporter_id: "${r1_id}", target_type: "MEMBER", target_member_id: "${m_id}", reason: "SCAM" }
              as: Member
              as_user_id: "${r1_id}"
              captures: { f2_id: $.data.id }
            - call: "POST /flags"
              payload: { reporter_id: "${r1_id}", target_type: "MEMBER", target_member_id: "${m_id}", reason: "SPAM" }
              as: Member
              as_user_id: "${r1_id}"
              captures: { f3_id: $.data.id }
            - call: "POST /flags"
              payload: { reporter_id: "${r1_id}", target_type: "MEMBER", target_member_id: "${m_id}", reason: "SPAM" }
              as: Member
              as_user_id: "${r1_id}"
              captures: { f4_id: $.data.id }
            - call: "POST /flags/${f1_id}/uphold"
              payload: {}
              as: Moderator
            - call: "POST /flags/${f2_id}/uphold"
              payload: {}
              as: Moderator
            - call: "POST /flags/${f3_id}/uphold"
              payload: {}
              as: Moderator
            - call: "POST /flags/${f4_id}/uphold"
              payload: {}
              as: Moderator
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: Moderator
              captures: { ts: $.data.trust_score }
          assert:
            - "Member.${m_id}.upheld_flag_count == 4"
            - "Member.${m_id}.trust_score == 0 (raw -10 clamped at TRUST_FLOOR, not negative)"

      - name: meetup_create_validation_order_pins_hours_then_overlap
        grounds:
          - calculations.compute_meetup_overlap_minutes
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (c): meetup gating is a fixed evaluation order — operating-hours containment
          (ERR_OUTSIDE_SPOT_HOURS at create, priority 10) is checked before overlap-at-confirm
          (ERR_SPOT_TIME_CONFLICT, priority 11); a window failing both surfaces the hours error
          first because the create gate runs before the confirm gate is ever reached.
        test_recipe:
          setup:
            - "Spot open 480 (08:00) close 1080 (18:00); accepted offer ready for meetup."
            - "Propose a meetup window 19:00-20:00 (outside hours) AND timed to overlap is moot — create rejects on hours."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /safe-trade-spots"
              payload: { name: "City Hall Lobby", is_police_verified: false, open_minute_of_day: 480, close_minute_of_day: 1080 }
              as: PlatformAdmin
              captures: { spot_id: $.data.id }
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Bike", description: "road", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_v: $.data.version }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { off_v: $.data.version }
          trigger:
            - call: "POST /meetups"
              payload: { offer_id: "${off_id}", spot_id: "${spot_id}", start_at: "2026-06-02T19:00:00Z", end_at: "2026-06-02T20:00:00Z", expected_offer_version: "${off_v}" }
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "response error_id == ERR_OUTSIDE_SPOT_HOURS"
            - "http status == 422"
            - "no Meetup is persisted for offer ${off_id}"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_cyclic_counter_rounds
        grounds:
          - state_machines.Offer.transitions.PROPOSED_to_COUNTERED
          - state_machines.Offer.transitions.COUNTERED_to_COUNTERED
          - entities.Offer.fields.round_count
        distinguishing_aspect: |
          The Offer machine is cyclic: COUNTERED->COUNTERED repeats with alternating sides,
          incrementing round_count each loop until MAX_NEGOTIATION_ROUNDS — a non-linear
          (looping) shape on the Offer entity, not an A->B->C pipeline.
        test_recipe:
          setup:
            - "Published listing ask 10000 floor 1000; conversation open."
            - "Buyer proposes 5000; sides alternate counters."
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Sofa", description: "comfy", ask_price_cents: 10000, min_acceptable_price_cents: 1000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 5000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 8000 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 6000 }
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 7000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { st: $.data.status, rc: $.data.round_count, las: $.data.last_actor_side }
          assert:
            - "Offer.${off_id}.status == COUNTERED"
            - "Offer.${off_id}.round_count == 3"
            - "Offer.${off_id}.last_actor_side == SELLER"

      - name: listing_parallel_publication_and_sale_dimensions
        grounds:
          - entities.Listing.fields.publication_status
          - entities.Listing.fields.sale_status
          - state_machines.Listing.transitions.AVAILABLE_to_RESERVED
        distinguishing_aspect: |
          Listing carries two independent state dimensions on ONE entity — publication_status
          stays ACTIVE while sale_status moves AVAILABLE->RESERVED on offer accept — parallel
          dimensions, a non-linear shape distinct from the Offer cycle (different entity).
        test_recipe:
          setup:
            - "Published listing (publication_status ACTIVE, sale_status AVAILABLE); one buyer offer 9000 accepted."
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Lamp", description: "led", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_v: $.data.version }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v}" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { pub: $.data.publication_status, sale: $.data.sale_status }
          assert:
            - "Listing.${lst_id}.publication_status == ACTIVE (publication dimension unchanged)"
            - "Listing.${lst_id}.sale_status == RESERVED (sale dimension advanced independently)"
            - "Listing.${lst_id}.accepted_offer_id == ${off_id}"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: member_suspend_cascade_depth3
        grounds:
          - state_machines.Member.transitions.ACTIVE_to_SUSPENDED
          - state_machines.Listing.transitions.ACTIVE_to_REMOVED
          - state_machines.Offer.transitions.PROPOSED_to_EXPIRED
        distinguishing_aspect: |
          Depth-3 chain originating from member suspend: suspend(Member) -> REMOVED(Listing)
          -> that removal EXPIRES the listing's open Offers AND CLOSES its Conversations; each
          hop is caused by the prior hop, not directly by the suspend call.
        test_recipe:
          setup:
            - "Seller S ACTIVE with one published listing; Buyer B has an OPEN conversation and a PROPOSED offer on it."
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "TV", description: "4k", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /members/${s_id}/suspend"
              payload: {}
              as: Moderator
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { pub: $.data.publication_status }
            - call: "GET /offers/${off_id}"
              payload: {}
              as: Member
              as_user_id: "${b_id}"
              captures: { ost: $.data.status }
            - call: "GET /conversations/${conv_id}"
              payload: {}
              as: Member
              as_user_id: "${b_id}"
              captures: { cst: $.data.status }
          assert:
            - "Member.${s_id}.status == SUSPENDED"
            - "Listing.${lst_id}.publication_status == REMOVED (hop 1 caused by suspend)"
            - "Offer.${off_id}.status == EXPIRED (hop 2 caused by listing removal)"
            - "Conversation.${conv_id}.status == CLOSED (hop 2 caused by listing removal)"
            - "Member.${s_id}.active_listing_count == 0"

      - name: meetup_complete_cascade_depth2_sells_and_closes
        grounds:
          - state_machines.Meetup.transitions.CONFIRMED_to_COMPLETED
          - state_machines.Listing.transitions.RESERVED_to_SOLD
          - entities.Conversation.fields.status
        distinguishing_aspect: |
          Depth-2 chain originating from meetup complete (a DIFFERENT trigger than suspend):
          complete(Meetup) -> Listing.sale_status RESERVED->SOLD, and that SOLD transition
          CLOSES the listing's OPEN conversations — second hop caused by the first.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; spot open 08:00-18:00; listing reserved by accepted offer; meetup confirmed; conversation OPEN."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /safe-trade-spots"
              payload: { name: "City Hall Lobby", is_police_verified: false, open_minute_of_day: 480, close_minute_of_day: 1080 }
              as: PlatformAdmin
              captures: { spot_id: $.data.id }
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
