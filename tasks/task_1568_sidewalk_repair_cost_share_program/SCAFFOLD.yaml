# =============================================================================
# Sidewalk Repair & Cost-Share Program — benchmark seed tables
# =============================================================================

scenario: |
  Sidewalk Repair & Cost-Share Program (municipal sidewalk program): sidewalk
  condition inventory & defect classification, property owner responsibility
  determination by ordinance, notice to repair & compliance deadline, cost-share
  percentage & program funding cap, contractor bid pooling for neighborhood
  batches, tree-root conflict & urban forestry coordination, lien for
  non-compliance, accessibility (curb ramp) upgrade triggers.

domain_name: sidewalk-cost-share
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology, FK references)
# =============================================================================
entities:
  - name: ProgramCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_year, type: integer, source: input, description: "Program fiscal year label (e.g. 2026)" }
      - { name: window_start_date, type: string, source: input, description: "First day applications accepted, ISO date, closed interval start" }
      - { name: window_end_date, type: string, source: input, description: "Last day applications accepted, ISO date, closed interval end (must be > window_start_date)" }
      - { name: appropriation_cents, type: integer, source: input, description: "Total program funding cap in cents (> 0)" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of provisional_award_cents over applications with review_status == OBLIGATED in this cycle" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of final_award_cents over applications with review_status == REIMBURSED in this cycle" }
      - { name: available_cents, type: integer, source: computed, description: "= appropriation_cents - committed_cents - disbursed_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | CLOSED", constraints: "OPEN -> LOCKED -> CLOSED" }

  - name: PropertyOwner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner legal name" }
      - { name: mailing_address, type: string, source: input, description: "Owner mailing address" }
      - { name: hardship_tier, type: enum, source: input, default: "NONE", description: "NONE | SENIOR_65 | LOW_INCOME — verified hardship classification; affects cost-share pct and deadline extension" }

  - name: PropertyParcel
    parent: null
    common_fields: true
    fields:
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number; unique across all parcels" }
      - { name: owner_id, type: string, source: input, description: "FK -> PropertyOwner.id; current deeded owner" }
      - { name: street_address, type: string, source: input, description: "Situs address" }
      - { name: street_class, type: enum, source: input, description: "LOCAL | COLLECTOR | ARTERIAL" }
      - { name: is_corner_lot, type: boolean, source: input, default: false, description: "Whether the parcel fronts two intersecting streets" }
      - { name: is_city_owned, type: boolean, source: input, default: false, description: "City-owned parcels are never noticed (city self-repairs)" }
      - { name: owner_responsibility_pct, type: integer, source: computed, description: "Ordinance determination: 0 when is_city_owned else 100" }
      - { name: delinquency_flag, type: boolean, source: computed, description: "True while any notice on this parcel is in DELINQUENT / CITY_REPAIR_SCHEDULED / CITY_REPAIR_COMPLETED / LIENED" }

  - name: SidewalkSegment
    parent: null
    common_fields: true
    fields:
      - { name: segment_code, type: string, source: input, description: "Inventory code; unique across all segments" }
      - { name: parcel_id, type: string, source: input, description: "FK -> PropertyParcel.id; abutting parcel responsible under ordinance" }
      - { name: length_ft, type: number, source: input, description: "Segment length in feet (> 0)" }
      - { name: width_ft, type: number, source: input, description: "Segment width in feet (> 0)" }
      - { name: is_corner_segment, type: boolean, source: input, default: false, description: "Segment includes a street-corner radius" }
      - { name: has_existing_curb_ramp, type: boolean, source: input, default: false, description: "Compliant curb ramp already present" }
      - { name: open_defect_count, type: integer, source: computed, description: "Count of defects on this segment with status in {OPEN, AWAITING_FORESTRY, UNDER_REPAIR}" }
      - { name: condition_screening, type: integer, source: computed, description: "Screening variant of condition index: max severity weight among non-verified defects (0 if none)" }
      - { name: condition_area_weighted, type: number, source: computed, description: "Area-weighted variant of condition index (1 decimal); 0 if no non-verified defects" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | FLAGGED | UNDER_NOTICE | REPAIR_IN_PROGRESS | RESTORED" }

  - name: Defect
    parent: null
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> SidewalkSegment.id" }
      - { name: defect_type, type: enum, source: input, description: "VERTICAL_SEPARATION | HORIZONTAL_OPENING | SPALLING | SETTLEMENT | TREE_ROOT_UPHEAVAL | CRUMBLED_JOINT" }
      - { name: measured_offset_inches, type: number, source: input, description: "Vertical lip or opening width in inches; required for VERTICAL_SEPARATION / HORIZONTAL_OPENING / TREE_ROOT_UPHEAVAL", constraints: ">= 0" }
      - { name: area_sqft, type: number, source: input, description: "Affected area in square feet (> 0)" }
      - { name: city_tree_involved, type: boolean, source: input, default: false, description: "Whether a city street tree is the suspected cause (routes to urban forestry)" }
      - { name: severity_class, type: enum, source: computed, description: "MINOR | MAJOR | TRIP_HAZARD per defect_severity_classification" }
      - { name: recorded_by_inspector_id, type: string, source: system, description: "X-User-ID of the Inspector who created the defect (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, description: "OPEN | AWAITING_FORESTRY | UNDER_REPAIR | VERIFIED" }

  - name: RepairNotice
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> PropertyParcel.id" }
      - { name: defect_ids, type: array, source: input, description: "Ordered list of FK -> Defect.id covered by this notice; each must be status OPEN and belong to this parcel's segments" }
      - { name: base_deadline_days, type: integer, source: input, default: 45, description: "Compliance window in days before hardship extension (> 0)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock timestamp at issue" }
      - { name: compliance_deadline, type: datetime, source: computed, description: "issued_at + base_deadline_days + 30d when owner hardship_tier != NONE; recomputed to appeal_decided_at + 15d on UPHELD" }
      - { name: prior_notice_id, type: string, source: input, description: "FK -> RepairNotice.id; optional self-reference when this notice re-issues a VOID one", constraints: "must reference a VOID notice on the same parcel" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramCoordinator who issued (segregation anchor for appeals)" }
      - { name: appeal_status, type: enum, source: system, description: "NONE | PENDING | UPHELD | REVERSED — appeal mini-dimension on the notice" }
      - { name: appeal_grounds, type: string, source: input, description: "Appeal grounds text supplied on appeal", default: null }
      - { name: appeal_decided_by_user_id, type: string, source: system, description: "X-User-ID of the HearingOfficer who decided the latest appeal" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | UNDER_APPEAL | COMPLIANT | DELINQUENT | CITY_REPAIR_SCHEDULED | CITY_REPAIR_COMPLETED | LIENED | CLOSED | VOID" }

  - name: CostShareApplication
    parent: null
    common_fields: true
    fields:
      - { name: notice_id, type: string, source: input, description: "FK -> RepairNotice.id; notice must be ISSUED" }
      - { name: parcel_id, type: string, source: input, description: "FK -> PropertyParcel.id; must equal notice.parcel_id" }
      - { name: owner_id, type: string, source: system, description: "FK -> PropertyOwner.id; copied from parcel at creation" }
      - { name: cycle_id, type: string, source: input, description: "FK -> ProgramCycle.id; cycle must be OPEN" }
      - { name: estimated_qty_sqft, type: number, source: input, description: "Owner-declared repair scope in square feet (> 0)" }
      - { name: ramp_upgrade_required, type: boolean, source: computed, description: "Accessibility trigger: any notice defect sits on a segment with is_corner_segment == true AND has_existing_curb_ramp == false" }
      - { name: share_pct, type: integer, source: computed, description: "City cost-share percentage per cost_share_pct (50..90)" }
      - { name: provisional_award_cents, type: integer, source: computed, description: "Engineer-rate estimate variant, computed at creation (see provisional_award)" }
      - { name: final_award_cents, type: integer, source: computed, description: "Actual-invoice variant, computed at reimbursement (see final_award); null until REIMBURSED", default: null }
      - { name: approved_at, type: datetime, source: system, description: "Logical clock when decision APPROVE landed" }
      - { name: approval_expires_at, type: datetime, source: computed, description: "approved_at + 60 days; obligate after this fails and the sweep expires the application" }
      - { name: review_status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | RETURNED | OBLIGATED | REIMBURSED | EXPIRED | WITHDRAWN | CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "UNFUNDED | RESERVED | DISBURSED | RELEASED — independent dimension of the same row" }

  - name: BidBatch
    parent: null
    common_fields: true
    fields:
      - { name: neighborhood_code, type: string, source: input, description: "Neighborhood pooling code" }
      - { name: work_window_start, type: string, source: input, description: "First day contractor may mobilize, ISO date; half-open window start" }
      - { name: work_window_end, type: string, source: input, description: "Day after last work day, ISO date; half-open window end (must be > work_window_start)" }
      - { name: bid_deadline, type: datetime, source: input, description: "Bids accepted while logical clock <= bid_deadline (inclusive)" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Sum of scope_sqft * engineer_unit_rate_cents over POOLED work items" }
      - { name: awarded_bid_id, type: string, source: system, description: "FK -> Bid.id; winning bid, set by award", default: null }
      - { name: awarded_total_cents, type: integer, source: computed, description: "evaluated_total_cents of the awarded bid; null until awarded", default: null }
      - { name: status, type: enum, source: system, description: "OPEN_FOR_ITEMS | SEALED_FOR_BIDDING | AWARDED | WORK_IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: BatchWorkItem
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> BidBatch.id" }
      - { name: notice_id, type: string, source: input, description: "FK -> RepairNotice.id; notice must be DELINQUENT (city-repair path)" }
      - { name: scope_sqft, type: number, source: input, description: "Repair scope in square feet (> 0)" }
      - { name: engineer_unit_rate_cents, type: integer, source: input, description: "City engineer estimate per square foot in cents (> 0)" }
      - { name: includes_ramp_upgrade, type: boolean, source: computed, description: "Same accessibility trigger rule as applications, evaluated on the notice's defect set" }
      - { name: status, type: enum, source: system, description: "POOLED | SCHEDULED | WORK_COMPLETED | VERIFIED | REMOVED" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Contractor company name" }
      - { name: license_number, type: string, source: input, description: "Municipal license number; unique; final tie-break for bid awards (ascending)" }
      - { name: insurance_valid_until, type: string, source: input, description: "ISO date through which liability insurance is valid" }
      - { name: is_suspended, type: boolean, source: system, default: false, description: "Suspended contractors cannot bid and are excluded from award eligibility" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> BidBatch.id" }
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; set from X-User-ID of the bidding Contractor" }
      - { name: unit_rate_cents, type: integer, source: input, description: "Bid per-square-foot rate in cents (> 0)" }
      - { name: ramp_flat_fee_cents, type: integer, source: input, description: "Flat fee per ramp-upgrade item in cents (>= 0)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission; award tie-break after evaluated_total" }
      - { name: evaluated_total_cents, type: integer, source: computed, description: "unit_rate_cents * total POOLED scope + ramp_flat_fee_cents * ramp-item count, snapshotted at submission and recomputed on award" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SUPERSEDED | WITHDRAWN | AWARDED | NOT_AWARDED" }

  - name: ForestryReview
    parent: null
    common_fields: true
    fields:
      - { name: defect_id, type: string, source: system, description: "FK -> Defect.id; auto-created when a TREE_ROOT_UPHEAVAL defect has city_tree_involved == true" }
      - { name: decision, type: enum, source: system, description: "PENDING | PRUNE_APPROVED | REMOVAL_ORDERED | NO_CITY_CONFLICT" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ForestryOfficer who decided" }
      - { name: work_completed_at, type: datetime, source: system, description: "Logical clock when root work was cleared; null for NO_CITY_CONFLICT", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | DECIDED | CLEARED" }

  - name: LienCase
    parent: null
    common_fields: true
    fields:
      - { name: notice_id, type: string, source: input, description: "FK -> RepairNotice.id; notice must be CITY_REPAIR_COMPLETED" }
      - { name: parcel_id, type: string, source: system, description: "FK -> PropertyParcel.id; copied from notice" }
      - { name: actual_repair_cost_cents, type: integer, source: input, description: "City's actual contractor invoice for this notice's work (> 0)" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "max(15000, round_half_up(actual_repair_cost_cents * 0.10))" }
      - { name: city_credit_cents, type: integer, source: computed, description: "Area-weighted city-tree credit per lien_principal_net" }
      - { name: owner_principal_cents, type: integer, source: computed, description: "actual_repair_cost_cents - city_credit_cents + admin_fee_cents" }
      - { name: interest_rate_bp, type: integer, source: input, default: 800, description: "Annual simple interest in basis points (> 0)" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical clock at lien creation (day 0 for accrual)" }
      - { name: principal_remaining_cents, type: integer, source: computed, description: "Owner principal net of waterfall payments" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Interest accrued and capitalized per lien_interest_accrual (unpaid portion)" }
      - { name: last_accrual_day, type: integer, source: computed, description: "Whole days from assessed_at covered by the last accrual event" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "principal_remaining_cents + accrued_interest_cents (after last payment event)" }
      - { name: status, type: enum, source: system, description: "ASSESSED | RECORDED | PARTIALLY_PAID | SATISFIED | FORECLOSURE_REFERRED" }

  - name: InspectionRecord
    parent: null
    common_fields: false
    fields:
      - { name: notice_id, type: string, source: system, description: "FK -> RepairNotice.id; from path" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of the inspecting Inspector" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: notes, type: string, source: input, description: "Free-text findings", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProgramCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /program-cycles/{id}/lock"
        actor: ProgramCoordinator
        preconditions:
          - "cycle.status == OPEN (else ERR_INVALID_CYCLE_STATE)"
        side_effects:
          - "increments ProgramCycle.version by 1"
        note: "LOCKED blocks new applications and obligations; in-flight OBLIGATED applications may still reimburse."
      - from: LOCKED
        to: CLOSED
        trigger: "POST /program-cycles/{id}/close"
        actor: ProgramCoordinator
        preconditions:
          - "cycle.status == LOCKED (else ERR_INVALID_CYCLE_STATE)"
          - "no CostShareApplication with cycle_id == this cycle and review_status in {SUBMITTED, RETURNED, APPROVED, OBLIGATED} (else ERR_CYCLE_HAS_OPEN_APPLICATIONS)"
        side_effects:
          - "increments ProgramCycle.version by 1"

  - entity: RepairNotice
    initial_state: DRAFT
    terminal_states: [COMPLIANT, VOID, CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /repair-notices/{id}/issue"
        actor: ProgramCoordinator
        preconditions:
          - "notice.status == DRAFT (else ERR_INVALID_NOTICE_STATE)"
          - "every defect in defect_ids has status in {OPEN, AWAITING_FORESTRY} (else ERR_INVALID_DEFECT_STATE)"
        side_effects:
          - "issued_at := logical clock; issued_by_user_id := X-User-ID"
          - "compliance_deadline computed per compliance_deadline calculation"
          - "each referenced Defect in OPEN -> UNDER_REPAIR; AWAITING_FORESTRY defects remain AWAITING_FORESTRY until their review clears"
          - "each referenced defect's SidewalkSegment: FLAGGED -> UNDER_NOTICE (from FLAGGED only)"
          - "increments RepairNotice.version by 1"
      - from: ISSUED
        to: UNDER_APPEAL
        trigger: "POST /repair-notices/{id}/appeal"
        actor: PropertyOwner
        preconditions:
          - "notice.status == ISSUED (else ERR_INVALID_NOTICE_STATE)"
          - "logical clock <= compliance_deadline (else ERR_APPEAL_WINDOW_CLOSED)"
          - "appeal_status in {NONE, UPHELD} (a PENDING appeal implies status UNDER_APPEAL; REVERSED implies VOID) (else ERR_APPEAL_ALREADY_PENDING)"
          - "acting owner owns notice.parcel_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "appeal_status := PENDING; appeal_grounds := request grounds"
          - "increments RepairNotice.version by 1"
      - from: UNDER_APPEAL
        to: ISSUED
        trigger: "POST /repair-notices/{id}/appeal-decision with decision=UPHELD"
        actor: HearingOfficer
        preconditions:
          - "notice.status == UNDER_APPEAL and appeal_status == PENDING (else ERR_INVALID_NOTICE_STATE)"
          - "X-User-ID != notice.issued_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "appeal_status := UPHELD; appeal_decided_by_user_id := X-User-ID; appeal_decided_at := logical clock"
          - "compliance_deadline := appeal_decided_at + 15 days (replaces prior deadline)"
          - "increments RepairNotice.version by 1"
        note: "Cyclic loop: a re-ISSUED notice may be appealed again while clock <= new compliance_deadline."
      - from: UNDER_APPEAL
        to: VOID
        trigger: "POST /repair-notices/{id}/appeal-decision with decision=REVERSED"
        actor: HearingOfficer
        preconditions:
          - "notice.status == UNDER_APPEAL and appeal_status == PENDING (else ERR_INVALID_NOTICE_STATE)"
          - "X-User-ID != notice.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "appeal_status := REVERSED; appeal_decided_by_user_id := X-User-ID; appeal_decided_at := logical clock"
          - "each referenced Defect UNDER_REPAIR -> OPEN"
          - "each segment with no remaining UNDER_REPAIR defects: UNDER_NOTICE -> FLAGGED"
          - "increments RepairNotice.version by 1"
      - from: ISSUED
        to: COMPLIANT
        trigger: "POST /repair-notices/{id}/inspections with result=PASS"
        actor: Inspector
        preconditions:
          - "notice.status in {ISSUED, DELINQUENT} (else ERR_INVALID_NOTICE_STATE)"
          - "X-User-ID != recorded_by_inspector_id of every defect in defect_ids (segregation, else ERR_SEGREGATION_OF_DUTIES)"
          - "every defect in defect_ids has status == UNDER_REPAIR — a defect still AWAITING_FORESTRY blocks compliance sign-off (else ERR_FORESTRY_NOT_CLEARED)"
        side_effects:
          - "InspectionRecord appended; each referenced Defect UNDER_REPAIR -> VERIFIED"
          - "each segment whose open_defect_count becomes 0: UNDER_NOTICE/FLAGGED -> RESTORED"
          - "parcel.delinquency_flag recomputed (false when no delinquent-family notices remain)"
          - "increments RepairNotice.version by 1"
      - from: DELINQUENT
        to: COMPLIANT
        trigger: "POST /repair-notices/{id}/inspections with result=PASS"
        actor: Inspector
        preconditions:
          - "same preconditions as ISSUED -> COMPLIANT (late compliance is accepted before CITY_REPAIR_SCHEDULED)"
        side_effects:
          - "same side effects as ISSUED -> COMPLIANT"
      - from: ISSUED
        to: DELINQUENT
        trigger: "POST /delinquency-sweeps (system actor) or POST /repair-notices/{id}/inspections with result=FAIL while logical clock > compliance_deadline"
        actor: system
        preconditions:
          - "logical clock > compliance_deadline (strictly greater; equality is still compliant)"
        side_effects:
          - "every CostShareApplication with notice_id == this notice and review_status in {SUBMITTED, RETURNED, APPROVED, OBLIGATED} -> CANCELLED"
          - "for each application cancelled from OBLIGATED: payment_status RESERVED -> RELEASED and ProgramCycle.committed_cents -= that application's provisional_award_cents"
          - "parcel.delinquency_flag := true"
          - "increments RepairNotice.version by 1"
        note: "Depth-3 cascade: notice -> application -> ProgramCycle fund release."
      - from: DELINQUENT
        to: CITY_REPAIR_SCHEDULED
        trigger: "system (POST /bid-batches/{id}/award cascade)"
        actor: system
        preconditions:
          - "a BatchWorkItem referencing this notice transitioned POOLED -> SCHEDULED"
        side_effects:
          - "segments of referenced defects -> REPAIR_IN_PROGRESS"
          - "increments RepairNotice.version by 1"
      - from: CITY_REPAIR_SCHEDULED
        to: CITY_REPAIR_COMPLETED
        trigger: "system (POST /batch-work-items/{id}/verify cascade)"
        actor: system
        preconditions:
          - "every BatchWorkItem with notice_id == this notice has status VERIFIED"
        side_effects:
          - "increments RepairNotice.version by 1"
      - from: CITY_REPAIR_COMPLETED
        to: LIENED
        trigger: "system (POST /lien-cases creation)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RepairNotice.version by 1"
      - from: LIENED
        to: CLOSED
        trigger: "system (LienCase -> SATISFIED cascade)"
        actor: system
        preconditions:
          - "the LienCase with notice_id == this notice reached SATISFIED"
        side_effects:
          - "parcel.delinquency_flag recomputed"
          - "increments RepairNotice.version by 1"

  - entity: CostShareApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED, WITHDRAWN, CANCELLED, REIMBURSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cost-share-applications/{id}/decision with outcome=APPROVE"
        actor: ProgramCoordinator
        preconditions:
          - "review_status == SUBMITTED (else ERR_INVALID_APPLICATION_STATE)"
        side_effects:
          - "approved_at := logical clock; approval_expires_at := approved_at + 60 days"
          - "increments CostShareApplication.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /cost-share-applications/{id}/decision with outcome=DENY"
        actor: ProgramCoordinator
        preconditions:
          - "review_status == SUBMITTED (else ERR_INVALID_APPLICATION_STATE)"
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /cost-share-applications/{id}/decision with outcome=RETURN"
        actor: ProgramCoordinator
        preconditions:
          - "review_status == SUBMITTED (else ERR_INVALID_APPLICATION_STATE)"
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /cost-share-applications/{id}/resubmit"
        actor: PropertyOwner
        preconditions:
          - "review_status == RETURNED (else ERR_INVALID_APPLICATION_STATE)"
          - "acting owner owns the application (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["increments CostShareApplication.version by 1"]
        note: "Revision cycle: RETURNED -> SUBMITTED may repeat without bound."
      - from: APPROVED
        to: OBLIGATED
        trigger: "POST /cost-share-applications/{id}/obligate"
        actor: FinanceOfficer
        preconditions:
          - "review_status == APPROVED (else ERR_INVALID_APPLICATION_STATE)"
          - "cycle.status == OPEN (else ERR_CYCLE_NOT_OPEN)"
          - "logical clock <= approval_expires_at (else ERR_APPLICATION_EXPIRED)"
          - "cycle.committed_cents + provisional_award_cents <= cycle.appropriation_cents (else ERR_PROGRAM_CAP_EXCEEDED; equality is allowed)"
        side_effects:
          - "payment_status UNFUNDED -> RESERVED"
          - "ProgramCycle.committed_cents += provisional_award_cents; available_cents recomputed"
          - "increments CostShareApplication.version by 1 and ProgramCycle.version by 1"
      - from: OBLIGATED
        to: REIMBURSED
        trigger: "POST /cost-share-applications/{id}/reimburse"
        actor: FinanceOfficer
        preconditions:
          - "review_status == OBLIGATED (else ERR_INVALID_APPLICATION_STATE)"
          - "notice.status == COMPLIANT (else ERR_NOTICE_NOT_COMPLIANT)"
          - "cycle.committed_cents - provisional_award_cents + cycle.disbursed_cents + final_award_cents <= cycle.appropriation_cents (else ERR_PROGRAM_CAP_EXCEEDED)"
        side_effects:
          - "final_award_cents computed per final_award (actual-invoice variant)"
          - "payment_status RESERVED -> DISBURSED"
          - "ProgramCycle.committed_cents -= provisional_award_cents; disbursed_cents += final_award_cents"
          - "increments CostShareApplication.version by 1 and ProgramCycle.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /delinquency-sweeps (system actor)"
        actor: system
        preconditions:
          - "logical clock > approval_expires_at"
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /cost-share-applications/{id}/withdraw"
        actor: PropertyOwner
        preconditions:
          - "review_status in {SUBMITTED, RETURNED, APPROVED, OBLIGATED} (else ERR_INVALID_APPLICATION_STATE)"
          - "acting owner owns the application (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /cost-share-applications/{id}/withdraw"
        actor: PropertyOwner
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /cost-share-applications/{id}/withdraw"
        actor: PropertyOwner
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: OBLIGATED
        to: WITHDRAWN
        trigger: "POST /cost-share-applications/{id}/withdraw"
        actor: PropertyOwner
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects:
          - "payment_status RESERVED -> RELEASED"
          - "ProgramCycle.committed_cents -= provisional_award_cents"
          - "increments CostShareApplication.version by 1 and ProgramCycle.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (notice delinquency cascade)"
        actor: system
        preconditions: ["notice transitioned to DELINQUENT"]
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: RETURNED
        to: CANCELLED
        trigger: "system (notice delinquency cascade)"
        actor: system
        preconditions: ["notice transitioned to DELINQUENT"]
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "system (notice delinquency cascade)"
        actor: system
        preconditions: ["notice transitioned to DELINQUENT"]
        side_effects: ["increments CostShareApplication.version by 1"]
      - from: OBLIGATED
        to: CANCELLED
        trigger: "system (notice delinquency cascade)"
        actor: system
        preconditions: ["notice transitioned to DELINQUENT"]
        side_effects:
          - "payment_status RESERVED -> RELEASED"
          - "ProgramCycle.committed_cents -= provisional_award_cents"
          - "increments CostShareApplication.version by 1 and ProgramCycle.version by 1"

  - entity: BidBatch
    initial_state: OPEN_FOR_ITEMS
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN_FOR_ITEMS
        to: SEALED_FOR_BIDDING
        trigger: "POST /bid-batches/{id}/seal"
        actor: ProgramCoordinator
        preconditions:
          - "batch.status == OPEN_FOR_ITEMS (else ERR_INVALID_BATCH_STATE)"
          - "at least one POOLED work item (else ERR_EMPTY_BATCH)"
          - "cure buffer: for every POOLED item, every ForestryReview of the item notice's defects with status CLEARED and work_completed_at != null must satisfy work_window_start >= work_completed_at + 7 days (else ERR_CURE_WINDOW_VIOLATION)"
        side_effects: ["increments BidBatch.version by 1"]
      - from: SEALED_FOR_BIDDING
        to: AWARDED
        trigger: "POST /bid-batches/{id}/award"
        actor: ProgramCoordinator
        preconditions:
          - "batch.status == SEALED_FOR_BIDDING (else ERR_INVALID_BATCH_STATE)"
          - "logical clock > bid_deadline (else ERR_BID_WINDOW_STILL_OPEN)"
          - "forestry gate: for every POOLED item, every ForestryReview on the item notice's defects has status == CLEARED (else ERR_FORESTRY_NOT_CLEARED)"
          - "eligible bid set non-empty per bid_award_selection (else ERR_NO_ELIGIBLE_BIDS)"
        side_effects:
          - "winning Bid SUBMITTED -> AWARDED; awarded_bid_id and awarded_total_cents set"
          - "all other SUBMITTED bids -> NOT_AWARDED"
          - "each POOLED BatchWorkItem -> SCHEDULED"
          - "for each item: its RepairNotice DELINQUENT -> CITY_REPAIR_SCHEDULED and defect segments -> REPAIR_IN_PROGRESS"
          - "increments BidBatch.version by 1"
        note: "Depth-3 cascade: award -> Bid -> BatchWorkItem -> RepairNotice."
      - from: AWARDED
        to: WORK_IN_PROGRESS
        trigger: "POST /bid-batches/{id}/start-work"
        actor: ProgramCoordinator
        preconditions:
          - "batch.status == AWARDED (else ERR_INVALID_BATCH_STATE)"
          - "logical clock >= work_window_start (date compare) (else ERR_WORK_WINDOW_NOT_REACHED)"
        side_effects: ["increments BidBatch.version by 1"]
      - from: WORK_IN_PROGRESS
        to: COMPLETED
        trigger: "system (POST /batch-work-items/{id}/verify cascade)"
        actor: system
        preconditions:
          - "every BatchWorkItem with batch_id == this batch has status VERIFIED"
        side_effects: ["increments BidBatch.version by 1"]
        note: "Compound shape: parent state derived from children."
      - from: OPEN_FOR_ITEMS
        to: CANCELLED
        trigger: "POST /bid-batches/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "batch.status in {OPEN_FOR_ITEMS, SEALED_FOR_BIDDING} (else ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "every POOLED BatchWorkItem -> REMOVED (referenced notices stay DELINQUENT)"
          - "increments BidBatch.version by 1"
      - from: SEALED_FOR_BIDDING
        to: CANCELLED
        trigger: "POST /bid-batches/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "batch.status in {OPEN_FOR_ITEMS, SEALED_FOR_BIDDING} (else ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "every POOLED BatchWorkItem -> REMOVED; every SUBMITTED Bid -> NOT_AWARDED"
          - "increments BidBatch.version by 1"

  - entity: BatchWorkItem
    initial_state: POOLED
    terminal_states: [VERIFIED, REMOVED]
    transitions:
      - from: POOLED
        to: REMOVED
        trigger: "POST /batch-work-items/{id}/remove or batch cancel cascade"
        actor: ProgramCoordinator
        preconditions:
          - "item.status == POOLED (else ERR_INVALID_WORK_ITEM_STATE)"
          - "batch.status == OPEN_FOR_ITEMS when removed directly (else ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "batch.estimated_total_cents recomputed without this item"
          - "increments BatchWorkItem.version by 1 and BidBatch.version by 1"
      - from: POOLED
        to: SCHEDULED
        trigger: "system (batch award cascade)"
        actor: system
        preconditions: ["batch transitioned to AWARDED"]
        side_effects: ["increments BatchWorkItem.version by 1"]
      - from: SCHEDULED
        to: WORK_COMPLETED
        trigger: "POST /batch-work-items/{id}/complete"
        actor: Contractor
        preconditions:
          - "item.status == SCHEDULED (else ERR_INVALID_WORK_ITEM_STATE)"
          - "batch.status == WORK_IN_PROGRESS (else ERR_INVALID_BATCH_STATE)"
          - "X-User-ID == the awarded bid's contractor_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["increments BatchWorkItem.version by 1"]
      - from: WORK_COMPLETED
        to: VERIFIED
        trigger: "POST /batch-work-items/{id}/verify"
        actor: Inspector
        preconditions:
          - "item.status == WORK_COMPLETED (else ERR_INVALID_WORK_ITEM_STATE)"
          - "X-User-ID != recorded_by_inspector_id of every defect on the item's notice (segregation, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "every Defect of the item's notice UNDER_REPAIR -> VERIFIED"
          - "segments whose open_defect_count becomes 0 -> RESTORED"
          - "when all items of the notice are VERIFIED: RepairNotice CITY_REPAIR_SCHEDULED -> CITY_REPAIR_COMPLETED"
          - "when all items of the batch are VERIFIED: BidBatch WORK_IN_PROGRESS -> COMPLETED"
          - "increments BatchWorkItem.version by 1"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, WITHDRAWN, AWARDED, NOT_AWARDED]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a new POST /bids by the same contractor on the same batch)"
        actor: system
        preconditions: ["prior bid by the same contractor exists with status SUBMITTED"]
        side_effects: ["only the newest SUBMITTED bid per (batch, contractor) is award-eligible"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /bids/{id}/withdraw"
        actor: Contractor
        preconditions:
          - "bid.status == SUBMITTED (else ERR_INVALID_BID_STATE)"
          - "X-User-ID == bid.contractor_id (else ERR_OWNERSHIP_MISMATCH)"
          - "batch.status == SEALED_FOR_BIDDING (else ERR_INVALID_BATCH_STATE)"
        side_effects: ["increments Bid.version by 1"]
      - from: SUBMITTED
        to: AWARDED
        trigger: "system (batch award)"
        actor: system
        preconditions: ["bid ranked first per bid_award_selection"]
        side_effects: []
      - from: SUBMITTED
        to: NOT_AWARDED
        trigger: "system (batch award or batch cancel)"
        actor: system
        preconditions: ["another bid won, or the batch was cancelled"]
        side_effects: []

  - entity: ForestryReview
    initial_state: PENDING
    terminal_states: [CLEARED]
    transitions:
      - from: PENDING
        to: DECIDED
        trigger: "POST /forestry-reviews/{id}/decision with decision=PRUNE_APPROVED or REMOVAL_ORDERED"
        actor: ForestryOfficer
        preconditions:
          - "review.status == PENDING (else ERR_INVALID_FORESTRY_STATE)"
        side_effects:
          - "decision and decided_by_user_id set"
          - "increments ForestryReview.version by 1"
      - from: PENDING
        to: CLEARED
        trigger: "POST /forestry-reviews/{id}/decision with decision=NO_CITY_CONFLICT"
        actor: ForestryOfficer
        preconditions:
          - "review.status == PENDING (else ERR_INVALID_FORESTRY_STATE)"
        side_effects:
          - "decision set; work_completed_at stays null"
          - "linked Defect AWAITING_FORESTRY -> UNDER_REPAIR when referenced by a non-terminal notice, else -> OPEN"
          - "increments ForestryReview.version by 1"
      - from: DECIDED
        to: CLEARED
        trigger: "POST /forestry-reviews/{id}/clear"
        actor: ForestryOfficer
        preconditions:
          - "review.status == DECIDED (else ERR_INVALID_FORESTRY_STATE)"
        side_effects:
          - "work_completed_at := logical clock"
          - "linked Defect AWAITING_FORESTRY -> UNDER_REPAIR when referenced by a non-terminal notice, else -> OPEN"
          - "increments ForestryReview.version by 1"

  - entity: LienCase
    initial_state: ASSESSED
    terminal_states: [SATISFIED, FORECLOSURE_REFERRED]
    transitions:
      - from: ASSESSED
        to: RECORDED
        trigger: "POST /lien-cases/{id}/record"
        actor: FinanceOfficer
        preconditions:
          - "lien.status == ASSESSED (else ERR_INVALID_LIEN_STATE)"
        side_effects: ["increments LienCase.version by 1"]
      - from: RECORDED
        to: PARTIALLY_PAID
        trigger: "POST /lien-cases/{id}/payments"
        actor: PropertyOwner
        preconditions:
          - "lien.status in {RECORDED, PARTIALLY_PAID} (else ERR_INVALID_LIEN_STATE)"
          - "acting owner owns lien.parcel_id (else ERR_OWNERSHIP_MISMATCH)"
          - "amount_cents > 0 (else ERR_INVALID_REQUEST) and amount_cents <= current outstanding incl. interest accrued to payment date (else ERR_PAYMENT_EXCEEDS_BALANCE)"
        side_effects:
          - "lien_interest_accrual applied at payment date (per-event rounding), payment applied interest-first then principal"
          - "increments LienCase.version by 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /lien-cases/{id}/payments"
        actor: PropertyOwner
        preconditions: ["same as RECORDED -> PARTIALLY_PAID"]
        side_effects: ["same as RECORDED -> PARTIALLY_PAID"]
      - from: RECORDED
        to: SATISFIED
        trigger: "POST /lien-cases/{id}/payments (payment covers full outstanding)"
        actor: PropertyOwner
        preconditions: ["same as RECORDED -> PARTIALLY_PAID; resulting outstanding_balance_cents == 0"]
        side_effects:
          - "RepairNotice LIENED -> CLOSED; parcel.delinquency_flag recomputed"
          - "increments LienCase.version by 1"
      - from: PARTIALLY_PAID
        to: SATISFIED
        trigger: "POST /lien-cases/{id}/payments (payment covers full outstanding)"
        actor: PropertyOwner
        preconditions: ["same as RECORDED -> SATISFIED"]
        side_effects: ["same as RECORDED -> SATISFIED"]
      - from: RECORDED
        to: FORECLOSURE_REFERRED
        trigger: "POST /lien-cases/{id}/foreclosure-referral"
        actor: FinanceOfficer
        preconditions:
          - "lien.status in {RECORDED, PARTIALLY_PAID} (else ERR_INVALID_LIEN_STATE)"
          - "logical clock >= assessed_at + 90 days (else ERR_FORECLOSURE_TOO_EARLY)"
          - "outstanding_balance_cents (incl. accrued interest to date) > 0"
        side_effects: ["increments LienCase.version by 1"]
      - from: PARTIALLY_PAID
        to: FORECLOSURE_REFERRED
        trigger: "POST /lien-cases/{id}/foreclosure-referral"
        actor: FinanceOfficer
        preconditions: ["same as RECORDED -> FORECLOSURE_REFERRED"]
        side_effects: ["increments LienCase.version by 1"]

  - entity: Defect
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: AWAITING_FORESTRY
        trigger: "system (at creation when defect_type == TREE_ROOT_UPHEAVAL and city_tree_involved == true)"
        actor: system
        preconditions: []
        side_effects:
          - "a ForestryReview with status PENDING is auto-created for this defect"
        note: "Creation lands directly in AWAITING_FORESTRY; OPEN is the initial state only for non-forestry defects."
      - from: AWAITING_FORESTRY
        to: OPEN
        trigger: "system (ForestryReview -> CLEARED)"
        actor: system
        preconditions:
          - "defect is NOT referenced by any non-terminal RepairNotice"
        side_effects: []
        note: "Forestry loop: OPEN -> AWAITING_FORESTRY -> OPEN."
      - from: AWAITING_FORESTRY
        to: UNDER_REPAIR
        trigger: "system (ForestryReview -> CLEARED)"
        actor: system
        preconditions:
          - "defect IS referenced by a non-terminal RepairNotice (its repair was noticed while root work was pending)"
        side_effects: []
      - from: OPEN
        to: UNDER_REPAIR
        trigger: "system (POST /repair-notices/{id}/issue)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REPAIR
        to: OPEN
        trigger: "system (appeal REVERSED -> notice VOID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REPAIR
        to: VERIFIED
        trigger: "system (inspection PASS on notice, or work-item verify)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SidewalkSegment
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: FLAGGED
        trigger: "system (first Defect created on the segment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FLAGGED
        to: UNDER_NOTICE
        trigger: "system (notice issued covering a defect of this segment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_NOTICE
        to: FLAGGED
        trigger: "system (notice VOID and no other active notice covers this segment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_NOTICE
        to: REPAIR_IN_PROGRESS
        trigger: "system (batch award schedules a work item whose notice covers this segment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REPAIR_IN_PROGRESS
        to: RESTORED
        trigger: "system (open_defect_count becomes 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_NOTICE
        to: RESTORED
        trigger: "system (open_defect_count becomes 0 via inspection PASS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FLAGGED
        to: RESTORED
        trigger: "system (open_defect_count becomes 0)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: notice-extension-stale-version
    parent_entity: RepairNotice
    write_endpoint: "POST /repair-notices/{id}/extensions"
    occ_field: "expected_notice_version"
    description: |
      Extending a notice's compliance deadline against a stale observed
      RepairNotice.version is rejected. Multiple sequential extensions are
      legitimate under the product rules, so a client whose view of the notice
      predates the latest mutation must re-read and retry.
    error_id: ERR_STALE_NOTICE_VERSION
    http_status: 412
  - rule_id: bid-create-stale-batch-version
    parent_entity: BidBatch
    write_endpoint: "POST /bids"
    occ_field: "expected_batch_version"
    description: |
      Submitting (or superseding) a bid against a stale observed
      BidBatch.version is rejected, because the bidder's price was computed
      against a work-item list that may have changed since. Each accepted bid
      creation increments BidBatch.version, so a later request carrying an
      earlier expected_batch_version fails deterministically.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
  - rule_id: cycle-adjustment-stale-version
    parent_entity: ProgramCycle
    write_endpoint: "POST /program-cycles/{id}/appropriation-adjustments"
    occ_field: "expected_program_cycle_version"
    description: |
      Adjusting a cycle's appropriation against a stale observed
      ProgramCycle.version is rejected. Appropriation adjustments are
      individually legitimate, so staleness can only be detected via the
      cycle's version counter.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: defect_severity_classification
    trigger: "defect creation (POST /defects)"
    algorithm: threshold
    formula: |
      Weights for downstream scoring: MINOR=25, MAJOR=60, TRIP_HAZARD=100.
      Classification by defect_type (boundary comparisons are >=, inclusive):
        VERTICAL_SEPARATION or TREE_ROOT_UPHEAVAL:
          measured_offset_inches >= 0.50 -> TRIP_HAZARD
          0.25 <= measured_offset_inches < 0.50 -> MAJOR
          measured_offset_inches < 0.25 -> MINOR
        HORIZONTAL_OPENING:
          measured_offset_inches >= 0.50 -> MAJOR else MINOR
        SETTLEMENT:
          area_sqft >= 9 -> MAJOR else MINOR
        SPALLING or CRUMBLED_JOINT:
          area_sqft >= 16 -> MAJOR else MINOR
    input_set: "the defect being created"
    constants:
      TRIP_THRESHOLD_INCHES: 0.5
      MAJOR_OFFSET_INCHES: 0.25
      SETTLEMENT_MAJOR_SQFT: 9
      SPALLING_MAJOR_SQFT: 16
    precision: "offset compared exactly as given (2-decimal inputs compared without rounding)"

  - name: segment_condition_index
    trigger: "defect creation; defect -> VERIFIED; defect UNDER_REPAIR -> OPEN (appeal reversal)"
    algorithm: weighted_scoring
    formula: |
      Input set: defects of the segment with status in {OPEN, AWAITING_FORESTRY, UNDER_REPAIR}.
      severity weight w: MINOR=25, MAJOR=60, TRIP_HAZARD=100.
      If input set empty: both variants := 0.
    input_set: "non-verified defects of one SidewalkSegment"
    precision: "area_weighted to 1 decimal, round_half_up"
    variants:
      - name: screening
        when: "stored as SidewalkSegment.condition_screening"
        difference: "max severity weight over the input set (worst defect dominates; integer)"
      - name: area_weighted
        when: "stored as SidewalkSegment.condition_area_weighted"
        difference: "round_half_up( SUM(w * area_sqft) / SUM(area_sqft), 1 decimal ) over the input set"
    note: "Same defect set, two valid aggregations, different values whenever more than one defect exists."

  - name: owner_responsibility_determination
    trigger: "parcel creation (POST /parcels)"
    algorithm: threshold
    formula: |
      if is_city_owned: owner_responsibility_pct := 0   # city self-repairs; parcel cannot be noticed
      else:             owner_responsibility_pct := 100 # ordinance: abutting owner is fully responsible
    input_set: "the parcel being created"
    precision: "integer percent"

  - name: cost_share_pct
    trigger: "application creation (POST /cost-share-applications)"
    algorithm: tiered_pricing
    formula: |
      share_pct = min(SHARE_CAP, BASE_CITY_SHARE + street_bonus + hardship_bonus)
      street_bonus: ARTERIAL=20, COLLECTOR=10, LOCAL=0
      hardship_bonus: LOW_INCOME=30, SENIOR_65=20, NONE=0
    input_set: "parcel.street_class + owner.hardship_tier"
    constants:
      BASE_CITY_SHARE: 50
      ARTERIAL_BONUS: 20
      COLLECTOR_BONUS: 10
      SENIOR_BONUS: 20
      LOW_INCOME_BONUS: 30
      SHARE_CAP: 90
    precision: "integer percent"

  - name: ramp_upgrade_trigger
    trigger: "application creation; work-item creation"
    algorithm: constraint_propagation
    formula: |
      ramp_upgrade_required (application) / includes_ramp_upgrade (work item) := true iff
      the source notice's defect_ids contains at least one defect whose segment has
      is_corner_segment == true AND has_existing_curb_ramp == false.
    input_set: "defects in the notice's defect_ids, joined to their SidewalkSegment"

  - name: provisional_award
    trigger: "application creation (POST /cost-share-applications)"
    algorithm: forward_looking
    formula: |
      1. repair_estimate := round_half_up(estimated_qty_sqft * ENGINEER_UNIT_RATE_CENTS)
      2. ramp_allowance := RAMP_FLAT_CENTS if ramp_upgrade_required else 0
      3. city_repair_share := round_half_up(repair_estimate * share_pct / 100)
      4. uncapped := city_repair_share + ramp_allowance
      5. lifetime_remaining := PER_PARCEL_LIFETIME_CAP_CENTS - S, where S = sum over the parcel's
         applications with review_status in {APPROVED, OBLIGATED} of provisional_award_cents
         plus sum over review_status == REIMBURSED of final_award_cents
         (if lifetime_remaining <= 0 the creation fails with ERR_PARCEL_LIFETIME_CAP_REACHED)
      6. provisional_award_cents := min(PER_APPLICATION_CAP_CENTS, uncapped, lifetime_remaining)
    input_set: "the new application + sibling applications on the same parcel"
    constants:
      ENGINEER_UNIT_RATE_CENTS: 1200
      RAMP_FLAT_CENTS: 250000
      PER_APPLICATION_CAP_CENTS: 400000
      PER_PARCEL_LIFETIME_CAP_CENTS: 800000
    precision: "integer cents, round_half_up at steps 1 and 3 (per-component rounding, then sum — pinned order)"
    variants:
      - name: engineer_estimate
        when: "at creation; this is the variant stored in provisional_award_cents"
        difference: "uses the city engineer unit rate 1200 cents/sqft regardless of any later actual cost"

  - name: final_award
    trigger: "reimbursement (POST /cost-share-applications/{id}/reimburse)"
    algorithm: chronological
    formula: |
      1. repair_part := round_half_up(final_repair_cost_cents * share_pct / 100)
      2. ramp_part := min(ramp_receipt_cents, RAMP_FLAT_CENTS) when ramp_upgrade_required
                      else 0 (a nonzero ramp_receipt_cents without ramp_upgrade_required
                      fails with ERR_INVALID_REQUEST)
      3. uncapped := repair_part + ramp_part
      4. lifetime_remaining recomputed as in provisional_award at reimbursement time
      5. final_award_cents := min(PER_APPLICATION_CAP_CENTS, uncapped, lifetime_remaining)
    input_set: "the OBLIGATED application + reimbursement inputs"
    precision: "integer cents, round_half_up per component, then sum (same pinned order as provisional)"
    variants:
      - name: actual_invoice
        when: "at reimbursement; stored in final_award_cents"
        difference: "uses the owner-submitted actual invoice instead of the engineer rate, so for identical scope the two variants diverge whenever actual != estimate"
    note: "Dual variant pair with provisional_award on the CostShareApplication fiscal domain."

  - name: program_cap_reservation
    trigger: "obligate; reimburse; appropriation adjustment"
    algorithm: waterfall_allocation
    formula: |
      Funds identity (must hold after every mutation):
        appropriation_cents == committed_cents + disbursed_cents + available_cents
      Obligate (evaluated strictly at request time against the CURRENT committed_cents,
      which already reflects every earlier obligation and release in request order —
      there is no priority by approval order):
        require committed_cents + provisional_award_cents <= appropriation_cents  (equality allowed)
        then committed_cents += provisional_award_cents
      Reimburse:
        require committed_cents - provisional_award_cents + disbursed_cents + final_award_cents <= appropriation_cents
        then committed_cents -= provisional_award_cents; disbursed_cents += final_award_cents
      Release (withdraw/cancel from OBLIGATED): committed_cents -= provisional_award_cents
      Appropriation adjustment: appropriation_cents += delta_cents, but the result must stay
        >= committed_cents + disbursed_cents (else ERR_APPROPRIATION_BELOW_OBLIGATIONS)
    input_set: "one ProgramCycle"
    precision: "integer cents"
    note: "Circular-looking dependency (cap check depends on committed, which depends on prior cap checks) is pinned by evaluate-at-request-time ordering."

  - name: batch_engineer_estimate
    trigger: "work-item creation and removal"
    algorithm: aggregation
    formula: |
      BidBatch.estimated_total_cents := sum over items with status == POOLED of
        round_half_up(scope_sqft * engineer_unit_rate_cents)
      (items leaving POOLED via REMOVED drop out; SCHEDULED items remain included until VERIFIED/REMOVED —
       after seal the set is frozen, so the estimate is stable while SEALED_FOR_BIDDING)
    input_set: "BatchWorkItem rows of the batch with status POOLED (or SCHEDULED after award)"
    precision: "integer cents, round per item then sum (pinned order)"

  - name: bid_award_selection
    trigger: "bid submission (evaluated_total snapshot) and batch award (recompute + select)"
    algorithm: weighted_scoring
    formula: |
      evaluated_total_cents(bid) := unit_rate_cents * total_scope + ramp_flat_fee_cents * ramp_item_count
        where total_scope = sum of scope_sqft over the batch's POOLED items
        and ramp_item_count = count of POOLED items with includes_ramp_upgrade == true
      Eligibility filter at award (a bid is eligible iff ALL hold):
        bid.status == SUBMITTED
        contractor.is_suspended == false
        contractor.insurance_valid_until >= batch.work_window_end (date compare)
        no half-open window conflict: for every other batch B2 held by the same contractor
          with B2.status in {AWARDED, WORK_IN_PROGRESS}, NOT (batch.work_window_start < B2.work_window_end
          AND B2.work_window_start < batch.work_window_end); half-open semantics: an existing window
          ending exactly at this batch's start does NOT conflict
      Ranking: evaluated_total_cents ASC; tie -> submitted_at ASC; further tie -> contractor.license_number ASC
      Empty eligible set -> ERR_NO_ELIGIBLE_BIDS
    input_set: "bids of the batch with status SUBMITTED, joined to Contractor"
    precision: "integer cents"
    note: "Selector determinism pinned: eligibility filter + ranking + two deterministic tie-breaks + empty-pool error. id is never used."

  - name: lien_principal_net
    trigger: "lien creation (POST /lien-cases)"
    algorithm: weighted_scoring
    formula: |
      1. admin_fee_cents := max(ADMIN_FEE_MIN_CENTS, round_half_up(actual_repair_cost_cents * ADMIN_FEE_PCT / 100))
      2. city_caused_area := sum of area_sqft over the notice's defects where
           defect_type == TREE_ROOT_UPHEAVAL AND city_tree_involved == true AND the defect's
           ForestryReview.decision in {PRUNE_APPROVED, REMOVAL_ORDERED}
      3. total_scope_area := sum of area_sqft over ALL defects in the notice's defect_ids
           (== 0 -> ERR_ZERO_SCOPE_AREA)
      4. city_credit_cents := round_half_up(actual_repair_cost_cents * city_caused_area / total_scope_area)
           (multiply first, then divide, then round — pinned order)
      5. owner_principal_cents := actual_repair_cost_cents - city_credit_cents + admin_fee_cents
      6. principal_remaining_cents := owner_principal_cents; accrued_interest_cents := 0; last_accrual_day := 0
    input_set: "the lien's notice and its defects (with their ForestryReview decisions)"
    constants:
      ADMIN_FEE_MIN_CENTS: 15000
      ADMIN_FEE_PCT: 10
    precision: "integer cents, round_half_up, multiply-then-divide"

  - name: lien_interest_accrual
    trigger: "payment event; statement/payoff read (GET /lien-cases/{id}, GET /lien-cases/{id}/payoff-quote)"
    algorithm: chronological
    formula: |
      Days are whole days between dates (assessed date = day 0).
      Pinned order at each payment event with payment-date day D:
        1. interest_due := round_half_up(principal_remaining_cents * interest_rate_bp * (D - last_accrual_day) / 3650000)
        2. accrued_interest_cents += interest_due; last_accrual_day := D
        3. waterfall application: payment covers accrued_interest_cents first; any remainder reduces
           principal_remaining_cents
        4. outstanding_balance_cents := principal_remaining_cents + accrued_interest_cents
      Rounding at each event, interest-first — a single end-to-end computation, or principal-first
      application, produces different cents and is NOT the pinned behavior.
    input_set: "one LienCase"
    constants:
      PAYOFF_GOOD_THROUGH_DAYS: 15
      DAYS_PER_YEAR_X10000: 3650000
    precision: "integer cents, round_half_up per accrual event"
    variants:
      - name: statement_balance
        when: "GET /lien-cases/{id} — accrued_interest_cents as stored, plus projected interest to the current clock day"
        difference: "interest projected through the current logical clock day"
      - name: payoff_quote
        when: "GET /lien-cases/{id}/payoff-quote"
        difference: "interest projected through current clock day + PAYOFF_GOOD_THROUGH_DAYS (15), so the quote exceeds the same-day statement balance whenever principal remains"
    note: "Dual variant pair with statement_balance on the LienCase fiscal domain."

  - name: compliance_deadline
    trigger: "notice issue; appeal decision UPHELD"
    algorithm: threshold
    formula: |
      At issue: compliance_deadline := issued_at + base_deadline_days days
                                     + (HARDSHIP_EXTENSION_DAYS days if parcel owner.hardship_tier != NONE else 0)
      At appeal UPHELD: compliance_deadline := appeal_decided_at + APPEAL_RESET_DAYS days (replaces, does not extend)
      Delinquency fires only when logical clock > compliance_deadline (strict; equality still compliant).
    input_set: "the RepairNotice and its parcel's owner"
    constants:
      DEFAULT_BASE_DEADLINE_DAYS: 45
      HARDSHIP_EXTENSION_DAYS: 30
      APPEAL_RESET_DAYS: 15
      APPROVAL_EXPIRY_DAYS: 60
      FORECLOSURE_MIN_DAYS: 90
      CURE_BUFFER_DAYS: 7
    precision: "datetime at day granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be one of the declared roles; for entity_backed roles X-User-ID must reference an existing entity of the backing type (else that entity's NOT_FOUND at priority 4 semantics via ERR_CONTRACTOR_NOT_FOUND / ERR_PROPERTY_OWNER_NOT_FOUND)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership/scope: PropertyOwner may only act on resources whose parcel chain yields owner_id == X-User-ID; Contractor may only complete items of batches it won and withdraw its own bids"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "owner-scoped mutations (appeal, resubmit, withdraw, lien payments, application create) and contractor-scoped mutations (bid withdraw, item complete)"

  - priority: 4
    category: existence
    check: "Path ids and body FK ids reference existing resources, validated left-to-right (path first, then body fields in declaration order)"
    error_id: "ERR_PROGRAM_CYCLE_NOT_FOUND | ERR_PROPERTY_OWNER_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_DEFECT_NOT_FOUND | ERR_REPAIR_NOTICE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_BID_BATCH_NOT_FOUND | ERR_WORK_ITEM_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_FORESTRY_REVIEW_NOT_FOUND | ERR_LIEN_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK inputs"

  - priority: 5
    category: state
    check: "Target resource(s) in the required state for the operation (per state machine; covers ERR_INVALID_NOTICE_STATE, ERR_INVALID_DEFECT_STATE, ERR_INVALID_APPLICATION_STATE, ERR_INVALID_BATCH_STATE, ERR_INVALID_WORK_ITEM_STATE, ERR_INVALID_BID_STATE, ERR_INVALID_FORESTRY_STATE, ERR_INVALID_LIEN_STATE, ERR_INVALID_CYCLE_STATE, ERR_CYCLE_NOT_OPEN, ERR_NOTICE_NOT_COMPLIANT)"
    error_id: "ERR_INVALID_*_STATE / ERR_CYCLE_NOT_OPEN / ERR_NOTICE_NOT_COMPLIANT"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version (per §1.2.1)"
    error_id: "ERR_STALE_NOTICE_VERSION | ERR_STALE_BATCH_VERSION | ERR_STALE_CYCLE_VERSION"
    http_status: 412
    applies_to: "POST /repair-notices/{id}/extensions, POST /bids, POST /program-cycles/{id}/appropriation-adjustments"

  - priority: 7
    category: business_referential
    check: "Referential integrity of composition: every defect_ids element belongs to the notice parcel's segments (ERR_DEFECT_NOT_IN_PARCEL); no defect is already covered by another non-terminal notice (ERR_DEFECT_UNDER_ACTIVE_NOTICE); defect_ids non-empty (ERR_NO_ELIGIBLE_DEFECTS); parcel is noticable (owner_responsibility_pct > 0, else ERR_CITY_PARCEL_NOT_NOTICABLE); work-item notice is not already pooled/scheduled in any batch (ERR_NOTICE_ALREADY_POOLED); prior_notice_id references a VOID notice on the same parcel (ERR_INVALID_NOTICE_REFERENCE); application parcel_id matches notice.parcel_id (ERR_PARCEL_NOTICE_MISMATCH)"
    error_id: "ERR_DEFECT_NOT_IN_PARCEL | ERR_DEFECT_UNDER_ACTIVE_NOTICE | ERR_NO_ELIGIBLE_DEFECTS | ERR_CITY_PARCEL_NOT_NOTICABLE | ERR_NOTICE_ALREADY_POOLED | ERR_INVALID_NOTICE_REFERENCE | ERR_PARCEL_NOTICE_MISMATCH"
    http_status: 422
    applies_to: "POST /repair-notices, POST /batch-work-items, POST /cost-share-applications"

  - priority: 8
    category: business_safety
    check: "Regulatory segregation and public-safety gates: appeal decider != notice issuer; compliance inspector != recorder of any covered defect; work-item verifier != recorder of any covered defect (ERR_SEGREGATION_OF_DUTIES); batch award blocked while any covered tree-root ForestryReview is not CLEARED (ERR_FORESTRY_NOT_CLEARED)"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_FORESTRY_NOT_CLEARED"
    http_status: 403
    applies_to: "POST /repair-notices/{id}/appeal-decision, POST /repair-notices/{id}/inspections, POST /batch-work-items/{id}/verify, POST /bid-batches/{id}/award"
    note: "ERR_FORESTRY_NOT_CLEARED returns http 409; ERR_SEGREGATION_OF_DUTIES returns 403."

  - priority: 9
    category: business_temporal
    check: "Time-window checks against the logical clock: appeal only while clock <= compliance_deadline (ERR_APPEAL_WINDOW_CLOSED); bids only while clock <= bid_deadline (ERR_BID_DEADLINE_PASSED); award only when clock > bid_deadline (ERR_BID_WINDOW_STILL_OPEN); start-work only when clock >= work_window_start (ERR_WORK_WINDOW_NOT_REACHED); obligate only while clock <= approval_expires_at (ERR_APPLICATION_EXPIRED); foreclosure only when clock >= assessed_at + 90d (ERR_FORECLOSURE_TOO_EARLY)"
    error_id: "ERR_APPEAL_WINDOW_CLOSED | ERR_BID_DEADLINE_PASSED | ERR_BID_WINDOW_STILL_OPEN | ERR_WORK_WINDOW_NOT_REACHED | ERR_APPLICATION_EXPIRED | ERR_FORECLOSURE_TOO_EARLY"
    http_status: 422
    applies_to: "appeal, bids, award, start-work, obligate, foreclosure-referral"

  - priority: 10
    category: business_constraint
    check: "Uniqueness and capacity-of-one constraints: parcel_number unique (ERR_DUPLICATE_PARCEL_NUMBER); segment_code unique (ERR_DUPLICATE_SEGMENT_CODE); contractor license_number unique (ERR_DUPLICATE_LICENSE_NUMBER); at most one non-terminal application per notice (ERR_APPLICATION_ALREADY_ACTIVE); at most one non-terminal lien per notice (ERR_LIEN_ALREADY_EXISTS); cycle windows disjoint under closed-interval semantics (ERR_CYCLE_WINDOW_OVERLAP); contractor not suspended (ERR_CONTRACTOR_SUSPENDED); insurance covers the full work window (ERR_INSURANCE_INVALID); seal requires >= 1 POOLED item (ERR_EMPTY_BATCH); lien total_scope_area > 0 (ERR_ZERO_SCOPE_AREA); payment amount_cents <= outstanding (ERR_PAYMENT_EXCEEDS_BALANCE); appropriation stays >= committed + disbursed (ERR_APPROPRIATION_BELOW_OBLIGATIONS); close requires no in-flight applications (ERR_CYCLE_HAS_OPEN_APPLICATIONS)"
    error_id: "ERR_DUPLICATE_PARCEL_NUMBER | ERR_DUPLICATE_SEGMENT_CODE | ERR_DUPLICATE_LICENSE_NUMBER | ERR_APPLICATION_ALREADY_ACTIVE | ERR_LIEN_ALREADY_EXISTS | ERR_CYCLE_WINDOW_OVERLAP | ERR_CONTRACTOR_SUSPENDED | ERR_INSURANCE_INVALID | ERR_EMPTY_BATCH | ERR_ZERO_SCOPE_AREA | ERR_PAYMENT_EXCEEDS_BALANCE | ERR_APPROPRIATION_BELOW_OBLIGATIONS | ERR_CYCLE_HAS_OPEN_APPLICATIONS"
    http_status: 409
    applies_to: "creation and lifecycle endpoints as listed"
    note: "ERR_CONTRACTOR_SUSPENDED returns 403; ERR_INSURANCE_INVALID, ERR_ZERO_SCOPE_AREA, ERR_PAYMENT_EXCEEDS_BALANCE, ERR_APPROPRIATION_BELOW_OBLIGATIONS return 422; the rest return 409."

  - priority: 11
    category: business_fiscal
    check: "Fiscal caps last: program appropriation cap at obligate/reimburse (ERR_PROGRAM_CAP_EXCEEDED, equality allowed); parcel lifetime cap exhausted at application creation (ERR_PARCEL_LIFETIME_CAP_REACHED)"
    error_id: "ERR_PROGRAM_CAP_EXCEEDED | ERR_PARCEL_LIFETIME_CAP_REACHED"
    http_status: 402
    applies_to: "POST /cost-share-applications, POST /cost-share-applications/{id}/obligate, POST /cost-share-applications/{id}/reimburse"
    note: "ERR_PARCEL_LIFETIME_CAP_REACHED returns 422; ERR_PROGRAM_CAP_EXCEEDED returns 402."

  - priority: 0
    category: existence
    check: "Request-shape sanity before everything: unknown payload fields, missing required fields, wrong types, non-positive quantities, invalid enum members, window_start >= window_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    note: "Priority 0: malformed requests fail before auth lookups only where no header is needed to parse the body; otherwise immediately after priority 1."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- ProgramCycle ---
  - method: POST
    path: "/program-cycles"
    description: "Create a program funding cycle; windows must be disjoint under closed-interval semantics (end == other's start IS an overlap)"
    roles: [ProgramCoordinator]
    code: 201
    input: [cycle_year, window_start_date, window_end_date, appropriation_cents]
    output: ProgramCycle
    side_effects: ["committed_cents, disbursed_cents := 0; available_cents := appropriation_cents; status := OPEN"]
  - method: GET
    path: "/program-cycles/{id}"
    description: "Read one cycle including committed/disbursed/available balances"
    roles: &all_roles [ProgramCoordinator, Inspector, ForestryOfficer, FinanceOfficer, HearingOfficer, PropertyOwner, Contractor]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: []
  - method: POST
    path: "/program-cycles/{id}/lock"
    description: "OPEN -> LOCKED (no new applications/obligations)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["status := LOCKED; increments ProgramCycle.version by 1"]
  - method: POST
    path: "/program-cycles/{id}/close"
    description: "LOCKED -> CLOSED; requires no in-flight applications"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["status := CLOSED; increments ProgramCycle.version by 1"]
  - method: POST
    path: "/program-cycles/{id}/appropriation-adjustments"
    description: "Adjust appropriation by delta_cents (negative allowed down to committed+disbursed); OCC on cycle version"
    roles: [FinanceOfficer]
    code: 200
    input: [delta_cents, expected_program_cycle_version]
    output: ProgramCycle
    side_effects: ["appropriation_cents += delta_cents; available_cents recomputed; increments ProgramCycle.version by 1"]

  # --- PropertyOwner / PropertyParcel / SidewalkSegment / Defect (inventory) ---
  - method: POST
    path: "/property-owners"
    description: "Register a property owner with verified hardship tier"
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, mailing_address, "hardship_tier?"]
    output: PropertyOwner
    side_effects: []
  - method: GET
    path: "/property-owners/{id}"
    description: "Read one property owner"
    roles: *all_roles
    code: 200
    input: []
    output: PropertyOwner
    side_effects: []
  - method: POST
    path: "/parcels"
    description: "Register a parcel; owner_responsibility_pct computed by ordinance"
    roles: [ProgramCoordinator]
    code: 201
    input: [parcel_number, owner_id, street_address, street_class, "is_corner_lot?", "is_city_owned?"]
    output: PropertyParcel
    side_effects: ["owner_responsibility_pct computed; delinquency_flag := false"]
  - method: GET
    path: "/parcels"
    description: "List parcels; owner_id filter returns parcels of one owner"
    roles: *all_roles
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: "PropertyParcel[]"
    side_effects: []
  - method: GET
    path: "/parcels/{id}"
    description: "Read one parcel"
    roles: *all_roles
    code: 200
    input: []
    output: PropertyParcel
    side_effects: []
  - method: POST
    path: "/segments"
    description: "Register a sidewalk segment in the condition inventory"
    roles: [Inspector]
    code: 201
    input: [parcel_id, segment_code, length_ft, width_ft, "is_corner_segment?", "has_existing_curb_ramp?"]
    output: SidewalkSegment
    side_effects: ["status := IN_SERVICE; condition indexes := 0"]
  - method: GET
    path: "/segments"
    description: "List segments; parcel_id filter returns segments of one parcel"
    roles: *all_roles
    code: 200
    input: ["parcel_id?", "limit?", "offset?"]
    output: "SidewalkSegment[]"
    side_effects: []
  - method: GET
    path: "/segments/{id}"
    description: "Read one segment"
    roles: *all_roles
    code: 200
    input: []
    output: SidewalkSegment
    side_effects: []
  - method: POST
    path: "/defects"
    description: "Record and classify a defect; TREE_ROOT_UPHEAVAL with city_tree_involved auto-creates a PENDING ForestryReview and lands in AWAITING_FORESTRY"
    roles: [Inspector]
    code: 201
    input: [segment_id, defect_type, "measured_offset_inches?", area_sqft, "city_tree_involved?"]
    output: Defect
    side_effects:
      - "severity_class computed per defect_severity_classification"
      - "recorded_by_inspector_id := X-User-ID"
      - "segment: IN_SERVICE -> FLAGGED on first defect; open_defect_count and condition indexes recomputed"
      - "when defect_type == TREE_ROOT_UPHEAVAL and city_tree_involved: defect status := AWAITING_FORESTRY and a PENDING ForestryReview is created"
  - method: GET
    path: "/defects"
    description: "List defects; segment_id filter returns defects of one segment"
    roles: *all_roles
    code: 200
    input: ["segment_id?", "status?", "limit?", "offset?"]
    output: "Defect[]"
    side_effects: []
  - method: GET
    path: "/defects/{id}"
    description: "Read one defect"
    roles: *all_roles
    code: 200
    input: []
    output: Defect
    side_effects: []
  - method: GET
    path: "/defects/{id}/forestry-reviews"
    description: "List forestry reviews for one defect (0 or 1 elements)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "ForestryReview[]"
    side_effects: []

  # --- RepairNotice lifecycle ---
  - method: POST
    path: "/repair-notices"
    description: "Create a DRAFT notice covering OPEN or AWAITING_FORESTRY defects of one parcel"
    roles: [ProgramCoordinator]
    code: 201
    input: [parcel_id, defect_ids, "base_deadline_days?", "prior_notice_id?"]
    output: RepairNotice
    side_effects: ["status := DRAFT; appeal_status := NONE"]
  - method: GET
    path: "/repair-notices"
    description: "List notices; filter by parcel, prior notice (self-reference), or status"
    roles: *all_roles
    code: 200
    input: ["parcel_id?", "prior_notice_id?", "status?", "limit?", "offset?"]
    output: "RepairNotice[]"
    side_effects: []
  - method: GET
    path: "/repair-notices/{id}"
    description: "Read one notice"
    roles: *all_roles
    code: 200
    input: []
    output: RepairNotice
    side_effects: []
  - method: POST
    path: "/repair-notices/{id}/issue"
    description: "DRAFT -> ISSUED; computes deadline; defects -> UNDER_REPAIR"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: RepairNotice
    side_effects: ["per RepairNotice DRAFT->ISSUED transition"]
  - method: POST
    path: "/repair-notices/{id}/extensions"
    description: "Extend compliance_deadline by extra_days; OCC on notice version"
    roles: [ProgramCoordinator]
    code: 200
    input: [extra_days, expected_notice_version]
    output: RepairNotice
    side_effects: ["compliance_deadline += extra_days days; increments RepairNotice.version by 1"]
  - method: POST
    path: "/repair-notices/{id}/appeal"
    description: "ISSUED -> UNDER_APPEAL by the parcel's owner"
    roles: [PropertyOwner]
    code: 200
    input: [grounds]
    output: RepairNotice
    side_effects: ["per RepairNotice ISSUED->UNDER_APPEAL transition"]
  - method: POST
    path: "/repair-notices/{id}/appeal-decision"
    description: "Decide a pending appeal; UPHELD re-ISSUES with deadline = decided_at + 15d; REVERSED voids the notice"
    roles: [HearingOfficer]
    code: 200
    input: [decision]
    output: RepairNotice
    side_effects: ["per RepairNotice UNDER_APPEAL transitions"]
  - method: POST
    path: "/repair-notices/{id}/inspections"
    description: "Record a compliance inspection; PASS -> COMPLIANT (from ISSUED or DELINQUENT); FAIL after deadline -> DELINQUENT cascade"
    roles: [Inspector]
    code: 201
    input: [result, "notes?"]
    output: InspectionRecord
    side_effects: ["per RepairNotice inspection transitions"]
  - method: GET
    path: "/repair-notices/{id}/inspections"
    description: "List inspection records of one notice"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "InspectionRecord[]"
    side_effects: []

  # --- CostShareApplication lifecycle ---
  - method: POST
    path: "/cost-share-applications"
    description: "Owner applies for cost-share against an ISSUED notice in an OPEN cycle; share_pct, ramp flag, provisional award computed"
    roles: [PropertyOwner]
    code: 201
    input: [notice_id, parcel_id, cycle_id, estimated_qty_sqft]
    output: CostShareApplication
    side_effects: ["review_status := SUBMITTED; payment_status := UNFUNDED; provisional_award_cents computed"]
  - method: GET
    path: "/cost-share-applications"
    description: "List applications; filters combinable"
    roles: *all_roles
    code: 200
    input: ["notice_id?", "parcel_id?", "owner_id?", "cycle_id?", "limit?", "offset?"]
    output: "CostShareApplication[]"
    side_effects: []
  - method: GET
    path: "/cost-share-applications/{id}"
    description: "Read one application"
    roles: *all_roles
    code: 200
    input: []
    output: CostShareApplication
    side_effects: []
  - method: POST
    path: "/cost-share-applications/{id}/decision"
    description: "Coordinator decision: APPROVE | DENY | RETURN"
    roles: [ProgramCoordinator]
    code: 200
    input: [outcome, "reviewer_note?"]
    output: CostShareApplication
    side_effects: ["per CostShareApplication decision transitions"]
  - method: POST
    path: "/cost-share-applications/{id}/resubmit"
    description: "RETURNED -> SUBMITTED by the owning owner"
    roles: [PropertyOwner]
    code: 200
    input: []
    output: CostShareApplication
    side_effects: ["review_status := SUBMITTED; increments CostShareApplication.version by 1"]
  - method: POST
    path: "/cost-share-applications/{id}/obligate"
    description: "APPROVED -> OBLIGATED; reserves provisional award against the cycle cap"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CostShareApplication
    side_effects: ["per CostShareApplication APPROVED->OBLIGATED transition incl. ProgramCycle.committed_cents debit"]
  - method: POST
    path: "/cost-share-applications/{id}/withdraw"
    description: "Owner withdraws; from OBLIGATED also releases the reservation"
    roles: [PropertyOwner]
    code: 200
    input: []
    output: CostShareApplication
    side_effects: ["per CostShareApplication withdraw transitions"]
  - method: POST
    path: "/cost-share-applications/{id}/reimburse"
    description: "OBLIGATED -> REIMBURSED after notice COMPLIANT; computes final_award_cents (actual-invoice variant) and moves funds committed -> disbursed"
    roles: [FinanceOfficer]
    code: 200
    input: [final_repair_cost_cents, "ramp_receipt_cents?"]
    output: CostShareApplication
    side_effects: ["per CostShareApplication OBLIGATED->REIMBURSED transition"]

  # --- BidBatch / BatchWorkItem / Contractor / Bid (bid pooling) ---
  - method: POST
    path: "/bid-batches"
    description: "Create a neighborhood bid batch with half-open work window and bid deadline"
    roles: [ProgramCoordinator]
    code: 201
    input: [neighborhood_code, work_window_start, work_window_end, bid_deadline]
    output: BidBatch
    side_effects: ["status := OPEN_FOR_ITEMS; estimated_total_cents := 0"]
  - method: GET
    path: "/bid-batches"
    description: "List batches; awarded_bid_id filter finds the batch a bid won"
    roles: *all_roles
    code: 200
    input: ["awarded_bid_id?", "neighborhood_code?", "limit?", "offset?"]
    output: "BidBatch[]"
    side_effects: []
  - method: GET
    path: "/bid-batches/{id}"
    description: "Read one batch"
    roles: *all_roles
    code: 200
    input: []
    output: BidBatch
    side_effects: []
  - method: POST
    path: "/bid-batches/{id}/seal"
    description: "OPEN_FOR_ITEMS -> SEALED_FOR_BIDDING; enforces >= 1 POOLED item and the 7-day forestry cure buffer"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: BidBatch
    side_effects: ["status := SEALED_FOR_BIDDING; increments BidBatch.version by 1"]
  - method: POST
    path: "/bid-batches/{id}/award"
    description: "SEALED -> AWARDED after bid deadline; selector per bid_award_selection; cascades to bids, items, notices, segments"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: BidBatch
    side_effects: ["per BidBatch SEALED_FOR_BIDDING->AWARDED transition"]
  - method: POST
    path: "/bid-batches/{id}/start-work"
    description: "AWARDED -> WORK_IN_PROGRESS once the work window opens"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: BidBatch
    side_effects: ["status := WORK_IN_PROGRESS; increments BidBatch.version by 1"]
  - method: POST
    path: "/bid-batches/{id}/cancel"
    description: "Cancel a batch before award; POOLED items -> REMOVED, SUBMITTED bids -> NOT_AWARDED"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: BidBatch
    side_effects: ["per BidBatch cancel transitions"]
  - method: POST
    path: "/batch-work-items"
    description: "Pool a DELINQUENT notice into an OPEN_FOR_ITEMS batch"
    roles: [ProgramCoordinator]
    code: 201
    input: [batch_id, notice_id, scope_sqft, engineer_unit_rate_cents]
    output: BatchWorkItem
    side_effects: ["includes_ramp_upgrade computed; batch.estimated_total_cents recomputed; increments BidBatch.version by 1"]
  - method: GET
    path: "/batch-work-items"
    description: "List work items; filter by batch or notice"
    roles: *all_roles
    code: 200
    input: ["batch_id?", "notice_id?", "limit?", "offset?"]
    output: "BatchWorkItem[]"
    side_effects: []
  - method: GET
    path: "/batch-work-items/{id}"
    description: "Read one work item"
    roles: *all_roles
    code: 200
    input: []
    output: BatchWorkItem
    side_effects: []
  - method: POST
    path: "/batch-work-items/{id}/remove"
    description: "POOLED -> REMOVED while the batch is OPEN_FOR_ITEMS"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: BatchWorkItem
    side_effects: ["batch.estimated_total_cents recomputed; increments BidBatch.version by 1"]
  - method: POST
    path: "/batch-work-items/{id}/complete"
    description: "SCHEDULED -> WORK_COMPLETED by the awarded contractor"
    roles: [Contractor]
    code: 200
    input: []
    output: BatchWorkItem
    side_effects: ["status := WORK_COMPLETED; increments BatchWorkItem.version by 1"]
  - method: POST
    path: "/batch-work-items/{id}/verify"
    description: "WORK_COMPLETED -> VERIFIED by an Inspector (segregation from defect recorder); cascades to notice and batch completion"
    roles: [Inspector]
    code: 200
    input: []
    output: BatchWorkItem
    side_effects: ["per BatchWorkItem WORK_COMPLETED->VERIFIED transition"]
  - method: POST
    path: "/contractors"
    description: "Register a contractor with license and insurance validity"
    roles: [ProgramCoordinator]
    code: 201
    input: [company_name, license_number, insurance_valid_until]
    output: Contractor
    side_effects: ["is_suspended := false"]
  - method: GET
    path: "/contractors"
    description: "List contractors"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "Contractor[]"
    side_effects: []
  - method: POST
    path: "/contractors/{id}/suspend"
    description: "Suspend a contractor (bids rejected; excluded from award eligibility)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Contractor
    side_effects: ["is_suspended := true; increments Contractor.version by 1"]
  - method: POST
    path: "/bids"
    description: "Submit a bid on a SEALED batch; a second bid by the same contractor supersedes the first; OCC on batch version"
    roles: [Contractor]
    code: 201
    input: [batch_id, unit_rate_cents, ramp_flat_fee_cents, expected_batch_version]
    output: Bid
    side_effects:
      - "contractor_id := X-User-ID; submitted_at := logical clock; evaluated_total_cents snapshotted"
      - "prior SUBMITTED bid by the same contractor on this batch -> SUPERSEDED"
      - "increments BidBatch.version by 1"
  - method: GET
    path: "/bids"
    description: "List bids; filter by batch or contractor"
    roles: *all_roles
    code: 200
    input: ["batch_id?", "contractor_id?", "limit?", "offset?"]
    output: "Bid[]"
    side_effects: []
  - method: GET
    path: "/bids/{id}"
    description: "Read one bid"
    roles: *all_roles
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: POST
    path: "/bids/{id}/withdraw"
    description: "SUBMITTED -> WITHDRAWN by the owning contractor while the batch is SEALED"
    roles: [Contractor]
    code: 200
    input: []
    output: Bid
    side_effects: ["status := WITHDRAWN; increments Bid.version by 1"]

  # --- ForestryReview ---
  - method: POST
    path: "/forestry-reviews/{id}/decision"
    description: "Decide a PENDING review; NO_CITY_CONFLICT clears immediately and frees the defect"
    roles: [ForestryOfficer]
    code: 200
    input: [decision]
    output: ForestryReview
    side_effects: ["per ForestryReview decision transitions"]
  - method: POST
    path: "/forestry-reviews/{id}/clear"
    description: "DECIDED -> CLEARED after root work; stamps work_completed_at and frees the defect"
    roles: [ForestryOfficer]
    code: 200
    input: []
    output: ForestryReview
    side_effects: ["work_completed_at := logical clock; defect AWAITING_FORESTRY -> OPEN; increments ForestryReview.version by 1"]

  # --- LienCase ---
  - method: POST
    path: "/lien-cases"
    description: "Assess a lien on a CITY_REPAIR_COMPLETED notice; computes admin fee, city-tree credit, owner principal; notice -> LIENED"
    roles: [FinanceOfficer]
    code: 201
    input: [notice_id, actual_repair_cost_cents, "interest_rate_bp?"]
    output: LienCase
    side_effects: ["lien_principal_net computed; RepairNotice CITY_REPAIR_COMPLETED -> LIENED"]
  - method: GET
    path: "/lien-cases"
    description: "List liens; filter by notice or parcel"
    roles: *all_roles
    code: 200
    input: ["notice_id?", "parcel_id?", "limit?", "offset?"]
    output: "LienCase[]"
    side_effects: []
  - method: GET
    path: "/lien-cases/{id}"
    description: "Read one lien; interest fields reflect the statement variant (projected to current clock)"
    roles: *all_roles
    code: 200
    input: []
    output: LienCase
    side_effects: []
  - method: GET
    path: "/lien-cases/{id}/payoff-quote"
    description: "Payoff variant: interest projected through current clock + 15 days"
    roles: *all_roles
    code: 200
    input: []
    output: { principal_remaining_cents: integer, accrued_interest_cents: integer, projected_interest_cents: integer, good_through_date: string, payoff_total_cents: integer }
    side_effects: []
  - method: POST
    path: "/lien-cases/{id}/record"
    description: "ASSESSED -> RECORDED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: LienCase
    side_effects: ["status := RECORDED; increments LienCase.version by 1"]
  - method: POST
    path: "/lien-cases/{id}/payments"
    description: "Apply an owner payment; per-event interest accrual then interest-first waterfall"
    roles: [PropertyOwner]
    code: 200
    input: [amount_cents]
    output: LienCase
    side_effects: ["per LienCase payment transitions; on SATISFIED: notice LIENED -> CLOSED"]
  - method: POST
    path: "/lien-cases/{id}/foreclosure-referral"
    description: "RECORDED/PARTIALLY_PAID -> FORECLOSURE_REFERRED once 90 days elapsed with positive balance"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: LienCase
    side_effects: ["status := FORECLOSURE_REFERRED; increments LienCase.version by 1"]

  # --- Sweep (system batch op) ---
  - method: POST
    path: "/delinquency-sweeps"
    description: "Advance ISSUED notices with clock > compliance_deadline to DELINQUENT (with cascades) and expire APPROVED applications past approval_expires_at"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: { swept_notice_count: integer, expired_application_count: integer, swept_notice_ids: array, expired_application_ids: array }
    side_effects: ["per RepairNotice ISSUED->DELINQUENT transition for each swept notice; per CostShareApplication APPROVED->EXPIRED for each expired application"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID missing or role not recognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed actor does not own the target resource (owner's parcel chain, or contractor's bid/award)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempting both sides of a segregated duty (appeal decision vs issuance; inspection/verification vs defect recording)" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, wrong type, non-positive quantity, invalid enum member, or window_start >= window_end" }
  # --- Not found (one per resource) ---
  - { id: ERR_PROGRAM_CYCLE_NOT_FOUND, http: 404, condition: "program cycle id does not exist" }
  - { id: ERR_PROPERTY_OWNER_NOT_FOUND, http: 404, condition: "property owner id does not exist (incl. entity-backed X-User-ID lookups)" }
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "parcel id does not exist" }
  - { id: ERR_SEGMENT_NOT_FOUND, http: 404, condition: "segment id does not exist" }
  - { id: ERR_DEFECT_NOT_FOUND, http: 404, condition: "defect id does not exist" }
  - { id: ERR_REPAIR_NOTICE_NOT_FOUND, http: 404, condition: "repair notice id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "cost-share application id does not exist" }
  - { id: ERR_BID_BATCH_NOT_FOUND, http: 404, condition: "bid batch id does not exist" }
  - { id: ERR_WORK_ITEM_NOT_FOUND, http: 404, condition: "batch work item id does not exist" }
  - { id: ERR_CONTRACTOR_NOT_FOUND, http: 404, condition: "contractor id does not exist (incl. entity-backed X-User-ID lookups)" }
  - { id: ERR_BID_NOT_FOUND, http: 404, condition: "bid id does not exist" }
  - { id: ERR_FORESTRY_REVIEW_NOT_FOUND, http: 404, condition: "forestry review id does not exist" }
  - { id: ERR_LIEN_CASE_NOT_FOUND, http: 404, condition: "lien case id does not exist" }
  # --- State ---
  - { id: ERR_INVALID_CYCLE_STATE, http: 409, condition: "Cycle not in the required state (lock/close source states)" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Operation requires cycle status OPEN (application create, obligate)" }
  - { id: ERR_INVALID_NOTICE_STATE, http: 409, condition: "Notice not in the required state for the requested transition" }
  - { id: ERR_INVALID_DEFECT_STATE, http: 409, condition: "A referenced defect is not in {OPEN, AWAITING_FORESTRY} at notice create/issue (e.g. UNDER_REPAIR, VERIFIED)" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "Application review_status does not allow the requested transition" }
  - { id: ERR_INVALID_BATCH_STATE, http: 409, condition: "Batch status does not allow the requested transition" }
  - { id: ERR_INVALID_WORK_ITEM_STATE, http: 409, condition: "Work item status does not allow the requested transition" }
  - { id: ERR_INVALID_BID_STATE, http: 409, condition: "Bid status does not allow the requested transition" }
  - { id: ERR_INVALID_FORESTRY_STATE, http: 409, condition: "Forestry review status does not allow the requested transition" }
  - { id: ERR_INVALID_LIEN_STATE, http: 409, condition: "Lien status does not allow the requested transition" }
  - { id: ERR_NOTICE_NOT_COMPLIANT, http: 409, condition: "Reimbursement requires the source notice to be COMPLIANT" }
  # --- OCC ---
  - { id: ERR_STALE_NOTICE_VERSION, http: 412, condition: "expected_notice_version != current RepairNotice.version" }
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_batch_version != current BidBatch.version" }
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_program_cycle_version != current ProgramCycle.version" }
  # --- Referential ---
  - { id: ERR_DEFECT_NOT_IN_PARCEL, http: 422, condition: "A defect_ids element belongs to a segment of a different parcel" }
  - { id: ERR_DEFECT_UNDER_ACTIVE_NOTICE, http: 422, condition: "A defect is already covered by a non-terminal notice" }
  - { id: ERR_NO_ELIGIBLE_DEFECTS, http: 422, condition: "defect_ids empty or no element eligible" }
  - { id: ERR_CITY_PARCEL_NOT_NOTICABLE, http: 422, condition: "Parcel has owner_responsibility_pct == 0 (city-owned)" }
  - { id: ERR_NOTICE_ALREADY_POOLED, http: 422, condition: "Notice already has a work item in POOLED/SCHEDULED/WORK_COMPLETED/VERIFIED in some batch" }
  - { id: ERR_INVALID_NOTICE_REFERENCE, http: 422, condition: "prior_notice_id missing, not VOID, or on a different parcel" }
  - { id: ERR_PARCEL_NOTICE_MISMATCH, http: 422, condition: "Application parcel_id != notice.parcel_id" }
  # --- Temporal ---
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Logical clock is past compliance_deadline at appeal time" }
  - { id: ERR_BID_DEADLINE_PASSED, http: 422, condition: "Logical clock is past bid_deadline at bid submission" }
  - { id: ERR_BID_WINDOW_STILL_OPEN, http: 422, condition: "Award attempted at logical clock <= bid_deadline" }
  - { id: ERR_WORK_WINDOW_NOT_REACHED, http: 422, condition: "start-work before work_window_start" }
  - { id: ERR_APPLICATION_EXPIRED, http: 422, condition: "Obligation attempted after approval_expires_at" }
  - { id: ERR_FORECLOSURE_TOO_EARLY, http: 422, condition: "Foreclosure referral before assessed_at + 90 days" }
  # --- Constraint ---
  - { id: ERR_DUPLICATE_PARCEL_NUMBER, http: 409, condition: "parcel_number already registered" }
  - { id: ERR_DUPLICATE_SEGMENT_CODE, http: 409, condition: "segment_code already registered" }
  - { id: ERR_DUPLICATE_LICENSE_NUMBER, http: 409, condition: "contractor license_number already registered" }
  - { id: ERR_APPLICATION_ALREADY_ACTIVE, http: 409, condition: "Notice already has an application in a non-terminal review_status" }
  - { id: ERR_LIEN_ALREADY_EXISTS, http: 409, condition: "Notice already has a lien in a non-terminal status" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "New cycle window intersects an existing cycle's closed window (inclusive adjacency counts)" }
  - { id: ERR_CONTRACTOR_SUSPENDED, http: 403, condition: "Suspended contractor attempting to bid" }
  - { id: ERR_INSURANCE_INVALID, http: 422, condition: "contractor.insurance_valid_until < batch.work_window_end at bid time" }
  - { id: ERR_EMPTY_BATCH, http: 409, condition: "Seal requires at least one POOLED work item" }
  - { id: ERR_ZERO_SCOPE_AREA, http: 422, condition: "Notice defect areas sum to zero at lien creation" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount exceeds outstanding balance including interest accrued to the payment date" }
  - { id: ERR_APPROPRIATION_BELOW_OBLIGATIONS, http: 422, condition: "Adjustment would drop appropriation below committed + disbursed" }
  - { id: ERR_CYCLE_HAS_OPEN_APPLICATIONS, http: 409, condition: "Close blocked by applications in SUBMITTED/RETURNED/APPROVED/OBLIGATED" }
  # --- Fiscal ---
  - { id: ERR_PROGRAM_CAP_EXCEEDED, http: 402, condition: "Obligation or reimbursement would push committed + disbursed above appropriation" }
  - { id: ERR_PARCEL_LIFETIME_CAP_REACHED, http: 422, condition: "Parcel lifetime award cap (800000 cents) already exhausted at application creation" }
  # --- Selector ---
  - { id: ERR_NO_ELIGIBLE_BIDS, http: 422, condition: "Award with an empty eligible-bid set" }
  - { id: ERR_FORESTRY_NOT_CLEARED, http: 409, condition: "Award blocked: a covered tree-root ForestryReview is not CLEARED" }
  - { id: ERR_CURE_WINDOW_VIOLATION, http: 422, condition: "Seal blocked: work_window_start < forestry work_completed_at + 7 days for a covered review" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "City sidewalk-program staff: registers owners/parcels, runs cycles, issues notices, manages batches, runs sweeps, sets the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /program-cycles, /lock, /close"
      - "POST /property-owners, POST /parcels"
      - "POST /repair-notices, /issue, /extensions"
      - "POST /cost-share-applications/{id}/decision"
      - "POST /bid-batches + seal/award/start-work/cancel, POST /batch-work-items + /remove"
      - "POST /contractors, POST /contractors/{id}/suspend"
      - "POST /delinquency-sweeps, POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: Inspector
    description: "City inspector: maintains the condition inventory (segments, defects) and performs compliance inspections and work verification"
    identity: opaque
    exclusive_operations:
      - "POST /segments, POST /defects"
      - "POST /repair-notices/{id}/inspections"
      - "POST /batch-work-items/{id}/verify"
    shared_operations: ["all GET endpoints"]
  - name: PropertyOwner
    description: "Abutting property owner; X-User-ID must equal the PropertyOwner.id that owns the acted-on parcel"
    identity: "entity_backed:PropertyOwner"
    exclusive_operations:
      - "POST /cost-share-applications, /resubmit, /withdraw"
      - "POST /repair-notices/{id}/appeal"
      - "POST /lien-cases/{id}/payments"
    shared_operations: ["all GET endpoints (owner-scoped resources filtered to owner_id == X-User-ID when role is PropertyOwner)"]
  - name: Contractor
    description: "Registered contractor; X-User-ID must equal a Contractor.id"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /bids, POST /bids/{id}/withdraw"
      - "POST /batch-work-items/{id}/complete"
    shared_operations: ["all GET endpoints"]
  - name: ForestryOfficer
    description: "Urban forestry officer: decides and clears tree-root reviews"
    identity: opaque
    exclusive_operations:
      - "POST /forestry-reviews/{id}/decision, POST /forestry-reviews/{id}/clear"
    shared_operations: ["all GET endpoints"]
  - name: FinanceOfficer
    description: "City finance officer: appropriation adjustments, award obligation and reimbursement, lien lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /program-cycles/{id}/appropriation-adjustments"
      - "POST /cost-share-applications/{id}/obligate, /reimburse"
      - "POST /lien-cases, /record, /foreclosure-referral"
    shared_operations: ["all GET endpoints"]
  - name: HearingOfficer
    description: "Appeals hearing officer: decides appeals; may not decide an appeal on a notice they issued (segregation of duties via X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /repair-notices/{id}/appeal-decision"
    shared_operations: ["all GET endpoints"]
