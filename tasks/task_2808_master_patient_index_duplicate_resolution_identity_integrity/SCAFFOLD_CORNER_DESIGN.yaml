            - "V9-2000 has already been subsumed into V9-1000 by a completed merge."
            - "A second pair is then scored over V9-2000 and V9-3000; pair creation itself is legal because pair scoring has no identity_state filter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
