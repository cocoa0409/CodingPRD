              payload: { full_name: "Notice Ned", date_of_birth: "1990-01-01", ssn_last4: "0045", mrn: "MRN-NOT-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2025-12-15", total_charges_cents: 100000, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc: $.data.id }
            - call: "POST /charity-care/accounts/${acc}/statements"
              payload: {}
              as: BillingAdministrator
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
            - call: "POST /charity-care/applications/${app}/members"
