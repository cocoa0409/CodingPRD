              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "PARENT", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Parent confirms apple harvest work.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_a_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_id: $.data.id }
            - call: "POST /mep/coes/${coe_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/coes/${coe_id}/approve"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/eligibility-terms"
              payload: { student_id: "${stu_id}", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { term_id: "$.data[0].id", term_end: "$.data[0].term_end_on" }
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v1: $.data.version }
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "SUMMER_PROGRAM", delivery_mode: "IN_PERSON", expected_student_version: "${stu_v1}" }
              as: ServiceCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /mep/_clock/set_current_utc"
              payload: { to_iso8601: "2029-09-01T00:00:00Z" }
              as: StateProgramAdmin
          trigger:
            - call: "POST /mep/eligibility-terms/sweep"
              payload: {}
              as: StateProgramAdmin
              captures: { swept_1: $.data.swept_count, expired_1: $.data.expired_count, lapsed_1: $.data.lapsed_count }
            - call: "POST /mep/eligibility-terms/sweep"
              payload: {}
              as: StateProgramAdmin
              captures: { swept_2: $.data.swept_count, expired_2: $.data.expired_count, lapsed_2: $.data.lapsed_count }
          assert:
            - "before the trigger EligibilityTerm.${term_id}.status == ACTIVE, term_end_on == 2029-06-30 and reidentification_due_on is null"
            - "first sweep: data.swept_count == 1, data.expiring_count == 0, data.expired_count == 1, data.lapsed_count == 0 and data.expired_term_ids == [${term_id}]"
            - "first sweep: EligibilityTerm.${term_id}.status == EXPIRED and reidentification_due_on == 2029-08-14 (term_end_on plus 45 days)"
