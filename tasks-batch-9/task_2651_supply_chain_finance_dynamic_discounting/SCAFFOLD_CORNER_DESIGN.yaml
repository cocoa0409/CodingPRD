      - name: funder_fee_tier_is_keyed_on_the_pre_fee_net
        claim_type: tiered_pricing
        grounds:
          - calculations.funder_fee
        distinguishing_aspect: |
          Bracket-edge case where the pre-fee net and the final net sit in different tiers, so the
          pinned evaluation order is observable in net_payment_cents.
        excluded_because:
          difficulty_instance: combinatorial_formula / funder_fee_tier_keyed_on_pre_fee_net_not_final_net
          rationale: |
            The difficulty instance already walks the 25000000-cent bracket edge with the exact
            worked example from calculations.funder_fee, asserting both the correct fee (18 bps
            tier) and that the circular ordering (30 bps tier) is wrong, plus the adjacent
            straddling case. A separate corner instance would restate the same arithmetic.

      - name: provisional_and_final_discount_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.early_payment_discount
          - calculations.days_early
        distinguishing_aspect: |
          One invoice priced twice - PAY_DATE_BASIS at creation and VALUE_DATE_BASIS at settlement
          confirmation - must produce two different cent amounts whose signed gap lands in
          Invoice.discount_true_up_cents.
        excluded_because:
          difficulty_instance: dual_variant_calc / early_payment_discount_pay_date_vs_value_date_basis
          rationale: |
            That instance is the dual-variant probe for this calculation: it asserts the
            provisional amount, the final amount, the negative true-up and the fact that the
            two-day settlement lag - not a rounding difference - causes the divergence.

      - name: discount_variant_selected_by_lifecycle_stage
        claim_type: variant_selection
        grounds:
          - calculations.early_payment_discount
          - state_machines.EarlyPayment
        distinguishing_aspect: |
          PAY_DATE_BASIS must be selected at creation and execution and VALUE_DATE_BASIS only at
          settlement confirmation; an implementation that switches one step early or late is
          detectable.
        excluded_because:
          difficulty_instance: dual_variant_calc / early_payment_discount_pay_date_vs_value_date_basis
          rationale: |
            The same difficulty instance pins the variant to each of the three lifecycle stages,
            including the assertion that execution keeps the PAY_DATE_BASIS figure rather than
            anticipating the value-date figure.

      - name: settlement_delta_reconciles_the_funder_ledger
        claim_type: reconciliation
        grounds:
          - calculations.early_payment_discount
          - calculations.net_payment
          - entities.Funder.fields.encumbered_capital_cents
        distinguishing_aspect: |
          When the provisional discount is replaced by the final one, the funder's encumbered
          capital must move by exactly the net delta rather than being recomputed from scratch or
          left stale.
        excluded_because:
          difficulty_instance: compensating_invariant / funder_capital_conservation_across_execute_delta_and_suppression_void
          rationale: |
            That compensating-invariant instance already reconciles the funder ledger across the
            variant switch and the subsequent void, asserting the running encumbrance after every
            hop and that it returns to its starting value.

      - name: invoice_face_rounds_each_line_before_summing
        claim_type: precision
        grounds:
          - calculations.invoice_face_from_lines
        distinguishing_aspect: |
          Two lines whose per-line tax amounts each round up: rounding per line then summing
          differs by a cent from summing then rounding once.
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_face_rounds_per_line_then_sums
          rationale: |
            The difficulty instance is built on exactly that arithmetic, asserting the correct
            per-line-then-sum total and naming the sum-then-round total that a naive
            implementation produces.

      - name: concentration_share_aggregates_over_the_face_basis
        claim_type: aggregation
        grounds:
          - calculations.supplier_concentration
        distinguishing_aspect: |
          The aggregate must be built from invoice face amounts across the whole programme, not
          from funded net amounts, and must include the invoice about to be awarded.
        excluded_because:
          difficulty_instance: dual_variant_calc / supplier_concentration_face_basis_vs_funded_basis
          rationale: |
            That dual-variant instance already drives the aggregate on both bases and shows the
            cap decision flipping between them, which subsumes a plain aggregation claim.

      - name: funder_capacity_merges_overlapping_commitment_intervals
        claim_type: interval_merge
        grounds:
          - calculations.funder_available_capital
          - entities.FunderCommitment
        distinguishing_aspect: |
          Overlapping, adjacent and disjoint tranches must aggregate per instant over closed
          intervals, so a date inside two tranches sees the sum and a date in the one-day gap sees
          only one.
        excluded_because:
          difficulty_instance: resource_temporal_overlap / funder_tranche_aggregate_capacity_over_closed_intervals
          rationale: |
            The resource_temporal_overlap instance already probes the same interval algebra at the
            inclusive end date, in the overlap and in the gap, and ties each result to an
            eligibility decision inside funder_selection.

      - name: adoption_rate_band_boundaries_are_inclusive_at_throttled
        claim_type: threshold
        grounds:
          - calculations.program_adoption_rate
          - global_constants.ADOPTION_THROTTLED_PCT
        distinguishing_aspect: |
          A rate of exactly 60.00 must land in THROTTLED, 59.xx in OPTIMISED, and an empty
          denominator must not divide by zero.
        excluded_because:
          difficulty_instance: boundary_precision_check / adoption_rate_empty_denominator_and_inclusive_throttled_edge
          rationale: |
            That boundary_precision instance walks the empty denominator, the value just below the
            band edge and the value exactly on it, which is the whole content of this claim.

      - name: funder_selection_tie_break_prefers_the_lower_fee_spread
        claim_type: weighted_scoring
        grounds:
          - calculations.funder_selection
          - calculations.funder_fee
          - entities.Funder
          - entities.FunderCommitment
        distinguishing_aspect: |
          Two funders score identically (830 each: 2*min(400, 900-500) - 3*40 + 150 for the first,
          2*min(400, 900-560) - 0 + 150 for the second), so the winner is decided by tie-break rung
          2 - the lower fee_spread_bps - and not by rung 3 (created_at ASC), which would have
          picked the funder registered first. The 400-bp cap in the ranking expression is what
          makes the scores equal in the first place.
        test_recipe:
          setup:
            - "Buyer with a deliberately tiny 1000-cent credit limit and a FUNDER_ONLY programme, so the buyer-self branch of the waterfall is never taken"
