          - state_machines.AffiliateApplication[SCREENED -> CHANGES_REQUESTED]
          - state_machines.AffiliateApplication[CHANGES_REQUESTED -> SUBMITTED]
          - validations[priority 44]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: "The CHANGES_REQUESTED loop is bounded by revision_round_count, which is incremented by resubmit and not by the decision: after two completed rounds the count is 2 and a third REQUEST_CHANGES is refused with ERR_REVISION_LIMIT_REACHED (422) while the application stays SCREENED at its rescreened scores. The limit binds the reviewer, not the partner — REJECT on the same application still succeeds and terminates the affiliate, so the loop always has an exit."
