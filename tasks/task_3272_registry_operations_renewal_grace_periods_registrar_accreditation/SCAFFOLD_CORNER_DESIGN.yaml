      - name: error_auth_code_expired_after_14_days
        claim_type: violation_to_error
        grounds:
          - errors.ERR_AUTH_CODE_EXPIRED
          - state_machines.Transfer.REQUESTED_to_ACKED
        distinguishing_aspect: "An ack attempted after auth_code_expires_at (requested_at + 14 days) fails ERR_AUTH_CODE_EXPIRED even with the correct code — the TTL is enforced independently of code correctness."
        test_recipe:
          setup:
            - "Clock 2026-01-01, schedule effective, registrars A and B ACTIVE, domain by A at 2026-01-02, transfer requested at 2026-03-10T00:00:00Z; clock advanced to 2026-03-24T00:00:01Z (past the 14-day TTL)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9130, legal_name: "TTL A", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 9131, legal_name: "TTL B", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_b: $.data.id }
            - call: "POST /registry/registrars/${reg_a}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/registrars/${reg_b}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "ttl-domain", registrar_id: "${reg_a}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/transfers"
              payload: { domain_id: "${dom_id}", to_registrar_id: "${reg_b}" }
              as: RegistrarOperator
              as_user_id: "${reg_b}"
              captures: { xfer_id: $.data.id, ac: $.data.auth_code }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-24T00:00:01Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/transfers/${xfer_id}/ack"
              payload: { auth_code: "${ac}" }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the ack after the 14-day TTL fails 409 ERR_AUTH_CODE_EXPIRED"

  # ===========================================================================
  - section: rbac
    instances:
      - name: registrar_operator_cannot_accredit_or_set_clock
        claim_type: rbac_denial
        grounds:
          - roles.RegistryAdmin
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "RegistryAdmin-exclusive operations (accredit, clock-set) reject RegistrarOperator with 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "One registrar in PENDING_TESTS."
          setup_api_calls:
            - call: "POST /registry/registrars"
              payload: { iana_number: 9140, legal_name: "RBAC Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "accredit as RegistrarOperator fails 403 ERR_FORBIDDEN"
            - "clock-set as RegistrarOperator fails 403 ERR_FORBIDDEN"

      - name: registry_finance_cannot_file_domains_but_can_top_up
        claim_type: rbac_denial
        grounds:
          - roles.RegistryFinance
          - roles.RegistrarOperator
        distinguishing_aspect: "Peer-role separation: RegistryFinance can POST ledger-topups (its exclusive op) but cannot POST /domains (RegistrarOperator-exclusive), and RegistrarOperator cannot POST ledger-topups."
        test_recipe:
          setup:
            - "Clock 2026-02-01, schedule effective, ACTIVE registrar."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9141, legal_name: "Peer Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/registrars/${reg_id}/ledger-topups"
              payload: { amount_cents: 10000 }
              as: RegistryFinance
              captures: { topup_id: $.data.id }
            - call: "POST /registry/domains"
              payload: { name: "finance-domain", registrar_id: "${reg_id}", years: 1 }
              as: RegistryFinance
              captures: { err1: $.data.error_id }
            - call: "POST /registry/registrars/${reg_id}/ledger-topups"
              payload: { amount_cents: 5000 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "RegistryFinance top-up succeeds 201 with a LedgerEntry id"
            - "RegistryFinance domain create fails 403 ERR_FORBIDDEN"
            - "RegistrarOperator top-up fails 403 ERR_FORBIDDEN"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_registrar_version_rejected_with_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[registrar-patch-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Two strictly sequential PATCHes: the first (correct expected_registrar_version) succeeds and bumps Registrar.version; the second reusing the now-stale version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "One PENDING_TESTS registrar; version captured at creation."
          setup_api_calls:
            - call: "POST /registry/registrars"
              payload: { iana_number: 9150, legal_name: "OCC Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id, reg_v: $.data.version }
          trigger:
            - call: "PATCH /registry/registrars/${reg_id}"
              payload: { expected_registrar_version: "${reg_v}", credit_hold: true }
              as: RegistryAdmin
              captures: { reg_v2: $.data.version }
            - call: "PATCH /registry/registrars/${reg_id}"
              payload: { expected_registrar_version: "${reg_v}", legal_name: "OCC Registrar Renamed" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the first PATCH succeeds and Registrar.${reg_id}.version == ${reg_v} + 1"
            - "the second PATCH with the stale version fails 412 ERR_STALE_VERSION"
            - "Registrar.${reg_id}.legal_name remains unchanged by the rejected PATCH"

      - name: occ_stale_domain_version_on_lock_rejected_with_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[domain-lock-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Lock mutation is OCC-guarded on Domain.version: after a renew (which bumps the version as a side effect), a lock request carrying the pre-renew version fails 412."
        test_recipe:
          setup:
            - "Clock 2026-02-01, schedule effective, ACTIVE registrar, ACTIVE domain with captured version; domain then renewed (version bumps)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9151, legal_name: "OCC Domain Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "occ-domain", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id, dom_v: $.data.version }
            - call: "POST /registry/domains/${dom_id}/renew"
              payload: { years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
          trigger:
            - call: "POST /registry/domains/${dom_id}/lock"
              payload: { lock_action: "CLIENT_LOCK", expected_domain_version: "${dom_v}" }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the lock with the pre-renew version fails 412 ERR_STALE_VERSION"
            - "Domain.${dom_id}.lock_status remains NONE"

      - name: price_increase_notice_emitted_and_version_pinned
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PriceSchedule.PROPOSED_to_EFFECTIVE
          - entities.RegistrarAccreditationNotice
          - entities.Registrar.fields.accredited_version
        distinguishing_aspect: "When a schedule becomes EFFECTIVE, PRICE_INCREASE_EFFECTIVE notices are emitted only to ACTIVE/SUSPENDED registrars whose accredited_version < schedule.version — a version-pinned fan-out observable via the notices endpoint."
        test_recipe:
          setup:
            - "Clock 2026-01-01. Baseline schedule S1 effective. Registrar accredited (accredited_version pinned). Second schedule S2 (create 750, within cap) announced with effective_on 2026-12-31. Clock advanced to 2026-12-31."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
              captures: { s1: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 9152, legal_name: "Notice Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 750, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-12-31T00:00:00Z", supersedes_schedule_id: "${s1}" }
              as: RegistryAdmin
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /registry/registrars/${reg_id}/accreditation-notices"
              payload: {}
              as: RegistryAdmin
          assert:
            - "PriceSchedule.${s2}.status == EFFECTIVE and PriceSchedule.${s1}.status == SUPERSEDED"
            - "the registrar received a PRICE_INCREASE_ANNOUNCED notice at submission time and a PRICE_INCREASE_EFFECTIVE notice at 2026-12-31"
            - "Registrar.${reg_id}.accredited_version < PriceSchedule.${s2}.version (the pin that admitted the registrar to the notice set)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_invoice_visible_in_same_read_after_create
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - entities.Invoice
        distinguishing_aspect: "The system is immediate-consistency: the CREATE invoice and ledger DEBIT minted by POST /domains are visible in the very next GET with no delay or reconciliation window."
        test_recipe:
          setup:
            - "Clock 2026-02-01, schedule effective, ACTIVE registrar."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9160, legal_name: "Consistency Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/domains"
              payload: { name: "immediate-domain", registrar_id: "${reg_id}", years: 2 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registry/invoices"
              payload: { domain_id: "${dom_id}" }
              as: RegistryFinance
              captures: { inv_total: "$.data[0].total_cents" }
            - call: "GET /registry/registrars/${reg_id}/ledger"
              payload: {}
              as: RegistryFinance
          assert:
            - "the immediately-following GET /invoices?domain_id returns the CREATE invoice with total_cents == 1400 (700 x 2 years)"
            - "the immediately-following GET ledger contains the matching DEBIT -1400"
