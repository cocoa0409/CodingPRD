# =============================================================================
# Task 1969 — SCAFFOLD_CORNER_DESIGN.yaml (§1.9 Coverage Index for
# Non-Difficulty Tests). Breadth walk over §1.1–§1.7 per claim-extraction-guide.
# Logical clock default: 2026-08-01T00:00:00Z. Canonical event window:
# 2026-08-20T09:00:00Z .. 2026-08-20T15:00:00Z (6.0 h).
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: event_create_applies_defaults
        claim_type: creation
        grounds: [entities.ServiceEvent, "endpoints.POST /service-events"]
        distinguishing_aspect: "Creating an event with only required fields yields status PLANNING, readiness_posture BLOCKED, waiver_document_version 1, all spend/headcount counters 0, repeat_booking_bonus false, source_event_id null, version 1."
        test_recipe:
          setup: ["empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /service-events", payload: { name: "Day 1", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { st: $.data.status, post: $.data.readiness_posture, wv: $.data.waiver_document_version, proj: $.data.projected_spend_cents, comm: $.data.committed_spend_cents, hc: $.data.confirmed_headcount, bonus: $.data.repeat_booking_bonus, ver: $.data.version } }
          assert:
            - "status == PLANNING; readiness_posture == BLOCKED; waiver_document_version == 1"
            - "projected_spend_cents == 0; committed_spend_cents == 0; confirmed_headcount == 0"
            - "repeat_booking_bonus == false; version == 1"

      - name: volunteer_missing_required_email_rejected
        claim_type: required_fields
        grounds: [entities.EmployeeVolunteer.fields.email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input email on volunteer creation is rejected with ERR_VALIDATION (422) and nothing is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /employee-volunteers", payload: { full_name: "No Email", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION; http 422"
            - "GET /employee-volunteers returns total_count == 0"

      - name: registration_is_minor_computed_from_event_date
        claim_type: computed_fields
        grounds: [entities.Registration.fields.is_minor, entities.Registration.fields.waiver_signed_version]
        distinguishing_aspect: "is_minor is computed from date_of_birth against event.event_start_at: a volunteer born 2011-05-01 is a minor (age 15) at the 2026-08-20 event; one born 1990-01-01 is not."
        test_recipe:
          setup: ["project MATCHED to OPEN event on 2026-08-20; one minor volunteer (DOB 2011-05-01) and one adult (DOB 1990-01-01)"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 2", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Teen", email: "teen@corp.com", department: "Intern", date_of_birth: "2011-05-01" }, as: CommunityEngagementManager, captures: { volM: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Adult", email: "adult@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { volA: $.data.id } }
          trigger:
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}" }, as: EmployeeVolunteer, as_user_id: "${volM}", captures: { minor_flag: $.data.is_minor, minor_wv: $.data.waiver_signed_version } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}" }, as: EmployeeVolunteer, as_user_id: "${volA}", captures: { adult_flag: $.data.is_minor } }
          assert:
            - "minor registration: is_minor == true; adult registration: is_minor == false"
            - "waiver_signed_version == null at creation (unsigned); waiver_status == WAIVER_PENDING"

      - name: event_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]", "endpoints.GET /service-events/{eventId}"]
        distinguishing_aspect: "GET on a well-formed but nonexistent event id returns 404 with the typed error and the standard error envelope (meta + response_type error + data.error_id)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /service-events/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_FOUND; http 404; envelope carries meta.api_request_id and response_type == error"

      - name: project_inverted_volunteer_bounds_rejected
        claim_type: type_constraints
        grounds: [entities.ServiceProject.fields.min_volunteers, entities.ServiceProject.fields.max_volunteers, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "min_volunteers > max_volunteers (5 > 3) violates the cross-field constraint and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["one ACTIVE nonprofit partner"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
          trigger:
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Bad Bounds", min_volunteers: 5, max_volunteers: 3 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION; http 422; no project persisted"

      - name: feedback_survey_immutable_common_fields
        claim_type: immutability
        grounds: [entities.FeedbackSurvey]
        distinguishing_aspect: "FeedbackSurvey has common_fields: false — its read payload exposes id and created_at only (no version, no updated_at) and no update endpoint exists."
        test_recipe:
          setup: ["event COMPLETED with one CHECKED_IN volunteer (minimal READY chain, waiver VERIFIED)"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 3", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Lead One", email: "lead1@corp.com", department: "Ops", date_of_birth: "1985-03-03", is_staff_lead: true }, as: CommunityEngagementManager, captures: { lead1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
            - { call: "POST /registrations/${reg1}/verify-waiver", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /supervision-assignments", payload: { project_id: "${proj1}", lead_volunteer_id: "${lead1}" }, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Gloves", quantity: 2, unit_cost_cents: 500 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord1: $.data.id } }
            - { call: "POST /procurement-orders/${ord1}/submit", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1" }
            - { call: "POST /procurement-orders/${ord1}/receive", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/lock", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/lock-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/begin", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${reg1}/check-in", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/complete", payload: {}, as: CommunityEngagementManager }
          trigger:
            - { call: "POST /feedback-surveys", payload: { registration_id: "${reg1}", rating: 5, would_repeat: true }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { survey_id: $.data.id, survey_created: $.data.created_at } }
          assert:
            - "survey created (201) with id and created_at present"
            - "response data carries NO version and NO updated_at keys (common_fields: false)"
            - "created_at equals current logical clock 2026-08-01T00:00:00Z (clock never set)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancelled_event_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceEvent, "errors[ERR_INVALID_EVENT_TRANSITION]"]
        distinguishing_aspect: "From terminal CANCELLED, every lifecycle action (open-registration, begin, complete, close, cancel) is rejected with ERR_INVALID_EVENT_TRANSITION."
        test_recipe:
          setup: ["event in PLANNING, then cancelled"]
          setup_api_calls:
            - { call: "POST /service-events", payload: { name: "Day 4", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-events/${ev1}/cancel", payload: {}, as: CommunityEngagementManager }
          trigger:
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager, captures: { err1: $.data.error_id } }
            - { call: "POST /service-events/${ev1}/begin", payload: {}, as: CommunityEngagementManager, captures: { err2: $.data.error_id } }
            - { call: "POST /service-events/${ev1}/complete", payload: {}, as: CommunityEngagementManager, captures: { err3: $.data.error_id } }
            - { call: "POST /service-events/${ev1}/close", payload: {}, as: CommunityEngagementManager, captures: { err4: $.data.error_id } }
          assert:
            - "all four actions return error_id == ERR_INVALID_EVENT_TRANSITION (409)"
            - "ServiceEvent.${ev1}.status remains CANCELLED"

      - name: checkin_from_registered_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Registration.CONFIRMED_to_CHECKED_IN, "errors[ERR_INVALID_REGISTRATION_TRANSITION]"]
        distinguishing_aspect: "check-in from REGISTERED (skipping CONFIRMED) is an invalid transition — only CONFIRMED registrations may check in."
        test_recipe:
          setup: ["project MATCHED to OPEN event; one volunteer REGISTERED, waiver signed but not confirmed"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 5", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}" }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
          trigger:
            - { call: "POST /registrations/${reg1}/check-in", payload: {}, as: CommunityEngagementManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REGISTRATION_TRANSITION (rsvp_status REGISTERED, needs CONFIRMED)"
            - "Registration.${reg1}.rsvp_status remains REGISTERED"

      - name: double_confirm_rejected_idempotency
        claim_type: idempotency
        grounds: [state_machines.Registration.REGISTERED_to_CONFIRMED, "errors[ERR_INVALID_REGISTRATION_TRANSITION]"]
        distinguishing_aspect: "Repeating a successful confirm is not silently absorbed: the second confirm hits a non-matching from-state and fails with ERR_INVALID_REGISTRATION_TRANSITION."
        test_recipe:
          setup: ["project MATCHED to OPEN event; one volunteer REGISTERED with SIGNED waiver"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 6", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}" }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager }
          trigger:
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager, captures: { err: $.data.error_id } }
          assert:
            - "second confirm: error_id == ERR_INVALID_REGISTRATION_TRANSITION"
            - "confirmed_volunteer_count on project == 1 (no double count)"

      - name: sponsorship_settle_requires_completed_event
        claim_type: precondition_enforcement
        grounds: [state_machines.Sponsorship.COMMITTED_to_SETTLED, "errors[ERR_EVENT_STATE_FORBIDS_WRITE]"]
        distinguishing_aspect: "Settling while the event is still REGISTRATION_OPEN (not COMPLETED/CLOSED) is rejected with ERR_EVENT_STATE_FORBIDS_WRITE even though the sponsorship itself is COMMITTED."
        test_recipe:
          setup: ["event OPEN; COMMITTED FLAT sponsorship"]
          setup_api_calls:
            - { call: "POST /service-events", payload: { name: "Day 7", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /sponsorships", payload: { event_id: "${ev1}", sponsor_name: "CorpCo", match_type: "FLAT", rate_cents: 5000, pledge_cap_cents: 9000 }, as: FinanceController, captures: { sp1: $.data.id } }
            - { call: "POST /sponsorships/${sp1}/commit", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /sponsorships/${sp1}/settle", payload: {}, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_STATE_FORBIDS_WRITE"
            - "Sponsorship.${sp1}.status remains COMMITTED; settled_amount_cents remains null"

      - name: begin_blocked_when_posture_not_ready
        claim_type: precondition_enforcement
        grounds: [calculations.event_readiness_posture, state_machines.ServiceEvent, "errors[ERR_EVENT_NOT_READY]"]
        distinguishing_aspect: "A MATCHED-but-never-LOCKED project leaves posture at PARTIAL (clause a fails); begin from REGISTRATION_LOCKED is then rejected with ERR_EVENT_NOT_READY."
        test_recipe:
          setup: ["event OPEN with one MATCHED project, no registrations, no supervision"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 8", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/lock-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { posture: $.data.readiness_posture } }
          trigger:
            - { call: "POST /service-events/${ev1}/begin", payload: {}, as: CommunityEngagementManager, captures: { err: $.data.error_id } }
          assert:
            - "precondition: readiness_posture == PARTIAL (project present but none LOCKED)"
            - "error_id == ERR_EVENT_NOT_READY; event remains REGISTRATION_LOCKED"

      - name: event_complete_cascades_project_and_meal
        claim_type: side_effect_execution
        grounds: [state_machines.ServiceEvent.IN_PROGRESS_to_COMPLETED, state_machines.ServiceProject.LOCKED_to_COMPLETED, state_machines.MealPlan]
        distinguishing_aspect: "complete fans out: LOCKED project -> COMPLETED and ORDERED meal plan -> FULFILLED in the same request."
        test_recipe:
          setup: ["minimal READY event (1 confirmed volunteer wanting a meal, lead, received order, LOCKED project), meal plan ORDERED, event begun"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 9", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Lead One", email: "lead1@corp.com", department: "Ops", date_of_birth: "1985-03-03", is_staff_lead: true }, as: CommunityEngagementManager, captures: { lead1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: true }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /supervision-assignments", payload: { project_id: "${proj1}", lead_volunteer_id: "${lead1}" }, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Gloves", quantity: 2, unit_cost_cents: 500 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord1: $.data.id } }
            - { call: "POST /procurement-orders/${ord1}/submit", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1" }
            - { call: "POST /procurement-orders/${ord1}/receive", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/lock", payload: {}, as: CommunityEngagementManager }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_v: $.data.version } }
            - { call: "POST /service-events/${ev1}/meal-plans", payload: { vendor_name: "FreshCo", per_person_cost_cents: 1200, expected_event_version: "${ev_v}" }, as: LogisticsCoordinator, captures: { mp1: $.data.id } }
            - { call: "POST /meal-plans/${mp1}/order", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /service-events/${ev1}/lock-registration", payload: {}, as: CommunityEngagementManager }
