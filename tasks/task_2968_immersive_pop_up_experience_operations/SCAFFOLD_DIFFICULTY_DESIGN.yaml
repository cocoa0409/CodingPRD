              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-NYC-002", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /staff-members"
              payload: { run_id: "${run_id}", full_name: "Ada Perez", staff_role: "PERFORMER", certifications: ["SCRIPTED_INTERACTION", "SENSORY_DEESCALATION"], incident_count: 1 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { perf_id: $.data.id }
          trigger:
            - call: "POST /staff-members/${perf_id}/training-records"
              payload: { training_score: 82, completed_rehearsal_count: 2, scheduled_rehearsal_count: 2, incident_delta: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-members/${perf_id}/status-decisions"
              payload: { decision: "CLEAR", note: "roster view looked clear" }
              as: ExperienceProducer
              as_user_id: "producer-1"
          assert:
            - "StaffMember.${perf_id}.cert_coverage_pct == 100.00"
            - "StaffMember.${perf_id}.readiness_score_preflight == 87.80"
            - "StaffMember.${perf_id}.readiness_score_audit == 75.30"
            - "the CLEAR call responds 409 with data.error_id == ERR_STAFF_READINESS_BELOW_MIN"
            - "StaffMember.${perf_id}.status == TRAINING (unchanged by the refused CLEAR)"
            - "ExperienceRun.${run_id}.clearance_status == UNCLEARED"

  # ===========================================================================
  # Rule 2 - combinatorial_formula (modes (a), (b) and (c) - one instance each)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: capacity_nested_min_switches_arm_from_room_to_inspection_cap
        grounds:
          - calculations.run_effective_capacity
          - calculations.safety_inspection_outcome
          - entities.ExperienceRun.fields.effective_capacity
          - entities.ExperienceRun.fields.effective_capacity_cap
          - entities.PopupVenue.fields.egress_capacity
          - entities.PopupVenue.fields.permitted_occupancy_load
          - state_machines.SafetyInspection.SCHEDULED_to_FINALIZED
        distinguishing_aspect: |
          Mode (a): four heterogeneous inputs feed one nested min whose winning arm changes three
          times without any of the other inputs moving - permitted_occupancy_load 180, egress
          ceiling floor(400 / 2.03) = 197, the per-room floor(cap * 45 / dwell) minimum, and an
          inspection-imposed cap. Adding a third room moves the winner from 112 to 56, and a
          CONDITIONAL CAPACITY inspection measuring 100.0 cm moves it again to 49; an
          implementation that keeps only the venue terms, or that recomputes without the
          inspection cap, cannot produce 120 -> 112 -> 56 -> 49.
        test_recipe:
          setup:
            - "One NYC venue with an issued permit: requested_occupancy_load 180, egress_width_cm 400, so egress_capacity 197 and permitted_occupancy_load 180."
            - "One PLANNED run with timed_slot_minutes 45 and effective_capacity_cap 0."
            - "Two themed rooms already created: (cap 40, dwell 15) -> throughput 120 and (cap 30, dwell 12) -> throughput 112."
            - "No slots exist, so the CONDITIONAL branch has no window to suspend."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-CAP-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
