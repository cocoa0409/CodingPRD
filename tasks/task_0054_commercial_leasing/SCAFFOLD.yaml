# =============================================================================
# Commercial Real Estate Leasing Management — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  Commercial real estate leasing management system: building/floor/unit hierarchy with
  property hierarchy modeling, unit attributes (area/orientation/usage/rent reference),
  unit status (vacant/leased/reserved/under renovation), and unit merge-and-split handling;
  tenant move-in with tenant profile, business license and qualification verification,
  intent letter and deposit handling, move-in checklist, and unit handover record; lease
  contract management with contract template, escalating rent (annual/biennial/stepped),
  rent-free period configuration, rent payment schedule, security deposit and guarantee,
  contract amendment, and renewal workflow; property fee and energy fee allocation with
  property-fee billing rules (by area/fixed-rate), energy-fee metering (sub-meter/allocated),
  public-area shared cost allocation, multi-tenant shared-meter allocation algorithm, fee
  bill generation, and dispute handling; move-out and handover with move-out application
  lead time, deposit deduction items (overdue rent/damage/cleaning), unit inspection record,
  restoration work confirmation, deposit settlement, and final account closing; deposit
  management with deposit collection and freeze, deposit adjustment on lease change,
  deduction approval workflow, refund execution, and deposit-account reconciliation;
  event-driven synchronization with payment, finance, energy-metering, and access-control
  systems; audit logging for contract changes and fee adjustments.

domain_name: commercial-leasing
api_prefix: /buildings

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - ops_run_checkpoint

  entity_topology: hybrid
  state_machine_shape: branching         # also exhibits cyclic on Lease amendments and parallel on Deposit
  relationship_patterns:
    - one_to_many
    - self_referential                   # Unit.parent_unit_id for split-and-merge
    - cross_aggregate                    # FeeBill links Tenant+Unit+Lease
  role_model: peer_roles                 # PropertyManager / LeasingAgent / FinanceOfficer / Tenant
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Building name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: floors_count, type: integer, source: input, description: "Total floor count, >= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECOMMISSIONED", default: "ACTIVE", constraints: "values in {ACTIVE, DECOMMISSIONED}" }

  - name: Unit
    parent: Building
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "Owning building id (path)" }
      - { name: parent_unit_id, type: string, source: system, description: "If created via split, references the unit that was split; null for original units", default: null }
      - { name: floor, type: integer, source: input, description: "Floor number, 1..floors_count" }
      - { name: code, type: string, source: input, description: "Unit code unique per building (e.g. 'A-1201')" }
      - { name: area_sqm, type: number, source: input, description: "Unit area in square meters; > 0; precision 2 decimal places" }
      - { name: orientation, type: enum, source: input, description: "N | S | E | W | NE | NW | SE | SW", constraints: "values in {N,S,E,W,NE,NW,SE,SW}" }
      - { name: usage_type, type: enum, source: input, description: "OFFICE | RETAIL | WAREHOUSE | FB", constraints: "values in {OFFICE, RETAIL, WAREHOUSE, FB}" }
      - { name: rent_reference_per_sqm, type: number, source: input, description: "Reference monthly rent per sqm, > 0; precision 2 decimal places" }
      - { name: status, type: enum, source: computed, description: "VACANT | RESERVED | LEASED | UNDER_RENOVATION | RETIRED — derived per §1.3 unit_status_derivation", constraints: "values in {VACANT, RESERVED, LEASED, UNDER_RENOVATION, RETIRED}" }
      - { name: renovation_start_date, type: datetime, source: system, description: "Start of current renovation interval (inclusive, UTC midnight), null if not under renovation", default: null }
      - { name: renovation_end_date, type: datetime, source: system, description: "End of current renovation interval (inclusive, UTC midnight), null if not under renovation", default: null }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered company name" }
      - { name: business_license_no, type: string, source: input, description: "Business license number; globally unique" }
      - { name: license_expires_on, type: datetime, source: input, description: "License expiry date (UTC midnight)" }
      - { name: qualification_status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | REJECTED", default: "PENDING_REVIEW", constraints: "values in {PENDING_REVIEW, APPROVED, REJECTED}" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: total_deposit_paid_cents, type: integer, source: computed, description: "Sum of Deposit.collected_cents for this tenant across all leases" }
      - { name: total_deposit_refunded_cents, type: integer, source: computed, description: "Sum of Deposit.refunded_cents for this tenant" }
      - { name: total_deposit_retained_cents, type: integer, source: computed, description: "Sum of Deposit.retained_cents for this tenant (deductions kept by landlord)" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "Unit being leased" }
      - { name: tenant_id, type: string, source: input, description: "Tenant party" }
      - { name: start_date, type: datetime, source: input, description: "Lease start date (inclusive, UTC midnight)" }
      - { name: end_date, type: datetime, source: input, description: "Lease end date (exclusive, UTC midnight); end_date > start_date; half-open interval [start_date, end_date)" }
      - { name: base_monthly_rent_cents, type: integer, source: input, description: "Base monthly rent in cents for year 1" }
      - { name: escalation_mode, type: enum, source: input, description: "NONE | ANNUAL | BIENNIAL | STEPPED", constraints: "values in {NONE, ANNUAL, BIENNIAL, STEPPED}" }
      - { name: escalation_pct_bps, type: integer, source: input, description: "Escalation rate in basis points (e.g. 500 = 5.00%) for ANNUAL/BIENNIAL modes; ignored when STEPPED or NONE", default: 0 }
      - { name: stepped_schedule, type: array, source: input, description: "For STEPPED mode: array of {effective_from: datetime, monthly_rent_cents: integer}; effective_from must be ascending and the first entry must equal start_date" }
      - { name: rent_free_days, type: integer, source: input, description: "Number of free days starting at start_date; >= 0; rent_free_days must be < (end_date - start_date in days)", default: 0 }
      - { name: deposit_months, type: integer, source: input, description: "Security deposit equals deposit_months × base_monthly_rent_cents; integer >= 1; <= 6" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | ACTIVE | AMENDMENT_PENDING | TERMINATING | TERMINATED — see §1.2", default: "DRAFT", constraints: "values in {DRAFT, SIGNED, ACTIVE, AMENDMENT_PENDING, TERMINATING, TERMINATED}" }
      - { name: terminated_on, type: datetime, source: system, description: "Effective termination date (UTC midnight); null until TERMINATED", default: null }
      - { name: amendment_count, type: integer, source: system, description: "Number of amendments applied", default: 0 }

  - name: RentScheduleItem
    parent: Lease
    common_fields: false   # immutable per-period ledger row
    fields:
      - { name: lease_id, type: string, source: system, description: "Owning lease" }
      - { name: period_start, type: datetime, source: system, description: "Period start (inclusive, UTC midnight); always the 1st of a month" }
      - { name: period_end, type: datetime, source: system, description: "Period end (exclusive, UTC midnight)" }
      - { name: gross_rent_cents, type: integer, source: computed, description: "Full month rent without rent-free deduction" }
      - { name: rent_free_offset_cents, type: integer, source: computed, description: "Amount of rent waived in this period due to rent_free_days (>= 0)" }
      - { name: net_rent_cents, type: integer, source: computed, description: "gross_rent_cents - rent_free_offset_cents; >= 0" }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | WAIVED | VOIDED", default: "PENDING", constraints: "values in {PENDING, PAID, WAIVED, VOIDED}" }

  - name: Deposit
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "Owning lease (1:1)" }
      - { name: required_cents, type: integer, source: computed, description: "deposit_months × base_monthly_rent_cents at time of last lease change" }
      - { name: collected_cents, type: integer, source: system, description: "Amount collected to date; >= 0; <= required_cents until topped-up on amendment" }
      - { name: retained_cents, type: integer, source: system, description: "Amount deducted and retained by landlord on settlement; >= 0" }
      - { name: refunded_cents, type: integer, source: system, description: "Amount refunded to tenant on settlement; >= 0" }
      - { name: frozen_status, type: enum, source: system, description: "UNFROZEN | FROZEN — independent of adjustment_status; FROZEN blocks refund execution", default: "UNFROZEN", constraints: "values in {UNFROZEN, FROZEN}" }
      - { name: adjustment_status, type: enum, source: system, description: "AT_REST | ADJUSTMENT_PENDING | DEDUCTION_PENDING_APPROVAL | SETTLED — independent of frozen_status", default: "AT_REST", constraints: "values in {AT_REST, ADJUSTMENT_PENDING, DEDUCTION_PENDING_APPROVAL, SETTLED}" }
      - { name: pending_deduction_items, type: array, source: system, description: "Array of {kind: OVERDUE_RENT|DAMAGE|CLEANING, amount_cents: integer, note: string}; populated during move-out workflow", default: [] }

  - name: FeeBill
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "Lease being billed (must be ACTIVE or TERMINATING/TERMINATED in window)" }
      - { name: unit_id, type: string, source: system, description: "Derived from lease" }
      - { name: tenant_id, type: string, source: system, description: "Derived from lease" }
      - { name: bill_kind, type: enum, source: input, description: "PROPERTY_FEE | ENERGY_FEE", constraints: "values in {PROPERTY_FEE, ENERGY_FEE}" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive UTC midnight; must be the 1st of a month" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive UTC midnight; must be the 1st of next month or later" }
      - { name: property_fee_mode, type: enum, source: input, description: "BY_AREA | FIXED_RATE — required when bill_kind=PROPERTY_FEE; null otherwise", default: null, constraints: "values in {BY_AREA, FIXED_RATE} or null" }
      - { name: rate_per_sqm_per_month_cents, type: integer, source: input, description: "Required when property_fee_mode=BY_AREA", default: null }
      - { name: fixed_rate_cents_per_month, type: integer, source: input, description: "Required when property_fee_mode=FIXED_RATE", default: null }
      - { name: energy_mode, type: enum, source: input, description: "SUB_METER | ALLOCATED — required when bill_kind=ENERGY_FEE", default: null, constraints: "values in {SUB_METER, ALLOCATED} or null" }
      - { name: sub_meter_kwh, type: number, source: input, description: "Required when energy_mode=SUB_METER; >= 0", default: null }
      - { name: shared_total_kwh, type: number, source: input, description: "Required when energy_mode=ALLOCATED; >= 0; total kWh on the shared meter for the period", default: null }
      - { name: shared_meter_group_unit_ids, type: array, source: input, description: "Required when energy_mode=ALLOCATED; list of unit ids sharing the meter; must include this bill's unit_id; >= 2 entries", default: null }
      - { name: tariff_per_kwh_cents, type: integer, source: input, description: "Energy tariff in cents per kWh; required for ENERGY_FEE; > 0", default: null }
      - { name: amount_cents, type: integer, source: computed, description: "Computed per §1.3 property_fee_calc or energy_fee_calc" }
      - { name: status, type: enum, source: system, description: "ISSUED | DISPUTED | PAID | VOIDED", default: "ISSUED", constraints: "values in {ISSUED, DISPUTED, PAID, VOIDED}" }
      - { name: dispute_reason, type: string, source: input, description: "Reason text when status moves to DISPUTED", default: null }

  - name: MoveOutRequest
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "Owning lease" }
      - { name: requested_on, type: datetime, source: system, description: "Server timestamp when request submitted" }
      - { name: target_move_out_date, type: datetime, source: input, description: "Tenant's chosen move-out date (UTC midnight); must satisfy lead-time rule §1.4" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | INSPECTION_DONE | RESTORATION_CONFIRMED | DEDUCTION_PROPOSED | DEDUCTION_APPROVED | SETTLED | REJECTED", default: "SUBMITTED", constraints: "values in {SUBMITTED, INSPECTION_DONE, RESTORATION_CONFIRMED, DEDUCTION_PROPOSED, DEDUCTION_APPROVED, SETTLED, REJECTED}" }
      - { name: inspection_findings, type: array, source: input, description: "Array of {item: string, severity: MINOR|MAJOR, estimated_cost_cents: integer}; populated at inspection step", default: [] }
      - { name: restoration_done, type: boolean, source: input, description: "Whether tenant completed restoration work", default: false }

  - name: AuditEvent
    parent: null
    common_fields: false   # immutable
    fields:
      - { name: subject_kind, type: enum, source: system, description: "LEASE | DEPOSIT | FEE_BILL | UNIT", constraints: "values in {LEASE, DEPOSIT, FEE_BILL, UNIT}" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject entity" }
      - { name: action, type: enum, source: system, description: "CONTRACT_SIGNED | CONTRACT_AMENDED | CONTRACT_RENEWED | CONTRACT_TERMINATED | FEE_ADJUSTED | FEE_DISPUTED | DEPOSIT_DEDUCTED | DEPOSIT_REFUNDED | UNIT_SPLIT | UNIT_MERGED" }
      - { name: actor_role, type: enum, source: system, description: "PropertyManager | LeasingAgent | FinanceOfficer | Tenant | system" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at the time of the action; 'system' for automatic events" }
      - { name: payload, type: object, source: system, description: "Frozen snapshot of relevant fields at event time" }
      - { name: occurred_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Unit
    initial_state: VACANT
    terminal_states: [RETIRED]
    transitions:
      - from: VACANT
        to: RESERVED
        trigger: "POST /buildings/:building_id/units/:unit_id/reserve (tenant submits intent letter + deposit token)"
        actor: LeasingAgent
        preconditions:
          - "Unit.status == VACANT (ERR_INVALID_STATE)"
          - "No overlapping Lease in {SIGNED,ACTIVE,AMENDMENT_PENDING,TERMINATING} on this unit (ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "Unit.status → RESERVED"
      - from: RESERVED
        to: VACANT
        trigger: "POST /buildings/:building_id/units/:unit_id/release-reservation"
        actor: LeasingAgent
        preconditions: ["No Lease for this unit is in DRAFT or SIGNED (ERR_LEASE_DEPENDENCY)"]
        side_effects: ["Unit.status → VACANT"]
      - from: RESERVED
        to: LEASED
        trigger: "system (cascaded from Lease DRAFT→SIGNED on this unit)"
        actor: system
        preconditions: []
        side_effects: ["Unit.status → LEASED (mirrors Lease.status SIGNED or ACTIVE)"]
      - from: VACANT
        to: LEASED
        trigger: "system (cascaded from Lease DRAFT→SIGNED when no prior reservation)"
        actor: system
        preconditions: []
        side_effects: ["Unit.status → LEASED"]
      - from: LEASED
        to: VACANT
        trigger: "system (cascaded from Lease TERMINATING→TERMINATED)"
        actor: system
        preconditions: ["Deposit.adjustment_status == SETTLED for the just-terminated lease (ERR_DEPOSIT_NOT_SETTLED)"]
        side_effects: ["Unit.status → VACANT"]
      - from: VACANT
        to: UNDER_RENOVATION
        trigger: "POST /buildings/:building_id/units/:unit_id/start-renovation (body: end_date)"
        actor: PropertyManager
        preconditions:
          - "Unit.status == VACANT (ERR_INVALID_STATE)"
          - "renovation_end_date > renovation_start_date (ERR_INVALID_DATE_RANGE)"
          - "No Lease for this unit in {SIGNED,ACTIVE,AMENDMENT_PENDING,TERMINATING} whose [start_date,end_date) overlaps [renovation_start_date, renovation_end_date + 1 day] (ERR_RENOVATION_LEASE_CONFLICT)"
        side_effects: ["Unit.status → UNDER_RENOVATION; renovation_start_date/end_date set from request"]
      - from: UNDER_RENOVATION
        to: VACANT
        trigger: "POST /buildings/:building_id/units/:unit_id/finish-renovation"
        actor: PropertyManager
        preconditions: []
        side_effects: ["Unit.status → VACANT; renovation_start_date/end_date cleared"]
      - from: VACANT
        to: RETIRED
        trigger: "POST /buildings/:building_id/units/:unit_id/split (body: child_units[])"
        actor: PropertyManager
        preconditions:
          - "Unit.status == VACANT (ERR_INVALID_STATE)"
          - "Sum of child_units[].area_sqm equals this Unit.area_sqm exactly to 2 decimal places (ERR_AREA_SUM_MISMATCH)"
          - "All child_units[].code unique per building (ERR_UNIT_CODE_CONFLICT)"
        side_effects:
          - "Unit.status → RETIRED"
          - "New Unit rows created for each child with parent_unit_id = this Unit.id, building_id inherited, status=VACANT, rent_reference_per_sqm inherited"
          - "AuditEvent UNIT_SPLIT created (depth=1)"
      - from: VACANT
        to: RETIRED
        trigger: "POST /buildings/:building_id/units/merge (body: source_unit_ids[], merged_code)"
        actor: PropertyManager
        preconditions:
          - "All source units have status == VACANT (ERR_INVALID_STATE)"
          - "All source units belong to the same building and floor (ERR_MERGE_LAYOUT_INVALID)"
        side_effects:
          - "All source Unit.status → RETIRED"
          - "New Unit created with area_sqm = sum of sources, code=merged_code, parent_unit_id=null, status=VACANT, rent_reference_per_sqm = area-weighted average of sources rounded to 2 dp"
          - "AuditEvent UNIT_MERGED created"

  - entity: Tenant
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /tenants/:tenant_id/approve"
        actor: LeasingAgent
        preconditions:
          - "license_expires_on > current_server_date (ERR_LICENSE_EXPIRED)"
          - "business_license_no unique among non-REJECTED tenants (ERR_DUPLICATE_LICENSE)"
        side_effects: ["qualification_status → APPROVED"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /tenants/:tenant_id/reject"
        actor: LeasingAgent
        preconditions: []
        side_effects: ["qualification_status → REJECTED"]
      - from: APPROVED
        to: PENDING_REVIEW
        trigger: "POST /tenants/:tenant_id/revoke-approval"
        actor: LeasingAgent
        preconditions: ["No Lease in {DRAFT,SIGNED,ACTIVE,AMENDMENT_PENDING,TERMINATING} for this tenant (ERR_TENANT_HAS_ACTIVE_LEASE)"]
        side_effects: ["qualification_status → PENDING_REVIEW"]

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /leases/:lease_id/sign"
        actor: LeasingAgent
        preconditions:
          - "Tenant.qualification_status == APPROVED (ERR_TENANT_NOT_APPROVED)"
          - "Unit.status in {VACANT, RESERVED} (ERR_UNIT_NOT_AVAILABLE)"
          - "No other Lease in {SIGNED,ACTIVE,AMENDMENT_PENDING,TERMINATING} whose [start_date,end_date) overlaps this Lease's [start_date,end_date) on the same Unit (ERR_LEASE_OVERLAP)"
          - "No Unit renovation interval [renovation_start_date, renovation_end_date] (closed, inclusive of end and one buffer day after) overlaps Lease [start_date,end_date) (ERR_RENOVATION_LEASE_CONFLICT)"
          - "Lease.stepped_schedule valid (when escalation_mode=STEPPED) (ERR_STEPPED_SCHEDULE_INVALID)"
        side_effects:
          - "Lease.status → SIGNED"
          - "Deposit row created with required_cents = deposit_months × base_monthly_rent_cents; collected_cents=0; adjustment_status=AT_REST; frozen_status=UNFROZEN"
          - "Unit.status cascades to LEASED"
          - "RentScheduleItem rows generated for every calendar month in [start_date,end_date) per §1.3 rent_schedule_generation"
          - "AuditEvent CONTRACT_SIGNED created"
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /leases/:lease_id/activate"
        actor: LeasingAgent
        preconditions:
          - "Deposit.collected_cents == Deposit.required_cents (ERR_DEPOSIT_INCOMPLETE)"
          - "current_server_date >= Lease.start_date (ERR_LEASE_NOT_YET_STARTED)"
        side_effects: ["Lease.status → ACTIVE"]
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /leases/:lease_id/amend (body: amendment payload)"
        actor: LeasingAgent
        preconditions: []
        side_effects:
          - "Lease.status → AMENDMENT_PENDING"
          - "Deposit.adjustment_status → ADJUSTMENT_PENDING"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /leases/:lease_id/amend-confirm"
        actor: FinanceOfficer
        preconditions:
          - "Pending amendment payload validates (ERR_AMENDMENT_PAYLOAD_INVALID)"
          - "If end_date changed: new [start_date,end_date) must not overlap any other Lease on the unit (ERR_LEASE_OVERLAP)"
        side_effects:
          - "Lease.status → ACTIVE"
          - "Lease.amendment_count incremented by 1"
          - "RentScheduleItem rows for periods >= effective_from regenerated per §1.3 rent_schedule_generation (compensating_invariant cra_invariant)"
          - "Deposit.required_cents recomputed; Deposit.adjustment_status → AT_REST"
          - "AuditEvent CONTRACT_AMENDED created"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /leases/:lease_id/amend-cancel"
        actor: LeasingAgent
        preconditions: []
        side_effects:
          - "Lease.status → ACTIVE (cycle back, no field changes)"
          - "Deposit.adjustment_status → AT_REST"
      - from: ACTIVE
        to: TERMINATING
        trigger: "POST /leases/:lease_id/move-out-request (body: target_move_out_date)"
        actor: Tenant
        preconditions:
          - "target_move_out_date >= current_server_date + 30 days (ERR_MOVE_OUT_LEAD_TIME)"
          - "target_move_out_date <= Lease.end_date (ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "Lease.status → TERMINATING"
          - "MoveOutRequest row created with status=SUBMITTED"
          - "Deposit.frozen_status → FROZEN"
      - from: TERMINATING
        to: TERMINATED
        trigger: "POST /move-out-requests/:request_id/finalize"
        actor: FinanceOfficer
        preconditions:
          - "MoveOutRequest.status == DEDUCTION_APPROVED (ERR_INVALID_STATE)"
          - "Deposit.adjustment_status == SETTLED (ERR_DEPOSIT_NOT_SETTLED)"
          - "All FeeBill rows for this lease are PAID or VOIDED (ERR_OUTSTANDING_FEE_BILL)"
        side_effects:
          - "Lease.status → TERMINATED; Lease.terminated_on = MoveOutRequest.target_move_out_date"
          - "RentScheduleItem rows with period_start > terminated_on → VOIDED"
          - "Unit.status cascades to VACANT (via Unit state machine, gated on Deposit settled)"
          - "AuditEvent CONTRACT_TERMINATED created"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /leases/:lease_id/renew (body: new_end_date, optional new_base_monthly_rent_cents)"
        actor: LeasingAgent
        preconditions:
          - "new_end_date > Lease.end_date (ERR_INVALID_DATE_RANGE)"
          - "No other Lease overlaps (Lease.end_date, new_end_date) on the unit (ERR_LEASE_OVERLAP)"
          - "current_server_date >= Lease.end_date - 60 days (ERR_RENEWAL_WINDOW_NOT_OPEN)"
        side_effects:
          - "Lease.end_date set to new_end_date"
          - "If new_base_monthly_rent_cents provided: Lease.base_monthly_rent_cents updated"
          - "RentScheduleItem rows added for periods in (old end_date, new_end_date)"
          - "Deposit.required_cents recomputed; if increased, Deposit.adjustment_status → ADJUSTMENT_PENDING"
          - "AuditEvent CONTRACT_RENEWED created"

  - entity: Deposit
    initial_state: AT_REST
    terminal_states: [SETTLED]
    transitions:
      - from: AT_REST
        to: ADJUSTMENT_PENDING
        trigger: "system (cascaded from Lease.amend or Lease.renew increasing required_cents)"
        actor: system
        preconditions: []
        side_effects: ["Deposit.adjustment_status → ADJUSTMENT_PENDING"]
      - from: ADJUSTMENT_PENDING
        to: AT_REST
        trigger: "POST /deposits/:deposit_id/top-up (body: amount_cents)"
        actor: Tenant
        preconditions:
          - "Deposit.collected_cents + amount_cents <= Deposit.required_cents (ERR_DEPOSIT_OVERPAY)"
          - "After applying: Deposit.collected_cents == Deposit.required_cents (ERR_DEPOSIT_INCOMPLETE if not)"
        side_effects: ["Deposit.collected_cents += amount_cents; adjustment_status → AT_REST; Tenant.total_deposit_paid_cents recomputed"]
      - from: AT_REST
        to: DEDUCTION_PENDING_APPROVAL
        trigger: "POST /deposits/:deposit_id/propose-deductions (body: deduction_items[])"
        actor: PropertyManager
        preconditions:
          - "Owning Lease.status == TERMINATING (ERR_INVALID_STATE)"
          - "Sum of deduction_items[].amount_cents <= Deposit.collected_cents (ERR_DEDUCTION_EXCEEDS_DEPOSIT)"
        side_effects: ["adjustment_status → DEDUCTION_PENDING_APPROVAL; pending_deduction_items set"]
      - from: DEDUCTION_PENDING_APPROVAL
        to: SETTLED
        trigger: "POST /deposits/:deposit_id/approve-deductions"
        actor: FinanceOfficer
        preconditions: ["Owning MoveOutRequest.status in {RESTORATION_CONFIRMED, DEDUCTION_PROPOSED} (ERR_INVALID_STATE)"]
        side_effects:
          - "Deposit.retained_cents = sum of pending_deduction_items[].amount_cents"
          - "Deposit.refunded_cents = Deposit.collected_cents - Deposit.retained_cents"
          - "Tenant.total_deposit_retained_cents and total_deposit_refunded_cents recomputed"
          - "adjustment_status → SETTLED"
          - "AuditEvent DEPOSIT_DEDUCTED (depth=2 from Lease.terminate cascade) and DEPOSIT_REFUNDED created"
      - from: DEDUCTION_PENDING_APPROVAL
        to: AT_REST
        trigger: "POST /deposits/:deposit_id/reject-deductions"
        actor: FinanceOfficer
        preconditions: []
        side_effects: ["adjustment_status → AT_REST; pending_deduction_items cleared (cycle back)"]

  - entity: MoveOutRequest
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: INSPECTION_DONE
        trigger: "POST /move-out-requests/:request_id/record-inspection (body: inspection_findings[])"
        actor: PropertyManager
        preconditions: ["MoveOutRequest.requested_on <= current_server_date (always true)"]
        side_effects: ["status → INSPECTION_DONE; inspection_findings set"]
      - from: INSPECTION_DONE
        to: RESTORATION_CONFIRMED
        trigger: "POST /move-out-requests/:request_id/confirm-restoration"
        actor: PropertyManager
        preconditions: ["restoration_done == true (provided in body) (ERR_RESTORATION_INCOMPLETE)"]
        side_effects: ["status → RESTORATION_CONFIRMED"]
      - from: RESTORATION_CONFIRMED
        to: DEDUCTION_PROPOSED
        trigger: "system (cascaded when Deposit.adjustment_status → DEDUCTION_PENDING_APPROVAL)"
        actor: system
        preconditions: []
        side_effects: ["status → DEDUCTION_PROPOSED"]
      - from: DEDUCTION_PROPOSED
        to: DEDUCTION_APPROVED
        trigger: "system (cascaded when Deposit.adjustment_status → SETTLED via approve-deductions)"
        actor: system
        preconditions: []
        side_effects: ["status → DEDUCTION_APPROVED"]
      - from: DEDUCTION_APPROVED
        to: SETTLED
        trigger: "system (cascaded when Lease → TERMINATED via finalize)"
        actor: system
        preconditions: []
        side_effects: ["status → SETTLED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /move-out-requests/:request_id/reject"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "status → REJECTED"
          - "Owning Lease.status reverted from TERMINATING → ACTIVE"
          - "Deposit.frozen_status → UNFROZEN"

  - entity: FeeBill
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /fee-bills/:bill_id/pay"
        actor: Tenant
        preconditions: ["Owning Lease.status in {ACTIVE, AMENDMENT_PENDING, TERMINATING, TERMINATED} (ERR_LEASE_NOT_BILLABLE)"]
        side_effects: ["FeeBill.status → PAID"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /fee-bills/:bill_id/dispute (body: dispute_reason)"
        actor: Tenant
        preconditions: []
        side_effects: ["FeeBill.status → DISPUTED; dispute_reason set"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /fee-bills/:bill_id/resolve-dispute (body: resolution_keeps_bill: boolean)"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "If resolution_keeps_bill: FeeBill.status → ISSUED (cycle back)"
          - "AuditEvent FEE_DISPUTED created"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /fee-bills/:bill_id/resolve-dispute (body: resolution_keeps_bill: false)"
        actor: FinanceOfficer
        preconditions: []
        side_effects: ["FeeBill.status → VOIDED; AuditEvent FEE_ADJUSTED created"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /fee-bills/:bill_id/void"
        actor: FinanceOfficer
        preconditions: []
        side_effects: ["FeeBill.status → VOIDED; AuditEvent FEE_ADJUSTED created"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two lease sign requests for the same unit with overlapping date ranges submitted simultaneously"
    guarantee: "At most one signed Lease per unit per [start_date,end_date) window; second is rejected"
    error_id: ERR_LEASE_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on Lease.status transition DRAFT→SIGNED per (unit_id, overlapping window)"

  - scenario: "Same unit reserved by two leasing agents concurrently"
    guarantee: "First reservation wins; second rejected"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Unit.status transition VACANT→RESERVED"

  - scenario: "Two top-up requests for the same deposit submitted simultaneously, both within remaining-required cap"
    guarantee: "Both may apply only if cumulative does not exceed required_cents; otherwise loser rejected"
    error_id: ERR_DEPOSIT_OVERPAY
    http_status: 409
    serialization: "Serialize on Deposit row; cumulative collected_cents must not exceed required_cents"

  - scenario: "Tenant disputes a fee bill while finance officer marks it PAID at the same time"
    guarantee: "Exactly one wins; loser rejected with state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on FeeBill.status"

  - scenario: "PATCH or PUT submitted with stale version field"
    guarantee: "Stale-write rejected"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    serialization: "Optimistic concurrency on entity.version (any entity with common_fields=true)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rent_schedule_generation
    trigger: "Lease.sign, Lease.amend-confirm, Lease.renew"
    algorithm: tiered_pricing
    formula: |
      For every calendar month M = [first_of_month, first_of_next_month) intersecting [start_date,end_date):
        # Step 1: determine the monthly rent in effect on M
        if escalation_mode == NONE:
          monthly = base_monthly_rent_cents
        elif escalation_mode == ANNUAL:
          years_elapsed = floor( (M.start - start_date) / 365.25 )
          monthly = round_half_up( base_monthly_rent_cents * ((10000 + escalation_pct_bps) / 10000) ** years_elapsed )
        elif escalation_mode == BIENNIAL:
          biennia_elapsed = floor( (M.start - start_date) / (2 * 365.25) )
          monthly = round_half_up( base_monthly_rent_cents * ((10000 + escalation_pct_bps) / 10000) ** biennia_elapsed )
        elif escalation_mode == STEPPED:
          monthly = stepped_schedule[k].monthly_rent_cents
            where k = max index with stepped_schedule[k].effective_from <= M.start
        # Step 2: prorate for partial first/last month
        days_in_month = days(M)
        active_days = days( intersect(M, [start_date,end_date)) )
        gross_rent_cents = round_half_up( monthly * active_days / days_in_month )
        # Step 3: rent-free deduction (rent-free applies to the EARLIEST days of the lease, day-by-day)
        free_days_in_this_month = max(0, min(rent_free_days, days_since(start_date, M.start)+active_days) - days_since(start_date, M.start))
        rent_free_offset_cents = round_half_up( monthly * free_days_in_this_month / days_in_month )
        net_rent_cents = max(0, gross_rent_cents - rent_free_offset_cents)
    input_set: "All calendar months M intersecting [Lease.start_date, Lease.end_date); excluded months: none. For amendments, only periods with period_start >= effective_from of the amendment are regenerated; earlier RentScheduleItem rows preserved unchanged."
    constants:
      DAYS_PER_YEAR: 365.25
    precision: "Integer cents; round_half_up at each Step output (per-line then sum — explicitly NOT sum then round)"
    variants:
      - name: linear_no_escalation
        when: "escalation_mode == NONE"
        difference: "Skip Step 1's escalation power; monthly is constant base_monthly_rent_cents across all M"
      - name: stepped_escalation
        when: "escalation_mode == STEPPED"
        difference: "Monthly rent is looked up from stepped_schedule (table-driven) rather than computed by exponential power; this DIVERGES from ANNUAL/BIENNIAL for the same effective rate when steps don't align with anniversaries"

  - name: property_fee_calc
    trigger: "POST /fee-bills (when bill_kind=PROPERTY_FEE)"
    algorithm: tiered_pricing
    formula: |
      months_in_period = months_between(period_start, period_end)   # whole months only; period must align to month boundaries
      if property_fee_mode == BY_AREA:
        amount_cents = round_half_up( unit.area_sqm * rate_per_sqm_per_month_cents * months_in_period )
      elif property_fee_mode == FIXED_RATE:
        amount_cents = fixed_rate_cents_per_month * months_in_period
      # Cap: amount must not exceed PROPERTY_FEE_CAP_CENTS_PER_SQM_PER_MONTH * unit.area_sqm * months_in_period
      cap_cents = round_half_up( PROPERTY_FEE_CAP_CENTS_PER_SQM_PER_MONTH * unit.area_sqm * months_in_period )
      amount_cents = min(amount_cents, cap_cents)
    input_set: "Single unit derived from owning Lease; only this lease's bill is computed (no aggregation across tenants)."
    constants:
      PROPERTY_FEE_CAP_CENTS_PER_SQM_PER_MONTH: 5000   # 50.00 currency units / sqm / month
    precision: "Integer cents; round_half_up after the area*rate*months product (NOT per-month then sum)"

  - name: energy_fee_calc
    trigger: "POST /fee-bills (when bill_kind=ENERGY_FEE)"
    algorithm: aggregation
    formula: |
      if energy_mode == SUB_METER:
        amount_cents = round_half_up( sub_meter_kwh * tariff_per_kwh_cents )
      elif energy_mode == ALLOCATED:
        # Public-area shared cost allocated proportionally by area, rounded per-tenant then summed.
        # Group: shared_meter_group_unit_ids = [U1, U2, ..., Un]; this bill's unit is Ui.
        total_group_area = sum(Uk.area_sqm for k=1..n)
        my_share_kwh = shared_total_kwh * (this_unit.area_sqm / total_group_area)   # NOT rounded yet
        amount_cents = round_half_up( my_share_kwh * tariff_per_kwh_cents )         # rounding step is HERE
      # Multi-tenant shared-meter algorithm note: when multiple bills are issued for the same
      # shared meter group + period, the system must ensure sum(amount_cents over all group units)
      # equals round_half_up(shared_total_kwh * tariff_per_kwh_cents) ± n_group cents drift; the
      # canonical bill (lexicographically smallest unit_id) absorbs the remainder so the SUM
      # exactly matches the group total (compensating_invariant energy_allocation_invariant).
    input_set: "SUB_METER: single bill's reading only. ALLOCATED: all units in shared_meter_group_unit_ids; tie-break for remainder absorption is lexicographically smallest unit_id."
    constants: {}
    precision: "Integer cents; ALLOCATED mode rounds round_half_up PER UNIT BILL, then the canonical unit absorbs the integer-cent remainder so the group sum is exact (per-line-then-sum with remainder reconciliation; explicitly NOT sum-then-round)"
    variants:
      - name: sub_meter_actual
        when: "energy_mode == SUB_METER"
        difference: "Charge is sub_meter_kwh × tariff exactly; ignores area entirely"
      - name: allocated_by_area
        when: "energy_mode == ALLOCATED"
        difference: "Charge is computed from shared_total_kwh and area share; for the SAME unit consuming the SAME real kWh, SUB_METER vs ALLOCATED can produce different amount_cents because allocation distributes ALL shared kWh by area, not by actual use"

  - name: unit_status_derivation
    trigger: "Any Lease state transition, any Unit renovation transition, any split/merge"
    algorithm: priority_rules
    formula: |
      Evaluation order (first match wins):
        1) if Unit was emitted as a child of split or source of merge with parent_unit_id set and the corresponding split-or-merge AuditEvent exists with subject_id mapping that retires THIS unit: → RETIRED
        2) elif Unit has a current renovation interval (renovation_start_date != null and renovation_end_date != null and current_server_date in [renovation_start_date, renovation_end_date]): → UNDER_RENOVATION
        3) elif there exists a Lease for this unit with status in {SIGNED, ACTIVE, AMENDMENT_PENDING, TERMINATING}: → LEASED
        4) elif there is a Lease for this unit in DRAFT for which an intent letter exists (status==RESERVED set explicitly via reserve endpoint): → RESERVED
        5) else: → VACANT
    input_set: "All Lease rows for this unit (status != TERMINATED considered active for derivation); current renovation interval; UNIT_SPLIT/UNIT_MERGED AuditEvent on this unit"
    constants: {}
    precision: "Enumerated state; no numeric precision"

  - name: deposit_required_recompute
    trigger: "Lease.amend-confirm, Lease.renew (when base_monthly_rent_cents or deposit_months changes)"
    algorithm: aggregation
    formula: |
      required_cents = deposit_months * base_monthly_rent_cents
      delta = required_cents_new - required_cents_old
      if delta > 0: adjustment_status → ADJUSTMENT_PENDING (tenant must top up)
      if delta < 0: tenant credited (refunded immediately, retained=0 for this delta)
      if delta == 0: no-op
    input_set: "Owning Lease.deposit_months and Lease.base_monthly_rent_cents post-amendment/post-renewal"
    constants: {}
    precision: "Integer cents"

  - name: tenant_deposit_ledger
    trigger: "Any Deposit.collected_cents, retained_cents, or refunded_cents change"
    algorithm: aggregation
    formula: |
      For each Tenant T:
        total_deposit_paid_cents     = sum(Deposit.collected_cents for Deposit linked via Lease.tenant_id == T.id)
        total_deposit_refunded_cents = sum(Deposit.refunded_cents  for same set)
        total_deposit_retained_cents = sum(Deposit.retained_cents  for same set)
      Invariant (compensating_invariant deposit_ledger_invariant):
        For every Tenant T: total_deposit_paid_cents - total_deposit_refunded_cents - total_deposit_retained_cents
          == sum(Deposit.collected_cents - Deposit.refunded_cents - Deposit.retained_cents for same set)
        Restated: outstanding-deposit-held-by-landlord(T) =
          total_deposit_paid_cents - total_deposit_refunded_cents - total_deposit_retained_cents
        After every collect/refund/retain action, this quantity equals the sum of "live balance" per Deposit row.
    input_set: "All Deposit rows linked to leases where Lease.tenant_id == this tenant"
    constants: {}
    precision: "Integer cents (exact; no rounding)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role permitted for the endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment ids resolve, left-to-right (building_id then unit_id, lease_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Foreign-key ids in request body resolve (unit_id, tenant_id, lease_id) and belong to the correct parent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PATCH with FK fields"

  - priority: 5
    category: state
    check: "Target resource in correct state for the operation per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Tenant must have qualification_status==APPROVED before signing a Lease"
    error_id: ERR_TENANT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /leases/:lease_id/sign"

  - priority: 7
    category: business_safety
    check: "Lease cannot be signed/amended/renewed if overlapping renovation interval on the same unit"
    error_id: ERR_RENOVATION_LEASE_CONFLICT
    http_status: 409
    applies_to: "POST /leases, POST /leases/:lease_id/sign, POST /leases/:lease_id/amend-confirm, POST /leases/:lease_id/renew, POST /buildings/:building_id/units/:unit_id/start-renovation"

  - priority: 8
    category: business_temporal
    check: "Half-open lease interval [start_date,end_date) must not overlap any other non-terminated Lease on the unit (adjacency allowed: end_date of A may equal start_date of B)"
    error_id: ERR_LEASE_OVERLAP
    http_status: 409
    applies_to: "POST /leases/:lease_id/sign, POST /leases/:lease_id/amend-confirm, POST /leases/:lease_id/renew"

  - priority: 9
    category: business_temporal
    check: "Move-out target_move_out_date must be >= current_server_date + 30 days (strict 30-day lead time; 29 days is rejected, 30 days is accepted)"
    error_id: ERR_MOVE_OUT_LEAD_TIME
    http_status: 409
    applies_to: "POST /leases/:lease_id/move-out-request"

  - priority: 10
    category: business_fiscal
    check: "Sum of proposed deduction items must not exceed Deposit.collected_cents (boundary: equality is OK, strictly greater is rejected)"
    error_id: ERR_DEDUCTION_EXCEEDS_DEPOSIT
    http_status: 409
    applies_to: "POST /deposits/:deposit_id/propose-deductions"

  - priority: 11
    category: business_fiscal
    check: "Deposit top-up may not push collected_cents above required_cents (boundary: exact equality is OK)"
    error_id: ERR_DEPOSIT_OVERPAY
    http_status: 409
    applies_to: "POST /deposits/:deposit_id/top-up"

  - priority: 12
    category: business_constraint
    check: "Sum of child unit areas in a split must equal parent area exactly to 2 decimal places"
    error_id: ERR_AREA_SUM_MISMATCH
    http_status: 409
    applies_to: "POST /buildings/:building_id/units/:unit_id/split"

  - priority: 13
    category: business_constraint
    check: "Stepped schedule rows must be in ascending effective_from order with the first equal to start_date and the last < end_date"
    error_id: ERR_STEPPED_SCHEDULE_INVALID
    http_status: 422
    applies_to: "POST /leases, POST /leases/:lease_id/amend, POST /leases/:lease_id/amend-confirm"

  - priority: 14
    category: business_referential
    check: "Cannot finalize move-out while any FeeBill for the lease is in ISSUED or DISPUTED status"
    error_id: ERR_OUTSTANDING_FEE_BILL
    http_status: 409
    applies_to: "POST /move-out-requests/:request_id/finalize"

  - priority: 14b
    category: business_referential
    check: "FeeBill issuance requires Lease.status in {ACTIVE, AMENDMENT_PENDING, TERMINATING}; bills against DRAFT, SIGNED, or TERMINATED leases are rejected"
    error_id: ERR_LEASE_NOT_BILLABLE
    http_status: 409
    applies_to: "POST /fee-bills, POST /fee-bills/:bill_id/pay"

  - priority: 15
    category: business_constraint
    check: "Concurrent stale-write detection via version field"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "PATCH and PUT endpoints"

  - priority: 16
    category: business_constraint
    check: "Request body field types and required-field presence"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table (28 endpoints)
# =============================================================================
endpoints:
  # --- Building ---
  - method: POST
    path: "/buildings"
    description: "Create a building"
    roles: [PropertyManager]
    code: 201
    input: [name, address, floors_count]
    output: Building
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/buildings/:building_id"
    description: "Get building"
    roles: [PropertyManager, LeasingAgent, FinanceOfficer]
    code: 200
    input: []
    output: Building
    side_effects: []

  # --- Unit ---
  - method: POST
    path: "/buildings/:building_id/units"
    description: "Create a unit"
    roles: [PropertyManager]
    code: 201
    input: [floor, code, area_sqm, orientation, usage_type, rent_reference_per_sqm]
    output: Unit
    side_effects: ["status=VACANT"]

  - method: GET
    path: "/buildings/:building_id/units/:unit_id"
    description: "Get unit (includes derived status)"
    roles: [PropertyManager, LeasingAgent, FinanceOfficer, Tenant]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/buildings/:building_id/units/:unit_id/reserve"
    description: "Reserve a vacant unit pending lease signing"
    roles: [LeasingAgent]
    code: 200
    input: [tenant_id]
    output: Unit
    side_effects: ["Unit.status VACANT→RESERVED"]

  - method: POST
    path: "/buildings/:building_id/units/:unit_id/release-reservation"
    description: "Release a reservation"
    roles: [LeasingAgent]
    code: 200
    input: []
    output: Unit
    side_effects: ["Unit.status RESERVED→VACANT"]

  - method: POST
    path: "/buildings/:building_id/units/:unit_id/start-renovation"
    description: "Begin a renovation interval on a vacant unit"
    roles: [PropertyManager]
    code: 200
    input: [renovation_start_date, renovation_end_date]
    output: Unit
    side_effects: ["status VACANT→UNDER_RENOVATION"]

  - method: POST
    path: "/buildings/:building_id/units/:unit_id/finish-renovation"
    description: "End renovation interval"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Unit
    side_effects: ["status UNDER_RENOVATION→VACANT; renovation dates cleared"]

  - method: POST
    path: "/buildings/:building_id/units/:unit_id/split"
    description: "Split a vacant unit into children (sum of areas = parent area)"
    roles: [PropertyManager]
    code: 201
    input: [child_units]
    output: "Unit[]"
    side_effects: ["parent → RETIRED; children Units created VACANT; AuditEvent UNIT_SPLIT"]

  - method: POST
    path: "/buildings/:building_id/units/merge"
    description: "Merge two or more vacant units into a new one"
    roles: [PropertyManager]
    code: 201
    input: [source_unit_ids, merged_code]
    output: Unit
    side_effects: ["sources → RETIRED; merged Unit created; AuditEvent UNIT_MERGED"]

  # --- Tenant ---
  - method: POST
    path: "/tenants"
    description: "Onboard a tenant; submits license info"
    roles: [LeasingAgent]
    code: 201
    input: [legal_name, business_license_no, license_expires_on, contact_email]
    output: Tenant
    side_effects: ["qualification_status=PENDING_REVIEW"]

  - method: POST
    path: "/tenants/:tenant_id/approve"
    description: "Approve tenant qualification"
    roles: [LeasingAgent]
    code: 200
    input: []
    output: Tenant
    side_effects: ["qualification_status → APPROVED"]

  - method: POST
    path: "/tenants/:tenant_id/reject"
    description: "Reject tenant qualification"
    roles: [LeasingAgent]
    code: 200
    input: []
    output: Tenant
    side_effects: ["qualification_status → REJECTED"]

  - method: GET
    path: "/tenants/:tenant_id"
    description: "Get tenant including aggregated deposit ledger"
    roles: [LeasingAgent, FinanceOfficer, Tenant]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  # --- Lease ---
  - method: POST
    path: "/leases"
    description: "Create a Lease in DRAFT state"
    roles: [LeasingAgent]
    code: 201
    input: [unit_id, tenant_id, start_date, end_date, base_monthly_rent_cents, escalation_mode, "escalation_pct_bps?", "stepped_schedule?", "rent_free_days?", deposit_months]
    output: Lease
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/leases/:lease_id/sign"
    description: "Sign a DRAFT lease (creates Deposit + RentScheduleItems)"
    roles: [LeasingAgent]
    code: 200
    input: []
    output: Lease
    side_effects: ["Lease.status → SIGNED", "Deposit created", "RentScheduleItems generated", "Unit cascaded LEASED", "AuditEvent CONTRACT_SIGNED"]

  - method: POST
    path: "/leases/:lease_id/activate"
    description: "Activate a SIGNED lease once deposit is fully collected and start_date reached"
    roles: [LeasingAgent]
    code: 200
    input: []
    output: Lease
    side_effects: ["Lease.status → ACTIVE"]

  - method: POST
    path: "/leases/:lease_id/amend"
    description: "Begin lease amendment (rent change, schedule extension, etc.)"
    roles: [LeasingAgent]
    code: 200
    input: ["new_base_monthly_rent_cents?", "new_end_date?", "new_rent_free_days?", "new_deposit_months?", "new_stepped_schedule?", "new_escalation_mode?", "new_escalation_pct_bps?", effective_from]
    output: Lease
    side_effects: ["status → AMENDMENT_PENDING", "Deposit.adjustment_status → ADJUSTMENT_PENDING"]

  - method: POST
    path: "/leases/:lease_id/amend-confirm"
    description: "Confirm pending amendment; regenerates rent schedule for periods >= effective_from"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Lease
    side_effects: ["status → ACTIVE", "amendment_count++", "RentScheduleItem rows regenerated", "Deposit.required_cents recomputed", "AuditEvent CONTRACT_AMENDED"]

  - method: POST
    path: "/leases/:lease_id/amend-cancel"
    description: "Cancel a pending amendment (Lease returns to ACTIVE unchanged)"
    roles: [LeasingAgent]
    code: 200
    input: []
    output: Lease
    side_effects: ["status → ACTIVE (cycle)", "Deposit.adjustment_status → AT_REST"]

  - method: POST
    path: "/leases/:lease_id/renew"
    description: "Renew an ACTIVE lease (extends end_date; optional rent change)"
    roles: [LeasingAgent]
    code: 200
    input: [new_end_date, "new_base_monthly_rent_cents?"]
    output: Lease
    side_effects: ["end_date updated", "RentScheduleItem rows added", "Deposit.required_cents recomputed if rent changed", "AuditEvent CONTRACT_RENEWED"]

  - method: POST
    path: "/leases/:lease_id/move-out-request"
    description: "Tenant submits a move-out request with 30-day lead time"
    roles: [Tenant]
    code: 201
    input: [target_move_out_date]
    output: MoveOutRequest
    side_effects: ["Lease.status → TERMINATING", "Deposit.frozen_status → FROZEN", "MoveOutRequest.status=SUBMITTED"]

  - method: GET
    path: "/leases/:lease_id"
    description: "Get lease (includes RentScheduleItem summary)"
    roles: [PropertyManager, LeasingAgent, FinanceOfficer, Tenant]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/leases/:lease_id/rent-schedule"
    description: "List RentScheduleItem rows for the lease"
    roles: [PropertyManager, LeasingAgent, FinanceOfficer, Tenant]
    code: 200
    input: []
    output: "RentScheduleItem[]"
    side_effects: []

  # --- Deposit ---
  - method: GET
    path: "/deposits/:deposit_id"
    description: "Get deposit"
    roles: [PropertyManager, LeasingAgent, FinanceOfficer, Tenant]
    code: 200
    input: []
    output: Deposit
    side_effects: []

  - method: POST
    path: "/deposits/:deposit_id/top-up"
    description: "Tenant pays into deposit toward required_cents"
    roles: [Tenant]
    code: 200
    input: [amount_cents]
    output: Deposit
    side_effects: ["collected_cents increases", "adjustment_status → AT_REST when full", "Tenant ledger recomputed"]

  - method: POST
    path: "/deposits/:deposit_id/propose-deductions"
    description: "Property manager proposes deduction items against deposit during move-out"
    roles: [PropertyManager]
    code: 200
    input: [deduction_items]
    output: Deposit
    side_effects: ["adjustment_status → DEDUCTION_PENDING_APPROVAL", "MoveOutRequest cascades to DEDUCTION_PROPOSED"]

  - method: POST
    path: "/deposits/:deposit_id/approve-deductions"
    description: "Finance officer approves deductions, sets retained/refunded amounts"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Deposit
    side_effects: ["retained/refunded set", "adjustment_status → SETTLED", "MoveOutRequest cascades to DEDUCTION_APPROVED", "Tenant ledger recomputed", "AuditEvent DEPOSIT_DEDUCTED + DEPOSIT_REFUNDED"]

  - method: POST
    path: "/deposits/:deposit_id/reject-deductions"
    description: "Finance officer rejects proposed deductions (cycle back to AT_REST)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Deposit
    side_effects: ["adjustment_status → AT_REST (cycle)"]

  # --- FeeBill ---
  - method: POST
    path: "/fee-bills"
    description: "Issue a property-fee or energy-fee bill for a lease"
    roles: [FinanceOfficer]
    code: 201
    input: [lease_id, bill_kind, period_start, period_end, "property_fee_mode?", "rate_per_sqm_per_month_cents?", "fixed_rate_cents_per_month?", "energy_mode?", "sub_meter_kwh?", "shared_total_kwh?", "shared_meter_group_unit_ids?", "tariff_per_kwh_cents?"]
    output: FeeBill
    side_effects: ["amount_cents computed", "status=ISSUED"]

  - method: GET
    path: "/fee-bills/:bill_id"
    description: "Get fee bill"
    roles: [PropertyManager, FinanceOfficer, Tenant]
    code: 200
    input: []
    output: FeeBill
    side_effects: []

  - method: POST
    path: "/fee-bills/:bill_id/pay"
    description: "Tenant pays a fee bill"
    roles: [Tenant]
    code: 200
    input: []
    output: FeeBill
    side_effects: ["status → PAID"]

  - method: POST
    path: "/fee-bills/:bill_id/dispute"
    description: "Tenant disputes a fee bill"
    roles: [Tenant]
    code: 200
    input: [dispute_reason]
    output: FeeBill
    side_effects: ["status → DISPUTED"]

  - method: POST
    path: "/fee-bills/:bill_id/resolve-dispute"
    description: "Finance officer resolves a dispute"
    roles: [FinanceOfficer]
    code: 200
    input: [resolution_keeps_bill]
    output: FeeBill
    side_effects: ["status → ISSUED or VOIDED", "AuditEvent FEE_DISPUTED or FEE_ADJUSTED"]

  - method: POST
    path: "/fee-bills/:bill_id/void"
    description: "Void a fee bill (admin override)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: FeeBill
    side_effects: ["status → VOIDED", "AuditEvent FEE_ADJUSTED"]

  # --- MoveOutRequest ---
  - method: GET
    path: "/move-out-requests/:request_id"
    description: "Get move-out request"
    roles: [PropertyManager, FinanceOfficer, Tenant]
    code: 200
    input: []
    output: MoveOutRequest
    side_effects: []

  - method: POST
    path: "/move-out-requests/:request_id/record-inspection"
    description: "Property manager records inspection findings"
    roles: [PropertyManager]
    code: 200
    input: [inspection_findings]
    output: MoveOutRequest
    side_effects: ["status → INSPECTION_DONE"]

  - method: POST
    path: "/move-out-requests/:request_id/confirm-restoration"
    description: "Property manager confirms restoration is complete"
    roles: [PropertyManager]
    code: 200
    input: [restoration_done]
    output: MoveOutRequest
    side_effects: ["status → RESTORATION_CONFIRMED"]

  - method: POST
    path: "/move-out-requests/:request_id/reject"
    description: "Property manager rejects the move-out request (reverts Lease to ACTIVE)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: MoveOutRequest
    side_effects: ["status → REJECTED", "Lease.status TERMINATING→ACTIVE", "Deposit.frozen_status → UNFROZEN"]

  - method: POST
    path: "/move-out-requests/:request_id/finalize"
    description: "Finance officer finalizes settlement; Lease → TERMINATED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: MoveOutRequest
    side_effects: ["status → SETTLED", "Lease.status → TERMINATED", "Unit cascades to VACANT", "RentScheduleItem rows after terminated_on → VOIDED", "AuditEvent CONTRACT_TERMINATED"]

  # --- AuditEvent ---
  - method: GET
    path: "/audit-events"
    description: "List audit events with filters (subject_kind?, subject_id?, action?, since?)"
    roles: [PropertyManager, FinanceOfficer]
    code: 200
    input: ["subject_kind?", "subject_id?", "action?", "since?"]
    output: "AuditEvent[]"
    side_effects: []

  # --- Test-driving endpoints (clock + sweep) ---
  - method: POST
    path: "/_clock/advance"
    description: "Test helper: advance server clock to the given ISO 8601 timestamp (UTC). Required so tests can reach time-gated transitions (move-out lead time, lease.activate's start_date check, renewal window, renovation overlap)."
    roles: [PropertyManager]
    code: 200
    input: [to]
    output: "object"
    side_effects: ["server clock advanced"]

  - method: POST
    path: "/_sweep/run"
    description: "Test helper: run scheduled sweep that auto-VOIDs RentScheduleItem rows past terminated_on, recomputes Unit.status, and recomputes Tenant ledger aggregates. Required so tests can deterministically observe ops-run-checkpoint side effects."
    roles: [PropertyManager]
    code: 200
    input: []
    output: "object"
    side_effects: ["Tenant ledger recomputed", "Unit.status recomputed", "Stale RentScheduleItem rows voided"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or unrecognized"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-segment id or FK id does not resolve"
  - id: ERR_VALIDATION
    http: 422
    condition: "Request body field type, required-field, or enum value invalid"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in correct state for this operation"
  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "Optimistic-concurrency version check failed"
  - id: ERR_TENANT_NOT_APPROVED
    http: 409
    condition: "Tenant.qualification_status is not APPROVED at lease-sign time"
  - id: ERR_LICENSE_EXPIRED
    http: 409
    condition: "Tenant.license_expires_on <= current_server_date at tenant-approval time"
  - id: ERR_DUPLICATE_LICENSE
    http: 409
    condition: "Another non-REJECTED Tenant exists with the same business_license_no"
  - id: ERR_UNIT_NOT_AVAILABLE
    http: 409
    condition: "Unit.status is not VACANT or RESERVED for this lease"
  - id: ERR_LEASE_OVERLAP
    http: 409
    condition: "Lease [start_date,end_date) (half-open) overlaps another non-terminated Lease on the same unit"
  - id: ERR_RENOVATION_LEASE_CONFLICT
    http: 409
    condition: "Renovation interval [renovation_start_date, renovation_end_date + 1 day] (closed with 1-day buffer) overlaps a Lease interval on the same unit"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "end_date <= start_date or other temporal-ordering violation"
  - id: ERR_STEPPED_SCHEDULE_INVALID
    http: 422
    condition: "Stepped schedule rows not strictly ascending, first effective_from != start_date, or last >= end_date"
  - id: ERR_LEASE_DEPENDENCY
    http: 409
    condition: "A reservation cannot be released because a DRAFT/SIGNED Lease references it"
  - id: ERR_DEPOSIT_INCOMPLETE
    http: 409
    condition: "Deposit.collected_cents is less than Deposit.required_cents"
  - id: ERR_DEPOSIT_OVERPAY
    http: 409
    condition: "Top-up would push Deposit.collected_cents above required_cents"
  - id: ERR_DEDUCTION_EXCEEDS_DEPOSIT
    http: 409
    condition: "Sum of proposed deduction_items.amount_cents exceeds Deposit.collected_cents"
  - id: ERR_DEPOSIT_NOT_SETTLED
    http: 409
    condition: "Deposit.adjustment_status is not SETTLED when required (lease finalize, unit cascade to VACANT)"
  - id: ERR_OUTSTANDING_FEE_BILL
    http: 409
    condition: "Lease still has FeeBill rows in ISSUED or DISPUTED status when move-out finalize attempted"
  - id: ERR_LEASE_NOT_BILLABLE
    http: 409
    condition: "Lease.status is DRAFT or REJECTED-like when paying a fee bill"
  - id: ERR_LEASE_NOT_YET_STARTED
    http: 409
    condition: "Lease.activate called before current_server_date >= Lease.start_date"
  - id: ERR_MOVE_OUT_LEAD_TIME
    http: 409
    condition: "Move-out target_move_out_date < current_server_date + 30 days"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 409
    condition: "Renewal attempted earlier than 60 days before end_date"
  - id: ERR_AREA_SUM_MISMATCH
    http: 409
    condition: "Sum of child_units.area_sqm does not equal parent Unit.area_sqm to 2 dp"
  - id: ERR_UNIT_CODE_CONFLICT
    http: 409
    condition: "Unit code already exists within the building"
  - id: ERR_MERGE_LAYOUT_INVALID
    http: 409
    condition: "Source units do not share the same building and floor"
  - id: ERR_RESTORATION_INCOMPLETE
    http: 409
    condition: "Confirm-restoration called with restoration_done == false"
  - id: ERR_AMENDMENT_PAYLOAD_INVALID
    http: 422
    condition: "Amendment payload references unknown fields or violates field constraints"
  - id: ERR_TENANT_HAS_ACTIVE_LEASE
    http: 409
    condition: "Tenant approval revocation blocked by active lease"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Manages buildings, units, renovations, splits/merges, move-out inspection and restoration confirmation, deduction proposal."
    identity: opaque
    exclusive_operations:
      - "POST /buildings — create building"
      - "POST /buildings/:building_id/units — create unit"
      - "POST /buildings/:building_id/units/:unit_id/start-renovation"
      - "POST /buildings/:building_id/units/:unit_id/finish-renovation"
      - "POST /buildings/:building_id/units/:unit_id/split"
      - "POST /buildings/:building_id/units/merge"
      - "POST /move-out-requests/:request_id/record-inspection"
      - "POST /move-out-requests/:request_id/confirm-restoration"
      - "POST /move-out-requests/:request_id/reject"
      - "POST /deposits/:deposit_id/propose-deductions"
      - "POST /_clock/advance, POST /_sweep/run (test helpers)"
    shared_operations:
      - "GET on buildings, units, leases, fee bills, deposits, move-out requests, audit events"

  - name: LeasingAgent
    description: "Manages tenants and leases up to and including activation and amendment initiation."
    identity: opaque
    exclusive_operations:
      - "POST /tenants and /tenants/:tenant_id/approve|reject|revoke-approval"
      - "POST /buildings/:building_id/units/:unit_id/reserve|release-reservation"
      - "POST /leases (create), /leases/:lease_id/sign, /activate, /amend, /amend-cancel, /renew"
    shared_operations:
      - "GET on tenants, leases, units, rent schedules"

  - name: FinanceOfficer
    description: "Issues and resolves fee bills, confirms amendments, approves/rejects deductions, finalizes move-out."
    identity: opaque
    exclusive_operations:
      - "POST /fee-bills (create), /fee-bills/:bill_id/resolve-dispute, /fee-bills/:bill_id/void"
      - "POST /leases/:lease_id/amend-confirm"
      - "POST /deposits/:deposit_id/approve-deductions, /reject-deductions"
      - "POST /move-out-requests/:request_id/finalize"
    shared_operations:
      - "GET on leases, deposits, fee bills, audit events"

  - name: Tenant
    description: "Tenant party acting on behalf of their own Tenant entity. X-User-ID equals Tenant.id."
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /leases/:lease_id/move-out-request — only the lease's tenant"
      - "POST /deposits/:deposit_id/top-up — only the owning lease's tenant"
      - "POST /fee-bills/:bill_id/pay — only the bill's tenant"
      - "POST /fee-bills/:bill_id/dispute — only the bill's tenant"
    shared_operations:
      - "GET on own Tenant, own Leases, own Deposits, own FeeBills, own MoveOutRequests, own Units (via lease)"
