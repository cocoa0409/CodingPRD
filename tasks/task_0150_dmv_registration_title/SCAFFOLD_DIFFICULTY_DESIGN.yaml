scaffold_difficulty_design:

  # =====================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sales_tax_resident_vs_non_resident_on_transfer
        grounds:
          - calculations.sales_tax_on_transfer
          - entities.Owner.fields.is_resident
          - entities.TransferApplication.fields.trade_in_value
          - entities.TransferApplication.fields.declared_sale_price
        distinguishing_aspect: |
          Operates on the TransferApplication / Vehicle financial domain: the resident
          variant deducts trade_in_value from the taxable base before applying RATE_RESIDENT
          (0.0725), while the non-resident variant ignores trade-in entirely and applies
          RATE_NON_RESIDENT (0.085) to the full declared_sale_price — same inputs, different
          numbers.
        test_recipe:
          setup:
            - "Owner-A is_resident=true (residency_state=CA), Owner-B is_resident=false (residency_state=NV)."
            - "Vehicle-A and Vehicle-B identical: curb_weight_lbs=2500, model_year=2026, fuel_type=GASOLINE."
            - "Both vehicles VIN-verified; CLEAN title; current emissions PASSED, expires 2028-01-01."
            - "TransferApplication-A on Vehicle-A by Owner-A: application_type=TITLE_TRANSFER, declared_sale_price=20000.00, trade_in_value=5000.00."
            - "TransferApplication-B on Vehicle-B by Owner-B: application_type=TITLE_TRANSFER, declared_sale_price=20000.00, trade_in_value=5000.00."
            - "Each application driven by VinVerifier → assess-fees-ready (EMISSIONS_PASSED)."
          trigger:
            - "POST /transfer-applications/A/assess-fees as TaxAssessor."
            - "POST /transfer-applications/B/assess-fees as TaxAssessor."
          assert:
            - "TransferApplication-A: reg_fee == 87.00, sales_tax == 1087.50, fee_subtotal == 1174.50, processing_fee == 38.00, total_due == 1212.50."
            - "TransferApplication-B: reg_fee == 120.00, sales_tax == 1700.00, fee_subtotal == 1820.00, processing_fee == 38.00, total_due == 1858.00."
            - "TransferApplication-B.sales_tax - TransferApplication-A.sales_tax == 612.50 — proving the dual variants produced different numbers on identical declared_sale_price and trade_in_value."
            - "FeeLedgerEntry for A has SALES_TAX amount_cents == 108750; for B has SALES_TAX amount_cents == 170000."

      - name: real_id_first_submission_vs_resubmission_score
        grounds:
          - calculations.real_id_eligibility_score
          - entities.RealIDApplication.fields.revision_count
          - entities.Owner.fields.real_id_status
          - state_machines.RealIDApplication.DOC_REVIEW_to_APPROVED
          - state_machines.RealIDApplication.DOC_REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Operates on the Owner / RealIDApplication identity domain, not the
          financial domain. The first_submission variant produces a raw score with no
          revision_penalty; the resubmission_loop variant subtracts 5 points per cycle —
          identical document booleans and identical date_of_birth produce different scores
          and a different APPROVED/DOC_REJECTED outcome at the boundary.
        test_recipe:
          setup:
            - "Owner-X date_of_birth set so age 30 at clock=2026-05-19."
            - "RealIDApplication-X1: all three documents true, revision_count=0, status=DOC_REVIEW (start-review already called)."
          trigger:
            - "POST /real-id-applications/X1/approve as RealIDReviewer."
            - "Owner-Y duplicate of Owner-X; RealIDApplication-Y1 with documents_proof_of_ssn=false (other two true), revision_count=0, status=DOC_REVIEW; POST /real-id-applications/Y1/reject as RealIDReviewer; PATCH /resubmit with all three docs true; POST start-review; POST approve."
          assert:
            - "Owner-X.real_id_score == 100.00 (40+30+25+5+0) and Owner-X.real_id_status == APPROVED."
            - "RealIDApplication-Y1.revision_count == 1 after resubmit."
            - "Owner-Y.real_id_score == 95.00 (40+30+25+5-5) and Owner-Y.real_id_status == APPROVED."
            - "Numeric difference between Owner-X.real_id_score and Owner-Y.real_id_score equals 5.00 — confirming the revision_penalty branch executed."

  # =====================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: registration_fee_three_input_nonlinear_tiered
        grounds:
          - calculations.registration_fee
          - entities.Vehicle.fields.curb_weight_lbs
          - entities.Vehicle.fields.model_year
          - entities.Owner.fields.is_resident
        distinguishing_aspect: |
          Mode (a): formula with three inputs (weight tier, age factor, residency surcharge)
          interacting non-linearly — the tiered weight base is multiplied by a depreciation
          floor and ADDED to a residency-conditional surcharge. The tier boundary at
          curb_weight_lbs == 6000 produces a step jump in the base, not a linear increment.
        test_recipe:
          setup:
            - "Owner-R is_resident=true; vehicles with curb_weight_lbs values 2500, 4500, 6000 (heavy boundary), model_year 2026 (age 0)."
            - "All vehicles VIN-verified, CLEAN, emissions PASSED through 2028-01-01."
            - "TransferApplications on each vehicle by Owner-R; application_type=TITLE_TRANSFER, declared_sale_price=20000.00, trade_in_value=0.00."
            - "Each application driven to EMISSIONS_PASSED."
          trigger:
            - "POST /transfer-applications/{id}/assess-fees as TaxAssessor for each."
          assert:
            - "For curb_weight_lbs=2500: TransferApplication.fee_subtotal includes reg_fee == 87.00 (65*1.00 + 22)."
            - "For curb_weight_lbs=4500: reg_fee == 132.00 (110*1.00 + 22)."
            - "For curb_weight_lbs=6000: reg_fee == 207.00 (185*1.00 + 22) — confirms boundary at >=6000 uses BASE_HEAVY."

      - name: total_due_circular_evaluation_order
        grounds:
          - calculations.total_due_with_processing
          - calculations.registration_fee
          - calculations.sales_tax_on_transfer
          - entities.TransferApplication.fields.fee_subtotal
          - entities.TransferApplication.fields.processing_fee
          - entities.TransferApplication.fields.total_due
        distinguishing_aspect: |
          Mode (c): circular-looking dependency where total_due = subtotal + processing_fee,
          and processing_fee depends on subtotal tier — but subtotal must be rounded BEFORE
          tier selection. The scaffold pins evaluation order in three steps with independent
          rounding at each step; swapping "round after final sum" with "round per step"
          yields different cents at tier boundaries.
        test_recipe:
          setup:
            - "Owner-R is_resident=true; Vehicle: curb_weight_lbs=2500, model_year=2024 (age 2 at clock=2026), fuel_type=GASOLINE."
            - "Vehicle VIN-verified, CLEAN, emissions PASSED."
            - "TransferApplication: TITLE_TRANSFER, declared_sale_price=20000.00, trade_in_value=5000.00, status=EMISSIONS_PASSED."
          trigger:
            - "POST /transfer-applications/{id}/assess-fees as TaxAssessor."
          assert:
            - "sales_tax = 15000 * 0.0725 = 1087.50 (STEP-rounded)."
            - "reg_fee = 65 * 0.90 + 22 = 80.50 (STEP-rounded)."
            - "fee_subtotal == 1168.00 (1087.50 + 80.50, rounded at sum step)."
            - "processing_fee == 38.00 (tier 3 selected because 1000 < 1168 <= 5000)."
            - "total_due == 1206.00 (1168.00 + 38.00 at final step)."
            - "FeeLedgerEntry rows: SALES_TAX cents 108750, REG_FEE cents 8050, PROCESSING_FEE cents 3800; sum of debits == 120600 cents."

  # =====================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: title_parallel_dimensions_lien_and_salvage
        grounds:
          - state_machines.Title
          - entities.Vehicle.fields.title_status
          - entities.Vehicle.fields.lien_status
          - entities.LienRecord.fields.status
        distinguishing_aspect: |
          Parallel state dimensions on a single entity (Vehicle/Title): title_status
          (CLEAN ↔ SALVAGE_PENDING_REBUILD ↔ REBUILT, or → NON_REPAIRABLE terminal) and
          lien_status (NONE → ACTIVE → RELEASED) evolve INDEPENDENTLY — a lien release
          does not affect title_status and a salvage event does not flip lien_status. Both
          axes are observable on the same Vehicle row.
        test_recipe:
          setup:
            - "Vehicle V with CLEAN title, lien_status=NONE."
            - "Owner-A holds the active Title."
            - "Create LienRecord on the active Title (Vehicle.lien_status flips to ACTIVE)."
            - "Independently, POST /vehicles/V/salvage-event severity=PARTIAL (title_status flips to SALVAGE_PENDING_REBUILD)."
          trigger:
            - "PATCH /lien-records/{id}/release with release_reference='REL-123'."
          assert:
            - "After lien release: Vehicle.lien_status == RELEASED AND Vehicle.title_status == SALVAGE_PENDING_REBUILD (both axes preserved their independent values)."
            - "LienRecord.status == RELEASED and LienRecord.released_at set."

      - name: real_id_application_cyclic_revision_loop
        grounds:
          - state_machines.RealIDApplication
          - entities.RealIDApplication.fields.status
          - entities.RealIDApplication.fields.revision_count
          - validations[priority=15]
        distinguishing_aspect: |
          Cyclic state machine on a different entity (RealIDApplication, not Title):
          SUBMITTED → DOC_REVIEW → DOC_REJECTED → SUBMITTED returns the entity to an
          earlier state, with revision_count incrementing each cycle. The cycle terminates
          at revision_count == 3 via ERR_REVISION_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Owner with date_of_birth giving age 30."
            - "RealIDApplication R with documents_proof_of_ssn=false initially, other two true; status=SUBMITTED, revision_count=0."
          trigger:
            - "POST /real-id-applications/R/start-review (DOC_REVIEW)."
            - "POST /real-id-applications/R/reject (DOC_REJECTED, score 75 < 80)."
            - "PATCH /real-id-applications/R/resubmit (still missing SSN) → revision_count=1."
            - "Repeat start-review/reject/resubmit cycle twice more → revision_count=3."
            - "Attempt PATCH /real-id-applications/R/resubmit a 4th time."
          assert:
            - "After three successful resubmits: RealIDApplication.revision_count == 3 and status == SUBMITTED."
            - "4th resubmit returns 409 with error_id == 'ERR_REVISION_LIMIT_EXCEEDED'."

  # =====================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: salvage_event_to_emissions_to_plate_to_transfer_application
        grounds:
          - state_machines.Title.title_status_CLEAN_to_SALVAGE_PENDING_REBUILD
          - state_machines.EmissionsInspection.IN_PROGRESS_to_CANCELLED
          - state_machines.Plate.ACTIVE_to_SUSPENDED
          - state_machines.TransferApplication
          - entities.Vehicle.fields.title_status
          - entities.Vehicle.fields.emissions_expires_at
        distinguishing_aspect: |
          Depth-4 cascade triggered by salvage-event. Hop 1: salvage-event mutates
          Vehicle.title_status → SALVAGE_PENDING_REBUILD. Hop 2: that title_status flip
          causes IN_PROGRESS EmissionsInspection on the same vehicle to flip to CANCELLED
          (caused by the flip itself, not by the original API call). Hop 3: the same
          title_status flip causes ACTIVE Plate on the vehicle to flip to SUSPENDED. Hop 4:
          the suspended Plate causes any EMISSIONS_PASSED TransferApplication on the
          vehicle to be blocked from assess-fees (subsequent attempts reject with
          ERR_VEHICLE_SALVAGE_LOCKED). Each hop is the consequence of the previous mutation.
        test_recipe:
          setup:
            - "Vehicle V CLEAN; Owner-O Title active; Plate P ACTIVE on V; EmissionsInspection E IN_PROGRESS at station S; TransferApplication T in EMISSIONS_PASSED."
          trigger:
            - "POST /vehicles/V/salvage-event severity=PARTIAL."
          assert:
            - "After salvage event: Vehicle.title_status == 'SALVAGE_PENDING_REBUILD'."
            - "EmissionsInspection E.status == 'CANCELLED'."
            - "Plate P.status == 'SUSPENDED' AND Plate.suspended_at IS NOT NULL."
            - "POST /transfer-applications/T/assess-fees returns 409 with error_id == 'ERR_VEHICLE_SALVAGE_LOCKED'."

      - name: real_id_revoke_to_plate_suspended_to_issue_plate_blocked
        grounds:
          - state_machines.RealIDApplication.APPROVED_to_REVOKED
          - state_machines.Plate.ACTIVE_to_SUSPENDED
          - state_machines.TransferApplication.TAX_ASSESSED_to_PLATE_ISSUED
          - validations[priority=10]
          - entities.Owner.fields.real_id_status
        distinguishing_aspect: |
          Depth-3 cascade triggered by REAL ID revocation (different trigger from
          salvage-event). Hop 1: revoke flips Owner.real_id_status → REVOKED. Hop 2: that
          flip causes ALL ACTIVE Plates on vehicles whose current Title.owner_id matches
          this owner to flip to SUSPENDED. Hop 3: any TransferApplication in TAX_ASSESSED
          for that owner is then frozen — subsequent issue-plate calls reject with
          ERR_OWNER_REAL_ID_REVOKED. Each hop is caused by the previous mutation.
        test_recipe:
          setup:
            - "Owner-O with APPROVED real_id_status; RealIDApplication R in APPROVED."
            - "Vehicle V owned by O; Plate P ACTIVE on V; TransferApplication T in TAX_ASSESSED for a second Vehicle V2 also owned by O."
          trigger:
            - "POST /real-id-applications/R/revoke as PlatformAdmin."
          assert:
            - "Owner-O.real_id_status == 'REVOKED'."
            - "Plate P.status == 'SUSPENDED' AND Plate P.suspended_at IS NOT NULL."
            - "POST /transfer-applications/T/issue-plate returns 409 with error_id == 'ERR_OWNER_REAL_ID_REVOKED'."

  # =====================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_referential_at_assess_fees
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.TransferApplication.EMISSIONS_PASSED_to_TAX_ASSESSED
        distinguishing_aspect: |
          Category pair: state (ERR_INVALID_STATE, priority 6) vs business_referential
          (ERR_LIEN_ACTIVE, priority 11). A TransferApplication in DRAFT with an ACTIVE
          lien on the vehicle triggers BOTH failures; the scaffold's priority order pins
          ERR_INVALID_STATE as the winning error.
        test_recipe:
          setup:
            - "Vehicle V CLEAN; Title T active; LienRecord L ACTIVE on T (Vehicle.lien_status == ACTIVE)."
            - "TransferApplication A on V in status DRAFT (NOT EMISSIONS_PASSED) — caller skipped verify-vin and emissions."
          trigger:
            - "POST /transfer-applications/A/assess-fees as TaxAssessor."
          assert:
            - "Response status == 409."
            - "Response body data.error_id == 'ERR_INVALID_STATE' (NOT 'ERR_LIEN_ACTIVE')."

      - name: business_safety_beats_business_fiscal_at_issue_plate
        grounds:
          - validations[priority=10]
          - validations[priority=17]
          - state_machines.TransferApplication.TAX_ASSESSED_to_PLATE_ISSUED
        distinguishing_aspect: |
          Different category pair: business_safety (ERR_OWNER_REAL_ID_REVOKED, priority 10)
          vs business_fiscal (ERR_PAYMENT_REQUIRED, priority 17). A TransferApplication in
          TAX_ASSESSED with paid_at IS NULL AND owner's real_id_status flipped to REVOKED
          triggers both; ERR_OWNER_REAL_ID_REVOKED wins.
        test_recipe:
          setup:
            - "Owner-O previously APPROVED; RealIDApplication R subsequently REVOKED (Owner.real_id_status == REVOKED)."
            - "Vehicle V VIN-verified, CLEAN, emissions PASSED."
            - "TransferApplication A on V by O in TAX_ASSESSED; paid_at IS NULL."
          trigger:
            - "POST /transfer-applications/A/issue-plate as PlateIssuer with plate_number='ABC123'."
          assert:
            - "Response status == 409."
            - "Response body data.error_id == 'ERR_OWNER_REAL_ID_REVOKED' (NOT 'ERR_PAYMENT_REQUIRED')."

  # =====================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: curb_weight_heavy_tier_boundary_at_6000_inclusive
        grounds:
          - calculations.registration_fee
          - entities.Vehicle.fields.curb_weight_lbs
        distinguishing_aspect: |
          Metric: curb_weight_lbs threshold. The scaffold pins ">= 6000" (inclusive) as
          the heavy tier; 5999 must use BASE_MID (110.00) and 6000 must use BASE_HEAVY
          (185.00). Reached via POST /transfer-applications/{id}/assess-fees.
        test_recipe:
          setup:
            - "Two Owner-R is_resident=true, identical except curb_weight_lbs: V_below=5999, V_at=6000."
            - "Each vehicle VIN-verified, CLEAN, emissions PASSED; model_year=2026 (age 0)."
            - "Two TransferApplications, identical inputs (declared_sale_price=20000, trade_in_value=0, TITLE_TRANSFER), both at EMISSIONS_PASSED."
          trigger:
            - "POST /transfer-applications/{below}/assess-fees AND POST /transfer-applications/{at}/assess-fees."
          assert:
            - "Below (5999 lbs): TransferApplication.fee_subtotal includes reg_fee == 132.00."
            - "At (6000 lbs):     TransferApplication.fee_subtotal includes reg_fee == 207.00."
            - "Difference of 75.00 confirms the >= 6000 boundary, not > 6000."

      - name: emissions_expiry_inclusive_now_boundary
        grounds:
          - validations[priority=9]
          - entities.Vehicle.fields.emissions_expires_at
          - endpoints./_clock/advance
        distinguishing_aspect: |
          Different metric (datetime expiry, not weight) and different endpoint
          (assess-fees + clock-advance). The validation pins now() >= emissions_expires_at
          as the failure boundary — exactly at expiry the call rejects.
        test_recipe:
          setup:
            - "Owner-R resident; Vehicle V VIN-verified, CLEAN, fuel_type=GASOLINE."
            - "EmissionsInspection passed at 2026-01-01T00:00:00Z → emissions_expires_at = 2028-01-01T00:00:00Z."
            - "TransferApplication A on V at EMISSIONS_PASSED."
            - "POST /_clock/advance to 2027-12-31T23:59:59.999Z (one ms before expiry)."
          trigger:
            - "POST /transfer-applications/A/assess-fees → succeeds, response 200."
            - "POST /_clock/advance to 2028-01-01T00:00:00.000Z."
            - "POST /transfer-applications/A2/assess-fees on a sibling application A2 also at EMISSIONS_PASSED on V."
          assert:
            - "First assess-fees call (clock at 2027-12-31T23:59:59.999Z) returns 200."
            - "Second assess-fees call (clock at exact expiry) returns 409 with error_id == 'ERR_EMISSIONS_EXPIRED'."
            - "Boundary precision: now() == emissions_expires_at triggers rejection (inclusive >=)."

  # =====================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transfer_application_blocked_by_vehicle_lien_status
        grounds:
          - validations[priority=11]
          - entities.Vehicle.fields.lien_status
          - entities.LienRecord.fields.status
          - state_machines.TransferApplication.EMISSIONS_PASSED_to_TAX_ASSESSED
        distinguishing_aspect: |
          Entity pair: TransferApplication ↔ Vehicle (via LienRecord). The TransferApplication
          transition EMISSIONS_PASSED → TAX_ASSESSED is gated by Vehicle.lien_status IN
          {NONE, RELEASED}. The blocker is the Vehicle row, not the application itself.
        test_recipe:
          setup:
            - "Vehicle V CLEAN; active Title T owned by Owner-O."
            - "LienRecord L ACTIVE on T → Vehicle.lien_status == ACTIVE."
            - "Vehicle V VIN-verified, emissions PASSED; TransferApplication A in EMISSIONS_PASSED."
          trigger:
            - "POST /transfer-applications/A/assess-fees as TaxAssessor."
            - "PATCH /lien-records/L/release with release_reference='REL-1'."
            - "POST /transfer-applications/A/assess-fees as TaxAssessor (second attempt)."
          assert:
            - "First assess-fees call: 409 with error_id == 'ERR_LIEN_ACTIVE'."
            - "After lien release: Vehicle.lien_status == 'RELEASED'."
            - "Second assess-fees call: 200, TransferApplication.status == 'TAX_ASSESSED'."

      - name: plate_active_blocked_by_owner_real_id_revoked
        grounds:
          - validations[priority=10]
          - entities.Owner.fields.real_id_status
          - state_machines.RealIDApplication.APPROVED_to_REVOKED
          - state_machines.Plate.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Different entity pair: Plate ↔ Owner (via Vehicle.current_title_id → Title.owner_id).
          Plate ACTIVE status depends on Owner.real_id_status != REVOKED. Revoking the owner's
          REAL ID forces all ACTIVE plates owned by them to SUSPENDED.
        test_recipe:
          setup:
            - "Owner-O with real_id_status=APPROVED; RealIDApplication R in APPROVED."
            - "Vehicle V owned by O (current Title.owner_id == O.id)."
            - "Plate P ACTIVE on V."
          trigger:
            - "POST /real-id-applications/R/revoke as PlatformAdmin."
            - "POST /plates/P/reinstate as PlatformAdmin (try to flip back to ACTIVE)."
          assert:
            - "After revoke: Owner-O.real_id_status == 'REVOKED' AND Plate P.status == 'SUSPENDED'."
            - "reinstate attempt returns 409 with error_id == 'ERR_OWNER_REAL_ID_REVOKED'."

  # =====================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: emissions_inspection_slot_buffer_overlap_at_station
        grounds:
          - validations[priority=12]
          - entities.EmissionsInspection.fields.station_id
          - entities.EmissionsInspection.fields.scheduled_start
          - entities.EmissionsInspection.fields.scheduled_end
        distinguishing_aspect: |
          Interval semantics: BUFFER-based overlap on the station resource. The forbidden
          interval extends [scheduled_start, scheduled_end + 15m); any new inspection whose
          scheduled_start falls inside an existing booking's buffered tail collides. Two
          consecutive inspections that are abutting (B.start == A.end) STILL collide because
          the 15-minute buffer extends A's reserved window by 15 minutes.
        test_recipe:
          setup:
            - "Vehicle V1 and V2 CLEAN, both eligible for inspection."
            - "EmissionsInspection E1 on V1: station_id='STATION-A', scheduled_start=2026-06-01T10:00:00Z, scheduled_end=2026-06-01T10:30:00Z, status=SCHEDULED."
            - "Forbidden interval for E1 = [10:00, 10:45) per the 15-minute buffer rule."
          trigger:
            - "Call X: POST /emissions-inspections with vehicle_id=V2, station_id='STATION-A', scheduled_start=2026-06-01T10:30:00Z, scheduled_end=2026-06-01T11:00:00Z (abutting E1's end; start 10:30 falls INSIDE [10:00, 10:45))."
            - "Call Y: POST /emissions-inspections with vehicle_id=V2, station_id='STATION-A', scheduled_start=2026-06-01T10:44:59.999Z, scheduled_end=2026-06-01T11:14:59.999Z (1ms before buffer end)."
            - "Call Z: POST /emissions-inspections with vehicle_id=V2, station_id='STATION-A', scheduled_start=2026-06-01T10:45:00Z, scheduled_end=2026-06-01T11:15:00Z (exactly at buffer end; half-open interval [10:00, 10:45) excludes 10:45)."
          assert:
            - "Call X returns 409 with error_id == 'ERR_INSPECTION_SLOT_OVERLAP'."
            - "Call Y returns 409 with error_id == 'ERR_INSPECTION_SLOT_OVERLAP' (1ms before buffer end is still inside the half-open window)."
            - "Call Z returns 201 — confirms the half-open interval [start, end+15m) excludes the right boundary."

      - name: plate_number_uniqueness_overlap_across_active_plates
        grounds:
          - validations[priority=13]
          - entities.Plate.fields.plate_number
          - entities.Plate.fields.status
          - concurrency_rules[Plate.plate_number]
        distinguishing_aspect: |
          Different interval semantics: aggregate-capacity overlap on a categorical resource
          (the plate_number string) rather than time. The forbidden "interval" is membership
          in the active-set {ISSUED, ACTIVE, SUSPENDED}; a plate_number already in that set
          collides with a new issuance regardless of time. Only when the existing plate's
          status flips to SURRENDERED does the plate_number free up.
        test_recipe:
          setup:
            - "Two TransferApplications A1 and A2 on different vehicles, both in TAX_ASSESSED with paid_at set."
            - "PlateIssuer issues plate_number='XYZ789' on A1 → Plate P1 ACTIVE."
          trigger:
            - "POST /transfer-applications/A2/issue-plate with plate_number='XYZ789'."
            - "POST /plates/P1/surrender (status → SURRENDERED, surrender_reason=OWNER_REQUEST)."
            - "POST /transfer-applications/A2/issue-plate with plate_number='XYZ789' (retry)."
          assert:
            - "First attempt on A2: returns 409 with error_id == 'ERR_PLATE_NUMBER_TAKEN'."
            - "After P1 surrendered: P1.status == 'SURRENDERED'."
            - "Retry on A2: returns 200 (or the documented success code), new Plate P2 ACTIVE with plate_number == 'XYZ789'."

  # =====================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_ledger_zero_net_after_unpaid_timeout_revert
        grounds:
          - state_machines.TransferApplication.TAX_ASSESSED_to_EMISSIONS_PASSED
          - calculations.total_due_with_processing
          - entities.FeeLedgerEntry.fields.amount_cents
          - entities.FeeLedgerEntry.fields.kind
          - endpoints./_clock/advance
        distinguishing_aspect: |
          Conserved quantity: SUM(FeeLedgerEntry.amount_cents WHERE application_id == A) must
          equal 0 after the TAX_ASSESSED → EMISSIONS_PASSED revert. The forward assess-fees
          posts three positive entries (SALES_TAX, REG_FEE, PROCESSING_FEE); the timeout
          revert posts three negative entries (REFUND_TAX, REFUND_REG, REFUND_PROCESSING)
          summing to exactly the negative of the original three. The named global quantity
          is "net cents per application".
        test_recipe:
          setup:
            - "Owner-R resident; Vehicle V curb_weight=2500, model_year=2024, fuel_type=GASOLINE; CLEAN, emissions PASSED through 2028-01-01."
            - "TransferApplication A: TITLE_TRANSFER, declared_sale_price=20000, trade_in_value=5000, status=EMISSIONS_PASSED."
            - "POST /transfer-applications/A/assess-fees → status=TAX_ASSESSED; FeeLedgerEntry rows posted with amount_cents [108750, 8050, 3800] (sum 120600)."
          trigger:
            - "POST /_clock/advance to (TransferApplication.updated_at + 7d) + 1ms with paid_at IS NULL."
          assert:
            - "After clock-advance: TransferApplication.status == 'EMISSIONS_PASSED' (reverted)."
            - "GET /transfer-applications/A/fee-ledger returns six rows: three positive [108750, 8050, 3800] and three negative [-108750, -8050, -3800]."
            - "SUM(amount_cents) == 0 — conserved global quantity 'net cents per application' is zero."
            - "TransferApplication.fee_subtotal IS NULL AND processing_fee IS NULL AND total_due IS NULL."

      - name: plate_inventory_conservation_on_transfer_complete
        grounds:
          - state_machines.TransferApplication.PLATE_ISSUED_to_COMPLETED
          - state_machines.Plate.ACTIVE_to_SURRENDERED
          - entities.Plate.fields.status
          - entities.Plate.fields.surrender_reason
        distinguishing_aspect: |
          Different conserved quantity: COUNT(Plate rows for a Vehicle). For a TITLE_TRANSFER
          completion, the count of Plate rows EVER created for the vehicle is conserved (a
          new Plate is created, and the prior Plate is moved to SURRENDERED with
          surrender_reason=TRANSFER_COMPLETE) — not deleted. Specifically: COUNT(Plate WHERE
          vehicle_id == V) increases by exactly 1, and COUNT(Plate WHERE vehicle_id == V AND
          status IN {ISSUED, ACTIVE}) stays at exactly 1.
        test_recipe:
          setup:
            - "Vehicle V CLEAN; previous owner Owner-A with current Title and Plate P_old ACTIVE on V."
            - "New owner Owner-B with REAL ID APPROVED."
            - "TransferApplication A: vehicle_id=V, application_type=TITLE_TRANSFER, applicant_owner_id=B, driven to TAX_ASSESSED, paid_at set."
            - "Pre-state: COUNT(Plate WHERE vehicle_id==V) == 1; COUNT(Plate WHERE vehicle_id==V AND status IN {ISSUED, ACTIVE}) == 1."
          trigger:
            - "POST /transfer-applications/A/issue-plate as PlateIssuer-Z (different user-id from the TaxAssessor) with plate_number='NEW123'."
          assert:
            - "After PLATE_ISSUED → COMPLETED: COUNT(Plate WHERE vehicle_id==V) == 2."
            - "COUNT(Plate WHERE vehicle_id==V AND status IN {ISSUED, ACTIVE}) == 1 (only the new plate is active)."
            - "P_old.status == 'SURRENDERED' AND P_old.surrender_reason == 'TRANSFER_COMPLETE'."
            - "New Plate.status == 'ACTIVE' AND new Plate.plate_number == 'NEW123'."
