              payload: { legal_name: "Blockstep Inc", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", authorized_shares: 5001 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e_hi: "$.data.id", e_hi_v: "$.data.version" }
            - call: "POST /api/entities/${e_hi}/agent-appointments"
