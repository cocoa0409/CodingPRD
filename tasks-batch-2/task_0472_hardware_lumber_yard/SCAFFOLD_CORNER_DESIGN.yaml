              captures: { rv: $.data.id }
            - call: "POST /products"
              payload: { sku: "RV-1", vendor_id: "${rv}", sell_mode: "EACH", aisle: "N1", bin: "O1", list_price_cents: 1000, reorder_point: 5, reorder_qty: 50 }
              as: InventoryManager
              captures: { rvp: $.data.id }
            - call: "POST /products/${rvp}/adjust-stock"
              payload: { delta: 1 }
              as: InventoryManager
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${rv}", lines: [ { product_id: "${rvp}", qty: 50, unit_cost_cents: 500 } ] }
