              as: ContentProducer
              captures: { ep2_draft_id: $.data.id }
            - call: "POST /capacity-clusters"
              payload: { name: "NA-1", region_code: "NA", ccu_capacity: 10000 }
              as: LiveOpsCommander
              captures: { cluster_id: $.data.id }
            - call: "POST /live-events"
              payload: { season_id: "${season_id}", capacity_cluster_id: "${cluster_id}", code: "EVT_A", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T02:00:00Z", forecast_ccu: 1000 }
              as: ContentProducer
              captures: { evt_a_id: $.data.id }
          trigger:
            - call: "POST /episodes/${ep2_draft_id}/release"
