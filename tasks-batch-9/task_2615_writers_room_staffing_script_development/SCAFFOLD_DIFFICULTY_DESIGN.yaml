# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2615 - Writers Room Staffing & Script Development
#
# Canonical fixture literals used across every instance (all derived by executing the
# §1.3 formulas, never estimated):
#   GuildAgreement AG (anchor &AGP below) - MBA 2026 rate card.
#   Writer levels: career credits 0 -> STAFF_WRITER, 3 -> STORY_EDITOR, 7 -> CO_PRODUCER,
#                  20 -> PRODUCER (thresholds 2/4/7/12, inclusive).
#   Script fees on a ONE_HOUR episode: STORY 1500000, TELEPLAY 3500000, STORY_AND_TELEPLAY
#                  5000000, REWRITE 1750000, PRODUCTION_POLISH 875000.
#   Script fees on a HALF_HOUR episode: TELEPLAY 1750000.
#   Milestone due dates for production_start 2026-11-02: OUTLINE 2026-09-21,
#                  FIRST_DRAFT 2026-10-05, SECOND_DRAFT 2026-10-19, POLISH 2026-10-30
#                  (each stamped 23:59:59.999Z).
#   Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: guarantee_forward_commit_awards_slot_to_earliest_created_assignment
        grounds:
          - calculations.guarantee_settlement
          - calculations.guarantee_settlement.variants.forward_commit
          - entities.Season.fields.guarantee_application_mode
          - entities.ScriptAssignment.fields.guarantee_slot_applied
          - entities.ScriptAssignment.fields.payable_fee_cents
          - entities.RoomSeat.fields.guarantee_slots_remaining
        distinguishing_aspect: |
          Variant forward_commit orders the guarantee waterfall by ScriptAssignment.created_at, so the
          single guarantee slot of seat s1 is committed to A1 (created first, gross 3500000, offset
          1750000) at CREATION time and A2 (created second) keeps its full 1750000 gross - the exact
          opposite allocation to the chronological_on_acceptance variant tested in the next instance
          on identical inputs.
        test_recipe:
          setup:
            - "GuildAgreement AG (MBA 2026) with STORY_EDITOR minimum 600000/week and guarantee offset 0.5 for that level."
            - "Season SE governed by AG in guarantee_application_mode FORWARD_COMMIT, staffing window 2026-08-01..2026-09-30, production start 2026-11-02, ready_script_target 1."
            - "Writer W1 with 3 career credits (determined_level STORY_EDITOR) holding one CONFIRMED seat s1 in the ACTIVE IN_PERSON room RM, weekly 600000, episodic_guarantee_count 1."
            - "Episodes E1 (ONE_HOUR, UNIT_A, production start 2026-11-02) and E2 (HALF_HOUR, UNIT_B, production start 2026-11-16)."
            - "Assignment A1 = TELEPLAY on E1 already created through seat s1; the logical clock is untouched at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: &AGP
                mba_year: 2026
                min_weekly_cents_by_level: { STAFF_WRITER: 450000, STORY_EDITOR: 600000, EXEC_STORY_EDITOR: 700000, CO_PRODUCER: 850000, PRODUCER: 1000000 }
                script_fee_cents_by_length: { HALF_HOUR: 2500000, ONE_HOUR: 5000000 }
                type_share_pct_by_assignment_type: { STORY: 0.30, TELEPLAY: 0.70, STORY_AND_TELEPLAY: 1.00, REWRITE: 0.35, PRODUCTION_POLISH: 0.175 }
                guarantee_offset_pct_by_level: { STAFF_WRITER: 0.0, STORY_EDITOR: 0.5, EXEC_STORY_EDITOR: 0.5, CO_PRODUCER: 1.0, PRODUCER: 1.0 }
                level_credit_thresholds: { STORY_EDITOR: 2, EXEC_STORY_EDITOR: 4, CO_PRODUCER: 7, PRODUCER: 12 }
                diversity_subsidy_pct: 0.5
                diversity_subsidy_cap_weekly_cents: 250000
                mini_room_floor_multiplier: 1.2
                short_commitment_weeks_threshold: 20
                short_commitment_uplift_pct: 0.1
                facility_fee_tiers: { TIER_1: 200000, TIER_2: 350000, TIER_3: 500000 }
                facility_tier_subtotal_bounds: { TIER_1_MAX: 1500000, TIER_2_MAX: 3000000 }
                format_surcharge_pct: { IN_PERSON: 1.0, REMOTE: 0.4, MINI_ROOM: 0.6 }
                max_free_revision_rounds: 2
                credit_share_threshold_pct: 33
                arbitration_concurrence_pct: 0.667
                arbitration_concurrence_band_pct: 10
                outline_lead_days: 42
                first_draft_lead_days: 28
                second_draft_lead_days: 14
                polish_lead_days: 3
                turnaround_buffer_days: 2
                clearance_item_weights: { NAME: 5, TRADEMARK: 15, DEPICTION: 25 }
                clearance_escalation_score: 30
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Wanda Cole", guild_member_id: "GM-1001", agreement_id: "${ag}", career_episodic_credits: 3 }
              as: GuildAdministrator
              captures: { w1: "$.data.id" }
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Nightfall S1", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, guarantee_application_mode: "FORWARD_COMMIT", staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { se: "$.data.id" }
            - call: "POST /writers/${w1}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "EXCLUSIVE" }
              as: Writer
              as_user_id: "${w1}"
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Main Room", format: "IN_PERSON", seat_capacity: 3, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", diversity_seats_required: 0 }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm: "$.data.id" }
            - call: "POST /rooms/${rm}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv1: "$.data.version" }
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 1, diversity_program_funded: false, expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s1: "$.data.id" }
            - call: "POST /room-seats/${s1}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w1}"
            - call: "POST /rooms/${rm}/activate"
              payload: {}
              as: StudioExecutive
            - call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 1, length_format: "ONE_HOUR", production_unit: "UNIT_A", production_start_date: "2026-11-02T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep1: "$.data.id", ev1: "$.data.version" }
            - call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 2, length_format: "HALF_HOUR", production_unit: "UNIT_B", production_start_date: "2026-11-16T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep2: "$.data.id", ev2: "$.data.version" }
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w1}", assignment_type: "TELEPLAY", expected_episode_version: "${ev1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a1: "$.data.id" }
          trigger:
            - call: "POST /episodes/${ep2}/script-assignments"
              payload: { writer_id: "${w1}", assignment_type: "TELEPLAY", expected_episode_version: "${ev2}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a2: "$.data.id" }
          assert:
            - "ScriptAssignment.${a1}.gross_fee_cents == 3500000"
            - "ScriptAssignment.${a1}.guarantee_slot_applied == true"
            - "ScriptAssignment.${a1}.guarantee_offset_cents == 1750000"
            - "ScriptAssignment.${a1}.payable_fee_cents == 1750000"
            - "ScriptAssignment.${a2}.gross_fee_cents == 1750000"
            - "ScriptAssignment.${a2}.guarantee_slot_applied == false"
            - "ScriptAssignment.${a2}.guarantee_offset_cents == 0"
            - "ScriptAssignment.${a2}.payable_fee_cents == 1750000"
            - "RoomSeat.${s1}.guarantee_slots_consumed == 1"
            - "RoomSeat.${s1}.guarantee_slots_remaining == 0"
            - "Season.${se}.script_fee_committed_cents == 3500000"
            - "GET /fee-ledger-entries?assignment_id=${a1} returns exactly 2 entries: one SCRIPT_FEE_ACCRUAL with amount_cents == 3500000 and one GUARANTEE_OFFSET with amount_cents == -1750000"
            - "GET /fee-ledger-entries?assignment_id=${a2} returns exactly 1 entry of entry_type SCRIPT_FEE_ACCRUAL with amount_cents == 1750000"

      - name: guarantee_chronological_on_acceptance_awards_slot_to_first_approved_assignment
        grounds:
          - calculations.guarantee_settlement
          - calculations.guarantee_settlement.variants.chronological_on_acceptance
          - entities.ScriptAssignment.fields.approved_at
          - entities.FeeLedgerEntry.fields.entry_type
          - state_machines.ScriptAssignment.DELIVERED_to_APPROVED
        distinguishing_aspect: |
          On byte-identical fixture data to the previous instance, variant chronological_on_acceptance
          orders the waterfall by ScriptAssignment.approved_at over APPROVED rows only, so the slot lands
          on A2 (approved first, offset 875000, payable 875000) while A1 keeps its full 3500000 - and the
          season's script_fee_committed_cents ends at 4375000 instead of 3500000.
        test_recipe:
          setup:
            - "Identical fixtures to guarantee_forward_commit_awards_slot_to_earliest_created_assignment, except Season SE is in guarantee_application_mode CHRONOLOGICAL_ON_ACCEPTANCE."
            - "A1 = TELEPLAY on E1 (gross 3500000) created first, A2 = TELEPLAY on E2 (gross 1750000) created second; neither carries a slot at creation in this mode."
            - "All three milestones of A2 (OUTLINE, FIRST_DRAFT, SECOND_DRAFT - the milestone set synthesized for a TELEPLAY assignment) are then delivered so A2 reaches DELIVERED and can be approved before A1."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Wanda Cole", guild_member_id: "GM-1001", agreement_id: "${ag}", career_episodic_credits: 3 }
              as: GuildAdministrator
              captures: { w1: "$.data.id" }
            - call: "POST /seasons"
