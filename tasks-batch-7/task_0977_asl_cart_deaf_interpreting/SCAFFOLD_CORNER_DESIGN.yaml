# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_org_with_required_fields_returns_201
        claim_type: creation
        grounds: ["entities.RequestingOrg", "endpoints.POST /orgs"]
        distinguishing_aspect: "POST /orgs with all required fields returns 201 with server-minted id, status ACTIVE, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
          assert:
            - "201 response; RequestingOrg.${org1}.status == ACTIVE, version == 1, outstanding_balance_cents == 0"
            - "id is a server-minted UUID; created_at == 2026-05-01T00:00:00.000Z (logical clock)"

      - name: get_nonexistent_ids_return_404s
        claim_type: not_found
        grounds: ["errors[ERR_REQUEST_NOT_FOUND]", "errors[ERR_ORG_NOT_FOUND]", "errors[ERR_INTERPRETER_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns the resource-specific 404 error, checked across five entity types."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { e1: $.data.error_id } }
            - { call: "GET /orgs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { e2: $.data.error_id } }
            - { call: "GET /interpreters/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { e3: $.data.error_id } }
            - { call: "GET /invoices/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { e4: $.data.error_id } }
            - { call: "GET /reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { e5: $.data.error_id } }
          assert:
            - "errors observed: ERR_REQUEST_NOT_FOUND, ERR_ORG_NOT_FOUND, ERR_INTERPRETER_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_REPORT_NOT_FOUND, all http 404"

      - name: create_request_missing_consumer_name_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.InterpretingRequest.fields.consumer_name", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required consumer_name yields ERR_INVALID_REQUEST (400) and creates nothing."
        test_recipe:
          setup: ["org exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
          trigger:
            - { call: "POST /requests", payload: { org_id: "${org1}", modality: "VRI", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }, as: OrgRequester, as_user_id: "${org1}", captures: { err_create: $.data.error_id } }
            - { call: "GET /requests", payload: { org_id: "${org1}" }, as: Any }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"
            - "GET /requests?org_id=... returns empty array (nothing persisted)"

      - name: create_request_defaults_and_computed_credential_mapping
        claim_type: defaults
        grounds: ["entities.InterpretingRequest.fields.ada_context", "entities.InterpretingRequest.fields.required_credential_level", "calculations.required_credential_mapping"]
        distinguishing_aspect: "Omitted ada_context defaults to GENERAL with computed required_credential_level SCREENED; explicit LEGAL maps to SPECIALIST."
        test_recipe:
          setup: ["org exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "County Court", org_type: "LEGAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
          trigger:
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Dee Af", modality: "VRI", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }, as: OrgRequester, as_user_id: "${org1}", captures: { r_gen: $.data.id } }
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Lee Litigant", modality: "ASL_ONSITE", ada_context: "LEGAL", scheduled_start: "2026-06-16T14:00:00Z", scheduled_end: "2026-06-16T15:00:00Z", onsite_address: "1 Court Pl" }, as: OrgRequester, as_user_id: "${org1}", captures: { r_leg: $.data.id } }
          assert:
            - "Request.${r_gen}.ada_context == GENERAL and required_credential_level == SCREENED (default + computed mapping)"
            - "Request.${r_leg}.required_credential_level == SPECIALIST (LEGAL mapping)"
            - "both requests version == 1 and status == DRAFT"

      - name: interpreter_system_fields_on_create_and_version_increments
        claim_type: system_fields
        grounds: ["entities.Interpreter.fields.status", "entities.Interpreter.fields.quality_score"]
        distinguishing_aspect: "Create yields PENDING_ONBOARD, quality scores 100, strike count 0, version 1; each mutation (activate, suspend, reinstate) increments version by exactly 1."
        test_recipe:
          setup: ["interpreter with one verified certification"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /interpreters", payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }, as: PlatformAdmin, captures: { i1: $.data.id } }
            - { call: "POST /interpreters/${i1}/certifications", payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }, as: PlatformAdmin, captures: { c1: $.data.id } }
            - { call: "POST /interpreters/${i1}/certifications/${c1}/verify", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /interpreters/${i1}", payload: {}, as: Any, captures: { v_act: $.data.version } }
            - { call: "POST /interpreters/${i1}/suspend", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/reinstate", payload: {}, as: PlatformAdmin }
            - { call: "GET /interpreters/${i1}", payload: {}, as: Any, captures: { v_end: $.data.version } }
          assert:
            - "At create: status == PENDING_ONBOARD, quality_score == 100, quality_score_provisional == 100, active_strike_count == 0, version == 1"
            - "After activate: version == 2; after suspend+reinstate: version == 4 (exactly +1 per mutation)"

      - name: strike_record_has_no_version_field
        claim_type: immutability
        grounds: ["entities.StrikeRecord"]
        distinguishing_aspect: "StrikeRecord (common_fields: false) carries id/created_at only — no version or updated_at keys appear in its representation."
        test_recipe:
          setup: ["interpreter exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /interpreters", payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }, as: PlatformAdmin, captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /strikes", payload: { interpreter_id: "${i1}", occurred_at: "2026-04-01T09:00:00Z" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "GET /interpreters/${i1}/strikes", payload: {}, as: Any }
          assert:
            - "StrikeRecord.${s1} has status ACTIVE and occurred_at 2026-04-01T09:00:00Z"
            - "response object has no `version` and no `updated_at` field (common_fields: false)"

      - name: invalid_enum_value_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.InterpretingRequest.fields.modality", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "modality 'ASL_REMOTE' is outside the declared enum and rejected at priority 2."
        test_recipe:
          setup: ["org exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
          trigger:
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Dee Af", modality: "ASL_REMOTE", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }, as: OrgRequester, as_user_id: "${org1}", captures: { err_enum: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); nothing persisted"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminal_lockdown_cancelled_request_rejects_submit
        claim_type: terminal_lockdown
        grounds: ["state_machines.InterpretingRequest", "errors[ERR_REQUEST_NOT_DRAFT]"]
        distinguishing_aspect: "A CANCELLED (terminal) request rejects submit with ERR_REQUEST_NOT_DRAFT; no transition out of a terminal state exists."
        test_recipe:
          setup: ["request created then cancelled from DRAFT (fee-free)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Dee Af", modality: "VRI", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }, as: OrgRequester, as_user_id: "${org1}", captures: { req1: $.data.id } }
            - { call: "POST /requests/${req1}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
          trigger:
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}", captures: { err_submit: $.data.error_id } }
          assert:
            - "error_id == ERR_REQUEST_NOT_DRAFT (409); Request.${req1}.status remains CANCELLED and cancellation_fee_cents == 0"

      - name: decline_from_accepted_returns_assignment_not_offered
        claim_type: invalid_transition
        grounds: ["state_machines.Assignment", "errors[ERR_ASSIGNMENT_NOT_OFFERED]"]
        distinguishing_aspect: "decline is only declared from OFFERED; from ACCEPTED it returns ERR_ASSIGNMENT_NOT_OFFERED and leaves status untouched."
        test_recipe:
          setup: ["FIXTURE A assignment OFFERED then ACCEPTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
            - { call: "POST /rate-cards", payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 9000, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 70, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /interpreters", payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }, as: PlatformAdmin, captures: { i1: $.data.id } }
            - { call: "POST /interpreters/${i1}/certifications", payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }, as: PlatformAdmin, captures: { c1: $.data.id } }
            - { call: "POST /interpreters/${i1}/certifications/${c1}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/availability-windows", payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", modalities: ["ASL_ONSITE"] }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }, as: OrgRequester, as_user_id: "${org1}", captures: { req1: $.data.id } }
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any, captures: { req1_v: $.data.version } }
            - { call: "POST /requests/${req1}/offers", payload: { interpreter_id: "${i1}", expected_request_version: "${req1_v}" }, as: PlatformAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/accept", payload: {}, as: Interpreter, as_user_id: "${i1}" }
          trigger:
            - { call: "POST /assignments/${asg1}/decline", payload: {}, as: Interpreter, as_user_id: "${i1}", captures: { err_dec: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSIGNMENT_NOT_OFFERED (409); Assignment.${asg1}.status remains ACCEPTED"

      - name: checkout_creates_encounter_with_computed_times
        claim_type: side_effect_execution
        grounds: ["state_machines.Assignment.ON_SITE_to_COMPLETED", "entities.Encounter.fields.billable_minutes"]
        distinguishing_aspect: "check-out materializes the Encounter with actual_start 14:00, actual_end 16:10, actual_minutes 130, billable_minutes 130 (above the 120 minimum), verify_deadline 2026-06-13T16:10:00Z, verified false."
        test_recipe:
          setup: ["FIXTURE A through check-in at 2026-06-10T14:00:00Z; clock advanced to 16:10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
            - { call: "POST /rate-cards", payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 9000, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 70, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /interpreters", payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }, as: PlatformAdmin, captures: { i1: $.data.id } }
            - { call: "POST /interpreters/${i1}/certifications", payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }, as: PlatformAdmin, captures: { c1: $.data.id } }
            - { call: "POST /interpreters/${i1}/certifications/${c1}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/availability-windows", payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", modalities: ["ASL_ONSITE"] }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }, as: OrgRequester, as_user_id: "${org1}", captures: { req1: $.data.id } }
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any, captures: { req1_v: $.data.version } }
            - { call: "POST /requests/${req1}/offers", payload: { interpreter_id: "${i1}", expected_request_version: "${req1_v}" }, as: PlatformAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/accept", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/confirm", payload: {}, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T14:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/depart", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/check-in", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T16:10:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /assignments/${asg1}/check-out", payload: { travel_minutes_claimed: 90, mileage_claimed: 12 }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "GET /assignments/${asg1}/encounters", payload: {}, as: Any }
            - { call: "GET /requests/${req1}", payload: {}, as: Any }
          assert:
            - "Assignment.${asg1}.status == COMPLETED, travel_minutes_claimed == 90, mileage_claimed == 12"
            - "Encounter[0].actual_start == 2026-06-10T14:00:00Z, actual_end == 2026-06-10T16:10:00Z, actual_minutes == 130, billable_minutes == 130"
            - "Encounter[0].verify_deadline == 2026-06-13T16:10:00Z and verified == false"
            - "Request.${req1}.status == IN_PROGRESS (not COMPLETED: verification still pending)"

      - name: suspension_cascade_only_cancels_non_terminal_assignments
        claim_type: side_effect_execution
        grounds: ["state_machines.Interpreter.ACTIVE_to_SUSPENDED"]
        distinguishing_aspect: "Conditional cascade: manual suspend cancels the interpreter's CONFIRMED assignment (SYSTEM) but leaves the COMPLETED one untouched."
        test_recipe:
          setup:
            - "Interpreter i1 with assignment A1 COMPLETED (June 10 encounter) and assignment A2 CONFIRMED for June 20"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
            - { call: "POST /rate-cards", payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 9000, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 70, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /interpreters", payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }, as: PlatformAdmin, captures: { i1: $.data.id } }
            - { call: "POST /interpreters/${i1}/certifications", payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }, as: PlatformAdmin, captures: { c1: $.data.id } }
            - { call: "POST /interpreters/${i1}/certifications/${c1}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/availability-windows", payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", modalities: ["ASL_ONSITE"] }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }, as: OrgRequester, as_user_id: "${org1}", captures: { req1: $.data.id } }
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any, captures: { req1_v: $.data.version } }
            - { call: "POST /requests/${req1}/offers", payload: { interpreter_id: "${i1}", expected_request_version: "${req1_v}" }, as: PlatformAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/accept", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/confirm", payload: {}, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T14:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/depart", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/check-in", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T16:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/check-out", payload: { travel_minutes_claimed: 90, mileage_claimed: 12 }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-20T14:00:00Z", scheduled_end: "2026-06-20T15:00:00Z", onsite_address: "1 Main St", estimated_mileage: 5 }, as: OrgRequester, as_user_id: "${org1}", captures: { req2: $.data.id } }
