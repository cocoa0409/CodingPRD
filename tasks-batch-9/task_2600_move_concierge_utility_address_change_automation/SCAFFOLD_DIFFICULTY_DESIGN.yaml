# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2600 — Move Concierge & Utility/Address Change Automation
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1–§1.7. Deleting this file leaves the
# declared behavior identical; it only makes coverage auditing harder.
# Logical clock default at server start is 2026-08-01T00:00:00Z; every chain re-pins it explicitly.
# All money is integer cents; all Decimal rounding is ROUND_HALF_UP.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: readiness_pre_vs_post_verification_divergence
        grounds:
          - calculations.move_readiness_score
          - entities.MoveRecord.fields.readiness_score
          - endpoints[GET /moves/{id}/readiness]
          - state_machines.MoveRecord.IDENTITY_PENDING_to_VERIFIED
        distinguishing_aspect: |
          This dual-variant pair lives in the MoveRecord readiness domain: the pre_verification variant
          drops the identity term and renormalizes the remaining three weights by PRE_VERIFICATION_DIVISOR
          0.70 while post_verification applies all four weights, so one identical snapshot of children
          (identity 100, utility 100, filing 0, consent 50) yields 57 for pre and 70 for post.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "One ACTIVE feed source (referral_revenue_share_pct 0.1750, dedupe_window_days 30, TIER_B)."
            - "Resident Dana Ruiz, origin address in 30301, destination address in 30302."
            - "One ELECTRIC provider with a default-carrier territory covering 30302 from 2026-01-01."
            - "Move for 2026-08-20 with only a UTILITY_SETUP consent granted (so consent_component is 50, not 100)."
            - "Identity verified by a KBA result of 720 at 2026-08-01, so verified_at is 2026-08-01T00:00:00Z."
            - "Provider mapping created exactly one ELECTRIC START order and the order is SCHEDULED (utility_component 100)."
            - "No AddressChangeFiling exists at all (filing_component 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /utility-providers"
              payload: { name: "Georgia Metro Electric", utility_type: "ELECTRIC", required_account_fields: ["account_holder_name", "service_start_date"], deposit_policy: "CREDIT_SCORE_BASED", credit_check_required: true, scheduling_lead_days: 3 }
              as: PlatformAdmin
              captures: { prov_e_id: $.data.id }
            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_e_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-01-01", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
              captures: { terr_e_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20", external_reference: "PM-9001" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "PM_FEED", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
              as: MoveOpsAgent
              captures: { cs_util_id: $.data.id }
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "KBA" }
              as: MoveOpsAgent
              captures: { idv_id: $.data.id }
            - call: "POST /identity-verifications/${idv_id}/kba-result"
              payload: { outcome: "PASSED", score: 720 }
              as: ExternalServiceGateway
            - call: "POST /moves/${mv_id}/provider-mapping"
              payload: { utility_types: ["ELECTRIC"] }
              as: MoveOpsAgent
            - call: "GET /utility-orders"
              payload: { move_id: "${mv_id}", utility_type: "ELECTRIC" }
              as: MoveOpsAgent
              captures: { uo_e_id: "$.data[0].id" }
            - call: "POST /utility-orders/${uo_e_id}/schedule"
              payload: { requested_service_date: "2026-08-20", scheduled_window_start: "2026-08-20T13:00:00Z", scheduled_window_end: "2026-08-20T17:00:00Z", account_data: { account_holder_name: "Dana Ruiz", service_start_date: "2026-08-20" } }
              as: MoveOpsAgent
          trigger:
            - call: "GET /moves/${mv_id}/readiness"
              payload: { variant: "post_verification" }
              as: MoveOpsAgent
            - call: "GET /moves/${mv_id}/readiness"
              payload: { variant: "pre_verification" }
              as: MoveOpsAgent
          assert:
            - "GET /moves/${mv_id}/readiness?variant=post_verification returns data.identity_component == 100"
            - "GET /moves/${mv_id}/readiness?variant=post_verification returns data.utility_component == 100"
            - "GET /moves/${mv_id}/readiness?variant=post_verification returns data.filing_component == 0"
            - "GET /moves/${mv_id}/readiness?variant=post_verification returns data.consent_component == 50"
            - "GET /moves/${mv_id}/readiness?variant=post_verification returns data.readiness_score == 70"
            - "GET /moves/${mv_id}/readiness?variant=pre_verification returns data.readiness_score == 57"
            - "GET /moves/${mv_id}/readiness?variant=pre_verification returns data.utility_component == 100 and data.consent_component == 50 (identical children, different weighting)"
            - "MoveRecord.${mv_id}.readiness_score == 70 (stored AUTO value follows the post_verification variant because lifecycle_status is SCHEDULING)"
            - "MoveRecord.${mv_id}.lifecycle_status == SCHEDULING"

      - name: deposit_estimate_vs_bureau_final_divergence
        grounds:
          - calculations.credit_deposit_amount_cents
          - entities.UtilityOrder.fields.deposit_estimate_cents
          - entities.UtilityOrder.fields.deposit_amount_cents
          - state_machines.CreditCheckHandoff.SUBMITTED_to_RESPONDED
        distinguishing_aspect: |
          This dual-variant pair lives in the UtilityOrder deposit-money domain (a different entity domain
          from the MoveRecord readiness pair): estimate_at_mapping assumes the worst score band
          (ESTIMATE_SCORE_MULTIPLIER 1.50, neutral readiness multiplier) and writes 22500 to
          deposit_estimate_cents, while final_at_bureau_response uses the real 639 band and the frozen
          readiness_snapshot 40 to write 18000 to deposit_amount_cents.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Feed source, resident, origin/destination addresses and one CREDIT_SCORE_BASED ELECTRIC provider (DEPOSIT_BASE_CENTS applies, credit_check_required true)."
            - "Move for 2026-08-20 with only UTILITY_SETUP consent; identity verified with KBA 720."
            - "Provider mapping created exactly one ELECTRIC order in provision_status DRAFT and credit_status PENDING_CHECK, with deposit_estimate_cents already written by the estimate variant."
            - "A credit-check handoff was dispatched while the order was still DRAFT, so readiness_snapshot froze at 40 (identity 100, utility 0, filing 0, consent 50)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /utility-providers"
              payload: { name: "Georgia Metro Electric", utility_type: "ELECTRIC", required_account_fields: ["account_holder_name", "service_start_date"], deposit_policy: "CREDIT_SCORE_BASED", credit_check_required: true, scheduling_lead_days: 3 }
              as: PlatformAdmin
              captures: { prov_e_id: $.data.id }
            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_e_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-01-01", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
              captures: { terr_e_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "PM_FEED", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
              as: MoveOpsAgent
              captures: { cs_util_id: $.data.id }
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "KBA" }
              as: MoveOpsAgent
              captures: { idv_id: $.data.id }
            - call: "POST /identity-verifications/${idv_id}/kba-result"
              payload: { outcome: "PASSED", score: 720 }
              as: ExternalServiceGateway
            - call: "POST /moves/${mv_id}/provider-mapping"
              payload: { utility_types: ["ELECTRIC"] }
              as: MoveOpsAgent
            - call: "GET /utility-orders"
              payload: { move_id: "${mv_id}", utility_type: "ELECTRIC" }
              as: MoveOpsAgent
              captures: { uo_e_id: "$.data[0].id", est_at_mapping: "$.data[0].deposit_estimate_cents" }
            - call: "POST /utility-orders/${uo_e_id}/credit-checks"
              payload: { bureau: "EXPERIAN" }
              as: MoveOpsAgent
              captures: { cch_id: $.data.id }
          trigger:
            - call: "POST /credit-check-handoffs/${cch_id}/bureau-response"
              payload: { score: 639 }
              as: ExternalServiceGateway
          assert:
            - "UtilityOrder.${uo_e_id}.deposit_estimate_cents == 22500 (estimate_at_mapping variant: 15000 * 1.50 * 1.00)"
            - "UtilityOrder.${uo_e_id}.readiness_snapshot == 40"
            - "UtilityOrder.${uo_e_id}.deposit_amount_cents == 18000 (final_at_bureau_response variant: 15000 * 1.00 * 1.20)"
            - "UtilityOrder.${uo_e_id}.deposit_amount_cents != UtilityOrder.${uo_e_id}.deposit_estimate_cents"
            - "UtilityOrder.${uo_e_id}.credit_status == DEPOSIT_DUE"
            - "UtilityOrder.${uo_e_id}.provision_status == DRAFT (the credit dimension moved alone)"
            - "CreditCheckHandoff.${cch_id}.result == DEPOSIT_REQUIRED"
            - "CreditCheckHandoff.${cch_id}.score == 639 and handoff_status == RESPONDED"
            - "CreditCheckHandoff.${cch_id}.responded_at == 2026-08-01T00:00:00Z"

      - name: referral_share_provisional_vs_settled_divergence
        grounds:
          - calculations.referral_attributed_share_cents
          - state_machines.ReferralPlacement.ACCEPTED_to_CONVERTED
          - state_machines.ReferralPlacement.CONVERTED_to_SETTLED
          - entities.RevenueShareLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          This dual-variant pair lives in the ReferralPlacement revenue-share domain (a third, distinct
          entity domain): provisional_at_conversion withholds PROVISIONAL_HOLDBACK_PCT so commission is
          27000 and feed share 4725, while settled_at_settlement drops the holdback on the identical
          100000 gross to give 30000 and 5250, forcing an ADJUSTMENT of +3000 and a
          FEED_SOURCE_SHARE_ADJUSTMENT of -525 on the same placement.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Feed source with referral_revenue_share_pct 0.1750."
            - "Resident with a granted PARTNER_MARKETING consent and marketing_opt_out false."
            - "Move verified by KBA 720, lifecycle VERIFIED (no provider mapping needed for placements)."
            - "INTERNET partner on REV_SHARE_PCT 0.3000, attribution_window_days 30, attribution_basis PLACEMENT_ACCEPTANCE, monthly_placement_cap 5."
            - "Placement created, accepted by the partner, then converted with gross_revenue_cents 100000 at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /referral-partners"
              payload: { name: "BeamNet Fiber", vertical: "INTERNET", payout_model: "REV_SHARE_PCT", rev_share_pct: 0.3000, attribution_window_days: 30, attribution_basis: "PLACEMENT_ACCEPTANCE", monthly_placement_cap: 5 }
              as: PlatformAdmin
              captures: { pt_int_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "PARTNER_MARKETING", source_channel: "WEB_PORTAL", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
              as: MoveOpsAgent
              captures: { cs_mkt_id: $.data.id }
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "KBA" }
              as: MoveOpsAgent
              captures: { idv_id: $.data.id }
            - call: "POST /identity-verifications/${idv_id}/kba-result"
              payload: { outcome: "PASSED", score: 720 }
              as: ExternalServiceGateway
            - call: "GET /moves/${mv_id}"
              payload: {}
              as: MoveOpsAgent
              captures: { mv_v1: $.data.version }
            - call: "POST /moves/${mv_id}/referral-placements"
              payload: { partner_id: "${pt_int_id}", expected_move_version: "${mv_v1}" }
              as: MoveOpsAgent
              captures: { pl_id: $.data.id }
            - call: "POST /referral-placements/${pl_id}/acceptance"
              payload: {}
              as: PartnerAgent
              as_user_id: "${pt_int_id}"
            - call: "POST /referral-placements/${pl_id}/conversions"
              payload: { gross_revenue_cents: 100000 }
              as: PartnerAgent
              as_user_id: "${pt_int_id}"
              captures: { prov_share: $.data.attributed_share_cents, prov_feed_share: $.data.feed_source_share_cents }
          trigger:
            - call: "POST /referral-placements/${pl_id}/settlement"
              payload: { settled_gross_revenue_cents: 100000 }
              as: PlatformAdmin
          assert:
            - "the conversion response had attributed_share_cents == 27000 and feed_source_share_cents == 4725 (provisional_at_conversion)"
            - "ReferralPlacement.${pl_id}.placement_status == SETTLED"
            - "ReferralPlacement.${pl_id}.attributed_share_cents == 30000 (settled_at_settlement overwrote the provisional 27000)"
            - "ReferralPlacement.${pl_id}.feed_source_share_cents == 5250"
            - "GET /revenue-share-ledger-entries?placement_id=${pl_id} returns total_count == 4"
            - "the ACCRUAL entry for ${pl_id} has amount_cents == 27000"
            - "the FEED_SOURCE_SHARE entry for ${pl_id} has amount_cents == -4725"
            - "the ADJUSTMENT entry for ${pl_id} has amount_cents == 3000"
            - "the FEED_SOURCE_SHARE_ADJUSTMENT entry for ${pl_id} has amount_cents == -525"
            - "sum of amount_cents over all ledger entries with placement_id == ${pl_id} equals 24750"
            - "FeedSource.${fs_id}.accrued_share_cents == 5250"

      - name: duplicate_open_vs_cancelled_pool_divergence
        grounds:
          - calculations.duplicate_match_score
          - entities.MoveRecord.fields.duplicate_candidate_move_id
          - entities.MoveRecord.fields.reactivation_candidate_move_id
          - state_machines.MoveRecord.CREATION_to_INTAKE
        distinguishing_aspect: |
          This dual-variant pair lives in the MoveRecord duplicate-detection domain: the identical
          0.80 score routes to duplicate_flag SUSPECTED plus blocked_reason DUPLICATE_SUSPECTED under
          open_candidate_pass, but under cancelled_candidate_pass it only writes
          reactivation_candidate_move_id and leaves duplicate_flag NONE with the move unblocked.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Feed source with dedupe_window_days 30 and trust_tier TIER_B."
            - "One resident Dana Ruiz and two distinct destination addresses in the same 30302 / GA (address_hash differs, postal and state match, so address_component is PARTIAL_ADDRESS_SCORE 0.50)."
            - "Earlier move A1 to destination D1 with move_date 2026-08-20 was CANCELLED, so the OPEN candidate pool is empty and only the CANCELLED pool has a row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_d1_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "915 Juniper St", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_d2_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_d1_id}", move_date: "2026-08-20", external_reference: "PM-A1" }
              as: MoveOpsAgent
              captures: { mv_a1_id: $.data.id }
            - call: "POST /moves/${mv_a1_id}/cancellation"
              payload: { cancellation_reason: "Resident postponed the move" }
              as: MoveOpsAgent
          trigger:
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_d2_id}", move_date: "2026-09-04", external_reference: "PM-B1" }
              as: MoveOpsAgent
              captures: { mv_b1_id: $.data.id }
          assert:
            - "MoveRecord.${mv_a1_id}.lifecycle_status == CANCELLED"
            - "MoveRecord.${mv_b1_id}.duplicate_match_score == 0.80 (name 1.00*0.35 + email 1.00*0.25 + address 0.50*0.25 + recency 0.50*0.15)"
            - "MoveRecord.${mv_b1_id}.duplicate_flag == NONE (cancelled_candidate_pass never flags)"
            - "MoveRecord.${mv_b1_id}.reactivation_candidate_move_id == ${mv_a1_id}"
            - "MoveRecord.${mv_b1_id}.duplicate_candidate_move_id == null (the OPEN pool was empty)"
            - "MoveRecord.${mv_b1_id}.blocked_reason == NONE"
            - "MoveRecord.${mv_b1_id}.lifecycle_status == INTAKE and it accepts POST /moves/{id}/identity-verifications without a duplicate resolution first"

  - rule_id: combinatorial_formula
    instances:
      - name: readiness_weight_renormalization_with_clamp
        grounds:
          - calculations.move_readiness_score
          - entities.MoveRecord.fields.verified_at
          - state_machines.AddressChangeFiling.DRAFT_to_SUBMITTED
          - state_machines.UtilityOrder.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Mode (a) non-linear composition of four inputs: identity_component collapses to 0 by a validity
          branch (a PASSED verification whose clock > verified_at + IDENTITY_VALIDITY_DAYS), utility_component
          is a ratio rounded to 0dp before weighting (1 of 2 orders done -> 50), filing_component is a
          three-way branch (SUBMITTED -> 60) and consent_component a scope-count branch (both scopes -> 100),
          so post = 47 while the renormalized pre = 67 — the unverified variant scores HIGHER than the
          verified one, which no linear reading of the weights predicts.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-09-01T00:00:00Z at the end of setup."
            - "Resident holds GRANTED consents for BOTH UTILITY_SETUP and USPS_FILING (consent_component 100)."
            - "Two providers (ELECTRIC and GAS) both cover 30302, so provider mapping creates two orders."
            - "Exactly one of the two orders (the ELECTRIC one) is SCHEDULED; the GAS order stays DRAFT (utility_component 50)."
            - "One AddressChangeFiling is SUBMITTED and not yet answered by USPS (filing_component 60)."
            - "Identity passed at 2026-08-01 so verified_at + IDENTITY_VALIDITY_DAYS is 2026-08-31, which the advanced clock has passed (identity_component 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
