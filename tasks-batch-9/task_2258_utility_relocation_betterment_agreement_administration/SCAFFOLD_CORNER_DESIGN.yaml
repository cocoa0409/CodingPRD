      - name: corner_prior_rights_share_diverges_between_record_and_field_basis
        claim_type: Variant Divergence
        grounds: ["calculations.prior_rights_state_share"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / prior_rights_record_basis_versus_field_basis_share"
          rationale: "That instance already runs the same claimed_basis and facility through both evidence variants and pins the divergence (RECORD_BASIS 100 versus FIELD_BASIS 55) together with the 45-point FIELD_CONTRADICTION adjustment and the 0..100 clamp, so a separate corner instance would repeat it."

      - name: corner_eligible_cost_variant_is_selected_by_the_agreement_basis
        claim_type: Variant Selection
        grounds: ["calculations.agreement_eligible_cost"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / agreement_eligible_cost_estimate_versus_actual_basis"
          rationale: "That instance covers variant selection directly: the estimate variant governs from creation through execution, the actual variant is selected only by final settlement, and it pins the chronological whole-document exclusion that distinguishes the two."

      - name: corner_settlement_chain_produces_the_expected_nine_figures
        claim_type: Correct Result
        grounds: ["calculations.agreement_state_share_settlement"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / settlement_nine_step_chain_pinned_at_every_intermediate"
          rationale: "That instance already asserts every one of the nine intermediates on a single agreement, including the step 2 rounding of the indirect load and the step 9 residual, which is exactly the Correct Result claim for this calculation."

      - name: corner_betterment_credit_rounds_per_line_not_in_aggregate
        claim_type: Precision
        grounds: ["calculations.betterment_credit"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / betterment_credit_per_line_rounding_beats_aggregate_rounding"
          rationale: "That instance pins the six-decimal ratio and the one-cent divergence between per-line and aggregate rounding across three cost lines including a salvage credit, which is the precision claim for this calculation."

      - name: corner_participation_tier_boundaries_are_exercised
        claim_type: Tiered Pricing
        grounds: ["calculations.agreement_state_share_settlement"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / participation_tier_boundary_at_five_million_net_allowable"
          rationale: "That instance walks the net allowable across TIER_1_CEILING_CENTS at 4,999,999 / 5,000,000 / 5,000,001 and shows the tier is a single rate on the whole net allowable rather than a marginal rate, covering the tiered-pricing boundary claims."

      - name: corner_depth_tolerance_threshold_is_exercised_at_the_boundary
        claim_type: Threshold
        grounds: ["calculations.prior_rights_state_share"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / depth_tolerance_boundary_flips_evidence_variant_at_seven_inches"
          rationale: "That instance measures deviations of 5, 6 and 7 inches against DEPTH_TOLERANCE_IN and shows the strict greater-than comparison is what flips the evidence variant, covering the threshold boundary claims for this calculation."

