  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: exemption_sustained_quash_cascade_depth_four
        grounds:
          - state_machines.ExemptionClaim.OPPOSED_to_SUSTAINED
          - state_machines.EnforcementAction.SERVED_to_QUASHED
          - state_machines.AssetFinding.VERIFIED_to_EXHAUSTED
          - state_machines.Judgment.enforcement_posture.ENFORCING_to_LIEN_PERFECTED
          - calculations.bank_levy_hold
        distinguishing_aspect: |
          Trigger 1 of 3 — ruling an exemption claim SUSTAINED. Four causally chained hops, each caused by the
          previous one and not by the original call: claim -> SUSTAINED causes the action -> QUASHED, the quash
          causes the AssetFinding to release 725000 frozen cents and (because claim_type is HEAD_OF_HOUSEHOLD)
          to move VERIFIED -> EXHAUSTED, and that last change drops active_enforcement_count to 0 which moves
          Judgment.enforcement_posture ENFORCING -> LIEN_PERFECTED.
        test_recipe:
          setup:
            - "A CA judgment (5000000 cents principal, 1000 bps, 45000 cents filing costs, entered 2026-01-01) with a zero-fee CA county filing RECORDED."
            - "A VERIFIED BANK_ACCOUNT finding of 900000 cents; a BANK_LEVY served 2026-08-01 holding 725000 cents (available 175000, frozen 725000) and charging a 12500-cent sheriff fee."
            - "A HEAD_OF_HOUSEHOLD exemption claim filed by the debtor on 2026-08-01 and OPPOSED by officer eo-2."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA", head_of_household: true, weekly_disposable_earnings_cents: 100000 }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0401", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /county-filings"
              payload: { judgment_id: "${jud_id}", county_code: "CA-LOS-ANGELES", state_code: "CA", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "BANK_ACCOUNT", institution_name: "First Pacific Bank", identifier_last4: "8811", estimated_value_cents: 900000, source: "PUBLIC_RECORD" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af_id: $.data.id }
            - call: "POST /asset-findings/${af_id}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { jv1: $.data.version }
            - call: "POST /enforcement-actions"
              payload: { judgment_id: "${jud_id}", asset_finding_id: "${af_id}", action_type: "BANK_LEVY", expected_judgment_version: "${jv1}" }
              as: CaseManager
              captures: { ea_id: $.data.id }
            - call: "POST /enforcement-actions/${ea_id}/request-writ"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-1"
            - call: "POST /enforcement-actions/${ea_id}/serve"
              payload: { served_on: "2026-08-01" }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { hold: $.data.levy_hold_cents }
            - call: "POST /exemption-claims"
              payload: { enforcement_action_id: "${ea_id}", claim_type: "HEAD_OF_HOUSEHOLD", claimed_amount_cents: 725000 }
              as: Debtor
              as_user_id: "${dbt_id}"
              captures: { ec_id: $.data.id, file_deadline: $.data.filing_deadline_on, opp_deadline: $.data.opposition_deadline_on }
            - call: "POST /exemption-claims/${ec_id}/oppose"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-2"
          trigger:
            - call: "POST /exemption-claims/${ec_id}/rule"
              payload: { outcome: "SUSTAINED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ec_status: $.data.status }
          assert:
            - "${hold} == 725000"
            - "${file_deadline} == 2026-08-16"
            - "${opp_deadline} == 2026-08-11"
            - "${ec_status} == SUSTAINED"
            - "EnforcementAction.${ea_id}.status == QUASHED"
            - "EnforcementAction.${ea_id}.levy_hold_cents == 0"
            - "AssetFinding.${af_id}.frozen_cents == 0"
            - "AssetFinding.${af_id}.available_cents == 900000"
            - "AssetFinding.${af_id}.status == EXHAUSTED"
            - "Judgment.${jud_id}.active_enforcement_count == 0"
            - "Judgment.${jud_id}.enforcement_posture == LIEN_PERFECTED"
            - "Judgment.${jud_id}.status == ACTIVE"
            - "Judgment.${jud_id}.costs_balance_cents == 57500"

