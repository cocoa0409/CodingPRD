          auth (20) versus state (70): stop-work is exclusive to EnforcementOfficer and requires
          field_status ACTIVE_DISTURBANCE. A ConstructionInspector calls it on a site still in
          PRE_CONSTRUCTION, so the role failure must mask the state failure entirely — the
          response must not leak the site's field_status through a state error.
