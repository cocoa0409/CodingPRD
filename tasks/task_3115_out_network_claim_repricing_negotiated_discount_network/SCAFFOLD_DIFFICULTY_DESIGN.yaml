          setup:
            - "Claim L: nsa_flag true, PRICED (allowed 33000 fixture, patient 0)."
            - "OpenNegotiation ON1 initiated by PAYER at 2026-09-10T10:00:00Z; expires_at 2026-10-22T10:00:00Z (30 business days). Clock still at 2026-09-15."
