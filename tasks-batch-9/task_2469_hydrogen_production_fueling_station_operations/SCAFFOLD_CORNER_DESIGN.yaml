            - call: "GET /deliveries"
              payload: { production_lot_id: "${lot_id}" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { by_lot: "$.total_count" }
            - call: "GET /deliveries"
              payload: { receiving_vessel_id: "${v_low}", status: "SCHEDULED" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { by_vessel: "$.total_count" }
          assert:
            - "${err_station} == ERR_STATION_NOT_FOUND, ${err_lot} == ERR_PRODUCTION_LOT_NOT_FOUND, ${err_vessel} == ERR_PRESSURE_VESSEL_NOT_FOUND - all HTTP 404, one per missing leg"
            - "the fourth call is HTTP 201 with ${st_ref} == ${st_id}, ${lot_ref} == ${lot_id}, ${v_ref} == ${v_low}, status SCHEDULED, reschedule_count 0"
            - "${by_lot} == 1 and ${by_vessel} == 1 - the link is reachable from both reverse directions"
            - "Station.${st_id}.inbound_planned_kg == 100.000 and projected_available_kg == 180.000 (80.000 deliverable + 100.000 inbound), so supply_alert is false"
            - "the three rejected calls created no Delivery rows and left Station.version unchanged"

      - name: agreement_read_after_create_and_version_only_moves_via_actions
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/funding-agreements
          - endpoints.GET_/funding-agreements/{id}
          - endpoints.GET_/funding-agreements
        distinguishing_aspect: |
          The surface is create/read/list plus action endpoints - there is no update or delete verb -
          so a stored row must read back byte-identical and its version may only move when an ACTION
          endpoint declares it: drafting an uptime report bumps FundingAgreement.version from 1 to 2
          while plain reads leave it at 2.
        test_recipe:
          setup:
            - "One funding agreement and one station under it, with a vessel so the station exists in a readable state."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E6", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "STATION_LEVEL" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id", fa_v1: "$.data.version" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E6", name: "Crud Station", nozzle_count: 2, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "GET /funding-agreements/${fa_id}"
              payload: {}
              as: ProgramAuditor
              as_user_id: "PA-1"
              captures: { read_v: "$.data.version", hold: "$.data.holdback_balance_cents", method: "$.data.uptime_method" }
            - call: "GET /funding-agreements"
              payload: { limit: 10, offset: 0 }
              as: ProgramAuditor
              as_user_id: "PA-1"
              captures: { total: "$.total_count", more: "$.has_more" }
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", funding_agreement_id: "${fa_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_funding_agreement_version: "${fa_v1}" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { rep_id: "$.data.id", up: "$.data.uptime_pct" }
            - call: "GET /funding-agreements/${fa_id}"
              payload: {}
              as: ProgramAuditor
              as_user_id: "PA-1"
              captures: { read_v2: "$.data.version" }
          assert:
            - "${fa_v1} == 1 and ${read_v} == 1 - a read never bumps the version"
            - "${hold} == 500000 (holdback_balance_cents seeded from initial_holdback_cents) and ${method} == STATION_LEVEL"
            - "${total} == 1 and ${more} == false"
            - "${up} == 100.000 with shortfall_points 0.000 and penalty_cents 0 while the report is DRAFT (no cleared safety events exist)"
            - "${read_v2} == 2 - only the action endpoint moved the version, and by exactly 1"

      - name: claim_lot_set_is_validated_all_or_nothing
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/incentive-claims
          - validations.priority_190
          - validations.priority_200
        distinguishing_aspect: |
          production_lot_ids is a set input with NO partial-success semantics: one uncertified lot in
          a two-lot set rejects the whole claim at priority 190, and once that is fixed the same set
          is rejected at priority 200 because no ACCEPTED delivery exists in the period. In neither
          case may a partially populated claim row survive.
        test_recipe:
          setup:
            - "Station STN-E7; two lots LOT-E7-A and LOT-E7-B on one PEM asset (no purity tests yet, so qa_status stays PENDING); only LOT-E7-A is CI-certified initially."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E7", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E7", name: "Claim Station", nozzle_count: 2, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /production-assets"
              payload: { asset_code: "PA-E7", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-E7", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 50.000, hourly_matched_renewable_pct: 50.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-E7-A", mass_kg: 300.000, energy_consumed_kwh: 15600.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_a: "$.data.id" }
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-E7-B", mass_kg: 300.000, energy_consumed_kwh: 15600.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-22T00:00:00Z", production_end_at: "2026-07-23T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_b: "$.data.id" }
            - call: "POST /production-lots/${lot_a}/certify-ci"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
          trigger:
            - call: "POST /incentive-claims"
              payload: { station_id: "${st_id}", program: "LCFS", period_start: "2026-08-01", period_end: "2026-08-31", production_lot_ids: ["${lot_a}", "${lot_b}"] }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { err_ci: "$.data.error_id" }
            - call: "POST /production-lots/${lot_b}/certify-ci"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
            - call: "POST /incentive-claims"
              payload: { station_id: "${st_id}", program: "LCFS", period_start: "2026-08-01", period_end: "2026-08-31", production_lot_ids: ["${lot_a}", "${lot_b}"] }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { err_del: "$.data.error_id" }
            - call: "GET /stations/${st_id}/incentive-claims"
              payload: {}
              as: ProgramAuditor
              as_user_id: "PA-1"
              captures: { total: "$.total_count" }
          assert:
            - "first call: HTTP 422 and ${err_ci} == ERR_LOT_CI_NOT_CERTIFIED, decided on the WHOLE set even though ${lot_a} is certified"
            - "second call: HTTP 422 and ${err_del} == ERR_LOT_NOT_DELIVERED_IN_PERIOD (priority 200 only becomes reachable once priority 190 is satisfied)"
            - "${total} == 0 - no IncentiveClaim row, not even a partial one, was created by either call"
            - "both lots remain status PRODUCED with ci_status CERTIFIED and qa_status PENDING"
