  - rule_id: transitive_cascade
    instances:

      - name: structural_underdesign_determination_cascades_design_recall_to_order_hold_to_load_detach_to_load_cancel
        grounds:
          - state_machines.FieldFailure.ANALYSIS_IN_PROGRESS_to_DETERMINED
          - state_machines.BinDesign.UNDER_REVIEW_to_RECALLED
          - state_machines.DealerOrder.production_status_QUEUED_to_HOLD_ENGINEERING
          - state_machines.FreightLoad.PLANNED_to_CANCELLED
          - calculations.failure_root_cause_determination
          - calculations.freight_load_allocation
        distinguishing_aspect: |
          Depth 4, triggered by POST /field-failures/{id}/determine. Hop 1: the DETERMINED failure
          with determined_cause STRUCTURAL_UNDERDESIGN drives BinDesign UNDER_REVIEW -> RECALLED.
          Hop 2 is caused by the design entering RECALLED, not by the determine request: the QUEUED
          DealerOrder on that design moves to HOLD_ENGINEERING. Hop 3 is caused by the order leaving
          the shippable set: it detaches from its PLANNED FreightLoad and the allocation is re-run.
          Hop 4 is caused by the detach alone: the load's order_count reaches 0 and it self-cancels.
          Remove any hop and the next one cannot fire - this is a chain, not a fan-out from one
          transition.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false, permit 0 days), GrainProfile CORN, CoatingSpec G115 (corrosion_class C3, loss limit 40.0 pct), engineer PE-1001, Dealer Alpha (credit limit 900000000, 2 staging slots)."
            - "BinDesign D1 (12.0 m x 9.6 m, ASD) carried to UNDER_REVIEW by one PASS ASD analysis plus submit-review; governing_demand_kpa 28.518, governing_load_case GRAIN_LATERAL."
            - "DealerOrder O_BASE on D1 (NONE / GRAVITY) confirmed to production_status QUEUED; credit_hold_cents 1999734."
            - "FreightLoad FL (FLATBED, WEIGHT basis, yard window 2026-09-10 to 2026-09-12) with O_BASE attached: order_count 1, assigned_weight_kg 6410.4, assigned_cube_m3 18.45, linehaul_cost_cents 164231, and DealerOrder.allocated_freight_cents 164231."
            - "FieldFailure FF opened on O_BASE with failure_mode SIDEWALL_BUCKLE, observed_load_kpa 20.0 (strictly below 28.518), measured_coating_loss_pct 10.0 (below the 40.0 C3 limit) and service_years 3.0, then advanced to ANALYSIS_IN_PROGRESS."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
