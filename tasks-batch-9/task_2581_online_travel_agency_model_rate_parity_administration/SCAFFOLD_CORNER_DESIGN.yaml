          - entities.Booking.fields.fulfillment_status
          - entities.Booking.fields.collection_model
        distinguishing_aspect: "A freshly created booking sits at the declared initial_state AUTHORIZED + RESERVED with refunded_cents 0, collection_model AGENCY copied from the governing agreement, and the money split frozen at 24240 / 3600 / 20400 / 240."
        test_recipe:
