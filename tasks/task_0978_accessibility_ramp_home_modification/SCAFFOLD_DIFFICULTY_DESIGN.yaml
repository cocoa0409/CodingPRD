            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "STATE_GRANT", program_name: "Perm-Only Grant", requested_cents: 10000, priority_rank: 1, restrictions: ["NO_RENTAL"] }
              as: FundingCoordinator
