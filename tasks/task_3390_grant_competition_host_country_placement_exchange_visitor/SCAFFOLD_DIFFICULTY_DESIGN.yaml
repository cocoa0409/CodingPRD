  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: submit_requires_cycle_open
        grounds:
          - state_machines.Application.DRAFT_to_NATIONAL_SCREENING
          - validations[priority=10 business_referential ERR_CYCLE_NOT_OPEN]
        distinguishing_aspect: "Application -> CompetitionCycle dependency: a DRAFT application's SUBMIT is gated on its cycle's status; once the cycle leaves OPEN (here: CLOSED), the same SUBMIT that was legal minutes earlier fails with ERR_CYCLE_NOT_OPEN."
        test_recipe:
          setup:
            - "DE program; independent applicant with a DRAFT application created while the cycle is OPEN; the cycle is then CLOSED before submission. The deadline (2026-10-15) has NOT passed, so the temporal check is satisfied and only the referential gate fails."
          setup_api_calls:
            - *d_cycle
            - *d_prog_de_q1
            - *d_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "Sara Lindh", email: "sara.lindh@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "SE" }
              as: Anonymous
              captures: { apl: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Lichen Chronometers", project_summary: "Dating stone surfaces", proposed_duration_months: 10, dependents_count: 0 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - *d_close
          trigger:
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "error_id == ERR_CYCLE_NOT_OPEN because CompetitionCycle.${cyc}.status == CLOSED gates the Application's DRAFT -> NATIONAL_SCREENING transition"
            - "Application.${app}.status remains DRAFT"
            - "the deadline check (clock 2026-09-01 <= 2026-10-15) passes — the failure is purely the cross-entity cycle-state gate"

      - name: visa_issue_requires_grant_confirmed
        grounds:
          - state_machines.VisaSponsorship
          - validations[priority=10 business_referential ERR_GRANT_NOT_CONFIRMED]
        distinguishing_aspect: "VisaSponsorship -> Grant dependency (a different entity pair): visa issuance requires the grant to be CONFIRMED; against a PROVISIONAL grant it fails with ERR_GRANT_NOT_CONFIRMED even though the grant exists and the caller is authorized."
