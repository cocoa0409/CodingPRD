              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/plans"
              payload: { tier: "PLUS", slots_per_box: 5, swaps_per_cycle: 3, monthly_fee_cents: 9900 }
              as: Member
              as_user_id: "${r1_m}"
