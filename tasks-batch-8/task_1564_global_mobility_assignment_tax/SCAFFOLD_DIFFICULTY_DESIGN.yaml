            - { call: "POST /mobility/extension-requests/${ext1}/approve", as: BusinessUnitApprover, as_user_id: "bu-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { asg_v2: "$.data.version" } }
            - { call: "POST /mobility/extension-requests", payload: { assignment_id: "${asg_id}", requested_new_end_date: "2027-08-15", expected_assignment_version: "${asg_v2}" }, as: MobilityAdmin, captures: { ext2: "$.data.id" } }
            - { call: "POST /mobility/extension-requests/${ext2}/approve", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { asg_end: "$.data.planned_end_date" } }
          assert:
            - "First approve rejected with ERR_COC_COVERAGE_GAP (valid_until 2027-08-31 < requested 2027-11-30)"
            - "ExtensionRequest.${ext1}.status == SUPERSEDED after the second create (create-with-supersede)"
            - "ExtensionRequest.${ext2}.status == APPROVED (2027-08-15 <= 2027-08-31 coverage)"
            - "Assignment.${asg_id}.planned_end_date == 2027-08-15"

      - name: activation_requires_approved_package_and_active_split
        grounds:
          - state_machines.Assignment.PENDING_MOBILITY_APPROVAL_to_ACTIVE
          - errors[ERR_PACKAGE_NOT_APPROVED]
          - errors[ERR_SPLIT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pairs Assignment x CompensationPackage and Assignment x
          PayrollSplit: approve-mobility surfaces ERR_PACKAGE_NOT_APPROVED while
          the package is only SUBMITTED, then ERR_SPLIT_NOT_ACTIVE once the
          package is APPROVED but the split is DRAFT, and activates only when
          both referential gates pass — two distinct cross-entity gates on one
          transition, unblocked in scaffold order.
        test_recipe:
          setup:
            - "Assignment PENDING_MOBILITY_APPROVAL (totalization_applies false); package SUBMITTED; split DRAFT"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
          trigger:
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9", captures: { err1: "$.data.error_id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9", captures: { err2: "$.data.error_id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9", captures: { final_status: "$.data.status" } }
          assert:
            - "First approve-mobility: ERR_PACKAGE_NOT_APPROVED (package merely SUBMITTED)"
            - "Second approve-mobility: ERR_SPLIT_NOT_ACTIVE (package APPROVED, split still DRAFT)"
            - "Third approve-mobility succeeds: Assignment.${asg_id}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_window_half_open_adjacency_allowed
        grounds:
          - entities.AllowancePolicy.fields.effective_from
          - entities.AllowancePolicy.fields.effective_to
          - errors[ERR_POLICY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on the
          host-country policy resource — a policy starting 2026-12-31 is ADJACENT
          to one ending 2026-12-31 and is accepted, while 2026-06-01..2027-06-01
          genuinely intersects and is rejected with ERR_POLICY_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Policy A for JP covers [2026-01-01, 2026-12-31)"
          setup_api_calls:
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP FY26", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2026-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_a: "$.data.id" } }
          trigger:
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP FY27", host_country_code: "JP", effective_from: "2026-12-31", effective_to: "2027-12-31", per_diem_daily_cents: 7800, housing_monthly_cap_cents: 310000, cola_pct: 16 }, as: MobilityAdmin, captures: { pol_b: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Overlap", host_country_code: "JP", effective_from: "2026-06-01", effective_to: "2027-06-01", per_diem_daily_cents: 7000, housing_monthly_cap_cents: 290000 }, as: MobilityAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "Policy B created (201 response) — adjacency at 2026-12-31 is NOT an overlap under half-open semantics"
            - "Policy C rejected with ERR_POLICY_WINDOW_OVERLAP (http 409) — [2026-06-01, 2027-06-01) intersects both existing windows"

      - name: assignment_window_closed_interval_touch_conflicts
        grounds:
          - entities.Assignment.fields.start_date
          - entities.Assignment.fields.planned_end_date
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - state_machines.Assignment.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          Interval semantics: CLOSED [start_date, planned_end_date] on the
          employee resource — a follow-on assignment starting exactly on the
          predecessor's planned_end_date CONFLICTS (both endpoints inclusive,
          travel day counts), unlike the half-open policy rule; and cancelling
          the predecessor frees the window for an identical re-booking.
        test_recipe:
          setup:
            - "Employee E; assignment A1 in DRAFT covering 2026-09-01..2027-08-31"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2028-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg1: "$.data.id" } }
          trigger:
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "SHORT_TERM", totalization_applies: true, start_date: "2027-08-31", planned_end_date: "2028-02-29" }, as: MobilityAdmin, captures: { err_touch: "$.data.error_id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "SHORT_TERM", totalization_applies: true, start_date: "2027-09-01", planned_end_date: "2028-03-31" }, as: MobilityAdmin, captures: { asg3: "$.data.id" } }
            - { call: "POST /mobility/assignments/${asg1}/cancel", as: MobilityAdmin }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg4: "$.data.id" } }
          assert:
            - "Touching create (start 2027-08-31 == A1 planned_end_date) rejected with ERR_ASSIGNMENT_OVERLAP — closed intervals share that date"
            - "Create starting 2027-09-01 succeeds (first non-overlapping day)"
            - "After cancelling A1, a new create with A1's exact window 2026-09-01..2027-08-31 succeeds (CANCELLED rows exit the overlap set)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: record_post_void_repost_conserves_assignment_ytd_gross
        grounds:
          - state_machines.ShadowPayrollRecord.POSTED_to_VOIDED
          - calculations.shadow_split_math
          - entities.Assignment.fields.ytd_gross_cents
        distinguishing_aspect: |
          Conserved quantity: Assignment.ytd_gross_cents (a wage accrual). The
          forward action (post: +900000) paired with its compensating action
          (void: -900000) followed by an identical repost returns the invariant
          to exactly 900000 — no drift in either ytd_gross_cents or
          ytd_chargeback_cents, and the first entry is VOIDED while the second
          is ACCRUED.
        test_recipe:
          setup:
            - "Activated assignment (exempt CoC); no settlement exists for 2026"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/certificates-of-coverage", payload: { assignment_id: "${asg_id}", application_ref: "COC-1" }, as: VendorCoordinator, captures: { coc_id: "$.data.id" } }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/submit", as: VendorCoordinator }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/mark-issued", payload: { valid_from: "2026-09-01", valid_until: "2027-08-31" }, as: VendorCoordinator }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 20, housing_receipts_cents: 310000 }, as: PayrollSpecialist, captures: { rec1: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec1}/post", as: PayrollSpecialist }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { ytd_gross_after_post: "$.data.ytd_gross_cents", ytd_cb_after_post: "$.data.ytd_chargeback_cents" } }
          trigger:
            - { call: "POST /mobility/shadow-payroll-records/${rec1}/void", as: PayrollSpecialist }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { ytd_gross_after_void: "$.data.ytd_gross_cents" } }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 20, housing_receipts_cents: 310000 }, as: PayrollSpecialist, captures: { rec2: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec2}/post", as: PayrollSpecialist }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { ytd_gross_final: "$.data.ytd_gross_cents", ytd_cb_final: "$.data.ytd_chargeback_cents" } }
          assert:
            - "ytd_gross_after_post == 900000 and ytd_cb_after_post == 1072500"
            - "ytd_gross_after_void == 0 (compensating action fully unwinds)"
            - "ytd_gross_final == 900000 and ytd_cb_final == 1072500 — identical to the post-action readings; forward+compensate+reapply conserves the invariant"
            - "Reposting the SAME (assignment, 2026, 9) period succeeded because the VOIDED record left the uniqueness set"

      - name: chargeback_post_void_conserves_program_posted_total
        grounds:
          - state_machines.ChargebackEntry.ACCRUED_to_POSTED
          - state_machines.ChargebackEntry.POSTED_to_VOIDED
          - entities.MobilityProgram.fields.total_posted_chargeback_cents
        distinguishing_aspect: |
          Conserved quantity: MobilityProgram.total_posted_chargeback_cents (a
          program-level financial aggregate, a different quantity from instance
          one's wage accrual). Posting the entry adds 1072500; voiding that same
          POSTED entry subtracts exactly 1072500, returning the program total to
          0 with no drift.
        test_recipe:
          setup:
            - "Activated assignment (exempt CoC); September record posted -> PERIOD_COST entry ACCRUED 1072500"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/certificates-of-coverage", payload: { assignment_id: "${asg_id}", application_ref: "COC-1" }, as: VendorCoordinator, captures: { coc_id: "$.data.id" } }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/submit", as: VendorCoordinator }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/mark-issued", payload: { valid_from: "2026-09-01", valid_until: "2027-08-31" }, as: VendorCoordinator }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 20, housing_receipts_cents: 310000 }, as: PayrollSpecialist, captures: { rec_id: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec_id}/post", as: PayrollSpecialist }
            - { call: "GET /mobility/chargeback-entries?assignment_id=${asg_id}", as: MobilityAdmin, captures: { cb_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /mobility/chargeback-entries/${cb_id}/post", as: FinanceController, as_user_id: "fc-1" }
            - { call: "GET /mobility/programs/${prog_id}", as: MobilityAdmin, captures: { prog_total_after_post: "$.data.total_posted_chargeback_cents" } }
            - { call: "POST /mobility/chargeback-entries/${cb_id}/void", as: FinanceController, as_user_id: "fc-1" }
            - { call: "GET /mobility/programs/${prog_id}", as: MobilityAdmin, captures: { prog_total_after_void: "$.data.total_posted_chargeback_cents" } }
          assert:
            - "prog_total_after_post == 1072500 (posting adds the entry's amount)"
            - "prog_total_after_void == 0 — the post/void pair conserves MobilityProgram.total_posted_chargeback_cents exactly"
            - "ChargebackEntry.${cb_id}.status == VOIDED and Assignment.${asg_id}.ytd_chargeback_cents == 0 after the void"
