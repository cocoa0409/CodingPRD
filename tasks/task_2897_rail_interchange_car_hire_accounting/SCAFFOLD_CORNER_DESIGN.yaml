        distinguishing_aspect: "Four of the five keys are single-column and global, but SettlementCycle's key is the TRIPLE (payer_road_id, payee_road_id, period_month) and is directional: (BN, CX, 2026-08) and (CX, BN, 2026-08) are two different cycles that must both be accepted, while a second (BN, CX, 2026-08) is refused."
        test_recipe:
          setup:
            - "Railroads BN and CX, car type XM, junction JCT-CHI, CX-owned car CX 100001, and a cycle (payer BN, payee CX, 2026-08) all exist. The clock is 2026-09-01T00:00:00Z."
