  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_cancel_depth4_cascade
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.AvailabilityHold.ACTIVE_to_RELEASED
          - state_machines.DealMemo.ACCEPTED_to_VOIDED
          - entities.CommissionEntry.fields.status
          - entities.Agency.fields.escrow_balance_cents
        distinguishing_aspect: |
          Cancelling a CONFIRMED booking (link 1) causes its hold->RELEASED
          (link 2), which is the booking's deal->VOIDED (link 3), which is its
          CommissionEntry HELD->REVERSED with escrow debited back to 0 (link 4):
          a 4-deep chain where each hop is caused by the prior, triggered by cancel.
        test_recipe:
          setup:
            - "Booking CONFIRMED for 5 days at 200000/day; CommissionEntry HELD=100000; escrow=100000; deal ACCEPTED; hold ACTIVE."
          setup_api_calls:
            - call: "POST /agencies"
