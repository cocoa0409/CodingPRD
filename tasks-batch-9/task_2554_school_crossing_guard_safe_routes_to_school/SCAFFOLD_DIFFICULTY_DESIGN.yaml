  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_creation_gated_on_guard_certification_state
        grounds:
          - validations.priority_50.ERR_GUARD_NOT_CERTIFIED
          - state_machines.Guard.IN_TRAINING_to_CERTIFIED
          - entities.PostAssignment.fields.guard_id
          - errors.ERR_GUARD_NOT_CERTIFIED
        distinguishing_aspect: |
          Pair PostAssignment -> Guard. The identical assignment payload is rejected and
          then accepted with no change to the GuardPost, the school or the clock — only
          the Guard's certification_status moves IN_TRAINING -> CERTIFIED between the
          two calls. Equipment is already complete and the guard is not ON_LEAVE, so
          the two neighbouring priority-50 safety rules cannot account for the
          rejection.
