            - "Owner.${owner_id}.fee_balance_cents == 0 and delinquency_status == CURRENT at the end"

  - rule_id: resource_temporal_overlap
    instances:
      - name: engineer_visit_rejected_inside_the_travel_buffer_but_allowed_exactly_at_it
        grounds:
          - calculations.engineer_visit_conflict
          - validations[priority=30]
          - errors[ERR_ENGINEER_WINDOW_CONFLICT]
          - entities.Engineer.fields.open_inspection_count
          - entities.Inspection.fields.window_start
        distinguishing_aspect: |
          Resource: an Engineer's own time. Interval semantics: each window is INFLATED by
          TRAVEL_BUFFER_MINUTES on both sides and compared with strict inequalities, so a new visit
          starting 13:59 (one minute inside the 120-minute buffer after a 12:00 finish) conflicts while
          one starting exactly at 14:00 does not. Plain window overlap would accept both.
        test_recipe:
