      - The school read returns HTTP 404 with error_id == ERR_SCHOOL_NOT_FOUND
      - The planning-area read returns HTTP 404 with error_id == ERR_AREA_NOT_FOUND
      - The housing-development read returns HTTP 404 with error_id == ERR_DEVELOPMENT_NOT_FOUND
      - Every error body has response_type == "error" and a non-empty data.message
