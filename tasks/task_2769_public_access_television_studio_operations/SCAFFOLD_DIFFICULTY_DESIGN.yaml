      - name: channel_airtime_half_open_footprint_admits_exact_adjacency
        grounds:
          - calculations.playback_window_fit
          - calculations.playback_conflict_resolution
          - validations[priority=27]
          - errors[ERR_SLOT_WINDOW_CONFLICT]
          - entities.Channel.fields.inter_program_buffer_seconds
          - entities.Channel.fields.scheduled_seconds
          - entities.PlaybackSlot.fields.occupied_seconds
        distinguishing_aspect: |
          The contended resource is Channel airtime, and the interval semantics
          are half-open [start_at, start_at + occupied_seconds) with the
          inter-program buffer folded INTO the footprint: a slot starting at
