# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2885 — Pressure Vessel & Heat Exchanger Fabrication
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every chain starts from an empty database and uses only §1.5 endpoints.
# The logical clock reads 2026-08-01T00:00:00Z until an instance moves it.
# ============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_shell_thickness_circumferential_vs_longitudinal
        grounds:
          - calculations.required_wall_thickness
          - calculations.joint_efficiency_resolution
          - entities.DesignCalculation.fields.thickness_circumferential_in
          - entities.DesignCalculation.fields.thickness_longitudinal_in
          - entities.DesignCalculation.fields.thickness_required_in
          - entities.DesignCalculation.fields.governing_variant
          - concurrency_rules[design-calc-revision-stale-job]
        distinguishing_aspect: |
          This instance forces ONE DesignCalculation row to report BOTH stress variants of the
          same geometry at once — the circumferential-stress wall t = P*R/(S*E-0.6*P) and the
          longitudinal-stress wall t = P*R/(2*S*E+0.4*P) — so the two variants must differ by
          0.2690 in on identical inputs, and thickness_required_in must be rounded ONCE from the
          unrounded governing raw value plus the corrosion allowance rather than from the already
          rounded variant field.
        test_recipe:
          setup:
            - "Two DesignEngineer Personnel rows exist: a preparer and an independent reviewer."
            - "An ACTIVE CertificateOfAuthorization CA-U-8801 exists (issued_on 2026-01-01, expires_on 2029-01-01)."
            - "A DRAFT PRESSURE_VESSEL VesselJob J-2885-01 exists with mawp_psi 350, inside_radius_in 30, design_temp_f 650, mdmt_f -20, stress_ratio 1.00, design_code DIV1, and carries no DesignCalculation sheet yet, so its version is still 1."
            - "The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Efrain Cole", role_code: "DESIGN_ENGINEER", stamp_initials: "EC" }
              as: ShopAdmin
              captures: { de2_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8801", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-01", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
          trigger:
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_shell_id: $.data.id }
          assert:
            - "HTTP 201 and DesignCalculation.${c_shell_id}.joint_efficiency == 1.00"
            - "DesignCalculation.${c_shell_id}.thickness_circumferential_in == 0.5306"
            - "DesignCalculation.${c_shell_id}.thickness_longitudinal_in == 0.2616"
            - "DesignCalculation.${c_shell_id}.thickness_circumferential_in - DesignCalculation.${c_shell_id}.thickness_longitudinal_in == 0.2690"
            - "DesignCalculation.${c_shell_id}.governing_variant == CIRCUMFERENTIAL"
            - "DesignCalculation.${c_shell_id}.thickness_required_in == 0.5931"
            - "DesignCalculation.${c_shell_id}.revision == 1 and DesignCalculation.${c_shell_id}.status == DRAFT"
            - "DesignCalculation.${c_shell_id}.prepared_by_personnel_id == ${de1_id} and reviewed_by_personnel_id == null"
            - "VesselJob.${job_id}.status == DRAFT and VesselJob.${job_id}.version == 2"
            - "VesselJob.${job_id}.governing_joint_efficiency == null because no sheet is APPROVED yet"

      - name: dual_variant_test_pressure_hydrostatic_vs_pneumatic
        grounds:
          - calculations.test_pressure
          - entities.PressureTest.fields.test_pressure_psi
          - entities.PressureTest.fields.min_hold_minutes
          - entities.PressureTest.fields.min_medium_temp_f
          - state_machines.VesselJob.FABRICATION_to_TESTING
          - state_machines.VesselJob.TESTING_to_TESTING
          - validations[priority=88]
        distinguishing_aspect: |
          A different entity domain from the thickness instance: the same HEAT_EXCHANGER job
          schedules a HYDROSTATIC shell-side test and a PNEUMATIC tube-side test, and the pneumatic
          variant must come out LOWER in pressure (385.0 vs 455.0 psi) while simultaneously being
          LONGER in hold (60 vs 30 minutes) and WARMER in medium floor (40 vs 10 F), so all three
          derived fields diverge in the same request pair and the variant is selected by test_type
          rather than by magnitude.
        test_recipe:
          setup:
            - "Personnel: two DesignEngineers, one WeldingEngineer, one QCInspector, one AuthorizedInspector."
            - "An ACTIVE certificate CA-U-8801 (2026-01-01 to 2029-01-01)."
            - "A HEAT_EXCHANGER VesselJob J-2885-02 with mawp_psi 350, mdmt_f -20, stress_ratio 1.00, inside_radius_in 30, design_code DIV1 and a non-blank pneumatic_justification, so required_test_sides = [SHELL_SIDE, TUBE_SIDE] and required_components = [SHELL, HEAD, TUBESHEET]."
            - "All three component sheets are APPROVED (rt_extent FULL, allowable_stress_psi 20000, corrosion_allowance_in 0.0625, thickness_nominal_in 1.0000), so the job reached FAB_PLANNING with governing_joint_efficiency 1.00."
            - "Heat H-4471 (SA-516-70 PLATE, MTR received) is ACCEPTED; parts SH-01 (SHELL, 1200 lb) and HD-01 (HEAD, 600 lb) are ISSUED."
            - "WPS-1 is QUALIFIED with pwht_required false and thickness range [0.1875, 3.0000]; welder qualification W12 is QUALIFIED (qualified_on 2026-06-01, 61 days of continuity at the default clock)."
            - "The single joint W-001 (category C, FILLET, 0.7500 in) is WELDED and its MT surface examination is ACCEPT, so the job sits in FABRICATION with weld_completion_pct 100.00 and nonconformance_open_count 0."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Efrain Cole", role_code: "DESIGN_ENGINEER", stamp_initials: "EC" }
              as: ShopAdmin
              captures: { de2_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Wes Iyer", role_code: "WELDING_ENGINEER", stamp_initials: "WI" }
              as: ShopAdmin
              captures: { we1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Ada Nunes", role_code: "AUTHORIZED_INSPECTOR", stamp_initials: "AN", ai_agency: "Hartford Steam Boiler" }
              as: ShopAdmin
              captures: { ai1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8801", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-02", customer_name: "Northline Energy", vessel_type: "HEAT_EXCHANGER", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00, pneumatic_justification: "Tube bundle cannot be drained or dried after a hydrostatic fill; pneumatic test of the tube side authorized." }
              as: ShopAdmin
              captures: { job_id: $.data.id, jv1: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv1}", component: "SHELL", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_shell_id: $.data.id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { jv2: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv2}", component: "HEAD", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_head_id: $.data.id }
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { jv3: $.data.version }
            - call: "POST /vessel-jobs/${job_id}/design-calculations"
              payload: { expected_job_version: "${jv3}", component: "TUBESHEET", rt_extent_declared: "FULL", allowable_stress_psi: 20000, corrosion_allowance_in: 0.0625, thickness_nominal_in: 1.0000 }
              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { c_ts_id: $.data.id }
            - call: "POST /design-calculations/${c_shell_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_shell_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
            - call: "POST /design-calculations/${c_head_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_head_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
            - call: "POST /design-calculations/${c_ts_id}/submit"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de1_id}"
            - call: "POST /design-calculations/${c_ts_id}/approve"
              payload: {}
              as: DesignEngineer
              as_user_id: "${de2_id}"
            - call: "POST /material-heats"
              payload: { heat_number: "H-4471", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 41.0, mtr_certified_tensile_ksi: 75.0, quantity_received_lb: 2000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_id: $.data.id }
            - call: "POST /material-heats/${heat_id}/mtr-review"
              payload: { decision: "ACCEPT" }
              as: QCInspector
              as_user_id: "${qc1_id}"
            - call: "POST /vessel-jobs/${job_id}/parts"
              payload: { heat_id: "${heat_id}", part_mark: "SH-01", component_type: "SHELL", issued_quantity_lb: 1200.00 }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { part_a_id: $.data.id }
            - call: "POST /vessel-jobs/${job_id}/parts"
              payload: { heat_id: "${heat_id}", part_mark: "HD-01", component_type: "HEAD", issued_quantity_lb: 600.00 }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { part_b_id: $.data.id }
            - call: "POST /wps"
              payload: { wps_number: "WPS-1", process: "SMAW", base_metal_p_number: 1, filler_f_number: 4, thickness_min_in: 0.1875, thickness_max_in: 3.0000, position: "1G", pwht_required: false, preheat_min_f: 50, supporting_pqr_number: "PQR-1" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { wps_id: $.data.id }
            - call: "POST /wps/${wps_id}/qualify"
              payload: {}
              as: WeldingEngineer
              as_user_id: "${we1_id}"
            - call: "POST /welder-qualifications"
              payload: { welder_stamp: "W12", welder_name: "Rosa Vela", wps_id: "${wps_id}", position_qualified: "1G", thickness_range_max_in: 3.0000, qualified_on: "2026-06-01" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { wq_id: $.data.id }
            - call: "POST /vessel-jobs/${job_id}/production-welds"
              payload: { weld_number: "W-001", joint_category: "C", joint_type: "FILLET", thickness_in: 0.7500, wps_id: "${wps_id}", part_a_id: "${part_a_id}", part_b_id: "${part_b_id}" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { weld1_id: $.data.id }
            - call: "POST /vessel-jobs/${job_id}/weld-map-release"
              payload: {}
              as: WeldingEngineer
              as_user_id: "${we1_id}"
            - call: "POST /production-welds/${weld1_id}/complete"
              payload: { welder_qualification_id: "${wq_id}", welded_at: "2026-07-31T14:00:00.000Z" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
            - call: "POST /vessel-jobs/${job_id}/nde-plan"
              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { ex1_id: "$.data[0].id" }
            - call: "POST /nde-exams/${ex1_id}/result"
              payload: { result: "ACCEPT", examined_coverage_pct: 100, indications_count: 0, exam_date: "2026-08-01" }
              as: QCInspector
              as_user_id: "${qc1_id}"
          trigger:
            - call: "POST /pressure-tests"
              payload: { job_id: "${job_id}", test_side: "SHELL_SIDE", test_type: "HYDROSTATIC", test_bay_code: "BAY_1", scheduled_start: "2026-08-10T08:00:00.000Z", scheduled_end: "2026-08-10T12:00:00.000Z" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { t_hydro_id: $.data.id }
            - call: "POST /pressure-tests"
              payload: { job_id: "${job_id}", test_side: "TUBE_SIDE", test_type: "PNEUMATIC", test_bay_code: "BAY_2", scheduled_start: "2026-08-11T08:00:00.000Z", scheduled_end: "2026-08-11T14:00:00.000Z" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { t_pneu_id: $.data.id }
          assert:
            - "Both creates return HTTP 201"
            - "PressureTest.${t_hydro_id}.test_pressure_psi == 455.0"
            - "PressureTest.${t_hydro_id}.min_hold_minutes == 30"
            - "PressureTest.${t_hydro_id}.min_medium_temp_f == 10"
            - "PressureTest.${t_pneu_id}.test_pressure_psi == 385.0"
            - "PressureTest.${t_pneu_id}.min_hold_minutes == 60"
            - "PressureTest.${t_pneu_id}.min_medium_temp_f == 40"
            - "PressureTest.${t_hydro_id}.test_pressure_psi - PressureTest.${t_pneu_id}.test_pressure_psi == 70.0"
            - "PressureTest.${t_pneu_id}.min_hold_minutes - PressureTest.${t_hydro_id}.min_hold_minutes == 30"
            - "Both rows carry result == PENDING and ai_witness_confirmed == false"
            - "VesselJob.${job_id}.status == TESTING after the first create and still TESTING after the second"

  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_nde_coverage_matrix_over_division_category_thickness_and_material
        grounds:
          - calculations.nde_coverage_requirement
          - entities.ProductionWeld.fields.required_volumetric_pct
          - entities.ProductionWeld.fields.volumetric_method
          - entities.ProductionWeld.fields.required_surface_method
          - entities.MaterialHeat.fields.material_class
          - entities.VesselJob.fields.design_code
          - validations[priority=64]
        distinguishing_aspect: |
          Four joints created inside ONE DIV2 job resolve four different cells of a five-input
          cross-product (design_code x joint_category x rt_extent_declared x thickness_in x
          joint_type x material_class): the DIV2 override lifts a SPOT-declared category A joint
          from 25 to 100 percent, the 2.5000 in category B butt switches the method from RT to UT,
          the category C fillet owes no volumetric at all but an MT surface exam, and the category D
          corner joint on an austenitic heat switches the surface method from MT to PT.
        test_recipe:
          setup:
            - "Personnel: two DesignEngineers, one WeldingEngineer, one QCInspector."
            - "An ACTIVE certificate CA-U-8801 (2026-01-01 to 2029-01-01)."
            - "A PRESSURE_VESSEL VesselJob J-2885-03 with design_code DIV2, mawp_psi 350, inside_radius_in 30, mdmt_f -20, stress_ratio 1.00."
            - "Both required sheets (SHELL, HEAD) are APPROVED with rt_extent_declared SPOT, so joint_efficiency is 0.85, thickness_required_in is 0.6879 and the job sits in FAB_PLANNING with governing_joint_efficiency 0.85."
            - "Heat H-4471 (SA-516-70 PLATE, FERRITIC, 3000 lb) is ACCEPTED and has issued SH-01 (SHELL 1000 lb), SH-02 (SHELL 800 lb) and HD-01 (HEAD 600 lb)."
            - "Heat H-9902 (SA-240-304L PLATE, AUSTENITIC, 500 lb) is ACCEPTED and has issued HD-02 (HEAD 400 lb)."
            - "WPS-1 is QUALIFIED with thickness range [0.1875, 3.0000] and pwht_required false."
            - "No ProductionWeld rows exist yet."
