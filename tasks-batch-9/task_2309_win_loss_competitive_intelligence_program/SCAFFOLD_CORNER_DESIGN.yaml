  # ---------------------------------------------------------------------------
  # SECTION: rbac (guide "From Table 7 (RBAC)" plus the segregation_of_duties role model)
  # Positive coverage of all six roles is folded into one end-to-end pipeline instance:
  # the pipeline can only complete if every role can perform its own exclusive operations.
  # Each role then gets a denial instance proving another role cannot perform its exclusive
  # operation, and the segregation_of_duties row of the role-model table gets one instance
  # per barred pairing declared in validations priority 15.
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:

      - name: each_role_performs_its_own_exclusive_operations_end_to_end
        claim_type: exclusive_operation_access
        grounds:
          - rbac.ProgramAdmin.exclusive_operations
          - rbac.ResearchAnalyst.exclusive_operations
          - rbac.LegalReviewer.exclusive_operations
          - rbac.EnablementManager.exclusive_operations
          - rbac.ProductManager.exclusive_operations
          - rbac.SalesRep.exclusive_operations
        distinguishing_aspect: "One pipeline that can only reach its end if all six roles are accepted on their own exclusive operations: ProgramAdmin (program/competitor/analyst/deal), ResearchAnalyst (frame, draw, contact, consent, interview, responses, completion, card, claim, submit-legal), LegalReviewer (legal-decision), EnablementManager (publish, assignment), ProductManager (gap intake and triage) and finally SalesRep (own completion). A single mis-scoped role list anywhere in the chain fails the test at that step."
        test_recipe:
          setup: ["the whole program pipeline driven by the correct role at every step, up to a PUBLISHED battlecard with one assignment to rep-77 and one triaged product gap"]
