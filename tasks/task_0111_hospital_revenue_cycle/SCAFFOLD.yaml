scenario: "Hospital Revenue Cycle Management (HRCM): admission registration, insurance eligibility verification, charge capture, ICD-10/CPT coding, payer clearance, patient responsibility (Deductible/Coinsurance/OOP Max), bad debt write-off."

domain_name: "hospital-revenue-cycle"
api_prefix: "/encounters"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Cascading side effects"
    - "Derived field reconciliation"
  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: "peer_roles"
  consistency_model: "immediate"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical Record Number; uniquely identifies a patient across encounters."
        constraints: "Unique. 8-12 alphanumeric chars."
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD)."
      - name: status
        type: enum
        source: system
        description: "Patient record status."
        default: ACTIVE
        constraints: "Values: ACTIVE, ARCHIVED."

  - name: InsurancePolicy
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK to Patient.id."
      - name: payer_name
        type: string
        source: input
        description: "Insurance payer (e.g., 'Aetna Commercial PPO')."
      - name: policy_number
        type: string
        source: input
        description: "Payer-issued policy identifier."
      - name: plan_year
        type: integer
        source: input
        description: "Plan benefit year (e.g., 2026)."
      - name: deductible_cents
        type: integer
        source: input
        description: "Annual deductible in cents (per plan year)."
        constraints: ">= 0."
      - name: deductible_met_cents
        type: integer
        source: system
        description: "Cumulative member spend applied against the deductible for the current plan year."
        default: 0
        constraints: "0 <= deductible_met_cents <= deductible_cents."
      - name: coinsurance_rate_bps
        type: integer
        source: input
        description: "Member coinsurance rate after deductible, in basis points (e.g., 2000 = 20%)."
        constraints: "0 <= coinsurance_rate_bps <= 10000."
      - name: oop_max_cents
        type: integer
        source: input
        description: "Annual out-of-pocket maximum in cents."
        constraints: ">= deductible_cents."
      - name: oop_accumulated_cents
        type: integer
        source: system
        description: "Cumulative member out-of-pocket spend in current plan year."
        default: 0
        constraints: "0 <= oop_accumulated_cents <= oop_max_cents."
      - name: status
        type: enum
        source: system
        description: "Policy lifecycle."
        default: UNVERIFIED
        constraints: "Values: UNVERIFIED, ELIGIBLE, INELIGIBLE."
      - name: verified_at
        type: datetime
        source: system
        description: "ISO 8601 timestamp when the eligibility check completed."
        default: null

  - name: Encounter
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK to Patient.id."
      - name: policy_id
        type: string
        source: input
        description: "FK to InsurancePolicy.id designated at admission."
      - name: admission_at
        type: datetime
        source: system
        description: "Set on encounter creation (registration)."
      - name: discharge_at
        type: datetime
        source: system
        description: "Set when discharge is recorded."
        default: null
      - name: status
        type: enum
        source: system
        description: "Encounter lifecycle status."
        default: REGISTERED
        constraints: "Values: REGISTERED, ELIGIBILITY_VERIFIED, CHARGES_CAPTURED, CODED, CLEARED, BILLED, RESOLVED, WRITTEN_OFF."
      - name: total_charges_cents
        type: integer
        source: computed
        description: "Sum of all ChargeItem.amount_cents in non-VOIDED status; refreshed by charge_total_aggregation."
        default: 0
      - name: payer_responsibility_cents
        type: integer
        source: computed
        description: "Final allowed payer portion after coding+clearance; written by payer_clearance_calc."
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "Final member portion after deductible/coinsurance/OOP cap; written by patient_responsibility_calc."
        default: 0
      - name: estimated_patient_responsibility_cents
        type: integer
        source: computed
        description: "Forward-looking pre-service estimate; written by patient_responsibility_calc variant 'estimate' at eligibility verification."
        default: 0
      - name: write_off_cents
        type: integer
        source: computed
        description: "Amount written off as bad debt; set by bad_debt_writeoff_calc when applicable."
        default: 0

  - name: ChargeItem
    parent: Encounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK to Encounter.id."
      - name: cpt_code
        type: string
        source: input
        description: "CPT procedure code (5 digits)."
        constraints: "Exactly 5 digits."
      - name: description
        type: string
        source: input
        description: "Human-readable description of the charged service."
      - name: quantity
        type: integer
        source: input
        description: "Number of units for this line item."
        constraints: ">= 1."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Per-unit charge in cents."
        constraints: ">= 0."
      - name: amount_cents
        type: integer
        source: computed
        description: "quantity * unit_price_cents; pinned on create."
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the charge line."
        default: PENDING
        constraints: "Values: PENDING, POSTED, VOIDED."
      - name: posted_at
        type: datetime
        source: system
        description: "Set when the charge line is posted into the encounter ledger."
        default: null

  - name: CodingRecord
    parent: Encounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK to Encounter.id (1:1 — at most one CodingRecord per Encounter)."
      - name: primary_icd10
        type: string
        source: input
        description: "Primary ICD-10-CM diagnosis code (e.g., 'J18.9')."
        constraints: "Pattern: letter + 2 digits + optional '.' + up to 4 alphanum."
      - name: secondary_icd10
        type: array
        source: input
        description: "Zero or more secondary ICD-10 codes."
        default: []
      - name: cpt_codes
        type: array
        source: input
        description: "List of CPT codes for the encounter (must mirror non-VOIDED ChargeItem.cpt_code set, in arbitrary order)."
      - name: coder_id
        type: string
        source: input
        description: "User id of the Coder who finalized the record."
      - name: status
        type: enum
        source: system
        description: "Coding workflow state."
        default: DRAFT
        constraints: "Values: DRAFT, FINALIZED."

  - name: ClearanceDecision
    parent: Encounter
    common_fields: false
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK to Encounter.id."
      - name: decision
        type: enum
        source: input
        description: "Payer adjudication outcome."
        constraints: "Values: APPROVED, PARTIAL, DENIED."
      - name: allowed_amount_cents
        type: integer
        source: input
        description: "Amount the payer agrees to consider allowed. Required when decision is APPROVED or PARTIAL; must be 0 when DENIED."
        constraints: "0 <= allowed_amount_cents <= Encounter.total_charges_cents."
      - name: denial_reason_code
        type: string
        source: input
        description: "Required when decision is DENIED or PARTIAL; payer reason code (e.g., 'CO-50')."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Server-set on record creation."

  - name: PatientPayment
    parent: Encounter
    common_fields: false
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK to Encounter.id."
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents."
        constraints: ">= 1."
      - name: method
        type: enum
        source: input
        description: "Payment instrument."
        constraints: "Values: CASH, CARD, CHECK, REFUND."
      - name: posted_at
        type: datetime
        source: system
        description: "Server-set on record creation."

  - name: BadDebtRecord
    parent: Encounter
    common_fields: false
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK to Encounter.id (unique — at most one BadDebtRecord per Encounter)."
      - name: write_off_cents
        type: integer
        source: computed
        description: "Computed by bad_debt_writeoff_calc at creation: outstanding patient balance at write-off time."
      - name: days_since_billed
        type: integer
        source: computed
        description: "Floor((now - Encounter.billed_at)/1 day) at creation. Captured for audit."
      - name: written_off_at
        type: datetime
        source: system
        description: "Server-set on creation."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InsurancePolicy
    initial_state: UNVERIFIED
    terminal_states: [INELIGIBLE]
    transitions:
      - from: UNVERIFIED
        to: ELIGIBLE
        trigger: "POST /encounters/{id}/verify-eligibility (policy_eligible=true branch)"
        actor: RegistrationClerk
        preconditions:
          - "InsurancePolicy.plan_year equals current calendar year"
          - "Encounter.status == REGISTERED"
        side_effects:
          - "InsurancePolicy.verified_at set to request time"
          - "Encounter transitions REGISTERED → ELIGIBILITY_VERIFIED"
          - "patient_responsibility_calc (variant 'estimate') runs against the pre-service total_charges_cents (which is 0 at admission) and writes Encounter.estimated_patient_responsibility_cents = 0; this estimate is refreshed by charge_total_aggregation as each ChargeItem posts"
      - from: UNVERIFIED
        to: INELIGIBLE
        trigger: "POST /encounters/{id}/verify-eligibility (policy_eligible=false branch)"
        actor: RegistrationClerk
        preconditions:
          - "Encounter.status == REGISTERED"
        side_effects:
          - "InsurancePolicy.verified_at set to request time"
          - "Encounter.status stays REGISTERED (forces re-registration with another policy)"

  - entity: Encounter
    initial_state: REGISTERED
    terminal_states: [RESOLVED, WRITTEN_OFF]
    transitions:
      - from: REGISTERED
        to: ELIGIBILITY_VERIFIED
        trigger: "POST /encounters/{id}/verify-eligibility (eligible branch)"
        actor: RegistrationClerk
        preconditions:
          - "Encounter.policy_id resolves to a policy whose verification returns ELIGIBLE"
        side_effects:
          - "Sets InsurancePolicy.status = ELIGIBLE"
          - "Initializes Encounter.estimated_patient_responsibility_cents = 0 via patient_responsibility_calc (variant 'estimate')"

      - from: ELIGIBILITY_VERIFIED
        to: CHARGES_CAPTURED
        trigger: "POST /encounters/{id}/discharge"
        actor: RegistrationClerk
        preconditions:
          - "At least one ChargeItem exists in status POSTED"
          - "No ChargeItem in status PENDING"
        side_effects:
          - "Encounter.discharge_at set"
          - "charge_total_aggregation refreshes Encounter.total_charges_cents"
          - "patient_responsibility_calc (variant 'estimate') refreshes Encounter.estimated_patient_responsibility_cents using current ledger snapshot"

      - from: CHARGES_CAPTURED
        to: CODED
        trigger: "POST /encounters/{id}/coding (finalize=true)"
        actor: Coder
        preconditions:
          - "Encounter has exactly one CodingRecord in DRAFT (or none, in which case the call creates it as FINALIZED in one shot)"
          - "CodingRecord.cpt_codes set equals the multiset of non-VOIDED ChargeItem.cpt_code values"
          - "primary_icd10 matches ICD-10-CM pattern"
        side_effects:
          - "CodingRecord.status set to FINALIZED"
          - "Re-runs charge_total_aggregation"

      - from: CODED
        to: CLEARED
        trigger: "POST /encounters/{id}/clearance"
        actor: Biller
        preconditions:
          - "Encounter has a FINALIZED CodingRecord"
          - "ClearanceDecision.allowed_amount_cents <= Encounter.total_charges_cents"
        side_effects:
          - "ClearanceDecision created"
          - "payer_clearance_calc writes Encounter.payer_responsibility_cents"
          - "patient_responsibility_calc (variant 'final') writes Encounter.patient_responsibility_cents AND increments InsurancePolicy.deductible_met_cents and oop_accumulated_cents per the calc's accumulator updates"

      - from: CLEARED
        to: BILLED
        trigger: "POST /encounters/{id}/issue-bill"
        actor: Biller
        preconditions:
          - "Encounter.patient_responsibility_cents has been written (CLEARED transition completed)"
        side_effects:
          - "Encounter.billed_at set; outstanding balance becomes due"

      - from: BILLED
        to: RESOLVED
        trigger: "POST /encounters/{id}/payments (when running balance reaches 0)"
        actor: Biller
        preconditions:
          - "outstanding_balance_calc returns 0 after applying this payment"
        side_effects:
          - "Encounter.status set to RESOLVED (terminal)"

      - from: BILLED
        to: WRITTEN_OFF
        trigger: "POST /encounters/{id}/write-off"
        actor: Biller
        preconditions:
          - "Now is at least 90 days after Encounter.billed_at (via test clock)"
          - "outstanding_balance_calc returns > 0"
          - "No BadDebtRecord already exists for this Encounter"
        side_effects:
          - "BadDebtRecord created via bad_debt_writeoff_calc"
          - "Encounter.write_off_cents set to BadDebtRecord.write_off_cents"
          - "Encounter.status set to WRITTEN_OFF (terminal)"

  - entity: ChargeItem
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /encounters/{id}/charges/{charge_id}/post"
        actor: ChargeCaptureClerk
        preconditions:
          - "Encounter.status IN {ELIGIBILITY_VERIFIED}"
          - "ChargeItem.amount_cents > 0"
        side_effects:
          - "ChargeItem.posted_at set"
          - "charge_total_aggregation refreshes Encounter.total_charges_cents"
          - "patient_responsibility_calc (variant 'estimate') refreshes Encounter.estimated_patient_responsibility_cents (cascading derivation)"

      - from: PENDING
        to: VOIDED
        trigger: "POST /encounters/{id}/charges/{charge_id}/void"
        actor: ChargeCaptureClerk
        preconditions:
          - "Encounter.status IN {ELIGIBILITY_VERIFIED, CHARGES_CAPTURED}"
        side_effects:
          - "No charge_total_aggregation update needed (PENDING items are not counted)"

      - from: POSTED
        to: VOIDED
        trigger: "POST /encounters/{id}/charges/{charge_id}/void"
        actor: ChargeCaptureClerk
        preconditions:
          - "Encounter.status IN {ELIGIBILITY_VERIFIED, CHARGES_CAPTURED}"
          - "No FINALIZED CodingRecord exists for this Encounter"
        side_effects:
          - "charge_total_aggregation refreshes Encounter.total_charges_cents"
          - "patient_responsibility_calc (variant 'estimate') refreshes Encounter.estimated_patient_responsibility_cents (cascading derivation)"

  - entity: CodingRecord
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /encounters/{id}/coding (finalize=true) OR PATCH /encounters/{id}/coding/finalize"
        actor: Coder
        preconditions:
          - "Encounter.status == CHARGES_CAPTURED"
          - "CodingRecord.cpt_codes is exactly the multiset of non-VOIDED ChargeItem.cpt_code values for this Encounter"
        side_effects:
          - "Encounter.status transitions CHARGES_CAPTURED → CODED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clerks attempt to verify eligibility on the same Encounter simultaneously."
    guarantee: "Exactly one verification call succeeds; the second sees the Encounter already past REGISTERED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Encounter.status."

  - scenario: "Two coders submit a finalize call for the same Encounter at the same time."
    guarantee: "Only one CodingRecord can exist per Encounter; the second submission is rejected."
    error_id: ERR_DUPLICATE_CODING_RECORD
    http_status: 409
    serialization: "Unique (encounter_id) on CodingRecord; first-writer-wins."

  - scenario: "Clearance and write-off requests race on the same BILLED encounter."
    guarantee: "Only one BadDebtRecord per Encounter; the second write-off attempt is rejected."
    error_id: ERR_DUPLICATE_WRITE_OFF
    http_status: 409
    serialization: "Unique (encounter_id) on BadDebtRecord."

  - scenario: "Two payment posts arrive simultaneously while balance is one payment away from zero."
    guarantee: "Both payments persist as separate PatientPayment records; only one transition to RESOLVED occurs; subsequent payments after RESOLVED are rejected as state-illegal."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "Serialize on Encounter.status; once RESOLVED, further payment posts return ERR_INVALID_STATE."

  - scenario: "Optimistic concurrency conflict on Encounter PATCH (e.g., updating policy_id at registration)."
    guarantee: "Stale version writes rejected."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Version field MUST match current; mismatch → reject."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: charge_total_aggregation
    trigger: "After ChargeItem state transition (PENDING→POSTED, POSTED→VOIDED) AND on Encounter discharge."
    algorithm: aggregation
    formula: |
      Encounter.total_charges_cents =
        SUM(ChargeItem.amount_cents
            FOR ChargeItem WHERE encounter_id = Encounter.id AND status == POSTED)
      # ChargeItem.amount_cents was pinned at create as quantity * unit_price_cents.
      # PENDING and VOIDED items are excluded.
    input_set: "ChargeItem rows with encounter_id = Encounter.id and status == POSTED."
    constants: {}
    precision: "Integer cents — no rounding (sums are exact)."

  - name: patient_responsibility_calc
    trigger: "Two distinct triggers:
      (estimate variant) On verify-eligibility, on each ChargeItem state change that affects total_charges_cents, and on discharge — writes Encounter.estimated_patient_responsibility_cents.
      (final variant) On CODED→CLEARED transition (after ClearanceDecision is recorded) — writes Encounter.patient_responsibility_cents and increments InsurancePolicy.deductible_met_cents and oop_accumulated_cents."
    algorithm: tiered_pricing
    formula: |
      # WATERFALL ALLOCATION — evaluation order is fixed and authoritative:
      # Inputs:
      #   billable = (variant 'estimate':) Encounter.total_charges_cents
      #              (variant 'final':)    ClearanceDecision.allowed_amount_cents
      #   D  = InsurancePolicy.deductible_cents
      #   DM = InsurancePolicy.deductible_met_cents   (read AT THE START of the calculation)
      #   C  = InsurancePolicy.coinsurance_rate_bps
      #   M  = InsurancePolicy.oop_max_cents
      #   OOP = InsurancePolicy.oop_accumulated_cents (read AT THE START of the calculation)
      #
      # Step 1 — Deductible bucket (member pays 100% until deductible is met):
      #   deductible_remaining = max(0, D - DM)
      #   deductible_portion   = min(billable, deductible_remaining)
      #
      # Step 2 — Coinsurance bucket (applied to what remains after the deductible bucket):
      #   post_deductible      = billable - deductible_portion
      #   coinsurance_portion_raw = post_deductible * C / 10000
      #     -> ROUNDING: round_half_up to nearest cent on the COINSURANCE BUCKET ONLY,
      #        once, after multiplication. (Pinned order — do NOT round per-line-item.)
      #   coinsurance_portion = round_half_up(coinsurance_portion_raw, 0 decimals in cents)
      #
      # Step 3 — Member-side sum before OOP cap:
      #   member_uncapped = deductible_portion + coinsurance_portion
      #
      # Step 4 — OOP Max cap (capped against starting OOP accumulator):
      #   oop_remaining   = max(0, M - OOP)
      #   member_payable  = min(member_uncapped, oop_remaining)
      #
      # Step 5 — Outputs:
      #   patient_responsibility_cents = member_payable
      #   payer_responsibility_cents (variant 'final' only) is written by payer_clearance_calc
      #
      # For variant 'final', accumulators are updated AFTER member_payable is computed:
      #   InsurancePolicy.deductible_met_cents += deductible_portion
      #   InsurancePolicy.oop_accumulated_cents += member_payable
      #   (Both clamped to their respective caps.)
    input_set: "billable cents (encounter total OR clearance allowed amount), InsurancePolicy deductible/coinsurance/OOP fields. PatientPayment rows are NOT included."
    constants:
      BPS_DIVISOR: 10000
    precision: "Integer cents. Rounding applied ONCE, at Step 2 (coinsurance bucket only), round_half_up."
    variants:
      - name: estimate
        when: "Pre-clearance — runs on verify-eligibility, after charge mutations, on discharge."
        difference: "billable = Encounter.total_charges_cents (forward-looking on charges). Writes Encounter.estimated_patient_responsibility_cents. Does NOT update deductible_met_cents or oop_accumulated_cents."
      - name: final
        when: "On CODED→CLEARED transition, immediately after ClearanceDecision is persisted."
        difference: "billable = ClearanceDecision.allowed_amount_cents (chronological — uses adjudicated amount). Writes Encounter.patient_responsibility_cents. DOES update deductible_met_cents and oop_accumulated_cents."

  - name: payer_clearance_calc
    trigger: "On CODED→CLEARED transition, before patient_responsibility_calc (variant 'final')."
    algorithm: threshold
    formula: |
      # ClearanceDecision.decision drives the result.
      IF decision == DENIED:
        Encounter.payer_responsibility_cents = 0
        # Patient responsibility for the unallowed portion follows the rule below.
      ELIF decision == APPROVED OR decision == PARTIAL:
        Encounter.payer_responsibility_cents =
          ClearanceDecision.allowed_amount_cents - patient_responsibility_cents_from_calc
        # Where patient_responsibility_cents_from_calc is the member portion computed
        # by patient_responsibility_calc (variant 'final') on the allowed_amount_cents.
        # Note: payer_responsibility_cents + patient_responsibility_cents_from_calc
        #       == ClearanceDecision.allowed_amount_cents.
      # Unallowed portion (write-down):
      #   unallowed_cents = Encounter.total_charges_cents - ClearanceDecision.allowed_amount_cents
      #   For decision == DENIED, the entire total_charges_cents is unallowed.
      #   Unallowed cents are NOT billed to the patient (contractual write-down) UNLESS
      #   the denial_reason_code is in {'PR-1','PR-2','PR-3'} (patient-responsibility codes),
      #   in which case unallowed_cents flows into patient_responsibility_cents in full
      #   (not subject to deductible/coinsurance/OOP — bypass the waterfall).
    input_set: "ClearanceDecision row, Encounter.total_charges_cents, patient_responsibility_calc 'final' output."
    constants:
      PATIENT_RESPONSIBILITY_CODES: ["PR-1", "PR-2", "PR-3"]
    precision: "Integer cents — no rounding (subtraction of integers)."

  - name: outstanding_balance_calc
    trigger: "On read of Encounter.outstanding_balance_cents (GET /encounters/{id}) and on each PatientPayment post."
    algorithm: chronological
    formula: |
      # PatientPayments are applied in chronological order of posted_at, with id ASC as tie-break.
      # Each PatientPayment row, in order:
      #   IF payment.method == REFUND: running_balance += payment.amount_cents
      #   ELSE:                         running_balance -= payment.amount_cents
      # Starting from:
      #   running_balance = Encounter.patient_responsibility_cents
      # Final:
      #   outstanding_balance_cents = max(0, running_balance)
      #   IF running_balance < 0: overpayment_cents = -running_balance, ELSE 0
    input_set: "Encounter.patient_responsibility_cents (post-CLEARED) and all PatientPayment rows for this Encounter ordered by (posted_at ASC, id ASC)."
    constants: {}
    precision: "Integer cents — no rounding."

  - name: bad_debt_writeoff_calc
    trigger: "On BILLED→WRITTEN_OFF transition."
    algorithm: threshold
    formula: |
      # BadDebtRecord.write_off_cents = outstanding_balance_calc(Encounter) at write-off time.
      # Eligibility threshold: now - Encounter.billed_at >= 90 days (use test clock).
      # Boundary precision: '>= 90 days' is INCLUSIVE — exactly 90 days passes the gate.
      #   day_count = floor((clock_now - Encounter.billed_at) / 86400000 ms)
      #   require day_count >= 90
    input_set: "Encounter.billed_at, clock_now, outstanding_balance_calc(Encounter)."
    constants:
      MIN_DAYS_SINCE_BILLED: 90
    precision: "Integer cents."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "FK fields in the request body reference existing rows (e.g., policy_id on Encounter creation)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /encounters, POST /policies, POST /encounters/{id}/charges, POST /encounters/{id}/coding"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for this operation per §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "Encounter.policy_id at admission references a policy whose patient_id matches the Encounter.patient_id."
    error_id: ERR_POLICY_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /encounters"

  - priority: 7
    category: business_safety
    check: "Eligibility verification: InsurancePolicy.plan_year must equal the current calendar year (via test clock)."
    error_id: ERR_PLAN_YEAR_EXPIRED
    http_status: 422
    applies_to: "POST /encounters/{id}/verify-eligibility"

  - priority: 8
    category: business_constraint
    check: "ICD-10 code matches pattern: [A-Z]\\d{2}(\\.[A-Z0-9]{1,4})?"
    error_id: ERR_INVALID_ICD10
    http_status: 422
    applies_to: "POST /encounters/{id}/coding"

  - priority: 9
    category: business_constraint
    check: "CPT code must be exactly 5 digits."
    error_id: ERR_INVALID_CPT
    http_status: 422
    applies_to: "POST /encounters/{id}/charges, POST /encounters/{id}/coding"

  - priority: 10
    category: business_referential
    check: "On finalize, CodingRecord.cpt_codes (as a multiset) MUST equal the multiset of non-VOIDED ChargeItem.cpt_code for this Encounter."
    error_id: ERR_CODING_CPT_MISMATCH
    http_status: 422
    applies_to: "POST /encounters/{id}/coding (finalize=true)"

  - priority: 11
    category: business_constraint
    check: "ClearanceDecision.allowed_amount_cents <= Encounter.total_charges_cents."
    error_id: ERR_ALLOWED_EXCEEDS_CHARGES
    http_status: 422
    applies_to: "POST /encounters/{id}/clearance"

  - priority: 12
    category: business_constraint
    check: "When ClearanceDecision.decision == DENIED, allowed_amount_cents must be 0 and denial_reason_code is required."
    error_id: ERR_INVALID_CLEARANCE_PAYLOAD
    http_status: 422
    applies_to: "POST /encounters/{id}/clearance"

  - priority: 13
    category: business_fiscal
    check: "Discharge requires at least one POSTED ChargeItem AND zero PENDING ChargeItems."
    error_id: ERR_CHARGES_NOT_READY
    http_status: 422
    applies_to: "POST /encounters/{id}/discharge"

  - priority: 14
    category: business_temporal
    check: "Write-off requires clock_now - Encounter.billed_at >= 90 days (inclusive)."
    error_id: ERR_WRITE_OFF_TOO_EARLY
    http_status: 422
    applies_to: "POST /encounters/{id}/write-off"

  - priority: 15
    category: business_fiscal
    check: "Write-off requires outstanding_balance_calc(Encounter) > 0."
    error_id: ERR_WRITE_OFF_NO_BALANCE
    http_status: 422
    applies_to: "POST /encounters/{id}/write-off"

  - priority: 16
    category: business_fiscal
    check: "PatientPayment.amount_cents >= 1 and <= outstanding_balance_calc(Encounter) (for non-REFUND methods)."
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /encounters/{id}/payments"

  - priority: 17
    category: business_constraint
    check: "PATCH operations require version field matching current Encounter.version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /encounters/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Patient -----
  - method: POST
    path: "/patients"
    description: "Register a new patient record."
    roles: [RegistrationClerk]
    code: 201
    input: [mrn, full_name, date_of_birth]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}"
    description: "Fetch a patient by id."
    roles: [RegistrationClerk, ChargeCaptureClerk, Coder, Biller]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients (paginated, optional mrn filter)."
    roles: [RegistrationClerk, ChargeCaptureClerk, Coder, Biller]
    code: 200
    input: ["limit?", "offset?", "mrn?"]
    output: "Patient[]"
    side_effects: []

  # ----- InsurancePolicy -----
  - method: POST
    path: "/patients/{patient_id}/policies"
    description: "Attach an insurance policy to a patient."
    roles: [RegistrationClerk]
    code: 201
    input: [payer_name, policy_number, plan_year, deductible_cents, coinsurance_rate_bps, oop_max_cents]
    output: InsurancePolicy
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}/policies"
    description: "List policies for a patient."
    roles: [RegistrationClerk, Biller]
    code: 200
    input: ["limit?", "offset?"]
    output: "InsurancePolicy[]"
    side_effects: []

  # ----- Encounter -----
  - method: POST
    path: "/encounters"
    description: "Admit a patient and open an encounter."
    roles: [RegistrationClerk]
    code: 201
    input: [patient_id, policy_id]
    output: Encounter
    side_effects:
      - "Encounter.status set to REGISTERED"
      - "admission_at set to clock_now"

  - method: GET
    path: "/encounters/{encounter_id}"
    description: "Fetch encounter (includes computed total_charges_cents, estimated/final responsibility, outstanding_balance via outstanding_balance_calc)."
    roles: [RegistrationClerk, ChargeCaptureClerk, Coder, Biller]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  - method: GET
    path: "/encounters"
    description: "List encounters (paginated, optional status/patient_id filter)."
    roles: [RegistrationClerk, Biller]
    code: 200
    input: ["limit?", "offset?", "status?", "patient_id?"]
    output: "Encounter[]"
    side_effects: []

  - method: PATCH
    path: "/encounters/{encounter_id}"
    description: "Update encounter metadata while still REGISTERED (e.g., swap policy_id)."
    roles: [RegistrationClerk]
    code: 200
    input: ["policy_id?", "version"]
    output: Encounter
    side_effects: []

  - method: POST
    path: "/encounters/{encounter_id}/verify-eligibility"
    description: "Run insurance eligibility check; flips Encounter to ELIGIBILITY_VERIFIED on success."
    roles: [RegistrationClerk]
    code: 200
    input: [policy_eligible, "denial_code?"]
    output: Encounter
    side_effects:
      - "InsurancePolicy.status set to ELIGIBLE or INELIGIBLE"
      - "Encounter.status: REGISTERED → ELIGIBILITY_VERIFIED (eligible branch)"
      - "patient_responsibility_calc (variant 'estimate') seeds Encounter.estimated_patient_responsibility_cents"

  - method: POST
    path: "/encounters/{encounter_id}/discharge"
    description: "Mark encounter discharged; locks charge capture."
    roles: [RegistrationClerk]
    code: 200
    input: []
    output: Encounter
    side_effects:
      - "Encounter.status: ELIGIBILITY_VERIFIED → CHARGES_CAPTURED"
      - "charge_total_aggregation refreshes total_charges_cents"
      - "patient_responsibility_calc (variant 'estimate') refreshes estimate"

  - method: POST
    path: "/encounters/{encounter_id}/charges"
    description: "Add a PENDING charge line item."
    roles: [ChargeCaptureClerk]
    code: 201
    input: [cpt_code, description, quantity, unit_price_cents]
    output: ChargeItem
    side_effects:
      - "ChargeItem.amount_cents = quantity * unit_price_cents"

  - method: POST
    path: "/encounters/{encounter_id}/charges/{charge_id}/post"
    description: "Post a PENDING charge item (PENDING → POSTED)."
    roles: [ChargeCaptureClerk]
    code: 200
    input: []
    output: ChargeItem
    side_effects:
      - "ChargeItem.status PENDING → POSTED"
      - "charge_total_aggregation refreshes total_charges_cents"
      - "patient_responsibility_calc (variant 'estimate') refreshes estimate"

  - method: POST
    path: "/encounters/{encounter_id}/charges/{charge_id}/void"
    description: "Void a PENDING or POSTED charge."
    roles: [ChargeCaptureClerk]
    code: 200
    input: []
    output: ChargeItem
    side_effects:
      - "ChargeItem.status → VOIDED"
      - "If was POSTED: charge_total_aggregation refresh, patient_responsibility_calc 'estimate' refresh"

  - method: GET
    path: "/encounters/{encounter_id}/charges"
    description: "List charges for an encounter."
    roles: [ChargeCaptureClerk, Coder, Biller]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ChargeItem[]"
    side_effects: []

  - method: POST
    path: "/encounters/{encounter_id}/coding"
    description: "Create/finalize the coding record for an encounter."
    roles: [Coder]
    code: 201
    input: [primary_icd10, "secondary_icd10?", cpt_codes, finalize]
    output: CodingRecord
    side_effects:
      - "If finalize=true: Encounter.status CHARGES_CAPTURED → CODED"

  - method: GET
    path: "/encounters/{encounter_id}/coding"
    description: "Fetch the coding record for an encounter."
    roles: [Coder, Biller]
    code: 200
    input: []
    output: CodingRecord
    side_effects: []

  - method: POST
    path: "/encounters/{encounter_id}/clearance"
    description: "Submit payer clearance decision."
    roles: [Biller]
    code: 201
    input: [decision, allowed_amount_cents, "denial_reason_code?"]
    output: ClearanceDecision
    side_effects:
      - "Encounter.status CODED → CLEARED"
      - "payer_clearance_calc and patient_responsibility_calc (variant 'final') run; deductible_met_cents and oop_accumulated_cents increment"

  - method: POST
    path: "/encounters/{encounter_id}/issue-bill"
    description: "Mark a CLEARED encounter as billed (sends to patient)."
    roles: [Biller]
    code: 200
    input: []
    output: Encounter
    side_effects:
      - "Encounter.status CLEARED → BILLED; billed_at set"

  - method: POST
    path: "/encounters/{encounter_id}/payments"
    description: "Record a patient payment or refund against an encounter."
    roles: [Biller]
    code: 201
    input: [amount_cents, method]
    output: PatientPayment
    side_effects:
      - "outstanding_balance_calc re-evaluated"
      - "If outstanding_balance_cents reaches 0 (and method != REFUND): Encounter.status BILLED → RESOLVED"

  - method: GET
    path: "/encounters/{encounter_id}/payments"
    description: "List patient payments for an encounter."
    roles: [Biller]
    code: 200
    input: ["limit?", "offset?"]
    output: "PatientPayment[]"
    side_effects: []

  - method: POST
    path: "/encounters/{encounter_id}/write-off"
    description: "Write off an aged BILLED encounter to bad debt."
    roles: [Biller]
    code: 201
    input: []
    output: BadDebtRecord
    side_effects:
      - "Encounter.status BILLED → WRITTEN_OFF"
      - "bad_debt_writeoff_calc creates BadDebtRecord and sets Encounter.write_off_cents"

  # ----- Test/clock harness -----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server clock to a fixed ISO 8601 instant. Provided so tests can reach time-gated transitions (write-off ≥ 90 days; plan-year expiry)."
    roles: [TestHarness, Biller, RegistrationClerk]
    code: 200
    input: [to_timestamp]
    output: "{ now: ISO8601 }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced or FK-referenced resource not found."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits this operation; also returned when a payment is posted on an already-RESOLVED encounter."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH version field does not match current entity version."
  - id: ERR_POLICY_PATIENT_MISMATCH
    http: 422
    condition: "Encounter.policy_id references a policy whose patient_id does not match the Encounter.patient_id."
  - id: ERR_PLAN_YEAR_EXPIRED
    http: 422
    condition: "InsurancePolicy.plan_year does not equal the current calendar year at verification time."
  - id: ERR_INVALID_ICD10
    http: 422
    condition: "ICD-10 code violates pattern [A-Z]\\d{2}(\\.[A-Z0-9]{1,4})?."
  - id: ERR_INVALID_CPT
    http: 422
    condition: "CPT code is not exactly 5 digits."
  - id: ERR_CODING_CPT_MISMATCH
    http: 422
    condition: "CodingRecord.cpt_codes (multiset) does not equal the multiset of non-VOIDED ChargeItem.cpt_code for the encounter at finalize time."
  - id: ERR_ALLOWED_EXCEEDS_CHARGES
    http: 422
    condition: "ClearanceDecision.allowed_amount_cents exceeds Encounter.total_charges_cents."
  - id: ERR_INVALID_CLEARANCE_PAYLOAD
    http: 422
    condition: "ClearanceDecision payload internally inconsistent (DENIED with non-zero allowed_amount_cents, or missing denial_reason_code on DENIED/PARTIAL)."
  - id: ERR_CHARGES_NOT_READY
    http: 422
    condition: "Discharge attempted with no POSTED charges, or with any PENDING charges remaining."
  - id: ERR_WRITE_OFF_TOO_EARLY
    http: 422
    condition: "Write-off attempted before 90 days have elapsed since billed_at."
  - id: ERR_WRITE_OFF_NO_BALANCE
    http: 422
    condition: "Write-off attempted when outstanding_balance_cents is 0."
  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 422
    condition: "PatientPayment amount < 1 cent, or (for non-REFUND methods) exceeds current outstanding_balance_cents."
  - id: ERR_DUPLICATE_CODING_RECORD
    http: 409
    condition: "A CodingRecord already exists for this Encounter when a second coding submission arrives."
  - id: ERR_DUPLICATE_WRITE_OFF
    http: 409
    condition: "A BadDebtRecord already exists for this Encounter."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegistrationClerk
    description: "Admits patients, attaches policies, runs eligibility verification, discharges patients."
    identity: opaque
    exclusive_operations:
      - "POST /patients"
      - "POST /patients/{patient_id}/policies"
      - "POST /encounters"
      - "POST /encounters/{id}/verify-eligibility"
      - "POST /encounters/{id}/discharge"
      - "PATCH /encounters/{id}"
    shared_operations:
      - "GET /patients, GET /patients/{id}, GET /encounters, GET /encounters/{id}"
      - "POST /_clock/advance"

  - name: ChargeCaptureClerk
    description: "Adds and manages individual charge line items on an encounter."
    identity: opaque
    exclusive_operations:
      - "POST /encounters/{id}/charges"
      - "POST /encounters/{id}/charges/{charge_id}/post"
      - "POST /encounters/{id}/charges/{charge_id}/void"
    shared_operations:
      - "GET /encounters/{id}, GET /encounters/{id}/charges"

  - name: Coder
    description: "Owns ICD-10/CPT coding for an encounter."
    identity: opaque
    exclusive_operations:
      - "POST /encounters/{id}/coding"
    shared_operations:
      - "GET /encounters/{id}, GET /encounters/{id}/coding, GET /encounters/{id}/charges"

  - name: Biller
    description: "Owns payer clearance, billing, payment posting, and bad-debt write-off."
    identity: opaque
    exclusive_operations:
      - "POST /encounters/{id}/clearance"
      - "POST /encounters/{id}/issue-bill"
      - "POST /encounters/{id}/payments"
      - "POST /encounters/{id}/write-off"
    shared_operations:
      - "GET /encounters, GET /encounters/{id}, GET /encounters/{id}/payments, GET /encounters/{id}/coding"
      - "POST /_clock/advance"

  - name: TestHarness
    description: "Test-only role for clock advancement. Not exposed in production deployments."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /_clock/advance"
