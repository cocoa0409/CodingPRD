            - "the 2.99 mm claim returns status 422 with data.error_id 'ERR_DEFORMATION_BELOW_THRESHOLD' and no row consumes the code CLM-CD-2"
            - "the 3.00 mm claim returns status 201 with claim_status 'SUBMITTED', storage_review_status 'NOT_STARTED' and net_payout_cents null — exactly the threshold is claimable"
            - "the start-review returns status 200 with claim_status 'UNDER_REVIEW' and months_in_service 0"
            - "the VERIFIED review returns status 422 with data.error_id 'ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED' and storage_review_status is still 'NOT_STARTED'"
            - "the VIOLATED review returns status 200 with storage_review_status 'GUIDANCE_VIOLATED' and storage_description 'stored hull-down on gravel', proving the acknowledgement gate guards only the VERIFIED outcome"
            - "the repeat review returns status 409 with data.error_id 'ERR_STORAGE_REVIEW_ALREADY_DONE' and storage_description is unchanged"
            - "the first waiver returns status 200 with storage_review_status 'WAIVED'"
            - "the second waiver returns status 409 with data.error_id 'ERR_STORAGE_FINDING_NOT_WAIVABLE'"
            - "the suspend returns status 200, Customer.${cust}.status == 'SUSPENDED' and WarrantyClaim.${claim2}.claim_status == 'VOIDED' with denial_reason 'APPROVAL_VOIDED'"
            - "ProductModel.${pm}.warranty_reserve_cents is still 500000 and warranty_paid_cents is still 0 — nothing in this walk ever booked a payout"
            - "the CLM-CD-3 create returns status 409 with data.error_id 'ERR_CUSTOMER_NOT_ACTIVE', not 'ERR_UNIT_NOT_DELIVERED', although hull 2 is still STORED"

      - name: err_412_occ_is_reached_only_after_the_resin_lot_state_precondition
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RESIN_LOT_NOT_AVAILABLE
          - errors.ERR_STALE_RESIN_LOT_VERSION
          - errors.ERR_CHARGE_NOT_RELEASABLE
          - validations.priority_36
          - validations.priority_37
          - concurrency_rules.charge-create-stale-resin-lot
        distinguishing_aspect: |
          The SAME stale expected_resin_lot_version produces two different
          answers depending on the lot's state: while the lot is QUARANTINED the
          reply is 409 ERR_RESIN_LOT_NOT_AVAILABLE, and only once the quarantine
          is released does the identical request reach the OCC gate and reply 412
          ERR_STALE_RESIN_LOT_VERSION — proving 412 sits at the very bottom of
          the ladder.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with PO-CD-1 released and one SCHEDULED cycle, but NO resin charge yet; LOT-CD-1 is AVAILABLE at version 1 with 500.000 kg available."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
          trigger:
            - call: "POST /resin-lots/${lot}/quarantine"
              payload: { quarantine_reason: "melt index re-test pending" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "POST /resin-lots/${lot}/release-quarantine"
              payload: { release_note: "melt index 4.00 confirmed" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v3: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v3}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chg2: $.data.id }
            - call: "POST /resin-charges/${chg2}/release"
              payload: { release_reason: "operator re-weighed the drop" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "POST /resin-charges/${chg2}/release"
              payload: { release_reason: "releasing it twice" }
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "the quarantine returns status 200 with ResinLot.${lot}.status 'QUARANTINED' and version 2, and ProductionOrder.${po}.blocked_reason == 'NO_QUALIFIED_RESIN_LOT'"
            - "the charge create against the QUARANTINED lot returns status 409 with data.error_id 'ERR_RESIN_LOT_NOT_AVAILABLE', although expected_resin_lot_version ${lot_v} is ALSO stale"
            - "the release-quarantine returns status 200 with status 'AVAILABLE', version 3 and ProductionOrder.${po}.blocked_reason null"
            - "the second charge create, byte-identical to the first, now returns status 412 with data.error_id 'ERR_STALE_RESIN_LOT_VERSION'"
            - "ResinLot.${lot}.version == ${lot_v3} == 3 and reserved_kg == 0.000 after that 412 — a refused create books no mass"
            - "the charge create with the fresh version returns status 201 with status 'RESERVED', and ResinLot.${lot} then reports available_kg 476.000, reserved_kg 24.000 and consumed_kg 0.000"
            - "the first release returns status 200 with ResinCharge.${chg2}.status 'RELEASED' and ResinLot.${lot} back to available_kg 500.000, reserved_kg 0.000"
            - "the second release returns status 409 with data.error_id 'ERR_CHARGE_NOT_RELEASABLE' and available_kg is still 500.000, never 524.000"

