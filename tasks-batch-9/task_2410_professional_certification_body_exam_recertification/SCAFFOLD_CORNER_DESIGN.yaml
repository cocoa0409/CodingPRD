      - name: certificant_actions_on_another_users_cycle_return_not_resource_owner
        claim_type: role_denial
        grounds:
          - validations[priority=6]
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Certificant
          - endpoints.POST_/recertification-cycles/{id}/ceu-activities
          - entities.Certificant.fields.candidate_id
        distinguishing_aspect: |
          The Certificant role is scoped by ownership, not merely by role name: a caller holding
          the Certificant role but a foreign X-User-ID is refused 403 ERR_NOT_RESOURCE_OWNER on
          the cycle's CEU endpoint, and the identical body from the owning candidate_id is
          accepted 201 — so the check compares the acting X-User-ID with
          Certificant.candidate_id rather than trusting the role header.
