    description: "Collect an in-person repayment (waterfall split; mandatory savings component)"
    roles: [CenterManager]
    code: 201
    input: [member_id, loan_id, amount_cents]
    output: RepaymentTransaction
    side_effects: ["collection_waterfall applied", "savings account credited", "cure chain if arrears cleared (loan ACTIVE, member ACTIVE_BORROWER, group unrestricted)", "PAID_OFF chain if principal reaches 0", "member credit_score recomputed"]

