              as: PlanningDirector
              as_user_id: "dual-1"
              captures: { e_self_approve2: $.data.error_id }
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "signed off" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { approved_status: $.data.status, approver: $.data.approved_by_user_id }
            - call: "POST /otb/plan-months/${m1_id}/open-season"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "dual-1"
            - call: "POST /otb/assortment-items/${item_id}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "POST /otb/assortment-items/${item_id}/activate"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "dual-1"
              captures: { plan_v: $.data.version }
            - call: "POST /otb/category-plans/${plan_id}/reforecasts"
              payload: { reason_note: "mid-season review", expected_category_plan_version: "${plan_v}" }
              as: MerchandisePlanner
              as_user_id: "dual-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /otb/chase-cancel-decisions"
              payload: { reforecast_cycle_id: "${cycle_id}", assortment_item_id: "${item_id}", action: "HOLD", requested_units: 500, rationale: "hold one week" }
              as: CategoryBuyer
              as_user_id: "dual-2"
              captures: { dec_id: $.data.id, proposer: $.data.proposed_by_user_id }
            - call: "POST /otb/chase-cancel-decisions/${dec_id}/approve"
              payload: { decision_note: "self approval of my own hold" }
              as: PlanningDirector
              as_user_id: "dual-2"
              captures: { e_self_dec_approve: $.data.error_id }
            - call: "POST /otb/chase-cancel-decisions/${dec_id}/approve"
              payload: { decision_note: "hold confirmed" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { dec_status: $.data.status }
            - call: "POST /otb/chase-cancel-decisions"
              payload: { reforecast_cycle_id: "${cycle_id}", assortment_item_id: "${item_id}", action: "HOLD", requested_units: 300, rationale: "one more hold" }
              as: MerchandisePlanner
              as_user_id: "dual-1"
              captures: { dec2_id: $.data.id, proposer2: $.data.proposed_by_user_id }
            - call: "POST /otb/chase-cancel-decisions/${dec2_id}/reject"
              payload: { decision_note: "self rejection" }
              as: PlanningDirector
              as_user_id: "dual-1"
              captures: { e_self_dec_reject: $.data.error_id }
            - call: "POST /otb/chase-cancel-decisions/${dec2_id}/reject"
              payload: { decision_note: "not needed" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { dec2_status: $.data.status }
          assert:
            - "${submitter} == dual-1 is recorded on submit, so the originator is captured at the step and not inferred from the plan's creator"
            - "${e_self_approve} == ERR_SEGREGATION_OF_DUTIES with HTTP 409, not 403: dual-1 IS wearing a PlanningDirector role header, so priority 2 passes and priority 8 rejects"
            - "${e_self_reject} == ERR_SEGREGATION_OF_DUTIES: BOTH adjudication endpoints are covered, and the rule is not specific to approval"
            - "${rejected_status} == DRAFT for director-1 on the identical reject call: only the acting id differs"
            - "${submitter2} == dual-1 after the second submit, and ${e_self_approve2} == ERR_SEGREGATION_OF_DUTIES: re-submitting rewrites submitted_by_user_id rather than clearing it, so the block survives a full DRAFT round trip"
            - "${approved_status} == APPROVED with ${approver} == director-1: approved_by_user_id and submitted_by_user_id are now different ids, which is the state the rule exists to guarantee"
            - "${proposer} == dual-2 and ${e_self_dec_approve} == ERR_SEGREGATION_OF_DUTIES: the decision keeps its OWN originator, so blocking dual-2 while dual-1 is the plan's submitter proves the two records are independent"
            - "${dec_status} == APPROVED for director-1, then ${proposer2} == dual-1 and ${e_self_dec_reject} == ERR_SEGREGATION_OF_DUTIES: the same id that is blocked on the plan is blocked again on its own decision, and ${dec2_status} == REJECTED once director-1 acts"
            - "every refused call is inert: the plan never left SUBMITTED before director-1 acted, and both decisions stayed PROPOSED until a different id adjudicated them"

  # === 8. From Cross-Cutting Complexity Layers ===
  - section: complexity_layers
    instances:
      - name: both_occ_rules_reject_a_stale_parent_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.commitment-create-stale-plan-month
          - concurrency_rules.reforecast-open-stale-category-plan
          - validations[priority=15]
        distinguishing_aspect: "Both declared OCC rules are driven on one timeline, each with its own parent entity, its own guard field and its own 412 code, and each replayed successfully after a fresh read. The guard is a version comparison and nothing else: a PROPOSED commitment does not move PlanMonth.version, so two creates in a row against the same captured version both succeed - it is COMMITTING one of them that advances the month and invalidates the third. The two codes must not be interchangeable: a stale month version on a commitment create is ERR_STALE_PLAN_MONTH_VERSION, and a stale plan version on a reforecast is ERR_STALE_CATEGORY_PLAN_VERSION."
        test_recipe:
          setup:
            - "an APPROVED plan (receipt_budget 60,000,000) with M1 and M2 LOCKED_PLAN at otb_planned 18,200,000 and 21,970,000, an AUTHORIZED and category-authorized vendor, and one CARRYOVER item"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
