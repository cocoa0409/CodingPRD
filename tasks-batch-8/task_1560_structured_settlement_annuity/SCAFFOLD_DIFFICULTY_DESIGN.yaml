          assert:
            - "${p1_st} == ESCHEATABLE before finalize (dormancy anniversary 2027-09-01 strictly passed)"
            - "tracked sum before: ${t0_paid} + ${t0_out} + ${t0_esch} == 0 + 170000 + 0 == 170000"
