            - "${snc} == null (zero non-compliant parcels in the outcome set, so the denominator is 0) and ${delta} == null because one component is null"
            - "Parcel.${pB}.structure_survival_outcome == \"SURVIVED\" is stored yet still excluded, proving the filter is on compliance_status rather than on the presence of an outcome"

      - name: priority_queue_ranks_by_risk_then_created_at
        claim_type: chronological
        grounds:
          - calculations.inspection_priority_rank
          - endpoints."GET /fire-district/inspection-cycles/{cycle_id}/priority-queue"
          - state_machines.InspectionCycle.ACTIVE_to_ACTIVE.side_effects
        distinguishing_aspect: |
          STEP 5 of the advance produces a 1-based dense ranking whose only tie-break between two
          identically scored HIGH parcels is Parcel.created_at ASCENDING — the earlier-created parcel
          takes rank 2 and the later one rank 3, and Parcel.id never participates — while the exempt
          parcel is dropped from the ordering entirely with rank null rather than ranked last.
        test_recipe:
          setup:
            - "Active cycle; an EXTREME parcel (clamped to 100.00), two identical HIGH parcels created on different logical days, one MODERATE parcel and one exempt parcel. No inspections, so every staleness_days is NEVER_INSPECTED_STALENESS_DAYS and every open_violation_count is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-3501", owner_name: "Eve Nash", owner_email: "eve@example.com", situs_address: "1 Summit Trl", roof_class: "NONE", vegetation_type: "MIXED_CONIFER", slope_pct: 50, lot_area_sqft: 87120, hazard_zone: "VERY_HIGH", access_constraint: "LOCKED_GATE" }
              as: ProgramAdmin
