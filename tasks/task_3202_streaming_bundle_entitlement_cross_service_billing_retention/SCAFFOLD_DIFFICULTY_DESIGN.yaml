# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Streaming Bundle Entitlement, Cross-Service Billing & Retention
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: migration_proration_quote_vs_confirm_clock_gap
        grounds:
          - calculations.migration_proration
          - state_machines.Migration.QUOTED_to_CONFIRMED
          - entities.Migration.fields.proration_method_used
        distinguishing_aspect: |
          Entity domain: Migration proration ledger. The QUOTE variant
          (CHRONOLOGICAL_REMAINING at 2026-09-06) yields floor(799*25/30)=665
          cents, while the CONFIRM variant (FORWARD_LOOKING_PERIOD at
          2026-09-11, no intervening invoices) yields floor(799*20/30)=532
          cents — same subscription, same inputs except clock position, two
          valid algorithms, different results, and the CONFIRM value wins.
        test_recipe:
          setup:
            - "PLATFORM-billed subscriber with an ACTIVE DPLUS_ADS standalone subscription (monthly 799c, grandfathered lock 799c) created at 2026-09-01T00:00:00Z, period [2026-09-01, 2026-10-01)"
            - "DUO_PREMIUM bundle plan (1999c, weights DPLUS 0.45 / HULU 0.55, all billers allowed)"
            - "Both DPLUS and HULU service profiles LINKED"
            - "Migration quoted at 2026-09-06; clock advanced to 2026-09-11 before confirm"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_PREMIUM", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_FREE", monthly_price_cents: 1999, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "dv1@x.com", full_name: "DV One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "HULU" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_hulu: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/migrations"
              payload: { from_subscription_id: "${sub_id}", target_plan_code: "DUO_PREMIUM" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { mig_id: $.data.id, mig_quote_credit: $.data.proration_credit_cents, mig_v: $.data.version }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/migrations/${mig_id}/confirm"
              payload: { expected_migration_version: "${mig_v}" }
              as: Subscriber
              as_user_id: "${sa_id}"
          assert:
            - "Migration.${mig_id}.proration_credit_cents at quote time was 665 (floor(799*25/30))"
            - "Migration.${mig_id}.proration_credit_cents after confirm == 532 (floor(799*20/30))"
            - "Migration.${mig_id}.proration_method_used == FORWARD_LOOKING_PERIOD"
            - "SubscriberAccount.${sa_id}.account_credit_cents == 532"

      - name: migration_proration_confirm_after_renewal_consumed_credit
        grounds:
          - calculations.migration_proration
          - calculations.renewal_collection
        distinguishing_aspect: |
          Same entity domain pair as sibling instances but isolating the
          second divergence driver of FORWARD_LOOKING_PERIOD: the `consumed`
          term. Quote and confirm at the SAME clock instant (both floor =
          665c) yet confirm yields 665 - 200 = 465 because an intervening
          MIGRATION_ADJUSTMENT-style renewal consumed 200c of account credit —
          the variants diverge even with zero clock movement.
        test_recipe:
          setup:
            - "PLATFORM subscriber, ACTIVE DPLUS_ADS standalone (799c) created 2026-09-01, account_credit_cents pre-loaded to 200 via a prior confirmed migration at a 1-day clock gap (floor(799*29/30)=772 - floor(799*28/30)=745 = 27c... replaced by direct construction below)"
            - "To keep arithmetic exact: subscription created 2026-09-01; clock 2026-09-06; quote (665c); then a synthetic credit load is achieved by running a second account's confirmed migration — instead this instance uses account credit produced by the trigger setup itself (see chain)"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_PREMIUM", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_FREE", monthly_price_cents: 1999, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_ADS", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 1099, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "dv2@x.com", full_name: "DV Two" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "HULU" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_hulu: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/migrations"
              payload: { from_subscription_id: "${sub_id}", target_plan_code: "DUO_PREMIUM" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { mig_id: $.data.id, mig_v: $.data.version }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/migrations/${mig_id}/confirm"
              payload: { expected_migration_version: "${mig_v}" }
              as: Subscriber
              as_user_id: "${sa_id}"
          assert:
            - "Migration.${mig_id}.proration_credit_cents after confirm == 532 (floor(799*20/30), no consumed credit since no renewal ran)"
            - "Migration.${mig_id}.migration_status == CONFIRMED"
            - "Subscription.${sub_id}.lifecycle_status == MIGRATED_OUT"
            - "SubscriberAccount.${sa_id}.account_credit_cents == 532"

      - name: grandfathered_lock_initial_vs_relock_after_full_churn
        grounds:
          - calculations.grandfathered_price_lock
          - state_machines.Subscription.PENDING_ENTITLEMENT_to_ACTIVE
          - entities.SubscriberAccount.fields.grandfathered_price_cents
        distinguishing_aspect: |
          Entity domain: SubscriberAccount pricing ledger (distinct from
          Migration proration). Initial lock pins 799c; after full churn
          (subscription CANCELLED, all terminal) the relock_after_full_churn
          variant re-locks at the plan's new list price 899c — the two
          variants of the same lock calculation produce different locked
          prices for the same account.
        test_recipe:
          setup:
            - "DPLUS_ADS plan created at 799c, then a second standalone plan DPLUS_ADS_V2 at 899c (same service, higher list price, simulating a price rise)"
            - "Subscriber subscribes to DPLUS_ADS at 2026-09-01 (locks 799c), cancels with immediate_effect, clock advanced past cancel_effective_at so subscription is CANCELLED; then subscribes to DPLUS_ADS_V2"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS_V2", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 899, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "dv3@x.com", full_name: "DV Three" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /streaming/subscriptions/${sub1_id}/cancel"
              payload: { immediate_effect: true }
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS_V2", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub2_id: $.data.id }
          assert:
            - "Subscription.${sub1_id}.lifecycle_status == CANCELLED"
            - "SubscriberAccount.${sa_id}.grandfathered_plan_code == DPLUS_ADS_V2"
            - "SubscriberAccount.${sa_id}.grandfathered_price_cents == 899"
            - "Subscription.${sub2_id}.price_cents == 899"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: retention_price_stacking_cap_and_floor
        grounds:
          - calculations.retention_effective_price
          - entities.Subscription.fields.price_cents
          - entities.Subscription.fields.retention_discount_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction (grandfathered base
          799c, ACTIVE redemption 600c, MAX_DISCOUNT_PCT cap floor(799*60/100)
          =479c, MIN_PRICE_CENTS floor 100c). Raw discount 600 exceeds the cap
          479, and base-cap = 320 stays above the floor — so
          retention_discount_cents == 479 and price_cents == 320, pinning the
          min() branch (cap binds, floor does not).
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DPLUS_ADS standalone (799c, grandfathered 799c)"
            - "RetentionOffer BIGSAVE: discount_cents 600, duration 2, max 1 per account, PLATFORM eligible, STANDALONE eligible"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "cf1@x.com", full_name: "CF One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/retention-offers"
              payload: { offer_code: "BIGSAVE", discount_cents: 600, duration_months: 2, max_redemptions_per_account: 1, eligible_biller_types: ["PLATFORM"], eligible_plan_kinds: ["STANDALONE"] }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/subscriptions/${sub_id}/retention-redemptions"
              payload: { offer_code: "BIGSAVE" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { red_id: $.data.id }
          assert:
            - "Subscription.${sub_id}.retention_discount_cents == 479"
            - "Subscription.${sub_id}.price_cents == 320"
            - "RetentionRedemption.${red_id}.months_remaining == 2"

      - name: revenue_allocation_rounding_remainder_absorption
        grounds:
          - calculations.revenue_allocation
          - entities.RevenueAllocation.fields.allocated_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Bundle net_cents ==
          1099 (DUO_ADS at list price, no credits) split 0.45/0.55:
          per-row round_half_up(1099*0.45)=round_half_up(494.55)=495 for
          DPLUS, and the HULU row absorbs the remainder 1099-495=604 (NOT
          round_half_up(604.45)=604 — they agree here, so the discriminating
          assertion is the sum invariant plus the exact per-row value 495
          which differs from the naive sum-then-round split 494/605).
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DUO_ADS bundle (1099c, weights DPLUS 0.45 / HULU 0.55); the INITIAL invoice of 1099c is PAID at creation"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_ADS", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 1099, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "cf2@x.com", full_name: "CF Two" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "HULU" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_hulu: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DUO_ADS", dplus_service_profile_id: "${prof_dplus}", hulu_service_profile_id: "${prof_hulu}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /streaming/billing-accounts/${ba_id}/invoices"
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "GET /streaming/invoices/${inv_id}/revenue-allocations"
              as: PlatformAdmin
          assert:
            - "RevenueAllocation row service==DPLUS has allocated_cents == 495"
            - "RevenueAllocation row service==HULU has allocated_cents == 604"
            - "sum(RevenueAllocation.allocated_cents for invoice ${inv_id}) == 1099"
            - "count of RevenueAllocation rows == 2"

      - name: grandfathered_lock_evaluation_order_on_activation
        grounds:
          - calculations.grandfathered_price_lock
          - calculations.retention_effective_price
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          price_cents depends on grandfathered_price_cents, which is itself
          locked from the plan list price at activation. If the lock were
          written AFTER the price recompute, the first-activation price would
          be indeterminate; pinned order yields lock 799 THEN price 799, and a
          later retention redemption on the same plan subtracts from the
          LOCKED 799 (not the list price) — observable as price_cents ==
          799-100=699.
        test_recipe:
          setup:
            - "PLATFORM subscriber creates DPLUS_ADS standalone (799c); a retention offer SMALL100 (discount 100c, duration 3, max 1, PLATFORM, STANDALONE) exists; redemption applied AFTER activation/lock"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/retention-offers"
              payload: { offer_code: "SMALL100", discount_cents: 100, duration_months: 3, max_redemptions_per_account: 1, eligible_biller_types: ["PLATFORM"], eligible_plan_kinds: ["STANDALONE"] }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "cf3@x.com", full_name: "CF Three" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /streaming/subscriptions/${sub_id}/retention-redemptions"
              payload: { offer_code: "SMALL100" }
              as: Subscriber
              as_user_id: "${sa_id}"
          assert:
            - "SubscriberAccount.${sa_id}.grandfathered_price_cents == 799"
            - "SubscriberAccount.${sa_id}.grandfathered_plan_code == DPLUS_ADS"
            - "Subscription.${sub_id}.price_cents == 699"
            - "Subscription.${sub_id}.retention_discount_cents == 100"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_parallel_dimensions_diverge
        grounds:
          - state_machines.Subscription.lifecycle_status
          - state_machines.Subscription.billing_dimension
          - entities.Subscription.fields.lifecycle_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (Subscription):
          lifecycle_status and billing_dimension evolve semi-independently. A
          renewal failure moves lifecycle ACTIVE->PAST_DUE AND billing
          PAID_UP->GRACE atomically; a cancel of the past-due subscription
          moves lifecycle PAST_DUE->CANCEL_SCHEDULED while billing_dimension
          STAYS GRACE — observable proof that the dimensions are independent
          axes, not one linear pipeline.
        test_recipe:
          setup:
            - "PLATFORM subscriber, ACTIVE DPLUS_ADS subscription created 2026-09-01; clock advanced to 2026-10-01 (period end, renewal due); renewal run with outcome FAILED"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "nl1@x.com", full_name: "NL One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
