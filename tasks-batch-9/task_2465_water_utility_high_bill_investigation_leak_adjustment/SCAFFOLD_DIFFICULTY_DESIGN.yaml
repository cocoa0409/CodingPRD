      # -------- conserved quantity: metered gallons on the register --------
      - name: compensating_invariant_metered_gallons_conserved_across_correction_and_rebill
        grounds:
          - calculations.read_correction_reallocation
          - state_machines.Bill
          - entities.MeterReading.fields.reading_value
          - entities.Bill.fields.consumption_gallons
          - endpoints[POST /bills/{id}/rebill]
        distinguishing_aspect: |
          CONSERVED QUANTITY: metered gallons on the register, not money — a different invariant on
          a different unit from the receivable instance. After a FAST bench test replaces the
          153000 read with a CORRECTED 152204 and the 2026-07 bill is rebilled, the sum of
          consumption_gallons across the account's four live bills equals the corrected register
          travel exactly: 4000 + 4000 + 4000 + 40204 == 52204 == 152204 - 100000. No gallons are
          created or destroyed by the correction; only their price changes, which is why the
          receivable moves from 60569 to 59754 while the gallon total balances.
        test_recipe:
          setup:
            - "The full ACC-1001 fixture is in place with four ISSUED bills of 4000, 4000, 4000 and 41000 gallons; balance_cents is 60569 and the register travel is 153000 - 100000 == 53000."
            - "An investigation on the 2026-07 bill is in EVIDENCE_REQUESTED with a UTILITY BENCH request (deposit_cents 0) in BENCH_TEST_PENDING."
            - "The 2026-07 period's rebilling_deadline_date is 2027-01-31 and it is still OPEN, so the rebill window is wide open at the 2026-08-01 clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
