            - "Trigger call 3: data.inventory_gallons == 497000, data.days_cover == 4.97, data.supply_posture == \"WATCH\"."
            - "Trigger call 4: data.actual_uplift_gallons == null and data.actual_block_minutes == null."

      - name: uneconomic_tankering_blocked_then_waived_by_approved_exception
        claim_type: conditional_validation
        grounds:
          - validations[priority=24]
          - errors[ERR_TANKERING_NOT_ECONOMIC]
          - calculations.tankering_net_savings_usd
          - entities.PolicyException.fields.tankering_directive_id
          - entities.HedgePolicy.fields.open_exception_count
        distinguishing_aspect: |
          With the price differential reversed (origin ORD 3.1000, destination DFW
          2.4700) the same 3000-gallon uplift is doubly unprofitable: gross savings
          -1890.00 and a penalty cost of 1143.59 give planned_net_savings_usd
          -3033.59. Approval is refused 422 until an APPROVED PolicyException with
          reason_code TANKERING_UNECONOMIC names this directive; because that
          exception carries no hedge_program_id, HedgePolicy.open_exception_count
          never leaves 0.
        test_recipe:
          setup:
            - "Logical clock 2027-02-10; ORD is the origin with all-in price 3.1000 and DFW the destination at 2.4700."
            - "ORD inventory 400000 gallons against 80000 average daily liftings, so supply_posture is WATCH, not SHORT."
            - "One PROPOSED TankeringDirective for 3000 gallons on leg FU500 ORD -> DFW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-TANK", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 80000 }
              as: RiskPolicyAdmin
              captures: { st_ord: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000 }
              as: RiskPolicyAdmin
              captures: { st_dfw: $.data.id }
            - call: "POST /fuel/stations/${st_ord}/supply-contracts"
              payload: { contract_ref: "ORD-2027", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.9000, differential_usd_per_gal: 0.1200, term_start_date: "2027-01-01", term_end_date: "2027-12-31", min_monthly_gallons: 0, max_monthly_gallons: 5000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${st_dfw}/supply-contracts"
              payload: { contract_ref: "DFW-2027", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-12-31", min_monthly_gallons: 0, max_monthly_gallons: 5000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${st_ord}/inventory-adjustments"
              payload: { delta_gallons: 400000, reason: "Opening physical stock at the origin station." }
              as: FuelOpsController
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "FU500", departure_date: "2027-02-10", origin_station_id: "${st_ord}", destination_station_id: "${st_dfw}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 15000, tank_capacity_gallons: 26500, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 130000, max_landing_weight_lbs: 205000 }
              as: FuelOpsController
              captures: { leg_u: $.data.id, leg_v: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_u}/tankering-directives"
              payload: { requested_uplift_gallons: 3000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { dir_id: $.data.id }
          trigger:
            - call: "POST /fuel/tankering-directives/${dir_id}/approve"
              payload: {}
              as: FuelOpsController
              as_user_id: u_ops_1
              captures: { err: $.data.error_id }
            - call: "POST /fuel/policy-exceptions"
              payload: { reason_code: "TANKERING_UNECONOMIC", justification: "Uplift required to protect a downline fuel shortage at the destination station.", tankering_directive_id: "${dir_id}", requested_limit_value: -3033.59 }
              as: FuelOpsController
              as_user_id: u_ops_1
              captures: { exc_id: $.data.id }
            - call: "POST /fuel/policy-exceptions/${exc_id}/approve"
              payload: { decision_note: "Operational necessity accepted; cost booked to the network resilience budget." }
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
            - call: "POST /fuel/tankering-directives/${dir_id}/approve"
              payload: {}
              as: FuelOpsController
              as_user_id: u_ops_1
            - call: "GET /fuel/hedge-policies/${policy_id}"
              payload: {}
              as: RiskPolicyAdmin
          assert:
            - "Trigger call 1: HTTP 422 and data.error_id == \"ERR_TANKERING_NOT_ECONOMIC\"."
            - "Trigger call 2: HTTP 201, data.status == \"REQUESTED\", data.hedge_program_id == null, data.tankering_directive_id == ${dir_id}."
            - "Trigger call 3: HTTP 200 and data.status == \"APPROVED\"."
            - "Trigger call 4: HTTP 200, data.status == \"APPROVED\", data.approved_by_user_id == \"u_ops_1\"."
            - "Trigger call 4: data.planned_burn_penalty_gallons == 368.9, data.planned_gross_savings_usd == -1890.00, data.planned_penalty_cost_usd == 1143.59, data.planned_net_savings_usd == -3033.59."
            - "Trigger call 4: data.pinned_origin_price_usd_per_gal == 3.1000, data.pinned_destination_price_usd_per_gal == 2.4700, data.pinned_origin_contract_ref == \"ORD-2027\"."
            - "Trigger call 5: data.open_exception_count == 0 throughout, because the waiver references no hedge_program_id."

      - name: state_gate_outranks_fiscal_gate_on_execute
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=20]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / program_state_gate_beats_coverage_ceiling_on_execute
          rationale: "The named §1.8 instance co-violates the state gate and the coverage ceiling and asserts the priority-7 error wins."

      - name: execute_depends_on_counterparty_status
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_COUNTERPARTY_NOT_APPROVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / execute_blocked_by_suspended_counterparty
          rationale: "The named §1.8 instance suspends the counterparty through the credit-review endpoint and asserts both the blocked and the restored execution."

      - name: supply_contract_temporal_conflict_detection
        claim_type: temporal_validation
        grounds:
          - validations[priority=12]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / supply_contract_closed_interval_with_changeover_buffer
          rationale: "The named §1.8 instance asserts the closed-interval overlap and the 6-versus-7-day changeover buffer on the same station."

      - name: coverage_ceiling_is_an_aggregate_over_executed_trades
        claim_type: aggregate_validation
        grounds:
          - validations[priority=20]
          - calculations.hedge_coverage_ratio
        excluded_because:
          difficulty_instance: boundary_precision_check / coverage_ceiling_exact_equality_versus_one_gallon_epsilon
          rationale: "The named §1.8 instance drives the portfolio to exactly 60.00 percent and then one gallon past it."

      - name: weight_check_runs_before_contract_check_on_approve
        claim_type: cascading_validation
        grounds:
          - validations[priority=9]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / weight_limit_beats_missing_active_contract_on_directive_approve
          rationale: "The named §1.8 instance co-violates both rows and asserts the priority-9 error surfaces."

      - name: economic_tankering_passes_every_gate
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=24]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: dual_variant_calc / tankering_planned_basis_vs_reconciled_basis
          rationale: "The named §1.8 instance walks a profitable directive through approve, execute and reconcile, so every tankering gate is asserted as satisfied."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: reject_directive_pins_no_prices_and_moves_no_fuel
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /fuel/tankering-directives/{id}/reject]
          - state_machines.TankeringDirective.transitions
          - entities.TankeringDirective.fields.pinned_origin_price_usd_per_gal
          - entities.Station.fields.inventory_gallons
        distinguishing_aspect: |
          /reject is the one exit from PROPOSED that neither pins prices nor touches
          fuel: status becomes REJECTED with approved_by_user_id null, all three
          pinned_* fields still null, and the origin station's inventory_gallons stays
          at 500000 with days_cover 5.00 — the planned figures computed at creation
          remain readable for the audit trail.
        test_recipe:
          setup:
            - "Logical clock 2027-02-10; ACTIVE contracts at DFW (2.4700) and ORD (3.1000); DFW inventory 500000."
            - "One PROPOSED TankeringDirective for 3000 gallons on leg FA100 DFW -> ORD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-TANK", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000 }
              as: RiskPolicyAdmin
              captures: { st_dfw: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 80000 }
              as: RiskPolicyAdmin
              captures: { st_ord: $.data.id }
            - call: "POST /fuel/stations/${st_dfw}/supply-contracts"
              payload: { contract_ref: "DFW-2027", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-12-31", min_monthly_gallons: 0, max_monthly_gallons: 5000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${st_ord}/supply-contracts"
              payload: { contract_ref: "ORD-2027", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.9000, differential_usd_per_gal: 0.1200, term_start_date: "2027-01-01", term_end_date: "2027-12-31", min_monthly_gallons: 0, max_monthly_gallons: 5000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${st_dfw}/inventory-adjustments"
              payload: { delta_gallons: 500000, reason: "Opening physical stock for the February tankering window." }
              as: FuelOpsController
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "FA100", departure_date: "2027-02-10", origin_station_id: "${st_dfw}", destination_station_id: "${st_ord}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 15000, tank_capacity_gallons: 26500, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 130000, max_landing_weight_lbs: 205000 }
              as: FuelOpsController
              captures: { leg_a: $.data.id, leg_v: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_a}/tankering-directives"
              payload: { requested_uplift_gallons: 3000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { dir_id: $.data.id }
          trigger:
            - call: "POST /fuel/tankering-directives/${dir_id}/reject"
              payload: { reject_reason: "Downline aircraft swap removed the tankering opportunity." }
              as: FuelOpsController
              as_user_id: u_ops_1
            - call: "GET /fuel/stations/${st_dfw}"
              payload: {}
              as: FuelOpsController
            - call: "GET /fuel/flight-legs/${leg_a}/tankering-directives"
              payload: { status: "REJECTED" }
              as: FuelOpsController
            - call: "GET /fuel/stations/${st_dfw}/supply-contracts"
              payload: { status: "ACTIVE" }
              as: FuelOpsController
          assert:
            - "Trigger call 1: HTTP 200, data.status == \"REJECTED\", data.approved_by_user_id == null, data.revision_count == 0."
            - "Trigger call 1: data.pinned_origin_price_usd_per_gal == null, data.pinned_destination_price_usd_per_gal == null, data.pinned_origin_contract_ref == null."
            - "Trigger call 1: data.planned_burn_penalty_gallons == 368.9 and data.planned_net_savings_usd == 978.82 remain readable from creation."
            - "Trigger call 2: data.inventory_gallons == 500000, data.days_cover == 5.00, data.supply_posture == \"WATCH\"."
            - "Trigger call 3: len(data) == 1 and meta.total_count == 1."
            - "Trigger call 4: len(data) == 1, data[0].contract_ref == \"DFW-2027\", data[0].all_in_price_usd_per_gal == 2.4700 - the rejection did not disturb the pricing source."

      - name: mtm_publish_before_compute_returns_409_then_succeeds_after_compute
        claim_type: conditional_action
        grounds:
          - endpoints[POST /fuel/mark-to-market-runs/{id}/publish]
          - state_machines.MarkToMarketRun.transitions
          - errors[ERR_MTM_RUN_INVALID_STATE]
        distinguishing_aspect: |
          Publication is conditional on the run already being COMPUTED: from OPEN it
          is refused 409 ERR_MTM_RUN_INVALID_STATE with published_at still null, and
          the identical call succeeds once /compute has run. An empty portfolio is a
          legitimate COMPUTED run — instrument_count 0 and all three totals 0.00 —
          so the gate is the status, not the presence of trades.
        test_recipe:
          setup:
            - "One OPEN MarkToMarketRun for 2027-02 at settlement index 2.7500 and no EXECUTED instruments."
          setup_api_calls:
            - call: "POST /fuel/mark-to-market-runs"
              payload: { period_month: "2027-02", settlement_index_usd_per_gal: 2.7500 }
              as: HedgeAccountant
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /fuel/mark-to-market-runs/${run_id}/publish"
              payload: {}
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
              captures: { err: $.data.error_id }
            - call: "GET /fuel/mark-to-market-runs/${run_id}"
              payload: {}
              as: HedgeAccountant
            - call: "POST /fuel/mark-to-market-runs/${run_id}/compute"
              payload: {}
              as: HedgeAccountant
            - call: "POST /fuel/mark-to-market-runs/${run_id}/publish"
              payload: {}
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
          assert:
            - "Trigger call 1: HTTP 409 and data.error_id == \"ERR_MTM_RUN_INVALID_STATE\"."
            - "Trigger call 2: data.status == \"OPEN\", data.published_at == null, data.computed_at == null, data.version == 1."
            - "Trigger call 3: HTTP 200, data.status == \"COMPUTED\", data.instrument_count == 0, data.total_mtm_usd == 0.00, data.designated_mtm_usd == 0.00, data.undesignated_mtm_usd == 0.00."
            - "Trigger call 4: HTTP 200, data.status == \"PUBLISHED\", data.margin_calls_created == 0, data.settled_instrument_count == 0, data.published_at is non-null."

      - name: collateral_posting_links_counterparty_from_path_and_instrument_from_body
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /fuel/counterparties/{id}/collateral-postings]
          - endpoints[GET /fuel/hedge-instruments/{id}/collateral-postings]
          - entities.CollateralPosting.fields.counterparty_id
          - entities.CollateralPosting.fields.required_amount_usd
          - validations[priority=5]
        distinguishing_aspect: |
          The posting joins two parents from two different places: counterparty_id
          comes from the path and hedge_instrument_id from the body, and an unknown
          body FK is a priority-5 404 ERR_INSTRUMENT_NOT_FOUND. Against a PROPOSED
          trade the frozen required_amount_usd is max(0, 0 - 0) = 0.00, and the one
          row is reachable from both parents' sub-resource lists.
        test_recipe:
          setup:
            - "One SIZING HedgeProgram with a PROPOSED 1000000-gallon SWAP and one APPROVED Counterparty at version 1."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRC", legal_name: "Dealer C Bank NA", credit_rating: "A", credit_limit_usd: 2000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_id: $.data.id, cp_v: $.data.version }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_id}", instrument_type: "SWAP", notional_gallons: 1000000, maturity_month: "2027-03", expected_hedge_program_version: "${prog_v}", strike_usd_per_gal: 2.5000 }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /fuel/counterparties/${cp_id}/collateral-postings"
              payload: { hedge_instrument_id: "0d5a7e13-9c48-4b62-8f10-2a6c4d9e7b35", collateral_type: "CASH", expected_counterparty_version: "${cp_v}" }
              as: RiskPolicyAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fuel/counterparties/${cp_id}/collateral-postings"
              payload: { hedge_instrument_id: "${inst_id}", collateral_type: "CASH", expected_counterparty_version: "${cp_v}" }
              as: RiskPolicyAdmin
              captures: { post_id: $.data.id }
            - call: "GET /fuel/hedge-instruments/${inst_id}/collateral-postings"
              payload: { status: "REQUIRED" }
              as: TreasuryRiskManager
            - call: "GET /fuel/counterparties/${cp_id}/collateral-postings"
              payload: { origin: "MANUAL" }
              as: TreasuryRiskManager
          assert:
            - "Trigger call 1: HTTP 404 and data.error_id == \"ERR_INSTRUMENT_NOT_FOUND\" (priority-5 body FK check; the path counterparty resolved)."
            - "Trigger call 2: HTTP 201, data.counterparty_id == ${cp_id}, data.hedge_instrument_id == ${inst_id}, data.status == \"REQUIRED\", data.origin == \"MANUAL\", data.required_amount_usd == 0.00, data.posted_amount_usd == 0."
            - "Trigger call 3: len(data) == 1, meta.total_count == 1, data[0].id == ${post_id}."
            - "Trigger call 4: len(data) == 1, meta.total_count == 1, data[0].id == ${post_id}."

      - name: uplift_cap_read_follows_the_active_policy_after_supersession
        claim_type: computed_read
        grounds:
