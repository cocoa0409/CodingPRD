  - section: endpoints
    instances:
      - name: downstream_segments_lists_only_the_direct_successor
        claim_type: Cross-reference link
        grounds:
          - endpoints[GET /segments/{id}/downstream-segments]
          - entities.RouteSegment.fields.predecessor_segment_id
        distinguishing_aspect: "The reverse lookup on predecessor_segment_id is one hop deep, so on a three-segment chain segment 1 lists only segment 2 — never the transitively reachable segment 3 — and the chain tail lists nothing."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' in PLANNING with three RouteSegments forming a chain: sequence_index 1 with predecessor_segment_id null, sequence_index 2 whose predecessor is segment 1, sequence_index 3 whose predecessor is segment 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg1_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 2, street_name: "Orchard Road", municipality_code: "MUN-014", length_feet: 300, terrain_class: "RURAL_SHOULDER", predecessor_segment_id: "${seg1_id}", planned_work_start_on: "2026-09-21", planned_work_end_on: "2026-09-25" }
              as: RouteEngineer
              captures: { seg2_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 3, street_name: "Mill Way", municipality_code: "MUN-014", length_feet: 250, terrain_class: "URBAN_UNPAVED", predecessor_segment_id: "${seg2_id}", planned_work_start_on: "2026-09-26", planned_work_end_on: "2026-09-30" }
