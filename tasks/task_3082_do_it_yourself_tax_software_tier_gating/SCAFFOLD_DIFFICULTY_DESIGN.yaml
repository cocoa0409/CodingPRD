              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "prio1@x.com", full_name: "Prio One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
