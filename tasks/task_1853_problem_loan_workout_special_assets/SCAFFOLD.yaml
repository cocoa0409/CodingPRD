# =============================================================================
# SCAFFOLD.yaml — Task 1853: Problem Loan Workout & Special Assets
# Bank special assets group: watchlist entry, borrower negotiation, TDR
# determination, collateral revaluation & impairment, guarantor pursuit,
# foreclosure vs deed-in-lieu, charge-off & recovery, exit & reporting.
# =============================================================================

scenario: |
  1853. Problem Loan Workout & Special Assets (bank special assets group):
  watchlist entry criteria & action plan, borrower negotiation
  (forbearance/modification/restructure), troubled-debt determination &
  accounting treatment, collateral revaluation & impairment measurement,
  guarantor pursuit & legal referral, foreclosure vs deed-in-lieu decision,
  charge-off timing & recovery tracking, exit strategy & portfolio reporting

domain_name: problem-loan-workout
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Borrower legal name" }
      - { name: tax_id, type: string, source: input, description: "Borrower tax identification number; unique across borrowers" }
      - { name: naics_code, type: string, source: input, description: "Industry classification code" }
      - { name: internal_risk_rating, type: integer, source: input, description: "1 (best) .. 10 (worst) internal risk rating at onboarding" }
      - { name: guarantor_name, type: string, source: input, description: "Primary guarantor legal name (empty string when no guarantor)", default: "" }
      - { name: guarantor_net_worth_cents, type: integer, source: input, description: "Guarantor certified net worth in cents (0 when no guarantor)", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXITED", constraints: "ACTIVE on creation; EXITED when all workout cases reach a terminal state" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; obligor of this loan" }
      - { name: loan_number, type: string, source: input, description: "Servicing system loan number; unique" }
      - { name: original_principal_cents, type: integer, source: input, description: "Original commitment amount in cents" }
      - { name: current_principal_cents, type: integer, source: computed, description: "Original principal minus cumulative applied principal payments and charge-offs; recomputed on every ChargeOffEvent and principal RecoveryEvent" }
      - { name: contractual_rate_bps, type: integer, source: input, description: "Contract annual interest rate in basis points" }
      - { name: days_past_due, type: integer, source: input, description: "Days past due as of case entry; updated only via POST /loans/{id}/aging-refresh" }
      - { name: is_tdr, type: boolean, source: computed, default: false, description: "True once any RestructureProposal on this loan is CONSUMMATED with tdr_flag true; stays true until loan payoff" }
      - { name: nonaccrual, type: boolean, source: computed, default: false, description: "True when days_past_due >= NONACCRUAL_DPD (90) at aging refresh or when a case enters LEGAL; false again only when days_past_due < NONACCRUAL_DPD and case exits LEGAL" }
      - { name: charged_off_principal_cents, type: integer, source: computed, default: 0, description: "Cumulative principal charged off across all ChargeOffEvents" }
      - { name: status, type: enum, source: system, description: "PERFORMING | WATCHLIST | WORKOUT | FORECLOSURE | RESOLVED", constraints: "PERFORMING on creation" }

  - name: WorkoutCase
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan under workout" }
      - { name: entry_trigger, type: enum, source: input, description: "DELINQUENCY_60 | RISK_RATING_DOWNGRADE | COVENANT_DEFAULT | MANUAL_REFERRAL", constraints: "entry criteria used" }
      - { name: risk_rating_at_entry, type: integer, source: input, description: "Borrower risk rating snapshot at case entry (1..10); must be >= 6 when entry_trigger is RISK_RATING_DOWNGRADE" }
      - { name: case_officer_id, type: string, source: input, description: "X-User-ID of the WorkoutOfficer who owns negotiation steps; segregation-of-duties anchor" }
      - { name: loss_given_default_cents, type: integer, source: computed, default: 0, description: "max(0, loan.current_principal_cents - aggregate collateral liquidation value) recomputed on every appraisal acceptance, charge-off, and principal recovery" }
      - { name: impairment_reserve_cents, type: integer, source: computed, default: 0, description: "Reserve held for the ACTIVE impairment method (CECL or TDR discounted cash flow); recomputed by impairment measurement" }
      - { name: tdr_status, type: enum, source: system, default: "NOT_EVALUATED", description: "NOT_EVALUATED | PENDING_EVALUATION | TDR_CONFIRMED | TDR_REJECTED" }
      - { name: unapplied_cash_cents, type: integer, source: computed, default: 0, description: "Recovery proceeds exceeding both charged-off and current principal buckets accumulate here (recovery_allocation excess)" }
      - { name: resolution_path, type: enum, source: system, default: "NONE", description: "NONE | FORECLOSURE | DEED_IN_LIEU | NOTE_SALE | RETURN_TO_PERFORMING" }
      - { name: status, type: enum, source: system, description: "WATCHLIST | ACTION_PLAN | NEGOTIATION | IMPAIRMENT_REVIEW | LEGAL | RESOLUTION | CLOSED", constraints: "terminal CLOSED" }
      - { name: version_anchor, type: integer, source: computed, description: "Duplicate of version exposed for clients; always equals version" }

  - name: ActionPlan
    parent: WorkoutCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id" }
      - { name: plan_text, type: string, source: input, description: "Narrative workout strategy" }
      - { name: target_resolution_date, type: datetime, source: input, description: "ISO date the plan aims to resolve the case by; must be strictly after current logical clock time" }
      - { name: milestone_count, type: integer, source: input, description: "Number of milestones in the plan; must be >= 1" }
      - { name: supersedes_plan_id, type: string, source: input, description: "FK -> ActionPlan.id; previous plan on this case being superseded (empty string for the first plan)", default: "" }
      - { name: approval_round, type: integer, source: computed, default: 0, description: "Increments on each SUBMITTED -> APPROVED/REJECTED cycle of this plan" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED", constraints: "DRAFT on creation" }

  - name: RestructureProposal
    parent: WorkoutCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id" }
      - { name: proposal_kind, type: enum, source: input, description: "FORBEARANCE | MODIFICATION | RESTRUCTURE" }
      - { name: concession_rate_bps, type: integer, source: input, description: "Proposed new rate in basis points; must be < loan.contractual_rate_bps to count as a concession" }
      - { name: term_extension_months, type: integer, source: input, description: "Months added to maturity (0 allowed)" }
      - { name: principal_forgiveness_cents, type: integer, source: input, description: "Principal to be forgiven at consummation (0 allowed)" }
      - { name: borrower_concession_cents, type: integer, source: input, description: "Borrower cash or equity contribution offered (0 allowed)" }
      - { name: tdr_flag, type: boolean, source: computed, description: "Computed at consummation: true when the bank grants a concession (concession_rate_bps < contractual rate OR principal_forgiveness_cents > 0) to a borrower in financial difficulty (case risk_rating_at_entry >= 6 OR loan.days_past_due >= 60)" }
      - { name: negotiation_round, type: integer, source: computed, default: 1, description: "1 for the first proposal on the case; each COUNTERED -> RESUBMITTED cycle increments by 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_BORROWER_REVIEW | COUNTERED | RESUBMITTED | COMMITTEE_REVIEW | APPROVED | CONSUMMATED | REJECTED | WITHDRAWN", constraints: "terminal APPROVED is not terminal; CONSUMMATED/REJECTED/WITHDRAWN terminal" }

  - name: CollateralItem
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan this collateral secures" }
      - { name: collateral_type, type: enum, source: input, description: "CRE_REAL_ESTATE | EQUIPMENT | INVENTORY | RECEIVABLES | SECURITIES" }
      - { name: description, type: string, source: input, description: "Collateral description" }
      - { name: liquidation_discount_bps, type: integer, source: input, description: "Haircut in basis points applied to appraised value to obtain liquidation value; must be in [0, 9000]" }
      - { name: current_appraised_value_cents, type: integer, source: computed, default: 0, description: "Appraised value of the latest ACCEPTED appraisal; 0 until first acceptance" }
      - { name: current_liquidation_value_cents, type: integer, source: computed, default: 0, description: "current_appraised_value_cents * (10000 - liquidation_discount_bps) / 10000 rounded half-up; recomputed on appraisal acceptance" }
      - { name: status, type: enum, source: system, description: "PLEDGED | UNDER_REVALUATION | RELEASED | LIQUIDATED", constraints: "PLEDGED on creation" }

  - name: CollateralAppraisal
    parent: CollateralItem
    common_fields: true
    fields:
      - { name: collateral_id, type: string, source: system, description: "FK -> CollateralItem.id" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraiser's concluded value in cents; must be > 0" }
      - { name: effective_date, type: datetime, source: input, description: "Valuation effective date; must be <= current logical clock time" }
      - { name: appraiser_id, type: string, source: input, description: "X-User-ID of the AppraisalDesk user ordering/reviewing; segregation-of-duties anchor" }
      - { name: staleness_days, type: integer, source: computed, description: "Days between effective_date and logical clock at review time; > STALE_APPRAISAL_DAYS (365) blocks acceptance" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED", constraints: "DRAFT on creation" }

  - name: ImpairmentAssessment
    parent: WorkoutCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id" }
      - { name: method, type: enum, source: input, description: "CECL | TDR_DCF", constraints: "CECL allowed always when case in IMPAIRMENT_REVIEW; TDR_DCF allowed only when case.tdr_status == TDR_CONFIRMED" }
      - { name: probability_of_default_bps, type: integer, source: input, description: "CECL input: PD in basis points [1, 10000]" }
      - { name: loss_given_default_bps, type: integer, source: input, description: "CECL input: LGD in basis points [0, 10000]" }
      - { name: expected_cash_flows, type: array, source: input, description: "TDR_DCF input: array of { period_index (integer >= 1), amount_cents (integer >= 0) } sorted by period_index ascending; empty array forbidden for TDR_DCF" }
      - { name: computed_reserve_cents, type: integer, source: computed, description: "CECL: current_principal * PD * LGD / 10^8 rounded half-up. TDR_DCF: current_principal - discounted sum of expected_cash_flows at the loan's ORIGINAL contractual rate (not the concession rate), floored at 0" }
      - { name: is_active, type: boolean, source: computed, default: false, description: "Exactly one assessment per case is active at a time — the latest one to reach FINALIZED; earlier FINALIZED assessments flip to is_active=false" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED", constraints: "DRAFT on creation" }

  - name: LegalReferral
    parent: WorkoutCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id" }
      - { name: referral_kind, type: enum, source: input, description: "GUARANTOR_PURSUITS | FORECLOSURE | DEED_IN_LIEU | NOTE_SALE_PREP" }
      - { name: target_guarantor_name, type: string, source: input, description: "Guarantor pursued; required non-empty when referral_kind == GUARANTOR_PURSUITS, ignored otherwise", default: "" }
      - { name: demand_amount_cents, type: integer, source: input, description: "Amount demanded from guarantor; must be <= borrower.guarantor_net_worth_cents and <= case.loss_given_default_cents" }
      - { name: statute_deadline, type: datetime, source: input, description: "Statute-of-limitations deadline; must be strictly after current logical clock time" }
      - { name: decision_rationale, type: string, source: input, description: "Required when referral_kind is FORECLOSURE or DEED_IN_LIEU: documented foreclosure-vs-deed-in-lieu analysis", default: "" }
      - { name: status, type: enum, source: system, description: "PENDING_COUNSEL | ACTIVE | SETTLED | DISMISSED", constraints: "PENDING_COUNSEL on creation" }

  - name: ChargeOffEvent
    parent: WorkoutCase
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id" }
      - { name: amount_cents, type: integer, source: input, description: "Principal charged off; must be > 0 and <= loan.current_principal_cents at booking time" }
      - { name: reason_code, type: enum, source: input, description: "CONFIRMED_LOSS | STATUTORY | PARTIAL_IMPAIRMENT" }
      - { name: booked_at, type: datetime, source: system, description: "Logical clock timestamp when booked" }
      - { name: is_partial, type: boolean, source: computed, description: "True when amount_cents < loan.current_principal_cents at booking" }

  - name: RecoveryEvent
    parent: WorkoutCase
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id" }
      - { name: amount_cents, type: integer, source: input, description: "Cash recovered; must be > 0" }
      - { name: recovery_source, type: enum, source: input, description: "GUARANTOR_SETTLEMENT | COLLATERAL_LIQUIDATION | BORROWER_CURE | NOTE_SALE_PROCEEDS" }
      - { name: allocation_mode, type: enum, source: input, description: "CHRONOLOGICAL (apply to charged-off principal first, then current principal) | WATERFALL (costs tier first 10%, then charged-off principal, then current principal)", constraints: "two allocation variants — see calculations.recovery_allocation" }
      - { name: booked_at, type: datetime, source: system, description: "Logical clock timestamp when booked" }

  - name: ExitStrategyDecision
    parent: WorkoutCase
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id" }
      - { name: chosen_path, type: enum, source: input, description: "FORECLOSURE | DEED_IN_LIEU | NOTE_SALE | RETURN_TO_PERFORMING" }
      - { name: npv_foreclosure_cents, type: integer, source: input, description: "Analyst NPV of foreclosure path" }
      - { name: npv_deed_in_lieu_cents, type: integer, source: input, description: "Analyst NPV of deed-in-lieu path" }
      - { name: decision_rule_outcome, type: string, source: computed, description: "Computed explanation: chosen_path must equal the argmax of the two NPVs unless documented override is supplied; ties (npv_foreclosure_cents == npv_deed_in_lieu_cents) MUST resolve to DEED_IN_LIEU" }
      - { name: override_justification, type: string, source: input, description: "Required non-empty when chosen_path is not the computed argmax", default: "" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock timestamp when decided" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Borrower
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: EXITED
        trigger: "system (automatic when the borrower's last non-CLOSED WorkoutCase transitions to CLOSED)"
        actor: system
        preconditions:
          - "All WorkoutCase rows on all of this borrower's loans are CLOSED"
        side_effects:
          - "None (reporting only)"

  - entity: Loan
    initial_state: PERFORMING
    terminal_states: [RESOLVED]
    transitions:
      - from: PERFORMING
        to: WATCHLIST
        trigger: "POST /loans/{loanId}/workout-cases (case creation)"
        actor: WorkoutOfficer
        preconditions:
          - "Loan must be PERFORMING (ERR_LOAN_NOT_PERFORMING)"
        side_effects:
          - "Loan.status → WATCHLIST"

      - from: WATCHLIST
        to: WORKOUT
        trigger: "system (automatic when the case's first ActionPlan reaches APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Loan.status → WORKOUT"

      - from: WORKOUT
        to: FORECLOSURE
        trigger: "system (automatic when an ExitStrategyDecision with chosen_path FORECLOSURE or DEED_IN_LIEU is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "Loan.status → FORECLOSURE"
          - "Loan.nonaccrual → true (legal action forces nonaccrual regardless of days_past_due)"

      - from: WATCHLIST
        to: RESOLVED
        trigger: "system (automatic when the case closes with resolution_path RETURN_TO_PERFORMING)"
        actor: system
        preconditions: []
        side_effects:
          - "Loan.status → PERFORMING via RESOLVED bookkeeping is NOT taken: WATCHLIST loans return to PERFORMING only through the case-close transition on WorkoutCase (see WorkoutCase RESOLUTION→CLOSED)"
          - "Loan.status → PERFORMING"

      - from: WORKOUT
        to: RESOLVED
        trigger: "system (automatic when the case reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Loan.status → RESOLVED unless resolution_path == RETURN_TO_PERFORMING, in which case Loan.status → PERFORMING"

      - from: FORECLOSURE
        to: RESOLVED
        trigger: "system (automatic when the case reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Loan.status → RESOLVED"

  - entity: WorkoutCase
    initial_state: WATCHLIST
    terminal_states: [CLOSED]
    transitions:
      - from: WATCHLIST
        to: ACTION_PLAN
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/action-plans (first plan created)"
        actor: WorkoutOfficer
        preconditions:
          - "Case must be WATCHLIST (ERR_CASE_NOT_WATCHLIST)"
          - "Acting WorkoutOfficer must be the case_officer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Case.status → ACTION_PLAN"

      - from: ACTION_PLAN
        to: NEGOTIATION
        trigger: "system (automatic when an ActionPlan on this case reaches APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Case.status → NEGOTIATION"
          - "Case.tdr_status → PENDING_EVALUATION"
          - "Loan.status → WORKOUT"

      - from: NEGOTIATION
        to: IMPAIRMENT_REVIEW
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/consummate"
        actor: WorkoutOfficer
        preconditions:
          - "Case must be NEGOTIATION (ERR_CASE_NOT_NEGOTIATION)"
          - "Proposal must be APPROVED (ERR_PROPOSAL_NOT_APPROVED)"
        side_effects:
          - "Case.status → IMPAIRMENT_REVIEW"
          - "Proposal.tdr_flag computed (concession granted AND borrower in difficulty)"
          - "If tdr_flag: Loan.is_tdr → true and Case.tdr_status → TDR_CONFIRMED; else Case.tdr_status → TDR_REJECTED"
          - "If principal_forgiveness_cents > 0: system books a ChargeOffEvent with reason_code PARTIAL_IMPAIRMENT for principal_forgiveness_cents (which itself cascades: Loan.current_principal_cents decreases, Loan.charged_off_principal_cents increases, Case.loss_given_default_cents recomputed)"

      - from: NEGOTIATION
        to: LEGAL
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/legal-referrals"
        actor: WorkoutOfficer
        preconditions:
          - "Case must be NEGOTIATION or IMPAIRMENT_REVIEW (ERR_CASE_NOT_REFERRABLE)"
        side_effects:
          - "Case.status → LEGAL"
          - "Loan.nonaccrual → true"

      - from: IMPAIRMENT_REVIEW
        to: LEGAL
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/legal-referrals"
        actor: WorkoutOfficer
        preconditions:
          - "Case must be NEGOTIATION or IMPAIRMENT_REVIEW (ERR_CASE_NOT_REFERRABLE)"
        side_effects:
          - "Case.status → LEGAL"
          - "Loan.nonaccrual → true"

      - from: IMPAIRMENT_REVIEW
        to: NEGOTIATION
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals (a new proposal cycle restarts negotiation)"
        actor: WorkoutOfficer
        preconditions:
          - "Case must be NEGOTIATION or IMPAIRMENT_REVIEW (ERR_CASE_NOT_NEGOTIABLE)"
        side_effects:
          - "Case.status → NEGOTIATION (cycle: impairment findings feed new terms)"

      - from: LEGAL
        to: RESOLUTION
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/exit-decision"
        actor: SpecialAssetsManager
        preconditions:
          - "Case must be LEGAL (ERR_CASE_NOT_LEGAL)"
          - "At least one LegalReferral on the case must be ACTIVE or SETTLED (ERR_NO_ACTIVE_REFERRAL)"
        side_effects:
          - "Case.status → RESOLUTION"
          - "Case.resolution_path → chosen_path"
          - "If chosen_path is FORECLOSURE or DEED_IN_LIEU: Loan.status → FORECLOSURE"

      - from: NEGOTIATION
        to: RESOLUTION
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/exit-decision"
        actor: SpecialAssetsManager
        preconditions:
          - "Case must be NEGOTIATION with at least one CONSUMMATED proposal (ERR_CASE_NOT_LEGAL unless consummated; ERR_NO_ACTIVE_REFERRAL waived for NEGOTIATION path)"
        side_effects:
          - "Case.status → RESOLUTION"
          - "Case.resolution_path → chosen_path (only RETURN_TO_PERFORMING or NOTE_SALE permitted from NEGOTIATION; FORECLOSURE/DEED_IN_LIEU from NEGOTIATION → ERR_PATH_REQUIRES_LEGAL)"

      - from: RESOLUTION
        to: CLOSED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/close"
        actor: SpecialAssetsManager
        preconditions:
          - "Case must be RESOLUTION (ERR_CASE_NOT_RESOLUTION)"
          - "All LegalReferral rows on the case must be SETTLED or DISMISSED (ERR_OPEN_REFERRALS_EXIST)"
          - "If resolution_path == RETURN_TO_PERFORMING: loan.days_past_due must be < 60 and loan.current_principal_cents must be > 0 (ERR_CURE_NOT_ESTABLISHED)"
        side_effects:
          - "Case.status → CLOSED"
          - "Loan.status → RESOLVED (or PERFORMING when resolution_path == RETURN_TO_PERFORMING)"
          - "If this was the borrower's last non-CLOSED case: Borrower.status → EXITED"

  - entity: ActionPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/submit"
        actor: WorkoutOfficer
        preconditions:
          - "Plan must be DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "Acting WorkoutOfficer must be the case's case_officer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/approve"
        actor: SpecialAssetsManager
        preconditions:
          - "Plan must be SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
          - "Approver must NOT be the case_officer_id (segregation of duties: submitter ≠ approver → ERR_SEGREGATION_OF_DUTIES)"
          - "No other ActionPlan on the case may be APPROVED (ERR_ACTIVE_PLAN_EXISTS)"
        side_effects:
          - "Plan.approval_round += 1"
          - "Case.status → NEGOTIATION (first approval)"
          - "Case.tdr_status → PENDING_EVALUATION"
          - "Loan.status → WORKOUT"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/reject"
        actor: SpecialAssetsManager
        preconditions:
          - "Plan must be SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
        side_effects:
          - "Plan.approval_round += 1"
          - "Case remains ACTION_PLAN (a new plan may be drafted)"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/revise"
        actor: WorkoutOfficer
        preconditions:
          - "Plan must be REJECTED (ERR_PLAN_NOT_REJECTED)"
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a newer ActionPlan on the same case is created with supersedes_plan_id == this plan and then APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Old plan → SUPERSEDED; the newer plan carries forward"

  - entity: RestructureProposal
    initial_state: DRAFT
    terminal_states: [CONSUMMATED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/submit"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be DRAFT (ERR_PROPOSAL_NOT_DRAFT)"
        side_effects: []

      - from: SUBMITTED
        to: UNDER_BORROWER_REVIEW
        trigger: "system (automatic on submit; package is presented to borrower)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_BORROWER_REVIEW
        to: COUNTERED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/counter"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be UNDER_BORROWER_REVIEW (ERR_PROPOSAL_NOT_UNDER_REVIEW)"
          - "Counter terms must differ in at least one of concession_rate_bps, term_extension_months, principal_forgiveness_cents, borrower_concession_cents (ERR_COUNTER_NOT_MATERIAL)"
        side_effects:
          - "Counter terms replace the proposal's term fields in place"

      - from: COUNTERED
        to: RESUBMITTED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/resubmit"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be COUNTERED (ERR_PROPOSAL_NOT_COUNTERED)"
        side_effects:
          - "Proposal.negotiation_round += 1 (cyclic negotiation)"

      - from: RESUBMITTED
        to: UNDER_BORROWER_REVIEW
        trigger: "system (automatic on resubmit)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_BORROWER_REVIEW
        to: COMMITTEE_REVIEW
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/escalate-to-committee"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be UNDER_BORROWER_REVIEW (ERR_PROPOSAL_NOT_UNDER_REVIEW)"
        side_effects: []

      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/committee-approve"
        actor: CreditCommittee
        preconditions:
          - "Proposal must be COMMITTEE_REVIEW (ERR_PROPOSAL_NOT_COMMITTEE_REVIEW)"
          - "principal_forgiveness_cents + loan.charged_off_principal_cents must be <= loan.original_principal_cents * FORGIVENESS_CAP_BPS / 10000 (ERR_FORGIVENESS_CAP_EXCEEDED)"
        side_effects: []

      - from: COMMITTEE_REVIEW
        to: REJECTED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/committee-reject"
        actor: CreditCommittee
        preconditions:
          - "Proposal must be COMMITTEE_REVIEW (ERR_PROPOSAL_NOT_COMMITTEE_REVIEW)"
        side_effects: []

      - from: APPROVED
        to: CONSUMMATED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/consummate"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be APPROVED (ERR_PROPOSAL_NOT_APPROVED)"
          - "Case must be NEGOTIATION (ERR_CASE_NOT_NEGOTIATION)"
        side_effects:
          - "Proposal.tdr_flag computed and persisted"
          - "Case.status → IMPAIRMENT_REVIEW; Case.tdr_status updated"
          - "If tdr_flag: Loan.is_tdr → true"
          - "If principal_forgiveness_cents > 0: cascaded ChargeOffEvent books forgiveness (Loan.current_principal_cents decreases, Loan.charged_off_principal_cents increases, Case.loss_given_default_cents recomputed)"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/withdraw"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be DRAFT or SUBMITTED or UNDER_BORROWER_REVIEW or COUNTERED (ERR_PROPOSAL_NOT_WITHDRAWABLE)"
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/withdraw"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be DRAFT or SUBMITTED or UNDER_BORROWER_REVIEW or COUNTERED (ERR_PROPOSAL_NOT_WITHDRAWABLE)"
        side_effects: []

      - from: UNDER_BORROWER_REVIEW
        to: WITHDRAWN
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/withdraw"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be DRAFT or SUBMITTED or UNDER_BORROWER_REVIEW or COUNTERED (ERR_PROPOSAL_NOT_WITHDRAWABLE)"
        side_effects: []

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/withdraw"
        actor: WorkoutOfficer
        preconditions:
          - "Proposal must be DRAFT or SUBMITTED or UNDER_BORROWER_REVIEW or COUNTERED (ERR_PROPOSAL_NOT_WITHDRAWABLE)"
        side_effects: []

  - entity: CollateralItem
    initial_state: PLEDGED
    terminal_states: [RELEASED, LIQUIDATED]
    transitions:
      - from: PLEDGED
        to: UNDER_REVALUATION
        trigger: "system (automatic when a CollateralAppraisal on this item is created)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_REVALUATION
        to: PLEDGED
        trigger: "system (automatic when the appraisal is ACCEPTED or REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "On ACCEPTED: current_appraised_value_cents and current_liquidation_value_cents recomputed; Case.loss_given_default_cents recomputed"

      - from: PLEDGED
        to: LIQUIDATED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/recoveries with recovery_source COLLATERAL_LIQUIDATION naming this item"
        actor: WorkoutOfficer
        preconditions:
          - "Case must be LEGAL or RESOLUTION (ERR_CASE_NOT_LIQUIDATABLE)"
        side_effects:
          - "Item → LIQUIDATED; its liquidation value removed from Case.loss_given_default_cents base"

      - from: PLEDGED
        to: RELEASED
        trigger: "POST /loans/{loanId}/collateral/{collateralId}/release"
        actor: SpecialAssetsManager
        preconditions:
          - "Item must be PLEDGED (ERR_COLLATERAL_NOT_PLEDGED)"
          - "Loan.current_principal_cents must be 0 OR case already CLOSED (ERR_COLLATERAL_ENCUMBERED)"
        side_effects: []

  - entity: CollateralAppraisal
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /loans/{loanId}/collateral/{collateralId}/appraisals/{appraisalId}/submit"
        actor: AppraisalDesk
        preconditions:
          - "Appraisal must be DRAFT (ERR_APPRAISAL_NOT_DRAFT)"
        side_effects:
          - "staleness_days computed against the logical clock"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /loans/{loanId}/collateral/{collateralId}/appraisals/{appraisalId}/accept"
        actor: AppraisalDesk
        preconditions:
          - "Appraisal must be SUBMITTED (ERR_APPRAISAL_NOT_SUBMITTED)"
          - "staleness_days must be <= 365 (ERR_APPRAISAL_STALE)"
          - "Accepting user must equal the appraisal's appraiser_id is NOT required; any AppraisalDesk user may accept (peer role)"
        side_effects:
          - "CollateralItem.current_appraised_value_cents and current_liquidation_value_cents recomputed"
          - "CollateralItem → PLEDGED"
          - "Case.loss_given_default_cents recomputed = max(0, Loan.current_principal_cents - sum of current_liquidation_value_cents over this loan's non-LIQUIDATED, non-RELEASED collateral)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /loans/{loanId}/collateral/{collateralId}/appraisals/{appraisalId}/reject"
        actor: AppraisalDesk
        preconditions:
          - "Appraisal must be SUBMITTED (ERR_APPRAISAL_NOT_SUBMITTED)"
        side_effects:
          - "CollateralItem → PLEDGED (values unchanged)"

  - entity: ImpairmentAssessment
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/impairments/{assessmentId}/finalize"
        actor: LoanAccounting
        preconditions:
          - "Assessment must be DRAFT (ERR_IMPAIRMENT_NOT_DRAFT)"
          - "Case must be IMPAIRMENT_REVIEW or LEGAL (ERR_CASE_NOT_IMPAIRABLE)"
          - "If method == TDR_DCF: case.tdr_status must be TDR_CONFIRMED (ERR_TDR_METHOD_REQUIRES_TDR)"
          - "Finalizing user must NOT be the case's case_officer_id (segregation of duties → ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "computed_reserve_cents computed per method"
          - "Any previously FINALIZED assessment on this case → SUPERSEDED and is_active → false; this assessment is_active → true"
          - "Case.impairment_reserve_cents → computed_reserve_cents"

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (automatic when a newer assessment on the same case is FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "is_active → false"

  - entity: LegalReferral
    initial_state: PENDING_COUNSEL
    terminal_states: [SETTLED, DISMISSED]
    transitions:
      - from: PENDING_COUNSEL
        to: ACTIVE
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/legal-referrals/{referralId}/accept"
        actor: LegalCounsel
        preconditions:
          - "Referral must be PENDING_COUNSEL (ERR_REFERRAL_NOT_PENDING)"
          - "statute_deadline must be strictly after the logical clock time (ERR_STATUTE_EXPIRED)"
        side_effects: []

      - from: ACTIVE
        to: SETTLED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/legal-referrals/{referralId}/settle"
        actor: LegalCounsel
        preconditions:
          - "Referral must be ACTIVE (ERR_REFERRAL_NOT_ACTIVE)"
        side_effects:
          - "If referral_kind == GUARANTOR_PURSUITS: requires a linked RecoveryEvent with recovery_source GUARANTOR_SETTLEMENT (created in the same settle call's side effect using settled_amount_cents input) which itself triggers recovery_allocation and recomputes Loan.current_principal_cents / Loan.charged_off_principal_cents / Case.loss_given_default_cents"

      - from: ACTIVE
        to: DISMISSED
        trigger: "POST /loans/{loanId}/workout-cases/{caseId}/legal-referrals/{referralId}/dismiss"
        actor: LegalCounsel
        preconditions:
          - "Referral must be ACTIVE (ERR_REFERRAL_NOT_ACTIVE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: action-plan-create-stale-case
    parent_entity: WorkoutCase
    write_endpoint: "POST /loans/{loanId}/workout-cases/{caseId}/action-plans"
    occ_field: "expected_case_version"
    description: |
      Creating an ActionPlan against a WorkoutCase whose version has advanced
      since the client last observed it is rejected. Creating a plan mutates
      the case (WATCHLIST → ACTION_PLAN on first creation, and plan creation
      under an APPROVED predecessor supersedes it), so a stale view of the
      case means the writer is drafting against an outdated strategy baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: proposal-create-stale-case
    parent_entity: WorkoutCase
    write_endpoint: "POST /loans/{loanId}/workout-cases/{caseId}/proposals"
    occ_field: "expected_case_version"
    description: |
      Creating a RestructureProposal against a WorkoutCase whose version has
      advanced since the client last observed it is rejected. Proposal
      creation can itself move the case IMPAIRMENT_REVIEW → NEGOTIATION, so a
      stale view means the writer is negotiating against superseded terms.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appraisal-create-stale-collateral
    parent_entity: CollateralItem
    write_endpoint: "POST /loans/{loanId}/collateral/{collateralId}/appraisals"
    occ_field: "expected_collateral_version"
    description: |
      Creating a CollateralAppraisal against a CollateralItem whose version
      has advanced since the client last observed it is rejected. Appraisal
      creation flips the item PLEDGED → UNDER_REVALUATION, so a stale view
      means the value baseline the appraiser used is outdated.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: liquidation_value
    description: "Haircut value of a single collateral item"
    trigger: "CollateralAppraisal ACCEPTED (per item)"
    algorithm: aggregation
    formula: |
      current_liquidation_value_cents =
        round_half_up(appraised_value_cents * (10000 - liquidation_discount_bps) / 10000)
      # Rounding order pinned: multiply first, divide once, round once. No
      # intermediate rounding of the discount factor.
    input_set: "The ACCEPTED appraisal's appraised_value_cents and the owning CollateralItem.liquidation_discount_bps"
    constants:
      BPS_DENOM: 10000
    precision: "0 decimal places (integer cents), round_half_up"
    variants: []

  - name: loss_given_default
    description: "Case-level LGD: exposure not covered by collateral liquidation values"
    trigger: "Appraisal ACCEPTED; CollateralItem LIQUIDATED or RELEASED; ChargeOffEvent booked; principal RecoveryEvent booked"
    algorithm: aggregation
    formula: |
      collateral_cover = sum over CollateralItem c of loan
                         where c.status IN {PLEDGED, UNDER_REVALUATION}
                         of c.current_liquidation_value_cents
      loss_given_default_cents = max(0, loan.current_principal_cents - collateral_cover)
    input_set: "All CollateralItem rows on the case's loan whose status is PLEDGED or UNDER_REVALUATION (RELEASED and LIQUIDATED excluded)"
    constants: {}
    precision: "0 decimal places (integer cents)"
    variants: []

  - name: cecl_reserve
    description: "CECL expected-loss reserve (entity domain: WorkoutCase reserve accounting)"
    trigger: "ImpairmentAssessment with method CECL transitions DRAFT → FINALIZED"
    algorithm: aggregation
    formula: |
      computed_reserve_cents =
        round_half_up(loan.current_principal_cents * probability_of_default_bps * loss_given_default_bps / 100000000)
      # Rounding pinned: single multiply chain, divide once by 10^8, round once.
    input_set: "The case's loan.current_principal_cents at finalization time; assessment PD/LGD inputs"
    constants:
      BPS_SQUARED_DENOM: 100000000
    precision: "0 decimal places (integer cents), round_half_up"
    variants: []

  - name: tdr_dcf_reserve
    description: "TDR discounted-cash-flow impairment — dual variant of reserve measurement, different entity-domain basis (loan cash flows vs case PD/LGD)"
    trigger: "ImpairmentAssessment with method TDR_DCF transitions DRAFT → FINALIZED"
    algorithm: chronological
    formula: |
      # Discount rate is the loan's ORIGINAL contractual rate (regulatory rule:
      # TDR impairment discounts at the note's original effective rate, never
      # the concession rate). Monthly compounding.
      r_monthly = loan.contractual_rate_bps / 10000 / 12
      pv = 0
      for cf in expected_cash_flows sorted by period_index ascending:
          pv += cf.amount_cents / (1 + r_monthly) ** cf.period_index
      computed_reserve_cents = max(0, loan.current_principal_cents - round_half_up(pv))
      # Duplicate period_index entries are rejected (ERR_DUPLICATE_CASH_FLOW_PERIOD).
      # An empty expected_cash_flows array is rejected (ERR_EMPTY_CASH_FLOWS).
    input_set: "loan.current_principal_cents and loan.contractual_rate_bps at finalization; the assessment's expected_cash_flows array"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "0 decimal places (integer cents), round_half_up applied once after summation of unrounded per-period PVs"
    variants:
      - name: dcf_vs_cecl_divergence
        when: "Same case, same current_principal_cents: CECL and TDR_DCF generally produce different reserves — CECL is probability-weighted on PD×LGD, TDR_DCF discounts contracted cash flows at the original rate"
        difference: "Different formula family AND different input set; the ACTIVE method is whichever assessment was finalized latest"

  - name: recovery_allocation
    description: "Allocate a recovery amount across bank ledgers — dual-variant allocation order"
    trigger: "RecoveryEvent created (directly or via guarantor settle)"
    algorithm: waterfall_allocation
    formula: |
      # Buckets: COSTS (unpaid workout costs, fixed tier cap 10% of amount),
      # CHARGED_OFF (loan.charged_off_principal_cents), CURRENT_PRINCIPAL
      # (loan.current_principal_cents).
      #
      # CHRONOLOGICAL variant (regulatory default for this bank):
      #   1. to_charged_off = min(amount, charged_off_principal_cents)
      #   2. to_current    = min(amount - to_charged_off, current_principal_cents)
      #   3. excess (amount - to_charged_off - to_current) is retained as
      #      unapplied_cash on the case (not an error).
      #
      # WATERFALL variant (cost-first):
      #   1. to_costs      = min(amount, ceil(amount * 0.10))   # costs tier, 10% cap
      #   2. remainder     = amount - to_costs
      #   3. to_charged_off = min(remainder, charged_off_principal_cents)
      #   4. to_current    = min(remainder - to_charged_off, current_principal_cents)
      #   5. excess retained as unapplied_cash.
      #
      # Then:
      #   loan.charged_off_principal_cents -= to_charged_off
      #   loan.current_principal_cents    -= to_current
      # Rounding: to_costs rounds HALF-UP to integer cents; all other bucket
      # amounts are exact integer cents by construction (min of integers).
    input_set: "The loan's charged_off_principal_cents and current_principal_cents at booking; the RecoveryEvent amount and allocation_mode"
    constants:
      COST_TIER_BPS: 1000
    precision: "0 decimal places (integer cents), round_half_up for the costs tier only"
    variants:
      - name: chronological_vs_waterfall
        when: "Same loan state (charged_off=K, current=P), same recovery amount A: CHRONOLOGICAL pays charged-off first; WATERFALL diverts ceil(0.10*A) to costs before any principal bucket"
        difference: "Bucket ORDER differs, so to_charged_off / to_current / unapplied_cash all differ whenever A > 0 and both principal buckets are non-zero"

  - name: forgiveness_cap_check
    description: "Cumulative forgiveness cap evaluated at committee approval (combinatorial: 3+ inputs, state-dependent branch)"
    trigger: "RestructureProposal COMMITTEE_REVIEW → APPROVED"
    algorithm: threshold
    formula: |
      cumulative_after = loan.charged_off_principal_cents + proposal.principal_forgiveness_cents
      cap = floor(loan.original_principal_cents * FORGIVENESS_CAP_BPS / 10000)
      # Boundary pinned: approval REJECTED iff cumulative_after > cap.
      # cumulative_after == cap exactly is ALLOWED (cap is inclusive).
    input_set: "loan.charged_off_principal_cents (state-dependent), loan.original_principal_cents, proposal.principal_forgiveness_cents"
    constants:
      FORGIVENESS_CAP_BPS: 2500
    precision: "0 decimal places; cap uses floor, comparison uses strict >"
    variants: []

  - name: portfolio_classified_exposure
    description: "Portfolio reporting: classified exposure aggregation with state-filtered inclusion and rounding-order pin"
    trigger: "GET /portfolio-report (computed read)"
    algorithm: aggregation
    formula: |
      # Inclusion filter (pinned): loans with status IN {WATCHLIST, WORKOUT,
      # FORECLOSURE}. PERFORMING and RESOLVED loans are EXCLUDED.
      # Per-loan classified exposure:
      #   net_exposure = loan.current_principal_cents + loan.charged_off_principal_cents
      #                  - active_case.impairment_reserve_cents
      # where active_case is the loan's single non-CLOSED WorkoutCase
      # (is_active impairment only; SUPERSEDED reserves excluded).
      # Portfolio total: sum of per-loan values, each computed at full integer
      # precision BEFORE summation (no per-loan rounding needed — all terms are
      # already integer cents). Loans with no non-CLOSED case contribute 0.
      # Tie/order independence: summation is over loan.created_at ASC for
      # deterministic ledger walk in the report rows.
    input_set: "All loans with status WATCHLIST | WORKOUT | FORECLOSURE, ordered by created_at ASC"
    constants: {}
    precision: "0 decimal places (integer cents)"
    variants:
      - name: gross_vs_net_of_reserve
        when: "The report also emits gross_classified_cents = sum(current_principal + charged_off) with NO reserve offset, alongside net"
        difference: "Same inclusion set, two aggregation definitions; net != gross whenever any case has impairment_reserve_cents > 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is authorized for this endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (loan, then case, then child); borrower_id / supersedes_plan_id body references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target entity's state machine permits the requested transition (all per-transition from-state and state preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on the three OCC-guarded creation endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /loans/{loanId}/workout-cases/{caseId}/action-plans", "POST /loans/{loanId}/workout-cases/{caseId}/proposals", "POST /loans/{loanId}/collateral/{collateralId}/appraisals"]

  - priority: 6
    category: business_safety
    check: "Segregation of duties: action-plan submitter must be case_officer_id; action-plan approver must NOT be case_officer_id; impairment finalizer must NOT be case_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /loans/{loanId}/workout-cases/{caseId}/action-plans", "POST /loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/submit", "POST /loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/approve", "POST /loans/{loanId}/workout-cases/{caseId}/impairments/{assessmentId}/finalize"]

  - priority: 7
    category: business_safety
    check: "Regulatory timing: appraisal staleness_days <= 365 at accept; referral statute_deadline strictly after clock at accept; case entry RISK_RATING_DOWNGRADE requires risk_rating_at_entry >= 6; close with RETURN_TO_PERFORMING requires days_past_due < 60"
    error_id: ERR_REGULATORY_TIMING
    http_status: 422
    applies_to: ["POST /loans/{loanId}/collateral/{collateralId}/appraisals/{appraisalId}/accept", "POST /loans/{loanId}/workout-cases/{caseId}/legal-referrals/{referralId}/accept", "POST /loans/{loanId}/workout-cases", "POST /loans/{loanId}/workout-cases/{caseId}/close"]

  - priority: 8
    category: business_constraint
    check: "Referential/structural: counter terms materially differ; exactly one active plan (no second approval while one APPROVED); demand_amount_cents <= guarantor_net_worth_cents and <= loss_given_default_cents; FORECLOSURE/DEED_IN_LIEU path requires case in LEGAL; TDR_DCF method requires TDR_CONFIRMED; duplicate cash-flow periods rejected; empty expected_cash_flows for TDR_DCF rejected"
    error_id: ERR_BUSINESS_CONSTRAINT
    http_status: 422
    applies_to: "specific action endpoints"

  - priority: 9
    category: business_fiscal
    check: "Fiscal caps: forgiveness cap (cumulative <= 25% of original principal, inclusive); charge-off amount <= current_principal_cents; recovery amount > 0; appraised_value_cents > 0"
    error_id: ERR_FISCAL_LIMIT
    http_status: 422
    applies_to: ["POST /loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/committee-approve", "POST /loans/{loanId}/workout-cases/{caseId}/charge-offs", "POST /loans/{loanId}/workout-cases/{caseId}/recoveries", "POST /loans/{loanId}/collateral/{collateralId}/appraisals"]

  - priority: 10
    category: business_temporal
    check: "Action plan target_resolution_date strictly after current logical clock; appraisal effective_date <= current logical clock"
    error_id: ERR_INVALID_TEMPORAL
    http_status: 422
    applies_to: ["POST /loans/{loanId}/workout-cases/{caseId}/action-plans", "POST /loans/{loanId}/collateral/{collateralId}/appraisals"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; mandatory default) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; all staleness/deadline computations read it"]

  # --- Borrower ---
  - method: POST
    path: "/borrowers"
    description: "Register a borrower"
    roles: [WorkoutOfficer, SystemAdmin]
    code: 201
    input: [legal_name, tax_id, naics_code, internal_risk_rating, "guarantor_name?", "guarantor_net_worth_cents?"]
    output: Borrower
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/borrowers/{borrowerId}"
    description: "Get a borrower"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, AppraisalDesk, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: GET
    path: "/borrowers/{borrowerId}/loans"
    description: "List a borrower's loans (FK reverse-reachability)"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, AppraisalDesk, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Loan[]"
    side_effects: []

  # --- Loan ---
  - method: POST
    path: "/loans"
    description: "Book a loan"
    roles: [WorkoutOfficer, SystemAdmin]
    code: 201
    input: [borrower_id, loan_number, original_principal_cents, contractual_rate_bps, days_past_due]
    output: Loan
    side_effects: ["current_principal_cents = original_principal_cents; status = PERFORMING"]

  - method: GET
    path: "/loans/{loanId}"
    description: "Get a loan"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, AppraisalDesk, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/aging-refresh"
    description: "Refresh days_past_due; recomputes nonaccrual threshold crossing"
    roles: [LoanAccounting, SystemAdmin]
    code: 200
    input: [days_past_due]
    output: Loan
    side_effects:
      - "days_past_due updated"
      - "nonaccrual = (days_past_due >= 90) OR case in LEGAL; cleared only when days_past_due < 90 and no case in LEGAL"

  # --- WorkoutCase ---
  - method: POST
    path: "/loans/{loanId}/workout-cases"
    description: "Enter a loan onto the watchlist (create workout case)"
    roles: [WorkoutOfficer]
    code: 201
    input: [entry_trigger, risk_rating_at_entry, case_officer_id]
    output: WorkoutCase
    side_effects: ["Loan.status PERFORMING → WATCHLIST", "case status = WATCHLIST", "increments Loan.version and WorkoutCase is created at version 1"]

  - method: GET
    path: "/loans/{loanId}/workout-cases"
    description: "List workout cases on a loan"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, AppraisalDesk, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "WorkoutCase[]"
    side_effects: []

  - method: GET
    path: "/loans/{loanId}/workout-cases/{caseId}"
    description: "Get a workout case"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, AppraisalDesk, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: []
    output: WorkoutCase
    side_effects: []

  # --- ActionPlan ---
  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/action-plans"
    description: "Draft an action plan (OCC on case version)"
    roles: [WorkoutOfficer]
    code: 201
    input: [plan_text, target_resolution_date, milestone_count, "supersedes_plan_id?", expected_case_version]
    output: ActionPlan
    side_effects:
      - "First plan on a WATCHLIST case: Case.status → ACTION_PLAN"
      - "increments WorkoutCase.version by 1"

  - method: GET
    path: "/loans/{loanId}/workout-cases/{caseId}/action-plans"
    description: "List action plans on a case"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ActionPlan[]"
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/submit"
    description: "Submit a draft plan for approval"
    roles: [WorkoutOfficer]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["Plan DRAFT → SUBMITTED"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/approve"
    description: "Approve a submitted plan (segregation: approver ≠ case officer)"
    roles: [SpecialAssetsManager]
    code: 200
    input: []
    output: ActionPlan
    side_effects:
      - "Plan SUBMITTED → APPROVED; approval_round += 1"
      - "Case → NEGOTIATION; tdr_status → PENDING_EVALUATION; Loan → WORKOUT"
      - "If supersedes_plan_id names an APPROVED plan: that plan → SUPERSEDED"

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/reject"
    description: "Reject a submitted plan"
    roles: [SpecialAssetsManager]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["Plan SUBMITTED → REJECTED; approval_round += 1"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/action-plans/{planId}/revise"
    description: "Return a rejected plan to draft (revision loop)"
    roles: [WorkoutOfficer]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["Plan REJECTED → DRAFT"]

  # --- RestructureProposal ---
  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals"
    description: "Draft a restructure proposal (OCC on case version)"
    roles: [WorkoutOfficer]
    code: 201
    input: [proposal_kind, concession_rate_bps, term_extension_months, principal_forgiveness_cents, borrower_concession_cents, expected_case_version]
    output: RestructureProposal
    side_effects:
      - "Case IMPAIRMENT_REVIEW → NEGOTIATION when applicable"
      - "increments WorkoutCase.version by 1"

  - method: GET
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals"
    description: "List proposals on a case"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RestructureProposal[]"
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/submit"
    description: "Submit a draft proposal; auto-advances to UNDER_BORROWER_REVIEW"
    roles: [WorkoutOfficer]
    code: 200
    input: []
    output: RestructureProposal
    side_effects: ["DRAFT → SUBMITTED → UNDER_BORROWER_REVIEW"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/counter"
    description: "Record a borrower counter-offer (terms replaced in place)"
    roles: [WorkoutOfficer]
    code: 200
    input: [concession_rate_bps, term_extension_months, principal_forgiveness_cents, borrower_concession_cents]
    output: RestructureProposal
    side_effects: ["UNDER_BORROWER_REVIEW → COUNTERED"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/resubmit"
    description: "Resubmit a countered proposal (negotiation round += 1)"
    roles: [WorkoutOfficer]
    code: 200
    input: []
    output: RestructureProposal
    side_effects: ["COUNTERED → RESUBMITTED → UNDER_BORROWER_REVIEW; negotiation_round += 1"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/escalate-to-committee"
    description: "Escalate borrower-acceptable terms to credit committee"
    roles: [WorkoutOfficer]
    code: 200
    input: []
    output: RestructureProposal
    side_effects: ["UNDER_BORROWER_REVIEW → COMMITTEE_REVIEW"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/committee-approve"
    description: "Committee approval; forgiveness cap enforced"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: RestructureProposal
    side_effects: ["COMMITTEE_REVIEW → APPROVED"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/committee-reject"
    description: "Committee rejection (terminal)"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: RestructureProposal
    side_effects: ["COMMITTEE_REVIEW → REJECTED"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/consummate"
    description: "Consummate approved terms; TDR determination; forgiveness charge-off cascade"
    roles: [WorkoutOfficer]
    code: 200
    input: []
    output: RestructureProposal
    side_effects:
      - "APPROVED → CONSUMMATED; tdr_flag computed"
      - "Case → IMPAIRMENT_REVIEW; tdr_status → TDR_CONFIRMED or TDR_REJECTED"
      - "Loan.is_tdr updated"
      - "If principal_forgiveness_cents > 0: cascaded ChargeOffEvent(PARTIAL_IMPAIRMENT) → Loan.current_principal_cents -= forgiveness; Loan.charged_off_principal_cents += forgiveness; Case.loss_given_default_cents recomputed"

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/proposals/{proposalId}/withdraw"
    description: "Withdraw a non-terminal proposal"
    roles: [WorkoutOfficer]
    code: 200
    input: []
    output: RestructureProposal
    side_effects: ["→ WITHDRAWN"]

  # --- CollateralItem ---
  - method: POST
    path: "/loans/{loanId}/collateral"
    description: "Pledge collateral to a loan"
    roles: [WorkoutOfficer, SystemAdmin]
    code: 201
    input: [collateral_type, description, liquidation_discount_bps]
    output: CollateralItem
    side_effects: ["status = PLEDGED"]

  - method: GET
    path: "/loans/{loanId}/collateral"
    description: "List collateral on a loan"
    roles: [WorkoutOfficer, SpecialAssetsManager, AppraisalDesk, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "CollateralItem[]"
    side_effects: []

  - method: GET
    path: "/loans/{loanId}/collateral/{collateralId}"
    description: "Get a collateral item"
    roles: [WorkoutOfficer, SpecialAssetsManager, AppraisalDesk, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: []
    output: CollateralItem
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/collateral/{collateralId}/release"
    description: "Release unencumbered collateral"
    roles: [SpecialAssetsManager]
    code: 200
    input: []
    output: CollateralItem
    side_effects: ["PLEDGED → RELEASED; Case.loss_given_default_cents recomputed"]

  # --- CollateralAppraisal ---
  - method: POST
    path: "/loans/{loanId}/collateral/{collateralId}/appraisals"
    description: "Order an appraisal (OCC on collateral version)"
    roles: [AppraisalDesk]
    code: 201
    input: [appraised_value_cents, effective_date, appraiser_id, expected_collateral_version]
    output: CollateralAppraisal
    side_effects:
      - "CollateralItem PLEDGED → UNDER_REVALUATION"
      - "increments CollateralItem.version by 1"

  - method: GET
    path: "/loans/{loanId}/collateral/{collateralId}/appraisals"
    description: "List appraisals on a collateral item"
    roles: [WorkoutOfficer, SpecialAssetsManager, AppraisalDesk, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "CollateralAppraisal[]"
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/collateral/{collateralId}/appraisals/{appraisalId}/submit"
    description: "Submit appraisal for review"
    roles: [AppraisalDesk]
    code: 200
    input: []
    output: CollateralAppraisal
    side_effects: ["DRAFT → SUBMITTED; staleness_days computed"]

  - method: POST
    path: "/loans/{loanId}/collateral/{collateralId}/appraisals/{appraisalId}/accept"
    description: "Accept appraisal; revalue collateral; recompute LGD"
    roles: [AppraisalDesk]
    code: 200
    input: []
    output: CollateralAppraisal
    side_effects:
      - "SUBMITTED → ACCEPTED; CollateralItem → PLEDGED with recomputed values"
      - "Case.loss_given_default_cents recomputed"

  - method: POST
    path: "/loans/{loanId}/collateral/{collateralId}/appraisals/{appraisalId}/reject"
    description: "Reject appraisal"
    roles: [AppraisalDesk]
    code: 200
    input: []
    output: CollateralAppraisal
    side_effects: ["SUBMITTED → REJECTED; CollateralItem → PLEDGED unchanged"]

  # --- ImpairmentAssessment ---
  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/impairments"
    description: "Create an impairment assessment (CECL or TDR_DCF)"
    roles: [LoanAccounting]
    code: 201
    input: [method, probability_of_default_bps, loss_given_default_bps, "expected_cash_flows?"]
    output: ImpairmentAssessment
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/loans/{loanId}/workout-cases/{caseId}/impairments"
    description: "List impairment assessments on a case"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ImpairmentAssessment[]"
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/impairments/{assessmentId}/finalize"
    description: "Finalize assessment; compute reserve; supersede prior active"
    roles: [LoanAccounting]
    code: 200
    input: []
    output: ImpairmentAssessment
    side_effects:
      - "computed_reserve_cents per method; is_active = true"
      - "prior FINALIZED assessment → SUPERSEDED, is_active = false"
      - "Case.impairment_reserve_cents updated"

  # --- LegalReferral ---
  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/legal-referrals"
    description: "Refer case to counsel (guarantor pursuit / foreclosure / deed-in-lieu / note-sale prep)"
    roles: [WorkoutOfficer]
    code: 201
    input: [referral_kind, "target_guarantor_name?", demand_amount_cents, statute_deadline, "decision_rationale?"]
    output: LegalReferral
    side_effects: ["Case NEGOTIATION|IMPAIRMENT_REVIEW → LEGAL; Loan.nonaccrual → true"]

  - method: GET
    path: "/loans/{loanId}/workout-cases/{caseId}/legal-referrals"
    description: "List legal referrals on a case"
    roles: [WorkoutOfficer, SpecialAssetsManager, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "LegalReferral[]"
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/legal-referrals/{referralId}/accept"
    description: "Counsel accepts referral (statute check)"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalReferral
    side_effects: ["PENDING_COUNSEL → ACTIVE"]

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/legal-referrals/{referralId}/settle"
    description: "Settle referral; guarantor settlements book a linked RecoveryEvent"
    roles: [LegalCounsel]
    code: 200
    input: [settled_amount_cents]
    output: LegalReferral
    side_effects:
      - "ACTIVE → SETTLED"
      - "If GUARANTOR_PURSUITS: creates RecoveryEvent(recovery_source=GUARANTOR_SETTLEMENT, amount=settled_amount_cents, allocation_mode=CHRONOLOGICAL) → recovery_allocation runs → Loan balances and Case.loss_given_default_cents recomputed"

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/legal-referrals/{referralId}/dismiss"
    description: "Dismiss referral"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalReferral
    side_effects: ["ACTIVE → DISMISSED"]

  # --- ChargeOffEvent / RecoveryEvent (immutable ledger events) ---
  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/charge-offs"
    description: "Book a partial or full charge-off"
    roles: [LoanAccounting]
    code: 201
    input: [amount_cents, reason_code]
    output: ChargeOffEvent
    side_effects:
      - "Loan.current_principal_cents -= amount; Loan.charged_off_principal_cents += amount"
      - "is_partial computed"
      - "Case.loss_given_default_cents recomputed"

  - method: GET
    path: "/loans/{loanId}/workout-cases/{caseId}/charge-offs"
    description: "List charge-off events on a case"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChargeOffEvent[]"
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/recoveries"
    description: "Book a recovery with chosen allocation variant"
    roles: [LoanAccounting]
    code: 201
    input: [amount_cents, recovery_source, allocation_mode]
    output: RecoveryEvent
    side_effects:
      - "recovery_allocation runs (CHRONOLOGICAL or WATERFALL)"
      - "Loan.charged_off_principal_cents and Loan.current_principal_cents updated"
      - "If recovery_source == COLLATERAL_LIQUIDATION: linked collateral item → LIQUIDATED"
      - "Case.loss_given_default_cents recomputed"

  - method: GET
    path: "/loans/{loanId}/workout-cases/{caseId}/recoveries"
    description: "List recovery events on a case"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, LegalCounsel, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecoveryEvent[]"
    side_effects: []

  # --- ExitStrategyDecision / close / report ---
  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/exit-decision"
    description: "Record exit strategy (foreclosure vs deed-in-lieu argmax with tie → DEED_IN_LIEU)"
    roles: [SpecialAssetsManager]
    code: 201
    input: [chosen_path, npv_foreclosure_cents, npv_deed_in_lieu_cents, "override_justification?"]
    output: ExitStrategyDecision
    side_effects:
      - "decision_rule_outcome computed; non-argmax choice without override_justification → ERR_BUSINESS_CONSTRAINT"
      - "Case → RESOLUTION; resolution_path set"
      - "FORECLOSURE/DEED_IN_LIEU → Loan.status → FORECLOSURE"

  - method: GET
    path: "/loans/{loanId}/workout-cases/{caseId}/exit-decisions"
    description: "List exit decisions on a case"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ExitStrategyDecision[]"
    side_effects: []

  - method: POST
    path: "/loans/{loanId}/workout-cases/{caseId}/close"
    description: "Close case in RESOLUTION (cure check for RETURN_TO_PERFORMING)"
    roles: [SpecialAssetsManager]
    code: 200
    input: []
    output: WorkoutCase
    side_effects:
      - "Case → CLOSED"
      - "Loan → RESOLVED (or PERFORMING on RETURN_TO_PERFORMING)"
      - "If last open case on borrower: Borrower → EXITED"

  - method: GET
    path: "/portfolio-report"
    description: "Computed portfolio classified-exposure report (gross and net-of-reserve variants)"
    roles: [PortfolioAnalyst, SpecialAssetsManager, SystemAdmin]
    code: 200
    input: ["as_of?", "limit?", "offset?"]
    output: { gross_classified_cents: integer, net_classified_cents: integer, loan_rows: array }
    side_effects: []

