        distinguishing_aspect: "Debarment is not idempotent by design: the second call on an already-DEBARRED offeror is a 409 ERR_OFFEROR_STATUS_INVALID and must not bump the row's version a second time."
        test_recipe:
          setup:
            - "One offeror registered at clock 2027-01-05 and then debarred, so it is DEBARRED at version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
