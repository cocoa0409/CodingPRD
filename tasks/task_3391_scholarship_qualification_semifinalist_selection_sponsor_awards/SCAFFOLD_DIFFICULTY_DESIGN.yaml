              payload: { cycle_id: "${cyc}", award_amount_cents: 50000, max_awards: 1, pool_total_cents: 50000, effective_start_date: "2027-06-29", effective_end_date: "2027-09-30" }
              as: SponsorAdmin
              as_user_id: "${sp}"
              captures: { err: $.data.error_id }
          assert:
            - "A2 (start == A1.end == 2027-06-30) is created: ${a2_status} == ACTIVE — adjacency is not overlap under half-open [start, end)"
            - "${err} == ERR_AGREEMENT_WINDOW_OVERLAP for A3 ([2027-06-29, 2027-09-30) intersects both A1 and A2)"
            - "A1 ${a1} and A2 ${a2} remain ACTIVE and unmodified; no agreement was created by the rejected call"

