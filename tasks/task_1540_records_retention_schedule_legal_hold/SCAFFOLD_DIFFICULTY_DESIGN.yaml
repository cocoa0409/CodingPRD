              as: RecordsManager
              captures: { r: "$.data.id" }
            - call: "POST /ig/disposition-requests"
              payload: { program_id: "${p}", record_ids: ["${r}"], method: "SECURE_ERASE", justification: "Purge eligible record batch" }
              as: RecordsManager
              as_user_id: "rm-1"
              captures: { req: "$.data.id" }
            - call: "POST /ig/disposition-requests/${req}/submit"
              payload: {}
              as: RecordsManager
              as_user_id: "rm-1"
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-CH", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
