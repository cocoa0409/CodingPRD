              as: Manager
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /bake-lots"
              payload: { bake_plan_line_id: "${line_id}", oven_id: "${oven_id}", baked_qty: 10, produced_at: "2026-06-14T10:00:00Z", slot_start: "2026-06-14T09:10:00Z", slot_end: "2026-06-14T10:00:00Z" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OVEN_SLOT_CONFLICT"

  # =========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: par_pool_conservation_on_order_cancel
        grounds:
          - state_machines.DeliveryOrder.PENDING_to_CANCELLED
          - calculations.par_reservation
          - entities.BakePlanLine.fields.reserved_qty
        distinguishing_aspect: "Conserved quantity is par UNITS: reserve 10 (reserved 10/available 30) then cancel (release 10) returns reserved_qty+available_qty to par_qty 40 with zero drift."
        test_recipe:
          setup:
            - "Committed line par 40; one PENDING order qty 10 (reserved 10, available 30)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "BRD-16", name: "Seeded", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { prod_id: $.data.id }
