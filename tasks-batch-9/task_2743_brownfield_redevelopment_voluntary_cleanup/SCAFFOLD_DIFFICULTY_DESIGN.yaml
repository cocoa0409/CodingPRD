          assert:
            - "the first inquiry-completion succeeds: LiabilityProtection.${prot_id}.inquiry_state == AAI_COMPLETE"
            - "LiabilityProtection.${prot_id}.aai_report_date == '2026-04-18' and aai_expires_on == '2027-04-18' (aai_report_date + 365 days)"
            - "LiabilityProtection.${prot_id}.bfpp_status == NOT_ESTABLISHED (the site is still UNDER_CONTRACT) and obligation_state == OBLIGATIONS_NONE with compliance_pct == 1.0000"
            - "the second inquiry-completion returns HTTP 422 with error_id == 'ERR_AAI_REPORT_STALE'"
            - "LiabilityProtection.${protB_id}.inquiry_state == AAI_PENDING with aai_report_date null and aai_expires_on null"
            - "the 181-day report was not rejected by priority 25: 2026-04-17 <= 2026-10-15, so ERR_AAI_AFTER_ACQUISITION does not apply"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies over three different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: enrollment_decision_depends_on_protection_inquiry_state
        grounds:
          - validations[33].ERR_ENROLLMENT_NOT_ELIGIBLE
          - state_machines.VcpEnrollment.ELIGIBILITY_REVIEW_to_ENROLLED
          - state_machines.LiabilityProtection.AAI_PENDING_to_AAI_COMPLETE
          - entities.LiabilityProtection.fields.inquiry_state
        distinguishing_aspect: |
          Entity pair = VcpEnrollment depends on LiabilityProtection. The
          enrollment sits in ELIGIBILITY_REVIEW and its own state permits the
          ENROLL trigger, yet the decision is refused with
          ERR_ENROLLMENT_NOT_ELIGIBLE purely because the sibling
          LiabilityProtection is still in inquiry_state AAI_PENDING. Nothing on
          the enrollment changes between the refused and the accepted call — only
          the other entity moves to AAI_COMPLETE.
        test_recipe:
          setup:
            - "Clock 2026-08-01; site UNDER_CONTRACT with institutional_control_committed true."
            - "APPROVED PHASE_I with aai_report_date 2026-07-20, so Site.delineation_status is SCREENED and an enrollment may be created, but NO inquiry-completion call is made."
            - "A RESTRICTED_CLOSURE enrollment created by the site owner, which auto-advances to ELIGIBILITY_REVIEW."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_enr
          trigger:
            - &k_elig_fail
              call: "POST /vcp-enrollments/${enr_id}/eligibility-decision"
              payload: { decision: ENROLL, decision_note: "Track confirmed." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { elig_err: $.data.error_id }
            - *k_inq
            - &k_elig_ok
              call: "POST /vcp-enrollments/${enr_id}/eligibility-decision"
              payload: { decision: ENROLL, decision_note: "Track confirmed after inquiry acceptance." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { enr_v1b: $.data.version }
          assert:
            - "the first eligibility-decision returns HTTP 422 with error_id == 'ERR_ENROLLMENT_NOT_ELIGIBLE'"
            - "after the refusal: VcpEnrollment.${enr_id}.status == ELIGIBILITY_REVIEW with enrolled_on null and eligibility_decided_by_user_id null"
            - "the inquiry-completion moves LiabilityProtection.${prot_id}.inquiry_state to AAI_COMPLETE with aai_expires_on == '2027-07-20'"
            - "the second, byte-identical eligibility-decision succeeds: VcpEnrollment.${enr_id}.status == ENROLLED, enrolled_on == '2026-08-01', eligibility_decided_by_user_id == 'reviewer-alpha'"
            - "Site.${site_id}.cleanup_posture == OPEN throughout, so no posture gate produced the first error"
            - "the refusal was not ERR_CONTROL_COMMITMENT_MISSING: Site.institutional_control_committed == true"

      - name: letter_reissue_depends_on_impaired_control_returning_to_operating
        grounds:
          - state_machines.NoFurtherActionLetter.REVOKED_to_ISSUED
          - state_machines.SiteControl.IMPAIRED_to_OPERATING
          - validations[11].ERR_SITE_POSTURE_RESTRICTED
          - validations[22].ERR_CONTROLS_NOT_OPERATING
          - calculations.site_cleanup_posture
          - entities.NoFurtherActionLetter.fields.reissue_count
        distinguishing_aspect: |
          Entity pair = NoFurtherActionLetter depends on SiteControl. The letter
          is REVOKED with the curable reason CONTROL_FAILURE and its own state
          permits re-issuance, but while the control is IMPAIRED the site is
          RESTRICTED and the re-issue is refused with
          ERR_SITE_POSTURE_RESTRICTED. A single passing re-certification of the
          control drops impaired_control_count to 0, returns the site to OPEN and
          makes the identical re-issue call succeed with reissue_count 1 —
          without the lender acceptance coming back.
        test_recipe:
          setup:
            - "The full closure chain of the exceedance cascade: plan approved, policy bound, both awards AWARDED, control OPERATING, both goals ATTAINED, letter ISSUED and ACCEPTED_BY_LENDER."
            - "At clock 2027-08-06 a monitoring result of 900.00 on the RESTRICTED goal impairs the control, so the site is RESTRICTED, the letter is REVOKED with revocation_reason CONTROL_FAILURE and both awards are RESCINDED."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_insurer
            - *k_lab
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - *k_enr
            - *k_elig
            - *k_planA
            - *k_ctlA
            - *k_planAsub
            - *k_planAtech
            - *k_planApcc
            - *k_planAapp
            - *k_quoteA
            - *k_bindA
            - *k_w1
            - *k_w2
            - *k_w1dec
            - *k_w2dec
            - *k_clock_2701
            - *k_ctlA_pass1
            - *k_me_g1a
            - *k_me_g1b
            - *k_me_g1c
            - *k_me_g1d
            - *k_me_g2a
            - *k_me_g2b
            - *k_me_g2c
            - *k_me_g2d
            - *k_clock_2706
            - *k_res_g1a
            - *k_res_g1b
            - *k_res_g1c
            - *k_res_g1d
            - *k_res_g2a
            - *k_res_g2b
            - *k_res_g2c
            - *k_res_g2d
            - *k_compreq
            - *k_letter
            - *k_issue
            - *k_lender
            - *k_clock_2708
            - *k_me_fail
            - *k_res_fail
          trigger:
            - &k_reissue_fail
              call: "POST /nfa-letters/${letter_id}/issue"
              payload: {}
              as: StateAgencyReviewer
              as_user_id: "reviewer-gamma"
              captures: { reissue_err: $.data.error_id }
            - &k_clock_2708b
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-07T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &k_ctlA_repass
              call: "POST /site-controls/${ctlA_id}/operation-certification"
              payload: { condition: PASS, certification_date: "2027-08-07" }
              as: Redeveloper
              as_user_id: "${redev_id}"
            - &k_reissue_ok
              call: "POST /nfa-letters/${letter_id}/issue"
              payload: {}
              as: StateAgencyReviewer
              as_user_id: "reviewer-gamma"
          assert:
            - "the first re-issue returns HTTP 409 with error_id == 'ERR_SITE_POSTURE_RESTRICTED' while SiteControl.${ctlA_id}.status == IMPAIRED"
            - "after that refusal: NoFurtherActionLetter.${letter_id}.status == REVOKED, revocation_reason == CONTROL_FAILURE, reissue_count == 0"
            - "the re-certification moves SiteControl.${ctlA_id} to OPERATING with impaired_since null, impairment_count == 1 (history kept), last_certified_on == '2027-08-07' and next_certification_due_on == '2027-11-05'"
            - "Site.${site_id}.impaired_control_count == 0 and cleanup_posture == OPEN after the re-certification"
            - "the second, byte-identical re-issue succeeds: NoFurtherActionLetter.${letter_id}.status == ISSUED, reissue_count == 1, revocation_reason null, issued_on == '2027-08-07', issued_by_user_id == 'reviewer-gamma'"
            - "NoFurtherActionLetter.${letter_id}.accepted_by_lender_user_id == 'lender-1' is retained but the status is ISSUED, not ACCEPTED_BY_LENDER: the lender acceptance is not restored by re-issuance"
            - "FundingAward.${w1_id}.status == RESCINDED and FundingAward.${w2_id}.status == RESCINDED (re-issuance does not un-rescind funding)"

      - name: control_decommission_depends_on_credited_goal_attainment
        grounds:
          - validations[24].ERR_CONTROL_STILL_REQUIRED
          - state_machines.SiteControl.OPERATING_to_DECOMMISSIONED
          - calculations.goal_attainment_streak
          - entities.CleanupGoal.fields.control_credit_type
          - entities.CleanupGoal.fields.attainment_status
        distinguishing_aspect: |
          Entity pair = SiteControl depends on CleanupGoal. The control is
          OPERATING and its own state permits decommissioning, but the RESTRICTED
          cleanup goal that credits control_credit_type VAPOR_MITIGATION is still
          NOT_ATTAINED at compliant_streak 3, so the call is refused with
          ERR_CONTROL_STILL_REQUIRED. Filing the fourth compliant result flips
          that goal to ATTAINED and the identical decommission call then
          succeeds; the goal that does not credit this control_type
          (attainment_status NOT_ATTAINED throughout) is irrelevant to the gate.
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment; plan approved with its VAPOR_MITIGATION control, which is certified PASS at 2027-01-15 and is therefore OPERATING."
            - "Four SAMPLING events on the RESTRICTED goal; at clock 2027-06-01 only three results are filed (240.00, 250.00, 245.00), leaving compliant_streak 3."
            - "No monitoring events exist on the UNRESTRICTED goal, and no no-further-action letter has been created."
          setup_api_calls:
