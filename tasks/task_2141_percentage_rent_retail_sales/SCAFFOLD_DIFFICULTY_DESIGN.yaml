            - "One ACTIVE lease with LeaseYear 1 OPEN, ARTIFICIAL breakpoint 40000000."
            - "The September report is ACCEPTED at 30,000,000 gross, so cumulative_net_sales_cents is 30,000,000 with no charge (below breakpoint)."
