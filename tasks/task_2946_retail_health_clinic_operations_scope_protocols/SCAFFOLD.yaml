# =============================================================================
# Task 2946 — Retail Health Clinic Operations & Scope Protocols
# Seed tables §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Retail Health Clinic Operations & Scope Protocols (CVS MinuteClinic): visit
  eligibility screening by age and presenting complaint against clinical
  protocols, walk-in queue and appointment blending with wait-time display,
  protocol-driven assessment with mandatory referral triggers to higher acuity,
  collaborating physician oversight and chart review sampling by state rules,
  prescription routing and pharmacy handoff with duplicate therapy checks,
  insurance eligibility check and transparent self-pay pricing, communication of
  the visit summary to the patient's primary care provider, clinician staffing
  across sites with float coverage and closure rules

domain_name: retail-health-clinic
# Flat root: every collection is a top-level path (/clinics, /visits, /queue-entries, ...).
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - ops_run_checkpoint

  entity_topology: flat
  # Peer entities linked by foreign keys in request bodies; no entity nesting in
  # URL paths. Sub-collections that do appear (/clinics/{id}/float-coverages,
  # /clinics/{id}/chart-review-samplings, /clinics/{id}/call-next) are ACTIONS
  # scoped to a clinic, not ownership paths — every resource is addressable flatly.

  state_machine_shape: parallel
  # Visit carries two independent dimensions (clinical_status × billing_status).
  # ChartReview is cyclic (PENDING ↔ CHANGES_REQUESTED), VisitSummary is cyclic
  # (QUEUED → FAILED → QUEUED), Assessment is branching (SUBMITTED forks into
  # REFERRAL_REQUIRED vs TREATMENT_AUTHORIZED with divergent side-effect sets),
  # Clinic is posture-derived (OPEN / LIMITED / CLOSED from on-duty headcount).

  relationship_patterns:
    - one_to_many          # Clinic → StaffingAssignment / QueueEntry / Visit
    - self_referential     # Prescription.supersedes_prescription_id, StaffingAssignment.covers_assignment_id
    - cross_aggregate      # ChartReview (oversight aggregate) references Visit + Assessment + Physician
    - polymorphic          # VisitSummary.destination_kind selects DIRECT_MESSAGE | FAX | PATIENT_PORTAL routing

  role_model: segregation_of_duties
  # The Physician who cosigned an Assessment may not attest the ChartReview that
  # samples the same Visit; ClinicAdmin must reassign to another eligible reviewer.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 52 endpoints (31 writes + 21 reads) / 61 error codes /
  # 15 calculations / 9 state-machine dimensions / 38 validation rules.
  # Density, not volume, carries the difficulty: staffing headcount drives clinic
  # posture which gates the queue which gates visits which gate assessments which
  # gate prescriptions and oversight, and money/oversight-load invariants must
  # survive the compensating actions on both ends of the chain.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StateRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; unique across StateRule (ERR_DUPLICATE_STATE_RULE)", constraints: "exactly 2 uppercase letters" }
      - { name: chart_review_sample_pct, type: integer, source: input, description: "Percent of eligible closed visits the collaborating physician must review", constraints: "0..100 inclusive" }
      - { name: review_deadline_hours, type: integer, source: input, description: "Hours after sampling by which a ChartReview must be attested; sets ChartReview.due_at", constraints: ">= 1" }
      - { name: collaborating_physician_required, type: boolean, source: input, description: "When true, every StaffingAssignment in this state must pin a supervising physician" }
      - { name: min_independent_practice_age_months, type: integer, source: input, description: "State floor on patient age in months for retail-clinic care; combined with Protocol.min_age_months via max()", constraints: ">= 0" }
      - { name: controlled_rx_allowed, type: boolean, source: input, description: "When false, prescriptions with therapy_class CONTROLLED_OPIOID are refused in this state" }
      - { name: max_supervised_clinicians_per_physician, type: integer, source: input, description: "State cap applied on top of Physician.max_supervised_clinicians; the effective cap is min() of the two", constraints: ">= 1" }

  - name: Protocol
    parent: null
    common_fields: true
    fields:
      - { name: complaint_code, type: enum, source: input, description: "Presenting complaint this protocol governs", constraints: "SORE_THROAT | EAR_PAIN | UTI | RASH | FLU_LIKE | SPORTS_PHYSICAL" }
      - { name: min_age_months, type: integer, source: input, description: "Protocol floor on patient age in months (inclusive, >=)", constraints: ">= 0" }
      - { name: max_age_months, type: integer, source: input, description: "Protocol ceiling on patient age in months (inclusive, <=)", constraints: "> min_age_months" }
      - { name: base_price_cents, type: integer, source: input, description: "Payer-allowed amount and self-pay list price for the base visit", constraints: "> 0" }
      - { name: acuity_tier, type: integer, source: input, description: "1 = routine, 2 = symptomatic, 3 = high-acuity; feeds queue_priority_score and chart-review ordering", constraints: "1 | 2 | 3" }
      - { name: red_flag_codes, type: array, source: input, description: "Finding codes that force an EMERGENCY_DEPARTMENT referral", constraints: "array of string, may be empty" }
      - { name: max_temp_c, type: number, source: input, description: "Temperature in Celsius at or above which (>=) an URGENT_CARE referral is mandatory", constraints: "one decimal place" }
      - { name: max_heart_rate_bpm, type: integer, source: input, description: "Heart rate strictly above which (>) an URGENT_CARE referral is mandatory" }
      - { name: min_spo2_pct, type: integer, source: input, description: "SpO2 strictly below which (<) an EMERGENCY_DEPARTMENT referral is mandatory" }
      - { name: requires_cosign, type: boolean, source: input, description: "When true, the Assessment must be cosigned by the pinned supervising physician before checkout" }
      - { name: allowed_state_codes, type: array, source: input, description: "State codes where this protocol may be delivered (ERR_PROTOCOL_NOT_OFFERED_IN_STATE)", constraints: "array of 2-letter codes, non-empty" }

  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store-level clinic name" }
      - { name: state_code, type: string, source: input, description: "State the clinic operates in; must equal an existing StateRule.state_code (ERR_STATE_RULE_NOT_FOUND)" }
      - { name: min_clinicians_required, type: integer, source: input, default: 1, description: "On-duty headcount at or above which the clinic is OPEN", constraints: ">= 1" }
      - { name: appointment_slots_per_hour, type: integer, source: input, description: "Aggregate cap on APPOINTMENT queue entries whose scheduled_at falls in the same clock hour", constraints: ">= 1" }
      - { name: walk_in_queue_capacity, type: integer, source: input, description: "Cap on QueueEntry rows with kind=WALK_IN and status=WAITING", constraints: ">= 1" }
      - { name: on_duty_clinician_count, type: integer, source: computed, default: 0, description: "= count(StaffingAssignment WHERE clinic_id == this.id AND status == ACTIVE)" }
      - { name: open_status, type: enum, source: computed, description: "CLOSED when on_duty_clinician_count == 0; LIMITED when 0 < on_duty_clinician_count < min_clinicians_required; OPEN when on_duty_clinician_count >= min_clinicians_required", constraints: "OPEN | LIMITED | CLOSED" }
      - { name: waiting_count, type: integer, source: computed, default: 0, description: "= count(QueueEntry WHERE clinic_id == this.id AND status == WAITING)" }
      - { name: posted_wait_minutes, type: integer, source: computed, default: 0, description: "Public wait display; output of calculations.wait_time_estimate variant POSTED_PROJECTION" }
      - { name: last_realized_wait_minutes, type: integer, source: computed, description: "Realized wait of the most recently CALLED QueueEntry at this clinic (null until the first call-next); output of calculations.wait_time_estimate variant REALIZED_ACTUAL" }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Collaborating physician name" }
      - { name: licensed_state_codes, type: array, source: input, description: "State codes this physician is licensed in (ERR_PHYSICIAN_NOT_LICENSED_IN_STATE)", constraints: "array of 2-letter codes, non-empty" }
      - { name: max_supervised_clinicians, type: integer, source: input, description: "Physician-level supervision cap; effective cap = min(this, StateRule.max_supervised_clinicians_per_physician)", constraints: ">= 1" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE physicians may be pinned and may review; INACTIVE cannot", constraints: "ACTIVE | INACTIVE" }
      - { name: current_supervised_count, type: integer, source: computed, default: 0, description: "Output of calculations.physician_supervision_load — distinct clinicians on non-terminal assignments pinned to this physician" }

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Nurse practitioner or physician assistant name" }
      - { name: credential, type: enum, source: input, description: "Licence class", constraints: "NP | PA" }
      - { name: license_state_code, type: string, source: input, description: "Single state this clinician is licensed in (ERR_CLINICIAN_NOT_LICENSED_IN_STATE)" }
      - { name: home_clinic_id, type: string, source: input, description: "FK -> Clinic.id; home site, preferred first in float-coverage ranking" }
      - { name: supervising_physician_id, type: string, source: input, description: "FK -> Physician.id; default collaborating physician pinned onto new StaffingAssignment rows" }
      - { name: float_eligible, type: boolean, source: input, default: false, description: "When true, this clinician is a candidate for float coverage at other sites in the same state" }
      - { name: scope_hold, type: boolean, source: computed, default: false, description: "Set true by a ChartReview attested with outcome SCOPE_DEVIATION; blocks assessment submission and float selection" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "= count(StaffingAssignment WHERE clinician_id == this.id AND status IN {SCHEDULED, ACTIVE}); float-coverage tie-break key" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: date_of_birth, type: string, source: input, description: "Calendar date YYYY-MM-DD; patient_age_months_at_visit is derived from it against the logical clock", constraints: "ISO calendar date, no time component" }
      - { name: payer_name, type: string, source: input, default: null, description: "Insurance payer name; null means the patient has no coverage on file" }
      - { name: member_id, type: string, source: input, default: null, description: "Payer member identifier; required when payer_name is present" }
      - { name: pcp_name, type: string, source: input, default: null, description: "Primary care provider name recorded for visit-summary communication" }
      - { name: pcp_direct_address, type: string, source: input, default: null, description: "Direct-messaging address or fax number of the PCP; drives VisitSummary.destination_kind selection" }
      - { name: pcp_accepts_electronic_summary, type: boolean, source: input, default: false, description: "When true the PCP accepts DIRECT_MESSAGE delivery; when false the summary falls back to FAX, then PATIENT_PORTAL" }
      - { name: pcp_consent_on_file, type: boolean, source: input, default: false, description: "Patient consent to disclose the visit summary to the PCP (ERR_PCP_CONSENT_MISSING)" }
      - { name: active_therapy_classes, type: array, source: computed, description: "Distinct therapy_class values of this patient's Prescription rows in status ROUTED; the duplicate-therapy lock set" }
      - { name: active_therapy_class_count, type: integer, source: computed, default: 0, description: "= length(active_therapy_classes); conserved quantity for the prescription route/cancel invariant" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Output of calculations.patient_outstanding_balance — sum of patient_responsibility_cents over INVOICED visits only" }

  - name: StaffingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; the site this shift staffs" }
      - { name: clinician_id, type: string, source: system, description: "FK -> Clinician.id; supplied by the client on POST /staffing-assignments, selected by the server on POST /clinics/{clinicId}/float-coverages" }
      - { name: covers_assignment_id, type: string, source: system, default: null, description: "FK -> StaffingAssignment.id; set only on FLOAT rows, pointing at the CANCELLED assignment being covered" }
      - { name: pinned_supervising_physician_id, type: string, source: system, default: null, description: "FK -> Physician.id; copied from Clinician.supervising_physician_id at creation and never re-read afterwards (version pinning)" }
      - { name: role_kind, type: enum, source: system, default: "PRIMARY", description: "PRIMARY for scheduled shifts, FLOAT for coverage created by the float-coverage endpoint", constraints: "PRIMARY | FLOAT" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start, inclusive; half-open interval [starts_at, ends_at)", constraints: "ISO 8601 UTC, 3 fractional digits" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end, exclusive; adjacency (prev.ends_at == next.starts_at) is legal", constraints: "> starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → ACTIVE → COMPLETED, or → CANCELLED", constraints: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED" }

  - name: QueueEntry
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; the queue this entry joins" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; who is waiting" }
      - { name: kind, type: enum, source: input, description: "WALK_IN joins WAITING immediately; APPOINTMENT is created SCHEDULED and must arrive", constraints: "WALK_IN | APPOINTMENT" }
      - { name: complaint_code, type: enum, source: input, description: "Presenting complaint, matched to a Protocol at visit creation", constraints: "SORE_THROAT | EAR_PAIN | UTI | RASH | FLU_LIKE | SPORTS_PHYSICAL" }
      - { name: acuity_tier, type: integer, source: computed, description: "Copied from the Protocol whose complaint_code equals this entry's complaint_code and whose allowed_state_codes contains the clinic's state_code" }
      - { name: scheduled_at, type: datetime, source: input, default: null, description: "Appointment slot start; required when kind == APPOINTMENT, forbidden when kind == WALK_IN", constraints: "ISO 8601 UTC, 3 fractional digits" }
      - { name: arrived_at, type: datetime, source: system, default: null, description: "Logical-clock instant the patient joined WAITING (creation time for WALK_IN, arrive time for APPOINTMENT)" }
      - { name: called_at, type: datetime, source: system, default: null, description: "Logical-clock instant the clinician called this entry from the queue" }
      - { name: priority_score, type: integer, source: computed, default: 0, description: "Output of calculations.queue_priority_score; recomputed on every call-next evaluation" }
      - { name: realized_wait_minutes, type: integer, source: computed, default: null, description: "Output of calculations.wait_time_estimate variant REALIZED_ACTUAL; null until called_at is set" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → WAITING → CALLED → SERVED, or → ABANDONED | DEFERRED_CLOSURE", constraints: "SCHEDULED | WAITING | CALLED | SERVED | ABANDONED | DEFERRED_CLOSURE" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; where care is delivered" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the queue entry" }
      - { name: queue_entry_id, type: string, source: input, description: "FK -> QueueEntry.id; must be in status CALLED" }
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; resolved from queue_entry.complaint_code and the clinic's state_code" }
      - { name: clinician_id, type: string, source: system, default: null, description: "FK -> Clinician.id; the clinician who called the queue entry" }
      - { name: complaint_code, type: enum, source: system, description: "Copied from the queue entry", constraints: "SORE_THROAT | EAR_PAIN | UTI | RASH | FLU_LIKE | SPORTS_PHYSICAL" }
      - { name: patient_age_months_at_visit, type: integer, source: computed, description: "Whole months (floor) from Patient.date_of_birth to the logical clock at visit creation; frozen thereafter" }
      - { name: clinical_status, type: enum, source: system, description: "Dimension 1: SCREENING → IN_ASSESSMENT → {TREATED | REFERRED} → CLOSED, with a closure fork to CANCELLED_CLOSURE", constraints: "SCREENING | IN_ASSESSMENT | TREATED | REFERRED | CLOSED | CANCELLED_CLOSURE" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "Dimension 2: UNBILLED → COVERAGE_VERIFIED | SELF_PAY_QUOTED → SELF_PAY_ACCEPTED → INVOICED → VOIDED; evolves independently of clinical_status", constraints: "UNBILLED | COVERAGE_VERIFIED | SELF_PAY_QUOTED | SELF_PAY_ACCEPTED | INVOICED | VOIDED" }
      - { name: self_pay, type: boolean, source: computed, default: false, description: "True when the eligibility check resolved coverage_status to INACTIVE or UNKNOWN, or the patient has no payer_name" }
      - { name: coverage_status, type: enum, source: computed, default: "UNVERIFIED", description: "Result of the eligibility check", constraints: "UNVERIFIED | ACTIVE | INACTIVE | UNKNOWN" }
      - { name: copay_cents, type: integer, source: computed, default: null, description: "Flat patient copay reported by the eligibility check; null when self_pay is true" }
      - { name: coinsurance_pct, type: number, source: computed, default: null, description: "Patient coinsurance percentage reported by the eligibility check (e.g. 12.5); null when self_pay is true" }
      - { name: quoted_price_cents, type: integer, source: computed, default: null, description: "Output of calculations.visit_price_quote — the patient-facing estimate produced by the eligibility check" }
      - { name: final_price_cents, type: integer, source: computed, default: null, description: "Output of calculations.visit_price_final — total allowed amount for all billed lines at checkout" }
      - { name: patient_responsibility_cents, type: integer, source: computed, default: null, description: "Patient share of final_price_cents at checkout" }
      - { name: payer_responsibility_cents, type: integer, source: computed, default: null, description: "= final_price_cents - patient_responsibility_cents; 0 when self_pay is true" }
      - { name: services_rendered, type: array, source: input, description: "Add-on services recorded at checkout", constraints: "subset of RAPID_STREP_TEST | URINALYSIS | INJECTION_ADMIN | EKG" }
      - { name: referral_required, type: boolean, source: computed, default: false, description: "Set true by assessment submission when calculations.referral_trigger_evaluation fires" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the visit being assessed" }
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; copied from the visit so protocol edits after creation cannot change the evaluation" }
      - { name: cosigned_by_physician_id, type: string, source: system, default: null, description: "FK -> Physician.id; the physician who cosigned this assessment" }
      - { name: temp_c, type: number, source: input, description: "Temperature in Celsius", constraints: "one decimal place, 30.0..43.0" }
      - { name: heart_rate_bpm, type: integer, source: input, description: "Heart rate in beats per minute", constraints: "20..250" }
      - { name: spo2_pct, type: integer, source: input, description: "Peripheral oxygen saturation percentage", constraints: "50..100" }
      - { name: red_flag_codes, type: array, source: input, description: "Findings observed; intersection with Protocol.red_flag_codes forces an ED referral", constraints: "array of string, may be empty" }
      - { name: referral_destination, type: enum, source: computed, default: null, description: "Set on submission when a referral is mandatory", constraints: "EMERGENCY_DEPARTMENT | URGENT_CARE | PCP_FOLLOW_UP" }
      - { name: referral_reason_code, type: enum, source: computed, default: null, description: "First matching trigger in precedence order RED_FLAG > HYPOXIA > FEVER_THRESHOLD > TACHYCARDIA", constraints: "RED_FLAG | HYPOXIA | FEVER_THRESHOLD | TACHYCARDIA" }
      - { name: cosigned_at, type: datetime, source: system, default: null, description: "Logical-clock instant of cosign" }
      - { name: status, type: enum, source: system, description: "DRAFT forks on submission into {REFERRAL_REQUIRED | TREATMENT_AUTHORIZED}, either of which may reach COSIGNED", constraints: "DRAFT | REFERRAL_REQUIRED | TREATMENT_AUTHORIZED | COSIGNED" }

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the visit that authorises this prescription" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the visit" }
      - { name: prescriber_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the visit's clinician_id" }
      - { name: supersedes_prescription_id, type: string, source: input, default: null, description: "FK -> Prescription.id; when set, the named prescription is cancelled by this creation and the duplicate-therapy check ignores it" }
      - { name: drug_name, type: string, source: input, description: "Dispensed product name" }
      - { name: therapy_class, type: enum, source: input, description: "Therapeutic class used by the duplicate-therapy check", constraints: "ANTIBIOTIC_BETA_LACTAM | ANTIBIOTIC_MACROLIDE | ANALGESIC_NSAID | ANTIHISTAMINE | CONTROLLED_OPIOID" }
      - { name: days_supply, type: integer, source: input, description: "Days of therapy dispensed", constraints: "1..90" }
      - { name: pharmacy_npi, type: string, source: input, description: "Receiving pharmacy NPI for the handoff", constraints: "10 digits" }
      - { name: routed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the prescription was handed off to the pharmacy" }
      - { name: status, type: enum, source: system, description: "DRAFT → ROUTED (pharmacy handoff), or → CANCELLED from DRAFT/ROUTED", constraints: "DRAFT | ROUTED | CANCELLED" }

  - name: ChartReview
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> Visit.id; the sampled visit" }
      - { name: assessment_id, type: string, source: system, description: "FK -> Assessment.id; the assessment under review" }
      - { name: reviewer_physician_id, type: string, source: system, description: "FK -> Physician.id; current reviewer, initially the assignment's pinned physician" }
      - { name: sampled_reason, type: enum, source: system, description: "Why this visit entered the review set", constraints: "RANDOM_SAMPLE | MANDATORY_REFERRAL | CONTROLLED_RX" }
      - { name: due_at, type: datetime, source: system, description: "= sampling instant + StateRule.review_deadline_hours" }
      - { name: changes_requested_count, type: integer, source: computed, default: 0, description: "Number of completed PENDING → CHANGES_REQUESTED cycles; capped at MAX_CHANGE_CYCLES" }
      - { name: outcome, type: enum, source: system, default: null, description: "Recorded at attestation", constraints: "WITHIN_SCOPE | SCOPE_DEVIATION" }
      - { name: status, type: enum, source: system, description: "PENDING ↔ CHANGES_REQUESTED (cycle), PENDING → ATTESTED | ESCALATED", constraints: "PENDING | CHANGES_REQUESTED | ATTESTED | ESCALATED" }

  - name: VisitSummary
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> Visit.id; the visit whose summary is communicated to the PCP" }
      - { name: destination_kind, type: enum, source: system, description: "DIRECT_MESSAGE when the PCP accepts electronic summaries, FAX when a pcp_direct_address exists without electronic acceptance, PATIENT_PORTAL when neither", constraints: "DIRECT_MESSAGE | FAX | PATIENT_PORTAL" }
      - { name: destination_address, type: string, source: system, default: null, description: "Patient.pcp_direct_address at creation time, or null for PATIENT_PORTAL" }
      - { name: includes_referral, type: boolean, source: system, default: false, description: "True when the visit ended in clinical_status REFERRED" }
      - { name: attempt_count, type: integer, source: computed, default: 0, description: "Number of transmit attempts; capped at MAX_TRANSMIT_ATTEMPTS (3)" }
      - { name: last_error_code, type: string, source: system, default: null, description: "Failure code recorded by the most recent failed transmit attempt" }
      - { name: sent_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the successful transmission" }
      - { name: status, type: enum, source: system, description: "QUEUED → SENT, QUEUED → FAILED → QUEUED (retry cycle), QUEUED → UNDELIVERABLE at the attempt cap", constraints: "QUEUED | SENT | FAILED | UNDELIVERABLE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Clinic posture — derived from on-duty headcount; gates every queue operation.
  # All transitions are system transitions fired by staffing side effects.
  # ---------------------------------------------------------------------------
  - entity: Clinic
    dimension: open_status
    initial_state: CLOSED
    terminal_states: []
    transitions:
      - from: CLOSED
        to: LIMITED
        trigger: "system — recompute after StaffingAssignment activation/creation raises on_duty_clinician_count into 0 < count < min_clinicians_required"
        actor: system
        preconditions:
          - "on_duty_clinician_count > 0"
          - "on_duty_clinician_count < min_clinicians_required"
        side_effects:
          - "recompute Clinic.posted_wait_minutes via calculations.wait_time_estimate (POSTED_PROJECTION)"
          - "increments Clinic.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "system — recompute after StaffingAssignment activation/creation raises on_duty_clinician_count to >= min_clinicians_required"
        actor: system
        preconditions:
          - "on_duty_clinician_count >= min_clinicians_required"
        side_effects:
          - "recompute Clinic.posted_wait_minutes via calculations.wait_time_estimate (POSTED_PROJECTION)"
          - "increments Clinic.version by 1"
      - from: LIMITED
        to: OPEN
        trigger: "system — recompute after StaffingAssignment activation or float coverage raises on_duty_clinician_count to >= min_clinicians_required"
        actor: system
        preconditions:
          - "on_duty_clinician_count >= min_clinicians_required"
        side_effects:
          - "recompute Clinic.posted_wait_minutes via calculations.wait_time_estimate (POSTED_PROJECTION)"
          - "increments Clinic.version by 1"
        note: "QueueEntry rows already in DEFERRED_CLOSURE are NOT restored — DEFERRED_CLOSURE is terminal."
      - from: OPEN
        to: LIMITED
        trigger: "system — recompute after StaffingAssignment cancellation/completion drops on_duty_clinician_count below min_clinicians_required but above 0"
        actor: system
        preconditions:
          - "on_duty_clinician_count > 0"
          - "on_duty_clinician_count < min_clinicians_required"
        side_effects:
          - "cascade: every QueueEntry with clinic_id == this.id AND kind == WALK_IN AND status == WAITING transitions WAITING → DEFERRED_CLOSURE (APPOINTMENT entries are untouched)"
          - "recompute Clinic.waiting_count, then Clinic.posted_wait_minutes"
          - "increments Clinic.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "system — recompute after the last ACTIVE StaffingAssignment is cancelled or completed (on_duty_clinician_count reaches 0)"
        actor: system
        preconditions:
          - "on_duty_clinician_count == 0"
        side_effects:
          - "cascade: every QueueEntry with clinic_id == this.id AND status IN {SCHEDULED, WAITING} transitions to DEFERRED_CLOSURE regardless of kind"
          - "cascade: every Visit with clinic_id == this.id AND clinical_status == SCREENING transitions to CANCELLED_CLOSURE (the patient was called but never assessed)"
          - "recompute Clinic.waiting_count (reaches 0), then Clinic.posted_wait_minutes (reaches 0) — caused by the queue transitions above, not directly by the posture change"
          - "increments Clinic.version by 1"
      - from: LIMITED
        to: CLOSED
        trigger: "system — recompute after the last ACTIVE StaffingAssignment is cancelled or completed (on_duty_clinician_count reaches 0)"
        actor: system
        preconditions:
          - "on_duty_clinician_count == 0"
        side_effects:
          - "cascade: every QueueEntry with clinic_id == this.id AND status IN {SCHEDULED, WAITING} transitions to DEFERRED_CLOSURE regardless of kind"
          - "cascade: every Visit with clinic_id == this.id AND clinical_status == SCREENING transitions to CANCELLED_CLOSURE (the patient was called but never assessed)"
          - "recompute Clinic.waiting_count (reaches 0), then Clinic.posted_wait_minutes (reaches 0) — caused by the queue transitions above, not directly by the posture change"
          - "increments Clinic.version by 1"

  # ---------------------------------------------------------------------------
  # StaffingAssignment — clock-driven activation/completion, cancellation cascade.
  # ---------------------------------------------------------------------------
  - entity: StaffingAssignment
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /staffing-assignments when starts_at <= logical clock < ends_at (same request), or POST /_clock/set_current_utc advancing the clock to starts_at or later"
        actor: system
        preconditions:
          - "starts_at <= logical_clock"
          - "logical_clock < ends_at"
        side_effects:
          - "Clinic.on_duty_clinician_count += 1, then Clinic.open_status is re-derived (may fire CLOSED → LIMITED or CLOSED → OPEN or LIMITED → OPEN)"
          - "recompute Physician.current_supervised_count for pinned_supervising_physician_id"
          - "recompute Clinician.active_assignment_count"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /_clock/set_current_utc advancing the clock to ends_at or later"
        actor: system
        preconditions:
          - "logical_clock >= ends_at"
        side_effects:
          - "Clinic.on_duty_clinician_count -= 1, then Clinic.open_status is re-derived (may fire OPEN → LIMITED, OPEN → CLOSED or LIMITED → CLOSED with their queue cascades)"
          - "recompute Physician.current_supervised_count for pinned_supervising_physician_id"
          - "recompute Clinician.active_assignment_count"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /staffing-assignments/{assignmentId}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "recompute Physician.current_supervised_count for pinned_supervising_physician_id (drops by 1 when this was the physician's only assignment for that clinician)"
          - "recompute Clinician.active_assignment_count"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /staffing-assignments/{assignmentId}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "cascade hop 1: Clinic.on_duty_clinician_count -= 1"
          - "cascade hop 2: that counter change re-derives Clinic.open_status (OPEN → LIMITED when 0 < count < min_clinicians_required, OPEN/LIMITED → CLOSED when count == 0)"
          - "cascade hop 3: the posture change transitions WAITING QueueEntry rows to DEFERRED_CLOSURE per the Clinic transition's cascade scope (WALK_IN only for LIMITED, all kinds for CLOSED), and — for CLOSED — every SCREENING Visit at the clinic to CANCELLED_CLOSURE"
          - "cascade hop 4: the QueueEntry transitions from hop 3 are what force Clinic.waiting_count to be recomputed, and that new waiting_count is what re-derives Clinic.posted_wait_minutes"
          - "recompute Physician.current_supervised_count for pinned_supervising_physician_id"
          - "recompute Clinician.active_assignment_count"

  # ---------------------------------------------------------------------------
  # QueueEntry — walk-in / appointment blending.
  # ---------------------------------------------------------------------------
  - entity: QueueEntry
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [SERVED, ABANDONED, DEFERRED_CLOSURE]
    transitions:
      - from: SCHEDULED
        to: WAITING
        trigger: "POST /queue-entries with kind == WALK_IN (auto-advanced inside the same request)"
        actor: system
        preconditions:
          - "kind == WALK_IN"
          - "Clinic.open_status == OPEN (ERR_WALK_IN_SUSPENDED when LIMITED, ERR_CLINIC_CLOSED when CLOSED)"
          - "count(QueueEntry WHERE clinic_id == this.clinic_id AND kind == WALK_IN AND status == WAITING) < Clinic.walk_in_queue_capacity"
        side_effects:
          - "arrived_at := logical clock"
          - "priority_score := calculations.queue_priority_score"
          - "Clinic.waiting_count += 1, then Clinic.posted_wait_minutes recomputed"
      - from: SCHEDULED
        to: WAITING
        trigger: "POST /queue-entries/{queueEntryId}/arrive"
        actor: FrontDeskAgent
        preconditions:
          - "kind == APPOINTMENT"
          - "status == SCHEDULED (ERR_QUEUE_ENTRY_INVALID_STATE)"
          - "Clinic.open_status IN {OPEN, LIMITED} (ERR_CLINIC_CLOSED)"
          - "logical clock within [scheduled_at - 15 min, scheduled_at + 10 min] inclusive (ERR_APPOINTMENT_WINDOW_CLOSED)"
        side_effects:
          - "arrived_at := logical clock"
          - "priority_score := calculations.queue_priority_score (on-time appointment bonus applies)"
          - "Clinic.waiting_count += 1, then Clinic.posted_wait_minutes recomputed"
      - from: WAITING
        to: CALLED
        trigger: "POST /clinics/{clinicId}/call-next"
        actor: Clinician
        preconditions:
          - "the entry is the winner of calculations.call_next_selection over this clinic's WAITING entries"
          - "Clinic.open_status IN {OPEN, LIMITED} (ERR_CLINIC_CLOSED)"
          - "the acting Clinician has a StaffingAssignment at this clinic in status ACTIVE (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "called_at := logical clock"
          - "realized_wait_minutes := calculations.wait_time_estimate variant REALIZED_ACTUAL"
          - "Clinic.last_realized_wait_minutes := this entry's realized_wait_minutes"
          - "Clinic.waiting_count -= 1, then Clinic.posted_wait_minutes recomputed"
      - from: CALLED
        to: SERVED
        trigger: "POST /visits (the visit that consumes this queue entry, same request)"
        actor: system
        preconditions:
          - "status == CALLED"
          - "no other Visit already references this queue_entry_id"
        side_effects:
          - "Visit created in clinical_status SCREENING"
      - from: WAITING
        to: ABANDONED
        trigger: "POST /_clock/set_current_utc advancing the clock past arrived_at + 120 minutes without a call"
        actor: system
        preconditions:
          - "status == WAITING"
          - "logical_clock >= arrived_at + 120 minutes"
        side_effects:
          - "Clinic.waiting_count -= 1, then Clinic.posted_wait_minutes recomputed"
      - from: WAITING
        to: DEFERRED_CLOSURE
        trigger: "system — Clinic posture cascade (OPEN → LIMITED defers WALK_IN only; any → CLOSED defers all kinds)"
        actor: system
        preconditions:
          - "status == WAITING"
        side_effects:
          - "Clinic.waiting_count -= 1, then Clinic.posted_wait_minutes recomputed"
        note: "A WAITING entry has no Visit yet (a Visit consumes a CALLED entry and moves it to SERVED); visits already opened are cancelled by the Clinic → CLOSED transition itself."
      - from: SCHEDULED
        to: DEFERRED_CLOSURE
        trigger: "system — Clinic posture cascade to CLOSED"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "Clinic.open_status == CLOSED"
        side_effects: []

  # ---------------------------------------------------------------------------
  # Visit — DIMENSION 1 of 2 (parallel machine): clinical_status.
  # Evolves independently of billing_status; the two dimensions only meet at
  # checkout, which requires a settled billing state.
  # ---------------------------------------------------------------------------
  - entity: Visit
    dimension: clinical_status
    initial_state: SCREENING
    terminal_states: [CLOSED, CANCELLED_CLOSURE]
    transitions:
      - from: SCREENING
        to: IN_ASSESSMENT
        trigger: "POST /assessments"
        actor: Clinician
        preconditions:
          - "clinical_status == SCREENING (ERR_VISIT_INVALID_STATE)"
          - "acting clinician id == Visit.clinician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Clinician.scope_hold == false (ERR_SCOPE_HOLD_ACTIVE)"
          - "Clinic.open_status IN {OPEN, LIMITED} (ERR_CLINIC_CLOSED)"
        side_effects:
          - "Assessment created in status DRAFT with protocol_id copied from Visit.protocol_id"
          - "increments Visit.version by 1"
      - from: IN_ASSESSMENT
        to: REFERRED
        trigger: "system — Assessment DRAFT → REFERRAL_REQUIRED (cascade hop 2 of the assessment-submit chain)"
        actor: system
        preconditions:
          - "the assessment's calculations.referral_trigger_evaluation returned a non-null referral_destination"
        side_effects:
          - "Visit.referral_required := true"
          - "cascade hop 3: every Prescription with visit_id == this.id AND status IN {DRAFT, ROUTED} transitions to CANCELLED"
          - "cascade hop 4: each cancelled prescription recomputes Patient.active_therapy_classes and Patient.active_therapy_class_count for Prescription.patient_id"
          - "increments Visit.version by 1"
      - from: IN_ASSESSMENT
        to: TREATED
        trigger: "system — Assessment DRAFT → TREATMENT_AUTHORIZED (no referral trigger fired)"
        actor: system
        preconditions:
          - "the assessment's calculations.referral_trigger_evaluation returned a null referral_destination"
        side_effects:
          - "Visit.referral_required := false"
          - "increments Visit.version by 1"
        note: "Divergent branch of the same fork: no prescription cascade, and prescribing becomes legal."
      - from: TREATED
        to: CLOSED
        trigger: "POST /visits/{visitId}/checkout"
        actor: Clinician
        preconditions:
          - "clinical_status == TREATED (ERR_VISIT_INVALID_STATE)"
          - "billing_status IN {COVERAGE_VERIFIED, SELF_PAY_ACCEPTED} (ERR_QUOTE_REQUIRED)"
          - "when Protocol.requires_cosign == true, the visit's Assessment.status == COSIGNED (ERR_COSIGN_REQUIRED)"
        side_effects:
          - "final_price_cents / patient_responsibility_cents / payer_responsibility_cents := calculations.visit_price_final"
          - "billing_status := INVOICED (billing dimension transition)"
          - "recompute Patient.outstanding_balance_cents via calculations.patient_outstanding_balance"
          - "VisitSummary created in status QUEUED when Patient.pcp_consent_on_file == true (destination_kind per calculations.summary_destination_selection); no summary is created otherwise"
          - "increments Visit.version by 1"
      - from: REFERRED
        to: CLOSED
        trigger: "POST /visits/{visitId}/checkout"
        actor: Clinician
        preconditions:
          - "clinical_status == REFERRED (ERR_VISIT_INVALID_STATE)"
          - "billing_status IN {COVERAGE_VERIFIED, SELF_PAY_ACCEPTED} (ERR_QUOTE_REQUIRED)"
        side_effects:
          - "final_price_cents := calculations.visit_price_final variant REFERRAL_TRUNCATED (add-on lines are excluded)"
          - "billing_status := INVOICED (billing dimension transition)"
          - "recompute Patient.outstanding_balance_cents"
          - "VisitSummary created in status QUEUED with includes_referral := true when Patient.pcp_consent_on_file == true"
          - "increments Visit.version by 1"
        note: "Cosign is NOT required to close a referred visit — the referral itself is the escalation."
      - from: SCREENING
        to: CANCELLED_CLOSURE
        trigger: "system — Clinic posture cascade to CLOSED: the visit's clinic lost its last on-duty clinician while this visit was still SCREENING"
        actor: system
        preconditions:
          - "clinical_status == SCREENING"
        side_effects:
          - "increments Visit.version by 1"

  # ---------------------------------------------------------------------------
  # Visit — DIMENSION 2 of 2 (parallel machine): billing_status.
  # ---------------------------------------------------------------------------
  - entity: Visit
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [VOIDED]
    transitions:
      - from: UNBILLED
        to: COVERAGE_VERIFIED
        trigger: "POST /visits/{visitId}/eligibility-check with coverage_status == ACTIVE"
        actor: FrontDeskAgent
        preconditions:
          - "billing_status == UNBILLED (ERR_VISIT_INVALID_STATE)"
          - "clinical_status NOT IN {CLOSED, CANCELLED_CLOSURE} (ERR_VISIT_INVALID_STATE)"
          - "Patient.payer_name is not null (ERR_PAYMENT_METHOD_REQUIRED)"
          - "copay_cents and coinsurance_pct are present in the request (ERR_VALIDATION)"
        side_effects:
          - "coverage_status := ACTIVE, self_pay := false, copay_cents / coinsurance_pct stored on the Visit"
          - "quoted_price_cents := calculations.visit_price_quote variant INSURED_ESTIMATE"
          - "increments Visit.version by 1"
      - from: UNBILLED
        to: SELF_PAY_QUOTED
        trigger: "POST /visits/{visitId}/eligibility-check with coverage_status IN {INACTIVE, UNKNOWN}"
        actor: FrontDeskAgent
        preconditions:
          - "billing_status == UNBILLED (ERR_VISIT_INVALID_STATE)"
          - "clinical_status NOT IN {CLOSED, CANCELLED_CLOSURE} (ERR_VISIT_INVALID_STATE)"
        side_effects:
          - "coverage_status := the submitted value, self_pay := true, copay_cents := null, coinsurance_pct := null"
          - "quoted_price_cents := calculations.visit_price_quote variant SELF_PAY_TRANSPARENT"
          - "increments Visit.version by 1"
      - from: SELF_PAY_QUOTED
        to: SELF_PAY_ACCEPTED
        trigger: "POST /visits/{visitId}/accept-self-pay"
        actor: Patient
        preconditions:
          - "billing_status == SELF_PAY_QUOTED (ERR_VISIT_INVALID_STATE)"
          - "acting patient id == Visit.patient_id when the actor is Patient (ERR_FORBIDDEN_OWNERSHIP)"
          - "acknowledged_price_cents == Visit.quoted_price_cents (ERR_QUOTE_MISMATCH)"
        side_effects:
          - "increments Visit.version by 1"
      - from: COVERAGE_VERIFIED
        to: INVOICED
        trigger: "POST /visits/{visitId}/checkout (clinical dimension moves TREATED|REFERRED → CLOSED in the same request)"
        actor: Clinician
        preconditions:
          - "billing_status == COVERAGE_VERIFIED"
        side_effects:
          - "patient_responsibility_cents / payer_responsibility_cents set by calculations.visit_price_final"
          - "Patient.outstanding_balance_cents recomputed"
      - from: SELF_PAY_ACCEPTED
        to: INVOICED
        trigger: "POST /visits/{visitId}/checkout (clinical dimension moves TREATED|REFERRED → CLOSED in the same request)"
        actor: Clinician
        preconditions:
          - "billing_status == SELF_PAY_ACCEPTED"
        side_effects:
          - "patient_responsibility_cents := final_price_cents, payer_responsibility_cents := 0"
          - "Patient.outstanding_balance_cents recomputed"
      - from: INVOICED
        to: VOIDED
        trigger: "POST /visits/{visitId}/charge-void"
        actor: ClinicAdmin
        preconditions:
          - "billing_status == INVOICED (ERR_CHARGE_NOT_VOIDABLE)"
        side_effects:
          - "final_price_cents / patient_responsibility_cents / payer_responsibility_cents are retained for audit and NOT cleared"
          - "Patient.outstanding_balance_cents recomputed — VOIDED visits leave the sum, so the balance returns to its pre-checkout value"
          - "increments Visit.version by 1"

  # ---------------------------------------------------------------------------
  # Assessment — branching fork on submission with divergent side-effect sets.
  # ---------------------------------------------------------------------------
  - entity: Assessment
    dimension: status
    initial_state: DRAFT
    terminal_states: [COSIGNED]
    transitions:
      - from: DRAFT
        to: REFERRAL_REQUIRED
        trigger: "POST /assessments/{assessmentId}/submit — branch taken when calculations.referral_trigger_evaluation returns a destination"
        actor: Clinician
        preconditions:
          - "status == DRAFT (ERR_ASSESSMENT_INVALID_STATE)"
          - "acting clinician id == Visit.clinician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Clinician.scope_hold == false (ERR_SCOPE_HOLD_ACTIVE)"
        side_effects:
          - "referral_destination and referral_reason_code set per calculations.referral_trigger_evaluation"
          - "cascade hop 1 → 2: this status change drives the linked Visit IN_ASSESSMENT → REFERRED (which itself cancels the visit's prescriptions, which itself recomputes the patient's therapy-class lock set)"
      - from: DRAFT
        to: TREATMENT_AUTHORIZED
        trigger: "POST /assessments/{assessmentId}/submit — branch taken when calculations.referral_trigger_evaluation returns null"
        actor: Clinician
        preconditions:
          - "status == DRAFT (ERR_ASSESSMENT_INVALID_STATE)"
          - "acting clinician id == Visit.clinician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Clinician.scope_hold == false (ERR_SCOPE_HOLD_ACTIVE)"
        side_effects:
          - "referral_destination and referral_reason_code stay null"
          - "the linked Visit transitions IN_ASSESSMENT → TREATED; no prescription cascade fires"
      - from: TREATMENT_AUTHORIZED
        to: COSIGNED
        trigger: "POST /assessments/{assessmentId}/cosign"
        actor: CollaboratingPhysician
        preconditions:
          - "status == TREATMENT_AUTHORIZED (ERR_ASSESSMENT_INVALID_STATE)"
          - "Protocol.requires_cosign == true (ERR_COSIGN_NOT_REQUIRED)"
          - "acting physician id == the visit clinician's ACTIVE StaffingAssignment.pinned_supervising_physician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Clinic.state_code IN Physician.licensed_state_codes (ERR_PHYSICIAN_NOT_LICENSED_IN_STATE)"
        side_effects:
          - "cosigned_by_physician_id := acting physician id, cosigned_at := logical clock"
      - from: REFERRAL_REQUIRED
        to: COSIGNED
        trigger: "POST /assessments/{assessmentId}/cosign"
        actor: CollaboratingPhysician
        preconditions:
          - "status == REFERRAL_REQUIRED (ERR_ASSESSMENT_INVALID_STATE)"
          - "Protocol.requires_cosign == true (ERR_COSIGN_NOT_REQUIRED)"
          - "acting physician id == the visit clinician's ACTIVE StaffingAssignment.pinned_supervising_physician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Clinic.state_code IN Physician.licensed_state_codes (ERR_PHYSICIAN_NOT_LICENSED_IN_STATE)"
        side_effects:
          - "cosigned_by_physician_id := acting physician id, cosigned_at := logical clock"
        note: "Cosigning a referred assessment is what later collides with the segregation-of-duties rule at chart-review attestation."

  # ---------------------------------------------------------------------------
  # Prescription — pharmacy handoff with compensating cancellation.
  # ---------------------------------------------------------------------------
  - entity: Prescription
    dimension: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ROUTED
        trigger: "POST /prescriptions/{prescriptionId}/route"
        actor: Clinician
        preconditions:
          - "status == DRAFT (ERR_PRESCRIPTION_INVALID_STATE)"
          - "Visit.clinical_status == TREATED (ERR_VISIT_NOT_TREATABLE)"
          - "Visit.referral_required == false (ERR_REFERRAL_REQUIRED)"
          - "therapy_class NOT IN Patient.active_therapy_classes, excluding the class of supersedes_prescription_id (ERR_DUPLICATE_THERAPY)"
        side_effects:
          - "routed_at := logical clock"
          - "Patient.active_therapy_classes gains this therapy_class; Patient.active_therapy_class_count recomputed"
          - "when supersedes_prescription_id is set, that prescription transitions ROUTED → CANCELLED and the patient's lock set is recomputed afterwards"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /prescriptions/{prescriptionId}/cancel, or system cascade from Visit IN_ASSESSMENT → REFERRED"
        actor: Clinician
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "no change to Patient.active_therapy_classes (a DRAFT prescription never held a lock)"
      - from: ROUTED
        to: CANCELLED
        trigger: "POST /prescriptions/{prescriptionId}/cancel, system cascade from Visit IN_ASSESSMENT → REFERRED, or supersession by a newer prescription"
        actor: Clinician
        preconditions:
          - "status == ROUTED"
        side_effects:
          - "Patient.active_therapy_classes loses this therapy_class unless another ROUTED prescription still holds it; Patient.active_therapy_class_count recomputed"
          - "compensation: the pair (route, cancel) leaves Patient.active_therapy_class_count exactly at its pre-route value"

  # ---------------------------------------------------------------------------
  # ChartReview — CYCLIC oversight loop (PENDING ↔ CHANGES_REQUESTED).
  # ---------------------------------------------------------------------------
  - entity: ChartReview
    dimension: status
    initial_state: PENDING
    terminal_states: [ATTESTED, ESCALATED]
    transitions:
      - from: PENDING
        to: CHANGES_REQUESTED
        trigger: "POST /chart-reviews/{chartReviewId}/request-changes"
        actor: CollaboratingPhysician
        preconditions:
          - "status == PENDING (ERR_CHART_REVIEW_INVALID_STATE)"
          - "acting physician id == reviewer_physician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "changes_requested_count < MAX_CHANGE_CYCLES (ERR_REVIEW_CYCLE_LIMIT)"
        side_effects:
          - "changes_requested_count += 1"
      - from: CHANGES_REQUESTED
        to: PENDING
        trigger: "POST /chart-reviews/{chartReviewId}/resubmit"
        actor: Clinician
        preconditions:
          - "status == CHANGES_REQUESTED (ERR_CHART_REVIEW_INVALID_STATE)"
          - "acting clinician id == the reviewed Visit.clinician_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
        note: "Closes the cycle: the same review may return to PENDING up to MAX_CHANGE_CYCLES times."
      - from: PENDING
        to: ATTESTED
        trigger: "POST /chart-reviews/{chartReviewId}/attest with outcome == WITHIN_SCOPE"
        actor: CollaboratingPhysician
        preconditions:
          - "status == PENDING (ERR_CHART_REVIEW_INVALID_STATE)"
          - "acting physician id == reviewer_physician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "reviewer_physician_id != Assessment.cosigned_by_physician_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "outcome := WITHIN_SCOPE"
      - from: PENDING
        to: ESCALATED
        trigger: "POST /chart-reviews/{chartReviewId}/attest with outcome == SCOPE_DEVIATION"
        actor: CollaboratingPhysician
        preconditions:
          - "status == PENDING (ERR_CHART_REVIEW_INVALID_STATE)"
          - "acting physician id == reviewer_physician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "reviewer_physician_id != Assessment.cosigned_by_physician_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "outcome := SCOPE_DEVIATION"
          - "the reviewed Visit's Clinician.scope_hold := true, which blocks POST /assessments and POST /assessments/{id}/submit for that clinician and removes them from float-coverage candidacy"
      - from: PENDING
        to: PENDING
        trigger: "POST /chart-reviews/{chartReviewId}/reassign"
        actor: ClinicAdmin
        preconditions:
          - "status == PENDING (ERR_CHART_REVIEW_INVALID_STATE)"
          - "calculations.reviewer_reassignment_selection yields a candidate (ERR_NO_ELIGIBLE_REVIEWER when the pool is empty)"
        side_effects:
          - "reviewer_physician_id := the selected physician; due_at is unchanged"

  # ---------------------------------------------------------------------------
  # VisitSummary — CYCLIC retry loop (QUEUED → FAILED → QUEUED).
  # ---------------------------------------------------------------------------
  - entity: VisitSummary
    dimension: status
    initial_state: QUEUED
    terminal_states: [SENT, UNDELIVERABLE]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /visit-summaries/{visitSummaryId}/transmit with transport_outcome == SENT"
        actor: ClinicAdmin
        preconditions:
          - "status == QUEUED (ERR_SUMMARY_INVALID_STATE)"
        side_effects:
          - "attempt_count += 1, sent_at := logical clock, last_error_code := null"
      - from: QUEUED
        to: FAILED
        trigger: "POST /visit-summaries/{visitSummaryId}/transmit with transport_outcome == FAILED and attempt_count + 1 < MAX_TRANSMIT_ATTEMPTS"
        actor: ClinicAdmin
        preconditions:
          - "status == QUEUED (ERR_SUMMARY_INVALID_STATE)"
          - "attempt_count + 1 < MAX_TRANSMIT_ATTEMPTS (3)"
        side_effects:
          - "attempt_count += 1, last_error_code := the submitted failure_code"
      - from: FAILED
        to: QUEUED
        trigger: "POST /visit-summaries/{visitSummaryId}/retry"
        actor: ClinicAdmin
        preconditions:
          - "status == FAILED (ERR_SUMMARY_INVALID_STATE)"
        side_effects:
          - "last_error_code is retained until the next attempt overwrites it"
        note: "Closes the retry cycle; attempt_count is never reset."
      - from: QUEUED
        to: UNDELIVERABLE
        trigger: "POST /visit-summaries/{visitSummaryId}/transmit with transport_outcome == FAILED when attempt_count + 1 >= MAX_TRANSMIT_ATTEMPTS"
        actor: ClinicAdmin
        preconditions:
          - "status == QUEUED"
          - "attempt_count + 1 >= MAX_TRANSMIT_ATTEMPTS (3)"
        side_effects:
          - "attempt_count += 1, last_error_code := the submitted failure_code"
        note: "MAX_TRANSMIT_ATTEMPTS == 3: the first two FAILED transmits land in FAILED (attempt_count 1 then 2), the third drives UNDELIVERABLE with attempt_count 3. Terminal: retry from UNDELIVERABLE is rejected with ERR_SUMMARY_INVALID_STATE."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's version only.
# =============================================================================
concurrency_rules:
  - rule_id: prescription-create-stale-visit
    parent_entity: Visit
    write_endpoint: "POST /prescriptions"
    occ_field: "expected_visit_version"
    description: |
      Creating a Prescription against a Visit whose version has advanced since
      the client last observed it is rejected. A prescription creation carrying
      supersedes_prescription_id legitimately supersedes an earlier prescription
      on the same visit, so a client holding a stale Visit view can otherwise
      supersede a therapy it never saw; the stale-version check refuses the write
      and forces the client to re-read the visit.
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412

  - rule_id: float-cover-stale-clinic
    parent_entity: Clinic
    write_endpoint: "POST /clinics/{clinicId}/float-coverages"
    occ_field: "expected_clinic_version"
    description: |
      Creating float coverage against a Clinic whose version has advanced since
      the client last observed it is rejected. Float coverage supersedes the
      cancelled assignment it names and re-derives the clinic posture, so a
      stale clinic view means the requester is reasoning about an out-of-date
      on-duty headcount; the stale-version check refuses the write.
    error_id: ERR_STALE_CLINIC_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: patient_age_months_at_visit
    trigger: "POST /visits — frozen onto Visit.patient_age_months_at_visit; also re-evaluated live inside queue_priority_score"
    algorithm: aggregation
    formula: |
      dob = Patient.date_of_birth            # calendar date, no time component
      now = logical_clock (UTC date part)
      months = (now.year - dob.year) * 12 + (now.month - dob.month)
      if now.day < dob.day: months = months - 1     # floor to whole months
      return months
    input_set: "The single Patient referenced by the queue entry; the logical clock at the moment of the call (default 2026-08-01T00:00:00Z until POST /_clock/set_current_utc moves it)"
    constants: {}
    precision: "integer months, floor (never rounds up a partial month)"

  - name: visit_eligibility_screening
    trigger: "POST /visits — gates visit creation on age and complaint against the protocol and the state rule"
    algorithm: threshold
    formula: |
      protocol = the Protocol whose complaint_code == queue_entry.complaint_code
                 AND clinic.state_code IN protocol.allowed_state_codes
                 # exactly one such Protocol may exist; none → ERR_PROTOCOL_NOT_OFFERED_IN_STATE
      state_rule = the StateRule whose state_code == clinic.state_code
      effective_min_age_months = max(protocol.min_age_months,
                                     state_rule.min_independent_practice_age_months)
      age = calculations.patient_age_months_at_visit
      eligible = (age >= effective_min_age_months) AND (age <= protocol.max_age_months)
      if not eligible: reject with ERR_OUT_OF_PROTOCOL_SCOPE
    input_set: "One Protocol (matched by complaint_code + clinic state), one StateRule (matched by clinic state), one Patient"
    constants: {}
    precision: "integer month comparison; the lower bound is inclusive (>=) and the upper bound is inclusive (<=)"

  - name: queue_priority_score
    trigger: "QueueEntry creation, arrival, and every evaluation of call_next_selection"
    algorithm: weighted_scoring
    formula: |
      acuity_points      = ACUITY_POINT_WEIGHT * protocol.acuity_tier
      appointment_points = ON_TIME_APPOINTMENT_BONUS
                             if kind == APPOINTMENT
                                AND arrived_at is not null
                                AND arrived_at <= scheduled_at + LATE_GRACE_MINUTES
                           else 0
      wait_points        = min(WAIT_CREDIT_CAP_MINUTES,
                               floor((logical_clock - arrived_at) / 60 seconds))
                           if arrived_at is not null else 0
      age_points         = AGE_BUMP_POINTS
                             if (patient_age_months < PEDIATRIC_AGE_MONTHS
                                 OR patient_age_months >= GERIATRIC_AGE_MONTHS)
                           else 0
      priority_score = min(PRIORITY_SCORE_CAP,
                           acuity_points + appointment_points + wait_points + age_points)
    input_set: "The QueueEntry itself, its Protocol (matched by complaint_code + clinic state), its Patient, and the logical clock"
    constants:
      ACUITY_POINT_WEIGHT: 100
      ON_TIME_APPOINTMENT_BONUS: 250
      LATE_GRACE_MINUTES: 10
      WAIT_CREDIT_CAP_MINUTES: 180
      AGE_BUMP_POINTS: 60
      PEDIATRIC_AGE_MONTHS: 24
      GERIATRIC_AGE_MONTHS: 780
      PRIORITY_SCORE_CAP: 1000
    precision: "integer points; the floor on waited minutes and the outer min() are applied last, in that order"

  - name: call_next_selection
    trigger: "POST /clinics/{clinicId}/call-next"
    algorithm: chronological
    formula: |
      candidates = QueueEntry WHERE clinic_id == {clinicId} AND status == WAITING
      # each candidate's priority_score is recomputed at evaluation time
      rank by: priority_score DESC, then arrived_at ASC, then created_at ASC
      winner = first candidate after ranking
      if candidates is empty: reject with ERR_QUEUE_EMPTY
    input_set: "QueueEntry rows of this clinic with status == WAITING only; SCHEDULED, CALLED, SERVED, ABANDONED and DEFERRED_CLOSURE rows are excluded"
    constants: {}
    precision: "Deterministic total order: priority_score DESC, arrived_at ASC, created_at ASC. QueueEntry.id never participates in the ordering."

  - name: wait_time_estimate
    trigger: "POSTED_PROJECTION on every mutation of Clinic.waiting_count / on_duty_clinician_count; REALIZED_ACTUAL on WAITING → CALLED"
    algorithm: forward_looking
    formula: |
      # POSTED_PROJECTION (base)
      appts_next_hour = count(QueueEntry WHERE clinic_id == C
                                          AND kind == APPOINTMENT
                                          AND status == SCHEDULED
                                          AND scheduled_at in [logical_clock, logical_clock + 60 min))
      posted = min(WAIT_CAP_MINUTES,
                   ceil(waiting_count / max(1, on_duty_clinician_count)) * AVG_VISIT_MINUTES
                   + APPOINTMENT_BLEND_MINUTES * appts_next_hour)
    input_set: "POSTED_PROJECTION reads only WAITING entries (for waiting_count) plus SCHEDULED appointments inside the next 60 minutes, half-open [now, now+60min); REALIZED_ACTUAL reads only the single entry being called"
    constants:
      AVG_VISIT_MINUTES: 20
      APPOINTMENT_BLEND_MINUTES: 10
      WAIT_CAP_MINUTES: 120
    precision: "integer minutes; ceil() on the per-clinician division is applied BEFORE multiplying by AVG_VISIT_MINUTES, and the outer min() cap is applied last"
    variants:
      - name: POSTED_PROJECTION
        when: "Clinic.posted_wait_minutes — the public wait display, computed forward from queue depth and staffing before any patient is seen"
        difference: "Projects from queue depth, staffing headcount and upcoming appointments; never reads called_at. For waiting_count=3, on_duty=2, one appointment in the next hour it yields 50."
      - name: REALIZED_ACTUAL
        when: "QueueEntry.realized_wait_minutes and Clinic.last_realized_wait_minutes — measured after the fact on WAITING → CALLED"
        difference: "= floor((called_at - arrived_at) / 60 seconds); reads only clock stamps on that one entry and ignores staffing, queue depth and appointments entirely, so it diverges from the posted projection for the same clinic state."

  - name: referral_trigger_evaluation
    trigger: "POST /assessments/{assessmentId}/submit — decides the DRAFT fork and sets referral_destination / referral_reason_code"
    algorithm: threshold
    formula: |
      protocol = Protocol referenced by Assessment.protocol_id
      triggers = []
      if intersection(assessment.red_flag_codes, protocol.red_flag_codes) is non-empty:
          triggers += [(RED_FLAG,         EMERGENCY_DEPARTMENT)]
      if assessment.spo2_pct <  protocol.min_spo2_pct:            # strictly below
          triggers += [(HYPOXIA,          EMERGENCY_DEPARTMENT)]
      if assessment.temp_c  >= protocol.max_temp_c:               # at or above
          triggers += [(FEVER_THRESHOLD,  URGENT_CARE)]
      if assessment.heart_rate_bpm > protocol.max_heart_rate_bpm: # strictly above
          triggers += [(TACHYCARDIA,      URGENT_CARE)]
      if triggers is empty: return (null, null)                   # TREATMENT_AUTHORIZED branch
      # precedence is positional, not by destination severity
      reason, destination = first element of triggers in the order
                            RED_FLAG > HYPOXIA > FEVER_THRESHOLD > TACHYCARDIA
      return (destination, reason)
    input_set: "The single Assessment being submitted and the Protocol pinned onto it at creation (later edits to the Protocol row do not change the evaluation)"
    constants: {}
    precision: "Comparison operators are fixed and asymmetric: SpO2 uses <, temperature uses >=, heart rate uses >. A temperature exactly equal to max_temp_c refers; a heart rate exactly equal to max_heart_rate_bpm does not."

  - name: self_pay_discount
    trigger: "Called by visit_price_quote (SELF_PAY_TRANSPARENT) and visit_price_final whenever Visit.self_pay == true"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned and NOT circular:
      #   step 1: subtotal_cents = sum of every billed line at list price (PRE-discount)
      #   step 2: tier is selected from subtotal_cents (never from the discounted total)
      #   step 3: discount_cents = round_half_up(subtotal_cents * tier_pct / 100)
      #   step 4: total_cents = subtotal_cents - discount_cents
      # Selecting the tier from total_cents (step 4's output) is the forbidden
      # reading: it would make the tier depend on the discount that the tier defines.
      tier_pct =  0 if subtotal_cents <  TIER_1_CEILING_CENTS
                 10 if TIER_1_CEILING_CENTS <= subtotal_cents < TIER_2_CEILING_CENTS
                 15 if subtotal_cents >= TIER_2_CEILING_CENTS
      discount_cents = round_half_up(subtotal_cents * tier_pct / 100)
      total_cents    = subtotal_cents - discount_cents
    input_set: "All billed lines of the one Visit at list price: the Protocol base line plus one line per entry of Visit.services_rendered"
    constants:
      TIER_1_CEILING_CENTS: 10000
      TIER_2_CEILING_CENTS: 20000
    precision: "round_half_up to whole cents, applied once to the aggregate discount (NOT per line). subtotal 14800 → tier 10 → discount 1480 → total 13320; subtotal 19999 → tier 10 → discount 2000 → total 17999."

  - name: visit_price_quote
    trigger: "POST /visits/{visitId}/eligibility-check — writes Visit.quoted_price_cents"
    algorithm: forward_looking
    formula: |
      subtotal_cents = protocol.base_price_cents        # projected: no service lines exist yet
      # variant selection is decided by the coverage_status submitted with the check
    input_set: "Only the Protocol base line of this Visit. Visit.services_rendered is empty at quote time by construction, so no add-on line is projected."
    constants: {}
    precision: "whole cents, round_half_up wherever a percentage is applied"
    variants:
      - name: INSURED_ESTIMATE
        when: "coverage_status == ACTIVE"
        difference: |
          quoted_price_cents = copay_cents
                             + round_half_up((base_price_cents - copay_cents) * coinsurance_pct / 100)
          For base 9900, copay 2500, coinsurance 12.5 → 2500 + 925 = 3425.
      - name: SELF_PAY_TRANSPARENT
        when: "coverage_status IN {INACTIVE, UNKNOWN}"
        difference: |
          quoted_price_cents = calculations.self_pay_discount(subtotal_cents = base_price_cents)
          For base 12000 → tier 10 → 12000 - 1200 = 10800. No copay and no coinsurance
          participate, so the same protocol yields a different number from INSURED_ESTIMATE.

  - name: visit_price_final
    trigger: "POST /visits/{visitId}/checkout — writes Visit.final_price_cents, patient_responsibility_cents, payer_responsibility_cents"
    algorithm: chronological
    formula: |
      # Lines are assembled in a pinned chronological order:
      #   line 0 = the Protocol base line
      #   lines 1..n = one line per entry of Visit.services_rendered, in the order
      #                the array was submitted at checkout
      line_prices = [protocol.base_price_cents] + [SERVICE_PRICE_CENTS[s] for s in services_rendered]
      if Visit.clinical_status == REFERRED:      # variant REFERRAL_TRUNCATED
          line_prices = [round_half_up(protocol.base_price_cents * REFERRAL_BASE_FACTOR)]
      total_allowed_cents = sum(line_prices)
      if Visit.self_pay:
          final_price_cents           = calculations.self_pay_discount(subtotal_cents = total_allowed_cents)
          patient_responsibility_cents = final_price_cents
          payer_responsibility_cents   = 0
      else:
          # ROUNDING ORDER IS PINNED: apply coinsurance to EACH line, round each
          # line to whole cents with round_half_up, THEN sum. Summing first and
          # rounding once is the forbidden reading and differs by cents.
          per_line_patient = [round_half_up(p * coinsurance_pct / 100) for p in line_prices]
          patient_responsibility_cents = min(total_allowed_cents,
                                             copay_cents + sum(per_line_patient))
          final_price_cents            = total_allowed_cents
          payer_responsibility_cents   = final_price_cents - patient_responsibility_cents
      # invariant: patient_responsibility_cents + payer_responsibility_cents == final_price_cents
    input_set: "The one Visit being checked out: its Protocol base line plus its services_rendered lines. Prescriptions, referrals and queue history contribute no line."
    constants:
      SERVICE_PRICE_CENTS: { RAPID_STREP_TEST: 3500, URINALYSIS: 2800, INJECTION_ADMIN: 4200, EKG: 6500 }
      REFERRAL_BASE_FACTOR: 0.5
    precision: "round_half_up per line, then sum (never sum-then-round). Base 9900 + RAPID_STREP_TEST 3500 + URINALYSIS 2800 at coinsurance 12.5 with copay 2500 → per-line shares [1238, 438, 350] → patient 4526, payer 11674; the forbidden sum-then-round order would yield 4525."
    variants:
      - name: FULL_SERVICE
        when: "Visit.clinical_status == TREATED at checkout"
        difference: "Every service line is billed; total_allowed_cents = 16200 for the pinned example above."
      - name: REFERRAL_TRUNCATED
        when: "Visit.clinical_status == REFERRED at checkout"
        difference: "All add-on lines are dropped and the base line is halved: total_allowed_cents = round_half_up(9900 * 0.5) = 4950, patient 3119, payer 1831 — the same inputs the FULL_SERVICE variant would price at 16200."

  - name: chart_review_sampling
    trigger: "POST /clinics/{clinicId}/chart-review-samplings"
    algorithm: threshold
    formula: |
      state_rule = StateRule WHERE state_code == clinic.state_code
      eligible = Visit WHERE clinic_id == {clinicId}
                        AND clinical_status == CLOSED
                        AND created_at in [window_start, window_end)     # half-open
                        AND an Assessment exists with assessment.visit_id == visit.id
                        AND no ChartReview exists with chart_review.visit_id == visit.id
      mandatory = { v in eligible : v.referral_required == true
                                    OR exists Prescription WHERE visit_id == v.id
                                       AND status == ROUTED
                                       AND therapy_class == CONTROLLED_OPIOID }
      # reason precedence when both apply: MANDATORY_REFERRAL wins over CONTROLLED_RX
      target_total  = ceil(count(eligible) * state_rule.chart_review_sample_pct / 100)
      random_count  = max(0, target_total - count(mandatory))
      random_pool   = eligible - mandatory, ranked by acuity_tier DESC, then created_at ASC
      random_picked = first random_count rows of random_pool
      for each v in (mandatory ∪ random_picked):
          create ChartReview{ visit_id: v.id,
                              assessment_id: the Assessment of v,
                              reviewer_physician_id: Clinician(v.clinician_id).supervising_physician_id,
                              sampled_reason: MANDATORY_REFERRAL | CONTROLLED_RX | RANDOM_SAMPLE,
                              due_at: logical_clock + state_rule.review_deadline_hours,
                              status: PENDING }
      return { sampled_count, mandatory_count, random_count, chart_review_ids }
    input_set: "CLOSED visits of this clinic created inside the half-open window that have an Assessment and no existing ChartReview. Visits in SCREENING, IN_ASSESSMENT, TREATED, REFERRED or CANCELLED_CLOSURE are excluded, and re-running the endpoint never re-samples an already-reviewed visit."
    constants: {}
    precision: "ceil() on the percentage, then subtract the mandatory count and floor the remainder at 0. Boundaries: 5 eligible at 40% → 2; 3 eligible at 0% with 1 mandatory → 0 random and 1 mandatory; 0 eligible → sampled_count 0 with an empty chart_review_ids array and no error."

  - name: float_coverage_selection
    trigger: "POST /clinics/{clinicId}/float-coverages"
    algorithm: waterfall_allocation
    formula: |
      covered = StaffingAssignment referenced by covers_assignment_id   # must be CANCELLED
      candidates = Clinician WHERE float_eligible == true
                              AND scope_hold == false
                              AND license_state_code == clinic.state_code
                              AND id != covered.clinician_id
                              AND NOT EXISTS StaffingAssignment a
                                    WHERE a.clinician_id == clinician.id
                                      AND a.status IN {SCHEDULED, ACTIVE}
                                      AND a.starts_at < covered.ends_at
                                      AND covered.starts_at < a.ends_at        # half-open overlap
      rank by: (home_clinic_id == {clinicId} ? 0 : 1) ASC,
               then active_assignment_count ASC,
               then created_at ASC
      winner = first candidate; if candidates is empty: reject with ERR_NO_FLOAT_COVERAGE_AVAILABLE
    input_set: "Clinician rows only; the overlap probe reads StaffingAssignment rows in status SCHEDULED or ACTIVE (CANCELLED and COMPLETED rows never block)"
    constants: {}
    precision: "Deterministic total order: home-site flag ASC, active_assignment_count ASC, created_at ASC. Clinician.id never participates."

  - name: reviewer_reassignment_selection
    trigger: "POST /chart-reviews/{chartReviewId}/reassign"
    algorithm: waterfall_allocation
    formula: |
      state_rule = StateRule WHERE state_code == clinic.state_code
      candidates = Physician WHERE status == ACTIVE
                              AND clinic.state_code IN licensed_state_codes
                              AND id != chart_review.reviewer_physician_id
                              AND id != Assessment(chart_review.assessment_id).cosigned_by_physician_id
                              AND current_supervised_count < min(max_supervised_clinicians,
                                        state_rule.max_supervised_clinicians_per_physician)
      rank by: current_supervised_count ASC, then created_at ASC
      winner = first candidate; if candidates is empty: reject with ERR_NO_ELIGIBLE_REVIEWER
    input_set: "Physician rows with status == ACTIVE only; INACTIVE physicians, the incumbent reviewer, and the cosigning physician are excluded"
    constants: {}
    precision: "Deterministic total order: current_supervised_count ASC, created_at ASC. Physician.id never participates."

  - name: summary_destination_selection
    trigger: "VisitSummary creation during POST /visits/{visitId}/checkout"
    algorithm: waterfall_allocation
    formula: |
      if patient.pcp_direct_address is not null AND patient.pcp_accepts_electronic_summary == true:
          destination_kind = DIRECT_MESSAGE ; destination_address = patient.pcp_direct_address
      elif patient.pcp_direct_address is not null:
          destination_kind = FAX            ; destination_address = patient.pcp_direct_address
      else:
          destination_kind = PATIENT_PORTAL ; destination_address = null
    input_set: "The single Patient of the visit; no other row participates"
    constants: {}
    precision: "First matching branch wins; the waterfall order DIRECT_MESSAGE → FAX → PATIENT_PORTAL is fixed"

  - name: physician_supervision_load
    trigger: "StaffingAssignment creation, activation, completion and cancellation — writes Physician.current_supervised_count"
    algorithm: aggregation
    formula: |
      current_supervised_count =
        count(DISTINCT a.clinician_id
              FROM StaffingAssignment a
              WHERE a.pinned_supervising_physician_id == physician.id
                AND a.status IN {SCHEDULED, ACTIVE})
      # capacity gate on POST /staffing-assignments:
      effective_cap = min(physician.max_supervised_clinicians,
                          state_rule.max_supervised_clinicians_per_physician)
      reject with ERR_SUPERVISION_CAPACITY_EXCEEDED when the new assignment would
      introduce a clinician_id not already counted AND current_supervised_count >= effective_cap
    input_set: "StaffingAssignment rows in status SCHEDULED or ACTIVE only; CANCELLED and COMPLETED rows are excluded, which is what makes the create/cancel pair conserve the count"
    constants: {}
    precision: "integer count over DISTINCT clinician_id — two assignments for the same clinician under the same physician count once"

  - name: patient_outstanding_balance
    trigger: "POST /visits/{visitId}/checkout and POST /visits/{visitId}/charge-void — writes Patient.outstanding_balance_cents"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents =
        sum(v.patient_responsibility_cents
            FROM Visit v
            WHERE v.patient_id == patient.id AND v.billing_status == INVOICED)
    input_set: "Visit rows with billing_status == INVOICED only. UNBILLED, COVERAGE_VERIFIED, SELF_PAY_QUOTED, SELF_PAY_ACCEPTED and VOIDED visits contribute nothing, which is what makes checkout followed by charge-void conserve the balance."
    constants: {}
    precision: "integer cents; the sum is recomputed from scratch on every billing transition, never incrementally patched"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins when a
# single request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "for entity_backed roles, X-User-Id resolves to an existing row of the backing entity (Clinician / Physician / Patient)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints whose roles include Clinician, CollaboratingPhysician or Patient"

  - priority: 5
    category: existence
    check: "request body shape: unknown fields rejected, required fields present, types and enum members valid, integers non-negative where declared, limit in 1..100, offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: existence
    check: "every path id resolves to an existing row, validated left-to-right"
    error_id: "ERR_CLINIC_NOT_FOUND | ERR_PHYSICIAN_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_PROTOCOL_NOT_FOUND | ERR_STAFFING_ASSIGNMENT_NOT_FOUND | ERR_QUEUE_ENTRY_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_PRESCRIPTION_NOT_FOUND | ERR_CHART_REVIEW_NOT_FOUND | ERR_VISIT_SUMMARY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 7
    category: existence
    check: "every foreign key in the request body resolves to an existing row, validated in declaration order"
    error_id: "the matching ERR_<PARENT>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /clinicians, POST /staffing-assignments, POST /clinics/{clinicId}/float-coverages, POST /queue-entries, POST /visits, POST /assessments, POST /prescriptions"

  - priority: 8
    category: existence
    check: "a StateRule row exists for the clinic's state_code before any state-dependent rule is evaluated"
    error_id: ERR_STATE_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /staffing-assignments, POST /visits, POST /prescriptions, POST /clinics/{clinicId}/chart-review-samplings, POST /chart-reviews/{chartReviewId}/reassign"

  - priority: 9
    category: existence
    check: "a Patient acting on their own record: X-User-Id equals the target Visit's or QueueEntry's patient_id"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "GET /visits/{visitId}, GET /patients/{patientId}, GET /visit-summaries/{visitSummaryId}"

  - priority: 10
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_STAFFING_ASSIGNMENT_INVALID_STATE | ERR_QUEUE_ENTRY_INVALID_STATE | ERR_VISIT_INVALID_STATE | ERR_ASSESSMENT_INVALID_STATE | ERR_PRESCRIPTION_INVALID_STATE | ERR_CHART_REVIEW_INVALID_STATE | ERR_SUMMARY_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 12
    category: state
    check: "expected_visit_version / expected_clinic_version matches the parent's current version (§1.2.1 OCC)"
    error_id: "ERR_STALE_VISIT_VERSION | ERR_STALE_CLINIC_VERSION"
    http_status: 412
    applies_to: "POST /prescriptions, POST /clinics/{clinicId}/float-coverages"

  - priority: 15
    category: business_safety
    check: "the clinic's open_status permits the operation: CLOSED refuses every intake, LIMITED refuses WALK_IN intake but still admits APPOINTMENT entries"
    error_id: "ERR_CLINIC_CLOSED | ERR_WALK_IN_SUSPENDED"
    http_status: 409
    applies_to: "POST /queue-entries, POST /clinics/{clinicId}/call-next, POST /visits"

  - priority: 18
    category: business_safety
    check: "the clinician's scope_hold flag is clear before they may staff a site, open a visit, assess or prescribe"
    error_id: ERR_SCOPE_HOLD_ACTIVE
    http_status: 422
    applies_to: "POST /staffing-assignments, POST /visits, POST /assessments, POST /prescriptions"

  - priority: 20
    category: business_safety
    check: "a Protocol exists for the presenting complaint whose allowed_state_codes contains the clinic's state_code"
    error_id: ERR_PROTOCOL_NOT_OFFERED_IN_STATE
    http_status: 422
    applies_to: "POST /visits"

  - priority: 22
    category: business_safety
    check: "patient age in whole months satisfies max(Protocol.min_age_months, StateRule.min_independent_practice_age_months) <= age <= Protocol.max_age_months — the lower bound is inclusive"
    error_id: ERR_OUT_OF_PROTOCOL_SCOPE
    http_status: 422
    applies_to: "POST /visits"

  - priority: 24
    category: business_safety
    check: "a visit whose Assessment produced a mandatory referral (Visit.referral_required == true) may not be prescribed for and its prescriptions may not be routed to a pharmacy — the referral must be honoured instead. Cosigning such an assessment IS permitted: the referral record itself needs the collaborating physician's signature."
    error_id: ERR_REFERRAL_REQUIRED
    http_status: 422
    applies_to: "POST /prescriptions, POST /prescriptions/{prescriptionId}/route"

  - priority: 26
    category: business_safety
    check: "when Protocol.requires_cosign is true, a TREATED visit's Assessment must be COSIGNED before checkout; a REFERRED visit checks out without cosign because the referral, not the treatment, is the outcome"
    error_id: ERR_COSIGN_REQUIRED
    http_status: 422
    applies_to: "POST /visits/{visitId}/checkout"

  - priority: 28
    category: business_safety
    check: "therapy_class CONTROLLED_OPIOID is refused when the clinic state's StateRule.controlled_rx_allowed is false"
    error_id: ERR_CONTROLLED_RX_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /prescriptions"

  - priority: 30
    category: business_safety
    check: "the patient has no other ROUTED prescription in the same therapy_class, unless the new prescription supersedes it via supersedes_prescription_id"
    error_id: ERR_DUPLICATE_THERAPY
    http_status: 422
    applies_to: "POST /prescriptions, POST /prescriptions/{prescriptionId}/route"

  - priority: 32
    category: business_referential
    check: "the acting clinician's license_state_code equals the clinic's state_code"
    error_id: ERR_CLINICIAN_NOT_LICENSED_IN_STATE
    http_status: 422
    applies_to: "POST /staffing-assignments, POST /clinics/{clinicId}/float-coverages, POST /visits"

  - priority: 34
    category: business_referential
    check: "the pinned or reviewing physician is ACTIVE and the clinic's state_code appears in licensed_state_codes"
    error_id: ERR_PHYSICIAN_NOT_LICENSED_IN_STATE
    http_status: 422
    applies_to: "POST /staffing-assignments, POST /chart-reviews/{chartReviewId}/reassign"

  - priority: 36
    category: business_referential
    check: "when StateRule.collaborating_physician_required is true, pinned_supervising_physician_id must be supplied and must equal the clinician's supervising_physician_id"
    error_id: ERR_SUPERVISION_REQUIRED
    http_status: 422
    applies_to: "POST /staffing-assignments"

  - priority: 38
    category: business_referential
    check: "the queue entry belongs to the same clinic as the visit, is in CALLED status, and has no other Visit attached"
    error_id: ERR_QUEUE_ENTRY_NOT_CALLABLE
    http_status: 409
    applies_to: "POST /visits"

  - priority: 40
    category: business_referential
    check: "segregation of duties: the physician attesting a ChartReview is neither the cosigner of its Assessment nor the supervising physician recorded on the reviewed visit's clinician when a SCOPE_DEVIATION outcome is claimed"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /chart-reviews/{chartReviewId}/attest"

  - priority: 42
    category: business_referential
    check: "the acting user owns the resource they are transitioning: only the visit's own clinician may submit its Assessment or route its Prescription; only the ChartReview's reviewer_physician_id may request changes or attest"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /assessments/{assessmentId}/submit, POST /prescriptions/{prescriptionId}/route, POST /chart-reviews/{chartReviewId}/request-changes, POST /chart-reviews/{chartReviewId}/attest"

  - priority: 45
    category: business_temporal
    check: "an APPOINTMENT queue entry may only arrive inside [scheduled_at - 15 min, scheduled_at + 10 min]"
    error_id: ERR_APPOINTMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /queue-entries/{queueEntryId}/arrive"

  - priority: 47
    category: business_temporal
    check: "a new APPOINTMENT must be at least 30 minutes from every other SCHEDULED or WAITING appointment at the clinic (20-minute slot plus 10-minute turnover); exactly 30 minutes apart is legal"
    error_id: ERR_APPOINTMENT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /queue-entries"

  - priority: 49
    category: business_temporal
    check: "a clinician's SCHEDULED or ACTIVE staffing assignments must not overlap on the half-open interval [starts_at, ends_at); back-to-back adjacency is legal"
    error_id: ERR_CLINICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /staffing-assignments, POST /clinics/{clinicId}/float-coverages"

  - priority: 51
    category: business_temporal
    check: "starts_at must be strictly before ends_at, and scheduled_at must not be in the past relative to the logical clock"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /staffing-assignments, POST /queue-entries, POST /clinics/{clinicId}/chart-review-samplings"

  - priority: 53
    category: business_constraint
    check: "the effective supervision cap min(Physician.max_supervised_clinicians, StateRule.max_supervised_clinicians_per_physician) is not exceeded by adding a new distinct clinician"
    error_id: ERR_SUPERVISION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /staffing-assignments, POST /clinics/{clinicId}/float-coverages"

  - priority: 55
    category: business_constraint
    check: "state_code is unique across StateRule and (complaint_code, allowed_state_codes) pairs do not duplicate an existing Protocol offering"
    error_id: "ERR_DUPLICATE_STATE_RULE | ERR_DUPLICATE_PROTOCOL_OFFERING"
    http_status: 409
    applies_to: "POST /state-rules, POST /protocols"

  - priority: 57
    category: business_constraint
    check: "a ChartReview may complete at most MAX_CHANGE_CYCLES (2) PENDING -> CHANGES_REQUESTED cycles; the transmit-attempt cap is expressed as the QUEUED -> UNDELIVERABLE transition rather than as an error"
    error_id: ERR_REVIEW_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /chart-reviews/{chartReviewId}/request-changes"

  - priority: 59
    category: business_constraint
    check: "a walk-in may only be queued while waiting_count < Clinic.walk_in_queue_capacity, and appointments per clock hour must not exceed Clinic.appointment_slots_per_hour (aggregate check)"
    error_id: "ERR_QUEUE_CAPACITY_REACHED | ERR_HOURLY_SLOT_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /queue-entries"

  - priority: 61
    category: business_constraint
    check: "float coverage may only be created against a CANCELLED assignment that has no other FLOAT assignment already covering it"
    error_id: ERR_COVERAGE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /clinics/{clinicId}/float-coverages"

  - priority: 63
    category: business_fiscal
    check: "an eligibility check must have been recorded (billing_status is COVERAGE_VERIFIED, SELF_PAY_QUOTED or SELF_PAY_ACCEPTED) before checkout may price the visit"
    error_id: ERR_QUOTE_REQUIRED
    http_status: 409
    applies_to: "POST /visits/{visitId}/checkout"

  - priority: 65
    category: business_fiscal
    check: "a self-pay visit must have an accepted quote (billing_status == SELF_PAY_ACCEPTED) before services are rendered at checkout"
    error_id: ERR_PAYMENT_METHOD_REQUIRED
    http_status: 402
    applies_to: "POST /visits/{visitId}/checkout"

  - priority: 67
    category: business_fiscal
    check: "a patient whose outstanding_balance_cents exceeds SELF_PAY_BALANCE_CEILING_CENTS (50000) may not open a further self-pay visit"
    error_id: ERR_OUTSTANDING_BALANCE_BLOCK
    http_status: 402
    applies_to: "POST /visits"

  - priority: 69
    category: business_fiscal
    check: "only an INVOICED visit may be voided, and voiding must restore Patient.outstanding_balance_cents to its pre-checkout value"
    error_id: ERR_CHARGE_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /visits/{visitId}/charge-void"

# =============================================================================
# §1.5 API Endpoint Table — WRITE surface (31 endpoints)
# =============================================================================
endpoints:
  # --- test-driving endpoint (outside the business surface, inside the contract)
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock. The startup default is exactly 2026-08-01T00:00:00Z — before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Advancing the clock activates SCHEDULED staffing assignments whose starts_at has arrived, completes ACTIVE assignments whose ends_at has passed, abandons WAITING queue entries older than 120 minutes, and re-derives every affected clinic's posture (with the queue/visit cascades that follow)."
    roles: [ClinicAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, activated_assignment_ids: string[], completed_assignment_ids: string[], abandoned_queue_entry_ids: string[], affected_clinic_ids: string[] }"
    side_effects:
      - "StaffingAssignment SCHEDULED → ACTIVE and ACTIVE → COMPLETED"
      - "QueueEntry WAITING → ABANDONED after 120 minutes"
      - "Clinic.open_status re-derived, with the WAITING → DEFERRED_CLOSURE and Visit SCREENING → CANCELLED_CLOSURE cascades"
      - "Clinic.waiting_count and posted_wait_minutes recomputed"

  # --- reference data
  - method: POST
    path: "/state-rules"
    description: "Registers the oversight rules for one US state."
    roles: [ClinicAdmin]
    code: 201
    input: [state_code, chart_review_sample_pct, review_deadline_hours, collaborating_physician_required, min_independent_practice_age_months, controlled_rx_allowed, max_supervised_clinicians_per_physician]
    output: StateRule
    side_effects: []

  - method: POST
    path: "/protocols"
    description: "Registers a clinical protocol for one presenting complaint, with its age band, referral thresholds, price and state availability."
    roles: [ClinicAdmin]
    code: 201
    input: [complaint_code, min_age_months, max_age_months, base_price_cents, acuity_tier, red_flag_codes, max_temp_c, max_heart_rate_bpm, min_spo2_pct, requires_cosign, allowed_state_codes]
    output: Protocol
    side_effects: []

  - method: POST
    path: "/clinics"
    description: "Opens a clinic site. It starts with on_duty_clinician_count 0 and open_status CLOSED until a staffing assignment activates."
    roles: [ClinicAdmin]
    code: 201
    input: [name, state_code, min_clinicians_required, appointment_slots_per_hour, walk_in_queue_capacity]
    output: Clinic
    side_effects:
      - "open_status := CLOSED, on_duty_clinician_count := 0, waiting_count := 0, posted_wait_minutes := 0"

  - method: POST
    path: "/physicians"
    description: "Registers a collaborating physician and their supervision capacity."
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, licensed_state_codes, max_supervised_clinicians, "status?"]
    output: Physician
    side_effects:
      - "status defaults to ACTIVE; current_supervised_count := 0"

  - method: POST
    path: "/clinicians"
    description: "Registers an NP or PA, their licensing state, home clinic and supervising physician."
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, credential, license_state_code, home_clinic_id, supervising_physician_id, "float_eligible?"]
    output: Clinician
    side_effects:
      - "float_eligible defaults to false; scope_hold := false; active_assignment_count := 0"

  - method: POST
    path: "/patients"
    description: "Registers a patient with payer, PCP and consent details."
    roles: [ClinicAdmin, FrontDeskAgent]
    code: 201
    input: [full_name, date_of_birth, "payer_name?", "member_id?", "pcp_name?", "pcp_direct_address?", "pcp_accepts_electronic_summary?", "pcp_consent_on_file?"]
    output: Patient
    side_effects:
      - "active_therapy_classes := [], active_therapy_class_count := 0, outstanding_balance_cents := 0"

  # --- staffing
  - method: POST
    path: "/staffing-assignments"
    description: "Schedules a clinician onto a clinic for a half-open interval [starts_at, ends_at). Activates immediately when the logical clock already sits inside the interval."
    roles: [ClinicAdmin]
    code: 201
    input: [clinic_id, clinician_id, role_kind, starts_at, ends_at, "pinned_supervising_physician_id?"]
    output: StaffingAssignment
    side_effects:
      - "status := SCHEDULED, or ACTIVE when starts_at <= logical clock < ends_at"
      - "on activation: Clinic.on_duty_clinician_count += 1 and Clinic.open_status re-derived"
      - "Physician.current_supervised_count recomputed via calculations.physician_supervision_load"
      - "Clinician.active_assignment_count recomputed"

  - method: POST
    path: "/staffing-assignments/{assignmentId}/cancel"
    description: "Cancels a SCHEDULED or ACTIVE assignment. Cancelling an ACTIVE one drives the four-hop closure cascade."
    roles: [ClinicAdmin]
    code: 200
    input: ["cancel_reason?"]
    output: StaffingAssignment
    side_effects:
      - "cascade hop 1: Clinic.on_duty_clinician_count -= 1 (ACTIVE only)"
      - "cascade hop 2: Clinic.open_status re-derived"
      - "cascade hop 3: WAITING QueueEntry rows → DEFERRED_CLOSURE per the posture cascade scope (plus SCREENING Visit rows → CANCELLED_CLOSURE when the clinic reaches CLOSED)"
      - "cascade hop 4: those queue transitions recompute Clinic.waiting_count, which in turn re-derives Clinic.posted_wait_minutes"
      - "Physician.current_supervised_count and Clinician.active_assignment_count recomputed"

  - method: POST
    path: "/clinics/{clinicId}/float-coverages"
    description: "Creates a FLOAT staffing assignment covering a cancelled assignment's remaining interval. The covering clinician is chosen by calculations.float_coverage_selection; guarded by OCC on the clinic's version."
    roles: [ClinicAdmin]
    code: 201
    input: [covers_assignment_id, expected_clinic_version, "pinned_supervising_physician_id?"]
    output: StaffingAssignment
    side_effects:
      - "a FLOAT StaffingAssignment is created for the selected clinician over [covered.starts_at, covered.ends_at)"
      - "activates immediately when the clock sits inside the interval, raising Clinic.on_duty_clinician_count and possibly re-deriving open_status LIMITED → OPEN or CLOSED → LIMITED/OPEN"
      - "Physician.current_supervised_count and Clinician.active_assignment_count recomputed"

  # --- queue
  - method: POST
    path: "/queue-entries"
    description: "Adds a walk-in (auto-advanced to WAITING) or books an appointment (stays SCHEDULED until arrival)."
    roles: [FrontDeskAgent, ClinicAdmin]
    code: 201
    input: [clinic_id, patient_id, kind, complaint_code, "scheduled_at?"]
    output: QueueEntry
    side_effects:
      - "acuity_tier copied from the matching Protocol"
      - "WALK_IN: status := WAITING, arrived_at := logical clock, priority_score computed, Clinic.waiting_count += 1, posted_wait_minutes recomputed"
      - "APPOINTMENT: status := SCHEDULED, slot-spacing and per-hour capacity enforced"

  - method: POST
    path: "/queue-entries/{queueEntryId}/arrive"
    description: "Checks an appointment patient in, moving SCHEDULED → WAITING inside the arrival window."
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: QueueEntry
    side_effects:
      - "arrived_at := logical clock, priority_score computed with the on-time appointment bonus"
      - "Clinic.waiting_count += 1, then posted_wait_minutes recomputed"

  - method: POST
    path: "/clinics/{clinicId}/call-next"
    description: "Calls the highest-priority WAITING entry per calculations.call_next_selection."
    roles: [Clinician]
    code: 200
    input: []
    output: QueueEntry
    side_effects:
      - "winner WAITING → CALLED, called_at := logical clock"
      - "realized_wait_minutes := calculations.wait_time_estimate variant REALIZED_ACTUAL; Clinic.last_realized_wait_minutes updated"
      - "Clinic.waiting_count -= 1, then posted_wait_minutes recomputed"

  # --- visit
  - method: POST
    path: "/visits"
    description: "Opens a visit against a CALLED queue entry. Screens age and complaint against the protocol and the state rule, and freezes patient_age_months_at_visit."
    roles: [Clinician]
    code: 201
    input: [queue_entry_id, "clinician_id?"]
    output: Visit
    side_effects:
      - "protocol_id resolved from complaint_code + clinic state; patient_age_months_at_visit frozen"
      - "clinical_status := SCREENING, billing_status := UNBILLED"
      - "the queue entry transitions CALLED → SERVED"

  - method: POST
    path: "/visits/{visitId}/eligibility-check"
    description: "Records the insurance eligibility result and writes the up-front price quote — INSURED_ESTIMATE for ACTIVE coverage, SELF_PAY_TRANSPARENT otherwise."
    roles: [FrontDeskAgent]
    code: 200
    input: [coverage_status, "copay_cents?", "coinsurance_pct?"]
    output: Visit
    side_effects:
      - "billing_status := COVERAGE_VERIFIED or SELF_PAY_QUOTED"
      - "self_pay set, quoted_price_cents := calculations.visit_price_quote"

  - method: POST
    path: "/visits/{visitId}/accept-self-pay"
    description: "Patient acceptance of the transparent self-pay quote; the acknowledged amount must equal the stored quote."
    roles: [Patient, FrontDeskAgent]
    code: 200
    input: [acknowledged_price_cents]
    output: Visit
    side_effects:
      - "billing_status := SELF_PAY_ACCEPTED"

  - method: POST
    path: "/visits/{visitId}/checkout"
    description: "Closes and prices the visit, invoices it, and queues the PCP visit summary when consent is on file."
    roles: [Clinician]
    code: 200
    input: ["services_rendered?"]
    output: Visit
    side_effects:
      - "clinical_status TREATED|REFERRED → CLOSED; billing_status → INVOICED"
      - "final / patient / payer amounts := calculations.visit_price_final (variant chosen by clinical_status)"
      - "Patient.outstanding_balance_cents recomputed"
      - "VisitSummary created in QUEUED (destination per calculations.summary_destination_selection) when Patient.pcp_consent_on_file == true"

  - method: POST
    path: "/visits/{visitId}/charge-void"
    description: "Compensating action that voids an invoiced charge; the money fields are retained for audit and the patient balance returns to its pre-checkout value."
    roles: [ClinicAdmin]
    code: 200
    input: [void_reason]
    output: Visit
    side_effects:
      - "billing_status INVOICED → VOIDED"
      - "Patient.outstanding_balance_cents recomputed (VOIDED visits are excluded from the sum)"

  # --- assessment
  - method: POST
    path: "/assessments"
    description: "Starts the protocol-driven assessment for a screening visit, moving the visit to IN_ASSESSMENT."
    roles: [Clinician]
    code: 201
    input: [visit_id, temp_c, heart_rate_bpm, spo2_pct, "red_flag_codes?"]
    output: Assessment
    side_effects:
      - "status := DRAFT, protocol_id copied from the visit"
      - "Visit clinical_status SCREENING → IN_ASSESSMENT"

  - method: POST
    path: "/assessments/{assessmentId}/submit"
    description: "Submits the assessment. The referral evaluation forks the machine: REFERRAL_REQUIRED (with the four-hop referral cascade) or TREATMENT_AUTHORIZED."
    roles: [Clinician]
    code: 200
    input: []
    output: Assessment
    side_effects:
      - "referral_destination / referral_reason_code := calculations.referral_trigger_evaluation"
      - "referral branch: Visit IN_ASSESSMENT → REFERRED, its DRAFT/ROUTED prescriptions → CANCELLED, patient therapy-class lock set recomputed"
      - "no-referral branch: Visit IN_ASSESSMENT → TREATED"

  - method: POST
    path: "/assessments/{assessmentId}/cosign"
    description: "Collaborating physician cosignature, required before checkout when the protocol demands it."
    roles: [CollaboratingPhysician]
    code: 200
    input: []
    output: Assessment
    side_effects:
      - "status := COSIGNED, cosigned_by_physician_id and cosigned_at set"

  # --- prescriptions
  - method: POST
    path: "/prescriptions"
    description: "Drafts a prescription for a treated visit. Guarded by OCC on the visit's version; may name the prescription it will supersede."
    roles: [Clinician]
    code: 201
    input: [visit_id, drug_name, therapy_class, days_supply, pharmacy_npi, expected_visit_version, "supersedes_prescription_id?"]
    output: Prescription
    side_effects:
      - "status := DRAFT; patient_id and prescriber_clinician_id copied from the visit"

  - method: POST
    path: "/prescriptions/{prescriptionId}/route"
    description: "Routes the prescription to the pharmacy, taking the patient's therapy-class lock and superseding any named predecessor."
    roles: [Clinician]
    code: 200
    input: []
    output: Prescription
    side_effects:
      - "status := ROUTED, routed_at := logical clock"
      - "Patient.active_therapy_classes / active_therapy_class_count recomputed"
      - "a named supersedes_prescription_id transitions ROUTED → CANCELLED before the lock set is recomputed"

  - method: POST
    path: "/prescriptions/{prescriptionId}/cancel"
    description: "Compensating action that cancels a DRAFT or ROUTED prescription and releases its therapy-class lock."
    roles: [Clinician]
    code: 200
    input: ["cancel_reason?"]
    output: Prescription
    side_effects:
      - "status := CANCELLED"
      - "Patient.active_therapy_classes / active_therapy_class_count recomputed"

  # --- oversight
  - method: POST
    path: "/clinics/{clinicId}/chart-review-samplings"
    description: "Runs the state-rule chart-review sampling over the clinic's closed visits in the half-open window [window_start, window_end), creating PENDING ChartReview rows."
    roles: [CollaboratingPhysician, ClinicAdmin]
    code: 200
    input: [window_start, window_end]
    output: "{ sampled_count: integer, mandatory_count: integer, random_count: integer, chart_review_ids: string[] }"
    side_effects:
      - "ChartReview rows created per calculations.chart_review_sampling with due_at := clock + StateRule.review_deadline_hours"
      - "already-reviewed visits are never re-sampled"

  - method: POST
    path: "/chart-reviews/{chartReviewId}/request-changes"
    description: "Reviewer sends the chart back to the clinician, entering the cyclic PENDING ↔ CHANGES_REQUESTED loop."
    roles: [CollaboratingPhysician]
    code: 200
    input: [change_note]
    output: ChartReview
    side_effects:
      - "status := CHANGES_REQUESTED, changes_requested_count += 1"

  - method: POST
    path: "/chart-reviews/{chartReviewId}/resubmit"
    description: "Clinician returns the amended chart to the reviewer, closing one cycle of the loop."
    roles: [Clinician]
    code: 200
    input: [amendment_note]
    output: ChartReview
    side_effects:
      - "status := PENDING (changes_requested_count is not reset)"

  - method: POST
    path: "/chart-reviews/{chartReviewId}/attest"
    description: "Reviewer attests the chart. WITHIN_SCOPE closes it; SCOPE_DEVIATION escalates and places the treating clinician on scope hold. The cosigner of the assessment may not attest it."
    roles: [CollaboratingPhysician]
    code: 200
    input: [outcome, "attestation_note?"]
    output: ChartReview
    side_effects:
      - "status := ATTESTED or ESCALATED, outcome recorded"
      - "SCOPE_DEVIATION: the treating Clinician.scope_hold := true, which blocks their assessments and removes them from float candidacy"

  - method: POST
    path: "/chart-reviews/{chartReviewId}/reassign"
    description: "Admin reassigns a PENDING review to another eligible physician per calculations.reviewer_reassignment_selection (a PENDING → PENDING self-transition)."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: ChartReview
    side_effects:
      - "reviewer_physician_id := the selected physician; status stays PENDING and due_at is unchanged"

  # --- PCP communication
  - method: POST
    path: "/visit-summaries/{visitSummaryId}/transmit"
    description: "Attempts one transmission of the visit summary to the PCP destination. A failure below the attempt cap goes to FAILED; the attempt that reaches the cap goes to UNDELIVERABLE."
    roles: [ClinicAdmin]
    code: 200
    input: [transport_outcome, "failure_code?"]
    output: VisitSummary
    side_effects:
      - "attempt_count += 1"
      - "SENT: sent_at := logical clock, last_error_code := null"
      - "FAILED: last_error_code := failure_code; status FAILED or UNDELIVERABLE depending on the cap"

  - method: POST
    path: "/visit-summaries/{visitSummaryId}/retry"
    description: "Requeues a FAILED summary for another transmission attempt, closing the retry cycle."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: VisitSummary
    side_effects:
      - "status FAILED → QUEUED; attempt_count is never reset"

  # ===========================================================================
  # §1.5 API Endpoint Table — READ surface (21 endpoints).
  # Every FK-bearing child entity has both a single-resource GET and a
  # filtered list GET so that cascade-created rows are discoverable.
  # ===========================================================================
  - method: GET
    path: "/protocols/{protocolId}"
    description: "Reads one clinical protocol."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician, FrontDeskAgent]
    code: 200
    input: []
    output: Protocol
    side_effects: []

  - method: GET
    path: "/protocols"
    description: "Lists protocols, optionally filtered by complaint code."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician, FrontDeskAgent]
    code: 200
    input: ["complaint_code?", "limit?", "offset?"]
    output: Protocol[]
    side_effects: []

  - method: GET
    path: "/clinics/{clinicId}"
    description: "Reads one clinic, including the derived open_status, on_duty_clinician_count, waiting_count, posted_wait_minutes and last_realized_wait_minutes."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician, FrontDeskAgent, Patient]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  - method: GET
    path: "/physicians/{physicianId}"
    description: "Reads one collaborating physician, including the derived current_supervised_count."
    roles: [ClinicAdmin, CollaboratingPhysician]
    code: 200
    input: []
    output: Physician
    side_effects: []

  - method: GET
    path: "/clinicians/{clinicianId}"
    description: "Reads one clinician, including scope_hold and active_assignment_count."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: GET
    path: "/clinicians"
    description: "Lists clinicians filtered by home clinic, supervising physician or float eligibility."
    roles: [ClinicAdmin, CollaboratingPhysician]
    code: 200
    input: ["home_clinic_id?", "supervising_physician_id?", "float_eligible?", "scope_hold?", "limit?", "offset?"]
    output: Clinician[]
    side_effects: []

  - method: GET
    path: "/patients/{patientId}"
    description: "Reads one patient, including active_therapy_classes, active_therapy_class_count and outstanding_balance_cents."
    roles: [ClinicAdmin, Clinician, FrontDeskAgent, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/staffing-assignments/{assignmentId}"
    description: "Reads one staffing assignment."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: []
    output: StaffingAssignment
    side_effects: []

  - method: GET
    path: "/staffing-assignments"
    description: "Lists staffing assignments filtered by clinic, clinician, covered assignment, pinned physician or status — the discovery channel for float-coverage rows created by the selector."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: ["clinic_id?", "clinician_id?", "covers_assignment_id?", "pinned_supervising_physician_id?", "role_kind?", "status?", "limit?", "offset?"]
    output: StaffingAssignment[]
    side_effects: []

  - method: GET
    path: "/queue-entries/{queueEntryId}"
    description: "Reads one queue entry, including priority_score and realized_wait_minutes."
    roles: [ClinicAdmin, Clinician, FrontDeskAgent]
    code: 200
    input: []
    output: QueueEntry
    side_effects: []

  - method: GET
    path: "/queue-entries"
    description: "Lists queue entries filtered by clinic, patient, kind or status — the discovery channel for entries deferred by a closure cascade."
    roles: [ClinicAdmin, Clinician, FrontDeskAgent]
    code: 200
    input: ["clinic_id?", "patient_id?", "kind?", "status?", "limit?", "offset?"]
    output: QueueEntry[]
    side_effects: []

  - method: GET
    path: "/visits/{visitId}"
    description: "Reads one visit with both state dimensions and every priced amount."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician, FrontDeskAgent, Patient]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: GET
    path: "/visits"
    description: "Lists visits filtered by clinic, patient, clinician, queue entry, protocol or either state dimension."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician, FrontDeskAgent]
    code: 200
    input: ["clinic_id?", "patient_id?", "clinician_id?", "queue_entry_id?", "protocol_id?", "clinical_status?", "billing_status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []

  - method: GET
    path: "/assessments/{assessmentId}"
    description: "Reads one assessment, including referral_destination and referral_reason_code."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: GET
    path: "/assessments"
    description: "Lists assessments filtered by visit, protocol, cosigning physician or status — the only discovery channel for the Assessment created as a side effect of POST /assessments... and for cascade-updated rows."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: ["visit_id?", "protocol_id?", "cosigned_by_physician_id?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  - method: GET
    path: "/prescriptions/{prescriptionId}"
    description: "Reads one prescription."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: GET
    path: "/prescriptions"
    description: "Lists prescriptions filtered by visit, patient, prescriber, superseded predecessor or status — the discovery channel for prescriptions cancelled by the referral cascade."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: ["visit_id?", "patient_id?", "prescriber_clinician_id?", "supersedes_prescription_id?", "therapy_class?", "status?", "limit?", "offset?"]
    output: Prescription[]
    side_effects: []

  - method: GET
    path: "/chart-reviews/{chartReviewId}"
    description: "Reads one chart review, including sampled_reason, due_at, changes_requested_count and outcome."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: []
    output: ChartReview
    side_effects: []

  - method: GET
    path: "/chart-reviews"
    description: "Lists chart reviews filtered by visit, assessment, reviewer, sampled reason or status — the only discovery channel for reviews created by the sampling run."
    roles: [ClinicAdmin, Clinician, CollaboratingPhysician]
    code: 200
    input: ["visit_id?", "assessment_id?", "reviewer_physician_id?", "sampled_reason?", "status?", "limit?", "offset?"]
