              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "OPEN_REGISTRATION" }
              as: EventCoordinator
            - call: "POST /hhw/residents"
              payload: { program_id: "${prog_id}", full_name: "Ana Ruiz", street_address: "12 Elm Street", claimed_jurisdiction_code: "CO-ARV" }
              as: Anonymous
              captures: { res_id: $.data.id }
            - call: "POST /hhw/residents/${res_id}/eligibility-actions"
              payload: { action: "VERIFY", verified_jurisdiction_code: "CO-ARV" }
              as: EligibilityClerk
              captures: { res_v: $.data.version }
            - call: "POST /hhw/appointments"
              payload: { event_id: "${ev_id}", resident_id: "${res_id}", slot_start_utc: "2026-09-12T09:00:00.000Z", waste_origin: "HOUSEHOLD", declared_total_kg: 8.0, declared_category_ids: ["${cat_latex}"], expected_resident_version: "${res_v}", vehicle_count: 1 }
              as: EligibilityClerk
              captures: { appt_id: $.data.id }
            - call: "GET /hhw/programs/${prog_id}"
              as: ProgramAdmin
              captures: { posture_pre: $.data.posture }
          trigger:
            - call: "POST /hhw/programs/${prog_id}/posture-override"
              payload: { posture_override: "OPEN", posture_override_expires_utc: "2026-12-31T00:00:00.000Z" }
              as: ProgramAdmin
              captures: { posture_post: $.data.posture, ovr: $.data.posture_override }
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "CONFIRM" }
              as: EligibilityClerk
              captures: { st: $.data.status, reserved: $.data.reserved_kg }
          assert:
            - "${posture_pre} == RESTRICTED"
            - "${ovr} == OPEN and ${posture_post} == OPEN"
            - "${st} == CONFIRMED and ${reserved} == 8.0"
            - "Resident.${res_id}.annual_quantity_reserved_kg == 8.0"
            - "CollectionEvent.${ev_id}.reserved_slot_count == 1"
            - "CollectionEvent.${ev_id}.projected_cost_per_participant_cents == 50400"

      - name: posture_override_does_not_lift_frozen_posture
        claim_type: conditional_feature_flags
        grounds: ["calculations.program_posture", "endpoints.POST_/hhw/programs/{id}/posture-override", "errors[ERR_PROGRAM_FROZEN]"]
        distinguishing_aspect: "An OPEN override is stored but posture stays FROZEN once open_containment_deficiency_count reaches 2, so POST /hhw/events still returns ERR_PROGRAM_FROZEN (409)."
        test_recipe:
          setup: ["Program with one APPROVED site hosting two events, both driven to containment_status DEFICIENT, so posture is FROZEN"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev1: $.data.id }
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-10-10T08:00:00.000Z", window_end_utc: "2026-10-10T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev2: $.data.id }
            - call: "POST /hhw/events/${ev1}/containment-inspections"
              payload: { result: "FAIL", finding_code: "BERM-CRACK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
            - call: "POST /hhw/events/${ev2}/containment-inspections"
              payload: { result: "FAIL", finding_code: "DRAIN-UNCOVERED" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
          trigger:
            - call: "POST /hhw/programs/${prog_id}/posture-override"
              payload: { posture_override: "OPEN", posture_override_expires_utc: "2026-12-31T00:00:00.000Z" }
              as: ProgramAdmin
              captures: { posture: $.data.posture, ovr: $.data.posture_override }
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-11-14T08:00:00.000Z", window_end_utc: "2026-11-14T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${ovr} == OPEN"
            - "${posture} == FROZEN — the override never rewrites a FROZEN posture_raw"
            - "${err} == ERR_PROGRAM_FROZEN"
            - "HTTP status == 409"
            - "GET /hhw/events?program_id=${prog_id} returns total_count == 2"

  - section: entities
    instances:

      - name: inactive_staffer_cannot_be_assigned_to_a_lane
        claim_type: defaults
        grounds: ["entities.Staffer.fields.status", "validations[priority=17]", "errors[ERR_CERTIFICATION_EXPIRED]"]
        distinguishing_aspect: "Staffer.status defaults to ACTIVE but may be supplied as INACTIVE at registration; an INACTIVE staffer with a perfectly valid HAZWOPER date is still refused a lane assignment with ERR_CERTIFICATION_EXPIRED (422)."
        test_recipe:
          setup: ["Program, APPROVED site, one event in SITE_CONFIRMED, and a staffer registered with status INACTIVE whose HAZWOPER expires 2027-06-30"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Benched Bea", role_code: "TRAFFIC", hazwoper_expires_on: "2027-06-30", status: "INACTIVE" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id, st: $.data.status }
          trigger:
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${st} == INACTIVE"
            - "${err} == ERR_CERTIFICATION_EXPIRED"
            - "HTTP status == 422"
            - "Staffer.${staffer_id}.assigned_hours == 0.0"
            - "CollectionEvent.${ev_id}.open_lane_count == 0"
