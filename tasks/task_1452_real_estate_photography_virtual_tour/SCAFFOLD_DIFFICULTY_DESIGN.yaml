scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (2 instances, DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_vs_invoice_on_shootbooking_money_domain
        grounds:
          - calculations.provisional_quote
          - calculations.final_invoice
          - calculations.final_invoice.variants.on_time_delivery
          - calculations.final_invoice.variants.late_delivery
          - entities.ShootBooking.fields.provisional_quote_cents
          - entities.ShootBooking.fields.final_invoice_cents
        distinguishing_aspect: |
          Dual-variant pair #1 operates on the ShootBooking money domain: the locked
          provisional_quote_cents (computed at submit from the booking snapshot) and
          final_invoice_cents (computed at acceptance from the evolved add-on set,
          weather credits, and license fee) are two valid algorithms over the SAME
          booking that MUST produce different cent values when the booking accrued a
          weather credit and gained a drone add-on after submit.
        test_recipe:
          setup:
            - "Market ATX with pricing_multiplier_bps=12500, standard_turnaround_hours=48, weather_reschedule_credit_bps=1000"
            - "Photographer P (STANDARD package, not drone certified needed yet — drone added AFTER submit via new assign path is blocked; we use drone_certified=true photographer to allow later DRONE_STILLS add-on)"
            - "ClientAgent A; booking STANDARD, photo_count=30, wants_virtual_tour=true, tour_variant=BRANDED, license_tier=STANDARD_MARKETING, scheduled 2026-08-10T14:00:00Z"
            - "Booking submitted (quote locked), checklist completed, assigned, confirmed, one WEATHER reschedule to 2026-08-12T14:00:00Z (credit 3563), DRONE_STILLS add-on activated post-submit (25000), authorization approved, mark-shot, on-time delivery, accept"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "ATX", display_name: "Austin", pricing_multiplier_bps: 12500, standard_turnaround_hours: 48, travel_buffer_minutes: 45, weather_reschedule_credit_bps: 1000 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "Pat Photo", email: "pat@x.com", equipment_packages: ["STANDARD"], drone_certified: true }
              as: OpsAdmin
              captures: { photog: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-1", market_id: "${mkt}", property_address: "1 Main St", equipment_package: "STANDARD", photo_count: 30, scheduled_start_utc: "2026-08-10T14:00:00Z", wants_virtual_tour: true, tour_variant: "BRANDED", license_tier: "STANDARD_MARKETING" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
            - call: "POST /shoot-bookings/${bk}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${bk}/checklist-items"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { it0: "$.data[0].id", it1: "$.data[1].id", it2: "$.data[2].id", it3: "$.data[3].id", it4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${it0}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${it1}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${it2}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${it3}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${it4}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${bk}/assign"
              payload: { photographer_id: "${photog}" }
              as: Coordinator
            - call: "POST /shoot-bookings/${bk}/confirm"
              payload: {}
              as: Coordinator
            # weather reschedule: booking -> ASSIGNED with same photographer, credit applied.
            # OCC: fetch live version first (create/submit/assign/confirm have all bumped it).
            - call: "GET /shoot-bookings/${bk}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk_v_live: $.data.version }
            - call: "POST /shoot-bookings/${bk}/reschedule"
              payload: { expected_booking_version: "${bk_v_live}", kind: "WEATHER", new_start_utc: "2026-08-12T14:00:00Z", reason_code: "PRECIPITATION" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk_v2: $.data.version }
            # confirm again after reschedule? booking returned to ASSIGNED; confirm requires no ACTIVE drone addon yet — none yet
            - call: "POST /shoot-bookings/${bk}/confirm"
              payload: {}
              as: Coordinator
            # add drone AFTER confirm — regresses CONFIRMED -> AUTHORIZATION_PENDING per AddOn.ACTIVE side effect
            - call: "POST /shoot-bookings/${bk}/addons"
              payload: { kind: "DRONE_STILLS" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { addon_drone: $.data.id }
            - call: "GET /shoot-bookings/${bk}/airspace-authorizations"
              payload: {}
              as: Coordinator
              captures: { auth: "$.data[0].id" }
            - call: "POST /shoot-bookings/${bk}/airspace-authorizations/${auth}/approve"
              payload: {}
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T14:00:00Z" }
              as: OpsAdmin
            - call: "POST /shoot-bookings/${bk}/mark-shot"
              payload: {}
              as: Photographer
              as_user_id: "${photog}"
            - call: "POST /shoot-bookings/${bk}/deliver"
              payload: { photo_asset_count: 30, tour_asset_url: "https://tour.example.com/t/1" }
              as: Photographer
              as_user_id: "${photog}"
          trigger:
            - call: "POST /shoot-bookings/${bk}/accept"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
          assert:
            - "ShootBooking.${bk}.provisional_quote_cents == 35625"
            - "ShootBooking.${bk}.weather_credit_cents == 3563"
            - "AddOn.${addon_drone}.price_cents == 25000"
            - "ShootBooking.${bk}.final_invoice_cents == 62062"
            - "ShootBooking.${bk}.final_invoice_cents != ShootBooking.${bk}.provisional_quote_cents"
            - "LicenseGrant tier == STANDARD_MARKETING and fee_cents == 5000"
            - "ShootBooking.${bk}.state == ACCEPTED"

      - name: standard_vs_weather_extended_turnaround_clock_on_assetbundle_domain
        grounds:
          - calculations.turnaround_deadline
          - calculations.turnaround_deadline.variants.standard_clock
          - calculations.turnaround_deadline.variants.weather_extended_clock
          - entities.ShootBooking.fields.delivery_due_utc
          - state_machines.ShootBooking.CONFIRMED_to_SHOT
        distinguishing_aspect: |
          Dual-variant pair #2 operates on the AssetBundle/delivery-deadline domain
          (not money): two bookings with identical market turnaround (48h) but
          different weather-reschedule histories (0 vs 3 WEATHER events) MUST get
          different delivery_due_utc values relative to their shot timestamps —
          the weather-extended variant adds min(events,2)*24h, so 3 events grant
          only +48h, not +72h.
        test_recipe:
          setup:
            - "Market DEN multiplier 10000, standard_turnaround_hours=48"
            - "Photographers P1 and P2 in DEN, both STANDARD package"
            - "Agent A; two bookings B1 (no reschedule) and B2 (three WEATHER reschedules)"
            - "Both bookings through pipeline to CONFIRMED; both mark-shot at 2026-08-10T16:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "P One", email: "p1@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
              captures: { p1: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "P Two", email: "p2@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
              captures: { p2: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            # ---- Booking B1 (no weather) ----
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-B1", market_id: "${mkt}", property_address: "10 Oak", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-10T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { b1: $.data.id }
            - call: "POST /shoot-bookings/${b1}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${b1}/checklist-items"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { b1i0: "$.data[0].id", b1i1: "$.data[1].id", b1i2: "$.data[2].id", b1i3: "$.data[3].id", b1i4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${b1}/checklist-items/${b1i0}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${b1}/checklist-items/${b1i1}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${b1}/checklist-items/${b1i2}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${b1}/checklist-items/${b1i3}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${b1}/checklist-items/${b1i4}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${b1}/assign"
              payload: { photographer_id: "${p1}" }
              as: Coordinator
            - call: "POST /shoot-bookings/${b1}/confirm"
              payload: {}
              as: Coordinator
            # ---- Booking B2 (three weather reschedules) ----
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-B2", market_id: "${mkt}", property_address: "20 Elm", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-06T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { b2: $.data.id }
            - call: "POST /shoot-bookings/${b2}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${b2}/checklist-items"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { b2i0: "$.data[0].id", b2i1: "$.data[1].id", b2i2: "$.data[2].id", b2i3: "$.data[3].id", b2i4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${b2}/checklist-items/${b2i0}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${b2}/checklist-items/${b2i1}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${b2}/checklist-items/${b2i2}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${b2}/checklist-items/${b2i3}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${b2}/checklist-items/${b2i4}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${b2}/assign"
              payload: { photographer_id: "${p2}" }
              as: Coordinator
            - call: "POST /shoot-bookings/${b2}/confirm"
              payload: {}
              as: Coordinator
            # weather reschedule 1 (cap 3): 2026-08-06 -> 2026-08-07.
            # OCC discipline: GET live version immediately before each reschedule
            # (submit/assign/confirm and each prior reschedule bump ShootBooking.version).
            - call: "GET /shoot-bookings/${b2}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { b2_vr1: $.data.version }
            - call: "POST /shoot-bookings/${b2}/reschedule"
              payload: { expected_booking_version: "${b2_vr1}", kind: "WEATHER", new_start_utc: "2026-08-07T14:00:00Z", reason_code: "WIND" }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${b2}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /shoot-bookings/${b2}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { b2_vr2: $.data.version }
            - call: "POST /shoot-bookings/${b2}/reschedule"
              payload: { expected_booking_version: "${b2_vr2}", kind: "WEATHER", new_start_utc: "2026-08-08T14:00:00Z", reason_code: "WIND" }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${b2}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /shoot-bookings/${b2}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { b2_vr3: $.data.version }
            - call: "POST /shoot-bookings/${b2}/reschedule"
              payload: { expected_booking_version: "${b2_vr3}", kind: "WEATHER", new_start_utc: "2026-08-10T14:00:00Z", reason_code: "LOW_LIGHT" }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${b2}/confirm"
              payload: {}
              as: Coordinator
            # ---- mark both shot at the same instant ----
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T16:00:00Z" }
              as: OpsAdmin
            - call: "POST /shoot-bookings/${b1}/mark-shot"
              payload: {}
              as: Photographer
              as_user_id: "${p1}"
            - call: "POST /shoot-bookings/${b2}/mark-shot"
              payload: {}
              as: Photographer
              as_user_id: "${p2}"
          trigger:
            - call: "GET /shoot-bookings/${b1}"
              payload: {}
              as: Coordinator
              captures: { b1_due: $.data.delivery_due_utc }
            - call: "GET /shoot-bookings/${b2}"
              payload: {}
              as: Coordinator
              captures: { b2_due: $.data.delivery_due_utc }
          assert:
            - "ShootBooking.${b1}.delivery_due_utc == 2026-08-12T16:00:00Z (standard clock: 48h)"
            - "ShootBooking.${b2}.delivery_due_utc == 2026-08-14T16:00:00Z (weather-extended: 48h + min(3,2)*24h = 96h)"
            - "ShootBooking.${b2}.delivery_due_utc - ShootBooking.${b1}.delivery_due_utc == 48 hours exactly (NOT 72h — third weather event grants no further slack)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (2 instances, DIFFERENT modes from {a,b,c})
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: provisional_quote_nested_rounding_per_line_then_sum
        grounds:
          - calculations.provisional_quote
          - calculations.provisional_quote.precision
          - entities.Market.fields.pricing_multiplier_bps
        distinguishing_aspect: |
          Mode (b) nested-rounding instance: with a 1.25x market multiplier, each
          quote line is rounded HALF_UP to whole cents BEFORE summing. Per-line-then-sum
          (18750 + 1875 + 15000 = 35625) differs from sum-then-round
          ((12000 + 1200 + 9600)*1.25 = 28500*1.25 = 35625 vs the unrounded sum
          12000*1.25 + 1200*1.25 + 9600*1.25 with fractional intermediates) — the
          scaffold pins per-line rounding and the test pins inputs where the two
          orders would diverge at sub-cent precision on overage (5 photos * 300 =
          1500 * 1.25 = 1875.0 exact; use photo_count=31 so overage is 6 photos =
          1800*1.25 = 2250.0; choose a multiplier 10033 to force a fractional line:
          base STANDARD 15000*1.0033 = 15049.5 -> HALF_UP 15050; overage 6*300*1.0033
          = 1805.94 -> 1806; sum-of-unrounded 15049.5+1805.94=16855.44 -> 16855 vs
          per-line sum 16856 — diverges by 1 cent).
        test_recipe:
          setup:
            - "Market RND with pricing_multiplier_bps=10033, standard_turnaround_hours=48"
            - "Agent A; booking STANDARD, photo_count=31 (6 over included 25), no tour, not twilight, scheduled 2026-08-10T14:00:00Z"
            - "Submit to lock the quote"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "RND", display_name: "Rounding Market", pricing_multiplier_bps: 10033, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-RND", market_id: "${mkt}", property_address: "5 Fraction Ln", equipment_package: "STANDARD", photo_count: 31, scheduled_start_utc: "2026-08-10T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
            - call: "POST /shoot-bookings/${bk}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
          trigger:
            - call: "GET /shoot-bookings/${bk}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
          assert:
            - "ShootBooking.${bk}.provisional_quote_cents == 16856 (per-line HALF_UP: 15050 + 1806; NOT 16855 from sum-then-round)"

      - name: final_invoice_circular_dependency_pinned_order
        grounds:
          - calculations.final_invoice
          - calculations.final_invoice.constants.LATE_DELIVERY_PENALTY_BPS
          - calculations.weather_reschedule_credit
        distinguishing_aspect: |
          Mode (c) circular-looking dependency instance: final_invoice's late_penalty
          is a percentage of provisional_quote, rush_discount depends on whether
          delivery was late relative to delivery_due_utc, delivery_due_utc depends on
          whether RUSH_EDIT is active, and weather_credit is capped by the quote —
          the scaffold pins evaluation order (quote -> addons delta -> rush discount
          -> revision fees -> late penalty -> weather credit -> license fee -> floor 0).
          The test pins a late RUSH_EDIT delivery after one weather reschedule and
          asserts the exact cent value that only the pinned order produces.
        test_recipe:
          setup:
            - "Market ATX multiplier 12500, standard_turnaround_hours=48, weather_reschedule_credit_bps=1000"
            - "Photographer P STANDARD+drone_certified false; agent A"
            - "Booking STANDARD photo_count=30, no tour, license MLS_COMPLIANT, scheduled 2026-08-05T14:00:00Z -> quote 20625 (base 18750 + overage 1875)"
            - "Submit, checklist, assign, confirm; one WEATHER reschedule to 2026-08-06T14:00:00Z (credit rhu(20625*0.10)=2063); re-confirm; add RUSH_EDIT (rhu(15000*1.25)=18750) ACTIVE"
            - "mark-shot at 2026-08-06T14:30:00Z; turnaround = ceil(48/2)=24h + weather_ext min(1,2)*24h = 24h => delivery_due = 2026-08-08T14:30:00Z"
            - "deliver LATE at 2026-08-08T15:00:00Z (30 min past due); accept"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "ATX", display_name: "Austin", pricing_multiplier_bps: 12500, standard_turnaround_hours: 48, weather_reschedule_credit_bps: 1000 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "Pat Photo", email: "pat@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
              captures: { photog: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-CIRC", market_id: "${mkt}", property_address: "9 Loop Ct", equipment_package: "STANDARD", photo_count: 30, scheduled_start_utc: "2026-08-05T14:00:00Z", license_tier: "MLS_COMPLIANT" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
            - call: "POST /shoot-bookings/${bk}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${bk}/checklist-items"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { i0: "$.data[0].id", i1: "$.data[1].id", i2: "$.data[2].id", i3: "$.data[3].id", i4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i0}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i1}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i2}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i3}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i4}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${bk}/assign"
              payload: { photographer_id: "${photog}" }
              as: Coordinator
            - call: "POST /shoot-bookings/${bk}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /shoot-bookings/${bk}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk_v_live: $.data.version }
            - call: "POST /shoot-bookings/${bk}/reschedule"
