              as: FarmManager
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 beats fiscal priority 11; the payment would ALSO exceed the 0 outstanding balance)"

      - name: expired_acceptance_temporal_beats_overlap_referential
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_BID_ACCEPTANCE_EXPIRED]
          - errors[ERR_FIELD_LEASE_OVERLAP]
        distinguishing_aspect: |
          Category pair business_temporal vs business_referential: a lease
          create whose bid acceptance expired 1 day ago (clock 2026-06-01 >
          accepted_at 2026-05-01 + 30 days) AND whose term overlaps an ACTIVE
          lease on the same field must fail with the temporal error
