            - call: "POST /innovation-projects/${rs_p_id}/business-cases"
              payload: { expected_project_version: "${rs_p_v2}", variant_mode: "TOP_DOWN", category_size_units_year: 2000000, target_share_pct: 4.00, cogs_per_unit_usd: 2.0000, slotting_fees_usd: 0.00, capex_usd: 50000.00, discount_rate_pct: 10.00 }
              as: InnovationLead
