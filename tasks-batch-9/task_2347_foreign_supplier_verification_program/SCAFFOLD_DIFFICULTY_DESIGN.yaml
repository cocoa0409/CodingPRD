  # ---------------------------------------------------------------------------
  # RULE 9 — compensating_invariant
  # Two DIFFERENT conserved quantities: Importer.blocked_pair_count (restored by
  # corrective-action closure) and ForeignSupplier.performance_sample_weight_total
