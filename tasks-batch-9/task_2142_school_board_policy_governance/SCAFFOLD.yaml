      - "on a POLICY_SECOND_READING pass: PolicyVersion FIRST_READING_PASSED -> ADOPTED, prior ADOPTED version -> SUPERSEDED, Policy.status -> ADOPTED, matching LegalMandate rows -> SATISFIED, Policy.compliance_state recomputed, PUBLISHED manual editions re-certified"
      - "on a POLICY_SECOND_READING failure: PolicyVersion FIRST_READING_PASSED -> DRAFT with reading_count and first_reading_meeting_id reset"
      - "on a WAIVER_DECISION: WaiverRequest BOARD_PENDING -> GRANTED (window written by calculations.waiver_grant_window) or -> DENIED with denial_stage = BOARD"

