              payload: { status: "DEPARTED" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          trigger:
            - call: "POST /escalation-cases/${esc_id}/transition"
              payload: { action: "COMMIT" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { blocked_err: $.data.error_id }
            - call: "PATCH /sponsor-contacts/${sponsor_id}"
              payload: { status: "ACTIVE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /escalation-cases/${esc_id}/transition"
              payload: { action: "COMMIT" }
              as: CsExecutive
              as_user_id: "exec-1"
          assert:
            - "the first COMMIT returns HTTP 422 with data.error_id == \"ERR_SPONSOR_DEPARTED\" and EscalationCase.${esc_id}.state remains \"OPEN\""
            - "after the sponsor is reactivated, the second COMMIT succeeds and EscalationCase.${esc_id}.state == \"COMMITTED\""
            - "EscalationCase.${esc_id}.remediation_round == 1 throughout"
            - "Account.${acct_id}.remediation_credit_outstanding_cents == 500000 throughout"

