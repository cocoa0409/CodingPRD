  - method: POST
    path: "/clients/{id}/resume"
    description: "Resume a PAUSED client"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Client
    side_effects: ["cascade SUSPENDED Retainers -> ACTIVE"]
  - method: POST
    path: "/clients/{id}/churn"
    description: "Churn a client (terminal)"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Client
    side_effects: ["cascade Retainers -> CLOSED -> Deliverables CANCELLED (depth-3); AdCampaigns -> ENDED"]

