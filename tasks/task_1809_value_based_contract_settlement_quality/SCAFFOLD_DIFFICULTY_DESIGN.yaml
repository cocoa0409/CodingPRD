# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 1809
# 9 rules x 2 instances = 18 non-stub instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_model_prospective_vs_concurrent_divergence
        grounds:
          - calculations.risk_model_variant
          - calculations.attribution_rollup
          - entities.Contract.fields.risk_model
        distinguishing_aspect: |
          Identical population and identical RiskScore rows produce different
          benchmarks because each contract pins a different risk_model:
          PROSPECTIVE yields RAF 1100 and benchmark 1,980,000; CONCURRENT
          yields RAF 1033 and benchmark 1,859,400. Entity domain: member risk
          scoring feeding the year benchmark (distinct from interim cost
          estimation in the sibling instance).
        test_recipe:
          setup:
            - "One program, one group, two practices; members M1 (span 2026-01-01..2026-12-31, 12 mm) and M2 (span 2026-07-01..2026-12-31, 6 mm)"
            - "Contract CP pins PROSPECTIVE; contract CC pins CONCURRENT; each has its own 2026 year opened for attribution"
            - "YP has FINAL PROSPECTIVE scores 1250 (M1) and 800 (M2); YC has FINAL CONCURRENT scores 1100 (M1) and 900 (M2)"
            - "Each year has a LOCKED run attributing M1->PR1 and M2->PR2, then lock-attribution computed rollups"
          setup_api_calls:
            - { call: "POST /vbc/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: PayerAdmin }
            - { call: "POST /vbc/programs", payload: { program_name: "MA Value", line_of_business: MEDICARE_ADVANTAGE }, as: PayerAdmin, captures: { pg: $.data.id } }
            - { call: "POST /vbc/programs/${pg}/activate", payload: {}, as: PayerAdmin }
            - { call: "POST /vbc/practice-groups", payload: { group_name: "G1", tin: "100000001" }, as: PayerAdmin, captures: { g1: $.data.id } }
            - { call: "POST /vbc/practices", payload: { practice_group_id: "${g1}", practice_name: "PR1", npi: "2000000001" }, as: PayerAdmin, captures: { pr1: $.data.id } }
            - { call: "POST /vbc/practices", payload: { practice_group_id: "${g1}", practice_name: "PR2", npi: "2000000002" }, as: PayerAdmin, captures: { pr2: $.data.id } }
            - { call: "POST /vbc/contracts", payload: { program_id: "${pg}", practice_group_id: "${g1}", contract_ref: "C-P", effective_start: "2026-01-01", effective_end: "2027-01-01", risk_track: TWO_SIDED, risk_model: PROSPECTIVE, benchmark_pmpm_cents: 100000, shared_savings_rate_bp: 5000, shared_loss_rate_bp: 4000, min_savings_rate_bp: 200, min_loss_rate_bp: 200, savings_cap_bp: 1000, loss_cap_bp: 800, stop_loss_cents: 2000000, withhold_rate_bp: 500, quality_gate_floor_points: 30, quality_gate_excellence_points: 80, estimate_method: ANNUALIZATION, quality_measures: [ { measure_code: HBA1C, weight_bp: 9000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] }, { measure_code: MAMMO, weight_bp: 1000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] } ] }, as: ContractManager, captures: { cp: $.data.id } }
            - { call: "POST /vbc/contracts/${cp}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vbc/contracts", payload: { program_id: "${pg}", practice_group_id: "${g1}", contract_ref: "C-C", effective_start: "2026-01-01", effective_end: "2027-01-01", risk_track: TWO_SIDED, risk_model: CONCURRENT, benchmark_pmpm_cents: 100000, shared_savings_rate_bp: 5000, shared_loss_rate_bp: 4000, min_savings_rate_bp: 200, min_loss_rate_bp: 200, savings_cap_bp: 1000, loss_cap_bp: 800, stop_loss_cents: 2000000, withhold_rate_bp: 500, quality_gate_floor_points: 30, quality_gate_excellence_points: 80, estimate_method: ANNUALIZATION, quality_measures: [ { measure_code: HBA1C, weight_bp: 9000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] }, { measure_code: MAMMO, weight_bp: 1000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] } ] }, as: ContractManager, captures: { cc: $.data.id } }
            - { call: "POST /vbc/contracts/${cc}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vbc/performance-years", payload: { contract_id: "${cp}", year_label: 2026, period_start: "2026-01-01", period_end: "2027-01-01" }, as: PayerAdmin, captures: { yp: $.data.id } }
            - { call: "POST /vbc/performance-years", payload: { contract_id: "${cc}", year_label: 2026, period_start: "2026-01-01", period_end: "2027-01-01" }, as: PayerAdmin, captures: { yc: $.data.id } }
            - { call: "POST /vbc/performance-years/${yp}/open-attribution", payload: {}, as: PayerAdmin }
            - { call: "POST /vbc/performance-years/${yc}/open-attribution", payload: {}, as: PayerAdmin }
            - { call: "POST /vbc/members", payload: { program_id: "${pg}", member_ref: "M-001", birth_year: 1980 }, as: PayerAdmin, captures: { m1: $.data.id } }
            - { call: "POST /vbc/members", payload: { program_id: "${pg}", member_ref: "M-002", birth_year: 1975 }, as: PayerAdmin, captures: { m2: $.data.id } }
            - { call: "POST /vbc/eligibility-spans", payload: { member_id: "${m1}", start_date: "2026-01-01", end_date: "2026-12-31" }, as: PayerAdmin }
            - { call: "POST /vbc/eligibility-spans", payload: { member_id: "${m2}", start_date: "2026-07-01", end_date: "2026-12-31" }, as: PayerAdmin }
            - { call: "GET /vbc/performance-years/${yp}", payload: {}, as: PayerAdmin, captures: { ypv: $.data.version } }
            - { call: "POST /vbc/performance-years/${yp}/attribution-runs", payload: { run_label: "R-P", expected_performance_year_version: "${ypv}" }, as: AttributionAnalyst, captures: { rp: $.data.id } }
            - { call: "POST /vbc/attribution-runs/${rp}/records", payload: { member_id: "${m1}", practice_id: "${pr1}" }, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${rp}/records", payload: { member_id: "${m2}", practice_id: "${pr2}" }, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${rp}/compute", payload: {}, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${rp}/lock", payload: {}, as: AttributionAnalyst }
            - { call: "GET /vbc/performance-years/${yc}", payload: {}, as: PayerAdmin, captures: { ycv: $.data.version } }
            - { call: "POST /vbc/performance-years/${yc}/attribution-runs", payload: { run_label: "R-C", expected_performance_year_version: "${ycv}" }, as: AttributionAnalyst, captures: { rc: $.data.id } }
            - { call: "POST /vbc/attribution-runs/${rc}/records", payload: { member_id: "${m1}", practice_id: "${pr1}" }, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${rc}/records", payload: { member_id: "${m2}", practice_id: "${pr2}" }, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${rc}/compute", payload: {}, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${rc}/lock", payload: {}, as: AttributionAnalyst }
            - { call: "POST /vbc/risk-scores", payload: { member_id: "${m1}", performance_year_id: "${yp}", model_used: PROSPECTIVE, score_milli: 1250 }, as: ActuaryAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /vbc/risk-scores/${s1}/finalize", payload: {}, as: ActuaryAnalyst }
            - { call: "POST /vbc/risk-scores", payload: { member_id: "${m2}", performance_year_id: "${yp}", model_used: PROSPECTIVE, score_milli: 800 }, as: ActuaryAnalyst, captures: { s2: $.data.id } }
            - { call: "POST /vbc/risk-scores/${s2}/finalize", payload: {}, as: ActuaryAnalyst }
            - { call: "POST /vbc/risk-scores", payload: { member_id: "${m1}", performance_year_id: "${yc}", model_used: CONCURRENT, score_milli: 1100 }, as: ActuaryAnalyst, captures: { s3: $.data.id } }
            - { call: "POST /vbc/risk-scores/${s3}/finalize", payload: {}, as: ActuaryAnalyst }
            - { call: "POST /vbc/risk-scores", payload: { member_id: "${m2}", performance_year_id: "${yc}", model_used: CONCURRENT, score_milli: 900 }, as: ActuaryAnalyst, captures: { s4: $.data.id } }
            - { call: "POST /vbc/risk-scores/${s4}/finalize", payload: {}, as: ActuaryAnalyst }
          trigger:
            - { call: "POST /vbc/performance-years/${yp}/lock-attribution", payload: {}, as: PayerAdmin, captures: { yp_bm: $.data.benchmark_cost_cents, yp_raf: $.data.risk_adjustment_factor_milli } }
            - { call: "POST /vbc/performance-years/${yc}/lock-attribution", payload: {}, as: PayerAdmin, captures: { yc_bm: $.data.benchmark_cost_cents, yc_raf: $.data.risk_adjustment_factor_milli } }
          assert:
            - "PerformanceYear.${yp}.risk_adjustment_factor_milli == 1100"
            - "PerformanceYear.${yp}.benchmark_cost_cents == 1980000"
            - "PerformanceYear.${yc}.risk_adjustment_factor_milli == 1033"
            - "PerformanceYear.${yc}.benchmark_cost_cents == 1859400"
            - "benchmark_cost_cents differ (1980000 != 1859400) for identical members/spans/records — only the pinned risk_model differs"

      - name: interim_estimate_annualization_vs_completion_factor_divergence
        grounds:
          - calculations.interim_estimate
          - entities.InterimReport.fields.est_actual_annualization_cents
          - entities.InterimReport.fields.est_actual_completion_cents
          - entities.Contract.fields.estimate_method
        distinguishing_aspect: |
          Identical YTD claims (200,000 cents, 6 months elapsed) produce
          different estimates per method: annualization 400,000 vs
          completion-factor 235,294; the authoritative variant (per contract
          estimate_method) drives est_net_payable (355,000 vs 396,177) and
          reserve_accrual (177,500 vs 198,089). Entity domain: performance-year
          cost projection (distinct from member risk scoring in the sibling
          instance).
        test_recipe:
          setup:
            - "Program/group/practices/members as canonical; M1 12 mm attributed to PR1, M2 6 mm to PR2; benchmark 1,800,000 on both years"
            - "Contract CA has estimate_method ANNUALIZATION; contract CB has COMPLETION_FACTOR; both savings_cap_bp 5000"
            - "Each year has one PAID claim of 200,000 cents on M1 (service 2026-02-10, paid_on 2026-03-01) and VALIDATED quality results HBA1C 350/1000 + MAMMO 50/1000 (interim composite 30 -> multiplier 5000)"
            - "Clock at 2026-07-01 when reports are created with months_elapsed 6"
          setup_api_calls:
            - { call: "POST /vbc/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: PayerAdmin }
            - { call: "POST /vbc/programs", payload: { program_name: "MA Value", line_of_business: MEDICARE_ADVANTAGE }, as: PayerAdmin, captures: { pg: $.data.id } }
