        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[refund-request-create-stale-credit-balance]", "validations[priority=17]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A client that read the credit balance's version at attribute time and then filed a RootCauseFinding (which bumps that version) is rejected with 412 ERR_STALE_VERSION when it sends the pre-finding version; resending the current version succeeds."
        test_recipe:
