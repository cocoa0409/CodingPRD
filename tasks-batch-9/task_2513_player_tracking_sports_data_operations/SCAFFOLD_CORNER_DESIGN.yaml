              captures: { fs_id: $.data.id }
          trigger:
            - call: "POST /feed-sessions/${fs_id}/usage-records"
              payload: { sampled_at_utc: "2026-08-01T18:05:00Z", bandwidth_mbps: 20, duration_seconds: 60, latency_p95_ms: 500 }
              as: Licensee
