  - rule_id: non_linear_state_machine
    instances:

      - name: application_conditioned_resubmit_cycle
        grounds:
          - state_machines.CreditApplication.CONDITIONED_to_RESUBMITTED
          - state_machines.CreditApplication.RESUBMITTED_to_CONDITIONED
          - entities.CreditApplication.fields.resubmission_count
          - validations[priority=25]
          - errors[ERR_RESUBMISSION_LIMIT]
        distinguishing_aspect: |
          Non-linearity on the CreditApplication entity is a true cycle: the file returns
          to CONDITIONED after having left it (CONDITIONED -> RESUBMITTED -> CONDITIONED),
          twice, and only the MAX_RESUBMISSIONS counter - not the state graph - terminates
          the loop with ERR_RESUBMISSION_LIMIT on the third resubmit.
