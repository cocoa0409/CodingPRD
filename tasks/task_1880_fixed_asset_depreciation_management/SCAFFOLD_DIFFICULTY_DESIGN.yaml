  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: capitalize_state_error_beats_fiscal_error
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a CANCELLED project that is
          also below the capitalization threshold must fail with
          ERR_PROJECT_NOT_OPEN (priority 4), not ERR_BELOW_CAPITALIZATION_THRESHOLD
          (priority 8).
        test_recipe:
          setup:
            - "AssetClass MACH (threshold 250000); project PROJ-1 with one POSTED line of 100000 (below threshold), then CANCELLED"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-1", name: "Small works", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pj: $.data.id }
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pj}", amount_cents: 100000, cost_type: "MATERIAL", incurred_date: "2026-01-15" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /capital-projects/${pj}/cancel"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          trigger:
            - call: "POST /capital-projects/${pj}/capitalize"
              payload: { asset_tag: "A-901", description: "Would-be asset" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROJECT_NOT_OPEN (http 409) — the state failure at priority 4 wins over the fiscal failure at priority 8"
            - "CapitalProject.${pj}.status remains CANCELLED; no FixedAsset with asset_tag A-901 exists"

      - name: disposal_post_safety_error_beats_temporal_error
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: an APPROVED
          SALE whose asset has an open inventory exception AND whose effective
          period has since closed must fail with ERR_ASSET_UNDER_INVENTORY_REVIEW
          (priority 5), not ERR_PERIOD_CLOSED (priority 7).
        test_recipe:
          setup:
            - "AssetClass MACH; Asset A-600 cost 600000 SL/60, in service 2026-01-10; run 2026-01 posted"
            - "Inventory run (scope ALL) with the asset counted found=false -> MISSING (open_inventory_exception == true)"
            - "Disposal SALE proceeds 100000 effective 2026-02-20, created and APPROVED while 2026-02 was still open"
            - "Run 2026-02 then posted, closing the effective period"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-600", description: "Forklift", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /inventory-runs"
              payload: { name: "Q1 count", scope_type: "ALL" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { inv: $.data.id }
            - call: "POST /inventory-runs/${inv}/count-lines"
              payload: { asset_id: "${a}", found: false }
              as: InventoryClerk
              as_user_id: u_clerk_1
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SALE", proceeds_cents: 100000, effective_date: "2026-02-20" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { d: $.data.id }
            - call: "POST /disposals/${d}/approve"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r2: $.data.id }
            - call: "POST /depreciation-runs/${r2}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /disposals/${d}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSET_UNDER_INVENTORY_REVIEW (http 409) — the compliance gate at priority 5 wins over the closed-period failure at priority 7"
            - "Disposal.${d}.status remains APPROVED; FixedAsset.${a}.status remains IN_SERVICE"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: capitalize_at_exact_threshold_succeeds
        grounds:
          - validations[priority=8]
          - calculations.cip_accumulated_total
        distinguishing_aspect: |
          Metric: accumulated cents vs capitalization threshold on
          POST /capital-projects/{id}/capitalize — exactly 250000 passes (>=),
          249999 fails; the comparison is inclusive.
        test_recipe:
          setup:
            - "AssetClass MACH threshold 250000; project PROJ-A with POSTED lines 100000 + 150000 = 250000; project PROJ-B with one POSTED line 249999"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-A", name: "At threshold", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pa: $.data.id }
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pa}", amount_cents: 100000, cost_type: "MATERIAL", incurred_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pa}", amount_cents: 150000, cost_type: "LABOR", incurred_date: "2026-01-20" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-B", name: "Below threshold", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pb: $.data.id }
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pb}", amount_cents: 249999, cost_type: "VENDOR_INVOICE", incurred_date: "2026-01-25" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /capital-projects/${pa}/capitalize"
              payload: { asset_tag: "A-801", description: "Threshold asset" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cap_asset: $.data.capitalized_asset_id }
            - call: "POST /capital-projects/${pb}/capitalize"
              payload: { asset_tag: "A-802", description: "Below-threshold asset" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { err: $.data.error_id }
          assert:
            - "PROJ-A: 200, status == CAPITALIZED; new FixedAsset ${cap_asset} has acquisition_cost_cents == 250000 and source == CIP_CAPITALIZATION"
            - "PROJ-B: 422 with error_id == ERR_BELOW_CAPITALIZATION_THRESHOLD at exactly one cent under the threshold"
            - "PROJ-B status remains OPEN (failed fiscal check does not consume the project)"

      - name: full_depreciation_exact_equality_transition
        grounds:
          - state_machines.FixedAsset
          - calculations.book_period_depreciation
        distinguishing_aspect: |
          Metric: accumulated book cents vs depreciable basis on
          POST /depreciation-runs/{id}/post — at 12000 < 24000 the asset stays
          IN_SERVICE; at exactly == 24000 it auto-transitions; the next run
          produces zero entries. Different metric and different endpoint than the
          capitalization-threshold instance.
        test_recipe:
          setup:
            - "AssetClass MACH; Asset A-900 cost 24000, life 2 (override), SL, salvage 0, in service 2026-01-10"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-900", description: "Tool set", asset_class_id: "${cls}", acquisition_cost_cents: 24000, cost_center: "CC1", location: "PLANT-1", useful_life_months: 2 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { st1: $.data.status, acc1: $.data.accumulated_book_cents }
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r2: $.data.id }
            - call: "POST /depreciation-runs/${r2}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-03" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r3: $.data.id }
            - call: "POST /depreciation-runs/${r3}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { n3: $.data.entries_created_count }
          assert:
            - "After run 2026-01: accumulated_book_cents == 12000 < 24000 and status == IN_SERVICE (strictly below basis: no transition)"
            - "After run 2026-02: accumulated_book_cents == 24000 == depreciable basis and status == FULLY_DEPRECIATED (exact equality triggers)"
            - "Run 2026-03: entries_created_count == 0 for the FULLY_DEPRECIATED asset; accumulated stays 24000"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cost_line_posting_requires_project_open
        grounds:
          - state_machines.CapitalProject
          - state_machines.CIPCostLine
          - errors[ERR_PROJECT_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair CIPCostLine -> CapitalProject: whether a cost line can be
          posted (or reversed) depends on the parent project's state, not on any
          field of the line itself.
        test_recipe:
          setup:
            - "AssetClass MACH; project PROJ-C OPEN, then CANCELLED by Controller"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-C", name: "Cancelled works", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pj: $.data.id }
            - call: "POST /capital-projects/${pj}/cancel"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          trigger:
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pj}", amount_cents: 50000, cost_type: "OTHER", incurred_date: "2026-02-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROJECT_NOT_OPEN (http 409); no CIPCostLine created"
            - "CapitalProject.${pj}.total_accumulated_cents remains 0"

      - name: disposal_create_requires_asset_in_service
        grounds:
          - state_machines.FixedAsset
          - state_machines.Disposal
          - errors[ERR_ASSET_NOT_IN_SERVICE]
        distinguishing_aspect: |
          Entity pair Disposal -> FixedAsset: a disposal cannot even be REQUESTED
          while the asset is DRAFT — the allowed from-states of the new Disposal
          depend on a different entity's lifecycle state. Different pair than the
          CIPCostLine -> CapitalProject dependency.
        test_recipe:
          setup:
            - "AssetClass MACH; asset A-950 created but left in DRAFT (never placed in service)"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-950", description: "Draft asset", asset_class_id: "${cls}", acquisition_cost_cents: 400000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
          trigger:
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SALE", proceeds_cents: 100000, effective_date: "2026-03-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSET_NOT_IN_SERVICE (http 409); no Disposal row created"
            - "FixedAsset.${a}.status remains DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: depreciation_run_period_slot_rules
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - entities.DepreciationRun.fields.period
        distinguishing_aspect: |
          Resource DepreciationRun with discrete full-month slot semantics: periods
          are a strictly sequential chain (latest POSTED + 1); a slot occupied by an
          OPEN run conflicts with ERR_DUPLICATE_RUN_PERIOD, by a POSTED run with
          ERR_PERIOD_ALREADY_POSTED, and skipping a slot with ERR_PERIOD_GAP.
        test_recipe:
          setup:
            - "Empty DB; run 2026-01 created and POSTED (no assets needed — zero-entry post is legal)"
          setup_api_calls:
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /depreciation-runs"
              payload: { period: "2026-03" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err_gap: $.data.error_id }
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r2: $.data.id }
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err_dup: $.data.error_id }
            - call: "POST /depreciation-runs/${r2}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err_posted: $.data.error_id }
          assert:
            - "2026-03 create -> ERR_PERIOD_GAP (must be latest POSTED + 1 = 2026-02)"
            - "first 2026-02 create -> 201; second 2026-02 create -> ERR_DUPLICATE_RUN_PERIOD (OPEN slot occupied)"
            - "after posting 2026-02, a third 2026-02 create -> ERR_PERIOD_ALREADY_POSTED (slot sealed)"

      - name: impairment_review_open_window_exclusivity
        grounds:
          - validations[priority=6]
          - state_machines.ImpairmentReview
          - errors[ERR_IMPAIRMENT_REVIEW_OPEN]
        distinguishing_aspect: |
          Resource FixedAsset with half-open window semantics [opened, resolved):
          a second review for the same asset is rejected while one is OPEN, and the
          slot frees only when the open review reaches a terminal state (DISMISSED
          here) — a different interval semantics than the discrete run-period slots.
        test_recipe:
          setup:
            - "AssetClass MACH; asset A-960 cost 400000 in service 2026-01-10 (no runs needed)"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-960", description: "Reviewed asset", asset_class_id: "${cls}", acquisition_cost_cents: 400000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /impairment-reviews"
              payload: { asset_id: "${a}", indicator: "OBSOLESCENCE" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /impairment-reviews"
              payload: { asset_id: "${a}", indicator: "MARKET_DECLINE" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
            - call: "POST /impairment-reviews/${r1}/dismiss"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
            - call: "POST /impairment-reviews"
              payload: { asset_id: "${a}", indicator: "MARKET_DECLINE" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r3: $.data.id }
          assert:
            - "Second create while R1 is OPEN -> ERR_IMPAIRMENT_REVIEW_OPEN (http 409)"
            - "After dismissing R1, third create succeeds (201) — the [opened, resolved) window closed"
            - "ImpairmentReview.${r3}.status == OPEN; exactly 2 reviews exist for the asset (DISMISSED + OPEN)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cip_posted_cost_conservation
        grounds:
          - calculations.cip_accumulated_total
          - state_machines.CIPCostLine
          - state_machines.CapitalProject
        distinguishing_aspect: |
          Conserved quantity: CIP cents. Post/reverse pairs keep
          total_accumulated_cents == sum(POSTED line amounts) at every step, and
          capitalize transfers exactly that total into the asset's
          acquisition_cost_cents with zero drift.
        test_recipe:
          setup:
            - "AssetClass MACH threshold 250000; project PROJ-D with lines 100000, 150000, 200000 posted, then the 150000 line reversed"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-D", name: "Conservation", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pj: $.data.id }
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pj}", amount_cents: 100000, cost_type: "MATERIAL", incurred_date: "2026-01-05" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pj}", amount_cents: 150000, cost_type: "LABOR", incurred_date: "2026-01-12" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { line2: $.data.id }
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pj}", amount_cents: 200000, cost_type: "VENDOR_INVOICE", incurred_date: "2026-01-19" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /cip-cost-lines/${line2}/reverse"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "GET /capital-projects/${pj}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { total_pre: $.data.total_accumulated_cents }
            - call: "POST /capital-projects/${pj}/capitalize"
              payload: { asset_tag: "A-970", description: "Capitalized asset" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { asset: $.data.capitalized_asset_id }
            - call: "GET /fixed-assets/${asset}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { cost: $.data.acquisition_cost_cents }
          assert:
            - "After reversal: total_accumulated_cents == 300000 == 100000 + 200000 (POSTED-only sum; the REVERSED 150000 line is excluded)"
            - "Capitalize: FixedAsset.${asset}.acquisition_cost_cents == 300000 — exact transfer, no drift"
            - "Post-capitalize invariant: total_accumulated_cents still == 300000 == sum of POSTED lines (lines frozen because project is no longer OPEN)"

      - name: depreciation_accumulated_equals_entry_sum
        grounds:
          - calculations.book_period_depreciation
          - calculations.disposal_gain_loss
          - entities.FixedAsset.fields.accumulated_book_cents
        distinguishing_aspect: |
          Conserved quantity: per-asset per-ledger depreciation cents.
          accumulated_book_cents == sum of BOOK entry amounts and
          accumulated_tax_cents == sum of TAX entry amounts after every forward
          action (runs) and after the compensating lifecycle end (SCRAP disposal
          posts no further entries once FULLY_DEPRECIATED — the ledger stays
          balanced rather than drifting).
        test_recipe:
          setup:
            - "AssetClass MACH (MACRS_5YR, no bonus); Asset A-980 cost 24000, life 2, SL, in service 2026-01-10"
            - "Runs 2026-01 and 2026-02 posted (asset becomes FULLY_DEPRECIATED on book; tax at 800)"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-980", description: "Short-lived tool", asset_class_id: "${cls}", acquisition_cost_cents: 24000, cost_center: "CC1", location: "PLANT-1", useful_life_months: 2 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r2: $.data.id }
            - call: "POST /depreciation-runs/${r2}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SCRAP", effective_date: "2026-03-20" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { d: $.data.id }
            - call: "POST /disposals/${d}/approve"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          trigger:
            - call: "POST /disposals/${d}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { book_gl: $.data.book_gain_loss_cents, tax_gl: $.data.tax_gain_loss_cents }
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { acc_b: $.data.accumulated_book_cents, acc_t: $.data.accumulated_tax_cents }
          assert:
            - "sum(BOOK entries) == 12000 + 12000 == 24000 == FixedAsset.${a}.accumulated_book_cents after the SCRAP post"
            - "sum(TAX entries) == 400 + 400 == 800 == FixedAsset.${a}.accumulated_tax_cents (24000*0.20/12 = 400 per month)"
            - "No DISPOSAL_FINAL entries exist for ${d}: asset was FULLY_DEPRECIATED, so the final-entry step was skipped"
            - "Disposal.${d}: book_gain_loss_cents == 0 (0 - (24000 - 24000 - 0)); tax_gain_loss_cents == -23200 (0 - (24000 - 800))"
