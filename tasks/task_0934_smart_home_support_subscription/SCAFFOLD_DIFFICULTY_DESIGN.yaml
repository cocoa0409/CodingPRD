  - rule_id: priority_pair_validation_conflict
    instances:
      - name: row_scope_denial_preempts_invalid_state_on_customer_reply
        grounds:
          - validations[priority=19]
          - validations[priority=27]
          - errors[ERR_ROW_SCOPE_DENIED]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair (auth, state): the request violates BOTH the row-scope rule
          at priority 19 and the workflow from-state rule at priority 27 (a NEW ticket
          cannot take a customer reply), and the reported error must be
          ERR_ROW_SCOPE_DENIED (403), never ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One PRO plan and two households, A (OWNER ownA) and B (OWNER ownB), each with an ACTIVE subscription."
