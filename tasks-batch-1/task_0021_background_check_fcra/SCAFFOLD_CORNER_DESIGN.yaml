          - endpoints.GET_/api/v1/audit-logs
        distinguishing_aspect: "GET /audit-logs is exclusive to ComplianceOfficer; Recruiter is denied."
        test_recipe:
          setup: ["At least one AuditLog row exists (any setup yields one)."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "MS" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "GET /api/v1/audit-logs"
              payload: {}
              as: Recruiter
              as_user_id: "rec-1"
              captures: { recruiter_err: $.data.error_id }
            - call: "GET /api/v1/audit-logs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { officer_response_type: $.response_type }
          assert:
            - "recruiter_err == 'ERR_UNAUTHORIZED'"
            - "officer_response_type == 'array'"

      - name: rbac_segregation_of_duties_already_covered_stub
        claim_type: segregation_of_duties
        grounds:
          - roles.ComplianceOfficer
          - roles.Recruiter
        excluded_because:
          difficulty_instance: compensating_invariant / adverse_action_finalized_count_unchanged_after_dispute_flip_pass
          rationale: "The segregation-of-duties principle (X-User-ID must differ) is asserted in the §1.8 Rule 4b finalize cascade and the corner segregation instance."

  # =====================================================================
  # From Cross-Cutting Complexity Layers — OCC, cascading side effects, scheduled actions
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_finalize_with_stale_adverse_action_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[finalize-stale-adverse-action]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a Verification dispute bumps AdverseAction.version, finalize with the pre-dispute version returns ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "AdverseAction in DISPUTED state (was bumped by Verification dispute cascade)."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "AL" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Chien-Shiung Wu", email: "wu@example.com", date_of_birth: "1912-05-31T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_id}", position_title: "Scientist" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /api/v1/consents/${c_id}/grant"
              payload: { expected_consent_disclosure_version: "${c_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${c_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { order_id: $.data.id }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "CRIMINAL" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { crim_id: $.data.id, crim_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "MVR" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { mvr_id: $.data.id, mvr_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "EDUCATION" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { edu_id: $.data.id, edu_v0: $.data.version }
            - call: "POST /api/v1/verifications/${mvr_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${mvr_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${edu_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${edu_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${crim_id}/report"
              payload: { result: "FAIL", report_payload: { hits: 1 }, expected_verification_version: "${crim_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
              captures: { crim_v1: $.data.version }
            - call: "GET /api/v1/background-check-orders/${order_id}/adverse-action"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { aa_id: "$.data[0].id", aa_v_stale: "$.data[0].version" }
            - call: "POST /api/v1/verifications/${crim_id}/dispute"
              payload: { dispute_reason: "appeal", expected_verification_version: "${crim_v1}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T10:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/adverse-actions/${aa_id}/finalize"
              payload: { expected_adverse_action_version: "${aa_v_stale}" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_STALE_VERSION'"

      - name: scheduled_action_clock_set_drives_waiting_period_passage
        claim_type: scheduled_actions
        grounds:
          - entities.SystemClock
          - endpoints.POST_/api/v1/_clock/set_current_utc
          - calculations.compute_earliest_final
        distinguishing_aspect: "The SystemClock singleton is the sole source of 'now'; setting it forward advances the waiting period without wall-clock waits."
        excluded_because:
          difficulty_instance: boundary_precision_check / finalize_at_exactly_earliest_final_at_succeeds_one_ms_before_fails
          rationale: "Clock advancement is exercised in §1.8 Rule 6a (boundary test that sets the clock to T-1ms then T)."

      - name: cascading_side_effects_consent_revoke_cancels_order_and_verifications
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ConsentDisclosure.GRANTED_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / third_verification_report_cascades_to_order_complete_to_adverse_action_create
          rationale: "Cascade verification is covered by Rule 4a (REPORT cascade) and by the corner instance consent_revoke_cascade_cancels_pending_order."

  # =====================================================================
  # From Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_order_recompute_visible_in_same_request_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After POST /verifications/{id}/report, the same response reflects the post-recompute parent order status when fetched in a subsequent call (no eventual lag)."
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_compound_status_derived_from_three_parallel_children
          rationale: "Immediate-visibility of cascaded posture recomputation is asserted in §1.8 Rule 3a, which observes status changes after each REPORT."
