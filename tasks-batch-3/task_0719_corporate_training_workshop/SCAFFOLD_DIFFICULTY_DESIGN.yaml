              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac One", email: "fac1@x.com", certified_categories: ["TECHNICAL"], travel_base_cents: 10000 }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", contract_id: "${ctr_id}", seat_capacity: 5, delivery_mode: "ONSITE", starts_at: "2026-04-01T09:00:00Z", ends_at: "2026-04-01T17:00:00Z", enroll_deadline: "2026-03-31T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "l1@x.com", learner_name: "L One" }
              as: SchedulingCoordinator
              captures: { reg1: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "l2@x.com", learner_name: "L Two" }
              as: SchedulingCoordinator
              captures: { reg2: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "l3@x.com", learner_name: "L Three" }
              as: SchedulingCoordinator
              captures: { reg3: $.data.id }
            - call: "POST /training/registrations/${reg1}/confirm"
              payload: {}
              as: Learner
              as_user_id: "l1@x.com"
            - call: "POST /training/registrations/${reg2}/confirm"
              payload: {}
              as: Learner
              as_user_id: "l2@x.com"
            - call: "POST /training/registrations/${reg3}/confirm"
              payload: {}
              as: Learner
              as_user_id: "l3@x.com"
            - call: "GET /training/cohorts/${coh_id}"
              payload: {}
              as: SchedulingCoordinator
              captures: { coh_v: $.data.version }
            - call: "POST /training/cohorts/${coh_id}/lock"
              payload: { expected_cohort_version: "${coh_v}" }
              as: SchedulingCoordinator
            - call: "GET /training/contracts/${ctr_id}"
              payload: {}
              as: FinanceManager
              captures: { committed_after_lock: $.data.committed_cents }
            - call: "POST /training/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/start"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/registrations/${reg1}/mark-attendance"
              payload: {}
              as: Facilitator
              as_user_id: "${fac_id}"
            - call: "POST /training/registrations/${reg2}/mark-attendance"
              payload: {}
              as: Facilitator
              as_user_id: "${fac_id}"
            - call: "POST /training/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T17:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/deliver"
              payload: {}
              as: SchedulingCoordinator
          trigger:
            - call: "POST /training/cohorts/${coh_id}/close"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /training/contracts/${ctr_id}"
              payload: {}
              as: FinanceManager
              captures: { committed_after_close: $.data.committed_cents, remaining_after_close: $.data.remaining_cents }
          assert:
            - "EnterpriseContract.committed_cents == 0 immediately after lock (RESERVED is a soft hold)"
            - "EnterpriseContract.committed_cents == 115000 after close (COMMITTED = FINAL over 2 ATTENDED)"
            - "EnterpriseContract.remaining_cents == 385000 after close"
            - "RESERVED (167500) != COMMITTED (115000) — differ by the 1 NO_SHOW seat"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_three_input_branching_formula
        grounds:
          - calculations.invoice_totals
          - entities.ProgramVersion.fields.pricing_model
          - entities.Cohort.fields.delivery_mode
          - entities.Facilitator.fields.travel_base_cents
        distinguishing_aspect: |
          MODE (a) non-linear interaction: total_cents combines THREE inputs whose contributions are selected by
          conditional branches — tuition branches on pricing_model (PER_SEAT*seats vs FLAT flat_fee), materials scale
          by seats, travel branches on delivery_mode in {ONSITE,HYBRID} — so three independent branch choices interact.
        test_recipe:
          setup:
            - "FLAT ProgramVersion APPROVED (flat_fee_cents=200000, materials_kit_cents=3000, min_seats=1), VIRTUAL delivery, SALES category"
            - "Facilitator ACTIVE certified SALES travel_base_cents=99999 (irrelevant: VIRTUAL => travel=0)"
            - "VIRTUAL cohort seat_capacity=6; 4 CONFIRMED; locked -> PROVISIONAL invoice"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Sales Flat", category: "SALES", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 4, pricing_model: "FLAT", flat_fee_cents: 200000, materials_kit_cents: 3000, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac S", email: "facs@x.com", certified_categories: ["SALES"], travel_base_cents: 99999 }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 6, delivery_mode: "VIRTUAL", starts_at: "2026-05-01T09:00:00Z", ends_at: "2026-05-01T13:00:00Z", enroll_deadline: "2026-04-30T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "a@x.com", learner_name: "A" }
              as: SchedulingCoordinator
              captures: { r1: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "b@x.com", learner_name: "B" }
              as: SchedulingCoordinator
              captures: { r2: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "c@x.com", learner_name: "C" }
              as: SchedulingCoordinator
              captures: { r3: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "d@x.com", learner_name: "D" }
              as: SchedulingCoordinator
              captures: { r4: $.data.id }
            - call: "POST /training/registrations/${r1}/confirm"
              payload: {}
              as: Learner
              as_user_id: "a@x.com"
            - call: "POST /training/registrations/${r2}/confirm"
              payload: {}
              as: Learner
              as_user_id: "b@x.com"
            - call: "POST /training/registrations/${r3}/confirm"
              payload: {}
              as: Learner
              as_user_id: "c@x.com"
            - call: "POST /training/registrations/${r4}/confirm"
              payload: {}
              as: Learner
              as_user_id: "d@x.com"
            - call: "GET /training/cohorts/${coh_id}"
              payload: {}
              as: SchedulingCoordinator
              captures: { coh_v: $.data.version }
          trigger:
            - call: "POST /training/cohorts/${coh_id}/lock"
              payload: { expected_cohort_version: "${coh_v}" }
              as: SchedulingCoordinator
            - call: "GET /training/cohorts/${coh_id}/invoices"
              payload: {}
              as: FinanceManager
              captures: { invs: $.data }
          assert:
            - "PROVISIONAL Invoice.tuition_cents == 200000 (FLAT branch — independent of 4 seats)"
            - "PROVISIONAL Invoice.materials_cents == 12000 (3000 * 4 CONFIRMED seats)"
            - "PROVISIONAL Invoice.travel_cents == 0 (VIRTUAL branch suppresses travel_base_cents=99999)"
            - "PROVISIONAL Invoice.total_cents == 212000"

      - name: contract_drawdown_pinned_eval_order
        grounds:
          - calculations.contract_drawdown
          - calculations.invoice_totals
          - state_machines.Cohort.DELIVERED_to_CLOSED
          - validations[priority=18]
        distinguishing_aspect: |
          MODE (c) pinned evaluation order: at CLOSE the FINAL invoice total (over ATTENDED seats) MUST be computed
          FIRST, THEN the draw is compared to remaining_cents and applied — the draw depends on an output that must
          be evaluated before the comparison, so the order is explicit and not a circular reference.
        test_recipe:
          setup:
            - "Contract ACTIVE budget_cents=120000"
            - "PER_SEAT ONSITE cohort 3 CONFIRMED; if draw used PROVISIONAL (167500>120000) close would wrongly fail"
            - "Only 2 ATTENDED -> FINAL 115000 <= 120000 so close succeeds; proves FINAL computed before the budget compare"
          setup_api_calls:
            - call: "POST /training/contracts"
              payload: { client_name: "Tight", budget_cents: 120000 }
              as: FinanceManager
              captures: { ctr_id: $.data.id }
            - call: "POST /training/programs"
