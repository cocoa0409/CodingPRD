            - "Facility.${fac_id}.version == ${fac_v} + 1 and updated_at == 2026-05-01T00:00:00.000Z"
            - "Facility.${fac_id}.water_volume_gallons is still 60000 (untouched fields are preserved)"

      - name: filtered_list_endpoints_resolve_every_declared_foreign_key
