          assert:
            - "first begin-installation: error_id == ERR_PARTS_PENDING with parts_pending_count == 1"
            - "after receive: parts_pending_count == 0 exactly (RECEIVED excluded from pending set)"
            - "second begin-installation succeeds: status == INSTALLATION and inducted_at == 2026-08-01T09:00:00Z"

