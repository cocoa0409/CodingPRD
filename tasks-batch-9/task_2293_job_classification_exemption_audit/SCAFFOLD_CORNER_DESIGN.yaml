        claim_type: side_effect_execution
        grounds: ["state_machines.AuditProject.FIELDWORK_to_REMEDIATION", "entities.JobFamily.fields.remediation_priority_rank"]
        distinguishing_aspect: "The ranking side effect must fire for every family of the project and must break a full tie (both risk_score 0 and both family_headcount 0) on created_at ASC, never on id. Two empty families make the tie total, so any id-based ordering is a coin flip that this assertion catches."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one AuditProject advanced to FIELDWORK holding two JobFamilies created in order OPS-ALPHA then OPS-BETA, neither with any Position."
