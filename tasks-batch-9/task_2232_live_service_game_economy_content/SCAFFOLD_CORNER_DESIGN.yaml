              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { t2_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "TIER_3", price_tier: "T3", list_price_minor: 1000, line_items: [{ sku: "T3_COINS", base_price_minor: 1000, declared_value_minor: 1400, granted_currency_code: "SOFT_COIN", granted_amount_minor: 1400 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
