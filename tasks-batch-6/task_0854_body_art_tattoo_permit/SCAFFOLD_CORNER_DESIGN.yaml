      - name: infection_notification_waiver_and_reopen_limit_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=29]
          - validations[priority=30]
          - errors[ERR_NOTIFICATION_NOT_WAIVABLE]
          - errors[ERR_INFECTION_REOPEN_LIMIT]
          - state_machines.InfectionReport.investigation_status_RULED_OUT_to_SCREENING
        distinguishing_aspect: "MARK_NOT_REQUIRED on an MRSA report returns ERR_NOTIFICATION_NOT_WAIVABLE (409) because only infection_type OTHER is waivable, and the third REOPEN on the investigation axis returns ERR_INFECTION_REOPEN_LIMIT (409) once reopen_count has reached INFECTION_MAX_REOPENS of 2."
        test_recipe:
          setup:
            - "One Establishment with a single MRSA InfectionReport at both axes' initial states."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Report Limits Ink", street_address: "39 Thirtyninth St", county_code: "ADA", establishment_type: "PIERCING" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
