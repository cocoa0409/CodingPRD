        distinguishing_aspect: |
          Member carries two PARALLEL state dimensions on one row. VERIFY moves
          eligibility PENDING_VERIFICATION -> ELIGIBLE while access stays NO_BADGE;
          LAPSE drags access ACTIVE -> REVOKED as a cross-dimension consequence;
          but REINSTATE deliberately does NOT re-couple them — access remains
          REVOKED until a fresh badge grant. The combined state therefore visits
          (ELIGIBLE, NO_BADGE), (ELIGIBLE, ACTIVE), (LAPSED, REVOKED) and
          (ELIGIBLE, REVOKED), which a single-dimension machine cannot express.
