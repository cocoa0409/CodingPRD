          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantic A (buffered half-open blocked interval on Facility): a permit
          occupying [01:00, 04:00) with 30/30 buffers blocks [00:30, 04:30). A request
          whose own blocked interval [04:30, 06:30) touches at the exclusive endpoint
          04:30 MUST approve; a request overlapping by 30 minutes ([04:00, 05:00) ->
