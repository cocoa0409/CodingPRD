      - name: score_ignores_planned_and_lapsed_measures
        claim_type: input_set_filtering
        grounds: [calculations.reasonable_measures_score]
        distinguishing_aspect: "Input-set filter: PLANNED and LAPSED measures contribute 0 to BOTH variants — asset with one VERIFIED TECHNICAL (25), one PLANNED CONTRACTUAL, one LAPSED PHYSICAL scores exactly 25/25."
        test_recipe:
          setup: ["REGISTERED asset with TECHNICAL VERIFIED, CONTRACTUAL PLANNED, PHYSICAL VERIFIED-then-LAPSED"]
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Filter probe", description: "x", classification: "CONFIDENTIAL", owner_department: "ENG", exposure_estimate_cents: 3000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "t", evidence_uri: "s3://ev/t.pdf" }
              as: SecurityOfficer
              captures: { m1: $.data.id }
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "CONTRACTUAL", title: "c" }
              as: SecurityOfficer
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "PHYSICAL", title: "p", evidence_uri: "s3://ev/p.pdf" }
              as: SecurityOfficer
              captures: { m3: $.data.id }
            - call: "POST /api/measures/${m3}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m3}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures/${m3}/state"
              payload: { to_status: "LAPSED" }
              as: IPCounsel
          trigger:
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
          assert:
            - "SecretAsset.${a_id}.score_operational == 25 (only VERIFIED TECHNICAL counts)"
            - "SecretAsset.${a_id}.score_documentary == 25"
            - "SecretAsset.${a_id}.protection_posture == DEFICIENT (25 < 40)"

      - name: training_current_flips_on_overdue_and_recovers
        claim_type: correct_result
        grounds: [calculations.training_current, entities.Employee.fields.training_current]
        distinguishing_aspect: "training_current is true after completing BASIC_TS within validity; sweeping past the due date of a second ASSIGNed module flips it false (OVERDUE present); completing that module flips it back true."
        test_recipe:
          setup: ["ACTIVE employee; BASIC_TS completed at 2026-05-01; second CLEAN_DESK assignment due 2026-05-10"]
          setup_api_calls:
            - call: "POST /api/employees"
