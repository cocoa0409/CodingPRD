  - rule_id: boundary_precision_check
    instances:

      - name: intake_yield_step_fires_at_exactly_25_00_brix
        grounds:
          - calculations.intake_yield
          - entities.HarvestIntake.fields.brix
          - entities.HarvestIntake.fields.estimated_gallons
          - state_machines.HarvestIntake.SAMPLED_to_ACCEPTED
        distinguishing_aspect: |
          A NUMERIC threshold boundary on the brix metric, reached through
          POST /harvest-intakes/{id}/transitions: two 5.0-ton loads differing by
          0.01 Brix land on opposite sides of HIGH_BRIX_THRESHOLD, so the >= test
          at exactly 25.00 costs the flat 5.0 gal/ton step and yields 800.00
          gallons while 24.99 yields 825.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z."
            - "One ACTIVE Contract with crush_rate_cents_per_ton 50000."
            - "Two SAMPLED loads of identical weight — net 10000 lbs (5.0 tons) each — one recorded at exactly 25.00 Brix and the other at 24.99 Brix."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
