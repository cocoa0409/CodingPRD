              captures: { qa_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000, retest_tightening_enabled: true }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-D", quantity: 12 }
              captures: { lot_id: "$.data.id" }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: PLATE_PRODUCTION }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: FORMATION }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: ASSEMBLY }
              captures: { lot_v: "$.data.version" }
            - call: POST /production-lots/${lot_id}/sampling-plans
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { expected_lot_version: "${lot_v}", plan_reason: "initial acceptance plan" }
          trigger:
            - call: POST /production-lots/${lot_id}/disposition
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { action: RELEASE, disposition_note: "premature release attempt" }
              captures: { err_sampling: "$.data.error_id" }
            - call: POST /production-lots/${lot_id}/disposition
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { action: QUARANTINE, disposition_note: "hold pending evidence" }
            - call: POST /production-lots/${lot_id}/disposition
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { action: RETEST, disposition_note: "re-open with a tightened plan" }
            - call: GET /production-lots/${lot_id}/quality-summary
              as: QualityInspector
              as_user_id: "${qa_a_id}"
          assert:
            - "The initial plan answered sample_size == 4 and acceptance_number == 0 (ceil(sqrt(12)) == 4, tier c0 == 0) with sampling_plan_revision == 1."
            - "The RELEASE answers 409 with error_id \"ERR_SAMPLING_INCOMPLETE\" - completed_test_count 0 is below sample_size 4 - and process_state stays \"LOT_TESTING\"."
            - "The QUARANTINE answers 200 with process_state \"QUARANTINED\": the same endpoint admits a different action in the same state."
            - "The RETEST answers 200 with process_state \"LOT_TESTING\", retest_count == 1 and sampling_plan_revision == 2."
            - "quality-summary now answers sample_size == 8 and acceptance_number == 0 - the RETEST redrew the plan in the same call (min(4 * 2, 20) == 8, max(0 - 1, 0) == 0), so a single failure will now quarantine the lot."
            - "quality-summary answers completed_test_count == 0 and failed_test_count == 0 - the RETEST zeroed the counters rather than carrying them over."

  # ===================================================================
  # SECTION 6 - ERRORS (guide section 6: every error code is triggerable)
  #   §1.6 declares 61 codes. They are covered as follows:
  #     * the auth / validation / 404 families (18 codes) and the
  #       state-invalid family (7 codes) by the two batch instances below;
  #     * the two selector codes by the third instance;
  #     * ERR_DUPLICATE_CODE, ERR_PLATE_TYPE_INCOMPATIBLE,
  #       ERR_CHEMISTRY_NOT_LICENSED, ERR_SAMPLING_INCOMPLETE,
  #       ERR_PLANT_SCOPE_MISMATCH, ERR_SIZING_REQUEST_STATE_INVALID,
  #       ERR_CONNECTION_COUNT_MISMATCH, ERR_ACTING_WORKER_NOT_FOUND and
  #       ERR_PLANT_RESTRICTED by the validations / endpoints / calculations
  #       instances above;
  #     * the capacity, budget, cascade, warranty and core codes by the
  #       §1.8 instances named in the stubs at the end of this section.
  # ===================================================================
  - section: errors
    instances:

      - name: auth_validation_and_not_found_codes_are_each_triggerable
        claim_type: every error code is triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_VALIDATION]
          - errors[ERR_PLANT_NOT_FOUND]
          - errors[ERR_WORKER_NOT_FOUND]
          - errors[ERR_CELL_DESIGN_NOT_FOUND]
          - errors[ERR_FORMATION_BAY_NOT_FOUND]
          - errors[ERR_TEST_CHAMBER_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_ASSEMBLY_NOT_FOUND]
          - errors[ERR_FORMATION_RUN_NOT_FOUND]
          - errors[ERR_CAPACITY_TEST_NOT_FOUND]
          - errors[ERR_CHARGER_NOT_FOUND]
          - errors[ERR_SIZING_REQUEST_NOT_FOUND]
          - errors[ERR_BATTERY_UNIT_NOT_FOUND]
        distinguishing_aspect: "The 404 family is eleven distinct codes rather than one generic ERR_NOT_FOUND, and the distinction is per entity kind and per position: an unresolvable id in the path answers the code of the addressed entity while an unresolvable foreign key in the BODY answers the code of the referenced entity (a plant id in POST /workers answers ERR_PLANT_NOT_FOUND, not ERR_WORKER_NOT_FOUND)."
        test_recipe:
          setup:
            - "An empty system: only the logical clock is set, so every id below is guaranteed absent."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
          trigger:
            - call: POST /plants
              as: Anonymous
              payload: { name: "Ghost Works", site_code: "PLT-GHOST", licensed_chemistries: [LEAD_ACID], permit_status: ACTIVE, monthly_lead_emission_permit_g: 1000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10.000 }
              captures: { err_unauth: "$.data.error_id" }
            - call: POST /plants
              as: WarrantyAdministrator
              payload: { name: "Ghost Works", site_code: "PLT-GHOST", licensed_chemistries: [LEAD_ACID], permit_status: ACTIVE, monthly_lead_emission_permit_g: 1000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10.000 }
              captures: { err_role: "$.data.error_id" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Ghost Works", site_code: "PLT-GHOST", licensed_chemistries: [LEAD_ACID], permit_status: PENDING_RENEWAL_TYPO, monthly_lead_emission_permit_g: 1000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10.000 }
              captures: { err_valid: "$.data.error_id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "00000000-0000-0000-0000-000000000001", full_name: "Nobody", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { err_plant_fk: "$.data.error_id" }
            - call: GET /plants/00000000-0000-0000-0000-000000000001
              as: PlantAdmin
              captures: { err_plant_path: "$.data.error_id" }
            - call: GET /workers/00000000-0000-0000-0000-000000000002
              as: PlantAdmin
              captures: { err_worker: "$.data.error_id" }
            - call: GET /cell-designs/00000000-0000-0000-0000-000000000003
              as: PlantAdmin
              captures: { err_design: "$.data.error_id" }
            - call: GET /formation-bays/00000000-0000-0000-0000-000000000004
              as: PlantAdmin
              captures: { err_bay: "$.data.error_id" }
            - call: GET /test-chambers/00000000-0000-0000-0000-000000000005
              as: PlantAdmin
              captures: { err_chamber: "$.data.error_id" }
            - call: GET /production-lots/00000000-0000-0000-0000-000000000006
              as: PlantAdmin
              captures: { err_lot: "$.data.error_id" }
            - call: GET /battery-assemblies/00000000-0000-0000-0000-000000000007
              as: PlantAdmin
              captures: { err_assembly: "$.data.error_id" }
            - call: GET /formation-runs/00000000-0000-0000-0000-000000000008
              as: PlantAdmin
              captures: { err_run: "$.data.error_id" }
            - call: GET /capacity-tests/00000000-0000-0000-0000-000000000009
              as: PlantAdmin
              captures: { err_test: "$.data.error_id" }
            - call: GET /chargers/00000000-0000-0000-0000-00000000000a
              as: PlantAdmin
              captures: { err_charger: "$.data.error_id" }
            - call: GET /fleet-sizing-requests/00000000-0000-0000-0000-00000000000b
              as: PlantAdmin
              captures: { err_sizing: "$.data.error_id" }
            - call: GET /battery-units/00000000-0000-0000-0000-00000000000c
              as: PlantAdmin
              captures: { err_unit: "$.data.error_id" }
          assert:
            - "The header-less request (no X-User-Role, shown as Anonymous) answers 401 with error_id \"ERR_UNAUTHENTICATED\"."
            - "The WarrantyAdministrator attempt at a PlantAdmin-exclusive create answers 403 with error_id \"ERR_ROLE_NOT_PERMITTED\"."
            - "The bad permit_status enum answers 422 with error_id \"ERR_VALIDATION\"."
            - "The unresolvable body plant_id answers 404 with error_id \"ERR_PLANT_NOT_FOUND\" - the body FK is attributed to Plant, not to the created Worker."
            - "The eleven single-resource GETs answer 404 with, in order, ERR_PLANT_NOT_FOUND, ERR_WORKER_NOT_FOUND, ERR_CELL_DESIGN_NOT_FOUND, ERR_FORMATION_BAY_NOT_FOUND, ERR_TEST_CHAMBER_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_ASSEMBLY_NOT_FOUND, ERR_FORMATION_RUN_NOT_FOUND, ERR_CAPACITY_TEST_NOT_FOUND, ERR_CHARGER_NOT_FOUND, ERR_SIZING_REQUEST_NOT_FOUND and ERR_BATTERY_UNIT_NOT_FOUND."
            - "Every error body carries the standard envelope: meta.api_request_id, meta.api_request_timestamp, response_type and a data object holding error_id and message."
            - "GET /plants answers total_count == 0 - none of the rejected writes persisted anything."

      - name: state_invalid_and_evidence_codes_are_each_triggerable
        claim_type: every error code is triggerable
        grounds:
          - errors[ERR_DESIGN_STATE_INVALID]
          - errors[ERR_LOT_STATE_INVALID]
          - errors[ERR_ASSEMBLY_STATE_INVALID]
          - errors[ERR_ASSEMBLY_AXIS_ALREADY_RECORDED]
          - errors[ERR_ASSEMBLY_NOT_CERTIFIED]
          - errors[ERR_CONNECTION_COUNT_MISMATCH]
          - errors[ERR_WINDOW_INVALID]
          - errors[ERR_DESIGN_NOT_APPROVED]
        distinguishing_aspect: "Eight refusals that all look like \"wrong state\" but must answer eight different codes, including two pairs that are easy to collapse: a not-yet-verified assembly answers ERR_ASSEMBLY_NOT_CERTIFIED when a test is scheduled but ERR_ASSEMBLY_STATE_INVALID when a rework is attempted, and a DRAFT design answers ERR_DESIGN_STATE_INVALID on APPROVE but ERR_DESIGN_NOT_APPROVED when a lot is opened against it."
        test_recipe:
          setup:
            - "One plant, four workers, one DRAFT design CD-DRAFT and one APPROVED design CD-LEAD-465; lot LOT-S carried to LOT_TESTING (assembly ASM-S1 built with module_count 6 and left PENDING, then the first sampling plan drawn); one chamber."
