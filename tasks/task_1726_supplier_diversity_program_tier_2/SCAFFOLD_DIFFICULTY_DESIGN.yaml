# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Supplier Diversity Program & Tier-2 Reporting
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; ≥2 instances per §0.5 rule.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: spend_attribution_accrual_vs_cash_basis
        grounds:
          - calculations.diverse_spend_attribution
          - entities.Scorecard.fields.attribution_basis
          - entities.Scorecard.fields.direct_diverse_spend_cents
        distinguishing_aspect: |
          Same three spend records, same period, same certification: the ACCRUAL variant
          (transaction_date) attributes 300000 diverse cents out of 350000 total, while the
          CASH variant (payment_date) attributes 0 out of 50000 — different entity domain
          (spend accounting) than the risk-score instance.
        test_recipe:
          setup:
            - "BU AERO with a PUBLISHED ALL-category PERCENT_OF_SPEND goal of 50.00 for FY2026 (created by admin-1, published by admin-2 per SoD)"
            - "Diverse supplier with VERIFIED MBE certification covering 2026-01-01..2026-12-31"
            - "Prime (non-diverse) supplier"
            - "R1: diverse supplier, 100000, txn 2026-03-15, pay 2026-04-20"
            - "R2: diverse supplier, 200000, txn 2026-03-25, pay 2026-05-10"
            - "R3: prime supplier, 50000, txn 2026-02-01, pay 2026-02-15"
            - "Logical clock at startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1", inclusion_min_diverse_bidders: 1 }
              as: DiversityAdmin
              captures: { bu_id: $.data.id, bu_v: $.data.version }
            - call: "POST /api/v1/business-units/${bu_id}/goals"
              payload: { fiscal_year: 2026, cert_category: "ALL", goal_type: "PERCENT_OF_SPEND", target_value: 50.00, include_tier2: true, expected_business_unit_version: "${bu_v}" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { goal_id: $.data.id }
            - call: "POST /api/v1/goals/${goal_id}/publish"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-2
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Diverse Parts Co", tax_id: "T-100", kind: "DIVERSE", contact_email: "d@x.com" }
              as: DiversityAnalyst
              captures: { sup_d: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_d}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "C-100", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_d: $.data.id }
            - call: "POST /api/v1/certifications/${cert_d}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_d}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Prime Build Inc", tax_id: "T-200", kind: "PRIME", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { sup_p: $.data.id }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_d}", business_unit_id: "${bu_id}", amount_cents: 100000, transaction_date: "2026-03-15", payment_date: "2026-04-20" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_d}", business_unit_id: "${bu_id}", amount_cents: 200000, transaction_date: "2026-03-25", payment_date: "2026-05-10" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_p}", business_unit_id: "${bu_id}", amount_cents: 50000, transaction_date: "2026-02-01", payment_date: "2026-02-15" }
              as: DiversityAnalyst
          trigger:
            - call: "POST /api/v1/business-units/${bu_id}/scorecards"
              payload: { reporting_period: "2026-Q1", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { sca_total: $.data.total_spend_cents, sca_diverse: $.data.direct_diverse_spend_cents, sca_att: $.data.attainment_pct, sca_rating: $.data.rating }
            - call: "POST /api/v1/business-units/${bu_id}/scorecards"
              payload: { reporting_period: "2026-Q1", attribution_basis: "CASH" }
              as: DiversityAnalyst
              captures: { scb_total: $.data.total_spend_cents, scb_diverse: $.data.direct_diverse_spend_cents, scb_att: $.data.attainment_pct, scb_rating: $.data.rating }
          assert:
            - "ACCRUAL scorecard total_spend_cents == 350000"
            - "ACCRUAL scorecard direct_diverse_spend_cents == 300000"
            - "ACCRUAL scorecard attainment_pct == 171.42 and rating == EXCEEDS"
            - "CASH scorecard total_spend_cents == 50000"
            - "CASH scorecard direct_diverse_spend_cents == 0"
            - "CASH scorecard attainment_pct == 0 and rating == BELOW"
            - "Identical records, two bases: diverse totals differ by exactly 300000 cents"

      - name: supplier_risk_standard_vs_conservative
        grounds:
          - calculations.supplier_risk_score
          - entities.Supplier.fields.risk_score_standard
          - entities.Supplier.fields.risk_score_conservative
        distinguishing_aspect: |
          Same supplier's audit/certification history yields risk_score_standard == 40 but
          risk_score_conservative == 60, because the CONSERVATIVE variant additionally counts
          the OPEN audit (+15) and the INFO_REQUESTED certification (+5) — different entity
          domain (supplier compliance risk) than the spend-attribution instance.
        test_recipe:
          setup:
            - "Supplier with SELF_CERT cert verified (submitted by analyst-1, verified by admin-1), then FAILED audit (auditor-9) at default clock 2026-08-01 -> cert REVOKED, supplier SUSPENDED"
            - "Clock advanced to 2026-11-15 (past the 90-day cooling-off after 2026-08-01)"
            - "Second SELF_CERT verified; second audit case opened and left OPEN"
            - "One WBE certification parked in INFO_REQUESTED"
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Risk Co", tax_id: "T-900", kind: "DIVERSE", contact_email: "r@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "SELF_CERT", certifying_body: "SELF", certificate_number: "SC-1", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert1: $.data.id }
            - call: "POST /api/v1/certifications/${cert1}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert1}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/audit-cases"
              payload: { supplier_id: "${sup_id}", certification_id: "${cert1}", reason: "RANDOM_SAMPLE" }
              as: Auditor
              as_user_id: auditor-9
              captures: { case1: $.data.id }
            - call: "POST /api/v1/audit-cases/${case1}/record-outcome"
              payload: { outcome: "FAILED" }
              as: Auditor
              as_user_id: auditor-9
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: DiversityAdmin
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "SELF_CERT", certifying_body: "SELF", certificate_number: "SC-2", valid_from: "2026-11-01", valid_to: "2027-10-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert2: $.data.id }
            - call: "POST /api/v1/certifications/${cert2}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert2}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/audit-cases"
              payload: { supplier_id: "${sup_id}", certification_id: "${cert2}", reason: "DATA_QUALITY_FLAG" }
              as: Auditor
              as_user_id: auditor-9
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "WBE", certifying_body: "WBENC", certificate_number: "W-1", valid_from: "2026-11-01", valid_to: "2027-10-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert3: $.data.id }
            - call: "POST /api/v1/certifications/${cert3}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert3}/request-info"
              payload: { note: "notarized letter required" }
              as: DiversityAnalyst
              as_user_id: analyst-1
          trigger:
            - call: "GET /api/v1/suppliers/${sup_id}"
              payload: {}
              as: DiversityAdmin
              captures: { risk_std: $.data.risk_score_standard, risk_cons: $.data.risk_score_conservative }
          assert:
            - "risk_score_standard == 40 (1 FAILED audit x 40; no EXPIRED-unrenewed certs)"
            - "risk_score_conservative == 60 (40 + 15 for the OPEN audit + 5 for the INFO_REQUESTED certification)"
            - "The two variants differ by exactly 20 points over identical underlying data"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tier2_per_line_rounding_then_sum
        grounds:
          - calculations.tier2_spend_aggregation
          - entities.Tier2Report.fields.total_diverse_tier2_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: pinned order is per-line round_half_up to cents FIRST,
          then sum -> 33330 + 33330 + 33340 = 100000. The unpinned alternative (sum the exact
          products, then round) yields 100001 — a one-cent divergence the test must catch.
        test_recipe:
          setup:
            - "BU AERO; prime supplier; three diverse suppliers (no certifications needed at DRAFT — eligibility is checked at approve)"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Prime Build Inc", tax_id: "T-P1", kind: "PRIME", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { prime_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "D1", tax_id: "T-D1", kind: "DIVERSE", contact_email: "d1@x.com" }
              as: DiversityAnalyst
              captures: { s1: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "D2", tax_id: "T-D2", kind: "DIVERSE", contact_email: "d2@x.com" }
              as: DiversityAnalyst
              captures: { s2: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "D3", tax_id: "T-D3", kind: "DIVERSE", contact_email: "d3@x.com" }
              as: DiversityAnalyst
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${bu_id}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${s1}", gross_subcontract_cents: 100001, diverse_share_pct: 33.33 }
                  - { diverse_supplier_id: "${s2}", gross_subcontract_cents: 100001, diverse_share_pct: 33.33 }
                  - { diverse_supplier_id: "${s3}", gross_subcontract_cents: 100001, diverse_share_pct: 33.34 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { t2_sub: $.data.total_subcontracted_cents, t2_div: $.data.total_diverse_tier2_cents }
          assert:
            - "total_subcontracted_cents == 300003"
            - "Per-line allocated cents are 33330, 33330, 33340 (round_half_up of 33330.3333 / 33330.3333 / 33340.3334)"
            - "total_diverse_tier2_cents == 100000 (per-line round first, then sum); the sum-then-round order would give 100001"

      - name: scorecard_attainment_include_tier2_branching
        grounds:
          - calculations.scorecard_attainment_rating
          - entities.ProgramGoal.fields.include_tier2
          - entities.ProgramGoal.fields.goal_type
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: identical spend and identical
          APPROVED tier-2 report, but goal_type=ABSOLUTE_AMOUNT with include_tier2=true yields
          attainment 120.00 (EXCEEDS) while include_tier2=false yields 80.00 (NEAR) — the
          conditional tier-2 branch flips the rating band; a different mode than per-line
          rounding order.
        test_recipe:
          setup:
            - "Two BUs (AERO-A lead lead-a, AERO-B lead lead-b) with identical data"
            - "Each BU: PUBLISHED ABSOLUTE_AMOUNT goal of 250000 cents for FY2026 (A includes tier-2, B excludes it)"
            - "Shared diverse supplier with VERIFIED MBE cert 2026-01-01..2026-12-31; shared prime"
            - "Each BU: 200000 direct diverse spend (txn/pay 2026-02-10, Q1) and one APPROVED tier-2 report of 100000 diverse cents for 2026-Q1"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aero A", code: "AERO-A", lead_user_id: "lead-a" }
              as: DiversityAdmin
              captures: { buA: $.data.id, buA_v: $.data.version }
            - call: "POST /api/v1/business-units"
              payload: { name: "Aero B", code: "AERO-B", lead_user_id: "lead-b" }
              as: DiversityAdmin
              captures: { buB: $.data.id, buB_v: $.data.version }
            - call: "POST /api/v1/business-units/${buA}/goals"
              payload: { fiscal_year: 2026, cert_category: "ALL", goal_type: "ABSOLUTE_AMOUNT", target_value: 250000, include_tier2: true, expected_business_unit_version: "${buA_v}" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { goalA: $.data.id }
            - call: "POST /api/v1/goals/${goalA}/publish"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-2
            - call: "POST /api/v1/business-units/${buB}/goals"
              payload: { fiscal_year: 2026, cert_category: "ALL", goal_type: "ABSOLUTE_AMOUNT", target_value: 250000, include_tier2: false, expected_business_unit_version: "${buB_v}" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { goalB: $.data.id }
            - call: "POST /api/v1/goals/${goalB}/publish"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-2
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Diverse Parts Co", tax_id: "T-100", kind: "DIVERSE", contact_email: "d@x.com" }
              as: DiversityAnalyst
              captures: { sD: $.data.id }
            - call: "POST /api/v1/suppliers/${sD}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "C-100", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { certD: $.data.id }
            - call: "POST /api/v1/certifications/${certD}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${certD}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Prime Build Inc", tax_id: "T-200", kind: "PRIME", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { prime_id: $.data.id }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sD}", business_unit_id: "${buA}", amount_cents: 200000, transaction_date: "2026-02-10", payment_date: "2026-02-10" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sD}", business_unit_id: "${buB}", amount_cents: 200000, transaction_date: "2026-02-10", payment_date: "2026-02-10" }
              as: DiversityAnalyst
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${buA}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 100000, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { repA: $.data.id }
            - call: "POST /api/v1/tier-2-reports/${repA}/submit"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
            - call: "POST /api/v1/tier-2-reports/${repA}/approve"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${buB}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 100000, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { repB: $.data.id }
            - call: "POST /api/v1/tier-2-reports/${repB}/submit"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
            - call: "POST /api/v1/tier-2-reports/${repB}/approve"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
          trigger:
            - call: "POST /api/v1/business-units/${buA}/scorecards"
              payload: { reporting_period: "2026-Q1", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { scA_t2: $.data.tier2_diverse_spend_cents, scA_att: $.data.attainment_pct, scA_rating: $.data.rating }
            - call: "POST /api/v1/business-units/${buB}/scorecards"
              payload: { reporting_period: "2026-Q1", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { scB_t2: $.data.tier2_diverse_spend_cents, scB_att: $.data.attainment_pct, scB_rating: $.data.rating }
          assert:
            - "BU-A scorecard tier2_diverse_spend_cents == 100000"
            - "BU-A attainment_pct == 120.00 and rating == EXCEEDS (effective diverse 200000 + 100000 = 300000 vs target 250000)"
            - "BU-B scorecard tier2_diverse_spend_cents == 100000 (rolled up regardless of goal flag)"
            - "BU-B attainment_pct == 80.00 and rating == NEAR (effective diverse 200000 vs target 250000)"
            - "Only the include_tier2 branch differs between the two scorecards"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: certification_info_request_resubmission_cycle
        grounds:
          - state_machines.Certification.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Certification.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Certification.INFO_REQUESTED_to_SUBMITTED
          - state_machines.Certification.UNDER_REVIEW_to_VERIFIED
        distinguishing_aspect: |
          Certification follows the cycle SUBMITTED -> UNDER_REVIEW -> INFO_REQUESTED ->
          SUBMITTED -> UNDER_REVIEW -> VERIFIED; the resubmission replaces certificate_number
          and re-anchors submitted_by_user_id to the resubmitter (SoD target moves).
        test_recipe:
          setup:
            - "Supplier registered; certification submitted by analyst-1 with an illegible certificate number"
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Cycle Co", tax_id: "T-C1", kind: "DIVERSE", contact_email: "c@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "WBE", certifying_body: "WBENC", certificate_number: "C-100", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { st1: $.data.status }
            - call: "POST /api/v1/certifications/${cert_id}/request-info"
              payload: { note: "certificate number illegible" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { st2: $.data.status }
            - call: "POST /api/v1/certifications/${cert_id}/resubmit"
              payload: { certificate_number: "C-100-R", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-2
              captures: { st3: $.data.status, subby: $.data.submitted_by_user_id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
          trigger:
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { st4: $.data.status, certno: $.data.certificate_number }
            - call: "GET /api/v1/suppliers/${sup_id}"
              payload: {}
              as: DiversityAdmin
              captures: { sup_status: $.data.status }
          assert:
            - "st1 == UNDER_REVIEW, st2 == INFO_REQUESTED, st3 == SUBMITTED (cycle completed)"
            - "subby == 'analyst-2' (resubmission re-anchors submitted_by_user_id)"
            - "Final verify succeeds because admin-1 != analyst-2 (SoD evaluated against the resubmitter)"
            - "st4 == VERIFIED and certno == 'C-100-R'"
            - "Supplier transitioned REGISTERED -> ACTIVE on first verification"

      - name: tier2_report_return_correction_cycle
        grounds:
          - state_machines.Tier2Report.DRAFT_to_SUBMITTED
          - state_machines.Tier2Report.SUBMITTED_to_RETURNED
          - state_machines.Tier2Report.RETURNED_to_SUBMITTED
          - state_machines.Tier2Report.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Tier2Report follows DRAFT -> SUBMITTED -> RETURNED -> (PUT corrected lines) ->
          SUBMITTED -> APPROVED; the PUT on RETURNED replaces (not appends) lines so the
          approved totals reflect only the corrected submission.
        test_recipe:
          setup:
            - "BU; prime supplier; diverse supplier with VERIFIED WBE cert covering 2026-06-30 (Q2 period end)"
            - "DRAFT report with one line: gross 50000, share 80.00 (allocated 40000)"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Prime Build Inc", tax_id: "T-P9", kind: "PRIME", contact_email: "p@x.com" }
