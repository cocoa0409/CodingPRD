- section: rbac
  instances:
  - name: request_missing_auth_headers_returns_unauthenticated
    claim_type: role_denied
    grounds:
    - errors[ERR_UNAUTHENTICATED]
    - validations[priority=10]
    distinguishing_aspect: |
      Priority 10 runs before everything else: a POST /swiss-shop/parts sent with the X-User-Role and X-User-ID headers removed returns 401 ERR_UNAUTHENTICATED, not the 403 that a wrong role would produce and not a 400 for the body.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; empty database.
      - The trigger request is dispatched with no X-User-Role and no X-User-ID header, and with an empty body.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
