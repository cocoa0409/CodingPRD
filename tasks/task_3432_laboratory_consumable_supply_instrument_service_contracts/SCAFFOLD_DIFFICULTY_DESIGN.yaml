  - rule_id: cross_entity_state_dependency
    instances:
      - name: install_requires_account_active
        grounds:
          - state_machines.Instrument.ORDERED_to_INSTALLED
          - entities.Account.fields.status
        distinguishing_aspect: |
          Instrument x Account pair: the ORDERED -> INSTALLED transition is gated on the OWNING
          ACCOUNT's status; a SUSPENDED account blocks install with ERR_ACCOUNT_NOT_ACTIVE even
          though the territory has an INSTALL-skilled engineer.
        test_recipe:
          setup:
            - "SUSPENDED account with an ORDERED instrument; an ACTIVE INSTALL-skilled engineer exists in the account territory."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Gate Lab", segment: "INDUSTRIAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Igor Install", territory_code: "CA-NORTH", skills: ["INSTALL"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "GTE-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "PATCH /lab/accounts/${a_id}"
              payload: { status: "SUSPENDED" }
              as: AccountManager
          trigger:
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "install fails with error_id == ERR_ACCOUNT_NOT_ACTIVE"
            - "Instrument.${i_id}.placement_status remains ORDERED (no partial transition)"

      - name: loaner_requires_contract_active_and_tier
        grounds:
          - state_machines.LoanerUnit.AVAILABLE_to_RESERVED
          - entities.ServiceContract.fields.loaner_eligible
          - errors[ERR_LOANER_NOT_ELIGIBLE]
        distinguishing_aspect: |
          ServiceRequest x ServiceContract pair (different pair than Instrument x Account):
          loaner reservation on a HIGH BREAK_FIX request is rejected with
          ERR_LOANER_NOT_ELIGIBLE both when the instrument's contract tier is SILVER
          (loaner_eligible false) and when no live contract exists at all.
        test_recipe:
          setup:
            - "Installed instrument under a SILVER contract; a HIGH-severity BREAK_FIX request; an AVAILABLE loaner unit of the same model (pool non-empty so only the eligibility gate can fail). The contract is then cancelled and a second identical request is tried."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Loaner Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Fixer", territory_code: "CA-NORTH", skills: ["INSTALL", "BREAK_FIX"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "LNR-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-contracts"
              payload: { instrument_id: "${i_id}", tier: "SILVER", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /lab/loaner-units"
              payload: { model: "SEQ-5000", serial_number: "LN-1" }
              as: ServiceDispatcher
              captures: { u1: $.data.id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "HIGH" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sr1: $.data.id }
          trigger:
            - call: "POST /lab/service-requests/${sr1}/loaner"
              payload: {}
              as: ServiceDispatcher
              captures: { err1: $.data.error_id }
            - call: "POST /lab/service-contracts/${c_id}/cancel"
              payload: {}
              as: AccountManager
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "HIGH" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sr2: $.data.id }
            - call: "POST /lab/service-requests/${sr2}/loaner"
              payload: {}
              as: ServiceDispatcher
              captures: { err2: $.data.error_id }
            - call: "GET /lab/loaner-units?status=AVAILABLE"
              as: ServiceDispatcher
              captures: { u_status: "$.data[0].status" }
          assert:
            - "first reserve fails with error_id == ERR_LOANER_NOT_ELIGIBLE (SILVER tier, loaner_eligible == false)"
            - "second reserve fails with error_id == ERR_LOANER_NOT_ELIGIBLE (contract CANCELLED, none live)"
            - "LoanerUnit.${u1} remains AVAILABLE (no reservation leaked by either rejection)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_windows_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
          - entities.EnterpriseAgreement.fields.end_date
        distinguishing_aspect: |
          Resource: an account's agreement timeline; semantics: half-open intervals
          [start_date, end_date) — a successor starting exactly at the previous end_date is
          legal adjacency, while starting one day earlier overlaps and is rejected.
        test_recipe:
          setup:
            - "Account holding agreement A covering [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Window Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z", committed_annual_spend_cents: 50000 }
              as: AccountManager
              captures: { ea_a: $.data.id }
          trigger:
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a_id}", start_date: "2026-12-31T00:00:00Z", end_date: "2028-01-01T00:00:00Z", committed_annual_spend_cents: 50000 }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a_id}", start_date: "2027-01-01T00:00:00Z", end_date: "2028-01-01T00:00:00Z", committed_annual_spend_cents: 50000 }
              as: AccountManager
              captures: { ea_c: $.data.id, ea_c_status: $.data.status }
          assert:
            - "window starting 2026-12-31T00:00:00Z is rejected with error_id == ERR_AGREEMENT_WINDOW_OVERLAP (intersects [2026-01-01, 2027-01-01))"
            - "window starting exactly 2027-01-01T00:00:00Z succeeds with 201 (half-open adjacency is not an overlap); new agreement status == ACTIVE"

      - name: pm_min_gap_thirty_days
        grounds:
          - validations[priority=7]
          - errors[ERR_PM_GAP_VIOLATION]
          - entities.ServiceRequest.fields.scheduled_for
        distinguishing_aspect: |
          Resource: an instrument's PM calendar; semantics: minimum-gap (different from the
          half-open adjacency rule — 30 full days must separate two OPEN/DISPATCHED PM visits):
          19 days apart is rejected, exactly 30 days apart is allowed.
        test_recipe:
          setup:
            - "Installed instrument with a GOLD contract and one OPEN PM request scheduled 2026-10-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Gap Lab", segment: "CLINICAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Pam PM", territory_code: "CA-NORTH", skills: ["INSTALL", "PM"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "GAP-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-contracts"
              payload: { instrument_id: "${i_id}", tier: "GOLD", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "PREVENTIVE_MAINTENANCE", severity: "LOW", scheduled_for: "2026-10-01T09:00:00Z" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { pm1: $.data.id }
          trigger:
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "PREVENTIVE_MAINTENANCE", severity: "LOW", scheduled_for: "2026-10-20T09:00:00Z" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "PREVENTIVE_MAINTENANCE", severity: "LOW", scheduled_for: "2026-10-31T09:00:00Z" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { pm2: $.data.id, pm2_status: $.data.status }
          assert:
            - "PM at +19 days (2026-10-20T09:00:00Z) fails with error_id == ERR_PM_GAP_VIOLATION"
            - "PM at exactly +30 days (2026-10-31T09:00:00Z) succeeds with 201 and status == OPEN (gap comparison is >= 30 days)"

  - rule_id: compensating_invariant
    instances:
      - name: stock_allocate_cancel_conserves_available
        grounds:
          - state_machines.Order.DRAFT_to_ALLOCATED
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - entities.CatalogItem.fields.available_stock
        distinguishing_aspect: |
          Conserved quantity: physical stock units. The allocate-then-cancel pair restores
          available_stock exactly: 100 -> 70 (reserve 30) -> 100 (release 30), with
          stock_on_hand untouched at 100 and reserved_quantity returning to 0.
        test_recipe:
          setup:
            - "ACTIVE account; catalog item STOCK-X with stock_on_hand 100; one order of quantity 30."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Stock Lab", segment: "INDUSTRIAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "STOCK-X", name: "Stock X", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 500, stock_on_hand: 100 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "STOCK-X", quantity: 30 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
            - call: "POST /lab/orders/${o_id}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { st1: $.data.status }
            - call: "GET /lab/catalog-items?sku=STOCK-X"
              as: SupplyOps
              captures: { r_mid: "$.data[0].reserved_quantity", a_mid: "$.data[0].available_stock", h_mid: "$.data[0].stock_on_hand" }
          trigger:
            - call: "POST /lab/orders/${o_id}/cancel"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { st2: $.data.status }
            - call: "GET /lab/catalog-items?sku=STOCK-X"
              as: SupplyOps
              captures: { r_end: "$.data[0].reserved_quantity", a_end: "$.data[0].available_stock", h_end: "$.data[0].stock_on_hand" }
          assert:
            - "after submit: status ALLOCATED, reserved_quantity == 30, available_stock == 70, stock_on_hand == 100"
            - "after cancel: status CANCELLED, reserved_quantity == 0, available_stock == 100, stock_on_hand == 100"
            - "invariant available_stock == stock_on_hand - reserved_quantity holds at every probe and the pair leaves zero drift"

      - name: billing_split_conserves_total_cost
        grounds:
          - calculations.service_billing_split
          - entities.ServiceRequest.fields.billable_cents
          - entities.ServiceRequest.fields.covered_cents
        distinguishing_aspect: |
          Conserved quantity: money — a different conserved type than physical stock. Under a
          GOLD contract (parts 90%), resolving with 2 labor hours and 100000 parts splits
          137000 into billable 10000 + covered 127000; billable + covered == labor + parts
          exactly, with no drift from the partition.
        test_recipe:
          setup:
            - "Installed instrument under a GOLD contract; a MEDIUM-severity BREAK_FIX request dispatched to the territory engineer; resolve at the same logical instant as open (no SLA breach)."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Billing Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Fixer", territory_code: "CA-NORTH", skills: ["INSTALL", "BREAK_FIX"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "BIL-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-contracts"
              payload: { instrument_id: "${i_id}", tier: "GOLD", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "MEDIUM" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sr: $.data.id }
            - call: "POST /lab/service-requests/${sr}/dispatch"
              payload: {}
              as: ServiceDispatcher
          trigger:
            - call: "POST /lab/service-requests/${sr}/resolve"
              payload: { hours_on_site: 2, parts_cost_cents: 100000 }
              as: ServiceDispatcher
              captures: { bill: $.data.billable_cents, cov: $.data.covered_cents, memo: $.data.credit_memo_cents, breach: $.data.sla_breached }
          assert:
            - "billable_cents == 10000 (parts 100000 x (1 - 0.90))"
            - "covered_cents == 127000 (labor 2 x 18500 = 37000 fully covered + parts covered 90000)"
            - "billable_cents + covered_cents == 137000 == labor_cents + parts_cost_cents (partition conserves total cost)"
            - "sla_breached == false and credit_memo_cents == 0 (resolved at open instant, well inside GOLD 24h)"
