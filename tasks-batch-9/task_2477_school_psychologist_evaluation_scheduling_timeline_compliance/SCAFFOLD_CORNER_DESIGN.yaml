      - name: protocol_order_small_order_constants_applied
        claim_type: constants_applied
        grounds:
          - calculations.protocol_order_total_cost
          - calculations.protocol_order_total_cost.constants
        distinguishing_aspect: "A 10-booklet order isolates the two constants that only apply below the first tier — DISTRICT_CONTRACT_DISCOUNT_PCT 0.07 and SMALL_ORDER_HANDLING_FEE_CENTS 1250 — with no tier discount and no rush surcharge in play."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one AssessmentInstrument with protocol_unit_cost_cents 1799."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "BASC-3", instrument_code: "BASC3", protocol_stock_count: 0, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1799, license_seat_total: 1, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
