            - "${det2_state_after} == \"PROVISIONAL\" and ${det2_v_after} == 1 — the refused filing left the OCC parent untouched, so a later in-window retry could still use expected_determination_version 1"

      - name: english_learner_gate_refuses_the_winner_instead_of_re_ranking
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_EL_PATHWAY_VIOLATION]", calculations.placement_rule_selection]
        distinguishing_aspect: |
          The EL gate runs AFTER the ranking and never re-ranks: adding an
          EL-appropriate rule at a lower level_rank does NOT rescue the request,
          because the higher non-EL rule still wins the sort and is then refused. Only
          removing the non-EL rule from the candidate set produces a placement. The
          gate is also scoped by subject: the same EL_ACTIVE student places in MATH
          through a rule with required_el_status null.
