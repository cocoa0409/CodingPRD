      - name: charges_are_read_only_computed_projections
        claim_type: computed_read
        grounds:
          - endpoints.GET_/demurrage/charges
          - endpoints.GET_/demurrage/charges/{id}
        distinguishing_aspect: |
          DemurrageCharge has no create, no update and no action endpoint at
          all: every field is written by a cascade from the cycle. The read side
          must still expose the money and day fields, and the status filter must
          discriminate the same row before and after release.
        test_recipe:
          setup:
            - "Cycle A constructively placed, notified, actually placed and then released 2026-08-10T16:00:00Z"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9P5-CUST", name: "Projection Prehnite", serving_station_code: "STN94", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9P5-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
