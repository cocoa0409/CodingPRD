- section: cross_cutting_complexity_layers
  instances:
  - name: campaign_participate_with_stale_agency_version_returns_stale_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[campaign-allowance-stale-pool]
    - errors[ERR_STALE_VERSION]
    - validations[priority=8]
    distinguishing_aspect: A participation carrying expected_agency_version one behind the current agency version is rejected with 412 ERR_STALE_VERSION before any allowance math.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with a PLANNED campaign and 80,000.00 of pool."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-123
          name: CA-123
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal OCC
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P17
          product_line: AUTO
          annual_premium_cents: 2000000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p: $.data.id
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns
        payload:
          campaign_type: BRAND
          marketing_allowance_cents: 10000
          expected_leads: 10
          start_date: "2026-09-02T00:00:00Z"
          end_date: "2026-09-28T00:00:00Z"
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          c: $.data.id
      trigger:
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns/${c}/participate
        payload:
          expected_agency_version: ${cali_v0}
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          e: $.data.error_id
      assert:
      - the response status is 412 and error_id == ERR_STALE_VERSION
      - MarketingCampaign.${c}.status remains PLANNED and no allowance is debited
  - name: policy_cancel_reconciles_agency_exposure
    claim_type: derived_field_reconciliation
    grounds:
    - calculations.recompute_agency
    - state_machines.Policy.OPEN_to_CANCELLED
    - entities.Agency.fields.exposure_inforce_cents
    distinguishing_aspect: Cancelling an open policy immediately reconciles Agency.exposure_inforce_cents and book_open_count down by the cancelled premium.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with a 500,000-cent OPEN policy."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-124
          name: CA-124
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Recon
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P18
          product_line: AUTO
          annual_premium_cents: 500000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p: $.data.id
      trigger:
      - call: GET /agency-network/agencies/${cali_id}
        payload: {}
        as: AppointingExecutive
        captures:
          before: $.data.exposure_inforce_cents
      - call: POST /agency-network/policies/${p}/cancel
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${cali_id}
      - call: GET /agency-network/agencies/${cali_id}
        payload: {}
        as: AppointingExecutive
        captures:
          after: $.data.exposure_inforce_cents
          cnt: $.data.book_open_count
      assert:
      - before cancel exposure_inforce_cents == 500000.00
      - after cancel exposure_inforce_cents == 0.00 and book_open_count == 0 (reconciled in the same request)
  - name: claim_deny_restores_zero_paid_and_recomputes_loss_ratio
    claim_type: cascading_side_effects
    grounds:
    - state_machines.Claim.OPEN_to_DENIED
    - calculations.loss_ratio
    - calculations.agency_paid_claims_cents
    distinguishing_aspect: Denying an open claim sets policy_paid_cents to 0.00 and re-runs the depth-3 cascade so loss_ratio returns to its baseline.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with one settled 30,000-cent claim and one open 20,000-cent claim."
