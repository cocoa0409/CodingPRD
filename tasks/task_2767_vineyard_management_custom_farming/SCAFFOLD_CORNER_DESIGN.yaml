        distinguishing_aspect: "A freshly created CustomFarmingContract is DRAFT with enrolled_block_count 0, total_contracted_acres 0.0, accrued_quality_incentive 0.0, projected_total_billable 0.0, settled_period_count 0, last_settlement_total null and version 1."
