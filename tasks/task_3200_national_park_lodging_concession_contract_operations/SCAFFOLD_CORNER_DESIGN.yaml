              payload: {}
              as: AgencyRateAnalyst
            - &cy_rej2
              call: "POST /contracts/${c_id}/rate-filings/${f2}/reject"
              payload: { reason: "still over cap (26300 > 26250)" }
              as: AgencyRateAnalyst
          trigger:
            - call: "POST /contracts/${c_id}/rate-filings"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", submitted_rates: [{ occupancy_band: "SOLO", nightly_rate_cents: 19000 }, { occupancy_band: "DOUBLE", nightly_rate_cents: 23000 }, { occupancy_band: "FAMILY", nightly_rate_cents: 26250 }], reference_study_id: "${st1}", expected_contract_version: "${c_v2}", revision_of_id: "${f2}" }
              as: ConcessionerRateManager
              captures: { f3: $.data.id, f3_status: $.data.status }
          assert:
            - "f3_status == SUBMITTED — the third cycle iteration is admitted"
            - "RateFiling.${f3}.revision_of_id == ${f2}"
            - "RateFiling.${f_id}.status == REJECTED and RateFiling.${f2}.status == REJECTED (rejections are preserved, not erased)"

