      - name: serial_unit_for_a_non_serialized_product_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "serialization_enabled false blocks unit registration with ERR_PRODUCT_NOT_SERIALIZED, so the serial-tracing chain cannot be started for products the brand does not serialize."
