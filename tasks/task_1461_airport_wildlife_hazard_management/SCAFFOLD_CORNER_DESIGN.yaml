        claim_type: violation_to_error
        grounds:
          - "roles[ATCController]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "ATCController cannot call POST /wildlife/strike-reports."
        test_recipe:
          setup:
            - "Airport A; ATCController C1"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KQQQ", name: "Quebec Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/atc-controllers"
              payload: { full_name: "C One", facility_id: "TWR-QQQ", airport_id: "${ap_id}" }
              as: AirportAdmin
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${c1_id}", strike_at: "2026-07-15T10:00:00Z", runway_designator: "09L", aircraft_registration: "N-Q1", species_id: "00000000-0000-0000-0000-000000000000", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: ATCController
              as_user_id: "${c1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: regulator_cross_agency_revocation_denied
        claim_type: violation_to_error
        grounds:
          - "roles[RegulatorAgent]"
          - state_machines.TakePermit.ACTIVE_to_REVOKED
          - "errors[ERR_CROSS_FACILITY_FORBIDDEN]"
        distinguishing_aspect: "Regulator from different agency cannot revoke another agency's permit."
        test_recipe:
          setup:
            - "Airport A; RegulatorAgent R1 (USFWS) and R2 (STATE_DNR)"
            - "Species S1 LOW"
            - "TakePermit P issued by R1, ACTIVE"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KRRR", name: "Romeo Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/species"
              payload: { common_name: "House Sparrow", scientific_name: "Passer domesticus", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 30, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp_id: "$.data.id" }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R One", agency: "USFWS", badge_number: "USFWS-9701" }
              as: AirportAdmin
              captures: { r1_id: "$.data.id" }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R Two", agency: "STATE_DNR", badge_number: "DNR-9702" }
              as: AirportAdmin
              captures: { r2_id: "$.data.id" }
            - call: "POST /wildlife/take-permits"
              payload: { airport_id: "${ap_id}", species_id: "${sp_id}", issued_by_regulator_id: "${r1_id}", permit_number: "MB0006-00", authorized_take_total: 10, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: RegulatorAgent
              as_user_id: "${r1_id}"
              captures: { tp_id: "$.data.id" }
            - call: "GET /wildlife/take-permits/${tp_id}"
              as: RegulatorAgent
              as_user_id: "${r1_id}"
          trigger:
            - call: "POST /wildlife/take-permits/${tp_id}/revoke"
              payload: {}
              as: RegulatorAgent
              as_user_id: "${r2_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "error_id == ERR_CROSS_FACILITY_FORBIDDEN (agency mismatch)"

  # =====================================================================
  # Section: cross_cutting_complexity_layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: advisory_activate_stale_airport_occ_conflict
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[advisory-activate-stale-airport]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC stale-version rejection on advisory activation: client reads Airport.version, another writer activates a competing advisory (bumping version), then the first client's activate fails with 412."
        test_recipe:
          setup:
            - "Airport A; senior biologist B1"
            - "Advisory OA1 in DRAFT (no supersedes)"
            - "Advisory OA2 in DRAFT (no supersedes)"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KSSS", name: "Sierra Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-S01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /wildlife/operational-advisories"
              payload: { airport_id: "${ap_id}", issued_by_biologist_id: "${b1_id}", issued_at: "2026-07-15T10:00:00Z", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", hazard_level: "ELEVATED", reason_code: "STRIKE_SPIKE" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { oa1_id: "$.data.id" }
            - call: "POST /wildlife/operational-advisories"
              payload: { airport_id: "${ap_id}", issued_by_biologist_id: "${b1_id}", issued_at: "2026-07-15T11:00:00Z", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", hazard_level: "HIGH", reason_code: "MIGRATION" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { oa2_id: "$.data.id" }
            # Read airport version
            - call: "GET /wildlife/airports/${ap_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ap_v: "$.data.version" }
            # First activation succeeds (bumps airport version)
            - call: "POST /wildlife/operational-advisories/${oa1_id}/activate"
              payload: { expected_airport_version: "${ap_v}" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            # Second activation with stale version fails
            - call: "POST /wildlife/operational-advisories/${oa2_id}/activate"
              payload: { expected_airport_version: "${ap_v}" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_VERSION"
            - "OA1 is ACTIVE; OA2 remains DRAFT"

      - name: plan_publish_stale_airport_occ_conflict
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-publish-stale-airport]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC stale-version rejection on plan publish: client reads Airport.version, another writer publishes a competing plan (bumping version), then the first client's publish fails with 412."
        test_recipe:
          setup:
            - "Airport A; senior biologist B1; RegulatorAgent R"
            - "AnnualPlan AP1 APPROVED for A+2027"
            - "AnnualPlan AP2 APPROVED for A+2028"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KTTT", name: "Tango Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-T01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R One", agency: "USFWS", badge_number: "USFWS-9801" }
              as: AirportAdmin
              captures: { r_id: "$.data.id" }
            - call: "POST /wildlife/annual-plans"
              payload: { airport_id: "${ap_id}", plan_year: 2027, version_note: "v2027" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { plan1_id: "$.data.id" }
            - call: "POST /wildlife/annual-plans/${plan1_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/annual-plans/${plan1_id}/approve"
              payload: {}
              as: RegulatorAgent
              as_user_id: "${r_id}"
            - call: "POST /wildlife/annual-plans"
              payload: { airport_id: "${ap_id}", plan_year: 2028, version_note: "v2028" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { plan2_id: "$.data.id" }
            - call: "POST /wildlife/annual-plans/${plan2_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/annual-plans/${plan2_id}/approve"
              payload: {}
              as: RegulatorAgent
              as_user_id: "${r_id}"
            # Read airport version
            - call: "GET /wildlife/airports/${ap_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ap_v: "$.data.version" }
            # First publish succeeds (bumps airport version)
            - call: "POST /wildlife/annual-plans/${plan1_id}/publish"
              payload: { expected_airport_version: "${ap_v}" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /wildlife/annual-plans/${plan2_id}/publish"
              payload: { expected_airport_version: "${ap_v}" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_VERSION"
            - "AP1 is PUBLISHED; AP2 remains APPROVED"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_strike_confirm
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After confirm, GET airport returns updated strikes_trailing_12m and current_hazard_level in the same request cycle."
        test_recipe:
          setup:
            - "Airport A; senior B1; non-senior B2; Species S1 MEDIUM"
            - "One strike SR in UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KUUU", name: "Uniform Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/species"
              payload: { common_name: "Ring-billed Gull", scientific_name: "Larus delawarensis", guild: "GULL", risk_tier: "MEDIUM", body_mass_g: 550, is_protected_federally: true }
              as: AirportAdmin
              captures: { sp_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-U01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-U02", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: "$.data.id" }
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-15T10:00:00Z", runway_designator: "09L", aircraft_registration: "N-U1", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr_id: "$.data.id" }
            - call: "POST /wildlife/strike-reports/${sr_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${sr_id}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /wildlife/strike-reports/${sr_id}/confirm"
              payload: { confirmation_notes: "ok" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "GET /wildlife/airports/${ap_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { count: "$.data.strikes_trailing_12m", level: "$.data.current_hazard_level" }
          assert:
            - "strikes_trailing_12m == 1 (immediately visible)"
            - "current_hazard_level == LOW (1 < 5)"
            - "No eventual-consistency lag"
