      - name: queue_dispatch_priority_then_queued_at_tiebreak
        claim_type: selector_determinism
        grounds: [calculations.queue_dispatch_selector, "errors[ERR_QUEUE_EMPTY]"]
        distinguishing_aspect: "Selector ranking: CONTRACT beats SPOT regardless of arrival; between two CONTRACT entries the earlier queued_at wins (NOT the smaller truck_id, which is the last-resort tie-break); empty pool -> ERR_QUEUE_EMPTY."
        test_recipe:
          setup:
            - "site; entries: E1 SPOT (09:00), E2 CONTRACT TRK-9 (09:01), E3 CONTRACT TRK-2 (09:02)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: QuarryAdmin }
