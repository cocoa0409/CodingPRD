      - name: open_batch_single_occupancy
        grounds:
          - errors[ERR_DUPLICATE_OPEN_BATCH]
          - state_machines.DistributionBatch
          - validations[priority=10]
        distinguishing_aspect: |
          Resource: DistributionBatch occupancy per plan; interval semantics: OPEN-ENDED capacity-1
          occupancy — the occupying interval has no declared end timestamp; it ends only when the batch
          reaches REVIEWED (or there is none). A second batch is rejected while the first is OPEN or
