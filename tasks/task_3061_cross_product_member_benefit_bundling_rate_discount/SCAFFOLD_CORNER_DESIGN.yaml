            - call: "POST /benefits/members/${r005_id}/deposits"
              payload: { enrollment_id: "${r005_en_id}", amount_cents: 200000, posted_at: "2026-09-01T00:00:00Z", holding_id: "${r005_h_id}" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${r005_en_id}/activate"
