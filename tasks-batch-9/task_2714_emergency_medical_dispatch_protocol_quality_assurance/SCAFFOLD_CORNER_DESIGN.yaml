              payload: { call_reference: "C-0003", call_type: "CHEST_PAIN", received_at: "2026-08-07T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c3_id: $.data.id }
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-0004", call_type: "CHEST_PAIN", received_at: "2026-08-08T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c4_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "MIXED", target_sample_count: 4 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c2_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r2_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c3_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r3_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c4_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r4_id: $.data.id }
            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v}", case_entry_points_earned: 23, case_entry_points_possible: 25, key_questions_points_earned: 23, key_questions_points_possible: 25, pre_arrival_points_earned: 23, pre_arrival_points_possible: 25, final_coding_points_earned: 23, final_coding_points_possible: 25, reviewer_determinant_code: "10-C-4" }
              as: QaReviewer
              as_user_id: "rev-1"
            - call: "POST /reviews/${r1_id}/finalize"
              payload: { finalization_note: "closed" }
              as: QaSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "GET /reviews"
              payload: { sampling_period_id: "${sp_id}", status: "SELECTED", limit: 2, offset: 0 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /reviews"
              payload: { sampling_period_id: "${sp_id}", status: "SELECTED", limit: 2, offset: 2 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { page2_first_id: "$.data[0].id" }
            - call: "GET /reviews"
              payload: { sampling_period_id: "${sp_id}", status: "FINALIZED", limit: 2, offset: 0 }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "GET /reviews"
              payload: { dispatcher_id: "${d1_id}", limit: 100, offset: 0 }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "The first SELECTED page returns 200 with 2 elements, total_count 3 and has_more true"
            - "The second SELECTED page returns 1 element, total_count 3 and has_more false; ${page2_first_id} is not ${page1_first_id}"
            - "The union of the two pages is exactly {${r2_id}, ${r3_id}, ${r4_id}} with no id appearing twice, and ${r1_id} appears in neither"
            - "The FINALIZED page returns 1 element with id ${r1_id}, total_count 1 and has_more false — the filter, not the page size, sets total_count"
            - "The unfiltered dispatcher listing returns total_count 4 with has_more false, so the status filter genuinely partitioned 3 + 1"

      - name: dual_variant_composite_scoring_stub
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: accreditation_case_weighted_versus_dispatcher_equal_weight_inverts_threshold
          rationale: "Both accreditation variants over one shared population, the divergence between them and the threshold inversion they cause are exercised end-to-end by that difficulty instance; the provisional-versus-final review composite is covered by review_provisional_unweighted_versus_final_weighted_composite. A separate corner instance would only replay the same two calls."

      - name: cascading_side_effect_chain_stub
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: finalizing_one_under_triaged_review_restricts_the_dispatcher_five_links_later
          rationale: "The five-link chain from one finalize through score, posture, auto plan, hours ledger and dispatch privilege — including ordering sensitivity — is asserted link by link there, and the reverse direction is covered by voiding_a_finalized_review_reverses_every_link_of_the_finalize_cascade."

      - name: rate_threshold_trigger_boundary_stub
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: hours_owed_exactly_at_the_restriction_threshold_versus_a_quarter_hour_over
          rationale: "The cumulative hours-owed threshold is probed at exactly 6.00 and at 6.25 in that instance, which is the only boundary this layer has; the compliance-percentage boundary is separately probed by posture_boundary_at_exactly_the_target_versus_one_tenth_below."

      - name: version_pinning_on_approval_stub
        claim_type: version_pinning_on_approval
        excluded_because:
          difficulty_instance: golive_of_the_successor_version_suspends_coaching_plans_five_links_upstream
          rationale: "Pinning under version churn — an already-pinned review keeping its protocol_version_id while the successor goes live and supersedes its predecessor — is the substance of that cascade, and the freeze at selection time is asserted by the_pinned_protocol_version_is_frozen_at_selection_time in the calculations section."

  - section: consistency_model
    instances:
      - name: every_cascade_effect_is_visible_inside_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.dispatcher_compliance_rollup
        distinguishing_aspect: "The declared model is immediate, so no derived value may lag a request: the finalize response itself must already carry the computed composite, and the dispatcher, coaching-plan and period reads taken immediately afterwards must show the full cascade with no second write and no re-read delay."
        test_recipe:
          setup:
            - "One SCORED review at sheet (18/20, 26/30, 2/3, 5/7) with a MINOR_MISCODE, which finalizes to 77.1 and drives the dispatcher to PROBATION."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-0001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "TARGETED", target_sample_count: 1 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v}", case_entry_points_earned: 18, case_entry_points_possible: 20, key_questions_points_earned: 26, key_questions_points_possible: 30, pre_arrival_points_earned: 2, pre_arrival_points_possible: 3, final_coding_points_earned: 5, final_coding_points_possible: 7, reviewer_determinant_code: "10-C-2" }
              as: QaReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /reviews/${r1_id}/finalize"
              payload: { finalization_note: "cascade in one shot" }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "GET /dispatchers/${d1_id}"
              payload: {}
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "GET /coaching-plans"
              payload: { dispatcher_id: "${d1_id}", origin: "AUTO", limit: 10, offset: 0 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { plan_id: "$.data[0].id" }
            - call: "GET /audit-programs/${prog_id}/sampling-periods"
              payload: { status: "OPEN", limit: 10, offset: 0 }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "The finalize response itself already carries data.status FINALIZED, data.pre_penalty_composite_score 79.1, data.penalty_points 2.0, data.final_composite_score 77.1 and data.compliant false — nothing is deferred to a later read"
            - "The immediately following dispatcher read shows compliance_pct 77.1, compliance_posture PROBATION, remediation_hours_owed 4.00 and dispatch_privilege FULL"
            - "The coaching-plan listing already returns total_count 1 with ${plan_id} in status ASSIGNED, origin AUTO, severity STANDARD, required_hours 4.0 and focus_area PRE_ARRIVAL_INSTRUCTIONS"
            - "The period listing already shows data[0].finalized_review_count 1 in the same request cycle"
            - "No repeated read changes any of these values — a second GET /dispatchers/${d1_id} returns byte-identical data"
