scenario: |
  Disaster Shelter Opening, Volunteer Deployment & Client Casework (American Red Cross):
  shelter site agreements with facilities pre-identified and inspected for capacity,
  accessibility and functional needs support, shelter opening decisions in coordination
  with emergency management and shelter staffing from trained volunteers, volunteer
  deployment across regions with credentialing, travel arrangements and rotation lengths,
  shelter operations covering registration, dormitory management, feeding, health services
  and reunification support, immediate assistance provision to clients with eligibility
  verification and financial assistance card issuance, casework for recovery planning with
  referrals to other agencies and duplication-of-benefits avoidance, disaster relief
  operation cost tracking with donor-restricted funds, blood collection continuity during
  disasters
domain_name: disaster-shelter-operations
api_prefix: /api/v1

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: quota_allocation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, derived_field_reconciliation]
  entity_topology: flat
  state_machine_shape: posture_driven
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Two-letter regional code, unique across regions", constraints: "unique; non-empty" }
      - { name: name, type: string, source: input, description: "Human-readable region name" }
      - { name: state_codes, type: array, source: input, description: "US state codes covered by this region" }
      - { name: coordinator_user_id, type: string, source: input, description: "Opaque RegionalCoordinator identifier accountable for this region" }
      - { name: volunteer_pool_target, type: integer, source: input, description: "Target number of deployable volunteers for this region", constraints: ">= 1" }
      - { name: authorized_agency_codes, type: array, source: input, description: "Partner agency codes authorized to receive referrals for clients of this region" }
      - { name: available_volunteer_count, type: integer, source: computed, description: "Count of Volunteer rows in this region with credential_status=ACTIVE and deployment_availability=AVAILABLE" }
      - { name: deployed_volunteer_count, type: integer, source: computed, description: "Count of Volunteer rows in this region with deployment_availability=DEPLOYED" }
      - { name: blood_continuity_index, type: number, source: computed, description: "= round_half_up(usable_units_in_window / target_units_in_window, 4) per blood_continuity_index calculation" }
      - { name: blood_continuity_status, type: enum, source: computed, description: "NORMAL | STRAINED | CRITICAL — derived from blood_continuity_index", constraints: "enum: NORMAL | STRAINED | CRITICAL" }

  - name: DisasterReliefOperation
    parent: null
    common_fields: true
    fields:
      - { name: incident_code, type: string, source: input, description: "Incident identifier issued by emergency management", constraints: "unique; non-empty" }
      - { name: incident_type, type: enum, source: input, description: "HURRICANE | WILDFIRE | FLOOD | EARTHQUAKE | TORNADO", constraints: "enum: HURRICANE | WILDFIRE | FLOOD | EARTHQUAKE | TORNADO" }
      - { name: declared_at, type: datetime, source: input, description: "ISO 8601 UTC instant the operation was declared" }
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region in which the operation is declared" }
      - { name: phase, type: enum, source: computed, description: "MOBILIZATION | ACTIVE | DEMOBILIZATION | CLOSED", constraints: "enum: MOBILIZATION | ACTIVE | DEMOBILIZATION | CLOSED" }
      - { name: open_shelter_count, type: integer, source: computed, description: "Count of ShelterOperation rows under this operation with posture IN {OPEN, RESTRICTED}" }
      - { name: restricted_fund_balance_cents, type: integer, source: computed, description: "Sum of FundPool.remaining_cents over pools with restriction_type != UNRESTRICTED that are linked to this operation through CostLedgerEntry" }

  - name: ShelterSite
    parent: null
    common_fields: true
    fields:
      - { name: facility_name, type: string, source: input, description: "Pre-identified facility name" }
      - { name: address_line, type: string, source: input, description: "Street address of the facility" }
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region that holds the site agreement" }
      - { name: capacity_beds, type: integer, source: input, description: "Contracted bed capacity of the facility", constraints: ">= 1" }
      - { name: accessibility_rating, type: enum, source: input, description: "FULL | PARTIAL | NONE — ADA accessibility of the facility", constraints: "enum: FULL | PARTIAL | NONE" }
      - { name: functional_needs_support, type: boolean, source: input, description: "Whether the facility can support clients with access and functional needs" }
      - { name: generator_onsite, type: boolean, source: input, description: "Whether the facility has a permanent backup generator" }
      - { name: agreement_expires_at, type: datetime, source: input, description: "Expiry instant of the facility shelter agreement" }
      - { name: agreement_status, type: enum, source: computed, description: "PENDING_INSPECTION | APPROVED | SUSPENDED | EXPIRED", constraints: "enum: PENDING_INSPECTION | APPROVED | SUSPENDED | EXPIRED" }
      - { name: capacity_verified_beds, type: integer, source: computed, description: "Bed count confirmed by the most recent inspection (0 before first inspection)" }
      - { name: accessibility_verified, type: boolean, source: computed, description: "Accessibility confirmation from the most recent inspection" }
      - { name: functional_needs_verified, type: boolean, source: computed, description: "Functional-needs confirmation from the most recent inspection" }
      - { name: last_inspection_at, type: datetime, source: computed, description: "Timestamp of the most recent inspection" }
      - { name: inspection_result, type: enum, source: computed, description: "PASS | CONDITIONAL_PASS | FAIL — result of the most recent inspection", constraints: "enum: PASS | CONDITIONAL_PASS | FAIL" }

  - name: ShelterOperation
    parent: null
    common_fields: true
    fields:
      - { name: shelter_site_id, type: string, source: input, description: "FK -> ShelterSite.id; facility being activated" }
      - { name: disaster_relief_operation_id, type: string, source: input, description: "FK -> DisasterReliefOperation.id; operation the shelter serves" }
      - { name: opened_at, type: datetime, source: computed, description: "Instant the shelter entered OPEN posture" }
      - { name: posture, type: enum, source: computed, description: "PENDING_OPEN | OPEN | RESTRICTED | CONSOLIDATING | CLOSED — gates every child operation", constraints: "enum: PENDING_OPEN | OPEN | RESTRICTED | CONSOLIDATING | CLOSED" }
      - { name: occupied_beds, type: integer, source: computed, description: "Count of ShelterRegistration rows in this shelter with status=REGISTERED and a non-null dormitory_bed_code" }
      - { name: registered_client_count, type: integer, source: computed, description: "Count of ShelterRegistration rows in this shelter with status IN {REGISTERED, REUNIFIED}" }
      - { name: reunification_pending_count, type: integer, source: computed, description: "Count of ShelterRegistration rows in this shelter with reunification_status IN {PENDING, VERIFIED}" }
      - { name: staffed_volunteer_count, type: integer, source: computed, description: "Count of VolunteerDeployment rows for this shelter with status IN {ARRIVED, ON_SHIFT}" }
      - { name: staffing_sufficiency, type: number, source: computed, description: "= round_half_up(min(1.0, staffed_volunteer_count / required_volunteers), 4) per staffing_sufficiency calculation" }
      - { name: meals_served_total, type: integer, source: computed, description: "Running sum of meals_served across all feeding-service events recorded for this shelter" }
      - { name: feeding_cost_cents, type: integer, source: computed, description: "Running sum of per-event rounded feeding line costs (see feeding_line_cost calculation)" }
      - { name: health_service_count, type: integer, source: computed, description: "Running count of health-service events recorded for this shelter" }
      - { name: operational_cost_cents, type: integer, source: computed, description: "Provisional or final operating cost per the shelter_operational_cost calculation variant selected by the reporting mode" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer legal name" }
      - { name: home_region_id, type: string, source: input, description: "FK -> Region.id; region the volunteer belongs to" }
      - { name: qualified_role_codes, type: array, source: input, description: "Deployment role codes the volunteer is trained for" }
      - { name: credential_status, type: enum, source: computed, description: "PENDING | ACTIVE | EXPIRED — an independent dimension from deployment_availability", constraints: "enum: PENDING | ACTIVE | EXPIRED" }
      - { name: credential_refreshed_at, type: datetime, source: computed, description: "Instant of the most recent credential refresh" }
      - { name: credential_expires_at, type: datetime, source: computed, description: "= credential_refreshed_at + CREDENTIAL_VALIDITY_DAYS; credential_status flips to EXPIRED at this instant" }
      - { name: deployment_availability, type: enum, source: computed, description: "AVAILABLE | DEPLOYED | RESTING | UNAVAILABLE — independent of credential_status", constraints: "enum: AVAILABLE | DEPLOYED | RESTING | UNAVAILABLE" }
      - { name: rotation_days_used_ytd, type: integer, source: computed, description: "Sum of rotation_days over this volunteer's deployments with status IN {ROTATION_ENDED, RECALLED}" }

  - name: VolunteerDeployment
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; volunteer being deployed" }
      - { name: disaster_relief_operation_id, type: string, source: input, description: "FK -> DisasterReliefOperation.id; operation the volunteer is deployed to" }
      - { name: shelter_operation_id, type: string, source: input, description: "FK -> ShelterOperation.id; shelter the volunteer reports to", default: null }
      - { name: role_code, type: enum, source: input, description: "SHELTER_MANAGER | REGISTRATION | DORMITORY | FEEDING | HEALTH_SERVICES | REUNIFICATION | CASEWORK", constraints: "enum: SHELTER_MANAGER | REGISTRATION | DORMITORY | FEEDING | HEALTH_SERVICES | REUNIFICATION | CASEWORK" }
      - { name: travel_mode, type: enum, source: input, description: "AIR | GROUND | SELF", constraints: "enum: AIR | GROUND | SELF" }
      - { name: rotation_start_at, type: datetime, source: input, description: "Instant the rotation is scheduled to begin on site" }
      - { name: rotation_days, type: integer, source: input, description: "Length of the rotation in days", constraints: "1 <= rotation_days <= 21" }
      - { name: travel_cost_cents, type: integer, source: computed, description: "Travel cost per the travel_cost_estimate calculation, computed at approval" }
      - { name: status, type: enum, source: computed, description: "REQUESTED | APPROVED | IN_TRANSIT | ARRIVED | ON_SHIFT | ROTATION_ENDED | RECALLED | CANCELLED", constraints: "enum: REQUESTED | APPROVED | IN_TRANSIT | ARRIVED | ON_SHIFT | ROTATION_ENDED | RECALLED | CANCELLED" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_deployment_id, type: string, source: input, description: "FK -> VolunteerDeployment.id; deployment the shift belongs to" }
      - { name: shelter_operation_id, type: string, source: input, description: "FK -> ShelterOperation.id; shelter the shift is worked at" }
      - { name: functional_area, type: enum, source: input, description: "REGISTRATION | DORMITORY | FEEDING | HEALTH | REUNIFICATION | SECURITY", constraints: "enum: REGISTRATION | DORMITORY | FEEDING | HEALTH | REUNIFICATION | SECURITY" }
      - { name: shift_start_at, type: datetime, source: input, description: "Inclusive start of the shift interval" }
      - { name: shift_end_at, type: datetime, source: input, description: "Exclusive end of the shift interval", constraints: "must be strictly after shift_start_at" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", constraints: "enum: SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client legal name" }
      - { name: household_size, type: integer, source: input, description: "Number of people in the client household", constraints: ">= 1" }
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region of residence at the time of the disaster" }
      - { name: primary_client_id, type: string, source: input, description: "FK -> Client.id; head-of-household client this record is attached to", default: null }

  - name: ShelterRegistration
    parent: null
    common_fields: true
    fields:
      - { name: shelter_operation_id, type: string, source: input, description: "FK -> ShelterOperation.id; shelter the client registered at" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; registering client" }
      - { name: requested_bed_code, type: string, source: input, description: "Bed code the operator asked for; when omitted the bed selector assigns one", default: null }
      - { name: dormitory_bed_code, type: string, source: computed, description: "Bed code actually assigned; null when the client is registered without a bed" }
      - { name: occupied_from_at, type: datetime, source: input, description: "Inclusive start of the dormitory bed occupancy interval" }
      - { name: occupied_until_at, type: datetime, source: input, description: "Exclusive end of the dormitory bed occupancy interval; null while still occupied", default: null }
      - { name: functional_needs_flag, type: boolean, source: input, description: "Whether the client requires access and functional needs support" }
      - { name: reunification_reference, type: string, source: input, description: "Opaque reference of the person the client is trying to reunify with", default: null }
      - { name: reunification_status, type: enum, source: computed, description: "NOT_REQUESTED | PENDING | VERIFIED | REUNIFIED", constraints: "enum: NOT_REQUESTED | PENDING | VERIFIED | REUNIFIED" }
      - { name: reunification_verified_by_user_id, type: string, source: computed, description: "Opaque identifier of the volunteer who verified the reunification" }
      - { name: health_service_count, type: integer, source: computed, description: "Running count of health-service events recorded against this registration" }
      - { name: status, type: enum, source: computed, description: "REGISTERED | CHECKED_OUT | TRANSFERRED | REUNIFIED", constraints: "enum: REGISTERED | CHECKED_OUT | TRANSFERRED | REUNIFIED" }

  - name: ClientCase
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client the case belongs to" }
      - { name: disaster_relief_operation_id, type: string, source: input, description: "FK -> DisasterReliefOperation.id; operation the case is opened under" }
      - { name: assigned_caseworker_id, type: string, source: input, description: "Opaque identifier of the caseworker owning the case" }
      - { name: status, type: enum, source: computed, description: "INTAKE | ELIGIBILITY_REVIEW | RECOVERY_PLANNING | REFERRED | MONITORING | CLOSED | REOPENED", constraints: "enum: INTAKE | ELIGIBILITY_REVIEW | RECOVERY_PLANNING | REFERRED | MONITORING | CLOSED | REOPENED" }
      - { name: eligibility_status, type: enum, source: computed, description: "PENDING | VERIFIED | INELIGIBLE | EXPIRED", constraints: "enum: PENDING | VERIFIED | INELIGIBLE | EXPIRED" }
      - { name: eligibility_verified_by_user_id, type: string, source: computed, description: "Opaque identifier of the operator who verified eligibility" }
      - { name: recovery_plan_revision, type: integer, source: computed, description: "Monotone revision counter of the recovery plan; starts at 1", default: 1 }
      - { name: recovery_plan_summary, type: string, source: computed, description: "Summary text of the current recovery plan revision" }
      - { name: entitlement_cents, type: integer, source: computed, description: "Client entitlement per the client_assistance_entitlement calculation, evaluated for the case's current variant" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: client_case_id, type: string, source: input, description: "FK -> ClientCase.id; case the referral belongs to" }
      - { name: agency_code, type: string, source: input, description: "Partner agency code the client is referred to; must appear in the client's Region.authorized_agency_codes" }
      - { name: assistance_type, type: enum, source: input, description: "HOUSING | FOOD | MEDICAL | TRANSPORTATION | UTILITY | FUNERAL | OCCUPATIONAL", constraints: "enum: HOUSING | FOOD | MEDICAL | TRANSPORTATION | UTILITY | FUNERAL | OCCUPATIONAL" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Dollar value of the benefit the agency is expected to provide", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "SUBMITTED | ACCEPTED | DECLINED | COMPLETED | CANCELLED", constraints: "enum: SUBMITTED | ACCEPTED | DECLINED | COMPLETED | CANCELLED" }
      - { name: duplication_check_result, type: enum, source: computed, description: "CLEAR | DUPLICATE_BLOCKED | PARTIAL_OVERLAP", constraints: "enum: CLEAR | DUPLICATE_BLOCKED | PARTIAL_OVERLAP" }

  - name: AssistanceRequest
    parent: null
    common_fields: true
    fields:
      - { name: client_case_id, type: string, source: input, description: "FK -> ClientCase.id; case the request is made under" }
      - { name: fund_pool_id, type: string, source: input, description: "FK -> FundPool.id; donor-restricted pool the award is drawn from" }
      - { name: assistance_type, type: enum, source: input, description: "HOUSING | FOOD | MEDICAL | TRANSPORTATION | UTILITY | FUNERAL | OCCUPATIONAL", constraints: "enum: HOUSING | FOOD | MEDICAL | TRANSPORTATION | UTILITY | FUNERAL | OCCUPATIONAL" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the client requested", constraints: ">= 1" }
      - { name: duplication_offset_cents, type: integer, source: computed, description: "Sum of estimated_value_cents over the case's non-declined referrals of the same assistance_type (see duplication_of_benefits_offset)" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "= max(0, requested_amount_cents - duplication_offset_cents), zeroed when below MIN_ASSISTANCE_CENTS" }
      - { name: status, type: enum, source: computed, description: "SUBMITTED | ELIGIBILITY_VERIFIED | APPROVED | DENIED | CARD_ISSUED | DISBURSED | REVERSED", constraints: "enum: SUBMITTED | ELIGIBILITY_VERIFIED | APPROVED | DENIED | CARD_ISSUED | DISBURSED | REVERSED" }
      - { name: approved_by_user_id, type: string, source: computed, description: "Opaque identifier of the FinanceOfficer who approved the award" }
      - { name: card_number_masked, type: string, source: computed, description: "Masked financial assistance card number; null before issuance" }
      - { name: card_status, type: enum, source: computed, description: "NOT_ISSUED | ISSUED | ACTIVE | REDEEMED | VOIDED", constraints: "enum: NOT_ISSUED | ISSUED | ACTIVE | REDEEMED | VOIDED" }
      - { name: redemption_deadline_at, type: datetime, source: computed, description: "= issued_at + redemption window (90 days, or 45 days when the shelter posture was RESTRICTED at issuance)" }
      - { name: issued_by_user_id, type: string, source: computed, description: "Opaque identifier of the operator who issued the card; must differ from approved_by_user_id" }

  - name: FundPool
    parent: null
    common_fields: true
    fields:
      - { name: fund_code, type: string, source: input, description: "Donor fund code", constraints: "unique; non-empty" }
      - { name: restriction_type, type: enum, source: input, description: "UNRESTRICTED | DONOR_RESTRICTED_DISASTER | DONOR_RESTRICTED_BLOOD | DONOR_RESTRICTED_LOCAL", constraints: "enum: UNRESTRICTED | DONOR_RESTRICTED_DISASTER | DONOR_RESTRICTED_BLOOD | DONOR_RESTRICTED_LOCAL" }
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region a DONOR_RESTRICTED_LOCAL pool is bound to", default: null }
      - { name: total_received_cents, type: integer, source: input, description: "Total donor receipts booked into the pool", constraints: ">= 0" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of approved_amount_cents over AssistanceRequest rows on this pool with status IN {APPROVED, CARD_ISSUED}" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of approved_amount_cents over AssistanceRequest rows on this pool with status=DISBURSED" }
      - { name: remaining_cents, type: integer, source: computed, description: "= total_received_cents - committed_cents - disbursed_cents" }

  - name: CostLedgerEntry
    parent: null
    common_fields: true
    fields:
      - { name: disaster_relief_operation_id, type: string, source: input, description: "FK -> DisasterReliefOperation.id; operation the cost belongs to" }
      - { name: fund_pool_id, type: string, source: input, description: "FK -> FundPool.id; pool the cost is booked against" }
      - { name: cost_category, type: enum, source: input, description: "SHELTER_OPERATIONS | FEEDING | VOLUNTEER_TRAVEL | FINANCIAL_ASSISTANCE | HEALTH_SERVICES | BLOOD_COLLECTION | LOGISTICS", constraints: "enum: SHELTER_OPERATIONS | FEEDING | VOLUNTEER_TRAVEL | FINANCIAL_ASSISTANCE | HEALTH_SERVICES | BLOOD_COLLECTION | LOGISTICS" }
      - { name: amount_cents, type: integer, source: input, description: "Absolute value of the ledger movement", constraints: ">= 1" }
      - { name: entry_type, type: enum, source: input, description: "CHARGE | REVERSAL", constraints: "enum: CHARGE | REVERSAL" }
      - { name: incurred_at, type: datetime, source: input, description: "ISO 8601 UTC instant the cost was incurred" }

  - name: BloodDrive
    parent: null
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region hosting the drive" }
      - { name: site_name, type: string, source: input, description: "Collection site name" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Inclusive start of the collection window" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Exclusive end of the collection window", constraints: "must be strictly after scheduled_start_at" }
      - { name: target_units, type: integer, source: input, description: "Units the drive is chartered to collect", constraints: ">= 1" }
      - { name: collected_units, type: integer, source: computed, description: "Units recorded against the drive through collection events; may not exceed target_units" }
      - { name: usable_units, type: integer, source: computed, description: "= collected_units - floor(collected_units * DEFERRAL_LOSS_BPS / 10000)" }
      - { name: status, type: enum, source: computed, description: "PLANNED | ACTIVE | COMPLETED | CANCELLED", constraints: "enum: PLANNED | ACTIVE | COMPLETED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ShelterSite
    initial_state: PENDING_INSPECTION
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING_INSPECTION
        to: APPROVED
        trigger: "POST /shelter-sites/{id}/inspections with result PASS or CONDITIONAL_PASS"
        actor: RegionalCoordinator
        preconditions:
          - "capacity_verified_beds >= 1"
          - "accessibility_verified == true"
        side_effects:
          - "ShelterSite.capacity_verified_beds, accessibility_verified, functional_needs_verified, last_inspection_at, inspection_result set from the inspection payload"
          - "increments ShelterSite.version by 1"
      - from: PENDING_INSPECTION
        to: SUSPENDED
        trigger: "POST /shelter-sites/{id}/inspections with result FAIL"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "ShelterSite.inspection_result=FAIL, last_inspection_at stamped"
          - "CASCADE (depth 2): every ShelterOperation row for this site with posture IN {OPEN, RESTRICTED} moves to RESTRICTED (cascade_inspection_fail_suspend)"
          - "increments ShelterSite.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /shelter-sites/{id}/inspections with result FAIL"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "ShelterSite.inspection_result=FAIL"
          - "CASCADE (depth 2): every ShelterOperation row for this site with posture IN {OPEN, RESTRICTED} moves to RESTRICTED (cascade_inspection_fail_suspend)"
          - "increments ShelterSite.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /shelter-sites/{id}/inspections with result PASS or CONDITIONAL_PASS"
        actor: RegionalCoordinator
        preconditions:
          - "capacity_verified_beds >= 1"
          - "accessibility_verified == true"
        side_effects:
          - "ShelterSite.inspection_result set, last_inspection_at stamped"
          - "ShelterOperation rows of this site stay RESTRICTED until staffing_sufficiency >= 0.60 re-opens them"
          - "increments ShelterSite.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic when logical clock >= agreement_expires_at, evaluated on any read or write of the site)"
        actor: system
        preconditions:
          - "logical clock >= agreement_expires_at"
        side_effects:
          - "increments ShelterSite.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (automatic when logical clock >= agreement_expires_at, evaluated on any read or write of the site)"
        actor: system
        preconditions:
          - "logical clock >= agreement_expires_at"
        side_effects:
          - "increments ShelterSite.version by 1"

  - entity: DisasterReliefOperation
    initial_state: MOBILIZATION
    terminal_states: [CLOSED]
    transitions:
      - from: MOBILIZATION
        to: ACTIVE
        trigger: "POST /disaster-relief-operations/{id}/advance-phase"
        actor: RegionalCoordinator
        preconditions:
          - "at least one ShelterOperation under this operation exists with posture IN {PENDING_OPEN, OPEN, RESTRICTED}"
        side_effects:
          - "increments DisasterReliefOperation.version by 1"
      - from: ACTIVE
        to: DEMOBILIZATION
        trigger: "POST /disaster-relief-operations/{id}/advance-phase"
        actor: RegionalCoordinator
        preconditions:
          - "open_shelter_count <= 2"
        side_effects:
          - "increments DisasterReliefOperation.version by 1"
      - from: DEMOBILIZATION
        to: CLOSED
        trigger: "POST /disaster-relief-operations/{id}/advance-phase"
        actor: RegionalCoordinator
        preconditions:
          - "open_shelter_count == 0"
        side_effects:
          - "increments DisasterReliefOperation.version by 1"

  - entity: ShelterOperation
    initial_state: PENDING_OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_OPEN
        to: OPEN
        trigger: "POST /shelter-operations/{id}/open"
        actor: RegionalCoordinator
        preconditions:
          - "ShelterSite.agreement_status == APPROVED"
          - "ShelterSite.inspection_result IN {PASS, CONDITIONAL_PASS}"
          - "DisasterReliefOperation.phase IN {MOBILIZATION, ACTIVE}"
          - "staffing_sufficiency >= 0.60"
        side_effects:
          - "opened_at stamped from the logical clock"
          - "DisasterReliefOperation.open_shelter_count recomputed"
          - "increments ShelterOperation.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "system (automatic when staffing_sufficiency < 0.60)"
        actor: system
        preconditions:
          - "staffing_sufficiency < RESTRICTED_THRESHOLD"
        side_effects:
          - "new ShelterRegistration rows are rejected with ERR_SHELTER_RESTRICTED while RESTRICTED"
          - "increments ShelterOperation.version by 1"
        note: "Bed capacity is NOT a posture input. Capacity is enforced separately by the ERR_CAPACITY_EXCEEDED check on registration, so a full but fully staffed shelter stays OPEN and rejects the next registration on the capacity check."
      - from: RESTRICTED
        to: OPEN
        trigger: "system (automatic when staffing_sufficiency >= 0.60)"
        actor: system
        preconditions:
          - "staffing_sufficiency >= RESTRICTED_THRESHOLD"
        side_effects:
          - "increments ShelterOperation.version by 1"
      - from: OPEN
        to: CONSOLIDATING
        trigger: "POST /shelter-operations/{id}/close"
        actor: RegionalCoordinator
        preconditions:
          - "DisasterReliefOperation.phase == DEMOBILIZATION"
          - "registered_client_count > 0"
        side_effects:
          - "increments ShelterOperation.version by 1"
      - from: RESTRICTED
        to: CONSOLIDATING
        trigger: "POST /shelter-operations/{id}/close"
        actor: RegionalCoordinator
        preconditions:
          - "DisasterReliefOperation.phase == DEMOBILIZATION"
          - "registered_client_count > 0"
        side_effects:
          - "increments ShelterOperation.version by 1"
      - from: CONSOLIDATING
        to: CLOSED
        trigger: "POST /shelter-operations/{id}/close"
        actor: RegionalCoordinator
        preconditions:
          - "registered_client_count == 0"
        side_effects:
          - "CASCADE (depth 3): every VolunteerDeployment row with shelter_operation_id == this shelter and status IN {ARRIVED, ON_SHIFT} moves to RECALLED"
          - "CASCADE (depth 3, hop 2): each recalled Volunteer moves to deployment_availability=AVAILABLE"
          - "CASCADE (depth 3, hop 3): Region.deployed_volunteer_count and Region.available_volunteer_count recomputed for every affected volunteer's home region"
          - "DisasterReliefOperation.open_shelter_count recomputed"
          - "increments ShelterOperation.version by 1"
      - from: CONSOLIDATING
        to: RESTRICTED
        trigger: "system (automatic when a new ShelterRegistration is created for this shelter while it is CONSOLIDATING)"
        actor: system
        preconditions:
          - "a ShelterRegistration row was created for this shelter after it entered CONSOLIDATING"
        side_effects:
          - "increments ShelterOperation.version by 1"

  - entity: Volunteer
    initial_state: PENDING
    terminal_states: []
    note: "Two independent state dimensions live on this entity: credential_status and deployment_availability. They advance independently; only the cross-product rules in validations constrain them."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /volunteers/{id}/credential-refresh"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "credential_refreshed_at stamped from the logical clock"
          - "credential_expires_at = credential_refreshed_at + CREDENTIAL_VALIDITY_DAYS"
          - "deployment_availability moves to AVAILABLE"
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock >= credential_expires_at)"
        actor: system
        preconditions:
          - "logical clock >= credential_expires_at"
        side_effects:
          - "deployment_availability moves to UNAVAILABLE"
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /volunteers/{id}/credential-refresh (also clears a RESTING or UNAVAILABLE availability, returning the volunteer to the deployable pool)"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "credential_refreshed_at stamped from the logical clock"
          - "credential_expires_at = credential_refreshed_at + CREDENTIAL_VALIDITY_DAYS"
          - "deployment_availability moves to AVAILABLE"
          - "increments Volunteer.version by 1"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /volunteers/{id}/credential-refresh"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "credential_refreshed_at stamped from the logical clock"
          - "credential_expires_at = credential_refreshed_at + CREDENTIAL_VALIDITY_DAYS"
          - "deployment_availability moves to AVAILABLE"
          - "increments Volunteer.version by 1"

  - entity: VolunteerDeployment
    initial_state: REQUESTED
    terminal_states: [ROTATION_ENDED, RECALLED, CANCELLED]
    note: "Automatic transitions are evaluated to a fixed point on every read and every write, so one clock advance may carry a deployment through several automatic transitions (APPROVED -> IN_TRANSIT -> ARRIVED) before the request itself is evaluated."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /volunteer-deployments/{id}/approve"
        actor: RegionalCoordinator
        preconditions:
          - "Volunteer.credential_status == ACTIVE"
          - "Volunteer.deployment_availability == AVAILABLE"
          - "role_code IN Volunteer.qualified_role_codes"
          - "rotation_days <= 21"
          - "Volunteer.rotation_days_used_ytd + rotation_days <= 40"
        side_effects:
          - "travel_cost_cents computed per travel_cost_estimate"
          - "Volunteer.deployment_availability moves to DEPLOYED"
          - "Region.available_volunteer_count and Region.deployed_volunteer_count recomputed for the volunteer's home region"
          - "increments VolunteerDeployment.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /volunteer-deployments/{id}/recall"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "increments VolunteerDeployment.version by 1"
      - from: APPROVED
        to: IN_TRANSIT
        trigger: "system (automatic when logical clock >= rotation_start_at - travel_lead_days(travel_mode))"
        actor: system
        preconditions:
          - "logical clock >= rotation_start_at - travel_lead_days"
        side_effects:
          - "increments VolunteerDeployment.version by 1"
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: "system (automatic when logical clock >= rotation_start_at)"
        actor: system
        preconditions:
          - "logical clock >= rotation_start_at"
        side_effects:
          - "increments VolunteerDeployment.version by 1"
      - from: ARRIVED
        to: ON_SHIFT
        trigger: "system (automatic when a ShiftAssignment of this deployment transitions to CHECKED_IN)"
        actor: system
        preconditions:
          - "a ShiftAssignment row with volunteer_deployment_id == this deployment is CHECKED_IN"
        side_effects:
          - "ShelterOperation.staffed_volunteer_count and staffing_sufficiency recomputed"
          - "increments VolunteerDeployment.version by 1"
      - from: ON_SHIFT
        to: ROTATION_ENDED
        trigger: "POST /volunteer-deployments/{id}/end-rotation"
        actor: Volunteer
        preconditions:
          - "the acting volunteer owns this deployment (X-User-ID == deployment.volunteer_id)"
        side_effects:
          - "Volunteer.deployment_availability moves to AVAILABLE (a recalled volunteer returns to the deployable pool)"
          - "Volunteer.rotation_days_used_ytd += rotation_days"
          - "ShelterOperation.staffed_volunteer_count and staffing_sufficiency recomputed"
          - "increments VolunteerDeployment.version by 1"
      - from: APPROVED
        to: RECALLED
        trigger: "POST /volunteer-deployments/{id}/recall"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "Volunteer.deployment_availability moves to AVAILABLE (a recalled volunteer returns to the deployable pool)"
          - "increments VolunteerDeployment.version by 1"
      - from: IN_TRANSIT
        to: RECALLED
        trigger: "POST /volunteer-deployments/{id}/recall"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "Volunteer.deployment_availability moves to AVAILABLE (a recalled volunteer returns to the deployable pool)"
          - "increments VolunteerDeployment.version by 1"
      - from: ARRIVED
        to: RECALLED
        trigger: "POST /volunteer-deployments/{id}/recall"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "Volunteer.deployment_availability moves to AVAILABLE (a recalled volunteer returns to the deployable pool)"
          - "ShelterOperation.staffed_volunteer_count and staffing_sufficiency recomputed"
          - "increments VolunteerDeployment.version by 1"
      - from: ON_SHIFT
        to: RECALLED
        trigger: "POST /volunteer-deployments/{id}/recall, or system when the parent ShelterOperation closes"
        actor: RegionalCoordinator
        preconditions: []
        side_effects:
          - "Volunteer.deployment_availability moves to AVAILABLE (a recalled volunteer returns to the deployable pool)"
          - "ShelterOperation.staffed_volunteer_count and staffing_sufficiency recomputed"
          - "increments VolunteerDeployment.version by 1"

  - entity: ShiftAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /shift-assignments/{id}/check-in"
        actor: Volunteer
        preconditions:
          - "the acting volunteer owns the parent deployment (X-User-ID == deployment.volunteer_id)"
          - "logical clock >= shift_start_at - 60 minutes"
          - "ShelterOperation.posture IN {OPEN, RESTRICTED}"
        side_effects:
          - "parent VolunteerDeployment moves to ON_SHIFT when it is ARRIVED"
          - "increments ShiftAssignment.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (automatic when logical clock >= shift_start_at + 240 minutes and status is still SCHEDULED)"
        actor: system
        preconditions:
          - "logical clock >= shift_start_at + NO_SHOW_GRACE_MINUTES"
        side_effects:
          - "increments ShiftAssignment.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (automatic when logical clock >= shift_end_at)"
        actor: system
        preconditions:
          - "logical clock >= shift_end_at"
        side_effects:
          - "increments ShiftAssignment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (automatic when the parent VolunteerDeployment moves to RECALLED)"
        actor: system
        preconditions:
          - "parent deployment status == RECALLED"
        side_effects:
          - "increments ShiftAssignment.version by 1"

  - entity: ClientCase
    initial_state: INTAKE
    terminal_states: []
    transitions:
      - from: INTAKE
        to: ELIGIBILITY_REVIEW
        trigger: "POST /client-cases/{id}/verify-eligibility"
        actor: Caseworker
        preconditions:
          - "assigned_caseworker_id == X-User-ID"
        side_effects:
          - "increments ClientCase.version by 1"
      - from: ELIGIBILITY_REVIEW
        to: RECOVERY_PLANNING
        trigger: "POST /client-cases/{id}/recovery-plans"
        actor: Caseworker
        preconditions:
          - "eligibility_status == VERIFIED"
        side_effects:
          - "recovery_plan_revision = 1, recovery_plan_summary set"
          - "increments ClientCase.version by 1"
      - from: RECOVERY_PLANNING
        to: REFERRED
        trigger: "POST /client-cases/{id}/referrals"
        actor: Caseworker
        preconditions:
          - "agency_code IN the client's Region.authorized_agency_codes"
        side_effects:
          - "Referral created in SUBMITTED status"
          - "increments ClientCase.version by 1"
      - from: REFERRED
        to: MONITORING
        trigger: "system (automatic when every Referral of this case is in a terminal status IN {COMPLETED, DECLINED, CANCELLED})"
        actor: system
        preconditions:
          - "no Referral of this case has status IN {SUBMITTED, ACCEPTED}"
        side_effects:
          - "increments ClientCase.version by 1"
      - from: MONITORING
        to: CLOSED
        trigger: "system (automatic when logical clock >= the case's closure_eligible_at, which is the later of the last Referral resolution and the last AssistanceRequest disbursement, plus CLOSURE_HOLD_DAYS)"
        actor: system
        preconditions:
          - "logical clock >= closure_eligible_at"
        side_effects:
          - "increments ClientCase.version by 1"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /client-cases/{id}/verify-eligibility"
        actor: Caseworker
        preconditions:
          - "assigned_caseworker_id == X-User-ID"
          - "a new AssistanceRequest is required for the same client"
        side_effects:
          - "eligibility_status set from the request payload"
          - "increments ClientCase.version by 1"
      - from: REOPENED
        to: RECOVERY_PLANNING
        trigger: "POST /client-cases/{id}/recovery-plans"
        actor: Caseworker
        preconditions:
          - "eligibility_status == VERIFIED"
        side_effects:
          - "recovery_plan_revision += 1"
          - "increments ClientCase.version by 1"

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /referrals/{id}/resolve with decision ACCEPT"
        actor: Caseworker
        preconditions:
          - "duplication_check_result != DUPLICATE_BLOCKED"
        side_effects:
          - "increments Referral.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /referrals/{id}/resolve with decision DECLINE"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "increments Referral.version by 1"
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /referrals/{id}/resolve with decision REQUEST_INFORMATION"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "the referral re-enters the duplication check on the next resolve"
          - "increments Referral.version by 1"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /referrals/{id}/resolve with decision COMPLETE"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "ClientCase.status recomputed (REFERRED -> MONITORING when no open referrals remain)"
          - "increments Referral.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /referrals/{id}/resolve with decision CANCEL"
        actor: Caseworker
        preconditions: []
        side_effects:
          - "ClientCase.status recomputed"
          - "increments Referral.version by 1"

  - entity: AssistanceRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, DISBURSED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: ELIGIBILITY_VERIFIED
        trigger: "POST /assistance-requests/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "ClientCase.eligibility_status == VERIFIED"
        side_effects:
          - "duplication_offset_cents and approved_amount_cents computed"
          - "increments AssistanceRequest.version by 1"
      - from: ELIGIBILITY_VERIFIED
        to: APPROVED
        trigger: "POST /assistance-requests/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "approved_amount_cents >= MIN_ASSISTANCE_CENTS"
          - "FundPool.remaining_cents >= approved_amount_cents"
          - "FundPool.restriction_type is compatible with assistance_type"
        side_effects:
          - "approved_by_user_id stamped from X-User-ID"
          - "FundPool.committed_cents and FundPool.remaining_cents recomputed"
          - "DisasterReliefOperation.restricted_fund_balance_cents recomputed"
          - "increments AssistanceRequest.version by 1"
      - from: ELIGIBILITY_VERIFIED
        to: DENIED
        trigger: "POST /assistance-requests/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "approved_amount_cents == 0 (the duplication offset fully covers the requested amount)"
        side_effects:
          - "increments AssistanceRequest.version by 1"
        note: "When 0 < approved_amount_cents < MIN_ASSISTANCE_CENTS the call is rejected with ERR_ASSISTANCE_BELOW_MINIMUM (409) and the request stays ELIGIBILITY_VERIFIED."
      - from: APPROVED
        to: CARD_ISSUED
        trigger: "POST /assistance-requests/{id}/issue-card"
        actor: FinanceOfficer
        preconditions:
          - "issued_by_user_id != approved_by_user_id (segregation of duties)"
        side_effects:
          - "card_number_masked generated, card_status=ISSUED"
          - "redemption_deadline_at = issued_at + redemption window"
          - "increments AssistanceRequest.version by 1"
      - from: CARD_ISSUED
        to: DISBURSED
        trigger: "POST /assistance-requests/{id}/redeem-card"
        actor: FinanceOfficer
        preconditions:
          - "logical clock < redemption_deadline_at"
        side_effects:
          - "card_status=REDEEMED"
          - "FundPool.committed_cents and FundPool.disbursed_cents recomputed"
          - "a CostLedgerEntry with cost_category=FINANCIAL_ASSISTANCE and entry_type=CHARGE is appended to the operation's ledger"
          - "increments AssistanceRequest.version by 1"
      - from: DISBURSED
        to: REVERSED
        trigger: "POST /assistance-requests/{id}/reverse"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "card_status=VOIDED"
          - "CASCADE (depth 3): FundPool.disbursed_cents recomputed (hop 1)"
          - "CASCADE (depth 3, hop 2): FundPool.remaining_cents recomputed"
          - "CASCADE (depth 3, hop 3): DisasterReliefOperation.restricted_fund_balance_cents recomputed and a CostLedgerEntry with entry_type=REVERSAL is appended"
          - "increments AssistanceRequest.version by 1"

  - entity: BloodDrive
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system (automatic when logical clock >= scheduled_start_at)"
        actor: system
        preconditions:
          - "logical clock >= scheduled_start_at"
        side_effects:
          - "increments BloodDrive.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when logical clock >= scheduled_end_at)"
        actor: system
        preconditions:
          - "logical clock >= scheduled_end_at"
        side_effects:
          - "Region.blood_continuity_index and Region.blood_continuity_status recomputed"
          - "increments BloodDrive.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /blood-drives/{id}/cancel"
        actor: BloodServicesCoordinator
        preconditions:
          - "collected_units == 0"
        side_effects:
          - "increments BloodDrive.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /blood-drives/{id}/cancel"
        actor: BloodServicesCoordinator
        preconditions: []
        side_effects:
          - "Region.blood_continuity_index and Region.blood_continuity_status recomputed"
          - "increments BloodDrive.version by 1"

  - entity: ShelterRegistration
    initial_state: REGISTERED
    terminal_states: [CHECKED_OUT, TRANSFERRED, REUNIFIED]
    transitions:
      - from: REGISTERED
        to: CHECKED_OUT
        trigger: "POST /shelter-registrations/{id}/check-out"
        actor: ShelterManager
        preconditions: []
        side_effects:
          - "occupied_until_at stamped from the logical clock"
          - "ShelterOperation.occupied_beds and registered_client_count recomputed"
          - "ShelterOperation.posture re-evaluated (RESTRICTED -> OPEN when staffing_sufficiency >= 0.60)"
          - "increments ShelterRegistration.version by 1"
      - from: REGISTERED
        to: REUNIFIED
        trigger: "POST /shelter-registrations/{id}/check-out with reunification_reference set and reunification_status VERIFIED"
        actor: ShelterManager
        preconditions:
          - "reunification_status == VERIFIED"
          - "reunification_verified_by_user_id != X-User-ID (segregation of duties)"
        side_effects:
          - "occupied_until_at stamped, reunification_status=REUNIFIED"
          - "ShelterOperation.occupied_beds, registered_client_count and reunification_pending_count recomputed"
          - "increments ShelterRegistration.version by 1"

# =============================================================================
# Table 2b: Concurrency Rules (true races only — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: case-recovery-plan-stale-case
    parent_entity: ClientCase
    write_endpoint: "POST /client-cases/{id}/recovery-plans"
    occ_field: "expected_client_case_version"
    description: |
      Writing a new recovery plan revision against a ClientCase whose version has
      advanced since the client last observed it is rejected. A new revision
      legitimately supersedes the prior one, so a strictly later second write is
      itself valid under the product semantics; only a stale observed version
      makes it fail.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: site-inspection-stale-site
    parent_entity: ShelterSite
    write_endpoint: "POST /shelter-sites/{id}/inspections"
    occ_field: "expected_shelter_site_version"
    description: |
      Recording an inspection against a ShelterSite whose version has advanced
      since the inspector last observed it is rejected. A later re-inspection
      legitimately supersedes the prior inspection result, so the write is only
      refused when the observed site version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dro-cost-entry-stale-operation
    parent_entity: DisasterReliefOperation
    write_endpoint: "POST /disaster-relief-operations/{id}/cost-ledger-entries"
    occ_field: "expected_disaster_relief_operation_version"
    description: |
      Booking a cost ledger entry against a DisasterReliefOperation whose version
      has advanced since the bookkeeper last observed it is rejected. Appending a
      further entry is itself legitimate, so only a stale observed operation
      version makes the write fail.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: shelter_operational_cost
    trigger: "any read of ShelterOperation.operational_cost_cents; the caller selects the variant with the `reporting_mode` query parameter"
    algorithm: dual_variant
    formula: |
      # Variant provisional (forward_looking) — reporting_mode=PROVISIONAL
      direct_provisional_cents =
          sum(round_half_up(meals_planned * unit_cost_cents * 10625 / 10000)
              for every feeding-service event recorded on this shelter)
        + sum(travel_cost_cents for VolunteerDeployment rows with shelter_operation_id == this
              and status IN {APPROVED, IN_TRANSIT, ARRIVED, ON_SHIFT})
        + sum(requested_amount_cents for AssistanceRequest rows whose client_case belongs to a client
              registered at this shelter, status IN {APPROVED, CARD_ISSUED})
      overhead_provisional = max(round_half_up(direct_provisional_cents * 750 / 10000), 2500)
      operational_cost_cents = direct_provisional_cents + overhead_provisional

      # Variant final (chronological) — reporting_mode=FINAL
      direct_final_cents =
          feeding_cost_cents                       # already accumulated per-line-rounded
        + sum(travel_cost_cents for VolunteerDeployment rows with shelter_operation_id == this
              and status == ROTATION_ENDED)
        + sum(approved_amount_cents for AssistanceRequest rows of this shelter's clients
              with status == DISBURSED)
      overhead_final = max(round_half_up(direct_final_cents * 750 / 10000), 2500)
      operational_cost_cents = direct_final_cents + overhead_final
    input_set: "feeding-service events on the shelter; VolunteerDeployment rows whose shelter_operation_id equals the shelter; AssistanceRequest rows reachable through ClientCase -> Client -> ShelterRegistration for this shelter"
    constants:
      OVERHEAD_RATE_BPS: 750
      MIN_OVERHEAD_CENTS: 2500
    precision: "integer cents; round_half_up at the single pinned rounding point shown"
    variants:
      - name: provisional
        when: "reporting_mode=PROVISIONAL (default) — used while the shelter is PENDING_OPEN, OPEN, RESTRICTED or CONSOLIDATING"
        difference: "counts planned meals, non-terminal travel and merely approved assistance, so it is greater than or equal to the final variant for identical child rows"
      - name: final
        when: "reporting_mode=FINAL — used after the shelter reaches CLOSED"
        difference: "counts only served meals, completed rotations and disbursed assistance, so identical child rows produce a smaller number than the provisional variant"

  - name: client_assistance_entitlement
    trigger: "any read of ClientCase.entitlement_cents"
    algorithm: dual_variant
    formula: |
      base_cents = min(HOUSEHOLD_CAP_CENTS, household_size * PER_PERSON_CENTS)

      # Variant base_schedule
      entitlement_cents = base_cents

      # Variant expedited_schedule
      entitlement_cents = min(EXPEDITED_CAP_CENTS,
                              EXPEDITED_FLAT_CENTS
                              + round_half_up(base_cents * EXPEDITED_MULTIPLIER_BPS / 10000))
    input_set: "Client.household_size; whether any ShelterRegistration of the case's client has functional_needs_flag == true; whether ClientCase.status == REOPENED"
    constants:
      PER_PERSON_CENTS: 30000
      HOUSEHOLD_CAP_CENTS: 120000
      EXPEDITED_FLAT_CENTS: 20000
      EXPEDITED_MULTIPLIER_BPS: 5000
      EXPEDITED_CAP_CENTS: 150000
    precision: "integer cents; round_half_up"
    variants:
      - name: base_schedule
        when: "no ShelterRegistration of the case's client has functional_needs_flag == true AND ClientCase.status != REOPENED"
        difference: "pure per-person schedule capped at HOUSEHOLD_CAP_CENTS"
      - name: expedited_schedule
        when: "any ShelterRegistration of the case's client has functional_needs_flag == true OR ClientCase.status == REOPENED"
        difference: "flat stipend plus half of the base schedule, capped at EXPEDITED_CAP_CENTS; for household_size 5 the two variants return 120000 and 80000 respectively for identical data"

  - name: duplication_of_benefits_offset
    trigger: "evaluation of an AssistanceRequest at the ELIGIBILITY_VERIFIED transition"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order — the offset is computed BEFORE the award, and the
      # award is then re-tested against MIN_ASSISTANCE_CENTS. Do not re-derive the
      # offset from the post-floor award.
      STEP 1: duplication_offset_cents =
                sum(estimated_value_cents for every Referral row with
                    client_case_id == request.client_case_id
                    AND assistance_type == request.assistance_type
                    AND status IN {SUBMITTED, ACCEPTED, COMPLETED})
      STEP 2: approved_amount_cents = max(0, requested_amount_cents - duplication_offset_cents)
      STEP 3: if 0 < approved_amount_cents < MIN_ASSISTANCE_CENTS:
                approved_amount_cents = 0 and the request transitions to DENIED
    input_set: "all non-declined, non-cancelled Referral rows of the same ClientCase and assistance_type, including referrals resolved after the assistance request was created"
    constants:
      MIN_ASSISTANCE_CENTS: 5000
    precision: "integer cents; no intermediate rounding"

  - name: volunteer_deployment_priority_score
    trigger: "GET /disaster-relief-operations/{id}/deployment-candidates"
    algorithm: weighted_scoring
    formula: |
      if Volunteer.credential_status != ACTIVE or Volunteer.deployment_availability != AVAILABLE:
        score = 0 and the volunteer is excluded from the candidate pool
      else:
        recency_bonus    = max(0, RECENCY_MAX_BONUS - floor(days_between(credential_refreshed_at, clock) / RECENCY_WINDOW_DAYS))
        distance_miles   = SAME_REGION_MILES if Volunteer.home_region_id == DisasterReliefOperation.region_id else CROSS_REGION_MILES
        distance_penalty = min(DISTANCE_MAX_PENALTY, floor(distance_miles / MILES_PER_PENALTY_UNIT))
        rotation_penalty = min(ROTATION_MAX_PENALTY, Volunteer.rotation_days_used_ytd * ROTATION_PENALTY_PER_DAY)
        role_match_bonus = ROLE_MATCH_BONUS if requested role_code IN Volunteer.qualified_role_codes else 0
        score = max(0, BASE_SCORE + recency_bonus - distance_penalty - rotation_penalty + role_match_bonus)
    input_set: "Volunteer rows in any region; the requested role_code; the operation's region_id; the logical clock"
    constants:
      BASE_SCORE: 100
      RECENCY_WINDOW_DAYS: 30
      RECENCY_MAX_BONUS: 30
      CROSS_REGION_MILES: 400
      SAME_REGION_MILES: 0
      MILES_PER_PENALTY_UNIT: 50
      DISTANCE_MAX_PENALTY: 25
      ROTATION_PENALTY_PER_DAY: 2
      ROTATION_MAX_PENALTY: 40
      ROLE_MATCH_BONUS: 20
    precision: "integer score; floor for every division"
    selector_policy:
      eligibility: "Volunteer.credential_status == ACTIVE AND Volunteer.deployment_availability == AVAILABLE"
      ranking: "score DESC"
      tie_break: "credential_refreshed_at ASC, then created_at ASC"
      empty_pool: "ERR_NO_ELIGIBLE_VOLUNTEER (409)"

  - name: feeding_line_cost
    trigger: "POST /shelter-operations/{id}/feeding-services"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round PER EVENT LINE first, then accumulate.
      line_raw_cents = meals_served * unit_cost_cents * (10000 + SUPPLY_SURCHARGE_BPS) / 10000
      line_cents     = round_half_up(line_raw_cents)
      ShelterOperation.feeding_cost_cents += line_cents
      ShelterOperation.meals_served_total += meals_served
      # The rejected alternative (sum raw line costs then round once at read time)
      # is NOT used and produces a different total for identical events.
    input_set: "one feeding-service event; meals_served and unit_cost_cents come from the request body"
    constants:
      SUPPLY_SURCHARGE_BPS: 625
    precision: "integer cents; round_half_up per line"

  - name: staffing_sufficiency
    trigger: "any change to ShelterOperation.registered_client_count or to the set of VolunteerDeployment rows for the shelter"
    algorithm: threshold
    formula: |
      required_volunteers = max(MIN_REQUIRED_VOLUNTEERS, ceil(registered_client_count / CLIENTS_PER_VOLUNTEER))
      staffed_volunteers  = count(VolunteerDeployment rows with shelter_operation_id == this shelter
                                  and status IN {ARRIVED, ON_SHIFT})
      staffing_sufficiency = round_half_up(min(1.0, staffed_volunteers / required_volunteers), 4)
    input_set: "ShelterOperation.registered_client_count; VolunteerDeployment rows for the shelter in ARRIVED or ON_SHIFT"
    constants:
      CLIENTS_PER_VOLUNTEER: 20
      MIN_REQUIRED_VOLUNTEERS: 1
      RESTRICTED_THRESHOLD: 0.60
    precision: "4 decimal places, round_half_up"
    variants:
      - name: restricted_gate
        when: "staffing_sufficiency < RESTRICTED_THRESHOLD"
        difference: "ShelterOperation.posture becomes RESTRICTED and new ShelterRegistration rows are rejected with ERR_SHELTER_RESTRICTED"
      - name: open_gate
        when: "staffing_sufficiency >= RESTRICTED_THRESHOLD"
        difference: "ShelterOperation.posture returns to OPEN; bed capacity is enforced by a separate check and never feeds this gate"

  - name: restricted_fund_balance
    trigger: "any read of FundPool.remaining_cents or DisasterReliefOperation.restricted_fund_balance_cents"
    algorithm: aggregation
    formula: |
      FundPool.committed_cents = sum(approved_amount_cents for AssistanceRequest rows with
                                     fund_pool_id == pool.id and status IN {APPROVED, CARD_ISSUED})
      FundPool.disbursed_cents = sum(approved_amount_cents for AssistanceRequest rows with
                                     fund_pool_id == pool.id and status == DISBURSED)
      FundPool.remaining_cents = total_received_cents - committed_cents - disbursed_cents

      DisasterReliefOperation.restricted_fund_balance_cents =
          sum(FundPool.remaining_cents for every FundPool with restriction_type != UNRESTRICTED
              that appears on at least one CostLedgerEntry row of this operation)
    input_set: "AssistanceRequest rows in APPROVED, CARD_ISSUED or DISBURSED status; CostLedgerEntry rows linking pools to operations"
    constants: {}
    precision: "integer cents"

  - name: travel_cost_estimate
    trigger: "POST /volunteer-deployments/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      miles = SAME_REGION_MILES if Volunteer.home_region_id == DisasterReliefOperation.region_id else CROSS_REGION_MILES
      if travel_mode == AIR:
        travel_cost_cents = AIR_BASE_CENTS + max(0, rotation_days - AIR_SURCHARGE_FREE_DAYS) * AIR_DAY_SURCHARGE_CENTS
      elif travel_mode == GROUND:
        travel_cost_cents = miles * GROUND_RATE_CENTS_PER_MILE
                            + max(0, rotation_days - GROUND_LODGING_FREE_DAYS) * GROUND_LODGING_PER_DAY_CENTS
      else:
        travel_cost_cents = SELF_CENTS
    input_set: "deployment.travel_mode, deployment.rotation_days, volunteer.home_region_id, operation.region_id"
    constants:
      AIR_BASE_CENTS: 45000
      AIR_DAY_SURCHARGE_CENTS: 2500
      AIR_SURCHARGE_FREE_DAYS: 14
      GROUND_RATE_CENTS_PER_MILE: 55
      GROUND_LODGING_PER_DAY_CENTS: 12000
      GROUND_LODGING_FREE_DAYS: 7
      SELF_CENTS: 0
      CROSS_REGION_MILES: 400
      SAME_REGION_MILES: 120
    precision: "integer cents; no rounding required (all inputs integral)"

  - name: blood_continuity_index
    trigger: "any read of Region.blood_continuity_index; the caller selects the variant with the `continuity_mode` query parameter"
    algorithm: dual_variant
    formula: |
      usable_units_in_window = sum(BloodDrive.usable_units for drives in the region with
                                   status == COMPLETED and scheduled_end_at in [clock - 42 days, clock])
      target_units_in_window = BASELINE_TARGET_UNITS
                             + sum(BloodDrive.target_units for drives in the region with status IN {PLANNED, ACTIVE})

      # Variant trailing (default)
      numerator = usable_units_in_window
      # Variant forward_looking
      numerator = usable_units_in_window
                + sum(BloodDrive.target_units for drives in the region with status == PLANNED)

      blood_continuity_index = round_half_up(numerator / target_units_in_window, 4)
      if blood_continuity_index < CRITICAL_THRESHOLD:   blood_continuity_status = CRITICAL
      elif blood_continuity_index < STRAINED_THRESHOLD: blood_continuity_status = STRAINED
      else:                                             blood_continuity_status = NORMAL
    input_set: "BloodDrive rows of the region; the logical clock fixes the trailing window"
    constants:
      WINDOW_DAYS: 42
      BASELINE_TARGET_UNITS: 600
      STRAINED_THRESHOLD: 0.80
      CRITICAL_THRESHOLD: 0.50
      DEFERRAL_LOSS_BPS: 700
    precision: "4 decimal places, round_half_up"
    variants:
      - name: trailing
        when: "continuity_mode=TRAILING (default) — counts only units already collected and released"
        difference: "numerator excludes PLANNED drives, so identical drive rows yield a lower index than the forward_looking variant"
      - name: forward_looking
        when: "continuity_mode=FORWARD_LOOKING — used when briefing emergency management on projected supply"
        difference: "numerator adds the target_units of every PLANNED drive, so identical drive rows yield a higher index than the trailing variant"

  - name: dormitory_bed_assignment
    trigger: "POST /shelter-operations/{id}/registrations when requested_bed_code is omitted"
    algorithm: selector_policy
    formula: |
      candidate_codes = {"B-" + zero_pad_3(n) for n in 1..ShelterSite.capacity_verified_beds}
      occupied_codes  = {r.dormitory_bed_code for ShelterRegistration rows r in this shelter
                         with r.status == REGISTERED
                         and (r.occupied_until_at IS NULL or r.occupied_until_at > requested.occupied_from_at)}
      buffered_codes  = {r.dormitory_bed_code for ShelterRegistration rows r in this shelter
                         with r.occupied_until_at IS NOT NULL
                         and r.occupied_until_at > requested.occupied_from_at - BED_TURNOVER_BUFFER_MINUTES
                         and r.occupied_until_at <= requested.occupied_from_at}
      eligible = candidate_codes - occupied_codes - buffered_codes
      rank eligible by (prior_registration_count ASC, bed_code ASC), where
        prior_registration_count = count of ShelterRegistration rows in this shelter with dormitory_bed_code == bed_code (any status)
      assign the first ranked bed; if eligible is empty -> ERR_NO_BED_AVAILABLE
    input_set: "ShelterSite.capacity_verified_beds; ShelterRegistration rows of the shelter; requested occupied_from_at"
    constants:
      BED_TURNOVER_BUFFER_MINUTES: 120
    precision: "no rounding; bed codes are 3-digit zero-padded strings"

  - name: redemption_window
    trigger: "POST /assistance-requests/{id}/issue-card"
    algorithm: threshold
    formula: |
      if any ShelterRegistration of the case's client is in a ShelterOperation with posture == RESTRICTED:
        window_days = RESTRICTED_WINDOW_DAYS
      else:
        window_days = STANDARD_WINDOW_DAYS
      redemption_deadline_at = issued_at + window_days days
    input_set: "ShelterRegistration rows of the case's client and the posture of their ShelterOperation at issuance time"
    constants:
      STANDARD_WINDOW_DAYS: 90
      RESTRICTED_WINDOW_DAYS: 45
    precision: "exact instant arithmetic on the logical clock"

  - name: travel_lead_days
    trigger: "system evaluation of the APPROVED -> IN_TRANSIT transition"
    algorithm: threshold
    formula: |
      AIR: travel_lead_days = 1
      GROUND: travel_lead_days = 2
      SELF: travel_lead_days = 0
    input_set: "deployment.travel_mode"
    constants:
      AIR_LEAD_DAYS: 1
      GROUND_LEAD_DAYS: 2
      SELF_LEAD_DAYS: 0
    precision: "whole days"

  - name: case_closure_eligible_at
    trigger: "system evaluation of the MONITORING -> CLOSED transition"
    algorithm: chronological
    formula: |
      last_referral_resolution = max(resolved_at over Referral rows of this case with
                                     status IN {COMPLETED, DECLINED, CANCELLED})
      last_disbursement        = max(updated_at over AssistanceRequest rows of this case with status == DISBURSED)
      closure_eligible_at = max(last_referral_resolution, last_disbursement) + CLOSURE_HOLD_DAYS days
    input_set: "terminal Referral rows and DISBURSED AssistanceRequest rows of the case; when neither exists the case never becomes closure-eligible"
    constants:
      CLOSURE_HOLD_DAYS: 14
    precision: "exact instant arithmetic on the logical clock"

  - name: region_volunteer_counts
    trigger: "any read of Region.available_volunteer_count or Region.deployed_volunteer_count"
    algorithm: aggregation
    formula: |
      available_volunteer_count = count(Volunteer rows with home_region_id == region.id
                                        and credential_status == ACTIVE
                                        and deployment_availability == AVAILABLE)
      deployed_volunteer_count  = count(Volunteer rows with home_region_id == region.id
                                        and deployment_availability == DEPLOYED)
    input_set: "Volunteer rows of the region"
    constants: {}
    precision: "integer count"

  - name: shelter_occupancy_counts
    trigger: "any read of ShelterOperation.occupied_beds, registered_client_count, reunification_pending_count, meals_served_total or health_service_count"
    algorithm: aggregation
    formula: |
      occupied_beds               = count(ShelterRegistration rows with shelter_operation_id == this
                                          and status == REGISTERED and dormitory_bed_code IS NOT NULL)
      registered_client_count     = count(ShelterRegistration rows with shelter_operation_id == this
                                          and status IN {REGISTERED, REUNIFIED})
      reunification_pending_count = count(ShelterRegistration rows with shelter_operation_id == this
                                          and reunification_status IN {PENDING, VERIFIED})
      meals_served_total          = running sum maintained by feeding_line_cost
      health_service_count        = running count maintained by health-service events
    input_set: "ShelterRegistration rows of the shelter; running counters maintained by the feeding and health service endpoints"
    constants: {}
    precision: "integer counts"

  - name: operation_open_shelter_count
    trigger: "any read of DisasterReliefOperation.open_shelter_count"
    algorithm: aggregation
    formula: |
      open_shelter_count = count(ShelterOperation rows with disaster_relief_operation_id == this
                                 and posture IN {OPEN, RESTRICTED})
    input_set: "ShelterOperation rows of the operation"
    constants: {}
    precision: "integer count"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must both be present and non-empty, and the request body must carry every required input field with the declared type and no undeclared fields"
    error_id: "ERR_MISSING_AUTH_HEADER / ERR_INVALID_REQUEST"
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "the acting X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "every path and body identifier must resolve, validated left to right along the path then in body order"
    error_id: "ERR_REGION_NOT_FOUND / ERR_OPERATION_NOT_FOUND / ERR_SHELTER_SITE_NOT_FOUND / ERR_SHELTER_OPERATION_NOT_FOUND / ERR_VOLUNTEER_NOT_FOUND / ERR_DEPLOYMENT_NOT_FOUND / ERR_CLIENT_NOT_FOUND / ERR_CASE_NOT_FOUND / ERR_REFERRAL_NOT_FOUND / ERR_FUND_POOL_NOT_FOUND / ERR_BLOOD_DRIVE_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "the target resource must be in a state that admits the requested transition; a terminal resource rejects every transition"
    error_id: "ERR_INVALID_STATE / ERR_ALREADY_TERMINAL / ERR_SHELTER_RESTRICTED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "credentialing and site-approval gates: Volunteer.credential_status must be ACTIVE, ShelterSite.agreement_status must be APPROVED, the latest inspection must be within INSPECTION_VALIDITY_DAYS of the clock, and a functional-needs client may only register at a site with functional_needs_support == true"
    error_id: "ERR_VOLUNTEER_NOT_CREDENTIALED / ERR_SITE_NOT_APPROVED / ERR_INSPECTION_STALE / ERR_FUNCTIONAL_NEEDS_UNSUPPORTED"
    http_status: 409
    applies_to: "POST /volunteer-deployments, POST /volunteer-deployments/{id}/approve, POST /shelter-operations/{id}/open, POST /shelter-operations/{id}/registrations"
  - priority: 6
    category: business_temporal
    check: "interval collisions: a volunteer may not hold two shift intervals that overlap, a dormitory bed may not be double-booked inside its turnover buffer, and a blood drive window may not overlap another non-cancelled drive at the same site"
    error_id: "ERR_SHIFT_OVERLAP / ERR_BED_OCCUPANCY_CONFLICT / ERR_BLOOD_DRIVE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /shift-assignments, POST /shelter-operations/{id}/registrations, POST /blood-drives"
  - priority: 7
    category: business_constraint
    check: "uniqueness and workload caps: incident_code and fund_code are unique, rotation_days <= 21 (enforced at creation), rotation_days_used_ytd + rotation_days <= 40 (enforced at approval), a deployment may hold at most 3 non-terminal shifts, and the issuer of a card must differ from its approver"
    error_id: "ERR_DUPLICATE_INCIDENT_CODE / ERR_DUPLICATE_FUND_CODE / ERR_ROTATION_TOO_LONG / ERR_ANNUAL_ROTATION_CAP / ERR_MAX_SHIFTS_EXCEEDED / ERR_SOD_VIOLATION"
    http_status: "409 for duplicates and caps; 403 for ERR_SOD_VIOLATION"
    applies_to: "POST /disaster-relief-operations, POST /fund-pools, POST /volunteer-deployments, POST /shift-assignments, POST /assistance-requests/{id}/issue-card"
  - priority: 8
    category: business_referential
    check: "cross-entity references must be authorized: a Referral agency_code must appear in the client's Region.authorized_agency_codes, a ShelterSite must sit in the same region as the DisasterReliefOperation it is activated for, and a referral is rejected when an existing non-cancelled referral of the same agency_code and assistance_type already exists for the case"
    error_id: "ERR_AGENCY_NOT_AUTHORIZED / ERR_REGION_MISMATCH / ERR_DUPLICATION_BLOCKED / ERR_DEPLOYMENT_SHELTER_MISMATCH"
    http_status: 409
    applies_to: "POST /client-cases/{id}/referrals, POST /shelter-operations, POST /referrals/{id}/resolve, POST /volunteer-deployments/{id}/approve"
  - priority: 9
    category: business_fiscal
    check: "capacity and donor-restricted money: approved_amount_cents must be >= MIN_ASSISTANCE_CENTS and <= FundPool.remaining_cents, the pool restriction_type must be compatible with the assistance_type, occupied_beds + 1 must not exceed ShelterSite.capacity_verified_beds, a bed must be assignable, a candidate volunteer must exist, and collected_units must not exceed target_units"
    error_id: "ERR_ASSISTANCE_BELOW_MINIMUM / ERR_INSUFFICIENT_FUNDS / ERR_POOL_RESTRICTION_MISMATCH / ERR_CAPACITY_EXCEEDED / ERR_NO_BED_AVAILABLE / ERR_NO_ELIGIBLE_VOLUNTEER / ERR_COLLECTION_TARGET_EXCEEDED"
    http_status: 409
    applies_to: "POST /assistance-requests/{id}/approve, POST /shelter-operations/{id}/registrations, GET /disaster-relief-operations/{id}/deployment-candidates, POST /blood-drives/{id}/collections"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Region reads ---
  - method: GET
    path: "/api/v1/regions/{id}"
    description: "Read a region, including derived volunteer counts and blood continuity posture"
    roles: [NationalHQAdmin, RegionalCoordinator, BloodServicesCoordinator]
    code: 200
    input: ["continuity_mode?"]
    output: Region
    side_effects: ["recomputes Region.available_volunteer_count, deployed_volunteer_count, blood_continuity_index, blood_continuity_status"]
  - method: GET
    path: "/api/v1/regions/{id}/disaster-relief-operations"
    description: "List the disaster relief operations declared in a region"
    roles: [NationalHQAdmin, RegionalCoordinator, BloodServicesCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: DisasterReliefOperation[]
    side_effects: []
  - method: GET
    path: "/api/v1/regions/{id}/shelter-sites"
    description: "List the shelter sites whose agreement belongs to a region"
    roles: [NationalHQAdmin, RegionalCoordinator, ShelterManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ShelterSite[]
    side_effects: []
  - method: GET
    path: "/api/v1/regions/{id}/volunteers"
    description: "List the volunteers whose home region is this region"
    roles: [NationalHQAdmin, RegionalCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Volunteer[]
    side_effects: []
  - method: GET
    path: "/api/v1/regions/{id}/fund-pools"
    description: "List the donor fund pools bound to a region"
    roles: [NationalHQAdmin, FinanceOfficer, RegionalCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: FundPool[]
    side_effects: []
  - method: GET
    path: "/api/v1/regions/{id}/blood-drives"
    description: "List the blood drives hosted in a region"
    roles: [NationalHQAdmin, BloodServicesCoordinator, RegionalCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: BloodDrive[]
    side_effects: []
  - method: GET
    path: "/api/v1/regions/{id}/clients"
    description: "List the clients whose region of residence is this region"
    roles: [NationalHQAdmin, RegionalCoordinator, Caseworker]
    code: 200
    input: ["limit?", "offset?"]
    output: Client[]
    side_effects: []

  # --- DisasterReliefOperation reads ---
  - method: GET
    path: "/api/v1/disaster-relief-operations/{id}"
    description: "Read an operation, including its phase, open shelter count and restricted fund balance"
    roles: [NationalHQAdmin, RegionalCoordinator, FinanceOfficer]
    code: 200
    input: []
    output: DisasterReliefOperation
    side_effects: ["recomputes DisasterReliefOperation.open_shelter_count and restricted_fund_balance_cents"]
  - method: GET
    path: "/api/v1/disaster-relief-operations/{id}/deployment-candidates"
    description: "Rank the volunteers eligible for deployment to this operation, highest score first"
    roles: [NationalHQAdmin, RegionalCoordinator]
    code: 200
    input: [role_code, "limit?", "offset?"]
    output: Volunteer[]
    side_effects: []
  # --- ShelterSite reads ---
  - method: GET
    path: "/api/v1/shelter-sites/{id}"
    description: "Read a shelter site with its agreement status and latest inspection results"
    roles: [NationalHQAdmin, RegionalCoordinator, ShelterManager]
    code: 200
    input: []
    output: ShelterSite
    side_effects: ["evaluates the APPROVED -> EXPIRED / SUSPENDED -> EXPIRED automatic transitions against the logical clock"]
  - method: GET
    path: "/api/v1/shelter-sites/{id}/shelter-operations"
    description: "List the shelter operations activated at this site"
    roles: [NationalHQAdmin, RegionalCoordinator, ShelterManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ShelterOperation[]
    side_effects: []

  # --- ShelterOperation reads ---
  - method: GET
    path: "/api/v1/shelter-operations/{id}"
    description: "Read a shelter operation, including posture, occupancy, staffing sufficiency and operational cost"
    roles: [NationalHQAdmin, RegionalCoordinator, ShelterManager, Caseworker, Volunteer]
    code: 200
    input: ["reporting_mode?"]
    output: ShelterOperation
    side_effects: ["recomputes occupied_beds, registered_client_count, reunification_pending_count, staffing_sufficiency and operational_cost_cents"]
  - method: GET
    path: "/api/v1/shelter-operations"
    description: "List shelter operations filtered by site or operation"
    roles: [NationalHQAdmin, RegionalCoordinator, ShelterManager]
    code: 200
