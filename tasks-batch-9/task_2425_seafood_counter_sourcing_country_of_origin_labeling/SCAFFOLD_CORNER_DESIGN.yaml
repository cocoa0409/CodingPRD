          trigger:
            - call: "POST /seafood-ops/simp-documents"
              payload: { lot_id: "${lot_id}", harvesting_vessel_name: "Estrella del Golfo", harvest_date: "2026-07-20T00:00:00Z", landing_date: "2026-07-22T00:00:00Z", chain_of_custody_ref: "COC-55210" }
              as: SupplierRep
              as_user_id: "${supplier_two}"
              captures: { e_supplier_scope: $.data.error_id }
            - call: "POST /seafood-ops/simp-documents"
              payload: { lot_id: "${lot_id}", harvesting_vessel_name: "Estrella del Golfo", harvest_date: "2026-07-20T00:00:00Z", landing_date: "2026-07-22T00:00:00Z", chain_of_custody_ref: "COC-55210" }
              as: SupplierRep
              as_user_id: "${supplier_one}"
              captures: { doc_id: $.data.id }
            - call: "POST /seafood-ops/simp-documents/${doc_id}/submit"
              payload: {}
              as: SupplierRep
              as_user_id: "${supplier_one}"
            - call: "POST /seafood-ops/simp-documents/${doc_id}/review"
              payload: { decision: "ACCEPT", review_note: "documentation complete" }
              as: ComplianceOfficer
              as_user_id: "officer-simp-3"
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_b}"
              captures: { e_counter_scope: $.data.error_id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_a}"
          assert:
            - "trigger call 1 returns HTTP 403 with ${e_supplier_scope} == ERR_SUPPLIER_SCOPE_FORBIDDEN"
            - "trigger call 2 returns HTTP 201 with SimpDocument.${doc_id}.status == DRAFT"
            - "trigger call 5 returns HTTP 403 with ${e_counter_scope} == ERR_COUNTER_SCOPE_FORBIDDEN"
            - "after trigger call 5: SupplierLot.${lot_id}.intake_status == RECEIVED and case_slot == null"
