  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails 400 before any role, existence, or state check runs (priority 1 beats all)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /revrec/customers"
              payload: { legal_name: "NoHdr Co", external_ref: "NOHDR-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              headers: "omit X-User-ID and X-User-Role for this call"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http 400; nothing persisted"

      - name: estimate_approve_by_proposer_returns_sod_violation
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]", state_machines.VariableConsiderationEstimate.PROPOSED_to_APPROVED]
        distinguishing_aspect: "Segregation of duties on estimates (distinct from the modification SoD in §1.8): X-User-ID dual-1 proposes and the same X-User-ID dual-1, acting as RevenueManager, approves -> 409 ERR_SOD_VIOLATION; the estimate stays PROPOSED."
        test_recipe:
          setup: ["customer; DRAFT contract fixed 0 STANDARD; estimate ML 100000 PROPOSED by X-User-ID dual-1"]
          setup_api_calls:
            - call: "POST /revrec/customers"
              payload: { legal_name: "SoDE Co", external_ref: "SODE-1" }
              as: RevenueAccountant
              as_user_id: "dual-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-SODE", signed_date: "2026-05-20", fixed_consideration_cents: 0, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "dual-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/vc-estimates"
              payload: { method: "MOST_LIKELY", scenarios: [ { probability_bps: 10000, amount_cents: 100000 } ] }
              as: RevenueAccountant
              as_user_id: "dual-1"
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /revrec/vc-estimates/${e_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "dual-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SOD_VIOLATION, http 409 (approver X-User-ID equals proposed_by_user_id)"
            - "VariableConsiderationEstimate.${e_id} remains PROPOSED"

