              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam Senior", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Prepay Member", email: "prepay1@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/prepay"
              payload: { amount_cents: 10000 }
              as: FrontDesk
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "PREPAY" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: { arrival_status: "ON_TIME" }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/settle"
              payload: { tip_cents: 0 }
              as: FinanceManager
          assert:
            - "Appointment.${appt_id}.service_charge_cents == 6000"
            - "Member.${mem_id}.prepay_balance_cents == 4000"
            - "Stylist.${sty_id}.earned_commission_cents == 2700"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # (1) state (p6) vs business_temporal (p8): NOT_BOOKED beats chair overlap path
      - name: ppv_state_vs_temporal_on_checkin_vs_booking
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_APPOINTMENT_NOT_CANCELLABLE]
          - errors[ERR_CHAIR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          A cancel on a COMPLETED appointment violates state (p6 -> ERR_APPOINTMENT_NOT_CANCELLABLE)
          while a fresh booking on its still-occupied chair would violate temporal (p8 ->
          ERR_CHAIR_DOUBLE_BOOKED). For a cancel request on the completed appointment, the
          state check (p6) fires; the temporal pair is the distinct lower-priority category.
        test_recipe:
          setup:
            - "A COMPLETED appointment (lifecycle COMPLETED), not cancellable."
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam Senior", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Walk In", email: "walkin4@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: { arrival_status: "ON_TIME" }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_APPOINTMENT_NOT_CANCELLABLE"
            - "http_status == 409"

      # (2) existence (p3) vs business_fiscal (p13): NOT_FOUND beats stock on retail sale
      - name: ppv_existence_vs_fiscal_on_retail_sale
        grounds:
          - validations[priority=3]
          - validations[priority=13]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          A retail sale that names a non-existent product_id AND an over-stock quantity
          fails existence (p3 -> ERR_PRODUCT_NOT_FOUND, 404), NOT fiscal (p13 ->
          ERR_INSUFFICIENT_STOCK, 409) — different error-category pair (existence vs
          business_fiscal) than instance (1).
        test_recipe:
          setup:
            - "A registered member exists; no product with the referenced id exists."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Buyer", email: "buyer1@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /retail-sales"
              payload: { product_id: "00000000-0000-4000-8000-000000000999", member_id: "${mem_id}", quantity: 9999 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PRODUCT_NOT_FOUND"
            - "http_status == 404"

