  # ==================================================== cross-cutting complexity layers
  - section: complexity_layers
    instances:
      - name: occ_offer_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offer-terms-patch-stale-version]", "errors[ERR_STALE_OFFER_VERSION]"]
        distinguishing_aspect: "Second PATCH carrying the pre-mutation version 1 is rejected with 412 ERR_STALE_OFFER_VERSION; the first PATCH had advanced Offer.version to 2."
        test_recipe:
          setup: ["OPEN requisition; DRAFT offer (version 1)"]
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand OC", email: "cand.oc@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 18000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "PATCH /api/offers/${offer_id}"
              payload: { expected_offer_version: "${v1}", base_cents: 18500000 }
              as: Recruiter
              as_user_id: rec-1
              captures: { v2: $.data.version }
            - call: "PATCH /api/offers/${offer_id}"
              payload: { expected_offer_version: "${v1}", base_cents: 18600000 }
              as: Recruiter
              as_user_id: rec-1
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH -> 200, version == 2, base_cents == 18500000"
            - "second PATCH with stale expected version -> http 412 ERR_STALE_OFFER_VERSION; base_cents remains 18500000"

      - name: occ_requisition_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[requisition-patch-stale-version]", "errors[ERR_STALE_REQUISITION_VERSION]"]
        distinguishing_aspect: "Requisition DRAFT edit with a stale expected_requisition_version is rejected with 412 ERR_STALE_REQUISITION_VERSION; fresh version edits chain 1 -> 2 -> 3."
        test_recipe:
          setup: ["DRAFT requisition (version 1)"]
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Original", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id, rv1: $.data.version }
          trigger:
            - call: "PATCH /api/requisitions/${req_id}"
              payload: { expected_requisition_version: "${rv1}", title: "Second" }
              as: HiringManager
              as_user_id: hm-1
              captures: { rv2: $.data.version }
            - call: "PATCH /api/requisitions/${req_id}"
              payload: { expected_requisition_version: "${rv1}", title: "Third" }
              as: HiringManager
              as_user_id: hm-1
              captures: { err: $.data.error_id }
            - call: "PATCH /api/requisitions/${req_id}"
              payload: { expected_requisition_version: "${rv2}", title: "Third" }
              as: HiringManager
              as_user_id: hm-1
              captures: { rv3: $.data.version }
          assert:
            - "stale edit -> 412 ERR_STALE_REQUISITION_VERSION"
            - "versions advance 1 -> 2 -> 3 on fresh edits; final title == 'Third'"

      - name: cascading_side_effects_deep_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.Offer.ACCEPTED_to_HIRED, state_machines.Requisition.OPEN_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / hire_headcount_autoclose_withdrawal_chain
          rationale: "Three-link cascade (check CLEARED -> HIRED -> CLOSED -> sibling WITHDRAWN) asserted end-to-end there."

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: [calculations.offer_cost, calculations.peer_equity_position, calculations.clawback_schedule]
        excluded_because:
          difficulty_instance: dual_variant_calc / offer_cost_cash_vs_fully_loaded_divergence
          rationale: "Variant divergence asserted for all three dual-variant calculations across the three Rule-1 instances."

      - name: rate_threshold_layer_coverage
        claim_type: rate_threshold_triggers
        grounds: [calculations.band_classification, calculations.concession_authority, calculations.expiration_check]
        excluded_because:
          difficulty_instance: boundary_precision_check / band_boundary_at_salary_max_and_tolerance
          rationale: "Threshold boundary semantics (<= vs >) asserted there, plus concession_cap_boundary_inclusive and expiration_exactly_at_expires_at."

