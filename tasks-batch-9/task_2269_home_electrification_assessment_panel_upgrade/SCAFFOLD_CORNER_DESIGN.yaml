            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm2}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1050000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1050000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { err_rejected: $.data.error_id }
          assert:
            - "Trigger call 1 returns 409 with data.error_id == \"ERR_ASSESSMENT_NOT_APPROVED\" while Assessment.${asm1}.status == PENDING_REVIEW"
            - "Trigger call 3 returns 201 once the same assessment is APPROVED — the only thing that changed is the assessment status"
            - "Trigger call 6 returns 409 with data.error_id == \"ERR_ASSESSMENT_NOT_APPROVED\" because filing ${asm2} moved ${asm1} to SUPERSEDED"
            - "Trigger call 8 returns 409 with data.error_id == \"ERR_ASSESSMENT_NOT_APPROVED\" for the REJECTED ${asm2}"
            - "Exactly one RebateProject exists for ${hh_id} at the end (GET /rebate-projects?household_id=${hh_id} returns total_count == 1 containing ${proj_id})"
            - "Assessment.${asm2}.status == REJECTED and Assessment.${asm1}.status == SUPERSEDED — the successfully created ${proj_id} keeps its own pinned lines regardless"

      - name: installation_and_extension_after_expiry_but_before_the_sweep
        claim_type: error_triggerability
        grounds:
          - errors.ERR_RESERVATION_EXPIRED
          - validations.priority_8
          - validations.priority_18
          - calculations.reservation_expiry_sweep
        distinguishing_aspect: |
          Expiry is effective by CLOCK, not by sweep: one day past expires_at
          and with no sweep run, the Reservation row still reads RESERVED yet
          both installation and extension are refused with 409
