              captures: { i1: $.data.id }
          assert:
            - "${is_after_verify} == INSTALLED"
            - "${vs_after_verify} == PREFUNCTIONAL_VERIFIED"
            - "${is_after_startup} == STARTED_UP"
            - "${vs_after_startup} == PREFUNCTIONAL_VERIFIED"
            - "EquipmentUnit.${e1}.install_status == STARTED_UP after the blocking issue"
            - "EquipmentUnit.${e1}.verification_status == UNVERIFIED after the blocking issue"
            - "EquipmentUnit.${e1}.blocking_issue_count == 1"
