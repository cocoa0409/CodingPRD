            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cr4}", account_number: "A-R004", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ar4: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cr4}", name: "RBAC Ben4", bank_name: "RBACBank4", account_number: "B-R004", country_code: "US" }, as: WireOperator, captures: { br4: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-10-01" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ar4}", beneficiary_id: "${br4}", amount_cents: 300000, method: "Fedwire", purpose: "rbac sanctions" }, as: WireOperator, as_user_id: "op-1", captures: { wr4: $.data.id } }
            - { call: "POST /wire-ops/wires/${wr4}/submit", payload: { business_date: "2026-10-01" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/_screening/simulate", payload: { wire_id: "${wr4}", matched_list: "OFAC_SDN", matched_party: "RBAC Ben4", match_score: 82 }, as: SanctionsScreener, captures: { hr4: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/sanctions-hits/${hr4}/release", payload: { rationale: "operator overreach" }, as: WireOperator, as_user_id: "op-1", captures: { r4_err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (${r4_err}); SanctionsHit.${hr4} remains OPEN"

      - name: fraud_hold_place_forbidden_for_operator
        claim_type: role_denied
        grounds: ["roles[FraudAnalyst]", "endpoints[POST /wire-ops/wires/{wireId}/fraud-holds]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Only FraudAnalyst places fraud holds: WireOperator is denied with 403."
