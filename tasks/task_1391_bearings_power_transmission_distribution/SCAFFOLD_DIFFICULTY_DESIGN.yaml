# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Bearings & Power-Transmission Distribution
# Nine Difficulty Rules x 2 instances each. Grounds reference SCAFFOLD.yaml
# §1.1-§1.7 elements only. All setup chains drive empty-DB -> precondition
# using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_line_order_date_vs_ship_date_price
        grounds:
          - calculations.contract_lag_unit_price
          - state_machines.OrderLine.ALLOCATED_to_SHIPPED
          - entities.SalesOrder.fields.price_variant
        distinguishing_aspect: |
          Identical product, quantity, customer, and catalog data produce a
          10000-cent vs 12000-cent unit price solely because ORDER_DATE anchors
          pricing at order creation (before the 2026-08-15 price-file increase)
          while SHIP_DATE anchors at the ship instant (after it) — the
          dual-variant divergence lives in the SalesOrder/OrderLine domain.
        test_recipe:
          setup:
            - "Product BRG-6205 list 10000; branch ATL-01 (tz 0, cutoff 14); customer with ample credit; stock on_hand 100"
            - "Order o1 (ORDER_DATE) created 2026-08-10 with line l1 qty 2, confirmed, reserved, allocated"
            - "Price file 10000 -> 12000 effective 2026-08-15T00:00:00Z published; clock advanced past it (EFFECTIVE)"
            - "Order o2 (SHIP_DATE) created 2026-08-16 with line l2 qty 2, confirmed (provisional 12000), reserved, allocated"
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BRG-6205", description: "Deep groove ball bearing", family: "BEARING", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /motion/branches"
              payload: { code: "ATL-01", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Peach State Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 100, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", price_variant: "ORDER_DATE" }
              as: CounterSalesRep
              captures: { o1_id: $.data.id }
            - call: "POST /motion/orders/${o1_id}/lines"
              payload: { product_id: "${p_id}", qty: 2 }
              as: CounterSalesRep
              captures: { l1_id: $.data.id }
            - call: "POST /motion/orders/${o1_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l1_id}/reserve"
              payload: { branch_stock_id: "${bs_id}", qty: 2 }
              as: CounterSalesRep
              captures: { r1_id: $.data.id }
            - call: "POST /motion/order-lines/${l1_id}/allocate"
              payload: {}
              as: BranchManager
            - call: "POST /motion/price-files"
              payload: { product_id: "${p_id}", new_list_price_cents: 12000, effective_at: "2026-08-15T00:00:00Z", expected_product_version: "${p_v}" }
              as: PricingAnalyst
              captures: { pf_id: $.data.id }
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", price_variant: "SHIP_DATE" }
              as: CounterSalesRep
              captures: { o2_id: $.data.id }
            - call: "POST /motion/orders/${o2_id}/lines"
              payload: { product_id: "${p_id}", qty: 2 }
              as: CounterSalesRep
              captures: { l2_id: $.data.id }
            - call: "POST /motion/orders/${o2_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l2_id}/reserve"
              payload: { branch_stock_id: "${bs_id}", qty: 2 }
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l2_id}/allocate"
              payload: {}
              as: BranchManager
          trigger:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/order-lines/${l1_id}/ship"
              payload: {}
              as: BranchManager
            - call: "POST /motion/order-lines/${l2_id}/ship"
              payload: {}
              as: BranchManager
          assert:
            - "OrderLine.${l1_id}.unit_price_cents == 10000 (ORDER_DATE locked at 2026-08-10 anchor, before the increase)"
            - "OrderLine.${l1_id}.price_protection_applied == false (no contract on this customer)"
            - "OrderLine.${l2_id}.unit_price_cents == 12000 (SHIP_DATE final anchor 2026-08-20, after the 2026-08-15 increase)"
            - "SalesOrder.${o1_id}.total_cents == 20000"
            - "SalesOrder.${o2_id}.total_cents == 24000"
            - "SalesOrder.${o1_id}.fulfillment_status == SHIPPED and SalesOrder.${o2_id}.fulfillment_status == SHIPPED"

      - name: consignment_fifo_vs_monthly_snapshot_billing
        grounds:
          - calculations.consignment_consumption_billing
          - state_machines.ConsignmentConsumption.REPORTED_to_INVOICED
          - entities.ConsignmentAgreement.fields.billing_variant
        distinguishing_aspect: |
          Identical consumption quantities and identical creation-time prices
          bill at 12000 vs 15000 cents solely because CONSUMPTION_FIFO bills the
          agreement-pinned price while MONTHLY_SNAPSHOT bills the list price
          effective at month-end of the report month — the dual-variant
          divergence lives in the ConsignmentAgreement/ConsignmentConsumption
          domain, a different entity domain than the order-pricing variant pair.
        test_recipe:
          setup:
            - "Products PA and PB both list 4000 at 2026-08-05; branch; customer; stock on_hand 500 for each"
            - "Agreement A1 (PA, CONSUMPTION_FIFO, consigned 10, pinned 4000) and A2 (PB, MONTHLY_SNAPSHOT, consigned 10, pinned 4000)"
            - "Price files PA 4000->5000 and PB 4000->5000 both EFFECTIVE 2026-08-20"
            - "At 2026-08-22, customer reports qty-3 consumption on each agreement (both REPORTED)"
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BRG-6308", description: "Ball bearing A", family: "BEARING", list_price_cents: 4000 }
              as: PricingAnalyst
              captures: { pa_id: $.data.id, pa_v: $.data.version }
            - call: "POST /motion/products"
              payload: { sku: "BRG-6410", description: "Ball bearing B", family: "BEARING", list_price_cents: 4000 }
              as: PricingAnalyst
              captures: { pb_id: $.data.id, pb_v: $.data.version }
            - call: "POST /motion/branches"
              payload: { code: "DAL-02", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Lone Star Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${pa_id}", on_hand_qty: 500, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bsa_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${pb_id}", on_hand_qty: 500, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bsb_id: $.data.id }
            - call: "POST /motion/consignment-agreements"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", product_id: "${pa_id}", consigned_qty: 10, billing_variant: "CONSUMPTION_FIFO" }
              as: ContractAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /motion/consignment-agreements"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", product_id: "${pb_id}", consigned_qty: 10, billing_variant: "MONTHLY_SNAPSHOT" }
              as: ContractAdministrator
              captures: { a2_id: $.data.id }
            - call: "POST /motion/price-files"
              payload: { product_id: "${pa_id}", new_list_price_cents: 5000, effective_at: "2026-08-20T00:00:00Z", expected_product_version: "${pa_v}" }
              as: PricingAnalyst
            - call: "POST /motion/price-files"
              payload: { product_id: "${pb_id}", new_list_price_cents: 5000, effective_at: "2026-08-20T00:00:00Z", expected_product_version: "${pb_v}" }
              as: PricingAnalyst
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/consignment-agreements/${a1_id}/consumptions"
              payload: { qty: 3 }
              as: CustomerPlant
              as_user_id: "${c_id}"
              captures: { cons1_id: $.data.id }
            - call: "POST /motion/consignment-agreements/${a2_id}/consumptions"
              payload: { qty: 3 }
              as: CustomerPlant
              as_user_id: "${c_id}"
              captures: { cons2_id: $.data.id }
          trigger:
            - call: "POST /motion/consignment-consumptions/${cons1_id}/invoice"
              payload: {}
              as: BranchManager
            - call: "POST /motion/consignment-consumptions/${cons2_id}/invoice"
              payload: {}
              as: BranchManager
          assert:
            - "ConsignmentConsumption.${cons1_id}.unit_price_cents == 4000 (CONSUMPTION_FIFO: agreement-pinned price)"
            - "ConsignmentConsumption.${cons1_id}.billed_amount_cents == 12000"
            - "ConsignmentConsumption.${cons2_id}.unit_price_cents == 5000 (MONTHLY_SNAPSHOT: list price effective at 2026-08-31 month-end == 5000)"
            - "ConsignmentConsumption.${cons2_id}.billed_amount_cents == 15000"
            - "CustomerAccount.${c_id}.open_receivables_cents == 27000"
            - "ConsignmentAgreement.${a1_id}.remaining_qty == 7 and ConsignmentAgreement.${a2_id}.remaining_qty == 7"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: expedite_fee_stacking_with_lag_protection
        grounds:
          - calculations.expedite_fee_stacking
          - calculations.contract_lag_unit_price
          - calculations.order_total_aggregation
        distinguishing_aspect: |
          Mode (a): a >= 3-input non-linear formula — tier RUSH percentage (8%)
          applied to the lag-protected amount (contract 10% off the PRE-increase
          10000 list, not the post-increase 12000), then the after-cutoff
          1.25 multiplier applied to the percentage portion only, then the
          2500-cent tier minimum clamp — interacts with contract-lag price
          protection so the fee base itself depends on the protection branch.
        test_recipe:
          setup:
            - "Product list 10000; customer contract LIST_LESS 10% with lag_protection_days 30, window [2026-01-01, 2027-01-01)"
            - "Price file 10000 -> 12000 EFFECTIVE 2026-08-15; branch cutoff hour 14 (tz 0)"
            - "Order (ORDER_DATE) created 2026-08-16T15:00:00Z (local hour 15 >= cutoff 14) with line qty 10, tier RUSH"
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BRG-6206", description: "Cylindrical roller bearing", family: "BEARING", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /motion/branches"
              payload: { code: "CHI-03", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Windy City Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c_id}", family: "BEARING", price_basis: "LIST_LESS", discount_pct: 0.10, lag_protection_days: 30, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { ct_id: $.data.id }
            - call: "POST /motion/contracts/${ct_id}/activate"
              payload: {}
              as: ContractAdministrator
            - call: "POST /motion/price-files"
              payload: { product_id: "${p_id}", new_list_price_cents: 12000, effective_at: "2026-08-15T00:00:00Z", expected_product_version: "${p_v}" }
              as: PricingAnalyst
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T15:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", price_variant: "ORDER_DATE" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 10, expedite_tier: "RUSH" }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
          assert:
            - "OrderLine.${l_id}.unit_price_cents == 9000 (protected: round(10000 * 0.9); unprotected would be round(12000 * 0.9) == 10800)"
            - "OrderLine.${l_id}.price_protection_applied == true"
            - "OrderLine.${l_id}.expedite_fee_cents == 9000 (RUSH 8% of protected 90000 == 7200; after-cutoff x1.25 -> 9000; >= 2500 floor so fee == 9000)"
            - "OrderLine.${l_id}.line_total_cents == 99000"
            - "SalesOrder.${o_id}.subtotal_cents == 90000 and SalesOrder.${o_id}.expedite_fees_cents == 9000 and SalesOrder.${o_id}.total_cents == 99000"
            - "SalesOrder.${o_id}.fulfillment_status == CONFIRMED"

      - name: per_line_rounding_then_sum_order_total
        grounds:
          - calculations.order_total_aggregation
          - calculations.contract_lag_unit_price
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — unit price
          round(3333 * 0.9) == 3000 per line THEN multiplied/summed yields
          subtotal 10000, whereas sum-then-round (2999.7 * 3 + 999.9 * 1 then
          round) yields 9999; the scaffold pins per-line rounding first, a
          different combinatorial mode than instance
          expedite_fee_stacking_with_lag_protection.
        test_recipe:
          setup:
            - "Products P1 list 3333 and P2 list 1111, family BEARING; contract LIST_LESS 10% (no lag), window covering clock"
            - "Order with line1 (P1 qty 3) and line2 (P2 qty 1), tier NONE"
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BLT-A100", description: "V-belt A100", family: "BEARING", list_price_cents: 3333 }
              as: PricingAnalyst
              captures: { p1_id: $.data.id }
            - call: "POST /motion/products"
              payload: { sku: "BLT-B50", description: "V-belt B50", family: "BEARING", list_price_cents: 1111 }
              as: PricingAnalyst
              captures: { p2_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "SEA-04", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Emerald City Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c_id}", family: "BEARING", price_basis: "LIST_LESS", discount_pct: 0.10, lag_protection_days: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { ct_id: $.data.id }
            - call: "POST /motion/contracts/${ct_id}/activate"
              payload: {}
              as: ContractAdministrator
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p1_id}", qty: 3 }
              as: CounterSalesRep
              captures: { l1_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p2_id}", qty: 1 }
              as: CounterSalesRep
              captures: { l2_id: $.data.id }
          trigger:
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
          assert:
            - "OrderLine.${l1_id}.unit_price_cents == 3000 (round_half_up(3333 * 0.9) == round_half_up(2999.7) == 3000)"
            - "OrderLine.${l1_id}.line_total_cents == 9000"
            - "OrderLine.${l2_id}.unit_price_cents == 1000 (round_half_up(1111 * 0.9) == round_half_up(999.9) == 1000)"
            - "OrderLine.${l2_id}.line_total_cents == 1000"
            - "SalesOrder.${o_id}.subtotal_cents == 10000 (per-line rounded then summed; sum-then-round would give 9999)"
            - "SalesOrder.${o_id}.total_cents == 10000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: sales_order_parallel_fulfillment_and_billing_axes
        grounds:
          - state_machines.SalesOrder
          - entities.SalesOrder.fields.fulfillment_status
          - entities.SalesOrder.fields.billing_status
        distinguishing_aspect: |
          SalesOrder carries two independent state axes on one row: fulfillment
          (DRAFT->...->SHIPPED->CLOSED) and billing (UNBILLED->INVOICED->
          PARTIALLY_PAID->PAID). Shipping does not advance billing, and partial
          payment does not touch fulfillment — the axes evolve orthogonally and
          only meet at the close gate (SHIPPED && PAID).
        test_recipe:
          setup:
            - "Product list 10000; branch; customer ample credit; stock on_hand 10"
            - "Order (ORDER_DATE) with line qty 1, confirmed (total 10000), reserved, allocated"
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "GRX-075", description: "Gearbox 075", family: "GEARBOX", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "NYC-05", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Hudson Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 10, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l_id}/reserve"
              payload: { branch_stock_id: "${bs_id}", qty: 1 }
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l_id}/allocate"
              payload: {}
              as: BranchManager
          trigger:
            - call: "POST /motion/order-lines/${l_id}/ship"
              payload: {}
              as: BranchManager
              captures: { l_ship: $.data.sourcing_status }
            - call: "POST /motion/orders/${o_id}/invoice"
              payload: {}
              as: BranchManager
            - call: "POST /motion/orders/${o_id}/record-payment"
              payload: { amount_cents: 4000 }
              as: BranchManager
            - call: "POST /motion/orders/${o_id}/record-payment"
              payload: { amount_cents: 6000 }
              as: BranchManager
            - call: "POST /motion/orders/${o_id}/close"
              payload: {}
              as: BranchManager
          assert:
            - "After ship: SalesOrder.${o_id}.fulfillment_status == SHIPPED while billing_status == UNBILLED (ship does not bill)"
            - "After invoice: billing_status == INVOICED while fulfillment_status == SHIPPED (invoice does not move fulfillment)"
            - "After payment 4000: billing_status == PARTIALLY_PAID, paid_cents == 4000, fulfillment_status still SHIPPED"
            - "After payment 6000: billing_status == PAID, paid_cents == 10000"
            - "CustomerAccount.${c_id}.open_receivables_cents == 0 after full payment"
            - "Close succeeds only now: final fulfillment_status == CLOSED"

      - name: warranty_claim_analysis_info_loop_cycle
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_UNDER_ANALYSIS
          - state_machines.WarrantyClaim.UNDER_ANALYSIS_to_SUBMITTED
          - state_machines.WarrantyClaim.UNDER_ANALYSIS_to_APPROVED
        distinguishing_aspect: |
          WarrantyClaim is cyclic: SUBMITTED -> UNDER_ANALYSIS -> SUBMITTED ->
          UNDER_ANALYSIS -> APPROVED traverses the info-request loop and
          re-enters a prior state, proving the machine is not a linear pipeline
          — a different entity and a different non-linear shape (cycle) than the
          SalesOrder parallel-axes instance.
        test_recipe:
          setup:
            - "Shipped order line (unit 10000, qty 2) for the customer"
            - "Claim filed by WarrantyAnalyst wa-1 (product, order line, FATIGUE, 100 hours, qty 1) in SUBMITTED"
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-UC210", description: "Insert bearing UC210", family: "BEARING", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "LAX-06", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Bay Area Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 10, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
