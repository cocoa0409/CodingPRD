    side_effects: []
  - method: GET
    path: "/auditors/{id}"
    description: "Read an auditor including status and reliability_score"
    roles: [BrandAdmin, Auditor, CalibrationReviewer]
    code: 200
    input: []
    output: Auditor
    side_effects: []
  - method: POST
    path: "/auditors/{id}/certify"
    description: "Certify or re-certify an auditor; gated on the CERTIFICATION_REVIEW reliability variant"
    roles: [BrandAdmin]
    code: 200
    input: []
    output: Auditor
    side_effects:
      - "sets status to CERTIFIED, sets certification_period_start to the logical clock, clears suspension_reason"
  - method: POST
    path: "/auditors/{id}/suspend"
