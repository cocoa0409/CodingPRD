            - "sweep 2 at 2026-08-11T14:00:00Z — the captured ${rt_codes2} == [UNFILED_INJURY_PAPERWORK], ${rt_status2} == GRACE and ${rt_grace2} == 2026-08-12T14:00:00Z; Team.consecutive_noncompliant_checks == 1"
            - "sweep 3 at 2026-08-12T13:59:59Z — the captured ${rt_status3} == GRACE with ${rt_grace3} still 2026-08-12T14:00:00Z and consecutive_noncompliant_checks still 1"
            - "sweep 4 at 2026-08-12T14:00:00Z — the captured ${rt_status4} == NON_COMPLIANT with ${rt_grace4} == null and consecutive_noncompliant_checks == 2; the boundary instant already counts as expired"
            - "sweep 5 at the same instant — the captured ${rt_status5} == TRANSACTION_FROZEN because 2 + 1 >= FREEZE_AFTER_CONSECUTIVE_CHECKS 3, and consecutive_noncompliant_checks == 3"
            - "GET /teams/${rt_team_id}/compliance-checks returns total_count == 5 and every row has active_roster_count == 1 and provisional_cap_committed_cents == 83333333"
            - "InjuryDesignation.${rt_inj_id}.status == PENDING_PAPERWORK throughout — no sweep repairs the gap"
            - "Player.${rt_p_id}.roster_designation == ACTIVE and Team.${rt_team_id}.compliance_status == TRANSACTION_FROZEN"

      - name: closing_the_paperwork_gap_resets_the_posture_and_the_counter
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Team.compliance_status.GRACE_to_COMPLIANT
          - calculations.team_compliance_evaluation
          - entities.Team.fields.consecutive_noncompliant_checks
        distinguishing_aspect: "The reset arm of the same ladder: filing the missing paperwork is still permitted in GRACE, and the next sweep finds an empty violation list, so the club returns to COMPLIANT with grace_expires_at cleared and consecutive_noncompliant_checks back to 0 rather than merely holding at GRACE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (cap 500000000) has Ray Alder ACTIVE on an APPROVED 3-year deal and an INJURED_RESERVE designation created at 2026-08-10T14:00:00Z left in PENDING_PAPERWORK."
            - "A sweep at 2026-08-11T14:00:00Z has already put the club in GRACE with grace_expires_at 2026-08-12T14:00:00Z and consecutive_noncompliant_checks 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { rs_team_id: $.data.id, rs_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { rs_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${rs_team_id}", player_id: "${rs_p_id}", transaction_type: "SIGNING", expected_team_version: "${rs_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${rs_team_id}"
              captures: { rs_txn_id: $.data.id }
            - call: "POST /physical-exams"
              payload: { player_id: "${rs_p_id}", team_id: "${rs_team_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${rs_txn_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${rs_team_id}"
              captures: { rs_ex_id: $.data.id }
            - call: "POST /physical-exams/${rs_ex_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${rs_team_id}"
            - call: "POST /transactions/${rs_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${rs_team_id}"
            - call: "POST /transactions/${rs_txn_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /injury-designations"
              payload: { player_id: "${rs_p_id}", team_id: "${rs_team_id}", designation_type: "INJURED_RESERVE" }
              as: TeamMedicalOfficer
              as_user_id: "${rs_team_id}"
              captures: { rs_inj_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /compliance-checks/run"
              payload: { team_id: "${rs_team_id}" }
              as: LeagueOfficer
              captures: { rs_status1: $.data.resulting_compliance_status, rs_grace1: $.data.grace_expires_at }
          trigger:
            - call: "POST /injury-designations/${rs_inj_id}/file-paperwork"
              payload: { paperwork_reference: "IR-2026-0031" }
              as: TeamMedicalOfficer
              as_user_id: "${rs_team_id}"
              captures: { rs_inj_status: $.data.status }
            - call: "POST /compliance-checks/run"
              payload: { team_id: "${rs_team_id}" }
              as: LeagueOfficer
              captures: { rs_codes2: $.data.violation_codes, rs_status2: $.data.resulting_compliance_status, rs_grace2: $.data.grace_expires_at }
          assert:
            - "the captured ${rs_status1} == GRACE with ${rs_grace1} == 2026-08-12T14:00:00Z"
            - "the paperwork filing succeeds in GRACE — the captured ${rs_inj_status} == PAPERWORK_FILED with paperwork_filed_at == 2026-08-11T14:00:00Z"
            - "the captured ${rs_codes2} == [], ${rs_status2} == COMPLIANT and ${rs_grace2} == null"
            - "Team.${rs_team_id}.compliance_status == COMPLIANT and consecutive_noncompliant_checks == 0"
            - "GET /teams/${rs_team_id}/compliance-checks returns total_count == 2"
            - "Player.${rs_p_id}.medical_status == REHAB and roster_designation == ACTIVE — the reset changed no roster fact"

      - name: the_waiver_clearance_chain_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.WaiverRequest.PENDING_to_CLEARED
        excluded_because:
          difficulty_instance: transitive_cascade / waiver_clearance_cascade_terminates_contract_and_books_dead_money
          rationale: "That §1.8 instance already verifies the full three-level chain — wire CLEARED, Player UNROSTERED, Contract TERMINATED, BonusAllocation rows resolved and the club's dead-money and both cap variants re-derived — in one recipe, which is exactly this layer's claim."

      - name: both_cap_variants_are_produced_from_one_roster
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.team_cap_commitment
        excluded_because:
          difficulty_instance: dual_variant_calc / team_cap_provisional_and_final_diverge_on_identical_roster
          rationale: "The divergence, the exact delta between PROVISIONAL and FINAL and the reconciliation on approval are all asserted there over identical stored data; repeating the layer-level claim here would restate it with weaker numbers."

  # ===========================================================================
  # Consistency model (§1.0 consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: an_approval_publishes_every_derived_field_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /transactions/{id}/decide]
          - calculations.team_cap_commitment
          - calculations.designation_count_recompute
        distinguishing_aspect: "Consistency is immediate, so the decide response itself already carries the approved filing's effective_at, and reads issued immediately afterwards — with no intervening write and no delay — show the club's counters, both cap variants and the player's two dimensions already settled, with a second identical read returning byte-identical values."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (cap 500000000) has a FILED SIGNING for Ray Alder with a PASSED entry physical; before the decision the club shows active_roster_count 0, final_cap_committed_cents 0 and provisional_cap_committed_cents 83333333."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { cm_team_id: $.data.id, cm_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { cm_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${cm_team_id}", player_id: "${cm_p_id}", transaction_type: "SIGNING", expected_team_version: "${cm_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${cm_team_id}"
              captures: { cm_txn_id: $.data.id, cm_c_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${cm_p_id}", team_id: "${cm_team_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${cm_txn_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${cm_team_id}"
              captures: { cm_ex_id: $.data.id }
            - call: "POST /physical-exams/${cm_ex_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${cm_team_id}"
            - call: "POST /transactions/${cm_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${cm_team_id}"
            - call: "GET /teams/${cm_team_id}/cap-ledger"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${cm_team_id}"
              captures: { cm_final_before: $.data.final_cap_committed_cents, cm_prov_before: $.data.provisional_cap_committed_cents, cm_active_before: $.data.active_roster_count }
          trigger:
            - call: "POST /transactions/${cm_txn_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
              captures: { cm_status: $.data.status, cm_effective: $.data.effective_at }
            - call: "GET /teams/${cm_team_id}/cap-ledger"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${cm_team_id}"
              captures: { cm_final_after: $.data.final_cap_committed_cents, cm_prov_after: $.data.provisional_cap_committed_cents, cm_active_after: $.data.active_roster_count, cm_space_after: $.data.cap_space_cents }
            - call: "GET /players/${cm_p_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${cm_team_id}"
              captures: { cm_desig: $.data.roster_designation, cm_medical: $.data.medical_status }
            - call: "GET /teams/${cm_team_id}/cap-ledger"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${cm_team_id}"
              captures: { cm_final_again: $.data.final_cap_committed_cents, cm_active_again: $.data.active_roster_count }
          assert:
            - "before the decision the captured ${cm_final_before} == 0, ${cm_prov_before} == 83333333 and ${cm_active_before} == 0"
            - "the decide response itself carries the captured ${cm_status} == APPROVED and ${cm_effective} == 2026-08-10T14:00:00Z"
            - "the very next read shows the captured ${cm_final_after} == 83333333, ${cm_prov_after} == 83333333, ${cm_active_after} == 1 and ${cm_space_after} == 416666667"
            - "the captured ${cm_desig} == ACTIVE and ${cm_medical} == CLEARED in that same uninterrupted sequence"
            - "the repeated read returns the captured ${cm_final_again} == 83333333 and ${cm_active_again} == 1 — nothing settles late"
            - "Contract.${cm_c_id}.status == ACTIVE and Transaction.${cm_txn_id}.status == APPROVED"
