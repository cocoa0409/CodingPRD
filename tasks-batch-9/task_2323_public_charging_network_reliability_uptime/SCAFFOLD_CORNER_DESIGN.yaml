              payload: { outage_event_id: "${o2_id}", port_id: "${p2_id}", technician_user_id: "tech-2", technician_certification_class: "DCFC_ADVANCED", window_start_at: "2026-08-01T00:30:00Z", window_end_at: "2026-08-01T06:00:00Z" }
              as: NetworkOperator
              captures: { d2_id: $.data.id }
            - call: "POST /maintenance-dispatches/${d1_id}/progress"
              payload: { event: "EN_ROUTE" }
