        distinguishing_aspect: "WholesaleCustomer cannot POST /api/caves/{id}/rotate (ShopManager-exclusive) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A cave created by ShopManager and a wholesale customer."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "WR Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/caves", payload: { name: "Cave WR", temp_c: 12, humidity_pct: 85, capacity_g: 100000 }, as: ShopManager, captures: { cv: "$.data.id" } }
          trigger:
            - { call: "POST /api/caves/${cv}/rotate", payload: {}, as: WholesaleCustomer, as_user_id: "${c}", captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: corner_get_product_unauthenticated
        claim_type: unauthenticated
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no valid role header (Anonymous) to GET /api/products/{id} -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A product created by ShopManager."]
          setup_api_calls:
            - { call: "POST /api/products", payload: { name: "UA Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "WHEEL", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, min_aging_days: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
          trigger:
            - { call: "GET /api/products/${p}", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_UNAUTHENTICATED"

      - name: corner_wholesale_reads_other_order_unauthorized
        claim_type: ownership_denied
        grounds: [roles.WholesaleCustomer, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A WholesaleCustomer whose X-User-ID differs from an order's customer_id cannot GET that order -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Two wholesale customers; an order owned by the first."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "Owner", region_code: "CA" }, as: ShopManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/customers", payload: { account_type: "WHOLESALE_RESTAURANT", name: "Intruder", region_code: "CA" }, as: ShopManager, captures: { c2: "$.data.id" } }
            - { call: "POST /api/orders", payload: { order_type: "WHOLESALE", customer_id: "${c1}" }, as: WholesaleCustomer, as_user_id: "${c1}", captures: { o: "$.data.id" } }
          trigger:
            - { call: "GET /api/orders/${o}", payload: {}, as: WholesaleCustomer, as_user_id: "${c2}", captures: { err: "$.data.error_id" } }
          assert:
            - "response data.error_id == ERR_UNAUTHORIZED"

