              captures: { posture_before: $.data.posture, overspends_before: $.data.overspend_event_count }
            - call: "GET /trade-marketing/customers/${cust_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { points_before: $.data.compliance_penalty_points, trading_before: $.data.trading_status }
          trigger:
            - call: "POST /trade-marketing/deductions/${ded_id}/validate"
              payload: { expected_promotion_version: "${promo_v}" }
              as: TradeFinanceAnalyst
              as_user_id: "dir-1"
              captures: { err: $.data.error_id }
            - call: "GET /trade-marketing/promotions/${promo_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { promo_v_after: $.data.version, spend_after: $.data.spend_status, consumed_after: $.data.consumed_deduction_amount, bal_after: $.data.accrued_balance }
            - call: "GET /trade-marketing/budget-allocations/${alloc_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { posture_after: $.data.posture, overspends_after: $.data.overspend_event_count }
            - call: "GET /trade-marketing/customers/${cust_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { points_after: $.data.compliance_penalty_points, trading_after: $.data.trading_status }
          assert:
            - "the validate call is HTTP 403 with ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "hop 1 unchanged: ${consumed_after} == ${consumed_before} == 0.00 and ${bal_after} == 3000.00"
            - "hop 2 unchanged: ${spend_after} == ${spend_before} == WITHIN_BUDGET — a successful 5000.00 validation would have made recognized 5000.00 over planned 4000.00, a ratio of 1.2500 and OVERSPENT"
            - "hop 3 unchanged: ${posture_after} == ${posture_before} == OPEN and ${overspends_after} == ${overspends_before} == 0"
            - "hop 4 unchanged: ${points_after} == ${points_before} == 0 and ${trading_after} == ${trading_before} == ACTIVE"
            - "${promo_v_after} == ${promo_v} — a refused write does not burn a version"
            - "Deduction.${ded_id}.status == MATCHED, .validated_amount == null and .entitled_amount == null"

      - name: findings_issuance_alone_reaches_the_credit_hold_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.customer_penalty_score
          - endpoints.POST_/trade-marketing/compliance-audits/{auditId}/issue-findings.side_effects
          - state_machines.Customer.trading_status.ACTIVE_to_CREDIT_HOLD
        distinguishing_aspect: |
          The scoring input set counts FINDINGS_ISSUED audits only, and the threshold uses >=,
          so a single issuance worth exactly FINDINGS_ISSUED_POINTS (10) equals
          CREDIT_HOLD_POINTS (10) and trips the hold — while the preceding record-finding,
          which leaves the audit IN_PROGRESS, scores nothing at all. The reason string is
          machine-written, and the trading axis stops at CREDIT_HOLD because SUSPENDED needs
          25 points.
        test_recipe:
          setup:
            - "One ACTIVE customer with zero penalty points and a SCHEDULED compliance audit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id, points_at_birth: $.data.compliance_penalty_points, trading_at_birth: $.data.trading_status }
            - call: "POST /trade-marketing/customers/${cust_id}/compliance-audits"
              payload: { scope_start: "2026-07-06", scope_end: "2026-08-03" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /trade-marketing/compliance-audits/${audit_id}/record-finding"
              payload: { finding_code: "UNSUPPORTED_DEDUCTION", recovery_amount: 1500.00 }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { audit_mid: $.data.status, findings_mid: $.data.findings_count }
            - call: "GET /trade-marketing/customers/${cust_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { points_mid: $.data.compliance_penalty_points, trading_mid: $.data.trading_status }
            - call: "POST /trade-marketing/compliance-audits/${audit_id}/issue-findings"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { audit_end: $.data.status, issued: $.data.issued_at }
            - call: "GET /trade-marketing/customers/${cust_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { points_end: $.data.compliance_penalty_points, trading_end: $.data.trading_status, hold_reason: $.data.credit_hold_reason, audit_axis: $.data.audit_status }
          assert:
            - "${points_at_birth} == 0 and ${trading_at_birth} == ACTIVE"
            - "${audit_mid} == IN_PROGRESS, ${findings_mid} == 1, and ComplianceAudit.${audit_id}.recovery_claim_amount == 1500.00"
            - "${points_mid} == 0 and ${trading_mid} == ACTIVE — an IN_PROGRESS audit is outside the scoring input set"
            - "${audit_end} == FINDINGS_ISSUED and ${issued} == 2026-08-01T00:00:00Z"
            - "${points_end} == 10 and ${trading_end} == CREDIT_HOLD — exactly at CREDIT_HOLD_POINTS, and the threshold is >="
            - "${hold_reason} == \"AUTO: compliance penalty points 10\""
            - "${audit_axis} == FINDINGS_OPEN — the audit axis and the trading axis both moved, on their own tracks"
            - "${trading_end} != SUSPENDED — SUSPENSION_POINTS is 25 and requires an already-held customer"

      - name: deduction_validation_overspend_chain_reaches_customer_credit_hold_corner_stub_layers
        claim_type: cascading_side_effects
        grounds:
          - calculations.promotion_spend_status
          - calculations.allocation_posture
          - calculations.customer_penalty_score
        excluded_because:
          difficulty_instance: deduction_validation_overspend_chain_reaches_customer_credit_hold
          rationale: |
            The positive end-to-end walk of the four-hop cascade — consumed amount, spend
            status, allocation overspend counter and customer penalty points — is exactly what
            that instance verifies hop by hop, including the ordering of the hops.

      - name: dispute_write_off_chain_reaches_allocation_at_risk_amount_corner_stub_layers
        claim_type: cascading_side_effects
        grounds:
          - calculations.allocation_ledger_rollup
          - calculations.post_event_analysis
        excluded_because:
          difficulty_instance: dispute_write_off_chain_reaches_allocation_at_risk_amount
          rationale: |
            The second, longer cascade — write-off to promotion ledger to post-event analysis
            to allocation at_risk_amount — is walked there, including the fact that hops 2 to 4
            only fire when a PostEventAnalysis already exists (ordering sensitivity).

      - name: accrual_shipment_basis_vs_consumption_basis_diverge_corner_stub_layers
        claim_type: dual_variant_calculation
        grounds:
          - calculations.accrual_amount_for_period
          - entities.Promotion.fields.accrual_method
        excluded_because:
          difficulty_instance: accrual_shipment_basis_vs_consumption_basis_diverge
          rationale: |
            Both accrual variants are run over identical facts and the delta between the
            SHIPMENT lead-shifted period and the CONSUMPTION period is asserted to the cent
            there; repeating it here would add no discrimination.

      - name: deduction_valuation_evidence_based_vs_agreement_cap_diverge_corner_stub_layers
        claim_type: dual_variant_calculation
        grounds:
          - calculations.deduction_valuation
          - entities.Customer.fields.deduction_validation_policy
        excluded_because:
          difficulty_instance: deduction_valuation_evidence_based_vs_agreement_cap_diverge
          rationale: |
            The second variant pair — evidence-unit entitlement against agreement-cap
            entitlement on the same claim amount — is run there with both deltas asserted,
            including which variant the customer policy selects.

      - name: spend_ratio_exactly_at_overspend_warning_ratio_corner_stub_layers
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.promotion_spend_status
        excluded_because:
          difficulty_instance: spend_ratio_exactly_at_overspend_warning_ratio
          rationale: |
            The ratio-driven threshold ladder (WITHIN_BUDGET / OVERSPEND_WARNING / OVERSPENT)
            is pinned at both of its declared boundaries there, including the strict > 1.0000
            that separates a warning from an overspend.

  # ===========================================================================
  # Consistency model — §1.0 declares `immediate`: every derived field is final
  # in the response of the write that caused it, and a read taken straight
  # afterwards must agree field for field. No deferred jobs, no eventual catch-up.
  # ===========================================================================
  - section: consistency model
    instances:

      - name: the_approval_response_already_carries_the_committed_ledger
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/trade-marketing/promotions/{promotionId}/approve.side_effects
          - calculations.promotion_planned_total_spend
          - calculations.allocation_ledger_rollup
        distinguishing_aspect: |
          The approve response body must already show planned_total_spend 10200.00
          (10000.00 subtotal, tier 0.020, allowance 200.00) and committed_units 8000, and the
          parent allocation read immediately afterwards must already show committed_amount
          10200.00, available_amount 89800.00 and unreserved_units 12000. Under an eventual
          model the response would carry pre-commit figures and the GET would disagree; here
          the two must be identical.
        test_recipe:
          setup:
            - "An APPROVED allocation of 100000.00 with 20000 planned incremental units, and a DRAFT promotion carrying one TPR line of 8000 units at 1.25 per case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 20000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version, avail_before: $.data.available_amount, unreserved_before: $.data.unreserved_units }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Immediate Ledger Event", window_start: "2026-08-03", window_end: "2026-08-10", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-03", window_end: "2026-08-10", rate_per_case: 1.250 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tactic_id: $.data.id, line_spend: $.data.line_planned_spend }
            - call: "POST /trade-marketing/promotions/${promo_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
          trigger:
            - call: "POST /trade-marketing/promotions/${promo_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { resp_state: $.data.lifecycle_status, resp_subtotal: $.data.tactic_subtotal_amount, resp_rate: $.data.allowance_rate, resp_allowance: $.data.off_invoice_allowance_amount, resp_total: $.data.planned_total_spend, resp_units: $.data.committed_units }
            - call: "GET /trade-marketing/promotions/${promo_id}"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { read_state: $.data.lifecycle_status, read_total: $.data.planned_total_spend, read_units: $.data.committed_units }
            - call: "GET /trade-marketing/budget-allocations/${alloc_id}"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { committed_amount: $.data.committed_amount, avail_after: $.data.available_amount, committed_units: $.data.committed_units, unreserved_after: $.data.unreserved_units }
            - call: "GET /trade-marketing/programs/${prog_id}"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { allocated: $.data.allocated_amount, unallocated: $.data.unallocated_amount }
          assert:
            - "${avail_before} == 100000.00 and ${unreserved_before} == 20000 — nothing committed before approval"
            - "${line_spend} == 10000.00 — 8000 units at 1.250"
            - "the approve response itself carries ${resp_state} == APPROVED, ${resp_subtotal} == 10000.00, ${resp_rate} == 0.020, ${resp_allowance} == 200.00, ${resp_total} == 10200.00 and ${resp_units} == 8000"
            - "the follow-up read agrees exactly: ${read_state} == ${resp_state}, ${read_total} == ${resp_total} == 10200.00, ${read_units} == ${resp_units} == 8000"
            - "${committed_amount} == 10200.00 and ${avail_after} == 89800.00 — the parent rollup is already committed, not queued"
            - "${committed_units} == 8000 and ${unreserved_after} == 12000"
            - "${allocated} == 100000.00 and ${unallocated} == 400000.00 — the program rollup counts the allocation, not the promotion"

      - name: the_accrual_response_and_an_immediate_read_agree_to_the_cent
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/trade-marketing/promotions/{promotionId}/accruals.side_effects
          - calculations.promotion_accrual_ledger
          - calculations.promotion_spend_status
          - calculations.allocation_ledger_rollup
        distinguishing_aspect: |
          One write, three entities: the accrual entry, its promotion's ledger and spend
          status, and the parent allocation's accrued_amount. All three must be readable at
          their final values on the request immediately after the POST — 3000.00 accrued,
          balance 3000.00, ratio 3000.00 / 10200.00 = 0.2941 so WITHIN_BUDGET, allocation
          accrued_amount 3000.00 — with no second call needed to settle anything.
        test_recipe:
          setup:
            - "The approved 10200.00 promotion of the previous instance, activated to LIVE at 2026-08-05, with a 2400-unit consumption fact for the promoted week."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 20000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Immediate Accrual Event", window_start: "2026-08-03", window_end: "2026-08-10", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-03", window_end: "2026-08-10", rate_per_case: 1.250 }
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { planned_total: $.data.planned_total_spend }
            - call: "POST /trade-marketing/volume-facts"
              payload: { customer_id: "${cust_id}", brand_id: "${brand_id}", fact_type: "CONSUMPTION", period_start: "2026-08-03", units: 2400, source: "EDI_852" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { fact_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/promotion-activation-runs"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
          trigger:
            - call: "POST /trade-marketing/promotions/${promo_id}/accruals"
              payload: { period_start: "2026-08-03" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { entry_id: $.data.id, entry_type: $.data.entry_type, entry_status: $.data.status, entry_method: $.data.method, entry_amount: $.data.amount }
            - call: "GET /trade-marketing/promotions/${promo_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { gross: $.data.gross_accrued_amount, reversed: $.data.reversed_accrual_amount, balance: $.data.accrued_balance, recognized: $.data.recognized_spend_amount, ratio: $.data.spend_ratio, spend_state: $.data.spend_status }
            - call: "GET /trade-marketing/budget-allocations/${alloc_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { alloc_accrued: $.data.accrued_amount, alloc_settled: $.data.settled_amount, alloc_at_risk: $.data.at_risk_amount }
            - call: "GET /trade-marketing/accruals/${entry_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { reread_amount: $.data.amount, reread_period: $.data.period_start }
          assert:
            - "${planned_total} == 10200.00"
            - "the accrual response carries ${entry_type} == ACCRUAL, ${entry_status} == POSTED, ${entry_method} == CONSUMPTION and ${entry_amount} == 3000.00 — 2400 consumption units at 1.250"
            - "the immediate promotion read already shows ${gross} == 3000.00, ${reversed} == 0.00, ${balance} == 3000.00 and ${recognized} == 3000.00"
            - "${ratio} == 0.2941 — 3000.00 / 10200.00 at 4 decimal places, round_half_up — and ${spend_state} == WITHIN_BUDGET"
            - "the immediate allocation read already shows ${alloc_accrued} == 3000.00, ${alloc_settled} == 0.00 and ${alloc_at_risk} == 0.00"
            - "${reread_amount} == ${entry_amount} == 3000.00 and ${reread_period} == 2026-08-03 — the entry re-read is byte-identical to the write response"
            - "VolumeFact.${fact_id}.units == 2400 is unchanged: accrual reads facts, it does not consume them"
