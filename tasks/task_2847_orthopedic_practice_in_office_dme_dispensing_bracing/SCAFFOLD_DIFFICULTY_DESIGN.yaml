# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 Difficulty
# Rules. Every literal below was computed from the §1.3 formulas; every
# `${var}` is bound by a `captures:` line earlier in the same instance.
# The logical clock starts at 2026-08-01T00:00:00Z (see §1.5
# POST /_clock/set_current_utc).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: patient_responsibility_insurance_vs_abn_cash_variant_divergence
        grounds:
          - calculations.patient_responsibility
          - calculations.abn_cash_quote
          - entities.DispenseEncounter.fields.responsibility_variant
          - entities.DispenseEncounter.fields.patient_responsibility_cents
          - entities.DispenseEncounter.fields.billable_amount_cents
          - state_machines.DispenseEncounter.VERIFIED_to_BILLED
          - state_machines.DispenseEncounter.SELF_PAY_to_BILLED
        distinguishing_aspect: |
          This instance's dual variant lives in the PATIENT-MONEY domain: the
          same DeviceProduct, quantity and clinic produce a different
          patient_responsibility_cents depending on whether the effective
          CoverageVerification made covered_units positive (INSURANCE_ASSIGNED
          fills deductible then coinsurance and leaves a non-zero payer
          billable) or zero (ABN_CASH_SELFPAY copies the signed notice's
          estimated_cost_cents, which includes the dispensing fee, and zeroes
          the payer billable). The second dual-variant instance in this rule
          operates on Supplier fabrication performance, a different entity
          domain and a different metric type (points, not cents).
        test_recipe:
          setup:
            - "one accredited clinic with DIRECT in-office supervision and a stocked LSO-brace shelf (par_min 4, on hand 10)"
            - "two patients of that clinic; two group physicians so IOAS attestation is done by a second physician"
            - "encounter A: quantity 1, coverage verified as covered with a 0 deductible and a 0.50 coinsurance, fitted and ready to dispense"
            - "encounter B: quantity 1 on the same product, coverage verified as NOT covered, a signed advance beneficiary notice electing OPTION_1, fitted and ready to dispense"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE", "SPORTS_MEDICINE", "FOOT_ANKLE", "HAND", "TOTAL_JOINT"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000001", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_order_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Dev Rao", npi: "1700000002", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_attest_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/fitters"
              payload: { full_name: "Kai Lund", credential: "CO", credential_expires_on: "2027-12-31", privilege_scope: "CUSTOM_AND_OFF_SHELF" }
              as: PracticeAdmin
              captures: { fitter_a_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_a_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Joel Pike", dob: "1958-09-19", payer_type: "COMMERCIAL", member_id: "CM-2", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_b_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_lso_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_lso_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_lso_id: $.data.id }
            - call: "POST /dme/par-levels/${par_lso_id}/stock-receipts"
              payload: { received_qty: 10 }
              as: InventoryManager
              captures: { par_lso_v1: $.data.version }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_a_id}", product_id: "${prod_lso_id}", ordering_physician_id: "${phys_order_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_a_id: $.data.id }
            - call: "POST /dme/encounters/${enc_a_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M54.50", mn_functional_deficit: "lumbar instability limiting ambulation", mn_expected_duration_months: 6 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
            - call: "POST /dme/encounters/${enc_a_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "DIRECT" }
              as: OrthoPhysician
              as_user_id: "${phys_attest_id}"
            - call: "POST /dme/encounters/${enc_a_id}/coverage-verifications"
              payload: { covered: true, deductible_remaining_cents: 0, coinsurance_pct: 0.5, valid_for_days: 30 }
              as: InsuranceCoordinator
            - call: "POST /dme/encounters/${enc_a_id}/reservations"
              payload: { expected_par_level_version: "${par_lso_v1}" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { enc_a_after_reserve_v: $.data.version }
            - call: "POST /dme/encounters/${enc_a_id}/fitting-records"
              payload: { fitting_start_at: "2026-08-01T09:00:00Z", fitting_end_at: "2026-08-01T09:30:00Z", measurement_set: { waist_cm: 96, height_cm: 172 }, fit_outcome: "ACCEPTABLE" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_b_id}", product_id: "${prod_lso_id}", ordering_physician_id: "${phys_order_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_b_id: $.data.id }
            - call: "POST /dme/encounters/${enc_b_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M54.50", mn_functional_deficit: "lumbar instability limiting ambulation", mn_expected_duration_months: 6 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
            - call: "POST /dme/encounters/${enc_b_id}/ioas-attestation"
              payload: { ioas_supervision_level_observed: "DIRECT" }
              as: OrthoPhysician
              as_user_id: "${phys_attest_id}"
            - call: "POST /dme/encounters/${enc_b_id}/coverage-verifications"
              payload: { covered: false, deductible_remaining_cents: 0, coinsurance_pct: 0.5, valid_for_days: 30 }
              as: InsuranceCoordinator
            - call: "GET /dme/encounters/${enc_b_id}"
              payload: {}
              as: InsuranceCoordinator
              captures: { enc_b_v: $.data.version }
            - call: "POST /dme/encounters/${enc_b_id}/abn-notices"
              payload: { reason_non_covered: "NON_COVERED_ITEM", expected_encounter_version: "${enc_b_v}" }
              as: InsuranceCoordinator
              captures: { abn_b_id: $.data.id, abn_b_cost: $.data.estimated_cost_cents }
            - call: "POST /dme/abn-notices/${abn_b_id}/signature"
              payload: { signed_by: "PATIENT", option_selected: "OPTION_1" }
              as: InsuranceCoordinator
            - call: "GET /dme/par-levels/${par_lso_id}"
              payload: {}
              as: InventoryManager
              captures: { par_lso_v2: $.data.version }
            - call: "POST /dme/encounters/${enc_b_id}/reservations"
              payload: { expected_par_level_version: "${par_lso_v2}" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
            - call: "POST /dme/encounters/${enc_b_id}/fitting-records"
              payload: { fitting_start_at: "2026-08-01T11:00:00Z", fitting_end_at: "2026-08-01T11:30:00Z", measurement_set: { waist_cm: 102, height_cm: 180 }, fit_outcome: "ACCEPTABLE" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
          trigger:
            - call: "POST /dme/encounters/${enc_a_id}/dispense"
              payload: { delivery_signature_role: "PATIENT" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
            - call: "POST /dme/encounters/${enc_b_id}/dispense"
              payload: { delivery_signature_role: "PATIENT" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
          assert:
            - "DispenseEncounter.${enc_a_id}.responsibility_variant == INSURANCE_ASSIGNED"
            - "DispenseEncounter.${enc_a_id}.covered_units == 1"
            - "DispenseEncounter.${enc_a_id}.patient_responsibility_cents == 10300"
            - "DispenseEncounter.${enc_a_id}.billable_amount_cents == 10300"
            - "AbnNotice.${abn_b_id}.unit_net_price_cents == 11765"
            - "AbnNotice.${abn_b_id}.estimated_subtotal_cents == 11765"
            - "AbnNotice.${abn_b_id}.dispensing_fee_cents == 2500"
            - "AbnNotice.${abn_b_id}.estimated_cost_cents == 14265"
            - "DispenseEncounter.${enc_b_id}.responsibility_variant == ABN_CASH_SELFPAY"
            - "DispenseEncounter.${enc_b_id}.covered_units == 0"
            - "DispenseEncounter.${enc_b_id}.patient_responsibility_cents == 14265"
            - "DispenseEncounter.${enc_b_id}.billable_amount_cents == 0"
            - "the two variants diverge on identical product and quantity: 14265 - 10300 == 3965"

      - name: supplier_turnaround_promised_basis_vs_elapsed_basis_divergence
        grounds:
          - calculations.supplier_turnaround_score
          - entities.CustomFabOrder.fields.projected_turnaround_score
          - entities.CustomFabOrder.fields.final_turnaround_score
          - entities.Supplier.fields.turnaround_score
          - state_machines.CustomFabOrder.IN_FABRICATION_to_READY_FOR_FITTING
          - state_machines.CustomFabOrder.READY_FOR_FITTING_to_ACCEPTED
        distinguishing_aspect: |
          This instance's dual variant lives in the SUPPLIER-PERFORMANCE
          domain and is measured in score points, not cents: one and the same
          CustomFabOrder carries two scores computed from the same promised
          turnaround, because promised_basis measures only
          submitted_at -> first_delivered_at and forgives rework while
          elapsed_basis measures submitted_at -> accepted_at and charges
          ADJUSTMENT_PENALTY_POINTS per adjustment round. It is not a repeat
          of the patient-money variant: different entity, different metric
          type, and only the elapsed_basis variant feeds a parent rollup.
        test_recipe:
          setup:
            - "one accredited clinic, one attested and custom-fab-capable supplier promising a 10-day turnaround"
            - "one CUSTOM_FABRICATED product; one encounter documented and awaiting the device"
            - "the fabrication order is delivered 13 days after submission, sent back for one adjustment round, and accepted on day 21"
            - "the logical clock is advanced with POST /_clock/set_current_utc between fabrication events"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE", "FOOT_ANKLE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000011", specialty: "FOOT_ANKLE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_order_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/fitters"
              payload: { full_name: "Kai Lund", credential: "CPO", credential_expires_on: "2027-12-31", privilege_scope: "CUSTOM_AND_OFF_SHELF" }
              as: PracticeAdmin
              captures: { fitter_a_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_a_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L1940", description: "Custom-fabricated AFO", category: "CUSTOM_FABRICATED", specialty: "FOOT_ANKLE", same_or_similar_group: "AFO_CUSTOM", reasonable_useful_lifetime_months: 36, allowed_amount_cents: 42000, cash_price_cents: 49999, unit_cost_cents: 20000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_afo_id: $.data.id }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_a_id}", product_id: "${prod_afo_id}", ordering_physician_id: "${phys_order_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_c_id: $.data.id }
            - call: "POST /dme/encounters/${enc_c_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M21.372", mn_functional_deficit: "foot drop with unstable gait", mn_expected_duration_months: 12 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
            - call: "POST /dme/encounters/${enc_c_id}/custom-fab-orders"
              payload: { supplier_id: "${supplier_id}" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { fab_id: $.data.id }
            - call: "POST /dme/custom-fab-orders/${fab_id}/fabrication-events"
              payload: { event: "ACCEPT_ORDER" }
              as: InventoryManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T00:00:00Z" }
              as: InventoryManager
          trigger:
            - call: "POST /dme/custom-fab-orders/${fab_id}/fabrication-events"
              payload: { event: "DELIVER_TO_CLINIC" }
              as: InventoryManager
              captures: { projected_score: $.data.projected_turnaround_score }
            - call: "POST /dme/custom-fab-orders/${fab_id}/fitting-check"
              payload: { outcome: "REQUEST_ADJUSTMENT", note: "medial trimline too high" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
            - call: "POST /dme/custom-fab-orders/${fab_id}/fabrication-events"
              payload: { event: "ACCEPT_ORDER" }
              as: InventoryManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: InventoryManager
            - call: "POST /dme/custom-fab-orders/${fab_id}/fabrication-events"
              payload: { event: "DELIVER_TO_CLINIC" }
              as: InventoryManager
            - call: "POST /dme/custom-fab-orders/${fab_id}/fitting-check"
              payload: { outcome: "ACCEPT" }
              as: DmeFitter
              as_user_id: "${fitter_a_id}"
              captures: { final_score: $.data.final_turnaround_score }
          assert:
            - "CustomFabOrder.${fab_id}.first_delivery_days == 13"
            - "CustomFabOrder.${fab_id}.projected_turnaround_score == 88"
            - "CustomFabOrder.${fab_id}.adjustment_rounds == 1"
            - "CustomFabOrder.${fab_id}.total_elapsed_days == 21"
            - "CustomFabOrder.${fab_id}.final_turnaround_score == 50"
            - "the two variants diverge on one order's own data: 88 - 50 == 38"
            - "CustomFabOrder.${fab_id}.first_delivered_at is unchanged by the second DELIVER_TO_CLINIC event"
            - "Supplier.${supplier_id}.accepted_fab_order_count == 1"
            - "Supplier.${supplier_id}.turnaround_score == 50"

  - rule_id: combinatorial_formula
    instances:
      - name: abn_cash_quote_round_per_unit_then_multiply_mode_b
        grounds:
          - calculations.abn_cash_quote
          - entities.AbnNotice.fields.unit_net_price_cents
          - entities.AbnNotice.fields.estimated_subtotal_cents
          - entities.AbnNotice.fields.dispensing_fee_cents
          - entities.AbnNotice.fields.estimated_cost_cents
          - state_machines.DispenseEncounter.NON_COVERED_to_ABN_ISSUED
        distinguishing_aspect: |
          Mode (b), nested rounding where the order matters: the scaffold pins
          round-the-single-unit-price-THEN-multiply, so a 19999-cent product
          quoted for 5 units yields 16999 * 5 == 84995, whereas the
          multiply-then-round order yields round(19999 * 5 * 0.85) ==
          round(84995.75) == 84996. The two orders differ by exactly 1 cent
          and the assertion pins 84995. The other two instances of this rule
          are mode (a) and mode (c) respectively.
        test_recipe:
          setup:
            - "one accredited clinic licensed for SPORTS_MEDICINE, one supplier, one 19999-cent knee brace that needs no prior authorization"
            - "one encounter for 5 units, medically documented, whose coverage verification came back NOT covered so financial_status is NON_COVERED"
            - "the logical clock is at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPORTS_MEDICINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000021", specialty: "SPORTS_MEDICINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_order_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_a_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L1832", description: "Knee orthosis, adjustable ROM", category: "OFF_SHELF_PREFAB", specialty: "SPORTS_MEDICINE", same_or_similar_group: "KNEE_ROM", reasonable_useful_lifetime_months: 36, allowed_amount_cents: 22000, cash_price_cents: 19999, unit_cost_cents: 9000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_knee_id: $.data.id }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_a_id}", product_id: "${prod_knee_id}", ordering_physician_id: "${phys_order_id}", quantity: 5 }
              as: PracticeAdmin
              captures: { enc_id: $.data.id }
            - call: "POST /dme/encounters/${enc_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M23.51", mn_functional_deficit: "bilateral knee instability", mn_expected_duration_months: 6 }
              as: OrthoPhysician
              as_user_id: "${phys_order_id}"
            - call: "POST /dme/encounters/${enc_id}/coverage-verifications"
              payload: { covered: false, deductible_remaining_cents: 0, coinsurance_pct: 0.2, valid_for_days: 30 }
              as: InsuranceCoordinator
            - call: "GET /dme/encounters/${enc_id}"
              payload: {}
              as: InsuranceCoordinator
              captures: { enc_v: $.data.version }
          trigger:
            - call: "POST /dme/encounters/${enc_id}/abn-notices"
              payload: { reason_non_covered: "NON_COVERED_ITEM", expected_encounter_version: "${enc_v}" }
              as: InsuranceCoordinator
              captures: { abn_id: $.data.id }
          assert:
            - "AbnNotice.${abn_id}.unit_net_price_cents == 16999"
            - "AbnNotice.${abn_id}.estimated_subtotal_cents == 84995"
            - "AbnNotice.${abn_id}.dispensing_fee_cents == 0"
            - "AbnNotice.${abn_id}.estimated_cost_cents == 84995"
            - "AbnNotice.${abn_id}.estimated_subtotal_cents != 84996 (84996 is the multiply-then-round answer and is wrong)"
            - "AbnNotice.${abn_id}.status == ISSUED"
            - "AbnNotice.${abn_id}.notice_seq == 1"
            - "DispenseEncounter.${enc_id}.financial_status == ABN_ISSUED"

      - name: patient_responsibility_nested_min_and_branch_selection_mode_a
        grounds:
          - calculations.patient_responsibility
          - entities.DispenseEncounter.fields.covered_units
          - entities.DispenseEncounter.fields.patient_responsibility_cents
          - entities.DispenseEncounter.fields.billable_amount_cents
          - state_machines.PriorAuthRequest.SUBMITTED_to_APPROVED
          - state_machines.DispenseEncounter.AUTH_APPROVED_to_ABN_ISSUED
          - validations[priority=47]
        distinguishing_aspect: |
          Mode (a), a formula with five interacting inputs and a nested min plus
          three conditional branches: covered_units = min(quantity=3,
          approved_units=2) selects the INSURANCE_ASSIGNED branch; the
          deductible bucket (0) then the coinsurance bucket
          (round(44000*0.2)=8800) then the excess-unit cash bucket
          (excess_units=1 < CASH_DISCOUNT_MIN_QTY so NO multi-unit discount,
          19999) compose to 28799 while the payer line is a different number,
          35200. It is not mode (b) rounding order and not mode (c) circular
          evaluation.
        test_recipe:
          setup:
            - "one accredited clinic licensed for SPORTS_MEDICINE with DIRECT supervision, two group physicians, one credentialed fitter"
            - "one knee brace at 22000 allowed / 19999 cash that REQUIRES prior authorization; a shelf with 10 units on hand"
            - "one encounter for 3 units: coverage verified as covered with a 0 deductible and 0.20 coinsurance, prior authorization approved for only 2 units"
            - "an advance beneficiary notice for the 1 excess unit, signed OPTION_1, so the encounter may be delivered"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPORTS_MEDICINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000031", specialty: "SPORTS_MEDICINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_order_id: $.data.id }
