  - rule_id: transitive_cascade
    instances:

      - name: revision_request_five_hop_cascade
        grounds:
          - state_machines.OfficialStatement.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.OfficialStatementSection.APPROVED_to_NEEDS_REVISION
          - state_machines.RatingEngagement.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.RatingPresentation.SCHEDULED_to_CANCELLED
          - entities.Deal.fields.disclosure_clearance
          - entities.OfficialStatement.fields.mandatory_sections_approved
        distinguishing_aspect: |
          Trigger is POST /official-statements/{id}/request-revision and the chain is five hops
          deep across four entities: OS status (hop 1) -> APPROVED RISK_FACTOR sections flip to
          NEEDS_REVISION (hop 2, only because hop 1 happened) -> mandatory_sections_approved
          recomputes to false (hop 3, only because hop 2 removed the last APPROVED RISK_FACTOR)
          -> Deal.disclosure_clearance becomes BLOCKED (hop 4, only because hop 3 made it false
          while the OS sits in REVISION_REQUESTED) -> SCHEDULED rating presentations cancel and
          UNDER_REVIEW engagements bounce to INFO_REQUESTED (hop 5, only because clearance became
          BLOCKED). Every hop is observable on a different row.
        test_recipe:
          setup:
            - "One municipal advisor firm and one issuer exist; a DRAFT deal authorizes 10,000,000."
            - "A MOODYS rating engagement is UNDER_REVIEW with analyst 'ra_moodys' pinned and info_request_count 0."
            - "That engagement has one SCHEDULED presentation on 2026-08-10 from 14:00 to 16:00 UTC."
            - "Statement POS-1 is IN_REVIEW with all four mandatory section types APPROVED, so mandatory_sections_approved is true and Deal.disclosure_clearance is CLEARED."
            - "The logical clock stands at its 2026-08-01T00:00:00Z default, so the presentation has not been promoted to HELD."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026R", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/rating-engagements"
              payload: { agency: "MOODYS" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/acknowledge"
              payload: {}
              as: RatingAnalyst
              as_user_id: "ra_moodys"
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/presentations"
              payload: { starts_at: "2026-08-10T14:00:00.000Z", ends_at: "2026-08-10T16:00:00.000Z", attendee_count: 6 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { pres_id: $.data.id }
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_v: $.data.version }
            - call: "POST /bond-offerings/deals/${deal_id}/official-statements"
              payload: { version_label: "POS-1", is_preliminary: true, expected_deal_version: "${deal_v}" }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { os_id: $.data.id }
            - call: "POST /bond-offerings/official-statements/${os_id}/sections"
              payload: { section_code: "RF-1", title: "Risk Factors", body_text: "Ad valorem tax collections may decline.", section_type: "RISK_FACTOR", is_material_risk: true }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { s_rf_id: $.data.id }
            - call: "POST /bond-offerings/official-statements/${os_id}/sections"
              payload: { section_code: "TM-1", title: "Tax Matters", body_text: "Interest is excludable from gross income.", section_type: "TAX_MATTERS" }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { s_tm_id: $.data.id }
            - call: "POST /bond-offerings/official-statements/${os_id}/sections"
              payload: { section_code: "CD-1", title: "Continuing Disclosure", body_text: "The issuer undertakes annual filings.", section_type: "CONTINUING_DISCLOSURE", is_material_risk: true }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { s_cd_id: $.data.id }
            - call: "POST /bond-offerings/official-statements/${os_id}/sections"
              payload: { section_code: "UW-1", title: "Underwriting", body_text: "Compensation is disclosed herein.", section_type: "UNDERWRITING" }
              as: BondCounsel
              as_user_id: "bc_drafter"
              captures: { s_uw_id: $.data.id }
            - call: "POST /bond-offerings/os-sections/${s_rf_id}/approve"
