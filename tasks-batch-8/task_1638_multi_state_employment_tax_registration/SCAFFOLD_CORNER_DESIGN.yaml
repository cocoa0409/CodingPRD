# =============================================================================
# §1.9 Scaffold Corner Design — Multi-State Employment Tax Registration
# Breadth index: every testable claim of §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Stubs mark corners covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: employer_singleton_second_create_rejected
        claim_type: creation
        grounds: [entities.Employer, "validations[priority=11]", "errors[ERR_EMPLOYER_ALREADY_EXISTS]"]
        distinguishing_aspect: "First POST /etax/employers succeeds (201, posture GOOD_STANDING, counters 0); the singleton constraint rejects the second create."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, posture: $.data.compliance_posture, notices: $.data.open_notice_count } }
          trigger:
            - { call: "POST /etax/employers", payload: { legal_name: "Second Corp", fein: "987654321", home_state_code: "NY" }, as: TaxDirector, captures: { err: $.data.error_id } }
          assert:
            - "First create: compliance_posture == GOOD_STANDING, open_notice_count == 0, outstanding_penalty_cents == 0"
            - "Second create: error_id == ERR_EMPLOYER_ALREADY_EXISTS"

      - name: agency_duplicate_kind_state_locality_rejected
        claim_type: violation_to_error
        grounds: [entities.TaxAgency, "validations[priority=12]", "errors[ERR_DUPLICATE_AGENCY]"]
        distinguishing_aspect: "The (agency_kind, state_code, locality_code) uniqueness among active agencies rejects an exact duplicate create."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag1: $.data.id } }
          trigger:
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR duplicate", withholding_rate_bp: 500 }, as: TaxDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_AGENCY (locality_code null in both — nulls equal for this uniqueness)"

      - name: employee_creation_auto_creates_initial_assignment
        claim_type: side_effect_execution
        grounds: [entities.Employee, entities.LocalAssignment, calculations.local_jurisdiction_resolution]
        distinguishing_aspect: "Employee creation auto-creates the initial LocalAssignment with resolution_source AUTO_GEOCODE and effective_from == hire_date."
        test_recipe:
          setup: ["OR work location exists"]
          setup_api_calls:
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
          trigger:
            - { call: "POST /etax/employees", payload: { employee_ref: "E-2001", full_name: "AC One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id, e_status: $.data.status } }
            - { call: "GET /etax/local-assignments", payload: { employee_id: "${e_id}" }, as: NexusAnalyst, captures: { la_src: "$.data[0].resolution_source", la_from: "$.data[0].effective_from", la_status: "$.data[0].status", la_wl: "$.data[0].work_location_id" } }
          assert:
            - "Employee.${e_id}.status == ACTIVE (initial state)"
            - "Exactly one LocalAssignment: resolution_source == AUTO_GEOCODE, effective_from == 2026-08-01T00:00:00Z, status == CURRENT, work_location_id == ${wl_or}"
            - "resident_agency_id and work_agency_id are null (no LOCAL agencies in catalog)"

      - name: employee_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Employee.fields.annual_wage_cents, "validations[priority=31]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input annual_wage_cents rejects the create with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["OR work location exists"]
          setup_api_calls:
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
          trigger:
            - { call: "POST /etax/employees", payload: { employee_ref: "E-2002", full_name: "AC Two", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: employee_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /etax/employees/00000000-0000-0000-0000-000000000000", payload: {}, as: TaxDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: list_endpoint_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /etax/work-locations]"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns the fixed pagination fields with correct values."
        test_recipe:
          setup: ["three work locations created"]
          setup_api_calls:
            - { call: "POST /etax/work-locations", payload: { label: "L1", address_line1: "1 A St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst }
            - { call: "POST /etax/work-locations", payload: { label: "L2", address_line1: "2 B St", city: "Portland", state_code: "OR", postal_code: "97202", location_type: "CLIENT_SITE" }, as: NexusAnalyst }
            - { call: "POST /etax/work-locations", payload: { label: "L3", address_line1: "3 C St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst }
          trigger:
            - { call: "GET /etax/work-locations", payload: { limit: 2, offset: 0 }, as: Auditor }
          assert:
            - "response_type == array; data has exactly 2 rows; total_count == 3; has_more == true; limit == 2; offset == 0"

      - name: agreement_computed_status_input_ignored
        claim_type: computed_fields
        grounds: [entities.ReciprocityAgreement.fields.status]
        distinguishing_aspect: "Client-supplied value for the computed status field is ignored; the server computes status from the clock (ACTIVE for an open-ended agreement already in force)."
        test_recipe:
          setup: ["empty DB, default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /etax/reciprocity-agreements", payload: { state_a: "PA", state_b: "NJ", effective_from: "2020-01-01T00:00:00Z", scope: "FULL", status: "EXPIRED" }, as: TaxDirector, captures: { ag_status: $.data.status } }
          assert:
            - "ReciprocityAgreement.status == ACTIVE (computed from effective window vs clock; the injected EXPIRED was ignored)"

  # ------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: nexus_confirm_from_watch_rejected
        claim_type: invalid_transition
        grounds: [state_machines.NexusCase.THRESHOLD_MET_to_CONFIRMED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "confirm is only declared from THRESHOLD_MET; a WATCH case (0 employee-days, no employees at all) rejects it."
        test_recipe:
          setup: ["OR NexusCase exists with no employees (0 days -> WATCH)"]
          setup_api_calls:
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id, st: $.data.status } }
          trigger:
            - { call: "POST /etax/nexus-cases/${nc_or}/confirm", payload: {}, as: NexusAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "Initial state == WATCH (initial_state claim)"
            - "error_id == ERR_INVALID_STATE_TRANSITION; case remains WATCH"

      - name: registration_close_then_activate_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Registration.ACTIVE_to_CLOSED, state_machines.Registration.SUBMITTED_to_ACTIVE, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Happy-path close (all obligations CONFIRMED, no open notices) reaches the terminal CLOSED state; any further transition (activate) is rejected."
        test_recipe:
          setup:
            - "Employer; OR-WH agency 500bp; one OR employee hired 2026-08-01 wage 9,125,000; OR nexus CONFIRMED; QUARTERLY registration ACTIVE (2026-08-20) with two Q3 obligations (deposit 76,250 and return 76,250)"
            - "Clock at 2026-10-01: both obligations DUE; then both FILED (pcl-1) and CONFIRMED (pcl-2)"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-2101", full_name: "AD One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 9125000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_or}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_or_wh}", projected_annual_withholding_cents: 200000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_or: $.data.id } }
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_or}/activate", payload: { account_number: "OR-00000007" }, as: NexusAnalyst }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: TaxDirector }
            - { call: "GET /etax/filing-obligations", payload: { registration_id: "${reg_or}", obligation_kind: "WITHHOLDING_DEPOSIT" }, as: PayrollComplianceLead, captures: { dep_id: "$.data[0].id", dep_status: "$.data[0].status" } }
            - { call: "GET /etax/filing-obligations", payload: { registration_id: "${reg_or}", obligation_kind: "WITHHOLDING_RETURN" }, as: PayrollComplianceLead, captures: { ret_id: "$.data[0].id" } }
            - { call: "POST /etax/filing-obligations/${dep_id}/file", payload: { filed_at: "2026-10-01T00:00:00Z" }, as: PayrollComplianceLead, as_user_id: "pcl-1" }
            - { call: "POST /etax/filing-obligations/${ret_id}/file", payload: { filed_at: "2026-10-01T00:00:00Z" }, as: PayrollComplianceLead, as_user_id: "pcl-1" }
            - { call: "POST /etax/filing-obligations/${dep_id}/confirm", payload: {}, as: PayrollComplianceLead, as_user_id: "pcl-2" }
            - { call: "POST /etax/filing-obligations/${ret_id}/confirm", payload: {}, as: PayrollComplianceLead, as_user_id: "pcl-2" }
          trigger:
            - { call: "POST /etax/registrations/${reg_or}/close", payload: {}, as: TaxDirector, captures: { close_status: $.data.status } }
            - { call: "POST /etax/registrations/${reg_or}/activate", payload: { account_number: "OR-XXXXXXXX" }, as: NexusAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "Both obligations were DUE after the 2026-10-01 sweep (deposit status captured ${dep_status} == DUE)"
            - "Close succeeds once every obligation is CONFIRMED: status == CLOSED"
            - "Activate from CLOSED: error_id == ERR_INVALID_STATE_TRANSITION (terminal lockdown)"

      - name: election_initial_state_submitted
        claim_type: initial_state
        grounds: [state_machines.WithholdingElection, entities.WithholdingElection.fields.status]
        distinguishing_aspect: "A freshly created election is SUBMITTED (not VALIDATED/ACTIVE) and resident_state_code is snapshotted from the employee."
        test_recipe:
          setup: ["NJ work location; employee resident PA working NJ"]
          setup_api_calls:
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-2102", full_name: "AE One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_nj}" }, as: NexusAnalyst, captures: { e_id: $.data.id, e_v: $.data.version } }
          trigger:
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-08-01T00:00:00Z", certificate_form_code: "NJ-165", expected_employee_version: "${e_v}" }, as: Employee, as_user_id: "${e_id}", captures: { el_id: $.data.id, st: $.data.status, res: $.data.resident_state_code } }
          assert:
            - "WithholdingElection.${el_id}.status == SUBMITTED"
            - "resident_state_code == PA (server-side snapshot, not client input)"

      - name: election_validated_activates_on_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.WithholdingElection.VALIDATED_to_ACTIVE]
        distinguishing_aspect: "A future-dated validated election stays VALIDATED until the clock reaches effective_from, then the sweep activates it (scheduled/deferred action)."
        test_recipe:
          setup: ["PA-NJ reciprocity agreement ACTIVE (open-ended, certificate NJ-165); NJ work location; employee resident PA working NJ; election effective 2026-09-01 validated at the default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /etax/reciprocity-agreements", payload: { state_a: "PA", state_b: "NJ", effective_from: "2020-01-01T00:00:00Z", certificate_form_code: "NJ-165", scope: "FULL" }, as: TaxDirector }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-2103", full_name: "AF One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_nj}" }, as: NexusAnalyst, captures: { e_id: $.data.id, e_v: $.data.version } }
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-09-01T00:00:00Z", certificate_form_code: "NJ-165", expected_employee_version: "${e_v}" }, as: Employee, as_user_id: "${e_id}", captures: { el_id: $.data.id } }
            - { call: "POST /etax/withholding-elections/${el_id}/validate", payload: {}, as: NexusAnalyst, captures: { st_validated: $.data.status } }
          trigger:
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: TaxDirector }
            - { call: "GET /etax/withholding-elections/${el_id}", payload: {}, as: TaxDirector, captures: { st_after: $.data.status } }
          assert:
            - "At validate (effective_from 2026-09-01 > clock 2026-08-20): status == VALIDATED"
            - "After the sweep at 2026-09-01: status == ACTIVE"

      - name: election_active_expires_after_effective_to
        claim_type: valid_transition
        grounds: [state_machines.WithholdingElection.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "The clock sweep expires an ACTIVE election once effective_to has passed (effective_to is exclusive: expiry when effective_to < now)."
        test_recipe:
          setup: ["PA-NJ agreement; NJ location; PA-resident employee working NJ; election [2026-08-01, 2026-09-30) ACTIVE (validated at clock 2026-08-20)"]
          setup_api_calls:
            - { call: "POST /etax/reciprocity-agreements", payload: { state_a: "PA", state_b: "NJ", effective_from: "2020-01-01T00:00:00Z", certificate_form_code: "NJ-165", scope: "FULL" }, as: TaxDirector }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-2104", full_name: "AG One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_nj}" }, as: NexusAnalyst, captures: { e_id: $.data.id, e_v: $.data.version } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z", certificate_form_code: "NJ-165", expected_employee_version: "${e_v}" }, as: Employee, as_user_id: "${e_id}", captures: { el_id: $.data.id } }
            - { call: "POST /etax/withholding-elections/${el_id}/validate", payload: {}, as: NexusAnalyst, captures: { st_active: $.data.status } }
          trigger:
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: TaxDirector }
            - { call: "GET /etax/withholding-elections/${el_id}", payload: {}, as: TaxDirector, captures: { st_after: $.data.status } }
          assert:
            - "Validate with effective_from 2026-08-01 <= clock: status == ACTIVE directly (SUBMITTED -> ACTIVE branch)"
            - "After the sweep at 2026-10-01 (effective_to 2026-09-30 < now): status == EXPIRED"

      - name: location_change_holds_approved_before_effective_date
        claim_type: precondition_enforcement
        grounds: [state_machines.LocationChange.APPROVED_to_EFFECTIVE]
        distinguishing_aspect: "The sweep effectuates only when effective_date <= now: an APPROVED change with a future effective_date remains APPROVED after intermediate sweeps."
        test_recipe:
          setup: ["OR and NJ locations; employee in OR; LocationChange effective 2026-09-01 APPROVED; clock still 2026-08-20"]
          setup_api_calls:
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-2105", full_name: "AH One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id } }
            - { call: "POST /etax/location-changes", payload: { employee_id: "${e_id}", to_work_location_id: "${wl_nj}", effective_date: "2026-09-01T00:00:00Z", reason: "Fall relocation" }, as: Employee, as_user_id: "${e_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /etax/location-changes/${lc_id}/approve", payload: {}, as: NexusAnalyst, as_user_id: "na-1" }
          trigger:
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: TaxDirector }
            - { call: "GET /etax/location-changes/${lc_id}", payload: {}, as: TaxDirector, captures: { st_mid: $.data.status } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: TaxDirector }
            - { call: "GET /etax/location-changes/${lc_id}", payload: {}, as: TaxDirector, captures: { st_final: $.data.status } }
          assert:
            - "After the 2026-08-25 sweep (effective_date not reached): status == APPROVED (no premature effectuation)"
            - "After the 2026-09-01 sweep (effective_date <= now): status == EFFECTIVE"

      - name: obligation_scheduled_due_late_sweep_sequence
        claim_type: valid_transition
        grounds: [state_machines.FilingObligation.SCHEDULED_to_DUE, state_machines.FilingObligation.DUE_to_LATE]
        distinguishing_aspect: "The two sweep transitions fire on distinct date rules: DUE when period_end < now, LATE only when current date >= due_date + 1 day."
        test_recipe:
          setup: ["Employer; OR-WH 500bp; one OR employee hired 2026-08-01 wage 3,000,000; OR nexus CONFIRMED; QUARTERLY registration ACTIVE (Q3 deposit: period 2026-07-01..2026-09-30, due rolled 2026-11-02)"]
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-2106", full_name: "AI One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
