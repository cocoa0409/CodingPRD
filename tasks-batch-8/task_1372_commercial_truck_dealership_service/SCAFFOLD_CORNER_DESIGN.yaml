            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88329" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
          trigger:
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2027-02-11T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller, captures: { d180: $.data.days_in_stock, c180: $.data.curtailment_due_cents, b180: $.data.aging_bucket } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2027-02-12T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller, captures: { d181: $.data.days_in_stock, c181: $.data.curtailment_due_cents, b181: $.data.aging_bucket } }
