# =============================================================================
# Task 1802 — Race Timing & Results Management: scaffold seed tables
# =============================================================================

scenario: |
  1802. Race Timing & Results Management (race timing company): participant
  registration & bib/chip assignment, timing mat placement & split
  configuration, chip vs gun time & wave start handling, live results feed &
  spectator tracking, age-group & category award calculation, DNF/DQ &
  course-cut detection, results correction & protest window, certification
  for qualifying events

domain_name: race-timing-results
api_prefix: /race-timing

complexity_profile:
  primary_archetype: event_sourcing        # results derived by replaying an ordered read log; retroactive corrections
  secondary_archetype: compliance_audit    # certification gates, protest window, segregation of duties
  complexity_layers:
    - optimistic_concurrency               # OCC on Race.version for publish / correction adjudication
    - cascading_side_effects               # correction -> read -> result -> award -> certification
    - dual_variant_calculation             # gun-rank vs chip-rank; live projection vs actual elapsed
    - rate_threshold_triggers              # course-cut min pace, protest window, race cutoff, qualifying standard
  entity_topology: flat                    # peer resources linked by FKs; no nested creation URLs
  state_machine_shape: cyclic              # Race amendment loop; Chip/Read/Result/Certification cycles; Registration parallel dims
  relationship_patterns:
    - one_to_many                          # Race->Wave/TimingPoint/Registration/...; Registration->Result/Flag
    - cross_aggregate                      # TimingRead joins TimingPoint x Chip; Correction crosses Race x TimingRead
  role_model: segregation_of_duties        # protest filer != resolver; timing locker != certification issuer
  consistency_model: immediate             # every mutation atomic in-request; derived fields recomputed synchronously

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Race
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Race display name" }
      - { name: race_date, type: datetime, source: input, description: "Scheduled race day (ISO8601 UTC); drives age_on_race_day" }
      - { name: distance_km, type: number, source: input, description: "Course distance in km; > 0; must equal the FINISH TimingPoint distance_km at lock" }
      - { name: course_type, type: enum, source: input, description: "CERTIFIED_COURSE | UNCERTIFIED_COURSE — gates certification issuance" }
      - { name: course_time_limit_minutes, type: integer, source: input, description: "Cutoff: publish requires logical now >= first STARTED wave actual_start_time + this many minutes; > 0" }
      - { name: qualifying_standard_ms, type: integer, source: input, default: null, description: "Optional qualifying threshold in ms; when set the race is a qualifying event and Result.qualified is computed" }
      - { name: status, type: enum, source: system, description: "DRAFT | REGISTRATION_OPEN | TIMING_LOCKED | IN_PROGRESS | PROVISIONAL_PUBLISHED | FINALIZED | AMENDMENT_OPEN" }
      - { name: timing_locked_at, type: datetime, source: system, default: null, description: "Logical timestamp of lock-timing; null until locked" }
      - { name: locked_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RaceDirector who locked timing (SoD reference for certification)" }
      - { name: timing_config_fingerprint, type: string, source: system, default: null, description: "Fingerprint captured at lock: 'point_index:kind:distance_km' joined by ',' over DEPLOYED points sorted by point_index ASC" }
      - { name: provisional_published_at, type: datetime, source: system, default: null, description: "Logical timestamp of the most recent publish-results" }
      - { name: protest_window_closes_at, type: datetime, source: system, default: null, description: "provisional_published_at + PROTEST_WINDOW_MINUTES; protest filing requires logical now strictly before this" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Logical timestamp of the most recent finalize-results" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Number of approved corrections; increments on each correction approval" }

  - name: Wave
    parent: null
    common_fields: true
    fields:
      - { name: race_id, type: string, source: input, description: "FK -> Race.id" }
      - { name: wave_index, type: integer, source: input, description: "Start ordinal within the race; unique among all Waves of the race; >= 1" }
      - { name: scheduled_start_time, type: datetime, source: input, description: "Planned start; must be >= WAVE_GAP_MINUTES away from every other wave of the race" }
      - { name: max_capacity, type: integer, source: input, description: "Max non-WITHDRAWN registrations in this wave; > 0" }
      - { name: actual_start_time, type: datetime, source: system, default: null, description: "Logical now at wave start; gun-time basis for registrations of this wave" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | STARTED" }

  - name: TimingPoint
    parent: null
    common_fields: true
    fields:
      - { name: race_id, type: string, source: input, description: "FK -> Race.id" }
      - { name: point_index, type: integer, source: input, description: "Course ordinal; unique among all TimingPoints of the race; >= 1; strictly increasing with distance_km" }
      - { name: kind, type: enum, source: input, description: "START | SPLIT | FINISH" }
      - { name: distance_km, type: number, source: input, description: "Distance from start; 0 for START; race.distance_km for FINISH; strictly between for SPLIT" }
      - { name: device_id, type: string, source: input, description: "Physical mat device identifier; deployment windows of the same device_id must not overlap (half-open)" }
      - { name: deploy_at, type: datetime, source: input, description: "Deployment window start (inclusive)" }
      - { name: expected_teardown_at, type: datetime, source: input, description: "Deployment window end (exclusive); must be > deploy_at" }
      - { name: status, type: enum, source: system, description: "PLANNED | DEPLOYED" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: race_id, type: string, source: input, description: "FK -> Race.id" }
      - { name: wave_id, type: string, source: input, description: "FK -> Wave.id; wave must belong to race_id" }
      - { name: chip_id, type: string, source: system, default: null, description: "FK -> Chip.id; set by assign-chip, cleared by withdraw / chip deassign" }
      - { name: bib_number, type: string, source: input, description: "Bib; unique among all Registrations of the race (any lifecycle_status)" }
      - { name: participant_name, type: string, source: input, description: "Full name" }
      - { name: birth_date, type: string, source: input, description: "YYYY-MM-DD; must be strictly before race.race_date" }
      - { name: gender, type: enum, source: input, description: "M | F — award category axis" }
      - { name: lifecycle_status, type: enum, source: system, description: "REGISTERED | CONFIRMED | CHECKED_IN | WITHDRAWN — independent dimension 1" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED — independent dimension 2; gates CONFIRMED" }
      - { name: age_on_race_day, type: integer, source: computed, description: "Full years from birth_date to race.race_date (birthday-not-yet-occurred adjustment); computed at creation" }
      - { name: age_group, type: string, source: computed, description: "Bracket label: '1-19' if age < 20; '80+' if age >= 80; else '5*floor(age/5)-5*floor(age/5)+4'" }

  - name: Chip
    parent: null
    common_fields: true
    fields:
      - { name: chip_code, type: string, source: input, description: "Fleet-wide unique chip code" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | LOST" }
      - { name: current_registration_id, type: string, source: system, default: null, description: "FK -> Registration.id; set on assignment, cleared on deassign/withdraw" }

  - name: TimingRead
    parent: null
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: timing_point_id, type: string, source: input, description: "FK -> TimingPoint.id" }
      - { name: chip_id, type: string, source: input, description: "FK -> Chip.id" }
      - { name: read_timestamp, type: datetime, source: input, description: "Device-stamped crossing time (ISO8601 UTC, ms precision)" }
      - { name: status, type: enum, source: system, description: "SCORED | REJECTED | EXCLUDED — classified at ingest; EXCLUDED/SCORED flips via corrections" }
      - { name: reject_reason, type: string, source: system, default: null, description: "Set when REJECTED at ingest: CHIP_NOT_CHECKED_IN (chip not assigned to a CHECKED_IN registration of the point's race)" }
      - { name: adjusted_by_correction_id, type: string, source: system, default: null, description: "FK -> Correction.id; set when an ADJUST_READ_TIME correction rewrote read_timestamp" }

  - name: Result
    parent: null
    common_fields: true
    fields:
      - { name: race_id, type: string, source: system, description: "FK -> Race.id; denormalized from registration for race-scoped queries" }
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; exactly one Result per registration" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | OFFICIAL | AMENDED | EXCLUDED" }
      - { name: exclusion_reason, type: enum, source: system, default: null, description: "DNF | DQ | COURSE_CUT_SUSPECT — set from the CONFIRMED flag that excluded this result" }
      - { name: chip_time_ms, type: integer, source: computed, default: null, description: "finish read - start read (latest SCORED START before finish); null when no SCORED START or no SCORED FINISH" }
      - { name: gun_time_ms, type: integer, source: computed, default: null, description: "finish read - wave.actual_start_time; null when wave not STARTED or no SCORED FINISH" }
      - { name: finish_timestamp, type: datetime, source: computed, default: null, description: "Earliest SCORED FINISH read_timestamp; tie-break input" }
      - { name: completed_splits, type: integer, source: computed, description: "Count of distinct SPLIT TimingPoints with at least one SCORED read" }
      - { name: overall_rank_gun, type: integer, source: computed, default: null, description: "1..N over eligible finishers by gun_time_ms; null if ineligible/unranked" }
      - { name: age_group_rank_chip, type: integer, source: computed, default: null, description: "1..N within age_group x gender by chip_time_ms; null if ineligible/unranked" }
      - { name: qualified, type: boolean, source: computed, default: false, description: "race.qualifying_standard_ms set AND status != EXCLUDED AND chip_time_ms <= qualifying_standard_ms" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments on every recompute that changes any computed field" }

  - name: ResultFlag
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: flag_type, type: enum, source: input, description: "DNF | DQ | COURSE_CUT_SUSPECT" }
      - { name: origin, type: enum, source: system, description: "AUTO (system detection) | MANUAL (RaceOfficial)" }
      - { name: status, type: enum, source: system, description: "RAISED | CONFIRMED | DISMISSED" }
      - { name: detail, type: string, source: input, default: null, description: "Free-text rationale (optional on manual raise; system-populated on AUTO)" }

  - name: Protest
    parent: null
    common_fields: true
    fields:
      - { name: race_id, type: string, source: input, description: "FK -> Race.id" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; subject athlete; must have a Result in the race" }
      - { name: timing_read_id, type: string, source: input, description: "FK -> TimingRead.id; disputed read (used as the correction target if upheld)" }
      - { name: requested_action, type: enum, source: input, description: "EXCLUDE_READ | REINSTATE_READ | ADJUST_READ_TIME — mirrors Correction.kind" }
      - { name: corrected_timestamp, type: datetime, source: input, default: null, description: "Required iff requested_action == ADJUST_READ_TIME" }
      - { name: reason, type: string, source: input, description: "Free-text grounds" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of filing RegistrationClerk (SoD: resolver must differ)" }
      - { name: status, type: enum, source: system, description: "FILED | UPHELD | DISMISSED" }
      - { name: resolved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of resolving RaceOfficial" }

  - name: Correction
    parent: null
    common_fields: true
    fields:
      - { name: race_id, type: string, source: input, description: "FK -> Race.id; OCC parent" }
      - { name: timing_read_id, type: string, source: input, description: "FK -> TimingRead.id; read to mutate; must belong to the race" }
      - { name: kind, type: enum, source: input, description: "EXCLUDE_READ | REINSTATE_READ | ADJUST_READ_TIME" }
      - { name: corrected_timestamp, type: datetime, source: input, default: null, description: "Required iff kind == ADJUST_READ_TIME" }
      - { name: reason, type: string, source: input, description: "Free-text rationale" }
      - { name: protest_id, type: string, source: system, default: null, description: "FK -> Protest.id; set when spawned by an UPHELD protest" }
      - { name: status, type: enum, source: system, description: "FILED | APPROVED | REJECTED" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of adjudicating RaceOfficial" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: race_id, type: string, source: system, description: "FK -> Race.id; exactly one Certification row per race" }
      - { name: status, type: enum, source: system, description: "ISSUED | REVOKED" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of issuing CertificationOfficer (must differ from race.locked_by_user_id)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical timestamp of (re-)issuance" }
      - { name: qualified_count, type: integer, source: computed, description: "Count of Results with qualified == true at issuance time" }
      - { name: revocation_reason, type: string, source: system, default: null, description: "Set on revocation cascade (e.g. CORRECTION_APPROVED)" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: race_id, type: string, source: system, description: "FK -> Race.id" }
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; the winner" }
      - { name: category, type: string, source: computed, description: "'OVERALL_M' | 'OVERALL_F' | 'AG_<M|F>_<age_group>' e.g. AG_F_30_34" }
      - { name: place, type: integer, source: computed, description: "1..3 within category" }
      - { name: basis, type: enum, source: computed, description: "GUN for OVERALL_* categories | CHIP for AG_* categories" }
      - { name: basis_time_ms, type: integer, source: computed, description: "The winning gun_time_ms (GUN basis) or chip_time_ms (CHIP basis)" }
      - { name: status, type: enum, source: system, description: "PROJECTED | CONFIRMED | REVOKED" }

# =============================================================================
# Table 1.2: State Machine Table (11 machines)
# =============================================================================
state_machines:
  - entity: Race
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic: FINALIZED -> AMENDMENT_OPEN -> PROVISIONAL_PUBLISHED -> FINALIZED (amendment loop)"
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /race-timing/races/{race_id}/open-registration"
        actor: RaceDirector
        preconditions:
          - "Race.status == DRAFT"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: TIMING_LOCKED
        trigger: "POST /race-timing/races/{race_id}/lock-timing"
        actor: RaceDirector
        preconditions:
          - "At least one Wave exists for the race"
          - "Exactly one TimingPoint with kind == START and status == DEPLOYED exists"
          - "Exactly one TimingPoint with kind == FINISH and status == DEPLOYED exists, and its distance_km == race.distance_km"
          - "No TimingPoint of the race remains in PLANNED"
        side_effects:
          - "timing_locked_at := logical now; locked_by_user_id := X-User-ID"
          - "timing_config_fingerprint := fingerprint of DEPLOYED points sorted by point_index ASC"
          - "Registration intake closes (race no longer accepts register/pay/confirm)"
      - from: TIMING_LOCKED
        to: IN_PROGRESS
        trigger: "system (first POST /race-timing/waves/{wave_id}/start on a wave of this race)"
        actor: system
        preconditions:
          - "At least one Wave of the race transitions SCHEDULED -> STARTED"
        side_effects: []
      - from: IN_PROGRESS
        to: PROVISIONAL_PUBLISHED
        trigger: "POST /race-timing/races/{race_id}/publish-results"
        actor: RaceDirector
        preconditions:
          - "expected_race_version == race.version (OCC)"
          - "At least one Wave of the race is STARTED"
          - "logical now >= min(actual_start_time over STARTED waves) + course_time_limit_minutes"
        side_effects:
          - "Full 4-phase recompute (calc ranking_with_exclusions): Result rows created PROVISIONAL for every CHECKED_IN registration"
          - "AUTO flags raised: DNF for CHECKED_IN without SCORED FINISH read; COURSE_CUT_SUSPECT for missing intermediate splits"
          - "Awards recomputed (calc award_computation): new rows PROJECTED"
          - "provisional_published_at := now; protest_window_closes_at := now + PROTEST_WINDOW_MINUTES"
          - "increments Race.version by 1"
      - from: AMENDMENT_OPEN
        to: PROVISIONAL_PUBLISHED
        trigger: "POST /race-timing/races/{race_id}/publish-results"
        actor: RaceDirector
        preconditions:
          - "expected_race_version == race.version (OCC)"
        side_effects:
          - "Full 4-phase recompute; every non-EXCLUDED Result -> PROVISIONAL; EXCLUDED Results recompute times but stay EXCLUDED and unranked"
          - "Awards recomputed: non-REVOKED Awards whose (category, place) winner changed -> REVOKED; replacement rows created PROJECTED"
          - "provisional_published_at := now; protest_window_closes_at := now + PROTEST_WINDOW_MINUTES (window re-opens)"
          - "increments Race.version by 1"
      - from: PROVISIONAL_PUBLISHED
        to: FINALIZED
        trigger: "POST /race-timing/races/{race_id}/finalize-results"
        actor: RaceDirector
        preconditions:
          - "logical now >= protest_window_closes_at"
          - "No Protest of the race in FILED"
          - "No ResultFlag on any registration of the race in RAISED"
        side_effects:
          - "Results PROVISIONAL -> OFFICIAL (AMENDED results are republished PROVISIONAL first; finalize only from PROVISIONAL_PUBLISHED)"
          - "Awards PROJECTED -> CONFIRMED"
          - "finalized_at := logical now"
      - from: PROVISIONAL_PUBLISHED
        to: AMENDMENT_OPEN
        trigger: "system (Correction APPROVED, incl. via UPHELD protest)"
        actor: system
        preconditions: []
        side_effects:
          - "amendment_count += 1"
          - "Certification of the race in ISSUED -> REVOKED, revocation_reason := CORRECTION_APPROVED"
      - from: FINALIZED
        to: AMENDMENT_OPEN
        trigger: "system (Correction APPROVED, incl. via UPHELD protest)"
        actor: system
        preconditions: []
        side_effects:
          - "amendment_count += 1"
          - "Certification of the race in ISSUED -> REVOKED, revocation_reason := CORRECTION_APPROVED"

  - entity: Wave
    initial_state: SCHEDULED
    terminal_states: [STARTED]
    transitions:
      - from: SCHEDULED
        to: STARTED
        trigger: "POST /race-timing/waves/{wave_id}/start"
        actor: TimingOperator
        preconditions:
          - "Race of the wave in TIMING_LOCKED or IN_PROGRESS"
        side_effects:
          - "actual_start_time := logical now"
          - "If Race TIMING_LOCKED: Race -> IN_PROGRESS"

  - entity: TimingPoint
    initial_state: PLANNED
    terminal_states: []
    note: "DELETE removes the row pre-lock; post-lock create/deploy/delete are all blocked"
    transitions:
      - from: PLANNED
        to: DEPLOYED
        trigger: "POST /race-timing/timing-points/{point_id}/deploy"
        actor: TimingOperator
        preconditions:
          - "Race of the point in DRAFT or REGISTRATION_OPEN (pre-lock)"
        side_effects: []

  - entity: Registration
    initial_state: "REGISTERED (lifecycle) / UNPAID (payment)"
    terminal_states: [WITHDRAWN]
    note: "Parallel dimensions: lifecycle_status and payment_status evolve independently; CONFIRMED gated by payment_status == PAID"
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /race-timing/registrations/{reg_id}/pay (payment dimension)"
        actor: RegistrationClerk
        preconditions:
          - "lifecycle_status != WITHDRAWN"
          - "Race in REGISTRATION_OPEN"
        side_effects: []
      - from: REGISTERED
        to: CONFIRMED
        trigger: "POST /race-timing/registrations/{reg_id}/confirm (lifecycle dimension)"
        actor: RegistrationClerk
        preconditions:
          - "payment_status == PAID"
          - "Race in REGISTRATION_OPEN"
        side_effects: []
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /race-timing/registrations/{reg_id}/assign-chip (lifecycle dimension)"
        actor: RegistrationClerk
        preconditions:
          - "chip_id is null"
          - "Chip.status == AVAILABLE"
          - "Race in TIMING_LOCKED or IN_PROGRESS"
        side_effects:
          - "chip_id := chip; Chip.status -> ASSIGNED; Chip.current_registration_id := registration"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /race-timing/registrations/{reg_id}/withdraw"
        actor: RegistrationClerk
        preconditions:
          - "Race not in IN_PROGRESS / PROVISIONAL_PUBLISHED / FINALIZED / AMENDMENT_OPEN"
        side_effects:
          - "If payment_status == PAID: payment_status -> REFUNDED"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /race-timing/registrations/{reg_id}/withdraw"
        actor: RegistrationClerk
        preconditions:
          - "Race not in IN_PROGRESS / PROVISIONAL_PUBLISHED / FINALIZED / AMENDMENT_OPEN"
        side_effects:
          - "If payment_status == PAID: payment_status -> REFUNDED"
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /race-timing/registrations/{reg_id}/withdraw"
        actor: RegistrationClerk
        preconditions:
          - "Race not in IN_PROGRESS / PROVISIONAL_PUBLISHED / FINALIZED / AMENDMENT_OPEN"
        side_effects:
          - "Chip (chip_id) -> AVAILABLE; Chip.current_registration_id := null; chip_id := null"
          - "If payment_status == PAID: payment_status -> REFUNDED"

  - entity: Chip
    initial_state: AVAILABLE
    terminal_states: [LOST]
    note: "Cycle AVAILABLE -> ASSIGNED -> AVAILABLE via deassign RETURNED"
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system (POST /race-timing/registrations/{reg_id}/assign-chip)"
        actor: system
        preconditions: []
        side_effects:
          - "current_registration_id := registration; registration.chip_id := chip"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /race-timing/chips/{chip_id}/deassign {disposition: RETURNED} or system (withdraw of current registration)"
        actor: RegistrationClerk
        preconditions: []
        side_effects:
          - "current registration keeps lifecycle CHECKED_IN when disposition == RETURNED; chip_id and current_registration_id cleared"
      - from: ASSIGNED
        to: LOST
        trigger: "POST /race-timing/chips/{chip_id}/deassign {disposition: LOST}"
        actor: RegistrationClerk
        preconditions: []
        side_effects:
          - "current registration lifecycle CHECKED_IN -> CONFIRMED (must re-check-in with a new chip); chip_id and current_registration_id cleared"

  - entity: TimingRead
    initial_state: "SCORED or REJECTED (classified at ingest)"
    terminal_states: [REJECTED]
    note: "Cycle SCORED -> EXCLUDED -> SCORED via corrections; REJECTED at ingest is terminal"
    transitions:
      - from: SCORED
        to: EXCLUDED
        trigger: "system (Correction kind EXCLUDE_READ APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Full result/award recompute for the race (see Correction transition)"
      - from: EXCLUDED
        to: SCORED
        trigger: "system (Correction kind REINSTATE_READ APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Full result/award recompute for the race"
      - from: SCORED
        to: SCORED
        trigger: "system (Correction kind ADJUST_READ_TIME APPROVED) — read_timestamp rewritten, adjusted_by_correction_id set"
        actor: system
        preconditions: []
        side_effects:
          - "Full result/award recompute for the race"

  - entity: Result
    initial_state: PROVISIONAL
    terminal_states: []
    note: "Cycle OFFICIAL -> AMENDED -> PROVISIONAL -> OFFICIAL; EXCLUDED persists across republish"
    transitions:
      - from: PROVISIONAL
        to: OFFICIAL
        trigger: "system (finalize-results)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFICIAL
        to: AMENDED
        trigger: "system (Correction APPROVED: recompute changes at least one computed field)"
        actor: system
        preconditions: []
        side_effects:
          - "revision += 1"
      - from: AMENDED
        to: PROVISIONAL
        trigger: "system (re-publish from AMENDMENT_OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVISIONAL
        to: EXCLUDED
        trigger: "system (ResultFlag CONFIRMED for the registration)"
        actor: system
        preconditions: []
        side_effects:
          - "exclusion_reason := flag_type; ranks nulled; ranks/awards recomputed"
      - from: OFFICIAL
        to: EXCLUDED
        trigger: "system (ResultFlag CONFIRMED for the registration while race FINALIZED — only reachable inside amendment recompute)"
        actor: system
        preconditions: []
        side_effects:
          - "exclusion_reason := flag_type; ranks nulled; ranks/awards recomputed"

  - entity: ResultFlag
    initial_state: RAISED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: RAISED
        to: CONFIRMED
        trigger: "POST /race-timing/result-flags/{flag_id}/resolve {outcome: CONFIRMED}"
        actor: RaceOfficial
        preconditions:
          - "Race of the registration in IN_PROGRESS, PROVISIONAL_PUBLISHED or AMENDMENT_OPEN"
        side_effects:
          - "If race in PROVISIONAL_PUBLISHED or AMENDMENT_OPEN: Result -> EXCLUDED, ranks/awards recomputed (cascade C2)"
      - from: RAISED
        to: DISMISSED
        trigger: "POST /race-timing/result-flags/{flag_id}/resolve {outcome: DISMISSED}"
        actor: RaceOfficial
        preconditions:
          - "Race of the registration in IN_PROGRESS, PROVISIONAL_PUBLISHED or AMENDMENT_OPEN"
        side_effects: []

  - entity: Protest
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /race-timing/protests/{protest_id}/resolve {outcome: UPHELD}"
        actor: RaceOfficial
        preconditions:
          - "Race in PROVISIONAL_PUBLISHED"
          - "resolved_by_user_id != filed_by_user_id (SoD)"
        side_effects:
          - "System creates Correction (kind := requested_action, timing_read_id, corrected_timestamp, protest_id := protest) already APPROVED"
          - "Full correction-approval cascade C1 runs: read mutation -> recompute -> awards -> Race -> AMENDMENT_OPEN -> Certification REVOKED if ISSUED"
      - from: FILED
        to: DISMISSED
        trigger: "POST /race-timing/protests/{protest_id}/resolve {outcome: DISMISSED}"
        actor: RaceOfficial
        preconditions:
          - "Race in PROVISIONAL_PUBLISHED"
          - "resolved_by_user_id != filed_by_user_id (SoD)"
        side_effects: []

  - entity: Correction
    initial_state: FILED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /race-timing/corrections/{correction_id}/adjudicate {decision: APPROVED, expected_race_version}"
        actor: RaceOfficial
        preconditions:
          - "expected_race_version == race.version (OCC)"
          - "Race in PROVISIONAL_PUBLISHED, FINALIZED or AMENDMENT_OPEN"
          - "Kind-actionable: EXCLUDE_READ requires read SCORED; REINSTATE_READ requires read EXCLUDED; ADJUST_READ_TIME requires read SCORED and corrected_timestamp present"
        side_effects:
          - "Read mutation applied (TimingRead transitions)"
          - "Full 4-phase result recompute; changed OFFICIAL Results -> AMENDED (revision += 1)"
          - "Awards recomputed: stale non-REVOKED rows -> REVOKED; replacements PROJECTED (or CONFIRMED-matching only after re-finalize)"
          - "Race -> AMENDMENT_OPEN; amendment_count += 1; Certification ISSUED -> REVOKED (cascade C1)"
          - "increments Race.version by 1"
      - from: FILED
        to: REJECTED
        trigger: "POST /race-timing/corrections/{correction_id}/adjudicate {decision: REJECTED, expected_race_version}"
        actor: RaceOfficial
        preconditions:
          - "expected_race_version == race.version (OCC)"
          - "Race in PROVISIONAL_PUBLISHED, FINALIZED or AMENDMENT_OPEN"
        side_effects:
          - "increments Race.version by 1"

  - entity: Certification
    initial_state: ISSUED
    terminal_states: []
    note: "One row per race; cycle ISSUED -> REVOKED -> ISSUED (re-certify after re-finalize)"
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "system (Race -> AMENDMENT_OPEN via approved correction)"
        actor: system
        preconditions: []
        side_effects:
          - "revocation_reason := CORRECTION_APPROVED"
      - from: REVOKED
        to: ISSUED
        trigger: "POST /race-timing/races/{race_id}/certify (row reused)"
        actor: CertificationOfficer
        preconditions:
          - "Race in FINALIZED"
          - "course_type == CERTIFIED_COURSE"
          - "No Protest FILED; no ResultFlag RAISED (implied by FINALIZED precondition, re-checked)"
          - "X-User-ID != race.locked_by_user_id (SoD)"
        side_effects:
          - "issued_at := now; issued_by_user_id := X-User-ID; qualified_count recomputed; revocation_reason := null"

  - entity: Award
    initial_state: PROJECTED
    terminal_states: [REVOKED]
    transitions:
      - from: PROJECTED
        to: CONFIRMED
        trigger: "system (finalize-results)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROJECTED
        to: REVOKED
        trigger: "system (recompute swaps the (category, place) winner before finalize)"
        actor: system
        preconditions: []
        side_effects:
          - "Replacement Award row created PROJECTED for the new winner"
      - from: CONFIRMED
        to: REVOKED
        trigger: "system (amendment recompute swaps the (category, place) winner after finalize)"
        actor: system
        preconditions: []
        side_effects:
          - "Replacement Award row created PROJECTED; CONFIRMED only after re-finalize"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on Race.version only)
# =============================================================================
concurrency_rules:
  - rule_id: publish-results-stale-race
    parent_entity: Race
    write_endpoint: "POST /race-timing/races/{race_id}/publish-results"
    occ_field: expected_race_version
    description: |
      Publishing (or re-publishing) results against a Race whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just adjudicated a correction (which bumps
      Race.version and re-opens amendment) and the publishing client's view of
      the race is therefore stale.
    error_id: ERR_STALE_RACE_VERSION
    http_status: 412
  - rule_id: correction-adjudication-stale-race
    parent_entity: Race
    write_endpoint: "POST /race-timing/corrections/{correction_id}/adjudicate"
    occ_field: expected_race_version
    description: |
      Adjudicating a Correction against a Race whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      prior adjudication or publish has already advanced Race.version, so the
      current writer's view of the race is stale.
    error_id: ERR_STALE_RACE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table (8 rules)
# =============================================================================
calculations:
  - name: time_derivation
    trigger: "result recompute (publish-results, correction approval, flag confirmation) and live-board read"
    algorithm: chronological
    formula: |
      For registration r with chip c in race R:
      start_read  = SCORED read of c at R's START TimingPoint with the LATEST
                    read_timestamp strictly before finish_timestamp; null if none.
      finish_read = SCORED read of c at R's FINISH TimingPoint with the EARLIEST
                    read_timestamp; null if none.
      chip_time_ms = finish_read.read_timestamp - start_read.read_timestamp; null if either missing.
      gun_time_ms  = finish_read.read_timestamp - r.wave.actual_start_time;
                     null if finish_read missing or r.wave.actual_start_time is null.
      completed_splits = count of distinct SPLIT TimingPoints of R having >= 1 SCORED read of c.
      finish_timestamp = finish_read.read_timestamp (tie-break input).
      EXCLUDED reads never contribute; REJECTED reads never contribute.
    input_set: "TimingReads with status == SCORED for chips currently assigned to CHECKED_IN registrations of the race"
    constants:
      MS_PER_SECOND: 1000
    precision: "integer milliseconds; no rounding"

  - name: ranking_with_exclusions
    trigger: "publish-results, correction approval, flag confirmation (full race recompute)"
    algorithm: aggregation
    formula: |
      Pinned 4-phase evaluation order (resolves the flag->exclusion->rank cycle):
      Phase 1 DERIVE: run time_derivation for every registration with lifecycle_status == CHECKED_IN.
      Phase 2 EXCLUDE: a registration is EXCLUDED iff it has >= 1 ResultFlag with
        status == CONFIRMED (any flag_type); exclusion_reason := flag_type of the
        earliest-created CONFIRMED flag (created_at ASC). Registrations with
        chip_time_ms == null are UNRANKED (no rank, not excluded).
      Phase 3 RANK:
        gun order: eligible (non-excluded) AND gun_time_ms != null; sort by
          gun_time_ms ASC, tie -> finish_timestamp ASC, tie -> registration.created_at ASC.
          overall_rank_gun := 1..N strict.
        chip order per (gender, age_group): eligible AND chip_time_ms != null; sort by
          chip_time_ms ASC, tie -> finish_timestamp ASC, tie -> registration.created_at ASC.
          age_group_rank_chip := 1..M strict within the category.
      Phase 4 WRITE: write ranks, times, completed_splits, qualified
        (race.qualifying_standard_ms != null AND not excluded AND
         chip_time_ms <= qualifying_standard_ms; boundary is INCLUSIVE).
      Rank-set invariant: ranks within each ranking form exactly 1..K with no gaps.
    input_set: "CHECKED_IN registrations of the race; CONFIRMED ResultFlags; SCORED reads"
    constants: {}
    precision: "integer ranks; integer ms"
    variants:
      - name: rank_by_gun
        when: "OVERALL_M / OVERALL_F award categories"
        difference: "Orders by gun_time_ms (wave actual start basis); a later-wave athlete with a faster chip time still loses to an earlier-wave athlete with a faster gun time."
      - name: rank_by_chip
        when: "AG_<gender>_<age_group> award categories and qualified flag"
        difference: "Orders by chip_time_ms (personal mat-to-mat basis); identical finish data can yield a different category winner than rank_by_gun."

  - name: age_group_categorization
    trigger: "registration creation"
    algorithm: threshold
    formula: |
      age = race.race_date.year - birth_date.year;
            if (race_date.month, race_date.day) < (birth_date.month, birth_date.day): age -= 1.
      bracket: age < 20 -> "1-19"; age >= 80 -> "80+";
               else lo = 5 * floor(age / 5); label = "<lo>-<lo+4>".
      age_group := bracket; award category := "AG_<gender>_<bracket with '-'->'_'>".
      Boundary precision: age == 20 exactly -> bracket "20-24" (NOT "1-19");
      age == 80 exactly -> "80+" (NOT "75-79").
    input_set: "the registration's birth_date and race.race_date"
    constants:
      BRACKET_WIDTH: 5
      MIN_OPEN_BRACKET_AGE: 20
      MASTERS_BRACKET_AGE: 80
    precision: "integer years"

  - name: award_computation
    trigger: "result recompute (publish, correction approval, flag confirmation)"
    algorithm: waterfall_allocation
    formula: |
      For race R, after ranking_with_exclusions completes:
      Categories := {OVERALL_M, OVERALL_F} union {AG_<g>_<b> for each (gender g, age_group b)
                    present among eligible ranked finishers}.
      OVERALL_M / OVERALL_F: basis GUN; candidates ordered by overall_rank_gun ASC.
      AG_*: basis CHIP; candidates ordered by age_group_rank_chip ASC.
      For each category, places 1..min(AWARD_DEPTH, eligible_count) get an Award row
      (category, place, winner registration_id, basis, basis_time_ms).
      Empty eligible set -> no rows for the category.
      Swap rule: an existing non-REVOKED Award whose (race, category, place) winner
      differs from the new computation -> REVOKED; new row created PROJECTED.
      An existing non-REVOKED Award that still matches is kept unchanged.
      At most one non-REVOKED Award exists per (race, category, place) at all times.
    input_set: "ranked, non-excluded Results of the race (post Phase 3)"
    constants:
      AWARD_DEPTH: 3
    precision: "integer places"

  - name: course_cut_detection
    trigger: "each TimingRead ingest that classifies SCORED, and publish-results (missing-split sweep)"
    algorithm: threshold
    formula: |
      Pace check (per ingested SCORED read at TimingPoint P for registration r):
        if P.kind in {SPLIT, FINISH} and a SCORED START read s for r exists with
        s.read_timestamp < read.read_timestamp:
          elapsed_ms = read.read_timestamp - s.read_timestamp
          floor_ms = P.distance_km * MIN_PACE_SEC_PER_KM * 1000
          if elapsed_ms < floor_ms -> raise AUTO COURSE_CUT_SUSPECT (RAISED) for r
          Boundary: elapsed_ms == floor_ms -> NO flag (strict less-than).
        Skip silently when no SCORED START read exists yet.
      Missing-split sweep (at publish): for each CHECKED_IN registration r, let
        k = max point_index with a SCORED read; if any SPLIT TimingPoint with
        point_index j < k has no SCORED read for r -> raise AUTO COURSE_CUT_SUSPECT.
      Dedupe: at most one non-resolved (RAISED) AUTO COURSE_CUT_SUSPECT per
        registration; a CONFIRMED one suppresses further AUTO raises.
    input_set: "SCORED reads of the registration; TimingPoints of the race"
    constants:
      MIN_PACE_SEC_PER_KM: 120
    precision: "integer ms comparison"

  - name: dnf_detection
    trigger: "publish-results"
    algorithm: threshold
    formula: |
      Publish precondition: logical now >= min(actual_start_time over STARTED waves)
        + course_time_limit_minutes (inclusive; equality satisfies).
      At publish, every CHECKED_IN registration with no SCORED FINISH read gets an
      AUTO DNF flag (RAISED). Dedupe: at most one non-resolved AUTO DNF per registration.
    input_set: "CHECKED_IN registrations of the race; SCORED FINISH reads"
    constants: {}
    precision: "inclusive >= boundary on the cutoff"

  - name: live_board_projection
    trigger: "GET /race-timing/races/{race_id}/live-board"
    algorithm: forward_looking
    formula: |
      For each CHECKED_IN, non-excluded registration r with a SCORED START read:
      Order r's SCORED reads by TimingPoint.point_index ASC (dedupe per point:
      earliest read at that point).
      seg_pace_i (sec/km) = round_half_up((ts_i - ts_{i-1}) / (d_i - d_{i-1}))
        for each consecutive pair — ROUND PER SEGMENT to integer sec/km FIRST.
      projected_pace = round_half_up(mean of the last two seg_pace values);
        with only one segment, projected_pace := that segment's pace.
      remaining_km = race.distance_km - d_last.
      projected_remaining_sec = round_half_up(remaining_km * projected_pace).
      projected_total_sec = elapsed_last_sec + projected_remaining_sec,
        where elapsed_last_sec = round_half_up((ts_last - ts_start)/1000).
      Board order: projected_total_sec ASC, tie -> elapsed_last_sec ASC,
        tie -> registration.created_at ASC.
      Registrations without a SCORED START read, or already finished (SCORED FINISH
      read present), are listed separately: finishers by chip_time_ms ASC.
      NESTED ROUNDING IS PINNED: per-segment rounding precedes the mean; the mean
      is rounded before multiplying by remaining_km. Computing unrounded-then-
      rounding-at-end yields different seconds and is non-conformant.
    input_set: "SCORED reads of live race; CHECKED_IN non-excluded registrations"
    constants: {}
    precision: "integer seconds, round_half_up at each pinned step"

  - name: protest_window
    trigger: "publish-results (opens), protest creation and finalize-results (check)"
    algorithm: threshold
    formula: |
      protest_window_closes_at = provisional_published_at + PROTEST_WINDOW_MINUTES.
      Protest filing requires logical now < protest_window_closes_at (STRICT;
      at equality -> ERR_PROTEST_WINDOW_CLOSED).
      Finalize requires logical now >= protest_window_closes_at (INCLUSIVE;
      at equality finalization succeeds).
    input_set: "race timestamps and logical clock"
    constants:
      PROTEST_WINDOW_MINUTES: 30
    precision: "second-precision logical clock"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id in the path and every *-id field in the body resolves to an existing resource, validated left-to-right (path first, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists (incl. race-phase gates such as ERR_RACE_REGISTRATION_CLOSED, ERR_RACE_ALREADY_STARTED, ERR_READ_INGEST_CLOSED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 41
    category: state
    check: "Race-phase gate: register/pay/confirm require race in REGISTRATION_OPEN"
    error_id: ERR_RACE_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /race-timing/registrations; POST /race-timing/registrations/{reg_id}/pay; POST /race-timing/registrations/{reg_id}/confirm"
  - priority: 42
    category: state
    check: "Race-phase gate: withdraw requires race not yet IN_PROGRESS (or later)"
    error_id: ERR_RACE_ALREADY_STARTED
    http_status: 409
    applies_to: "POST /race-timing/registrations/{reg_id}/withdraw"
  - priority: 43
    category: state
    check: "Race-phase gate: read ingest requires race in IN_PROGRESS / PROVISIONAL_PUBLISHED / AMENDMENT_OPEN"
    error_id: ERR_READ_INGEST_CLOSED
    http_status: 409
    applies_to: "POST /race-timing/timing-reads"
  - priority: 44
    category: state
    check: "ResultFlag create/resolve require the registration's race in IN_PROGRESS / PROVISIONAL_PUBLISHED / AMENDMENT_OPEN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /race-timing/result-flags; POST /race-timing/result-flags/{flag_id}/resolve"
  - priority: 5
    category: state
    check: "OCC: expected_race_version == current race.version on publish-results and correction adjudicate"
    error_id: ERR_STALE_RACE_VERSION
    http_status: 412
    applies_to: "POST /race-timing/races/{race_id}/publish-results; POST /race-timing/corrections/{correction_id}/adjudicate"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: protest resolver X-User-ID != protest.filed_by_user_id; certification issuer X-User-ID != race.locked_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /race-timing/protests/{protest_id}/resolve; POST /race-timing/races/{race_id}/certify"
  - priority: 7
    category: business_temporal
    check: "Protest filing requires logical now < race.protest_window_closes_at (strict)"
    error_id: ERR_PROTEST_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /race-timing/protests"
  - priority: 8
    category: business_temporal
    check: "Finalize requires logical now >= protest_window_closes_at (inclusive)"
    error_id: ERR_PROTEST_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /race-timing/races/{race_id}/finalize-results"
  - priority: 9
    category: business_temporal
    check: "Publish requires logical now >= min(actual_start_time of STARTED waves) + course_time_limit_minutes"
    error_id: ERR_RACE_CUTOFF_NOT_REACHED
    http_status: 409
    applies_to: "POST /race-timing/races/{race_id}/publish-results"
  - priority: 10
    category: business_temporal
    check: "New wave scheduled_start_time must be >= WAVE_GAP_MINUTES away from every existing wave's scheduled_start_time of the same race (absolute difference; equality allowed)"
    error_id: ERR_WAVE_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /race-timing/waves"
  - priority: 11
    category: business_temporal
    check: "Same device_id: deployment windows [deploy_at, expected_teardown_at) must not overlap across all TimingPoints (half-open; teardown == deploy adjacency allowed)"
    error_id: ERR_DEVICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /race-timing/timing-points"
  - priority: 12
    category: business_temporal
    check: "TimingPoint deploy_at < expected_teardown_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /race-timing/timing-points"
  - priority: 13
    category: business_constraint
    check: "TimingPoint create/deploy/delete only while race in DRAFT or REGISTRATION_OPEN (config frozen at lock)"
    error_id: ERR_TIMING_CONFIG_LOCKED
    http_status: 409
    applies_to: "POST /race-timing/timing-points; POST /race-timing/timing-points/{point_id}/deploy; DELETE /race-timing/timing-points/{point_id}"
  - priority: 14
    category: business_constraint
    check: "Lock-timing requires >= 1 wave, exactly one DEPLOYED START, exactly one DEPLOYED FINISH with distance_km == race.distance_km, zero PLANNED points"
    error_id: ERR_TIMING_CONFIG_INCOMPLETE
    http_status: 409
    applies_to: "POST /race-timing/races/{race_id}/lock-timing"
  - priority: 15
    category: business_constraint
    check: "wave_index unique among the race's waves"
    error_id: ERR_WAVE_INDEX_TAKEN
    http_status: 409
    applies_to: "POST /race-timing/waves"
  - priority: 16
    category: business_constraint
    check: "bib_number unique among the race's registrations (all lifecycle statuses)"
    error_id: ERR_BIB_NUMBER_TAKEN
    http_status: 409
    applies_to: "POST /race-timing/registrations"
  - priority: 17
    category: business_constraint
    check: "chip_code unique fleet-wide"
    error_id: ERR_CHIP_CODE_TAKEN
    http_status: 409
    applies_to: "POST /race-timing/chips"
  - priority: 18
    category: business_constraint
    check: "assign-chip: chip.status == AVAILABLE"
    error_id: ERR_CHIP_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /race-timing/registrations/{reg_id}/assign-chip"
  - priority: 19
    category: business_constraint
    check: "assign-chip: registration.chip_id is null"
    error_id: ERR_CHIP_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /race-timing/registrations/{reg_id}/assign-chip"
  - priority: 20
    category: business_constraint
    check: "Timing read ingest dedupe: identical (timing_point_id, chip_id, read_timestamp) already exists"
    error_id: ERR_DUPLICATE_READ
    http_status: 409
    applies_to: "POST /race-timing/timing-reads"
  - priority: 21
    category: business_constraint
    check: "Correction kind actionable on target read: EXCLUDE_READ needs SCORED; REINSTATE_READ needs EXCLUDED; ADJUST_READ_TIME needs SCORED + corrected_timestamp"
    error_id: ERR_CORRECTION_KIND_MISMATCH
    http_status: 409
    applies_to: "POST /race-timing/corrections; POST /race-timing/corrections/{correction_id}/adjudicate"
  - priority: 22
    category: business_constraint
    check: "deassign requires chip.status == ASSIGNED"
    error_id: ERR_CHIP_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /race-timing/chips/{chip_id}/deassign"
  - priority: 23
    category: business_referential
    check: "Finalize requires zero FILED protests of the race"
    error_id: ERR_PROTESTS_OUTSTANDING
    http_status: 409
    applies_to: "POST /race-timing/races/{race_id}/finalize-results"
  - priority: 24
    category: business_referential
    check: "Finalize requires zero RAISED result-flags on registrations of the race"
    error_id: ERR_FLAGS_OUTSTANDING
    http_status: 409
    applies_to: "POST /race-timing/races/{race_id}/finalize-results"
  - priority: 25
    category: business_referential
    check: "Certify requires race.course_type == CERTIFIED_COURSE"
    error_id: ERR_COURSE_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /race-timing/races/{race_id}/certify"
  - priority: 26
    category: business_referential
    check: "Protest subject registration must have a Result row in the race; protest timing_read must belong to the race"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /race-timing/protests"
  - priority: 27
    category: business_fiscal
    check: "Registration requires wave occupancy (non-WITHDRAWN registrations in wave) < wave.max_capacity"
    error_id: ERR_WAVE_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /race-timing/registrations"
  - priority: 28
    category: business_fiscal
    check: "confirm requires payment_status == PAID"
    error_id: ERR_PAYMENT_REQUIRED
    http_status: 409
    applies_to: "POST /race-timing/registrations/{reg_id}/confirm"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/race-timing/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []

  # --- Race ---
  - method: POST
    path: "/race-timing/races"
    description: "Create a race (status DRAFT)"
    roles: [RaceDirector]
    code: 201
    input: [name, race_date, distance_km, course_type, course_time_limit_minutes, "qualifying_standard_ms?"]
    output: Race
    side_effects: ["status := DRAFT; amendment_count := 0"]
  - method: GET
    path: "/race-timing/races/{race_id}"
    description: "Read a race (includes version, protest window, fingerprints)"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer, Spectator]
    code: 200
    input: []
    output: Race
    side_effects: []
  - method: GET
    path: "/race-timing/races/{id}/waves"
    description: "List waves of a race (FK reverse for Wave.race_id)"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer, Spectator]
    code: 200
    input: ["limit?", "offset?"]
    output: Wave[]
    side_effects: []
  - method: GET
    path: "/race-timing/races/{id}/timing-points"
    description: "List timing points of a race (FK reverse for TimingPoint.race_id)"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TimingPoint[]
    side_effects: []
  - method: GET
    path: "/race-timing/races/{id}/certifications"
    description: "List certifications of a race (0-1 rows; FK reverse for Certification.race_id)"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer, Spectator]
    code: 200
    input: ["limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: GET
    path: "/race-timing/races/{id}/awards"
    description: "List awards of a race (FK reverse for Award.race_id)"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer, Spectator]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: Award[]
    side_effects: []
  - method: POST
    path: "/race-timing/races/{race_id}/open-registration"
    description: "DRAFT -> REGISTRATION_OPEN"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Race
    side_effects: ["status := REGISTRATION_OPEN"]
  - method: POST
    path: "/race-timing/races/{race_id}/lock-timing"
    description: "REGISTRATION_OPEN -> TIMING_LOCKED; validates config completeness; captures fingerprint + locked_by_user_id"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Race
    side_effects: ["status := TIMING_LOCKED; timing_locked_at, locked_by_user_id, timing_config_fingerprint set"]
  - method: POST
    path: "/race-timing/races/{race_id}/publish-results"
    description: "Compute results and open/re-open the protest window. OCC-guarded."
    roles: [RaceDirector]
    code: 200
    input: [expected_race_version]
    output: Race
    side_effects:
      - "status IN_PROGRESS|AMENDMENT_OPEN -> PROVISIONAL_PUBLISHED"
      - "full ranking_with_exclusions recompute; Results upserted PROVISIONAL (EXCLUDED persist)"
      - "AUTO DNF / COURSE_CUT_SUSPECT flags raised per dnf_detection / course_cut_detection"
      - "award_computation; protest window (re)set to now + 30 minutes"
      - "increments Race.version by 1"
  - method: POST
    path: "/race-timing/races/{race_id}/finalize-results"
    description: "PROVISIONAL_PUBLISHED -> FINALIZED; gates: window closed, zero FILED protests, zero RAISED flags"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Race
    side_effects: ["Results PROVISIONAL -> OFFICIAL; Awards PROJECTED -> CONFIRMED; finalized_at := now"]
  - method: POST
    path: "/race-timing/races/{race_id}/certify"
    description: "Issue (or re-issue after revocation) the certification for a qualifying/certified race"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: Certification
    side_effects: ["Certification -> ISSUED (row created on first certify); qualified_count computed"]
  - method: GET
    path: "/race-timing/races/{race_id}/live-board"
    description: "Live results feed / spectator tracking: projected standings via live_board_projection; optional bib filter for tracking specific athletes"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer, Spectator]
    code: 200
    input: ["bib_number?"]
    output: { entries: array, generated_at: datetime }
    side_effects: []

  # --- Wave ---
  - method: POST
    path: "/race-timing/waves"
    description: "Create a wave (SCHEDULED); enforces spacing gap and wave_index uniqueness"
    roles: [RaceDirector]
    code: 201
    input: [race_id, wave_index, scheduled_start_time, max_capacity]
    output: Wave
    side_effects: ["status := SCHEDULED"]
  - method: POST
    path: "/race-timing/waves/{wave_id}/start"
    description: "SCHEDULED -> STARTED; stamps actual_start_time := logical now; first start moves Race TIMING_LOCKED -> IN_PROGRESS"
    roles: [TimingOperator]
    code: 200
    input: []
    output: Wave
    side_effects: ["actual_start_time := now; Race TIMING_LOCKED -> IN_PROGRESS when first wave of the race"]

  # --- TimingPoint ---
  - method: POST
    path: "/race-timing/timing-points"
    description: "Create a timing point (PLANNED); validates device window overlap, point_index uniqueness, distance ordering"
    roles: [TimingOperator]
    code: 201
    input: [race_id, point_index, kind, distance_km, device_id, deploy_at, expected_teardown_at]
    output: TimingPoint
    side_effects: ["status := PLANNED"]
  - method: POST
    path: "/race-timing/timing-points/{point_id}/deploy"
    description: "PLANNED -> DEPLOYED (pre-lock only)"
    roles: [TimingOperator]
    code: 200
    input: []
    output: TimingPoint
    side_effects: ["status := DEPLOYED"]
  - method: DELETE
    path: "/race-timing/timing-points/{point_id}"
    description: "Remove a timing point (pre-lock only)"
    roles: [TimingOperator]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- Registration ---
  - method: POST
    path: "/race-timing/registrations"
    description: "Register a participant into a wave with a bib; computes age_on_race_day and age_group"
    roles: [RegistrationClerk]
    code: 201
    input: [race_id, wave_id, bib_number, participant_name, birth_date, gender]
    output: Registration
    side_effects: ["lifecycle_status := REGISTERED; payment_status := UNPAID; age fields computed"]
  - method: GET
    path: "/race-timing/registrations/{reg_id}"
    description: "Read a registration"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/race-timing/registrations"
    description: "List/filter registrations (FK reverse for race_id, wave_id, chip_id)"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer]
    code: 200
    input: ["race_id?", "wave_id?", "chip_id?", "lifecycle_status?", "bib_number?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/race-timing/registrations/{reg_id}/pay"
    description: "payment UNPAID -> PAID (payment dimension; registration intake must be open)"
    roles: [RegistrationClerk]
    code: 200
    input: []
    output: Registration
    side_effects: ["payment_status := PAID"]
  - method: POST
    path: "/race-timing/registrations/{reg_id}/confirm"
    description: "lifecycle REGISTERED -> CONFIRMED; requires payment PAID"
    roles: [RegistrationClerk]
    code: 200
    input: []
    output: Registration
    side_effects: ["lifecycle_status := CONFIRMED"]
  - method: POST
    path: "/race-timing/registrations/{reg_id}/assign-chip"
    description: "CONFIRMED -> CHECKED_IN; assigns an AVAILABLE chip (race-day check-in, allowed TIMING_LOCKED/IN_PROGRESS)"
    roles: [RegistrationClerk]
    code: 200
    input: [chip_id]
    output: Registration
    side_effects: ["chip_id set; Chip AVAILABLE -> ASSIGNED; Chip.current_registration_id set"]
  - method: POST
    path: "/race-timing/registrations/{reg_id}/withdraw"
    description: "-> WITHDRAWN (blocked once race IN_PROGRESS or later); releases chip and refunds payment"
    roles: [RegistrationClerk]
    code: 200
    input: []
    output: Registration
    side_effects: ["chip released to AVAILABLE if assigned; payment PAID -> REFUNDED"]

  # --- Chip ---
  - method: POST
    path: "/race-timing/chips"
    description: "Register a chip into the fleet (AVAILABLE); chip_code unique"
    roles: [RegistrationClerk]
    code: 201
    input: [chip_code]
    output: Chip
    side_effects: ["status := AVAILABLE"]
  - method: GET
    path: "/race-timing/chips/{chip_id}"
    description: "Read a chip"
    roles: [RaceDirector, RegistrationClerk, TimingOperator]
    code: 200
    input: []
    output: Chip
    side_effects: []
  - method: GET
    path: "/race-timing/chips"
    description: "List/filter chips"
    roles: [RaceDirector, RegistrationClerk, TimingOperator]
    code: 200
    input: ["status?", "chip_code?", "current_registration_id?", "limit?", "offset?"]
    output: Chip[]
    side_effects: []
  - method: POST
    path: "/race-timing/chips/{chip_id}/deassign"
    description: "Release an ASSIGNED chip; disposition RETURNED -> AVAILABLE (registration stays CHECKED_IN); LOST -> LOST (registration reverts CHECKED_IN -> CONFIRMED)"
    roles: [RegistrationClerk]
    code: 200
    input: [disposition]
    output: Chip
    side_effects: ["chip status per disposition; registration chip_id cleared; LOST reverts registration to CONFIRMED"]

  # --- TimingRead ---
  - method: POST
    path: "/race-timing/timing-reads"
    description: "Ingest a chip read (append-only); classifies SCORED/REJECTED; runs course-cut pace check; dedupe on (point, chip, ts)"
    roles: [TimingOperator]
    code: 201
    input: [timing_point_id, chip_id, read_timestamp]
    output: TimingRead
    side_effects: ["status classified; AUTO COURSE_CUT_SUSPECT may be raised"]
  - method: GET
    path: "/race-timing/timing-reads/{read_id}"
    description: "Read a timing read"
    roles: [RaceDirector, TimingOperator, RaceOfficial]
    code: 200
    input: []
    output: TimingRead
    side_effects: []
  - method: GET
    path: "/race-timing/timing-reads"
    description: "List/filter timing reads (FK reverse for timing_point_id, chip_id)"
    roles: [RaceDirector, TimingOperator, RaceOfficial]
    code: 200
    input: ["timing_point_id?", "chip_id?", "status?", "adjusted_by_correction_id?", "limit?", "offset?"]
    output: TimingRead[]
    side_effects: []

  # --- Result ---
  - method: GET
    path: "/race-timing/results/{result_id}"
    description: "Read a result"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer, Spectator]
    code: 200
    input: []
    output: Result
    side_effects: []
  - method: GET
    path: "/race-timing/results"
    description: "List/filter results (FK reverse for race_id, registration_id)"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer, Spectator]
    code: 200
    input: ["race_id?", "registration_id?", "status?", "limit?", "offset?"]
    output: Result[]
    side_effects: []

  # --- ResultFlag ---
  - method: POST
    path: "/race-timing/result-flags"
    description: "Manually raise a flag (MANUAL origin), e.g. referee DQ"
    roles: [RaceOfficial]
    code: 201
    input: [registration_id, flag_type, "detail?"]
    output: ResultFlag
    side_effects: ["status := RAISED"]
  - method: GET
    path: "/race-timing/result-flags/{flag_id}"
    description: "Read a result flag"
    roles: [RaceDirector, RaceOfficial, TimingOperator]
    code: 200
    input: []
    output: ResultFlag
    side_effects: []
  - method: GET
    path: "/race-timing/result-flags"
    description: "List/filter result flags (FK reverse for registration_id)"
    roles: [RaceDirector, RaceOfficial, TimingOperator]
    code: 200
    input: ["registration_id?", "flag_type?", "status?", "limit?", "offset?"]
    output: ResultFlag[]
    side_effects: []
  - method: POST
    path: "/race-timing/result-flags/{flag_id}/resolve"
    description: "RAISED -> CONFIRMED (applies exclusion + recompute) or DISMISSED"
    roles: [RaceOfficial]
    code: 200
    input: [outcome]
    output: ResultFlag
    side_effects: ["CONFIRMED: Result -> EXCLUDED; ranks/awards recomputed (cascade C2)"]

  # --- Protest ---
  - method: POST
    path: "/race-timing/protests"
    description: "File a protest during the protest window (clerk on behalf of participant)"
    roles: [RegistrationClerk]
    code: 201
    input: [race_id, registration_id, timing_read_id, requested_action, "corrected_timestamp?", reason]
    output: Protest
    side_effects: ["status := FILED; filed_by_user_id := X-User-ID"]
  - method: GET
    path: "/race-timing/protests/{protest_id}"
    description: "Read a protest"
    roles: [RaceDirector, RegistrationClerk, RaceOfficial]
    code: 200
    input: []
    output: Protest
    side_effects: []
  - method: GET
    path: "/race-timing/protests"
    description: "List/filter protests (FK reverse for race_id, registration_id)"
    roles: [RaceDirector, RegistrationClerk, RaceOfficial]
    code: 200
    input: ["race_id?", "registration_id?", "status?", "timing_read_id?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []
  - method: POST
    path: "/race-timing/protests/{protest_id}/resolve"
    description: "FILED -> UPHELD (spawns APPROVED correction -> cascade C1) or DISMISSED; SoD vs filer"
    roles: [RaceOfficial]
    code: 200
    input: [outcome]
    output: Protest
    side_effects: ["UPHELD: Correction created APPROVED with protest_id; cascade C1 runs"]

  # --- Correction ---
  - method: POST
    path: "/race-timing/corrections"
    description: "File a results correction directly (race official)"
    roles: [RaceOfficial]
    code: 201
    input: [race_id, timing_read_id, kind, "corrected_timestamp?", reason]
    output: Correction
    side_effects: ["status := FILED"]
  - method: GET
    path: "/race-timing/corrections/{correction_id}"
    description: "Read a correction"
    roles: [RaceDirector, RaceOfficial]
    code: 200
    input: []
    output: Correction
    side_effects: []
  - method: GET
    path: "/race-timing/corrections"
    description: "List/filter corrections (FK reverse for race_id, timing_read_id)"
    roles: [RaceDirector, RaceOfficial]
    code: 200
    input: ["race_id?", "timing_read_id?", "status?", "protest_id?", "limit?", "offset?"]
    output: Correction[]
    side_effects: []
  - method: POST
    path: "/race-timing/corrections/{correction_id}/adjudicate"
    description: "FILED -> APPROVED (applies read mutation + full cascade C1; OCC-guarded) or REJECTED"
    roles: [RaceOfficial]
    code: 200
    input: [decision, expected_race_version]
    output: Correction
    side_effects: ["APPROVED: read mutation -> recompute -> award swap -> Race AMENDMENT_OPEN -> Certification REVOKED; increments Race.version by 1"]

  # --- Award (registration-scoped reverse) ---
  - method: GET
    path: "/race-timing/registrations/{id}/awards"
    description: "List awards won by a registration (FK reverse for Award.registration_id)"
    roles: [RaceDirector, TimingOperator, RegistrationClerk, RaceOfficial, CertificationOfficer, Spectator]
    code: 200
    input: ["limit?", "offset?"]
    output: Award[]
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog (29 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing/empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body referenced id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, or malformed body reference (e.g. protest subject without a Result; deploy window end <= start; ADJUST_READ_TIME without corrected_timestamp)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition exists" }
  - { id: ERR_STALE_RACE_VERSION, http: 412, condition: "expected_race_version != current race.version (OCC)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: protest resolver == filer, or certification issuer == timing locker" }
  - { id: ERR_RACE_REGISTRATION_CLOSED, http: 409, condition: "register/pay/confirm while race not in REGISTRATION_OPEN" }
  - { id: ERR_WAVE_CAPACITY_FULL, http: 409, condition: "Wave occupancy (non-WITHDRAWN registrations) == max_capacity" }
  - { id: ERR_BIB_NUMBER_TAKEN, http: 409, condition: "bib_number already used by another registration of the race" }
  - { id: ERR_WAVE_INDEX_TAKEN, http: 409, condition: "wave_index already used by another wave of the race" }
  - { id: ERR_WAVE_SPACING_VIOLATION, http: 409, condition: "scheduled_start_time within WAVE_GAP_MINUTES of another wave of the race" }
  - { id: ERR_DEVICE_WINDOW_OVERLAP, http: 409, condition: "Same device_id deployment windows [deploy_at, teardown) overlap" }
  - { id: ERR_TIMING_CONFIG_LOCKED, http: 409, condition: "Timing-point create/deploy/delete after TIMING_LOCKED" }
  - { id: ERR_TIMING_CONFIG_INCOMPLETE, http: 409, condition: "lock-timing without exactly one DEPLOYED START + one DEPLOYED FINISH (distance == race.distance_km), or with PLANNED points remaining, or with zero waves" }
  - { id: ERR_PAYMENT_REQUIRED, http: 409, condition: "confirm while payment_status != PAID" }
  - { id: ERR_CHIP_NOT_AVAILABLE, http: 409, condition: "assign-chip with chip.status != AVAILABLE" }
  - { id: ERR_CHIP_ALREADY_ASSIGNED, http: 409, condition: "assign-chip while registration.chip_id already set" }
  - { id: ERR_CHIP_NOT_ASSIGNED, http: 409, condition: "deassign while chip.status != ASSIGNED" }
  - { id: ERR_CHIP_CODE_TAKEN, http: 409, condition: "chip_code already exists in the fleet" }
  - { id: ERR_RACE_ALREADY_STARTED, http: 409, condition: "withdraw while race in IN_PROGRESS or later" }
  - { id: ERR_DUPLICATE_READ, http: 409, condition: "Identical (timing_point_id, chip_id, read_timestamp) already ingested" }
  - { id: ERR_READ_INGEST_CLOSED, http: 409, condition: "Ingest while race not in IN_PROGRESS / PROVISIONAL_PUBLISHED / AMENDMENT_OPEN" }
  - { id: ERR_RACE_CUTOFF_NOT_REACHED, http: 409, condition: "publish-results before first-wave actual start + course_time_limit_minutes" }
  - { id: ERR_PROTEST_WINDOW_CLOSED, http: 409, condition: "protest filing at or after protest_window_closes_at (strict < required)" }
  - { id: ERR_PROTEST_WINDOW_OPEN, http: 409, condition: "finalize-results before protest_window_closes_at (inclusive >= required)" }
  - { id: ERR_PROTESTS_OUTSTANDING, http: 409, condition: "finalize with FILED protests remaining" }
  - { id: ERR_FLAGS_OUTSTANDING, http: 409, condition: "finalize with RAISED result-flags remaining" }
  - { id: ERR_COURSE_NOT_CERTIFIED, http: 422, condition: "certify on UNCERTIFIED_COURSE race" }
  - { id: ERR_CORRECTION_KIND_MISMATCH, http: 409, condition: "Correction kind not actionable on target read state (EXCLUDE_READ needs SCORED; REINSTATE_READ needs EXCLUDED; ADJUST_READ_TIME needs SCORED + corrected_timestamp)" }

# =============================================================================
# Table 1.7: RBAC Matrix (all roles opaque; segregation of duties)
# =============================================================================
roles:
  - name: RaceDirector
    description: "Owns the event lifecycle: race setup, registration window, timing lock, result publish/finalize"
    identity: opaque
    exclusive_operations:
      - "POST /race-timing/races"
      - "POST /race-timing/races/{race_id}/open-registration"
      - "POST /race-timing/races/{race_id}/lock-timing"
      - "POST /race-timing/races/{race_id}/publish-results"
      - "POST /race-timing/races/{race_id}/finalize-results"
      - "POST /race-timing/waves"
    shared_operations:
      - "GET endpoints (race, waves, timing-points, registrations, chips, timing-reads, results, result-flags, protests, corrections, certifications, awards, live-board)"
      - "POST /race-timing/_clock/set_current_utc"
  - name: TimingOperator
    description: "Places mats, manages timing points, starts waves, ingests chip reads"
    identity: opaque
    exclusive_operations:
      - "POST /race-timing/timing-points"
      - "POST /race-timing/timing-points/{point_id}/deploy"
      - "DELETE /race-timing/timing-points/{point_id}"
      - "POST /race-timing/waves/{wave_id}/start"
      - "POST /race-timing/timing-reads"
    shared_operations:
      - "GET endpoints (per endpoint role lists)"
      - "POST /race-timing/_clock/set_current_utc"
  - name: RegistrationClerk
    description: "Runs registration intake, payments, bib/chip assignment, withdrawals; files protests on behalf of participants"
    identity: opaque
    exclusive_operations:
      - "POST /race-timing/registrations"
      - "POST /race-timing/registrations/{reg_id}/pay"
      - "POST /race-timing/registrations/{reg_id}/confirm"
      - "POST /race-timing/registrations/{reg_id}/assign-chip"
      - "POST /race-timing/registrations/{reg_id}/withdraw"
      - "POST /race-timing/chips"
      - "POST /race-timing/chips/{chip_id}/deassign"
      - "POST /race-timing/protests"
    shared_operations:
      - "GET endpoints (per endpoint role lists)"
      - "POST /race-timing/_clock/set_current_utc"
  - name: RaceOfficial
    description: "Referee/jury: raises and resolves result flags, resolves protests, files and adjudicates corrections"
    identity: opaque
    exclusive_operations:
      - "POST /race-timing/result-flags"
      - "POST /race-timing/result-flags/{flag_id}/resolve"
      - "POST /race-timing/protests/{protest_id}/resolve"
      - "POST /race-timing/corrections"
      - "POST /race-timing/corrections/{correction_id}/adjudicate"
    shared_operations:
      - "GET endpoints (per endpoint role lists)"
      - "POST /race-timing/_clock/set_current_utc"
  - name: CertificationOfficer
    description: "Issues certification for qualifying events; must not be the user who locked timing (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /race-timing/races/{race_id}/certify"
    shared_operations:
      - "GET endpoints (per endpoint role lists)"
      - "POST /race-timing/_clock/set_current_utc"
  - name: Spectator
    description: "Unauthenticated-staff-external public viewer: live board, results, awards, race detail"
    identity: opaque
    exclusive_operations: []
    shared_operations:
