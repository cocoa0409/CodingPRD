scenario: |
  Generate task harder than expert level!

  2721. Deposit Insurance Determination & Failed Institution Resolution (federal deposit insurer
  resolution team): pre-failure readiness data collection from a troubled institution with deposit
  file standardization, ownership category analysis for single, joint, trust and retirement accounts
  to compute insured amounts, brokered and pass-through deposit beneficiary determination, hold
  placement on uninsured portions with receivership certificate issuance, purchase-and-assumption
  bidding, least-cost test and bid evaluation, franchise marketing, loss share and asset retention
  decisions, depositor communications, branch reopening and customer transition, receivership asset
  disposition and dividend distribution

domain_name: deposit-insurance-resolution
api_prefix: ""   # flat topology: every collection is a root-level path (/institutions, /deposit-accounts, ...)

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at a root-level collection; parenthood is expressed only
  # through FK fields in request bodies plus two convenience sub-resource creates/reads. No
  # entity is nested more than one segment deep in any URL.

  state_machine_shape: branching
  # Concretely: InsuranceDetermination is CYCLIC (UNDER_REVIEW -> REVISION_REQUESTED -> PREPARED
  # -> UNDER_REVIEW, revision_round increments each loop); Bid is a BRANCHING fork-join
  # (SUBMITTED -> {CONFORMING, NON_CONFORMING} -> {WINNER, REJECTED}) with divergent side-effect
  # sets per branch; DepositAccount carries three INDEPENDENT state dimensions on one row
  # (insurance_status x hold_status x transition_status) that advance under different triggers;
  # Institution carries two independent dimensions (status x least_cost_status) plus a
  # compound gate (readiness_standardized derived from ReadinessSubmission children).

  relationship_patterns:
    - one_to_many        # Institution -> DepositorRecord / DepositAccount / Bid / BranchReopening / DividendDistribution
    - many_to_many       # OwnershipInterest is the junction between DepositAccount and DepositorRecord
    - cross_aggregate    # ReceivershipCertificate ties an InsuranceDetermination to Institution cash aggregates
    - polymorphic        # OwnershipInterest.interest_role reinterprets the same junction row as co-owner, trust beneficiary, or pass-through participant

  role_model: segregation_of_duties
  # The operator who prepared an InsuranceDetermination (prepared_by_user_id) may never certify it,
  # and the ResolutionAnalyst who qualified a Bidder may never be the Bidder principal. Roles are
  # also peer-partitioned by resource type (claims vs resolution vs receivership).

  consistency_model: immediate

# =====================================================================================
# §1.1 Entity-Relationship Table
# =====================================================================================
entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - name: cert_number
        type: string
        source: input
        description: FDIC certificate number of the insured depository institution
        constraints: "4-6 digits; globally unique across Institution rows"
      - name: legal_name
        type: string
        source: input
        description: chartered legal name of the institution
        constraints: "1-160 chars"
      - name: charter_state
        type: string
        source: input
        description: two-letter state code of the chartering authority
        constraints: "exactly 2 uppercase letters"
      - name: book_asset_value_cents
        type: integer
        source: input
        description: total book value of the institution's assets at readiness intake, in cents
        constraints: ">= 0"
      - name: estimated_liquidation_recovery_cents
        type: integer
        source: input
        description: appraised recovery on the whole asset book under a straight liquidation, in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: resolution lifecycle dimension of the institution
        default: PRE_FAILURE_MONITORING
        constraints: "PRE_FAILURE_MONITORING | READINESS_COLLECTION | RESOLUTION_READY | CLOSED_IN_RECEIVERSHIP | RESOLUTION_COMPLETE | RECEIVERSHIP_TERMINATED"
      - name: failure_datetime
        type: datetime
        source: system
        description: logical-clock instant at which the charter was closed and the receivership began; null before closure
        default: null
      - name: readiness_standardized
        type: boolean
        source: computed
        description: "true iff at least one ReadinessSubmission for this institution has status == STANDARDIZED"
        default: false
      - name: franchise_marketing_status
        type: enum
        source: system
        description: franchise marketing / data-room dimension, independent of status
        default: NOT_STARTED
        constraints: "NOT_STARTED | OPEN | CLOSED"
      - name: bid_deadline_at
        type: datetime
        source: system
        description: last logical-clock instant at which a Bid may be submitted; set when franchise marketing opens
        default: null
      - name: least_cost_status
        type: enum
        source: system
        description: least-cost-test dimension, independent of status
        default: NOT_STARTED
        constraints: "NOT_STARTED | EVALUATED | AWARDED | FAILED_ALL_BIDS"
      - name: least_cost_test_variant
        type: enum
        source: system
        description: which cost algorithm the evaluation used; pinned at evaluate time
        default: null
        constraints: "EXPECTED_LOSS_SHARE | RETENTION_ADJUSTED"
      - name: liquidation_baseline_cents
        type: integer
        source: computed
        description: output of calculations.liquidation_baseline_cost; the least-cost benchmark every bid must beat
        default: null
      - name: conforming_bid_count
        type: integer
        source: computed
        description: number of Bid rows for this institution whose status == CONFORMING after the latest evaluation
        default: 0
      - name: resolution_method
        type: enum
        source: system
        description: resolution structure selected by the least-cost award; DEPOSIT_PAYOFF when no bid beats the baseline
        default: null
        constraints: "WHOLE_BANK_PA | INSURED_DEPOSITS_ONLY_PA | LOSS_SHARE_PA | DEPOSIT_PAYOFF"
      - name: total_deposit_balance_cents
        type: integer
        source: computed
        description: "sum of (balance_cents + accrued_interest_cents) over every DepositAccount with institution_id == this id, no status filter"
        default: 0
      - name: depositor_record_count
        type: integer
        source: computed
        description: "count of DepositorRecord rows with institution_id == this id"
        default: 0
      - name: aggregate_insured_cents
        type: integer
        source: computed
        description: "sum of InsuranceDetermination.insured_amount_cents over determinations with status == CERTIFIED whose depositor belongs to this institution"
        default: 0
      - name: aggregate_certificate_face_cents
        type: integer
        source: computed
        description: "sum of ReceivershipCertificate.face_amount_cents for this institution over statuses {ISSUED, PARTIALLY_PAID, PAID} (CANCELLED excluded)"
        default: 0
      - name: uninsured_claim_count
        type: integer
        source: computed
        description: "count of ReceivershipCertificate rows for this institution in statuses {ISSUED, PARTIALLY_PAID, PAID}"
        default: 0
      - name: receivership_cash_cents
        type: integer
        source: computed
        description: "net disposition proceeds retained by the receivership: gross_disposition_proceeds_cents - disposition_expense_total_cents - sum(DividendDistribution.total_distributed_cents where status == SETTLED)"
        default: 0
      - name: gross_disposition_proceeds_cents
        type: integer
        source: computed
        description: cumulative gross proceeds posted through POST /institutions/{id}/receivership-proceeds
        default: 0
      - name: disposition_expense_total_cents
        type: integer
        source: computed
        description: cumulative disposition expenses posted through POST /institutions/{id}/receivership-proceeds
        default: 0
      - name: dividend_round_count
        type: integer
        source: computed
        description: "count of DividendDistribution rows for this institution in statuses {DECLARED, SETTLED} (VOIDED excluded); also the source of the next distribution_round"
        default: 0

  - name: ReadinessSubmission
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; the troubled institution that produced this deposit file package
      - name: file_format
        type: enum
        source: input
        description: layout the institution delivered the deposit file in
        constraints: "FDIC_STANDARD_V2 | LEGACY_FIXED_WIDTH | VENDOR_CSV"
      - name: record_count
        type: integer
        source: input
        description: total deposit records delivered in the package
        constraints: ">= 1"
      - name: malformed_record_count
        type: integer
        source: input
        description: records the institution itself flagged as unparseable
        constraints: ">= 0 and <= record_count"
      - name: reported_deposit_total_cents
        type: integer
        source: input
        description: deposit total the institution asserts the package sums to, in cents
        constraints: ">= 0"
      - name: standardization_score_bps
        type: integer
        source: computed
        description: output of calculations.readiness_standardization_score, in basis points of clean records
        default: null
      - name: deposit_total_variance_bps
        type: integer
        source: computed
        description: absolute variance in basis points between reported_deposit_total_cents and the DepositAccount sum
        default: null
      - name: status
        type: enum
        source: system
        description: standardization outcome of this package
        default: RECEIVED
        constraints: "RECEIVED | STANDARDIZED | REJECTED"
      - name: rejection_reason
        type: enum
        source: system
        description: which standardization gate failed; null unless status == REJECTED
        default: null
        constraints: "SCORE_BELOW_FLOOR | TOTAL_VARIANCE_EXCEEDED"

  - name: DepositorRecord
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; institution at which this depositor holds accounts
      - name: tin_hash
        type: string
        source: input
        description: salted hash of the depositor's taxpayer identification number
        constraints: "1-64 chars; unique within institution_id"
      - name: legal_name
        type: string
        source: input
        description: depositor legal name as printed on depositor communications
        constraints: "1-160 chars"
      - name: depositor_type
        type: enum
        source: input
        description: capacity in which the depositor holds funds
        constraints: "NATURAL_PERSON | BUSINESS | GOVERNMENT | BROKER"
      - name: contact_email
        type: string
        source: input
        description: destination address for depositor communications
        constraints: "must contain '@'"
      - name: notice_status
        type: enum
        source: system
        description: depositor communication dimension
        default: PENDING
        constraints: "PENDING | SENT | ACKNOWLEDGED"
      - name: notice_template_code
        type: enum
        source: system
        description: which notice body was sent; chosen by the certify cascade from uninsured exposure
        default: null
        constraints: "FULLY_INSURED | PARTIALLY_UNINSURED"
      - name: notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant at which the notice was queued and sent
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: logical-clock instant at which the depositor acknowledged the notice
        default: null
      - name: attributed_total_cents
        type: integer
        source: computed
        description: total dollars attributed to this depositor by the most recent prepare, in cents
        default: 0
      - name: certified_insured_cents
        type: integer
        source: computed
        description: insured_amount_cents copied from this depositor's CERTIFIED determination; 0 when none is certified
        default: 0
      - name: certified_uninsured_cents
        type: integer
        source: computed
        description: uninsured_amount_cents copied from this depositor's CERTIFIED determination; 0 when none is certified
        default: 0

  - name: DepositAccount
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; institution booking this account
      - name: primary_depositor_id
        type: string
        source: input
        description: FK -> DepositorRecord.id; titled owner (for BROKERED_PASS_THROUGH, the broker of record)
      - name: account_number
        type: string
        source: input
        description: account number on the institution's deposit file
        constraints: "1-32 chars; unique within institution_id"
      - name: ownership_category
        type: enum
        source: input
        description: FDIC ownership category that governs which insurance limit applies
        constraints: "SINGLE | JOINT | REVOCABLE_TRUST | IRREVOCABLE_TRUST | RETIREMENT | BROKERED_PASS_THROUGH"
      - name: balance_cents
        type: integer
        source: input
        description: principal balance as of the failure date, in cents
        constraints: ">= 0"
      - name: accrued_interest_cents
        type: integer
        source: input
        description: interest accrued and unposted as of the failure date, in cents
        default: 0
        constraints: ">= 0"
      - name: opened_at
        type: datetime
        source: input
        description: date the account was opened; informational only, never a decision input
      - name: broker_name
        type: string
        source: input
        description: deposit broker of record; required when ownership_category == BROKERED_PASS_THROUGH
        default: null
      - name: recordkeeping_status
        type: enum
        source: input
        description: quality of the broker's beneficiary recordkeeping; required when ownership_category == BROKERED_PASS_THROUGH
        default: null
        constraints: "COMPLETE | DEFICIENT | PENDING"
      - name: insurance_status
        type: enum
        source: system
        description: determination dimension of the account, advanced by closure and certification
        default: PENDING
        constraints: "PENDING | FROZEN_FOR_DETERMINATION | DETERMINED"
      - name: hold_status
        type: enum
        source: system
        description: hold dimension of the account, advanced independently by certification and hold release
        default: NONE
        constraints: "NONE | HELD | RELEASED"
      - name: held_amount_cents
        type: integer
        source: computed
        description: uninsured dollars held on this account by calculations.uninsured_hold_allocation
        default: 0
      - name: transition_status
        type: enum
        source: system
        description: customer transition dimension, advanced independently by the least-cost award
        default: PENDING
        constraints: "PENDING | TRANSFERRED | PAID_OUT"
      - name: attributed_amount_cents
        type: integer
        source: computed
        description: dollars this account contributed to its primary depositor's attributed_total_cents in the most recent prepare
        default: 0

  - name: OwnershipInterest
    parent: null
    common_fields: false
    fields:
      - name: deposit_account_id
        type: string
        source: input
        description: FK -> DepositAccount.id; account this interest sits on
      - name: depositor_record_id
        type: string
        source: input
        description: FK -> DepositorRecord.id; depositor holding the interest
      - name: interest_role
        type: enum
        source: input
        description: how this junction row is interpreted by the ownership-category analysis
        constraints: "CO_OWNER | BENEFICIARY | PARTICIPANT"
      - name: designated_share_bps
        type: integer
        source: input
        description: this holder's share of the account, in basis points
        constraints: "1..10000"

  - name: InsuranceDetermination
    parent: null
    common_fields: true
    fields:
      - name: depositor_record_id
        type: string
        source: input
        description: FK -> DepositorRecord.id; depositor whose insured position this determination computes
      - name: status
        type: enum
        source: system
        description: determination review lifecycle; cyclic through REVISION_REQUESTED
        default: DRAFT
        constraints: "DRAFT | PREPARED | UNDER_REVIEW | REVISION_REQUESTED | CERTIFIED | SUPERSEDED"
      - name: method_variant
        type: enum
        source: system
        description: which variant of calculations.depositor_insurance_determination the latest prepare ran
        default: null
        constraints: "AGGREGATE_BY_CATEGORY | PER_ACCOUNT_PROVISIONAL"
      - name: insured_amount_cents
        type: integer
        source: computed
        description: insured total across all ownership categories for this depositor
        default: 0
      - name: uninsured_amount_cents
        type: integer
        source: computed
        description: uninsured total across all ownership categories for this depositor
        default: 0
      - name: attributed_total_cents
        type: integer
        source: computed
        description: total dollars attributed to this depositor across every ownership category
        default: 0
      - name: category_breakdown
        type: object
        source: computed
        description: "map ownership_category -> { attributed_cents, limit_cents, insured_cents, uninsured_cents } for the categories with non-zero attribution"
        default: {}
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsAgent whose most recent prepare produced the current amounts
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsCertifier who certified; never equal to prepared_by_user_id
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: number of completed REVISION_REQUESTED loops on this determination
        default: 0
      - name: revision_reason
        type: string
        source: system
        description: free text supplied by the certifier when sending the determination back
        default: null
      - name: prepared_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent prepare
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of certification
        default: null

  - name: ReceivershipCertificate
    parent: null
    common_fields: true
    fields:
      - name: insurance_determination_id
        type: string
        source: system
        description: FK -> InsuranceDetermination.id; certified determination that produced this claim
      - name: depositor_record_id
        type: string
        source: system
        description: FK -> DepositorRecord.id; holder of the uninsured claim
      - name: institution_id
        type: string
        source: system
        description: FK -> Institution.id; receivership estate the claim is filed against
      - name: face_amount_cents
        type: integer
        source: computed
        description: uninsured_amount_cents of the certifying determination at issuance
      - name: cumulative_dividends_cents
        type: integer
        source: computed
        description: dividends paid against this certificate to date, in cents
        default: 0
      - name: last_dividend_amount_cents
        type: integer
        source: computed
        description: amount allocated to this certificate by the most recent SETTLED round; used for exact void reversal
        default: 0
      - name: last_dividend_round
        type: integer
        source: computed
        description: distribution_round of the most recent SETTLED round that touched this certificate; 0 when never paid
        default: 0
      - name: status
        type: enum
        source: system
        description: certificate lifecycle
        default: ISSUED
        constraints: "ISSUED | PARTIALLY_PAID | PAID | CANCELLED"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance

  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: legal name of the prospective acquiring institution
        constraints: "1-160 chars"
      - name: cert_number
        type: string
        source: input
        description: acquirer's own FDIC certificate number
        constraints: "4-6 digits; globally unique across Bidder rows"
      - name: tier1_capital_ratio_bps
        type: integer
        source: input
        description: acquirer's tier-1 leverage ratio in basis points
        constraints: ">= 0"
      - name: camels_composite
        type: integer
        source: input
        description: composite supervisory rating, 1 (best) to 5 (worst)
        constraints: "1..5"
      - name: qualification_status
        type: enum
        source: system
        description: whether this acquirer may submit bids
        default: PENDING
        constraints: "PENDING | QUALIFIED | DISQUALIFIED"
      - name: qualified_at
        type: datetime
        source: system
        description: logical-clock instant of the qualification decision
        default: null
      - name: disqualification_reason
        type: enum
        source: system
        description: why qualification was denied; null unless qualification_status == DISQUALIFIED
        default: null
        constraints: "CAPITAL_BELOW_FLOOR | CAMELS_ABOVE_CEILING | MANUAL"

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; franchise being bid on
      - name: bidder_id
        type: string
        source: input
        description: FK -> Bidder.id; acquirer submitting the bid
      - name: structure
        type: enum
        source: input
        description: purchase-and-assumption structure offered
        constraints: "WHOLE_BANK_PA | INSURED_DEPOSITS_ONLY_PA | LOSS_SHARE_PA"
      - name: deposit_premium_bps
        type: integer
        source: input
        description: premium offered on the assumed deposit base, in basis points
        constraints: "0..10000"
      - name: asset_discount_bps
        type: integer
        source: input
        description: discount demanded on the transferred asset pool, in basis points
        constraints: "0..10000"
      - name: loss_share_pct_bps
        type: integer
        source: input
        description: share of covered-asset losses the insurer would reimburse, in basis points
        default: 0
        constraints: "0..10000"
      - name: asset_retention_pool_cents
        type: integer
        source: input
        description: book value of assets the bidder leaves with the receivership, in cents
        default: 0
        constraints: ">= 0"
      - name: data_room_window_start
        type: datetime
        source: input
        description: start of the due-diligence data-room reservation this bid claims
      - name: data_room_window_end
        type: datetime
        source: input
        description: end of the due-diligence data-room reservation this bid claims
        constraints: "must be strictly after data_room_window_start"
      - name: status
        type: enum
        source: system
        description: bid lifecycle; forks at evaluation and joins at award
        default: SUBMITTED
        constraints: "SUBMITTED | CONFORMING | NON_CONFORMING | WINNER | REJECTED | WITHDRAWN"
      - name: assumed_deposit_base_cents
        type: integer
        source: computed
        description: deposit base the structure assumes, per calculations.bid_evaluated_cost step 1
        default: null
      - name: pre_fee_cost_cents
        type: integer
        source: computed
        description: cost before the loss-share administration fee, per step 5 of calculations.bid_evaluated_cost
        default: null
      - name: loss_share_fee_cents
        type: integer
        source: computed
        description: loss-share administration fee, tier-selected from pre_fee_cost_cents
        default: null
      - name: expected_loss_share_reimbursement_cents
        type: integer
        source: computed
        description: variant-dependent expected reimbursement on covered assets
        default: null
      - name: evaluated_cost_cents
        type: integer
        source: computed
        description: total insurer cost of accepting this bid; null while SUBMITTED, WITHDRAWN or NON_CONFORMING
        default: null
      - name: non_conformance_reason
        type: enum
        source: system
        description: which conformance screen the bid failed; null unless status == NON_CONFORMING
        default: null
        constraints: "RETENTION_POOL_ABOVE_CAP | BIDDER_NOT_QUALIFIED_AT_EVALUATION | INSURED_ONLY_WITHOUT_CERTIFIED_DETERMINATIONS"

  - name: BranchReopening
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; failed institution whose branch reopens
      - name: branch_code
        type: string
        source: input
        description: institution-internal branch identifier
        constraints: "1-16 chars"
      - name: reopen_window_start
        type: datetime
        source: input
        description: inclusive start of the reopening window
      - name: reopen_window_end
        type: datetime
        source: input
        description: exclusive end of the reopening window
        constraints: "must be strictly after reopen_window_start"
      - name: staffing_headcount
        type: integer
        source: input
        description: resolution staff assigned to the reopening
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: reopening lifecycle; cycles back to PLANNED on reschedule
        default: PLANNED
        constraints: "PLANNED | READY | REOPENED"
      - name: reschedule_count
        type: integer
        source: computed
        description: number of completed READY/PLANNED -> PLANNED reschedule loops
        default: 0
      - name: reopened_at
        type: datetime
        source: system
        description: logical-clock instant the branch actually reopened
        default: null

  - name: DividendDistribution
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; receivership estate paying the dividend
      - name: distribution_round
        type: integer
        source: computed
        description: "1 + Institution.dividend_round_count at declaration time"
      - name: priority_class
        type: enum
        source: input
        description: creditor class this round pays
        constraints: "INSURED_SUBROGATION | GENERAL_UNSECURED"
      - name: declared_rate_bps
        type: integer
        source: input
        description: dividend rate declared against the class's allowed claims, in basis points
        constraints: "1..10000"
      - name: status
        type: enum
        source: system
        description: dividend round lifecycle
        default: DECLARED
        constraints: "DECLARED | SETTLED | VOIDED"
      - name: total_distributed_cents
        type: integer
        source: computed
        description: sum actually paid out by calculations.dividend_waterfall_allocation
        default: 0
      - name: certificate_count
        type: integer
        source: computed
        description: number of ReceivershipCertificate rows that received a non-zero allocation in this round
        default: 0
      - name: settled_at
        type: datetime
        source: system
        description: logical-clock instant of settlement
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant the round was voided and reversed
        default: null

# =====================================================================================
# §1.2 State Machine Table
# =====================================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Institution carries TWO independent state dimensions on one row:
  #   (1) status                — resolution lifecycle
  #   (2) least_cost_status     — bid evaluation lifecycle
  # plus franchise_marketing_status, which is advanced only by one endpoint.
  # The dimensions advance under different triggers and never gate each other's
  # transition table; only the preconditions below cross-reference them.
  # ---------------------------------------------------------------------------
  - entity: Institution
    dimension: status
    initial_state: PRE_FAILURE_MONITORING
    terminal_states: [RECEIVERSHIP_TERMINATED]
    transitions:
      - from: PRE_FAILURE_MONITORING
        to: READINESS_COLLECTION
        trigger: "POST /institutions/{id}/readiness-submissions (first submission for this institution)"
        actor: ClosingManager
        preconditions:
          - "institution.status == PRE_FAILURE_MONITORING"
        side_effects:
          - "institution.status = READINESS_COLLECTION"
          - "increments Institution.version by 1"
        note: "Auto-transition; a second submission while already in READINESS_COLLECTION leaves status unchanged."
      - from: READINESS_COLLECTION
        to: RESOLUTION_READY
        trigger: "POST /readiness-submissions/{id}/standardize resulting in status == STANDARDIZED"
        actor: ClosingManager
        preconditions:
          - "institution.status == READINESS_COLLECTION"
          - "the submission's computed standardization_score_bps >= READINESS_SCORE_FLOOR_BPS and deposit_total_variance_bps <= READINESS_VARIANCE_CEILING_BPS"
        side_effects:
          - "submission.status = STANDARDIZED"
          - "institution.readiness_standardized = true"
          - "institution.status = RESOLUTION_READY"
          - "recomputes institution.total_deposit_balance_cents and institution.depositor_record_count"
          - "increments Institution.version by 1"
      - from: RESOLUTION_READY
        to: READINESS_COLLECTION
        trigger: "POST /institutions/{id}/readiness-submissions (a further submission after readiness was already achieved)"
        actor: ClosingManager
        preconditions:
          - "institution.status == RESOLUTION_READY"
        side_effects:
          - "institution.status = READINESS_COLLECTION"
          - "institution.readiness_standardized = false — the newly received package invalidates the standing readiness attestation until it is standardized"
          - "increments Institution.version by 1"
        note: "Revert edge: readiness is only as good as the newest delivered file, so RESOLUTION_READY is re-earned by standardizing the new package."
      - from: RESOLUTION_READY
        to: CLOSED_IN_RECEIVERSHIP
        trigger: "POST /institutions/{id}/close"
        actor: ClosingManager
        preconditions:
          - "institution.status == RESOLUTION_READY"
          - "institution.readiness_standardized == true"
        side_effects:
          - "institution.status = CLOSED_IN_RECEIVERSHIP"
          - "institution.failure_datetime = logical clock now"
          - "recomputes institution.total_deposit_balance_cents and institution.depositor_record_count"
          - "cascade L1->L2: because the institution closed, every DepositAccount with institution_id == this id and insurance_status == PENDING flips insurance_status to FROZEN_FOR_DETERMINATION"
          - "increments Institution.version by 1"
      - from: CLOSED_IN_RECEIVERSHIP
        to: RESOLUTION_COMPLETE
        trigger: "POST /institutions/{id}/least-cost-test/award (award cascade, link L1)"
        actor: ResolutionAnalyst
        preconditions:
          - "institution.status == CLOSED_IN_RECEIVERSHIP"
          - "institution.least_cost_status == EVALUATED"
        side_effects:
          - "institution.status = RESOLUTION_COMPLETE"
          - "institution.resolution_method set from the awarded structure, or DEPOSIT_PAYOFF when conforming_bid_count == 0 or no conforming bid beats liquidation_baseline_cents"
          - "increments Institution.version by 1"
      - from: RESOLUTION_COMPLETE
        to: RECEIVERSHIP_TERMINATED
        trigger: "POST /institutions/{id}/terminate-receivership"
        actor: ReceivershipTrustee
        preconditions:
          - "institution.status == RESOLUTION_COMPLETE"
          - "no DividendDistribution for this institution has status == DECLARED"
          - "no DepositAccount for this institution has hold_status == HELD"
        side_effects:
          - "institution.status = RECEIVERSHIP_TERMINATED"
          - "every ReceivershipCertificate for this institution in status ISSUED or PARTIALLY_PAID keeps its status; only the estate closes"
          - "increments Institution.version by 1"

  - entity: Institution
    dimension: least_cost_status
    initial_state: NOT_STARTED
    terminal_states: [AWARDED, FAILED_ALL_BIDS]
    transitions:
      - from: NOT_STARTED
        to: EVALUATED
        trigger: "POST /institutions/{id}/least-cost-test/evaluate"
        actor: ResolutionAnalyst
        preconditions:
          - "institution.status == CLOSED_IN_RECEIVERSHIP"
          - "institution.franchise_marketing_status IN {OPEN, CLOSED}"
          - "institution.least_cost_status == NOT_STARTED"
        side_effects:
          - "institution.least_cost_test_variant = the requested test_variant"
          - "institution.liquidation_baseline_cents = calculations.liquidation_baseline_cost"
          - "every Bid with status == SUBMITTED forks to CONFORMING or NON_CONFORMING per the conformance screen"
          - "each CONFORMING bid receives evaluated_cost_cents from calculations.bid_evaluated_cost under the pinned variant"
          - "institution.conforming_bid_count = count of Bid rows now in status CONFORMING"
          - "institution.least_cost_status = EVALUATED"
          - "increments Institution.version by 1"
      - from: EVALUATED
        to: AWARDED
        trigger: "POST /institutions/{id}/least-cost-test/award with at least one CONFORMING bid whose evaluated_cost_cents < institution.liquidation_baseline_cents"
        actor: ResolutionAnalyst
        preconditions:
          - "institution.least_cost_status == EVALUATED"
          - "institution.status == CLOSED_IN_RECEIVERSHIP"
        side_effects:
          - "cascade L1: the selected Bid flips CONFORMING -> WINNER; institution.least_cost_status = AWARDED; institution.resolution_method = winner.structure; institution.status = RESOLUTION_COMPLETE"
          - "cascade L2 (caused by L1): because a WINNER now exists, every other Bid in status CONFORMING or NON_CONFORMING flips to REJECTED"
          - "cascade L3 (caused by L2's resolution_method being pinned to a P&A structure): every DepositAccount with insurance_status == DETERMINED and hold_status IN {NONE, RELEASED} flips transition_status PENDING -> TRANSFERRED"
          - "cascade L4 (caused by L3): because at least one account reached transition_status TRANSFERRED, every BranchReopening for this institution with status == PLANNED flips to READY"
          - "increments Institution.version by 1"
        note: "Selector: eligibility = Bid.status == CONFORMING AND evaluated_cost_cents < institution.liquidation_baseline_cents; ranking = evaluated_cost_cents ASC; tie-break = deposit_premium_bps DESC, then created_at ASC; empty candidate set = the FAILED_ALL_BIDS edge below."
      - from: EVALUATED
        to: FAILED_ALL_BIDS
        trigger: "POST /institutions/{id}/least-cost-test/award with an empty candidate set"
        actor: ResolutionAnalyst
        preconditions:
          - "institution.least_cost_status == EVALUATED"
          - "institution.status == CLOSED_IN_RECEIVERSHIP"
          - "no Bid with status == CONFORMING has evaluated_cost_cents < institution.liquidation_baseline_cents (includes institution.conforming_bid_count == 0)"
        side_effects:
          - "cascade L1: institution.least_cost_status = FAILED_ALL_BIDS; institution.resolution_method = DEPOSIT_PAYOFF; institution.status = RESOLUTION_COMPLETE"
          - "cascade L2 (caused by L1): every Bid in status CONFORMING or NON_CONFORMING flips to REJECTED"
          - "cascade L3 (caused by L1 pinning resolution_method = DEPOSIT_PAYOFF): every DepositAccount with insurance_status == DETERMINED and hold_status IN {NONE, RELEASED} flips transition_status PENDING -> PAID_OUT (not TRANSFERRED)"
          - "cascade L4 (caused by L3): every BranchReopening for this institution with status == PLANNED flips to READY"
          - "increments Institution.version by 1"
        note: "Divergent branch: the same award endpoint writes PAID_OUT instead of TRANSFERRED and DEPOSIT_PAYOFF instead of a P&A structure."

  - entity: ReadinessSubmission
    initial_state: RECEIVED
    terminal_states: [STANDARDIZED, REJECTED]
    transitions:
      - from: RECEIVED
        to: STANDARDIZED
        trigger: "POST /readiness-submissions/{id}/standardize"
        actor: ClosingManager
        preconditions:
          - "submission.status == RECEIVED"
          - "submission.institution's status IN {READINESS_COLLECTION}"
          - "standardization_score_bps >= 9800 AND deposit_total_variance_bps <= 25"
        side_effects:
          - "submission.standardization_score_bps and deposit_total_variance_bps written from calculations.readiness_standardization_score"
          - "submission.status = STANDARDIZED"
          - "bubble-up: institution.readiness_standardized = true and institution.status = RESOLUTION_READY"
          - "increments ReadinessSubmission.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /readiness-submissions/{id}/standardize failing either gate"
        actor: ClosingManager
        preconditions:
          - "submission.status == RECEIVED"
          - "submission.institution's status IN {READINESS_COLLECTION}"
        side_effects:
          - "submission.standardization_score_bps and deposit_total_variance_bps written from calculations.readiness_standardization_score"
          - "submission.status = REJECTED"
          - "submission.rejection_reason = SCORE_BELOW_FLOOR when the score gate failed, else TOTAL_VARIANCE_EXCEEDED"
          - "institution.status and institution.readiness_standardized are left untouched"
          - "increments ReadinessSubmission.version by 1"
        note: "Branch fork on the same trigger; the score gate is evaluated before the variance gate so rejection_reason is deterministic when both fail."

  - entity: InsuranceDetermination
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /insurance-determinations/{id}/prepare"
        actor: ClaimsAgent
        preconditions:
          - "determination.status IN {DRAFT, REVISION_REQUESTED}"
          - "the depositor's institution has status == CLOSED_IN_RECEIVERSHIP"
        side_effects:
          - "runs calculations.depositor_insurance_determination under the requested method_variant and calculations.pass_through_beneficiary_attribution for BROKERED_PASS_THROUGH accounts"
          - "writes determination.insured_amount_cents, uninsured_amount_cents, attributed_total_cents, category_breakdown, method_variant, prepared_by_user_id, prepared_at"
          - "writes DepositAccount.attributed_amount_cents on every account that contributed"
          - "writes DepositorRecord.attributed_total_cents"
          - "determination.status = PREPARED"
          - "increments InsuranceDetermination.version by 1"
      - from: REVISION_REQUESTED
        to: PREPARED
        trigger: "POST /insurance-determinations/{id}/prepare (re-prepare after a revision request)"
        actor: ClaimsAgent
        preconditions:
          - "determination.status == REVISION_REQUESTED"
          - "the depositor's institution has status == CLOSED_IN_RECEIVERSHIP"
        side_effects:
          - "same recomputation as DRAFT -> PREPARED, overwriting the prior amounts (the variant may change on the re-prepare)"
          - "determination.status = PREPARED"
          - "increments InsuranceDetermination.version by 1"
        note: "Cycle closure: this is the edge that makes the machine cyclic (PREPARED -> UNDER_REVIEW -> REVISION_REQUESTED -> PREPARED)."
      - from: PREPARED
        to: UNDER_REVIEW
        trigger: "POST /insurance-determinations/{id}/submit-review"
        actor: ClaimsAgent
        preconditions:
          - "determination.status == PREPARED"
          - "determination.prepared_by_user_id is not null"
        side_effects:
          - "determination.status = UNDER_REVIEW"
          - "increments InsuranceDetermination.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /insurance-determinations/{id}/request-revision"
        actor: ClaimsCertifier
        preconditions:
          - "determination.status == UNDER_REVIEW"
        side_effects:
          - "determination.status = REVISION_REQUESTED"
          - "determination.revision_round += 1"
          - "determination.revision_reason = supplied text"
          - "increments InsuranceDetermination.version by 1"
      - from: UNDER_REVIEW
        to: CERTIFIED
        trigger: "POST /insurance-determinations/{id}/certify"
        actor: ClaimsCertifier
        preconditions:
          - "determination.status == UNDER_REVIEW"
          - "the depositor's institution has status == CLOSED_IN_RECEIVERSHIP (cross-entity gate)"
          - "X-User-ID != determination.prepared_by_user_id (segregation of duties)"
          - "determination.method_variant == AGGREGATE_BY_CATEGORY"
        side_effects:
          - "cascade L1: determination.status = CERTIFIED, certified_by_user_id and certified_at written; DepositorRecord.certified_insured_cents / certified_uninsured_cents written; institution.aggregate_insured_cents recomputed"
          - "cascade L2 (caused by L1): because this determination became CERTIFIED, every DepositAccount with attributed_amount_cents > 0 for this depositor flips insurance_status FROZEN_FOR_DETERMINATION -> DETERMINED"
          - "cascade L3 (caused by L2): because those accounts are now DETERMINED and determination.uninsured_amount_cents > 0, calculations.uninsured_hold_allocation writes held_amount_cents per account and flips hold_status NONE -> HELD on every account whose allocated hold is > 0"
          - "cascade L4 (caused by L3): because at least one account reached hold_status == HELD, a ReceivershipCertificate is issued with face_amount_cents == determination.uninsured_amount_cents, and institution.aggregate_certificate_face_cents / uninsured_claim_count are recomputed"
          - "cascade L5 (caused by L4): because the certificate was issued, DepositorRecord.notice_status flips PENDING -> SENT with notice_template_code = PARTIALLY_UNINSURED and notice_sent_at = logical clock now"
          - "conditional cascade: when determination.uninsured_amount_cents == 0, L3 and L4 are skipped entirely (no holds, no certificate) and L5 still runs with notice_template_code = FULLY_INSURED"
          - "increments InsuranceDetermination.version by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /insurance-determinations (a replacement determination is created for the same depositor)"
        actor: ClaimsAgent
        preconditions:
          - "determination.status == CERTIFIED"
          - "every ReceivershipCertificate with insurance_determination_id == this id has cumulative_dividends_cents == 0"
        side_effects:
          - "compensation cascade C1: prior determination.status = SUPERSEDED; DepositorRecord.certified_insured_cents and certified_uninsured_cents reset to 0; institution.aggregate_insured_cents recomputed"
          - "compensation cascade C2 (caused by C1): because the determination became SUPERSEDED, its ReceivershipCertificate flips ISSUED -> CANCELLED and institution.aggregate_certificate_face_cents / uninsured_claim_count are recomputed"
          - "compensation cascade C3 (caused by C2): because the certificate was CANCELLED, every DepositAccount whose held_amount_cents was allocated by the superseded determination flips hold_status HELD -> RELEASED and held_amount_cents -> 0"
          - "compensation cascade C4 (caused by C3): because the holds were released, DepositorRecord.notice_status resets to PENDING, notice_template_code and notice_sent_at and acknowledged_at reset to null"
          - "increments InsuranceDetermination.version by 1 on the superseded row"
        note: "Compensating action for the certify cascade; conserves Institution.total_deposit_balance_cents and returns aggregate_insured_cents + aggregate_certificate_face_cents to their pre-certification values."

  - entity: DepositAccount
    dimension: "three independent dimensions on one row: insurance_status x hold_status x transition_status"
    initial_state: "insurance_status = PENDING, hold_status = NONE, transition_status = PENDING"
    terminal_states: ["insurance_status = DETERMINED", "transition_status IN {TRANSFERRED, PAID_OUT}"]
    transitions:
      - from: "insurance_status = PENDING"
        to: "insurance_status = FROZEN_FOR_DETERMINATION"
        trigger: "POST /institutions/{id}/close (cascade link L2)"
        actor: ClosingManager
        preconditions:
          - "account.insurance_status == PENDING"
          - "account.institution_id's status transitioned to CLOSED_IN_RECEIVERSHIP in this request"
        side_effects:
          - "account.insurance_status = FROZEN_FOR_DETERMINATION"
          - "increments DepositAccount.version by 1"
      - from: "insurance_status = FROZEN_FOR_DETERMINATION"
        to: "insurance_status = DETERMINED"
        trigger: "POST /insurance-determinations/{id}/certify (cascade link L2)"
        actor: ClaimsCertifier
        preconditions:
          - "account.insurance_status == FROZEN_FOR_DETERMINATION"
          - "account.attributed_amount_cents > 0 for the depositor being certified"
        side_effects:
          - "account.insurance_status = DETERMINED"
          - "increments DepositAccount.version by 1"
      - from: "hold_status = NONE"
        to: "hold_status = HELD"
        trigger: "POST /insurance-determinations/{id}/certify (cascade link L3)"
        actor: ClaimsCertifier
        preconditions:
          - "account.hold_status == NONE"
          - "the allocated hold from calculations.uninsured_hold_allocation for this account is > 0"
        side_effects:
          - "account.held_amount_cents = allocated hold"
          - "account.hold_status = HELD"
          - "increments DepositAccount.version by 1"
        note: "Zero-quantity edge: an account allocated exactly 0 cents stays at hold_status == NONE with held_amount_cents == 0."
      - from: "hold_status = HELD"
        to: "hold_status = RELEASED"
        trigger: "POST /deposit-accounts/{id}/release-hold"
        actor: ClaimsCertifier
        preconditions:
          - "account.hold_status == HELD"
          - "the account's primary depositor has notice_status == ACKNOWLEDGED (cross-entity gate)"
          - "the depositor's determination in status CERTIFIED exists"
        side_effects:
          - "account.hold_status = RELEASED"
          - "account.held_amount_cents = 0"
          - "the ReceivershipCertificate is untouched: the uninsured claim survives the operational hold release"
          - "increments DepositAccount.version by 1"
      - from: "hold_status = HELD"
        to: "hold_status = RELEASED"
        trigger: "POST /insurance-determinations (compensation cascade C3)"
        actor: ClaimsAgent
        preconditions:
          - "account.hold_status == HELD"
          - "the ReceivershipCertificate that justified the hold flipped to CANCELLED in this request"
        side_effects:
          - "account.hold_status = RELEASED"
          - "account.held_amount_cents = 0"
          - "increments DepositAccount.version by 1"
      - from: "transition_status = PENDING"
        to: "transition_status = TRANSFERRED"
        trigger: "POST /institutions/{id}/least-cost-test/award, P&A branch (cascade link L3)"
        actor: ResolutionAnalyst
        preconditions:
          - "account.transition_status == PENDING"
          - "account.insurance_status == DETERMINED"
          - "account.hold_status IN {NONE, RELEASED}"
          - "institution.resolution_method IN {WHOLE_BANK_PA, INSURED_DEPOSITS_ONLY_PA, LOSS_SHARE_PA}"
        side_effects:
          - "account.transition_status = TRANSFERRED"
          - "increments DepositAccount.version by 1"
        note: "Accounts still at hold_status == HELD are skipped — conditional cascade on sibling dimension state."
      - from: "transition_status = PENDING"
        to: "transition_status = PAID_OUT"
        trigger: "POST /institutions/{id}/least-cost-test/award, payoff branch (cascade link L3)"
        actor: ResolutionAnalyst
        preconditions:
          - "account.transition_status == PENDING"
          - "account.insurance_status == DETERMINED"
          - "account.hold_status IN {NONE, RELEASED}"
          - "institution.resolution_method == DEPOSIT_PAYOFF"
        side_effects:
          - "account.transition_status = PAID_OUT"
          - "increments DepositAccount.version by 1"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [WINNER, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: CONFORMING
        trigger: "POST /institutions/{id}/least-cost-test/evaluate (fork arm A)"
        actor: ResolutionAnalyst
        preconditions:
          - "bid.status == SUBMITTED"
          - "bid.asset_retention_pool_cents <= floor(institution.book_asset_value_cents * MAX_RETENTION_BPS / 10000)"
          - "bid's Bidder has qualification_status == QUALIFIED at evaluation time"
          - "if bid.structure == INSURED_DEPOSITS_ONLY_PA then institution.aggregate_insured_cents > 0"
        side_effects:
          - "bid.status = CONFORMING"
          - "bid.assumed_deposit_base_cents, pre_fee_cost_cents, loss_share_fee_cents, expected_loss_share_reimbursement_cents, evaluated_cost_cents written from calculations.bid_evaluated_cost"
          - "institution.conforming_bid_count += 1"
          - "increments Bid.version by 1"
      - from: SUBMITTED
        to: NON_CONFORMING
        trigger: "POST /institutions/{id}/least-cost-test/evaluate (fork arm B)"
        actor: ResolutionAnalyst
        preconditions:
          - "bid.status == SUBMITTED"
          - "at least one conformance screen above fails"
        side_effects:
          - "bid.status = NON_CONFORMING"
          - "bid.non_conformance_reason = RETENTION_POOL_ABOVE_CAP, else BIDDER_NOT_QUALIFIED_AT_EVALUATION, else INSURED_ONLY_WITHOUT_CERTIFIED_DETERMINATIONS — screens evaluated in that fixed order"
          - "bid.evaluated_cost_cents stays null; no cost calculation is run"
          - "institution.conforming_bid_count is not incremented"
          - "increments Bid.version by 1"
        note: "Divergent side-effect set versus arm A: no cost fields are written at all."
      - from: CONFORMING
        to: WINNER
        trigger: "POST /institutions/{id}/least-cost-test/award (join, selected arm)"
        actor: ResolutionAnalyst
        preconditions:
          - "bid.status == CONFORMING"
          - "bid.evaluated_cost_cents < institution.liquidation_baseline_cents"
          - "bid ranks first by evaluated_cost_cents ASC, then deposit_premium_bps DESC, then created_at ASC"
        side_effects:
          - "bid.status = WINNER"
          - "drives the award cascade L1..L4 on Institution, sibling Bids, DepositAccounts and BranchReopenings"
          - "increments Bid.version by 1"
      - from: CONFORMING
        to: REJECTED
        trigger: "POST /institutions/{id}/least-cost-test/award (join, non-selected arm)"
        actor: ResolutionAnalyst
        preconditions:
          - "bid.status == CONFORMING"
          - "another bid was selected, or no bid beat institution.liquidation_baseline_cents"
        side_effects:
          - "bid.status = REJECTED"
          - "increments Bid.version by 1"
      - from: NON_CONFORMING
        to: REJECTED
        trigger: "POST /institutions/{id}/least-cost-test/award (join, screened-out arm)"
        actor: ResolutionAnalyst
        preconditions:
          - "bid.status == NON_CONFORMING"
        side_effects:
          - "bid.status = REJECTED"
          - "increments Bid.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /bids/{id}/withdraw"
        actor: Bidder
        preconditions:
          - "bid.status == SUBMITTED"
          - "X-User-ID == bid.bidder_id"
        side_effects:
          - "bid.status = WITHDRAWN"
          - "the bid's data-room window stops blocking new reservations on this institution"
          - "increments Bid.version by 1"

  - entity: ReceivershipCertificate
    initial_state: ISSUED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /dividend-distributions/{id}/settle where the allocation is less than the remaining face"
        actor: ReceivershipTrustee
        preconditions:
          - "certificate.status == ISSUED"
          - "allocated dividend > 0 and cumulative_dividends_cents + allocated < face_amount_cents"
        side_effects:
          - "certificate.cumulative_dividends_cents += allocated"
          - "certificate.last_dividend_amount_cents = allocated; last_dividend_round = round"
          - "certificate.status = PARTIALLY_PAID"
          - "increments ReceivershipCertificate.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /dividend-distributions/{id}/settle where the allocation closes the remaining face"
        actor: ReceivershipTrustee
        preconditions:
          - "certificate.status == PARTIALLY_PAID"
          - "cumulative_dividends_cents + allocated == face_amount_cents"
        side_effects:
          - "certificate.cumulative_dividends_cents = face_amount_cents"
          - "certificate.status = PAID"
          - "increments ReceivershipCertificate.version by 1"
      - from: PARTIALLY_PAID
        to: ISSUED
        trigger: "POST /dividend-distributions/{id}/void (reversal of the latest SETTLED round)"
        actor: ReceivershipTrustee
        preconditions:
          - "certificate.last_dividend_round == the voided round's distribution_round"
          - "certificate.cumulative_dividends_cents - certificate.last_dividend_amount_cents == 0"
        side_effects:
          - "certificate.cumulative_dividends_cents -= last_dividend_amount_cents"
          - "certificate.last_dividend_amount_cents = 0; last_dividend_round = 0"
          - "certificate.status = ISSUED"
          - "increments ReceivershipCertificate.version by 1"
        note: "Compensation edge; when the reversal leaves a non-zero cumulative balance the status returns to PARTIALLY_PAID instead."
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /dividend-distributions/{id}/void (reversal that reopens a fully paid certificate)"
        actor: ReceivershipTrustee
        preconditions:
          - "certificate.last_dividend_round == the voided round's distribution_round"
          - "certificate.cumulative_dividends_cents - certificate.last_dividend_amount_cents > 0"
        side_effects:
          - "certificate.cumulative_dividends_cents -= last_dividend_amount_cents"
          - "certificate.status = PARTIALLY_PAID"
          - "increments ReceivershipCertificate.version by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /insurance-determinations (compensation cascade C2)"
        actor: ClaimsAgent
        preconditions:
          - "certificate.status == ISSUED"
          - "certificate.cumulative_dividends_cents == 0"
          - "the issuing determination flipped to SUPERSEDED in this request"
        side_effects:
          - "certificate.status = CANCELLED"
          - "institution.aggregate_certificate_face_cents and uninsured_claim_count recomputed excluding this certificate"
          - "increments ReceivershipCertificate.version by 1"

  - entity: BranchReopening
    initial_state: PLANNED
    terminal_states: [REOPENED]
    transitions:
      - from: PLANNED
        to: READY
        trigger: "POST /institutions/{id}/least-cost-test/award (cascade link L4)"
        actor: ResolutionAnalyst
        preconditions:
          - "reopening.status == PLANNED"
          - "at least one DepositAccount for the institution reached transition_status TRANSFERRED or PAID_OUT in this request"
        side_effects:
          - "reopening.status = READY"
          - "increments BranchReopening.version by 1"
      - from: READY
        to: REOPENED
        trigger: "POST /branch-reopenings/{id}/reopen"
        actor: ClosingManager
        preconditions:
          - "reopening.status == READY"
          - "logical clock now >= reopening.reopen_window_start AND logical clock now < reopening.reopen_window_end (half-open window)"
          - "institution.least_cost_status IN {AWARDED, FAILED_ALL_BIDS} (cross-entity gate)"
        side_effects:
          - "reopening.status = REOPENED"
          - "reopening.reopened_at = logical clock now"
          - "increments BranchReopening.version by 1"
      - from: READY
        to: PLANNED
        trigger: "POST /branch-reopenings/{id}/reschedule"
        actor: ClosingManager
        preconditions:
          - "reopening.status IN {PLANNED, READY}"
          - "the proposed window passes the same half-open overlap screen as creation"
        side_effects:
          - "reopening.reopen_window_start / reopen_window_end overwritten"
          - "reopening.status = PLANNED"
          - "reopening.reschedule_count += 1"
          - "increments BranchReopening.version by 1"
        note: "Cycle: PLANNED -> READY -> PLANNED. A rescheduled branch must be re-readied by a later award cascade, which cannot happen twice, so rescheduling after an award strands the branch at PLANNED by design."
      - from: PLANNED
        to: PLANNED
        trigger: "POST /branch-reopenings/{id}/reschedule (reschedule before the award cascade)"
        actor: ClosingManager
        preconditions:
          - "reopening.status == PLANNED"
          - "the proposed window passes the half-open overlap screen"
        side_effects:
          - "window overwritten; reschedule_count += 1"
          - "increments BranchReopening.version by 1"

  - entity: DividendDistribution
    initial_state: DECLARED
    terminal_states: [VOIDED]
    transitions:
      - from: DECLARED
        to: SETTLED
        trigger: "POST /dividend-distributions/{id}/settle"
        actor: ReceivershipTrustee
        preconditions:
          - "distribution.status == DECLARED"
          - "institution.status IN {RESOLUTION_COMPLETE, CLOSED_IN_RECEIVERSHIP}"
          - "computed payout total <= institution.receivership_cash_cents"
        side_effects:
          - "runs calculations.dividend_waterfall_allocation"
          - "for GENERAL_UNSECURED: each eligible ReceivershipCertificate advances through its own machine and accumulates cumulative_dividends_cents"
          - "distribution.total_distributed_cents and certificate_count written; settled_at stamped"
          - "distribution.status = SETTLED"
          - "institution.receivership_cash_cents recomputed (decreases by total_distributed_cents)"
          - "increments DividendDistribution.version by 1"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /dividend-distributions/{id}/void"
        actor: ReceivershipTrustee
        preconditions:
          - "distribution.status == SETTLED"
          - "distribution.distribution_round == max(distribution_round) over the institution's SETTLED rounds (only the latest settled round is reversible)"
        side_effects:
          - "compensation: every ReceivershipCertificate with last_dividend_round == this round has its cumulative_dividends_cents reduced by last_dividend_amount_cents and its status recomputed"
          - "distribution.total_distributed_cents kept for audit; voided_at stamped"
          - "distribution.status = VOIDED"
          - "institution.receivership_cash_cents recomputed (returns to the pre-settlement value)"
          - "institution.dividend_round_count recomputed (VOIDED rounds are excluded)"
          - "increments DividendDistribution.version by 1"

# =====================================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's version — the only sanctioned mechanism)
# =====================================================================================
concurrency_rules:
  - rule_id: determination-create-stale-depositor
    parent_entity: DepositorRecord
    write_endpoint: "POST /insurance-determinations"
    occ_field: "expected_depositor_record_version"
    description: |
      Creating an InsuranceDetermination against a DepositorRecord whose version has advanced
      since the client last observed it is rejected. This captures the case where another writer
      has already produced a determination for this depositor that legitimately supersedes the
      prior certified one (see the CERTIFIED -> SUPERSEDED edge), so the current writer's view of
      the depositor's certified position is stale.
    error_id: ERR_STALE_DEPOSITOR_VERSION
    http_status: 412
  - rule_id: dividend-declare-stale-institution
    parent_entity: Institution
    write_endpoint: "POST /institutions/{id}/dividend-distributions"
    occ_field: "expected_institution_version"
    description: |
      Declaring a dividend round against an Institution whose version has advanced since the
      client last read its receivership_cash_cents is rejected. A further round is a legitimate
      operation on its own, so the guard is purely the stale cash/round view the declaring
      trustee is working from.
    error_id: ERR_STALE_INSTITUTION_VERSION
    http_status: 412

# =====================================================================================
# §1.3 Calculation Rules Table
# =====================================================================================
calculations:
  - name: readiness_standardization_score
    trigger: "POST /readiness-submissions/{id}/standardize — writes submission.standardization_score_bps and submission.deposit_total_variance_bps, then drives the STANDARDIZED / REJECTED fork"
    algorithm: threshold
    formula: |
      # step 1 — clean-record score, truncated (never rounded up)
      standardization_score_bps = floor((record_count - malformed_record_count) * 10000 / record_count)

      # step 2 — reconciliation of the asserted total against the booked accounts
      booked_total_cents = sum(balance_cents + accrued_interest_cents)
                           over DepositAccount where institution_id == submission.institution_id
                           (no status filter — every booked account counts)
      if booked_total_cents == 0:
          deposit_total_variance_bps = 0 if reported_deposit_total_cents == 0 else 10000
      else:
          deposit_total_variance_bps = floor(abs(reported_deposit_total_cents - booked_total_cents)
                                             * 10000 / booked_total_cents)

      # step 3 — gates, evaluated in this fixed order so rejection_reason is deterministic
      if standardization_score_bps < READINESS_SCORE_FLOOR_BPS:
          status = REJECTED ; rejection_reason = SCORE_BELOW_FLOOR
      elif deposit_total_variance_bps > READINESS_VARIANCE_CEILING_BPS:
          status = REJECTED ; rejection_reason = TOTAL_VARIANCE_EXCEEDED
      else:
          status = STANDARDIZED
    input_set: "the submission under standardization plus every DepositAccount of its institution, unfiltered by insurance_status / hold_status / transition_status"
    constants:
      READINESS_SCORE_FLOOR_BPS: 9800
      READINESS_VARIANCE_CEILING_BPS: 25
    precision: "integer basis points; floor (truncation) on both bps derivations, never round-half-up"
    note: "Boundary: standardization_score_bps == 9800 exactly passes (>=); deposit_total_variance_bps == 25 exactly passes (<=)."

  - name: depositor_insurance_determination
    trigger: "POST /insurance-determinations/{id}/prepare — writes insured_amount_cents, uninsured_amount_cents, attributed_total_cents, category_breakdown on the determination and attributed_amount_cents on each contributing DepositAccount"
    algorithm: aggregation
    formula: |
      SMDIA = 25000000   # standard maximum deposit insurance amount, in cents

      # ---- step 1: attribute dollars to (depositor, ownership_category) buckets -------------
      # Only accounts of the depositor's own institution participate. Accounts are read at
      # insurance_status == FROZEN_FOR_DETERMINATION (post-closure) or DETERMINED (re-prepare
      # after a revision loop); PENDING accounts are excluded because the institution has not
      # closed yet, which the prepare precondition already forbids.
      acct_amount(A) = A.balance_cents + A.accrued_interest_cents

      SINGLE bucket:
        + acct_amount(A) for every A with ownership_category == SINGLE and A.primary_depositor_id == D.id
        + every pass-through participant share credited to D by calculations.pass_through_beneficiary_attribution
        + the full acct_amount(A) of every BROKERED_PASS_THROUGH account whose recordkeeping_status
          != COMPLETE and whose primary_depositor_id == D.id (pass-through denied, broker owns it)

      JOINT bucket:
        for every A with ownership_category == JOINT that has an OwnershipInterest row
        (deposit_account_id == A.id, depositor_record_id == D.id, interest_role == CO_OWNER):
          + round_half_up(acct_amount(A) * interest.designated_share_bps / 10000)

      REVOCABLE_TRUST bucket (D is the grantor, i.e. A.primary_depositor_id == D.id):
        + acct_amount(A) for every such A
        limit = SMDIA * min(count(distinct depositor_record_id over OwnershipInterest rows on A
                                  with interest_role == BENEFICIARY), REVOCABLE_BENEFICIARY_CAP)
        (a revocable trust account with zero BENEFICIARY rows takes limit = SMDIA * 1)

      IRREVOCABLE_TRUST bucket (D is the grantor):
        insured_irrevocable = sum over BENEFICIARY interests B on each such A of
                              min(round_half_up(acct_amount(A) * B.designated_share_bps / 10000), SMDIA)
        attributed_irrevocable = sum of acct_amount(A) over those accounts
        (a zero-BENEFICIARY irrevocable trust account is insured at min(attributed, SMDIA))

      RETIREMENT bucket:
        + acct_amount(A) for every A with ownership_category == RETIREMENT and A.primary_depositor_id == D.id

      # ---- step 2: apply the per-category limit ---------------------------------------------
      limit(SINGLE)   = SMDIA
      limit(JOINT)    = SMDIA
      limit(RETIREMENT) = SMDIA
      limit(REVOCABLE_TRUST) = SMDIA * min(beneficiary_count, REVOCABLE_BENEFICIARY_CAP)
      IRREVOCABLE_TRUST does not use a bucket limit; its insured figure is the per-beneficiary
      min() sum computed in step 1.

      insured_amount_cents   = sum over categories of min(attributed_c, limit_c)
      uninsured_amount_cents = sum over categories of max(0, attributed_c - limit_c)
      attributed_total_cents = sum over categories of attributed_c
      category_breakdown[c]  = { attributed_cents, limit_cents, insured_cents, uninsured_cents }
    input_set: "every DepositAccount of the depositor's institution on which the depositor is the primary owner or holds an OwnershipInterest; accounts must be at insurance_status FROZEN_FOR_DETERMINATION or DETERMINED"
    constants:
      SMDIA_CENTS: 25000000
      REVOCABLE_BENEFICIARY_CAP: 5
    precision: "cents; round_half_up on every per-share multiplication BEFORE the category limit is applied"
    variants:
      - name: AGGREGATE_BY_CATEGORY
        when: "method_variant == AGGREGATE_BY_CATEGORY; the only variant that may be certified"
        difference: "Attributed dollars are pooled per ownership category first, and the limit is applied once to the pooled bucket, so a depositor with two SINGLE accounts of 20000000 and 9000001 is insured 25000000 and uninsured 4000001."
      - name: PER_ACCOUNT_PROVISIONAL
        when: "method_variant == PER_ACCOUNT_PROVISIONAL; used for the provisional read a claims agent produces before the file is reconciled"
        difference: "The limit is applied independently to each account's own attributed share: insured = sum over accounts of min(share, limit_c), so the same two SINGLE accounts are insured 29000001 and uninsured 0. Certification of this variant is refused by ERR_PROVISIONAL_VARIANT_NOT_CERTIFIABLE."

  - name: pass_through_beneficiary_attribution
    trigger: "POST /insurance-determinations/{id}/prepare — component of depositor_insurance_determination for BROKERED_PASS_THROUGH accounts"
    algorithm: constraint_propagation
    formula: |
      for every DepositAccount A with ownership_category == BROKERED_PASS_THROUGH
      and institution_id == D.institution_id:
        amount = A.balance_cents + A.accrued_interest_cents
        if A.recordkeeping_status == COMPLETE:
            # pass-through granted: each PARTICIPANT interest is insured at the participant's
            # own SINGLE bucket, aggregating with any SINGLE accounts the participant already has
            for each OwnershipInterest P on A with interest_role == PARTICIPANT:
                credit round_half_up(amount * P.designated_share_bps / 10000)
                       into SINGLE bucket of depositor P.depositor_record_id
            # the broker (A.primary_depositor_id) is credited nothing
        else:   # DEFICIENT or PENDING
            # pass-through denied: the entire omnibus balance lands in the broker's SINGLE bucket
            credit amount into SINGLE bucket of depositor A.primary_depositor_id
            # participants are credited nothing
    input_set: "BROKERED_PASS_THROUGH accounts of the institution plus their PARTICIPANT OwnershipInterest rows"
    constants:
      SMDIA_CENTS: 25000000
    precision: "cents; round_half_up per participant share, then the SINGLE bucket limit is applied once by depositor_insurance_determination"
    note: "The same omnibus dollars land in different depositors' determinations depending solely on recordkeeping_status — three inputs (amount, share_bps, recordkeeping_status) interacting non-linearly with the participant's own SINGLE balance and the SMDIA cap."

  - name: uninsured_hold_allocation
    trigger: "POST /insurance-determinations/{id}/certify (cascade link L3) — writes DepositAccount.held_amount_cents and flips hold_status"
    algorithm: waterfall_allocation
    formula: |
      U = determination.uninsured_amount_cents
      if U == 0: no account is touched; every hold_status stays NONE
      eligible = DepositAccount rows with attributed_amount_cents > 0 for this depositor,
                 ordered by created_at ASC, tie-break account_number ASC (lexicographic)
      T = sum of attributed_amount_cents over eligible
      raw_i  = U * attributed_amount_cents_i / T          # exact rational, no rounding yet
      hold_i = floor(raw_i)                               # truncate every share
      remainder = U - sum(hold_i)                         # 0 <= remainder < count(eligible)
      distribute the remainder one cent at a time to the eligible accounts in the same
      created_at ASC / account_number ASC order until it is exhausted
      account.held_amount_cents = hold_i ; hold_status = HELD when hold_i > 0 else NONE
    input_set: "DepositAccounts with attributed_amount_cents > 0 for the certified depositor"
    constants: {}
    precision: "cents; floor on each share, then single-cent remainder distribution in created_at ASC order — never round_half_up per share (that would over-allocate)"
    note: "Conserves the named quantity exactly: sum(held_amount_cents) == determination.uninsured_amount_cents."

  - name: liquidation_baseline_cost
    trigger: "POST /institutions/{id}/least-cost-test/evaluate — writes institution.liquidation_baseline_cents"
    algorithm: threshold
    formula: |
      insured_share_bps = floor(institution.aggregate_insured_cents * 10000
                                / institution.total_deposit_balance_cents)
                          # 0 when total_deposit_balance_cents == 0
      subrogated_recovery_cents = round_half_up(institution.estimated_liquidation_recovery_cents
                                               * insured_share_bps / 10000)
      liquidation_baseline_cents = institution.aggregate_insured_cents
                                 + ADMIN_COST_PER_DEPOSITOR_CENTS * institution.depositor_record_count
                                 - subrogated_recovery_cents
    input_set: "institution aggregates as of the evaluate call: aggregate_insured_cents (CERTIFIED determinations only), depositor_record_count, estimated_liquidation_recovery_cents, total_deposit_balance_cents"
    constants:
      ADMIN_COST_PER_DEPOSITOR_CENTS: 150000
    precision: "cents; floor on insured_share_bps, round_half_up on subrogated_recovery_cents, in that order"
    note: "A bid wins only when evaluated_cost_cents < liquidation_baseline_cents. Equality is NOT least-costly and falls through to the FAILED_ALL_BIDS edge."

  - name: bid_evaluated_cost
    trigger: "POST /institutions/{id}/least-cost-test/evaluate — writes assumed_deposit_base_cents, pre_fee_cost_cents, loss_share_fee_cents, expected_loss_share_reimbursement_cents, evaluated_cost_cents on every CONFORMING bid"
    algorithm: tiered_pricing
    formula: |
      # The loss-share administration fee is tier-selected from the cost, and the cost includes
      # the fee — the dependency LOOKS circular. It is resolved by this pinned evaluation order:
      # the tier is keyed on pre_fee_cost_cents (step 5), never on the final evaluated cost.

      # step 1 — assumed deposit base
      assumed_deposit_base_cents = institution.aggregate_insured_cents
                                     if structure == INSURED_DEPOSITS_ONLY_PA
                                   else institution.total_deposit_balance_cents

      # step 2 — deposit premium the acquirer pays the receivership
      deposit_premium_cents = round_half_up(assumed_deposit_base_cents * deposit_premium_bps / 10000)

      # step 3 — value of the transferred asset pool
      transferred_asset_value_cents = institution.book_asset_value_cents - asset_retention_pool_cents
      asset_bid_value_cents = round_half_up(transferred_asset_value_cents
                                            * (10000 - asset_discount_bps) / 10000)

      # step 4 — shortfall the insurer eats on the pool the bidder leaves behind
      retained_shortfall_bps = RETAINED_SHORTFALL_BASE_BPS      # EXPECTED_LOSS_SHARE variant
                            or RETAINED_SHORTFALL_STRESS_BPS    # RETENTION_ADJUSTED variant
      retained_shortfall_cents = round_half_up(asset_retention_pool_cents
                                               * retained_shortfall_bps / 10000)

      # step 5 — pre-fee cost (the tier key)
      pre_fee_cost_cents = assumed_deposit_base_cents
                         - asset_bid_value_cents
                         - deposit_premium_cents
                         + retained_shortfall_cents

      # step 6 — tier selection on pre_fee_cost_cents
      if   pre_fee_cost_cents <= LSF_TIER_A_CEILING_CENTS: tier_bps = LSF_TIER_A_BPS
      elif pre_fee_cost_cents <= LSF_TIER_B_CEILING_CENTS: tier_bps = LSF_TIER_B_BPS
      else:                                                tier_bps = LSF_TIER_C_BPS

      # step 7 — the fee itself (only loss-share structures pay it)
      loss_share_fee_cents = round_half_up(pre_fee_cost_cents * tier_bps / 10000)
                             if structure == LOSS_SHARE_PA else 0

      # step 8 — variant-dependent expected reimbursement on covered assets
      expected_loss_share_reimbursement_cents =
          round_half_up(transferred_asset_value_cents * EXPECTED_LOSS_RATE_BPS
                        * loss_share_pct_bps / 100000000)
          if (variant == EXPECTED_LOSS_SHARE and structure == LOSS_SHARE_PA) else 0

      # step 9 — total
      evaluated_cost_cents = pre_fee_cost_cents + loss_share_fee_cents
                           + expected_loss_share_reimbursement_cents
    input_set: "each Bid that passed the conformance screen, joined to its institution's aggregate_insured_cents, total_deposit_balance_cents and book_asset_value_cents as of the evaluate call"
    constants:
      RETAINED_SHORTFALL_BASE_BPS: 3000
      RETAINED_SHORTFALL_STRESS_BPS: 4200
      EXPECTED_LOSS_RATE_BPS: 1800
      LSF_TIER_A_CEILING_CENTS: 5000000
      LSF_TIER_B_CEILING_CENTS: 20000000
      LSF_TIER_A_BPS: 25
      LSF_TIER_B_BPS: 40
      LSF_TIER_C_BPS: 60
      MAX_RETENTION_BPS: 5000
    precision: "cents; round_half_up at steps 2, 3, 4, 7 and 8 independently — the products are never chained before rounding"
    variants:
      - name: EXPECTED_LOSS_SHARE
        when: "institution.least_cost_test_variant == EXPECTED_LOSS_SHARE (requested at evaluate time)"
        difference: "Retained assets are marked at RETAINED_SHORTFALL_BASE_BPS (3000) and the insurer books a probability-weighted loss-share reimbursement on the transferred pool at EXPECTED_LOSS_RATE_BPS * loss_share_pct_bps. Loss-share bids therefore look expensive."
      - name: RETENTION_ADJUSTED
        when: "institution.least_cost_test_variant == RETENTION_ADJUSTED"
        difference: "No reimbursement is booked at all (step 8 == 0); instead the retained pool is stressed at RETAINED_SHORTFALL_STRESS_BPS (4200), which raises pre_fee_cost_cents and can push it across a loss-share fee tier boundary. The same bid set can therefore produce a different winner than EXPECTED_LOSS_SHARE."

  - name: dividend_waterfall_allocation
    trigger: "POST /dividend-distributions/{id}/settle — writes total_distributed_cents, certificate_count and every touched certificate's cumulative_dividends_cents"
    algorithm: waterfall_allocation
    formula: |
      # Rounding order is PINNED: round per certificate first, then sum. Summing the faces and
      # rounding once produces a different total and is explicitly wrong here.
      if priority_class == INSURED_SUBROGATION:
          total = round_half_up(institution.aggregate_insured_cents * declared_rate_bps / 10000)
          certificate_count = 0
          (no ReceivershipCertificate is touched)
      else:   # GENERAL_UNSECURED
          claims = ReceivershipCertificate rows with institution_id == institution.id
                   and status IN {ISSUED, PARTIALLY_PAID},
                   processed in created_at ASC order, tie-break face_amount_cents DESC
          for each claim C:
              gross_i   = round_half_up(C.face_amount_cents * declared_rate_bps / 10000)
              payable_i = min(gross_i, C.face_amount_cents - C.cumulative_dividends_cents)
          total = sum of payable_i                       # sum AFTER per-claim rounding
          certificate_count = count of claims with payable_i > 0
      if total > institution.receivership_cash_cents: reject with ERR_INSUFFICIENT_RECEIVERSHIP_CASH
      apply: C.cumulative_dividends_cents += payable_i ;
             C.last_dividend_amount_cents = payable_i ; C.last_dividend_round = distribution_round ;
             C.status = PAID when cumulative == face else PARTIALLY_PAID (unchanged when payable_i == 0)
      distribution.total_distributed_cents = total
      institution.receivership_cash_cents decreases by total
    input_set: "ReceivershipCertificate rows of the institution in status ISSUED or PARTIALLY_PAID (CANCELLED and PAID excluded); for INSURED_SUBROGATION rounds, institution.aggregate_insured_cents instead"
    constants: {}
    precision: "cents; round_half_up per certificate, then sum — order pinned, sum-then-round is forbidden"
    note: "With faces 4000001 and 2000001 at 3333 bps the pinned order yields 1333200 + 666600 = 1999800, while sum-then-round would yield 1999801."

  - name: institution_aggregate_reconciliation
    trigger: "every mutation that writes a DepositAccount balance, a CERTIFIED/SUPERSEDED determination, a ReceivershipCertificate status, a receivership-proceeds posting, or a dividend settle/void"
    algorithm: aggregation
    formula: |
      total_deposit_balance_cents = sum(balance_cents + accrued_interest_cents)
                                    over DepositAccount where institution_id == I.id (all statuses)
      depositor_record_count      = count(DepositorRecord where institution_id == I.id)
      aggregate_insured_cents     = sum(InsuranceDetermination.insured_amount_cents)
                                    over determinations with status == CERTIFIED whose
                                    depositor_record_id belongs to I
      aggregate_certificate_face_cents = sum(face_amount_cents) over ReceivershipCertificate
                                    where institution_id == I.id and status IN {ISSUED, PARTIALLY_PAID, PAID}
      uninsured_claim_count       = count of those same certificates
      gross_disposition_proceeds_cents  = sum of every posted gross_proceeds_cents
      disposition_expense_total_cents   = sum of every posted disposition_expense_cents
      receivership_cash_cents     = gross_disposition_proceeds_cents
                                  - disposition_expense_total_cents
                                  - sum(DividendDistribution.total_distributed_cents where status == SETTLED)
      dividend_round_count        = count(DividendDistribution where institution_id == I.id
                                    and status IN {DECLARED, SETTLED})
    input_set: "all children of the institution, with the status filters written above"
    constants: {}
    precision: "cents; full recompute on every triggering mutation (no incremental drift)"
    note: |
      Two conserved quantities fall out of this recompute and are exposed by
      GET /institutions/{id}/insurance-summary:
        conservation_delta_cents = sum over depositors with a CERTIFIED determination of
            (certified_insured_cents + certified_uninsured_cents)
          - (aggregate_insured_cents + aggregate_certificate_face_cents)   ==> MUST be 0
        cash_conservation_delta_cents = (gross_disposition_proceeds_cents
            - disposition_expense_total_cents)
          - (receivership_cash_cents + sum of cumulative_dividends_cents over non-CANCELLED
             certificates + sum of total_distributed_cents over SETTLED INSURED_SUBROGATION rounds)
                                                                          ==> MUST be 0

# =====================================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins a dual failure)
# =====================================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 10
    category: existence
    check: "the {id} path segment or institution_id body field resolves to an Institution"
    error_id: ERR_INSTITUTION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying an institution id in the path or body"
  - priority: 11
