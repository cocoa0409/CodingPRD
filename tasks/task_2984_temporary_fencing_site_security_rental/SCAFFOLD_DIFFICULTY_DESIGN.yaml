  - rule_id: priority_pair_validation_conflict
    instances:

      - name: work_order_state_error_precedes_credit_hold_on_dispatch
        grounds:
          - validations.priority_9_ERR_WORK_ORDER_STATE
          - validations.priority_25_ERR_ACCOUNT_CREDIT_HOLD
          - state_machines.WorkOrder.PLANNED_to_SCHEDULED
          - calculations.account_exposure
        distinguishing_aspect: |
          One request violates both the work-order state gate (priority 9) and the
          credit-hold gate (priority 25) at once and must answer with
          ERR_WORK_ORDER_STATE 409, not ERR_ACCOUNT_CREDIT_HOLD 402. The control
          call in the same world violates only the credit-hold gate and answers
          ERR_ACCOUNT_CREDIT_HOLD 402, so an implementation that checks credit
          before state, or that short-circuits on either one, gets exactly one of
          the two calls wrong.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01, advanced to 2026-08-20T00:00:00Z."
            - "Municipality HRB-01, rental_tax_rate_bp 890."
            - "CustomerAccount credit_limit_cents 85486, one cent under the mobilization invoice total of 85487, so credit_hold_flag is true after mobilization."
            - "CONSTRUCTION contract 500 ft, NONE screen, term 3, no add-ons, jobsite SOIL with phase_count 4 and requires_sidewalk_closure false."
            - "The DELIVERY_INSTALL order is already COMPLETED; a RELOCATION order for phase 1 -> 2 is still PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
