            - { call: "POST /endowment/valuations", payload: { pool_id: "${pf_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { pf_v1: $.data.id } }
            - { call: "GET /endowment/pools/${pf_pool}", as: InvestmentOfficer, captures: { pf_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${pf_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${pf_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${pf_fund}", fiscal_year: 2026 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { pf_d: $.data.id } }
            - { call: "POST /endowment/distributions/${pf_d}/propose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
