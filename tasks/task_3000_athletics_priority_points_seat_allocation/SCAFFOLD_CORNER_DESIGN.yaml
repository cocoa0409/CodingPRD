      - name: an_empty_section_lands_in_normal_posture_and_recommends_the_unchanged_requirement
        claim_type: threshold
        grounds:
          - calculations.section_pricing_posture.formula
          - calculations.section_pricing_sensitivity.formula
          - endpoints[GET /athletics/sections/{id}/pricing-sensitivity]
        distinguishing_aspect: |
          A brand-new section with two AVAILABLE seats and no assignments has
          underwater_ratio 0.0000, which satisfies the PREMIUM branch's ratio
          clause but FAILS its seats_available == 0 clause, so the posture must be
          NORMAL and recommended_requirement_cents must equal
          per_seat_requirement_cents exactly — neither the 0.90 SOFT nor the 1.10
          PREMIUM ratio may be applied. A reprice must then move the
          recommendation with the market rate and leave the old rate visible in
          requirement_history for grandfathering.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Section SEC-N with seat_capacity 2, per_seat_requirement_cents 150000, required_points_per_seat 0.00."
            - "Two seats created in the section; no picks, so no SeatAssignment rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-N", venue_code: "STADIUM-N", seat_capacity: 2, per_seat_requirement_cents: 150000, required_points_per_seat: 0.00 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { secn_id: "$.data.id" }
            - call: "POST /athletics/sections/${secn_id}/seats"
              payload: { row_label: "N", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/sections/${secn_id}/seats"
              payload: { row_label: "N", seat_number: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /athletics/sections/${secn_id}/pricing-sensitivity"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/sections/${secn_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { secn_v: "$.data.version" }
            - call: "POST /athletics/sections/${secn_id}/reprice"
              payload: { per_seat_requirement_cents: 200000, cycle_year: 2027, expected_section_version: "${secn_v}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /athletics/sections/${secn_id}/pricing-sensitivity"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "First pricing-sensitivity read: HTTP 200 with section_code == \"SEC-N\", assigned_seat_count == 0, underwater_seat_count == 0, underwater_ratio == 0.0000"
            - "First read: pricing_posture == \"NORMAL\" (the PREMIUM branch needs seats_available == 0, and seats_available is 2)"
            - "First read: per_seat_requirement_cents == 150000 and recommended_requirement_cents == 150000 (NOT 135000 and NOT 165000)"
            - "First read: requirement_history has exactly 1 entry == { cycle_year: 2026, per_seat_requirement_cents: 150000 } (the create-time entry keyed on the clock's UTC year)"
            - "Reprice returns HTTP 200 with Section.${secn_id}.per_seat_requirement_cents == 200000"
            - "Second read: recommended_requirement_cents == 200000 and requirement_history has exactly 2 entries, the second == { cycle_year: 2027, per_seat_requirement_cents: 200000 }, the first still { cycle_year: 2026, per_seat_requirement_cents: 150000 }"
            - "Second read: pricing_posture is still \"NORMAL\" and underwater_ratio is still 0.0000"

      - name: reseating_decommissions_the_surplus_seat_by_created_at_ascending
        claim_type: aggregation
        grounds:
          - state_machines.Section.renovation_status.transitions.REPRICED_to_RESEATING
          - state_machines.Seat.transitions.AVAILABLE_to_DECOMMISSIONED
          - calculations.section_seat_inventory.formula
        distinguishing_aspect: |
          Shrinking a 3-seat section to a post_renovation_capacity of 2 must
          decommission exactly one seat, and it must be the seat with the LATEST
          created_at (N/3), never the lowest or highest id. The inventory
          identity seats_available + seats_committed_count +
          decommissioned_seat_count == seat_row_count must still hold with
          seat_row_count staying at 3 while seat_capacity drops to 2 — the
          decommissioned row is not deleted. With no seated assignments,
          reseated_donor_count and reseating_invoice_total_cents must both be 0,
