- section: cross_cutting_layers
  instances:
  - name: stale_district_version_blocks_a_second_ride_request_creation
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[ride-request-create-stale-district]
    - entities.District.fields.version
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: The second create carries a version the district had before the first create bumped it, so it is refused at 412 with ERR_STALE_VERSION while a create using the freshly read version succeeds — the whole check is two strictly sequential requests.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z, moved to 2026-09-10T06:00:00Z; one district and one rider.
