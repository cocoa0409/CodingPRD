      - name: parallel_dimensions_advance_independently_on_one_lease
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Lease.occupancy_status
          - state_machines.Lease.allotment_status
        excluded_because:
          difficulty_instance: lease_parallel_occupancy_and_allotment_dimensions
          rationale: "The depth probe already walks the full parallel-dimension matrix on one lease - occupancy PENDING_MOVE_IN -> OCCUPIED -> NOTICE_GIVEN -> TERMINATED against allotment NOT_STARTED -> ACTIVE -> SUSPENDED -> ACTIVE -> CLOSED - including the two edges where one dimension moves while the other is deliberately held still. A breadth instance could only replay a prefix of that walk."

      - name: compensating_void_reverses_the_assessment_side_effects
        claim_type: compensation
        grounds:
          - state_machines.HazardCase.ASSESSED_to_VOIDED
          - state_machines.Lease.allotment_status.SUSPENDED_to_ACTIVE
          - calculations.allotment_ledger_conservation
        excluded_because:
          difficulty_instance: hazard_void_restores_allotment_ledger_without_drift
          rationale: "The void edge is a compensating action whose whole point is arithmetic exactness: the depth probe pins the ARREARS_ADJUSTMENT row, the restored allotment_balance_cents, abatement_total_cents back to 0, the lodging closed at nights_displaced 0 and the unit and counter restoration. Re-asserting any subset here would duplicate that instance without adding a distinct claim."

      - name: clearance_is_guarded_on_the_remediation_order_reaching_completion
        claim_type: guarded_transitions
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.HazardCase.REMEDIATION_IN_PROGRESS_to_CLEARANCE_PENDING
          - state_machines.HazardCase.CLEARANCE_PENDING_to_CLOSED
        excluded_because:
          difficulty_instance: hazard_clearance_gated_on_remediation_work_order_completion
          rationale: "The cross-entity guard - a case may only reach CLEARANCE_PENDING because a DIFFERENT entity, the remediation WorkOrder, reached COMPLETED or CLOSED - is exactly the dependency the depth probe drives from both sides. The breadth instance above covers only the much shallower REPORTED-state refusal."

      - name: lodging_closure_syncs_the_reinvestment_account_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.DisplacementLodging.AUTHORIZED_to_CLOSED
          - entities.ReinvestmentAccount.fields.expenditures_cents
          - entities.ReinvestmentAccount.fields.closing_balance_cents
        excluded_because:
          difficulty_instance: remediation_completion_cascades_lodging_close_to_account_balance
          rationale: "The before/after reconciliation of the ancestor account - expenditures_cents rising by the closed lodging total and closing_balance_cents re-derived with version += 1 - is the ledger-sync claim the depth probe already reconciles end to end, including the cascaded expenditure that bypasses the balance-sufficiency rung."

      - name: inspection_auto_completes_when_its_last_critical_child_closes
        claim_type: bubble_up
        grounds:
          - state_machines.MoveInInspection.TENANT_ACKNOWLEDGED_to_COMPLETED
          - entities.MoveInInspection.fields.critical_open_count
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
        excluded_because:
          difficulty_instance: move_in_gated_on_move_in_inspection_critical_deficiency_clearing
          rationale: "The parent-follows-children claim - the inspection climbing to COMPLETED only when the last HABITABILITY_CRITICAL deficiency work order completes and critical_open_count reaches 0 - is inseparable from the depth instance that blocks and then unblocks move-in on exactly that counter."

      - name: lodging_creation_reads_the_hazard_case_state_of_another_entity
        claim_type: cross_entity
        grounds:
          - entities.DisplacementLodging.fields.hazard_case_id
          - validations[priority=26]
          - state_machines.HazardCase.ASSESSED_to_DISPLACEMENT_ACTIVE
        excluded_because:
          difficulty_instance: lodging_authorization_gated_on_hazard_case_assessment
          rationale: "Verifying the second entity's state and fields after the cross-entity read - the case in DISPLACEMENT_ACTIVE with displacement_required true, and the lodging it admits - is the depth instance's subject. The breadth instance here only shows the REPORTED refusal, deliberately stopping short of the authorised path."

      - name: termination_cascades_down_to_the_unit_and_the_installation_counters
        claim_type: cascade_down
        grounds:
          - state_machines.Lease.occupancy_status.NOTICE_GIVEN_to_TERMINATED
          - state_machines.HousingUnit.OCCUPIED_to_AVAILABLE
          - entities.Installation.fields.occupied_unit_count
        excluded_because:
          difficulty_instance: lease_termination_cascades_unit_release_to_installation_counters
          rationale: "The multi-level descent from the terminating lease to the released unit, its last_lease_end_date, the two moved Installation counters and the settlement rows is the depth probe's transitive-cascade instance; a breadth instance would have to re-run the identical four hops to say anything at all."

      - name: assessment_cascade_fires_only_on_the_displacement_branch
        claim_type: conditional_cascade
        grounds:
          - state_machines.HazardCase.ASSESSED_to_REMEDIATION_IN_PROGRESS
          - state_machines.HazardCase.ASSESSED_to_DISPLACEMENT_ACTIVE
          - calculations.hazard_assessment_severity
        excluded_because:
          difficulty_instance: hazard_case_assessment_fork_rejoins_at_clearance_pending
          rationale: "The conditional-cascade claim is precisely the fork the depth probe drives twice: branch A leaves unit, lease and ledger untouched while branch B runs the four-hop hold-suspend-abate cascade, and both rejoin at CLEARANCE_PENDING. Splitting one branch off into a breadth instance would test half of a claim that only means anything as a pair."


  # =========================================================================
  # CALCULATIONS - correct result, input-set filtering, constants and
  # precision across the eighteen §1.3 rules. The two dual-variant rules,
  # the tiered settlement fee, the half-open interval rule and the two
  # compensating invariants are depth-probe territory and appear as stubs.
  # =========================================================================
  - section: calculations
    instances:

      - name: rank_category_is_derived_at_both_seniority_floors
        claim_type: constants_applied
        grounds:
          - calculations.rank_category_derivation
          - entities.ServiceMember.fields.rank_category
          - endpoints.POST_/service-members
        distinguishing_aspect: "The two seniority floors are applied exactly as declared: E6 is JUNIOR_ENLISTED and E7 SENIOR_ENLISTED across the ENLISTED_SENIOR_FLOOR of 7, O3 is JUNIOR_OFFICER and O4 SENIOR_OFFICER across the OFFICER_SENIOR_FLOOR of 4, and any W grade is WARRANT_OFFICER without consulting a floor at all."
        test_recipe:
          setup:
            - "One installation with the declared defaults."
            - "The logical clock stands at 2026-08-01T00:00:00Z and no sponsor exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
          trigger:
            - call: "POST /service-members"
              payload: { dodid: "2000000006", last_name: "Ibarra", first_name: "Luz", branch: "ARMY", pay_grade: "E6" }
              as: PlatformAdmin
              captures: { g_e6: "$.data.rank_category" }
            - call: "POST /service-members"
              payload: { dodid: "2000000007", last_name: "Nakamura", first_name: "Ken", branch: "ARMY", pay_grade: "E7" }
              as: PlatformAdmin
              captures: { g_e7: "$.data.rank_category" }
            - call: "POST /service-members"
              payload: { dodid: "2000000002", last_name: "Boone", first_name: "Rae", branch: "ARMY", pay_grade: "W2" }
              as: InstallationHousingOffice
              captures: { g_w2: "$.data.rank_category" }
            - call: "POST /service-members"
              payload: { dodid: "2000000003", last_name: "Duarte", first_name: "Iva", branch: "NAVY", pay_grade: "O3" }
              as: PlatformAdmin
              captures: { g_o3: "$.data.rank_category" }
            - call: "POST /service-members"
              payload: { dodid: "2000000004", last_name: "Ellison", first_name: "Cy", branch: "NAVY", pay_grade: "O4" }
              as: PlatformAdmin
              captures: { g_o4: "$.data.rank_category", g_o4_id: "$.data.id", g_o4_dep: "$.data.dependent_count" }
            - call: "GET /service-members/${g_o4_id}"
              payload: {}
              as: PropertyManager
              captures: { g_o4_reread: "$.data.rank_category" }
          assert:
            - "${g_e6} == JUNIOR_ENLISTED - E6 sits below the floor of 7"
            - "${g_e7} == SENIOR_ENLISTED - E7 is the first senior enlisted grade"
            - "${g_w2} == WARRANT_OFFICER"
            - "${g_o3} == JUNIOR_OFFICER and ${g_o4} == SENIOR_OFFICER"
            - "${g_o4_reread} == SENIOR_OFFICER - the category is stored, not recomputed per read"
            - "${g_o4_dep} == 0 and each created sponsor has deployment_status, pcs_orders_ref and deployment_orders_ref at their declared defaults"

      - name: bedroom_eligibility_counts_only_full_time_custody_dependents
        claim_type: input_set_filtering
        grounds:
          - calculations.bedroom_eligibility_determination
          - entities.Dependent.fields.is_full_time_custody
          - entities.WaitlistApplication.fields.bedroom_eligibility
          - entities.ServiceMember.fields.dependent_count
        distinguishing_aspect: "The rule reads only full-time-custody dependents: sponsor A (spouse, a boy of 12 and a boy of 8) scores 1 + 1 private + 1 shared = 3 bedrooms, while sponsor B with the same two boys under ten plus a part-time-custody daughter scores 2 - the excluded daughter neither adds a shared bedroom nor raises dependent_count."
        test_recipe:
          setup:
            - "One installation with the declared defaults."
            - "Sponsor A (E5) has a spouse born 1992-03-04, a son born 2014-05-01 and a son born 2018-04-10, all full-time custody."
            - "Sponsor B (E5) has a spouse born 1990-06-06, sons born 2018-04-10 and 2022-03-15 with full-time custody, plus a daughter born 2019-11-02 whose is_full_time_custody is false."
            - "Both apply with pcs_orders_date 2026-08-25, so both effective_control_dates are 2026-08-25 and every age is measured against that date."
            - "The logical clock stands at 2026-08-25T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2014-05-01", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /service-members"
              payload: { dodid: "1000000002", last_name: "Okafor", first_name: "Dele", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm2_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "SPOUSE", date_of_birth: "1990-06-06", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "CHILD", date_of_birth: "2019-11-02", gender: "FEMALE", is_full_time_custody: false }
              as: PlatformAdmin
          trigger:
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-15" }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { b_a_elig: "$.data.bedroom_eligibility", b_a_snap: "$.data.dependent_count_at_application", b_a_ecd: "$.data.effective_control_date", b_a_rank: "$.data.rank_category" }
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm2_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-15" }
              as: ServiceMember
              as_user_id: "${sm2_id}"
              captures: { b_b_elig: "$.data.bedroom_eligibility", b_b_snap: "$.data.dependent_count_at_application" }
            - call: "GET /service-members/${sm2_id}"
              payload: {}
              as: PropertyManager
              captures: { b_b_depcount: "$.data.dependent_count" }
            - call: "GET /service-members/${sm2_id}/dependents"
              payload: {}
              as: PropertyManager
          assert:
            - "${b_a_elig} == 3 - base 1, one private bedroom for the 12-year-old and one shared bedroom for the single 8-year-old boy"
            - "${b_a_snap} == 3 and ${b_a_ecd} == 2026-08-25 and ${b_a_rank} == JUNIOR_ENLISTED"
            - "${b_b_elig} == 2 - base 1 plus one shared bedroom for the two under-ten boys; the part-time-custody daughter is excluded entirely"
            - "${b_b_snap} == 3 and ${b_b_depcount} == 3 - dependent_count counts only the three full-time-custody rows"
            - "the dependents listing for sponsor B reports total_count == 4, proving the fourth row exists and was filtered by the rule rather than missing from the data"

      - name: offer_run_walks_units_smallest_first_and_offers_each_to_its_own_winner
        claim_type: waterfall_allocation
        grounds:
          - calculations.waitlist_offer_selection
          - endpoints.POST_/installations/{id}/waitlist-offer-run
          - entities.Installation.fields.offer_run_epoch
          - entities.Installation.fields.last_offer_run_at
        distinguishing_aspect: "One run fills the whole waterfall: the 2-bedroom unit is processed before the 3-bedroom unit even though it was created second (bedroom_count ASC outranks created_at), each unit goes to the earliest effective_control_date in its own exactly-matching pool, the unmatched 2-bedroom applicant is left PENDING because one application may take at most one offer per run, and the second run over an empty AVAILABLE set still succeeds and still bumps offer_run_epoch."
