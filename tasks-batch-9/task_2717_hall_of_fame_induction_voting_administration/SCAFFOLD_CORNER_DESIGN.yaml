      - name: austerity_tier_boundary_at_exactly_half_the_budget
        claim_type: tiered_pricing
        grounds:
          - calculations.travel_grant_award_cents
          - entities.InductionCycle.fields.austerity_tier
          - entities.InductionCycle.fields.travel_committed_cents
        distinguishing_aspect: |
          The tier boundary is compared with >= on the PRE-COMMITMENT ratio. Budget 299998 with the
          first grant committed at 149999 puts the ratio at exactly 0.50, so the second grant prices
          at REDUCED (tier_factor 0.80): per_diem = round_half_up(18333 * 3 * 0.80) = 43999 plus the
          capped 95000 airfare = 138999, against the first grant's FULL-tier 149999 for identical
