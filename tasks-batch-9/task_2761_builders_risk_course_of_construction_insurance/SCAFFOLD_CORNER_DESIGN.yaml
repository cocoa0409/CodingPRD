            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-03-20T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 200000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
          trigger:
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "00000000-0000-4000-8000-0000000000ff", part_type: "MATERIALS_ON_SITE", sublimit_cents: -5 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e1: $.data.error_id }
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "00000000-0000-4000-8000-0000000000fe", party_name: "Ghost Owner", party_role: "OWNER", insurable_interest_pct: 100 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e2: $.data.error_id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: -5 }
