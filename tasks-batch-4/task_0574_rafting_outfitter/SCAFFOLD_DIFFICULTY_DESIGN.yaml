  - rule_id: resource_temporal_overlap
    instances:
      - name: guide_double_booked_on_overlapping_trip_intervals
        grounds:
          - validations[priority=7]
          - errors[ERR_GUIDE_DOUBLE_BOOKED]
          - entities.RiverTrip.fields.trip_date
          - entities.RiverTrip.fields.end_time
        distinguishing_aspect: |
          Half-open interval overlap on the Guide resource: guide assigned to trip A [09:00,15:00) cannot be
          assigned to trip B [12:00,18:00) which strictly overlaps -> ERR_GUIDE_DOUBLE_BOOKED. Interval
          semantics: pure geometric overlap (adjacency at exactly end==start would be allowed).
        test_recipe:
          setup:
            - "Guide assigned to trip A whose window is 2026-07-01T09:00Z..15:00Z; trip B exists with overlapping window 2026-07-01T12:00Z..18:00Z."
          setup_api_calls:
