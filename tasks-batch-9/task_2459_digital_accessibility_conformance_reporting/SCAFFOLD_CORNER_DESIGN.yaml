      - name: corner_report_approval_by_submitter_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ConformanceReport.IN_REVIEW_to_APPROVED
          - validations[priority=52]
        distinguishing_aspect: "The approve transition's segregation-of-duties precondition rejects an approval whose X-User-ID equals submitted_by_user_id with ERR_SEGREGATION_OF_DUTIES 403, leaving the report IN_REVIEW."
