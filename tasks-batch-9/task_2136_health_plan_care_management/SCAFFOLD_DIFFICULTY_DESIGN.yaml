scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: stratification_variant_divergence_on_member_utilization
        grounds:
          - calculations.risk_stratification_score
          - entities.RiskStratification.fields.tier
          - entities.Member.fields.latest_concurrent_tier
          - entities.Member.fields.latest_prospective_tier
        distinguishing_aspect: |
          This dual-variant pair operates on the Member/RiskStratification domain: identical
          TransitionEvent rows yield score 48 / tier MODERATE under CONCURRENT and score 76 /
          tier RISING under PROSPECTIVE, because PROSPECTIVE admits the OPEN claim and the
          booked future admission that CONCURRENT discards.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z startup default (never set)."
            - "One Member in CA with chronic_condition_count 4 and no enrollments, so social_need_points is 0."
            - "Four TransitionEvents on that member: a CLOSED inpatient admission 47 days back, a CLOSED ED visit 153 days back, an OPEN ED visit 12 days back, and a SCHEDULED_ADMISSION 40 days ahead."
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-1001", full_name: "Ana Vega", birth_date: "1958-04-11", state_code: "CA", chronic_condition_count: 4, social_data_consent_status: "GRANTED" }
              as: ProgramAdmin
              captures: { m1: $.data.id }
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m1}", event_type: "INPATIENT_ADMISSION", occurred_at: "2026-06-15T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m1}", event_type: "ED_VISIT", occurred_at: "2026-03-01T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m1}", event_type: "ED_VISIT", occurred_at: "2026-07-20T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m1}", event_type: "SCHEDULED_ADMISSION", occurred_at: "2026-09-10T00:00:00Z", facility_name: "Bay Ortho", episode_cost_cents: 0, adjudication_status: "OPEN" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/members/${m1}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { conc_score: $.data.score, conc_tier: $.data.tier, conc_util: $.data.utilization_points }
            - call: "POST /care-management/members/${m1}/stratifications"
              payload: { variant: "PROSPECTIVE" }
              as: UtilizationAnalyst
              captures: { pros_score: $.data.score, pros_tier: $.data.tier, pros_util: $.data.utilization_points }
          assert:
            - "${conc_score} == 48"
            - "${conc_tier} == MODERATE"
            - "${conc_util} == 24.0"
            - "${pros_score} == 76"
            - "${pros_tier} == RISING"
            - "${pros_util} == 52.0"
            - "RiskStratification(CONCURRENT).included_event_count == 2 and RiskStratification(PROSPECTIVE).included_event_count == 4"
            - "RiskStratification(CONCURRENT).chronic_points == 24 and RiskStratification(PROSPECTIVE).chronic_points == 24"
            - "Member.${m1}.latest_concurrent_score == 48 and Member.${m1}.latest_concurrent_tier == MODERATE"
            - "Member.${m1}.latest_prospective_score == 76 and Member.${m1}.latest_prospective_tier == RISING"

      - name: roi_method_divergence_on_enrollment_savings
        grounds:
          - calculations.roi_savings_measurement
          - entities.RoiMeasurement.fields.gross_savings_cents
          - entities.RoiMeasurement.fields.roi_ratio
          - entities.Program.fields.cohort_benchmark_pmpm_cents
        distinguishing_aspect: |
          The second dual-variant pair sits on a different entity domain - Enrollment/RoiMeasurement
          financial outcome, not member risk: for the identical enrollment PRE_POST reports
          gross_savings_cents 305303 and roi_ratio 32.73 while MATCHED_COHORT reports 284000 and
          30.38, because PRE_POST trends the member's own 12-month baseline PMPM and MATCHED_COHORT
          scales the program benchmark by the enrollment's tier factor.
        test_recipe:
          setup:
            - "Clock set to 2026-05-01T00:00:00Z, then advanced to 2026-08-01T00:00:00Z after the plan work is done."
            - "Program with hourly_cost_cents 9050, cohort_benchmark_pmpm_cents 120000, stratification_variant CONCURRENT, min_risk_tier MODERATE."
            - "Member with chronic_condition_count 10 stratifies CONCURRENT to 64 / RISING, so risk_tier_at_enrollment is RISING and the cohort risk factor is 1.4."
            - "Baseline closed episodes total 2,040,006 cents inside [2025-05-01, 2026-05-01); one OPEN 180,000 episode is ignored."
            - "One closed 220,000-cent ED visit falls in the 2026-06 intervention month; May and July have none."
            - "Three COMPLETED interventions of 20 staff minutes each, so program_cost_cents is 3 * 3017 = 9051."
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /care-management/programs"
              payload: { name: "Complex Care ROI", min_risk_tier: "MODERATE", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9050, cohort_benchmark_pmpm_cents: 120000, care_plan_review_interval_days: 90, toc_outreach_hours: 48, referral_loop_days: 30 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Dana Ruiz", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_rev: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-2001", full_name: "Luis Ortega", birth_date: "1952-02-09", state_code: "CA", chronic_condition_count: 10, social_data_consent_status: "GRANTED" }
              as: ProgramAdmin
              captures: { m4: $.data.id }
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m4}", event_type: "INPATIENT_ADMISSION", occurred_at: "2025-09-15T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 1800000, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m4}", event_type: "ED_VISIT", occurred_at: "2026-01-20T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 240006, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m4}", event_type: "ED_VISIT", occurred_at: "2026-03-05T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 180000, adjudication_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m4}", event_type: "ED_VISIT", occurred_at: "2026-06-10T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 220000, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/members/${m4}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m4}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /care-management/care-plans"
              payload: { enrollment_id: "${enr}", title: "Complex care plan" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { plan: $.data.id }
            - call: "POST /care-management/care-plans/${plan}/goals"
              payload: { domain: "CLINICAL", description: "Stabilize heart failure", target_date: "2026-11-01" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { goal: $.data.id }
            - call: "POST /care-management/care-plans/${plan}/submit"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/care-plans/${plan}/review"
              payload: { decision: "APPROVE" }
              as: ClinicalReviewer
              as_user_id: "${cm_rev}"
            - call: "POST /care-management/goals/${goal}/interventions"
              payload: { modality: "PHONE", staff_minutes: 20 }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { iv1: $.data.id }
            - call: "POST /care-management/goals/${goal}/interventions"
              payload: { modality: "EDUCATION", staff_minutes: 20 }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { iv2: $.data.id }
            - call: "POST /care-management/goals/${goal}/interventions"
              payload: { modality: "MEDICATION_REVIEW", staff_minutes: 20 }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { iv3: $.data.id }
            - call: "POST /care-management/interventions/${iv1}/complete"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/interventions/${iv2}/complete"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/interventions/${iv3}/complete"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /care-management/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { enr_v1: $.data.version }
          trigger:
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "PRE_POST", expected_enrollment_version: "${enr_v1}" }
              as: UtilizationAnalyst
              captures: { pp_gross: $.data.gross_savings_cents, pp_net: $.data.net_savings_cents, pp_roi: $.data.roi_ratio }
            - call: "GET /care-management/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { enr_v2: $.data.version }
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "MATCHED_COHORT", expected_enrollment_version: "${enr_v2}" }
              as: UtilizationAnalyst
              captures: { mc_gross: $.data.gross_savings_cents, mc_net: $.data.net_savings_cents, mc_roi: $.data.roi_ratio }
          assert:
            - "RoiMeasurement(PRE_POST).baseline_pmpm_cents == 170001"
            - "RoiMeasurement(PRE_POST).monthly_projected_cost_cents == 175101"
            - "RoiMeasurement(PRE_POST).intervention_month_count == 3"
            - "RoiMeasurement(PRE_POST).projected_cost_cents == 525303"
            - "RoiMeasurement(PRE_POST).actual_cost_cents == 220000"
            - "${pp_gross} == 305303"
            - "${pp_net} == 296252"
            - "${pp_roi} == 32.73"
            - "RoiMeasurement(MATCHED_COHORT).baseline_pmpm_cents == 0"
            - "RoiMeasurement(MATCHED_COHORT).monthly_projected_cost_cents == 168000"
            - "RoiMeasurement(MATCHED_COHORT).projected_cost_cents == 504000"
            - "${mc_gross} == 284000"
            - "${mc_net} == 274949"
            - "${mc_roi} == 30.38"
            - "RoiMeasurement(PRE_POST).program_cost_cents == 9051 and RoiMeasurement(MATCHED_COHORT).program_cost_cents == 9051"
            - "${pp_gross} != ${mc_gross}"

  - rule_id: combinatorial_formula
    instances:
      - name: roi_rounding_order_per_month_and_per_intervention
        grounds:
          - calculations.roi_savings_measurement
          - calculations.intervention_cost_cents
          - entities.Intervention.fields.cost_cents
          - entities.RoiMeasurement.fields.program_cost_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the cents. Three 20-minute interventions
          at 9050 cents/hour round to 3017 each for a program_cost_cents of 9051; summing the 60
          minutes first and rounding once yields 9050. The scaffold pins round-per-intervention-
          then-sum, and pins round-per-member-month-then-sum for the projection, so the expected
          figures are 9051 and 72000 respectively.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z for enrollment and plan work, then advanced to 2026-08-01T00:00:00Z."
            - "Program with hourly_cost_cents 9050, cohort_benchmark_pmpm_cents 120000, min_risk_tier LOW."
            - "Member with chronic_condition_count 0 and no utilization events stratifies CONCURRENT to score 0 / tier LOW, so COHORT_RISK_FACTOR_LOW 0.6 applies and every month's actual cost is 0."
            - "Three COMPLETED interventions of 20 staff minutes each on the enrollment's active plan."
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /care-management/programs"
              payload: { name: "Rounding Probe Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9050, cohort_benchmark_pmpm_cents: 120000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Dana Ruiz", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_rev: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3001", full_name: "Pia Roth", birth_date: "1971-07-02", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /care-management/care-plans"
              payload: { enrollment_id: "${enr}", title: "Rounding probe plan" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { plan: $.data.id }
            - call: "POST /care-management/care-plans/${plan}/goals"
              payload: { domain: "BEHAVIORAL", description: "Weekly coaching", target_date: "2026-10-01" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { goal: $.data.id }
            - call: "POST /care-management/care-plans/${plan}/submit"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/care-plans/${plan}/review"
              payload: { decision: "APPROVE" }
              as: ClinicalReviewer
              as_user_id: "${cm_rev}"
            - call: "POST /care-management/goals/${goal}/interventions"
              payload: { modality: "PHONE", staff_minutes: 20 }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { iv1: $.data.id, iv1_cost: $.data.cost_cents }
            - call: "POST /care-management/goals/${goal}/interventions"
              payload: { modality: "PHONE", staff_minutes: 20 }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { iv2: $.data.id }
            - call: "POST /care-management/goals/${goal}/interventions"
              payload: { modality: "PHONE", staff_minutes: 20 }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { iv3: $.data.id }
            - call: "POST /care-management/interventions/${iv1}/complete"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/interventions/${iv2}/complete"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/interventions/${iv3}/complete"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /care-management/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { enr_v: $.data.version }
          trigger:
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "MATCHED_COHORT", expected_enrollment_version: "${enr_v}" }
              as: UtilizationAnalyst
              captures: { pc: $.data.program_cost_cents, gross: $.data.gross_savings_cents, roi: $.data.roi_ratio }
          assert:
            - "${iv1_cost} == 3017"
            - "${pc} == 9051"
            - "${pc} != 9050"
            - "RoiMeasurement.monthly_projected_cost_cents == 72000"
            - "RoiMeasurement.intervention_month_count == 3"
            - "RoiMeasurement.projected_cost_cents == 216000"
            - "RoiMeasurement.actual_cost_cents == 0"
            - "${gross} == 216000"
            - "RoiMeasurement.net_savings_cents == 206949"
            - "${roi} == 22.86"

      - name: engagement_denominator_reads_cadence_snapshot_not_current_tier
        grounds:
          - calculations.engagement_score_evaluation
          - calculations.touch_cadence_tier_assignment
          - entities.Enrollment.fields.cadence_tier_snapshot
          - state_machines.Enrollment.engagement_status.AT_RISK_to_DISENGAGED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency with a pinned evaluation order. Cadence tier
          decides how many touches are expected and engagement decides the cadence tier; the
          scaffold pins engagement_score to cadence_tier_snapshot, so the third failed outreach
          yields engagement_score 67 (2 reached over a STANDARD denominator of 3) even though the
          same request escalates cadence_tier to INTENSIVE, whose denominator of 6 would give 33.
        test_recipe:
          setup:
            - "Clock starts at its 2026-08-01T00:00:00Z default."
            - "Member with chronic_condition_count 0 stratifies CONCURRENT to LOW; program min_risk_tier LOW."
            - "Enrollment ACTIVE with cadence_tier STANDARD and cadence_tier_snapshot STANDARD; care plan ACTIVE."
            - "Five touches on distinct days, completed in order REACHED, REACHED, NOT_REACHED, NOT_REACHED, NOT_REACHED."
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Engagement Probe", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
