      - name: funding_allocation_input_set_excludes_committed_and_rejected_rows
        claim_type: input_set_filtering
        grounds:
          - calculations.funding_allocation.input_set
          - calculations.funding_allocation.constants.MEASURE_WEIGHT
          - calculations.funding_allocation.constants.STATUS_FILTER_FINAL
        distinguishing_aspect: |
          A second FINAL run over the same period must allocate nothing: COMMITTED rows never re-enter
          the candidate set (so no double payment) and the REJECTED row is invisible to the FINAL
          filter. Only allocation_run_count and the version move.
        test_recipe:
          setup:
            - "One OPEN period, rate 10000 cents per weight, total 500000."
            - "Three RECORDED outcomes for the same student: EMPLOYMENT_Q2 (weight 1.25) certified, POSTSECONDARY_ENROLLMENT (1.40) certified, and a third EMPLOYMENT_Q2 rejected."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "PY26-FILTER", start_date: "2026-07-01", end_date: "2026-09-30", rate_cents_per_weight: 10000, total_cents: 500000 }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { fp: $.data.id, fp_v0: $.data.version }
            - call: "POST /students"
              payload: { full_name: "Vera Ilves", email: "vera.ilves@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              as_user_id: "coordinator-1"
              captures: { s: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "wage-v1" }
              as: ProgramCoordinator
              as_user_id: "coordinator-1"
              captures: { o1: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "POSTSECONDARY_ENROLLMENT", evidence_ref: "clearinghouse-v1" }
              as: ProgramCoordinator
              as_user_id: "coordinator-1"
              captures: { o2: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "wage-v2-unverifiable" }
              as: ProgramCoordinator
              as_user_id: "coordinator-1"
              captures: { o3: $.data.id }
            - call: "POST /outcome-records/${o1}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "POST /outcome-records/${o2}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "POST /outcome-records/${o3}/certification"
              payload: { decision: "REJECT" }
              as: StateAuthority
              as_user_id: "state-1"
          trigger:
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${fp_v0}" }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { fp_v1: $.data.version }
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${fp_v1}" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "GET /outcome-records?funding_period_id=${fp}&limit=10&offset=0"
              payload: {}
              as: StateAuthority
              as_user_id: "state-1"
          assert:
            - "the first run returns 200 with data.committed_cents == 26500 (12500 + 14000), data.available_cents == 473500, data.allocation_run_count == 1, data.last_allocation_variant == 'FINAL'"
            - "the second run returns 200 with data.committed_cents == 26500 and data.available_cents == 473500 (unchanged) but data.allocation_run_count == 2"
            - "GET /outcome-records?funding_period_id=${fp}&limit=10&offset=0 returns total_count == 3 with data[0].allocated_cents == 12500, data[1].allocated_cents == 14000, data[2].allocated_cents == 0"
            - "the rejected row reports data[2].status == 'REJECTED' and data[2].allocation_status == 'UNALLOCATED' (never DEFERRED, because the FINAL filter never considered it)"

