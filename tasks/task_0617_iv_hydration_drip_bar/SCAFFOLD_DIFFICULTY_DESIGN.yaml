  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: comp_supply_units_conserved_on_schedule_cancel
        grounds:
          - state_machines.Appointment.SCREEN_PENDING_to_SCHEDULED
          - state_machines.Appointment.SCREEN_PENDING_to_CANCELLED
          - calculations.lot_selection_fefo.variants.reserve
          - entities.SupplyLot.fields.units_reserved
          - entities.SupplyLot.fields.units_total
        distinguishing_aspect: >
          Conserved quantity = SupplyLot units: invariant units_total ==
          (free + units_reserved + units_consumed) must hold. Schedule reserves 1
          MYERS unit (reserved 0->1), cancel releases it (reserved 1->0), leaving
          units_reserved back at 0 and units_consumed 0 with no drift.
        test_recipe:
          setup:
            - "Clock 2026-06-22; MYERS LOUNGE; MYERS lot of 3 units; appointment CLEARED+consented and SCHEDULED (1 unit reserved)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false, g6pd_sensitive: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 2 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "MY-3", units_total: 3, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${ap_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v: $.data.version }
            - call: "POST /appointments/${ap_id}/schedule"
              payload: { expected_appointment_version: "${ap_v}" }
              as: ClinicAdmin
            - call: "GET /supply-lots/${lot_id}"
              payload: {}
              as: ClinicAdmin
              captures: { reserved_after_schedule: $.data.units_reserved }
          trigger:
            - call: "POST /appointments/${ap_id}/cancel"
              payload: {}
              as: ClinicAdmin
              captures: { st: $.data.status }
          assert:
            - "SupplyLot.${lot_id}.units_reserved == 0"
            - "SupplyLot.${lot_id}.units_consumed == 0"
            - "SupplyLot.${lot_id}.units_total == 3"
            - "Appointment.${ap_id}.status == CANCELLED"

      - name: comp_membership_credits_conserved_on_schedule_cancel
        grounds:
          - state_machines.Appointment.SCREEN_PENDING_to_SCHEDULED
          - state_machines.Appointment.SCREEN_PENDING_to_CANCELLED
          - calculations.visit_charge_waterfall.variants.member_credit_visit
          - entities.Membership.fields.drip_credits_remaining
          - entities.Membership.fields.addon_credits_remaining
        distinguishing_aspect: >
          Conserved quantity = Membership credits (distinct from supply units):
          invariant drip_credits_remaining + drip credits held by non-terminal
          redemptions == drip_credits_total. Schedule decrements drip_credits_remaining
          1->0 and addon_credits_remaining 1->0; cancel restores both to 1, no drift.
        test_recipe:
          setup:
            - "Clock 2026-06-22; MYERS LOUNGE; PLATINUM membership covered_drip_tier=MYERS, 1 drip + 1 addon credit; one add-on glutathione; supply for both lines."
