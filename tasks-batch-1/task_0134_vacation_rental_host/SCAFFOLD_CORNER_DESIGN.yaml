              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /listings/${lcm1}"
              payload: {}
              as: Guest
              as_user_id: "${gcm1}"
              captures: { lcm1_cv_1440: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${lcm1}", guest_id: "${gcm1}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${lcm1_cv_1440}" }
              as: Guest
              as_user_id: "${gcm1}"
              captures: { bcm1: $.data.id }
            - call: "POST /bookings/${bcm1}/screen"
              payload: {}
              as: Host
              as_user_id: "${hcm1}"
            - call: "POST /bookings/${bcm1}/approve"
              payload: {}
              as: Host
              as_user_id: "${hcm1}"
          trigger:
            - call: "POST /bookings/${bcm1}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${gcm1}"
            - call: "GET /bookings/${bcm1}/payouts"
              payload: {}
              as: Host
              as_user_id: "${hcm1}"
              captures: { pcm1_est: $.data.0.estimated_cents }
          assert:
            - "GET /bookings/${bcm1}/security-deposits returns one deposit with status AUTHORIZED and authorized_cents 10000"
            - "GET /bookings/${bcm1}/payouts returns one payout with status SCHEDULED and estimated_cents == 55250 (gross 65000 - commission 9750)"
