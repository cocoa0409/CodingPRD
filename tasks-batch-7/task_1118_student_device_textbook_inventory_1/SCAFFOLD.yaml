  - method: GET
    path: "/api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports"
    description: "List DamageReports on an assignment"
    roles: [DistrictAdmin, Registrar, SiteTechnician, Family]
    code: 200
    input: ["status?"]
    output: "DamageReport[]"
    side_effects: []

  - method: GET
    path: "/api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports/{reportId}"
