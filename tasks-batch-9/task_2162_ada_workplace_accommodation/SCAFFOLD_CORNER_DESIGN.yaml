      - name: corner_profile_lifecycle_gates_authoring_intake_and_uniqueness
        claim_type: cascading_validation
        grounds:
          - errors[ERR_PROFILE_NOT_PUBLISHED]
          - errors[ERR_PROFILE_NOT_DRAFT]
          - errors[ERR_DUPLICATE_RESOURCE_KEY]
          - validations[priority=60]
          - validations[priority=67]
          - state_machines.AccommodationRequest.INTAKE_to_FUNCTION_ANALYSIS
        distinguishing_aspect: "One chain proves three lifecycle gates in order: intake against a DRAFT profile fails 422 ERR_PROFILE_NOT_PUBLISHED, authoring a function on a PUBLISHED profile fails 409 ERR_PROFILE_NOT_DRAFT, and re-using an existing job_code fails 409 ERR_DUPLICATE_RESOURCE_KEY."
        test_recipe:
          setup:
            - "A DRAFT JobProfile 'C-JP-28' with one essential function, plus employee C-E-28 attached to it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-28", title: "Corner Profile 28", department_code: "CNS", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c28_jp: $.data.id }
            - call: "POST /job-profiles/${c28_jp}/essential-functions"
              payload: { function_code: "C-EF-28", description: "Corner duty", criticality_weight: 5, frequency_per_week: 20, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-28", full_name: "Corner Twentyeight", department_code: "CNS", job_title: "Operator", hire_date: "2024-03-28", job_profile_id: "${c28_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c28_emp: $.data.id }
          trigger:
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${c28_emp}", request_channel: "WRITTEN", requested_accommodation_text: "Intake against a draft profile", disability_obvious: true }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c28_err1: $.data.error_id }
            - call: "POST /job-profiles/${c28_jp}/publish"
              payload: { profile_version_label: "2026.9" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /job-profiles/${c28_jp}/essential-functions"
              payload: { function_code: "C-EF-28B", description: "Late duty", criticality_weight: 3, frequency_per_week: 5, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c28_err2: $.data.error_id }
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-28", title: "Duplicate Corner Profile", department_code: "CNS", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c28_err3: $.data.error_id }
          assert:
            - "The intake attempt returns HTTP 422 with data.error_id == ERR_PROFILE_NOT_PUBLISHED and Employee.${c28_emp}.open_case_count stays 0"
            - "The publish returns HTTP 200 with JobProfile.${c28_jp}.status == PUBLISHED and profile_version_label == 2026.9"
            - "The late essential-function attempt returns HTTP 409 with data.error_id == ERR_PROFILE_NOT_DRAFT and JobProfile.${c28_jp}.essential_function_count stays 1"
            - "The duplicate job_code attempt returns HTTP 409 with data.error_id == ERR_DUPLICATE_RESOURCE_KEY"

