          - errors.ERR_ROOM_NOT_FOUND
          - errors.ERR_SEAT_NOT_FOUND
          - errors.ERR_WRITER_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
        distinguishing_aspect: |
          Each resource family owns its own 404 code and the check runs left to right along the path, so an
          unknown id must never collapse into a generic 404 or into a downstream 409/422 - even on
          endpoints whose body would also be invalid.
        test_recipe:
          setup:
            - "The canonical fixture through seat S1 exists, so every code below is provably about the unknown id and not about an empty database."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
            - *C_S1
          trigger:
            - call: "GET /guild-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GuildAdministrator
            - call: "GET /seasons/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioExecutive
            - call: "GET /writers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GuildAdministrator
            - call: "GET /rooms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioExecutive
            - call: "GET /room-seats/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioExecutive
            - call: "GET /availability-windows/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GuildAdministrator
            - call: "POST /seasons/00000000-0000-4000-8000-000000000000/rooms"
              payload: { name: "Ghost Room", format: "IN_PERSON", seat_capacity: 2, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "00000000-0000-4000-8000-000000000000", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
          assert:
            - "Trigger calls 1-6 return 404 with error_id ERR_AGREEMENT_NOT_FOUND, ERR_SEASON_NOT_FOUND, ERR_WRITER_NOT_FOUND, ERR_ROOM_NOT_FOUND, ERR_SEAT_NOT_FOUND and ERR_WINDOW_NOT_FOUND respectively"
            - "Trigger call 7 returns 404 ERR_SEASON_NOT_FOUND and creates no room"
            - "Trigger call 8 returns 404 ERR_WRITER_NOT_FOUND, NOT 412 ERR_STALE_ROOM_VERSION: existence at priority 6 precedes the OCC check at priority 20, even though ${rv1} went stale when seat ${s1} bumped the room to version 3"
            - "Every error body carries response_type == \"error\" with data.error_id and data.message, and no row is created"

      - name: missing_required_fields_are_rejected_before_anything_is_created
        claim_type: required_fields
        grounds:
          - validations.priority_10_business_constraint
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/seasons
          - endpoints.POST_/writers
          - endpoints.POST_/rooms/{room_id}/seats
        distinguishing_aspect: |
          Every input field that carries no default is mandatory, including the OCC field
          expected_room_version - omitting it is a 400 ERR_INVALID_REQUEST at priority 10, not a 412. The
          schema gate must fire before existence-independent business checks and must leave no partial row.
        test_recipe:
          setup:
