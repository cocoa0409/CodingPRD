# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2429 — Colocation Provisioning & Cross-Connect Management
#
# 9 rule_ids from §0.5 × >= 2 differentiated instances = 19 instances.
# Every numeric literal in `assert:` was computed from the §1.3 formulas and
# their `constants:` before being written here.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: power_billing_metered_final_versus_deemed_capacity
        grounds:
          - calculations.contract_power_billing
          - calculations.contract_power_billing.variants.metered_final
          - calculations.contract_power_billing.variants.deemed_capacity
          - entities.Contract.fields.billing_mode
          - entities.Contract.fields.billed_total_usd
          - entities.PowerCircuit.fields.meter_intervals
        distinguishing_aspect: |
          Two contracts holding byte-identical energized capacity (19.200 kW allocated) and
          byte-identical meter intervals (8000 kWh + 8300 kWh) settle to different money:
          METERED_PLUS_COMMIT bills 3776.00 USD because it consumes the recorded intervals,
          COMMITTED_ONLY bills 3500.00 USD because it discards them and synthesises
          19.200 * 730 * 0.65 = 9110.400 kWh, which is below the 14600.000 included kWh.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One customer owning two contracts, each power_commit_kw 20.0 and committed_cabinet_count 1; contract A billing_mode METERED_PLUS_COMMIT, contract B billing_mode COMMITTED_ONLY."
            - "One floor row H1/R1: design_density 25.0 kW/cabinet, max_row_power 200.0 kW, cooling_capacity 60.0 kW."
            - "Two cabinets rated 20.0 kW, one per contract, both INSTALLED; row occupied_slot_count 2, density_ceiling_kw 50.000."
            - "One 100A/240V/SINGLE PRIMARY circuit per cabinet, both ENERGIZED with derated_kw 19.200 and allocated_kw 19.200."
            - "Each circuit carries the same two meter intervals inside July 2026: 8000 kWh and 8300 kWh."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Northwind Cloud", account_code: "NWC" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H1", row_code: "R1", cabinet_slot_count: 10, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-METERED", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 6, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_a_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-COMMITTED", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 6, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_b_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_a_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_b_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab_a_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab_b_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_a_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_a_id}" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_b_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_b_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_a_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_b_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_a_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_b_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_a_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 100, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_a_id: $.data.id }
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_b_id}", circuit_code: "B-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 100, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_b_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir_a_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits/${cir_b_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv1: $.data.version }
            - call: "POST /colocation/power-circuits/${cir_a_id}/energize"
              payload: { expected_row_version: "${rv1}" }
              as: ProvisioningEngineer
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv2: $.data.version }
            - call: "POST /colocation/power-circuits/${cir_b_id}/energize"
              payload: { expected_row_version: "${rv2}" }
              as: ProvisioningEngineer
            - call: "POST /colocation/power-circuits/${cir_a_id}/readings"
              payload: { interval_start: "2026-07-05T00:00:00Z", interval_end: "2026-07-06T00:00:00Z", kwh: 8000, peak_kw: 12.5 }
              as: BillingOperator
            - call: "POST /colocation/power-circuits/${cir_a_id}/readings"
              payload: { interval_start: "2026-07-20T00:00:00Z", interval_end: "2026-07-21T00:00:00Z", kwh: 8300, peak_kw: 11.0 }
              as: BillingOperator
            - call: "POST /colocation/power-circuits/${cir_b_id}/readings"
              payload: { interval_start: "2026-07-05T00:00:00Z", interval_end: "2026-07-06T00:00:00Z", kwh: 8000, peak_kw: 12.5 }
              as: BillingOperator
            - call: "POST /colocation/power-circuits/${cir_b_id}/readings"
              payload: { interval_start: "2026-07-20T00:00:00Z", interval_end: "2026-07-21T00:00:00Z", kwh: 8300, peak_kw: 11.0 }
              as: BillingOperator
          trigger:
            - call: "POST /colocation/contracts/${ctr_a_id}/billing-close"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: BillingOperator
            - call: "POST /colocation/contracts/${ctr_b_id}/billing-close"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: BillingOperator
          assert:
            - "PowerCircuit.${cir_a_id}.derated_kw == 19.200 and PowerCircuit.${cir_a_id}.allocated_kw == 19.200"
            - "GET /colocation/invoice-lines?contract_id=${ctr_a_id} returns exactly 2 lines: POWER_COMMIT amount_usd == 3500.00 quantity == 20.0, and POWER_OVERAGE amount_usd == 276.00 quantity == 1700.000"
            - "GET /colocation/invoice-lines?contract_id=${ctr_b_id} returns exactly 1 line: POWER_COMMIT amount_usd == 3500.00 quantity == 20.0, and NO line of line_type POWER_OVERAGE"
            - "Contract.${ctr_a_id}.billed_total_usd == 3776.00"
            - "Contract.${ctr_b_id}.billed_total_usd == 3500.00"
            - "Contract.${ctr_a_id}.billed_total_usd - Contract.${ctr_b_id}.billed_total_usd == 276.00"
            - "Contract.${ctr_a_id}.last_closed_period_end == 2026-08-01T00:00:00Z"

      - name: row_stranded_capacity_nameplate_versus_measured
        grounds:
          - calculations.row_capacity_and_posture
          - calculations.row_capacity_and_posture.variants.nameplate_view
          - calculations.row_capacity_and_posture.variants.measured_view
          - entities.FloorRow.fields.stranded_nameplate_kw
          - entities.FloorRow.fields.stranded_measured_kw
          - entities.FloorRow.fields.effective_ceiling_kw
        distinguishing_aspect: |
          The divergence lands on FloorRow capacity in kW, not on Contract money: with
          effective_ceiling_kw 20.000, allocated_power_kw 19.200 and measured_peak_kw 12.500 the
          same row reports both stranded_nameplate_kw 0.800 and stranded_measured_kw
          7.500 — a 6.700 kW gap produced by which quantity the variant consumes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row H2/R1 with design_density_kw_per_cabinet 20.0, max_row_power_kw 200.0, cooling_capacity_kw 60.0."
            - "One contract power_commit_kw 20.0, ACTIVE; one cabinet rated 20.0 kW, INSTALLED; row occupied_slot_count 1 so density_ceiling_kw is 20.000 and effective_ceiling_kw is 20.000."
            - "One 100A/240V/SINGLE PRIMARY circuit ENERGIZED, allocated_kw 19.200."
            - "One meter interval inside the trailing 30-day window with peak_kw 12.5."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Baywatch Media", account_code: "BWM" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H2", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 20.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9002", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 100, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv1: $.data.version }
            - call: "POST /colocation/power-circuits/${cir_id}/energize"
              payload: { expected_row_version: "${rv1}" }
              as: ProvisioningEngineer
          trigger:
            - call: "POST /colocation/power-circuits/${cir_id}/readings"
              payload: { interval_start: "2026-07-20T00:00:00Z", interval_end: "2026-07-21T00:00:00Z", kwh: 8000, peak_kw: 12.5 }
              as: BillingOperator
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { row_ceiling: $.data.effective_ceiling_kw }
          assert:
            - "FloorRow.${row_id}.effective_ceiling_kw == 20.000"
            - "FloorRow.${row_id}.allocated_power_kw == 19.200"
            - "FloorRow.${row_id}.measured_peak_kw == 12.500"
            - "FloorRow.${row_id}.stranded_nameplate_kw == 0.800"
            - "FloorRow.${row_id}.stranded_measured_kw == 7.500"
            - "FloorRow.${row_id}.stranded_measured_kw - FloorRow.${row_id}.stranded_nameplate_kw == 6.700"
            - "FloorRow.${row_id}.row_status == OPEN"

  - rule_id: combinatorial_formula
    instances:
      - name: circuit_allocation_clamped_while_cooling_load_is_not
        grounds:
          - calculations.circuit_allocated_kw
          - entities.PowerCircuit.fields.derated_kw
          - entities.PowerCircuit.fields.allocated_kw
          - entities.PowerCircuit.fields.cooling_contribution_kw
          - entities.Cabinet.fields.rated_power_kw
          - state_machines.PowerCircuit.APPROVED_to_ENERGIZED
        distinguishing_aspect: |
          One formula produces three different numbers from the same 17.280 kW breakerplate
          depending on two independent selectors: the cabinet nameplate clamp applies to
          allocated_kw (min(17.280, 15.0) = 15.000) but never to cooling_contribution_kw
          (17.280), and the redundancy_role selector zeroes allocated_kw (0.000) while still
          charging 25 percent of heat (4.320) — so a single cabinet reports
          allocated_power_kw 15.000 against cooling_load_kw 21.600.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row H3/R1: design_density_kw_per_cabinet 20.0, max_row_power_kw 200.0, cooling_capacity_kw 60.0."
            - "Contract power_commit_kw 20.0, redundancy_requirement N, ACTIVE."
            - "One cabinet rated 15.0 kW, INSTALLED, so its nameplate is BELOW a single 90A/240V feed's derated 17.280 kW."
            - "Two APPROVED 90A/240V/SINGLE circuits on that cabinet: feed_side A redundancy_role PRIMARY, feed_side B redundancy_role REDUNDANT."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Cobalt Trading", account_code: "CBT" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H3", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 20.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9003", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 15.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 90, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_p_id: $.data.id }
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "B-1", feed_side: "B", redundancy_role: "REDUNDANT", breaker_amps: 90, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_r_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir_p_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits/${cir_r_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv1: $.data.version }
            - call: "POST /colocation/power-circuits/${cir_p_id}/energize"
              payload: { expected_row_version: "${rv1}" }
              as: ProvisioningEngineer
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv2: $.data.version }
            - call: "POST /colocation/power-circuits/${cir_r_id}/energize"
              payload: { expected_row_version: "${rv2}" }
              as: ProvisioningEngineer
          assert:
            - "PowerCircuit.${cir_p_id}.derated_kw == 17.280"
            - "PowerCircuit.${cir_p_id}.allocated_kw == 15.000"
            - "PowerCircuit.${cir_p_id}.cooling_contribution_kw == 17.280"
            - "PowerCircuit.${cir_r_id}.derated_kw == 17.280"
            - "PowerCircuit.${cir_r_id}.allocated_kw == 0.000"
            - "PowerCircuit.${cir_r_id}.cooling_contribution_kw == 4.320"
            - "Cabinet.${cab_id}.allocated_power_kw == 15.000"
            - "Cabinet.${cab_id}.cooling_load_kw == 21.600"
            - "Cabinet.${cab_id}.energized_primary_circuit_count == 1"
            - "Cabinet.${cab_id}.status == ACTIVE"
            - "FloorRow.${row_id}.allocated_power_kw == 15.000"
            - "FloorRow.${row_id}.cooling_load_kw == 21.600"
            - "Contract.${ctr_id}.provisioned_power_kw == 15.000"
            - "Contract.${ctr_id}.stranded_commit_kw == 5.000"
            - "Contract.${ctr_id}.commit_utilization_pct == 75.0"

      - name: cross_connect_close_pinned_six_step_order
        grounds:
          - calculations.cross_connect_period_billing
          - entities.Contract.fields.cross_connect_allowance
          - entities.Contract.fields.cross_connect_billed_usd
          - entities.CrossConnectOrder.fields.mrc_usd
          - entities.InvoiceLine.fields.line_type
          - state_machines.CrossConnectOrder.INSTALLED_to_ACTIVE
        distinguishing_aspect: |
          The volume tier is keyed on the POST-allowance subtotal, never on the pre-allowance
          sum: three ACTIVE SMF cross-connects total 900.00 USD, the allowance waives the
          first-created 300.00 leaving subtotal 600.00, which lands in the 5 percent tier for
          570.00 plus a 114.00 surcharge = 684.00 — whereas keying the tier on 900.00 would
          give the 10 percent tier and 648.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract COMMITTED_ONLY, power_commit_kw 20.0, cross_connect_allowance 1, cross_connect_cap 6, no energized circuits."
            - "Customer-side row H4/R1 holding cabinet C01 (INSTALLED, on the contract) and SMF panel PP-A ports 1..3; far-side row H4/R2 holding MEET_ME cabinet Z01 and SMF panel PP-Z ports 1..3."
            - "Three SMF cross-connect orders, created in order X1, X2, X3, each routed PP-A -> PP-Z and driven to ACTIVE, each carrying mrc_usd 300.00."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Kestrel Networks", account_code: "KST" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/contacts"
              payload: { customer_id: "${cust_id}", full_name: "Order Desk", authorization_scopes: ["REMOTE_HANDS", "SITE_ACCESS"], access_level: "UNESCORTED" }
              as: SecurityOfficer
              captures: { con_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H4", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_a_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H4", row_code: "R2", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_z_id: $.data.id }
            - call: "POST /colocation/contracts"
