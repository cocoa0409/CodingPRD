            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/workers", payload: { full_name: "Sup One", certification_level: "SUPERVISOR", cert_expires_at: "2027-01-01T00:00:00Z", medical_clearance_expires_at: "2027-01-01T00:00:00Z", respirator_fit_expires_at: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { w_sup: "$.data.id" } }
            - { call: "POST /abatement/containments", payload: { project_id: "${p_id}", work_area_volume_cuft: 240000, containment_class: "FULL" }, as: Supervisor, as_user_id: "${w_sup}", captures: { c_id: "$.data.id" } }
