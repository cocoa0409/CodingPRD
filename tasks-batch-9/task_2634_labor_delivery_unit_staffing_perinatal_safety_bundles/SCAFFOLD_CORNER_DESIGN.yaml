      - name: sod_3_and_sod_4_bar_every_care_participant_from_facilitating_reworking_or_closing_the_same_review
        claim_type: Segregation of duties
        grounds:
          - roles[ChargeNurse].segregation_of_duties[SOD-3 gatekeeper]
          - roles[BedsideNurse].segregation_of_duties[SOD-3/SOD-4 first step]
          - roles[PerinatalSafetyOfficer].segregation_of_duties[SOD-4 second step]
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - endpoints[POST /newborn-complication-reviews]
          - endpoints[POST /newborn-complication-reviews/{reviewId}/schedule-debrief]
          - endpoints[POST /newborn-complication-reviews/{reviewId}/request-rework]
          - endpoints[POST /newborn-complication-reviews/{reviewId}/close]
          - endpoints[POST /care-assignments/{assignmentId}/release]
          - state_machines.NewbornComplicationReview
        distinguishing_aspect: |
          The load-bearing word in §1.2 is "in ANY status": the care participant is barred from
          facilitating BEFORE and AFTER its CareAssignment is released, so an implementation that joins on
          status == "ACTIVE" passes the first probe and fails the fourth. The second half attacks the
          same rule from the review's own timeline — SOD-3 is checked at creation AND re-checked on
          schedule-debrief, so a facilitator who was clean at 06:00 and picks up a CareAssignment at
          06:30 can no longer book the debrief, which is only observable if the gate is re-evaluated per
          call rather than cached at creation. SOD-4 is then shown to have two independent disqualifiers
          on the same endpoint: the facilitator (fac_b) and any care participant (rn_cover) are both
          refused close, while the same call from an unrelated officer succeeds — and request-rework
          refuses the facilitator too, proving the rule is not close-only.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit, two AVAILABLE LDR beds (so posture never reaches the
            DIVERT branch that would block encounter creation), three staff members: rn_cover with an
            ACTIVE BEDSIDE shift and a RATIO_SHARED CareAssignment on the encounter (0.5 units on an
            ANTEPARTUM TIER_I singleton), plus two never-assigned candidates fac_a and fac_b. No bundle
            activation exists on the encounter, so submit-findings' ERR_BUNDLE_NOT_CLOSED precondition is
            vacuously satisfied.
