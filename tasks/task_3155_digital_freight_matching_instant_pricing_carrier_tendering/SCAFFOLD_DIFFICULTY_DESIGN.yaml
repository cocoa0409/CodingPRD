- rule_id: compensating_invariant
  instances:
  - name: load_cancel_debits_and_void_credits_the_same_booking_price_back
    grounds:
    - state_machines.Load.BOOKED_to_CANCELLED
    - state_machines.Load.INVOICED_to_VOIDED
    - entities.Shipper.fields.credit_used_cents
    - endpoints.POST_/v1/loads/{id}/void
    distinguishing_aspect: 'Shipper.credit_used_cents is the conserved quantity: booking debited it by the agreed_price_cents,
      and the compensating LOAD_VOIDED credit returns it to exactly the pre-booking value — the invariant credits nothing
      when the load is voided before booking and debits nothing when the booking is cancelled after an in-transit cancel-in-transit.'
