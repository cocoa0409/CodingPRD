            - call: "POST /permits/${mun_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "FIRE_MARSHAL_NOTIFICATION" }
              as: ProjectCoordinator
              captures: { fm_permit_id: $.data.id }
            - call: "POST /permits/${fm_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /crews"
              payload: { crew_name: "Crew Sierra", cert_level: "TANK_TECH_II", mobilization_buffer_minutes: 90 }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
