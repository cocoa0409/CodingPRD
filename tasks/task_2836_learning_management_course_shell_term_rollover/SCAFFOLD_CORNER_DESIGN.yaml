            - "setup lands as designed: ${t3_open} == REGISTRATION_OPEN, ${sh_a_state} == ${sh_b_state} == PROVISIONED, ${sh_a_ready} == true, ${tool3_open} == UNDER_REVIEW, ${tool3_final} == APPROVED with ${tool3_risk} == 3.00 and ${tool3_approved_ver} == \"2.4.0\""
            - "POST /content-items is shared: ${it_prof} and ${it_adm} are both created at HTTP 201 and ${items_now} == 2 — the LmsAdmin's create is NOT subject to the owner check that binds the Instructor"
            - "the publish/unpublish pair is shared in both directions: ${pub_by_prof} == PUBLISHED (Instructor), ${unpub_by_adm} == PROVISIONED with ${unpub_reason} == \"syllabus revision\" (LmsAdmin), ${pub_by_adm} == PUBLISHED (LmsAdmin) — neither verb is reserved to the role that performed the other"
            - "POST /tool-placements is shared: ${pl_a_state} == ${pl_b_state} == REQUESTED and ${pl_a_pin} == \"2.4.0\" — the version is pinned from the tool at placement time"
            - "${sh_a_mid} == PUBLISHED with ${ready_mid} == false — a REQUESTED placement clears publish_readiness but does not unpublish an already-published shell"
            - "the transitions endpoint is shared ACROSS creators: ${pl_a_active} == ACTIVE (created by the Instructor, activated by LmsAdmin) and ${pl_b_active} == ACTIVE (created by LmsAdmin, activated by the Instructor)"
            - "${placements_now} == 2 with ${risk_now} == 9.00 (3.00 base + min(15, 2 * 3) exposure) and ${ver_now} == \"2.4.0\" — activation rescored the tool without touching its approved version; GET /tool-placements returns total_count 2 with ${first_pl} == \"${sh_a}\" (created_at ASC)"
            - "${err_reviews_read} == ERR_ROLE_NOT_PERMITTED at HTTP 403 — GET /tool-reviews is shared by LmsAdmin and the two reviewers ONLY, and the Registrar's broad read access elsewhere does not extend to review verdicts"
            - "the same read as LmsAdmin returns total_count 2 with ${first_review_dim} == PRIVACY, and ${sh_a_end} == PUBLISHED with ${ready_end} == true once both placements are ACTIVE"

      - name: the_two_reviewer_roles_are_peers_with_disjoint_dimensions
        claim_type: peer_roles
        grounds:
          - roles[PrivacyReviewer]
          - roles[AccessibilityReviewer]
          - validations[2]
          - validations[18]
          - validations[19]
          - errors[ERR_REVIEW_DIMENSION_CONFLICT]
          - errors[ERR_REVIEW_INCOMPLETE]
          - state_machines[ToolIntegration.approval_state]
        distinguishing_aspect: "PrivacyReviewer and AccessibilityReviewer have identical shapes (both opaque, both with an empty exclusive list, both sharing POST /tool-reviews) yet neither can act in the other's dimension: the role decides which value of `dimension` the body may carry, so the peer denial is a 403 on an endpoint the caller IS listed on. The pair is also non-interchangeable downstream — FINALIZE_REVIEW stays blocked until BOTH dimensions leave PENDING, and a single CONDITIONS verdict from one peer downgrades the whole tool even though the risk score (21.50) is far below the CONDITIONAL threshold."
        test_recipe:
          setup:
            - "One tool integration opened for review: pii_tier 1, ROSTER_ONLY, vpat_score 95.00, WCAG AA, no placements, so its score is 10 + 10 + (100 - 95.00) * 0.3 + 0 + 0 = 21.50."
          setup_api_calls:
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Northwind", tool_name: "Peer Review Hub", tool_version: "5.2.1", data_sharing_scope: "ROSTER_ONLY", pii_tier: 1, vpat_score: 95.00, wcag_level: "AA" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { tool4: $.data.id, tool4_priv: $.data.privacy_review_state, tool4_acc: $.data.accessibility_review_state }
            - call: "POST /tool-integrations/${tool4}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { tool4_state: $.data.approval_state }
          trigger:
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool4}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "rev-p"
              captures: { peer_err_1: $.data.error_id }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool4}", dimension: "PRIVACY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "rev-a"
              captures: { peer_err_2: $.data.error_id }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool4}", dimension: "PRIVACY", decision: "CONDITIONS" }
              as: PrivacyReviewer
              as_user_id: "rev-p"
              captures: { note_err: $.data.error_id }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool4}", dimension: "PRIVACY", decision: "CONDITIONS", conditions_note: "vendor must disable analytics beacons" }
              as: PrivacyReviewer
              as_user_id: "rev-p"
              captures: { pr_id: $.data.id, pr_dim: $.data.dimension, pr_dec: $.data.decision, pr_by: $.data.reviewer_user_id }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool4}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "rev-p2"
              captures: { dup_err: $.data.error_id }
            - call: "POST /tool-integrations/${tool4}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { early_final_err: $.data.error_id }
            - call: "GET /tool-integrations/${tool4}"
              payload: {}
              as: PrivacyReviewer
              as_user_id: "rev-p"
              captures: { priv_mid: $.data.privacy_review_state, acc_mid: $.data.accessibility_review_state, state_mid: $.data.approval_state }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool4}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "rev-a"
              captures: { ar_id: $.data.id, ar_dim: $.data.dimension, ar_by: $.data.reviewer_user_id }
            - call: "POST /tool-integrations/${tool4}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { final_state: $.data.approval_state, final_risk: $.data.risk_score, final_ver: $.data.approved_version }
            - call: "GET /tool-reviews"
              payload: { tool_id: "${tool4}" }
              as: AccessibilityReviewer
              as_user_id: "rev-a"
              captures: { peer_read_first: "$.data[0].reviewer_user_id" }
            - call: "GET /tool-reviews/${pr_id}"
              payload: {}
              as: PrivacyReviewer
              as_user_id: "rev-p"
              captures: { own_read_dim: $.data.dimension, own_read_note: $.data.conditions_note }
          assert:
            - "${tool4_priv} == PENDING and ${tool4_acc} == PENDING at create, and ${tool4_state} == UNDER_REVIEW after OPEN_REVIEW"
            - "${peer_err_1} == ERR_ROLE_NOT_PERMITTED at HTTP 403 — the PrivacyReviewer IS listed on POST /tool-reviews, so the refusal comes from the body's dimension, not from the endpoint's role list"
            - "${peer_err_2} == ERR_ROLE_NOT_PERMITTED at HTTP 403 for the mirror-image attempt: the peers are symmetric and neither is a superset of the other"
            - "${note_err} == ERR_INVALID_REQUEST at HTTP 400 — decision CONDITIONS without conditions_note is rejected before any state check, so the dimension stays PENDING"
            - "the retry succeeds: ${pr_dim} == PRIVACY, ${pr_dec} == CONDITIONS, ${pr_by} == \"rev-p\""
            - "${dup_err} == ERR_REVIEW_DIMENSION_CONFLICT at HTTP 409 — a DIFFERENT PrivacyReviewer (rev-p2) is refused because the dimension is already decided this round, not because of who they are"
            - "${early_final_err} == ERR_REVIEW_INCOMPLETE at HTTP 422 while ${priv_mid} == CONDITIONAL, ${acc_mid} == PENDING and ${state_mid} == UNDER_REVIEW — one peer's verdict is never enough"
            - "${ar_dim} == ACCESSIBILITY with ${ar_by} == \"rev-a\", and the identical FINALIZE_REVIEW now yields ${final_state} == CONDITIONAL with ${final_risk} == 21.50 and ${final_ver} == \"5.2.1\" — 21.50 is below the 40.00 threshold, so the CONDITIONAL outcome comes purely from the privacy peer's CONDITIONS verdict"
            - "peers read each other's work: GET /tool-reviews as the AccessibilityReviewer returns total_count 2 with ${peer_read_first} == \"rev-p\" (created_at ASC), and ${own_read_dim} == PRIVACY with ${own_read_note} == \"vendor must disable analytics beacons\""

      - name: merge_approval_requires_a_different_admin_than_the_submitter
        claim_type: segregation_of_duties
        grounds:
          - roles[LmsAdmin]
          - validations[17]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines[MergeRequest.merge_state]
          - entities[MergeRequest].submitted_by_user_id
          - entities[MergeRequest].decided_by_user_id
        distinguishing_aspect: "Segregation of duties inside a SINGLE role: two LmsAdmins hold identical permissions, yet the one whose X-User-ID minted the merge request cannot decide it. The gate is scoped to exactly two edges — APPROVE and DECLINE — so the submitting admin may still SUBMIT it and, after someone else approves, may APPLY it. An implementation that gates the whole lifecycle on the submitter, or that only checks the role, gets one of those three wrong."
        test_recipe:
          setup:
            - "Term SOD-2027-SP at REGISTRATION_OPEN with two OFFICIAL PROVISIONED shells owned by one professor; the child carries one ACTIVE student enrollment so the APPLY leg has something to move."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "SOD-2027-SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-14T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t5: $.data.id }
            - call: "POST /academic-terms/${t5}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t5_open: $.data.lifecycle_state }
            - call: "POST /people"
              payload: { sis_person_id: "SOD-F-01", full_name: "Grace Bell", primary_affiliation: "FACULTY" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { prof5: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "SOD-S-01", full_name: "Nia Roberts", primary_affiliation: "STUDENT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu5: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${t5}", owner_person_id: "${prof5}", sis_section_code: "SOD-140-001", shell_type: "OFFICIAL", base_seat_cap: 12 }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { par5: $.data.id }
            - call: "POST /course-shells/${par5}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { par5_state: $.data.provisioning_state }
            - call: "POST /course-shells"
              payload: { term_id: "${t5}", owner_person_id: "${prof5}", sis_section_code: "SOD-140-002", shell_type: "OFFICIAL", base_seat_cap: 12 }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { chi5: $.data.id }
            - call: "POST /course-shells/${chi5}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { chi5_state: $.data.provisioning_state }
            - call: "POST /enrollments"
              payload: { shell_id: "${chi5}", person_id: "${stu5}", role: "STUDENT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { e5: $.data.id, e5_state: $.data.enrollment_state }
            - call: "GET /course-shells/${par5}"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { par5_ver: $.data.version }
          trigger:
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${par5}", child_shell_id: "${chi5}", expected_parent_shell_version: "${par5_ver}", justification: "cross-listed with the honors section" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { mr5: $.data.id, mr5_state: $.data.merge_state, mr5_sub: $.data.submitted_by_user_id, mr5_dec: $.data.decided_by_user_id }
            - call: "POST /merge-requests/${mr5}/transitions"
              payload: { action: "SUBMIT" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { mr5_submitted: $.data.merge_state, mr5_sub2: $.data.submitted_by_user_id }
            - call: "POST /merge-requests/${mr5}/transitions"
              payload: { action: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sod_err_approve: $.data.error_id }
            - call: "POST /merge-requests/${mr5}/transitions"
              payload: { action: "DECLINE", reason: "changed my mind" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sod_err_decline: $.data.error_id }
            - call: "GET /merge-requests/${mr5}"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { mr5_mid: $.data.merge_state, mr5_dec_mid: $.data.decided_by_user_id }
            - call: "POST /merge-requests/${mr5}/transitions"
              payload: { action: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { mr5_approved: $.data.merge_state, mr5_dec2: $.data.decided_by_user_id }
            - call: "POST /merge-requests/${mr5}/transitions"
              payload: { action: "APPLY" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { mr5_applied: $.data.merge_state, moved: $.data.moved_enrollment_count, ledger_before: $.data.seat_ledger_before, ledger_after: $.data.seat_ledger_after }
            - call: "GET /course-shells/${chi5}"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { chi5_end: $.data.provisioning_state }
            - call: "GET /course-shells/${par5}"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { par5_active: $.data.active_enrollment_count, par5_absorbed: $.data.absorbed_child_count }
          assert:
            - "setup: ${t5_open} == REGISTRATION_OPEN, ${par5_state} == ${chi5_state} == PROVISIONED, ${e5_state} == ACTIVE and ${par5_ver} == 2 (create then provisioning decision)"
            - "${mr5_state} == DRAFT with ${mr5_sub} == \"adm-1\" minted from X-User-ID at CREATE time and ${mr5_dec} == null"
            - "${mr5_submitted} == SUBMITTED with ${mr5_sub2} == \"adm-1\" — the submitter may perform SUBMIT itself; the gate is not 'the creator touches nothing again'"
            - "${sod_err_approve} == ERR_SEGREGATION_OF_DUTIES at HTTP 409 and ${sod_err_decline} == ERR_SEGREGATION_OF_DUTIES at HTTP 409 — BOTH decision edges are gated, so declining one's own request is no more permitted than approving it"
            - "${mr5_mid} == SUBMITTED with ${mr5_dec_mid} == null — neither refusal recorded a decider"
            - "the byte-identical APPROVE from adm-2 succeeds: ${mr5_approved} == APPROVED with ${mr5_dec2} == \"adm-2\", proving the refusal was about identity and not about the payload or the state"
            - "${mr5_applied} == APPLIED for an APPLY issued by adm-1, the original submitter: ${moved} == 1 with ${ledger_before} == ${ledger_after} == 1 — APPLY is outside the segregation gate, and the seat ledger is conserved"
            - "${chi5_end} == MERGED, ${par5_active} == 1 and ${par5_absorbed} == 1 — the cascade ran once, under the submitter's own hand"

      - name: a_single_reviewer_decides_at_most_one_dimension_of_one_tool
        claim_type: segregation_of_duties
        grounds:
          - validations[17]
          - validations[18]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REVIEW_DIMENSION_CONFLICT]
        distinguishing_aspect: "The reviewer-side half of §1.4 priority 17: one X-User-ID may not decide both dimensions of the same tool, and when that user's second post also collides with an already-decided dimension the segregation refusal (priority 17) must outrank the dimension conflict (priority 18)."
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_review_dimension_conflict_on_tool_reviews
          rationale: "§1.8's priority_pair_validation_conflict rule already drives both orderings on POST /tool-reviews with the same reviewer user id — the 17-over-18 pair and the isolated 18 — so a second corner walk would only restate it."

  # ===========================================================================
  # 8. Cross-cutting complexity layers  (§1.0 layers: optimistic_concurrency,
  #    cascading_side_effects, dual_variant_calculation, soft_delete_archival)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: merge_request_creation_is_guarded_by_the_parent_shells_stored_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[merge-request-create-stale-parent-shell]
          - endpoints[POST /merge-requests]
          - validations[12]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The guard is on the PARENT SHELL's version, not on the MergeRequest being created and not on the child: an off-by-one expected_parent_shell_version is refused with ERR_STALE_VERSION at 412, and the same literal that worked a moment ago becomes stale the instant an unrelated write (publishing the parent) advances the shell. Because cross-listing is supersede-style, a second request for the SAME pair is legal once the client re-reads the version — so an implementation that treats the duplicate pair as the error, or that ignores the field, diverges here."
        test_recipe:
          setup:
            - "Term OCC-2027-SP at REGISTRATION_OPEN with two OFFICIAL shells owned by one professor, each walked to PROVISIONED (create = version 1, provisioning decision = version 2)."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "OCC-2027-SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-14T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t6: $.data.id }
            - call: "POST /academic-terms/${t6}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t6_open: $.data.lifecycle_state }
            - call: "POST /people"
              payload: { sis_person_id: "OCC-F-01", full_name: "Ida Tarbell", primary_affiliation: "FACULTY" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { prof6: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${t6}", owner_person_id: "${prof6}", sis_section_code: "OCC-250-001", shell_type: "OFFICIAL", base_seat_cap: 18 }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { par6: $.data.id, par6_v1: $.data.version }
            - call: "POST /course-shells/${par6}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { par6_state: $.data.provisioning_state, par6_v2: $.data.version }
            - call: "POST /course-shells"
              payload: { term_id: "${t6}", owner_person_id: "${prof6}", sis_section_code: "OCC-250-002", shell_type: "OFFICIAL", base_seat_cap: 18 }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { chi6: $.data.id }
            - call: "POST /course-shells/${chi6}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { chi6_state: $.data.provisioning_state }
          trigger:
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${par6}", child_shell_id: "${chi6}", expected_parent_shell_version: "${par6_v2} - 1", justification: "stale read of the parent" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { occ_err_1: $.data.error_id }
            - call: "GET /merge-requests"
              payload: { parent_shell_id: "${par6}" }
              as: LmsAdmin
              as_user_id: "adm-1"
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${par6}", child_shell_id: "${chi6}", expected_parent_shell_version: "${par6_v2}", justification: "first cross-list request" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { mr_a: $.data.id, mr_a_state: $.data.merge_state }
            - call: "GET /course-shells/${par6}"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { par6_v_after_create: $.data.version }
            - call: "POST /course-shells/${par6}/publish"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { par6_pub: $.data.provisioning_state, par6_v3: $.data.version }
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${par6}", child_shell_id: "${chi6}", expected_parent_shell_version: "${par6_v2}", justification: "second request on a stale view" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { occ_err_2: $.data.error_id }
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${par6}", child_shell_id: "${chi6}", expected_parent_shell_version: "${par6_v3}", justification: "second request on a fresh view" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { mr_b: $.data.id, mr_b_state: $.data.merge_state }
            - call: "GET /merge-requests"
              payload: { parent_shell_id: "${par6}", merge_state: "DRAFT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { first_mr: "$.data[0].justification" }
          assert:
            - "setup literals: ${t6_open} == REGISTRATION_OPEN, ${par6_v1} == 1, ${par6_v2} == 2, ${par6_state} == ${chi6_state} == PROVISIONED"
            - "${occ_err_1} == ERR_STALE_VERSION at HTTP 412 for expected_parent_shell_version 1 while the parent stands at 2 — the guard is checked before the merge-pair rules, so the response is 412 and not one of the 20/21/22 codes"
            - "GET /merge-requests filtered by the parent returns total_count 0 with an empty data array immediately after the refusal — a stale create writes nothing"
            - "${mr_a_state} == DRAFT for the identical body carrying the true version 2, and ${par6_v_after_create} == 2 — creating a child MergeRequest is NOT a write to the parent shell, so the version the client just used is still current"
            - "${par6_pub} == PUBLISHED with ${par6_v3} == 3 — an unrelated shell write advances the guarded field"
            - "${occ_err_2} == ERR_STALE_VERSION at HTTP 412: the byte-identical body that succeeded moments ago now fails, which is the whole point of the layer"
            - "${mr_b_state} == DRAFT once the client re-reads version 3 — two live DRAFT requests for the SAME (parent, child) pair are legal, so GET /merge-requests?parent_shell_id=&merge_state=DRAFT returns total_count 2 with ${first_mr} == \"first cross-list request\" (created_at ASC)"

      - name: rollover_job_creation_is_guarded_by_the_target_shells_stored_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rollover-job-create-stale-target-shell]
          - endpoints[POST /rollover-jobs]
          - validations[12]
          - validations[33]
          - validations[34]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Same layer, different parent entity and a different reason the guard is the only detector: the target shell must be REQUESTED or PROVISIONED and empty, so a publish/unpublish round trip returns the shell to a state that satisfies every business rule while leaving its version two higher. The stale create must therefore fail with ERR_STALE_VERSION (priority 12) even though the target is legal, and the fresh create must then be accepted — an implementation that compares against the child job, or that revalidates eligibility instead of the version, produces the wrong code."
        test_recipe:
          setup:
            - "Term OCC-2026-FA at REGISTRATION_OPEN holding a CONCLUDED source shell, and term OCC-2027-FA at REGISTRATION_OPEN holding an empty PROVISIONED target shell (version 2)."
