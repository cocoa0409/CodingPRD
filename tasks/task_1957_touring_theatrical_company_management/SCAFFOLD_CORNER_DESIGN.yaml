        excluded_because:
          difficulty_instance: stop_routing_travel_buffer
          rationale: "Window conflict asserted in §1.8; curtain gap and weekly cap have their own §1.8 instances (same_day_curtain_gap, weekly_cap_eighth_ok_ninth_fails)."
