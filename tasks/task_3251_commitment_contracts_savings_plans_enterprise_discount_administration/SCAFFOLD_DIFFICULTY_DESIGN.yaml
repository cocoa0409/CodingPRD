              captures: { am_a1: $.data.id }
          trigger:
            - call: "GET /api/enterprise-agreements/${am_agr}"
              payload: {}
              as: FinanceAnalyst
              captures: { am_v2: $.data.version }
            - call: "POST /api/pricing-amendments"
              payload: { agreement_id: "${am_agr}", service_family: "COMPUTE", discount_rate: 0.20, effective_from: "2026-11-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_agreement_version: "${am_v2}" }
              as: FinanceAnalyst
              captures: { am_a2: $.data.id }
            - call: "POST /api/pricing-amendments"
              payload: { agreement_id: "${am_agr}", service_family: "COMPUTE", discount_rate: 0.25, effective_from: "2026-10-31T00:00:00Z", effective_to: "2026-11-15T00:00:00Z", expected_agreement_version: "${am_v2} + 1" }
              as: FinanceAnalyst
              captures: { am_err: $.data.error_id }
          assert:
            - "adjacent amendment [2026-11-01, 2026-12-01) succeeds with 201 (effective_from == existing effective_to is NOT overlap under half-open semantics)"
            - "intersecting amendment [2026-10-31, 2026-11-15) is rejected 422 ERR_AMENDMENT_WINDOW_OVERLAP"

      - name: reserved_capacity_aggregate_quota_counts_overlapping_units_not_pairwise
        grounds:
          - validations[priority=8]
          - entities.BillingOrganization.fields.capacity_quota_units
          - errors[ERR_CAPACITY_QUOTA_EXCEEDED]
        distinguishing_aspect: "Interval semantics 2 (aggregate capacity on CommitmentPlan RESERVED_CAPACITY, different resource entity): two overlapping reserved plans of 6 units each are individually under the 10-unit quota but their overlapping sum 12 exceeds it — rejection is driven by the SUM over the intersection window, not by pairwise window collision."
        test_recipe:
          setup:
            - "Clock at default. Org with capacity_quota_units 10; agreement ACTIVE with COMPUTE tier."
            - "Reserved plan r1: 6 units, window [2026-09-01, 2026-11-01). Trigger r2: 6 units, window [2026-10-01, 2026-12-01) — overlaps r1 during October; 6+6=12 > 10."
            - "Control r3: 4 units, window [2026-11-01, 2026-12-01) — adjacent to r1 (no overlap with r1), overlaps r2's rejection so never coexists; posted after r2's failure it overlaps nothing (r2 was rejected) and 4 <= 10 succeeds."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Rc Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { rc_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${rc_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { rc_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${rc_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${rc_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${rc_org}", agreement_id: "${rc_agr}", type: "RESERVED_CAPACITY", instance_family: "GPU", units: 6, hourly_commitment_cents: 50, plan_discount_rate: 0.40, term_start: "2026-09-01T00:00:00Z", term_end: "2026-11-01T00:00:00Z" }
              as: OrgAdmin
              captures: { rc_r1: $.data.id }
          trigger:
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${rc_org}", agreement_id: "${rc_agr}", type: "RESERVED_CAPACITY", instance_family: "GPU", units: 6, hourly_commitment_cents: 50, plan_discount_rate: 0.40, term_start: "2026-10-01T00:00:00Z", term_end: "2026-12-01T00:00:00Z" }
              as: OrgAdmin
              captures: { rc_err: $.data.error_id }
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${rc_org}", agreement_id: "${rc_agr}", type: "RESERVED_CAPACITY", instance_family: "GPU", units: 4, hourly_commitment_cents: 50, plan_discount_rate: 0.40, term_start: "2026-11-01T00:00:00Z", term_end: "2026-12-01T00:00:00Z" }
              as: OrgAdmin
              captures: { rc_r3: $.data.id }
          assert:
            - "r2 (6 units overlapping r1's 6 in October): 422 ERR_CAPACITY_QUOTA_EXCEEDED because aggregate 12 > quota 10"
            - "r3 (4 units adjacent to r1 at 2026-11-01, no overlap with anything after r2's rejection): 201 created — half-open adjacency again not an overlap"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: credit_grant_conservation_across_consume_and_revoke
        grounds:
          - calculations.credit_consumption
          - entities.CreditGrant.fields.remaining_cents
          - state_machines.CreditGrant
        distinguishing_aspect: "Conserved quantity 1 (credit value): forward action (invoice finalize consumes 300 of 1000) paired with the compensating action (revoke forfeits the remaining 700) leaves amount_cents == consumed_cents + remaining_cents + forfeited_cents == 1000 with zero drift."
        test_recipe:
          setup:
            - "Clock at default. Org without agreement; one account; usage 300 in period 0; grant of 1000 expiring 2026-12-01; invoice generated and finalized (consumes 300, grant DEPLETING)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Ci Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { ci_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${ci_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { ci_acct: $.data.id }
            - call: "POST /api/credit-grants"
              payload: { org_id: "${ci_org}", amount_cents: 1000, expires_at: "2026-12-01T00:00:00Z" }
              as: PlatformBillingOperator
              captures: { ci_g: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${ci_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 300 }
              as: LinkedAccountManager
              as_user_id: "${ci_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${ci_org}", period_index: 0 }
              as: OrgAdmin
              captures: { ci_inv: $.data.id }
            - call: "POST /api/invoices/${ci_inv}/finalize"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/credit-grants/${ci_g}/revoke"
              payload: {}
              as: PlatformBillingOperator
              captures: { ci_status: $.data.status, ci_consumed: $.data.consumed_cents, ci_forfeited: $.data.forfeited_cents, ci_remaining: $.data.remaining_cents }
          assert:
            - "after finalize: consumed_cents == 300 and grant was DEPLETING"
            - "after revoke: status == REVOKED, forfeited_cents == 700, remaining_cents == 0"
            - "invariant: 1000 == 300 (consumed) + 0 (remaining) + 700 (forfeited) — consume + revoke leaves the conserved quantity unchanged"

      - name: commitment_conservation_consumed_plus_trueup_equals_committed
        grounds:
          - calculations.commitment_trueup
          - entities.EnterpriseAgreement.fields.committed_spend_cents
          - entities.EnterpriseAgreement.fields.consumed_commitment_cents
        distinguishing_aspect: "Conserved quantity 2 (committed spend dollars): forward usage accrual (600000 consumed of 1000000 committed) paired with the compensating term-end SHORTFALL true-up (400000) sums to exactly the committed amount — the org pays precisely committed_spend_cents, no more, no less."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement committed 1000000, COMPUTE tier (0, 0.10), term 2026-09-01..2026-10-01, ACTIVE; one account with non-marketplace usage 600000."
            - "Clock advanced to 2026-10-01T00:00:00Z; run-period-close expires the agreement."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Cc Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { cc_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${cc_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
              captures: { cc_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${cc_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${cc_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${cc_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { cc_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${cc_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 600000 }
              as: LinkedAccountManager
              as_user_id: "${cc_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${cc_org}", period_index: 0 }
              as: OrgAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformBillingOperator
            - call: "POST /api/billing-orgs/${cc_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
          trigger:
            - call: "POST /api/true-up-charges/assess"
              payload: { agreement_id: "${cc_agr}" }
              as: OrgAdmin
              captures: { cc_amount: $.data.amount_cents, cc_type: $.data.type }
            - call: "GET /api/enterprise-agreements/${cc_agr}"
              payload: {}
              as: OrgAdmin
              captures: { cc_consumed: $.data.consumed_commitment_cents, cc_accrued: $.data.accrued_trueup_cents, cc_life: $.data.lifecycle_status }
          assert:
            - "agreement.lifecycle_status == EXPIRED after the clock crosses term_end and period close runs"
            - "TrueUpCharge type == SHORTFALL, amount_cents == 400000 (1000000 - 600000)"
            - "conservation: consumed_commitment_cents (600000) + accrued_trueup_cents (400000) == committed_spend_cents (1000000)"

  # ===========================================================================
  # Additional mode-(c) instance for combinatorial_formula (circular-looking
  # dependency with pinned evaluation order).
  # ===========================================================================
  - rule_id: combinatorial_formula_two_pass
    instances:
      - name: trueup_two_pass_marketplace_weight_top_tier_double_counts
        grounds:
          - calculations.commitment_trueup
          - endpoints.POST_/api/true-up-charges/assess
        distinguishing_aspect: "Mode (c): marketplace weight depends on the selected tier, but tier selection depends on consumed which includes marketplace — a circular-looking dependency broken by the pinned two-pass order. Pass 1 with weight 0.5 yields 400000 (== top threshold, >= qualifies), so pass 2 uses weight 1.0 and consumed_2 = 500000, giving shortfall 500000 — a single-pass interpretation would compute 600000."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement committed 1000000, COMPUTE tiers (0, 0.10) and (400000, 0.25), term 2026-09-01..2026-10-01, ACTIVE."
            - "Account with usage: 300000 direct (hour 00) + 200000 marketplace (hour 01), both COMPUTE; invoice generated; clock past term; period close expires the agreement."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Tp Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { tp_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${tp_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
              captures: { tp_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${tp_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${tp_agr}", service_family: "COMPUTE", threshold_cents: 400000, rate: 0.25 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${tp_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${tp_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { tp_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${tp_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 300000 }
              as: LinkedAccountManager
              as_user_id: "${tp_acct}"
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${tp_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T01:00:00Z", list_price_cents: 200000, is_marketplace: true }
              as: LinkedAccountManager
              as_user_id: "${tp_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${tp_org}", period_index: 0 }
              as: OrgAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformBillingOperator
            - call: "POST /api/billing-orgs/${tp_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
          trigger:
            - call: "POST /api/true-up-charges/assess"
              payload: { agreement_id: "${tp_agr}" }
              as: OrgAdmin
              captures: { tp_amount: $.data.amount_cents, tp_type: $.data.type }
          assert:
            - "pass 1: consumed_1 == 300000 + floor(200000 * 0.5) == 400000, which qualifies (>=) for the top tier at threshold 400000"
            - "pass 2 with top-tier weight 1.0: consumed_2 == 300000 + 200000 == 500000"
