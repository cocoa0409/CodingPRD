              payload: { disposition: "UPHELD" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (complaint already DISMISSED)."
      - name: complaint_needs_info_resubmit_cycle
        claim_type: Valid Transition
