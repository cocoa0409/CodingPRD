              captures: { laF: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkF}", full_name: "SAF", license_no: "FL-AG-F2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saF: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SF", residency_state_code: "FL", tax_id_last4: "0501" }
              as: PlatformAdmin
              captures: { selF: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BF", residency_state_code: "FL", tax_id_last4: "0502" }
              as: PlatformAdmin
              captures: { buyF: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USFAIL123456", make: "Pursuit", model: "OS385", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "9990001", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesF: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkF}", listing_agent_id: "${laF}", seller_id: "${selF}", vessel_id: "${vesF}", agreement_type: "CENTRAL", list_price_cents: 200000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laF}"
              captures: { lstF: $.data.id }
            - call: "POST /yacht/listings/${lstF}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laF}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstF}", buyer_id: "${buyF}", selling_agent_id: "${saF}", offer_price_cents: 190000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-05T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saF}"
              captures: { offF: $.data.id, offF_v: $.data.version }
            - call: "POST /yacht/offers/${offF}/accept"
              payload: { expected_offer_version: "${offF_v}" }
              as: ListingAgent
              as_user_id: "${laF}"
            - call: "POST /yacht/offers/${offF}/escrow-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 19000000, value_date: "2026-08-02T00:00:00Z" }
              as: EscrowOfficer
              captures: { entF: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/escrow-entries/${entF}/clear"
              payload: {}
              as: EscrowOfficer
            - call: "GET /yacht/offers/${offF}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${saF}"
              captures: { f0: "$.data[0].id", f1: "$.data[1].id", f2: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${f0}/object"
              payload: { objection_note: "Survey found hull blistering" }
              as: SellingAgent
              as_user_id: "${saF}"
            - call: "POST /yacht/contingencies/${f1}/waive"
              payload: {}
