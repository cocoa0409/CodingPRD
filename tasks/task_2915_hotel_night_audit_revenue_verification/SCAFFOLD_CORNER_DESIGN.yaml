              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "POST /night-audit/accounting-periods/${period_id}/tie-out with gl_control_total_amount 217.75 as Controller (X-User-ID u_ctl_1)."
          assert:
            - "Each of post-room-and-tax, seal-charges, verify-settlements, balance and close returned 200 and the date's status read OPEN then ROOM_POSTING, CHARGES_SEALED, SETTLEMENT_REVIEW, BALANCED and CLOSED in that order, with version 2, 3, 4, 5 and 6 - one increment per hop from the created version 1."
            - "After post-room-and-tax the date reads rooms_occupied_count == 1, room_night_revenue_amount == 200.00, tax_revenue_amount == 17.75 (round(200.00 * 8.875 / 100, 2)), other_room_revenue_amount == 0.00, total_revenue_amount == 217.75, occupancy_pct == 1.04 (round(1 * 100 / 96, 2)), adr_amount == 200.00 and revpar_amount == 2.08 (round(200.00 / 96, 2))."
            - "seal-charges appended no TAX_TRUE_UP line, because the final tax on the single 200.00 room line equals the provisional 17.75 and the delta is exactly 0.00; GET /night-audit/journal-postings?business_date_id=${bd1_id} returns exactly 2 rows, one ROOM with night_index == 1 and one OCCUPANCY_TAX."
