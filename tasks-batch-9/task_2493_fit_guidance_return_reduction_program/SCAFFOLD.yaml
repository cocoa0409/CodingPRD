scenario: |
  Generate task harder than expert level!

  2493. Fit Guidance & Return Reduction Program (apparel e-commerce merchandising): measurement
  specification capture from vendors with tolerance and grade rule verification, size chart
  standardization across brands with conversion tables and body-measurement mapping, fit
  recommendation engine using purchase and return history with confidence thresholds, return reason
  coding distinguishing fit, quality, expectation and change-of-mind, product page enhancement with
  model measurements, reviewer fit feedback and detail imagery, chronic-return item identification
  with vendor specification corrections or delisting, return policy differentiation by category and
  customer behavior with abuse controls, return cost and reduction measurement by intervention

domain_name: fit-guidance-return-reduction
api_prefix: /fit-program

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # Every entity is a peer collection under /fit-program with FK references in the body.
  # No entity id appears twice in any URL path; sub-resource GETs are one level deep only
  # (`/fit-program/{collection}/{id}/{segment}`), so no nested ownership chain exists.

  state_machine_shape: parallel
  # CatalogItem carries two independent state axes on the same row (listing_status x
  # fit_readiness) that advance on different triggers; MeasurementSpec is cyclic
  # (CORRECTION_REQUESTED -> SUBMITTED revision loop, and VERIFIED -> CORRECTION_REQUESTED
  # reopening); ReturnCase is a branching fork-join (TRIAGE -> one of four review branches ->
  # RESOLVED_* with a different side-effect set per branch); CustomerProfile.abuse_status is
  # cyclic (escalates on strikes, de-escalates when strikes age out of the trailing window).

  relationship_patterns:
    - one_to_many        # Vendor -> CatalogItem, CatalogItem -> MeasurementSpec / OrderLine, ReturnCase -> ReturnCostPosting
    - cross_aggregate    # SizeChartMapping joins CatalogItem to SizeChart; InterventionDeployment joins Intervention to CatalogItem
    - polymorphic        # ReturnPolicy.scope switches the row between a category default (customer_profile_id null) and a customer override

  role_model: segregation_of_duties
  # The ReturnsAuditor operator who classified a ReturnCase must not be the operator who
  # resolves it; VendorUser authors specifications but can never verify them; FitAnalyst
  # verifies and publishes but can never author or resolve returns.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal brand/vendor name
        constraints: 1-120 chars
      - name: brand_code
        type: string
        source: input
        description: short brand token used on size charts and specifications
        constraints: unique across Vendor; 2-8 chars, uppercase A-Z0-9
      - name: correction_budget_cents
        type: integer
        source: input
        description: annual budget the vendor has funded for specification correction rounds
        constraints: ">= 0"
      - name: correction_spend_cents
        type: integer
        source: computed
        description: cumulative CORRECTION_COST_CENTS debited for every correction round opened against this vendor's specifications
        default: 0
      - name: correction_round_count
        type: integer
        source: computed
        description: number of times any specification of this vendor entered CORRECTION_REQUESTED
        default: 0
      - name: quality_chargeback_count
        type: integer
        source: computed
        description: number of non-reversed ReturnCase rows with reason_family QUALITY resolved against this vendor's items
        default: 0
      - name: reliability_score_bp
        type: integer
        source: computed
        description: vendor specification reliability, basis points; see calculations.vendor_reliability_score
        default: 10000
      - name: status
        type: enum
        source: computed
        description: derived vendor standing gating new specification submissions
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED"

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: FK -> Vendor.id; the vendor that supplies this item and owns its measurement specifications
      - name: sku
        type: string
        source: input
        description: merchant SKU
        constraints: unique across CatalogItem
      - name: category_code
        type: enum
        source: input
        description: merchandising category driving policy, freight and avoided-return valuation
        constraints: "TOPS | BOTTOMS | DRESSES | OUTERWEAR | FOOTWEAR"
      - name: brand_size_system
        type: enum
        source: input
        description: size system the vendor labels this item in
        constraints: "US_ALPHA | US_NUMERIC | EU | UK"
      - name: unit_price_cents
        type: integer
        source: input
        description: list price per unit
        constraints: ">= 1"
      - name: listing_status
        type: enum
        source: system
        description: storefront axis of the item state; advances independently of fit_readiness
        default: DRAFT
        constraints: "DRAFT | LISTED | SUSPENDED | DELISTED"
      - name: fit_readiness
        type: enum
        source: system
        description: fit-guidance axis of the item state; advances independently of listing_status
        default: UNVERIFIED
        constraints: "UNVERIFIED | CHART_MAPPED | GUIDANCE_READY"
      - name: fit_watch_state
        type: enum
        source: computed
        description: chronic-return classification recomputed from chronic_return_score_bp and fit_return_count on every return event and on every ops-run
        default: NORMAL
        constraints: "NORMAL | WATCH | CHRONIC"
      - name: model_measurements_published
        type: boolean
        source: input
        description: product page carries the fit model's body measurements
        default: false
      - name: model_height_cm
        type: integer
        source: input
        description: fit model height in centimetres; null until the product page is enhanced
        default: null
      - name: model_worn_size_label
        type: string
        source: input
        description: brand size label the fit model wears in the detail imagery; null until enhanced
        default: null
      - name: detail_image_count
        type: integer
        source: input
        description: count of published fabric/seam detail images on the product page
        default: 0
      - name: pdp_review_required
        type: boolean
        source: system
        description: set true when an EXPECTATION-family return resolves against this item, flagging the product page copy for review
        default: false
      - name: units_sold_count
        type: integer
        source: computed
        description: sum of OrderLine.quantity over OrderLine rows of this item whose status is in {DELIVERED, RETURN_IN_PROGRESS, RETURNED, KEPT}
        default: 0
      - name: fit_return_count
        type: integer
        source: computed
        description: count of ReturnCase rows on this item with reason_family FIT and status in {RESOLVED_REFUNDED, RESOLVED_DENIED}
        default: 0
      - name: expectation_return_count
        type: integer
        source: computed
        description: count of ReturnCase rows on this item with reason_family EXPECTATION and status in {RESOLVED_REFUNDED, RESOLVED_DENIED}
        default: 0
      - name: total_return_count
        type: integer
        source: computed
        description: count of ReturnCase rows on this item with status in {RESOLVED_REFUNDED, RESOLVED_DENIED}
        default: 0
      - name: fit_return_rate_bp
        type: integer
        source: computed
        description: fit_return_count / units_sold_count in basis points, floored; 0 when units_sold_count == 0
        default: 0
      - name: expectation_return_rate_bp
        type: integer
        source: computed
        description: expectation_return_count / units_sold_count in basis points, floored; 0 when units_sold_count == 0
        default: 0
      - name: chronic_return_score_bp
        type: integer
        source: computed
        description: weighted chronic-return score; see calculations.item_chronic_return_score
        default: 0
      - name: return_cost_accrued_cents
        type: integer
        source: computed
        description: sum of ReturnCostPosting.amount_cents over every posting (ORIGINAL and REVERSAL) attached to ReturnCase rows of this item
        default: 0
      - name: fit_signal_weight_total
        type: integer
        source: computed
        description: sum of FitFeedback.signal_weight over FitFeedback rows on this item with status ACTIVE
        default: 0
      - name: active_fit_feedback_count
        type: integer
        source: computed
        description: count of FitFeedback rows on this item with status ACTIVE
        default: 0
      - name: delist_reason_code
        type: enum
        source: system
        description: why the item left the storefront permanently; null while listing_status != DELISTED
        default: null
        constraints: "CHRONIC_FIT_RETURNS | VENDOR_EXIT | SEASONAL_END | MANUAL"

  - name: MeasurementSpec
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> CatalogItem.id; the item this measurement specification describes
      - name: revision_round
        type: integer
        source: system
        description: number of completed correction loops; 0 on first submission, incremented on every resubmit
        default: 0
      - name: status
        type: enum
        source: system
        description: verification lifecycle state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | VERIFIED | CORRECTION_REQUESTED | REJECTED | SUPERSEDED"
      - name: size_system
        type: enum
        source: input
        description: size system the size_points are labelled in
        constraints: "US_ALPHA | US_NUMERIC | EU | UK"
      - name: base_size_label
        type: string
        source: input
        description: label of the sample size the grade rules radiate from; MUST appear in size_points
      - name: fabric_stretch_class
        type: enum
        source: input
        description: stretch class selecting the tolerance multiplier during verification
        constraints: "RIGID | STRETCH | HIGH_STRETCH"
      - name: size_points
        type: array
        source: input
        description: "per-size finished-garment measurements; objects { size_label: string, sort_index: integer, chest_mm: integer, waist_mm: integer, hip_mm: integer, inseam_mm: integer }"
        constraints: ">= 2 entries; size_label unique; sort_index unique and >= 0"
      - name: grade_rules
        type: array
        source: input
        description: "declared grade increments and tolerances; objects { measurement_point: CHEST|WAIST|HIP|INSEAM, increment_mm: integer, tolerance_pct_bp: integer, tolerance_abs_mm: integer }"
        constraints: ">= 1 entry; measurement_point unique per specification"
      - name: violation_count
        type: integer
        source: computed
        description: number of consecutive-size grade violations found by the last verification run
        default: 0
      - name: first_violation_point
        type: enum
        source: computed
        description: measurement point of the first violation in verification order; null when violation_count == 0
        default: null
        constraints: "CHEST | WAIST | HIP | INSEAM"
      - name: first_violation_from_size_label
        type: string
        source: computed
        description: size_label of the lower size of the first violating consecutive pair; null when violation_count == 0
        default: null
      - name: tolerance_applied_mm
        type: array
        source: computed
        description: "resolved tolerance per point from the last verification run; objects { measurement_point: string, tolerance_mm: integer }"
      - name: correction_reason
        type: enum
        source: system
        description: why the specification is in CORRECTION_REQUESTED
        default: null
        constraints: "GRADE_TOLERANCE_VIOLATION | CHRONIC_FIT_RETURNS"
      - name: verified_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the FitAnalyst operator whose verify call last decided this specification; not a foreign key
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of the last verify call
        default: null

  - name: SizeChart
    parent: null
    common_fields: true
    fields:
      - name: chart_code
        type: string
        source: input
        description: standardized chart identifier shared across brands
        constraints: unique across SizeChart; 3-16 chars
      - name: size_system
        type: enum
        source: input
        description: size system the chart rows are labelled in
        constraints: "US_ALPHA | US_NUMERIC | EU | UK"
      - name: category_code
        type: enum
        source: input
        description: category the chart standardizes
        constraints: "TOPS | BOTTOMS | DRESSES | OUTERWEAR | FOOTWEAR"
      - name: status
        type: enum
        source: system
        description: standardization lifecycle state
        default: DRAFT
        constraints: "DRAFT | STANDARDIZED | RETIRED"
      - name: rows
        type: array
        source: input
        description: "conversion table and body-measurement mapping; objects { size_label: string, sort_index: integer, body_chest_min_mm: integer, body_chest_max_mm: integer, body_waist_min_mm: integer, body_waist_max_mm: integer, conversion_us_alpha: string, conversion_us_numeric: string, conversion_eu: string, conversion_uk: string }"
        constraints: ">= 2 entries; sort_index unique, contiguous from 0; size_label unique"
      - name: row_count
        type: integer
        source: computed
        description: number of entries in rows
        default: 0
      - name: median_row_index
        type: integer
        source: computed
        description: floor((row_count - 1) / 2); the fallback anchor index for recommendations
        default: 0
      - name: retire_reason_code
        type: enum
        source: system
        description: why the chart was retired; null while status != RETIRED
        default: null
        constraints: "SUPERSEDED_BY_NEW_CHART | VENDOR_SYSTEM_CHANGE | DATA_QUALITY"

  - name: SizeChartMapping
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> CatalogItem.id; the item whose brand sizes are mapped
      - name: chart_id
        type: string
        source: input
        description: FK -> SizeChart.id; the standardized chart the item's sizes map onto
      - name: size_label_pairs
        type: array
        source: input
        description: "brand-size to chart-size pairs; objects { spec_size_label: string, chart_size_label: string }"
        constraints: ">= 1 entry; spec_size_label unique; chart_size_label unique"
      - name: mapped_row_count
        type: integer
        source: computed
        description: number of size_label_pairs entries accepted at creation
        default: 0
      - name: spec_size_point_count
        type: integer
        source: computed
        description: number of size_points on the item's VERIFIED MeasurementSpec at mapping creation
        default: 0
      - name: coverage_bp
        type: integer
        source: computed
        description: floor(mapped_row_count * 10000 / spec_size_point_count); 0 when spec_size_point_count == 0
        default: 0
      - name: unmapped_size_labels
        type: array
        source: computed
        description: spec size_labels with no pair, ordered by the specification's sort_index ASC
      - name: status
        type: enum
        source: system
        description: only one mapping per item is ACTIVE at a time
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"
      - name: superseded_reason
        type: enum
        source: system
        description: why this mapping stopped being ACTIVE; null while status == ACTIVE
        default: null
        constraints: "NEW_MAPPING | CHART_RETIRED"

  - name: CustomerProfile
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: customer login email
        constraints: unique across CustomerProfile
      - name: tier
        type: enum
        source: input
        description: loyalty tier feeding policy_class
        default: STANDARD
        constraints: "STANDARD | PLUS"
      - name: purchase_line_count
        type: integer
        source: computed
        description: count of OrderLine rows of this customer whose status is in {DELIVERED, RETURN_IN_PROGRESS, RETURNED, KEPT}
        default: 0
      - name: return_case_count
        type: integer
        source: computed
        description: count of ReturnCase rows of this customer with status in {TRIAGE, FIT_REVIEW, QUALITY_REVIEW, EXPECTATION_REVIEW, COOLING_OFF, RESOLVED_REFUNDED, RESOLVED_DENIED}
        default: 0
      - name: change_of_mind_count
        type: integer
        source: computed
        description: count of ReturnCase rows of this customer with reason_family CHANGE_OF_MIND and status RESOLVED_REFUNDED
        default: 0
      - name: return_rate_bp
        type: integer
        source: computed
        description: floor(return_case_count * 10000 / purchase_line_count); 0 when purchase_line_count == 0
        default: 0
      - name: abuse_strike_count
        type: integer
        source: computed
        description: count of RESOLVED_REFUNDED CHANGE_OF_MIND ReturnCase rows with refund_amount_cents > 0 whose requested_at is within the trailing ABUSE_WINDOW_DAYS of the logical clock
        default: 0
      - name: abuse_status
        type: enum
        source: computed
        description: abuse-control standing; recomputed on every return event and on every ops-run, in both escalating and de-escalating directions
        default: CLEAR
        constraints: "CLEAR | WATCH | RESTRICTED | BLOCKED"
      - name: policy_class
        type: enum
        source: computed
        description: return-window class derived from tier and abuse_status
        default: STANDARD_WINDOW
        constraints: "STANDARD_WINDOW | EXTENDED_WINDOW | RESTRICTED_WINDOW"
      - name: refunded_total_cents
        type: integer
        source: computed
        description: sum of refund_amount_cents over this customer's ReturnCase rows with status RESOLVED_REFUNDED, minus the same amount for every case later VOIDED
        default: 0

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: customer_profile_id
        type: string
        source: input
        description: FK -> CustomerProfile.id; the purchaser
      - name: item_id
        type: string
        source: input
        description: FK -> CatalogItem.id; the purchased item
      - name: size_label
        type: string
        source: input
        description: brand size label purchased
      - name: quantity
        type: integer
        source: input
        description: units on this line
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: price actually charged per unit
        constraints: ">= 1"
      - name: shipping_allocated_cents
        type: integer
        source: input
        description: shipping charge allocated to this line
        constraints: ">= 0"
      - name: delivered_at
        type: datetime
        source: input
        description: delivery instant; the return window and every measurement window are anchored on it
      - name: gross_line_cents
        type: integer
        source: computed
        description: unit_price_cents * quantity
        default: 0
      - name: status
        type: enum
        source: system
        description: return lifecycle of the purchased line
        default: DELIVERED
        constraints: "DELIVERED | RETURN_IN_PROGRESS | RETURNED | KEPT"

  - name: ReturnCase
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: input
        description: FK -> OrderLine.id; the line being returned
      - name: requested_reason_code
        type: enum
        source: input
        description: reason the customer selected at request time
        constraints: "FIT_TOO_SMALL | FIT_TOO_LARGE | QUALITY_DEFECT | EXPECTATION_MISMATCH | CHANGE_OF_MIND"
      - name: reason_code
        type: enum
        source: system
        description: audited reason code; equals requested_reason_code until a classify call overwrites it
        constraints: "FIT_TOO_SMALL | FIT_TOO_LARGE | QUALITY_DEFECT | EXPECTATION_MISMATCH | CHANGE_OF_MIND"
      - name: reason_family
        type: enum
        source: computed
        description: "family of reason_code: FIT_TOO_SMALL/FIT_TOO_LARGE -> FIT, QUALITY_DEFECT -> QUALITY, EXPECTATION_MISMATCH -> EXPECTATION, CHANGE_OF_MIND -> CHANGE_OF_MIND"
        constraints: "FIT | QUALITY | EXPECTATION | CHANGE_OF_MIND"
      - name: status
        type: enum
        source: system
        description: fork-join review lifecycle
        default: TRIAGE
        constraints: "TRIAGE | FIT_REVIEW | QUALITY_REVIEW | EXPECTATION_REVIEW | COOLING_OFF | RESOLVED_REFUNDED | RESOLVED_DENIED | VOIDED"
      - name: effective_policy_id
        type: string
        source: system
        description: FK -> ReturnPolicy.id; policy row selected at creation by calculations.effective_return_policy_resolution
      - name: effective_window_days
        type: integer
        source: system
        description: policy window_days adjusted by the purchaser's policy_class at creation
        default: 0
      - name: return_deadline_at
        type: datetime
        source: system
        description: OrderLine.delivered_at + effective_window_days days; the request instant must be at or before it
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant at creation
      - name: item_condition
        type: enum
        source: input
        description: warehouse grading supplied at resolve time; null before resolve
        default: null
        constraints: "RESELLABLE_A | RESELLABLE_B | SALVAGE"
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: fee withheld from the refund; see calculations.return_refund_and_restocking_fee
        default: 0
      - name: refund_amount_cents
        type: integer
        source: computed
        description: amount refunded to the purchaser; 0 while unresolved, 0 for RESOLVED_DENIED
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: sum of this case's ORIGINAL ReturnCostPosting amounts; see calculations.return_case_cost_postings
        default: 0
      - name: classified_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ReturnsAuditor operator who classified the case; not a foreign key
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ReturnsAuditor operator who resolved the case; not a foreign key
        default: null
      - name: void_reason
        type: enum
        source: system
        description: why the resolution was reversed; null while status != VOIDED
        default: null
        constraints: "AUDIT_REVERSAL | DUPLICATE_CASE | FRAUD_CONFIRMED"

  - name: ReturnCostPosting
    parent: null
    common_fields: false
    fields:
      - name: return_case_id
        type: string
        source: input
        description: FK -> ReturnCase.id; the case this posting belongs to
      - name: component
        type: enum
        source: system
        description: cost component this posting represents
        constraints: "FREIGHT_INBOUND | PROCESSING_LABOR | REFURB_REPACK | MARKDOWN_LOSS | PAYMENT_FEE_UNRECOVERED | VENDOR_CHARGEBACK_CREDIT"
      - name: amount_cents
        type: integer
        source: system
        description: signed cents; negative for VENDOR_CHARGEBACK_CREDIT and for every REVERSAL posting of a positive component
      - name: posting_kind
        type: enum
        source: system
        description: ORIGINAL rows are written by resolve; REVERSAL rows are written by void and negate exactly one ORIGINAL row
        constraints: "ORIGINAL | REVERSAL"
      - name: reversed_component
        type: enum
        source: system
        description: component of the ORIGINAL posting this REVERSAL negates; null on ORIGINAL rows
        default: null
        constraints: "FREIGHT_INBOUND | PROCESSING_LABOR | REFURB_REPACK | MARKDOWN_LOSS | PAYMENT_FEE_UNRECOVERED | VENDOR_CHARGEBACK_CREDIT"

  - name: FitFeedback
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> CatalogItem.id; the reviewed item
      - name: customer_profile_id
        type: string
        source: input
        description: FK -> CustomerProfile.id; the reviewer
      - name: purchased_size_label
        type: string
        source: input
        description: brand size label the reviewer bought
      - name: fit_verdict
        type: enum
        source: input
        description: reviewer's fit verdict shown on the product page
        constraints: "TOO_SMALL | SLIGHTLY_SMALL | TRUE_TO_SIZE | SLIGHTLY_LARGE | TOO_LARGE"
      - name: comment
        type: string
        source: input
        description: free-text review body
        default: null
      - name: verdict_offset_centi
        type: integer
        source: computed
        description: "size-step offset in hundredths: TOO_SMALL +100, SLIGHTLY_SMALL +50, TRUE_TO_SIZE 0, SLIGHTLY_LARGE -50, TOO_LARGE -100"
        default: 0
      - name: signal_weight
        type: integer
        source: computed
        description: 200 when the reviewer has an OrderLine on this item with status in {DELIVERED, RETURN_IN_PROGRESS, RETURNED, KEPT}, otherwise 100
        default: 100
      - name: status
        type: enum
        source: system
        description: ACTIVE rows contribute to the item's fit signal pool; RETRACTED rows contribute nothing
        default: ACTIVE
        constraints: "ACTIVE | RETRACTED"
      - name: retract_reason
        type: enum
        source: system
        description: why the feedback stopped counting; null while status == ACTIVE
        default: null
        constraints: "AUTHOR_WITHDRAWN | MODERATION_REMOVED"

  - name: ReturnPolicy
    parent: null
    common_fields: true
    fields:
      - name: scope
        type: enum
        source: system
        description: CATEGORY_DEFAULT when created through POST /fit-program/return-policies, CUSTOMER_OVERRIDE when created through the customer sub-resource
        constraints: "CATEGORY_DEFAULT | CUSTOMER_OVERRIDE"
      - name: customer_profile_id
        type: string
        source: input
        description: FK -> CustomerProfile.id; the customer this override applies to, null on every CATEGORY_DEFAULT row
        default: null
      - name: category_code
        type: enum
        source: input
        description: category the policy governs
        constraints: "TOPS | BOTTOMS | DRESSES | OUTERWEAR | FOOTWEAR"
      - name: window_days
        type: integer
        source: input
        description: base return window in days before policy_class adjustment
        constraints: ">= 1"
      - name: restocking_applies
        type: boolean
        source: input
        description: whether CHANGE_OF_MIND resolutions withhold a restocking fee
      - name: non_refundable_shipping
        type: boolean
        source: input
        description: whether the line's allocated shipping is withheld from the refund
      - name: effective_from
        type: datetime
        source: input
        description: first instant the policy row applies, inclusive
      - name: effective_to
        type: datetime
        source: input
        description: last instant the policy row applies, inclusive; null means open-ended
        default: null

  - name: Intervention
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: program name of the return-reduction lever
      - name: lever
        type: enum
        source: input
        description: the intervention mechanism; deployment windows are unique per (item, lever)
        constraints: "SIZE_CHART_STANDARDIZATION | PDP_MODEL_MEASUREMENTS | DETAIL_IMAGERY | FIT_RECOMMENDATION_BADGE | VENDOR_SPEC_CORRECTION"
      - name: unit_cost_cents
        type: integer
        source: input
        description: reference cost per deployment used for program reporting
        constraints: ">= 0"
      - name: deployment_count
        type: integer
        source: computed
        description: count of InterventionDeployment rows referencing this intervention
        default: 0
      - name: measured_deployment_count
        type: integer
        source: computed
        description: count of InterventionDeployment rows of this intervention with status MEASURED
        default: 0
      - name: gross_savings_cents
        type: integer
        source: computed
        description: sum of attributed_savings_cents over MEASURED deployments (deployment_attributed variant)
        default: 0
      - name: spend_cents
        type: integer
        source: computed
        description: sum of spend_cents over deployments with status in {TERMINATED, MEASURED}; spend is recognised when a deployment window closes, so SCHEDULED and ACTIVE deployments contribute nothing
        default: 0
      - name: net_savings_cents
        type: integer
        source: computed
        description: gross_savings_cents - spend_cents
        default: 0
      - name: funding_posture
        type: enum
        source: computed
        description: program funding standing derived from net_savings_cents; see calculations.intervention_savings
        default: FUNDED
        constraints: "FUNDED | UNDER_REVIEW | DEFUNDED"

  - name: InterventionDeployment
    parent: null
    common_fields: true
    fields:
      - name: intervention_id
        type: string
        source: input
        description: FK -> Intervention.id; the lever being deployed
      - name: item_id
        type: string
        source: input
        description: FK -> CatalogItem.id; the item the lever is deployed on
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the measurement window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the measurement window; rewritten to the logical clock when the deployment is terminated early
      - name: spend_cents
        type: integer
        source: input
        description: money actually spent on this deployment
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: measurement lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | TERMINATED | MEASURED"
      - name: baseline_units_count
        type: integer
        source: computed
        description: units delivered strictly before window_start, snapshotted when the deployment activates; null while SCHEDULED
        default: null
      - name: baseline_return_rate_bp
        type: integer
        source: computed
        description: pre-window fit-return rate snapshotted when the deployment activates; null while SCHEDULED
        default: null
      - name: window_units_count
        type: integer
        source: computed
        description: units delivered inside [window_start, window_end), computed when the deployment is measured; null before
        default: null
      - name: measured_return_rate_bp
        type: integer
        source: computed
        description: in-window fit-return rate computed when the deployment is measured; null before
        default: null
      - name: avoided_return_count
        type: integer
        source: computed
        description: whole returns avoided under the deployment_attributed variant; null before measurement
        default: null
      - name: attributed_savings_cents
        type: integer
        source: computed
        description: avoided_return_count * SAVED_COST_PER_AVOIDED_RETURN_CENTS[item.category_code]; null before measurement
        default: null
      - name: terminated_reason_code
        type: enum
        source: system
        description: why the window closed; null while status in {SCHEDULED, ACTIVE}
        default: null
        constraints: "WINDOW_ELAPSED | ITEM_DELISTED | MAPPING_SUPERSEDED | MANUAL_STOP"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: MeasurementSpec
    dimension: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fit-program/measurement-specs/{id}/submit"
        actor: VendorUser
        preconditions:
          - "spec.status == DRAFT"
          - "acting X-User-ID == CatalogItem.vendor_id of spec.item_id"
          - "CatalogItem.listing_status != DELISTED"
          - "Vendor.status != SUSPENDED"
          - "size_points has >= 2 entries and base_size_label appears among them"
        side_effects:
          - "spec.updated_at refreshed; spec.version + 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /fit-program/measurement-specs/{id}/verify (calculations.spec_grade_tolerance_verification returns violation_count == 0)"
        actor: FitAnalyst
        preconditions:
          - "spec.status == SUBMITTED"
          - "CatalogItem.listing_status != DELISTED"
        side_effects:
          - "spec.violation_count = 0; spec.first_violation_point = null; spec.first_violation_from_size_label = null; spec.tolerance_applied_mm rewritten"
          - "spec.verified_by_user_id = acting X-User-ID; spec.verified_at = logical clock"
          - "every other MeasurementSpec of the same item whose status == VERIFIED moves to SUPERSEDED"
      - from: SUBMITTED
        to: CORRECTION_REQUESTED
        trigger: "POST /fit-program/measurement-specs/{id}/verify (violation_count > 0 and spec.revision_round < MAX_CORRECTION_ROUNDS)"
        actor: FitAnalyst
        preconditions:
          - "spec.status == SUBMITTED"
          - "CatalogItem.listing_status != DELISTED"
        side_effects:
          - "spec.violation_count, spec.first_violation_point, spec.first_violation_from_size_label, spec.tolerance_applied_mm written from the verification run"
          - "spec.correction_reason = GRADE_TOLERANCE_VIOLATION"
          - "Vendor.correction_round_count + 1 and Vendor.correction_spend_cents + CORRECTION_COST_CENTS (the debit is applied even when it pushes spend past correction_budget_cents)"
          - "Vendor.reliability_score_bp recomputed by calculations.vendor_reliability_score, then Vendor.status re-derived from it"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fit-program/measurement-specs/{id}/verify (violation_count > 0 and spec.revision_round >= MAX_CORRECTION_ROUNDS)"
        actor: FitAnalyst
        preconditions:
          - "spec.status == SUBMITTED"
          - "spec.revision_round >= MAX_CORRECTION_ROUNDS"
        side_effects:
          - "spec.violation_count and first-violation fields written from the verification run"
          - "no vendor debit: the correction allowance for this specification is exhausted"
          - "CatalogItem.fit_readiness moves to UNVERIFIED when it is CHART_MAPPED or GUIDANCE_READY"
      - from: CORRECTION_REQUESTED
        to: SUBMITTED
        trigger: "POST /fit-program/measurement-specs/{id}/resubmit"
        actor: VendorUser
        preconditions:
          - "spec.status == CORRECTION_REQUESTED"
          - "acting X-User-ID == CatalogItem.vendor_id of spec.item_id"
          - "CatalogItem.listing_status != DELISTED"
          - "Vendor.correction_spend_cents <= Vendor.correction_budget_cents"
        side_effects:
          - "spec.size_points replaced by the request body; spec.grade_rules replaced when supplied"
          - "spec.revision_round + 1; spec.correction_reason = null"
        note: "the cycle CORRECTION_REQUESTED -> SUBMITTED -> CORRECTION_REQUESTED may run at most MAX_CORRECTION_ROUNDS times before verify lands on REJECTED"
      - from: VERIFIED
        to: CORRECTION_REQUESTED
        trigger: "system: CatalogItem.fit_watch_state flips to CHRONIC (calculations.item_chronic_return_score)"
        actor: system
        preconditions:
          - "spec.status == VERIFIED"
          - "spec is the item's only VERIFIED specification"
        side_effects:
          - "spec.correction_reason = CHRONIC_FIT_RETURNS"
          - "Vendor.correction_round_count + 1 and Vendor.correction_spend_cents + CORRECTION_COST_CENTS"
          - "Vendor.reliability_score_bp recomputed, then Vendor.status re-derived"
        note: "reopening a VERIFIED specification is what makes this machine cyclic rather than a one-way pipeline"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system: a newer MeasurementSpec of the same item is VERIFIED"
        actor: system
        preconditions:
          - "spec.status == VERIFIED"
        side_effects:
          - "spec.updated_at refreshed; spec.version + 1"

  - entity: CatalogItem
    dimension: listing_status
    shape: parallel
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /fit-program/catalog-items/{id}/list"
        actor: MerchOpsAdmin
        preconditions:
          - "item.listing_status == DRAFT"
        side_effects:
          - "item.version + 1; fit_readiness is untouched (the two axes advance on different triggers)"
      - from: SUSPENDED
        to: LISTED
        trigger: "POST /fit-program/catalog-items/{id}/publish-guidance (re-publication after a correction cycle)"
        actor: FitAnalyst
        preconditions:
          - "item.listing_status == SUSPENDED"
          - "item.fit_watch_state != CHRONIC"
          - "every precondition of the fit_readiness CHART_MAPPED -> GUIDANCE_READY transition holds"
        side_effects:
          - "item.listing_status = LISTED"
      - from: LISTED
        to: SUSPENDED
        trigger: "system: item.fit_watch_state flips to CHRONIC"
        actor: system
        preconditions:
          - "item.listing_status == LISTED"
        side_effects:
          - "item.version + 1"
      - from: DRAFT
        to: DELISTED
        trigger: "POST /fit-program/catalog-items/{id}/delist"
        actor: MerchOpsAdmin
        preconditions:
          - "item.listing_status in {DRAFT, LISTED, SUSPENDED}"
        side_effects:
          - "item.delist_reason_code = request delist_reason_code"
      - from: LISTED
        to: DELISTED
        trigger: "POST /fit-program/catalog-items/{id}/delist"
        actor: MerchOpsAdmin
        preconditions:
          - "item.listing_status in {DRAFT, LISTED, SUSPENDED}"
        side_effects:
          - "item.delist_reason_code = request delist_reason_code"
          - "every InterventionDeployment of this item with status in {SCHEDULED, ACTIVE} moves to TERMINATED with terminated_reason_code ITEM_DELISTED and window_end rewritten to the logical clock when the clock is earlier than window_end"
          - "each such termination makes its Intervention.spend_cents / gross_savings_cents / net_savings_cents / funding_posture recompute"
      - from: SUSPENDED
        to: DELISTED
        trigger: "POST /fit-program/catalog-items/{id}/delist"
        actor: MerchOpsAdmin
        preconditions:
          - "item.listing_status in {DRAFT, LISTED, SUSPENDED}"
        side_effects:
          - "item.delist_reason_code = request delist_reason_code"
          - "every InterventionDeployment of this item with status in {SCHEDULED, ACTIVE} moves to TERMINATED with terminated_reason_code ITEM_DELISTED"

  - entity: CatalogItem
    dimension: fit_readiness
    shape: parallel
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: CHART_MAPPED
        trigger: "system: POST /fit-program/size-chart-mappings creates an ACTIVE mapping for the item"
        actor: system
        preconditions:
          - "the item has exactly one MeasurementSpec with status VERIFIED"
          - "SizeChart.status == STANDARDIZED"
        side_effects:
          - "any prior ACTIVE SizeChartMapping of the item moves to SUPERSEDED with superseded_reason NEW_MAPPING"
          - "item.version + 1; listing_status is untouched"
        note: "when the item is already CHART_MAPPED the axis stays CHART_MAPPED; a further mapping is accepted and only supersedes the prior one"
      - from: GUIDANCE_READY
        to: CHART_MAPPED
        trigger: "system: POST /fit-program/size-chart-mappings creates a replacement ACTIVE mapping for the item"
        actor: system
        preconditions:
          - "item.fit_readiness == GUIDANCE_READY"
          - "the item has exactly one MeasurementSpec with status VERIFIED"
          - "SizeChart.status == STANDARDIZED"
        side_effects:
          - "prior ACTIVE SizeChartMapping -> SUPERSEDED with superseded_reason NEW_MAPPING"
          - "fit guidance stops being servable until publish-guidance is called again"
      - from: CHART_MAPPED
        to: GUIDANCE_READY
        trigger: "POST /fit-program/catalog-items/{id}/publish-guidance"
        actor: FitAnalyst
        preconditions:
          - "item.fit_readiness == CHART_MAPPED"
          - "the item's only VERIFIED MeasurementSpec exists and its status is VERIFIED"
          - "the item's ACTIVE SizeChartMapping exists and its SizeChart.status == STANDARDIZED"
          - "ACTIVE mapping coverage_bp >= MIN_COVERAGE_BP"
          - "item.model_measurements_published == true and item.detail_image_count >= MIN_DETAIL_IMAGE_COUNT"
        side_effects:
          - "fit recommendations become servable for this item"
      - from: GUIDANCE_READY
        to: UNVERIFIED
        trigger: "system: item.fit_watch_state flips to CHRONIC, or the item's ACTIVE mapping moves to SUPERSEDED with superseded_reason CHART_RETIRED"
        actor: system
        preconditions:
          - "item.fit_readiness == GUIDANCE_READY"
        side_effects:
          - "GET /fit-program/catalog-items/{id}/fit-recommendation now fails with ERR_GUIDANCE_NOT_READY"
          - "every InterventionDeployment of this item with status ACTIVE whose Intervention.lever is in {FIT_RECOMMENDATION_BADGE, SIZE_CHART_STANDARDIZATION} moves to TERMINATED with terminated_reason_code MAPPING_SUPERSEDED, window_end rewritten to the logical clock"
      - from: CHART_MAPPED
        to: UNVERIFIED
        trigger: "system: the item's ACTIVE mapping moves to SUPERSEDED with superseded_reason CHART_RETIRED, or the item's VERIFIED specification is reopened to CORRECTION_REQUESTED"
        actor: system
        preconditions:
          - "item.fit_readiness == CHART_MAPPED"
        side_effects:
          - "item.version + 1"

  - entity: ReturnCase
    dimension: status
    shape: branching_fork_join
    initial_state: TRIAGE
    terminal_states: [VOIDED]
    transitions:
      - from: TRIAGE
        to: FIT_REVIEW
        trigger: "POST /fit-program/return-cases/{id}/classify with reason_code in {FIT_TOO_SMALL, FIT_TOO_LARGE}"
        actor: ReturnsAuditor
        preconditions:
          - "case.status == TRIAGE"
        side_effects:
          - "case.reason_code and case.reason_family rewritten; case.classified_by_user_id = acting X-User-ID"
      - from: TRIAGE
        to: QUALITY_REVIEW
        trigger: "POST /fit-program/return-cases/{id}/classify with reason_code QUALITY_DEFECT"
        actor: ReturnsAuditor
        preconditions:
          - "case.status == TRIAGE"
        side_effects:
          - "case.reason_code = QUALITY_DEFECT; case.reason_family = QUALITY; case.classified_by_user_id = acting X-User-ID"
      - from: TRIAGE
        to: EXPECTATION_REVIEW
        trigger: "POST /fit-program/return-cases/{id}/classify with reason_code EXPECTATION_MISMATCH"
        actor: ReturnsAuditor
        preconditions:
          - "case.status == TRIAGE"
        side_effects:
          - "case.reason_code = EXPECTATION_MISMATCH; case.reason_family = EXPECTATION; case.classified_by_user_id = acting X-User-ID"
      - from: TRIAGE
        to: COOLING_OFF
        trigger: "POST /fit-program/return-cases/{id}/classify with reason_code CHANGE_OF_MIND"
        actor: ReturnsAuditor
        preconditions:
          - "case.status == TRIAGE"
        side_effects:
          - "case.reason_code = CHANGE_OF_MIND; case.reason_family = CHANGE_OF_MIND; case.classified_by_user_id = acting X-User-ID"
      - from: FIT_REVIEW
        to: RESOLVED_REFUNDED
        trigger: "POST /fit-program/return-cases/{id}/resolve"
        actor: ReturnsAuditor
        preconditions:
          - "case.status in {FIT_REVIEW, QUALITY_REVIEW, EXPECTATION_REVIEW, COOLING_OFF}"
          - "acting X-User-ID != case.classified_by_user_id"
          - "CustomerProfile.abuse_status of the purchaser != BLOCKED"
        side_effects:
          - "calculations.return_refund_and_restocking_fee writes restocking_fee_cents (0 for the FIT branch) and refund_amount_cents"
          - "calculations.return_case_cost_postings writes ORIGINAL ReturnCostPosting rows and case.total_cost_cents"
          - "OrderLine.status = RETURNED; CustomerProfile.refunded_total_cents + refund_amount_cents"
          - "CatalogItem.fit_return_count + 1, total_return_count + 1, return_cost_accrued_cents + total_cost_cents, rates and chronic_return_score_bp recomputed"
          - "the recomputed score re-derives CatalogItem.fit_watch_state, which — on a flip to CHRONIC — drives the listing_status LISTED -> SUSPENDED, fit_readiness -> UNVERIFIED and MeasurementSpec VERIFIED -> CORRECTION_REQUESTED transitions, whose own side effects then debit the Vendor"
      - from: QUALITY_REVIEW
        to: RESOLVED_REFUNDED
        trigger: "POST /fit-program/return-cases/{id}/resolve"
        actor: ReturnsAuditor
        preconditions:
          - "case.status in {FIT_REVIEW, QUALITY_REVIEW, EXPECTATION_REVIEW, COOLING_OFF}"
          - "acting X-User-ID != case.classified_by_user_id"
          - "CustomerProfile.abuse_status of the purchaser != BLOCKED"
        side_effects:
          - "refund and cost postings written, including a negative VENDOR_CHARGEBACK_CREDIT posting"
          - "OrderLine.status = RETURNED; CatalogItem.total_return_count + 1; fit_return_count untouched"
          - "Vendor.quality_chargeback_count + 1, then Vendor.reliability_score_bp and Vendor.status re-derived"
      - from: EXPECTATION_REVIEW
        to: RESOLVED_REFUNDED
        trigger: "POST /fit-program/return-cases/{id}/resolve"
        actor: ReturnsAuditor
        preconditions:
          - "case.status in {FIT_REVIEW, QUALITY_REVIEW, EXPECTATION_REVIEW, COOLING_OFF}"
          - "acting X-User-ID != case.classified_by_user_id"
          - "CustomerProfile.abuse_status of the purchaser != BLOCKED"
        side_effects:
          - "refund and cost postings written; no restocking fee, no chargeback"
          - "OrderLine.status = RETURNED; CatalogItem.expectation_return_count + 1, total_return_count + 1, pdp_review_required = true"
          - "chronic_return_score_bp recomputed (EXPECTATION_WEIGHT_BP share) and fit_watch_state re-derived"
      - from: COOLING_OFF
        to: RESOLVED_REFUNDED
        trigger: "POST /fit-program/return-cases/{id}/resolve"
        actor: ReturnsAuditor
        preconditions:
          - "case.status in {FIT_REVIEW, QUALITY_REVIEW, EXPECTATION_REVIEW, COOLING_OFF}"
          - "acting X-User-ID != case.classified_by_user_id"
          - "CustomerProfile.abuse_status of the purchaser != BLOCKED"
        side_effects:
          - "restocking fee withheld per calculations.return_refund_and_restocking_fee (abuse multiplier applies when abuse_status == RESTRICTED)"
          - "OrderLine.status = RETURNED; CatalogItem.total_return_count + 1; item fit and expectation counters untouched"
          - "CustomerProfile.change_of_mind_count + 1, abuse_strike_count recomputed, abuse_status and policy_class re-derived"
      - from: FIT_REVIEW
        to: RESOLVED_DENIED
        trigger: "POST /fit-program/return-cases/{id}/resolve while the purchaser's abuse_status == BLOCKED"
        actor: ReturnsAuditor
        preconditions:
          - "case.status in {FIT_REVIEW, QUALITY_REVIEW, EXPECTATION_REVIEW, COOLING_OFF}"
          - "acting X-User-ID != case.classified_by_user_id"
          - "CustomerProfile.abuse_status of the purchaser == BLOCKED"
        side_effects:
          - "refund_amount_cents = 0; restocking_fee_cents = 0"
          - "only FREIGHT_INBOUND and PROCESSING_LABOR ORIGINAL postings are written"
          - "OrderLine.status = KEPT; item counters for the case's reason_family still advance"
      - from: COOLING_OFF
        to: RESOLVED_DENIED
        trigger: "POST /fit-program/return-cases/{id}/resolve while the purchaser's abuse_status == BLOCKED"
        actor: ReturnsAuditor
        preconditions:
          - "case.status in {FIT_REVIEW, QUALITY_REVIEW, EXPECTATION_REVIEW, COOLING_OFF}"
          - "acting X-User-ID != case.classified_by_user_id"
          - "CustomerProfile.abuse_status of the purchaser == BLOCKED"
        side_effects:
          - "refund_amount_cents = 0; no abuse strike is recorded because change_of_mind_count only counts RESOLVED_REFUNDED cases"
          - "OrderLine.status = KEPT"
      - from: RESOLVED_REFUNDED
        to: VOIDED
        trigger: "POST /fit-program/return-cases/{id}/void"
        actor: ReturnsAuditor
        preconditions:
          - "case.status in {RESOLVED_REFUNDED, RESOLVED_DENIED}"
        side_effects:
          - "one REVERSAL ReturnCostPosting is written per ORIGINAL posting with amount_cents negated and reversed_component set"
          - "case.void_reason set; case.refund_amount_cents and case.restocking_fee_cents keep their historical values, case.total_cost_cents = 0"
          - "OrderLine.status = DELIVERED; CustomerProfile.refunded_total_cents - the case's refund_amount_cents; return_case_count, change_of_mind_count, abuse_strike_count, abuse_status and policy_class recomputed"
          - "CatalogItem.return_cost_accrued_cents, fit_return_count, expectation_return_count, total_return_count, rates, chronic_return_score_bp and fit_watch_state recomputed"
          - "Vendor.quality_chargeback_count decremented for a QUALITY case, then reliability_score_bp and status re-derived"
        note: "voiding never rolls back MeasurementSpec or listing_status transitions that already fired; only derived aggregates are restored"
      - from: RESOLVED_DENIED
        to: VOIDED
        trigger: "POST /fit-program/return-cases/{id}/void"
        actor: ReturnsAuditor
        preconditions:
          - "case.status in {RESOLVED_REFUNDED, RESOLVED_DENIED}"
        side_effects:
          - "REVERSAL postings written for the two ORIGINAL postings; item and customer aggregates recomputed"
          - "OrderLine.status = DELIVERED"

  - entity: CustomerProfile
    dimension: abuse_status
    shape: cyclic
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: WATCH
        trigger: "system: abuse_strike_count recomputed to >= ABUSE_WATCH_STRIKES after a COOLING_OFF resolve, a void, or an ops-run"
        actor: system
        preconditions:
          - "abuse_strike_count >= ABUSE_WATCH_STRIKES and < ABUSE_RESTRICTED_STRIKES"
        side_effects:
          - "policy_class re-derived (WATCH keeps STANDARD_WINDOW / EXTENDED_WINDOW)"
      - from: WATCH
        to: RESTRICTED
        trigger: "system: abuse_strike_count recomputed to >= ABUSE_RESTRICTED_STRIKES"
        actor: system
        preconditions:
          - "abuse_strike_count >= ABUSE_RESTRICTED_STRIKES and < ABUSE_BLOCKED_STRIKES"
        side_effects:
          - "policy_class = RESTRICTED_WINDOW, shortening every future effective_window_days"
          - "future CHANGE_OF_MIND resolutions apply ABUSE_FEE_MULTIPLIER_BP to the restocking fee"
      - from: RESTRICTED
        to: BLOCKED
        trigger: "system: abuse_strike_count recomputed to >= ABUSE_BLOCKED_STRIKES, or return_rate_bp >= ABUSE_RATE_BLOCK_BP with purchase_line_count >= ABUSE_RATE_MIN_LINES"
        actor: system
        preconditions:
          - "abuse_strike_count >= ABUSE_BLOCKED_STRIKES or (return_rate_bp >= ABUSE_RATE_BLOCK_BP and purchase_line_count >= ABUSE_RATE_MIN_LINES)"
        side_effects:
          - "POST /fit-program/return-cases by this customer is rejected with ERR_CUSTOMER_RETURN_BLOCKED"
          - "resolve on this customer's already-open cases lands on RESOLVED_DENIED instead of RESOLVED_REFUNDED"
      - from: CLEAR
        to: BLOCKED
        trigger: "system: return_rate_bp recomputed to >= ABUSE_RATE_BLOCK_BP with purchase_line_count >= ABUSE_RATE_MIN_LINES after a return-case creation, a resolve, a void or an ops-run"
        actor: system
        preconditions:
          - "return_rate_bp >= ABUSE_RATE_BLOCK_BP and purchase_line_count >= ABUSE_RATE_MIN_LINES"
          - "abuse_strike_count < ABUSE_WATCH_STRIKES"
        side_effects:
          - "policy_class = RESTRICTED_WINDOW"
          - "POST /fit-program/return-cases by this customer is rejected with ERR_CUSTOMER_RETURN_BLOCKED"
          - "resolve on this customer's already-open cases lands on RESOLVED_DENIED instead of RESOLVED_REFUNDED"
        note: "the rate rule can block a customer who never earned a CHANGE_OF_MIND strike, so this axis is not a strict ladder"
      - from: BLOCKED
        to: CLEAR
        trigger: "system: return_rate_bp falls back below ABUSE_RATE_BLOCK_BP because a void removed a case, or an ops-run aged every strike out"
        actor: system
        preconditions:
          - "not (return_rate_bp >= ABUSE_RATE_BLOCK_BP and purchase_line_count >= ABUSE_RATE_MIN_LINES)"
          - "abuse_strike_count < ABUSE_WATCH_STRIKES"
        side_effects:
          - "policy_class re-derived; return creation is accepted again"
      - from: BLOCKED
        to: RESTRICTED
        trigger: "system: strikes age out of the trailing ABUSE_WINDOW_DAYS window during POST /fit-program/ops-runs, or a void removes a strike"
        actor: system
        preconditions:
          - "abuse_strike_count < ABUSE_BLOCKED_STRIKES and >= ABUSE_RESTRICTED_STRIKES"
          - "not (return_rate_bp >= ABUSE_RATE_BLOCK_BP and purchase_line_count >= ABUSE_RATE_MIN_LINES)"
        side_effects:
          - "policy_class re-derived; return creation is accepted again"
      - from: RESTRICTED
        to: WATCH
        trigger: "system: strikes age out during POST /fit-program/ops-runs, or a void removes a strike"
        actor: system
        preconditions:
          - "abuse_strike_count < ABUSE_RESTRICTED_STRIKES and >= ABUSE_WATCH_STRIKES"
        side_effects:
          - "policy_class re-derived"
      - from: WATCH
        to: CLEAR
        trigger: "system: strikes age out during POST /fit-program/ops-runs, or a void removes a strike"
        actor: system
        preconditions:
          - "abuse_strike_count < ABUSE_WATCH_STRIKES"
        side_effects:
          - "policy_class re-derived"

  - entity: SizeChart
    dimension: status
    shape: linear
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: STANDARDIZED
        trigger: "POST /fit-program/size-charts/{id}/standardize"
        actor: MerchOpsAdmin
        preconditions:
          - "chart.status == DRAFT"
          - "rows sort_index values are contiguous from 0 and body_chest ranges are strictly increasing and non-overlapping across consecutive sort_index values"
          - "every row carries non-empty conversion_us_alpha, conversion_us_numeric, conversion_eu and conversion_uk"
        side_effects:
          - "chart.row_count and chart.median_row_index written"
      - from: STANDARDIZED
        to: RETIRED
        trigger: "POST /fit-program/size-charts/{id}/retire"
        actor: MerchOpsAdmin
        preconditions:
          - "chart.status == STANDARDIZED"
        side_effects:
          - "chart.retire_reason_code set"
          - "every SizeChartMapping of this chart with status ACTIVE moves to SUPERSEDED with superseded_reason CHART_RETIRED"
          - "each such supersession drives its item's fit_readiness transition to UNVERIFIED, whose own side effect terminates that item's ACTIVE badge/chart deployments with MAPPING_SUPERSEDED, whose own side effect recomputes the owning Intervention's savings fields and funding_posture"

  - entity: FitFeedback
    dimension: status
    shape: linear
    initial_state: ACTIVE
    terminal_states: [RETRACTED]
    transitions:
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /fit-program/fit-feedback/{id}/retract"
        actor: Customer
        preconditions:
          - "feedback.status == ACTIVE, otherwise ERR_FEEDBACK_ALREADY_RETRACTED"
          - "the acting X-User-ID equals feedback.customer_profile_id, otherwise ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "retract_reason stored"
          - "CatalogItem.fit_signal_weight_total decreases by exactly this row's signal_weight and active_fit_feedback_count decreases by 1"
          - "the row stops contributing to every calculations.fit_recommendation signal pool"

  - entity: InterventionDeployment
    dimension: status
    shape: linear
    initial_state: SCHEDULED
    terminal_states: [MEASURED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: POST /fit-program/ops-runs while logical clock >= window_start"
        actor: system
        preconditions:
          - "deployment.status == SCHEDULED"
          - "logical clock >= deployment.window_start"
          - "CatalogItem.listing_status == LISTED"
        side_effects:
          - "baseline_units_count and baseline_return_rate_bp snapshotted by calculations.deployment_window_rates"
          - "Intervention.spend_cents is NOT affected: an ACTIVE deployment's spend is not yet recognised"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: POST /fit-program/ops-runs while logical clock >= window_end; or POST /fit-program/intervention-deployments/{id}/terminate; or a cascade from item delisting or mapping supersession"
        actor: system
        preconditions:
          - "deployment.status == ACTIVE"
        side_effects:
          - "terminated_reason_code set to WINDOW_ELAPSED (ops-run), MANUAL_STOP (terminate endpoint), ITEM_DELISTED or MAPPING_SUPERSEDED (cascades)"
          - "window_end rewritten to the logical clock when the clock is earlier than window_end"
          - "Intervention.spend_cents now recognises this deployment's spend, then net_savings_cents and funding_posture are re-derived"
      - from: TERMINATED
        to: MEASURED
        trigger: "system: POST /fit-program/ops-runs on a later run than the one that terminated the deployment"
        actor: system
        preconditions:
          - "deployment.status == TERMINATED"
        side_effects:
          - "window_units_count, measured_return_rate_bp, avoided_return_count and attributed_savings_cents written by calculations.deployment_window_rates"
          - "Intervention.measured_deployment_count, gross_savings_cents, spend_cents, net_savings_cents and funding_posture recomputed"
        note: "one ops-run advances a deployment by at most one hop, so ACTIVE -> MEASURED needs two ops-runs"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: mapping-create-stale-item
    parent_entity: CatalogItem
    write_endpoint: "POST /fit-program/size-chart-mappings"
    occ_field: "expected_item_version"
    description: |
      Creating a SizeChartMapping against a CatalogItem whose version has advanced past the
      value the client last observed is rejected. A mapping create legitimately supersedes the
      item's prior ACTIVE mapping and rewrites fit_readiness, so a writer holding a stale view
      of the item would silently discard a mapping decision it never saw; the stale-version
      check turns that into an explicit failure.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

  - rule_id: override-create-stale-customer-profile
    parent_entity: CustomerProfile
    write_endpoint: "POST /fit-program/customer-profiles/{id}/return-policy-overrides"
    occ_field: "expected_customer_profile_version"
    description: |
      Creating a CUSTOMER_OVERRIDE ReturnPolicy against a CustomerProfile whose version has
      advanced past the value the client last observed is rejected. Overrides are written on
      the strength of the profile's abuse_status and policy_class, both of which move whenever
      a return resolves, so an override built on a stale profile view is refused rather than
      applied.
    error_id: ERR_STALE_CUSTOMER_PROFILE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: spec_grade_tolerance_verification
    trigger: "POST /fit-program/measurement-specs/{id}/verify"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is fixed: rules are walked in MEASUREMENT_POINT_ORDER, and within a
      # rule the size_points are walked by sort_index ASC (tie-break impossible: sort_index is
      # unique). No random field participates.
      violations = []
      tolerance_applied_mm = []
      for point in MEASUREMENT_POINT_ORDER:                 # CHEST, WAIST, HIP, INSEAM
          rule = grade_rules entry with measurement_point == point   # skip when absent
          # tolerance resolution: max -> ceiling cap -> stretch multiplier -> floor
          pct_component = round_half_up(rule.tolerance_pct_bp * rule.increment_mm / 10000)
          raw_tol_mm    = max(rule.tolerance_abs_mm, pct_component)
          capped_tol_mm = min(raw_tol_mm, TOLERANCE_CEILING_MM[point])
          tol_mm        = floor(capped_tol_mm * STRETCH_MULTIPLIER_PCT[spec.fabric_stretch_class] / 100)
          tolerance_applied_mm.append({measurement_point: point, tolerance_mm: tol_mm})
          points = spec.size_points sorted by sort_index ASC
          for n in 0 .. len(points) - 2:
              delta = points[n+1].<point>_mm - points[n].<point>_mm
              if abs(delta - rule.increment_mm) > tol_mm:      # strict >: equality PASSES
                  violations.append({point: point, from_size_label: points[n].size_label})
      violation_count = len(violations)
      first_violation_point           = violations[0].point            if violations else null
      first_violation_from_size_label = violations[0].from_size_label  if violations else null
      # outcome: 0 violations -> VERIFIED; otherwise CORRECTION_REQUESTED, unless
      # spec.revision_round >= MAX_CORRECTION_ROUNDS, in which case REJECTED.
    input_set: |
      Exactly the size_points and grade_rules stored on the specification under verification
      (status SUBMITTED). Specifications in DRAFT, VERIFIED, CORRECTION_REQUESTED, REJECTED or
      SUPERSEDED are never re-verified, and no sibling specification of the same item is read.
    constants:
      MEASUREMENT_POINT_ORDER: [CHEST, WAIST, HIP, INSEAM]
      TOLERANCE_CEILING_MM: { CHEST: 25, WAIST: 25, HIP: 25, INSEAM: 20 }
      STRETCH_MULTIPLIER_PCT: { RIGID: 100, STRETCH: 150, HIGH_STRETCH: 200 }
      MAX_CORRECTION_ROUNDS: 3
      CORRECTION_COST_CENTS: 2500
    precision: "all values are whole millimetres; pct_component uses round_half_up, the stretch step uses floor"

  - name: mapping_coverage
    trigger: "POST /fit-program/size-chart-mappings"
    algorithm: aggregation
    formula: |
      spec = the item's MeasurementSpec with status == VERIFIED
      spec_size_point_count = len(spec.size_points)
      mapped_row_count      = len(size_label_pairs)
      coverage_bp = 0 if spec_size_point_count == 0
                    else floor(mapped_row_count * 10000 / spec_size_point_count)
      unmapped_size_labels = [p.size_label for p in spec.size_points sorted by sort_index ASC
                              if p.size_label not in {pair.spec_size_label}]
    input_set: |
      Only the single VERIFIED MeasurementSpec of the item and the pairs in the request body.
      Every pair.spec_size_label MUST exist in spec.size_points and every pair.chart_size_label
      MUST exist in chart.rows, otherwise ERR_SIZE_LABEL_NOT_IN_SPEC is raised and nothing is
      written.
    constants:
      MIN_COVERAGE_BP: 8000
    precision: "integer basis points, floor"

  - name: return_refund_and_restocking_fee
    trigger: "POST /fit-program/return-cases/{id}/resolve, before any cost posting is written"
    algorithm: tiered_pricing
    formula: |
      # The fee tier is keyed on gross_line_cents, NEVER on refund_amount_cents, even though
      # the fee is deducted from the refund. This pins the otherwise circular pair
      # (refund = gross - fee) and (fee = pct(tier(amount))): the tier is read off the
      # pre-fee gross, so the value is well defined in one pass.
      gross = order_line.gross_line_cents                       # unit_price_cents * quantity
      tier_bp = 0     if gross <  RESTOCK_TIER_1_CENTS
                1000  if RESTOCK_TIER_1_CENTS <= gross < RESTOCK_TIER_2_CENTS
                1500  if gross >= RESTOCK_TIER_2_CENTS
      base_fee_cents = round_half_up(tier_bp * gross / 10000)
      if case.reason_family == CHANGE_OF_MIND
         and case.effective_policy.restocking_applies == true
         and case resolves to RESOLVED_REFUNDED:
          multiplier_bp = ABUSE_FEE_MULTIPLIER_BP if purchaser.abuse_status == RESTRICTED else 10000
          restocking_fee_cents = round_half_up(base_fee_cents * multiplier_bp / 10000)
      else:
          restocking_fee_cents = 0
      withheld_shipping = order_line.shipping_allocated_cents
                          if case.effective_policy.non_refundable_shipping else 0
      refund_amount_cents = max(0, gross - restocking_fee_cents - withheld_shipping)
      # RESOLVED_DENIED short-circuits: restocking_fee_cents = 0 and refund_amount_cents = 0.
    input_set: |
      One OrderLine, the ReturnPolicy row pinned on the case as effective_policy_id at creation
      time (never re-resolved at resolve time), and the purchaser's abuse_status as of the
      resolve call.
    constants:
      RESTOCK_TIER_1_CENTS: 5000
      RESTOCK_TIER_2_CENTS: 20000
      ABUSE_FEE_MULTIPLIER_BP: 15000
    precision: "cents, round_half_up at each of the two fee steps (tier fee, then abuse multiplier)"

  - name: return_case_cost_postings
    trigger: "POST /fit-program/return-cases/{id}/resolve, after the refund is known"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: every component is rounded to whole cents on its own and the
      # rounded components are then summed. Summing the exact fractional component values and
      # rounding once at the end is WRONG and produces a different total.
      gross  = order_line.gross_line_cents
      refund = case.refund_amount_cents
      components = ordered list, written in this order:
        FREIGHT_INBOUND         = FREIGHT_INBOUND_CENTS[item.category_code]
        PROCESSING_LABOR        = round_half_up(LABOR_RATE_CENTS_PER_MIN * HANDLING_MINUTES[case.reason_family])
        REFURB_REPACK           = round_half_up(REFURB_PCT_BP[case.item_condition]   * gross / 10000)
        MARKDOWN_LOSS           = round_half_up(MARKDOWN_PCT_BP[case.item_condition] * gross / 10000)
        PAYMENT_FEE_UNRECOVERED = round_half_up(PAYMENT_FEE_BP * refund / 10000)
        VENDOR_CHARGEBACK_CREDIT= -round_half_up(VENDOR_CHARGEBACK_PCT_BP * gross / 10000)   # QUALITY family only
      if case resolves to RESOLVED_DENIED:
          components = [FREIGHT_INBOUND, PROCESSING_LABOR] only
      one ORIGINAL ReturnCostPosting row is written per component, in the order above
      case.total_cost_cents = sum(amount_cents of the ORIGINAL rows just written)
      item.return_cost_accrued_cents = sum(amount_cents over EVERY posting, ORIGINAL and
                                           REVERSAL, of every ReturnCase of that item)
    input_set: |
      The single case being resolved plus its OrderLine and CatalogItem. Cases in TRIAGE or in a
      review state contribute nothing to item.return_cost_accrued_cents; VOIDED cases contribute
      exactly zero because each ORIGINAL row is matched by a REVERSAL row.
    constants:
      FREIGHT_INBOUND_CENTS: { TOPS: 795, BOTTOMS: 895, DRESSES: 995, OUTERWEAR: 1495, FOOTWEAR: 1295 }
      LABOR_RATE_CENTS_PER_MIN: 62
      HANDLING_MINUTES: { FIT: 9, QUALITY: 17, EXPECTATION: 11, CHANGE_OF_MIND: 7 }
      REFURB_PCT_BP: { RESELLABLE_A: 150, RESELLABLE_B: 400, SALVAGE: 0 }
      MARKDOWN_PCT_BP: { RESELLABLE_A: 0, RESELLABLE_B: 1200, SALVAGE: 6500 }
      PAYMENT_FEE_BP: 290
      VENDOR_CHARGEBACK_PCT_BP: 4000
    precision: "cents; round_half_up per component, then integer sum — never sum-then-round"

  - name: item_chronic_return_score
    trigger: "every ReturnCase resolve, every ReturnCase void, every OrderLine creation, and every POST /fit-program/ops-runs"
    algorithm: weighted_scoring
    formula: |
      units = sum(OrderLine.quantity) over lines of the item whose status is in
              {DELIVERED, RETURN_IN_PROGRESS, RETURNED, KEPT}
      fit_return_rate_bp         = 0 if units == 0 else floor(fit_return_count * 10000 / units)
      expectation_return_rate_bp = 0 if units == 0 else floor(expectation_return_count * 10000 / units)
      chronic_return_score_bp = floor((FIT_WEIGHT_BP * fit_return_rate_bp
                                       + EXPECTATION_WEIGHT_BP * expectation_return_rate_bp) / 10000)
      # re-derived in both directions on every recompute, so a void can walk the state back
      fit_watch_state =
          CHRONIC if chronic_return_score_bp >= CHRONIC_THRESHOLD_BP
                     and fit_return_count >= MIN_FIT_RETURNS_CHRONIC
          WATCH   if chronic_return_score_bp >= WATCH_THRESHOLD_BP
                     and fit_return_count >= MIN_FIT_RETURNS_WATCH
          NORMAL  otherwise
    input_set: |
      Counts read from ReturnCase rows of the item with status in {RESOLVED_REFUNDED,
      RESOLVED_DENIED} (VOIDED cases are excluded), and units from the item's OrderLine rows
      with status in {DELIVERED, RETURN_IN_PROGRESS, RETURNED, KEPT}. No time window: the score
      is lifetime-to-date.
    constants:
      FIT_WEIGHT_BP: 7500
      EXPECTATION_WEIGHT_BP: 2500
      WATCH_THRESHOLD_BP: 1500
      CHRONIC_THRESHOLD_BP: 2500
      MIN_FIT_RETURNS_WATCH: 1
      MIN_FIT_RETURNS_CHRONIC: 2
    precision: "integer basis points; floor at both the rate step and the weighted step; thresholds compared with >="

  - name: fit_recommendation
    trigger: "GET /fit-program/catalog-items/{id}/fit-recommendation"
    algorithm: weighted_scoring
    formula: |
      # shared skeleton; the variant only changes the signal pool, the anchor index and the
      # confidence cap.
      mapping = the item's SizeChartMapping with status == ACTIVE
      chart   = mapping's SizeChart (status must be STANDARDIZED)
      rows    = chart.rows sorted by sort_index ASC
      coverage_bp = mapping.coverage_bp
      weighted_offset_centi = 0 if sum(weights) == 0
                              else round_half_up(sum(offset_i * weight_i) / sum(weight_i))
      step_shift        = round_half_up(weighted_offset_centi / 100)     # half away from zero
      recommended_index = clamp(anchor_index + step_shift, 0, chart.row_count - 1)
      confidence_bp     = floor(confidence_cap_bp * coverage_bp / 10000)
      suppressed        = confidence_bp < CONFIDENCE_FLOOR_BP            # strict <: equality EMITS
      recommended_size_label = null if suppressed else rows[recommended_index].size_label
    input_set: |
      The item must have fit_readiness == GUIDANCE_READY, otherwise ERR_GUIDANCE_NOT_READY.
      Only FitFeedback rows with status ACTIVE and ReturnCase rows with status
      RESOLVED_REFUNDED enter any signal pool; RETRACTED feedback, TRIAGE/review cases,
      RESOLVED_DENIED cases and VOIDED cases are excluded.
    constants:
      PERSONAL_SAMPLE_FLOOR: 3
      CONFIDENCE_FLOOR_BP: 6000
      VERDICT_OFFSET_CENTI: { TOO_SMALL: 100, SLIGHTLY_SMALL: 50, TRUE_TO_SIZE: 0, SLIGHTLY_LARGE: -50, TOO_LARGE: -100 }
      FIT_RETURN_OFFSET_CENTI: { FIT_TOO_SMALL: 100, FIT_TOO_LARGE: -100 }
      FIT_RETURN_SIGNAL_WEIGHT: 200
    precision: "offsets in hundredths of a size step, round_half_up (away from zero for negatives); confidence in integer basis points, floor"
    variants:
      - name: history_weighted
        when: |
          The request carries customer_profile_id AND that customer's own signal pool has
          sample_count >= PERSONAL_SAMPLE_FLOOR. The pool is the union of (a) FitFeedback rows
          authored by the customer with status ACTIVE on items whose category_code equals the
          target item's category_code, contributing VERDICT_OFFSET_CENTI[fit_verdict] with
          weight signal_weight, and (b) ReturnCase rows with reason_family FIT and status
          RESOLVED_REFUNDED on that customer's OrderLine rows for items of the same
          category_code, contributing FIT_RETURN_OFFSET_CENTI[reason_code] with weight
          FIT_RETURN_SIGNAL_WEIGHT.
        difference: |
          anchor_index = sort_index of the chart row whose size_label equals the
          chart_size_label paired with the size_label of the customer's most recent OrderLine
          on an item of the same category_code (order by delivered_at DESC, tie-break
          created_at DESC); when no such line exists or its size_label has no pair in
          mapping.size_label_pairs, anchor_index = chart.median_row_index.
          confidence_cap_bp = min(9500, 4500 + 1000 * sample_count).
      - name: population_fallback
        when: |
          The request omits customer_profile_id, or the customer's own pool has
          sample_count < PERSONAL_SAMPLE_FLOOR. Signal pool = every FitFeedback row on THIS
          item with status ACTIVE (any author), contributing VERDICT_OFFSET_CENTI[fit_verdict]
          with weight signal_weight; sample_count is the size of that pool.
        difference: |
          anchor_index = chart.median_row_index always.
          confidence_cap_bp = min(8000, 2000 + 500 * sample_count).
          For identical stored data the two variants therefore return different
          confidence_bp values and can return different recommended_size_label values; the
          response echoes variant_applied so the divergence is observable.

  - name: customer_abuse_and_policy_class
    trigger: "every ReturnCase creation, resolve and void, and every POST /fit-program/ops-runs"
    algorithm: threshold
    formula: |
      return_rate_bp = 0 if purchase_line_count == 0
                       else floor(return_case_count * 10000 / purchase_line_count)
      abuse_strike_count = count of ReturnCase rows of this customer with
                             status == RESOLVED_REFUNDED
                             and reason_family == CHANGE_OF_MIND
                             and refund_amount_cents > 0
                             and requested_at > (clock_now - ABUSE_WINDOW_DAYS days)   # strict >
      abuse_status =
          BLOCKED    if abuse_strike_count >= ABUSE_BLOCKED_STRIKES
                        or (return_rate_bp >= ABUSE_RATE_BLOCK_BP
                            and purchase_line_count >= ABUSE_RATE_MIN_LINES)
          RESTRICTED if abuse_strike_count >= ABUSE_RESTRICTED_STRIKES
          WATCH      if abuse_strike_count >= ABUSE_WATCH_STRIKES
          CLEAR      otherwise
      policy_class =
          RESTRICTED_WINDOW if abuse_status in {RESTRICTED, BLOCKED}
          EXTENDED_WINDOW   if tier == PLUS and abuse_status == CLEAR
          STANDARD_WINDOW   otherwise
      effective_window_days = max(MIN_EFFECTIVE_WINDOW_DAYS,
                                  policy.window_days + POLICY_CLASS_DELTA_DAYS[policy_class])
    input_set: |
      All non-VOIDED ReturnCase rows of the customer for the counters; only RESOLVED_REFUNDED
      CHANGE_OF_MIND cases with a positive refund inside the trailing window for strikes.
    constants:
      ABUSE_WINDOW_DAYS: 180
      ABUSE_WATCH_STRIKES: 1
      ABUSE_RESTRICTED_STRIKES: 2
      ABUSE_BLOCKED_STRIKES: 3
      ABUSE_RATE_BLOCK_BP: 7000
      ABUSE_RATE_MIN_LINES: 4
      POLICY_CLASS_DELTA_DAYS: { STANDARD_WINDOW: 0, EXTENDED_WINDOW: 30, RESTRICTED_WINDOW: -15 }
      MIN_EFFECTIVE_WINDOW_DAYS: 7
    precision: "integer days and integer basis points; thresholds compared with >="

  - name: effective_return_policy_resolution
    trigger: "POST /fit-program/return-cases (the selected row is frozen on the case as effective_policy_id)"
    algorithm: threshold
    formula: |
      candidates = ReturnPolicy rows where
          category_code == item.category_code
          and effective_from <= clock_now
          and (effective_to is null or clock_now <= effective_to)      # closed on both ends
          and (scope == CATEGORY_DEFAULT
               or (scope == CUSTOMER_OVERRIDE
                   and customer_profile_id == order_line.customer_profile_id))
      ranking: scope CUSTOMER_OVERRIDE before scope CATEGORY_DEFAULT;
               within one scope, effective_from DESC;
               tie-break created_at DESC (never id)
      winner = first candidate under that ranking
      if candidates is empty -> ERR_NO_RETURN_POLICY (422) and no case is created
      case.effective_policy_id   = winner.id
      case.effective_window_days = max(MIN_EFFECTIVE_WINDOW_DAYS,
                                       winner.window_days + POLICY_CLASS_DELTA_DAYS[purchaser.policy_class])
      case.return_deadline_at    = order_line.delivered_at + case.effective_window_days days
      accept the request only when clock_now <= case.return_deadline_at   # inclusive
    input_set: |
      Every ReturnPolicy row of the item's category whose closed [effective_from, effective_to]
      interval contains the logical clock; rows of other categories, rows of other customers and
      rows whose interval has elapsed are excluded.
    constants:
      MIN_EFFECTIVE_WINDOW_DAYS: 7
      POLICY_CLASS_DELTA_DAYS: { STANDARD_WINDOW: 0, EXTENDED_WINDOW: 30, RESTRICTED_WINDOW: -15 }
    precision: "whole days added to delivered_at; the deadline comparison is inclusive (<=)"

  - name: deployment_window_rates
    trigger: "InterventionDeployment SCHEDULED -> ACTIVE (baseline snapshot) and TERMINATED -> MEASURED (window measurement), both inside POST /fit-program/ops-runs"
    algorithm: aggregation
    formula: |
      # baseline, snapshotted at activation
      baseline_units_count = sum(OrderLine.quantity) over lines of the item with
                             delivered_at < deployment.window_start
      baseline_fit_returns = count of ReturnCase rows on those lines with reason_family FIT,
                             status RESOLVED_REFUNDED and requested_at < window_start
      baseline_return_rate_bp = 0 if baseline_units_count == 0
                                else floor(baseline_fit_returns * 10000 / baseline_units_count)
      # measurement, computed at MEASURED
      window_units_count = sum(OrderLine.quantity) over lines of the item with
                           window_start <= delivered_at < window_end          # half-open
      window_fit_returns = count of ReturnCase rows on those lines with reason_family FIT,
                           status RESOLVED_REFUNDED and window_start <= requested_at < window_end
      measured_return_rate_bp = 0 if window_units_count == 0
                                else floor(window_fit_returns * 10000 / window_units_count)
      rate_delta_bp        = max(0, baseline_return_rate_bp - measured_return_rate_bp)
      avoided_return_count = floor(rate_delta_bp * window_units_count / 10000)
      attributed_savings_cents = avoided_return_count
                                 * SAVED_COST_PER_AVOIDED_RETURN_CENTS[item.category_code]
    input_set: |
      Only OrderLine rows of the deployment's own item, split by delivered_at against the
      half-open window [window_start, window_end), and only ReturnCase rows in status
      RESOLVED_REFUNDED with reason_family FIT. An empty window (window_units_count == 0)
      yields measured_return_rate_bp 0, avoided_return_count 0 and attributed_savings_cents 0
      rather than a division error.
    constants:
      SAVED_COST_PER_AVOIDED_RETURN_CENTS: { TOPS: 3200, BOTTOMS: 3600, DRESSES: 4200, OUTERWEAR: 5200, FOOTWEAR: 4400 }
    precision: "integer basis points and whole cents, floor at every division"

  - name: intervention_savings
    trigger: "GET /fit-program/interventions/{id}/savings-report, and (default variant only) every recompute of Intervention.gross_savings_cents / net_savings_cents / funding_posture"
    algorithm: chronological
    formula: |
      deployments = InterventionDeployment rows of this intervention with status == MEASURED
      spend_cents = sum(spend_cents) over deployments with status in {TERMINATED, MEASURED}
      gross_savings_cents = per the selected variant (below)
      net_savings_cents   = gross_savings_cents - spend_cents
      funding_posture =
          FUNDED       if net_savings_cents >= 0
          UNDER_REVIEW if net_savings_cents < 0 and net_savings_cents >= -FUNDING_TOLERANCE_CENTS
          DEFUNDED     if net_savings_cents < -FUNDING_TOLERANCE_CENTS
      # The stored Intervention fields always hold the deployment_attributed numbers; the
      # report endpoint recomputes on demand for the requested variant and never writes.
    input_set: |
      MEASURED deployments only for savings; TERMINATED and MEASURED deployments for spend.
      SCHEDULED and ACTIVE deployments contribute neither savings nor spend, so a lever whose
      only deployment is still running reports net_savings_cents 0 and stays FUNDED.
    constants:
      FUNDING_TOLERANCE_CENTS: 5000
      DEFAULT_VARIANT: deployment_attributed
    precision: "whole cents; every division inside deployment_window_rates already floored"
    variants:
      - name: deployment_attributed
        when: "variant query parameter omitted or equal to deployment_attributed; also the variant whose results are persisted on the Intervention row"
        difference: |
          gross_savings_cents = sum(deployment.attributed_savings_cents) over MEASURED
          deployments. Each deployment is credited against its OWN snapshotted
          baseline_return_rate_bp, so two deployments on different items are additive and the
          order they are processed in is irrelevant.
      - name: cohort_chronological
        when: "variant query parameter equal to cohort_chronological"
        difference: |
          MEASURED deployments are replayed in window_start ASC order (tie-break window_end
          ASC, then created_at ASC — never id) against ONE running cohort baseline:
            running_baseline_bp = baseline_return_rate_bp of the first deployment in that order
            for each deployment d in order:
                delta = max(0, running_baseline_bp - d.measured_return_rate_bp)
                gross += floor(delta * d.window_units_count / 10000)
                         * SAVED_COST_PER_AVOIDED_RETURN_CENTS[d.item.category_code]
                running_baseline_bp = d.measured_return_rate_bp      # updated AFTER each step
          Because the running baseline absorbs each earlier deployment's improvement, later
          deployments are credited only for gains beyond the cohort's already-improved rate, so
          for identical stored data this variant returns a strictly different (never larger)
          gross_savings_cents than deployment_attributed whenever any later deployment's own
          snapshotted baseline exceeds the previous deployment's measured rate.

  - name: vendor_reliability_score
    trigger: "every MeasurementSpec transition into CORRECTION_REQUESTED, every QUALITY-family resolve, and every void of a QUALITY-family case"
    algorithm: weighted_scoring
    formula: |
      reliability_score_bp = max(0, 10000
                                    - QUALITY_CHARGEBACK_PENALTY_BP * quality_chargeback_count
                                    - CORRECTION_ROUND_PENALTY_BP  * correction_round_count)
      status =
          SUSPENDED if reliability_score_bp < VENDOR_SUSPEND_BP
          PROBATION if reliability_score_bp < VENDOR_PROBATION_BP
                       or correction_spend_cents > correction_budget_cents
          ACTIVE    otherwise
    input_set: |
      Counters on the Vendor row only: quality_chargeback_count over non-VOIDED QUALITY cases
      of the vendor's items, and correction_round_count over every CORRECTION_REQUESTED entry
      of the vendor's specifications.
    constants:
      QUALITY_CHARGEBACK_PENALTY_BP: 500
      CORRECTION_ROUND_PENALTY_BP: 300
      VENDOR_PROBATION_BP: 7000
      VENDOR_SUSPEND_BP: 5000
    precision: "integer basis points; thresholds compared with <"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the path resolves, validated left to right"
    error_id: "ERR_VENDOR_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_SPEC_NOT_FOUND | ERR_CHART_NOT_FOUND | ERR_MAPPING_NOT_FOUND | ERR_CUSTOMER_PROFILE_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_RETURN_CASE_NOT_FOUND | ERR_FEEDBACK_NOT_FOUND | ERR_INTERVENTION_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: auth
    check: "for entity_backed roles, X-User-ID owns the target: VendorUser's id equals the item's vendor_id for specification writes and equals {id} on GET /fit-program/vendors/{id}; Customer's id equals OrderLine.customer_profile_id for return-case writes and reads, equals the body customer_profile_id on fit-feedback creation, equals FitFeedback.customer_profile_id on retract, and equals the customer_profile_id query value on the fit-recommendation read"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all VendorUser and Customer operations"

  - priority: 5
    category: business_constraint
    check: "request body fields are present, correctly typed, within declared numeric bounds, and enum members are declared values; size_points has >= 2 entries with unique labels and unique sort_index values; grade_rules measurement_point values are unique; base_size_label appears in size_points"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 7
    category: existence
    check: "every FK supplied in the body resolves, validated in body-declaration order"
    error_id: "ERR_VENDOR_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_CHART_NOT_FOUND | ERR_CUSTOMER_PROFILE_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_INTERVENTION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /fit-program/catalog-items, POST /fit-program/measurement-specs, POST /fit-program/size-chart-mappings, POST /fit-program/order-lines, POST /fit-program/return-cases, POST /fit-program/fit-feedback, POST /fit-program/intervention-deployments"

  - priority: 8
    category: business_constraint
    check: "unique keys are free: Vendor.brand_code, CatalogItem.sku, SizeChart.chart_code, CustomerProfile.email"
    error_id: ERR_DUPLICATE_RESOURCE_KEY
    http_status: 409
    applies_to: "POST /fit-program/vendors, POST /fit-program/catalog-items, POST /fit-program/size-charts, POST /fit-program/customer-profiles"

  - priority: 9
    category: state
    check: "the CatalogItem reached through the path or the body is not DELISTED"
    error_id: ERR_ITEM_DELISTED
    http_status: 409
    applies_to: "POST /fit-program/measurement-specs, POST /fit-program/measurement-specs/{id}/submit, POST /fit-program/measurement-specs/{id}/verify, POST /fit-program/measurement-specs/{id}/resubmit, POST /fit-program/size-chart-mappings, POST /fit-program/catalog-items/{id}/publish-guidance, POST /fit-program/catalog-items/{id}/pdp-enhancement, POST /fit-program/order-lines, POST /fit-program/return-cases, POST /fit-program/intervention-deployments"

  - priority: 10
    category: state
    check: "the target resource is in a state the requested transition declares as `from`"
    error_id: "ERR_INVALID_ITEM_STATE | ERR_INVALID_SPEC_STATE | ERR_INVALID_CHART_STATE | ERR_INVALID_RETURN_CASE_STATE | ERR_INVALID_DEPLOYMENT_STATE"
    http_status: 409
    applies_to: "every action endpoint (list, delist, publish-guidance, submit, verify, resubmit, standardize, retire, classify, resolve, void, terminate, retract)"

  - priority: 11
    category: state
    check: "the OCC input equals the current parent version: expected_item_version == CatalogItem.version on mapping creation, expected_customer_profile_version == CustomerProfile.version on override creation"
    error_id: "ERR_STALE_ITEM_VERSION | ERR_STALE_CUSTOMER_PROFILE_VERSION"
    http_status: 412
    applies_to: "POST /fit-program/size-chart-mappings, POST /fit-program/customer-profiles/{id}/return-policy-overrides"

  - priority: 12
    category: business_safety
    check: "the acting ReturnsAuditor X-User-ID differs from ReturnCase.classified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fit-program/return-cases/{id}/resolve"

  - priority: 13
    category: business_safety
    check: "the purchaser's abuse_status is not BLOCKED"
    error_id: ERR_CUSTOMER_RETURN_BLOCKED
    http_status: 409
    applies_to: "POST /fit-program/return-cases"

  - priority: 14
    category: business_temporal
    check: "the logical clock is at or before delivered_at + effective_window_days days"
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /fit-program/return-cases"

  - priority: 15
    category: business_referential
    check: "calculations.effective_return_policy_resolution finds at least one candidate policy row"
    error_id: ERR_NO_RETURN_POLICY
    http_status: 422
    applies_to: "POST /fit-program/return-cases"

  - priority: 16
    category: business_constraint
    check: "the OrderLine has no ReturnCase whose status is in {TRIAGE, FIT_REVIEW, QUALITY_REVIEW, EXPECTATION_REVIEW, COOLING_OFF, RESOLVED_REFUNDED, RESOLVED_DENIED}"
    error_id: ERR_DUPLICATE_RETURN_CASE
    http_status: 409
    applies_to: "POST /fit-program/return-cases"

  - priority: 17
    category: business_constraint
    check: "the item's Vendor.status is not SUSPENDED"
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 409
    applies_to: "POST /fit-program/measurement-specs, POST /fit-program/measurement-specs/{id}/submit, POST /fit-program/measurement-specs/{id}/resubmit"

  - priority: 18
    category: business_constraint
    check: "the item has no MeasurementSpec whose status is in {DRAFT, SUBMITTED, CORRECTION_REQUESTED}"
    error_id: ERR_SPEC_REVISION_IN_FLIGHT
    http_status: 409
    applies_to: "POST /fit-program/measurement-specs"

  - priority: 19
    category: business_referential
    check: "the item has exactly one MeasurementSpec with status VERIFIED"
    error_id: ERR_SPEC_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /fit-program/size-chart-mappings, POST /fit-program/catalog-items/{id}/publish-guidance"

  - priority: 20
    category: business_referential
    check: "the referenced SizeChart has status STANDARDIZED and its category_code equals the item's category_code"
    error_id: ERR_CHART_NOT_STANDARDIZED
    http_status: 409
    applies_to: "POST /fit-program/size-chart-mappings, POST /fit-program/catalog-items/{id}/publish-guidance"

  - priority: 21
    category: business_constraint
    check: "every size_label_pairs.spec_size_label exists in the VERIFIED specification's size_points and every chart_size_label exists in the chart's rows"
    error_id: ERR_SIZE_LABEL_NOT_IN_SPEC
    http_status: 422
    applies_to: "POST /fit-program/size-chart-mappings"

  - priority: 22
    category: business_constraint
    check: "chart rows have contiguous sort_index from 0, strictly increasing non-overlapping body_chest ranges, and non-empty values in all four conversion columns"
    error_id: ERR_CHART_ROWS_INVALID
    http_status: 422
    applies_to: "POST /fit-program/size-charts/{id}/standardize"

  - priority: 23
    category: business_temporal
    check: "for the same (customer_profile_id, category_code), the new override's closed [effective_from, effective_to] interval does not intersect an existing override's closed interval; a null effective_to is treated as +infinity, and touching endpoints DO intersect"
    error_id: ERR_POLICY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /fit-program/customer-profiles/{id}/return-policy-overrides"

  - priority: 24
    category: business_temporal
    check: "for the same (item_id, Intervention.lever), the new half-open [window_start, window_end) window does not intersect an existing non-TERMINATED, non-MEASURED window; touching endpoints (new.window_start == existing.window_end) do NOT intersect; window_start < window_end is required"
    error_id: ERR_DEPLOYMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /fit-program/intervention-deployments"

  - priority: 25
    category: business_constraint
    check: "the deployment's CatalogItem.listing_status is LISTED"
    error_id: ERR_DEPLOYMENT_ITEM_NOT_LISTED
    http_status: 409
    applies_to: "POST /fit-program/intervention-deployments"

  - priority: 26
    category: business_constraint
    check: "the (item_id, customer_profile_id) pair has no FitFeedback row with status ACTIVE"
    error_id: ERR_DUPLICATE_FIT_FEEDBACK
    http_status: 409
    applies_to: "POST /fit-program/fit-feedback"

  - priority: 27
    category: business_constraint
    check: "the FitFeedback row's status is ACTIVE"
    error_id: ERR_FEEDBACK_ALREADY_RETRACTED
    http_status: 409
    applies_to: "POST /fit-program/fit-feedback/{id}/retract"

  - priority: 28
    category: business_constraint
    check: "the item's ACTIVE SizeChartMapping has coverage_bp >= MIN_COVERAGE_BP"
    error_id: ERR_MAPPING_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /fit-program/catalog-items/{id}/publish-guidance"

  - priority: 29
    category: business_constraint
    check: "model_measurements_published == true and detail_image_count >= MIN_DETAIL_IMAGE_COUNT (3)"
    error_id: ERR_PDP_ENHANCEMENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /fit-program/catalog-items/{id}/publish-guidance"

  - priority: 30
    category: business_constraint
    check: "the item's fit_readiness is GUIDANCE_READY"
    error_id: ERR_GUIDANCE_NOT_READY
    http_status: 409
    applies_to: "GET /fit-program/catalog-items/{id}/fit-recommendation"

  - priority: 31
    category: business_fiscal
    check: "Vendor.correction_spend_cents <= Vendor.correction_budget_cents"
    error_id: ERR_VENDOR_CORRECTION_BUDGET_EXHAUSTED
    http_status: 402
    applies_to: "POST /fit-program/measurement-specs/{id}/resubmit"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/fit-program/vendors"
    description: "register a supplying vendor with its funded correction budget"
    roles: [MerchOpsAdmin]
    code: 201
    input: [name, brand_code, correction_budget_cents]
    output: Vendor
    side_effects: ["status = ACTIVE", "reliability_score_bp = 10000", "correction_spend_cents = 0"]

  - method: GET
    path: "/fit-program/vendors/{id}"
    description: "read a vendor including correction spend, reliability score and derived status"
    roles: [MerchOpsAdmin, FitAnalyst, VendorUser]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/fit-program/catalog-items"
    description: "create a catalog item for a vendor"
    roles: [MerchOpsAdmin]
    code: 201
    input: [vendor_id, sku, category_code, brand_size_system, unit_price_cents]
    output: CatalogItem
    side_effects: ["listing_status = DRAFT", "fit_readiness = UNVERIFIED", "fit_watch_state = NORMAL"]

  - method: GET
    path: "/fit-program/catalog-items/{id}"
    description: "read one catalog item with both state axes and every derived return metric"
    roles: [MerchOpsAdmin, FitAnalyst, VendorUser, ReturnsAuditor, Customer]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []

  - method: GET
    path: "/fit-program/catalog-items"
    description: "list catalog items, filterable by vendor and by either state axis; reverse-reachability for CatalogItem.vendor_id"
    roles: [MerchOpsAdmin, FitAnalyst, ReturnsAuditor]
    code: 200
    input: ["vendor_id?", "listing_status?", "fit_readiness?", "fit_watch_state?", "limit?", "offset?"]
    output: CatalogItem[]
    side_effects: []

  - method: POST
    path: "/fit-program/catalog-items/{id}/list"
    description: "put a DRAFT item on the storefront; advances the listing axis only"
    roles: [MerchOpsAdmin]
    code: 200
    input: []
    output: CatalogItem
    side_effects: ["listing_status DRAFT -> LISTED", "increments CatalogItem.version by 1"]

  - method: POST
    path: "/fit-program/catalog-items/{id}/delist"
    description: "remove an item from the storefront permanently and terminate its open deployments"
    roles: [MerchOpsAdmin]
    code: 200
    input: [delist_reason_code]
    output: CatalogItem
    side_effects:
      - "listing_status -> DELISTED; delist_reason_code stored"
      - "every SCHEDULED or ACTIVE InterventionDeployment of the item -> TERMINATED with ITEM_DELISTED"
      - "each affected Intervention recomputes spend_cents, net_savings_cents and funding_posture"
      - "increments CatalogItem.version by 1"

  - method: POST
    path: "/fit-program/catalog-items/{id}/pdp-enhancement"
    description: "publish model measurements and detail imagery counts on the product page"
    roles: [MerchOpsAdmin]
    code: 200
    input: [model_measurements_published, detail_image_count, "model_height_cm?", "model_worn_size_label?"]
    output: CatalogItem
    side_effects: ["model_* fields and detail_image_count written", "pdp_review_required = false", "increments CatalogItem.version by 1"]

  - method: POST
    path: "/fit-program/catalog-items/{id}/publish-guidance"
    description: "turn on fit guidance for a mapped item; also restores a SUSPENDED listing once the item is no longer CHRONIC"
    roles: [FitAnalyst]
    code: 200
    input: []
    output: CatalogItem
    side_effects:
      - "fit_readiness CHART_MAPPED -> GUIDANCE_READY"
      - "listing_status SUSPENDED -> LISTED when the item is SUSPENDED and fit_watch_state != CHRONIC"
      - "increments CatalogItem.version by 1"

  - method: GET
    path: "/fit-program/catalog-items/{id}/fit-recommendation"
    description: "computed read: recommended size and confidence for a shopper, variant selected per calculations.fit_recommendation"
    roles: [Customer, FitAnalyst, MerchOpsAdmin]
    code: 200
    input: ["customer_profile_id?"]
    output: { recommended_size_label: string, confidence_bp: integer, variant_applied: string, sample_count: integer, coverage_bp: integer, suppressed: boolean, anchor_index: integer, recommended_index: integer }
    side_effects: []

  - method: POST
    path: "/fit-program/measurement-specs"
    description: "vendor captures a measurement specification with size points and grade rules"
    roles: [VendorUser]
    code: 201
    input: [item_id, size_system, base_size_label, fabric_stretch_class, size_points, grade_rules]
    output: MeasurementSpec
    side_effects: ["status = DRAFT", "revision_round = 0"]

  - method: GET
    path: "/fit-program/measurement-specs/{id}"
    description: "read one specification with its verification verdict fields"
    roles: [VendorUser, FitAnalyst, MerchOpsAdmin]
    code: 200
    input: []
    output: MeasurementSpec
    side_effects: []

  - method: GET
    path: "/fit-program/measurement-specs"
    description: "list specifications; reverse-reachability for MeasurementSpec.item_id"
    roles: [VendorUser, FitAnalyst, MerchOpsAdmin]
    code: 200
    input: ["item_id?", "status?", "limit?", "offset?"]
    output: MeasurementSpec[]
    side_effects: []

  - method: POST
    path: "/fit-program/measurement-specs/{id}/submit"
    description: "vendor submits a DRAFT specification for verification"
    roles: [VendorUser]
    code: 200
    input: []
    output: MeasurementSpec
    side_effects: ["status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/fit-program/measurement-specs/{id}/verify"
    description: "analyst runs tolerance and grade-rule verification; the outcome is computed, not chosen"
    roles: [FitAnalyst]
    code: 200
    input: []
    output: MeasurementSpec
    side_effects:
      - "runs calculations.spec_grade_tolerance_verification and writes violation_count, first_violation_point, first_violation_from_size_label, tolerance_applied_mm"
      - "status -> VERIFIED, CORRECTION_REQUESTED or REJECTED per the verdict and revision_round"
      - "on VERIFIED: other VERIFIED specifications of the item -> SUPERSEDED"
      - "on CORRECTION_REQUESTED: Vendor.correction_round_count + 1, Vendor.correction_spend_cents + 2500, Vendor.reliability_score_bp and Vendor.status re-derived"
      - "on REJECTED: CatalogItem.fit_readiness -> UNVERIFIED when it was CHART_MAPPED or GUIDANCE_READY"

  - method: POST
    path: "/fit-program/measurement-specs/{id}/resubmit"
    description: "vendor answers a correction request with amended size points, re-entering verification"
    roles: [VendorUser]
    code: 200
    input: [size_points, "grade_rules?"]
    output: MeasurementSpec
    side_effects: ["size_points (and grade_rules when supplied) replaced", "revision_round + 1", "status CORRECTION_REQUESTED -> SUBMITTED", "correction_reason = null"]

  - method: POST
    path: "/fit-program/size-charts"
    description: "create a standardized size chart with its conversion table and body-measurement ranges"
    roles: [MerchOpsAdmin]
    code: 201
    input: [chart_code, size_system, category_code, rows]
    output: SizeChart
    side_effects: ["status = DRAFT", "row_count and median_row_index written"]

  - method: GET
    path: "/fit-program/size-charts/{id}"
    description: "read one size chart with its rows"
    roles: [MerchOpsAdmin, FitAnalyst]
    code: 200
    input: []
    output: SizeChart
    side_effects: []

  - method: POST
    path: "/fit-program/size-charts/{id}/standardize"
    description: "validate row monotonicity and conversion completeness, then standardize the chart"
    roles: [MerchOpsAdmin]
    code: 200
    input: []
    output: SizeChart
    side_effects: ["status DRAFT -> STANDARDIZED", "row_count and median_row_index refreshed"]

  - method: POST
    path: "/fit-program/size-charts/{id}/retire"
    description: "retire a standardized chart and cascade through mappings, item readiness and deployments"
    roles: [MerchOpsAdmin]
    code: 200
    input: [retire_reason_code]
    output: SizeChart
    side_effects:
      - "status STANDARDIZED -> RETIRED; retire_reason_code stored"
      - "every ACTIVE SizeChartMapping of the chart -> SUPERSEDED with CHART_RETIRED"
      - "each affected item's fit_readiness -> UNVERIFIED"
      - "each affected item's ACTIVE deployments with lever FIT_RECOMMENDATION_BADGE or SIZE_CHART_STANDARDIZATION -> TERMINATED with MAPPING_SUPERSEDED"
      - "each affected Intervention recomputes spend_cents, net_savings_cents and funding_posture"

  - method: POST
    path: "/fit-program/size-chart-mappings"
    description: "map an item's brand sizes onto a standardized chart; supersedes the item's prior mapping"
    roles: [FitAnalyst]
    code: 201
    input: [item_id, chart_id, size_label_pairs, expected_item_version]
    output: SizeChartMapping
    side_effects:
      - "runs calculations.mapping_coverage and writes mapped_row_count, spec_size_point_count, coverage_bp, unmapped_size_labels"
      - "prior ACTIVE mapping of the item -> SUPERSEDED with NEW_MAPPING"
      - "CatalogItem.fit_readiness UNVERIFIED -> CHART_MAPPED"
      - "increments CatalogItem.version by 1"

  - method: GET
    path: "/fit-program/size-chart-mappings/{id}"
    description: "read one mapping with its coverage figures"
    roles: [FitAnalyst, MerchOpsAdmin]
    code: 200
    input: []
    output: SizeChartMapping
    side_effects: []

  - method: GET
    path: "/fit-program/size-chart-mappings"
    description: "list mappings; reverse-reachability for SizeChartMapping.item_id and SizeChartMapping.chart_id"
    roles: [FitAnalyst, MerchOpsAdmin]
    code: 200
    input: ["item_id?", "chart_id?", "status?", "limit?", "offset?"]
    output: SizeChartMapping[]
    side_effects: []

  - method: POST
    path: "/fit-program/customer-profiles"
    description: "create a shopper profile"
    roles: [MerchOpsAdmin]
    code: 201
    input: [email, "tier?"]
    output: CustomerProfile
    side_effects: ["tier defaults to STANDARD", "abuse_status = CLEAR", "policy_class = STANDARD_WINDOW (EXTENDED_WINDOW when tier is PLUS)"]

  - method: GET
    path: "/fit-program/customer-profiles/{id}"
    description: "read a shopper profile with abuse counters and policy class"
    roles: [MerchOpsAdmin, ReturnsAuditor, Customer]
    code: 200
    input: []
    output: CustomerProfile
    side_effects: []

  - method: POST
    path: "/fit-program/customer-profiles/{id}/return-policy-overrides"
    description: "create a customer-scoped return policy override for one category over a closed date interval"
    roles: [MerchOpsAdmin]
    code: 201
    input: [category_code, window_days, restocking_applies, non_refundable_shipping, effective_from, "effective_to?", expected_customer_profile_version]
    output: ReturnPolicy
    side_effects: ["scope = CUSTOMER_OVERRIDE; customer_profile_id = {id}", "increments CustomerProfile.version by 1"]

  - method: POST
    path: "/fit-program/return-policies"
    description: "create a category-default return policy"
    roles: [MerchOpsAdmin]
    code: 201
    input: [category_code, window_days, restocking_applies, non_refundable_shipping, effective_from, "effective_to?"]
    output: ReturnPolicy
    side_effects: ["scope = CATEGORY_DEFAULT; customer_profile_id = null"]

  - method: GET
    path: "/fit-program/return-policies/{id}"
    description: "read one policy row"
    roles: [MerchOpsAdmin, ReturnsAuditor]
    code: 200
    input: []
    output: ReturnPolicy
    side_effects: []

  - method: GET
    path: "/fit-program/return-policies"
    description: "list policy rows; reverse-reachability for ReturnPolicy.customer_profile_id"
    roles: [MerchOpsAdmin, ReturnsAuditor]
    code: 200
    input: ["customer_profile_id?", "category_code?", "scope?", "limit?", "offset?"]
    output: ReturnPolicy[]
    side_effects: []

  - method: POST
    path: "/fit-program/order-lines"
    description: "ingest a delivered order line from the commerce platform"
    roles: [MerchOpsAdmin]
    code: 201
    input: [customer_profile_id, item_id, size_label, quantity, unit_price_cents, shipping_allocated_cents, delivered_at]
    output: OrderLine
    side_effects:
      - "gross_line_cents computed; status = DELIVERED"
      - "CatalogItem.units_sold_count, rates, chronic_return_score_bp and fit_watch_state recomputed"
      - "CustomerProfile.purchase_line_count, return_rate_bp, abuse_status and policy_class recomputed"

  - method: GET
    path: "/fit-program/order-lines/{id}"
    description: "read one order line"
    roles: [MerchOpsAdmin, ReturnsAuditor, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/fit-program/order-lines"
    description: "list order lines; reverse-reachability for OrderLine.customer_profile_id and OrderLine.item_id"
    roles: [MerchOpsAdmin, ReturnsAuditor, Customer]
    code: 200
    input: ["customer_profile_id?", "item_id?", "status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/fit-program/return-cases"
    description: "shopper opens a return; the effective policy, window and deadline are frozen on the case"
    roles: [Customer]
    code: 201
    input: [order_line_id, requested_reason_code, "comment?"]
    output: ReturnCase
    side_effects:
      - "runs calculations.effective_return_policy_resolution and writes effective_policy_id, effective_window_days, return_deadline_at, requested_at"
      - "reason_code = requested_reason_code; reason_family derived; status = TRIAGE"
      - "OrderLine.status = RETURN_IN_PROGRESS"
      - "CustomerProfile.return_case_count, return_rate_bp, abuse_status and policy_class recomputed"

  - method: GET
    path: "/fit-program/return-cases/{id}"
    description: "read one return case with its fee, refund and cost figures"
    roles: [ReturnsAuditor, MerchOpsAdmin, Customer]
    code: 200
    input: []
    output: ReturnCase
    side_effects: []

  - method: GET
    path: "/fit-program/return-cases"
    description: "list return cases; reverse-reachability for ReturnCase.order_line_id and ReturnCase.effective_policy_id"
    roles: [ReturnsAuditor, MerchOpsAdmin]
    code: 200
    input: ["order_line_id?", "effective_policy_id?", "status?", "reason_family?", "limit?", "offset?"]
    output: ReturnCase[]
    side_effects: []

  - method: POST
    path: "/fit-program/return-cases/{id}/classify"
    description: "auditor codes the return reason, forking the case into one of four review branches"
    roles: [ReturnsAuditor]
    code: 200
    input: [reason_code, "evidence_note?"]
    output: ReturnCase
    side_effects: ["reason_code and reason_family rewritten", "status TRIAGE -> FIT_REVIEW | QUALITY_REVIEW | EXPECTATION_REVIEW | COOLING_OFF", "classified_by_user_id = acting X-User-ID"]

  - method: POST
    path: "/fit-program/return-cases/{id}/resolve"
    description: "auditor closes the case; the branch decides the refund, fee, postings and cascades"
    roles: [ReturnsAuditor]
    code: 200
    input: [item_condition, "resolution_note?"]
    output: ReturnCase
    side_effects:
      - "runs calculations.return_refund_and_restocking_fee then calculations.return_case_cost_postings"
      - "status -> RESOLVED_REFUNDED, or RESOLVED_DENIED when the purchaser is BLOCKED"
      - "ORIGINAL ReturnCostPosting rows written; OrderLine.status -> RETURNED or KEPT"
      - "resolved_by_user_id = acting X-User-ID"
      - "item counters, return_cost_accrued_cents, chronic_return_score_bp and fit_watch_state recomputed; a flip to CHRONIC suspends the listing, resets fit_readiness, reopens the VERIFIED specification and debits the Vendor"
      - "customer counters, abuse_strike_count, abuse_status and policy_class recomputed"
      - "Vendor.quality_chargeback_count, reliability_score_bp and status recomputed on the QUALITY branch"

  - method: POST
    path: "/fit-program/return-cases/{id}/void"
    description: "auditor reverses a resolved case; every ORIGINAL posting gets a negating REVERSAL posting"
    roles: [ReturnsAuditor]
    code: 200
    input: [void_reason]
    output: ReturnCase
    side_effects:
      - "one REVERSAL ReturnCostPosting per ORIGINAL posting; case.total_cost_cents = 0"
      - "OrderLine.status = DELIVERED"
      - "item and customer aggregates recomputed, including fit_watch_state and abuse_status walking back"
      - "Vendor.quality_chargeback_count decremented for a QUALITY case, then reliability_score_bp and status re-derived"

  - method: GET
    path: "/fit-program/return-cases/{id}/cost-postings"
    description: "append-only cost ledger of a case; reverse-reachability for ReturnCostPosting.return_case_id"
    roles: [ReturnsAuditor, MerchOpsAdmin]
    code: 200
    input: []
    output: ReturnCostPosting[]
    side_effects: []

  - method: POST
    path: "/fit-program/fit-feedback"
    description: "shopper publishes reviewer fit feedback on an item"
    roles: [Customer]
    code: 201
    input: [item_id, customer_profile_id, purchased_size_label, fit_verdict, "comment?"]
    output: FitFeedback
    side_effects:
      - "verdict_offset_centi and signal_weight computed; status = ACTIVE"
      - "CatalogItem.fit_signal_weight_total + signal_weight and active_fit_feedback_count + 1"

  - method: GET
    path: "/fit-program/fit-feedback/{id}"
    description: "read one fit feedback row"
    roles: [Customer, FitAnalyst, MerchOpsAdmin]
    code: 200
    input: []
    output: FitFeedback
    side_effects: []

  - method: GET
    path: "/fit-program/fit-feedback"
    description: "list fit feedback; reverse-reachability for FitFeedback.item_id and FitFeedback.customer_profile_id"
    roles: [Customer, FitAnalyst, MerchOpsAdmin]
    code: 200
    input: ["item_id?", "customer_profile_id?", "status?", "limit?", "offset?"]
    output: FitFeedback[]
    side_effects: []

  - method: POST
    path: "/fit-program/fit-feedback/{id}/retract"
    description: "author withdraws fit feedback; the item's signal pool must return to its prior total"
    roles: [Customer]
    code: 200
    input: [retract_reason]
    output: FitFeedback
    side_effects:
      - "status ACTIVE -> RETRACTED; retract_reason stored"
      - "CatalogItem.fit_signal_weight_total - signal_weight and active_fit_feedback_count - 1"

  - method: POST
    path: "/fit-program/interventions"
    description: "define a return-reduction lever"
    roles: [MerchOpsAdmin]
    code: 201
    input: [name, lever, unit_cost_cents]
    output: Intervention
    side_effects: ["funding_posture = FUNDED", "all savings counters = 0"]

  - method: GET
    path: "/fit-program/interventions/{id}"
    description: "read a lever with its persisted deployment_attributed savings figures"
    roles: [MerchOpsAdmin, FitAnalyst]
    code: 200
    input: []
    output: Intervention
    side_effects: []

  - method: GET
    path: "/fit-program/interventions/{id}/savings-report"
    description: "computed read: return-cost reduction for the lever under the requested measurement variant"
    roles: [MerchOpsAdmin, FitAnalyst]
    code: 200
    input: ["variant?"]
    output: { variant_applied: string, gross_savings_cents: integer, spend_cents: integer, net_savings_cents: integer, measured_deployment_count: integer, avoided_return_count: integer, funding_posture: string }
    side_effects: []

  - method: POST
    path: "/fit-program/intervention-deployments"
    description: "schedule a lever deployment on a listed item over a half-open measurement window"
    roles: [MerchOpsAdmin]
    code: 201
    input: [intervention_id, item_id, window_start, window_end, spend_cents]
    output: InterventionDeployment
    side_effects: ["status = SCHEDULED", "Intervention.deployment_count + 1"]

  - method: GET
    path: "/fit-program/intervention-deployments/{id}"
    description: "read one deployment with its baseline and measured window figures"
    roles: [MerchOpsAdmin, FitAnalyst]
    code: 200
    input: []
    output: InterventionDeployment
    side_effects: []

  - method: GET
    path: "/fit-program/intervention-deployments"
    description: "list deployments; reverse-reachability for InterventionDeployment.intervention_id and InterventionDeployment.item_id"
    roles: [MerchOpsAdmin, FitAnalyst]
    code: 200
    input: ["intervention_id?", "item_id?", "status?", "limit?", "offset?"]
    output: InterventionDeployment[]
    side_effects: []

  - method: POST
    path: "/fit-program/intervention-deployments/{id}/terminate"
    description: "stop an ACTIVE deployment early; the window closes at the logical clock"
    roles: [MerchOpsAdmin]
    code: 200
    input: [terminated_reason_code]
    output: InterventionDeployment
    side_effects: ["status ACTIVE -> TERMINATED", "window_end rewritten to the logical clock when the clock is earlier", "Intervention spend and posture recomputed"]

  - method: POST
    path: "/fit-program/ops-runs"
    description: "ops-run checkpoint: advances each deployment by at most one hop (activate, terminate, measure), refreshes every item's chronic score and watch state, and ages abuse strikes out of the trailing window"
    roles: [MerchOpsAdmin]
    code: 200
    input: []
    output: { deployments_activated: integer, deployments_terminated: integer, deployments_measured: integer, items_swept: integer, watch_flips: integer, chronic_flips: integer, corrections_opened: integer, abuse_downgrades: integer }
    side_effects:
      - "SCHEDULED -> ACTIVE for deployments whose window_start has passed on a LISTED item, snapshotting baseline figures"
      - "ACTIVE -> TERMINATED with WINDOW_ELAPSED for deployments whose window_end has passed"
      - "TERMINATED -> MEASURED, writing window figures and recomputing the Intervention"
      - "every CatalogItem's chronic score and fit_watch_state recomputed; a flip to CHRONIC runs the full chronic cascade"
      - "every CustomerProfile's abuse_strike_count recomputed against the trailing window, walking abuse_status down as strikes age out"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: set the logical clock to any instant, forward or backward. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [MerchOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every subsequent deadline, window and trailing-window evaluation reads this instant"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "VendorUser acts on an item of another vendor, or Customer acts on another shopper's order line, return case, feedback or recommendation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ReturnsAuditor resolving a case is the same operator id that classified it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing or mistyped body field, out-of-range number, undeclared enum member, fewer than two size_points, duplicate size_label or sort_index, base_size_label absent from size_points"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset below 0"
  - id: ERR_DUPLICATE_RESOURCE_KEY
    http: 409
    condition: "brand_code, sku, chart_code or email already taken"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "vendor id in the path or body does not resolve"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "catalog item id in the path or body does not resolve"
  - id: ERR_SPEC_NOT_FOUND
    http: 404
    condition: "measurement specification id in the path does not resolve"
  - id: ERR_CHART_NOT_FOUND
    http: 404
    condition: "size chart id in the path or body does not resolve"
  - id: ERR_MAPPING_NOT_FOUND
    http: 404
    condition: "size chart mapping id in the path does not resolve"
  - id: ERR_CUSTOMER_PROFILE_NOT_FOUND
    http: 404
    condition: "customer profile id in the path or body does not resolve"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "return policy id in the path does not resolve"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "order line id in the path or body does not resolve"
  - id: ERR_RETURN_CASE_NOT_FOUND
    http: 404
    condition: "return case id in the path does not resolve"
  - id: ERR_FEEDBACK_NOT_FOUND
    http: 404
    condition: "fit feedback id in the path does not resolve"
  - id: ERR_INTERVENTION_NOT_FOUND
    http: 404
    condition: "intervention id in the path or body does not resolve"
  - id: ERR_DEPLOYMENT_NOT_FOUND
    http: 404
    condition: "intervention deployment id in the path does not resolve"
  - id: ERR_ITEM_DELISTED
    http: 409
    condition: "the CatalogItem reached through the path or body has listing_status DELISTED"
  - id: ERR_INVALID_ITEM_STATE
    http: 409
    condition: "list, delist, pdp-enhancement or publish-guidance requested from an item state the transition does not declare as `from`"
  - id: ERR_INVALID_SPEC_STATE
    http: 409
    condition: "submit, verify or resubmit requested from a specification status the transition does not declare as `from`"
  - id: ERR_INVALID_CHART_STATE
    http: 409
    condition: "standardize requested on a chart that is not DRAFT, or retire requested on a chart that is not STANDARDIZED"
  - id: ERR_INVALID_RETURN_CASE_STATE
    http: 409
    condition: "classify requested on a case that is not TRIAGE, resolve on a case not in a review branch, or void on a case that is not RESOLVED_REFUNDED or RESOLVED_DENIED"
  - id: ERR_INVALID_DEPLOYMENT_STATE
    http: 409
    condition: "terminate requested on a deployment that is not ACTIVE"
  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "expected_item_version does not equal the CatalogItem's current version"
  - id: ERR_STALE_CUSTOMER_PROFILE_VERSION
    http: 412
    condition: "expected_customer_profile_version does not equal the CustomerProfile's current version"
  - id: ERR_CUSTOMER_RETURN_BLOCKED
    http: 409
    condition: "the purchaser's abuse_status is BLOCKED when a return case is requested"
  - id: ERR_RETURN_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is later than delivered_at + effective_window_days days"
  - id: ERR_NO_RETURN_POLICY
    http: 422
    condition: "no CATEGORY_DEFAULT or CUSTOMER_OVERRIDE policy row covers the item's category at the logical clock"
  - id: ERR_DUPLICATE_RETURN_CASE
    http: 409
    condition: "the order line already carries a non-VOIDED return case"
  - id: ERR_VENDOR_SUSPENDED
    http: 409
    condition: "the item's vendor has status SUSPENDED when a specification write is attempted"
  - id: ERR_SPEC_REVISION_IN_FLIGHT
    http: 409
    condition: "the item already has a specification in DRAFT, SUBMITTED or CORRECTION_REQUESTED"
  - id: ERR_SPEC_NOT_VERIFIED
    http: 409
    condition: "mapping creation or guidance publication attempted while the item has no VERIFIED specification"
  - id: ERR_CHART_NOT_STANDARDIZED
    http: 409
    condition: "the referenced chart is not STANDARDIZED, or its category_code differs from the item's"
  - id: ERR_SIZE_LABEL_NOT_IN_SPEC
    http: 422
    condition: "a mapping pair names a spec_size_label absent from the VERIFIED specification or a chart_size_label absent from the chart rows"
  - id: ERR_CHART_ROWS_INVALID
    http: 422
    condition: "standardize found non-contiguous sort_index values, overlapping or non-increasing body_chest ranges, or an empty conversion column"
  - id: ERR_MAPPING_COVERAGE_INSUFFICIENT
    http: 422
    condition: "the item's ACTIVE mapping has coverage_bp below MIN_COVERAGE_BP (8000) at guidance publication"
  - id: ERR_PDP_ENHANCEMENT_INCOMPLETE
    http: 422
    condition: "guidance publication attempted without published model measurements or with fewer than three detail images"
  - id: ERR_GUIDANCE_NOT_READY
    http: 409
    condition: "a fit recommendation is requested for an item whose fit_readiness is not GUIDANCE_READY"
  - id: ERR_POLICY_WINDOW_OVERLAP
    http: 409
    condition: "a customer override's closed effective interval intersects an existing override for the same customer and category, endpoints included"
  - id: ERR_DEPLOYMENT_WINDOW_OVERLAP
    http: 409
    condition: "a deployment's half-open window intersects an existing SCHEDULED or ACTIVE window for the same item and lever, or window_start is not before window_end"
  - id: ERR_DEPLOYMENT_ITEM_NOT_LISTED
    http: 409
    condition: "a deployment is scheduled on an item whose listing_status is not LISTED"
  - id: ERR_DUPLICATE_FIT_FEEDBACK
    http: 409
    condition: "the shopper already has ACTIVE fit feedback on the item"
  - id: ERR_FEEDBACK_ALREADY_RETRACTED
    http: 409
    condition: "retract requested on feedback whose status is already RETRACTED"
  - id: ERR_VENDOR_CORRECTION_BUDGET_EXHAUSTED
    http: 402
    condition: "resubmit attempted while the vendor's correction_spend_cents exceeds correction_budget_cents"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: MerchOpsAdmin
    description: "merchandising operations: catalog, charts, policies, order ingest, program levers and the ops-run checkpoint"
    identity: opaque
    exclusive_operations:
      - "POST /fit-program/vendors"
      - "POST /fit-program/catalog-items"
      - "POST /fit-program/catalog-items/{id}/list"
      - "POST /fit-program/catalog-items/{id}/delist"
      - "POST /fit-program/catalog-items/{id}/pdp-enhancement"
      - "POST /fit-program/size-charts"
      - "POST /fit-program/size-charts/{id}/standardize"
      - "POST /fit-program/size-charts/{id}/retire"
      - "POST /fit-program/customer-profiles"
      - "POST /fit-program/customer-profiles/{id}/return-policy-overrides"
      - "POST /fit-program/return-policies"
      - "POST /fit-program/order-lines"
      - "POST /fit-program/interventions"
      - "POST /fit-program/intervention-deployments"
      - "POST /fit-program/intervention-deployments/{id}/terminate"
      - "POST /fit-program/ops-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /fit-program/vendors/{id}"
      - "GET /fit-program/catalog-items/{id}"
      - "GET /fit-program/catalog-items"
      - "GET /fit-program/catalog-items/{id}/fit-recommendation"
      - "GET /fit-program/measurement-specs/{id}"
      - "GET /fit-program/measurement-specs"
      - "GET /fit-program/size-charts/{id}"
      - "GET /fit-program/size-chart-mappings/{id}"
      - "GET /fit-program/size-chart-mappings"
      - "GET /fit-program/customer-profiles/{id}"
      - "GET /fit-program/return-policies/{id}"
      - "GET /fit-program/return-policies"
      - "GET /fit-program/order-lines/{id}"
      - "GET /fit-program/order-lines"
      - "GET /fit-program/return-cases/{id}"
      - "GET /fit-program/return-cases"
      - "GET /fit-program/return-cases/{id}/cost-postings"
      - "GET /fit-program/fit-feedback/{id}"
      - "GET /fit-program/fit-feedback"
      - "GET /fit-program/interventions/{id}"
      - "GET /fit-program/interventions/{id}/savings-report"
      - "GET /fit-program/intervention-deployments/{id}"
      - "GET /fit-program/intervention-deployments"

  - name: VendorUser
    description: "brand-side operator that captures and corrects measurement specifications for its own items"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /fit-program/measurement-specs"
      - "POST /fit-program/measurement-specs/{id}/submit"
      - "POST /fit-program/measurement-specs/{id}/resubmit"
    shared_operations:
      - "GET /fit-program/vendors/{id}"
      - "GET /fit-program/catalog-items/{id}"
      - "GET /fit-program/measurement-specs/{id}"
      - "GET /fit-program/measurement-specs"

  - name: FitAnalyst
    description: "verifies vendor specifications, standardizes brand sizes onto charts and turns fit guidance on"
    identity: opaque
    exclusive_operations:
      - "POST /fit-program/measurement-specs/{id}/verify"
      - "POST /fit-program/size-chart-mappings"
      - "POST /fit-program/catalog-items/{id}/publish-guidance"
    shared_operations:
      - "GET /fit-program/vendors/{id}"
      - "GET /fit-program/catalog-items/{id}"
      - "GET /fit-program/catalog-items"
      - "GET /fit-program/catalog-items/{id}/fit-recommendation"
      - "GET /fit-program/measurement-specs/{id}"
      - "GET /fit-program/measurement-specs"
      - "GET /fit-program/size-charts/{id}"
      - "GET /fit-program/size-chart-mappings/{id}"
      - "GET /fit-program/size-chart-mappings"
      - "GET /fit-program/fit-feedback/{id}"
      - "GET /fit-program/fit-feedback"
      - "GET /fit-program/interventions/{id}"
      - "GET /fit-program/interventions/{id}/savings-report"
      - "GET /fit-program/intervention-deployments/{id}"
      - "GET /fit-program/intervention-deployments"

  - name: ReturnsAuditor
    description: "codes return reasons and closes cases; the operator who classified a case may never resolve it"
    identity: opaque
    exclusive_operations:
      - "POST /fit-program/return-cases/{id}/classify"
      - "POST /fit-program/return-cases/{id}/resolve"
      - "POST /fit-program/return-cases/{id}/void"
    shared_operations:
      - "GET /fit-program/catalog-items/{id}"
      - "GET /fit-program/catalog-items"
      - "GET /fit-program/customer-profiles/{id}"
      - "GET /fit-program/return-policies/{id}"
      - "GET /fit-program/return-policies"
      - "GET /fit-program/order-lines/{id}"
      - "GET /fit-program/order-lines"
      - "GET /fit-program/return-cases/{id}"
      - "GET /fit-program/return-cases"
      - "GET /fit-program/return-cases/{id}/cost-postings"

  - name: Customer
    description: "shopper who opens returns, publishes reviewer fit feedback and reads fit guidance"
    identity: "entity_backed:CustomerProfile"
    exclusive_operations:
