    code: 200
    input: [release_ref]
    output: LienRecord
    side_effects: ["lien.status = RELEASED", "recompute vessel.liens_status", "increments lien.version by 1"]
  - method: GET
    path: "/yacht/vessels/{id}/documentation-records"
    description: "List documentation records (COD, state title, abstract) for a vessel"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: DocumentationRecord[]
    side_effects: []
  - method: POST
    path: "/yacht/vessels/{id}/documentation-records"
    description: "File a documentation record; filing a same-kind record supersedes the prior VALID one"
    roles: [ListingAgent, ClosingOfficer]
    code: 201
    input: [record_kind, instrument_no, issue_date]
    output: DocumentationRecord
    side_effects: ["prior VALID record of same kind on this vessel -> SUPERSEDED"]
  - method: POST
    path: "/yacht/listings"
