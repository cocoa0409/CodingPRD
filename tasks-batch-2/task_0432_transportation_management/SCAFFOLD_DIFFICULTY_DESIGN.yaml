  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: load_state_beats_capacity_fiscal_on_add_shipment
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - state_machines.Load.BUILDING_to_DISPATCHED
        distinguishing_aspect: |
          Error-category pair STATE (priority 8, ERR_LOAD_NOT_BUILDING) vs
          BUSINESS_FISCAL (priority 13, ERR_LOAD_CAPACITY_EXCEEDED). A request
          that adds an over-capacity shipment to an already-DISPATCHED load
          violates both; the state check (lower priority number) wins, so
          ERR_LOAD_NOT_BUILDING is returned, not ERR_LOAD_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Load (capacity 5000) already DISPATCHED with one 4000-lb shipment, dock appt scheduled."
            - "A second BOOKED shipment of 6000 lbs exists (would exceed capacity if it could be added)."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 4000, declared_value_cents: 100000 }
              as: ShipperOps
              captures: { order1_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order1_id}", mode: "TL", distance_miles: 300, weight_lbs: 4000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship1_id: $.data.id }
            - call: "POST /tms/shipments/${ship1_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender1_id: $.data.id }
            - call: "POST /tms/tenders/${tender1_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 5000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship1_id}", expected_load_version: "${load_v}" }
              as: DockOps
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load_id}", dock_door: "D1", start_minute: 200, end_minute: 260 }
              as: DockOps
            - call: "POST /tms/loads/${load_id}/dispatch"
              payload: {}
              as: DockOps
              captures: { load_v2: $.data.version }
            - call: "POST /tms/orders"
              payload: { customer_ref: "C2", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 6000, declared_value_cents: 100000 }
              as: ShipperOps
              captures: { order2_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order2_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship2_id: $.data.id }
            - call: "POST /tms/shipments/${ship2_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender2_id: $.data.id }
            - call: "POST /tms/tenders/${tender2_id}/accept"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship2_id}", expected_load_version: "${load_v2}" }
              as: DockOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_LOAD_NOT_BUILDING"
            - "response.http_status == 409"

      - name: shipment_state_beats_load_referential_on_depart
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.Shipment.execution_status=PENDING_to_execution_status=IN_TRANSIT
        distinguishing_aspect: |
          Error-category pair STATE (priority 8, ERR_SHIPMENT_NOT_BOOKED) vs
          BUSINESS_REFERENTIAL (priority 9, ERR_LOAD_NOT_DISPATCHED). Departing a
          shipment that is neither BOOKED nor on a DISPATCHED load violates both;
          the state precondition (lower number) wins -> ERR_SHIPMENT_NOT_BOOKED.
        test_recipe:
          setup:
            - "Shipment created but never tendered (tender_status UNTENDERED, no load)."
          setup_api_calls:
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /tms/shipments/${ship_id}/depart"
              payload: {}
              as: CarrierOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHIPMENT_NOT_BOOKED"
            - "response.http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: load_capacity_equal_allowed_over_rejected
        grounds:
