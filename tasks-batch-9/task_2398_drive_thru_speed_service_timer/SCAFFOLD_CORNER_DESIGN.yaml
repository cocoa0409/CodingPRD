# =============================================================================
# §1.9 Scaffold Corner Design — Drive-Thru Speed-of-Service & Timer Program
# =============================================================================
# Breadth probe over §1.1–§1.7 of SCAFFOLD.yaml. Section and claim_type values
# are taken verbatim from references/claim-extraction-guide.md; no category is
# invented here. Corners already asserted by a §1.8 instance appear as
# excluded_because stubs naming that instance.
#
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * At least one VolumeTierPolicy MUST exist before POST /drive-thru/restaurants,
#     because store registration derives volume_tier from cars_per_hour 0.0 and
#     otherwise fails ERR_TIER_POLICY_INCOMPLETE. Chains that never change tier use
#     a SINGLE unbounded band (TIER_1, floor 0, ceiling omitted -> null); chains
#     whose assertions depend on tier movement create all four bands
#     TIER_1 [0,6) / TIER_2 [6,12) / TIER_3 [12,18) / TIER_4 [18, null).
#   * Operator acts with as_user_id = the Restaurant id it owns.
#     ShiftLeader acts with as_user_id = a StaffMember id of that restaurant.
#     ProgramAdmin / AccuracyAuditor / MarketCoach identities are opaque:
#     "admin-1", "auditor-1", "coach-1", "coach-2".
#   * The logical clock starts at 2026-08-01T00:00:00Z and only ever moves forward
#     via POST /drive-thru/_clock/set_current_utc. No wall-clock time is used.
#   * LUNCH DaypartProfile is [660, 840) minutes with targets 25 / 95 / 40 / 75,
#     total_target_seconds 235.
#   * The literal 00000000-0000-4000-8000-000000000000 is used as a
#     guaranteed-absent identifier for not-found corners.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: entity_restaurant_creation_returns_declared_fields
        claim_type: creation
        grounds:
          - entities.Restaurant
          - endpoints.POST_drive-thru_restaurants
          - response_envelope
        distinguishing_aspect: "A store created with all six declared inputs returns 201 with merge_slots_free seeded to merge_slots_capacity, labor_minutes_available seeded to labor_minutes_budget, cars_per_hour figures 0.0 and service_posture OPEN."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band so the 0.0 car rate resolves to a tier."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Creation Store", store_number: "C-2398-01", lane_config: "DUAL_TANDEM", merge_slots_capacity: 4, labor_minutes_budget: 480, staffing_basis: "OBSERVED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          assert:
            - "HTTP 201 and the response body is wrapped as { data: { ... } } per the declared response envelope"
            - "Restaurant.${r_id}.name == \"Corner Creation Store\", store_number == \"C-2398-01\", lane_config == DUAL_TANDEM"
            - "Restaurant.${r_id}.merge_slots_capacity == 4 and merge_slots_free == 4"
            - "Restaurant.${r_id}.labor_minutes_budget == 480, labor_minutes_committed == 0, labor_minutes_available == 480"
            - "Restaurant.${r_id}.cars_closed_trailing == 0, cars_per_hour_observed == 0.0, cars_per_hour_effective == 0.0, volume_tier == TIER_1"
            - "Restaurant.${r_id}.required_oot_count == 0, deployed_oot_count == 0, open_remake_count == 0, remake_cost_accrued_cents == 0"
            - "Restaurant.${r_id}.posture_override == NONE, freeze_reason is null, service_posture == OPEN, version == 1"

      - name: entity_restaurant_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_drive-thru_restaurants_restaurantId
          - entities.Restaurant
        distinguishing_aspect: "GET /drive-thru/restaurants/{restaurantId} returns exactly the row written by the create call, including the derived volume_tier, and is readable by a role that did not create it."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and one registered SINGLE-lane store."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Retrieval Store", store_number: "C-2398-02", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: AccuracyAuditor
              as_user_id: "auditor-1"
              captures: { got_id: $.data.id, got_number: $.data.store_number, got_tier: $.data.volume_tier }
          assert:
            - "HTTP 200 and ${got_id} == ${r_id}"
            - "${got_number} == \"C-2398-02\" and ${got_tier} == TIER_1"
            - "Restaurant.${r_id}.service_posture == OPEN and Restaurant.${r_id}.version == 1 (a read never bumps version)"

      - name: entity_timer_loop_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_drive-thru_timer-loops
          - entities.TimerLoop.fields.car_sequence
          - response_envelope
        distinguishing_aspect: "With two loops stored, GET /drive-thru/timer-loops?limit=1&offset=0 returns exactly one element with total_count 2 and has_more true, and offset=1 returns the second with has_more false."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store; one StaffMember; one ACTIVE LUNCH profile."
            - "Two TimerLoops created at 11:00:00Z and 11:00:05Z, both still OPEN."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Listing Store", store_number: "C-2398-03", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "List Leader", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:05Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l2_id: $.data.id }
          trigger:
            - call: "GET /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", limit: 1, offset: 0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { page1_first: "$.data[0].id", page1_seq: "$.data[0].car_sequence" }
            - call: "GET /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", limit: 1, offset: 1 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { page2_first: "$.data[0].id", page2_seq: "$.data[0].car_sequence" }
          assert:
            - "First page: HTTP 200, exactly 1 element, meta.total_count == 2, meta.has_more == true, ${page1_first} == ${l1_id}, ${page1_seq} == 1"
            - "Second page: exactly 1 element, meta.total_count == 2, meta.has_more == false, ${page2_first} == ${l2_id}, ${page2_seq} == 2"
            - "Ordering is by created_at ascending — never by id — so the earlier loop ${l1_id} is on page 1"
            - "GET /drive-thru/timer-loops?restaurant_id=${r_id}&timing_state=CLOSED returns 0 elements with total_count 0"

      - name: entity_restaurant_not_found_on_absent_identifier
        claim_type: not_found
        grounds:
          - errors[ERR_RESTAURANT_NOT_FOUND]
          - validations.priority_3_path_existence
        distinguishing_aspect: "GET /drive-thru/restaurants/{restaurantId} against an identifier no create call ever minted returns ERR_RESTAURANT_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and one unrelated registered store, so the table is non-empty."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Decoy Store", store_number: "C-2398-04", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "GET /drive-thru/restaurants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == ERR_RESTAURANT_NOT_FOUND"
            - "The response carries an error envelope with a human-readable message, not a data payload"
            - "Restaurant.${r_id} is untouched: version == 1"

      - name: entity_daypart_profile_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_6_ERR_INVALID_REQUEST
          - endpoints.POST_drive-thru_daypart-profiles
        distinguishing_aspect: "Omitting window_target_seconds — an input with no declared default — is rejected with ERR_INVALID_REQUEST (400) and creates no DaypartProfile row."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and one SINGLE-lane store."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Required Fields Store", store_number: "C-2398-05", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /drive-thru/daypart-profiles?restaurant_id=${r_id} returns total_count 0"
            - "Restaurant.${r_id}.version == 1 (a rejected create bumps nothing)"

      - name: entity_restaurant_staffing_basis_defaults_to_observed
        claim_type: defaults
        grounds:
          - entities.Restaurant.fields.staffing_basis
          - endpoints.POST_drive-thru_restaurants
        distinguishing_aspect: "Omitting the optional staffing_basis input stores OBSERVED, so oot_requirement uses the observed-rate variant until an operator patches it."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Default Basis Store", store_number: "C-2398-06", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, basis: $.data.staffing_basis }
          assert:
            - "HTTP 201 and ${basis} == OBSERVED"
            - "Restaurant.${r_id}.staffing_basis == OBSERVED and Restaurant.${r_id}.cars_per_hour_effective == 0.0"

      - name: entity_staff_member_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.StaffMember.fields.oot_certified
          - entities.StaffMember.fields.window_certified
          - entities.StaffMember.fields.max_consecutive_deployment_minutes
          - endpoints.POST_drive-thru_staff-members
        distinguishing_aspect: "Creating a StaffMember with only restaurant_id and full_name stores oot_certified false, window_certified false and max_consecutive_deployment_minutes 90 — a different entity's default set from the Restaurant staffing_basis default."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and one SINGLE-lane store."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Staff Defaults Store", store_number: "C-2398-07", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Default Dana" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { s_id: $.data.id, oot: $.data.oot_certified, win: $.data.window_certified, maxmin: $.data.max_consecutive_deployment_minutes }
          assert:
            - "HTTP 201, ${oot} == false, ${win} == false, ${maxmin} == 90"
            - "StaffMember.${s_id}.staff_state == AVAILABLE and StaffMember.${s_id}.deployed_minutes_today == 0"
            - "StaffMember.${s_id}.restaurant_id == ${r_id}"

      - name: entity_daypart_profile_total_target_seconds_computed
        claim_type: computed_fields
        grounds:
          - entities.DaypartProfile.fields.total_target_seconds
          - endpoints.POST_drive-thru_daypart-profiles
        distinguishing_aspect: "total_target_seconds is the sum of the four segment targets computed by the server (25 + 95 + 40 + 75 = 235) and is not accepted as an input."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and one SINGLE-lane store."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Computed Total Store", store_number: "C-2398-08", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "BREAKFAST", start_minute: 360, end_minute: 660, greet_target_seconds: 20, order_target_seconds: 70, pull_forward_target_seconds: 30, window_target_seconds: 60 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id, total: $.data.total_target_seconds, st: $.data.profile_state }
          assert:
            - "HTTP 201 and ${total} == 180 (20 + 70 + 30 + 60)"
            - "${st} == DRAFT — the declared initial state, not ACTIVE"
            - "DaypartProfile.${dp_id}.start_minute == 360 (inclusive) and end_minute == 660 (exclusive)"

      - name: entity_deployment_planned_minutes_computed_with_ceiling
        claim_type: computed_fields
        grounds:
          - entities.OrderTakerDeployment.fields.planned_minutes
          - endpoints.POST_drive-thru_order-taker-deployments
        distinguishing_aspect: "planned_minutes is ceil((planned_end_at - planned_start_at) / 60), so a 1810-second interval stores 31 minutes rather than 30 — a different computed field on a different entity from total_target_seconds."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store with labor_minutes_budget 300; one StaffMember with max_consecutive_deployment_minutes 90; one ACTIVE LUNCH profile."
            - "The requested interval is 11:00:00Z..11:30:10Z, i.e. 1810 seconds."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Ceiling Minutes Store", store_number: "C-2398-09", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Ceil Carter", oot_certified: true, max_consecutive_deployment_minutes: 90 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { s_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/order-taker-deployments"
              payload: { restaurant_id: "${r_id}", staff_member_id: "${s_id}", daypart_profile_id: "${dp_id}", position: "OOT_LANE_A", planned_start_at: "2026-08-01T11:00:00Z", planned_end_at: "2026-08-01T11:30:10Z" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { d_id: $.data.id, minutes: $.data.planned_minutes, st: $.data.deployment_state }
          assert:
            - "HTTP 201 and ${minutes} == 31 (1810 / 60 == 30.1666..., rounded UP)"
            - "${st} == PLANNED and OrderTakerDeployment.${d_id}.labor_minutes_charged == 0"
            - "OrderTakerDeployment.${d_id}.activated_at is null and released_at is null"
            - "Restaurant.${r_id}.labor_minutes_committed == 0 (creation does not commit labor)"

      - name: entity_restaurant_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Restaurant.fields.id
          - entities.Restaurant.fields.created_at
          - entities.Restaurant.fields.version
          - endpoints.POST_drive-thru_restaurants
        distinguishing_aspect: "id, created_at, updated_at and version are system-sourced: the create response carries server-minted values, created_at equals the logical clock at creation, and version starts at 1."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; the logical clock is pinned to 2026-08-01T09:15:00Z before the create."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:15:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner System Fields Store", store_number: "C-2398-10", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, made: $.data.created_at, ver: $.data.version }
          assert:
            - "HTTP 201; ${r_id} is a server-minted identifier present in the response"
            - "${made} == 2026-08-01T09:15:00Z — created_at is stamped from the logical clock, never from wall-clock time"
            - "${ver} == 1 and Restaurant.${r_id}.updated_at == 2026-08-01T09:15:00Z"

      - name: entity_volume_tier_policy_unknown_enum_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.VolumeTierPolicy.fields.merge_award_bias
          - validations.priority_6_ERR_INVALID_REQUEST
        distinguishing_aspect: "merge_award_bias accepts only ALTERNATE, LONGEST_WAIT or ACCURACY_FIRST; the unknown member SHORTEST_LINE is rejected with ERR_INVALID_REQUEST and no policy row is stored."
        test_recipe:
          setup:
            - "Empty database — VolumeTierPolicy has no prerequisites."
          setup_api_calls:
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "SHORTEST_LINE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /drive-thru/volume-tier-policies returns total_count 0"

      - name: entity_daypart_profile_out_of_range_number_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.DaypartProfile.fields.start_minute
          - entities.DaypartProfile.fields.greet_target_seconds
        distinguishing_aspect: "start_minute is constrained to 0..1439, so 1440 is rejected with ERR_INVALID_REQUEST — a numeric-range violation rather than an enum violation."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band and one SINGLE-lane store."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
