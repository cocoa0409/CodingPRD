          setup: ["Season; two programs PG1 (three sessions) and PG2 (one session)"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
