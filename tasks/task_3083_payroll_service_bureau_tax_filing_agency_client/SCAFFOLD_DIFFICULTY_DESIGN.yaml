              as: BureauOnboarder
              captures: { reg_if_fed: $.data.id }
            - call: "POST /registrations/${reg_if_fed}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_if}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_if}/registrations"
              payload: { jurisdiction_id: "${j_ca}", agency_account_number: "EDD-IF", poa_document_ref: "POA-IF-CA" }
              as: BureauOnboarder
              captures: { reg_if_ca: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: BureauCompliance
            - call: "GET /clients/${cl_if}"
              payload: {}
              as: BureauCompliance
              captures: { cl_if_v1: $.data.version }
            - call: "POST /returns"
              payload: { client_id: "${cl_if}", jurisdiction_id: "${j_ca}", period: "2026-Q3", expected_client_version: "${cl_if_v1}" }
              as: BureauTaxFiler
              captures: { ret_man: $.data.id, ret_man_method: $.data.filing_method }
            - call: "POST /returns/${ret_man}/file"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-alpha"
          trigger:
            - call: "POST /registrations/${reg_if_ca}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "GET /returns/${ret_man}"
              payload: {}
              as: BureauTaxFiler
              captures: { ret_man_method_after: $.data.filing_method, ret_man_status: $.data.status }
            - call: "GET /clients/${cl_if}"
              payload: {}
              as: BureauCompliance
              captures: { cl_if_v2: $.data.version }
            - call: "POST /returns"
              payload: { client_id: "${cl_if}", jurisdiction_id: "${j_ca}", period: "2026-Q4", expected_client_version: "${cl_if_v2}" }
              as: BureauTaxFiler
              captures: { ret_elec: $.data.id, ret_elec_method: $.data.filing_method }
          assert:
            - "ret_man_method == MANUAL_INTERIM  (registration was PENDING at creation)"
            - "after verification, ret_man_method_after == MANUAL_INTERIM and ret_man_status == FILED  (no retroactive rewrite of the interim filing)"
            - "ret_elec_method == ELECTRONIC  (verification unlocked electronic filing for returns created after)"

