# =============================================================================
# Scaffold: Syndicated Study Fielding, Award Licensing & Client Subscriptions
# Flat topology; all collections top-level under /research.
# =============================================================================

scenario: |
  Syndicated Study Fielding, Award Licensing & Client Subscriptions (J.D. Power): study design with sample frames, questionnaire development and industry-specific measurement dimensions, fielding through panels and customer lists with response quality controls and minimum sample thresholds per brand, index score computation with weighting across factors and statistical significance testing for rankings, award determination rules including eligibility thresholds and tie handling, award usage licensing where a winner pays to advertise the recognition with usage guidelines and monitoring, subscription products delivering deeper diagnostics and competitive benchmarking to clients, methodology changes and their effect on year-over-year comparability, embargo and publication coordination with industry press

domain_name: syndicated-study-awards
api_prefix: /research

complexity_profile:
  primary_archetype: workflow_orchestration   # study pipeline with cycles, gated stages
  secondary_archetype: compliance_audit       # SoD on awards, embargo gates, usage monitoring
  complexity_layers:
    - dual_variant_calculation                # provisional vs final index; quote vs invoice fee
    - rate_threshold_triggers                 # min sample per brand; minor-audit suspension threshold
    - optimistic_concurrency                  # OCC on Study.version at methodology pin
    - scheduled_deferred_actions              # embargo lift, license/subscription expiry via logical clock
  entity_topology: flat                       # peer collections, FK references in bodies; no URL nesting except read-only sub-resources
  state_machine_shape: cyclic                 # Study FIELDING<->FIELDING_CLOSED; License ACTIVE<->SUSPENDED
  relationship_patterns:
    - many_to_many                            # Client<->Study via Subscription; Brand<->Study via SampleFrame
    - self_referential                        # Study.prior_study_id -> Study.id (year-over-year chain)
    - cross_aggregate                         # License -> Award; UsageAudit -> License; Response -> SampleFrame
  role_model: segregation_of_duties           # methodology pinner may not confirm awards (ERR_SOD_CONFLICT)
  consistency_model: immediate                # all side effects visible in the triggering response / next read

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client organization legal name" }
      - { name: client_type, type: enum, source: input, description: "BRAND | AGENCY — who buys subscriptions/licenses" }
      - { name: country, type: string, source: input, description: "ISO country of headquarters" }
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; optional — the measured brand this client speaks for; required for diagnostics", constraints: "must reference an existing Brand when provided" }

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Measured brand name (e.g. a marque)" }
      - { name: industry_code, type: string, source: input, description: "Industry vertical this brand competes in" }

  - name: Study
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique study code, e.g. VDS-2026", constraints: "unique across all studies (ERR_DUPLICATE_STUDY_CODE)" }
      - { name: name, type: string, source: input, description: "Public study title" }
      - { name: industry_code, type: string, source: input, description: "Industry vertical measured" }
      - { name: cycle_year, type: integer, source: input, description: "Study cycle year (e.g. 2026)" }
      - { name: prior_study_id, type: string, source: input, description: "FK -> Study.id; optional — prior cycle of the same program for year-over-year comparison", constraints: "nullable; must reference an existing Study when provided" }
      - { name: min_sample_per_brand, type: integer, source: input, description: "Minimum ACCEPTED responses per brand for award eligibility", constraints: ">= 1" }
      - { name: significance_alpha, type: number, source: input, description: "Two-tailed alpha used for significance testing documentation (e.g. 0.05); the z_value used in math lives on the pinned MethodologyVersion" }
      - { name: embargo_lift_at, type: datetime, source: input, description: "ISO8601 UTC instant when results may be published; publication requires logical clock >= this instant" }
      - { name: status, type: enum, source: system, description: "DRAFT | DESIGN_LOCKED | FIELDING | FIELDING_CLOSED | SCORING | SCORED | AWARDS_SET | PUBLISHED | CANCELLED" }
      - { name: active_methodology_id, type: string, source: system, description: "FK -> MethodologyVersion.id; nullable — set when a methodology version is pinned", constraints: "null until first pin" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant of PUBLISHED transition; null until published" }

  - name: MethodologyVersion
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; owning study" }
      - { name: change_class, type: enum, source: input, description: "FULL_COMPARABLE | ADJUSTED | BREAK — declared year-over-year comparability of this methodology vs the prior cycle" }
      - { name: change_notes, type: string, source: input, description: "Optional prose describing the methodology change", constraints: "nullable" }
      - { name: min_duration_seconds, type: integer, source: input, description: "Speeder threshold: responses with duration_seconds < this are REJECTED", constraints: ">= 1" }
      - { name: straightline_min_items, type: integer, source: input, description: "Straightline rule applies only when item_count >= this value", constraints: ">= 1" }
      - { name: pooled_sd_1000, type: number, source: input, description: "Pooled standard deviation on the 1000-point index scale used in critical-difference tests", constraints: "> 0" }
      - { name: z_value, type: number, source: input, description: "Two-tailed z statistic used in critical-difference tests (e.g. 1.96)", constraints: "> 0" }
      - { name: tie_epsilon, type: number, source: input, description: "Index-point half-width for award ties: brands within this many points share a rank", constraints: ">= 0" }
      - { name: version_no, type: integer, source: system, description: "Sequential per-study methodology version number, starting at 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | PINNED | SUPERSEDED" }
      - { name: pinned_by_user_id, type: string, source: system, description: "X-User-ID of the actor who pinned this version; used by segregation-of-duties check at award determination" }

  - name: Factor
    parent: null
    common_fields: false
    fields:
      - { name: methodology_version_id, type: string, source: system, description: "FK -> MethodologyVersion.id; set from the enclosing methodology create call" }
      - { name: code, type: string, source: input, description: "Short factor code, e.g. QUAL (measurement dimension)", constraints: "unique within the methodology version" }
      - { name: name, type: string, source: input, description: "Human-readable dimension name" }
      - { name: weight_bp, type: integer, source: input, description: "Weight in basis points; weights of a methodology must sum to exactly 10000 at pin time", constraints: "0 < weight_bp < 10000" }
      - { name: ordinal, type: integer, source: input, description: "Display order of the factor", constraints: ">= 1" }

  - name: SampleFrame
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id" }
      - { name: source_type, type: enum, source: input, description: "PANEL | CUSTOMER_LIST — fielding channel" }
      - { name: target_completes, type: integer, source: input, description: "Planned completes for this brand frame", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — created OPEN; closed manually, on fielding close, or on study cancel; reopened only by the fielding-reopen cascade for shortfall brands" }

  - name: Response
    parent: null
    common_fields: true
    fields:
      - { name: frame_id, type: string, source: input, description: "FK -> SampleFrame.id; the frame this response arrives through" }
      - { name: respondent_token, type: string, source: input, description: "Stable respondent identifier used by the cross-response duplicate sweep within a brand" }
      - { name: duration_seconds, type: integer, source: input, description: "Completion time reported by the survey platform", constraints: ">= 0" }
      - { name: item_count, type: integer, source: input, description: "Number of questionnaire items answered", constraints: ">= 1" }
      - { name: distinct_values, type: integer, source: input, description: "Number of distinct answer values used across items (1 = straightlined)", constraints: ">= 1" }
      - { name: factor_scores, type: array, source: input, description: "Array of {factor_code, score} — one entry per factor of the study's pinned methodology; score integer 1..10" }
      - { name: study_id, type: string, source: computed, description: "Denormalized from the referenced SampleFrame at ingest (not a foreign key); enables study-scoped filtering" }
      - { name: brand_id, type: string, source: computed, description: "Denormalized from the referenced SampleFrame at ingest (not a foreign key)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of ingest; drives duplicate-sweep chronological ordering" }
      - { name: quality_status, type: enum, source: system, description: "ACCEPTED | REJECTED — classified synchronously at ingest; sweep may later flip ACCEPTED -> REJECTED" }
      - { name: reject_reason, type: enum, source: system, description: "SPEEDER | STRAIGHTLINE | DUPLICATE | null — set when quality_status is REJECTED" }

  - name: BrandResult
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id" }
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: provisional_accepted_n, type: integer, source: system, description: "ACCEPTED response count for the brand at the moment of fielding close, BEFORE the duplicate sweep" }
      - { name: accepted_n, type: integer, source: system, description: "ACCEPTED response count for the brand AFTER the duplicate sweep (recomputed at each close and at compute)" }
      - { name: provisional_index, type: integer, source: system, description: "Index score over the pre-sweep ACCEPTED set at fielding close; null when that set is empty", constraints: "nullable" }
      - { name: final_index, type: integer, source: system, description: "Index score over the post-sweep ACCEPTED set, written by scoring compute; null until computed or when accepted_n is 0", constraints: "nullable" }
      - { name: eligible, type: boolean, source: system, description: "accepted_n >= study.min_sample_per_brand, written by scoring compute; null until computed", constraints: "nullable" }
      - { name: significance_group, type: integer, source: system, description: "1-based significance cluster assigned at compute (eligible brands only); null otherwise", constraints: "nullable" }
      - { name: rank_position, type: integer, source: system, description: "1-based competition rank with tie_epsilon sharing (eligible brands only); null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | AWARDED — PROVISIONAL at close, FINAL after compute, AWARDED for winners at award determination" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id" }
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: rank_position, type: integer, source: system, description: "Copied from the winning BrandResult at determination (always 1 for winners, ties included)" }
      - { name: significance_group, type: integer, source: system, description: "Copied from the winning BrandResult at determination (always 1 for winners)" }
      - { name: status, type: enum, source: system, description: "EMBARGOED | PUBLISHED — created EMBARGOED at determination; PUBLISHED by the study publish cascade" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant of publication; null while EMBARGOED", constraints: "nullable" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; the recognition being licensed" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the paying licensee" }
      - { name: tier, type: enum, source: input, description: "DIGITAL | NATIONAL | GLOBAL — usage scope" }
      - { name: term_months, type: integer, source: input, description: "License term", constraints: "one of 12 | 24 | 36 (ERR_LICENSE_TERM_INVALID)" }
      - { name: markets_count, type: integer, source: input, description: "Number of markets the recognition will be advertised in", constraints: ">= 1 (ERR_MARKETS_INVALID)" }
      - { name: fee_quote_cents, type: integer, source: system, description: "Provisional quote computed at creation: base + market surcharge only" }
      - { name: fee_final_cents, type: integer, source: system, description: "Final invoice computed at activation: term discount, prior-violation multiplier, fee floor; null until ACTIVE", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "QUOTED | ACTIVE | SUSPENDED | REVOKED | WITHDRAWN | EXPIRED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of activation; null until ACTIVE", constraints: "nullable" }
      - { name: expires_at, type: datetime, source: system, description: "activated_at + term_months calendar months; null until ACTIVE; never extended by suspension", constraints: "nullable" }
      - { name: suspension_count, type: integer, source: system, description: "Number of ACTIVE -> SUSPENDED transitions this license has undergone", default: 0 }

  - name: UsageAudit
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; the license whose advertising usage is audited" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR — drives the suspension cascade" }
      - { name: note, type: string, source: input, description: "Optional auditor note", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | RESOLVED" }
      - { name: resolution, type: enum, source: system, description: "CONFIRMED | LICENSE_REVOKED_AUTO | null — set when the audit reaches RESOLVED", constraints: "nullable" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; subscribing client" }
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; study whose diagnostics/benchmarks are delivered" }
      - { name: tier, type: enum, source: input, description: "DIAGNOSTIC | BENCHMARK — BENCHMARK unlocks competitive benchmarking and YoY" }
      - { name: starts_at, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Coverage window end (INCLUSIVE — closed-interval semantics)", constraints: "must be > starts_at" }
      - { name: status, type: enum, source: system, description: "TRIAL | ACTIVE | CANCELLED | EXPIRED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Study
    initial_state: DRAFT
    terminal_states: [PUBLISHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DESIGN_LOCKED
        trigger: "POST /research/methodology-versions/{id}/pin (cascade, not the study state endpoint)"
        actor: MethodologyLead
        preconditions:
          - "pin's own preconditions hold (see MethodologyVersion machine)"
        side_effects:
          - "Study.active_methodology_id set to the pinned MethodologyVersion"
          - "Study.version incremented by 1"
        note: "DESIGN_LOCKED is reachable only via a successful pin; POST .../state {to_status: DESIGN_LOCKED} is rejected with ERR_INVALID_STATE."
      - from: DESIGN_LOCKED
        to: FIELDING
        trigger: "POST /research/studies/{id}/state {to_status: FIELDING}"
        actor: StudyAdmin
        preconditions:
          - "At least one SampleFrame exists for the study (ERR_NO_FRAMES)"
        side_effects: []
      - from: FIELDING
        to: FIELDING_CLOSED
        trigger: "POST /research/studies/{id}/state {to_status: FIELDING_CLOSED}"
        actor: StudyAdmin
        preconditions: []
        side_effects:
          - "(hop 1) Every SampleFrame of the study in OPEN -> CLOSED"
          - "(hop 2) Each frame closure triggers the duplicate sweep within that frame's brand: among ACCEPTED Responses sharing a respondent_token, keep the earliest submitted_at (tie: prefer PANEL frame over CUSTOMER_LIST; further tie: earliest created_at); all others flip ACCEPTED -> REJECTED with reject_reason DUPLICATE"
          - "(hop 3) Each flip recomputes the brand's BrandResult: upsert one row per brand having a frame; provisional_accepted_n and provisional_index snapshot the PRE-sweep ACCEPTED set; accepted_n is the POST-sweep count; status = PROVISIONAL"
      - from: FIELDING_CLOSED
        to: FIELDING
        trigger: "POST /research/studies/{id}/state {to_status: FIELDING} (reopen)"
        actor: StudyAdmin
        preconditions:
          - "At least one brand with a frame has accepted_n < study.min_sample_per_brand (ERR_NO_SHORTFALL)"
        side_effects:
          - "SampleFrames whose brand is short (accepted_n < min_sample_per_brand) flip CLOSED -> OPEN; frames of non-short brands stay CLOSED"
      - from: SCORING
        to: FIELDING
        trigger: "POST /research/studies/{id}/state {to_status: FIELDING} (reopen)"
        actor: StudyAdmin
        preconditions:
          - "At least one brand with a frame has accepted_n < study.min_sample_per_brand (ERR_NO_SHORTFALL)"
        side_effects:
          - "Shortfall-brand SampleFrames flip CLOSED -> OPEN"
      - from: SCORED
        to: FIELDING
        trigger: "POST /research/studies/{id}/state {to_status: FIELDING} (reopen after compute)"
        actor: StudyAdmin
        preconditions:
          - "At least one brand with a frame has accepted_n < study.min_sample_per_brand (ERR_NO_SHORTFALL)"
        side_effects:
          - "Shortfall-brand SampleFrames flip CLOSED -> OPEN"
          - "Every BrandResult of the study resets eligible, significance_group, rank_position, final_index to null and status -> PROVISIONAL (computed results are invalidated by new fielding)"
      - from: FIELDING_CLOSED
        to: SCORING
        trigger: "POST /research/studies/{id}/state {to_status: SCORING}"
        actor: StudyAdmin
        preconditions: []
        side_effects: []
      - from: SCORING
        to: SCORED
        trigger: "POST /research/studies/{id}/scoring/compute"
        actor: AwardsOfficer
        preconditions:
          - "At least one ACCEPTED Response exists in the study (ERR_NO_RESPONSES)"
        side_effects:
          - "For each BrandResult: recompute accepted_n; compute final_index (null when accepted_n == 0); eligible = accepted_n >= min_sample_per_brand; assign significance_group and rank_position over the eligible set per significance_grouping and rank_assignment calculations; status PROVISIONAL -> FINAL"
      - from: SCORED
        to: AWARDS_SET
        trigger: "POST /research/studies/{id}/awards/determine"
        actor: AwardsOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != active methodology's pinned_by_user_id (ERR_SOD_CONFLICT)"
          - "At least one BrandResult has eligible == true (ERR_NO_ELIGIBLE_BRAND)"
        side_effects:
          - "(hop 1) Create one Award (status EMBARGOED) per BrandResult with rank_position == 1 AND significance_group == 1 (ties produce multiple Awards)"
          - "(hop 2) Each created Award flips its winning BrandResult FINAL -> AWARDED"
      - from: AWARDS_SET
        to: PUBLISHED
        trigger: "POST /research/studies/{id}/state {to_status: PUBLISHED}"
        actor: StudyAdmin
        preconditions:
          - "Logical clock >= study.embargo_lift_at (ERR_EMBARGO_ACTIVE)"
        side_effects:
          - "Every Award of the study: EMBARGOED -> PUBLISHED, published_at = clock"
          - "Study.published_at = clock"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /research/studies/{id}/state {to_status: CANCELLED}"
        actor: StudyAdmin
        preconditions: []
        side_effects: []
      - from: DESIGN_LOCKED
        to: CANCELLED
        trigger: "POST /research/studies/{id}/state {to_status: CANCELLED}"
        actor: StudyAdmin
        preconditions: []
        side_effects: []
      - from: FIELDING
        to: CANCELLED
        trigger: "POST /research/studies/{id}/state {to_status: CANCELLED}"
        actor: StudyAdmin
        preconditions: []
        side_effects:
          - "Every SampleFrame of the study in OPEN -> CLOSED"
        note: "Cancellation is impossible once fielding has closed; PUBLISHED and CANCELLED are terminal."

  - entity: MethodologyVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PINNED
        trigger: "POST /research/methodology-versions/{id}/pin"
        actor: MethodologyLead
        preconditions:
          - "Study.status in {DRAFT, DESIGN_LOCKED} (ERR_METHODOLOGY_IMMUTABLE once fielding has begun or the study is terminal)"
          - "OCC: expected_study_version == Study.version (ERR_STALE_VERSION)"
          - "Factors of this version are non-empty, each 0 < weight_bp < 10000 (ERR_FACTOR_WEIGHT_INVALID), and sum(weight_bp) == 10000 exactly (ERR_WEIGHT_SUM_MISMATCH)"
        side_effects:
          - "The study's previously PINNED MethodologyVersion (if any) -> SUPERSEDED"
          - "Study.active_methodology_id = this version; pinned_by_user_id = X-User-ID"
          - "Study.status: DRAFT -> DESIGN_LOCKED (DESIGN_LOCKED unchanged)"
          - "Study.version incremented by 1"
      - from: PINNED
        to: SUPERSEDED
        trigger: "system cascade — a different MethodologyVersion of the same study is pinned"
        actor: system
        preconditions: []
        side_effects: []
        note: "A superseded version can never be re-pinned into the same study (its own DRAFT->PINNED precondition is gone); DRAFT versions simply linger until pinned."

  - entity: SampleFrame
    initial_state: OPEN
    terminal_states: []   # CLOSED is reversible via the study fielding-reopen cascade
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /research/sample-frames/{id}/state {to_status: CLOSED} (manual) OR study cascades (fielding close, cancel)"
        actor: FieldOps | system
        preconditions: []
        side_effects:
          - "On the fielding-close cascade only: closure participates in the duplicate sweep (see Study machine hop 2)"
      - from: CLOSED
        to: OPEN
        trigger: "system cascade — study fielding reopen for shortfall brands only (no manual reopen endpoint)"
        actor: system
        preconditions:
          - "Frame's brand has accepted_n < study.min_sample_per_brand"
        side_effects: []

  - entity: Response
    initial_state: "ACCEPTED or REJECTED (classified synchronously at ingest)"
    terminal_states: [REJECTED]
    transitions:
      - from: ACCEPTED
        to: REJECTED
        trigger: "system cascade — duplicate sweep at fielding close (Study machine hop 2)"
        actor: system
        preconditions:
          - "Another ACCEPTED Response in the same brand shares respondent_token with earlier submitted_at (tie: PANEL frame preferred; further tie: earliest created_at)"
        side_effects:
          - "reject_reason = DUPLICATE"
          - "Brand's accepted_n recomputed on the BrandResult (Study machine hop 3)"

  - entity: License
    initial_state: QUOTED
    terminal_states: [REVOKED, WITHDRAWN, EXPIRED]
    transitions:
      - from: QUOTED
        to: ACTIVE
        trigger: "POST /research/licenses/{id}/state {to_status: ACTIVE}"
        actor: LicensingManager
        preconditions:
          - "Award.status == PUBLISHED (ERR_AWARD_NOT_PUBLISHED)"
          - "No other License for the same Award is ACTIVE — occupation interval is half-open [activated_at, expires_at), so a predecessor whose expires_at == the new activation instant does NOT conflict (ERR_LICENSE_CONFLICT otherwise)"
        side_effects:
          - "fee_final_cents computed per license_fee_invoice calculation"
          - "activated_at = logical clock; expires_at = activated_at + term_months calendar months (clamp day-of-month to month end)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /research/licenses/{id}/state {to_status: SUSPENDED} (manual) OR audit-escalation cascade (see UsageAudit machine)"
        actor: LicensingManager | system
        preconditions: []
        side_effects:
          - "suspension_count incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /research/licenses/{id}/state {to_status: ACTIVE} (reinstate)"
        actor: LicensingManager
        preconditions:
          - "Zero UsageAudits of this license in {OPEN, ESCALATED} (ERR_AUDITS_UNRESOLVED)"
        side_effects:
          - "expires_at and fee_final_cents MUST NOT change (suspension never extends the term)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /research/licenses/{id}/state {to_status: REVOKED}"
        actor: LicensingManager
        preconditions: []
        side_effects:
          - "Every UsageAudit of this license in {OPEN, ESCALATED} -> RESOLVED with resolution LICENSE_REVOKED_AUTO"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /research/licenses/{id}/state {to_status: REVOKED}"
        actor: LicensingManager
        preconditions: []
        side_effects:
          - "Every UsageAudit of this license in {OPEN, ESCALATED} -> RESOLVED with resolution LICENSE_REVOKED_AUTO"
      - from: QUOTED
        to: WITHDRAWN
        trigger: "POST /research/licenses/{id}/state {to_status: WITHDRAWN}"
        actor: LicensingManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /research/licenses/{id}/state {to_status: EXPIRED}"
        actor: LicensingManager
        preconditions:
          - "Logical clock >= expires_at (ERR_LICENSE_NOT_EXPIRED); equality suffices — the occupation interval is half-open"
        side_effects: []

  - entity: UsageAudit
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /research/usage-audits/{id}/state {to_status: ESCALATED}"
        actor: LicensingManager
        preconditions: []
        side_effects:
          - "Cascade to License: if severity == MAJOR and License is ACTIVE -> SUSPENDED; if severity == MINOR and this audit makes count(ESCALATED, MINOR audits on the license) >= 2 and License is ACTIVE -> SUSPENDED"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /research/usage-audits/{id}/state {to_status: RESOLVED}"
        actor: LicensingManager
        preconditions: []
        side_effects:
          - "resolution = CONFIRMED"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /research/usage-audits/{id}/state {to_status: RESOLVED}"
        actor: LicensingManager
        preconditions: []
        side_effects:
          - "resolution = CONFIRMED"
          - "This audit no longer counts toward open-audit gates on reinstatement"

  - entity: Subscription
    initial_state: TRIAL
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /research/subscriptions/{id}/state {to_status: ACTIVE}"
        actor: ClientUser | StudyAdmin
        preconditions:
          - "Logical clock within [starts_at, ends_at] inclusive (ERR_SUBSCRIPTION_WINDOW_INVALID)"
          - "No other ACTIVE Subscription for the same (client_id, study_id) whose CLOSED interval [starts_at, ends_at] intersects this one — adjacency counts as conflict: another subscription ending exactly on this one's starts_at still conflicts (ERR_SUBSCRIPTION_OVERLAP)"
        side_effects: []
      - from: TRIAL
        to: CANCELLED
        trigger: "POST /research/subscriptions/{id}/state {to_status: CANCELLED}"
        actor: ClientUser | StudyAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /research/subscriptions/{id}/state {to_status: CANCELLED}"
        actor: ClientUser | StudyAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /research/subscriptions/{id}/state {to_status: EXPIRED}"
        actor: ClientUser | StudyAdmin
        preconditions:
          - "Logical clock > ends_at (ERR_SUBSCRIPTION_WINDOW_INVALID when clock <= ends_at)"
        side_effects: []

  - entity: Award
    initial_state: EMBARGOED
    terminal_states: [PUBLISHED]
    transitions:
      - from: EMBARGOED
        to: PUBLISHED
        trigger: "system cascade — study AWARDS_SET -> PUBLISHED"
        actor: system
        preconditions: []
        side_effects:
          - "published_at = logical clock"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: mv-pin-stale-study
    parent_entity: Study
    write_endpoint: "POST /research/methodology-versions/{id}/pin"
    occ_field: expected_study_version
    description: |
      Pinning a MethodologyVersion against a Study whose version has advanced
      since the caller last observed it is rejected. A successful pin mutates
      the Study (active_methodology_id, possibly status, version +1), so a
      second pin carrying the pre-pin version is stale even when both
      MethodologyVersions independently satisfy the pin preconditions.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# All money in integer cents; all index math on the 0..1000 scale;
# round_half_up to 0 decimals at every pinned rounding step.
# =============================================================================
calculations:
  - name: response_quality_classification
    trigger: "POST /research/responses (synchronously at ingest)"
    algorithm: threshold
    formula: |
      mv = study.active_methodology (the PINNED MethodologyVersion)
      if duration_seconds < mv.min_duration_seconds:
          quality_status = REJECTED, reject_reason = SPEEDER
      else if distinct_values == 1 AND item_count >= mv.straightline_min_items:
          quality_status = REJECTED, reject_reason = STRAIGHTLINE
      else:
          quality_status = ACCEPTED, reject_reason = null
      # boundary: duration_seconds == min_duration_seconds is ACCEPTED (rule is strict <)
      # boundary: item_count == straightline_min_items - 1 with distinct_values == 1 is ACCEPTED
      # speeder is checked before straightline when both conditions hold
    input_set: "the Response being created; thresholds from the study's PINNED MethodologyVersion"
    constants: {}

  - name: accepted_sample_count
    trigger: "fielding close sweep; scoring compute"
    algorithm: aggregation
    formula: |
      accepted_n(brand) = count of Responses with brand_id == brand AND quality_status == ACCEPTED
      Duplicate sweep ordering (chronological): for each respondent_token with > 1 ACCEPTED
      response in the same brand, keep the earliest submitted_at; tie -> prefer PANEL frame
      over CUSTOMER_LIST; further tie -> earliest created_at. All others -> REJECTED (DUPLICATE).
    input_set: "all Responses of the study; only quality_status == ACCEPTED count toward accepted_n"
    constants: {}

  - name: factor_score
    trigger: "inside index_score for both variants"
    algorithm: aggregation
    formula: |
      brand_factor_score(f) = round_half_up( mean(score of f over the response set) * 100 )
      -> integer on the 100..1000 scale. Each factor is rounded to an integer BEFORE the
      weighted sum (see index_score): per-factor-round-then-sum is the pinned order.
    input_set: "the response set passed in by index_score (pre-sweep for provisional, post-sweep for final)"
    precision: "0 decimal places, round_half_up"

  - name: index_score
    trigger: "fielding close (provisional variant); scoring compute (final variant)"
    algorithm: weighted_scoring
    formula: |
      index = round_half_up( SUM over all factors f of (weight_bp_f / 10000) * brand_factor_score(f) )
      Rounding order is pinned: each brand_factor_score is rounded to an integer FIRST
      (factor_score rule), then the weighted sum is rounded once at the end.
      Example of why the order matters (QUAL 6000bp / FEAT 4000bp, n=7):
      raw means 400.0 and 428.571.. -> factor scores 400 and 429 ->
      pinned: round_half_up(0.6*400 + 0.4*429) = round_half_up(411.6) = 412
      naive sum-then-round: round_half_up(0.6*400 + 0.4*428.571..) = round_half_up(411.43) = 411
    input_set: "Responses with quality_status == ACCEPTED for the (study, brand); every response covers every factor"
    precision: "0 decimal places, round_half_up"
    variants:
      - name: provisional_index
        when: "fielding close, BEFORE the duplicate sweep"
        difference: "input set is the pre-sweep ACCEPTED set (provisional_accepted_n); stored as provisional_index; null when the pre-sweep set is empty"
      - name: final_index
        when: "scoring compute, AFTER the sweep"
        difference: "input set is the post-sweep ACCEPTED set (accepted_n); stored as final_index; null when accepted_n == 0"

  - name: significance_grouping
    trigger: "scoring compute, after final_index and eligibility are known"
    algorithm: threshold
    formula: |
      eligible set E = brands with eligible == true (final_index non-null by construction)
      order E by (final_index DESC, accepted_n DESC, Brand.created_at ASC)
      walk in order; the first brand opens group 1 and is its leader:
        critical_diff(leader, i) = z_value * pooled_sd_1000 * sqrt(1/leader.accepted_n + 1/i.accepted_n)
        if leader.final_index - i.final_index > critical_diff(leader, i):
            i opens a new significance_group (previous group number + 1) and becomes its leader
        else:
            i joins the current group
      z_value and pooled_sd_1000 come from the PINNED MethodologyVersion.
      Comparison is strict >; floating point, no rounding of critical_diff.
      # worked constants: z=1.96, sd=60 -> CD(4,4)=83.156.., CD(4,8)=72.016..
    input_set: "BrandResults of the study with eligible == true"
    constants: {}

  - name: rank_assignment
    trigger: "scoring compute, together with significance_grouping"
    algorithm: weighted_scoring
    formula: |
      rank_position(i) = 1 + count{ j in E : final_index_j > final_index_i + tie_epsilon }
      Brands within tie_epsilon index points share the same rank (ties share rank 1 at the top);
      ranks skip accordingly (1, 1, 2 under exact competition semantics).
      Ineligible brands keep rank_position = null and significance_group = null.
    input_set: "BrandResults of the study with eligible == true"

  - name: award_determination
    trigger: "POST /research/studies/{id}/awards/determine"
    algorithm: threshold
    formula: |
      winners = { BrandResult i : eligible == true AND rank_position == 1 AND significance_group == 1 }
      for each winner create Award(study_id, brand_id, rank_position=1, significance_group=1, status=EMBARGOED)
      NOTE: a brand in significance_group 1 whose rank_position is 2 (within critical_diff of the
      leader but strictly more than tie_epsilon below) receives NO award.
      If winners is empty because every BrandResult is ineligible -> the transition is rejected
      (ERR_NO_ELIGIBLE_BRAND) and no Awards are created.
    input_set: "BrandResults of the study (status FINAL)"

  - name: license_fee_quote
    trigger: "POST /research/licenses (at QUOTED creation)"
    algorithm: tiered_pricing
    formula: |
      fee_quote_cents = BASE_CENTS[tier] + max(0, markets_count - INCLUDED_MARKETS[tier]) * PER_MARKET_CENTS
      The quote applies NEITHER the term discount NOR the prior-violation multiplier NOR the floor.
    input_set: "the License being created"
    constants:
      BASE_CENTS: { DIGITAL: 250000, NATIONAL: 600000, GLOBAL: 1500000 }
      INCLUDED_MARKETS: { DIGITAL: 1, NATIONAL: 3, GLOBAL: 999 }
      PER_MARKET_CENTS: 150000
      TERM_DISCOUNT: 0.85
      PRIOR_VIOLATION_MULT: 1.25
      MIN_FEE_CENTS: 220000
    variants:
      - name: fee_final_cents
        when: "license activation (QUOTED -> ACTIVE)"
        difference: "see license_fee_invoice — term discount, violation multiplier and floor apply; result differs from fee_quote_cents whenever any of those binds"

  - name: license_fee_invoice
    trigger: "POST /research/licenses/{id}/state {to_status: ACTIVE} (at activation)"
    algorithm: tiered_pricing
    formula: |
      raw = BASE_CENTS[tier] + max(0, markets_count - INCLUDED_MARKETS[tier]) * PER_MARKET_CENTS
      term_mult = 0.85 if term_months >= 24 else 1.00
      violation_mult = 1.25 if the client has any License that has ever reached REVOKED else 1.00
      fee_final_cents = max(MIN_FEE_CENTS, round_half_up(raw * term_mult * violation_mult))
      Evaluation order is pinned: surcharge first, then discounts/multipliers on the surcharged
      base, then the floor last. (>= 3 inputs with non-linear interaction: nested max, tiered
      base selection, conditional multipliers.)
    input_set: "the License being activated; the client's License history across all studies"
    constants:
      BASE_CENTS: { DIGITAL: 250000, NATIONAL: 600000, GLOBAL: 1500000 }
      INCLUDED_MARKETS: { DIGITAL: 1, NATIONAL: 3, GLOBAL: 999 }
      PER_MARKET_CENTS: 150000
      TERM_DISCOUNT: 0.85
      PRIOR_VIOLATION_MULT: 1.25
      MIN_FEE_CENTS: 220000

  - name: yoy_comparability
    trigger: "GET /research/studies/{id}/benchmarking (on read)"
    algorithm: aggregation
    formula: |
      prior = Study.prior_study_id -> Study (self-referential)
      yoy is computed for the requesting client's own brand (Client.brand_id)
      comparable = prior is not null
                   AND prior.status == PUBLISHED
                   AND this study's active methodology change_class != BREAK
                   AND both cycles have a final_index for the brand
      if comparable: yoy_delta = current.final_index - prior.final_index
      else: yoy_delta = null, yoy_comparable = false
      change_class FULL_COMPARABLE and ADJUSTED both allow the delta; BREAK suppresses it.
    input_set: "this study's BrandResults; prior study's BrandResults; active MethodologyVersion"

  - name: embargo_status
    trigger: "GET /research/studies/{id}/press-kit (on read); PUBLISHED transition (as a gate)"
    algorithm: threshold
    formula: |
      embargo_status = EMBARGOED if logical clock < study.embargo_lift_at else LIFTED
      Publication requires clock >= embargo_lift_at (equality lifts the embargo).
    input_set: "Study.embargo_lift_at; logical clock"

  - name: audit_suspension_threshold
    trigger: "UsageAudit OPEN -> ESCALATED"
    algorithm: threshold
    formula: |
      on escalation of audit a on license L:
        if a.severity == MAJOR and L.status == ACTIVE: L -> SUSPENDED
        if a.severity == MINOR and L.status == ACTIVE:
            escalated_minor = count(UsageAudits of L with status == ESCALATED and severity == MINOR)
            (the escalating audit itself already counts)
            if escalated_minor >= MINOR_SUSPENSION_THRESHOLD: L -> SUSPENDED
    input_set: "UsageAudits of the license"
    constants:
      MINOR_SUSPENSION_THRESHOLD: 2

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's roles; ownership: ClientUser acting on a Client-scoped resource (subscription/license create, subscription/license read) must have X-User-ID == the resource's client_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist (left-to-right); body FK ids exist (study_id, brand_id, frame_id, award_id, client_id, license_id, prior_study_id, Client.brand_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "OCC: expected_study_version == Study.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /research/methodology-versions/{id}/pin"
  - priority: 5
    category: state
    check: "Transition 'from' state matches; cross-entity state gates: MV create/pin requires Study DRAFT|DESIGN_LOCKED; frame create requires DESIGN_LOCKED; response ingest requires Study FIELDING and frame OPEN; compute requires SCORING; determine requires SCORED; publish requires AWARDS_SET; license activation requires Award PUBLISHED; audit create requires License ACTIVE|SUSPENDED; insights require Study PUBLISHED"
    error_id: "ERR_INVALID_STATE | ERR_METHODOLOGY_IMMUTABLE | ERR_STUDY_NOT_FIELDING | ERR_FRAME_NOT_OPEN | ERR_AWARD_NOT_PUBLISHED | ERR_RESULTS_NOT_PUBLISHED"
    http_status: "409 | 403"
    applies_to: "state and action endpoints"
    description: "parent entity state is checked before child entity state (ERR_STUDY_NOT_FIELDING beats ERR_FRAME_NOT_OPEN)"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: award determination actor X-User-ID != active methodology pinned_by_user_id"
    error_id: ERR_SOD_CONFLICT
    http_status: 403
    applies_to: "POST /research/studies/{id}/awards/determine"
  - priority: 7
    category: business_temporal
    check: "Temporal gates: publish requires clock >= embargo_lift_at; license EXPIRE requires clock >= expires_at; subscription activation requires clock inside [starts_at, ends_at]; subscription EXPIRE requires clock > ends_at"
    error_id: "ERR_EMBARGO_ACTIVE | ERR_LICENSE_NOT_EXPIRED | ERR_SUBSCRIPTION_WINDOW_INVALID"
    http_status: 409
    applies_to: "POST /research/studies/{id}/state (PUBLISHED), POST /research/licenses/{id}/state (EXPIRED), POST /research/subscriptions/{id}/state (ACTIVE, EXPIRED)"
  - priority: 8
    category: business_constraint
    check: "Domain constraints: unique study code; factors non-empty with 0 < weight_bp < 10000 and sum == 10000 at pin; >= 1 frame to open fielding; >= 1 ACCEPTED response to compute; shortfall required to reopen fielding; >= 1 eligible brand to determine awards; license term in {12,24,36}; markets_count >= 1; no second ACTIVE license per award (half-open interval); no overlapping ACTIVE subscription per (client, study) (closed interval); no open audits at reinstate; unique (study_id, brand_id) frame"
    error_id: "ERR_DUPLICATE_STUDY_CODE | ERR_FACTOR_WEIGHT_INVALID | ERR_WEIGHT_SUM_MISMATCH | ERR_NO_FRAMES | ERR_NO_RESPONSES | ERR_NO_SHORTFALL | ERR_NO_ELIGIBLE_BRAND | ERR_LICENSE_TERM_INVALID | ERR_MARKETS_INVALID | ERR_LICENSE_CONFLICT | ERR_SUBSCRIPTION_OVERLAP | ERR_AUDITS_UNRESOLVED | ERR_DUPLICATE_FRAME"
    http_status: "409 | 422"
    applies_to: "create and action endpoints as listed per error"
  - priority: 9
    category: business_referential
    check: "Response factor_scores must reference exactly the pinned methodology's factor codes: unknown code -> ERR_UNKNOWN_FACTOR; missing a pinned factor -> ERR_FACTOR_COVERAGE_INCOMPLETE; each score integer in 1..10 -> ERR_SCORE_OUT_OF_RANGE (score range checked before code checks)"
    error_id: "ERR_SCORE_OUT_OF_RANGE | ERR_UNKNOWN_FACTOR | ERR_FACTOR_COVERAGE_INCOMPLETE"
    http_status: 422
    applies_to: "POST /research/responses"
  - priority: 10
    category: business_constraint
    check: "Entitlements: diagnostics/benchmarking require an ACTIVE subscription for (X-User-ID as client_id, study_id) with clock inside [starts_at, ends_at] (ERR_SUBSCRIPTION_REQUIRED); benchmarking additionally requires tier BENCHMARK (ERR_TIER_INSUFFICIENT); diagnostics requires Client.brand_id set and a BrandResult for that brand (ERR_NOT_FOUND)"
    error_id: "ERR_SUBSCRIPTION_REQUIRED | ERR_TIER_INSUFFICIENT | ERR_NOT_FOUND"
    http_status: "403 | 403 | 404"
    applies_to: "GET /research/studies/{id}/diagnostics, GET /research/studies/{id}/benchmarking"
  - priority: 11
    category: business_constraint
    check: "Malformed request body: missing required field, wrong type, factors array empty, ends_at <= starts_at, target_completes < 1, min_sample_per_brand < 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "syntactic body validation; when a 400 condition and any semantic condition both fail, the semantic error at priorities 3-10 wins — 400 is the last resort for otherwise-unclassifiable malformed bodies"

# =============================================================================
# Table 5: API Endpoint Table (flat collections under /research)
# =============================================================================
endpoints:
  # --- Study ---
  - method: POST
    path: "/research/studies"
    description: "Create a study in DRAFT"
    roles: [StudyAdmin]
    code: 201
    input: [code, name, industry_code, cycle_year, min_sample_per_brand, significance_alpha, embargo_lift_at, "prior_study_id?"]
    output: Study
    side_effects: ["status=DRAFT", "ERR_DUPLICATE_STUDY_CODE on code collision"]
  - method: GET
    path: "/research/studies"
    description: "List/filter studies (paginated)"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager, ClientUser, PressUser]
    code: 200
    input: ["limit?", "offset?", "industry_code?", "status?", "prior_study_id?", "active_methodology_id?"]
    output: Study[]
    side_effects: []
  - method: GET
    path: "/research/studies/{id}"
    description: "Get one study"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager, ClientUser, PressUser]
    code: 200
    input: []
    output: Study
    side_effects: []
  - method: POST
    path: "/research/studies/{id}/state"
    description: "Drive the study state machine (FIELDING, FIELDING_CLOSED, SCORING, CANCELLED, PUBLISHED); DESIGN_LOCKED is pin-cascade only"
    roles: [StudyAdmin]
    code: 200
    input: [to_status]
    output: Study
    side_effects: ["Study machine transition incl. frame close cascade, duplicate sweep, BrandResult provisional snapshot, reopen shortfall gates, publish cascade to Awards"]

  # --- MethodologyVersion / Factor ---
  - method: POST
    path: "/research/methodology-versions"
    description: "Create a DRAFT methodology version with its factors inline (factors become Factor entities)"
    roles: [MethodologyLead]
    code: 201
    input: [study_id, change_class, "change_notes?", min_duration_seconds, straightline_min_items, pooled_sd_1000, z_value, tie_epsilon, factors]
    output: MethodologyVersion
    side_effects: ["Factor rows created (methodology_version_id = new version)", "version_no assigned sequentially per study", "ERR_METHODOLOGY_IMMUTABLE unless study is DRAFT or DESIGN_LOCKED", "ERR_FACTOR_WEIGHT_INVALID on out-of-range weight"]
  - method: GET
    path: "/research/methodology-versions/{id}"
    description: "Get one methodology version"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager, ClientUser, PressUser]
    code: 200
    input: []
    output: MethodologyVersion
    side_effects: []
  - method: POST
    path: "/research/methodology-versions/{id}/pin"
    description: "Pin a methodology version (OCC on Study.version); supersedes any prior PINNED version; locks the study design"
    roles: [MethodologyLead]
    code: 200
    input: [expected_study_version]
    output: MethodologyVersion
    side_effects: ["increments Study.version by 1", "Study DRAFT -> DESIGN_LOCKED; active_methodology_id set; pinned_by_user_id recorded", "prior PINNED -> SUPERSEDED", "ERR_WEIGHT_SUM_MISMATCH when factor weights do not sum to 10000"]
  - method: GET
    path: "/research/methodology-versions/{id}/factors"
    description: "List the factors of a methodology version"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager, ClientUser, PressUser]
    code: 200
    input: ["limit?", "offset?"]
    output: Factor[]
    side_effects: []
  - method: GET
    path: "/research/studies/{id}/methodology-versions"
    description: "List methodology versions of a study"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager, ClientUser, PressUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MethodologyVersion[]
    side_effects: []

  # --- SampleFrame ---
  - method: POST
    path: "/research/sample-frames"
    description: "Create a sample frame (OPEN) for a brand in a study; requires study DESIGN_LOCKED"
    roles: [FieldOps]
    code: 201
    input: [study_id, brand_id, source_type, target_completes]
    output: SampleFrame
    side_effects: ["status=OPEN", "ERR_DUPLICATE_FRAME when (study_id, brand_id) already has a frame"]
  - method: GET
    path: "/research/sample-frames"
    description: "List/filter sample frames"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager]
    code: 200
    input: ["limit?", "offset?", "study_id?", "brand_id?", "status?"]
    output: SampleFrame[]
    side_effects: []
  - method: GET
    path: "/research/sample-frames/{id}"
    description: "Get one sample frame"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager]
    code: 200
    input: []
    output: SampleFrame
    side_effects: []
  - method: POST
    path: "/research/sample-frames/{id}/state"
    description: "Manually close a frame (OPEN -> CLOSED); reopen is cascade-only"
    roles: [FieldOps]
    code: 200
    input: [to_status]
    output: SampleFrame
    side_effects: []

  # --- Response ---
  - method: POST
    path: "/research/responses"
    description: "Ingest one completed response; quality classification is synchronous (quality_status in the response body); a REJECTED classification is still a 201"
    roles: [FieldOps]
    code: 201
    input: [frame_id, respondent_token, duration_seconds, item_count, distinct_values, factor_scores]
    output: Response
    side_effects: ["study_id/brand_id denormalized from frame", "submitted_at = logical clock", "quality classification per response_quality_classification"]
  - method: GET
    path: "/research/sample-frames/{id}/responses"
    description: "List responses of a frame"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager]
    code: 200
    input: ["limit?", "offset?", "quality_status?"]
    output: Response[]
    side_effects: []

  # --- Scoring / BrandResult ---
  - method: POST
    path: "/research/studies/{id}/scoring/compute"
    description: "Compute final index scores, eligibility, significance groups and ranks for every in-scope brand (study SCORING -> SCORED)"
    roles: [AwardsOfficer]
    code: 200
    input: []
    output: { study_id: string, computed_count: integer, eligible_count: integer }
    side_effects: ["BrandResult rows updated per index_score(final)/significance_grouping/rank_assignment", "Study SCORING -> SCORED"]
  - method: GET
    path: "/research/brand-results"
    description: "List/filter brand results"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager]
    code: 200
    input: ["limit?", "offset?", "study_id?", "brand_id?", "eligible?"]
    output: BrandResult[]
    side_effects: []
  - method: GET
    path: "/research/brand-results/{id}"
    description: "Get one brand result"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager]
    code: 200
    input: []
    output: BrandResult
    side_effects: []

  # --- Award ---
  - method: POST
    path: "/research/studies/{id}/awards/determine"
    description: "Determine award winners from computed results (study SCORED -> AWARDS_SET); segregation of duties enforced"
    roles: [AwardsOfficer]
    code: 201
    input: []
    output: { study_id: string, award_count: integer }
    side_effects: ["Awards created EMBARGOED per award_determination", "winning BrandResults FINAL -> AWARDED"]
  - method: GET
    path: "/research/awards"
    description: "List/filter awards"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager, ClientUser, PressUser]
    code: 200
    input: ["limit?", "offset?", "study_id?", "brand_id?", "status?"]
    output: Award[]
    side_effects: []
  - method: GET
    path: "/research/awards/{id}"
    description: "Get one award"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager, ClientUser, PressUser]
    code: 200
    input: []
    output: Award
    side_effects: []

  # --- License ---
  - method: POST
    path: "/research/licenses"
    description: "Quote an award-usage license (created QUOTED with fee_quote_cents); quoting is allowed while the award is still EMBARGOED"
    roles: [LicensingManager, ClientUser]
    code: 201
    input: [award_id, client_id, tier, term_months, markets_count]
    output: License
    side_effects: ["fee_quote_cents per license_fee_quote", "ClientUser caller must own client_id (ERR_FORBIDDEN otherwise)"]
  - method: GET
    path: "/research/licenses"
    description: "List/filter licenses (ClientUser sees only own client_id)"
    roles: [StudyAdmin, LicensingManager, ClientUser]
    code: 200
    input: ["limit?", "offset?", "client_id?", "award_id?", "status?"]
    output: License[]
    side_effects: []
  - method: GET
    path: "/research/licenses/{id}"
    description: "Get one license (ClientUser only when license.client_id == X-User-ID)"
    roles: [StudyAdmin, LicensingManager, ClientUser]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: POST
    path: "/research/licenses/{id}/state"
    description: "License lifecycle: ACTIVE (activate/reinstate), SUSPENDED, REVOKED, WITHDRAWN, EXPIRED"
    roles: [LicensingManager]
    code: 200
    input: [to_status]
    output: License
    side_effects: ["activation computes fee_final_cents/activated_at/expires_at", "revocation auto-resolves open audits", "suspension/reinstate per License machine"]

  # --- UsageAudit ---
  - method: POST
    path: "/research/usage-audits"
    description: "File a usage-monitoring audit finding against an ACTIVE or SUSPENDED license"
    roles: [LicensingManager]
    code: 201
    input: [license_id, severity, "note?"]
    output: UsageAudit
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/research/licenses/{id}/usage-audits"
    description: "List audits of a license"
    roles: [StudyAdmin, LicensingManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: UsageAudit[]
    side_effects: []
  - method: POST
    path: "/research/usage-audits/{id}/state"
    description: "ESCALATED triggers the suspension cascade; RESOLVED closes the finding"
    roles: [LicensingManager]
    code: 200
    input: [to_status]
    output: UsageAudit
    side_effects: ["escalation may suspend the license per audit_suspension_threshold"]

  # --- Client / Brand ---
  - method: POST
    path: "/research/clients"
    description: "Register a client organization"
    roles: [StudyAdmin, LicensingManager]
    code: 201
    input: [name, client_type, country, "brand_id?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/research/brands/{id}/clients"
    description: "List clients speaking for a brand"
    roles: [StudyAdmin, LicensingManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/research/brands"
    description: "Register a measured brand"
    roles: [StudyAdmin]
    code: 201
    input: [name, industry_code]
    output: Brand
    side_effects: []
  - method: GET
    path: "/research/brands/{id}"
    description: "Get one brand"
    roles: [StudyAdmin, MethodologyLead, FieldOps, AwardsOfficer, LicensingManager, ClientUser]
    code: 200
    input: []
    output: Brand
    side_effects: []

  # --- Subscription ---
  - method: POST
    path: "/research/subscriptions"
    description: "Create a TRIAL subscription to a study's diagnostics products (ClientUser must own client_id)"
    roles: [ClientUser, StudyAdmin]
    code: 201
    input: [client_id, study_id, tier, starts_at, ends_at]
    output: Subscription
    side_effects: ["status=TRIAL"]
  - method: GET
    path: "/research/subscriptions"
    description: "List/filter subscriptions (ClientUser sees only own client_id)"
    roles: [StudyAdmin, ClientUser]
    code: 200
    input: ["limit?", "offset?", "client_id?", "study_id?", "status?"]
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/research/subscriptions/{id}"
    description: "Get one subscription (ClientUser only when subscription.client_id == X-User-ID)"
    roles: [StudyAdmin, ClientUser]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/research/subscriptions/{id}/state"
    description: "Subscription lifecycle: ACTIVE (TRIAL only), CANCELLED (TRIAL/ACTIVE), EXPIRED (ACTIVE, after ends_at)"
    roles: [ClientUser, StudyAdmin]
    code: 200
    input: [to_status]
    output: Subscription
    side_effects: ["activation enforces window and closed-interval overlap rules"]

  # --- Insights / Press / Clock ---
  - method: GET
    path: "/research/studies/{id}/diagnostics"
    description: "Client's own-brand deep diagnostic: factor-level scores and rank for Client.brand_id; requires PUBLISHED study and ACTIVE subscription"
    roles: [ClientUser]
    code: 200
    input: []
    output: { study_id: string, brand_id: string, eligible: boolean, accepted_n: integer, final_index: integer, rank_position: integer, significance_group: integer, factor_scores: array }
    side_effects: []
  - method: GET
    path: "/research/studies/{id}/benchmarking"
    description: "Competitive benchmarking: all eligible brands' ranks plus year-over-year delta for the client's own brand; requires tier BENCHMARK"
    roles: [ClientUser]
    code: 200
    input: []
    output: { study_id: string, change_class: string, yoy_comparable: boolean, yoy_delta: integer, rankings: array }
    side_effects: ["yoy_comparability computed on read"]
  - method: GET
    path: "/research/studies/{id}/press-kit"
    description: "Press kit with embargo coordination metadata; accredited press may read pre-embargo and must honor embargo_lift_at"
    roles: [PressUser, StudyAdmin]
    code: 200
    input: []
    output: { study_id: string, name: string, embargo_lift_at: string, embargo_status: string, published_at: string, awards: array }
    side_effects: ["embargo_status computed on read per embargo_status calculation"]
  - method: POST
    path: "/research/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; all embargo/expiry/window rules evaluate against this clock."
    roles: [StudyAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID header, or X-User-Role is not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles, or ClientUser ownership check failed (X-User-ID != resource client_id)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, empty factors array, ends_at <= starts_at, target_completes < 1, min_sample_per_brand < 1" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist; or diagnostics requested for a client with no brand / no BrandResult" }
  - { id: ERR_DUPLICATE_STUDY_CODE, http: 409, condition: "Study code already exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_study_version != current Study.version at methodology pin (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is in a state where the requested transition is not defined" }
  - { id: ERR_METHODOLOGY_IMMUTABLE, http: 409, condition: "Methodology create/pin attempted when the study is not DRAFT|DESIGN_LOCKED" }
  - { id: ERR_FACTOR_WEIGHT_INVALID, http: 422, condition: "A factor's weight_bp is <= 0 or >= 10000" }
  - { id: ERR_WEIGHT_SUM_MISMATCH, http: 422, condition: "Factor weights do not sum to exactly 10000 at pin" }
  - { id: ERR_DUPLICATE_FRAME, http: 409, condition: "A SampleFrame already exists for (study_id, brand_id)" }
  - { id: ERR_UNKNOWN_FACTOR, http: 422, condition: "Response factor_scores references a factor code not defined by the pinned methodology" }
  - { id: ERR_FACTOR_COVERAGE_INCOMPLETE, http: 422, condition: "Response factor_scores does not cover every factor of the pinned methodology" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 422, condition: "A factor score is not an integer in 1..10" }
  - { id: ERR_STUDY_NOT_FIELDING, http: 409, condition: "Response ingest while the study is not in FIELDING" }
  - { id: ERR_FRAME_NOT_OPEN, http: 409, condition: "Response ingest while the frame is CLOSED" }
  - { id: ERR_NO_FRAMES, http: 409, condition: "FIELDING requires at least one SampleFrame" }
  - { id: ERR_NO_RESPONSES, http: 409, condition: "Scoring compute requires at least one ACCEPTED response in the study" }
  - { id: ERR_NO_SHORTFALL, http: 409, condition: "Fielding reopen requires at least one framed brand with accepted_n < min_sample_per_brand" }
  - { id: ERR_NO_ELIGIBLE_BRAND, http: 409, condition: "Award determination requires at least one eligible BrandResult" }
  - { id: ERR_SOD_CONFLICT, http: 403, condition: "Award determination actor is the same X-User-ID that pinned the active methodology" }
  - { id: ERR_EMBARGO_ACTIVE, http: 409, condition: "Publication attempted before embargo_lift_at (strictly earlier clock)" }
  - { id: ERR_AWARD_NOT_PUBLISHED, http: 409, condition: "License activation while the award is still EMBARGOED" }
  - { id: ERR_LICENSE_CONFLICT, http: 409, condition: "Another License on the same award is ACTIVE (half-open interval overlap)" }
  - { id: ERR_LICENSE_TERM_INVALID, http: 422, condition: "term_months not in {12, 24, 36}" }
  - { id: ERR_MARKETS_INVALID, http: 422, condition: "markets_count < 1" }
  - { id: ERR_LICENSE_NOT_EXPIRED, http: 409, condition: "EXPIRE attempted with logical clock < expires_at" }
  - { id: ERR_AUDITS_UNRESOLVED, http: 409, condition: "Reinstate attempted with UsageAudits still OPEN or ESCALATED" }
  - { id: ERR_SUBSCRIPTION_OVERLAP, http: 409, condition: "Another ACTIVE subscription for (client_id, study_id) intersects the closed interval [starts_at, ends_at] (adjacency conflicts)" }
  - { id: ERR_SUBSCRIPTION_WINDOW_INVALID, http: 409, condition: "Activation outside [starts_at, ends_at], or EXPIRE attempted with clock <= ends_at" }
  - { id: ERR_SUBSCRIPTION_REQUIRED, http: 403, condition: "Insights require an ACTIVE in-window subscription for (caller client, study)" }
  - { id: ERR_TIER_INSUFFICIENT, http: 403, condition: "Benchmarking requires subscription tier BENCHMARK" }
  - { id: ERR_RESULTS_NOT_PUBLISHED, http: 403, condition: "Insights requested before the study is PUBLISHED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: StudyAdmin
    description: "Program operator: owns the study lifecycle, brands, clients, the logical clock, and publication"
    identity: opaque
    exclusive_operations:
      - "POST /research/studies"
      - "POST /research/studies/{id}/state"
      - "POST /research/brands"
      - "POST /research/_clock/set_current_utc"
    shared_operations:
      - "GET reads on all entities; POST /research/clients and POST /research/subscriptions shared with LicensingManager/ClientUser; GET press-kit shared with PressUser"
  - name: MethodologyLead
    description: "Methodologist: drafts and pins methodology versions and their measurement factors"
    identity: opaque
    exclusive_operations:
      - "POST /research/methodology-versions"
      - "POST /research/methodology-versions/{id}/pin"
    shared_operations:
      - "GET reads on studies, methodology, factors, frames, responses, brand results, awards"
  - name: FieldOps
    description: "Fielding operator: sample frames and response ingest"
    identity: opaque
    exclusive_operations:
      - "POST /research/sample-frames"
      - "POST /research/sample-frames/{id}/state"
      - "POST /research/responses"
    shared_operations:
      - "GET reads on studies, methodology, frames, responses, brand results, awards"
  - name: AwardsOfficer
    description: "Scoring and awards authority; segregated from the methodology pinner by ERR_SOD_CONFLICT"
    identity: opaque
    exclusive_operations:
      - "POST /research/studies/{id}/scoring/compute"
      - "POST /research/studies/{id}/awards/determine"
    shared_operations:
      - "GET reads on studies, methodology, frames, responses, brand results, awards"
  - name: LicensingManager
    description: "Award-licensing desk: quotes, activates, monitors and revokes usage licenses and audits"
    identity: opaque
    exclusive_operations:
      - "POST /research/licenses/{id}/state"
      - "POST /research/usage-audits"
      - "POST /research/usage-audits/{id}/state"
    shared_operations:
      - "POST /research/licenses (shared with ClientUser); POST /research/clients (shared with StudyAdmin); GET reads on licenses, audits, studies, awards, brands"
  - name: ClientUser
    description: "A subscribing/licensing client; X-User-ID equals the Client.id the user acts for"
    identity: entity_backed:Client
    exclusive_operations:
      - "GET /research/studies/{id}/diagnostics"
      - "GET /research/studies/{id}/benchmarking"
    shared_operations:
      - "POST /research/licenses (own client_id only); POST /research/subscriptions and POST /research/subscriptions/{id}/state (own client_id only, shared with StudyAdmin); GET reads on own subscriptions/licenses, studies, awards, brands, methodology"
  - name: PressUser
    description: "Accredited industry press user reading press kits under embargo coordination"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /research/studies/{id}/press-kit (shared with StudyAdmin); GET reads on studies and awards"

