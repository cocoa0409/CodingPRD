            - "${err_wrong_role_type} == \"ERR_CLINICIAN_NOT_AUTHORIZED_TO_ATTEST\" with HTTP 403"
            - "${err_no_clinician} == \"ERR_CLINICIAN_NOT_AUTHORIZED_TO_ATTEST\" with HTTP 403"
            - "after the fourth call Authorization.${auth_id}.exception_attested_by_clinician_id == \"${rheum1_id}\" and status == \"DRAFT\""
            - "Authorization.${auth_id}.version incremented exactly once across the four calls"

