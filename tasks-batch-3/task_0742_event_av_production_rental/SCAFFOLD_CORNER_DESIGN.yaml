# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe over the claim-extraction taxonomy)
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: get_nonexistent_order_returns_not_found
        claim_type: Not Found
        grounds: [entities.RentalOrder, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /rental-orders/{unknown uuid} returns 404 ERR_NOT_FOUND, not an empty object."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /rental-orders/00000000-0000-4000-8000-000000000000", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_equipment_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.EquipmentItem.fields.daily_rate_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /equipment omitting daily_rate_cents returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /equipment", payload: { name: "No Rate", category: "SOUND", total_units: 5, replacement_value_cents: 100000 }, as: WarehouseManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: reservation_is_standby_defaults_false
        claim_type: Defaults
        grounds: [entities.EquipmentReservation.fields.is_standby]
        distinguishing_aspect: "Creating a reservation without is_standby leaves is_standby=false (default applied)."
        test_recipe:
          setup: ["An order and an EquipmentItem exist."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "CDflt", contact_email: "cd@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VDflt", address: "1 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "ED", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
          assert:
            - "EquipmentReservation.${res_id}.is_standby == false"
            - "EquipmentReservation.${res_id}.status == HELD"

      - name: deposit_hold_ledger_entry_created_on_confirm
        claim_type: System Fields
        grounds: [entities.DepositLedgerEntry.fields.entry_type, entities.DepositLedgerEntry.fields.amount_cents]
        distinguishing_aspect: "Confirm creates a system DepositLedgerEntry(entry_type=HOLD, amount_cents=100000) reachable via GET /deposit-ledger?order_id."
        test_recipe:
          setup: ["Order CONFIRMED (clock 2026-05-01) with LED reservation qty1 (replacement 500000) -> HOLD 100000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "CLd", contact_email: "cl@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VLd", address: "2 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "ELd", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
          trigger:
            - { call: "GET /deposit-ledger", payload: { order_id: "${ord_id}" }, as: AccountManager, captures: { entry_type: "$.data[0].entry_type" } }
          assert:
            - "the deposit-ledger list for the order contains exactly one entry with entry_type == HOLD and amount_cents == 100000"
            - "RentalOrder.${ord_id}.deposit_held_cents == 100000"

  - section: calculations
    instances:
      - name: standby_line_billed_half_rate
        claim_type: Constants Applied
        grounds: [calculations.equipment_line_pricing, entities.EquipmentReservation.fields.line_charge_cents]
        distinguishing_aspect: "A standby array reservation qty2 x 2 days x 15000 = 60000 raw, x STANDBY_RATE_FACTOR 0.5 = line_charge_cents 30000 (tier 0% at 2 days)."
        test_recipe:
          setup: ["Order with one is_standby array reservation qty2 over 06-10..06-11 (2 days); quoted."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "CSb", contact_email: "cs@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VSb", address: "3 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "K2 Array", category: "SOUND", total_units: 8, daily_rate_cents: 15000, replacement_value_cents: 800000 }, as: WarehouseManager, captures: { arr_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "ESb", event_start_date: "2026-06-10", event_end_date: "2026-06-11" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${arr_id}", qty: 2, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-11", is_standby: true }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
          assert:
            - "EquipmentReservation.${res_id}.line_charge_cents == 30000"
            - "RentalOrder.${ord_id}.equipment_subtotal_cents == 30000"

      - name: volume_discount_tier_t1_applied
        claim_type: Constants Applied
        grounds: [calculations.order_totals, entities.RentalOrder.fields.volume_discount_cents]
        distinguishing_aspect: "Pre-discount subtotal 324000 lands in tier t1 [100000,500000) -> 5% volume_discount_cents=16200; non-rush quote_total_cents=307800."
        test_recipe:
          setup: ["Clock 2026-05-01 (non-rush); LED reservation qty10 x 3 days (10% tier) -> subtotal 324000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "CVt", contact_email: "cv@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VVt", address: "4 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "EVt", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 10, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
          assert:
            - "RentalOrder.${ord_id}.equipment_subtotal_cents == 324000"
            - "RentalOrder.${ord_id}.volume_discount_cents == 16200"
            - "RentalOrder.${ord_id}.quote_total_cents == 307800"

      - name: rush_surcharge_window_boundary_seven_days
        claim_type: Correct Result
        grounds: [calculations.order_totals, entities.RentalOrder.fields.rush_surcharge_cents]
        distinguishing_aspect: "Event exactly 7 days after the clock (2026-06-03 -> 2026-06-10) is within RUSH_WINDOW_DAYS(7): rush_surcharge_cents = round(32400 * 0.08) = 2592; quote_total_cents=34992."
        test_recipe:
          setup: ["Clock 2026-06-03; LED reservation qty1 x 3 days -> discounted 32400; event start 2026-06-10 (7 days out)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "CRu", contact_email: "cr@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VRu", address: "5 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "ERu", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
          assert:
            - "RentalOrder.${ord_id}.rush_surcharge_cents == 2592"
            - "RentalOrder.${ord_id}.quote_total_cents == 34992"

  - section: state_machines
    instances:
      - name: approve_coi_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.CertificateOfInsurance.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an already-APPROVED COI a second time returns 409 ERR_INVALID_STATE (no SUBMITTED->APPROVED edge from APPROVED)."
        test_recipe:
          setup: ["A COI has been APPROVED (venue required 0)."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "CAp", contact_email: "ca@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VAp", address: "6 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "EAp", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reject_then_approve_returns_invalid_state_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CertificateOfInsurance.SUBMITTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: approving a REJECTED COI returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A COI has been REJECTED."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "CRj", contact_email: "crj@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VRj", address: "7 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "ERj", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/reject", payload: { reason: "bad form" }, as: AccountManager }
          trigger:
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: quote_order_with_no_reservations_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.RentalOrder.DRAFT_to_QUOTED, "errors[ERR_NO_RESERVATIONS]"]
        distinguishing_aspect: "Quoting a DRAFT order that has zero HELD reservations returns 409 ERR_NO_RESERVATIONS."
        test_recipe:
          setup: ["A DRAFT order with no reservations."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "CNr", contact_email: "cn@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VNr", address: "8 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "ENr", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_RESERVATIONS"
      - name: coi_expiry_on_event_end_returns_expired
        claim_type: Precondition Enforcement
        grounds: [state_machines.CertificateOfInsurance.SUBMITTED_to_APPROVED, "errors[ERR_COI_EXPIRED]"]
        distinguishing_aspect: "Approving a COI whose expiry_date (2026-06-12) is not strictly after event_end_date (2026-06-12) returns 409 ERR_COI_EXPIRED."
        test_recipe:
          setup: ["Order event_end 2026-06-12; COI coverage adequate but expiry_date 2026-06-12."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "CEx", contact_email: "ce@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VEx", address: "9 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "EEx", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-06-12" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
          trigger:
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_COI_EXPIRED"

      - name: start_event_with_held_reservation_returns_not_checked_out
        claim_type: Precondition Enforcement
        grounds: [state_machines.RentalOrder.LOADED_OUT_to_IN_EVENT, "errors[ERR_RESERVATIONS_NOT_CHECKED_OUT]"]
        distinguishing_aspect: "start-event on a LOADED_OUT order whose reservation is still HELD (never checked out) returns 409 ERR_RESERVATIONS_NOT_CHECKED_OUT."
        test_recipe:
          setup: ["Order LOADED_OUT (clock 2026-05-01) with a HELD reservation not yet checked out."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "CnCo", contact_email: "cnco@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VnCo", address: "10 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "EnCo", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/load-out", payload: {}, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/start-event", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RESERVATIONS_NOT_CHECKED_OUT"

      - name: load_in_with_checked_out_reservation_returns_not_checked_in
        claim_type: Precondition Enforcement
        grounds: [state_machines.RentalOrder.IN_EVENT_to_LOADED_IN, "errors[ERR_RESERVATIONS_NOT_CHECKED_IN]"]
        distinguishing_aspect: "load-in on an IN_EVENT order whose reservation is still CHECKED_OUT (not checked in) returns 409 ERR_RESERVATIONS_NOT_CHECKED_IN."
        test_recipe:
          setup: ["Order IN_EVENT (clock 2026-05-01) with reservation CHECKED_OUT, not yet checked in."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "CnCi", contact_email: "cnci@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VnCi", address: "11 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "EnCi", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/load-out", payload: {}, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_id}/check-out", payload: {}, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/start-event", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/load-in", payload: {}, as: WarehouseManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RESERVATIONS_NOT_CHECKED_IN"

      - name: settle_with_open_damage_report_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.RentalOrder.LOADED_IN_to_SETTLED, "errors[ERR_OPEN_DAMAGE_REPORT]"]
        distinguishing_aspect: "settle on a LOADED_IN order with an ASSESSED (not CHARGED/WAIVED) DamageReport returns 409 ERR_OPEN_DAMAGE_REPORT."
        test_recipe:
          setup: ["Order LOADED_IN (clock 2026-05-01), reservation CHECKED_IN, one DamageReport left ASSESSED."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "COd", contact_email: "cod@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VOd", address: "12 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "EOd", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 2, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/load-out", payload: {}, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_id}/check-out", payload: {}, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/start-event", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/damage-reports", payload: { reservation_id: "${res_id}", damaged_units: 1 }, as: WarehouseManager, captures: { dr_id: "$.data.id" } }
            - { call: "POST /damage-reports/${dr_id}/assess", payload: { assessed_cost_cents: 50000 }, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_id}/check-in", payload: { damaged: false }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/load-in", payload: {}, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/settle", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OPEN_DAMAGE_REPORT"

      - name: damage_report_cross_order_reservation_mismatch
        claim_type: Precondition Enforcement
        grounds: [entities.DamageReport.fields.reservation_id, "errors[ERR_RESERVATION_ORDER_MISMATCH]"]
        distinguishing_aspect: "Filing a damage-report on order B whose reservation_id belongs to order A returns 409 ERR_RESERVATION_ORDER_MISMATCH."
        test_recipe:
          setup: ["Order A with reservation resA; a separate order B."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "CMm", contact_email: "cmm@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VMm", address: "13 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "OA", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_a: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_a}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_a: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "OB", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_b: "$.data.id" } }
          trigger:
            - { call: "POST /rental-orders/${ord_b}/damage-reports", payload: { reservation_id: "${res_a}", damaged_units: 1 }, as: WarehouseManager, captures: { err: "$.data.error_id" } }
          assert:
