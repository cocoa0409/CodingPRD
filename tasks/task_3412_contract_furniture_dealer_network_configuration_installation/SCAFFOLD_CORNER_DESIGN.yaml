        distinguishing_aspect: "grade C upcharge 12 percent on WORKSTATION_6X6 unit 85837 gives exact 96137.44 -> line rounds half-up to 96137; provisional total at tier 1 is round_half_up(96137 x 0.90) == 86523 (86523.3 -> .3 down)."
        test_recipe:
          setup: ["SYSTEMS family; dealer; active agreement 0.10/0.15/0.20; locked configuration 1 x WORKSTATION_6X6 C; order install 2026-12-15 (lead 42+14+3=59, earliest 2026-10-30)"]
