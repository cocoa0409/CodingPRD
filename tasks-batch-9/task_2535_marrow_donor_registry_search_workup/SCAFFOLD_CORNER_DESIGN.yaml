      - name: recording_the_collected_product_moves_booking_candidate_and_case_together
        claim_type: Cross-entity
        grounds:
          - state_machines.WorkupCase.logistics_status.BOOKED_to_COLLECTED
          - state_machines.CollectionBooking.CONFIRMED_to_COMPLETED
          - state_machines.ProductShipment.SCHEDULED_to_IN_TRANSIT
          - endpoints.POST_registry_collection_bookings_id_shipments
          - entities.ProductShipment.fields.must_infuse_by
        distinguishing_aspect: |
          One POST on the booking writes four rows: the new ProductShipment (with must_infuse_by =
          collected_at + VIABILITY_HOURS[PBSC] = +72h and dose_adequacy from MIN_CD34_E6_PER_KG), the
          booking (CONFIRMED -> COMPLETED), the candidate (WORKUP_OPEN -> COLLECTED) and the case's
          logistics dimension (BOOKED -> COLLECTED). The follow-up DEPARTED event then advances only the
          shipment and the logistics dimension, leaving booking and candidate alone.
