  # -------------------------------------------------------------- diversion orders
  - method: POST
    path: /diversion-orders
    description: "Draft a diversion of batch tonnage to an alternative outlet. expected_batch_version must equal the batch's current version, because the batch's unallocated tonnage is the contested quantity and a stale value is refused with 412. Costs are computed per calculations.outlet_cost_comparison at draft time and frozen at commit."
    roles: [FacilityOperator]
    input: ["batch_id", "outlet_id", "expected_batch_version", "dry_tons", "wet_tons", "haul_miles"]
    output: DiversionOrder
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BATCH_NOT_FOUND, ERR_OUTLET_NOT_FOUND, ERR_STALE_BATCH_VERSION, ERR_INSUFFICIENT_UNALLOCATED_TONS]
    side_effects:
      - "Creates the order in DRAFT with every cost field derived per calculations.outlet_cost_comparison and version 1."
      - "Counts immediately as diverted tonnage per calculations.dry_tons_conservation: DRAFT, COMMITTED and SETTLED orders all consume the batch's unallocated_dry_tons, so unallocated_dry_tons drops by dry_tons here, disposition is re-derived and SolidsBatch.version is incremented by 1."

  - method: GET
    path: /diversion-orders/{orderId}
    description: "Read one diversion order with its frozen cost breakdown."
    roles: [FacilityOperator, ComplianceOfficer, PublicLiaison]
    input: []
    output: DiversionOrder
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ORDER_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /diversion-orders
    description: "List diversion orders ordered by created_at ASC, filtered by batch, outlet or status."
    roles: [FacilityOperator, ComplianceOfficer, PublicLiaison]
    input: ["batch_id?", "outlet_id?", "status?", "limit?", "offset?"]
    output: DiversionOrder[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  - method: POST
    path: /diversion-orders/{orderId}/commit
    description: "Commit a DRAFT order, moving it to COMMITTED. Tonnage was already consumed at draft time; commit is where the outlet acceptance criteria and the outlet's annual cap are enforced,."
    roles: [FacilityOperator, ComplianceOfficer]
    input: []
    output: DiversionOrder
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ORDER_NOT_FOUND, ERR_ORDER_INVALID_STATE, ERR_OUTLET_NOT_ACCEPTING, ERR_OUTLET_ACCEPTANCE_CRITERIA, ERR_OUTLET_ANNUAL_CAP_EXCEEDED, ERR_INSUFFICIENT_UNALLOCATED_TONS]
    side_effects:
      - "Sets status COMMITTED, committed_at to the logical clock and increments the order version by 1."
      - "Adds wet_tons to AlternativeOutlet.ytd_accepted_wet_tons and increments the outlet version by 1. Batch tonnage is unchanged, having been consumed at draft time."

  - method: POST
    path: /diversion-orders/{orderId}/settle
    description: "Record final settlement of a COMMITTED order, moving it to SETTLED. Costs are already frozen; settlement only stamps settled_at."
    roles: [FacilityOperator, ComplianceOfficer]
    input: []
    output: DiversionOrder
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ORDER_NOT_FOUND, ERR_ORDER_INVALID_STATE]
    side_effects:
      - "Sets status SETTLED, settled_at to the logical clock and increments the order version by 1."
      - "Subtracts wet_tons from TreatmentFacility.storage_used_wet_tons per calculations.storage_ledger, which debits storage only at settlement, re-derives utilization and posture and increments the facility version by 1."

  - method: POST
    path: /diversion-orders/{orderId}/void
    description: "Void a DRAFT or COMMITTED order. Voiding a COMMITTED order is a compensating reversal that returns every quantity it consumed."
    roles: [ComplianceOfficer]
    input: ["void_reason"]
    output: DiversionOrder
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ORDER_NOT_FOUND, ERR_ORDER_INVALID_STATE]
    side_effects:
      - "Sets status VOIDED, void_reason and increments the order version by 1."
      - "Returns dry_tons to SolidsBatch.unallocated_dry_tons from either DRAFT or COMMITTED, re-derives disposition and increments the batch version by 1."
      - "From COMMITTED only: subtracts wet_tons from AlternativeOutlet.ytd_accepted_wet_tons and increments the outlet version by 1. Storage is untouched because a COMMITTED order never debited it."

  - method: GET
    path: /diversion-orders/{orderId}/cost-comparison
    description: "Cost comparison for this order's batch tonnage across every ACCEPTING outlet, computed per calculations.outlet_cost_comparison using the order's haul_miles for each candidate. Options are sorted by cost_per_dry_ton ASC then AlternativeOutlet.created_at ASC; recommended_outlet_id is the first option after that sort."
    roles: [FacilityOperator, ComplianceOfficer]
    input: []
    output:
      order_id: string
      batch_id: string
      dry_tons: number
      wet_tons: number
      recommended_outlet_id: string
      options: array
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ORDER_NOT_FOUND]
    side_effects: []

  # ----------------------------------------------------------------- odor program
  - method: POST
    path: /odor-complaints
    description: "Log a public odor complaint against a facility, optionally attributed to a land application site. Complaints start in RECEIVED."
    roles: [PublicLiaison, FacilityOperator]
    input: ["facility_id", "received_at", "severity", "site_id?", "description?", "complainant_contact?"]
    output: OdorComplaint
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_SITE_NOT_FOUND]
    side_effects:
      - "Creates the complaint in RECEIVED with version 1. A complaint on its own changes no derived figure: only substantiation feeds the odor risk score and the facility posture."

  - method: GET
    path: /odor-complaints/{complaintId}
    description: "Read one odor complaint."
    roles: [PublicLiaison, ComplianceOfficer, FacilityOperator, Agronomist]
    input: []
    output: OdorComplaint
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_COMPLAINT_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /odor-complaints
    description: "List odor complaints ordered by received_at ASC then created_at ASC, filtered by facility, site, severity or status."
    roles: [PublicLiaison, ComplianceOfficer, FacilityOperator, Agronomist]
    input: ["facility_id?", "site_id?", "severity?", "status?", "limit?", "offset?"]
    output: OdorComplaint[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  - method: POST
    path: /odor-complaints/{complaintId}/investigate
    description: "Open an investigation on a RECEIVED complaint, moving it to INVESTIGATING."
    roles: [ComplianceOfficer, PublicLiaison]
    input: []
    output: OdorComplaint
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_COMPLAINT_NOT_FOUND, ERR_COMPLAINT_INVALID_STATE]
    side_effects:
      - "Sets status INVESTIGATING and increments the complaint version by 1."

  - method: POST
    path: /odor-complaints/{complaintId}/resolve
    description: "Record the investigation outcome for an INVESTIGATING complaint. outcome SUBSTANTIATED and outcome UNSUBSTANTIATED are the two divergent branches: only substantiation feeds the odor risk score, the facility complaint counter and the possible site restriction."
    roles: [ComplianceOfficer]
    input: ["outcome", "investigation_note?", "resolution_action?"]
    output: OdorComplaint
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_COMPLAINT_NOT_FOUND, ERR_COMPLAINT_INVALID_STATE]
    side_effects:
      - "Sets status to SUBSTANTIATED or UNSUBSTANTIATED with resolution_action (default NONE), resolved_at and increments the complaint version by 1."
      - "SUBSTANTIATED only: re-derives the attributed site's odor_risk_score_historical, odor_risk_score_precautionary and gating_risk_score per calculations.site_odor_risk_score and increments the site version by 1."
      - "SUBSTANTIATED only: when the site's gating_risk_score reaches 60.00 and the site is PERMITTED, the site moves to RESTRICTED with restriction_reason ODOR_RISK_HIGH and its SCHEDULED and WEATHER_HOLD events move to DEFERRED with defer_reason ODOR_RISK, incrementing each version by 1."
      - "SUBSTANTIATED only: recounts TreatmentFacility.substantiated_complaint_count_30d over the 30 days ending at the logical clock, re-derives posture and increments the facility version by 1."
      - "UNSUBSTANTIATED changes no derived figure anywhere."

  - method: POST
    path: /odor-complaints/{complaintId}/close
    description: "Close a SUBSTANTIATED or UNSUBSTANTIATED complaint, moving it to CLOSED. Closing is a records action and reverses none of the substantiation side effects."
    roles: [PublicLiaison, ComplianceOfficer]
    input: []
    output: OdorComplaint
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_COMPLAINT_NOT_FOUND, ERR_COMPLAINT_INVALID_STATE]
    side_effects:
      - "Sets status CLOSED and increments the complaint version by 1."

