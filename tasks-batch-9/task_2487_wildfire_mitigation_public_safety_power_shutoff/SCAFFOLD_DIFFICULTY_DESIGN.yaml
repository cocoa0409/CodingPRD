              as: FieldPatrolSupervisor
              captures: { pa_charlie_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T21:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /patrol-assignments/${pa_alpha_id}/start"
              payload: {}
              as: FieldPatrolSupervisor
            - call: "POST /patrol-assignments/${pa_bravo_id}/start"
              payload: {}
              as: FieldPatrolSupervisor
            - call: "POST /patrol-assignments/${pa_charlie_id}/start"
              payload: {}
              as: FieldPatrolSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T01:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /patrol-assignments/${pa_alpha_id}/complete"
              payload: { miles_patrolled: 7.0 }
              as: FieldPatrolSupervisor
            - call: "POST /patrol-assignments/${pa_bravo_id}/complete"
              payload: { miles_patrolled: 6.0 }
              as: FieldPatrolSupervisor
            - call: "POST /patrol-assignments/${pa_charlie_id}/complete"
              payload: { miles_patrolled: 5.0 }
              as: FieldPatrolSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T02:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /circuits/${alpha_id}/re-energize"
              payload: {}
              as: PSPSDutyOfficer
              as_user_id: "duty_officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T03:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /circuits/${bravo_id}/re-energize"
              payload: {}
              as: PSPSDutyOfficer
              as_user_id: "duty_officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T04:30:00Z" }
              as: PSPSDutyOfficer
          trigger:
            - call: "POST /circuits/${charlie_id}/re-energize"
              payload: {}
              as: PSPSDutyOfficer
              as_user_id: "duty_officer_1"
          assert:
            - "PSPSEvent.${ev1_id}.benefit_variant == POST_EVENT"
            - "PSPSEvent.${ev1_id}.actual_de_energized_at == 2026-08-15T19:00:00Z"
            - "PSPSEvent.${ev1_id}.actual_restored_at == 2026-08-17T04:30:00Z"
            - "PSPSEvent.${ev1_id}.duration_hours == 34"
            - "PSPSEvent.${ev1_id}.customer_impact_score == 64.60"
            - "PSPSEvent.${ev1_id}.crc_mitigation_credit == 0.00"
            - "PSPSEvent.${ev1_id}.adjusted_customer_impact_score == 64.60"
            - "PSPSEvent.${ev1_id}.ignition_risk_avoided_score == 15.48"
            - "PSPSEvent.${ev1_id}.net_benefit_ratio == 0.2396"
            - "Before this trigger (event still PRE_EVENT with duration_hours 24) PSPSEvent.${ev1_id}.customer_impact_score was 45.60 and net_benefit_ratio was 0.3395"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fpi_four_component_blend_with_hardening_discount_drops_tier
        grounds:
          - calculations.fire_potential_index
          - calculations.circuit_hardened_fraction
          - entities.FirePotentialIndex.fields.hardened_fraction_applied
          - entities.Circuit.fields.covered_conductor_miles
        distinguishing_aspect: |
          fpi_score is a four-way weighted blend (0.35 wind + 0.30 dryness + 0.20 terrain + 0.15 equipment)
          in which the dryness term itself combines humidity and fuel moisture through two constants and the
          whole raw score is then multiplied by (1 - 0.40 * hardened_fraction); with 4.0 covered-conductor
          miles completed on 7.0 overhead miles hardened_fraction is 0.3429 and the identical weather drops
          the score from 85.93/R5 to 74.14/R4, so no single factor can be dropped or reordered.
        test_recipe:
          setup:
            - "Circuit ALPHA (TIER_3, overhead_miles 7.0, equipment_condition_index 55, inspected 2026-05-01 on a 36-month cycle) with the two-station observation set that yields effective inputs 56.5 / 23.6 / 8.4."
            - "A COVERED_CONDUCTOR project for 4.0 miles has been approved and fully recorded, so Circuit.covered_conductor_miles == 4.0 and hardened_fraction == 0.3429."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { alpha_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-A1", circuit_id: "${alpha_id}", elevation_ft: 3200, representativeness_weight: 0.70, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a1_id: $.data.id }
