          - calculations.claim_settlement.variants
        excluded_because:
          difficulty_instance: claim_provisional_vs_final_settlement_divergence
          rationale: "That §1.8 dual_variant_calc instance already runs both claim_settlement variants over one set of reported damages and asserts the exact PROVISIONAL and FINAL figures plus the signed delta between them, which is precisely the divergence claim for this calculation."

      - name: premium_variant_selection_by_context
        claim_type: variant_selection
        grounds:
          - calculations.hazard_base_premium.variants
          - entities.Policy.fields.rating_variant
        excluded_because:
          difficulty_instance: premium_quote_time_vs_renewal_time_on_self_declared_retrofit
          rationale: "That §1.8 dual_variant_calc instance already proves the context-to-variant mapping - QUOTE_TIME is selected by POST /eqp/policies and RENEWAL_TIME by the renew endpoint - and asserts the recorded rating_variant together with the 5% divergence a SELF_DECLARED retrofit suffers at renewal."

      - name: event_ledger_reconciliation_when_the_settlement_variant_switches
        claim_type: reconciliation
        grounds:
          - calculations.event_loss_waterfall
          - calculations.claim_settlement.variants
        excluded_because:
          difficulty_instance: event_loss_conservation_across_finalize_reopen_and_refinalize
          rationale: "That §1.8 compensating_invariant instance already follows the PROVISIONAL-to-FINAL switch into the event ledger and back out again: it asserts the aggregate, retained, ceded and uncovered figures after finalize, their full reversal on reopen with paid_cents preserved, and their exact reproduction on re-finalize. It is the reconciliation claim in its strongest form."

  - section: validations
    instances:
      - name: inspection_window_duration_and_past_start_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations.ERR_INSPECTION_DURATION_INVALID
          - validations.ERR_INSPECTION_IN_PAST
          - validations.ERR_INVALID_WINDOW
        distinguishing_aspect: "The three window checks fire in their declared order on POST /eqp/inspections: an empty interval is ERR_INVALID_WINDOW, a non-empty interval outside [30, 240] minutes is ERR_INSPECTION_DURATION_INVALID, and a well-sized interval that starts before the logical clock is ERR_INSPECTION_IN_PAST."
        test_recipe:
          setup:
            - "Clock stays at the default 2026-08-01T00:00:00Z"
            - "A grant is driven to FUNDS_RESERVED and a project for a CERTIFIED contractor is driven to AWAITING_INSPECTION so that only the window rules can fail"
          setup_api_calls:
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Rosa Vintila", email: "rosa@example.com", county_code: "06067" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "82 Window Walk", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_CRIPPLE_WALL", year_built: 1972, dwelling_limit_cents: 20000000 }
