          assert:
            - "${pst} == FINAL_RELEASE_PENDING  # auto-advanced after last trade became closeout_ready"
            - "${famt} == 500000  # 1000000 held - 500000 already PAID"

      - name: open_counts_exclude_terminal_items
        claim_type: input_set_filtering
        grounds: [calculations.open_blocking_counts]
        distinguishing_aspect: "The blocking input set is status IN {OPEN, READY_FOR_REVIEW}: a VERIFIED item and a VOIDED item both drop out, an untouched OPEN item stays counted."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, walked trade"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "MJ", severity: "MAJOR", location_building: "B1", location_floor: "L1", location_area: "R1", photo_ref: "i1" }, as: GCInspector, captures: { i1: $.data.id } }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "MN-open", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R2", photo_ref: "i2" }, as: GCInspector, captures: { i2: $.data.id } }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "MN-void", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R3", photo_ref: "i3" }, as: GCInspector, captures: { i3: $.data.id } }
            - { call: "POST /closeout/punch-items/${i1}/mark-ready", as: SubcontractorRep, as_user_id: "${t}" }
            - { call: "POST /closeout/punch-items/${i1}/verify", as: GCInspector, as_user_id: "insp-1" }
            - { call: "POST /closeout/punch-items/${i3}/void", as: GCProjectManager }
          trigger:
            - { call: "GET /closeout/projects/${p}", as: GCProjectManager, captures: { mj: $.data.open_major_count, mn: $.data.open_minor_count } }
          assert:
            - "${mj} == 0  # verified item excluded"
            - "${mn} == 1  # only the untouched OPEN minor counts; voided minor excluded"
            - "PunchItem.${i1}.status == VERIFIED AND PunchItem.${i3}.status == VOIDED"

      - name: warranty_sla_severity_constants_calendar
        claim_type: constants_applied
        grounds: [calculations.warranty_sla_due_at]
        distinguishing_aspect: "SLA_DAYS constants drive the result: CRITICAL +1 day and MINOR +30 days from the same triage instant under CALENDAR mode."
        test_recipe:
          setup: ["CLOSED CALENDAR project; two REPORTED warranty cases; clock pinned at Friday 2026-09-04T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10, warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-04T00:00:00Z" }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/start-closeout", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "OM_MANUAL", file_ref: "om" }, as: SubcontractorRep, as_user_id: "${t}", captures: { d1: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "WARRANTY_DOC", file_ref: "wd" }, as: SubcontractorRep, as_user_id: "${t}", captures: { d2: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "AS_BUILT", file_ref: "ab" }, as: SubcontractorRep, as_user_id: "${t}", captures: { d3: $.data.id } }
            - { call: "POST /closeout/closeout-documents/${d1}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${d2}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${d3}/approve", as: GCProjectManager }
            - { call: "POST /closeout/trade-packages/${t}/lien-waiver-submission", payload: { waiver_type: "UNCONDITIONAL", amount_cents: 1000000, file_ref: "wvr" }, as: SubcontractorRep, as_user_id: "${t}" }
            - { call: "POST /closeout/trade-packages/${t}/lien-waiver-decision", payload: { decision: "ACCEPT" }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${p}", trade_package_id: "${t}", system_name: "AHU-1", location_room: "TR-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: GCProjectManager, captures: { s: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions/${s}/conduct", payload: { attendee_count: 2 }, as: GCProjectManager }
            - { call: "GET /closeout/projects/${p}", as: GCProjectManager, captures: { pv: $.data.version } }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${p}", kind: "FINAL", expected_project_version: "${pv}" }, as: GCProjectManager, captures: { rf: $.data.id } }
            - { call: "POST /closeout/retainage-releases/${rf}/approve", as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/close", as: GCProjectManager }
            - { call: "POST /closeout/warranty-cases", payload: { project_id: "${p}", title: "Leak", severity: "CRITICAL", description: "pipe burst" }, as: OwnerRep, captures: { c1: $.data.id } }
            - { call: "POST /closeout/warranty-cases", payload: { project_id: "${p}", title: "Squeak", severity: "MINOR", description: "door squeak" }, as: OwnerRep, captures: { c2: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T10:00:00Z" }, as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/warranty-cases/${c1}/triage", payload: { severity: "CRITICAL" }, as: GCProjectManager, captures: { sla1: $.data.sla_due_at } }
            - { call: "POST /closeout/warranty-cases/${c2}/triage", payload: { severity: "MINOR" }, as: GCProjectManager, captures: { sla2: $.data.sla_due_at } }
          assert:
            - "${sla1} == 2026-09-05T10:00:00Z  # CRITICAL: +1 calendar day"
            - "${sla2} == 2026-10-04T10:00:00Z  # MINOR: +30 calendar days"

  # ------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: duplicate_trade_name_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_TRADE]"]
        distinguishing_aspect: "trade_name is unique per project: a second ELECTRICAL package on the same project is rejected, while the same trade_name on a different project is fine."
        test_recipe:
          setup: ["Project with one ELECTRICAL trade"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "VoltCo" }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_TRADE"

      - name: walk_duration_thirty_minutes_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Walk duration must be >= 30 minutes: exactly 30 minutes passes, 29 minutes fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["PUNCH_ACTIVE project with one trade; clock default"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T09:29:00Z" }, as: GCProjectManager, captures: { err: $.data.error_id } }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T09:30:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST  # 29 minutes rejected"
            - "PunchWalk.${w} created with status SCHEDULED  # exactly 30 minutes accepted"

      - name: walk_scheduled_in_past_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SCHEDULED_IN_PAST]"]
        distinguishing_aspect: "A walk whose scheduled_start precedes the logical clock is rejected."
        test_recipe:
          setup: ["PUNCH_ACTIVE project; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-07-31T09:00:00Z", scheduled_end: "2026-07-31T10:00:00Z" }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SCHEDULED_IN_PAST"

      - name: walk_complete_before_window_returns_error
        claim_type: violation_to_error
        grounds: [state_machines.PunchWalk.SCHEDULED_to_COMPLETED, "errors[ERR_WALK_NOT_STARTED]"]
        distinguishing_aspect: "Completing a walk before its scheduled_start per the logical clock is rejected; completing at exactly scheduled_start succeeds (>= boundary)."
        test_recipe:
          setup: ["PUNCH_ACTIVE project; walk scheduled 2026-08-03T09:00:00Z-10:00:00Z; clock at 2026-08-03T08:00:00Z"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector, captures: { err: $.data.error_id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_WALK_NOT_STARTED"
            - "${st} == COMPLETED  # exactly at scheduled_start passes (>=)"

      - name: session_conduct_before_start_returns_error
        claim_type: violation_to_error
        grounds: [state_machines.TrainingSession.SCHEDULED_to_CONDUCTED, "errors[ERR_SESSION_NOT_STARTED]"]
        distinguishing_aspect: "conduct before scheduled_start is rejected even though the session is SCHEDULED and attendee_count is valid."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project; session scheduled 2026-08-10T09:00:00Z; clock at 2026-08-03T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${p}", trade_package_id: "${t}", system_name: "AHU-1", location_room: "TR-1", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: GCProjectManager, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /closeout/training-sessions/${s}/conduct", payload: { attendee_count: 3 }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SESSION_NOT_STARTED"
            - "TrainingSession.${s}.status == SCHEDULED AND attendee_count == null"

      - name: conduct_zero_attendees_boundary
        claim_type: violation_to_error
        grounds: [state_machines.TrainingSession.SCHEDULED_to_CONDUCTED, "errors[ERR_NO_ATTENDEES]"]
        distinguishing_aspect: "attendee_count boundary: 0 is rejected with ERR_NO_ATTENDEES; 1 is accepted (>= 1)."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project; session window reached (clock == scheduled_start)"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${p}", trade_package_id: "${t}", system_name: "AHU-1", location_room: "TR-1", scheduled_start: "2026-08-04T09:00:00Z", scheduled_end: "2026-08-04T10:00:00Z" }, as: GCProjectManager, captures: { s: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/training-sessions/${s}/conduct", payload: { attendee_count: 0 }, as: GCProjectManager, captures: { err: $.data.error_id } }
            - { call: "POST /closeout/training-sessions/${s}/conduct", payload: { attendee_count: 1 }, as: GCProjectManager, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_NO_ATTENDEES  # 0 rejected"
            - "${st} == CONDUCTED  # 1 accepted (lower boundary inclusive)"

      - name: third_reschedule_returns_limit_error
        claim_type: violation_to_error
        grounds: [state_machines.TrainingSession.SCHEDULED_to_SCHEDULED, "errors[ERR_RESCHEDULE_LIMIT]"]
        distinguishing_aspect: "reschedule_count caps at 2: the first two reschedules with fresh OCC versions succeed; the third, also with a fresh version, fails with ERR_RESCHEDULE_LIMIT."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project; one SCHEDULED session"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${p}", trade_package_id: "${t}", system_name: "AHU-1", location_room: "TR-9", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: GCProjectManager, captures: { s: $.data.id, sv1: $.data.version } }
          trigger:
            - { call: "POST /closeout/training-sessions/${s}/reschedule", payload: { scheduled_start: "2026-08-11T09:00:00Z", scheduled_end: "2026-08-11T10:00:00Z", expected_training_session_version: "${sv1}" }, as: GCProjectManager, captures: { sv2: $.data.version, rc1: $.data.reschedule_count } }
            - { call: "POST /closeout/training-sessions/${s}/reschedule", payload: { scheduled_start: "2026-08-12T09:00:00Z", scheduled_end: "2026-08-12T10:00:00Z", expected_training_session_version: "${sv2}" }, as: GCProjectManager, captures: { sv3: $.data.version, rc2: $.data.reschedule_count } }
            - { call: "POST /closeout/training-sessions/${s}/reschedule", payload: { scheduled_start: "2026-08-13T09:00:00Z", scheduled_end: "2026-08-13T10:00:00Z", expected_training_session_version: "${sv3}" }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${rc1} == 1 AND ${rc2} == 2  # first two reschedules succeed"
            - "${err} == ERR_RESCHEDULE_LIMIT  # third rejected despite fresh version"
            - "TrainingSession.${s}.scheduled_start == 2026-08-12T09:00:00Z (unchanged by failed third)"

      - name: missing_photo_ref_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", entities.PunchItem.fields.photo_ref, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "photo_ref is a required input (photo attachment is mandatory for punch items); omitting it fails schema validation."
        test_recipe:
          setup: ["PUNCH_ACTIVE project with one trade"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "No photo", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R1" }, as: GCInspector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: doc_already_pending_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DOC_ALREADY_PENDING]"]
        distinguishing_aspect: "At most one SUBMITTED document per (trade_package_id, doc_type): a second OM_MANUAL submission while the first is pending is rejected."
        test_recipe:
          setup: ["PUNCH_ACTIVE project; one SUBMITTED OM_MANUAL doc for the trade"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "OM_MANUAL", file_ref: "om-v1" }, as: SubcontractorRep, as_user_id: "${t}" }
          trigger:
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "OM_MANUAL", file_ref: "om-v2" }, as: SubcontractorRep, as_user_id: "${t}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DOC_ALREADY_PENDING"

      - name: doc_type_already_satisfied_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DOC_TYPE_ALREADY_SATISFIED]"]
        distinguishing_aspect: "Once a doc type is APPROVED for a trade, any new submission of that type is rejected (the pair is locked)."
        test_recipe:
