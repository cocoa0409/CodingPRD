# =============================================================================
# task_0455_talent_agency_booking — SCAFFOLD (§1.0–§1.7)
# Difficulty band: Expert (10–15 entities)
# =============================================================================

scenario: "Talent Agency & Booking (actors/models): talent roster & portfolio/comp card, casting/job submission, audition & callback scheduling, booking & rate/usage rights, agency commission & escrow, payment (SAG/non-union) & residual, availability/conflict hold, deal memo"

domain_name: talent-agency-booking
api_prefix: /

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. Every FK has a
  # filtered-list GET (GET /<children>?<fk>=...) for reverse reachability.

  state_machine_shape: cyclic
  # DealMemo negotiation rounds loop (OFFERED<->COUNTERED); Submission branches
  # (fork-join across audition/callback); Booking carries parallel dimensions
  # (booking_status x payment_status).

  relationship_patterns:
    - one_to_many        # Talent -> CompCard, CastingCall -> Submission
    - many_to_many       # Submission junctions Talent x CastingCall
    - cross_aggregate    # Booking references DealMemo, AvailabilityHold, CastingCall

  role_model: peer_roles
  # CastingDirector owns casting calls + audition slots + deal-memo offers;
  # Talent owns comp card + availability + deal-memo counters/accepts;
  # Agent is the agency operator (opaque) who runs roster, bookings, escrow, payments.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency legal name" }
      - { name: commission_rate_bps, type: integer, source: input, description: "Agency commission in basis points (e.g. 1000 = 10%)", constraints: "0..5000 inclusive" }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "= sum(CommissionEntry.held_cents WHERE status=HELD for this agency). Reconciled on every CommissionEntry mutation." }
      - { name: booked_day_count, type: integer, source: computed, description: "= sum over all Booking with this agency where booking_status IN {CONFIRMED, COMPLETED} of inclusive day span (end_date - start_date + 1). Reconciled on booking confirm/cancel/complete." }

  - name: CastingDirector
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Casting director name (X-User-ID of CastingDirector role equals this entity id)" }
      - { name: studio, type: string, source: input, description: "Studio / production house name" }

  - name: Talent
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the agency representing this talent" }
      - { name: full_name, type: string, source: input, description: "Talent full legal name" }
      - { name: union_status, type: enum, source: input, description: "SAG | NON_UNION — drives payment/residual variant", constraints: "SAG, NON_UNION" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ROSTERED | SUSPENDED | ARCHIVED", default: PROSPECT }
      - { name: scale_rate_cents, type: integer, source: input, description: "Talent day-rate scale floor in cents used in residual/payment math", constraints: ">= 0" }
      - { name: booked_day_count, type: integer, source: computed, description: "= sum over Booking for this talent where booking_status IN {CONFIRMED, COMPLETED} of inclusive day span (end_date - start_date + 1). Conserved quantity reconciled on booking confirm/cancel/complete." }

  - name: CompCard
    parent: Talent
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id; the talent this comp card belongs to" }
      - { name: headshot_url, type: string, source: input, description: "Primary headshot URL" }
      - { name: height_cm, type: integer, source: input, description: "Height in centimeters", constraints: ">= 1" }
      - { name: skills, type: array, source: input, description: "List of skill tags (strings)" }
      - { name: is_primary, type: boolean, source: system, description: "True for the talent's primary comp card; first card created is primary", default: false }

  - name: CastingCall
    parent: CastingDirector
    common_fields: true
    fields:
      - { name: casting_director_id, type: string, source: input, description: "FK -> CastingDirector.id; owner of this casting call" }
      - { name: title, type: string, source: input, description: "Project / role title" }
      - { name: media_type, type: enum, source: input, description: "BROADCAST_TV | CABLE | STREAMING | PRINT | DIGITAL — residual multiplier key", constraints: "BROADCAST_TV, CABLE, STREAMING, PRINT, DIGITAL" }
      - { name: usage_term_months, type: integer, source: input, description: "Usage-rights term length in months", constraints: ">= 1" }
      - { name: shoot_start_date, type: datetime, source: input, description: "First shoot day (ISO 8601 UTC date-time)" }
      - { name: shoot_end_date, type: datetime, source: input, description: "Last shoot day (ISO 8601 UTC date-time); MUST be >= shoot_start_date" }
      - { name: offered_day_rate_cents, type: integer, source: input, description: "Day rate the production offers in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | FILLED", default: OPEN }

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - { name: casting_call_id, type: string, source: input, description: "FK -> CastingCall.id; the call this submission targets" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id; the submitted talent" }
      - { name: comp_card_id, type: string, source: input, description: "FK -> CompCard.id; the comp card attached to the submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | AUDITION_SCHEDULED | CALLBACK_SCHEDULED | OFFER_EXTENDED | DECLINED | WITHDRAWN", default: SUBMITTED }

  - name: AuditionSlot
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the submission being auditioned" }
      - { name: casting_director_id, type: string, source: input, description: "FK -> CastingDirector.id; resource owner whose room/calendar holds the slot" }
      - { name: slot_kind, type: enum, source: input, description: "AUDITION | CALLBACK", constraints: "AUDITION, CALLBACK" }
      - { name: start_at, type: datetime, source: input, description: "Slot start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Slot end (ISO 8601 UTC); MUST be > start_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | RELEASED", default: SCHEDULED }

  - name: AvailabilityHold
    parent: null
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id; the talent whose calendar this hold blocks" }
      - { name: start_date, type: datetime, source: input, description: "Hold window start (ISO 8601 UTC, treated as inclusive day)" }
      - { name: end_date, type: datetime, source: input, description: "Hold window end (ISO 8601 UTC); MUST be >= start_date" }
      - { name: hold_kind, type: enum, source: input, description: "FIRST_REFUSAL | CONFIRMED_BOOKING — confirmed booking holds beat first-refusal holds", constraints: "FIRST_REFUSAL, CONFIRMED_BOOKING" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED | CONFLICTED", default: ACTIVE }

  - name: DealMemo
    parent: null
    common_fields: true
    fields:
      - { name: casting_call_id, type: string, source: input, description: "FK -> CastingCall.id; the call the deal is for" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id; the talent being negotiated" }
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the submission this deal advances from" }
      - { name: current_day_rate_cents, type: integer, source: system, description: "Latest day rate on the table (last offer or counter)", constraints: ">= 0" }
      - { name: usage_term_months, type: integer, source: system, description: "Latest usage-rights term on the table" }
      - { name: round_count, type: integer, source: system, description: "Number of offer+counter exchanges so far; starts at 0, +1 per offer and per counter", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | COUNTERED | ACCEPTED | REJECTED | VOIDED", default: DRAFT }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: deal_memo_id, type: string, source: input, description: "FK -> DealMemo.id; the accepted deal this booking realizes" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id; the booked talent" }
      - { name: casting_call_id, type: string, source: input, description: "FK -> CastingCall.id; the project" }
      - { name: availability_hold_id, type: string, source: input, description: "FK -> AvailabilityHold.id; the CONFIRMED_BOOKING hold reserving the talent's calendar" }
      - { name: start_date, type: datetime, source: input, description: "Booking first work day (ISO 8601 UTC, inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Booking last work day (ISO 8601 UTC, inclusive); MUST be >= start_date" }
      - { name: agreed_day_rate_cents, type: integer, source: system, description: "Day rate copied from the DealMemo at confirmation time", constraints: ">= 0" }
      - { name: usage_term_months, type: integer, source: system, description: "Usage-rights term copied from the DealMemo at confirmation" }
      - { name: gross_fee_cents, type: integer, source: computed, description: "= agreed_day_rate_cents * inclusive day span (end_date - start_date + 1)" }
      - { name: provisional_commission_cents, type: integer, source: computed, description: "Commission projected at confirmation from gross_fee_cents (forward-looking variant)" }
      - { name: final_commission_cents, type: integer, source: computed, description: "Commission settled at payment from actual paid amount (chronological variant); null until COMPLETED" }
      - { name: booking_status, type: enum, source: system, description: "PENDING | CONFIRMED | COMPLETED | CANCELLED — work-lifecycle dimension", default: PENDING }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID — settlement dimension, evolves independently of booking_status", default: UNPAID }

  - name: CommissionEntry
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the agency holding/earning the commission" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking that generated this entry" }
      - { name: held_cents, type: integer, source: system, description: "Commission amount held in escrow for this entry while status=HELD; 0 once RELEASED or REVERSED", default: 0 }
      - { name: earned_cents, type: integer, source: system, description: "Commission recognized as agency revenue once RELEASED; 0 while HELD or REVERSED", default: 0 }
      - { name: status, type: enum, source: system, description: "HELD | RELEASED | REVERSED", default: HELD }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking being paid out" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id; payee talent" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Producer-remitted gross amount in cents for this booking", constraints: ">= 0" }
      - { name: union_status_snapshot, type: enum, source: computed, description: "Copied from Talent.union_status at payment time; selects SAG vs NON_UNION net math", constraints: "SAG, NON_UNION" }
      - { name: commission_withheld_cents, type: integer, source: computed, description: "Commission deducted from gross at payment (final variant)" }
      - { name: net_to_talent_cents, type: integer, source: computed, description: "Talent take-home after commission and SAG pension/health where applicable" }
      - { name: status, type: enum, source: system, description: "POSTED — payment is append-only once created", default: POSTED }

  - name: ResidualSchedule
    parent: null
    common_fields: true
    fields:
      - { name: payment_id, type: string, source: input, description: "FK -> Payment.id; the initial payment this residual chain derives from" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the originating booking" }
      - { name: period_index, type: integer, source: input, description: "1-based residual run period index (1st rerun, 2nd, ...)", constraints: ">= 1" }
      - { name: residual_amount_cents, type: integer, source: computed, description: "Residual due for this period (SAG residuals decay by run-period tier; NON_UNION residuals are 0)" }
      - { name: status, type: enum, source: system, description: "DUE | PAID | VOID", default: DUE }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Talent
    initial_state: PROSPECT
    terminal_states: [ARCHIVED]
    transitions:
      - from: PROSPECT
        to: ROSTERED
        trigger: "POST /talents/{id}/roster"
        actor: Agent
        preconditions:
          - "Talent has at least one CompCard (ERR_NO_COMP_CARD)"
        side_effects:
          - "status = ROSTERED"

      - from: ROSTERED
        to: SUSPENDED
        trigger: "POST /talents/{id}/suspend"
        actor: Agent
        preconditions: []
        side_effects:
          - "status = SUSPENDED"

      - from: SUSPENDED
        to: ROSTERED
        trigger: "POST /talents/{id}/roster"
        actor: Agent
        preconditions: []
        side_effects:
          - "status = ROSTERED"

      - from: ROSTERED
        to: ARCHIVED
        trigger: "POST /talents/{id}/archive"
        actor: Agent
        preconditions:
          - "No Booking for this talent in booking_status IN {PENDING, CONFIRMED} (ERR_TALENT_HAS_OPEN_BOOKINGS)"
        side_effects:
          - "status = ARCHIVED"
          - "All AvailabilityHold for this talent in status ACTIVE -> RELEASED"

      - from: SUSPENDED
        to: ARCHIVED
        trigger: "POST /talents/{id}/archive"
        actor: Agent
        preconditions:
          - "No Booking for this talent in booking_status IN {PENDING, CONFIRMED} (ERR_TALENT_HAS_OPEN_BOOKINGS)"
        side_effects:
          - "status = ARCHIVED"
          - "All AvailabilityHold for this talent in status ACTIVE -> RELEASED"

  - entity: CastingCall
    initial_state: OPEN
    terminal_states: [FILLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /casting-calls/{id}/close"
        actor: CastingDirector
        preconditions: []
        side_effects:
          - "CASCADE depth-2 origin: every Submission for this call in status IN {SUBMITTED, AUDITION_SCHEDULED, CALLBACK_SCHEDULED} -> WITHDRAWN (link 1)"
          - "Each Submission withdrawn above: its AuditionSlot rows in status SCHEDULED -> RELEASED (link 2, caused by link 1)"

      - from: CLOSED
        to: OPEN
        trigger: "POST /casting-calls/{id}/reopen"
        actor: CastingDirector
        preconditions: []
        side_effects:
          - "status = OPEN; withdrawn submissions are NOT resurrected"

      - from: OPEN
        to: FILLED
        trigger: "system: Booking for this call reaches booking_status CONFIRMED"
        actor: system
        preconditions:
          - "A Booking referencing this casting_call_id transitions to CONFIRMED"
        side_effects:
          - "status = FILLED"

  - entity: Submission
    initial_state: SUBMITTED
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: AUDITION_SCHEDULED
        trigger: "system: AuditionSlot with slot_kind AUDITION created for this submission"
        actor: system
        preconditions:
          - "CastingCall for this submission is status OPEN (cross-entity, ERR_CASTING_CALL_NOT_OPEN)"
        side_effects:
          - "status = AUDITION_SCHEDULED"

      - from: AUDITION_SCHEDULED
        to: CALLBACK_SCHEDULED
        trigger: "system: AuditionSlot with slot_kind CALLBACK created for this submission"
        actor: system
        preconditions:
          - "An AuditionSlot of slot_kind AUDITION for this submission is in status COMPLETED (ERR_AUDITION_NOT_COMPLETED)"
        side_effects:
          - "status = CALLBACK_SCHEDULED"

      - from: AUDITION_SCHEDULED
        to: OFFER_EXTENDED
        trigger: "system: DealMemo created from this submission"
        actor: system
        preconditions: []
        side_effects:
          - "status = OFFER_EXTENDED"

      - from: CALLBACK_SCHEDULED
        to: OFFER_EXTENDED
        trigger: "system: DealMemo created from this submission"
        actor: system
        preconditions: []
        side_effects:
          - "status = OFFER_EXTENDED"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /submissions/{id}/decline"
        actor: CastingDirector
        preconditions: []
        side_effects:
          - "status = DECLINED"

      - from: AUDITION_SCHEDULED
        to: DECLINED
        trigger: "POST /submissions/{id}/decline"
        actor: CastingDirector
        preconditions: []
        side_effects:
          - "status = DECLINED"
          - "AuditionSlot rows for this submission in status SCHEDULED -> RELEASED"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw  OR  system cascade from CastingCall CLOSED"
        actor: Talent
        preconditions: []
        side_effects:
          - "status = WITHDRAWN"

      - from: AUDITION_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw  OR  system cascade from CastingCall CLOSED"
        actor: Talent
        preconditions: []
        side_effects:
          - "status = WITHDRAWN"
          - "AuditionSlot rows for this submission in status SCHEDULED -> RELEASED"

      - from: CALLBACK_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw  OR  system cascade from CastingCall CLOSED"
        actor: Talent
        preconditions: []
        side_effects:
          - "status = WITHDRAWN"
          - "AuditionSlot rows for this submission in status SCHEDULED -> RELEASED"

  - entity: AuditionSlot
    initial_state: SCHEDULED
    terminal_states: [RELEASED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /audition-slots/{id}/complete"
        actor: CastingDirector
        preconditions:
          - "now (logical clock) >= end_at (ERR_SLOT_NOT_ENDED)"
        side_effects:
          - "status = COMPLETED"

      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /audition-slots/{id}/release  OR  system cascade (Submission WITHDRAWN/DECLINED or CastingCall CLOSED)"
        actor: CastingDirector
        preconditions: []
        side_effects:
          - "status = RELEASED"

  - entity: AvailabilityHold
    initial_state: ACTIVE
    terminal_states: [RELEASED, CONFLICTED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /availability-holds/{id}/release  OR  system cascade (Talent ARCHIVED, Booking CANCELLED)"
        actor: Agent
        preconditions: []
        side_effects:
          - "status = RELEASED"

      - from: ACTIVE
        to: CONFLICTED
        trigger: "system: a CONFIRMED_BOOKING hold is created overlapping this FIRST_REFUSAL hold"
        actor: system
        preconditions:
          - "this hold_kind = FIRST_REFUSAL and an overlapping CONFIRMED_BOOKING hold was just created"
        side_effects:
          - "status = CONFLICTED"

  - entity: DealMemo
    initial_state: DRAFT
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /deal-memos/{id}/offer (first offer)"
        actor: CastingDirector
        preconditions:
          - "Submission for this deal is in status OFFER_EXTENDED (cross-entity, ERR_SUBMISSION_NOT_OFFERABLE)"
        side_effects:
          - "current_day_rate_cents = offer_day_rate_cents from body; usage_term_months = offer_usage_term_months"
          - "round_count += 1"
          - "status = OFFERED"

      - from: OFFERED
        to: COUNTERED
        trigger: "POST /deal-memos/{id}/counter"
        actor: Talent
        preconditions:
          - "round_count < MAX_ROUNDS (ERR_MAX_NEGOTIATION_ROUNDS)"
        side_effects:
          - "current_day_rate_cents = counter_day_rate_cents from body; usage_term_months = counter_usage_term_months"
          - "round_count += 1"
          - "status = COUNTERED"

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /deal-memos/{id}/offer (re-offer in negotiation loop)"
        actor: CastingDirector
        preconditions:
          - "round_count < MAX_ROUNDS (ERR_MAX_NEGOTIATION_ROUNDS)"
        side_effects:
          - "current_day_rate_cents = offer_day_rate_cents from body; usage_term_months = offer_usage_term_months"
          - "round_count += 1"
          - "status = OFFERED"

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /deal-memos/{id}/accept"
        actor: Talent
        preconditions: []
        side_effects:
          - "status = ACCEPTED"

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /deal-memos/{id}/accept"
        actor: CastingDirector
        preconditions: []
        side_effects:
          - "status = ACCEPTED"

      - from: OFFERED
        to: REJECTED
        trigger: "POST /deal-memos/{id}/reject"
        actor: Talent
        preconditions: []
        side_effects:
          - "status = REJECTED"

      - from: COUNTERED
        to: REJECTED
        trigger: "POST /deal-memos/{id}/reject"
        actor: CastingDirector
        preconditions: []
        side_effects:
          - "status = REJECTED"

      - from: ACCEPTED
        to: VOIDED
        trigger: "system: Booking realizing this deal is CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "status = VOIDED"

  - entity: Booking
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: Agent
        preconditions:
          - "DealMemo for this booking is in status ACCEPTED (cross-entity, ERR_DEAL_NOT_ACCEPTED)"
          - "AvailabilityHold for this booking is hold_kind CONFIRMED_BOOKING and status ACTIVE (ERR_HOLD_NOT_ACTIVE)"
          - "Talent status is ROSTERED (cross-entity, ERR_TALENT_NOT_ROSTERED)"
        side_effects:
          - "booking_status = CONFIRMED"
          - "agreed_day_rate_cents = DealMemo.current_day_rate_cents; usage_term_months = DealMemo.usage_term_months"
          - "gross_fee_cents recomputed (calc booking_gross_fee)"
          - "provisional_commission_cents recomputed (calc provisional_commission)"
          - "a CommissionEntry is created with status HELD and held_cents = provisional_commission_cents"
          - "Agency.escrow_balance_cents reconciled += held_cents"
          - "Talent.booked_day_count and Agency.booked_day_count reconciled += inclusive day span"
          - "CastingCall referenced by this booking auto-transitions OPEN -> FILLED"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: Agent
        preconditions:
          - "now (logical clock) >= end_date (ERR_BOOKING_NOT_ENDED)"
        side_effects:
          - "booking_status = COMPLETED"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Agent
        preconditions: []
        side_effects:
          - "booking_status = CANCELLED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Agent
        preconditions:
          - "payment_status = UNPAID (ERR_BOOKING_ALREADY_PAID)"
        side_effects:
          - "CASCADE depth-4 origin: booking_status = CANCELLED (link 1)"
          - "link 2 (caused by link 1): AvailabilityHold for this booking ACTIVE -> RELEASED"
          - "link 3 (caused by link 1): DealMemo for this booking ACCEPTED -> VOIDED"
          - "link 4 (caused by link 1): CommissionEntry for this booking HELD -> REVERSED, held_cents set to 0; Agency.escrow_balance_cents reconciled -= prior held_cents"
          - "Talent.booked_day_count and Agency.booked_day_count reconciled -= inclusive day span"

  - entity: Booking_payment_dimension
    initial_state: UNPAID
    terminal_states: [PAID]
    note: "Parallel state dimension on Booking.payment_status; evolves independently of booking_status."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "system: Payment created for this booking via POST /payments"
        actor: Agent
        preconditions:
          - "booking_status = COMPLETED (cross-entity gate, ERR_BOOKING_NOT_COMPLETED)"
        side_effects:
          - "payment_status = PAID"
          - "final_commission_cents recomputed from payment (calc final_commission)"
          - "CommissionEntry for this booking HELD -> RELEASED; earned_cents = final_commission_cents, held_cents set to 0"
          - "Agency.escrow_balance_cents reconciled -= prior held_cents"

  - entity: ResidualSchedule
    initial_state: DUE
    terminal_states: [PAID, VOID]
    transitions:
      - from: DUE
        to: PAID
        trigger: "POST /residual-schedules/{id}/pay"
        actor: Agent
        preconditions:
          - "residual_amount_cents > 0 (ERR_NO_RESIDUAL_DUE)"
        side_effects:
          - "status = PAID"

      - from: DUE
        to: VOID
        trigger: "POST /residual-schedules/{id}/void"
        actor: Agent
        preconditions: []
        side_effects:
          - "status = VOID"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-talent
    parent_entity: Talent
    write_endpoint: "POST /bookings"
    occ_field: "expected_talent_version"
    description: |
      Creating a Booking against a Talent whose version has advanced since the
      client last observed it is rejected. A Booking reserves the talent's
      calendar window; another writer may have just confirmed a different
      booking (which bumps Talent.version via the booked_day_count
      reconciliation side effect), so the current writer's view of the talent
      is stale and the create is refused.
    error_id: ERR_STALE_TALENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_gross_fee
    trigger: "Booking PENDING -> CONFIRMED"
    algorithm: aggregation
    formula: |
      day_span = (end_date.date - start_date.date) + 1   # inclusive day count
      gross_fee_cents = agreed_day_rate_cents * day_span
    input_set: "single Booking row at confirmation"
    precision: "integer cents, exact (no rounding)"

  - name: provisional_commission
    trigger: "Booking PENDING -> CONFIRMED (forward-looking variant)"
    algorithm: forward_looking
    formula: |
      # projected commission from the QUOTED gross fee, computed BEFORE any
      # money moves. Rounding: round_half_up to whole cents.
      provisional_commission_cents = round_half_up(gross_fee_cents * agency.commission_rate_bps / 10000)
    input_set: "Booking.gross_fee_cents (projected) and owning Agency.commission_rate_bps"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "whole cents, round_half_up"
    variants:
      - name: provisional
        when: "at Booking confirmation, on the quoted gross_fee_cents"
        difference: "uses projected gross fee; does not depend on actual remitted amount"

  - name: final_commission
    trigger: "Payment created for a COMPLETED Booking (chronological variant)"
    algorithm: chronological
    formula: |
      # commission settled from the ACTUAL producer-remitted gross at payment time.
      # Rounding: round_half_up to whole cents.
      final_commission_cents = round_half_up(payment.gross_amount_cents * agency.commission_rate_bps / 10000)
      commission_delta_cents = final_commission_cents - booking.provisional_commission_cents
    input_set: "Payment.gross_amount_cents (actual) and owning Agency.commission_rate_bps"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "whole cents, round_half_up"
    variants:
      - name: final
        when: "at Payment, on the actual remitted gross_amount_cents"
        difference: "settles on remitted amount; differs from provisional whenever actual gross != quoted gross"

  - name: talent_availability_projection
    trigger: "GET /talents/{id}/availability-summary"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING availability: counts every ACTIVE hold (both FIRST_REFUSAL
      # and CONFIRMED_BOOKING), treating first-refusal holds as if they will
      # convert. projected_blocked_days = sum over AvailabilityHold for talent
      # where status = ACTIVE of inclusive day span (end_date - start_date + 1).
      projected_blocked_days = sum(inclusive_day_span(h) for h in holds if h.status == ACTIVE)
    input_set: "AvailabilityHold rows for the talent in status ACTIVE (both hold_kind values)"
    precision: "integer days"
    variants:
      - name: forward_looking_projection
        when: "availability summary read; includes speculative FIRST_REFUSAL holds"
        difference: "counts FIRST_REFUSAL holds; the committed variant below excludes them"

  - name: talent_committed_days
    trigger: "GET /talents/{id}/availability-summary"
    algorithm: chronological
    formula: |
      # COMMITTED (chronological) days: only days actually consumed by holds that
      # back a CONFIRMED/COMPLETED booking, processed in created_at ASC order with
      # overlapping confirmed windows merged so a day counts once.
      committed_days = merged_inclusive_day_count(
        [ inclusive_window(h) for h in holds
          if h.status == ACTIVE and h.hold_kind == CONFIRMED_BOOKING ],
        sort_key = created_at ASC )
    input_set: "AvailabilityHold rows for the talent in status ACTIVE with hold_kind=CONFIRMED_BOOKING"
    precision: "integer days"
    variants:
      - name: committed_chronological
        when: "availability summary read; excludes speculative holds and merges overlaps"
        difference: "excludes FIRST_REFUSAL holds and de-duplicates overlapping confirmed days"

  - name: sag_residual
    trigger: "POST /residual-schedules (residual run period accrual)"
    algorithm: tiered_pricing
    formula: |
      # COMBINATORIAL mode (a): >=3 inputs with non-linear tiered + media branch.
      # NON_UNION talent => 0 (no residuals).
      if talent.union_status == NON_UNION: residual_amount_cents = 0
      else:  # SAG
        base = booking.gross_fee_cents
        media_mult = MEDIA_MULTIPLIER_BPS[casting_call.media_type]   # bps
        # period tier multiplier: 1st rerun pays full, then decays by tier
        if period_index == 1:   period_mult_bps = 10000   # 100%
        elif period_index == 2: period_mult_bps = 7500    # 75%
        elif period_index == 3: period_mult_bps = 5000    # 50%
        else:                   period_mult_bps = 2500    # 25% flat for 4th+
        residual_amount_cents = round_half_up(
          base * media_mult / 10000 * period_mult_bps / 10000 )
    input_set: "originating Booking.gross_fee_cents, CastingCall.media_type, Talent.union_status, ResidualSchedule.period_index"
    constants:
      MEDIA_MULTIPLIER_BPS: { BROADCAST_TV: 3000, CABLE: 2000, STREAMING: 1500, PRINT: 1000, DIGITAL: 1200 }
      BPS_DENOMINATOR: 10000
    precision: "whole cents, round_half_up at the FINAL step only (base*media then *period, single rounding)"

  - name: payment_net_to_talent
    trigger: "Payment created (POST /payments)"
    algorithm: weighted_scoring
    formula: |
      # COMBINATORIAL mode (b): multi-step rounding where ORDER is pinned.
      # PINNED ORDER: (1) compute commission and round it; (2) for SAG, compute
      # pension+health contribution and round it; (3) subtract BOTH already-rounded
      # figures from gross. Do NOT sum raw then round once.
      commission_withheld_cents = round_half_up(gross_amount_cents * agency.commission_rate_bps / 10000)   # step 1
      if talent.union_status == SAG:
        ph_cents = round_half_up(gross_amount_cents * SAG_PH_BPS / 10000)                                    # step 2
      else:
        ph_cents = 0
      net_to_talent_cents = gross_amount_cents - commission_withheld_cents - ph_cents                        # step 3
    input_set: "Payment.gross_amount_cents, Agency.commission_rate_bps, Talent.union_status"
    constants:
      SAG_PH_BPS: 1850     # SAG pension & health 18.5%
      BPS_DENOMINATOR: 10000
    precision: "whole cents; round commission and P&H SEPARATELY (per-component) BEFORE subtracting — order pinned"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Required request body fields present and typed; enums in declared set"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_talent_version equals current Talent.version on booking create"
    error_id: ERR_STALE_TALENT_VERSION
    http_status: 412
    applies_to: "POST /bookings"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity gate: referenced sibling entity is in the required state (e.g. DealMemo ACCEPTED before booking confirm, Submission OFFER_EXTENDED before deal offer, Booking COMPLETED before payment)"
    error_id: ERR_CROSS_ENTITY_GATE
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm, POST /deal-memos/{id}/offer, POST /payments, POST /audition-slots"

  - priority: 8
    category: business_safety
    check: "Talent union/booking referential integrity at payment: Payment.talent_id MUST equal Booking.talent_id; union_status snapshot resolves a known branch"
    error_id: ERR_TALENT_MISMATCH
    http_status: 409
    applies_to: "POST /payments"

  - priority: 9
    category: business_temporal
    check: "AuditionSlot must not overlap another SCHEDULED slot on the same casting_director_id within the buffer (closed interval + SLOT_BUFFER_MINUTES gap)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /audition-slots"

  - priority: 10
    category: business_temporal
    check: "AvailabilityHold must not overlap another ACTIVE hold of the SAME hold_kind on the same talent (half-open interval [start_date, end_date+1day), back-to-back allowed)"
    error_id: ERR_HOLD_OVERLAP
    http_status: 409
    applies_to: "POST /availability-holds"

  - priority: 11
    category: business_constraint
    check: "Date orderings: shoot_end_date >= shoot_start_date; end_at > start_at; end_date >= start_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /casting-calls, POST /audition-slots, POST /availability-holds, POST /bookings"

  - priority: 12
    category: business_constraint
    check: "DealMemo round_count < MAX_ROUNDS before a new offer/counter"
    error_id: ERR_MAX_NEGOTIATION_ROUNDS
    http_status: 409
    applies_to: "POST /deal-memos/{id}/offer, POST /deal-memos/{id}/counter"

  - priority: 13
    category: business_fiscal
    check: "Escrow sufficiency at payment release: Agency.escrow_balance_cents >= the booking's held CommissionEntry.held_cents being released (>= boundary, equality allowed)"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 409
    applies_to: "POST /payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the logical clock reads exactly this default and never falls back to wall-clock time. Drives all deadline/expiry/window rules deterministically."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

  # --- Agency ---
  - method: POST
    path: "/agencies"
    description: "Create an agency."
    roles: [Agent]
    code: 201
    input: [name, commission_rate_bps]
    output: Agency
    side_effects: ["escrow_balance_cents=0, booked_day_count=0"]

  - method: GET
    path: "/agencies/{id}"
    description: "Read an agency (escrow + booked-day derived fields)."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- CastingDirector ---
  - method: POST
    path: "/casting-directors"
    description: "Register a casting director (entity backing the CastingDirector role)."
    roles: [Agent, CastingDirector]
    code: 201
    input: [display_name, studio]
    output: CastingDirector
    side_effects: []

  - method: GET
    path: "/casting-directors/{id}"
    description: "Read a casting director."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: CastingDirector
    side_effects: []

  # --- Talent ---
  - method: POST
    path: "/talents"
    description: "Create a talent on the roster (initial status PROSPECT)."
    roles: [Agent]
    code: 201
    input: [agency_id, full_name, union_status, scale_rate_cents]
    output: Talent
    side_effects: ["status=PROSPECT, booked_day_count=0"]

  - method: GET
    path: "/talents"
    description: "List talents; filterable by agency_id."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: Talent[]
    side_effects: []

  - method: GET
    path: "/talents/{id}"
    description: "Read a talent."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: Talent
    side_effects: []

  - method: GET
    path: "/talents/{id}/availability-summary"
    description: "Computed read: forward-looking projected_blocked_days and committed_days for the talent."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: "{ projected_blocked_days: integer, committed_days: integer }"
    side_effects: ["runs calc talent_availability_projection and calc talent_committed_days"]

  - method: POST
    path: "/talents/{id}/roster"
    description: "Transition talent PROSPECT->ROSTERED or SUSPENDED->ROSTERED."
    roles: [Agent]
    code: 200
    input: []
    output: Talent
    side_effects: ["status=ROSTERED"]

  - method: POST
    path: "/talents/{id}/suspend"
    description: "Transition talent ROSTERED->SUSPENDED."
    roles: [Agent]
    code: 200
    input: []
    output: Talent
    side_effects: ["status=SUSPENDED"]

  - method: POST
    path: "/talents/{id}/archive"
    description: "Transition talent ROSTERED/SUSPENDED->ARCHIVED; releases ACTIVE availability holds."
    roles: [Agent]
    code: 200
    input: []
    output: Talent
    side_effects: ["status=ARCHIVED", "ACTIVE AvailabilityHold rows -> RELEASED"]

  # --- CompCard ---
  - method: POST
    path: "/comp-cards"
    description: "Create a comp card for a talent (first one created is primary)."
    roles: [Agent, Talent]
    code: 201
    input: [talent_id, headshot_url, height_cm, skills]
    output: CompCard
    side_effects: ["is_primary=true if first card for the talent, else false"]

  - method: GET
    path: "/comp-cards"
    description: "List comp cards; filterable by talent_id."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: ["talent_id?", "limit?", "offset?"]
    output: CompCard[]
    side_effects: []

  - method: GET
    path: "/comp-cards/{id}"
    description: "Read a comp card."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: CompCard
    side_effects: []

  # --- CastingCall ---
  - method: POST
    path: "/casting-calls"
    description: "Create a casting call (status OPEN)."
    roles: [CastingDirector]
    code: 201
    input: [casting_director_id, title, media_type, usage_term_months, shoot_start_date, shoot_end_date, offered_day_rate_cents]
    output: CastingCall
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/casting-calls"
    description: "List casting calls; filterable by casting_director_id and status."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: ["casting_director_id?", "status?", "limit?", "offset?"]
    output: CastingCall[]
    side_effects: []

  - method: GET
    path: "/casting-calls/{id}"
    description: "Read a casting call."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: CastingCall
    side_effects: []

  - method: POST
    path: "/casting-calls/{id}/close"
    description: "Close an OPEN casting call; cascades submission withdrawal and slot release."
    roles: [CastingDirector]
    code: 200
    input: []
    output: CastingCall
    side_effects: ["status=CLOSED", "open Submissions -> WITHDRAWN", "their SCHEDULED AuditionSlots -> RELEASED"]

  - method: POST
    path: "/casting-calls/{id}/reopen"
    description: "Reopen a CLOSED casting call (does not resurrect withdrawn submissions)."
    roles: [CastingDirector]
    code: 200
    input: []
    output: CastingCall
    side_effects: ["status=OPEN"]

  # --- Submission ---
  - method: POST
    path: "/submissions"
    description: "Submit a talent (with a comp card) to a casting call."
    roles: [Agent, Talent]
    code: 201
    input: [casting_call_id, talent_id, comp_card_id]
    output: Submission
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/submissions"
    description: "List submissions; filterable by casting_call_id, talent_id, and comp_card_id."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: ["casting_call_id?", "talent_id?", "comp_card_id?", "status?", "limit?", "offset?"]
    output: Submission[]
    side_effects: []

  - method: GET
    path: "/submissions/{id}"
    description: "Read a submission."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: POST
    path: "/submissions/{id}/decline"
    description: "Casting director declines a submission; releases its scheduled slots."
    roles: [CastingDirector]
    code: 200
    input: []
    output: Submission
    side_effects: ["status=DECLINED", "SCHEDULED AuditionSlots -> RELEASED"]

  - method: POST
    path: "/submissions/{id}/withdraw"
    description: "Talent withdraws a submission; releases its scheduled slots."
    roles: [Talent]
    code: 200
    input: []
    output: Submission
    side_effects: ["status=WITHDRAWN", "SCHEDULED AuditionSlots -> RELEASED"]

  # --- AuditionSlot ---
  - method: POST
    path: "/audition-slots"
    description: "Schedule an audition/callback slot for a submission; advances submission status. Enforces buffered overlap on the casting director's calendar."
    roles: [CastingDirector]
    code: 201
    input: [submission_id, casting_director_id, slot_kind, start_at, end_at]
    output: AuditionSlot
    side_effects: ["status=SCHEDULED", "Submission status advances (SUBMITTED->AUDITION_SCHEDULED for AUDITION; AUDITION_SCHEDULED->CALLBACK_SCHEDULED for CALLBACK)"]

  - method: GET
    path: "/audition-slots"
    description: "List audition slots; filterable by submission_id and casting_director_id."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: ["submission_id?", "casting_director_id?", "status?", "limit?", "offset?"]
    output: AuditionSlot[]
    side_effects: []

  - method: GET
    path: "/audition-slots/{id}"
    description: "Read an audition slot."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: AuditionSlot
    side_effects: []

  - method: POST
    path: "/audition-slots/{id}/complete"
    description: "Mark a slot COMPLETED (logical clock must be at/after end_at)."
    roles: [CastingDirector]
    code: 200
    input: []
    output: AuditionSlot
    side_effects: ["status=COMPLETED"]

  - method: POST
    path: "/audition-slots/{id}/release"
    description: "Release a SCHEDULED slot."
    roles: [CastingDirector]
    code: 200
    input: []
    output: AuditionSlot
    side_effects: ["status=RELEASED"]

  # --- AvailabilityHold ---
  - method: POST
    path: "/availability-holds"
    description: "Place an availability/conflict hold on a talent's calendar. CONFIRMED_BOOKING holds conflict overlapping ACTIVE FIRST_REFUSAL holds (those -> CONFLICTED). Same-kind overlap is rejected."
    roles: [Agent]
    code: 201
    input: [talent_id, start_date, end_date, hold_kind]
    output: AvailabilityHold
    side_effects: ["status=ACTIVE", "overlapping ACTIVE FIRST_REFUSAL holds -> CONFLICTED when this is CONFIRMED_BOOKING"]

  - method: GET
    path: "/availability-holds"
    description: "List availability holds; filterable by talent_id and status."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: ["talent_id?", "status?", "limit?", "offset?"]
    output: AvailabilityHold[]
    side_effects: []

  - method: GET
    path: "/availability-holds/{id}"
    description: "Read an availability hold."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: AvailabilityHold
    side_effects: []

  - method: POST
    path: "/availability-holds/{id}/release"
    description: "Release an ACTIVE hold."
    roles: [Agent]
    code: 200
    input: []
    output: AvailabilityHold
    side_effects: ["status=RELEASED"]

  # --- DealMemo ---
  - method: POST
    path: "/deal-memos"
    description: "Open a deal memo from a submission in OFFER_EXTENDED (status DRAFT). Advances the submission to OFFER_EXTENDED if it was AUDITION_SCHEDULED/CALLBACK_SCHEDULED."
    roles: [CastingDirector]
    code: 201
    input: [casting_call_id, talent_id, submission_id]
    output: DealMemo
    side_effects: ["status=DRAFT, round_count=0", "Submission -> OFFER_EXTENDED"]

  - method: GET
    path: "/deal-memos"
    description: "List deal memos; filterable by casting_call_id, talent_id, and submission_id."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: ["casting_call_id?", "talent_id?", "submission_id?", "status?", "limit?", "offset?"]
    output: DealMemo[]
    side_effects: []

  - method: GET
    path: "/deal-memos/{id}"
    description: "Read a deal memo."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: DealMemo
    side_effects: []

  - method: POST
    path: "/deal-memos/{id}/offer"
    description: "Casting director extends/re-extends an offer (DRAFT->OFFERED or COUNTERED->OFFERED). round_count += 1."
    roles: [CastingDirector]
    code: 200
    input: [offer_day_rate_cents, offer_usage_term_months]
    output: DealMemo
    side_effects: ["status=OFFERED, round_count+=1, current_day_rate_cents/usage_term_months updated"]

  - method: POST
    path: "/deal-memos/{id}/counter"
    description: "Talent counters an offer (OFFERED->COUNTERED). round_count += 1."
    roles: [Talent]
    code: 200
    input: [counter_day_rate_cents, counter_usage_term_months]
    output: DealMemo
    side_effects: ["status=COUNTERED, round_count+=1, current_day_rate_cents/usage_term_months updated"]

  - method: POST
    path: "/deal-memos/{id}/accept"
    description: "Accept the standing terms (OFFERED->ACCEPTED by Talent, COUNTERED->ACCEPTED by CastingDirector)."
    roles: [Talent, CastingDirector]
    code: 200
    input: []
    output: DealMemo
    side_effects: ["status=ACCEPTED"]

  - method: POST
    path: "/deal-memos/{id}/reject"
    description: "Reject the standing terms (OFFERED->REJECTED by Talent, COUNTERED->REJECTED by CastingDirector)."
    roles: [Talent, CastingDirector]
    code: 200
    input: []
    output: DealMemo
    side_effects: ["status=REJECTED"]

  # --- Booking ---
  - method: POST
    path: "/bookings"
    description: "Create a PENDING booking realizing an accepted deal. OCC-guarded on Talent.version. References the CONFIRMED_BOOKING availability hold."
    roles: [Agent]
    code: 201
    input: [deal_memo_id, talent_id, casting_call_id, availability_hold_id, start_date, end_date, expected_talent_version]
    output: Booking
    side_effects: ["booking_status=PENDING, payment_status=UNPAID"]

  - method: GET
    path: "/bookings"
    description: "List bookings; filterable by talent_id, casting_call_id, and deal_memo_id and availability_hold_id."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: ["talent_id?", "casting_call_id?", "deal_memo_id?", "availability_hold_id?", "booking_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/bookings/{id}"
    description: "Read a booking (gross_fee + commission derived fields)."
    roles: [Agent, CastingDirector, Talent]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Confirm a PENDING booking. Cross-entity gates on DealMemo ACCEPTED, hold ACTIVE, talent ROSTERED. Creates a HELD CommissionEntry, credits escrow, reconciles booked days, fills the casting call. Bumps Talent.version."
    roles: [Agent]
    code: 200
    input: [expected_talent_version]
    output: Booking
    side_effects: ["booking_status=CONFIRMED", "gross_fee/provisional_commission computed", "CommissionEntry HELD created", "Agency.escrow_balance_cents += held", "Talent/Agency booked_day_count += span", "CastingCall OPEN->FILLED", "Talent.version += 1"]

  - method: POST
    path: "/bookings/{id}/complete"
    description: "Complete a CONFIRMED booking (logical clock at/after end_date)."
    roles: [Agent]
    code: 200
    input: []
    output: Booking
    side_effects: ["booking_status=COMPLETED"]

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a PENDING or CONFIRMED (unpaid) booking; cascades hold release, deal void, commission reversal, booked-day reconciliation."
    roles: [Agent]
    code: 200
    input: []
    output: Booking
    side_effects: ["booking_status=CANCELLED", "hold->RELEASED", "deal->VOIDED", "CommissionEntry->REVERSED", "escrow & booked_day_count reconciled down"]

  # --- CommissionEntry ---
  - method: GET
    path: "/commission-entries"
    description: "List commission entries; filterable by agency_id and booking_id."
    roles: [Agent]
    code: 200
    input: ["agency_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: CommissionEntry[]
    side_effects: []

  - method: GET
    path: "/commission-entries/{id}"
    description: "Read a commission entry."
    roles: [Agent]
    code: 200
    input: []
    output: CommissionEntry
    side_effects: []

  # --- Payment ---
  - method: POST
    path: "/payments"
    description: "Post a payment for a COMPLETED booking. Settles final commission, releases the escrowed CommissionEntry, computes net-to-talent (SAG vs NON_UNION), marks booking PAID."
    roles: [Agent]
    code: 201
    input: [booking_id, talent_id, gross_amount_cents]
    output: Payment
    side_effects: ["status=POSTED", "Booking.payment_status=PAID", "final_commission computed", "CommissionEntry HELD->RELEASED", "escrow reconciled down", "net_to_talent computed"]

  - method: GET
    path: "/payments"
    description: "List payments; filterable by booking_id and talent_id."
    roles: [Agent, Talent]
    code: 200
    input: ["booking_id?", "talent_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/payments/{id}"
    description: "Read a payment."
    roles: [Agent, Talent]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # --- ResidualSchedule ---
  - method: POST
    path: "/residual-schedules"
    description: "Accrue a residual run period for a payment's booking. Computes residual_amount_cents (SAG tiered/media decay; NON_UNION = 0)."
    roles: [Agent]
    code: 201
    input: [payment_id, booking_id, period_index]
    output: ResidualSchedule
    side_effects: ["status=DUE", "residual_amount_cents computed"]

  - method: GET
    path: "/residual-schedules"
    description: "List residual schedules; filterable by payment_id and booking_id."
    roles: [Agent, Talent]
    code: 200
    input: ["payment_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: ResidualSchedule[]
    side_effects: []

  - method: GET
    path: "/residual-schedules/{id}"
    description: "Read a residual schedule."
    roles: [Agent, Talent]
    code: 200
    input: []
    output: ResidualSchedule
    side_effects: []

  - method: POST
    path: "/residual-schedules/{id}/pay"
    description: "Mark a DUE residual PAID (residual_amount_cents must be > 0)."
    roles: [Agent]
    code: 200
    input: []
    output: ResidualSchedule
    side_effects: ["status=PAID"]

  - method: POST
    path: "/residual-schedules/{id}/void"
    description: "Void a DUE residual."
    roles: [Agent]
    code: 200
    input: []
    output: ResidualSchedule
    side_effects: ["status=VOID"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE,         http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND,              http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST,        http: 422, condition: "Missing/mistyped body field or out-of-set enum" }
  - { id: ERR_INVALID_DATE_RANGE,     http: 422, condition: "end before start (shoot_end<shoot_start, end_at<=start_at, end_date<start_date)" }
  - { id: ERR_STALE_TALENT_VERSION,   http: 412, condition: "expected_talent_version does not match current Talent.version" }
  - { id: ERR_INVALID_STATE,          http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_CROSS_ENTITY_GATE,      http: 409, condition: "Referenced sibling entity not in the required state (deal not accepted, submission not offerable, booking not completed, audition not completed)" }
  - { id: ERR_DEAL_NOT_ACCEPTED,      http: 409, condition: "Booking confirm requires its DealMemo in ACCEPTED" }
  - { id: ERR_SUBMISSION_NOT_OFFERABLE, http: 409, condition: "DealMemo offer requires its Submission in OFFER_EXTENDED" }
  - { id: ERR_AUDITION_NOT_COMPLETED, http: 409, condition: "Callback slot requires a COMPLETED audition slot for the submission" }
  - { id: ERR_BOOKING_NOT_COMPLETED,  http: 409, condition: "Payment requires its Booking in COMPLETED" }
  - { id: ERR_CASTING_CALL_NOT_OPEN,  http: 409, condition: "Scheduling/submission requires the casting call OPEN" }
  - { id: ERR_TALENT_NOT_ROSTERED,    http: 409, condition: "Booking confirm requires Talent status ROSTERED" }
  - { id: ERR_HOLD_NOT_ACTIVE,        http: 409, condition: "Booking confirm requires a CONFIRMED_BOOKING hold in ACTIVE" }
  - { id: ERR_TALENT_MISMATCH,        http: 409, condition: "Payment.talent_id != Booking.talent_id" }
  - { id: ERR_SLOT_NOT_ENDED,         http: 409, condition: "Audition slot complete requested before logical clock reaches end_at" }
  - { id: ERR_BOOKING_NOT_ENDED,      http: 409, condition: "Booking complete requested before logical clock reaches end_date" }
  - { id: ERR_BOOKING_ALREADY_PAID,   http: 409, condition: "Cancel of a CONFIRMED booking blocked because payment_status=PAID" }
  - { id: ERR_TALENT_HAS_OPEN_BOOKINGS, http: 409, condition: "Talent archive blocked by PENDING/CONFIRMED bookings" }
  - { id: ERR_NO_COMP_CARD,           http: 409, condition: "Talent roster requires at least one comp card" }
  - { id: ERR_SLOT_OVERLAP,           http: 409, condition: "Audition slot overlaps another SCHEDULED slot on the same casting director within SLOT_BUFFER_MINUTES" }
  - { id: ERR_HOLD_OVERLAP,           http: 409, condition: "Availability hold overlaps another ACTIVE hold of the same kind on the same talent" }
  - { id: ERR_MAX_NEGOTIATION_ROUNDS, http: 409, condition: "DealMemo round_count already at MAX_ROUNDS" }
  - { id: ERR_ESCROW_INSUFFICIENT,    http: 409, condition: "Agency.escrow_balance_cents < CommissionEntry.held_cents being released at payment" }
  - { id: ERR_NO_RESIDUAL_DUE,        http: 409, condition: "Residual pay requested but residual_amount_cents is 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Agent
    description: "Agency operator. Runs the roster, escrow, commission, bookings, payments, and residuals on behalf of the agency."
    identity: "opaque"
    exclusive_operations:
      - "POST /agencies — create agency"
      - "POST /talents — create talent"
      - "POST /talents/{id}/roster|suspend|archive — talent lifecycle"
      - "POST /availability-holds — place hold"
      - "POST /availability-holds/{id}/release — release hold"
      - "POST /bookings — create booking (OCC)"
      - "POST /bookings/{id}/confirm|complete|cancel — booking lifecycle"
      - "POST /payments — post payment"
      - "POST /residual-schedules — accrue residual"
      - "POST /residual-schedules/{id}/pay|void — residual lifecycle"
      - "GET /commission-entries, GET /commission-entries/{id} — commission ledger"
    shared_operations:
      - "POST /casting-directors — register casting director (shared with CastingDirector)"
      - "POST /comp-cards — create comp card (shared with Talent)"
      - "POST /submissions — submit talent (shared with Talent)"
      - "POST /_clock/set_current_utc — set logical clock (shared)"
      - "All GET reads except commission-entries are shared across roles"

  - name: CastingDirector
    description: "Production-side caster. Owns casting calls, audition/callback scheduling, deal-memo offers, decline."
    identity: "entity_backed:CastingDirector"
    exclusive_operations:
      - "POST /casting-calls — create casting call"
      - "POST /casting-calls/{id}/close|reopen — casting call lifecycle"
      - "POST /submissions/{id}/decline — decline submission"
      - "POST /audition-slots — schedule slot"
      - "POST /audition-slots/{id}/complete|release — slot lifecycle"
      - "POST /deal-memos — open deal memo"
      - "POST /deal-memos/{id}/offer — extend offer"
    shared_operations:
      - "POST /casting-directors — register casting director (shared with Agent)"
      - "POST /deal-memos/{id}/accept — accept a COUNTERED deal (shared with Talent)"
      - "POST /deal-memos/{id}/reject — reject a COUNTERED deal (shared with Talent)"
      - "POST /_clock/set_current_utc — set logical clock (shared)"
      - "GET reads shared across roles"

  - name: Talent
    description: "Roster talent acting on own resources. Manages comp cards, submissions, deal-memo counters/accepts, withdrawals."
    identity: "entity_backed:Talent"
    exclusive_operations:
      - "POST /submissions/{id}/withdraw — withdraw own submission"
      - "POST /deal-memos/{id}/counter — counter an offer"
    shared_operations:
      - "POST /comp-cards — create comp card (shared with Agent)"
      - "POST /submissions — submit self (shared with Agent)"
      - "POST /deal-memos/{id}/accept — accept an OFFERED deal (shared with CastingDirector)"
      - "POST /deal-memos/{id}/reject — reject an OFFERED deal (shared with CastingDirector)"
      - "POST /_clock/set_current_utc — set logical clock (shared)"
      - "GET reads shared across roles"
