  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: ticket_start_is_gated_on_the_owning_orders_settlement_axis
        grounds:
          - state_machines.KitchenTicket.QUEUED_to_IN_PROGRESS
          - state_machines.Order.PLACED_to_IN_PRODUCTION
          - errors[ERR_ORDER_NOT_AUTHORIZED]
          - validations[priority=15]
          - entities.Order.fields.settlement_status
        distinguishing_aspect: |
          The gate on KitchenTicket lives on a DIFFERENT entity and a DIFFERENT state axis: the ticket is
          legitimately QUEUED and the order is legitimately PLACED, yet start fails with
          ERR_ORDER_NOT_AUTHORIZED (409) purely because Order.settlement_status is UNPAID. Authorizing the
          order changes nothing about the ticket row, and the identical start call then succeeds and drags
          the order's production axis PLACED -> IN_PRODUCTION, proving the dependency is read live from the
          parent rather than snapshotted onto the ticket.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store in LUNCH with a PUBLISHED plan for 2026-08-01"
            - "one anonymous TOUCHSCREEN order with a single Italian Hoagie line, placed but NOT authorized"
            - "the placement created exactly one SANDWICH ticket in QUEUED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
