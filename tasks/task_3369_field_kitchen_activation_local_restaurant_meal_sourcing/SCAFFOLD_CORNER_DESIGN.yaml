  - section: errors
    instances:
      - name: incident_and_resource_not_found_are_distinct_errors
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INCIDENT_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "The incident path has its own not-found error while the assessment, supplier, ingredient purchase, distribution site and donor commitment paths share the generic one, so the two probes return different error_id values."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /field-ops/incidents/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err_inc: "$.data.error_id" }
            - call: "GET /field-ops/ingredient-purchases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: SourcingOfficer
              captures: { err_generic: "$.data.error_id" }
          assert:
            - "${err_inc} == \"ERR_INCIDENT_NOT_FOUND\""
            - "${err_generic} == \"ERR_RESOURCE_NOT_FOUND\""

