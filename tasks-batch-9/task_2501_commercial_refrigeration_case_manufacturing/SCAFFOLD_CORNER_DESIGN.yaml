  # ==========================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_case_model_version_rejected_on_energy_test_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[energy-test-create-stale-case-model]
          - errors[ERR_STALE_CASE_MODEL_VERSION]
          - validations[priority=8]
        distinguishing_aspect: "The OCC token is the parent CaseModel.version, not the test's own: a token read before submit-for-test (2) is refused with 412 ERR_STALE_CASE_MODEL_VERSION, while the refreshed token (3) creates the test and leaves the model's version untouched at 3."
        test_recipe:
          setup:
            - "MDL-MT-8 has run its airflow model, so it is MODELED at version 2; the caller reads that version as its OCC token."
            - "The design is then submitted for test, taking the model to version 3."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v_stale: "$.data.version" } }
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v: "$.data.version" } }
          trigger:
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v_stale}" }, captures: { err: "$.data.error_id" } }
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }, captures: { et_id: "$.data.id" } }
            - { call: "GET /case-models/${cm_id}", as: TestLabTechnician, as_user_id: "lab-001", payload: {} }
          assert:
            - "First call: HTTP 412, data.error_id == \"ERR_STALE_CASE_MODEL_VERSION\" (token 2 versus live 3)"
            - "Second call: HTTP 201, data.status == \"SCHEDULED\", data.pinned_design_revision == 1, data.limit_daily_kwh == 17.568"
            - "Third call: data.version == 3 — the rejected attempt did not bump the parent"

      - name: occ_stale_store_plan_version_rejected_on_shipment_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shipment-create-stale-store-plan]
          - errors[ERR_STALE_STORE_PLAN_VERSION]
          - validations[priority=8]
        distinguishing_aspect: "The plan's version advances on approve, release and QA rollups, so an OCC token captured at approval is stale by shipment time: 412 ERR_STALE_STORE_PLAN_VERSION, then the refreshed token ships the unit."
        test_recipe:
          setup:
            - "StorePlan FreshMart/0412 (one unit of the CERTIFIED MDL-MT-8) is approved; the caller captures the plan version at approval as its OCC token."
            - "The plan is then released and its unit passes final QA, so the live version has moved on."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v: "$.data.version" } }
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }, captures: { et_id: "$.data.id" } }
            - { call: "POST /energy-tests/${et_id}/start", as: TestLabTechnician, as_user_id: "lab-001", payload: {} }
            - { call: "POST /energy-tests/${et_id}/complete", as: TestLabTechnician, as_user_id: "lab-001", payload: { measured_kwh_24h: 15.0, measured_defrost_cycles: 4 } }
            - { call: "POST /compliance-labels", as: ComplianceOfficer, as_user_id: "co-001", payload: { case_model_id: "${cm_id}", energy_test_id: "${et_id}", label_code: "LBL-MT-8-A" }, captures: { lbl_id: "$.data.id" } }
            - { call: "POST /store-plans", as: SalesEngineer, as_user_id: "sales-001", payload: { banner_name: "FreshMart", store_number: "0412", region_code: "OH", remodel_window_start: "2026-09-14", remodel_window_end: "2026-09-27", credit_limit_cents: 20000000 }, captures: { plan_id: "$.data.id" } }
            - { call: "POST /store-plans/${plan_id}/lines", as: SalesEngineer, as_user_id: "sales-001", payload: { case_model_id: "${cm_id}", length_ft: 8, quantity: 1, end_cap: "LEFT", merchandising_options: ["LED_CANOPY", "NIGHT_CURTAIN"] }, captures: { line_id: "$.data.id" } }
            - { call: "POST /store-plans/${plan_id}/price", as: SalesEngineer, as_user_id: "sales-001", payload: {} }
            - { call: "POST /store-plans/${plan_id}/approve", as: SalesEngineer, as_user_id: "sales-002", payload: {}, captures: { plan_v_stale: "$.data.version" } }
            - { call: "POST /store-plans/${plan_id}/release", as: PlantSupervisor, as_user_id: "plant-001", payload: {} }
            - { call: "GET /work-orders?store_plan_id=${plan_id}", as: PlantSupervisor, as_user_id: "plant-001", payload: {}, captures: { wo_id: "$.data[0].id" } }
            - { call: "POST /work-orders/${wo_id}/advance", as: PlantSupervisor, as_user_id: "plant-001", payload: {} }
            - { call: "POST /work-orders/${wo_id}/advance", as: PlantSupervisor, as_user_id: "plant-001", payload: {} }
            - { call: "POST /work-orders/${wo_id}/advance", as: PlantSupervisor, as_user_id: "plant-001", payload: {} }
            - { call: "POST /work-orders/${wo_id}/qa-result", as: PlantSupervisor, as_user_id: "plant-001", payload: { result: "PASS" } }
            - { call: "GET /store-plans/${plan_id}", as: LogisticsCoordinator, as_user_id: "log-001", payload: {}, captures: { plan_v: "$.data.version" } }
          trigger:
            - { call: "POST /shipments", as: LogisticsCoordinator, as_user_id: "log-001", payload: { store_plan_id: "${plan_id}", ship_date: "2026-09-15", delivery_date: "2026-09-17", carrier_code: "RLC", expected_store_plan_version: "${plan_v_stale}" }, captures: { err: "$.data.error_id" } }
            - { call: "POST /shipments", as: LogisticsCoordinator, as_user_id: "log-001", payload: { store_plan_id: "${plan_id}", ship_date: "2026-09-15", delivery_date: "2026-09-17", carrier_code: "RLC", expected_store_plan_version: "${plan_v}" }, captures: { sh_id: "$.data.id" } }
          assert:
            - "First call: HTTP 412, data.error_id == \"ERR_STALE_STORE_PLAN_VERSION\""
            - "Second call: HTTP 201, data.status == \"STAGED\", data.unit_count == 1, data.linear_feet == 8"
            - "GET /work-orders/${wo_id} after the second call: data.status == \"SHIPPED\""

      - name: label_pinned_index_survives_supersession_by_engineering_change
        claim_type: version_pinning_on_approval
        grounds:
          - entities.ComplianceLabel.fields.pinned_lab_rated_index
          - entities.ComplianceLabel.fields.pinned_standard_code
          - state_machines.ComplianceLabel.transitions
        distinguishing_aspect: "Certification data is pinned at issuance, not resolved live: after an engineering change supersedes the label, its pinned_lab_rated_index stays 0.568, pinned_design_revision stays 1 and pinned_standard_code stays DOE-2027-RSC-MT even though the model is back in DRAFT at design_revision 2."
        test_recipe:
          setup:
            - "MDL-MT-8 is CERTIFIED under label LBL-MT-8-A issued from a test measuring 15.0 kWh/24h on 26.4 sqft of TDA."
            - "A refrigerant-transition engineering change is then filed against the model."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-454C", trade_name: "Opteon XL20", gwp_100yr: 146, safety_class: "A2L", max_charge_grams: 8000, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { low_ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v: "$.data.version" } }
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }, captures: { et_id: "$.data.id" } }
            - { call: "POST /energy-tests/${et_id}/start", as: TestLabTechnician, as_user_id: "lab-001", payload: {} }
            - { call: "POST /energy-tests/${et_id}/complete", as: TestLabTechnician, as_user_id: "lab-001", payload: { measured_kwh_24h: 15.0, measured_defrost_cycles: 4 } }
            - { call: "POST /compliance-labels", as: ComplianceOfficer, as_user_id: "co-001", payload: { case_model_id: "${cm_id}", energy_test_id: "${et_id}", label_code: "LBL-MT-8-A" }, captures: { lbl_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models/${cm_id}/engineering-change", as: DesignEngineer, as_user_id: "eng-001", payload: { refrigerant_id: "${low_ref_id}", charge_grams: 3900, line_set_length_ft: 120, change_note: "Transition to R-454C" } }
            - { call: "GET /compliance-labels/${lbl_id}", as: ComplianceOfficer, as_user_id: "co-001", payload: {} }
            - { call: "GET /case-models/${cm_id}", as: ComplianceOfficer, as_user_id: "co-001", payload: {} }
          assert:
            - "First call: HTTP 200, data.status == \"DRAFT\", data.design_revision == 2, data.refrigerant_id == ${low_ref_id}"
            - "Second call: data.label_status == \"SUPERSEDED\", data.pinned_lab_rated_index == 0.568, data.pinned_design_revision == 1, data.pinned_standard_code == \"DOE-2027-RSC-MT\""
            - "Third call: data.total_design_load_w is null and data.installed_charge_grams is null — the live model was cleared back to an unmodelled DRAFT while the label kept its pinned figures"

      - name: engineering_change_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CaseModel.transitions
          - entities.WorkOrder.fields.status
          - entities.StorePlan.fields.commercial_status
        excluded_because:
          difficulty_instance: transitive_cascade / engineering_change_five_hop_design_to_work_order_cascade
          rationale: "The named §1.8 instance verifies all five hops of the engineering-change cascade end to end, including the ordering-sensitive detail that SCHEDULED tests are left alone while RUNNING tests are invalidated."

      - name: energy_index_dual_variant_delta_verified
        claim_type: dual_variant_calculation
        grounds:
          - calculations.energy_use_index
          - entities.EnergyTest.fields.field_exceedance
        excluded_because:
          difficulty_instance: dual_variant_calc / energy_index_lab_variant_versus_field_variant_divergence
          rationale: "The named §1.8 instance asserts both variants and the delta between them on one completed test, including the field_exceedance flag that only the field variant can raise."

  # ==========================================================================
  # SECTION 9 — CONSISTENCY MODEL
  # ==========================================================================
  - section: consistency_model
    instances:

      - name: airflow_model_exposes_computed_loads_in_same_response
        claim_type: immediate
        grounds:
          - calculations.airflow_load_model
          - entities.CaseModel.fields.total_design_load_w
          - endpoints[POST /case-models/{id}/airflow-model]
        distinguishing_aspect: "Consistency is immediate: the POST /case-models/{id}/airflow-model response itself already carries total_design_load_w 442.91 and every component load, with no follow-up read needed, and the subsequent GET returns byte-identical values."
        test_recipe:
          setup:
            - "MDL-MT-8 is in DRAFT with all eleven computed load fields null."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
            - { call: "GET /case-models/${cm_id}", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
          assert:
            - "First call: HTTP 200, data.status == \"MODELED\", data.total_design_load_w == 442.91, data.installed_charge_grams == 7320, data.version == 2"
            - "Second call: every load field equals the value already returned by the first call, including data.total_design_load_w == 442.91"
