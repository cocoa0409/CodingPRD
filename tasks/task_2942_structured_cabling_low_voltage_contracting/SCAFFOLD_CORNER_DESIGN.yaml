            - call: "POST /cabling/links"
              payload: { project_id: "${proj1}", telecom_room_id: "${room2}", cable_type_id: "${ct}", identifier: "TR01-A02", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
