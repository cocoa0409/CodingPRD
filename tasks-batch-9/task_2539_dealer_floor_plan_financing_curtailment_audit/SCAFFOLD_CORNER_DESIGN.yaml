              as: FieldAuditor
              as_user_id: "u-fa-1"
              captures: { c35_cls: "$.data.classification", c35_oot: "$.data.is_out_of_trust" }
            - call: "GET /floorplan/dealers/${c35_d}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c35_dv: "$.data.version", c35_risk0: "$.data.risk_rating" }
            - call: "POST /floorplan/audits/${c35_au}/reconcile"
              payload: { notes: "one unit missing" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { c35_austat: "$.data.status", c35_exp: "$.data.sot_exposure_cents" }
          trigger:
            - call: "POST /floorplan/remittances"
              payload: { dealer_id: "${c35_d}", intent: "SOT_CURE", amount_cents: 3000000, payment_reference: "ACH-C35-STALE", expected_dealer_version: "${c35_dv}", target_unit_id: "${c35_u}" }
              as: DealerPrincipal
              as_user_id: "${c35_d}"
              captures: { c35_err: "$.data.error_id" }
          assert:
            - "${c35_cls} == \"SOLD_OUT_OF_TRUST\", ${c35_oot} == true, ${c35_risk0} == \"A\", ${c35_austat} == \"RECONCILED_EXCEPTIONS\" and ${c35_exp} == 3000000"
            - "HTTP status is 412 and ${c35_err} == \"ERR_STALE_DEALER_VERSION\""
            - "no PaymentRemittance row exists for the dealer: GET /floorplan/remittances?dealer_id=${c35_d} returns total_count 0"
            - "the OutOfTrustIncident of ${c35_u} is still OPEN with exposure_cents 3000000 and cure_deadline_at \"2026-08-11T00:00:00Z\", and InventoryUnit.${c35_u}.funding_status is still SOT_OPEN"
            - "Dealer.${c35_d} still shows open_sot_incident_count 1, open_sot_exposure_cents 3000000, risk_score 85, risk_rating \"B\", audit_frequency_days 90 and next_audit_due_at \"2026-10-30T00:00:00Z\""
            - "CreditLine.${c35_cl}.status is still ACTIVE because 3000000 < SOT_SUSPENSION_EXPOSURE_CENTS 10000000"
            - "re-reading the dealer and re-sending the identical remittance with the fresh version returns 201 with status \"APPLIED\", applied_sot_cure_cents 3000000 and unapplied_cents 0"
            - "after that retry the incident is CURED with cured_at \"2026-08-01T00:00:00Z\" and resolution_reason_code \"DEALER_PAYOFF\", the unit is FLOORED again, and the dealer shows open_sot_incident_count 0, open_sot_exposure_cents 0, risk_score 100, risk_rating \"A\", audit_frequency_days 180 and next_audit_due_at \"2027-01-28T00:00:00Z\""

      - name: a_repeated_curtailment_run_on_the_same_date_advances_nothing
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints["POST /floorplan/curtailment-runs"]
          - calculations.curtailment_run_dealer_total
          - state_machines.CurtailmentObligation.SCHEDULED_to_DUE
        distinguishing_aspect: "The run is a checkpoint over rows that still qualify, not a per-invocation recomputation: the first run of 2026-10-30 marks the only obligation DUE for 300000, and an identical second run reports every counter as zero and leaves became_due_at and the obligation version untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, then 2026-10-30T00:00:00Z."
            - "ACTIVE Dealer with an ACTIVE CreditLine (limit 500000000, NEW rate 10000 bps, grace 5, NEW tier [90, unbounded) at 1000 bps)."
            - "One FLOORED NEW unit floored 2026-08-01 at 3000000, carrying one SCHEDULED obligation due 2026-10-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Checkpoint Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "NE" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c36_d: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c36_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c36_cl: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${c36_cl}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${c36_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${c36_d}", credit_line_id: "${c36_cl}", vin: "1CRNCHECKPTUNIT01", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${c36_d}"
              captures: { c36_u: "$.data.id" }
            - call: "POST /floorplan/units/${c36_u}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-C36" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${c36_u}/funding-advances"
              payload: { requested_amount_cents: 3000000, dealer_invoice_reference: "INV-C36" }
              as: DealerPrincipal
              as_user_id: "${c36_d}"
              captures: { c36_a: "$.data.id" }
            - call: "GET /floorplan/credit-lines/${c36_cl}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c36_v: "$.data.version" }
            - call: "POST /floorplan/funding-advances/${c36_a}/fund"
              payload: { expected_credit_line_version: "${c36_v}", disbursement_reference: "WIRE-C36" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/curtailment-runs"
              payload: { dealer_id: "${c36_d}", as_of_date: "2026-10-30" }
              as: SystemOperator
              as_user_id: "u-sys-1"
              captures: { c36_due1: "$.data.obligations_marked_due_count", c36_tot1: "$.data.total_required_paydown_cents", c36_del1: "$.data.obligations_marked_delinquent_count" }
          trigger:
            - call: "POST /floorplan/curtailment-runs"
              payload: { dealer_id: "${c36_d}", as_of_date: "2026-10-30" }
              as: SystemOperator
              as_user_id: "u-sys-1"
              captures: { c36_due2: "$.data.obligations_marked_due_count", c36_tot2: "$.data.total_required_paydown_cents", c36_del2: "$.data.obligations_marked_delinquent_count", c36_uf2: "$.data.units_flagged_delinquent_count", c36_ex2: "$.data.exceptions_expired_count", c36_at2: "$.data.run_completed_at" }
          assert:
            - "${c36_due1} == 1, ${c36_tot1} == 300000 and ${c36_del1} == 0 on the first run"
            - "HTTP status is 201 and the second run reports ${c36_due2} == 0, ${c36_tot2} == 0, ${c36_del2} == 0, ${c36_uf2} == 0 and ${c36_ex2} == 0"
            - "${c36_at2} == \"2026-10-30T00:00:00Z\" and dealer_ids_processed == [${c36_d}] - the dealer is still visited, it simply has nothing to advance"
            - "the obligation of ${c36_u} is still DUE with required_principal_cents 300000, became_due_at \"2026-10-30T00:00:00Z\" and the same version it had after the first run"
            - "InventoryUnit.${c36_u}.funding_status is still FLOORED and Dealer.${c36_d}.delinquent_unit_count == 0 with risk_score 100"

      - name: the_reconcile_cascade_is_verified_end_to_end_across_five_levels
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: audit_reconcile_cascades_five_hops_from_observation_to_voided_advance
          rationale: "That instance already walks the full chain observation -> incident -> unit -> dealer -> credit line -> voided sibling advance in one reconcile and asserts every hop, including the ordering-sensitive suspension that reaches a REQUESTED advance on another unit."
      - name: both_curtailment_variants_are_exercised_and_the_delta_is_checked
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: curtailment_projected_versus_assessed_after_voluntary_prepayment
          rationale: "The FORWARD_PROJECTED and ASSESSED_ACTUAL variants are computed on the same obligation there, and the delta created by a prepayment between materialisation and the DUE transition is asserted on both fields."
      - name: the_mileage_haircut_threshold_is_probed_on_both_sides
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: demonstrator_odometer_exactly_3000_versus_3001_flips_the_mileage_haircut
          rationale: "That instance funds two demonstrators whose odometers straddle DEMO_HIGH_MILEAGE_THRESHOLD_MILES by one mile and asserts the 500 bps step, which is exactly the boundary claim for this layer."

