          - entities.MaintenanceWorkOrder.fields.awaiting_parts_cycles
          - validations[priority=39]
          - validations[priority=51]
        distinguishing_aspect: |
          Cycle on a DIFFERENT entity (MaintenanceWorkOrder.wo_status): IN_PROGRESS <-> AWAITING_PARTS
          is traversed three full times, awaiting_parts_cycles reaches exactly 3, and the fourth entry
          is refused with ERR_AWAITING_PARTS_LIMIT_REACHED (422) while the row stays IN_PROGRESS.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; one MON route; model URN-30; one planned site with a RENTAL placement holding asset URN30-0001"
            - "a REPAIR work order on that asset has been advanced to IN_PROGRESS and cycled through AWAITING_PARTS three times, ending IN_PROGRESS"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
