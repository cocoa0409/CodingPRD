  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tank_occupation_half_open_interval_with_twelve_hour_cip_buffer
        grounds:
          - validations.priority_40
          - errors.ERR_TANK_SCHEDULE_CONFLICT
          - entities.Batch.fields.brew_start_utc
          - entities.Batch.fields.brew_end_utc
        distinguishing_aspect: |
          Resource: a physical Tank. Interval semantics: HALF-OPEN [brew_start_utc, brew_end_utc)
          widened by a TANK_CIP_BUFFER_HOURS = 12 turnaround pad, capacity 1. Because the widened
          window is half-open on the right, a successor starting exactly 12 h after its
          predecessor ends is legal, while one starting a single second earlier collides. Both
          sides of that second are exercised on the same tank.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT."
            - "Tank FV-01 created and left IDLE (never started, so nothing is OCCUPIED)."
            - "Batch B-1001 SCHEDULED on FV-01 for [2026-08-01T06:00:00Z, 2026-08-09T06:00:00Z), which is in the conflict state set. Its buffered exclusion window is [2026-07-31T18:00:00Z, 2026-08-09T18:00:00Z)."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-09T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch1_id: $.data.id }
          trigger:
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1002", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-09T17:59:59Z", brew_end_utc: "2026-08-17T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { err: $.data.error_id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1003", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-09T18:00:00Z", brew_end_utc: "2026-08-17T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch3_id: $.data.id }
          assert:
            - "The B-1002 call returns HTTP 409 with error_id ERR_TANK_SCHEDULE_CONFLICT - 2026-08-09T17:59:59Z is still inside the buffered window"
            - "The B-1003 call returns HTTP 201 - 2026-08-09T18:00:00Z is exactly the exclusive right edge, so the CIP buffer is satisfied"
            - "Batch.${batch3_id}.state == SCHEDULED"
            - "Batch.${batch3_id}.tank_id == ${tank_id}"
            - "Batch.${batch1_id}.state == SCHEDULED (untouched by the rejected attempt)"
            - "GET /batches filtered by this tank returns total_count 2 - B-1002 was never persisted"
            - "Tank.${tank_id}.status == IDLE and occupying_batch_id is null"

      - name: offsite_permit_closed_interval_capacity_two_per_state
        grounds:
          - validations.priority_44
          - state_machines.EventPermit.SUBMITTED_to_APPROVED
          - errors.ERR_OFFSITE_EVENT_CAPACITY_EXCEEDED
          - entities.EventPermit.fields.venue_state_code
        distinguishing_aspect: |
          A different resource - regulatory off-site concurrency within a venue_state_code, capacity
          2 rather than 1 - and the OPPOSITE interval convention: CLOSED
          [event_start_utc, event_end_utc] with no buffer. Two events that merely TOUCH at an
          endpoint therefore DO intersect, which is exactly the case the tank rule treats as legal.
          Permit C starts at the instant permit A ends and ends at the instant permit B begins, so
          it intersects both and the third concurrent approval is refused.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT and taproom_sellable."
            - "An OR StateLicense exists so the OR venue passes the territory rule."
            - "Permit A 'Riverfront Fest' [2026-09-10T12:00:00Z, 2026-09-10T18:00:00Z] submitted and APPROVED, requested_bbl 2.00."
            - "Permit B 'Night Market' [2026-09-10T22:00:00Z, 2026-09-11T04:00:00Z] submitted and APPROVED, requested_bbl 2.00."
            - "Permit C 'Twilight Tasting' [2026-09-10T18:00:00Z, 2026-09-10T22:00:00Z] submitted, requested_bbl 2.00. The three permits total 6.00 bbl, far below the 25.00 annual state ceiling, so only the concurrency rule can bite."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /state-licenses"
              payload: { state_code: "OR", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /event-permits"
              payload: { featured_beer_id: "${beer_id}", event_name: "Riverfront Fest", permit_type: "FESTIVAL", venue_state_code: "OR", event_start_utc: "2026-09-10T12:00:00Z", event_end_utc: "2026-09-10T18:00:00Z", requested_bbl: 2.00 }
              as: ComplianceOfficer
              captures: { permit_a_id: $.data.id }
            - call: "POST /event-permits/${permit_a_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /event-permits/${permit_a_id}/decision"
              payload: { decision: "APPROVED" }
              as: StateRegulator
            - call: "POST /event-permits"
              payload: { featured_beer_id: "${beer_id}", event_name: "Night Market", permit_type: "OFF_SITE_TASTING", venue_state_code: "OR", event_start_utc: "2026-09-10T22:00:00Z", event_end_utc: "2026-09-11T04:00:00Z", requested_bbl: 2.00 }
              as: ComplianceOfficer
              captures: { permit_b_id: $.data.id }
            - call: "POST /event-permits/${permit_b_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /event-permits/${permit_b_id}/decision"
              payload: { decision: "APPROVED" }
              as: StateRegulator
            - call: "POST /event-permits"
              payload: { featured_beer_id: "${beer_id}", event_name: "Twilight Tasting", permit_type: "FARMERS_MARKET", venue_state_code: "OR", event_start_utc: "2026-09-10T18:00:00Z", event_end_utc: "2026-09-10T22:00:00Z", requested_bbl: 2.00 }
              as: ComplianceOfficer
              captures: { permit_c_id: $.data.id }
            - call: "POST /event-permits/${permit_c_id}/submit"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /event-permits/${permit_c_id}/decision"
              payload: { decision: "APPROVED" }
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_OFFSITE_EVENT_CAPACITY_EXCEEDED"
            - "error_id != ERR_EVENT_BARREL_CAP_EXCEEDED (6.00 bbl is nowhere near the 25.00 ceiling)"
            - "EventPermit.${permit_c_id}.state == SUBMITTED (unchanged)"
            - "EventPermit.${permit_c_id}.decided_at_utc is null"
            - "EventPermit.${permit_c_id}.submission_count == 1"
            - "EventPermit.${permit_a_id}.state == APPROVED and EventPermit.${permit_b_id}.state == APPROVED"
            - "A permit for [2026-09-10T18:00:01Z, 2026-09-10T21:59:59Z] would still intersect nothing new; the failure comes purely from the two touching endpoints, which the closed convention counts as intersections"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_restores_packaging_run_barrel_conservation
        grounds:
          - state_machines.DistributionOrder.ALLOCATED_to_CANCELLED
          - entities.PackagingRun.fields.available_bbl
          - entities.PackagingRun.fields.allocated_bbl
          - entities.PackagingRun.fields.shipped_bbl
          - calculations.distribution_allocation_waterfall
        distinguishing_aspect: |
          Conserved quantity: the RUN-LEVEL BARREL LEDGER
          bbl_removed == available_bbl + allocated_bbl + shipped_bbl. Allocation moves 3.000 bbl
          from available to allocated; the compensating cancel must move exactly those barrels
          back, leaving bbl_removed itself untouched at 5.000 and no residue in allocated_bbl or
          allocation_lines. Drift here would either strand or duplicate saleable inventory.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT and COLA_APPROVED."
            - "ID StateLicense, SELF_DISTRIBUTION, ACTIVE, cap 1000.00."
            - "Batch B-1001 conditioned at 16.000 bbl with one COMPLETED DISTRIBUTION run of 10 HALF_BBL_KEG units: bbl_removed 5.000, available_bbl 5.000, allocated_bbl 0.000, shipped_bbl 0.000."
            - "Order SO-4005 for 3.00 bbl into ID, ALLOCATED, so the ledger currently reads 5.000 == 2.000 + 3.000 + 0.000."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /beers/${beer_id}/filings"
              payload: { filing_type: "LABEL", label_fields: { brand_name: "Ridgeline IPA", abv_statement: "6.8% ALC/VOL", net_contents: "15.5 GAL", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL" } }
              as: ComplianceOfficer
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-0917" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-DIST-1", package_type: "HALF_BBL_KEG", destination: "DISTRIBUTION", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /distribution-orders"
              payload: { beer_id: "${beer_id}", state_license_id: "${lic_id}", order_code: "SO-4005", bbl_requested: 3.00, ship_to_state_code: "ID", distance_miles: 120, requested_ship_utc: "2026-08-15T15:00:00Z" }
              as: BreweryAdmin
              captures: { order_id: $.data.id }
            - call: "POST /distribution-orders/${order_id}/allocate"
              payload: {}
              as: BreweryAdmin
            - call: "GET /packaging-runs/${run_id}"
              payload: {}
              as: BreweryAdmin
              captures: { run_v_allocated: $.data.version }
          trigger:
            - call: "POST /distribution-orders/${order_id}/cancel"
              payload: { reason: "wholesaler rescheduled the delivery window" }
              as: BreweryAdmin
          assert:
            - "DistributionOrder.${order_id}.state == CANCELLED"
            - "DistributionOrder.${order_id}.cancel_reason == 'wholesaler rescheduled the delivery window'"
            - "DistributionOrder.${order_id}.allocation_lines == []"
            - "DistributionOrder.${order_id}.allocated_bbl == 0.000"
            - "PackagingRun.${run_id}.available_bbl == 5.000"
            - "PackagingRun.${run_id}.allocated_bbl == 0.000"
            - "PackagingRun.${run_id}.shipped_bbl == 0.000"
            - "PackagingRun.${run_id}.bbl_removed == 5.000 - conservation restored exactly: 5.000 == 5.000 + 0.000 + 0.000"
            - "PackagingRun.${run_id}.state == COMPLETED"
            - "PackagingRun.${run_id}.version > ${run_v_allocated} (the release is a real write on the run)"
            - "StateLicense.${lic_id}.barrels_shipped_ytd == 0.000"
            - "Batch.${batch_id}.packaged_bbl == 5.000 and remaining_bbl == 11.000 - the cancel touched the reservation, not the packaging"

      - name: run_void_restores_batch_yield_conservation
        grounds:
          - state_machines.PackagingRun.COMPLETED_to_VOIDED
          - entities.Batch.fields.packaged_bbl
          - entities.Batch.fields.remaining_bbl
          - entities.Batch.fields.actual_yield_bbl
          - calculations.packaging_loss_allocation
        distinguishing_aspect: |
          A different conserved quantity one aggregate up: the BATCH YIELD IDENTITY
          actual_yield_bbl == packaged_bbl + remaining_bbl. Completing a run debits 5.000 bbl from
          remaining into packaged; voiding it must credit exactly those 5.000 back and additionally
          scrub the run's own derived fields (bbl_removed, available_bbl, units_produced,
          loss_share_bbl) so no phantom inventory survives the compensation.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT."
            - "Batch B-1001 conditioned at actual_yield_bbl 16.000 with one COMPLETED TAPROOM HALF_BBL_KEG run of 10 units: packaged_bbl 5.000, remaining_bbl 11.000, so the batch is still CONDITIONING."
            - "The run has no allocations, no shipments and no kegs filled from it, satisfying every void precondition."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_v_after_complete: $.data.version }
          trigger:
            - call: "POST /packaging-runs/${run_id}/void"
              payload: {}
              as: CellarOperator
          assert:
            - "PackagingRun.${run_id}.state == VOIDED"
            - "PackagingRun.${run_id}.bbl_removed == 0.000"
            - "PackagingRun.${run_id}.available_bbl == 0.000"
            - "PackagingRun.${run_id}.units_produced is null"
            - "PackagingRun.${run_id}.loss_share_bbl is null"
            - "PackagingRun.${run_id}.voided_at_utc is set"
            - "Batch.${batch_id}.packaged_bbl == 0.000"
            - "Batch.${batch_id}.remaining_bbl == 16.000"
            - "Batch.${batch_id}.actual_yield_bbl == 16.000 - conservation restored exactly: 16.000 == 0.000 + 16.000"
            - "Batch.${batch_id}.state == CONDITIONING (it never auto-closed, so nothing has to be re-opened)"
            - "Batch.${batch_id}.total_loss_bbl is null or 0.000 - the batch has not closed, so no loss has been struck"
            - "Batch.${batch_id}.version > ${batch_v_after_complete}"
            - "Tank.${tank_id}.status == OCCUPIED and occupying_batch_id == ${batch_id}"
