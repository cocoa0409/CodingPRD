        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-change-stale-membership]"
          - "errors[ERR_STALE_MEMBERSHIP_VERSION]"
        distinguishing_aspect: "A second plan-change carrying the pre-first-change version (now stale, since the first change bumped Membership.version) -> ERR_STALE_MEMBERSHIP_VERSION (412)."
        test_recipe:
          setup: ["PLUS membership ENROLLED; PREMIUM and ESSENTIAL plans; one plan-change applied (version bumped)"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
