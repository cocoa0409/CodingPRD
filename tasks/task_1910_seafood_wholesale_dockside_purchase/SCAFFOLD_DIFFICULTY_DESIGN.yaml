            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 10.00, min_remaining_shelf_life_hours: 70 }, as: Customer, as_user_id: "${c_id}", captures: { ol_id: $.data.id } }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager, captures: { o_v: $.data.version } }
            - { call: "POST /inspection-holds", payload: { inventory_lot_id: "${lot_id}", reason: "suspect temperature abuse" }, as: ComplianceOfficer, as_user_id: "off_1", captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /allocations", payload: { order_line_id: "${ol_id}", inventory_lot_id: "${lot_id}", qty_kg: 10.00, transit_hours: 12, expected_sales_order_version: "${o_v}" }, as: InventoryPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOT_ON_HOLD (409), NOT ERR_SHELF_LIFE_INSUFFICIENT — priority 7 safety beats priority 8 temporal"
            - "No Allocation row is created; lot buckets unchanged (available 50.00, reserved 0)"

  - rule_id: boundary_precision_check
    instances:
      - name: volatility_exactly_ten_percent_requires_approval
        grounds:
          - calculations.volatility_guard
          - state_machines.MarketQuote
        distinguishing_aspect: |
          Metric: percentage change. Boundary >= vs <: exactly 10.00% routes to
          PENDING_APPROVAL while 9.90% publishes directly — checked on POST
          /market-quotes/{id}/publish. Sibling instances use different metrics
          (hours, cents) on different endpoints.
        test_recipe:
          setup:
            - "Species COD; PUBLISHED GRADE_A quote 1000 for 2026-08-01"
            - "DRAFT quotes: 1100 for 2026-08-02 (exactly +10.00%) and 1099 for 2026-08-03 (+9.90%)"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1000 }, as: OperationsManager, captures: { q1_id: $.data.id } }
            - { call: "POST /market-quotes/${q1_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager, captures: { sp_v2: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-02", price_per_kg_cents: 1100 }, as: OperationsManager, captures: { q2_id: $.data.id } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-03", price_per_kg_cents: 1099 }, as: OperationsManager, captures: { q3_id: $.data.id } }
          trigger:
            - { call: "POST /market-quotes/${q2_id}/publish", payload: { expected_species_version: "${sp_v2}" }, as: OperationsManager, captures: { q2_status: $.data.status, q2_vol: $.data.volatility_pct } }
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager, captures: { sp_v3: $.data.version } }
            - { call: "POST /market-quotes/${q3_id}/publish", payload: { expected_species_version: "${sp_v3}" }, as: OperationsManager, captures: { q3_status: $.data.status, q3_vol: $.data.volatility_pct } }
          assert:
            - "MarketQuote.${q2_id}.status == PENDING_APPROVAL and volatility_pct == 10.00 (>= 10.00 triggers the guard)"
            - "MarketQuote.${q3_id}.status == PUBLISHED and volatility_pct == 9.90 (< 10.00 publishes directly)"
            - "MarketQuote.${q1_id}.status == SUPERSEDED after ${q3_id} publishes"

      - name: shelf_life_exact_remaining_hours_allocatable
        grounds:
          - calculations.shelf_life_clock
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: hours remaining on the shelf-life clock. Boundary >= vs >: with exactly
          48 h remaining and a requirement of 40 + 8 = 48 h the allocation succeeds;
          transit 9 h (requirement 49) fails with ERR_SHELF_LIFE_INSUFFICIENT — on
          POST /allocations, a different endpoint and metric from the volatility instance.
        test_recipe:
          setup:
            - "COD lot of 87.30 kg, landed 2026-08-01T06:00:00Z, fresh 72h -> expires 2026-08-04T06:00:00Z"
            - "Clock advanced to 2026-08-02T06:00:00Z (exactly 48h remaining); order CONFIRMED, line min shelf 40h, requested 50.00 kg"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 100.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_B", yield_pct: 0.90 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_B", quote_date: "2026-08-01", price_per_kg_cents: 950 }, as: OperationsManager, captures: { qb_id: $.data.id } }
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager, captures: { sp_vb: $.data.version } }
            - { call: "POST /market-quotes/${qb_id}/publish", payload: { expected_species_version: "${sp_vb}" }, as: OperationsManager }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "GET /inventory-lots", payload: { landing_line_id: "${l_id}" }, as: OperationsManager, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 50.00, min_remaining_shelf_life_hours: 40 }, as: Customer, as_user_id: "${c_id}", captures: { ol_id: $.data.id } }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T06:00:00Z" }, as: OperationsManager }
            - { call: "GET /sales-orders/${o_id}", payload: {}, as: OperationsManager, captures: { o_v: $.data.version } }
          trigger:
            - { call: "POST /allocations", payload: { order_line_id: "${ol_id}", inventory_lot_id: "${lot_id}", qty_kg: 10.00, transit_hours: 8, expected_sales_order_version: "${o_v}" }, as: InventoryPlanner, captures: { al_id: $.data.id } }
            - { call: "GET /sales-orders/${o_id}", payload: {}, as: OperationsManager, captures: { o_v2: $.data.version } }
            - { call: "POST /allocations", payload: { order_line_id: "${ol_id}", inventory_lot_id: "${lot_id}", qty_kg: 10.00, transit_hours: 9, expected_sales_order_version: "${o_v2}" }, as: InventoryPlanner, captures: { err: $.data.error_id } }
          assert:
            - "First allocation (transit 8; 48 >= 40+8 exactly) succeeds: Allocation.${al_id}.status == RESERVED"
            - "Second allocation (transit 9; 48 < 40+9) returns ERR_SHELF_LIFE_INSUFFICIENT (422)"
            - "InventoryLot.${lot_id}.available_weight_kg == 77.30 and reserved_weight_kg == 10.00 after the pair"

      - name: credit_limit_exact_equality_passes
        grounds:
          - calculations.customer_credit_exposure
          - validations[priority=10]
        distinguishing_aspect: |
          Metric: integer cents of credit exposure. Boundary <= vs <: confirm lands the
          exposure exactly on credit_limit_cents (12000 == 12000) and succeeds; the next
          confirm pushing 1 cent over fails with ERR_CREDIT_LIMIT_EXCEEDED — on
          POST /sales-orders/{id}/confirm, different metric and endpoint from the other two.
        test_recipe:
          setup:
            - "Species COD GRADE_A quote 1200 PUBLISHED; customer credit_limit 12000"
            - "Order A (10.00 kg -> total 12000) SUBMITTED; Order B (1.00 kg -> total 1200) SUBMITTED, same customer"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 12000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { oa_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${oa_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 10.00 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${oa_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-06" }, as: Customer, as_user_id: "${c_id}", captures: { ob_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${ob_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 1.00 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${ob_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /sales-orders/${oa_id}/confirm", payload: {}, as: OperationsManager, captures: { oa_status: $.data.status } }
            - { call: "POST /sales-orders/${ob_id}/confirm", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "SalesOrder.${oa_id}.status == CONFIRMED and total_cents == 12000 (exposure 0 + 12000 <= 12000 passes exactly)"
            - "Customer.${c_id}.credit_exposure_cents == 12000 after first confirm"
            - "Second confirm returns ERR_CREDIT_LIMIT_EXCEEDED (402): 12000 + 1200 > 12000"
            - "SalesOrder.${ob_id}.status == SUBMITTED (unchanged)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_requires_confirmed_order_and_clear_active_lot
        grounds:
          - state_machines.Allocation
          - state_machines.SalesOrder
          - state_machines.InventoryLot
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pairs (Allocation -> SalesOrder) and (Allocation -> InventoryLot):
          allocation on a SUBMITTED (not CONFIRMED) order fails ERR_ORDER_INVALID_STATE,
          and allocation on an ON_HOLD lot of a CONFIRMED order fails ERR_LOT_ON_HOLD —
          two distinct cross-entity guards on the same endpoint. Sibling instance crosses
          DockTicket -> ImportDocument, a different pair.
        test_recipe:
          setup:
            - "COD lot of 50.00 kg ACTIVE+CLEAR; Order A SUBMITTED (never confirmed); Order B CONFIRMED"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 50.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "GET /inventory-lots", payload: { landing_line_id: "${l_id}" }, as: OperationsManager, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { oa_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${oa_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 10.00 }, as: Customer, as_user_id: "${c_id}", captures: { ola_id: $.data.id } }
            - { call: "POST /sales-orders/${oa_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}", captures: { oa_v: $.data.version } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-06" }, as: Customer, as_user_id: "${c_id}", captures: { ob_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${ob_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 10.00 }, as: Customer, as_user_id: "${c_id}", captures: { olb_id: $.data.id } }
            - { call: "POST /sales-orders/${ob_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${ob_id}/confirm", payload: {}, as: OperationsManager, captures: { ob_v: $.data.version } }
            - { call: "POST /inspection-holds", payload: { inventory_lot_id: "${lot_id}", reason: "audit" }, as: ComplianceOfficer, as_user_id: "off_1", captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /allocations", payload: { order_line_id: "${ola_id}", inventory_lot_id: "${lot_id}", qty_kg: 10.00, transit_hours: 8, expected_sales_order_version: "${oa_v}" }, as: InventoryPlanner, captures: { err_a: $.data.error_id } }
            - { call: "POST /allocations", payload: { order_line_id: "${olb_id}", inventory_lot_id: "${lot_id}", qty_kg: 10.00, transit_hours: 8, expected_sales_order_version: "${ob_v}" }, as: InventoryPlanner, captures: { err_b: $.data.error_id } }
          assert:
            - "Order A attempt: error_id == ERR_ORDER_INVALID_STATE (order not CONFIRMED) — note OCC passes first because ${oa_v} matches"
            - "Order B attempt: error_id == ERR_LOT_ON_HOLD (lot hold_status ON_HOLD) even though order is CONFIRMED"
            - "No allocations exist for either line after the pair"

      - name: settle_requires_cleared_import_documents
        grounds:
          - state_machines.DockTicket.GRADED_to_SETTLED
          - state_machines.ImportDocument
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair (DockTicket -> ImportDocument): a GRADED ticket containing an
          is_import species line cannot settle until the required HEALTH_CERT document
          for that ticket+species is CLEARED; clearing it flips the gate and settle then
          succeeds. Different entity pair from the allocation instance.
        test_recipe:
          setup:
            - "Species SHRIMP is_import true, GRADE_A quote 1500 PUBLISHED; ticket GRADED with one SHRIMP line 40.00 kg (yield 1.00, final 60000)"
            - "Import document HEALTH_CERT exists in DRAFT at first settle attempt"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "SHRIMP", common_name: "White Shrimp", labeling_name: "Shrimp", substitution_group: "CRUSTACEAN", fresh_shelf_life_hours: 48, frozen_shelf_life_days: 60, is_import: true }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1500 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 40.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "POST /import-documents", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", doc_type: "HEALTH_CERT", reference_number: "HC-001" }, as: ComplianceOfficer, captures: { doc_id: $.data.id } }
          trigger:
            - { call: "POST /dock-tickets/${t_id}/settle", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
            - { call: "POST /import-documents/${doc_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "off_1" }
            - { call: "POST /import-documents/${doc_id}/clear", payload: {}, as: ComplianceOfficer, as_user_id: "off_2" }
            - { call: "POST /dock-tickets/${t_id}/settle", payload: {}, as: OperationsManager, captures: { t_status: $.data.status } }
          assert:
            - "First settle returns ERR_IMPORT_DOCS_NOT_CLEARED (409); ticket stays GRADED and vessel payable stays 0"
            - "After document CLEARED: settle succeeds, DockTicket.${t_id}.status == SETTLED"
            - "Vessel.${v_id}.payable_balance_cents == 60000 after settle"

  - rule_id: resource_temporal_overlap
    instances:
      - name: vessel_landing_window_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_VESSEL_LANDING_OVERLAP]
          - entities.DockTicket.fields.landing_start_at
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the Vessel resource — a ticket
          starting exactly at another's end is ALLOWED (adjacency), while one minute of
          proper overlap is rejected; VOID tickets release their windows. Different
          resource and different interval semantics from the flight-capacity instance.
        test_recipe:
          setup:
            - "Vessel V; ticket T1 occupying [2026-08-01T06:00:00Z, 2026-08-01T10:00:00Z)"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t1_id: $.data.id } }
          trigger:
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T10:00:00Z", landing_end_at: "2026-08-01T12:00:00Z" }, as: DockBuyer, captures: { t2_id: $.data.id } }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T09:59:00Z", landing_end_at: "2026-08-01T11:00:00Z" }, as: DockBuyer, captures: { err: $.data.error_id } }
            - { call: "POST /dock-tickets/${t1_id}/void", payload: {}, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t4_id: $.data.id } }
          assert:
            - "Adjacent ticket [10:00,12:00) created successfully (201): end == start is not overlap under half-open semantics"
            - "Overlapping ticket [09:59,11:00) returns ERR_VESSEL_LANDING_OVERLAP (409)"
            - "After voiding T1, [06:00,10:00) is accepted again — VOID tickets do not occupy their window"
            - "DockTicket.${t4_id}.status == DRAFT"

      - name: air_flight_aggregate_capacity
        grounds:
          - state_machines.Shipment.QUOTED_to_BOOKED
          - errors[ERR_FLIGHT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity over a (flight_number, flight_date)
          calendar slot — sum of booked weights over shipments in {BOOKED, TENDERED,
          IN_TRANSIT} must stay <= 1000 kg; no interval arithmetic or adjacency concept
          at all. 600 + 500 = 1100 is rejected; 600 + 400 = 1000 exactly is allowed;
          CANCELLED shipments stop consuming capacity. Different resource and semantics
          from the vessel-window instance.
        test_recipe:
          setup:
            - "Species COD GRADE_A quote 1200 PUBLISHED; customer credit 10000000; three CONFIRMED orders (1.00 kg lines)"
            - "Shipment S1 BOOKED at 600.00 kg on FL100 / 2026-08-03"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 10000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o1_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o1_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 1.00 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o1_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o1_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o2_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o2_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 1.00 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o2_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o2_id}/confirm", payload: {}, as: OperationsManager }
            - { call: "POST /shipments", payload: { sales_order_id: "${o1_id}", mode: "AIR", flight_number: "FL100", flight_date: "2026-08-03", booked_weight_kg: 600.00, temp_zone: "CHILLED" }, as: LogisticsCoordinator, captures: { s1_id: $.data.id } }
            - { call: "POST /shipments/${s1_id}/book", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /shipments", payload: { sales_order_id: "${o2_id}", mode: "AIR", flight_number: "FL100", flight_date: "2026-08-03", booked_weight_kg: 500.00, temp_zone: "CHILLED" }, as: LogisticsCoordinator, captures: { s2_id: $.data.id } }
            - { call: "POST /shipments", payload: { sales_order_id: "${o2_id}", mode: "AIR", flight_number: "FL100", flight_date: "2026-08-03", booked_weight_kg: 400.00, temp_zone: "CHILLED" }, as: LogisticsCoordinator, captures: { s3_id: $.data.id } }
          trigger:
            - { call: "POST /shipments/${s2_id}/book", payload: {}, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /shipments/${s3_id}/book", payload: {}, as: LogisticsCoordinator, captures: { s3_status: $.data.status } }
            - { call: "POST /shipments/${s1_id}/cancel", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /shipments/${s2_id}/book", payload: {}, as: LogisticsCoordinator, captures: { s2_status: $.data.status } }
          assert:
            - "S2 (500 kg) over 600 already booked returns ERR_FLIGHT_CAPACITY_EXCEEDED (409): 1100 > 1000"
            - "S3 (400 kg) books successfully: 600 + 400 == 1000 <= 1000 (boundary allowed)"
            - "After S1 cancel frees 600: S2 rebook succeeds (400 + 500 = 900 <= 1000) — CANCELLED releases capacity"
            - "Shipment.${s3_id}.status == BOOKED and Shipment.${s2_id}.status == BOOKED at the end"

  - rule_id: compensating_invariant
    instances:
      - name: lot_weight_conservation_through_allocate_release
        grounds:
          - state_machines.Allocation
          - entities.InventoryLot.fields.available_weight_kg
          - entities.InventoryLot.fields.reserved_weight_kg
          - entities.InventoryLot.fields.committed_weight_kg
        distinguishing_aspect: |
          Conserved quantity: kilograms. Invariant pinned as received_weight_kg ==
          available + reserved + committed + shipped + condemned + spoiled + recalled
          for every lot at every observable point. Forward+compensating pair
          allocate-then-release returns every bucket to its pre-pair value (available
          87.30, reserved 0), and the deliver arm moves committed into shipped without
          changing the total.
        test_recipe:
          setup:
            - "COD lot received 87.30 kg; order CONFIRMED with 50.00 kg line"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "GET /species/${sp_id}", payload: {}, as: OperationsManager, captures: { sp_v2: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_B", quote_date: "2026-08-01", price_per_kg_cents: 950 }, as: OperationsManager, captures: { qb_id: $.data.id } }
            - { call: "POST /market-quotes/${qb_id}/publish", payload: { expected_species_version: "${sp_v2}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 100.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_B", yield_pct: 0.90 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "GET /inventory-lots", payload: { landing_line_id: "${l_id}" }, as: OperationsManager, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 1000000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 50.00 }, as: Customer, as_user_id: "${c_id}", captures: { ol_id: $.data.id } }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager, captures: { o_v: $.data.version } }
          trigger:
            - { call: "POST /allocations", payload: { order_line_id: "${ol_id}", inventory_lot_id: "${lot_id}", qty_kg: 20.00, transit_hours: 8, expected_sales_order_version: "${o_v}" }, as: InventoryPlanner, captures: { al1_id: $.data.id } }
            - { call: "POST /allocations/${al1_id}/commit", payload: {}, as: InventoryPlanner }
            - { call: "GET /sales-orders/${o_id}", payload: {}, as: OperationsManager, captures: { o_v2: $.data.version } }
            - { call: "POST /allocations", payload: { order_line_id: "${ol_id}", inventory_lot_id: "${lot_id}", qty_kg: 30.00, transit_hours: 8, expected_sales_order_version: "${o_v2}" }, as: InventoryPlanner, captures: { al2_id: $.data.id } }
            - { call: "POST /allocations/${al2_id}/release", payload: {}, as: InventoryPlanner }
            - { call: "GET /inventory-lots/${lot_id}", payload: {}, as: OperationsManager }
          assert:
            - "After allocate(20)+commit+allocate(30)+release: available_weight_kg == 67.30, reserved_weight_kg == 0, committed_weight_kg == 20.00"
            - "Invariant holds: 67.30 + 0 + 20.00 + 0 + 0 + 0 + 0 == received_weight_kg == 87.30"
            - "Release pair left no drift: available after pair (67.30) == received 87.30 - committed 20.00 exactly"

      - name: vessel_payable_conservation_through_settle_void
        grounds:
          - state_machines.DockTicket.GRADED_to_SETTLED
          - state_machines.DockTicket.SETTLED_to_VOIDED
          - entities.Vessel.fields.payable_balance_cents
        distinguishing_aspect: |
          Conserved quantity: cents owed to a vessel. Invariant pinned as
          payable_balance_cents(after void of a SETTLED ticket) ==
          payable_balance_cents(before the settle) — the settle credit of 60000 is
          exactly reversed, not recomputed. Different conserved quantity (money vs
          kilograms) from the lot-weight instance.
        test_recipe:
          setup:
            - "Ticket GRADED, final_total 60000 (50.00 kg x 1200); vessel payable 0 before settle"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /dock-tickets", payload: { vessel_id: "${v_id}", catch_area_id: "${ca_id}", landing_start_at: "2026-08-01T06:00:00Z", landing_end_at: "2026-08-01T10:00:00Z" }, as: DockBuyer, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 50.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
          trigger:
            - { call: "POST /dock-tickets/${t_id}/settle", payload: {}, as: OperationsManager }
            - { call: "GET /vessels/${v_id}", payload: {}, as: OperationsManager, captures: { pay_mid: $.data.payable_balance_cents } }
            - { call: "POST /dock-tickets/${t_id}/void", payload: {}, as: OperationsManager }
            - { call: "GET /vessels/${v_id}", payload: {}, as: OperationsManager, captures: { pay_end: $.data.payable_balance_cents } }
          assert:
            - "payable_balance_cents after settle == 60000"
            - "payable_balance_cents after void == 0 == pre-settle value (exact reversal, no drift)"
            - "DockTicket.${t_id}.status == VOIDED; settle+void pair conserves the vessel ledger"
