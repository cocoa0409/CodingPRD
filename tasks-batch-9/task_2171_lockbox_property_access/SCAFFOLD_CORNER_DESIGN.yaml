  - section: consistency_model
    instances:
      - name: loss_report_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - state_machines.Lockbox.PLACED_to_MISSING
          - calculations.association_posture
        distinguishing_aspect: "consistency_model is immediate: the REPORT_LOST response body itself already shows status MISSING and current_listing_id null, and a read issued straight afterwards shows the placement DELINQUENT and the posture recomputed — no second request or run is required."
        test_recipe:
          setup: ["LB-0001 is PLACED on MLS-1001 and Ana's balance is 0"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_PRO", replacement_cost_cents: 12000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id, box1_v: $.data.version }
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /listings"
              payload: { association_id: "${assoc_id}", listing_agent_id: "${m1_id}", address_line: "12 Pine St", mls_number: "MLS-1001" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lst1_id: $.data.id }
            - call: "POST /lockbox-placements"
              payload: { lockbox_id: "${box1_id}", listing_id: "${lst1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /lockboxes/${box1_id}"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_v3: $.data.version }
          trigger:
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "REPORT_LOST", expected_lockbox_version: "${box1_v3}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          assert:
            - "The trigger response body itself has data.status == \"MISSING\", data.loss_type == \"LOST\" and data.current_listing_id == null"
            - "GET /lockbox-placements/${p1_id} issued immediately afterwards returns placement_status == \"DELINQUENT\""
            - "GET /members/${m1_id} issued immediately afterwards returns outstanding_balance_cents == 12300"
            - "GET /associations/${assoc_id} issued immediately afterwards returns missing_box_count == 1, delinquent_placement_count == 1 and posture == \"FROZEN\""

  - section: errors
    instances:
      - name: showing_appointment_unknown_id_returns_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPOINTMENT_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "A state action against a non-existent appointment id returns HTTP 404 ERR_APPOINTMENT_NOT_FOUND before any version or state check runs."
        test_recipe:
          setup: ["One association exists; no showing appointment has the queried id"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id, assoc_v: $.data.version }
          trigger:
            - call: "POST /showing-appointments/00000000-0000-4000-8000-000000000000/state"
              payload: { action: "CONFIRM", expected_appointment_version: "${assoc_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger responds HTTP 404 with data.error_id == \"ERR_APPOINTMENT_NOT_FOUND\""
            - "The 404 wins over the unrelated expected_appointment_version value, because existence (priority 10) precedes OCC (priority 35)"

      - name: error_grant_window_conflict_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_GRANT_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / grant_lockbox_occupation_half_open_with_buffer_boundary
          rationale: "Asserted as the rejection path of the named §1.8 instance."

      - name: error_showing_capacity_exceeded_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHOWING_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / showing_capacity_closed_interval_touching_endpoints_collide
          rationale: "Asserted as the rejection path of the named §1.8 instance."

      - name: error_temp_code_limit_reached_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_TEMP_CODE_LIMIT_REACHED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / temp_code_daily_limit_third_issue_allowed_fourth_blocked
