      - name: fill_rate_breach_boundary
        claim_type: correct_result
        grounds: [calculations.rolling_agreement_fill_rate]
        excluded_because:
          difficulty_instance: fill_rate_exactly_committed_is_compliant
          rationale: "Equality-compliant and one-below-suspends boundaries asserted by the named §1.8 instance."

