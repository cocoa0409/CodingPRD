            - "POST /false-alarm-program/compliance-reports/8c1f0a44-0000-4000-8000-00000000000a/correct returns the same 404 code"
            - "ComplianceReport.${repB_id} is untouched with status ACCEPTED and correction_count 0"

      - name: hold_session_on_a_docket_with_no_scheduled_appeals_is_rejected
        claim_type: Error triggerability
        grounds:
          - errors.ERR_DOCKET_EMPTY
          - state_machines.HearingDocket.OPEN_to_HELD
          - endpoints.POST_/false-alarm-program/hearing-dockets/{docketId}/hold-session
        distinguishing_aspect: "ERR_DOCKET_EMPTY is the second precondition of OPEN -> HELD and is only reachable once the clock has passed session_start: at 2026-10-05T14:00:00Z the session-not-started row is satisfied, and with scheduled_appeal_count 0 the hold is refused with 409 ERR_DOCKET_EMPTY rather than being allowed to close an empty session."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z with one OPEN docket for ho-03 at 2026-10-05T14:00:00Z and no appeals scheduled onto it; the clock then moves to exactly 2026-10-05T14:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_docket1
            - *k_clock_oct05_1400
          trigger:
            - call: "POST /false-alarm-program/hearing-dockets/${docket1_id}/hold-session"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-03"
              captures: { err_docket_empty: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DOCKET_EMPTY, not ERR_HEARING_SESSION_NOT_STARTED"
            - "HearingDocket.${docket1_id}.status is still OPEN with held_at null, scheduled_appeal_count 0 and version 1"
            - "the acting officer is the docket's own hearing_officer_user_id, so priority 10 is satisfied and only the emptiness precondition rejects the call"

      - name: dispatch_requests_list_with_per_page_above_one_hundred_is_rejected
        claim_type: Error triggerability
        grounds:
          - errors.ERR_INVALID_PAGINATION
          - validations.priority_59_pagination
          - endpoints.GET_/false-alarm-program/dispatch-requests
        distinguishing_aspect: "The per_page ceiling is 100 INCLUSIVE, so 101 is the first rejected value on the upper edge — the mirror of the page-below-1 case on the lower edge — and the rejection is a 422 rather than a silent clamp to the declared max of 100."
        test_recipe:
          setup:
            - "Clock 2026-09-20T00:00:00Z; one dispatch request for the 2026-09-15T03:09:00Z alarm exists so the collection is non-empty."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
          trigger:
            - call: "GET /false-alarm-program/dispatch-requests?alarm_site_id=${site_id}&page=1&per_page=101"
              payload: {}
              as: PoliceDispatchSupervisor
              as_user_id: "pds-05"
              captures: { err_page_hi: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_PAGINATION"
            - "no data array is returned and nothing is clamped — per_page 100 on the same call returns 200 with total_count 1"
            - "DispatchRequest.${dr1_id} is untouched in SUBMITTED"

      - name: suspension_orders_list_with_page_below_one_is_rejected
        claim_type: Error triggerability
        grounds:
          - errors.ERR_INVALID_PAGINATION
          - validations.priority_59_pagination
          - endpoints.GET_/false-alarm-program/suspension-orders
        distinguishing_aspect: "page is an integer at or above 1, so page=0 is rejected even on an EMPTY collection — the pagination row is evaluated before the query runs, which is why a caller cannot use a zero page to probe whether any orders exist."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one permitted system and zero suspension orders."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
          trigger:
            - call: "GET /false-alarm-program/suspension-orders?alarm_site_id=${site_id}&page=0&per_page=25"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { err_page_lo: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_PAGINATION"
            - "the same call with page=1 returns 200 with total_count 0 and has_more false"
            - "the error is raised even though the filtered collection is empty, so validation precedes retrieval"

  # ===========================================================================
  # 7. RBAC — the guide's Table 7 sweep over §1.7's eight roles: each role can run
  #    its own exclusive_operations and shared_operations (instances 1-8), cannot
  #    run another role's exclusive operations (instances 9-17), the two
  #    entity_backed identities cannot reach another tenant's aggregate
  #    (instances 18-20), the two header-level auth codes fire (21-22), and the
  #    declared role_model — segregation_of_duties — is enforced on all three
  #    incompatible pairs plus the docket-officer binding (23-27).
  # ===========================================================================
  - section: rbac

    instances:

      - name: program_administrator_runs_configuration_overrides_and_the_program_clock
        claim_type: Role capability — exclusive operations
        grounds:
          - roles.ProgramAdministrator.exclusive_operations
          - endpoints.POST_/false-alarm-program/alarm-companies/{companyId}/status-actions
          - endpoints.POST_/false-alarm-program/penalty-invoices/{invoiceId}/adjustments
        distinguishing_aspect: "ProgramAdministrator is the only role that can reach ALL FOUR privilege classes in one session — company status actions, money adjustments, the logical clock and the nightly batch — and none of them requires a second approver, so a single pa-01 session suspends a monitor, waives 5500 cents and advances time end to end."
        test_recipe:
          setup:
            - "Base program at 2026-08-01T00:00:00Z with one ACTIVE company, one permitted system and its 5500-cent PERMIT_ISSUE_FEE invoice (5000 fee + 500 admin)."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_inv1
          trigger:
            - call: "POST /false-alarm-program/alarm-companies/${company_id}/status-actions"
              payload: { action: "SUSPEND", status_reason: "Central station failed the ECV audit for two consecutive months." }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { co_status_pa: $.data.status, co_reason_pa: $.data.status_reason }
            - call: "POST /false-alarm-program/penalty-invoices/${inv1_id}/adjustments"
              payload: { adjustment_kind: "WAIVE", reason: "Permit fee waived under the small-business hardship policy.", expected_penalty_invoice_version: "${inv1_v}" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { inv1_status_pa: $.data.payment_status, inv1_out_pa: $.data.outstanding_cents }
            - call: "POST /false-alarm-program/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
            - call: "POST /false-alarm-program/_program-runs/nightly"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-01"
          assert:
            - "every one of the four calls succeeds for pa-01: no 403 is returned anywhere in the sequence"
            - "AlarmCompany.${company_id}.status is SUSPENDED with status_reason echoed and last_status_action_at = 2026-08-01T00:00:00Z"
            - "PenaltyInvoice.${inv1_id}.payment_status is PAID with outstanding_cents 0 and adjusted_cents 5500 — a WAIVE settles the money dimension without any payment"
            - "the nightly run is accepted for the administrator and leaves the waived invoice alone — no late penalty is added to a zero balance"

      - name: permit_clerk_registers_the_premises_chain_and_decides_registrations
        claim_type: Role capability — exclusive operations
        grounds:
          - roles.PermitClerk.exclusive_operations
          - roles.PermitClerk.shared_operations
          - endpoints.POST_/false-alarm-program/alarm-systems/{systemId}/approve-registration
        distinguishing_aspect: "PermitClerk owns the whole counter workflow — premises, contacts, systems, PATCH, and BOTH registration verdicts — without ever touching a price: the clerk creates a second premises from scratch, permits one system and rejects another, and the fee schedule that priced the issue fee was configured by someone else."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z with an ACTIVE fee schedule and one monitoring company; no premises yet beyond what the clerk creates."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
          trigger:
            - *k_site2
            - call: "POST /false-alarm-program/site-contacts"
              payload: { alarm_site_id: "${site2_id}", full_name: "Ingrid Halvorsen", phone_number: "+12145550301", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { s2c1_id: $.data.id }
            - call: "POST /false-alarm-program/site-contacts"
              payload: { alarm_site_id: "${site2_id}", full_name: "Tobias Halvorsen", phone_number: "+12145550302", relationship: "KEYHOLDER", contact_priority: 2, is_ecv_callable: true }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { s2c2_id: $.data.id }
            - call: "POST /false-alarm-program/alarm-systems"
              payload: { alarm_site_id: "${site2_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 4, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-07-28T10:00:00Z" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { s2sys1_id: $.data.id, s2sys1_v: $.data.version }
            - call: "POST /false-alarm-program/alarm-systems/${s2sys1_id}/approve-registration"
              payload: {}
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { s2permit_id: $.data.id, s2permit_status: $.data.status }
            - call: "POST /false-alarm-program/alarm-systems"
              payload: { alarm_site_id: "${site2_id}", monitoring_company_id: "${company_id}", system_type: "PANIC", zone_count: 1, ecv_enabled: false, verified_response_mode: "NONE", installed_at: "2026-07-29T10:00:00Z" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { s2sys2_id: $.data.id }
            - call: "POST /false-alarm-program/alarm-systems/${s2sys2_id}/reject-registration"
              payload: { rejection_reason: "Panic-only device is not eligible for a police response permit." }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { s2sys2_status: $.data.status }
          assert:
            - "all six calls succeed as pc-07: AlarmSite ${site2_id} exists with two callable contacts, ${s2sys1_id} is PERMITTED and ${s2sys2_id} is REJECTED"
            - "the clerk's approval created a real AlarmPermit ${s2permit_id} with status ACTIVE and a 5500-cent issue-fee invoice priced from the schedule the clerk cannot edit"
            - "no adjustment, payment, determination or suspension endpoint is touched anywhere in the sequence"

      - name: alarm_company_operator_lodges_requests_and_files_its_own_reports
        claim_type: Role capability — exclusive operations
        grounds:
          - roles.AlarmCompanyOperator.exclusive_operations
          - endpoints.POST_/false-alarm-program/dispatch-requests
          - endpoints.POST_/false-alarm-program/compliance-reports
        distinguishing_aspect: "The operator's three exclusive operations are all self-service on ITS OWN aggregate and are the only writes the role has: it lodges a request, cancels it, and files the period report — but the verdict on both (validate / review) belongs to other roles, so the operator can never advance its own work item."
        test_recipe:
          setup:
            - "Base program with a permitted, ECV-enabled system monitored by Guardian; clock 2026-09-20T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
          trigger:
            - *k_dr1
            - call: "POST /false-alarm-program/dispatch-requests/${dr1_id}/cancel"
              payload: { cancellation_reason: "Keyholder called back and disarmed the panel." }
              as: AlarmCompanyOperator
              as_user_id: "${company_id}"
              captures: { dr1_status_cxl: $.data.status }
            - *k_repB
          assert:
            - "all three calls succeed for the operator identity ${company_id}"
            - "DispatchRequest ${dr1_id} is CANCELLED and no FalseAlarmIncident was ever created from it"
            - "ComplianceReport ${repB_id} exists for the September period with a computed period_score, and the operator cannot review it — that is the reduction unit's call"

      - name: alarm_user_contests_its_own_determination_and_manages_its_own_roster
        claim_type: Role capability — exclusive operations
        grounds:
          - roles.AlarmUser.exclusive_operations
          - roles.AlarmUser.shared_operations
          - endpoints.POST_/false-alarm-program/appeals
        distinguishing_aspect: "AlarmUser is the only non-administrative filer of appeals, and its identity is the premises id itself: the SAME ${site_id} value that authorises the contact write also authorises the appeal and the later withdrawal, so one entity_backed identity spans the roster, the appeal and the withdrawal."
        test_recipe:
          setup:
            - "Incident ${inc1_id} determined COUNTED at 2026-09-20T01:00:00Z on the caller's own premises, inside the 20-day appeal window."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
            - *k_inc1_counted
          trigger:
            - *k_c3
            - *k_appeal1
            - *k_appeal1_withdraw
          assert:
            - "all three calls succeed for the AlarmUser identity ${site_id}: contact 3 is added, Appeal ${appeal1_id} is FILED then WITHDRAWN"
            - "the appeal filing consumed the fresh incident version ${inc1_v2}, proving the premises owner can read the determination it is contesting"
            - "the withdrawal is the shared operation: the same call succeeds for ProgramAdministrator, and the AlarmUser's other exclusive operation — POST /suspension-orders/{orderId}/reinstatement-requests — is exercised under the same identity in the reinstatement instances"

      - name: police_dispatch_supervisor_drives_the_whole_dispatch_lifecycle
        claim_type: Role capability — exclusive operations
        grounds:
          - roles.PoliceDispatchSupervisor.exclusive_operations
          - endpoints.POST_/false-alarm-program/dispatch-requests/{requestId}/validate
          - endpoints.POST_/false-alarm-program/dispatch-requests/{requestId}/record-dispatch
        distinguishing_aspect: "All four verdict endpoints on DispatchRequest — validate, refuse, record-dispatch, close-valid — are exclusive to this one role, and it also shares incident creation, so a single pds-05 session can carry a signal from SUBMITTED all the way to a filed FalseAlarmIncident without any other actor."
        test_recipe:
          setup:
            - "Two lodged dispatch requests: ${dr1_id} for the 2026-09-15 alarm and a second signal on the same system, both SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - &k_dr_pds2
              call: "POST /false-alarm-program/dispatch-requests"
              payload: { alarm_system_id: "${system1_id}", alarm_type: "BURGLARY", verification_method: "SINGLE_CALL", call_attempts: [{ site_contact_id: "${contact1_id}", attempted_at: "2026-09-16T02:40:00Z", outcome: "NO_ANSWER" }], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-09-16T02:38:00Z", idempotency_key: "gsm-0916-b" }
              as: AlarmCompanyOperator
              as_user_id: "${company_id}"
              captures: { dr_pds2_id: $.data.id }
          trigger:
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
            - call: "POST /false-alarm-program/dispatch-requests/${dr_pds2_id}/refuse"
              payload: { refusal_reason: "ECV_DEFICIENT" }
              as: PoliceDispatchSupervisor
              as_user_id: "pds-05"
              captures: { dr_pds2_status: $.data.status, dr_pds2_reason: $.data.refusal_reason }
          assert:
            - "every call succeeds for pds-05: ${dr1_id} runs SUBMITTED -> VALIDATED -> DISPATCHED and yields FalseAlarmIncident ${inc1_id}"
            - "${dr_pds2_id} is REFUSED with refusal_reason ECV_DEFICIENT and never becomes an incident"
            - "the supervisor cannot rule on the incident it filed: the determination endpoint is not in this role's lists"

      - name: false_alarm_review_officer_determines_incidents_and_reviews_reports
        claim_type: Role capability — exclusive operations
        grounds:
          - roles.FalseAlarmReviewOfficer.exclusive_operations
          - endpoints.POST_/false-alarm-program/false-alarm-incidents/{incidentId}/determination
          - endpoints.POST_/false-alarm-program/compliance-reports/{reportId}/review
        distinguishing_aspect: "The reviewing officer is the pricing trigger of the whole program — determination is what stamps occurrence_index and assessed_fee_cents — and the SAME role also scores monitoring companies, so one faro-11 session both charges a premises and flags its monitor."
        test_recipe:
          setup:
            - "Incident ${inc1_id} filed from a dispatched signal, plus Guardian's August report claiming three dispatches when none are on record."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
            - *k_repA
          trigger:
            - *k_inc1_counted
            - *k_repA_flag
          assert:
            - "both calls succeed for faro-11: FalseAlarmIncident ${inc1_id} is COUNTED with occurrence_index 1 and assessed_fee_cents 0 (inside the two-alarm allowance)"
            - "ComplianceReport ${repA_id} is FLAGGED and Guardian's consecutive_flagged_report_count is now 1"
            - "the officer performed a shared operation too — it may create incidents — but cannot void one, revoke a permit or waive a fee"

      - name: hearing_officer_opens_a_docket_schedules_holds_and_decides
        claim_type: Role capability — exclusive operations
        grounds:
          - roles.HearingOfficer.exclusive_operations
          - endpoints.POST_/false-alarm-program/hearing-dockets/{docketId}/hold-session
          - endpoints.POST_/false-alarm-program/appeals/{appealId}/decide
        distinguishing_aspect: "The hearing officer is the only role that can hold a session or decide an appeal, and it can also create the docket it will preside over — so ho-03 builds its own calendar, seats the appeal, holds the session and rules, which is exactly why the docket-officer and segregation-of-duties checks exist as separate guards."
        test_recipe:
          setup:
            - "Appeal ${appeal1_id} FILED against a COUNTED determination made by faro-11; clock 2026-09-20T01:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
            - *k_inc1_counted
            - *k_appeal1
          trigger:
            - *k_docket2
            - call: "POST /false-alarm-program/appeals/${appeal1_id}/schedule"
              payload: { hearing_docket_id: "${docket2_id}", expected_hearing_docket_version: "${docket2_v}" }
              as: HearingOfficer
              as_user_id: "ho-03"
              captures: { appeal1_v_sch: $.data.version, appeal1_status_sch: $.data.status }
            - call: "POST /false-alarm-program/_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T16:15:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
            - call: "POST /false-alarm-program/hearing-dockets/${docket2_id}/hold-session"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-03"
              captures: { docket2_status_held: $.data.status, docket2_v_held: $.data.version }
            - call: "POST /false-alarm-program/appeals/${appeal1_id}/decide"
              payload: { decision: "DENIED", findings: "The panel log confirms an operator error; the determination stands." }
              as: HearingOfficer
