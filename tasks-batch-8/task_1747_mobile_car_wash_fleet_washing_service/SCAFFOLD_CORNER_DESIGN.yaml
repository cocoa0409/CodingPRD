      - name: rewash_order_pricing_zero_waived
        claim_type: correct_result
        grounds: ["calculations.wash_quote_cents", "entities.WashOrder.fields.billing_status", "entities.WashOrder.fields.is_rewash"]
        distinguishing_aspect: "Rewash orders bypass the pricing formula entirely: quote_cents == 0 and billing_status == WAIVED regardless of vehicle count or site reclaim flag, with window set to clock date + 1 day 08:00-10:00Z."
        test_recipe:
          setup: ["RETAIL customer; reclaim site (BERMS, water_reclaim_required, max_discharge_gal 1000); 2 SEDANs; order COMPLETED at clock 2026-08-05T10:00:00Z via BASIC-van route"]
          setup_api_calls:
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/customers", payload: { name: "C2", email: "c2@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "RW", lot_size_sqft: 60000, containment_type: "BERMS", water_reclaim_required: true, max_discharge_gal: 1000 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "C2A", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "C2B", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v2: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}", "${v2}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id, oq: $.data.quote_cents } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-C2", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech C2" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}", "${v2}"] }, as: Technician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/rewash", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { rw_q: $.data.quote_cents, rw_bs: $.data.billing_status, rw_re: $.data.is_rewash, rw_ws: $.data.scheduled_window_start, rw_we: $.data.scheduled_window_end } }
          assert:
            - "oq == 7560 (2 x 3500 = 7000, no tier, + round_half_up(7000 x 0.08) = 560 reclaim surcharge)"
            - "rw_q == 0 and rw_bs == WAIVED and rw_re == true (pricing formula bypassed on the rewash)"
            - "rw_ws == 2026-08-06T08:00:00.000Z and rw_we == 2026-08-06T10:00:00.000Z"

      - name: pause_ninety_days_exactly_allowed
        claim_type: correct_result
        grounds: ["calculations.pause_accounting", "validations[priority=21]"]
        distinguishing_aspect: "The day budget is inclusive at 90: after one closed 75-day pause, a 15-day PAUSE request lands exactly on 90 and is admitted."
