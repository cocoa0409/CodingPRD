              as: TeamLead
              captures: { mv2_id: $.data.id }
            # st_v_stale is now stale because the propose call bumped Student.version
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m2_id}/ratify"
              payload: { movement_id: "${mv2_id}", expected_student_version: "${st_v_stale}" }
              as: TeamLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_STALE_VERSION'"
            - "HTTP status 412"

