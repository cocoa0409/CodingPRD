# =============================================================================
# §1.9 Scaffold Corner Design (Breadth coverage)
# Grocery Online Ordering & Fulfillment — Expert
# Walks references/claim-extraction-guide.md row-by-row against §1.1-§1.7.
# section: / claim_type: are taken verbatim from that guide. Each non-stub
# instance carries an empty-DB-executable setup_api_calls/trigger chain.
# All JSONPath list-index captures are quoted to keep flow mappings valid.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_store_create_returns_system_fields
        claim_type: Creation
        grounds: [entities.Store, endpoints]
        distinguishing_aspect: "POST /v1/stores with name returns 201 with server-minted id, version=1, status=ACTIVE, and defaults ebt_enabled=true, cold_chain_hold_minutes=120."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/stores"
              payload: { name: "FreshMart" }
              as: PlatformAdmin
              captures: { s_id: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Store.${s_id}.status == ACTIVE"
            - "Store.${s_id}.ebt_enabled == true"
            - "Store.${s_id}.cold_chain_hold_minutes == 120"
            - "Store.${s_id}.version == 1"

      - name: entity_product_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Product.fields.pricing_mode]
        distinguishing_aspect: "POST /v1/products without pricing_mode (a source:input field with no default) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Store S exists."]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "X", name: "X", unit_price_cents: 100 }
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: entity_product_default_flags_applied
        claim_type: Defaults
        grounds: [entities.Product.fields.ebt_eligible, entities.Product.fields.age_restricted, entities.Product.fields.cold_chain]
        distinguishing_aspect: "Omitting ebt_eligible/age_restricted/cold_chain on product create applies defaults false/false/false."
        test_recipe:
          setup: ["Store S exists."]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "MILK", name: "Milk", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { p_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Product.${p_id}.ebt_eligible == false"
            - "Product.${p_id}.age_restricted == false"
            - "Product.${p_id}.cold_chain == false"

      - name: entity_order_computed_estimated_total_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Order.fields.estimated_total_cents, calculations.order_total_estimated]
        distinguishing_aspect: "estimated_total_cents is server-computed (one UNIT line 349 qty 2 + tip 100 -> 798); any client-supplied total is ignored, only declared inputs accepted."
        test_recipe:
          setup: ["Store S, Customer C, slot cap 1, UNIT product A(349)."]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc1@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
          trigger:
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", tip_cents: 100, lines: [ { product_id: "${a_id}", requested_qty: 2 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Order.${ord_id}.estimated_total_cents == 798"
            - "Order.${ord_id}.estimated_ebt_eligible_cents == 0"

      - name: entity_order_not_found
        claim_type: Not Found
        grounds: [entities.Order, "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/orders/{id} with a non-existent UUID returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_ORDER_NOT_FOUND"

      - name: entity_refund_immutable_no_version
        claim_type: Immutability
        grounds: [entities.Refund]
        distinguishing_aspect: "Refund has common_fields:false — it exposes id and created_at but no version field and no update endpoint (append-only event); only GET /v1/refunds and GET /v1/refunds/{id} exist."
        test_recipe: { setup: ["No mutating Refund endpoint is declared in §1.5."], setup_api_calls: [], trigger: [ { call: "GET /v1/refunds", payload: {}, as: StoreOps } ], assert: ["response.status == 200", "no POST/PUT/PATCH/DELETE endpoint targets /v1/refunds in §1.5"] }

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_order_initial_states
        claim_type: Initial State
        grounds: [state_machines.Order, entities.Order.fields.fulfillment_status, entities.Order.fields.payment_status]
        distinguishing_aspect: "A newly placed order starts with fulfillment_status=PLACED and payment_status=AUTHORIZED set together on creation."
        test_recipe:
          setup: ["Store, Customer, slot cap 1, UNIT product A(349)."]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc2@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
          trigger:
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.fulfillment_status == PLACED"
            - "Order.${ord_id}.payment_status == AUTHORIZED"

      - name: sm_order_handoff_from_placed_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.STAGED_to_HANDED_OFF, "errors[ERR_ORDER_NOT_STAGED]"]
        distinguishing_aspect: "Handoff from PLACED (skipping PICKING/STAGED) is rejected ERR_ORDER_NOT_STAGED; no fulfillment_status change."
        test_recipe:
          setup: ["Store, Customer, slot cap 1, UNIT product A(349). Order placed (PLACED)."]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc3@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /v1/orders/${ord_id}/handoff"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_ORDER_NOT_STAGED"

      - name: sm_order_cancel_after_handoff_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.PLACED_PICKING_STAGED_to_CANCELLED, "errors[ERR_ORDER_ALREADY_HANDED_OFF]"]
        distinguishing_aspect: "Cancelling a HANDED_OFF (terminal) order is rejected ERR_ORDER_ALREADY_HANDED_OFF; no slot release or refund occurs."
        test_recipe:
          setup:
            - "Clock 2026-06-15T09:30Z. Store, Customer (adult), Picker, slot cap 1. UNIT non-age product A(349)."
            - "Order placed, claimed, line picked, staged, captured, handed off (HANDED_OFF)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc4@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${line_id}/pick"
              payload: { picked_qty: 1 }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/orders/${ord_id}/stage"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/orders/${ord_id}/capture"
              payload: {}
              as: StoreOps
            - call: "POST /v1/orders/${ord_id}/handoff"
              payload: {}
              as: StoreOps
          trigger:
            - call: "POST /v1/orders/${ord_id}/cancel"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_ORDER_ALREADY_HANDED_OFF"
            - "Order.${ord_id}.fulfillment_status == HANDED_OFF"

      - name: sm_slot_close_idempotent_second_close
        claim_type: Idempotency
        grounds: [state_machines.FulfillmentSlot.OPEN_FULL_to_CLOSED, "errors[ERR_SLOT_CLOSED]"]
        distinguishing_aspect: "Closing an already-CLOSED slot a second time is rejected; CLOSED is terminal so no further status transition is permitted (ERR_SLOT_CLOSED)."
        test_recipe:
          setup: ["Store S, slot cap 5, then CLOSED once."]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 5 }
              as: StoreOps
              captures: { slot_id: $.data.id }
            - call: "POST /v1/slots/${slot_id}/close"
              payload: {}
              as: StoreOps
          trigger:
            - call: "POST /v1/slots/${slot_id}/close"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_SLOT_CLOSED"

      - name: sm_substitution_reject_keeps_line_pending
        claim_type: Valid Transition
        grounds: [state_machines.Substitution.PROPOSED_to_REJECTED, entities.OrderLine.fields.status]
        distinguishing_aspect: "Rejecting a PROPOSED substitution sets it REJECTED and leaves the parent OrderLine PENDING (still pickable)."
        test_recipe:
          setup:
            - "Store, Customer, Picker, slot cap 1, UNIT A(349, SHOPPER_CHOICE line), UNIT SUB(250). Order placed, claimed (PICKING). Substitution proposed."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc5@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "SUB", name: "Sub", pricing_mode: "UNIT", unit_price_cents: 250 }
              as: StoreOps
              captures: { sub_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1, substitution_policy: "SHOPPER_CHOICE" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { a_line: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/substitutions"
              payload: { order_line_id: "${a_line}", substitute_product_id: "${sub_id}", substitute_qty: 1 }
              as: Picker
              as_user_id: "${p_id}"
              captures: { sub_rec: $.data.id }
          trigger:
            - call: "POST /v1/substitutions/${sub_rec}/reject"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "Substitution.${sub_rec}.status == REJECTED"
            - "OrderLine.${a_line}.status == PENDING"

      - name: sm_stage_with_pending_line_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.PICKING_to_STAGED, "errors[ERR_LINES_NOT_RESOLVED]"]
        distinguishing_aspect: "Staging a PICKING order while a line is still PENDING is rejected ERR_LINES_NOT_RESOLVED."
        test_recipe:
          setup:
            - "Store, Customer, Picker, slot cap 1. Two UNIT lines A(349), B(500). Claimed (PICKING). Only A picked; B still PENDING."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc6@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "B", name: "B", pricing_mode: "UNIT", unit_price_cents: 500 }
              as: StoreOps
              captures: { b_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 }, { product_id: "${b_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${a_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { a_line: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${a_line}/pick"
              payload: { picked_qty: 1 }
              as: Picker
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/orders/${ord_id}/stage"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_LINES_NOT_RESOLVED"

      - name: sm_stage_all_out_of_stock_nothing_to_stage
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.PICKING_to_STAGED, "errors[ERR_NOTHING_TO_STAGE]"]
        distinguishing_aspect: "Staging a PICKING order where every line is OUT_OF_STOCK (no PICKED/SUBSTITUTED) is rejected ERR_NOTHING_TO_STAGE."
        test_recipe:
          setup:
            - "Store, Customer, Picker, slot cap 1. One UNIT line A(349). Claimed (PICKING). Line marked OUT_OF_STOCK (pre-capture)."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc7@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${line_id}/out-of-stock"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
          trigger:
