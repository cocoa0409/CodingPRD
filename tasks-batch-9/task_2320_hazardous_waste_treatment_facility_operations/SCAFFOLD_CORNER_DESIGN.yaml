          The acceptance criteria are re-checked at the gate, not at shipment: a profile that was
          APPROVED when the manifest was created but SUSPENDED before the truck arrived makes the
          receipt fail with 422, distinct from the 409 a never-approved profile earns at creation.
        test_recipe:
          setup:
            - "Facility with a 90,000,000-cent instrument; generator; profile APPROVED then SUSPENDED"
