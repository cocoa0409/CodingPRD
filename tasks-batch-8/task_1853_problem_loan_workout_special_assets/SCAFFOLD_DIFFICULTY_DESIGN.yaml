            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-8008", original_principal_cents: 60000000, contractual_rate_bps: 1100, days_past_due: 110 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 9, case_officer_id: "officer-8" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Pursue guarantor", target_resolution_date: "2027-07-01T00:00:00Z", milestone_count: 2, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-8"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-8"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-8"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/charge-offs"
              payload: { amount_cents: 10000000, reason_code: "CONFIRMED_LOSS" }
              as: LoanAccounting
              as_user_id: "acct-8"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v3: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals"
              payload: { referral_kind: "GUARANTOR_PURSUITS", target_guarantor_name: "J Guarantor", demand_amount_cents: 8000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: WorkoutOfficer
              as_user_id: "officer-8"
              captures: { ref_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals/${ref_id}/accept"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-8"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals/${ref_id}/settle"
              payload: { settled_amount_cents: 8000000 }
              as: LegalCounsel
              as_user_id: "counsel-8"
          assert:
            - "LegalReferral.${ref_id}.status == SETTLED"
            - "Hop 1: a RecoveryEvent exists (GET recoveries) with recovery_source == GUARANTOR_SETTLEMENT, amount_cents == 8000000, allocation_mode == CHRONOLOGICAL"
            - "Hop 2: Loan.charged_off_principal_cents == 2000000 (8,000,000 applied to the 10,000,000 charged-off bucket first) and Loan.current_principal_cents == 50000000 unchanged"
            - "Hop 2b: WorkoutCase.${case_id}.loss_given_default_cents == 50000000"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_plan_approve_conflict
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_PLAN_NOT_SUBMITTED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Pair 1 — state (priority 4) vs business_safety (priority 6): a plan
          approve attempt on a DRAFT plan BY the case officer violates both;
          the state error ERR_PLAN_NOT_SUBMITTED must win over
          ERR_SEGREGATION_OF_DUTIES because priority 4 < 6.
        test_recipe:
          setup:
            - "Case in ACTION_PLAN with plan P1 still DRAFT; approver is the case officer (segregation violation) AND plan is not SUBMITTED (state violation)"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Ironwood Construction", tax_id: "77-7777777", naics_code: "236220", internal_risk_rating: 7, guarantor_name: "", guarantor_net_worth_cents: 0 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-9009", original_principal_cents: 45000000, contractual_rate_bps: 975, days_past_due: 66 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "MANUAL_REFERRAL", risk_rating_at_entry: 7, case_officer_id: "officer-10" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Draft plan", target_resolution_date: "2027-01-20T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-10"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "officer-10"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_PLAN_NOT_SUBMITTED (state, priority 4) — NOT ERR_SEGREGATION_OF_DUTIES (business_safety, priority 6), even though the approver equals the case officer"

      - name: business_safety_vs_business_fiscal_committee_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_BUSINESS_CONSTRAINT]
          - errors[ERR_FORGIVENESS_CAP_EXCEEDED]
        distinguishing_aspect: |
          Pair 2 — business_constraint (priority 8) vs business_fiscal
          (priority 9): a DIFFERENT category pair than instance 1. On
          collateral release, an encumbered loan (constraint) plus a
          zero-amount fiscal violation on a recovery are disjoint; here the
          conflict is exercised on committee-approve where a structural
          violation (second APPROVED plan active is N/A) is replaced by:
          TDR_DCF method without TDR_CONFIRMED (constraint, 8) outranks any
          fiscal PD/LGD range issue (9) — pinned via impairment finalize
          carrying an out-of-range PD and wrong method gating.
        test_recipe:
          setup:
            - "Case in IMPAIRMENT_REVIEW but tdr_status == TDR_REJECTED (consummated with NO concession: concession_rate_bps == contractual rate, no forgiveness); a TDR_DCF assessment drafted with out-of-range PD 15000 bps (fiscal/range violation AND method-gating violation)"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Juniper Foods", tax_id: "88-8888888", naics_code: "311410", internal_risk_rating: 6, guarantor_name: "", guarantor_net_worth_cents: 0 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-1010", original_principal_cents: 30000000, contractual_rate_bps: 900, days_past_due: 62 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 6, case_officer_id: "officer-11" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Modify without concession", target_resolution_date: "2027-02-15T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-11"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-11"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-11"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v2: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals"
              payload: { proposal_kind: "MODIFICATION", concession_rate_bps: 900, term_extension_months: 0, principal_forgiveness_cents: 0, borrower_concession_cents: 500000, expected_case_version: "${case_v2}" }
              as: WorkoutOfficer
              as_user_id: "officer-11"
              captures: { prop_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-11"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/escalate-to-committee"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-11"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/committee-approve"
              payload: {}
              as: CreditCommittee
              as_user_id: "cc-11"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/consummate"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-11"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/impairments"
              payload: { method: "TDR_DCF", probability_of_default_bps: 15000, loss_given_default_bps: 4000, expected_cash_flows: [ { period_index: 6, amount_cents: 25000000 } ] }
              as: LoanAccounting
              as_user_id: "acct-11"
              captures: { imp_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/impairments/${imp_id}/finalize"
              payload: {}
              as: LoanAccounting
              as_user_id: "acct-11"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_TDR_METHOD_REQUIRES_TDR (business_constraint family, priority 8) — the method-gating error wins over any PD-range/fiscal complaint (priority 9)"
            - "Case tdr_status == TDR_REJECTED confirmed as the blocking fact (concession_rate_bps == contractual 900, forgiveness 0 → no concession granted)"

