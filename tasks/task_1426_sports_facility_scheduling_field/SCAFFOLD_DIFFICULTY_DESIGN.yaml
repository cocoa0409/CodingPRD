  - rule_id: compensating_invariant
    instances:
      - name: invoice_money_conservation_payment_refund
        grounds:
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.paid_cents
          - entities.Invoice.fields.refunded_cents
          - entities.Invoice.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY. Invariant total_cents == (paid_cents - refunded_cents) +
          balance_due_cents holds after a forward payment (5000) and its compensating partial
          refund (2000): 9600 == (5000-2000) + 6600 exactly, with the invoice still PARTIALLY_PAID.
        test_recipe:
          setup:
            - "Happy-path CONFIRMED permit 2026-08-10 with lights: invoice ISSUED, total 9600, 5000 paid"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: true, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
            - { call: "GET /permits", payload: { application_id: "${a_id}" }, as: AthleticsAdmin, captures: { p_id: "$.data[0].id" } }
            - { call: "GET /invoices", payload: { permit_id: "${p_id}" }, as: FinanceClerk, captures: { i_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i_id}/issue", payload: {}, as: FinanceClerk }
            - { call: "POST /invoices/${i_id}/payments", payload: { amount_cents: 5000, method: "CHECK" }, as: FinanceClerk }
            - { call: "POST /permits/${p_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}" }
          trigger:
            - { call: "POST /invoices/${i_id}/refunds", payload: { amount_cents: 2000, reason: "Partial goodwill" }, as: FinanceClerk, as_user_id: "clerk-1", captures: { r_st: $.data.status } }
            - { call: "GET /invoices/${i_id}", payload: {}, as: FinanceClerk, captures: { i_tot: $.data.total_cents, i_paid: $.data.paid_cents, i_ref: $.data.refunded_cents, i_bal: $.data.balance_due_cents, i_st: $.data.status } }
          assert:
            - "Refund 2000 (<= 10000): status CLEARED immediately"
            - "Invoice: total_cents == 9600, paid_cents == 5000, refunded_cents == 2000, balance_due_cents == 6600"
            - "Invariant: 9600 == (5000 - 2000) + 6600 — payment+refund pair leaves the identity exact"
            - "Invoice.status == PARTIALLY_PAID (partial refund does not change payment status)"

      - name: usage_ledger_hours_conservation_cancel_promote
        grounds:
          - entities.UsageLedger.fields.awarded_prime_hours
          - calculations.allocation_run
          - state_machines.Permit.RESERVED_to_CANCELLED
        distinguishing_aspect: |
