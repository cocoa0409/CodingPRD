      - name: irr_aggregate_divergence_covered
        claim_type: correct_result
        grounds: [calculations.transfer_discount_rates]
        excluded_because:
          difficulty_instance: transfer_rate_aggregate_vs_irr
          rationale: "Both rate variants and the cap binding are asserted by the named 1.8 instance."
      - name: death_commutation_value_covered
        claim_type: correct_result
        grounds: [calculations.commuted_value]
        excluded_because:
          difficulty_instance: commuted_value_min_rate_branch_cap
          rationale: "The DEATH branch (fee 0, value 188610) is asserted by the named 1.8 instance; the HARDSHIP branch is covered by corner hardship_fee_applies_three_percent_cap."
      - name: petition_effectuation_cascade_covered
        claim_type: side_effect_execution
        grounds: [state_machines.TransferPetition.COURT_APPROVED_to_EFFECTIVE]
        excluded_because:
          difficulty_instance: court_approval_effectuation_chain
          rationale: "The 4-link cascade is asserted end-to-end by the named 1.8 instance."
      - name: death_cascade_covered
