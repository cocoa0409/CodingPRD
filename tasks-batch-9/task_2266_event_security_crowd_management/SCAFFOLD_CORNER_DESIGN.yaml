      RiskAnalyst and SecurityDirector are both declared on the assessment-decision endpoint, so priority 2 passes for either and the split is enforced entirely at the ACTION level — SUBMIT/REVISE for the analyst, APPROVE/REJECT for the director. This is the distinction between endpoint-level and action-level authorisation, and the two arms must be checked in both directions so that a role table which merely unions the two sets is caught.
