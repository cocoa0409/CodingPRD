# =============================================================================
# SCAFFOLD.yaml — 1184. Feed Mill Operations & Ration Formulation
# =============================================================================

scenario: |
  1184. Feed Mill Operations & Ration Formulation (commercial feed mill): least-cost ration formulation by nutrient constraint, ingredient inventory & bin assignment, batching accuracy & sequencing to avoid carryover, medicated feed control & flushing record, delivery scheduling & bulk truck compartments, custom-mix customer order & pricing, quality sampling & retain, ingredient price volatility & contract coverage

domain_name: feed-mill-ops
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit        # medicated-feed control, flush verification (SoD), retain samples, quality-release gating
  secondary_archetype: quota_allocation      # bin capacity, contract tonnage coverage, truck compartment allocation
  complexity_layers:
    - optimistic_concurrency                 # OCC on Customer.version (order create / patch) and Formula.version (optimize)
    - cascading_side_effects                 # sample-FAIL cascade; contract-exhaustion cascade; ingredient-discontinue cascade
    - dual_variant_calculation               # quoted vs final order pricing; as-fed vs dry-matter assay basis
    - version_pinning_on_approval            # order pins formula version + lines + nutrient floors at CONFIRMED
  entity_topology: flat                      # all 15 entities top-level under /api, linked by FK fields only
  state_machine_shape: cyclic                # Batch rework loop (MIXED→HOLD→BATCHING), Order revision loop (CONFIRMED→REVISING→CONFIRMED), Contract OPEN↔EXHAUSTED, Bin EMPTY↔READY↔BLOCKED
  relationship_patterns:
    - one_to_many                            # Customer→Order, Order→Batch, Batch→Weighment/QualitySample, Line→Batch/FlushRecord
    - cross_aggregate                        # Weighment spans Batch × Ingredient × Bin × Contract; DeliveryTrip spans Truck × Order
  role_model: segregation_of_duties          # flush recorder != verifier; Operator vs QualityTech split
  consistency_model: immediate               # all derived fields recomputed inside the mutating request

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK -> Entity.id canonical prefix)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer display name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open credit exposure in cents", constraints: "> 0" }
      - { name: medicated_permit_ref, type: string, source: input, default: null, description: "Regulatory permit reference allowing purchase of medicated feed; null = not permitted" }
      - { name: credit_used_cents, type: integer, source: computed, description: "Open exposure: sum of quoted_total_cents over orders in {CONFIRMED, REVISING excluded, IN_PRODUCTION} plus final_total_cents over orders in {COMPLETED}; QUOTED/DELIVERED/CANCELLED contribute 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee display name" }
      - { name: capability, type: enum, source: input, description: "OPERATOR | QUALITY_TECH | DUAL — gates which entity-backed role the employee may act as" }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique ingredient code", constraints: "unique across ingredients" }
      - { name: name, type: string, source: input, description: "Ingredient display name" }
      - { name: hazard_class, type: enum, source: input, description: "STANDARD | MEDICATED — MEDICATED triggers carryover/flush and permit rules" }
      - { name: is_flush_material, type: boolean, source: input, default: false, description: "True when ingredient is approved as flush material" }
      - { name: crude_protein_pct, type: number, source: input, description: "Crude protein percent of dry matter", constraints: ">= 0" }
      - { name: crude_fiber_pct, type: number, source: input, description: "Crude fiber percent", constraints: ">= 0" }
      - { name: metabolizable_energy_kcal_kg, type: number, source: input, description: "Metabolizable energy kcal per kg", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", default: "ACTIVE" }

  - name: PriceTick
    parent: null
    common_fields: false   # immutable append-only event: id + created_at only
    fields:
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; ingredient this price applies to" }
      - { name: price_cents_per_ton, type: integer, source: input, description: "Spot price in cents per ton", constraints: "> 0" }
      - { name: effective_from, type: datetime, source: input, description: "Instant from which this spot price is effective; may be earlier than creation time (late-arriving tick)" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; covered ingredient" }
      - { name: supplier_ref, type: string, source: input, description: "Supplier contract reference" }
      - { name: fixed_price_cents_per_ton, type: integer, source: input, description: "Contract fixed price cents per ton", constraints: "> 0" }
      - { name: total_tons, type: number, source: input, description: "Total contracted tonnage (3 decimal places)", constraints: "> 0" }
      - { name: consumed_tons, type: number, source: computed, description: "Sum of actual_tons over Weighments with contract_id = this and status RECORDED" }
      - { name: remaining_tons, type: number, source: computed, description: "total_tons - consumed_tons" }
      - { name: window_start_date, type: string, source: input, description: "Contract window start date YYYY-MM-DD (inclusive; closed interval)" }
      - { name: window_end_date, type: string, source: input, description: "Contract window end date YYYY-MM-DD (inclusive; closed interval)" }
      - { name: status, type: enum, source: system, description: "OPEN | EXHAUSTED | EXPIRED | CANCELLED", default: "OPEN" }

  - name: Bin
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique bin code", constraints: "unique across bins" }
      - { name: capacity_tons, type: number, source: input, description: "Maximum physical capacity in tons", constraints: "> 0" }
      - { name: ingredient_id, type: string, source: system, default: null, description: "FK -> Ingredient.id; assigned ingredient, null when never assigned; assignable only while on_hand_tons == 0" }
      - { name: on_hand_tons, type: number, source: computed, description: "cumulative_replenished_tons minus sum of actual_tons over RECORDED weighments drawn from this bin" }
      - { name: cumulative_replenished_tons, type: number, source: computed, description: "Sum of all replenish amounts ever accepted" }
      - { name: status, type: enum, source: system, description: "EMPTY | READY | BLOCKED; EMPTY iff on_hand_tons == 0", default: "EMPTY" }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique formula code", constraints: "unique across formulas" }
      - { name: min_protein_pct, type: number, source: input, description: "Minimum crude protein pct the ration must deliver" }
      - { name: max_fiber_pct, type: number, source: input, description: "Maximum crude fiber pct allowed" }
      - { name: min_energy_kcal_kg, type: number, source: input, description: "Minimum metabolizable energy kcal/kg" }
      - { name: lines, type: array, source: computed, description: "Optimized lines: [{ingredient_id, inclusion_pct}]; empty until optimize runs" }
      - { name: total_protein_pct, type: number, source: computed, description: "round(sum(inclusion_pct * ingredient.crude_protein_pct)/100, 2)" }
      - { name: total_fiber_pct, type: number, source: computed, description: "round(sum(inclusion_pct * ingredient.crude_fiber_pct)/100, 2)" }
      - { name: total_energy_kcal_kg, type: number, source: computed, description: "round(sum(inclusion_pct * ingredient.metabolizable_energy_kcal_kg)/100, 2)" }
      - { name: meets_constraints, type: boolean, source: computed, description: "total_protein_pct >= min_protein_pct AND total_fiber_pct <= max_fiber_pct AND total_energy_kcal_kg >= min_energy_kcal_kg" }
      - { name: provisional_cost_cents_per_ton, type: integer, source: computed, description: "Projected cost of one ton under contract-blend projection (see calculation formula_provisional_cost)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: "DRAFT" }

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; taken from X-User-ID of the Customer role caller" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; formula being ordered" }
      - { name: tons, type: number, source: input, description: "Ordered tonnage (3 decimal places)", constraints: "> 0" }
      - { name: is_medicated, type: boolean, source: computed, description: "True iff any pinned/formula line ingredient has hazard_class MEDICATED" }
      - { name: quoted_formula_version, type: integer, source: system, description: "Formula.version observed at quote time" }
      - { name: quoted_cost_basis_cents, type: integer, source: system, description: "Formula.provisional_cost_cents_per_ton observed at quote time" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional order price computed at creation (see order_price, variant quoted)" }
      - { name: pinned_formula_version, type: integer, source: system, default: null, description: "Formula.version locked at CONFIRMED" }
      - { name: pinned_lines, type: array, source: system, default: null, description: "Deep copy of Formula.lines locked at CONFIRMED; drives all batch targets and weighment validation" }
      - { name: pinned_min_protein_pct, type: number, source: system, default: null, description: "Formula.min_protein_pct locked at CONFIRMED; sample PASS rule uses pinned floors" }
      - { name: pinned_max_fiber_pct, type: number, source: system, default: null, description: "Formula.max_fiber_pct locked at CONFIRMED" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Final order price computed at COMPLETED from actual weighments (see order_price, variant final)" }
      - { name: quote_stale, type: boolean, source: computed, description: "True iff Formula.version != quoted_formula_version OR Formula.provisional_cost_cents_per_ton != quoted_cost_basis_cents" }
      - { name: blocked, type: boolean, source: computed, description: "True iff any Batch of this order is in HOLD" }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | REVISING | IN_PRODUCTION | COMPLETED | DELIVERED | CANCELLED", default: "QUOTED" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique line code", constraints: "unique across lines" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DOWN", default: "ACTIVE" }
      - { name: contamination, type: enum, source: computed, description: "MEDICATED iff the latest batch on this line with mixed_at set was medicated AND no VERIFIED FlushRecord has verified_at after that mixed_at; else NONE" }

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> CustomerOrder.id; order this batch produces for" }
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; scheduled production line" }
      - { name: target_tons, type: number, source: input, description: "Planned batch size in tons (3 decimal places)", constraints: "> 0" }
      - { name: planned_start_at, type: datetime, source: input, description: "Planned window start (half-open interval start)" }
      - { name: planned_end_at, type: datetime, source: input, description: "Planned window end (must be > planned_start_at)" }
      - { name: is_medicated, type: boolean, source: computed, description: "Copied from order.is_medicated at creation" }
      - { name: actual_tons, type: number, source: computed, description: "Sum of actual_tons over RECORDED weighments of this batch" }
      - { name: ingredient_cost_cents, type: integer, source: computed, description: "Sum of line_cost_cents over RECORDED weighments (per-weighment rounding already applied)" }
      - { name: mixed_at, type: datetime, source: system, default: null, description: "Server timestamp when BATCHING -> MIXED fired" }
      - { name: status, type: enum, source: system, description: "PLANNED | BATCHING | MIXED | HOLD | RELEASED | REJECTED | CANCELLED", default: "PLANNED" }

  - name: Weighment
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; must appear in the order's pinned_lines" }
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; bin must be READY and assigned to ingredient_id" }
      - { name: actual_tons, type: number, source: input, description: "Scale reading in tons (3 decimal places)", constraints: "> 0" }
      - { name: source, type: enum, source: system, description: "CONTRACT | SPOT — chosen by the contract selector policy (see calculation weighment_pricing)" }
      - { name: contract_id, type: string, source: system, default: null, description: "FK -> Contract.id; set when source == CONTRACT, else null" }
      - { name: unit_price_cents, type: integer, source: system, description: "Contract fixed price when source == CONTRACT, else effective spot price at current clock" }
      - { name: line_cost_cents, type: integer, source: computed, description: "round_half_up(actual_tons * unit_price_cents) — per-weighment rounding, pinned before any summation" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOID", default: "RECORDED" }

  - name: FlushRecord
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; line being flushed" }
      - { name: flush_material_ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; ingredient must have is_flush_material == true" }
      - { name: quantity_tons, type: number, source: input, description: "Flush material run through the line", constraints: ">= 0.5 (MIN_FLUSH_TONS)" }
      - { name: recorded_by_employee_id, type: string, source: system, description: "Employee id taken from X-User-ID of the recording Operator" }
      - { name: verified_by_employee_id, type: string, source: system, default: null, description: "Employee id taken from X-User-ID of the verifying Operator; must differ from recorded_by_employee_id" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Server timestamp of verification; drives line contamination reset" }
      - { name: status, type: enum, source: system, description: "RECORDED | VERIFIED | REJECTED", default: "RECORDED" }

  - name: QualitySample
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id; batch must be MIXED or HOLD at sampling time" }
      - { name: sample_type, type: enum, source: input, description: "COMPOSITE | RETAIN" }
      - { name: retain_expiry_date, type: datetime, source: input, default: null, description: "Required for RETAIN samples; must be strictly after current clock" }
      - { name: protein_pct_actual, type: number, source: input, default: null, description: "Lab assay crude protein (as-fed basis); set via result endpoint" }
      - { name: crude_fiber_pct_actual, type: number, source: input, default: null, description: "Lab assay crude fiber (as-fed basis); set via result endpoint" }
      - { name: moisture_pct, type: number, source: input, default: null, description: "Lab assay moisture percent; set via result endpoint", constraints: ">= 0 and < 100" }
      - { name: protein_dry_matter, type: number, source: computed, default: null, description: "round(protein_pct_actual / (1 - moisture_pct/100), 2)" }
      - { name: fiber_dry_matter, type: number, source: computed, default: null, description: "round(crude_fiber_pct_actual / (1 - moisture_pct/100), 2)" }
      - { name: result, type: enum, source: system, description: "PENDING | PASS | FAIL", default: "PENDING" }
      - { name: result_by_employee_id, type: string, source: system, default: null, description: "Employee id taken from X-User-ID of the QualityTech entering the result" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: plate_no, type: string, source: input, description: "Unique plate number", constraints: "unique across trucks" }
      - { name: cargo_class_capability, type: enum, source: input, description: "STANDARD_ONLY | MEDICATED_CAPABLE" }
      - { name: compartments, type: array, source: input, description: "Fixed at creation: [{compartment_seq, capacity_tons}]; compartment_seq unique per truck", constraints: "1 to 8 entries; each capacity_tons > 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RETIRED", default: "AVAILABLE" }

  - name: DeliveryTrip
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id" }
      - { name: order_id, type: string, source: input, description: "FK -> CustomerOrder.id" }
      - { name: planned_departure_at, type: datetime, source: input, description: "Half-open window start" }
      - { name: planned_return_at, type: datetime, source: input, description: "Half-open window end (must be > planned_departure_at)" }
      - { name: compartment_allocations, type: array, source: input, description: "[{compartment_seq, tons, cargo_class}] with cargo_class STANDARD | MEDICATED; every entry's cargo_class must match the order's medicated flag" }
      - { name: total_tons, type: number, source: computed, description: "Sum of tons over compartment_allocations" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOADING | IN_TRANSIT | DELIVERED | CANCELLED", default: "PLANNED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/customers/{id}/set-status {status: SUSPENDED}"
        actor: MillManager
        preconditions: ["Customer is ACTIVE"]
        side_effects: ["increments Customer.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/customers/{id}/set-status {status: ACTIVE}"
        actor: MillManager
        preconditions: ["Customer is SUSPENDED"]
        side_effects: ["increments Customer.version by 1"]

  - entity: Ingredient
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/ingredients/{id}/discontinue"
        actor: MillManager
        preconditions: ["Ingredient is ACTIVE"]
        side_effects:
          - "hop 1: every Bin with ingredient_id == this and on_hand_tons > 0 transitions READY -> BLOCKED"
          - "hop 1: every Formula in {DRAFT, ACTIVE} whose lines contain this ingredient transitions to RETIRED (forced; ERR_FORMULA_IN_USE does not apply to the cascade)"
          - "increments Ingredient.version by 1"

  - entity: Contract
    initial_state: OPEN
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (a Weighment with contract_id == this is recorded and remaining_tons becomes exactly 0)"
        actor: system
        preconditions: ["remaining_tons == 0 after the consumption"]
        side_effects:
          - "hop 2: contract leaves the weighment/formula pricing selector pool"
          - "hop 3: recompute provisional_cost_cents_per_ton of every Formula in {DRAFT, ACTIVE} whose lines contain this ingredient"
          - "hop 4 (observable): CustomerOrders in QUOTED against those formulas flip quote_stale to true (derived field)"
          - "increments Contract.version by 1"
      - from: EXHAUSTED
        to: OPEN
        trigger: "system (a Weighment with contract_id == this is voided and remaining_tons becomes > 0)"
        actor: system
        preconditions: ["remaining_tons > 0 after the void"]
        side_effects:
          - "hop 2: contract re-enters the selector pool"
          - "hop 3: recompute provisional_cost_cents_per_ton of affected formulas"
          - "increments Contract.version by 1"
      - from: OPEN
        to: EXPIRED
        trigger: "system (evaluated on POST /api/_clock/set_current_utc and on any Contract read: clock date > window_end_date AND remaining_tons > 0)"
        actor: system
        preconditions: ["current clock date is after window_end_date", "remaining_tons > 0"]
        side_effects:
          - "hop 2: contract leaves the selector pool"
          - "hop 3: recompute provisional_cost_cents_per_ton of affected formulas"
          - "increments Contract.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/contracts/{id}/cancel"
        actor: MillManager
        preconditions: ["Contract is OPEN"]
        side_effects:
          - "hop 2: contract leaves the selector pool"
          - "hop 3: recompute provisional_cost_cents_per_ton of affected formulas"
          - "increments Contract.version by 1"

  - entity: Bin
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - from: EMPTY
        to: READY
        trigger: "POST /api/bins/{id}/replenish (first accepted replenishment after assignment)"
        actor: MillManager
        preconditions: ["ingredient_id is not null", "tons > 0", "on_hand_tons + tons <= capacity_tons"]
        side_effects: ["on_hand_tons += tons", "cumulative_replenished_tons += tons", "increments Bin.version by 1"]
      - from: READY
        to: EMPTY
        trigger: "system (a Weighment drawdown makes on_hand_tons exactly 0)"
        actor: system
        preconditions: ["on_hand_tons == 0 after the drawdown"]
        side_effects: ["increments Bin.version by 1"]
        note: "ingredient_id assignment is RETAINED at EMPTY; a new ingredient may be assigned only while EMPTY"
      - from: READY
        to: BLOCKED
        trigger: "system (Ingredient cascade: assigned ingredient transitioned to DISCONTINUED)"
        actor: system
        preconditions: []
        side_effects: ["increments Bin.version by 1"]
      - from: BLOCKED
        to: READY
        trigger: "POST /api/bins/{id}/unblock"
        actor: MillManager
        preconditions: ["Bin is BLOCKED", "on_hand_tons > 0"]
        side_effects: ["increments Bin.version by 1"]

  - entity: Formula
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/formulas/{id}/activate"
        actor: Nutritionist
        preconditions:
          - "Formula is DRAFT"
          - "lines is non-empty"
          - "meets_constraints == true (else ERR_NUTRIENT_CONSTRAINT_VIOLATION)"
          - "every line ingredient has status ACTIVE (else ERR_INGREDIENT_NOT_ACTIVE)"
        side_effects: ["increments Formula.version by 1"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /api/formulas/{id}/retire OR system (ingredient-discontinue cascade)"
        actor: Nutritionist
        preconditions: ["Formula is DRAFT"]
        side_effects: ["increments Formula.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/formulas/{id}/retire OR system (ingredient-discontinue cascade)"
        actor: Nutritionist
        preconditions:
          - "Formula is ACTIVE"
          - "manual retire only: no CustomerOrder with pinned_formula_version set and status IN {CONFIRMED, REVISING, IN_PRODUCTION, COMPLETED} references this formula (else ERR_FORMULA_IN_USE); the cascade ignores this check"
        side_effects:
          - "increments Formula.version by 1"
        note: "pinned orders keep their pinned_lines snapshot and remain batchable after retirement"
    note: "POST /api/formulas/{id}/optimize is NOT a transition: it recomputes lines/totals/meets_constraints/provisional_cost in place and increments Formula.version by 1; allowed in DRAFT and ACTIVE."

  - entity: CustomerOrder
    initial_state: QUOTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /api/orders/{id}/confirm"
        actor: Customer
        preconditions:
          - "Order is QUOTED (else ERR_INVALID_STATE)"
          - "Customer.status == ACTIVE (else ERR_INVALID_STATE)"
          - "business_safety: if order.is_medicated then Customer.medicated_permit_ref is not null (else ERR_MEDICATED_PERMIT_REQUIRED)"
          - "business_fiscal: quote_stale == false (else ERR_QUOTE_STALE)"
          - "business_fiscal: Customer.credit_used_cents + quoted_total_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED; equality passes)"
        side_effects:
          - "pins pinned_formula_version := Formula.version, pinned_lines := copy of Formula.lines, pinned_min_protein_pct / pinned_max_fiber_pct"
          - "credit_used_cents now includes quoted_total_cents; increments Customer.version by 1"
          - "increments CustomerOrder.version by 1"
      - from: CONFIRMED
        to: REVISING
        trigger: "POST /api/orders/{id}/begin-revision"
        actor: Customer
        preconditions: ["Order is CONFIRMED", "no Batch of this order is IN {BATCHING, MIXED, HOLD}"]
        side_effects:
          - "credit exposure released: credit_used_cents drops by quoted_total_cents; increments Customer.version by 1"
          - "increments CustomerOrder.version by 1"
      - from: REVISING
        to: CONFIRMED
        trigger: "POST /api/orders/{id}/commit-revision"
        actor: Customer
        preconditions:
          - "Order is REVISING"
          - "tons > 0"
          - "recomputed quote at CURRENT prices and CURRENT formula (re-pins version/lines/floors)"
          - "same safety + fiscal checks as confirm (ERR_MEDICATED_PERMIT_REQUIRED, ERR_QUOTE_STALE not applicable after re-pin, ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "quoted_total_cents recomputed; quoted_formula_version/quoted_cost_basis_cents refreshed; pinned_* refreshed"
          - "tons updated to the new value"
          - "credit re-added; increments Customer.version by 1"
          - "increments CustomerOrder.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer
        preconditions: ["Order is QUOTED"]
        side_effects: ["increments CustomerOrder.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order is CONFIRMED"
          - "no Batch of this order is IN {PLANNED, BATCHING, MIXED, HOLD} (else ERR_INVALID_STATE)"
          - "no DeliveryTrip of this order is IN {PLANNED, LOADING, IN_TRANSIT} (else ERR_INVALID_STATE)"
        side_effects:
          - "credit exposure released; increments Customer.version by 1"
          - "increments CustomerOrder.version by 1"
      - from: REVISING
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer
        preconditions: ["Order is REVISING"]
        side_effects: ["increments CustomerOrder.version by 1"]
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "system (first Batch of this order transitions PLANNED -> BATCHING)"
        actor: system
        preconditions: []
        side_effects: ["increments CustomerOrder.version by 1"]
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /api/orders/{id}/complete"
        actor: MillManager
        preconditions:
          - "Order is IN_PRODUCTION"
          - "blocked == false (no Batch in HOLD; else ERR_ORDER_BLOCKED)"
          - "no Batch IN {PLANNED, BATCHING, MIXED, HOLD} (else ERR_INVALID_STATE)"
          - "abs(sum(actual_tons over RELEASED batches) - tons) / tons <= 0.02 (ORDER_QTY_TOLERANCE; else ERR_ORDER_TONS_MISMATCH; exactly 0.02 passes)"
        side_effects:
          - "computes final_total_cents (order_price variant final)"
          - "credit exposure reclasses from quoted_total_cents to final_total_cents; increments Customer.version by 1"
          - "increments CustomerOrder.version by 1"
      - from: COMPLETED
        to: DELIVERED
        trigger: "system (a DeliveryTrip DELIVERED and now every trip of the order is terminal, at least one is DELIVERED, and sum of total_tons over DELIVERED trips == order.tons)"
        actor: system
        preconditions: []
        side_effects:
          - "credit exposure drops to 0 for this order; increments Customer.version by 1"
          - "increments CustomerOrder.version by 1"

  - entity: Batch
    initial_state: PLANNED
    terminal_states: [RELEASED, REJECTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: BATCHING
        trigger: "POST /api/batches/{id}/start"
        actor: Operator
        preconditions:
          - "Batch is PLANNED (else ERR_INVALID_STATE)"
          - "ProductionLine.status == ACTIVE (else ERR_INVALID_STATE)"
          - "order.status IN {CONFIRMED, IN_PRODUCTION} (else ERR_INVALID_STATE)"
          - "order.blocked == false (else ERR_ORDER_BLOCKED)"
          - "business_safety: if batch.is_medicated == false AND line.contamination == MEDICATED then a VERIFIED FlushRecord with verified_at after the last medicated mixed_at must exist (else ERR_FLUSH_REQUIRED)"
        side_effects:
          - "if order.status == CONFIRMED: order -> IN_PRODUCTION (order version bump)"
          - "increments Batch.version by 1"
      - from: BATCHING
        to: MIXED
        trigger: "POST /api/batches/{id}/mix"
        actor: Operator
        preconditions:
          - "Batch is BATCHING"
          - "every pinned line has at least one RECORDED weighment"
          - "for every pinned line: abs(sum(RECORDED actual_tons for the line) - line_target_tons) / line_target_tons * 100 <= 2.0 (WEIGHMENT_TOLERANCE_PCT; else ERR_WEIGHMENT_OUT_OF_TOLERANCE; exactly 2.00 passes). line_target_tons = round_half_up(inclusion_pct/100 * target_tons, 3)"
        side_effects:
          - "mixed_at := current clock"
          - "if batch.is_medicated: line.contamination becomes MEDICATED (derived from this batch's mixed_at)"
          - "increments Batch.version by 1"
      - from: MIXED
        to: RELEASED
        trigger: "POST /api/batches/{id}/release"
        actor: QualityTech
        preconditions:
          - "Batch is MIXED"
          - "business_safety: a QualitySample with batch_id == this and result == PASS exists (else ERR_QUALITY_NOT_PASSED)"
        side_effects: ["increments Batch.version by 1"]
      - from: MIXED
        to: HOLD
        trigger: "system (a QualitySample of this batch records result == FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "hop 1: batch -> HOLD"
          - "hop 2: order.blocked recomputes to true"
          - "hop 3: every DeliveryTrip of this order IN {PLANNED, LOADING} -> CANCELLED (compartment allocations released; trips are not auto-revived)"
          - "increments Batch.version by 1"
      - from: HOLD
        to: BATCHING
        trigger: "POST /api/batches/{id}/rework"
        actor: Operator
        preconditions: ["Batch is HOLD"]
        side_effects:
          - "order.blocked recomputes (false once no batch remains in HOLD)"
          - "increments Batch.version by 1"
        note: "during rework the operator may void RECORDED weighments and record replacements, then mix again"
      - from: HOLD
        to: REJECTED
        trigger: "POST /api/batches/{id}/reject"
        actor: QualityTech
        preconditions: ["Batch is HOLD"]
        side_effects:
          - "order.blocked recomputes"
          - "increments Batch.version by 1"
        note: "REJECTED batches keep their weighments RECORDED; inventory and contract consumption are NOT auto-restored (physical product exists as scrap)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/batches/{id}/cancel"
        actor: MillManager
        preconditions: ["Batch is PLANNED"]
        side_effects: ["increments Batch.version by 1"]

  - entity: Weighment
    initial_state: RECORDED
    terminal_states: [VOID]
    transitions:
      - from: RECORDED
        to: VOID
        trigger: "POST /api/weighments/{id}/void"
        actor: Operator
        preconditions:
          - "Weighment is RECORDED"
          - "parent Batch.status == BATCHING (voids allowed only while batching, including after HOLD -> BATCHING rework)"
        side_effects:
          - "bin.on_hand_tons += actual_tons (bin EMPTY -> READY if it had hit zero)"
          - "if contract_id set: contract.consumed_tons -= actual_tons (contract EXHAUSTED -> OPEN when remaining_tons > 0; recompute cascade hop 3 fires)"
          - "recompute provisional_cost_cents_per_ton of formulas containing this ingredient"
          - "increments Weighment.version by 1"

  - entity: FlushRecord
    initial_state: RECORDED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /api/flush-records/{id}/verify"
        actor: Operator
        preconditions:
          - "FlushRecord is RECORDED"
          - "business_safety (segregation of duties): X-User-ID != recorded_by_employee_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "verified_by_employee_id := X-User-ID; verified_at := current clock"
          - "line.contamination recomputes to NONE when verified_at is after the last medicated batch mixed_at"
          - "increments FlushRecord.version by 1"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /api/flush-records/{id}/reject"
        actor: QualityTech
        preconditions: ["FlushRecord is RECORDED"]
        side_effects: ["increments FlushRecord.version by 1"]

  - entity: QualitySample
    initial_state: PENDING
    terminal_states: [PASS, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /api/samples/{id}/result with computed outcome PASS"
        actor: QualityTech
        preconditions: ["QualitySample is PENDING"]
        side_effects:
          - "result_by_employee_id := X-User-ID"
          - "increments QualitySample.version by 1"
      - from: PENDING
        to: FAIL
        trigger: "POST /api/samples/{id}/result with computed outcome FAIL"
        actor: QualityTech
        preconditions: ["QualitySample is PENDING"]
        side_effects:
          - "result_by_employee_id := X-User-ID"
          - "hop 1: parent Batch MIXED -> HOLD (see Batch MIXED -> HOLD for hops 2-3)"
          - "increments QualitySample.version by 1"
    note: "outcome is computed: PASS iff protein_dry_matter >= order.pinned_min_protein_pct AND fiber_dry_matter <= order.pinned_max_fiber_pct; else FAIL. A FAILed batch may be re-sampled (new PENDING sample) after rework."

  - entity: DeliveryTrip
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADING
        trigger: "POST /api/trips/{id}/load"
        actor: MillManager
        preconditions:
          - "Trip is PLANNED"
          - "order.status == COMPLETED (else ERR_INVALID_STATE)"
          - "order.blocked == false (else ERR_ORDER_BLOCKED)"
        side_effects: ["increments DeliveryTrip.version by 1"]
      - from: LOADING
        to: IN_TRANSIT
        trigger: "POST /api/trips/{id}/depart"
        actor: MillManager
        preconditions: ["Trip is LOADING"]
        side_effects: ["increments DeliveryTrip.version by 1"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /api/trips/{id}/deliver"
        actor: MillManager
        preconditions: ["Trip is IN_TRANSIT"]
        side_effects:
          - "if every trip of the order is terminal, at least one is DELIVERED, and sum(total_tons over DELIVERED trips) == order.tons: order COMPLETED -> DELIVERED (credit exposure released)"
          - "increments DeliveryTrip.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/trips/{id}/cancel OR system (order blocked cascade)"
        actor: MillManager
        preconditions: ["Trip is PLANNED"]
        side_effects: ["increments DeliveryTrip.version by 1"]
      - from: LOADING
        to: CANCELLED
        trigger: "system (order blocked cascade only; manual cancel of a LOADING trip is not allowed)"
        actor: system
        preconditions: []
        side_effects: ["increments DeliveryTrip.version by 1"]

  - entity: ProductionLine
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DOWN
        trigger: "POST /api/lines/{id}/set-status {status: DOWN}"
        actor: MillManager
        preconditions: ["Line is ACTIVE"]
        side_effects: ["increments ProductionLine.version by 1"]
      - from: DOWN
        to: ACTIVE
        trigger: "POST /api/lines/{id}/set-status {status: ACTIVE}"
        actor: MillManager
        preconditions: ["Line is DOWN"]
        side_effects: ["increments ProductionLine.version by 1"]

  - entity: Truck
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /api/trucks/{id}/set-status {status: RETIRED}"
        actor: MillManager
        preconditions:
          - "Truck is AVAILABLE"
          - "no DeliveryTrip of this truck is IN {PLANNED, LOADING, IN_TRANSIT} (else ERR_INVALID_STATE)"
        side_effects: ["increments Truck.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /api/orders"
    occ_field: "expected_customer_version"
    description: |
      Creating a CustomerOrder against a Customer whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an order (or otherwise mutated the
      customer's credit posture) and the current writer's view of the
      customer's open exposure is therefore stale. Sequential re-read of the
      customer and retry with the fresh version succeeds, because creating
      multiple orders for one customer is legitimate.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412
  - rule_id: formula-optimize-stale-formula
    parent_entity: Formula
    write_endpoint: "POST /api/formulas/{id}/optimize"
    occ_field: "expected_formula_version"
    description: |
      Re-optimizing a Formula whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just optimized (or activated) the formula and the current writer's view
      of the ration's lines and cost basis is therefore stale. Sequential
      re-read of the formula and retry with the fresh version succeeds,
      because re-optimization is a legitimate repeatable operation.
    error_id: ERR_STALE_FORMULA_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_spot_price
    trigger: "evaluated whenever a spot price is needed (optimize, quote, weighment pricing, provisional recompute)"
    algorithm: chronological
    formula: |
      effective_spot_price(ingredient, T) =
        price_cents_per_ton of the PriceTick of ingredient with the greatest effective_from <= T;
        tie-break when several ticks share that effective_from: the one with the latest created_at.
        If no tick of the ingredient has effective_from <= T: the ingredient has NO effective price
        (it is excluded from the optimizer candidate set; a weighment drawing it is rejected ERR_INVALID_REQUEST).
      Late-arriving ticks (effective_from earlier than previously computed timestamps) take effect on the
      NEXT evaluation; already-persisted weighment line_cost_cents and quoted/final totals NEVER change retroactively.
    input_set: "PriceTick rows of the ingredient (all of them; PriceTick has no status)"
    constants: {}
    precision: "integer cents"

  - name: least_cost_ration_solve
    trigger: "POST /api/formulas/{id}/optimize"
    algorithm: waterfall_allocation
    formula: |
      T := current clock.
      candidates := Ingredients with status == ACTIVE AND an effective_spot_price(ingredient, T) exists.
      If candidates is empty OR MAX_INCLUSION_PCT * count(candidates) < 100: reject ERR_FORMULA_NOT_FEASIBLE.
      Rank candidates ascending by effective_spot_price; tie-break 1: crude_protein_pct DESC; tie-break 2: created_at ASC.
      remaining := 100.00
      for each candidate in rank order:
        take := min(MAX_INCLUSION_PCT, remaining)          # nested min against the moving remainder
        if take > 0: append line {ingredient_id, inclusion_pct: take}; remaining -= take
        stop when remaining == 0
      Recompute total_protein_pct / total_fiber_pct / total_energy_kcal_kg (rounded to 2 decimals, round_half_up).
      meets_constraints := total_protein_pct >= min_protein_pct AND total_fiber_pct <= max_fiber_pct
                           AND total_energy_kcal_kg >= min_energy_kcal_kg
      Then compute provisional_cost_cents_per_ton (see formula_provisional_cost).
      Side effects: Formula.lines/totals/meets_constraints/provisional_cost updated; Formula.version += 1.
    input_set: "Ingredients with status == ACTIVE and an effective spot price at T"
    constants:
      MAX_INCLUSION_PCT: 70
    precision: "inclusion_pct to 2 decimals; nutrient totals to 2 decimals, round_half_up"

  - name: formula_provisional_cost
    trigger: "on optimize; on PriceTick creation for any line ingredient; on Contract create/cancel/EXHAUSTED/EXPIRED/reopen affecting any line ingredient; on Weighment void reopening a contract"
    algorithm: forward_looking
    formula: |
      Projected cost of ONE reference ton (lines are pct of 1 ton).
      For each line i with tons_i := inclusion_pct_i / 100:
        pool := Contracts of line ingredient with status == OPEN and window_start_date <= date(T) <= window_end_date,
                ranked by window_end_date ASC, tie fixed_price_cents_per_ton ASC, tie created_at ASC.
        remaining := tons_i; projected_line_cost := 0
        for each contract in pool order:
          covered := min(contract.remaining_tons, remaining)
          projected_line_cost += covered * contract.fixed_price_cents_per_ton
          remaining -= covered; stop when remaining == 0
        if remaining > 0: projected_line_cost += remaining * effective_spot_price(ingredient, T)
      provisional_cost_cents_per_ton := round_half_up(sum over lines of projected_line_cost)
      NOTE: each line's projection is independent — no cross-line netting of contract tonnage (pinned simplification).
      Recomputation NEVER increments Formula.version (only optimize/activate/retire do).
    input_set: "Formula.lines; Contracts status OPEN covering date(T); effective spot prices at T"
    constants: {}
    precision: "integer cents, round_half_up once at the end"

  - name: weighment_pricing
    trigger: "POST /api/batches/{id}/weighments"
    algorithm: waterfall_allocation
    formula: |
      T := current clock.
      Selector policy (pinned): pool := Contracts with ingredient_id == weighment.ingredient_id,
        status == OPEN, window_start_date <= date(T) <= window_end_date,
        AND remaining_tons >= actual_tons (a contract is selected only when it covers the ENTIRE weighment;
        boundary: remaining_tons == actual_tons selects the contract and drives it to EXHAUSTED).
      Rank pool by window_end_date ASC (use-it-or-lose-it), tie fixed_price_cents_per_ton ASC, tie created_at ASC.
      If pool non-empty: source := CONTRACT; contract_id := first of pool; unit_price_cents := its fixed price.
      Else: source := SPOT; contract_id := null; unit_price_cents := effective_spot_price(ingredient, T).
      line_cost_cents := round_half_up(actual_tons * unit_price_cents)   # PER-WEIGHMENT rounding, before any sum
      Side effects: bin.on_hand_tons -= actual_tons (bin may flip READY -> EMPTY);
        if CONTRACT: contract.consumed_tons += actual_tons (contract may flip OPEN -> EXHAUSTED, firing its cascade).
    input_set: "Contracts of the weighed ingredient; spot price ticks; target Bin"
    constants: {}
    precision: "tons to 3 decimals; integer cents, round_half_up per weighment"

  - name: batch_line_deviation
    trigger: "POST /api/batches/{id}/mix"
    algorithm: threshold
    formula: |
      For each pinned line i:
        line_target_tons_i := round_half_up(inclusion_pct_i / 100 * batch.target_tons, 3)
        line_actual_tons_i := sum of actual_tons over RECORDED weighments of this batch with ingredient_id == line's
        deviation_pct_i := round_half_up(abs(line_actual_tons_i - line_target_tons_i) / line_target_tons_i * 100, 2)
      MIX is rejected with ERR_WEIGHMENT_OUT_OF_TOLERANCE if any deviation_pct_i > WEIGHMENT_TOLERANCE_PCT.
      Boundary: deviation_pct_i exactly == 2.00 PASSES (the comparison is strictly greater-than).
    input_set: "order.pinned_lines; RECORDED weighments of the batch"
    constants:
      WEIGHMENT_TOLERANCE_PCT: 2.0
    precision: "deviation percent to 2 decimals, round_half_up"

  - name: order_price
    trigger: "variant quoted: on order creation (and recompute inside commit-revision); variant final: on order completion"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (resolves the circular-looking margin/total dependency):
        (1) per-line costs, each rounded first; (2) subtotal := sum of ROUNDED line costs;
        (3) margin tier selected on the PRE-margin subtotal; (4) margin rounded;
        (5) medicated surcharge; (6) delivery fee; (7) total := subtotal + margin + surcharge + delivery.
      line_tons_i := round_half_up(line_pct_i / 100 * order.tons, 3)
      Variant QUOTED: line_cost_i := per-line contract-blend projection (formula_provisional_cost logic applied
        to line_tons_i against contracts OPEN covering date(T), ranked expiry ASC / price ASC / created_at ASC),
        rounded round_half_up to integer cents PER LINE.
      Variant FINAL: line_cost_i := sum of line_cost_cents over the order's RELEASED batches' RECORDED weighments
        for ingredient i (each weighment already rounded per event — pinned per-weighment-then-sum order;
        summing unrounded products and rounding once at the end is the FORBIDDEN alternative).
      subtotal := sum of line_cost_i
      margin_pct := 0.12 if subtotal <= MARGIN_TIER1_CAP_CENTS; 0.10 if <= MARGIN_TIER2_CAP_CENTS; else 0.08
      margin := round_half_up(subtotal * margin_pct)
      surcharge := round_half_up(order.tons * MEDICATED_SURCHARGE_CENTS_PER_TON) if order.is_medicated else 0
      delivery := DELIVERY_BASE_CENTS + round_half_up(order.tons * DELIVERY_PER_TON_CENTS)
      total := subtotal + margin + surcharge + delivery
    input_set:
      "QUOTED: Formula.lines + open contracts + spot prices at quote clock. FINAL: RECORDED weighments of RELEASED batches of the order."
    constants:
      MARGIN_TIER1_CAP_CENTS: 500000
      MARGIN_TIER2_CAP_CENTS: 2000000
      MEDICATED_SURCHARGE_CENTS_PER_TON: 1500
      DELIVERY_BASE_CENTS: 7500
      DELIVERY_PER_TON_CENTS: 900
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: quoted
        when: "order creation and commit-revision"
        difference: "forward-looking contract-blend projection of line costs at current prices"
      - name: final
        when: "order completion"
        difference: "actual per-weighment rounded costs from production; diverges from quoted whenever prices moved or actual tons deviated from targets"

  - name: assay_adjustment
    trigger: "POST /api/samples/{id}/result"
    algorithm: aggregation
    formula: |
      protein_dry_matter := round(protein_pct_actual / (1 - moisture_pct/100), 2)   # round_half_up
      fiber_dry_matter   := round(crude_fiber_pct_actual / (1 - moisture_pct/100), 2)
      outcome := PASS iff protein_dry_matter >= order.pinned_min_protein_pct
                        AND fiber_dry_matter <= order.pinned_max_fiber_pct
      Boundary: protein_dry_matter exactly == pinned_min_protein_pct PASSES; fiber_dry_matter exactly == pinned_max_fiber_pct PASSES.
    input_set: "the sample's assay fields; the batch's order pinned nutrient floors"
    constants: {}
    precision: "2 decimals, round_half_up"
    variants:
      - name: as_fed
        when: "reporting context only (never gates release)"
        difference: "uses protein_pct_actual / crude_fiber_pct_actual as reported — same assay data, lower protein number whenever moisture > 0"
      - name: dry_matter
        when: "release gating (the pinned variant)"
        difference: "moisture-corrected basis; same assay data can flip FAIL(as-fed) to PASS(dry-matter)"

  - name: credit_exposure
    trigger: "recomputed on order confirm / begin-revision / commit-revision / cancel / complete / DELIVERED transition"
    algorithm: aggregation
    formula: |
      credit_used_cents :=
        sum(quoted_total_cents over CustomerOrders of this customer with status IN {CONFIRMED, IN_PRODUCTION})
        + sum(final_total_cents over CustomerOrders of this customer with status IN {COMPLETED})
      QUOTED, REVISING, DELIVERED and CANCELLED orders contribute 0.
      Confirm check: credit_used_cents + quoted_total_cents <= credit_limit_cents (equality passes).
    input_set: "CustomerOrders of the customer with the status filter above"
    constants: {}
    precision: "integer cents"

  - name: bin_on_hand
    trigger: "recomputed on replenish / weighment record / weighment void"
    algorithm: aggregation
    formula: |
      on_hand_tons := cumulative_replenished_tons - sum(actual_tons over RECORDED weighments with bin_id == this)
      Conservation invariant: replenish(X) then weigh(Y) then void the same weighment restores on_hand_tons == X.
      Status derivation: EMPTY iff on_hand_tons == 0; BLOCKED only via ingredient cascade; otherwise READY.
    input_set: "all replenishments of the bin; RECORDED weighments with bin_id == this"
    constants: {}
    precision: "tons to 3 decimals"

  - name: contract_consumption
    trigger: "recomputed on weighment record (CONTRACT source) / weighment void"
    algorithm: aggregation
    formula: |
      consumed_tons := sum(actual_tons over RECORDED weighments with contract_id == this)
      remaining_tons := total_tons - consumed_tons
      Auto-transitions: OPEN -> EXHAUSTED when remaining_tons becomes exactly 0;
        EXHAUSTED -> OPEN when a void makes remaining_tons > 0;
        OPEN -> EXPIRED when clock date passes window_end_date with remaining_tons > 0.
      Conservation invariant: weigh(W tons, CONTRACT c) then void restores c.remaining_tons to its prior value.
    input_set: "RECORDED weighments with contract_id == this"
    constants: {}
    precision: "tons to 3 decimals"

  - name: line_contamination
    trigger: "recomputed on batch MIXED transition and on flush verify"
    algorithm: chronological
    formula: |
      last_med := the Batch on this line with is_medicated == true and mixed_at set, ordered by mixed_at DESC,
                  tie-break created_at DESC, take the first (or none).
      contamination := MEDICATED iff last_med exists AND no FlushRecord of this line has status == VERIFIED
                       with verified_at > last_med.mixed_at; else NONE.
    input_set: "Batches of the line with mixed_at set; VERIFIED FlushRecords of the line"
    constants: {}
    precision: "timestamp comparison, strict >"

  - name: line_window_conflict
    trigger: "POST /api/batches (creation)"
    algorithm: interval_merge
    formula: |
      Occupancy set: Batches on the same line with status IN {PLANNED, BATCHING, MIXED, HOLD, RELEASED, REJECTED}
      (CANCELLED frees its window).
      Each existing window occupies [planned_start_at, planned_end_at + CLEANUP_BUFFER_MINUTES).
      The new window occupies [planned_start_at, planned_end_at + CLEANUP_BUFFER_MINUTES).
      Conflict iff new.start < existing.end + buffer AND existing.start < new.end + buffer.
      Boundary: new.start exactly == existing.end + buffer is ALLOWED (buffer-adjacent scheduling).
      Rejected with ERR_LINE_WINDOW_CONFLICT.
    input_set: "Batches of the same ProductionLine in the occupancy status set"
    constants:
      CLEANUP_BUFFER_MINUTES: 45
    precision: "instant comparison, half-open with trailing buffer"

  - name: truck_window_conflict
    trigger: "POST /api/trips (creation)"
    algorithm: interval_merge
    formula: |
      Occupancy set: DeliveryTrips of the same truck with status IN {PLANNED, LOADING, IN_TRANSIT}
      (DELIVERED and CANCELLED free the truck).
      Intervals are pure half-open [planned_departure_at, planned_return_at) with NO buffer.
      Conflict iff new.departure < existing.return AND existing.departure < new.return.
      Boundary: new.departure exactly == existing.return is ALLOWED (back-to-back dispatch).
      Rejected with ERR_TRUCK_WINDOW_CONFLICT.
    input_set: "DeliveryTrips of the same Truck in the occupancy status set"
    constants: {}
    precision: "instant comparison, half-open"

  - name: contract_window_overlap
    trigger: "POST /api/contracts (creation)"
    algorithm: interval_merge
    formula: |
      For the same ingredient, windows are CLOSED date intervals [window_start_date, window_end_date].
      Conflict iff new.start <= existing.end AND existing.start <= new.end over contracts with
      status IN {OPEN, EXHAUSTED} (EXPIRED and CANCELLED do not block).
      Boundary: new.window_start_date exactly == existing.window_end_date CONFLICTS (closed semantics).
      Rejected with ERR_CONTRACT_WINDOW_OVERLAP.
    input_set: "Contracts of the same ingredient with status IN {OPEN, EXHAUSTED}"
    constants: {}
    precision: "date comparison, closed interval"

  - name: order_completion_quantity
    trigger: "POST /api/orders/{id}/complete"
    algorithm: threshold
    formula: |
      released_tons := sum(actual_tons over RELEASED batches of the order)
      qty_deviation := abs(released_tons - order.tons) / order.tons
      Reject with ERR_ORDER_TONS_MISMATCH iff qty_deviation > ORDER_QTY_TOLERANCE.
      Boundary: qty_deviation exactly == 0.02 PASSES.
    input_set: "RELEASED batches of the order"
    constants:
      ORDER_QTY_TOLERANCE: 0.02
    precision: "tons to 3 decimals"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Request body schema: required fields present, types valid, enum values in range, tons > 0, dates parseable, planned_end_at > planned_start_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Role is listed in the endpoint's roles; entity-backed capability match (Operator/QualityTech X-User-ID must be an Employee whose capability covers the role: OPERATOR or DUAL for Operator, QUALITY_TECH or DUAL for QualityTech)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids resolve left-to-right; body FK ids (formula_id, order_id, line_id, bin_id, ingredient_id, truck_id, contract) exist; Customer-role callers only see their OWN orders/trips (a foreign id resolves as NOT_FOUND)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Optimistic concurrency: expected_customer_version == Customer.version (POST /api/orders, PATCH /api/customers/{id}); expected_formula_version == Formula.version (POST /api/formulas/{id}/optimize)"
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412
    applies_to: "POST /api/orders, PATCH /api/customers/{id}, POST /api/formulas/{id}/optimize (latter uses ERR_STALE_FORMULA_VERSION)"
  - priority: 6
    category: state
    check: "Transition from-state and cross-entity state preconditions: order/customer ACTIVE as required, formula ACTIVE for order creation, batch/order/trip/flush/sample from-state, line ACTIVE, bin READY for weighment/replenish (ERR_BIN_BLOCKED when BLOCKED), order not blocked for batch start / trip create / trip load (ERR_ORDER_BLOCKED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Medicated/regulatory gates: flush required before non-medicated batch on contaminated line (ERR_FLUSH_REQUIRED); medicated order requires customer permit (ERR_MEDICATED_PERMIT_REQUIRED); flush verify by recorder forbidden (ERR_SOD_VIOLATION); batch release requires PASS sample (ERR_QUALITY_NOT_PASSED); trip cargo classes consistent with order medicated flag (ERR_CARGO_CLASS_MIX); medicated cargo requires MEDICATED_CAPABLE truck (ERR_TRUCK_NOT_MEDICATED_CAPABLE)"
    error_id: ERR_FLUSH_REQUIRED
    http_status: 409
    applies_to: "batch start; order confirm/commit-revision; flush verify; batch release; trip create"
  - priority: 8
    category: business_temporal
    check: "Window and clock rules: line window conflict with 45-min buffer (ERR_LINE_WINDOW_CONFLICT); truck half-open window conflict (ERR_TRUCK_WINDOW_CONFLICT); contract closed-date overlap per ingredient (ERR_CONTRACT_WINDOW_OVERLAP); RETAIN sample retain_expiry_date must be after current clock (ERR_RETAIN_EXPIRY_INVALID)"
    error_id: ERR_LINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/batches, POST /api/trips, POST /api/contracts, POST /api/samples"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and capacity, evaluated within this priority IN THE ORDER LISTED: code/plate uniqueness (ERR_DUPLICATE_CODE); bin assign requires on_hand_tons == 0 (ERR_BIN_NOT_EMPTY); replenish within capacity (ERR_BIN_CAPACITY_EXCEEDED); weighment bin holds the weighed ingredient (ERR_BIN_INGREDIENT_MISMATCH); bin has stock (ERR_INSUFFICIENT_INVENTORY); weighed ingredient in pinned lines (ERR_INGREDIENT_NOT_IN_FORMULA); per-line deviation within tolerance at mix (ERR_WEIGHMENT_OUT_OF_TOLERANCE); compartment capacity (ERR_COMPARTMENT_CAPACITY_EXCEEDED — evaluated BEFORE order tonnage over-allocation); order tonnage over-allocation across trips (ERR_ORDER_TONNAGE_OVERALLOCATED); completion quantity within 2% (ERR_ORDER_TONS_MISMATCH); optimizer feasibility (ERR_FORMULA_NOT_FEASIBLE); nutrient constraints met for activation (ERR_NUTRIENT_CONSTRAINT_VIOLATION); line ingredients ACTIVE (ERR_INGREDIENT_NOT_ACTIVE); formula pinned by live orders blocks manual retire (ERR_FORMULA_IN_USE); flush material flag (ERR_FLUSH_MATERIAL_INVALID); flush quantity >= 0.5 (ERR_FLUSH_QUANTITY_BELOW_MIN)"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "create/action endpoints as listed per error"
  - priority: 10
    category: business_fiscal
    check: "Fiscal gates, evaluated LAST: quote freshness at confirm (ERR_QUOTE_STALE); credit headroom at confirm/commit-revision (ERR_CREDIT_LIMIT_EXCEEDED)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /api/orders/{id}/confirm, POST /api/orders/{id}/commit-revision"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; default logical time 2026-05-01T00:00:00Z) ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z (fixed startup default, never wall-clock). Setting the clock triggers the contract EXPIRED sweep.", roles: [MillManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["Contract OPEN -> EXPIRED sweep", "provisional cost recompute where pools changed"] }

  # --- ingredients & price ticks ---
  - { method: POST, path: "/api/ingredients", description: "Create ingredient", roles: [MillManager], code: 201, input: [code, name, hazard_class, "is_flush_material?", crude_protein_pct, crude_fiber_pct, metabolizable_energy_kcal_kg], output: Ingredient, side_effects: [] }
  - { method: GET, path: "/api/ingredients/{id}", description: "Get ingredient by id", roles: [MillManager, Nutritionist, Operator, QualityTech, Customer], code: 200, input: [], output: Ingredient, side_effects: [] }
  - { method: POST, path: "/api/ingredients/{id}/discontinue", description: "Discontinue ingredient; cascades to bins (BLOCKED) and formulas (RETIRED)", roles: [MillManager], code: 200, input: [], output: Ingredient, side_effects: ["Bin READY -> BLOCKED where assigned", "Formula DRAFT/ACTIVE -> RETIRED where referenced", "increments Ingredient.version by 1"] }
  - { method: POST, path: "/api/price-ticks", description: "Record an ingredient spot price tick (append-only; late effective_from allowed)", roles: [MillManager], code: 201, input: [ingredient_id, price_cents_per_ton, effective_from], output: PriceTick, side_effects: ["recompute provisional_cost_cents_per_ton of DRAFT/ACTIVE formulas containing the ingredient"] }
  - { method: GET, path: "/api/ingredients/{id}/price-ticks", description: "List price ticks of an ingredient (reverse reachability for PriceTick.ingredient_id)", roles: [MillManager, Nutritionist, Operator, QualityTech, Customer], code: 200, input: ["limit?", "offset?"], output: "PriceTick[]", side_effects: [] }

  # --- contracts ---
  - { method: POST, path: "/api/contracts", description: "Create forward purchase contract; closed-date windows per ingredient must not overlap OPEN/EXHAUSTED contracts", roles: [MillManager], code: 201, input: [ingredient_id, supplier_ref, fixed_price_cents_per_ton, total_tons, window_start_date, window_end_date], output: Contract, side_effects: ["recompute provisional_cost of formulas containing the ingredient"] }
  - { method: GET, path: "/api/contracts", description: "List contracts; optional filters", roles: [MillManager, Nutritionist, Operator, QualityTech, Customer], code: 200, input: ["ingredient_id?", "status?", "limit?", "offset?"], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/api/contracts/{id}", description: "Get contract by id", roles: [MillManager, Nutritionist, Operator, QualityTech, Customer], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/api/contracts/{id}/cancel", description: "Cancel an OPEN contract", roles: [MillManager], code: 200, input: [], output: Contract, side_effects: ["Contract OPEN -> CANCELLED", "provisional cost recompute"] }

  # --- bins ---
  - { method: POST, path: "/api/bins", description: "Create bin (starts EMPTY, unassigned)", roles: [MillManager], code: 201, input: [code, capacity_tons], output: Bin, side_effects: [] }
  - { method: GET, path: "/api/bins", description: "List bins; optional filters", roles: [MillManager, Nutritionist, Operator, QualityTech], code: 200, input: ["ingredient_id?", "status?", "limit?", "offset?"], output: "Bin[]", side_effects: [] }
  - { method: GET, path: "/api/bins/{id}", description: "Get bin by id", roles: [MillManager, Nutritionist, Operator, QualityTech], code: 200, input: [], output: Bin, side_effects: [] }
  - { method: POST, path: "/api/bins/{id}/assign", description: "Assign ingredient to bin; requires on_hand_tons == 0 (boundary: exactly zero passes)", roles: [MillManager], code: 200, input: [ingredient_id], output: Bin, side_effects: ["sets ingredient_id"] }
  - { method: POST, path: "/api/bins/{id}/replenish", description: "Add stock; requires assigned, not BLOCKED, on_hand + tons <= capacity (equality passes)", roles: [MillManager], code: 200, input: [tons], output: Bin, side_effects: ["on_hand_tons += tons", "cumulative_replenished_tons += tons", "EMPTY -> READY", "increments Bin.version by 1"] }
  - { method: POST, path: "/api/bins/{id}/unblock", description: "Manager override: BLOCKED -> READY", roles: [MillManager], code: 200, input: [], output: Bin, side_effects: ["Bin BLOCKED -> READY", "increments Bin.version by 1"] }

  # --- customers ---
  - { method: POST, path: "/api/customers", description: "Create customer", roles: [MillManager], code: 201, input: [name, credit_limit_cents, "medicated_permit_ref?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/api/customers/{id}", description: "Get customer by id (Customer role may read only own record)", roles: [MillManager, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: PATCH, path: "/api/customers/{id}", description: "Adjust credit limit and/or medicated permit; OCC on Customer.version", roles: [MillManager], code: 200, input: ["credit_limit_cents?", "medicated_permit_ref?", expected_customer_version], output: Customer, side_effects: ["increments Customer.version by 1"] }
  - { method: POST, path: "/api/customers/{id}/set-status", description: "Suspend or reinstate a customer", roles: [MillManager], code: 200, input: [status], output: Customer, side_effects: ["Customer ACTIVE <-> SUSPENDED", "increments Customer.version by 1"] }

  # --- employees ---
  - { method: POST, path: "/api/employees", description: "Create employee (operator / quality tech identity)", roles: [MillManager], code: 201, input: [full_name, capability], output: Employee, side_effects: [] }
  - { method: GET, path: "/api/employees/{id}", description: "Get employee by id", roles: [MillManager], code: 200, input: [], output: Employee, side_effects: [] }

  # --- formulas ---
  - { method: POST, path: "/api/formulas", description: "Create formula with nutrient constraints (DRAFT, empty lines)", roles: [Nutritionist], code: 201, input: [code, min_protein_pct, max_fiber_pct, min_energy_kcal_kg], output: Formula, side_effects: [] }
  - { method: GET, path: "/api/formulas/{id}", description: "Get formula by id", roles: [MillManager, Nutritionist, Operator, QualityTech, Customer], code: 200, input: [], output: Formula, side_effects: [] }
  - { method: POST, path: "/api/formulas/{id}/optimize", description: "Run least-cost greedy allocation; recomputes lines, totals, meets_constraints, provisional cost; OCC on Formula.version; allowed in DRAFT and ACTIVE; increments Formula.version", roles: [Nutritionist], code: 200, input: [expected_formula_version], output: Formula, side_effects: ["least_cost_ration_solve + formula_provisional_cost", "increments Formula.version by 1"] }
  - { method: POST, path: "/api/formulas/{id}/activate", description: "DRAFT -> ACTIVE; requires lines non-empty, meets_constraints, all line ingredients ACTIVE", roles: [Nutritionist], code: 200, input: [], output: Formula, side_effects: ["Formula DRAFT -> ACTIVE", "increments Formula.version by 1"] }
  - { method: POST, path: "/api/formulas/{id}/retire", description: "DRAFT/ACTIVE -> RETIRED; blocked while pinned by live orders (ERR_FORMULA_IN_USE)", roles: [Nutritionist, MillManager], code: 200, input: [], output: Formula, side_effects: ["Formula -> RETIRED", "increments Formula.version by 1"] }

  # --- orders ---
  - { method: POST, path: "/api/orders", description: "Create customer order in QUOTED with provisional price; OCC on Customer.version; bumps Customer.version by 1", roles: [Customer], code: 201, input: [formula_id, tons, expected_customer_version], output: CustomerOrder, side_effects: ["order_price variant quoted", "stores quoted_formula_version + quoted_cost_basis_cents", "increments Customer.version by 1"] }
  - { method: GET, path: "/api/orders", description: "List orders; Customer role sees only own orders (customer_id filter forced to caller)", roles: [MillManager, Customer], code: 200, input: ["customer_id?", "formula_id?", "status?", "limit?", "offset?"], output: "CustomerOrder[]", side_effects: [] }
  - { method: GET, path: "/api/orders/{id}", description: "Get order by id (Customer role: own orders only)", roles: [MillManager, Customer], code: 200, input: [], output: CustomerOrder, side_effects: [] }
  - { method: POST, path: "/api/orders/{id}/confirm", description: "QUOTED -> CONFIRMED; pins formula version/lines/nutrient floors; safety then fiscal gates", roles: [Customer], code: 200, input: [], output: CustomerOrder, side_effects: ["pins pinned_* fields", "credit exposure += quoted_total_cents", "increments Customer.version by 1", "increments CustomerOrder.version by 1"] }
  - { method: POST, path: "/api/orders/{id}/begin-revision", description: "CONFIRMED -> REVISING; releases credit exposure", roles: [Customer], code: 200, input: [], output: CustomerOrder, side_effects: ["credit exposure -= quoted_total_cents", "increments Customer.version by 1"] }
  - { method: POST, path: "/api/orders/{id}/commit-revision", description: "REVISING -> CONFIRMED with new tons; reprices at current prices, re-pins formula snapshot, re-checks safety/fiscal gates", roles: [Customer], code: 200, input: [tons], output: CustomerOrder, side_effects: ["order_price variant quoted recompute", "re-pin pinned_* fields", "credit exposure += new quoted_total_cents", "increments Customer.version by 1"] }
  - { method: POST, path: "/api/orders/{id}/cancel", description: "QUOTED/CONFIRMED/REVISING -> CANCELLED; CONFIRMED cancel blocked by non-terminal batches/trips", roles: [Customer, MillManager], code: 200, input: [], output: CustomerOrder, side_effects: ["credit exposure released when CONFIRMED", "increments Customer.version by 1 when exposure changed"] }
  - { method: POST, path: "/api/orders/{id}/complete", description: "IN_PRODUCTION -> COMPLETED; computes final price; quantity tolerance 2%; credit reclass", roles: [MillManager], code: 200, input: [], output: CustomerOrder, side_effects: ["order_price variant final", "credit exposure reclasses to final_total_cents", "increments Customer.version by 1"] }

  # --- batches & weighments ---
  - { method: POST, path: "/api/batches", description: "Schedule a batch on a line for an order; buffer-extended window conflict check", roles: [MillManager], code: 201, input: [order_id, line_id, target_tons, planned_start_at, planned_end_at], output: Batch, side_effects: ["is_medicated copied from order"] }
  - { method: GET, path: "/api/batches", description: "List batches; optional filters", roles: [MillManager, Nutritionist, Operator, QualityTech], code: 200, input: ["order_id?", "line_id?", "status?", "limit?", "offset?"], output: "Batch[]", side_effects: [] }
  - { method: GET, path: "/api/batches/{id}", description: "Get batch by id", roles: [MillManager, Nutritionist, Operator, QualityTech], code: 200, input: [], output: Batch, side_effects: [] }
  - { method: POST, path: "/api/batches/{id}/start", description: "PLANNED -> BATCHING; flush/sequencing gate; first start moves order CONFIRMED -> IN_PRODUCTION", roles: [Operator], code: 200, input: [], output: Batch, side_effects: ["order -> IN_PRODUCTION when first batch starts", "increments Batch.version by 1"] }
  - { method: POST, path: "/api/batches/{id}/weighments", description: "Record a scale weighment; selects contract vs spot; deducts bin; consumes contract; per-weighment rounding", roles: [Operator], code: 201, input: [ingredient_id, bin_id, actual_tons], output: Weighment, side_effects: ["weighment_pricing", "bin.on_hand_tons -= actual_tons", "contract consumption + possible EXHAUSTED cascade"] }
  - { method: GET, path: "/api/weighments", description: "List weighments; filters cover every Weighment FK (reverse reachability)", roles: [MillManager, Nutritionist, Operator, QualityTech], code: 200, input: ["batch_id?", "bin_id?", "ingredient_id?", "contract_id?", "status?", "limit?", "offset?"], output: "Weighment[]", side_effects: [] }
  - { method: GET, path: "/api/weighments/{id}", description: "Get weighment by id", roles: [MillManager, Nutritionist, Operator, QualityTech], code: 200, input: [], output: Weighment, side_effects: [] }
  - { method: POST, path: "/api/weighments/{id}/void", description: "RECORDED -> VOID; restores bin stock and contract tonnage (compensating action); only while batch is BATCHING", roles: [Operator], code: 200, input: [], output: Weighment, side_effects: ["bin.on_hand_tons += actual_tons", "contract.consumed_tons -= actual_tons (EXHAUSTED -> OPEN when remaining > 0)", "provisional cost recompute"] }
  - { method: POST, path: "/api/batches/{id}/mix", description: "BATCHING -> MIXED; per-line tolerance gate (2.00 pct passes); sets mixed_at and contamination", roles: [Operator], code: 200, input: [], output: Batch, side_effects: ["mixed_at := clock", "line contamination update when medicated", "increments Batch.version by 1"] }
  - { method: POST, path: "/api/batches/{id}/release", description: "MIXED -> RELEASED; requires a PASS quality sample", roles: [QualityTech], code: 200, input: [], output: Batch, side_effects: ["increments Batch.version by 1"] }
  - { method: POST, path: "/api/batches/{id}/rework", description: "HOLD -> BATCHING rework loop; weighments may then be voided and re-recorded", roles: [Operator], code: 200, input: [], output: Batch, side_effects: ["order.blocked recompute", "increments Batch.version by 1"] }
  - { method: POST, path: "/api/batches/{id}/reject", description: "HOLD -> REJECTED (terminal); inventory/contract consumption NOT restored (scrap)", roles: [QualityTech], code: 200, input: [], output: Batch, side_effects: ["order.blocked recompute", "increments Batch.version by 1"] }
  - { method: POST, path: "/api/batches/{id}/cancel", description: "PLANNED -> CANCELLED; frees the line window", roles: [MillManager], code: 200, input: [], output: Batch, side_effects: ["increments Batch.version by 1"] }

  # --- quality samples ---
  - { method: POST, path: "/api/samples", description: "Collect a sample on a MIXED/HOLD batch; RETAIN requires future retain_expiry_date", roles: [QualityTech], code: 201, input: [batch_id, sample_type, "retain_expiry_date?"], output: QualitySample, side_effects: [] }
  - { method: GET, path: "/api/samples", description: "List samples; optional filters", roles: [MillManager, QualityTech], code: 200, input: ["batch_id?", "sample_type?", "result?", "limit?", "offset?"], output: "QualitySample[]", side_effects: [] }
  - { method: GET, path: "/api/samples/{id}", description: "Get sample by id", roles: [MillManager, QualityTech], code: 200, input: [], output: QualitySample, side_effects: [] }
  - { method: POST, path: "/api/samples/{id}/result", description: "Enter lab assay; computes dry-matter adjustment and PASS/FAIL; FAIL cascades batch -> HOLD -> order blocked -> trips cancelled", roles: [QualityTech], code: 200, input: [protein_pct_actual, crude_fiber_pct_actual, moisture_pct], output: QualitySample, side_effects: ["assay_adjustment", "on FAIL: Batch MIXED -> HOLD cascade (hops 1-3)"] }

  # --- flush records ---
  - { method: POST, path: "/api/flush-records", description: "Record a line flush; material must be flush-approved; quantity >= 0.5 tons", roles: [Operator], code: 201, input: [line_id, flush_material_ingredient_id, quantity_tons], output: FlushRecord, side_effects: ["recorded_by_employee_id := X-User-ID"] }
  - { method: GET, path: "/api/flush-records", description: "List flush records; optional filters", roles: [MillManager, Operator, QualityTech], code: 200, input: ["line_id?", "flush_material_ingredient_id?", "status?", "limit?", "offset?"], output: "FlushRecord[]", side_effects: [] }
  - { method: GET, path: "/api/flush-records/{id}", description: "Get flush record by id", roles: [MillManager, Operator, QualityTech], code: 200, input: [], output: FlushRecord, side_effects: [] }
  - { method: POST, path: "/api/flush-records/{id}/verify", description: "RECORDED -> VERIFIED; verifier must differ from recorder (ERR_SOD_VIOLATION); resets line contamination", roles: [Operator], code: 200, input: [], output: FlushRecord, side_effects: ["verified_by_employee_id := X-User-ID; verified_at := clock", "line contamination recompute"] }
  - { method: POST, path: "/api/flush-records/{id}/reject", description: "RECORDED -> REJECTED (QA override)", roles: [QualityTech], code: 200, input: [], output: FlushRecord, side_effects: ["increments FlushRecord.version by 1"] }

  # --- production lines & trucks ---
  - { method: POST, path: "/api/lines", description: "Create production line", roles: [MillManager], code: 201, input: [code], output: ProductionLine, side_effects: [] }
  - { method: GET, path: "/api/lines/{id}", description: "Get line by id (includes derived contamination)", roles: [MillManager, Nutritionist, Operator, QualityTech], code: 200, input: [], output: ProductionLine, side_effects: [] }
  - { method: POST, path: "/api/lines/{id}/set-status", description: "ACTIVE <-> DOWN", roles: [MillManager], code: 200, input: [status], output: ProductionLine, side_effects: ["increments ProductionLine.version by 1"] }
  - { method: POST, path: "/api/trucks", description: "Create truck with fixed compartments", roles: [MillManager], code: 201, input: [plate_no, cargo_class_capability, compartments], output: Truck, side_effects: [] }
  - { method: GET, path: "/api/trucks/{id}", description: "Get truck by id", roles: [MillManager, Nutritionist, Operator, QualityTech, Customer], code: 200, input: [], output: Truck, side_effects: [] }
  - { method: POST, path: "/api/trucks/{id}/set-status", description: "AVAILABLE -> RETIRED; blocked while trips are non-terminal", roles: [MillManager], code: 200, input: [status], output: Truck, side_effects: ["increments Truck.version by 1"] }

  # --- delivery trips ---
  - { method: POST, path: "/api/trips", description: "Schedule a delivery trip with compartment allocations; half-open truck window; order must be IN_PRODUCTION or COMPLETED and not blocked", roles: [MillManager], code: 201, input: [truck_id, order_id, planned_departure_at, planned_return_at, compartment_allocations], output: DeliveryTrip, side_effects: ["total_tons computed"] }
  - { method: GET, path: "/api/trips", description: "List trips; optional filters (Customer role: own orders' trips only)", roles: [MillManager, Customer], code: 200, input: ["truck_id?", "order_id?", "status?", "limit?", "offset?"], output: "DeliveryTrip[]", side_effects: [] }
  - { method: GET, path: "/api/trips/{id}", description: "Get trip by id (Customer role: own orders' trips only)", roles: [MillManager, Customer], code: 200, input: [], output: DeliveryTrip, side_effects: [] }
  - { method: POST, path: "/api/trips/{id}/load", description: "PLANNED -> LOADING; requires order COMPLETED and not blocked", roles: [MillManager], code: 200, input: [], output: DeliveryTrip, side_effects: ["increments DeliveryTrip.version by 1"] }
  - { method: POST, path: "/api/trips/{id}/depart", description: "LOADING -> IN_TRANSIT", roles: [MillManager], code: 200, input: [], output: DeliveryTrip, side_effects: ["increments DeliveryTrip.version by 1"] }
  - { method: POST, path: "/api/trips/{id}/deliver", description: "IN_TRANSIT -> DELIVERED; may bubble order COMPLETED -> DELIVERED (all trips terminal, delivered tons == order tons)", roles: [MillManager], code: 200, input: [], output: DeliveryTrip, side_effects: ["possible order -> DELIVERED with credit release", "increments DeliveryTrip.version by 1"] }
  - { method: POST, path: "/api/trips/{id}/cancel", description: "PLANNED -> CANCELLED (manual); LOADING trips cancel only via blocked cascade", roles: [MillManager], code: 200, input: [], output: DeliveryTrip, side_effects: ["increments DeliveryTrip.version by 1"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing required field, bad type, bad enum member, non-positive tons, end not after start, malformed datetime" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity-backed capability mismatch (e.g., QUALITY_TECH-only employee acting as Operator)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path/body id does not exist, or Customer-role caller references a resource owned by another customer" }
  - { id: ERR_STALE_CUSTOMER_VERSION, http: 412, condition: "expected_customer_version != Customer.version on POST /api/orders or PATCH /api/customers/{id}" }
  - { id: ERR_STALE_FORMULA_VERSION, http: 412, condition: "expected_formula_version != Formula.version on POST /api/formulas/{id}/optimize" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition from-state violation or cross-entity state precondition failed (wrong order/batch/trip/sample/flush/bin/line/formula/customer status for the requested action)" }
  - { id: ERR_ORDER_BLOCKED, http: 409, condition: "Order has a batch in HOLD (blocked == true); batch start, trip create and trip load are refused" }
  - { id: ERR_BIN_BLOCKED, http: 409, condition: "Bin is BLOCKED (ingredient discontinued); replenish and weighment draws are refused" }
  - { id: ERR_FLUSH_REQUIRED, http: 409, condition: "Non-medicated batch start on a line whose contamination is MEDICATED without a VERIFIED flush newer than the last medicated mix" }
  - { id: ERR_MEDICATED_PERMIT_REQUIRED, http: 422, condition: "Confirming/committing a medicated order for a customer whose medicated_permit_ref is null" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "Flush verify attempted by the same employee who recorded it (segregation of duties)" }
  - { id: ERR_QUALITY_NOT_PASSED, http: 409, condition: "Batch release attempted without any QualitySample result == PASS for the batch" }
  - { id: ERR_CARGO_CLASS_MIX, http: 422, condition: "Trip compartment_allocations entry cargo_class differs from the order's medicated flag" }
  - { id: ERR_TRUCK_NOT_MEDICATED_CAPABLE, http: 422, condition: "Medicated cargo allocated to a STANDARD_ONLY truck" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Batch window collides with another occupied window on the same line under 45-minute trailing-buffer semantics" }
  - { id: ERR_TRUCK_WINDOW_CONFLICT, http: 409, condition: "Trip window collides with another non-terminal trip of the same truck under pure half-open semantics" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Contract closed-date window overlaps another OPEN/EXHAUSTED contract of the same ingredient (touching dates conflict)" }
  - { id: ERR_RETAIN_EXPIRY_INVALID, http: 422, condition: "RETAIN sample without retain_expiry_date, or retain_expiry_date not strictly after current clock" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "code/plate_no uniqueness violated (ingredient, bin, formula, line, truck)" }
  - { id: ERR_BIN_NOT_EMPTY, http: 409, condition: "Bin assignment attempted while on_hand_tons > 0" }
  - { id: ERR_BIN_CAPACITY_EXCEEDED, http: 422, condition: "Replenish would push on_hand_tons above capacity_tons (equality passes)" }
  - { id: ERR_BIN_INGREDIENT_MISMATCH, http: 422, condition: "Weighment bin is assigned to a different ingredient than the one weighed" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "Weighment actual_tons exceeds bin on_hand_tons (equality passes)" }
  - { id: ERR_INGREDIENT_NOT_IN_FORMULA, http: 422, condition: "Weighed ingredient does not appear in the order's pinned_lines" }
  - { id: ERR_WEIGHMENT_OUT_OF_TOLERANCE, http: 422, condition: "At mix: a pinned line's aggregate deviation exceeds 2.00 pct (exactly 2.00 passes)" }
  - { id: ERR_COMPARTMENT_CAPACITY_EXCEEDED, http: 422, condition: "Trip allocation tons exceed the compartment's capacity_tons (equality passes)" }
  - { id: ERR_ORDER_TONNAGE_OVERALLOCATED, http: 422, condition: "Sum of total_tons over non-CANCELLED trips of the order would exceed order.tons (equality passes)" }
  - { id: ERR_ORDER_TONS_MISMATCH, http: 422, condition: "At completion: |released tons - order tons| / order tons > 0.02 (exactly 0.02 passes)" }
  - { id: ERR_FORMULA_NOT_FEASIBLE, http: 422, condition: "Optimizer cannot fill 100 pct: no priced ACTIVE candidates, or 70 * count(candidates) < 100" }
  - { id: ERR_NUTRIENT_CONSTRAINT_VIOLATION, http: 422, condition: "Activate attempted while meets_constraints == false" }
  - { id: ERR_INGREDIENT_NOT_ACTIVE, http: 422, condition: "Activate references a DISCONTINUED line ingredient, or contract created for a DISCONTINUED ingredient" }
  - { id: ERR_FORMULA_IN_USE, http: 409, condition: "Manual retire while a live order (CONFIRMED/REVISING/IN_PRODUCTION/COMPLETED) pins this formula" }
  - { id: ERR_FLUSH_MATERIAL_INVALID, http: 422, condition: "flush_material_ingredient_id references an ingredient with is_flush_material == false" }
  - { id: ERR_FLUSH_QUANTITY_BELOW_MIN, http: 422, condition: "Flush quantity_tons < 0.5 (exactly 0.5 passes)" }
  - { id: ERR_QUOTE_STALE, http: 409, condition: "Confirm attempted while quote_stale == true (formula version advanced or provisional cost basis changed since quote)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Confirm/commit-revision would push credit_used_cents above credit_limit_cents (equality passes)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MillManager
    description: "Mill administration: ingredients, prices, contracts, bins, customers, employees, lines, trucks, batch scheduling, order completion, trips, clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/ingredients, POST /api/ingredients/{id}/discontinue, POST /api/price-ticks"
      - "POST /api/contracts, POST /api/contracts/{id}/cancel"
      - "POST /api/bins, POST /api/bins/{id}/assign, /replenish, /unblock"
      - "POST /api/customers, PATCH /api/customers/{id}, POST /api/customers/{id}/set-status"
      - "POST /api/employees"
      - "POST /api/lines, POST /api/lines/{id}/set-status"
      - "POST /api/trucks, POST /api/trucks/{id}/set-status"
      - "POST /api/batches, POST /api/batches/{id}/cancel"
      - "POST /api/trips, POST /api/trips/{id}/load, /depart, /deliver, /cancel"
      - "POST /api/orders/{id}/complete, POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints catalog-wide"
      - "POST /api/orders/{id}/cancel (shared with Customer)"
      - "POST /api/formulas/{id}/retire (shared with Nutritionist)"

  - name: Nutritionist
    description: "Ration formulation: authors formulas and runs least-cost optimization"
    identity: opaque
    exclusive_operations:
      - "POST /api/formulas"
      - "POST /api/formulas/{id}/optimize"
      - "POST /api/formulas/{id}/activate"
    shared_operations:
      - "GET endpoints catalog-wide"
      - "POST /api/formulas/{id}/retire (shared with MillManager)"

  - name: Operator
    description: "Batching crew: starts/mixes/reworks batches, records and voids weighments, records and verifies flushes"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /api/batches/{id}/start, /mix, /rework"
      - "POST /api/batches/{id}/weighments, POST /api/weighments/{id}/void"
      - "POST /api/flush-records, POST /api/flush-records/{id}/verify"
    shared_operations:
      - "GET /api/batches, /api/batches/{id}, /api/weighments, /api/bins, /api/lines/{id}, /api/flush-records"

  - name: QualityTech
    description: "Quality assurance: samples, lab results, batch release/reject, flush rejection"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /api/samples, POST /api/samples/{id}/result"
      - "POST /api/batches/{id}/release, POST /api/batches/{id}/reject"
      - "POST /api/flush-records/{id}/reject"
    shared_operations:
      - "GET /api/samples, /api/batches, /api/weighments, /api/bins, /api/flush-records"

  - name: Customer
    description: "Feed customer: quotes, confirms, revises and cancels own orders; reads own orders/trips"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/orders (customer_id taken from X-User-ID)"
      - "POST /api/orders/{id}/confirm, /begin-revision, /commit-revision (own orders only)"
    shared_operations:
      - "GET /api/orders, /api/orders/{id} (own only)"
      - "GET /api/trips, /api/trips/{id} (own orders' trips only)"
      - "POST /api/orders/{id}/cancel (shared with MillManager; own orders only)"
      - "GET catalog reads (ingredients, formulas, contracts)"
