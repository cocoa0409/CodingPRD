  - rule_id: compensating_invariant
    instances:
      - name: suspension_day_ledger_returns_to_its_pre_appeal_value_before_the_employment_flip
        grounds:
          - calculations.discipline_matrix
          - state_machines.Discipline.APPEALED_to_OVERTURNED
          - state_machines.Officer.SUSPENDED_to_ACTIVE
          - entities.Officer.fields.imposed_suspension_days_total
          - endpoints["POST /appeals/{id}/decide"]
        distinguishing_aspect: |
          Overturning the second discipline subtracts exactly the 24 days it added, returning
          imposed_suspension_days_total to the pre-imposition value of 30 with no drift from the
          aggravator and mitigation arithmetic, and the officer stays SUSPENDED because the
          reversal is only allowed to flip the employment dimension when the ledger reaches
          exactly 0, which happens only after the first discipline is overturned too.
        test_recipe:
