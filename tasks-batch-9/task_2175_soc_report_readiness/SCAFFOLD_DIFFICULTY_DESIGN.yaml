scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: coverage_readiness_view_vs_attestation_view_on_engagement
        grounds:
          - calculations.criteria_coverage
          - entities.Engagement.fields.covered_criteria_count_readiness
          - entities.Engagement.fields.covered_criteria_count_attestation
          - entities.CriteriaMapping.fields.mapping_type
          - state_machines.Control.design_status.DESIGN_MAPPED_to_DESIGN_APPROVED
        distinguishing_aspect: |
          On one identical mapping set the readiness_view counts 2 of 5 in-scope criteria as covered
          (it accepts a SECONDARY mapping and a merely DESIGN_MAPPED control) while the attestation_view
          counts 0 (it demands a PRIMARY mapping to a control that is both DESIGN_APPROVED and
          TESTED_EFFECTIVE) — the dual-variant subject here is criteria coverage on the Engagement,
          a different entity domain from the sampling projection instance below.
        test_recipe:
          setup:
            - "One engagement 'Northwind' in status READINESS, report_type SOC_2_TYPE_2, required_criteria_categories [SECURITY, AVAILABILITY, CONFIDENTIALITY]."
            - "Catalog holds exactly five criteria in scope: CC1.1 and CC6.1 (SECURITY), A1.1 and A1.2 (AVAILABILITY), C1.1 (CONFIDENTIALITY); every one has min_primary_controls 1 and applies_to_report_types [SOC_2_TYPE_2]."
            - "Control K-01 is DESIGN_APPROVED with an ACTIVE PRIMARY mapping to CC1.1, operating_status NOT_TESTED."
            - "Control K-02 is DESIGN_MAPPED with an ACTIVE SECONDARY mapping to A1.1 and primary_mapping_count 0."
            - "A1.2, C1.1 and CC6.1 carry no mapping at all."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc11: $.data.id }
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC6.1", category: "SECURITY", title: "Logical access", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc61: $.data.id }
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "A1.1", category: "AVAILABILITY", title: "Capacity management", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { a11: $.data.id }
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "A1.2", category: "AVAILABILITY", title: "Backup and recovery", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { a12: $.data.id }
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "C1.1", category: "CONFIDENTIALITY", title: "Confidential data handling", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { c11: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Northwind", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY", "AVAILABILITY", "CONFIDENTIALITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /soc/system-descriptions"
              payload: { engagement_id: "${eng}", version_label: "v1", boundary_narrative: "Northwind hosts the ledger platform in two regions.", expected_engagement_version: "${eng_v}" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { sd: $.data.id }
            - call: "POST /soc/boundary-components"
              payload: { system_description_id: "${sd}", component_type: "SOFTWARE", name: "Core API" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "APPROVE" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/system-descriptions/${sd}/lock-boundary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "K-01", title: "Quarterly access review", frequency: "MONTHLY", automation: "MANUAL", risk_rating: "HIGH", population_size: 40 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { k01: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "K-02", title: "Capacity trending", frequency: "QUARTERLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 12 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { k02: $.data.id }
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${k01}", trust_criterion_id: "${cc11}", mapping_type: "PRIMARY", rationale: "Primary coverage of CC1.1" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { m1: $.data.id }
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${k02}", trust_criterion_id: "${a11}", mapping_type: "SECONDARY", rationale: "Supporting coverage of A1.1" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { m2: $.data.id }
            - call: "POST /soc/controls/${k01}/assign-owner"
              payload: { owner_user_id: "own-1" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/engagements/${eng}/transitions"
              payload: { action: "START_READINESS" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls/${k01}/transitions"
              payload: { action: "APPROVE_DESIGN" }
              as: Auditor
              as_user_id: "aud-1"
          trigger:
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
          assert:
            - "readiness-summary.criteria_in_scope_count == 5"
            - "readiness-summary.covered_criteria_count_readiness == 2"
            - "readiness-summary.covered_criteria_count_attestation == 0"
            - "readiness-summary.criteria_coverage_pct_readiness == 40.00"
            - "readiness-summary.criteria_coverage_pct_attestation == 0.00"
            - "Engagement.${eng}.covered_criteria_count_readiness == 2"
            - "Engagement.${eng}.covered_criteria_count_attestation == 0"
            - "Control.${k02}.primary_mapping_count == 0"
            - "Control.${k02}.active_mapping_count == 1"
            - "Control.${k02}.design_status == DESIGN_MAPPED"

      - name: exception_projection_deviation_rate_view_vs_upper_precision_view
        grounds:
          - calculations.exception_projection
          - entities.AuditSample.fields.projected_failures
          - entities.AuditException.fields.projected_failures_upper
          - entities.AuditException.fields.pervasive_recommended
          - state_machines.AuditSample.TESTING_to_CONCLUDED_EXCEPTIONS
        distinguishing_aspect: |
          On the same sample (sample_size 4, items_failed 1, population_size_snapshot 20, risk_rating
          MODERATE) the deviation_rate_view stamps AuditSample.projected_failures == 5.00 while the
          upper_precision_view stamps AuditException.projected_failures_upper == 6 — the dual-variant
          subject here is population projection in the sampling/exception domain, structurally distinct
          from the criteria-coverage instance above.
        test_recipe:
          setup:
            - "Engagement 'Northwind' (SOC_2_TYPE_2, categories [SECURITY]) is in status FIELDWORK with gap_posture OPEN and zero gaps."
            - "Control S-01 is QUARTERLY / MANUAL / MODERATE with population_size 20, DESIGN_APPROVED and operating_status IN_OBSERVATION."
            - "Its single EvidenceRequest is ACCEPTED, so sampling is unblocked."
            - "One AuditSample on S-01 has sample_size 4 and allowed_deviations 0, with three PASS items and one FAIL item recorded."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc11: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Northwind", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /soc/system-descriptions"
              payload: { engagement_id: "${eng}", version_label: "v1", boundary_narrative: "Ledger platform boundary.", expected_engagement_version: "${eng_v}" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { sd: $.data.id }
            - call: "POST /soc/boundary-components"
              payload: { system_description_id: "${sd}", component_type: "SOFTWARE", name: "Core API" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "APPROVE" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/system-descriptions/${sd}/lock-boundary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "S-01", title: "Change approvals", frequency: "QUARTERLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 20 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { s01: $.data.id }
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${s01}", trust_criterion_id: "${cc11}", mapping_type: "PRIMARY" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls/${s01}/assign-owner"
              payload: { owner_user_id: "own-1" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/evidence-requests"
              payload: { control_id: "${s01}", period_index: 0, period_start: "2026-09-01T00:00:00.000Z", period_end: "2026-11-30T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { er0: $.data.id }
            - call: "POST /soc/engagements/${eng}/transitions"
              payload: { action: "START_READINESS" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls/${s01}/transitions"
              payload: { action: "APPROVE_DESIGN" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/engagements/${eng}/readiness-assessment"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/engagements/${eng}/transitions"
              payload: { action: "START_OBSERVATION" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /soc/evidence-requests/${er0}/submit"
              payload: { artifact_ref: "art-1" }
              as: ControlOwner
              as_user_id: "own-1"
            - call: "POST /soc/evidence-requests/${er0}/review"
              payload: { action: "ACCEPT" }
              as: EvidenceReviewer
              as_user_id: "rev-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /soc/engagements/${eng}/transitions"
              payload: { action: "START_FIELDWORK" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "GET /soc/controls/${s01}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { s01_v: $.data.version }
            - call: "POST /soc/audit-samples"
              payload: { control_id: "${s01}", period_start: "2026-09-01T00:00:00.000Z", period_end: "2026-11-30T00:00:00.000Z", expected_control_version: "${s01_v}" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { smp: $.data.id }
            - call: "POST /soc/audit-samples/${smp}/items"
              payload: { outcome: "PASS" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/audit-samples/${smp}/items"
              payload: { outcome: "PASS" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/audit-samples/${smp}/items"
              payload: { outcome: "PASS" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/audit-samples/${smp}/items"
              payload: { outcome: "FAIL", failure_reason: "Approval ticket missing" }
              as: Auditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /soc/audit-samples/${smp}/conclude"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /soc/audit-exceptions"
              payload: { audit_sample_id: "${smp}" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { exc: "$.data[0].id" }
            - call: "POST /soc/audit-exceptions/${exc}/evaluate"
              payload: { disposition: "ISOLATED", evaluation_note: "Single missing ticket" }
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "AuditSample.${smp}.sample_size == 4"
            - "AuditSample.${smp}.allowed_deviations == 0"
            - "AuditSample.${smp}.items_failed == 1"
            - "AuditSample.${smp}.deviation_rate == 0.2500"
            - "AuditSample.${smp}.projected_failures == 5.00"
            - "AuditSample.${smp}.status == CONCLUDED_EXCEPTIONS"
            - "AuditException.${exc}.projected_failures_upper == 6"
            - "AuditException.${exc}.pervasive_recommended == true"
            - "AuditException.${exc}.disposition == ISOLATED"
            - "AuditException.${exc}.severity_assigned == MODERATE"

  - rule_id: combinatorial_formula
    instances:
      - name: sample_size_nested_min_max_with_automation_and_report_type_branches
        grounds:
          - calculations.sample_size_determination
          - entities.AuditSample.fields.sample_size
          - entities.AuditSample.fields.allowed_deviations
          - entities.Control.fields.automation
          - entities.Control.fields.risk_rating
          - entities.Engagement.fields.report_type
        distinguishing_aspect: |
          MODE (a): sample_size combines five inputs non-linearly — a frequency-keyed base, a
          max(1, ceil(base * 0.4)) automation reduction, a risk-keyed additive bump, a report_type
          conditional addendum, and a final min() against population_size — so control D-01 lands on
          13 while W-01 lands on 4 because its population caps a raw value of 7.
        test_recipe:
          setup:
            - "Engagement 'Contoso' is SOC_1_TYPE_2, categories [SECURITY], observation window 2026-09-01 to 2026-11-30, in status FIELDWORK with gap_posture OPEN."
            - "Control D-01 is DAILY / AUTOMATED / MODERATE with population_size 100; control W-01 is WEEKLY / AUTOMATED / LOW with population_size 4."
            - "Both controls are DESIGN_APPROVED, owned, IN_OBSERVATION, and each has exactly one ACCEPTED EvidenceRequest."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_1_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc11: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Contoso", report_type: "SOC_1_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /soc/system-descriptions"
