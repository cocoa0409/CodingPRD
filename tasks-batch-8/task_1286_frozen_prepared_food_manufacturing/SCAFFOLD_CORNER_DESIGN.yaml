  # ============================================================ validations
  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID fails priority 1 with ERR_UNAUTHENTICATED (401), before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /plant/recipes"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED; http 401"

      - name: role_forbidden_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "QATechnician calling POST /plant/recipes (a PlantManager-exclusive endpoint) fails with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /plant/recipes"
              payload: { name: "R-X", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: QATechnician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE; http 403"

      - name: shape_error_beats_existence_error
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An order create missing required units_planned AND referencing a nonexistent recipe_id surfaces ERR_INVALID_REQUEST (shape, priority 5), not ERR_NOT_FOUND (existence, priority 6)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "00000000-0000-0000-0000-000000000000", pack_format: "RETAIL" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http 400 (shape beats existence)"

      - name: cross_customer_scope_returns_403
        claim_type: cross_entity_validation
        grounds: ["validations[priority=4]", "errors[ERR_CROSS_CUSTOMER_ACCESS]"]
        distinguishing_aspect: "CoPackCustomer B reading customer A's order fails with ERR_CROSS_CUSTOMER_ACCESS even though the role is allowed on the endpoint."
        test_recipe:
          setup: ["customers A and B; one order belonging to A"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Scope", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/copack-customers"
              payload: { name: "Cust A", billing_method: "PER_CASE", case_rate_cents: 1500 }
              as: PlantManager
              captures: { cust_a: $.data.id }
            - call: "POST /plant/copack-customers"
              payload: { name: "Cust B", billing_method: "PER_CASE", case_rate_cents: 1500 }
              as: PlantManager
              captures: { cust_b: $.data.id }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000, copack_customer_id: "${cust_a}" }
              as: ProductionPlanner
              captures: { oa_id: $.data.id }
          trigger:
            - call: "GET /plant/production-orders/${oa_id}"
              payload: {}
              as: CoPackCustomer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
            - call: "GET /plant/production-orders/${oa_id}"
              payload: {}
              as: CoPackCustomer
              as_user_id: "${cust_a}"
              captures: { ok_id: $.data.id }
          assert:
            - "customer B reading A's order: ERR_CROSS_CUSTOMER_ACCESS, http 403"
            - "customer A reading own order: 200, id matches"

