            - call: "POST /supply/supply-disruptions/${dis_id}/substitution-requests"
              payload: { action: "REQUEST", facility_id: "${f2_id}", proposed_product_id: "${sp_id}", covered_quantity: 50 }
              as: FacilitySupplyDirector
