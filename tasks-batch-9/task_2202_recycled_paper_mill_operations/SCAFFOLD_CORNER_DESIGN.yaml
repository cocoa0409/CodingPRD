      - name: an_exceedance_posture_voids_land_application_manifests_and_returns_their_solids
        claim_type: cascading_side_effects
        grounds:
          - state_machines.EffluentPermit.COMPLIANT_to_EXCEEDANCE
          - calculations.effluent_rolling_compliance
          - calculations.solids_ledger_balance
          - entities.SludgeManifest.fields.status
        distinguishing_aspect: "One reading with flow 12000.00 m3 against a 9000.00 limit and BOD 600.00 against a 500.00 limit drives bod_ratio 1.2 > 1.00, so the permit jumps COMPLIANT -> EXCEEDANCE without resting in WATCH and the residuals cascade fires: the DRAFT LAND_APPLICATION manifest is VOIDED while a DRAFT LANDFILL manifest in the identical state is left alone (the conditional half). Hops 2 and 3 are asserted as NO-OPS on purpose: hop 1 only voids DRAFT manifests, and a DRAFT manifest's claimed rows are still PENDING with manifest_id null (the rows only flip on /sign), so no row can be un-manifested and unmanifested_dry_solids_tons cannot rise. The scaffold's hop-2/hop-3 wording is therefore vacuous, and this recipe pins the observable truth — 2.300 unmanifested before and after — rather than the narrative."
        test_recipe:
          setup: ["The spine (one PENDING 2.000-ton PULP_REJECT row) plus a second batch whose clean produces a 0.300-ton PULP_REJECT row; a DRAFT LAND_APPLICATION manifest over the 2.000-ton row and a DRAFT LANDFILL manifest over the 0.300-ton row, both prepared by env-b while the permit is COMPLIANT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
