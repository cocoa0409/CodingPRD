# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1513_forklift_fleet_sales_rental_service
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; chains replay from empty-DB.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: rental_billing_provisional_vs_final
        grounds:
          - calculations.rental_billing
          - entities.RentalContract.fields.provisional_estimate_cents
          - entities.RentalContract.fields.final_charge_cents
          - state_machines.RentalContract.ON_RENT_to_RETURNED
        distinguishing_aspect: |
          Dual variant on the RENTAL CONTRACT domain (billing): the same 10-day
          contract priced by the provisional variant (ceil weeks) yields 140000
          cents while the final variant (floor weeks + remainder days capped at
          one week) yields 115000 cents — same scheduled data, two valid
          algorithms, different results.
        test_recipe:
          setup:
            - "Customer with credit_limit_cents 10000000, discount_pct 0"
            - "RENTAL_FLEET LP unit with rates daily 15000 / weekly 70000 / monthly 210000, pm_interval 500, hour_meter 0"
            - "RESERVED contract 2026-08-01 -> 2026-08-11 (scheduled_days 10, WEEKLY tier), then checked out"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Acme Materials", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-DV1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-11", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
            - call: "POST /fleet/rental-contracts/${rc_id}/checkout"
              as: RentalCoordinator
          trigger:
            - call: "POST /fleet/rental-contracts/${rc_id}/return"
              payload: { return_date: "2026-08-11", return_hours: 40 }
              as: RentalCoordinator
          assert:
            - "RentalContract.${rc_id}.provisional_estimate_cents == 140000  (ceil(10/7)=2 weeks * 70000)"
            - "RentalContract.${rc_id}.final_charge_cents == 115000  (floor(10/7)=1 week 70000 + min(3*15000, 70000)=45000; overage 0)"
            - "RentalContract.${rc_id}.final_charge_cents != RentalContract.${rc_id}.provisional_estimate_cents"
            - "RentalContract.${rc_id}.rate_tier == WEEKLY"
            - "Customer.${c_id}.outstanding_balance_cents == 115000 and credit_holds_cents == 0"
            - "Unit.${u_id}.availability_status == AVAILABLE and maintenance_posture == PM_OK (40 < 500)"

      - name: fuel_cost_battery_vs_lp
        grounds:
          - calculations.fuel_event_cost
          - entities.FuelEvent.fields.cost_cents
          - entities.Unit.fields.fuel_program
        distinguishing_aspect: |
          Dual variant on the UNIT/FUEL-EVENT domain (energy cost) — a different
          entity domain from rental billing: BATTERY program prices per-kWh plus
          a swap fee (100 kWh CHARGE -> 1200 cents), LP program prices per
          cylinder plus a delivery fee (2 cylinders -> 10500 cents).
        test_recipe:
          setup:
            - "BATTERY unit (disposition NEW_SALE) and LP unit (disposition NEW_SALE)"
          setup_api_calls:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-BAT1", model: "8FBCU25", power_type: "BATTERY", disposition: "NEW_SALE", daily_rate_cents: 16000, weekly_rate_cents: 75000, monthly_rate_cents: 220000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { ub_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-LP1", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { ul_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/units/${ub_id}/fuel-events"
              payload: { event_type: "CHARGE", kwh: 100 }
              as: FleetManager
              captures: { fe_b_cost: "$.data.cost_cents" }
            - call: "POST /fleet/units/${ul_id}/fuel-events"
              payload: { event_type: "LP_REFILL", cylinders: 2 }
              as: FleetManager
              captures: { fe_l_cost: "$.data.cost_cents" }
          assert:
            - "FuelEvent(BATTERY CHARGE 100 kWh).cost_cents == 1200  (100 * 12)"
            - "FuelEvent(LP LP_REFILL 2 cyl).cost_cents == 10500  (2 * 4500 + 1500)"
            - "fuel program variants diverge: ${fe_b_cost} != ${fe_l_cost}"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: rental_tiered_monthly_discount
        grounds:
          - calculations.rental_billing
          - entities.RentalContract.fields.rate_tier
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — scheduled_days picks
          a tier band (>= 28 inclusive -> MONTHLY), the tier amount is ceiled to
          whole 28-day months, scaled by (1 - discount_pct), then floored by
          max(..., daily_rate_cents). Customer discount 10% over 40 days:
          ceil(40/28)=2 * 210000 * 0.9 = 378000.
        test_recipe:
          setup:
            - "Customer with discount_pct 0.10 and credit_limit_cents 10000000"
            - "RENTAL_FLEET unit rates 15000/70000/210000"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Discounter Co", credit_limit_cents: 10000000, discount_pct: 0.10 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-CF1", model: "8FGCU30", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-09-10", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
          assert:
            - "RentalContract.${rc_id}.scheduled_days == 40"
            - "RentalContract.${rc_id}.rate_tier == MONTHLY  (40 >= 28)"
            - "RentalContract.${rc_id}.provisional_estimate_cents == 378000  (2*210000=420000 * 0.9 = 378000; max with 15000 not binding)"
            - "Customer.${c_id}.credit_holds_cents == 378000"

      - name: quote_discount_rounding_order
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.discount_cents
          - entities.QuoteLine.fields.extended_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          discount = round_half_up(subtotal * tier_pct) computed ONCE on the
          subtotal. Lines 99980/10/10 cents cross the 100000-cent tier: pinned
          order gives discount 5000; per-line discount rounding then summing
          would give 5001 (0.5 rounds up per line). Asserted value is the
          subtotal-level order.
        test_recipe:
          setup:
            - "Customer with discount_pct 0 (customer discount does not apply to quotes; quote tiers are subtotal-driven)"
            - "DRAFT NEW_CONFIG quote with three lines: 1 x 99980, 1 x 10, 1 x 10"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Quote Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "NEW_CONFIG", valid_until: "2026-09-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Base truck configuration", qty: 1, unit_price_cents: 99980 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Sideshifter", qty: 1, unit_price_cents: 10 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Fork extension pair", qty: 1, unit_price_cents: 10 }
              as: SalesRep
          trigger:
            - call: "GET /fleet/quotes/${q_id}"
              as: SalesRep
          assert:
            - "Quote.${q_id}.subtotal_cents == 100000"
            - "Quote.${q_id}.discount_cents == 5000  (round_half_up(100000*0.05); per-line order would give 5001)"
            - "Quote.${q_id}.tax_cents == 7600  (round_half_up(95000*0.08))"
            - "Quote.${q_id}.total_cents == 102600"

      - name: lease_settlement_prediscount_tier
        grounds:
          - calculations.lease_settlement
          - entities.LeaseContract.fields.settlement_total_cents
          - entities.LeaseInspection.fields.wear_charge_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          the loyalty tier is keyed on the PRE-discount total (520000 -> 10%),
          even though the discounted result 468000 falls below the 500000
          threshold. Post-discount tiering would wrongly yield 494000 (5%).
        test_recipe:
          setup:
            - "Customer credit_limit 10000000; NEW_SALE unit"
            - "Lease: allowed_hours 1000, excess_hour_rate 500, residual 800000; returned"
            - "Approved inspection: grade B (wear 150000), hours 1200 (overage 200*500=100000), appraised 530000 (shortfall 270000) -> pre-discount 520000"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Lease Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-LS1", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2025-08-01", end_date: "2026-08-01", allowed_hours: 1000, excess_hour_rate_cents: 500, residual_value_cents: 800000 }
              as: LeaseManager
              captures: { l_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts/${l_id}/return"
              payload: { return_date: "2026-08-01" }
              as: LeaseManager
            - call: "POST /fleet/lease-contracts/${l_id}/inspections"
              payload: { condition_grade: "B", hours_at_return: 1200, appraised_value_cents: 530000 }
              as: LeaseManager
              captures: { i_id: "$.data.id" }
            - call: "POST /fleet/inspections/${i_id}/approve"
              as: LeaseManager
          trigger:
            - call: "POST /fleet/lease-contracts/${l_id}/settle"
              as: LeaseManager
          assert:
            - "LeaseInspection.${i_id}.wear_charge_cents == 150000  (grade B)"
            - "LeaseContract.${l_id}.settlement_total_cents == 468000  (pre 520000, tier 10%: round(520000*0.9))"
            - "LeaseContract.${l_id}.status == SETTLED"
            - "Customer.${c_id}.outstanding_balance_cents == 468000"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_submit_revise_cycle
        grounds:
          - state_machines.Quote.SUBMITTED_to_DRAFT
          - state_machines.Quote.DRAFT_to_SUBMITTED
          - entities.Quote.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on the QUOTE entity: SUBMITTED -> DRAFT -> SUBMITTED ->
          ACCEPTED with revision_count accumulating; a linear pipeline could not
          re-enter DRAFT.
        test_recipe:
          setup:
            - "Customer with an operator holding an ACTIVE certification (expiry 2027-01-01)"
            - "Quote with one line 1 x 100000; submitted once, revised once, resubmitted"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Cycle Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/operators"
              payload: { customer_id: "${c_id}", full_name: "Op One", badge_number: "B-1" }
              as: TrainingRegistrar
              captures: { op_id: "$.data.id" }
            - call: "POST /fleet/operators/${op_id}/certifications"
              payload: { cert_class: "SIT_DOWN", expires_at: "2027-01-01T00:00:00Z" }
              as: TrainingRegistrar
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "NEW_CONFIG", valid_until: "2026-09-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Reach truck", qty: 1, unit_price_cents: 100000 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/revise"
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
          trigger:
            - call: "POST /fleet/quotes/${q_id}/accept"
              as: SalesRep
          assert:
            - "Quote.${q_id}.revision_count == 1"
            - "Quote.${q_id}.status == ACCEPTED"
            - "Quote.${q_id}.total_cents == 102600  (subtotal 100000, discount 5000, tax 7600)"
            - "Customer.${c_id}.outstanding_balance_cents == 102600"

      - name: unit_parallel_availability_posture
        grounds:
          - state_machines.Unit
          - entities.Unit.fields.availability_status
          - entities.Unit.fields.maintenance_posture
        distinguishing_aspect: |
          Parallel state dimensions on the UNIT entity: availability_status
          (ON_RENT) and maintenance_posture (PM_DUE) evolve independently — a
          meter reading taken while the unit is out on rent flips posture without
          touching availability.
        test_recipe:
          setup:
            - "Customer; RENTAL_FLEET unit pm_interval 500; contract checked out (unit ON_RENT, PM_OK, hour_meter 0)"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Parallel Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-PL1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-20", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
            - call: "POST /fleet/rental-contracts/${rc_id}/checkout"
              as: RentalCoordinator
          trigger:
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 500, note: "telematics push while on rent" }
              as: FleetManager
          assert:
            - "Unit.${u_id}.availability_status == ON_RENT  (availability dimension untouched)"
            - "Unit.${u_id}.maintenance_posture == PM_DUE  (500 >= 500; posture dimension flipped)"
            - "Unit.${u_id}.hour_meter == 500"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: rental_return_pm_cascade
        grounds:
          - state_machines.RentalContract.ON_RENT_to_RETURNED
          - state_machines.Unit
          - calculations.pm_due_evaluation
          - entities.ServiceCall.fields.auto_created
        distinguishing_aspect: |
          Depth-3 cascade originating at RENTAL RETURN: return sets
          unit.hour_meter (link 1) -> hour_meter >= next_pm_due_hours flips
          maintenance_posture to PM_DUE (link 2) -> PM_DUE auto-creates an OPEN
          PM ServiceCall with auto_created true (link 3); availability lands on
          IN_SHOP.
        test_recipe:
          setup:
            - "Customer; RENTAL_FLEET unit pm_interval 500 (next_pm_due 500), hour_meter 0"
            - "Contract 2026-08-01 -> 2026-08-05 (4 days DAILY, provisional 60000), checked out"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Cascade Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-TC1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-05", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
            - call: "POST /fleet/rental-contracts/${rc_id}/checkout"
              as: RentalCoordinator
          trigger:
            - call: "POST /fleet/rental-contracts/${rc_id}/return"
              payload: { return_date: "2026-08-05", return_hours: 500 }
              as: RentalCoordinator
            - call: "GET /fleet/service-calls"
              payload: { unit_id: "${u_id}" }
              as: ServiceDispatcher
              captures: { sc_id: "$.data[0].id", sc_type: "$.data[0].call_type", sc_status: "$.data[0].status", sc_auto: "$.data[0].auto_created" }
          assert:
            - "Unit.${u_id}.hour_meter == 500  (link 1)"
            - "Unit.${u_id}.maintenance_posture == PM_DUE  (link 2: 500 >= 500)"
            - "Unit.${u_id}.availability_status == IN_SHOP"
            - "cascade-created ServiceCall ${sc_id}: call_type == PM, status == OPEN, auto_created == true  (link 3)"
            - "RentalContract.${rc_id}.final_charge_cents == 60000"

      - name: lease_settle_credit_hold_cascade
        grounds:
          - state_machines.LeaseContract.RETURNED_to_SETTLED
          - entities.Customer.fields.account_status
          - state_machines.RentalContract.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade originating at LEASE SETTLE (a different trigger than
          rental return): settle posts settlement to customer balance (link 1) ->
          balance 468000 > credit_limit 400000 flips account_status to
          CREDIT_HOLD (link 2) -> the flip auto-cancels the customer's RESERVED
          rental contract and releases its hold (link 3).
        test_recipe:
          setup:
            - "Customer credit_limit_cents 400000, discount 0"
            - "RESERVED rental contract on a RENTAL_FLEET unit: 3 days, provisional hold 45000"
            - "RETURNED lease on a NEW_SALE unit with approved inspection settling at 468000"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Leverage Co", credit_limit_cents: 400000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-TC2R", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { ur_id: "$.data.id", ur_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${ur_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-04", expected_unit_version: "${ur_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-TC2L", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { ul_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts"
              payload: { unit_id: "${ul_id}", customer_id: "${c_id}", start_date: "2025-08-01", end_date: "2026-08-01", allowed_hours: 1000, excess_hour_rate_cents: 500, residual_value_cents: 800000 }
              as: LeaseManager
              captures: { l_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts/${l_id}/return"
              payload: { return_date: "2026-08-01" }
              as: LeaseManager
            - call: "POST /fleet/lease-contracts/${l_id}/inspections"
              payload: { condition_grade: "B", hours_at_return: 1200, appraised_value_cents: 530000 }
              as: LeaseManager
              captures: { i_id: "$.data.id" }
            - call: "POST /fleet/inspections/${i_id}/approve"
              as: LeaseManager
          trigger:
            - call: "POST /fleet/lease-contracts/${l_id}/settle"
              as: LeaseManager
          assert:
            - "Customer.${c_id}.outstanding_balance_cents == 468000  (link 1)"
            - "Customer.${c_id}.account_status == CREDIT_HOLD  (link 2: 468000 > 400000)"
            - "Customer.${c_id}.credit_holds_cents == 0  (link 3: hold released)"
            - "RentalContract.${rc_id}.status == CANCELLED  (link 3: RESERVED auto-cancelled)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkout_cancelled_vs_credit_hold
        grounds:
          - validations[priority=5]
          - validations[priority=20]
          - state_machines.RentalContract.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Error-category pair STATE vs BUSINESS_FISCAL: the contract is
          CANCELLED (state violation) AND the customer is on CREDIT_HOLD (fiscal
          violation); state (priority 5) must win over fiscal (priority 20), so
          checkout returns ERR_INVALID_STATE, not ERR_ACCOUNT_CREDIT_HOLD.
        test_recipe:
          setup:
            - "Customer credit_limit 100000"
            - "Rental contract (3 days, provisional 45000) created then CANCELLED"
            - "Separate lease settled at 468000 -> customer flips to CREDIT_HOLD"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Conflict Co", credit_limit_cents: 100000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-PP1R", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { ur_id: "$.data.id", ur_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${ur_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-04", expected_unit_version: "${ur_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
            - call: "POST /fleet/rental-contracts/${rc_id}/cancel"
              as: RentalCoordinator
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-PP1L", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { ul_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts"
              payload: { unit_id: "${ul_id}", customer_id: "${c_id}", start_date: "2025-08-01", end_date: "2026-08-01", allowed_hours: 1000, excess_hour_rate_cents: 500, residual_value_cents: 800000 }
              as: LeaseManager
              captures: { l_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts/${l_id}/return"
              payload: { return_date: "2026-08-01" }
              as: LeaseManager
            - call: "POST /fleet/lease-contracts/${l_id}/inspections"
              payload: { condition_grade: "B", hours_at_return: 1200, appraised_value_cents: 530000 }
              as: LeaseManager
              captures: { i_id: "$.data.id" }
            - call: "POST /fleet/inspections/${i_id}/approve"
              as: LeaseManager
            - call: "POST /fleet/lease-contracts/${l_id}/settle"
              as: LeaseManager
          trigger:
            - call: "POST /fleet/rental-contracts/${rc_id}/checkout"
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE  (state priority 5 beats fiscal priority 20)"
            - "error_id != ERR_ACCOUNT_CREDIT_HOLD despite customer.account_status == CREDIT_HOLD"
            - "Customer.${c_id}.account_status == CREDIT_HOLD"
            - "RentalContract.${rc_id}.status == CANCELLED"

      - name: dispatch_cert_expired_vs_window_overlap
        grounds:
          - validations[priority=10]
          - validations[priority=18]
          - state_machines.Certification.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Error-category pair BUSINESS_SAFETY vs BUSINESS_TEMPORAL (different
          from state-vs-fiscal): the named operator's certification is EXPIRED
          (safety) AND the technician's buffered window overlaps (temporal);
          safety (priority 10) must win over temporal (priority 18).
        test_recipe:
          setup:
            - "Customer with operator whose certification expired after clock advanced to 2026-10-01"
            - "Technician already DISPATCHED on another call 2026-10-05T10:00:00Z-11:00:00Z (buffered closed interval [09:00, 12:00])"
            - "Second OPEN service call naming the expired-cert operator"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Safety Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-PP2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/operators"
              payload: { customer_id: "${c_id}", full_name: "Op Exp", badge_number: "B-9" }
              as: TrainingRegistrar
              captures: { op_id: "$.data.id" }
            - call: "POST /fleet/operators/${op_id}/certifications"
              payload: { cert_class: "SIT_DOWN", expires_at: "2026-09-01T00:00:00Z" }
              as: TrainingRegistrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: FleetManager
            - call: "POST /fleet/technicians"
              payload: { full_name: "Tech A", home_branch: "BR1", van_stock: [ { part_number: "P-100", qty: 5 } ] }
              as: ServiceDispatcher
              captures: { t_id: "$.data.id" }
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "STANDARD", required_parts: [] }
              as: ServiceDispatcher
              captures: { sc1_id: "$.data.id" }
            - call: "POST /fleet/service-calls/${sc1_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-10-05T10:00:00Z", scheduled_end: "2026-10-05T11:00:00Z" }
              as: ServiceDispatcher
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "STANDARD", operator_id: "${op_id}", required_parts: [] }
              as: ServiceDispatcher
              captures: { sc2_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/service-calls/${sc2_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-10-05T11:30:00Z", scheduled_end: "2026-10-05T12:30:00Z" }
              as: ServiceDispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_OPERATOR_CERT_EXPIRED  (safety priority 10 beats temporal priority 18)"
            - "error_id != ERR_DISPATCH_WINDOW_OVERLAP despite buffered windows intersecting"
            - "ServiceCall.${sc2_id}.status == OPEN"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: pm_due_at_exact_interval
        grounds:
          - calculations.pm_due_evaluation
          - entities.Unit.fields.next_pm_due_hours
        distinguishing_aspect: |
          Numeric hour-meter threshold: PM is due iff hour_meter >=
          next_pm_due_hours — 499 leaves PM_OK, exactly 500 flips PM_DUE
          (inclusive >=). Metric: hour meter. Endpoint: POST
          /fleet/units/{id}/meter-readings.
        test_recipe:
          setup:
            - "Unit pm_interval_hours 500, hour_meter 0, next_pm_due_hours 500"
          setup_api_calls:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-BP1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 499 }
              as: FleetManager
          trigger:
            - call: "GET /fleet/units/${u_id}"
              as: FleetManager
              captures: { posture_499: "$.data.maintenance_posture" }
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 500 }
              as: FleetManager
            - call: "GET /fleet/units/${u_id}"
              as: FleetManager
              captures: { posture_500: "$.data.maintenance_posture" }
          assert:
            - "posture at 499 hours == PM_OK  (strictly below threshold)"
            - "posture at exactly 500 hours == PM_DUE  (>= boundary is inclusive)"
            - "Unit.${u_id}.next_pm_due_hours == 500  (unchanged until PM service completes)"

      - name: quote_submit_zero_lines
        grounds:
          - validations[priority=13]
          - state_machines.Quote.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Empty-collection boundary on line count (a different metric from the
          hour-meter threshold, reached through a different endpoint): a quote
          with 0 lines cannot submit (ERR_QUOTE_EMPTY); adding the first line
          makes the identical call succeed.
        test_recipe:
          setup:
            - "Customer; DRAFT quote with no lines"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Empty Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "NEW_CONFIG", valid_until: "2026-09-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
              captures: { err: "$.data.error_id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "One attachment", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
          assert:
            - "submit with 0 lines returns ERR_QUOTE_EMPTY (422)"
            - "after adding 1 line, submit succeeds and Quote.${q_id}.status == SUBMITTED"
            - "Quote.${q_id}.subtotal_cents == 5000"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkout_requires_unit_available
        grounds:
          - validations[priority=6]
          - state_machines.RentalContract.RESERVED_to_ON_RENT
          - state_machines.Unit
        distinguishing_aspect: |
          Entity pair RentalContract -> Unit: checkout of contract B is rejected
          because a DIFFERENT contract's checkout already moved the unit to
          ON_RENT — the valid transition set of the contract depends on the
          unit's availability state.
        test_recipe:
          setup:
            - "Customer credit 10000000; RENTAL_FLEET unit"
            - "Contract A 2026-08-01 -> 2026-08-05 checked out (unit ON_RENT)"
            - "Contract B 2026-08-06 -> 2026-08-10 RESERVED (created while unit ON_RENT, which rental create permits)"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Dep Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-CE1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-05", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_a: "$.data.id" }
            - call: "POST /fleet/rental-contracts/${rc_a}/checkout"
              as: RentalCoordinator
            - call: "GET /fleet/units/${u_id}"
              as: RentalCoordinator
              captures: { u_v2: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-06", end_date: "2026-08-10", expected_unit_version: "${u_v2}" }
              as: RentalCoordinator
              captures: { rc_b: "$.data.id" }
          trigger:
            - call: "POST /fleet/rental-contracts/${rc_b}/checkout"
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNIT_NOT_AVAILABLE  (unit is ON_RENT, not AVAILABLE)"
            - "RentalContract.${rc_b}.status == RESERVED  (unchanged)"
            - "RentalContract.${rc_a}.status == ON_RENT"

      - name: dispatch_requires_active_technician
        grounds:
          - validations[priority=12]
          - state_machines.Technician.ACTIVE_to_INACTIVE
          - state_machines.ServiceCall.OPEN_to_DISPATCHED
        distinguishing_aspect: |
          Entity pair ServiceCall -> Technician (different pair than
          RentalContract -> Unit): dispatch is gated on the technician's
          lifecycle state; deactivating the technician between call creation and
          dispatch makes the dispatch invalid.
        test_recipe:
          setup:
            - "Customer; unit; OPEN service call; technician created ACTIVE then deactivated"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Tech Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-CE2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "Tech Idle", home_branch: "BR1", van_stock: [] }
              as: ServiceDispatcher
              captures: { t_id: "$.data.id" }
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "EMERGENCY", required_parts: [] }
              as: ServiceDispatcher
              captures: { sc_id: "$.data.id" }
            - call: "POST /fleet/technicians/${t_id}/deactivate"
              as: ServiceDispatcher
          trigger:
            - call: "POST /fleet/service-calls/${sc_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ServiceDispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_TECHNICIAN_INACTIVE"
            - "ServiceCall.${sc_id}.status == OPEN"
            - "Technician.${t_id}.status == INACTIVE"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_window_halfopen_adjacency
        grounds:
          - validations[priority=17]
          - entities.RentalContract.fields.start_date
        distinguishing_aspect: |
          Unit resource with HALF-OPEN day intervals [start_date, end_date):
          back-to-back rentals (start == prior end) are allowed, while a window
          crossing an existing contract's interior is rejected. Adjacency is
          permitted — no buffer.
        test_recipe:
          setup:
            - "Customer credit 10000000; RENTAL_FLEET unit; contract C1 RESERVED 2026-08-01 -> 2026-08-10"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Window Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-TO1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-10", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc1_id: "$.data.id" }
            - call: "GET /fleet/units/${u_id}"
              as: RentalCoordinator
              captures: { u_v2: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-10", end_date: "2026-08-20", expected_unit_version: "${u_v2}" }
              as: RentalCoordinator
              captures: { rc2_id: "$.data.id" }
            - call: "GET /fleet/units/${u_id}"
              as: RentalCoordinator
              captures: { u_v3: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-15", end_date: "2026-08-25", expected_unit_version: "${u_v3}" }
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "adjacent contract (start 08-10 == C1 end 08-10) is created: RentalContract.${rc2_id}.status == RESERVED"
            - "overlapping contract (08-15 interior to C2 window) returns ERR_RENTAL_WINDOW_OVERLAP (409)"

      - name: dispatch_window_buffered
        grounds:
          - validations[priority=18]
          - entities.ServiceCall.fields.scheduled_start
        distinguishing_aspect: |
          Technician resource with CLOSED intervals expanded by a 60-minute
          buffer on both sides — different interval semantics from the half-open
          unbuffered rental window: a dispatch starting exactly 60 minutes after
          the prior window's end still conflicts (closed buffered endpoints
          touch), while > 120 minutes of clearance succeeds.
        test_recipe:
          setup:
            - "Customer; unit; technician; call C1 DISPATCHED 2026-08-02T10:00-11:00Z (buffered closed interval [09:00, 12:00])"
            - "Second OPEN call C2"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Dispatch Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-TO2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "Tech Buf", home_branch: "BR1", van_stock: [] }
              as: ServiceDispatcher
              captures: { t_id: "$.data.id" }
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "STANDARD", required_parts: [] }
              as: ServiceDispatcher
              captures: { sc1_id: "$.data.id" }
            - call: "POST /fleet/service-calls/${sc1_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ServiceDispatcher
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "PM", priority: "STANDARD", required_parts: [] }
              as: ServiceDispatcher
              captures: { sc2_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/service-calls/${sc2_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-08-02T12:00:00Z", scheduled_end: "2026-08-02T13:00:00Z" }
              as: ServiceDispatcher
              captures: { err: "$.data.error_id" }
            - call: "POST /fleet/service-calls/${sc2_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-08-02T13:01:00Z", scheduled_end: "2026-08-02T14:00:00Z" }
              as: ServiceDispatcher
          assert:
            - "dispatch at 12:00 returns ERR_DISPATCH_WINDOW_OVERLAP  (C1 buffered interval [09:00,12:00] closed — touches C2 buffered start 11:00...12:00 overlap)"
            - "dispatch at 13:01 succeeds: ServiceCall.${sc2_id}.status == DISPATCHED  (C2 buffered [12:01,15:00] disjoint from [09:00,12:00])"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: rental_hold_cancel_credit_invariant
        grounds:
          - entities.Customer.fields.available_credit_cents
          - state_machines.RentalContract.RESERVED_to_CANCELLED
          - calculations.rental_billing
        distinguishing_aspect: |
          Conserved quantity: CUSTOMER CREDIT — invariant
          credit_limit_cents == outstanding_balance_cents + credit_holds_cents
          + available_credit_cents holds after every step; reserve (hold +140000)
          followed by its compensating cancel (hold -140000) returns
          available_credit_cents exactly to its pre-reserve value 10000000.
        test_recipe:
          setup:
            - "Customer credit_limit 10000000, discount 0; RENTAL_FLEET unit rates 15000/70000/210000"
            - "10-day contract RESERVED (hold 140000), then CANCELLED"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Invariant Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-CI1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-11", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
            - call: "GET /fleet/customers/${c_id}"
              as: RentalCoordinator
              captures: { avail_held: "$.data.available_credit_cents", holds_held: "$.data.credit_holds_cents" }
          trigger:
            - call: "POST /fleet/rental-contracts/${rc_id}/cancel"
              as: RentalCoordinator
            - call: "GET /fleet/customers/${c_id}"
              as: RentalCoordinator
              captures: { avail_after: "$.data.available_credit_cents", holds_after: "$.data.credit_holds_cents", bal_after: "$.data.outstanding_balance_cents" }
          assert:
            - "after reserve: holds_held == 140000 and avail_held == 9860000"
            - "invariant under hold: 10000000 == 0 + 140000 + 9860000"
            - "after cancel: holds_after == 0 and bal_after == 0 and avail_after == 10000000  (exact restoration, no drift)"
            - "invariant after compensate: 10000000 == 0 + 0 + 10000000"

      - name: dispatch_release_van_stock_invariant
        grounds:
          - entities.Technician.fields.van_stock
          - state_machines.ServiceCall.OPEN_to_DISPATCHED
          - state_machines.ServiceCall.DISPATCHED_to_OPEN
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL PART COUNT on the van (a different
          quantity from customer credit) — dispatch of a call requiring 2 x
          P-100 decrements the van entry 5 -> 3, and the compensating release
          restores exactly 5; no part is created or destroyed by the
          dispatch/release pair.
        test_recipe:
          setup:
            - "Customer; unit; technician with van_stock [{P-100, 5}]"
            - "Service call requiring [{P-100, 2}], dispatched"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Parts Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-CI2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "Tech Van", home_branch: "BR1", van_stock: [ { part_number: "P-100", qty: 5 } ] }
              as: ServiceDispatcher
              captures: { t_id: "$.data.id" }
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "STANDARD", required_parts: [ { part_number: "P-100", qty: 2 } ] }
              as: ServiceDispatcher
              captures: { sc_id: "$.data.id" }
            - call: "POST /fleet/service-calls/${sc_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ServiceDispatcher
            - call: "GET /fleet/technicians/${t_id}"
              as: ServiceDispatcher
              captures: { stock_held: "$.data.van_stock" }
          trigger:
            - call: "POST /fleet/service-calls/${sc_id}/release"
              as: ServiceDispatcher
            - call: "GET /fleet/technicians/${t_id}"
              as: ServiceDispatcher
              captures: { stock_after: "$.data.van_stock" }
          assert:
