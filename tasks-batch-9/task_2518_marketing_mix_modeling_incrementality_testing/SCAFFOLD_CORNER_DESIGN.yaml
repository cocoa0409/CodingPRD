              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
            - call: "GET /mmm/data-windows/${w1}"
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v0: "$.data.version" }
          trigger:
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-31T00:00:00Z", units_sold: 5000, revenue_cents: 25000000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-05T00:00:00Z", units_sold: 5000, revenue_cents: 25000000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${cha}", period_start_date: "2026-07-27T00:00:00Z", spend_cents: 400000, impressions: 4000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v0}" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${cha}", period_start_date: "2026-08-24T00:00:00Z", spend_cents: 500000, impressions: 5000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v0}" }
              as: DataEngineer
