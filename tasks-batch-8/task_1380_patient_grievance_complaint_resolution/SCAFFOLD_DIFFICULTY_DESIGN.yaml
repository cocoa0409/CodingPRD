# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x >= 2 instances = 24 instances.
# Every chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
# Logical clock default at server startup: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: case_timeline_calendar_vs_business_variants
        grounds:
          - calculations.regulatory_due_dates
          - entities.PatientCase.fields.response_due_calendar_at
          - entities.PatientCase.fields.response_due_business_at
        distinguishing_aspect: |
          Same received_at on a PatientCase yields two valid dues: the binding CALENDAR variant
          (2026-09-06T16:00:00Z) and the BUSINESS variant (2026-09-21T16:00:00Z) skipping the
          weekend lattice plus the 2026-08-17 holiday — different results from identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-08-07T18:00:00Z; holiday 2026-08-17 (Monday) registered; unit ICU North"
            - "Grievance (STANDARD severity) received Friday 2026-08-07T16:00:00Z, classified GRIEVANCE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T18:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/holiday-observances", payload: { observance_date: "2026-08-17", name: "Founders Day" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ICU North", category: "ICU" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-1001", unit_id: "${u1}", received_at: "2026-08-07T16:00:00Z", channel: "PHONE", description: "Medication delay during night shift", grievance_category: "CARE_QUALITY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /api/patient-cases/${c1}/timeline", as: IntakeCoordinator, captures: { cal_due: $.data.response_due_calendar_at, bus_due: $.data.response_due_business_at, ack_due: $.data.ack_due_at } }
          assert:
            - "cal_due == '2026-09-06T16:00:00Z' (received + 30 calendar days)"
            - "bus_due == '2026-09-21T16:00:00Z' (30 business days skipping Sat/Sun + 2026-08-17)"
            - "ack_due == '2026-08-14T16:00:00Z' (7 calendar days, grievance only)"
            - "cal_due != bus_due — dual variants diverge on identical inputs"

      - name: unit_breach_rate_headcount_vs_exposure_variants
        grounds:
          - calculations.unit_breach_rate
          - entities.TrendSnapshot.fields.headcount_rate_bp
          - entities.TrendSnapshot.fields.exposure_weighted_rate_bp
        distinguishing_aspect: |
          Trend domain (HospitalUnit cell, different entity domain than the case timeline instance):
          headcount rate 5000 bp vs exposure-weighted rate 1000 bp for the same two closures —
          the variants disagree because one ignores and the other weights the 6 late days.
        test_recipe:
          setup:
            - "Unit Med-Surg 4; investigator inv (INVESTIGATOR); director dir (DIRECTOR)"
            - "Case A: grievance received 2026-08-10T10:00:00Z (due 2026-09-09T10:00:00Z), letter issued 2026-09-05T10:00:00Z -> ON_TIME"
            - "Case B: grievance received 2026-08-10T10:00:00Z (due 2026-09-09T10:00:00Z), letter issued 2026-09-15T10:00:00Z -> LATE by 6 days"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Med-Surg 4", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-2001", unit_id: "${u1}", received_at: "2026-08-10T10:00:00Z", channel: "EMAIL", description: "Case A discharge instructions missing", grievance_category: "CARE_QUALITY" }, as: IntakeCoordinator, captures: { ca: $.data.id, cav: $.data.version } }
            - { call: "POST /api/patient-cases/${ca}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${cav}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${ca}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cav2: $.data.version } }
            - { call: "POST /api/patient-cases/${ca}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${cav2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${ca}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iva: $.data.id } }
            - { call: "POST /api/investigations/${iva}/notes", payload: { note_type: "INTERVIEW", body: "Interviewed night nurse" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iva}/notes", payload: { note_type: "DOCUMENT_REVIEW", body: "Reviewed MAR records" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iva}/submit-findings", payload: { care_concern_flag: false, findings_summary: "Delay confirmed, no harm" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iva}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${ca}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Letter A: apology and corrective plan documented" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { la: $.data.id } }
            - { call: "POST /api/response-letters/${la}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/response-letters/${la}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/response-letters/${la}/issue", payload: {}, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-2002", unit_id: "${u1}", received_at: "2026-08-10T10:00:00Z", channel: "PORTAL", description: "Case B rude staff interaction", grievance_category: "CARE_QUALITY" }, as: IntakeCoordinator, captures: { cb: $.data.id, cbv: $.data.version } }
            - { call: "POST /api/patient-cases/${cb}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${cbv}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${cb}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cbv2: $.data.version } }
            - { call: "POST /api/patient-cases/${cb}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${cbv2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${cb}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { ivb: $.data.id } }
            - { call: "POST /api/investigations/${ivb}/notes", payload: { note_type: "INTERVIEW", body: "Interviewed patient" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${ivb}/notes", payload: { note_type: "SITE_VISIT", body: "Unit walk-through" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${ivb}/submit-findings", payload: { care_concern_flag: false, findings_summary: "Conduct substantiated, coaching issued" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${ivb}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${cb}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Letter B: findings and remediation documented" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { lb: $.data.id } }
            - { call: "POST /api/response-letters/${lb}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/response-letters/${lb}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/response-letters/${lb}/issue", payload: {}, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/trend-snapshots/compute", payload: { period: "2026-09" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cells: $.data.cells_created, sys_bp: $.data.system_rate_bp } }
            - { call: "GET /api/trend-snapshots?unit_id=${u1}&period=2026-09", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { hc: "$.data[0].headcount_rate_bp", ew: "$.data[0].exposure_weighted_rate_bp", gc: "$.data[0].grievances_closed", br: "$.data[0].breaches" } }
          assert:
            - "gc == 2 and br == 1 (only case B LATE)"
            - "hc == 5000 (round_half_up(1*10000/2))"
            - "ew == 1000 (round_half_up(6*10000/60); window_days 30+30, late days 6)"
            - "hc != ew — dual variants diverge on identical closures"
            - "cells == 1 and sys_bp == 5000 (single populated cell)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_multi_input_clamped_at_cap
        grounds:
          - calculations.case_priority_score
          - entities.PatientCase.fields.priority_score
        distinguishing_aspect: |
          Mode (a): 4-input non-linear formula (severity base 50 + vulnerability 15 +
          urgency min(40,(10-3)*4)=28 + reopen 10 = 103) with nested min/max — the clamp at
          CAP 100 engages, yielding exactly 100.
        test_recipe:
          setup:
            - "CRITICAL grievance with vulnerable_patient_flag=true, received 2026-08-01T00:00:00Z, fully closed 2026-08-02, reopened 2026-08-03 (reopen_count=1)"
            - "Read at 2026-08-15T00:00:00Z; re-anchored due 2026-08-18T00:00:00Z -> days_remaining=3"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ICU East", category: "ICU" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Quinn Risk", capabilities: ["QRO"] }, as: SystemAdmin, captures: { qro: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-3001", unit_id: "${u1}", received_at: "2026-08-01T00:00:00Z", channel: "IN_PERSON", description: "Critical rights concern", grievance_category: "RIGHTS_ABUSE", severity_tier: "CRITICAL", vulnerable_patient_flag: true }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "INTERVIEW", body: "Patient interview" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "SITE_VISIT", body: "Ward visit" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/submit-findings", payload: { care_concern_flag: false, findings_summary: "Findings documented" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO", "RISK_DISCLOSURE", "QAPI_REFERENCE"], body_summary: "Full response letter with all sections" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { l1: $.data.id } }
            - { call: "POST /api/response-letters/${l1}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/response-letters/${l1}/approve", payload: {}, as: QualityRiskOfficer, as_user_id: "${qro}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/response-letters/${l1}/issue", payload: {}, as: IntakeCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/patient-cases/${c1}/reopen", payload: { reopen_reason: "Patient disputed findings" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /api/patient-cases/${c1}/timeline", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { score: $.data.priority_score, due: $.data.response_due_calendar_at, rem: $.data.days_remaining } }
          assert:
            - "score == 100 (raw sum 103 clamped by CAP; proves clamp branch, not identity)"
            - "rem == 3 and due == '2026-08-18T00:00:00Z' (reopen re-anchor 2026-08-03 + 15 calendar days)"
            - "urgency term = min(40, max(0, (10-3)*4)) = 28; without clamp the score would be 103"

      - name: trend_system_rate_per_cell_rounding_order
        grounds:
          - calculations.trend_snapshot_system_rate
          - calculations.unit_breach_rate
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — per-cell bp rounded first (3333 and 5000),
          then averaged (round_half_up(4166.5) = 4167). A global sum-then-round would yield
          4000; the scaffold pins per-cell-first and the test must observe 4167, not 4000.
        test_recipe:
          setup:
            - "Unit U1: 3 BILLING complaints closed in 2026-08, one LATE -> cell bp 3333"
            - "Unit U2: 2 BILLING complaints closed in 2026-08, one LATE -> cell bp 5000"
            - "All received 2026-08-03T09:00:00Z (due 2026-08-06T09:00:00Z); on-time close 2026-08-05T09:00:00Z, late close 2026-08-08T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Unit U1", category: "OUTPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/hospital-units", payload: { name: "Unit U2", category: "SURGICAL" }, as: SystemAdmin, captures: { u2: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-U1-A", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PORTAL", description: "Billing question A", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { ka: $.data.id, kav: $.data.version } }
            - { call: "POST /api/patient-cases/${ka}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${kav}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${ka}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { kav2: $.data.version } }
            - { call: "POST /api/patient-cases/${ka}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${kav2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${ka}/fast-track", payload: {}, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-U1-B", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Billing question B", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { kb: $.data.id, kbv: $.data.version } }
            - { call: "POST /api/patient-cases/${kb}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${kbv}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${kb}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { kbv2: $.data.version } }
            - { call: "POST /api/patient-cases/${kb}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${kbv2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${kb}/fast-track", payload: {}, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-U1-C", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "EMAIL", description: "Billing question C", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { kc: $.data.id, kcv: $.data.version } }
            - { call: "POST /api/patient-cases/${kc}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${kcv}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${kc}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { kcv2: $.data.version } }
            - { call: "POST /api/patient-cases/${kc}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${kcv2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${kc}/fast-track", payload: {}, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-U2-D", unit_id: "${u2}", received_at: "2026-08-03T09:00:00Z", channel: "PORTAL", description: "Billing question D", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { kd: $.data.id, kdv: $.data.version } }
            - { call: "POST /api/patient-cases/${kd}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${kdv}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${kd}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { kdv2: $.data.version } }
            - { call: "POST /api/patient-cases/${kd}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${kdv2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${kd}/fast-track", payload: {}, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-U2-E", unit_id: "${u2}", received_at: "2026-08-03T09:00:00Z", channel: "LETTER", description: "Billing question E", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { ke: $.data.id, kev: $.data.version } }
            - { call: "POST /api/patient-cases/${ke}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${kev}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${ke}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { kev2: $.data.version } }
            - { call: "POST /api/patient-cases/${ke}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${kev2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${ke}/fast-track", payload: {}, as: IntakeCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/patient-cases/${ka}/close", payload: { closure_note: "Resolved at point of contact A" }, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases/${kb}/close", payload: { closure_note: "Resolved at point of contact B" }, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases/${kd}/close", payload: { closure_note: "Resolved at point of contact D" }, as: IntakeCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/patient-cases/${kc}/close", payload: { closure_note: "Resolved after delay C" }, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases/${ke}/close", payload: { closure_note: "Resolved after delay E" }, as: IntakeCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/trend-snapshots/compute", payload: { period: "2026-08" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { sys_bp: $.data.system_rate_bp, cells: $.data.cells_created } }
            - { call: "GET /api/trend-snapshots?unit_id=${u1}&period=2026-08", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { hc1: "$.data[0].headcount_rate_bp" } }
            - { call: "GET /api/trend-snapshots?unit_id=${u2}&period=2026-08", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { hc2: "$.data[0].headcount_rate_bp" } }
          assert:
            - "hc1 == 3333 (round_half_up(1*10000/3)) and hc2 == 5000 (round_half_up(1*10000/2))"
            - "sys_bp == 4167 (round_half_up((3333+5000)/2 = 4166.5)) — per-cell-round-first order"
            - "sys_bp != 4000 (the forbidden global sum-then-round value 2*10000/5)"
            - "cells == 2"

      - name: tolling_recompute_precedes_status_derivation
        grounds:
          - calculations.regulatory_clock_status_derivation
          - calculations.tolling_credit_seconds
          - state_machines.PatientCase.regulatory_clock_status
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — suspension credit
          (1) must be merged and added to the due (2) BEFORE status derivation (3); status never
          feeds back. A status-first evaluation would strand the case in SUSPENDED/RESPONSE_BREACH;
          the pinned order yields ON_TRACK with due 2026-09-05T09:00:00Z after a 5-day suspension.
        test_recipe:
