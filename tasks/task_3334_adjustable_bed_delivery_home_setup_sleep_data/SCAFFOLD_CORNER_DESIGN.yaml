            - "after tier upgrade: Customer.${cust_id}.entitlements includes SCORE_DETAIL"
            - "PLUS tier: detail=FULL returns 200 with 1 row including the score breakdown fields (minutes_asleep, restlessness_events, avg_heart_rate)"

