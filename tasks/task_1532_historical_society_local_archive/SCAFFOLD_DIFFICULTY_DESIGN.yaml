            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Vellum deed" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "1300s vellum", condition_grade: "FRAGILE", appraised_value_cents: 250000, format: "MANUSCRIPT" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "A. One", email: "a@example.org" }, as: ReadingRoomStaff, captures: { ra: $.data.id } }
            - { call: "POST /researchers", payload: { full_name: "B. Two", email: "b@example.org" }, as: ReadingRoomStaff, captures: { rb: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Charters", purpose: "ACADEMIC" }, as: Researcher, as_user_id: "${ra}", captures: { rqa: $.data.id } }
            - { call: "POST /research-requests/${rqa}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rqa}/approve", as: ReadingRoomStaff }
          trigger:
            - { call: "POST /reading-room-appointments", payload: { research_request_id: "${rqa}", room_code: "MAIN", scheduled_date: "2026-08-10", start_time: "10:00", end_time: "12:00", seats: 1 }, as: Researcher, as_user_id: "${rb}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ITEM_TOO_FRAGILE (priority 7 safety gate wins)"
            - "error_id != ERR_REQUEST_OWNERSHIP_MISMATCH although B does not own the request (priority 10)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: third_strike_suspends_at_threshold
        grounds:
          - calculations.no_show_strike_count
          - state_machines.Researcher
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Metric: rolling strike COUNT; endpoint: record-no-show. The suspension
          fires at exactly strikes == 3 (>=, not >): after two recorded no-shows
          the researcher stays ACTIVE; the third flips to SUSPENDED and cancels
          the researcher's future CONFIRMED appointments.
        test_recipe:
          setup:
            - "Item AVAILABLE; researcher R with APPROVED request; three past appointments recorded as NO_SHOW one at a time; a fourth appointment still CONFIRMED in the future"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
