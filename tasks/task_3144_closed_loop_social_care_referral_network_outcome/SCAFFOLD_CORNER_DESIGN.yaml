        distinguishing_aspect: "Org registration is NetworkCoordinator-exclusive; an OrgAdmin attempting it gets 403 ERR_UNAUTHORIZED_ROLE regardless of payload validity."
        test_recipe:
          setup: ["A CBO org exists to back the OrgAdmin identity"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
