            - "HOP 5 — after apply: Invoice.${inv3}.status == ADJUSTED, adjustment_total_cents == 30495, net_amount_cents == 73785, pending_adjustment_count == 0, has_pending_adjustments == false, and tier_discount_bps is STILL 0 (the tier is frozen at issue)"
            - "HOP 5 — after apply: Shipment.${p3}.billing_status == ADJUSTED and BillingAdjustment.${adj3}.applied_by_user_id == 'billing.two'"
            - "HOP 6 — ShipperAccount.${sh1}.credit_balance_cents == -30495 and open_charges_cents == 73785; INVARIANT M holds: -30495 + 73785 == 43290 == gross 43290 - discount 0"
      - name: approved_guarantee_claim_cascades_to_refunded_only_after_release
        grounds:
          - calculations.guarantee_refund
          - state_machines.GuaranteeClaim
          - state_machines.BillingAdjustment
          - calculations.shipper_ledger_aggregates
          - entities.GuaranteeClaim.fields.refund_cents
        distinguishing_aspect: |
          The chain runs GuaranteeClaim -> BillingAdjustment -> InvoiceLine -> Invoice ->
          Shipment -> ShipperAccount and then LOOPS BACK to the claim: the claim reaches
          REFUNDED and gains refund_cents only as a side effect of the apply call, never
          at adjudication. The refundable base is also the floored transportation charge
          alone (2660), so the 150-cent demand surcharge riding on the same line must
          survive the refund and leave the line at exactly 150.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305); ServiceLevel EXPRESS (guarantee_hours 24, guaranteed true)."
            - "ACTIVE DEMAND window DEM-AUG scoped to EXPRESS with per_package_cents 150 — a DEMAND window never suspends the money-back guarantee, only a PEAK_SEASON window does."
            - "Shipment P4 (12 x 10 x 8, 6.0 lb, zone 2, non-residential) picked up at the 2026-08-01T00:00:00Z default clock: cube 960, dim weight 7, billable 7 lb DIMENSIONAL, transportation 2660, surcharge 150, line 2810, guarantee_deadline_utc 2026-08-02T00:00:00Z."
            - "The clock is advanced to 2026-08-02T03:00:00Z before delivery, so the parcel is 10800 seconds late; the invoice is ISSUED at that same instant with net 2810."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
