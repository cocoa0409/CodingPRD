scaffold_corner_design:

  # ============================================================
  # Section: entities
  # ============================================================
  - section: entities
    instances:
      - name: donor_create_happy_path_returns_201_with_all_fields
        claim_type: creation
        grounds:
          - endpoints["POST /donors"]
          - entities.Donor
        distinguishing_aspect: "POST /donors with all required fields returns 201 and Donor with id/created_at/updated_at/version system-stamped."
        test_recipe:
          setup:
            - "No donor exists."
          setup_api_calls: []
          trigger:
            - call: "POST /donors"
              payload: { full_name: "Alice", state_code: "CA", federal_tax_id_last4: "1234", email: "alice@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id, d_version: $.data.version }
          assert:
            - "response.status_code == 201"
            - "Donor.${d_id}.full_name == Alice"
            - "Donor.${d_id}.state_code == CA"
            - "Donor.${d_id}.federal_tax_id_last4 == 1234"
            - "Donor.${d_id}.version == 1"
            - "Donor.${d_id}.created_at is ISO 8601 UTC"

      - name: account_get_by_id_returns_stored_data
        claim_type: retrieval
        grounds:
          - endpoints["GET /accounts/{id}"]
          - entities.Account
        distinguishing_aspect: "GET /accounts/{id} returns the stored Account exactly as last mutated."
        test_recipe:
          setup:
            - "Donor d, Beneficiary b, Account a OPEN with balance=0."
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "D", state_code: "CA", federal_tax_id_last4: "1111", email: "d-get@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
          trigger:
            - call: "GET /accounts/${a_id}"
              payload: {}
              as: CustodianAgent
              captures: { fetched_status: $.data.status, fetched_balance: $.data.account_balance_cents }
          assert:
            - "Account.${a_id}.status == OPEN"
            - "Account.${a_id}.account_balance_cents == 0"
            - "Account.${a_id}.donor_id == ${d_id}"
            - "Account.${a_id}.beneficiary_id == ${b_id}"

      - name: list_accounts_pagination_envelope_keys_present
        claim_type: listing
        grounds:
          - endpoints["GET /accounts"]
        distinguishing_aspect: "GET /accounts returns paginated list with meta + data envelope, total_count and has_more present."
        test_recipe:
          setup:
            - "Three accounts exist."
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DL", state_code: "CA", federal_tax_id_last4: "1111", email: "dl@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BL", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
          trigger:
            - call: "GET /accounts"
              payload: { limit: 2, offset: 0 }
              as: CustodianAgent
          assert:
            - "response.data.total_count == 3"
            - "response.data.has_more == true"
            - "response.data.items has length 2"

      - name: get_donor_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints["GET /donors/{id}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /donors/{nonexistent-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "No donor with id 00000000-0000-0000-0000-000000000099 exists."
          setup_api_calls: []
          trigger:
            - call: "GET /donors/00000000-0000-0000-0000-000000000099"
              payload: {}
              as: CustodianAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: donor_missing_required_field_state_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints["POST /donors"]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=18]
        distinguishing_aspect: "Required field state_code missing → ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /donors"
              payload: { full_name: "X", federal_tax_id_last4: "1111", email: "x@x.com" }
              as: CustodianAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: account_computed_balance_ignores_client_supplied_value
        claim_type: computed_fields
        grounds:
          - entities.Account.fields.account_balance_cents
          - entities.Account.fields.total_basis_cents
        distinguishing_aspect: "Account.account_balance_cents is computed; client-supplied value in POST /accounts payload is ignored. Initial value is 0."
        test_recipe:
          setup:
            - "Donor d, Beneficiary b."
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DC", state_code: "CA", federal_tax_id_last4: "1111", email: "dc@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BC", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id, balance: $.data.account_balance_cents }
          assert:
            - "Account.${a_id}.account_balance_cents == 0"
            - "Account.${a_id}.total_basis_cents == 0"
            - "Account.${a_id}.total_earnings_cents == 0"
            - "Account.${a_id}.status == OPEN"

      - name: account_system_fields_id_created_at_server_minted
        claim_type: system_fields
        grounds:
          - entities.Account.common_fields
        distinguishing_aspect: "id and created_at on Account are server-minted; any client-supplied values are ignored."
        test_recipe:
          setup: ["Donor d, Beneficiary b created."]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DS", state_code: "CA", federal_tax_id_last4: "1111", email: "ds@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BS", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id, ca: $.data.created_at, v: $.data.version }
          assert:
            - "Account.${a_id}.id matches UUID v4 pattern"
            - "Account.${a_id}.created_at is ISO 8601 UTC"
            - "Account.${a_id}.version == 1"

      - name: donor_invalid_enum_state_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.Donor.fields.state_code
          - validations[priority=11]
          - errors[ERR_UNSUPPORTED_STATE_CODE]
        distinguishing_aspect: "state_code=WY (not in {CA, NY, IL, TX, FL, OH}) rejected with ERR_UNSUPPORTED_STATE_CODE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /donors"
              payload: { full_name: "X", state_code: "WY", federal_tax_id_last4: "1234", email: "wy@x.com" }
              as: CustodianAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == ERR_UNSUPPORTED_STATE_CODE"

      - name: account_create_referenced_donor_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints["POST /accounts"]
          - errors[ERR_REFERENCED_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "donor_id refers to a non-existent Donor → ERR_REFERENCED_NOT_FOUND 404."
        test_recipe:
          setup: ["Beneficiary b exists; no donor with synthetic id."]
          setup_api_calls:
            - call: "POST /beneficiaries"
              payload: { full_name: "BRF", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { donor_id: "00000000-0000-0000-0000-000000000099", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == ERR_REFERENCED_NOT_FOUND"

      - name: clockstate_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.ClockState
        distinguishing_aspect: "ClockState declared with common_fields: false; only current_utc field, no version/created_at/updated_at."
        test_recipe:
          setup: ["Clock set to a known time."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00.000Z" }
              as: CustodianAgent
          trigger:
            - call: "GET /_clock"
              payload: {}
              as: CustodianAgent
              captures: { now: $.data.current_utc }
          assert:
            - "response.data.current_utc == 2026-06-15T12:00:00.000Z"
            - "response.data does NOT contain a 'version' key"
            - "response.data does NOT contain an 'updated_at' key"

  # ============================================================
  # Section: state_machines
  # ============================================================
  - section: state_machines
    instances:
      - name: account_initial_state_is_open
        claim_type: initial_state
        grounds:
          - state_machines.Account
        distinguishing_aspect: "Freshly created Account starts in OPEN."
        test_recipe:
          setup: ["Donor + Beneficiary exist."]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DI", state_code: "CA", federal_tax_id_last4: "1111", email: "di@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BI", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id, st: $.data.status }
          assert:
            - "Account.${a_id}.status == OPEN"

      - name: account_close_from_open_with_zero_balance_succeeds
        claim_type: valid_transition
        grounds:
          - state_machines.Account.OPEN_to_CLOSED
        distinguishing_aspect: "POST /accounts/{id}/close on OPEN account with zero balance and no pending obligations → CLOSED."
        test_recipe:
          setup: ["Account a OPEN with balance=0 and no schedules/withdrawals/changes."]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DCL", state_code: "CA", federal_tax_id_last4: "1111", email: "dcl@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BCL", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/close"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { st: $.data.status }
          assert:
            - "Account.${a_id}.status == CLOSED"

      - name: account_close_with_nonzero_balance_blocked
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Account.OPEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing an account with account_balance_cents > 0 is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account a OPEN with one posted contribution (balance=50000)."]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DCB", state_code: "CA", federal_tax_id_last4: "1111", email: "dcb@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BCB", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 50000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
          trigger:
            - call: "POST /accounts/${a_id}/close"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Account.${a_id}.status == OPEN"

      - name: account_restrict_from_restricted_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.Account.OPEN_to_RESTRICTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Account already RESTRICTED; second /restrict fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account a in RESTRICTED."]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DRR", state_code: "CA", federal_tax_id_last4: "1111", email: "drr@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BRR", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/restrict"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /accounts/${a_id}/restrict"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: account_closed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Account.terminal_states
        distinguishing_aspect: "From CLOSED no transitions are possible — /restrict, /release, /close all fail."
        test_recipe:
          setup: ["Account a CLOSED."]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DTC", state_code: "CA", federal_tax_id_last4: "1111", email: "dtc@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BTC", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/close"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /accounts/${a_id}/restrict"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Account.${a_id}.status == CLOSED"

      - name: scheduled_contribution_resume_recomputes_next_run
        claim_type: side_effect_execution
        grounds:
          - state_machines.ScheduledContribution.PAUSED_to_ACTIVE
        distinguishing_aspect: "PAUSED → ACTIVE side effect: next_run_utc is reset to current_utc + cadence interval (MONTHLY = +1 month)."
        test_recipe:
          setup: ["Schedule s PAUSED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "DSR", state_code: "CA", federal_tax_id_last4: "1111", email: "dsr@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BSR", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /scheduled-contributions"
              payload: { account_id: "${a_id}", amount_cents: 50000, cadence: "MONTHLY" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /scheduled-contributions/${s_id}/pause"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00.000Z" }
              as: CustodianAgent
          trigger:
            - call: "POST /scheduled-contributions/${s_id}/resume"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { next: $.data.next_run_utc, st: $.data.status }
          assert:
            - "ScheduledContribution.${s_id}.status == ACTIVE"
            - "ScheduledContribution.${s_id}.next_run_utc == 2026-05-15T00:00:00.000Z"

      - name: form_1099q_cyclic_correct_spawns_reissued
        claim_type: cyclic
        grounds:
          - state_machines.Form1099Q.ISSUED_to_CORRECTED
          - state_machines.Form1099Q.DRAFT_to_REISSUED
        distinguishing_aspect: "ISSUED → CORRECTED on f1 spawns a new Form1099Q row with status=REISSUED and supersedes_form_id=f1.id; underlying (account_id, tax_year) thus cycles."
        test_recipe:
          setup:
            - "Account a with one DISBURSED Withdrawal in 2026."
            - "Form1099Q f1 for (a, 2026) ISSUED (clock at 2027-01-15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "DFC", state_code: "CA", federal_tax_id_last4: "1111", email: "dfc@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BFC", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 500000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
              captures: { a_v1: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 100000, expense_class: "HIGHER_ED_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_id: $.data.id }
            - call: "POST /withdrawals/${w_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
            - call: "POST /withdrawals/${w_id}/approve"
              payload: { expected_account_version: "${a_v1}" }
              as: ComplianceOfficer
            - call: "POST /withdrawals/${w_id}/disburse"
              payload: {}
              as: CustodianAgent
            - call: "POST /forms-1099q"
              payload: { account_id: "${a_id}", tax_year: 2026 }
              as: SystemTaxAuthority
              captures: { f1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00.000Z" }
              as: SystemTaxAuthority
            - call: "POST /forms-1099q/${f1_id}/issue"
              payload: {}
              as: SystemTaxAuthority
          trigger:
            - call: "POST /forms-1099q/${f1_id}/correct"
              payload: {}
              as: SystemTaxAuthority
              captures: { f1_status: $.data.status }
            - call: "GET /forms-1099q"
              payload: { account_id: "${a_id}", tax_year: 2026 }
              as: SystemTaxAuthority
          assert:
            - "Form1099Q.${f1_id}.status == CORRECTED"
            - "exactly one Form1099Q exists with supersedes_form_id == ${f1_id} and status == REISSUED"

      - name: contribution_post_bubble_to_state_tax_incentive_aggregate
        claim_type: cross_entity
        grounds:
          - state_machines.Contribution.DRAFT_to_POSTED
          - entities.StateTaxIncentive.fields.contributions_eligible_cents
        excluded_because:
          difficulty_instance: transitive_cascade / contribution_post_cascade_to_state_tax_incentive_via_account
