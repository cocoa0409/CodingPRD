          - state_machines.RenderBatch.RENDERING_to_FAILED
          - state_machines.Asset.RENDERING_to_QC_FAILED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger family: VenueSystem DEGRADED ->
          OFFLINE mutates the active RenderBatch (-> FAILED); the batch failure in
          turn mutates its RENDERING assets (-> QC_FAILED). Originating trigger:
          the third consecutive maintenance-window failure on the ENV_FX system.
        test_recipe:
          setup:
            - "ENV_FX VenueSystem V with consecutive_failed_windows == 2 (DEGRADED) from two failed windows."
            - "RenderBatch B dispatched at clock 01:45 (STANDARD, 1 asset -> 90 render minutes, completes 03:15); asset A RENDERING."
            - "A third MaintenanceWindow on V created for 02:30-03:00 (after dispatch, so it does not block it); clock advanced to 02:45 (window ACTIVE; batch still RENDERING)."
