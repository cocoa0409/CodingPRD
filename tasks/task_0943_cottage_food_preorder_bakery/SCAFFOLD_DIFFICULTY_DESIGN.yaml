            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "IN_PRODUCTION" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "GET /bakery/batches"
              payload: { offer_window_id: "${w1}", menu_item_id: "${mi_cookie}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { batch_cookie: "$.data[0].id", cookie_planned: "$.data[0].planned_yield_units" }
            - call: "GET /bakery/batches"
              payload: { offer_window_id: "${w1}", menu_item_id: "${mi_bread}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { batch_bread: "$.data[0].id", bread_planned: "$.data[0].planned_yield_units" }
            - call: "POST /bakery/batches/${batch_cookie}/advance"
              payload: { to_status: "MIXED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/batches/${batch_cookie}/advance"
              payload: { to_status: "BAKED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/batches/${batch_bread}/advance"
              payload: { to_status: "MIXED" }
              as: Baker
              as_user_id: "${baker_id}"
