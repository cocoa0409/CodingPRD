              payload: { start_at: "2026-05-05T09:00:00Z", end_at: "2026-05-05T11:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { slot_a_id: $.data.id }
            - call: "POST /smart-home-support/technicians/${tech_id}/visit-slots"
              payload: { start_at: "2026-05-05T11:44:00Z", end_at: "2026-05-05T13:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { slot_b_id: $.data.id }
            - call: "POST /smart-home-support/tickets"
              payload: { household_id: "${h_id}", severity: "P1", summary: "First fault", opened_by_member_id: "${own_id}" }
