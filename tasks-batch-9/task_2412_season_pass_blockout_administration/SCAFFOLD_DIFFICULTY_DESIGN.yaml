  - rule_id: resource_temporal_overlap
    instances:
      - name: park_day_slot_capacity_counts_only_overlapping_half_open_windows
        grounds:
          - validations[priority=101]
          - validations[priority=100]
          - entities.ParkDay.fields.window_slot_capacity
          - entities.Reservation.fields.arrival_window_start
          - endpoints[POST /reservations]
        distinguishing_aspect: |
          Resource = ParkDay arrival-window slots; interval semantics = half-open [start, end) overlap
          against window_slot_capacity. A third request whose window overlaps both existing ones is
          refused while a fourth request that merely *abuts* the second (starts exactly at its end) is
