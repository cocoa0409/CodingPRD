            - "Certificant.${certA_id}.certificate_number == \"CPX-2026-00001\" and Certificant.${certB_id}.certificate_number == \"CPY-2026-00001\""

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: ceu_self_study_award_rounded_per_activity_before_capping_totals_4_59
        grounds:
          - calculations.ceu_credit_accrual
          - calculations.cycle_credit_reconciliation
          - entities.CEUActivity.fields.credits_awarded
          - entities.CEUActivity.fields.credits_counted
          - entities.RecertificationCycle.fields.credits_applied
          - state_machines.CEUActivity.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The pinned ROUNDING ORDER of ceu_credit_accrual is observable: three SELF_STUDY
          claims of 3.05 contact hours each are awarded round_half_up(3.05 * 0.5, 2) = 1.53
          individually and then summed to credits_applied 4.59, whereas summing the raw
          products first (3 * 1.525 = 4.575) and rounding once would give 4.58 — a 0.01
          divergence that only the round-then-cap-then-sum order produces.
        test_recipe:
          setup:

            - "One ACTIVE programme CPX (form_length 1, domain_specs [{D1, 100, min_operational_items 1}], psychometric_stat_basis POOLED, min_panelists 1, panel_trim_count 0, audit_every_nth 7, cycle_length_months 12, required_ceu_credits 12, ceu_credit_accrual_basis STRICT_CYCLE)."
            - "One OPERATIONAL item (pretest batch 40 responses, p_value 0.6000, discrimination_index 0.6000) and one PUBLISHED form whose raw_cut_score computed to 0 (trimmed_mean 0.600000, sem 0.0, raw 1, clamped to ceil_cut floor(0.90*1) = 0)."
            - "One APPROVED application (BACHELOR 2020, 36 months, audit_sequence_number 1, not sampled) and a TEST_CENTER session 2026-08-10T00:00:00Z-04:00:00Z seat_capacity 5."
