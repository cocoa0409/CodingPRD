              as: InstallationForeman
              captures: { r5: $.data.test_failure_reason, s5: $.data.status }
          assert:
            - "${sc_st0} == WIRED and ${ev} == 711.32 (15 * 49.5 * (1 + (-0.0028) * (40 - 25)), rounded half up to 2 decimals)"
            - "${r1} == INSULATION and ${s1} == FAILED — 39.9 is below the inclusive IR_MIN_MOHM of 40.0"
            - "${r2} == INSULATION even though the VOC deviation (31.32 V > the 21.3396 V allowance) and the polarity check also fail — the first check in the pinned order names the reason"
            - "${r3} == VOC_DEVIATION once insulation passes at exactly 40.0"
            - "${r4} == POLARITY — 705.00 deviates by only 6.32 V, inside the 21.3396 V allowance"
            - "${r5} == null with ${s5} == TESTED, and Block.${blk}.electrical_status == TESTED with circuits_failed_count == 0 after having been REWORK"

      - name: earthwork_disturbance_gate_admits_the_limit_and_refuses_one_hundredth_over
