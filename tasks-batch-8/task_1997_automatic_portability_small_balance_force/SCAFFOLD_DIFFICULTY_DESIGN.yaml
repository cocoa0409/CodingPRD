            - { call: "POST /fiduciary-reviews/${r1}/attest", payload: {}, as: FiduciaryReviewer, as_user_id: "fid_rev_1" }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x2: $.data.id } }
