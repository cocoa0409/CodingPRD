          - validations[priority=28]
        distinguishing_aspect: "Re-running the allocator on a PARTIALLY_ALLOCATED order while carrying the version observed at conversion returns ERR_STALE_ORDER_VERSION (412) and leaves the existing 200 ft reservation exactly as it was."
        test_recipe:
          setup:
