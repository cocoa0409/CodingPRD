  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_review_create_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[review-create-stale-institution]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second review create carrying the pre-first-create institution version is rejected 412; the first review is NOT superseded by the failed call."
        test_recipe:
          setup: ["institution created (version 1 captured); one review created against it (version advances to 2)"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev1: $.data.id } }
          trigger:
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-04-01", period_end: "2026-04-30", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Second create fails with error_id == ERR_STALE_VERSION, http 412 (inst_v was captured before the first create bumped the version)"
            - "CertificationReview.${rev1}.status remains DRAFT (failed create supersedes nothing)"
            - "GET /api/partner-institutions/${inst_id} -> version == 2"

      - name: occ_stale_report_create_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[report-create-stale-grant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Report create carrying the grant version captured before a prior report create is rejected 412; ledger unchanged."
        test_recipe:
          setup: ["CERTIFIED institution; ACTIVE grant (version captured post-activate); one report already created against it"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/funding-grants", payload: { funder_name: "City Foundation", program_year: 2026, total_cents: 500000, per_report_cap_cents: 200000 }, as: CoalitionAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/funding-grants/${g_id}/activate", payload: {}, as: CoalitionAdmin, captures: { g_v: $.data.version } }
            - { call: "POST /api/partner-reports", payload: { institution_id: "${inst_id}", grant_id: "${g_id}", period_start: "2026-01-01", period_end: "2026-03-31", evaluation_mode: "FINAL", expected_grant_version: "${g_v}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { rep1: $.data.id } }
          trigger:
            - { call: "POST /api/partner-reports", payload: { institution_id: "${inst_id}", grant_id: "${g_id}", period_start: "2026-04-01", period_end: "2026-06-30", evaluation_mode: "FINAL", expected_grant_version: "${g_v}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { err: $.data.error_id } }
          assert:
            - "Second create fails with error_id == ERR_STALE_VERSION, http 412"
            - "GET /api/funding-grants/${g_id} -> version == 3 (bumped exactly once by the successful first create)"
            - "GET /api/partner-reports?grant_id=${g_id} -> total_count == 1"

      - name: certification_lapse_at_expiry_boundary
        claim_type: scheduled_actions
        grounds: [state_machines.PartnerInstitution.CERTIFIED_to_LAPSED, calculations]
        distinguishing_aspect: "Lapse fires at now >= certification_expires_at: one day before expiry the epoch leaves the institution CERTIFIED; at exactly expiry it lapses."
        test_recipe:
          setup: ["Institution CERTIFIED at 2026-05-01; expires 2028-05-01"]
          setup_api_calls:
