          - errors.ERR_FEE_NOT_FOUND
          - errors.ERR_ACTION_NOT_FOUND
        distinguishing_aspect: "Every remaining catalog error is triggerable by a declared endpoint: schema/range/duplicate-ticker → ERR_INVALID_REQUEST; foreign-issuer access → ERR_OWNERSHIP_MISMATCH; plan review or appeal decision by the filer → ERR_SEGREGATION_OF_DUTIES; sideways TIER_TRANSFER target → ERR_TIER_TRANSFER_TARGET_INVALID; failed continued standards on a tier transfer → ERR_NO_STANDARD_MET; unknown nested ids → the per-entity 404s."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two issuers registered; issuer A has a submitted application; issuer B is the foreign issuer."
