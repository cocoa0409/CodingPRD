              as: Customer
              as_user_id: "${cust}"
              captures: { lease1: $.data.id }
          trigger:
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "LEASE", state_code: "TX", title: "Lease P1 B", lease_property_ref: "P1", lease_start_date: "2026-07-03T00:00:00.000Z", lease_end_date: "2026-12-31T00:00:00.000Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_LEASE_TERM_OVERLAP (2026-07-03 is only 3 days after 2026-06-30; inside the 7-day turnover buffer)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: money_invariant_review_charge_then_refund
        grounds:
          - calculations.money_conservation
          - state_machines.DocumentProject.ASSEMBLED_to_IN_REVIEW
          - state_machines.AttorneyReview.IN_REVIEW_to_CANCELLED
          - entities.Order.fields.net_collected_cents
        distinguishing_aspect: |
          Conserved quantity = money (cents). Forward (review request, +6375 charged)
          paired with compensating (review CANCELLED via cascade, +6375 refunded) leaves
          net_collected_cents == 0 (the review line nets to zero; the doc portion was
          never charged because the project was locked before finalize — no drift).
        test_recipe:
          setup:
            - "WILL/CA STANDARD ACTIVE project assembled (provisional 6882) with addon; review IN_REVIEW (charged 6375)"
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
