            - "${st} == ADJUDICATED"
            - "${allowed} == 6000 (the bundled line contributes nothing)"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 1 has line_status == PRICED and allowed_amount_cents == 6000"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 2 has line_status == BUNDLED, allowed_amount_cents == 0, bundled_into_line_number == 1 and edit_reason_code == DENY_BUNDLED_INTO_PRIMARY"

      - name: hard_deny_rank_outranks_a_pend_but_a_soft_deny_does_not
        claim_type: constraint_propagation
        grounds:
          - calculations.claim_outcome_resolution
          - entities.EditRule.fields.precedence_rank
          - entities.EditRule.fields.severity
          - entities.Claim.fields.pend_reason_code
          - entities.Claim.fields.deny_reason_code
        distinguishing_aspect: "With HARD_DENY_RANK_MAX = 10, a claim carrying a DENIED line from a rank-25 UNITS_LIMIT rule plus a pended line resolves to PENDED with PEND_AUTH_MISSING, whereas a claim carrying a DENIED line from a rank-5 MUTUALLY_EXCLUSIVE rule plus a pended line resolves to DENIED with DENY_MUTUALLY_EXCLUSIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan PREC-1 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Psi Surgical, no contract; fee schedule rates 97110 = 5000, 73721 = 40000, 29881 = 90000 and 29880 = 80000 effective 2026-01-01."
            - "Three EditRules: UNITS_LIMIT on 97110 with max_units 4, severity DENY, precedence_rank 25, reason DENY_UNITS_EXCEEDED (soft); AUTH_REQUIRED on 73721, severity PEND, precedence_rank 30, reason PEND_AUTH_MISSING; MUTUALLY_EXCLUSIVE with primary 29881 and secondary 29880, severity DENY, precedence_rank 5, reason DENY_MUTUALLY_EXCLUSIVE (hard)."
            - "Member M-PREC-1 has one open-ended PRIMARY coverage segment from 2026-01-01 and NO authorizations at all."
            - "Claim CLM-PREC-A carries line 1 = 97110 with 6 units and line 2 = 73721; claim CLM-PREC-B carries line 1 = 29881, line 2 = 29880 and line 3 = 73721 on service date 2026-02-11."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "PREC-1", name: "Precedence Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000020", name: "Psi Surgical", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "97110", allowed_amount_cents: 5000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "29881", allowed_amount_cents: 90000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "29880", allowed_amount_cents: 80000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "UL-97110", edit_type: "UNITS_LIMIT", primary_code: "97110", max_units: 4, severity: "DENY", precedence_rank: 25, reason_code: "DENY_UNITS_EXCEEDED" }
              as: PlanAdmin
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-P", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "EXCL-29881", edit_type: "MUTUALLY_EXCLUSIVE", primary_code: "29881", secondary_code: "29880", severity: "DENY", precedence_rank: 5, reason_code: "DENY_MUTUALLY_EXCLUSIVE" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-PREC-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PREC-A", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "97110", units: 6, billed_amount_cents: 30000, service_date: "2026-02-10" }, { line_number: 2, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { ca_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PREC-B", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "29881", units: 1, billed_amount_cents: 100000, service_date: "2026-02-11" }, { line_number: 2, procedure_code: "29880", units: 1, billed_amount_cents: 90000, service_date: "2026-02-11" }, { line_number: 3, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-11" }] }
              as: ClaimsIntake
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${ca_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { st_a: $.data.status, pend_a: $.data.pend_reason_code, deny_a: $.data.deny_reason_code }
            - call: "POST /adjudication/claims/${cb_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { st_b: $.data.status, pend_b: $.data.pend_reason_code, deny_b: $.data.deny_reason_code }
          assert:
            - "${st_a} == PENDED, ${pend_a} == PEND_AUTH_MISSING and ${deny_a} == null"
            - "GET /adjudication/claim-lines?claim_id=${ca_id} line_number 1 has line_status == DENIED with edit_reason_code == DENY_UNITS_EXCEEDED"
            - "${st_b} == DENIED, ${deny_b} == DENY_MUTUALLY_EXCLUSIVE and ${pend_b} == null"
            - "GET /adjudication/claim-lines?claim_id=${cb_id} line_number 2 has line_status == DENIED with edit_reason_code == DENY_MUTUALLY_EXCLUSIVE"
            - "GET /adjudication/claim-lines?claim_id=${cb_id} line_number 1 has line_status == PRICED"

      - name: claim_with_every_line_denied_takes_the_lowest_line_number_reason
        claim_type: correct_result
        grounds:
          - calculations.claim_outcome_resolution
          - state_machines.ClaimLine.line_status.PENDING_to_DENIED
          - entities.Claim.fields.deny_reason_code
        distinguishing_aspect: "When line 1 is denied by a rank-25 UNITS_LIMIT rule and line 2 is denied for having no fee schedule rate, STEP 5 stamps the claim with the DENIED line of the lowest line_number, so deny_reason_code is DENY_UNITS_EXCEEDED and not DENY_NON_COVERED_SERVICE."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan ALLD-1 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Omega Rehab, no contract; the only fee schedule rate under the plan is 97110 = 5000 effective 2026-01-01, so procedure 99999 has no rate."
            - "One UNITS_LIMIT EditRule on 97110 with max_units 4, severity DENY, precedence_rank 25 and reason DENY_UNITS_EXCEEDED."
            - "Member M-ALLD-1 has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "Claim CLM-ALLD-1 carries line 1 = 97110 with 6 units billed 30000 and line 2 = 99999 with 1 unit billed 15000, both service date 2026-02-10."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "ALLD-1", name: "All Denied Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000021", name: "Omega Rehab", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "97110", allowed_amount_cents: 5000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "UL-97110-B", edit_type: "UNITS_LIMIT", primary_code: "97110", max_units: 4, severity: "DENY", precedence_rank: 25, reason_code: "DENY_UNITS_EXCEEDED" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-ALLD-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-ALLD-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "97110", units: 6, billed_amount_cents: 30000, service_date: "2026-02-10" }, { line_number: 2, procedure_code: "99999", units: 1, billed_amount_cents: 15000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { st: $.data.status, deny: $.data.deny_reason_code, allowed: $.data.total_allowed_cents }
          assert:
            - "${st} == DENIED"
            - "${deny} == DENY_UNITS_EXCEEDED"
            - "${allowed} == 0"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 2 has line_status == DENIED with edit_reason_code == DENY_NON_COVERED_SERVICE"

      - name: deductible_carries_across_two_finalized_claims_in_the_same_plan_year
        claim_type: constants_applied
        grounds:
          - calculations.line_member_cost_share
          - entities.BenefitAccumulator.fields.deductible_applied_cents
          - state_machines.Claim.status.ADJUDICATED_to_FINALIZED
        distinguishing_aspect: "The first finalized claim consumes 40000 of the 50000 deductible, so the second claim draws only the remaining 10000 and coinsures the 30000 residue at 20 percent, producing member 16000 and plan 24000."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan DED-1 with deductible 50000, oop_max 300000 and coinsurance 0.20."
            - "IN_NETWORK provider Alpha2 Imaging, no contract; fee schedule rate 73721 = 40000 effective 2026-01-01."
            - "Member M-DED-1 has one open-ended PRIMARY coverage segment from 2026-01-01 and a zeroed plan_year 2026 accumulator."
            - "Claim CLM-DED-1 (1 unit, billed 60000, service 2026-02-10) has been adjudicated and finalized, moving the accumulator to 40000 / 40000."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "DED-1", name: "Deductible Plan", deductible_individual_cents: 50000, oop_max_individual_cents: 300000, coinsurance_member_pct: 0.20 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000022", name: "Alpha2 Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-DED-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-DED-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c1_id: $.data.id }
            - call: "POST /adjudication/claims/${c1_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { member1: $.data.total_member_liability_cents, plan1: $.data.total_plan_paid_cents }
            - call: "POST /adjudication/claims/${c1_id}/finalize"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-DED-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 61000, service_date: "2026-02-11" }] }
              as: ClaimsIntake
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c2_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { ded2: $.data.total_deductible_applied_cents, member2: $.data.total_member_liability_cents, plan2: $.data.total_plan_paid_cents }
            - call: "POST /adjudication/claims/${c2_id}/finalize"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "${member1} == 40000 and ${plan1} == 0"
            - "${ded2} == 10000"
            - "${member2} == 16000 and ${plan2} == 24000"
            - "GET /adjudication/members/${mem_id}/accumulators shows deductible_applied_cents == 50000, oop_applied_cents == 56000 and remitted_claim_count == 2"

      - name: error_dual_variant_pricing_divergence
        claim_type: variant_divergence
