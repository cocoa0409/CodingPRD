            - "Three US_NO_1 limits are violated at once, yet limiting_factor is the first in canonical order (TEST_WEIGHT), not DAMAGED_TOTAL or HEAT_DAMAGED"
            - "The SOYBEANS result from setup has assigned_grade == US_NO_2 and limiting_factor == TEST_WEIGHT against the soybean table (moisture 12.95 rounds to 13.0 and clears US_NO_2's 14.0 limit)"
