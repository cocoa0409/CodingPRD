          difficulty_instance: attendance_midterm_revoke_seat_promotion_cascade
          rationale: "N-level cascade verified end-to-end in the two named §1.8 rule-4 instances."

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
