      - name: stock_drop_below_min_cascades_three_levels_to_campaign_pause
        claim_type: side_effect_execution
        grounds:
          - state_machines.CatalogProduct.ELIGIBLE_to_OUT_OF_STOCK
          - state_machines.ProductAssignment.ACTIVE_to_PAUSED_OOS
          - state_machines.LineItem.SERVING_to_OOS_PAUSED
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: "A single stock adjustment of -48 units drives in_stock_units to 2 (< min 3) and propagates three levels: assignment PAUSED_OOS with relevance_contribution 0.0, line item OOS_PAUSED with pause_reason OUT_OF_STOCK, and — because every non-ENDED line item of the campaign is now paused — the campaign to PAUSED with oos_paused_line_item_count 1."
        test_recipe:
          setup: ["Baseline chain through line item activation; the single hero product SKU-RED-1 holds 50 units with the default min_stock_units_for_serving 3."]
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
            - *c_camp_act
            - *c_li_act
            - &c_pa_read
              call: "GET /rmn/product-assignments"
              payload: { line_item_id: "${li_id}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { pa_id: "$.data[0].id" }
          trigger:
