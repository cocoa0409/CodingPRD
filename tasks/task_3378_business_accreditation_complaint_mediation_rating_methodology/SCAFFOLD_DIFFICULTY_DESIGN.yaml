        distinguishing_aspect: "Depth-4 cascade from the run_daily_close trigger (different trigger from the ad-referral instance): complaint expiry (hop 1) -> Business counters recompute (hop 2) -> auto PROVISIONAL snapshot regeneration (hop 3) -> Business.current_provisional_* rewrite (hop 4), and the same sweep's suspension scan reads the previously PUBLISHED 72 to suspend (hop 4b)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; consumer; MEDIUM business (50 employees, founded 2020-01-01), ACCREDITED via full prepaid payment of 109250."
            - "c1 and c2 UNRESOLVED (rejected), c3 UNANSWERED (expired 2026-09-16); a PUBLISHED snapshot at 72 (12 + 16) already exists."
