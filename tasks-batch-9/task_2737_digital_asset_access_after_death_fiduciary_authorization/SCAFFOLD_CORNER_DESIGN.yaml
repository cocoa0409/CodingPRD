      - name: system_fields_are_stamped_from_the_logical_clock_and_the_calling_user
        claim_type: System Fields
        grounds:
          - entities.Document.fields.verified_by_user_id
          - entities.Document.fields.verified_at
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.Document.transitions[PENDING->VERIFIED]
        distinguishing_aspect: |
          created_at, updated_at, verified_at and every other timestamp come from the logical clock
          and nowhere else: a document created at 2026-08-01 and verified after the clock is moved to
          2026-09-10T08:30:00Z carries created_at 2026-08-01T00:00:00Z and verified_at
          2026-09-10T08:30:00Z, with verified_by_user_id equal to the calling X-User-ID.
        test_recipe:
          setup:
            - "one Estate with a Fiduciary and a PENDING DEATH_CERTIFICATE document created at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C07" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
