      - name: tlp_placement_parallel_tenancy_and_compliance_dimensions_move_independently
        grounds:
          - state_machines.TlpPlacement
          - entities.TlpPlacement.fields.tenancy_status
          - entities.TlpPlacement.fields.compliance_status
          - entities.TlpPlacement.fields.consecutive_probation_reviews
          - calculations.required_savings
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          TlpPlacement is the parallel-dimension entity, a structurally different non-linearity from
          ReunificationCase's cycle: tenancy_status and compliance_status advance on independent axes,
          and the coupling runs one way only. Two consecutive PROBATION reviews push tenancy from
          PLACED to NOTICE_GIVEN, but the third review's recovery to IN_COMPLIANCE (after a deposit
          lifts the balance to exactly the required 48000 cents) resets
          consecutive_probation_reviews to 0 without pulling tenancy_status back to PLACED - the
          notice, once given, is not undone by later compliance.
        test_recipe:
          setup:
            - "one TRANSITIONAL_LIVING program 'Northside Transitional Living' with licensed_bed_capacity 3, band 16..20, max_placement_days 540, savings_match_rate_bp 2500, required_savings_rate_bp 2000"
            - "youth Noa Feld, date_of_birth 2010-03-15, age_years 16, with a CLEARED SafetyScreening"
            - "an EMERGENCY_SHELTER program (licensed_bed_capacity 2, band 12..17) and an ACTIVE Admission for the youth, whose 24-hour GuardianNotification is attempted once by PHONE and then resolved CONTACTED - this is the only reachable path to Youth.status SHELTERED with risk_posture OPEN, which state_machines.Youth requires before SHELTERED -> TLP_ENROLLED"
            - "TlpPlacement placed at 2026-08-01T00:00:00Z with documented_monthly_income_cents 120000, so the monthly requirement is floor(120000 * 2000 / 10000) = 24000 cents"
            - "reviews are run at day 60 (2026-09-30T00:00:00Z) and twice at day 61 (2026-10-01T00:00:00Z); both days sit in savings month 2, so required_savings_cents is 48000 and the deficiency floor is 24000"
