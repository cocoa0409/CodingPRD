              payload: { contact_email: "sos_ex@x.com", label: "SOS" }
              as: Athlete
              as_user_id: "${ex_e}"
            - call: "POST /v1/athletes/${ex_e}/activities"
              payload: { device_source: "mobile-app", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 600, distance_m: 2000, track_points: [{lat: 58.00, lng: -143.00, t_offset_s: 0}, {lat: 58.01, lng: -143.00, t_offset_s: 600}], start_lat: 58.00, start_lng: -143.00, end_lat: 58.01, end_lng: -143.00, idempotency_key: "ex-1" }
              as: Athlete
              as_user_id: "${ex_e}"
              captures: { act_ex: $.data.id }
          trigger:
