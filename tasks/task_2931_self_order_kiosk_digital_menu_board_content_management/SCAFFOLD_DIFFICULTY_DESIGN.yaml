  - rule_id: boundary_precision_check
    instances:

      - name: dual_approval_uplift_at_exactly_five_hundred_basis_points
        grounds:
          - calculations.price_uplift_and_approval_tier
          - constants_global.DUAL_APPROVAL_UPLIFT_BP
          - endpoints.POST_/kiosk-ops/price-change-requests
        distinguishing_aspect: |
          Metric: uplift in basis points, at the inclusive DUAL_APPROVAL_UPLIFT_BP = 500
          boundary, measured on the create endpoint POST /kiosk-ops/price-change-requests.
          ZONE_B is used because its NONE rounding gives the clean baseline 600, so 630 is
          exactly 500 bp and 629 is 483 bp — one cent apart, on opposite sides of the tier.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_B has price_multiplier_bp 12000 and psychological_rounding NONE, so Item A (base 500) sits at an effective 600 with no rounding artefact."
            - "Cluster CL_ZONE and store S001 put at least one Store in this price zone, which validation priority 32 (ERR_PRICE_ZONE_MISMATCH) requires before any PriceChangeRequest may name it."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_B", currency_code: "USD", price_multiplier_bp: 12000, psychological_rounding: "NONE", tax_rate_bp: 700, max_uplift_bp: 2000 }
              as: PlatformAdmin
              captures: { zone_b_id: $.data.id }
            # a Store must reference this zone before a PriceChangeRequest may name it (validation priority 32)
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_ZONE", tier: "REGION" }
              as: ContentManager
              captures: { zone_cluster_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${zone_cluster_id}", price_zone_id: "${zone_b_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { zone_store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id, item_a_ver: $.data.version }
          trigger:
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_b_id}", proposed_price_cents: 630, justification: "At the dual approval boundary", effective_from_utc: "2026-08-05T17:00:00Z", expected_menu_item_version: "${item_a_ver}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { at_boundary_id: $.data.id, at_boundary_bp: $.data.uplift_bp, at_boundary_req: $.data.required_approvals }
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_b_id}", proposed_price_cents: 629, justification: "One cent below the boundary", effective_from_utc: "2026-08-05T17:00:00Z", expected_menu_item_version: "${item_a_ver}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { below_id: $.data.id, below_bp: $.data.uplift_bp, below_req: $.data.required_approvals }
          assert:
            - "${at_boundary_bp} == 500 and ${at_boundary_req} == 2 (the boundary is inclusive: uplift_bp >= 500 needs two approvers)"
            - "${below_bp} == 483 and ${below_req} == 1 (29 / 600 = 483.33 bp, which round_half_up sends to 483, one tier below the boundary)"
            - "both requests are created with state DRAFT and HTTP 201; neither is rejected"
            - "PriceChangeRequest.${at_boundary_id}.baseline_price_cents == 600 and PriceChangeRequest.${below_id}.baseline_price_cents == 600"

      - name: daypart_containment_at_exclusive_end_minute_falls_back
        grounds:
          - calculations.daypart_resolution
          - constants_global.STATIC_FALLBACK_LAYOUT_CODE
          - endpoints.GET_/kiosk-ops/stores/{store_id}/menu-projection
        distinguishing_aspect: |
          A different metric (store-local minute of day) on a different endpoint (the read-only
          GET .../menu-projection). Probes the half-open [660, 960) upper edge one minute apart:
          959 is still inside and, with buffer_minutes 15, is in the TRANSITIONING phase, while
          960 leaves the candidate set empty and must fall back to STATIC_FALLBACK.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; store S001 in cluster CL_WEST, ZONE_A, timezone_offset_minutes -300."
            - "The cluster's only PUBLISHED bundle carries exactly one slot: LUNCH [660, 960) with layout LUNCH_GRID and buffer_minutes 15."
