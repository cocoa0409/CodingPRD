          - calculations.recapture_exposure
          - calculations.award_compliance_posture
          - validations[priority=14]
          - entities.QEI.fields.recapture_trigger_type
        distinguishing_aspect: |
          A depth-3+ chain from a DIFFERENT triggering transition — the year-2 annual test, not an
          eligibility test: the FAIL verdict causes the already-AT_RISK QEI (now past its
          cure_deadline_at) to flip to RECAPTURED and price a 10,600,000 cent exposure, which
          causes recaptured_qei_count to reach 1 and the award posture to become FROZEN, which
          causes the very next QLICI deployment to be refused with ERR_AWARD_POSTURE_RESTRICTED.
        test_recipe:
          setup:
            - "One ACTIVE award with substantially_all_method DIRECT_TRACING."
            - "One QEI of 100,000,000 cents issued 2026-09-01 with a single QLICI of only 30,000,000 cents, so the direct ratio is 31.58 and every annual test must FAIL."
            - "The year-1 test has already run at 2027-09-01, leaving the QEI AT_RISK with cure_deadline_at 2028-02-28 and compliance_years_completed 1."
            - "Logical clock at 2028-08-31 — the year-2 window end, and well past the cure deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
