        distinguishing_aspect: "Both entity-backed identities are checked against the target, not merely against the role name: guest B reading guest A's reservation and restaurant 2's manager allocating a class on restaurant 1's service each get 403 ERR_FORBIDDEN_RESOURCE_OWNER on ids that genuinely exist."
