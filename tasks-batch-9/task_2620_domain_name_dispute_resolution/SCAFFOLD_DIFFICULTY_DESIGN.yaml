      - name: blackout_interval_is_closed_so_a_touching_engagement_window_is_refused
        grounds:
          - calculations.panelist_window_conflict
          - validations[priority=66].ERR_PANELIST_WINDOW_CONFLICT
          - entities.Panelist.fields.unavailable_from
          - entities.Panelist.fields.unavailable_to
          - endpoints.POST_/udrp/panelists/{id}/availability
        distinguishing_aspect: |
          The same fourteen-day candidate window [2026-08-10T00:00:00Z, 2026-08-24T00:00:00Z) is
          refused against a blackout of [2026-08-24T00:00:00Z, 2026-08-30T00:00:00Z] and accepted
          against a blackout of [2026-08-25T00:00:00Z, 2026-08-30T00:00:00Z] - because a blackout is
          CLOSED at both ends where an engagement window is half-open. The identical touching geometry
          that was legal between two engagements in the previous instance is illegal against a
          blackout, so an implementation that shares one interval-overlap helper between the two
          checks fails exactly one of the pair.
