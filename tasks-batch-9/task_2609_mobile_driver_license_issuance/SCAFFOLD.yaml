scenario: |
  Generate task harder than expert level!

  2609. Mobile Driver License Issuance (state motor vehicle agency digital credential program): eligibility with an existing physical credential and identity proofing at the required assurance level, enrollment with device binding, biometric or passcode protection and provisioning of the digital credential, credential update propagation on address change, renewal, restriction or revocation with near real-time revocation status, verifier ecosystem with reader applications, trust list distribution and data minimization allowing age-only attestation, privacy protections limiting verifier data retention and preventing tracking through presentation logs, law enforcement interaction protocols including handset handling policies, interoperability with national standards for cross-state acceptance, device loss, reprovisioning and multi-device policy

domain_name: mobile-driver-license-issuance
api_prefix: "/mdl"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # DigitalCredential sits at the centre of a many-to-many web (Holder x Device x
  # IdentityProofingSession) and is self-referential via supersedes_credential_id;
  # PresentationSession joins the credential graph to the verifier graph
  # (Verifier -> ReaderApp) through a pseudonymised, non-linkable log.

  state_machine_shape: parallel
  # DigitalCredential carries two INDEPENDENT state axes on the same row:
  # lifecycle_state (PENDING_PROVISION/ACTIVE/SUSPENDED/REPLACED/REVOKED/EXPIRED)
  # x sync_state (IN_SYNC/UPDATE_PENDING/UPDATE_FAILED/STALE). IdentityProofingSession
  # is cyclic (COLLECTING -> SUBMITTED -> RETURNED -> COLLECTING), Verifier is cyclic
  # (APPROVED <-> PROBATION <-> SUSPENDED), PresentationSession is branching,
  # UpdateOrder is compound (state = f(UpdateDelivery children)).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # The ProofingAgent who collected evidence may never adjudicate the same session;
  # the VerifierOperator who was billed for a disclosure may never void that billing
  # (only PrivacyAuditor may).

  consistency_model: immediate

difficulty_level: expert_plus
# 14 entities / 44 endpoints / 42 error codes / 7 calculations (4 with divergent
# variants) / 7 state machines (parallel + cyclic + branching + compound).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: InteropProfile
    parent: null
    common_fields: true
    fields:
      - { name: profile_code, type: string, source: input, description: "Short code for the national interoperability profile this jurisdiction publishes under.", constraints: "unique; 3..24 chars" }
      - { name: standard_version, type: enum, source: input, description: "National standard revision the trust list and credential payloads conform to.", constraints: "ISO_18013_5_2021 | ISO_18013_5_2024 | ISO_18013_7_2024" }
      - { name: accepted_issuer_states, type: array, source: input, description: "Two-letter codes of issuing jurisdictions whose mDLs this state accepts for cross-state presentation.", default: "[]" }
      - { name: required_assurance_level, type: enum, source: input, description: "Minimum identity assurance level a proofing session must achieve before a credential may be provisioned.", default: IAL2, constraints: "IAL1 | IAL1_5 | IAL2" }
      - { name: max_devices_per_holder, type: integer, source: input, description: "Multi-device policy cap: maximum Device rows per Holder counted in states ATTESTED, BOUND, LOST_REPORTED.", default: 2, constraints: ">= 1" }
      - { name: max_active_credentials_per_holder, type: integer, source: input, description: "Maximum DigitalCredential rows per Holder with lifecycle_state == ACTIVE.", default: 2, constraints: ">= 1" }
      - { name: proofing_validity_days, type: integer, source: input, description: "Days a VERIFIED proofing session remains usable before it lapses to EXPIRED.", default: 180, constraints: ">= 1" }
      - { name: revocation_freshness_seconds, type: integer, source: input, description: "Maximum age of the newest RevocationEntry for a credential for its revocation status to count as fresh; compared with <= (inclusive).", default: 300, constraints: ">= 0" }
      - { name: age_only_allowed_elements, type: array, source: input, description: "Exact element names a reader may request in an AGE_ONLY presentation context; anything else is a minimisation violation.", default: "[age_over_18, age_over_21, portrait]" }
      - { name: pending_republish_count, type: integer, source: computed, description: "Number of RevocationEntry rows appended since the newest TrustListSnapshot for this profile was published.", default: 0 }
      - { name: is_active, type: boolean, source: system, description: "True for the profile currently governing issuance.", default: true }

  - name: Holder
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Full legal name as printed on the physical credential." }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 calendar date (YYYY-MM-DD) of birth." }
      - { name: address_line1, type: string, source: input, description: "Street address currently of record at the agency." }
      - { name: city, type: string, source: input, description: "City of record." }
      - { name: state_code, type: string, source: input, description: "Two-letter jurisdiction code of record.", constraints: "exactly 2 uppercase letters" }
      - { name: postal_code, type: string, source: input, description: "Postal code of record." }
      - { name: physical_credential_number, type: string, source: input, description: "Number of the existing physical driver license that establishes eligibility.", constraints: "unique across Holder" }
      - { name: physical_credential_status, type: enum, source: input, description: "Status of the underlying physical credential; only VALID confers mDL eligibility.", default: VALID, constraints: "VALID | EXPIRED | SUSPENDED | REVOKED | CANCELLED" }
      - { name: physical_credential_expires_on, type: string, source: input, description: "ISO 8601 calendar date on which the physical credential expires." }
      - { name: restriction_codes, type: array, source: input, description: "Driving restriction codes (e.g. CORRECTIVE_LENSES, DAYLIGHT_ONLY) carried on the credential.", default: "[]" }
      - { name: active_credential_count, type: integer, source: computed, description: "count(DigitalCredential where holder_id == this.id and lifecycle_state == ACTIVE). Conserved quantity for the credential-slot invariant.", default: 0 }
      - { name: bound_device_count, type: integer, source: computed, description: "count(Device where holder_id == this.id and state IN {ATTESTED, BOUND, LOST_REPORTED}); compared against InteropProfile.max_devices_per_holder.", default: 0 }
      - { name: revoked_credential_count, type: integer, source: computed, description: "count(DigitalCredential where holder_id == this.id and lifecycle_state == REVOKED).", default: 0 }
      - { name: address_version, type: integer, source: computed, description: "Increments by 1 on every accepted address change; UpdateOrder.target_address_version pins the value each propagation is carrying.", default: 1 }

  - name: IdentityProofingSession
    parent: Holder
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> Holder.id; the person being identity-proofed." }
      - { name: requested_assurance_level, type: enum, source: input, description: "Assurance level the agent is attempting to establish.", constraints: "IAL1_5 | IAL2" }
      - { name: state, type: enum, source: system, description: "Cyclic proofing lifecycle; RETURNED re-enters COLLECTING when new evidence is appended.", default: COLLECTING, constraints: "COLLECTING | SUBMITTED | VERIFIED | RETURNED | DENIED | EXPIRED | CONSUMED" }
      - { name: proofing_agent_user_id, type: string, source: system, description: "X-User-ID of the ProofingAgent that created this session; the segregation-of-duties comparand." }
      - { name: adjudicator_user_id, type: string, source: computed, description: "X-User-ID of the CredentialAdjudicator that last adjudicated this session; null until first adjudication." }
      - { name: submission_count, type: integer, source: computed, description: "Number of COLLECTING -> SUBMITTED transitions; drives the repeat-attempt penalty in proofing_assurance_score.", default: 0 }
      - { name: evidence_count, type: integer, source: computed, description: "count(ProofingEvidence where proofing_session_id == this.id).", default: 0 }
      - { name: adjudication_score, type: integer, source: computed, description: "Score produced by proofing_assurance_score variant ADJUDICATION_STRICT at the most recent adjudication; null before that." }
      - { name: achieved_assurance_level, type: enum, source: computed, description: "Assurance level derived from adjudication_score at VERIFY; null unless the session has ever been VERIFIED.", constraints: "IAL1 | IAL1_5 | IAL2" }
      - { name: verified_at, type: datetime, source: computed, description: "Logical clock value at the COLLECTING/SUBMITTED -> VERIFIED transition." }
      - { name: assurance_expires_at, type: datetime, source: computed, description: "verified_at + InteropProfile.proofing_validity_days; once the clock passes it the session lapses to EXPIRED." }
      - { name: return_reason, type: string, source: computed, description: "Free text recorded on SUBMITTED -> RETURNED; cleared when the session re-enters COLLECTING." }

  - name: ProofingEvidence
    parent: IdentityProofingSession
    common_fields: false
    fields:
      - { name: proofing_session_id, type: string, source: input, description: "FK -> IdentityProofingSession.id; owning session. Evidence rows are append-only and never mutated after creation." }
      - { name: evidence_type, type: enum, source: input, description: "Category of proofing evidence collected.", constraints: "DOCUMENT_SCAN | BIOMETRIC_MATCH | KNOWLEDGE_CHECK | ADDRESS_CORROBORATION" }
      - { name: quality, type: enum, source: input, description: "Adjudicated quality band of this evidence item; maps to strength points via proofing_assurance_score.constants.POINTS.", constraints: "STRONG | FAIR | WEAK" }
      - { name: captured_at, type: datetime, source: input, description: "Instant the evidence was captured; the recency key that decides which item of a type supersedes the others." }
      - { name: source_reference, type: string, source: input, description: "Opaque reference to the capture artefact (scan id, biometric probe id, quiz id)." }
      - { name: strength_points, type: integer, source: computed, description: "POINTS[evidence_type][quality] resolved at creation time.", default: 0 }
      - { name: superseded, type: boolean, source: computed, description: "True when another ProofingEvidence of the same evidence_type in the same session has a strictly later captured_at; recomputed on every adjudication.", default: false }

  - name: Device
    parent: Holder
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> Holder.id; the person who owns this handset." }
      - { name: platform, type: enum, source: input, description: "Handset operating system family.", constraints: "IOS | ANDROID" }
      - { name: model_name, type: string, source: input, description: "Human-readable handset model." }
      - { name: hardware_attestation_token, type: string, source: input, description: "Opaque platform attestation blob presented at registration." }
      - { name: protection_method, type: enum, source: input, description: "How the holder unlocks the credential on this handset; the activation unlock proof must match it exactly.", constraints: "BIOMETRIC | PASSCODE" }
      - { name: state, type: enum, source: system, description: "Device binding lifecycle. Branching at attestation (PASS -> ATTESTED, FAIL -> RETIRED) and cyclic at loss (BOUND <-> LOST_REPORTED).", default: REGISTERED, constraints: "REGISTERED | ATTESTED | BOUND | LOST_REPORTED | WIPED | RETIRED" }
      - { name: attestation_result, type: enum, source: computed, description: "Outcome recorded by the attestation endpoint; null before attestation.", constraints: "PASS | FAIL" }
      - { name: secure_element_grade, type: enum, source: computed, description: "Key-storage grade reported at attestation; SOFTWARE cannot reach IAL2 provisioning.", constraints: "HARDWARE_STRONGBOX | HARDWARE_TEE | SOFTWARE" }
      - { name: active_binding_count, type: integer, source: computed, description: "count(DigitalCredential where device_id == this.id and lifecycle_state IN {PENDING_PROVISION, ACTIVE, SUSPENDED}).", default: 0 }
      - { name: lost_reported_at, type: datetime, source: computed, description: "Logical clock value at the BOUND -> LOST_REPORTED transition; cleared on recovery." }
      - { name: reprovision_count, type: integer, source: computed, description: "Number of times a credential has been provisioned onto this device carrying a non-null supersedes_credential_id.", default: 0 }

  - name: DigitalCredential
    parent: null
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> Holder.id; credential subject." }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; the handset this credential is cryptographically bound to." }
      - { name: proofing_session_id, type: string, source: input, description: "FK -> IdentityProofingSession.id; the session that established the assurance level carried by this credential." }
      - { name: supersedes_credential_id, type: string, source: input, description: "FK -> DigitalCredential.id; self-referential pointer to the credential this one replaces on reprovisioning or renewal. Null for a first issuance." }
      - { name: lifecycle_state, type: enum, source: system, description: "State axis 1 of 2 (independent of sync_state): issuance and revocation lifecycle.", default: PENDING_PROVISION, constraints: "PENDING_PROVISION | ACTIVE | SUSPENDED | REPLACED | REVOKED | EXPIRED" }
      - { name: sync_state, type: enum, source: system, description: "State axis 2 of 2 (independent of lifecycle_state): whether the on-device payload matches agency data.", default: IN_SYNC, constraints: "IN_SYNC | UPDATE_PENDING | UPDATE_FAILED | STALE" }
      - { name: doc_version, type: integer, source: system, description: "Payload revision pushed to the handset; increments by 1 on each DELIVERED UpdateDelivery. Distinct from the OCC `version` common field.", default: 1 }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive start of the credential validity interval; half-open [valid_from, valid_until) for per-device overlap detection." }
      - { name: valid_until, type: datetime, source: input, description: "Exclusive end of the credential validity interval." }
      - { name: assurance_level, type: enum, source: computed, description: "Copied from IdentityProofingSession.achieved_assurance_level at provisioning.", constraints: "IAL1 | IAL1_5 | IAL2" }
      - { name: restriction_codes, type: array, source: computed, description: "Snapshot of Holder.restriction_codes as of the last DELIVERED UpdateDelivery (or provisioning).", default: "[]" }
      - { name: address_version_synced, type: integer, source: computed, description: "Holder.address_version that the on-device payload reflects.", default: 1 }
      - { name: pending_update_count, type: integer, source: computed, description: "count(UpdateDelivery where credential_id == this.id and status == PENDING).", default: 0 }
      - { name: failed_delivery_count, type: integer, source: computed, description: "count(UpdateDelivery where credential_id == this.id and status == FAILED); at 2 the credential falls to sync_state STALE and lifecycle SUSPENDED.", default: 0 }
      - { name: suspend_reason, type: enum, source: computed, description: "Why the credential is SUSPENDED; null in every other lifecycle_state.", constraints: "DEVICE_LOST | ADMIN_HOLD | UPDATE_FAILED | PHYSICAL_CREDENTIAL_SUSPENDED" }
      - { name: revocation_sequence, type: integer, source: computed, description: "sequence of the newest RevocationEntry for this credential; 0 when none exists.", default: 0 }
      - { name: activated_at, type: datetime, source: computed, description: "Logical clock value at PENDING_PROVISION -> ACTIVE." }
      - { name: protection_method_at_activation, type: enum, source: computed, description: "Device.protection_method proven at activation.", constraints: "BIOMETRIC | PASSCODE" }
      - { name: reissuance_settlement_cents, type: integer, source: computed, description: "Output of credential_reissuance_settlement_cents; 0 for a first issuance (supersedes_credential_id null).", default: 0 }
      - { name: age_only_capable, type: boolean, source: computed, description: "True when the credential can answer an AGE_ONLY presentation without releasing identifiers.", default: true }

  - name: UpdateOrder
    parent: Holder
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> Holder.id; the subject whose credential data changed." }
      - { name: reason, type: enum, source: input, description: "Why propagation was opened.", constraints: "ADDRESS_CHANGE | RENEWAL | RESTRICTION_CHANGE | REVOCATION" }
      - { name: status, type: enum, source: system, description: "Compound state derived from child UpdateDelivery rows by update_order_status_rollup; never set directly by a client.", default: OPEN, constraints: "OPEN | PARTIALLY_DELIVERED | COMPLETED | FAILED_CLOSED" }
      - { name: payload_summary, type: string, source: computed, description: "Human-readable summary of the changed fields carried by this order." }
      - { name: delivery_count, type: integer, source: computed, description: "count(UpdateDelivery where update_order_id == this.id and status != SUPERSEDED).", default: 0 }
      - { name: delivered_count, type: integer, source: computed, description: "count(UpdateDelivery where update_order_id == this.id and status == DELIVERED).", default: 0 }
      - { name: failed_count, type: integer, source: computed, description: "count(UpdateDelivery where update_order_id == this.id and status == FAILED).", default: 0 }
      - { name: target_address_version, type: integer, source: computed, description: "Holder.address_version captured at order creation; a DELIVERED child copies it onto DigitalCredential.address_version_synced.", default: 1 }
      - { name: opened_at, type: datetime, source: computed, description: "Logical clock value at order creation." }
      - { name: closed_at, type: datetime, source: computed, description: "Logical clock value at the transition into COMPLETED or FAILED_CLOSED; null while open." }

  - name: UpdateDelivery
    parent: UpdateOrder
    common_fields: true
    fields:
      - { name: update_order_id, type: string, source: input, description: "FK -> UpdateOrder.id; owning propagation order." }
      - { name: credential_id, type: string, source: input, description: "FK -> DigitalCredential.id; the credential whose on-device payload this row refreshes." }
      - { name: status, type: enum, source: system, description: "Delivery lifecycle. SUPERSEDED is written by the system when a newer UpdateOrder for the same holder opens a delivery against the same credential.", default: PENDING, constraints: "PENDING | DELIVERED | FAILED | SUPERSEDED" }
      - { name: attempt_count, type: integer, source: computed, description: "Number of deliver/fail calls applied to this row.", default: 0 }
      - { name: failure_code, type: enum, source: computed, description: "Recorded on PENDING -> FAILED; null otherwise.", constraints: "DEVICE_UNREACHABLE | ATTESTATION_STALE | USER_DECLINED" }
      - { name: delivered_at, type: datetime, source: computed, description: "Logical clock value at PENDING -> DELIVERED." }
      - { name: device_receipt_token, type: string, source: computed, description: "Handset-signed receipt supplied on the deliver call." }
      - { name: resulting_doc_version, type: integer, source: computed, description: "DigitalCredential.doc_version after this delivery landed; null unless DELIVERED." }

  - name: RevocationEntry
    parent: DigitalCredential
    common_fields: false
    fields:
      - { name: credential_id, type: string, source: input, description: "FK -> DigitalCredential.id; subject credential. Entries are append-only; the near-real-time status is a replay of them." }
      - { name: sequence, type: integer, source: system, description: "Per-credential monotonically increasing counter starting at 1; the replay order key for revocation_status_projection.", default: 1 }
      - { name: status, type: enum, source: input, description: "Status this entry asserts.", constraints: "SUSPENDED | REVOKED | REINSTATED | EXPIRED" }
      - { name: reason, type: enum, source: input, description: "Why the entry was appended.", constraints: "DEVICE_LOST | HOLDER_REQUEST | FRAUD | PHYSICAL_CREDENTIAL_REVOKED | RENEWAL_SUPERSEDE | ADMIN_HOLD | RECOVERY | VALIDITY_LAPSED | UPDATE_FAILED" }
      - { name: effective_at, type: datetime, source: system, description: "Logical clock value at append; the freshness comparand for revocation_status_projection." }
      - { name: published, type: boolean, source: computed, description: "True once a TrustListSnapshot published after this entry covers it.", default: false }

  - name: Verifier
    parent: null
    common_fields: true
    fields:
      - { name: organization_name, type: string, source: input, description: "Relying-party organisation name." }
      - { name: category, type: enum, source: input, description: "Verifier class; only LAW_ENFORCEMENT may open a LAW_ENFORCEMENT presentation context.", constraints: "COMMERCIAL | LAW_ENFORCEMENT | GOVERNMENT_SERVICE | AGE_RESTRICTED_RETAIL" }
      - { name: purpose_scope, type: array, source: input, description: "Exact element names this verifier's declared purpose entitles it to receive in a ROUTINE presentation.", default: "[]" }
      - { name: retention_ceiling_days, type: integer, source: input, description: "Contractual maximum retention for disclosed data; a presentation declaring more is rejected. Compared with <= (inclusive).", constraints: "0..90" }
      - { name: trust_status, type: enum, source: system, description: "Cyclic trust lifecycle: APPROVED <-> PROBATION <-> SUSPENDED, terminal TERMINATED.", default: APPLIED, constraints: "APPLIED | APPROVED | PROBATION | SUSPENDED | TERMINATED" }
      - { name: exposure_index, type: integer, source: computed, description: "Most recently written verifier_exposure_index value; the ROLLING_WINDOW variant writes it on disclosure and the SINCE_LAST_ATTESTATION variant writes it on retention attestation.", default: 0 }
      - { name: last_attestation_at, type: datetime, source: computed, description: "Logical clock value at the most recent retention attestation; the inclusive lower bound of the SINCE_LAST_ATTESTATION window. Null before the first attestation." }
      - { name: attested_max_retention_days, type: integer, source: computed, description: "Retention the operator attested to at the last attestation." }
      - { name: open_session_count, type: integer, source: computed, description: "count(PresentationSession where reader_app_id in this verifier's reader apps and state IN {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED}).", default: 0 }
      - { name: billable_query_balance_cents, type: integer, source: computed, description: "sum(PresentationLogEntry.billed_amount_cents for this verifier where billing_state == BILLED). Conserved quantity for the billing-ledger invariant: a disclosure adds the billed amount, its void-billing compensation removes exactly the same amount, so the balance returns to its pre-disclosure value with no drift.", default: 0 }
      - { name: credited_amount_cents, type: integer, source: computed, description: "Running total of amounts removed from billable_query_balance_cents by void-billing compensations; the audit counterpart of the conserved balance, never subtracted from it a second time.", default: 0 }
      - { name: probation_strike_count, type: integer, source: computed, description: "Number of times an exposure-index threshold breach has driven this verifier into PROBATION or SUSPENDED.", default: 0 }

  - name: ReaderApp
    parent: Verifier
    common_fields: true
    fields:
      - { name: verifier_id, type: string, source: input, description: "FK -> Verifier.id; operator of this reader application." }
      - { name: app_identifier, type: string, source: input, description: "Reader application identifier. NOT unique: a certificate renewal registers a new ReaderApp row sharing the app_identifier, which is what the renewal-buffer interval rule polices.", constraints: "1..64 chars" }
      - { name: certificate_serial, type: string, source: input, description: "Serial of the reader certificate presented for trust listing.", constraints: "unique per verifier_id" }
      - { name: cert_not_before, type: datetime, source: input, description: "Inclusive start of the reader certificate validity window; closed interval [cert_not_before, cert_not_after] with a mandatory renewal buffer against sibling apps sharing app_identifier." }
      - { name: cert_not_after, type: datetime, source: input, description: "Inclusive end of the reader certificate validity window." }
      - { name: requested_elements, type: array, source: input, description: "Element names this reader application intends to request; intersected with Verifier.purpose_scope for ROUTINE minimisation." }
      - { name: base_rate_cents, type: integer, source: input, description: "Per-query base rate in cents used by verifier_invoice_amount_cents when query_count is in tier 1.", default: 25, constraints: ">= 0" }
      - { name: trust_state, type: enum, source: system, description: "Trust-list membership.", default: PENDING, constraints: "PENDING | LISTED | DELISTED" }
      - { name: listed_at, type: datetime, source: computed, description: "Logical clock value at the PENDING/DELISTED -> LISTED decision." }
      - { name: query_count, type: integer, source: computed, description: "count(PresentationSession where reader_app_id == this.id and state == COMPLETED).", default: 0 }
      - { name: volume_discount_pct, type: number, source: computed, description: "0.10 when query_count >= 250, else 0.00; applied per invoice line.", default: 0 }

  - name: TrustListSnapshot
    parent: InteropProfile
    common_fields: true
    fields:
      - { name: interop_profile_id, type: string, source: input, description: "FK -> InteropProfile.id; profile whose reader trust list this snapshot distributes." }
      - { name: snapshot_sequence, type: integer, source: system, description: "Per-profile monotonically increasing publication counter starting at 1.", default: 1 }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the coverage window; snapshots of one profile must tile exactly - no gap, no overlap." }
      - { name: effective_until, type: datetime, source: input, description: "Exclusive end of the coverage window; the next snapshot's effective_from must equal it exactly." }
      - { name: listed_reader_app_count, type: integer, source: computed, description: "count(ReaderApp where trust_state == LISTED) at publication.", default: 0 }
      - { name: revocation_pointer_sequence, type: integer, source: computed, description: "Total RevocationEntry rows in existence at publication; the pointer readers use to detect missed deltas.", default: 0 }
      - { name: revocation_pointer_stale, type: boolean, source: computed, description: "Set true when a RevocationEntry is appended after this snapshot was published, making its pointer lag.", default: false }
      - { name: pending_delta_count, type: integer, source: computed, description: "RevocationEntry rows appended since publication.", default: 0 }
      - { name: standard_version, type: string, source: computed, description: "InteropProfile.standard_version copied at publication." }
      - { name: published_at, type: datetime, source: computed, description: "Logical clock value at publication." }

  - name: PresentationSession
    parent: null
    common_fields: true
    fields:
      - { name: credential_id, type: string, source: input, description: "FK -> DigitalCredential.id; the credential being presented." }
      - { name: reader_app_id, type: string, source: input, description: "FK -> ReaderApp.id; the reader application requesting data." }
      - { name: context, type: enum, source: input, description: "Presentation context; drives which element allow-list minimisation applies and whether handset-handling policy is checked.", constraints: "ROUTINE | AGE_ONLY | LAW_ENFORCEMENT" }
      - { name: purpose, type: string, source: input, description: "Declared purpose string shown to the holder." }
      - { name: requested_elements, type: array, source: input, description: "Element names the reader asks for in this session." }
      - { name: handset_handling, type: enum, source: input, description: "Declared handling of the holder's handset. SURRENDER_REQUESTED is prohibited in every context.", constraints: "NO_SURRENDER | TAP_TO_READ | SURRENDER_REQUESTED" }
      - { name: retention_days, type: integer, source: input, description: "Days the verifier declares it will retain the disclosed data; must be <= Verifier.retention_ceiling_days.", constraints: ">= 0" }
      - { name: state, type: enum, source: system, description: "Branching lifecycle with divergent side-effect sets per branch.", default: REQUESTED, constraints: "REQUESTED | CONSENT_PENDING | CONSENT_GRANTED | COMPLETED | DENIED_BY_HOLDER | BLOCKED_BY_POLICY | ABORTED" }
      - { name: minimized_elements, type: array, source: computed, description: "requested_elements intersected with the context allow-list, in canonical CORE_ELEMENTS order; output of presentation_minimization_projection.", default: "[]" }
      - { name: withheld_elements, type: array, source: computed, description: "requested_elements minus the context allow-list, in canonical CORE_ELEMENTS order.", default: "[]" }
      - { name: disclosed_element_count, type: integer, source: computed, description: "len(minimized_elements) once the session reaches COMPLETED; 0 otherwise.", default: 0 }
      - { name: excess_element_count, type: integer, source: computed, description: "len(withheld_elements); feeds verifier_exposure_index.", default: 0 }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Amount billed at disclosure; 0 unless the session reached COMPLETED.", default: 0 }
      - { name: billing_state, type: enum, source: computed, description: "Billing posture of this disclosure.", default: UNBILLED, constraints: "UNBILLED | BILLED | VOIDED" }
      - { name: consent_unlock_method, type: enum, source: computed, description: "Unlock method the holder proved at consent; must equal DigitalCredential.protection_method_at_activation.", constraints: "BIOMETRIC | PASSCODE" }
      - { name: abort_reason, type: enum, source: computed, description: "Why the system aborted an in-flight session; null unless state == ABORTED.", constraints: "CREDENTIAL_UPDATE_PENDING | CREDENTIAL_REVOKED | VERIFIER_TERMINATED" }
      - { name: age_attestation_only, type: boolean, source: computed, description: "True when context == AGE_ONLY and minimized_elements is a subset of {age_over_18, age_over_21}.", default: false }
      - { name: opened_at, type: datetime, source: computed, description: "Logical clock value at session creation." }

  - name: PresentationLogEntry
    parent: PresentationSession
    common_fields: false
    fields:
      - { name: presentation_session_id, type: string, source: input, description: "FK -> PresentationSession.id; the session this entry records. Append-only." }
      - { name: verifier_id, type: string, source: input, description: "FK -> Verifier.id; the verifier that made the request." }
      - { name: credential_pseudonym, type: string, source: system, description: "Per-verifier salted pseudonym of the credential. Deliberately NOT the credential id: two verifiers logging the same credential get different pseudonyms, so logs cannot be joined to track a holder." }
      - { name: outcome, type: enum, source: system, description: "Terminal branch the session took.", constraints: "DISCLOSED | DENIED_BY_HOLDER | BLOCKED_BY_POLICY | ABORTED" }
      - { name: disclosed_element_count, type: integer, source: system, description: "PresentationSession.disclosed_element_count at the moment of logging.", default: 0 }
      - { name: excess_element_count, type: integer, source: system, description: "PresentationSession.excess_element_count at the moment of logging.", default: 0 }
      - { name: retention_days_declared, type: integer, source: system, description: "PresentationSession.retention_days at the moment of logging; compared with Verifier.retention_ceiling_days by verifier_exposure_index.", default: 0 }
      - { name: billed_amount_cents, type: integer, source: system, description: "Amount billed for this entry.", default: 0 }
      - { name: billing_state, type: enum, source: system, description: "Billing posture of this entry; VOIDED after a compensating void-billing call.", default: UNBILLED, constraints: "UNBILLED | BILLED | VOIDED" }
      - { name: pseudonym_reuse_index, type: integer, source: computed, description: "count(PresentationLogEntry with the same verifier_id and credential_pseudonym and strictly earlier recorded_at) + 1; at >= 3 the entry counts as a tracking signal in verifier_exposure_index.", default: 1 }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock value at append; the window comparand for both verifier_exposure_index variants." }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- CYCLIC: COLLECTING -> SUBMITTED -> RETURNED -> COLLECTING ------------
  - entity: IdentityProofingSession
    state_field: state
    initial_state: COLLECTING
    terminal_states: [DENIED, EXPIRED, CONSUMED]
    shape: cyclic
    transitions:
      - from: COLLECTING
        to: SUBMITTED
        trigger: "POST /mdl/proofing-sessions/{id}/submit"
        actor: ProofingAgent
        preconditions:
          - "state == COLLECTING"
          - "evidence_count >= 2, else ERR_INSUFFICIENT_EVIDENCE"
          - "Holder(holder_id).physical_credential_status == VALID, else ERR_PHYSICAL_CREDENTIAL_INELIGIBLE"
          - "Holder(holder_id).physical_credential_expires_on > date(current_utc), else ERR_PHYSICAL_CREDENTIAL_INELIGIBLE"
        side_effects:
          - "submission_count += 1"
          - "IdentityProofingSession.version += 1; updated_at = current_utc"
        note: "Each resubmission after the first costs 25 points in proofing_assurance_score variant ADJUDICATION_STRICT."

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /mdl/proofing-sessions/{id}/adjudicate with decision == VERIFY"
        actor: CredentialAdjudicator
        preconditions:
          - "state == SUBMITTED, else ERR_INVALID_STATE"
          - "X-User-ID != proofing_agent_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "proofing_assurance_score(ADJUDICATION_STRICT) >= 260, else ERR_ASSURANCE_LEVEL_INSUFFICIENT"
        side_effects:
          - "recompute ProofingEvidence.superseded for every evidence row of this session"
          - "adjudication_score = proofing_assurance_score(ADJUDICATION_STRICT)"
          - "achieved_assurance_level = IAL2 when adjudication_score >= 420, IAL1_5 when >= 260, else IAL1"
          - "verified_at = current_utc; assurance_expires_at = current_utc + InteropProfile.proofing_validity_days days"
          - "adjudicator_user_id = X-User-ID; return_reason = null"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /mdl/proofing-sessions/{id}/adjudicate with decision == RETURN"
        actor: CredentialAdjudicator
        preconditions:
          - "state == SUBMITTED, else ERR_INVALID_STATE"
          - "X-User-ID != proofing_agent_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "return_reason present in body, else ERR_INVALID_REQUEST"
        side_effects:
          - "return_reason = body.return_reason; adjudicator_user_id = X-User-ID"
          - "adjudication_score = proofing_assurance_score(ADJUDICATION_STRICT) (recorded but not used for a level)"

      - from: RETURNED
        to: COLLECTING
        trigger: "POST /mdl/proofing-sessions/{id}/evidence (appending evidence to a RETURNED session reopens it)"
        actor: ProofingAgent
        preconditions:
          - "state == RETURNED"
        side_effects:
          - "state = COLLECTING; return_reason = null"
          - "evidence_count += 1"
        note: "This edge closes the cycle COLLECTING -> SUBMITTED -> RETURNED -> COLLECTING."

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /mdl/proofing-sessions/{id}/adjudicate with decision == DENY"
        actor: CredentialAdjudicator
        preconditions:
          - "state == SUBMITTED, else ERR_INVALID_STATE"
          - "X-User-ID != proofing_agent_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "adjudicator_user_id = X-User-ID; achieved_assurance_level = null"

      - from: VERIFIED
        to: CONSUMED
        trigger: "system, during POST /mdl/credentials when this session is named as proofing_session_id"
        actor: system
        preconditions:
          - "state == VERIFIED"
          - "assurance_expires_at > current_utc, else ERR_PROOFING_ASSURANCE_EXPIRED"
        side_effects:
          - "state = CONSUMED (a session backs exactly one provisioning)"

      - from: VERIFIED
        to: EXPIRED
        trigger: "system, lazily evaluated on GET /mdl/proofing-sessions/{id} and on POST /mdl/credentials when current_utc >= assurance_expires_at"
        actor: system
        preconditions:
          - "state == VERIFIED"
          - "current_utc >= assurance_expires_at"
        side_effects:
          - "state = EXPIRED; achieved_assurance_level retained for audit"

  # --- BRANCHING at attestation, CYCLIC at loss ----------------------------
  - entity: Device
    state_field: state
    initial_state: REGISTERED
    terminal_states: [WIPED, RETIRED]
    shape: branching_with_cycle
    transitions:
      - from: REGISTERED
        to: ATTESTED
        trigger: "POST /mdl/devices/{id}/attest with attestation_result == PASS"
        actor: SystemAdmin
        preconditions:
          - "state == REGISTERED, else ERR_INVALID_STATE"
          - "Holder(holder_id).bound_device_count < InteropProfile.max_devices_per_holder, else ERR_DEVICE_LIMIT_EXCEEDED"
        side_effects:
          - "attestation_result = PASS; secure_element_grade = body.secure_element_grade"
          - "Holder.bound_device_count += 1"
          - "Device.version += 1"

      - from: REGISTERED
        to: RETIRED
        trigger: "POST /mdl/devices/{id}/attest with attestation_result == FAIL"
        actor: SystemAdmin
        preconditions:
          - "state == REGISTERED, else ERR_INVALID_STATE"
        side_effects:
          - "attestation_result = FAIL; secure_element_grade = body.secure_element_grade"
          - "Holder.bound_device_count unchanged (a RETIRED device never counted)"
          - "Device.version += 1"
        note: "Divergent branch: the PASS edge increments Holder.bound_device_count, the FAIL edge does not."

      - from: ATTESTED
        to: BOUND
        trigger: "system, during POST /mdl/credentials when this device is named as device_id"
        actor: system
        preconditions:
          - "state IN {ATTESTED, BOUND}, else ERR_DEVICE_BINDING_MISMATCH"
        side_effects:
          - "active_binding_count += 1"
          - "Device.version += 1"
        note: "A device already in BOUND stays BOUND when a further credential is provisioned onto it (renewal or a second validity window); only active_binding_count and version move. The state edge itself fires once, on the first provisioning."

      - from: BOUND
        to: LOST_REPORTED
        trigger: "POST /mdl/devices/{id}/report-lost"
        actor: Holder
        preconditions:
          - "state == BOUND, else ERR_INVALID_STATE"
        side_effects:
          - "lost_reported_at = current_utc; Device.version += 1"
          - "CASCADE HOP 1: every DigitalCredential with device_id == this.id and lifecycle_state == ACTIVE transitions ACTIVE -> SUSPENDED with suspend_reason = DEVICE_LOST"
          - "CASCADE HOP 2 (caused by hop 1, not by this call): each ACTIVE -> SUSPENDED transition appends RevocationEntry(status=SUSPENDED, reason=DEVICE_LOST) and decrements Holder.active_credential_count by 1"
          - "CASCADE HOP 3 (caused by hop 2): each appended RevocationEntry sets the newest TrustListSnapshot of the active InteropProfile to revocation_pointer_stale = true, increments its pending_delta_count by 1 and increments InteropProfile.pending_republish_count by 1"

      - from: LOST_REPORTED
        to: BOUND
        trigger: "POST /mdl/devices/{id}/recover"
        actor: Holder
        preconditions:
          - "state == LOST_REPORTED, else ERR_INVALID_STATE"
          - "reattestation_token present, else ERR_INVALID_REQUEST"
        side_effects:
          - "lost_reported_at = null; Device.version += 1"
          - "COMPENSATION HOP 1: every DigitalCredential with device_id == this.id, lifecycle_state == SUSPENDED and suspend_reason == DEVICE_LOST transitions SUSPENDED -> ACTIVE with suspend_reason = null"
          - "COMPENSATION HOP 2 (caused by hop 1): each SUSPENDED -> ACTIVE transition appends RevocationEntry(status=REINSTATED, reason=RECOVERY) and increments Holder.active_credential_count by 1"
          - "COMPENSATION HOP 3 (caused by hop 2): each appended RevocationEntry sets the newest TrustListSnapshot to revocation_pointer_stale = true and increments pending_delta_count and InteropProfile.pending_republish_count by 1"
        note: "Closes the BOUND <-> LOST_REPORTED cycle and restores the Holder.active_credential_count invariant exactly."

      - from: LOST_REPORTED
        to: WIPED
        trigger: "POST /mdl/devices/{id}/wipe"
        actor: SystemAdmin
        preconditions:
          - "state == LOST_REPORTED, else ERR_INVALID_STATE"
        side_effects:
          - "active_binding_count = 0; Holder.bound_device_count -= 1; Device.version += 1"
          - "every DigitalCredential with device_id == this.id and lifecycle_state == SUSPENDED transitions SUSPENDED -> REVOKED with reason DEVICE_LOST"
          - "each such revocation appends RevocationEntry(status=REVOKED, reason=DEVICE_LOST) and increments Holder.revoked_credential_count by 1"

  # --- PARALLEL AXIS 1 of 2 on DigitalCredential: lifecycle_state ----------
  - entity: DigitalCredential
    state_field: lifecycle_state
    dimension: "axis 1 of 2 - evolves independently of sync_state"
    initial_state: PENDING_PROVISION
    terminal_states: [REPLACED, REVOKED, EXPIRED]
    shape: parallel_dimension_with_cycle
    transitions:
      - from: PENDING_PROVISION
        to: ACTIVE
        trigger: "POST /mdl/credentials/{id}/activate"
        actor: Holder
        preconditions:
          - "lifecycle_state == PENDING_PROVISION, else ERR_INVALID_STATE"
          - "X-User-ID == holder_id, else ERR_NOT_RESOURCE_OWNER"
          - "Device(device_id).state IN {ATTESTED, BOUND}, else ERR_DEVICE_BINDING_MISMATCH"
          - "IdentityProofingSession(proofing_session_id).state == CONSUMED, else ERR_INVALID_STATE"
          - "Holder(holder_id).physical_credential_status == VALID, else ERR_PHYSICAL_CREDENTIAL_INELIGIBLE"
          - "body.device_unlock_proof == Device(device_id).protection_method, else ERR_PROTECTION_METHOD_MISMATCH"
          - "Holder(holder_id).active_credential_count < InteropProfile.max_active_credentials_per_holder, else ERR_ACTIVE_CREDENTIAL_LIMIT_EXCEEDED"
        side_effects:
          - "activated_at = current_utc; protection_method_at_activation = Device.protection_method"
          - "Holder.active_credential_count += 1"
          - "when supersedes_credential_id is non-null and that credential's lifecycle_state IN {ACTIVE, SUSPENDED}: it transitions to REPLACED, appends RevocationEntry(status=REVOKED, reason=RENEWAL_SUPERSEDE), and Holder.active_credential_count is decremented by 1 if it had been ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, from Device BOUND -> LOST_REPORTED, from PATCH /mdl/holders/{id}/physical-credential setting status SUSPENDED, or from the second FAILED UpdateDelivery on this credential"
        actor: system
        preconditions:
          - "lifecycle_state == ACTIVE"
        side_effects:
          - "suspend_reason = DEVICE_LOST | PHYSICAL_CREDENTIAL_SUSPENDED | UPDATE_FAILED depending on the originating cause"
          - "Holder.active_credential_count -= 1"
          - "append RevocationEntry(status=SUSPENDED)"
          - "every PresentationSession with credential_id == this.id and state IN {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED} transitions to ABORTED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system, from Device LOST_REPORTED -> BOUND (only credentials whose suspend_reason == DEVICE_LOST), or from PATCH /mdl/holders/{id}/physical-credential restoring status VALID (only suspend_reason == PHYSICAL_CREDENTIAL_SUSPENDED)"
        actor: system
        preconditions:
          - "lifecycle_state == SUSPENDED"
          - "suspend_reason matches the originating cause"
          - "current_utc < valid_until"
        side_effects:
          - "suspend_reason = null; Holder.active_credential_count += 1"
          - "append RevocationEntry(status=REINSTATED)"
        note: "Closes the ACTIVE <-> SUSPENDED cycle on axis 1."

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /mdl/credentials/{id}/revoke"
        actor: SystemAdmin
        preconditions:
          - "lifecycle_state IN {ACTIVE, SUSPENDED}, else ERR_INVALID_STATE"
        side_effects:
          - "Holder.active_credential_count -= 1; Holder.revoked_credential_count += 1"
          - "Device.active_binding_count -= 1"
          - "append RevocationEntry(status=REVOKED, reason = body.reason); revocation_sequence = new entry sequence"
          - "every PresentationSession with credential_id == this.id and state IN {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED} transitions to ABORTED with abort_reason = CREDENTIAL_REVOKED"
          - "newest TrustListSnapshot revocation_pointer_stale = true, pending_delta_count += 1, InteropProfile.pending_republish_count += 1"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /mdl/credentials/{id}/revoke, or system from Device LOST_REPORTED -> WIPED"
        actor: SystemAdmin
        preconditions:
          - "lifecycle_state == SUSPENDED"
        side_effects:
          - "Holder.revoked_credential_count += 1 (active_credential_count already decremented at suspension)"
          - "Device.active_binding_count -= 1"
          - "append RevocationEntry(status=REVOKED)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system, lazily evaluated on GET /mdl/credentials/{id} and on POST /mdl/presentation-sessions when current_utc >= valid_until"
        actor: system
        preconditions:
          - "lifecycle_state == ACTIVE"
          - "current_utc >= valid_until"
        side_effects:
          - "Holder.active_credential_count -= 1; Device.active_binding_count -= 1"
          - "append RevocationEntry(status=EXPIRED, reason=VALIDITY_LAPSED)"

      - from: ACTIVE
        to: REPLACED
        trigger: "system, when a successor credential naming this row as supersedes_credential_id reaches ACTIVE"
        actor: system
        preconditions:
          - "lifecycle_state IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "Holder.active_credential_count -= 1 if it had been ACTIVE"
          - "append RevocationEntry(status=REVOKED, reason=RENEWAL_SUPERSEDE)"
          - "Device(device_id).reprovision_count += 1"

  # --- PARALLEL AXIS 2 of 2 on DigitalCredential: sync_state ---------------
  - entity: DigitalCredential
    state_field: sync_state
    dimension: "axis 2 of 2 - evolves independently of lifecycle_state; a credential can be ACTIVE+UPDATE_PENDING or SUSPENDED+IN_SYNC"
    initial_state: IN_SYNC
    terminal_states: []
    shape: parallel_dimension_cyclic
    transitions:
      - from: IN_SYNC
        to: UPDATE_PENDING
        trigger: "system, when an UpdateDelivery is created against this credential"
        actor: system
        preconditions:
          - "sync_state IN {IN_SYNC, UPDATE_FAILED}"
        side_effects:
          - "pending_update_count += 1"

      - from: UPDATE_PENDING
        to: IN_SYNC
        trigger: "system, from UpdateDelivery PENDING -> DELIVERED"
        actor: system
        preconditions:
          - "sync_state == UPDATE_PENDING"
          - "pending_update_count == 1 (this was the last outstanding delivery)"
        side_effects:
          - "doc_version += 1; address_version_synced = UpdateOrder.target_address_version"
          - "restriction_codes = Holder.restriction_codes"
          - "pending_update_count -= 1"

      - from: UPDATE_PENDING
        to: UPDATE_FAILED
        trigger: "system, from the first UpdateDelivery PENDING -> FAILED on this credential"
        actor: system
        preconditions:
          - "sync_state == UPDATE_PENDING"
          - "failed_delivery_count == 0 before this failure"
        side_effects:
          - "pending_update_count -= 1; failed_delivery_count += 1"

      - from: UPDATE_FAILED
        to: UPDATE_PENDING
        trigger: "system, when a later UpdateOrder opens a new UpdateDelivery against this credential"
        actor: system
        preconditions:
          - "sync_state == UPDATE_FAILED"
        side_effects:
          - "pending_update_count += 1"
        note: "Closes the UPDATE_PENDING <-> UPDATE_FAILED cycle on axis 2."

      - from: UPDATE_PENDING
        to: STALE
        trigger: "system, from the second UpdateDelivery PENDING -> FAILED on this credential"
        actor: system
        preconditions:
          - "sync_state == UPDATE_PENDING"
          - "failed_delivery_count == 1 before this failure"
        side_effects:
          - "pending_update_count -= 1; failed_delivery_count += 1"
          - "CROSS-AXIS COUPLING: lifecycle_state ACTIVE -> SUSPENDED with suspend_reason = UPDATE_FAILED (the only edge where axis 2 forces axis 1)"

      - from: STALE
        to: UPDATE_PENDING
        trigger: "system, when a later UpdateOrder opens a new UpdateDelivery against this credential"
        actor: system
        preconditions:
          - "sync_state == STALE"
        side_effects:
          - "pending_update_count += 1"

  # --- COMPOUND: status = f(child UpdateDelivery states) -------------------
  - entity: UpdateOrder
    state_field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, FAILED_CLOSED]
    shape: compound
    transitions:
      - from: NONE
        to: OPEN
        trigger: "POST /mdl/holders/{id}/address-change (reason ADDRESS_CHANGE), POST /mdl/credentials/{id}/renew (reason RENEWAL), or PATCH /mdl/holders/{id}/physical-credential with restriction_codes present (reason RESTRICTION_CHANGE)"
        actor: SystemAdmin
        preconditions:
          - "Holder exists, else ERR_HOLDER_NOT_FOUND"
        side_effects:
          - "CASCADE HOP 1: Holder.address_version += 1 (ADDRESS_CHANGE only); UpdateOrder created with status = OPEN, opened_at = current_utc, target_address_version = Holder.address_version after the bump"
          - "CASCADE HOP 2 (caused by hop 1): one UpdateDelivery(status=PENDING) is created for every DigitalCredential with holder_id == this.holder_id and lifecycle_state IN {ACTIVE, SUSPENDED}, ordered by DigitalCredential.created_at ASC"
          - "CASCADE HOP 3 (caused by hop 2): every created UpdateDelivery drives its target credential's sync_state to UPDATE_PENDING and increments DigitalCredential.pending_update_count by 1"
          - "CASCADE HOP 4 (caused by hop 3): a credential entering sync_state UPDATE_PENDING aborts every PresentationSession with that credential_id and state IN {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED}, setting state = ABORTED and abort_reason = CREDENTIAL_UPDATE_PENDING"
          - "CASCADE HOP 5 (caused by hop 4): every aborted PresentationSession appends PresentationLogEntry(outcome=ABORTED, billed_amount_cents=0, billing_state=UNBILLED) and decrements Verifier.open_session_count by 1"
          - "any pre-existing UpdateDelivery with status == PENDING against the same credential from an older UpdateOrder transitions PENDING -> SUPERSEDED"
          - "update_order_status_rollup runs; when delivery_count == 0 the order transitions OPEN -> COMPLETED inside the same request"

      - from: OPEN
        to: PARTIALLY_DELIVERED
        trigger: "system, update_order_status_rollup after a child UpdateDelivery leaves PENDING"
        actor: system
        preconditions:
          - "0 < delivered_count + failed_count < delivery_count"
        side_effects:
          - "delivered_count / failed_count refreshed"

      - from: OPEN
        to: COMPLETED
        trigger: "system, update_order_status_rollup at creation (delivery_count == 0) or after the only child is DELIVERED"
        actor: system
        preconditions:
          - "delivery_count == 0, or delivered_count == delivery_count"
        side_effects:
          - "closed_at = current_utc"
        note: "delivery_count == 0 is the empty-set boundary: an address change for a holder with no ACTIVE/SUSPENDED credential still yields a real UpdateOrder, immediately COMPLETED, never an error."

      - from: PARTIALLY_DELIVERED
        to: COMPLETED
        trigger: "system, update_order_status_rollup"
        actor: system
        preconditions:
          - "delivered_count == delivery_count"
        side_effects:
          - "closed_at = current_utc"

      - from: OPEN
        to: FAILED_CLOSED
        trigger: "system, update_order_status_rollup"
        actor: system
        preconditions:
          - "delivered_count + failed_count == delivery_count and failed_count > 0"
        side_effects:
          - "closed_at = current_utc"

      - from: PARTIALLY_DELIVERED
        to: FAILED_CLOSED
        trigger: "system, update_order_status_rollup"
        actor: system
        preconditions:
          - "delivered_count + failed_count == delivery_count and failed_count > 0"
        side_effects:
          - "closed_at = current_utc"

  - entity: UpdateDelivery
    state_field: status
    initial_state: PENDING
    terminal_states: [DELIVERED, FAILED, SUPERSEDED]
    shape: branching
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /mdl/update-deliveries/{id}/deliver"
        actor: SystemAdmin
        preconditions:
          - "status == PENDING, else ERR_DELIVERY_NOT_PENDING"
          - "Device(DigitalCredential(credential_id).device_id).state == BOUND, else ERR_DEVICE_NOT_BOUND"
          - "DigitalCredential(credential_id).lifecycle_state IN {ACTIVE, SUSPENDED}, else ERR_INVALID_STATE"
        side_effects:
          - "attempt_count += 1; delivered_at = current_utc; device_receipt_token = body.device_receipt_token"
          - "credential sync_state UPDATE_PENDING -> IN_SYNC when pending_update_count was 1; doc_version += 1; address_version_synced = UpdateOrder.target_address_version; restriction_codes = Holder.restriction_codes"
          - "resulting_doc_version = DigitalCredential.doc_version after the bump"
          - "update_order_status_rollup on the owning UpdateOrder"

      - from: PENDING
        to: FAILED
        trigger: "POST /mdl/update-deliveries/{id}/fail"
        actor: SystemAdmin
        preconditions:
          - "status == PENDING, else ERR_DELIVERY_NOT_PENDING"
        side_effects:
          - "attempt_count += 1; failure_code = body.failure_code"
          - "credential failed_delivery_count += 1; sync_state UPDATE_PENDING -> UPDATE_FAILED on the first failure, UPDATE_PENDING -> STALE on the second"
          - "on the second failure only: credential lifecycle_state ACTIVE -> SUSPENDED with suspend_reason = UPDATE_FAILED, which appends RevocationEntry(status=SUSPENDED, reason=UPDATE_FAILED) and decrements Holder.active_credential_count by 1"
          - "update_order_status_rollup on the owning UpdateOrder"

      - from: PENDING
        to: SUPERSEDED
        trigger: "system, when a newer UpdateOrder for the same holder opens a delivery against the same credential"
        actor: system
        preconditions:
          - "status == PENDING"
        side_effects:
          - "excluded from delivery_count of its owning UpdateOrder; update_order_status_rollup re-runs on that order"

  # --- CYCLIC: APPROVED <-> PROBATION <-> SUSPENDED ------------------------
  - entity: Verifier
    state_field: trust_status
    initial_state: APPLIED
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /mdl/verifiers/{id}/trust-decision with decision == APPROVE"
        actor: SystemAdmin
        preconditions:
          - "trust_status == APPLIED, else ERR_INVALID_STATE"
        side_effects:
          - "Verifier.version += 1"

      - from: APPROVED
        to: PROBATION
        trigger: "POST /mdl/verifiers/{id}/trust-decision with decision == PROBATION, or system when a verifier_exposure_index recompute yields exposure_index >= 60 and < 90"
        actor: SystemAdmin
        preconditions:
          - "trust_status == APPROVED"
        side_effects:
          - "probation_strike_count += 1 when the cause was a threshold breach"
          - "reader apps stay LISTED; verifier_invoice_amount_cents now applies PROBATION_SURCHARGE_PCT = 0.15 to every line"

      - from: PROBATION
        to: APPROVED
        trigger: "POST /mdl/verifiers/{id}/trust-decision with decision == REINSTATE"
        actor: SystemAdmin
        preconditions:
          - "trust_status == PROBATION, else ERR_INVALID_STATE"
          - "exposure_index < 60, else ERR_INVALID_STATE"
          - "last_attestation_at is not null, else ERR_INVALID_STATE"
        side_effects:
          - "Verifier.version += 1"
        note: "Closes the APPROVED <-> PROBATION cycle."

      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /mdl/verifiers/{id}/trust-decision with decision == SUSPEND, or system when a verifier_exposure_index recompute yields exposure_index >= 90"
        actor: SystemAdmin
        preconditions:
          - "trust_status IN {APPROVED, PROBATION}"
        side_effects:
          - "probation_strike_count += 1 when the cause was a threshold breach"
          - "every PresentationSession of this verifier's reader apps in state IN {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED} is unaffected; new sessions are rejected with ERR_VERIFIER_NOT_TRUSTED"

      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /mdl/verifiers/{id}/trust-decision with decision == REINSTATE"
        actor: SystemAdmin
        preconditions:
          - "trust_status == SUSPENDED, else ERR_INVALID_STATE"
          - "exposure_index < 60, else ERR_INVALID_STATE"
        side_effects:
          - "Verifier.version += 1"

      - from: APPROVED
        to: TERMINATED
        trigger: "POST /mdl/verifiers/{id}/trust-decision with decision == TERMINATE"
        actor: SystemAdmin
        preconditions:
          - "trust_status != TERMINATED, else ERR_INVALID_STATE"
        side_effects:
          - "every ReaderApp with verifier_id == this.id and trust_state == LISTED becomes DELISTED"
          - "every PresentationSession of those reader apps in state IN {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED} transitions to ABORTED with abort_reason = VERIFIER_TERMINATED, each appending PresentationLogEntry(outcome=ABORTED) and decrementing open_session_count by 1"

  # --- BRANCHING with divergent side-effect sets per branch -----------------
  - entity: PresentationSession
    state_field: state
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED_BY_HOLDER, BLOCKED_BY_POLICY, ABORTED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: CONSENT_PENDING
        trigger: "system, inside POST /mdl/presentation-sessions when every trust and freshness gate passes"
        actor: system
        preconditions:
          - "ReaderApp(reader_app_id).trust_state == LISTED, else ERR_READER_NOT_TRUSTED"
          - "the newest TrustListSnapshot of the active InteropProfile satisfies effective_from <= current_utc < effective_until, else ERR_READER_NOT_TRUSTED"
          - "Verifier.trust_status IN {APPROVED, PROBATION}, else ERR_VERIFIER_NOT_TRUSTED"
          - "DigitalCredential(credential_id).lifecycle_state == ACTIVE, else ERR_INVALID_STATE"
          - "DigitalCredential(credential_id).sync_state == IN_SYNC, else the session forks to BLOCKED_BY_POLICY"
          - "revocation_status_projection(credential).staleness_seconds <= InteropProfile.revocation_freshness_seconds, else the session forks to BLOCKED_BY_POLICY"
        side_effects:
          - "presentation_minimization_projection writes minimized_elements, withheld_elements, excess_element_count, age_attestation_only"
          - "Verifier.open_session_count += 1; opened_at = current_utc"

      - from: REQUESTED
        to: BLOCKED_BY_POLICY
        trigger: "system, inside POST /mdl/presentation-sessions when the credential is not presentable"
        actor: system
        preconditions:
          - "DigitalCredential.sync_state != IN_SYNC, or revocation_status_projection(credential).staleness_seconds > InteropProfile.revocation_freshness_seconds"
        side_effects:
          - "append PresentationLogEntry(outcome=BLOCKED_BY_POLICY, disclosed_element_count=0, billed_amount_cents=0, billing_state=UNBILLED)"
          - "Verifier.open_session_count unchanged (the session never opened)"
          - "no billing, no ReaderApp.query_count increment"
        note: "Divergent branch A of the fork: logged, never billed, never counted as a query."

      - from: CONSENT_PENDING
        to: CONSENT_GRANTED
        trigger: "POST /mdl/presentation-sessions/{id}/consent with consent_decision == APPROVE"
        actor: Holder
        preconditions:
          - "state == CONSENT_PENDING, else ERR_SESSION_NOT_CONSENT_PENDING"
          - "X-User-ID == DigitalCredential(credential_id).holder_id, else ERR_NOT_RESOURCE_OWNER"
          - "body.unlock_method == DigitalCredential.protection_method_at_activation, else ERR_PROTECTION_METHOD_MISMATCH"
        side_effects:
          - "consent_unlock_method = body.unlock_method"

      - from: CONSENT_PENDING
        to: DENIED_BY_HOLDER
        trigger: "POST /mdl/presentation-sessions/{id}/consent with consent_decision == DENY"
        actor: Holder
        preconditions:
          - "state == CONSENT_PENDING, else ERR_SESSION_NOT_CONSENT_PENDING"
          - "X-User-ID == DigitalCredential(credential_id).holder_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "append PresentationLogEntry(outcome=DENIED_BY_HOLDER, disclosed_element_count=0, excess_element_count = session.excess_element_count, billed_amount_cents=0, billing_state=UNBILLED)"
          - "Verifier.open_session_count -= 1"
          - "no billing, no ReaderApp.query_count increment"
        note: "Divergent branch B of the fork: logged with the excess count (so an over-asking reader still accrues exposure) but never billed."

      - from: CONSENT_GRANTED
        to: COMPLETED
        trigger: "POST /mdl/presentation-sessions/{id}/disclose"
        actor: VerifierOperator
        preconditions:
          - "state == CONSENT_GRANTED, else ERR_INVALID_STATE"
          - "X-User-ID == ReaderApp(reader_app_id).verifier_id, else ERR_NOT_RESOURCE_OWNER"
          - "retention_days <= Verifier.retention_ceiling_days, else ERR_RETENTION_CEILING_EXCEEDED"
          - "Verifier.billable_query_balance_cents <= 50000, else ERR_VERIFIER_ACCOUNT_DELINQUENT"
        side_effects:
          - "disclosed_element_count = len(minimized_elements); billed_amount_cents = ReaderApp.base_rate_cents; billing_state = BILLED"
          - "ReaderApp.query_count += 1; ReaderApp.volume_discount_pct recomputed"
          - "Verifier.billable_query_balance_cents += billed_amount_cents; Verifier.open_session_count -= 1"
          - "append PresentationLogEntry(outcome=DISCLOSED, billing_state=BILLED, pseudonym_reuse_index computed)"
          - "Verifier.exposure_index recomputed by verifier_exposure_index variant ROLLING_WINDOW; if it lands >= 60 the verifier auto-transitions APPROVED -> PROBATION, if >= 90 it auto-transitions to SUSPENDED"
        note: "Divergent branch C of the fork: the only branch that bills, increments query_count and moves the exposure index."

      - from: CONSENT_PENDING
        to: ABORTED
        trigger: "system, from an UpdateDelivery creation against the credential, from a credential revocation, or from Verifier -> TERMINATED"
        actor: system
        preconditions:
          - "state IN {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED}"
        side_effects:
          - "abort_reason = CREDENTIAL_UPDATE_PENDING | CREDENTIAL_REVOKED | VERIFIER_TERMINATED"
          - "append PresentationLogEntry(outcome=ABORTED, disclosed_element_count=0, billed_amount_cents=0, billing_state=UNBILLED)"
          - "Verifier.open_session_count -= 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` - the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: credential-provision-stale-device
    parent_entity: Device
    write_endpoint: "POST /mdl/credentials"
    occ_field: "expected_device_version"
    description: |
      Provisioning a DigitalCredential onto a Device whose version has advanced
      since the client last observed it is rejected. This is the CREATE-with-supersede
      case: a provisioning that names supersedes_credential_id legitimately replaces
      the prior credential on that handset, so a second provisioning built on a stale
      view of the device would silently replace a credential the client never saw.
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412

  - rule_id: trust-list-publish-stale-profile
    parent_entity: InteropProfile
    write_endpoint: "POST /mdl/trust-list-snapshots"
    occ_field: "expected_interop_profile_version"
    description: |
      Publishing a TrustListSnapshot against an InteropProfile whose version has
      advanced since the client last read it is rejected. A published snapshot
      supersedes the prior one for readers, so a publication derived from a stale
      profile view would distribute an outdated standard_version and reader set.
    error_id: ERR_STALE_INTEROP_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: proofing_assurance_score
    trigger: "Variant ADJUDICATION_STRICT runs on every POST /mdl/proofing-sessions/{id}/adjudicate (writing IdentityProofingSession.adjudication_score and, on VERIFY, achieved_assurance_level). Both variants are returned side by side by GET /mdl/proofing-sessions/{id}/assurance-preview."
    algorithm: threshold
    formula: |
      # ---- variant ADJUDICATION_STRICT (authoritative, writes the entity) ----
      # For each evidence_type T that appears at least once in this session:
      #   candidates(T) = [e in ProofingEvidence where e.proofing_session_id == session.id
      #                    and e.evidence_type == T]
      #   latest(T)     = the element of candidates(T) with the greatest captured_at;
      #                   tie-break: smallest created_at (ASC). `id` is NEVER consulted.
      #   pts_strict[T] = POINTS[T][latest(T).quality]
      # raw_strict      = sum(pts_strict[T] over all T present)
      # penalty         = REPEAT_ATTEMPT_PENALTY_CENTS_FREE * max(0, session.submission_count - 1)
      # score_strict    = max(0, raw_strict - penalty)
      #
      # ---- variant PREVIEW_OPTIMISTIC (advisory, never written to the entity) ----
      #   pts_preview[T] = max(POINTS[T][e.quality] for e in candidates(T))   # recency ignored
      # score_preview    = sum(pts_preview[T] over all T present)             # no penalty
      #
      # ---- level mapping, applied to whichever score the caller asked for ----
      # level(s) = IAL2   if s >= IAL2_MIN_SCORE        (>= is inclusive: 420 -> IAL2)
      #          = IAL1_5 if s >= IAL1_5_MIN_SCORE      (>= is inclusive: 260 -> IAL1_5)
      #          = IAL1   otherwise
    input_set: "Every ProofingEvidence row of the session, with no status filter (evidence is immutable and never withdrawn). ProofingEvidence.superseded is a derived label written by the ADJUDICATION_STRICT pass; it does not filter the PREVIEW_OPTIMISTIC pass."
    constants:
      POINTS:
        DOCUMENT_SCAN: { STRONG: 250, FAIR: 150, WEAK: 60 }
        BIOMETRIC_MATCH: { STRONG: 200, FAIR: 120, WEAK: 40 }
        KNOWLEDGE_CHECK: { STRONG: 90, FAIR: 50, WEAK: 20 }
        ADDRESS_CORROBORATION: { STRONG: 80, FAIR: 40, WEAK: 10 }
      REPEAT_ATTEMPT_PENALTY_CENTS_FREE: 25
      IAL2_MIN_SCORE: 420
      IAL1_5_MIN_SCORE: 260
    precision: "integer points, no rounding"
    variants:
      - name: ADJUDICATION_STRICT
        when: "POST /mdl/proofing-sessions/{id}/adjudicate, and the adjudication_* fields of GET /mdl/proofing-sessions/{id}/assurance-preview"
        difference: "Only the latest-captured evidence item per evidence_type contributes, and each resubmission after the first subtracts 25 points."
      - name: PREVIEW_OPTIMISTIC
        when: "The preview_* fields of GET /mdl/proofing-sessions/{id}/assurance-preview"
        difference: "The strongest item per evidence_type contributes regardless of recency, and no resubmission penalty is applied. For identical evidence this variant is >= the strict variant and strictly greater whenever a weaker item was captured later or submission_count > 1."

  - name: verifier_exposure_index
    trigger: "Variant ROLLING_WINDOW runs on every POST /mdl/presentation-sessions/{id}/disclose and writes Verifier.exposure_index. Variant SINCE_LAST_ATTESTATION runs on every POST /mdl/verifiers/{id}/retention-attestation and also writes Verifier.exposure_index. Both are returned side by side by GET /mdl/verifiers/{id}/exposure-index."
    algorithm: weighted_scoring
    formula: |
      # window(E) is variant-specific (below). Entries are PresentationLogEntry rows
      # with verifier_id == V.id, no outcome filter (a DENIED or ABORTED presentation
      # still records the reader's over-asking).
      # attested_ceiling = V.attested_max_retention_days if not null else V.retention_ceiling_days
      #   NOTE: on POST .../retention-attestation the body's attested_max_retention_days
      #   is used, because the point of the attestation is to score the log against the
      #   newly attested (usually lower) ceiling.
      # over_ceiling = count(e in E where e.retention_days_declared > attested_ceiling)
      # excess       = sum(e.excess_element_count for e in E)
      # reuse        = count(e in E where e.pseudonym_reuse_index >= PSEUDONYM_REUSE_MIN)
      # index = min(INDEX_CEILING,
      #             OVER_CEILING_WEIGHT * over_ceiling
      #           + EXCESS_ELEMENT_WEIGHT * excess
      #           + PSEUDONYM_REUSE_WEIGHT * reuse)
      #
      # Threshold triggers applied immediately after the index is written:
      #   index >= SUSPEND_THRESHOLD (90) and trust_status IN {APPROVED, PROBATION}
      #       -> trust_status = SUSPENDED, probation_strike_count += 1
      #   else index >= PROBATION_THRESHOLD (60) and trust_status == APPROVED
      #       -> trust_status = PROBATION, probation_strike_count += 1
      #   (both comparisons are >= : an index of exactly 60 trips PROBATION, 59 does not)
    input_set: "PresentationLogEntry rows of the verifier inside the variant's window; every outcome value participates."
    constants:
      OVER_CEILING_WEIGHT: 12
      EXCESS_ELEMENT_WEIGHT: 6
      PSEUDONYM_REUSE_WEIGHT: 20
      PSEUDONYM_REUSE_MIN: 3
      ROLLING_WINDOW_DAYS: 30
      INDEX_CEILING: 100
      PROBATION_THRESHOLD: 60
      SUSPEND_THRESHOLD: 90
    precision: "integer, no rounding (all weights are integers)"
    variants:
      - name: ROLLING_WINDOW
        when: "POST /mdl/presentation-sessions/{id}/disclose, and the rolling_window_* fields of GET /mdl/verifiers/{id}/exposure-index"
        difference: "window(E) = entries with (current_utc - 30 days) <= recorded_at <= current_utc, lower bound inclusive."
      - name: SINCE_LAST_ATTESTATION
        when: "POST /mdl/verifiers/{id}/retention-attestation, and the since_last_attestation_* fields of GET /mdl/verifiers/{id}/exposure-index"
        difference: "window(E) = entries with recorded_at >= V.last_attestation_at (inclusive) as it stood BEFORE this attestation; when last_attestation_at is null the window is every entry ever recorded for the verifier. For identical log rows this variant diverges from ROLLING_WINDOW whenever an entry sits outside the 30-day window but inside the since-attestation window, or vice versa."

  - name: verifier_invoice_amount_cents
    trigger: "GET /mdl/verifiers/{id}/invoice"
    algorithm: tiered_pricing
    formula: |
      # surcharge_pct = PROBATION_SURCHARGE_PCT (0.15) when V.trust_status == PROBATION,
      #                 else 0.00
      # For each ReaderApp A where A.verifier_id == V.id and A.trust_state IN {LISTED, DELISTED},
      # iterated in A.created_at ASC order (ties: not possible, created_at is unique per row):
      #   rate_cents(A) = A.base_rate_cents                                if A.query_count <= TIER_1_MAX_QUERIES
      #                 = round_half_up(A.base_rate_cents * TIER_2_FACTOR) if TIER_1_MAX_QUERIES < A.query_count <= TIER_2_MAX_QUERIES
      #                 = round_half_up(A.base_rate_cents * TIER_3_FACTOR) otherwise
      #     (AVERAGE-rate pricing on the whole volume, NOT marginal per-tier pricing)
      #   gross_cents(A) = A.query_count * rate_cents(A)
      #   line_cents(A)  = round_half_up( gross_cents(A)
      #                                   * (1 - A.volume_discount_pct)
      #                                   * (1 + surcharge_pct) )
      #
      # *** PINNED ROUNDING ORDER ***
      # invoice_amount_cents = sum( line_cents(A) )      # round EACH line, THEN sum
      # It is NOT round_half_up(sum(raw_line_value(A))). Two lines whose raw values are
      # both X.5 yield 2*(X+1) under the pinned order and 2X+1 under sum-then-round.
    input_set: "ReaderApp rows of the verifier with trust_state IN {LISTED, DELISTED}; PENDING apps are excluded because they have never been able to serve a query."
    constants:
      TIER_1_MAX_QUERIES: 100
      TIER_2_MAX_QUERIES: 500
      TIER_2_FACTOR: 0.80
      TIER_3_FACTOR: 0.60
      PROBATION_SURCHARGE_PCT: 0.15
      VOLUME_DISCOUNT_MIN_QUERIES: 250
      VOLUME_DISCOUNT_PCT: 0.10
    precision: "whole cents, round_half_up, applied once per invoice line before summation"

  - name: credential_reissuance_settlement_cents
    trigger: "POST /mdl/credentials when supersedes_credential_id is non-null; writes DigitalCredential.reissuance_settlement_cents"
    algorithm: constraint_propagation
    formula: |
      # A circular-looking dependency: the waiver percentage is keyed on a fee total,
      # and the waiver reduces that total. The evaluation order below is PINNED so the
      # value is well defined and NO fixed-point iteration is performed.
      #
      # step 1  rebind_applies    = (body.device_id != prior.device_id)
      #         pre_waiver_total  = BASE_REISSUANCE_FEE_CENTS
      #                           + (EXPEDITE_FEE_CENTS if body.expedite else 0)
      #                           + (DEVICE_REBINDING_FEE_CENTS if rebind_applies else 0)
      # step 2  tier_pct = 0.20 if pre_waiver_total >= WAIVER_TIER_1_MIN_CENTS
      #                  = 0.10 if pre_waiver_total >= WAIVER_TIER_2_MIN_CENTS
      #                  = 0.00 otherwise
      #         *** the tier is selected from pre_waiver_total, NEVER from the settlement ***
      # step 3  extra_pct = LOST_DEVICE_ADDITIONAL_WAIVER_PCT (0.05)
      #                     if prior.lifecycle_state == SUSPENDED
      #                        and prior.suspend_reason == DEVICE_LOST
      #                     else 0.00
      # step 4  waiver_credit_cents = round_half_up(pre_waiver_total * (tier_pct + extra_pct))
      # step 5  reissuance_settlement_cents = pre_waiver_total - waiver_credit_cents
      #
      # Re-deriving the tier from the step-5 result (a fixed-point reading) produces a
      # different, WRONG number and is explicitly forbidden.
    input_set: "The credential named by supersedes_credential_id (`prior`), in any lifecycle_state other than REPLACED; the request body's expedite flag and device_id."
    constants:
      BASE_REISSUANCE_FEE_CENTS: 3000
      EXPEDITE_FEE_CENTS: 1500
      DEVICE_REBINDING_FEE_CENTS: 800
      WAIVER_TIER_1_MIN_CENTS: 5300
      WAIVER_TIER_2_MIN_CENTS: 3800
      LOST_DEVICE_ADDITIONAL_WAIVER_PCT: 0.05
    precision: "whole cents, round_half_up, applied once at step 4"

  - name: presentation_minimization_projection
    trigger: "POST /mdl/presentation-sessions (writes minimized_elements, withheld_elements, excess_element_count, age_attestation_only); re-read unchanged at POST /mdl/presentation-sessions/{id}/disclose where disclosed_element_count is set from it"
    algorithm: projection
    formula: |
      # allow_list =
      #   context == AGE_ONLY          -> InteropProfile.age_only_allowed_elements
      #   context == LAW_ENFORCEMENT   -> CORE_ELEMENTS
      #   context == ROUTINE           -> ReaderApp.requested_elements INTERSECT Verifier.purpose_scope
      #
      # minimized_elements = [x for x in CORE_ELEMENTS if x in requested_elements
      #                                                 and x in allow_list]
      # withheld_elements  = [x for x in requested_elements if x not in allow_list],
      #                      emitted in CORE_ELEMENTS order first, then any element not in
      #                      CORE_ELEMENTS in the request's own array order
      # excess_element_count = len(withheld_elements)
      # age_attestation_only = (context == AGE_ONLY
      #                         and set(minimized_elements) is a subset of
      #                             {age_over_18, age_over_21})
      #
      # AGE_ONLY is STRICT: if excess_element_count > 0 the request is rejected with
      # ERR_DATA_MINIMIZATION_VIOLATION (422) and no session row is created.
      # ROUTINE and LAW_ENFORCEMENT are SOFT: the extra elements are withheld, the
      # session proceeds, and excess_element_count feeds verifier_exposure_index.
    input_set: "PresentationSession.requested_elements, the ReaderApp's requested_elements, the Verifier's purpose_scope, and the active InteropProfile's age_only_allowed_elements."
    constants:
      CORE_ELEMENTS: [family_name, given_name, birth_date, portrait, document_number, expiry_date, issuing_authority, driving_privileges, address, age_over_18, age_over_21]
    precision: "exact set algebra; ordering is canonical CORE_ELEMENTS order, never insertion order"

  - name: revocation_status_projection
    trigger: "GET /mdl/credentials/{id}/revocation-status; also evaluated inside POST /mdl/presentation-sessions to decide the REQUESTED -> CONSENT_PENDING vs REQUESTED -> BLOCKED_BY_POLICY fork"
    algorithm: projection
    formula: |
      # entries = RevocationEntry where credential_id == C.id, ordered by `sequence` ASC
      #           (sequence is a per-credential counter, so the replay order never
      #            depends on `id` or on insertion timing)
      # replay: eff = VALID
      #   status == SUSPENDED  -> eff = SUSPENDED
      #   status == REVOKED    -> eff = REVOKED        (absorbing: later entries cannot lift it)
      #   status == EXPIRED    -> eff = EXPIRED        (absorbing)
      #   status == REINSTATED -> eff = VALID, but ONLY when eff == SUSPENDED at that point;
      #                           otherwise the entry is recorded and ignored by the replay
      # status              = eff
      # entry_sequence      = entries[-1].sequence if entries else 0
      # staleness_seconds   = floor((current_utc - entries[-1].effective_at).total_seconds())
      #                       if entries else 0
      # is_fresh            = staleness_seconds <= InteropProfile.revocation_freshness_seconds
      #                       (<= is inclusive: exactly 300 s is still fresh)
    input_set: "Every RevocationEntry of the credential; entries are immutable and none is filtered out."
    precision: "integer seconds, floor"

  - name: update_order_status_rollup
    trigger: "Runs at UpdateOrder creation and after every UpdateDelivery status change (DELIVERED, FAILED, SUPERSEDED); writes UpdateOrder.delivery_count / delivered_count / failed_count / status / closed_at"
    algorithm: aggregation
    formula: |
      # delivery_count  = count(UpdateDelivery where update_order_id == O.id
      #                                          and status != SUPERSEDED)
      # delivered_count = count(UpdateDelivery where update_order_id == O.id
      #                                          and status == DELIVERED)
      # failed_count    = count(UpdateDelivery where update_order_id == O.id
      #                                          and status == FAILED)
      # if delivery_count == 0:                                status = COMPLETED
      # elif delivered_count == delivery_count:                status = COMPLETED
      # elif delivered_count + failed_count == delivery_count: status = FAILED_CLOSED
      # elif delivered_count + failed_count > 0:               status = PARTIALLY_DELIVERED
      # else:                                                  status = OPEN
      # closed_at = current_utc when the resulting status is COMPLETED or FAILED_CLOSED
      #             and closed_at was null; otherwise unchanged.
      #
      # delivery_count == 0 is a first-class outcome, not an error: a holder with no
      # credential in {ACTIVE, SUSPENDED} still gets a real, immediately COMPLETED order.
    input_set: "UpdateDelivery children of the order; SUPERSEDED rows are excluded from all three counters."
    precision: "integer counts"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing row decides the response, all later rows are skipped)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the called endpoint's roles list in 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: all required fields present, enum values members of their declared set, integers inside their declared range, arrays of strings, ISO 8601 datetimes parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Every path-templated resource resolves, validated left to right"
    error_id: "ERR_HOLDER_NOT_FOUND | ERR_PROOFING_SESSION_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_UPDATE_ORDER_NOT_FOUND | ERR_UPDATE_DELIVERY_NOT_FOUND | ERR_VERIFIER_NOT_FOUND | ERR_READER_APP_NOT_FOUND | ERR_PRESENTATION_SESSION_NOT_FOUND | ERR_INTEROP_PROFILE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every body-supplied foreign key resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_HOLDER_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_PROOFING_SESSION_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_READER_APP_NOT_FOUND | ERR_INTEROP_PROFILE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /mdl/proofing-sessions, POST /mdl/devices, POST /mdl/credentials, POST /mdl/reader-apps, POST /mdl/trust-list-snapshots, POST /mdl/presentation-sessions"

  - priority: 6
    category: auth
    check: "For an entity_backed role, X-User-ID equals the resource's owning foreign key: Holder acts only on its own holder_id chain; VerifierOperator acts only on reader apps and presentation sessions whose ReaderApp.verifier_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /mdl/credentials/{id}/activate, POST /mdl/devices/{id}/report-lost, POST /mdl/devices/{id}/recover, POST /mdl/reader-apps, POST /mdl/presentation-sessions, POST /mdl/presentation-sessions/{id}/consent, POST /mdl/presentation-sessions/{id}/disclose, POST /mdl/verifiers/{id}/retention-attestation"

  - priority: 7
    category: state
    check: "The target resource is in a state from which the requested transition is declared in 1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints not covered by a more specific state row below"

  - priority: 8
    category: state
    check: "UpdateDelivery.status == PENDING for deliver and fail"
    error_id: ERR_DELIVERY_NOT_PENDING
    http_status: 409
    applies_to: "POST /mdl/update-deliveries/{id}/deliver, POST /mdl/update-deliveries/{id}/fail"

  - priority: 9
    category: state
    check: "PresentationSession.state == CONSENT_PENDING for the consent call"
    error_id: ERR_SESSION_NOT_CONSENT_PENDING
    http_status: 409
    applies_to: "POST /mdl/presentation-sessions/{id}/consent"

  - priority: 10
    category: state
    check: "PresentationSession.billing_state == BILLED for a void-billing compensation"
    error_id: ERR_BILLING_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /mdl/presentation-sessions/{id}/void-billing"

  - priority: 11
    category: state
    check: "The OCC guard: the submitted expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_DEVICE_VERSION | ERR_STALE_INTEROP_VERSION"
    http_status: 412
    applies_to: "POST /mdl/credentials, POST /mdl/trust-list-snapshots"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: the adjudicating CredentialAdjudicator's X-User-ID differs from IdentityProofingSession.proofing_agent_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /mdl/proofing-sessions/{id}/adjudicate"

  - priority: 13
    category: business_safety
    check: "Handset handling policy: handset_handling must never be SURRENDER_REQUESTED - no verifier, including law enforcement, may require the holder to hand over the handset"
    error_id: ERR_HANDSET_SURRENDER_PROHIBITED
    http_status: 422
    applies_to: "POST /mdl/presentation-sessions"

  - priority: 14
    category: business_safety
    check: "context == LAW_ENFORCEMENT is permitted only when Verifier.category == LAW_ENFORCEMENT"
    error_id: ERR_LAW_ENFORCEMENT_CONTEXT_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /mdl/presentation-sessions"

  - priority: 15
    category: business_referential
    check: "ReaderApp.trust_state == LISTED and the newest TrustListSnapshot of the active InteropProfile covers current_utc (effective_from <= current_utc < effective_until)"
    error_id: ERR_READER_NOT_TRUSTED
    http_status: 403
    applies_to: "POST /mdl/presentation-sessions"

  - priority: 16
    category: business_referential
    check: "Verifier.trust_status IN {APPROVED, PROBATION}"
    error_id: ERR_VERIFIER_NOT_TRUSTED
    http_status: 403
    applies_to: "POST /mdl/reader-apps, POST /mdl/presentation-sessions"

  - priority: 17
    category: business_referential
    check: "Device binding integrity: the credential's Device is in the state the operation requires - {ATTESTED, BOUND} for provisioning and activation, BOUND for an update delivery - and Device.holder_id equals the credential's holder_id"
    error_id: "ERR_DEVICE_BINDING_MISMATCH | ERR_DEVICE_NOT_BOUND"
    http_status: 409
    applies_to: "POST /mdl/credentials, POST /mdl/credentials/{id}/activate, POST /mdl/update-deliveries/{id}/deliver"

  - priority: 18
    category: business_temporal
    check: "Physical-credential eligibility: Holder.physical_credential_status == VALID and Holder.physical_credential_expires_on > date(current_utc)"
    error_id: ERR_PHYSICAL_CREDENTIAL_INELIGIBLE
    http_status: 422
    applies_to: "POST /mdl/proofing-sessions, POST /mdl/proofing-sessions/{id}/submit, POST /mdl/credentials, POST /mdl/credentials/{id}/activate"

  - priority: 19
    category: business_temporal
    check: "The named IdentityProofingSession has assurance_expires_at > current_utc"
    error_id: ERR_PROOFING_ASSURANCE_EXPIRED
    http_status: 409
    applies_to: "POST /mdl/credentials"

  - priority: 20
    category: business_temporal
    check: "INTERVAL SEMANTICS A - half-open, adjacency allowed. The new credential's [valid_from, valid_until) must not strictly overlap any other DigitalCredential on the same device_id with lifecycle_state IN {PENDING_PROVISION, ACTIVE, SUSPENDED}: reject when new.valid_from < other.valid_until AND other.valid_from < new.valid_until. Exactly touching endpoints (new.valid_from == other.valid_until) are ACCEPTED. The credential named by supersedes_credential_id is excluded from the comparison set."
    error_id: ERR_CREDENTIAL_VALIDITY_OVERLAP
    http_status: 409
    applies_to: "POST /mdl/credentials"

  - priority: 21
    category: business_temporal
    check: "INTERVAL SEMANTICS B - exact aggregate tiling, no gap and no overlap. For the second and later TrustListSnapshot of an InteropProfile, effective_from must EQUAL the newest existing snapshot's effective_until. effective_from < newest.effective_until is an overlap; effective_from > newest.effective_until is a gap."
    error_id: "ERR_TRUST_LIST_WINDOW_OVERLAP | ERR_TRUST_LIST_WINDOW_GAP"
    http_status: "409 | 422"
    applies_to: "POST /mdl/trust-list-snapshots"

  - priority: 22
    category: business_temporal
    check: "INTERVAL SEMANTICS C - closed intervals with a mandatory renewal buffer. A new ReaderApp sharing app_identifier with an existing ReaderApp of the same verifier (trust_state IN {PENDING, LISTED}) requires new.cert_not_before >= existing.cert_not_after + CERT_RENEWAL_BUFFER_HOURS (24 h). Anything earlier, including exact adjacency, is rejected."
    error_id: ERR_CERT_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /mdl/reader-apps"

  - priority: 23
    category: business_referential
    check: "(verifier_id, certificate_serial) is not already registered"
    error_id: ERR_DUPLICATE_READER_APP
    http_status: 409
    applies_to: "POST /mdl/reader-apps"

  - priority: 24
    category: business_constraint
    check: "IdentityProofingSession.achieved_assurance_level is at or above InteropProfile.required_assurance_level on the ordered ladder IAL1 < IAL1_5 < IAL2; also enforced at adjudication as adjudication_score >= 260"
    error_id: ERR_ASSURANCE_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /mdl/credentials, POST /mdl/proofing-sessions/{id}/adjudicate"

  - priority: 25
    category: business_constraint
    check: "Multi-device policy: Holder.bound_device_count < InteropProfile.max_devices_per_holder before a device is attested PASS"
    error_id: ERR_DEVICE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /mdl/devices/{id}/attest"

  - priority: 26
    category: business_constraint
    check: "Holder.active_credential_count < InteropProfile.max_active_credentials_per_holder before an activation; a credential that supersedes an ACTIVE one is exempt because the predecessor is REPLACED in the same request"
    error_id: ERR_ACTIVE_CREDENTIAL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /mdl/credentials/{id}/activate"

  - priority: 27
    category: business_constraint
    check: "Data minimisation in the AGE_ONLY context: every requested element is a member of InteropProfile.age_only_allowed_elements"
    error_id: ERR_DATA_MINIMIZATION_VIOLATION
    http_status: 422
    applies_to: "POST /mdl/presentation-sessions"

  - priority: 28
    category: business_constraint
    check: "The unlock proof matches the device: device_unlock_proof == Device.protection_method at activation, unlock_method == DigitalCredential.protection_method_at_activation at consent"
    error_id: ERR_PROTECTION_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /mdl/credentials/{id}/activate, POST /mdl/presentation-sessions/{id}/consent"

  - priority: 29
    category: business_constraint
    check: "Near-real-time revocation status must be fresh: revocation_status_projection(credential).status == VALID and staleness_seconds <= InteropProfile.revocation_freshness_seconds. A stale pointer is a hard rejection on the deliver path; on the presentation path the session instead forks to BLOCKED_BY_POLICY."
    error_id: ERR_REVOCATION_STATUS_STALE
    http_status: 409
    applies_to: "POST /mdl/update-deliveries/{id}/deliver"

  - priority: 30
    category: business_constraint
    check: "A proofing session may be submitted only with evidence_count >= 2"
    error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    applies_to: "POST /mdl/proofing-sessions/{id}/submit"

  - priority: 31
    category: business_fiscal
    check: "PresentationSession.retention_days <= Verifier.retention_ceiling_days (<= is inclusive: exactly the ceiling is accepted)"
    error_id: ERR_RETENTION_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /mdl/presentation-sessions, POST /mdl/presentation-sessions/{id}/disclose"

  - priority: 32
    category: business_fiscal
    check: "Verifier.billable_query_balance_cents <= MAX_UNBILLED_BALANCE_CENTS (50000) before a new disclosure is billed"
    error_id: ERR_VERIFIER_ACCOUNT_DELINQUENT
    http_status: 402
    applies_to: "POST /mdl/presentation-sessions/{id}/disclose"

# =============================================================================
# 1.5 API Endpoint Table   (api_prefix = /mdl)
# =============================================================================
endpoints:

  # ---------- interoperability profile & trust list distribution -----------
  - method: POST
    path: "/mdl/interop-profiles"
    description: "Create the national interoperability profile that governs required assurance, multi-device policy, revocation freshness and the AGE_ONLY element allow-list."
    roles: [SystemAdmin]
    code: 201
    input: ["profile_code", "standard_version", "accepted_issuer_states?", "required_assurance_level?", "max_devices_per_holder?", "max_active_credentials_per_holder?", "proofing_validity_days?", "revocation_freshness_seconds?", "age_only_allowed_elements?"]
    output: InteropProfile
    side_effects:
      - "is_active = true; pending_republish_count = 0; version = 1"

  - method: GET
    path: "/mdl/interop-profiles/{id}"
    description: "Read the interoperability profile, including the `version` a trust-list publication must echo back as expected_interop_profile_version."
    roles: [SystemAdmin, CredentialAdjudicator, VerifierOperator, PrivacyAuditor]
    code: 200
    input: []
    output: InteropProfile
    side_effects: []

  - method: GET
    path: "/mdl/interop-profiles/{id}/trust-list-snapshots"
    description: "List the trust-list snapshots published under this profile, ordered by snapshot_sequence ASC. FK reverse-reachability for TrustListSnapshot.interop_profile_id."
    roles: [SystemAdmin, VerifierOperator, PrivacyAuditor]
    code: 200
    input: ["revocation_pointer_stale?", "limit?", "offset?"]
    output: TrustListSnapshot[]
    side_effects: []

  - method: POST
    path: "/mdl/trust-list-snapshots"
    description: "Publish a trust-list snapshot for reader distribution. INTERVAL SEMANTICS B: snapshots of one profile must tile exactly, so effective_from must equal the newest snapshot's effective_until."
    roles: [SystemAdmin]
    code: 201
    input: ["interop_profile_id", "effective_from", "effective_until", "expected_interop_profile_version"]
    output: TrustListSnapshot
    side_effects:
      - "snapshot_sequence = (max snapshot_sequence for this profile) + 1, starting at 1"
      - "listed_reader_app_count = count(ReaderApp where trust_state == LISTED)"
      - "revocation_pointer_sequence = total RevocationEntry rows in existence; revocation_pointer_stale = false; pending_delta_count = 0"
      - "standard_version = InteropProfile.standard_version; published_at = current_utc"
      - "every RevocationEntry appended before publication has published = true"
      - "InteropProfile.pending_republish_count = 0"
      - "increments InteropProfile.version by 1"

  # ---------------------------- holders ------------------------------------
  - method: POST
    path: "/mdl/holders"
    description: "Enrol a person who already holds a physical driver license; physical_credential_status == VALID is what confers mDL eligibility."
    roles: [SystemAdmin]
    code: 201
    input: ["legal_name", "date_of_birth", "address_line1", "city", "state_code", "postal_code", "physical_credential_number", "physical_credential_expires_on", "physical_credential_status?", "restriction_codes?"]
    output: Holder
    side_effects:
      - "active_credential_count = 0; bound_device_count = 0; revoked_credential_count = 0; address_version = 1"

  - method: GET
    path: "/mdl/holders/{id}"
    description: "Read a holder record with its live derived counters."
    roles: [SystemAdmin, ProofingAgent, CredentialAdjudicator, Holder]
    code: 200
    input: []
    output: Holder
    side_effects: []

  - method: PATCH
    path: "/mdl/holders/{id}/physical-credential"
    description: "Record a change to the underlying physical credential. Status SUSPENDED suspends every ACTIVE digital credential; restoring VALID reinstates exactly those; REVOKED revokes them; supplying restriction_codes opens a RESTRICTION_CHANGE propagation order."
    roles: [SystemAdmin]
    code: 200
    input: ["physical_credential_status?", "physical_credential_expires_on?", "restriction_codes?"]
    output: Holder
    side_effects:
      - "on status SUSPENDED: every DigitalCredential of this holder with lifecycle_state == ACTIVE goes SUSPENDED with suspend_reason = PHYSICAL_CREDENTIAL_SUSPENDED, each appending RevocationEntry(status=SUSPENDED, reason=ADMIN_HOLD) and decrementing active_credential_count by 1"
      - "on status returning to VALID: every DigitalCredential with lifecycle_state == SUSPENDED and suspend_reason == PHYSICAL_CREDENTIAL_SUSPENDED goes ACTIVE with suspend_reason = null, each appending RevocationEntry(status=REINSTATED, reason=RECOVERY) and incrementing active_credential_count by 1"
      - "on status REVOKED: every DigitalCredential with lifecycle_state IN {ACTIVE, SUSPENDED} goes REVOKED, each appending RevocationEntry(status=REVOKED, reason=PHYSICAL_CREDENTIAL_REVOKED) and incrementing revoked_credential_count by 1"
      - "when restriction_codes is present: an UpdateOrder(reason=RESTRICTION_CHANGE) is opened with target_address_version = the unchanged Holder.address_version, running the same five-hop propagation cascade as an address change"
      - "every appended RevocationEntry sets the newest TrustListSnapshot revocation_pointer_stale = true, increments its pending_delta_count by 1 and increments InteropProfile.pending_republish_count by 1"
      - "increments Holder.version by 1"

  - method: POST
    path: "/mdl/holders/{id}/address-change"
    description: "Record a new address of record and open the credential-update propagation order. Returns the created UpdateOrder."
    roles: [SystemAdmin]
    code: 201
    input: ["address_line1", "city", "state_code", "postal_code"]
    output: UpdateOrder
    side_effects:
      - "Holder address fields overwritten; Holder.address_version += 1; increments Holder.version by 1"
      - "UpdateOrder(reason=ADDRESS_CHANGE, status=OPEN, opened_at=current_utc, target_address_version = Holder.address_version after the bump) created"
      - "CASCADE: one UpdateDelivery(status=PENDING) per DigitalCredential of the holder with lifecycle_state IN {ACTIVE, SUSPENDED}, in DigitalCredential.created_at ASC order"
      - "each created delivery drives its credential sync_state to UPDATE_PENDING and increments pending_update_count by 1"
      - "each credential entering UPDATE_PENDING aborts its PresentationSession rows in {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED} with abort_reason = CREDENTIAL_UPDATE_PENDING"
      - "each aborted session appends PresentationLogEntry(outcome=ABORTED, billing_state=UNBILLED) and decrements Verifier.open_session_count by 1"
      - "any older PENDING UpdateDelivery against the same credential becomes SUPERSEDED"
      - "update_order_status_rollup runs; delivery_count == 0 closes the order COMPLETED inside this request"

  - method: GET
    path: "/mdl/holders/{id}/devices"
    description: "List the holder's registered handsets. FK reverse-reachability for Device.holder_id."
    roles: [SystemAdmin, Holder, PrivacyAuditor]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/mdl/holders/{id}/proofing-sessions"
    description: "List the holder's identity-proofing sessions. FK reverse-reachability for IdentityProofingSession.holder_id."
    roles: [SystemAdmin, ProofingAgent, CredentialAdjudicator]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: IdentityProofingSession[]
    side_effects: []

  # ------------------------ identity proofing ------------------------------
  - method: POST
    path: "/mdl/proofing-sessions"
    description: "Open an identity-proofing session. The acting ProofingAgent's X-User-ID is stored as proofing_agent_user_id and becomes the segregation-of-duties comparand."
    roles: [ProofingAgent]
    code: 201
    input: ["holder_id", "requested_assurance_level"]
    output: IdentityProofingSession
    side_effects:
      - "state = COLLECTING; proofing_agent_user_id = X-User-ID; submission_count = 0; evidence_count = 0"

  - method: GET
    path: "/mdl/proofing-sessions/{id}"
    description: "Read a proofing session. Lazily applies the VERIFIED -> EXPIRED transition when current_utc >= assurance_expires_at."
    roles: [ProofingAgent, CredentialAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: IdentityProofingSession
    side_effects:
      - "state VERIFIED -> EXPIRED when current_utc >= assurance_expires_at"

  - method: POST
    path: "/mdl/proofing-sessions/{id}/evidence"
    description: "Append an immutable evidence item. Appending to a RETURNED session reopens it into COLLECTING, closing the proofing cycle."
    roles: [ProofingAgent]
    code: 201
    input: ["evidence_type", "quality", "captured_at", "source_reference"]
    output: ProofingEvidence
    side_effects:
      - "strength_points = POINTS[evidence_type][quality]; superseded = false"
      - "IdentityProofingSession.evidence_count += 1"
      - "IdentityProofingSession state RETURNED -> COLLECTING with return_reason = null"

  - method: GET
    path: "/mdl/proofing-sessions/{id}/evidence"
    description: "List the session's evidence with resolved strength_points and superseded labels, ordered by created_at ASC. FK reverse-reachability for ProofingEvidence.proofing_session_id."
    roles: [ProofingAgent, CredentialAdjudicator, SystemAdmin]
    code: 200
    input: ["evidence_type?", "limit?", "offset?"]
    output: ProofingEvidence[]
    side_effects: []

  - method: GET
    path: "/mdl/proofing-sessions/{id}/assurance-preview"
    description: "Computed read: both proofing_assurance_score variants over the same evidence set - the advisory PREVIEW_OPTIMISTIC score and the authoritative ADJUDICATION_STRICT score, each with its mapped level."
    roles: [ProofingAgent, CredentialAdjudicator, SystemAdmin]
    code: 200
    input: []
    output: { preview_score: integer, preview_assurance_level: string, adjudication_score: integer, adjudication_assurance_level: string, submission_count: integer, evidence_type_count: integer }
    side_effects: []

  - method: POST
    path: "/mdl/proofing-sessions/{id}/submit"
    description: "Submit the session for adjudication. Requires at least two evidence items and a VALID, unexpired physical credential."
    roles: [ProofingAgent]
    code: 200
    input: []
    output: IdentityProofingSession
    side_effects:
      - "state COLLECTING -> SUBMITTED; submission_count += 1"
      - "increments IdentityProofingSession.version by 1"

  - method: POST
    path: "/mdl/proofing-sessions/{id}/adjudicate"
    description: "Adjudicate a SUBMITTED session as VERIFY, RETURN or DENY. Segregation of duties: X-User-ID must differ from proofing_agent_user_id."
    roles: [CredentialAdjudicator]
    code: 200
    input: ["decision", "return_reason?"]
    output: IdentityProofingSession
    side_effects:
      - "ProofingEvidence.superseded recomputed for every evidence row of the session"
      - "adjudication_score = proofing_assurance_score variant ADJUDICATION_STRICT"
      - "on VERIFY: achieved_assurance_level = IAL2 when adjudication_score >= 420, IAL1_5 when >= 260; verified_at = current_utc; assurance_expires_at = current_utc + InteropProfile.proofing_validity_days days"
      - "on RETURN: state = RETURNED, return_reason = body.return_reason"
      - "on DENY: state = DENIED, achieved_assurance_level = null"
      - "adjudicator_user_id = X-User-ID; increments IdentityProofingSession.version by 1"

  # ------------------------------ devices ----------------------------------
  - method: POST
    path: "/mdl/devices"
    description: "Register a handset for a holder with its platform attestation blob and the protection method (biometric or passcode) that will guard the credential."
    roles: [Holder, SystemAdmin]
    code: 201
    input: ["holder_id", "platform", "model_name", "hardware_attestation_token", "protection_method"]
    output: Device
    side_effects:
      - "state = REGISTERED; active_binding_count = 0; reprovision_count = 0"

  - method: GET
    path: "/mdl/devices/{id}"
    description: "Read a device, including the `version` a provisioning call must echo back as expected_device_version."
    roles: [Holder, SystemAdmin, CredentialAdjudicator, PrivacyAuditor]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: POST
    path: "/mdl/devices/{id}/attest"
    description: "Record the platform attestation result. Divergent branch: PASS moves the handset to ATTESTED and counts it against the multi-device cap, FAIL retires it and counts nothing."
    roles: [SystemAdmin]
    code: 200
    input: ["attestation_result", "secure_element_grade"]
    output: Device
    side_effects:
      - "attestation_result and secure_element_grade recorded"
      - "on PASS: state = ATTESTED; Holder.bound_device_count += 1"
      - "on FAIL: state = RETIRED; Holder.bound_device_count unchanged"
      - "increments Device.version by 1"

  - method: POST
    path: "/mdl/devices/{id}/report-lost"
    description: "Report the handset lost or stolen. Runs the three-hop suspension cascade across credentials, the revocation ledger and the trust-list pointer."
    roles: [Holder, SystemAdmin]
    code: 200
    input: []
    output: Device
    side_effects:
      - "state BOUND -> LOST_REPORTED; lost_reported_at = current_utc; increments Device.version by 1"
      - "HOP 1: every DigitalCredential on this device with lifecycle_state == ACTIVE goes SUSPENDED with suspend_reason = DEVICE_LOST"
      - "HOP 2 (caused by hop 1): each such suspension appends RevocationEntry(status=SUSPENDED, reason=DEVICE_LOST) and decrements Holder.active_credential_count by 1"
      - "HOP 3 (caused by hop 2): each appended entry sets the newest TrustListSnapshot revocation_pointer_stale = true, increments its pending_delta_count by 1 and increments InteropProfile.pending_republish_count by 1"

  - method: POST
    path: "/mdl/devices/{id}/recover"
    description: "Recover a handset previously reported lost. The exact compensating action for report-lost: restores every credential that cascade suspended and returns Holder.active_credential_count to its pre-loss value."
    roles: [Holder, SystemAdmin]
    code: 200
    input: ["reattestation_token"]
    output: Device
    side_effects:
      - "state LOST_REPORTED -> BOUND; lost_reported_at = null; increments Device.version by 1"
      - "HOP 1: every DigitalCredential on this device with lifecycle_state == SUSPENDED and suspend_reason == DEVICE_LOST goes ACTIVE with suspend_reason = null"
      - "HOP 2 (caused by hop 1): each reinstatement appends RevocationEntry(status=REINSTATED, reason=RECOVERY) and increments Holder.active_credential_count by 1"
      - "HOP 3 (caused by hop 2): each appended entry sets the newest TrustListSnapshot revocation_pointer_stale = true, increments pending_delta_count by 1 and increments InteropProfile.pending_republish_count by 1"

  - method: POST
    path: "/mdl/devices/{id}/wipe"
    description: "Remotely wipe a lost handset. Terminal for the device and for every credential still bound to it."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: Device
    side_effects:
      - "state LOST_REPORTED -> WIPED; active_binding_count = 0; Holder.bound_device_count -= 1; increments Device.version by 1"
      - "every DigitalCredential on this device with lifecycle_state == SUSPENDED goes REVOKED, each appending RevocationEntry(status=REVOKED, reason=DEVICE_LOST) and incrementing Holder.revoked_credential_count by 1"

  # --------------------------- digital credentials -------------------------
  - method: POST
    path: "/mdl/credentials"
    description: "Provision a digital credential onto a handset in {ATTESTED, BOUND} from a VERIFIED proofing session. Optimistic concurrency on the parent Device: expected_device_version must equal Device.version."
    roles: [CredentialAdjudicator]
    code: 201
    input: ["holder_id", "device_id", "proofing_session_id", "valid_from", "valid_until", "expected_device_version", "supersedes_credential_id?", "expedite?"]
    output: DigitalCredential
    side_effects:
      - "lifecycle_state = PENDING_PROVISION; sync_state = IN_SYNC; doc_version = 1"
      - "assurance_level = IdentityProofingSession.achieved_assurance_level"
      - "address_version_synced = Holder.address_version; restriction_codes = Holder.restriction_codes; age_only_capable = true"
      - "reissuance_settlement_cents = credential_reissuance_settlement_cents when supersedes_credential_id is non-null, else 0"
      - "IdentityProofingSession state VERIFIED -> CONSUMED"
      - "Device state ATTESTED -> BOUND (a device already BOUND stays BOUND); Device.active_binding_count += 1; Holder.bound_device_count is NOT touched here - it was already incremented at attestation"
      - "increments Device.version by 1"

  - method: GET
    path: "/mdl/credentials/{id}"
    description: "Read a digital credential with both state axes. Lazily applies the ACTIVE -> EXPIRED transition when current_utc >= valid_until."
    roles: [SystemAdmin, CredentialAdjudicator, Holder, PrivacyAuditor, VerifierOperator]
    code: 200
    input: []
    output: DigitalCredential
    side_effects:
      - "lifecycle_state ACTIVE -> EXPIRED when current_utc >= valid_until, appending RevocationEntry(status=EXPIRED, reason=VALIDITY_LAPSED) and decrementing Holder.active_credential_count by 1"

  - method: GET
    path: "/mdl/credentials"
    description: "List digital credentials filtered by holder, device, originating proofing session, superseded predecessor, or either state axis. FK reverse-reachability for DigitalCredential.holder_id, device_id, proofing_session_id and supersedes_credential_id."
    roles: [SystemAdmin, CredentialAdjudicator, PrivacyAuditor, Holder]
    code: 200
    input: ["holder_id?", "device_id?", "proofing_session_id?", "supersedes_credential_id?", "lifecycle_state?", "sync_state?", "limit?", "offset?"]
    output: DigitalCredential[]
    side_effects: []

  - method: POST
    path: "/mdl/credentials/{id}/activate"
    description: "Holder unlocks the handset with the bound protection method and activates the credential. A credential naming a predecessor drives that predecessor to REPLACED in the same request."
    roles: [Holder]
    code: 200
    input: ["device_unlock_proof"]
    output: DigitalCredential
    side_effects:
      - "lifecycle_state PENDING_PROVISION -> ACTIVE; activated_at = current_utc; protection_method_at_activation = Device.protection_method"
      - "Holder.active_credential_count += 1"
      - "appends no RevocationEntry (a first VALID status is implicit; revocation_sequence stays 0)"
      - "when supersedes_credential_id is non-null and that credential is ACTIVE or SUSPENDED: it goes REPLACED, appends RevocationEntry(status=REVOKED, reason=RENEWAL_SUPERSEDE), Device.reprovision_count += 1, and Holder.active_credential_count is decremented by 1 if the predecessor had been ACTIVE"
      - "increments DigitalCredential.version by 1"

  - method: POST
    path: "/mdl/credentials/{id}/renew"
    description: "Extend an ACTIVE credential's validity window and propagate the new payload to the handset."
    roles: [CredentialAdjudicator]
    code: 200
    input: ["new_valid_until"]
    output: DigitalCredential
    side_effects:
      - "valid_until = body.new_valid_until"
      - "opens UpdateOrder(reason=RENEWAL, target_address_version = Holder.address_version) with one PENDING UpdateDelivery per DigitalCredential of the holder with lifecycle_state IN {ACTIVE, SUSPENDED}, running the same five-hop cascade as an address change"
      - "increments DigitalCredential.version by 1"

  - method: POST
    path: "/mdl/credentials/{id}/revoke"
    description: "Revoke a credential. Terminal on the lifecycle axis and immediately reflected in the near-real-time revocation feed."
    roles: [SystemAdmin]
    code: 200
    input: ["reason"]
    output: DigitalCredential
    side_effects:
      - "lifecycle_state -> REVOKED"
      - "appends RevocationEntry(status=REVOKED, reason = body.reason); revocation_sequence = that entry's sequence"
      - "Holder.revoked_credential_count += 1; Holder.active_credential_count -= 1 when the credential had been ACTIVE; Device.active_binding_count -= 1"
      - "aborts every PresentationSession of this credential in {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED} with abort_reason = CREDENTIAL_REVOKED, each appending PresentationLogEntry(outcome=ABORTED) and decrementing Verifier.open_session_count by 1"
      - "newest TrustListSnapshot revocation_pointer_stale = true, pending_delta_count += 1, InteropProfile.pending_republish_count += 1"
      - "increments DigitalCredential.version by 1"

  - method: GET
    path: "/mdl/credentials/{id}/revocation-entries"
    description: "Read the append-only revocation ledger of one credential in `sequence` ASC order. FK reverse-reachability for RevocationEntry.credential_id."
    roles: [SystemAdmin, PrivacyAuditor, VerifierOperator, CredentialAdjudicator]
    code: 200
    input: ["limit?", "offset?"]
    output: RevocationEntry[]
    side_effects: []

  - method: GET
    path: "/mdl/credentials/{id}/revocation-status"
    description: "Computed read: revocation_status_projection replayed over the ledger, with the freshness verdict against InteropProfile.revocation_freshness_seconds."
    roles: [SystemAdmin, PrivacyAuditor, VerifierOperator, CredentialAdjudicator]
    code: 200
    input: []
    output: { credential_id: string, status: string, entry_sequence: integer, effective_at: string, staleness_seconds: integer, is_fresh: boolean }
    side_effects: []

  - method: GET
    path: "/mdl/credentials/{id}/deliveries"
    description: "List the update deliveries targeting this credential. FK reverse-reachability for UpdateDelivery.credential_id."
    roles: [SystemAdmin, Holder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: UpdateDelivery[]
    side_effects: []

  # ------------------- update propagation orders ---------------------------
  - method: GET
    path: "/mdl/update-orders/{id}"
    description: "Read an update-propagation order whose compound status is rolled up from its deliveries."
    roles: [SystemAdmin, Holder]
    code: 200
    input: []
    output: UpdateOrder
    side_effects: []

  - method: GET
    path: "/mdl/update-orders"
    description: "List update-propagation orders by holder, reason or status. FK reverse-reachability for UpdateOrder.holder_id."
    roles: [SystemAdmin, Holder]
    code: 200
    input: ["holder_id?", "reason?", "status?", "limit?", "offset?"]
    output: UpdateOrder[]
    side_effects: []

  - method: GET
    path: "/mdl/update-orders/{id}/deliveries"
    description: "List the deliveries of one order in created_at ASC order. FK reverse-reachability for UpdateDelivery.update_order_id."
    roles: [SystemAdmin, Holder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: UpdateDelivery[]
    side_effects: []

  - method: POST
    path: "/mdl/update-deliveries/{id}/deliver"
    description: "Confirm the handset received and applied the credential update. Re-derives the parent order's compound status."
    roles: [SystemAdmin]
    code: 200
    input: ["device_receipt_token"]
    output: UpdateDelivery
    side_effects:
      - "status PENDING -> DELIVERED; attempt_count += 1; delivered_at = current_utc; device_receipt_token recorded"
      - "DigitalCredential.pending_update_count -= 1; when it reaches 0 the credential's sync_state goes UPDATE_PENDING -> IN_SYNC, doc_version += 1, address_version_synced = UpdateOrder.target_address_version, restriction_codes = Holder.restriction_codes"
      - "resulting_doc_version = DigitalCredential.doc_version after the bump"
      - "UpdateOrder.delivered_count refreshed and update_order_status_rollup re-derives UpdateOrder.status and closed_at"

  - method: POST
    path: "/mdl/update-deliveries/{id}/fail"
    description: "Record a failed push to the handset. The FIRST failure on a credential only marks it UPDATE_FAILED; the SECOND drives sync_state to STALE and forces the lifecycle axis to SUSPENDED."
    roles: [SystemAdmin]
    code: 200
    input: ["failure_code"]
    output: UpdateDelivery
    side_effects:
      - "status PENDING -> FAILED; attempt_count += 1; failure_code recorded"
      - "DigitalCredential.pending_update_count -= 1; failed_delivery_count += 1"
      - "first failure on that credential: sync_state UPDATE_PENDING -> UPDATE_FAILED, lifecycle_state untouched"
      - "second failure on that credential: sync_state UPDATE_PENDING -> STALE and the cross-axis coupling drives lifecycle_state ACTIVE -> SUSPENDED with suspend_reason = UPDATE_FAILED, appending RevocationEntry(status=SUSPENDED, reason=UPDATE_FAILED) and decrementing Holder.active_credential_count by 1"
      - "UpdateOrder.failed_count refreshed and update_order_status_rollup re-derives UpdateOrder.status and closed_at"

  # ------------------------ verifier ecosystem -----------------------------
  - method: POST
    path: "/mdl/verifiers"
    description: "Register a relying organisation with its declared purpose scope and contractual retention ceiling. A new verifier starts in trust_status APPLIED and cannot register reader apps until approved."
    roles: [SystemAdmin]
    code: 201
    input: ["organization_name", "category", "purpose_scope", "retention_ceiling_days"]
    output: Verifier
    side_effects:
      - "trust_status = APPLIED; exposure_index = 0; open_session_count = 0; billable_query_balance_cents = 0; credited_amount_cents = 0; probation_strike_count = 0"

  - method: GET
    path: "/mdl/verifiers/{id}"
    description: "Read a verifier with its live exposure index, trust status and billing balance."
    roles: [SystemAdmin, VerifierOperator, PrivacyAuditor]
    code: 200
    input: []
    output: Verifier
    side_effects: []

  - method: POST
    path: "/mdl/verifiers/{id}/trust-decision"
    description: "Drive the verifier trust cycle with APPROVE, PROBATION, SUSPEND, REINSTATE or TERMINATE. TERMINATE delists every reader app and aborts the verifier's in-flight presentations."
    roles: [SystemAdmin]
    code: 200
    input: ["decision"]
    output: Verifier
    side_effects:
      - "trust_status set per decision: APPROVE -> APPROVED, PROBATION -> PROBATION, SUSPEND -> SUSPENDED, REINSTATE -> APPROVED, TERMINATE -> TERMINATED"
      - "on TERMINATE: every ReaderApp of this verifier with trust_state == LISTED becomes DELISTED"
      - "on TERMINATE: every PresentationSession of those reader apps in {REQUESTED, CONSENT_PENDING, CONSENT_GRANTED} goes ABORTED with abort_reason = VERIFIER_TERMINATED, each appending PresentationLogEntry(outcome=ABORTED) and decrementing open_session_count by 1"
      - "increments Verifier.version by 1"

  - method: POST
    path: "/mdl/verifiers/{id}/retention-attestation"
    description: "The verifier operator attests the maximum retention it actually applies. Scores the presentation log against the newly attested ceiling using the SINCE_LAST_ATTESTATION exposure variant, then restarts that window."
    roles: [VerifierOperator]
    code: 200
    input: ["attested_max_retention_days"]
    output: Verifier
    side_effects:
      - "exposure_index = verifier_exposure_index variant SINCE_LAST_ATTESTATION, computed over entries with recorded_at >= last_attestation_at as it stood BEFORE this call (every entry ever recorded when it was null), scored against body.attested_max_retention_days"
      - "threshold triggers apply to the new index: >= 90 drives trust_status to SUSPENDED, else >= 60 drives an APPROVED verifier to PROBATION, each incrementing probation_strike_count by 1"
      - "attested_max_retention_days recorded; last_attestation_at = current_utc"
      - "increments Verifier.version by 1"

  - method: GET
    path: "/mdl/verifiers/{id}/exposure-index"
    description: "Computed read: both verifier_exposure_index variants side by side - the 30-day ROLLING_WINDOW index and the SINCE_LAST_ATTESTATION index - over the same log rows."
    roles: [SystemAdmin, PrivacyAuditor, VerifierOperator]
    code: 200
    input: []
    output: { rolling_window_index: integer, rolling_window_entry_count: integer, since_last_attestation_index: integer, since_attestation_entry_count: integer, computed_at: string }
    side_effects: []

  - method: GET
    path: "/mdl/verifiers/{id}/invoice"
    description: "Computed read: verifier_invoice_amount_cents with the pinned round-each-line-then-sum order, tier factors, volume discount and probation surcharge."
    roles: [SystemAdmin, VerifierOperator]
    code: 200
    input: []
    output: { invoice_amount_cents: integer, line_count: integer, surcharge_pct: number, billable_query_balance_cents: integer }
    side_effects: []

  - method: GET
    path: "/mdl/verifiers/{id}/reader-apps"
    description: "List the verifier's reader applications with their trust-list state and query counts. FK reverse-reachability for ReaderApp.verifier_id."
    roles: [SystemAdmin, VerifierOperator, PrivacyAuditor]
    code: 200
    input: ["trust_state?", "app_identifier?", "limit?", "offset?"]
    output: ReaderApp[]
    side_effects: []

  - method: GET
    path: "/mdl/verifiers/{id}/presentation-log-entries"
    description: "Privacy-audit view of the verifier's pseudonymised presentation log, ordered by recorded_at ASC. FK reverse-reachability for PresentationLogEntry.verifier_id."
    roles: [SystemAdmin, PrivacyAuditor]
    code: 200
    input: ["outcome?", "billing_state?", "limit?", "offset?"]
    output: PresentationLogEntry[]
    side_effects: []

  - method: POST
    path: "/mdl/reader-apps"
    description: "Register a reader application with its signing-certificate window and intended element set. INTERVAL SEMANTICS C: a renewal sharing app_identifier must start at least 24 hours after the incumbent certificate's cert_not_after."
    roles: [VerifierOperator]
    code: 201
    input: ["verifier_id", "app_identifier", "certificate_serial", "cert_not_before", "cert_not_after", "requested_elements", "base_rate_cents?"]
    output: ReaderApp
    side_effects:
      - "trust_state = PENDING; query_count = 0; volume_discount_pct = 0.00"

  - method: POST
    path: "/mdl/reader-apps/{id}/list-decision"
    description: "List or delist a reader application on the distributed trust list."
    roles: [SystemAdmin]
    code: 200
    input: ["decision"]
    output: ReaderApp
    side_effects:
      - "trust_state = LISTED on LIST with listed_at = current_utc; trust_state = DELISTED on DELIST"
      - "the newest TrustListSnapshot of the active profile has pending_delta_count += 1 and InteropProfile.pending_republish_count += 1"
      - "increments ReaderApp.version by 1"

  # ---------------------- presentation & data minimisation -----------------
  - method: POST
    path: "/mdl/presentation-sessions"
    description: "A listed reader app opens a presentation request, declaring context, purpose, requested elements, handset handling and intended retention. Forks to CONSENT_PENDING when every trust and freshness gate passes, or to BLOCKED_BY_POLICY when the credential is out of sync or its revocation status is stale."
    roles: [VerifierOperator]
    code: 201
    input: ["credential_id", "reader_app_id", "context", "purpose", "requested_elements", "handset_handling", "retention_days"]
    output: PresentationSession
    side_effects:
      - "presentation_minimization_projection writes minimized_elements, withheld_elements, excess_element_count and age_attestation_only; AGE_ONLY is strict and rejects any excess with ERR_DATA_MINIMIZATION_VIOLATION before a row is created"
      - "state = CONSENT_PENDING and Verifier.open_session_count += 1 when the credential is ACTIVE, IN_SYNC and its revocation status is fresh"
      - "state = BLOCKED_BY_POLICY with no open_session_count change and no billing when sync_state != IN_SYNC or staleness_seconds > InteropProfile.revocation_freshness_seconds; a PresentationLogEntry(outcome=BLOCKED_BY_POLICY, billing_state=UNBILLED) is appended"
      - "opened_at = current_utc; disclosed_element_count = 0; billed_amount_cents = 0; billing_state = UNBILLED"

  - method: GET
    path: "/mdl/presentation-sessions/{id}"
    description: "Read a presentation session with its minimised element projection and billing posture."
    roles: [VerifierOperator, Holder, PrivacyAuditor, SystemAdmin]
    code: 200
    input: []
    output: PresentationSession
    side_effects: []

  - method: GET
    path: "/mdl/presentation-sessions"
    description: "List presentation sessions by credential, reader app or state. FK reverse-reachability for PresentationSession.credential_id and PresentationSession.reader_app_id."
    roles: [VerifierOperator, PrivacyAuditor, SystemAdmin, Holder]
    code: 200
    input: ["credential_id?", "reader_app_id?", "state?", "limit?", "offset?"]
    output: PresentationSession[]
    side_effects: []

  - method: POST
    path: "/mdl/presentation-sessions/{id}/consent"
    description: "The holder approves or denies the request, proving the credential's bound unlock method when approving. Divergent branches: APPROVE only records the unlock method, DENY logs the excess element count so an over-asking reader still accrues exposure."
    roles: [Holder]
    code: 200
    input: ["consent_decision", "unlock_method?"]
    output: PresentationSession
    side_effects:
      - "on APPROVE: state CONSENT_PENDING -> CONSENT_GRANTED; consent_unlock_method = body.unlock_method (required for APPROVE, else ERR_INVALID_REQUEST)"
      - "on DENY: state CONSENT_PENDING -> DENIED_BY_HOLDER; appends PresentationLogEntry(outcome=DENIED_BY_HOLDER, disclosed_element_count=0, excess_element_count = session.excess_element_count, billed_amount_cents=0, billing_state=UNBILLED); Verifier.open_session_count -= 1; no billing and no ReaderApp.query_count increment"
      - "increments PresentationSession.version by 1"

  - method: POST
    path: "/mdl/presentation-sessions/{id}/disclose"
    description: "Complete the presentation. The only branch that bills, increments ReaderApp.query_count and moves the verifier's exposure index."
    roles: [VerifierOperator]
    code: 200
    input: []
    output: PresentationSession
    side_effects:
      - "state CONSENT_GRANTED -> COMPLETED; disclosed_element_count = len(minimized_elements); billed_amount_cents = ReaderApp.base_rate_cents; billing_state = BILLED"
      - "ReaderApp.query_count += 1; ReaderApp.volume_discount_pct = 0.10 once query_count >= 250, else 0.00"
      - "Verifier.billable_query_balance_cents += billed_amount_cents; Verifier.open_session_count -= 1"
      - "appends PresentationLogEntry(outcome=DISCLOSED, billing_state=BILLED, credential_pseudonym = the per-verifier salted pseudonym of this credential, retention_days_declared = session.retention_days, pseudonym_reuse_index computed, recorded_at = current_utc)"
      - "Verifier.exposure_index recomputed by verifier_exposure_index variant ROLLING_WINDOW; >= 90 drives trust_status to SUSPENDED, else >= 60 drives an APPROVED verifier to PROBATION, each incrementing probation_strike_count by 1"
      - "increments PresentationSession.version by 1"

  - method: POST
    path: "/mdl/presentation-sessions/{id}/void-billing"
    description: "The privacy auditor voids the billing of a completed presentation found to breach purpose scope. The exact compensating action for the disclose billing side effects."
    roles: [PrivacyAuditor]
    code: 200
    input: []
    output: PresentationSession
    side_effects:
      - "PresentationSession.billing_state BILLED -> VOIDED; billed_amount_cents left intact as the audit record of what was voided"
      - "every PresentationLogEntry of this session has billing_state set to VOIDED"
      - "Verifier.credited_amount_cents += the voided amount; Verifier.billable_query_balance_cents -= the voided amount, returning it to its exact pre-disclosure value"
      - "Verifier.exposure_index unchanged - the exposure formula has no billing filter, so a billing compensation must not move the privacy score"
      - "increments PresentationSession.version by 1"

  - method: GET
    path: "/mdl/presentation-sessions/{id}/log-entries"
    description: "Read the pseudonymised log entries a presentation produced. FK reverse-reachability for PresentationLogEntry.presentation_session_id."
    roles: [PrivacyAuditor, SystemAdmin, Holder]
    code: 200
    input: ["limit?", "offset?"]
    output: PresentationLogEntry[]
    side_effects: []

  # ------------------------------ test clock -------------------------------
  - method: POST
    path: "/mdl/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the logical clock every current_utc reference in this specification reads. The clock MUST start at the default 2026-08-01T00:00:00Z on a fresh server and only this endpoint may move it."
    roles: [SystemAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects:
      - "the logical clock becomes to_iso8601; no entity is mutated and no lazy transition is applied by this call alone"

# =============================================================================
# 1.6 Error Catalog   (http_status values match 1.4 exactly)
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-User-Role is absent or empty, or X-User-Role is not one of the six roles declared in 1.7."

  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    condition: "The acting X-User-Role is not listed in the called endpoint's roles."

  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "A required input field is missing, an enum value is outside its declared set, an integer is out of range, a datetime is not ISO-8601, an array is not an array of strings, an interval's start is not strictly before its end, or consent_decision == APPROVE arrives without unlock_method."

  - error_id: ERR_INTEROP_PROFILE_NOT_FOUND
    http_status: 404
    condition: "The path id or interop_profile_id matches no InteropProfile."

  - error_id: ERR_HOLDER_NOT_FOUND
    http_status: 404
    condition: "The path id or holder_id matches no Holder."

  - error_id: ERR_PROOFING_SESSION_NOT_FOUND
    http_status: 404
    condition: "The path id or proofing_session_id matches no IdentityProofingSession."

  - error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    condition: "The path id or device_id matches no Device."

  - error_id: ERR_CREDENTIAL_NOT_FOUND
    http_status: 404
    condition: "The path id, credential_id or supersedes_credential_id matches no DigitalCredential."

  - error_id: ERR_UPDATE_ORDER_NOT_FOUND
    http_status: 404
    condition: "The path id matches no UpdateOrder."

  - error_id: ERR_UPDATE_DELIVERY_NOT_FOUND
    http_status: 404
    condition: "The path id matches no UpdateDelivery."

  - error_id: ERR_VERIFIER_NOT_FOUND
    http_status: 404
    condition: "The path id or verifier_id matches no Verifier."

  - error_id: ERR_READER_APP_NOT_FOUND
    http_status: 404
    condition: "The path id or reader_app_id matches no ReaderApp."

  - error_id: ERR_PRESENTATION_SESSION_NOT_FOUND
    http_status: 404
    condition: "The path id matches no PresentationSession."

  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "A Holder-role X-User-ID does not equal the holder_id of the Holder, Device, DigitalCredential or presented credential it acts on; or a VerifierOperator X-User-ID does not equal ReaderApp.verifier_id for the reader app or presentation session it acts on."

  - error_id: ERR_INVALID_STATE
    http_status: 409
    condition: "The target entity is not in a state from which the requested transition is declared in 1.2 - including every attempt from a terminal state, every repeat of a one-shot trigger, disclose on a session that is not CONSENT_GRANTED, and REINSTATE while exposure_index >= 60."

  - error_id: ERR_DELIVERY_NOT_PENDING
    http_status: 409
    condition: "deliver or fail is called on an UpdateDelivery whose status is DELIVERED, FAILED or SUPERSEDED."

  - error_id: ERR_SESSION_NOT_CONSENT_PENDING
    http_status: 409
    condition: "consent is called on a PresentationSession whose state is not CONSENT_PENDING."

  - error_id: ERR_BILLING_ALREADY_VOIDED
    http_status: 409
    condition: "void-billing is called on a PresentationSession whose billing_state is not BILLED (UNBILLED or already VOIDED)."

  - error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412
    condition: "expected_device_version on POST /mdl/credentials does not equal the current Device.version."

  - error_id: ERR_STALE_INTEROP_VERSION
    http_status: 412
    condition: "expected_interop_profile_version on POST /mdl/trust-list-snapshots does not equal the current InteropProfile.version."

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "The adjudicating X-User-ID equals IdentityProofingSession.proofing_agent_user_id."

  - error_id: ERR_HANDSET_SURRENDER_PROHIBITED
    http_status: 422
    condition: "handset_handling == SURRENDER_REQUESTED on a presentation request. No verifier, law enforcement included, may require the holder to hand over the handset; only NO_SURRENDER and TAP_TO_READ are permitted."

  - error_id: ERR_LAW_ENFORCEMENT_CONTEXT_NOT_PERMITTED
    http_status: 403
    condition: "context == LAW_ENFORCEMENT while the owning Verifier.category != LAW_ENFORCEMENT."

  - error_id: ERR_READER_NOT_TRUSTED
    http_status: 403
    condition: "ReaderApp.trust_state != LISTED, or the newest TrustListSnapshot of the active InteropProfile does not satisfy effective_from <= current_utc < effective_until."

  - error_id: ERR_VERIFIER_NOT_TRUSTED
    http_status: 403
    condition: "Verifier.trust_status is not in {APPROVED, PROBATION} - i.e. APPLIED, SUSPENDED or TERMINATED - when registering a reader app or opening a presentation."

  - error_id: ERR_DEVICE_BINDING_MISMATCH
    http_status: 409
    condition: "The Device backing a provisioning or an activation is not in {ATTESTED, BOUND}, or its holder_id differs from the credential's holder_id."

  - error_id: ERR_DEVICE_NOT_BOUND
    http_status: 409
    condition: "The Device behind an update delivery is not in state BOUND."

  - error_id: ERR_PHYSICAL_CREDENTIAL_INELIGIBLE
    http_status: 422
    condition: "Holder.physical_credential_status != VALID, or Holder.physical_credential_expires_on <= date(current_utc), at proofing creation, proofing submission, provisioning or activation."

  - error_id: ERR_PROOFING_ASSURANCE_EXPIRED
    http_status: 409
    condition: "The IdentityProofingSession named on POST /mdl/credentials has assurance_expires_at <= current_utc, or has already lapsed to state EXPIRED."

  - error_id: ERR_CREDENTIAL_VALIDITY_OVERLAP
    http_status: 409
    condition: "INTERVAL SEMANTICS A - half-open [valid_from, valid_until), adjacency allowed. The requested window strictly overlaps another DigitalCredential on the same device_id with lifecycle_state IN {PENDING_PROVISION, ACTIVE, SUSPENDED}; windows that merely touch at an endpoint are accepted."

  - error_id: ERR_TRUST_LIST_WINDOW_OVERLAP
    http_status: 409
    condition: "INTERVAL SEMANTICS B - exact tiling. The new snapshot's effective_from is strictly earlier than the newest existing snapshot's effective_until for the same profile."

  - error_id: ERR_TRUST_LIST_WINDOW_GAP
    http_status: 422
    condition: "INTERVAL SEMANTICS B - exact tiling. The new snapshot's effective_from is strictly later than the newest existing snapshot's effective_until, which would leave readers with no valid list."

  - error_id: ERR_CERT_WINDOW_CONFLICT
    http_status: 422
    condition: "INTERVAL SEMANTICS C - closed windows plus a 24-hour renewal buffer. A new ReaderApp sharing app_identifier with an existing app of the same verifier in trust_state IN {PENDING, LISTED} has cert_not_before earlier than that app's cert_not_after + 24 hours; exact adjacency is also rejected."

  - error_id: ERR_DUPLICATE_READER_APP
    http_status: 409
    condition: "(verifier_id, certificate_serial) is already registered."

  - error_id: ERR_ASSURANCE_LEVEL_INSUFFICIENT
    http_status: 422
    condition: "adjudication_score < 260 at adjudication, or the session's achieved_assurance_level is below InteropProfile.required_assurance_level on the ladder IAL1 < IAL1_5 < IAL2 at provisioning."

  - error_id: ERR_DEVICE_LIMIT_EXCEEDED
    http_status: 409
    condition: "Holder.bound_device_count is already at InteropProfile.max_devices_per_holder when a device is attested PASS."

  - error_id: ERR_ACTIVE_CREDENTIAL_LIMIT_EXCEEDED
    http_status: 409
    condition: "Holder.active_credential_count is already at InteropProfile.max_active_credentials_per_holder when a credential that does not supersede an active predecessor is activated."

  - error_id: ERR_DATA_MINIMIZATION_VIOLATION
    http_status: 422
    condition: "In an AGE_ONLY presentation request at least one requested element is not a member of InteropProfile.age_only_allowed_elements. AGE_ONLY is strict: no session row is created."

  - error_id: ERR_PROTECTION_METHOD_MISMATCH
    http_status: 422
    condition: "device_unlock_proof != Device.protection_method at activation, or unlock_method != DigitalCredential.protection_method_at_activation at consent."

  - error_id: ERR_REVOCATION_STATUS_STALE
    http_status: 409
    condition: "On POST /mdl/update-deliveries/{id}/deliver the credential's revocation_status_projection has status != VALID or staleness_seconds > InteropProfile.revocation_freshness_seconds. On the presentation path the same condition instead forks the session to BLOCKED_BY_POLICY rather than erroring."

  - error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    condition: "A proofing session is submitted with evidence_count < 2."

  - error_id: ERR_RETENTION_CEILING_EXCEEDED
    http_status: 422
    condition: "PresentationSession.retention_days > Verifier.retention_ceiling_days; exactly the ceiling is accepted."

  - error_id: ERR_VERIFIER_ACCOUNT_DELINQUENT
    http_status: 402
    condition: "Verifier.billable_query_balance_cents > 50000 when a disclosure would be billed."

# =============================================================================
# 1.7 Role Definitions   (role_model: segregation_of_duties)
# =============================================================================
roles:
  - role: SystemAdmin
    identity: opaque
    description: "State motor vehicle agency program administrator. Owns the interoperability profile, trust-list publication, holder records, device attestation and wipe, credential revocation, update dispatch, verifier trust decisions and reader-app listing."
    exclusive_operations:
      - "POST /mdl/interop-profiles"
      - "POST /mdl/trust-list-snapshots"
      - "POST /mdl/holders"
      - "PATCH /mdl/holders/{id}/physical-credential"
      - "POST /mdl/holders/{id}/address-change"
      - "POST /mdl/devices/{id}/attest"
      - "POST /mdl/devices/{id}/wipe"
      - "POST /mdl/credentials/{id}/revoke"
      - "POST /mdl/update-deliveries/{id}/deliver"
      - "POST /mdl/update-deliveries/{id}/fail"
      - "POST /mdl/verifiers"
      - "POST /mdl/verifiers/{id}/trust-decision"
      - "POST /mdl/reader-apps/{id}/list-decision"
      - "POST /mdl/_clock/set_current_utc"
    shared_operations:
      - "GET /mdl/interop-profiles/{id}"
      - "GET /mdl/interop-profiles/{id}/trust-list-snapshots"
      - "GET /mdl/holders/{id}"
      - "GET /mdl/holders/{id}/devices"
      - "GET /mdl/holders/{id}/proofing-sessions"
      - "GET /mdl/proofing-sessions/{id}"
      - "GET /mdl/proofing-sessions/{id}/evidence"
      - "GET /mdl/proofing-sessions/{id}/assurance-preview"
      - "POST /mdl/devices"
      - "GET /mdl/devices/{id}"
      - "POST /mdl/devices/{id}/report-lost"
      - "POST /mdl/devices/{id}/recover"
      - "GET /mdl/credentials/{id}"
      - "GET /mdl/credentials"
      - "GET /mdl/credentials/{id}/revocation-entries"
      - "GET /mdl/credentials/{id}/revocation-status"
      - "GET /mdl/credentials/{id}/deliveries"
      - "GET /mdl/update-orders/{id}"
      - "GET /mdl/update-orders"
      - "GET /mdl/update-orders/{id}/deliveries"
      - "GET /mdl/verifiers/{id}"
      - "GET /mdl/verifiers/{id}/exposure-index"
      - "GET /mdl/verifiers/{id}/invoice"
      - "GET /mdl/verifiers/{id}/reader-apps"
      - "GET /mdl/verifiers/{id}/presentation-log-entries"
      - "GET /mdl/presentation-sessions/{id}"
      - "GET /mdl/presentation-sessions"
      - "GET /mdl/presentation-sessions/{id}/log-entries"

  - role: ProofingAgent
    identity: opaque
    description: "Field-office identity-proofing clerk. Opens proofing sessions, captures evidence and submits for adjudication. Recorded as proofing_agent_user_id, which bars the same user from adjudicating that session."
    exclusive_operations:
      - "POST /mdl/proofing-sessions"
      - "POST /mdl/proofing-sessions/{id}/evidence"
      - "POST /mdl/proofing-sessions/{id}/submit"
    shared_operations:
      - "GET /mdl/holders/{id}"
      - "GET /mdl/holders/{id}/proofing-sessions"
      - "GET /mdl/proofing-sessions/{id}"
      - "GET /mdl/proofing-sessions/{id}/evidence"
      - "GET /mdl/proofing-sessions/{id}/assurance-preview"

  - role: CredentialAdjudicator
    identity: opaque
    description: "Central issuance adjudicator. Decides proofing outcomes and provisions and renews digital credentials. Segregation of duties applies against the proofing agent of the same session."
    exclusive_operations:
      - "POST /mdl/proofing-sessions/{id}/adjudicate"
      - "POST /mdl/credentials"
      - "POST /mdl/credentials/{id}/renew"
    shared_operations:
      - "GET /mdl/interop-profiles/{id}"
      - "GET /mdl/holders/{id}"
      - "GET /mdl/holders/{id}/proofing-sessions"
      - "GET /mdl/proofing-sessions/{id}"
      - "GET /mdl/proofing-sessions/{id}/evidence"
      - "GET /mdl/proofing-sessions/{id}/assurance-preview"
      - "GET /mdl/devices/{id}"
      - "GET /mdl/credentials/{id}"
      - "GET /mdl/credentials"
      - "GET /mdl/credentials/{id}/revocation-entries"
      - "GET /mdl/credentials/{id}/revocation-status"

  - role: Holder
    identity: entity_backed:Holder
    description: "The person the credential belongs to, acting from the handset. X-User-ID is the Holder.id. Registers devices, activates credentials, reports loss and recovery, and grants or denies presentation consent - always scoped to their own holder_id chain."
    exclusive_operations:
      - "POST /mdl/credentials/{id}/activate"
      - "POST /mdl/presentation-sessions/{id}/consent"
    shared_operations:
      - "GET /mdl/holders/{id}"
      - "GET /mdl/holders/{id}/devices"
      - "POST /mdl/devices"
      - "GET /mdl/devices/{id}"
      - "POST /mdl/devices/{id}/report-lost"
      - "POST /mdl/devices/{id}/recover"
      - "GET /mdl/credentials/{id}"
      - "GET /mdl/credentials"
      - "GET /mdl/credentials/{id}/deliveries"
      - "GET /mdl/update-orders/{id}"
      - "GET /mdl/update-orders"
      - "GET /mdl/update-orders/{id}/deliveries"
      - "GET /mdl/presentation-sessions/{id}"
      - "GET /mdl/presentation-sessions"
      - "GET /mdl/presentation-sessions/{id}/log-entries"

  - role: VerifierOperator
    identity: entity_backed:Verifier
    description: "Relying-party operator. X-User-ID is the Verifier.id. Registers reader applications, attests retention practice and drives presentation requests to disclosure - always scoped to reader apps whose verifier_id equals X-User-ID."
    exclusive_operations:
      - "POST /mdl/reader-apps"
      - "POST /mdl/verifiers/{id}/retention-attestation"
      - "POST /mdl/presentation-sessions"
      - "POST /mdl/presentation-sessions/{id}/disclose"
    shared_operations:
      - "GET /mdl/interop-profiles/{id}"
      - "GET /mdl/interop-profiles/{id}/trust-list-snapshots"
      - "GET /mdl/verifiers/{id}"
      - "GET /mdl/verifiers/{id}/exposure-index"
      - "GET /mdl/verifiers/{id}/invoice"
      - "GET /mdl/verifiers/{id}/reader-apps"
      - "GET /mdl/credentials/{id}"
      - "GET /mdl/credentials/{id}/revocation-entries"
      - "GET /mdl/credentials/{id}/revocation-status"
      - "GET /mdl/presentation-sessions/{id}"
      - "GET /mdl/presentation-sessions"

  - role: PrivacyAuditor
    identity: opaque
    description: "Independent privacy oversight office. Reads the pseudonymised presentation log and exposure indices and voids the billing of presentations that breached purpose scope. Holds no issuance authority whatsoever."
    exclusive_operations:
      - "POST /mdl/presentation-sessions/{id}/void-billing"
    shared_operations:
      - "GET /mdl/interop-profiles/{id}"
      - "GET /mdl/interop-profiles/{id}/trust-list-snapshots"
      - "GET /mdl/holders/{id}/devices"
      - "GET /mdl/devices/{id}"
      - "GET /mdl/credentials/{id}"
      - "GET /mdl/credentials"
      - "GET /mdl/credentials/{id}/revocation-entries"
      - "GET /mdl/credentials/{id}/revocation-status"
      - "GET /mdl/verifiers/{id}"
      - "GET /mdl/verifiers/{id}/exposure-index"
      - "GET /mdl/verifiers/{id}/reader-apps"
      - "GET /mdl/verifiers/{id}/presentation-log-entries"
      - "GET /mdl/presentation-sessions/{id}"
      - "GET /mdl/presentation-sessions"
      - "GET /mdl/presentation-sessions/{id}/log-entries"
