scenario: |
  Aerial Firefighting Contract Operations (USFS/CAL FIRE contract carrier): agency contract (exclusive-use vs call-when-needed) & availability rate, daily availability vs flight-hour billing, dispatch acceptance & resource ordering, aircraft/crew readiness inspection & carding, retardant load & reload turn time, flight-hour limits & crew day, incident assignment & demobilization, invoice reconciliation with agency records

domain_name: "aerial-firefighting-contract-ops"
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: contract_number, type: string, source: input, description: "Carrier-assigned contract number; unique across all contracts" }
      - { name: agency, type: enum, source: input, description: "Contracting agency", constraints: "USFS | CAL_FIRE" }
      - { name: contract_type, type: enum, source: input, description: "Exclusive-use (guaranteed availability, mandatory dispatch acceptance window) vs call-when-needed (carrier may decline; availability must be confirmed by agency)", constraints: "EXCLUSIVE_USE | CALL_WHEN_NEEDED" }
      - { name: daily_availability_rate_cents, type: integer, source: input, description: "Daily availability rate in cents, paid per qualifying availability day", constraints: "> 0" }
      - { name: flight_hour_rate_cents, type: integer, source: input, description: "Per-flight-hour rate in cents", constraints: "> 0" }
      - { name: season_start_date, type: string, source: input, description: "First date (YYYY-MM-DD) of the contractual fire season; availability service dates must fall inside [season_start_date, season_end_date]" }
      - { name: season_end_date, type: string, source: input, description: "Last date (YYYY-MM-DD) of the season; must be strictly after season_start_date" }
      - { name: min_daily_available_minutes, type: integer, source: input, description: "Minimum available minutes for an exclusive-use day to bill at full rate", default: 570, constraints: "> 0" }
      - { name: season_flight_hour_cap_tenths, type: integer, source: input, description: "Season-wide flight-hour cap expressed in tenths of an hour (e.g. 2000 = 200.0 h)", constraints: "> 0" }
      - { name: acceptance_window_minutes, type: integer, source: input, description: "Minutes after dispatch-order placement within which the carrier must accept", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Contract lifecycle", default: DRAFT, constraints: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }
      - { name: season_billed_cents, type: integer, source: computed, description: "Sum of net_cents over this contract's invoices in status {SUBMITTED, DISPUTED, RECONCILED, PAID}; see season_billed_invariant", default: 0 }
      - { name: season_flight_hours_tenths, type: integer, source: computed, description: "Sum of flight_hours_tenths over all FlightLogs whose assignment traces to a DispatchOrder of this contract", default: 0 }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: tail_number, type: string, source: input, description: "FAA tail number; unique across all aircraft" }
      - { name: model, type: string, source: input, description: "Aircraft model code, e.g. AT-802F" }
      - { name: tank_capacity_gallons, type: integer, source: input, description: "Retardant tank capacity in gallons", constraints: "> 0" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract this aircraft is listed on" }
      - { name: carding_status, type: enum, source: system, description: "Agency carding (readiness certification) status", default: UNCARDED, constraints: "UNCARDED | CARDED | SUSPENDED | DECARDED" }
      - { name: carded_until, type: string, source: system, description: "Date (YYYY-MM-DD) through which the current card is valid; set on inspection pass to date(completed_at) + valid_days; null while never carded", default: null }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Crew member legal name" }
      - { name: crew_role, type: enum, source: input, description: "Crew position", constraints: "PIC | SIC" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract this crew member is employed under" }
      - { name: qualified_aircraft_models, type: array, source: input, description: "Array of aircraft model codes this crew member is qualified on; [] means qualified on none" }
      - { name: carding_status, type: enum, source: system, description: "Agency carding status for this crew member", default: UNCARDED, constraints: "UNCARDED | CARDED | SUSPENDED" }
      - { name: carded_until, type: string, source: system, description: "Date through which the crew card is valid; null while never carded", default: null }
      - { name: duty_status, type: enum, source: system, description: "Duty availability dimension (parallel to carding_status): AVAILABLE until a duty day reaches the flight-hour limit, then FATIGUE_HOLD until rest-released", default: AVAILABLE, constraints: "AVAILABLE | FATIGUE_HOLD" }

  - name: CardingInspection
    parent: null
    common_fields: true
    fields:
      - { name: subject_aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; exactly one of subject_aircraft_id / subject_crew_member_id must be set", default: null }
      - { name: subject_crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; exactly one of subject_aircraft_id / subject_crew_member_id must be set", default: null }
      - { name: scheduled_for, type: datetime, source: input, description: "Scheduled inspection instant (ISO 8601 UTC)" }
      - { name: valid_days, type: integer, source: input, description: "Days of card validity granted on a PASSED result", default: 365, constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Inspection lifecycle", default: SCHEDULED, constraints: "SCHEDULED | COMPLETED" }
      - { name: result, type: enum, source: system, description: "Outcome recorded at completion", default: PENDING, constraints: "PENDING | PASSED | FAILED" }
      - { name: completed_at, type: datetime, source: system, description: "Instant the inspection was completed (supplied on the complete call); null until then", default: null }
      - { name: notes, type: string, source: input, description: "Inspector notes", default: null }

  - name: AvailabilityPeriod
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract the availability is offered under" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; aircraft made available" }
      - { name: service_date, type: string, source: input, description: "Date (YYYY-MM-DD) of availability; must lie inside the contract season; at most one AvailabilityPeriod per (aircraft_id, service_date) ever" }
      - { name: available_start, type: datetime, source: input, description: "Start of the available window (ISO 8601 UTC); must be before available_end" }
      - { name: available_end, type: datetime, source: input, description: "End of the available window; must be strictly after available_start" }
      - { name: status, type: enum, source: system, description: "Initial status is CONFIRMED for EXCLUSIVE_USE contracts and OFFERED for CALL_WHEN_NEEDED contracts", constraints: "OFFERED | CONFIRMED | UNAVAILABLE | EXCUSED" }
      - { name: excuse_reason, type: enum, source: system, description: "Why the period left CONFIRMED/OFFERED; set by excuse (input) or by the carding cascade (system)", default: null, constraints: "MAINTENANCE | CARDING | WEATHER | AGENCY_RELEASE" }
      - { name: available_minutes, type: integer, source: computed, description: "(available_end - available_start) in whole minutes" }
      - { name: availability_charge_cents, type: integer, source: computed, description: "Billable amount for this day per availability_charge calculation", default: 0 }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: incident_number, type: string, source: input, description: "Agency incident number; unique" }
      - { name: name, type: string, source: input, description: "Incident name" }
      - { name: location, type: string, source: input, description: "Free-form location (lat,long or description)" }
      - { name: agency, type: enum, source: input, description: "Owning agency", constraints: "USFS | CAL_FIRE" }
      - { name: priority, type: enum, source: input, description: "Attack priority", constraints: "INITIAL_ATTACK | EXTENDED_ATTACK" }
      - { name: status, type: enum, source: system, description: "Incident lifecycle", default: REPORTED, constraints: "REPORTED | ACTIVE | CONTAINED | CLOSED" }

  - name: DispatchOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_number, type: string, source: input, description: "Agency resource-order number; unique" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract being ordered against" }
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident the order is for" }
      - { name: aircraft_quantity, type: integer, source: input, description: "Number of aircraft requested", constraints: "> 0" }
      - { name: required_model, type: string, source: input, description: "Optional required aircraft model code", default: null }
      - { name: placed_at, type: datetime, source: system, description: "Instant the order was placed (server logical clock)" }
      - { name: accept_deadline, type: datetime, source: computed, description: "placed_at + contract.acceptance_window_minutes; acceptance allowed while clock <= accept_deadline" }
      - { name: status, type: enum, source: system, description: "Order lifecycle; PARTIALLY_FILLED/FILLED are auto-derived from filled_count vs aircraft_quantity", default: PLACED, constraints: "PLACED | ACCEPTED | PARTIALLY_FILLED | FILLED | DECLINED | CANCELLED | CLOSED" }
      - { name: filled_count, type: integer, source: computed, description: "Count of this order's assignments in status {ASSIGNED, EN_ROUTE, ON_INCIDENT}; see filled_count_invariant", default: 0 }
      - { name: decline_reason, type: string, source: system, description: "Carrier-supplied reason captured on decline", default: null }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: dispatch_order_id, type: string, source: input, description: "FK -> DispatchOrder.id (path); order this assignment fills" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; assigned aircraft" }
      - { name: pilot_id, type: string, source: input, description: "FK -> CrewMember.id; assigned pilot-in-command" }
      - { name: planned_start, type: datetime, source: input, description: "Planned assignment window start (ISO 8601 UTC); must be before planned_end" }
      - { name: planned_end, type: datetime, source: input, description: "Planned assignment window end; strictly after planned_start" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle", default: ASSIGNED, constraints: "ASSIGNED | EN_ROUTE | ON_INCIDENT | RELEASED | DEMOBILIZED" }
      - { name: assigned_at, type: datetime, source: system, description: "Creation instant (server logical clock)" }
      - { name: launched_at, type: datetime, source: system, description: "Launch instant; null until launched", default: null }
      - { name: arrived_at, type: datetime, source: system, description: "On-incident instant; null until arrival", default: null }
      - { name: released_at, type: datetime, source: system, description: "Release instant; null until released", default: null }
      - { name: demobilized_at, type: datetime, source: system, description: "Demobilization instant; null until demobilized", default: null }
      - { name: release_reason, type: enum, source: system, description: "AGENCY or MECHANICAL from the release call input; FATIGUE when set by the fatigue cascade", default: null, constraints: "AGENCY | MECHANICAL | FATIGUE" }
      - { name: reload_turn_avg_minutes, type: number, source: computed, description: "Average reload_turn_minutes over this assignment's loads with non-null turn, 1 decimal, round_half_up; null when no turns recorded", default: null }
      - { name: reload_sla_breach, type: boolean, source: computed, description: "true iff reload_turn_avg_minutes > 30.0 (strictly greater; exactly 30.0 is NOT a breach)", default: false }

  - name: FlightLog
    parent: null
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id (path); assignment the sortie belongs to" }
      - { name: pilot_id, type: string, source: system, description: "FK -> CrewMember.id; copied from assignment.pilot_id at creation" }
      - { name: logged_date, type: string, source: input, description: "Date (YYYY-MM-DD) the flight is charged to; drives CrewDutyDay accumulation" }
      - { name: hobbs_start, type: number, source: input, description: "Hobbs meter at engine start (hours)" }
      - { name: hobbs_stop, type: number, source: input, description: "Hobbs meter at engine stop; must be strictly greater than hobbs_start" }
      - { name: flight_hours_tenths, type: integer, source: computed, description: "round_half_up((hobbs_stop - hobbs_start) * 10, 0) — per-sortie rounding, first step of flight_sortie_billing" }
      - { name: billable_cents, type: integer, source: computed, description: "round_half_up(flight_hours_tenths / 10 * contract.flight_hour_rate_cents, 0) — second per-sortie rounding; invoice flight subtotal sums these per-sortie amounts" }

  - name: RetardantLoad
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id (path); assignment being reloaded" }
      - { name: gallons, type: integer, source: input, description: "Gallons loaded; must be <= aircraft tank_capacity_gallons", constraints: "> 0" }
      - { name: requested_at, type: datetime, source: input, description: "When the reload was requested; defaults to the server logical clock when omitted", default: null }
      - { name: loaded_at, type: datetime, source: system, description: "When loading completed; supplied on the load call; must be >= requested_at", default: null }
      - { name: dropped_at, type: datetime, source: system, description: "When the load was dropped; supplied on the drop call; must be >= loaded_at", default: null }
      - { name: status, type: enum, source: system, description: "Load lifecycle", default: REQUESTED, constraints: "REQUESTED | LOADED | DROPPED" }
      - { name: reload_turn_minutes, type: integer, source: computed, description: "loaded_at minus the previous DROPPED load's dropped_at for the same assignment (previous = greatest dropped_at strictly before this loaded_at; tie-break on equal dropped_at: the load with earlier created_at); null for the first load of the assignment", default: null }

  - name: CrewDutyDay
    parent: null
    common_fields: true
    fields:
      - { name: crew_member_id, type: string, source: system, description: "FK -> CrewMember.id; crew member this duty day belongs to" }
      - { name: duty_date, type: string, source: system, description: "Date (YYYY-MM-DD) of the duty day; at most one CrewDutyDay per (crew_member_id, duty_date)" }
      - { name: duty_start, type: datetime, source: system, description: "Start of the duty day: planned_start of the first assignment that created this duty day; null when the duty day was created by a bare flight log", default: null }
      - { name: flown_tenths, type: integer, source: computed, description: "Chronological variant of crew_duty_projection: sum of flight_hours_tenths over this crew member's FlightLogs with logged_date == duty_date", default: 0 }
      - { name: projected_tenths, type: integer, source: computed, description: "Forward-looking variant of crew_duty_projection: flown_tenths + planned window tenths of this crew member's assignments in status ASSIGNED with date(planned_start) == duty_date", default: 0 }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id (path); contract being billed" }
      - { name: period_start, type: string, source: input, description: "First billed date (YYYY-MM-DD, inclusive); <= period_end; at most one non-VOID invoice per (contract_id, period_start)" }
      - { name: period_end, type: string, source: input, description: "Last billed date (inclusive); >= period_start" }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle; DISPUTED -> SUBMITTED resubmission loop is allowed", default: DRAFT, constraints: "DRAFT | SUBMITTED | DISPUTED | RECONCILED | PAID | VOID" }
      - { name: billing_basis, type: enum, source: system, description: "PROVISIONAL = carrier logs; RECONCILED = agency records where matched (see reconciliation_billing)", default: PROVISIONAL, constraints: "PROVISIONAL | RECONCILED" }
      - { name: availability_subtotal_cents, type: integer, source: computed, description: "Sum of carrier_amount_cents over AVAILABILITY_DAY lines (availability is billed carrier-basis in both variants)", default: 0 }
      - { name: flight_subtotal_cents, type: integer, source: computed, description: "Sum over FLIGHT_DAY lines of billed_amount_cents under the current billing_basis", default: 0 }
      - { name: penalty_cents, type: integer, source: computed, description: "Availability compliance penalty per invoice_net_composition", default: 0 }
      - { name: net_cents, type: integer, source: computed, description: "availability_subtotal_cents + flight_subtotal_cents - penalty_cents", default: 0 }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of the CarrierFinance operator who submitted; null until submitted", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Submission instant; null until submitted", default: null }
      - { name: reconciled_by, type: string, source: system, description: "X-User-ID of the AgencyFinance operator who reconciled; null until reconciled", default: null }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded on dispute (manual dispute or reconcile mismatch)", default: null }

  - name: InvoiceLineItem
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; owning invoice" }
      - { name: line_type, type: enum, source: system, description: "Charge kind", constraints: "AVAILABILITY_DAY | FLIGHT_DAY | PENALTY" }
      - { name: reference_date, type: string, source: system, description: "service_date (AVAILABILITY_DAY) or logged_date (FLIGHT_DAY); period date for PENALTY lines" }
      - { name: source_ref_id, type: string, source: system, description: "availability_period_id (AVAILABILITY_DAY) or assignment_id (FLIGHT_DAY); invoice id for PENALTY" }
      - { name: carrier_qty, type: integer, source: system, description: "Carrier-basis quantity: available_minutes (AVAILABILITY_DAY) or tenths-of-hour summed per sortie (FLIGHT_DAY); 0 for PENALTY" }
      - { name: carrier_amount_cents, type: integer, source: system, description: "Carrier-basis charge: availability_charge_cents (AVAILABILITY_DAY), sum of per-sortie billable_cents (FLIGHT_DAY), -penalty_cents (PENALTY)" }
      - { name: agency_qty, type: integer, source: system, description: "Agency-recorded tenths-of-hour from the matching AgencyRecord (FLIGHT_DAY only); null until reconcile or when no record matches", default: null }
      - { name: agency_amount_cents, type: integer, source: system, description: "round_half_up(agency_qty / 10 * flight_hour_rate_cents, 0) when matched; equals carrier_amount_cents for AVAILABILITY_DAY/PENALTY lines and for unmatched FLIGHT_DAY lines", default: null }
      - { name: billed_amount_cents, type: integer, source: computed, description: "carrier_amount_cents while invoice.billing_basis == PROVISIONAL; agency_amount_cents once RECONCILED" }
      - { name: mismatch_flag, type: boolean, source: computed, description: "true iff a matching AgencyRecord exists and |carrier_qty - agency_qty| > 1 (tenths)", default: false }

  - name: AgencyRecord
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract the agency record belongs to" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; assignment the agency logged flight time against" }
      - { name: record_date, type: string, source: input, description: "Date (YYYY-MM-DD) the agency record covers" }
      - { name: agency_flight_hours_tenths, type: integer, source: input, description: "Agency-recorded flight time in tenths of an hour for (assignment_id, record_date)", constraints: ">= 0" }
      - { name: agency_available_minutes, type: integer, source: input, description: "Optional agency-recorded available minutes (informational only; availability lines always bill carrier-basis)", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: CarrierOps
        preconditions: ["contract.status == DRAFT"]
        side_effects: ["increments Contract.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contracts/{id}/suspend"
        actor: CarrierOps
        preconditions: ["contract.status == ACTIVE"]
        side_effects: ["increments Contract.version by 1", "in-flight Assignments and DRAFT invoices are NOT touched (suspension only gates new business: dispatch orders, availability periods, invoices)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{id}/resume"
        actor: CarrierOps
        preconditions: ["contract.status == SUSPENDED"]
        side_effects: ["increments Contract.version by 1"]
        note: "ACTIVE -> SUSPENDED -> ACTIVE is a deliberate cycle (stop-work orders lifted mid-season)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /contracts/{id}/close"
        actor: CarrierOps
        preconditions: ["contract.status == ACTIVE", "no DispatchOrder of this contract is in status {PLACED, ACCEPTED, PARTIALLY_FILLED, FILLED}"]
        side_effects: ["increments Contract.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /contracts/{id}/close"
        actor: CarrierOps
        preconditions: ["contract.status == SUSPENDED", "no DispatchOrder of this contract is in status {PLACED, ACCEPTED, PARTIALLY_FILLED, FILLED}"]
        side_effects: ["increments Contract.version by 1"]

  - entity: Aircraft
    initial_state: UNCARDED
    terminal_states: [DECARDED]
    transitions:
      - from: UNCARDED
        to: CARDED
        trigger: "system: POST /carding-inspections/{id}/complete with result == PASSED on subject_aircraft_id"
        actor: system
        preconditions: ["aircraft.carding_status == UNCARDED"]
        side_effects: ["aircraft.carded_until := date(inspection.completed_at) + inspection.valid_days", "increments Aircraft.version by 1"]
      - from: CARDED
        to: SUSPENDED
        trigger: "system: POST /carding-inspections/{id}/complete with result == FAILED on subject_aircraft_id"
        actor: system
        preconditions: ["aircraft.carding_status == CARDED"]
        side_effects:
          - "aircraft.carded_until := null"
          - "CASCADE link 1 -> 2: every AvailabilityPeriod with aircraft_id == this aircraft, status == CONFIRMED, and service_date >= date(inspection.completed_at) flips to UNAVAILABLE with excuse_reason := CARDING (increments each period's version)"
          - "CASCADE link 2 -> 3: each such AvailabilityPeriod flip triggers recompute of availability_charge_cents for the period and re-derives every DRAFT Invoice of the same contract whose [period_start, period_end] covers the period's service_date (line items regenerated; availability_subtotal_cents, penalty_cents, net_cents recomputed per invoice_net_composition; increments each invoice's version)"
          - "increments Aircraft.version by 1"
        note: "3-link cascade: inspection FAILED -> Aircraft SUSPENDED -> AvailabilityPeriod UNAVAILABLE -> DRAFT Invoice recomputed"
      - from: SUSPENDED
        to: CARDED
        trigger: "system: POST /carding-inspections/{id}/complete with result == PASSED on subject_aircraft_id"
        actor: system
        preconditions: ["aircraft.carding_status == SUSPENDED"]
        side_effects: ["aircraft.carded_until := date(inspection.completed_at) + inspection.valid_days", "increments Aircraft.version by 1", "NOTE: periods already flipped to UNAVAILABLE are NOT restored (compensation is explicit: carrier posts nothing; UNAVAILABLE is terminal)"]
      - from: CARDED
        to: DECARDED
        trigger: "POST /aircraft/{id}/decard"
        actor: CarrierOps
        preconditions: ["aircraft.carding_status == CARDED", "no Assignment with aircraft_id == this aircraft in status {ASSIGNED, EN_ROUTE, ON_INCIDENT}"]
        side_effects: ["aircraft.carded_until := null", "increments Aircraft.version by 1"]
      - from: UNCARDED
        to: DECARDED
        trigger: "POST /aircraft/{id}/decard"
        actor: CarrierOps
        preconditions: ["aircraft.carding_status == UNCARDED"]
        side_effects: ["increments Aircraft.version by 1"]

  - entity: CrewMember
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: FATIGUE_HOLD
        trigger: "system: a FlightLog creation raises the CrewDutyDay (crew_member_id, logged_date) flown_tenths to >= 80"
        actor: system
        preconditions: ["crew_member.duty_status == AVAILABLE", "flown_tenths(after applying the new log) >= 80"]
        side_effects:
          - "CASCADE link 1: CrewDutyDay.flown_tenths incremented by the new log's flight_hours_tenths (the FlightLog -> CrewDutyDay link)"
          - "CASCADE link 2: this CrewMember.duty_status := FATIGUE_HOLD (the CrewDutyDay threshold -> CrewMember link)"
          - "CASCADE link 3: every Assignment with pilot_id == this crew member and status == ASSIGNED flips to RELEASED with release_reason := FATIGUE and released_at := clock (assignments in EN_ROUTE/ON_INCIDENT are NOT touched — conditional cascade)"
          - "CASCADE link 4: each released Assignment's DispatchOrder recomputes filled_count per filled_count_invariant and auto-transitions FILLED -> PARTIALLY_FILLED, or PARTIALLY_FILLED -> ACCEPTED when filled_count reaches 0 (increments each order's version)"
          - "increments CrewMember.version by 1"
        note: "4-link cascade: FlightLog -> CrewDutyDay -> CrewMember -> Assignment -> DispatchOrder"
      - from: FATIGUE_HOLD
        to: AVAILABLE
        trigger: "POST /crew-members/{id}/rest-release"
        actor: CarrierOps
        preconditions: ["crew_member.duty_status == FATIGUE_HOLD", "the crew member's latest CrewDutyDay.duty_date is strictly before the current logical clock date"]
        side_effects: ["increments CrewMember.version by 1"]
        note: "duty_status cycles AVAILABLE <-> FATIGUE_HOLD; carding_status (UNCARDED/CARDED/SUSPENDED via the same inspection triggers as Aircraft, minus DECARDED) evolves as a parallel, independent dimension on the same entity"

  - entity: CardingInspection
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /carding-inspections/{id}/complete"
        actor: CardingInspector
        preconditions: ["inspection.status == SCHEDULED", "result in {PASSED, FAILED}", "completed_at >= scheduled_for"]
        side_effects:
          - "inspection.result := input result; inspection.completed_at := input completed_at"
          - "on PASSED: subject (Aircraft or CrewMember) carding_status := CARDED, carded_until := date(completed_at) + valid_days"
          - "on FAILED: subject carding_status := SUSPENDED (aircraft: fires the Aircraft.CARDED->SUSPENDED cascade; crew: no availability cascade)"
          - "increments CardingInspection.version by 1"
      - from: COMPLETED
        to: SCHEDULED
        trigger: "POST /carding-inspections/{id}/reschedule"
        actor: CardingInspector
        preconditions: ["inspection.status == COMPLETED", "inspection.result == FAILED"]
        side_effects: ["inspection.result := PENDING", "inspection.completed_at := null", "inspection.scheduled_for := input scheduled_for", "increments CardingInspection.version by 1"]
        note: "COMPLETED(FAILED) -> SCHEDULED -> COMPLETED is the reinspection revision loop"

  - entity: AvailabilityPeriod
    initial_state: "OFFERED (CALL_WHEN_NEEDED contracts) or CONFIRMED (EXCLUSIVE_USE contracts)"
    terminal_states: [UNAVAILABLE, EXCUSED]
    transitions:
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /availability-periods/{id}/confirm"
        actor: AgencyDispatcher
        preconditions: ["period.status == OFFERED", "current clock date <= period.service_date"]
        side_effects: ["recompute period.availability_charge_cents per availability_charge", "re-derive covering DRAFT invoices", "increments AvailabilityPeriod.version by 1"]
      - from: OFFERED
        to: EXCUSED
        trigger: "POST /availability-periods/{id}/excuse"
        actor: CarrierOps
        preconditions: ["period.status == OFFERED"]
        side_effects: ["excuse_reason := input", "availability_charge_cents := 0", "increments AvailabilityPeriod.version by 1"]
      - from: CONFIRMED
        to: EXCUSED
        trigger: "POST /availability-periods/{id}/excuse"
        actor: CarrierOps
        preconditions: ["period.status == CONFIRMED"]
        side_effects: ["excuse_reason := input", "availability_charge_cents := 0", "re-derive covering DRAFT invoices", "increments AvailabilityPeriod.version by 1"]
      - from: CONFIRMED
        to: UNAVAILABLE
        trigger: "system: carding cascade (Aircraft.CARDED -> SUSPENDED)"
        actor: system
        preconditions: ["period.status == CONFIRMED", "period.service_date >= date(failed inspection.completed_at)"]
        side_effects: ["excuse_reason := CARDING", "availability_charge_cents := 0", "re-derive covering DRAFT invoices", "increments AvailabilityPeriod.version by 1"]

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: ACTIVE
        trigger: "POST /incidents/{id}/advance with to_status=ACTIVE"
        actor: AgencyDispatcher
        preconditions: ["incident.status == REPORTED"]
        side_effects: ["increments Incident.version by 1"]
      - from: ACTIVE
        to: CONTAINED
        trigger: "POST /incidents/{id}/advance with to_status=CONTAINED"
        actor: AgencyDispatcher
        preconditions: ["incident.status == ACTIVE"]
        side_effects: ["increments Incident.version by 1"]
      - from: CONTAINED
        to: CLOSED
        trigger: "POST /incidents/{id}/advance with to_status=CLOSED"
        actor: AgencyDispatcher
        preconditions: ["incident.status == CONTAINED"]
        side_effects: ["increments Incident.version by 1"]

  - entity: DispatchOrder
    initial_state: PLACED
    terminal_states: [DECLINED, CANCELLED, CLOSED]
    transitions:
      - from: PLACED
        to: ACCEPTED
        trigger: "POST /dispatch-orders/{id}/accept"
        actor: CarrierOps
        preconditions: ["order.status == PLACED", "order.contract.status == ACTIVE (cross-entity guard)", "current logical clock <= order.accept_deadline"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: PLACED
        to: DECLINED
        trigger: "POST /dispatch-orders/{id}/decline"
        actor: CarrierOps
        preconditions: ["order.status == PLACED"]
        side_effects: ["decline_reason := input", "increments DispatchOrder.version by 1"]
      - from: PLACED
        to: CANCELLED
        trigger: "POST /dispatch-orders/{id}/cancel"
        actor: AgencyDispatcher
        preconditions: ["order.status == PLACED"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /dispatch-orders/{id}/cancel"
        actor: AgencyDispatcher
        preconditions: ["order.status == ACCEPTED", "order.filled_count == 0"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: ACCEPTED
        to: PARTIALLY_FILLED
        trigger: "system: assignment creation leaves 0 < filled_count < aircraft_quantity"
        actor: system
        preconditions: ["0 < filled_count < aircraft_quantity"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: ACCEPTED
        to: FILLED
        trigger: "system: assignment creation leaves filled_count == aircraft_quantity"
        actor: system
        preconditions: ["filled_count == aircraft_quantity"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "system: assignment creation leaves filled_count == aircraft_quantity"
        actor: system
        preconditions: ["filled_count == aircraft_quantity"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: FILLED
        to: PARTIALLY_FILLED
        trigger: "system: an assignment release (agency or fatigue cascade) leaves 0 < filled_count < aircraft_quantity"
        actor: system
        preconditions: ["0 < filled_count < aircraft_quantity"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: PARTIALLY_FILLED
        to: ACCEPTED
        trigger: "system: an assignment release leaves filled_count == 0"
        actor: system
        preconditions: ["filled_count == 0"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: ACCEPTED
        to: CLOSED
        trigger: "system: demobilize leaves every assignment of the order DEMOBILIZED (at least one assignment exists)"
        actor: system
        preconditions: ["all assignments in DEMOBILIZED", "count(assignments) >= 1"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: PARTIALLY_FILLED
        to: CLOSED
        trigger: "system: demobilize leaves every assignment of the order DEMOBILIZED"
        actor: system
        preconditions: ["all assignments in DEMOBILIZED", "count(assignments) >= 1"]
        side_effects: ["increments DispatchOrder.version by 1"]
      - from: FILLED
        to: CLOSED
        trigger: "system: demobilize leaves every assignment of the order DEMOBILIZED"
        actor: system
        preconditions: ["all assignments in DEMOBILIZED", "count(assignments) >= 1"]
        side_effects: ["increments DispatchOrder.version by 1"]
    note: "filled status band is compound: order state is a derived aggregate of child assignment states (bubble-up on create/release/demobilize)"

  - entity: Assignment
    initial_state: ASSIGNED
    terminal_states: [DEMOBILIZED]
    transitions:
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /assignments/{id}/launch"
        actor: "Pilot (own assignment) or CarrierOps"
        preconditions: ["assignment.status == ASSIGNED", "aircraft.carding_status == CARDED", "aircraft.carded_until >= current clock date (else ERR_CARDING_EXPIRED)", "pilot.duty_status == AVAILABLE (else ERR_CREW_ON_FATIGUE_HOLD)"]
        side_effects: ["launched_at := clock", "increments Assignment.version by 1"]
      - from: EN_ROUTE
        to: ON_INCIDENT
        trigger: "POST /assignments/{id}/arrive"
        actor: "Pilot (own assignment) or CarrierOps"
        preconditions: ["assignment.status == EN_ROUTE"]
        side_effects: ["arrived_at := clock", "increments Assignment.version by 1"]
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /assignments/{id}/release (agency) OR system fatigue cascade"
        actor: "AgencyDispatcher | system"
        preconditions: ["assignment.status in {ASSIGNED} for agency release; cascade releases only ASSIGNED assignments"]
        side_effects: ["released_at := clock", "release_reason := input (AGENCY|MECHANICAL) or FATIGUE (cascade)", "DispatchOrder filled_count recomputed (bubble-up, may auto-transition FILLED->PARTIALLY_FILLED or PARTIALLY_FILLED->ACCEPTED)", "CrewDutyDay.projected_tenths recomputed for date(planned_start)", "increments Assignment.version by 1"]
      - from: EN_ROUTE
        to: RELEASED
        trigger: "POST /assignments/{id}/release"
        actor: AgencyDispatcher
        preconditions: ["assignment.status == EN_ROUTE"]
        side_effects: ["released_at := clock", "release_reason := input", "DispatchOrder filled_count recomputed (bubble-up)", "increments Assignment.version by 1"]
      - from: ON_INCIDENT
        to: RELEASED
        trigger: "POST /assignments/{id}/release"
        actor: AgencyDispatcher
        preconditions: ["assignment.status == ON_INCIDENT"]
        side_effects: ["released_at := clock", "release_reason := input", "DispatchOrder filled_count recomputed (bubble-up)", "increments Assignment.version by 1"]
      - from: RELEASED
        to: DEMOBILIZED
        trigger: "POST /assignments/{id}/demobilize"
        actor: CarrierOps
        preconditions: ["assignment.status == RELEASED"]
        side_effects: ["demobilized_at := clock", "if every assignment of the DispatchOrder is DEMOBILIZED and at least one exists, the order auto-transitions to CLOSED", "increments Assignment.version by 1"]

  - entity: RetardantLoad
    initial_state: REQUESTED
    terminal_states: [DROPPED]
    transitions:
      - from: REQUESTED
        to: LOADED
        trigger: "POST /retardant-loads/{id}/load"
        actor: CarrierOps
        preconditions: ["load.status == REQUESTED", "loaded_at >= requested_at"]
        side_effects: ["loaded_at := input", "reload_turn_minutes computed per reload_turn_time", "assignment.reload_turn_avg_minutes and reload_sla_breach recomputed", "increments RetardantLoad.version by 1", "increments Assignment.version by 1"]
      - from: LOADED
        to: DROPPED
        trigger: "POST /retardant-loads/{id}/drop"
        actor: "Pilot (own assignment) or CarrierOps"
        preconditions: ["load.status == LOADED", "dropped_at >= loaded_at"]
        side_effects: ["dropped_at := input", "increments RetardantLoad.version by 1"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /invoices/{id}/submit"
        actor: CarrierFinance
        preconditions: ["invoice.status == DRAFT", "invoice.period_end < current clock date (billing period must be closed)"]
        side_effects: ["submitted_by := X-User-ID", "submitted_at := clock", "contract.season_billed_cents += invoice.net_cents (season_billed_invariant)", "increments Invoice.version by 1", "increments Contract.version by 1"]
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute (manual) OR POST /invoices/{id}/reconcile when any FLIGHT_DAY line mismatches beyond tolerance"
        actor: "AgencyFinance | system"
        preconditions: ["invoice.status == SUBMITTED"]
        side_effects: ["dispute_reason := input reason or 'RECONCILIATION_MISMATCH'", "invoice stays on PROVISIONAL basis; season_billed_cents unchanged", "increments Invoice.version by 1"]
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /invoices/{id}/reconcile when no FLIGHT_DAY line mismatches beyond tolerance"
        actor: AgencyFinance
        preconditions: ["invoice.status == SUBMITTED", "X-User-ID != invoice.submitted_by (segregation of duties)"]
        side_effects: ["billing_basis := RECONCILED", "reconciled_by := X-User-ID", "FLIGHT_DAY lines re-billed on agency basis per reconciliation_billing", "flight_subtotal_cents and net_cents recomputed", "contract.season_billed_cents adjusted by (new net_cents - old net_cents)", "increments Invoice.version by 1", "increments Contract.version by 1"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /invoices/{id}/resubmit"
        actor: CarrierFinance
        preconditions: ["invoice.status == DISPUTED"]
        side_effects: ["dispute_reason := null", "submitted_by := X-User-ID", "submitted_at := clock", "season_billed_cents unchanged (invoice remained in the invariant set while DISPUTED)", "increments Invoice.version by 1"]
        note: "SUBMITTED -> DISPUTED -> SUBMITTED is the carrier/agency negotiation loop (cyclic)"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: CarrierFinance
        preconditions: ["invoice.status == DRAFT"]
        side_effects: ["season_billed_cents unchanged (DRAFT was never in the invariant set)", "increments Invoice.version by 1"]
      - from: SUBMITTED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: CarrierFinance
        preconditions: ["invoice.status == SUBMITTED"]
        side_effects: ["contract.season_billed_cents -= invoice.net_cents (compensation of the submit side effect)", "increments Invoice.version by 1", "increments Contract.version by 1"]
      - from: DISPUTED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: CarrierFinance
        preconditions: ["invoice.status == DISPUTED"]
        side_effects: ["contract.season_billed_cents -= invoice.net_cents", "increments Invoice.version by 1", "increments Contract.version by 1"]
      - from: RECONCILED
        to: PAID
        trigger: "POST /invoices/{id}/mark-paid"
        actor: AgencyFinance
        preconditions: ["invoice.status == RECONCILED"]
        side_effects: ["season_billed_cents unchanged (PAID stays in the invariant set)", "increments Invoice.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: occ-invoice-create-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/invoices"
    occ_field: "expected_contract_version"
    description: |
      Creating an Invoice against a Contract whose version has advanced since the
      client last read it is rejected. The client computes its billing view (rates,
      open periods, season_billed_cents) from a Contract read; another accepted write
      (invoice creation, availability cascade, submit/void adjustment) advances the
      version, so a create carrying the previously observed version is stale and is
      refused with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-assignment-create-dispatch
    parent_entity: DispatchOrder
    write_endpoint: "POST /dispatch-orders/{id}/assignments"
    occ_field: "expected_dispatch_order_version"
    description: |
      Creating an Assignment against a DispatchOrder whose version has advanced since
      the client last read it is rejected. The client decides how to fill remaining
      capacity from the order's filled_count; any accepted assignment creation or
      release cascade advances the version, so a create carrying the previously
      observed version is stale and is refused with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: availability_charge
    trigger: "on AvailabilityPeriod creation; on confirm; on excuse; on carding-cascade flip to UNAVAILABLE; on DRAFT invoice re-derivation"
    algorithm: threshold
    formula: |
      if period.status in {EXCUSED, UNAVAILABLE}: charge = 0
      elif contract.contract_type == CALL_WHEN_NEEDED:
          charge = (period.status == CONFIRMED) ? contract.daily_availability_rate_cents : 0
      else:  # EXCLUSIVE_USE, period.status == CONFIRMED
          if period.available_minutes >= contract.min_daily_available_minutes:
              charge = contract.daily_availability_rate_cents
          else:
              charge = round_half_up(contract.daily_availability_rate_cents * period.available_minutes / contract.min_daily_available_minutes, 0)
    input_set: "the single AvailabilityPeriod plus its Contract; only status in {CONFIRMED, UNAVAILABLE, EXCUSED} ever bills (OFFERED => 0 while unconfirmed)"
    constants:
      DEFAULT_MIN_DAILY_MINUTES: 570
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: exclusive_use_prorated
        when: "EXCLUSIVE_USE contract"
        difference: "full rate at >= min_daily_available_minutes (>=, boundary inclusive), else linear prorate"
      - name: call_when_needed_flat
        when: "CALL_WHEN_NEEDED contract"
        difference: "flat full rate when CONFIRMED regardless of minutes; zero while OFFERED"

  - name: flight_sortie_billing
    trigger: "on FlightLog creation (billable_cents); on invoice line generation (flight_subtotal_cents)"
    algorithm: aggregation
    formula: |
      Per sortie (pinned rounding order — round per sortie FIRST, then sum):
        flight_hours_tenths = round_half_up((hobbs_stop - hobbs_start) * 10, 0)
        billable_cents      = round_half_up(flight_hours_tenths / 10 * contract.flight_hour_rate_cents, 0)
      FLIGHT_DAY line (per assignment per logged_date):
        carrier_qty           = sum of flight_hours_tenths over the day's sorties
        carrier_amount_cents  = sum of billable_cents over the day's sorties
      The alternative order (sum raw hours over the day, round once, then multiply)
      is FORBIDDEN: it yields different cents (e.g. sorties of 1.05 h and 0.65 h at
      300000 cents/h give 330000 + 210000 = 540000 per-sortie vs 510000 sum-first).
    input_set: "FlightLogs of assignments whose DispatchOrder.contract_id == invoice.contract_id and logged_date inside [period_start, period_end]"
    constants: {}
    precision: "tenths of an hour and integer cents, both round_half_up"
    variants:
      - name: per_sortie_then_sum
        when: "always (pinned)"
        difference: "only sanctioned order; documented against the sum-then-round alternative"

  - name: invoice_net_composition
    trigger: "on invoice creation; on DRAFT invoice re-derivation (availability status change, new in-period FlightLog, carding cascade); on reconcile (agency basis for flight lines)"
    algorithm: aggregation
    formula: |
      Pinned evaluation order (steps MUST execute in this sequence):
        (1) availability_subtotal_cents = sum of carrier_amount_cents over AVAILABILITY_DAY lines
        (2) flight_subtotal_cents       = sum of billed_amount_cents over FLIGHT_DAY lines
            (billed = carrier_amount_cents under PROVISIONAL; agency_amount_cents under RECONCILED)
        (3) expected_days  = count of AVAILABILITY_DAY lines
        (4) compliant_days = count of AVAILABILITY_DAY lines whose period was CONFIRMED with
                             available_minutes >= contract.min_daily_available_minutes,
                             PLUS lines whose period is EXCUSED
        (5) penalty_cents = (expected_days > 0 AND compliant_days / expected_days < 0.98)
                            ? round_half_up(availability_subtotal_cents * 0.05, 0) : 0
        (6) net_cents = availability_subtotal_cents + flight_subtotal_cents - penalty_cents
      The penalty ratio depends on the line composition from steps (1)-(4); evaluating
      (6) before (5) or keying the ratio on net is FORBIDDEN — this pinned order makes
      the value well-defined. expected_days == 0 (empty set) => penalty_cents == 0.
    input_set: "AvailabilityPeriods of the contract with service_date in [period_start, period_end] and status in {CONFIRMED, UNAVAILABLE, EXCUSED} (OFFERED excluded); FlightLogs per flight_sortie_billing. Line generation order is pinned: AVAILABILITY_DAY lines by service_date ASC, then FLIGHT_DAY lines by reference_date ASC (tie: assignment created_at ASC), then the PENALTY line last."
    constants:
      COMPLIANCE_THRESHOLD: 0.98
      PENALTY_RATE: 0.05
    precision: "integer cents, round_half_up; compliance ratio compared as exact rational (compliant_days * 100 < expected_days * 98)"
    variants:
      - name: draft_live
        when: "invoice.status == DRAFT"
        difference: "recomputed on every source mutation"
      - name: submitted_frozen
        when: "invoice.status != DRAFT"
        difference: "frozen except for the reconcile agency-basis recompute"

  - name: crew_duty_projection
    trigger: "on Assignment creation (gate); on FlightLog creation (gate + accumulation); on Assignment release (recompute)"
    algorithm: forward_looking
    formula: |
      Chronological variant (enforcement at FlightLog creation; fatigue trigger):
        flown_tenths = sum of flight_hours_tenths over FlightLogs with
                       pilot_id == crew AND logged_date == duty_date
      Forward-looking variant (gate at Assignment creation):
        projected_tenths = flown_tenths + sum over the crew member's assignments in
                           status ASSIGNED with date(planned_start) == duty_date of
                           round_half_up((planned_end - planned_start) in hours * 10, 0)
        gate: projected_tenths INCLUDING the candidate assignment's planned tenths
              > 80  =>  reject with ERR_FLIGHT_HOUR_LIMIT_EXCEEDED
      Enforcement: FlightLog with flown_tenths + new flight_hours_tenths > 80
              =>  reject with ERR_FLIGHT_HOUR_LIMIT_EXCEEDED
      Fatigue trigger: flown_tenths >= 80 after applying a log => CrewMember FATIGUE_HOLD
      The two variants legitimately disagree for identical logs: e.g. 75 flown tenths
      plus one ASSIGNED 1.0 h assignment gives projected 85 vs flown 75.
    input_set: "CrewDutyDay keyed by (crew_member_id, duty_date); FlightLogs (chronological); ASSIGNED assignments (forward-looking)"
    constants:
      DAILY_FLIGHT_LIMIT_TENTHS: 80
    precision: "integer tenths of an hour"
    variants:
      - name: chronological_actuals
        when: "FlightLog creation gate and fatigue trigger"
        difference: "counts only recorded sorties"
      - name: forward_looking_projection
        when: "Assignment creation gate and CrewDutyDay.projected_tenths"
        difference: "adds planned windows of not-yet-launched assignments"

  - name: reconciliation_billing
    trigger: "on POST /invoices/{id}/reconcile"
    algorithm: aggregation
    formula: |
      For each FLIGHT_DAY line, find the AgencyRecord with assignment_id == line.source_ref_id
      AND record_date == line.reference_date:
        - matched: agency_qty = record.agency_flight_hours_tenths;
                   agency_amount_cents = round_half_up(agency_qty / 10 * contract.flight_hour_rate_cents, 0);
                   mismatch_flag = |carrier_qty - agency_qty| > MATCH_TOLERANCE_TENTHS
        - unmatched: agency_qty = carrier_qty; agency_amount_cents = carrier_amount_cents;
                   mismatch_flag = false
      AVAILABILITY_DAY and PENALTY lines: agency_amount_cents = carrier_amount_cents; no mismatch.
      If any line has mismatch_flag == true:  invoice -> DISPUTED, basis stays PROVISIONAL,
        net unchanged.
      Else: invoice -> RECONCILED, billing_basis := RECONCILED, every FLIGHT_DAY line's
        billed_amount_cents := agency_amount_cents, flight_subtotal_cents and net_cents
        recomputed per invoice_net_composition, contract.season_billed_cents adjusted by the delta.
      The two variants legitimately disagree for identical carrier data: e.g. carrier
      50 tenths vs agency 49 tenths at 300000 cents/h bills 1500000 (provisional) vs
      1470000 (reconciled).
    input_set: "SUBMITTED invoice's FLIGHT_DAY lines; AgencyRecords of the same contract"
    constants:
      MATCH_TOLERANCE_TENTHS: 1
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_carrier_basis
        when: "invoice.billing_basis == PROVISIONAL (creation, submit, dispute)"
        difference: "bills carrier logs"
      - name: reconciled_agency_basis
        when: "invoice.billing_basis == RECONCILED (after a clean reconcile)"
        difference: "bills agency records where matched, carrier basis elsewhere"

  - name: reload_turn_time
    trigger: "on RetardantLoad load (turn computation) and on any recompute of the assignment's load set"
    algorithm: chronological
    formula: |
      For load L of assignment A in status LOADED or DROPPED:
        previous = the load of A with the greatest dropped_at strictly before L.loaded_at
                   (tie-break on equal dropped_at: earlier created_at first; never id)
        L.reload_turn_minutes = previous == null ? null : (L.loaded_at - previous.dropped_at) in whole minutes
      assignment.reload_turn_avg_minutes =
        count(turns) == 0 ? null : round_half_up(sum(turns) / count(turns), 1)
      assignment.reload_sla_breach = (reload_turn_avg_minutes > 30.0)
      Boundary: an average of exactly 30.0 is NOT a breach (strict >).
    input_set: "RetardantLoads of one assignment with non-null reload_turn_minutes"
    constants:
      RELOAD_SLA_MINUTES: 30.0
    precision: "turns in whole minutes; average 1 decimal place, round_half_up"

  - name: season_billed_invariant
    trigger: "on invoice submit (+net), void from SUBMITTED/DISPUTED (-net), reconcile (delta adjust), resubmit (no change)"
    algorithm: aggregation
    formula: |
      contract.season_billed_cents ==
        sum of net_cents over the contract's Invoices with
        status in {SUBMITTED, DISPUTED, RECONCILED, PAID}
      INVARIANT: a submit followed by a void of the same invoice MUST leave
      season_billed_cents identical to its pre-submit value (compensating pair).
    input_set: "Invoices of one Contract filtered by status"
    constants: {}
    precision: "integer cents"

  - name: filled_count_invariant
    trigger: "on Assignment creation (+1), release (-1, agency or fatigue cascade), and any status change crossing the {ASSIGNED, EN_ROUTE, ON_INCIDENT} boundary"
    algorithm: aggregation
    formula: |
      dispatch_order.filled_count ==
        count of the order's Assignments with status in {ASSIGNED, EN_ROUTE, ON_INCIDENT}
      Auto-transitions: filled_count == 0 => ACCEPTED (from PARTIALLY_FILLED);
        0 < filled_count < aircraft_quantity => PARTIALLY_FILLED;
        filled_count == aircraft_quantity => FILLED.
      INVARIANT: an assignment creation followed by its release MUST leave
      filled_count and the derived order status identical to their pre-creation values.
    input_set: "Assignments of one DispatchOrder filtered by status"
    constants: {}
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "request body shape: required fields present, types valid, enum members valid, date/datetime formats valid, hobbs_stop > hobbs_stop start ordering (hobbs_stop > hobbs_start), available_end > available_start, planned_end > planned_start, period_end >= period_start, season_end_date > season_start_date, exactly one of subject_aircraft_id/subject_crew_member_id set", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "path and body references exist, validated left-to-right (path ids first, then body ids in declaration order)", error_id: ERR_CONTRACT_NOT_FOUND, http_status: 404, applies_to: "all (entity-specific variant per resource: ERR_CONTRACT_NOT_FOUND, ERR_AIRCRAFT_NOT_FOUND, ERR_CREW_MEMBER_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_DISPATCH_ORDER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_AVAILABILITY_PERIOD_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_RETARDANT_LOAD_NOT_FOUND)" }
  - { priority: 5, category: auth, check: "ownership / segregation of duties: Pilot X-User-ID must equal assignment.pilot_id on flight-log/launch/arrive/drop; reconcile caller X-User-ID must differ from invoice.submitted_by", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "POST /assignments/{id}/flight-logs, POST /assignments/{id}/launch, POST /assignments/{id}/arrive, POST /retardant-loads/{id}/drop, POST /invoices/{id}/reconcile (SoD variant ERR_SEGREGATION_OF_DUTIES)" }
  - { priority: 6, category: state, check: "optimistic concurrency: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /contracts/{id}/invoices, POST /dispatch-orders/{id}/assignments" }
  - { priority: 7, category: state, check: "state-machine preconditions: transition valid from current state; terminal states reject all actions (ERR_ALREADY_TERMINAL); contract must be ACTIVE for new business (ERR_CONTRACT_NOT_ACTIVE); aircraft and pilot must be CARDED for assignment (ERR_AIRCRAFT_NOT_CARDED, ERR_CREW_NOT_CARDED); dispatch capacity filled_count < aircraft_quantity (ERR_DISPATCH_ALREADY_FILLED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "action endpoints" }
  - { priority: 8, category: business_safety, check: "flight safety: carded_until >= current date at launch (ERR_CARDING_EXPIRED); pilot not on fatigue hold at assignment creation and launch (ERR_CREW_ON_FATIGUE_HOLD); forward-looking projected_tenths including candidate <= 80 at assignment creation and chronological flown + new <= 80 at log creation (ERR_FLIGHT_HOUR_LIMIT_EXCEEDED); planned_end - duty_start <= 840 minutes per duty day (ERR_CREW_DAY_LIMIT_EXCEEDED)", error_id: ERR_CARDING_EXPIRED, http_status: 422, applies_to: "POST /dispatch-orders/{id}/assignments, POST /assignments/{id}/launch, POST /assignments/{id}/flight-logs" }
  - { priority: 9, category: business_constraint, check: "resource overlap / uniqueness / capacity: aircraft planned-window half-open overlap among non-terminal assignments (ERR_ASSIGNMENT_OVERLAP); one AvailabilityPeriod per (aircraft_id, service_date) (ERR_AVAILABILITY_OVERLAP); one non-VOID invoice per (contract_id, period_start) (ERR_INVOICE_PERIOD_OVERLAP); gallons <= tank_capacity_gallons (ERR_TANK_CAPACITY_EXCEEDED)", error_id: ERR_ASSIGNMENT_OVERLAP, http_status: 409, applies_to: "POST /dispatch-orders/{id}/assignments, POST /contracts/{id}/availability-periods, POST /contracts/{id}/invoices, POST /assignments/{id}/retardant-loads" }
  - { priority: 10, category: business_constraint, check: "crew rest buffer: for the candidate pilot, every non-terminal assignment window [s2,e2) must satisfy e2 <= planned_start - 60min OR s2 >= planned_end + 60min (minimum 60-minute gap; adjacency is NOT sufficient)", error_id: ERR_DUTY_REST_VIOLATION, http_status: 422, applies_to: "POST /dispatch-orders/{id}/assignments" }
  - { priority: 11, category: business_referential, check: "same-contract linkage and qualification: aircraft.contract_id == order.contract_id (ERR_AIRCRAFT_NOT_ON_CONTRACT); pilot.contract_id == order.contract_id (ERR_PILOT_NOT_ON_CONTRACT); order.required_model null or == aircraft.model (ERR_MODEL_MISMATCH); aircraft.model in pilot.qualified_aircraft_models (ERR_MODEL_NOT_QUALIFIED)", error_id: ERR_AIRCRAFT_NOT_ON_CONTRACT, http_status: 422, applies_to: "POST /dispatch-orders/{id}/assignments" }
  - { priority: 12, category: business_temporal, check: "time windows: accept while clock <= accept_deadline (ERR_ACCEPTANCE_WINDOW_EXPIRED); confirm while clock date <= service_date (ERR_CONFIRM_WINDOW_EXPIRED); service_date inside contract season (ERR_SERVICE_DATE_OUTSIDE_SEASON); invoice submit requires period_end < clock date (ERR_BILLING_PERIOD_NOT_CLOSED)", error_id: ERR_ACCEPTANCE_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /dispatch-orders/{id}/accept, POST /availability-periods/{id}/confirm, POST /contracts/{id}/availability-periods, POST /invoices/{id}/submit" }
  - { priority: 13, category: business_fiscal, check: "season flight-hour cap: dispatch creation requires contract.season_flight_hours_tenths < season_flight_hour_cap_tenths; flight-log creation requires season_flight_hours_tenths + new tenths <= cap", error_id: ERR_SEASON_FLIGHT_CAP_EXCEEDED, http_status: 422, applies_to: "POST /dispatch-orders, POST /assignments/{id}/flight-logs" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Contracts ----
  - { method: POST, path: "/contracts", description: "Create a contract in DRAFT", roles: [CarrierOps], code: 201, input: [contract_number, agency, contract_type, daily_availability_rate_cents, flight_hour_rate_cents, season_start_date, season_end_date, "min_daily_available_minutes?", season_flight_hour_cap_tenths, acceptance_window_minutes], output: Contract, side_effects: ["initial status DRAFT; season_billed_cents = 0; season_flight_hours_tenths = 0"] }
  - { method: GET, path: "/contracts", description: "List contracts with pagination", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["status?", "contract_type?", "limit?", "offset?"], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}", description: "Get one contract (includes season_billed_cents, season_flight_hours_tenths, version)", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/contracts/{id}/activate", description: "DRAFT -> ACTIVE", roles: [CarrierOps], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1"] }
  - { method: POST, path: "/contracts/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [CarrierOps], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1"] }
  - { method: POST, path: "/contracts/{id}/resume", description: "SUSPENDED -> ACTIVE (cycle)", roles: [CarrierOps], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1"] }
  - { method: POST, path: "/contracts/{id}/close", description: "ACTIVE|SUSPENDED -> CLOSED; blocked while open dispatch orders exist", roles: [CarrierOps], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1"] }
  - { method: GET, path: "/contracts/{id}/availability-periods", description: "Reverse-reachability: availability periods of a contract", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["service_date?", "status?", "limit?", "offset?"], output: "AvailabilityPeriod[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/invoices", description: "Reverse-reachability: invoices of a contract", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/agency-records", description: "Reverse-reachability: agency records of a contract", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["record_date?", "limit?", "offset?"], output: "AgencyRecord[]", side_effects: [] }

  # ---- Aircraft ----
  - { method: POST, path: "/aircraft", description: "Register an aircraft on a contract (UNCARDED)", roles: [CarrierOps], code: 201, input: [tail_number, model, tank_capacity_gallons, contract_id], output: Aircraft, side_effects: [] }
  - { method: GET, path: "/aircraft", description: "List aircraft", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["contract_id?", "carding_status?", "limit?", "offset?"], output: "Aircraft[]", side_effects: [] }
  - { method: GET, path: "/aircraft/{id}", description: "Get one aircraft", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: [], output: Aircraft, side_effects: [] }
  - { method: POST, path: "/aircraft/{id}/decard", description: "CARDED|UNCARDED -> DECARDED; blocked while non-terminal assignments exist", roles: [CarrierOps], code: 200, input: [], output: Aircraft, side_effects: ["carded_until := null", "increments Aircraft.version by 1"] }
  - { method: GET, path: "/aircraft/{id}/carding-inspections", description: "Reverse-reachability: inspections of an aircraft", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["result?", "limit?", "offset?"], output: "CardingInspection[]", side_effects: [] }

  # ---- Crew ----
  - { method: POST, path: "/crew-members", description: "Register a crew member on a contract (UNCARDED, AVAILABLE)", roles: [CarrierOps], code: 201, input: [full_name, crew_role, contract_id, qualified_aircraft_models], output: CrewMember, side_effects: [] }
  - { method: GET, path: "/crew-members", description: "List crew members", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["contract_id?", "duty_status?", "carding_status?", "limit?", "offset?"], output: "CrewMember[]", side_effects: [] }
  - { method: GET, path: "/crew-members/{id}", description: "Get one crew member", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: [], output: CrewMember, side_effects: [] }
  - { method: GET, path: "/crew-members/{id}/duty-days", description: "Reverse-reachability: duty days of a crew member", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["duty_date?", "limit?", "offset?"], output: "CrewDutyDay[]", side_effects: [] }
  - { method: GET, path: "/crew-members/{id}/carding-inspections", description: "Reverse-reachability: inspections of a crew member", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["result?", "limit?", "offset?"], output: "CardingInspection[]", side_effects: [] }
  - { method: GET, path: "/crew-members/{id}/flight-logs", description: "Reverse-reachability: flight logs of a crew member (pilot_id FK)", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["logged_date?", "limit?", "offset?"], output: "FlightLog[]", side_effects: [] }
  - { method: POST, path: "/crew-members/{id}/rest-release", description: "FATIGUE_HOLD -> AVAILABLE once the latest duty day is strictly before the current clock date", roles: [CarrierOps], code: 200, input: [], output: CrewMember, side_effects: ["increments CrewMember.version by 1"] }

  # ---- Carding inspections ----
  - { method: POST, path: "/carding-inspections", description: "Schedule an inspection for exactly one subject (aircraft XOR crew member)", roles: [CardingInspector], code: 201, input: ["subject_aircraft_id?", "subject_crew_member_id?", scheduled_for, "valid_days?", "notes?"], output: CardingInspection, side_effects: [] }
  - { method: POST, path: "/carding-inspections/{id}/complete", description: "Complete with PASSED/FAILED; PASS cards the subject, FAIL suspends a CARDED subject (aircraft fail fires the availability/invoice cascade)", roles: [CardingInspector], code: 200, input: [result, completed_at], output: CardingInspection, side_effects: ["subject carding_status transition", "on aircraft FAIL: cascade to AvailabilityPeriod UNAVAILABLE and DRAFT invoice re-derivation", "increments CardingInspection.version by 1"] }
  - { method: POST, path: "/carding-inspections/{id}/reschedule", description: "COMPLETED(FAILED) -> SCHEDULED (revision loop); resets result to PENDING", roles: [CardingInspector], code: 200, input: [scheduled_for], output: CardingInspection, side_effects: ["result := PENDING; completed_at := null", "increments CardingInspection.version by 1"] }

  # ---- Availability ----
  - { method: POST, path: "/contracts/{id}/availability-periods", description: "Offer availability for an aircraft on a service date; initial status CONFIRMED (EXCLUSIVE_USE) or OFFERED (CALL_WHEN_NEEDED)", roles: [CarrierOps], code: 201, input: [aircraft_id, service_date, available_start, available_end], output: AvailabilityPeriod, side_effects: ["computes available_minutes and availability_charge_cents"] }
  - { method: GET, path: "/availability-periods", description: "List availability periods (aircraft_id FK filter)", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["aircraft_id?", "contract_id?", "service_date?", "status?", "limit?", "offset?"], output: "AvailabilityPeriod[]", side_effects: [] }
  - { method: GET, path: "/availability-periods/{id}", description: "Get one availability period", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: [], output: AvailabilityPeriod, side_effects: [] }
  - { method: POST, path: "/availability-periods/{id}/confirm", description: "OFFERED -> CONFIRMED (agency confirms CWN availability)", roles: [AgencyDispatcher], code: 200, input: [], output: AvailabilityPeriod, side_effects: ["recompute availability_charge_cents", "re-derive covering DRAFT invoices", "increments AvailabilityPeriod.version by 1"] }
  - { method: POST, path: "/availability-periods/{id}/excuse", description: "OFFERED|CONFIRMED -> EXCUSED with reason", roles: [CarrierOps], code: 200, input: [excuse_reason], output: AvailabilityPeriod, side_effects: ["availability_charge_cents := 0", "re-derive covering DRAFT invoices", "increments AvailabilityPeriod.version by 1"] }

  # ---- Incidents ----
  - { method: POST, path: "/incidents", description: "Report an incident (REPORTED)", roles: [AgencyDispatcher], code: 201, input: [incident_number, name, location, agency, priority], output: Incident, side_effects: [] }
  - { method: GET, path: "/incidents", description: "List incidents", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["status?", "agency?", "limit?", "offset?"], output: "Incident[]", side_effects: [] }
  - { method: GET, path: "/incidents/{id}", description: "Get one incident", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: POST, path: "/incidents/{id}/advance", description: "REPORTED -> ACTIVE -> CONTAINED -> CLOSED", roles: [AgencyDispatcher], code: 200, input: [to_status], output: Incident, side_effects: ["increments Incident.version by 1"] }

  # ---- Dispatch orders ----
  - { method: POST, path: "/dispatch-orders", description: "Place a resource order against a contract for an incident; placed_at = logical clock; accept_deadline computed", roles: [AgencyDispatcher], code: 201, input: [order_number, contract_id, incident_id, aircraft_quantity, "required_model?"], output: DispatchOrder, side_effects: ["placed_at := clock", "accept_deadline := placed_at + contract.acceptance_window_minutes"] }
  - { method: GET, path: "/dispatch-orders", description: "List dispatch orders (contract_id / incident_id FK filters)", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["contract_id?", "incident_id?", "status?", "limit?", "offset?"], output: "DispatchOrder[]", side_effects: [] }
  - { method: GET, path: "/dispatch-orders/{id}", description: "Get one dispatch order", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: [], output: DispatchOrder, side_effects: [] }
  - { method: POST, path: "/dispatch-orders/{id}/accept", description: "PLACED -> ACCEPTED; requires contract ACTIVE and clock <= accept_deadline", roles: [CarrierOps], code: 200, input: [], output: DispatchOrder, side_effects: ["increments DispatchOrder.version by 1"] }
  - { method: POST, path: "/dispatch-orders/{id}/decline", description: "PLACED -> DECLINED with reason", roles: [CarrierOps], code: 200, input: [decline_reason], output: DispatchOrder, side_effects: ["increments DispatchOrder.version by 1"] }
  - { method: POST, path: "/dispatch-orders/{id}/cancel", description: "PLACED -> CANCELLED, or ACCEPTED -> CANCELLED when filled_count == 0", roles: [AgencyDispatcher], code: 200, input: [], output: DispatchOrder, side_effects: ["increments DispatchOrder.version by 1"] }
  - { method: GET, path: "/dispatch-orders/{id}/assignments", description: "Reverse-reachability: assignments of an order", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["status?", "limit?", "offset?"], output: "Assignment[]", side_effects: [] }

  # ---- Assignments ----
  - { method: POST, path: "/dispatch-orders/{id}/assignments", description: "Assign aircraft+pilot to an accepted order (OCC on order version); runs the full gate chain (state -> safety -> overlap -> rest -> referential)", roles: [CarrierOps], code: 201, input: [aircraft_id, pilot_id, planned_start, planned_end, expected_dispatch_order_version], output: Assignment, side_effects: ["increments DispatchOrder.version by 1", "filled_count recompute + possible auto-transition (filled_count_invariant)", "CrewDutyDay auto-created for (pilot_id, date(planned_start)) when missing, duty_start := planned_start", "CrewDutyDay.projected_tenths recomputed"] }
  - { method: GET, path: "/assignments", description: "List assignments (aircraft_id / pilot_id / dispatch_order_id FK filters)", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["aircraft_id?", "pilot_id?", "dispatch_order_id?", "status?", "limit?", "offset?"], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/assignments/{id}", description: "Get one assignment (includes reload_turn_avg_minutes, reload_sla_breach)", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/assignments/{id}/launch", description: "ASSIGNED -> EN_ROUTE; requires card not expired and pilot not on fatigue hold", roles: [CarrierOps, Pilot], code: 200, input: [], output: Assignment, side_effects: ["launched_at := clock", "increments Assignment.version by 1"] }
  - { method: POST, path: "/assignments/{id}/arrive", description: "EN_ROUTE -> ON_INCIDENT", roles: [CarrierOps, Pilot], code: 200, input: [], output: Assignment, side_effects: ["arrived_at := clock", "increments Assignment.version by 1"] }
  - { method: POST, path: "/assignments/{id}/release", description: "ASSIGNED|EN_ROUTE|ON_INCIDENT -> RELEASED with reason AGENCY|MECHANICAL", roles: [AgencyDispatcher], code: 200, input: [release_reason], output: Assignment, side_effects: ["released_at := clock", "filled_count recompute + possible auto-transition", "CrewDutyDay.projected_tenths recomputed", "increments Assignment.version by 1"] }
  - { method: POST, path: "/assignments/{id}/demobilize", description: "RELEASED -> DEMOBILIZED; last demobilized assignment auto-closes the order", roles: [CarrierOps], code: 200, input: [], output: Assignment, side_effects: ["demobilized_at := clock", "order auto-close check", "increments Assignment.version by 1"] }
  - { method: GET, path: "/assignments/{id}/flight-logs", description: "Reverse-reachability: flight logs of an assignment", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["limit?", "offset?"], output: "FlightLog[]", side_effects: [] }
  - { method: GET, path: "/assignments/{id}/retardant-loads", description: "Reverse-reachability: retardant loads of an assignment", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["limit?", "offset?"], output: "RetardantLoad[]", side_effects: [] }
  - { method: GET, path: "/assignments/{id}/agency-records", description: "Reverse-reachability: agency records of an assignment", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["limit?", "offset?"], output: "AgencyRecord[]", side_effects: [] }

  # ---- Flight logs ----
  - { method: POST, path: "/assignments/{id}/flight-logs", description: "Append a sortie (assignment must be ON_INCIDENT; caller Pilot must own the assignment); chronological flight-hour gate and season-cap gate apply", roles: [Pilot], code: 201, input: [logged_date, hobbs_start, hobbs_stop], output: FlightLog, side_effects: ["computes flight_hours_tenths and billable_cents per flight_sortie_billing", "CrewDutyDay auto-created when missing; flown_tenths/projected_tenths recomputed", "contract.season_flight_hours_tenths += flight_hours_tenths (increments Contract.version by 1)", "fatigue cascade when flown_tenths reaches >= 80", "re-derive covering DRAFT invoices"] }

  # ---- Retardant loads ----
  - { method: POST, path: "/assignments/{id}/retardant-loads", description: "Request a retardant load for an ON_INCIDENT assignment", roles: [CarrierOps], code: 201, input: [gallons, "requested_at?"], output: RetardantLoad, side_effects: ["requested_at defaults to logical clock"] }
  - { method: POST, path: "/retardant-loads/{id}/load", description: "REQUESTED -> LOADED; computes reload_turn_minutes and refreshes the assignment SLA fields", roles: [CarrierOps], code: 200, input: [loaded_at], output: RetardantLoad, side_effects: ["reload_turn_time recomputation", "assignment.reload_turn_avg_minutes / reload_sla_breach recomputed", "increments RetardantLoad.version by 1", "increments Assignment.version by 1"] }
  - { method: POST, path: "/retardant-loads/{id}/drop", description: "LOADED -> DROPPED", roles: [CarrierOps, Pilot], code: 200, input: [dropped_at], output: RetardantLoad, side_effects: ["increments RetardantLoad.version by 1"] }

  # ---- Invoices ----
  - { method: POST, path: "/contracts/{id}/invoices", description: "Create a DRAFT invoice for a billing period (OCC on contract version); generates AVAILABILITY_DAY/FLIGHT_DAY/PENALTY line items on PROVISIONAL basis", roles: [CarrierFinance], code: 201, input: [period_start, period_end, expected_contract_version], output: Invoice, side_effects: ["increments Contract.version by 1", "line items generated per availability_charge + flight_sortie_billing + invoice_net_composition"] }
  - { method: GET, path: "/invoices/{id}", description: "Get one invoice (all computed totals)", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/invoices/{id}/line-items", description: "Reverse-reachability: line items of an invoice", roles: [CarrierOps, AgencyDispatcher, Pilot, CarrierFinance, AgencyFinance, CardingInspector], code: 200, input: ["line_type?", "limit?", "offset?"], output: "InvoiceLineItem[]", side_effects: [] }
  - { method: POST, path: "/invoices/{id}/submit", description: "DRAFT -> SUBMITTED; requires period_end < clock date; debits contract.season_billed_cents", roles: [CarrierFinance], code: 200, input: [], output: Invoice, side_effects: ["submitted_by/at stamped", "contract.season_billed_cents += net_cents", "increments Invoice.version by 1", "increments Contract.version by 1"] }
  - { method: POST, path: "/invoices/{id}/dispute", description: "SUBMITTED -> DISPUTED (manual agency dispute)", roles: [AgencyFinance], code: 200, input: [dispute_reason], output: Invoice, side_effects: ["increments Invoice.version by 1"] }
  - { method: POST, path: "/invoices/{id}/resubmit", description: "DISPUTED -> SUBMITTED (negotiation loop)", roles: [CarrierFinance], code: 200, input: [], output: Invoice, side_effects: ["submitted_by/at restamped", "dispute_reason := null", "increments Invoice.version by 1"] }
  - { method: POST, path: "/invoices/{id}/reconcile", description: "SUBMITTED -> RECONCILED (all lines within tolerance) or -> DISPUTED (any mismatch); SoD: caller != submitted_by", roles: [AgencyFinance], code: 200, input: [], output: Invoice, side_effects: ["per reconciliation_billing: agency amounts applied, mismatch flags set", "on RECONCILED: flight_subtotal_cents/net_cents recomputed on agency basis; contract.season_billed_cents adjusted by delta", "increments Invoice.version by 1", "increments Contract.version by 1 on RECONCILED"] }
  - { method: POST, path: "/invoices/{id}/mark-paid", description: "RECONCILED -> PAID", roles: [AgencyFinance], code: 200, input: [], output: Invoice, side_effects: ["increments Invoice.version by 1"] }
  - { method: POST, path: "/invoices/{id}/void", description: "DRAFT|SUBMITTED|DISPUTED -> VOID; compensates season_billed_cents when leaving the invariant set", roles: [CarrierFinance], code: 200, input: [], output: Invoice, side_effects: ["contract.season_billed_cents -= net_cents when from SUBMITTED/DISPUTED", "increments Invoice.version by 1", "increments Contract.version by 1 when from SUBMITTED/DISPUTED"] }

  # ---- Agency records ----
  - { method: POST, path: "/agency-records", description: "Import an agency flight-time record for (assignment_id, record_date); input to reconciliation_billing", roles: [AgencyFinance], code: 201, input: [contract_id, assignment_id, record_date, agency_flight_hours_tenths, "agency_available_minutes?"], output: AgencyRecord, side_effects: [] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (ISO 8601 UTC). Startup default before any set is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All system-stamped times (placed_at, assigned_at, released_at, submitted_at) read this clock.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["no entity mutation; affects deadline/expiry/window evaluations"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing, or role not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role authenticated but not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Pilot X-User-ID does not equal assignment.pilot_id on flight-log/launch/arrive/drop" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "invoice reconcile caller's X-User-ID equals invoice.submitted_by" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing/invalid field, bad enum member, bad date format, or ordering violation (hobbs_stop <= hobbs_start, available_end <= available_start, planned_end <= planned_start, period_end < period_start, season_end_date <= season_start_date, both-or-neither inspection subjects)" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract id does not exist" }
  - { id: ERR_AIRCRAFT_NOT_FOUND, http: 404, condition: "aircraft id does not exist" }
  - { id: ERR_CREW_MEMBER_NOT_FOUND, http: 404, condition: "crew member id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "incident id does not exist" }
  - { id: ERR_DISPATCH_ORDER_NOT_FOUND, http: 404, condition: "dispatch order id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  - { id: ERR_AVAILABILITY_PERIOD_NOT_FOUND, http: 404, condition: "availability period id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "carding inspection id does not exist" }
  - { id: ERR_RETARDANT_LOAD_NOT_FOUND, http: 404, condition: "retardant load id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not valid from the entity's current state (e.g. flight log on a non-ON_INCIDENT assignment, accept on a non-PLACED order, complete on a non-SCHEDULED inspection)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "action attempted on an entity in a terminal state (CLOSED contract/incident/order, DECARDED aircraft, PAID/VOID invoice, DEMOBILIZED assignment, DROPPED load, EXCUSED/UNAVAILABLE period)" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "contract is not ACTIVE where ACTIVE is required (dispatch create/accept, availability create, invoice create)" }
  - { id: ERR_AIRCRAFT_NOT_CARDED, http: 409, condition: "aircraft carding_status != CARDED at assignment creation" }
  - { id: ERR_CREW_NOT_CARDED, http: 409, condition: "pilot carding_status != CARDED at assignment creation" }
  - { id: ERR_DISPATCH_ALREADY_FILLED, http: 409, condition: "assignment creation when order.filled_count == aircraft_quantity (order FILLED)" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "aircraft planned window [planned_start, planned_end) overlaps another non-terminal assignment of the same aircraft (half-open: adjacency allowed)" }
  - { id: ERR_AVAILABILITY_OVERLAP, http: 409, condition: "an AvailabilityPeriod already exists for (aircraft_id, service_date) in any status" }
  - { id: ERR_INVOICE_PERIOD_OVERLAP, http: 409, condition: "a non-VOID invoice already exists for (contract_id, period_start)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_CARDING_EXPIRED, http: 422, condition: "aircraft.carded_until < current clock date at launch" }
  - { id: ERR_CREW_ON_FATIGUE_HOLD, http: 422, condition: "pilot.duty_status == FATIGUE_HOLD at assignment creation or launch" }
  - { id: ERR_FLIGHT_HOUR_LIMIT_EXCEEDED, http: 422, condition: "forward-looking projected_tenths (incl. candidate) > 80 at assignment creation, or chronological flown_tenths + new log > 80 at log creation; exactly 80 is allowed" }
  - { id: ERR_CREW_DAY_LIMIT_EXCEEDED, http: 422, condition: "planned_end - duty_start > 840 minutes for the pilot's duty day; exactly 840 is allowed" }
  - { id: ERR_DUTY_REST_VIOLATION, http: 422, condition: "pilot has a non-terminal assignment whose window is closer than 60 minutes to the candidate window (either direction)" }
  - { id: ERR_ACCEPTANCE_WINDOW_EXPIRED, http: 422, condition: "accept after accept_deadline (clock > accept_deadline; exactly at the deadline is allowed)" }
  - { id: ERR_CONFIRM_WINDOW_EXPIRED, http: 422, condition: "confirm after the service date has passed (clock date > service_date)" }
  - { id: ERR_SERVICE_DATE_OUTSIDE_SEASON, http: 422, condition: "availability service_date outside [season_start_date, season_end_date]" }
  - { id: ERR_BILLING_PERIOD_NOT_CLOSED, http: 422, condition: "invoice submit with period_end >= current clock date" }
  - { id: ERR_SEASON_FLIGHT_CAP_EXCEEDED, http: 422, condition: "dispatch creation when contract.season_flight_hours_tenths >= season_flight_hour_cap_tenths, or flight log that would push the season total above the cap" }
  - { id: ERR_AIRCRAFT_NOT_ON_CONTRACT, http: 422, condition: "aircraft.contract_id != dispatch_order.contract_id at assignment creation" }
  - { id: ERR_PILOT_NOT_ON_CONTRACT, http: 422, condition: "pilot.contract_id != dispatch_order.contract_id at assignment creation" }
  - { id: ERR_MODEL_MISMATCH, http: 422, condition: "dispatch_order.required_model set and != aircraft.model" }
  - { id: ERR_MODEL_NOT_QUALIFIED, http: 422, condition: "aircraft.model not in pilot.qualified_aircraft_models" }
  - { id: ERR_TANK_CAPACITY_EXCEEDED, http: 422, condition: "retardant load gallons > aircraft.tank_capacity_gallons" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CarrierOps
    description: "Carrier operations manager: runs contracts, fleet, crew, availability, dispatch acceptance, assignments, retardant loading, rest releases"
    identity: opaque
    exclusive_operations: ["contract lifecycle actions (activate/suspend/resume/close)", "aircraft registration and decard", "crew registration and rest-release", "availability offer/excuse", "dispatch accept/decline", "assignment create/demobilize", "retardant load request/complete"]
    shared_operations: ["all GET reads", "assignment launch/arrive (shared with Pilot)", "retardant drop (shared with Pilot)"]
  - name: AgencyDispatcher
    description: "Agency dispatch: runs incidents and resource orders, confirms CWN availability, releases assignments"
    identity: opaque
    exclusive_operations: ["incident create/advance", "dispatch order create/cancel", "availability confirm", "assignment release"]
    shared_operations: ["all GET reads"]
  - name: Pilot
    description: "Pilot in command: acts only on own assignments (X-User-ID must equal CrewMember.id == assignment.pilot_id)"
    identity: "entity_backed:CrewMember"
    exclusive_operations: ["flight-log creation on own assignments"]
    shared_operations: ["all GET reads", "assignment launch/arrive (shared with CarrierOps)", "retardant drop (shared with CarrierOps)"]
  - name: CarrierFinance
    description: "Carrier billing: creates, submits, resubmits and voids invoices; never reconciles (segregation of duties)"
    identity: opaque
    exclusive_operations: ["invoice create/submit/resubmit/void"]
    shared_operations: ["all GET reads"]
  - name: AgencyFinance
    description: "Agency payment office: imports agency records, disputes/reconciles/marks-paid invoices; reconciler must differ from submitter (segregation of duties)"
    identity: opaque
    exclusive_operations: ["agency-record import", "invoice dispute/reconcile/mark-paid"]
    shared_operations: ["all GET reads"]
  - name: CardingInspector
    description: "Agency carding inspector: schedules, completes and reschedules readiness inspections for aircraft and crew"
    identity: opaque
    exclusive_operations: ["inspection create/complete/reschedule"]
    shared_operations: ["all GET reads"]
  - name: SystemAdmin
    description: "Test-driving operator for the logical clock only"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: []
