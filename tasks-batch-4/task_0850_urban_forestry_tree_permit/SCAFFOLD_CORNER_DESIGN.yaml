          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PERMIT_NOT_ISSUED"

      - name: submit_permit_on_unprotected_tree_rejects
        claim_type: Conditional validation
        grounds:
          - validations[priority=11]
          - errors[ERR_TREE_NOT_PROTECTED]
        distinguishing_aspect: "Submitting a permit for a tree whose is_protected==false returns ERR_TREE_NOT_PROTECTED (422)."
        test_recipe:
          setup: ["Zone Z1, non-protected Species Oak, small Tree dbh=5.0 (is_protected false), a DRAFT permit on it."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
