          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "escape remains ROOT_CAUSE with dispositioned_by_id null"
      - name: rework_close_over_budget_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
