        payload: {}
        as: Driver
        as_user_id: ${drv_rbac}
        captures:
          err_rbac: $.data.error_id
      assert:
      - the response status is 403 and data.error_id == ERR_FORBIDDEN
      - the refusal does not disclose whether the statement id exists, so it is not ERR_NOT_FOUND
      - the same call issued by a DistrictAdmin reaches the existence check instead
