              as_user_id: "eng-alice"
          trigger:
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Foundry DPW", work_window_start_on: "2026-10-05", work_window_end_on: "2026-10-12" }
              as: PermitCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 409 and $.data.error_id == ERR_INVALID_ROUTE_STATE"
            - "GET /segments/${seg_id}/permit-applications returns 0 rows"
            - "Route.${route_id}.status == PLANNING and scope_locked_at == null"
            - "RouteSegment.${seg_id}.engineering_status == WALKED and permit_status == NOT_REQUIRED"
            - "after POST /routes/${route_id}/lock-scope the identical create call succeeds with 201"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: splice_point_station_buffer_equality_allowed_and_inside_rejected
        grounds:
          - validations[priority=18]
          - errors[ERR_SPLICE_SPACING_VIOLATION]
          - calculations.design_fiber_allocation.constants.MIN_SPLICE_SPACING_FEET
          - entities.SplicePoint.fields.station_feet
          - entities.SplicePoint.fields.segment_id
        distinguishing_aspect: |
          The contested resource is the STATION AXIS of one RouteSegment and the geometry is a symmetric numeric buffer
          where equality is ALLOWED: a second enclosure exactly MIN_SPLICE_SPACING_FEET == 250 feet away is accepted,
          while one 249 feet away is rejected, so the comparison is abs(delta) < 250 and not <=.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Ridge Ring' (RING_CLOSURE), budget_authorized_cents 250000000, SCOPE_LOCKED"
            - "one RouteSegment: sequence_index 1, length_feet 1250, terrain_class URBAN_PAVED, with an ACCEPTED walkout"
            - "one DesignPackage revision 1, status DRAFT, fiber_count_allocated 288, express_fiber_count 48"
            - "one PLACED HANDHOLE SplicePoint on that design and segment at station_feet 0 dropping 24 fibers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Ridge Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 1250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-25", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "aerial run confirmed" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
            - call: "POST /design-packages"
              payload: { route_id: "${route_id}", fiber_count_allocated: 288, express_fiber_count: 48, expected_route_version: "${rv1}" }
              as: RouteEngineer
              captures: { dp_id: $.data.id }
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 0, enclosure_type: "HANDHOLE", fiber_count_dropped: 24 }
              as: RouteEngineer
              captures: { sp0_id: $.data.id }
          trigger:
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 250, enclosure_type: "HANDHOLE", fiber_count_dropped: 24 }
              as: RouteEngineer
              captures: { sp250_id: $.data.id }
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 499, enclosure_type: "HANDHOLE", fiber_count_dropped: 24 }
              as: RouteEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the station 250 placement returns HTTP 201 with SplicePoint.${sp250_id}.status == PLACED, because abs(250 - 0) == 250 is exactly the buffer and is allowed"
            - "the station 499 placement returns HTTP 422 with $.data.error_id == ERR_SPLICE_SPACING_VIOLATION, because abs(499 - 250) == 249 is inside the buffer"
            - "GET /design-packages/${dp_id}/splice-points returns exactly 2 rows"
            - "DesignPackage.${dp_id}.splice_point_count == 2 and handhole_count == 2"
            - "DesignPackage.${dp_id}.assigned_drop_fiber_count == 48 and reserve_fiber_count == 192 and spare_ratio_bp == 6667"

      - name: permit_work_window_touching_moratorium_endpoint_conflicts
        grounds:
          - validations[priority=15]
          - errors[ERR_MORATORIUM_WINDOW_CONFLICT]
          - entities.MoratoriumWindow.fields.starts_on
          - entities.MoratoriumWindow.fields.ends_on
          - entities.PermitApplication.fields.work_window_start_on
          - entities.PermitApplication.fields.work_window_end_on
        distinguishing_aspect: |
          A DIFFERENT resource and the OPPOSITE endpoint convention from
          splice_point_station_buffer_equality_allowed_and_inside_rejected: the contested resource is a (municipality_code,
          street_name) calendar and the geometry is a CLOSED date interval, so windows that merely touch on 2026-09-20 DO
          collide and the submit is rejected.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Mill Street Spur' (SPUR), budget_authorized_cents 90000000, SCOPE_LOCKED"
            - "one RouteSegment: sequence_index 1, street_name 'Mill Street', municipality_code 'MUN-014', length_feet 250, terrain_class URBAN_PAVED, planned_work_start_on 2026-09-10, with an ACCEPTED walkout"
            - "one MoratoriumWindow on MUN-014 / 'Mill Street' with starts_on 2026-09-20, ends_on 2026-10-20 and moratorium_class FULL_RESTORATION"
            - "one MUNICIPAL_ROW PermitApplication on that segment in status DRAFT whose work window is 2026-09-10..2026-09-20, touching the moratorium's first day"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Mill Street Spur", topology_objective: "SPUR", target_in_service_date: "2027-05-01", budget_authorized_cents: 90000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Mill Street", municipality_code: "MUN-014", length_feet: 250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-10", planned_work_end_on: "2026-09-20", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "mill street aerial" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-501", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
            - call: "POST /moratorium-windows"
              payload: { municipality_code: "MUN-014", street_name: "Mill Street", resurfaced_on: "2026-09-19", starts_on: "2026-09-20", ends_on: "2026-10-20", moratorium_class: "FULL_RESTORATION", ordinance_reference: "ORD-2026-204" }
              as: NetworkRecordsAdmin
              captures: { mw_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Ridgefield DPW", work_window_start_on: "2026-09-10", work_window_end_on: "2026-09-20" }
              as: PermitCoordinator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${p1_id}/submit"
              payload: {}
              as: PermitCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 409 and $.data.error_id == ERR_MORATORIUM_WINDOW_CONFLICT"
            - "the only shared day is 2026-09-20, which is both work_window_end_on and MoratoriumWindow.starts_on, and a closed-interval intersection therefore collides"
            - "PermitApplication.${p1_id}.status == DRAFT"
            - "PermitApplication.${p1_id}.review_days == null and decision_due_at == null and submitted_at == null"
            - "RouteSegment.${seg_id}.permit_status == NOT_REQUIRED"
            - "Route.${route_id}.status == SCOPE_LOCKED and live_complexity_index == 1000"
            - "an otherwise identical PermitApplication with work_window_end_on 2026-09-19 submits successfully with 200"

  # =====================================================================
  # Rule 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: splice_point_void_restores_reserve_fiber_exactly
        grounds:
          - calculations.design_fiber_allocation
          - state_machines.SplicePoint.transitions.PLACED_to_VOIDED
          - entities.DesignPackage.fields.reserve_fiber_count
          - entities.DesignPackage.fields.assigned_drop_fiber_count
          - entities.DesignPackage.fields.spare_ratio_bp
          - entities.SplicePoint.fields.voided_at
        distinguishing_aspect: |
          The conserved quantity is FIBER STRANDS on a DesignPackage — allocated 288 must always equal express 48 plus
          assigned plus reserve — and voiding the splice point returns reserve_fiber_count to exactly 240 and
          spare_ratio_bp to exactly 8333, the same integers the design held before the placement, with no drift.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Ridge Ring' (RING_CLOSURE), budget_authorized_cents 250000000, SCOPE_LOCKED"
            - "one RouteSegment: sequence_index 1, length_feet 1250, terrain_class URBAN_PAVED, with an ACCEPTED walkout"
            - "one DesignPackage revision 1, status DRAFT, fiber_count_allocated 288, express_fiber_count 48; at creation it held assigned_drop_fiber_count 0, reserve_fiber_count 240 and spare_ratio_bp 8333"
            - "one PLACED HANDHOLE SplicePoint at station 0 dropping 24 fibers, which moved the design to assigned 24, reserve 216 and spare_ratio_bp 7500"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Ridge Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 1250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-25", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "aerial run confirmed" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
            - call: "POST /design-packages"
              payload: { route_id: "${route_id}", fiber_count_allocated: 288, express_fiber_count: 48, expected_route_version: "${rv1}" }
              as: RouteEngineer
              captures: { dp_id: $.data.id, reserve_at_create: $.data.reserve_fiber_count, spare_at_create: $.data.spare_ratio_bp }
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 0, enclosure_type: "HANDHOLE", fiber_count_dropped: 24 }
              as: RouteEngineer
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /splice-points/${sp_id}/void"
              payload: {}
              as: RouteEngineer
              captures: { voided_at: $.data.voided_at }
          assert:
            - "before the void, DesignPackage.${dp_id}.assigned_drop_fiber_count == 24, reserve_fiber_count == 216 and spare_ratio_bp == 7500"
            - "SplicePoint.${sp_id}.status == VOIDED and voided_at == 2026-08-10T00:00:00Z"
            - "DesignPackage.${dp_id}.assigned_drop_fiber_count == 0"
            - "DesignPackage.${dp_id}.reserve_fiber_count == 240, exactly the value captured as reserve_at_create"
            - "DesignPackage.${dp_id}.spare_ratio_bp == 8333, exactly the value captured as spare_at_create"
            - "DesignPackage.${dp_id}.splice_point_count == 0 and handhole_count == 0"
            - "288 == 48 + 0 + 240, so fiber_count_allocated == express_fiber_count + assigned_drop_fiber_count + reserve_fiber_count still holds"
            - "GET /design-packages/${dp_id}/splice-points still returns the VOIDED row, so the void is a state change and not a delete"

      - name: attachment_withdrawal_restores_route_budget_exactly
        grounds:
          - calculations.route_budget_ledger
          - calculations.segment_construction_cost
          - state_machines.PoleAttachmentApplication.transitions.MAKE_READY_ESTIMATED_to_GRANTED
          - state_machines.PoleAttachmentApplication.transitions.any_to_WITHDRAWN
          - entities.Route.fields.budget_committed_cents
          - entities.Route.fields.budget_available_cents
          - entities.PoleAttachmentApplication.fields.committed
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from splice_point_void_restores_reserve_fiber_exactly — MONEY on a Route, where
          authorized 250000000 must always equal committed plus available — and the compensating action is a four-hop
          withdrawal that also has to unwind the make-ready component from the segment's BID_READY cost, restoring
          bid_ready_cost_cents from 905295 back to exactly 394295.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Ridge Ring' (RING_CLOSURE), budget_authorized_cents 250000000"
            - "one RouteSegment: sequence_index 1, length_feet 250, terrain_class URBAN_PAVED, engineering_status DESIGN_LOCKED with construction_method AERIAL, preliminary_cost_cents 394294 and bid_ready_cost_cents 394295"
            - "the segment's ACCEPTED walkout documents only a grade-A pole, so no POLE_REPLACEMENT line is required"
            - "one TELCO PoleAttachmentApplication with pole_count 10 is GRANTED with make_ready_cost_cents 511000, so Route.budget_committed_cents is 511000, Route.budget_available_cents is 249489000 and the segment's bid_ready_cost_cents has been re-derived to 905295"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Ridge Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "ten poles, all serviceable" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
            - call: "POST /segments/${seg_id}/construction-method"
              payload: { method: "AERIAL", expected_route_version: "${rv1}" }
              as: RouteEngineer
            - call: "POST /segments/${seg_id}/bid-ready-estimate"
              payload: {}
              as: RouteEngineer
              captures: { bid_before_grant: $.data.bid_ready_cost_cents }
            - call: "POST /pole-attachment-applications"
              payload: { segment_id: "${seg_id}", pole_owner: "TELCO", pole_count: 10 }
              as: PermitCoordinator
              captures: { paa_id: $.data.id }
            - call: "POST /pole-attachment-applications/${paa_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /pole-attachment-applications/${paa_id}/owner-response"
              payload: { outcome: "ESTIMATED", make_ready_items: [{ pole_tag: "P-001", work_class: "TRANSFER", quantity: 10 }, { pole_tag: "P-002", work_class: "CLEARANCE_TRIM", quantity: 1 }], owner_note: "ten transfers plus one trim" }
              as: PoleOwner
              as_user_id: "telco-owner-1"
            - call: "POST /pole-attachment-applications/${paa_id}/accept-make-ready"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /pole-attachment-applications/${paa_id}/withdraw"
              payload: { reason: "owner rescinded the estimate, re-bidding the make-ready" }
              as: PermitCoordinator
          assert:
            - "before the withdrawal, Route.${route_id}.budget_committed_cents == 511000, budget_available_cents == 249489000 and RouteSegment.${seg_id}.bid_ready_cost_cents == 905295"
            - "hop 1: PoleAttachmentApplication.${paa_id}.status == WITHDRAWN and committed == false"
            - "PoleAttachmentApplication.${paa_id}.make_ready_cost_cents == 511000, retained on the row for audit"
            - "hop 2: Route.${route_id}.budget_committed_cents == 0 and budget_available_cents == 250000000"
            - "hop 3: RouteSegment.${seg_id}.bid_ready_cost_cents == 394295, exactly the value captured as bid_before_grant"
            - "hop 4: Route.${route_id}.total_bid_ready_cost_cents == 394295"
            - "Route.${route_id}.budget_authorized_cents == Route.${route_id}.budget_committed_cents + Route.${route_id}.budget_available_cents"
            - "RouteSegment.${seg_id}.engineering_status == DESIGN_LOCKED and preliminary_cost_cents == 394294, both untouched by the withdrawal"
