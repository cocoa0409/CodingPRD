          sample_min_count) in which each clamp arm is load-bearing on a different pool: at N == 1 the
          outer min() is what stops the draw from exceeding the pool (max(2, ceil(1*5000/10000)) == 2,
          min(1, 2) == 1), while at N == 2 the inner max() is what raises the draw above the percentage
