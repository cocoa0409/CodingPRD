      - name: class_open_requires_approved_show_license
        grounds:
          - validations.priority_12
          - errors.ERR_SHOW_LICENSE_NOT_APPROVED
          - state_machines.ShowClass.PLANNED_to_OPEN
          - state_machines.Show.DRAFT_to_SUBMITTED
          - state_machines.Show.SUBMITTED_to_APPROVED
          - calculations.class_prize_allocation
        distinguishing_aspect: |
          A second cross-entity gate that differs from the coverage gate on every axis: the
          dependency runs upward through the ownership chain (ShowClass -> CompetitionDivision
          -> Show) rather than sideways to an unrelated row, it is a 409 state gate rather than
          a 422 safety gate, and the parent has an intermediate state (SUBMITTED) that is
          neither the start nor the pass condition — so the class stays blocked in a state that
          looks like progress.
        test_recipe:
          setup:
            - "One show left at license_status DRAFT with one ACTIVE JUMPER division (division_share_bp 3333) and class 101 in PLANNED (class_share_bp 1669, jump_height_cm 120)."
            - "prize_money_pool_cents 750000, so the eventual purse is 41721."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Jumper", discipline: "JUMPER", age_group: "OPEN", min_jump_height_cm: 100, max_jump_height_cm: 130, division_share_bp: 3333, jumpoff_enabled: true }
              as: ShowSecretary
              captures: { div_j_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 101, name: "Open Jumper 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1669, max_entries: 30 }
              as: ShowSecretary
              captures: { class_id: $.data.id }
          trigger:
            - call: "POST /classes/${class_id}/open"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /classes/${class_id}/open"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "APPROVE" }
              as: FederationOfficer
            - call: "POST /classes/${class_id}/open"
              payload: {}
              as: ShowSecretary
          assert:
            - "open attempt 1 (Show.license_status == DRAFT) returns 409 with error id ERR_SHOW_LICENSE_NOT_APPROVED, and ShowClass.${class_id}.status is still PLANNED"
            - "open attempt 1 does NOT return ERR_CLASS_NOT_PLANNED — the class's own state is valid; only the parent's is not"
            - "after the submission, Show.${show_id}.license_status == SUBMITTED and Show.${show_id}.revision_count == 0"
            - "open attempt 2 (Show.license_status == SUBMITTED) still returns 409 ERR_SHOW_LICENSE_NOT_APPROVED — the intermediate parent state does not satisfy the gate"
            - "after open attempt 2, ShowClass.${class_id}.status is still PLANNED and no purse has been frozen (class_purse_cents is still 0 / unset)"
            - "open attempt 3, after APPROVE, returns 200 with ShowClass.${class_id}.status == OPEN and class_purse_cents == 41721"
            - "a fourth POST /classes/${class_id}/open returns 409 ERR_CLASS_NOT_PLANNED — once the parent gate passes, the class's own state rule takes over"

  - rule_id: resource_temporal_overlap
    instances:

      - name: ring_slot_half_open_plus_turnover_buffer
        grounds:
          - calculations.ring_schedule_layout
          - validations.priority_42
          - errors.ERR_RING_SLOT_OVERLAP
          - entities.Ring.fields.turnover_buffer_minutes
          - entities.RingSlot.fields.order_index
          - concurrency_rules.slot-create-stale-ring
        distinguishing_aspect: |
          Ring booking uses HALF-OPEN intervals inflated by a symmetric per-ring turnover
          buffer, so a slot starting exactly at the previous slot's end plus the buffer is
          accepted while one minute earlier is rejected — and the same strict inequality is
          probed from the other side, where a candidate ENDING exactly one buffer before the
          existing start is accepted. Warm-up windows are deliberately excluded from this
          geometry, which is what separates it from the official geometry.
        test_recipe:
          setup:
            - "One APPROVED LOCAL show (2026-09-10T13:00:00Z to 2026-09-13T22:00:00Z), Ring A with turnover_buffer_minutes 10."
            - "One JUMPER division (heights 100-130, jumpoff_enabled true, share 3333) with five OPEN classes 101-105, each with zero class entries so each projects exactly 20 minutes."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
