scenario: |
  2817. Foreign Currency Exchange & Travel Money (Travelex retail exchange): currency inventory planning by branch, season and travel corridor with denomination mix, buy/sell rate setting from wholesale rates plus spread and commission structure, cash logistics with armored transport, vault limits and repatriation of surplus currency, customer identification, transaction reporting and structuring detection thresholds, counterfeit detection, damaged note policy and rejected currency handling, buy-back guarantee products and rate-lock terms, exotic and restricted currency handling with export limits, exchange rate board display and disclosure requirements

domain_name: retail-fx-travel-money
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection; parentage is
  # expressed purely through FK fields carried on the child row, never through
  # nested URL paths. Currencies are referenced by their ISO 4217 natural key
  # (`currency_code`), resources by UUID FK.
  state_machine_shape: parallel
  # ExchangeTransaction carries two independent axes (settlement_status x
  # compliance_status); InventoryPlan and ComplianceReport are cyclic;
  # CashShipment forks IN_TRANSIT -> {DELIVERED, EXCEPTION} -> RECONCILED;
  # Branch.posture is a derived aggregate that gates child operations.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  # self_referential: BuybackContract.origin_transaction_id points at an
  # ExchangeTransaction, and ExchangeTransaction.buyback_contract_id points back
  # at a BuybackContract, so the two rows form a two-node reference cycle that
  # must be written in a pinned order.
  role_model: segregation_of_duties
  consistency_model: immediate

entities:
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique branch code, e.g. BR-LHR"
        constraints: "1-16 chars, unique across Branch; ERR_DUPLICATE_BRANCH_CODE on repeat"
      - name: name
        type: string
        source: input
        description: "Human-readable branch name"
      - name: region_code
        type: string
        source: input
        description: "Armored-transport service region; must equal ArmoredRoute.region_code to schedule a shipment on that route"
      - name: home_currency_code
        type: string
        source: input
        default: "USD"
        description: "Settlement currency of the branch till; all USD amounts in this scaffold are minor units (cents) of this currency"
        constraints: "fixed value USD in this scaffold"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Administrative status set at creation and never mutated afterwards"
        constraints: "ACTIVE | SUSPENDED | CLOSED"
      - name: vault_limit_usd_cents
        type: integer
        source: input
        description: "Maximum USD-equivalent value of foreign cash the branch vault may hold"
        constraints: ">= 100000"
      - name: vault_usd_equivalent_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of usd_equivalent_cents over this branch's InventoryPosition rows with status == OPEN; see calculations.branch_vault_utilization_and_posture"
      - name: vault_utilization_bps
        type: integer
        source: computed
        default: 0
        description: "round_half_up(10000 * vault_usd_equivalent_cents / vault_limit_usd_cents)"
      - name: posture
        type: enum
        source: computed
        default: OPEN
        description: "Derived gate over all child operations; recomputed on every InventoryPosition mutation"
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: buyback_liability_usd_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of liability_usd_cents over this branch's BuybackContract rows with status IN {ISSUED, PARTIALLY_REDEEMED}; see calculations.buyback_liability_reconciliation"
      - name: repatriation_pending
        type: boolean
        source: computed
        default: false
        description: "True while this branch has a CashShipment with direction == REPATRIATION and status IN {REQUESTED, SCHEDULED, IN_TRANSIT}"

  - name: CurrencyProfile
    parent: null
    common_fields: false
    fields:
      - name: iso_code
        type: string
        source: input
        description: "ISO 4217 alphabetic code; the natural key every other entity's currency_code field resolves against"
        constraints: "exactly 3 uppercase letters, unique across CurrencyProfile"
      - name: display_name
        type: string
        source: input
        description: "Board display name, e.g. Euro"
      - name: minor_unit_digits
        type: integer
        source: input
        description: "ISO 4217 exponent; 0 for JPY, 2 for EUR/CHF/USD, 3 for BHD"
        constraints: "0 | 2 | 3"
      - name: currency_class
        type: enum
        source: input
        description: "Handling class that gates transaction eligibility and inventory-plan capping"
        constraints: "MAJOR | EXOTIC | RESTRICTED"
      - name: standard_denominations
        type: array
        source: input
        description: "Ascending distinct note face values in minor units, e.g. [500, 1000, 2000, 5000, 10000] for EUR"
        constraints: "1-8 integers, strictly ascending, each >= 1"
      - name: export_limit_minor_units
        type: integer
        source: input
        default: null
        description: "Per-transaction physical export cap in minor units; REQUIRED (non-null) when currency_class == RESTRICTED, MUST be null otherwise"
      - name: buyback_eligible
        type: boolean
        source: input
        default: false
        description: "When false, no BuybackContract may be issued for this currency"
      - name: damaged_note_recovery_bps
        type: integer
        source: input
        default: 6500
        description: "Basis points of USD face value paid back on a DAMAGED note assessed EXCHANGED_AT_DISCOUNT"
        constraints: "0..10000"

  - name: WholesaleRate
    parent: null
    common_fields: false
    fields:
      - name: currency_code
        type: string
        source: input
        description: "ISO 4217 code; MUST equal an existing CurrencyProfile.iso_code else ERR_CURRENCY_NOT_FOUND"
      - name: mid_rate_micros
        type: integer
        source: input
        description: "Wholesale mid rate expressed as foreign-currency MINOR units per 1 USD cent, scaled by 1e6 (EUR 0.92/USD -> 920000; JPY 147.5/USD -> 1475000)"
        constraints: ">= 1"
      - name: effective_at
        type: datetime
        source: input
        description: "Instant from which this wholesale quote may be cited by a RateCard"
      - name: source_code
        type: enum
        source: input
        description: "Provenance of the quote"
        constraints: "REUTERS_MID | INTERBANK_CLOSE"

  - name: TravelCorridor
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Unique corridor code, e.g. LHR-CDG-SUMMER"
        constraints: "unique across TravelCorridor"
      - name: origin_country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 origin country"
      - name: destination_country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 destination country"
      - name: destination_currency_code
        type: string
        source: input
        description: "ISO 4217 code of the corridor's spend currency; MUST equal an existing CurrencyProfile.iso_code else ERR_CURRENCY_NOT_FOUND"
      - name: season
        type: enum
        source: input
        description: "Planning season this corridor row describes"
        constraints: "SPRING | SUMMER | AUTUMN | WINTER"
      - name: season_start_date
        type: datetime
        source: input
        description: "Inclusive start of the season window"
      - name: season_end_date
        type: datetime
        source: input
        description: "Exclusive end of the season window; MUST be strictly after season_start_date"
      - name: demand_index_bps
        type: integer
        source: input
        description: "Seasonal demand multiplier in basis points; 10000 == baseline demand"
        constraints: "1..50000"

  - name: ArmoredRoute
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Unique route code, e.g. RT-SOUTH-1"
        constraints: "unique across ArmoredRoute"
      - name: carrier_name
        type: string
        source: input
        description: "Armored carrier operating the route"
      - name: region_code
        type: string
        source: input
        description: "Service region; a shipment may only be scheduled on this route when Branch.region_code equals this value"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Set at creation and never mutated; SUSPENDED routes reject scheduling"
        constraints: "ACTIVE | SUSPENDED"
      - name: daily_capacity_usd_cents
        type: integer
        source: input
        description: "Maximum summed manifest USD equivalent the route may carry across all shipment windows starting on one UTC calendar day"
        constraints: ">= 1"

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch whose rate board this card belongs to"
      - name: currency_code
        type: string
        source: input
        description: "ISO 4217 code; MUST equal an existing CurrencyProfile.iso_code else ERR_CURRENCY_NOT_FOUND"
      - name: wholesale_rate_id
        type: string
        source: input
        description: "FK -> WholesaleRate.id; the wholesale quote this card's rates are derived from. Its currency_code MUST equal this card's currency_code"
      - name: buy_spread_bps
        type: integer
        source: input
        description: "Retail spread applied against the mid when the branch BUYS foreign currency from a customer"
        constraints: "0..5000"
      - name: sell_spread_bps
        type: integer
        source: input
        description: "Retail spread applied against the mid when the branch SELLS foreign currency to a customer"
        constraints: "0..5000"
      - name: commission_schedule_code
        type: enum
        source: input
        default: STANDARD
        description: "Selects the commission tier table; PREMIUM adds COMMISSION_PREMIUM_UPLIFT_BPS to every tier rate"
        constraints: "STANDARD | PREMIUM"
      - name: board_display_label
        type: string
        source: input
        description: "Exact text shown on the physical rate board for this currency line"
      - name: disclosure_text_version
        type: integer
        source: input
        description: "Version of the consumer-disclosure wording printed under the board; publishing requires >= MIN_DISCLOSURE_TEXT_VERSION"
        constraints: ">= 1"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of this card's board window"
      - name: effective_to
        type: datetime
        source: input
        default: null
        description: "Exclusive end of this card's board window; null means open-ended. MUST be strictly after effective_from when present"
      - name: buy_rate_micros
        type: integer
        source: computed
        description: "round_half_up(wholesale mid_rate_micros * (10000 + buy_spread_bps) / 10000); see calculations.rate_card_derivation"
      - name: sell_rate_micros
        type: integer
        source: computed
        description: "round_half_up(wholesale mid_rate_micros * (10000 - sell_spread_bps) / 10000); see calculations.rate_card_derivation"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Board lifecycle state"
        constraints: "DRAFT | PUBLISHED | SUPERSEDED"
      - name: published_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant at which status became PUBLISHED"
      - name: superseded_by_rate_card_id
        type: string
        source: computed
        default: null
        description: "FK -> RateCard.id; set on the incumbent open-ended PUBLISHED card when a newer card for the same (branch_id, currency_code) is created and truncates it"

  - name: InventoryPosition
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch holding this currency stock"
      - name: currency_code
        type: string
        source: input
        description: "ISO 4217 code; MUST equal an existing CurrencyProfile.iso_code else ERR_CURRENCY_NOT_FOUND. (branch_id, currency_code) is unique -> ERR_POSITION_ALREADY_EXISTS"
      - name: denomination_mix
        type: array
        source: computed
        description: "One object per denomination present on the position: { denomination_minor_units, available_note_count, quarantined_note_count, written_off_note_count }, ordered by denomination_minor_units ASC. Seeded from the create call's opening_denomination_mix and mutated only by declared side effects"
      - name: total_minor_units
        type: integer
        source: computed
        default: 0
        description: "sum(entry.denomination_minor_units * entry.available_note_count) over denomination_mix; the conserved physical-cash quantity"
      - name: quarantined_minor_units
        type: integer
        source: computed
        default: 0
        description: "sum(entry.denomination_minor_units * entry.quarantined_note_count) over denomination_mix; excluded from total_minor_units and from vault valuation"
      - name: usd_equivalent_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(total_minor_units * 1000000 / mid_rate_micros of the selected WholesaleRate); see calculations.position_usd_equivalent"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "OPEN positions count toward Branch.vault_usd_equivalent_cents; CLOSED positions are excluded"
        constraints: "OPEN | CLOSED"

  - name: InventoryPlan
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch this plan stocks"
      - name: travel_corridor_id
        type: string
        source: input
        description: "FK -> TravelCorridor.id; the corridor whose season and demand index drive the targets"
      - name: season_days
        type: integer
        source: input
        description: "Number of days of demand the plan covers"
        constraints: "1..366"
      - name: target_lines
        type: array
        source: input
        description: "Requested lines, one object per currency: { currency_code, baseline_daily_minor_units }. MAY be empty at creation; submitting an empty plan is rejected"
      - name: computed_targets
        type: array
        source: computed
        description: "One object per target_lines entry: { currency_code, target_minor_units }, ordered by currency_code ASC; see calculations.corridor_inventory_target"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Plan lifecycle; REJECTED review returns the plan to DRAFT for revision"
        constraints: "DRAFT | SUBMITTED | APPROVED | ACTIVE"
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: "Incremented by one every time a SUBMITTED plan is returned to DRAFT by a REJECT review"
      - name: submitted_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the BranchManager who last submitted the plan"
      - name: reviewed_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the TreasuryOfficer who last reviewed the plan"
      - name: review_note
        type: string
        source: computed
        default: null
        description: "Free text captured from the last review call"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer legal name as shown on the identification document"
      - name: nationality_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 nationality"
      - name: home_branch_id
        type: string
        source: input
        default: null
        description: "FK -> Branch.id; branch that on-boarded the customer. Nullable"
      - name: id_document_type
        type: enum
        source: input
        default: null
        description: "Identification document class recorded at on-boarding"
        constraints: "PASSPORT | NATIONAL_ID | DRIVING_LICENCE | null"
      - name: id_document_number
        type: string
        source: input
        default: null
        description: "Document number; MUST be present whenever id_document_type is present"
      - name: id_document_expiry
        type: datetime
        source: input
        default: null
        description: "Document expiry instant; MUST be present whenever id_document_type is present"
      - name: travel_document_reference
        type: string
        source: input
        default: null
        description: "Boarding pass or ticket reference; required to sell a RESTRICTED currency"
      - name: rolling_30d_settled_usd_cents
        type: integer
        source: computed
        default: 0
        description: "ROLLING_30D variant of calculations.customer_structuring_aggregates over this customer's SETTLED ExchangeTransaction rows"
      - name: calendar_month_settled_usd_cents
        type: integer
        source: computed
        default: 0
        description: "CALENDAR_MONTH variant of calculations.customer_structuring_aggregates; diverges from rolling_30d_settled_usd_cents whenever settlements straddle a month boundary"
      - name: near_threshold_txn_count
        type: integer
        source: computed
        default: 0
        description: "Count of SETTLED transactions inside the ROLLING_30D window whose settled_usd_gross_cents is in [NEAR_THRESHOLD_FLOOR_CENTS, REPORT_THRESHOLD_CENTS - 1]"
      - name: distinct_branch_count
        type: integer
        source: computed
        default: 0
        description: "Count of distinct branch_id values across the customer's SETTLED transactions inside the ROLLING_30D window"
      - name: structuring_risk_score
        type: integer
        source: computed
        default: 0
        description: "0..100 weighted score; see calculations.customer_structuring_risk_score"
      - name: structuring_risk_tier
        type: enum
        source: computed
        default: NORMAL
        description: "NORMAL when score < RISK_TIER_ELEVATED_MIN; ELEVATED when in [RISK_TIER_ELEVATED_MIN, RISK_TIER_HIGH_MIN - 1]; HIGH when >= RISK_TIER_HIGH_MIN"
        constraints: "NORMAL | ELEVATED | HIGH"
      - name: compliance_hold_active
        type: boolean
        source: computed
        default: false
        description: "True blocks authorization of any new transaction for this customer; set when a STRUCTURING_SUSPICION report is auto-created, cleared only by a ComplianceOfficer release"

  - name: ExchangeTransaction
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; branch performing the exchange"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the counterparty"
      - name: rate_card_id
        type: string
        source: input
        description: "FK -> RateCard.id; the board line quoted to the customer. Its branch_id and currency_code MUST match this transaction's"
      - name: buyback_contract_id
        type: string
        source: computed
        default: null
        description: "FK -> BuybackContract.id; set on this transaction when a BuybackContract is issued against it as its origin"
      - name: currency_code
        type: string
        source: input
        description: "ISO 4217 code of the foreign currency being exchanged; MUST equal an existing CurrencyProfile.iso_code"
      - name: direction
        type: enum
        source: input
        description: "SELL_FX_TO_CUSTOMER debits branch inventory and the customer pays USD; BUY_FX_FROM_CUSTOMER credits branch inventory and the customer receives USD"
        constraints: "SELL_FX_TO_CUSTOMER | BUY_FX_FROM_CUSTOMER"
      - name: requested_denominations
        type: array
        source: input
        description: "Note breakdown of the deal: one object per denomination { denomination_minor_units, note_count }, each denomination distinct and present in CurrencyProfile.standard_denominations, each note_count >= 1. MUST contain at least one entry"
      - name: fx_gross_minor_units
        type: integer
        source: computed
        description: "sum(denomination_minor_units * note_count) over requested_denominations"
      - name: applied_rate_micros
        type: integer
        source: computed
        description: "RateCard.sell_rate_micros for SELL_FX_TO_CUSTOMER, RateCard.buy_rate_micros for BUY_FX_FROM_CUSTOMER, read from the card cited at quote time"
      - name: quoted_usd_gross_cents
        type: integer
        source: computed
        description: "QUOTE_PROVISIONAL variant output of calculations.transaction_usd_conversion"
      - name: quoted_commission_cents
        type: integer
        source: computed
        description: "QUOTE_PROVISIONAL variant output of calculations.transaction_commission_and_total"
      - name: quoted_total_charge_cents
        type: integer
        source: computed
        description: "quoted_usd_gross_cents + quoted_commission_cents (SELL) or quoted_usd_gross_cents - quoted_commission_cents (BUY)"
      - name: quote_expires_at
        type: datetime
        source: computed
        description: "created_at + QUOTE_TTL_MINUTES on the logical clock"
      - name: settled_usd_gross_cents
        type: integer
        source: computed
        default: null
        description: "SETTLEMENT_FINAL variant gross; equals quoted_usd_gross_cents unless the authorization-time rate card differs"
      - name: settled_commission_cents
        type: integer
        source: computed
        default: null
        description: "SETTLEMENT_FINAL variant commission; tier is keyed on the customer's same-UTC-day settled gross at this branch INCLUDING this transaction"
      - name: settled_total_charge_cents
        type: integer
        source: computed
        default: null
        description: "settled_usd_gross_cents +/- settled_commission_cents by direction"
      - name: price_adjustment_cents
        type: integer
        source: computed
        default: null
        description: "settled_total_charge_cents - quoted_total_charge_cents; signed, may be negative"
      - name: settlement_status
        type: enum
        source: computed
        default: QUOTED
        description: "Money-movement axis, independent of compliance_status"
        constraints: "QUOTED | AUTHORIZED | SETTLED | VOIDED | REVERSED"
      - name: compliance_status
        type: enum
        source: computed
        default: PENDING
        description: "Compliance axis, independent of settlement_status; BLOCKED bars settlement, FLAGGED does not"
        constraints: "PENDING | CLEARED | FLAGGED | BLOCKED"
      - name: quoted_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the BranchTeller who created the quote"
      - name: authorized_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the actor who authorized the transaction"
      - name: settled_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the actor who settled the transaction; MUST differ from authorized_by_user_id once settled_usd_gross_cents >= DUAL_CONTROL_THRESHOLD_CENTS"
      - name: authorized_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of authorization; fixes which RateCard window the settlement re-reads"
      - name: settled_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of settlement; the timestamp all compliance windows aggregate on"
      - name: reversed_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of reversal"

  - name: BuybackContract
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; holder of the rate lock"
      - name: branch_id
        type: string
        source: computed
        description: "FK -> Branch.id; copied from the origin transaction's branch_id"
      - name: origin_transaction_id
        type: string
        source: input
        description: "FK -> ExchangeTransaction.id; the SETTLED SELL_FX_TO_CUSTOMER deal this guarantee is attached to. At most one contract per origin -> ERR_CONTRACT_ALREADY_ISSUED"
      - name: currency_code
        type: string
        source: computed
        description: "Copied from the origin transaction; the CurrencyProfile MUST have buyback_eligible == true"
      - name: locked_buy_rate_micros
        type: integer
        source: computed
        description: "RateCard.buy_rate_micros of the origin transaction's rate card, frozen at issue"
      - name: locked_fx_minor_units
        type: integer
        source: computed
        description: "Copied from the origin transaction's fx_gross_minor_units; the maximum notional the lock covers"
      - name: remaining_fx_minor_units
        type: integer
        source: computed
        description: "locked_fx_minor_units minus the sum of all redeemed note values; decremented on every redemption"
      - name: fee_usd_cents
        type: integer
        source: computed
        description: "max(BUYBACK_FEE_MIN_CENTS, round_half_up(origin.settled_usd_gross_cents * BUYBACK_FEE_BPS / 10000))"
      - name: liability_usd_cents
        type: integer
        source: computed
        description: "round_half_up(remaining_fx_minor_units * 1000000 / locked_buy_rate_micros); 0 once the contract leaves {ISSUED, PARTIALLY_REDEEMED}"
      - name: rate_lock_expires_at
        type: datetime
        source: computed
        description: "issue-time logical clock + RATE_LOCK_DAYS days"
      - name: status
        type: enum
        source: computed
        default: ISSUED
        description: "Rate-lock lifecycle; PARTIALLY_REDEEMED is re-entrant across successive partial redemptions"
        constraints: "ISSUED | PARTIALLY_REDEEMED | REDEEMED | EXPIRED | CANCELLED"
      - name: redemption_count
        type: integer
        source: computed
        default: 0
        description: "Number of successful redemption calls against this contract"
      - name: superseded_by_contract_id
        type: string
        source: computed
        default: null
        description: "FK -> BuybackContract.id; set on the incumbent contract when a newer contract for the same (customer_id, currency_code) cancels it"

  - name: NoteAssessment
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; branch that detained the notes"
      - name: inventory_position_id
        type: string
        source: input
        description: "FK -> InventoryPosition.id; the position the notes are quarantined out of. Its branch_id MUST equal this row's branch_id"
      - name: exchange_transaction_id
        type: string
        source: input
        description: "FK -> ExchangeTransaction.id; the SETTLED BUY_FX_FROM_CUSTOMER deal the notes arrived on"
      - name: currency_code
        type: string
        source: computed
        description: "Copied from the cited InventoryPosition"
      - name: denomination_minor_units
        type: integer
        source: input
        description: "Face value of the detained note class; MUST already exist on the position's denomination_mix with available_note_count >= note_count"
      - name: note_count
        type: integer
        source: input
        description: "How many notes are detained"
        constraints: ">= 1"
      - name: defect_type
        type: enum
        source: input
        description: "Why the notes were pulled"
        constraints: "SUSPECTED_COUNTERFEIT | DAMAGED | OBSOLETE_SERIES"
      - name: serial_reference
        type: string
        source: input
        default: null
        description: "Serial or batch reference recorded by the teller"
      - name: face_fx_minor_units
        type: integer
        source: computed
        description: "denomination_minor_units * note_count"
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "SUBMITTED while the notes sit in quarantine; ASSESSED once an outcome is recorded"
        constraints: "SUBMITTED | ASSESSED"
      - name: outcome
        type: enum
        source: computed
        default: null
        description: "Branch taken at assessment; each outcome carries a different side-effect set"
        constraints: "CONFISCATED | RETURNED | EXCHANGED_AT_DISCOUNT | null"
      - name: recovery_usd_cents
        type: integer
        source: computed
        default: null
        description: "Only for outcome == EXCHANGED_AT_DISCOUNT; see calculations.damaged_note_recovery. Null for the other two outcomes"
      - name: assessed_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the BranchManager who recorded the outcome"

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: computed
        description: "FK -> Customer.id; subject of the report"
      - name: branch_id
        type: string
        source: computed
        description: "FK -> Branch.id; branch where the triggering event occurred"
      - name: triggering_transaction_id
        type: string
        source: computed
        default: null
        description: "FK -> ExchangeTransaction.id; the settlement that raised the report. Null for COUNTERFEIT_SEIZURE reports raised from an assessment"
      - name: note_assessment_id
        type: string
        source: computed
        default: null
        description: "FK -> NoteAssessment.id; the assessment that raised the report. Null for the two settlement-driven report types"
      - name: report_type
        type: enum
        source: computed
        description: "Regulatory report class"
        constraints: "THRESHOLD_REPORT | STRUCTURING_SUSPICION | COUNTERFEIT_SEIZURE"
      - name: window_start
        type: datetime
        source: computed
        description: "Inclusive start of the aggregation window the report cites"
      - name: window_end
        type: datetime
        source: computed
        description: "Inclusive end of the aggregation window the report cites (the triggering settlement instant)"
      - name: aggregate_usd_cents
        type: integer
        source: computed
        description: "For THRESHOLD_REPORT: the triggering transaction's settled_usd_gross_cents. For STRUCTURING_SUSPICION: the CALENDAR_MONTH variant of calculations.customer_structuring_aggregates. For COUNTERFEIT_SEIZURE: the assessment's USD face value"
      - name: transaction_count
        type: integer
        source: computed
        description: "Number of SETTLED transactions inside [window_start, window_end]; 1 for THRESHOLD_REPORT, 0 for COUNTERFEIT_SEIZURE"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Filing lifecycle; AMENDING is re-entered from FILED and returns to FILED"
        constraints: "DRAFT | FILED | AMENDING"
      - name: filing_reference
        type: string
        source: computed
        default: null
        description: "Regulator acknowledgement reference captured on the filing call"
      - name: filed_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the most recent filing"
      - name: amendment_count
        type: integer
        source: computed
        default: 0
        description: "Incremented by one each time an AMENDING report is re-filed"

  - name: CashShipment
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch receiving (REPLENISHMENT) or emptying (REPATRIATION) currency"
      - name: armored_route_id
        type: string
        source: computed
        default: null
        description: "FK -> ArmoredRoute.id; assigned by the scheduling call, null while REQUESTED"
      - name: currency_code
        type: string
        source: input
        description: "ISO 4217 code of the currency being moved"
      - name: direction
        type: enum
        source: input
        description: "REPLENISHMENT moves currency into the branch vault; REPATRIATION moves surplus out"
        constraints: "REPLENISHMENT | REPATRIATION"
      - name: manifest_denominations
        type: array
        source: computed
        description: "Note breakdown on the manifest: { denomination_minor_units, note_count }. Seeded from the request for REPLENISHMENT, computed by calculations.repatriation_surplus_manifest for auto-generated REPATRIATION shipments"
      - name: manifest_minor_units
        type: integer
        source: computed
        description: "sum(denomination_minor_units * note_count) over manifest_denominations"
      - name: manifest_usd_equivalent_cents
        type: integer
        source: computed
        description: "round_half_up(manifest_minor_units * 1000000 / selected WholesaleRate.mid_rate_micros); see calculations.shipment_manifest_valuation"
      - name: window_start
        type: datetime
        source: computed
        default: null
        description: "Inclusive start of the armored-transport window; set by the scheduling call"
      - name: window_end
        type: datetime
        source: computed
        default: null
        description: "Inclusive end of the armored-transport window; set by the scheduling call"
      - name: status
        type: enum
        source: computed
        default: REQUESTED
        description: "Logistics lifecycle; IN_TRANSIT forks to DELIVERED or EXCEPTION and both converge on RECONCILED"
        constraints: "REQUESTED | SCHEDULED | IN_TRANSIT | DELIVERED | EXCEPTION | RECONCILED"
      - name: delivered_minor_units
        type: integer
        source: computed
        default: null
        description: "sum over the arrival call's delivered_denominations"
      - name: variance_minor_units
        type: integer
        source: computed
        default: null
        description: "manifest_minor_units - delivered_minor_units; non-zero forces the EXCEPTION branch"
      - name: exception_reason
        type: enum
        source: computed
        default: null
        description: "MANIFEST_VARIANCE when the arrival count differs from the manifest"
        constraints: "MANIFEST_VARIANCE | null"
      - name: written_off_minor_units
        type: integer
        source: computed
        default: null
        description: "Variance written off by the reconciliation call; equals variance_minor_units for an EXCEPTION shipment and 0 for a clean DELIVERED shipment"
      - name: auto_generated
        type: boolean
        source: computed
        default: false
        description: "True when the shipment was raised by the posture cascade rather than by an operator request"

state_machines:
  - entity: Branch
    initial_state: OPEN
    terminal_states: []
    note: |
      `posture` is a derived aggregate, never set by a request body. It is
      recomputed at the end of every request that mutates any InventoryPosition
      belonging to the branch (see calculations.branch_vault_utilization_and_posture).
      Thresholds are inclusive on the RESTRICTED band: bps < 9000 -> OPEN,
      9000 <= bps <= 10000 -> RESTRICTED, bps > 10000 -> FROZEN.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: vault_utilization_bps recomputation at the end of any request that mutates an InventoryPosition of this branch"
        actor: system
        preconditions:
          - "VAULT_RESTRICTED_MIN_BPS (9000) <= vault_utilization_bps <= VAULT_FROZEN_MIN_BPS (10000)"
        side_effects:
          - "Branch.posture := RESTRICTED; Branch.updated_at refreshed; Branch.version += 1"
          - "If Branch.repatriation_pending == false AND at least one InventoryPosition of this branch has status == OPEN and total_minor_units > 0: create one CashShipment with direction REPATRIATION, status REQUESTED, auto_generated true, currency_code and manifest_denominations from calculations.repatriation_surplus_manifest"
          - "If that shipment was created: Branch.repatriation_pending := true"
      - from: OPEN
        to: FROZEN
        trigger: "system: vault_utilization_bps recomputation at the end of any request that mutates an InventoryPosition of this branch"
        actor: system
        preconditions:
          - "vault_utilization_bps > VAULT_FROZEN_MIN_BPS (10000)"
        side_effects:
          - "Branch.posture := FROZEN; Branch.updated_at refreshed; Branch.version += 1"
          - "Same conditional REPATRIATION CashShipment creation and repatriation_pending update as OPEN -> RESTRICTED"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: vault_utilization_bps recomputation at the end of any request that mutates an InventoryPosition of this branch"
        actor: system
        preconditions:
          - "vault_utilization_bps > VAULT_FROZEN_MIN_BPS (10000)"
        side_effects:
          - "Branch.posture := FROZEN; Branch.updated_at refreshed; Branch.version += 1"
          - "No new REPATRIATION shipment when Branch.repatriation_pending is already true"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: vault_utilization_bps recomputation at the end of any request that mutates an InventoryPosition of this branch"
        actor: system
        preconditions:
          - "vault_utilization_bps < VAULT_RESTRICTED_MIN_BPS (9000)"
        side_effects:
          - "Branch.posture := OPEN; Branch.updated_at refreshed; Branch.version += 1"
          - "Any REQUESTED auto_generated REPATRIATION CashShipment of this branch is left untouched; repatriation_pending is unchanged"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system: vault_utilization_bps recomputation at the end of any request that mutates an InventoryPosition of this branch"
        actor: system
        preconditions:
          - "VAULT_RESTRICTED_MIN_BPS (9000) <= vault_utilization_bps <= VAULT_FROZEN_MIN_BPS (10000)"
        side_effects:
          - "Branch.posture := RESTRICTED; Branch.updated_at refreshed; Branch.version += 1"
      - from: FROZEN
        to: OPEN
        trigger: "system: vault_utilization_bps recomputation at the end of any request that mutates an InventoryPosition of this branch"
        actor: system
        preconditions:
          - "vault_utilization_bps < VAULT_RESTRICTED_MIN_BPS (9000)"
        side_effects:
          - "Branch.posture := OPEN; Branch.updated_at refreshed; Branch.version += 1"

  - entity: RateCard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rate-cards/{id}/publish"
        actor: TreasuryOfficer
        preconditions:
          - "RateCard.status == DRAFT else ERR_RATE_CARD_NOT_DRAFT"
          - "RateCard.disclosure_text_version >= MIN_DISCLOSURE_TEXT_VERSION (3) else ERR_DISCLOSURE_VERSION_UNSUPPORTED"
          - "No other RateCard with the same (branch_id, currency_code) and status == PUBLISHED whose half-open window [effective_from, effective_to) intersects this card's half-open window else ERR_RATE_WINDOW_OVERLAP (a null effective_to means +infinity; touching endpoints do NOT intersect)"
        side_effects:
          - "RateCard.status := PUBLISHED; RateCard.published_at := logical clock"
          - "The branch's rate board (GET /branches/{id}/rate-board) now returns this card for its currency line whenever the clock is inside the window"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /rate-cards (creation of a newer card for the same branch_id and currency_code)"
        actor: TreasuryOfficer
        preconditions:
          - "The incumbent card has status == PUBLISHED AND effective_to == null (open-ended) AND the new card's effective_from >= incumbent.effective_from"
        side_effects:
          - "incumbent.effective_to := new_card.effective_from (truncation); incumbent.status := SUPERSEDED; incumbent.superseded_by_rate_card_id := new_card.id"
          - "Branch.version += 1 (the OCC anchor observed by concurrency_rules.ratecard-create-supersede-stale-branch)"

  - entity: InventoryPlan
    initial_state: DRAFT
    terminal_states: [ACTIVE]
    note: "Cyclic: SUBMITTED -> DRAFT on a REJECT review, and the same plan may be resubmitted any number of times; revision_count counts the loops."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /inventory-plans/{id}/submit"
        actor: BranchManager
        preconditions:
          - "InventoryPlan.status == DRAFT else ERR_PLAN_INVALID_STATE"
          - "len(InventoryPlan.target_lines) >= 1 else ERR_PLAN_NO_TARGET_LINES"
          - "Every target_lines[].currency_code resolves to a CurrencyProfile else ERR_CURRENCY_NOT_FOUND"
        side_effects:
          - "InventoryPlan.status := SUBMITTED; submitted_by_user_id := X-User-ID"
          - "InventoryPlan.computed_targets recomputed by calculations.corridor_inventory_target"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /inventory-plans/{id}/review with decision REJECT"
        actor: TreasuryOfficer
        preconditions:
          - "InventoryPlan.status == SUBMITTED else ERR_PLAN_INVALID_STATE"
          - "X-User-ID != InventoryPlan.submitted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "InventoryPlan.status := DRAFT; revision_count += 1; reviewed_by_user_id := X-User-ID; review_note := request review_note"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /inventory-plans/{id}/review with decision APPROVE"
        actor: TreasuryOfficer
        preconditions:
          - "InventoryPlan.status == SUBMITTED else ERR_PLAN_INVALID_STATE"
          - "X-User-ID != InventoryPlan.submitted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "InventoryPlan.status := APPROVED; reviewed_by_user_id := X-User-ID; review_note := request review_note"
          - "InventoryPlan.computed_targets recomputed by calculations.corridor_inventory_target"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /inventory-plans/{id}/activate"
        actor: BranchManager
        preconditions:
          - "InventoryPlan.status == APPROVED else ERR_PLAN_INVALID_STATE"
          - "Branch.posture != FROZEN else ERR_BRANCH_POSTURE_FROZEN"
          - "TravelCorridor.season_start_date <= logical clock < TravelCorridor.season_end_date else ERR_PLAN_OUTSIDE_SEASON"
        side_effects:
          - "InventoryPlan.status := ACTIVE"
          - "Any other InventoryPlan of the same (branch_id, travel_corridor_id) with status == ACTIVE keeps its state; ACTIVE plans are additive and none is superseded"
          - "EXOTIC-class currencies listed in computed_targets become sellable at this branch (see validations priority 10, ERR_EXOTIC_PLAN_REQUIRED)"

  - entity: Customer
    initial_state: NORMAL
    terminal_states: []
    note: |
      The state field is `structuring_risk_tier`. It is derived from
      calculations.customer_structuring_risk_score and re-derived on every
      settlement and every reversal, so it can climb and fall. The boolean
      `compliance_hold_active` is a second, independent flag: it is raised only by
      the STRUCTURING_SUSPICION cascade and cleared only by an explicit release.
    transitions:
      - from: NORMAL
        to: ELEVATED
        trigger: "system: recomputation at the end of POST /exchange-transactions/{id}/settle or POST /exchange-transactions/{id}/reverse"
        actor: system
        preconditions:
          - "RISK_TIER_ELEVATED_MIN (25) <= structuring_risk_score < RISK_TIER_HIGH_MIN (70)"
        side_effects:
          - "Customer.structuring_risk_tier := ELEVATED; Customer.version += 1"
      - from: ELEVATED
        to: HIGH
        trigger: "system: recomputation at the end of POST /exchange-transactions/{id}/settle"
        actor: system
        preconditions:
          - "structuring_risk_score >= RISK_TIER_HIGH_MIN (70)"
        side_effects:
          - "Customer.structuring_risk_tier := HIGH"
          - "Create one ComplianceReport with report_type STRUCTURING_SUSPICION and status DRAFT, unless this customer already has a STRUCTURING_SUSPICION report with status IN {DRAFT, AMENDING}"
          - "If that report was created: Customer.compliance_hold_active := true (caused by the report, not by the settlement)"
      - from: NORMAL
        to: HIGH
        trigger: "system: recomputation at the end of POST /exchange-transactions/{id}/settle"
        actor: system
        preconditions:
          - "structuring_risk_score >= RISK_TIER_HIGH_MIN (70)"
        side_effects:
          - "Identical to ELEVATED -> HIGH"
      - from: HIGH
        to: ELEVATED
        trigger: "system: recomputation at the end of POST /exchange-transactions/{id}/reverse"
        actor: system
        preconditions:
          - "RISK_TIER_ELEVATED_MIN (25) <= structuring_risk_score < RISK_TIER_HIGH_MIN (70)"
        side_effects:
          - "Customer.structuring_risk_tier := ELEVATED"
          - "compliance_hold_active is NOT cleared; only POST /customers/{id}/compliance-hold with action RELEASE clears it"
      - from: ELEVATED
        to: NORMAL
        trigger: "system: recomputation at the end of POST /exchange-transactions/{id}/reverse"
        actor: system
        preconditions:
          - "structuring_risk_score < RISK_TIER_ELEVATED_MIN (25)"
        side_effects:
          - "Customer.structuring_risk_tier := NORMAL"

  - entity: ExchangeTransaction
    initial_state: QUOTED
    terminal_states: [VOIDED, REVERSED]
    note: |
      Two independent axes on one row. Axis A is `settlement_status`
      (QUOTED -> AUTHORIZED -> SETTLED -> REVERSED, with VOIDED reachable from the
      first two). Axis B is `compliance_status` (PENDING -> CLEARED | FLAGGED |
      BLOCKED, FLAGGED -> CLEARED | BLOCKED). The axes advance independently: a
      row may be SETTLED x FLAGGED, or AUTHORIZED x BLOCKED. The only coupling
      points are (i) settlement is barred while compliance_status == BLOCKED and
      (ii) authorization auto-advances axis B to FLAGGED when the customer is HIGH.
    transitions:
      - from: QUOTED
        to: AUTHORIZED
        trigger: "POST /exchange-transactions/{id}/authorize"
        actor: BranchTeller
        preconditions:
          - "settlement_status == QUOTED else ERR_TRANSACTION_NOT_QUOTED"
          - "logical clock <= quote_expires_at else ERR_QUOTE_EXPIRED"
          - "Branch.status == ACTIVE else ERR_BRANCH_NOT_ACTIVE"
          - "Branch.posture != FROZEN else ERR_BRANCH_POSTURE_FROZEN"
          - "direction != BUY_FX_FROM_CUSTOMER OR Branch.posture != RESTRICTED else ERR_BRANCH_POSTURE_RESTRICTED"
          - "Customer.compliance_hold_active == false else ERR_CUSTOMER_COMPLIANCE_HOLD"
          - "All validations of priority 7 through 12 that apply to this endpoint pass"
        side_effects:
          - "settlement_status := AUTHORIZED; authorized_at := logical clock; authorized_by_user_id := X-User-ID"
          - "If Customer.structuring_risk_tier == HIGH: compliance_status := FLAGGED (axis B advances without touching axis A)"
          - "No inventory movement: notes are only moved at settlement"
      - from: AUTHORIZED
        to: SETTLED
        trigger: "POST /exchange-transactions/{id}/settle"
        actor: BranchTeller | BranchManager
        preconditions:
          - "settlement_status == AUTHORIZED else ERR_TRANSACTION_NOT_AUTHORIZED"
          - "compliance_status != BLOCKED else ERR_TRANSACTION_COMPLIANCE_BLOCKED"
          - "settled_usd_gross_cents < DUAL_CONTROL_THRESHOLD_CENTS (500000) OR X-User-ID != authorized_by_user_id else ERR_DUAL_CONTROL_REQUIRED"
          - "For SELL_FX_TO_CUSTOMER: every requested denomination is present on the branch's InventoryPosition for this currency (else ERR_DENOMINATION_NOT_STOCKED) with available_note_count >= requested note_count (else ERR_INSUFFICIENT_INVENTORY)"
          - "For BUY_FX_FROM_CUSTOMER: the post-credit Branch.vault_usd_equivalent_cents <= Branch.vault_limit_usd_cents else ERR_VAULT_LIMIT_WOULD_EXCEED"
        side_effects:
          - "settled_usd_gross_cents / settled_commission_cents / settled_total_charge_cents / price_adjustment_cents written by the SETTLEMENT_FINAL variants of calculations.transaction_usd_conversion and calculations.transaction_commission_and_total"
          - "settlement_status := SETTLED; settled_at := logical clock; settled_by_user_id := X-User-ID"
          - "Cascade hop 1: the branch's InventoryPosition for currency_code has each requested denomination's available_note_count decremented (SELL) or incremented (BUY)"
          - "Cascade hop 2: that position's total_minor_units and usd_equivalent_cents are recomputed from the new mix"
          - "Cascade hop 3: Branch.vault_usd_equivalent_cents and vault_utilization_bps are recomputed from the position totals"
          - "Cascade hop 4: Branch.posture is re-derived and may transition per the Branch state machine (which may itself raise a REPATRIATION CashShipment as hop 5)"
          - "Cascade hop A1: Customer.rolling_30d_settled_usd_cents, calendar_month_settled_usd_cents, near_threshold_txn_count and distinct_branch_count are recomputed"
          - "Cascade hop A2: Customer.structuring_risk_score and structuring_risk_tier are re-derived from those aggregates"
          - "Cascade hop A3: a HIGH tier arrival creates a STRUCTURING_SUSPICION ComplianceReport (DRAFT)"
          - "Cascade hop A4: the creation of that report sets Customer.compliance_hold_active := true"
          - "Independent of the cascade: when settled_usd_gross_cents >= REPORT_THRESHOLD_CENTS (1000000), one ComplianceReport with report_type THRESHOLD_REPORT and status DRAFT is created for this transaction"
      - from: QUOTED
        to: VOIDED
        trigger: "POST /exchange-transactions/{id}/void"
        actor: BranchTeller
        preconditions:
          - "settlement_status IN {QUOTED, AUTHORIZED} else ERR_TRANSACTION_NOT_VOIDABLE"
        side_effects:
          - "settlement_status := VOIDED; no inventory, customer-aggregate or report effect"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /exchange-transactions/{id}/void"
        actor: BranchTeller
        preconditions:
          - "settlement_status IN {QUOTED, AUTHORIZED} else ERR_TRANSACTION_NOT_VOIDABLE"
        side_effects:
          - "settlement_status := VOIDED; no inventory, customer-aggregate or report effect"
      - from: SETTLED
        to: REVERSED
        trigger: "POST /exchange-transactions/{id}/reverse"
        actor: BranchManager
        preconditions:
          - "settlement_status == SETTLED else ERR_TRANSACTION_NOT_SETTLED"
          - "logical clock <= settled_at + REVERSAL_WINDOW_HOURS (24) else ERR_REVERSAL_WINDOW_CLOSED"
          - "compliance_status != BLOCKED else ERR_TRANSACTION_COMPLIANCE_BLOCKED"
          - "buyback_contract_id == null else ERR_BUYBACK_BLOCKS_REVERSAL"
        side_effects:
          - "settlement_status := REVERSED; reversed_at := logical clock"
          - "Compensation 1: every requested denomination's available_note_count on the branch position is restored to its pre-settlement value (incremented for SELL, decremented for BUY), so total_minor_units returns to its pre-settlement value exactly"
          - "Compensation 2: position usd_equivalent_cents, Branch.vault_usd_equivalent_cents, vault_utilization_bps and posture are recomputed from the restored mix"
          - "Compensation 3: this transaction leaves every Customer aggregate window, so rolling_30d_settled_usd_cents, calendar_month_settled_usd_cents, near_threshold_txn_count and distinct_branch_count return to their pre-settlement values and the risk score/tier are re-derived"
          - "Compensation 4: any DRAFT THRESHOLD_REPORT whose triggering_transaction_id is this transaction is deleted; FILED and AMENDING reports are retained"
          - "compliance_hold_active is deliberately NOT cleared by a reversal"

      # ---- Axis B: compliance_status. Independent of axis A above. ----
      - from: PENDING
        to: CLEARED
        trigger: "POST /exchange-transactions/{id}/compliance-decision with decision CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_status IN {PENDING, FLAGGED} else ERR_COMPLIANCE_DECISION_FINAL"
        side_effects:
          - "compliance_status := CLEARED; settlement_status untouched"
      - from: PENDING
        to: FLAGGED
        trigger: "POST /exchange-transactions/{id}/compliance-decision with decision FLAG, or system auto-flag on authorization of a HIGH-tier customer"
        actor: ComplianceOfficer | system
        preconditions:
          - "compliance_status == PENDING else ERR_COMPLIANCE_DECISION_FINAL"
        side_effects:
          - "compliance_status := FLAGGED; settlement remains permitted"
      - from: PENDING
        to: BLOCKED
        trigger: "POST /exchange-transactions/{id}/compliance-decision with decision BLOCK"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_status IN {PENDING, FLAGGED} else ERR_COMPLIANCE_DECISION_FINAL"
        side_effects:
          - "compliance_status := BLOCKED; any later settle or reverse call on this row is rejected with ERR_TRANSACTION_COMPLIANCE_BLOCKED"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /exchange-transactions/{id}/compliance-decision with decision CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_status IN {PENDING, FLAGGED} else ERR_COMPLIANCE_DECISION_FINAL"
        side_effects:
          - "compliance_status := CLEARED"
      - from: FLAGGED
        to: BLOCKED
        trigger: "POST /exchange-transactions/{id}/compliance-decision with decision BLOCK"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_status IN {PENDING, FLAGGED} else ERR_COMPLIANCE_DECISION_FINAL"
        side_effects:
          - "compliance_status := BLOCKED"

  - entity: BuybackContract
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED, CANCELLED]
    note: "PARTIALLY_REDEEMED is re-entrant: successive partial redemptions loop on the same state until remaining_fx_minor_units reaches 0."
    transitions:
      - from: ISSUED
        to: PARTIALLY_REDEEMED
        trigger: "POST /buyback-contracts/{id}/redeem leaving remaining_fx_minor_units > 0"
        actor: BranchTeller
        preconditions:
          - "status IN {ISSUED, PARTIALLY_REDEEMED} else ERR_CONTRACT_NOT_REDEEMABLE"
          - "Branch.posture != FROZEN else ERR_BRANCH_POSTURE_FROZEN"
          - "A RateCard for (this contract's branch_id, currency_code) exists with status == PUBLISHED and effective_from <= clock < effective_to (null effective_to means +infinity) else ERR_RATE_CARD_NOT_PUBLISHED"
          - "sum over returned_denominations of (denomination_minor_units * note_count) <= remaining_fx_minor_units else ERR_REDEEM_EXCEEDS_REMAINING"
          - "Every returned denomination is in CurrencyProfile.standard_denominations else ERR_INVALID_REQUEST"
          - "The post-credit Branch.vault_usd_equivalent_cents <= Branch.vault_limit_usd_cents else ERR_VAULT_LIMIT_WOULD_EXCEED"
        side_effects:
          - "remaining_fx_minor_units -= returned total; redemption_count += 1; status := PARTIALLY_REDEEMED"
          - "The customer is paid round_half_up(returned_total * 1000000 / locked_buy_rate_micros) USD cents at the LOCKED rate, never at today's board rate"
          - "liability_usd_cents recomputed from the new remaining_fx_minor_units"
          - "Branch.buyback_liability_usd_cents recomputed by calculations.buyback_liability_reconciliation"
          - "Cascade: the branch InventoryPosition for currency_code is credited with the returned notes, then total_minor_units, usd_equivalent_cents, Branch.vault_utilization_bps and Branch.posture are recomputed in that order"
      - from: PARTIALLY_REDEEMED
        to: PARTIALLY_REDEEMED
        trigger: "POST /buyback-contracts/{id}/redeem leaving remaining_fx_minor_units > 0"
        actor: BranchTeller
        preconditions:
          - "Identical to ISSUED -> PARTIALLY_REDEEMED"
        side_effects:
          - "Identical to ISSUED -> PARTIALLY_REDEEMED; the loop may repeat while remaining_fx_minor_units > 0"
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /buyback-contracts/{id}/redeem consuming the whole remaining notional"
        actor: BranchTeller
        preconditions:
          - "Identical to ISSUED -> PARTIALLY_REDEEMED, plus returned total == remaining_fx_minor_units"
        side_effects:
          - "remaining_fx_minor_units := 0; liability_usd_cents := 0; status := REDEEMED; redemption_count += 1"
          - "Branch.buyback_liability_usd_cents recomputed (this contract no longer contributes)"
          - "Same inventory-credit cascade as the partial case"
      - from: PARTIALLY_REDEEMED
        to: REDEEMED
        trigger: "POST /buyback-contracts/{id}/redeem consuming the whole remaining notional"
        actor: BranchTeller
        preconditions:
          - "Identical to ISSUED -> REDEEMED"
        side_effects:
          - "Identical to ISSUED -> REDEEMED"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock past rate_lock_expires_at"
        actor: system
        preconditions:
          - "status IN {ISSUED, PARTIALLY_REDEEMED} AND rate_lock_expires_at < new logical clock"
        side_effects:
          - "status := EXPIRED; liability_usd_cents := 0; remaining_fx_minor_units retained for audit"
          - "Branch.buyback_liability_usd_cents recomputed for every affected branch"
      - from: PARTIALLY_REDEEMED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock past rate_lock_expires_at"
        actor: system
        preconditions:
          - "Identical to ISSUED -> EXPIRED"
        side_effects:
          - "Identical to ISSUED -> EXPIRED"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /buyback-contracts/{id}/cancel, or POST /buyback-contracts creating a newer contract for the same (customer_id, currency_code)"
        actor: BranchManager | TreasuryOfficer
        preconditions:
          - "status IN {ISSUED, PARTIALLY_REDEEMED} else ERR_CONTRACT_NOT_CANCELLABLE"
        side_effects:
          - "status := CANCELLED; remaining_fx_minor_units := 0; liability_usd_cents := 0"
          - "ExchangeTransaction.buyback_contract_id on the origin transaction is reset to null, which re-opens that transaction for reversal"
          - "Branch.buyback_liability_usd_cents recomputed; it MUST return to exactly the value it held before this contract was issued when no other contract changed in between"
          - "When the cancellation was caused by a newer contract, superseded_by_contract_id := the new contract's id"
      - from: PARTIALLY_REDEEMED
        to: CANCELLED
        trigger: "POST /buyback-contracts/{id}/cancel"
        actor: BranchManager | TreasuryOfficer
        preconditions:
          - "Identical to ISSUED -> CANCELLED"
        side_effects:
          - "Identical to ISSUED -> CANCELLED; already-redeemed notes are NOT clawed back"

  - entity: NoteAssessment
    initial_state: SUBMITTED
    terminal_states: [ASSESSED]
    note: "Fork on assessment: one endpoint, three outcomes, three disjoint side-effect sets."
    transitions:
      - from: SUBMITTED
        to: ASSESSED
        trigger: "POST /note-assessments/{id}/assess with outcome CONFISCATED"
        actor: BranchManager
        preconditions:
          - "status == SUBMITTED else ERR_ASSESSMENT_ALREADY_ASSESSED"
          - "defect_type == SUSPECTED_COUNTERFEIT else ERR_OUTCOME_NOT_PERMITTED_FOR_DEFECT"
        side_effects:
          - "status := ASSESSED; outcome := CONFISCATED; recovery_usd_cents stays null; assessed_by_user_id := X-User-ID"
          - "On the cited InventoryPosition's denomination_mix entry: quarantined_note_count -= note_count and written_off_note_count += note_count; available_note_count and total_minor_units are unchanged"
          - "quarantined_minor_units decreases by face_fx_minor_units"
          - "Create one ComplianceReport with report_type COUNTERFEIT_SEIZURE, status DRAFT, note_assessment_id := this assessment"
          - "The cited ExchangeTransaction's compliance_status := FLAGGED when it is currently PENDING"
      - from: SUBMITTED
        to: ASSESSED
        trigger: "POST /note-assessments/{id}/assess with outcome RETURNED"
        actor: BranchManager
        preconditions:
          - "status == SUBMITTED else ERR_ASSESSMENT_ALREADY_ASSESSED"
          - "defect_type IN {DAMAGED, OBSOLETE_SERIES} else ERR_OUTCOME_NOT_PERMITTED_FOR_DEFECT"
        side_effects:
          - "status := ASSESSED; outcome := RETURNED; recovery_usd_cents stays null; assessed_by_user_id := X-User-ID"
          - "quarantined_note_count -= note_count on the mix entry and the notes leave the branch; available_note_count and total_minor_units are unchanged; quarantined_minor_units decreases by face_fx_minor_units"
          - "No ComplianceReport is created and the cited transaction's compliance_status is untouched"
      - from: SUBMITTED
        to: ASSESSED
        trigger: "POST /note-assessments/{id}/assess with outcome EXCHANGED_AT_DISCOUNT"
        actor: BranchManager
        preconditions:
          - "status == SUBMITTED else ERR_ASSESSMENT_ALREADY_ASSESSED"
          - "defect_type == DAMAGED else ERR_OUTCOME_NOT_PERMITTED_FOR_DEFECT"
          - "A RateCard for (branch_id, currency_code) exists with status == PUBLISHED and effective at the clock else ERR_RATE_CARD_NOT_PUBLISHED"
        side_effects:
          - "status := ASSESSED; outcome := EXCHANGED_AT_DISCOUNT; assessed_by_user_id := X-User-ID"
          - "recovery_usd_cents written by calculations.damaged_note_recovery"
          - "quarantined_note_count -= note_count AND available_note_count += note_count on the mix entry, so total_minor_units returns to its pre-quarantine value"
          - "Cascade: position usd_equivalent_cents, Branch.vault_usd_equivalent_cents, vault_utilization_bps and posture recomputed in that order"

  - entity: ComplianceReport
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic: FILED -> AMENDING -> FILED, repeatable; amendment_count counts the loops."
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /compliance-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {DRAFT, AMENDING} else ERR_REPORT_INVALID_STATE"
        side_effects:
          - "status := FILED; filing_reference := request filing_reference; filed_at := logical clock"
          - "When no STRUCTURING_SUSPICION report of this customer remains in {DRAFT, AMENDING}, a later compliance-hold RELEASE call becomes permissible"
      - from: FILED
        to: AMENDING
        trigger: "POST /compliance-reports/{id}/amend"
        actor: ComplianceOfficer
        preconditions:
          - "status == FILED else ERR_REPORT_INVALID_STATE"
        side_effects:
          - "status := AMENDING; amendment_count += 1"
          - "For a STRUCTURING_SUSPICION report this re-blocks the compliance-hold release path"
      - from: AMENDING
        to: FILED
        trigger: "POST /compliance-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {DRAFT, AMENDING} else ERR_REPORT_INVALID_STATE"
        side_effects:
          - "status := FILED; filing_reference overwritten; filed_at := logical clock"

  - entity: CashShipment
    initial_state: REQUESTED
    terminal_states: [RECONCILED]
    note: "Fork-join: IN_TRANSIT branches on the arrival count into DELIVERED (zero variance) or EXCEPTION (non-zero variance) with different side-effect sets, and both branches converge on RECONCILED."
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /cash-shipments/{id}/schedule"
        actor: TreasuryOfficer
        preconditions:
          - "status == REQUESTED else ERR_SHIPMENT_INVALID_STATE"
          - "ArmoredRoute.status == ACTIVE else ERR_ROUTE_SUSPENDED"
          - "ArmoredRoute.region_code == Branch.region_code else ERR_ROUTE_BRANCH_NOT_SERVICED"
          - "window_end > window_start else ERR_INVALID_REQUEST"
          - "No other CashShipment on this route with status IN {SCHEDULED, IN_TRANSIT} whose closed window [window_start, window_end] is separated from the requested window by less than MIN_ROUTE_GAP_MINUTES (45) else ERR_ROUTE_WINDOW_CONFLICT"
          - "The summed manifest_usd_equivalent_cents of this shipment plus every {SCHEDULED, IN_TRANSIT} shipment on this route whose window_start falls on the same UTC calendar day <= ArmoredRoute.daily_capacity_usd_cents else ERR_ROUTE_CAPACITY_EXCEEDED"
        side_effects:
          - "status := SCHEDULED; armored_route_id, window_start and window_end written from the request"
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /cash-shipments/{id}/dispatch"
        actor: TreasuryOfficer
        preconditions:
          - "status == SCHEDULED else ERR_SHIPMENT_INVALID_STATE"
          - "logical clock >= window_start else ERR_SHIPMENT_WINDOW_NOT_OPEN"
        side_effects:
          - "status := IN_TRANSIT; no inventory movement yet"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /cash-shipments/{id}/arrive whose delivered_denominations reproduce the manifest exactly"
        actor: BranchManager
        preconditions:
          - "status == IN_TRANSIT else ERR_SHIPMENT_INVALID_STATE"
          - "delivered_minor_units == manifest_minor_units (zero variance) selects this branch"
        side_effects:
          - "status := DELIVERED; delivered_minor_units set; variance_minor_units := 0; exception_reason stays null"
          - "Cascade hop 1: for direction REPLENISHMENT each delivered denomination's available_note_count on the branch InventoryPosition is incremented (for REPATRIATION it is decremented)"
          - "Cascade hop 2: that position's total_minor_units and usd_equivalent_cents are recomputed"
          - "Cascade hop 3: Branch.vault_usd_equivalent_cents and vault_utilization_bps are recomputed"
          - "Cascade hop 4: Branch.posture is re-derived and may transition per the Branch state machine"
          - "Cascade hop 5: a posture arrival at RESTRICTED or FROZEN raises an auto_generated REPATRIATION CashShipment and sets Branch.repatriation_pending := true"
          - "For a REPATRIATION shipment: Branch.repatriation_pending := false"
      - from: IN_TRANSIT
        to: EXCEPTION
        trigger: "POST /cash-shipments/{id}/arrive whose delivered_denominations differ from the manifest"
        actor: BranchManager
        preconditions:
          - "status == IN_TRANSIT else ERR_SHIPMENT_INVALID_STATE"
          - "delivered_minor_units != manifest_minor_units (non-zero variance) selects this branch"
        side_effects:
          - "status := EXCEPTION; delivered_minor_units set; variance_minor_units := manifest_minor_units - delivered_minor_units; exception_reason := MANIFEST_VARIANCE"
          - "Only the DELIVERED note counts move on the InventoryPosition; the same hop 2 / hop 3 / hop 4 recomputation cascade then runs"
          - "Branch.repatriation_pending is NOT cleared for a REPATRIATION shipment that lands in EXCEPTION"
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /cash-shipments/{id}/reconcile"
        actor: TreasuryOfficer
        preconditions:
          - "status IN {DELIVERED, EXCEPTION} else ERR_SHIPMENT_INVALID_STATE"
        side_effects:
          - "status := RECONCILED; written_off_minor_units := 0"
      - from: EXCEPTION
        to: RECONCILED
        trigger: "POST /cash-shipments/{id}/reconcile"
        actor: TreasuryOfficer
        preconditions:
          - "status IN {DELIVERED, EXCEPTION} else ERR_SHIPMENT_INVALID_STATE"
        side_effects:
          - "status := RECONCILED; written_off_minor_units := variance_minor_units"
          - "For a REPATRIATION shipment: Branch.repatriation_pending := false"

concurrency_rules:
  - rule_id: ratecard-create-supersede-stale-branch
    parent_entity: Branch
    write_endpoint: "POST /rate-cards"
    occ_field: "expected_branch_version"
    description: |
      Creating a RateCard against a Branch whose version has advanced since the
      client last observed it is rejected. Card creation is a reserve-and-truncate
      operation: it may legitimately supersede the branch's incumbent open-ended
      PUBLISHED card for the same currency (RateCard PUBLISHED -> SUPERSEDED), so
      a writer working from a stale view of the branch would silently truncate a
      board window it never saw. The stale-version check turns that into a
      deterministic rejection.
    error_id: ERR_STALE_BRANCH_VERSION
    http_status: 412

  - rule_id: buyback-create-supersede-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /buyback-contracts"
    occ_field: "expected_customer_version"
    description: |
      Issuing a BuybackContract against a Customer whose version has advanced
      since the client last observed it is rejected. Issuance legitimately
      supersedes the customer's incumbent contract for the same currency
      (BuybackContract ISSUED -> CANCELLED with superseded_by_contract_id set), so
      a writer holding a stale customer view would cancel a rate lock it never
      read. The stale-version check makes that outcome a 412 instead.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

calculations:
  - name: wholesale_rate_selection
    trigger: "Whenever any formula needs a mid rate for a currency (position valuation, shipment manifest valuation, inventory-plan vault cap)"
    algorithm: chronological
    formula: |
      candidates = [w for w in WholesaleRate
                    if w.currency_code == target_currency_code
                    and w.effective_at <= logical_clock]
      if candidates is empty: raise ERR_WHOLESALE_RATE_NOT_FOUND
      sort candidates by (effective_at DESC, created_at DESC)
      selected = candidates[0]
      return selected.mid_rate_micros
    input_set: "All WholesaleRate rows for the currency whose effective_at is at or before the logical clock; future-dated quotes are excluded."
    constants: {}
    precision: "integer micros; no rounding performed here"
    variants: []
    note: "Tie-break is created_at DESC (the later-recorded quote wins an effective_at tie). Row id never participates."

  - name: rate_card_derivation
    trigger: "POST /rate-cards (once, at creation; the derived rates are frozen on the card)"
    algorithm: tiered_pricing
    formula: |
      mid = WholesaleRate[card.wholesale_rate_id].mid_rate_micros
      sell_rate_micros = round_half_up(mid * (10000 - card.sell_spread_bps) / 10000)
      buy_rate_micros  = round_half_up(mid * (10000 + card.buy_spread_bps) / 10000)
    input_set: "Exactly the one WholesaleRate row cited by wholesale_rate_id; the selection rule above is NOT re-applied at card creation."
    constants: {}
    precision: "integer micros, round_half_up"
    variants: []
    note: |
      Rates are quoted as foreign-currency MINOR units per 1 USD cent x 1e6, so a
      larger rate always means more foreign currency per dollar. Selling to a
      customer uses the smaller (spread-reduced) sell_rate_micros; buying from a
      customer uses the larger buy_rate_micros.

  - name: transaction_fx_gross
    trigger: "POST /exchange-transactions"
    algorithm: aggregation
    formula: |
      fx_gross_minor_units = sum(line.denomination_minor_units * line.note_count
                                 for line in requested_denominations)
    input_set: "Every entry of requested_denominations; the array MUST be non-empty and its denominations distinct."
    constants: {}
    precision: "integer minor units"
    variants: []

  - name: transaction_usd_conversion
    trigger: "POST /exchange-transactions (QUOTE_PROVISIONAL) and POST /exchange-transactions/{id}/settle (SETTLEMENT_FINAL)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each denomination line to whole USD cents
      # FIRST, then sum the rounded line values. Summing the fx first and
      # rounding once produces a different number of cents and is WRONG.
      usd_gross_cents = 0
      for line in requested_denominations sorted by denomination_minor_units ASC:
          line_fx = line.denomination_minor_units * line.note_count
          line_usd = round_half_up(line_fx * 1000000 / applied_rate_micros)
          usd_gross_cents += line_usd
      return usd_gross_cents
    input_set: "All requested_denominations lines of the one transaction. applied_rate_micros is the sell_rate_micros (SELL_FX_TO_CUSTOMER) or buy_rate_micros (BUY_FX_FROM_CUSTOMER) of the RateCard selected by the variant below."
    constants: {}
    precision: "whole USD cents per line, round_half_up, summed afterwards"
    variants:
      - name: QUOTE_PROVISIONAL
        when: "At POST /exchange-transactions; writes quoted_usd_gross_cents"
        difference: "applied_rate_micros is read from the RateCard cited in the request body, which MUST be PUBLISHED and effective at the quote instant."
      - name: SETTLEMENT_FINAL
        when: "At POST /exchange-transactions/{id}/settle; writes settled_usd_gross_cents"
        difference: "applied_rate_micros is re-read from the PUBLISHED RateCard of (branch_id, currency_code) that is effective at authorized_at, NOT at the settle instant and NOT necessarily the card cited at quote time. When that card is the same row, settled_usd_gross_cents == quoted_usd_gross_cents."

  - name: transaction_commission_and_total
    trigger: "POST /exchange-transactions (QUOTE_PROVISIONAL) and POST /exchange-transactions/{id}/settle (SETTLEMENT_FINAL)"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. The tier is keyed on the TIER BASIS, never on the
      # total charge, even though the total charge is what the customer sees and
      # would land in a different band. Order is: (1) gross, (2) tier basis,
      # (3) tier rate, (4) commission, (5) total. Keying the tier on the total is
      # the wrong reading and produces different cents.
      gross = usd_gross_cents                       # step 1
      basis = tier_basis                            # step 2, see variants
      if basis < COMMISSION_TIER_1_CEILING_CENTS:        rate_bps = COMMISSION_TIER_1_BPS
      elif basis < COMMISSION_TIER_2_CEILING_CENTS:      rate_bps = COMMISSION_TIER_2_BPS
      else:                                              rate_bps = COMMISSION_TIER_3_BPS
      if rate_card.commission_schedule_code == "PREMIUM":
          rate_bps += COMMISSION_PREMIUM_UPLIFT_BPS     # step 3
      commission_cents = max(COMMISSION_MIN_CENTS,
                             round_half_up(gross * rate_bps / 10000))   # step 4
      if direction == "SELL_FX_TO_CUSTOMER":
          total_charge_cents = gross + commission_cents                 # step 5
      else:
          total_charge_cents = gross - commission_cents
    input_set: "One transaction plus, for the SETTLEMENT_FINAL variant, the customer's other SETTLED transactions at the same branch on the same UTC calendar day."
    constants:
      COMMISSION_TIER_1_CEILING_CENTS: 25000
      COMMISSION_TIER_2_CEILING_CENTS: 100000
      COMMISSION_TIER_1_BPS: 350
      COMMISSION_TIER_2_BPS: 250
      COMMISSION_TIER_3_BPS: 150
      COMMISSION_PREMIUM_UPLIFT_BPS: 50
      COMMISSION_MIN_CENTS: 400
    precision: "whole USD cents, round_half_up, floor of COMMISSION_MIN_CENTS applied AFTER rounding"
    variants:
      - name: QUOTE_PROVISIONAL
        when: "At POST /exchange-transactions; writes quoted_commission_cents and quoted_total_charge_cents"
        difference: "tier_basis = this transaction's own quoted_usd_gross_cents. Nothing else about the customer is consulted."
      - name: SETTLEMENT_FINAL
        when: "At POST /exchange-transactions/{id}/settle; writes settled_commission_cents, settled_total_charge_cents and price_adjustment_cents"
        difference: |
          tier_basis = this transaction's settled_usd_gross_cents PLUS the sum of
          settled_usd_gross_cents over the customer's other ExchangeTransaction
          rows with settlement_status == SETTLED, the same branch_id, and
          settled_at on the same UTC calendar day as this settlement (REVERSED and
          VOIDED rows excluded). A customer's earlier same-day settlements can
          therefore pull this deal into a cheaper tier while the gross is
          identical, and price_adjustment_cents = settled_total_charge_cents -
          quoted_total_charge_cents records the signed difference.

  - name: corridor_inventory_target
    trigger: "POST /inventory-plans/{id}/submit and POST /inventory-plans/{id}/review with decision APPROVE (writes computed_targets)"
    algorithm: constraint_propagation
    formula: |
      for line in plan.target_lines sorted by currency_code ASC:
          cp   = CurrencyProfile[line.currency_code]
          mid  = wholesale_rate_selection(line.currency_code)
          raw  = floor(line.baseline_daily_minor_units * plan.season_days
                       * corridor.demand_index_bps / 10000)
          if cp.currency_class == "MAJOR":
              class_cap = raw
          elif cp.currency_class == "EXOTIC":
              class_cap = min(raw, EXOTIC_PLAN_CAP_MINOR_UNITS)
          else:  # RESTRICTED
              class_cap = min(raw, cp.export_limit_minor_units * RESTRICTED_EXPORT_MULTIPLE)
          vault_cap = floor(branch.vault_limit_usd_cents * PLAN_VAULT_SHARE_BPS / 10000
                            * mid / 1000000)
          largest   = max(cp.standard_denominations)
          bounded   = max(largest, min(class_cap, vault_cap))
          target_minor_units = round_half_up(bounded / largest) * largest
    input_set: "Every entry of plan.target_lines, the plan's TravelCorridor row, the plan's Branch row, and the selected WholesaleRate per currency."
    constants:
      EXOTIC_PLAN_CAP_MINOR_UNITS: 5000000
      RESTRICTED_EXPORT_MULTIPLE: 2
      PLAN_VAULT_SHARE_BPS: 2500
    precision: "integer minor units; the final value is always a whole multiple of the currency's largest standard denomination, chosen by round_half_up on the multiple count"
    variants: []
    note: "Four independent inputs (baseline, season_days, demand index, vault limit) interact through a nested min/max with a branch on currency_class, so no single input dominates the result."

  - name: position_usd_equivalent
    trigger: "Any mutation of an InventoryPosition's denomination_mix (settlement, reversal, shipment arrival, note quarantine, note assessment, buyback redemption, position creation)"
    algorithm: aggregation
    formula: |
      total_minor_units       = sum(e.denomination_minor_units * e.available_note_count
                                    for e in denomination_mix)
      quarantined_minor_units = sum(e.denomination_minor_units * e.quarantined_note_count
                                    for e in denomination_mix)
      mid                     = wholesale_rate_selection(position.currency_code)
      usd_equivalent_cents    = round_half_up(total_minor_units * 1000000 / mid)
    input_set: "Every entry of the position's denomination_mix. quarantined and written_off notes are EXCLUDED from total_minor_units and therefore from vault valuation."
    constants: {}
    precision: "whole USD cents, round_half_up"
    variants: []
    note: "The invariant total_minor_units == sum(denomination_minor_units * available_note_count) MUST hold after every mutation; it is the conserved physical-cash quantity."

  - name: branch_vault_utilization_and_posture
    trigger: "End of any request that mutated an InventoryPosition of the branch"
    algorithm: threshold
    formula: |
      vault_usd_equivalent_cents = sum(p.usd_equivalent_cents
                                       for p in InventoryPosition
                                       if p.branch_id == branch.id and p.status == "OPEN")
      vault_utilization_bps = round_half_up(10000 * vault_usd_equivalent_cents
                                            / branch.vault_limit_usd_cents)
      if vault_utilization_bps > VAULT_FROZEN_MIN_BPS:        posture = "FROZEN"
      elif vault_utilization_bps >= VAULT_RESTRICTED_MIN_BPS: posture = "RESTRICTED"
      else:                                                   posture = "OPEN"
    input_set: "Only InventoryPosition rows of this branch with status == OPEN; CLOSED positions are excluded."
    constants:
      VAULT_RESTRICTED_MIN_BPS: 9000
      VAULT_FROZEN_MIN_BPS: 10000
    precision: "integer basis points, round_half_up"
    variants: []
    note: "Boundary is inclusive at both ends of the RESTRICTED band: exactly 9000 bps is RESTRICTED, exactly 10000 bps is RESTRICTED (not FROZEN), 10001 bps is FROZEN."

  - name: repatriation_surplus_manifest
    trigger: "Branch posture transition into RESTRICTED or FROZEN while repatriation_pending == false"
    algorithm: waterfall_allocation
    formula: |
      candidates = [p for p in InventoryPosition
                    if p.branch_id == branch.id and p.status == "OPEN"
                    and p.total_minor_units > 0]
      sort candidates by (usd_equivalent_cents DESC, created_at ASC)
      position = candidates[0]                     # empty -> no shipment is raised
      target_usd_cents  = branch.vault_usd_equivalent_cents
                          - round_half_up(branch.vault_limit_usd_cents
                                          * VAULT_TARGET_BPS / 10000)
      mid               = wholesale_rate_selection(position.currency_code)
      surplus_fx_minor  = floor(target_usd_cents * mid / 1000000)
      # Waterfall the surplus over the position's available denominations,
      # largest face value first; a denomination is only taken while whole notes
      # still fit inside the remaining surplus.
      remaining = surplus_fx_minor
      manifest  = []
      for e in position.denomination_mix sorted by denomination_minor_units DESC:
          take = min(e.available_note_count, floor(remaining / e.denomination_minor_units))
          if take > 0:
              manifest.append({denomination_minor_units: e.denomination_minor_units,
                               note_count: take})
              remaining -= take * e.denomination_minor_units
      # manifest is emitted ordered by denomination_minor_units ASC
    input_set: "OPEN positions of the branch with total_minor_units > 0; only available notes are eligible (quarantined and written-off notes never ship)."
    constants:
      VAULT_TARGET_BPS: 8500
    precision: "integer minor units; the surplus is always rounded DOWN to whole notes, so the manifest may be smaller than the theoretical surplus"
    variants: []
    note: "Selector is fully pinned: eligibility = OPEN and total_minor_units > 0; ranking = usd_equivalent_cents DESC; tie-break = created_at ASC; empty candidate set = no shipment raised and repatriation_pending stays false."

  - name: customer_structuring_aggregates
    trigger: "End of POST /exchange-transactions/{id}/settle and POST /exchange-transactions/{id}/reverse"
    algorithm: aggregation
    formula: |
      settled = [t for t in ExchangeTransaction
                 if t.customer_id == customer.id and t.settlement_status == "SETTLED"]
      # window depends on the variant
      in_window = [t for t in settled if window_start <= t.settled_at <= window_end]
      aggregate_usd_cents      = sum(t.settled_usd_gross_cents for t in in_window)
      near_threshold_txn_count = count(t in in_window
                                       if NEAR_THRESHOLD_FLOOR_CENTS <= t.settled_usd_gross_cents
                                       <= REPORT_THRESHOLD_CENTS - 1)
      distinct_branch_count    = count of distinct t.branch_id over in_window
    input_set: "Only rows with settlement_status == SETTLED. QUOTED, AUTHORIZED, VOIDED and REVERSED rows are excluded, which is why a reversal makes the aggregate fall back."
    constants:
      NEAR_THRESHOLD_FLOOR_CENTS: 800000
      REPORT_THRESHOLD_CENTS: 1000000
      ROLLING_WINDOW_DAYS: 30
    precision: "integer USD cents; counts are integers"
    variants:
      - name: ROLLING_30D
        when: "Writes Customer.rolling_30d_settled_usd_cents, near_threshold_txn_count and distinct_branch_count; this is the variant the live risk score consumes"
        difference: "window_start = logical_clock - 30 days, window_end = logical_clock. Both bounds inclusive."
      - name: CALENDAR_MONTH
        when: "Writes Customer.calendar_month_settled_usd_cents and the aggregate_usd_cents of a STRUCTURING_SUSPICION ComplianceReport"
        difference: "window_start = first instant of the UTC calendar month containing the logical clock, window_end = logical_clock. Settlements from the previous month are excluded, so this variant returns a strictly smaller aggregate than ROLLING_30D whenever the customer settled across a month boundary."

  - name: customer_structuring_risk_score
    trigger: "End of POST /exchange-transactions/{id}/settle and POST /exchange-transactions/{id}/reverse, immediately after customer_structuring_aggregates"
    algorithm: weighted_scoring
    formula: |
      volume_component     = min(VOLUME_COMPONENT_MAX,
                                 floor(VOLUME_COMPONENT_MAX
                                       * rolling_30d_settled_usd_cents
                                       / REPORT_THRESHOLD_CENTS))
      frequency_component  = min(FREQUENCY_COMPONENT_MAX,
                                 NEAR_THRESHOLD_POINTS * near_threshold_txn_count)
      dispersion_component = min(DISPERSION_COMPONENT_MAX,
                                 DISPERSION_POINTS * (distinct_branch_count - 1))
      structuring_risk_score = volume_component + frequency_component
                               + dispersion_component
      if score >= RISK_TIER_HIGH_MIN:          tier = "HIGH"
      elif score >= RISK_TIER_ELEVATED_MIN:    tier = "ELEVATED"
      else:                                    tier = "NORMAL"
    input_set: "Exactly the three ROLLING_30D aggregates written by customer_structuring_aggregates; no other source."
    constants:
      VOLUME_COMPONENT_MAX: 40
      FREQUENCY_COMPONENT_MAX: 35
      DISPERSION_COMPONENT_MAX: 25
      NEAR_THRESHOLD_POINTS: 11
      DISPERSION_POINTS: 12
      RISK_TIER_ELEVATED_MIN: 25
      RISK_TIER_HIGH_MIN: 70
    precision: "integer points; every component is floored individually and the components are summed afterwards, so no fractional drift accumulates"
    variants: []
    note: "distinct_branch_count == 0 (no settled transactions) yields dispersion_component = min(25, 12 * -1) = -12; the formula therefore clamps the dispersion component at 0 from below: dispersion_component = max(0, min(25, 12 * (distinct_branch_count - 1)))."

  - name: buyback_contract_pricing
    trigger: "POST /buyback-contracts"
    algorithm: threshold
    formula: |
      origin                 = ExchangeTransaction[request.origin_transaction_id]
      card                   = RateCard[origin.rate_card_id]
      locked_buy_rate_micros = card.buy_rate_micros
      locked_fx_minor_units  = origin.fx_gross_minor_units
      remaining_fx_minor_units = locked_fx_minor_units
      fee_usd_cents          = max(BUYBACK_FEE_MIN_CENTS,
                                   round_half_up(origin.settled_usd_gross_cents
                                                 * BUYBACK_FEE_BPS / 10000))
      liability_usd_cents    = round_half_up(remaining_fx_minor_units * 1000000
                                             / locked_buy_rate_micros)
      rate_lock_expires_at   = logical_clock + RATE_LOCK_DAYS days
    input_set: "The single origin transaction (which MUST have settlement_status == SETTLED and direction == SELL_FX_TO_CUSTOMER) and its rate card."
    constants:
      BUYBACK_FEE_BPS: 300
      BUYBACK_FEE_MIN_CENTS: 200
      RATE_LOCK_DAYS: 31
    precision: "whole USD cents, round_half_up"
    variants: []

  - name: buyback_liability_reconciliation
    trigger: "Any BuybackContract creation, redemption, cancellation or clock-driven expiry"
    algorithm: aggregation
    formula: |
      Branch.buyback_liability_usd_cents =
        sum(round_half_up(c.remaining_fx_minor_units * 1000000 / c.locked_buy_rate_micros)
            for c in BuybackContract
            if c.branch_id == branch.id
            and c.status IN {"ISSUED", "PARTIALLY_REDEEMED"})
    input_set: "Only contracts of this branch with status IN {ISSUED, PARTIALLY_REDEEMED}; REDEEMED, EXPIRED and CANCELLED contracts contribute nothing."
    constants: {}
    precision: "whole USD cents; each contract is rounded individually and the rounded values are summed"
    variants: []
    note: "This is the conserved monetary quantity: issuing a contract and then cancelling it with no redemption in between MUST return Branch.buyback_liability_usd_cents to the exact value it held before the issue."

  - name: damaged_note_recovery
    trigger: "POST /note-assessments/{id}/assess with outcome EXCHANGED_AT_DISCOUNT"
    algorithm: threshold
    formula: |
      # PINNED TWO-STEP ROUNDING: convert to USD cents and round, THEN apply the
      # recovery percentage and round again. Applying the percentage inside the
      # conversion is a different number.
      card             = the PUBLISHED RateCard for (branch_id, currency_code)
                          effective at the logical clock
      usd_face_cents   = round_half_up(assessment.face_fx_minor_units * 1000000
                                       / card.buy_rate_micros)
      recovery_usd_cents = round_half_up(usd_face_cents
                                         * CurrencyProfile.damaged_note_recovery_bps
                                         / 10000)
    input_set: "The one assessment row and the one effective PUBLISHED rate card of its branch and currency."
    constants: {}
    precision: "whole USD cents at each of the two steps, round_half_up"
    variants: []

  - name: shipment_manifest_valuation
    trigger: "POST /cash-shipments and the auto-generation of a REPATRIATION shipment"
    algorithm: aggregation
    formula: |
      manifest_minor_units = sum(e.denomination_minor_units * e.note_count
                                 for e in manifest_denominations)
      mid = wholesale_rate_selection(shipment.currency_code)
      manifest_usd_equivalent_cents = round_half_up(manifest_minor_units * 1000000 / mid)
    input_set: "Every entry of manifest_denominations, valued at the selected wholesale mid (never at a retail board rate)."
    constants: {}
    precision: "whole USD cents, round_half_up"
    variants: []

  - name: route_day_capacity_check
    trigger: "POST /cash-shipments/{id}/schedule"
    algorithm: aggregation
    formula: |
      day = the UTC calendar date of the requested window_start
      booked = sum(s.manifest_usd_equivalent_cents
                   for s in CashShipment
                   if s.armored_route_id == route.id
                   and s.status IN {"SCHEDULED", "IN_TRANSIT"}
                   and utc_date(s.window_start) == day
                   and s.id != this_shipment.id)
      if booked + this_shipment.manifest_usd_equivalent_cents
         > route.daily_capacity_usd_cents: raise ERR_ROUTE_CAPACITY_EXCEEDED
    input_set: "Shipments on the same route with status IN {SCHEDULED, IN_TRANSIT} whose window_start falls on the same UTC calendar date. DELIVERED, EXCEPTION, RECONCILED and REQUESTED shipments are excluded."
    constants:
      MIN_ROUTE_GAP_MINUTES: 45
    precision: "integer USD cents; the comparison is strictly greater-than, so booking exactly to capacity is permitted"
    variants: []
    note: "Window geometry is CLOSED [window_start, window_end] plus a mandatory MIN_ROUTE_GAP_MINUTES separation: a new window is accepted only when new.window_start >= other.window_end + 45 minutes or new.window_end + 45 minutes <= other.window_start. Back-to-back windows that merely touch are therefore REJECTED, unlike rate-card windows which are half-open and may touch."

validations:
  # ---- 1: authentication ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # ---- 2: authorization ----
  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the called endpoint's roles list. Evaluated before any path id is resolved, so an unauthorized role on a non-existent id still gets 403, never 404"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---- 3: existence of path and body references, left to right ----
  - priority: 3
    category: existence
    check: "Every id in the request path resolves to a live row, checked left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND (ERR_BRANCH_NOT_FOUND, ERR_RATE_CARD_NOT_FOUND, ERR_POSITION_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_TRANSACTION_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND)"
    http_status: 404
    applies_to: "every endpoint carrying a path id"
  - priority: 3
    category: existence
    check: "Every FK field in the request body resolves to a live row, checked in declaration order of the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND (ERR_BRANCH_NOT_FOUND, ERR_CORRIDOR_NOT_FOUND, ERR_ROUTE_NOT_FOUND, ERR_WHOLESALE_RATE_NOT_FOUND, ERR_RATE_CARD_NOT_FOUND, ERR_POSITION_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_TRANSACTION_NOT_FOUND)"
    http_status: 404
    applies_to: "every endpoint whose input carries an FK field"
  - priority: 3
    category: existence
    check: "Every currency_code in the request body (including each target_lines[].currency_code) equals an existing CurrencyProfile.iso_code"
    error_id: ERR_CURRENCY_NOT_FOUND
    http_status: 404
    applies_to: "POST /wholesale-rates, POST /travel-corridors, POST /rate-cards, POST /inventory-positions, POST /inventory-plans, POST /inventory-plans/{id}/submit, POST /exchange-transactions, POST /cash-shipments"

  # ---- 4: request body well-formedness ----
  - priority: 4
    category: business_constraint
    check: "Required input fields present; enums inside their declared domain; integers inside their declared range; arrays non-empty where required and free of duplicate denominations; effective_to strictly after effective_from; season_end_date strictly after season_start_date; window_end strictly after window_start; export_limit_minor_units non-null exactly when currency_class == RESTRICTED; id_document_number and id_document_expiry present exactly when id_document_type is present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  # ---- 5: state preconditions on the target row ----
  - priority: 5
    category: state
    check: "The target row is in a state the requested transition leaves from, per §1.2"
    error_id: "ERR_RATE_CARD_NOT_DRAFT | ERR_PLAN_INVALID_STATE | ERR_TRANSACTION_NOT_QUOTED | ERR_TRANSACTION_NOT_AUTHORIZED | ERR_TRANSACTION_NOT_SETTLED | ERR_TRANSACTION_NOT_VOIDABLE | ERR_CONTRACT_NOT_REDEEMABLE | ERR_CONTRACT_NOT_CANCELLABLE | ERR_ASSESSMENT_ALREADY_ASSESSED | ERR_REPORT_INVALID_STATE | ERR_SHIPMENT_INVALID_STATE | ERR_COMPLIANCE_DECISION_FINAL"
    http_status: 409
    applies_to: "every state-transition endpoint"
  - priority: 5
    category: state
    check: "Cross-row uniqueness that behaves as a state precondition: at most one BuybackContract per origin transaction; at most one InventoryPosition per (branch_id, currency_code); Branch.code unique"
    error_id: "ERR_CONTRACT_ALREADY_ISSUED | ERR_POSITION_ALREADY_EXISTS | ERR_DUPLICATE_BRANCH_CODE"
    http_status: 409
    applies_to: "POST /buyback-contracts, POST /inventory-positions, POST /branches"

  # ---- 6: optimistic concurrency on the parent version ----
  - priority: 6
    category: state
    check: "expected_branch_version equals the current Branch.version (POST /rate-cards); expected_customer_version equals the current Customer.version (POST /buyback-contracts). Checked after the parent row is known to exist and after the target-state checks, so a stale version on an already-superseded parent still reports the state error first"
    error_id: "ERR_STALE_BRANCH_VERSION | ERR_STALE_CUSTOMER_VERSION"
    http_status: 412
    applies_to: "POST /rate-cards, POST /buyback-contracts"

  # ---- 7: branch posture gates (derived cross-entity state) ----
  - priority: 7
    category: state
    check: "Branch.status == ACTIVE"
    error_id: ERR_BRANCH_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /exchange-transactions, POST /exchange-transactions/{id}/authorize, POST /rate-cards, POST /inventory-plans"
  - priority: 7
    category: state
    check: "Branch.posture != FROZEN"
    error_id: ERR_BRANCH_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /exchange-transactions/{id}/authorize, POST /exchange-transactions/{id}/settle, POST /inventory-plans/{id}/activate, POST /buyback-contracts/{id}/redeem"
  - priority: 7
    category: state
    check: "Branch.posture != RESTRICTED when the operation would ADD foreign cash to the vault (direction == BUY_FX_FROM_CUSTOMER, or a REPLENISHMENT shipment)"
    error_id: ERR_BRANCH_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /exchange-transactions/{id}/authorize, POST /cash-shipments"

  # ---- 8: compliance and identification safety ----
  - priority: 8
    category: business_safety
    check: "The customer has a complete identification document on file (id_document_type, id_document_number and id_document_expiry all non-null) whenever quoted_usd_gross_cents >= ID_REQUIRED_CENTS (100000)"
    error_id: ERR_CUSTOMER_ID_REQUIRED
    http_status: 422
    applies_to: "POST /exchange-transactions/{id}/authorize"
  - priority: 8
    category: business_safety
    check: "Whenever the customer has an id_document_expiry on file it MUST be strictly after the logical clock; an expired document blocks authorization at every amount, independently of ID_REQUIRED_CENTS"
    error_id: ERR_CUSTOMER_ID_EXPIRED
    http_status: 422
    applies_to: "POST /exchange-transactions/{id}/authorize"
  - priority: 8
    category: business_safety
    check: "Customer.compliance_hold_active == false"
    error_id: ERR_CUSTOMER_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "POST /exchange-transactions/{id}/authorize, POST /buyback-contracts"
  - priority: 8
    category: business_safety
    check: "ExchangeTransaction.compliance_status != BLOCKED"
    error_id: ERR_TRANSACTION_COMPLIANCE_BLOCKED
    http_status: 409
    applies_to: "POST /exchange-transactions/{id}/settle, POST /exchange-transactions/{id}/reverse"
  - priority: 8
    category: business_safety
    check: "A compliance-hold RELEASE is refused while the customer still has a STRUCTURING_SUSPICION ComplianceReport with status IN {DRAFT, AMENDING}"
    error_id: ERR_STRUCTURING_REPORT_PENDING
    http_status: 409
    applies_to: "POST /customers/{id}/compliance-hold"
  - priority: 8
    category: business_safety
    check: "Selling a RESTRICTED-class currency requires Customer.travel_document_reference to be non-null"
    error_id: ERR_RESTRICTED_CURRENCY_DOC_REQUIRED
    http_status: 422
    applies_to: "POST /exchange-transactions/{id}/authorize"

  # ---- 9: segregation of duties ----
  - priority: 9
    category: business_safety
    check: "X-User-ID differs from the user who performed the previous step of the same workflow: a plan reviewer cannot be its submitter; a settling teller cannot be the authorizing user once the deal is large"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_DUAL_CONTROL_REQUIRED"
    http_status: 403
    applies_to: "POST /inventory-plans/{id}/review (ERR_SEGREGATION_OF_DUTIES), POST /exchange-transactions/{id}/settle (ERR_DUAL_CONTROL_REQUIRED when settled_usd_gross_cents >= DUAL_CONTROL_THRESHOLD_CENTS)"

  # ---- 10: temporal windows ----
  - priority: 10
    category: business_temporal
    check: "logical clock <= ExchangeTransaction.quote_expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /exchange-transactions/{id}/authorize"
  - priority: 10
    category: business_temporal
    check: "logical clock <= ExchangeTransaction.settled_at + REVERSAL_WINDOW_HOURS (24)"
    error_id: ERR_REVERSAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /exchange-transactions/{id}/reverse"
  - priority: 10
    category: business_temporal
    check: "Publishing a card must not intersect another PUBLISHED card for the same (branch_id, currency_code); windows are HALF-OPEN [effective_from, effective_to) so touching endpoints are accepted"
    error_id: ERR_RATE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /rate-cards/{id}/publish"
  - priority: 10
    category: business_temporal
    check: "A shipment window must be separated from every other {SCHEDULED, IN_TRANSIT} window on the same route by at least MIN_ROUTE_GAP_MINUTES (45); windows are CLOSED [window_start, window_end] so touching windows are REJECTED"
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /cash-shipments/{id}/schedule"
  - priority: 10
    category: business_temporal
    check: "logical clock >= CashShipment.window_start before dispatch; TravelCorridor.season_start_date <= clock < season_end_date before plan activation"
    error_id: "ERR_SHIPMENT_WINDOW_NOT_OPEN | ERR_PLAN_OUTSIDE_SEASON"
    http_status: 409
    applies_to: "POST /cash-shipments/{id}/dispatch, POST /inventory-plans/{id}/activate"

  # ---- 11: business constraints ----
  - priority: 11
    category: business_constraint
    check: "fx_gross_minor_units <= CurrencyProfile.export_limit_minor_units for a RESTRICTED-class currency sold to a customer"
    error_id: ERR_EXPORT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /exchange-transactions/{id}/authorize"
  - priority: 11
    category: business_constraint
    check: "Selling an EXOTIC-class currency requires an ACTIVE InventoryPlan at this branch whose computed_targets contain the currency"
    error_id: ERR_EXOTIC_PLAN_REQUIRED
    http_status: 422
    applies_to: "POST /exchange-transactions/{id}/authorize"
  - priority: 11
    category: business_constraint
    check: "A card may only be published when disclosure_text_version >= MIN_DISCLOSURE_TEXT_VERSION (3)"
    error_id: ERR_DISCLOSURE_VERSION_UNSUPPORTED
    http_status: 422
    applies_to: "POST /rate-cards/{id}/publish"
  - priority: 11
    category: business_constraint
    check: "A submitted plan must carry at least one target line; the currency being bought back must be buyback_eligible and its origin transaction SETTLED with direction SELL_FX_TO_CUSTOMER; a redemption must not exceed remaining_fx_minor_units; a route must be ACTIVE and serve the branch's region"
    error_id: "ERR_PLAN_NO_TARGET_LINES | ERR_BUYBACK_NOT_ELIGIBLE | ERR_REDEEM_EXCEEDS_REMAINING | ERR_ROUTE_SUSPENDED | ERR_ROUTE_BRANCH_NOT_SERVICED | ERR_OUTCOME_NOT_PERMITTED_FOR_DEFECT | ERR_BUYBACK_BLOCKS_REVERSAL"
    http_status: 422
    applies_to: "POST /inventory-plans/{id}/submit, POST /buyback-contracts, POST /buyback-contracts/{id}/redeem, POST /cash-shipments/{id}/schedule, POST /note-assessments/{id}/assess, POST /exchange-transactions/{id}/reverse"

  # ---- 12: referential currency of the rate board ----
  - priority: 12
    category: business_referential
    check: "The RateCard the operation depends on has status == PUBLISHED"
    error_id: ERR_RATE_CARD_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /exchange-transactions, POST /buyback-contracts/{id}/redeem, POST /note-assessments/{id}/assess"
  - priority: 12
    category: business_referential
    check: "The RateCard's half-open window covers the instant the operation reads it: effective_from <= instant < effective_to (null effective_to means +infinity). At quote time the instant is the logical clock; at settlement the instant is authorized_at"
    error_id: ERR_RATE_CARD_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /exchange-transactions, POST /exchange-transactions/{id}/settle, POST /buyback-contracts/{id}/redeem, POST /note-assessments/{id}/assess"

  # ---- 13: fiscal capacity, evaluated last ----
  - priority: 13
    category: business_fiscal
    check: "Every requested denomination exists on the branch InventoryPosition for the currency"
    error_id: ERR_DENOMINATION_NOT_STOCKED
    http_status: 422
    applies_to: "POST /exchange-transactions/{id}/settle"
  - priority: 13
    category: business_fiscal
    check: "available_note_count >= requested note_count for every requested denomination (SELL_FX_TO_CUSTOMER)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "POST /exchange-transactions/{id}/settle"
  - priority: 13
    category: business_fiscal
    check: "The post-credit Branch.vault_usd_equivalent_cents must not exceed Branch.vault_limit_usd_cents when cash is being added (BUY_FX_FROM_CUSTOMER settlement, buyback redemption, REPLENISHMENT arrival)"
    error_id: ERR_VAULT_LIMIT_WOULD_EXCEED
    http_status: 422
    applies_to: "POST /exchange-transactions/{id}/settle, POST /buyback-contracts/{id}/redeem"
  - priority: 13
    category: business_fiscal
    check: "The summed manifest_usd_equivalent_cents of all {SCHEDULED, IN_TRANSIT} shipments on the route whose window_start falls on the requested UTC calendar day, including this shipment, must not exceed ArmoredRoute.daily_capacity_usd_cents. Individually-legal shipments can violate this collectively"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /cash-shipments/{id}/schedule"

  # ---- Pinned priority-conflict pairs. Each pair is a DIFFERENT error-category
  # ---- combination and BOTH rules of a pair apply to the SAME endpoint, so a
  # ---- single request can violate both and the higher-priority error must win.
  # (i)   POST /exchange-transactions/{id}/settle:
  #       state (5) ERR_TRANSACTION_NOT_AUTHORIZED  beats  business_fiscal (13) ERR_INSUFFICIENT_INVENTORY
  # (ii)  POST /exchange-transactions/{id}/authorize:
  #       business_safety (8) ERR_CUSTOMER_ID_EXPIRED  beats  business_constraint (11) ERR_EXPORT_LIMIT_EXCEEDED
  # (iii) POST /cash-shipments/{id}/schedule:
  #       business_temporal (10) ERR_ROUTE_WINDOW_CONFLICT  beats  business_fiscal (13) ERR_ROUTE_CAPACITY_EXCEEDED

endpoints:
  # ================= test-driving surface =================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every window, expiry and aggregation rule in this scaffold reads. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Advancing the clock also sweeps BuybackContract rows whose rate_lock_expires_at is now in the past into EXPIRED and recomputes Branch.buyback_liability_usd_cents for every affected branch."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, expired_contract_count: integer }"
    side_effects:
      - "logical clock := current_utc"
      - "BuybackContract ISSUED|PARTIALLY_REDEEMED -> EXPIRED for every contract with rate_lock_expires_at < current_utc"
      - "Branch.buyback_liability_usd_cents recomputed by calculations.buyback_liability_reconciliation for every branch that had a contract expire"

  # ================= Branch =================
  - method: POST
    path: "/branches"
    description: "Registers a retail exchange branch with its vault ceiling."
    roles: [PlatformAdmin]
    code: 201
    input: ["code", "name", "region_code", "vault_limit_usd_cents", "home_currency_code?", "status?"]
    output: Branch
    side_effects:
      - "Branch created with posture OPEN, vault_usd_equivalent_cents 0, vault_utilization_bps 0, buyback_liability_usd_cents 0, repatriation_pending false, version 1"
  - method: GET
    path: "/branches/{id}"
    description: "Reads one branch including its derived vault utilization, posture and buyback liability."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: []
    output: Branch
    side_effects: []
  - method: GET
    path: "/branches"
    description: "Lists branches, filterable by region and derived posture."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, ComplianceOfficer]
    code: 200
    input: ["region_code?", "status?", "posture?", "limit?", "offset?"]
    output: Branch[]
    side_effects: []
  - method: GET
    path: "/branches/{id}/rate-board"
    description: "Computed read: the branch's physical rate board as it must be displayed at the current logical clock. Returns one line per currency whose PUBLISHED RateCard window covers the clock, plus the disclosure text version being displayed."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, Customer]
    code: 200
    input: ["currency_code?"]
    output: "{ branch_id: string, as_of: datetime, line_count: integer, min_disclosure_text_version: integer, lines: object[] }"
    side_effects: []

  # ================= CurrencyProfile =================
  - method: POST
    path: "/currencies"
    description: "Registers an ISO 4217 currency profile: handling class, note denominations, export cap, buyback eligibility and damaged-note recovery rate."
    roles: [PlatformAdmin]
    code: 201
    input: ["iso_code", "display_name", "minor_unit_digits", "currency_class", "standard_denominations", "export_limit_minor_units?", "buyback_eligible?", "damaged_note_recovery_bps?"]
    output: CurrencyProfile
    side_effects:
      - "CurrencyProfile created; iso_code becomes the natural key every currency_code field resolves against"
  - method: GET
    path: "/currencies/{id}"
    description: "Reads one currency profile by its ISO 4217 code."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: CurrencyProfile
    side_effects: []
  - method: GET
    path: "/currencies"
    description: "Lists currency profiles, filterable by handling class."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer, Customer]
    code: 200
    input: ["currency_class?", "buyback_eligible?", "limit?", "offset?"]
    output: CurrencyProfile[]
    side_effects: []

  # ================= WholesaleRate =================
  - method: POST
    path: "/wholesale-rates"
    description: "Records a wholesale mid-rate quote for a currency, effective from a stated instant. Immutable once written; a new quote is a new row."
    roles: [TreasuryOfficer]
    code: 201
    input: [currency_code, mid_rate_micros, effective_at, source_code]
    output: WholesaleRate
    side_effects:
      - "WholesaleRate created; it becomes eligible for calculations.wholesale_rate_selection once the logical clock reaches effective_at"
  - method: GET
    path: "/wholesale-rates/{id}"
    description: "Reads one wholesale rate quote."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: []
    output: WholesaleRate
    side_effects: []
  - method: GET
    path: "/wholesale-rates"
    description: "Lists wholesale rate quotes for a currency, newest effective_at first."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: ["currency_code?", "source_code?", "limit?", "offset?"]
    output: WholesaleRate[]
    side_effects: []

  # ================= TravelCorridor =================
  - method: POST
    path: "/travel-corridors"
    description: "Registers an origin/destination travel corridor for a planning season with its seasonal demand index."
    roles: [TreasuryOfficer]
    code: 201
    input: [code, origin_country_code, destination_country_code, destination_currency_code, season, season_start_date, season_end_date, demand_index_bps]
    output: TravelCorridor
    side_effects: []
  - method: GET
    path: "/travel-corridors/{id}"
    description: "Reads one travel corridor."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: []
    output: TravelCorridor
    side_effects: []
  - method: GET
    path: "/travel-corridors"
    description: "Lists travel corridors, filterable by season and destination currency."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: ["season?", "destination_currency_code?", "limit?", "offset?"]
    output: TravelCorridor[]
    side_effects: []

  # ================= ArmoredRoute =================
  - method: POST
    path: "/armored-routes"
    description: "Registers an armored-transport route with its service region and per-UTC-day carrying capacity."
    roles: [PlatformAdmin]
    code: 201
    input: ["code", "carrier_name", "region_code", "daily_capacity_usd_cents", "status?"]
    output: ArmoredRoute
    side_effects: []
  - method: GET
    path: "/armored-routes/{id}"
    description: "Reads one armored route."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: []
    output: ArmoredRoute
    side_effects: []
  - method: GET
    path: "/armored-routes"
    description: "Lists armored routes, filterable by region and status."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: ArmoredRoute[]
    side_effects: []

  # ================= RateCard =================
  - method: POST
    path: "/rate-cards"
    description: "Drafts a branch rate-board line for one currency, deriving buy_rate_micros and sell_rate_micros from the cited wholesale quote and the two spreads. Reserve-and-truncate: when the branch already has an open-ended PUBLISHED card for the same currency, that incumbent is truncated to this card's effective_from and moved to SUPERSEDED, so the call carries expected_branch_version for optimistic concurrency."
    roles: [TreasuryOfficer]
    code: 201
    input: ["branch_id", "currency_code", "wholesale_rate_id", "buy_spread_bps", "sell_spread_bps", "board_display_label", "disclosure_text_version", "effective_from", "expected_branch_version", "commission_schedule_code?", "effective_to?"]
    output: RateCard
    side_effects:
      - "RateCard created in DRAFT with buy_rate_micros and sell_rate_micros written by calculations.rate_card_derivation"
      - "Any incumbent open-ended PUBLISHED card for the same (branch_id, currency_code) is truncated: effective_to := this card's effective_from, status := SUPERSEDED, superseded_by_rate_card_id := this card's id"
      - "increments Branch.version by 1"
  - method: POST
    path: "/rate-cards/{id}/publish"
    description: "Publishes a DRAFT rate card onto the branch board after the disclosure-version and window-overlap checks pass."
    roles: [TreasuryOfficer]
    code: 200
    input: []
    output: RateCard
    side_effects:
      - "RateCard DRAFT -> PUBLISHED; published_at := logical clock"
      - "The card starts appearing on GET /branches/{id}/rate-board while the clock is inside its half-open window"
  - method: GET
    path: "/rate-cards/{id}"
    description: "Reads one rate card including its derived retail rates and supersession pointer."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: []
    output: RateCard
    side_effects: []
  - method: GET
    path: "/rate-cards"
    description: "Lists rate cards; the filtered-list reverse lookup for RateCard.branch_id, RateCard.wholesale_rate_id and RateCard.superseded_by_rate_card_id."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: ["branch_id?", "currency_code?", "wholesale_rate_id?", "superseded_by_rate_card_id?", "status?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  # ================= InventoryPosition =================
  - method: POST
    path: "/inventory-positions"
    description: "Opens the branch's stock record for one currency and seeds its opening note mix. Exactly one position may exist per (branch_id, currency_code). Creating a position immediately revalues the branch vault and may move Branch.posture."
    roles: [BranchManager, TreasuryOfficer]
    code: 201
    input: [branch_id, currency_code, opening_denomination_mix]
    output: InventoryPosition
    side_effects:
      - "InventoryPosition created in OPEN with denomination_mix seeded from opening_denomination_mix (each entry becomes { denomination_minor_units, available_note_count, quarantined_note_count: 0, written_off_note_count: 0 })"
      - "total_minor_units, quarantined_minor_units and usd_equivalent_cents written by calculations.position_usd_equivalent"
      - "Branch.vault_usd_equivalent_cents, vault_utilization_bps and posture recomputed by calculations.branch_vault_utilization_and_posture; a posture arrival at RESTRICTED or FROZEN raises an auto_generated REPATRIATION CashShipment"
      - "increments Branch.version by 1"
  - method: GET
    path: "/inventory-positions/{id}"
    description: "Reads one inventory position with its full denomination mix and USD valuation."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller]
    code: 200
    input: []
    output: InventoryPosition
    side_effects: []
  - method: GET
    path: "/inventory-positions"
    description: "Lists inventory positions; the filtered-list reverse lookup for InventoryPosition.branch_id."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller]
    code: 200
    input: ["branch_id?", "currency_code?", "status?", "limit?", "offset?"]
    output: InventoryPosition[]
    side_effects: []

  # ================= InventoryPlan =================
  - method: POST
    path: "/inventory-plans"
    description: "Drafts a seasonal currency-stocking plan for a branch against a travel corridor. target_lines may be left empty at creation and filled on submit."
    roles: [BranchManager]
    code: 201
    input: ["branch_id", "travel_corridor_id", "season_days", "target_lines?"]
    output: InventoryPlan
    side_effects:
      - "InventoryPlan created in DRAFT with computed_targets empty and revision_count 0"
  - method: POST
    path: "/inventory-plans/{id}/submit"
    description: "Submits a DRAFT plan for treasury review, optionally replacing its target_lines, and computes the per-currency targets."
    roles: [BranchManager]
    code: 200
    input: ["target_lines?"]
    output: InventoryPlan
    side_effects:
      - "InventoryPlan DRAFT -> SUBMITTED; submitted_by_user_id := X-User-ID"
      - "target_lines replaced when the request supplies them"
      - "computed_targets written by calculations.corridor_inventory_target"
  - method: POST
    path: "/inventory-plans/{id}/review"
    description: "Treasury review of a SUBMITTED plan. APPROVE moves it to APPROVED; REJECT returns it to DRAFT and bumps revision_count. The reviewer's X-User-ID must differ from the submitter's."
    roles: [TreasuryOfficer]
    code: 200
    input: ["decision", "review_note?"]
    output: InventoryPlan
    side_effects:
      - "decision APPROVE: status := APPROVED and computed_targets recomputed by calculations.corridor_inventory_target"
      - "decision REJECT: status := DRAFT and revision_count += 1"
      - "reviewed_by_user_id := X-User-ID; review_note stored"
  - method: POST
    path: "/inventory-plans/{id}/activate"
    description: "Activates an APPROVED plan for the branch. Activation is what makes an EXOTIC-class currency sellable at the branch."
    roles: [BranchManager]
    code: 200
    input: []
    output: InventoryPlan
    side_effects:
      - "InventoryPlan APPROVED -> ACTIVE"
      - "EXOTIC-class currencies present in computed_targets become sellable at this branch"
  - method: GET
    path: "/inventory-plans/{id}"
    description: "Reads one inventory plan with its computed per-currency targets."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: []
    output: InventoryPlan
    side_effects: []
  - method: GET
    path: "/inventory-plans"
    description: "Lists inventory plans; the filtered-list reverse lookup for InventoryPlan.branch_id and InventoryPlan.travel_corridor_id."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: ["branch_id?", "travel_corridor_id?", "status?", "limit?", "offset?"]
    output: InventoryPlan[]
    side_effects: []

  # ================= Customer =================
  - method: POST
    path: "/customers"
    description: "On-boards a retail customer with optional identification and travel documents. Identification completeness is only enforced later, at authorization time, and only above ID_REQUIRED_CENTS."
    roles: [BranchTeller, BranchManager]
    code: 201
    input: ["full_name", "nationality_code", "home_branch_id?", "id_document_type?", "id_document_number?", "id_document_expiry?", "travel_document_reference?"]
    output: Customer
    side_effects:
      - "Customer created with structuring_risk_tier NORMAL, all aggregates 0, compliance_hold_active false, version 1"
  - method: POST
    path: "/customers/{id}/compliance-hold"
    description: "Applies or releases a compliance hold on a customer. A RELEASE is refused while the customer still has a STRUCTURING_SUSPICION ComplianceReport in DRAFT or AMENDING."
    roles: [ComplianceOfficer]
    code: 200
    input: ["action", "reason?"]
    output: Customer
    side_effects:
      - "action APPLY: Customer.compliance_hold_active := true"
      - "action RELEASE: Customer.compliance_hold_active := false"
      - "increments Customer.version by 1"
  - method: GET
    path: "/customers/{id}"
    description: "Reads one customer including both structuring aggregate variants, the risk score, the derived tier and the hold flag."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers"
    description: "Lists customers; the filtered-list reverse lookup for Customer.home_branch_id."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: ["home_branch_id?", "structuring_risk_tier?", "compliance_hold_active?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # ================= ExchangeTransaction =================
  - method: POST
    path: "/exchange-transactions"
    description: "Quotes an exchange deal against a specific PUBLISHED, currently-effective rate-board line. Computes the provisional gross, commission and total charge and stamps a 15-minute quote expiry. No cash and no compliance aggregate moves at this point."
    roles: [BranchTeller, BranchManager]
    code: 201
    input: [branch_id, customer_id, rate_card_id, currency_code, direction, requested_denominations]
    output: ExchangeTransaction
    side_effects:
      - "ExchangeTransaction created with settlement_status QUOTED and compliance_status PENDING"
      - "fx_gross_minor_units written by calculations.transaction_fx_gross; applied_rate_micros taken from the cited card by direction"
      - "quoted_usd_gross_cents written by the QUOTE_PROVISIONAL variant of calculations.transaction_usd_conversion"
      - "quoted_commission_cents and quoted_total_charge_cents written by the QUOTE_PROVISIONAL variant of calculations.transaction_commission_and_total"
      - "quote_expires_at := logical clock + QUOTE_TTL_MINUTES (15); quoted_by_user_id := X-User-ID"
  - method: POST
    path: "/exchange-transactions/{id}/authorize"
    description: "Authorizes a QUOTED deal after the identification, compliance, posture, export-limit and exotic-plan gates pass. Fixes authorized_at, which is the instant the settlement re-reads the rate board at."
    roles: [BranchTeller, BranchManager]
    code: 200
    input: []
    output: ExchangeTransaction
    side_effects:
      - "settlement_status QUOTED -> AUTHORIZED; authorized_at := logical clock; authorized_by_user_id := X-User-ID"
      - "compliance_status PENDING -> FLAGGED when Customer.structuring_risk_tier == HIGH (axis B moves without touching axis A)"
      - "No inventory movement"
  - method: POST
    path: "/exchange-transactions/{id}/settle"
    description: "Settles an AUTHORIZED deal: re-prices it at the rate card effective at authorized_at, re-tiers the commission on the customer's same-branch same-UTC-day settled volume, moves the notes, revalues the vault and re-scores the customer for structuring."
    roles: [BranchTeller, BranchManager]
    code: 200
    input: []
    output: ExchangeTransaction
    side_effects:
      - "settled_usd_gross_cents written by the SETTLEMENT_FINAL variant of calculations.transaction_usd_conversion"
      - "settled_commission_cents, settled_total_charge_cents and price_adjustment_cents written by the SETTLEMENT_FINAL variant of calculations.transaction_commission_and_total"
      - "settlement_status AUTHORIZED -> SETTLED; settled_at := logical clock; settled_by_user_id := X-User-ID"
      - "InventoryPosition denomination_mix debited (SELL) or credited (BUY), then total_minor_units and usd_equivalent_cents recomputed"
      - "Branch.vault_usd_equivalent_cents, vault_utilization_bps and posture recomputed; a posture arrival at RESTRICTED or FROZEN raises an auto_generated REPATRIATION CashShipment and sets repatriation_pending"
      - "Customer.rolling_30d_settled_usd_cents, calendar_month_settled_usd_cents, near_threshold_txn_count, distinct_branch_count, structuring_risk_score and structuring_risk_tier recomputed"
      - "A HIGH tier arrival creates a STRUCTURING_SUSPICION ComplianceReport in DRAFT and that creation sets Customer.compliance_hold_active := true"
      - "settled_usd_gross_cents >= REPORT_THRESHOLD_CENTS (1000000) creates a THRESHOLD_REPORT ComplianceReport in DRAFT"
      - "increments Branch.version by 1 and Customer.version by 1"
  - method: POST
    path: "/exchange-transactions/{id}/void"
    description: "Voids a deal that has not settled. Terminal, with no inventory, aggregate or reporting effect."
    roles: [BranchTeller, BranchManager]
    code: 200
    input: ["void_reason?"]
    output: ExchangeTransaction
    side_effects:
      - "settlement_status QUOTED|AUTHORIZED -> VOIDED"
  - method: POST
    path: "/exchange-transactions/{id}/reverse"
    description: "Reverses a SETTLED deal inside the 24-hour reversal window, compensating every side effect the settlement produced: the notes go back, the vault is revalued, the customer leaves both aggregation windows and is re-scored, and any DRAFT threshold report is withdrawn."
    roles: [BranchManager]
    code: 200
    input: ["reversal_reason?"]
    output: ExchangeTransaction
    side_effects:
      - "settlement_status SETTLED -> REVERSED; reversed_at := logical clock"
      - "InventoryPosition denomination_mix restored to its pre-settlement counts; total_minor_units and usd_equivalent_cents recomputed"
      - "Branch.vault_usd_equivalent_cents, vault_utilization_bps and posture recomputed"
      - "Customer aggregates, structuring_risk_score and structuring_risk_tier recomputed; compliance_hold_active is deliberately NOT cleared"
      - "Any DRAFT THRESHOLD_REPORT whose triggering_transaction_id is this transaction is deleted; FILED and AMENDING reports are retained"
      - "increments Branch.version by 1 and Customer.version by 1"
  - method: POST
    path: "/exchange-transactions/{id}/compliance-decision"
    description: "Records a compliance decision on axis B of the transaction (CLEAR, FLAG or BLOCK) without touching the settlement axis."
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "decision_note?"]
    output: ExchangeTransaction
    side_effects:
      - "compliance_status advances per the ExchangeTransaction axis-B transitions"
      - "A BLOCK bars any later settle or reverse call on this row"
  - method: GET
    path: "/exchange-transactions/{id}"
    description: "Reads one transaction with both quoted and settled money fields, the signed price adjustment and both status axes."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: []
    output: ExchangeTransaction
    side_effects: []
  - method: GET
    path: "/exchange-transactions"
    description: "Lists transactions; the filtered-list reverse lookup for ExchangeTransaction.branch_id, customer_id, rate_card_id and buyback_contract_id."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: ["branch_id?", "customer_id?", "rate_card_id?", "buyback_contract_id?", "settlement_status?", "compliance_status?", "direction?", "limit?", "offset?"]
    output: ExchangeTransaction[]
    side_effects: []

  # ================= BuybackContract =================
  - method: POST
    path: "/buyback-contracts"
    description: "Issues a buy-back guarantee against a SETTLED sell deal, freezing the branch's current buy rate for RATE_LOCK_DAYS. Issuance supersedes any incumbent contract the customer holds in the same currency, so the call carries expected_customer_version for optimistic concurrency."
    roles: [BranchTeller, BranchManager]
    code: 201
    input: [customer_id, origin_transaction_id, expected_customer_version]
    output: BuybackContract
    side_effects:
      - "BuybackContract created in ISSUED with branch_id, currency_code, locked_buy_rate_micros, locked_fx_minor_units, remaining_fx_minor_units, fee_usd_cents, liability_usd_cents and rate_lock_expires_at written by calculations.buyback_contract_pricing"
      - "The origin ExchangeTransaction.buyback_contract_id := this contract's id, which bars that transaction from being reversed"
      - "Any incumbent {ISSUED, PARTIALLY_REDEEMED} contract of the same (customer_id, currency_code) is CANCELLED with superseded_by_contract_id := this contract's id, and its own origin transaction's buyback_contract_id is reset to null"
      - "Branch.buyback_liability_usd_cents recomputed by calculations.buyback_liability_reconciliation"
      - "increments Customer.version by 1"
  - method: POST
    path: "/buyback-contracts/{id}/redeem"
    description: "Buys notes back from the customer at the LOCKED rate, not at today's board rate. Partial redemptions loop on PARTIALLY_REDEEMED until the notional is exhausted."
    roles: [BranchTeller]
    code: 200
    input: [returned_denominations]
    output: BuybackContract
    side_effects:
      - "remaining_fx_minor_units decremented by the returned note value; redemption_count += 1; status := PARTIALLY_REDEEMED or REDEEMED"
      - "liability_usd_cents recomputed from the new remaining_fx_minor_units; Branch.buyback_liability_usd_cents recomputed"
      - "The branch InventoryPosition for the currency is credited with the returned notes, then position and Branch vault fields and Branch.posture are recomputed"
      - "increments Branch.version by 1"
  - method: POST
    path: "/buyback-contracts/{id}/cancel"
    description: "Cancels a live rate lock. Already-redeemed notes are not clawed back, the origin transaction becomes reversible again, and the branch's buyback liability returns to its pre-issue value."
    roles: [BranchManager, TreasuryOfficer]
    code: 200
    input: ["cancellation_reason?"]
    output: BuybackContract
    side_effects:
      - "status ISSUED|PARTIALLY_REDEEMED -> CANCELLED; remaining_fx_minor_units := 0; liability_usd_cents := 0"
      - "The origin ExchangeTransaction.buyback_contract_id is reset to null"
      - "Branch.buyback_liability_usd_cents recomputed by calculations.buyback_liability_reconciliation"
  - method: GET
    path: "/buyback-contracts/{id}"
    description: "Reads one buy-back contract with its locked rate, remaining notional and current liability."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: []
    output: BuybackContract
    side_effects: []
  - method: GET
    path: "/buyback-contracts"
    description: "Lists buy-back contracts; the filtered-list reverse lookup for BuybackContract.customer_id, branch_id, origin_transaction_id and superseded_by_contract_id."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "branch_id?", "origin_transaction_id?", "superseded_by_contract_id?", "status?", "limit?", "offset?"]
    output: BuybackContract[]
    side_effects: []

  # ================= NoteAssessment =================
  - method: POST
    path: "/note-assessments"
    description: "Detains a class of notes taken in on a settled buy deal, moving them out of available stock and into quarantine. Quarantined notes leave total_minor_units immediately, so the branch vault is revalued and the posture may move."
    roles: [BranchTeller, BranchManager]
    code: 201
    input: ["branch_id", "inventory_position_id", "exchange_transaction_id", "denomination_minor_units", "note_count", "defect_type", "serial_reference?"]
    output: NoteAssessment
    side_effects:
      - "NoteAssessment created in SUBMITTED with currency_code copied from the position and face_fx_minor_units := denomination_minor_units * note_count"
      - "On the position's mix entry: available_note_count -= note_count and quarantined_note_count += note_count"
      - "total_minor_units, quarantined_minor_units and usd_equivalent_cents recomputed, then Branch vault fields and posture recomputed"
      - "increments Branch.version by 1"
  - method: POST
    path: "/note-assessments/{id}/assess"
    description: "Records the assessment outcome. CONFISCATED writes the notes off and raises a counterfeit report; RETURNED hands them back to the customer; EXCHANGED_AT_DISCOUNT returns them to available stock and pays the customer a discounted USD recovery. Each outcome is permitted only for specific defect types."
    roles: [BranchManager]
    code: 200
    input: ["outcome", "assessment_note?"]
    output: NoteAssessment
    side_effects:
      - "status SUBMITTED -> ASSESSED; outcome recorded; assessed_by_user_id := X-User-ID"
      - "CONFISCATED: quarantined_note_count -= note_count, written_off_note_count += note_count; a COUNTERFEIT_SEIZURE ComplianceReport is created in DRAFT; the cited transaction's compliance_status PENDING -> FLAGGED"
      - "RETURNED: quarantined_note_count -= note_count and the notes leave the branch; no report and no compliance-status change"
      - "EXCHANGED_AT_DISCOUNT: quarantined_note_count -= note_count and available_note_count += note_count, restoring total_minor_units; recovery_usd_cents written by calculations.damaged_note_recovery; position and Branch vault fields and posture recomputed"
  - method: GET
    path: "/note-assessments/{id}"
    description: "Reads one note assessment with its outcome and recovery amount."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: []
    output: NoteAssessment
    side_effects: []
  - method: GET
    path: "/note-assessments"
    description: "Lists note assessments; the filtered-list reverse lookup for NoteAssessment.branch_id, inventory_position_id and exchange_transaction_id."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager, BranchTeller, ComplianceOfficer]
    code: 200
    input: ["branch_id?", "inventory_position_id?", "exchange_transaction_id?", "defect_type?", "status?", "limit?", "offset?"]
    output: NoteAssessment[]
    side_effects: []

  # ================= ComplianceReport =================
  - method: POST
    path: "/compliance-reports/{id}/file"
    description: "Files a DRAFT or AMENDING regulatory report with the regulator's acknowledgement reference. Filing the last outstanding STRUCTURING_SUSPICION report of a customer is what makes a compliance-hold release permissible."
    roles: [ComplianceOfficer]
    code: 200
    input: [filing_reference]
    output: ComplianceReport
    side_effects:
      - "status DRAFT|AMENDING -> FILED; filing_reference stored; filed_at := logical clock"
  - method: POST
    path: "/compliance-reports/{id}/amend"
    description: "Re-opens a FILED report for amendment; the report must be filed again afterwards."
    roles: [ComplianceOfficer]
    code: 200
    input: ["amendment_reason?"]
    output: ComplianceReport
    side_effects:
      - "status FILED -> AMENDING; amendment_count += 1"
      - "For a STRUCTURING_SUSPICION report this re-blocks the compliance-hold release path"
  - method: GET
    path: "/compliance-reports/{id}"
    description: "Reads one regulatory report with its aggregation window and cited aggregate."
    roles: [PlatformAdmin, ComplianceOfficer, TreasuryOfficer, BranchManager]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []
  - method: GET
    path: "/compliance-reports"
    description: "Lists regulatory reports; the only discovery channel for cascade-created reports and the filtered-list reverse lookup for ComplianceReport.customer_id, branch_id, triggering_transaction_id and note_assessment_id."
    roles: [PlatformAdmin, ComplianceOfficer, TreasuryOfficer, BranchManager]
    code: 200
    input: ["customer_id?", "branch_id?", "triggering_transaction_id?", "note_assessment_id?", "report_type?", "status?", "limit?", "offset?"]
    output: ComplianceReport[]
    side_effects: []

  # ================= CashShipment =================
  - method: POST
    path: "/cash-shipments"
    description: "Raises a cash-logistics request to move currency into or out of a branch vault, valued at the wholesale mid. Created unscheduled, with no route and no window."
    roles: [TreasuryOfficer, BranchManager]
    code: 201
    input: [branch_id, currency_code, direction, manifest_denominations]
    output: CashShipment
    side_effects:
      - "CashShipment created in REQUESTED with auto_generated false, armored_route_id null and both window fields null"
      - "manifest_minor_units and manifest_usd_equivalent_cents written by calculations.shipment_manifest_valuation"
  - method: POST
    path: "/cash-shipments/{id}/schedule"
    description: "Assigns an armored route and a closed transport window to a REQUESTED shipment. The route must be ACTIVE and serve the branch's region, the window must clear every other window on that route by MIN_ROUTE_GAP_MINUTES, and the route's UTC-day capacity must still hold the manifest."
    roles: [TreasuryOfficer]
    code: 200
    input: [armored_route_id, window_start, window_end]
    output: CashShipment
    side_effects:
      - "status REQUESTED -> SCHEDULED; armored_route_id, window_start and window_end written"
  - method: POST
    path: "/cash-shipments/{id}/dispatch"
    description: "Marks a SCHEDULED shipment as picked up. Only permitted once the logical clock has reached window_start."
    roles: [TreasuryOfficer]
    code: 200
    input: []
    output: CashShipment
    side_effects:
      - "status SCHEDULED -> IN_TRANSIT; no inventory movement yet"
  - method: POST
    path: "/cash-shipments/{id}/arrive"
    description: "Records the physical arrival count. A count that reproduces the manifest exactly lands DELIVERED; any difference lands EXCEPTION with a MANIFEST_VARIANCE reason. Either way only the counted notes move on the branch position."
    roles: [BranchManager]
    code: 200
    input: [delivered_denominations]
    output: CashShipment
    side_effects:
      - "status IN_TRANSIT -> DELIVERED (zero variance) or EXCEPTION (non-zero variance); delivered_minor_units and variance_minor_units written"
      - "The branch InventoryPosition for the currency is credited (REPLENISHMENT) or debited (REPATRIATION) by the delivered counts, then total_minor_units and usd_equivalent_cents recomputed"
      - "Branch.vault_usd_equivalent_cents, vault_utilization_bps and posture recomputed; a posture arrival at RESTRICTED or FROZEN raises an auto_generated REPATRIATION CashShipment"
      - "A DELIVERED REPATRIATION shipment sets Branch.repatriation_pending := false; an EXCEPTION one does not"
      - "increments Branch.version by 1"
  - method: POST
    path: "/cash-shipments/{id}/reconcile"
    description: "Closes out a DELIVERED or EXCEPTION shipment, writing off any manifest variance."
    roles: [TreasuryOfficer]
    code: 200
    input: []
    output: CashShipment
    side_effects:
      - "status DELIVERED|EXCEPTION -> RECONCILED; written_off_minor_units := 0 (DELIVERED) or variance_minor_units (EXCEPTION)"
      - "A REPATRIATION shipment reconciled from EXCEPTION sets Branch.repatriation_pending := false"
  - method: GET
    path: "/cash-shipments/{id}"
    description: "Reads one cash shipment with its manifest, window, variance and write-off."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: []
    output: CashShipment
    side_effects: []
  - method: GET
    path: "/cash-shipments"
    description: "Lists cash shipments; the only discovery channel for auto_generated REPATRIATION shipments and the filtered-list reverse lookup for CashShipment.branch_id and armored_route_id."
    roles: [PlatformAdmin, TreasuryOfficer, BranchManager]
    code: 200
    input: ["branch_id?", "armored_route_id?", "direction?", "status?", "auto_generated?", "limit?", "offset?"]
    output: CashShipment[]
    side_effects: []

errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, out-of-domain enum, out-of-range integer, empty or duplicate-bearing array, effective_to <= effective_from, season_end_date <= season_start_date, window_end <= window_start, export_limit_minor_units present on a non-RESTRICTED currency or absent on a RESTRICTED one, id_document_number or id_document_expiry missing while id_document_type is present, or a returned/requested denomination not in CurrencyProfile.standard_denominations"

  # ---- existence ----
  - id: ERR_BRANCH_NOT_FOUND
    http: 404
    condition: "branch_id in the path or body does not resolve to a Branch"
  - id: ERR_CURRENCY_NOT_FOUND
    http: 404
    condition: "A currency_code does not equal any CurrencyProfile.iso_code"
  - id: ERR_WHOLESALE_RATE_NOT_FOUND
    http: 404
    condition: "wholesale_rate_id does not resolve to a WholesaleRate, or no WholesaleRate for the currency is effective at or before the logical clock when a valuation needs a mid rate"
  - id: ERR_CORRIDOR_NOT_FOUND
    http: 404
    condition: "travel_corridor_id does not resolve to a TravelCorridor"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "armored_route_id does not resolve to an ArmoredRoute"
  - id: ERR_RATE_CARD_NOT_FOUND
    http: 404
    condition: "rate_card_id in the path or body does not resolve to a RateCard"
  - id: ERR_POSITION_NOT_FOUND
    http: 404
    condition: "inventory_position_id in the path or body does not resolve to an InventoryPosition, or the branch holds no position for the currency being moved"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "The inventory-plan id in the path does not resolve to an InventoryPlan"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id in the path or body does not resolve to a Customer"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "The transaction id in the path, or origin_transaction_id / exchange_transaction_id in a body, does not resolve to an ExchangeTransaction"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "The buy-back contract id in the path does not resolve to a BuybackContract"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "The note-assessment id in the path does not resolve to a NoteAssessment"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "The compliance-report id in the path does not resolve to a ComplianceReport"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "The cash-shipment id in the path does not resolve to a CashShipment"

  # ---- uniqueness ----
  - id: ERR_DUPLICATE_BRANCH_CODE
    http: 409
    condition: "POST /branches with a code that already exists"
  - id: ERR_POSITION_ALREADY_EXISTS
    http: 409
    condition: "POST /inventory-positions for a (branch_id, currency_code) that already has a position"
  - id: ERR_CONTRACT_ALREADY_ISSUED
    http: 409
    condition: "POST /buyback-contracts against an origin transaction that already carries a buyback_contract_id"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_BRANCH_VERSION
    http: 412
    condition: "expected_branch_version on POST /rate-cards does not equal the current Branch.version"
  - id: ERR_STALE_CUSTOMER_VERSION
    http: 412
    condition: "expected_customer_version on POST /buyback-contracts does not equal the current Customer.version"

  # ---- state ----
  - id: ERR_RATE_CARD_NOT_DRAFT
    http: 409
    condition: "POST /rate-cards/{id}/publish on a card whose status is not DRAFT"
  - id: ERR_PLAN_INVALID_STATE
    http: 409
    condition: "submit on a non-DRAFT plan, review on a non-SUBMITTED plan, or activate on a non-APPROVED plan"
  - id: ERR_TRANSACTION_NOT_QUOTED
    http: 409
    condition: "authorize on a transaction whose settlement_status is not QUOTED"
  - id: ERR_TRANSACTION_NOT_AUTHORIZED
    http: 409
    condition: "settle on a transaction whose settlement_status is not AUTHORIZED"
  - id: ERR_TRANSACTION_NOT_SETTLED
    http: 409
    condition: "reverse on a transaction whose settlement_status is not SETTLED"
  - id: ERR_TRANSACTION_NOT_VOIDABLE
    http: 409
    condition: "void on a transaction whose settlement_status is not QUOTED or AUTHORIZED"
  - id: ERR_COMPLIANCE_DECISION_FINAL
    http: 409
    condition: "compliance-decision on a transaction whose compliance_status is already CLEARED or BLOCKED, or a FLAG decision on a row that is no longer PENDING"
  - id: ERR_CONTRACT_NOT_REDEEMABLE
    http: 409
    condition: "redeem on a contract whose status is not ISSUED or PARTIALLY_REDEEMED"
  - id: ERR_CONTRACT_NOT_CANCELLABLE
    http: 409
    condition: "cancel on a contract whose status is not ISSUED or PARTIALLY_REDEEMED"
  - id: ERR_ASSESSMENT_ALREADY_ASSESSED
    http: 409
    condition: "assess on a NoteAssessment whose status is already ASSESSED"
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "file on a report that is already FILED, or amend on a report that is not FILED"
  - id: ERR_SHIPMENT_INVALID_STATE
    http: 409
    condition: "schedule on a non-REQUESTED shipment, dispatch on a non-SCHEDULED shipment, arrive on a non-IN_TRANSIT shipment, or reconcile on a shipment that is not DELIVERED or EXCEPTION"

  # ---- branch posture gates ----
  - id: ERR_BRANCH_NOT_ACTIVE
    http: 409
    condition: "The branch's administrative status is not ACTIVE"
  - id: ERR_BRANCH_POSTURE_FROZEN
    http: 409
    condition: "Branch.posture is FROZEN (vault_utilization_bps > 10000)"
  - id: ERR_BRANCH_POSTURE_RESTRICTED
    http: 409
    condition: "Branch.posture is RESTRICTED (9000 <= vault_utilization_bps <= 10000) and the operation would add foreign cash to the vault"

  # ---- identification and compliance ----
  - id: ERR_CUSTOMER_ID_REQUIRED
    http: 422
    condition: "quoted_usd_gross_cents >= ID_REQUIRED_CENTS (100000) but the customer has no complete identification document on file"
  - id: ERR_CUSTOMER_ID_EXPIRED
    http: 422
    condition: "The customer's id_document_expiry is at or before the logical clock"
  - id: ERR_CUSTOMER_COMPLIANCE_HOLD
    http: 409
    condition: "Customer.compliance_hold_active is true"
  - id: ERR_TRANSACTION_COMPLIANCE_BLOCKED
    http: 409
    condition: "The transaction's compliance_status is BLOCKED"
  - id: ERR_STRUCTURING_REPORT_PENDING
    http: 409
    condition: "A compliance-hold RELEASE while the customer still has a STRUCTURING_SUSPICION report in DRAFT or AMENDING"
  - id: ERR_RESTRICTED_CURRENCY_DOC_REQUIRED
    http: 422
    condition: "Selling a RESTRICTED-class currency to a customer with no travel_document_reference"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewing X-User-ID equals the plan's submitted_by_user_id"
  - id: ERR_DUAL_CONTROL_REQUIRED
    http: 403
    condition: "settled_usd_gross_cents >= DUAL_CONTROL_THRESHOLD_CENTS (500000) and the settling X-User-ID equals authorized_by_user_id"

  # ---- temporal ----
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "authorize after the logical clock has passed quote_expires_at"
  - id: ERR_REVERSAL_WINDOW_CLOSED
    http: 409
    condition: "reverse more than REVERSAL_WINDOW_HOURS (24) after settled_at"
  - id: ERR_RATE_WINDOW_OVERLAP
    http: 409
    condition: "publish would make two PUBLISHED cards for the same (branch_id, currency_code) hold intersecting half-open windows; touching endpoints do not intersect"
  - id: ERR_ROUTE_WINDOW_CONFLICT
    http: 409
    condition: "The requested closed shipment window is separated from another {SCHEDULED, IN_TRANSIT} window on the same route by less than MIN_ROUTE_GAP_MINUTES (45); touching windows conflict"
  - id: ERR_SHIPMENT_WINDOW_NOT_OPEN
    http: 409
    condition: "dispatch before the logical clock reaches window_start"
  - id: ERR_PLAN_OUTSIDE_SEASON
    http: 409
    condition: "activate while the logical clock is outside [season_start_date, season_end_date) of the plan's corridor"

  # ---- business constraints ----
  - id: ERR_EXPORT_LIMIT_EXCEEDED
    http: 422
    condition: "fx_gross_minor_units exceeds CurrencyProfile.export_limit_minor_units for a RESTRICTED currency sold to a customer"
  - id: ERR_EXOTIC_PLAN_REQUIRED
    http: 422
    condition: "Selling an EXOTIC-class currency at a branch with no ACTIVE InventoryPlan whose computed_targets contain that currency"
  - id: ERR_DISCLOSURE_VERSION_UNSUPPORTED
    http: 422
    condition: "publish with disclosure_text_version < MIN_DISCLOSURE_TEXT_VERSION (3)"
  - id: ERR_PLAN_NO_TARGET_LINES
    http: 422
    condition: "submit a plan whose target_lines are empty"
  - id: ERR_BUYBACK_NOT_ELIGIBLE
    http: 422
    condition: "The origin transaction is not SETTLED, its direction is not SELL_FX_TO_CUSTOMER, or the currency's buyback_eligible is false"
  - id: ERR_BUYBACK_BLOCKS_REVERSAL
    http: 422
    condition: "reverse on a transaction that still carries a buyback_contract_id"
  - id: ERR_REDEEM_EXCEEDS_REMAINING
    http: 422
    condition: "The returned note value exceeds remaining_fx_minor_units"
  - id: ERR_OUTCOME_NOT_PERMITTED_FOR_DEFECT
    http: 422
    condition: "CONFISCATED on a defect_type other than SUSPECTED_COUNTERFEIT, RETURNED on SUSPECTED_COUNTERFEIT, or EXCHANGED_AT_DISCOUNT on a defect_type other than DAMAGED"
  - id: ERR_ROUTE_SUSPENDED
    http: 422
    condition: "schedule onto a route whose status is SUSPENDED"
  - id: ERR_ROUTE_BRANCH_NOT_SERVICED
    http: 422
    condition: "The route's region_code differs from the branch's region_code"

  # ---- rate-board referential currency ----
  - id: ERR_RATE_CARD_NOT_PUBLISHED
    http: 409
    condition: "The rate card the operation depends on is DRAFT or SUPERSEDED, or the branch has no PUBLISHED card for the currency at all"
  - id: ERR_RATE_CARD_NOT_EFFECTIVE
    http: 409
    condition: "The rate card's half-open window does not cover the instant the operation reads it (the logical clock at quote time, authorized_at at settlement time)"

  # ---- fiscal capacity ----
  - id: ERR_DENOMINATION_NOT_STOCKED
    http: 422
    condition: "A requested denomination has no entry on the branch's InventoryPosition for the currency"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 422
    condition: "available_note_count on the position is below the requested note_count for a denomination being sold"
  - id: ERR_VAULT_LIMIT_WOULD_EXCEED
    http: 422
    condition: "The post-credit vault USD equivalent would exceed Branch.vault_limit_usd_cents"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 422
    condition: "The summed manifest USD equivalent of all {SCHEDULED, IN_TRANSIT} shipments on the route starting on the requested UTC day, including this one, exceeds ArmoredRoute.daily_capacity_usd_cents"

roles:
  - name: PlatformAdmin
    description: "Operator of the exchange platform: registers branches, currency profiles and armored routes, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /branches"
      - "POST /currencies"
      - "POST /armored-routes"
    shared_operations:
      - "GET /branches, GET /branches/{id}, GET /currencies, GET /currencies/{id}, GET /armored-routes, GET /armored-routes/{id}"
      - "GET /wholesale-rates, GET /travel-corridors, GET /rate-cards, GET /inventory-positions, GET /inventory-plans, GET /customers, GET /exchange-transactions, GET /buyback-contracts, GET /note-assessments, GET /compliance-reports, GET /cash-shipments and their single-resource forms"
  - name: TreasuryOfficer
    description: "Head-office treasury: records wholesale quotes, sets and publishes retail rate cards, reviews branch stocking plans and runs cash logistics."
    identity: "opaque"
    exclusive_operations:
      - "POST /wholesale-rates"
      - "POST /travel-corridors"
      - "POST /rate-cards"
      - "POST /rate-cards/{id}/publish"
      - "POST /inventory-plans/{id}/review"
      - "POST /cash-shipments/{id}/schedule"
      - "POST /cash-shipments/{id}/dispatch"
      - "POST /cash-shipments/{id}/reconcile"
    shared_operations:
      - "POST /inventory-positions (with BranchManager)"
      - "POST /cash-shipments (with BranchManager)"
      - "POST /buyback-contracts/{id}/cancel (with BranchManager)"
      - "All GET reads except GET /branches/{id}/rate-board's customer-facing use"
  - name: BranchManager
    description: "Runs one branch: opens currency positions, drafts and activates stocking plans, assesses detained notes, reverses settled deals and receives shipments."
    identity: "opaque"
    exclusive_operations:
      - "POST /inventory-plans"
      - "POST /inventory-plans/{id}/submit"
      - "POST /inventory-plans/{id}/activate"
      - "POST /exchange-transactions/{id}/reverse"
      - "POST /note-assessments/{id}/assess"
      - "POST /cash-shipments/{id}/arrive"
    shared_operations:
      - "POST /inventory-positions (with TreasuryOfficer)"
      - "POST /cash-shipments (with TreasuryOfficer)"
      - "POST /buyback-contracts/{id}/cancel (with TreasuryOfficer)"
      - "POST /customers, POST /exchange-transactions, POST /exchange-transactions/{id}/authorize, POST /exchange-transactions/{id}/settle, POST /exchange-transactions/{id}/void, POST /buyback-contracts, POST /note-assessments (with BranchTeller)"
  - name: BranchTeller
    description: "Serves customers at the counter: on-boards them, quotes, authorizes, settles and voids deals, issues and redeems buy-back guarantees and detains suspect notes."
    identity: "opaque"
    exclusive_operations:
      - "POST /buyback-contracts/{id}/redeem"
    shared_operations:
      - "POST /customers, POST /exchange-transactions, POST /exchange-transactions/{id}/authorize, POST /exchange-transactions/{id}/settle, POST /exchange-transactions/{id}/void, POST /buyback-contracts, POST /note-assessments (with BranchManager)"
      - "GET /branches/{id}/rate-board and the read surface for branch-level entities"
  - name: ComplianceOfficer
    description: "Second line of defence: records compliance decisions on transactions, files and amends regulatory reports and controls customer compliance holds. Deliberately cannot quote, authorize or settle."
    identity: "opaque"
    exclusive_operations:
      - "POST /exchange-transactions/{id}/compliance-decision"
      - "POST /customers/{id}/compliance-hold"
      - "POST /compliance-reports/{id}/file"
      - "POST /compliance-reports/{id}/amend"
    shared_operations:
      - "GET /customers, GET /customers/{id}, GET /exchange-transactions, GET /exchange-transactions/{id}, GET /compliance-reports, GET /compliance-reports/{id}, GET /note-assessments, GET /buyback-contracts, GET /rate-cards, GET /branches/{id}"
  - name: Customer
    description: "The retail counterparty. Read-only, and only of the public rate board and currency catalogue; every money-moving call is made by branch staff on the customer's behalf. X-User-ID is the Customer row's id."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET /branches/{id}/rate-board"
      - "GET /currencies, GET /currencies/{id}"
