              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /inspection-reports/${r1_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /inspection-reports/${r1_id}/score"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /data-challenges/${ch1_id}/submit"
              payload: {}
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
          assert:
            - "after trigger[0]: HTTP status == 409"
            - "after trigger[0]: error_id == ERR_INVALID_REPORT_STATE"
            - "after trigger[0]: DataChallenge.${ch1_id}.status == DRAFT"
            - "after trigger[0]: Carrier.${c1_id}.challenge_quota_used == 0"
            - "after trigger[0]: Violation.${v1_id}.under_challenge == false"
            - "after trigger[2]: InspectionReport.${r1_id}.status == SCORED"
