            - "${derived} == 4 - the min_headcount floor is written back into ratio_derived_headcount, so it is not the un-floored 2"
            - "${required} == 4 and required_headcount_override is null"
            - "${cost} == 52800 (4 x 2200 x 360 / 60)"
            - "StaffingPlan.${plan_id}: total_required_headcount 4, base_labor_cost_cents 52800, accessibility_surcharge_cents 0 (4 is below the 60-head 350 bp floor), projected_labor_cost_cents 52800"

      - name: plan_cost_excludes_closed_slots_from_the_input_set
        claim_type: input_set_filtering
        grounds:
          - calculations.staffing_plan_projected_labor_cost
          - state_machines.PositionSlot.FILLED_to_CLOSED
          - state_machines.StaffingPlan.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: >-
          The four aggregates are computed over `status != CLOSED` slots only, so once activating a
          rival plan supersedes the incumbent and closes its slots, the incumbent's
          base_labor_cost_cents, total_required_headcount, accessibility_surcharge_cents and
          projected_labor_cost_cents all fall to 0 while the per-slot slot_labor_cost_cents values
          they were built from are still on the closed rows.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One Event with expected_attendance 6000 (TIER_1) and one TICKET_TAKER PositionType at 2000 cents/h, ratio 0.8, min_headcount 3."
            - "Plan A carries two 245-minute slots with required_headcount_override 5 and 2 and is activated (base 40833 + 16333 = 57166, headcount 7)."
            - "Plan B carries one 245-minute slot with required_headcount_override 1 (cost 8167) and is still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Supersede Cost Fixture", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T17:00:00Z", doors_close_at: "2026-09-20T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_a: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_a}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-20T18:00:00Z", shift_end: "2026-09-20T22:05:00Z", required_headcount_override: 5 }
              as: StaffingCoordinator
              captures: { slot_a1: $.data.id, cost_a1: $.data.slot_labor_cost_cents }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_a}", position_type_id: "${pt_id}", zone_code: "Z200", shift_start: "2026-09-20T18:00:00Z", shift_end: "2026-09-20T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_a2: $.data.id, cost_a2: $.data.slot_labor_cost_cents }
            - call: "POST /staffing-plans/${plan_a}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
              captures: { base_a_before: $.data.base_labor_cost_cents, hc_a_before: $.data.total_required_headcount }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_b: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_b}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-20T18:00:00Z", shift_end: "2026-09-20T22:05:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_b1: $.data.id }
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { ev_v2: $.data.version }
          trigger:
            - call: "POST /staffing-plans/${plan_b}/activate"
              payload: { expected_event_version: "${ev_v2}" }
              as: StaffingCoordinator
          assert:
            - "${cost_a1} == 40833 and ${cost_a2} == 16333; ${base_a_before} == 57166 and ${hc_a_before} == 7"
            - "StaffingPlan.${plan_a}.status == SUPERSEDED"
            - "PositionSlot.${slot_a1}.status == CLOSED and PositionSlot.${slot_a2}.status == CLOSED"
            - "StaffingPlan.${plan_a}.total_required_headcount == 0, base_labor_cost_cents == 0, accessibility_surcharge_cents == 0, projected_labor_cost_cents == 0"
            - "PositionSlot.${slot_a1}.slot_labor_cost_cents is still 40833 - only the plan-level aggregates drop the closed rows"
            - "StaffingPlan.${plan_b}.status == ACTIVE, total_required_headcount == 1, base_labor_cost_cents == 8167 (2000 x 245 / 60 = 8166.6667 rounded HALF_UP), accessibility_surcharge_cents == 0, projected_labor_cost_cents == 8167"
            - "Event.${ev_id}.version == 3 and status == PLANNED"

      - name: gratuity_remainder_distributed_in_ranking_order
        claim_type: precision
        grounds:
          - calculations.gratuity_pool_allocation
          - endpoints[POST /events/{id}/payout-run]
          - errors[ERR_PAYOUT_PHASE_INVALID]
        distinguishing_aspect: >-
          Three equally-weighted contracted rows split a 50000 pool into exact shares of
          16666.666..., so every floor is 16666 and the remainder is 2 - and those two cents go to
          ranks 1 and 2 of the (worked_minutes DESC, seniority_date ASC, created_at ASC) ordering,
          i.e. the two most senior members, giving 16667 / 16667 / 16666 that sums to the pool
          exactly. A replay finds no ACCRUED row left and is refused.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z."
            - "One Event with expected_attendance 6000 and gratuity_pool_cents 50000."
            - "One ELEVATOR_OPERATOR PositionType at 2400 cents/h with is_tip_eligible true, is_contracted_position true and no required certifications."
            - "One slot 18:00Z -> 23:05Z with required_headcount_override 3."
            - "Three CONTRACTED StaffMembers at 2400 cents/h with seniority_date 2020-01-01, 2021-01-01, 2022-01-01."
            - "All three check in at 18:00Z and out at 23:00Z, so each row is COMPLETED with worked_minutes 300 and base_pay_cents 12000; the event is then CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
