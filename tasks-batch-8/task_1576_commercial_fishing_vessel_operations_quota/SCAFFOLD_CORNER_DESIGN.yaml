# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of §1.1–§1.7 claims not
# already probed by §1.8. Every chain starts from empty DB.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: vessel_creation_defaults
        claim_type: creation_defaults
        grounds:
          - entities.Vessel.fields.compliance_points
          - entities.Vessel.fields.status
        distinguishing_aspect: "Fresh vessel starts REGISTERED with compliance_points 100 and version 1; server mints id/created_at."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-E1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id, st: $.data.status, pts: $.data.compliance_points, ver: $.data.version } }
          assert:
            - "response 201; Vessel.status == REGISTERED; compliance_points == 100; version == 1"
            - "id is a server-minted UUID; created_at and updated_at are set"

      - name: vessel_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Vessel.fields.observer_coverage_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "observer_coverage_class outside {FULL, PARTIAL, EXEMPT} is rejected."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "FV Bad", license_number: "LIC-E2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "GOLD" }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400); no vessel persisted"

      - name: vessel_create_missing_required_field
        claim_type: required_fields
        grounds:
          - entities.Vessel.fields.license_number
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required license_number is rejected."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "FV Bad", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: vessel_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_VESSEL_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but nonexistent vessel id returns 404."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "GET /vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VESSEL_NOT_FOUND (http 404)"

      - name: vessel_duplicate_license_rejected
        claim_type: type_constraints
        grounds:
          - entities.Vessel.fields.license_number
          - errors[ERR_DUPLICATE_LICENSE]
        distinguishing_aspect: "license_number uniqueness is enforced across vessels."
        test_recipe:
          setup: ["one vessel with license LIC-E5"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-E5", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator }
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "FV Copy", license_number: "LIC-E5", home_port: "KODIAK", length_ft: 40, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_LICENSE (http 409)"

      - name: holding_duplicate_rejected
        claim_type: type_constraints
        grounds:
          - entities.QuotaShareHolding
          - errors[ERR_DUPLICATE_HOLDING]
        distinguishing_aspect: "(vessel, fishery_code, season_year) uniqueness on holdings."
        test_recipe:
          setup: ["ACTIVE vessel with a HALIBUT/2026 holding"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-E6", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
          trigger:
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_HOLDING (http 409)"
            - "a SABLEFISH/2026 holding for the same vessel WOULD be accepted (uniqueness is per fishery+year)"

      - name: catch_report_client_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.CatchReport
          - state_machines.CatchReport
        distinguishing_aspect: "CatchReport is append-only (no version/updated_at); a client-supplied id is ignored and haul_seq is assigned per trip in creation order."
        test_recipe:
          setup: ["trip DEPARTED"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-E7", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 1000, reported_at: "2026-08-11T00:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { seq1: $.data.haul_seq } }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "DISCARD", reported_lbs: 100, reported_at: "2026-08-11T01:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { seq2: $.data.haul_seq } }
          assert:
            - "haul_seq == 1 then 2 (per-trip creation order)"
            - "CatchReport responses carry id and created_at but no version field (common_fields: false)"
            - "no update or delete endpoint exists for CatchReport"

      - name: opening_create_invalid_time_window_rejected
        claim_type: type_constraints
        grounds:
          - entities.SeasonOpening.fields.closes_at
          - errors[ERR_INVALID_TIME_WINDOW]
        distinguishing_aspect: "closes_at <= opens_at is rejected."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-25T00:00:00Z", closes_at: "2026-08-05T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TIME_WINDOW (http 400)"

      - name: vessel_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Vessel
        distinguishing_aspect: "Client-supplied id, version, created_at, status, compliance_points in the create body are ignored; server values win."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-E9", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 99, status: "ACTIVE", compliance_points: 1 }, as: FisheriesRegulator, captures: { v1: $.data.id, st: $.data.status, pts: $.data.compliance_points, ver: $.data.version } }
          assert:
            - "id != the client-supplied UUID; status == REGISTERED; compliance_points == 100; version == 1"

  # -------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: depart_from_returned_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.FishingTrip.PLANNED_to_DEPARTED
          - errors[ERR_TRIP_NOT_PLANNED]
        distinguishing_aspect: "Depart is only defined from PLANNED; a RETURNED trip rejects it."
        test_recipe:
          setup: ["trip executed to RETURNED"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRIP_NOT_PLANNED (http 409); trip stays RETURNED"

      - name: verify_draft_declaration_state_gate
        claim_type: invalid_transition
        grounds:
          - state_machines.LandingDeclaration.DRAFT_to_SUBMITTED
        excluded_because:
          difficulty_instance: verify_state_beats_quota_fiscal
          rationale: "Asserted there as the winning half of the state-vs-fiscal priority conflict."

      - name: settle_proposed_transfer_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.QuotaTransfer.ACCEPTED_to_SETTLED
          - errors[ERR_TRANSFER_NOT_ACCEPTED]
        distinguishing_aspect: "Settle is defined only from ACCEPTED."
        test_recipe:
          setup: ["PROPOSED transfer between two permitted vessels"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S3A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-S3B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 5000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /quota-transfers/${tr}/settle", as: SettlementClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_NOT_ACCEPTED (http 409); transfer stays PROPOSED; transfer_fee_cents still null"

      - name: pay_calculated_settlement_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.TripSettlement.APPROVED_to_PAID
          - errors[ERR_SETTLEMENT_NOT_APPROVED]
        distinguishing_aspect: "Pay requires APPROVED; CALCULATED is not enough — the owner-approval step cannot be skipped (segregation of duties)."
        test_recipe:
          setup: ["settlement in CALCULATED for a fully executed trip (gross 1000000, no expenses, one ACTIVE crew contract)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S4", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 1, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id } }
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk }
          trigger:
            - { call: "POST /trip-settlements/${s1}/pay", as: SettlementClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SETTLEMENT_NOT_APPROVED (http 409); settlement stays CALCULATED; trip NOT advanced to SETTLED"

      - name: debrief_assigned_assignment_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ObserverAssignment.DEPLOYED_to_DEBRIEFED
          - errors[ERR_ASSIGNMENT_NOT_DEPLOYED]
        distinguishing_aspect: "Debrief requires DEPLOYED; ASSIGNED (never departed) rejects it."
        test_recipe:
          setup: ["trip PLANNED (100h, observer required); assignment ASSIGNED to a cert-B observer"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S5", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /observers", payload: { observer_name: "Obs One", certification_level: "B", home_base: "HOMER" }, as: ObserverCoordinator, captures: { ob1: $.data.id, ob_v: $.data.version } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${t1}", as: ObserverCoordinator, captures: { a1: "$.data[0].id" } }
            - { call: "POST /observer-assignments/${a1}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-10T00:00:00Z", coverage_to: "2026-08-14T06:00:00Z", expected_observer_version: "${ob_v}" }, as: ObserverCoordinator }
          trigger:
            - { call: "POST /observer-assignments/${a1}/debrief", as: Observer, as_user_id: "${ob1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSIGNMENT_NOT_DEPLOYED (http 409)"

      - name: amend_submitted_declaration_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.LandingDeclaration.DISPUTED_to_AMENDED
          - errors[ERR_DECLARATION_NOT_DISPUTED]
        distinguishing_aspect: "Amend is only defined from DISPUTED; a SUBMITTED declaration cannot be rewritten under the regulator."
        test_recipe:
          setup: ["trip RETURNED; declaration submitted (status SUBMITTED)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S6", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /landing-declarations/${ld1}/amend", payload: { lines: [{ fishery_code: "HALIBUT", declared_lbs: 3900 }] }, as: Captain, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DECLARATION_NOT_DISPUTED (http 409); lines unchanged"

      - name: cancel_cancelled_trip_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FishingTrip.PLANNED_to_CANCELLED
        distinguishing_aspect: "CANCELLED is terminal; a second cancel is rejected."
        test_recipe:
          setup: ["PLANNED trip cancelled once"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S7", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/cancel", as: VesselOwner, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /fishing-trips/${t1}/cancel", as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRIP_NOT_PLANNED (http 409); status stays CANCELLED"

      - name: counter_settled_transfer_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.QuotaTransfer.ACCEPTED_to_SETTLED
          - errors[ERR_TRANSFER_NOT_OPEN]
        distinguishing_aspect: "SETTLED is terminal; a counter against it is rejected even with the current version."
        test_recipe:
          setup: ["transfer proposed, accepted, settled (1000 lbs @ 500 -> fee 25000)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S8A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-S8B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 1000, price_per_lb_cents: 500 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr: $.data.id } }
            - { call: "POST /quota-transfers/${tr}/accept", as: VesselOwner, as_user_id: "${v2}" }
            - { call: "POST /quota-transfers/${tr}/settle", as: SettlementClerk }
            - { call: "GET /quota-transfers/${tr}", as: SettlementClerk, captures: { tr_v: $.data.version, fee: $.data.transfer_fee_cents } }
          trigger:
            - { call: "POST /quota-transfers/${tr}/counter", payload: { pounds: 900, price_per_lb_cents: 600, expected_transfer_version: "${tr_v}" }, as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_NOT_OPEN (http 409)"
            - "transfer_fee_cents == 25000 (flat tier, pounds <= 1000) and unchanged by the rejected counter"

      - name: trip_bubble_up_on_finalize_and_pay
        claim_type: side_effect_execution
        grounds:
          - state_machines.FishingTrip.RETURNED_to_LANDING_FINALIZED
          - state_machines.FishingTrip.LANDING_FINALIZED_to_SETTLED
        distinguishing_aspect: "Parent trip state is bubble-up derived: declaration FINALIZED moves RETURNED -> LANDING_FINALIZED; settlement PAID moves LANDING_FINALIZED -> SETTLED. No direct endpoint sets those trip states."
        test_recipe:
          setup: ["full trip run through settlement payment"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S9", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 1, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "GET /fishing-trips/${t1}", as: FisheriesRegulator, captures: { st_mid: $.data.status } }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id } }
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk }
            - { call: "POST /trip-settlements/${s1}/approve", as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /trip-settlements/${s1}/pay", as: SettlementClerk }
            - { call: "GET /fishing-trips/${t1}", as: FisheriesRegulator, captures: { st_end: $.data.status } }
          assert:
            - "after finalize: FishingTrip.${t1}.status == LANDING_FINALIZED (bubble up, no direct trip endpoint)"
            - "after pay: FishingTrip.${t1}.status == SETTLED (bubble up)"

      - name: opening_auto_open_and_clock_close_cascade
        claim_type: valid_transition
        grounds:
          - state_machines.SeasonOpening.SCHEDULED_to_OPEN
          - state_machines.SeasonOpening.OPEN_to_CLOSED
        distinguishing_aspect: "Clock-driven transitions fire on set_current_utc: SCHEDULED -> OPEN at opens_at, OPEN -> CLOSED when clock passes closes_at with the same PLANNED-trip cancellation cascade as CLOSED_EARLY."
        test_recipe:
          setup: ["opening 2026-08-05..2026-08-25; one PLANNED trip on it (created while OPEN at clock 2026-08-10)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S10", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "GET /season-openings/${o1}", as: FisheriesRegulator, captures: { st_open: $.data.status } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-20T06:00:00Z", planned_return_utc: "2026-08-22T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: FisheriesRegulator }
            - { call: "GET /season-openings/${o1}", as: FisheriesRegulator, captures: { st_closed: $.data.status } }
            - { call: "GET /fishing-trips/${t1}", as: FisheriesRegulator, captures: { t_st: $.data.status } }
          assert:
            - "opening is SCHEDULED before the first clock set, OPEN at 2026-08-10"
            - "at clock 2026-08-26 (> closes_at): opening CLOSED and the still-PLANNED trip cascade-cancelled"

      - name: clock_driven_permit_and_transfer_expiry
        claim_type: valid_transition
        grounds:
          - state_machines.Permit.ISSUED_to_EXPIRED
          - state_machines.QuotaTransfer.PROPOSED_to_EXPIRED
        distinguishing_aspect: "Year-end and validity boundaries fire together when the clock crosses them: permit EXPIRED past valid_to; open transfer EXPIRED past season year end; holding CLOSED."
        test_recipe:
          setup: ["vessel with permit valid_to 2026-12-31T23:59:59Z, holding HALIBUT/2026, and a PROPOSED transfer for season 2026"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S11A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator, captures: { p1: $.data.id } }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator, captures: { h1: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-S11B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 5000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: FisheriesRegulator }
            - { call: "GET /vessels/${v1}/permits", as: FisheriesRegulator, captures: { p_st: "$.data[0].status" } }
            - { call: "GET /quota-transfers/${tr}", as: FisheriesRegulator, captures: { tr_st: $.data.status } }
            - { call: "GET /quota-holdings/${h1}", as: FisheriesRegulator, captures: { h_st: $.data.status } }
          assert:
            - "Permit.status == EXPIRED (clock 2027-01-01 > valid_to 2026-12-31T23:59:59Z)"
            - "QuotaTransfer.status == EXPIRED (PROPOSED past season year end; no holding effect)"
            - "QuotaShareHolding.status == CLOSED"

      - name: release_triggers_compensating_re_request
        claim_type: side_effect_execution
        grounds:
          - state_machines.ObserverAssignment.CONFIRMED_to_RELEASED
        distinguishing_aspect: "Releasing a CONFIRMED assignment on a PLANNED observer-required trip auto-creates a fresh REQUESTED assignment (compensation), and the observer returns to AVAILABLE."
        test_recipe:
          setup: ["PARTIAL vessel, 100h trip (observer required); assignment assigned to cert-B observer and confirmed"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-S13", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /observers", payload: { observer_name: "Obs One", certification_level: "B", home_base: "HOMER" }, as: ObserverCoordinator, captures: { ob1: $.data.id, ob_v: $.data.version } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${t1}", as: ObserverCoordinator, captures: { a1: "$.data[0].id" } }
            - { call: "POST /observer-assignments/${a1}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-10T00:00:00Z", coverage_to: "2026-08-14T06:00:00Z", expected_observer_version: "${ob_v}" }, as: ObserverCoordinator }
            - { call: "POST /observer-assignments/${a1}/confirm", as: Observer, as_user_id: "${ob1}" }
          trigger:
            - { call: "POST /observer-assignments/${a1}/release", as: ObserverCoordinator }
            - { call: "GET /observer-assignments?trip_id=${t1}", as: ObserverCoordinator }
            - { call: "GET /observers/${ob1}", as: ObserverCoordinator, captures: { ob_st: $.data.status } }
          assert:
            - "ObserverAssignment.${a1}.status == RELEASED"
            - "GET /observer-assignments?trip_id=${t1} returns 2 rows: one RELEASED and one fresh REQUESTED with auto_created == true and observer_id null"
            - "Observer.${ob1}.status == AVAILABLE after the release"

      - name: observer_auto_assignment_on_required_trip
        claim_type: side_effect_execution
        grounds:
          - entities.FishingTrip.fields.observer_required
        excluded_because:
          difficulty_instance: observer_duration_72h_boundary
          rationale: "Auto-creation of the REQUESTED assignment and its absence at exactly 72h are asserted there."

  # ---------------------------------------------------------- calculations ---
  - section: calculations
    instances:
      - name: discrepancy_tolerance_boundary_inclusive
        claim_type: correct_result
        grounds:
          - calculations.landing_discrepancy_check
        distinguishing_aspect: "Tolerance is inclusive: diff == round_half_up(5 percent of expected) passes verification; diff one pound over disputes. Expected 4000 -> tolerance 200: declared 4200 VERIFIED, 4201 DISPUTED."
        test_recipe:
          setup: ["two executed trips of the same vessel, each with catch HARVEST 4000; declarations 4200 and 4201"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-K1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4200 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-13T06:00:00Z", planned_return_utc: "2026-08-15T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t2}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t2}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-14T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t2}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t2}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4201 }] }, as: Captain, as_user_id: "${v1}", captures: { ld2: $.data.id } }
            - { call: "POST /landing-declarations/${ld2}/submit", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator, captures: { st1: $.data.status } }
            - { call: "POST /landing-declarations/${ld2}/verify", as: FisheriesRegulator, captures: { st2: $.data.status } }
          assert:
            - "LandingDeclaration.${ld1}.status == VERIFIED (diff 200 == tolerance 200, inclusive)"
            - "LandingDeclaration.${ld2}.status == DISPUTED (diff 201 > 200) with http 200, not an error"

      - name: transfer_fee_tier_schedule
        claim_type: correct_result
        grounds:
          - calculations.transfer_fee_schedule
        distinguishing_aspect: "Tier boundaries: 1000 lbs flat 25000; 2000 lbs @500 -> 25000 + 4 percent of value = 65000; 12000 lbs @500 -> 25000 + 4 percent on first 10000 lbs + 7 percent on the remaining 2000 lbs = 295000."
        test_recipe:
          setup: ["V1 holding 100000, V2 holding 0... (V2 holding 5000); three transfers proposed and accepted: 1000 lbs @500, 2000 lbs @500, 12000 lbs @500"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-K2A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 100000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-K2B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 1000, price_per_lb_cents: 500 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr1: $.data.id } }
            - { call: "POST /quota-transfers/${tr1}/accept", as: VesselOwner, as_user_id: "${v2}" }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 2000, price_per_lb_cents: 500 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr2: $.data.id } }
            - { call: "POST /quota-transfers/${tr2}/accept", as: VesselOwner, as_user_id: "${v2}" }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 12000, price_per_lb_cents: 500 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr3: $.data.id } }
            - { call: "POST /quota-transfers/${tr3}/accept", as: VesselOwner, as_user_id: "${v2}" }
          trigger:
            - { call: "POST /quota-transfers/${tr1}/settle", as: SettlementClerk, captures: { fee1: $.data.transfer_fee_cents } }
            - { call: "POST /quota-transfers/${tr2}/settle", as: SettlementClerk, captures: { fee2: $.data.transfer_fee_cents } }
            - { call: "POST /quota-transfers/${tr3}/settle", as: SettlementClerk, captures: { fee3: $.data.transfer_fee_cents } }
          assert:
            - "QuotaTransfer.${tr1}.transfer_fee_cents == 25000 (flat tier at exactly 1000 lbs)"
            - "QuotaTransfer.${tr2}.transfer_fee_cents == 65000 (25000 + 0.04 x 1000000)"
            - "QuotaTransfer.${tr3}.transfer_fee_cents == 295000 (25000 + 0.04 x 5000000 + 0.07 x 1000000)"

      - name: observer_fee_ceil_days
        claim_type: correct_result
        grounds:
          - calculations.observer_fee_accrual
          - calculations.settlement_totals
        distinguishing_aspect: "Observer fee uses ceil on 24h days per assignment: 50h coverage -> 3 days -> 135000 cents, charged only for DEPLOYED/DEBRIEFED assignments."
        test_recipe:
          setup: ["FULL-class vessel; trip executed with observer (cert A), coverage 2026-08-10T00:00 -> 2026-08-12T02:00 (50h); catch and declaration 4000; one ACTIVE crew contract"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-K3", home_port: "HOMER", length_ft: 58, observer_coverage_class: "FULL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /observers", payload: { observer_name: "Obs One", certification_level: "A", home_base: "HOMER" }, as: ObserverCoordinator, captures: { ob1: $.data.id, ob_v: $.data.version } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${t1}", as: ObserverCoordinator, captures: { a1: "$.data[0].id" } }
            - { call: "POST /observer-assignments/${a1}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-10T00:00:00Z", coverage_to: "2026-08-12T02:00:00Z", expected_observer_version: "${ob_v}" }, as: ObserverCoordinator }
            - { call: "POST /observer-assignments/${a1}/confirm", as: Observer, as_user_id: "${ob1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /observer-assignments/${a1}/debrief", as: Observer, as_user_id: "${ob1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 1, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk }
          assert:
            - "TripSettlement.${s1}.observer_fee_cents == 135000 (ceil(50/24)=3 days x 45000)"
            - "net_cents == 852025 (1000000 - 0 - 135000 - 0 = 865000; fee round(0.015 x 865000) = 12975; 865000 - 12975)"
            - "vessel_share_cents == 511215 and crew_pool_cents == 340810"

      - name: gear_projection_replay
        claim_type: correct_result
        grounds:
          - calculations.gear_operational_units
          - entities.GearAsset.fields.units_operational
        distinguishing_aspect: "units_operational is a replayed projection over the GearEvent log: LOSS/REPAIR move units_lost, MAINTENANCE_START/END move units_in_maintenance; sequence 4 -> 3 -> 2 -> 3 -> 4 -> 2 pins the replay."
        test_recipe:
          setup: ["gear asset LONGLINE units_total 4"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-K4", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/gear-assets", payload: { gear_type: "LONGLINE", units_total: 4 }, as: VesselOwner, as_user_id: "${v1}", captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "LOSS", units: 1, occurred_at: "2026-08-02T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "GET /gear-assets/${g1}", as: VesselOwner, as_user_id: "${v1}", captures: { op1: $.data.units_operational } }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "MAINTENANCE_START", units: 1, occurred_at: "2026-08-03T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "GET /gear-assets/${g1}", as: VesselOwner, as_user_id: "${v1}", captures: { op2: $.data.units_operational } }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "MAINTENANCE_END", units: 1, occurred_at: "2026-08-04T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "REPAIR", units: 1, occurred_at: "2026-08-04T01:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "GET /gear-assets/${g1}", as: VesselOwner, as_user_id: "${v1}", captures: { op4: $.data.units_operational } }
            - { call: "POST /gear-assets/${g1}/events", payload: { event_type: "LOSS", units: 2, occurred_at: "2026-08-05T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "GET /gear-assets/${g1}", as: VesselOwner, as_user_id: "${v1}", captures: { op5: $.data.units_operational, g_st: $.data.status } }
          assert:
            - "units_operational sequence: 4 -> 3 (LOSS 1) -> 2 (MAINTENANCE_START 1) -> 3 (END) -> 4 (REPAIR clears the loss) -> 2 (LOSS 2)"
            - "GearAsset.status == OPERATIONAL throughout (units_operational > 0)"

  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role fail at priority 1 before any role or existence check — even on a nonexistent resource."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "GET /vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400), NOT 404 — auth beats existence"

      - name: role_check_beats_existence_returns_403
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
        distinguishing_aspect: "A role violation on a nonexistent vessel returns ERR_FORBIDDEN_ROLE, not ERR_VESSEL_NOT_FOUND (priority 2 beats priority 3)."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/activate", as: Captain, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (http 403) even though the vessel does not exist"

      - name: nested_path_validates_left_to_right
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
        distinguishing_aspect: "In POST /vessels/{id}/permits the vessel id is validated before permit body semantics; a bad vessel id yields ERR_VESSEL_NOT_FOUND."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VESSEL_NOT_FOUND (http 404)"

      - name: self_transfer_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_SELF_TRANSFER]
        distinguishing_aspect: "from_vessel_id == to_vessel_id is a constraint violation distinct from any quota check."
        test_recipe:
          setup: ["ACTIVE vessel with permit and holding 20000"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-V4", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator }
          trigger:
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v1}", fishery_code: "HALIBUT", season_year: 2026, pounds: 100, price_per_lb_cents: 100 }, as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SELF_TRANSFER (http 422)"

      - name: transfer_aggregate_overcommit_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.available_quota
          - validations[priority=10]
          - errors[ERR_QUOTA_EXCEEDED]
        distinguishing_aspect: "Aggregate validation: two 6000-lb proposals are each individually plausible against a 10000-lb holding, but the conservative variant counts open offers, so the second proposal fails."
        test_recipe:
          setup: ["V1 holding 10000, V2 holding 5000, both permitted; first proposal 6000 lbs accepted into PROPOSED"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-V5A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-V5B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 6000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 6000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "second proposal error_id == ERR_QUOTA_EXCEEDED (http 402): available_conservative == 10000 - 6000 (open offer) = 4000 < 6000 while available_committed is still 10000"

      - name: expenses_unresolved_blocks_calculate
        claim_type: violation_to_error
        grounds:
          - state_machines.TripSettlement.DRAFT_to_CALCULATED
          - errors[ERR_EXPENSES_UNRESOLVED]
        distinguishing_aspect: "Calculate refuses to run while any expense is still PENDING — the final variant must not silently drop unadjudicated expenses."
        test_recipe:
          setup: ["settlement DRAFT for an executed trip; one expense left PENDING"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-V6", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "FUEL", amount_cents: 120000, incurred_at: "2026-08-11T00:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 1, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EXPENSES_UNRESOLVED (http 409); settlement stays DRAFT"

      - name: settlement_underwater_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.settlement_totals
          - errors[ERR_SETTLEMENT_UNDERWATER]
        distinguishing_aspect: "net_before_fee < 0 (VERIFIED expenses exceed gross) is a fiscal rejection, keeping the money-decomposition invariant defined over non-negative values."
        test_recipe:
          setup: ["executed trip; VERIFIED expense 50000; gross_revenue_cents 40000; one ACTIVE crew contract"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-V7", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
