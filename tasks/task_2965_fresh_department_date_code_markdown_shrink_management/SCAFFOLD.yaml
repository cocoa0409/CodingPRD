  # --- lot, markdown and label writes --------------------------------------
  - method: POST
    path: "/fresh/lots"
    description: "Receive a date-coded lot for an item; sell_by_at is computed once at creation from Item.shelf_life_days or Department.shelf_life_days_default and is immutable afterwards"
    roles: [FreshClerk, DepartmentManager, StoreOperationsAdmin]
    code: 201
    input: [item_id, production_date, quantity_original, "production_batch_code?"]
    output: DateCodeLot
    side_effects: ["evaluates calculations.sell_by_instant; quantity_on_hand = quantity_original; current_price_cents = Item.base_retail_cents; current_rung_index = -1; status = FRESH; evaluates calculations.expected_sell_through and calculations.markdown_liability"]
  - method: POST
    path: "/fresh/lots/{lotId}/markdowns"
    description: "Mark the lot down and cut a MarkdownLabel. Optimistically concurrent on the lot: expected_lot_version must equal DateCodeLot.version. pricing_variant selects LADDER_DAYS (default) or SELL_THROUGH; supplying override_price_cents selects MANUAL_OVERRIDE and requires DepartmentManager plus an approval_manager_user_id different from the caller."
    roles: [FreshClerk, DepartmentManager]
    code: 201
    input: [expected_lot_version, "pricing_variant?", "override_price_cents?", "approval_manager_user_id?"]
    output: MarkdownLabel
    side_effects: ["increments DateCodeLot.version by 1", "evaluates calculations.ladder_rung_selection and calculations.markdown_price", "rewrites DateCodeLot.current_price_cents, current_rung_index and total_discount_pct", "lot status FRESH -> MARKED_DOWN, or MARKED_DOWN -> MARKED_DOWN on a strictly deeper re-ladder", "creates a MarkdownLabel in QUEUED; on a re-ladder sets supersedes_label_id to the lot's newest non-VOIDED label and VOIDs that label", "recomputes calculations.expected_sell_through and calculations.markdown_liability"]
  - method: POST
    path: "/fresh/lots/{lotId}/markdown-void"
    description: "Void the lot's live markdown and restore the shelf price to Item.base_retail_cents, returning the lot to FRESH"
    roles: [DepartmentManager]
    code: 200
    input: ["reason_note?"]
    output: DateCodeLot
    side_effects: ["increments DateCodeLot.version by 1", "lot status MARKED_DOWN -> FRESH; current_price_cents = Item.base_retail_cents; current_rung_index = -1; total_discount_pct = 0", "VOIDs every non-VOIDED MarkdownLabel on the lot", "recomputes calculations.expected_sell_through and calculations.markdown_liability"]
  - method: POST
    path: "/fresh/lots/{lotId}/sales"
    description: "Post register sales against the lot at its live shelf price"
    roles: [FreshClerk, DepartmentManager]
    code: 200
    input: [quantity_units, "register_lane_code?"]
    output: DateCodeLot
    side_effects: ["increments DateCodeLot.version by 1", "quantity_on_hand -= quantity_units; units_sold += quantity_units", "revenue_cents += quantity_units * current_price_cents; markdown_giveback_cents += quantity_units * (Item.base_retail_cents - current_price_cents)", "lot status -> DEPLETED when quantity_on_hand reaches 0, which also VOIDs every non-VOIDED label", "recomputes calculations.expected_sell_through and calculations.markdown_liability"]
  - method: POST
    path: "/fresh/lots/{lotId}/withdraw"
    description: "Pull the lot from the shelf; the remaining units become a WITHDRAWAL_AUTO shrink event so calculations.lot_unit_conservation still balances"
    roles: [DepartmentManager, ComplianceAuditor]
    code: 200
    input: ["reason_note?"]
    output: DateCodeLot
    side_effects: ["increments DateCodeLot.version by 1", "lot status FRESH|MARKED_DOWN|DONATION_PENDING -> WITHDRAWN", "creates a ShrinkEvent with origin = WITHDRAWAL_AUTO, cause_code = SPOILAGE, status = VERIFIED and verified_by_user_id = 'system' for the remaining quantity_on_hand, then sets quantity_on_hand = 0 and units_shrunk += that quantity", "REJECTs every DonationLotAssignment of the lot in status ASSIGNED, decrements those pickups' assignment_count and recomputes their provisional_value_cents", "VOIDs every non-VOIDED label", "recomputes calculations.markdown_liability, calculations.shrink_cost_ratio and calculations.department_compliance_posture"]
  - method: POST
    path: "/fresh/lots/{lotId}/scan-price-checks"
    description: "Record a register scan-price check against the lot's live price; a variance of at least 25 cents in the customer's disfavour withdraws the lot from the shelf"
    roles: [FreshClerk, DepartmentManager]
    code: 201
    input: [register_lane_code, scanned_price_cents]
    output: ScanPriceCheck
    side_effects: ["evaluates calculations.scan_price_enforcement", "snapshots the lot's APPLIED label barcode into label_barcode_snapshot", "when enforcement_action == LOT_WITHDRAWN, performs the full withdraw cascade described on POST /fresh/lots/{lotId}/withdraw"]
  - method: POST
    path: "/fresh/markdown-labels/{labelId}/print"
    description: "Print a QUEUED markdown label"
    roles: [FreshClerk, DepartmentManager]
    code: 200
    input: []
    output: MarkdownLabel
    side_effects: ["status QUEUED -> PRINTED; sets printed_at to the logical clock"]
  - method: POST
    path: "/fresh/markdown-labels/{labelId}/apply"
    description: "Record that a PRINTED label was physically applied to the product; an APPLIED label adds the promo lift to the lot's expected sell-through"
    roles: [FreshClerk, DepartmentManager]
    code: 200
    input: []
    output: MarkdownLabel
    side_effects: ["status PRINTED -> APPLIED; sets applied_at to the logical clock", "recomputes calculations.expected_sell_through for the lot, now including PROMO_LIFT_PCT"]
  - method: POST
    path: "/fresh/markdown-labels/{labelId}/void"
    description: "Void a label without changing the shelf price (e.g. a mis-printed tag)"
    roles: [DepartmentManager]
    code: 200
    input: []
    output: MarkdownLabel
    side_effects: ["status QUEUED|PRINTED|APPLIED -> VOIDED", "recomputes calculations.expected_sell_through for the lot, which loses PROMO_LIFT_PCT when no APPLIED label remains"]

  # --- donation writes ------------------------------------------------------
  - method: POST
    path: "/fresh/donation-pickups"
    description: "Reserve a dock window for a food-bank pickup. The requested window is compared against the store's other SCHEDULED and CONFIRMED pickups on the same dock door as a CLOSED interval widened by 30 minutes on both sides (calculations.dock_window_conflict)."
    roles: [StoreOperationsAdmin, DepartmentManager]
    code: 201
    input: [store_id, partner_id, dock_door_code, scheduled_window_start, scheduled_window_end]
    output: DonationPickup
    side_effects: ["evaluates calculations.dock_window_conflict", "logistics_status = SCHEDULED and manifest_status = DRAFT (the two dimensions are independent)", "assignment_count = 0, provisional_value_cents = 0, credit_rate_pct = 0, manifest_credit_cents = 0"]
  - method: POST
    path: "/fresh/donation-pickups/{pickupId}/assignments"
    description: "Add a lot to the pickup's DRAFT manifest; the line snapshots the lot's live price so later repricing cannot move the manifest value"
    roles: [FreshClerk, DepartmentManager]
    code: 201
    input: [lot_id, quantity_units]
    output: DonationLotAssignment
    side_effects: ["evaluates calculations.donation_eligibility", "creates the line in ASSIGNED with unit_price_cents_snapshot = DateCodeLot.current_price_cents and line_value_cents = quantity_units * that snapshot; line_credit_cents stays 0 until the manifest is sealed", "lot status FRESH|MARKED_DOWN -> DONATION_PENDING", "increments DonationPickup.assignment_count and recomputes provisional_value_cents", "increments DateCodeLot.version by 1"]
  - method: POST
    path: "/fresh/donation-pickups/{pickupId}/seal"
    description: "Seal the manifest and value it: the credit tier is keyed on provisional_value_cents, then each line is credited and rounded individually before the lines are summed"
    roles: [DepartmentManager]
    code: 200
    input: []
    output: DonationPickup
    side_effects: ["manifest_status DRAFT -> SEALED, leaving logistics_status untouched", "runs calculations.donation_manifest_valuation over the ASSIGNED lines and writes provisional_value_cents, credit_rate_pct, manifest_credit_cents and every line's line_credit_cents"]
  - method: POST
    path: "/fresh/donation-pickups/{pickupId}/confirm"
    description: "The food bank confirms it will collect; the manifest may still be DRAFT at this point"
    roles: [DonationPartner]
    code: 200
    input: []
    output: DonationPickup
    side_effects: ["logistics_status SCHEDULED -> CONFIRMED, leaving manifest_status untouched"]
  - method: POST
    path: "/fresh/donation-pickups/{pickupId}/complete"
    description: "The food bank records the collection; requires logistics CONFIRMED and manifest SEALED"
    roles: [DonationPartner]
    code: 200
    input: []
    output: DonationPickup
    side_effects: ["logistics_status CONFIRMED -> COMPLETED and sets completed_at", "every ASSIGNED line becomes PICKED_UP; each lot's units_donated grows and quantity_on_hand shrinks", "fully drained lots become DONATED and their labels are VOIDED; partially drained lots return to MARKED_DOWN or FRESH by current_rung_index", "sets units_picked_up_total; increments FoodBankPartner.pickups_completed_count and units_received_total", "recomputes calculations.markdown_liability, calculations.shrink_cost_ratio and calculations.department_compliance_posture for every affected department"]
  - method: POST
    path: "/fresh/donation-pickups/{pickupId}/cancel"
    description: "Cancel a SCHEDULED or CONFIRMED pickup and release its dock window"
    roles: [DepartmentManager, DonationPartner]
    code: 200
    input: ["cancel_reason?"]
    output: DonationPickup
    side_effects: ["logistics_status SCHEDULED|CONFIRMED -> CANCELLED", "every ASSIGNED line becomes REJECTED and each lot leaves DONATION_PENDING for MARKED_DOWN or FRESH by its current_rung_index", "the dock window is released, so a later pickup may occupy the overlapping interval", "recomputes calculations.markdown_liability for every affected department"]
  - method: POST
    path: "/fresh/donation-pickups/{pickupId}/reconcile"
    description: "Reconcile a SEALED manifest after the truck outcome is known; the credit is recomputed over the PICKED_UP lines only"
    roles: [DepartmentManager]
    code: 200
    input: []
    output: DonationPickup
    side_effects: ["manifest_status SEALED -> RECONCILED", "reruns calculations.donation_manifest_valuation over the PICKED_UP lines, so REJECTED lines drop out of manifest_credit_cents"]

  # --- shrink writes --------------------------------------------------------
  - method: POST
    path: "/fresh/shrink-events"
    description: "Record shrink against a lot by cause code; the event moves no units until a different user verifies it"
    roles: [FreshClerk, DepartmentManager]
    code: 201
    input: [lot_id, cause_code, quantity_units, "note?"]
    output: ShrinkEvent
    side_effects: ["status = RECORDED, origin = MANUAL, recorded_by_user_id = X-User-ID", "snapshots unit_cost_cents_snapshot from Item.unit_cost_cents and computes cost_value_cents and retail_value_cents", "no unit movement: DateCodeLot.quantity_on_hand and units_shrunk are untouched"]
  - method: POST
    path: "/fresh/shrink-events/{shrinkEventId}/verify"
    description: "A manager other than the recorder verifies the shrink; this is the call that actually moves units and can cascade four levels deep"
    roles: [DepartmentManager]
    code: 200
    input: []
    output: ShrinkEvent
    side_effects: ["status RECORDED -> VERIFIED; sets verified_by_user_id and verified_at", "hop 1: lot units_shrunk += quantity_units and quantity_on_hand -= quantity_units", "hop 2: a lot drained to zero becomes DEPLETED", "hop 3: that depletion VOIDs its labels and recomputes calculations.markdown_liability", "hop 4: the moved shrink cost recomputes calculations.shrink_cost_ratio and calculations.department_compliance_posture"]
  - method: POST
    path: "/fresh/shrink-events/{shrinkEventId}/dispute"
    description: "Dispute a shrink event. Disputing a RECORDED event moves nothing; disputing a VERIFIED MANUAL event is the compensating action that returns the units to the lot."
    roles: [DepartmentManager, ComplianceAuditor]
    code: 200
    input: ["dispute_note?"]
    output: ShrinkEvent
    side_effects: ["status RECORDED|VERIFIED -> DISPUTED; clears verified_by_user_id and verified_at", "from VERIFIED only: lot units_shrunk -= quantity_units and quantity_on_hand += quantity_units, restoring calculations.lot_unit_conservation, and a DEPLETED lot returns to MARKED_DOWN or FRESH by current_rung_index", "from VERIFIED only: recomputes calculations.markdown_liability, calculations.shrink_cost_ratio and calculations.department_compliance_posture"]
  - method: POST
    path: "/fresh/shrink-events/{shrinkEventId}/resubmit"
    description: "The clerk resubmits a disputed event with a corrected quantity; the original unit_cost_cents_snapshot is preserved so the cost basis cannot be re-dated"
    roles: [FreshClerk]
    code: 200
    input: [quantity_units, "note?"]
    output: ShrinkEvent
    side_effects: ["status DISPUTED -> RECORDED", "overwrites quantity_units, note, recorded_by_user_id (the resubmitting clerk) and retail_value_cents; preserves unit_cost_cents_snapshot and recomputes cost_value_cents", "no unit movement until the event is verified again"]
  - method: POST
    path: "/fresh/shrink-events/{shrinkEventId}/void"
    description: "Void a disputed shrink event for good"
    roles: [DepartmentManager]
    code: 200
    input: []
    output: ShrinkEvent
    side_effects: ["status DISPUTED -> VOIDED; a VOIDED event never contributes units or cost to any report"]

  # --- compliance audit writes ---------------------------------------------
  - method: POST
    path: "/fresh/compliance-audits"
    description: "Open a past-date compliance audit window on a department. Windows on the same department are compared HALF-OPEN [start, end) with no buffer, so a window starting exactly when another ends is accepted (calculations.audit_window_conflict)."
    roles: [ComplianceAuditor]
    code: 201
    input: [department_id, window_start_at, window_end_at]
    output: ComplianceAudit
    side_effects: ["evaluates calculations.audit_window_conflict against the department's PENDING and ESCALATED audits", "sweep_status = NOT_STARTED and disposition_status = PENDING (independent dimensions); severity = NONE", "sets opened_by_user_id = X-User-ID"]
  - method: POST
    path: "/fresh/compliance-audits/{auditId}/sweep"
    description: "Walk the shelf: create one AuditFinding per past-date lot still holding units in the audited department, score each by hours past date, and band the audit's severity. Only callable once, and only while the logical clock is inside the audit window."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["sweep_status NOT_STARTED -> SWEPT; sets swept_at to the logical clock, leaving disposition_status untouched", "creates one AuditFinding per qualifying lot in DateCodeLot.created_at ASC order, each with hours_past_date, units_on_shelf, severity_multiplier and severity_points per calculations.compliance_severity", "writes past_date_lot_count, past_date_units_total, severity_points_total and the banded severity", "sets DateCodeLot.past_date_flag = true on every swept lot", "increments Department.open_finding_count by the number of findings and recomputes calculations.department_compliance_posture"]
  - method: POST
    path: "/fresh/compliance-audits/{auditId}/escalate"
    description: "Escalate a swept CRITICAL audit; escalation BLOCKS the whole department until the audit is remediated"
    roles: [ComplianceAuditor]
    code: 200
    input: ["escalation_note?"]
    output: ComplianceAudit
    side_effects: ["disposition_status PENDING -> ESCALATED, leaving sweep_status SWEPT", "recomputes calculations.department_compliance_posture, which becomes BLOCKED because an ESCALATED audit outranks every other clause", "while BLOCKED the department rejects every markdown, markdown-void, sale and donation assignment on its lots with ERR_DEPARTMENT_COMPLIANCE_BLOCKED"]
  - method: POST
    path: "/fresh/audit-findings/{findingId}/remediate"
    description: "Close one finding. remediation=WITHDRAWN pulls the lot from the shelf and runs the full withdrawal cascade; waive=true closes the finding untouched and is only permitted when the finding scored at severity_multiplier 1."
    roles: [ComplianceAuditor, DepartmentManager]
    code: 200
    input: ["remediation?", "waive?", "resolution_note?"]
    output: AuditFinding
    side_effects: ["status OPEN -> RESOLVED (remediation = WITHDRAWN) or OPEN -> WAIVED (waive = true, remediation stays NONE); sets resolved_by_user_id", "on WITHDRAWN: performs the full lot-withdrawal cascade of POST /fresh/lots/{lotId}/withdraw on the finding's lot", "decrements Department.open_finding_count", "bubble-up: closing the audit's LAST open finding moves the audit's disposition_status PENDING|ESCALATED -> REMEDIATED", "recomputes calculations.department_compliance_posture, which can drop from BLOCKED back to WATCH or COMPLIANT once the audit is REMEDIATED"]

  # --- forecast feedback writes --------------------------------------------
  - method: POST
    path: "/fresh/order-recommendations"
    description: "Compute an order quantity for an item from its shrink history over an inclusive calendar window. Optimistically concurrent on the item: expected_item_version must equal Item.version. method selects CHRONOLOGICAL_ACTUAL (default: verified and posted shrink only) or FORWARD_LOOKING_PROJECTED (adds unverified and projected shrink)."
    roles: [DepartmentManager]
    code: 201
    input: [item_id, window_start_date, window_end_date, expected_item_version, "method?"]
    output: OrderRecommendation
    side_effects: ["increments Item.version by 1", "evaluates calculations.shrink_history_order_feedback under the selected variant and writes received_units, shrink_units, shrink_rate_pct, open_units and recommended_order_units", "status = DRAFT; issued_by_user_id = null", "an existing ISSUED recommendation for the same item_id, window_start_date and window_end_date becomes SUPERSEDED and this row's supersedes_recommendation_id points at it"]
  - method: POST
    path: "/fresh/order-recommendations/{recommendationId}/issue"
    description: "Issue a DRAFT recommendation to the buying system"
    roles: [DepartmentManager]
    code: 200
    input: []
    output: OrderRecommendation
    side_effects: ["status DRAFT -> ISSUED; sets issued_by_user_id = X-User-ID"]

  # --- operational sweep and logical clock ---------------------------------
  - method: POST
    path: "/fresh/departments/{departmentId}/run-date-code-sweep"
    description: "Nightly operations run for one department, executed in this pinned order: (1) flag every lot whose sell_by_at has been reached while it still holds units (past_date_flag = true); (2) auto-mark-down every FRESH or MARKED_DOWN lot whose days_remaining has reached a strictly deeper ladder rung, using the LADDER_DAYS variant; (3) post every VERIFIED shrink event whose verified_at is at least POSTING_LAG_HOURS = 24 hours old; (4) mark MISSED every SCHEDULED or CONFIRMED pickup of this department's store whose scheduled_window_end has passed; (5) recompute the department's aggregates and posture. Increments Department.sweep_epoch by one."
    roles: [StoreOperationsAdmin, DepartmentManager]
    code: 200
    input: []
    output: { department_id: string, sweep_epoch: integer, lots_flagged_past_date: integer, lots_auto_marked_down: integer, shrink_events_posted: integer, pickups_missed: integer, markdown_liability_cents: integer, shrink_cost_ratio_pct: number, compliance_status: string }
    side_effects: ["increments Department.sweep_epoch by 1", "sets DateCodeLot.past_date_flag on newly past-date lots holding units", "auto-marks-down qualifying lots (LADDER_DAYS variant), cutting a MarkdownLabel per lot and incrementing each DateCodeLot.version", "ShrinkEvent VERIFIED -> POSTED once verified_at + 24h has been reached", "DonationPickup logistics_status SCHEDULED|CONFIRMED -> MISSED past the window end, REJECTing its ASSIGNED lines and unwinding those lots out of DONATION_PENDING", "recomputes calculations.expected_sell_through, calculations.markdown_liability, calculations.shrink_cost_ratio and calculations.department_compliance_posture"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to any UTC instant. Every date-code, markdown, donation-window, audit-window, posting-lag and lookback rule in this API reads this logical clock and NEVER the host wall clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; that startup default MUST NOT fall back to real wall-clock time."
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor, DonationPartner]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["sets the logical clock; recomputes nothing on its own — every derived field is recomputed by the next business call or ops run"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- auth -----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The role is unknown, is not listed on the endpoint, or a DonationPartner acts on a pickup whose partner_id is not its own X-User-ID"
  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong JSON type, undeclared enum member, out-of-range integer, malformed date or instant, bad pagination, unit_cost_cents >= base_retail_cents, ladder rungs not strictly ordered, or window_end not strictly after window_start"
  # --- not found ------------------------------------------------------------
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "storeId path id or store_id body FK does not exist"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "partnerId path id or partner_id body FK does not exist"
  - id: ERR_LADDER_NOT_FOUND
    http: 404
    condition: "ladderId path id or markdown_ladder_id body FK does not exist"
  - id: ERR_DEPARTMENT_NOT_FOUND
    http: 404
    condition: "departmentId path id or department_id body FK does not exist"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "itemId path id or item_id body FK does not exist"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lotId path id or lot_id body FK does not exist"
  - id: ERR_LABEL_NOT_FOUND
    http: 404
    condition: "labelId path id does not exist"
  - id: ERR_CHECK_NOT_FOUND
    http: 404
    condition: "checkId path id does not exist"
  - id: ERR_PICKUP_NOT_FOUND
    http: 404
    condition: "pickupId path id does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignmentId path id does not exist"
  - id: ERR_SHRINK_EVENT_NOT_FOUND
    http: 404
    condition: "shrinkEventId path id does not exist"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "auditId path id does not exist"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "findingId path id does not exist"
  - id: ERR_RECOMMENDATION_NOT_FOUND
    http: 404
    condition: "recommendationId path id does not exist"
  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version on POST /fresh/lots/{lotId}/markdowns does not equal DateCodeLot.version"
  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "expected_item_version on POST /fresh/order-recommendations does not equal Item.version"
  # --- state ----------------------------------------------------------------
  - id: ERR_LADDER_NOT_DRAFT
    http: 409
    condition: "Activating a ladder that is not DRAFT"
  - id: ERR_LADDER_NOT_ACTIVE
    http: 409
    condition: "Retiring a ladder that is not ACTIVE, or pricing a markdown with a ladder whose status is DRAFT or RETIRED"
  - id: ERR_LOT_NOT_PRICEABLE
    http: 409
    condition: "The lot's status forbids the requested operation: markdown or sale on a lot that is not FRESH or MARKED_DOWN, markdown-void on a lot that is not MARKED_DOWN, withdrawal of a lot with no units, or an assignment of a lot that is not FRESH or MARKED_DOWN"
  - id: ERR_LABEL_NOT_PRINTED
    http: 409
    condition: "Printing a label that is not QUEUED, or applying a label that is not PRINTED"
  - id: ERR_LABEL_ALREADY_VOIDED
    http: 409
    condition: "Voiding a label that is already VOIDED"
  - id: ERR_SHRINK_NOT_VERIFIABLE
    http: 409
    condition: "Verifying an event that is not RECORDED, or disputing an event that is neither RECORDED nor a VERIFIED MANUAL event (a POSTED event can never be disputed)"
  - id: ERR_SHRINK_NOT_DISPUTED
    http: 409
    condition: "Resubmitting or voiding an event that is not DISPUTED"
  - id: ERR_PICKUP_NOT_CONFIRMABLE
    http: 409
    condition: "Confirming a pickup whose logistics_status is not SCHEDULED"
  - id: ERR_PICKUP_NOT_COMPLETABLE
    http: 409
    condition: "Completing a pickup whose logistics_status is not CONFIRMED, or cancelling one that is already COMPLETED, CANCELLED or MISSED"
  - id: ERR_MANIFEST_NOT_SEALED
    http: 409
    condition: "Completing a pickup whose manifest_status is still DRAFT, or reconciling a manifest that is not SEALED"
  - id: ERR_MANIFEST_SEALED
    http: 409
    condition: "Adding an assignment to, or resealing, a manifest that is already SEALED or RECONCILED"
  - id: ERR_PICKUP_NOT_RECONCILABLE
    http: 409
    condition: "Reconciling a SEALED manifest whose logistics_status is still SCHEDULED or CONFIRMED"
  - id: ERR_AUDIT_ALREADY_SWEPT
    http: 409
    condition: "Sweeping an audit whose sweep_status is already SWEPT"
  - id: ERR_AUDIT_WINDOW_NOT_OPEN
    http: 409
    condition: "Sweeping while the logical clock is outside the audit's half-open window [window_start_at, window_end_at)"
  - id: ERR_FINDING_ALREADY_RESOLVED
    http: 409
    condition: "Remediating or waiving a finding whose status is not OPEN"
  - id: ERR_RECOMMENDATION_NOT_ISSUABLE
    http: 409
    condition: "Issuing a recommendation whose status is not DRAFT"
  - id: ERR_DUPLICATE_LOT_ASSIGNMENT
    http: 409
    condition: "The lot already appears on this pickup's manifest in status ASSIGNED or PICKED_UP"
  # --- business safety and segregation of duties ---------------------------
  - id: ERR_DEPARTMENT_COMPLIANCE_BLOCKED
    http: 409
    condition: "The lot's department has compliance_status BLOCKED because one of its audits is ESCALATED"
  - id: ERR_PAST_DATE_NOT_DONATABLE
    http: 422
    condition: "The logical clock has reached or passed the lot's sell_by_at, so the lot may no longer be donated"
  - id: ERR_COLD_CHAIN_NOT_CERTIFIED
    http: 422
    condition: "A MEAT or SEAFOOD lot is assigned to a partner whose cold_chain_certified is false"
  - id: ERR_SHRINK_SELF_VERIFICATION
    http: 403
    condition: "The verifying X-User-ID equals ShrinkEvent.recorded_by_user_id"
  - id: ERR_MARKDOWN_SELF_APPROVAL
    http: 403
    condition: "approval_manager_user_id equals the requesting X-User-ID"
  - id: ERR_SAMPLING_NOT_ALLOWED
    http: 422
    condition: "cause_code SAMPLING recorded against a lot whose Item.sampling_allowed is false"
  - id: ERR_WAIVER_NOT_PERMITTED
    http: 422
    condition: "waive=true on a finding whose severity_multiplier is 3 or 6"
  # --- business referential -------------------------------------------------
  - id: ERR_PARTNER_DEPARTMENT_NOT_ACCEPTED
    http: 422
    condition: "The lot's department code is not in FoodBankPartner.accepted_department_codes"
  - id: ERR_PARTNER_NOT_ACTIVE
    http: 409
    condition: "Scheduling or confirming a pickup for a SUSPENDED partner"
  - id: ERR_PARTNER_REGION_MISMATCH
    http: 422
    condition: "FoodBankPartner.service_region_code differs from Store.region_code"
  - id: ERR_LADDER_DEPARTMENT_MISMATCH
    http: 422
    condition: "MarkdownLadder.department_code differs from the Department.code it is being attached to"
  - id: ERR_ITEM_DISCONTINUED
    http: 409
    condition: "Creating a lot for an item whose status is DISCONTINUED"
  - id: ERR_DONATION_PROGRAM_DISABLED
    http: 409
    condition: "Scheduling a pickup at a SUSPENDED store or one whose donation_program_enabled is false"
  - id: ERR_DOCK_DOOR_UNKNOWN
    http: 422
    condition: "dock_door_code does not appear in Store.dock_door_codes"
  # --- business temporal ----------------------------------------------------
  - id: ERR_DONATION_WINDOW_CLOSED
    http: 422
    condition: "The logical clock is still more than 48 hours before the lot's sell_by_at, so the donation window has not opened"
  - id: ERR_DOCK_WINDOW_OVERLAP
    http: 409
    condition: "The requested dock window, widened by 30 minutes on both sides, touches another SCHEDULED or CONFIRMED pickup on the same store and dock door"
  - id: ERR_AUDIT_WINDOW_OVERLAP
    http: 409
    condition: "The requested audit window overlaps a PENDING or ESCALATED audit window on the same department under half-open comparison"
  - id: ERR_RECOMMENDATION_WINDOW_INVALID
    http: 422
    condition: "window_end_date is before window_start_date, or the window spans more than 31 days"
  # --- business constraint --------------------------------------------------
  - id: ERR_RUNG_NOT_REACHED
    http: 422
    condition: "days_remaining is greater than every rung's days_remaining_max, so no rung is satisfied"
  - id: ERR_RUNG_NOT_DEEPER
    http: 409
    condition: "The re-ladder would land on the same or a shallower rung, or the override price is not strictly below current_price_cents"
  - id: ERR_MANAGER_APPROVAL_REQUIRED
    http: 422
    condition: "An approval-gated rung or a manual override was requested without a DepartmentManager caller and a distinct approval_manager_user_id"
  - id: ERR_INSUFFICIENT_UNITS
    http: 422
    condition: "The requested units exceed DateCodeLot.quantity_on_hand at sale, shrink record, shrink resubmit, shrink verification or assignment time"
  - id: ERR_EMPTY_MANIFEST
    http: 422
    condition: "Sealing a manifest whose assignment_count is 0"
  - id: ERR_REMEDIATION_NOT_PERMITTED
    http: 422
    condition: "remediation=WITHDRAWN on a finding whose lot no longer holds units, or neither remediation nor waive supplied"
  - id: ERR_ESCALATION_NOT_WARRANTED
    http: 422
    condition: "Escalating an audit whose severity is not CRITICAL"
  - id: ERR_INSUFFICIENT_SHRINK_HISTORY
    http: 422
    condition: "No lots of the item were received inside the recommendation window, so received_units is 0"
  - id: ERR_STORE_NUMBER_DUPLICATE
    http: 409
    condition: "store_number already exists"
  - id: ERR_LADDER_NAME_DUPLICATE
    http: 409
    condition: "MarkdownLadder.name already exists"
  - id: ERR_DEPARTMENT_CODE_DUPLICATE
    http: 409
    condition: "(store_id, code) already exists"
  - id: ERR_ITEM_UPC_DUPLICATE
    http: 409
    condition: "(department_id, upc) already exists"
  # --- business fiscal ------------------------------------------------------
  - id: ERR_MAX_DISCOUNT_EXCEEDED
    http: 422
    condition: "The resulting total_discount_pct exceeds MarkdownLadder.max_total_discount_pct"
  - id: ERR_PRICE_BELOW_COST_FLOOR
    http: 422
    condition: "override_price_cents is below round_half_up(Item.unit_cost_cents * 40 / 100)"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: StoreOperationsAdmin
    description: "Division operations administrator: owns the store, partner, ladder and department registry and runs the nightly date-code sweep"
    identity: opaque
    exclusive_operations:
      - "POST /fresh/stores"
      - "PATCH /fresh/stores/{storeId}"
      - "GET /fresh/stores/{storeId}/margin-rollup (shared only with ComplianceAuditor)"
      - "POST /fresh/food-bank-partners"
      - "PATCH /fresh/food-bank-partners/{partnerId}"
      - "POST /fresh/markdown-ladders"
      - "POST /fresh/markdown-ladders/{ladderId}/activate"
      - "POST /fresh/markdown-ladders/{ladderId}/retire"
      - "POST /fresh/departments"
    shared_operations:
      - "PATCH /fresh/departments/{departmentId} (with DepartmentManager)"
      - "POST /fresh/items and PATCH /fresh/items/{itemId} (with DepartmentManager)"
      - "POST /fresh/lots (with FreshClerk and DepartmentManager)"
      - "POST /fresh/donation-pickups (with DepartmentManager)"
      - "POST /fresh/departments/{departmentId}/run-date-code-sweep (with DepartmentManager)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET read endpoint except audit-scoped reads it also holds"
  - name: DepartmentManager
    description: "Fresh department manager: approves deep markdowns, verifies shrink recorded by clerks, seals and reconciles donation manifests, and issues order recommendations"
    identity: opaque
    exclusive_operations:
      - "POST /fresh/lots/{lotId}/markdown-void"
      - "POST /fresh/markdown-labels/{labelId}/void"
      - "POST /fresh/donation-pickups/{pickupId}/seal"
      - "POST /fresh/donation-pickups/{pickupId}/reconcile"
      - "POST /fresh/shrink-events/{shrinkEventId}/verify"
      - "POST /fresh/shrink-events/{shrinkEventId}/void"
      - "POST /fresh/order-recommendations"
      - "POST /fresh/order-recommendations/{recommendationId}/issue"
      - "supplying override_price_cents on POST /fresh/lots/{lotId}/markdowns (a FreshClerk may call the endpoint but may not override the ladder price)"
    shared_operations:
      - "POST /fresh/lots and POST /fresh/lots/{lotId}/markdowns, /sales, /scan-price-checks (with FreshClerk)"
      - "POST /fresh/lots/{lotId}/withdraw (with ComplianceAuditor)"
      - "POST /fresh/markdown-labels/{labelId}/print and /apply (with FreshClerk)"
      - "POST /fresh/donation-pickups (with StoreOperationsAdmin)"
      - "POST /fresh/donation-pickups/{pickupId}/assignments (with FreshClerk)"
      - "POST /fresh/donation-pickups/{pickupId}/cancel (with DonationPartner)"
      - "POST /fresh/shrink-events (with FreshClerk)"
      - "POST /fresh/shrink-events/{shrinkEventId}/dispute (with ComplianceAuditor)"
      - "POST /fresh/audit-findings/{findingId}/remediate (with ComplianceAuditor)"
      - "POST /fresh/departments/{departmentId}/run-date-code-sweep and PATCH /fresh/departments/{departmentId} (with StoreOperationsAdmin)"
      - "GET /fresh/departments/{departmentId}/margin-report and GET /fresh/lots/{lotId}/markdown-quote"
    segregation_of_duties:
      - "The X-User-ID verifying a ShrinkEvent must differ from ShrinkEvent.recorded_by_user_id -> ERR_SHRINK_SELF_VERIFICATION (403). A manager who recorded shrink himself cannot verify it; a second manager must."
      - "approval_manager_user_id on an approval-gated or override markdown must differ from the requesting X-User-ID -> ERR_MARKDOWN_SELF_APPROVAL (403)."
  - name: FreshClerk
    description: "Fresh department clerk: receives lots, cuts and applies ladder markdowns, rings sales, runs scan-price checks and records shrink"
    identity: opaque
    exclusive_operations:
      - "POST /fresh/shrink-events/{shrinkEventId}/resubmit"
    shared_operations:
      - "POST /fresh/lots, POST /fresh/lots/{lotId}/markdowns (ladder variants only), /sales, /scan-price-checks (with DepartmentManager)"
      - "POST /fresh/markdown-labels/{labelId}/print and /apply (with DepartmentManager)"
      - "POST /fresh/donation-pickups/{pickupId}/assignments (with DepartmentManager)"
      - "POST /fresh/shrink-events (with DepartmentManager)"
      - "GET /fresh/lots/{lotId}/markdown-quote and the operational reads"
      - "POST /_clock/set_current_utc (with every role)"
  - name: ComplianceAuditor
    description: "Division food-safety auditor: opens and sweeps past-date audits, escalates critical findings, disputes questionable shrink and pulls product from the shelf"
    identity: opaque
    exclusive_operations:
      - "POST /fresh/compliance-audits"
      - "POST /fresh/compliance-audits/{auditId}/sweep"
      - "POST /fresh/compliance-audits/{auditId}/escalate"
    shared_operations:
      - "POST /fresh/audit-findings/{findingId}/remediate (with DepartmentManager)"
      - "POST /fresh/lots/{lotId}/withdraw (with DepartmentManager)"
      - "POST /fresh/shrink-events/{shrinkEventId}/dispute (with DepartmentManager)"
      - "GET /fresh/departments/{departmentId}/margin-report and GET /fresh/stores/{storeId}/margin-rollup (with StoreOperationsAdmin)"
      - "the audit, finding, lot, shrink and department reads"
      - "POST /_clock/set_current_utc (with every role)"
    note: "Cannot price, sell or donate product: every markdown, sale, label, manifest and order-recommendation write returns ERR_UNAUTHORIZED for this role."
  - name: DonationPartner
    description: "Food-bank coordinator acting as its own FoodBankPartner row: confirms, completes or cancels the pickups booked for it and reads their manifests"
    identity: "entity_backed:FoodBankPartner"
    exclusive_operations:
      - "POST /fresh/donation-pickups/{pickupId}/confirm"
      - "POST /fresh/donation-pickups/{pickupId}/complete"
    shared_operations:
      - "POST /fresh/donation-pickups/{pickupId}/cancel (with DepartmentManager)"
      - "GET /fresh/donation-pickups, GET /fresh/donation-pickups/{pickupId}, GET /fresh/donation-assignments and GET /fresh/donation-assignments/{assignmentId}"
      - "GET /fresh/food-bank-partners/{partnerId}"
      - "POST /_clock/set_current_utc (with every role)"
    note: "X-User-ID must equal FoodBankPartner.id. Acting on a pickup whose partner_id differs returns ERR_UNAUTHORIZED (403) at validation priority 6 — after the endpoint role check and after path existence, so a non-existent pickup still returns 404."
