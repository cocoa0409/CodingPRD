    side_effects: []
  - method: GET
    path: "/nabs/skus/{id}/order-lines"
    description: "Reverse-reachability: order lines that contain this SKU"
    roles: [PlatformAdmin, ShopStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  # --- Inventory Lots ---
  - method: POST
    path: "/nabs/skus/{id}/lots"
    description: "Receive a new lot"
    roles: [PlatformAdmin, ShopStaff]
    code: 201
    input: ["lot_code", "qty_received", "unit_cost_cents", "expires_on", "quarantine_reason?"]
    output: InventoryLot
    side_effects: ["qty_remaining := qty_received; status computed; SKU.on_hand_cached recomputed"]
  - method: GET
    path: "/nabs/skus/{id}/lots"
    description: "Reverse-reachability: lots under SKU"
    roles: [PlatformAdmin, ShopStaff]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: InventoryLot[]
    side_effects: []
  - method: GET
    path: "/nabs/lots/{id}"
    description: "Fetch one lot"
    roles: [PlatformAdmin, ShopStaff]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: POST
    path: "/nabs/lots/{id}/quarantine"
    description: "Quarantine a lot (compliance)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["quarantine_reason"]
    output: InventoryLot
    side_effects: ["status := QUARANTINED; SKU.on_hand_cached recomputed"]
  - method: POST
    path: "/nabs/lots/{id}/release-quarantine"
    description: "Release a quarantined lot"
    roles: [ComplianceOfficer]
    code: 200
    input: []
