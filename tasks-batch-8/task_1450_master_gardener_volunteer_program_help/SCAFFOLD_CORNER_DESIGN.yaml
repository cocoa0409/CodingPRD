        grounds: [calculations.application_composite_score]
        excluded_because:
          difficulty_instance: composite_score_tiered_bonus_and_cap
          rationale: "Composite formula (weights, tiered bonus, county bonus, cap) asserted with literals 95.0 and 100.0 in the §1.8 instance."

      - name: project_cap_partial_truncation
        claim_type: correct_result
        grounds: [calculations.project_credit_cap]
        excluded_because:
          difficulty_instance: service_hours_provisional_vs_official_project_cap
          rationale: "The second 8.0 project entry truncated to 4.5 against the 12.5 cap is the core of that §1.8 instance's official == 22.5 assertion."

      - name: referral_due_at_constant
        claim_type: constants_applied
        grounds: [calculations.referral_sla_due_at]
        excluded_because:
          difficulty_instance: referral_sla_due_at_exact_equality
          rationale: "due_at == created + 48h is asserted as the literal 2026-08-07T10:00:00Z in that §1.8 instance."

      - name: outreach_gold_bonus_application
        claim_type: correct_result
        grounds: [calculations.recognition_tier_and_points]
        excluded_because:
          difficulty_instance: recognition_tier_pinned_evaluation_order
          rationale: "GOLD-tier outreach bonus (+0.25 x outreach hours) asserted via recognition_points == 40.5 in the §1.8 instance."

  # ---------------------------------------------------------------------------
  # Validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request sent without X-User-ID / X-User-Role headers fails at priority 1 before any other check."
        test_recipe:
          setup: ["empty DB; the trigger request is sent with BOTH auth headers omitted"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http status == 400   (headers stripped by the test driver)"

      - name: volunteer_cannot_approve_credit_entry
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The Volunteer role is absent from the approve endpoint's roles; even the entry's owner gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE with one PENDING entry"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 5.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /credit-entries/${e1}/approve", as: Volunteer, as_user_id: "${vol}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN and http status == 403"
            - "CreditEntry.${e1}.status == PENDING"

      - name: volunteer_cannot_cancel_other_volunteers_signup
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Ownership: V2 (role Volunteer, allowed on the endpoint) is rejected with ERR_NOT_RESOURCE_OWNER when cancelling V1's signup."
        test_recipe:
          setup: ["cycle 2026 OPEN; V1 ACTIVE with SIGNED_UP signup; V2 exists (TRAINEE, accepted)"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app1: $.data.id } }
            - { call: "POST /applications/${app1}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app1}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app1}", as: ProgramCoordinator, captures: { vol1: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol1}" }, as: ProgramCoordinator, captures: { enr1: $.data.id } }
            - { call: "POST /training-enrollments/${enr1}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr1}/complete", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Bob Birch", email: "bob@example.org", county: "Cecil", prior_gardening_years: 3 }, as: ProgramCoordinator, captures: { app2: $.data.id } }
            - { call: "POST /applications/${app2}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app2}", as: ProgramCoordinator, captures: { vol2: "$.data[0].id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-20T09:00:00Z", end_time: "2026-08-20T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol1}" }, as: Volunteer, as_user_id: "${vol1}", captures: { su1: $.data.id } }
          trigger:
            - { call: "POST /shift-signups/${su1}/cancel", as: Volunteer, as_user_id: "${vol2}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_RESOURCE_OWNER and http status == 403"
            - "ShiftSignup.${su1}.status == SIGNED_UP"

      - name: not_found_beats_ownership_returns_404
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "A Volunteer-role call against a nonexistent path volunteerId returns 404 ERR_NOT_FOUND (existence, priority 4) rather than ERR_NOT_RESOURCE_OWNER (ownership, priority 5)."
        test_recipe:
          setup: ["cycle 2026 OPEN; one real volunteer exists (identity of the caller)"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
          trigger:
            - { call: "POST /volunteers/00000000-0000-0000-0000-000000000000/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 2.0 }, as: Volunteer, as_user_id: "${vol}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND and http status == 404   (existence precedes ownership)"

      - name: schema_beats_existence_returns_400
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "POST /applications missing required email AND referencing a nonexistent cycle_id returns 400 ERR_INVALID_REQUEST (schema, priority 3) rather than 404 (existence, priority 4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /applications", payload: { cycle_id: "00000000-0000-0000-0000-000000000000", applicant_name: "No Email", county: "Harford", prior_gardening_years: 2 }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST and http status == 400   (schema precedes existence)"

  # ---------------------------------------------------------------------------
  # Endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: clock_default_and_set_roundtrip
        claim_type: action_endpoint
        grounds: ['endpoints[POST /_clock/set_current_utc]']
        distinguishing_aspect: "Before any set call the logical clock reads exactly 2026-08-01T00:00:00Z (resource created_at proves it); after set_current_utc, new resources stamp the new time."
        test_recipe:
          setup: ["empty DB; clock never set yet"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id, ts0: $.data.created_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: ProgramCoordinator, captures: { now: $.data.current_utc } }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { ts1: $.data.created_at } }
          assert:
            - "captured ts0 == 2026-08-01T00:00:00Z   (fixed startup default)"
            - "captured now == 2026-08-15T00:00:00Z   (set echoes)"
            - "captured ts1 == 2026-08-15T00:00:00Z   (new writes use the logical clock)"

      - name: shifts_filter_by_kind_returns_only_matching
        claim_type: listing
        grounds: ['endpoints[GET /shifts]']
        distinguishing_aspect: "The kind filter narrows the list: with one HELP_DESK and one OUTREACH shift, ?kind=OUTREACH returns exactly one row."
        test_recipe:
          setup: ["cycle 2026 OPEN; one HELP_DESK shift and one OUTREACH shift at different locations/times"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T09:00:00Z", end_time: "2026-08-10T12:00:00Z", capacity: 2 }, as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "OUTREACH", location: "Fair", start_time: "2026-08-15T10:00:00Z", end_time: "2026-08-15T14:00:00Z", capacity: 4 }, as: ProgramCoordinator, captures: { sho: $.data.id } }
          trigger:
            - { call: "GET /shifts?kind=OUTREACH", as: ProgramCoordinator }
          assert:
            - "response total_count == 1 and the single row id == ${sho} with kind OUTREACH"

      - name: shift_completion_mints_quarter_rounded_entry
        claim_type: conditional_action
        grounds: ['endpoints[POST /shift-signups/{signupId}/complete]', calculations.shift_credit_hours]
        excluded_because:
          difficulty_instance: shift_credit_per_entry_rounding
          rationale: "Minting on completion with per-entry quarter rounding (100 min -> 1.75) is asserted in the §1.8 rounding instance."

