              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /maa/airports/${ap_id}/run_ops"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == ERR_UNAUTHORIZED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_invoice_version_occ_conflict
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[invoice-settle-stale-version]"]
        distinguishing_aspect: "Invoice OCC: two sequential settlement events; the second uses a stale expected_invoice_version → 412."
        test_recipe:
          setup:
            - "Walk through to FINAL invoice; capture version v0; DISPUTE (version advances); then attempt RESOLVE_PAID with the stale v0"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
