              payload: { business_name: "Occ Mart", tax_id: "TAX-CC1", commission_rate: 0.06 }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-CC1" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "OC-1", price_cents: 100, draw_date: "2026-05-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
            - call: "GET /retailers/${rid}"
              payload: {}
              as: LotteryOfficer
              captures: { rv: $.data.version }
            - call: "POST /commission-settlements"
              payload: { retailer_id: "${rid}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_retailer_version: "${rv}" }
              as: LotteryOfficer
              as_user_id: "u-prep"
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /commission-settlements"
              payload: { retailer_id: "${rid}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", expected_retailer_version: "${rv}" }
