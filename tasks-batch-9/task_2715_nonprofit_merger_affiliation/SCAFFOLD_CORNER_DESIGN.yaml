            - call: "POST /diligence-requests/${finding}/clear"
              payload: { clearance_note: "Reconciled against audited schedule" }
              as: DiligenceLead
              as_user_id: "dl-002"
            - call: "POST /restructurings/${deal}/select-structure"
              payload: { structure_type: "MERGER", unrestricted_transfer_value_cents: 200000000 }
