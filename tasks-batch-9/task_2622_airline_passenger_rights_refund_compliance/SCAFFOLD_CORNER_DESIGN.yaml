        test_recipe:
          setup:
            - "Booking total_fare_cents = 90000 (CREDIT_CARD) with segments 30000 + 60000; segment 1 cancelled, so the cascade already minted a PROACTIVE FARE obligation of the full 90000 and headroom is exactly 0."
          setup_api_calls:
