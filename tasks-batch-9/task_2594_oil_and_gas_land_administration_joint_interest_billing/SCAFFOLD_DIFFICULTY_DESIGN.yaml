              payload: {}
              as: JointInterestAccountant
          assert:
            - "the June issuance in setup returned HTTP 200 while pooling_status was POOLED_EFFECTIVE, with JibStatement.${stmt_june_id}.total_billed_cents == 1153008 (1000005 + 100003 + round_half_up(0.05 * 1000005 + 0.03 * 100003) = 53000)"
            - "before the trigger: JibStatement.${stmt_may_id}.statement_status == DRAFT with provisional total_billed_cents == 225000 (direct 200000 + overhead max(round_half_up(0.03 * 200000) = 6000, 25000) = 25000)"
            - "before the trigger: Lease.${lease1_id}.tenure_status == EXPIRED and Well.${well_id}.pooling_status == POOLED_TERMINATED"
            - "before the trigger: Well.${well_id}.well_status == SHUT_IN, so the PRODUCING activity_class is still acceptable and pooling is the only failing dependency"
            - "the trigger returns HTTP 409 with error_id ERR_WELL_NOT_POOLED"
            - "after the trigger: JibStatement.${stmt_may_id}.statement_status == DRAFT, issued_at == null, payment_due_date == null"
