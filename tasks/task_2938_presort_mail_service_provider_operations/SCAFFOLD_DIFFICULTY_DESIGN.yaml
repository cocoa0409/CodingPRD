            - "No PostageStatement row was created: GET /commingle-batches/${batch_id}/postage-statements returns an empty list, and CommingleBatch.${batch_id}.status is still OPEN"
            - "After sorting: CommingleBatch.${batch_id}.status == SORTED with achieved_tier THREE_DIGIT, rate_mills_per_piece 26384 and batch_postage_cents 79152, and ${batch_v_sorted} is greater than ${batch_v_open}"
            - "Second attempt: HTTP 201 with PostageStatement.${stmt_id}.statement_piece_count == 3000, rate_mills_per_piece == 26384, declared_postage_cents == 79152, status DRAFT and revision_index 0"
