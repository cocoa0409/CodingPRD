  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_guarded_by_contributor_status
        grounds:
          - state_machines.Assignment.DRAFT_to_OFFERED
          - state_machines.Contributor.ACTIVE_to_SUSPENDED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          Pair Assignment -> Contributor: the DRAFT -> OFFERED transition is
          guarded by the Contributor being ACTIVE; a SUSPENDED contributor's
          assignment cannot be offered even though the assignment row itself is
          in a valid from-state.
        test_recipe:
          setup:
            - "DeskConfig defaults; contributor S with ACTIVE rate agreement, then contributor SUSPENDED; assignment in DRAFT"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Suspended Sam", email: "sam@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { contrib_s: $.data.id, contrib_s_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${contrib_s}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 50000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${contrib_s_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_s}", title: "SS", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_s: $.data.id }
            - call: "POST /freelance-desk/contributors/${contrib_s}/suspend"
              payload: {}
              as: DeskAdmin
          trigger:
            - call: "POST /freelance-desk/assignments/${asg_s}/offer"
              payload: {}
              as: Editor
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (contributor SUSPENDED guards offer)"
            - "Assignment.${asg_s}.editorial_status remains DRAFT"

      - name: batch_add_guarded_by_invoice_status
        grounds:
          - state_machines.PaymentBatch.OPEN_to_LOCKED
          - state_machines.Invoice.VERIFIED_to_APPROVED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          Pair PaymentBatch -> Invoice (different pair from Assignment ->
          Contributor): add-invoice requires the INVOICE (not the batch) to be
          APPROVED; a merely VERIFIED invoice in an otherwise OPEN batch is
          rejected, and the batch membership stays empty.
        test_recipe:
          setup:
            - "DeskConfig defaults; contributor with VERIFIED W9, FLAT 50000, assignment accepted, invoice VERIFIED but not APPROVED; OPEN batch exists"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
