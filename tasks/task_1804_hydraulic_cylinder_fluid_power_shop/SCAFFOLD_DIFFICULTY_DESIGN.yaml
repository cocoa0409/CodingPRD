            - { call: "POST /fluid-power/field-service-jobs", payload: { customer_id: "${cust_id}", site_address: "8 Mill St", distance_km: 40, assemblies: [{ hose_type: "THERMOPLASTIC", length_m: 1.5, fitting_price_cents: 1200, crimp_spec_mm: 19.5 }] }, as: ServiceAdvisor, captures: { job2_id: "$.data.id" } }
            - { call: "POST /fluid-power/field-service-jobs/${job1_id}/schedule", payload: { technician_id: "${tech2_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_technician_version: "${tech2_v}" }, as: ServiceAdvisor }
            - { call: "GET /fluid-power/technicians/${tech2_id}", payload: {}, as: ServiceAdvisor, captures: { tech2_v2: "$.data.version" } }
          trigger:
            - { call: "POST /fluid-power/field-service-jobs/${job2_id}/schedule", payload: { technician_id: "${tech2_id}", window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_technician_version: "${tech2_v2}" }, as: ServiceAdvisor, captures: { job2_status: "$.data.status" } }
            - { call: "POST /fluid-power/field-service-jobs", payload: { customer_id: "${cust_id}", site_address: "3 Dock Ln", distance_km: 20, assemblies: [{ hose_type: "SPIRAL_4SH", length_m: 1.0, fitting_price_cents: 2200, crimp_spec_mm: 33.0 }] }, as: ServiceAdvisor, captures: { job3_id: "$.data.id" } }
            - { call: "GET /fluid-power/technicians/${tech2_id}", payload: {}, as: ServiceAdvisor, captures: { tech2_v3: "$.data.version" } }
            - call: "POST /fluid-power/field-service-jobs/${job3_id}/schedule"
              payload: { technician_id: "${tech2_id}", window_start: "2026-08-03T11:00:00Z", window_end: "2026-08-03T13:00:00Z", expected_technician_version: "${tech2_v3}" }
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "[12:00,14:00] adjacent to [10:00,12:00] succeeds (${job2_status} == SCHEDULED): half-open intervals touch without overlapping"
            - "[11:00,13:00] rejected with ERR_TECHNICIAN_WINDOW_OVERLAP (409): true intersection with both existing jobs"
            - "no buffer is required between a technician's jobs (contrast with test bay)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: material_length_conservation_reserve_release
        grounds:
          - calculations.stock_cut_allocation
          - state_machines.StockReservation.OPEN_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: total tracked material millimetres. Cutting 500mm
          (+3mm kerf) from a 1000mm piece then releasing the reservation returns
          the cut piece as a 500mm REMNANT item, so AVAILABLE lengths 497 + 500
          plus kerf loss 3 exactly reconstitute the received 1000mm — no drift.
        test_recipe:
          setup:
            - "Approved WO whose auto-created rod reservation (cut 500, kerf 3) drew down a 1000mm piece to 497mm"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-F01", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: true, rod_cut_length_mm: 500, tube_needed: false, honing_passes: 1, estimated_labor_hours: 2.5 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/inventory-items", payload: { material: "CHROME_ROD", diameter_mm: 45, length_mm: 1000, cost_per_mm_cents: 42 }, as: ShopAdmin, captures: { rod_item_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/quotes/${quote_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /fluid-power/stock-reservations?work_order_id=${wo_id}", payload: {}, as: ServiceAdvisor, captures: { res_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /fluid-power/stock-reservations/${res_id}/release", payload: {}, as: ServiceAdvisor, captures: { res_status: "$.data.status" } }
            - { call: "GET /fluid-power/inventory-items?material=CHROME_ROD&status=AVAILABLE", payload: {}, as: ServiceAdvisor, captures: { remnant_len: "$.data[1].length_mm", remnant_origin: "$.data[1].origin" } }
          assert:
            - "StockReservation.${res_id}.status == RELEASED with scrap_length_mm == 0"
            - "InventoryItem.${rod_item_id}.length_mm == 497 (unchanged by the release)"
            - "a second AVAILABLE InventoryItem exists with length_mm == 500 and origin == REMNANT (${remnant_len} == 500, ${remnant_origin} == REMNANT)"
            - "conservation: 497 + 500 + 3 (kerf) == 1000 mm received"

      - name: exchange_pool_count_conservation_reserve_release
        grounds:
          - state_machines.ExchangeUnit.RESERVED_to_IN_POOL
          - entities.ExchangeUnit.fields.status
        distinguishing_aspect: |
          Conserved quantity: pool availability COUNT (a different conserved
          quantity than material length). Reserving a unit decrements the IN_POOL
          count by one; the compensating release restores it to exactly two and
          nulls all deal fields — no residue.
        test_recipe:
          setup:
            - "WO with SENT quote; two matching exchange units IN_POOL"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-G01", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "drift" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: false, tube_needed: false, honing_passes: 0, estimated_labor_hours: 1.0 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/exchange-units", payload: { bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", unit_price_cents: 250000 }, as: ShopAdmin, captures: { unit1_id: "$.data.id" } }
            - { call: "POST /fluid-power/exchange-units", payload: { bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", unit_price_cents: 260000 }, as: ShopAdmin, captures: { unit2_id: "$.data.id" } }
          trigger:
            - { call: "POST /fluid-power/work-orders/${wo_id}/select-exchange", payload: { exchange_unit_id: "${unit1_id}" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /fluid-power/exchange-units?status=IN_POOL", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/exchange-units/${unit1_id}/release", payload: {}, as: ServiceAdvisor }
            - { call: "GET /fluid-power/exchange-units?status=IN_POOL", payload: {}, as: ServiceAdvisor }
          assert:
            - "after select-exchange: GET /fluid-power/exchange-units?status=IN_POOL total_count == 1"
            - "after release: GET /fluid-power/exchange-units?status=IN_POOL total_count == 2 (count conserved)"
            - "ExchangeUnit.${unit1_id}.work_order_id == null and provisional_credit_cents == null after release"
