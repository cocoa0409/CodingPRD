      - name: open_deviation_count_invariant_after_supersede
        grounds:
          - entities.Negotiation.fields.open_deviation_count
          - entities.Negotiation.fields.blocking_deviation_count
          - state_machines.Deviation.OPEN_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity: open_deviation_count + blocking_deviation_count
          on a Negotiation. Forward action: create Deviation on clause A
          (both counters +1). Compensating action: create a second Deviation
          on the SAME clause A (supersedes the first: -1 for the superseded,
          +1 for the new). Net change == 0 — the system MUST NOT drift.
        test_recipe:
          setup:
            - "Negotiation in REDLINING"
            - "Initial open_deviation_count == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
