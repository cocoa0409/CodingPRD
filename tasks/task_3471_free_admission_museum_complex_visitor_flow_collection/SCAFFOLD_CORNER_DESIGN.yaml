  # ===========================================================================
  - section: validations
    instances:
      - name: validation_priority_role_beats_state
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=5]
        distinguishing_aspect: "A cancel attempt that violates BOTH role authorization (SecurityScreener may not cancel passes) and state (pass already CANCELLED) must return ERR_UNAUTHORIZED_ROLE — priority 2 beats priority 5."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Timed museum; one pass RESERVED then cancelled by its owner (now CANCELLED)."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "NMNH", display_name: "Natural History", requires_timed_pass: true, quarter_hour_pass_quota: 5, daily_pass_quota: 20, screening_rate_per_quarter_hour: 4 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Owner Visitor", visit_date: "2026-09-20", entry_quarter_hour: 2 }
              as: Public
              as_user_id: "visitor-o"
              captures: { pass_id: $.data.id }
            - call: "POST /campus/timed-entry-passes/${pass_id}/cancel"
              payload: {}
              as: Public
              as_user_id: "visitor-o"
          trigger:
            - call: "POST /campus/timed-entry-passes/${pass_id}/cancel"
              payload: {}
              as: SecurityScreener
              captures: { err: $.data.error_id }
          assert:
            - "rejected with err == ERR_UNAUTHORIZED_ROLE (http 403) although the pass is also in a non-cancellable state"
            - "TimedEntryPass.${pass_id}.status remains CANCELLED"

      - name: review_kind_field_pairing_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "review_kind drives conditional required/nullable pairing: ACQUISITION carrying object_id, or DEACCESSION carrying fund_id, is a 400 ERR_INVALID_REQUEST even though every individual field exists in the schema."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One object and one TRUST fund exist."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0020", title: "Pairing Object", declared_value_cents: 1000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-PAIR", fund_type: "TRUST", appropriation_cents: 1000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "ACQUISITION", object_id: "${obj_id}", fund_id: "${fund_id}", proposed_object_title: "Should Not Pair", estimated_cost_cents: 1000 }
              as: Curator
              as_user_id: "cur-p"
              captures: { err1: $.data.error_id }
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "DEACCESSION", object_id: "${obj_id}", fund_id: "${fund_id}", disposal_method: "TRANSFER" }
              as: Curator
              as_user_id: "cur-p"
              captures: { err2: $.data.error_id }
          assert:
            - "ACQUISITION with object_id set fails err1 == ERR_INVALID_REQUEST (400)"
            - "DEACCESSION with fund_id set fails err2 == ERR_INVALID_REQUEST (400)"

      - name: segregation_of_duties_same_user_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Segregation of duties is keyed on X-User-ID, not role: a CommitteeChair whose X-User-ID equals the review's submitted_by_user_id is rejected with 403 ERR_SEGREGATION_OF_DUTIES despite holding the correct role."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. TRUST fund; ACQUISITION review created and submitted by X-User-ID 'cur-6' (now SUBMITTED, version 2)."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-SOD", fund_type: "TRUST", appropriation_cents: 1000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "ACQUISITION", fund_id: "${fund_id}", proposed_object_title: "SoD Target", estimated_cost_cents: 1000 }
              as: Curator
              as_user_id: "cur-6"
              captures: { rev_id: $.data.id }
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-6"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "APPROVED", expected_review_version: "${rev_v}" }
              as: CommitteeChair
              as_user_id: "cur-6"
              captures: { err: $.data.error_id }
          assert:
            - "rejected with err == ERR_SEGREGATION_OF_DUTIES (http 403)"
            - "CollectionReview.${rev_id}.status remains SUBMITTED"
            - "the same decide by a DIFFERENT chair user would pass this gate (isolation of the SoD rule)"

      - name: review_decide_stale_version_rejected
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[review-decide-stale-version]
          - errors[ERR_STALE_REVIEW_VERSION]
        distinguishing_aspect: "OCC on CollectionReview: the submit bumped version 1 -> 2, so a decide carrying the pre-submit expected_review_version 1 is stale and loses with 412; two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. TRUST fund; ACQUISITION review created (version 1) and submitted (version 2)."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-OCC", fund_type: "TRUST", appropriation_cents: 1000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "ACQUISITION", fund_id: "${fund_id}", proposed_object_title: "OCC Target", estimated_cost_cents: 1000 }
              as: Curator
              as_user_id: "cur-8"
              captures: { rev_id: $.data.id, v_create: $.data.version }
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-8"
              captures: { v_submit: $.data.version }
          trigger:
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "APPROVED", expected_review_version: "${v_create}" }
              as: CommitteeChair
              as_user_id: "chair-8"
              captures: { err: $.data.error_id }
          assert:
            - "v_create == 1 and v_submit == 2 (submit bumped the version)"
            - "decide with expected_review_version 1 is rejected with err == ERR_STALE_REVIEW_VERSION (http 412)"
            - "CollectionReview.${rev_id}.status remains SUBMITTED"

      - name: loan_counter_stale_version_rejected
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[loan-negotiation-stale-version]
          - errors[ERR_STALE_LOAN_VERSION]
        distinguishing_aspect: "OCC on LoanAgreement: the borrower's counter advanced the loan to version 2, so the lender's counter carrying the stale expected_loan_version 1 is rejected with 412 — the version check is the whole rejection cause (roles and payload are otherwise valid)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Object; loan PROPOSED (version 1), then countered by BorrowerRep (COUNTERED, version 2)."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0021", title: "OCC Loan Object", declared_value_cents: 50000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "OCC Borrower", loan_start_date: "2026-10-01", loan_end_date: "2026-12-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_id: $.data.id, v1: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/counter"
              payload: { expected_loan_version: "${v1}", declared_value_cents: 51000000 }
              as: BorrowerRep
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /campus/loan-agreements/${loan_id}/counter"
              payload: { expected_loan_version: "${v1}", declared_value_cents: 52000000 }
              as: LoansOfficer
              captures: { err: $.data.error_id }
          assert:
            - "rejected with err == ERR_STALE_LOAN_VERSION (http 412): the loan is at version 2, the request carried 1"
            - "LoanAgreement.${loan_id}.declared_value_cents remains 51000000 and negotiated_round == 2 (the losing counter changed nothing)"

      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without the X-User-Role / X-User-ID headers fails 401 ERR_UNAUTHENTICATED before any role, existence, or business check — the harness omits both headers for this call."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /campus/museums"
              payload: { museum_code: "NOAUTH", display_name: "No Auth Museum", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 401 with err == ERR_UNAUTHENTICATED when the identity headers are omitted"
            - "no Museum row is created"

