# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Correspondent Banking & Respondent Due Diligence (task_2499)
#
# BREADTH index over the whole §1.1–§1.7 surface: per-endpoint validation
# corners, inclusive/exclusive boundary values, empty/singleton/max collections,
# referential-integrity failures, RBAC denials, malformed and type-wrong
# payloads, missing required fields, unknown enum members, duplicate /
# idempotency submissions, state-gate rejections from illegal source states,
# ordering / pagination / filter behaviour, and not-found paths.
#
# Conventions used by every test_recipe below:
#   * The first setup call always pins the logical clock, which reads
#     2026-08-01T00:00:00Z by default (see endpoints[POST /_clock/set_current_utc]).
#   * Opaque-role X-User-IDs are stable literals: u-analyst-1 / u-analyst-2
#     (ComplianceAnalyst), u-officer-1 (SanctionsOfficer), u-fig-1 / u-fig-2
#     (FIGRelationshipManager), u-committee-1 (CommitteeApprover),
#     u-admin-1 (PlatformAdmin). RespondentContact is entity_backed, so its
#     as_user_id is always the RespondentBank id (${r_id}).
#   * `as: Unauthenticated` appears in exactly one instance and denotes a request
#     sent with NO X-User-Role / X-User-ID headers at all (validation priority 1).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. ENTITIES
  # ===========================================================================
  - section: entities
    instances:

      - name: create_jurisdiction_profile_returns_201_with_computed_risk_points
        claim_type: creation
        grounds:
          - endpoints[POST /correspondent-banking/jurisdiction-profiles]
          - entities.JurisdictionProfile.fields.jurisdiction_risk_points
          - calculations.jurisdiction_risk_points
        distinguishing_aspect: "A jurisdiction created with basel_aml_index 4.00, PERMITTED sanctions, NONE fatf and secrecy_flag false gets jurisdiction_risk_points exactly 4.00 * 2.0 = 8.00 in the 201 response body."
        test_recipe:
          setup: ["Empty database; logical clock pinned at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { jp_de_id: $.data.id }
          assert:
            - "response.status == 201"
            - "JurisdictionProfile.${jp_de_id}.jurisdiction_risk_points == 8.00"
            - "JurisdictionProfile.${jp_de_id}.version == 1"
            - "response.data.id is a UUID with no type prefix"

      - name: create_jurisdiction_profile_omitted_optionals_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.JurisdictionProfile.fields.sanctions_status
          - entities.JurisdictionProfile.fields.fatf_listing
          - entities.JurisdictionProfile.fields.nested_correspondent_prohibited
          - entities.JurisdictionProfile.fields.max_permitted_risk_rating
        distinguishing_aspect: "Omitting every optional field yields sanctions_status PERMITTED, fatf_listing NONE, secrecy_flag false, nested_correspondent_prohibited false and max_permitted_risk_rating HIGH."
        test_recipe:
          setup: ["Empty database; logical clock pinned at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "FR", name: "France", basel_aml_index: 5.00, corridor_risk_weight: 1.20 }
              as: SanctionsOfficer
              as_user_id: "u-officer-1"
              captures: { jp_fr_id: $.data.id }
          assert:
            - "response.status == 201"
            - "JurisdictionProfile.${jp_fr_id}.sanctions_status == PERMITTED"
            - "JurisdictionProfile.${jp_fr_id}.fatf_listing == NONE"
            - "JurisdictionProfile.${jp_fr_id}.secrecy_flag == false"
            - "JurisdictionProfile.${jp_fr_id}.nested_correspondent_prohibited == false"
            - "JurisdictionProfile.${jp_fr_id}.max_permitted_risk_rating == HIGH"
            - "JurisdictionProfile.${jp_fr_id}.jurisdiction_risk_points == 10.00"

      - name: create_jurisdiction_profile_missing_corridor_risk_weight_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST_BODY]
          - endpoints[POST /correspondent-banking/jurisdiction-profiles]
        distinguishing_aspect: "corridor_risk_weight is a required input with no default, so omitting it returns 400 ERR_INVALID_REQUEST_BODY and no JurisdictionProfile row is created."
        test_recipe:
          setup: ["Empty database; logical clock pinned at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "IT", name: "Italy", basel_aml_index: 4.50 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST_BODY"
            - "GET /correspondent-banking/jurisdiction-profiles returns total_count == 0"

      - name: create_jurisdiction_profile_basel_index_above_ten_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_FIELD_OUT_OF_RANGE]
          - entities.JurisdictionProfile.fields.basel_aml_index
        distinguishing_aspect: "basel_aml_index 10.01 sits one hundredth above the declared [0.00, 10.00] domain and returns 400 ERR_FIELD_OUT_OF_RANGE."
        test_recipe:
          setup: ["Empty database; logical clock pinned at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "PA", name: "Panama", basel_aml_index: 10.01, corridor_risk_weight: 2.00 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_FIELD_OUT_OF_RANGE"

      - name: create_jurisdiction_profile_unknown_sanctions_status_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_ENUM_VALUE]
          - entities.JurisdictionProfile.fields.sanctions_status
        distinguishing_aspect: "sanctions_status EMBARGOED is outside {PERMITTED, RESTRICTED, COMPREHENSIVELY_SANCTIONED} and returns 400 ERR_INVALID_ENUM_VALUE, not ERR_FIELD_OUT_OF_RANGE."
        test_recipe:
          setup: ["Empty database; logical clock pinned at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "IR", name: "Iran", basel_aml_index: 8.00, corridor_risk_weight: 2.50, sanctions_status: "EMBARGOED" }
              as: SanctionsOfficer
              as_user_id: "u-officer-1"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_ENUM_VALUE"

      - name: get_jurisdiction_profile_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}]
          - entities.JurisdictionProfile.fields.corridor_risk_weight
        distinguishing_aspect: "A single-row GET echoes every stored input field plus the computed jurisdiction_risk_points 8.00 for the DE fixture."
        test_recipe:
          setup: ["One JurisdictionProfile DE with basel_aml_index 4.00 and corridor_risk_weight 1.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
              captures: { jp_de_id: $.data.id }
          trigger:
            - call: "GET /correspondent-banking/jurisdiction-profiles/${jp_de_id}"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "response.status == 200"
            - "response.data.jurisdiction_code == DE"
            - "response.data.corridor_risk_weight == 1.00"
            - "response.data.jurisdiction_risk_points == 8.00"
            - "response.response_type == object"

      - name: get_jurisdiction_profile_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_JURISDICTION_PROFILE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown jurisdictionProfileId returns 404 ERR_JURISDICTION_PROFILE_NOT_FOUND."
        test_recipe:
          setup: ["One JurisdictionProfile DE exists; the requested id belongs to no row."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
          trigger:
            - call: "GET /correspondent-banking/jurisdiction-profiles/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_JURISDICTION_PROFILE_NOT_FOUND"

      - name: list_jurisdiction_profiles_pagination_envelope_and_ordering
        claim_type: listing
        grounds:
          - endpoints[GET /correspondent-banking/jurisdiction-profiles]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three rows created in order DE, FR, US and limit=2 offset=0, the page holds exactly DE then FR (created_at ASC) with total_count 3 and has_more true."
        test_recipe:
          setup: ["Three JurisdictionProfile rows created in the order DE, FR, US."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "FR", name: "France", basel_aml_index: 5.00, corridor_risk_weight: 1.20 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "US", name: "United States", basel_aml_index: 3.00, corridor_risk_weight: 0.80 }
              as: PlatformAdmin
          trigger:
            - call: "GET /correspondent-banking/jurisdiction-profiles"
              payload: { limit: 2, offset: 0 }
              as: FIGRelationshipManager
              as_user_id: "u-fig-1"
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.data.total_count == 3"
            - "response.data.has_more == true"
            - "the returned rows are exactly [DE, FR] in that order"

      - name: list_jurisdiction_profiles_filter_by_sanctions_status_singleton
        claim_type: listing
        grounds:
          - endpoints[GET /correspondent-banking/jurisdiction-profiles]
          - entities.JurisdictionProfile.fields.sanctions_status
        distinguishing_aspect: "Filtering sanctions_status=RESTRICTED over three rows of which exactly one is RESTRICTED returns a singleton collection with total_count 1 and has_more false."
        test_recipe:
          setup: ["Three JurisdictionProfile rows: DE PERMITTED, TR RESTRICTED, KP COMPREHENSIVELY_SANCTIONED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "TR", name: "Turkiye", basel_aml_index: 6.00, corridor_risk_weight: 1.50, sanctions_status: "RESTRICTED" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "KP", name: "Korea DPR", basel_aml_index: 9.00, corridor_risk_weight: 2.50, sanctions_status: "COMPREHENSIVELY_SANCTIONED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /correspondent-banking/jurisdiction-profiles"
              payload: { sanctions_status: "RESTRICTED" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "response.status == 200"
            - "response.data.total_count == 1"
            - "response.data.has_more == false"
            - "the single returned row has jurisdiction_code == TR"

      - name: list_jurisdiction_profiles_empty_collection_returns_zero_total
        claim_type: listing
        grounds:
          - endpoints[GET /correspondent-banking/jurisdiction-profiles]
          - response_envelope.pagination_fields
        distinguishing_aspect: "On an empty database the list endpoint returns 200 with an empty data array, total_count 0 and has_more false rather than a 404."
        test_recipe:
          setup: ["Empty database; only the logical clock has been set."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /correspondent-banking/jurisdiction-profiles"
              payload: {}
              as: CommitteeApprover
              as_user_id: "u-committee-1"
          assert:
            - "response.status == 200"
            - "response.data.total_count == 0"
            - "response.data.has_more == false"
            - "the returned collection is empty"

      - name: create_respondent_returns_201_with_both_initial_dimensions
        claim_type: creation
        grounds:
          - endpoints[POST /correspondent-banking/respondents]
          - entities.RespondentBank.fields.dd_state
          - entities.RespondentBank.fields.payment_posture
          - entities.RespondentBank.fields.risk_rating
        distinguishing_aspect: "A newly onboarded respondent carries dd_state PROSPECT AND payment_posture BLOCKED — the two parallel dimensions are both initialised in the same 201 response — with risk_rating UNRATED and version 1."
        test_recipe:
          setup: ["One JurisdictionProfile DE (PERMITTED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              as_user_id: "u-fig-1"
              captures: { r_id: $.data.id }
          assert:
            - "response.status == 201"
            - "RespondentBank.${r_id}.dd_state == PROSPECT"
            - "RespondentBank.${r_id}.payment_posture == BLOCKED"
            - "RespondentBank.${r_id}.risk_rating == UNRATED"
            - "RespondentBank.${r_id}.version == 1"

      - name: create_respondent_omitted_optionals_take_unverified_defaults
        claim_type: defaults
        grounds:
          - entities.RespondentBank.fields.license_status
          - entities.RespondentBank.fields.regulator_standing
          - entities.RespondentBank.fields.nested_activity_permitted
          - entities.RespondentBank.fields.risk_assessment_variant
        distinguishing_aspect: "Omitting license_status, regulator_standing and nested_activity_permitted yields UNVERIFIED, UNVERIFIED and false, with risk_assessment_variant NONE and every computed counter at 0."
        test_recipe:
          setup: ["One JurisdictionProfile DE (PERMITTED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { r_id: $.data.id }
          assert:
            - "RespondentBank.${r_id}.license_status == UNVERIFIED"
            - "RespondentBank.${r_id}.regulator_standing == UNVERIFIED"
            - "RespondentBank.${r_id}.nested_activity_permitted == false"
            - "RespondentBank.${r_id}.risk_assessment_variant == NONE"
            - "RespondentBank.${r_id}.nested_exposure_units == 0"
            - "RespondentBank.${r_id}.unresponsive_strikes == 0"

      - name: create_respondent_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.RespondentBank.common_fields
          - entities.RespondentBank.fields.license_verified_at
          - entities.RespondentBank.fields.refresh_due_date
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted on create while the system-sourced license_verified_at, last_approved_at and refresh_due_date are all null before their producing transitions run."
        test_recipe:
          setup: ["One JurisdictionProfile DE (PERMITTED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              as_user_id: "u-fig-1"
              captures: { r_id: $.data.id }
          assert:
            - "RespondentBank.${r_id}.license_verified_at is null"
            - "RespondentBank.${r_id}.last_approved_at is null"
            - "RespondentBank.${r_id}.refresh_due_date is null"
            - "RespondentBank.${r_id}.created_at is an ISO-8601 UTC instant with three fractional digits"
            - "RespondentBank.${r_id}.version == 1"

      - name: create_respondent_unknown_home_jurisdiction_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=31]
          - errors[ERR_JURISDICTION_PROFILE_NOT_FOUND]
          - entities.RespondentBank.fields.home_jurisdiction_code
        distinguishing_aspect: "home_jurisdiction_code ZZ has no JurisdictionProfile, so the create fails 404 ERR_JURISDICTION_PROFILE_NOT_FOUND — the natural-key FK is validated even though it is not a path segment."
        test_recipe:
          setup: ["One JurisdictionProfile DE; no profile carries jurisdiction_code ZZ."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Ghost Bank", swift_bic: "GHSTZZ22", home_jurisdiction_code: "ZZ", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 100000.00, expected_monthly_count: 10 }
              as: FIGRelationshipManager
              as_user_id: "u-fig-1"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_JURISDICTION_PROFILE_NOT_FOUND"
            - "GET /correspondent-banking/respondents returns total_count == 0"

      - name: get_respondent_unknown_id_returns_respondent_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_RESPONDENT_NOT_FOUND]
        distinguishing_aspect: "An unknown respondentId on the single-row read returns 404 ERR_RESPONDENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database beyond the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /correspondent-banking/respondents/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_RESPONDENT_NOT_FOUND"

      - name: list_respondents_filter_by_dd_state_excludes_other_states
        claim_type: listing
        grounds:
          - endpoints[GET /correspondent-banking/respondents]
          - entities.RespondentBank.fields.dd_state
        distinguishing_aspect: "With one PROSPECT and one DD_IN_PROGRESS respondent, dd_state=DD_IN_PROGRESS returns exactly the verified respondent and total_count 1."
        test_recipe:
          setup: ["Two respondents under DE; the second has had a successful licensing verification so it sits in DD_IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_a_id: $.data.id }
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Südbank AG", swift_bic: "SUEDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 200000.00, expected_monthly_count: 40 }
              as: FIGRelationshipManager
              captures: { r_b_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_b_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "GET /correspondent-banking/respondents"
              payload: { dd_state: "DD_IN_PROGRESS" }
              as: CommitteeApprover
              as_user_id: "u-committee-1"
          assert:
            - "response.status == 200"
