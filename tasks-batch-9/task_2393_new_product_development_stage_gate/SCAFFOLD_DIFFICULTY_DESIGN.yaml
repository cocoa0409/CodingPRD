              as_user_id: "lead-pa"
              captures: { pa_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Fork Probe B", brand: "DairyBest", category: "DAIRY", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              as_user_id: "lead-pb"
              captures: { pb_id: $.data.id }
            - call: "POST /innovation-projects/${pa_id}/screen"
              payload: {}
              as: GateChair
              as_user_id: "chair-d"
            - call: "POST /innovation-projects/${pb_id}/screen"
              payload: {}
              as: GateChair
              as_user_id: "chair-d"
            - call: "POST /innovation-projects/${pa_id}/gate-reviews"
              payload: { gate_id: "${g2d_id}", scheduled_at: "2026-08-05T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-d"
              captures: { gr_a_id: $.data.id }
            - call: "POST /gate-reviews/${gr_a_id}/open"
              payload: {}
              as: GateChair
              as_user_id: "chair-d"
            - call: "POST /gate-reviews/${gr_a_id}/votes"
              payload: { function: "FINANCE", vote: "REJECT", rationale: "Margin thesis unproven" }
              as: FunctionalReviewer
              as_user_id: "rev-fin"
            - call: "POST /gate-reviews/${gr_a_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE" }
              as: FunctionalReviewer
              as_user_id: "rev-ops"
            - call: "POST /gate-reviews/${gr_a_id}/close"
              payload: {}
              as: GateChair
              as_user_id: "chair-d"
            - call: "POST /innovation-projects/${pb_id}/gate-reviews"
              payload: { gate_id: "${g2d_id}", scheduled_at: "2026-08-05T11:00:00Z" }
              as: GateChair
              as_user_id: "chair-d"
              captures: { gr_b_id: $.data.id }
            - call: "POST /gate-reviews/${gr_b_id}/open"
              payload: {}
              as: GateChair
              as_user_id: "chair-d"
            - call: "POST /gate-reviews/${gr_b_id}/votes"
              payload: { function: "MARKETING", vote: "REJECT", rationale: "Positioning needs rework" }
              as: FunctionalReviewer
              as_user_id: "rev-mkt"
            - call: "POST /gate-reviews/${gr_b_id}/votes"
