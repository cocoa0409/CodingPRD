  - rule_id: cross_entity_state_dependency
    instances:
      - name: cut_list_release_requires_current_sealed_design
        grounds:
          - validations[priority=20]
          - state_machines.CutList.EXPLODED_to_RELEASED
        distinguishing_aspect: |
          Pair CutList -> ComponentDesign: release of cl1 is rejected once a newer
          SEALED revision of the same component_ref exists, even though cl1's own
          design is still SEALED; a fresh cut list exploded from the current revision
          releases fine. Dependency is on SIBLING revision state, not own state.
        test_recipe:
          setup:
            - "Design TR-01 r1 SEALED; cl1 exploded from r1; revision r2 sealed afterwards (r1 still SEALED but no longer current)"
