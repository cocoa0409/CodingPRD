            - call: "POST /observations/${obs2_id}/rubric-scores"
              payload: { domain_code: "INSTRUCTION", raw_score: 3, expected_observation_version: "${o2v2}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o2v3: $.data.observation_version_after }
            - call: "POST /observations/${obs2_id}/rubric-scores"
              payload: { domain_code: "PROFESSIONALISM", raw_score: 3, expected_observation_version: "${o2v3}" }
