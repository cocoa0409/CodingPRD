  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: batch_reject_to_source_suspension_blocks_new_batch
        grounds:
          - state_machines.TransactionBatch.RECEIVED_to_REJECTED
          - state_machines.Source.ACTIVE_to_SUSPENDED
          - entities.Source.fields.consecutive_rejections
        distinguishing_aspect: |
          Depth-3 cascade: batch reject (entity A) increments
          source.consecutive_rejections (entity B); the counter reaching 5
          itself flips source.status to SUSPENDED (entity B's own transition);
          the SUSPENDED status in turn rejects the next batch submission
          (entity C, a new TransactionBatch) with ERR_INVALID_STATE. Each link
          is caused by the previous link, not by the original reject call.
        test_recipe:
          setup:
            - "Source src_tc1 (DEALER, region EAST) ACTIVE with consecutive_rejections == 4 after four rejected batches; configuration cfg_tc1 exists"
          setup_api_calls:
