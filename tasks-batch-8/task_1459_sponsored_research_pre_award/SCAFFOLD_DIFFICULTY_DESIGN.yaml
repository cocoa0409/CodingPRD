              captures: { s1_rate: $.data.applied_rate_pct, s1_selected: $.data.selected_rate_pct, s1_indirect: $.data.total_indirect_cents }
          trigger:
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "OFF_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2027-01-01", effective_end_on: "2029-01-01", initial_status: "FINAL" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_c1}", pi_id: "${pi_id}", title: "CapExact", activity_code: "RESEARCH_OFF_CAMPUS", project_start_on: "2027-02-01", project_end_on: "2028-01-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
