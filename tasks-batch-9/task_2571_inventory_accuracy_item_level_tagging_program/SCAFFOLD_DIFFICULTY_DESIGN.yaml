            - "response data.vendor_credit_cents != 20500 and data.net_chargeback_cents != 184500 — those are the net-keyed forbidden answers"
            - "response data.lifetime_chargeback_gross_cents == 205000 and data.credited_cents == 10250 and data.chargeback_balance_cents == 194750"
