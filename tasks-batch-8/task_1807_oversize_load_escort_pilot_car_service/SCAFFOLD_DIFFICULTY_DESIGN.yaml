            - { call: "GET /jobs/${job_a}/legs", payload: {}, as: Dispatcher, captures: { leg_a: "$.data[0].id" } }
            - { call: "POST /jobs/${job_a}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_a}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_a}/permits", payload: { permit_number: "TX-P-6", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_a: $.data.id } }
            - { call: "POST /permits/${permit_a}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_a}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_a: $.data.id } }
            - { call: "POST /assignments/${asg_a}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
