      - name: property_status_derives_from_its_first_contract_activation
        claim_type: compound
        grounds:
          - state_machines.Property.ONBOARDING_to_ACTIVE
          - entities.Property.fields.status
          - entities.Property.fields.active_contract_id
        distinguishing_aspect: "Property status is derived, never set directly: it stays ONBOARDING while the contract is DRAFT and flips to ACTIVE with active_contract_id populated in the same request that activates the contract."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 with one DRAFT contract"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "GET /valet/properties/${prop_id}"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /valet/properties/${prop_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the setup GET shows Property.${prop_id}.status == 'ONBOARDING' and active_contract_id == null while the contract is DRAFT"
            - "the trigger GET shows Property.${prop_id}.status == 'ACTIVE' and active_contract_id == '${contract_id}'"
            - "ServiceContract.${contract_id}.status == 'ACTIVE' and Property.${prop_id}.escalation_level == 0"

