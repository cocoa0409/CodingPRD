      - name: wash_batch_direct_overlap_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_WASHER_WINDOW_CONFLICT]"]
        distinguishing_aspect: "A genuinely overlapping window (09:30-10:30 vs existing 09:00-10:00) on the same washer is rejected with ERR_WASHER_WINDOW_CONFLICT — distinct from the purge-buffer error exercised in §1.8."
        test_recipe:
          setup: ["Plant with one SCHEDULED batch on WASHER_A 09:00-10:00"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM22" }, as: PlantAdmin, captures: { plant: $.data.id } }
