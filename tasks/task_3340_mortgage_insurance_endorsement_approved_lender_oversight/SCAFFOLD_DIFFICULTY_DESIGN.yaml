              as: FhaReviewer
              as_user_id: "rev-alpha"
            - *d1_advance
            - *d1_approve
            - *c_case
            - *c_appraisal
            - *c_appraisal_accept
            - *c_submit
            - *c_endorse
            - *e_escrow
            - call: "POST /mi/loan-cases"
              payload: { lender_id: "${d1_lender_id}", borrower_reference: "BOR-INFLIGHT", base_loan_amount_cents: 15000000, appraised_value_cents: 18000000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 90000 }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d9_case2: $.data.id }
            - call: "POST /mi/loan-cases/${d9_case2}/submit-underwriting"
              payload: {}
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
          trigger:
            - call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "SUSPEND" }
              as: FhaApprover
              as_user_id: "appr-beta"
            - call: "GET /mi/loan-cases/${d9_case2}"
              payload: {}
              as: FhaApprover
              as_user_id: "appr-beta"
              captures: { d9_case2_status: $.data.status }
            - call: "GET /mi/loan-cases/${c_case_id}/repair-escrows"
              payload: {}
              as: FhaApprover
              as_user_id: "appr-beta"
              captures: { d9_escrow_status: "$.data[0].status" }
            - call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "REINSTATE" }
              as: FhaApprover
              as_user_id: "appr-beta"
            - call: "GET /mi/loan-cases/${d9_case2}"
              payload: {}
              as: FhaApprover
              as_user_id: "appr-beta"
              captures: { d9_case2_status_after: $.data.status }
          assert:
            - "captured ${d9_case2_status} == BLOCKED (hop 1)"
            - "captured ${d9_escrow_status} == OPEN (escrow of the ENDORSED case untouched: cascade hop 2 only follows hop 1)"
            - "captured ${d9_case2_status_after} == UNDERWRITE_SUBMITTED (reinstate reversal)"
            - "endorsement-review on the BLOCKED case would be rejected ERR_CASE_BLOCKED while suspended"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_error_beats_fiscal_error
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NET_WORTH_DEFICIENT]
        distinguishing_aspect: "state (priority 7) vs business_fiscal (priority 12) pair: an APPROVE on a lender still in RETURNED whose net worth is ALSO deficient must surface ERR_INVALID_STATE, not ERR_NET_WORTH_DEFICIENT — the fiscal floor is never evaluated from a non-approvable state."
        test_recipe:
          setup:
            - "Lender in RETURNED (advanced then returned)."
            - "ACCEPTED filing with adjusted net worth 40000000 — below the 100000000 STANDARD floor (fiscal violation co-present)."
            - "qc_plan_on_file true; filing FYE 2026-06-30 (fresh)."
          setup_api_calls:
            - *d2_clock
            - *d1_lender
            - call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 60000000, total_liabilities_cents: 20000000, liquid_assets_cents: 9000000, expected_lender_version: "${d1_lender_v}" }
