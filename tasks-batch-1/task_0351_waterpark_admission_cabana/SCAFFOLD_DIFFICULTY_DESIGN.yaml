              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CABANA_OVERLAP (14:15 < prior_end 14:00 + 30min buffer)"

      - name: checkin_window_interval_half_open_at_end
        grounds:
          - state_machines.Admission.CONFIRMED_to_CHECKED_IN
          - entities.EntryWindow.fields.ends_at
          - validations[priority=9]
        distinguishing_aspect: |
          EntryWindow interval semantics differ from cabana: the check-in clock
          must fall in the half-open [starts_at, ends_at) with NO buffer — a
          clock exactly at ends_at is REJECTED (exclusive end), distinct from
          the buffer-expanded cabana geometry. Different resource entity and
          different interval treatment.
        test_recipe:
          setup:
            - "A CONFIRMED admission on a window 09:00-17:00; clock set to exactly 17:00:00Z (window end)."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Edge Park", total_gate_capacity: 1000, resident_zip_prefixes: [] }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: ParkManager
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Edge Guest", email: "edge@x.com", zip_code: "12121", height_cm: 160 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T17:00:00Z" }
              as: ParkManager
          trigger:
            - call: "POST /admissions/${adm_id}/check-in"
              payload: {}
              as: GateAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WINDOW_TIME_VIOLATION (clock == ends_at, exclusive end rejects)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_guest_wallet_minus_charge
        grounds:
          - state_machines.Order.payment_status=PAID_to_payment_status=REFUNDED_&_fulfillment_status=CANCELLED
          - calculations.quote_order
          - entities.Guest.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity = guest economic position (wallet_credit_cents +
          wallet_credit_used_cents - total_cents charged). Invariant: pay debits
          wallet_credit_used_cents (here 0) and charges total_cents 5000; the
          compensating refund credits total_cents 5000 back to the wallet, so the
          conserved sum is unchanged across the pay+refund pair. With wallet 0
          and total 5000, wallet_credit_cents ends at exactly 5000 — the pinned
          formula wallet_after == wallet_before + total_cents_refunded.
        test_recipe:
          setup:
            - "Guest wallet 0; a PAID day-ticket order, party_size 1, total 5000; admission CONFIRMED, none checked in."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Inv Park", total_gate_capacity: 1000, resident_zip_prefixes: [] }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: ParkManager
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Inv Guest", email: "inv@x.com", zip_code: "13131", height_cm: 160 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { total: $.data.total_cents }
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /orders/${order_id}/refund"
              payload: {}
              as: FinanceClerk
            - call: "GET /guests/${guest_id}"
              payload: {}
              as: FinanceClerk
              captures: { wallet_after: $.data.wallet_credit_cents }
          assert:
            - "Guest.${guest_id}.wallet_credit_cents == 5000 after refund (total_cents 5000 credited back)"
            - "Order.${order_id}.payment_status == REFUNDED"

      - name: rainout_settle_conserves_window_capacity_pool
        grounds:
          - state_machines.EntryWindow.OPEN_to_RAINED_OUT
          - state_machines.RainCheck.ISSUED_to_SETTLED
          - entities.EntryWindow.fields.reserved_count
        distinguishing_aspect: |
          Conserved quantity = EntryWindow capacity pool (reserved_count). A
          rain-out releases every held slot (forward action zeroes reserved_count)
          and the compensating rain-check settlement credits the guest wallet
          WITHOUT re-consuming the pool: reserved_count stays 0 after settle.
          Distinct conserved quantity (capacity slots) from the wallet invariant.
        test_recipe:
          setup:
            - "An OPEN window with one CONFIRMED admission (reserved_count 1); park weather RAINED_OUT; rain_check_value_cents 4000."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Pool Park", total_gate_capacity: 1000, resident_zip_prefixes: [], rain_check_value_cents: 4000 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: ParkManager
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Pool Guest", email: "pool@x.com", zip_code: "14141", height_cm: 160 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /parks/${park_id}/weather"
              payload: { weather_status: "RAINED_OUT" }
              as: ParkManager
            - call: "POST /entry-windows/${window_id}/rain-out"
              payload: {}
              as: ParkManager
            - call: "GET /rain-checks"
              payload: {}
              as: FinanceClerk
              captures: { rc_id: "$.data[0].id" }
          trigger:
            - call: "POST /rain-checks/${rc_id}/settle"
              payload: {}
              as: FinanceClerk
            - call: "GET /entry-windows/${window_id}"
              payload: {}
              as: ParkManager
              captures: { reserved_final: $.data.reserved_count }
          assert:
            - "EntryWindow.${window_id}.reserved_count == 0 both after rain-out and after settle (pool conserved, not re-consumed)"
            - "Guest.${guest_id}.wallet_credit_cents == 4000 after settle"
