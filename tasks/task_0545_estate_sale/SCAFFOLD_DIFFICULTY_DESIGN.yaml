            - "Lot.${lot_id}.status == SOLD"

      - name: temporal_beats_constraint_on_sale_event
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_CREW_DOUBLE_BOOKED]
        distinguishing_aspect: |
          A second sale-event on the same crew that both overlaps an existing window (temporal, priority 8)
          AND spans 6 days > max 4 (constraint, priority 9) is rejected with ERR_CREW_DOUBLE_BOOKED, not
          ERR_SALE_WINDOW_TOO_LONG — a different error-category pair than the state/fiscal conflict.
        test_recipe:
          setup:
            - "Crew booked by sale-event #1 over [2026-06-01T09:00, 2026-06-01T17:00)"
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Jo Owner", phone: "555-0199" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
