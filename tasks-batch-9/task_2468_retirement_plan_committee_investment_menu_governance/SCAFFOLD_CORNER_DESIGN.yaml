      - name: review_reopen_inverts_the_whole_breach_cascade_with_no_drift
        claim_type: Valid Transition
        grounds:
          - state_machines.QuarterlyReview.FINALIZED_to_REOPENED
          - endpoints.POST_/governance/quarterly-reviews/{reviewId}/reopen
          - calculations.menu_posture
        distinguishing_aspect: "Reopen is the compensating inverse of the four-hop finalize cascade and every hop must unwind: watch_status and menu_status come back from their *_before_last_review snapshots, consecutive_breach_quarters decrements to 0, both slots return to ACTIVE from status_before_last_review, the ratio falls 0.4000 -> 0.0000 so the posture relaxes RESTRICTED -> OPEN, the BLOCKED proposal is restored to exactly its pre_block_status DRAFT, and latest_composite_score reverts to null because no earlier FINALIZED review exists. reopen_count becomes 1 and finalized_at is cleared, but this is a cycle, not a rollback: the review is REOPENED, not DRAFT."
        test_recipe:
          setup:
            - "chain_breach is replayed and the trigger head finalizes quarter 0, leaving the plan RESTRICTED with two AT_RISK slots and one BLOCKED proposal."
          setup_api_calls: *chain_breach
          trigger:
            - *b_finalize_q0
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "The consultant restated the small cap and international expense inputs after finalize." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "the response status is 200"
            - "QuarterlyReview.${review_q0_id}.status == REOPENED with reopen_count == 1 and finalized_at null"
            - "Fund.${fund_small_id}.watch_status == CLEAR, consecutive_breach_quarters == 0 and latest_composite_score is null"
            - "Fund.${fund_intl_id}.watch_status == CLEAR, consecutive_breach_quarters == 0 and latest_composite_score is null"
            - "Fund.${fund_lc_a_id}.latest_composite_score is null too — every fund scored by the reopened quarter reverts, not just the breaching ones"
            - "AssetClassSlot.${slot_small_id}.status == ACTIVE and AssetClassSlot.${slot_intl_id}.status == ACTIVE"
            - "Plan.${plan_id}.at_risk_slot_ratio == 0.0000 and menu_posture == OPEN"
            - "FundReplacementProposal.${prop_small_id}.status == DRAFT with pre_block_status null and revision_round still 0"
            - "FundScorecard.${sc_small_breach_id}.status is still SUBMITTED with composite_score 40.00 — reopen reverts entity state, never the scorecards themselves"

      - name: reopening_a_review_two_quarters_stale_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.QuarterlyReview.FINALIZED_to_REOPENED
          - errors.ERR_QUARTER_CLOSED
          - endpoints.POST_/governance/plans/{planId}/advance-quarter
        distinguishing_aspect: "The reopen window is exactly one quarter wide: after one advance-quarter the difference Plan.fiscal_quarter_index - review.quarter_index is 1 and the reopen is still legal, after the second it is 2 and the call returns 409 ERR_QUARTER_CLOSED with the whole breach cascade left standing."
        test_recipe:
          setup:
            - "chain_breach is replayed, the trigger head finalizes quarter 0 and then advances the fiscal quarter twice, taking Plan.fiscal_quarter_index to 2."
          setup_api_calls: *chain_breach
          trigger:
            - *b_finalize_q0
            - call: "POST /governance/plans/${plan_id}/advance-quarter"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/plans/${plan_id}/advance-quarter"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "Late attempt to restate a quarter that has already closed twice over." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "the response status is 409 with data.error_id == ERR_QUARTER_CLOSED"
            - "QuarterlyReview.${review_q0_id}.status is still FINALIZED with reopen_count == 0"
            - "Plan.${plan_id}.fiscal_quarter_index == 2 and menu_posture is still RESTRICTED"
            - "Fund.${fund_small_id}.watch_status is still WATCH and AssetClassSlot.${slot_small_id} is still AT_RISK"
            - "FundReplacementProposal.${prop_small_id}.status is still BLOCKED with pre_block_status DRAFT"

      - name: the_revision_cycle_runs_three_laps_and_then_locks
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FundReplacementProposal.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.FundReplacementProposal.REVISION_REQUESTED_to_UNDER_REVIEW
          - errors.ERR_REVISION_LIMIT_REACHED
        distinguishing_aspect: "This is the cyclic shape of the proposal machine: UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW is traversable three times, revision_round counting 1, 2, 3, and the fourth request-revision returns 409 ERR_REVISION_LIMIT_REACHED per the transition guard revision_round < 3 and the endpoint description 'at most three times'. Each /revise re-checks the incoming fund against pinned_ips_id (never a newer IPS) and refreshes pinned_plan_version, so the pin moves while revision_round only ever climbs."
        test_recipe:
          setup:
            - "chain_l3 is replayed, then the trigger head drafts and submits the large-cap replacement so it sits in UNDER_REVIEW with revision_round 0."
            - "NOTE for the difficulty pipeline: §1.5 also says 'rejected once revision_round would reach 3', which would cap the loop at two laps; this recipe follows the §1.2 precondition revision_round < 3 plus the endpoint description."
          setup_api_calls: *chain_l3
          trigger:
            - *b_plan_v_read
            - *b_prop_lc
            - *b_prop_submit
            - call: "POST /governance/fund-replacements/${prop_lc_id}/request-revision"
              payload: { revision_note: "Add a five-year net-of-fee comparison against the incumbent." }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/revise"
              payload: { rationale: "Lap one: added the five-year net-of-fee comparison the committee asked for." }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/request-revision"
              payload: { revision_note: "Now show the revenue-sharing impact of the R6 share class." }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/revise"
              payload: { rationale: "Lap two: added the revenue-sharing impact table for the R6 share class." }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/request-revision"
              payload: { revision_note: "Third pass: reconcile the mapping strategy with the QDIA notice rules." }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/revise"
              payload: { rationale: "Lap three: reconciled the DIRECT_MAP strategy with the participant notice rules." }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/request-revision"
              payload: { revision_note: "Fourth pass requested after the limit is already spent." }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          assert:
            - "the first three request-revision calls return 200 with status REVISION_REQUESTED and revision_round 1, then 2, then 3"
            - "the three /revise calls return 200 with status UNDER_REVIEW and leave revision_round untouched at 1, 2 and 3 respectively"
            - "the fourth request-revision returns 409 with data.error_id == ERR_REVISION_LIMIT_REACHED"
            - "FundReplacementProposal.${prop_lc_id}.status is still UNDER_REVIEW with revision_round == 3"
            - "FundReplacementProposal.${prop_lc_id}.pinned_ips_id is still ${ips_a_id} and mapping_strategy is still DIRECT_MAP"
            - "AssetClassSlot.${slot_lc_id}.status is still ACTIVE — no revision lap touches the slot or the capacity triple"

      - name: retiring_a_slot_moves_only_the_menu_dimension_and_shrinks_the_ratio_denominator
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AssetClassSlot.ACTIVE_to_RETIRED
          - state_machines.Fund.menu_status
          - calculations.menu_posture
        distinguishing_aspect: "Fund carries two independent state dimensions and slot retirement proves it: the REMEDIATION international fund moves ACTIVE -> PENDING_REMOVAL on the menu dimension while its watch dimension stays REMEDIATION untouched and credit_accrual_status stays ACCRUING (only REMOVED closes it out). Retirement also removes the slot from the ratio denominator, so 2-of-5 AT_RISK becomes 1-of-4 = exactly 0.2500 and the posture stays RESTRICTED at the ladder boundary rather than relaxing."
        test_recipe:
          setup:
            - "chain_breach is replayed and the trigger head finalizes quarter 0 (two AT_RISK slots, posture RESTRICTED, ratio 0.4000)."
            - "The international slot carries no proposal, so the ERR_SLOT_HAS_OPEN_PROPOSAL guard does not fire."
          setup_api_calls: *chain_breach
          trigger:
            - *b_finalize_q0
            - call: "POST /governance/asset-class-slots/${slot_intl_id}/retire"
              payload: { reason: "Committee voted to consolidate international exposure into the target date suite." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "the response status is 200"
            - "AssetClassSlot.${slot_intl_id}.status == RETIRED with current_fund_id still ${fund_intl_id} (retained for audit)"
            - "Fund.${fund_intl_id}.menu_status == PENDING_REMOVAL while watch_status is still REMEDIATION and consecutive_breach_quarters is still 1"
            - "Fund.${fund_intl_id}.credit_accrual_status is still ACCRUING and qdia_flag is still false"
            - "Plan.${plan_id}.occupied_menu_slots == 4, reserved_menu_slots == 0 and available_menu_slots == 2"
            - "Plan.${plan_id}.at_risk_slot_ratio == 0.2500 (1 AT_RISK of 4 counted slots) and menu_posture is still RESTRICTED"
            - "FundReplacementProposal.${prop_small_id}.status is still BLOCKED — relaxing nothing leaves the block in place"

      - name: retiring_a_slot_with_a_blocked_proposal_on_it_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AssetClassSlot.ACTIVE_to_RETIRED
          - errors.ERR_SLOT_HAS_OPEN_PROPOSAL
        distinguishing_aspect: "BLOCKED counts as a live proposal for the retirement guard even though it is a system-imposed detour rather than a committee action, so retiring the small-cap slot returns 409 ERR_SLOT_HAS_OPEN_PROPOSAL and the capacity triple is untouched."
        test_recipe:
          setup:
            - "chain_breach is replayed and the trigger head finalizes quarter 0, which leaves prop_small BLOCKED on the small-cap slot."
          setup_api_calls: *chain_breach
          trigger:
            - *b_finalize_q0
            - call: "POST /governance/asset-class-slots/${slot_small_id}/retire"
              payload: { reason: "Attempt to retire a slot that still carries a blocked replacement proposal." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "the response status is 409 with data.error_id == ERR_SLOT_HAS_OPEN_PROPOSAL"
            - "AssetClassSlot.${slot_small_id}.status is still AT_RISK with current_fund_id ${fund_small_id}"
            - "Fund.${fund_small_id}.menu_status is still ACTIVE and watch_status is still WATCH"
            - "Plan.${plan_id}.occupied_menu_slots == 5 and available_menu_slots == 1"

      - name: the_training_branch_alone_can_never_activate_a_member
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CommitteeMember.TRAINING_ASSIGNED_to_ACTIVE
          - errors.ERR_FIDUCIARY_ACCEPTANCE_MISSING
          - endpoints.POST_/governance/committee-members/{memberId}/activate
        distinguishing_aspect: "The member machine is a fork-join and the scaffold declares the dead branch explicitly: a member sitting in TRAINING_ASSIGNED with every module complete still cannot activate, because acceptance_signed_at is null. The call returns 409 ERR_FIDUCIARY_ACCEPTANCE_MISSING and NOT ERR_TRAINING_NOT_CURRENT, which pins the precondition order inside the join."
        test_recipe:
          setup:
            - "One plan, one filled chair seat, one member in TRAINING_ASSIGNED whose FIDUCIARY_DUTIES module is COMPLETED at 92.00 and whose IPS_MECHANICS module is WAIVED, so only the acceptance branch is missing."
          setup_api_calls:
            - *b_clock
            - *b_plan
            - *b_seat_chair
            - *b_mem_chair
            - *b_tr_chair_duties
            - *b_tr_chair_done
            - *b_tr_chair_ips
          trigger:
            - call: "POST /governance/committee-members/${mem_chair_id}/activate"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "the response status is 409 with data.error_id == ERR_FIDUCIARY_ACCEPTANCE_MISSING"
            - "CommitteeMember.${mem_chair_id}.status is still TRAINING_ASSIGNED with acceptance_signed_at null"
            - "Plan.${plan_id}.documented_acceptance_count == 0"
            - "Plan.${plan_id}.menu_posture is still FROZEN (charter still DRAFT and no quorum of ACTIVE voting members)"
            - "signing the acceptance then repeating the activate returns 200 with status ACTIVE"

      - name: adjourning_a_meeting_withdraws_its_open_motions_and_closes_them_to_voting
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CommitteeMeeting.IN_SESSION_to_ADJOURNED
          - state_machines.Motion.OPEN_to_WITHDRAWN
          - errors.ERR_MEETING_NOT_IN_SESSION
        distinguishing_aspect: "Adjourning sweeps every still-OPEN motion to WITHDRAWN in created_at ASC order and stamps closed_at, while a motion already CARRIED in the same meeting is left alone — and because the sweep is driven by the meeting, a later /close on a withdrawn motion fails the IN_SESSION guard first with 409 ERR_MEETING_NOT_IN_SESSION rather than a terminal-state error."
        test_recipe:
          setup:
            - "chain_l2 is replayed (meeting 1 is already MINUTES_APPROVED and IPS-2026-A is ADOPTED), then the two funds LCGRA and BNDIX are registered so the motions have real WATCH_LIST_ACTION subjects."
            - "The trigger head opens a second meeting, moves two motions in it, closes the first as CARRIED and leaves the second OPEN."
          setup_api_calls:
            - *chain_l2
            - *b_fund_lc_a
            - *b_fund_bond_a
          trigger:
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-24", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet4_id: $.data.id }
            - call: "POST /governance/committee-meetings/${meet4_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet4_id}", subject_type: "WATCH_LIST_ACTION", subject_id: "${fund_lc_a_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
              captures: { motion_watch_id: $.data.id }
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet4_id}", subject_type: "WATCH_LIST_ACTION", subject_id: "${fund_bond_a_id}", tally_basis: "ELIGIBLE_VOTERS" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
              captures: { motion_open_id: $.data.id }
            - call: "POST /governance/motions/${motion_watch_id}/votes"
              payload: { member_id: "${mem_chair_id}", vote: "FOR" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions/${motion_watch_id}/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - call: "POST /governance/motions/${motion_watch_id}/votes"
              payload: { member_id: "${mem_hr_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_hr_id}"
            - call: "POST /governance/motions/${motion_watch_id}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/committee-meetings/${meet4_id}/adjourn"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions/${motion_open_id}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          assert:
            - "the final close returns 409 with data.error_id == ERR_MEETING_NOT_IN_SESSION"
            - "CommitteeMeeting.${meet4_id}.status == ADJOURNED with carried_motion_count == 1 and quorum_met == true"
            - "Motion.${motion_open_id}.status == WITHDRAWN with closed_at == 2026-08-01T00:00:00Z, support_pct null and every vote counter 0"
            - "Motion.${motion_watch_id}.status is still CARRIED and is untouched by the adjourn sweep"
            - "Motion.${motion_watch_id}.for_count == 3, against_count == 0, abstain_count == 0, recuse_count == 0 and eligible_voter_count == 3"
            - "Motion.${motion_watch_id}.support_pct == 100.0000 per calculations.motion_tally (for_count * 100 / denominator 3), which clears the carried_threshold_pct 0.6000 copied from the plan"

      - name: every_machine_starts_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.CommitteeMeeting.initial_state
          - state_machines.QuarterlyReview.initial_state
          - state_machines.AssetClassSlot.initial_state
          - state_machines.FeeLevelizationRun.initial_state
        distinguishing_aspect: "One sweep over four freshly created rows on a fully governed plan: a meeting opens SCHEDULED, a review opens DRAFT (never SCORING, even though the plan already has slots to score), a new slot opens EMPTY with current_fund_id null, and a levelization run opens DRAFT with its pool already snapshotted. None of the four can be steered into another state by the create payload."
        test_recipe:
          setup:
            - "chain_l3 is replayed; the plan has an ADOPTED charter and IPS, five seated slots and one spare capacity slot."
          setup_api_calls: *chain_l3
          trigger:
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-31", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet_init_id: $.data.id }
            - call: "POST /governance/quarterly-reviews"
              payload: { plan_id: "${plan_id}", quarter_index: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_init_id: $.data.id }
            - call: "POST /governance/asset-class-slots"
              payload: { plan_id: "${plan_id}", asset_class_code: "EMERGING_MKTS", designation: "SPECIALTY", slot_index: 6 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { slot_em_id: $.data.id }
            - call: "POST /governance/fee-levelization-runs"
              payload: { plan_id: "${plan_id}", quarter_index: 0, method: "PER_CAPITA", credit_pool_cents: 1000000, pool_fund_ids: ["${fund_lc_a_id}", "${fund_bond_a_id}"] }
              as: Recordkeeper
              as_user_id: "rk-1"
              captures: { run_pc_id: $.data.id }
          assert:
            - "all four calls return 201"
            - "CommitteeMeeting.${meet_init_id}.status == SCHEDULED with quorum_met false, carried_motion_count 0 and minutes_approved_at null"
            - "QuarterlyReview.${review_init_id}.status == DRAFT with scorecard_count 0, submitted_scorecard_count 0, watch_additions_count 0, reopen_count 0 and ips_id == ${ips_a_id}"
            - "QuarterlyReview.${review_init_id}.scoring_variant == TRAILING_PERIOD, copied from the pinned IPS"
            - "AssetClassSlot.${slot_em_id}.status == EMPTY with current_fund_id null, ips_id == ${ips_a_id} and at_risk_since_quarter_index null"
            - "FeeLevelizationRun.${run_pc_id}.status == DRAFT with approving_motion_id null"
            - "Plan.${plan_id}.occupied_menu_slots == 5 and available_menu_slots == 1 — creating an EMPTY slot reserves no capacity"

      - name: undeclared_transitions_are_refused_before_any_business_check_runs
        claim_type: Invalid Transitions
        grounds:
          - validations.priority_42
          - errors.ERR_INVALID_STATE_TRANSITION
          - state_machines.FundReplacementProposal
        distinguishing_aspect: "The state gate sits at priority 42, above every business precondition, so approving a proposal that is still DRAFT returns the generic 409 ERR_INVALID_STATE_TRANSITION and NOT ERR_MOTION_NOT_CARRIED — even though the supplied motion id is a fabricated one that would also fail the motion check. Priority 30 (existence) still runs first, which is why the motion id must be a live row for this ordering claim to be meaningful."
        test_recipe:
          setup:
            - "chain_l3 is replayed, then the trigger head drafts the large-cap replacement and leaves it in DRAFT (no /submit)."
            - "${motion_ips_id} is a real CARRIED motion from meeting 1, but its subject_type is IPS_ADOPTION, so it would fail the motion check at priority 60 if the state check did not fire first."
          setup_api_calls: *chain_l3
          trigger:
            - *b_plan_v_read
            - *b_prop_lc
            - call: "POST /governance/fund-replacements/${prop_lc_id}/approve"
              payload: { approving_motion_id: "${motion_ips_id}" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          assert:
            - "the response status is 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "FundReplacementProposal.${prop_lc_id}.status is still DRAFT with approving_motion_id null"
            - "AssetClassSlot.${slot_lc_id}.status is still ACTIVE and Plan.${plan_id}.reserved_menu_slots == 0"
            - "POST /governance/fund-replacements/${prop_lc_id}/execute and POST /governance/fund-replacements/${prop_lc_id}/notice-issue on the same DRAFT proposal each also return 409 ERR_INVALID_STATE_TRANSITION"
            - "POST /governance/fund-replacements/${prop_lc_id}/revise returns 409 ERR_INVALID_STATE_TRANSITION too, because REVISION_REQUESTED is the only legal source state for it"

  # ===========================================================================
  - section: calculations
    instances:

      - name: composite_score_decomposes_into_five_rounded_components_under_the_trailing_variant
        claim_type: Correct Result
        grounds:
          - calculations.fund_composite_score
          - endpoints.POST_/governance/fund-scorecards
          - entities.FundScorecard.performance_component
        distinguishing_aspect: "Every one of the five component fields must be individually correct before the weighted sum is believable, and the five funds of the quarter-0 review exercise five different arms of STEP 2 at once: LCGRA a positive 60/40 blended excess (+80 bps) with an above-median expense, BNDIX a below-median expense pinned at the 100.00 cap, SMLVX a negative excess, INTDX an exactly-zero excess giving performance_component exactly 50.00, and TIPSX a 36-quarter tenure hitting the manager cap at 100.00. The weights {performance 0.40, peer 0.20, expense 0.20, style 0.10, manager 0.10} sum to exactly 1.00, so a fund scoring 100.00 on all five arms would score exactly 100.00."
        test_recipe:
          setup:
            - "chain_l4: governed plan, ADOPTED IPS-2026-A (TRAILING_PERIOD, style floor 0.8000), five seated funds, quarter-0 review scored and finalized."
            - "Hand-computed expectations, per calculations.fund_composite_score with the IPS weights: LCGRA excess = round_half_up(0.6*100 + 0.4*50, 0) = 80 -> performance 58.00, peer 75.00, expense 90.00, style 100.00, manager 100.00 -> 0.40*58.00 + 0.20*75.00 + 0.20*90.00 + 0.10*100.00 + 0.10*100.00 = 76.20."
            - "BNDIX excess = round_half_up(0.6*50 + 0.4*20, 0) = 38 -> performance 53.80, peer 70.00, expense 100.00 (25 bps is BELOW the 30 bps peer median, and the max(0, ...) clamp stops the component from exceeding the 100.00 cap), style 100.00, manager 100.00 -> 75.52."
            - "SMLVX excess = round_half_up(0.6*(-100) + 0.4*(-120), 0) = -108 -> performance 39.20, peer 40.00, expense 90.00, style 100.00, manager 82.00 -> 15.68 + 8.00 + 18.00 + 10.00 + 8.20 = 59.88."
            - "INTDX excess = 0 exactly -> performance exactly 50.00, peer 60.00, expense 100.00, style 100.00, manager 100.00 -> 20.00 + 12.00 + 20.00 + 10.00 + 10.00 = 72.00."
            - "TIPSX excess = 0 -> performance 50.00, peer 50.00, expense 100.00, style 100.00, manager 100.00 (min(100.00, 40.00 + 36*3.0) caps at 100.00, it does not reach 148.00) -> 20.00 + 10.00 + 20.00 + 10.00 + 10.00 = 70.00."
          setup_api_calls: *chain_l4
          trigger:
            - call: "GET /governance/fund-scorecards?review_id=${review_q0_id}&limit=10&offset=0"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "the response status is 200 with total_count == 5 and every row status == SUBMITTED"
            - "FundScorecard.${sc_lc_id}: performance_component == 58.00, peer_component == 75.00, expense_component == 90.00, style_component == 100.00, manager_component == 100.00, composite_score == 76.20, watch_recommendation == NONE"
            - "FundScorecard.${sc_bond_id}: performance_component == 53.80, expense_component == 100.00 (never 110.00) and composite_score == 75.52"
            - "FundScorecard.${sc_small_id}: performance_component == 39.20, manager_component == 82.00 and composite_score == 59.88"
            - "FundScorecard.${sc_intl_id}: performance_component == 50.00 exactly and composite_score == 72.00"
            - "FundScorecard.${sc_tips_id}: manager_component == 100.00 (capped) and composite_score == 70.00"
            - "each row's composite_score equals 0.40*performance_component + 0.20*peer_component + 0.20*expense_component + 0.10*style_component + 0.10*manager_component to the cent"

      - name: components_are_rounded_before_weighting_and_the_weighted_sum_rounds_half_up_once
        claim_type: Precision
        grounds:
          - calculations.fund_composite_score
          - entities.InvestmentPolicyStatement.style_drift_r2_floor
          - calculations.watch_recommendation
        distinguishing_aspect: "STEP 3 pins a rounding order that a naive implementation gets wrong three different ways. The engineered scorecard produces a raw weighted sum of exactly 75.795: half-up to 2 dp is 75.80, truncation is 75.79, and truncating STEP 1's excess (74.6 -> 74 instead of 75) shifts the whole answer to 75.755/75.76. The only 3-decimal contribution comes from style_component 99.95, which is itself the smallest observable style step: one ten-thousandth of R-squared below the floor costs exactly 0.05 component points."
        test_recipe:
          setup:
            - "chain_l3: governed plan, ADOPTED IPS-2026-A with style_drift_r2_floor 0.8000, five seated funds; Plan.fiscal_quarter_index == 0 and no review yet."
            - "The trigger opens a quarter-0 review and submits ONE scorecard for the seated small-cap fund SMLVX with excess = 0.6*(891-800) + 0.4*(850-800) = 54.6 + 20.0 = 74.6, which rounds HALF_UP to 75 bps."
            - "Components: performance clamp(50.00 + 75/10.0) = 57.50; peer 100.00 - 26 = 74.00; expense 100.00 - max(0, 45-40)*2.0 = 90.00; style 100.00 - (0.8000 - 0.7999)*500.0 = 99.95; manager min(100.00, 40.00 + 20*3.0) = 100.00."
            - "Weighted: 0.40*57.50 + 0.20*74.00 + 0.20*90.00 + 0.10*99.95 + 0.10*100.00 = 23.000 + 14.800 + 18.000 + 9.995 + 10.000 = 75.795 -> 75.80."
          setup_api_calls: *chain_l3
          trigger:
            - call: "POST /governance/quarterly-reviews"
              payload: { plan_id: "${plan_id}", quarter_index: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_p_id: $.data.id, review_p_v0: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_p_id}", fund_id: "${fund_small_id}", expected_review_version: "${review_p_v0}", trailing_return_3y_bps: 891, trailing_return_5y_bps: 850, benchmark_return_3y_bps: 800, benchmark_return_5y_bps: 800, peer_rank_pct: 26, style_drift_r2: 0.7999, net_expense_ratio_bps: 45, peer_median_expense_bps: 40, manager_tenure_quarters: 20, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { sc_p_id: $.data.id }
          assert:
            - "the last response status is 201"
            - "FundScorecard.${sc_p_id}.performance_component == 57.50 — STEP 1 rounded 74.6 up to 75, so 57.40 (truncation) is wrong"
            - "FundScorecard.${sc_p_id}.style_component == 99.95 exactly, not 99.9 and not 100.00"
            - "FundScorecard.${sc_p_id}.composite_score == 75.80 — the single HALF_UP at the end; 75.79 (truncation) and 75.76 (truncated excess) are both wrong"
            - "FundScorecard.${sc_p_id}.watch_recommendation == WATCH — style_drift_r2 0.7999 < the 0.8000 floor is a breach on its own, so a composite of 75.80, far above watch_trigger_score_max 40.00, still recommends WATCH"
            - "Fund.${fund_small_id}.watch_status is still CLEAR and latest_composite_score is still null — the recommendation only lands on the fund at finalize"
            - "QuarterlyReview.${review_p_id}.status == SCORING with version == 1 and submitted_scorecard_count == 1"

      - name: ips_selection_criteria_pass_at_every_inclusive_boundary_and_fail_one_bp_past_the_cap
        claim_type: Constants Applied
        grounds:
          - calculations.ips_eligibility
          - validations.priority_55
          - endpoints.POST_/governance/asset-class-slots/{slotId}/seat-fund
          - errors.ERR_FUND_FAILS_IPS_CRITERIA
        distinguishing_aspect: "All four IPS criteria are simultaneously at their inclusive boundary on the fund that must be seated: track_record_quarters 12 == min_track_record_quarters, net_expense_ratio_bps 50 == floor(peer_median 40 * expense_peer_multiple 1.25), style_drift_r2 0.8000 == style_drift_r2_floor, and manager_change_flag false short-circuiting criterion (4). One basis point past the expense cap and one quarter short of the track record are each a 422, and the error must name the FIRST failing criterion in the declared order (1),(2),(3),(4) — the track-record failure is reported even though that same fund also breaches nothing else."
        test_recipe:
          setup:
            - "chain_l3, plus a sixth SPECIALTY large-cap slot (capacity is 6 and five slots are occupied, so exactly one seat-fund can still succeed)."
            - "Three US_LARGE_CAP candidates: CAPOK at every boundary, CAPNO one bp over the expense cap, TRKNO one quarter short of the 12-quarter track record."
          setup_api_calls: *chain_l3
          trigger:
            - call: "POST /governance/asset-class-slots"
              payload: { plan_id: "${plan_id}", asset_class_code: "US_LARGE_CAP", designation: "SPECIALTY", slot_index: 6 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { slot_ext_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "CAPOK", fund_name: "Boundary Large Cap Institutional", asset_class_code: "US_LARGE_CAP", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 50, net_expense_ratio_bps: 50, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 12, manager_tenure_quarters: 8, manager_change_flag: false, style_drift_r2: 0.8000, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_cap_ok_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "CAPNO", fund_name: "Overpriced Large Cap A", asset_class_code: "US_LARGE_CAP", share_class_code: "A", gross_expense_ratio_bps: 51, net_expense_ratio_bps: 51, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 12, manager_tenure_quarters: 8, manager_change_flag: false, style_drift_r2: 0.8000, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_cap_no_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TRKNO", fund_name: "Short Record Large Cap R6", asset_class_code: "US_LARGE_CAP", share_class_code: "R6", gross_expense_ratio_bps: 45, net_expense_ratio_bps: 45, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 11, manager_tenure_quarters: 8, manager_change_flag: false, style_drift_r2: 0.8000, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_trk_no_id: $.data.id }
            - call: "POST /governance/asset-class-slots/${slot_ext_id}/seat-fund"
              payload: { fund_id: "${fund_cap_no_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/asset-class-slots/${slot_ext_id}/seat-fund"
              payload: { fund_id: "${fund_trk_no_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/asset-class-slots/${slot_ext_id}/seat-fund"
              payload: { fund_id: "${fund_cap_ok_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "the CAPNO seat-fund returned 422 with data.error_id == ERR_FUND_FAILS_IPS_CRITERIA naming criterion (2), the expense cap"
            - "the TRKNO seat-fund returned 422 with data.error_id == ERR_FUND_FAILS_IPS_CRITERIA naming criterion (1), the track record"
            - "the CAPOK seat-fund returned 200 — 50 bps is inside the cap because floor(40 * 1.25) == 50 and the comparison is <="
            - "AssetClassSlot.${slot_ext_id}.status == ACTIVE with current_fund_id == ${fund_cap_ok_id} and ips_id == ${ips_a_id}"
            - "Fund.${fund_cap_ok_id}.menu_status == ACTIVE and credit_accrual_status == ACCRUING; Fund.${fund_cap_no_id} and Fund.${fund_trk_no_id} are both still CANDIDATE"
            - "Plan.${plan_id}.occupied_menu_slots == 6, available_menu_slots == 0 and menu_slot_capacity == 6 — the two rejected attempts consumed nothing"

      - name: watch_ladder_breach_and_remediation_thresholds_are_inclusive_to_the_cent
        claim_type: Constants Applied
        grounds:
          - calculations.watch_recommendation
          - entities.InvestmentPolicyStatement.watch_trigger_score_max
          - entities.FundScorecard.watch_recommendation
        distinguishing_aspect: "Four scorecards in one review straddle both rungs of the ladder from the CLEAR side, and the reachable step size is exactly 0.04 (one basis point of excess weighted at 0.40 * 0.1): 40.00 is a breach and 40.04 is not, 25.00 is remediation-grade and 25.04 is only watch-grade. Because the four component arms are 0.20/0.40-granular and the style arm cannot be nudged without itself becoming a breach, 40.01 and 25.01 are unreachable composites — 40.04 and 25.04 are the tightest non-breaching and non-remediation values the model can express. No fund has enough breach history to escalate, so every verdict here comes from rungs (b), (d) and (f)."
        test_recipe:
          setup:
