              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M", budget_cents: 100000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
          trigger:
            - call: "PUT /legal-departments/${dept_id}/matters/${matter_id}/forecast"
              payload: { lifecycle_estimate_cents: 1000000 }
              as: LegalOpsReviewer
              captures: { v1_var: $.data.variance_cents }
            - call: "PUT /legal-departments/${dept_id}/matters/${matter_id}/forecast"
              payload: { lifecycle_estimate_cents: 2000000 }
              as: LegalOpsReviewer
              captures: { v2_var: $.data.variance_cents, v2_est: $.data.lifecycle_estimate_cents }
          assert:
            - "v1_var == 1000000 (no billed, no wip)"
            - "v2_est == 2000000"
            - "v2_var == 2000000"

