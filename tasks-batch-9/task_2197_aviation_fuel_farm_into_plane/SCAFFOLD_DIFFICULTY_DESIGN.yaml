scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: receipt_governing_basis_truck_meter_vs_pipeline_gauge
        grounds:
          - calculations.receipt_net_volume_at_15c
          - entities.FuelReceipt.fields.governing_gross_liters
          - entities.FuelReceipt.fields.net_volume_liters
          - entities.FuelReceipt.fields.advisory_net_volume_liters
        distinguishing_aspect: |
          Two FuelReceipt rows carrying byte-identical measurement inputs differ only in delivery_mode,
          and the meter_ticket_basis variant writes net_volume_liters 29698.32 while the gauge_delta_basis
          variant writes 29580.00 for the same parcel — a 118.32 L divergence in the tank ledger.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T06:00:00Z"
            - "farm SFO with an ACTIVE permit covering the clock and one empty tank T1 (opening_volume_liters 0.0)"
            - "no receipts exist yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /fuel-farms"
              payload: { iata_code: "SFO", name: "SFO Fuel Consortium", hydrant_system_available: true, unpumpable_bottom_liters: 500.0 }
              as: ConsortiumAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/environmental-permits"
              payload: { permit_number: "P-2026-001", valid_from_utc: "2026-01-01T00:00:00Z", valid_until_utc: "2027-01-01T00:00:00Z", max_daily_throughput_liters: 400000.0, max_reportable_spill_liters: 20.0 }
              as: ConsortiumAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/storage-tanks"
              payload: { tank_code: "T1", capacity_liters: 5000000.0, safe_fill_liters: 4000000.0, density_kg_per_m3: 795.0, opening_volume_liters: 0.0 }
              as: ConsortiumAdmin
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /fuel-receipts"
              payload: { storage_tank_id: "${tank_id}", delivery_mode: "TRUCK", supplier_name: "Refinery One", meter_ticket_number: "MT-8001", meter_ticket_gross_liters: 30120.0, tank_opening_gauge_liters: 100.0, tank_closing_gauge_liters: 30100.0, temperature_c: 25.0, certificate_density_kg_per_m3: 795.0, measured_water_liters: 200.0 }
              as: FarmOperator
              captures: { r_truck_id: $.data.id }
            - call: "POST /fuel-receipts"
              payload: { storage_tank_id: "${tank_id}", delivery_mode: "PIPELINE", supplier_name: "Refinery One", meter_ticket_number: "MT-8002", meter_ticket_gross_liters: 30120.0, tank_opening_gauge_liters: 100.0, tank_closing_gauge_liters: 30100.0, temperature_c: 25.0, certificate_density_kg_per_m3: 795.0, measured_water_liters: 200.0 }
              as: FarmOperator
              captures: { r_pipe_id: $.data.id }
          assert:
            - "FuelReceipt.${r_truck_id}.governing_gross_liters == 30120.00"
            - "FuelReceipt.${r_truck_id}.net_volume_liters == 29698.32"
            - "FuelReceipt.${r_truck_id}.advisory_net_volume_liters == 29580.00"
            - "FuelReceipt.${r_pipe_id}.governing_gross_liters == 30000.00"
            - "FuelReceipt.${r_pipe_id}.net_volume_liters == 29580.00"
            - "FuelReceipt.${r_pipe_id}.advisory_net_volume_liters == 29698.32"
            - "StorageTank.${tank_id}.book_volume_liters == 0.00 (neither receipt is RELEASED yet)"

      - name: airline_exposure_accrual_basis_vs_invoiced_basis
        grounds:
          - calculations.airline_credit_exposure
          - entities.AirlineAccount.fields.accrual_exposure_cents
          - entities.AirlineAccount.fields.invoiced_exposure_cents
          - state_machines.FuelingOrder.FUELING_to_COMPLETED
        distinguishing_aspect: |
          For the same AirlineAccount at the same instant the accrual_basis variant returns 1433393 cents
          (one POSTED uplift, no invoice) while the invoiced_basis variant returns 0 cents, so the two
          variants of the same calculation disagree on an account that owes nothing invoiced.
        setup_note: "Dual-variant subject is AirlineAccount (credit risk), a different entity domain from the FuelReceipt volume accounting of the first instance."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T06:00:00Z"
            - "farm SFO with ACTIVE permit, tank T1 quality_status RELEASED with opening_volume_liters 1000000.0"
            - "airline account AA (CONTRACT_FUEL, base 62.00 cents/L, credit limit 100000000, not tax exempt)"
            - "one COMPLETED TRUCK order carrying a single POSTED uplift of exactly 20000.00 net liters"
            - "no invoice exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /fuel-farms"
              payload: { iata_code: "SFO", name: "SFO Fuel Consortium", hydrant_system_available: true, unpumpable_bottom_liters: 500.0 }
              as: ConsortiumAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/environmental-permits"
              payload: { permit_number: "P-2026-001", valid_from_utc: "2026-01-01T00:00:00Z", valid_until_utc: "2027-01-01T00:00:00Z", max_daily_throughput_liters: 400000.0, max_reportable_spill_liters: 20.0 }
              as: ConsortiumAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/storage-tanks"
              payload: { tank_code: "T1", capacity_liters: 5000000.0, safe_fill_liters: 4000000.0, density_kg_per_m3: 795.0, opening_volume_liters: 1000000.0 }
              as: ConsortiumAdmin
              captures: { tank_id: $.data.id }
            - call: "POST /storage-tanks/${tank_id}/samples"
              payload: { sample_purpose: "PERIODIC_TANK_QA" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { qa_sample_id: $.data.id }
            - call: "POST /quality-samples/${qa_sample_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.5, conductivity_ps_per_m: 120.0, observed_density_kg_per_m3: 795.0, flash_point_c: 42.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /storage-tanks/${tank_id}/quality-release"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-bob"
            - call: "POST /fuel-farms/${farm_id}/fueling-assets"
              payload: { asset_code: "TRK1", asset_type: "TRUCK", tank_capacity_liters: 40000.0, turnaround_buffer_minutes: 15, differential_pressure_kpa: 10.0 }
              as: ConsortiumAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /airline-accounts"
              payload: { airline_iata_code: "AA", legal_name: "Alpha Air", contract_type: "CONTRACT_FUEL", base_price_cents_per_liter: 62.00, credit_limit_cents: 100000000, tax_exempt: false }
              as: ConsortiumAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /flights"
              payload: { airline_account_id: "${acct_id}", flight_number: "AA100", tail_number: "N100AA", scheduled_departure_utc: "2026-08-10T08:00:00Z", stand_code: "A12" }
              as: AirlineRep
              as_user_id: "${acct_id}"
              captures: { flight_id: $.data.id }
            - call: "POST /fuel-authorizations"
              payload: { airline_account_id: "${acct_id}", flight_id: "${flight_id}", max_authorized_liters: 20000.0 }
              as: AirlineRep
              as_user_id: "${acct_id}"
              captures: { auth_id: $.data.id, auth_code: $.data.authorization_code }
            - call: "POST /fueling-orders"
              payload: { flight_id: "${flight_id}", fuel_authorization_id: "${auth_id}", storage_tank_id: "${tank_id}", delivery_mode: "TRUCK", requested_uplift_liters: 20000.0, window_start_utc: "2026-08-10T06:00:00Z", window_end_utc: "2026-08-10T07:30:00Z", quoted_authorization_code: "${auth_code}" }
              as: IntoPlaneAgent
              captures: { order_id: $.data.id }
            - call: "POST /fueling-orders/${order_id}/authorize"
              payload: {}
              as: IntoPlaneAgent
            - call: "POST /fueling-orders/${order_id}/assign"
              payload: { fueling_asset_id: "${truck_id}" }
              as: IntoPlaneAgent
            - call: "POST /fueling-orders/${order_id}/start"
              payload: {}
              as: IntoPlaneAgent
              captures: { order_v: $.data.version }
            - call: "POST /fueling-orders/${order_id}/uplift-records"
              payload: { ticket_number: "TK-0001", meter_start_liters: 0.0, meter_end_liters: 20000.0, temperature_c: 15.0, expected_fueling_order_version: "${order_v}" }
              as: IntoPlaneAgent
              captures: { uplift_id: $.data.id }
            - call: "POST /fueling-orders/${order_id}/complete"
              payload: {}
              as: IntoPlaneAgent
          trigger:
            - call: "GET /airline-accounts/${acct_id}"
              payload: {}
              as: BillingClerk
          assert:
            - "UpliftRecord.${uplift_id}.net_liters == 20000.00"
            - "UpliftRecord.${uplift_id}.billed_line_cents == 1433393"
            - "AirlineAccount.${acct_id}.accrual_exposure_cents == 1433393"
            - "AirlineAccount.${acct_id}.invoiced_exposure_cents == 0"
            - "FuelingOrder.${order_id}.status == COMPLETED"
            - "FuelAuthorization.${auth_id}.status == REDEEMED"

      - name: reconciliation_variance_throughput_basis_vs_opening_stock_basis
        grounds:
          - calculations.reconciliation_gain_loss
          - entities.ReconciliationRun.fields.variance_pct_throughput_basis
          - entities.ReconciliationRun.fields.variance_pct_opening_stock_basis
          - state_machines.ReconciliationRun.MEASURED_to_VARIANCE_HOLD
        distinguishing_aspect: |
          One measurement set yields variance_pct_throughput_basis 0.6003 (breaching the 0.50 tolerance and
          forcing VARIANCE_HOLD) while variance_pct_opening_stock_basis on the very same variance_liters of
          -298.32 reads 0.0298, so the choice of denominator alone decides whether the run needs an override.
        test_recipe:
          setup:
            - "farm SFO, ACTIVE permit, single tank T1 opening_volume_liters 1000000.0, quality_status RELEASED"
            - "exactly one RELEASED receipt of 29698.32 net liters and one POSTED uplift of 20000.00 net liters inside 2026-08-10"
            - "tank book_volume_liters is 1009698.32 and period throughput is 49698.32 liters"
            - "logical clock advanced to 2026-08-11T01:00:00Z so the period has elapsed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /fuel-farms"
              payload: { iata_code: "SFO", name: "SFO Fuel Consortium", hydrant_system_available: true, unpumpable_bottom_liters: 500.0 }
              as: ConsortiumAdmin
              captures: { farm_id: $.data.id }
