              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Student A", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_a_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_a_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "SELF", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_a_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_a_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_a_id}", move_id: "${move_a_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "SELF", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Youth confirms apple harvest work.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_a_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_a_id}", move_id: "${move_a_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_a_id: $.data.id }
            - call: "POST /mep/coes/${coe_a_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/students"
              payload: { full_name: "Student B", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_b_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_b_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-16", work_type: "AGRICULTURAL", worker_relationship: "SELF", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 800.00 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_b_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_b_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_b_id}", move_id: "${move_b_id}", interview_kind: "INITIAL", conducted_on: "2026-06-21", informant_relationship: "SELF", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Youth confirms pear harvest work.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_b_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_b_id}", move_id: "${move_b_id}", residency_date: "2026-07-02", qc_hold_exempt: false }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_b_id: $.data.id }
          trigger:
            - call: "POST /mep/qc-selections"
              payload: {}
              as: StateProgramAdmin
            - call: "POST /mep/coes/${coe_b_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/qc-selections"
              payload: {}
              as: StateProgramAdmin
              captures: { cand_n: $.data.candidate_count, target_n: $.data.target_n, sel_n: $.data.selected_count }
          assert:
            - "first selection run: HTTP 409 with data.error_id == ERR_NO_QC_CANDIDATES - the only SUBMITTED certificate ${coe_a_id} has qc_hold_exempt true, and ${coe_b_id} is still DRAFT"
            - "first selection run wrote nothing: CertificateOfEligibility.${coe_a_id}.status is still SUBMITTED and GET /mep/qc-reviews returns 0 rows"
            - "second selection run: HTTP 200 with data.candidate_count == 1, data.target_n == 1 (max(1, ceil(0.10 * 1))) and data.selected_count == 1"
            - "second selection run: data.selected_coe_ids == [${coe_b_id}] and CertificateOfEligibility.${coe_b_id}.status == QC_SELECTED"
            - "second selection run: CertificateOfEligibility.${coe_a_id}.status is still SUBMITTED - the exempt certificate never enters the pool no matter how many runs occur"
            - "the created QualityControlReview has selection_reason == SAMPLE_QUOTA, because CertificateOfEligibility.${coe_b_id}.risk_flag_count == 0"

      - name: corner_state_rule_outranks_temporal_rule_on_coe_patch
        claim_type: Priority Ordering
        grounds:
          - validations[priority 6 ERR_COE_NOT_IN_DRAFT]
          - validations[priority 18 ERR_RESIDENCY_DATE_BEFORE_MOVE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_priority_6_beats_business_temporal_priority_18_and_rejects_patch_of_approved_coe
          rationale: "That instance violates both rules in one PATCH and asserts the priority-6 state error is the one returned."

      - name: corner_safety_rule_outranks_referential_rule_on_qc_decision
        claim_type: Priority Ordering
        grounds:
          - validations[priority 8 ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 13 ERR_REINTERVIEW_STUDENT_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_safety_priority_8_beats_business_referential_priority_13_and_rejects_qc_decision
          rationale: "That instance violates both rules in one decide call and asserts the priority-8 segregation error wins."

      - name: corner_temporal_rule_outranks_fiscal_rule_on_assignment_create
        claim_type: Priority Ordering
        grounds:
          - validations[priority 19 ERR_PEAK_SEASON_NOT_COVERED]
          - validations[priority 29 ERR_AREA_COVERAGE_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_temporal_priority_19_beats_business_fiscal_priority_29_and_rejects_assignment
          rationale: "That instance violates both rules with one assignment payload and asserts the priority-19 error is returned."

      - name: corner_coe_submit_validity_depends_on_the_move_state
        claim_type: Cross-entity validation
        grounds:
          - validations[priority 11 ERR_MOVE_NOT_VERIFIED]
          - state_machines.QualifyingMove.RECORDED_to_VERIFIED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / coe_submit_is_blocked_until_the_referenced_move_is_verified
          rationale: "That instance tests the invalid side (move RECORDED) and the valid side (move VERIFIED) of the same submit call."

      - name: corner_plan_activation_validity_depends_on_the_student_state
        claim_type: Cascading validation
        grounds:
          - validations[priority 24 ERR_STUDENT_NOT_ELIGIBLE_FOR_SERVICES]
          - state_machines.Student.PENDING_DETERMINATION_to_ELIGIBLE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / plan_activation_is_blocked_until_the_student_reaches_an_eligible_status
          rationale: "That instance shows the eligibility check must resolve before the plan-state check can pass, and that approving the certificate is what unblocks it."

      - name: corner_individually_valid_assignments_breach_the_area_aggregate
        claim_type: Aggregate validation
        grounds:
          - validations[priority 29 ERR_AREA_COVERAGE_CAPACITY_EXCEEDED]
          - calculations.area_coverage_occupancy
        excluded_because:
          difficulty_instance: resource_temporal_overlap / area_occupancy_is_buffered_and_rejects_a_candidate_inside_the_handoff_window
          rationale: "That instance builds intervals that each pass the pairwise rule yet push the buffered day-by-day occupancy over recruiter_capacity."

  # =========================================================================
  - section: endpoints
    instances:

      - name: corner_area_patch_updates_only_the_supplied_fields_and_bumps_version
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /mep/areas]
          - endpoints[PATCH /mep/areas/{area_id}]
          - endpoints[GET /mep/areas/{area_id}]
          - entities.AgriculturalArea
        distinguishing_aspect: "PATCH /mep/areas/{area_id} is a partial update: supplying only recruiter_capacity and the two peak-season dates rewrites exactly those three fields, bumps version from 1 to 2, moves updated_at to the current logical clock while created_at stays at the create instant, and leaves name, state_code, primary_activity and status untouched - and the follow-up GET returns the same row."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea created with recruiter_capacity 3 and peak season 2026-06-01..2026-09-30"
            - "the clock then advanced to 2026-08-10T09:30:00Z so the update timestamp is distinguishable"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id, area_v1: $.data.version, created_at_1: $.data.created_at }
            - call: "POST /mep/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:30:00Z" }
              as: StateProgramAdmin
          trigger:
            - call: "PATCH /mep/areas/${area_id}"
              payload: { recruiter_capacity: 5, peak_season_start_date: "2026-05-15", peak_season_end_date: "2026-10-15" }
              as: StateProgramAdmin
              captures: { area_v2: $.data.version, cap_after: $.data.recruiter_capacity }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { got_v: $.data.version, got_cap: $.data.recruiter_capacity }
          assert:
            - "PATCH returns HTTP 200 and AgriculturalArea.${area_id}.recruiter_capacity == 5, peak_season_start_date == 2026-05-15, peak_season_end_date == 2026-10-15"
            - "AgriculturalArea.${area_id}.name is still 'Yakima Valley', state_code is still 'WA', primary_activity is still AGRICULTURE and status is still OPEN"
            - "AgriculturalArea.${area_id}.version == 2 (was ${area_v1} == 1) and assigned_primary_slots_used is still 0"
            - "AgriculturalArea.${area_id}.created_at is still ${created_at_1} == 2026-08-01T00:00:00Z while updated_at == 2026-08-10T09:30:00Z"
            - "the follow-up GET returns version 2, recruiter_capacity 5 and does not bump version again"

      - name: corner_pfs_assessment_read_matches_the_formula_and_writes_nothing
        claim_type: Computed read
        grounds:
          - endpoints[GET /mep/students/{student_id}/pfs-assessment]
          - calculations.pfs_priority_score
          - calculations.pfs_priority_score.constants
          - entities.Student.fields.pfs_variant
        distinguishing_aspect: "The assessment read exposes every component of the OSY_PATHWAY variant and they reconcile exactly: 0 move-band + 6 interruption + 0 academic + 20 credential + 10 language + 0 credit == raw_score 36, which is clamped up to the OSY_SCORE_FLOOR of 55 with floor_applied true - and the read leaves Student.version and updated_at untouched."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "one OUT_OF_SCHOOL Student with school_days_interrupted 5, has_hs_credential false, primary_language_not_english true, math_below_grade true, reading_below_grade true and credit_deficit 4 - the last three are deliberately set so the test proves the OSY variant ignores them"
            - "no QualifyingMove at all"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
