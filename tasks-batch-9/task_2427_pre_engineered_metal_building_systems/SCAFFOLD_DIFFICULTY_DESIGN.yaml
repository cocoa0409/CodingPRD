      - name: cancel_release_restores_builder_credit_cents_ledger
        grounds:
          - calculations.builder_credit_ledger
          - entities.Builder.fields.credit_used_cents
          - entities.Builder.fields.credit_available_cents
          - endpoints[POST /orders/{id}/cancel-release].side_effects
          - state_machines.Order.PROD_RELEASED_to_PROD_NOT_RELEASED
        distinguishing_aspect: |
          A different conserved quantity — cents on the Builder row, not pounds on the Order row — and a
          different compensation trigger. Release moved credit_used_cents by the negative FINAL delta of
          -261031; cancel-release must move it back by exactly +261031 so credit_used_cents returns to the
          post-acceptance 9719236 while credit_used_cents + credit_available_cents == credit_limit_cents
          holds at every step. Recomputing the ledger from the quote instead of reversing the stored delta
          happens to land on the same number here only if the delta was stored correctly.
