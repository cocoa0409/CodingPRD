  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_route_half_open_visit_overlap
        grounds:
          - validations[priority=10]
          - state_machines.ServiceVisit.REQUESTED_to_ROUTED
          - entities.ServiceVisit.fields.window_start_min
        distinguishing_aspect: |
          Half-open interval semantics on CrewRoute (no buffer): visit [540,600) and visit [600,660)
          are adjacent and BOTH route successfully (touching at the boundary is not overlap), while a
          visit [580,640) overlapping [540,600) is rejected with ERR_VISIT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Active plan with three requested visits on 2026-05-01: A[540,600), B[600,660) adjacent, C[580,640) overlapping A; an OPEN route for that date with A already routed."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner O8a", email: "o8a@x.com" }
              as: OperationsAdmin
              captures: { cust_o8a: $.data.id }
