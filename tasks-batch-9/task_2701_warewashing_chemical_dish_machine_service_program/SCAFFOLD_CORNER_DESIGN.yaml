              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C01", expected_agreement_version: "${agr_v}", initial_cycle_count: 100 }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Rico Vance", region_code: "NW", certification_level: "L2" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-01T00:00:00Z", cycle_count_total: 100, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20, source: "DEVICE" }
              as: PlatformAdmin
              captures: { d1: $.data.cycle_delta }
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-05T00:00:00Z", cycle_count_total: 400, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20, source: "DEVICE" }
              as: PlatformAdmin
              captures: { d2: $.data.cycle_delta }
