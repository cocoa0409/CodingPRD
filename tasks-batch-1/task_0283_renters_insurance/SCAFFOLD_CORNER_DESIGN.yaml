  # ===========================================================================
  - section: consistency_model
    instances:
      - name: derived_balance_visible_in_same_payment_response
        claim_type: immediate
        grounds: [entities.PremiumInvoice.fields.balance_due_cents, state_machines.PremiumInvoice.OPEN_to_PAID]
        distinguishing_aspect: "A partial payment of 10000 on a 33350 invoice immediately reflects balance_due_cents 23350 and paid_cents 10000 on the next GET (immediate consistency)."
        test_recipe:
          setup: ["An ACTIVE standard policy with an OPEN invoice of 33350."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "cm1@x.com", full_name: "CM One", mailing_address: "33 St" }
              as: Underwriter
              captures: { ph: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", insured_address: "65 St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000 }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { v1: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1}" }
              as: Underwriter
              captures: { v2: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${v2}" }
              as: Underwriter
            - call: "POST /policies/${pol}/issue"
              payload: {}
              as: Underwriter
            - call: "GET /premium-invoices?policy_id=${pol}"
              payload: {}
              as: Underwriter
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /premium-invoices/${inv}/payments"
              payload: { amount_cents: 10000, method: "CARD" }
              as: Policyholder
              as_user_id: "${ph}"
            - call: "GET /premium-invoices/${inv}"
              payload: {}
              as: Underwriter
              captures: { bal: $.data.balance_due_cents }
          assert:
            - "PremiumInvoice.${inv}.paid_cents == 10000"
            - "PremiumInvoice.${inv}.balance_due_cents == 23350"
            - "PremiumInvoice.${inv}.status == OPEN"
