          - entities.MusicianEngagement.fields.overtime_minutes
          - endpoints[POST /orchestra/rehearsals/{service_id}/clock]
        distinguishing_aspect: |
          Boundary on the WORKED-MINUTES metric, reached through the clock endpoint: 150
          worked minutes equals max_service_minutes and yields exactly 0 overtime minutes,
          while 151 yields 1 minute and 400 extra cents — the comparison is strictly greater
          than, not greater-or-equal.
