            - "${attempts0} == 0 on the DRAFT filing"
            - "${s1_status} == SUBMITTED, ${s1_attempts} == 1, ${s1_eng} == \"${eng_id}\""
            - "${r1_status} == REJECTED and ${r1_attempts} == 1 — a rejection does NOT refund the attempt"
            - "${e_no_reason} == ERR_INVALID_REQUEST with HTTP 422 — correction_reason is a required input of /resubmit, so priority 5 catches its absence"
            - "${s2_status} == SUBMITTED, ${s2_attempts} == 2, ${s2_reject_reason} == null — resubmit clears the previous rejection_reason"
